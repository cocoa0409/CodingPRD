scenario: |
  2263. Wet Lease and Charter Aircraft Operations (aircraft crew-maintenance-insurance lease operator): lease agreement structure specifying aircraft, crew, maintenance and insurance responsibilities and block-hour pricing, operational control determination and regulatory approval of the arrangement, crew qualification, training on lessee procedures and duty limit management, maintenance program alignment and reliability reporting to the lessee, minimum guaranteed hours, utilization shortfall and overrun billing, aircraft substitution rights and irregular operations recovery, insurance certificates, liability allocation and indemnities, lease termination, return conditions and repositioning

domain_name: wet-lease-charter-operations
api_prefix: /wetlease

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Every entity is a peer collection directly under /wetlease; all linkage is by
  # explicit foreign-key fields carried in request bodies, never by URL nesting.
  # The only nested read paths are the two reverse-reachability sub-resource GETs
  # for RegulatoryApproval and InsuranceCertificate.

  state_machine_shape: cyclic
  # LeaseAgreement (ACTIVE<->SUSPENDED, PENDING_REGULATORY_APPROVAL->DRAFT),
  # RegulatoryApproval (DENIED->UNDER_REVIEW), UtilizationPeriod
  # (SETTLED->DISPUTED->REOPENED->PENDING_SETTLEMENT->SETTLED),
  # CrewQualification (EXPIRED->TRAINING) all loop; AircraftSubstitution is a
  # branching fork (consent-required branch vs unilateral branch) with divergent
  # side-effect sets; FlightLeg carries two independent state dimensions
  # (status x billing_state) on the same row.

  relationship_patterns:
    - one_to_many          # LeaseAgreement -> FlightLeg / UtilizationPeriod / ReliabilityReport
    - many_to_many         # CrewMember <-> LeaseAgreement via CrewQualification
    - cross_aggregate      # FlightLeg.aircraft_id, SettlementInvoice.period_id + lease_id
    - polymorphic          # FlightLeg.leg_class drives which billing/reliability aggregate it feeds

  role_model: segregation_of_duties
  # BillingAdmin who prepared a SettlementInvoice may not approve it
  # (prepared_by_user_id != approved_by_user_id), enforced on X-User-ID.
  # Layered over peer ownership: Lessee consents to substitutions and reviews
  # reliability reports; RegulatoryAuthority alone rules on operational control;
  # InsuranceUnderwriter alone issues and revokes certificates.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Lessee
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the airline receiving lift under the wet lease.
      - name: icao_code
        type: string
        source: input
        description: Three-letter ICAO operator designator; unique across Lessee rows.
        constraints: "exactly 3 uppercase letters; unique"
      - name: home_base_icao
        type: string
        source: input
        description: Four-letter ICAO code of the lessee's home base aerodrome.
        constraints: "exactly 4 uppercase letters"
      - name: credit_limit_usd_cents
        type: integer
        source: input
        description: Maximum permitted outstanding_balance_usd_cents; a prepare that would breach it is rejected.
        constraints: ">= 0"
      - name: outstanding_balance_usd_cents
        type: integer
        source: computed
        description: "Conserved receivable: exactly the sum of SettlementInvoice.amount_cents over invoices whose status == ISSUED and whose lease belongs to this Lessee. See calculations.lessee_outstanding_balance."
        default: 0
      - name: status
        type: enum
        source: system
        description: Commercial standing of the lessee.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - name: tail_number
        type: string
        source: input
        description: Registration mark of the airframe; unique across all Aircraft rows.
        constraints: "unique; 5-7 chars"
      - name: type_designator
        type: string
        source: input
        description: ICAO type designator of the exact variant (e.g. B738, B38M, A320, A20N). Crew type ratings are held against THIS value, so two airframes in one family can require different ratings.
      - name: type_family
        type: string
        source: input
        description: Commercial type family the variant belongs to (e.g. B737, A320). Substitution eligibility is judged on type_family, NOT on type_designator - which is precisely why a lawful substitution can still strand a crew member rated only on the original variant.
      - name: seat_count
        type: integer
        source: input
        description: Certified passenger seat count, used by the substitution selector's ranking key.
        constraints: ">= 1"
      - name: mtow_kg
        type: integer
        source: input
        description: Maximum take-off weight in kilograms.
        constraints: ">= 1"
      - name: maintenance_program_ref
        type: string
        source: input
        description: Identifier of the continuous-airworthiness maintenance programme the airframe is enrolled in; must equal LeaseAgreement.required_maintenance_program_ref for assignment.
      - name: airframe_hours_total
        type: number
        source: input
        description: Cumulative airframe hours at registration time; incremented by completed FlightLeg block time thereafter.
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: hours_since_last_check
        type: number
        source: input
        description: Airframe hours flown since the last heavy check; substitution eligibility requires <= 400.
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: cycles_since_last_check
        type: integer
        source: input
        description: Flight cycles since the last heavy check; incremented by 1 per completed FlightLeg.
        default: 0
        constraints: ">= 0"
      - name: assigned_lease_id
        type: string
        source: system
        description: "FK -> LeaseAgreement.id; nullable. Non-null exactly while this airframe is the airframe of record for that lease."
        default: null
      - name: status
        type: enum
        source: system
        description: Airframe availability posture; gates dispatch and substitution eligibility.
        default: AVAILABLE
        constraints: "AVAILABLE | ASSIGNED | IN_MAINTENANCE | AOG | RETIRED"

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Crew member name as printed on the general declaration.
      - name: employee_no
        type: string
        source: input
        description: Lessor payroll number; unique across CrewMember rows.
        constraints: "unique"
      - name: crew_role
        type: enum
        source: input
        description: Seat the crew member occupies.
        constraints: "CAPTAIN | FIRST_OFFICER | CABIN"
      - name: type_ratings
        type: array
        source: input
        description: Array of ICAO type designators the crew member holds a current rating on.
        constraints: "non-empty array of strings"
      - name: rolling_duty_minutes_7d
        type: integer
        source: computed
        description: "Conserved duty budget: sum over this crew member's FlightLegs with status IN {SCHEDULED, DISPATCHED, COMPLETED} whose scheduled_out lies in the half-open window [clock_now - 168h, clock_now) of (scheduled block minutes + 105). See calculations.crew_duty_and_block_exposure."
        default: 0
      - name: rolling_block_minutes_28d
        type: integer
        source: computed
        description: "Sum of scheduled block minutes over this crew member's FlightLegs with status IN {SCHEDULED, DISPATCHED, COMPLETED} whose scheduled_out lies in [clock_now - 672h, clock_now)."
        default: 0
      - name: status
        type: enum
        source: system
        description: Employment/medical standing.
        default: ACTIVE
        constraints: "ACTIVE | GROUNDED | INACTIVE"

  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - name: lessee_id
        type: string
        source: input
        description: "FK -> Lessee.id; the airline receiving lift."
      - name: primary_aircraft_id
        type: string
        source: input
        description: "FK -> Aircraft.id; airframe of record. Re-pointed by an effectuated AircraftSubstitution."
      - name: term_start_date
        type: string
        source: input
        description: First calendar date (YYYY-MM-DD, UTC) of the lease term, inclusive.
        constraints: "YYYY-MM-DD"
      - name: term_end_date
        type: string
        source: input
        description: Last calendar date (YYYY-MM-DD, UTC) of the lease term, inclusive.
        constraints: "YYYY-MM-DD; >= term_start_date"
      - name: block_hour_rate_usd_cents
        type: integer
        source: input
        description: All-in ACMI rate per block hour, in cents.
        constraints: ">= 1"
      - name: min_guaranteed_block_hours_per_month
        type: number
        source: input
        description: Minimum guaranteed block hours per calendar month before proration.
        constraints: "> 0; 4 decimal places"
      - name: shortfall_credit_pct
        type: number
        source: input
        description: Fraction of the lessor-attributable shortfall value credited back to the lessee.
        constraints: "0 <= x <= 1; 4 decimal places"
      - name: crew_provided_by
        type: enum
        source: input
        description: Party furnishing flight and cabin crew.
        constraints: "LESSOR | LESSEE"
      - name: maintenance_provided_by
        type: enum
        source: input
        description: Party furnishing continuing airworthiness management and line maintenance.
        constraints: "LESSOR | LESSEE"
      - name: insurance_provided_by
        type: enum
        source: input
        description: Party furnishing hull and liability cover.
        constraints: "LESSOR | LESSEE"
      - name: operational_control
        type: enum
        source: input
        description: Declared holder of operational control; must be LESSOR whenever crew_provided_by and maintenance_provided_by are both LESSOR (an ACMI wet lease).
        constraints: "LESSOR | LESSEE"
      - name: substitution_rights
        type: enum
        source: input
        description: Whether the lessor may swap airframes unilaterally or must obtain lessee consent.
        constraints: "LESSOR_UNILATERAL | LESSEE_CONSENT_REQUIRED"
      - name: reliability_basis
        type: enum
        source: input
        description: Which technical-dispatch-reliability variant is contractually binding for this lease.
        constraints: "DEPARTURE | SCHEDULED"
      - name: required_maintenance_program_ref
        type: string
        source: input
        description: Maintenance programme the assigned airframe must be enrolled in.
      - name: return_hours_since_check_max
        type: number
        source: input
        description: Contractual ceiling on Aircraft.hours_since_last_check at redelivery.
        constraints: ">= 0"
      - name: return_cycles_since_check_max
        type: integer
        source: input
        description: Contractual ceiling on cycles since last check at redelivery.
        constraints: ">= 0"
      - name: return_fuel_kg_required
        type: integer
        source: input
        description: Fuel-on-board in kilograms required at redelivery.
        constraints: ">= 0"
      - name: return_liability_cap_cents
        type: integer
        source: input
        description: Cap on the redelivery discrepancy charge before the minimum-fee floor is applied.
        constraints: ">= 0"
      - name: return_deposit_cents
        type: integer
        source: input
        description: Maintenance reserve deposit held by the lessor; discrepancy cost is drawn from it first.
        constraints: ">= 0"
      - name: redelivery_icao
        type: string
        source: input
        description: Four-letter ICAO code where the airframe must be redelivered.
        constraints: "exactly 4 uppercase letters"
      - name: return_deposit_applied_cents
        type: integer
        source: computed
        description: "Portion of return_deposit_cents consumed by the redelivery discrepancy charge. Invariant: return_deposit_applied_cents + return_deposit_remaining_cents == return_deposit_cents at all times."
        default: 0
      - name: return_deposit_remaining_cents
        type: integer
        source: computed
        description: Unconsumed remainder of the maintenance reserve deposit.
        default: 0
      - name: lifetime_credited_block_minutes
        type: integer
        source: computed
        description: Sum of UtilizationPeriod.credited_block_minutes over every UtilizationPeriod of this lease whose status IN {PENDING_SETTLEMENT, SETTLED, DISPUTED, REOPENED}.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lease lifecycle state.
        default: DRAFT
        constraints: "DRAFT | PENDING_REGULATORY_APPROVAL | APPROVED | ACTIVE | SUSPENDED | TERMINATING | RETURNED | WITHDRAWN"
      - name: suspension_reason
        type: enum
        source: system
        description: Why the lease is currently SUSPENDED; null in every other state.
        default: null
        constraints: "null | INSURANCE_LAPSED | REGULATORY_APPROVAL_REVOKED | AIRFRAME_AOG"

  - name: RegulatoryApproval
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> LeaseAgreement.id; the arrangement whose operational-control determination this record holds."
      - name: authority_docket_no
        type: string
        source: input
        description: Docket number opened by the authority for this wet-lease application.
      - name: determination
        type: enum
        source: system
        description: Authority ruling on the arrangement.
        default: UNDER_REVIEW
        constraints: "UNDER_REVIEW | APPROVED | CONDITIONAL | DENIED | REVOKED"
      - name: conditions
        type: array
        source: input
        description: Array of condition codes attached to a CONDITIONAL determination; empty for every other determination.
        default: []
      - name: open_condition_codes
        type: array
        source: computed
        description: Condition codes from `conditions` not yet cleared; a CONDITIONAL determination may advance to APPROVED only when this array is empty.
        default: []
      - name: review_round
        type: integer
        source: computed
        description: Number of times this record has entered UNDER_REVIEW; incremented on every DENIED -> UNDER_REVIEW resubmission.
        default: 1
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent determination change; null while UNDER_REVIEW for the first round.
        default: null
      - name: expires_on
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) on which an APPROVED or CONDITIONAL determination lapses.
        default: null
      - name: revocation_reason
        type: string
        source: input
        description: Free-text reason recorded when the authority revokes the determination.
        default: null

  - name: InsuranceCertificate
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> LeaseAgreement.id; the lease this certificate evidences cover for."
      - name: certificate_no
        type: string
        source: input
        description: Broker certificate number; unique across InsuranceCertificate rows.
        constraints: "unique"
      - name: hull_limit_usd_cents
        type: integer
        source: input
        description: Agreed hull value in cents; must be >= 5000000000 (USD 50m).
        constraints: ">= 1"
      - name: liability_limit_usd_cents
        type: integer
        source: input
        description: Combined single limit for third-party and passenger liability in cents; must be >= 50000000000 (USD 500m).
        constraints: ">= 1"
      - name: breach_of_warranty_endorsed
        type: boolean
        source: input
        description: Whether an AVN67B-style breach-of-warranty endorsement in favour of the lessee is attached.
      - name: additional_insured_lessee
        type: boolean
        source: input
        description: Whether the lessee is named additional insured; must be true for dispatch to be lawful.
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start instant of cover.
      - name: expires_at
        type: datetime
        source: input
        description: Inclusive end instant of cover; the coverage interval is treated as CLOSED on both ends.
      - name: status
        type: enum
        source: system
        description: Certificate standing.
        default: ACTIVE
        constraints: "ACTIVE | EXPIRED | REVOKED | SUPERSEDED"
      - name: revocation_reason
        type: string
        source: input
        description: Free-text reason recorded when the underwriter revokes cover.
        default: null

  - name: CrewQualification
    parent: null
    common_fields: true
    fields:
      - name: crew_member_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the crew member being qualified."
      - name: lease_id
        type: string
        source: input
        description: "FK -> LeaseAgreement.id; the lease whose lessee procedures the crew member is trained on."
      - name: differences_training_completed_on
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the lessee-procedures differences course was completed.
        constraints: "YYYY-MM-DD"
      - name: checkride_valid_until
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the line check expires; null until the checkride is recorded.
        default: null
      - name: status
        type: enum
        source: system
        description: Qualification standing for this crew-member/lease pair.
        default: TRAINING
        constraints: "TRAINING | QUALIFIED | EXPIRED | REVOKED"

  - name: FlightLeg
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> LeaseAgreement.id; the lease this leg is flown under."
      - name: aircraft_id
        type: string
        source: input
        description: "FK -> Aircraft.id; airframe operating the leg. Defaults to LeaseAgreement.primary_aircraft_id when omitted; re-pointed by substitution effectuation."
      - name: captain_id
        type: string
        source: input
        description: "FK -> CrewMember.id; pilot in command."
      - name: first_officer_id
        type: string
        source: input
        description: "FK -> CrewMember.id; second in command."
      - name: origin_icao
        type: string
        source: input
        description: Four-letter ICAO departure aerodrome.
        constraints: "exactly 4 uppercase letters"
      - name: dest_icao
        type: string
        source: input
        description: Four-letter ICAO destination aerodrome.
        constraints: "exactly 4 uppercase letters"
      - name: leg_class
        type: enum
        source: input
        description: Commercial character of the leg; decides billability and reliability inclusion.
        constraints: "REVENUE | REPOSITIONING | MAINTENANCE_FERRY"
      - name: scheduled_out
        type: datetime
        source: input
        description: Scheduled off-blocks instant (UTC).
      - name: scheduled_in
        type: datetime
        source: input
        description: Scheduled on-blocks instant (UTC); must be strictly after scheduled_out.
      - name: actual_out
        type: datetime
        source: input
        description: Actual off-blocks instant recorded at dispatch; null while SCHEDULED.
        default: null
      - name: actual_in
        type: datetime
        source: input
        description: Actual on-blocks instant recorded at completion; null until COMPLETED.
        default: null
      - name: technical_delay_minutes
        type: integer
        source: input
        description: Minutes of departure delay attributable to a technical defect, recorded at completion.
        default: 0
        constraints: ">= 0"
      - name: cancelling_party
        type: enum
        source: input
        description: Party that cancelled the leg; null unless cancelled.
        default: null
        constraints: "null | LESSEE | LESSOR"
      - name: cancel_reason
        type: enum
        source: input
        description: Reason recorded at cancellation.
        default: null
        constraints: "null | TECHNICAL | COMMERCIAL | WEATHER | CREW | INSURANCE_LAPSE | REGULATORY"
      - name: scheduled_block_minutes
        type: integer
        source: computed
        description: Whole minutes between scheduled_out and scheduled_in.
        default: 0
      - name: block_minutes
        type: integer
        source: computed
        description: Whole minutes between actual_out and actual_in; 0 until COMPLETED.
        default: 0
      - name: billable_block_minutes
        type: integer
        source: computed
        description: Minutes charged for this leg after the minimum-billable floor and leg-class rule. See calculations.leg_billable_block_minutes.
        default: 0
      - name: status
        type: enum
        source: system
        description: "Operational state dimension of the leg; evolves independently of billing_state."
        default: SCHEDULED
        constraints: "SCHEDULED | DISPATCHED | COMPLETED | CANCELLED_LESSEE | CANCELLED_LESSOR | DIVERTED"
      - name: billing_state
        type: enum
        source: system
        description: "Financial state dimension of the same row; evolves independently of status."
        default: UNBILLED
        constraints: "UNBILLED | PROVISIONALLY_BILLED | FINALIZED | CREDITED"
      - name: crew_requalification_required
        type: boolean
        source: computed
        description: Set true when substitution effectuation re-points this leg to an airframe type the assigned captain is not rated on.
        default: false

  - name: AircraftSubstitution
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> LeaseAgreement.id; the lease whose airframe of record is being swapped."
      - name: original_aircraft_id
        type: string
        source: input
        description: "FK -> Aircraft.id; airframe being removed from the lease."
      - name: substitute_aircraft_id
        type: string
        source: input
        description: "FK -> Aircraft.id; nullable on request. When omitted the server selects it per calculations.substitute_aircraft_selection."
        default: null
      - name: reason
        type: enum
        source: input
        description: Trigger for the swap.
        constraints: "AOG | SCHEDULED_MAINTENANCE | IRREGULAR_OPS"
      - name: effective_from
        type: datetime
        source: input
        description: Instant from which the substitute airframe takes over; only legs with scheduled_out >= this instant are re-pointed.
      - name: selection_basis
        type: enum
        source: computed
        description: How substitute_aircraft_id was determined.
        default: null
        constraints: "null | CLIENT_SPECIFIED | SERVER_SELECTED"
      - name: seat_delta
        type: integer
        source: computed
        description: substitute_aircraft.seat_count minus original_aircraft.seat_count; recorded for the lessee's consent decision.
        default: 0
      - name: repointed_leg_count
        type: integer
        source: computed
        description: Number of FlightLegs re-pointed to the substitute airframe when the substitution became EFFECTIVE.
        default: 0
      - name: status
        type: enum
        source: system
        description: Substitution lifecycle state.
        default: REQUESTED
        constraints: "REQUESTED | LESSEE_CONSENT_PENDING | APPROVED | REJECTED | EFFECTIVE | WITHDRAWN"
      - name: consent_note
        type: string
        source: input
        description: Free-text note recorded with the lessee's consent decision.
        default: null

  - name: UtilizationPeriod
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> LeaseAgreement.id; the lease this monthly settlement window belongs to."
      - name: period_month
        type: string
        source: system
        description: Calendar month of the window in YYYY-MM form; unique per lease_id.
        constraints: "YYYY-MM; unique with lease_id"
      - name: mgh_effective_hours
        type: number
        source: computed
        description: Minimum guaranteed block hours prorated to the days of this month covered by the lease term. See calculations.monthly_utilization_charge.
        default: 0
      - name: credited_block_minutes
        type: integer
        source: computed
        description: Sum of the per-leg minute contributions included by the currently applicable variant.
        default: 0
      - name: credited_hours
        type: number
        source: computed
        description: Credited hours built by rounding each leg's minute contribution to 4 decimal hours FIRST and then summing (round-per-leg-then-sum).
        default: 0
      - name: shortfall_hours
        type: number
        source: computed
        description: max(0, mgh_effective_hours - credited_hours) under the FINAL variant; 0 when credited_hours >= mgh_effective_hours.
        default: 0
      - name: lessor_attributable_shortfall_hours
        type: number
        source: computed
        description: min(shortfall_hours, sum of scheduled_block_minutes over CANCELLED_LESSOR legs in the month / 60), rounded to 4 decimals.
        default: 0
      - name: overrun_hours
        type: number
        source: computed
        description: max(0, credited_hours - mgh_effective_hours).
        default: 0
      - name: base_charge_cents
        type: integer
        source: computed
        description: round_half_up(mgh_effective_hours * lease.block_hour_rate_usd_cents).
        default: 0
      - name: shortfall_credit_cents
        type: integer
        source: computed
        description: round_half_up(lessor_attributable_shortfall_hours * rate * lease.shortfall_credit_pct).
        default: 0
      - name: overrun_charge_cents
        type: integer
        source: computed
        description: Sum of the three per-tier overrun components, each rounded to whole cents before summation.
        default: 0
      - name: gross_charge_cents
        type: integer
        source: computed
        description: base_charge_cents - shortfall_credit_cents + overrun_charge_cents.
        default: 0
      - name: reliability_penalty_cents
        type: integer
        source: computed
        description: Reliability shortfall penalty keyed on gross_charge_cents. See calculations.reliability_shortfall_penalty.
        default: 0
      - name: provisional_charge_cents
        type: integer
        source: computed
        description: Net charge under the PROVISIONAL variant; recomputed on every leg mutation while the period is OPEN.
        default: 0
      - name: final_charge_cents
        type: integer
        source: computed
        description: Net charge under the FINAL variant; written when the period is closed and rewritten on reopen-and-reclose.
        default: 0
      - name: variant_applied
        type: enum
        source: computed
        description: Which variant last wrote credited_block_minutes / credited_hours / shortfall / overrun on this row.
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: dispute_reason
        type: string
        source: input
        description: Free-text reason recorded when the lessee disputes the settlement.
        default: null
      - name: disputed_amount_cents
        type: integer
        source: input
        description: Amount the lessee contests; must be > 0 and <= final_charge_cents.
        default: 0
      - name: status
        type: enum
        source: system
        description: Settlement window state.
        default: OPEN
        constraints: "OPEN | PENDING_SETTLEMENT | SETTLED | DISPUTED | REOPENED"

  - name: SettlementInvoice
    parent: null
    common_fields: true
    fields:
      - name: period_id
        type: string
        source: input
        description: "FK -> UtilizationPeriod.id; the settlement window being invoiced."
      - name: lease_id
        type: string
        source: system
        description: "FK -> LeaseAgreement.id; denormalised from the period for lessee-scoped queries."
      - name: variant
        type: enum
        source: input
        description: Which utilization-charge variant the invoice amount was drawn from.
        constraints: "PROVISIONAL | FINAL"
      - name: amount_cents
        type: integer
        source: computed
        description: UtilizationPeriod.provisional_charge_cents when variant == PROVISIONAL, else UtilizationPeriod.final_charge_cents, frozen at preparation time.
        default: 0
      - name: line_items
        type: array
        source: computed
        description: "Ordered array of {code, hours, cents} rows for BASE_GUARANTEE, SHORTFALL_CREDIT, OVERRUN_TIER1, OVERRUN_TIER2, OVERRUN_TIER3, RELIABILITY_PENALTY; components valued at 0 cents are still emitted."
        default: []
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the BillingAdmin that prepared the invoice.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the BillingAdmin that approved the invoice; must differ from prepared_by_user_id.
        default: null
      - name: due_on
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) payment falls due; recorded at issue.
        default: null
      - name: void_reason
        type: string
        source: input
        description: Free-text reason recorded when the invoice is voided.
        default: null
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle state.
        default: PREPARED
        constraints: "PREPARED | APPROVED | ISSUED | VOID"

  - name: ReliabilityReport
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: input
        description: "FK -> LeaseAgreement.id; the lease the report is rendered to."
      - name: aircraft_id
        type: string
        source: input
        description: "FK -> Aircraft.id; airframe whose technical dispatch performance is reported."
      - name: period_month
        type: string
        source: input
        description: Calendar month reported, YYYY-MM; unique per (lease_id, aircraft_id) among reports whose status != REJECTED.
        constraints: "YYYY-MM"
      - name: revenue_departures
        type: integer
        source: computed
        description: Count of REVENUE legs on (lease, aircraft, month) with status IN {DISPATCHED, COMPLETED}.
        default: 0
      - name: scheduled_revenue_legs
        type: integer
        source: computed
        description: Count of REVENUE legs on (lease, aircraft, month) with status IN {SCHEDULED, DISPATCHED, COMPLETED, CANCELLED_LESSOR}.
        default: 0
      - name: technical_delay_events
        type: integer
        source: computed
        description: Count of legs in scope whose technical_delay_minutes > 15.
        default: 0
      - name: technical_cancellations
        type: integer
        source: computed
        description: Count of legs in scope with status == CANCELLED_LESSOR and cancel_reason == TECHNICAL.
        default: 0
      - name: tdr_departure_basis_pct
        type: number
        source: computed
        description: Technical dispatch reliability under the DEPARTURE_BASIS variant, 2 decimals.
        default: 0
      - name: tdr_scheduled_basis_pct
        type: number
        source: computed
        description: Technical dispatch reliability under the SCHEDULED_BASIS variant, 2 decimals.
        default: 0
      - name: technical_dispatch_reliability_pct
        type: number
        source: computed
        description: The variant selected by LeaseAgreement.reliability_basis; this is the figure the penalty calculation consumes.
        default: 0
      - name: review_note
        type: string
        source: input
        description: Free-text note recorded with the lessee's review decision.
        default: null
      - name: status
        type: enum
        source: system
        description: Report standing.
        default: SUBMITTED
        constraints: "SUBMITTED | ACCEPTED | REJECTED"

  - name: ReturnCondition
    parent: null
    common_fields: true
    fields:
      - name: lease_id
        type: string
        source: system
        description: "FK -> LeaseAgreement.id; the terminating lease."
      - name: aircraft_id
        type: string
        source: system
        description: "FK -> Aircraft.id; airframe being redelivered (the lease's primary_aircraft_id at termination)."
      - name: repositioning_leg_id
        type: string
        source: input
        description: "FK -> FlightLeg.id; nullable. The ferry leg to redelivery_icao, required COMPLETED before closure."
        default: null
      - name: hours_since_check_at_return
        type: number
        source: input
        description: Airframe hours since last heavy check recorded at inspection.
        default: null
      - name: cycles_since_check_at_return
        type: integer
        source: input
        description: Cycles since last heavy check recorded at inspection.
        default: null
      - name: fuel_on_board_kg
        type: integer
        source: input
        description: Fuel on board in kilograms recorded at inspection.
        default: null
      - name: discrepancy_codes
        type: array
        source: input
        description: Array of ATA-style discrepancy codes noted at inspection; a non-empty array forces DISCREPANCIES_OPEN.
        default: []
      - name: discrepancy_cost_cents
        type: integer
        source: computed
        description: Capped and floored redelivery discrepancy charge. See calculations.return_discrepancy_cost.
        default: 0
      - name: billed_to_lessee_cents
        type: integer
        source: computed
        description: Portion of discrepancy_cost_cents remaining after the maintenance-reserve deposit waterfall.
        default: 0
      - name: status
        type: enum
        source: system
        description: Redelivery workflow state.
        default: PENDING_INSPECTION
        constraints: "PENDING_INSPECTION | DISCREPANCIES_OPEN | CLEARED | CLOSED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Lessee
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wetlease/lessees/{lesseeId}/suspend"
        actor: BillingAdmin
        preconditions:
          - "lessee.status == ACTIVE"
        side_effects:
          - "sets lessee.status = SUSPENDED, which blocks POST /wetlease/leases/{leaseId}/submit-for-approval, POST /wetlease/leases/{leaseId}/activate and POST /wetlease/flight-legs on every lease of this lessee (validations priority 28)"
          - "does NOT suspend or terminate any already-ACTIVE LeaseAgreement and does NOT cancel any already-SCHEDULED FlightLeg"
          - "increments Lessee.version by 1"
        note: "Credit-control action. Suspension is forward-looking only: flying already rostered continues, but no new lease may be submitted or activated and no new leg may be scheduled."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wetlease/lessees/{lesseeId}/reinstate"
        actor: BillingAdmin
        preconditions:
          - "lessee.status == SUSPENDED"
        side_effects:
          - "sets lessee.status = ACTIVE"
          - "increments Lessee.version by 1"
        note: "Second leg of the ACTIVE -> SUSPENDED -> ACTIVE credit-control cycle; neither leg touches outstanding_balance_usd_cents or credit_limit_usd_cents."

  - entity: LeaseAgreement
    initial_state: DRAFT
    terminal_states: [RETURNED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_REGULATORY_APPROVAL
        trigger: "POST /wetlease/leases/{leaseId}/submit-for-approval"
        actor: LessorOpsController
        preconditions:
          - "lease.status == DRAFT"
          - "lease.operational_control == LESSOR when lease.crew_provided_by == LESSOR AND lease.maintenance_provided_by == LESSOR"
          - "Lessee.status == ACTIVE for lease.lessee_id"
        side_effects:
          - "creates a RegulatoryApproval with lease_id == lease.id, determination = UNDER_REVIEW, review_round = 1, open_condition_codes = []"
          - "increments LeaseAgreement.version by 1"
      - from: PENDING_REGULATORY_APPROVAL
        to: APPROVED
        trigger: "system event: RegulatoryApproval.determination becomes APPROVED or CONDITIONAL via POST /wetlease/regulatory-approvals/{approvalId}/decision"
        actor: system
        preconditions:
          - "lease.status == PENDING_REGULATORY_APPROVAL"
        side_effects:
          - "sets RegulatoryApproval.decided_at = clock_now"
          - "increments LeaseAgreement.version by 1"
      - from: PENDING_REGULATORY_APPROVAL
        to: DRAFT
        trigger: "system event: RegulatoryApproval.determination becomes DENIED via POST /wetlease/regulatory-approvals/{approvalId}/decision"
        actor: system
        preconditions:
          - "lease.status == PENDING_REGULATORY_APPROVAL"
        side_effects:
          - "increments LeaseAgreement.version by 1"
        note: "Revision loop: the lease returns to DRAFT and may be resubmitted, which drives the same RegulatoryApproval row DENIED -> UNDER_REVIEW and increments its review_round."
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /wetlease/leases/{leaseId}/activate"
        actor: LessorOpsController
        preconditions:
          - "lease.status == APPROVED"
          - "the lease's RegulatoryApproval.determination IN {APPROVED, CONDITIONAL} AND (expires_on IS NULL OR expires_on >= date(clock_now))"
          - "at least one InsuranceCertificate on this lease with status == ACTIVE, additional_insured_lessee == true, breach_of_warranty_endorsed == true, hull_limit_usd_cents >= 5000000000, liability_limit_usd_cents >= 50000000000, and effective_from <= term_start_date 00:00:00Z <= expires_at"
          - "Aircraft(lease.primary_aircraft_id).maintenance_program_ref == lease.required_maintenance_program_ref"
          - "Aircraft(lease.primary_aircraft_id).status == AVAILABLE"
          - "Lessee.status == ACTIVE"
          - "at least one CrewQualification with lease_id == lease.id, status == QUALIFIED, and CrewMember.crew_role == CAPTAIN"
        side_effects:
          - "sets Aircraft(lease.primary_aircraft_id).status = ASSIGNED and assigned_lease_id = lease.id"
          - "sets lease.return_deposit_remaining_cents = lease.return_deposit_cents and lease.return_deposit_applied_cents = 0"
          - "creates a UtilizationPeriod for lease_id == lease.id, period_month == YYYY-MM of max(term_start_date, date(clock_now)), status = OPEN, with mgh_effective_hours from calculations.monthly_utilization_charge, and only when no UtilizationPeriod already exists for that (lease_id, period_month)"
          - "increments LeaseAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: the lease's last ACTIVE InsuranceCertificate leaves ACTIVE (POST /wetlease/insurance-certificates/{certificateId}/revoke), or RegulatoryApproval is revoked, or the assigned airframe is grounded AOG"
        actor: system
        preconditions:
          - "lease.status == ACTIVE"
        side_effects:
          - "sets lease.suspension_reason = INSURANCE_LAPSED | REGULATORY_APPROVAL_REVOKED | AIRFRAME_AOG according to the originating event"
          - "cancels every FlightLeg on this lease with status == SCHEDULED, setting status = CANCELLED_LESSOR, cancelling_party = LESSOR, cancel_reason = INSURANCE_LAPSE | REGULATORY | TECHNICAL to match suspension_reason"
          - "increments LeaseAgreement.version by 1"
        note: "Cascade hop 2 of the insurance-revocation chain; the leg cancellations it causes are hop 3, and their crew-exposure and period recomputes are hop 4."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: POST /wetlease/insurance-certificates creates an ACTIVE certificate covering clock_now while lease.suspension_reason == INSURANCE_LAPSED"
        actor: system
        preconditions:
          - "lease.status == SUSPENDED"
          - "lease.suspension_reason == INSURANCE_LAPSED"
          - "the new certificate satisfies additional_insured_lessee == true and effective_from <= clock_now <= expires_at"
        side_effects:
          - "sets lease.suspension_reason = null"
          - "increments LeaseAgreement.version by 1"
        note: "Cyclic: ACTIVE -> SUSPENDED -> ACTIVE. Already-cancelled legs are NOT restored."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wetlease/leases/{leaseId}/activate while lease.suspension_reason == AIRFRAME_AOG"
        actor: LessorOpsController
        preconditions:
          - "lease.status == SUSPENDED"
          - "lease.suspension_reason == AIRFRAME_AOG"
          - "Aircraft(lease.primary_aircraft_id).status == ASSIGNED AND assigned_lease_id == lease.id, i.e. the airframe has already been returned to service"
          - "at least one InsuranceCertificate on this lease with status == ACTIVE covering clock_now"
        side_effects:
          - "sets lease.suspension_reason = null"
          - "does NOT create a further UtilizationPeriod and does NOT restore already-cancelled legs"
          - "increments LeaseAgreement.version by 1"
        note: "Second, operator-driven leg of the ACTIVE -> SUSPENDED -> ACTIVE cycle. An INSURANCE_LAPSED suspension reactivates automatically on a conforming replacement certificate; an AIRFRAME_AOG suspension requires this explicit call after RETURN_TO_SERVICE. A REGULATORY_APPROVAL_REVOKED suspension is unrecoverable because RegulatoryApproval.REVOKED is terminal."
      - from: ACTIVE
        to: TERMINATING
        trigger: "POST /wetlease/leases/{leaseId}/terminate"
        actor: LessorOpsController
        preconditions:
          - "lease.status IN {ACTIVE, SUSPENDED}"
          - "termination_reason IN {EXPIRY, NOTICE, DEFAULT}"
          - "no FlightLeg on this lease has status == DISPATCHED"
        side_effects:
          - "cancels every FlightLeg on this lease with status == SCHEDULED and leg_class != REPOSITIONING, setting status = CANCELLED_LESSOR, cancelling_party = LESSOR, cancel_reason = COMMERCIAL"
          - "creates a ReturnCondition with lease_id == lease.id, aircraft_id == lease.primary_aircraft_id, status = PENDING_INSPECTION"
          - "closes every UtilizationPeriod on this lease with status == OPEN into PENDING_SETTLEMENT, writing the FINAL variant fields"
          - "increments LeaseAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATING
        trigger: "POST /wetlease/leases/{leaseId}/terminate"
        actor: LessorOpsController
        preconditions:
          - "lease.status == SUSPENDED"
        side_effects:
          - "same side-effect set as ACTIVE -> TERMINATING"
          - "increments LeaseAgreement.version by 1"
      - from: TERMINATING
        to: RETURNED
        trigger: "system event: POST /wetlease/return-conditions/{returnId}/close moves the lease's ReturnCondition to CLOSED"
        actor: system
        preconditions:
          - "lease.status == TERMINATING"
          - "ReturnCondition.status == CLOSED for this lease"
        side_effects:
          - "sets Aircraft(lease.primary_aircraft_id).status = AVAILABLE and assigned_lease_id = null"
          - "increments LeaseAgreement.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /wetlease/leases/{leaseId}/withdraw"
        actor: LessorOpsController
        preconditions:
          - "lease.status IN {DRAFT, PENDING_REGULATORY_APPROVAL, APPROVED}"
        side_effects:
          - "sets every RegulatoryApproval on this lease whose determination IN {UNDER_REVIEW, CONDITIONAL, APPROVED} to REVOKED"
          - "increments LeaseAgreement.version by 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /wetlease/leases/{leaseId}/withdraw"
        actor: LessorOpsController
        preconditions:
          - "lease.status == APPROVED"
        side_effects:
          - "sets the lease's RegulatoryApproval determination to REVOKED"
          - "increments LeaseAgreement.version by 1"

  - entity: RegulatoryApproval
    initial_state: UNDER_REVIEW
    terminal_states: [REVOKED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /wetlease/regulatory-approvals/{approvalId}/decision with determination == APPROVED"
        actor: RegulatoryAuthority
        preconditions:
          - "approval.determination == UNDER_REVIEW"
          - "conditions payload is absent or empty"
        side_effects:
          - "sets decided_at = clock_now"
          - "drives LeaseAgreement PENDING_REGULATORY_APPROVAL -> APPROVED"
      - from: UNDER_REVIEW
        to: CONDITIONAL
        trigger: "POST /wetlease/regulatory-approvals/{approvalId}/decision with determination == CONDITIONAL"
        actor: RegulatoryAuthority
        preconditions:
          - "approval.determination == UNDER_REVIEW"
          - "conditions payload is a non-empty array"
        side_effects:
          - "sets conditions and open_condition_codes to the supplied array"
          - "sets decided_at = clock_now"
          - "drives LeaseAgreement PENDING_REGULATORY_APPROVAL -> APPROVED"
        note: "Branch of the fork: same target lease state as APPROVED, but the lease carries open conditions that must be cleared before the term_end_date."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /wetlease/regulatory-approvals/{approvalId}/decision with determination == DENIED"
        actor: RegulatoryAuthority
        preconditions:
          - "approval.determination == UNDER_REVIEW"
        side_effects:
          - "sets decided_at = clock_now"
          - "drives LeaseAgreement PENDING_REGULATORY_APPROVAL -> DRAFT"
      - from: CONDITIONAL
        to: APPROVED
        trigger: "POST /wetlease/regulatory-approvals/{approvalId}/clear-conditions"
        actor: RegulatoryAuthority
        preconditions:
          - "approval.determination == CONDITIONAL"
          - "the set difference open_condition_codes minus cleared_condition_codes is empty"
        side_effects:
          - "sets open_condition_codes = []"
          - "sets decided_at = clock_now"
      - from: CONDITIONAL
        to: DENIED
        trigger: "POST /wetlease/regulatory-approvals/{approvalId}/decision with determination == DENIED"
        actor: RegulatoryAuthority
        preconditions:
          - "approval.determination == CONDITIONAL"
        side_effects:
          - "sets decided_at = clock_now"
          - "drives LeaseAgreement APPROVED -> DRAFT if the lease has not yet been activated"
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /wetlease/leases/{leaseId}/submit-for-approval on a lease back in DRAFT that already owns a DENIED RegulatoryApproval"
        actor: LessorOpsController
        preconditions:
          - "approval.determination == DENIED"
          - "lease.status == DRAFT"
        side_effects:
          - "increments review_round by 1"
          - "sets authority_docket_no to the newly supplied value, conditions = [], open_condition_codes = []"
          - "drives LeaseAgreement DRAFT -> PENDING_REGULATORY_APPROVAL"
        note: "Cyclic: UNDER_REVIEW -> DENIED -> UNDER_REVIEW. No second RegulatoryApproval row is created."
      - from: APPROVED
        to: REVOKED
        trigger: "POST /wetlease/regulatory-approvals/{approvalId}/revoke"
        actor: RegulatoryAuthority
        preconditions:
          - "approval.determination IN {APPROVED, CONDITIONAL}"
        side_effects:
          - "sets revocation_reason and decided_at = clock_now"
          - "drives LeaseAgreement ACTIVE -> SUSPENDED with suspension_reason = REGULATORY_APPROVAL_REVOKED"
      - from: CONDITIONAL
        to: REVOKED
        trigger: "POST /wetlease/regulatory-approvals/{approvalId}/revoke"
        actor: RegulatoryAuthority
        preconditions:
          - "approval.determination == CONDITIONAL"
        side_effects:
          - "same side-effect set as APPROVED -> REVOKED"

  - entity: Aircraft
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system event: POST /wetlease/leases/{leaseId}/activate, or POST /wetlease/substitutions/{substitutionId}/effectuate selecting this airframe"
        actor: system
        preconditions:
          - "aircraft.status == AVAILABLE"
          - "aircraft.assigned_lease_id IS NULL"
        side_effects:
          - "sets assigned_lease_id to the lease id"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system event: POST /wetlease/substitutions/{substitutionId}/effectuate releasing the original airframe, or LeaseAgreement TERMINATING -> RETURNED"
        actor: system
        preconditions:
          - "aircraft.status == ASSIGNED"
        side_effects:
          - "sets assigned_lease_id = null"
      - from: ASSIGNED
        to: AOG
        trigger: "POST /wetlease/aircraft/{aircraftId}/maintenance-events with event_type == GROUND_AOG"
        actor: MaintenanceController
        preconditions:
          - "aircraft.status IN {AVAILABLE, ASSIGNED}"
        side_effects:
          - "cancels every FlightLeg on this airframe with status == SCHEDULED, setting status = CANCELLED_LESSOR, cancelling_party = LESSOR, cancel_reason = TECHNICAL"
          - "drives LeaseAgreement ACTIVE -> SUSPENDED with suspension_reason = AIRFRAME_AOG when assigned_lease_id is non-null"
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "POST /wetlease/aircraft/{aircraftId}/maintenance-events with event_type == GROUND_SCHEDULED"
        actor: MaintenanceController
        preconditions:
          - "aircraft.status IN {AVAILABLE, ASSIGNED}"
        side_effects:
          - "no leg cancellation; scheduled legs remain but dispatch is blocked by ERR_AIRCRAFT_UNAVAILABLE"
      - from: ASSIGNED
        to: IN_MAINTENANCE
        trigger: "POST /wetlease/aircraft/{aircraftId}/maintenance-events with event_type == GROUND_SCHEDULED"
        actor: MaintenanceController
        preconditions:
          - "aircraft.status == ASSIGNED"
        side_effects:
          - "no leg cancellation; dispatch is blocked by ERR_AIRCRAFT_UNAVAILABLE"
      - from: IN_MAINTENANCE
        to: ASSIGNED
        trigger: "POST /wetlease/aircraft/{aircraftId}/maintenance-events with event_type == RETURN_TO_SERVICE"
        actor: MaintenanceController
        preconditions:
          - "aircraft.status IN {IN_MAINTENANCE, AOG}"
          - "aircraft.assigned_lease_id IS NOT NULL"
        side_effects:
          - "sets hours_since_last_check = 0 and cycles_since_last_check = 0"
      - from: AOG
        to: AVAILABLE
        trigger: "POST /wetlease/aircraft/{aircraftId}/maintenance-events with event_type == RETURN_TO_SERVICE"
        actor: MaintenanceController
        preconditions:
          - "aircraft.status IN {IN_MAINTENANCE, AOG}"
          - "aircraft.assigned_lease_id IS NULL"
        side_effects:
          - "sets hours_since_last_check = 0 and cycles_since_last_check = 0"
      - from: AOG
        to: ASSIGNED
        trigger: "POST /wetlease/aircraft/{aircraftId}/maintenance-events with event_type == RETURN_TO_SERVICE"
        actor: MaintenanceController
        preconditions:
          - "aircraft.status == AOG"
          - "aircraft.assigned_lease_id IS NOT NULL"
        side_effects:
          - "sets hours_since_last_check = 0 and cycles_since_last_check = 0"
          - "does NOT itself un-suspend the lease; LeaseAgreement SUSPENDED -> ACTIVE still requires POST /wetlease/leases/{leaseId}/activate"
      - from: IN_MAINTENANCE
        to: RETIRED
        trigger: "POST /wetlease/aircraft/{aircraftId}/maintenance-events with event_type == RETIRE"
        actor: MaintenanceController
        preconditions:
          - "aircraft.status == IN_MAINTENANCE"
          - "aircraft.assigned_lease_id IS NULL"
        side_effects:
          - "airframe leaves the substitution candidate pool permanently"
      - from: AOG
        to: RETIRED
        trigger: "POST /wetlease/aircraft/{aircraftId}/maintenance-events with event_type == RETIRE"
        actor: MaintenanceController
        preconditions:
          - "aircraft.status == AOG"
          - "aircraft.assigned_lease_id IS NULL"
        side_effects:
          - "airframe leaves the substitution candidate pool permanently"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /wetlease/aircraft/{aircraftId}/maintenance-events with event_type == RETIRE"
        actor: MaintenanceController
        preconditions:
          - "aircraft.status IN {AVAILABLE, IN_MAINTENANCE, AOG}"
          - "aircraft.assigned_lease_id IS NULL"
        side_effects:
          - "airframe leaves the substitution candidate pool permanently"

  - entity: InsuranceCertificate
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /wetlease/insurance-certificates/{certificateId}/revoke"
        actor: InsuranceUnderwriter
        preconditions:
          - "certificate.status == ACTIVE"
        side_effects:
          - "sets revocation_reason"
          - "when no InsuranceCertificate with status == ACTIVE remains on the lease, drives LeaseAgreement ACTIVE -> SUSPENDED with suspension_reason = INSURANCE_LAPSED"
        note: "Cascade hop 1 of the insurance-revocation chain."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: POST /_clock/set_current_utc advances clock_now past certificate.expires_at"
        actor: system
        preconditions:
          - "certificate.status == ACTIVE"
          - "clock_now > certificate.expires_at"
        side_effects:
          - "when no InsuranceCertificate with status == ACTIVE remains on the lease, drives LeaseAgreement ACTIVE -> SUSPENDED with suspension_reason = INSURANCE_LAPSED"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: POST /wetlease/insurance-certificates creates a replacement certificate on a SUSPENDED lease whose suspension_reason == INSURANCE_LAPSED and whose prior certificate is still ACTIVE"
        actor: system
        preconditions:
          - "certificate.status == ACTIVE"
          - "the new certificate's closed coverage interval does not overlap this one"
        side_effects:
          - "no lease state change; the superseded certificate stops counting toward dispatch cover"

  - entity: CrewQualification
    initial_state: TRAINING
    terminal_states: [REVOKED]
    transitions:
      - from: TRAINING
        to: QUALIFIED
        trigger: "POST /wetlease/crew-qualifications/{qualificationId}/complete-checkride"
        actor: LessorOpsController
        preconditions:
          - "qualification.status IN {TRAINING, EXPIRED}"
          - "checkride_valid_until > date(clock_now)"
          - "CrewMember.status == ACTIVE"
        side_effects:
          - "sets checkride_valid_until"
      - from: QUALIFIED
        to: EXPIRED
        trigger: "system event: POST /_clock/set_current_utc advances date(clock_now) past checkride_valid_until"
        actor: system
        preconditions:
          - "qualification.status == QUALIFIED"
        side_effects:
          - "legs that would use this crew member on this lease are rejected with ERR_CREW_NOT_QUALIFIED_FOR_LESSEE_PROCEDURES"
      - from: EXPIRED
        to: QUALIFIED
        trigger: "POST /wetlease/crew-qualifications/{qualificationId}/complete-checkride"
        actor: LessorOpsController
        preconditions:
          - "qualification.status == EXPIRED"
          - "checkride_valid_until > date(clock_now)"
        side_effects:
          - "sets checkride_valid_until"
        note: "Cyclic: QUALIFIED -> EXPIRED -> QUALIFIED via recurrent line check."
      - from: QUALIFIED
        to: REVOKED
        trigger: "system event: LeaseAgreement reaches RETURNED or WITHDRAWN"
        actor: system
        preconditions:
          - "qualification.status IN {TRAINING, QUALIFIED, EXPIRED}"
        side_effects:
          - "lessee-procedures authority for this lease ends permanently"

  - entity: FlightLeg
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_LESSEE, CANCELLED_LESSOR, DIVERTED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /wetlease/flight-legs/{legId}/dispatch"
        actor: LessorOpsController
        preconditions:
          - "leg.status == SCHEDULED"
          - "LeaseAgreement.status == ACTIVE"
          - "Aircraft(leg.aircraft_id).status == ASSIGNED"
          - "an InsuranceCertificate on the lease has status == ACTIVE, additional_insured_lessee == true, and effective_from <= actual_out <= expires_at"
          - "CrewQualification(captain_id, lease_id).status == QUALIFIED AND CrewQualification(first_officer_id, lease_id).status == QUALIFIED"
          - "captain and first officer both hold Aircraft.type_designator in type_ratings"
          - "projected rolling duty and 28-day block exposure remain within limits per calculations.crew_duty_and_block_exposure"
        side_effects:
          - "sets actual_out"
          - "leaves billing_state unchanged"
        note: "Cross-entity guard on Aircraft; the leg's billing_state dimension is untouched by every status transition."
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /wetlease/flight-legs/{legId}/complete"
        actor: LessorOpsController
        preconditions:
          - "leg.status == DISPATCHED"
          - "actual_in > leg.actual_out"
        side_effects:
          - "sets actual_in, technical_delay_minutes, block_minutes and billable_block_minutes per calculations.leg_billable_block_minutes"
          - "adds block_minutes/60 to Aircraft.airframe_hours_total and Aircraft.hours_since_last_check, and 1 to Aircraft.cycles_since_last_check, each rounded to 2 decimals"
          - "recomputes the lease's OPEN UtilizationPeriod for the month of scheduled_out under the PROVISIONAL variant"
      - from: SCHEDULED
        to: CANCELLED_LESSEE
        trigger: "POST /wetlease/flight-legs/{legId}/cancel with cancelling_party == LESSEE"
        actor: LessorOpsController
        preconditions:
          - "leg.status == SCHEDULED"
        side_effects:
          - "sets cancelling_party = LESSEE and cancel_reason"
          - "sets billing_state = CREDITED"
          - "recomputes CrewMember.rolling_duty_minutes_7d and rolling_block_minutes_28d for captain_id and first_officer_id"
          - "recomputes the lease's OPEN UtilizationPeriod under the PROVISIONAL variant"
      - from: SCHEDULED
        to: CANCELLED_LESSOR
        trigger: "POST /wetlease/flight-legs/{legId}/cancel with cancelling_party == LESSOR, or system cascade from LeaseAgreement ACTIVE -> SUSPENDED / Aircraft ASSIGNED -> AOG / LeaseAgreement ACTIVE -> TERMINATING"
        actor: LessorOpsController
        preconditions:
          - "leg.status == SCHEDULED"
        side_effects:
          - "sets cancelling_party = LESSOR and cancel_reason"
          - "sets billing_state = CREDITED"
          - "recomputes CrewMember.rolling_duty_minutes_7d and rolling_block_minutes_28d for captain_id and first_officer_id"
          - "recomputes the lease's OPEN UtilizationPeriod under the PROVISIONAL variant, which raises lessor_attributable_shortfall_hours"
        note: "Cascade hop 3 of the insurance-revocation chain; hop 4 is the crew-exposure and period recompute listed above."
      - from: DISPATCHED
        to: DIVERTED
        trigger: "POST /wetlease/flight-legs/{legId}/complete with a dest_icao mismatch is NOT used; diversion is recorded by POST /wetlease/flight-legs/{legId}/cancel with cancel_reason == WEATHER on a DISPATCHED leg"
        actor: LessorOpsController
        preconditions:
          - "leg.status == DISPATCHED"
          - "cancel_reason == WEATHER"
        side_effects:
          - "sets billing_state = CREDITED"
          - "billable_block_minutes stays 0 because actual_in was never recorded"
      - from: UNBILLED
        to: PROVISIONALLY_BILLED
        trigger: "system event: POST /wetlease/settlement-invoices with variant == PROVISIONAL over the leg's UtilizationPeriod"
        actor: system
        preconditions:
          - "leg.billing_state == UNBILLED"
          - "leg.status IN {SCHEDULED, DISPATCHED, COMPLETED}"
        side_effects:
          - "no change to leg.status"
        note: "Second, independent state dimension on the same FlightLeg row: billing_state advances while status is untouched."
      - from: PROVISIONALLY_BILLED
        to: FINALIZED
        trigger: "system event: UtilizationPeriod PENDING_SETTLEMENT -> SETTLED"
        actor: system
        preconditions:
          - "leg.billing_state IN {UNBILLED, PROVISIONALLY_BILLED}"
          - "leg.status == COMPLETED"
        side_effects:
          - "leg minutes are frozen against further period recomputation"
      - from: UNBILLED
        to: FINALIZED
        trigger: "system event: UtilizationPeriod PENDING_SETTLEMENT -> SETTLED for a COMPLETED leg never provisionally invoiced"
        actor: system
        preconditions:
          - "leg.billing_state == UNBILLED"
          - "leg.status == COMPLETED"
        side_effects:
          - "leg minutes are frozen against further period recomputation"

  - entity: AircraftSubstitution
    initial_state: REQUESTED
    terminal_states: [REJECTED, EFFECTIVE, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: LESSEE_CONSENT_PENDING
        trigger: "system event: POST /wetlease/substitutions on a lease whose substitution_rights == LESSEE_CONSENT_REQUIRED"
        actor: system
        preconditions:
          - "substitution.status == REQUESTED"
          - "LeaseAgreement.substitution_rights == LESSEE_CONSENT_REQUIRED"
        side_effects:
          - "sets seat_delta = substitute.seat_count - original.seat_count"
          - "no airframe is touched yet"
        note: "Fork branch A of the request: divergent side-effect set from branch B below."
      - from: REQUESTED
        to: APPROVED
        trigger: "system event: POST /wetlease/substitutions on a lease whose substitution_rights == LESSOR_UNILATERAL"
        actor: system
        preconditions:
          - "substitution.status == REQUESTED"
          - "LeaseAgreement.substitution_rights == LESSOR_UNILATERAL"
        side_effects:
          - "sets seat_delta = substitute.seat_count - original.seat_count"
          - "withdraws every other AircraftSubstitution on this lease with status IN {REQUESTED, LESSEE_CONSENT_PENDING, APPROVED} into WITHDRAWN"
        note: "Fork branch B: skips consent entirely and additionally supersedes prior open requests, a side effect branch A does not perform."
      - from: LESSEE_CONSENT_PENDING
        to: APPROVED
        trigger: "POST /wetlease/substitutions/{substitutionId}/consent with decision == GRANT"
        actor: Lessee
        preconditions:
          - "substitution.status == LESSEE_CONSENT_PENDING"
          - "X-User-ID equals LeaseAgreement.lessee_id"
        side_effects:
          - "records consent_note"
      - from: LESSEE_CONSENT_PENDING
        to: REJECTED
        trigger: "POST /wetlease/substitutions/{substitutionId}/consent with decision == WITHHOLD"
        actor: Lessee
        preconditions:
          - "substitution.status == LESSEE_CONSENT_PENDING"
          - "X-User-ID equals LeaseAgreement.lessee_id"
        side_effects:
          - "records consent_note; the original airframe stays on the lease"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /wetlease/substitutions/{substitutionId}/effectuate"
        actor: LessorOpsController
        preconditions:
          - "substitution.status == APPROVED"
          - "Aircraft(substitute_aircraft_id).status == AVAILABLE AND assigned_lease_id IS NULL"
          - "Aircraft(substitute_aircraft_id).maintenance_program_ref == LeaseAgreement.required_maintenance_program_ref"
          - "LeaseAgreement.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "hop 1: sets Aircraft(substitute).status = ASSIGNED, assigned_lease_id = lease.id; sets Aircraft(original).assigned_lease_id = null and status = AVAILABLE when it was ASSIGNED (unchanged when IN_MAINTENANCE or AOG); sets LeaseAgreement.primary_aircraft_id = substitute_aircraft_id"
          - "hop 2: caused by the primary_aircraft_id re-point, every FlightLeg on the lease with status == SCHEDULED and scheduled_out >= substitution.effective_from has aircraft_id re-pointed to substitute_aircraft_id, and repointed_leg_count is written"
          - "hop 3: caused by each leg re-point, any re-pointed leg whose captain or first officer does not hold the substitute's type_designator in type_ratings gets crew_requalification_required = true and is cancelled into CANCELLED_LESSOR with cancel_reason = CREW"
          - "hop 4: caused by each such cancellation, CrewMember.rolling_duty_minutes_7d / rolling_block_minutes_28d are recomputed for that leg's captain and first officer and the lease's OPEN UtilizationPeriod is recomputed under the PROVISIONAL variant"
          - "increments LeaseAgreement.version by 1"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "system event: a later POST /wetlease/substitutions on the same lease supersedes this request"
        actor: system
        preconditions:
          - "substitution.status IN {REQUESTED, LESSEE_CONSENT_PENDING, APPROVED}"
        side_effects:
          - "no airframe is touched"
      - from: LESSEE_CONSENT_PENDING
        to: WITHDRAWN
        trigger: "system event: a later POST /wetlease/substitutions on the same lease supersedes this request"
        actor: system
        preconditions:
          - "substitution.status == LESSEE_CONSENT_PENDING"
        side_effects:
          - "no airframe is touched"

  - entity: UtilizationPeriod
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: PENDING_SETTLEMENT
        trigger: "POST /wetlease/utilization-periods/{periodId}/close, or system cascade from LeaseAgreement -> TERMINATING"
        actor: LessorOpsController
        preconditions:
          - "period.status == OPEN"
          - "no FlightLeg on this lease with scheduled_out inside period_month has status IN {SCHEDULED, DISPATCHED}"
        side_effects:
          - "recomputes every charge field under the FINAL variant and sets variant_applied = FINAL"
          - "writes final_charge_cents"
          - "creates the next month's UtilizationPeriod with status OPEN when the next month still falls inside the lease term and the lease status IN {ACTIVE, SUSPENDED}"
          - "increments UtilizationPeriod.version by 1"
      - from: PENDING_SETTLEMENT
        to: SETTLED
        trigger: "system event: POST /wetlease/settlement-invoices/{invoiceId}/issue for an invoice with variant == FINAL over this period"
        actor: system
        preconditions:
          - "period.status == PENDING_SETTLEMENT"
        side_effects:
          - "sets every FlightLeg of the month with status == COMPLETED to billing_state = FINALIZED"
          - "adds credited_block_minutes to LeaseAgreement.lifetime_credited_block_minutes"
          - "increments UtilizationPeriod.version by 1"
      - from: SETTLED
        to: DISPUTED
        trigger: "POST /wetlease/utilization-periods/{periodId}/dispute"
        actor: Lessee
        preconditions:
          - "period.status == SETTLED"
          - "X-User-ID equals LeaseAgreement.lessee_id"
          - "0 < disputed_amount_cents <= final_charge_cents"
        side_effects:
          - "records dispute_reason and disputed_amount_cents"
          - "increments UtilizationPeriod.version by 1"
      - from: DISPUTED
        to: REOPENED
        trigger: "POST /wetlease/utilization-periods/{periodId}/resolve-dispute with resolution == REOPEN"
        actor: BillingAdmin
        preconditions:
          - "period.status == DISPUTED"
        side_effects:
          - "voids every SettlementInvoice on this period with status == ISSUED, which decrements Lessee.outstanding_balance_usd_cents by each voided amount_cents"
          - "increments UtilizationPeriod.version by 1"
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /wetlease/utilization-periods/{periodId}/resolve-dispute with resolution == UPHOLD_SETTLEMENT"
        actor: BillingAdmin
        preconditions:
          - "period.status == DISPUTED"
        side_effects:
          - "clears disputed_amount_cents to 0 and keeps dispute_reason for audit"
          - "increments UtilizationPeriod.version by 1"
      - from: REOPENED
        to: PENDING_SETTLEMENT
        trigger: "POST /wetlease/utilization-periods/{periodId}/close"
        actor: LessorOpsController
        preconditions:
          - "period.status == REOPENED"
        side_effects:
          - "recomputes every charge field under the FINAL variant and rewrites final_charge_cents"
          - "does NOT create a following month's period"
          - "increments UtilizationPeriod.version by 1"
        note: "Cyclic: SETTLED -> DISPUTED -> REOPENED -> PENDING_SETTLEMENT -> SETTLED."
      - from: SETTLED
        to: PENDING_SETTLEMENT
        trigger: "system event: POST /wetlease/settlement-invoices/{invoiceId}/void on the ISSUED FINAL invoice of this period"
        actor: system
        preconditions:
          - "period.status == SETTLED"
        side_effects:
          - "reverts every FlightLeg of the month from billing_state FINALIZED back to PROVISIONALLY_BILLED when it had been provisionally invoiced, else to UNBILLED"
          - "subtracts credited_block_minutes from LeaseAgreement.lifetime_credited_block_minutes"
          - "increments UtilizationPeriod.version by 1"

  - entity: SettlementInvoice
    initial_state: PREPARED
    terminal_states: [VOID]
    transitions:
      - from: PREPARED
        to: APPROVED
        trigger: "POST /wetlease/settlement-invoices/{invoiceId}/approve"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == PREPARED"
          - "X-User-ID != invoice.prepared_by_user_id"
          - "a ReliabilityReport exists for (invoice.lease_id, UtilizationPeriod.period_month) with status == ACCEPTED"
        side_effects:
          - "sets approved_by_user_id = X-User-ID"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /wetlease/settlement-invoices/{invoiceId}/issue"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == APPROVED"
          - "Lessee.outstanding_balance_usd_cents + invoice.amount_cents <= Lessee.credit_limit_usd_cents"
        side_effects:
          - "sets due_on"
          - "adds amount_cents to Lessee.outstanding_balance_usd_cents"
          - "drives UtilizationPeriod PENDING_SETTLEMENT -> SETTLED when invoice.variant == FINAL"
      - from: PREPARED
        to: VOID
        trigger: "POST /wetlease/settlement-invoices/{invoiceId}/void"
        actor: BillingAdmin
        preconditions:
          - "invoice.status IN {PREPARED, APPROVED, ISSUED}"
        side_effects:
          - "records void_reason"
      - from: ISSUED
        to: VOID
        trigger: "POST /wetlease/settlement-invoices/{invoiceId}/void"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "records void_reason"
          - "subtracts amount_cents from Lessee.outstanding_balance_usd_cents, restoring the pre-issue value exactly"
          - "drives UtilizationPeriod SETTLED -> PENDING_SETTLEMENT when invoice.variant == FINAL"
        note: "Compensating action for APPROVED -> ISSUED; calculations.lessee_outstanding_balance must hold before and after."

  - entity: ReliabilityReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /wetlease/reliability-reports/{reportId}/review with decision == ACCEPT"
        actor: Lessee
        preconditions:
          - "report.status == SUBMITTED"
          - "X-User-ID equals LeaseAgreement.lessee_id"
        side_effects:
          - "unblocks SettlementInvoice PREPARED -> APPROVED for the same (lease, period_month)"
          - "feeds technical_dispatch_reliability_pct into calculations.reliability_shortfall_penalty on the next period close"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /wetlease/reliability-reports/{reportId}/review with decision == REJECT"
        actor: Lessee
        preconditions:
          - "report.status == SUBMITTED"
          - "X-User-ID equals LeaseAgreement.lessee_id"
        side_effects:
          - "records review_note; a fresh report for the same (lease, aircraft, month) may now be submitted"

  - entity: ReturnCondition
    initial_state: PENDING_INSPECTION
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_INSPECTION
        to: DISCREPANCIES_OPEN
        trigger: "POST /wetlease/return-conditions/{returnId}/inspect with a non-empty discrepancy_codes array"
        actor: LessorOpsController
        preconditions:
          - "returnCondition.status == PENDING_INSPECTION"
          - "LeaseAgreement.status == TERMINATING"
        side_effects:
          - "writes hours_since_check_at_return, cycles_since_check_at_return, fuel_on_board_kg, discrepancy_cost_cents and billed_to_lessee_cents per calculations.return_discrepancy_cost"
          - "applies the maintenance-reserve waterfall, writing LeaseAgreement.return_deposit_applied_cents and return_deposit_remaining_cents"
      - from: PENDING_INSPECTION
        to: CLEARED
        trigger: "POST /wetlease/return-conditions/{returnId}/inspect with an empty or omitted discrepancy_codes array and zero computed discrepancy cost"
        actor: LessorOpsController
        preconditions:
          - "returnCondition.status == PENDING_INSPECTION"
          - "computed discrepancy_cost_cents == 0"
        side_effects:
          - "writes the recorded return metrics and leaves the deposit untouched"
      - from: DISCREPANCIES_OPEN
        to: CLEARED
        trigger: "POST /wetlease/return-conditions/{returnId}/inspect re-inspection with an empty discrepancy_codes array"
        actor: LessorOpsController
        preconditions:
          - "returnCondition.status == DISCREPANCIES_OPEN"
        side_effects:
          - "recomputes discrepancy_cost_cents and re-applies the deposit waterfall from the original deposit balance, so return_deposit_applied_cents + return_deposit_remaining_cents == return_deposit_cents still holds"
      - from: CLEARED
        to: CLOSED
        trigger: "POST /wetlease/return-conditions/{returnId}/close"
        actor: LessorOpsController
        preconditions:
          - "returnCondition.status == CLEARED"
          - "the supplied repositioning_leg_id names a FlightLeg on this lease with leg_class == REPOSITIONING, status == COMPLETED and dest_icao == LeaseAgreement.redelivery_icao"
        side_effects:
          - "sets repositioning_leg_id"
          - "drives LeaseAgreement TERMINATING -> RETURNED, which releases the airframe to AVAILABLE"
          - "sets every CrewQualification on the lease to REVOKED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: invoice-prepare-stale-period
    parent_entity: UtilizationPeriod
    write_endpoint: "POST /wetlease/settlement-invoices"
    occ_field: "expected_period_version"
    description: |
      Preparing a SettlementInvoice against a UtilizationPeriod whose version has
      advanced since the client last read it is rejected. The product deliberately
      permits a later preparation to supersede an earlier PREPARED invoice on the
      same period (e.g. switching variant from PROVISIONAL to FINAL), so a writer
      holding a stale view of the period would otherwise silently invalidate an
      invoice it never saw. The check is a stale-version comparison on
      UtilizationPeriod.version, not a timing condition.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412

  - rule_id: substitution-request-stale-lease
    parent_entity: LeaseAgreement
    write_endpoint: "POST /wetlease/substitutions"
    occ_field: "expected_lease_version"
    description: |
      Requesting an AircraftSubstitution against a LeaseAgreement whose version has
      advanced since the client last read it is rejected. A new request legitimately
      supersedes prior open requests on the same lease (and, on a LESSOR_UNILATERAL
      lease, withdraws them outright), so a writer whose view of the lease predates
      the last airframe re-point, suspension, or activation must re-read before it
      may supersede. Expressed purely as a stale UtilizationPeriod-independent
      version comparison on LeaseAgreement.version.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: leg_billable_block_minutes
    trigger: "on POST /wetlease/flight-legs/{legId}/complete (FlightLeg DISPATCHED -> COMPLETED); writes FlightLeg.block_minutes and FlightLeg.billable_block_minutes"
    algorithm: threshold
    formula: |
      # scheduled_block_minutes is written at creation and never changes
      scheduled_block_minutes = floor((scheduled_in - scheduled_out).total_seconds() / 60)

      # block_minutes is written at completion
      block_minutes = floor((actual_in - actual_out).total_seconds() / 60)

      if leg_class == "MAINTENANCE_FERRY":
          billable_block_minutes = 0
      elif leg_class == "REPOSITIONING":
          billable_block_minutes = block_minutes          # no minimum floor
      else:                                               # REVENUE
          # boundary is >=, so block_minutes == 60 is billed as 60, and 59 as 60
          billable_block_minutes = block_minutes if block_minutes >= MIN_BILLABLE_BLOCK_MINUTES \
                                   else MIN_BILLABLE_BLOCK_MINUTES
    input_set: "The single FlightLeg being completed. Cancelled and DIVERTED legs never run this rule and keep billable_block_minutes == 0."
    constants:
      MIN_BILLABLE_BLOCK_MINUTES: 60
    precision: "whole minutes, floor on the second-to-minute conversion"

  - name: monthly_utilization_charge
    trigger: "PROVISIONAL variant runs on every FlightLeg create / dispatch / complete / cancel touching an OPEN UtilizationPeriod, and on GET /wetlease/utilization-periods/{periodId}/settlement-preview; FINAL variant runs on UtilizationPeriod OPEN -> PENDING_SETTLEMENT and REOPENED -> PENDING_SETTLEMENT. Writes UtilizationPeriod.mgh_effective_hours, credited_block_minutes, credited_hours, shortfall_hours, lessor_attributable_shortfall_hours, overrun_hours, base_charge_cents, shortfall_credit_cents, overrun_charge_cents, gross_charge_cents, provisional_charge_cents, final_charge_cents, variant_applied."
    algorithm: tiered_pricing
    formula: |
      rate = LeaseAgreement.block_hour_rate_usd_cents

      # ---- STEP 1: proration of the minimum guarantee -------------------------
      # days_in_month = calendar days of period_month
      # covered_days  = count of calendar dates d in period_month with
      #                 lease.term_start_date <= d <= lease.term_end_date  (both inclusive)
      mgh_effective_hours = round_half_up(
          lease.min_guaranteed_block_hours_per_month * covered_days / days_in_month, 4)

      # ---- STEP 2: per-leg minute contributions (variant-dependent) ----------
      # PROVISIONAL variant include-set:
      #   legs whose scheduled_out falls in period_month AND status IN
      #   {SCHEDULED, DISPATCHED, COMPLETED}; contribution is
      #   billable_block_minutes when status == COMPLETED, else scheduled_block_minutes
      #   (with the same MIN_BILLABLE_BLOCK_MINUTES floor applied for REVENUE legs and
      #   0 for MAINTENANCE_FERRY). Cancelled and DIVERTED legs contribute nothing.
      # FINAL variant include-set:
      #   legs whose scheduled_out falls in period_month AND status == COMPLETED,
      #   contribution = billable_block_minutes;
      #   PLUS legs with status == CANCELLED_LESSEE, contribution =
      #   scheduled_block_minutes * LESSEE_CANCEL_CREDIT_PCT.
      #   CANCELLED_LESSOR and DIVERTED legs contribute nothing, SCHEDULED and
      #   DISPATCHED legs cannot exist at close time (precondition of the transition).

      # ---- STEP 3: ROUNDING ORDER IS PINNED: round per leg, THEN sum ----------
      # Each leg's contribution is converted to hours and rounded to 4 decimals
      # FIRST; the rounded per-leg hour figures are then summed. This is NOT
      # "sum the minutes then divide once" — for three 100-minute legs this rule
      # yields 1.6667 * 3 = 5.0001 h, whereas sum-then-divide would yield 5.0000 h.
      credited_hours = sum( round_half_up(contribution_minutes_of_leg / 60, 4)
                            for leg in include_set )                      # 4 dp
      credited_block_minutes = sum( contribution_minutes_of_leg for leg in include_set )  # whole minutes

      # ---- STEP 4: shortfall vs overrun (strict < decides the branch) ---------
      if credited_hours < mgh_effective_hours:
          shortfall_hours = round_half_up(mgh_effective_hours - credited_hours, 4)
          overrun_hours   = 0
      else:
          shortfall_hours = 0
          overrun_hours   = round_half_up(credited_hours - mgh_effective_hours, 4)

      lessor_cancelled_hours = round_half_up(
          sum(leg.scheduled_block_minutes for leg in month_legs
              if leg.status == "CANCELLED_LESSOR") / 60, 4)
      lessor_attributable_shortfall_hours = min(shortfall_hours, lessor_cancelled_hours)

      # ---- STEP 5: components, EACH rounded to whole cents BEFORE summation ---
      base_charge_cents      = round_half_up(mgh_effective_hours * rate)
      shortfall_credit_cents = round_half_up(lessor_attributable_shortfall_hours
                                             * rate * lease.shortfall_credit_pct)

      tier1_cap = round_half_up(mgh_effective_hours * OVERRUN_TIER1_FRACTION_OF_MGH, 4)
      tier2_cap = round_half_up(mgh_effective_hours * OVERRUN_TIER2_FRACTION_OF_MGH, 4)
      t1 = min(overrun_hours, tier1_cap)
      t2 = min(max(overrun_hours - tier1_cap, 0), tier2_cap)
      t3 = max(overrun_hours - tier1_cap - tier2_cap, 0)
      overrun_charge_cents = round_half_up(t1 * rate * OVERRUN_TIER1_MULTIPLIER) \
                           + round_half_up(t2 * rate * OVERRUN_TIER2_MULTIPLIER) \
                           + round_half_up(t3 * rate * OVERRUN_TIER3_MULTIPLIER)

      gross_charge_cents = base_charge_cents - shortfall_credit_cents + overrun_charge_cents

      # ---- STEP 6: net charge (penalty from calculations.reliability_shortfall_penalty)
      net_charge_cents = gross_charge_cents - reliability_penalty_cents

      if variant == "PROVISIONAL":  provisional_charge_cents = net_charge_cents
      else:                         final_charge_cents       = net_charge_cents
    input_set: "FlightLegs whose scheduled_out falls inside period_month AND whose lease_id == period.lease_id, filtered by status per the variant include-sets in STEP 2. Legs are enumerated in scheduled_out ASC order, created_at ASC as tie-break, but because the per-leg contributions are summed the order does not change the result."
    constants:
      OVERRUN_TIER1_FRACTION_OF_MGH: 0.10
      OVERRUN_TIER2_FRACTION_OF_MGH: 0.15
      OVERRUN_TIER1_MULTIPLIER: 1.00
      OVERRUN_TIER2_MULTIPLIER: 1.15
      OVERRUN_TIER3_MULTIPLIER: 1.35
      LESSEE_CANCEL_CREDIT_PCT: 0.50
      MIN_BILLABLE_BLOCK_MINUTES: 60
    precision: "hours to 4 decimal places round_half_up; every cents component rounded to whole cents round_half_up BEFORE summation"
    variants:
      - name: PROVISIONAL
        when: "While the UtilizationPeriod is OPEN, on GET /wetlease/utilization-periods/{periodId}/settlement-preview, and for a SettlementInvoice prepared with variant == PROVISIONAL"
        difference: "Include-set is status IN {SCHEDULED, DISPATCHED, COMPLETED} and uses scheduled_block_minutes for legs not yet completed; CANCELLED_LESSEE legs contribute nothing, so no 50% credit appears."
      - name: FINAL
        when: "On UtilizationPeriod OPEN -> PENDING_SETTLEMENT and REOPENED -> PENDING_SETTLEMENT, and for a SettlementInvoice prepared with variant == FINAL"
        difference: "Include-set is status == COMPLETED only, using billable_block_minutes, PLUS a 50%-of-scheduled credit for CANCELLED_LESSEE legs. Identical leg data therefore yields different credited_hours, a different overrun tier split, and a different charge."

  - name: reliability_shortfall_penalty
    trigger: "runs inside calculations.monthly_utilization_charge STEP 6, i.e. on every PROVISIONAL recompute and on UtilizationPeriod OPEN|REOPENED -> PENDING_SETTLEMENT; writes UtilizationPeriod.reliability_penalty_cents"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED. The penalty rate tier is keyed on
      # gross_charge_cents as computed in STEP 5 of monthly_utilization_charge,
      # BEFORE any penalty is subtracted. net_charge_cents is then
      # gross_charge_cents - penalty_cents. The tier is NEVER re-derived from
      # net_charge_cents and no fixed-point iteration is performed, even though
      # subtracting the penalty can push the net figure into a lower tier.

      report = the ReliabilityReport with lease_id == period.lease_id,
               period_month == period.period_month and status == ACCEPTED;
               when two or more exist, the one with the greatest created_at
      if report is None:
          reliability_penalty_cents = 0                      # no accepted report -> no penalty
      else:
          accepted_tdr_pct = report.technical_dispatch_reliability_pct
          deficit_factor = min(MAX_DEFICIT_FACTOR,
                               max(0, (GUARANTEED_TDR_PCT - accepted_tdr_pct) / TDR_DEFICIT_DIVISOR))
          # tier keyed on gross_charge_cents (strict <)
          if   gross_charge_cents <  PENALTY_TIER1_GROSS_CENTS: penalty_pct = 0.02
          elif gross_charge_cents <  PENALTY_TIER2_GROSS_CENTS: penalty_pct = 0.035
          else:                                                penalty_pct = 0.05
          reliability_penalty_cents = round_half_up(gross_charge_cents * penalty_pct * deficit_factor)
    input_set: "The single ACCEPTED ReliabilityReport for (period.lease_id, period.period_month), greatest created_at when more than one exists; SUBMITTED and REJECTED reports are ignored."
    constants:
      GUARANTEED_TDR_PCT: 99.00
      TDR_DEFICIT_DIVISOR: 5.0
      MAX_DEFICIT_FACTOR: 10.0
      PENALTY_TIER1_GROSS_CENTS: 5000000
      PENALTY_TIER2_GROSS_CENTS: 25000000
    precision: "deficit_factor to 4 decimal places round_half_up; penalty to whole cents round_half_up"

  - name: technical_dispatch_reliability
    trigger: "on POST /wetlease/reliability-reports; writes ReliabilityReport.revenue_departures, scheduled_revenue_legs, technical_delay_events, technical_cancellations, tdr_departure_basis_pct, tdr_scheduled_basis_pct and technical_dispatch_reliability_pct"
    algorithm: aggregation
    formula: |
      scope = FlightLegs with lease_id == report.lease_id
                            AND aircraft_id == report.aircraft_id
                            AND leg_class == "REVENUE"
                            AND YYYY-MM of scheduled_out == report.period_month

      revenue_departures      = count(leg in scope if leg.status IN {DISPATCHED, COMPLETED})
      scheduled_revenue_legs  = count(leg in scope if leg.status IN
                                      {SCHEDULED, DISPATCHED, COMPLETED, CANCELLED_LESSOR})
      technical_delay_events  = count(leg in scope if leg.technical_delay_minutes > TECHNICAL_DELAY_THRESHOLD_MINUTES)
      technical_cancellations = count(leg in scope if leg.status == "CANCELLED_LESSOR"
                                      AND leg.cancel_reason == "TECHNICAL")

      # variant A - DEPARTURE_BASIS: only airframes that actually went off-blocks
      tdr_departure_basis_pct = 100.00 if revenue_departures == 0 else round_half_up(
          100 * (revenue_departures - technical_delay_events) / revenue_departures, 2)

      # variant B - SCHEDULED_BASIS: the whole published programme, so lessor
      # technical cancellations also count against the operator
      tdr_scheduled_basis_pct = 100.00 if scheduled_revenue_legs == 0 else round_half_up(
          100 * (scheduled_revenue_legs - technical_delay_events - technical_cancellations)
          / scheduled_revenue_legs, 2)

      technical_dispatch_reliability_pct = tdr_departure_basis_pct \
          if LeaseAgreement.reliability_basis == "DEPARTURE" else tdr_scheduled_basis_pct
    input_set: "REVENUE FlightLegs of (lease_id, aircraft_id) whose scheduled_out month equals period_month. The DEPARTURE_BASIS denominator excludes CANCELLED_LESSOR and SCHEDULED legs; the SCHEDULED_BASIS denominator includes CANCELLED_LESSOR and SCHEDULED legs. CANCELLED_LESSEE and DIVERTED legs are excluded from both denominators."
    constants:
      TECHNICAL_DELAY_THRESHOLD_MINUTES: 15
    precision: "2 decimal places, round_half_up; an empty denominator yields 100.00"
    variants:
      - name: DEPARTURE_BASIS
        when: "LeaseAgreement.reliability_basis == DEPARTURE"
        difference: "Denominator is revenue_departures and technical_cancellations are excluded from the numerator penalty, so lessor technical cancellations do not depress the figure."
      - name: SCHEDULED_BASIS
        when: "LeaseAgreement.reliability_basis == SCHEDULED"
        difference: "Denominator is scheduled_revenue_legs and technical_cancellations are subtracted in the numerator, so identical leg data yields a strictly lower percentage whenever technical_cancellations > 0."

  - name: substitute_aircraft_selection
    trigger: "on POST /wetlease/substitutions when substitute_aircraft_id is omitted; writes AircraftSubstitution.substitute_aircraft_id, selection_basis = SERVER_SELECTED and seat_delta"
    algorithm: weighted_scoring
    formula: |
      original = Aircraft(request.original_aircraft_id)

      # (a) eligibility filter - explicit predicate over entity fields
      candidates = [ a for a in Aircraft if
            a.status == "AVAILABLE"
        and a.assigned_lease_id IS NULL
        and a.type_family == original.type_family          # FAMILY, not variant designator
        and a.maintenance_program_ref == LeaseAgreement.required_maintenance_program_ref
        and a.seat_count >= original.seat_count - SEAT_TOLERANCE
        and a.hours_since_last_check <= MAX_HOURS_SINCE_CHECK_FOR_SUB
        and a.id != original.id ]

      # (b) ranking expression, ascending on each key in order
      # (c) final tie-break is created_at ASC - never id
      candidates.sort(key = lambda a: ( abs(a.seat_count - original.seat_count),
                                        a.hours_since_last_check,
                                        a.created_at ))

      # (d) empty-pool fallback
      if len(candidates) == 0:
          reject with ERR_NO_SUBSTITUTE_AIRCRAFT_AVAILABLE (409)
      substitute_aircraft_id = candidates[0].id
      seat_delta = candidates[0].seat_count - original.seat_count
    input_set: "All Aircraft rows passing the eligibility filter; RETIRED, IN_MAINTENANCE, AOG and already-assigned airframes are excluded, as is any airframe whose hours_since_last_check exceeds 400.00 (boundary is <=, so exactly 400.00 remains eligible). Eligibility is judged on type_family, so a different-variant airframe of the same family is a lawful substitute even when the rostered crew are not rated on that variant."
    constants:
      SEAT_TOLERANCE: 5
      MAX_HOURS_SINCE_CHECK_FOR_SUB: 400.00
    precision: "hours_since_last_check compared at 2 decimal places; ranking keys compared exactly"

  - name: crew_duty_and_block_exposure
    trigger: "recomputed on POST /wetlease/flight-legs, POST /wetlease/flight-legs/{legId}/cancel, POST /wetlease/flight-legs/{legId}/complete and POST /_clock/set_current_utc; also evaluated as a projection during POST /wetlease/flight-legs and POST /wetlease/flight-legs/{legId}/dispatch. Writes CrewMember.rolling_duty_minutes_7d and CrewMember.rolling_block_minutes_28d."
    algorithm: aggregation
    formula: |
      def duty_minutes(leg):
          return leg.scheduled_block_minutes + PRE_POST_DUTY_MINUTES

      # STORED FIELDS - window anchored on the logical clock, HALF-OPEN
      # [clock_now - 168h, clock_now) for duty, [clock_now - 672h, clock_now) for block
      legs_of(crew) = FlightLegs where captain_id == crew.id OR first_officer_id == crew.id
      rolling_duty_minutes_7d = sum( duty_minutes(l) for l in legs_of(crew)
          if l.status IN {SCHEDULED, DISPATCHED, COMPLETED}
          and clock_now - 168h <= l.scheduled_out < clock_now )
      rolling_block_minutes_28d = sum( l.scheduled_block_minutes for l in legs_of(crew)
          if l.status IN {SCHEDULED, DISPATCHED, COMPLETED}
          and clock_now - 672h <= l.scheduled_out < clock_now )

      # PROJECTION USED FOR ADMISSION - window anchored on the candidate leg's
      # scheduled_out T, HALF-OPEN [T - 168h, T), plus the candidate leg itself
      projected_duty_minutes_7d = duty_minutes(candidate) + sum( duty_minutes(l)
          for l in legs_of(candidate.captain_id) UNION legs_of(candidate.first_officer_id)
          restricted to the crew member under test,
          if l.status IN {SCHEDULED, DISPATCHED, COMPLETED}
          and T - 168h <= l.scheduled_out < T )
      projected_block_minutes_28d = candidate.scheduled_block_minutes + sum(
          l.scheduled_block_minutes for l in the same restricted set
          if T - 672h <= l.scheduled_out < T )

      # boundary is strict >: exactly MAX_DUTY_MINUTES_7D is admissible
      if projected_duty_minutes_7d  > MAX_DUTY_MINUTES_7D:  reject ERR_CREW_DUTY_LIMIT_EXCEEDED
      if projected_block_minutes_28d > MAX_BLOCK_MINUTES_28D: reject ERR_CREW_BLOCK_LIMIT_EXCEEDED
      # the captain is tested first, then the first officer
    input_set: "FlightLegs with status IN {SCHEDULED, DISPATCHED, COMPLETED} on which the crew member is captain or first officer. CANCELLED_LESSEE, CANCELLED_LESSOR and DIVERTED legs are excluded, which is what makes cancellation an exact compensation for scheduling."
    constants:
      PRE_POST_DUTY_MINUTES: 105
      MAX_DUTY_MINUTES_7D: 3600
      MAX_BLOCK_MINUTES_28D: 5400
      DUTY_WINDOW_HOURS: 168
      BLOCK_WINDOW_HOURS: 672
    precision: "whole minutes; window boundaries compared to the millisecond"

  - name: return_discrepancy_cost
    trigger: "on POST /wetlease/return-conditions/{returnId}/inspect; writes ReturnCondition.discrepancy_cost_cents, ReturnCondition.billed_to_lessee_cents, LeaseAgreement.return_deposit_applied_cents and LeaseAgreement.return_deposit_remaining_cents"
    algorithm: waterfall_allocation
    formula: |
      hours_over  = max(0, hours_since_check_at_return  - lease.return_hours_since_check_max)
      cycles_over = max(0, cycles_since_check_at_return - lease.return_cycles_since_check_max)
      fuel_short  = max(0, lease.return_fuel_kg_required - fuel_on_board_kg)

      airframe_component = round_half_up(hours_over  * HOURS_OVER_RATE_CENTS)
      cycles_component   = cycles_over * CYCLES_OVER_RATE_CENTS
      fuel_component     = fuel_short  * FUEL_RATE_CENTS_PER_KG
      raw = airframe_component + cycles_component + fuel_component

      capped = min(raw, lease.return_liability_cap_cents)
      if raw == 0 and len(discrepancy_codes) == 0:
          discrepancy_cost_cents = 0
      else:
          # a recorded discrepancy code always attracts at least the minimum fee
          discrepancy_cost_cents = max(capped, MIN_DISCREPANCY_FEE_CENTS)

      # waterfall: the maintenance reserve deposit absorbs the charge first, the
      # remainder is billed. Always recomputed from the FULL deposit, so
      # re-inspection cannot double-draw.
      return_deposit_applied_cents   = min(discrepancy_cost_cents, lease.return_deposit_cents)
      return_deposit_remaining_cents = lease.return_deposit_cents - return_deposit_applied_cents
      billed_to_lessee_cents         = discrepancy_cost_cents - return_deposit_applied_cents
    input_set: "The single ReturnCondition being inspected plus its LeaseAgreement's contractual return ceilings. The deposit waterfall always starts from lease.return_deposit_cents, never from the surviving remainder of an earlier inspection."
    constants:
      HOURS_OVER_RATE_CENTS: 2500
      CYCLES_OVER_RATE_CENTS: 18000
      FUEL_RATE_CENTS_PER_KG: 95
      MIN_DISCREPANCY_FEE_CENTS: 250000
    precision: "whole cents, round_half_up on the airframe-hours component only (the other two multiply integers)"

  - name: lessee_outstanding_balance
    trigger: "on SettlementInvoice APPROVED -> ISSUED and ISSUED -> VOID; writes Lessee.outstanding_balance_usd_cents"
    algorithm: aggregation
    formula: |
      # Named conserved quantity, pinned as a formula over entity fields:
      Lessee.outstanding_balance_usd_cents ==
          sum( i.amount_cents
               for i in SettlementInvoice
               if i.status == "ISSUED"
               and LeaseAgreement(i.lease_id).lessee_id == Lessee.id )

      # maintained incrementally:
      #   APPROVED -> ISSUED : outstanding_balance_usd_cents += invoice.amount_cents
      #   ISSUED   -> VOID   : outstanding_balance_usd_cents -= invoice.amount_cents
      # PREPARED -> VOID and APPROVED -> VOID leave the balance untouched.
    input_set: "SettlementInvoice rows with status == ISSUED whose lease belongs to this Lessee. PREPARED, APPROVED and VOID invoices are excluded."
    constants: {}
    precision: "whole cents; no rounding occurs"

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority order)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the §1.5 roles list for this endpoint"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body contains every required field, every enum value is a declared member, numbers respect their sign/range constraints, ISO-8601 datetimes and YYYY-MM-DD dates parse, and scheduled_in > scheduled_out"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every GET list endpoint"

  - priority: 10
    category: existence
    check: "lessee_id in path or body resolves to a Lessee row"
    error_id: ERR_LESSEE_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/lessees/{lesseeId}, POST /wetlease/lessees/{lesseeId}/suspend, POST /wetlease/lessees/{lesseeId}/reinstate, POST /wetlease/leases, GET /wetlease/leases"

  - priority: 11
    category: existence
    check: "aircraft ids in path or body (aircraftId, primary_aircraft_id, original_aircraft_id, substitute_aircraft_id, aircraft_id) resolve to Aircraft rows, validated left-to-right in the order the fields are declared in §1.5 input"
    error_id: ERR_AIRCRAFT_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/aircraft/{aircraftId}, POST /wetlease/aircraft/{aircraftId}/maintenance-events, POST /wetlease/leases, POST /wetlease/flight-legs, POST /wetlease/substitutions, POST /wetlease/reliability-reports"

  - priority: 12
    category: existence
    check: "leaseId in path or lease_id in body resolves to a LeaseAgreement row"
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying leaseId or lease_id"

  - priority: 13
    category: existence
    check: "crewMemberId, captain_id and first_officer_id resolve to CrewMember rows"
    error_id: ERR_CREW_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/crew-members/{crewMemberId}, POST /wetlease/crew-qualifications, POST /wetlease/flight-legs"

  - priority: 14
    category: existence
    check: "qualificationId resolves to a CrewQualification row"
    error_id: ERR_QUALIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/crew-qualifications/{qualificationId}, POST /wetlease/crew-qualifications/{qualificationId}/complete-checkride"

  - priority: 15
    category: existence
    check: "approvalId resolves to a RegulatoryApproval row"
    error_id: ERR_APPROVAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /wetlease/regulatory-approvals/{approvalId}/decision, .../clear-conditions, .../revoke"

  - priority: 16
    category: existence
    check: "certificateId resolves to an InsuranceCertificate row"
    error_id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /wetlease/insurance-certificates/{certificateId}/revoke"

  - priority: 17
    category: existence
    check: "legId in path and repositioning_leg_id in body resolve to FlightLeg rows"
    error_id: ERR_FLIGHT_LEG_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/flight-legs/{legId}, POST /wetlease/flight-legs/{legId}/dispatch, .../complete, .../cancel, POST /wetlease/return-conditions/{returnId}/close"

  - priority: 18
    category: existence
    check: "substitutionId resolves to an AircraftSubstitution row"
    error_id: ERR_SUBSTITUTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/substitutions/{substitutionId}, POST /wetlease/substitutions/{substitutionId}/consent, .../effectuate"

  - priority: 19
    category: existence
    check: "periodId in path and period_id in body resolve to a UtilizationPeriod row"
    error_id: ERR_PERIOD_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/utilization-periods/{periodId}, GET /wetlease/utilization-periods/{periodId}/settlement-preview, POST /wetlease/utilization-periods/{periodId}/close, .../dispute, .../resolve-dispute, POST /wetlease/settlement-invoices"

  - priority: 20
    category: existence
    check: "invoiceId resolves to a SettlementInvoice row"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/settlement-invoices/{invoiceId}, POST /wetlease/settlement-invoices/{invoiceId}/approve, .../issue, .../void"

  - priority: 21
    category: existence
    check: "reportId resolves to a ReliabilityReport row"
    error_id: ERR_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/reliability-reports/{reportId}, POST /wetlease/reliability-reports/{reportId}/review"

  - priority: 22
    category: existence
    check: "returnId resolves to a ReturnCondition row"
    error_id: ERR_RETURN_CONDITION_NOT_FOUND
    http_status: 404
    applies_to: "GET /wetlease/return-conditions/{returnId}, POST /wetlease/return-conditions/{returnId}/inspect, .../close"

  - priority: 25
    category: auth
    check: "when X-User-Role == Lessee, X-User-ID must equal the lessee_id of the LeaseAgreement that owns the target resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /wetlease/substitutions/{substitutionId}/consent, POST /wetlease/utilization-periods/{periodId}/dispute, POST /wetlease/reliability-reports/{reportId}/review, and every GET where the acting role is Lessee"

  - priority: 28
    category: business_constraint
    check: "Lessee.status == ACTIVE for the lease's lessee"
    error_id: ERR_LESSEE_SUSPENDED
    http_status: 403
    applies_to: "POST /wetlease/leases/{leaseId}/submit-for-approval, POST /wetlease/leases/{leaseId}/activate, POST /wetlease/flight-legs"

  - priority: 30
    category: state
    check: "expected_period_version equals the current UtilizationPeriod.version"
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412
    applies_to: "POST /wetlease/settlement-invoices"

  - priority: 31
    category: state
    check: "expected_lease_version equals the current LeaseAgreement.version"
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    applies_to: "POST /wetlease/substitutions"

  - priority: 40
    category: state
    check: "UtilizationPeriod.status == PENDING_SETTLEMENT before an invoice may be prepared against it"
    error_id: ERR_PERIOD_NOT_READY_FOR_SETTLEMENT
    http_status: 409
    applies_to: "POST /wetlease/settlement-invoices"

  - priority: 39
    category: state
    check: "Lessee.status is a declared `from:` state of the requested transition (ACTIVE for suspend, SUSPENDED for reinstate)"
    error_id: ERR_LESSEE_INVALID_STATE
    http_status: 409
    applies_to: "POST /wetlease/lessees/{lesseeId}/suspend, POST /wetlease/lessees/{lesseeId}/reinstate"

  - priority: 41
    category: state
    check: "LeaseAgreement.status is a declared `from:` state of the requested transition"
    error_id: ERR_LEASE_INVALID_STATE
    http_status: 409
    applies_to: "POST /wetlease/leases/{leaseId}/submit-for-approval, .../activate, .../terminate, POST /wetlease/insurance-certificates, POST /wetlease/substitutions, POST /wetlease/flight-legs, POST /wetlease/reliability-reports"

  - priority: 42
    category: state
    check: "RegulatoryApproval.determination is a declared `from:` state of the requested transition"
    error_id: ERR_APPROVAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /wetlease/regulatory-approvals/{approvalId}/decision, .../clear-conditions, .../revoke"

  - priority: 43
    category: state
    check: "FlightLeg.status is a declared `from:` state of the requested transition"
    error_id: ERR_LEG_INVALID_STATE
    http_status: 409
    applies_to: "POST /wetlease/flight-legs/{legId}/dispatch, .../complete, .../cancel"

  - priority: 44
    category: state
    check: "AircraftSubstitution.status is a declared `from:` state of the requested transition, with one deliberate exception: an effectuate on a LESSEE_CONSENT_PENDING substitution whose lease has substitution_rights == LESSEE_CONSENT_REQUIRED passes this check and falls through to priority 68, which reports the specific ERR_SUBSTITUTION_CONSENT_REQUIRED; every other undeclared source state (REQUESTED, REJECTED, EFFECTIVE, WITHDRAWN for effectuate; anything other than LESSEE_CONSENT_PENDING for consent) is reported here"
    error_id: ERR_SUBSTITUTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /wetlease/substitutions/{substitutionId}/consent, .../effectuate"

  - priority: 45
    category: state
    check: "SettlementInvoice.status is a declared `from:` state of the requested transition"
    error_id: ERR_INVOICE_INVALID_STATE
    http_status: 409
    applies_to: "POST /wetlease/settlement-invoices/{invoiceId}/approve, .../issue, .../void"

  - priority: 46
    category: state
    check: "UtilizationPeriod.status is a declared `from:` state of the requested transition, and closing requires that no FlightLeg with scheduled_out inside period_month has status IN {SCHEDULED, DISPATCHED}"
    error_id: ERR_PERIOD_INVALID_STATE
    http_status: 409
    applies_to: "POST /wetlease/utilization-periods/{periodId}/close, .../dispute, .../resolve-dispute"

  - priority: 47
    category: state
    check: "for inspect, ReturnCondition.status IN {PENDING_INSPECTION, DISCREPANCIES_OPEN}; for close, ReturnCondition.status IN {CLEARED, DISCREPANCIES_OPEN}. A close attempted from DISCREPANCIES_OPEN passes this check deliberately and falls through to priority 74, which reports the specific ERR_RETURN_DISCREPANCIES_OPEN; a close from PENDING_INSPECTION or the terminal CLOSED is reported here"
    error_id: ERR_RETURN_CONDITION_INVALID_STATE
    http_status: 409
    applies_to: "POST /wetlease/return-conditions/{returnId}/inspect, .../close"

  - priority: 48
    category: state
    check: "Aircraft.status == ASSIGNED for dispatch; Aircraft.status IN {AVAILABLE, ASSIGNED} for a GROUND_* maintenance event; Aircraft.status IN {IN_MAINTENANCE, AOG} for RETURN_TO_SERVICE; Aircraft.status IN {AVAILABLE, IN_MAINTENANCE, AOG} with assigned_lease_id IS NULL for RETIRE; for activate, either Aircraft.status == AVAILABLE with assigned_lease_id IS NULL (first activation) or Aircraft.status == ASSIGNED with assigned_lease_id == lease.id (reactivation of a SUSPENDED lease, where the airframe never left the lease)"
    error_id: ERR_AIRCRAFT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /wetlease/flight-legs/{legId}/dispatch, POST /wetlease/aircraft/{aircraftId}/maintenance-events, POST /wetlease/leases/{leaseId}/activate"

  - priority: 50
    category: business_safety
    check: "both crew members hold the operating Aircraft.type_designator in their type_ratings array, and CrewMember.status == ACTIVE"
    error_id: ERR_CREW_NOT_TYPE_RATED
    http_status: 422
    applies_to: "POST /wetlease/flight-legs, POST /wetlease/flight-legs/{legId}/dispatch"

  - priority: 52
    category: business_safety
    check: "projected_duty_minutes_7d <= 3600 for the captain, then for the first officer, per calculations.crew_duty_and_block_exposure (exactly 3600 is admissible)"
    error_id: ERR_CREW_DUTY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /wetlease/flight-legs, POST /wetlease/flight-legs/{legId}/dispatch"

  - priority: 53
    category: business_safety
    check: "projected_block_minutes_28d <= 5400 for the captain, then for the first officer (exactly 5400 is admissible)"
    error_id: ERR_CREW_BLOCK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /wetlease/flight-legs, POST /wetlease/flight-legs/{legId}/dispatch"

  - priority: 54
    category: business_referential
    check: "a CrewQualification with status == QUALIFIED exists for (captain_id, lease_id) and for (first_officer_id, lease_id)"
    error_id: ERR_CREW_NOT_QUALIFIED_FOR_LESSEE_PROCEDURES
    http_status: 409
    applies_to: "POST /wetlease/flight-legs, POST /wetlease/flight-legs/{legId}/dispatch"

  - priority: 56
    category: business_safety
    check: "the lease owns a RegulatoryApproval whose determination IN {APPROVED, CONDITIONAL} and whose expires_on is NULL or >= date(clock_now)"
    error_id: ERR_REGULATORY_APPROVAL_MISSING
    http_status: 409
    applies_to: "POST /wetlease/leases/{leaseId}/activate"

  - priority: 57
    category: business_safety
    check: "operational_control == LESSOR whenever crew_provided_by == LESSOR and maintenance_provided_by == LESSOR; the LESSEE/LESSOR mixture is not a lawful wet lease"
    error_id: ERR_OPERATIONAL_CONTROL_MISMATCH
    http_status: 422
    applies_to: "POST /wetlease/leases, POST /wetlease/leases/{leaseId}/submit-for-approval"

  - priority: 58
    category: business_safety
    check: "an InsuranceCertificate on the lease has status == ACTIVE, additional_insured_lessee == true, breach_of_warranty_endorsed == true, and covers the relevant instant inside its closed [effective_from, expires_at] interval"
    error_id: ERR_INSURANCE_COVERAGE_MISSING
    http_status: 409
    applies_to: "POST /wetlease/leases/{leaseId}/activate, POST /wetlease/flight-legs/{legId}/dispatch"

  - priority: 59
    category: business_constraint
    check: "hull_limit_usd_cents >= 5000000000 and liability_limit_usd_cents >= 50000000000"
    error_id: ERR_INSURANCE_LIMIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /wetlease/insurance-certificates"

  - priority: 60
    category: business_temporal
    check: "date(scheduled_out) >= LeaseAgreement.term_start_date AND date(scheduled_in) <= LeaseAgreement.term_end_date"
    error_id: ERR_LEG_OUTSIDE_LEASE_TERM
    http_status: 422
    applies_to: "POST /wetlease/flight-legs"

  - priority: 62
    category: business_temporal
    check: "the candidate leg's HALF-OPEN interval [scheduled_out, scheduled_in) must not intersect any existing leg on the same aircraft_id (status IN {SCHEDULED, DISPATCHED, COMPLETED}) whose occupancy is that leg's [scheduled_out - 45min, scheduled_in + 45min) HALF-OPEN window; intersection holds iff cand_out < occ_end AND occ_start < cand_in, so a candidate starting exactly at occ_end does NOT conflict"
    error_id: ERR_AIRCRAFT_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /wetlease/flight-legs"

  - priority: 63
    category: business_temporal
    check: "the new certificate's CLOSED interval [effective_from, expires_at] must not overlap any existing InsuranceCertificate on the same lease with status == ACTIVE; overlap holds iff new.effective_from <= old.expires_at AND old.effective_from <= new.expires_at, so intervals that merely touch at a single instant DO conflict (no buffer, closed both ends)"
    error_id: ERR_INSURANCE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /wetlease/insurance-certificates"

  - priority: 65
    category: business_constraint
    check: "tail_number is not already used by another Aircraft row"
    error_id: ERR_DUPLICATE_TAIL_NUMBER
    http_status: 409
    applies_to: "POST /wetlease/aircraft"

  - priority: 66
    category: business_constraint
    check: "Aircraft.maintenance_program_ref == LeaseAgreement.required_maintenance_program_ref for the airframe being put on lease"
    error_id: ERR_MAINTENANCE_PROGRAM_MISALIGNED
    http_status: 422
    applies_to: "POST /wetlease/leases/{leaseId}/activate, POST /wetlease/substitutions, POST /wetlease/substitutions/{substitutionId}/effectuate"

  - priority: 67
    category: business_constraint
    check: "a client-supplied substitute_aircraft_id must have type_family == original.type_family (the VARIANT designator may differ, which is what makes the crew-rating cascade reachable), seat_count >= original.seat_count - 5, status == AVAILABLE, assigned_lease_id IS NULL and hours_since_last_check <= 400.00"
    error_id: ERR_SUBSTITUTION_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /wetlease/substitutions"

  - priority: 68
    category: business_constraint
    check: "the acting role may take the consent decision only on a lease whose substitution_rights == LESSEE_CONSENT_REQUIRED; a LessorOpsController may never move a LESSEE_CONSENT_PENDING substitution to APPROVED"
    error_id: ERR_SUBSTITUTION_CONSENT_REQUIRED
    http_status: 403
    applies_to: "POST /wetlease/substitutions/{substitutionId}/effectuate"

  - priority: 69
    category: business_constraint
    check: "when substitute_aircraft_id is omitted, calculations.substitute_aircraft_selection must yield a non-empty candidate pool"
    error_id: ERR_NO_SUBSTITUTE_AIRCRAFT_AVAILABLE
    http_status: 409
    applies_to: "POST /wetlease/substitutions"

  - priority: 70
    category: business_referential
    check: "a ReliabilityReport with status == ACCEPTED exists for (invoice.lease_id, UtilizationPeriod.period_month)"
    error_id: ERR_RELIABILITY_REPORT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /wetlease/settlement-invoices/{invoiceId}/approve"

  - priority: 71
    category: business_constraint
    check: "X-User-ID differs from SettlementInvoice.prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /wetlease/settlement-invoices/{invoiceId}/approve"

  - priority: 72
    category: business_fiscal
    check: "Lessee.outstanding_balance_usd_cents + the amount being invoiced <= Lessee.credit_limit_usd_cents"
    error_id: ERR_LESSEE_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /wetlease/settlement-invoices, POST /wetlease/settlement-invoices/{invoiceId}/issue"

  - priority: 74
    category: business_constraint
    check: "ReturnCondition.status == CLEARED (discrepancies must not remain open) before closure"
    error_id: ERR_RETURN_DISCREPANCIES_OPEN
    http_status: 409
    applies_to: "POST /wetlease/return-conditions/{returnId}/close"

  - priority: 75
    category: business_referential
    check: "repositioning_leg_id names a FlightLeg on the same lease with leg_class == REPOSITIONING, status == COMPLETED and dest_icao == LeaseAgreement.redelivery_icao"
    error_id: ERR_REPOSITIONING_LEG_INCOMPLETE
    http_status: 409
    applies_to: "POST /wetlease/return-conditions/{returnId}/close"

  - priority: 76
    category: business_fiscal
    check: "0 < disputed_amount_cents <= UtilizationPeriod.final_charge_cents"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /wetlease/utilization-periods/{periodId}/dispute"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Lessee -------------------------------------------------------------
  - method: POST
    path: "/wetlease/lessees"
    description: "Register a lessee (charter customer taking the ACMI capacity). outstanding_balance_usd_cents starts at 0."
    roles: [BillingAdmin]
    code: 201
    input: [name, icao_code, home_base_icao, credit_limit_usd_cents]
    output: Lessee
    side_effects: ["Lessee created with status ACTIVE and outstanding_balance_usd_cents 0"]

  - method: GET
    path: "/wetlease/lessees/{lesseeId}"
    description: "Fetch one lessee including its recomputed outstanding_balance_usd_cents."
    roles: [BillingAdmin, LessorOpsController, Lessee]
    code: 200
    input: []
    output: Lessee
    side_effects: []

  - method: POST
    path: "/wetlease/lessees/{lesseeId}/suspend"
    description: "Credit-control suspension of a lessee. Forward-looking only: no new lease submission, activation or flight leg is admitted for this lessee while suspended."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Lessee
    side_effects:
      - "Lessee ACTIVE -> SUSPENDED"
      - "increments Lessee.version by 1"

  - method: POST
    path: "/wetlease/lessees/{lesseeId}/reinstate"
    description: "Lift a credit-control suspension, restoring the lessee to ACTIVE."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Lessee
    side_effects:
      - "Lessee SUSPENDED -> ACTIVE"
      - "increments Lessee.version by 1"

  # ---- Aircraft -----------------------------------------------------------
  - method: POST
    path: "/wetlease/aircraft"
    description: "Add an airframe to the lessor fleet. Starts AVAILABLE with assigned_lease_id NULL."
    roles: [MaintenanceController]
    code: 201
    input: [tail_number, type_designator, type_family, seat_count, mtow_kg, maintenance_program_ref, airframe_hours_total, hours_since_last_check, cycles_since_last_check]
    output: Aircraft
    side_effects: ["Aircraft created with status AVAILABLE"]

  - method: GET
    path: "/wetlease/aircraft/{aircraftId}"
    description: "Fetch one airframe with its current maintenance counters and lease assignment."
    roles: [MaintenanceController, LessorOpsController, Lessee]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  - method: GET
    path: "/wetlease/aircraft"
    description: "List airframes ordered by created_at ASC. assigned_lease_id filter provides FK reverse reachability from LeaseAgreement.id."
    roles: [MaintenanceController, LessorOpsController, Lessee]
    code: 200
    input: ["assigned_lease_id?", "status?", "type_designator?", "type_family?", "limit?", "offset?"]
    output: Aircraft[]
    side_effects: []

  - method: POST
    path: "/wetlease/aircraft/{aircraftId}/maintenance-events"
    description: "Record a maintenance event on the airframe. event_type is one of GROUND_SCHEDULED, GROUND_AOG, RETURN_TO_SERVICE, RETIRE."
    roles: [MaintenanceController]
    code: 200
    input: [event_type, "note?"]
    output: Aircraft
    side_effects:
      - "GROUND_SCHEDULED -> Aircraft.status = IN_MAINTENANCE; GROUND_AOG -> Aircraft.status = AOG"
      - "GROUND_AOG on an airframe with assigned_lease_id set cascades: owning LeaseAgreement ACTIVE -> SUSPENDED with suspension_reason AIRFRAME_AOG, and every FlightLeg on that airframe with status IN {SCHEDULED, DISPATCHED} -> CANCELLED_LESSOR with cancel_reason TECHNICAL"
      - "cancelled legs recompute calculations.crew_duty_and_block_exposure for their captain and first officer and calculations.monthly_utilization_charge for the OPEN UtilizationPeriod covering scheduled_out"
      - "RETURN_TO_SERVICE -> Aircraft.status = ASSIGNED when assigned_lease_id is set, otherwise AVAILABLE; resets hours_since_last_check and cycles_since_last_check to 0"
      - "RETIRE -> Aircraft.status = RETIRED (terminal)"

  # ---- CrewMember ---------------------------------------------------------
  - method: POST
    path: "/wetlease/crew-members"
    description: "Register a lessor crew member. Rolling duty and block exposure both start at 0."
    roles: [LessorOpsController]
    code: 201
    input: [full_name, employee_no, crew_role, type_ratings]
    output: CrewMember
    side_effects: ["CrewMember created with status ACTIVE"]

  - method: GET
    path: "/wetlease/crew-members/{crewMemberId}"
    description: "Fetch one crew member with rolling_duty_minutes_7d and rolling_block_minutes_28d recomputed against the current logical clock."
    roles: [LessorOpsController, MaintenanceController]
    code: 200
    input: []
    output: CrewMember
    side_effects: ["recomputes calculations.crew_duty_and_block_exposure for this crew member"]

  # ---- LeaseAgreement -----------------------------------------------------
  - method: POST
    path: "/wetlease/leases"
    description: "Draft an ACMI wet lease naming the aircraft, the crew/maintenance/insurance responsibility split, block-hour price and minimum guaranteed hours."
    roles: [LessorOpsController]
    code: 201
    input: [lessee_id, primary_aircraft_id, term_start_date, term_end_date, block_hour_rate_usd_cents, min_guaranteed_block_hours_per_month, shortfall_credit_pct, crew_provided_by, maintenance_provided_by, insurance_provided_by, operational_control, substitution_rights, reliability_basis, required_maintenance_program_ref, return_hours_since_check_max, return_cycles_since_check_max, return_fuel_kg_required, return_liability_cap_cents, return_deposit_cents, redelivery_icao]
    output: LeaseAgreement
    side_effects: ["LeaseAgreement created with status DRAFT, suspension_reason NULL, lifetime_credited_block_minutes 0, return_deposit_applied_cents 0 and return_deposit_remaining_cents = return_deposit_cents"]

  - method: GET
    path: "/wetlease/leases/{leaseId}"
    description: "Fetch one lease agreement."
    roles: [LessorOpsController, BillingAdmin, MaintenanceController, RegulatoryAuthority, InsuranceUnderwriter, Lessee]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects: []

  - method: GET
    path: "/wetlease/leases"
    description: "List lease agreements ordered by created_at ASC. lessee_id and primary_aircraft_id filters provide FK reverse reachability."
    roles: [LessorOpsController, BillingAdmin, RegulatoryAuthority, Lessee]
    code: 200
    input: ["lessee_id?", "primary_aircraft_id?", "status?", "limit?", "offset?"]
    output: LeaseAgreement[]
    side_effects: []

  - method: POST
    path: "/wetlease/leases/{leaseId}/submit-for-approval"
    description: "File the arrangement with the authority for an operational-control determination. Creates the RegulatoryApproval docket."
    roles: [LessorOpsController]
    code: 201
    input: [authority_docket_no]
    output: RegulatoryApproval
    side_effects:
      - "LeaseAgreement DRAFT -> PENDING_REGULATORY_APPROVAL"
      - "when the lease owns no prior docket, a RegulatoryApproval is created with determination UNDER_REVIEW, review_round 1, conditions [] and open_condition_codes []"
      - "when the lease already owns a DENIED RegulatoryApproval, that docket is refiled in place: determination DENIED -> UNDER_REVIEW, review_round incremented by 1, conditions and open_condition_codes reset to [], decided_at cleared, and authority_docket_no overwritten with the supplied value"

  - method: GET
    path: "/wetlease/regulatory-approvals/{approvalId}"
    description: "Fetch one regulatory-approval docket with its open condition codes and review round."
    roles: [RegulatoryAuthority, LessorOpsController, Lessee]
    code: 200
    input: []
    output: RegulatoryApproval
    side_effects: []

  - method: GET
    path: "/wetlease/regulatory-approvals"
    description: "List regulatory-approval dockets ordered by created_at ASC. lease_id filter provides FK reverse reachability."
    roles: [RegulatoryAuthority, LessorOpsController, Lessee]
    code: 200
    input: ["lease_id?", "determination?", "limit?", "offset?"]
    output: RegulatoryApproval[]
    side_effects: []

  - method: GET
    path: "/wetlease/insurance-certificates/{certificateId}"
    description: "Fetch one insurance certificate with its hull and liability limits and coverage window."
    roles: [InsuranceUnderwriter, LessorOpsController, Lessee]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: []

  - method: GET
    path: "/wetlease/insurance-certificates"
    description: "List insurance certificates ordered by created_at ASC. lease_id filter provides FK reverse reachability."
    roles: [InsuranceUnderwriter, LessorOpsController, Lessee]
    code: 200
    input: ["lease_id?", "status?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  - method: GET
    path: "/wetlease/leases/{leaseId}/regulatory-approvals"
    description: "List the authority dockets filed against this lease, ordered by created_at ASC."
    roles: [RegulatoryAuthority, LessorOpsController, Lessee]
    code: 200
    input: ["limit?", "offset?"]
    output: RegulatoryApproval[]
    side_effects: []

  - method: GET
    path: "/wetlease/leases/{leaseId}/insurance-certificates"
    description: "List the insurance certificates attached to this lease, ordered by created_at ASC."
    roles: [InsuranceUnderwriter, LessorOpsController, Lessee]
    code: 200
    input: ["limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  - method: POST
    path: "/wetlease/leases/{leaseId}/activate"
    description: "Bring the lease into force: requires a live regulatory determination, conforming insurance and a maintenance-program-aligned airframe."
    roles: [LessorOpsController]
    code: 200
    input: []
    output: LeaseAgreement
    side_effects:
      - "LeaseAgreement APPROVED -> ACTIVE, or SUSPENDED -> ACTIVE once the suspension cause is cleared (suspension_reason set back to NULL)"
      - "primary aircraft status AVAILABLE -> ASSIGNED and Aircraft.assigned_lease_id = lease.id on first activation; on reactivation of a SUSPENDED lease the airframe is already ASSIGNED to this lease and is left unchanged"
      - "creates a UtilizationPeriod with status OPEN for the period_month containing max(term_start_date, date(clock_now)) if none exists"

  - method: POST
    path: "/wetlease/leases/{leaseId}/terminate"
    description: "Serve termination and open the return-conditions inspection record against the current on-lease airframe."
    roles: [LessorOpsController]
    code: 201
    input: [termination_reason]
    output: ReturnCondition
    side_effects:
      - "LeaseAgreement ACTIVE or SUSPENDED -> TERMINATING"
      - "every FlightLeg on the lease with status == SCHEDULED and leg_class == REVENUE -> CANCELLED_LESSOR with cancel_reason COMMERCIAL"
      - "cancelled legs recompute crew exposure and the covering UtilizationPeriod charge"
      - "the lease's OPEN UtilizationPeriod, if any, moves OPEN -> PENDING_SETTLEMENT and is recomputed under the FINAL variant"
      - "ReturnCondition created with status PENDING_INSPECTION, discrepancy_codes [], discrepancy_cost_cents 0 and billed_to_lessee_cents 0"

  # ---- RegulatoryApproval -------------------------------------------------
  - method: POST
    path: "/wetlease/leases/{leaseId}/withdraw"
    description: "Withdraw a lease that never entered service (DRAFT, PENDING_REGULATORY_APPROVAL or APPROVED), revoking any live docket. Terminal."
    roles: [LessorOpsController]
    code: 200
    input: [withdrawal_reason]
    output: LeaseAgreement
    side_effects:
      - "LeaseAgreement DRAFT, PENDING_REGULATORY_APPROVAL or APPROVED -> WITHDRAWN (terminal)"
      - "every RegulatoryApproval on the lease whose determination IN {UNDER_REVIEW, CONDITIONAL, APPROVED} -> REVOKED"
      - "every CrewQualification on the lease with status == QUALIFIED -> REVOKED"
      - "any Aircraft assigned to the lease has assigned_lease_id cleared and status ASSIGNED -> AVAILABLE"

  - method: POST
    path: "/wetlease/regulatory-approvals/{approvalId}/decision"
    description: "Authority records a determination on the docket. determination is APPROVED, CONDITIONAL or DENIED."
    roles: [RegulatoryAuthority]
    code: 200
    input: [determination, "conditions?", "expires_on?"]
    output: RegulatoryApproval
    side_effects:
      - "RegulatoryApproval UNDER_REVIEW -> APPROVED, CONDITIONAL or DENIED; decided_at = clock_now"
      - "CONDITIONAL copies conditions into open_condition_codes; APPROVED requires conditions to be empty or absent"
      - "APPROVED or CONDITIONAL moves LeaseAgreement PENDING_REGULATORY_APPROVAL -> APPROVED"
      - "DENIED moves LeaseAgreement PENDING_REGULATORY_APPROVAL -> DRAFT so the arrangement can be restructured and refiled"

  - method: POST
    path: "/wetlease/regulatory-approvals/{approvalId}/clear-conditions"
    description: "Authority clears named condition codes; clearing the last open condition upgrades CONDITIONAL to APPROVED."
    roles: [RegulatoryAuthority]
    code: 200
    input: [cleared_condition_codes]
    output: RegulatoryApproval
    side_effects:
      - "removes the named codes from open_condition_codes"
      - "when open_condition_codes becomes empty, RegulatoryApproval CONDITIONAL -> APPROVED"

  - method: POST
    path: "/wetlease/regulatory-approvals/{approvalId}/revoke"
    description: "Authority revokes the determination, suspending the lease and stopping revenue flying."
    roles: [RegulatoryAuthority]
    code: 200
    input: [revocation_reason]
    output: RegulatoryApproval
    side_effects:
      - "RegulatoryApproval APPROVED or CONDITIONAL -> REVOKED"
      - "LeaseAgreement ACTIVE -> SUSPENDED with suspension_reason REGULATORY_APPROVAL_REVOKED"
      - "every FlightLeg on the lease with status IN {SCHEDULED, DISPATCHED} -> CANCELLED_LESSOR with cancel_reason REGULATORY"
      - "cancelled legs recompute crew exposure and the covering UtilizationPeriod charge"

  # ---- InsuranceCertificate ----------------------------------------------
  - method: POST
    path: "/wetlease/insurance-certificates"
    description: "Attach a certificate of insurance evidencing hull and liability limits with the lessee as additional insured."
    roles: [InsuranceUnderwriter]
    code: 201
    input: [lease_id, certificate_no, hull_limit_usd_cents, liability_limit_usd_cents, breach_of_warranty_endorsed, additional_insured_lessee, effective_from, expires_at]
    output: InsuranceCertificate
    side_effects:
      - "InsuranceCertificate created with status ACTIVE and revocation_reason NULL"
      - "when the lease is SUSPENDED with suspension_reason == INSURANCE_LAPSED and a prior certificate is still ACTIVE, that prior certificate moves ACTIVE -> SUPERSEDED"
      - "the lease is NOT auto-reactivated by this call alone; LeaseAgreement SUSPENDED -> ACTIVE requires POST /wetlease/leases/{leaseId}/activate"

  - method: POST
    path: "/wetlease/insurance-certificates/{certificateId}/revoke"
    description: "Underwriter pulls cover. Head of the four-level insurance-lapse cascade."
    roles: [InsuranceUnderwriter]
    code: 200
    input: [revocation_reason]
    output: InsuranceCertificate
    side_effects:
      - "InsuranceCertificate ACTIVE -> REVOKED"
      - "when no other ACTIVE certificate covers the lease at clock_now, LeaseAgreement ACTIVE -> SUSPENDED with suspension_reason INSURANCE_LAPSED"
      - "on that suspension every FlightLeg on the lease with status IN {SCHEDULED, DISPATCHED} -> CANCELLED_LESSOR with cancel_reason INSURANCE"
      - "each cancelled leg recomputes calculations.crew_duty_and_block_exposure for its captain and first officer and calculations.monthly_utilization_charge for the OPEN UtilizationPeriod covering its scheduled_out"

  # ---- CrewQualification --------------------------------------------------
  - method: POST
    path: "/wetlease/crew-qualifications"
    description: "Enrol a crew member in the lessee-procedures differences training for a specific lease."
    roles: [LessorOpsController]
    code: 201
    input: [crew_member_id, lease_id]
    output: CrewQualification
    side_effects: ["CrewQualification created with status TRAINING"]

  - method: GET
    path: "/wetlease/crew-qualifications/{qualificationId}"
    description: "Fetch one crew qualification record."
    roles: [LessorOpsController, MaintenanceController, Lessee]
    code: 200
    input: []
    output: CrewQualification
    side_effects: []

  - method: GET
    path: "/wetlease/crew-qualifications"
    description: "List crew qualifications ordered by created_at ASC. crew_member_id and lease_id filters provide FK reverse reachability."
    roles: [LessorOpsController, MaintenanceController, Lessee]
    code: 200
    input: ["crew_member_id?", "lease_id?", "status?", "limit?", "offset?"]
    output: CrewQualification[]
    side_effects: []

  - method: POST
    path: "/wetlease/crew-qualifications/{qualificationId}/complete-checkride"
    description: "Record the differences-training checkride, qualifying (or requalifying) the crew member on the lessee's procedures."
    roles: [LessorOpsController]
    code: 200
    input: [differences_training_completed_on, checkride_valid_until]
    output: CrewQualification
    side_effects:
      - "CrewQualification TRAINING -> QUALIFIED, or EXPIRED -> QUALIFIED on requalification (cyclic)"
      - "when checkride_valid_until < date(clock_now) the record is stored and immediately set to EXPIRED instead of QUALIFIED"

  # ---- FlightLeg ----------------------------------------------------------
  - method: POST
    path: "/wetlease/flight-legs"
    description: "Schedule a leg under the lease. Runs the full crew/airframe/term admission ladder including the 45-minute-buffered aircraft occupancy check."
    roles: [LessorOpsController]
    code: 201
    input: [lease_id, aircraft_id, captain_id, first_officer_id, origin_icao, dest_icao, leg_class, scheduled_out, scheduled_in]
    output: FlightLeg
    side_effects:
      - "FlightLeg created with status SCHEDULED and billing_state UNBILLED"
      - "scheduled_block_minutes = floor((scheduled_in - scheduled_out) in whole minutes) per calculations.leg_billable_block_minutes"
      - "recomputes calculations.crew_duty_and_block_exposure for the captain and the first officer"

  - method: GET
    path: "/wetlease/flight-legs/{legId}"
    description: "Fetch one leg with its computed block and billable-block minutes."
    roles: [LessorOpsController, MaintenanceController, BillingAdmin, Lessee]
    code: 200
    input: []
    output: FlightLeg
    side_effects: []

  - method: GET
    path: "/wetlease/flight-legs"
    description: "List legs ordered by created_at ASC. lease_id, aircraft_id, captain_id and first_officer_id filters provide FK reverse reachability for all four FKs."
    roles: [LessorOpsController, MaintenanceController, BillingAdmin, Lessee]
    code: 200
    input: ["lease_id?", "aircraft_id?", "captain_id?", "first_officer_id?", "status?", "billing_state?", "limit?", "offset?"]
    output: FlightLeg[]
    side_effects: []

  - method: POST
    path: "/wetlease/flight-legs/{legId}/dispatch"
    description: "Release the leg for departure. Re-runs crew, airframe, insurance and qualification gates at the dispatch instant."
    roles: [LessorOpsController]
    code: 200
    input: [actual_out]
    output: FlightLeg
    side_effects:
      - "FlightLeg SCHEDULED -> DISPATCHED"
      - "sets actual_out"

  - method: POST
    path: "/wetlease/flight-legs/{legId}/complete"
    description: "Close out the leg on block-in, converting actual block time into billable block minutes and crediting the period."
    roles: [LessorOpsController]
    code: 200
    input: [actual_in, "technical_delay_minutes?"]
    output: FlightLeg
    side_effects:
      - "FlightLeg DISPATCHED -> COMPLETED"
      - "block_minutes and billable_block_minutes recomputed per calculations.leg_billable_block_minutes"
      - "Aircraft.airframe_hours_total, hours_since_last_check and cycles_since_last_check incremented"
      - "LeaseAgreement.lifetime_credited_block_minutes incremented by billable_block_minutes"
      - "recomputes calculations.crew_duty_and_block_exposure for the captain and the first officer"
      - "recomputes the OPEN UtilizationPeriod covering scheduled_out via calculations.monthly_utilization_charge with the PROVISIONAL variant"

  - method: POST
    path: "/wetlease/flight-legs/{legId}/cancel"
    description: "Cancel a scheduled or dispatched leg, attributing the cancellation to a party. Compensating side of the crew-exposure invariant."
    roles: [LessorOpsController]
    code: 200
    input: [cancelling_party, cancel_reason]
    output: FlightLeg
    side_effects:
      - "FlightLeg SCHEDULED or DISPATCHED -> CANCELLED_LESSEE when cancelling_party == LESSEE, or -> CANCELLED_LESSOR when cancelling_party == LESSOR"
      - "a DISPATCHED leg cancelled with cancel_reason == WEATHER goes to DIVERTED instead, which likewise contributes nothing to either charge variant"
      - "recomputes calculations.crew_duty_and_block_exposure for the captain and the first officer, releasing the cancelled leg's duty and block contribution"
      - "recomputes the OPEN UtilizationPeriod covering scheduled_out via calculations.monthly_utilization_charge"

  # ---- AircraftSubstitution ----------------------------------------------
  - method: POST
    path: "/wetlease/substitutions"
    description: "Request a substitute airframe. Omitting substitute_aircraft_id delegates the pick to calculations.substitute_aircraft_selection. Requires the caller's expected_lease_version."
    roles: [LessorOpsController]
    code: 201
    input: [lease_id, original_aircraft_id, reason, effective_from, expected_lease_version, "substitute_aircraft_id?", "consent_note?"]
    output: AircraftSubstitution
    side_effects:
      - "AircraftSubstitution created with selection_basis CLIENT_SPECIFIED when substitute_aircraft_id was supplied, otherwise SERVER_SELECTED with the winner chosen by calculations.substitute_aircraft_selection"
      - "seat_delta = substitute.seat_count - original.seat_count and repointed_leg_count = 0 at creation"
      - "status is APPROVED when LeaseAgreement.substitution_rights == LESSOR_UNILATERAL, otherwise LESSEE_CONSENT_PENDING"
      - "LeaseAgreement.version increments by 1"

  - method: GET
    path: "/wetlease/substitutions/{substitutionId}"
    description: "Fetch one substitution request."
    roles: [LessorOpsController, MaintenanceController, Lessee]
    code: 200
    input: []
    output: AircraftSubstitution
    side_effects: []

  - method: GET
    path: "/wetlease/substitutions"
    description: "List substitutions ordered by created_at ASC. lease_id, original_aircraft_id and substitute_aircraft_id filters provide FK reverse reachability for all three FKs."
    roles: [LessorOpsController, MaintenanceController, Lessee]
    code: 200
    input: ["lease_id?", "original_aircraft_id?", "substitute_aircraft_id?", "status?", "limit?", "offset?"]
    output: AircraftSubstitution[]
    side_effects: []

  - method: POST
    path: "/wetlease/substitutions/{substitutionId}/consent"
    description: "Lessee grants or withholds consent on a LESSEE_CONSENT_REQUIRED substitution."
    roles: [Lessee]
    code: 200
    input: [decision, "consent_note?"]
    output: AircraftSubstitution
    side_effects:
      - "AircraftSubstitution LESSEE_CONSENT_PENDING -> APPROVED when decision == GRANT, or -> REJECTED when decision == WITHHOLD"

  - method: POST
    path: "/wetlease/substitutions/{substitutionId}/effectuate"
    description: "Swap the airframe onto the lease and re-point the affected legs. Head of the four-level substitution cascade."
    roles: [LessorOpsController]
    code: 200
    input: []
    output: AircraftSubstitution
    side_effects:
      - "AircraftSubstitution APPROVED -> EFFECTIVE"
      - "original Aircraft.assigned_lease_id cleared and status ASSIGNED -> AVAILABLE unless it is IN_MAINTENANCE or AOG; substitute Aircraft.assigned_lease_id = lease.id and status AVAILABLE -> ASSIGNED"
      - "LeaseAgreement.primary_aircraft_id = substitute_aircraft_id"
      - "every FlightLeg on the lease with status == SCHEDULED, aircraft_id == original_aircraft_id and scheduled_out >= effective_from has aircraft_id re-pointed to the substitute; repointed_leg_count is set to the number re-pointed"
      - "any re-pointed leg whose captain or first officer lacks the substitute's type_designator in type_ratings is set to CANCELLED_LESSOR with cancel_reason CREW and crew_requalification_required true"
      - "each such cancellation recomputes calculations.crew_duty_and_block_exposure for that leg's crew and calculations.monthly_utilization_charge for the OPEN UtilizationPeriod covering its scheduled_out"

  # ---- UtilizationPeriod --------------------------------------------------
  - method: GET
    path: "/wetlease/utilization-periods/{periodId}"
    description: "Fetch one utilization period with its stored MGH, shortfall, overrun and charge components."
    roles: [BillingAdmin, LessorOpsController, Lessee]
    code: 200
    input: []
    output: UtilizationPeriod
    side_effects: []

  - method: GET
    path: "/wetlease/utilization-periods"
    description: "List utilization periods ordered by created_at ASC. lease_id filter provides FK reverse reachability."
    roles: [BillingAdmin, LessorOpsController, Lessee]
    code: 200
    input: ["lease_id?", "status?", "period_month?", "limit?", "offset?"]
    output: UtilizationPeriod[]
    side_effects: []

  - method: GET
    path: "/wetlease/utilization-periods/{periodId}/settlement-preview"
    description: "Computed read returning both variants of calculations.monthly_utilization_charge side by side plus the reliability penalty that would apply, without mutating the period."
    roles: [BillingAdmin, LessorOpsController, Lessee]
    code: 200
    input: []
    output: "{ period_id: string, period_month: string, mgh_effective_hours: number, provisional_credited_hours: number, provisional_gross_charge_cents: integer, final_credited_hours: number, final_shortfall_hours: number, final_overrun_hours: number, final_gross_charge_cents: integer, reliability_penalty_cents: integer, projected_final_charge_cents: integer }"
    side_effects: ["evaluates calculations.monthly_utilization_charge under both the PROVISIONAL and the FINAL variant and calculations.reliability_shortfall_penalty; persists nothing"]

  - method: POST
    path: "/wetlease/utilization-periods/{periodId}/close"
    description: "Close the month: rerun the charge under the FINAL variant, apply the reliability penalty and freeze the period for settlement."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: UtilizationPeriod
    side_effects:
      - "UtilizationPeriod OPEN -> PENDING_SETTLEMENT"
      - "recomputes every charge component with variant_applied FINAL per calculations.monthly_utilization_charge, then applies calculations.reliability_shortfall_penalty to obtain final_charge_cents"
      - "UtilizationPeriod.version increments by 1"

  - method: POST
    path: "/wetlease/utilization-periods/{periodId}/dispute"
    description: "Lessee disputes a settled month, reopening the billing cycle."
    roles: [Lessee]
    code: 200
    input: [dispute_reason, disputed_amount_cents]
    output: UtilizationPeriod
    side_effects:
      - "UtilizationPeriod SETTLED -> DISPUTED, storing dispute_reason and disputed_amount_cents"

  - method: POST
    path: "/wetlease/utilization-periods/{periodId}/resolve-dispute"
    description: "Billing resolves the dispute, either reopening the month for recomputation or reinstating the original settlement."
    roles: [BillingAdmin]
    code: 200
    input: [resolution]
    output: UtilizationPeriod
    side_effects:
      - "UtilizationPeriod DISPUTED -> REOPENED when resolution == REOPEN, or DISPUTED -> SETTLED when resolution == UPHOLD_SETTLEMENT"
      - "REOPEN voids every SettlementInvoice on this period with status == ISSUED, which decrements Lessee.outstanding_balance_usd_cents by each voided amount_cents; REOPENED is a resting state and a subsequent POST .../close returns it to PENDING_SETTLEMENT, closing the cycle back onto the settlement path without creating a following month's period"
      - "UPHOLD_SETTLEMENT clears disputed_amount_cents to 0 and keeps dispute_reason for audit"
      - "UtilizationPeriod.version increments by 1"

  # ---- SettlementInvoice --------------------------------------------------
  - method: POST
    path: "/wetlease/settlement-invoices"
    description: "Prepare the block-hour settlement invoice for a closed period. Requires the caller's expected_period_version so a period recomputed after the caller last read it is rejected."
    roles: [BillingAdmin]
    code: 201
    input: [period_id, expected_period_version, due_on, "variant?"]
    output: SettlementInvoice
    side_effects:
      - "SettlementInvoice created with status PREPARED, lease_id copied from the period, variant defaulting to FINAL, prepared_by_user_id = X-User-ID and amount_cents = UtilizationPeriod.final_charge_cents"
      - "line_items populated from the period's base, shortfall-credit, overrun and reliability-penalty components"
      - "when variant == PROVISIONAL, every FlightLeg of the period with billing_state == UNBILLED moves UNBILLED -> PROVISIONALLY_BILLED"
      - "UtilizationPeriod.version increments by 1"

  - method: GET
    path: "/wetlease/settlement-invoices/{invoiceId}"
    description: "Fetch one settlement invoice."
    roles: [BillingAdmin, LessorOpsController, Lessee]
    code: 200
    input: []
    output: SettlementInvoice
    side_effects: []

  - method: GET
    path: "/wetlease/settlement-invoices"
    description: "List settlement invoices ordered by created_at ASC. lease_id and period_id filters provide FK reverse reachability for both FKs."
    roles: [BillingAdmin, LessorOpsController, Lessee]
    code: 200
    input: ["lease_id?", "period_id?", "status?", "limit?", "offset?"]
    output: SettlementInvoice[]
    side_effects: []

  - method: POST
    path: "/wetlease/settlement-invoices/{invoiceId}/approve"
    description: "Second-pair-of-eyes approval. The approver must differ from the preparer and an ACCEPTED reliability report must exist for the month."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: SettlementInvoice
    side_effects:
      - "SettlementInvoice PREPARED -> APPROVED with approved_by_user_id = X-User-ID"

  - method: POST
    path: "/wetlease/settlement-invoices/{invoiceId}/issue"
    description: "Issue the invoice to the lessee. Forward side of the outstanding-balance invariant."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: SettlementInvoice
    side_effects:
      - "SettlementInvoice APPROVED -> ISSUED"
      - "UtilizationPeriod PENDING_SETTLEMENT -> SETTLED when the invoice's variant == FINAL"
      - "on that period settlement, every FlightLeg of the period with billing_state IN {UNBILLED, PROVISIONALLY_BILLED} moves to FINALIZED"
      - "Lessee.outstanding_balance_usd_cents recomputed per calculations.lessee_outstanding_balance"

  - method: POST
    path: "/wetlease/settlement-invoices/{invoiceId}/void"
    description: "Void an issued invoice. Compensating side of the outstanding-balance invariant; the period returns to PENDING_SETTLEMENT so a corrected invoice can be prepared."
    roles: [BillingAdmin]
    code: 200
    input: [void_reason]
    output: SettlementInvoice
    side_effects:
      - "SettlementInvoice PREPARED, APPROVED or ISSUED -> VOID"
      - "when the voided invoice was ISSUED, UtilizationPeriod SETTLED -> PENDING_SETTLEMENT and UtilizationPeriod.version increments by 1"
      - "Lessee.outstanding_balance_usd_cents recomputed per calculations.lessee_outstanding_balance"

  # ---- ReliabilityReport --------------------------------------------------
  - method: POST
    path: "/wetlease/reliability-reports"
    description: "Lessor files the monthly technical-dispatch-reliability report for the lessee. Both bases are computed; the lease's reliability_basis selects the headline figure."
    roles: [MaintenanceController]
    code: 201
    input: [lease_id, aircraft_id, period_month]
    output: ReliabilityReport
    side_effects:
      - "counts revenue_departures, scheduled_revenue_legs, technical_delay_events and technical_cancellations from the lease's legs in period_month per calculations.technical_dispatch_reliability"
      - "stores tdr_departure_basis_pct and tdr_scheduled_basis_pct, and sets technical_dispatch_reliability_pct to whichever matches LeaseAgreement.reliability_basis"
      - "ReliabilityReport created with status SUBMITTED"

  - method: GET
    path: "/wetlease/reliability-reports/{reportId}"
    description: "Fetch one reliability report including both computed bases."
    roles: [MaintenanceController, BillingAdmin, LessorOpsController, Lessee]
    code: 200
    input: []
    output: ReliabilityReport
    side_effects: []

  - method: GET
    path: "/wetlease/reliability-reports"
    description: "List reliability reports ordered by created_at ASC. lease_id and aircraft_id filters provide FK reverse reachability for both FKs."
    roles: [MaintenanceController, BillingAdmin, LessorOpsController, Lessee]
    code: 200
    input: ["lease_id?", "aircraft_id?", "status?", "period_month?", "limit?", "offset?"]
    output: ReliabilityReport[]
    side_effects: []

  - method: POST
    path: "/wetlease/reliability-reports/{reportId}/review"
    description: "Lessee accepts or rejects the filed reliability report. Only an ACCEPTED report can gate invoice approval or drive the reliability penalty."
    roles: [Lessee]
    code: 200
    input: [decision, "review_note?"]
    output: ReliabilityReport
    side_effects:
      - "ReliabilityReport SUBMITTED -> ACCEPTED when decision == ACCEPT, or SUBMITTED -> REJECTED when decision == REJECT"

  # ---- ReturnCondition ----------------------------------------------------
  - method: GET
    path: "/wetlease/return-conditions/{returnId}"
    description: "Fetch one return-conditions record with its computed discrepancy cost and lessee-billed amount."
    roles: [LessorOpsController, MaintenanceController, BillingAdmin, Lessee]
    code: 200
    input: []
    output: ReturnCondition
    side_effects: []

  - method: GET
    path: "/wetlease/return-conditions"
    description: "List return-conditions records ordered by created_at ASC. lease_id, aircraft_id and repositioning_leg_id filters provide FK reverse reachability for all three FKs."
    roles: [LessorOpsController, MaintenanceController, BillingAdmin, Lessee]
    code: 200
    input: ["lease_id?", "aircraft_id?", "repositioning_leg_id?", "status?", "limit?", "offset?"]
    output: ReturnCondition[]
    side_effects: []

  - method: POST
    path: "/wetlease/return-conditions/{returnId}/inspect"
    description: "Record the redelivery inspection readings and price the discrepancies through the liability cap and security deposit waterfall."
    roles: [MaintenanceController]
    code: 200
    input: [hours_since_check_at_return, cycles_since_check_at_return, fuel_on_board_kg, discrepancy_codes]
    output: ReturnCondition
    side_effects:
      - "ReturnCondition PENDING_INSPECTION -> DISCREPANCIES_OPEN when discrepancy_cost_cents > 0, otherwise PENDING_INSPECTION -> CLEARED"
      - "discrepancy_cost_cents and billed_to_lessee_cents computed per calculations.return_discrepancy_cost"
      - "LeaseAgreement.return_deposit_applied_cents and return_deposit_remaining_cents updated from the same waterfall"

  - method: POST
    path: "/wetlease/return-conditions/{returnId}/close"
    description: "Close the return once discrepancies are cleared and the repositioning leg has flown the airframe to the redelivery station."
    roles: [LessorOpsController]
    code: 200
    input: [repositioning_leg_id]
    output: ReturnCondition
    side_effects:
      - "ReturnCondition CLEARED -> CLOSED, storing repositioning_leg_id"
      - "LeaseAgreement TERMINATING -> RETURNED (terminal)"
      - "the on-lease Aircraft has assigned_lease_id cleared and status ASSIGNED -> AVAILABLE"
      - "every CrewQualification on this lease with status == QUALIFIED -> REVOKED"

  # ---- Test-driving endpoint ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, used by every expiry, rolling-window and coverage check. Before any call to this endpoint the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [LessorOpsController, BillingAdmin, MaintenanceController, InsuranceUnderwriter, RegulatoryAuthority]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock set to current_utc; all subsequent rolling-window, expiry and coverage evaluations read it"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not listed for the endpoint, or a Lessee caller's X-User-ID is not the lessee_id of the lease owning the target resource"

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum member, out-of-range number, unparseable date or datetime, scheduled_in <= scheduled_out, limit outside [1,100], offset < 0, or disputed_amount_cents outside (0, final_charge_cents]"

  # --- existence ----------------------------------------------------------
  - id: ERR_LESSEE_NOT_FOUND
    http: 404
    condition: "no Lessee row for the supplied lesseeId or lessee_id"
  - id: ERR_AIRCRAFT_NOT_FOUND
    http: 404
    condition: "no Aircraft row for the supplied aircraftId, primary_aircraft_id, original_aircraft_id or substitute_aircraft_id"
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "no LeaseAgreement row for the supplied leaseId or lease_id"
  - id: ERR_CREW_MEMBER_NOT_FOUND
    http: 404
    condition: "no CrewMember row for the supplied crewMemberId, crew_member_id, captain_id or first_officer_id"
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "no CrewQualification row for the supplied qualificationId"
  - id: ERR_APPROVAL_NOT_FOUND
    http: 404
    condition: "no RegulatoryApproval row for the supplied approvalId"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "no InsuranceCertificate row for the supplied certificateId"
  - id: ERR_FLIGHT_LEG_NOT_FOUND
    http: 404
    condition: "no FlightLeg row for the supplied legId or repositioning_leg_id"
  - id: ERR_SUBSTITUTION_NOT_FOUND
    http: 404
    condition: "no AircraftSubstitution row for the supplied substitutionId"
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "no UtilizationPeriod row for the supplied periodId or period_id"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "no SettlementInvoice row for the supplied invoiceId"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "no ReliabilityReport row for the supplied reportId"
  - id: ERR_RETURN_CONDITION_NOT_FOUND
    http: 404
    condition: "no ReturnCondition row for the supplied returnId"

  # --- concurrency --------------------------------------------------------
  - id: ERR_STALE_PERIOD_VERSION
    http: 412
    condition: "expected_period_version on POST /wetlease/settlement-invoices does not equal the current UtilizationPeriod.version"
  - id: ERR_STALE_LEASE_VERSION
    http: 412
    condition: "expected_lease_version on POST /wetlease/substitutions does not equal the current LeaseAgreement.version"

  # --- state --------------------------------------------------------------
  - id: ERR_PERIOD_NOT_READY_FOR_SETTLEMENT
    http: 409
    condition: "an invoice is prepared against a UtilizationPeriod whose status is not PENDING_SETTLEMENT"
  - id: ERR_LESSEE_INVALID_STATE
    http: 409
    condition: "suspend is requested on a Lessee that is not ACTIVE, or reinstate on a Lessee that is not SUSPENDED"
  - id: ERR_LEASE_INVALID_STATE
    http: 409
    condition: "requested lease transition is not declared from the lease's current status"
  - id: ERR_APPROVAL_INVALID_STATE
    http: 409
    condition: "requested regulatory-approval transition is not declared from the docket's current determination"
  - id: ERR_LEG_INVALID_STATE
    http: 409
    condition: "requested flight-leg transition is not declared from the leg's current status"
  - id: ERR_SUBSTITUTION_INVALID_STATE
    http: 409
    condition: "requested substitution transition is not declared from the request's current status"
  - id: ERR_INVOICE_INVALID_STATE
    http: 409
    condition: "requested invoice transition is not declared from the invoice's current status"
  - id: ERR_PERIOD_INVALID_STATE
    http: 409
    condition: "requested period transition is not declared from the period's current status, or a close is attempted while SCHEDULED or DISPATCHED legs remain inside period_month"
  - id: ERR_RETURN_CONDITION_INVALID_STATE
    http: 409
    condition: "requested return-condition transition is not declared from the record's current status"
  - id: ERR_AIRCRAFT_UNAVAILABLE
    http: 409
    condition: "the airframe's status does not permit the requested operation (dispatch off a non-ASSIGNED airframe, maintenance event from an incompatible status, retire while still assigned, or activate onto a non-AVAILABLE airframe)"

  # --- crew / safety ------------------------------------------------------
  - id: ERR_CREW_NOT_TYPE_RATED
    http: 422
    condition: "captain or first officer lacks the operating aircraft's type_designator in type_ratings, or is not ACTIVE"
  - id: ERR_CREW_DUTY_LIMIT_EXCEEDED
    http: 409
    condition: "projected rolling 7-day duty exceeds 3600 minutes for the captain or the first officer"
  - id: ERR_CREW_BLOCK_LIMIT_EXCEEDED
    http: 409
    condition: "projected rolling 28-day block time exceeds 5400 minutes for the captain or the first officer"
  - id: ERR_CREW_NOT_QUALIFIED_FOR_LESSEE_PROCEDURES
    http: 409
    condition: "no QUALIFIED CrewQualification exists for the crew member on this lease"

  # --- regulatory / insurance --------------------------------------------
  - id: ERR_REGULATORY_APPROVAL_MISSING
    http: 409
    condition: "no unexpired APPROVED or CONDITIONAL RegulatoryApproval covers the lease at activation"
  - id: ERR_OPERATIONAL_CONTROL_MISMATCH
    http: 422
    condition: "operational_control is not LESSOR while the lessor supplies both crew and maintenance, which is not a lawful wet-lease structure"
  - id: ERR_INSURANCE_COVERAGE_MISSING
    http: 409
    condition: "no ACTIVE certificate with the lessee as additional insured and breach-of-warranty endorsement covers the relevant instant"
  - id: ERR_INSURANCE_LIMIT_BELOW_MINIMUM
    http: 422
    condition: "hull_limit_usd_cents < 5000000000 or liability_limit_usd_cents < 50000000000"
  - id: ERR_INSURANCE_PERIOD_OVERLAP
    http: 409
    condition: "the new certificate's closed [effective_from, expires_at] interval overlaps an existing ACTIVE certificate on the same lease, including a single-instant touch"

  # --- scheduling / temporal ---------------------------------------------
  - id: ERR_LEG_OUTSIDE_LEASE_TERM
    http: 422
    condition: "date(scheduled_out) precedes term_start_date or date(scheduled_in) exceeds term_end_date"
  - id: ERR_AIRCRAFT_SCHEDULE_CONFLICT
    http: 409
    condition: "the candidate leg's half-open [scheduled_out, scheduled_in) intersects an existing leg's 45-minute-buffered occupancy window on the same airframe"

  # --- fleet / substitution ----------------------------------------------
  - id: ERR_DUPLICATE_TAIL_NUMBER
    http: 409
    condition: "tail_number already registered to another Aircraft"
  - id: ERR_MAINTENANCE_PROGRAM_MISALIGNED
    http: 422
    condition: "the airframe's maintenance_program_ref differs from the lease's required_maintenance_program_ref"
  - id: ERR_SUBSTITUTION_TYPE_MISMATCH
    http: 422
    condition: "the client-specified substitute fails the type, seat-tolerance, availability or hours-since-check eligibility test"
  - id: ERR_SUBSTITUTION_CONSENT_REQUIRED
    http: 403
    condition: "a lessor caller attempts to effectuate a substitution still in LESSEE_CONSENT_PENDING on a LESSEE_CONSENT_REQUIRED lease"
  - id: ERR_NO_SUBSTITUTE_AIRCRAFT_AVAILABLE
    http: 409
    condition: "server-side substitute selection was requested but the eligible candidate pool is empty"

  # --- billing / governance ----------------------------------------------
  - id: ERR_RELIABILITY_REPORT_NOT_ACCEPTED
    http: 409
    condition: "no ACCEPTED ReliabilityReport exists for the lease and period_month being approved"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approving X-User-ID equals the invoice's prepared_by_user_id"
  - id: ERR_LESSEE_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "outstanding_balance_usd_cents plus the invoiced amount would exceed the lessee's credit_limit_usd_cents"
  - id: ERR_LESSEE_SUSPENDED
    http: 403
    condition: "the lease's lessee has status SUSPENDED"

  # --- return / redelivery -----------------------------------------------
  - id: ERR_RETURN_DISCREPANCIES_OPEN
    http: 409
    condition: "closure attempted while the return record still has open discrepancies"
  - id: ERR_REPOSITIONING_LEG_INCOMPLETE
    http: 409
    condition: "repositioning_leg_id is not a COMPLETED REPOSITIONING leg on the same lease landing at the lease's redelivery_icao"

