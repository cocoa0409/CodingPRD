            - "DiversitySnapshot.${snap}.underrepresented_count == 1 and diversity_index == 33.33"

  # ============================================================ validations
  - section: validations
    instances:
      - name: consent_by_wrong_manager_within_window_returns_not_reporting_manager
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NOT_REPORTING_MANAGER]"]
        distinguishing_aspect: "Within the consent window and in the correct state, a manager who does not manage the applicant is rejected with ERR_NOT_REPORTING_MANAGER — the referential rule isolated from the temporal one."
        test_recipe:
          setup: ["PENDING_MANAGER_CONSENT application of E90 (manager M90); O90 is another manager"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB90", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC90", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR90", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "OTH90", full_name: "Otto Other", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { oth: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E90", full_name: "Erin App", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Role 90", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Role 90", planned_open_date: "2026-05-04", planned_close_date: "2026-05-29", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p: $.data.id } }
            - { call: "POST /talent/postings/${p}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/postings/${p}/applications", as: Employee, as_user_id: "${e}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /talent/applications/${app}/consent", as: Manager, as_user_id: "${oth}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_REPORTING_MANAGER (403); status remains PENDING_MANAGER_CONSENT"
            - "the real manager can still consent afterwards (no state corruption)"

