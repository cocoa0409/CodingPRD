      # --- corners already exercised by §1.8 -----------------------------------
      - name: corner_handicap_basis_variants_diverge_on_identical_pins
        claim_type: variant_divergence
        grounds:
          - calculations.bowler_handicap
          - entities.League.fields.handicap_average_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / handicap_basis_entering_vs_current_on_identical_certified_pins
          rationale: "That §1.8 instance runs both the entering_basis and current_basis variants over one unchanged set of certified pins and asserts the delta on every affected membership and team."

      - name: corner_prize_basis_variants_diverge_on_one_dues_ledger
        claim_type: variant_divergence
        grounds:
          - calculations.prize_fund_basis
          - entities.PrizeFund.fields.basis_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / prize_basis_projected_vs_certified_on_identical_dues_ledger
          rationale: "That §1.8 instance drafts both basis_variants against the same dues rows and asserts the projected-versus-settled delta cent for cent."

      - name: corner_team_handicap_floors_before_it_sums
        claim_type: precision
        grounds:
          - calculations.team_handicap_per_game
        excluded_because:
          difficulty_instance: combinatorial_formula / team_handicap_per_bowler_floor_then_sum_109_not_110
          rationale: "That §1.8 instance is built precisely so the per-bowler floor yields 109 where a deferred floor would yield 110."

      - name: corner_prize_waterfall_remainder_lands_on_place_one
        claim_type: waterfall_allocation
        grounds:
          - calculations.prize_distribution_waterfall
        excluded_because:
          difficulty_instance: combinatorial_formula / prize_waterfall_floor_remainder_cent_to_place_one
          rationale: "That §1.8 instance asserts the floored per-place amounts plus the ascending-order remainder allocation summing back to net_distributable_cents exactly."

      - name: corner_remittance_penalty_tier_flips_after_the_grace_window
        claim_type: tiered_pricing
        grounds:
          - calculations.remittance_amount
          - entities.FeeRemittance.fields.penalty_cents
        excluded_because:
          difficulty_instance: boundary_precision_check / remittance_penalty_flips_strictly_after_twenty_one_days
          rationale: "That §1.8 instance submits at exactly 21 elapsed days and at 22, asserting the per-member LATE_PENALTY_CENTS tier flips only on the strict inequality."

      - name: corner_minimum_games_threshold_selects_the_average_variant
        claim_type: variant_selection
        grounds:
          - calculations.bowler_average
          - entities.Membership.fields.average_status
        excluded_because:
          difficulty_instance: boundary_precision_check / minimum_games_threshold_reached_exactly_flips_average_variant
          rationale: "That §1.8 instance walks certified_games to minimum_games_for_average - 1, to the threshold and past it, asserting the PROVISIONAL-to-ESTABLISHED variant switch and the average each variant produces."

  # ==========================================================================
  # SECTION 4 - validations  (claim-extraction-guide Table 4)
  #   claim types: violation_to_error, satisfaction_to_pass, priority_ordering.
  #   The 47 rules of §1.4 are walked family by family; every instance also
  #   asserts that a refused request wrote nothing at all.
  # ==========================================================================
  - section: validations
    instances:

      - name: corner_lineup_legality_family_rejects_then_admits_the_padded_lineup
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - validations[priority=33]
          - validations[priority=34]
          - validations[priority=35]
          - errors[ERR_ILLEGAL_LINEUP]
          - calculations.team_handicap_per_game
        distinguishing_aspect: "The four lineup-constraint rules 32-35 are only separable at lineup_positions 3 with legal_lineup_minimum 1: at CONFIG-B's 2 positions with a minimum of 2, priority 32 swallows every vacancy case before 33 can ever fire. After one amendment each rule is provoked alone, the pair (34, 35) is provoked together to prove 34 wins, and the surviving lineup freezes 36 + 18 + 60 where the 60 is a bowler who does not exist."
        test_recipe:
          setup:
            - "One league on CONFIG-B, IN_SEASON, week 1 ${mt1_id} CERTIFIED at 2026-08-12T01:00:00Z and week 2 ${mt2_id} (home ${t2_id}, away ${t1_id}, 2026-08-19T01:00:00Z - 03:00:00Z) still SCHEDULED with no lineup on either side."
