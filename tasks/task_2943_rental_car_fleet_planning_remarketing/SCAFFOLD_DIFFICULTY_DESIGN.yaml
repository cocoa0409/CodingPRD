  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: recondition_ledger_returns_to_zero_after_consignment_withdrawal
        grounds:
          - state_machines.Vehicle[HELD_FOR_SALE -> IN_SERVICE]
          - state_machines.Consignment[RECONDITION_PENDING -> WITHDRAWN]
          - entities.Vehicle.fields.total_recondition_cents
          - entities.LedgerEntry.fields.entry_type
          - endpoints[POST /fleet/consignments/{consignment_id}/withdraw]
        distinguishing_aspect: |
          The conserved quantity here is a MONETARY ledger total on a single vehicle, and
          it is conserved by APPENDING an equal-and-opposite RECONDITION_REVERSAL row rather
          than by deleting the RECONDITION_COST row: the row count grows from 5 to 6 while
          total_recondition_cents returns to exactly 0. A second withdraw is refused, so the
          compensation cannot be applied twice and the total cannot drift negative.
        test_recipe:
          setup:
            - "One ATL market, one MIDSIZE segment, one ACTIVE MID-2026 policy, one RISK program RSK, one AUCTION channel."
            - "Vehicle VR under a RISK allocation is IN_SERVICE at ATL with in_service_at 2026-01-15T00:00:00Z and odometer_km 47000, so its POLICY_SCHEDULE net book value at 2026-09-15 is 1900000."
            - "Its opening ledger is exactly four rows: CAPITALIZATION +2800000 and PREP_COST +14000, +9000, +21000. total_recondition_cents is 0 and Market ATL in_service_unit_count is 1."
            - "A consignment on AUCTION is taken to RECONDITION_PENDING with recondition_authorized_cents 90000 (exactly the segment cap) and recondition_actual_cents 45500."
            - "45500 * 1.075 = 48912.5 exactly, so round_half_up makes recondition_loaded_cents 48913 and the reversal must be -48913, not -48912."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
