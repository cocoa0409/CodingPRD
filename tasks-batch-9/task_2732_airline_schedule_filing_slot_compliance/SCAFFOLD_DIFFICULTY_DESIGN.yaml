          - state_machines.ScheduleVersion.WARNED_to_CLEAN
          - entities.ScheduleVersion.fields.filing_status
          - entities.ScheduleVersion.fields.compliance_state
          - calculations.schedule_compliance_score
        distinguishing_aspect: |
          PARALLEL DIMENSIONS on the ScheduleVersion entity (not FlightLeg): the filing_status
          dimension moves DRAFT -> VALIDATED while compliance_state stays WARNED at score 76.00, and
          then the compliance_state dimension moves WARNED -> CLEAN at score 88.00 while filing_status
