  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_members_by_plan_reverse_reachability
        claim_type: Computed read
        grounds: [entities.Member.fields.plan_id, endpoints]
        distinguishing_aspect: "GET /members?plan_id returns the member created under that plan (FK reverse-reachability)."
        test_recipe:
          setup: ["Plan with one member."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
          trigger:
            - call: "GET /members?plan_id=${plan_id}"
              payload: {}
              as: TPAAdmin
          assert:
            - "data array contains a Member with id == ${member_id}"

      - name: list_reimbursements_by_policy_reverse_reachability
        claim_type: Computed read
        grounds: [entities.StopLossReimbursement.fields.stop_loss_policy_id, endpoints]
        distinguishing_aspect: "After a specific reimbursement cascade, GET /stop-loss-reimbursements?stop_loss_policy_id returns the SPECIFIC reimbursement (amount 500000)."
        test_recipe:
          setup: ["Plan; provider; member; ACTIVE policy (specific 5000000); a big claim (billed 10000000) adjudicated -> one SPECIFIC reimbursement of 500000."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Hospital", tax_id: "44-4444444", npi: "3333333333", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Sam", last_name: "H", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /stop-loss-policies"
              payload: { plan_id: "${plan_id}", carrier_name: "ReCarrier", contract_basis: "PAID", effective_date: "2026-01-01", expiry_date: "2027-01-01", specific_deductible_cents: 5000000, aggregate_attachment_cents: 100000000 }
              as: TPAAdmin
              captures: { pol: $.data.id }
            - call: "POST /stop-loss-policies/${pol}/activate"
              payload: {}
              as: TPAAdmin
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-04-01", billed_lines: [{ billed_cents: 10000000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
