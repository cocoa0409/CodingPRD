            - call: "POST /opaque/opaque-bids/${b2}/evaluate"
              payload: { expected_customer_version: "${cv1}" }
              as: PlatformAdmin
          assert:
            - "RateWindow.${win_id}.rooms_sold == 2"
            - "Customer.${cust_id}.opaque_win_count_30d == 2 and fraud_status == CLEAR"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.RateWindow.fields.version
          - complexity_profile.complexity_layers
        distinguishing_aspect: "common_fields.version increments by exactly 1 on every mutation including cascaded ones: window creation version 1, after one fill version 2, after close version 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. NB38 base; window W created (version 1); one FIXED bid accepted (version 2)."
          setup_api_calls:
            - *clock
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB38", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB38", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
              captures: { win_id: $.data.id, wv1: $.data.version }
            - call: "POST /opaque/customers"
              payload: { email: "cc22@x.com", full_name: "Corner Cust Twenty Two" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cv: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB38", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cv}" }
              as: PlatformAdmin
            - call: "GET /opaque/rate-windows/${win_id}"
              payload: {}
              as: PlatformAdmin
              captures: { wv2: $.data.version }
          trigger:
            - call: "POST /opaque/rate-windows/${win_id}/close"
              payload: { expected_rate_window_version: "${wv2}" }
              as: PlatformAdmin
          assert:
            - "RateWindow.${win_id}.version == 1 at creation, == 2 after the fill (${wv1} == 1 and ${wv2} == 2)"
            - "after close, RateWindow.${win_id}.version == 3 and status == CLOSED"

