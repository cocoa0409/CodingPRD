            - { call: "POST /copack/production-runs/${rA2}/confirm", payload: {}, as: OpsAdmin }
          assert:
            - "first confirm fails with ERR_KETTLE_LINE_CONFLICT (gap 2h < 4h allergen-changeover buffer after NUT run)"
            - "second confirm succeeds (gap exactly 4h >= 4h; boundary inclusive)"
            - "ProductionRun.${rA}.status remains PLANNED; ProductionRun.${rA2}.status == CONFIRMED"

      - name: pilot_cell_touch_allowed_booking
        grounds:
          - calculations.pilot_cell_overlap_check
          - "errors[ERR_PILOT_CELL_CONFLICT]"
        distinguishing_aspect: |
          Resource PilotCell with zero-buffer half-open semantics (different resource
          and different interval arithmetic than the kettle rule): a trial starting
          exactly when another ends (end == start) is allowed, while a window
          intersecting by one hour conflicts.
        test_recipe:
          setup:
            - "Customer c1; formulas fA (ACIDIFIED, NONE), fB and fC (ACID, SOY), all DRAFT; pilot cell pc1; trial tA for fA books 2026-09-01T08:00-12:00Z"
