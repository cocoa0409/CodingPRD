            - call: "GET /threat-cases/${case_b}"
              as: TeamLead
              captures: { b_status: $.data.status }
          assert:
            - "purge response: purged_count == 1 and purged_case_ids == [${case_a}]"
            - "Case A: status == PURGED, subject_alias == PURGED"
            - "Case A document: purged == true and body == null"
            - "Case B: status == CLOSED_NO_THREAT (purge_after 2027-08-02 is after the current date)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_activation_gated_by_le_referral_ack
        grounds:
          - state_machines.ManagementPlan.DRAFT_to_ACTIVE
          - validations[priority=5.2]
        distinguishing_aspect: |
          Entity pair ManagementPlan x Referral: activating a plan on a HIGH
          case is rejected while its LAW_ENFORCEMENT referral is SENT and
          succeeds only after that referral transitions to ACKNOWLEDGED.
        test_recipe:
          setup:
            - "Case in UNDER_ASSESSMENT with a FINALIZED HIGH assessment (score 50); one DRAFT plan; no referrals yet"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Gated HS", school_code: "GHS", enrollment_count: 1000 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-G1", reporter_channel: "TIP_LINE", summary: "gated activation" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "URGENT", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "PLAN_SPECIFICITY", severity: 2 }, { factor_code: "GRIEVANCE_HISTORY", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /management-plans"
              payload: { case_id: "${case_id}", cadence_mode: "FROM_COMPLETION", cadence_days: 10, conditions: ["daily check-in"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { plan_id: $.data.id }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { case_v1: $.data.version }
          trigger:
            - call: "POST /management-plans/${plan_id}/activate"
              payload: { expected_threat_case_version: "${case_v1}" }
              as: TeamLead
              as_user_id: tl_1
              captures: { err: $.data.error_id }
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", referral_type: "LAW_ENFORCEMENT", agency_name: "City PD", urgency: "URGENT" }
              as: TeamLead
              as_user_id: tl_1
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/acknowledge"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { case_v2: $.data.version }
            - call: "POST /management-plans/${plan_id}/activate"
              payload: { expected_threat_case_version: "${case_v2}" }
              as: TeamLead
              as_user_id: tl_1
              captures: { plan_status: $.data.status }
          assert:
            - "first activate: 409 ERR_LE_REFERRAL_REQUIRED (HIGH case, referral still SENT/absent)"
            - "after referral acknowledge: activate returns 200, plan status == ACTIVE"
            - "ThreatCase.${case_id}.status == PLAN_ACTIVE and monitoring_cadence_days == 10"

      - name: reentry_plan_creation_gated_by_case_removed
        grounds:
          - state_machines.ReEntryPlan
          - validations[priority=4]
          - state_machines.ThreatCase.UNDER_ASSESSMENT_to_REMOVED
        distinguishing_aspect: |
          Entity pair ReEntryPlan x ThreatCase (different pair than the sibling):
          creating a re-entry plan is rejected while the case is UNDER_ASSESSMENT
          and succeeds only after the case transitions to REMOVED.
        test_recipe:
          setup:
            - "Case in UNDER_ASSESSMENT; clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Removed HS", school_code: "RHS", enrollment_count: 850 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-R3", reporter_channel: "STAFF_REFERRAL", summary: "reentry gating" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
          trigger:
            - call: "POST /re-entry-plans"
              payload: { case_id: "${case_id}", conditions: ["risk re-assessment completed"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { err: $.data.error_id }
            - call: "POST /threat-cases/${case_id}/remove"
              payload: { removal_type: "DISCIPLINARY_EXCLUSION", removal_reason: "suspension pending assessment" }
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /re-entry-plans"
              payload: { case_id: "${case_id}", conditions: ["risk re-assessment completed"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { rep_id: $.data.id, rep_status: $.data.status }
          assert:
            - "first create: 409 ERR_CASE_NOT_REMOVED (case UNDER_ASSESSMENT)"
            - "after remove: create returns 201, plan status == PROPOSED, conditions[0].status == UNMET"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: interview_half_open_overlap_with_adjacency
        grounds:
          - validations[priority=7]
          - entities.Interview
        distinguishing_aspect: |
          Interval semantics = continuous half-open [starts_at, ends_at) on the
          case's interview schedule: back-to-back adjacency (end == start) is
          ALLOWED, while any positive-overlap interior intersection is rejected.
        test_recipe:
          setup:
            - "Case in UNDER_ASSESSMENT with one SCHEDULED WITNESS interview 2026-08-05T10:00:00Z-11:00:00Z"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Overlap HS", school_code: "OHS", enrollment_count: 760 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-O1", reporter_channel: "TIP_LINE", summary: "overlap case" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /interviews"
              payload: { case_id: "${case_id}", interviewee_type: "WITNESS", starts_at: "2026-08-05T10:00:00Z", ends_at: "2026-08-05T11:00:00Z" }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { iv1: $.data.id }
          trigger:
            - call: "POST /interviews"
              payload: { case_id: "${case_id}", interviewee_type: "WITNESS", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z" }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { iv2: $.data.id }
            - call: "POST /interviews"
              payload: { case_id: "${case_id}", interviewee_type: "WITNESS", starts_at: "2026-08-05T10:30:00Z", ends_at: "2026-08-05T11:30:00Z" }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { err: $.data.error_id }
          assert:
            - "adjacent booking 09:00-10:00 (ends exactly at the existing 10:00 start) is ACCEPTED (201)"
            - "overlapping booking 10:30-11:30 is REJECTED: 409 ERR_INTERVIEW_OVERLAP"

      - name: checkin_discrete_calendar_day_uniqueness
        grounds:
          - validations[priority=7]
          - entities.MonitoringCheckIn.fields.due_date
          - errors[ERR_CHECKIN_DAY_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = discrete calendar-day bucket (different from the
          continuous half-open arithmetic of the interview sibling and on a
          different resource entity, MonitoringCheckIn): a second SCHEDULED
          check-in on the same YYYY-MM-DD conflicts regardless of time-of-day;
          the next day is allowed.
        test_recipe:
          setup:
            - "Case in PLAN_ACTIVE (MODERATE, cadence 14) with the auto-created check-in due 2026-08-15; clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Day HS", school_code: "DHS", enrollment_count: 620 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-D1", reporter_channel: "TIP_LINE", summary: "day conflict" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /management-plans"
              payload: { case_id: "${case_id}", cadence_mode: "FROM_COMPLETION", conditions: ["counselor check"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { plan_id: $.data.id }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { case_v: $.data.version }
            - call: "POST /management-plans/${plan_id}/activate"
              payload: { expected_threat_case_version: "${case_v}" }
              as: TeamLead
              as_user_id: tl_1
          trigger:
            - call: "POST /monitoring-check-ins"
              payload: { case_id: "${case_id}", due_date: "2026-08-15" }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { err: $.data.error_id }
            - call: "POST /monitoring-check-ins"
              payload: { case_id: "${case_id}", due_date: "2026-08-16" }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { chk2: $.data.id, chk2_due: $.data.due_date }
          assert:
            - "same-day create (2026-08-15, the auto check-in's due date): 409 ERR_CHECKIN_DAY_CONFLICT"
            - "next-day create (2026-08-16): 201 with status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: referral_send_withdraw_conserves_open_count
        grounds:
          - state_machines.Referral.SENT_to_WITHDRAWN
          - entities.Referral.fields.status
        distinguishing_aspect: |
          Conserved quantity = per-case open referral count, pinned as
          COUNT(Referral WHERE case_id = C AND status == SENT): a send (+1)
          followed by its compensating withdraw (-1) leaves the count unchanged
          at its pre-send value 0.
        test_recipe:
          setup:
            - "One case in TRIAGED (referral creation allowed); zero referrals exist"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Invariant HS", school_code: "IHS", enrollment_count: 540 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-I1", reporter_channel: "TIP_LINE", summary: "invariant case" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "GET /threat-cases/${case_id}/referrals"
              payload: { status: "SENT" }
              as: ThreatAssessor
          trigger:
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", referral_type: "MENTAL_HEALTH", agency_name: "County MH", urgency: "ROUTINE" }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ref_id: $.data.id }
            - call: "GET /threat-cases/${case_id}/referrals"
              payload: { status: "SENT" }
              as: ThreatAssessor
            - call: "POST /referrals/${ref_id}/withdraw"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
              captures: { ref_status: $.data.status }
            - call: "GET /threat-cases/${case_id}/referrals"
              payload: { status: "SENT" }
              as: ThreatAssessor
          assert:
            - "before send: SENT-referral list total_count == 0"
            - "after send: total_count == 1"
            - "withdraw response: status == WITHDRAWN"
            - "after withdraw: total_count == 0 — COUNT(SENT referrals) identical before the send and after its compensating withdraw"

      - name: case_close_reopen_conserves_open_count
        grounds:
          - state_machines.ThreatCase.PLAN_ACTIVE_to_CLOSED_MANAGED
          - state_machines.ThreatCase.CLOSED_MANAGED_to_TRIAGED
        distinguishing_aspect: |
          Conserved quantity = district open-case count, pinned as
          COUNT(ThreatCase WHERE status NOT IN {CLOSED_NO_THREAT, CLOSED_MANAGED,
          PURGED}): a close (-1) followed by its compensating reopen (+1) leaves
          the count unchanged at 1 (different conserved quantity than the
          referral sibling).
        test_recipe:
          setup:
            - "Exactly one case in the district, in PLAN_ACTIVE (MODERATE, default cadence; its SCHEDULED check-in will be auto-CANCELLED by the close cascade); clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Conserve HS", school_code: "CNH", enrollment_count: 480 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-C1", reporter_channel: "STAFF_REFERRAL", summary: "conserve case" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_id}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments"
              payload: { case_id: "${case_id}", variant: "STANDARD", factors: [ { factor_code: "GRIEVANCE_HISTORY", severity: 2 }, { factor_code: "PEER_REPORTS", severity: 2 } ] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { ra_id: $.data.id }
            - call: "POST /risk-assessments/${ra_id}/submit"
              payload: {}
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /risk-assessments/${ra_id}/finalize"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
            - call: "POST /management-plans"
              payload: { case_id: "${case_id}", cadence_mode: "FROM_COMPLETION", conditions: ["counselor check"] }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { plan_id: $.data.id }
            - call: "GET /threat-cases/${case_id}"
              as: TeamLead
              captures: { case_v: $.data.version }
            - call: "POST /management-plans/${plan_id}/activate"
              payload: { expected_threat_case_version: "${case_v}" }
              as: TeamLead
              as_user_id: tl_1
          trigger:
            - call: "POST /threat-cases/${case_id}/close"
              payload: {}
              as: TeamLead
              as_user_id: tl_1
              captures: { st_closed: $.data.status }
            - call: "POST /threat-cases/${case_id}/reopen"
              payload: {}
              as: IntakeCoordinator
              captures: { st_reopened: $.data.status }
            - call: "GET /threat-cases"
              payload: {}
              as: TeamLead
          assert:
            - "close response: status == CLOSED_MANAGED (open-case count drops 1 -> 0)"
            - "reopen response: status == TRIAGED (open-case count rises 0 -> 1)"
            - "GET /threat-cases total_count == 1 (no case rows created or destroyed by the close+reopen pair)"
            - "net drift of COUNT(status NOT IN {CLOSED_NO_THREAT, CLOSED_MANAGED, PURGED}) across close+reopen == 0"
