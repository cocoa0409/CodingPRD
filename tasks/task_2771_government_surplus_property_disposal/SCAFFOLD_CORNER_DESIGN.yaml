            - "the create response for the lot already carries reserve_price_cents 7524 and required_deposit_cents 0, and the GET that follows reports the identical values"
            - "the GET after the bid reports high_bid_cents 10000 and bid_count 1 without any intervening write"
            - "the list read straight after the close returns exactly one SaleInvoice with total_due_cents 11752 — the cascade-created row is indexed for filtering at once"
            - "after the single full payment the next read of the lot reports status SETTLED and the invoice is PAID with balance_due_cents 0"
            - "the agency read straight after the posting reports proceeds_account_balance_cents 8750 and posted_distribution_count 1, so the ledger recompute is part of the posting request"
            - "no request in this recipe is a refresh, recompute or settle call — every derived value is produced as a side effect of the business write that caused it"

      - name: cm_cascaded_cross_aggregate_state_is_visible_to_the_next_request
        claim_type: cross_aggregate_visibility
        grounds:
          - complexity_profile.consistency_model
          - state_machines.SurplusAsset.transitions[AWARDED_TRANSFER->RELEASED].side_effects
          - state_machines.TransferOrder.transitions[ACKNOWLEDGED->COMPLETED]
        distinguishing_aspect: "One release call moves three aggregates — asset, transfer order and turn-in — and all three are current for the very next request, including through list filters on the new statuses. The transfer order and the turn-in are never addressed by the release call, so a design that propagated the cascade lazily on read of the owning entity would still be caught by the filtered list reads."
        test_recipe:
          setup:
            - "logical clock at 2026-08-02T00:00:00Z"
            - "two ACTIVE STATE_AGENCY organizations: DOT-01 turning in and TFC-02 receiving"
            - "an ACCEPTED turn-in whose FURNITURE asset (acquisition_cost_cents 1000000, acquired 2026-01-10, assessed C1) is AWARDED_TRANSFER under an ACKNOWLEDGED transfer order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Texas Facilities Commission", agency_code: "TFC-02", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag2: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Modular workstation cluster", acquisition_cost_cents: 1000000, acquisition_date: "2026-01-10" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-30", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /turn-ins/${ti}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /screening-cycles"
              payload: { asset_id: "${a1}", opens_at: "2026-08-02T00:00:00Z", tier_window_days: 5 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { sc: "$.data.id" }
            - call: "POST /screening-requests"
              payload: { screening_cycle_id: "${sc}", requesting_agency_id: "${ag2}", intended_use: "Regional field office refit", justification: "Replaces failed 2009 workstations at the Bryan district office", needed_by_date: "2026-09-30" }
              as: AgencyOfficer
              as_user_id: "${ag2}"
              captures: { sr: "$.data.id" }
            - call: "POST /screening-cycles/${sc}/award"
              payload: { screening_request_id: "${sr}" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /transfer-orders"
              payload: { asset_id: "${a1}", recipient_agency_id: "${ag2}", screening_request_id: "${sr}" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { to1: "$.data.id" }
            - call: "POST /transfer-orders/${to1}/acknowledge"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag2}"
          trigger:
            - call: "POST /assets/${a1}/release"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "GET /transfer-orders/${to1}"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag2}"
            - call: "GET /turn-ins/${ti}"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "GET /transfer-orders?asset_id=${a1}&status=COMPLETED"
              payload: {}
              as: FinanceController
              as_user_id: "finance-01"
            - call: "GET /turn-ins?turning_in_agency_id=${ag}&status=CLOSED"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /assets?disposition_status=RELEASED"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "the release response already reports SurplusAsset.${a1}.disposition_status == RELEASED with released_at == 2026-08-02T00:00:00.000Z"
            - "the next request reports TransferOrder.${to1}.status == COMPLETED with transfer_price_cents 262500 and use_period_end_on null — the asset is not federal_source"
            - "the following request reports TurnIn.${ti}.status == CLOSED, the third aggregate touched by the same release"
            - "GET /transfer-orders?asset_id=${a1}&status=COMPLETED returns total_count 1 and GET /turn-ins?turning_in_agency_id=${ag}&status=CLOSED returns total_count 1 — the cascaded statuses are filterable at once, not only visible on a direct read"
            - "GET /assets?disposition_status=RELEASED returns total_count 1 holding ${a1}"
            - "no second write and no waiting step separates the release from any of these reads"
