scenario: "Demand-Response & Virtual-Power-Plant Enrollment: device/asset (battery/thermostat) enrollment, event dispatch & curtailment, baseline & performance measurement, incentive/payment calculation, utility-program compliance, opt-out & override, aggregation, settlement"
domain_name: "demand-response-vpp"
api_prefix: "/dr"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Devices, Enrollments, DispatchEvents, Dispatches and Settlements form a
  # web of FK references across aggregate boundaries (no single URL tree).

  state_machine_shape: cyclic
  # Enrollment (ACTIVE<->OPTED_OUT) and Settlement
  # (PENDING_APPROVAL->DISPUTED->REVISED->PENDING_APPROVAL) both loop.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # A utility operator who dispatched an event may not approve its settlement
  # (same X-User-ID barred from both steps).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Utility demand-response program name"
      - name: utility_name
        type: string
        source: input
        description: "Sponsoring utility"
      - name: incentive_rate_cents_per_kwh
        type: integer
        source: input
        description: "Payment rate in whole cents per delivered kWh"
        constraints: ">= 0"
      - name: penalty_rate_cents_per_kwh
        type: integer
        source: input
        description: "Underperformance penalty rate in whole cents per shortfall kWh"
        constraints: ">= 0"
      - name: capacity_incentive_cents_per_kw
        type: integer
        source: input
        description: "Capacity-payment rate in whole cents per committed kW (CAPACITY_PAYMENT settlement method)"
        constraints: ">= 0"
      - name: baseline_method
        type: enum
        source: input
        description: "Baseline algorithm applied to every dispatch in this program"
        default: "TEN_OF_TEN"
        constraints: "one of TEN_OF_TEN, WEATHER_REGRESSION"
      - name: settlement_method
        type: enum
        source: input
        description: "Payment algorithm applied to every settlement in this program"
        default: "PAY_FOR_PERFORMANCE"
        constraints: "one of PAY_FOR_PERFORMANCE, CAPACITY_PAYMENT"
      - name: performance_floor_pct
        type: number
        source: input
        description: "Minimum performance ratio at or above which no penalty applies"
        default: 0.75
        constraints: "0 < value <= 1"
      - name: notification_lead_minutes
        type: integer
        source: input
        description: "Minimum minutes between notify time and event window_start"
        default: 60
        constraints: ">= 0"
      - name: max_events_per_season
        type: integer
        source: input
        description: "Maximum non-cancelled dispatch events allowed in the season"
        default: 3
        constraints: ">= 0"
      - name: season_start_date
        type: datetime
        source: input
        description: "ISO 8601 UTC season open instant"
      - name: season_end_date
        type: datetime
        source: input
        description: "ISO 8601 UTC season close instant"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "DRAFT"
        constraints: "one of DRAFT, ACTIVE, CLOSED"
      - name: total_committed_kw
        type: number
        source: computed
        description: "Sum of committed_kw over Enrollments in status ACTIVE for this program (see calc program_total_committed_kw)"
        default: 0

  - name: Aggregator
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "VPP aggregator / operator name"
      - name: contact_email
        type: string
        source: input
        description: "Contact email"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "ACTIVE"
        constraints: "one of ACTIVE, SUSPENDED"
      - name: enrolled_committed_kw
        type: number
        source: computed
        description: "Sum of committed_kw over ACTIVE Enrollments whose Device.aggregator_id == this id (see calc program_total_committed_kw input_set)"
        default: 0
      - name: season_delivered_kwh
        type: number
        source: computed
        description: "Running sum of delivered_kwh accumulated from completed Dispatches whose Enrollment.aggregator devices belong to this aggregator"
        default: 0
      - name: paid_balance_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents for this aggregator where Payment.status in {ISSUED, CLEARED} (see calc aggregator_paid_balance_cents)"
        default: 0

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Account holder name"
      - name: email
        type: string
        source: input
        description: "Customer email"
      - name: service_address
        type: string
        source: input
        description: "Premise service address"
      - name: utility_account_id
        type: string
        source: input
        description: "Utility account identifier"

  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; premise owner of this device"
      - name: aggregator_id
        type: string
        source: system
        description: "FK -> Aggregator.id; set from acting Aggregator X-User-ID at creation"
      - name: device_type
        type: enum
        source: input
        description: "Asset class"
        constraints: "one of BATTERY, THERMOSTAT, EV_CHARGER"
      - name: nameplate_kw
        type: number
        source: input
        description: "Rated power capacity in kW"
        constraints: "> 0"
      - name: capacity_kwh
        type: number
        source: input
        description: "Energy capacity in kWh (batteries/EV); may be null for thermostats"
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "ACTIVE"
        constraints: "one of ACTIVE, DECOMMISSIONED"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; enrolled asset"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; target program"
      - name: committed_kw
        type: number
        source: input
        description: "Pledged curtailment capacity in kW"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "PENDING"
        constraints: "one of PENDING, ACTIVE, OPTED_OUT, TERMINATED"
      - name: season_delivered_kwh
        type: number
        source: computed
        description: "Running sum of delivered_kwh from this enrollment's completed Dispatches"
        default: 0

  - name: DispatchEvent
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; owning program"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC event window open (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC event window close (exclusive)"
      - name: target_reduction_kw
        type: number
        source: input
        description: "Aggregate reduction target in kW"
        constraints: "> 0"
      - name: baseline_method_snapshot
        type: enum
        source: system
        description: "Copied from Program.baseline_method at event creation; drives dispatch baseline"
        constraints: "one of TEN_OF_TEN, WEATHER_REGRESSION"
      - name: dispatched_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProgramOperator who notified (dispatched) the event; used for settlement SoD"
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, NOTIFIED, ACTIVE, COMPLETED, SETTLED, CANCELLED"

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - name: dispatch_event_id
        type: string
        source: system
        description: "FK -> DispatchEvent.id; parent event"
      - name: enrollment_id
        type: string
        source: system
        description: "FK -> Enrollment.id; participating enrollment"
      - name: assigned_reduction_kw
        type: number
        source: system
        description: "Enrollment.committed_kw snapshot taken at notify time"
      - name: baseline_kw
        type: number
        source: computed
        description: "Per-device baseline load in kW (see calc dispatch_baseline_kw); computed on event complete"
        default: null
      - name: avg_event_load_kw
        type: number
        source: computed
        description: "Mean kw_load over this device's EVENT_WINDOW readings for the event"
        default: null
      - name: actual_reduction_kw
        type: number
        source: computed
        description: "max(0, baseline_kw - avg_event_load_kw); computed on event complete"
        default: null
      - name: delivered_kwh
        type: number
        source: computed
        description: "actual_reduction_kw * event_duration_hours (see calc dispatch_delivered_kwh)"
        default: null
      - name: performance_ratio
        type: number
        source: computed
        description: "actual_reduction_kw / assigned_reduction_kw (0 when assigned is 0)"
        default: null
      - name: net_payment_cents
        type: integer
        source: computed
        description: "Per-dispatch tiered payout in whole cents (see calc dispatch_line_payout); computed on settlement submit/revise"
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "PENDING"
        constraints: "one of PENDING, ACKNOWLEDGED, CURTAILING, OVERRIDDEN, OPTED_OUT, COMPLETED"

  - name: MeterReading
    parent: null
    common_fields: false
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; metered asset"
      - name: dispatch_event_id
        type: string
        source: input
        description: "FK -> DispatchEvent.id; the event this interval belongs to (null for BASELINE_WINDOW readings)"
        default: null
      - name: interval_start
        type: datetime
        source: input
        description: "ISO 8601 UTC interval open (inclusive)"
      - name: interval_end
        type: datetime
        source: input
        description: "ISO 8601 UTC interval close (exclusive)"
      - name: kw_load
        type: number
        source: input
        description: "Measured average load in kW over the interval"
        constraints: ">= 0"
      - name: reading_type
        type: enum
        source: input
        description: "Whether this interval feeds the baseline pool or the event pool"
        constraints: "one of BASELINE_WINDOW, EVENT_WINDOW"

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: dispatch_event_id
        type: string
        source: input
        description: "FK -> DispatchEvent.id; settled event"
      - name: method_snapshot
        type: enum
        source: system
        description: "Copied from Program.settlement_method at settlement creation"
        constraints: "one of PAY_FOR_PERFORMANCE, CAPACITY_PAYMENT"
      - name: total_delivered_kwh
        type: number
        source: computed
        description: "Sum of delivered_kwh over eligible (COMPLETED) Dispatches of the event"
        default: 0
      - name: net_payment_cents
        type: integer
        source: computed
        description: "Settlement payout in whole cents (see calc settlement_net_payment)"
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who approved; must differ from event.dispatched_by_user_id"
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "DRAFT"
        constraints: "one of DRAFT, PENDING_APPROVAL, APPROVED, PAID, DISPUTED, REVISED"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: settlement_id
        type: string
        source: system
        description: "FK -> Settlement.id; originating settlement"
      - name: aggregator_id
        type: string
        source: system
        description: "FK -> Aggregator.id; payee aggregator"
      - name: amount_cents
        type: integer
        source: system
        description: "Payment amount in whole cents (this aggregator's share of settlement net)"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "ISSUED"
        constraints: "one of ISSUED, CLEARED, REVERSED"

state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /dr/programs/{id}/activate"
        actor: ProgramOperator
        preconditions:
          - "incentive_rate_cents_per_kwh, penalty_rate_cents_per_kwh and capacity_incentive_cents_per_kw are set"
          - "season_start_date < season_end_date"
        side_effects:
          - "status = ACTIVE"
          - "increments Program.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /dr/programs/{id}/close"
        actor: ProgramOperator
        preconditions:
          - "no DispatchEvent of this program is in status SCHEDULED, NOTIFIED or ACTIVE"
        side_effects:
          - "status = CLOSED"
          - "increments Program.version by 1"

  - entity: Device
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /dr/devices/{id}/decommission"
        actor: Aggregator
        preconditions:
          - "acting Aggregator X-User-ID == Device.aggregator_id"
          - "no Enrollment of this device is in status ACTIVE"
        side_effects:
          - "status = DECOMMISSIONED"
          - "increments Device.version by 1"

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /dr/enrollments/{id}/activate"
        actor: Aggregator
        preconditions:
          - "acting Aggregator X-User-ID == Device.aggregator_id (ownership)"
          - "Program.status == ACTIVE (cross-entity: Enrollment depends on Program)"
          - "Device.status == ACTIVE"
          - "no other Enrollment for this (device_id, program_id) is in status ACTIVE"
        side_effects:
          - "status = ACTIVE"
          - "Program.total_committed_kw += committed_kw"
          - "Aggregator.enrolled_committed_kw += committed_kw"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: OPTED_OUT
        trigger: "POST /dr/enrollments/{id}/opt-out"
        actor: "Customer or Aggregator"
        preconditions:
          - "Customer actor: X-User-ID == Device.customer_id; Aggregator actor: X-User-ID == Device.aggregator_id"
        side_effects:
          - "status = OPTED_OUT"
          - "Program.total_committed_kw -= committed_kw"
          - "Aggregator.enrolled_committed_kw -= committed_kw"
          - "increments Enrollment.version by 1"
      - from: OPTED_OUT
        to: ACTIVE
        trigger: "POST /dr/enrollments/{id}/re-enroll"
        actor: Aggregator
        preconditions:
          - "acting Aggregator X-User-ID == Device.aggregator_id"
          - "Program.status == ACTIVE"
          - "Device.status == ACTIVE"
        side_effects:
          - "status = ACTIVE"
          - "Program.total_committed_kw += committed_kw"
          - "Aggregator.enrolled_committed_kw += committed_kw"
          - "increments Enrollment.version by 1"
        note: "Cyclic loop ACTIVE<->OPTED_OUT; committed_kw is conserved (compensating invariant enrollment_committed_kw_conserved)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /dr/enrollments/{id}/terminate"
        actor: Aggregator
        preconditions:
          - "acting Aggregator X-User-ID == Device.aggregator_id"
        side_effects:
          - "status = TERMINATED"
          - "Program.total_committed_kw -= committed_kw"
          - "Aggregator.enrolled_committed_kw -= committed_kw"
          - "increments Enrollment.version by 1"

  - entity: DispatchEvent
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: NOTIFIED
        trigger: "POST /dr/dispatch-events/{id}/notify"
        actor: ProgramOperator
        preconditions:
          - "current_utc <= window_start - Program.notification_lead_minutes (business_temporal)"
          - "at least one Enrollment of this program is in status ACTIVE"
        side_effects:
          - "status = NOTIFIED"
          - "dispatched_by_user_id = acting ProgramOperator X-User-ID"
          - "create one Dispatch (status PENDING) per ACTIVE Enrollment of the program, assigned_reduction_kw = Enrollment.committed_kw"
          - "increments DispatchEvent.version by 1"
      - from: NOTIFIED
        to: ACTIVE
        trigger: "POST /dr/dispatch-events/{id}/start"
        actor: ProgramOperator
        preconditions:
          - "current_utc >= window_start"
        side_effects:
          - "status = ACTIVE"
          - "increments DispatchEvent.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /dr/dispatch-events/{id}/complete"
        actor: ProgramOperator
        preconditions:
          - "current_utc >= window_end"
        side_effects:
          - "status = COMPLETED"
          - "CASCADE depth-3 (transitive_cascade event_complete_measurement): (1) each non-terminal Dispatch (PENDING/ACKNOWLEDGED/CURTAILING) computes baseline_kw, avg_event_load_kw, actual_reduction_kw, delivered_kwh, performance_ratio and moves to COMPLETED; OVERRIDDEN and OPTED_OUT dispatches are excluded and stay terminal"
          - "(2) because each Dispatch reached COMPLETED, its Enrollment.season_delivered_kwh += Dispatch.delivered_kwh"
          - "(3) because Enrollment.season_delivered_kwh changed, the owning Aggregator.season_delivered_kwh is recomputed as the sum over its enrollments"
          - "increments DispatchEvent.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dr/dispatch-events/{id}/cancel"
        actor: ProgramOperator
        preconditions: []
        side_effects:
          - "status = CANCELLED"
          - "increments DispatchEvent.version by 1"
      - from: NOTIFIED
        to: CANCELLED
        trigger: "POST /dr/dispatch-events/{id}/cancel"
        actor: ProgramOperator
        preconditions: []
        side_effects:
          - "status = CANCELLED"
          - "all child Dispatches in PENDING/ACKNOWLEDGED move to OPTED_OUT (event withdrawn)"
          - "increments DispatchEvent.version by 1"

  - entity: Dispatch
    initial_state: PENDING
    terminal_states: [OVERRIDDEN, OPTED_OUT, COMPLETED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /dr/dispatches/{id}/acknowledge"
        actor: Aggregator
        preconditions:
          - "acting Aggregator X-User-ID == Device.aggregator_id (via Enrollment->Device)"
          - "DispatchEvent.status in {NOTIFIED, ACTIVE} (cross-entity: Dispatch depends on DispatchEvent)"
        side_effects:
          - "status = ACKNOWLEDGED"
          - "increments Dispatch.version by 1"
      - from: ACKNOWLEDGED
        to: CURTAILING
        trigger: "POST /dr/dispatches/{id}/start-curtailment"
        actor: Aggregator
        preconditions:
          - "acting Aggregator X-User-ID == Device.aggregator_id"
          - "DispatchEvent.status == ACTIVE (cross-entity: Dispatch depends on DispatchEvent)"
        side_effects:
          - "status = CURTAILING"
          - "increments Dispatch.version by 1"
      - from: PENDING
        to: OVERRIDDEN
        trigger: "POST /dr/dispatches/{id}/override"
        actor: Customer
        preconditions:
          - "acting Customer X-User-ID == Device.customer_id (via Enrollment->Device)"
          - "current_utc < DispatchEvent.window_end (business_temporal: override window still open)"
        side_effects:
          - "status = OVERRIDDEN"
          - "increments Dispatch.version by 1"
      - from: ACKNOWLEDGED
        to: OVERRIDDEN
        trigger: "POST /dr/dispatches/{id}/override"
        actor: Customer
        preconditions:
          - "acting Customer X-User-ID == Device.customer_id"
          - "current_utc < DispatchEvent.window_end (business_temporal)"
        side_effects:
          - "status = OVERRIDDEN"
          - "increments Dispatch.version by 1"
      - from: CURTAILING
        to: OVERRIDDEN
        trigger: "POST /dr/dispatches/{id}/override"
        actor: Customer
        preconditions:
          - "acting Customer X-User-ID == Device.customer_id"
          - "current_utc < DispatchEvent.window_end (business_temporal)"
        side_effects:
          - "status = OVERRIDDEN"
          - "increments Dispatch.version by 1"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /dr/settlements/{id}/submit"
        actor: ProgramOperator
        preconditions:
          - "DispatchEvent.status == COMPLETED (cross-entity: Settlement depends on DispatchEvent)"
        side_effects:
          - "recompute each eligible Dispatch.net_payment_cents (calc dispatch_line_payout)"
          - "recompute total_delivered_kwh and net_payment_cents (calc settlement_net_payment)"
          - "status = PENDING_APPROVAL"
          - "increments Settlement.version by 1"
      - from: REVISED
        to: PENDING_APPROVAL
        trigger: "POST /dr/settlements/{id}/submit"
        actor: ProgramOperator
        preconditions: []
        side_effects:
          - "recompute net_payment_cents (calc settlement_net_payment)"
          - "status = PENDING_APPROVAL"
          - "increments Settlement.version by 1"
        note: "Cyclic loop PENDING_APPROVAL->DISPUTED->REVISED->PENDING_APPROVAL"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /dr/settlements/{id}/approve"
        actor: ProgramOperator
        preconditions:
          - "acting ProgramOperator X-User-ID != DispatchEvent.dispatched_by_user_id (business_safety: segregation of duties)"
        side_effects:
          - "approved_by_user_id = acting X-User-ID"
          - "status = APPROVED"
          - "CASCADE depth-2 (transitive_cascade settlement_approve_payout): (1) create one Payment (status ISSUED, amount_cents = this aggregator's summed dispatch net) per distinct aggregator among the event's COMPLETED dispatches"
          - "(2) because each Payment was created ISSUED, its Aggregator.paid_balance_cents is recomputed (calc aggregator_paid_balance_cents)"
          - "DispatchEvent.status = SETTLED"
          - "increments Settlement.version by 1"
      - from: PENDING_APPROVAL
        to: DISPUTED
        trigger: "POST /dr/settlements/{id}/dispute"
        actor: Aggregator
        preconditions:
          - "acting Aggregator has at least one Dispatch in this settlement's event"
        side_effects:
          - "status = DISPUTED"
          - "increments Settlement.version by 1"
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /dr/settlements/{id}/dispute"
        actor: Aggregator
        preconditions:
          - "acting Aggregator has at least one Dispatch in this settlement's event"
        side_effects:
          - "status = DISPUTED"
          - "COMPENSATION (compensating invariant aggregator_paid_balance_conserved): every Payment of this settlement in status ISSUED moves to REVERSED; each affected Aggregator.paid_balance_cents recomputed (reversed payments excluded)"
          - "increments Settlement.version by 1"
      - from: DISPUTED
        to: REVISED
        trigger: "POST /dr/settlements/{id}/revise"
        actor: ProgramOperator
        preconditions: []
        side_effects:
          - "recompute each eligible Dispatch.net_payment_cents and settlement totals (calc dispatch_line_payout, settlement_net_payment)"
          - "status = REVISED"
          - "increments Settlement.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /dr/settlements/{id}/mark-paid"
        actor: ProgramOperator
        preconditions: []
        side_effects:
          - "status = PAID"
          - "every Payment of this settlement in status ISSUED moves to CLEARED"
          - "increments Settlement.version by 1"

  - entity: Payment
    initial_state: ISSUED
    terminal_states: [CLEARED, REVERSED]
    transitions:
      - from: ISSUED
        to: CLEARED
        trigger: "system: Settlement mark-paid"
        actor: system
        preconditions: []
        side_effects:
          - "status = CLEARED"
          - "increments Payment.version by 1"
      - from: ISSUED
        to: REVERSED
        trigger: "system: Settlement dispute after approval"
        actor: system
        preconditions: []
        side_effects:
          - "status = REVERSED"
          - "increments Payment.version by 1"

concurrency_rules:
  - rule_id: program-config-stale-version
    parent_entity: Program
    write_endpoint: "PATCH /dr/programs/{id}"
    occ_field: "expected_program_version"
    description: |
      Updating a Program's rate configuration against a version that has
      advanced since the client last read it is rejected. A prior update
      (which legitimately supersedes the earlier configuration) has already
      bumped Program.version, so the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: dispatch_baseline_kw
    trigger: "DispatchEvent complete (per eligible Dispatch)"
    algorithm: aggregation
    formula: |
      # pool = MeterReadings for Dispatch's Device with reading_type == BASELINE_WINDOW
      #        and dispatch_event_id == null, ordered by interval_start DESC,
      #        tie-break created_at ASC. Take the most recent BASELINE_LOOKBACK.
      lookback = pool[0 : BASELINE_LOOKBACK]           # up to 5 readings
      if len(lookback) < BASELINE_TOP_N: raise ERR_BASELINE_DATA_MISSING
      if event.baseline_method_snapshot == "TEN_OF_TEN":
          top = sorted(lookback by kw_load DESC, tie-break interval_start DESC)[0 : BASELINE_TOP_N]
          baseline_kw = mean(top.kw_load)
      elif event.baseline_method_snapshot == "WEATHER_REGRESSION":
          baseline_kw = mean(lookback.kw_load) * WEATHER_ADJUST_FACTOR
      baseline_kw = round(baseline_kw, 3)
    input_set: "Device's BASELINE_WINDOW MeterReadings with null dispatch_event_id; most recent 5 by interval_start"
    constants:
      BASELINE_LOOKBACK: 5
      BASELINE_TOP_N: 3
      WEATHER_ADJUST_FACTOR: 1.10
    precision: "3 decimal places, round_half_up"
    variants:
      - name: TEN_OF_TEN
        when: "event.baseline_method_snapshot == TEN_OF_TEN"
        difference: "mean of the top 3 kw_load values among the last 5 baseline readings"
      - name: WEATHER_REGRESSION
        when: "event.baseline_method_snapshot == WEATHER_REGRESSION"
        difference: "mean of all last-5 baseline readings scaled by 1.10; ignores the top-N selection"

  - name: dispatch_delivered_kwh
    trigger: "DispatchEvent complete (per eligible Dispatch)"
    algorithm: aggregation
    formula: |
      event_duration_hours = (event.window_end - event.window_start) / 3600 seconds
      evt = MeterReadings for Device with reading_type == EVENT_WINDOW
            and dispatch_event_id == event.id
      avg_event_load_kw = mean(evt.kw_load)            # 0 if evt is empty
      actual_reduction_kw = max(0, baseline_kw - avg_event_load_kw)
      delivered_kwh = round(actual_reduction_kw * event_duration_hours, 3)
      performance_ratio = round(actual_reduction_kw / assigned_reduction_kw, 4)
                          if assigned_reduction_kw > 0 else 0
    input_set: "Device's EVENT_WINDOW MeterReadings whose dispatch_event_id == this event"
    constants: {}
    precision: "delivered_kwh 3 dp; performance_ratio 4 dp; round_half_up"

  - name: dispatch_line_payout
    trigger: "Settlement submit and Settlement revise (per eligible Dispatch)"
    algorithm: tiered_pricing
    formula: |
      # inputs: delivered_kwh, assigned_reduction_kw, performance_ratio,
      #         event_duration_hours, program.incentive_rate_cents_per_kwh (R),
      #         program.penalty_rate_cents_per_kwh (P),
      #         program.performance_floor_pct (F)
      assigned_kwh = assigned_reduction_kw * event_duration_hours
      if performance_ratio >= OVERPERFORM_THRESHOLD:
          incentive = delivered_kwh * R * BONUS_MULTIPLIER
          penalty   = 0
      elif performance_ratio >= F:
          incentive = delivered_kwh * R
          penalty   = 0
      else:
          incentive = delivered_kwh * R
          penalty   = max(0, assigned_kwh - delivered_kwh) * P
      net = incentive - penalty
      net_payment_cents = max(NET_FLOOR_CENTS, round(net))   # round each dispatch to whole cents
    input_set: "Dispatches of the event in status COMPLETED (OVERRIDDEN / OPTED_OUT excluded)"
    constants:
      OVERPERFORM_THRESHOLD: 1.10
      BONUS_MULTIPLIER: 1.15
      NET_FLOOR_CENTS: 0
    precision: "whole cents per dispatch, round_half_up; net floored at 0"

  - name: settlement_net_payment
    trigger: "Settlement submit and Settlement revise"
    algorithm: aggregation
    formula: |
      eligible = Dispatches of the event in status COMPLETED
      total_delivered_kwh = round(sum(d.delivered_kwh for d in eligible), 3)
      if settlement.method_snapshot == "PAY_FOR_PERFORMANCE":
          # ROUND-ORDER PIN: each dispatch is already rounded to whole cents by
          # dispatch_line_payout; sum the ALREADY-ROUNDED per-dispatch cents.
          net_payment_cents = sum(d.net_payment_cents for d in eligible)
      elif settlement.method_snapshot == "CAPACITY_PAYMENT":
          capacity = sum(d.assigned_reduction_kw for d in eligible) * program.capacity_incentive_cents_per_kw
          shortfall = sum(max(0, d.assigned_reduction_kw*event_duration_hours - d.delivered_kwh) for d in eligible) * program.penalty_rate_cents_per_kwh
          net_payment_cents = max(NET_FLOOR_CENTS, round(capacity - shortfall))
    input_set: "COMPLETED Dispatches of the settled event"
    constants:
      NET_FLOOR_CENTS: 0
    precision: "whole cents, round_half_up"
    variants:
      - name: PAY_FOR_PERFORMANCE
        when: "program.settlement_method == PAY_FOR_PERFORMANCE"
        difference: "sum of per-dispatch already-rounded net cents (round-per-line then sum)"
      - name: CAPACITY_PAYMENT
        when: "program.settlement_method == CAPACITY_PAYMENT"
        difference: "committed-capacity payment (committed_kw * capacity rate) minus energy shortfall penalty; independent of the per-dispatch tiered payout"

  - name: program_total_committed_kw
    trigger: "Enrollment activate / opt-out / re-enroll / terminate"
    algorithm: aggregation
    formula: |
      Program.total_committed_kw = sum(e.committed_kw
        for e in Enrollments where e.program_id == program.id and e.status == ACTIVE)
      # Aggregator.enrolled_committed_kw = sum(e.committed_kw for that aggregator's
      # ACTIVE enrollments) is maintained by the same transitions.
    input_set: "Enrollments in status ACTIVE for the program (aggregator variant filters by Device.aggregator_id)"
    constants: {}
    precision: "kW exact (no rounding)"

  - name: aggregator_paid_balance_cents
    trigger: "Settlement approve (Payment ISSUED), mark-paid (CLEARED), dispute-after-approval (REVERSED)"
    algorithm: aggregation
    formula: |
      Aggregator.paid_balance_cents = sum(p.amount_cents
        for p in Payments where p.aggregator_id == aggregator.id
        and p.status in {ISSUED, CLEARED})   # REVERSED excluded
    input_set: "Payments of the aggregator in status ISSUED or CLEARED"
    constants: {}
    precision: "whole cents exact"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: existence
    check: "FK targets in the request body exist (customer_id, program_id, device_id, dispatch_event_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /dr/devices, POST /dr/enrollments, POST /dr/dispatch-events, POST /dr/devices/{id}/meter-readings, POST /dr/settlements"
  - priority: 5
    category: business_referential
    check: "Acting entity_backed user owns the target resource (Aggregator == Device.aggregator_id; Customer == Device.customer_id via Enrollment/Dispatch)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "Aggregator/Customer write endpoints on devices, enrollments, dispatches, meter-readings"
  - priority: 6
    category: business_constraint
    check: "Required body fields present and well-typed"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH"
  - priority: 7
    category: business_constraint
    check: "Enum fields hold a declared value"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all POST/PATCH with enum inputs"
  - priority: 8
    category: state
    check: "Target resource is in a state from which this transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: state
    check: "Enrollment activate/re-enroll requires Program.status == ACTIVE"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /dr/enrollments/{id}/activate, POST /dr/enrollments/{id}/re-enroll"
  - priority: 10
    category: state
    check: "Enrollment activate/re-enroll requires Device.status == ACTIVE"
    error_id: ERR_DEVICE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /dr/enrollments/{id}/activate, POST /dr/enrollments/{id}/re-enroll"
  - priority: 11
    category: business_constraint
    check: "No other ACTIVE Enrollment exists for the same (device_id, program_id)"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /dr/enrollments/{id}/activate"
  - priority: 12
    category: business_safety
    check: "Settlement approver X-User-ID != DispatchEvent.dispatched_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /dr/settlements/{id}/approve"
  - priority: 13
    category: business_temporal
    check: "Notify occurs at least notification_lead_minutes before window_start"
    error_id: ERR_NOTIFY_LEAD_NOT_MET
    http_status: 422
    applies_to: "POST /dr/dispatch-events/{id}/notify"
  - priority: 14
    category: business_temporal
    check: "Event start requires current_utc >= window_start"
    error_id: ERR_EVENT_NOT_STARTED
    http_status: 409
    applies_to: "POST /dr/dispatch-events/{id}/start"
  - priority: 15
    category: business_temporal
    check: "Event complete requires current_utc >= window_end"
    error_id: ERR_EVENT_NOT_ENDED
    http_status: 409
    applies_to: "POST /dr/dispatch-events/{id}/complete"
  - priority: 16
    category: business_temporal
    check: "Dispatch override requires current_utc < DispatchEvent.window_end (override window open)"
    error_id: ERR_OVERRIDE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /dr/dispatches/{id}/override"
  - priority: 17
    category: business_constraint
    check: "New DispatchEvent [window_start, window_end) padded by EVENT_BUFFER_MINUTES (120) minutes on each side must not collide with any non-CANCELLED event of the same program; reject when new.window_start < existing.window_end + 120min AND new.window_end + 120min > existing.window_start"
    error_id: ERR_EVENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /dr/dispatch-events"
  - priority: 18
    category: business_fiscal
    check: "Count of non-CANCELLED DispatchEvents of the program is < max_events_per_season"
    error_id: ERR_SEASON_EVENT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /dr/dispatch-events"
  - priority: 19
    category: business_constraint
    check: "New MeterReading [interval_start, interval_end) must not overlap an existing reading of the same device and reading_type (adjacency end==start allowed)"
    error_id: ERR_READING_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /dr/devices/{id}/meter-readings"
  - priority: 20
    category: business_temporal
    check: "interval_start < interval_end and window_start < window_end"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /dr/devices/{id}/meter-readings, POST /dr/dispatch-events"
  - priority: 21
    category: business_fiscal
    check: "expected_program_version matches Program.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /dr/programs/{id}"

endpoints:
  - method: POST
    path: "/dr/programs"
    description: "Create a program (DRAFT)"
    roles: [ProgramOperator]
    code: 201
    input: [name, utility_name, incentive_rate_cents_per_kwh, penalty_rate_cents_per_kwh, capacity_incentive_cents_per_kw, "baseline_method?", "settlement_method?", "performance_floor_pct?", "notification_lead_minutes?", "max_events_per_season?", season_start_date, season_end_date]
    output: Program
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/dr/programs/{id}"
    description: "Fetch a program"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/dr/programs"
    description: "List programs"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: PATCH
    path: "/dr/programs/{id}"
    description: "Update program rate configuration (OCC-guarded)"
    roles: [ProgramOperator]
    code: 200
    input: [expected_program_version, "incentive_rate_cents_per_kwh?", "penalty_rate_cents_per_kwh?", "capacity_incentive_cents_per_kw?", "performance_floor_pct?", "notification_lead_minutes?", "max_events_per_season?"]
    output: Program
    side_effects: ["updates supplied fields", "increments Program.version by 1"]
  - method: POST
    path: "/dr/programs/{id}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Program
    side_effects: ["status = ACTIVE", "increments Program.version by 1"]
  - method: POST
    path: "/dr/programs/{id}/close"
    description: "ACTIVE -> CLOSED"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Program
    side_effects: ["status = CLOSED", "increments Program.version by 1"]

  - method: POST
    path: "/dr/aggregators"
    description: "Onboard an aggregator"
    roles: [ProgramOperator]
    code: 201
    input: [name, contact_email]
    output: Aggregator
    side_effects: []
  - method: GET
    path: "/dr/aggregators/{id}"
    description: "Fetch an aggregator (includes computed balances)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: Aggregator
    side_effects: []

  - method: POST
    path: "/dr/customers"
    description: "Onboard a customer"
    roles: [ProgramOperator]
    code: 201
    input: [name, email, service_address, utility_account_id]
    output: Customer
    side_effects: []
  - method: GET
    path: "/dr/customers/{id}"
    description: "Fetch a customer"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/dr/devices"
    description: "Register a device; aggregator_id set from acting Aggregator X-User-ID"
    roles: [Aggregator]
    code: 201
    input: [customer_id, device_type, nameplate_kw, "capacity_kwh?"]
    output: Device
    side_effects: ["aggregator_id = X-User-ID", "status = ACTIVE"]
  - method: GET
    path: "/dr/devices/{id}"
    description: "Fetch a device"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: Device
    side_effects: []
  - method: GET
    path: "/dr/devices"
    description: "List/filter devices (reverse lookup by customer_id or aggregator_id)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["customer_id?", "aggregator_id?", "status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []
  - method: POST
    path: "/dr/devices/{id}/decommission"
    description: "ACTIVE -> DECOMMISSIONED"
    roles: [Aggregator]
    code: 200
    input: []
    output: Device
    side_effects: ["status = DECOMMISSIONED", "increments Device.version by 1"]
  - method: POST
    path: "/dr/devices/{id}/meter-readings"
    description: "Append an immutable interval meter reading"
    roles: [Aggregator]
    code: 201
    input: [interval_start, interval_end, kw_load, reading_type, "dispatch_event_id?"]
    output: MeterReading
    side_effects: []
  - method: GET
    path: "/dr/devices/{id}/meter-readings"
    description: "List a device's meter readings (reverse lookup by device_id)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["reading_type?", "limit?", "offset?"]
    output: MeterReading[]
    side_effects: []

  - method: GET
    path: "/dr/meter-readings/{id}"
    description: "Fetch a meter reading"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: MeterReading
    side_effects: []
  - method: GET
    path: "/dr/meter-readings"
    description: "List/filter meter readings (reverse lookup by dispatch_event_id or device_id)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["device_id?", "dispatch_event_id?", "reading_type?", "limit?", "offset?"]
    output: MeterReading[]
    side_effects: []

  - method: POST
    path: "/dr/enrollments"
    description: "Enroll a device in a program (PENDING)"
    roles: [Aggregator]
    code: 201
    input: [device_id, program_id, committed_kw]
    output: Enrollment
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/dr/enrollments/{id}"
    description: "Fetch an enrollment"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/dr/enrollments"
    description: "List/filter enrollments (reverse lookup by device_id or program_id)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["device_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/dr/enrollments/{id}/activate"
    description: "PENDING -> ACTIVE"
    roles: [Aggregator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status = ACTIVE", "Program.total_committed_kw += committed_kw", "Aggregator.enrolled_committed_kw += committed_kw", "increments Enrollment.version by 1"]
  - method: POST
    path: "/dr/enrollments/{id}/opt-out"
    description: "ACTIVE -> OPTED_OUT (season opt-out)"
    roles: [Customer, Aggregator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status = OPTED_OUT", "Program.total_committed_kw -= committed_kw", "Aggregator.enrolled_committed_kw -= committed_kw", "increments Enrollment.version by 1"]
  - method: POST
    path: "/dr/enrollments/{id}/re-enroll"
    description: "OPTED_OUT -> ACTIVE"
    roles: [Aggregator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status = ACTIVE", "Program.total_committed_kw += committed_kw", "Aggregator.enrolled_committed_kw += committed_kw", "increments Enrollment.version by 1"]
  - method: POST
    path: "/dr/enrollments/{id}/terminate"
    description: "ACTIVE -> TERMINATED"
    roles: [Aggregator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status = TERMINATED", "Program.total_committed_kw -= committed_kw", "Aggregator.enrolled_committed_kw -= committed_kw", "increments Enrollment.version by 1"]

  - method: POST
    path: "/dr/dispatch-events"
    description: "Schedule a dispatch event (SCHEDULED)"
    roles: [ProgramOperator]
    code: 201
    input: [program_id, window_start, window_end, target_reduction_kw]
    output: DispatchEvent
    side_effects: ["status = SCHEDULED", "baseline_method_snapshot = Program.baseline_method"]
  - method: GET
    path: "/dr/dispatch-events/{id}"
    description: "Fetch a dispatch event"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: DispatchEvent
    side_effects: []
  - method: GET
    path: "/dr/dispatch-events"
    description: "List/filter dispatch events (reverse lookup by program_id)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: DispatchEvent[]
    side_effects: []
  - method: POST
    path: "/dr/dispatch-events/{id}/notify"
    description: "SCHEDULED -> NOTIFIED; fan-out Dispatch rows"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: DispatchEvent
    side_effects: ["status = NOTIFIED", "dispatched_by_user_id = X-User-ID", "create one PENDING Dispatch per ACTIVE Enrollment", "increments DispatchEvent.version by 1"]
  - method: POST
    path: "/dr/dispatch-events/{id}/start"
    description: "NOTIFIED -> ACTIVE"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: DispatchEvent
    side_effects: ["status = ACTIVE", "increments DispatchEvent.version by 1"]
  - method: POST
    path: "/dr/dispatch-events/{id}/complete"
    description: "ACTIVE -> COMPLETED; measurement cascade"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: DispatchEvent
    side_effects: ["status = COMPLETED", "compute per-dispatch baseline_kw/actual_reduction_kw/delivered_kwh/performance_ratio", "accumulate Enrollment.season_delivered_kwh then Aggregator.season_delivered_kwh", "increments DispatchEvent.version by 1"]
  - method: POST
    path: "/dr/dispatch-events/{id}/cancel"
    description: "SCHEDULED/NOTIFIED -> CANCELLED"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: DispatchEvent
    side_effects: ["status = CANCELLED", "withdraw child Dispatches (-> OPTED_OUT)", "increments DispatchEvent.version by 1"]
  - method: GET
    path: "/dr/dispatch-events/{id}/dispatches"
    description: "List an event's dispatches (reverse lookup by dispatch_event_id)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Dispatch[]
    side_effects: []
  - method: GET
    path: "/dr/dispatch-events/{id}/settlement"
    description: "Fetch the event's settlement(s) (reverse lookup by dispatch_event_id); array of 0-1"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: Settlement[]
    side_effects: []

  - method: GET
    path: "/dr/dispatches/{id}"
    description: "Fetch a dispatch"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: Dispatch
    side_effects: []
  - method: GET
    path: "/dr/dispatches"
    description: "List/filter dispatches (reverse lookup by enrollment_id)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["enrollment_id?", "dispatch_event_id?", "status?", "limit?", "offset?"]
    output: Dispatch[]
    side_effects: []
  - method: POST
    path: "/dr/dispatches/{id}/acknowledge"
    description: "PENDING -> ACKNOWLEDGED"
    roles: [Aggregator]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["status = ACKNOWLEDGED", "increments Dispatch.version by 1"]
  - method: POST
    path: "/dr/dispatches/{id}/start-curtailment"
    description: "ACKNOWLEDGED -> CURTAILING (requires event ACTIVE)"
    roles: [Aggregator]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["status = CURTAILING", "increments Dispatch.version by 1"]
  - method: POST
    path: "/dr/dispatches/{id}/override"
    description: "PENDING/ACKNOWLEDGED/CURTAILING -> OVERRIDDEN (customer opts out of this event)"
    roles: [Customer]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["status = OVERRIDDEN", "excluded from settlement", "increments Dispatch.version by 1"]

  - method: POST
    path: "/dr/settlements"
    description: "Create a settlement (DRAFT) for a COMPLETED event"
    roles: [ProgramOperator]
    code: 201
    input: [dispatch_event_id]
    output: Settlement
    side_effects: ["status = DRAFT", "method_snapshot = Program.settlement_method"]
  - method: GET
    path: "/dr/settlements/{id}"
    description: "Fetch a settlement"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: POST
    path: "/dr/settlements/{id}/submit"
    description: "DRAFT/REVISED -> PENDING_APPROVAL; compute payouts"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Settlement
    side_effects: ["compute per-dispatch net_payment_cents", "compute total_delivered_kwh and net_payment_cents", "status = PENDING_APPROVAL", "increments Settlement.version by 1"]
  - method: POST
    path: "/dr/settlements/{id}/approve"
    description: "PENDING_APPROVAL -> APPROVED; SoD-gated; payout cascade"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Settlement
    side_effects: ["approved_by_user_id = X-User-ID", "status = APPROVED", "create Payments (ISSUED) per aggregator, recompute Aggregator.paid_balance_cents", "DispatchEvent.status = SETTLED", "increments Settlement.version by 1"]
  - method: POST
    path: "/dr/settlements/{id}/dispute"
    description: "PENDING_APPROVAL/APPROVED -> DISPUTED (APPROVED reverses Payments)"
    roles: [Aggregator]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status = DISPUTED", "if was APPROVED: reverse ISSUED Payments and recompute Aggregator.paid_balance_cents", "increments Settlement.version by 1"]
  - method: POST
    path: "/dr/settlements/{id}/revise"
    description: "DISPUTED -> REVISED; recompute payouts"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Settlement
    side_effects: ["recompute per-dispatch net_payment_cents and totals", "status = REVISED", "increments Settlement.version by 1"]
  - method: POST
    path: "/dr/settlements/{id}/mark-paid"
    description: "APPROVED -> PAID; clear Payments"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status = PAID", "ISSUED Payments -> CLEARED", "increments Settlement.version by 1"]
  - method: GET
    path: "/dr/settlements/{id}/payments"
    description: "List a settlement's payments (reverse lookup by settlement_id)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: "/dr/payments/{id}"
    description: "Fetch a payment"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/dr/payments"
    description: "List/filter payments (reverse lookup by aggregator_id or settlement_id)"
    roles: [ProgramOperator, Aggregator, Customer, Auditor]
    code: 200
    input: ["aggregator_id?", "settlement_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock setter. Server boots with current_utc defaulting to 2026-05-01T00:00:00Z; all deadline/window rules read this clock, never wall-clock time."
    roles: [ProgramOperator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["current_utc = to_iso8601"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unrecognized X-User-Role or missing X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this endpoint"
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, bad type, or interval where start >= end"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "Enum field holds a value outside its declared set"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "Referenced program id does not exist"
  - id: ERR_AGGREGATOR_NOT_FOUND
    http: 404
    condition: "Referenced aggregator id does not exist"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Referenced customer id does not exist"
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "Referenced device id does not exist"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Referenced enrollment id does not exist"
  - id: ERR_DISPATCH_EVENT_NOT_FOUND
    http: 404
    condition: "Referenced dispatch event id does not exist"
  - id: ERR_DISPATCH_NOT_FOUND
    http: 404
    condition: "Referenced dispatch id does not exist"
  - id: ERR_METER_READING_NOT_FOUND
    http: 404
    condition: "Referenced meter reading id does not exist"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "Referenced settlement id does not exist"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "Referenced payment id does not exist"
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "entity_backed actor is not the owner of the target resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which this transition is allowed"
  - id: ERR_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "Enrollment activate/re-enroll while Program.status != ACTIVE"
  - id: ERR_DEVICE_NOT_ELIGIBLE
    http: 409
    condition: "Enrollment activate/re-enroll while Device.status != ACTIVE"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "Another ACTIVE Enrollment already exists for the (device_id, program_id)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Settlement approver X-User-ID equals the event's dispatched_by_user_id"
  - id: ERR_NO_ELIGIBLE_ENROLLMENTS
    http: 409
    condition: "Notify an event whose program has zero ACTIVE Enrollments"
  - id: ERR_NOTIFY_LEAD_NOT_MET
    http: 422
    condition: "Notify less than notification_lead_minutes before window_start"
  - id: ERR_EVENT_NOT_STARTED
    http: 409
    condition: "Start event before current_utc >= window_start"
  - id: ERR_EVENT_NOT_ENDED
    http: 409
    condition: "Complete event before current_utc >= window_end"
  - id: ERR_OVERRIDE_WINDOW_CLOSED
    http: 409
    condition: "Override dispatch at/after DispatchEvent.window_end"
  - id: ERR_EVENT_WINDOW_CONFLICT
    http: 409
    condition: "New event window (padded by 120 min) collides with a non-CANCELLED event of the same program"
  - id: ERR_SEASON_EVENT_CAP_EXCEEDED
    http: 409
    condition: "Program already has max_events_per_season non-CANCELLED events"
  - id: ERR_READING_INTERVAL_OVERLAP
    http: 409
    condition: "New meter reading interval overlaps an existing reading of the same device and reading_type"
  - id: ERR_BASELINE_DATA_MISSING
    http: 422
    condition: "Completing an event but a participating device has fewer than BASELINE_TOP_N (3) baseline readings"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_program_version does not match Program.version (OCC)"

roles:
  - name: ProgramOperator
    description: "Utility-side operator: manages programs, dispatches events, onboards aggregators/customers, runs settlements. A single operator user may not both dispatch an event and approve its settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /dr/programs and lifecycle (activate/close/PATCH)"
      - "POST /dr/aggregators, POST /dr/customers"
      - "DispatchEvent create/notify/start/complete/cancel"
      - "Settlement create/submit/approve/revise/mark-paid"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads"
  - name: Aggregator
    description: "VPP aggregator that registers devices, enrolls them, submits meter readings, acknowledges dispatches and drives curtailment; may opt out and dispute settlements. Acts only on devices it owns."
    identity: "entity_backed:Aggregator"
    exclusive_operations:
      - "POST /dr/devices and decommission, POST meter-readings"
      - "Enrollment create/activate/re-enroll/terminate"
      - "Dispatch acknowledge/start-curtailment"
      - "Settlement dispute"
    shared_operations:
      - "Enrollment opt-out (shared with Customer)"
      - "All GET reads"
  - name: Customer
    description: "Premise owner. Can opt an enrollment out of the season and override individual dispatches on its own devices."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "Dispatch override"
    shared_operations:
      - "Enrollment opt-out (shared with Aggregator)"
      - "All GET reads"
  - name: Auditor
    description: "Read-only compliance observer; no write operations."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All GET reads"
