  # =========================================================================
  # SECTION 8 - RBAC. Breadth: every exclusive operation refuses the neighbouring
  # role that would plausibly attempt it; every shared operation is reachable by
  # each role that declares it and by no other; the one entity-backed identity
  # (ServiceMember) is narrowed by ownership while the five opaque roles are not;
  # and the declared segregation_of_duties role model is enforced on the dispute
  # decision as well as on the hazard clearance.
  # =========================================================================
  - section: rbac
    instances:

      - name: every_exclusive_operation_refuses_the_role_that_would_reach_for_it
        claim_type: exclusive_operations
        grounds:
          - rbac.PlatformAdmin.exclusive_operations
          - rbac.PropertyManager.exclusive_operations
          - rbac.ServiceMember.exclusive_operations
          - rbac.MaintenanceTech.exclusive_operations
          - rbac.EnvironmentalSpecialist.exclusive_operations
          - rbac.InstallationHousingOffice.exclusive_operations
          - validations.priority_1
          - validations.priority_2
          - errors.ERR_UNAUTHORIZED_ROLE
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "One instance walks all six roles exclusive_operations lists in a single fixture, each denial aimed at the role that has the strongest operational reason to try it (the tech who wants to self-dispatch, the manager who wants to sign the residents Bill of Rights, the manager who wants to decide his own dispute) - and it pins the P1-before-P2 ordering so the unauthenticated 401 and the wrong-role 403 are never collapsed into one code."
        test_recipe:
          setup:
            - "One installation (Fort Cavazos Family Housing, ARMY, TX-FTC, bill_of_rights_version 2026.1) carrying the five Installation defaults: turn_buffer_days 5, offer_response_hours 72, decline_limit 2, decline_penalty_days 15, incentive_base_pct 0.03."
            - "One BahRate row for pay_grade E5, with_dependents true, effective_year 2026: monthly_rate_cents 245000, utility_allowance_cents 19500."
            - "One unit A-101, 2 bedrooms, TOWNHOME, designated JUNIOR_ENLISTED, historic_flag false."
