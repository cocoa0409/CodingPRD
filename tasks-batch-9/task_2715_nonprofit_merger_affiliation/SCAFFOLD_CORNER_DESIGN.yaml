            - "the survivor call returns HTTP status 201; Restructuring.${deal2}.status == EXPLORATORY with round_no 1, reserved_seat_pool 0 and restricted_asset_posture NOT_ASSESSED"
            - "GET /restructurings?initiator_org_id=${org_b} returns an empty list - neither refusal created a row"

      - name: a_fund_whose_historic_dollar_value_exceeds_its_value_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HDV_EXCEEDS_FUND_VALUE
          - validations.priority_31_ERR_HDV_EXCEEDS_FUND_VALUE
          - endpoints.POST_/restricted-funds
          - calculations.restricted_fund_transferable_amount
        distinguishing_aspect: "The historic dollar value is the statutory floor a PERM_ENDOWMENT may not spend below, and the JUDICIAL_MODIFICATION variant computes a 7 percent slice OF it, so a value larger than the fund itself would release more than the fund holds. Priority 31 is a pure arithmetic admissibility rule on the create payload with no state, no role and no deal involved, and it rejects only values strictly ABOVE the fund value: an hdv exactly equal to principal plus appreciation is a fully unspendable endowment, which is lawful and must be accepted."
        test_recipe:
          setup:
            - "One registered Organization and no funds at all"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
          trigger:
            - call: "POST /restricted-funds"
              payload: { org_id: "${org_a}", fund_name: "Founders Endowment", fund_type: "PERM_ENDOWMENT", principal_cents: 40000000, accumulated_appreciation_cents: 8000000, historic_dollar_value_cents: 48000001, restriction_purpose_code: "SC-SCHOLARSHIPS", restriction_conflict: false, donor_of_record_reachable: true }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
              captures: { e_hdv: $.data.error_id }
            - call: "GET /restricted-funds"
              payload: { org_id: "${org_a}" }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
            - call: "POST /restricted-funds"
              payload: { org_id: "${org_a}", fund_name: "Founders Endowment", fund_type: "PERM_ENDOWMENT", principal_cents: 40000000, accumulated_appreciation_cents: 8000000, historic_dollar_value_cents: 48000000, restriction_purpose_code: "SC-SCHOLARSHIPS", restriction_conflict: false, donor_of_record_reachable: true }
              as: CharitableTrustCounsel
              as_user_id: "ctc-001"
              captures: { fund: $.data.id }
          assert:
            - "the first create returns HTTP status 422 and e_hdv == ERR_HDV_EXCEEDS_FUND_VALUE - 48000001 is one cent above principal 40000000 plus appreciation 8000000"
            - "GET /restricted-funds?org_id=${org_a} returns an empty list with total 0 after the refusal, and Organization.${org_a}.restricted_corpus_cents == 0"
            - "the second create returns HTTP status 201 - an hdv exactly equal to the fund value is admissible, so the boundary is exclusive on the upper side only"
            - "RestrictedFund.${fund}.transfer_status == HELD, transferable_amount_cents == 0, transferred_amount_cents == 0, retained_amount_cents == 0 and unwind_count == 0"
            - "Organization.${org_a}.restricted_corpus_cents == 48000000 after the accepted create - the whole fund value counts against the holder while the fund has not moved"

  # ------------------------------------------------------------------ rbac
  # Table 7 of the claim-extraction guide asks, for EACH role, that it can perform
  # all of its exclusive_operations and shared_operations and that it cannot perform
  # another role's exclusive_operations (here ERR_ROLE_NOT_PERMITTED, the scaffold's
  # name for the guide's ERR_UNAUTHORIZED). complexity_profile.role_model is
  # segregation_of_duties, so the extra row "same user cannot do step A and step B"
  # is covered twice below: once on the X-User-Id axis (a lead may not clear its own
  # finding) and once on the reference axis (a certifying secretary may not be the
  # recording secretary), which is how the scaffold tracks two humans behind one
  # entity_backed BoardSecretary id.
  - section: rbac
    instances:
      - name: platform_admin_owns_the_registry_and_the_clock_but_no_deal_write
        claim_type: role_permitted_operations
        grounds:
          - roles.PlatformAdmin
          - endpoints.POST_/organizations
          - endpoints.POST_/_clock/set_current_utc
          - endpoints.POST_/regulatory-sweeps
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "PlatformAdmin holds all three exclusive registry/harness operations and three shared writes, and holds NO deal write at all - it is never a party and never votes. The two refusals also pin the priority ladder: the role check at priority 2 answers before the self-restructuring rule at 23 and before any existence rule, so a PlatformAdmin request naming the same organization twice, or naming a fund id that does not exist, still comes back 403."
        test_recipe:
          setup:
            - "Empty database; the admin builds its own fixtures as part of the claim"
          setup_api_calls: []
          trigger:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /programs"
              payload: { org_id: "${org_a}", name: "Riverside Mentor Match", service_category: "YOUTH_MENTORING", county_code: "CO-101", annual_expense_cents: 9000000, clients_served: 240 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /restricted-funds"
              payload: { org_id: "${org_a}", fund_name: "Mentor Scholarship Fund", fund_type: "TEMP_RESTRICTED", principal_cents: 50000000, accumulated_appreciation_cents: 12000000, historic_dollar_value_cents: 0, restriction_purpose_code: "SC-SCHOLARSHIPS", restriction_conflict: false, donor_of_record_reachable: true }
              as: PlatformAdmin
              captures: { fund: $.data.id }
            - call: "POST /organizations/${org_a}/financial-restatement"
              payload: { annual_expense_cents: 120000006, unrestricted_net_assets_cents: 60000000, restatement_reason: "FY2026 audited figures" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /regulatory-sweeps"
              payload: {}
              as: PlatformAdmin
            - call: "GET /organizations/${org_a}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /restricted-funds"
              payload: { org_id: "${org_a}" }
              as: PlatformAdmin
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_a}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { e_deal: $.data.error_id }
            - call: "POST /restricted-funds/${fund}/transfer"
              payload: { restructuring_id: "00000000-0000-0000-0000-0000000000b1", transfer_basis: "DONOR_CONSENT" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { e_transfer: $.data.error_id }
            - call: "POST /diligence-requests"
              payload: { restructuring_id: "00000000-0000-0000-0000-0000000000b1", workstream: "FINANCE", severity: "LOW", summary: "admin probe", exposure_cents: 0 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { e_finding: $.data.error_id }
          assert:
            - "the two creates return 201 and the restricted-fund create returns 201 - POST /restricted-funds is shared with CharitableTrustCounsel"
            - "the restatement returns HTTP status 200 and Organization.${org_a}.monthly_expense_cents == 10000001 - 120000006 / 12 is 10000000.5 and round_half_up carries it up"
            - "the clock write returns HTTP status 200 and the sweep returns HTTP status 200 with three empty result lists"
            - "both GETs return HTTP status 200, and GET /restricted-funds?org_id=${org_a} contains ${fund}"
            - "the POST /restructurings call returns HTTP status 403 with e_deal == ERR_ROLE_NOT_PERMITTED, NOT 422 ERR_SELF_RESTRUCTURING - priority 2 answers before priority 23"
            - "the transfer call returns HTTP status 403 with e_transfer == ERR_ROLE_NOT_PERMITTED, NOT 404 - priority 2 answers before every existence rule"
            - "the diligence create returns HTTP status 403 with e_finding == ERR_ROLE_NOT_PERMITTED"
            - "RestrictedFund.${fund}.transfer_status == HELD and version == 1 after the refusals"

      - name: strategy_officer_drives_the_deal_and_is_barred_from_the_board_vote
        claim_type: role_permitted_operations
        grounds:
          - roles.StrategyOfficer
          - roles.BoardSecretary
          - roles.DiligenceLead
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "StrategyOfficer holds the largest exclusive set in the scaffold (ten deal operations) plus three shared writes, and is nevertheless locked out of the board vote, the diligence desk and the registry. Because its identity is entity_backed the same call that is a 403 for a wrong ROLE would be a 403 ERR_NOT_DEAL_PARTY for a wrong PARTY, so both codes must be distinguishable from the same fixture."
        test_recipe:
          setup:
            - "A deal in LOI_NEGOTIATION with an ISSUED letter, created by the initiator's StrategyOfficer"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_days: 60, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { org_id: "${org_a}", name: "Riverside Mentor Match", service_category: "YOUTH_MENTORING", county_code: "CO-101", annual_expense_cents: 9000000, clients_served: 240 }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { prog: $.data.id }
            - call: "POST /organizations/${org_a}/financial-restatement"
              payload: { annual_expense_cents: 100000002, unrestricted_net_assets_cents: 61000000, restatement_reason: "Pledge reclassified as unrestricted" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}/dossier"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv: $.data.version }
            - call: "POST /board-approvals"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv}", approving_party: "INITIATOR", seats_total: 15, recusals: 0, votes_for: 12, votes_against: 0, abstentions: 0, conflict_disclosures_count: 0, recording_secretary_ref: "SEC-A-1" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { e_board: $.data.error_id }
            - call: "POST /diligence-requests"
              payload: { restructuring_id: "${deal}", workstream: "CONTRACTS", severity: "LOW", summary: "officer probe", exposure_cents: 0 }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { e_diligence: $.data.error_id }
            - call: "POST /organizations"
              payload: { legal_name: "Officer Registered Entity", ein: "66-6666666", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 1200000, unrestricted_net_assets_cents: 100000 }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { e_registry: $.data.error_id }
            - call: "POST /restricted-funds/00000000-0000-0000-0000-0000000000b2/transfer"
              payload: { restructuring_id: "${deal}", transfer_basis: "DONOR_CONSENT" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { e_fund: $.data.error_id }
            - call: "POST /letters-of-intent/${loi}/withdraw"
              payload: { withdrawal_reason: "Terms revisited" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
              captures: { e_party: $.data.error_id }
            - call: "POST /letters-of-intent/${loi}/withdraw"
              payload: { withdrawal_reason: "Terms revisited" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
          assert:
            - "the programme create and the financial restatement both succeed - they are StrategyOfficer shared_operations"
            - "the dossier read returns HTTP status 200"
            - "e_board == ERR_ROLE_NOT_PERMITTED with HTTP status 403 - recording the board vote is BoardSecretary-exclusive, and priority 2 answers before the deal-state rule at 16 that this LOI_NEGOTIATION deal would also fail"
            - "e_diligence == ERR_ROLE_NOT_PERMITTED with HTTP status 403 - raising a finding is DiligenceLead-exclusive"
            - "e_registry == ERR_ROLE_NOT_PERMITTED with HTTP status 403 - registering an organization is PlatformAdmin-exclusive"
            - "e_fund == ERR_ROLE_NOT_PERMITTED with HTTP status 403 and no ERR_RESTRICTED_FUND_NOT_FOUND, even though the fund id is fabricated"
            - "the withdraw attempted by the TARGET returns HTTP status 403 with e_party == ERR_NOT_DEAL_PARTY - the role is right and the party is wrong, which is a different code from the three above"
            - "the withdraw by the INITIATOR returns HTTP status 200; LetterOfIntent.${loi}.status == WITHDRAWN with exclusivity_status RELEASED"

      - name: board_secretary_may_certify_only_its_own_partys_approval
        claim_type: role_forbidden_operations
        grounds:
          - roles.BoardSecretary
          - validations.priority_13_ERR_NOT_DEAL_PARTY
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - state_machines.BoardApproval
        distinguishing_aspect: "BoardSecretary is entity_backed, so its three exclusive operations are additionally scoped to the Organization resolved from approving_party - not merely to the two parties of the deal. The counterparty secretary and a stranger organization are both refused with ERR_NOT_DEAL_PARTY, while a role that is not BoardSecretary at all is refused earlier with ERR_ROLE_NOT_PERMITTED, and only the owning party's secretary may certify."
