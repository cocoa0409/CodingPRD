            - "the touching window is accepted: BrandStandardDispute.${d2}.status == OPENED, round == 0, current_cost_estimate_cents == 900000"
            - "the one-day-earlier window on the same franchise_requirement_ref returns error_id ERR_DISPUTE_WINDOW_CONFLICT with HTTP 409 and persists nothing"
            - "the identical overlapping window on franchise_requirement_ref BSR-2026-099 is accepted: BrandStandardDispute.${d3}.status == OPENED"
            - "GET /hotel-management/agreements/${agr8b}/brand-disputes returns total_count == 3"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_ledger_conservation_across_dispute_funding_and_rescission
        grounds:
          - calculations.reserve_ledger_running_balance
          - state_machines.BrandStandardDispute.OWNER_COUNTERED_to_RESOLVED_OWNER_FUNDS
          - state_machines.BrandStandardDispute.RESOLVED_OWNER_FUNDS_to_OWNER_COUNTERED
          - entities.ReserveLedgerEntry.fields.balance_after_cents
          - validations[priority=46]
        distinguishing_aspect: |
          Append-only-ledger compensation: the reversal is a new DISBURSEMENT_REVERSAL row, never a
          mutation of the DISBURSEMENT row, and the invariant asserted is that the signed sum of the
          three ReserveLedgerEntry amounts equals ManagementAgreement.ffe_reserve_balance_cents at
          2200001, with each row's balance_after_cents replaying the running balance
          2200001 -> 0 -> 2200001.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE whose executed (2026, 9) distribution has contributed 2200001 to the reserve, so ffe_reserve_balance_cents is 2200001 and the ledger holds one CONTRIBUTION row."
            - "One BrandStandardDispute in RESOLVED_OWNER_FUNDS at round 1 with funding_source FFE_RESERVE and funded_amount_cents 2200001 — exactly the whole reserve balance, so ffe_reserve_balance_cents is 0 and the ledger holds a second, DISBURSEMENT, row."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Reserve Conservation Hotel", owner_entity_name: "Ledger Owner LP", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0.04, centralized_services_cap_pct: 0.015, working_capital_floor_cents: 500000, initial_working_capital_cents: 1000000, max_dispute_rounds: 1 }
              as: PlatformAdmin
              captures: { agr9a: $.data.id }
            - call: "POST /hotel-management/agreements/${agr9a}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { agr9a_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${agr9a}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 600000000, budgeted_operating_expenses_cents: 400000000, expected_agreement_version: "${agr9a_v2}" }
              as: HotelManagerOps
              captures: { bud9a: $.data.id }
            - call: "POST /hotel-management/budgets/${bud9a}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${bud9a}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agr9a}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 40000015, fnb_revenue_cents: 12000005, other_revenue_cents: 3000005, operating_expenses_cents: 30000000, closing_cash_available_cents: 6000000 }
              as: HotelManagerOps
              captures: { pkg9a: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkg9a}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${pkg9a}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/report-packages/${pkg9a}/distributions"
              payload: {}
              as: HotelManagerOps
              captures: { dist9a: "$.data[0].id" }
            - call: "POST /hotel-management/distributions/${dist9a}/execute"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/agreements/${agr9a}/brand-disputes"
              payload: { franchise_requirement_ref: "BSR-2026-311", estimated_cost_cents: 2200001, remediation_start_utc: "2026-09-01T00:00:00Z", remediation_deadline_utc: "2026-12-01T00:00:00Z" }
              as: AssetManager
              captures: { disp9a: $.data.id }
            - call: "POST /hotel-management/brand-disputes/${disp9a}/rounds"
              payload: { action: "MANAGER_RESPONSE", cost_estimate_cents: 2200001 }
              as: HotelManagerOps
            - call: "POST /hotel-management/brand-disputes/${disp9a}/rounds"
              payload: { action: "OWNER_COUNTER", cost_estimate_cents: 2200001 }
              as: AssetManager
            - call: "POST /hotel-management/brand-disputes/${disp9a}/rounds"
              payload: { action: "RESOLVE_OWNER_FUNDS", funding_source: "FFE_RESERVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          trigger:
            - call: "POST /hotel-management/brand-disputes/${disp9a}/rounds"
              payload: { action: "RESCIND_RESOLUTION", note: "franchisor deferred the standard" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/agreements/${agr9a}/reserve-ledger"
              payload: {}
              as: AssetManager
            - call: "GET /hotel-management/agreements/${agr9a}"
              payload: {}
              as: AssetManager
          assert:
            - "ManagementAgreement.${agr9a}.ffe_reserve_balance_cents == 2200001, exactly the pre-disbursement figure"
            - "the reserve-ledger list returns total_count == 3 in created_at ASC order: (CONTRIBUTION, +2200001, balance_after 2200001, DISTRIBUTION_EXECUTION), (DISBURSEMENT, -2200001, balance_after 0, BRAND_DISPUTE_FUNDING), (DISBURSEMENT_REVERSAL, +2200001, balance_after 2200001, BRAND_DISPUTE_RESCISSION)"
            - "no ledger row was mutated: the DISBURSEMENT row still carries amount_cents == -2200001 and balance_after_cents == 0"
            - "the signed sum of the three ReserveLedgerEntry.amount_cents values equals ManagementAgreement.${agr9a}.ffe_reserve_balance_cents == 2200001"
            - "BrandStandardDispute.${disp9a}.funded_amount_cents == 0, funding_source is null, status == OWNER_COUNTERED, round == 1"
            - "ManagementAgreement.${agr9a}.working_capital_balance_cents == 1000000 — the reserve round trip never touched working capital"

      - name: employment_claim_allocation_reversal_restores_both_balances
        grounds:
          - calculations.employment_claim_liability_split
          - state_machines.EmploymentClaim.FILED_to_ALLOCATED
          - state_machines.EmploymentClaim.ALLOCATED_to_REVERSED
          - entities.ManagementAgreement.fields.manager_liability_accrued_cents
          - entities.WorkingCapitalCall.fields.auto_created
        distinguishing_aspect: |
          Two-field parent-balance compensation with a share-conservation identity: ALLOCATE splits
          3000001 into manager 1500000 and owner 1500001 (the odd cent to the owner), debits working
          capital to -500001 and credits manager liability to 1500000; REVERSE restores 1000000 and 0
          exactly, and the CLAIM_ALLOCATION working capital call of 1000001 deliberately survives the
          reversal — a residue the reserve-ledger instance has no analogue for.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE with employee_model MANAGER_EMPLOYEES, manager_indemnity_cap_cents 2000000, working_capital_floor_cents 500000 and working_capital_balance_cents 1000000."
            - "One EmploymentClaim in status FILED with position_class GM, claim_amount_cents 3000001 and gross_negligence false."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Employer Of Record Hotel", owner_entity_name: "Liability Split Owner LLC", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, employee_model: "MANAGER_EMPLOYEES", manager_indemnity_cap_cents: 2000000, working_capital_floor_cents: 500000, initial_working_capital_cents: 1000000, funding_due_days: 15 }
              as: PlatformAdmin
              captures: { agr9b: $.data.id }
            - call: "POST /hotel-management/agreements/${agr9b}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { agr9b_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${agr9b}/employment-claims"
              payload: { position_class: "GM", claim_amount_cents: 3000001, gross_negligence: false }
              as: HotelManagerOps
              captures: { clm9b: $.data.id }
          trigger:
            - call: "POST /hotel-management/employment-claims/${clm9b}/allocation"
              payload: { action: "ALLOCATE" }
              as: AssetManager
            - call: "GET /hotel-management/agreements/${agr9b}/working-capital-calls"
              payload: {}
              as: AssetManager
              captures: { wcc9b: "$.data[0].id" }
            - call: "GET /hotel-management/agreements/${agr9b}"
              payload: {}
              as: AssetManager
            - call: "POST /hotel-management/employment-claims/${clm9b}/allocation"
              payload: { action: "REVERSE" }
              as: AssetManager
            - call: "GET /hotel-management/agreements/${agr9b}"
              payload: {}
              as: AssetManager
          assert:
            - "after ALLOCATE — EmploymentClaim.${clm9b}.status == ALLOCATED, employer_of_record == MANAGER, manager_share_cents == 1500000, owner_share_cents == 1500001, and 1500000 + 1500001 == 3000001"
            - "after ALLOCATE — ManagementAgreement.${agr9b}.working_capital_balance_cents == -500001 and manager_liability_accrued_cents == 1500000"
            - "after ALLOCATE — GET /hotel-management/agreements/${agr9b}/working-capital-calls returns total_count == 1 with WorkingCapitalCall.${wcc9b}.reason == CLAIM_ALLOCATION, amount_cents == 1000001, auto_created == true, status == REQUESTED, due_date_utc == 2026-08-16T00:00:00Z"
            - "after REVERSE — EmploymentClaim.${clm9b}.status == REVERSED with owner_share_cents == 0 and manager_share_cents == 0"
            - "after REVERSE — ManagementAgreement.${agr9b}.working_capital_balance_cents == 1000000, exactly the pre-allocation figure, and manager_liability_accrued_cents == 0"
            - "after REVERSE — WorkingCapitalCall.${wcc9b}.status is still REQUESTED with amount_cents 1000001: the reversal restores balances but does not retract the funding call"
            - "ManagementAgreement.${agr9b}.ffe_reserve_balance_cents == 0 throughout — the claim round trip never touched the reserve"
