scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Program, endpoints]
        distinguishing_aspect: "POST /dojo/programs with all required fields returns 201 and echoes name/discipline/tuition; status defaults ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dojo/programs"
              payload: { name: "Kids Karate", discipline: "KARATE", base_monthly_tuition_cents: 8000, test_fee_cents: 2500, min_attendance_for_test: 6, min_days_in_rank: 14 }
              as: FrontDesk
              captures: { prog: $.data }
          assert:
            - "Response code 201"
            - "Program.status == ACTIVE"
            - "Program.base_monthly_tuition_cents == 8000 and version == 1"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /dojo/members/{id} for a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /dojo/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response code 404 and error_id == ERR_NOT_FOUND"

      - name: create_member_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member.fields.email, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /dojo/members without the required email field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dojo/members"
              payload: { full_name: "No Email", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response code 400 and error_id == ERR_INVALID_REQUEST"

      - name: duplicate_member_email_returns_duplicate
        claim_type: Type Constraints
        grounds: [entities.Member.fields.email, "validations[priority=6]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "A second member with an already-used email returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["One member with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /dojo/members"
              payload: { full_name: "First", email: "dup@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
          trigger:
            - call: "POST /dojo/members"
              payload: { full_name: "Second", email: "dup@x.com", date_of_birth: "1991-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 and error_id == ERR_DUPLICATE"

      - name: duplicate_belt_rank_code_within_program_returns_duplicate
        claim_type: Type Constraints
        grounds: [entities.BeltRank.fields.code, "validations[priority=6]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Adding a second BeltRank with the same code in one program returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Program with a WHITE belt rank already added."]
          setup_api_calls:
            - call: "POST /dojo/programs"
              payload: { name: "Dup Prog", discipline: "JUDO", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "WHITE", rank_order: 0, next_rank_code: null, is_entry_rank: true }
              as: FrontDesk
          trigger:
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "WHITE", rank_order: 1, next_rank_code: null }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 and error_id == ERR_DUPLICATE"

      - name: create_member_with_bad_family_fk_returns_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Member.fields.family_id, "validations[priority=4]", "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /dojo/members with a non-existent family_id returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dojo/members"
              payload: { full_name: "Orphan", email: "orphan@x.com", date_of_birth: "1990-01-01", family_id: "00000000-0000-4000-8000-0000000000ff", waiver_signed: true }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response code 404 and error_id == ERR_FK_NOT_FOUND"

      - name: family_active_member_count_computed_on_create
        claim_type: Computed Fields
        grounds: [entities.Family.fields.active_member_count, calculations.family_discount_tier]
        distinguishing_aspect: "After adding 2 ACTIVE members to a family, GET /dojo/families/{id} reports active_member_count == 2."
        test_recipe:
          setup: ["A family with two ACTIVE members."]
          setup_api_calls:
            - call: "POST /dojo/families"
              payload: { surname: "Count", billing_email: "count@x.com" }
              as: FrontDesk
              captures: { fam_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "C1", email: "cc1@x.com", date_of_birth: "1990-01-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "C2", email: "cc2@x.com", date_of_birth: "1992-01-01", family_id: "${fam_id}", waiver_signed: true }
              as: FrontDesk
          trigger:
            - call: "GET /dojo/families/${fam_id}"
              payload: {}
              as: FrontDesk
              captures: { fam: $.data }
          assert:
            - "Family.active_member_count == 2"

      - name: list_members_pagination_envelope
        claim_type: Listing
        grounds: [entities.Member, response_envelope]
        distinguishing_aspect: "GET /dojo/members returns the paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Three members exist."]
          setup_api_calls:
            - call: "POST /dojo/members"
              payload: { full_name: "L1", email: "l1@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "L2", email: "l2@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "L3", email: "l3@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
          trigger:
            - call: "GET /dojo/members?limit=2&offset=0"
              payload: {}
              as: FrontDesk
              captures: { page: $.data }
          assert:
            - "response_type == array; total_count == 3; has_more == true; exactly 2 items returned"

      - name: system_fields_generated_on_create_input_ignored
        claim_type: System Fields
        grounds: [entities.Member, response_envelope]
        distinguishing_aspect: "Server mints id/created_at/version on member create; account_status defaults ACTIVE regardless of any client value."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dojo/members"
              payload: { full_name: "Sys", email: "sys@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m: $.data }
          assert:
            - "Member.id is a server-minted UUID; version == 1; account_status == ACTIVE"

  # =====================================================================
  - section: state_machines
    instances:
      - name: cancel_class_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ClassSession.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED class returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A class session marked COMPLETED."]
          setup_api_calls:
            - call: "POST /dojo/programs"
              payload: { name: "SM Prog", discipline: "BJJ", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "SMI", email: "smi@x.com" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/class-sessions"
              payload: { program_id: "${prog_id}", instructor_id: "${ins_id}", starts_at: "2026-02-01T10:00:00Z", ends_at: "2026-02-01T11:00:00Z", capacity: 5 }
              as: FrontDesk
              captures: { cls_id: $.data.id, cls_v: $.data.version }
            - call: "POST /dojo/class-sessions/${cls_id}/complete"
              payload: { expected_class_session_version: "${cls_v}" }
              as: Instructor
              as_user_id: "${ins_id}"
          trigger:
            - call: "POST /dojo/class-sessions/${cls_id}/cancel"
              payload: { expected_class_session_version: "${cls_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 and error_id == ERR_INVALID_STATE"

      - name: grade_already_graded_test_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.PromotionTest.SCHEDULED_to_FAILED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Grading a test that is already FAILED returns ERR_INVALID_STATE on the second grade."
        test_recipe:
          setup: ["A FAILED promotion test."]
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "Grade Prog", discipline: "BJJ", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "WHITE", rank_order: 0, next_rank_code: "BLUE", is_entry_rank: true }
              as: FrontDesk
            - call: "POST /dojo/programs/${prog_id}/belt-ranks"
              payload: { code: "BLUE", rank_order: 1, next_rank_code: null }
              as: FrontDesk
            - call: "POST /dojo/members"
              payload: { full_name: "GM", email: "gm@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { enr_id: $.data.id }
            - call: "POST /dojo/instructors"
              payload: { full_name: "GI", email: "gi@x.com" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/promotion-tests"
              payload: { enrollment_id: "${enr_id}", examiner_instructor_id: "${ins_id}", scheduled_for: "2026-01-05T00:00:00Z" }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { t_id: $.data.id }
            - call: "POST /dojo/promotion-tests/${t_id}/grade"
              payload: { score: 40 }
              as: Instructor
              as_user_id: "${ins_id}"
          trigger:
            - call: "POST /dojo/promotion-tests/${t_id}/grade"
              payload: { score: 95 }
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second grade returns ERR_INVALID_STATE (409); test remains FAILED"

      - name: withdraw_terminal_member_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Member.ACTIVE_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing an already-WITHDRAWN member returns ERR_INVALID_STATE; WITHDRAWN is terminal."
        test_recipe:
          setup: ["A member already WITHDRAWN."]
          setup_api_calls:
            - call: "POST /dojo/members"
              payload: { full_name: "Term", email: "term@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/members/${m_id}/withdraw"
              payload: { expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { m_v2: $.data.version }
          trigger:
            - call: "POST /dojo/members/${m_id}/withdraw"
              payload: { expected_member_version: "${m_v2}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Second withdraw returns ERR_INVALID_STATE (409)"

      - name: unfreeze_unfrozen_member_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Member.FROZEN_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Unfreezing an ACTIVE (never-frozen) member returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A plain ACTIVE member."]
          setup_api_calls:
            - call: "POST /dojo/members"
              payload: { full_name: "Active", email: "active@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
          trigger:
            - call: "POST /dojo/members/${m_id}/unfreeze"
              payload: { expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_INVALID_STATE (409)"

      - name: pay_invoice_recompute_unsuspend_bubble_up
        claim_type: Bubble up
        grounds: [state_machines.Invoice.DUE_to_PAID, state_machines.Member.SUSPENDED_to_ACTIVE, entities.Member.fields.outstanding_balance_cents]
        distinguishing_aspect: "Paying the TUITION invoice that suspended a member drops balance to 0 and auto-unsuspends the member back to ACTIVE."
        test_recipe:
          setup: ["A SUSPENDED member with one DUE 16000 TUITION invoice (balance 16000 > 15000)."]
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "Susp Prog", discipline: "BJJ", base_monthly_tuition_cents: 16000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "Susp M", email: "suspm@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/contracts"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", term_months: 12, billing_anchor_day: 1, expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { ctr_id: $.data.id }
            - call: "POST /dojo/contracts/${ctr_id}/run-billing"
              payload: {}
              as: FrontDesk
            - call: "GET /dojo/invoices?member_id=${m_id}&kind=TUITION"
              payload: {}
              as: FrontDesk
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /dojo/invoices/${inv_id}/pay"
              payload: {}
              as: FrontDesk
            - call: "GET /dojo/members/${m_id}"
              payload: {}
              as: FrontDesk
              captures: { m_after: $.data }
          assert:
            - "Member.${m_id}.outstanding_balance_cents == 0 after payment"
            - "Member.${m_id}.account_status == ACTIVE (auto-unsuspended)"

      - name: confirm_private_lesson_unavailable_instructor_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.PrivateLesson.REQUESTED_to_CONFIRMED]
        distinguishing_aspect: "A non-overlapping private lesson confirms successfully, exercising the happy-path confirm transition."
        test_recipe:
          setup: ["A REQUESTED private lesson on a free instructor."]
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/instructors"
              payload: { full_name: "PI", email: "pi2@x.com" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "PLM2", email: "plm2@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /dojo/private-lessons"
              payload: { member_id: "${m_id}", instructor_id: "${ins_id}", starts_at: "2026-02-01T09:00:00Z", ends_at: "2026-02-01T10:00:00Z", hourly_rate_cents: 6000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /dojo/private-lessons/${pl_id}/confirm"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
              captures: { pl: $.data }
          assert:
            - "PrivateLesson.${pl_id}.status == CONFIRMED"

      - name: private_lesson_complete_generates_invoice_side_effect
        claim_type: Cross-entity
        grounds: [state_machines.PrivateLesson.CONFIRMED_to_COMPLETED, calculations.private_lesson_charge, entities.Invoice.fields.kind]
        distinguishing_aspect: "Completing a 90-minute lesson at 6000/hr generates a PRIVATE_LESSON invoice of 9000 cents (sum-then-round once)."
        test_recipe:
          setup: ["A CONFIRMED 90-minute private lesson at hourly_rate_cents 6000."]
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/instructors"
              payload: { full_name: "PI3", email: "pi3@x.com" }
              as: FrontDesk
              captures: { ins_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "PLM3", email: "plm3@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /dojo/private-lessons"
              payload: { member_id: "${m_id}", instructor_id: "${ins_id}", starts_at: "2026-02-02T09:00:00Z", ends_at: "2026-02-02T10:30:00Z", hourly_rate_cents: 6000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /dojo/private-lessons/${pl_id}/confirm"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
          trigger:
            - call: "POST /dojo/private-lessons/${pl_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${ins_id}"
            - call: "GET /dojo/invoices?member_id=${m_id}&kind=PRIVATE_LESSON"
              payload: {}
              as: FrontDesk
              captures: { inv_list: $.data }
          assert:
            - "A PRIVATE_LESSON Invoice with amount_due_cents == 9000 (6000 * 1.5 hours) is generated"
            - "Member.${m_id}.outstanding_balance_cents == 9000"

      - name: proshop_cancel_no_invoice_side_effect
        claim_type: Conditional cascade
        grounds: [state_machines.ProShopOrder.PLACED_to_CANCELLED, entities.Member.fields.outstanding_balance_cents]
        distinguishing_aspect: "Cancelling a PLACED (never fulfilled) pro-shop order generates NO invoice; member balance stays 0."
        test_recipe:
          setup: ["A PLACED pro-shop order for a member with no other invoices."]
          setup_api_calls:
            - call: "POST /dojo/members"
              payload: { full_name: "PSM", email: "psm@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /dojo/pro-shop-orders"
              payload: { member_id: "${m_id}", line_items: [{ sku: "BELT", unit_price_cents: 2000, qty: 1 }] }
              as: Member
              as_user_id: "${m_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /dojo/pro-shop-orders/${order_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /dojo/members/${m_id}"
              payload: {}
              as: FrontDesk
              captures: { m_after: $.data }
          assert:
            - "ProShopOrder.${order_id}.status == CANCELLED"
            - "Member.${m_id}.outstanding_balance_cents == 0 (no PRO_SHOP invoice generated)"

      - name: tournament_withdraw_cascade_from_contract
        claim_type: Cross-entity
        grounds: [state_machines.Contract.ACTIVE_to_PAST_DUE, state_machines.TournamentRegistration.REGISTERED_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / tournament_withdrawn_by_contract_pastdue
          rationale: "The contract-PAST_DUE -> tournament-WITHDRAWN cascade is the asserted outcome of the named §1.8 instance."

      - name: invoice_mark_overdue_after_clock_advance
        claim_type: Valid Transition
        grounds: [state_machines.Invoice.DUE_to_OVERDUE, entities.Invoice.fields.due_at]
        distinguishing_aspect: "Advancing the clock past due_at then marking the invoice overdue flips DUE -> OVERDUE."
        test_recipe:
          setup: ["A DUE TUITION invoice with due_at 2026-01-15."]
          setup_api_calls:
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /dojo/programs"
              payload: { name: "OD Prog", discipline: "BJJ", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "OD M", email: "odm@x.com", date_of_birth: "1990-01-01", waiver_signed: true }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /dojo/contracts"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", term_months: 12, billing_anchor_day: 15, expected_member_version: "${m_v}" }
              as: FrontDesk
              captures: { ctr_id: $.data.id }
            - call: "POST /dojo/contracts/${ctr_id}/run-billing"
              payload: {}
              as: FrontDesk
            - call: "GET /dojo/invoices?member_id=${m_id}&kind=TUITION"
              payload: {}
              as: FrontDesk
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /dojo/_clock/advance"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FrontDesk
          trigger:
            - call: "POST /dojo/invoices/${inv_id}/mark-overdue"
              payload: {}
              as: FrontDesk
