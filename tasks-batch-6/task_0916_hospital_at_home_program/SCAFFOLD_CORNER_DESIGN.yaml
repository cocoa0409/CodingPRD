scaffold_corner_design:

  # =========================================================================
  # SECTION: entities
  # =========================================================================
  - section: entities
    instances:

      - name: patient_create_applies_declared_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Patient.fields.diet_restriction
          - entities.Patient.fields.broadband_verified
          - entities.Patient.fields.caregiver_present
          - entities.Patient.fields.status
        distinguishing_aspect: "Omitting diet_restriction, broadband_verified and caregiver_present yields NONE, false and false, status is system-set to REGISTERED, and version starts at 1."
        test_recipe:
          setup:
            - "Empty database; logical clock left at its 2026-05-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-DEF", full_name: "Dee Fault", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC" }
              as: ProgramAdmin
              captures: { pat_def: $.data.id, pat_def_v: $.data.version }
          assert:
            - "HTTP 201 is returned"
            - "Patient.${pat_def}.diet_restriction == NONE"
            - "Patient.${pat_def}.broadband_verified == false"
            - "Patient.${pat_def}.caregiver_present == false"
            - "Patient.${pat_def}.status == REGISTERED"
            - "Patient.${pat_def}.version == 1"
            - "Patient.${pat_def}.created_at is an ISO 8601 UTC timestamp with three fractional digits"

      - name: patient_create_missing_required_mrn_returns_validation
        claim_type: required_fields
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting the required mrn field is rejected at rung 4 with ERR_VALIDATION and HTTP 400 before any business rule runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "No Mrn", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC" }
              as: ProgramAdmin
              captures: { err_req: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION with HTTP 400"
            - "no Patient row is created"

      - name: referral_create_invalid_enum_origin_returns_invalid_enum
        claim_type: type_constraints
        grounds:
          - "validations[priority=5]"
          - entities.Referral.fields.origin
          - "errors[ERR_INVALID_ENUM]"
        distinguishing_aspect: "An origin value outside {ED, INPATIENT_WARD, CLINIC, SNF} is rejected at rung 4 with ERR_INVALID_ENUM and HTTP 422, distinct from the missing-field ERR_VALIDATION path."
        test_recipe:
          setup:
            - "One registered patient."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "MRN-EN", full_name: "Ena Enum", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC" }
              as: ProgramAdmin
              captures: { pat_en: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "${pat_en}", origin: "HOSPICE", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { err_enum: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ENUM with HTTP 422"
            - "GET /patients/${pat_en}/referrals returns an empty array with total_count == 0"

      - name: episode_get_with_unknown_id_returns_episode_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_EPISODE_NOT_FOUND]"
        distinguishing_aspect: "A well-formed but unknown episode UUID in the path resolves to ERR_EPISODE_NOT_FOUND (404), not to the generic ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /episodes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AdmittingPhysician
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_EPISODE_NOT_FOUND with HTTP 404"

      - name: device_kit_get_with_unknown_id_returns_generic_resource_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_RESOURCE_NOT_FOUND]"
        distinguishing_aspect: "Entities other than Patient, Referral and Episode fall back to ERR_RESOURCE_NOT_FOUND, so an unknown device-kit id is 404 ERR_RESOURCE_NOT_FOUND rather than a kit-specific code."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /device-kits/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: ProgramAdmin
              captures: { err_res: $.data.error_id }
          assert:
            - "error_id == ERR_RESOURCE_NOT_FOUND with HTTP 404"

      - name: referral_create_with_unknown_patient_returns_patient_not_found
        claim_type: parent_relationships
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_PATIENT_NOT_FOUND]"
          - entities.Referral.fields.patient_id
        distinguishing_aspect: "A body foreign key is resolved at rung 5 and maps to its own error code: an unknown patient_id gives ERR_PATIENT_NOT_FOUND (404), not ERR_VALIDATION."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /referrals"
              payload: { patient_id: "99999999-8888-4777-8666-555555555555", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { err_pnf: $.data.error_id }
          assert:
            - "error_id == ERR_PATIENT_NOT_FOUND with HTTP 404"

      - name: eligibility_assessment_with_unknown_referral_returns_referral_not_found
        claim_type: parent_relationships
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_REFERRAL_NOT_FOUND]"
          - entities.EligibilityAssessment.fields.referral_id
        distinguishing_aspect: "An unknown referral_id in the assessment body resolves to ERR_REFERRAL_NOT_FOUND (404), the Referral-specific code distinct from the Patient and Episode codes."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "77777777-6666-4555-8444-333333333333", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { err_rnf: $.data.error_id }
          assert:
            - "error_id == ERR_REFERRAL_NOT_FOUND with HTTP 404"

      - name: monitoring_lapse_is_an_immutable_event_without_version_field
        claim_type: immutability
        grounds:
          - entities.MonitoringLapse.fields.gap_start_at
          - entities.MonitoringLapse.fields.cause
        distinguishing_aspect: "MonitoringLapse is declared common_fields: false, so its response carries id and created_at but neither updated_at nor version, and no endpoint mutates it."
        test_recipe:
          setup:
            - "One ACTIVE CMS_WAIVER episode admitted at 2026-06-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-IM", full_name: "Ivy Immutable", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_im: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_im}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_im: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_im}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_im}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_im}", referral_id: "${ref_im}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_im: $.data.id }
          trigger:
            - call: "POST /monitoring-lapses"
              payload: { episode_id: "${ep_im}", gap_start_at: "2026-06-01T09:00:00Z", gap_end_at: "2026-06-01T09:30:00Z" }
              as: FieldNurse
              captures: { lap_im: $.data.id }
          assert:
            - "HTTP 201 is returned and the response body has id and created_at but no version and no updated_at key"
            - "MonitoringLapse.${lap_im}.cause == UNKNOWN (the declared default)"
            - "GET /episodes/${ep_im}/monitoring-lapses returns exactly 1 row with total_count == 1"

      - name: episode_creation_mints_first_pending_compliance_day_and_computed_counters
        claim_type: computed_fields
        grounds:
          - entities.Episode.fields.service_day_count
          - entities.Episode.fields.pending_day_count
          - entities.Episode.fields.acuity
          - state_machines.Referral.ELIGIBLE_to_ADMITTED
        distinguishing_aspect: "A freshly admitted episode already owns exactly one PENDING DailyComplianceRecord for the admission date, so service_day_count == 1 and pending_day_count == 1 with acuity copied from the referral."
        test_recipe:
          setup:
            - "One ELIGIBLE HIGH-acuity referral with an all-PASS assessment and a caregiver present."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-CF", full_name: "Cyd Computed", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_cf: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_cf}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "HIGH", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_cf: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_cf}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_cf}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
          trigger:
            - call: "POST /episodes"
              payload: { patient_id: "${pat_cf}", referral_id: "${ref_cf}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_cf: $.data.id }
          assert:
            - "HTTP 201 is returned and Episode.${ep_cf}.status == ACTIVE"
            - "Episode.${ep_cf}.acuity == HIGH (copied from Referral.${ref_cf}.acuity)"
            - "Episode.${ep_cf}.admitted_at == 2026-06-01T08:00:00.000Z"
            - "Episode.${ep_cf}.physician_eval_at == 2026-06-01T06:00:00.000Z"
            - "Episode.${ep_cf}.service_day_count == 1, pending_day_count == 1, billable_day_count == 0, carved_out_day_count == 0"
            - "Referral.${ref_cf}.status == ADMITTED and Patient.${pat_cf}.status == IN_PROGRAM"
            - "GET /episodes/${ep_cf}/compliance-days returns exactly 1 row whose service_date == 2026-06-01 and status == PENDING"

      - name: patient_referrals_subresource_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Referral.fields.patient_id
        distinguishing_aspect: "The FK reverse-reachability list GET /patients/{id}/referrals honours limit and offset and reports total_count 3 with has_more true on the first page of size 2."
        test_recipe:
          setup:
            - "One patient with three referrals filed against it."
          setup_api_calls:
            - call: "POST /patients"
              payload: { mrn: "MRN-PG", full_name: "Peg Paging", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC" }
              as: ProgramAdmin
              captures: { pat_pg: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_pg}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals"
              payload: { patient_id: "${pat_pg}", origin: "INPATIENT_WARD", qualifying_condition_code: "COPD_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals"
              payload: { patient_id: "${pat_pg}", origin: "CLINIC", qualifying_condition_code: "OTHER", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
          trigger:
            - call: "GET /patients/${pat_pg}/referrals"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
          assert:
            - "the response meta reports total_count == 3 and has_more == true"
            - "exactly 2 Referral rows are returned"
            - "a follow-up read with limit 2 and offset 2 returns 1 row with has_more == false"

  # =========================================================================
  # SECTION: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: visit_depart_from_completed_is_rejected_as_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Visit.SCHEDULED_to_EN_ROUTE
          - "validations[priority=9]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "COMPLETED is not in the from-set of the depart transition, so a second depart after completion fails with ERR_INVALID_STATE (409) and leaves scheduling_status COMPLETED."
        test_recipe:
          setup:
            - "One ACTIVE CMS_WAIVER episode with a visit already COMPLETED on 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-IT", full_name: "Ida Invalid", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_it: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_it}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_it: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_it}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_it}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_it}", referral_id: "${ref_it}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_it: $.data.id }
            - call: "POST /visits"
              payload: { episode_id: "${ep_it}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:00:00Z", scheduled_end_at: "2026-06-01T09:45:00Z", distance_km: 5.0 }
              as: FieldNurse
              captures: { v_it: $.data.id }
            - call: "POST /visits/${v_it}/depart"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_it}/complete"
              payload: {}
              as: FieldNurse
          trigger:
            - call: "POST /visits/${v_it}/depart"
              payload: {}
              as: FieldNurse
              captures: { err_is: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "Visit.${v_it}.scheduling_status is still COMPLETED"
            - "Visit.${v_it}.attestation_status is still UNATTESTED"

      - name: episode_discharge_without_begin_discharge_is_rejected_as_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Episode.DISCHARGE_PENDING_to_DISCHARGED
          - "validations[priority=9]"
        distinguishing_aspect: "The state precondition at rung 7 outranks the discharge gates at rung 15: discharging an ACTIVE episode returns ERR_INVALID_STATE, never ERR_MED_REC_UNSIGNED, even though med_rec_signed is false."
        test_recipe:
          setup:
            - "One ACTIVE CMS_WAIVER episode with med_rec_signed still false and no begin-discharge call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-DC", full_name: "Dan Discharge", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_dc: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_dc}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_dc: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_dc}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_dc}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_dc}", referral_id: "${ref_dc}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_dc: $.data.id }
          trigger:
            - call: "POST /episodes/${ep_dc}/discharge"
              payload: {}
              as: AdmittingPhysician
              captures: { err_dc: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "error_id != ERR_MED_REC_UNSIGNED"
            - "Episode.${ep_dc}.status is still ACTIVE and Episode.${ep_dc}.discharged_at is null"

      - name: referral_mark_eligible_twice_is_rejected_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines.Referral.SCREENING_to_ELIGIBLE
          - "validations[priority=9]"
        distinguishing_aspect: "ELIGIBLE is not a legal from-state for mark-eligible, so a repeated call returns ERR_INVALID_STATE (409) and does not bump Referral.version a second time."
        test_recipe:
          setup:
            - "One referral already moved SCREENING -> ELIGIBLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-ID", full_name: "Ike Idem", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_id: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_id}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_id}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
              captures: { ref_id_v: $.data.version }
          trigger:
            - call: "POST /referrals/${ref_id}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
              captures: { err_idem: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "Referral.${ref_id}.status is still ELIGIBLE"
            - "Referral.${ref_id}.version == ${ref_id_v} (the rejected call did not mutate the row)"

      - name: escalation_acknowledge_after_the_sla_deadline_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EscalationEvent.TIER1_OPEN_to_TIER1_ACKED
          - calculations.escalation_sla_deadline
        distinguishing_aspect: "Acknowledgement is permitted only while the clock is at or before ack_deadline_at; at 2026-06-01T08:10:01Z, one second past the STANDARD tier-1 deadline of 08:10:00Z, the call is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "One ACTIVE STANDARD-acuity episode with a TIER1_OPEN escalation opened at 2026-06-01T08:00:00Z, so ack_deadline_at is 2026-06-01T08:10:00Z."
            - "The clock is advanced to 2026-06-01T08:10:01Z, strictly past the deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-SL", full_name: "Sam Sla", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_sl: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_sl}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_sl: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_sl}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_sl}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_sl}", referral_id: "${ref_sl}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_sl: $.data.id }
            - call: "POST /escalation-events"
              payload: { episode_id: "${ep_sl}", reason: "TELEMETRY_LOSS", opened_by_user_id: "rn-1" }
              as: FieldNurse
              captures: { esc_sl: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:10:01Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /escalation-events/${esc_sl}/acknowledge"
              payload: {}
              as: FieldNurse
              captures: { err_ack: $.data.error_id }
          assert:
            - "EscalationEvent.${esc_sl}.ack_deadline_at == 2026-06-01T08:10:00.000Z"
            - "error_id == ERR_INVALID_STATE with HTTP 409"
