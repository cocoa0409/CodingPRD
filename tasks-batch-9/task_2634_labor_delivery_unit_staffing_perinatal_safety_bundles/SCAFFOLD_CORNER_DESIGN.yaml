            - "e_sod_case_close != \"ERR_NEWBORN_REVIEW_OPEN\" — the CLOSED review is what makes priority 10 observable at all"
            - "HTTP 403 and e_sod_case_close_tech == \"ERR_SEGREGATION_OF_DUTIES_VIOLATION\" — mobilized_staff_ids[1] is refused too, so the check scans the whole array and not only its first entry"
            - "HTTP 200 and ev_status_closed == \"CLOSED\" from the bootstrap officer, who never appeared in mobilized_staff_ids"
            - "HTTP 201, snap_status == \"DRAFT\", ntsv_den == 1, ntsv_num == 1 (the NTSV encounter delivered CESAREAN_PRIMARY at 2026-08-01T06:08:00Z, inside [2026-08-01T00:00:00Z, 2026-08-02T00:00:00Z)) and epis_den == 0"
