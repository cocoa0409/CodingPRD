              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9011", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 1, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 90, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv1: $.data.version }
            - call: "POST /colocation/power-circuits/${cir_id}/energize"
              payload: { expected_row_version: "${rv1}" }
              as: ProvisioningEngineer
            - call: "PATCH /colocation/rows/${row_id}"
              payload: { cooling_capacity_kw: 20.0 }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv2: $.data.version }
            - call: "POST /colocation/power-circuits/${cir_id}/energize"
              payload: { expected_row_version: "${rv2}" }
              as: ProvisioningEngineer
            - call: "PATCH /colocation/rows/${row_id}"
              payload: { design_density_kw_per_cabinet: 20.0 }
              as: FacilityManager
            - call: "GET /colocation/rows/${row_id}"
