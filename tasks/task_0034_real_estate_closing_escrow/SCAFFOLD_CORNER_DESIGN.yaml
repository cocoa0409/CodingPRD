      - name: scheduled_action_exchange_account_deadline_failed_on_clock_advance
        claim_type: scheduled_deferred_actions
        grounds:
          - "state_machines.ExchangeAccount.OPEN_to_FAILED"
        distinguishing_aspect: |
          With clock advanced past identification_deadline and replacement_property_identified=false,
          a subsequent GET /exchange-accounts/{id} observes status=FAILED (lazy synchronous
          transition on read).
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z; exchange account OPEN; clock advanced 46 days."]
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
