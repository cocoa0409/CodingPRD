            - call: "POST /shop/inspections/${i_tie}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${i_inner}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${i_mis}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
          assert:
            - "Inspection.${i_outer}.failure_cause_code == OUTER_RACE_SPALL and cause_confidence == HIGH"
            - "Inspection.${i_tie}.failure_cause_code == OUTER_RACE_SPALL and cause_confidence == HIGH"
            - "Inspection.${i_inner}.failure_cause_code == INNER_RACE_SPALL and cause_confidence == HIGH"
