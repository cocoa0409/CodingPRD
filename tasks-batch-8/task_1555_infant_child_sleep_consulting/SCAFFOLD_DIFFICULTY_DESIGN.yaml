  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refund_state_error_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_CASE_INVALID_STATE]
          - errors[ERR_REFUND_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Error-category pair = state (priority 5) vs business_fiscal (priority 10).
          A PRO_RATA request on an INTAKE case violates both the state precondition
          (case not in {ACTIVE_SUPPORT, NEEDS_ATTENTION, COMPLETED}) and the fiscal
          eligibility rule (no ACTIVE package, no consumption window); the state error
          ERR_CASE_INVALID_STATE (409) must win over ERR_REFUND_NOT_ELIGIBLE.
        test_recipe:
          setup:
            - "Case freshly created, still in INTAKE (no questionnaire, no package)"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
              payload: { full_name: "Dana Sleep", certification_no: "CERT-108", max_active_cases: 5 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /sleep-consulting/families"
              payload: { full_name: "Fam G", email: "g@x.com" }
              as: Anonymous
              captures: { fam_id: $.data.id }
            - call: "POST /sleep-consulting/cases"
              payload: { family_id: "${fam_id}", consultant_id: "${cons_id}", child_birth_date: "2026-05-01", delivery_mode: "ONE_ON_ONE", guarantee_goal_night_wakings: 2 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /sleep-consulting/cases/${case_id}/refund-requests"
              payload: { refund_type: "PRO_RATA" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CASE_INVALID_STATE (HTTP 409), NOT ERR_REFUND_NOT_ELIGIBLE — state priority 5 beats fiscal priority 10"

      - name: session_temporal_error_beats_quota
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_SCHEDULING_CONFLICT]
          - errors[ERR_ENTITLEMENT_EXHAUSTED]
        distinguishing_aspect: |
          Error-category pair = business_temporal (priority 7) vs business_fiscal
          quota (priority 9) — a different pair from the sibling instance. A booking
          that both overlaps an existing SCHEDULED session (buffer violation) AND is
          made against a package with remaining_calls == 0 must fail with
          ERR_SCHEDULING_CONFLICT, not ERR_ENTITLEMENT_EXHAUSTED.
        test_recipe:
          setup:
            - "Case ACTIVE_SUPPORT; BASIC package ACTIVE [2026-08-01, 2026-08-14] with its single call already consumed by session S1 SCHEDULED 2026-08-10T10:00-11:00Z (remaining_calls == 0; package still ACTIVE because 5 messages remain)"
