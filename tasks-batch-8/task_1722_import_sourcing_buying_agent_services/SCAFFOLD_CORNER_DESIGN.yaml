# =============================================================================
# Task 1722 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over the claim-extraction-guide sections; §1.8-covered corners
# appear as excluded_because stubs. Instance names are unique across BOTH files.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: buyer_creation_defaults_and_envelope
        claim_type: creation
        grounds: ["entities.Buyer", "endpoints[POST /sourcing/buyers]"]
        distinguishing_aspect: "Creating a Buyer with name+country_code returns 201 with server-minted UUID id, version 1, credit_balance_cents 0, ytd_gmv_cents 0, status ACTIVE, inside the fixed response envelope."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /sourcing/buyers"
              payload: { name: "Acme Imports", country_code: "US" }
              as: PlatformAdmin
              captures: { nb_id: "$.data.id", nb_credit: "$.data.credit_balance_cents", nb_ytd: "$.data.ytd_gmv_cents", nb_status: "$.data.status", nb_v: "$.data.version" }
          assert:
            - "nb_id is a UUID (no type prefix)"
            - "nb_credit == 0 and nb_ytd == 0 and nb_status == 'ACTIVE' and nb_v == 1"
            - "Response has meta.api_request_id, meta.api_request_timestamp, response_type == 'object'"

      - name: factory_creation_computed_defaults
        claim_type: defaults
        grounds: ["entities.Factory.fields.compliance_posture", "entities.Factory.fields.latest_audit_grade", "entities.Factory.fields.debit_balance_cents"]
        distinguishing_aspect: "Factory created by a SourcingAgent starts ACTIVE, compliance_posture COMPLIANT (no live PO categories), debit_balance_cents 0, latest_audit_grade NONE, audit_score 0."
        test_recipe:
          setup: ["Agent a1 exists"]
          setup_api_calls:
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/factories"
              payload: { name: "Factory One", country_code: "CN", monthly_capacity_units: 5000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id", f_status: "$.data.status", f_posture: "$.data.compliance_posture", f_debit: "$.data.debit_balance_cents", f_grade: "$.data.latest_audit_grade", f_score: "$.data.audit_score" }
          assert:
            - "f_status == 'ACTIVE' and f_posture == 'COMPLIANT'"
            - "f_debit == 0 and f_grade == 'NONE' and f_score == 0"

      - name: factory_monthly_capacity_must_be_positive
        claim_type: type_constraints
        grounds: ["entities.Factory.fields.monthly_capacity_units", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "monthly_capacity_units 0 or negative is rejected with ERR_VALIDATION (400) at factory creation."
        test_recipe:
          setup: ["Agent a1 exists"]
          setup_api_calls:
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/factories"
              payload: { name: "Bad Factory", country_code: "CN", monthly_capacity_units: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f_err: "$.data.error_id" }
          assert:
            - "f_err == 'ERR_VALIDATION' (HTTP 400)"

      - name: audit_category_score_out_of_range_rejected
        claim_type: type_constraints
        grounds: ["entities.FactoryAudit.fields.quality_system_score", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A category score of 101 (outside 0..100) on audit creation is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Agent a1, factory f1 exist"]
          setup_api_calls:
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "Factory One", country_code: "CN", monthly_capacity_units: 5000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "SCREENING", quality_system_score: 101, social_compliance_score: 50, production_capability_score: 50, financial_stability_score: 50 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { a_err: "$.data.error_id" }
          assert:
            - "a_err == 'ERR_VALIDATION' (HTTP 400)"

      - name: audit_critical_findings_default_zero
        claim_type: defaults
        grounds: ["entities.FactoryAudit.fields.critical_findings"]
        distinguishing_aspect: "Omitting critical_findings defaults it to 0: an ONSITE audit 95/92/90/88 without the field scores 92, exactly as if critical_findings were 0."
        test_recipe:
          setup: ["Agent a1, factory f1 exist"]
          setup_api_calls:
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "Factory One", country_code: "CN", monthly_capacity_units: 5000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { a_score: "$.data.score", a_cf: "$.data.critical_findings" }
          assert:
            - "a_cf == 0"
            - "a_score == 92"

      - name: sample_creation_initial_state
        claim_type: creation
        grounds: ["entities.Sample.fields.status", "entities.Sample.fields.revision_count", "state_machines.Sample"]
        distinguishing_aspect: "A new Sample starts SUBMITTED with revision_count 0, and the parent SourcingRequest auto-advances OPEN -> IN_PROGRESS."
        test_recipe:
          setup: ["Buyer b1, agent a1, SR sr1 (OPEN)"]
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "S", product_category: "TOYS", target_price_cents: 100, quantity: 10, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id", sr1_status: "$.data.status" }
          trigger:
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/samples"
              payload: { notes: "first" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { s1_id: "$.data.id", s1_status: "$.data.status", s1_rev: "$.data.revision_count" }
            - call: "GET /sourcing/sourcing-requests/${sr1_id}"
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_after: "$.data.status" }
          assert:
            - "sr1_status == 'OPEN' before sample creation"
            - "s1_status == 'SUBMITTED' and s1_rev == 0"
            - "sr1_after == 'IN_PROGRESS' (system auto-transition on first sample)"

      - name: po_total_and_remaining_payable_computed
        claim_type: computed_fields
        grounds: ["entities.PurchaseOrder.fields.total_cents", "entities.PurchaseOrder.fields.remaining_payable_cents", "entities.PurchaseOrder.fields.open_qty"]
        distinguishing_aspect: "At accept, total_cents == ordered_qty * unit_price_cents (exact), open_qty == ordered_qty, remaining_payable_cents == total_cents, progress_pct == 0, production_status PLACED, milestone_plan_locked false."
        test_recipe:
          setup: ["Buyer b1, agent a1, factory f1 grade-A approved; SR; quotation at 250 cents, moq 5, valid 2027-01-01"]
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "Factory One", country_code: "CN", monthly_capacity_units: 100000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { au1_id: "$.data.id" }
            - call: "POST /sourcing/audits/${au1_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "T", product_category: "APPAREL", target_price_cents: 250, quantity: 40, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/quotations"
              payload: { unit_price_cents: 250, moq: 5, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f1_id}"
              captures: { q1_id: "$.data.id", q1_v: "$.data.version" }
          trigger:
            - call: "POST /sourcing/quotations/${q1_id}/accept"
              payload: { ordered_qty: 40, delivery_month: "2026-09", expected_quotation_version: "${q1_v}" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { p_total: "$.data.total_cents", p_open: "$.data.open_qty", p_rem: "$.data.remaining_payable_cents", p_prog: "$.data.progress_pct", p_prod: "$.data.production_status", p_lock: "$.data.milestone_plan_locked" }
          assert:
            - "p_total == 10000 (40 * 250)"
            - "p_open == 40 and p_rem == 10000"
            - "p_prog == 0 and p_prod == 'PLACED' and p_lock == false"

      - name: get_nonexistent_resources_return_404
        claim_type: not_found
        grounds: ["errors[ERR_BUYER_NOT_FOUND]", "errors[ERR_FACTORY_NOT_FOUND]", "errors[ERR_PURCHASE_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields the resource-specific 404 error for Buyer, Factory, and PurchaseOrder."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /sourcing/buyers/11111111-2222-3333-4444-555555555555"
              as: PlatformAdmin
              captures: { e1: "$.data.error_id" }
            - call: "GET /sourcing/factories/11111111-2222-3333-4444-555555555555"
              as: PlatformAdmin
              captures: { e2: "$.data.error_id" }
            - call: "GET /sourcing/purchase-orders/11111111-2222-3333-4444-555555555555"
              as: PlatformAdmin
              captures: { e3: "$.data.error_id" }
          assert:
            - "e1 == 'ERR_BUYER_NOT_FOUND' (404)"
            - "e2 == 'ERR_FACTORY_NOT_FOUND' (404)"
            - "e3 == 'ERR_PURCHASE_ORDER_NOT_FOUND' (404)"

      - name: list_pagination_envelope_and_defaults
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /sourcing/quotations]"]
        distinguishing_aspect: "Filtered list endpoints return response_type array with pagination fields limit/offset/total_count/has_more; default limit 10; factory_id filter narrows to the requested factory."
        test_recipe:
          setup: ["Buyer b1, agent a1, factories f1 and f2 both grade-A; SR sr1; 2 quotations from f1, 1 from f2"]
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "F1", country_code: "CN", monthly_capacity_units: 100000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "F2", country_code: "VN", monthly_capacity_units: 100000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f2_id: "$.data.id" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { a_f1: "$.data.id" }
            - call: "POST /sourcing/audits/${a_f1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/factories/${f2_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { a_f2: "$.data.id" }
            - call: "POST /sourcing/audits/${a_f2}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "L1", product_category: "APPAREL", target_price_cents: 100, quantity: 10, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "L2", product_category: "APPAREL", target_price_cents: 100, quantity: 10, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr2_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "L3", product_category: "APPAREL", target_price_cents: 100, quantity: 10, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr3_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/quotations"
              payload: { unit_price_cents: 100, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f1_id}"
            - call: "POST /sourcing/sourcing-requests/${sr2_id}/quotations"
              payload: { unit_price_cents: 100, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f1_id}"
            - call: "POST /sourcing/sourcing-requests/${sr3_id}/quotations"
              payload: { unit_price_cents: 100, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f2_id}"
          trigger:
            - call: "GET /sourcing/quotations"
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { q_all_0: "$.data[0].id" }
            - call: "GET /sourcing/quotations?factory_id=${f1_id}"
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { q_f1_0: "$.data[0].id" }
          assert:
            - "Unfiltered list: total_count == 3, limit == 10, offset == 0, has_more == false, response_type == 'array'"
            - "Filtered by factory_id=${f1_id}: total_count == 2 and every element's factory_id == f1"
            - "Filtered by factory_id=${f2_id}: total_count == 1"

      - name: factory_grade_update_only_from_approved_onsite
        claim_type: computed_fields
        grounds: ["entities.Factory.fields.latest_audit_grade", "calculations.audit_score"]
        distinguishing_aspect: "An APPROVED SCREENING audit does NOT update factory.latest_audit_grade/audit_score; only an APPROVED ONSITE audit does."
        test_recipe:
          setup: ["Agent a1, factory f1"]
          setup_api_calls:
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "F1", country_code: "CN", monthly_capacity_units: 1000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "SCREENING", quality_system_score: 95, social_compliance_score: 95, production_capability_score: 95, financial_stability_score: 95, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { au_s: "$.data.id" }
            - call: "POST /sourcing/audits/${au_s}/approve"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /sourcing/factories/${f1_id}"
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f_grade: "$.data.latest_audit_grade", f_score: "$.data.audit_score" }
          assert:
            - "f_grade == 'NONE' and f_score == 0 (approved SCREENING audit leaves factory grade fields untouched)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: audit_terminal_lockdown_approve_after_reject
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.FactoryAudit", "errors[ERR_AUDIT_NOT_REVIEWABLE]"]
        distinguishing_aspect: "A REJECTED audit is terminal: approving it afterwards fails with ERR_AUDIT_NOT_REVIEWABLE and the factory grade fields stay untouched."
        test_recipe:
          setup: ["Agent a1, factory f1, audit au1 REJECTED"]
          setup_api_calls:
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "F1", country_code: "CN", monthly_capacity_units: 1000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { au1_id: "$.data.id" }
            - call: "POST /sourcing/audits/${au1_id}/reject"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /sourcing/audits/${au1_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { ap_err: "$.data.error_id" }
          assert:
            - "ap_err == 'ERR_AUDIT_NOT_REVIEWABLE' (HTTP 409)"
            - "Factory.${f1_id}.latest_audit_grade == 'NONE'"

      - name: sample_approve_from_submitted_valid_transition
        claim_type: valid_transition
        grounds: ["state_machines.Sample.SUBMITTED_to_APPROVED"]
        distinguishing_aspect: "BuyerManager owning the SR can APPROVE a SUBMITTED sample; status becomes APPROVED and further reviews fail with ERR_SAMPLE_NOT_REVIEWABLE."
        test_recipe:
          setup: ["Buyer b1, agent a1, SR sr1, sample s1 SUBMITTED"]
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "S", product_category: "APPAREL", target_price_cents: 100, quantity: 10, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/samples"
              payload: { notes: "v0" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/samples/${s1_id}/review"
              payload: { decision: "APPROVE" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { s1_st: "$.data.status" }
            - call: "POST /sourcing/samples/${s1_id}/review"
              payload: { decision: "APPROVE" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { s1_err: "$.data.error_id" }
          assert:
            - "s1_st == 'APPROVED'"
            - "s1_err == 'ERR_SAMPLE_NOT_REVIEWABLE' (second review on terminal sample)"

      - name: sample_resubmit_from_submitted_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Sample.REVISION_REQUESTED_to_SUBMITTED", "errors[ERR_SAMPLE_NOT_RESUBMITTABLE]"]
        distinguishing_aspect: "Resubmit is only legal from REVISION_REQUESTED: calling it on a SUBMITTED sample fails with ERR_SAMPLE_NOT_RESUBMITTABLE and revision_count stays 0."
        test_recipe:
          setup: ["Buyer b1, agent a1, SR sr1, sample s1 SUBMITTED"]
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "S", product_category: "APPAREL", target_price_cents: 100, quantity: 10, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/samples"
              payload: { notes: "v0" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/samples/${s1_id}/resubmit"
              payload: { notes: "premature" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
