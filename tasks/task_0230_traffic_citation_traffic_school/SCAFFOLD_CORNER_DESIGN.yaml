  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_balance_visible_in_payment_response_chain
        claim_type: immediate_consistency
        grounds: [calculations.citation_balance, entities.Citation.fields.balance_cents]
        distinguishing_aspect: "Immediate model: after a payment posts, the very next GET /citations/{cid} reflects the new balance_cents and amount_paid_cents with no lag."
        test_recipe:
          setup: ["Assessed citation (29000); one 9000 payment posted."]
          setup_api_calls:
