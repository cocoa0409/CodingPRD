    description: "Flat filtered list of EasementDocuments"
    roles: [RightOfWayAgent, TitleExaminer, LitigationCounsel, DepartmentDirector]
    code: 200
    input: ["case_id?", "supersedes_document_id?", "status?", "doc_kind?", "limit?", "offset?"]
    output: "EasementDocument[]"
    side_effects: []

  - method: GET
    path: "/easement-cases/encroachments/{encId}"
    description: "Flat get of an Encroachment by id"
    roles: [RightOfWayAgent, VegetationInspector, LitigationCounsel, DepartmentDirector]
    code: 200
    input: []
    output: Encroachment
