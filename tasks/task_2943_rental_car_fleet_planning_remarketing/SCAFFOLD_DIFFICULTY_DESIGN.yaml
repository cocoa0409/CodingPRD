            - "GET /fleet/vehicles/${veh_pgm}/valuation -> data.policy_net_book_value_cents == 1900000"
            - "GET /fleet/vehicles/${veh_pgm}/valuation -> data.program_guaranteed_value_cents == 2236000"
            - "GET /fleet/vehicles/${veh_pgm}/valuation -> data.applied_variant == \"PROGRAM_GUARANTEE\""
            - "GET /fleet/vehicles/${veh_pgm}/valuation -> data.net_book_value_cents == 2236000"
