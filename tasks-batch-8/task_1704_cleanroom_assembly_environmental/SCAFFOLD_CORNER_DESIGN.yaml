              as: QualityAssurance
              captures: { room_c4: $.data.id }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_c4}", method_code: "MOP-C4", required_consecutive_passes: 2 }
              as: QualityAssurance
              captures: { prog_c4: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_c4}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_c4}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_c4a: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_c4a}/verify"
              payload: {}
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/cleaning-programs/${prog_c4}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_c4b: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_c4b}/verify"
              payload: {}
              as: QualityAssurance
          assert:
            - "After 1 verified: program status == ACTIVE (1 < 2)"
            - "After 2nd verified: CleaningValidationProgram.${prog_c4}.consecutive_pass_count == 2 AND status == VALIDATED  (boundary is >=)"

  # ===========================================================================
  # Section: validations — violation->error, satisfaction->pass, priority.
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_user_context_header_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without X-User-ID/X-User-Role returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-V1", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { err_v1: $.data.error_id }
          assert:
            - "When headers are stripped: HTTP 400 error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: nonexistent_fk_in_body_returns_404
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /cleanroom/samples with a sampling_point_id that does not exist returns 404 ERR_NOT_FOUND (existence precedes business checks)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "00000000-0000-0000-0000-000000000000", result_value: 5, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              captures: { err_v2: $.data.error_id }
          assert:
            - "HTTP 404 error_id == ERR_NOT_FOUND"

      - name: referential_integrity_recurrence_target_not_closed
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_REFERENTIAL_INTEGRITY]"
        distinguishing_aspect: "recurrence_of_excursion_id pointing to an excursion that is still OPEN (or belongs to a different sampling point) returns 422 ERR_REFERENTIAL_INTEGRITY."
        test_recipe:
          setup: ["Room CR-V3 with ACTIVE VIABLE point SP-V3; one OPEN excursion exc_v3a (sample 15, viable alert 10)"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-V3", iso_class: "ISO_5", particle_alert_limit: 100000, particle_action_limit: 352000, viable_alert_limit: 10, viable_action_limit: 20, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_v3: $.data.id }
            - call: "POST /cleanroom/rooms/${room_v3}/sampling-points"
              payload: { point_code: "SP-V3", metric: "VIABLE", zone_iso_class: "ISO_5" }
              as: QualityAssurance
              captures: { sp_v3: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_v3}", result_value: 15, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              captures: { exc_v3a: $.data.triggered_excursion_id }
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_v3}", result_value: 16, sampled_at: "2026-08-01T10:00:00Z", recurrence_of_excursion_id: "${exc_v3a}" }
              as: EnvironmentTech
              captures: { err_v3: $.data.error_id }
          assert:
            - "HTTP 422 error_id == ERR_REFERENTIAL_INTEGRITY  (recurrence target must be CLOSED at the same point; ${exc_v3a} is OPEN)"

      - name: occ_stale_room_version_on_certification
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "concurrency_rules[certification-create-stale-room]"
          - "errors[ERR_STALE_ROOM_VERSION]"
        distinguishing_aspect: "Certification create with expected_room_version one behind the current version returns 412 ERR_STALE_ROOM_VERSION."
        test_recipe:
          setup: ["Room CR-V4 with VALIDATED cleaning; client observed version v, then a first certification bumped it, then a second create carries the stale v"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-V4", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_v4: $.data.id, room_v4_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_v4}", method_code: "MOP-V4", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_v4: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_v4}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_v4}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_v4: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_v4}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_v4}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [10, 20], expected_room_version: "${room_v4_v}" }
              as: QualityAssurance
          trigger:
            - call: "POST /cleanroom/rooms/${room_v4}/certifications"
              payload: { executed_at: "2026-08-02T00:00:00Z", location_mean_values: [15, 25], expected_room_version: "${room_v4_v}" }
              as: QualityAssurance
              captures: { err_v4: $.data.error_id }
          assert:
            - "HTTP 412 error_id == ERR_STALE_ROOM_VERSION  (room version advanced to ${room_v4_v}+1 by the first PASS certification)"

      - name: investigation_state_check_fires_before_aggregate_guard
        claim_type: priority_ordering
        grounds:
          - "validations[priority=5]"
          - "validations[priority=12]"
          - "errors[ERR_EXCURSION_NOT_OPEN]"
          - "errors[ERR_INVESTIGATION_ALREADY_OPEN]"
        distinguishing_aspect: "Opening a second investigation on an excursion that is already UNDER_INVESTIGATION violates BOTH priority 5 (excursion not OPEN -> ERR_EXCURSION_NOT_OPEN) and priority 12 (DRAFT investigation exists -> ERR_INVESTIGATION_ALREADY_OPEN); the state check at priority 5 wins and ERR_EXCURSION_NOT_OPEN is returned."
        test_recipe:
          setup: ["Room CR-V5 with ACTIVE VIABLE point SP-V5; excursion exc_v5 UNDER_INVESTIGATION with investigation inv_v5 DRAFT"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-V5", iso_class: "ISO_5", particle_alert_limit: 100000, particle_action_limit: 352000, viable_alert_limit: 10, viable_action_limit: 20, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_v5: $.data.id }
            - call: "POST /cleanroom/rooms/${room_v5}/sampling-points"
              payload: { point_code: "SP-V5", metric: "VIABLE", zone_iso_class: "ISO_5" }
              as: QualityAssurance
              captures: { sp_v5: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_v5}", result_value: 15, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              as_user_id: "tech-v5"
              captures: { exc_v5: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/excursions/${exc_v5}/investigations"
              payload: { root_cause: "First investigation narrative for V5", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-v5a"
              captures: { inv_v5: $.data.id }
          trigger:
            - call: "POST /cleanroom/excursions/${exc_v5}/investigations"
              payload: { root_cause: "Second investigation attempt narrative", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-v5b"
              captures: { err_v5: $.data.error_id }
          assert:
            - "HTTP 409 error_id == ERR_EXCURSION_NOT_OPEN  (priority 5 state check precedes priority 12 aggregate guard)"
            - "error_id != ERR_INVESTIGATION_ALREADY_OPEN"

  # ===========================================================================
  # Section: endpoints — CRUD coverage, computed reads, conditional actions.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_rooms_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints"
          - "response_envelope"
        distinguishing_aspect: "GET /cleanroom/rooms?limit=1&offset=0 returns the pagination envelope with total_count and has_more consistent with two rooms existing."
        test_recipe:
          setup: ["Two rooms exist"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-P1", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-P2", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
          trigger:
            - call: "GET /cleanroom/rooms"
              payload: { limit: 1, offset: 0 }
              as: QualityAssurance
          assert:
            - "Response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "data is an array of length 1"
            - "Pagination fields: limit=1, offset=0, total_count=2, has_more=true"

      - name: response_envelope_error_shape
        claim_type: standard_crud
        grounds:
          - "response_envelope"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Any 4xx response carries response_type=error and data.error_id/data.message keys exactly as §1.0 pins."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cleanroom/rooms/00000000-0000-0000-0000-000000000000"
              as: QualityAssurance
              captures: { err_ep: $.data.error_id }
          assert:
            - "response_type == 'error'"
            - "data.error_id == ERR_NOT_FOUND AND data.message is a non-empty string"

      - name: sampling_point_filtered_list_by_room
        claim_type: listing
        grounds:
          - "endpoints"
          - "entities.SamplingPoint"
        distinguishing_aspect: "GET /cleanroom/rooms/{roomId}/sampling-points returns exactly the points of that room (sub-resource reverse reachability)."
        test_recipe:
          setup: ["Rooms CR-L1 and CR-L2; two points in CR-L1, one in CR-L2"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-L1", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_l1: $.data.id }
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-L2", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_l2: $.data.id }
            - call: "POST /cleanroom/rooms/${room_l1}/sampling-points"
              payload: { point_code: "SP-L1A", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_l1}/sampling-points"
              payload: { point_code: "SP-L1B", metric: "VIABLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_l2}/sampling-points"
              payload: { point_code: "SP-L2A", metric: "PARTICLE", zone_iso_class: "ISO_8" }
              as: QualityAssurance
          trigger:
            - call: "GET /cleanroom/rooms/${room_l1}/sampling-points"
              as: QualityAssurance
          assert:
            - "List contains exactly 2 SamplingPoint records"
            - "Every returned record has cleanroom_id == ${room_l1}"

      - name: gowning_qualification_filtered_list
        claim_type: listing
        grounds:
          - "endpoints"
          - "entities.GowningQualification"
        distinguishing_aspect: "GET /cleanroom/gowning-qualifications?personnel_id=... returns only that personnel's qualifications (filtered-list FK reverse reachability)."
        test_recipe:
          setup: ["Two personnel P-F1/P-F2, one room CR-F1; P-F1 has a qualification, P-F2 does not"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-F1", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_f1: $.data.id }
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-F1", full_name: "Eff One", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_f1: $.data.id }
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-F2", full_name: "Eff Two", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_f2: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_f1}", cleanroom_id: "${room_f1}" }
              as: QualityAssurance
          trigger:
            - call: "GET /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_f1}" }
              as: QualityAssurance
            - call: "GET /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_f2}" }
              as: QualityAssurance
          assert:
            - "Filter personnel_id=${pers_f1}: exactly 1 record with personnel_id == ${pers_f1}"
            - "Filter personnel_id=${pers_f2}: empty list (total_count == 0)"

  # ===========================================================================
  # Section: errors — every error in the catalog is triggerable. Only errors
  # not exercised by §1.8 or by instances above are enumerated here.
  # ===========================================================================
  - section: errors
    instances:
      - name: error_batch_not_on_hold_on_resume
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BATCH_NOT_ON_HOLD]"
        distinguishing_aspect: "Resume on a batch not in ON_HOLD returns ERR_BATCH_NOT_ON_HOLD (409)."
        test_recipe:
          setup: ["Room CR-ER1; batch B-ER1 OPEN (never held)"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-ER1", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_er1: $.data.id }
            - call: "POST /cleanroom/batches"
              payload: { cleanroom_id: "${room_er1}", batch_number: "B-ER1", product_code: "PWB-ER1" }
              as: ProductionOperator
              as_user_id: "op-er1"
              captures: { batch_er1: $.data.id }
          trigger:
            - call: "POST /cleanroom/batches/${batch_er1}/resume"
              payload: {}
              as: QualityAssurance
              captures: { err_er1: $.data.error_id }
          assert:
            - "HTTP 409 error_id == ERR_BATCH_NOT_ON_HOLD"

      - name: error_cycle_result_fail_on_verify
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CYCLE_RESULT_FAIL]"
        excluded_because:
          difficulty_instance: transitive_cascade / failed_cleaning_cycle_cascades_program_revalidation
          rationale: "FAIL cycles are recorded directly as REJECTED (system transition), so a verify attempt on one deterministically surfaces ERR_CYCLE_NOT_RECORDED — asserted in error_cycle_not_recorded_on_double_verify. ERR_CYCLE_RESULT_FAIL remains as the defensive error for implementations that materialize a FAIL cycle in RECORDED before the auto-transition; the FAIL path's observable end-state (cycle REJECTED, counter reset, program re-validation) is asserted in the named §1.8 instance."

      - name: error_cycle_not_recorded_on_double_verify
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CYCLE_NOT_RECORDED]"
        distinguishing_aspect: "Verifying an already-VERIFIED cycle returns ERR_CYCLE_NOT_RECORDED (409)."
