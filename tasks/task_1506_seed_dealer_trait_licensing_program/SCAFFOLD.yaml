# =============================================================================
# SCAFFOLD.yaml — Seed Dealer & Trait Licensing Program
# §1.0–§1.7 seed tables (difficulty design and corner design live in sibling
# files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: "Seed Dealer & Trait Licensing Program (Pioneer/DeKalb seed dealer): variety placement recommendation by field, early-order discount & prepay tiers, trait/technology agreement & stewardship compliance, seed treatment options & inventory, delivery/pickup & return window rules, replant policy & claim processing, plot data & yield-result marketing, dealer commission & volume incentive"

domain_name: seed-dealer-trait-licensing
api_prefix: /dealer

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers: [rate_threshold_triggers, cascading_side_effects, optimistic_concurrency, ops_run_checkpoint]
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SeedProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: crop_year, type: integer, source: input, description: "Crop year the program sells into (e.g., 2027)" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | SALES_CLOSED | SETTLED" }
      - { name: early_order_tiers, type: array, source: input, description: "Ascending-by-cutoff list of {cutoff_at: datetime, discount_bps: integer}; order confirmed at or before a cutoff earns that tier" }
      - { name: prepay_tiers, type: array, source: input, default: [], description: "List of {pay_by: datetime, discount_bps: integer}; prepayment at or before pay_by earns that tier" }
      - { name: volume_rebate_tiers, type: array, source: input, default: [], description: "List of {min_units: integer, rebate_bps: integer} applied per order on total units" }
      - { name: return_window_end, type: datetime, source: input, description: "Inclusive last instant a return may be requested" }
      - { name: return_restocking_bps, type: integer, source: input, description: "Restocking fee in basis points of the returned merchandise value" }
      - { name: returns_untreated_only, type: boolean, source: input, description: "When true, only lines with no treatment option are returnable" }
      - { name: replant_claim_window_days, type: integer, source: input, description: "A claim must be filed no later than event_date + this many days (inclusive boundary)" }
      - { name: replant_replacement_discount_bps, type: integer, source: input, description: "Discount applied to replacement-order lines (10000 = free replacement seed)" }
      - { name: daily_delivery_capacity_units, type: integer, source: input, description: "Maximum total units scheduled across all delivery tickets sharing one UTC calendar date" }
      - { name: delivery_window_start, type: datetime, source: input, description: "Earliest schedulable delivery/pickup instant (inclusive)" }
      - { name: delivery_window_end, type: datetime, source: input, description: "Latest schedulable delivery/pickup instant (inclusive)" }
      - { name: sales_close_at, type: datetime, source: input, description: "close_sales requires logical clock >= this instant" }
      - { name: commission_base_bps, type: integer, source: input, description: "Dealer base commission in basis points of net sales" }
      - { name: commission_volume_tiers, type: array, source: input, default: [], description: "List of {min_net_units: integer, bonus_bps: integer}; highest qualifying tier applies" }
      - { name: min_plot_replications, type: integer, source: input, description: "Minimum HARVESTED|PUBLISHED plot trials per (program, variety) before any may be published" }
      - { name: opened_at, type: datetime, source: system, description: "When the program entered OPEN", default: null }
      - { name: sales_closed_at, type: datetime, source: system, description: "When the program entered SALES_CLOSED", default: null }
      - { name: settled_at, type: datetime, source: system, description: "When the program entered SETTLED", default: null }

  - name: GrowerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Farm operation name" }
      - { name: external_ref, type: string, source: input, description: "Dealer's external customer reference" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding exposure" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD | INACTIVE" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Invoiced unpaid net minus payments minus applied return credits; may go negative (refund owed)" }
      - { name: prepay_balance_cents, type: integer, source: computed, default: 0, description: "Unapplied prepayment cash held for the grower; ledger: sum(prepay) - sum(refunds) - sum(settle applications)" }

  - name: Field
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> GrowerAccount.id; owning grower" }
      - { name: name, type: string, source: input, description: "Field name" }
      - { name: acres, type: number, source: input, description: "Field size in acres; must be > 0" }
      - { name: soil_type, type: enum, source: input, description: "CLAY | LOAM | SAND | SILT" }
      - { name: drainage, type: enum, source: input, description: "POOR | MODERATE | WELL (rank 1/2/3)" }
      - { name: irrigated, type: boolean, source: input, description: "Whether the field is irrigated" }
      - { name: prev_crop, type: enum, source: input, description: "CORN | SOYBEAN | WHEAT | FALLOW | OTHER — prior-season crop" }
      - { name: maturity_zone, type: integer, source: input, description: "Relative-maturity zone 1..13; zone x targets varieties near 10*x RM days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: TraitPackage
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique trait stack code (e.g., VT2P)" }
      - { name: description, type: string, source: input, description: "Trait stack description" }
      - { name: requires_stewardship_agreement, type: boolean, source: input, description: "When true, seed of varieties carrying this package may only be sold to growers with an ACTIVE agreement" }
      - { name: refuge_required_bps, type: integer, source: input, description: "Refuge acreage requirement in basis points (stewardship rule)" }
      - { name: status, type: enum, source: system, description: "LISTED | RETIRED" }

  - name: Variety
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique variety SKU" }
      - { name: crop, type: enum, source: input, description: "CORN | SOYBEAN" }
      - { name: relative_maturity_days, type: integer, source: input, description: "Relative maturity in days" }
      - { name: trait_package_id, type: string, source: input, default: null, description: "FK -> TraitPackage.id; null = conventional untraited variety" }
      - { name: base_price_cents_per_unit, type: integer, source: input, description: "List price per seed unit (bag) in cents" }
      - { name: seeds_per_unit, type: integer, source: input, description: "Seed count per unit" }
      - { name: preferred_soils, type: array, source: input, description: "Soil types the variety is bred for (subset of CLAY|LOAM|SAND|SILT)" }
      - { name: min_drainage, type: enum, source: input, description: "POOR | MODERATE | WELL — minimum drainage class the variety tolerates" }
      - { name: status, type: enum, source: system, description: "LISTED | DELISTED" }

  - name: TraitAgreement
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> GrowerAccount.id; licensed grower" }
      - { name: trait_package_id, type: string, source: input, description: "FK -> TraitPackage.id; licensed technology package" }
      - { name: effective_from, type: datetime, source: input, description: "License window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "License window end (inclusive)" }
      - { name: status, type: enum, source: system, description: "PENDING_SIGNATURE | ACTIVE | SUSPENDED | SUPERSEDED | EXPIRED | REVOKED" }
      - { name: supersedes_agreement_id, type: string, source: system, default: null, description: "FK -> TraitAgreement.id; the prior ACTIVE agreement for the same (grower, package) that this agreement replaced at signing" }
      - { name: suspension_reason, type: enum, source: system, default: null, description: "STEWARDSHIP_VIOLATION | PAPERWORK; set on suspend, cleared on reinstate" }
      - { name: signed_at, type: datetime, source: system, default: null, description: "When the agreement was signed" }

  - name: PlacementRecommendation
    parent: null
    common_fields: true
    fields:
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; target field" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id; recommended variety" }
      - { name: program_id, type: string, source: input, description: "FK -> SeedProgram.id; program the recommendation sells into" }
      - { name: grower_id, type: string, source: system, description: "FK -> GrowerAccount.id; denormalized from Field.grower_id at creation" }
      - { name: seeding_rate_seeds_per_acre, type: integer, source: input, description: "Recommended seeding rate" }
      - { name: expected_yield_index, type: number, source: input, description: "Agronomist yield expectation index (100 = program average)" }
      - { name: placement_score, type: number, source: computed, description: "Weighted fit score 0..100 (1 decimal, round_half_up); see calculations.placement_score" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ACCEPTED | SUPERSEDED | WITHDRAWN | EXPIRED" }
      - { name: supersedes_recommendation_id, type: string, source: system, default: null, description: "FK -> PlacementRecommendation.id; the prior PUBLISHED recommendation for the same (field, program) superseded at publish time" }
      - { name: published_at, type: datetime, source: system, default: null, description: "When published" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "When accepted/withdrawn" }

  - name: SeedOrder
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> GrowerAccount.id; buying grower" }
      - { name: program_id, type: string, source: input, description: "FK -> SeedProgram.id; selling program" }
      - { name: recommendation_id, type: string, source: input, default: null, description: "FK -> PlacementRecommendation.id; optional accepted recommendation this order follows" }
      - { name: is_replacement, type: boolean, source: system, default: false, description: "True for replant-claim replacement orders (skip early-order tiers and volume rebate)" }
      - { name: status, type: enum, source: system, description: "Lifecycle dimension: DRAFT | CONFIRMED | COMPLIANCE_HOLD | CLOSED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "Parallel payment dimension: UNPAID | PREPAID | INVOICED | SETTLED" }
      - { name: fulfillment_status, type: enum, source: computed, description: "Parallel fulfillment dimension: NONE | PARTIAL | DELIVERED | RETURNED_PARTIAL | RETURNED_FULL" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of confirmation (drives early-order tier)" }
      - { name: locked_discount_bps, type: integer, source: system, default: 0, description: "Early-order discount locked at confirmation (replant bps for replacement orders)" }
      - { name: total_units, type: integer, source: computed, default: 0, description: "Sum of line units" }
      - { name: gross_amount_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents after per-line early-order discount and treatment adders" }
      - { name: rebate_bps_applied, type: integer, source: system, default: 0, description: "Volume rebate tier selected at confirmation from total_units" }
      - { name: rebate_amount_cents, type: integer, source: computed, default: 0, description: "round_half_up(gross_amount_cents * rebate_bps_applied / 10000, 0)" }
      - { name: prepay_discount_cents, type: integer, source: computed, default: 0, description: "Prepay discount computed on the pre-prepay net at prepay time" }
      - { name: net_amount_cents, type: integer, source: computed, default: 0, description: "gross - rebate - prepay_discount" }
      - { name: prepaid_amount_cents, type: integer, source: system, default: 0, description: "Cash prepaid against this order (held in grower prepay balance until settlement)" }
      - { name: paid_amount_cents, type: integer, source: system, default: 0, description: "Cash paid post-invoice against this order" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> SeedOrder.id; owning order (from path)" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id" }
      - { name: treatment_option_id, type: string, source: input, default: null, description: "FK -> TreatmentOption.id; null = untreated seed" }
      - { name: units, type: integer, source: input, description: "Units ordered; must be >= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "List price snapshot from Variety at line creation" }
      - { name: discounted_unit_price_cents, type: integer, source: system, default: null, description: "round_half_up(unit_price_cents * (10000 - locked_discount_bps)/10000, 0); written at confirmation" }
      - { name: line_total_cents, type: integer, source: computed, default: 0, description: "Pre-confirm estimate unit_price*units + adder*units; post-confirm discounted_unit_price*units + adder*units" }
      - { name: inventory_lot_id, type: string, source: system, default: null, description: "FK -> InventoryLot.id; lot selected at confirmation (FEFO); cleared on compliance hold" }
      - { name: reserved_units, type: integer, source: system, default: 0, description: "Units reserved on the selected lot" }
      - { name: delivered_units, type: integer, source: system, default: 0, description: "Units completed via delivery tickets" }
      - { name: returned_units, type: integer, source: system, default: 0, description: "Units financially credited via returns" }

  - name: TreatmentOption
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique treatment code (e.g., fungicide+insecticide package)" }
      - { name: crop, type: enum, source: input, description: "CORN | SOYBEAN — crop the treatment applies to" }
      - { name: adder_cents_per_unit, type: integer, source: input, description: "Price adder per unit; never discounted by early-order tiers" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | DISCONTINUED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id" }
      - { name: treatment_option_id, type: string, source: input, default: null, description: "FK -> TreatmentOption.id; null = untreated lot" }
      - { name: warehouse_code, type: string, source: input, description: "Physical warehouse identifier" }
      - { name: received_units, type: integer, source: input, description: "Units received into the lot at intake" }
      - { name: expiry_date, type: datetime, source: input, description: "Lots with logical clock > expiry_date are ineligible for allocation and are written off at settle" }
      - { name: on_hand_units, type: integer, source: system, description: "Physical units in warehouse (includes reserved)" }
      - { name: reserved_units, type: integer, source: system, default: 0, description: "Units soft-reserved by confirmed orders (subset of on_hand)" }
      - { name: delivered_units, type: integer, source: system, default: 0, description: "Units shipped/picked up" }
      - { name: returned_units, type: integer, source: system, default: 0, description: "Units physically received back" }
      - { name: written_off_units, type: integer, source: system, default: 0, description: "Units written off when the lot expires at settle" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | QUARANTINED | DEPLETED | EXPIRED" }

  - name: DeliveryTicket
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SeedOrder.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; must belong to order_id" }
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id; copied from OrderLine.inventory_lot_id at creation" }
      - { name: type, type: enum, source: input, description: "DELIVERY | PICKUP" }
      - { name: scheduled_date, type: datetime, source: input, description: "Scheduled instant; capacity and window rules evaluate its UTC calendar date" }
      - { name: units, type: integer, source: input, description: "Units to move; must be >= 1" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "When completion was recorded" }

  - name: SeedReturn
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SeedOrder.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; must belong to order_id" }
      - { name: delivery_ticket_id, type: string, source: input, default: null, description: "FK -> DeliveryTicket.id; optional proof-of-delivery reference" }
      - { name: units, type: integer, source: input, description: "Units returned; must be >= 1" }
      - { name: reason, type: enum, source: input, description: "OVERSTOCK | WRONG_HYBRID | DAMAGED | OTHER" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | RECEIVED | CREDITED | REJECTED" }
      - { name: requested_at, type: datetime, source: system, description: "Logical-clock instant of the request" }
      - { name: restocking_fee_cents, type: integer, source: system, default: null, description: "round_half_up(units * discounted_unit_price_cents * return_restocking_bps / 10000, 0); computed at approve" }
      - { name: credit_estimate_cents, type: integer, source: system, default: null, description: "Provisional variant: units * discounted_unit_price_cents - restocking_fee_cents; computed at approve" }
      - { name: credit_cents, type: integer, source: system, default: null, description: "Final variant: order-net repricing delta with units removed, minus restocking fee; computed at credit" }
      - { name: reject_note, type: string, source: system, default: null, description: "Rejection note" }

  - name: ReplantClaim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SeedOrder.id; the original seed order" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the failed line" }
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; where the stand failed" }
      - { name: event_date, type: datetime, source: input, description: "Date of the damaging event; must be <= logical clock" }
      - { name: event_type, type: enum, source: input, description: "FROST | FLOOD | HAIL | DROUGHT | PEST" }
      - { name: acres_affected, type: number, source: input, description: "Acres lost; > 0 and <= Field.acres" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filer (segregation of duties anchor)" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | WITHDRAWN" }
      - { name: replacement_order_id, type: string, source: system, default: null, description: "FK -> SeedOrder.id; replacement order created at approval" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "Adjuster who approved/denied" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Decision instant" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Reason recorded on denial" }

  - name: PlotTrial
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SeedProgram.id" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id" }
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; host field" }
      - { name: planting_date, type: datetime, source: input, description: "Planned planting instant; occupancy interval start (inclusive)" }
      - { name: expected_harvest_date, type: datetime, source: input, description: "Expected harvest instant; occupancy interval end (exclusive); must be > planting_date" }
      - { name: replication_index, type: integer, source: input, description: "Replication number of this trial within (program, variety)" }
      - { name: yield_bu_per_acre, type: number, source: input, default: null, description: "Harvested yield; set at record_harvest" }
      - { name: moisture_pct, type: number, source: input, default: null, description: "Harvest moisture percent; set at record_harvest" }
      - { name: actual_harvest_date, type: datetime, source: system, default: null, description: "Logical clock at record_harvest" }
      - { name: status, type: enum, source: system, description: "PLANNED | PLANTED | HARVESTED | PUBLISHED | DISCARDED" }

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> SeedProgram.id; exactly one statement per program, created when the program opens" }
      - { name: status, type: enum, source: system, description: "ACCRUING | FINALIZED | PAID" }
      - { name: gross_sales_cents, type: integer, source: computed, default: 0, description: "Sum of included orders' net_amount_cents before return credits" }
      - { name: return_credits_cents, type: integer, source: computed, default: 0, description: "Sum of credit_cents of CREDITED returns on included orders" }
      - { name: net_sales_cents, type: integer, source: computed, default: 0, description: "gross_sales_cents - return_credits_cents" }
      - { name: volume_units, type: integer, source: computed, default: 0, description: "Units counting toward the volume tier; final variant excludes replacement-order units" }
      - { name: base_commission_cents, type: integer, source: computed, default: 0, description: "round_half_up(net_sales_cents * commission_base_bps / 10000, 0)" }
      - { name: volume_bonus_bps, type: integer, source: computed, default: 0, description: "Highest commission_volume_tiers entry with min_net_units <= volume_units" }
      - { name: volume_bonus_cents, type: integer, source: computed, default: 0, description: "round_half_up(net_sales_cents * volume_bonus_bps / 10000, 0)" }
      - { name: total_commission_cents, type: integer, source: computed, default: 0, description: "base_commission_cents + volume_bonus_cents" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "When the final variant was frozen at program settle" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "When the statement was paid" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SeedProgram
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /dealer/programs/{id}/open"
        actor: DealerAdmin
        preconditions:
          - "early_order_tiers non-empty and sorted ascending by cutoff_at (ERR_INVALID_REQUEST)"
          - "return_window_end > delivery_window_end (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> OPEN; opened_at = logical clock"
          - "create CommissionStatement for this program with status ACCRUING and all computed amounts 0"
      - from: OPEN
        to: SALES_CLOSED
        trigger: "POST /dealer/programs/{id}/close_sales"
        actor: DealerAdmin
        preconditions:
          - "logical clock >= sales_close_at (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> SALES_CLOSED; sales_closed_at = logical clock"
          - "every SeedOrder of this program in DRAFT -> CANCELLED (no reservations existed)"
          - "every SeedOrder of this program in CONFIRMED with payment_status UNPAID -> INVOICED; GrowerAccount.outstanding_balance_cents += order.net_amount_cents"
          - "every PlacementRecommendation of this program in DRAFT or PUBLISHED -> EXPIRED"
          - "every TraitAgreement with effective_to < logical clock and status ACTIVE or SUSPENDED -> EXPIRED"
      - from: SALES_CLOSED
        to: SETTLED
        trigger: "POST /dealer/programs/{id}/settle"
        actor: DealerAdmin
        preconditions:
          - "logical clock > return_window_end (ERR_PROGRAM_NOT_SETTLABLE)"
          - "no SeedOrder of this program in COMPLIANCE_HOLD (ERR_PROGRAM_NOT_SETTLABLE)"
          - "no ReplantClaim on this program's orders in FILED | UNDER_REVIEW | INFO_REQUESTED (ERR_PROGRAM_NOT_SETTLABLE)"
          - "no DeliveryTicket on this program's orders in SCHEDULED (ERR_PROGRAM_NOT_SETTLABLE)"
        side_effects:
          - "every SeedOrder of this program in CONFIRMED -> CLOSED"
          - "for each such order with payment_status PREPAID: GrowerAccount.prepay_balance_cents -= order.net_amount_cents; order.payment_status -> SETTLED"
          - "orders with payment_status INVOICED keep INVOICED (post-season collection continues on GrowerAccount.outstanding_balance_cents)"
          - "CommissionStatement finalized via calculations.commission_accrual FINAL variant -> status FINALIZED, finalized_at = logical clock"
          - "every InventoryLot with expiry_date < logical clock and on_hand_units > 0 -> EXPIRED: written_off_units += on_hand_units, on_hand_units = 0"
          - "status -> SETTLED; settled_at = logical clock"

  - entity: GrowerAccount
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "POST /dealer/growers/{id}/hold"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["status -> CREDIT_HOLD; existing CONFIRMED orders unaffected"]
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "POST /dealer/growers/{id}/release_hold"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /dealer/growers/{id}/deactivate"
        actor: DealerAdmin
        preconditions:
          - "no SeedOrder of this grower in DRAFT | CONFIRMED | COMPLIANCE_HOLD (ERR_GROWER_HAS_OPEN_ORDERS)"
          - "outstanding_balance_cents == 0 and prepay_balance_cents == 0 (ERR_GROWER_NOT_SETTLED)"
        side_effects: ["status -> INACTIVE"]

  - entity: Field
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /dealer/fields/{id}/retire"
        actor: DealerAdmin | SalesRep
        preconditions:
          - "no PlotTrial on this field in PLANNED | PLANTED (ERR_FIELD_HAS_ACTIVE_PLOTS)"
        side_effects: ["status -> RETIRED"]

  - entity: TraitPackage
    initial_state: LISTED
    terminal_states: [RETIRED]
    transitions:
      - from: LISTED
        to: RETIRED
        trigger: "POST /dealer/trait-packages/{id}/retire"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["status -> RETIRED; existing ACTIVE agreements unaffected"]

  - entity: Variety
    initial_state: LISTED
    terminal_states: [DELISTED]
    transitions:
      - from: LISTED
        to: DELISTED
        trigger: "POST /dealer/varieties/{id}/delist"
        actor: DealerAdmin
        preconditions:
          - "no OrderLine with this variety in an order with status DRAFT | CONFIRMED | COMPLIANCE_HOLD (ERR_VARIETY_HAS_OPEN_ORDERS)"
        side_effects: ["status -> DELISTED"]

  - entity: TraitAgreement
    initial_state: PENDING_SIGNATURE
    terminal_states: [SUPERSEDED, EXPIRED, REVOKED]
    transitions:
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /dealer/trait-agreements/{id}/sign"
        actor: DealerAdmin | Grower
        preconditions:
          - "Grower accepts only own agreements: X-User-ID == agreement.grower_id (ERR_GROWER_OWNERSHIP_MISMATCH)"
          - "logical clock within [effective_from, effective_to] (ERR_AGREEMENT_EXPIRED)"
          - "TraitPackage status == LISTED (ERR_INVALID_STATE_TRANSITION)"
          - "GrowerAccount status == ACTIVE (ERR_GROWER_NOT_ACTIVE)"
        side_effects:
          - "status -> ACTIVE; signed_at = logical clock"
          - "if another ACTIVE agreement exists for the same (grower_id, trait_package_id): that agreement -> SUPERSEDED and this agreement.supersedes_agreement_id = that agreement's id"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dealer/trait-agreements/{id}/suspend"
        actor: DealerAdmin
        preconditions: []
        side_effects:
          - "status -> SUSPENDED; suspension_reason = request reason"
          - "CASCADE link 1->2: every SeedOrder with grower_id == agreement.grower_id, status == CONFIRMED, containing a line whose variety's trait_package_id == agreement.trait_package_id -> COMPLIANCE_HOLD"
          - "CASCADE link 2->3: for each such order, each line's reservation is released: line.inventory_lot_id -> null, InventoryLot.reserved_units -= line.reserved_units, line.reserved_units -> 0"
          - "CASCADE link 3->4: each affected InventoryLot recomputes status (DEPLETED -> AVAILABLE if on_hand_units > 0 again)"
          - "CASCADE link 4 (ledger): held orders leave the provisional commission inclusion set, so the next CommissionStatement recompute drops their net_amount_cents and units"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dealer/trait-agreements/{id}/reinstate"
        actor: DealerAdmin
        preconditions:
          - "logical clock <= effective_to (ERR_AGREEMENT_EXPIRED)"
        side_effects:
          - "status -> ACTIVE; suspension_reason -> null"
          - "held orders are NOT auto-released; each requires POST /dealer/orders/{id}/release_hold"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /dealer/trait-agreements/{id}/revoke"
        actor: DealerAdmin
        preconditions: []
        side_effects:
          - "status -> REVOKED"
          - "same order cascade as suspend (CONFIRMED traited orders -> COMPLIANCE_HOLD, reservations released)"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /dealer/trait-agreements/{id}/revoke"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["status -> REVOKED"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (program close_sales / settle sweep when effective_to < logical clock)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (program close_sales / settle sweep when effective_to < logical clock)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]

  - entity: PlacementRecommendation
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED, WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /dealer/recommendations/{id}/publish"
        actor: Agronomist
        preconditions:
          - "program status == OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "field status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status -> PUBLISHED; published_at = logical clock"
          - "if another PUBLISHED recommendation exists for the same (field_id, program_id): it -> SUPERSEDED and this recommendation.supersedes_recommendation_id = its id"
      - from: PUBLISHED
        to: ACCEPTED
        trigger: "POST /dealer/recommendations/{id}/accept"
        actor: Grower
        preconditions:
          - "X-User-ID == recommendation.grower_id (ERR_GROWER_OWNERSHIP_MISMATCH)"
          - "program status == OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "if variety carries a TraitPackage with requires_stewardship_agreement: an ACTIVE TraitAgreement exists for (grower_id, package) with logical clock inside [effective_from, effective_to] (ERR_TRAIT_AGREEMENT_NOT_ACTIVE)"
        side_effects: ["status -> ACCEPTED; decided_at = logical clock"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /dealer/recommendations/{id}/withdraw"
        actor: Agronomist | DealerAdmin
        preconditions: []
        side_effects: ["status -> WITHDRAWN; decided_at = logical clock"]
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /dealer/recommendations/{id}/withdraw"
        actor: Agronomist | DealerAdmin
        preconditions: []
        side_effects: ["status -> WITHDRAWN; decided_at = logical clock"]
      - from: DRAFT
        to: EXPIRED
        trigger: "system (program close_sales sweep)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]
      - from: PUBLISHED
        to: EXPIRED
        trigger: "system (program close_sales sweep)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]

  - entity: SeedOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: "Parallel dimensions: status (lifecycle) x payment_status (money) evolve independently; fulfillment_status is a computed third dimension derived from line delivery/return counters."
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /dealer/orders/{id}/confirm"
        actor: SalesRep | Grower
        preconditions:
          - "order has >= 1 line (ERR_ORDER_HAS_NO_LINES)"
          - "program status == OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "GrowerAccount status == ACTIVE (ERR_GROWER_NOT_ACTIVE)"
          - "GrowerAccount.outstanding_balance_cents + order gross net <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "for every line whose variety carries a TraitPackage with requires_stewardship_agreement: ACTIVE TraitAgreement for (order.grower_id, package) with clock inside [effective_from, effective_to] (ERR_TRAIT_AGREEMENT_NOT_ACTIVE)"
          - "inventory allocation succeeds for every line via calculations.inventory_allocation (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "lock pricing: locked_discount_bps via calculations.early_order_discount_bps at logical clock; per-line discounted_unit_price_cents and line_total_cents via calculations.order_line_pricing"
          - "gross_amount_cents, total_units, rebate_bps_applied, rebate_amount_cents, net_amount_cents via calculations.order_totals"
          - "reserve inventory per line: InventoryLot.reserved_units += line.units; line.reserved_units = line.units; line.inventory_lot_id = selected lot"
          - "confirmed_at = logical clock; status -> CONFIRMED"
      - from: CONFIRMED
        to: COMPLIANCE_HOLD
        trigger: "system (cascade from TraitAgreement suspend/revoke)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> COMPLIANCE_HOLD"
          - "release each line's reservation: InventoryLot.reserved_units -= line.reserved_units; line.reserved_units -> 0; line.inventory_lot_id -> null"
          - "affected lots recompute status"
      - from: COMPLIANCE_HOLD
        to: CONFIRMED
        trigger: "POST /dealer/orders/{id}/release_hold"
        actor: DealerAdmin
        preconditions:
          - "for every traited line: ACTIVE TraitAgreement for (order.grower_id, package) with clock inside window (ERR_TRAIT_AGREEMENT_NOT_ACTIVE)"
          - "re-run calculations.inventory_allocation for every line (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "re-reserve inventory per line (new lot selection allowed)"
          - "status -> CONFIRMED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /dealer/orders/{id}/cancel"
        actor: DealerAdmin | SalesRep | Grower
        preconditions:
          - "Grower cancels only own orders (ERR_GROWER_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /dealer/orders/{id}/cancel"
        actor: DealerAdmin | SalesRep | Grower
        preconditions:
          - "no DeliveryTicket of this order in COMPLETED (ERR_ORDER_HAS_DELIVERIES)"
          - "Grower cancels only own orders (ERR_GROWER_OWNERSHIP_MISMATCH)"
        side_effects:
          - "release all line reservations (InventoryLot.reserved_units -= line.reserved_units; line.reserved_units -> 0; line.inventory_lot_id -> null)"
          - "any SCHEDULED DeliveryTicket of this order -> CANCELLED"
          - "if payment_status == PREPAID: payment_status -> UNPAID, prepaid_amount_cents -> 0, prepay_discount_cents -> 0, net_amount_cents = gross - rebate (cash remains in GrowerAccount.prepay_balance_cents, unapplied)"
          - "status -> CANCELLED"
      - from: COMPLIANCE_HOLD
        to: CANCELLED
        trigger: "POST /dealer/orders/{id}/cancel"
        actor: DealerAdmin | SalesRep | Grower
        preconditions:
          - "Grower cancels only own orders (ERR_GROWER_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> CANCELLED (reservations already released by the hold cascade)"]
      - from: CONFIRMED
        to: CLOSED
        trigger: "system (program settle sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CLOSED"
          - "if payment_status == PREPAID: GrowerAccount.prepay_balance_cents -= net_amount_cents; payment_status -> SETTLED"
      - from: UNPAID
        to: PREPAID
        trigger: "POST /dealer/orders/{id}/prepay"
        actor: SalesRep | Grower
        preconditions:
          - "order status == CONFIRMED and payment_status == UNPAID (ERR_INVALID_STATE_TRANSITION)"
          - "a prepay tier with pay_by >= logical clock exists (ERR_PREPAY_WINDOW_CLOSED)"
          - "amount_cents >= net_before_prepay - prepay_discount (ERR_PREPAY_AMOUNT_INSUFFICIENT); see calculations.prepay_settlement"
          - "Grower prepays only own orders (ERR_GROWER_OWNERSHIP_MISMATCH)"
        side_effects:
          - "prepay_discount_cents and net_amount_cents via calculations.prepay_settlement"
          - "prepaid_amount_cents = amount_cents; GrowerAccount.prepay_balance_cents += amount_cents"
          - "payment_status -> PREPAID"
      - from: PREPAID
        to: UNPAID
        trigger: "POST /dealer/growers/{id}/refund_prepay"
        actor: DealerAdmin
        preconditions:
          - "order belongs to the grower in the path (ERR_NOT_FOUND)"
        side_effects:
          - "GrowerAccount.prepay_balance_cents -= order.prepaid_amount_cents"
          - "order.prepaid_amount_cents -> 0; order.prepay_discount_cents -> 0; order.net_amount_cents = gross_amount_cents - rebate_amount_cents"
          - "payment_status -> UNPAID"
      - from: UNPAID
        to: INVOICED
        trigger: "system (program close_sales sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status -> INVOICED"
          - "GrowerAccount.outstanding_balance_cents += order.net_amount_cents"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /dealer/orders/{id}/record_payment"
        actor: DealerAdmin | SalesRep
        preconditions:
          - "order status == CONFIRMED | CLOSED (ERR_INVALID_STATE_TRANSITION)"
          - "amount_cents >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "paid_amount_cents += amount_cents; GrowerAccount.outstanding_balance_cents -= amount_cents"
          - "if paid_amount_cents >= net_amount_cents: payment_status -> SETTLED"
      - from: PREPAID
        to: SETTLED
        trigger: "system (program settle sweep)"
        actor: system
        preconditions: []
        side_effects: ["prepay applied: GrowerAccount.prepay_balance_cents -= net_amount_cents; payment_status -> SETTLED"]
    computed_dimensions:
      fulfillment_status:
        NONE: "all lines have delivered_units == 0 and returned_units == 0"
        PARTIAL: "some but not all ordered units delivered, none returned"
        DELIVERED: "for every line delivered_units == units and returned_units == 0"
        RETURNED_PARTIAL: "returned_units > 0 on some line and not all delivered units returned"
        RETURNED_FULL: "for every line with delivered_units > 0, returned_units == delivered_units, and at least one return happened"

  - entity: TreatmentOption
    initial_state: AVAILABLE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: AVAILABLE
        to: DISCONTINUED
        trigger: "POST /dealer/treatment-options/{id}/discontinue"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["status -> DISCONTINUED; existing lots and lines unaffected"]

  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /dealer/inventory-lots/{id}/quarantine"
        actor: DealerAdmin
        preconditions:
          - "reserved_units == 0 (ERR_LOT_HAS_RESERVATIONS)"
        side_effects: ["status -> QUARANTINED"]
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /dealer/inventory-lots/{id}/release_quarantine"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["status -> AVAILABLE"]
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (after a delivery completion or return restock leaves on_hand_units == 0)"
        actor: system
        preconditions: ["on_hand_units == 0"]
        side_effects: ["status -> DEPLETED"]
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (program settle sweep when expiry_date < logical clock)"
        actor: system
        preconditions: ["on_hand_units > 0"]
        side_effects: ["written_off_units += on_hand_units; on_hand_units = 0; status -> EXPIRED"]
      - from: QUARANTINED
        to: EXPIRED
        trigger: "system (program settle sweep when expiry_date < logical clock)"
        actor: system
        preconditions: ["on_hand_units > 0"]
        side_effects: ["written_off_units += on_hand_units; on_hand_units = 0; status -> EXPIRED"]

  - entity: DeliveryTicket
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /dealer/delivery-tickets/{id}/complete"
        actor: SalesRep | DealerAdmin
        preconditions:
          - "logical clock >= scheduled_date (ERR_DELIVERY_TOO_EARLY)"
          - "order status == CONFIRMED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "InventoryLot: reserved_units -= units; on_hand_units -= units; delivered_units += units; recompute lot status (DEPLETED when on_hand_units == 0)"
          - "OrderLine: reserved_units -= units; delivered_units += units"
          - "SeedOrder.fulfillment_status recomputed"
          - "completed_at = logical clock; status -> COMPLETED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dealer/delivery-tickets/{id}/cancel OR cascade from order cancel"
        actor: SalesRep | DealerAdmin | system
        preconditions: []
        side_effects: ["status -> CANCELLED; reserved units stay reserved (order-level release happens at order cancel)"]

  - entity: SeedReturn
    initial_state: REQUESTED
    terminal_states: [CREDITED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /dealer/returns/{id}/approve"
        actor: DealerAdmin | SalesRep
        preconditions: []
        side_effects:
          - "compute provisional variant: restocking_fee_cents and credit_estimate_cents via calculations.return_credit"
          - "status -> APPROVED"
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /dealer/returns/{id}/receive"
        actor: DealerAdmin | SalesRep
        preconditions: []
        side_effects:
          - "physical restock when resalable (reason != DAMAGED and lot status != EXPIRED): InventoryLot.on_hand_units += units; InventoryLot.returned_units += units; lot status recompute (DEPLETED lot with on_hand > 0 -> AVAILABLE)"
          - "status -> RECEIVED"
      - from: RECEIVED
        to: CREDITED
        trigger: "POST /dealer/returns/{id}/credit"
        actor: DealerAdmin
        preconditions: []
        side_effects:
          - "compute final variant: credit_cents via calculations.return_credit FINAL (order-net repricing with the returned units removed)"
          - "OrderLine.returned_units += units"
          - "GrowerAccount.outstanding_balance_cents -= credit_cents (may go negative: refund owed)"
          - "SeedOrder.fulfillment_status recomputed"
          - "CommissionStatement of the program is marked stale; next recompute reflects the credit"
          - "status -> CREDITED"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /dealer/returns/{id}/reject"
        actor: DealerAdmin | SalesRep
        preconditions: []
        side_effects: ["reject_note = request note; status -> REJECTED"]
      - from: APPROVED
        to: REJECTED
        trigger: "POST /dealer/returns/{id}/reject"
        actor: DealerAdmin | SalesRep
        preconditions: []
        side_effects: ["reject_note = request note; status -> REJECTED"]

  - entity: ReplantClaim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /dealer/replant-claims/{id}/start_review"
        actor: ClaimsAdjuster
        preconditions:
          - "X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["status -> UNDER_REVIEW"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /dealer/replant-claims/{id}/request_info"
        actor: ClaimsAdjuster
        preconditions:
          - "X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["status -> INFO_REQUESTED"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /dealer/replant-claims/{id}/provide_info"
        actor: SalesRep | Grower | ClaimsAdjuster
        preconditions:
          - "Grower provides info only on claims for own orders (ERR_GROWER_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> UNDER_REVIEW (review loop; may repeat)"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /dealer/replant-claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "replacement inventory allocatable via calculations.inventory_allocation (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "status -> APPROVED; decided_by_user_id = X-User-ID; decided_at = logical clock"
          - "CASCADE link 1->2: create replacement SeedOrder (grower_id, program_id copied; is_replacement = true; status CONFIRMED directly, bypassing DRAFT) with one line per claimed line: same variety, no treatment, units via calculations.replant_replacement_units; locked_discount_bps = program.replant_replacement_discount_bps; no volume rebate"
          - "CASCADE link 2->3: the replacement order's confirmation reserves inventory: InventoryLot.reserved_units += replacement units; line.reserved_units and inventory_lot_id set"
          - "replacement order payment_status -> SETTLED when its net_amount_cents == 0, else UNPAID"
          - "claim.replacement_order_id = new order id"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /dealer/replant-claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["status -> DENIED; denial_reason = request denial_reason; decided_by_user_id = X-User-ID; decided_at = logical clock"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /dealer/replant-claims/{id}/withdraw"
        actor: SalesRep | Grower
        preconditions:
          - "Grower withdraws only claims for own orders (ERR_GROWER_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> WITHDRAWN"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /dealer/replant-claims/{id}/withdraw"
        actor: SalesRep | Grower
        preconditions:
          - "Grower withdraws only claims for own orders (ERR_GROWER_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> WITHDRAWN"]
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /dealer/replant-claims/{id}/withdraw"
        actor: SalesRep | Grower
        preconditions:
          - "Grower withdraws only claims for own orders (ERR_GROWER_OWNERSHIP_MISMATCH)"
        side_effects: ["status -> WITHDRAWN"]

  - entity: PlotTrial
    initial_state: PLANNED
    terminal_states: [PUBLISHED, DISCARDED]
    transitions:
      - from: PLANNED
        to: PLANTED
        trigger: "POST /dealer/plot-trials/{id}/record_planting"
        actor: Agronomist
        preconditions: []
        side_effects: ["status -> PLANTED"]
      - from: PLANTED
        to: HARVESTED
        trigger: "POST /dealer/plot-trials/{id}/record_harvest"
        actor: Agronomist
        preconditions: []
        side_effects: ["yield_bu_per_acre and moisture_pct stored; actual_harvest_date = logical clock; status -> HARVESTED"]
      - from: HARVESTED
        to: PUBLISHED
        trigger: "POST /dealer/plot-trials/{id}/publish"
        actor: Agronomist | DealerAdmin
        preconditions:
          - "count of PlotTrials for the same (program_id, variety_id) with status HARVESTED | PUBLISHED (this trial included) >= program.min_plot_replications (ERR_INSUFFICIENT_PLOT_REPLICATIONS)"
        side_effects: ["status -> PUBLISHED (yield results become quotable in marketing)"]
      - from: PLANNED
        to: DISCARDED
        trigger: "POST /dealer/plot-trials/{id}/discard"
        actor: Agronomist
        preconditions: []
        side_effects: ["status -> DISCARDED; frees the field's occupancy interval"]
      - from: PLANTED
        to: DISCARDED
        trigger: "POST /dealer/plot-trials/{id}/discard"
        actor: Agronomist
        preconditions: []
        side_effects: ["status -> DISCARDED"]

  - entity: CommissionStatement
    initial_state: ACCRUING
    terminal_states: [PAID]
    transitions:
      - from: ACCRUING
        to: ACCRUING
        trigger: "POST /dealer/commission-statements/{id}/recompute"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["recompute PROVISIONAL variant via calculations.commission_accrual"]
      - from: ACCRUING
        to: FINALIZED
        trigger: "system (program settle sweep)"
        actor: system
        preconditions: []
        side_effects: ["compute FINAL variant via calculations.commission_accrual; finalized_at = logical clock; status -> FINALIZED"]
      - from: FINALIZED
        to: PAID
        trigger: "POST /dealer/commission-statements/{id}/mark_paid"
        actor: DealerAdmin
        preconditions: []
        side_effects: ["paid_at = logical clock; status -> PAID"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-grower
    parent_entity: GrowerAccount
    write_endpoint: "POST /dealer/trait-agreements"
    occ_field: expected_grower_version
    description: |
      Creating a TraitAgreement against a GrowerAccount whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created or signed an agreement for the
      same grower (signing legitimately supersedes the prior ACTIVE agreement)
      and the current writer's view of the grower's agreement stack is stale.
    error_id: ERR_STALE_GROWER_VERSION
    http_status: 412
  - rule_id: recommendation-create-stale-field
    parent_entity: Field
    write_endpoint: "POST /dealer/recommendations"
    occ_field: expected_field_version
    description: |
      Creating a PlacementRecommendation against a Field whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another agronomist has just created a recommendation for the
      same field (publishing legitimately supersedes the prior PUBLISHED one)
      and the current writer's view of the field's recommendation stack is
      stale.
    error_id: ERR_STALE_FIELD_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: early_order_discount_bps
    trigger: "SeedOrder confirm (at confirmation, once, locked onto the order)"
    algorithm: threshold
    formula: |
      if order.is_replacement:
        return program.replant_replacement_discount_bps          # branch 1
      if order.total_units < MIN_ORDER_UNITS_FOR_DISCOUNT:
        return 0                                                  # branch 2 (small-order gate)
      # branch 3: date-tier selection — tiers are ascending by cutoff_at;
      # the FIRST tier whose cutoff_at >= confirmation clock wins (inclusive boundary).
      for tier in program.early_order_tiers (ascending cutoff_at):
        if confirmed_at <= tier.cutoff_at:
          return tier.discount_bps
      return 0                                                    # past all cutoffs
    input_set: "the confirming SeedOrder, its SeedProgram.early_order_tiers; confirmation clock instant"
    constants:
      MIN_ORDER_UNITS_FOR_DISCOUNT: 20
    precision: "integer basis points; no rounding"
    variants: []

  - name: order_line_pricing
    trigger: "OrderLine creation (estimate, discount 0) and SeedOrder confirm (final, locked discount)"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER (mode b): round the discounted UNIT price FIRST,
      # then multiply by units. Never multiply first and round the line total.
      discounted_unit_price_cents = round_half_up(unit_price_cents * (10000 - order.locked_discount_bps) / 10000, 0)
      treatment_adder_cents = (treatment_option ? treatment_option.adder_cents_per_unit : 0)
      line_total_cents = discounted_unit_price_cents * units + treatment_adder_cents * units
      # Treatment adders are NEVER discounted by early-order/prepay tiers.
      # At line creation (DRAFT order) locked_discount_bps is 0, giving the list-price estimate.
    input_set: "one OrderLine, its parent SeedOrder.locked_discount_bps, optional TreatmentOption"
    constants: {}
    precision: "0 decimal places (whole cents), round_half_up, applied per unit BEFORE multiplying by units"
    variants: []

  - name: order_totals
    trigger: "SeedOrder confirm (after per-line pricing); re-evaluated inside return_credit FINAL variant"
    algorithm: tiered_pricing
    formula: |
      gross_amount_cents = sum(line.line_total_cents for line in order.lines)
      total_units = sum(line.units for line in order.lines)
      if order.is_replacement:
        rebate_bps_applied = 0                                    # replacement orders earn no volume rebate
      else:
        rebate_bps_applied = max(tier.rebate_bps for tier in program.volume_rebate_tiers
                                 where tier.min_units <= total_units; default 0)
      rebate_amount_cents = round_half_up(gross_amount_cents * rebate_bps_applied / 10000, 0)
      net_amount_cents = gross_amount_cents - rebate_amount_cents - order.prepay_discount_cents
    input_set: "all OrderLines of the order, program.volume_rebate_tiers"
    constants: {}
    precision: "0 decimal places (whole cents), round_half_up"
    variants: []

  - name: prepay_settlement
    trigger: "POST /dealer/orders/{id}/prepay"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER (mode c — circular-looking dependency resolved):
      # the prepay discount is computed on the PRE-PREPAY net, never on the amount paid,
      # and qualification compares the payment against the POST-discount amount due.
      step1 net_before_prepay = order.gross_amount_cents - order.rebate_amount_cents
      step2 tier = the prepay tier with the LARGEST discount_bps among those with pay_by >= clock;
            if none: raise ERR_PREPAY_WINDOW_CLOSED
      step3 prepay_discount_cents = round_half_up(net_before_prepay * tier.discount_bps / 10000, 0)
      step4 net_due = net_before_prepay - prepay_discount_cents
      step5 require amount_cents >= net_due else ERR_PREPAY_AMOUNT_INSUFFICIENT
      step6 order.net_amount_cents = net_due; order.prepaid_amount_cents = amount_cents;
            GrowerAccount.prepay_balance_cents += amount_cents (any excess over net_due stays unapplied)
    input_set: "the CONFIRMED UNPAID order, program.prepay_tiers, logical clock, request amount_cents"
    constants: {}
    precision: "0 decimal places (whole cents), round_half_up"
    variants: []

  - name: return_credit
    trigger: "SeedReturn approve (PROVISIONAL estimate) and SeedReturn credit (FINAL repricing)"
    algorithm: tiered_pricing
    formula: |
      # Shared fee base (identical in both variants):
      fee_base_cents = seed_return.units * line.discounted_unit_price_cents
      restocking_fee_cents = round_half_up(fee_base_cents * program.return_restocking_bps / 10000, 0)
      # PROVISIONAL: locked per-unit price, no tier re-evaluation.
      provisional_credit = fee_base_cents - restocking_fee_cents
      # FINAL: reprice the whole order as if the returned units had never been bought:
      final_credit = (old_gross - old_rebate) - (new_gross - new_rebate) - restocking_fee_cents
        where new_* recomputes calculations.order_totals with line.units reduced by seed_return.units
        (rebate tier re-selected on post-return total_units; prepay_discount locked and excluded from both sides)
    input_set: "the SeedReturn, its OrderLine, the parent SeedOrder with all lines, program tiers"
    constants: {}
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: PROVISIONAL
        when: "computed at approve; stored on SeedReturn.credit_estimate_cents"
        difference: "credits locked per-unit price only; ignores volume-rebate tier loss"
      - name: FINAL
        when: "computed at credit; stored on SeedReturn.credit_cents and applied to GrowerAccount.outstanding_balance_cents"
        difference: "reprices the order post-return so a dropped volume-rebate tier reduces the credit; equal to PROVISIONAL only when the tier is unchanged"

  - name: commission_accrual
    trigger: "CommissionStatement recompute (PROVISIONAL) and program settle (FINAL)"
    algorithm: aggregation
    formula: |
      included_orders = orders of the program with status in {CONFIRMED, CLOSED}   # PROVISIONAL basis
      gross_sales_cents = sum(o.net_amount_cents for o in included_orders)
      return_credits_cents = sum(r.credit_cents for CREDITED returns r on included orders)
      net_sales_cents = gross_sales_cents - return_credits_cents
      volume_units = sum(o.total_units for o in included_orders)
                     - sum(r.units for CREDITED returns r on included orders)
                     - (FINAL only) sum(o.total_units for o in included_orders where o.is_replacement)
      base_commission_cents = round_half_up(net_sales_cents * program.commission_base_bps / 10000, 0)
      volume_bonus_bps = max(t.bonus_bps for t in program.commission_volume_tiers
                             where t.min_net_units <= volume_units; default 0)
      volume_bonus_cents = round_half_up(net_sales_cents * volume_bonus_bps / 10000, 0)
      total_commission_cents = base_commission_cents + volume_bonus_cents
    input_set: "all SeedOrders of the program in the inclusion set, CREDITED SeedReturns on them, program commission constants"
    constants: {}
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: PROVISIONAL
        when: "recompute while program OPEN or SALES_CLOSED (statement ACCRUING)"
        difference: "replacement-order units COUNT toward volume_units"
      - name: FINAL
        when: "program settle; statement FINALIZED"
        difference: "replacement-order units EXCLUDED from volume_units (net_sales unchanged, replacement nets are 0), so a volume tier earned provisionally can be lost at settlement"

  - name: placement_score
    trigger: "PlacementRecommendation creation (DRAFT) and publish (recompute)"
    algorithm: weighted_scoring
    formula: |
      soil_match = 1 if field.soil_type in variety.preferred_soils else 0.5
      rank = {POOR: 1, MODERATE: 2, WELL: 3}
      drainage_match = 1 if rank[field.drainage] >= rank[variety.min_drainage] else 0
      rm_gap = abs(variety.relative_maturity_days - field.maturity_zone * 10)
      maturity_fit = 1 if rm_gap <= 5 else (0.5 if rm_gap <= 15 else 0)
      rotation_bonus = 1 if field.prev_crop != variety.crop else 0
      placement_score = round_half_up(100 * (W_SOIL * soil_match + W_DRAINAGE * drainage_match
                        + W_MATURITY * maturity_fit + W_ROTATION * rotation_bonus), 1)
    input_set: "the linked Field and Variety"
    constants:
      W_SOIL: 0.35
      W_DRAINAGE: 0.25
      W_MATURITY: 0.25
      W_ROTATION: 0.15
    precision: "1 decimal place, round_half_up"
    variants: []

  - name: daily_delivery_load
    trigger: "DeliveryTicket creation"
    algorithm: threshold
    formula: |
      load = sum(t.units for DeliveryTicket t on orders of the program
                 where t.status in {SCHEDULED, COMPLETED}
                 and UTC calendar date of t.scheduled_date == UTC calendar date of new.scheduled_date)
      require load + new.units <= program.daily_delivery_capacity_units   # boundary: == capacity allowed
      else ERR_DELIVERY_CAPACITY_EXCEEDED
    input_set: "all SCHEDULED|COMPLETED DeliveryTickets of the program sharing the UTC calendar date"
    constants: {}
    precision: "integer units"
    variants: []

  - name: inventory_allocation
    trigger: "SeedOrder confirm, order release_hold, ReplantClaim approve (replacement order)"
    algorithm: waterfall_allocation
    formula: |
      # Selector policy (deterministic):
      # eligibility: lot.variety_id == line.variety_id
      #              AND lot.treatment_option_id == line.treatment_option_id (null matches null)
      #              AND lot.status == AVAILABLE
      #              AND lot.expiry_date > logical clock
      #              AND lot.on_hand_units - lot.reserved_units >= line.units   # single lot must cover the whole line; no splitting
      # ranking: expiry_date ASC (FEFO)
      # tie-break: created_at ASC (never id)
      # empty pool: ERR_INSUFFICIENT_INVENTORY
      selected = first lot in ranked eligible pool
      lot.reserved_units += line.units; line.reserved_units = line.units; line.inventory_lot_id = selected.id
    input_set: "InventoryLots of the line's variety (and treatment), the line"
    constants: {}
    precision: "integer units"
    variants: []

  - name: replant_replacement_units
    trigger: "ReplantClaim approve (replacement order line creation)"
    algorithm: constraint_propagation
    formula: |
      raw = acres_affected * line.units / field.acres
      replacement_units = min(ceil_half_up(raw), line.delivered_units - line.returned_units)
      # ceil_half_up: smallest integer >= raw (standard ceiling on a non-negative rational)
    input_set: "the claimed OrderLine, its Field, claim.acres_affected"
    constants: {}
    precision: "integer units, ceiling"
    variants: []

  - name: grower_balances
    trigger: "invoice sweep (close_sales), record_payment, prepay, refund_prepay, return credit, settle"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents: += order.net_amount_cents when the order is invoiced (UNPAID -> INVOICED);
        -= amount_cents on record_payment; -= credit_cents when a return is CREDITED (may go negative = refund owed).
      prepay_balance_cents: += amount_cents on prepay; -= order.prepaid_amount_cents on refund_prepay;
        -= order.net_amount_cents when a PREPAID order settles.
      CONSERVED QUANTITY (money): prepay_balance_cents == sum(prepay amounts) - sum(refunded prepay amounts) - sum(settle applications)
      CONSERVED QUANTITY (seed): for each lot, received_units + returned_units == on_hand_units + delivered_units + written_off_units
    input_set: "GrowerAccount, its SeedOrders and SeedReturns; InventoryLots"
    constants: {}
    precision: "0 decimal places (whole cents) / integer units"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Grower role acts only on own resources (X-User-ID equals the target's grower_id chain: order.grower_id, recommendation.grower_id, field.grower_id, agreement.grower_id, claim's order.grower_id)"
    error_id: ERR_GROWER_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all Grower-accessible non-list endpoints"
  - priority: 4
    category: existence
    check: "Every path id and every body FK resolves to an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "Request body shape: required fields present, enums valid, integer quantities >= 1, acres > 0, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: business_referential
    check: "Body references are mutually coherent: order_line_id belongs to order_id; recommendation_id belongs to the order's grower; claim field_id belongs to the order's grower; refund order_id belongs to the grower in the path"
    error_id: "ERR_ORDER_LINE_MISMATCH | ERR_RECOMMENDATION_MISMATCH | ERR_FIELD_GROWER_MISMATCH"
    http_status: 409
    applies_to: "delivery-tickets create, returns create, replant-claims create, orders create, refund_prepay"
  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition exists; program posture gates sales operations (order create/confirm, recommendation publish/accept require program OPEN)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_PROGRAM_NOT_OPEN"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "OCC: expected_grower_version == GrowerAccount.version (trait-agreements create); expected_field_version == Field.version (recommendations create)"
    error_id: "ERR_STALE_GROWER_VERSION | ERR_STALE_FIELD_VERSION"
    http_status: 412
    applies_to: "POST /dealer/trait-agreements, POST /dealer/recommendations"
  - priority: 9
    category: business_safety
    check: "Compliance: traited seed requires an ACTIVE in-window TraitAgreement for (grower, trait package); claims adjuster must not be the claim filer (segregation of duties); agreement operations respect the effective window"
    error_id: "ERR_TRAIT_AGREEMENT_NOT_ACTIVE | ERR_SEGREGATION_OF_DUTIES | ERR_AGREEMENT_EXPIRED"
    http_status: 409
    applies_to: "order lines create, order confirm, order release_hold, recommendation accept, agreement sign/reinstate, claim start_review/request_info/approve/deny"
  - priority: 10
    category: business_temporal
    check: "Window rules: prepay tier pay_by, return_window_end, replant event window, delivery scheduling window, delivery completion not before scheduled date"
    error_id: "ERR_PREPAY_WINDOW_CLOSED | ERR_RETURN_WINDOW_CLOSED | ERR_REPLANT_WINDOW_CLOSED | ERR_DELIVERY_OUTSIDE_WINDOW | ERR_DELIVERY_TOO_EARLY"
    http_status: 409
    applies_to: "prepay, returns create, replant-claims create, delivery-tickets create/complete"
  - priority: 11
    category: business_constraint
    check: "Capacity / availability / structural rules: inventory allocation, daily delivery capacity, deliverable remainder, plot window overlap, plot replication minimum, order has lines, catalog item listed, lot quarantine with no reservations, treatment crop compatibility, returnable quantity, delivered units before claim, no deliveries before cancel"
    error_id: "ERR_INSUFFICIENT_INVENTORY | ERR_DELIVERY_CAPACITY_EXCEEDED | ERR_DELIVERY_EXCEEDS_REMAINING | ERR_PLOT_WINDOW_OVERLAP | ERR_INSUFFICIENT_PLOT_REPLICATIONS | ERR_ORDER_HAS_NO_LINES | ERR_VARIETY_DELISTED | ERR_VARIETY_HAS_OPEN_ORDERS | ERR_FIELD_HAS_ACTIVE_PLOTS | ERR_LOT_HAS_RESERVATIONS | ERR_TREATMENT_INCOMPATIBLE | ERR_RETURN_NOT_ALLOWED_TREATED | ERR_RETURN_QUANTITY_EXCEEDS | ERR_NOTHING_TO_RETURN | ERR_NO_DELIVERED_UNITS | ERR_ORDER_HAS_DELIVERIES | ERR_GROWER_HAS_OPEN_ORDERS"
    http_status: 409
    applies_to: "confirm, release_hold, claim approve, delivery-tickets create/complete, plot-trials create/publish, lines create, variety delist, field retire, lot quarantine, returns create, order cancel, grower deactivate"
  - priority: 12
    category: business_fiscal
    check: "Money rules last: grower status allows new exposure; credit limit covers outstanding + order net; prepay amount covers the post-discount net due; grower ledger settled before deactivation"
    error_id: "ERR_GROWER_NOT_ACTIVE | ERR_CREDIT_LIMIT_EXCEEDED | ERR_PREPAY_AMOUNT_INSUFFICIENT | ERR_GROWER_NOT_SETTLED"
    http_status: 409
    applies_to: "order confirm, prepay, agreement sign, grower deactivate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint; outside the public business surface) ---
  - method: POST
    path: "/dealer/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [DealerAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601; lazy EXPIRED evaluation of TraitAgreements and lot allocation eligibility uses this clock"]

  # --- SeedProgram ---
  - method: POST
    path: "/dealer/programs"
    description: "Create a seed program (DRAFT)"
    roles: [DealerAdmin]
    code: 201
    input: [name, crop_year, early_order_tiers, "prepay_tiers?", "volume_rebate_tiers?", return_window_end, return_restocking_bps, returns_untreated_only, replant_claim_window_days, replant_replacement_discount_bps, daily_delivery_capacity_units, delivery_window_start, delivery_window_end, sales_close_at, commission_base_bps, "commission_volume_tiers?", min_plot_replications]
    output: SeedProgram
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/dealer/programs/{id}"
    description: "Get a program"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: SeedProgram
    side_effects: []
  - method: GET
    path: "/dealer/programs"
    description: "List programs"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SeedProgram[]"
    side_effects: []
  - method: POST
    path: "/dealer/programs/{id}/open"
    description: "Open a program for selling; creates its ACCRUING CommissionStatement"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: SeedProgram
    side_effects: ["DRAFT -> OPEN; CommissionStatement created (ACCRUING)"]
  - method: POST
    path: "/dealer/programs/{id}/close_sales"
    description: "Ops-run checkpoint: close the selling season (cancels DRAFT orders, invoices CONFIRMED UNPAID orders, expires recommendations and out-of-window agreements)"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: SeedProgram
    side_effects: ["OPEN -> SALES_CLOSED plus sweep per SeedProgram state machine"]
  - method: POST
    path: "/dealer/programs/{id}/settle"
    description: "Ops-run checkpoint: settle the program (closes orders, applies prepayments, finalizes the commission statement, writes off expired lots)"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: SeedProgram
    side_effects: ["SALES_CLOSED -> SETTLED plus sweep per SeedProgram state machine"]

  # --- TraitPackage ---
  - method: POST
    path: "/dealer/trait-packages"
    description: "Create a trait package (LISTED)"
    roles: [DealerAdmin]
    code: 201
    input: [code, description, requires_stewardship_agreement, refuge_required_bps]
    output: TraitPackage
    side_effects: ["status=LISTED"]
  - method: GET
    path: "/dealer/trait-packages/{id}"
    description: "Get a trait package"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: TraitPackage
    side_effects: []
  - method: GET
    path: "/dealer/trait-packages"
    description: "List trait packages"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TraitPackage[]"
    side_effects: []
  - method: POST
    path: "/dealer/trait-packages/{id}/retire"
    description: "Retire a trait package"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: TraitPackage
    side_effects: ["LISTED -> RETIRED"]

  # --- Variety ---
  - method: POST
    path: "/dealer/varieties"
    description: "Create a variety (LISTED)"
    roles: [DealerAdmin]
    code: 201
    input: [sku, crop, relative_maturity_days, "trait_package_id?", base_price_cents_per_unit, seeds_per_unit, preferred_soils, min_drainage]
    output: Variety
    side_effects: ["status=LISTED"]
  - method: GET
    path: "/dealer/varieties/{id}"
    description: "Get a variety"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: Variety
    side_effects: []
  - method: GET
    path: "/dealer/varieties"
    description: "List varieties"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["trait_package_id?", "status?", "crop?", "limit?", "offset?"]
    output: "Variety[]"
    side_effects: []
  - method: POST
    path: "/dealer/varieties/{id}/delist"
    description: "Delist a variety (blocked while open orders reference it)"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: Variety
    side_effects: ["LISTED -> DELISTED"]

  # --- GrowerAccount ---
  - method: POST
    path: "/dealer/growers"
    description: "Create a grower account (ACTIVE)"
    roles: [DealerAdmin, SalesRep]
    code: 201
    input: [account_name, external_ref, credit_limit_cents]
    output: GrowerAccount
    side_effects: ["status=ACTIVE; balances 0"]
  - method: GET
    path: "/dealer/growers/{id}"
    description: "Get a grower (Grower: own record only)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: GrowerAccount
    side_effects: []
  - method: GET
    path: "/dealer/growers"
    description: "List growers"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "GrowerAccount[]"
    side_effects: []
  - method: POST
    path: "/dealer/growers/{id}/hold"
    description: "Place a grower on credit hold"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: GrowerAccount
    side_effects: ["ACTIVE -> CREDIT_HOLD"]
  - method: POST
    path: "/dealer/growers/{id}/release_hold"
    description: "Release a grower credit hold"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: GrowerAccount
    side_effects: ["CREDIT_HOLD -> ACTIVE"]
  - method: POST
    path: "/dealer/growers/{id}/deactivate"
    description: "Deactivate a grower (requires no open orders and zero balances)"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: GrowerAccount
    side_effects: ["ACTIVE -> INACTIVE"]
  - method: POST
    path: "/dealer/growers/{id}/refund_prepay"
    description: "Refund a PREPAID order's prepayment back out of the grower's prepay balance; order returns to UNPAID with prepay discount removed"
    roles: [DealerAdmin]
    code: 200
    input: [order_id]
    output: GrowerAccount
    side_effects: ["prepay_balance_cents -= order.prepaid_amount_cents; order PREPAID -> UNPAID; prepaid_amount_cents -> 0; prepay_discount_cents -> 0; net_amount_cents restored to gross - rebate"]

  # --- Field ---
  - method: POST
    path: "/dealer/fields"
    description: "Create a field (Grower: grower_id must equal X-User-ID)"
    roles: [DealerAdmin, SalesRep, Grower]
    code: 201
    input: [grower_id, name, acres, soil_type, drainage, irrigated, prev_crop, maturity_zone]
    output: Field
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/dealer/fields/{id}"
    description: "Get a field (Grower: own only)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: Field
    side_effects: []
  - method: GET
    path: "/dealer/fields"
    description: "List fields (Grower: implicitly restricted to own)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["grower_id?", "status?", "limit?", "offset?"]
    output: "Field[]"
    side_effects: []
  - method: POST
    path: "/dealer/fields/{id}/retire"
    description: "Retire a field (blocked while plot trials occupy it)"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: []
    output: Field
    side_effects: ["ACTIVE -> RETIRED"]

  # --- TraitAgreement ---
  - method: POST
    path: "/dealer/trait-agreements"
    description: "Create a trait/technology agreement (PENDING_SIGNATURE); OCC-guarded on the grower's version; increments GrowerAccount.version by 1"
    roles: [DealerAdmin, SalesRep]
    code: 201
    input: [grower_id, trait_package_id, effective_from, effective_to, expected_grower_version]
    output: TraitAgreement
    side_effects: ["status=PENDING_SIGNATURE; increments GrowerAccount.version by 1; OCC check per concurrency_rules[agreement-create-stale-grower]"]
  - method: GET
    path: "/dealer/trait-agreements/{id}"
    description: "Get a trait agreement (Grower: own only)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: TraitAgreement
    side_effects: []
  - method: GET
    path: "/dealer/trait-agreements"
    description: "List trait agreements (Grower: implicitly restricted to own)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["grower_id?", "trait_package_id?", "supersedes_agreement_id?", "status?", "limit?", "offset?"]
    output: "TraitAgreement[]"
    side_effects: []
  - method: POST
    path: "/dealer/trait-agreements/{id}/sign"
    description: "Sign a pending agreement; supersedes any ACTIVE agreement for the same (grower, package)"
    roles: [DealerAdmin, Grower]
    code: 200
    input: []
    output: TraitAgreement
    side_effects: ["PENDING_SIGNATURE -> ACTIVE; prior ACTIVE agreement for the pair -> SUPERSEDED"]
  - method: POST
    path: "/dealer/trait-agreements/{id}/suspend"
    description: "Suspend an active agreement (stewardship violation or paperwork); cascades holding affected CONFIRMED orders and releasing their inventory reservations"
    roles: [DealerAdmin]
    code: 200
    input: [reason]
    output: TraitAgreement
    side_effects: ["ACTIVE -> SUSPENDED; order hold cascade per TraitAgreement state machine"]
  - method: POST
    path: "/dealer/trait-agreements/{id}/reinstate"
    description: "Reinstate a suspended agreement (does not auto-release held orders)"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: TraitAgreement
    side_effects: ["SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/dealer/trait-agreements/{id}/revoke"
    description: "Revoke an agreement (terminal); same order cascade as suspend"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: TraitAgreement
    side_effects: ["ACTIVE|SUSPENDED -> REVOKED; order hold cascade"]

  # --- PlacementRecommendation ---
  - method: POST
    path: "/dealer/recommendations"
    description: "Create a placement recommendation (DRAFT); OCC-guarded on the field's version; increments Field.version by 1"
    roles: [Agronomist]
    code: 201
    input: [field_id, variety_id, program_id, seeding_rate_seeds_per_acre, expected_yield_index, expected_field_version]
    output: PlacementRecommendation
    side_effects: ["status=DRAFT; grower_id copied from Field; placement_score computed; increments Field.version by 1; OCC check per concurrency_rules[recommendation-create-stale-field]"]
  - method: GET
    path: "/dealer/recommendations/{id}"
    description: "Get a recommendation (Grower: own only)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: PlacementRecommendation
    side_effects: []
  - method: GET
    path: "/dealer/recommendations"
    description: "List recommendations (Grower: implicitly restricted to own)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["field_id?", "variety_id?", "program_id?", "grower_id?", "supersedes_recommendation_id?", "status?", "limit?", "offset?"]
    output: "PlacementRecommendation[]"
    side_effects: []
  - method: POST
    path: "/dealer/recommendations/{id}/publish"
    description: "Publish a recommendation; supersedes the prior PUBLISHED one for the same (field, program)"
    roles: [Agronomist]
    code: 200
    input: []
    output: PlacementRecommendation
    side_effects: ["DRAFT -> PUBLISHED; prior PUBLISHED for (field_id, program_id) -> SUPERSEDED"]
  - method: POST
    path: "/dealer/recommendations/{id}/accept"
    description: "Grower accepts a published recommendation"
    roles: [Grower]
    code: 200
    input: []
    output: PlacementRecommendation
    side_effects: ["PUBLISHED -> ACCEPTED"]
  - method: POST
    path: "/dealer/recommendations/{id}/withdraw"
    description: "Withdraw a draft or published recommendation"
    roles: [Agronomist, DealerAdmin]
    code: 200
    input: []
    output: PlacementRecommendation
    side_effects: ["DRAFT|PUBLISHED -> WITHDRAWN"]

  # --- SeedOrder / OrderLine ---
  - method: POST
    path: "/dealer/orders"
    description: "Create a draft seed order (Grower: grower_id must equal X-User-ID)"
    roles: [DealerAdmin, SalesRep, Grower]
    code: 201
    input: [grower_id, program_id, "recommendation_id?"]
    output: SeedOrder
    side_effects: ["status=DRAFT; payment_status=UNPAID; fulfillment_status=NONE; amounts 0"]
  - method: GET
    path: "/dealer/orders/{id}"
    description: "Get an order (Grower: own only)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: SeedOrder
    side_effects: []
  - method: GET
    path: "/dealer/orders"
    description: "List orders (Grower: implicitly restricted to own)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["grower_id?", "program_id?", "recommendation_id?", "status?", "payment_status?", "limit?", "offset?"]
    output: "SeedOrder[]"
    side_effects: []
  - method: POST
    path: "/dealer/orders/{id}/lines"
    description: "Add a line to a DRAFT order; snapshots the variety list price; requires active trait agreement for traited varieties"
    roles: [DealerAdmin, SalesRep, Grower]
    code: 201
    input: [variety_id, units, "treatment_option_id?"]
    output: OrderLine
    side_effects: ["unit_price_cents snapshot; line_total_cents estimate at discount 0; order total_units/gross recomputed"]
  - method: GET
    path: "/dealer/order-lines/{id}"
    description: "Get an order line (Grower: own order only)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/dealer/order-lines"
    description: "List order lines (Grower: implicitly restricted to own orders)"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["order_id?", "variety_id?", "treatment_option_id?", "inventory_lot_id?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: POST
    path: "/dealer/orders/{id}/confirm"
    description: "Confirm a draft order: locks the early-order tier, prices lines (per-unit rounding), selects the volume rebate tier, allocates inventory (FEFO)"
    roles: [SalesRep, Grower]
    code: 200
    input: []
    output: SeedOrder
    side_effects: ["DRAFT -> CONFIRMED; pricing locked; inventory reserved per line"]
  - method: POST
    path: "/dealer/orders/{id}/cancel"
    description: "Cancel a draft/confirmed/held order; releases reservations, cancels scheduled tickets, unapplies prepay"
    roles: [DealerAdmin, SalesRep, Grower]
    code: 200
    input: []
    output: SeedOrder
    side_effects: ["-> CANCELLED per SeedOrder state machine"]
  - method: POST
    path: "/dealer/orders/{id}/release_hold"
    description: "Release a compliance hold after agreements are reinstated; re-runs inventory allocation"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: SeedOrder
    side_effects: ["COMPLIANCE_HOLD -> CONFIRMED; inventory re-reserved"]
  - method: POST
    path: "/dealer/orders/{id}/prepay"
    description: "Prepay a confirmed order into the grower's prepay balance; earns the prepay tier discount (evaluation order per calculations.prepay_settlement)"
    roles: [SalesRep, Grower]
    code: 200
    input: [amount_cents]
    output: SeedOrder
    side_effects: ["UNPAID -> PREPAID; GrowerAccount.prepay_balance_cents += amount_cents"]
  - method: POST
    path: "/dealer/orders/{id}/record_payment"
    description: "Record a cash payment against an invoiced order"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: [amount_cents]
    output: SeedOrder
    side_effects: ["paid_amount_cents += amount; outstanding_balance -= amount; INVOICED -> SETTLED when fully paid"]

  # --- TreatmentOption ---
  - method: POST
    path: "/dealer/treatment-options"
    description: "Create a treatment option (AVAILABLE)"
    roles: [DealerAdmin]
    code: 201
    input: [code, crop, adder_cents_per_unit]
    output: TreatmentOption
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/dealer/treatment-options/{id}"
    description: "Get a treatment option"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: TreatmentOption
    side_effects: []
  - method: GET
    path: "/dealer/treatment-options"
    description: "List treatment options"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["status?", "crop?", "limit?", "offset?"]
    output: "TreatmentOption[]"
    side_effects: []
  - method: POST
    path: "/dealer/treatment-options/{id}/discontinue"
    description: "Discontinue a treatment option"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: TreatmentOption
    side_effects: ["AVAILABLE -> DISCONTINUED"]

  # --- InventoryLot ---
  - method: POST
    path: "/dealer/inventory-lots"
    description: "Receive an inventory lot (AVAILABLE)"
    roles: [DealerAdmin]
    code: 201
    input: [variety_id, "treatment_option_id?", warehouse_code, received_units, expiry_date]
    output: InventoryLot
    side_effects: ["on_hand_units = received_units; reserved/delivered/returned/written_off = 0; status=AVAILABLE"]
  - method: GET
    path: "/dealer/inventory-lots/{id}"
    description: "Get an inventory lot"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: GET
    path: "/dealer/inventory-lots"
    description: "List inventory lots"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: ["variety_id?", "treatment_option_id?", "status?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []
  - method: POST
    path: "/dealer/inventory-lots/{id}/quarantine"
    description: "Quarantine a lot (requires no open reservations)"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["AVAILABLE -> QUARANTINED"]
  - method: POST
    path: "/dealer/inventory-lots/{id}/release_quarantine"
    description: "Release a lot from quarantine"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["QUARANTINED -> AVAILABLE"]

  # --- DeliveryTicket ---
  - method: POST
    path: "/dealer/delivery-tickets"
    description: "Schedule a delivery or pickup against a confirmed order line (window + daily capacity + remainder checks)"
    roles: [DealerAdmin, SalesRep]
    code: 201
    input: [order_id, order_line_id, type, scheduled_date, units]
    output: DeliveryTicket
    side_effects: ["status=SCHEDULED; lot_id copied from the line"]
  - method: GET
    path: "/dealer/delivery-tickets/{id}"
    description: "Get a delivery ticket (Grower: own order only)"
    roles: [DealerAdmin, SalesRep, Grower]
    code: 200
    input: []
    output: DeliveryTicket
    side_effects: []
  - method: GET
    path: "/dealer/delivery-tickets"
    description: "List delivery tickets (Grower: implicitly restricted to own orders)"
    roles: [DealerAdmin, SalesRep, Grower]
    code: 200
    input: ["order_id?", "order_line_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: "DeliveryTicket[]"
    side_effects: []
  - method: POST
    path: "/dealer/delivery-tickets/{id}/complete"
    description: "Complete a scheduled ticket on or after its scheduled date; moves units reserved -> delivered on lot and line"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: []
    output: DeliveryTicket
    side_effects: ["SCHEDULED -> COMPLETED; lot and line counters updated; order fulfillment_status recomputed"]
  - method: POST
    path: "/dealer/delivery-tickets/{id}/cancel"
    description: "Cancel a scheduled ticket (reservation remains on the order)"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: []
    output: DeliveryTicket
    side_effects: ["SCHEDULED -> CANCELLED"]

  # --- SeedReturn ---
  - method: POST
    path: "/dealer/returns"
    description: "Request a return (window, untreated-only, and quantity-remaining rules)"
    roles: [SalesRep, Grower]
    code: 201
    input: [order_id, order_line_id, units, reason, "delivery_ticket_id?"]
    output: SeedReturn
    side_effects: ["status=REQUESTED; requested_at = logical clock"]
  - method: GET
    path: "/dealer/returns/{id}"
    description: "Get a return (Grower: own order only)"
    roles: [DealerAdmin, SalesRep, Grower]
    code: 200
    input: []
    output: SeedReturn
    side_effects: []
  - method: GET
    path: "/dealer/returns"
    description: "List returns (Grower: implicitly restricted to own orders)"
    roles: [DealerAdmin, SalesRep, Grower]
    code: 200
    input: ["order_id?", "order_line_id?", "delivery_ticket_id?", "status?", "limit?", "offset?"]
    output: "SeedReturn[]"
    side_effects: []
  - method: POST
    path: "/dealer/returns/{id}/approve"
    description: "Approve a return; computes the PROVISIONAL credit estimate and restocking fee"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: []
    output: SeedReturn
    side_effects: ["REQUESTED -> APPROVED; credit_estimate_cents and restocking_fee_cents computed"]
  - method: POST
    path: "/dealer/returns/{id}/receive"
    description: "Physically receive returned seed; restocks the lot when resalable"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: []
    output: SeedReturn
    side_effects: ["APPROVED -> RECEIVED; lot restock when reason != DAMAGED and lot not EXPIRED"]
  - method: POST
    path: "/dealer/returns/{id}/credit"
    description: "Credit a received return; computes the FINAL repriced credit and applies it to the grower balance"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: SeedReturn
    side_effects: ["RECEIVED -> CREDITED; credit_cents computed; line.returned_units += units; grower outstanding reduced; commission statement marked stale"]
  - method: POST
    path: "/dealer/returns/{id}/reject"
    description: "Reject a requested or approved return"
    roles: [DealerAdmin, SalesRep]
    code: 200
    input: ["note?"]
    output: SeedReturn
    side_effects: ["REQUESTED|APPROVED -> REJECTED"]

  # --- ReplantClaim ---
  - method: POST
    path: "/dealer/replant-claims"
    description: "File a replant claim (event window, delivered-units, and field-ownership rules)"
    roles: [SalesRep, Grower, ClaimsAdjuster]
    code: 201
    input: [order_id, order_line_id, field_id, event_date, event_type, acres_affected]
    output: ReplantClaim
    side_effects: ["status=FILED; filed_by_user_id = X-User-ID"]
  - method: GET
    path: "/dealer/replant-claims/{id}"
    description: "Get a replant claim (Grower: own order only)"
    roles: [DealerAdmin, SalesRep, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: ReplantClaim
    side_effects: []
  - method: GET
    path: "/dealer/replant-claims"
    description: "List replant claims (Grower: implicitly restricted to own orders)"
    roles: [DealerAdmin, SalesRep, Grower, ClaimsAdjuster]
    code: 200
    input: ["order_id?", "order_line_id?", "field_id?", "replacement_order_id?", "status?", "limit?", "offset?"]
    output: "ReplantClaim[]"
    side_effects: []
  - method: POST
    path: "/dealer/replant-claims/{id}/start_review"
    description: "Adjuster starts review (must not be the filer)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ReplantClaim
    side_effects: ["FILED -> UNDER_REVIEW"]
  - method: POST
    path: "/dealer/replant-claims/{id}/request_info"
    description: "Adjuster requests more information (review loop)"
    roles: [ClaimsAdjuster]
    code: 200
    input: ["note?"]
    output: ReplantClaim
    side_effects: ["UNDER_REVIEW -> INFO_REQUESTED"]
  - method: POST
    path: "/dealer/replant-claims/{id}/provide_info"
    description: "Filer side provides information; claim returns to review"
    roles: [SalesRep, Grower, ClaimsAdjuster]
    code: 200
    input: ["note?"]
    output: ReplantClaim
    side_effects: ["INFO_REQUESTED -> UNDER_REVIEW"]
  - method: POST
    path: "/dealer/replant-claims/{id}/approve"
    description: "Approve a claim; creates the zero/reduced-price replacement order and reserves its inventory"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ReplantClaim
    side_effects: ["UNDER_REVIEW -> APPROVED; replacement SeedOrder created CONFIRMED; inventory reserved; claim.replacement_order_id set"]
  - method: POST
    path: "/dealer/replant-claims/{id}/deny"
    description: "Deny a claim (must not be the filer)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [denial_reason]
    output: ReplantClaim
    side_effects: ["UNDER_REVIEW -> DENIED"]
  - method: POST
    path: "/dealer/replant-claims/{id}/withdraw"
    description: "Filer side withdraws an open claim"
    roles: [SalesRep, Grower]
    code: 200
    input: []
    output: ReplantClaim
    side_effects: ["FILED|UNDER_REVIEW|INFO_REQUESTED -> WITHDRAWN"]

  # --- PlotTrial ---
  - method: POST
    path: "/dealer/plot-trials"
    description: "Plan a plot trial (half-open occupancy interval per field; overlap rejected)"
    roles: [Agronomist]
    code: 201
    input: [program_id, variety_id, field_id, planting_date, expected_harvest_date, replication_index]
    output: PlotTrial
    side_effects: ["status=PLANNED"]
  - method: GET
    path: "/dealer/plot-trials/{id}"
    description: "Get a plot trial"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: []
    output: PlotTrial
    side_effects: []
  - method: GET
    path: "/dealer/plot-trials"
    description: "List plot trials"
    roles: [DealerAdmin, SalesRep, Agronomist, Grower, ClaimsAdjuster]
    code: 200
    input: ["program_id?", "variety_id?", "field_id?", "status?", "limit?", "offset?"]
    output: "PlotTrial[]"
    side_effects: []
  - method: POST
    path: "/dealer/plot-trials/{id}/record_planting"
    description: "Mark a planned trial planted"
    roles: [Agronomist]
    code: 200
    input: []
    output: PlotTrial
    side_effects: ["PLANNED -> PLANTED"]
  - method: POST
    path: "/dealer/plot-trials/{id}/record_harvest"
    description: "Record harvest results"
    roles: [Agronomist]
    code: 200
    input: [yield_bu_per_acre, moisture_pct]
    output: PlotTrial
    side_effects: ["PLANTED -> HARVESTED; actual_harvest_date = logical clock"]
  - method: POST
    path: "/dealer/plot-trials/{id}/publish"
    description: "Publish yield results for marketing; requires the program's minimum replications for the variety"
    roles: [Agronomist, DealerAdmin]
    code: 200
    input: []
    output: PlotTrial
    side_effects: ["HARVESTED -> PUBLISHED"]
  - method: POST
    path: "/dealer/plot-trials/{id}/discard"
    description: "Discard a planned or planted trial"
    roles: [Agronomist]
    code: 200
    input: []
    output: PlotTrial
    side_effects: ["PLANNED|PLANTED -> DISCARDED"]

  # --- CommissionStatement ---
  - method: GET
    path: "/dealer/commission-statements/{id}"
    description: "Get a commission statement"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: []
  - method: GET
    path: "/dealer/commission-statements"
    description: "List commission statements"
    roles: [DealerAdmin]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "CommissionStatement[]"
    side_effects: []
  - method: POST
    path: "/dealer/commission-statements/{id}/recompute"
    description: "Recompute the PROVISIONAL accrual (ACCRUING only)"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["PROVISIONAL variant recomputed"]
  - method: POST
    path: "/dealer/commission-statements/{id}/mark_paid"
    description: "Mark a finalized statement paid"
    roles: [DealerAdmin]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["FINALIZED -> PAID"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  - { id: ERR_GROWER_OWNERSHIP_MISMATCH, http: 403, condition: "Grower role acts on a resource whose grower_id chain does not equal X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or body FK does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive quantity/acres, or unknown body field" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource state does not allow the requested transition" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Sales operation (order create/confirm, recommendation publish/accept) requires program status OPEN" }
  - { id: ERR_PROGRAM_NOT_SETTLABLE, http: 409, condition: "Settle precondition failed: clock not past return window, or open claims/scheduled tickets/held orders remain" }
  - { id: ERR_STALE_GROWER_VERSION, http: 412, condition: "expected_grower_version does not match GrowerAccount.version (OCC)" }
  - { id: ERR_STALE_FIELD_VERSION, http: 412, condition: "expected_field_version does not match Field.version (OCC)" }
  - { id: ERR_ORDER_LINE_MISMATCH, http: 409, condition: "order_line_id does not belong to the referenced order_id" }
  - { id: ERR_RECOMMENDATION_MISMATCH, http: 409, condition: "recommendation_id does not belong to the order's grower, or is not PUBLISHED/ACCEPTED" }
  - { id: ERR_FIELD_GROWER_MISMATCH, http: 409, condition: "field_id does not belong to the order's grower (replant claim)" }
  - { id: ERR_TRAIT_AGREEMENT_NOT_ACTIVE, http: 409, condition: "A traited variety requires an ACTIVE, in-window TraitAgreement for (grower, trait package)" }
  - { id: ERR_AGREEMENT_EXPIRED, http: 409, condition: "Agreement operation attempted outside [effective_from, effective_to]" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claims adjuster must not be the user who filed the claim" }
  - { id: ERR_PREPAY_WINDOW_CLOSED, http: 409, condition: "No prepay tier with pay_by >= logical clock remains" }
  - { id: ERR_PREPAY_AMOUNT_INSUFFICIENT, http: 409, condition: "amount_cents below the post-discount net due" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 409, condition: "Return requested after program.return_window_end (inclusive boundary)" }
  - { id: ERR_RETURN_NOT_ALLOWED_TREATED, http: 409, condition: "Program allows returns of untreated seed only and the line carries a treatment" }
  - { id: ERR_RETURN_QUANTITY_EXCEEDS, http: 409, condition: "Requested units exceed delivered minus already-returned minus in-flight returns" }
  - { id: ERR_NOTHING_TO_RETURN, http: 409, condition: "No returnable units remain on the line (delivered == returned + in-flight)" }
  - { id: ERR_REPLANT_WINDOW_CLOSED, http: 409, condition: "Claim filed later than event_date + replant_claim_window_days (inclusive boundary)" }
  - { id: ERR_NO_DELIVERED_UNITS, http: 409, condition: "Claimed line has no delivered, unreturned units" }
  - { id: ERR_DELIVERY_OUTSIDE_WINDOW, http: 409, condition: "scheduled_date outside [delivery_window_start, delivery_window_end]" }
  - { id: ERR_DELIVERY_TOO_EARLY, http: 409, condition: "Completion attempted before scheduled_date" }
  - { id: ERR_DELIVERY_CAPACITY_EXCEEDED, http: 409, condition: "Daily program delivery load + new units > daily_delivery_capacity_units" }
  - { id: ERR_DELIVERY_EXCEEDS_REMAINING, http: 409, condition: "Ticket units exceed line reserved minus delivered minus already-scheduled units" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "No eligible lot can cover the full line (allocation selector empty pool)" }
  - { id: ERR_VARIETY_DELISTED, http: 409, condition: "Line references a DELISTED variety" }
  - { id: ERR_VARIETY_HAS_OPEN_ORDERS, http: 409, condition: "Delist blocked by lines on DRAFT|CONFIRMED|COMPLIANCE_HOLD orders" }
  - { id: ERR_FIELD_HAS_ACTIVE_PLOTS, http: 409, condition: "Field retire blocked by PLANNED|PLANTED plot trials" }
  - { id: ERR_LOT_HAS_RESERVATIONS, http: 409, condition: "Quarantine blocked while reserved_units > 0" }
  - { id: ERR_TREATMENT_INCOMPATIBLE, http: 409, condition: "Treatment option crop differs from variety crop, or treatment is DISCONTINUED" }
  - { id: ERR_PLOT_WINDOW_OVERLAP, http: 409, condition: "Plot occupancy interval [planting_date, expected_harvest_date) overlaps another PLANNED|PLANTED|HARVESTED trial on the same field" }
  - { id: ERR_INSUFFICIENT_PLOT_REPLICATIONS, http: 409, condition: "Fewer than program.min_plot_replications HARVESTED|PUBLISHED trials for (program, variety)" }
  - { id: ERR_ORDER_HAS_NO_LINES, http: 409, condition: "Confirm requires at least one order line" }
  - { id: ERR_ORDER_HAS_DELIVERIES, http: 409, condition: "Cancel blocked: a COMPLETED delivery ticket exists for the order" }
  - { id: ERR_GROWER_NOT_ACTIVE, http: 409, condition: "Grower status is not ACTIVE (confirm, agreement sign)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "outstanding_balance_cents + order net exceeds credit_limit_cents" }
  - { id: ERR_GROWER_HAS_OPEN_ORDERS, http: 409, condition: "Deactivate blocked by orders in DRAFT|CONFIRMED|COMPLIANCE_HOLD" }
  - { id: ERR_GROWER_NOT_SETTLED, http: 409, condition: "Deactivate blocked by non-zero outstanding or prepay balance" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DealerAdmin
    description: "Dealership operator: owns the program, catalog, inventory, compliance actions, and settlement"
    identity: opaque
    exclusive_operations:
      - "POST /dealer/_clock/set_current_utc"
      - "POST /dealer/programs, /open, /close_sales, /settle"
      - "POST /dealer/trait-packages (+/retire), /dealer/varieties (+/delist), /dealer/treatment-options (+/discontinue)"
      - "POST /dealer/inventory-lots (+/quarantine, /release_quarantine)"
      - "POST /dealer/growers/{id}/hold, /release_hold, /deactivate, /refund_prepay"
      - "POST /dealer/trait-agreements/{id}/suspend, /reinstate, /revoke"
      - "POST /dealer/orders/{id}/release_hold"
      - "POST /dealer/returns/{id}/credit"
      - "GET /dealer/commission-statements*, POST .../recompute, .../mark_paid"
    shared_operations:
      - "grower/field/order/line creation; order cancel; delivery create/complete/cancel; return approve/receive/reject; record_payment; recommendation withdraw; plot publish; agreement sign; all read endpoints"
  - name: SalesRep
    description: "Dealer sales representative: manages grower accounts and their orders, deliveries, returns, and replant claims"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /dealer/growers, /dealer/fields, /dealer/orders, /dealer/orders/{id}/lines"
      - "POST /dealer/orders/{id}/confirm, /cancel, /prepay, /record_payment"
      - "POST /dealer/trait-agreements (create), delivery-tickets (create/complete/cancel), returns (create/approve/receive/reject)"
      - "POST /dealer/replant-claims (file), /provide_info, /withdraw"
      - "read endpoints (incl. inventory-lots)"
  - name: Agronomist
    description: "Dealer agronomist: owns placement recommendations and plot trials"
    identity: opaque
    exclusive_operations:
      - "POST /dealer/recommendations (create), /publish"
      - "POST /dealer/plot-trials (create), /record_planting, /record_harvest, /discard"
    shared_operations:
      - "recommendation withdraw; plot publish; read endpoints (except inventory-lots and commission-statements)"
  - name: Grower
    description: "Farm customer acting on their own account"
    identity: "entity_backed:GrowerAccount"
    exclusive_operations:
      - "POST /dealer/recommendations/{id}/accept"
    shared_operations:
      - "own fields create; own orders create/confirm/cancel/prepay; own order lines create; own returns create; own claims file/provide_info/withdraw; own agreement sign; own reads"
  - name: ClaimsAdjuster
    description: "Independent replant-claim adjudicator; segregation of duties: may file claims but may never review/decide a claim they filed"
    identity: opaque
    exclusive_operations:
      - "POST /dealer/replant-claims/{id}/start_review, /request_info, /approve, /deny"
    shared_operations:
      - "replant-claims file, /provide_info; read endpoints (except inventory-lots and commission-statements)"
