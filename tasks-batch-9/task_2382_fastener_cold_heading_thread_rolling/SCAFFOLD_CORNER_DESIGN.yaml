          Each certificate verb accepts only its own source states: issue twice, reissue an ISSUED
          certificate, revoke a REVOKED one, issue a REVOKED one and reissue a REISSUE_PENDING one all
          answer ERR_INVALID_CERT_STATE, while the single legal REVOKED -> REISSUE_PENDING step lifts
          revision to 2 — and it only becomes reachable once the quality hold left by the revoke is
          released.
