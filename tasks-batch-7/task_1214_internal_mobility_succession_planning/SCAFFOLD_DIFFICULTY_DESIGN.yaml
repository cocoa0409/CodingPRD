# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1214 — Internal Mobility & Succession Planning
# 9 Difficulty Rules x 2 instances each. Logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: bench_strength_weighted_vs_coverage_same_slate
        grounds:
          - calculations.bench_strength
          - entities.CriticalRole.fields.assessment_method
        distinguishing_aspect: |
          Two CriticalRoles hold identical slates (one ACTIVE READY_NOW entry at
          position 1 with readiness_score 90.00); the WEIGHTED role reports
          0.900/4.0951*100 = 21.98 while the COVERAGE role reports 1/5*100 = 20 —
          same data, different entity-domain metric (role bench strength),
          variant selected by CriticalRole.assessment_method.
        test_recipe:
          setup:
            - "Two ACTIVE critical roles (WEIGHTED and COVERAGE), each with the same ACTIVE incumbent and a slate of exactly one ACTIVE READY_NOW successor (position 1) whose development plan is ACTIVE at completion_pct 100 (readiness_score 90.00)"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB1", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC1", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "SUC1", full_name: "Sue Cessor", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Staff Engineer", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { rw: $.data.id, rw_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${rw}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { rw_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${rw}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${rw_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ew: $.data.id } }
            - { call: "PATCH /talent/successors/${ew}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/successors/${ew}/development-plan", payload: { target_readiness: "READY_NOW" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { pw: $.data.id } }
            - { call: "PATCH /talent/development-plans/${pw}", payload: { status: "ACTIVE", completion_pct: 100 }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Platform Lead", department: "ENG", criticality_tier: "TIER_2", assessment_method: "COVERAGE" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${rc}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { rc_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${rc}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${rc_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ec: $.data.id } }
            - { call: "PATCH /talent/successors/${ec}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/successors/${ec}/development-plan", payload: { target_readiness: "READY_NOW" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { pc: $.data.id } }
            - { call: "PATCH /talent/development-plans/${pc}", payload: { status: "ACTIVE", completion_pct: 100 }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "GET /talent/critical-roles/${rw}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { bw: $.data.bench_strength } }
            - { call: "GET /talent/critical-roles/${rc}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { bc: $.data.bench_strength } }
            - { call: "GET /talent/successors/${ew}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { score_w: $.data.readiness_score } }
          assert:
            - "SuccessorEntry.${ew}.readiness_score == 90.00 (0.5*80 + 0.5*100)"
            - "CriticalRole.${rw}.bench_strength == 21.98 (WEIGHTED: 0.900/4.0951*100)"
            - "CriticalRole.${rc}.bench_strength == 20 (COVERAGE: 1/5*100, integer)"
            - "CriticalRole.${rw}.bench_posture == THIN and CriticalRole.${rc}.bench_posture == THIN"

      - name: retention_risk_point_in_time_vs_trend_same_employee
        grounds:
          - calculations.retention_risk_score
          - entities.RetentionAssessment.fields.assessment_method
        distinguishing_aspect: |
          One employee (current rating STRONG, tenure 24 months, not HiPo,
          READY_NOW on an ACTIVE slate) is assessed twice: POINT_IN_TIME uses
          only the current rating (base 20 + 20 = 40.0, MEDIUM) while TREND uses
          the calibration-applied trajectory [STRONG, SOLID, LOW]
          (weighted_rating 59.0 -> base 41 + 20 = 61.0, HIGH) — same employee,
          different entity-domain metric (retention risk), variant selected by
          RetentionAssessment.assessment_method.
        test_recipe:
          setup:
            - "Employee E (hire_date 2024-05-01 -> tenure 24 months at the default clock, current_manager M) has three finalized calibration sessions applying LOW, then SOLID, then STRONG (rating_history [STRONG, SOLID, LOW] latest-first, current rating STRONG), and an ACTIVE READY_NOW slate entry on a role"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB2", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "TM2", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR2", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC2", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E2", full_name: "Eddie Subject", department: "ENG", job_level: 6, hire_date: "2024-05-01", performance_rating: "LOW", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "SRE Lead", department: "ENG", criticality_tier: "TIER_1", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${e}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/calibration-sessions", payload: { name: "CAL-JAN", department_scope: "ENG", scheduled_start: "2026-01-05T09:00:00Z", scheduled_end: "2026-01-05T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s1: $.data.id } }
            - { call: "POST /talent/calibration-sessions/${s1}/start", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s1}/entries", payload: { employee_id: "${e}", proposed_rating: "LOW" }, as: Manager, as_user_id: "${mgr}", captures: { en1: $.data.id } }
            - { call: "POST /talent/calibration-entries/${en1}/ratify", payload: { final_rating: "LOW" }, as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s1}/finalize", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions", payload: { name: "CAL-FEB", department_scope: "ENG", scheduled_start: "2026-02-05T09:00:00Z", scheduled_end: "2026-02-05T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s2: $.data.id } }
            - { call: "POST /talent/calibration-sessions/${s2}/start", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s2}/entries", payload: { employee_id: "${e}", proposed_rating: "SOLID" }, as: Manager, as_user_id: "${mgr}", captures: { en2: $.data.id } }
            - { call: "POST /talent/calibration-entries/${en2}/ratify", payload: { final_rating: "SOLID" }, as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s2}/finalize", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions", payload: { name: "CAL-MAR", department_scope: "ENG", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s3: $.data.id } }
            - { call: "POST /talent/calibration-sessions/${s3}/start", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s3}/entries", payload: { employee_id: "${e}", proposed_rating: "STRONG" }, as: Manager, as_user_id: "${mgr}", captures: { en3: $.data.id } }
            - { call: "POST /talent/calibration-entries/${en3}/ratify", payload: { final_rating: "STRONG" }, as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s3}/finalize", as: TalentManager, as_user_id: "${tm}" }
          trigger:
            - { call: "POST /talent/employees/${e}/retention-assessments", payload: { assessment_method: "POINT_IN_TIME" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { a_pit: $.data.id, pit_score: $.data.risk_score } }
            - { call: "POST /talent/employees/${e}/retention-assessments", payload: { assessment_method: "TREND" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { a_tr: $.data.id, tr_score: $.data.risk_score } }
          assert:
            - "RetentionAssessment.${a_pit}.risk_score == 40.0 and risk_level == MEDIUM (base 100-80=20, +20 READY_NOW)"
            - "RetentionAssessment.${a_tr}.risk_score == 61.0 and risk_level == HIGH (weighted_rating 0.5*80+0.3*50+0.2*20=59.0 -> base 41, +20 READY_NOW)"
            - "RetentionAssessment.${a_pit}.trigger_source == MANUAL"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: retention_risk_multifactor_clamp_at_100
        grounds:
          - calculations.retention_risk_score
          - calculations.risk_level
        distinguishing_aspect: |
          Mode (a): the POINT_IN_TIME formula combines 4 inputs with non-linear
          interaction — a conditional tenure branch (+15 when tenure < 24), a
          conditional HiPo branch (-10), a conditional READY_NOW-slate branch
          (+20) — and a min/max clamp: raw 80+15-10+20 = 105 is clamped to
          exactly 100.0, and the CRITICAL band engages at >= 85.
        test_recipe:
          setup:
            - "Employee E2 (rating LOW, hire_date 2025-06-01 -> tenure 11 months at default clock) is an enrolled HiPo member (is_high_potential true) and an ACTIVE READY_NOW successor"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB3", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "TM3", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR3", full_name: "Mary Anager", department: "SALES", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC3", full_name: "Ian Cumbent", department: "SALES", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E3", full_name: "Erin Risk", department: "SALES", job_level: 5, hire_date: "2025-06-01", performance_rating: "LOW", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/hipo-cycles", payload: { cycle_name: "2026-C1", capacity: 5 }, as: HRAdmin, captures: { cy: $.data.id } }
            - { call: "POST /talent/hipo-cycles/${cy}/nominations", payload: { employee_id: "${e}" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id } }
            - { call: "POST /talent/hipo-nominations/${nom}/endorse", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/hipo-nominations/${nom}/enroll", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Sales Director", department: "SALES", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${e}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/employees/${e}/retention-assessments", payload: { assessment_method: "POINT_IN_TIME" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { a: $.data.id } }
            - { call: "GET /talent/employees/${e}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { hipo_flag: $.data.is_high_potential } }
          assert:
            - "Employee.${e}.is_high_potential == true"
            - "RetentionAssessment.${a}.risk_score == 100.0 (raw 105 clamped to the 100 ceiling)"
            - "RetentionAssessment.${a}.risk_level == CRITICAL (>= 85)"

      - name: bench_weighted_per_entry_rounding_order_pinned
        grounds:
          - calculations.bench_strength
        distinguishing_aspect: |
          Mode (b): the WEIGHTED formula pins round-per-contribution-to-3dp THEN
          sum THEN normalize-to-2dp. Two READY_NOW entries (position 3, score
          25.00 -> raw 0.20250; position 4, score 20.00 -> raw 0.14580) yield
          0.203 + 0.146 = 0.349 -> 8.52 under the pinned order, whereas
          sum-raw-then-round yields 0.3483 -> 8.51 — the one-cent difference is
          the test oracle.
        test_recipe:
          setup:
            - "WEIGHTED role with two ACTIVE READY_NOW successors: A at slate_position 3 with plan completion 30 (score 25.00), B at slate_position 4 with plan completion 20 (score 20.00)"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB4", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC4", full_name: "Ian Cumbent", department: "OPS", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "SA4", full_name: "Sara Aye", department: "OPS", job_level: 5, hire_date: "2024-05-01", performance_rating: "LOW" }, as: HRAdmin, captures: { sa: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "SB4", full_name: "Sam Bee", department: "OPS", job_level: 5, hire_date: "2024-05-01", performance_rating: "LOW" }, as: HRAdmin, captures: { sb: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Ops Lead", department: "OPS", criticality_tier: "TIER_3", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sa}", readiness_rating: "READY_NOW", slate_position: 3, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ea: $.data.id } }
            - { call: "PATCH /talent/successors/${ea}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v3: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${sb}", readiness_rating: "READY_NOW", slate_position: 4, expected_critical_role_version: "${r_v3}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { eb: $.data.id } }
            - { call: "PATCH /talent/successors/${eb}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/successors/${ea}/development-plan", payload: { target_readiness: "READY_NOW" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { pa: $.data.id } }
            - { call: "PATCH /talent/development-plans/${pa}", payload: { status: "ACTIVE", completion_pct: 30 }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/successors/${eb}/development-plan", payload: { target_readiness: "READY_NOW" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { pb: $.data.id } }
            - { call: "PATCH /talent/development-plans/${pb}", payload: { status: "ACTIVE", completion_pct: 20 }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { bench: $.data.bench_strength } }
            - { call: "GET /talent/successors/${ea}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { score_a: $.data.readiness_score } }
          assert:
            - "SuccessorEntry.${ea}.readiness_score == 25.00 (0.5*20 + 0.5*30)"
            - "CriticalRole.${r}.bench_strength == 8.52 — pinned order round(0.20250,3)=0.203 + round(0.14580,3)=0.146 -> 0.349/4.0951*100 = 8.52; sum-first would give 8.51"
            - "CriticalRole.${r}.bench_posture == THIN"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: calibration_entry_challenge_revise_loop
        grounds:
          - state_machines.CalibrationEntry.PROPOSED_to_CHALLENGED
          - state_machines.CalibrationEntry.CHALLENGED_to_PROPOSED
          - state_machines.CalibrationEntry.CHALLENGED_to_RATIFIED
        distinguishing_aspect: |
          CalibrationEntry runs a revision CYCLE (PROPOSED -> CHALLENGED ->
          PROPOSED -> CHALLENGED -> RATIFIED): the entry loops back to PROPOSED
          on revise, challenge_count accumulates to 2, and the terminal
          calibrated_rating equals the ratify input — a cyclic machine on
          CalibrationEntry, distinct from the CriticalRole cycle.
        test_recipe:
          setup:
            - "IN_PROGRESS calibration session with one PROPOSED entry (proposed_rating SOLID) for employee E5, proposed by E5's manager M5"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "TM5", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR5", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E5", full_name: "Evan Subject", department: "ENG", job_level: 5, hire_date: "2023-02-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/calibration-sessions", payload: { name: "CAL-APR", department_scope: "ENG", scheduled_start: "2026-04-06T09:00:00Z", scheduled_end: "2026-04-06T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s: $.data.id } }
            - { call: "POST /talent/calibration-sessions/${s}/start", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s}/entries", payload: { employee_id: "${e}", proposed_rating: "SOLID" }, as: Manager, as_user_id: "${mgr}", captures: { en: $.data.id } }
          trigger:
            - { call: "POST /talent/calibration-entries/${en}/challenge", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-entries/${en}/revise", payload: { proposed_rating: "STRONG" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /talent/calibration-entries/${en}/challenge", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-entries/${en}/ratify", payload: { final_rating: "STRONG" }, as: TalentManager, as_user_id: "${tm}", captures: { st: $.data.status } }
          assert:
            - "CalibrationEntry.${en}.status == RATIFIED after the loop"
            - "CalibrationEntry.${en}.challenge_count == 2"
            - "CalibrationEntry.${en}.proposed_rating == STRONG (revise overwrote SOLID)"
            - "CalibrationEntry.${en}.calibrated_rating == STRONG"

      - name: critical_role_active_vacant_active_refill_cycle
        grounds:
          - state_machines.CriticalRole.ACTIVE_to_VACANT
          - state_machines.CriticalRole.VACANT_to_ACTIVE
          - state_machines.Employee.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          CriticalRole cycles ACTIVE -> VACANT -> ACTIVE: incumbent termination
          vacates the role and auto-opens a vacancy; filling from the slate
          reactivates the role with the successor as the new incumbent — a
          cyclic machine on CriticalRole, distinct from the CalibrationEntry
          cycle.
        test_recipe:
          setup:
            - "ACTIVE role (WEIGHTED, TIER_1, FIN) with incumbent INC6 and one ACTIVE READY_NOW successor S6 (position 1, no plan -> readiness_score 40.00)"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB6", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC6", full_name: "Ian Cumbent", department: "FIN", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S6", full_name: "Sue Cessor", department: "FIN", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Controller", department: "FIN", criticality_tier: "TIER_1", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { mid_status: $.data.status } }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac}/fill-from-slate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { v_end: $.data.status } }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { end_status: $.data.status, end_inc: $.data.incumbent_employee_id, end_bench: $.data.bench_strength } }
            - { call: "GET /talent/successors/${es}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { e_end: $.data.status } }
          assert:
            - "after terminate: CriticalRole.${r}.status == VACANT and a Vacancy with status OPEN was auto-created"
            - "after fill-from-slate: Vacancy.${vac}.status == FILLED and fill_source == SUCCESSION_SLATE and filled_by_employee_id == ${suc}"
            - "CriticalRole.${r}.status == ACTIVE again with incumbent_employee_id == ${suc} (cycle closed)"
            - "SuccessorEntry.${es}.status == PROMOTED; CriticalRole.${r}.bench_strength == 0.00 and bench_posture == EMPTY (slate emptied by the promotion)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: termination_cascade_removes_entry_thins_bench_spawns_assessment
        grounds:
          - state_machines.Employee.ACTIVE_to_TERMINATED
          - calculations.bench_posture
          - entities.CriticalRole.fields.posture_alert
        distinguishing_aspect: |
          Depth-4 spine triggered by POST /talent/employees/{id}/terminate:
          termination (L1) removes the employee's ACTIVE slate entry (L2),
          that removal recomputes the COVERAGE bench 2/5=40 ADEQUATE -> 1/5=20
          THIN and sets posture_alert (L3), and the posture degradation
          auto-creates a BENCH_THIN_AUTO RetentionAssessment for the remaining
          ACTIVE READY_NOW successor (L4). Each link is caused by the previous
          link, and the trigger differs from the calibration-finalize cascade.
        test_recipe:
          setup:
            - "COVERAGE role R4 with incumbent INC7 and two ACTIVE READY_NOW entries: E_TERM (position 1) and E_KEEP (position 2); bench 2/5 = 40, posture ADEQUATE, posture_alert false"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB7", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC7", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "ETERM7", full_name: "Ed Term", department: "ENG", job_level: 6, hire_date: "2024-05-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { e_term: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "EKEEP7", full_name: "Kay Keep", department: "ENG", job_level: 6, hire_date: "2024-05-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { e_keep: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "QA Lead", department: "ENG", criticality_tier: "TIER_2", assessment_method: "COVERAGE" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${e_term}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { et: $.data.id } }
            - { call: "PATCH /talent/successors/${et}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v3: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${e_keep}", readiness_rating: "READY_NOW", slate_position: 2, expected_critical_role_version: "${r_v3}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ek: $.data.id } }
            - { call: "PATCH /talent/successors/${ek}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/employees/${e_term}/terminate", as: HRAdmin }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { bench: $.data.bench_strength, posture: $.data.bench_posture, alert: $.data.posture_alert } }
            - { call: "GET /talent/successors/${et}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { et_status: $.data.status } }
            - { call: "GET /talent/retention-assessments", payload: { employee_id: "${e_keep}", trigger_source: "BENCH_THIN_AUTO" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { ra_src: "$.data[0].trigger_source", ra_status: "$.data[0].status", ra_score: "$.data[0].risk_score" } }
          assert:
            - "SuccessorEntry.${et}.status == REMOVED (L2 caused by the termination)"
            - "CriticalRole.${r}.bench_strength == 20 and bench_posture == THIN (L3 caused by the removal)"
            - "CriticalRole.${r}.posture_alert == true (degradation ADEQUATE -> THIN)"
            - "exactly one RetentionAssessment for ${e_keep} with trigger_source == BENCH_THIN_AUTO and status == OPEN (L4 caused by the posture flip); its POINT_IN_TIME risk_score == 40.0 (STRONG base 20 + 20 READY_NOW, tenure 24)"

      - name: calibration_finalize_cascades_rating_to_bench
        grounds:
          - state_machines.CalibrationSession.IN_PROGRESS_to_FINALIZED
          - calculations.readiness_score
          - calculations.bench_strength
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /talent/calibration-sessions/{id}/finalize:
          finalize applies the RATIFIED entry (L1), the application rewrites the
          employee's performance_rating SOLID -> EXCEPTIONAL and appends
          rating_history (L2), the rating change recomputes the employee's
          ACTIVE entry readiness_score 65.00 -> 90.00 (L3), and the score change
          recomputes the role's WEIGHTED bench 15.87 -> 21.98 (L4). Trigger
          differs from the termination cascade.
        test_recipe:
          setup:
            - "WEIGHTED role with incumbent INC8 and one ACTIVE READY_NOW entry for E8 (rating SOLID, plan ACTIVE at completion_pct 80 -> readiness_score 65.00, bench 0.650/4.0951*100 = 15.87); an IN_PROGRESS session holds a RATIFIED entry for E8 with final_rating EXCEPTIONAL"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB8", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "TM8", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR8", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC8", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "E8", full_name: "Erin Subject", department: "ENG", job_level: 6, hire_date: "2024-05-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Dev Lead", department: "ENG", criticality_tier: "TIER_1", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${e}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/successors/${es}/development-plan", payload: { target_readiness: "READY_NOW" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p: $.data.id } }
            - { call: "PATCH /talent/development-plans/${p}", payload: { status: "ACTIVE", completion_pct: 80 }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/calibration-sessions", payload: { name: "CAL-MAY", department_scope: "ENG", scheduled_start: "2026-04-07T09:00:00Z", scheduled_end: "2026-04-07T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s: $.data.id } }
            - { call: "POST /talent/calibration-sessions/${s}/start", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/calibration-sessions/${s}/entries", payload: { employee_id: "${e}", proposed_rating: "EXCEPTIONAL" }, as: Manager, as_user_id: "${mgr}", captures: { en: $.data.id } }
            - { call: "POST /talent/calibration-entries/${en}/ratify", payload: { final_rating: "EXCEPTIONAL" }, as: TalentManager, as_user_id: "${tm}" }
          trigger:
            - { call: "POST /talent/calibration-sessions/${s}/finalize", as: TalentManager, as_user_id: "${tm}" }
            - { call: "GET /talent/employees/${e}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { rating: $.data.performance_rating } }
            - { call: "GET /talent/successors/${es}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { score: $.data.readiness_score } }
            - { call: "GET /talent/critical-roles/${r}", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { bench: $.data.bench_strength } }
            - { call: "GET /talent/calibration-entries/${en}", as: TalentManager, as_user_id: "${tm}", captures: { en_status: $.data.status } }
          assert:
            - "CalibrationEntry.${en}.status == APPLIED (L1)"
            - "Employee.${e}.performance_rating == EXCEPTIONAL and rating_history has exactly 1 entry with rating EXCEPTIONAL (L2)"
            - "SuccessorEntry.${es}.readiness_score == 90.00 (0.5*100 + 0.5*80) (L3)"
            - "CriticalRole.${r}.bench_strength == 21.98 (0.900/4.0951*100) (L4)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_posting_and_tenure_state_beats_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_POSTING_INVALID_STATE]
          - errors[ERR_TENURE_REQUIREMENT]
        distinguishing_aspect: |
          Category pair (state, business_constraint): the applicant ALSO fails
          the tenure check (11 months < 12), but the posting is CLOSED, so the
          state error ERR_POSTING_INVALID_STATE (priority 5) is returned, never
          ERR_TENURE_REQUIREMENT (priority 14).
        test_recipe:
          setup:
            - "Vacancy's posting was published and then closed; applicant E_LOW has hire_date 2025-06-01 (tenure 11 months < min_tenure_months 12 at the default clock)"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB9", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC9", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "ELOW9", full_name: "Erin Low", department: "ENG", job_level: 5, hire_date: "2025-06-01", performance_rating: "SOLID" }, as: HRAdmin, captures: { e_low: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Infra Lead", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Infra Lead", planned_open_date: "2026-05-04", planned_close_date: "2026-05-29", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p: $.data.id } }
            - { call: "POST /talent/postings/${p}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/postings/${p}/close", as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/postings/${p}/applications", as: Employee, as_user_id: "${e_low}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_POSTING_INVALID_STATE (state beats business_constraint; the tenure failure is masked)"
            - "GET /talent/applications?posting_id=${p} returns an empty list"

      - name: foreign_manager_after_deadline_referential_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_NOT_REPORTING_MANAGER]
          - errors[ERR_CONSENT_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair (business_referential, business_temporal): the hold is
          attempted BOTH after the consent deadline AND by an employee who is
          not the applicant's manager; the referential error
          ERR_NOT_REPORTING_MANAGER (priority 8) is returned, never
          ERR_CONSENT_WINDOW_CLOSED (priority 11).
        test_recipe:
          setup:
            - "Application of E_AP (manager M10) is PENDING_MANAGER_CONSENT, submitted at the default clock 2026-05-01T00:00:00Z (consent_deadline 2026-05-15T00:00:00Z); logical clock advanced to 2026-05-20T00:00:00Z (window expired); O10 is another manager who does not manage E_AP"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB10", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC10", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR10", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "OTH10", full_name: "Otto Other", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { other: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "EAP10", full_name: "Erin Applicant", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e_ap: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Sec Lead", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Sec Lead", planned_open_date: "2026-05-04", planned_close_date: "2026-05-29", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p: $.data.id } }
            - { call: "POST /talent/postings/${p}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/postings/${p}/applications", as: Employee, as_user_id: "${e_ap}", captures: { app: $.data.id } }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: HRAdmin }
          trigger:
            - { call: "POST /talent/applications/${app}/hold", payload: { hold_reason: "CRITICAL_PROJECT" }, as: Manager, as_user_id: "${other}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_REPORTING_MANAGER (referential beats temporal; the expired window is masked)"
            - "PostingApplication.${app}.status remains PENDING_MANAGER_CONSENT"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: hipo_enrollment_capacity_boundary
        grounds:
          - validations[priority=21]
          - entities.HiPoProgramCycle.fields.enrolled_count
        distinguishing_aspect: |
          Metric: seat count on the enroll endpoint. With capacity 1 the first
          enroll (enrolled_count 0 < 1) succeeds and the second
          (enrolled_count 1 >= 1) is rejected — the boundary is inclusive:
          exactly-at-capacity rejects.
        test_recipe:
          setup:
            - "HiPo cycle with capacity 1; nominees N1 and N2 (both managed by M11), both endorsed; N1 already enrolled (enrolled_count == 1)"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB11", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "TM11", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR11", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "N111", full_name: "Nia One", department: "ENG", job_level: 5, hire_date: "2023-01-15", performance_rating: "STRONG", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { n1: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "N211", full_name: "Noah Two", department: "ENG", job_level: 5, hire_date: "2023-01-15", performance_rating: "STRONG", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { n2: $.data.id } }
            - { call: "POST /talent/hipo-cycles", payload: { cycle_name: "2026-C9", capacity: 1 }, as: HRAdmin, captures: { cy: $.data.id } }
            - { call: "POST /talent/hipo-cycles/${cy}/nominations", payload: { employee_id: "${n1}" }, as: Manager, as_user_id: "${mgr}", captures: { nom1: $.data.id } }
            - { call: "POST /talent/hipo-nominations/${nom1}/endorse", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/hipo-nominations/${nom1}/enroll", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/hipo-cycles/${cy}/nominations", payload: { employee_id: "${n2}" }, as: Manager, as_user_id: "${mgr}", captures: { nom2: $.data.id } }
            - { call: "POST /talent/hipo-nominations/${nom2}/endorse", as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/hipo-nominations/${nom2}/enroll", as: TalentManager, as_user_id: "${tm}", captures: { err: $.data.error_id } }
            - { call: "GET /talent/hipo-cycles/${cy}", as: TalentManager, as_user_id: "${tm}", captures: { cnt: $.data.enrolled_count } }
          assert:
            - "first enroll succeeded: HiPoNomination.${nom1}.status == ACTIVE and cycle.enrolled_count == 1"
            - "error_id == ERR_PROGRAM_AT_CAPACITY for the second enroll at enrolled_count == capacity == 1"
            - "HiPoNomination.${nom2}.status remains ENDORSED"

      - name: consent_deadline_exact_instant_rejected
        grounds:
          - calculations.consent_deadline_arithmetic
          - validations[priority=11]
        distinguishing_aspect: |
          Metric: timestamp on the consent endpoint. The window is strict:
          consent at deadline - 1 second (2026-05-14T23:59:59Z) succeeds while
          consent at exactly the deadline (2026-05-15T00:00:00Z) is rejected
          with ERR_CONSENT_WINDOW_CLOSED — a one-second difference flips the
          outcome on the same rule.
        test_recipe:
          setup:
            - "Two applications (E_A and E_B, both managed by M12) on the same posting, both submitted at the default clock 2026-05-01T00:00:00Z, consent_deadline 2026-05-15T00:00:00Z"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB12", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC12", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR12", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "EA12", full_name: "Erin Aye", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e_a: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "EB12", full_name: "Erin Bee", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e_b: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Net Lead", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Net Lead", planned_open_date: "2026-05-04", planned_close_date: "2026-05-29", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p: $.data.id } }
            - { call: "POST /talent/postings/${p}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/postings/${p}/applications", as: Employee, as_user_id: "${e_a}", captures: { app_a: $.data.id } }
            - { call: "POST /talent/postings/${p}/applications", as: Employee, as_user_id: "${e_b}", captures: { app_b: $.data.id } }
          trigger:
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-05-14T23:59:59Z" }, as: HRAdmin }
            - { call: "POST /talent/applications/${app_a}/consent", as: Manager, as_user_id: "${mgr}", captures: { st_a: $.data.status } }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /talent/applications/${app_b}/consent", as: Manager, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
          assert:
            - "PostingApplication.${app_a}.status == CONSENT_GRANTED (one second before the deadline)"
            - "error_id == ERR_CONSENT_WINDOW_CLOSED for ${app_b} at exactly the deadline (strict less-than)"
            - "PostingApplication.${app_b}.status remains PENDING_MANAGER_CONSENT"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: successor_activation_blocked_until_role_active
        grounds:
          - state_machines.SuccessorEntry.DRAFT_to_ACTIVE
          - validations[priority=33]
        distinguishing_aspect: |
          Entity pair SuccessorEntry -> CriticalRole: a DRAFT entry on a
          PROPOSED role cannot activate (ERR_ROLE_NOT_ACTIVE); once the role
          itself is activated, the same PATCH succeeds — the entry's transition
          set depends on the role's state.
        test_recipe:
          setup:
            - "PROPOSED role with one DRAFT successor entry (role creation leaves version 1; slate add is allowed in PROPOSED)"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB13", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC13", full_name: "Ian Cumbent", department: "OPS", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S13", full_name: "Sue Cessor", department: "OPS", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Facilities Lead", department: "OPS", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_1_2", slate_position: 1, expected_critical_role_version: "${r_v}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
          trigger:
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { st: $.data.status } }
          assert:
            - "first PATCH: error_id == ERR_ROLE_NOT_ACTIVE while CriticalRole.${r}.status == PROPOSED"
            - "after role activation the identical PATCH succeeds: SuccessorEntry.${es}.status == ACTIVE"

      - name: offer_extension_blocked_after_vacancy_filled
        grounds:
          - state_machines.PostingApplication.INTERVIEWING_to_OFFER_EXTENDED
          - errors[ERR_VACANCY_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair PostingApplication -> Vacancy (via the posting): with the
          posting still OPEN, an INTERVIEWING application cannot advance to
          OFFER_EXTENDED once the vacancy has been FILLED from the succession
          slate — the application's transition set depends on the vacancy's
          state, not on the posting's.
        test_recipe:
          setup:
            - "Vacancy (from incumbent termination) has an OPEN posting; applicant A14 reached INTERVIEWING; the role's slate holds one ACTIVE READY_NOW successor S14"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB14", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC14", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR14", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "S14", full_name: "Sue Cessor", department: "ENG", job_level: 6, hire_date: "2022-07-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { suc: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "A14", full_name: "Ann Applicant", department: "ENG", job_level: 5, hire_date: "2024-05-01", performance_rating: "SOLID", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { e_ap: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Data Lead", department: "ENG", criticality_tier: "TIER_1", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r_v2: $.data.version } }
            - { call: "POST /talent/critical-roles/${r}/successors", payload: { employee_id: "${suc}", readiness_rating: "READY_NOW", slate_position: 1, expected_critical_role_version: "${r_v2}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { es: $.data.id } }
            - { call: "PATCH /talent/successors/${es}", payload: { status: "ACTIVE" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Data Lead", planned_open_date: "2026-05-04", planned_close_date: "2026-05-29", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p: $.data.id } }
            - { call: "POST /talent/postings/${p}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/postings/${p}/applications", as: Employee, as_user_id: "${e_ap}", captures: { app: $.data.id } }
            - { call: "POST /talent/applications/${app}/consent", as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /talent/applications/${app}/advance", payload: { target_state: "INTERVIEWING" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/vacancies/${vac}/fill-from-slate", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vst: $.data.status } }
            - { call: "POST /talent/applications/${app}/advance", payload: { target_state: "OFFER_EXTENDED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
          assert:
            - "Vacancy.${vac}.status == FILLED after the slate fill (posting stays OPEN — slate fill does not touch the posting channel)"
            - "error_id == ERR_VACANCY_NOT_OPEN on the OFFER_EXTENDED advance"
            - "PostingApplication.${app}.status remains INTERVIEWING"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: session_calendar_half_open_adjacency
        grounds:
          - calculations.session_window_overlap
          - validations[priority=23]
        distinguishing_aspect: |
          Resource: the department calibration calendar; interval semantics:
          HALF-OPEN [scheduled_start, scheduled_end). An overlapping session
          (11:00-13:00 vs existing 09:00-12:00) is rejected, while a
          zero-gap adjacent session (starting exactly at 12:00:00, the
          existing end) is allowed.
        test_recipe:
          setup:
            - "One SCHEDULED session for department SALES, window 2026-06-01T09:00:00Z - 2026-06-01T12:00:00Z"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "TM15", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/calibration-sessions", payload: { name: "SALES-Q2-A", department_scope: "SALES", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s_a: $.data.id } }
          trigger:
            - { call: "POST /talent/calibration-sessions", payload: { name: "SALES-Q2-B", department_scope: "SALES", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T13:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { err: $.data.error_id } }
            - { call: "POST /talent/calibration-sessions", payload: { name: "SALES-Q2-C", department_scope: "SALES", scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T15:00:00Z" }, as: TalentManager, as_user_id: "${tm}", captures: { s_c: $.data.id } }
          assert:
            - "error_id == ERR_SESSION_WINDOW_CONFLICT for the 11:00-13:00 overlap"
            - "the 12:00-15:00 session is created (201) with a distinct id — half-open adjacency is allowed"
            - "GET /talent/calibration-sessions?department_scope=SALES returns exactly 2 sessions"

      - name: posting_window_closed_interval_adjacency_conflicts
        grounds:
          - calculations.posting_window_overlap
          - validations[priority=24]
        distinguishing_aspect: |
          Resource: the vacancy's posting channel; interval semantics: CLOSED
          date interval [planned_open_date, planned_close_date]. A posting
          whose open date EQUALS the existing posting's close date CONFLICTS
          (2026-05-15 vs [2026-05-04, 2026-05-15]) — the opposite treatment
          from the half-open session calendar — while a posting starting the
          next day (2026-05-16) is allowed.
        test_recipe:
          setup:
            - "Vacancy V16 (auto-created by incumbent termination) has one OPEN posting P_A with window [2026-05-04, 2026-05-15]"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB16", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "INC16", full_name: "Ian Cumbent", department: "ENG", job_level: 8, hire_date: "2019-03-01", performance_rating: "STRONG" }, as: HRAdmin, captures: { inc: $.data.id } }
            - { call: "POST /talent/critical-roles", payload: { role_title: "Cloud Lead", department: "ENG", criticality_tier: "TIER_2", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id } }
            - { call: "POST /talent/critical-roles/${r}/activate", payload: { incumbent_employee_id: "${inc}" }, as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/employees/${inc}/terminate", as: HRAdmin }
            - { call: "GET /talent/vacancies", payload: { critical_role_id: "${r}" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { vac: "$.data[0].id" } }
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Cloud Lead A", planned_open_date: "2026-05-04", planned_close_date: "2026-05-15" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p_a: $.data.id } }
            - { call: "POST /talent/postings/${p_a}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}" }
          trigger:
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Cloud Lead B", planned_open_date: "2026-05-15", planned_close_date: "2026-05-29" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p_b: $.data.id } }
            - { call: "POST /talent/postings/${p_b}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { err: $.data.error_id } }
            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Cloud Lead C", planned_open_date: "2026-05-16", planned_close_date: "2026-05-29" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p_c: $.data.id } }
            - { call: "POST /talent/postings/${p_c}/publish", as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { st_c: $.data.status } }
          assert:
            - "error_id == ERR_POSTING_WINDOW_CONFLICT for P_B (shared boundary date 2026-05-15 conflicts under closed-interval semantics)"
            - "InternalPosting.${p_b}.status remains DRAFT"
            - "InternalPosting.${p_c}.status == OPEN (2026-05-16 is fully disjoint)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: slate_supersede_preserves_cardinality
        grounds:
          - concurrency_rules[slate-supersede-stale-role]
          - state_machines.SuccessorEntry.DRAFT_to_REMOVED
          - validations[priority=18]
        distinguishing_aspect: |
          Conserved quantity: the role's non-terminal slate cardinality
          |{e: e.critical_role_id == R AND e.status in {DRAFT, ACTIVE,
          SUSPENDED}}|. A 6th add without supersede is rejected
          (ERR_SLATE_FULL at SLATE_MAX = 5); the same add with
          supersede_entry_id atomically REMOVES the old entry and creates the
          new one, leaving the cardinality at exactly 5 and the new entry
          inheriting slate_position 3.
        test_recipe:
          setup:
            - "ACTIVE role with a full slate: 5 DRAFT entries (G1..G5) at positions 1..5"
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB17", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
