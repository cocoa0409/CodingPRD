scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pci_condition_vs_preventive_diverge
        grounds:
          - calculations.pci_score
          - entities.Inspection.fields.computed_pci
          - entities.Asset.fields.condition_state
        distinguishing_aspect: "For the same ROAD asset (installed 2020-03-01, clock 2026-06-01) and identical raw_distress_index 20, the CONDITION variant yields computed_pci 71 while the PREVENTIVE variant yields 76 (halved age penalty) — a dual-variant on the Inspection/Asset condition domain, distinct from the WorkOrder capitalization dual-variant."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "One ROAD Asset installed 2020-03-01 (age 6 years)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-1", location_desc: "Main St 100", install_date: "2020-03-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /inspections"
              payload: { asset_id: "${asset_id}", inspection_type: "CONDITION", raw_distress_index: 20, scheduled_window_start: "2026-06-01T08:00:00Z", scheduled_window_end: "2026-06-01T10:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_c_id: $.data.id, insp_c_pci: $.data.computed_pci }
          trigger:
            - call: "POST /inspections"
              payload: { asset_id: "${asset_id}", inspection_type: "PREVENTIVE", raw_distress_index: 20, scheduled_window_start: "2026-06-01T08:00:00Z", scheduled_window_end: "2026-06-01T10:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_p_id: $.data.id, insp_p_pci: $.data.computed_pci }
          assert:
            - "Inspection.${insp_c_id}.computed_pci == 71"
            - "Inspection.${insp_p_id}.computed_pci == 76"
            - "Inspection.${insp_p_id}.computed_pci - Inspection.${insp_c_id}.computed_pci == 5"

      - name: capitalization_capital_vs_maintenance_ledger
        grounds:
          - calculations.capitalization_determination
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - entities.Asset.fields.capital_cost_to_date_cents
          - entities.Asset.fields.maintenance_cost_to_date_cents
        distinguishing_aspect: "Two work orders on one asset with an identical 30000-cent actual cost post to DIFFERENT ledgers: the CAPITAL order to capital_cost_to_date_cents and the below-threshold MAINTENANCE order to maintenance_cost_to_date_cents — a dual-variant on the WorkOrder/Asset accounting domain, distinct from the Inspection PCI dual-variant."
        test_recipe:
          setup:
            - "Clock 2026-06-01; ROAD asset (replacement_value 200000); one crew at 6000 cents/hr"
            - "WO_A work_type CAPITAL completed with one 5-hour dispatch (cost 30000)"
            - "WO_B work_type MAINTENANCE completed with one 5-hour dispatch (cost 30000, below 500000 threshold)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-2", location_desc: "2nd Ave", install_date: "2024-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Paving A", crew_type: "PAVING", hourly_rate_cents: 6000 }
              as: Supervisor
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "CAPITAL", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_a_id: $.data.id }
            - call: "POST /work-orders/${wo_a_id}/schedule"
              payload: { scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T16:00:00Z" }
              as: Dispatcher
            - call: "GET /crews/${crew_id}"
              payload: {}
              as: Dispatcher
              captures: { crew_v_a: $.data.version }
            - call: "POST /dispatches"
              payload: { work_order_id: "${wo_a_id}", crew_id: "${crew_id}", window_start: "2026-06-02T08:00:00Z", window_end: "2026-06-02T13:00:00Z", labor_hours: 5, expected_crew_version: "${crew_v_a}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_a_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_a_id}/start"
              payload: {}
              as: CrewLead
            - call: "POST /work-orders/${wo_a_id}/complete"
              payload: {}
              as: CrewLead
              captures: { wo_a_cap: $.data.capitalized, wo_a_cost: $.data.actual_cost_cents }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_b_id: $.data.id }
            - call: "POST /work-orders/${wo_b_id}/schedule"
              payload: { scheduled_start: "2026-06-03T08:00:00Z", scheduled_end: "2026-06-03T16:00:00Z" }
              as: Dispatcher
            - call: "GET /crews/${crew_id}"
              payload: {}
              as: Dispatcher
              captures: { crew_v_b: $.data.version }
            - call: "POST /dispatches"
              payload: { work_order_id: "${wo_b_id}", crew_id: "${crew_id}", window_start: "2026-06-03T08:00:00Z", window_end: "2026-06-03T13:00:00Z", labor_hours: 5, expected_crew_version: "${crew_v_b}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_b_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_b_id}/start"
              payload: {}
              as: CrewLead
          trigger:
            - call: "POST /work-orders/${wo_b_id}/complete"
              payload: {}
              as: CrewLead
              captures: { wo_b_cap: $.data.capitalized, wo_b_cost: $.data.actual_cost_cents }
          assert:
            - "WorkOrder.${wo_a_id}.capitalized == true"
            - "WorkOrder.${wo_b_id}.capitalized == false"
            - "WorkOrder.${wo_a_id}.actual_cost_cents == 30000"
            - "WorkOrder.${wo_b_id}.actual_cost_cents == 30000"
            - "Asset.${asset_id}.capital_cost_to_date_cents == 30000"
            - "Asset.${asset_id}.maintenance_cost_to_date_cents == 30000"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: labor_overtime_tiered_min_max
        grounds:
          - calculations.labor_cost
          - entities.Dispatch.fields.labor_cost_cents
          - entities.Crew.fields.hourly_rate_cents
        distinguishing_aspect: "labor_hours 10 at rate 6000 resolves via min/max split to 8 regular (48000) + 2 overtime at 1.5x (18000) = 66000 — a >=3-input non-linear formula (mode a), a different combinatorial axis than the material per-line rounding-order instance (mode b)."
        test_recipe:
          setup:
            - "Clock 2026-06-01; crew at 6000 cents/hr; a SCHEDULED work order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-3", location_desc: "Elm St", install_date: "2024-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Paving B", crew_type: "PAVING", hourly_rate_cents: 6000 }
              as: Supervisor
              captures: { crew_id: $.data.id, crew_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-06-02T06:00:00Z", scheduled_end: "2026-06-02T20:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /dispatches"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew_id}", window_start: "2026-06-02T08:00:00Z", window_end: "2026-06-02T18:00:00Z", labor_hours: 10, expected_crew_version: "${crew_v0}" }
              as: Dispatcher
              captures: { d_id: $.data.id, d_cost: $.data.labor_cost_cents }
          assert:
            - "Dispatch.${d_id}.labor_cost_cents == 66000"

      - name: material_round_per_line_then_sum
        grounds:
          - calculations.work_order_cost_rollup
          - entities.WorkOrder.fields.material_cost_cents
          - state_machines.MaterialReservation.RESERVED_to_CONSUMED
        distinguishing_aspect: "Two consumed reservations of 2.5 and 1.5 units at unit_cost 1233 round per line (3083 + 1850) to material_cost_cents 4933, NOT the sum-then-round value 4932 — the rounding order is pinned (mode b), a different combinatorial axis than the labor tiered min/max (mode a)."
        test_recipe:
          setup:
            - "Clock 2026-06-01; asphalt item unit_cost 1233, on_hand 100; a work order taken to IN_PROGRESS with two reservations"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-4", location_desc: "Oak St", install_date: "2024-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /yards"
              payload: { name: "Yard 1", location_desc: "Central yard" }
              as: Supervisor
              captures: { yard_id: $.data.id }
            - call: "POST /material-items"
              payload: { material_type: "ASPHALT_TON", yard_id: "${yard_id}", unit: "TON", on_hand_qty: 100, unit_cost_cents: 1233 }
              as: Supervisor
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /crews"
              payload: { name: "Paving C", crew_type: "PAVING", hourly_rate_cents: 6000 }
              as: Supervisor
              captures: { crew_id: $.data.id, crew_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-06-02T06:00:00Z", scheduled_end: "2026-06-02T20:00:00Z" }
              as: Dispatcher
            - call: "POST /material-reservations"
              payload: { work_order_id: "${wo_id}", material_item_id: "${item_id}", qty: 2.5, expected_material_item_version: "${item_v0}" }
              as: Dispatcher
            - call: "GET /material-items/${item_id}"
              payload: {}
              as: Dispatcher
              captures: { item_v1: $.data.version }
            - call: "POST /material-reservations"
              payload: { work_order_id: "${wo_id}", material_item_id: "${item_id}", qty: 1.5, expected_material_item_version: "${item_v1}" }
              as: Dispatcher
            - call: "GET /crews/${crew_id}"
              payload: {}
              as: Dispatcher
              captures: { crew_v_a: $.data.version }
            - call: "POST /dispatches"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew_id}", window_start: "2026-06-02T08:00:00Z", window_end: "2026-06-02T10:00:00Z", labor_hours: 1, expected_crew_version: "${crew_v_a}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: CrewLead
              captures: { wo_mat: $.data.material_cost_cents }
          assert:
            - "WorkOrder.${wo_id}.material_cost_cents == 4933"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: workorder_hold_resume_cycle
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_ON_HOLD
          - state_machines.WorkOrder.ON_HOLD_to_IN_PROGRESS
        distinguishing_aspect: "WorkOrder loops IN_PROGRESS -> ON_HOLD -> IN_PROGRESS (a cycle) on the WorkOrder entity, a non-linear shape distinct from the Inspection revision cycle."
        test_recipe:
          setup:
            - "Clock 2026-06-01; a work order taken to IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "SIGNAL", gis_segment_id: "SEG-5", location_desc: "5th & Main", install_date: "2024-01-01T00:00:00Z", replacement_value_cents: 300000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Signals A", crew_type: "SIGNALS", hourly_rate_cents: 7000 }
              as: Supervisor
              captures: { crew_id: $.data.id, crew_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-06-02T06:00:00Z", scheduled_end: "2026-06-02T20:00:00Z" }
              as: Dispatcher
            - call: "POST /dispatches"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew_id}", window_start: "2026-06-02T08:00:00Z", window_end: "2026-06-02T12:00:00Z", labor_hours: 4, expected_crew_version: "${crew_v0}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
          trigger:
            - call: "POST /work-orders/${wo_id}/hold"
              payload: {}
              as: CrewLead
              captures: { held_status: $.data.status }
            - call: "POST /work-orders/${wo_id}/resume"
              payload: {}
              as: CrewLead
              captures: { resumed_status: $.data.status }
          assert:
            - "hold response WorkOrder.${wo_id}.status == ON_HOLD"
            - "resume response WorkOrder.${wo_id}.status == IN_PROGRESS"

      - name: inspection_reject_resubmit_cycle
        grounds:
          - state_machines.Inspection.SUBMITTED_to_REJECTED
          - state_machines.Inspection.REJECTED_to_SUBMITTED
        distinguishing_aspect: "Inspection loops SUBMITTED -> REJECTED -> SUBMITTED (revision cycle) on the Inspection entity, a non-linear shape distinct from the WorkOrder hold/resume cycle."
        test_recipe:
          setup:
            - "Clock 2026-06-01; an inspection submitted then rejected"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "SIGN", gis_segment_id: "SEG-6", location_desc: "Stop sign 12", install_date: "2024-01-01T00:00:00Z", replacement_value_cents: 40000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /inspections"
              payload: { asset_id: "${asset_id}", inspection_type: "CONDITION", raw_distress_index: 30, scheduled_window_start: "2026-06-01T08:00:00Z", scheduled_window_end: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "insp-9"
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-9"
            - call: "POST /inspections/${insp_id}/decision"
              payload: { decision: "REJECT" }
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-9"
              captures: { resubmit_status: $.data.status }
          assert:
            - "Inspection.${insp_id}.status == SUBMITTED"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_accept_failed_cascades_workorder_and_asset_repair
        grounds:
          - state_machines.Inspection.SUBMITTED_to_ACCEPTED
          - calculations.pci_score
          - calculations.condition_state_thresholds
          - state_machines.Asset.ACTIVE_to_UNDER_REPAIR
          - entities.Asset.fields.condition_state
        distinguishing_aspect: "Accepting a CONDITION inspection with computed_pci 41 (FAILED) mutates Asset.pci_score/condition_state (hop1), which auto-creates a MAINTENANCE WorkOrder (hop2), which drives Asset ACTIVE -> UNDER_REPAIR (hop3) — a depth-3 chain triggered by inspection acceptance, a different trigger than the work-order-cancel cascade."
        test_recipe:
          setup:
            - "Clock 2026-06-01; ROAD asset installed 2020-03-01 (age 6); inspection CONDITION raw_distress_index 50 submitted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-7", location_desc: "Pothole row", install_date: "2020-03-01T00:00:00Z", replacement_value_cents: 500000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /inspections"
              payload: { asset_id: "${asset_id}", inspection_type: "CONDITION", raw_distress_index: 50, scheduled_window_start: "2026-06-01T08:00:00Z", scheduled_window_end: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "insp-2"
              captures: { insp_id: $.data.id, insp_pci: $.data.computed_pci }
            - call: "POST /inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-2"
          trigger:
            - call: "POST /inspections/${insp_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Supervisor
              as_user_id: "sup-2"
            - call: "GET /work-orders?asset_id=${asset_id}"
              payload: {}
              as: Dispatcher
              captures: { auto_wo_id: "$.data[0].id", auto_wo_origin: "$.data[0].origin", auto_wo_type: "$.data[0].work_type" }
          assert:
            - "Asset.${asset_id}.pci_score == 41"
            - "Asset.${asset_id}.condition_state == FAILED"
            - "Asset.${asset_id}.status == UNDER_REPAIR"
            - "GET /work-orders?asset_id returns exactly one WorkOrder with origin == INSPECTION and work_type == MAINTENANCE"

      - name: workorder_cancel_releases_dispatch_then_frees_crew
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - state_machines.Dispatch.RESERVED_to_CANCELLED
          - state_machines.Crew.ON_ASSIGNMENT_to_AVAILABLE
          - entities.Crew.fields.committed_minutes
        distinguishing_aspect: "Cancelling a SCHEDULED WorkOrder cancels its RESERVED Dispatch (hop1), and that dispatch cancellation flips the Crew ON_ASSIGNMENT -> AVAILABLE with committed_minutes back to 0 (hop2) — a depth-2 chain triggered by WorkOrder cancel, a different trigger than inspection acceptance."
        test_recipe:
          setup:
            - "Clock 2026-06-01; a SCHEDULED work order with one RESERVED dispatch (window 240 min); crew ON_ASSIGNMENT with committed_minutes 240"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-8", location_desc: "Cancel row", install_date: "2024-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Paving D", crew_type: "PAVING", hourly_rate_cents: 6000 }
              as: Supervisor
              captures: { crew_id: $.data.id, crew_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { asset_id: "${asset_id}", work_type: "MAINTENANCE", origin: "PREVENTIVE" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-06-02T06:00:00Z", scheduled_end: "2026-06-02T20:00:00Z" }
              as: Dispatcher
            - call: "POST /dispatches"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew_id}", window_start: "2026-06-02T08:00:00Z", window_end: "2026-06-02T12:00:00Z", labor_hours: 4, expected_crew_version: "${crew_v0}" }
              as: Dispatcher
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: Dispatcher
            - call: "GET /dispatches/${d_id}"
              payload: {}
              as: Dispatcher
              captures: { d_status: $.data.status }
            - call: "GET /crews/${crew_id}"
              payload: {}
              as: Dispatcher
              captures: { cr_status: $.data.status, cr_minutes: $.data.committed_minutes }
          assert:
            - "Dispatch.${d_id}.status == CANCELLED"
            - "Crew.${crew_id}.status == AVAILABLE"
            - "Crew.${crew_id}.committed_minutes == 0"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_state_error_beats_window_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=13]
        distinguishing_aspect: "A POST /dispatches whose target WorkOrder is DRAFT (state, priority 5) AND whose window collides with the crew's existing reserved window (business_temporal, priority 13) returns ERR_INVALID_STATE — the state category (lower priority number) wins, exercising the state vs business_temporal pair, distinct from the existence vs business_fiscal pair."
        test_recipe:
          setup:
            - "Clock 2026-06-01; crew with an existing RESERVED dispatch 2026-06-02 08:00-12:00 on a scheduled WO_other; a separate WO_target still in DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Supervisor
            - call: "POST /assets"
              payload: { asset_class: "ROAD", gis_segment_id: "SEG-9", location_desc: "Conflict row", install_date: "2024-01-01T00:00:00Z", replacement_value_cents: 200000 }
              as: Supervisor
              captures: { asset_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Paving E", crew_type: "PAVING", hourly_rate_cents: 6000 }
              as: Supervisor
              captures: { crew_id: $.data.id, crew_v0: $.data.version }
            - call: "POST /work-orders"
