        grounds: [entities.SessionSlot.fields.seats_taken, endpoints]
        distinguishing_aspect: "After a jump-pass create, the SAME slot GET in the same client turn already shows seats_taken == 1 (immediate consistency, no lag)."
        test_recipe:
          setup: ["Fresh slot capacity 10."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Imm J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { seats_now: $.data.seats_taken }
          assert:
            - "SessionSlot.${slot_id}.seats_taken == 1"
