# =============================================================================
# Task 0053 — Laboratory Equipment Sharing Platform (v1)
# Scaffold seed tables (SCAFFOLD.yaml)
# =============================================================================

scenario: |
  Laboratory equipment sharing platform: equipment registration and qualification
  with equipment profile (model/specification/owner-lab), equipment-status
  classification (available/maintenance/retired), open-sharing scope (within-school/
  inter-school/external), qualification certificate (calibration/safety inspection),
  and equipment-photo and operation-manual upload; reservation scheduling with
  available time-slot configuration, slot granularity (hour/half-day/day),
  reservation lead time, single-user duration limit, peak-period priority rules,
  and cancellation rules; usage authorization approval with user qualification
  check (training certificate/sample-type matching), equipment-owner approval,
  multi-level approval for high-value equipment, urgent-use expedited approval,
  and authorization expiration; billing (by time / by sample) with hybrid billing
  modes, internal and external differentiated pricing, sample-quantity-based
  pricing, consumables-cost separation, and billing-rule version control;
  maintenance window with periodic maintenance plan, ad-hoc maintenance
  requirement, maintenance-period reservation blocking, maintenance record
  archiving, and post-maintenance acceptance; usage logs with check-in and
  check-out records, actual usage duration, sample information, abnormal-event
  records, and equipment-status handover; cost allocation with reservation-based
  fee accrual, owner-lab revenue share, platform service fee, refund handling,
  periodic settlement to owner-lab, and inter-department cost transfer;
  event-driven synchronization with payment, IM, and identity-verification
  systems; audit logging for reservation changes and authorization records.

domain_name: lab-equipment-sharing
api_prefix: /equipment

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - version_pinning_on_approval
    - cascading_side_effects
    - scheduled_deferred_actions
    - resource_temporal_overlap

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Lab
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Owner-lab display name" }
      - { name: institution, type: string, source: input, description: "Parent institution / school code" }
      - { name: department, type: string, source: input, description: "Department code used for inter-department cost transfer" }
      - { name: contact_user_id, type: string, source: input, description: "Lab admin user id (matches a User.id with role LabOwner)" }
      - { name: revenue_share_bps, type: integer, source: input, description: "Owner-lab revenue share in basis points (0..10000)", constraints: "0 <= revenue_share_bps <= 10000; complement of platform fee" }
      - { name: settlement_balance_cents, type: integer, source: computed, description: "Unsettled owner-lab revenue accrued since last periodic settlement", default: 0 }
      - { name: lifetime_settled_cents, type: integer, source: computed, description: "Cumulative settled amount paid out to owner-lab", default: 0 }

  - name: User
    parent: null
    common_fields: true
    fields:
      - { name: external_user_id, type: string, source: input, description: "Identity from identity-verification system (idempotency key on user provisioning)" }
      - { name: full_name, type: string, source: input, description: "User display name" }
      - { name: department, type: string, source: input, description: "Department code (drives inter-department cost transfer ledger)" }
      - { name: affiliation, type: enum, source: input, description: "WITHIN_SCHOOL | INTER_SCHOOL | EXTERNAL — drives pricing tier and sharing-scope eligibility" }
      - { name: training_certificates, type: array, source: input, description: "Array of training certificate codes the user holds (qualification check)" }
      - { name: identity_verified, type: boolean, source: system, description: "Set true when identity-verification system emits VERIFIED event", default: false }

  - name: Equipment
    parent: Lab
    common_fields: true
    fields:
      - { name: lab_id, type: string, source: system, description: "Owner-lab" }
      - { name: model, type: string, source: input, description: "Equipment model identifier" }
      - { name: specification, type: string, source: input, description: "Free-form specification text" }
      - { name: value_tier, type: enum, source: input, description: "STANDARD | HIGH_VALUE — HIGH_VALUE forces multi-level approval (Owner then PlatformAdmin)" }
      - { name: sharing_scope, type: enum, source: input, description: "WITHIN_SCHOOL | INTER_SCHOOL | EXTERNAL — maximal user.affiliation tier allowed" }
      - { name: slot_granularity, type: enum, source: input, description: "HOUR | HALF_DAY | DAY — fixed-grid slot length" }
      - { name: lead_time_hours, type: integer, source: input, description: "Minimum hours between now and reservation start_at", constraints: ">= 0" }
      - { name: single_user_duration_limit_hours, type: integer, source: input, description: "Cap on contiguous slot_seconds per Reservation (hours)" }
      - { name: peak_window_start_hour, type: integer, source: input, description: "Local hour (0..23) when peak pricing/priority window opens" }
      - { name: peak_window_end_hour, type: integer, source: input, description: "Local hour (1..24) when peak pricing/priority window closes; half-open [start,end)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | MAINTENANCE | RETIRED", default: AVAILABLE, constraints: "AVAILABLE | MAINTENANCE | RETIRED" }
      - { name: calibration_cert_id, type: string, source: input, description: "Calibration certificate document id; required for status=AVAILABLE" }
      - { name: calibration_expires_at, type: datetime, source: input, description: "Calibration certificate expiry timestamp" }
      - { name: safety_inspection_cert_id, type: string, source: input, description: "Safety inspection certificate document id; required for status=AVAILABLE" }
      - { name: safety_inspection_expires_at, type: datetime, source: input, description: "Safety inspection certificate expiry timestamp" }
      - { name: photo_uri, type: string, source: input, description: "URI to equipment photo asset" }
      - { name: operation_manual_uri, type: string, source: input, description: "URI to operation manual asset" }
      - { name: active_billing_rule_id, type: string, source: system, description: "Currently active BillingRule.id (latest PUBLISHED rule for this equipment)" }
      - { name: required_training_codes, type: array, source: input, description: "Array of training certificate codes a user MUST hold to be authorized" }
      - { name: allowed_sample_types, type: array, source: input, description: "Array of sample-type codes accepted by this equipment (qualification matching)" }

  - name: BillingRule
    parent: Equipment
    common_fields: false
    fields:
      - { name: equipment_id, type: string, source: system, description: "Equipment scope of this rule version" }
      - { name: rule_version, type: integer, source: system, description: "Monotonic per-equipment version; starts at 1, +1 per PUBLISH" }
      - { name: mode, type: enum, source: input, description: "BY_TIME | BY_SAMPLE | HYBRID" }
      - { name: internal_rate_per_hour_cents, type: integer, source: input, description: "Internal price per billed hour (WITHIN_SCHOOL users)" }
      - { name: external_rate_per_hour_cents, type: integer, source: input, description: "External price per billed hour (EXTERNAL users)" }
      - { name: inter_school_rate_per_hour_cents, type: integer, source: input, description: "Inter-school price per billed hour (INTER_SCHOOL users)" }
      - { name: internal_rate_per_sample_cents, type: integer, source: input, description: "Internal per-sample price (BY_SAMPLE / HYBRID)" }
      - { name: external_rate_per_sample_cents, type: integer, source: input, description: "External per-sample price (BY_SAMPLE / HYBRID)" }
      - { name: inter_school_rate_per_sample_cents, type: integer, source: input, description: "Inter-school per-sample price (BY_SAMPLE / HYBRID)" }
      - { name: peak_multiplier_bps, type: integer, source: input, description: "Multiplier in basis points applied to TIME portion when peak overlap > 0; e.g. 12500 = 1.25x" }
      - { name: consumables_flat_cents, type: integer, source: input, description: "Per-checkout consumables flat fee, accounted separately from equipment fee" }
      - { name: platform_fee_bps, type: integer, source: input, description: "Platform service fee in basis points charged on the equipment fee subtotal" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp when DRAFT → PUBLISHED; null otherwise" }

  - name: MaintenanceWindow
    parent: Equipment
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: system, description: "Target equipment" }
      - { name: kind, type: enum, source: input, description: "PERIODIC | AD_HOC" }
      - { name: start_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (exclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | AWAITING_ACCEPTANCE | ACCEPTED | REJECTED" }
      - { name: maintenance_notes, type: string, source: input, description: "Free-form maintenance description" }
      - { name: acceptance_notes, type: string, source: input, description: "Acceptance notes recorded on /accept" }
      - { name: archived_record_uri, type: string, source: system, description: "Pointer to archived MaintenanceRecord; populated on ACCEPTED transition" }

  - name: Authorization
    parent: Equipment
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: system, description: "Target equipment" }
      - { name: user_id, type: string, source: input, description: "Requesting user" }
      - { name: sample_type, type: string, source: input, description: "Sample-type code intended for use; must be in equipment.allowed_sample_types" }
      - { name: urgency, type: enum, source: input, description: "NORMAL | URGENT — URGENT bypasses PlatformAdmin step on HIGH_VALUE within 24h" }
      - { name: status, type: enum, source: system, description: "PENDING_OWNER | PENDING_PLATFORM | APPROVED | REJECTED | EXPIRED | REVOKED" }
      - { name: approved_at, type: datetime, source: system, description: "Timestamp when status entered APPROVED" }
      - { name: expires_at, type: datetime, source: system, description: "approved_at + AUTHORIZATION_TTL_DAYS at APPROVE; null until APPROVED" }
      - { name: owner_decision_user_id, type: string, source: system, description: "User.id of LabOwner who approved/rejected the owner step" }
      - { name: platform_decision_user_id, type: string, source: system, description: "Operator id (opaque) who approved/rejected the platform step" }
      - { name: rejection_reason, type: string, source: input, description: "Optional rejection reason recorded on /reject" }

  - name: Reservation
    parent: Equipment
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: system, description: "Target equipment" }
      - { name: user_id, type: string, source: input, description: "Reserving user" }
      - { name: authorization_id, type: string, source: input, description: "Authorization granting access (must be APPROVED for this equipment+user)" }
      - { name: start_at, type: datetime, source: input, description: "Reservation start (aligned to slot_granularity grid)" }
      - { name: end_at, type: datetime, source: input, description: "Reservation end (exclusive; end_at - start_at is a multiple of slot_granularity)" }
      - { name: requested_sample_count, type: integer, source: input, description: "Declared sample count used by BY_SAMPLE/HYBRID estimate" }
      - { name: priority_tier, type: enum, source: computed, description: "PEAK | OFF_PEAK — PEAK if [start_at,end_at) intersects equipment peak window for > 0 minutes" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: billing_rule_id_pinned, type: string, source: system, description: "BillingRule.id snapshot pinned at /confirm time; immutable thereafter" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "Provisional total fee at confirm time (forward-looking)" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final total fee at COMPLETED time (chronological, from UsageLog)", default: 0 }
      - { name: estimated_platform_fee_cents, type: integer, source: computed, description: "Provisional platform fee portion (informational)", default: 0 }
      - { name: final_platform_fee_cents, type: integer, source: computed, description: "Final platform fee portion at COMPLETED", default: 0 }
      - { name: estimated_owner_share_cents, type: integer, source: computed, description: "Provisional owner-lab share (informational)", default: 0 }
      - { name: final_owner_share_cents, type: integer, source: computed, description: "Final owner-lab share at COMPLETED", default: 0 }
      - { name: cancelled_at, type: datetime, source: system, description: "Cancellation timestamp; null until cancelled" }
      - { name: cancellation_refund_bps, type: integer, source: computed, description: "0, 5000, or 10000 — depends on cancellation lead time", default: 0 }

  - name: UsageLog
    parent: Reservation
    common_fields: false
    fields:
      - { name: reservation_id, type: string, source: system, description: "Owning reservation" }
      - { name: check_in_at, type: datetime, source: system, description: "Set on POST /check-in" }
      - { name: check_out_at, type: datetime, source: system, description: "Set on POST /check-out" }
      - { name: actual_duration_minutes, type: integer, source: computed, description: "ceil((check_out_at - check_in_at) in minutes); 0 until check-out" }
      - { name: actual_sample_count, type: integer, source: input, description: "Recorded sample count at check-out" }
      - { name: abnormal_event_code, type: string, source: input, description: "Optional incident code; sets status_handover=ABNORMAL if present" }
      - { name: status_handover, type: enum, source: input, description: "NORMAL | ABNORMAL — ABNORMAL triggers Equipment AVAILABLE → MAINTENANCE auto-transition with an AD_HOC MaintenanceWindow" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: subject_type, type: enum, source: system, description: "RESERVATION | AUTHORIZATION" }
      - { name: subject_id, type: string, source: system, description: "Affected entity id" }
      - { name: actor_role, type: string, source: system, description: "Role from X-User-Role" }
      - { name: actor_user_id, type: string, source: system, description: "Acting X-User-ID" }
      - { name: action, type: string, source: system, description: "Verb: CREATE, APPROVE, REJECT, CANCEL, REVOKE, CHECK_IN, CHECK_OUT, EXPIRE, RESCHEDULE" }
      - { name: from_state, type: string, source: system, description: "Prior state value (or null for create)" }
      - { name: to_state, type: string, source: system, description: "Resulting state value" }
      - { name: payload_json, type: object, source: system, description: "Compact JSON of mutated fields" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Equipment
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /equipment/{id}/maintenance-windows (kind=AD_HOC, start_at <= now < end_at), or system on UsageLog.status_handover=ABNORMAL at /check-out, or system at MaintenanceWindow SCHEDULED→IN_PROGRESS"
        actor: "LabOwner or system"
        preconditions:
          - "Equipment.status == AVAILABLE"
          - "If user-initiated AD_HOC: caller is LabOwner of equipment.lab_id"
        side_effects:
          - "BOOKED reservations overlapping the window → CANCELLED with cancellation_refund_bps=10000 (cascade depth 1)"
          - "CANCELLED reservations release their estimated owner_share/platform_fee from Lab.settlement_balance accrual; refund_handling emitted to payment system (cascade depth 2)"
          - "AuditEvent rows written for each cascaded reservation cancellation (cascade depth 3)"

      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /maintenance-windows/{id}/accept (MaintenanceWindow AWAITING_ACCEPTANCE → ACCEPTED) when no other active window covers now"
        actor: "LabOwner or PlatformAdmin"
        preconditions:
          - "MaintenanceWindow.status == AWAITING_ACCEPTANCE"
          - "No other MaintenanceWindow in IN_PROGRESS or AWAITING_ACCEPTANCE for this equipment"
        side_effects:
          - "MaintenanceWindow.archived_record_uri populated"
          - "Equipment.status → AVAILABLE"

      - from: [AVAILABLE, MAINTENANCE]
        to: RETIRED
        trigger: "PUT /equipment/{id} status=RETIRED"
        actor: LabOwner
        preconditions:
          - "No BOOKED or CHECKED_IN reservations remain on this equipment"
        side_effects:
          - "Future MaintenanceWindow rows in SCHEDULED → CANCELLED-equivalent terminal REJECTED (no acceptance possible)"

  - entity: BillingRule
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /equipment/{equipment_id}/billing-rules/{rule_id}/publish"
        actor: LabOwner
        preconditions:
          - "All rate fields present and >= 0"
          - "platform_fee_bps + owner share complement does not exceed 10000"
        side_effects:
          - "Previously PUBLISHED rule for the same equipment → SUPERSEDED (cascade depth 1)"
          - "Equipment.active_billing_rule_id updated to this rule.id (cascade depth 2)"
          - "BillingRule.rule_version assigned = max(existing rule_version for equipment)+1"
          - "In-flight Authorization rows remain bound to whatever rule was active at their CONFIRM time; only future reservations pin the new rule"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a newer rule on the same equipment transitions DRAFT→PUBLISHED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaintenanceWindow
    field: status
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system on clock advance reaching start_at"
        actor: system
        preconditions:
          - "now >= start_at"
          - "Equipment.status == AVAILABLE"
        side_effects:
          - "Equipment.status AVAILABLE → MAINTENANCE"
          - "BOOKED reservations overlapping [start_at, end_at) → CANCELLED with cancellation_refund_bps=10000"

      - from: IN_PROGRESS
        to: AWAITING_ACCEPTANCE
        trigger: "system on clock advance reaching end_at"
        actor: system
        preconditions:
          - "now >= end_at"
        side_effects: []

      - from: AWAITING_ACCEPTANCE
        to: ACCEPTED
        trigger: "POST /maintenance-windows/{id}/accept"
        actor: "LabOwner or PlatformAdmin"
        preconditions: []
        side_effects:
          - "Equipment.status MAINTENANCE → AVAILABLE (if no other MaintenanceWindow active)"
          - "archived_record_uri set"

      - from: AWAITING_ACCEPTANCE
        to: REJECTED
        trigger: "POST /maintenance-windows/{id}/reject"
        actor: "LabOwner or PlatformAdmin"
        preconditions: []
        side_effects:
          - "Spawns a follow-up AD_HOC MaintenanceWindow with start_at=now, end_at=now+24h (cascade depth 1)"
          - "Equipment.status remains MAINTENANCE (covered by the new window)"

      - from: SCHEDULED
        to: REJECTED
        trigger: "system on Equipment status=RETIRED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Authorization
    field: status
    initial_state: PENDING_OWNER
    terminal_states: [APPROVED, REJECTED, EXPIRED, REVOKED]
    note: "Branching workflow — Owner step may FORK to PENDING_PLATFORM (HIGH_VALUE) or directly to APPROVED (STANDARD or URGENT HIGH_VALUE)."
    transitions:
      - from: PENDING_OWNER
        to: PENDING_PLATFORM
        trigger: "POST /authorizations/{id}/approve"
        actor: LabOwner
        preconditions:
          - "Acting LabOwner owns Equipment.lab_id"
          - "Equipment.value_tier == HIGH_VALUE"
          - "Authorization.urgency != URGENT (URGENT skips this hop)"
          - "User.identity_verified == true"
          - "User holds every code in Equipment.required_training_codes"
          - "Authorization.sample_type ∈ Equipment.allowed_sample_types"
        side_effects:
          - "owner_decision_user_id set"

      - from: PENDING_OWNER
        to: APPROVED
        trigger: "POST /authorizations/{id}/approve"
        actor: LabOwner
        preconditions:
          - "Equipment.value_tier == STANDARD OR Authorization.urgency == URGENT"
          - "Same qualification checks as the PENDING_OWNER→PENDING_PLATFORM transition"
        side_effects:
          - "approved_at = now; expires_at = approved_at + AUTHORIZATION_TTL_DAYS"
          - "AuditEvent APPROVE row written"

      - from: PENDING_PLATFORM
        to: APPROVED
        trigger: "POST /authorizations/{id}/approve"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "platform_decision_user_id set"
          - "approved_at = now; expires_at = approved_at + AUTHORIZATION_TTL_DAYS"
          - "AuditEvent APPROVE row written"

      - from: [PENDING_OWNER, PENDING_PLATFORM]
        to: REJECTED
        trigger: "POST /authorizations/{id}/reject"
        actor: "LabOwner (for PENDING_OWNER) or PlatformAdmin (for PENDING_PLATFORM)"
        preconditions: []
        side_effects:
          - "AuditEvent REJECT row written with from_state captured"

      - from: APPROVED
        to: REVOKED
        trigger: "POST /authorizations/{id}/revoke"
        actor: "LabOwner or PlatformAdmin"
        preconditions: []
        side_effects:
          - "Future-dated BOOKED reservations on this authorization → CANCELLED with cancellation_refund_bps=10000 (cascade depth 1)"
          - "Lab.settlement_balance_cents debited by sum of estimated_owner_share_cents of cancelled reservations (cascade depth 2)"
          - "AuditEvent REVOKE row written"

      - from: APPROVED
        to: EXPIRED
        trigger: "system on clock advance to expires_at"
        actor: system
        preconditions:
          - "now >= expires_at"
        side_effects:
          - "Future-dated BOOKED reservations → CANCELLED with cancellation_refund_bps=10000"
          - "AuditEvent EXPIRE row written"

  - entity: Reservation
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: User
        preconditions:
          - "now >= start_at - 15min and now < end_at"
          - "Equipment.status == AVAILABLE"
          - "Authorization.status == APPROVED and now < Authorization.expires_at"
        side_effects:
          - "UsageLog row created with check_in_at = now"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /reservations/{id}/check-out"
        actor: User
        preconditions: []
        side_effects:
          - "UsageLog.check_out_at = now; actual_duration_minutes computed"
          - "final_fee_cents computed by chronological_billing using UsageLog (cascade depth 1)"
          - "Lab.settlement_balance_cents adjusted by (final_owner_share - estimated_owner_share) (cascade depth 2)"
          - "If status_handover=ABNORMAL: spawn AD_HOC MaintenanceWindow + Equipment AVAILABLE → MAINTENANCE (cascade depth 3)"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: "User (owner of reservation) or LabOwner of equipment"
        preconditions:
          - "now < start_at"
        side_effects:
          - "cancelled_at = now"
          - "cancellation_refund_bps set per cancellation_refund_policy"
          - "Lab.settlement_balance_cents debited by estimated_owner_share_cents * (refund_bps / 10000)"
          - "Refund event emitted to payment system"

      - from: BOOKED
        to: NO_SHOW
        trigger: "system on clock advance reaching end_at without check-in"
        actor: system
        preconditions:
          - "now >= end_at"
          - "UsageLog.check_in_at IS NULL"
        side_effects:
          - "estimated_fee_cents is fully charged (no refund, cancellation_refund_bps=0)"
          - "Lab.settlement_balance_cents retains the accrued estimated_owner_share_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two users POST /reservations for the same equipment with overlapping [start_at, end_at) windows simultaneously"
    guarantee: "At most one reservation occupies any portion of the slot grid; the loser is rejected"
    error_id: ERR_RESERVATION_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on Reservation insert; check uses [start_at, end_at) half-open intersection against existing BOOKED + CHECKED_IN rows"

  - scenario: "Reservation /check-in races with MaintenanceWindow SCHEDULED → IN_PROGRESS at the same instant"
    guarantee: "Exactly one operation succeeds; loser is rejected"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Equipment.status; check-in observes MAINTENANCE → reject"

  - scenario: "POST /billing-rules/{id}/publish races with POST /reservations/confirm pinning the prior rule"
    guarantee: "Reservation pins exactly one rule_id; whichever transaction commits first wins"
    error_id: ERR_BILLING_RULE_RACED
    http_status: 409
    serialization: "First-writer-wins on Equipment.active_billing_rule_id; reservation re-reads pinned rule_id under same transaction"

  - scenario: "Two LabOwners simultaneously approve the same Authorization in PENDING_OWNER"
    guarantee: "Exactly one approval persists; loser is rejected"
    error_id: ERR_AUTHORIZATION_ALREADY_DECIDED
    http_status: 409
    serialization: "First-writer-wins on Authorization.status (PENDING_OWNER → next state)"

  - scenario: "PlatformAdmin approves PENDING_PLATFORM while LabOwner revokes the same Authorization"
    guarantee: "Exactly one operation succeeds; revoke after approve produces REVOKED, approve after revoke is rejected"
    error_id: ERR_AUTHORIZATION_ALREADY_DECIDED
    http_status: 409
    serialization: "First-writer-wins on Authorization.status"

  - scenario: "User POST /reservations/{id}/cancel races with system NO_SHOW at end_at"
    guarantee: "Exactly one terminal state is reached"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Reservation.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_fee
    trigger: "POST /reservations (create) and POST /reservations/{id}/confirm"
    algorithm: forward_looking
    formula: |
      # Forward-looking: uses the reservation's [start_at,end_at) window, declared requested_sample_count,
      # active BillingRule at confirm time. Two-decimal rounding is applied AFTER summing line items.
      rule = BillingRule.find(equipment.active_billing_rule_id)
      billed_hours = (end_at - start_at) total minutes / 60   # exact rational
      time_rate_per_hour = pick_rate_by_affiliation(rule, user.affiliation, "time")
      sample_rate_per_sample = pick_rate_by_affiliation(rule, user.affiliation, "sample")

      time_component_cents_raw = case rule.mode:
        BY_TIME    -> billed_hours * time_rate_per_hour
        BY_SAMPLE  -> 0
        HYBRID     -> billed_hours * time_rate_per_hour     # HYBRID = TIME + SAMPLE additive

      sample_component_cents_raw = case rule.mode:
        BY_TIME    -> 0
        BY_SAMPLE  -> requested_sample_count * sample_rate_per_sample
        HYBRID     -> requested_sample_count * sample_rate_per_sample

      # Peak multiplier applies ONLY to the time component, ONLY when [start_at,end_at) intersects
      # equipment peak window for STRICTLY MORE THAN 0 minutes.
      if peak_overlap_minutes(reservation, equipment) > 0:
          time_component_cents_raw *= rule.peak_multiplier_bps / 10000.0

      equipment_fee_cents = round_half_up(time_component_cents_raw + sample_component_cents_raw, 0)
      platform_fee_cents = round_half_up(equipment_fee_cents * rule.platform_fee_bps / 10000.0, 0)
      consumables_cents  = rule.consumables_flat_cents
      estimated_fee_cents = equipment_fee_cents + platform_fee_cents + consumables_cents

      estimated_owner_share_cents   = round_half_up(equipment_fee_cents * lab.revenue_share_bps / 10000.0, 0)
      estimated_platform_fee_cents  = platform_fee_cents
    input_set: "BillingRule = Equipment.active_billing_rule_id at confirm time; user.affiliation read once; requested_sample_count from request body"
    constants:
      ROUNDING_ORDER: "Apply peak_multiplier on the raw time component, sum time+sample, THEN round once to cents. Round each downstream field (platform_fee, owner_share) independently from the rounded equipment_fee_cents."
    precision: "All cents fields are integers; round_half_up at the steps named in constants"
    variants:
      - name: estimated_fee_forward_looking
        when: "Reservation transitions BOOKED on confirm"
        difference: "Uses declared requested_sample_count and full [start_at,end_at) duration regardless of future actual usage"

  - name: final_fee
    trigger: "POST /reservations/{id}/check-out (Reservation CHECKED_IN → COMPLETED)"
    algorithm: chronological
    formula: |
      # Chronological: replays UsageLog records to derive actual billed quantities.
      # Reads the PINNED rule (Reservation.billing_rule_id_pinned), NOT current active rule.
      rule = BillingRule.find(reservation.billing_rule_id_pinned)
      actual_minutes = ceil_minutes(UsageLog.check_out_at - UsageLog.check_in_at)
      # Billed hours = ceil to nearest hour for BY_TIME and HYBRID time portion.
      actual_billed_hours = ceil(actual_minutes / 60.0)
      time_rate_per_hour     = pick_rate_by_affiliation(rule, user.affiliation, "time")
      sample_rate_per_sample = pick_rate_by_affiliation(rule, user.affiliation, "sample")

      time_component_cents_raw = case rule.mode:
        BY_TIME   -> actual_billed_hours * time_rate_per_hour
        BY_SAMPLE -> 0
        HYBRID    -> actual_billed_hours * time_rate_per_hour

      sample_component_cents_raw = case rule.mode:
        BY_TIME   -> 0
        BY_SAMPLE -> UsageLog.actual_sample_count * sample_rate_per_sample
        HYBRID    -> UsageLog.actual_sample_count * sample_rate_per_sample

      # Peak multiplier applies based on the ACTUAL session [check_in_at, check_out_at) window.
      if peak_overlap_minutes_actual(UsageLog, equipment) > 0:
          time_component_cents_raw *= rule.peak_multiplier_bps / 10000.0

      equipment_fee_cents = round_half_up(time_component_cents_raw + sample_component_cents_raw, 0)
      platform_fee_cents  = round_half_up(equipment_fee_cents * rule.platform_fee_bps / 10000.0, 0)
      consumables_cents   = rule.consumables_flat_cents
      final_fee_cents = equipment_fee_cents + platform_fee_cents + consumables_cents

      final_owner_share_cents   = round_half_up(equipment_fee_cents * lab.revenue_share_bps / 10000.0, 0)
      final_platform_fee_cents  = platform_fee_cents
    input_set: "PINNED BillingRule (rule_version frozen at confirm time); UsageLog times and actual_sample_count"
    constants:
      ROUNDING_ORDER: "Same as estimated_fee: sum first, round to cents once, then derive platform_fee and owner_share via independent rounds."
    precision: "All cents fields integers; round_half_up"
    variants:
      - name: final_fee_chronological
        when: "Reservation transitions COMPLETED"
        difference: "Uses ceil(actual_minutes/60) for time and actual_sample_count for samples; identical inputs can diverge from estimated_fee whenever actual differs from declared (e.g., over-run, fewer samples)."

  - name: cancellation_refund_policy
    trigger: "POST /reservations/{id}/cancel (Reservation BOOKED → CANCELLED)"
    algorithm: threshold
    formula: |
      delta_minutes = (start_at - now) total minutes
      if delta_minutes >= 24 * 60:
        cancellation_refund_bps = 10000   # full refund
      elif delta_minutes >= 2 * 60:
        cancellation_refund_bps = 5000    # 50% refund
      else:
        cancellation_refund_bps = 0       # no refund (still cancels)
      refund_cents = round_half_up(estimated_fee_cents * cancellation_refund_bps / 10000.0, 0)
      lab.settlement_balance_cents -= round_half_up(estimated_owner_share_cents * cancellation_refund_bps / 10000.0, 0)
    constants:
      FULL_REFUND_MIN_HOURS: 24
      PARTIAL_REFUND_MIN_HOURS: 2
    precision: "round_half_up"

  - name: lab_settlement_balance
    trigger: "Any Reservation status change (confirm, cancel, complete, no-show, system revoke/expire) and POST /labs/{id}/settle"
    algorithm: aggregation
    formula: |
      # Incremental accrual model:
      #   On confirm:    balance += estimated_owner_share_cents
      #   On complete:   balance += (final_owner_share_cents - estimated_owner_share_cents)
      #   On cancel:     balance -= round_half_up(estimated_owner_share_cents * cancellation_refund_bps / 10000.0, 0)
      #   On revoke/expire of Authorization that cancels future reservations: same as cancel for each
      #   On no-show:    balance unchanged (no refund)
      #   On settle:     lifetime_settled_cents += balance; balance := 0
      # Invariant (post-settlement):
      #   lifetime_settled_cents == sum over all COMPLETED reservations of final_owner_share_cents
      #                           - sum over CANCELLED reservations of (estimated_owner_share * refund_bps / 10000 rounded)
    input_set: "All reservations whose lab_id == this Lab; status filter included in formula"
    precision: "integer cents"

  - name: authorization_eligibility_score
    trigger: "POST /authorizations (create) and POST /authorizations/{id}/approve (re-check)"
    algorithm: weighted_scoring
    formula: |
      # Three-input weighted score determining whether an Authorization passes the qualification gate.
      # Inputs and constants:
      training_match = (|required_training_codes \ user.training_certificates| == 0) ? 1 : 0
      sample_match   = (authorization.sample_type ∈ equipment.allowed_sample_types) ? 1 : 0
      affiliation_match = case equipment.sharing_scope:
        WITHIN_SCHOOL -> (user.affiliation == WITHIN_SCHOOL) ? 1 : 0
        INTER_SCHOOL  -> (user.affiliation IN (WITHIN_SCHOOL, INTER_SCHOOL)) ? 1 : 0
        EXTERNAL      -> 1
      identity_match = user.identity_verified ? 1 : 0

      # Tiered selection (non-linear): URGENT bypasses the platform step only when ALL of training,
      # sample, and affiliation match AND value_tier==HIGH_VALUE; STANDARD URGENT is treated like NORMAL.
      score = TRAINING_WEIGHT * training_match
            + SAMPLE_WEIGHT * sample_match
            + AFFILIATION_WEIGHT * affiliation_match
            + IDENTITY_WEIGHT * identity_match

      passes_gate = (score >= QUALIFICATION_THRESHOLD)
      # Threshold is calibrated so that any failing component zeroes the gate.
    constants:
      TRAINING_WEIGHT: 30
      SAMPLE_WEIGHT: 30
      AFFILIATION_WEIGHT: 20
      IDENTITY_WEIGHT: 20
      QUALIFICATION_THRESHOLD: 100
    precision: "integer"

  - name: peak_overlap_minutes
    trigger: "Used internally by estimated_fee and final_fee, and by reservation priority_tier"
    algorithm: interval_merge
    formula: |
      # Given a session window [a, b) and the equipment's daily peak window
      # [peak_window_start_hour, peak_window_end_hour) interpreted in UTC for each calendar day
      # the session spans, sum the intersected minutes.
      total = 0
      for each calendar_day d spanning [a, b):
        peak_start_d = d at hour = peak_window_start_hour
        peak_end_d   = d at hour = peak_window_end_hour     # half-open [start, end)
        overlap = max(0, min(b, peak_end_d) - max(a, peak_start_d))
        total += overlap.total_minutes()
      return total
    precision: "integer minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all except POST /equipment/_clock/advance? No — clock too is auth-gated"

  - priority: 2
    category: auth
    check: "Role is allowed for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every {id} segment in path resolves to an existing row of the correct type, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (authorization_id, lab_id, equipment_id) resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /reservations, POST /equipment"

  - priority: 5
    category: state
    check: "Subject resource is in a state that permits the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "Equipment must be AVAILABLE before any Reservation create or check-in"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /reservations, POST /reservations/{id}/check-in"

  - priority: 7
    category: business_referential
    check: "Cross-entity: Authorization on the reservation MUST be APPROVED, not EXPIRED/REVOKED, and equipment_id+user_id match"
    error_id: ERR_AUTHORIZATION_INVALID
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/check-in"

  - priority: 8
    category: business_safety
    check: "Equipment certificates: calibration_expires_at > now AND safety_inspection_expires_at > now at reservation/check-in time"
    error_id: ERR_CERTIFICATE_EXPIRED
    http_status: 422
    applies_to: "POST /reservations, POST /reservations/{id}/check-in, POST /equipment/{id} (any status flip to AVAILABLE)"

  - priority: 9
    category: business_safety
    check: "User identity_verified == true AND required_training_codes ⊆ user.training_certificates AND sample_type ∈ allowed_sample_types"
    error_id: ERR_QUALIFICATION_NOT_MET
    http_status: 422
    applies_to: "POST /authorizations, POST /authorizations/{id}/approve"

  - priority: 10
    category: business_constraint
    check: "Sharing-scope compatibility: equipment.sharing_scope vs user.affiliation (WITHIN_SCHOOL allows only WITHIN_SCHOOL; INTER_SCHOOL allows WITHIN_SCHOOL+INTER_SCHOOL; EXTERNAL allows all)"
    error_id: ERR_SHARING_SCOPE_VIOLATION
    http_status: 422
    applies_to: "POST /authorizations"

  - priority: 11
    category: business_temporal
    check: "Reservation start_at - now >= equipment.lead_time_hours hours"
    error_id: ERR_LEAD_TIME_VIOLATED
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 12
    category: business_temporal
    check: "[start_at, end_at) aligned to equipment.slot_granularity grid (HOUR/HALF_DAY/DAY), end_at > start_at, duration is positive multiple of granularity"
    error_id: ERR_SLOT_GRID_VIOLATION
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 13
    category: business_constraint
    check: "Duration <= equipment.single_user_duration_limit_hours hours"
    error_id: ERR_DURATION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 14
    category: business_temporal
    check: "[start_at, end_at) does not intersect any SCHEDULED or IN_PROGRESS MaintenanceWindow on this equipment"
    error_id: ERR_MAINTENANCE_BLOCK
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 15
    category: business_temporal
    check: "[start_at, end_at) does not overlap any existing BOOKED or CHECKED_IN reservation on this equipment (half-open intersection)"
    error_id: ERR_RESERVATION_OVERLAP
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 16
    category: business_constraint
    check: "PEAK reservation create: if equipment is in peak window AND another OFF_PEAK BOOKED reservation overlaps the requested slot, the OFF_PEAK reservation is preempted (cancelled with full refund) on PEAK request; OFF_PEAK request cannot preempt PEAK"
    error_id: ERR_PEAK_PRIORITY_VIOLATION
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 17
    category: business_referential
    check: "Reservation cancel/check-in/check-out actor identity matches Reservation.user_id (User role) OR caller is LabOwner of equipment.lab_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /reservations/{id}/cancel, /check-in, /check-out"

  - priority: 18
    category: business_fiscal
    check: "BillingRule publish: platform_fee_bps + lab.revenue_share_bps <= 10000"
    error_id: ERR_FEE_SPLIT_INVALID
    http_status: 422
    applies_to: "POST /equipment/{id}/billing-rules/{rule_id}/publish"

  - priority: 19
    category: business_fiscal
    check: "Settlement: Lab.settlement_balance_cents > 0 (cannot settle a zero or negative balance)"
    error_id: ERR_NOTHING_TO_SETTLE
    http_status: 422
    applies_to: "POST /labs/{id}/settle"

  - priority: 20
    category: business_constraint
    check: "Idempotency: POST /events/identity-verified with same external_user_id is a no-op success after first verification"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /events/identity-verified, POST /events/payment-confirmed"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test harness clock (required: time-gated transitions must be reachable) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance server's logical clock to a target ISO timestamp; drives time-gated transitions (MaintenanceWindow SCHEDULED→IN_PROGRESS, IN_PROGRESS→AWAITING_ACCEPTANCE, Authorization APPROVED→EXPIRED, Reservation BOOKED→NO_SHOW)"
    roles: [PlatformAdmin]
    code: 200
    input: [target_time]
    output: null
    side_effects:
      - "Triggers all due time-gated transitions in deterministic order: MaintenanceWindow first, then Authorization expiry, then Reservation NO_SHOW"

  # --- External-event ingest endpoints (event-driven sync surface for tests) ---
  - method: POST
    path: "/_events/payment-confirmed"
    description: "Idempotent ingest of payment-confirmed event; marks a Reservation as paid (informational) and records inter-department cost transfer"
    roles: [PlatformAdmin]
    code: 200
    input: [reservation_id, external_payment_id]
    output: Reservation
    side_effects:
      - "Records audit event PAYMENT_CONFIRMED"
      - "Inter-department cost transfer ledger row created (User.department debited, Lab.department credited by final_owner_share_cents or estimated_owner_share_cents)"

  - method: POST
    path: "/_events/identity-verified"
    description: "Idempotent ingest of identity-verification VERIFIED event; sets User.identity_verified=true"
    roles: [PlatformAdmin]
    code: 200
    input: [external_user_id]
    output: User
    side_effects:
      - "User.identity_verified := true"

  - method: POST
    path: "/_events/im-notified"
    description: "Test hook simulating IM-system delivery acknowledgement for an authorization or reservation event"
    roles: [PlatformAdmin]
    code: 200
    input: [audit_event_id, im_delivery_id]
    output: null
    side_effects: ["audit event payload updated with im_delivery_id"]

  # --- Labs ---
  - method: POST
    path: "/labs"
    description: "Create a Lab"
    roles: [PlatformAdmin]
    code: 201
    input: [name, institution, department, contact_user_id, revenue_share_bps]
    output: Lab
    side_effects: ["settlement_balance_cents=0, lifetime_settled_cents=0"]

  - method: GET
    path: "/labs/{lab_id}"
    description: "Get lab details"
    roles: [PlatformAdmin, LabOwner]
    code: 200
    input: []
    output: Lab
    side_effects: []

  - method: POST
    path: "/labs/{lab_id}/settle"
    description: "Periodic settlement: zero out unsettled balance, append to lifetime_settled"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Lab
    side_effects:
      - "lifetime_settled_cents += settlement_balance_cents"
      - "settlement_balance_cents := 0"
      - "Audit event SETTLE recorded"

  # --- Equipment ---
  - method: POST
    path: "/equipment"
    description: "Register equipment with profile, certificates, photo, manual"
    roles: [LabOwner]
    code: 201
    input: [lab_id, model, specification, value_tier, sharing_scope, slot_granularity, lead_time_hours, single_user_duration_limit_hours, peak_window_start_hour, peak_window_end_hour, calibration_cert_id, calibration_expires_at, safety_inspection_cert_id, safety_inspection_expires_at, photo_uri, operation_manual_uri, required_training_codes, allowed_sample_types]
    output: Equipment
    side_effects: ["status=AVAILABLE if certificates valid; active_billing_rule_id=null until first PUBLISHED rule"]

  - method: GET
    path: "/equipment/{equipment_id}"
    description: "Get equipment details"
    roles: [PlatformAdmin, LabOwner, User]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: GET
    path: "/equipment"
    description: "List equipment with filters: lab_id, status, sharing_scope, value_tier"
    roles: [PlatformAdmin, LabOwner, User]
    code: 200
    input: ["lab_id?", "status?", "sharing_scope?", "value_tier?", "limit?", "offset?"]
    output: "Equipment[]"
    side_effects: []

  - method: PUT
    path: "/equipment/{equipment_id}"
    description: "Update equipment profile or retire it"
    roles: [LabOwner]
    code: 200
    input: ["status?", "single_user_duration_limit_hours?", "peak_window_start_hour?", "peak_window_end_hour?", "version"]
    output: Equipment
    side_effects: ["status=RETIRED cascades MaintenanceWindow SCHEDULED → REJECTED"]

  # --- Billing rules ---
  - method: POST
    path: "/equipment/{equipment_id}/billing-rules"
    description: "Draft a billing rule"
    roles: [LabOwner]
    code: 201
    input: [mode, internal_rate_per_hour_cents, external_rate_per_hour_cents, inter_school_rate_per_hour_cents, internal_rate_per_sample_cents, external_rate_per_sample_cents, inter_school_rate_per_sample_cents, peak_multiplier_bps, consumables_flat_cents, platform_fee_bps]
    output: BillingRule
    side_effects: ["status=DRAFT, rule_version unassigned until publish"]

  - method: POST
    path: "/equipment/{equipment_id}/billing-rules/{rule_id}/publish"
    description: "Publish a draft billing rule (DRAFT → PUBLISHED)"
    roles: [LabOwner]
    code: 200
    input: []
    output: BillingRule
    side_effects:
      - "Previous PUBLISHED rule → SUPERSEDED"
      - "Equipment.active_billing_rule_id := this rule.id"
      - "rule_version assigned"

  - method: GET
    path: "/equipment/{equipment_id}/billing-rules"
    description: "List billing rules for an equipment"
    roles: [PlatformAdmin, LabOwner]
    code: 200
    input: ["status?"]
    output: "BillingRule[]"
    side_effects: []

  # --- Maintenance windows ---
  - method: POST
    path: "/equipment/{equipment_id}/maintenance-windows"
    description: "Create a maintenance window (periodic or ad-hoc)"
    roles: [LabOwner]
    code: 201
    input: [kind, start_at, end_at, maintenance_notes]
    output: MaintenanceWindow
    side_effects:
      - "If kind=AD_HOC and start_at <= now < end_at: Equipment AVAILABLE → MAINTENANCE immediately"
      - "Cancels overlapping BOOKED reservations with full refund"

  - method: POST
    path: "/maintenance-windows/{window_id}/accept"
    description: "Accept maintenance completion (AWAITING_ACCEPTANCE → ACCEPTED)"
    roles: [LabOwner, PlatformAdmin]
    code: 200
    input: [acceptance_notes]
    output: MaintenanceWindow
    side_effects: ["Equipment.status MAINTENANCE → AVAILABLE if no other window active; archived_record_uri set"]

  - method: POST
    path: "/maintenance-windows/{window_id}/reject"
    description: "Reject maintenance completion (AWAITING_ACCEPTANCE → REJECTED); spawns follow-up AD_HOC window"
    roles: [LabOwner, PlatformAdmin]
    code: 200
    input: [acceptance_notes]
    output: MaintenanceWindow
    side_effects: ["Follow-up AD_HOC MaintenanceWindow created with start_at=now, end_at=now+24h"]

  # --- Users ---
  - method: POST
    path: "/users"
    description: "Create user; idempotent on external_user_id"
    roles: [PlatformAdmin]
    code: 201
    input: [external_user_id, full_name, department, affiliation, training_certificates]
    output: User
    side_effects: ["identity_verified=false initially (gated by /_events/identity-verified)"]

  - method: GET
    path: "/users/{user_id}"
    description: "Get user details"
    roles: [PlatformAdmin, LabOwner, User]
    code: 200
    input: []
    output: User
    side_effects: []

  # --- Authorizations ---
  - method: POST
    path: "/equipment/{equipment_id}/authorizations"
    description: "Request usage authorization for equipment"
    roles: [User]
    code: 201
    input: [user_id, sample_type, urgency]
    output: Authorization
    side_effects:
      - "Runs authorization_eligibility_score; passes_gate must be true"
      - "status=PENDING_OWNER"
      - "AuditEvent CREATE row written"

  - method: POST
    path: "/authorizations/{authorization_id}/approve"
    description: "Approve an authorization (owner step or platform step)"
    roles: [LabOwner, PlatformAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: ["Per state machine — STANDARD/URGENT HIGH_VALUE skip platform step; APPROVED writes expires_at"]

  - method: POST
    path: "/authorizations/{authorization_id}/reject"
    description: "Reject an authorization"
    roles: [LabOwner, PlatformAdmin]
    code: 200
    input: [rejection_reason]
    output: Authorization
    side_effects: []

  - method: POST
    path: "/authorizations/{authorization_id}/revoke"
    description: "Revoke an APPROVED authorization"
    roles: [LabOwner, PlatformAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects:
      - "status=REVOKED"
      - "Future-dated BOOKED reservations cascade-cancel with full refund"
      - "Lab.settlement_balance_cents debited by sum of estimated_owner_share_cents of cancelled reservations"

  # --- Reservations ---
  - method: POST
    path: "/equipment/{equipment_id}/reservations"
    description: "Create a reservation (BOOKED)"
    roles: [User]
    code: 201
    input: [user_id, authorization_id, start_at, end_at, requested_sample_count]
    output: Reservation
    side_effects:
      - "billing_rule_id_pinned := equipment.active_billing_rule_id"
      - "estimated_fee_cents, estimated_owner_share_cents, estimated_platform_fee_cents computed via estimated_fee"
      - "Lab.settlement_balance_cents += estimated_owner_share_cents"
      - "priority_tier computed; if PEAK and an OFF_PEAK BOOKED reservation overlaps the requested slot, the OFF_PEAK reservation is preempted (cancelled with full refund) instead of rejecting the PEAK request"

  - method: GET
    path: "/reservations/{reservation_id}"
    description: "Get reservation details"
    roles: [PlatformAdmin, LabOwner, User]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/reservations/{reservation_id}/check-in"
    description: "User checks in to start the session"
    roles: [User]
    code: 200
    input: []
    output: Reservation
    side_effects: ["UsageLog created; status CHECKED_IN"]

  - method: POST
    path: "/reservations/{reservation_id}/check-out"
    description: "User checks out; computes final_fee"
    roles: [User]
    code: 200
    input: [actual_sample_count, status_handover, "abnormal_event_code?"]
    output: Reservation
    side_effects:
      - "UsageLog.check_out_at = now"
      - "final_fee_cents, final_owner_share_cents, final_platform_fee_cents computed via final_fee"
      - "Lab.settlement_balance_cents adjusted by (final_owner_share - estimated_owner_share)"
      - "If status_handover=ABNORMAL: spawn AD_HOC MaintenanceWindow, Equipment AVAILABLE → MAINTENANCE"

  - method: POST
    path: "/reservations/{reservation_id}/cancel"
    description: "Cancel a BOOKED reservation"
    roles: [User, LabOwner]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "cancellation_refund_bps set per cancellation_refund_policy"
      - "Lab.settlement_balance_cents debited by accrued estimated_owner_share * refund_bps / 10000"

  - method: GET
    path: "/reservations"
    description: "List reservations with filters"
    roles: [PlatformAdmin, LabOwner, User]
    code: 200
    input: ["equipment_id?", "user_id?", "status?", "start_at_from?", "start_at_to?", "limit?", "offset?"]
    output: "Reservation[]"
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/audit-events"
    description: "List audit events for reservation/authorization changes"
    roles: [PlatformAdmin, LabOwner]
    code: 200
    input: ["subject_type?", "subject_id?", "actor_user_id?", "limit?", "offset?"]
    output: "AuditEvent[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "X-User-Role or X-User-ID header missing"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller role/identity does not satisfy endpoint RBAC or ownership check"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body-referenced foreign key does not resolve"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state permitting the requested transition"

  - id: ERR_EQUIPMENT_UNAVAILABLE
    http: 409
    condition: "Equipment.status != AVAILABLE at reservation create or check-in"

  - id: ERR_AUTHORIZATION_INVALID
    http: 422
    condition: "Authorization missing, not APPROVED, expired, revoked, or scoped to different equipment/user"

  - id: ERR_AUTHORIZATION_ALREADY_DECIDED
    http: 409
    condition: "Two approvers race on the same Authorization, or revoke after another decision"

  - id: ERR_CERTIFICATE_EXPIRED
    http: 422
    condition: "calibration_expires_at or safety_inspection_expires_at <= now"

  - id: ERR_QUALIFICATION_NOT_MET
    http: 422
    condition: "User fails authorization_eligibility_score (training, sample, affiliation, or identity)"

  - id: ERR_SHARING_SCOPE_VIOLATION
    http: 422
    condition: "User.affiliation incompatible with equipment.sharing_scope"

  - id: ERR_LEAD_TIME_VIOLATED
    http: 422
    condition: "start_at - now < equipment.lead_time_hours hours"

  - id: ERR_SLOT_GRID_VIOLATION
    http: 422
    condition: "Reservation window not aligned to slot_granularity grid or duration not positive multiple of granularity"

  - id: ERR_DURATION_LIMIT_EXCEEDED
    http: 422
    condition: "Duration > single_user_duration_limit_hours"

  - id: ERR_MAINTENANCE_BLOCK
    http: 409
    condition: "Requested slot intersects SCHEDULED or IN_PROGRESS MaintenanceWindow"

  - id: ERR_RESERVATION_OVERLAP
    http: 409
    condition: "Requested slot half-open intersects existing BOOKED/CHECKED_IN reservation"

  - id: ERR_PEAK_PRIORITY_VIOLATION
    http: 409
    condition: "Reserved internally — OFF_PEAK request attempted to preempt an existing PEAK reservation (forbidden direction)"

  - id: ERR_FEE_SPLIT_INVALID
    http: 422
    condition: "platform_fee_bps + lab.revenue_share_bps > 10000 at BillingRule publish"

  - id: ERR_BILLING_RULE_RACED
    http: 409
    condition: "Reservation pin lost a race with BillingRule publish; client should retry"

  - id: ERR_NOTHING_TO_SETTLE
    http: 422
    condition: "Lab.settlement_balance_cents <= 0 at /labs/{id}/settle"

  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 409
    condition: "Repeated external event with same idempotency key but conflicting payload"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PUT version field does not match current row.version (OCC)"

  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed body, missing required field, unparseable timestamp, out-of-range integer"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator — creates labs, users, ingests external events, runs settlements and clock"
    identity: opaque
    exclusive_operations:
      - "POST /labs"
      - "POST /labs/{id}/settle"
      - "POST /users"
      - "POST /_clock/advance"
      - "POST /_events/payment-confirmed"
      - "POST /_events/identity-verified"
      - "POST /_events/im-notified"
    shared_operations:
      - "GET /labs/{id} (with LabOwner)"
      - "GET /equipment, GET /equipment/{id} (with LabOwner, User)"
      - "GET /equipment/{id}/billing-rules (with LabOwner)"
      - "POST /authorizations/{id}/approve when Authorization.status=PENDING_PLATFORM (with LabOwner only at PENDING_OWNER)"
      - "POST /authorizations/{id}/reject (with LabOwner)"
      - "POST /authorizations/{id}/revoke (with LabOwner)"
      - "POST /maintenance-windows/{id}/accept|reject (with LabOwner)"
      - "GET /reservations, GET /reservations/{id} (with LabOwner, User)"
      - "GET /audit-events (with LabOwner)"

  - name: LabOwner
    description: "Lab administrator — manages owned equipment, billing rules, owner-step approvals, maintenance"
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /equipment (must be lab.contact_user_id of the target lab_id)"
      - "PUT /equipment/{id} (must own equipment.lab_id)"
      - "POST /equipment/{id}/billing-rules"
      - "POST /equipment/{id}/billing-rules/{rule_id}/publish"
      - "POST /equipment/{id}/maintenance-windows"
      - "POST /authorizations/{id}/approve when Authorization.status=PENDING_OWNER"
    shared_operations:
      - "GET /labs/{id} (only own lab)"
      - "GET /equipment, GET /equipment/{id} (with PlatformAdmin, User)"
      - "POST /authorizations/{id}/reject (with PlatformAdmin)"
      - "POST /authorizations/{id}/revoke (with PlatformAdmin)"
      - "POST /maintenance-windows/{id}/accept|reject (with PlatformAdmin)"
      - "POST /reservations/{id}/cancel (with User — only on equipment they own)"
      - "GET /reservations, GET /audit-events (with PlatformAdmin)"

  - name: User
    description: "End user requesting authorizations and booking equipment"
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /equipment/{id}/authorizations (user_id must equal X-User-ID)"
      - "POST /equipment/{id}/reservations (user_id must equal X-User-ID)"
      - "POST /reservations/{id}/check-in (must be Reservation.user_id)"
      - "POST /reservations/{id}/check-out (must be Reservation.user_id)"
    shared_operations:
      - "GET /equipment, GET /equipment/{id} (with PlatformAdmin, LabOwner)"
      - "GET /users/{id} (only own user)"
      - "POST /reservations/{id}/cancel (with LabOwner)"
      - "GET /reservations (only own user_id filter)"
