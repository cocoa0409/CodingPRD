  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: program_state_gate_beats_coverage_ceiling_on_execute
        grounds:
          - validations[priority=7]
          - validations[priority=20]
          - errors.ERR_PROGRAM_NOT_ACTIVE
          - errors.ERR_COVERAGE_LIMIT_EXCEEDED
        distinguishing_aspect: |
          One execute call violates both the program-state gate (priority 7) and the
          coverage ceiling (priority 20); the response must be 409 ERR_PROGRAM_NOT_ACTIVE,
          not 422 ERR_COVERAGE_LIMIT_EXCEEDED. Activating the program and repeating the
          identical call then yields 422 ERR_COVERAGE_LIMIT_EXCEEDED, proving the
          lower-priority condition was live and merely masked.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with max_coverage_pct 60.00, min_coverage_pct 15.00, max_single_counterparty_pct 100.00."
            - "One PENDING_APPROVAL HedgeProgram with consumption_basis_gallons 11000000 and one PROPOSED 8000000-gallon SWAP, whose execution would take delta coverage to 72.7272...%."
            - "Counterparty credit_limit_usd 2000000.00 so the credit ceiling is not the binding constraint."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-PP1", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRA", legal_name: "Dealer A Bank NA", credit_rating: "A", credit_limit_usd: 2000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_a_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 6000000 }
              as: FuelAnalyst
              captures: { f2_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f2_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-PP1", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "TRANSATLANTIC"], target_coverage_pct: 55.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v1: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_a_id}", instrument_type: "SWAP", notional_gallons: 8000000, maturity_month: "2027-03", strike_usd_per_gal: 2.4000, expected_hedge_program_version: "${prog_v1}" }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: "u_trm_1"
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
          assert:
            - "the first execute returns 409 with error_id ERR_PROGRAM_NOT_ACTIVE (priority 7 wins)"
            - "the response of the first execute is NOT 422 and NOT error_id ERR_COVERAGE_LIMIT_EXCEEDED"
            - "the activate returns 200 because planned_coverage_pct_delta 72.73 clears min_coverage_pct 15.00 and activation never checks the ceiling"
            - "the second execute returns 422 with error_id ERR_COVERAGE_LIMIT_EXCEEDED (72.7272... exceeds 60.00)"
            - "HedgeInstrument.${inst_id}.trade_status == PROPOSED after both attempts"
            - "HedgeProgram.${prog_id}.hedged_gallons == 0 and coverage_pct_delta == 0.00"
            - "Counterparty.${cp_a_id}.utilized_credit_usd == 0.00"

      - name: weight_limit_beats_missing_active_contract_on_directive_approve
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors.ERR_TANKERING_WEIGHT_LIMIT
          - errors.ERR_NO_ACTIVE_SUPPLY_CONTRACT
        distinguishing_aspect: |
          At approval the directive violates both the weight envelope (priority 9,
          422) and the ACTIVE-contract requirement (priority 14, 409); the 422 must be
          returned even though it carries the numerically higher status code, so an
          implementation that orders by HTTP severity answers 409 and fails. Revising the
          uplift down to a legal 3000 gallons then surfaces
          ERR_NO_ACTIVE_SUPPLY_CONTRACT, proving the masked condition was live.
        test_recipe:
          setup:
            - "Logical clock at 2027-02-10T00:00:00Z while the directive is proposed."
            - "Station ORD with an ACTIVE contract running 2027-01-01 to 2027-06-30 and 500000 gallons of stock."
            - "Station DFW with a contract running only 2027-01-01 to 2027-02-28."
            - "One NARROWBODY FlightLeg with uplift_cap_gallons 10600.00 carrying a PROPOSED directive for 12000 gallons (the create endpoint does not apply the weight check)."
            - "Clock then advanced to 2027-03-15T00:00:00Z so the DFW contract has become EXPIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-PP2", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 150000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /fuel/stations"
              payload: { iata_code: "DFW", name: "Dallas Fort Worth", into_plane_fee_usd_per_gal: 0.0800, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { dfw_id: $.data.id }
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${dfw_id}/supply-contracts"
              payload: { contract_ref: "DFW-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.9000, differential_usd_per_gal: 0.1200, term_start_date: "2027-01-01", term_end_date: "2027-02-28", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
              captures: { dfw_contract_id: $.data.id }
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 500000, reason: "Opening physical stock" }
              as: FuelOpsController
            - call: "POST /fuel/flight-legs"
              payload: { flight_number: "UA400", departure_date: "2027-03-20", origin_station_id: "${ord_id}", destination_station_id: "${dfw_id}", fleet_type: "NARROWBODY", planned_block_minutes: 210, planned_burn_gallons: 14500, tank_capacity_gallons: 26000, payload_lbs: 22000, max_takeoff_payload_lbs: 45000, landing_weight_lbs: 128000, max_landing_weight_lbs: 200000 }
              as: FuelOpsController
              captures: { leg_id: $.data.id, leg_v: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_id}/tankering-directives"
              payload: { requested_uplift_gallons: 12000, expected_flight_leg_version: "${leg_v}" }
              as: FuelAnalyst
              captures: { dir_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-15T00:00:00Z" }
              as: RiskPolicyAdmin
          trigger:
            - call: "POST /fuel/tankering-directives/${dir_id}/approve"
              payload: {}
              as: FuelOpsController
            - call: "POST /fuel/tankering-directives/${dir_id}/request-revision"
              payload: { revision_note: "Cap exceeded; trim to the envelope." }
              as: FuelOpsController
            - call: "POST /fuel/tankering-directives/${dir_id}/revise"
              payload: { requested_uplift_gallons: 3000 }
              as: FuelAnalyst
          assert:
            - "FlightLeg.${leg_id}.uplift_cap_gallons == 10600.00"
            - "the approve returns 422 with error_id ERR_TANKERING_WEIGHT_LIMIT (priority 9 wins)"
            - "the approve response is NOT 409 and NOT error_id ERR_NO_ACTIVE_SUPPLY_CONTRACT"
            - "TankeringDirective.${dir_id}.status == PROPOSED after the rejected approve, with pinned_origin_price_usd_per_gal still null"
            - "the request-revision returns 200 and TankeringDirective.${dir_id}.status == NEEDS_REVISION"
            - "the revise returns 409 with error_id ERR_NO_ACTIVE_SUPPLY_CONTRACT because the DFW contract is EXPIRED at 2027-03-15"
            - "TankeringDirective.${dir_id}.requested_uplift_gallons == 12000 and revision_count == 0 after the failed revise"

      - name: contract_term_overlap_beats_duplicate_contract_ref
        grounds:
          - validations[priority=12]
          - validations[priority=17]
          - errors.ERR_CONTRACT_TERM_OVERLAP
          - errors.ERR_DUPLICATE_CONTRACT_REF
        distinguishing_aspect: |
          Both candidate errors carry HTTP 409, so the pair can only be told apart by
          error_id: a request that both reuses contract_ref ORD-2027-A and overlaps the
          existing term must answer ERR_CONTRACT_TERM_OVERLAP, and only once the term is
          moved to a legal non-overlapping window with an 8-day changeover gap does the
          same duplicate ref surface as ERR_DUPLICATE_CONTRACT_REF.
        test_recipe:
          setup:
            - "Logical clock at 2027-02-10T00:00:00Z."
            - "Station ORD with exactly one SupplyContract, contract_ref ORD-2027-A, term 2027-01-01 to 2027-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-2027-A", index_basis: "PLATTS_USGC", index_price_usd_per_gal: 2.4000, differential_usd_per_gal: 0.0250, term_start_date: "2027-01-01", term_end_date: "2027-06-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-2027-A", index_basis: "PLATTS_NWE", index_price_usd_per_gal: 2.5000, differential_usd_per_gal: 0.0300, term_start_date: "2027-03-01", term_end_date: "2027-04-30", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations/${ord_id}/supply-contracts"
              payload: { contract_ref: "ORD-2027-A", index_basis: "PLATTS_NWE", index_price_usd_per_gal: 2.5000, differential_usd_per_gal: 0.0300, term_start_date: "2027-07-08", term_end_date: "2027-12-31", min_monthly_gallons: 0, max_monthly_gallons: 9000000 }
              as: RiskPolicyAdmin
          assert:
            - "the first attempt returns 409 with error_id ERR_CONTRACT_TERM_OVERLAP (priority 12 wins over priority 17)"
            - "the first attempt does NOT return error_id ERR_DUPLICATE_CONTRACT_REF"
            - "the second attempt returns 409 with error_id ERR_DUPLICATE_CONTRACT_REF, and NOT ERR_CONTRACT_TERM_OVERLAP or ERR_CONTRACT_BUFFER_VIOLATION, because 2027-07-08 minus 2027-06-30 is an 8-day gap"
            - "GET /fuel/stations/${ord_id}/supply-contracts returns exactly 1 row"
            - "SupplyContract.${c1_id}.all_in_price_usd_per_gal == 2.4700 and SupplyContract.${c1_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: coverage_ceiling_exact_equality_versus_one_gallon_epsilon
        grounds:
          - validations[priority=20]
          - calculations.hedge_coverage_ratio
          - entities.HedgeProgram.fields.coverage_pct_delta
          - errors.ERR_COVERAGE_LIMIT_EXCEEDED
        distinguishing_aspect: |
          6600000 delta gallons over an 11000000-gallon basis is exactly 60.00%, equal to
          max_coverage_pct, and must be allowed because the ceiling is inclusive; adding
          one single gallon makes the unrounded ratio 60.0000090909...% which must be
          rejected even though the stored two-decimal field would still read 60.00. Any
          implementation that compares the rounded field accepts the epsilon trade and
          fails.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with max_coverage_pct 60.00, min_coverage_pct 15.00 and max_single_counterparty_pct 100.00."
            - "Counterparty credit_limit_usd 2000000.00."
            - "One ACTIVE HedgeProgram, consumption_basis_gallons 11000000, holding a PROPOSED 6600000-gallon SWAP and a PROPOSED 1-gallon SWAP."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-BP1", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/counterparties"
              payload: { counterparty_code: "DLRA", legal_name: "Dealer A Bank NA", credit_rating: "AA", credit_limit_usd: 2000000.00 }
              as: RiskPolicyAdmin
              captures: { cp_a_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f1_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f1_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 6000000 }
              as: FuelAnalyst
              captures: { f2_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${f2_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-BP1", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "TRANSATLANTIC"], target_coverage_pct: 60.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v1: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_a_id}", instrument_type: "SWAP", notional_gallons: 6600000, maturity_month: "2027-03", strike_usd_per_gal: 2.4000, expected_hedge_program_version: "${prog_v1}" }
              as: FuelAnalyst
              captures: { big_id: $.data.id }
            - call: "GET /fuel/hedge-programs/${prog_id}"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v2: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_a_id}", instrument_type: "SWAP", notional_gallons: 1, maturity_month: "2027-03", strike_usd_per_gal: 2.4000, expected_hedge_program_version: "${prog_v2}" }
              as: FuelAnalyst
              captures: { eps_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: "u_trm_1"
          trigger:
            - call: "POST /fuel/hedge-instruments/${big_id}/execute"
              payload: {}
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-instruments/${eps_id}/execute"
              payload: {}
              as: TreasuryRiskManager
          assert:
            - "the first execute returns 200: exact equality with max_coverage_pct is inside the limit"
            - "HedgeProgram.${prog_id}.coverage_pct_delta == 60.00 and delta_adjusted_gallons == 6600000.00"
            - "HedgeInstrument.${big_id}.margin_requirement_usd == 396000.00"
            - "the second execute returns 422 with error_id ERR_COVERAGE_LIMIT_EXCEEDED"
            - "HedgeInstrument.${eps_id}.trade_status == PROPOSED and margin_requirement_usd == 0"
            - "HedgeProgram.${prog_id}.coverage_pct_delta is still 60.00 and hedged_gallons is still 6600000 after the rejection"
            - "Counterparty.${cp_a_id}.utilized_credit_usd == 396000.00 and utilization_pct == 19.80"

      - name: effectiveness_lower_bound_inclusive_after_rounding
        grounds:
          - calculations.effectiveness_ratio
          - entities.EffectivenessTest.fields.cumulative_ratio
          - entities.EffectivenessTest.fields.result
        distinguishing_aspect: |
          The PASS test reads the ratio AFTER rounding to four decimals: -79995.00 over
          100000.00 is 0.79995 unrounded, below EFFECTIVENESS_MIN, but rounds half-up to
          exactly 0.8000 and therefore PASSes on an inclusive bound, while -79994.00 over
          the same base rounds to 0.7999 and FAILs. One cent of hedge change separates the
          two outcomes.
        test_recipe:
          setup:
            - "One ACTIVE HedgeProgram, consumption_basis_gallons 11000000, with two EXECUTED and UNDESIGNATED 1000000-gallon SWAPs and no prior effectiveness tests."
          setup_api_calls:
