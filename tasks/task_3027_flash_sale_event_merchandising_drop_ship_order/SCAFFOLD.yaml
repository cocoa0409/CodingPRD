# =============================================================================
# PRD Benchmark Seed Tables — task_3027_flash_sale_event_merchandising_drop_ship_order
# Scenario: Flash-Sale Event Merchandising & Drop-Ship Order Aggregation (Zulily)
#
# Complexity profile: EXPERT
#   primary_archetype:   workflow_orchestration
#   secondary_archetype: posture_driven_gating
#   complexity_layers:   optimistic_concurrency, cascading_side_effects,
#                        dual_variant_calculation, ops_run_checkpoint,
#                        derived_field_reconciliation, scheduled_deferred_actions
# =============================================================================

scenario: |
  Flash-Sale Event Merchandising & Drop-Ship Order Aggregation (Zulily): time-boxed daily
  event launches with curated vendor-branded shops, order aggregation where customer orders
  are collected before goods are purchased from vendors, extended ship-time expectations
  disclosed at purchase with cancellation rights, vendor purchase order issuance after demand
  is known with fill-rate enforcement, cross-dock consolidation of many vendor shipments into
  one customer parcel, oversell and short-ship handling with automatic refunds, event
  performance analytics feeding future vendor scheduling, final-sale return policy exceptions
  and customer-service credit rules

domain_name: flash-sale-drop-ship
# Flat URL surface: every collection is a peer top-level path (no nesting),
# which is why the prefix is empty. Entity relationships are carried by
# `FK -> Parent.id` fields and by sub-resource GETs, never by path nesting.
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - derived_field_reconciliation
    - scheduled_deferred_actions

  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregated_peer_roles
  consistency_model: saga

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (13 entities)
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Vendor
    parent: null
    common_fields: true      # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered vendor business name" }
      - { name: vendor_tier, type: enum, source: input, description: "STANDARD | PREMIER | STRATEGIC; drives the fill-rate floor and analytics weighting", constraints: "enum: STANDARD | PREMIER | STRATEGIC; default STANDARD" }
      - { name: standing, type: enum, source: computed, description: "EXCELLENT | GOOD | PROBATION | SUSPENDED; derived from rolling fill rates and shipment lateness by run_event_checkpoint", constraints: "enum: EXCELLENT | GOOD | PROBATION | SUSPENDED" }
      - { name: fill_rate_floor_pct, type: number, source: computed, description: "Minimum ratio (0.0000-1.0000) of each purchase order the vendor must ship; derived from vendor_tier and standing" }
      - { name: rolling_fill_rate_units_shipped, type: integer, source: computed, description: "Numerator of the rolling fill rate: units shipped across closed purchase orders in the trailing window" }
      - { name: rolling_fill_rate_units_ordered, type: integer, source: computed, description: "Denominator of the rolling fill rate: units ordered across closed purchase orders in the trailing window" }
      - { name: standing_evaluated_at, type: datetime, source: computed, description: "Logical timestamp of the run_event_checkpoint that last recomputed standing; null before the first checkpoint" }

  # ---------------------------------------------------------------------------
  - name: Shop
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; owning vendor whose brand fronts this curated shop" }
      - { name: shop_name, type: string, source: input, description: "Vendor-branded shop display name shown on the event landing page" }
      - { name: shop_status, type: enum, source: computed, description: "DRAFT | SCHEDULED | OPEN | SUSPENDED | CLOSED; SUSPENDED is driven by the owning vendor's standing, not by direct input", constraints: "enum: DRAFT | SCHEDULED | OPEN | SUSPENDED | CLOSED" }
      - { name: curated_sku_count, type: integer, source: computed, description: "Number of ACTIVE listings committed across this shop's SCHEDULED and LIVE events; listings of DRAFT events do not count" }

  # ---------------------------------------------------------------------------
  - name: Event
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; shop under which this time-boxed event launches" }
      - { name: event_title, type: string, source: input, description: "Customer-facing event title (e.g. 'Fall Outerwear Daily Event')" }
      - { name: starts_at, type: datetime, source: input, description: "Scheduled launch instant of the time-boxed window" }
      - { name: ends_at, type: datetime, source: input, description: "Scheduled close instant; must be strictly after starts_at and no more than 72 hours later" }
      - { name: ship_time_quote_days, type: integer, source: input, description: "Extended ship-time expectation disclosed to the customer at purchase, in days from order placement" }
      - { name: event_status, type: enum, source: computed, description: "DRAFT | SCHEDULED | LIVE | CLOSED | CANCELLED; derived from the logical clock, the close action and the cancellation cascade", constraints: "enum: DRAFT | SCHEDULED | LIVE | CLOSED | CANCELLED" }
      - { name: checkpoint_index, type: integer, source: computed, description: "Number of run_event_checkpoint operations applied to this event; starts at 0" }
      - { name: units_ordered_total, type: integer, source: computed, description: "Sum of quantity across Confirmations in CONFIRMED or PARTIALLY_FULFILLED status for this event" }
      - { name: units_po_committed_total, type: integer, source: computed, description: "Sum of quantity_ordered across this event's PurchaseOrders" }
      - { name: oversell_units_total, type: integer, source: computed, description: "Sum of oversold_units across this event's Confirmations; never negative; recomputed on every close and every short-ship record" }
      - { name: net_contribution_cents, type: integer, source: computed, description: "Output of calculations.event_net_contribution; frozen at closure in the realized_on_closure variant, recomputed while LIVE by run-event-checkpoint" }
      - { name: net_contribution_variant, type: enum, source: computed, description: "PROJECTED_WHILE_LIVE while LIVE | REALIZED_ON_CLOSURE once event_status == CLOSED", constraints: "enum: PROJECTED_WHILE_LIVE | REALIZED_ON_CLOSURE" }
      - { name: closed_at, type: datetime, source: computed, description: "Instant of the LIVE to CLOSED transition; null until closed. The realized_on_closure variant is frozen against this instant." }
      - { name: open_event_for_shop, type: boolean, source: computed, description: "True while event_status is LIVE; used by the shop-level in-flight gate" }

  # ---------------------------------------------------------------------------
  - name: Listing
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; event this listing slot is merchandised into" }
      - { name: vendor_sku, type: string, source: input, description: "Vendor's own SKU code; unique per (event_id, vendor_sku)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Customer-facing unit price in cents; must be strictly positive" }
      - { name: vendor_unit_cost_cents, type: integer, source: input, description: "Vendor cost per unit in cents; determines net landed cost" }
      - { name: allocation_units, type: integer, source: input, description: "Units the vendor has committed to make available; 0 means uncapped-then-closed" }
      - { name: units_ordered, type: integer, source: computed, description: "Units of this listing on Confirmations in PENDING_VENDOR or VENDOR_CONFIRMED status; incremented on confirm" }
      - { name: oversell_units, type: integer, source: computed, description: "Non-negative units of this listing sold beyond allocation_units; 0 when allocation_units is 0" }
      - { name: listing_status, type: enum, source: computed, description: "DRAFT | ACTIVE | SOLD_OUT | WITHDRAWN", constraints: "enum: DRAFT | ACTIVE | SOLD_OUT | WITHDRAWN" }
      - { name: reveal_at, type: datetime, source: input, description: "Instant at which this listing becomes visible; drives the time-boxed reveal window" }

  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Customer email address; unique across customers (case-insensitive)" }
      - { name: full_name, type: string, source: input, description: "Customer display name" }
      - { name: account_status, type: enum, source: computed, description: "ACTIVE | RESTRICTED | CLOSED", constraints: "enum: ACTIVE | RESTRICTED | CLOSED" }
      - { name: store_credit_balance_cents, type: integer, source: computed, description: "CS-issued store credit available to spend; never negative" }
      - { name: refund_balance_cents, type: integer, source: computed, description: "Cash-refund amount owed to the customer for oversells, short-ships and cancellations; never negative" }
      - { name: lifetime_credit_issued_cents, type: integer, source: computed, description: "Cumulative goodwill credit issued by CustomerService across all orders; used for the annual credit cap" }

  # ---------------------------------------------------------------------------
  - name: CustomerOrder
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; buyer who placed the aggregate order" }
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; usually null because one order aggregates listings across many events" }
      - { name: order_status, type: enum, source: computed, description: "AGGREGATING | AWAITING_VENDOR | PARTIALLY_FILLED | CROSS_DOCKED | SHIPPED | DELIVERED | CANCELLED | RETURNED", constraints: "enum: AGGREGATING | AWAITING_VENDOR | PARTIALLY_FILLED | CROSS_DOCKED | SHIPPED | DELIVERED | CANCELLED | RETURNED" }
      - { name: payment_status, type: enum, source: computed, description: "AUTHORIZED | CAPTURED | PARTIALLY_REFUNDED | REFUNDED; evolves on an axis independent of order_status", constraints: "enum: AUTHORIZED | CAPTURED | PARTIALLY_REFUNDED | REFUNDED" }
      - { name: disclosed_ship_time_days, type: integer, source: computed, description: "Maximum ship_time_quote_days across the order's Confirmation lines; recomputed on every confirm and on every add; this is the figure disclosed at purchase" }
      - { name: cancellation_window_ends_at, type: datetime, source: computed, description: "Instant through which the customer may cancel with full refund: min(confirmation.confirmed_at + 30 hours, line.event.ends_at) over the order's lines" }
      - { name: cancellation_waived, type: boolean, source: computed, description: "True once any line reaches PURCHASE_ORDER_ISSUED or beyond; a cancellation request then fails with ERR_CANCELLATION_WINDOW_CLOSED" }
      - { name: order_total_cents, type: integer, source: computed, description: "Sum of unit_price_cents * quantity over non-refunded Confirmations" }
      - { name: refund_due_cents, type: integer, source: computed, description: "Amount still owed back to the customer from oversells, short-ships and cancellations on this order" }
      - { name: parcel_consolidated_at, type: datetime, source: computed, description: "Instant the cross-dock consolidation created the customer parcel; null until CROSS_DOCKED" }
      - { name: ready_to_ship, type: boolean, source: computed, description: "True once every non-CANCELLED order line is in a terminal-allocation state (SHIPPED, SHORT_SHIPPED or CANCELLED) or explicitly dropped by a line-level cancellation" }

  # ---------------------------------------------------------------------------
  - name: Confirmation
    parent: CustomerOrder
    common_fields: true
    fields:
      - { name: customer_order_id, type: string, source: system, description: "FK -> CustomerOrder.id; aggregate order this line belongs to" }
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; listing slot purchased" }
      - { name: quantity, type: integer, source: input, description: "Units requested on this line at order-placement time" }
      - { name: confirmation_status, type: enum, source: computed, description: "PENDING_AGGREGATION | PENDING_VENDOR | VENDOR_CONFIRMED | PURCHASE_ORDER_ISSUED | IN_TRANSIT_TO_CROSS_DOCK | RECEIVED_AT_CROSS_DOCK | SHIPPED | SHORT_SHIPPED | CANCELLED", constraints: "enum: PENDING_AGGREGATION | PENDING_VENDOR | VENDOR_CONFIRMED | PURCHASE_ORDER_ISSUED | IN_TRANSIT_TO_CROSS_DOCK | RECEIVED_AT_CROSS_DOCK | SHIPPED | SHORT_SHIPPED | CANCELLED" }
      - { name: confirmed_units, type: integer, source: computed, description: "Units the vendor has confirmed for this line; always <= quantity" }
      - { name: short_shipped_units, type: integer, source: computed, description: "quantity - confirmed_units; positive only after the PO is closed short" }
      - { name: oversold_units, type: integer, source: computed, description: "Units of this line that exceeded the listing allocation at confirm time; non-negative" }
      - { name: line_unit_price_cents, type: integer, source: computed, description: "Frozen copy of listing.unit_price_cents captured at PENDING_AGGREGATION to SHORT_LINE promotion" }
      - { name: refund_due_cents, type: integer, source: computed, description: "Refund owed on this line: oversell refund + short-ship refund + cancellation refund; never negative" }
      - { name: confirmed_at, type: datetime, source: computed, description: "Instant this line left PENDING_AGGREGATION for PENDING_VENDOR; anchors the cancellation window" }

  # ---------------------------------------------------------------------------
  - name: PurchaseOrder
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; vendor the buy is placed with" }
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; event whose aggregated demand produced this buy" }
      - { name: po_status, type: enum, source: computed, description: "DRAFT | ISSUED | PARTIALLY_FILLED | FILLED | CLOSED_SHORT | CANCELLED", constraints: "enum: DRAFT | ISSUED | PARTIALLY_FILLED | FILLED | CLOSED_SHORT | CANCELLED" }
      - { name: quantity_ordered, type: integer, source: computed, description: "Total units on this buy across its POLines; frozen at ISSUED" }
      - { name: quantity_shipped, type: integer, source: computed, description: "Units the vendor has reported shipped on this buy" }
      - { name: fill_rate_pct, type: number, source: computed, description: "quantity_shipped / quantity_ordered, 4 decimal places; frozen when the PO reaches FILLED or CLOSED_SHORT" }
      - { name: fill_rate_floor_pct, type: number, source: computed, description: "Snapshot of vendor.fill_rate_floor_pct taken at ISSUED; the enforcement threshold for this buy" }
      - { name: due_at, type: datetime, source: computed, description: "Instant the vendor must ship by: issued_at + 14 days; a later shipment is late" }
      - { name: issued_at, type: datetime, source: computed, description: "Instant the buy was issued; null while DRAFT" }
      - { name: closed_at, type: datetime, source: computed, description: "Instant the buy reached FILLED, CLOSED_SHORT or CANCELLED; null while DRAFT, ISSUED or PARTIALLY_FILLED. The trailing-window filter of calculations.vendor_rolling_fill_rate reads this field." }

  # ---------------------------------------------------------------------------
  - name: POLine
    parent: PurchaseOrder
    common_fields: true
    fields:
      - { name: purchase_order_id, type: string, source: system, description: "FK -> PurchaseOrder.id; buy this line belongs to" }
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; listing whose aggregated demand this line covers" }
      - { name: quantity_ordered, type: integer, source: computed, description: "Units bought on this line; equals the aggregated demand for that listing at issue time" }
      - { name: quantity_confirmed, type: integer, source: computed, description: "Units the vendor has committed to supply on this line; set by POST /confirmations/{id}/confirm; never greater than quantity_ordered" }
      - { name: quantity_shipped, type: integer, source: computed, description: "Units actually shipped against this line; must never exceed quantity_confirmed" }
      - { name: poline_status, type: enum, source: computed, description: "OPEN | CONFIRMED | FILLED | CLOSED_SHORT", constraints: "enum: OPEN | CONFIRMED | FILLED | CLOSED_SHORT" }

  # ---------------------------------------------------------------------------
  - name: VendorShipment
    parent: PurchaseOrder
    common_fields: true
    fields:
      - { name: purchase_order_id, type: string, source: system, description: "FK -> PurchaseOrder.id; buy this shipment fulfils" }
      - { name: quantity_shipped, type: integer, source: input, description: "Units on this physical shipment; cumulative shipments may not exceed the PO quantity_ordered" }
      - { name: carrier_tracking_code, type: string, source: input, description: "Vendor's outbound tracking code for the shipment" }
      - { name: shipped_at, type: datetime, source: input, description: "Instant the vendor reports the shipment left their facility" }
      - { name: arrived_at, type: datetime, source: computed, description: "Instant the shipment was received at the cross-dock; null until received" }
      - { name: shipment_status, type: enum, source: computed, description: "REPORTED | IN_TRANSIT | RECEIVED | REJECTED", constraints: "enum: REPORTED | IN_TRANSIT | RECEIVED | REJECTED" }

  # ---------------------------------------------------------------------------
  - name: Parcel
    parent: CustomerOrder
    common_fields: true
    fields:
      - { name: customer_order_id, type: string, source: system, description: "FK -> CustomerOrder.id; one consolidated parcel per order" }
      - { name: parcel_status, type: enum, source: computed, description: "FORMING | SEALED | DISPATCHED | DELIVERED", constraints: "enum: FORMING | SEALED | DISPATCHED | DELIVERED" }
      - { name: contained_line_ids, type: array, source: computed, description: "Confirmation line ids consolidated into this parcel" }
      - { name: vendor_shipment_count, type: integer, source: computed, description: "Number of distinct VendorShipments consolidated into this parcel" }
      - { name: sealed_at, type: datetime, source: computed, description: "Instant the parcel was sealed for dispatch; null until SEALED" }
      - { name: dispatch_eta, type: datetime, source: computed, description: "sealed_at + slowest contained line's event ship_time_quote_days; the dispatched parcel's ETA" }

  # ---------------------------------------------------------------------------
  - name: ReturnRequest
    parent: Confirmation
    common_fields: true
    fields:
      - { name: confirmation_id, type: string, source: system, description: "FK -> Confirmation.id; line the customer wants to return" }
      - { name: reason_code, type: enum, source: input, description: "DAMAGED | WRONG_ITEM | NOT_AS_DESCRIBED | CHANGED_MIND | LATE_DELIVERY", constraints: "enum: DAMAGED | WRONG_ITEM | NOT_AS_DESCRIBED | CHANGED_MIND | LATE_DELIVERY" }
      - { name: return_status, type: enum, source: computed, description: "REQUESTED | AI1_APPROVED | AI1_DENIED | CS_REVIEW | APPROVED | DENIED | RECEIVED | REFUNDED", constraints: "enum: REQUESTED | AI1_APPROVED | AI1_DENIED | CS_REVIEW | APPROVED | DENIED | RECEIVED | REFUNDED" }
      - { name: settlement_basis, type: enum, source: computed, description: "REFUND | STORE_CREDIT | NONE; pins how the approved return is settled", constraints: "enum: REFUND | STORE_CREDIT | NONE" }
      - { name: settlement_amount_cents, type: integer, source: computed, description: "Amount settled on approval: the line price plus any goodwill credit; 0 when DENIED" }
      - { name: cs_user_id, type: string, source: computed, description: "Opaque operator id of the CustomerService agent who adjudicated a CS_REVIEW return; null otherwise" }
      - { name: decided_at, type: datetime, source: computed, description: "Instant of the final APPROVED or DENIED decision; null while REQUESTED, AI1_APPROVED, AI1_DENIED or CS_REVIEW" }

  # ---------------------------------------------------------------------------
  - name: CreditLedger
    parent: Customer
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; customer whose balance this entry moves" }
      - { name: source_kind, type: enum, source: system, description: "OVERSELL | SHORT_SHIP | CANCELLATION | RETURN_GOODWILL | MANUAL_ADJUSTMENT", constraints: "enum: OVERSELL | SHORT_SHIP | CANCELLATION | RETURN_GOODWILL | MANUAL_ADJUSTMENT" }
      - { name: source_ref_id, type: string, source: system, description: "Polymorphic reference: Confirmation.id for OVERSELL/SHORT_SHIP/CANCELLATION, ReturnRequest.id for RETURN_GOODWILL, customer_id for MANUAL_ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: positive credits the customer, negative claws credit back. Never zero." }
      - { name: entry_status, type: enum, source: system, description: "ISSUED | SETTLED; entries are append-only and are never deleted or edited", constraints: "enum: ISSUED | SETTLED" }
      - { name: idempotency_key, type: string, source: input, description: "Caller-supplied key that makes a repeated issuance request a no-op returning the original entry" }
# =============================================================================
# §1.2 State Machine Table  (11 machines)
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Event
    field: event_status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    shape: branching            # DRAFT → {SCHEDULED → LIVE → CLOSED, CANCELLED} with a fork at DRAFT and a join at CLOSED
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /events/{id}/schedule"
        actor: Merchandiser
        preconditions:
          - "Event.ends_at is strictly after Event.starts_at"
          - "Event.ends_at - Event.starts_at <= 72 hours"
          - "Event.ship_time_quote_days IN {10, 14, 21, 30}"
          - "Event has at least one Listing in ACTIVE listing_status"
          - "Shop.shop_status IN {DRAFT, SCHEDULED} — the owning shop must not be SUSPENDED or CLOSED"
        side_effects:
          - "event_status → SCHEDULED"
          - "Shop.shop_status DRAFT → SCHEDULED (bubble up; only when the shop has no other SCHEDULED or LIVE event)"
          - "Shop.curated_sku_count recomputed as the count of ACTIVE listings across the shop's SCHEDULED and LIVE events"
          - "Listing.listing_status for every listing of this event is re-evaluated against the logical clock: reveal_at already passed ⇒ ACTIVE, else stays DRAFT"

      - from: SCHEDULED
        to: LIVE
        trigger: "system (logical clock reaches Event.starts_at) or POST /events/{id}/launch"
        actor: system
        preconditions:
          - "current_utc >= Event.starts_at"
          - "Shop.shop_status IN {SCHEDULED, OPEN}"
        side_effects:
          - "event_status → LIVE"
          - "open_event_for_shop → true"
          - "Shop.shop_status → OPEN"
          - "Every Listing with reveal_at <= current_utc and allocation_units > 0 moves DRAFT → ACTIVE"

      - from: LIVE
        to: CLOSED
        trigger: "POST /events/{id}/close"
        actor: Merchandiser
        preconditions:
          - "event_status == LIVE"
          - "Every Confirmation on this event's listings is in a state other than PENDING_AGGREGATION, OR the caller sets cancel_pending_aggregations=true"
        side_effects:
          - "event_status → CLOSED"
          - "open_event_for_shop → false"
          - "CASCADE DEPTH 1→2: every Confirmation still in PENDING_AGGREGATION on this event's listings is set CANCELLED with cancellation_reason EVENT_CLOSED"
          - "CASCADE DEPTH 2→3: each CustomerOrder that now has every line terminal and at least one CANCELLED line is set order_status CANCELLED"
          - "CASCADE DEPTH 3→4: each such order's payment_status → REFUNDED, its refund_due_cents is booked to Customer.refund_balance_cents, and a CreditLedger entry with source_kind CANCELLATION is issued"
          - "Event.units_ordered_total and Event.oversell_units_total are recomputed"
          - "Shop.shop_status → CLOSED when the shop has no other SCHEDULED or LIVE event"
          - "Listing.listing_status SOLD_OUT when units_ordered > 0, WITHDRAWN when units_ordered == 0"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Merchandiser
        preconditions:
          - "event_status == DRAFT"
        side_effects:
          - "event_status → CANCELLED"
          - "Every Listing of this event → WITHDRAWN"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Merchandiser
        preconditions:
          - "event_status == SCHEDULED"
          - "Shop.shop_status != CLOSED"
        side_effects:
          - "event_status → CANCELLED"
          - "Every Listing of this event → WITHDRAWN"
          - "Shop.shop_status → CLOSED when the shop has no other SCHEDULED or LIVE event"
          - "Any PurchaseOrder already ISSUED for this event is left untouched (a buy placed before the cancellation is honoured)"

      - from: LIVE
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Merchandiser
        preconditions:
          - "Event.units_po_committed_total == 0 — no buy has been placed against this event yet"
          - "Event.oversell_units_total == 0"
        side_effects:
          - "event_status → CANCELLED"
          - "open_event_for_shop → false"
          - "CASCADE DEPTH 1→2: every Confirmation on this event's listings, in any state other than SHIPPED, is set CANCELLED with cancellation_reason EVENT_CANCELLED"
          - "CASCADE DEPTH 2→3: each affected CustomerOrder's order_total_cents is recomputed"
          - "CASCADE DEPTH 3→4: CustomerOrder.payment_status → REFUNDED and a CreditLedger CANCELLATION entry is issued for each affected order"
          - "Every Listing of this event → WITHDRAWN"

  # ---------------------------------------------------------------------------
  - entity: Shop
    field: shop_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: cyclic               # OPEN → SUSPENDED → OPEN is a legitimate cycle driven by vendor standing
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "system (bubble up when its first Event is scheduled)"
        actor: system
        preconditions:
          - "Vendor.standing IN {EXCELLENT, GOOD}"
        side_effects:
          - "shop_status → SCHEDULED"

      - from: SCHEDULED
        to: OPEN
        trigger: "system (bubble up when its Event goes LIVE)"
        actor: system
        preconditions:
          - "Vendor.standing IN {EXCELLENT, GOOD}"
        side_effects:
          - "shop_status → OPEN"

      - from: OPEN
        to: SUSPENDED
        trigger: "system (Vendor.standing transitions to PROBATION or SUSPENDED)"
        actor: system
        preconditions:
          - "Vendor.standing IN {PROBATION, SUSPENDED}"
        side_effects:
          - "shop_status → SUSPENDED"
          - "CASCADE DEPTH 1→2: every Event of this shop with event_status LIVE keeps event_status LIVE but its listings stop accepting new Confirmations (Listing ordering is gated on Shop.shop_status == OPEN)"

      - from: SCHEDULED
        to: SUSPENDED
        trigger: "system (Vendor.standing transitions to PROBATION or SUSPENDED)"
        actor: system
        preconditions:
          - "Vendor.standing IN {PROBATION, SUSPENDED}"
        side_effects:
          - "shop_status → SUSPENDED"
          - "Every SCHEDULED Event of this shop is blocked from SCHEDULED → LIVE until the shop reopens"

      - from: SUSPENDED
        to: OPEN
        trigger: "system (Vendor.standing returns to GOOD or EXCELLENT)"
        actor: system
        preconditions:
          - "Vendor.standing IN {EXCELLENT, GOOD}"
          - "Shop has at least one Event with event_status LIVE"
        side_effects:
          - "shop_status → OPEN"

      - from: SUSPENDED
        to: SCHEDULED
        trigger: "system (Vendor.standing returns to GOOD or EXCELLENT)"
        actor: system
        preconditions:
          - "Vendor.standing IN {EXCELLENT, GOOD}"
          - "Shop has no Event with event_status LIVE"
        side_effects:
          - "shop_status → SCHEDULED"

      - from: OPEN
        to: CLOSED
        trigger: "system (bubble up when the shop's last Event closes)"
        actor: system
        preconditions:
          - "Shop has no Event with event_status IN {SCHEDULED, LIVE}"
        side_effects:
          - "shop_status → CLOSED"
          - "curated_sku_count set to 0"

  # ---------------------------------------------------------------------------
  - entity: CustomerOrder
    field: order_status
    initial_state: AGGREGATING
    terminal_states: [CANCELLED]
    shape: parallel             # order_status × payment_status evolve on two independent axes of the same order
    transitions:
      - from: AGGREGATING
        to: AWAITING_VENDOR
        trigger: "POST /orders/{id}/submit"
        actor: Customer | CustomerService
        preconditions:
          - "The order has at least one Confirmation line"
          - "Every line's Listing has listing_status ACTIVE and its Event.event_status == LIVE"
          - "Shop.shop_status == OPEN for every line's shop"
          - "current_utc <= CustomerOrder.cancellation_window_ends_at"
        side_effects:
          - "order_status → AWAITING_VENDOR"
          - "Every Confirmation line PENDING_AGGREGATION → PENDING_VENDOR with confirmed_at = current_utc"
          - "CustomerOrder.disclosed_ship_time_days = max(Event.ship_time_quote_days over the order's lines)"
          - "CustomerOrder.cancellation_window_ends_at = min(line.confirmed_at + 30 hours, line.Event.ends_at) over the order's lines"
          - "CustomerOrder.order_total_cents = sum(line_unit_price_cents * quantity over PENDING_VENDOR lines)"
          - "Listing.units_ordered += line.quantity for each line"

      - from: AWAITING_VENDOR
        to: PARTIALLY_FILLED
        trigger: "POST /purchase-orders/{id}/close-short"
        actor: InventoryPlanner
        preconditions:
          - "At least one of this order's lines is set SHORT_SHIPPED by that close-short cascade"
          - "At least one of this order's lines remains in VENDOR_CONFIRMED or later"
        side_effects:
          - "order_status → PARTIALLY_FILLED"
          - "refund_due_cents recomputed from the order's SHORT_SHIPPED lines"
          - "payment_status → PARTIALLY_REFUNDED (independent axis)"

      - from: AWAITING_VENDOR
        to: CROSS_DOCKED
        trigger: "POST /orders/{id}/consolidate"
        actor: CrossDockOperator
        preconditions:
          - "Every non-CANCELLED line is in RECEIVED_AT_CROSS_DOCK or VENDOR_CONFIRMED with a received shipment"
          - "CustomerOrder.payment_status IN {CAPTURED, PARTIALLY_REFUNDED}"
          - "CustomerOrder.refund_due_cents == 0"
        side_effects:
          - "order_status → CROSS_DOCKED"
          - "A Parcel is created in FORMING status and returned as parcel_id"
          - "parcel_consolidated_at = current_utc"
          - "Every contained line → SHIPPED and Parcel.contained_line_ids populated"
          - "Parcel.vendor_shipment_count = number of distinct VendorShipments feeding the contained lines"

      - from: PARTIALLY_FILLED
        to: CROSS_DOCKED
        trigger: "POST /orders/{id}/consolidate"
        actor: CrossDockOperator
        preconditions:
          - "Every line is now in SHIPPED, SHORT_SHIPPED or CANCELLED"
          - "CustomerOrder.payment_status IN {CAPTURED, PARTIALLY_REFUNDED}"
          - "CustomerOrder.refund_due_cents == 0"
        side_effects:
          - "order_status → CROSS_DOCKED"
          - "A Parcel is created in FORMING status and returned as parcel_id"
          - "Parcel.contained_line_ids = the SHIPPED line ids only; SHORT_SHIPPED and CANCELLED lines are excluded"
          - "parcel_consolidated_at = current_utc"

      - from: CROSS_DOCKED
        to: SHIPPED
        trigger: "POST /parcels/{id}/dispatch"
        actor: CrossDockOperator
        preconditions:
          - "Parcel.parcel_status == SEALED"
        side_effects:
          - "order_status → SHIPPED"
          - "Parcel.parcel_status → DISPATCHED"
          - "Parcel.dispatch_eta recomputed"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /parcels/{id}/deliver"
        actor: CrossDockOperator
        preconditions:
          - "Parcel.parcel_status == DISPATCHED"
        side_effects:
          - "order_status → DELIVERED"
          - "Parcel.parcel_status → DELIVERED"
          - "CustomerOrder.cancellation_waived → true"

      - from: DELIVERED
        to: RETURNED
        trigger: "POST /returns/{id}/receive"
        actor: CrossDockOperator
        preconditions:
          - "The ReturnRequest is in APPROVED status and its settlement has been recorded"
        side_effects:
          - "order_status → RETURNED (only when every line of the order has a REFUNDED return; otherwise the order stays DELIVERED)"

      - from: AGGREGATING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | CustomerService
        preconditions:
          - "current_utc <= CustomerOrder.cancellation_window_ends_at"
          - "CustomerOrder.cancellation_waived == false"
          - "Customer.account_status == ACTIVE unless the actor is CustomerService"
        side_effects:
          - "order_status → CANCELLED"
          - "Every line CANCELLED with cancellation_reason CUSTOMER_CANCELLED"
          - "order_total_cents → 0 and refund_due_cents = the previously captured amount"
          - "payment_status → REFUNDED"
          - "CreditLedger entry with source_kind CANCELLATION issued; Customer.refund_balance_cents += that amount"

      - from: AWAITING_VENDOR
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | CustomerService
        preconditions:
          - "current_utc <= CustomerOrder.cancellation_window_ends_at"
          - "CustomerOrder.cancellation_waived == false"
          - "Customer.account_status == ACTIVE unless the actor is CustomerService"
          - "No line has reached PURCHASE_ORDER_ISSUED or a later confirmation_status"
        side_effects:
          - "order_status → CANCELLED"
          - "Every line CANCELLED with cancellation_reason CUSTOMER_CANCELLED"
          - "Listing.units_ordered decremented by each line's quantity"
          - "payment_status → REFUNDED"
          - "CreditLedger entry with source_kind CANCELLATION issued; Customer.refund_balance_cents += the captured amount"
          - "CASCADE DEPTH 1→2: every PurchaseOrder whose every POLine reverted to OPEN as a result is set po_status CANCELLED and its quantity_ordered → 0"

      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | CustomerService
        preconditions:
          - "current_utc <= CustomerOrder.cancellation_window_ends_at"
          - "CustomerOrder.cancellation_waived == false"
          - "Customer.account_status == ACTIVE unless the actor is CustomerService — a RESTRICTED buyer cannot cancel without an operator"
        side_effects:
          - "order_status → CANCELLED"
          - "Remaining non-terminal lines CANCELLED; SHORT_SHIPPED lines keep their short_shipped_units"
          - "refund_due_cents recomputed across both the cancelled and short-shipped lines"
          - "payment_status → REFUNDED or PARTIALLY_REFUNDED depending on whether any delivered units were retained"
          - "One CreditLedger entry with source_kind CANCELLATION issued for the recomputed refund_due_cents; Customer.refund_balance_cents += that amount"

  # ---------------------------------------------------------------------------
  - entity: CustomerOrder
    field: payment_status
    initial_state: AUTHORIZED
    terminal_states: [REFUNDED]
    shape: parallel             # second independent axis on the same CustomerOrder row
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /orders/{id}/capture"
        actor: InventoryPlanner
        preconditions:
          - "Every line is in PENDING_VENDOR, VENDOR_CONFIRMED, PURCHASE_ORDER_ISSUED or later — capture happens only after demand is known"
          - "CustomerOrder.total_oversold_units == 0"
        side_effects:
          - "payment_status → CAPTURED"
          - "captured_amount_cents = order_total_cents"

      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "POST /orders/{id}/refunds"
        actor: InventoryPlanner | CustomerService
        preconditions:
          - "CustomerOrder.refund_due_cents > 0"
        side_effects:
          - "payment_status → PARTIALLY_REFUNDED"
          - "refunded_amount_cents += the refunded amount"
          - "One CreditLedger entry per refunded line, source_kind OVERSELL or SHORT_SHIP"
          - "Customer.refund_balance_cents += the refunded amount"

      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /orders/{id}/refunds"
        actor: InventoryPlanner | CustomerService
        preconditions:
          - "CustomerOrder.refund_due_cents after this refund reaches 0"
          - "Every non-CANCELLED line's refund_due_cents == 0"
        side_effects:
          - "payment_status → REFUNDED"
          - "net_captured_cents = captured_amount_cents - refunded_amount_cents"

      - from: AUTHORIZED
        to: REFUNDED
        trigger: "POST /orders/{id}/cancel (before capture)"
        actor: CustomerService
        preconditions:
          - "The authorization was never captured"
        side_effects:
          - "payment_status → REFUNDED"
          - "captured_amount_cents stays 0 and refunded_amount_cents stays 0"

  # ---------------------------------------------------------------------------
  - entity: Confirmation
    field: confirmation_status
    initial_state: PENDING_AGGREGATION
    terminal_states: [SHIPPED, SHORT_SHIPPED, CANCELLED]
    shape: parallel             # confirmation_status × (confirmed_units vs quantity) allocation axis
    transitions:
      - from: PENDING_AGGREGATION
        to: PENDING_VENDOR
        trigger: "POST /orders/{id}/submit (cascade)"
        actor: system
        preconditions:
          - "Listing.listing_status == ACTIVE"
          - "Event.event_status == LIVE"
          - "Shop.shop_status == OPEN"
        side_effects:
          - "confirmation_status → PENDING_VENDOR"
          - "line_unit_price_cents frozen from Listing.unit_price_cents at this instant"
          - "confirmed_at = current_utc"

      - from: PENDING_VENDOR
        to: VENDOR_CONFIRMED
        trigger: "POST /confirmations/{id}/confirm"
        actor: Vendor
        preconditions:
          - "The covering PurchaseOrder.po_status IN {DRAFT, ISSUED, PARTIALLY_FILLED} — a vendor may confirm demand before the buy is formally issued"
          - "The covering POLine.poline_status IN {OPEN, CONFIRMED}"
          - "confirm_units >= 0 and confirm_units <= min(Confirmation.quantity, POLine.quantity_ordered - POLine.quantity_confirmed + this line's current confirmed_units)"
          - "Vendor.fill_rate at this PO stays >= PurchaseOrder.fill_rate_floor_pct after this confirmation"
        side_effects:
          - "confirmed_units = confirm_units"
          - "OVERSOLD-ADJUST branch: if Listing.units_ordered exceeds Listing.allocation_units after this confirmation, oversold_units = Listing.units_ordered - Listing.allocation_units and the affected Confirmations are marked in descending LineId order (see calculations.oversell_allocation)"
          - "Listing.listing_status → SOLD_OUT when units_ordered >= allocation_units and allocation_units > 0"
          - "Event.units_ordered_total recomputed"

      - from: VENDOR_CONFIRMED
        to: PURCHASE_ORDER_ISSUED
        trigger: "POST /purchase-orders (issue)"
        actor: InventoryPlanner
        preconditions:
          - "PurchaseOrder is being ISSUED for this line's covering POLine"
          - "Vendor.fill_rate_floor_pct is recorded on the PO at this instant"
        side_effects:
          - "confirmation_status → PURCHASE_ORDER_ISSUED"
          - "CustomerOrder.cancellation_waived → true for this line's order"
          - "Event.units_po_committed_total += this line's quantity"

      - from: PURCHASE_ORDER_ISSUED
        to: IN_TRANSIT_TO_CROSS_DOCK
        trigger: "POST /vendor-shipments/{id}/receive (cascade at REPORTED→IN_TRANSIT)"
        actor: system
        preconditions:
          - "The covering VendorShipment.shipment_status == IN_TRANSIT"
        side_effects:
          - "confirmation_status → IN_TRANSIT_TO_CROSS_DOCK"

      - from: IN_TRANSIT_TO_CROSS_DOCK
        to: RECEIVED_AT_CROSS_DOCK
        trigger: "POST /vendor-shipments/{id}/receive"
        actor: CrossDockOperator
        preconditions:
          - "VendorShipment.shipment_status becomes RECEIVED"
        side_effects:
          - "confirmation_status → RECEIVED_AT_CROSS_DOCK"

      - from: RECEIVED_AT_CROSS_DOCK
        to: SHIPPED
        trigger: "POST /orders/{id}/consolidate"
        actor: CrossDockOperator
        preconditions:
          - "This line is included in the created Parcel's contained_line_ids"
        side_effects:
          - "confirmation_status → SHIPPED"

      - from: VENDOR_CONFIRMED
        to: SHORT_SHIPPED
        trigger: "POST /purchase-orders/{id}/close-short (cascade)"
        actor: system
        preconditions:
          - "Its covering POLine.poline_status → CLOSED_SHORT"
          - "confirmed_units < quantity"
        side_effects:
          - "confirmation_status → SHORT_SHIPPED"
          - "short_shipped_units = quantity - confirmed_units"
          - "refund_due_cents += short_shipped_units * line_unit_price_cents"
          - "CASCADE DEPTH 1→2: the parent CustomerOrder's refund_due_cents and order_total_cents are recomputed"

      - from: PURCHASE_ORDER_ISSUED
        to: SHORT_SHIPPED
        trigger: "POST /purchase-orders/{id}/close-short (cascade)"
        actor: system
        preconditions:
          - "Its covering POLine.poline_status → CLOSED_SHORT"
          - "confirmed_units < quantity"
        side_effects:
          - "confirmation_status → SHORT_SHIPPED"
          - "short_shipped_units = quantity - confirmed_units"
          - "refund_due_cents += short_shipped_units * line_unit_price_cents"
          - "CASCADE DEPTH 1→2: the parent CustomerOrder's refund_due_cents and order_total_cents are recomputed"

      - from: PENDING_VENDOR
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel or the Event close/cancel cascade"
        actor: Customer | CustomerService | system
        preconditions:
          - "This line has not reached PURCHASE_ORDER_ISSUED"
        side_effects:
          - "confirmation_status → CANCELLED"
          - "Listing.units_ordered decremented by quantity"
          - "refund_due_cents += quantity * line_unit_price_cents when the order had been captured"

      - from: VENDOR_CONFIRMED
        to: CANCELLED
        trigger: "the Event close/cancel cascade or a CS-approved cancellation"
        actor: CustomerService | system
        preconditions:
          - "CustomerOrder.cancellation_waived == false OR the actor is CustomerService with an explicit override"
        side_effects:
          - "confirmation_status → CANCELLED"
          - "refund_due_cents += quantity * line_unit_price_cents"
          - "CASCADE DEPTH 1→2: the parent CustomerOrder.order_status → CANCELLED when every line is terminal"

  # ---------------------------------------------------------------------------
  - entity: PurchaseOrder
    field: po_status
    initial_state: DRAFT
    terminal_states: [FILLED, CLOSED_SHORT, CANCELLED]
    shape: branching            # DRAFT → ISSUED → {FILLED, CLOSED_SHORT, CANCELLED} — a three-way fork with a reopen cycle
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /purchase-orders/{id}/issue"
        actor: InventoryPlanner
        preconditions:
          - "Event.event_status == LIVE"
          - "Vendor.standing IN {EXCELLENT, GOOD} OR (Vendor.standing == PROBATION AND the request carries allow_probation_vendor=true)"
          - "Vendor.standing != SUSPENDED"
          - "The PO has at least one POLine with quantity_ordered > 0"
          - "expected_vendor_version equals Vendor.version"
        side_effects:
          - "po_status → ISSUED"
          - "issued_at = current_utc"
          - "due_at = current_utc + 14 days"
          - "fill_rate_floor_pct snapshotted from Vendor.fill_rate_floor_pct"
          - "Vendor.version incremented by 1"
          - "Every covered Confirmation line VENDOR_CONFIRMED → PURCHASE_ORDER_ISSUED; CustomerOrder.cancellation_waived → true"
          - "Event.units_po_committed_total recomputed"

      - from: ISSUED
        to: PARTIALLY_FILLED
        trigger: "POST /vendor-shipments"
        actor: Vendor
        preconditions:
          - "quantity_shipped > 0"
          - "Cumulative quantity_shipped across this PO's VendorShipments <= PurchaseOrder.quantity_ordered"
        side_effects:
          - "po_status → PARTIALLY_FILLED"
          - "quantity_shipped += the new shipment's quantity"
          - "POLine.quantity_shipped += the shipment's per-listing allocation, capped at POLine.quantity_confirmed"
          - "fill_rate_pct recomputed at 4 decimal places"

      - from: PARTIALLY_FILLED
        to: PARTIALLY_FILLED
        trigger: "POST /vendor-shipments"
        actor: Vendor
        preconditions:
          - "Cumulative quantity_shipped stays <= PurchaseOrder.quantity_ordered"
        side_effects:
          - "quantity_shipped += the new shipment's quantity"
          - "fill_rate_pct recomputed"
          - "CASCADE DEPTH 1→2: each POLine that reaches quantity_shipped == quantity_confirmed → FILLED"
          - "CASCADE DEPTH 2→3: when every POLine is FILLED the PurchaseOrder → FILLED, fill_rate_pct is frozen, closed_at is stamped and the Vendor rolling counters advance"

      - from: ISSUED
        to: FILLED
        trigger: "POST /vendor-shipments/{id}/receive (cascade: a single shipment filling the whole PO)"
        actor: system
        preconditions:
          - "Every POLine reaches quantity_shipped == quantity_confirmed and every quantity_confirmed == quantity_ordered"
        side_effects:
          - "po_status → FILLED"
          - "closed_at = current_utc"
          - "fill_rate_pct frozen at 1.0000"
          - "Vendor.rolling_fill_rate_units_shipped += quantity_ordered"
          - "Vendor.rolling_fill_rate_units_ordered += quantity_ordered"
          - "Every covered Confirmation line in PURCHASE_ORDER_ISSUED or IN_TRANSIT_TO_CROSS_DOCK → IN_TRANSIT_TO_CROSS_DOCK"

      - from: ISSUED
        to: CLOSED_SHORT
        trigger: "POST /purchase-orders/{id}/close-short"
        actor: InventoryPlanner
        preconditions:
          - "po_status IN {ISSUED, PARTIALLY_FILLED}"
          - "current_utc >= PurchaseOrder.due_at OR the request carries force_close=true"
        side_effects:
          - "po_status → CLOSED_SHORT"
          - "fill_rate_pct = quantity_shipped / quantity_ordered frozen"
          - "Vendor.rolling_fill_rate_units_shipped += quantity_shipped"
          - "Vendor.rolling_fill_rate_units_ordered += quantity_ordered"
          - "closed_at = current_utc"
          - "CASCADE DEPTH 1→2: every POLine with quantity_shipped < quantity_confirmed → CLOSED_SHORT"
          - "CASCADE DEPTH 2→3: every Confirmation covering those listings with confirmed_units < quantity → SHORT_SHIPPED with short_shipped_units = quantity - confirmed_units"
          - "CASCADE DEPTH 3→4: each affected CustomerOrder's refund_due_cents and order_total_cents are recomputed, and its Parcel drops the SHORT_SHIPPED lines from contained_line_ids"

      - from: PARTIALLY_FILLED
        to: CLOSED_SHORT
        trigger: "POST /purchase-orders/{id}/close-short"
        actor: InventoryPlanner
        preconditions:
          - "po_status IN {ISSUED, PARTIALLY_FILLED}"
          - "current_utc >= PurchaseOrder.due_at OR the request carries force_close=true"
        side_effects:
          - "po_status → CLOSED_SHORT"
          - "fill_rate_pct frozen; closed_at = current_utc; Vendor rolling counters updated exactly as in ISSUED → CLOSED_SHORT"
          - "CASCADE DEPTH 1→2: every POLine with quantity_shipped < quantity_confirmed → CLOSED_SHORT"
          - "CASCADE DEPTH 2→3: every Confirmation covering those listings with confirmed_units < quantity → SHORT_SHIPPED"
          - "CASCADE DEPTH 3→4: affected CustomerOrder refund_due_cents recomputed; affected Parcels drop the short lines"

      - from: CLOSED_SHORT
        to: ISSUED
        trigger: "POST /purchase-orders/{id}/reopen"
        actor: InventoryPlanner
        preconditions:
          - "A replacement buy is permitted: the PO's event is still LIVE or CLOSED but not CANCELLED"
          - "No shipment has been reported against this PO since it was closed short"
        side_effects:
          - "po_status → ISSUED"
          - "quantity_ordered reset to the current aggregated uncovered demand for the PO's listings"
          - "quantity_shipped reset to 0, quantity_confirmed per POLine reset to 0, and fill_rate_pct cleared to null"
          - "closed_at cleared to null"
          - "Every POLine with quantity_ordered > 0 → OPEN"
          - "Every SHORT_SHIPPED Confirmation line covering those listings → VENDOR_CONFIRMED with short_shipped_units reset to 0 and refund_due_cents recomputed"
          - "Vendor rolling counters for the previous close-short are NOT reversed (the miss is historical)"

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel"
        actor: InventoryPlanner
        preconditions:
          - "quantity_shipped == 0"
          - "The PO is in DRAFT or ISSUED (never after a shipment)"
        side_effects:
          - "po_status → CANCELLED"
          - "Every POLine → OPEN with quantity_ordered and quantity_confirmed reset to 0"
          - "Every covered Confirmation in PURCHASE_ORDER_ISSUED → VENDOR_CONFIRMED; CustomerOrder.cancellation_waived recomputed"
          - "Event.units_po_committed_total recomputed"

  # ---------------------------------------------------------------------------
  - entity: Vendor
    field: standing
    initial_state: EXCELLENT
    terminal_states: []
    shape: cyclic               # EXCELLENT → GOOD → PROBATION → SUSPENDED → PROBATION → GOOD → EXCELLENT
    transitions:
      - from: EXCELLENT
        to: GOOD
        trigger: "POST /events/{id}/run-event-checkpoint"
        actor: system
        preconditions:
          - "Rolling fill rate over POs closed in the checkpoint window is in [0.9000, 0.9700)"
        side_effects:
          - "standing → GOOD"
          - "fill_rate_floor_pct recomputed: GOOD ⇒ 0.8500"
          - "standing_evaluated_at = current_utc"
          - "CASCADE DEPTH 1→2: every Shop of this vendor with shop_status OPEN stays OPEN (GOOD still satisfies the shop gate)"

      - from: GOOD
        to: PROBATION
        trigger: "POST /events/{id}/run-event-checkpoint"
        actor: system
        preconditions:
          - "Rolling fill rate over POs closed in the checkpoint window is in [0.7500, 0.8500)"
          - "OR at least one PO closed short later than its due_at"
        side_effects:
          - "standing → PROBATION"
          - "fill_rate_floor_pct recomputed: PROBATION ⇒ 0.9500"
          - "standing_evaluated_at = current_utc"
          - "CASCADE DEPTH 1→2: every Shop of this vendor with shop_status IN {OPEN, SCHEDULED} → SUSPENDED"

      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /events/{id}/run-event-checkpoint"
        actor: system
        preconditions:
          - "Rolling fill rate over POs closed in the checkpoint window is strictly below 0.7500"
        side_effects:
          - "standing → SUSPENDED"
          - "fill_rate_floor_pct recomputed: SUSPENDED ⇒ 1.0000 (no buy may be placed)"
          - "standing_evaluated_at = current_utc"
          - "CASCADE DEPTH 1→2: every Shop of this vendor → SUSPENDED"
          - "CASCADE DEPTH 2→3: every Event of those shops with event_status SCHEDULED is blocked from launching (Shop gate fails)"

      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /events/{id}/run-event-checkpoint"
        actor: system
        preconditions:
          - "Rolling fill rate over POs closed in the checkpoint window is at or above 0.7500"
        side_effects:
          - "standing → PROBATION"
          - "fill_rate_floor_pct recomputed: PROBATION ⇒ 0.9500"
          - "standing_evaluated_at = current_utc"
          - "Every Shop of this vendor stays SUSPENDED — a shop reopens only on a GOOD or EXCELLENT standing"

      - from: PROBATION
        to: GOOD
        trigger: "POST /events/{id}/run-event-checkpoint"
        actor: system
        preconditions:
          - "Rolling fill rate over POs closed in the checkpoint window is in [0.8500, 0.9700)"
        side_effects:
          - "standing → GOOD"
          - "fill_rate_floor_pct recomputed: GOOD ⇒ 0.8500"
          - "standing_evaluated_at = current_utc"
          - "CASCADE DEPTH 1→2: every Shop of this vendor with shop_status SUSPENDED → OPEN when it has a LIVE event, else SCHEDULED"

      - from: GOOD
        to: EXCELLENT
        trigger: "POST /events/{id}/run-event-checkpoint"
        actor: system
        preconditions:
          - "Rolling fill rate over POs closed in the checkpoint window is at or above 0.9700"
        side_effects:
          - "standing → EXCELLENT"
          - "fill_rate_floor_pct recomputed: EXCELLENT ⇒ 0.9000"
          - "standing_evaluated_at = current_utc"

  # ---------------------------------------------------------------------------
  - entity: VendorShipment
    field: shipment_status
    initial_state: REPORTED
    terminal_states: [RECEIVED, REJECTED]
    shape: branching            # REPORTED → {IN_TRANSIT → RECEIVED, REJECTED}
    transitions:
      - from: REPORTED
        to: IN_TRANSIT
        trigger: "POST /vendor-shipments/{id}/receive"
        actor: CrossDockOperator
        preconditions:
          - "shipped_at <= current_utc"
        side_effects:
          - "shipment_status → IN_TRANSIT"
          - "Every Confirmation covering this shipment's POLines → IN_TRANSIT_TO_CROSS_DOCK"
          - "VendorShipment.arrived_at = the request's arrived_at"

      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /vendor-shipments/{id}/receive"
        actor: CrossDockOperator
        preconditions:
          - "The cross-dock receiving capacity for the inclusive 6-hour bucket ending at arrived_at is not exceeded"
          - "Every covered Confirmation line is in IN_TRANSIT_TO_CROSS_DOCK"
        side_effects:
          - "shipment_status → RECEIVED"
          - "arrived_at = current_utc"
          - "Every covered Confirmation → RECEIVED_AT_CROSS_DOCK"
          - "CASCADE DEPTH 1→2: POLine.quantity_shipped += the shipment's per-listing allocation, capped at POLine.quantity_confirmed"
          - "CASCADE DEPTH 2→3: each POLine reaching quantity_shipped == quantity_confirmed → FILLED"
          - "CASCADE DEPTH 3→4: when every POLine is FILLED the PurchaseOrder → FILLED, fill_rate_pct frozen, and Vendor rolling counters advance"
          - "Parcel.vendor_shipment_count += 1 for each order that has a Parcel in FORMING"

      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /vendor-shipments/{id}/reject"
        actor: CrossDockOperator
        preconditions:
          - "shipment_status IN {REPORTED, IN_TRANSIT}"
          - "A rejection reason code is supplied"
        side_effects:
          - "shipment_status → REJECTED"
          - "POLine.quantity_shipped is NOT increased — the units never enter the cross-dock"
          - "Every covered Confirmation stays in IN_TRANSIT_TO_CROSS_DOCK or reverts to PURCHASE_ORDER_ISSUED when no other shipment of that PO covers it"
          - "PurchaseOrder.quantity_shipped recomputed from the remaining non-rejected shipments"

  # ---------------------------------------------------------------------------
  - entity: Parcel
    field: parcel_status
    initial_state: FORMING
    terminal_states: [DELIVERED]
    shape: linear
    transitions:
      - from: FORMING
        to: SEALED
        trigger: "POST /parcels/{id}/seal"
        actor: CrossDockOperator
        preconditions:
          - "Every contained line's confirmation_status == SHIPPED"
          - "CustomerOrder.payment_status IN {CAPTURED, PARTIALLY_REFUNDED}"
          - "At least one VendorShipment has been received against every contained line"
        side_effects:
          - "parcel_status → SEALED"
          - "sealed_at = current_utc"
          - "dispatch_eta recomputed (see calculations.cross_dock_dispatch_eta)"

      - from: SEALED
        to: DISPATCHED
        trigger: "POST /parcels/{id}/dispatch"
        actor: CrossDockOperator
        preconditions:
          - "parcel_status == SEALED"
        side_effects:
          - "parcel_status → DISPATCHED"
          - "CustomerOrder.order_status → SHIPPED"

      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /parcels/{id}/deliver"
        actor: CrossDockOperator
        preconditions:
          - "parcel_status == DISPATCHED"
        side_effects:
          - "parcel_status → DELIVERED"
          - "CustomerOrder.order_status → DELIVERED"

  # ---------------------------------------------------------------------------
  - entity: ReturnRequest
    field: return_status
    initial_state: REQUESTED
    terminal_states: [REFUNDED, DENIED]
    shape: branching            # REQUESTED → {APPROVED, DENIED} with a CS escalation cycle REQUESTED ↔ CS_REVIEW
    transitions:
      - from: REQUESTED
        to: AI1_APPROVED
        trigger: "POST /returns/{id}/adjudicate"
        actor: system
        preconditions:
          - "reason_code IN {DAMAGED, WRONG_ITEM, NOT_AS_DESCRIBED}"
          - "The decision occurs within 30 days of Parcel.parcel_status reaching DELIVERED"
          - "Every other line of the same order that is also in a ReturnRequest has been submitted — a partial return of a multi-line order is escalated, not auto-approved"
        side_effects:
          - "return_status → AI1_APPROVED"
          - "settlement_basis → REFUND"
          - "settlement_amount_cents = line_unit_price_cents * confirmed_units"

      - from: REQUESTED
        to: AI1_DENIED
        trigger: "POST /returns/{id}/adjudicate"
        actor: system
        preconditions:
          - "reason_code == CHANGED_MIND"
          - "The line's Event is not marked final_sale_exempt"
        side_effects:
          - "return_status → AI1_DENIED"
          - "settlement_basis → NONE and settlement_amount_cents → 0"
          - "return_status then transitions to DENIED at the closed-decision step unless a CS review is requested"

      - from: AI1_DENIED
        to: CS_REVIEW
        trigger: "POST /returns/{id}/escalate"
        actor: Customer | CustomerService
        preconditions:
          - "return_status == AI1_DENIED"
          - "The customer has not already escalated this line twice"
        side_effects:
          - "return_status → CS_REVIEW"
          - "A CustomerService review task is opened with cs_user_id null"

      - from: CS_REVIEW
        to: APPROVED
        trigger: "POST /returns/{id}/decide"
        actor: CustomerService
        preconditions:
          - "decision == APPROVE"
          - "The resulting lifetime goodwill credit would not push Customer.lifetime_credit_issued_cents above 50000 cents"
        side_effects:
          - "return_status → APPROVED"
          - "settlement_basis → STORE_CREDIT when reason_code == CHANGED_MIND, else REFUND"
          - "settlement_amount_cents = line_unit_price_cents * confirmed_units + goodwill_adjustment_cents"
          - "cs_user_id = X-User-ID and decided_at = current_utc"

      - from: CS_REVIEW
        to: DENIED
        trigger: "POST /returns/{id}/decide"
        actor: CustomerService
        preconditions:
          - "decision == DENY"
        side_effects:
          - "return_status → DENIED"
          - "settlement_basis → NONE and settlement_amount_cents → 0"
          - "cs_user_id = X-User-ID and decided_at = current_utc"

      - from: AI1_DENIED
        to: DENIED
        trigger: "system (the 72-hour escalation window lapses at run-event-checkpoint)"
        actor: system
        preconditions:
          - "No escalation was filed within 72 hours of the AI1 decision"
        side_effects:
          - "return_status → DENIED"
          - "decided_at = the lapse instant"

      - from: APPROVED
        to: RECEIVED
        trigger: "POST /returns/{id}/receive"
        actor: CrossDockOperator
        preconditions:
          - "return_status == APPROVED"
        side_effects:
          - "return_status → RECEIVED"
          - "CustomerOrder.order_status → RETURNED when every line of the order has a REFUNDED return"

      - from: RECEIVED
        to: REFUNDED
        trigger: "POST /returns/{id}/settle"
        actor: InventoryPlanner | CustomerService
        preconditions:
          - "settlement_basis IN {REFUND, STORE_CREDIT}"
        side_effects:
          - "return_status → REFUNDED"
          - "CreditLedger entry with source_kind RETURN_GOODWILL and amount_cents = settlement_amount_cents"
          - "Customer.store_credit_balance_cents += settlement_amount_cents when settlement_basis == STORE_CREDIT, else Customer.refund_balance_cents += settlement_amount_cents"
          - "Customer.lifetime_credit_issued_cents += the goodwill portion only, never the goods value"

  # ---------------------------------------------------------------------------
  - entity: CreditLedger
    field: entry_status
    initial_state: ISSUED
    terminal_states: [SETTLED]
    shape: linear               # append-only; entries are never edited or deleted
    transitions:
      - from: ISSUED
        to: SETTLED
        trigger: "POST /orders/{id}/refunds or POST /returns/{id}/settle"
        actor: InventoryPlanner | CustomerService
        preconditions:
          - "The ledger entry has been applied to the customer's balances"
        side_effects:
          - "entry_status → SETTLED"
          - "The entry becomes immutable — later compensating entries must be NEW rows"

  # ---------------------------------------------------------------------------
  - entity: Customer
    field: account_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    shape: cyclic               # ACTIVE → RESTRICTED → ACTIVE
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (three or more CANCELLATION credit entries within 30 days at run-event-checkpoint)"
        actor: system
        preconditions:
          - "At least 3 CreditLedger entries with source_kind CANCELLATION for this customer in the trailing 30 days"
        side_effects:
          - "account_status → RESTRICTED"
          - "New CustomerOrder creation is still permitted, but cancellation now requires CustomerService"

      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /customers/{id}/restore"
        actor: CustomerService
        preconditions:
          - "Customer.refund_balance_cents == 0"
          - "No CreditLedger entry with source_kind MANUAL_ADJUSTMENT and a negative amount_cents in the trailing 7 days"
        side_effects:
          - "account_status → ACTIVE"

      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /customers/{id}/close"
        actor: CustomerService
        preconditions:
          - "Every CustomerOrder of this customer is in a terminal or DELIVERED state"
        side_effects:
          - "account_status → CLOSED"
          - "store_credit_balance_cents frozen; further spending blocked"

  # ---------------------------------------------------------------------------
  - entity: Listing
    field: listing_status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    shape: cyclic               # ACTIVE → SOLD_OUT → ACTIVE when allocation is raised before the event closes
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (Event goes LIVE and reveal_at <= current_utc)"
        actor: system
        preconditions:
          - "Event.event_status == LIVE"
          - "reveal_at <= current_utc"
          - "Shop.shop_status == OPEN"
        side_effects:
          - "listing_status → ACTIVE"

      - from: ACTIVE
        to: SOLD_OUT
        trigger: "POST /purchase-orders/{id}/confirm (cascade) or POST /orders/{id}/submit"
        actor: system
        preconditions:
          - "allocation_units > 0 and units_ordered >= allocation_units"
        side_effects:
          - "listing_status → SOLD_OUT"
          - "oversell_units = units_ordered - allocation_units when units_ordered > allocation_units"

      - from: SOLD_OUT
        to: ACTIVE
        trigger: "POST /listings/{id}/reallocate"
        actor: Merchandiser
        preconditions:
          - "Event.event_status == LIVE"
          - "The new allocation_units is strictly greater than the current units_ordered"
          - "The added units do not push the shop's curated_sku_count above 40"
        side_effects:
          - "allocation_units = the new value"
          - "listing_status → ACTIVE"
          - "oversell_units reset to 0 and every Confirmation oversold_units for this listing recomputed"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /listings/{id}/withdraw or the Event close/cancel cascade"
        actor: Merchandiser | system
        preconditions:
          - "No Confirmation of this listing is in PURCHASE_ORDER_ISSUED or later"
        side_effects:
          - "listing_status → WITHDRAWN"
          - "Every Confirmation of this listing in PENDING_VENDOR → CANCELLED"

      - from: SOLD_OUT
        to: WITHDRAWN
        trigger: "POST /listings/{id}/withdraw or the Event close cascade"
        actor: Merchandiser | system
        preconditions:
          - "No Confirmation of this listing is in PURCHASE_ORDER_ISSUED or later"
        side_effects:
          - "listing_status → WITHDRAWN"

# =============================================================================
# §1.2.1 Concurrency Rules  (true races only; OCC on the parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: po-create-stale-vendor
    parent_entity: Vendor
    write_endpoint: "POST /purchase-orders"
    occ_field: "expected_vendor_version"
    description: |
      Creating a PurchaseOrder against a Vendor whose version has advanced since the
      client last observed it is rejected. A replacement buy for the same
      (vendor_id, event_id) pair is a legitimate superseding write under the product
      semantics, so a second strictly sequential create would otherwise succeed; it is
      refused only because the client's snapshot of Vendor.standing and
      Vendor.fill_rate_floor_pct — both of which the new buy snapshots at issue time —
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: return-request-stale-confirmation
    parent_entity: Confirmation
    write_endpoint: "POST /returns"
    occ_field: "expected_confirmation_version"
    description: |
      Creating a ReturnRequest against a Confirmation whose version has advanced since
      the client last observed it is rejected. A revised ReturnRequest that supersedes
      an undecided one on the same line is legitimate under the product semantics, so a
      second strictly sequential create would otherwise succeed; it is refused only
      because the line may have been short-shipped or re-priced in between, which
      changes the settlement basis the new request would be computed from.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table  (10 calculations)
# =============================================================================
calculations:

  # --- Rule 2(a): combinatorial, ≥3 inputs, nested min/max + tiered selection ---
  - name: event_net_contribution
    trigger: "POST /events/{id}/run-event-checkpoint; and every read of GET /events/{id} while event_status == CLOSED"
    algorithm: threshold
    formula: |
      # All money is integer cents. round_half_up(x) rounds to the nearest whole cent.
      # Evaluation order is pinned: steps 1..8 run strictly in the listed order.
      step1  vendor_spiff          = STRATEGIC_SPIFF_RATE if vendor.vendor_tier == "STRATEGIC" else 0.00
      step2  vendor_payable_cents  = round_half_up(vendor_cost_cents * (1 - vendor_spiff))
      step3  sell_through          = units_sold / max(units_allocated, 1)
      step4  buffer_credit_cents   = round_half_up(sell_through * BUFFER_CREDIT_PER_UNIT_CENTS)
      step5  penalty_cents         = min(oversell_penalty_cents,
                                         round_half_up(gross_revenue_cents * MAX_PENALTY_RATE))
      step6  provisional_cents     = gross_revenue_cents - vendor_payable_cents - penalty_cents + buffer_credit_cents
      step7  floor_cents           = round_half_up(gross_revenue_cents * MIN_CONTRIBUTION_RATE)
      step8  net_contribution_cents = max(provisional_cents, floor_cents)
    input_set: |
      units_sold        = sum(Confirmation.confirmed_units) over Confirmations of this event whose
                          confirmation_status IN {VENDOR_CONFIRMED, PURCHASE_ORDER_ISSUED,
                          IN_TRANSIT_TO_CROSS_DOCK, RECEIVED_AT_CROSS_DOCK, SHIPPED, SHORT_SHIPPED}
      units_allocated   = sum(Listing.allocation_units) over this event's listings
      gross_revenue_cents = sum(Confirmation.line_unit_price_cents * Confirmation.confirmed_units)
                          over the same Confirmation scope as units_sold
      vendor_cost_cents = sum(Listing.vendor_unit_cost_cents * Confirmation.confirmed_units)
                          over the same scope
      oversell_penalty_cents = round_half_up(sum(Confirmation.oversold_units *
                          Confirmation.line_unit_price_cents) * OVERSELL_PENALTY_MULTIPLIER)
      EXCLUDED: Confirmations with confirmation_status IN {PENDING_AGGREGATION, PENDING_VENDOR, CANCELLED}
    constants:
      STRATEGIC_SPIFF_RATE: 0.03
      BUFFER_CREDIT_PER_UNIT_CENTS: 2500
      MAX_PENALTY_RATE: 0.40
      MIN_CONTRIBUTION_RATE: 0.15
      OVERSELL_PENALTY_MULTIPLIER: 1.50
    precision: "integer cents; round_half_up applied separately at steps 2, 4, 5, 7 and never afterwards"
    variants:
      - name: realized_on_closure
        when: "event_status == CLOSED — every figure is frozen at the instant of POST /events/{id}/close"
        difference: |
          The unit scope narrows to Confirmations that are SHIPPED, or SHORT_SHIPPED, or CANCELLED
          with a non-null line_unit_price_cents (a line cancelled after it had been priced), so units
          and revenue that were merely placed drop out of units_sold and gross_revenue_cents while
          realised short-ships stay in. A still-live event reports the broader projection variant, so
          the two variants return different cents for the same event.
      - name: projected_while_live
        when: "event_status == LIVE — recomputed on every run-event-checkpoint"
        difference: |
          Adds back a projected_tail_cents term equal to round_half_up(
          (units_allocated - units_sold) * sell_through * BUFFER_CREDIT_PER_UNIT_CENTS) when
          sell_through >= 0.9000, which the closure variant never applies. Provisional: a later
          closure can therefore report a strictly lower net_contribution_cents for identical sales.

  # --- Rule 1: dual-variant on the CustomerOrder money domain, differing from the two above ---
  - name: order_refund_claim
    trigger: "POST /orders/{id}/refunds; recomputed on POST /purchase-orders/{id}/close-short and POST /orders/{id}/cancel"
    algorithm: aggregation
    formula: |
      # Per non-refunded line, evaluation order pinned: oversell first, then short-ship, then cancellation.
      base (variant NET_OF_ALLOCATION) — the producer default:
        missing_units           = max(0, Confirmation.quantity - Confirmation.confirmed_units)
        oversell_refund_cents   = Confirmation.oversold_units * line_unit_price_cents
        shortship_refund_cents  = Confirmation.short_shipped_units * line_unit_price_cents
        line_refund_cents       = min(oversell_refund_cents + shortship_refund_cents,
                                      missing_units * line_unit_price_cents)
        CustomerOrder.refund_due_cents = sum(line_refund_cents) over the order's non-refunded lines
    input_set: |
      One Confirmation per line of the CustomerOrder. EXCLUDED: lines whose
      ReturnRequest.return_status == REFUNDED (their value is settled by the return, not by this
      calculation) and lines with confirmation_status == PENDING_AGGREGATION. The cap is applied
      per line, never on the order total, so two over-refundable lines cannot borrow each other's cap.
    constants:
      REFUND_CAP_PER_LINE_UNITS: 1.00
    precision: "integer cents, no rounding step — every term is an exact integer product"
    variants:
      - name: net_of_allocation
        when: "the producer default — used by POST /orders/{id}/refunds and every refund read"
        difference: "Refund covers only the units the customer did not receive."
      - name: gross_line_writeoff
        when: "a CustomerService-approved full-line write-off on POST /orders/{id}/refunds with write_off_full_line=true"
        difference: |
          Any line with short_shipped_units > 0 refunds its ENTIRE quantity * line_unit_price_cents
          instead of only the missing units, so a line of 5 units with 4 confirmed refunds 5 units'
          value (500 cents at 100/unit) where the base variant refunds 100 cents. The two variants
          return different numbers for identical inputs whenever short_shipped_units > 0.

  # --- Rule 2(b): combinatorial, nested rounding order pinned ---
  - name: cross_dock_dispatch_eta
    trigger: "POST /parcels/{id}/seal and POST /parcels/{id}/dispatch"
    algorithm: chronological
    formula: |
      # ROUNDING / ORDERING IS PINNED: the per-line day count is added BEFORE the cut-off roll.
      step1  raw_eta       = sealed_at + slowest_line_ship_time_days * 24h
      step2  if hour_utc(sealed_at) >= DISPATCH_CUTOFF_HOUR_UTC then raw_eta += 24h     # whole-day roll
      step3  embargo_eta   = slowest_line_event.ends_at + TRANSPARENCY_EMBARGO_HOURS * 1h
      step4  dispatch_eta  = max(raw_eta, embargo_eta)
      # The alternative order "roll the calendar day of sealed_at first, then add the per-line
      # days" is explicitly NOT used: it yields a strictly earlier instant whenever
      # hour_utc(sealed_at) >= DISPATCH_CUTOFF_HOUR_UTC and the two orders therefore disagree.
    input_set: |
      The parcel's contained lines. slowest_line_ship_time_days = max(Event.ship_time_quote_days)
      over the events of the parcel's contained lines (EXCLUDED: lines whose confirmation_status is
      SHORT_SHIPPED or CANCELLED — they are not in the parcel). slowest_line_event.ends_at is the
      ends_at of the event owning that slowest line. When the parcel contains zero lines the
      calculation is not run and dispatch_eta stays null.
    constants:
      DISPATCH_CUTOFF_HOUR_UTC: 17
      TRANSPARENCY_EMBARGO_HOURS: 6
    precision: "whole hours; the roll in step 2 is a full 24 hours, never a partial-hour shift"
    variants:
      - name: standard_dispatch
        when: "default"
        difference: "Base."
      - name: embargo_suppressed_fastest
        when: "hour_utc(sealed_at) is within TRANSPARENCY_EMBARGO_HOURS after the slowest line's event ends_at"
        difference: |
          The event-relative clause is the only survivor, so dispatch_eta == event.ends_at + 6h even
          when raw_eta from steps 1-2 is earlier — the earliest-disclosed guarantee is suppressed
          rather than disclosed, and the ETA cannot fall inside the embargo.

  # --- Rule 2(c): circular-looking dependency with a pinned evaluation order ---
  - name: vendor_rolling_fill_rate
    trigger: "POST /purchase-orders/{id}/close-short, POST /vendor-shipments/{id}/receive, and POST /events/{id}/run-event-checkpoint"
    algorithm: aggregation
    formula: |
      # Pin: the window filter is evaluated against the closure instant FIRST, the ratio SECOND.
      # The tier and standing that the ratio produces are written THIRD — so the ratio that
      # triggered a standing change is never recomputed against the new floor in the same step.
      window_start = current_utc - WINDOW_DAYS * 24h
      scope = { po : po.vendor_id == vendor_id
                    AND po.po_status IN {FILLED, CLOSED_SHORT}
                    AND po.issued_at IS NOT NULL
                    AND po.closed_at > window_start }        # strictly greater; equal is excluded
      units_ordered = sum(po.quantity_ordered) over scope
      units_shipped = sum(po.quantity_shipped) over scope
      rolling_fill_rate = round_half_up(units_shipped / units_ordered, 4) if units_ordered > 0 else null
    input_set: |
      PurchaseOrders, unit-weighted. EXCLUDED: po_status == CANCELLED (a withdrawn buy is not a
      miss), PO closings at or before window_start, and POs with quantity_ordered == 0.
    constants:
      WINDOW_DAYS: 90
    precision: "4 decimal places, round_half_up"
    variants:
      - name: unit_weighted
        when: "the producer default, and the basis the standing thresholds are read against"
        difference: "A 2-unit miss on a 4-unit PO counts the same as a 200-unit miss on a 400-unit PO."
      - name: po_count_weighted
        when: "vendor-facing reporting only — GET /vendors/{id}/fill-rate-report with basis=PO_COUNT"
        difference: |
          Divides the count of FILLED POs by the count of FILLED-plus-CLOSED_SHORT POs in the same
          window. A vendor with one FILLED 4-unit PO and one CLOSED_SHORT 400-unit PO scores 0.5000
          here against 0.4975 unit-weighted, so the two variants disagree in the third decimal and
          the standing tiers they straddle differ.

  # --- Rule 1(a): dual-variant on the Listing allocation domain ---
  - name: oversell_allocation
    trigger: "POST /purchase-orders/{id}/confirm and GET /listings/{id}/oversell-preview"
    algorithm: waterfall_allocation
    formula: |
      excess = Listing.units_ordered - Listing.allocation_units        # runs only when allocation_units > 0
      if excess <= 0: every candidate.oversold_units = 0 and stop.
      remaining = excess
      for candidate in candidates (ordered per the active variant):
        take = min(remaining, candidate.quantity)
        candidate.oversold_units = take
        remaining -= take
        if remaining == 0: break
      Listing.oversell_units = excess
      Confirmation.refund_due_cents += candidate.oversold_units * line_unit_price_cents
    input_set: |
      candidates = Confirmations of this listing whose confirmation_status IN {PENDING_VENDOR,
      VENDOR_CONFIRMED}. EXCLUDED: PENDING_AGGREGATION (not yet placed against a vendor),
      CANCELLED, and every post-VENDOR_CONFIRMED state (already bought — an oversell found later
      is a short-ship, not an oversell).
    constants:
      MAX_OVERSELL_PCT: 0.20
    precision: "integer units; no rounding"
    variants:
      - name: fifo_by_confirmed_at
        when: "the producer default used by POST /purchase-orders/{id}/confirm"
        difference: |
          Candidates ordered by (confirmed_at ASC, line_unit_price_cents DESC, created_at ASC) — the
          earliest-confirmed buyer keeps their units and the newest lines absorb the oversell. Split
          across two lines: line A confirmed 10:00 with quantity 3, line B confirmed 11:00 with
          quantity 3, allocation 4 ⇒ oversold_units A=0, B=2.
      - name: cancel_newest_first
        when: "the provisional pre-audit preview exposed only by GET /listings/{id}/oversell-preview"
        difference: |
          Candidates ordered by (confirmed_at DESC, line_unit_price_cents ASC, created_at DESC) — the
          newest line absorbs the oversell first. On the same three-unit pair the split is
          oversold_units A=2, B=0, so the two variants return different per-line numbers for
          identical inputs. The preview is explicitly provisional and is never the basis for a
          persisted refund.

  # --- Rule 5 conserved-quantity invariant #1 ---
  - name: event_filled_units_reconciliation
    trigger: "every Confirm-on-PO, receive-shipment, close-short and close-event mutation; and GET /events/{id}"
    algorithm: aggregation
    formula: |
      computed_units_ordered(listing) =
        sum(c.quantity) over Confirmations c of that listing whose confirmation_status IN
          {PENDING_VENDOR, VENDOR_CONFIRMED, PURCHASE_ORDER_ISSUED, IN_TRANSIT_TO_CROSS_DOCK,
           RECEIVED_AT_CROSS_DOCK, SHIPPED, SHORT_SHIPPED}
      Listing.units_ordered := computed_units_ordered(listing)                       # repair on drift
      Event.units_ordered_total := sum(Listing.units_ordered) over the event's listings
      Event.units_po_committed_total := sum(po.quantity_ordered) over the event's PurchaseOrders
                                        whose po_status != CANCELLED
      drift_cents_reported = 0 when no repair was needed, else ERR_DERIVED_FIELD_DRIFT is surfaced
    input_set: |
      Per listing. EXCLUDED: PENDING_AGGREGATION lines (a line not yet submitted has not consumed
      allocation) and CANCELLED lines (a cancelled line returns its units to the listing). The
      window is the listing's whole lifetime — no time filter.
    constants:
      REPAIR_ON_DRIFT: true
    precision: "integer units, exact"
    tie_break: |
      Where an order-sensitive read is required (the per-listing contribution listing returned by
      GET /events/{id}), lines are ordered by confirmed_at ASC, then line_unit_price_cents DESC,
      then Confirmation.created_at ASC. Confirmation.id is never used as a sort key.

  # --- Rule 5 conserved-quantity invariant #2 ---
  - name: customer_refund_balance_reconciliation
    trigger: "every CreditLedger issuance, POST /orders/{id}/refunds, POST /returns/{id}/settle and GET /customers/{id}"
    algorithm: aggregation
    formula: |
      Customer.refund_balance_cents :=
          sum(e.amount_cents) over CreditLedger e of this customer whose
             e.source_kind IN {OVERSELL, SHORT_SHIP, CANCELLATION}
             AND e.entry_status IN {ISSUED, SETTLED}
        - sum(e.amount_cents) over CreditLedger e of this customer whose
             e.source_kind IN {OVERSELL, SHORT_SHIP, CANCELLATION} AND e.entry_status == SETTLED
          AND e is a pay-out (amount_cents < 0)
      Customer.store_credit_balance_cents :=
          sum(e.amount_cents) over CreditLedger e of this customer whose
             e.source_kind IN {RETURN_GOODWILL, MANUAL_ADJUSTMENT}
        # A forward issuance followed by its matching settlement therefore leaves the named
        # quantity unchanged: the ISSUED entry adds, the SETTLED pay-out removes the same cents.
    input_set: |
      Append-only CreditLedger rows for one customer. EXCLUDED: nothing — every row participates,
      because the ledger is the sole authority for both balances and no other field may move them.
    constants:
      NEGATIVE_ENTRIES_ALLOWED: true
    precision: "integer cents, exact; the invariant must hold to the cent, never approximately"

  # --- Rule 6 boundary #1: numeric threshold crossing ---
  - name: fill_rate_shipment_gate
    trigger: "POST /purchase-orders/{id}/issue and POST /vendor-shipments"
    algorithm: threshold
    formula: |
      # The floor RAMPS UP over the buy's window, so an early partial shipment is never blocked
      # and only a late miss is punished. Evaluation order pinned: ramp first, then ratio, then compare.
      elapsed_days      = (current_utc - PurchaseOrder.issued_at) / 24h
      effective_floor   = round_half_up(PurchaseOrder.fill_rate_floor_pct * min(1, elapsed_days / DUE_DAYS_TOTAL), 4)
      projected_rate    = round_half_up((PurchaseOrder.quantity_shipped + new_shipment_units)
                                        / PurchaseOrder.quantity_ordered, 4)
      admit the shipment iff projected_rate >= effective_floor      # INCLUSIVE; equality passes
      at_issue: admit the buy iff vendor.standing IN {EXCELLENT, GOOD}
                OR (vendor.standing == PROBATION AND allow_probation_vendor == true)
    input_set: |
      One vendor shipment against one buy. The comparison is inclusive, so a projected rate exactly
      equal to the effective floor is admitted while one ten-thousandth below is refused with
      ERR_FILL_RATE_BELOW_FLOOR. With fill_rate_floor_pct 0.8500 on a 2000-unit buy at
      elapsed_days >= 14 the effective floor is exactly 0.8500: a shipment taking cumulative
      quantity_shipped from 1600 to 1699 gives projected 0.8495 and is refused; a shipment of 100
      taking it to 1700 gives exactly 0.8500 and is admitted.
    constants:
      DUE_DAYS_TOTAL: 14
      FLOOR_STANDARD: 0.8500
    precision: "4 decimal places, round_half_up, applied to both the effective floor and the projected rate before the comparison"
    variants:
      - name: ramped_floor
        when: "default — the effective floor is scaled by elapsed_days / 14, clamped at the full floor"
        difference: "At elapsed_days 13 the effective floor is 0.7893 rather than 0.8500, so a shipment that would be refused on day 14 is admitted on day 13."
      - name: suspended_vendor_floor
        when: "vendor.standing == SUSPENDED"
        difference: "The effective floor is 1.0000 for the whole window and no shipment or confirmation is admitted at all."

  # --- Rule 6 boundary #2: empty-collection / zero-count edge ---
  - name: cancellation_window
    trigger: "POST /orders/{id}/cancel and every read of GET /orders/{id}"
    algorithm: threshold
    formula: |
      per_line_ends = min(Confirmation.confirmed_at + GRACE_HOURS * 1h, line.Event.ends_at)
      CustomerOrder.cancellation_window_ends_at = min(per_line_ends) over the order's non-CANCELLED lines
      cancellation is admitted iff current_utc <= cancellation_window_ends_at      # INCLUSIVE
    input_set: |
      The order's non-CANCELLED lines. If that set is EMPTY (every line already cancelled or the
      order was never submitted) the window is undefined, cancellation_window_ends_at stays null,
      and any cancel request fails with ERR_CANCELLATION_WINDOW_CLOSED — a zero-count edge, not a
      zero-length window. A line whose event ends_at is earlier than confirmed_at + 30h pins the
      order's window to the event end, so an order can lose its grace period entirely.
    constants:
      GRACE_HOURS: 30
    precision: "whole seconds; the boundary instant itself is inside the window"
    variants:
      - name: anchored_on_confirmed_at
        when: "the line's event outlives confirmed_at + 30h"
        difference: "The window closes 30 hours after the line was placed against a vendor."
      - name: anchored_on_event_end
        when: "the line's event ends_at is earlier than confirmed_at + 30h"
        difference: |
          The window closes at the event's ends_at, which can be minutes after confirmation for a
          line bought in the last hour of a flash event. The two anchors disagree by up to 30 hours
          and the earlier one always wins.

  # --- Temporal overlap on a branded shop window ---
  - name: shop_brand_window_overlap
    trigger: "POST /events/{id}/schedule"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with a mandatory buffer on both ends, unlike the half-open dock buckets.
      buffered(that) = [ that.starts_at - BUFFER_HOURS * 1h , that.ends_at + BUFFER_HOURS * 1h ]  # both ends inclusive
      admit the scheduling iff for every other Event o of the same Shop with
          event_status IN {SCHEDULED, LIVE}:
            buffered(this) does not intersect buffered(o)
      Intersection is inclusive at the touching point: an interval ending at T and another starting at
      T DO collide, so the clear gap must be strictly greater than 2 * BUFFER_HOURS.
    input_set: |
      Other Events of the same Shop only. EXCLUDED: events in DRAFT (not yet committed to a window),
      CANCELLED events (their window is released), and events of every other shop. Adjacent windows of
      different shops never interact, so one brand being busy never blocks a sibling brand.
    constants:
      BUFFER_HOURS: 2
    precision: "whole seconds; every comparison is over closed intervals"
    tie_break: |
      Where several other events collide with the candidate, the reported blocker is the one with the
      earliest starts_at, then the earliest created_at. Event.id is never a sort key.

  # --- Rule 8 support: temporal overlap on a capacity resource ---
  - name: cross_dock_bucket_capacity
    trigger: "POST /vendor-shipments/{id}/receive"
    algorithm: interval_merge
    formula: |
      # Inclusive-left, exclusive-right 6-hour buckets aligned to 00:00Z.
      bucket(b) = [ b*6h , (b+1)*6h )        # arrived_at == 06:00:00Z belongs to the 06:00 bucket
      occupied_units(b) = sum(s.quantity_shipped) over RECEIVED VendorShipments whose arrived_at ∈ bucket(b)
      admit the receive iff occupied_units(bucket(arrived_at)) + this_shipment.quantity_shipped <= BUCKET_CAPACITY_UNITS
    input_set: |
      VendorShipments already in shipment_status RECEIVED. EXCLUDED: REPORTED, IN_TRANSIT and
      REJECTED shipments — none of them occupies dock capacity. Aggregate capacity, not pairwise
      adjacency: three shipments of 40 units each into the same bucket are rejected at the third
      because 120 > 100, even though no purchaser is individually blocked.
    constants:
      BUCKET_CAPACITY_UNITS: 100
      BUCKET_HOURS: 6
    precision: "integer units; the bucket boundary is inclusive on the left"

  # --- CS credit threshold ---
  - name: goodwill_credit_cap
    trigger: "POST /returns/{id}/decide with decision=APPROVE and POST /customers/{id}/credits"
    algorithm: threshold
    formula: |
      base_cents = min(line_unit_price_cents * Confirmation.confirmed_units, LINE_GOODWILL_CEILING_CENTS)
      raw_cents  = round_half_up(base_cents * GOODWILL_PCT_OF_LINE) + CS_GOODWILL_BASE_CENTS
      headroom_cents = ANNUAL_CAP_CENTS - Customer.lifetime_credit_issued_cents
      goodwill_cents = max(0, min(raw_cents, headroom_cents))
    input_set: |
      One return decision. The cap is per customer per rolling 365 days. A decision whose headroom is
      exactly 0 returns ERR_GOODWILL_CAP_EXCEEDED rather than issuing a zero-cent entry — a zero-cent
      CreditLedger row is forbidden by that entity's amount_cents constraint.
    constants:
      ANNUAL_CAP_CENTS: 50000
      CS_GOODWILL_BASE_CENTS: 500
      GOODWILL_PCT_OF_LINE: 0.50
      LINE_GOODWILL_CEILING_CENTS: 20000
    precision: "integer cents; round_half_up applied once, to the goods-value term only"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number runs first)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must both be present; X-User-Role must be one of the role names in §1.7"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The X-User-Role must be listed in the endpoint's own roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: auth
    check: |
      Ownership for entity-backed roles. When X-User-Role == Customer, X-User-ID must equal the
      addressed CustomerOrder.customer_id or Customer.id; when X-User-Role == Vendor, X-User-ID must
      equal the addressed PurchaseOrder.vendor_id or Vendor.id. A mismatch is denied before any state
      or business rule runs.
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "[POST /orders/{id}/submit, POST /orders/{id}/cancel, POST /orders/{id}/lines, POST /returns, GET /customers/{id}, POST /purchase-orders/{id}/confirm, POST /vendor-shipments]"

  - priority: 4
    category: existence
    check: |
      Every id must resolve. Path ids are validated left-to-right in path order; body foreign keys
      are validated left-to-right in the order the endpoint's input: list declares them. Only the
      first failure is reported.
    error_id: "ERR_VENDOR_NOT_FOUND | ERR_SHOP_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_CONFIRMATION_NOT_FOUND | ERR_PURCHASE_ORDER_NOT_FOUND | ERR_POLINE_NOT_FOUND | ERR_VENDOR_SHIPMENT_NOT_FOUND | ERR_PARCEL_NOT_FOUND | ERR_RETURN_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with a path parameter or a foreign key in the body

  - priority: 5
    category: business_constraint
    check: |
      Optimistic concurrency. On every endpoint whose input carries an expected_*_version field the
      supplied value must equal the stored parent version exactly; any mismatch is refused before
      state preconditions are read. This covers the two §1.2.1 rules plus the vendor-version check on
      POST /purchase-orders/{id}/issue.
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints declaring an expected_*_version input"

  - priority: 6
    category: state
    check: |
      The addressed resource must be in a state from which the requested transition exists in §1.2.
      A request naming a transition that does not exist from the current state is refused here, and
      no side effect from any other validation fires.
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_safety
    check: |
      Vendor-standing and shop-suspension gates. A buy or a vendor-shipment report requires the
      vendor's standing to be EXCELLENT or GOOD, or PROBATION with an explicit
      allow_probation_vendor=true; SUSPENDED always blocks. A new Confirmation requires the line's
      Shop.shop_status to be OPEN.
    error_id: "ERR_VENDOR_STANDING_BLOCKED | ERR_VENDOR_SUSPENDED | ERR_SHOP_SUSPENDED"
    http_status: 409
    applies_to: "[POST /purchase-orders, POST /purchase-orders/{id}/issue, POST /purchase-orders/{id}/confirm, POST /vendor-shipments, POST /orders/{id}/submit]"

  - priority: 8
    category: business_referential
    check: |
      Association integrity. A PurchaseOrder must belong to the acting vendor; a POLine's listing
      must belong to that PO's event; a Confirmation must belong to the addressed order; a
      VendorShipment must belong to the addressed PO; a Parcel's contained lines must belong to the
      addressed order.
    error_id: "ERR_PO_NOT_OWNED_BY_VENDOR | ERR_LISTING_EVENT_MISMATCH | ERR_CONFIRMATION_ORDER_MISMATCH | ERR_SHIPMENT_PO_MISMATCH | ERR_PARCEL_LINE_MISMATCH"
    http_status: 409
    applies_to: "[POST /purchase-orders/{id}/confirm, POST /purchase-orders/{id}/issue, POST /purchase-orders/{id}/close-short, POST /vendor-shipments, POST /orders/{id}/consolidate, POST /orders/{id}/lines]"

  - priority: 9
    category: business_constraint
    check: |
      Quantity, allocation and uniqueness constraints: cumulative shipment units on a buy must not
      exceed its quantity_ordered, nor a line's quantity_shipped exceed its quantity_confirmed; a
      reallocation must strictly increase allocation_units above units_ordered; vendor_sku must be
      unique within an event; a buy must carry at least one POLine with quantity_ordered > 0; a shop
      may not exceed 40 ACTIVE listings across its SCHEDULED and LIVE events; a CreditLedger row is append-only and may never
      be edited or deleted; scheduling an event must not collide, after the 2-hour buffer on both ends,
      with another SCHEDULED or LIVE event on the same shop.
    error_id: "ERR_SHIPMENT_EXCEEDS_PO | ERR_ALLOCATION_EXCEEDED | ERR_DUPLICATE_VENDOR_SKU | ERR_EMPTY_PURCHASE_ORDER | ERR_SHOP_SKU_LIMIT_EXCEEDED | ERR_LEDGER_IMMUTABLE | ERR_BRAND_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "[POST /vendor-shipments, POST /listings, POST /listings/{id}/reallocate, POST /purchase-orders/{id}/issue, POST /customers/{id}/credits, POST /events/{id}/schedule]"

  - priority: 10
    category: business_temporal
    check: |
      Clock-relative rules, evaluated against the logical clock: a SCHEDULED event may not go LIVE
      before starts_at; a Confirmation's Listing must have reveal_at <= current_utc; an order
      cancellation must land at or before cancellation_window_ends_at; a cross-dock receive must fit
      the inclusive-left 6-hour bucket's remaining capacity.
    error_id: "ERR_EVENT_NOT_STARTED | ERR_LISTING_NOT_REVEALED | ERR_CANCELLATION_WINDOW_CLOSED | ERR_DOCK_BUCKET_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "[POST /events/{id}/launch, POST /orders/{id}/submit, POST /orders/{id}/cancel, POST /vendor-shipments/{id}/receive]"

  - priority: 11
    category: business_fiscal
    check: |
      Money and rate caps, checked last among the domain rules: a vendor shipment must leave the PO's
      projected fill rate at or above the ramped effective floor computed by
      calculations.fill_rate_shipment_gate; consolidation may not proceed while a refund is still
      owed on the order; a goodwill decision may not exceed the customer's annual credit headroom; a
      listing's oversell may not exceed 20% of its allocation; a refund payout may not exceed the
      customer's outstanding refund balance.
    error_id: "ERR_FILL_RATE_BELOW_FLOOR | ERR_REFUND_OUTSTANDING | ERR_GOODWILL_CAP_EXCEEDED | ERR_OVERSELL_LIMIT_EXCEEDED | ERR_PAYOUT_EXCEEDS_BALANCE"
    http_status: 409
    applies_to: "[POST /confirmations/{id}/confirm, POST /vendor-shipments, POST /orders/{id}/consolidate, POST /returns/{id}/decide, POST /listings/{id}/reallocate, POST /customers/{id}/payouts]"

  - priority: 12
    category: existence
    check: |
      Request shape: required fields present, field types match, enum-valued fields carry a declared
      member, integer money fields are non-negative where the entity declares them non-negative, and
      a CreditLedger amount_cents is never zero.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body

  - priority: 13
    category: business_constraint
    check: |
      Derived-integrity check on read. If a computed field on the addressed resource no longer equals
      the value its §1.3 calculation produces, the read repairs the field and surfaces
      ERR_DERIVED_FIELD_DRIFT so the drift is observable rather than silent.
    error_id: ERR_DERIVED_FIELD_DRIFT
    http_status: 409
    applies_to: "[GET /events/{id}, GET /orders/{id}, GET /customers/{id}, GET /vendors/{id}]"

# =============================================================================
# §1.5 API Endpoint Table  (82 endpoints)
# =============================================================================
endpoints:

  # --- Vendor -----------------------------------------------------------------
  - method: POST
    path: "/vendors"
    description: "Register a vendor. fill_rate_floor_pct is derived from vendor_tier, standing starts at EXCELLENT."
    roles: [Merchandiser]
    code: 201
    input: [legal_name, "vendor_tier?"]
    output: Vendor
    side_effects:
      - "standing initialized to EXCELLENT"
      - "fill_rate_floor_pct initialized to 0.9000 (EXCELLENT floor)"
      - "rolling_fill_rate_units_shipped and rolling_fill_rate_units_ordered initialized to 0"

  - method: GET
    path: "/vendors/{id}"
    description: "Read a vendor including the derived standing and rolling fill-rate counters."
    roles: [Any]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors"
    description: "List vendors, optionally filtered by tier or standing."
    roles: [Any]
    code: 200
    input: ["vendor_tier?", "standing?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  - method: GET
    path: "/vendors/{id}/shops"
    description: "List the shops owned by a vendor."
    roles: [Any]
    code: 200
    input: ["shop_status?", "limit?", "offset?"]
    output: Shop[]
    side_effects: []

  - method: GET
    path: "/vendors/{id}/purchase-orders"
    description: "List the buys placed with a vendor."
    roles: [Any]
    code: 200
    input: ["po_status?", "event_id?", "limit?", "offset?"]
    output: PurchaseOrder[]
    side_effects: []

  - method: GET
    path: "/vendors/{id}/fill-rate-report"
    description: "Fill-rate report for a vendor. basis selects the dual variant of calculations.vendor_rolling_fill_rate and BOTH figures are always returned so the delta is observable."
    roles: [Any]
    code: 200
    input: ["basis?", "window_days?"]
    output: { vendor_id: string, basis: string, window_days: integer, units_ordered: integer, units_shipped: integer, unit_weighted_fill_rate: number, po_count_fill_rate: number, standing: string, fill_rate_floor_pct: number }
    side_effects: []

  # --- Shop -------------------------------------------------------------------
  - method: POST
    path: "/shops"
    description: "Create a curated vendor-branded shop. The owning vendor must not be SUSPENDED."
    roles: [Merchandiser]
    code: 201
    input: [vendor_id, shop_name]
    output: Shop
    side_effects:
      - "shop_status initialized to DRAFT"
      - "curated_sku_count initialized to 0"

  - method: GET
    path: "/shops/{id}"
    description: "Read a shop."
    roles: [Any]
    code: 200
    input: []
    output: Shop
    side_effects: []

  - method: GET
    path: "/shops"
    description: "List shops, optionally filtered by vendor or status."
    roles: [Any]
    code: 200
    input: ["vendor_id?", "shop_status?", "limit?", "offset?"]
    output: Shop[]
    side_effects: []

  - method: GET
    path: "/shops/{id}/events"
    description: "List the events under a shop."
    roles: [Any]
    code: 200
    input: ["event_status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []

  # --- Event ------------------------------------------------------------------
  - method: POST
    path: "/events"
    description: "Create a time-boxed event in DRAFT under a shop. The extended ship-time expectation is fixed here and disclosed to every buyer of a line in this event."
    roles: [Merchandiser]
    code: 201
    input: [shop_id, event_title, starts_at, ends_at, ship_time_quote_days]
    output: Event
    side_effects:
      - "event_status initialized to DRAFT"
      - "checkpoint_index initialized to 0"
      - "units_ordered_total, units_po_committed_total and oversell_units_total initialized to 0"

  - method: GET
    path: "/events/{id}"
    description: "Read an event including its derived totals and the current net-contribution variant."
    roles: [Any]
    code: 200
    input: []
    output: Event
    side_effects:
      - "Recomputes units_ordered_total, units_po_committed_total and oversell_units_total via calculations.event_filled_units_reconciliation; straightens the TENTATIVE first pass of §1.3's evaluation order when called before any checkpoint"
      - "Surfaces ERR_DERIVED_FIELD_DRIFT when a stored total no longer matches the calculation"

  - method: GET
    path: "/events"
    description: "List events, optionally filtered by shop or status."
    roles: [Any]
    code: 200
    input: ["shop_id?", "event_status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []

  - method: GET
    path: "/events/{id}/listings"
    description: "List the merchandised listing slots of an event."
    roles: [Any]
    code: 200
    input: ["listing_status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/events/{id}/schedule"
    description: "Move a DRAFT event to SCHEDULED once its window, its listing set and its shop's brand-window buffer are valid."
    roles: [Merchandiser]
    code: 200
    input: []
    output: Event
    side_effects:
      - "event_status → SCHEDULED"
      - "calculations.shop_brand_window_overlap applied against the owning shop's other SCHEDULED and LIVE events"
      - "Bubbles the owning Shop DRAFT → SCHEDULED when it has no other SCHEDULED or LIVE event"
      - "Re-evaluates each Listing against the logical clock and reveal_at"

  - method: POST
    path: "/events/{id}/launch"
    description: "Launch a SCHEDULED event whose starts_at the logical clock has reached."
    roles: [Merchandiser]
    code: 200
    input: []
    output: Event
    side_effects:
      - "event_status → LIVE and open_event_for_shop → true"
      - "Shop.shop_status → OPEN"
      - "Listings whose reveal_at has passed move DRAFT → ACTIVE"

  - method: POST
    path: "/events/{id}/close"
    description: "Close a LIVE event; the four-hop cascade cancels unplaced lines, cancels affected orders, refunds them and issues ledger entries."
    roles: [Merchandiser]
    code: 200
    input: ["cancel_pending_aggregations?"]
    output: Event
    side_effects:
      - "event_status → CLOSED, open_event_for_shop → false, closed_at stamped"
      - "CASCADE 1→2: PENDING_AGGREGATION lines → CANCELLED with reason EVENT_CLOSED"
      - "CASCADE 2→3: orders whose every line is terminal and which have a CANCELLED line → CANCELLED"
      - "CASCADE 3→4: those orders' payment_status → REFUNDED, refund booked to the customer and a CANCELLATION CreditLedger entry issued"
      - "net_contribution_cents recomputed in the realized_on_closure variant"
      - "Shop.shop_status → CLOSED when it has no other SCHEDULED or LIVE event"

  - method: POST
    path: "/events/{id}/cancel"
    description: "Cancel an event in DRAFT, SCHEDULED or LIVE. From LIVE this requires that no buy has been placed and no oversell exists."
    roles: [Merchandiser]
    code: 200
    input: [reason_code]
    output: Event
    side_effects:
      - "event_status → CANCELLED"
      - "From LIVE: CASCADE 1→2 cancels every non-SHIPPED line, CASCADE 2→3 recomputes order totals, CASCADE 3→4 refunds and issues ledger entries"
      - "Every Listing of the event → WITHDRAWN"

  - method: POST
    path: "/events/{id}/run-event-checkpoint"
    description: "Ops-run checkpoint: advances the event's checkpoint_index, recomputes its analytics, lapses stale return escalations and re-evaluates every vendor standing whose POs closed since the previous run."
    roles: [Merchandiser]
    code: 200
    input: []
    output: Event
    side_effects:
      - "checkpoint_index += 1"
      - "net_contribution_cents recomputed (projected_while_live variant)"
      - "Vendor.standing re-evaluated per calculations.vendor_rolling_fill_rate for every vendor with a PO in scope"
      - "Shop shake-out: SUSPENDED or OPEN depending on the new standing"
      - "ReturnRequest rows in AI1_DENIED whose 72-hour escalation window has lapsed → DENIED"
      - "Customer.account_status → RESTRICTED for customers with three or more CANCELLATION entries in the trailing 30 days"

  # --- Listing ----------------------------------------------------------------
  - method: POST
    path: "/listings"
    description: "Merchandise a listing slot into a DRAFT or SCHEDULED event."
    roles: [Merchandiser]
    code: 201
    input: [event_id, vendor_sku, unit_price_cents, vendor_unit_cost_cents, allocation_units, reveal_at]
    output: Listing
    side_effects:
      - "listing_status initialized to DRAFT"
      - "units_ordered and oversell_units initialized to 0"
      - "Shop.curated_sku_count += 1 when the listing's event is SCHEDULED or LIVE and the listing is ACTIVE"

  - method: GET
    path: "/listings/{id}"
    description: "Read a listing."
    roles: [Any]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/listings"
    description: "List listings, optionally filtered by event or status."
    roles: [Any]
    code: 200
    input: ["event_id?", "listing_status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: GET
    path: "/listings/{id}/oversell-preview"
    description: "Provisional per-line oversell split using the cancel_newest_first variant of calculations.oversell_allocation. Read-only; never the basis for a persisted refund."
    roles: [Merchandiser]
    code: 200
    input: []
    output: { listing_id: string, allocation_units: integer, units_ordered: integer, excess_units: integer, provisional_variant: string, provisional_splits: array }
    side_effects: []

  - method: POST
    path: "/listings/{id}/reallocate"
    description: "Raise a listing's allocation while its event is LIVE, which revives a SOLD_OUT listing and releases every recorded oversell on it."
    roles: [Merchandiser]
    code: 200
    input: [allocation_units, expected_listing_version]
    output: Listing
    side_effects:
      - "allocation_units := the supplied value"
      - "listing_status → ACTIVE when it was SOLD_OUT"
      - "oversell_units reset to 0 and every Confirmation oversold_units for this listing recomputed"
      - "Confirmation.refund_due_cents recomputed for the affected lines"

  - method: POST
    path: "/listings/{id}/withdraw"
    description: "Withdraw a listing that no buy has been placed against; its placed-but-unbought lines are cancelled."
    roles: [Merchandiser]
    code: 200
    input: []
    output: Listing
    side_effects:
      - "listing_status → WITHDRAWN"
      - "Every PENDING_VENDOR Confirmation of this listing → CANCELLED"

  - method: GET
    path: "/listings/{id}/purchase-order-lines"
    description: "List every POLine across every buy that covers this listing, whichever vendor or event produced it."
    roles: [Any]
    code: 200
    input: ["poline_status?", "limit?", "offset?"]
    output: POLine[]
    side_effects: []

  # --- Customer ---------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Register a customer."
    roles: [Any]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects:
      - "account_status initialized to ACTIVE"
      - "store_credit_balance_cents, refund_balance_cents and lifetime_credit_issued_cents initialized to 0"

  - method: GET
    path: "/customers/{id}"
    description: "Read a customer, reconciling both balances against the credit ledger."
    roles: [Customer, CustomerService, Any]
    code: 200
    input: []
    output: Customer
    side_effects:
      - "store_credit_balance_cents and refund_balance_cents reconciled via calculations.customer_refund_balance_reconciliation"
      - "Surfaces ERR_DERIVED_FIELD_DRIFT when a stored balance no longer matches the ledger"

  - method: GET
    path: "/customers"
    description: "List customers, optionally filtered by account status."
    roles: [CustomerService, Any]
    code: 200
    input: ["account_status?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/customers/{id}/orders"
    description: "List a customer's aggregate orders."
    roles: [Customer, CustomerService, Any]
    code: 200
    input: ["order_status?", "limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []

  - method: GET
    path: "/customers/{id}/credit-ledger"
    description: "Read a customer's append-only credit ledger, oldest entry first."
    roles: [Customer, CustomerService, Any]
    code: 200
    input: ["source_kind?", "entry_status?", "limit?", "offset?"]
    output: CreditLedger[]
    side_effects: []

  - method: POST
    path: "/customers/{id}/credits"
    description: "CustomerService manual goodwill adjustment. The amount is capped by the customer's annual credit headroom."
    roles: [CustomerService]
    code: 201
    input: [amount_cents, idempotency_key, reason_code]
    output: CreditLedger
    side_effects:
      - "CreditLedger row issued with source_kind MANUAL_ADJUSTMENT and entry_status ISSUED"
      - "Customer.store_credit_balance_cents or refund_balance_cents adjusted by the signed amount"
      - "Customer.lifetime_credit_issued_cents += amount_cents"
      - "The same idempotency_key returns the original row instead of issuing a second one"

  - method: POST
    path: "/customers/{id}/payouts"
    description: "CustomerService records the cash payout of an owed refund balance, drawing it down and writing the matching negative ledger entry."
    roles: [CustomerService]
    code: 201
    input: [amount_cents, idempotency_key]
    output: CreditLedger
    side_effects:
      - "CreditLedger row issued with a negative amount_cents and source_kind MANUAL_ADJUSTMENT labelled PAYOUT"
      - "Customer.refund_balance_cents decremented by amount_cents, never below zero"
      - "The same idempotency_key returns the original row instead of paying twice"

  - method: POST
    path: "/customers/{id}/restore"
    description: "Return a RESTRICTED customer to ACTIVE once their refund balance is cleared."
    roles: [CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects:
      - "account_status RESTRICTED → ACTIVE"

  - method: POST
    path: "/customers/{id}/close"
    description: "Close a customer account permanently."
    roles: [CustomerService]
    code: 200
    input: []
    output: Customer
    side_effects:
      - "account_status → CLOSED"
      - "store_credit_balance_cents frozen"

  # --- CustomerOrder ----------------------------------------------------------
  - method: POST
    path: "/orders"
    description: "Open an empty aggregate order for a customer. Lines are added separately, so one order can span many events."
    roles: [Customer, CustomerService]
    code: 201
    input: [customer_id]
    output: CustomerOrder
    side_effects:
      - "order_status initialized to AGGREGATING"
      - "payment_status initialized to AUTHORIZED"
      - "order_total_cents and refund_due_cents initialized to 0"

  - method: GET
    path: "/orders/{id}"
    description: "Read an aggregate order with its dual state axes and the derived ship-time and cancellation-window fields."
    roles: [Any]
    code: 200
    input: []
    output: CustomerOrder
    side_effects:
      - "refund_due_cents recomputed via calculations.order_refund_claim in the net_of_allocation variant"
      - "cancellation_window_ends_at recomputed via calculations.cancellation_window"
      - "Surfaces ERR_DERIVED_FIELD_DRIFT on a stored-field mismatch"

  - method: GET
    path: "/orders"
    description: "List aggregate orders, optionally filtered by customer, order status or payment status."
    roles: [Any]
    code: 200
    input: ["customer_id?", "event_id?", "order_status?", "payment_status?", "limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []

  - method: GET
    path: "/orders/{id}/lines"
    description: "List the Confirmation lines of an aggregate order."
    roles: [Customer, CustomerService, Any]
    code: 200
    input: ["confirmation_status?", "limit?", "offset?"]
    output: Confirmation[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a Confirmation line for a listing to an AGGREGATING order. The line starts as PENDING_AGGREGATION and holds no allocation until the order is submitted."
    roles: [Customer, CustomerService]
    code: 201
    input: [listing_id, quantity]
    output: Confirmation
    side_effects:
      - "confirmation_status initialized to PENDING_AGGREGATION"
      - "line_unit_price_cents left null until submission freezes it from Listing.unit_price_cents"
      - "Each added line raises CustomerOrder.disclosed_ship_time_days to that line's event ship_time_quote_days"

  - method: POST
    path: "/orders/{id}/submit"
    description: "Submit an aggregate order: freezes prices, converts every line to PENDING_VENDOR, sets the disclosed ship time and opens the cancellation window."
    roles: [Customer, CustomerService]
    code: 200
    input: []
    output: CustomerOrder
    side_effects:
      - "order_status AGGREGATING → AWAITING_VENDOR"
      - "Every line PENDING_AGGREGATION → PENDING_VENDOR with line_unit_price_cents frozen and confirmed_at stamped"
      - "disclosed_ship_time_days and cancellation_window_ends_at recomputed"
      - "Listing.units_ordered incremented per line and SOLD_OUT applied where allocation is reached"

  - method: POST
    path: "/orders/{id}/lines/cancel"
    description: "Cancel a single Confirmation line while the order's cancellation window is still open and the line has not been bought."
    roles: [Customer, CustomerService]
    code: 200
    input: [confirmation_id, reason_code]
    output: CustomerOrder
    side_effects:
      - "The addressed line → CANCELLED with the supplied reason_code"
      - "Listing.units_ordered decremented by that line's quantity"
      - "refund_due_cents recomputed and order_status re-derived"
      - "CASCADE: a PurchaseOrder whose every POLine reverted to OPEN is set CANCELLED with quantity_ordered zeroed"

  - method: POST
    path: "/orders/{id}/reprice"
    description: "Recompute an order's derived money fields after a promotion or price change. This is the disciplined writer for the intentional gross_line_writeoff selection."
    roles: [InventoryPlanner, CustomerService]
    code: 200
    input: [variant]
    output: CustomerOrder
    side_effects:
      - "order_total_cents and refund_due_cents recomputed using calculations.order_refund_claim in the named variant"
      - "discount_cents recomputed as order_total_cents minus the variant's total"
      - "The same request repeated in the same variant is a no-op returning identical figures"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order inside its cancellation window. Allowed from AGGREGATING, AWAITING_VENDOR and PARTIALLY_FILLED; refused once any line has been bought."
    roles: [Customer, CustomerService]
    code: 200
    input: [reason_code]
    output: CustomerOrder
    side_effects:
      - "order_status → CANCELLED and every non-terminal line → CANCELLED"
      - "payment_status → REFUNDED or PARTIALLY_REFUNDED per the remaining short-shipped lines"
      - "refund_due_cents recomputed and a CANCELLATION CreditLedger entry issued"
      - "CASCADE: a PurchaseOrder whose every POLine reverted to OPEN is set CANCELLED with quantity_ordered zeroed"

  - method: POST
    path: "/orders/{id}/capture"
    description: "Capture the authorized payment once demand is known and no oversell remains on the order."
    roles: [InventoryPlanner]
    code: 200
    input: []
    output: CustomerOrder
    side_effects:
      - "payment_status AUTHORIZED → CAPTURED"
      - "captured_amount_cents = order_total_cents"

  - method: POST
    path: "/orders/{id}/refunds"
    description: "Issue the refund owed for oversells and short-ships. write_off_full_line selects the gross_line_writeoff variant of calculations.order_refund_claim."
    roles: [InventoryPlanner, CustomerService]
    code: 200
    input: ["write_off_full_line?", "note?"]
    output: CustomerOrder
    side_effects:
      - "payment_status → PARTIALLY_REFUNDED, or REFUNDED when nothing further is owed"
      - "One CreditLedger entry per refunded line with source_kind OVERSELL or SHORT_SHIP"
      - "Customer.refund_balance_cents += the refunded amount"
      - "refund_due_cents recomputed in the selected variant"

  - method: POST
    path: "/orders/{id}/consolidate"
    description: "Cross-dock consolidation: seal every received vendor shipment into one customer parcel."
    roles: [CrossDockOperator]
    code: 200
    input: [expected_order_version]
    output: Parcel
    side_effects:
      - "order_status AWAITING_VENDOR or PARTIALLY_FILLED → CROSS_DOCKED"
      - "A Parcel is created in FORMING with contained_line_ids set to the SHIPPED-eligible lines"
      - "parcel_consolidated_at stamped; contained lines → SHIPPED"
      - "Order.version incremented by 1"

  - method: GET
    path: "/orders/{id}/parcels"
    description: "List the parcels consolidated for an order (0 or 1 per order)."
    roles: [Any]
    code: 200
    input: ["parcel_status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  # --- Confirmation -----------------------------------------------------------
  - method: GET
    path: "/confirmations/{id}"
    description: "Read a Confirmation line, including its allocation and refund fields."
    roles: [Any]
    code: 200
    input: []
    output: Confirmation
    side_effects: []

  - method: GET
    path: "/confirmations"
    description: "List Confirmation lines, optionally filtered by listing, order or state."
    roles: [Any]
    code: 200
    input: ["listing_id?", "customer_order_id?", "confirmation_status?", "limit?", "offset?"]
    output: Confirmation[]
    side_effects: []

  - method: POST
    path: "/confirmations/{id}/confirm"
    description: "Vendor confirms how many units of a line they will ship. Must leave the covering PO's projected fill rate at or above its snapshotted floor."
    roles: [Vendor]
    code: 200
    input: [confirm_units]
    output: Confirmation
    side_effects:
      - "confirmation_status PENDING_VENDOR → VENDOR_CONFIRMED"
      - "confirmed_units := confirm_units and POLine.quantity_confirmed += confirm_units"
      - "POLine.poline_status → CONFIRMED"
      - "calculations.oversell_allocation applied in the fifo_by_confirmed_at variant; oversold_units written per line and Listing.oversell_units updated"
      - "Listing.listing_status → SOLD_OUT where allocation is reached; Event.units_ordered_total recomputed"

  - method: GET
    path: "/confirmations/{id}/returns"
    description: "List the return requests filed against a Confirmation line."
    roles: [Any]
    code: 200
    input: ["return_status?", "limit?", "offset?"]
    output: ReturnRequest[]
    side_effects: []

  # --- PurchaseOrder ----------------------------------------------------------
  - method: POST
    path: "/purchase-orders"
    description: "Create a DRAFT buy for a vendor covering aggregated demand on one event. Carries the vendor-version optimistic-concurrency check."
    roles: [InventoryPlanner]
    code: 201
    input: [vendor_id, event_id, expected_vendor_version]
    output: PurchaseOrder
    side_effects:
      - "po_status initialized to DRAFT"
      - "quantity_ordered, quantity_shipped initialized to 0 and fill_rate_pct to null"
      - "Vendor.version incremented by 1"

  - method: GET
    path: "/purchase-orders/{id}"
    description: "Read a buy with its fill rate and snapshotted floor."
    roles: [Any]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: GET
    path: "/purchase-orders"
    description: "List buys, optionally filtered by vendor, event or status."
    roles: [Any]
    code: 200
    input: ["vendor_id?", "event_id?", "po_status?", "limit?", "offset?"]
    output: PurchaseOrder[]
    side_effects: []

  - method: GET
    path: "/purchase-orders/{id}/lines"
    description: "List the POLines of a buy, one per listing."
    roles: [Any]
    code: 200
    input: ["poline_status?", "limit?", "offset?"]
    output: POLine[]
    side_effects: []

  - method: GET
    path: "/purchase-orders/{id}/shipments"
    description: "List the vendor shipments reported against a buy."
    roles: [Any]
    code: 200
    input: ["shipment_status?", "limit?", "offset?"]
    output: VendorShipment[]
    side_effects: []

  - method: POST
    path: "/purchase-orders/{id}/add-line"
    description: "Add a POLine covering one listing's current uncovered demand."
    roles: [InventoryPlanner]
    code: 201
    input: [listing_id, quantity_ordered]
    output: POLine
    side_effects:
      - "POLine created with quantity_ordered resolved to the supplied value and poline_status OPEN"
      - "PurchaseOrder.quantity_ordered recomputed as the sum of its POLines"

  - method: POST
    path: "/purchase-orders/{id}/issue"
    description: "Issue a DRAFT buy: snapshots the vendor fill-rate floor, stamps the due date, flips every covered line to PURCHASE_ORDER_ISSUED and waives cancellation on their orders."
    roles: [InventoryPlanner]
    code: 200
    input: ["allow_probation_vendor?", expected_vendor_version]
    output: PurchaseOrder
    side_effects:
      - "po_status DRAFT → ISSUED"
      - "issued_at stamped and due_at = issued_at + 14 days"
      - "fill_rate_floor_pct snapshotted from Vendor.fill_rate_floor_pct"
      - "Every covered Confirmation VENDOR_CONFIRMED → PURCHASE_ORDER_ISSUED"
      - "CustomerOrder.cancellation_waived → true for the covered lines' orders"
      - "Event.units_po_committed_total recomputed"
      - "Vendor.version incremented by 1"

  - method: POST
    path: "/purchase-orders/{id}/close-short"
    description: "Close a buy short once it is due, driving the four-hop short-ship cascade and freezing the vendor's fill rate into the rolling counters."
    roles: [InventoryPlanner]
    code: 200
    input: ["force_close?"]
    output: PurchaseOrder
    side_effects:
      - "po_status ISSUED or PARTIALLY_FILLED → CLOSED_SHORT with closed_at stamped"
      - "fill_rate_pct frozen and Vendor rolling counters advanced"
      - "CASCADE 1→2: POLines with quantity_shipped < quantity_confirmed → CLOSED_SHORT"
      - "CASCADE 2→3: Confirmations on those listings with confirmed_units < quantity → SHORT_SHIPPED"
      - "CASCADE 3→4: affected CustomerOrder refund_due_cents and order_total_cents recomputed; affected Parcels drop the short lines"
      - "Cascade: any CustomerOrder left with an unshipped short line and otherwise complete → PARTIALLY_FILLED"

  - method: POST
    path: "/purchase-orders/{id}/reopen"
    description: "Reopen a buy that was closed short and re-raise it against the current uncovered demand."
    roles: [InventoryPlanner]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects:
      - "po_status CLOSED_SHORT → ISSUED with quantity_ordered reset, quantity_shipped 0 and fill_rate_pct null"
      - "Every POLine with demand → OPEN and closed_at cleared"
      - "Confirmation lines covering those listings SHORT_SHIPPED → VENDOR_CONFIRMED with short_shipped_units reset and refunds recomputed"
      - "Vendor rolling counters are NOT reversed"

  - method: POST
    path: "/purchase-orders/{id}/cancel"
    description: "Cancel a buy before anything physically ships."
    roles: [InventoryPlanner]
    code: 200
    input: [reason_code]
    output: PurchaseOrder
    side_effects:
      - "po_status → CANCELLED with closed_at stamped"
      - "Every POLine → OPEN with quantity_ordered and quantity_confirmed zeroed"
      - "Covered Confirmations PURCHASE_ORDER_ISSUED → VENDOR_CONFIRMED"
      - "Event.units_po_committed_total recomputed"

  # --- VendorShipment ---------------------------------------------------------
  - method: POST
    path: "/vendor-shipments"
    description: "Vendor reports a physical shipment against a buy."
    roles: [Vendor]
    code: 201
    input: [purchase_order_id, quantity_shipped, carrier_tracking_code, shipped_at, allocations]
    output: VendorShipment
    side_effects:
      - "shipment_status initialized to REPORTED"
      - "PurchaseOrder.quantity_shipped recomputed from all non-rejected shipments"
      - "po_status ISSUED or PARTIALLY_FILLED advanced per the cumulative shipped units"

  - method: GET
    path: "/vendor-shipments/{id}"
    description: "Read a vendor shipment."
    roles: [Any]
    code: 200
    input: []
    output: VendorShipment
    side_effects: []

  - method: GET
    path: "/vendor-shipments"
    description: "List vendor shipments, optionally filtered by buy or status."
    roles: [Any]
    code: 200
    input: ["purchase_order_id?", "shipment_status?", "limit?", "offset?"]
    output: VendorShipment[]
    side_effects: []

  - method: POST
    path: "/vendor-shipments/{id}/receive"
    description: "Cross-dock receives a shipment: advances it to IN_TRANSIT or RECEIVED, applies the inclusive-left bucket capacity check, and drives the receive cascade."
    roles: [CrossDockOperator]
    code: 200
    input: [arrived_at, bucket_units_reported]
    output: VendorShipment
    side_effects:
      - "shipment_status REPORTED → IN_TRANSIT or IN_TRANSIT → RECEIVED"
      - "arrived_at stamped on the receive"
      - "Covered lines → IN_TRANSIT_TO_CROSS_DOCK then RECEIVED_AT_CROSS_DOCK"
      - "CASCADE 1→2: POLine.quantity_shipped += the line's allocation"
      - "CASCADE 2→3: POLines reaching their confirmed quantity → FILLED"
      - "CASCADE 3→4: a fully filled PO → FILLED with locked_amount and recorded fill rate advanced on the vendor"

  - method: POST
    path: "/vendor-shipments/{id}/reject"
    description: "Reject a shipment at the cross-dock; the units never enter capacity and never count as shipped."
    roles: [CrossDockOperator]
    code: 200
    input: [reason_code]
    output: VendorShipment
    side_effects:
      - "shipment_status → REJECTED"
      - "POLine.quantity_shipped is not increased"
      - "PurchaseOrder.quantity_shipped recomputed from the remaining non-rejected shipments"

  # --- Monolith-composition read ---------------------------------------------
  - method: GET
    path: "/vendor-orders/{id}"
    description: "Denormalized monolith view of one order: the order, its lines, the covering buys, their shipments, the parcel and any returns."
    roles: [Any]
    code: 200
    input: []
    output: { order: object, lines: array, purchase_orders: array, shipments: array, parcel: object, returns: array }
    side_effects: []

  # --- Logical clock ----------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads that instant and never falls back to wall-clock time."
    roles: [Any, Merchandiser, InventoryPlanner, CrossDockOperator, CustomerService]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "Every clock-relative rule in §1.4 priority 10 is evaluated against the new instant"
      - "No business state is mutated by the clock call itself"

  - method: GET
    path: "/_clock/current_utc"
    description: "Test-driving endpoint. Reads the logical clock without mutating state."
    roles: [Any, Merchandiser, InventoryPlanner, CrossDockOperator, CustomerService]
    code: 200
    input: []
    output: { current_utc: datetime }
    side_effects: []

  # --- Parcel -----------------------------------------------------------------
  - method: GET
    path: "/parcels/{id}"
    description: "Read a consolidated customer parcel with its contained lines and ETA."
    roles: [Any]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: GET
    path: "/parcels"
    description: "List parcels, optionally filtered by order or status."
    roles: [Any]
    code: 200
    input: ["customer_order_id?", "parcel_status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  - method: POST
    path: "/parcels/{id}/seal"
    description: "Seal a forming parcel once every contained line has arrived and been consolidated, and no refund is outstanding."
    roles: [CrossDockOperator]
    code: 200
    input: []
    output: Parcel
    side_effects:
      - "parcel_status FORMING → SEALED with sealed_at stamped"
      - "dispatch_eta computed via calculations.cross_dock_dispatch_eta, including the per-line day count before the dispatch cut-off roll and the six-hour transparency embargo"

  - method: POST
    path: "/parcels/{id}/dispatch"
    description: "Dispatch a sealed parcel to the customer."
    roles: [CrossDockOperator]
    code: 200
    input: []
    output: Parcel
    side_effects:
      - "parcel_status SEALED → DISPATCHED"
      - "CustomerOrder.order_status → SHIPPED"

  - method: POST
    path: "/parcels/{id}/deliver"
    description: "Record delivery of a dispatched parcel."
    roles: [CrossDockOperator]
    code: 200
    input: []
    output: Parcel
    side_effects:
      - "parcel_status DISPATCHED → DELIVERED"
      - "CustomerOrder.order_status → DELIVERED and cancellation_waived → true"

  # --- ReturnRequest ----------------------------------------------------------
  - method: POST
    path: "/returns"
    description: "File a return against a Confirmation line. Carries the confirmation-version optimistic-concurrency check."
    roles: [Customer, CustomerService]
    code: 201
    input: [confirmation_id, reason_code, expected_confirmation_version]
    output: ReturnRequest
    side_effects:
      - "return_status initialized to REQUESTED"
      - "Confirmation.version incremented by 1"
      - "final-sale eligibility is not evaluated here — it is evaluated by the adjudication step"

  - method: GET
    path: "/returns/{id}"
    description: "Read a return request with its settlement basis and amount."
    roles: [Any]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []

  - method: GET
    path: "/returns"
    description: "List return requests, optionally filtered by status or reason."
    roles: [Any]
    code: 200
    input: ["return_status?", "reason_code?", "limit?", "offset?"]
    output: ReturnRequest[]
    side_effects: []

  - method: POST
    path: "/returns/{id}/adjudicate"
    description: "Run the automatic first-pass adjudication: approve the three defect reasons inside the window, deny CHANGED_MIND on non-exempt events, and escalate every partial multi-line return."
    roles: [CustomerService]
    code: 200
    input: []
    output: ReturnRequest
    side_effects:
      - "return_status REQUESTED → AI1_APPROVED with settlement_basis REFUND and settlement_amount_cents computed"
      - "return_status REQUESTED → AI1_DENIED with settlement_basis NONE and settlement_amount_cents 0"
      - "A partial return of a multi-line order is escalated to CS_REVIEW instead of being decided here"

  - method: POST
    path: "/returns/{id}/escalate"
    description: "Escalate an automatically denied return to a CustomerService reviewer."
    roles: [Customer, CustomerService]
    code: 200
    input: []
    output: ReturnRequest
    side_effects:
      - "return_status AI1_DENIED → CS_REVIEW"
      - "cs_user_id left null until a decision is recorded"

  - method: POST
    path: "/returns/{id}/decide"
    description: "CustomerService records the final decision on an escalated return, including any goodwill credit within the annual cap."
    roles: [CustomerService]
    code: 200
    input: [decision, "goodwill_adjustment_cents?"]
    output: ReturnRequest
    side_effects:
      - "return_status CS_REVIEW → APPROVED or DENIED with cs_user_id and decided_at stamped"
      - "settlement_basis set to REFUND for defect reasons and STORE_CREDIT for CHANGED_MIND"
      - "goodwill_adjustment_cents validated against calculations.goodwill_credit_cap headroom"

  - method: POST
    path: "/returns/{id}/receive"
    description: "Record that the returned goods arrived back at the cross-dock."
    roles: [CrossDockOperator]
    code: 200
    input: []
    output: ReturnRequest
    side_effects:
      - "return_status APPROVED → RECEIVED"
      - "CustomerOrder.order_status → RETURNED when every line of the order has a REFUNDED return"

  - method: POST
    path: "/returns/{id}/settle"
    description: "Settle an approved and received return, crediting the customer by cash refund or store credit."
    roles: [InventoryPlanner, CustomerService]
    code: 200
    input: [idempotency_key]
    output: ReturnRequest
    side_effects:
      - "return_status RECEIVED → REFUNDED"
      - "CreditLedger entry with source_kind RETURN_GOODWILL and amount_cents = settlement_amount_cents"
      - "Customer.store_credit_balance_cents or refund_balance_cents increased per settlement_basis"
      - "Customer.lifetime_credit_issued_cents increased by settlement_amount_cents"
      - "The same idempotency_key returns the original ledger row instead of settling twice"

# =============================================================================
# §1.6 Error Code Catalog  (30 codes)
# =============================================================================
errors:

  - id: ERR_MISSING_USER_CONTEXT
    http: 400
    condition: "X-User-Role or X-User-ID header is absent on a request that requires user context (validations priority 1)"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "The caller's role is not listed on the endpoint, or an entity-backed caller addresses a resource it does not own (validations priority 2 and 3)"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, field type mismatched, enum-valued field carrying an undeclared member, or a CreditLedger amount_cents of zero (validations priority 12)"

  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "No Vendor matches the path id or the vendor_id foreign key"

  - id: ERR_SHOP_NOT_FOUND
    http: 404
    condition: "No Shop matches the path id or the shop_id foreign key"

  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "No Event matches the path id or the event_id foreign key"

  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "No Listing matches the path id or the listing_id foreign key"

  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "No Customer matches the path id or the customer_id foreign key"

  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No CustomerOrder matches the path id"

  - id: ERR_CONFIRMATION_NOT_FOUND
    http: 404
    condition: "No Confirmation matches the path id or the confirmation_id foreign key"

  - id: ERR_PURCHASE_ORDER_NOT_FOUND
    http: 404
    condition: "No PurchaseOrder matches the path id or the purchase_order_id foreign key"

  - id: ERR_POLINE_NOT_FOUND
    http: 404
    condition: "No POLine matches the addressed line identifier"

  - id: ERR_VENDOR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "No VendorShipment matches the path id"

  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "No Parcel matches the path id"

  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "No ReturnRequest matches the path id"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_*_version does not equal the stored parent version — the two §1.2.1 rules plus the vendor-version check on issue (validations priority 5)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The addressed resource is in a state from which the requested transition does not exist in §1.2 (validations priority 6)"

  - id: ERR_VENDOR_STANDING_BLOCKED
    http: 409
    condition: "Vendor.standing is PROBATION and the request did not carry allow_probation_vendor=true (validations priority 7)"

  - id: ERR_VENDOR_SUSPENDED
    http: 409
    condition: "Vendor.standing is SUSPENDED, which blocks every buy, issue, confirmation and shipment report (validations priority 7)"

  - id: ERR_SHOP_SUSPENDED
    http: 409
    condition: "Shop.shop_status is SUSPENDED or CLOSED, so a new Confirmation or a launch under that shop is refused (validations priority 7)"

  - id: ERR_PO_NOT_OWNED_BY_VENDOR
    http: 409
    condition: "The acting Vendor does not own the addressed PurchaseOrder (validations priority 8)"

  - id: ERR_LISTING_EVENT_MISMATCH
    http: 409
    condition: "A POLine's listing belongs to a different event than its PurchaseOrder (validations priority 8)"

  - id: ERR_CONFIRMATION_ORDER_MISMATCH
    http: 409
    condition: "A Confirmation does not belong to the addressed CustomerOrder (validations priority 8)"

  - id: ERR_SHIPMENT_PO_MISMATCH
    http: 409
    condition: "A VendorShipment does not belong to the addressed PurchaseOrder, or its allocations name listings outside that PO (validations priority 8)"

  - id: ERR_PARCEL_LINE_MISMATCH
    http: 409
    condition: "A Parcel's contained lines do not belong to the addressed CustomerOrder (validations priority 8)"

  - id: ERR_SHIPMENT_EXCEEDS_PO
    http: 409
    condition: "Cumulative shipment units on a buy exceed PurchaseOrder.quantity_ordered, or a line allocation exceeds its POLine's quantity_confirmed (validations priority 9)"

  - id: ERR_ALLOCATION_EXCEEDED
    http: 409
    condition: "A reallocation does not strictly raise allocation_units above the listing's current units_ordered (validations priority 9)"

  - id: ERR_DUPLICATE_VENDOR_SKU
    http: 409
    condition: "A listing's vendor_sku already exists within the same event (validations priority 9)"

  - id: ERR_EMPTY_PURCHASE_ORDER
    http: 409
    condition: "A buy is issued while it carries no POLine with quantity_ordered > 0 (validations priority 9)"

  - id: ERR_SHOP_SKU_LIMIT_EXCEEDED
    http: 409
    condition: "Adding or reviving a listing would push the shop's curated_sku_count above 40 (validations priority 9)"

  - id: ERR_LEDGER_IMMUTABLE
    http: 409
    condition: "An attempt to edit or delete a CreditLedger row, which is append-only (validations priority 9)"

  - id: ERR_EVENT_NOT_STARTED
    http: 409
    condition: "A SCHEDULED event is launched before the logical clock reaches its starts_at (validations priority 10)"

  - id: ERR_LISTING_NOT_REVEALED
    http: 409
    condition: "A listing is ordered while its reveal_at is still in the future (validations priority 10)"

  - id: ERR_CANCELLATION_WINDOW_CLOSED
    http: 409
    condition: "A cancellation lands after cancellation_window_ends_at, after any line reached PURCHASE_ORDER_ISSUED, or on an order whose window is undefined because it has no live lines (validations priority 10)"

  - id: ERR_DOCK_BUCKET_CAPACITY_EXCEEDED
    http: 409
    condition: "Receiving a shipment would push the inclusive-left six-hour bucket's received units above 100 (validations priority 10)"

  - id: ERR_FILL_RATE_BELOW_FLOOR
    http: 409
    condition: "A confirmation would leave the buy's projected fill rate strictly below its snapshotted fill_rate_floor_pct; a projected rate exactly at the floor passes (validations priority 11)"

  - id: ERR_REFUND_OUTSTANDING
    http: 409
    condition: "Consolidation or sealing is requested while CustomerOrder.refund_due_cents is still greater than zero (validations priority 11)"

  - id: ERR_GOODWILL_CAP_EXCEEDED
    http: 409
    condition: "A goodwill credit or CS decision would exceed the customer's annual credit headroom; a decision with exactly zero headroom is refused rather than issuing a zero-cent entry (validations priority 11)"

  - id: ERR_OVERSELL_LIMIT_EXCEEDED
    http: 409
    condition: "A listing's oversell would exceed 20 percent of its allocation_units (validations priority 11)"

  - id: ERR_BRAND_WINDOW_OVERLAP
    http: 409
    condition: "Scheduling an event would collide, after the 2-hour buffer on both ends, with another SCHEDULED or LIVE event on the same shop (validations priority 9)"

  - id: ERR_PAYOUT_EXCEEDS_BALANCE
    http: 409
    condition: "A refund payout would take Customer.refund_balance_cents below zero (validations priority 11)"

  - id: ERR_DERIVED_FIELD_DRIFT
    http: 409
    condition: "A computed field no longer equals the value its §1.3 calculation produces; the read repairs the field and surfaces this error so the drift is observable (validations priority 13)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Merchandiser
    description: "Owns the merchandising surface: vendors, shops, events, listings and the ops-run checkpoint that re-scores vendor standing."
    identity: opaque
    exclusive_operations:
      - "POST /vendors"
      - "POST /shops"
      - "POST /events"
      - "POST /listings"
      - "POST /listings/{id}/reallocate"
      - "POST /listings/{id}/withdraw"
      - "POST /events/{id}/run-event-checkpoint"
      - "GET /listings/{id}/oversell-preview"
    shared_operations:
      - "GET /events/{id}"
      - "POST /events/{id}/schedule"
      - "POST /events/{id}/launch"

  - name: Vendor
    description: "An external selling partner, acting as itself. Confirms unit counts on lines and reports shipments against its own buys; may not touch another vendor's buy."
    identity: entity_backed:Vendor
    exclusive_operations:
      - "POST /confirmations/{id}/confirm"
      - "POST /vendor-shipments"
    shared_operations:
      - "POST /events/{id}/close"
      - "POST /events/{id}/cancel"
      - "GET /purchase-orders/{id}"
      - "GET /vendor-shipments/{id}"

  - name: InventoryPlanner
    description: "Owns the buy side: creates and issues buys, captures payment, requests refunds and closes buys short."
    identity: opaque
    exclusive_operations:
      - "POST /purchase-orders"
      - "POST /purchase-orders/{id}/add-line"
      - "POST /purchase-orders/{id}/issue"
      - "POST /purchase-orders/{id}/close-short"
      - "POST /purchase-orders/{id}/reopen"
      - "POST /purchase-orders/{id}/cancel"
      - "POST /orders/{id}/capture"
    shared_operations:
      - "POST /orders/{id}/refunds"
      - "POST /returns/{id}/settle"

  - name: CrossDockOperator
    description: "Owns the physical flow: receives and rejects vendor shipments into the cross-dock and consolidates them into one customer parcel."
    identity: opaque
    exclusive_operations:
      - "POST /vendor-shipments/{id}/receive"
      - "POST /vendor-shipments/{id}/reject"
      - "POST /orders/{id}/consolidate"
      - "POST /parcels/{id}/seal"
      - "POST /parcels/{id}/dispatch"
      - "POST /parcels/{id}/deliver"
      - "POST /returns/{id}/receive"
    shared_operations:
      - "GET /orders/{id}"
      - "GET /vendor-shipments/{id}"

  - name: CustomerService
    description: "Opaque operator identity resolving customer-facing disputes: return adjudication overrides, goodwill credits, customer account restoration and closing."
    identity: opaque
    exclusive_operations:
      - "POST /returns/{id}/adjudicate"
      - "POST /returns/{id}/decide"
      - "POST /customers/{id}/credits"
      - "POST /customers/{id}/restore"
      - "POST /customers/{id}/close"
    shared_operations:
      - "POST /orders/{id}/cancel"
      - "POST /orders/{id}/refunds"
      - "POST /returns/{id}/settle"
      - "POST /returns/{id}/escalate"
      - "POST /orders/{id}/submit"
      - "POST /orders/{id}/lines"

  - name: Customer
    description: "The buyer, acting as itself. Acts only on its own orders and returns; ownership is enforced by comparing X-User-ID to the addressed order's customer_id."
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /orders"
    shared_operations:
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/submit"
      - "POST /orders/{id}/cancel"
      - "POST /returns"
      - "POST /returns/{id}/escalate"
      - "GET /customers/{id}"
      - "GET /customers/{id}/orders"

  - name: Any
    description: "Read-only surface reachable by any authenticated caller, plus the logical-clock test-driving endpoints. No role may write business state through this role."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints under /vendors, /shops, /events, /listings, /orders, /confirmations, /purchase-orders, /vendor-shipments, /parcels, /returns, /customers, /credit-ledger"
      - "POST /_clock/set_current_utc"
      - "GET /_clock/current_utc"
