  # ===========================================================================
  # Section: validations — violation-to-error not exercised in §1.8
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Calling any endpoint without the X-User-ID and X-User-Role headers
          returns 401 ERR_UNAUTHENTICATED.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /program-years"
              as: __no_auth_headers__   # test harness omits both headers
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "error_id == 'ERR_UNAUTHENTICATED'"

      - name: wrong_role_for_endpoint_returns_unauthorized
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          A TradeAlly role attempting ProgramAdministrator's exclusive
          operation (POST /program-years) returns 403 ERR_UNAUTHORIZED.
        test_recipe:
          setup: ["One ACTIVE TradeAlly (so the role is well-formed)"]
          setup_api_calls:
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /program-years"
              payload: { program_code: "P1", program_year_label: "PY1", budget_cap_cents: 1000, savings_goal_kwh: 100 }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == 'ERR_UNAUTHORIZED'"

