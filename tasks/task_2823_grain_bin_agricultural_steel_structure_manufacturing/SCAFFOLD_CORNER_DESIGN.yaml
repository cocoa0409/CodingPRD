            - "GET /bin-designs on an unknown id returns HTTP 404 ERR_BIN_DESIGN_NOT_FOUND and GET /freight-loads on an unknown id returns HTTP 404 ERR_FREIGHT_LOAD_NOT_FOUND - each business entity owns its 404 id"
            - "the same unknown id used on GET /coating-specs and on GET /grain-profiles returns HTTP 404 ERR_CONFIG_NOT_FOUND in both cases, so the four configuration entities deliberately share one error id"
            - "the fully valid assign-crew then returns HTTP 200 with installation_readiness ASSIGNED, proving none of the six rejections was caused by anything other than the id under test"

      - name: enum_range_and_type_defects_are_request_shape_errors_while_unknown_fields_are_ignored
        claim_type: error_triggerable
        grounds:
          - validations.p3
          - errors.ERR_INVALID_REQUEST
          - entities.BinDesign.roof_pitch_deg
          - entities.BinDesign.diameter_m
          - entities.DealerOrder.aeration_package
          - entities.FreightLoad.trailer_type
        distinguishing_aspect: "Every one of these defects is HTTP 400 ERR_INVALID_REQUEST and none of them is a 422 business error, which is the line an implementation most often blurs: roof_pitch_deg 28 is not a business-rule failure but an enum member failure, and diameter_m 3.9 is a declared-range failure even though the geometry formula would happily evaluate it. The range checks are inclusive, so 4.0 and 24.0 are accepted at the very same endpoint that rejects 3.9 and 24.1. In the other direction an unknown body field is not an error at all - it is silently ignored - so an implementation that rejects unknown keys is as wrong as one that accepts a bad enum."
