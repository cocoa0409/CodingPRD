              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-AM1", varietal: "CABERNET_SAUVIGNON", appellation: "OAKVILLE", block_code: "B12", gross_weight_lbs: 42000, tare_weight_lbs: 4000 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { in1: $.data.id }
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "SAMPLE", brix: 23.50, ph: 3.62 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "ACCEPT" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
          trigger:
            - call: "POST /lots"
              payload: { contract_id: "${ct1}", lot_code: "CS-OAK-26-01", vintage_year: 2026, intake_ids: ["${in1}"] }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { lot1: $.data.id, vol: $.data.volume_gallons }
            - call: "GET /harvest-intakes/${in1}"
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { ist: $.data.status, ilot: $.data.lot_id }
            - call: "GET /clients/${cl1}"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { bond: $.data.bond_gallons_in_bond }
          assert:
            - "${vol} == 3135.00 in the creation response itself, with no follow-up read required"
            - "${ist} == ASSIGNED and ${ilot} == ${lot1} on the very next request"
            - "${bond} == 3135.00 on the very next request"
