              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_id: $.data.id, prog_status_draft: $.data.status }
            - call: "POST /incentives/programs/${prog_id}/eligibility-rules"
              payload: { model_code: "TRK9", region_code: "NORTH", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
          trigger:
            - call: "POST /incentives/programs/${prog_id}/objectives"
              payload: { dealer_id: "${dealer_id}", stretch_bps: 0 }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
            - call: "POST /incentives/programs/${prog_id}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_status_pending: $.data.status }
            - call: "POST /incentives/programs/${prog_id}/objectives"
              payload: { dealer_id: "${dealer_id}", stretch_bps: 0 }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
            - call: "GET /incentives/programs/${prog_id}/objectives"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
            - call: "POST /incentives/programs/${prog_id}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { prog_status_active: $.data.status }
            - call: "POST /incentives/programs/${prog_id}/objectives"
              payload: { dealer_id: "${dealer_id}", stretch_bps: 0 }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { obj_id: $.data.id, obj_status: $.data.status, obj_basis: $.data.basis_units, obj_units: $.data.objective_units, obj_round: $.data.protest_round }
            - call: "GET /incentives/programs/${prog_id}/objectives"
              payload: {}
