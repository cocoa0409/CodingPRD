scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: create_beneficiary_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Beneficiary, endpoints]
        distinguishing_aspect: "POST /beneficiaries with full_name + date_of_birth returns 201 with server-minted id, status=ACTIVE, part_a_status=NONE, part_b_status=NONE, enrollment_lock=false, version=1."
        test_recipe:
          setup: ["Empty DB, clock set"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /beneficiaries"
              payload: { full_name: "New B", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Beneficiary.ben.status == ACTIVE"
            - "Beneficiary.ben.part_a_status == NONE"
            - "Beneficiary.ben.part_b_status == NONE"
            - "Beneficiary.ben.enrollment_lock == false"
            - "Beneficiary.ben.version == 1"

      - name: create_beneficiary_dob_on_first_of_month_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Beneficiary.fields.date_of_birth, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "date_of_birth with day-of-month == 1 (e.g. 1959-08-01) is rejected ERR_INVALID_REQUEST per the day-of-month != 1 constraint."
        test_recipe:
          setup: ["Empty DB, clock set"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /beneficiaries"
              payload: { full_name: "Bad DOB", date_of_birth: "1959-08-01T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_beneficiary_missing_full_name_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Beneficiary.fields.full_name, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required full_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB, clock set"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /beneficiaries"
              payload: { date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_beneficiary_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Beneficiary, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /beneficiaries/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "GET /beneficiaries/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: plan_invalid_star_rating_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Plan.fields.star_rating, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /plans with star_rating=4.2 (not in the half-step enum) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /plans"
              payload: { name: "Bad Star", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 4.2, includes_drug_coverage: false }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: part_d_enrollment_defaults_zero_accumulators_on_create
        claim_type: Defaults
        grounds: [entities.PartDEnrollment.fields.total_drug_cost_cents, entities.PartDEnrollment.fields.member_oop_cents, entities.PartDEnrollment.fields.lep_premium_cents]
        distinguishing_aspect: "A freshly created PENDING Part D enrollment has total_drug_cost_cents=0, member_oop_cents=0, lep_premium_cents=0."
        test_recipe:
          setup: ["Beneficiary + IEP + PDP plan exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "DefB", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP Def", part_type: "PART_D", monthly_premium_cents: 2000, star_rating: 3.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { pdp_id: $.data.id }
          trigger:
            - call: "POST /part-d-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${pdp_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pde_id: $.data.id, t: $.data.total_drug_cost_cents, o: $.data.member_oop_cents, l: $.data.lep_premium_cents }
          assert:
            - "PartDEnrollment.${pde_id}.total_drug_cost_cents == 0"
            - "PartDEnrollment.${pde_id}.member_oop_cents == 0"
            - "PartDEnrollment.${pde_id}.lep_premium_cents == 0"
            - "PartDEnrollment.${pde_id}.status == PENDING"

      - name: create_partc_with_nonexistent_plan_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.PartCEnrollment.fields.plan_id, "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /part-c-enrollments referencing a non-existent plan_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Beneficiary + IEP exist; no such plan"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "FKB", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
          trigger:
            - call: "POST /part-c-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "00000000-0000-4000-8000-000000000000", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # =================================================================
  - section: state_machines
    instances:
      - name: activate_part_b_before_part_a_returns_part_a_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.PartBEnrollment.FILED_to_ACTIVE, "errors[ERR_PART_A_REQUIRED]"]
        distinguishing_aspect: "Activating a FILED Part B enrollment while beneficiary.part_a_status==NONE returns ERR_PART_A_REQUIRED (409); no part_b_status change."
        test_recipe:
          setup: ["Beneficiary WITHOUT Part A established; Part B filed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "NoPA", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pbe_id: $.data.id }
          trigger:
            - call: "POST /part-b-enrollments/${pbe_id}/activate"
              payload: {}
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PART_A_REQUIRED"

      - name: confirm_partc_without_part_b_returns_part_b_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.PartCEnrollment.PENDING_to_ACTIVE, "errors[ERR_PART_B_REQUIRED]"]
        distinguishing_aspect: "Confirming a PENDING Part C enrollment while beneficiary.part_b_status==NONE returns ERR_PART_B_REQUIRED (409)."
        test_recipe:
          setup: ["Beneficiary with Part B NONE; a PENDING Part C enrollment"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "NoPB", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "MA NoB", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 4.0, includes_drug_coverage: false }
              as: EnrollmentAdmin
              captures: { ma_id: $.data.id }
            - call: "POST /part-c-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${ma_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pce_id: $.data.id }
            - call: "GET /beneficiaries/${ben_id}"
              payload: {}
              as: EnrollmentAdmin
              captures: { ben_v: $.data.version }
          trigger:
            - call: "POST /part-c-enrollments/${pce_id}/confirm"
              payload: { expected_beneficiary_version: "${ben_v}" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PART_B_REQUIRED"

      - name: confirm_already_active_partc_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.PartCEnrollment.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a PartCEnrollment already in ACTIVE (second confirm) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Beneficiary with Part B active; a confirmed (ACTIVE) Part C enrollment"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "DblConf", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/establish-part-a"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pbe_id: $.data.id }
            - call: "POST /part-b-enrollments/${pbe_id}/activate"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /plans"
              payload: { name: "MA Dbl", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 4.0, includes_drug_coverage: false }
              as: EnrollmentAdmin
              captures: { ma_id: $.data.id }
            - call: "POST /part-c-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${ma_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pce_id: $.data.id }
            - call: "GET /beneficiaries/${ben_id}"
              payload: {}
              as: EnrollmentAdmin
              captures: { ben_v1: $.data.version }
            - call: "POST /part-c-enrollments/${pce_id}/confirm"
              payload: { expected_beneficiary_version: "${ben_v1}" }
              as: EnrollmentAdmin
            - call: "GET /beneficiaries/${ben_id}"
              payload: {}
              as: EnrollmentAdmin
              captures: { ben_v2: $.data.version }
          trigger:
            - call: "POST /part-c-enrollments/${pce_id}/confirm"
              payload: { expected_beneficiary_version: "${ben_v2}" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: lapse_medigap_from_deceased_void_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.MedigapPolicy.ISSUED_to_VOIDED, state_machines.MedigapPolicy.ISSUED_to_LAPSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After beneficiary death voids a Medigap policy (VOIDED, terminal), attempting to lapse it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Beneficiary with an ISSUED Medigap policy, then record-death voids it"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "DeadMG", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "GI_MEDIGAP", source_event_date: "2026-01-01T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { gi_id: $.data.id }
            - call: "POST /medigap-policies"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${gi_id}", coverage_start: "2026-01-05T00:00:00.000Z", coverage_end: "2027-01-05T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/record-death"
              payload: {}
              as: EnrollmentAdmin
          trigger:
            - call: "POST /medigap-policies/${mp_id}/lapse"
              payload: {}
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "MedigapPolicy.${mp_id}.status == VOIDED before the lapse attempt"
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: confirm_partd_initial_state_pending_to_active_computes_lep_zero
        claim_type: Valid Transition
        grounds: [state_machines.PartDEnrollment.PENDING_to_ACTIVE, calculations.partd_uncovered_months, entities.PartDEnrollment.fields.lep_premium_cents]
        distinguishing_aspect: "Confirming a Part D enrollment with part_d_creditable_since covering through the IEP (no gap) yields uncovered_months=0 and lep_premium_cents=0, status ACTIVE."
        test_recipe:
          setup: ["Beneficiary with part_d_creditable_since set so no uncovered months; confirm Part D inside IEP"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-11-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "Credit", date_of_birth: "1959-08-15T00:00:00.000Z", part_d_creditable_since: "2024-08-01T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP Zero", part_type: "PART_D", monthly_premium_cents: 2000, star_rating: 3.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { pdp_id: $.data.id }
            - call: "POST /part-d-enrollments"
              payload: { beneficiary_id: "${ben_id}", plan_id: "${pdp_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pde_id: $.data.id }
          trigger:
            - call: "POST /part-d-enrollments/${pde_id}/confirm"
              payload: {}
              as: EnrollmentAdmin
              captures: { lep: $.data.lep_premium_cents, unc: $.data.uncovered_months, st: $.data.status }
          assert:
            - "PartDEnrollment.${pde_id}.uncovered_months == 0"
            - "PartDEnrollment.${pde_id}.lep_premium_cents == 0"
            - "PartDEnrollment.${pde_id}.status == ACTIVE"

  # =================================================================
  - section: validations
    instances:
      - name: period_beneficiary_mismatch_on_partb_create
        claim_type: Cross-entity validation
        grounds: ["validations[priority=8]", "errors[ERR_PERIOD_BENEFICIARY_MISMATCH]"]
        distinguishing_aspect: "Filing a Part B enrollment for beneficiary A while naming an IEP period that belongs to beneficiary B returns ERR_PERIOD_BENEFICIARY_MISMATCH (422)."
        test_recipe:
          setup: ["Two beneficiaries; an IEP period belongs to beneficiary B; file Part B for A naming B's period"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "BenA", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { a_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "BenB", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { b_id: $.data.id }
            - call: "POST /beneficiaries/${b_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { b_iep_id: $.data.id }
          trigger:
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${a_id}", enrollment_period_id: "${b_iep_id}" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_PERIOD_BENEFICIARY_MISMATCH"

      - name: partb_outside_iep_window_returns_outside_enrollment_window
        claim_type: Temporal validation
        grounds: ["validations[priority=11]", "errors[ERR_OUTSIDE_ENROLLMENT_WINDOW]"]
        distinguishing_aspect: "Filing a Part B enrollment when the clock is before window_start of the IEP (clock 2024-01-01, window starts 2024-05-01) returns ERR_OUTSIDE_ENROLLMENT_WINDOW (422)."
        test_recipe:
          setup: ["Beneficiary with IEP (May–Nov 2024); clock set to Jan 2024 (before window)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "EarlyB", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: EnrollmentAdmin
          trigger:
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_OUTSIDE_ENROLLMENT_WINDOW"

      - name: standalone_partd_on_active_mapd_returns_drug_coverage_conflict
        claim_type: Conditional validation
        grounds: ["validations[priority=14]", "errors[ERR_DRUG_COVERAGE_CONFLICT]", entities.Plan.fields.includes_drug_coverage]
        distinguishing_aspect: "Filing a standalone Part D enrollment for a beneficiary already holding an ACTIVE MAPD (includes_drug_coverage=true) returns ERR_DRUG_COVERAGE_CONFLICT (409)."
        test_recipe:
          setup: ["Beneficiary with Part B active and a confirmed ACTIVE MAPD; attempt standalone Part D"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-01T00:00:00.000Z" }
              as: EnrollmentAdmin
            - call: "POST /beneficiaries"
              payload: { full_name: "MapdB", date_of_birth: "1959-08-15T00:00:00.000Z" }
              as: EnrollmentAdmin
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/establish-part-a"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /beneficiaries/${ben_id}/enrollment-periods"
              payload: { period_type: "IEP" }
              as: EnrollmentAdmin
              captures: { iep_id: $.data.id }
            - call: "POST /part-b-enrollments"
              payload: { beneficiary_id: "${ben_id}", enrollment_period_id: "${iep_id}" }
              as: EnrollmentAdmin
              captures: { pbe_id: $.data.id }
            - call: "POST /part-b-enrollments/${pbe_id}/activate"
              payload: {}
              as: EnrollmentAdmin
            - call: "POST /plans"
              payload: { name: "MAPD C", part_type: "PART_C", monthly_premium_cents: 0, star_rating: 4.0, includes_drug_coverage: true }
              as: EnrollmentAdmin
              captures: { mapd_id: $.data.id }
            - call: "POST /plans"
              payload: { name: "PDP Std", part_type: "PART_D", monthly_premium_cents: 2000, star_rating: 3.0, includes_drug_coverage: true }
