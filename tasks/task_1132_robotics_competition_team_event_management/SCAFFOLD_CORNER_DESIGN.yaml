            - { call: "POST /frc-events", payload: { event_code: "RB2", event_name: "RB2", season_year: 2026, start_date: "2026-04-01T08:00:00Z", end_date: "2026-04-04T18:00:00Z", team_capacity: 40, match_cycle_minutes: 7, field_count: 1, championship_slots: 2 }, as: EventDirector, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /frc-events/${ev}/awards/${a1}/decide", payload: {}, as: Judge, as_user_id: "${j1}", captures: { err: $.data.error_id } }
