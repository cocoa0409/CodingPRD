            - call: "POST /planning/contracts/${ct_id}/countersign"
              payload: {}
              as: Client
              as_user_id: "${ev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (HTTP 403)"

      - name: client_signs_foreign_event_contract_returns_ownership_violation
        claim_type: ownership
        grounds: [roles.Client, "validations[priority=3]", "errors[ERR_OWNERSHIP_VIOLATION]"]
        distinguishing_aspect: "A Client whose X-User-ID is event2 signing event1's SENT contract gets ERR_OWNERSHIP_VIOLATION (403) — authorized role but not the owner."
        test_recipe:
          setup: ["Event1 with a SENT contract; Event2 exists (its id is the acting Client's X-User-ID)."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "E1", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 5000000, guest_count_estimate: 50 }
              as: Planner
              captures: { ev1: $.data.id, ev1_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev1}", expected_event_version: "${ev1_v}" }
              as: Planner
              captures: { ct1: $.data.id }
            - call: "POST /planning/contracts/${ct1}/send"
              payload: {}
              as: Planner
            - call: "POST /planning/events"
              payload: { couple_names: "E2", event_date: "2026-09-15T00:00:00Z", venue_name: "B", package_type: "FULL", total_budget_cents: 5000000, guest_count_estimate: 50 }
              as: Planner
              captures: { ev2: $.data.id }
          trigger:
            - call: "POST /planning/contracts/${ct1}/sign"
              payload: {}
              as: Client
              as_user_id: "${ev2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OWNERSHIP_VIOLATION (HTTP 403)"

      - name: auth_missing_user_role_header_returns_400
        claim_type: auth
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_HEADERS]"]
        distinguishing_aspect: "A request omitting the X-User-Role/X-User-ID headers returns ERR_MISSING_OR_INVALID_HEADERS (400) before any authz or existence check."
        test_recipe:
          setup: ["Empty DB. The trigger is issued with NO X-User-Role / X-User-ID headers (the `as:` field marks the endpoint under test; the generated request drops the headers)."]
          setup_api_calls: []
          trigger:
            - call: "GET /planning/events"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "With headers omitted, response error_id == ERR_MISSING_OR_INVALID_HEADERS (HTTP 400)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_event_version_on_second_contract_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-supersede-stale-event]", "errors[ERR_STALE_EVENT_VERSION]"]
        distinguishing_aspect: "After contract A create bumps EventProject.version 1->2, a second create still carrying expected_event_version = the original 1 is rejected with ERR_STALE_EVENT_VERSION (412) — two strictly sequential requests."
        test_recipe:
          setup: ["Event created at version 1; contract A created with expected_event_version 1 (event advances to version 2)."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "OCC", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_a: $.data.id }
          trigger:
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_EVENT_VERSION (HTTP 412) — expected_event_version 1 is stale (event is now version 2)"

      - name: contract_supersede_voids_prior_and_bumps_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-supersede-stale-event]", entities.EventProject.fields.active_contract_id, state_machines.Contract.DRAFT_to_VOID]
        distinguishing_aspect: "Creating contract B with the CURRENT event version supersedes contract A: A -> VOID, active_contract_id becomes B, and event.version increments again."
        test_recipe:
          setup: ["Event version 1; contract A created (event now version 2)."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "SUP", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "FULL", total_budget_cents: 8000000, guest_count_estimate: 80 }
              as: Planner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v}" }
              as: Planner
              captures: { ct_a: $.data.id }
            - call: "GET /planning/events/${ev_id}"
              payload: {}
              as: Planner
              captures: { ev_v2: $.data.version }
          trigger:
            - call: "POST /planning/contracts"
              payload: { event_id: "${ev_id}", expected_event_version: "${ev_v2}" }
              as: Planner
              captures: { ct_b: $.data.id }
            - call: "GET /planning/contracts/${ct_a}"
              payload: {}
              as: Planner
              captures: { a_status: $.data.status }
          assert:
            - "Contract.${ct_a}.status == VOID (superseded)"
            - "EventProject.${ev_id}.active_contract_id == ${ct_b}"
            - "EventProject.${ev_id}.version == 3 (bumped again by the second create)"

      - name: table_occupied_seats_reconciled_on_assign
        claim_type: derived_field_reconciliation
        grounds: [entities.Table.fields.occupied_seats, entities.SeatAssignment.fields.seats_used]
        distinguishing_aspect: "Table.occupied_seats is recomputed on assignment: seating a party of 4 sets occupied_seats to 4 (== seats_used snapshot of party_size)."
        test_recipe:
          setup: ["Event with a table capacity 10 and an ACCEPTED guest party 4."]
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "REC", event_date: "2026-09-15T00:00:00Z", venue_name: "A", package_type: "PARTIAL", total_budget_cents: 3000000, guest_count_estimate: 20 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/tables"
              payload: { event_id: "${ev_id}", table_label: "T1", capacity: 10 }
              as: Planner
              captures: { tb: $.data.id }
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "G", party_size: 4 }
              as: Planner
              captures: { g: $.data.id }
            - call: "POST /planning/guests/${g}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
          trigger:
            - call: "POST /planning/seat-assignments"
              payload: { event_id: "${ev_id}", guest_id: "${g}", table_id: "${tb}" }
              as: Planner
              captures: { sa: $.data.id, su: $.data.seats_used }
          assert:
            - "SeatAssignment.${sa}.seats_used == 4"
            - "Table.${tb}.occupied_seats == 4"

      - name: coi_clock_sweep_expires_verified_coi
        claim_type: derived_field_reconciliation
        grounds: [state_machines.COI.VERIFIED_to_EXPIRED, entities.COI.fields.status]
        distinguishing_aspect: "Setting the clock past a VERIFIED COI's coverage_expiry_date sweeps it to EXPIRED (system side effect of the clock endpoint)."
        test_recipe:
          setup: ["Vendor with a VERIFIED COI expiring 2026-06-01; clock then set to 2026-07-01."]
          setup_api_calls:
            - call: "POST /planning/vendors"
              payload: { name: "SweepCo", category: "RENTAL", contact_email: "s@x.com" }
              as: Planner
              captures: { vd_id: $.data.id }
            - call: "POST /planning/cois"
              payload: { vendor_id: "${vd_id}", policy_number: "P", coverage_amount_cents: 1000000, coverage_expiry_date: "2026-06-01T00:00:00Z" }
              as: Planner
              captures: { coi_id: $.data.id }
            - call: "POST /planning/cois/${coi_id}/verify"
              payload: {}
              as: Planner
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Planner
            - call: "GET /planning/cois/${coi_id}"
              payload: {}
              as: Planner
              captures: { st: $.data.status }
          assert:
            - "COI.${coi_id}.status == EXPIRED after the clock advances past coverage_expiry_date"

