# =============================================================================
# task_1088 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances. Every grounds ref resolves
# into SCAFFOLD.yaml §1.1–§1.7. All formula-derived asserts are pre-computed
# literals. Clock default = 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dv_payoff_provisional_vs_binding
        grounds:
          - calculations.payoff_amount
          - entities.Account.fields.total_balance_cents
          - endpoints["GET /collections/accounts/{accountId}/payoff-quote"]
        distinguishing_aspect: "Same Account/Assessment data yields a different payoff on the Account domain: PROVISIONAL accrues interest through now, BINDING through now+15 days, so payoff_amount_cents diverges (103945 vs 104438)."
        test_recipe:
          setup:
            - "Association A (interest_rate_annual_pct=12.0). One Account with a single REGULAR Assessment 100000 due 2026-01-01. Clock at 2026-05-01 (120 days overdue)."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Oak HOA", state_code: "CA", interest_rate_annual_pct: 12.0, late_fee_cents: 2500, management_fee_pct: 20.0 }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "12A", owner_name: "Dana Ives" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 100000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { asm_id: $.data.id }
          trigger:
            - call: "GET /collections/accounts/${acct_id}/payoff-quote"
              payload: { variant: "PROVISIONAL" }
              as: CollectionsAgent
              captures: { payoff_prov: $.data.payoff_amount_cents, int_prov: $.data.accrued_interest_cents }
            - call: "GET /collections/accounts/${acct_id}/payoff-quote"
              payload: { variant: "BINDING" }
              as: CollectionsAgent
              captures: { payoff_bind: $.data.payoff_amount_cents, int_bind: $.data.accrued_interest_cents }
          assert:
            - "PROVISIONAL response data.total_balance_cents == 100000"
            - "PROVISIONAL response data.accrued_interest_cents == 3945"
            - "PROVISIONAL response data.payoff_amount_cents == 103945"
            - "BINDING response data.accrued_interest_cents == 4438"
            - "BINDING response data.payoff_amount_cents == 104438"
            - "payoff_bind - payoff_prov == 493"

      - name: dv_remittance_cash_vs_net
        grounds:
          - calculations.remittance_amounts
          - entities.Remittance.fields.gross_amount_cents
          - entities.Remittance.fields.net_amount_cents
          - concurrency_rules[remittance-create-stale-association]
        distinguishing_aspect: "Same period on the Association/Remittance domain yields a different gross: CASH counts a later-reversed payment (gross 80000, net 64000), NET excludes it (gross 50000, net 40000) — a different entity domain than the Account-domain payoff variant."
        test_recipe:
          setup:
            - "Association A (management_fee_pct=20.0). One Account. Payment p1 50000 received 2026-06-05 (POSTED); Payment p2 30000 received 2026-06-20 then REVERSED. Two remittances over 2026-06-01..2026-06-30, basis CASH and NET."
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Cedar HOA", state_code: "TX", interest_rate_annual_pct: 12.0, late_fee_cents: 2500, management_fee_pct: 20.0 }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "3B", owner_name: "Lee Ono" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 50000, received_date: "2026-06-05T00:00:00Z" }
              as: CollectionsAgent
              captures: { p1_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 30000, received_date: "2026-06-20T00:00:00Z" }
              as: CollectionsAgent
              captures: { p2_id: $.data.id }
            - call: "POST /collections/payments/${p2_id}/reverse"
              payload: { reversal_reason: "NSF" }
              as: CollectionsAgent
            - call: "GET /collections/associations/${assoc_id}"
              as: TrustAccountant
              captures: { assoc_v1: $.data.version }
          trigger:
            - call: "POST /collections/remittances"
              payload: { association_id: "${assoc_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", basis: "CASH", expected_association_version: "${assoc_v1}" }
              as: TrustAccountant
              captures: { rem_cash_id: $.data.id, cash_gross: $.data.gross_amount_cents, cash_net: $.data.net_amount_cents }
            - call: "GET /collections/associations/${assoc_id}"
              as: TrustAccountant
              captures: { assoc_v2: $.data.version }
            - call: "POST /collections/remittances"
              payload: { association_id: "${assoc_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", basis: "NET", expected_association_version: "${assoc_v2}" }
              as: TrustAccountant
              captures: { rem_net_id: $.data.id, net_gross: $.data.gross_amount_cents, net_net: $.data.net_amount_cents }
          assert:
            - "CASH remittance data.gross_amount_cents == 80000"
            - "CASH remittance data.management_fee_cents == 16000"
            - "CASH remittance data.net_amount_cents == 64000"
            - "NET remittance data.gross_amount_cents == 50000"
            - "NET remittance data.management_fee_cents == 10000"
            - "NET remittance data.net_amount_cents == 40000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_payoff_interest_multiinput_mode_a
        grounds:
          - calculations.payoff_amount
          - entities.Assessment.fields.charge_type
        distinguishing_aspect: "Mode (a): payoff interest is a >=3-input non-linear formula (balance × rate × days) with a per-assessment min() usury cap AND a charge_type conditional that excludes ATTORNEY_COST from the interest base — only the 100000 REGULAR accrues interest, the 50000 ATTORNEY_COST does not."
        test_recipe:
          setup:
            - "Association A (rate 12.0). Account with REGULAR 100000 due 2026-01-01 and ATTORNEY_COST 50000 due 2026-01-01. Clock 2026-05-01 (120 days)."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Pine HOA", state_code: "CA", interest_rate_annual_pct: 12.0 }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "9C", owner_name: "Sam Roe" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 100000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "ATTORNEY_COST", amount_cents: 50000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
          trigger:
            - call: "GET /collections/accounts/${acct_id}/payoff-quote"
              payload: { variant: "PROVISIONAL" }
              as: ComplianceOfficer
              captures: { total: $.data.total_balance_cents, interest: $.data.accrued_interest_cents, payoff: $.data.payoff_amount_cents }
          assert:
            - "response data.total_balance_cents == 150000"
            - "response data.accrued_interest_cents == 3945"
            - "response data.payoff_amount_cents == 153945"

      - name: cf_remittance_fee_rounding_mode_b
        grounds:
          - calculations.remittance_amounts
          - entities.Remittance.fields.management_fee_cents
          - concurrency_rules[remittance-create-stale-association]
        distinguishing_aspect: "Mode (b): management fee pins round-per-payment-then-sum. With pct 8.25 on 12345 and 6789, round(1018.4625)+round(560.0925)=1018+560=1578, which differs from round-on-total round(1578.555)=1579; scaffold pins 1578."
        test_recipe:
          setup:
            - "Association B (management_fee_pct=8.25). Account. Payment 12345 received 2026-06-10 and Payment 6789 received 2026-06-15, both POSTED. Remittance over 2026-06-01..2026-06-30 basis CASH."
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Birch HOA", state_code: "AZ", management_fee_pct: 8.25 }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Ada Fern" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 12345, received_date: "2026-06-10T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 6789, received_date: "2026-06-15T00:00:00Z" }
              as: CollectionsAgent
            - call: "GET /collections/associations/${assoc_id}"
              as: TrustAccountant
              captures: { assoc_v: $.data.version }
          trigger:
            - call: "POST /collections/remittances"
              payload: { association_id: "${assoc_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", basis: "CASH", expected_association_version: "${assoc_v}" }
              as: TrustAccountant
              captures: { rem_id: $.data.id, gross: $.data.gross_amount_cents, fee: $.data.management_fee_cents, net: $.data.net_amount_cents }
          assert:
            - "response data.gross_amount_cents == 19134"
            - "response data.management_fee_cents == 1578"
            - "response data.net_amount_cents == 17556"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_notice_dispute_cycle
        grounds:
          - state_machines.Notice.SENT_to_DISPUTED
          - state_machines.Notice.DISPUTED_to_SENT
        distinguishing_aspect: "Notice is cyclic: SENT->DISPUTED->SENT returns to a prior state and re-stamps sent_date to the re-send instant (2026-05-10), clearing dispute_date — a cycle on the Notice entity."
        test_recipe:
          setup:
            - "Account with a DEMAND Notice. Sent at 2026-05-01, disputed at 2026-05-10 (inside 30-day window), then verification re-sent at 2026-05-10."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Elm HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "7", owner_name: "Kit Vale" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "DEMAND" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "DISPUTED" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
              captures: { st: $.data.status, sd: $.data.sent_date }
          assert:
            - "response data.status == SENT"
            - "response data.sent_date == 2026-05-10T00:00:00Z"
            - "response data.dispute_date == null"

      - name: nlsm_plan_breach_reinstate_cycle
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_BREACHED
          - state_machines.PaymentPlan.BREACHED_to_ACTIVE
          - calculations.plan_breach_evaluation
        distinguishing_aspect: "PaymentPlan is cyclic on a different entity than Notice: ACTIVE->BREACHED (missed_count 3 >= 2) then BREACHED->ACTIVE after catch-up (missed_count 1 < 2), re-parking Account back to PAYMENT_PLAN."
        test_recipe:
          setup:
            - "Account DELINQUENT (REGULAR 60000 due 2026-01-01). Plan total 60000, installment 20000, num 3, first_due 2026-06-01 (due dates 06-01,07-01,07-31). Activated. Clock 2026-08-01 -> all 3 due, amount_paid 0 -> missed 3. Then pay 40000 -> missed 1."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Fir HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "5", owner_name: "Nia Poe" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 60000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { acct_v: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { account_id: "${acct_id}", total_amount_cents: 60000, installment_cents: 20000, num_installments: 3, first_due_date: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: CollectionsAgent
              captures: { plan_id: $.data.id }
            - call: "POST /collections/payment-plans/${plan_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CollectionsAgent
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/payment-plans/${plan_id}/transition"
              payload: { to_status: "BREACHED" }
              as: CollectionsAgent
              captures: { breached_status: $.data.status }
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 40000, received_date: "2026-08-01T00:00:00Z" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/payment-plans/${plan_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CollectionsAgent
              captures: { final_status: $.data.status }
          assert:
            - "after BREACHED transition, plan data.status == BREACHED"
            - "trigger response data.status == ACTIVE"
            - "GET /collections/accounts/${acct_id} data.status == PAYMENT_PLAN"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_bankruptcy_stay_depth3
        grounds:
          - state_machines.BankruptcyCase.FILED
          - state_machines.Account.FORECLOSURE_to_BANKRUPTCY
          - state_machines.Lien.FORECLOSING_to_STAYED
          - state_machines.ForeclosureReferral.FILED_to_STAYED
        distinguishing_aspect: "Depth-3 chain from a bankruptcy filing: filing -> Account FORECLOSURE->BANKRUPTCY (L1) -> that account change stays the FORECLOSING Lien (L2) -> the Lien being stayed stays its FILED ForeclosureReferral (L3); each link caused by the previous."
        test_recipe:
          setup:
            - "Account driven to FORECLOSURE: REGULAR 200000 due 2026-01-01, delinquent, INTENT_TO_LIEN sent 2026-01-01, lien recorded 2026-02-01 by officer-1, referral by officer-2 then FILED (Account FORECLOSURE, Lien FORECLOSING). Then bankruptcy filed 2026-02-01."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Maple HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "14", owner_name: "Ray Colt" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 200000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "INTENT_TO_LIEN" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/liens"
              payload: { account_id: "${acct_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { lien_id: $.data.id }
            - call: "POST /collections/foreclosure-referrals"
              payload: { account_id: "${acct_id}", lien_id: "${lien_id}", attorney_name: "Doe & Firm" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { ref_id: $.data.id }
            - call: "POST /collections/foreclosure-referrals/${ref_id}/transition"
              payload: { to_status: "FILED" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /collections/bankruptcy-cases"
              payload: { account_id: "${acct_id}", chapter: "CH13", case_number: "26-90001", filed_date: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { bk_id: $.data.id, bk_status: $.data.status }
          assert:
            - "trigger response data.status == FILED"
            - "GET /collections/accounts/${acct_id} data.status == BANKRUPTCY"
            - "GET /collections/liens/${lien_id} data.status == STAYED"
            - "GET /collections/foreclosure-referrals/${ref_id} data.status == STAYED"

      - name: tc_full_payment_depth2
        grounds:
          - calculations.payment_allocation
          - state_machines.Assessment.OPEN_to_PAID
          - state_machines.Account.DELINQUENT_to_CURRENT
        distinguishing_aspect: "Depth-2 bubble-up from a different trigger (payment, not filing): allocation drives the Assessment OPEN->PAID (L1); the resulting zero total_balance drives Account DELINQUENT->CURRENT (L2)."
        test_recipe:
          setup:
            - "Account DELINQUENT with a single REGULAR 50000 due 2026-01-01. Clock 2026-05-01."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Aspen HOA", state_code: "CO" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "2", owner_name: "Uma Ash" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 50000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { asm_id: $.data.id }
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 50000, received_date: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { pay_id: $.data.id, unapplied: $.data.unapplied_cents }
          assert:
            - "trigger response data.unapplied_cents == 0"
            - "GET /collections/assessments/${asm_id} data.status == PAID"
            - "GET /collections/assessments/${asm_id} data.balance_cents == 0"
            - "GET /collections/accounts/${acct_id} data.status == CURRENT"
            - "GET /collections/accounts/${acct_id} data.total_balance_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pp_temporal_beats_minimum
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_VALIDATION_PERIOD_ACTIVE]
        distinguishing_aspect: "Category pair business_temporal (priority 10) vs business_constraint (priority 12): lien attempt with validation period NOT elapsed AND balance below minimum returns ERR_VALIDATION_PERIOD_ACTIVE, proving temporal outranks the minimum-balance constraint."
        test_recipe:
          setup:
            - "Account DELINQUENT, balance 100000 (< 180000 min). INTENT_TO_LIEN notice SENT at 2026-05-01, clock still 2026-05-01 (0 days elapsed < 30)."
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Willow HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "8", owner_name: "Eve Nash" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 100000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "INTENT_TO_LIEN" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/liens"
              payload: { account_id: "${acct_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
