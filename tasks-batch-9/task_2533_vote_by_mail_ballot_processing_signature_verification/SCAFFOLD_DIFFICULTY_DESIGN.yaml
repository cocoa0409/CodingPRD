            - call: "POST /vote-by-mail/voters"
              payload: { full_name: "Ann Pike", party_affiliation: "DEM", residence_address: "6 Fir St", last_signature_update_at: "2026-01-05T00:00:00Z", signature_on_file_count: 1, uocava_status: "NONE" }
              as: ElectionsClerk
