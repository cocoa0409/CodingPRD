              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_m1_id: $.data.id }
            - call: "POST /district-energy/metering-points/${mp_m1_id}/commission"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/metering-points/${mp_m1_id}/readings"
