            - call: "POST /api/programs/${ee1_p}/templates"
              payload:
                name: "T1"
                chassis_model_id: "${ee1_l}"
                pinned_components: [{ component_id: "${ee1_c}", revision: "A01", qty: 1 }]
              as: AccountManager
              captures: { ee1_t: $.data.id }
            - { call: "POST /api/templates/${ee1_t}/publish", payload: {}, as: AccountManager }
            - { call: "POST /api/programs/${ee1_p}/lock", payload: {}, as: AccountManager }
            - call: "POST /api/configurations"
              payload:
                account_id: "${ee1_a}"
                chassis_model_id: "${ee1_l}"
                component_selections: [{ component_id: "${ee1_c}", qty: 1 }]
                template_id: "${ee1_t}"
              as: CustomerUser
              as_user_id: "${ee1_a}"
              captures: { ee1_cf: $.data.id }
            - { call: "POST /api/configurations/${ee1_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${ee1_a}" }
            - { call: "POST /api/configurations/${ee1_cf}/lock", payload: {}, as: AccountManager, captures: { ee1_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${ee1_a}", po_number: "PO-EE1" }, as: CustomerUser, as_user_id: "${ee1_a}", captures: { ee1_o: $.data.id } }
            - { call: "POST /api/orders/${ee1_o}/lines", payload: { configuration_id: "${ee1_cf}", qty: 2, ship_to_mode: "DROP_SHIP_EMPLOYEES" }, as: CustomerUser, as_user_id: "${ee1_a}", captures: { ee1_ol: $.data.id } }
            - { call: "POST /api/orders/${ee1_o}/submit", payload: { expected_configuration_version: "${ee1_cv}" }, as: CustomerUser, as_user_id: "${ee1_a}" }
            - call: "GET /api/orders/${ee1_o}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                ee1_j: $.data[0].id
            - { call: "POST /api/build-jobs/${ee1_j}/allocate", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${ee1_j}/start", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${ee1_j}/complete", payload: {}, as: FactoryOps }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/orders/${ee1_o}/deployment-waves"
              payload:
                wave_label: "W1"
                ship_window_start: "2026-09-02T00:00:00Z"
                ship_window_end: "2026-09-20T00:00:00Z"
                destinations: [{ employee_ref: "EMP-A", address: "1 A St", units: 1 }, { employee_ref: "EMP-B", address: "2 B St", units: 1 }]
