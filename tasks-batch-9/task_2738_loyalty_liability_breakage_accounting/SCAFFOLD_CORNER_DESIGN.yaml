              as: LoyaltyAccountant
              captures: { err_period: $.data.error_id }
            - call: "POST /point-lots"
              payload: { member_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { err_member: $.data.error_id }
            - call: "POST /point-lots"
              payload: { member_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", period_id: "ffffffff-ffff-ffff-ffff-ffffffffffff", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
