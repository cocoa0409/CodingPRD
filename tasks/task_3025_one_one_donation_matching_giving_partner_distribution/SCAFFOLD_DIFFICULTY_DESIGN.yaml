            - "PartnerCapacityProfile.${cap_id}.reserved_units == 1000 while committed_units is still 1000"
            - "the successor season's DonationLiability for ${prod_id} reports carried_in_units == 1000"
            - "the identical reversal resent after the season's freezes_at returns 409 ERR_SEASON_FROZEN, not a repeat reversal"
            - "with the clock still at 2026-10-15T00:00:00Z a second reversal against the same allocation returns 409 ERR_INVALID_STATE_TRANSITION because the allocation is already REVERSED"

  # ===========================================================================
  # Rule 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancellation_and_compensating_settlement_restore_the_unit_ledger_exactly
        grounds:
          - calculations.provisional_liability_accrual
          - calculations.final_liability_accrual
          - state_machines.SalesOrder.CREATED_to_CANCELLED
          - entities.ImpactSeason.fields.claim_frozen_units_total
        distinguishing_aspect: "Cancelling a CREATED order and then re-creating the identical settlement both rewrite the same conserved quantity, provisional_liability_units, and the 13 → 9 → 13 round trip proves the compensating action restores the ledger with zero drift rather than merely landing near it."
        test_recipe:
          setup:
            - "The running season is OPEN at 2026-09-01T00:00:00Z; one DUAL_CHANNEL product with two eligible lines, ratio 1; one PAID order of 9 units and one CREATED order of 4 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id }
            - call: "POST /impact-program/donation-products"
              payload: { product_name: "Workwear Crew", product_kind: "ATHLETIC_SOCK", design_channel: "DUAL_CHANNEL", obligation_model: "AT_SALE", approved_donation_ratio_units: 1, retail_price_cents: 1650, unit_cost_cents: 1150, is_reusable: true }
              as: ProductDesigner
              captures: { prod_id: $.data.id }
            - call: "POST /impact-program/donation-products/${prod_id}/activate"
              payload: {}
              as: ProductDesigner
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000204", unit_size_label: "M", is_essential_good: true, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_sold_id: $.data.id }
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000205", unit_size_label: "L", is_essential_good: false, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_held_id: $.data.id }
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-CI-1", channel: "RETAIL_ECOM" }
              as: CustomerService
              captures: { ord_paid_id: $.data.id }
            - call: "POST /impact-program/sales-orders/${ord_paid_id}/lines"
              payload: { donation_product_line_id: "${pline_sold_id}", quantity: 9, unit_price_cents: 1650, line_discount_cents: 0 }
              as: CustomerService
            - call: "POST /impact-program/sales-orders/${ord_paid_id}/pay"
              payload: {}
              as: CustomerService
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-CI-2", channel: "RETAIL_POS" }
              as: CustomerService
              captures: { ord_held_id: $.data.id }
            - call: "POST /impact-program/sales-orders/${ord_held_id}/lines"
              payload: { donation_product_line_id: "${pline_held_id}", quantity: 4, unit_price_cents: 1650, line_discount_cents: 0 }
              as: CustomerService
              captures: { soline_held_id: $.data.id }
          trigger:
            - call: "POST /impact-program/sales-orders/${ord_held_id}/cancel"
              payload: { reason: "Customer abandoned checkout before payment" }
              as: CustomerService
            - call: "POST /impact-program/sales-orders/${ord_held_id}/lines"
              payload: { donation_product_line_id: "${pline_held_id}", quantity: 4, unit_price_cents: 1650, line_discount_cents: 0 }
              as: CustomerService
              captures: { replacement_line_id: $.data.id }
            - call: "POST /impact-program/sales-orders/${ord_held_id}/pay"
              payload: {}
              as: CustomerService
          assert:
            - "before the trigger the product's provisional_liability_units for the season == 13 and final_liability_units == 9"
            - "after the cancellation provisional_liability_units == 9, a drop of exactly the cancelled line's 4 units"
            - "final_liability_units is still 9 after the cancellation, proving only the provisional ledger moved"
            - "after re-adding and paying the identical 4 units, provisional_liability_units == 13 and final_liability_units == 13"
            - "ImpactSeason.${s_id}.claim_frozen_units_total == 13 at the end, identical to the pre-cancellation reading, so the compensating action leaves zero drift"
            - "DonationProduct.${prod_id}.obligation_units_total == 13"

      - name: reversal_and_forward_carry_restore_the_committed_unit_pool
        grounds:
          - calculations.weighted_allocation
          - entities.PartnerCapacityProfile.fields.committed_units
          - entities.PartnerCapacityProfile.fields.reserved_units
          - state_machines.DonationAllocation.APPROVED_to_CANCELLED
        distinguishing_aspect: "Capacity commitment and its compensation are tracked in two different pools: cancelling a still-pending allocation returns committed_units to zero while a reversal leaves committed_units untouched and parks the same units in reserved_units, so the conserved quantity has a named formula and two distinct compensating mechanics."
