            - call: "POST /foreign-organizations"
              payload: { legal_name: "Beta Holdings", country_code: "SG", org_type: "COMPANY", own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_b: $.data.id }
            - call: "GET /foreign-organizations/${org_a}"
              payload: {}
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_a_ver_stale: $.data.version }
            - call: "POST /foreign-organizations/${org_a}/ownership"
              payload: { parent_organization_id: "${org_b}", parent_ownership_pct: 60.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          trigger:
            - call: "POST /foreign-organizations/${org_a}/designate"
              payload: { own_designation: "SDN", designated_on: "2026-08-01T00:00:00Z", expected_organization_version: "${org_a_ver_stale}" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-2"
            - call: "GET /foreign-organizations/${org_a}"
              payload: {}
              as: ResearchSecurityOfficer
              as_user_id: "rso-2"
              captures: { org_a_ver_fresh: $.data.version }
            - call: "POST /foreign-organizations/${org_a}/designate"
              payload: { own_designation: "SDN", designated_on: "2026-08-01T00:00:00Z", expected_organization_version: "${org_a_ver_fresh}" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-2"
          assert:
            - "trigger call 1 returns 412 with data.error_id == ERR_STALE_VERSION and ORG_A still reads own_designation NONE with parent_organization_id ${org_b}"
            - "trigger call 3 returns 200: own_designation == SDN, effective_designation == SDN, effective_designation_depth == 0, and parent_ownership_pct is still 60.00 — the retry did not clobber the ownership edit"

      - name: risk_score_reconciles_after_the_source_item_is_withdrawn
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
          - calculations.investigator_risk_score
          - state_machines.DisclosureItem.DECLARED_to_WITHDRAWN
        distinguishing_aspect: "The derived aggregate is correct after create, after a second contributing row appears, and after the source row is removed: withdrawing the talent-program item must take the score back down through the posture threshold rather than leaving a high-water mark."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; investigator INV with a DRAFT 2026-ANNUAL disclosure carrying an unpaid FOREIGN_APPOINTMENT item (12) and an unpaid TALENT_PROGRAM item (30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Quentin Adler", email: "quentin.adler@uni.edu", appointment_type: "FACULTY", home_department: "Mathematics" }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { inv_ver: $.data.version }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Tianjin Analysis Centre", country_code: "CN", org_type: "INSTITUTE", own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_id: $.data.id }
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d_id: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "FOREIGN_APPOINTMENT", foreign_organization_id: "${org_id}", start_date: "2026-01-01T00:00:00Z", annual_effort_hours: 40, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { i_fa: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "TALENT_PROGRAM", foreign_organization_id: "${org_id}", start_date: "2026-02-01T00:00:00Z", annual_effort_hours: 80, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { i_tp: $.data.id }
          trigger:
            - call: "POST /disclosure-items/${i_tp}/status"
              payload: { to_status: "WITHDRAWN" }
              as: Investigator
              as_user_id: "${inv_id}"
          assert:
            - "before the trigger: Investigator.risk_score == 42 (12 + 30) with disclosure_posture == REVIEW_REQUIRED, item_count == 2, outside_effort_pct == 5.77 (1.92 + 3.85)"
            - "after the trigger: item ${i_tp}.status == WITHDRAWN, Investigator.risk_score == 12, disclosure_posture == CLEAR, item_count == 1, outside_effort_pct == 1.92"
            - "the surviving item ${i_fa} is untouched and Disclosure.completeness_score is still 100 with completeness_tier A"

      - name: cascade_chain_end_to_end_is_covered_by_the_incident_probe
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: critical_incident_cascades_posture_grants_counts_and_project_security
          rationale: "That instance walks the full five-level chain from one substantiation through posture, grants, active_grant_count, controlled_area_posture and project security_status, which is the deepest available end-to-end assertion of this layer."

      - name: cascade_ordering_sensitivity_is_covered_by_the_designation_probe
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: parent_designation_change_cascades_through_ownership_to_grants
          rationale: "Ordering sensitivity is only observable where the imputed designation must be recomputed before the subaward re-screen that reads it, which is exactly what that instance asserts step by step."

      - name: screening_variant_divergence_is_covered_by_the_dual_variant_probe
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: subaward_screening_direct_match_vs_ownership_transitive_diverge
          rationale: "Both variants are run against the same counterparty there and the delta on switch is asserted numerically, so a separate breadth instance would restate it."

      - name: support_variant_divergence_is_covered_by_the_dual_variant_probe
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: support_statement_strict_agency_vs_institutional_rollup_flip_verdict
          rationale: "The second variant pair is exercised there on one statement, including the verdict flip and the resulting activation-blocker change."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: designation_cascade_is_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.effective_designation
        distinguishing_aspect: "There is no lag anywhere: the write response already carries the parent's new designation, and the very next read of the child — with no intervening write or delay — shows the imputed designation and its depth, so a deferred or batched recompute is detectable."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; ORG_PARENT (own NONE) with ORG_CHILD held 100.00%, and ORG_CHILD's own designation NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Meridian Group", country_code: "AE", org_type: "COMPANY", own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_parent: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Meridian Optics", country_code: "AE", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${org_parent}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_child: $.data.id }
            - call: "GET /foreign-organizations/${org_parent}"
              payload: {}
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { parent_ver: $.data.version }
          trigger:
            - call: "POST /foreign-organizations/${org_parent}/designate"
              payload: { own_designation: "ENTITY_LIST", designated_on: "2026-08-01T00:00:00Z", expected_organization_version: "${parent_ver}" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "GET /foreign-organizations/${org_child}"
              payload: {}
              as: AgencyLiaison
              as_user_id: "liaison-1"
          assert:
            - "before the trigger both organizations read effective_designation NONE with effective_designation_depth 0"
            - "the write response for ${org_parent} already reads own_designation == ENTITY_LIST, effective_designation == ENTITY_LIST, effective_designation_depth == 0"
            - "the immediately following read of ${org_child} reads effective_designation == ENTITY_LIST with effective_designation_depth == 1 and own_designation still NONE"
            - "no second write or retry is needed for the child to converge"
