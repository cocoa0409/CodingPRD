# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_3190_direct_store_delivery_route_sales_shelf_execution
# Breadth probe over §1.1–§1.7 claims not already exercised by §1.8.
# Corners covered by §1.8 appear as excluded_because stubs (no test_recipe).
# Shared fixture vocabulary: default clock 2026-09-01T00:00:00Z; in-window ops
# use 2026-09-01T09:00:00Z (minute 540 inside [480, 720)); 2026-09-01 = TUE.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: store_create_returns_declared_fields_with_defaults
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints.POST_/dsd/stores
        distinguishing_aspect: "A store created with the seven required inputs returns 201 with status ACTIVE, promo_rebate_balance_cents 0, version 1, and system id/created_at/updated_at — none of them client-supplied."
        test_recipe:
          setup: ["Empty database; clock at the 2026-09-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "CONVENIENCE", credit_policy: "SALVAGE_RATE", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 5000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Store.${store_id}.status == ACTIVE and promo_rebate_balance_cents == 0 and version == 1"
            - "Store.${store_id}.credit_policy == SALVAGE_RATE and format == CONVENIENCE"
            - "data carries non-null id, created_at, updated_at; meta.api_request_id and meta.api_request_timestamp present"

      - name: product_get_roundtrips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Product
          - endpoints.GET_/dsd/products/{productId}
        distinguishing_aspect: "Every stored product field round-trips through GET unchanged, including the defaulted promo_eligible true."
        test_recipe:
          setup: ["Clock at default."]
          setup_api_calls:
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 335, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /dsd/products/${prod_id}"
              payload: {}
              as: RouteSupervisor
          assert:
            - "Product.${prod_id}.sku == P-1 and case_price_cents == 335 and shelf_life_days == 60"
            - "Product.${prod_id}.promo_eligible == true (default applied)"

      - name: orders_list_filters_by_store_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/dsd/orders
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filtered list honors store_id, returns pagination_fields, and reports total_count over the whole filtered set rather than the page."
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Two stores assigned TUE; product P 500 cents; day loaded 100 cases and started; three DRAFT orders created (two at store A, one at store B)."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_a_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SB", name: "Store B", format: "DOLLAR", credit_policy: "SALVAGE_RATE", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_b_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_a_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_b_id}", service_weekdays: ["TUE"], stop_sequence: 2 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 100 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_a_id}", lines: [{ product_id: "${prod_id}", qty_cases: 1 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_a_id}", lines: [{ product_id: "${prod_id}", qty_cases: 2 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_b_id}", lines: [{ product_id: "${prod_id}", qty_cases: 3 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "GET /dsd/orders"
              payload: { store_id: "${store_a_id}", limit: 1, offset: 0 }
              as: RouteSupervisor
              captures: { total: "$.data[0].id" }
            - call: "GET /dsd/orders"
              payload: { store_id: "${store_b_id}" }
              as: RouteSupervisor
          assert:
            - "the store A query returns exactly 1 row with total_count == 2 and has_more == true"
            - "the store B query returns exactly 1 row with total_count == 1 and has_more == false"

      - name: route_day_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/dsd/route-days/{routeDayId}
          - errors.ERR_ROUTE_DAY_NOT_FOUND
        distinguishing_aspect: "A well-formed but unknown route-day id returns 404 with the route-day-specific error id, in the error envelope shape."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "GET /dsd/route-days/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: RouteSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and response_type == error"
            - "err == ERR_ROUTE_DAY_NOT_FOUND and data.message is non-empty"

      - name: order_create_missing_lines_returns_validation_error
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/dsd/orders
          - errors.ERR_VALIDATION
        distinguishing_aspect: "Omitting the required lines array fails at ERR_VALIDATION before any state or referential check can pass."
        test_recipe:
          setup: ["Clock 2026-09-01T09:00:00Z; rep, store, product, route, assignment, started day all provisioned."]
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 10 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}" }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_VALIDATION"

      - name: order_line_discount_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.OrderLine.fields.line_discount_pct
          - calculations.order_line_pricing
        distinguishing_aspect: "A line without line_discount_pct prices at full list: 7 x 335 = 2345 with no rounding loss."
        test_recipe:
          setup: ["Clock 2026-09-01T09:00:00Z; full route-day setup with product P at 335 cents and 10 cases loaded, day started."]
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 335, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 10 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", lines: [{ product_id: "${prod_id}", qty_cases: 7 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { order_id: $.data.id }
          assert:
            - "StoreOrder.${order_id}.gross_total_cents == 2345"
            - "the single OrderLine has line_discount_pct == 0 and line_total_cents == 2345"

      - name: non_event_day_capacity_ignores_surge_branch
        claim_type: Computed Fields
        grounds:
          - calculations.route_day_capacity
          - entities.RouteDay.fields.capacity_cases
        excluded_because:
          difficulty_instance: event_day_capacity_nested_min_with_surge_branch
          rationale: "The §1.8 instance asserts both branches of the capacity formula, including capacity 100 on the non-event day."

      - name: store_create_with_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Store
          - endpoints.POST_/dsd/stores
        distinguishing_aspect: "Client-supplied id/version/status in the create payload are ignored: the server mints id, sets version 1, and derives status ACTIVE."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          assert:
            - "Store.${store_id}.version == 1 and status == ACTIVE"
            - "Store.${store_id}.id equals the server-minted value in the response, not any client input"

      - name: order_type_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.StoreOrder.fields.order_type
          - errors.ERR_VALIDATION
        distinguishing_aspect: "An order_type outside {STANDARD, EVENT_SURGE} is a 400 ERR_VALIDATION, not a silent default to STANDARD."
        test_recipe:
          setup: ["Clock 2026-09-01T09:00:00Z; full route-day setup, day started."]
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 10 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", order_type: "BOGUS", lines: [{ product_id: "${prod_id}", qty_cases: 1 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_VALIDATION"

      - name: assignments_reverse_reachable_from_store_via_filtered_list
        claim_type: Parent Relationships
        grounds:
          - entities.RouteStoreAssignment.fields.store_id
          - endpoints.GET_/dsd/route-assignments
        distinguishing_aspect: "The flat-topology FK store_id is reverse-reachable: GET /dsd/route-assignments?store_id returns exactly the assignments of that store as an array."
        test_recipe:
          setup: ["Clock at default; two routes with distinct reps; store assigned to route 1 only."]
          setup_api_calls:
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep1_id: $.data.id }
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep Two", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep2_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep1_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route1_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-2", rsr_id: "${rep2_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route2_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route1_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
              captures: { asg_id: $.data.id }
          trigger:
            - call: "GET /dsd/route-assignments"
              payload: { store_id: "${store_id}" }
              as: RouteSupervisor
            - call: "GET /dsd/routes"
              payload: { rsr_id: "${rep2_id}" }
              as: RouteSupervisor
          assert:
            - "the assignment query returns exactly 1 row with id == ${asg_id} and route_id == ${route1_id}"
            - "the routes-by-rep query returns exactly 1 row with id == ${route2_id} (FK Route.rsr_id reverse-reachability)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: route_day_created_in_planned_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.RouteDay
          - endpoints.POST_/dsd/route-days
        distinguishing_aspect: "A new route day starts PLANNED with zeroed movement counters, before any load."
        test_recipe:
          setup: ["Clock at default; rep, store assigned TUE; route active."]
          setup_api_calls:
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
          trigger:
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
          assert:
            - "RouteDay.${day_id}.status == PLANNED"
            - "RouteDay.${day_id}.loaded_cases == 0 and delivered_cases == 0 and stale_pulled_cases == 0"
            - "RouteDay.${day_id}.capacity_cases == 100 and is_event_day == false and event_surge_cases == 0"

      - name: start_from_planned_rejected_not_loaded
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RouteDay.LOADED_to_IN_PROGRESS
          - errors.ERR_ROUTE_DAY_NOT_LOADED
        distinguishing_aspect: "Start is legal only from LOADED; starting a PLANNED (never loaded) day is a domain-specific 409, not a generic invalid-state error."
        test_recipe:
          setup: ["Clock at default; full setup through a PLANNED route day (no load call)."]
          setup_api_calls:
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
          trigger:
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_ROUTE_DAY_NOT_LOADED"
            - "RouteDay.${day_id}.status remains PLANNED"

      - name: cancel_delivered_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.StoreOrder
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "DELIVERED is terminal: a cancel after delivery is ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["Clock 2026-09-01T09:00:00Z; full setup; order of 5 cases submitted and delivered."]
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
