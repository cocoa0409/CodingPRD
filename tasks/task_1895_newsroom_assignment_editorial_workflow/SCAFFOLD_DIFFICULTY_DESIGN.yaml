  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_constraint_on_assign
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STAFF_TIME_CONFLICT]
        distinguishing_aspect: |
          Error-category pair (state, business_constraint): the proposal targets
          a KILLED story (state, priority 7) AND overlaps the reporter's
          ACCEPTED assignment 10:00-12:00 (business_constraint, priority 12) —
          the state error ERR_INVALID_STATE must win over ERR_STAFF_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Reporter with an ACCEPTED assignment [2026-08-01T10:00, 2026-08-01T12:00) on story A"
            - "Story B greenlit then KILLED by the managing editor while still DRAFT"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Nine", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Nine", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
