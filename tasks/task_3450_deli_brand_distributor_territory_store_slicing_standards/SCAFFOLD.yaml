  - { method: GET, path: "/api/incidents", description: "list incidents; filters plant_id?, status?, severity?", roles: [BrandAdmin, PlantScheduler, SafetyOfficer], code: 200, input: ["plant_id?", "status?", "severity?"], output: "Incident[]", side_effects: ["recompute affected_account_count per calculations.incident_scope_projection"] }
  - { method: POST, path: "/api/incidents/{id}/transition", description: "advance the incident lifecycle per state_machines.Incident; resolution_outcome required for RESOLVED", roles: [SafetyOfficer], code: 200, input: [to, "resolution_outcome?"], output: Incident, side_effects: ["cascades per transition", "increments Incident.version by 1"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "test-driving endpoint: set the logical clock. Server startup default (before any call) is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time.", roles: [BrandAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["lazy transitions re-evaluated against the new clock on subsequent reads"] }

  - { method: GET, path: "/api/distributors/{id}", description: "read one distributor with computed performance scores", roles: [BrandAdmin, DistributorRep, RetailManager, PlantScheduler, SafetyOfficer], code: 200, input: [], output: Distributor, side_effects: ["recompute performance scores per calculations.distributor_performance_score"] }
  - { method: GET, path: "/api/territories/{id}", description: "read one territory (lazy REVOKED -> OPEN evaluation applies)", roles: [BrandAdmin, DistributorRep, RetailManager, PlantScheduler, SafetyOfficer], code: 200, input: [], output: Territory, side_effects: ["lazy REVOKED -> OPEN evaluation"] }
  - { method: GET, path: "/api/accounts/{id}", description: "read one account with computed late_pulls_30d and training_compliant", roles: [BrandAdmin, DistributorRep, RetailManager, SafetyOfficer], code: 200, input: [], output: Account, side_effects: [] }
  - { method: GET, path: "/api/products/{id}", description: "read one product", roles: [BrandAdmin, DistributorRep, RetailManager, PlantScheduler, SafetyOfficer], code: 200, input: [], output: Product, side_effects: [] }
  - { method: GET, path: "/api/account-product-authorizations/{id}", description: "read one authorization", roles: [BrandAdmin, DistributorRep, RetailManager, SafetyOfficer], code: 200, input: [], output: AccountProductAuthorization, side_effects: [] }
  - { method: GET, path: "/api/orders/{id}", description: "read one order with both state dimensions and pricing fields", roles: [BrandAdmin, DistributorRep, PlantScheduler], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/api/order-lines/{id}", description: "read one order line", roles: [BrandAdmin, DistributorRep, PlantScheduler], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: GET, path: "/api/plants/{id}", description: "read one plant", roles: [BrandAdmin, DistributorRep, RetailManager, PlantScheduler, SafetyOfficer], code: 200, input: [], output: Plant, side_effects: [] }
  - { method: GET, path: "/api/production-runs/{id}", description: "read one production run", roles: [BrandAdmin, PlantScheduler, SafetyOfficer], code: 200, input: [], output: ProductionRun, side_effects: [] }
  - { method: GET, path: "/api/lots/{id}", description: "read one lot (lazy EXHAUSTED evaluation applies)", roles: [BrandAdmin, DistributorRep, PlantScheduler, SafetyOfficer], code: 200, input: [], output: Lot, side_effects: ["lazy EXHAUSTED evaluation"] }
  - { method: GET, path: "/api/deliveries/{id}", description: "read one delivery", roles: [BrandAdmin, DistributorRep, RetailManager, SafetyOfficer], code: 200, input: [], output: Delivery, side_effects: [] }
  - { method: GET, path: "/api/service-visits/{id}", description: "read one service visit", roles: [BrandAdmin, DistributorRep, RetailManager, SafetyOfficer], code: 200, input: [], output: ServiceVisit, side_effects: [] }
  - { method: GET, path: "/api/slicers/{id}", description: "read one slicer", roles: [BrandAdmin, DistributorRep, RetailManager, SafetyOfficer], code: 200, input: [], output: Slicer, side_effects: [] }
  - { method: GET, path: "/api/opened-product-logs/{id}", description: "read one opened-product log", roles: [BrandAdmin, DistributorRep, RetailManager, SafetyOfficer], code: 200, input: [], output: OpenedProductLog, side_effects: [] }
  - { method: GET, path: "/api/training-certifications/{id}", description: "read one certification (lazy EXPIRED evaluation applies)", roles: [BrandAdmin, DistributorRep, RetailManager], code: 200, input: [], output: TrainingCertification, side_effects: ["lazy EXPIRED evaluation"] }
  - { method: GET, path: "/api/promo-programs/{id}", description: "read one promo program with reserve/spend fields", roles: [BrandAdmin, DistributorRep, RetailManager], code: 200, input: [], output: PromoProgram, side_effects: [] }
  - { method: GET, path: "/api/incidents/{id}", description: "read one incident with computed affected_account_count", roles: [BrandAdmin, PlantScheduler, SafetyOfficer], code: 200, input: [], output: Incident, side_effects: ["recompute affected_account_count per calculations.incident_scope_projection"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not allowed on endpoint, or entity-backed ownership mismatch (X-User-ID does not match the owning distributor/account/plant)" }
  - { id: ERR_VALIDATION, http: 400, condition: "malformed body: missing required field, wrong type, unknown enum value, non-positive quantity, window_start >= window_end, start_date > end_date" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "a referenced id (path or body) does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "entity not in a from-state of the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "entity is in a terminal state; all further transitions rejected" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_territory_version does not match the territory's current version" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "code already in use by another entity of the same type" }
  - { id: ERR_CHANNEL_REFUSED, http: 422, condition: "approval of a MASS_MERCHANT or CLUB_STORE account is refused" }
  - { id: ERR_PRODUCT_CHANNEL_RESTRICTED, http: 422, condition: "channel_restricted product authorized for a non-INDEPENDENT_GROCER account" }
  - { id: ERR_TERRITORY_VIOLATION, http: 422, condition: "territory not effectively GRANTED to the proposing/servicing distributor" }
  - { id: ERR_DISTRIBUTOR_NOT_ACTIVE, http: 409, condition: "distributor status is not ACTIVE for an operation requiring it" }
  - { id: ERR_ACCOUNT_NOT_APPROVED, http: 409, condition: "account approval_status is not APPROVED for an operation requiring it" }
  - { id: ERR_PRODUCT_NOT_AUTHORIZED, http: 422, condition: "delivered product lacks an AUTHORIZED authorization for the account" }
  - { id: ERR_ALLERGEN_CROSS_CONTACT, http: 422, condition: "slicer dedication/cleaning requirements not met for the product's allergen profile" }
  - { id: ERR_LOT_EXPIRED, http: 422, condition: "delivery line lot has now >= lot.expires_at at confirmation" }
  - { id: ERR_LOT_NOT_DELIVERABLE, http: 422, condition: "delivery line lot is QUARANTINED or RECALLED" }
  - { id: ERR_TRAINING_INSUFFICIENT, http: 422, condition: "fewer than 2 ACTIVE slicing-module or 2 ACTIVE allergen-module certifications at the account" }
  - { id: ERR_RUN_OVERLAP, http: 409, condition: "production run window overlaps another non-cancelled run on the same plant line (half-open semantics)" }
  - { id: ERR_VISIT_TOO_CLOSE, http: 409, condition: "service visit overlaps or sits < 30 minutes from another non-cancelled visit at the same account" }
  - { id: ERR_PROMO_WINDOW_OVERLAP, http: 409, condition: "promo date interval overlaps an AUTHORIZED/SUSPENDED program for the same account+product (closed intervals)" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "planned_units > capacity_units, or actual_units + waste_units > capacity_units, or actual_units < waste_units" }
  - { id: ERR_QUANTITY_MISMATCH, http: 422, condition: "delivery line qty exceeds the allocated pool, lot product not on the order, or account not served by the order's distributor" }
  - { id: ERR_PROMO_BELOW_FLOOR, http: 422, condition: "promo_price_cents below the regulatory floor (85% of base price, round_half_up)" }
  - { id: ERR_PROMO_BUDGET_EXCEEDED, http: 422, condition: "provisional reserve or final settlement exceeds program budget_cents" }
  - { id: ERR_INCIDENT_ACTIVE, http: 422, condition: "plant is SHUTDOWN; scheduling or completing runs is blocked" }

roles:
  - name: BrandAdmin
    description: "brand headquarters operator: owns master data, territory grants, account approval, promo authorization and settlement"
    identity: opaque
    exclusive_operations: ["create distributors/products/plants/territories", "grant/revoke territories", "review/suspend/reinstate accounts", "authorize/revoke authorizations", "authorize/settle promo programs", "revoke training certifications", "set logical clock"]
    shared_operations: ["list any collection"]
  - name: DistributorRep
    description: "independent territory distributor representative; proposes and services accounts, orders product, delivers, runs in-store service and training"
    identity: "entity_backed:Distributor"
    exclusive_operations: ["propose accounts", "create/cancel orders", "create deliveries", "schedule/submit service visits", "create training certifications", "draft promo programs"]
    shared_operations: ["list distributors/territories/accounts/products/authorizations/orders/order-lines/lots/deliveries/service-visits/slicers/opened-product-logs/training-certifications/promo-programs"]
  - name: RetailManager
    description: "deli/account manager; receives deliveries, manages slicers and opened-product freshness logs"
    identity: "entity_backed:Account"
    exclusive_operations: ["confirm/reject deliveries", "register/decommission slicers", "create/pull opened-product logs"]
    shared_operations: ["list accounts/deliveries/service-visits/slicers/opened-product-logs/training-certifications/promo-programs/distributors/territories/products/authorizations"]
  - name: PlantScheduler
    description: "plant production planner; schedules and completes runs, allocates weekly orders"
    identity: "entity_backed:Plant"
    exclusive_operations: ["create/complete production runs", "allocate-week"]
    shared_operations: ["list production-runs/lots/orders/order-lines/incidents/distributors/territories/products"]
  - name: SafetyOfficer
    description: "quality/food-safety officer; owns incidents and verifies service visits (segregated from visit submission)"
    identity: opaque
    exclusive_operations: ["create/transition incidents", "review service visits"]
    shared_operations: ["list distributors/territories/accounts/products/authorizations/lots/deliveries/service-visits/slicers/opened-product-logs/incidents/production-runs"]
