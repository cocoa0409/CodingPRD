              payload: { legal_name: "PinCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", commodity_code: "PIN", value_cents: 9000000, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z" }
              as: ContractOfficer
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/approve-review"
              as: ContractOfficer
            - call: "POST /contracts/${c_id}/execute"
              as: ProcurementDirector
              captures: { c_ver: $.data.version }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", contract_id: "${c_id}", lines: [{ commodity_code: "PIN", description: "paper", quantity: 1, unit_price_cents: 300000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r1_id: $.data.id }
            - call: "POST /requisitions/${r1_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r1_id}/issue-po"
              as: Buyer
              captures: { po_pin: $.data.contract_version_pinned, po_id: $.data.id }
          trigger:
            - call: "POST /contracts/${c_id}/amend"
              payload: { expected_contract_version: "${c_ver}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z", terms_text: "extended one year" }
              as: ContractOfficer
              captures: { amend_id: $.data.id }
            - call: "POST /contracts/${amend_id}/submit-review"
              as: ContractOfficer
            - call: "POST /contracts/${amend_id}/approve-review"
              as: ContractOfficer
            - call: "POST /contracts/${amend_id}/execute"
              as: ProcurementDirector
              captures: { amend_status: $.data.status }
            - call: "GET /contracts/${c_id}"
              as: ProcurementAdmin
              captures: { c_status: $.data.status }
            - call: "GET /purchase-orders/${po_id}"
              as: ProcurementAdmin
              captures: { po_pin_after: $.data.contract_version_pinned }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", contract_id: "${c_id}", lines: [{ commodity_code: "PIN", description: "toner", quantity: 1, unit_price_cents: 200000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r2_id: $.data.id }
            - call: "POST /requisitions/${r2_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "PO.contract_version_pinned == the version captured at execute (4) and is unchanged after the amendment executes"
            - "amendment executes (its period overlaps the original's, but the supersede target is excluded from the exclusivity check); original -> SUPERSEDED"
            - "new requisition referencing the SUPERSEDED contract: err == ERR_CONTRACT_NOT_EXECUTED at submit"

