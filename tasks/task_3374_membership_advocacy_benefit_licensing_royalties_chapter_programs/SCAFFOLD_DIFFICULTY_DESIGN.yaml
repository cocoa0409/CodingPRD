              as: MemberServicesAgent
              captures: { rh_b: $.data.id, rm_b: $.data.primary_member_id }
            - call: "POST /api/chapters"
              payload: { name: "Denver Metro Chapter", state_code: "CO", city: "Denver" }
              as: MemberServicesAgent
              captures: { rch_id: $.data.id }
            - call: "POST /api/chapters/${rch_id}/course-sessions"
              payload: { course_kind: "DRIVER_SAFETY", instructor_name: "Pat Rowe", start_time: "2027-09-05T09:00:00Z", end_time: "2027-09-05T11:00:00Z", capacity: 10 }
              as: ChapterCoordinator
              as_user_id: "${rch_id}"
              captures: { rses_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/_batch/renewal_run"
              payload: {}
              as: PlatformAdmin
              captures: { rb_renewed: $.data.renewed_count, rb_lapsed: $.data.lapsed_count }
            - call: "POST /api/course-sessions/${rses_id}/enroll"
              payload: { member_id: "${rm_b}" }
              as: Member
              as_user_id: "${rm_b}"
              captures: { rb_enroll_err: $.data.error_id }
          assert:
            - "renewed_count == 1 and lapsed_count == 1"
            - "Household.${rh_a}: original term RENEWED and a new ACTIVE term exists with paid_cents == 1520 (1-year renewal loyalty: 1600*1*0.95), start_date == \"2027-09-01\", end_date == \"2028-09-01\" (link 1)"
            - "Household.${rh_a}.status == ACTIVE while Household.${rh_b}.status == LAPSED (link 2)"
            - "Member.${rm_b}.in_good_standing == false (link 3) and the enrollment attempt is rejected with ERR_MEMBER_NOT_ACTIVE — the cascade's deepest link is observable through a different endpoint"
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: safety_pair_beats_fiscal_balance
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - calculations.fund_transfer_governance
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal: one transfer
          request violates BOTH the governance direction matrix (FOUNDATION ->
          LOBBY_ARM is prohibited) AND the source-balance check (foundation
          balance 100 < amount 1,000,000); the safety error
          ERR_PROHIBITED_ENTITY_PAIR must win over ERR_INSUFFICIENT_ENTITY_BALANCE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FOUNDATION entity with balance_cents 100; LOBBY_ARM entity with balance_cents 5,000,000."
            - "A PENDING_APPROVAL transfer FOUNDATION -> LOBBY_ARM of 1,000,000 cents requested by gov-1."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/legal-entities"
              payload: { kind: "FOUNDATION", display_name: "Charitable Foundation", balance_cents: 100 }
              as: GovernanceOfficer
              captures: { pf_fdn: $.data.id }
            - call: "POST /api/legal-entities"
              payload: { kind: "LOBBY_ARM", display_name: "Advocacy Lobby Arm", balance_cents: 5000000 }
              as: GovernanceOfficer
              captures: { pf_lob: $.data.id }
            - call: "POST /api/fund-transfers"
              payload: { from_entity_id: "${pf_fdn}", to_entity_id: "${pf_lob}", amount_cents: 1000000, purpose: "lobbying grant" }
              as: GovernanceOfficer
              as_user_id: "gov-1"
              captures: { pf_tx: $.data.id }
          trigger:
            - call: "POST /api/fund-transfers/${pf_tx}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fin-7"
              captures: { pf_err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_PROHIBITED_ENTITY_PAIR (safety, priority 10) — NOT ERR_INSUFFICIENT_ENTITY_BALANCE (fiscal, priority 12)"
            - "FundTransfer.${pf_tx}.status remains PENDING_APPROVAL and both entity balances are unchanged (100 and 5,000,000)"

      - name: state_beats_constraint_on_escalate
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - state_machines.Complaint
        distinguishing_aspect: |
          Error-category pair state vs business_constraint: the complaint is
          already RESOLVED (state violation: ESCALATE is not a valid
          transition from RESOLVED) AND its agreement has been TERMINATED
          (constraint violation: escalation requires agreement in
          {ACTIVE, PROBATION}); the state error ERR_COMPLAINT_STATE must win
          over ERR_AGREEMENT_STATE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED; agreement FINANCIAL_SERVICES ACTIVE (window 2026-01-01..2030-12-31); one good-standing member."
            - "Complaint filed, opened, and RESOLVED. Then the agreement is TERMINATED by governance."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Sterling Financial Services" }
              as: GovernanceOfficer
              captures: { xf_id: $.data.id }
            - call: "POST /api/providers/${xf_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { xf_v: $.data.version }
            - call: "POST /api/providers/${xf_id}/license-agreements"
              payload: { product_category: "FINANCIAL_SERVICES", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${xf_v}" }
              as: ProviderManager
              as_user_id: "${xf_id}"
              captures: { xa_id: $.data.id }
            - call: "POST /api/license-agreements/${xa_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
            - call: "POST /api/households"
              payload: { state_code: "GA", term_years: 1, primary_full_name: "Kim Knox", primary_date_of_birth: "1967-09-09" }
              as: MemberServicesAgent
              captures: { xh_id: $.data.id, xm_id: $.data.primary_member_id }
            - call: "POST /api/complaints"
              payload: { member_id: "${xm_id}", license_agreement_id: "${xa_id}", category: "BILLING", severity: "LOW", description: "fee dispute" }
              as: Member
              as_user_id: "${xm_id}"
              captures: { xc_id: $.data.id }
            - call: "POST /api/complaints/${xc_id}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
            - call: "POST /api/complaints/${xc_id}/adjudicate"
              payload: { action: "RESOLVE", resolution_code: "REFUND_ISSUED" }
              as: OversightAnalyst
            - call: "POST /api/license-agreements/${xa_id}/transitions"
              payload: { action: "TERMINATE" }
              as: GovernanceOfficer
          trigger:
            - call: "POST /api/complaints/${xc_id}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
              captures: { xc_err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_COMPLAINT_STATE (state, priority 8) — NOT ERR_AGREEMENT_STATE (constraint, priority 11)"
            - "Complaint.${xc_id}.status remains RESOLVED and escalated_at remains null"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: third_escalation_exactly_triggers_probation
        grounds:
          - calculations.escalation_threshold_eval
          - state_machines.LicenseAgreement.ACTIVE_to_PROBATION
        distinguishing_aspect: |
          Metric = integer escalation count against AGREEMENT_PROBATION_THRESHOLD
          with a >= comparison: after exactly 2 escalations the agreement is
          still ACTIVE; the 3rd (count == 3, not 4) fires the auto-PROBATION.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED; agreement INSURANCE_LIFE ACTIVE (window 2026-01-01..2030-12-31); one good-standing member."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Beacon Life Assurance" }
              as: GovernanceOfficer
              captures: { bp_id: $.data.id }
            - call: "POST /api/providers/${bp_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { bp_v: $.data.version }
            - call: "POST /api/providers/${bp_id}/license-agreements"
              payload: { product_category: "INSURANCE_LIFE", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${bp_v}" }
              as: ProviderManager
              as_user_id: "${bp_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /api/license-agreements/${ba_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
            - call: "POST /api/households"
              payload: { state_code: "MI", term_years: 1, primary_full_name: "Lori Lane", primary_date_of_birth: "1974-04-04" }
              as: MemberServicesAgent
              captures: { bh_id: $.data.id, bm_id: $.data.primary_member_id }
            - call: "POST /api/complaints"
              payload: { member_id: "${bm_id}", license_agreement_id: "${ba_id}", category: "CLAIMS", severity: "HIGH", description: "boundary complaint 1" }
              as: Member
              as_user_id: "${bm_id}"
              captures: { bc1: $.data.id }
            - call: "POST /api/complaints/${bc1}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
            - call: "POST /api/complaints"
              payload: { member_id: "${bm_id}", license_agreement_id: "${ba_id}", category: "CLAIMS", severity: "HIGH", description: "boundary complaint 2" }
              as: Member
              as_user_id: "${bm_id}"
              captures: { bc2: $.data.id }
            - call: "POST /api/complaints/${bc2}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
            - call: "POST /api/complaints"
              payload: { member_id: "${bm_id}", license_agreement_id: "${ba_id}", category: "CLAIMS", severity: "HIGH", description: "boundary complaint 3" }
              as: Member
              as_user_id: "${bm_id}"
              captures: { bc3: $.data.id }
            - call: "POST /api/complaints/${bc3}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
          trigger:
            - call: "POST /api/complaints/${bc1}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
            - call: "GET /api/license-agreements/${ba_id}"
              payload: {}
              as: OversightAnalyst
              captures: { ba_status_1: $.data.status, ba_count_1: $.data.escalations_trailing_12mo }
            - call: "POST /api/complaints/${bc2}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
            - call: "GET /api/license-agreements/${ba_id}"
              payload: {}
              as: OversightAnalyst
              captures: { ba_status_2: $.data.status, ba_count_2: $.data.escalations_trailing_12mo }
            - call: "POST /api/complaints/${bc3}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
            - call: "GET /api/license-agreements/${ba_id}"
              payload: {}
              as: OversightAnalyst
              captures: { ba_status_3: $.data.status, ba_count_3: $.data.escalations_trailing_12mo, ba_prob: $.data.probation_count }
          assert:
            - "after escalation 1: status == ACTIVE and escalations_trailing_12mo == 1 (1 < 3, no transition)"
            - "after escalation 2: status == ACTIVE and escalations_trailing_12mo == 2 (2 < 3, threshold NOT yet crossed)"
            - "after escalation 3: status == PROBATION, escalations_trailing_12mo == 3, probation_count == 1 (the >= comparison fires exactly at 3)"

      - name: enrollment_capacity_boundary
        grounds:
          - entities.CourseSession.fields.capacity
          - endpoints.POST_/api/course-sessions/{id}/enroll
        distinguishing_aspect: |
          Metric = enrolled headcount against capacity (a different metric than
          the escalation count, exercised through a different endpoint): with
          capacity 1 the FIRST enrollment succeeds (enrolled_count becomes
          exactly 1 == capacity) and only the NEXT one fails with
          ERR_SESSION_FULL — the boundary is 'enrolled_count < capacity admits'.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; two good-standing members M1 and M2 in two households."
            - "A chapter hosts a TAX_PREP session 2026-10-10T09:00-11:00Z with capacity exactly 1."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/households"
              payload: { state_code: "OR", term_years: 1, primary_full_name: "Nina Nash", primary_date_of_birth: "1966-10-10" }
              as: MemberServicesAgent
              captures: { eh1: $.data.id, em1: $.data.primary_member_id }
            - call: "POST /api/households"
              payload: { state_code: "OR", term_years: 1, primary_full_name: "Omar Ortiz", primary_date_of_birth: "1973-02-02" }
              as: MemberServicesAgent
              captures: { eh2: $.data.id, em2: $.data.primary_member_id }
            - call: "POST /api/chapters"
              payload: { name: "Portland Chapter", state_code: "OR", city: "Portland" }
              as: MemberServicesAgent
              captures: { ech_id: $.data.id }
            - call: "POST /api/chapters/${ech_id}/course-sessions"
              payload: { course_kind: "TAX_PREP", instructor_name: "Sam Alder", start_time: "2026-10-10T09:00:00Z", end_time: "2026-10-10T11:00:00Z", capacity: 1 }
              as: ChapterCoordinator
              as_user_id: "${ech_id}"
              captures: { eses_id: $.data.id }
          trigger:
            - call: "POST /api/course-sessions/${eses_id}/enroll"
              payload: { member_id: "${em1}" }
              as: Member
              as_user_id: "${em1}"
              captures: { es_count: $.data.enrolled_count }
            - call: "POST /api/course-sessions/${eses_id}/enroll"
              payload: { member_id: "${em2}" }
              as: Member
              as_user_id: "${em2}"
              captures: { es_err: $.data.error_id }
          assert:
            - "the first enrollment succeeds and CourseSession.${eses_id}.enrolled_count == 1 (exactly at capacity is admitted)"
            - "the second enrollment fails: status 409, error_id == ERR_SESSION_FULL"
            - "CourseSession.${eses_id}.enrolled_member_ids == [${em1}] exactly (the rejected enrollment did not append)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: agreement_activation_requires_provider_licensed
        grounds:
          - state_machines.LicenseAgreement.DRAFT_to_ACTIVE
          - validations[priority=9]
          - errors.ERR_PROVIDER_NOT_LICENSED
        distinguishing_aspect: |
          Entity pair Provider -> LicenseAgreement: the agreement's valid
          transitions depend on the PROVIDER's status — creation and activation
          are both rejected while the provider is APPLICANT, and both succeed
          once the provider is LICENSED, with no change to the agreement itself.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider created but NOT admitted (status APPLICANT, version 1)."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Cascade Home Warranty" }
              as: GovernanceOfficer
              captures: { gp_id: $.data.id, gp_v1: $.data.version }
          trigger:
            - call: "POST /api/providers/${gp_id}/license-agreements"
              payload: { product_category: "HOME_SERVICES", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${gp_v1}" }
              as: ProviderManager
              as_user_id: "${gp_id}"
              captures: { gp_err: $.data.error_id }
            - call: "POST /api/providers/${gp_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { gp_v2: $.data.version }
            - call: "POST /api/providers/${gp_id}/license-agreements"
              payload: { product_category: "HOME_SERVICES", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${gp_v2}" }
              as: ProviderManager
              as_user_id: "${gp_id}"
              captures: { ga_id: $.data.id }
          assert:
            - "the creation attempt while APPLICANT fails: status 409, error_id == ERR_PROVIDER_NOT_LICENSED"
            - "after POST admit flips the provider to LICENSED, the identical creation payload succeeds with 201 and LicenseAgreement.${ga_id}.status == DRAFT"
            - "Provider.${gp_id}.version == 3 after admit (2) and agreement creation (3) — the failed first creation did not mutate the provider"

      - name: mobilization_requires_active_campaign_window
        grounds:
          - state_machines.Campaign
          - validations[priority=9]
          - errors.ERR_CAMPAIGN_NOT_ACTIVE
          - calculations.mobilization_audience_count
        distinguishing_aspect: |
          Entity pair Campaign -> MobilizationEvent where the gating state is
          itself CLOCK-DERIVED (computed_status, not a stored field): the same
          mobilization payload is rejected while the campaign is UPCOMING at
          2026-09-01 and accepted once the clock enters [start_date, end_date]
          at 2026-10-01, with the audience snapshot computed at acceptance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; LOBBY_ARM entity exists; campaign window 2026-10-01..2026-12-31, level FEDERAL, sponsored by the LOBBY_ARM."
            - "One household with a good-standing primary member who has not opted out."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/legal-entities"
              payload: { kind: "LOBBY_ARM", display_name: "Advocacy Lobby Arm", balance_cents: 5000000 }
              as: GovernanceOfficer
              captures: { mc_lob: $.data.id }
            - call: "POST /api/campaigns"
              payload: { title: "Protect Retirement Savings", level: "FEDERAL", issue_area: "RETIREMENT", start_date: "2026-10-01", end_date: "2026-12-31", sponsor_entity_id: "${mc_lob}" }
              as: AdvocacyDirector
              captures: { mc_id: $.data.id, mc_status0: $.data.computed_status }
            - call: "POST /api/households"
              payload: { state_code: "NM", term_years: 1, primary_full_name: "Quinn Quill", primary_date_of_birth: "1964-01-01" }
              as: MemberServicesAgent
              captures: { mh_id: $.data.id }
          trigger:
            - call: "POST /api/campaigns/${mc_id}/mobilizations"
              payload: { channel: "EMAIL", audience_spec: { min_age: 50 } }
              as: AdvocacyDirector
              captures: { mc_err: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/campaigns/${mc_id}/mobilizations"
              payload: { channel: "EMAIL", audience_spec: { min_age: 50 } }
              as: AdvocacyDirector
              captures: { mc_evt: $.data.id, mc_aud: $.data.audience_count }
          assert:
            - "at creation the campaign's computed_status == UPCOMING (clock date 2026-09-01 < start_date 2026-10-01)"
            - "the first mobilization fails: status 409, error_id == ERR_CAMPAIGN_NOT_ACTIVE"
            - "after the clock enters the window the identical payload succeeds: 201 with MobilizationEvent.${mc_evt}.audience_count == 1 (the single non-opted-out good-standing member)"
            - "Campaign.${mc_id}.computed_status == ACTIVE when read at 2026-10-01 (window bounds are inclusive)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: chapter_room_buffer_semantics
        grounds:
          - calculations.session_overlap_detection
          - errors.ERR_SESSION_OVERLAP
        distinguishing_aspect: |
          Interval semantics = 30-minute turnover BUFFER on the chapter-room
          resource: a same-chapter session starting 11:20 after an 11:00 end is
          rejected (inside the buffer), while 11:30 exactly is admitted
          (end + 30min <= start is the admission predicate, inclusive).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one chapter with its coordinator."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/chapters"
              payload: { name: "Austin Chapter", state_code: "TX", city: "Austin" }
              as: MemberServicesAgent
              captures: { oc_id: $.data.id }
          trigger:
            - call: "POST /api/chapters/${oc_id}/course-sessions"
              payload: { course_kind: "TAX_PREP", instructor_name: "Robin Sage", start_time: "2026-10-10T09:00:00Z", end_time: "2026-10-10T11:00:00Z", capacity: 20 }
              as: ChapterCoordinator
              as_user_id: "${oc_id}"
              captures: { os1: $.data.id }
            - call: "POST /api/chapters/${oc_id}/course-sessions"
              payload: { course_kind: "DRIVER_SAFETY", instructor_name: "Lee Park", start_time: "2026-10-10T11:20:00Z", end_time: "2026-10-10T12:20:00Z", capacity: 20 }
              as: ChapterCoordinator
              as_user_id: "${oc_id}"
              captures: { os2_err: $.data.error_id }
            - call: "POST /api/chapters/${oc_id}/course-sessions"
              payload: { course_kind: "DRIVER_SAFETY", instructor_name: "Lee Park", start_time: "2026-10-10T11:30:00Z", end_time: "2026-10-10T12:30:00Z", capacity: 20 }
              as: ChapterCoordinator
              as_user_id: "${oc_id}"
              captures: { os3: $.data.id }
          assert:
            - "the 09:00-11:00 session is created (201)"
            - "the 11:20 start is rejected: status 409, error_id == ERR_SESSION_OVERLAP (11:00 + 30min buffer = 11:30 > 11:20)"
            - "the 11:30 start is admitted (201): the buffer boundary is inclusive — end_time + 30min <= start_time passes at equality"
            - "GET /api/chapters/${oc_id}/course-sessions returns exactly 2 rows"

      - name: instructor_half_open_adjacency_semantics
        grounds:
          - calculations.session_overlap_detection
          - errors.ERR_INSTRUCTOR_DOUBLE_BOOKED
        distinguishing_aspect: |
          Interval semantics = plain half-open overlap with NO buffer on the
          instructor resource across ALL chapters: the same instructor starting
          in chapter C2 exactly when their C1 session ends is ADMITTED
          ([09:00,11:00) and [11:00,13:00) do not intersect), while a 10:30
          start in a third chapter is REJECTED — a different geometric
          treatment than the buffered room rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; three chapters C1, C2, C3, each with its own coordinator (X-User-ID == chapter id)."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/chapters"
              payload: { name: "Tulsa North", state_code: "OK", city: "Tulsa" }
              as: MemberServicesAgent
              captures: { ic1: $.data.id }
            - call: "POST /api/chapters"
              payload: { name: "Tulsa South", state_code: "OK", city: "Tulsa" }
              as: MemberServicesAgent
              captures: { ic2: $.data.id }
            - call: "POST /api/chapters"
              payload: { name: "Norman Chapter", state_code: "OK", city: "Norman" }
              as: MemberServicesAgent
              captures: { ic3: $.data.id }
          trigger:
            - call: "POST /api/chapters/${ic1}/course-sessions"
              payload: { course_kind: "DRIVER_SAFETY", instructor_name: "Jordan Vega", start_time: "2026-10-10T09:00:00Z", end_time: "2026-10-10T11:00:00Z", capacity: 15 }
              as: ChapterCoordinator
              as_user_id: "${ic1}"
              captures: { is1: $.data.id }
            - call: "POST /api/chapters/${ic2}/course-sessions"
              payload: { course_kind: "DRIVER_SAFETY", instructor_name: "Jordan Vega", start_time: "2026-10-10T11:00:00Z", end_time: "2026-10-10T13:00:00Z", capacity: 15 }
              as: ChapterCoordinator
              as_user_id: "${ic2}"
              captures: { is2: $.data.id }
            - call: "POST /api/chapters/${ic3}/course-sessions"
              payload: { course_kind: "TAX_PREP", instructor_name: "Jordan Vega", start_time: "2026-10-10T10:30:00Z", end_time: "2026-10-10T12:00:00Z", capacity: 15 }
              as: ChapterCoordinator
              as_user_id: "${ic3}"
              captures: { is3_err: $.data.error_id }
          assert:
            - "the C1 session 09:00-11:00 for instructor 'Jordan Vega' is created (201)"
            - "the C2 session 11:00-13:00 for the same instructor is created (201): half-open adjacency is NOT an instructor conflict even though the two sessions are back-to-back across chapters"
            - "the C3 session 10:30-12:00 for the same instructor fails: status 409, error_id == ERR_INSTRUCTOR_DOUBLE_BOOKED (10:30 < 11:00 intersects [09:00,11:00))"
            - "the C3 rejection is NOT ERR_SESSION_OVERLAP — C3 has no sessions, so only the instructor rule could fire, proving the two rules are evaluated with different interval semantics on different resources"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: fund_transfer_balance_conservation
        grounds:
          - state_machines.FundTransfer.PENDING_APPROVAL_to_EXECUTED
          - entities.FundTransfer.fields.from_balance_after_cents
          - entities.FundTransfer.fields.to_balance_after_cents
        distinguishing_aspect: |
          Conserved quantity = summed cents across the two LegalEntity balances:
          request (forward) paired with approval-execution (the compensating
          bookkeeping) must leave from_balance + to_balance unchanged at
          300,000,000 — a transfer moves cents, it never creates or destroys
          them, and the response exposes both after-balances for audit.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; MEMBERSHIP_ORG balance 100,000,000; FOUNDATION balance 200,000,000 (pair sum 300,000,000)."
            - "Transfer of 10,000,000 FOUNDATION -> MEMBERSHIP_ORG requested by gov-1 (within the 5% per-transfer cap: round_down(0.05*200,000,000) = 10,000,000, exactly at the cap, admitted by the <= comparison)."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/legal-entities"
              payload: { kind: "MEMBERSHIP_ORG", display_name: "Membership Organization", balance_cents: 100000000 }
              as: GovernanceOfficer
              captures: { inv_mo: $.data.id }
            - call: "POST /api/legal-entities"
              payload: { kind: "FOUNDATION", display_name: "Charitable Foundation", balance_cents: 200000000 }
              as: GovernanceOfficer
              captures: { inv_fdn: $.data.id }
            - call: "POST /api/fund-transfers"
              payload: { from_entity_id: "${inv_fdn}", to_entity_id: "${inv_mo}", amount_cents: 10000000, purpose: "annual grant to membership org" }
              as: GovernanceOfficer
              as_user_id: "gov-1"
              captures: { inv_tx: $.data.id }
          trigger:
            - call: "POST /api/fund-transfers/${inv_tx}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fin-7"
              captures: { inv_from_after: $.data.from_balance_after_cents, inv_to_after: $.data.to_balance_after_cents }
          assert:
            - "FundTransfer.${inv_tx}.status == EXECUTED with from_balance_after_cents == 190000000 and to_balance_after_cents == 110000000"
            - "from_balance_after_cents + to_balance_after_cents == 300000000 == the pair's summed balances before execution (190,000,000 + 110,000,000)"
            - "GET /api/legal-entities/${inv_fdn}.balance_cents == 190000000 and GET /api/legal-entities/${inv_mo}.balance_cents == 110000000 (immediately visible)"
            - "LegalEntity versions: both entities' version incremented by exactly 1 (the transfer execution is the only mutation each has seen)"

      - name: royalty_exposure_balance_conservation
        grounds:
          - entities.LicenseAgreement.fields.royalty_exposure_cents
          - entities.Provider.fields.royalty_balance_cents
          - calculations.royalty_marginal_tiers
        distinguishing_aspect: |
          Conserved quantity = the royalty ledger equality
          provider.royalty_balance_cents == recognized_royalty_cents +
          provisional_outstanding_cents: the forward action (statement
          submission, +provisional) and its compensating action (finalize with
          a negative delta, -3,000,000) must keep the two sides equal at
          49,800,000 — a cascade that left drift in either bucket violates the
          invariant.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED; agreement TRAVEL_SERVICES ACTIVE (window 2026-01-01..2030-12-31)."
            - "Q1 statement 80,000,000 (provisional 6,400,000), Q2 statement 60,000,000 (provisional 5,600,000), Q3 statement 400,000,000 (provisional 40,800,000: 360,000,000 @10% + 40,000,000 @12% against YTD-before 140,000,000)."
            - "Balance after the three submissions: 52,800,000; recognized 0; provisional_outstanding 52,800,000 — invariant holds at 52,800,000 == 52,800,000."
          setup_api_calls:
            - *d_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Odyssey Travel Alliance" }
              as: GovernanceOfficer
              captures: { lp_id: $.data.id }
            - call: "POST /api/providers/${lp_id}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { lp_v: $.data.version }
            - call: "POST /api/providers/${lp_id}/license-agreements"
              payload: { product_category: "TRAVEL_SERVICES", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${lp_v}" }
              as: ProviderManager
              as_user_id: "${lp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /api/license-agreements/${la_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
              captures: { la_v2: $.data.version }
            - call: "POST /api/license-agreements/${la_id}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 1, reported_sales_cents: 80000000, expected_agreement_version: "${la_v2}" }
              as: ProviderManager
              as_user_id: "${lp_id}"
              captures: { ls_q1: $.data.id }
            - call: "GET /api/license-agreements/${la_id}"
              payload: {}
              as: FinanceController
              as_user_id: "fin-7"
              captures: { la_v3: $.data.version }
            - call: "POST /api/license-agreements/${la_id}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 2, reported_sales_cents: 60000000, expected_agreement_version: "${la_v3}" }
              as: ProviderManager
              as_user_id: "${lp_id}"
              captures: { ls_q2: $.data.id }
            - call: "GET /api/license-agreements/${la_id}"
              payload: {}
              as: FinanceController
              as_user_id: "fin-7"
              captures: { la_v4: $.data.version }
            - call: "POST /api/license-agreements/${la_id}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 3, reported_sales_cents: 400000000, expected_agreement_version: "${la_v4}" }
              as: ProviderManager
              as_user_id: "${lp_id}"
              captures: { ls_q3: $.data.id, ls_q3_prov: $.data.provisional_royalty_cents }
          trigger:
            - call: "POST /api/royalty-statements/${ls_q2}/finalize"
              payload: { audited_sales_cents: 30000000 }
              as: FinanceController
              as_user_id: "fin-7"
              captures: { ls_q2_delta: $.data.delta_cents }
          assert:
            - "Q3 provisional == 40800000 (tier-2 room 360,000,000 @10% = 36,000,000 then 40,000,000 @12% = 4,800,000; YTD-before uses Q1+Q2 REPORTED figures because Q2 was still provisional when Q3 was submitted — late-binding per statement)"
            - "after finalize: Provider.${lp_id}.royalty_balance_cents == 49800000 (52,800,000 - 3,000,000)"
            - "LicenseAgreement.${la_id}.recognized_royalty_cents == 2600000 and provisional_outstanding_cents == 47200000 (6,400,000 + 40,800,000)"
            - "INVARIANT: recognized + provisional_outstanding == 49800000 == provider.royalty_balance_cents — the forward submission and the compensating negative delta left zero drift"
