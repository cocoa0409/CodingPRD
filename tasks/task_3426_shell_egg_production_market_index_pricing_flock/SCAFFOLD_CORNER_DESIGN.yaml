          - entities.Flock.fields.status
        distinguishing_aspect: "The auto-deplete fires at a week start where age >= 80, zeroes the hens, and leaves age frozen at 80 (the deplete week itself accrues nothing) — reaching the DEPLETED terminal without any operator action."
        test_recipe:
          setup: ["Complex with flock of 60000 hens placed 2026-09-01 at age 18 (placement 2026-04-28); clock advanced 441 days (63 weeks) to 2027-11-16."]
          setup_api_calls:
            - *c_clock0901
