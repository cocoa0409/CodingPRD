# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3233_toy_line_licensing_entertainment_tie_timing_shelf
#
# Nine Difficulty Rules x 2 instances each. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls chain drives empty-DB into
# the stated precondition using only §1.5 endpoints.
#
# Shared setup abbreviations (written out in full per instance):
#   StudioRep      = role StudioRep (opaque)
#   BrandManager   = role BrandManager (opaque)
#   SafetyEngineer = role SafetyEngineer (opaque)
#   RetailerOps    = role RetailerOps (entity_backed:Retailer)
#   PlatformAdmin  = role PlatformAdmin (opaque)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_includes_planned_and_pending_rate
        grounds:
          - calculations.royalty_accrual
          - calculations.royalty_accrual.variants.provisional
          - calculations.royalty_accrual.variants.final
          - entities.LicenseAgreement.fields.royalties_earned_cents
          - endpoints.GET_/toy-licensing/license-agreements/{id}/royalty_projection
          - endpoints.POST_/toy-licensing/license-agreements/{id}/close_quarter
        distinguishing_aspect: |
          The provisional projection counts PLANNED shipments and applies the
          PENDING amended rate, while the final close_quarter counts only SOLD
          shipments at the effective rate — same underlying ledger, two
          different numbers, on the LicenseAgreement domain.
        test_recipe:
          setup:
            - "Clock at 2026-10-01T00:00:00Z."
            - "Studio ST1 (STANDARD), Property P1 revealed 2026-09-01, release 2027-03-01."
            - "LicenseAgreement LA1 for P1: royalty 0.10, advance 0, annual MG 0, ACTIVE."
            - "LICENSED ToyLine L1 under P1/LA1; Sku SK1 under L1; Retailer R1; CONFIRMED OPEN LineReview LR1; AssortmentCommitment C1 on SK1 at 100c/unit."
            - "Shipment SH1 on C1 with 1000 units, status PLANNED."
            - "Amendment pending on LA1 proposing royalty 0.20."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/studios"
              payload: { name: "Studio One", confidentiality_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "Galaxy Racers", category: "FILM", reveal_date: "2026-09-01T00:00:00Z", release_date: "2027-03-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
            - call: "POST /toy-licensing/license-agreements"
              payload: { property_id: "${p1}", territory: "GLOBAL", royalty_rate_pct: 0.10, advance_guarantee_cents: 0, annual_minimum_guarantee_cents: 0, start_date: "2026-01-01T00:00:00Z", end_date: "2028-12-31T00:00:00Z", approval_rights_required: false }
              as: BrandManager
              captures: { la1: $.data.id, la1_v: $.data.version }
            - call: "POST /toy-licensing/license-agreements/${la1}/activate"
              payload: { expected_license_agreement_version: "${la1_v}" }
              as: BrandManager
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Galaxy Racers Vehicles", brand_kind: "LICENSED", property_id: "${p1}", license_agreement_id: "${la1}" }
              as: BrandManager
              captures: { l1: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${l1}", name: "Racer 6in", age_grade_months: 48, packaging_claims: ["BPA_FREE"], moq_units: 100, unit_cost_cents: 200, tooling_cost_cents: 50000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox Stores", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-11-01T00:00:00Z", shelf_slots_total: 50 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { lr1: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr1}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr1}", sku_id: "${sk1}", committed_units: 1000, unit_price_cents: 100, shelf_slots: 4 }
              as: BrandManager
              captures: { c1: $.data.id }
            - call: "POST /toy-licensing/shipments"
              payload: { commitment_id: "${c1}", planned_ship_date: "2027-02-01T00:00:00Z", units: 1000 }
              as: BrandManager
              captures: { sh1: $.data.id }
            - call: "POST /toy-licensing/license-agreements/${la1}/amend"
              payload: { royalty_rate_pct: 0.20, advance_guarantee_cents: 0, end_date: "2028-12-31T00:00:00Z" }
              as: BrandManager
          trigger:
            - call: "GET /toy-licensing/license-agreements/${la1}/royalty_projection"
              payload: {}
              as: BrandManager
              captures: { proj_earned: $.data.projected_earned_cents }
            - call: "POST /toy-licensing/license-agreements/${la1}/close_quarter"
              payload: { quarter_index: 1 }
              as: BrandManager
              captures: { final_earned: $.data.royalties_earned_cents }
          assert:
            - "provisional projected_earned_cents == 20000  # 1000 PLANNED units * 100c * 0.20 pending rate"
            - "final royalties_earned_cents == 0  # no SOLD shipments; effective 0.10 rate irrelevant"
            - "LicenseAgreement.${la1}.status stays AMENDMENT_PENDING (projection did not consume the amendment)"
            - "LicenseAgreement.${la1}.quarters_closed == 1 after close_quarter"

      - name: embargo_penalty_first_vs_repeat_offender
        grounds:
          - calculations.embargo_penalty
          - calculations.embargo_penalty.variants.first_offender
          - calculations.embargo_penalty.variants.repeat_offender
          - entities.Retailer.fields.violation_count
          - endpoints.POST_/toy-licensing/shipments/{id}/record_sale
        distinguishing_aspect: |
          The penalty tier is selected by the retailer's violation_count, not
          the shipment: the same 1000-unit pre-street sale costs 10% of gross
          for a clean retailer and 25% for a retailer at violation_count >= 2.
          Different entity domain from royalty_accrual (Retailer ledger vs
          LicenseAgreement ledger).
        test_recipe:
          setup:
            - "Clock 2026-10-01. Evergreen line EL with street 2027-01-01, Sku ESK, Retailer R_CLEAN and R_DIRTY."
            - "R_DIRTY already has violation_count == 2 (two prior embargo breaches assessed and left OPEN)."
            - "Each retailer: CONFIRMED OPEN review, commitment at 100c, shipment of 1000 units, street_date 2027-01-01."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Block Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 100, unit_cost_cents: 150, tooling_cost_cents: 10000 }
              as: BrandManager
              captures: { esk: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "CleanMart", region: "NA" }
              as: PlatformAdmin
              captures: { r_clean: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "DirtyDiscounter", region: "NA" }
              as: PlatformAdmin
              captures: { r_dirty: $.data.id }
            # R_DIRTY: two prior breaches on two shipments -> violation_count 2
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r_dirty}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-11-01T00:00:00Z", shelf_slots_total: 50 }
              as: RetailerOps
              as_user_id: "${r_dirty}"
              captures: { lr_d: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr_d}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr_d}", sku_id: "${esk}", committed_units: 3000, unit_price_cents: 100, shelf_slots: 6 }
              as: BrandManager
              captures: { c_d: $.data.id }
            - call: "POST /toy-licensing/shipments"
              payload: { commitment_id: "${c_d}", planned_ship_date: "2026-12-01T00:00:00Z", units: 1000 }
              as: BrandManager
              captures: { sh_d1: $.data.id }
            - call: "POST /toy-licensing/shipments"
              payload: { commitment_id: "${c_d}", planned_ship_date: "2026-12-01T00:00:00Z", units: 1000 }
              as: BrandManager
              captures: { sh_d2: $.data.id }
            - call: "POST /toy-licensing/shipments"
              payload: { commitment_id: "${c_d}", planned_ship_date: "2026-12-01T00:00:00Z", units: 1000 }
              as: BrandManager
              captures: { sh_d3: $.data.id }
            - call: "POST /toy-licensing/shipments/${sh_d1}/record_sale"
              payload: { units_sold: 10 }
              as: RetailerOps
              as_user_id: "${r_dirty}"
            - call: "POST /toy-licensing/shipments/${sh_d2}/record_sale"
              payload: { units_sold: 10 }
              as: RetailerOps
              as_user_id: "${r_dirty}"
            # Clean retailer setup
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r_clean}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-11-01T00:00:00Z", shelf_slots_total: 50 }
              as: RetailerOps
              as_user_id: "${r_clean}"
              captures: { lr_c: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr_c}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr_c}", sku_id: "${esk}", committed_units: 1000, unit_price_cents: 100, shelf_slots: 4 }
              as: BrandManager
              captures: { c_c: $.data.id }
            - call: "POST /toy-licensing/shipments"
              payload: { commitment_id: "${c_c}", planned_ship_date: "2026-12-01T00:00:00Z", units: 1000 }
              as: BrandManager
              captures: { sh_c: $.data.id }
          trigger:
            - call: "POST /toy-licensing/shipments/${sh_d3}/record_sale"
              payload: { units_sold: 1000 }
              as: RetailerOps
              as_user_id: "${r_dirty}"
              captures: { pen_d: $.data.penalty_cents }
            - call: "POST /toy-licensing/shipments/${sh_c}/record_sale"
              payload: { units_sold: 1000 }
              as: RetailerOps
              as_user_id: "${r_clean}"
              captures: { pen_c: $.data.penalty_cents }
          assert:
            - "Shipment.${sh_d3}.penalty_cents == 25000  # 1000*100c*0.25 repeat tier"
            - "Shipment.${sh_c}.penalty_cents == 10000   # 1000*100c*0.10 first tier"
            - "Retailer.${r_dirty}.violation_count == 3 and Retailer.${r_clean}.violation_count == 1"
            - "Retailer.${r_dirty}.credit_balance_cents == -(penalties of sh_d1 + sh_d2 + 25000)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tooling_allocation_moq_rounding_and_utilization_tier
        grounds:
          - calculations.factory_capacity_allocation
          - entities.ToolingOrder.fields.allocated_units
          - entities.ToolingOrder.fields.tooling_charge_cents
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs (units, moq, unit_cost,
          tooling_cost, month_load, capacity) and non-linear interaction —
          ceil-to-MOQ first, then capacity gate, then a utilization tier at the
          exact 0.80 boundary deciding the 15% overtime multiplier.
        test_recipe:
          setup:
            - "Factory F1 capacity 1000/month, tooling_lead 8."
            - "Evergreen line EL, Sku SK1 moq 300, unit_cost 100c, tooling_cost 10000c."
            - "Existing APPROVED tooling order in 2027-01 with allocated_units 500 (month_load 500)."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/factories"
              payload: { name: "Shenzhen Plastics", capacity_units_per_month: 1000, tooling_lead_weeks: 8 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-06-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Block Bucket", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 300, unit_cost_cents: 100, tooling_cost_cents: 10000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 500 }
              as: BrandManager
              captures: { to1: $.data.id }
          trigger:
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2027-01", units: 250 }
              as: BrandManager
              captures: { to2: $.data.id, to2_alloc: $.data.allocated_units, to2_charge: $.data.tooling_charge_cents }
          assert:
            - "ToolingOrder.${to1}.allocated_units == 600  # ceil(500/300)*300"
            - "ToolingOrder.${to2}.allocated_units == 300  # ceil(250/300)*300"
            - "ToolingOrder.${to2}.tooling_charge_cents == 44500  # 10000 + round(300*100*1.15); utilization (600+300)/1000 = 0.90 > 0.80"
      - name: markdown_recovery_damped_deep_discount_pinned_rounding_order
        grounds:
          - calculations.markdown_recovery
          - entities.ToyLine.fields.closeout_recovery_cents
          - endpoints.POST_/toy-licensing/toy-lines/{id}/enter_closeout
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — average unit price is
          rounded first, then multiplied by units and the damped effective pct
          and rounded again; computing it the other way (sum-then-round once)
          yields different cents. Different mode from the tooling formula.
        test_recipe:
          setup:
            - "Evergreen line EL (street already past), Sku SK1."
            - "Retailer R1 CONFIRMED review; two COMMITTED commitments on SK1: 3 units @ 333c, 3 units @ 335c."
            - "Line advanced to ON_SHELF."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Nostalgia Minis", brand_kind: "EVERGREEN", target_street_date_input: "2026-09-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id, el_v0: $.data.version }
            - call: "POST /toy-licensing/skus"
              payload: { toy_line_id: "${el}", name: "Mini Fig", age_grade_months: 36, packaging_claims: ["BPA_FREE"], moq_units: 1, unit_cost_cents: 100, tooling_cost_cents: 1000 }
              as: BrandManager
              captures: { sk1: $.data.id }
            - call: "POST /toy-licensing/retailers"
              payload: { name: "ToyBox", region: "NA" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /toy-licensing/line-reviews"
              payload: { retailer_id: "${r1}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-15T00:00:00Z", commitment_deadline: "2026-11-01T00:00:00Z", shelf_slots_total: 20 }
              as: RetailerOps
              as_user_id: "${r1}"
              captures: { lr1: $.data.id }
            - call: "POST /toy-licensing/line-reviews/${lr1}/approve"
              payload: {}
              as: BrandManager
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr1}", sku_id: "${sk1}", committed_units: 3, unit_price_cents: 333, shelf_slots: 2 }
              as: BrandManager
            - call: "POST /toy-licensing/assortment-commitments"
              payload: { line_review_id: "${lr1}", sku_id: "${sk1}", committed_units: 3, unit_price_cents: 335, shelf_slots: 2 }
              as: BrandManager
            - call: "POST /toy-licensing/toy-lines/${el}/advance"
              payload: { expected_toy_line_version: "${el_v0}" }
              as: BrandManager
              captures: { el_v1: $.data.version }
            - call: "POST /toy-licensing/safety-tests"
              payload: { sku_id: "${sk1}", test_type: "MECHANICAL", lab_name: "LabA", claimed_age_grade_months: 36 }
              as: SafetyEngineer
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/safety-tests/${st1}/record_result"
              payload: { outcome: "PASS", result_age_grade_months: 36, validated_claims: ["BPA_FREE"] }
              as: SafetyEngineer
            - call: "POST /toy-licensing/factories"
              payload: { name: "F1", capacity_units_per_month: 100000, tooling_lead_weeks: 4 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /toy-licensing/tooling-orders"
              payload: { toy_line_id: "${el}", sku_id: "${sk1}", factory_id: "${f1}", production_month: "2026-11", units: 100 }
              as: BrandManager
            - call: "POST /toy-licensing/toy-lines/${el}/advance"
              payload: { expected_toy_line_version: "${el_v1}" }
              as: BrandManager
              captures: { el_v2: $.data.version }
            - call: "POST /toy-licensing/toy-lines/${el}/advance"
              payload: { expected_toy_line_version: "${el_v2}" }
              as: BrandManager
          trigger:
            - call: "POST /toy-licensing/toy-lines/${el}/enter_closeout"
              payload: { markdown_pct: 0.70 }
              as: BrandManager
              captures: { recovery: $.data.closeout_recovery_cents }
          assert:
            - "ToyLine.${el}.closeout_recovery_cents == 1202  # avg = round_half_up((3*333+3*335)/6) = 334; eff = 0.50+(0.70-0.50)/2 = 0.60; round_half_up(6*334*0.60) = 1202"
            - "ToyLine.${el}.closeout_markdown_pct == 0.70  # stored as supplied, not damped"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: license_agreement_amendment_cycle
        grounds:
          - state_machines.LicenseAgreement
          - entities.LicenseAgreement.fields.pending_royalty_rate_pct
        distinguishing_aspect: |
          Cyclic machine on LicenseAgreement: ACTIVE -> AMENDMENT_PENDING ->
          ACTIVE can loop repeatedly, with divergent side-effect sets per
          return path (approve applies pending terms, reject discards them).
        test_recipe:
          setup:
            - "Studio + revealed property + agreement ACTIVE at royalty 0.10, advance 10000, end 2028-12-31, approval_rights_required true."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/studios"
              payload: { name: "Studio One" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "POST /toy-licensing/properties"
              payload: { studio_id: "${st1}", title: "Galaxy Racers", category: "FILM", reveal_date: "2026-09-01T00:00:00Z", release_date: "2027-03-01T00:00:00Z" }
              as: StudioRep
              captures: { p1: $.data.id }
            - call: "POST /toy-licensing/license-agreements"
              payload: { property_id: "${p1}", territory: "GLOBAL", royalty_rate_pct: 0.10, advance_guarantee_cents: 10000, annual_minimum_guarantee_cents: 0, start_date: "2026-01-01T00:00:00Z", end_date: "2028-12-31T00:00:00Z", approval_rights_required: true }
              as: BrandManager
              captures: { la1: $.data.id, la1_v: $.data.version }
            - call: "POST /toy-licensing/license-agreements/${la1}/activate"
              payload: { expected_license_agreement_version: "${la1_v}" }
              as: StudioRep
          trigger:
            - call: "POST /toy-licensing/license-agreements/${la1}/amend"
              payload: { royalty_rate_pct: 0.15, advance_guarantee_cents: 20000, end_date: "2029-12-31T00:00:00Z" }
              as: BrandManager
            - call: "POST /toy-licensing/license-agreements/${la1}/amendments/reject"
              payload: {}
              as: StudioRep
              captures: { la_rej_rate: $.data.royalty_rate_pct }
            - call: "POST /toy-licensing/license-agreements/${la1}/amend"
              payload: { royalty_rate_pct: 0.15, advance_guarantee_cents: 20000, end_date: "2029-12-31T00:00:00Z" }
              as: BrandManager
            - call: "POST /toy-licensing/license-agreements/${la1}/amendments/approve"
              payload: {}
              as: StudioRep
              captures: { la_app_rate: $.data.royalty_rate_pct, la_app_adv: $.data.advance_guarantee_cents, la_app_end: $.data.end_date }
          assert:
            - "After reject: LicenseAgreement.${la1}.status == ACTIVE and royalty_rate_pct == 0.10 and advance_guarantee_cents == 10000 and pending_royalty_rate_pct is null"
            - "After approve: LicenseAgreement.${la1}.status == ACTIVE and royalty_rate_pct == 0.15 and advance_guarantee_cents == 20000 and end_date == 2029-12-31"
      - name: toy_line_closeout_reopen_cycle_with_safety_regression
        grounds:
          - state_machines.ToyLine
          - state_machines.SafetyTest
          - endpoints.POST_/toy-licensing/toy-lines/{id}/exit_closeout
        distinguishing_aspect: |
          Cyclic machine on a different entity: ToyLine COMMITTED -> CLOSEOUT
          -> COMMITTED loops, while the safety-invalidation cascade can force
          TOOLED -> IN_DEVELOPMENT from outside the line's own endpoints —
          non-linear shape driven by a different entity's mutation.
        test_recipe:
          setup:
            - "Evergreen line EL with PASSED sku SK1, one APPROVED tooling order, one COMMITTED commitment; line advanced to COMMITTED."
          setup_api_calls:
            - call: "POST /toy-licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-licensing/toy-lines"
              payload: { name: "Evergreen Blocks", brand_kind: "EVERGREEN", target_street_date_input: "2027-01-01T00:00:00Z" }
              as: BrandManager
              captures: { el: $.data.id, el_v0: $.data.version }
            - call: "POST /toy-licensing/toy-lines/${el}/advance"
              payload: { expected_toy_line_version: "${el_v0}" }
              as: BrandManager
