            - call: "POST /bid-packages/${bid_id}/submit"
              payload: { response_due_at: "2026-09-01T00:00:00Z" }
              as: SalesManager
              captures: { status_final: $.data.status, submitted_at: $.data.submitted_at, due: $.data.response_due_at }
          assert:
            - "${coverage_mid} == 400 and ${coverage_1} == 90.00 with ${spread_1} == 15"
            - "${err_cutoff} == ERR_CUTOFF_MISALIGNED (HTTP 422) - coverage is satisfied, only the spread fails"
            - "${coverage_2} == 90.00, ${spread_2} == 1, ${cutoff_2} == 31"
            - "${status_final} == SUBMITTED with ${submitted_at} == 2026-08-01T00:00:00Z and ${due} == 2026-09-01T00:00:00Z"
            - "GET /opportunities/${opp_id} now shows sales_stage BIDDING - the satisfied gate lets the whole cascade through"

      - name: planner_response_after_the_due_date_returns_challenge_window_closed
        claim_type: temporal_validation
        grounds:
          - validations[priority 20 ERR_CHALLENGE_WINDOW_CLOSED]
          - state_machines[BidPackage SUBMITTED -> ACCEPTED]
        distinguishing_aspect: "The response deadline is exclusive on the far side: answering at exactly response_due_at 2027-04-01T00:00:00Z is accepted, but one day later the same ACCEPTED response is 422 ERR_CHALLENGE_WINDOW_CLOSED and the opportunity stays BIDDING with its hold still merely HELD."
        test_recipe:
          setup:
            - "CANONICAL DEFINITE CHAIN up to and including POST /bid-packages/${bid_id}/submit with response_due_at 2027-04-01T00:00:00Z, and NOT including the planner response; opportunity BIDDING, hold ${hold_a_id} HELD FIRST"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-02T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bid-packages/${bid_id}/planner-response"
              payload: { response: "ACCEPTED" }
              as: MeetingPlanner
              as_user_id: ${planner_id}
              captures: { err: $.data.error_id }
            - call: "GET /bid-packages/${bid_id}"
              payload: {}
              as: SalesManager
              captures: { bid_status: $.data.status, response: $.data.planner_response }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { stage: $.data.sales_stage, posture: $.data.hold_posture }
            - call: "GET /space-holds/${hold_a_id}"
              payload: {}
              as: CenterScheduler
              captures: { hold_status: $.data.status }
          assert:
            - "HTTP 422 and ${err} == ERR_CHALLENGE_WINDOW_CLOSED"
            - "${bid_status} == SUBMITTED and ${response} == null - the late answer is not recorded"
            - "${stage} == BIDDING, ${posture} == TENTATIVE, ${hold_status} == HELD - no part of the acceptance cascade fired"
            - "rewinding the clock to exactly 2027-04-01T00:00:00Z and repeating the call succeeds, proving the comparison is clock <= response_due_at"

      - name: confirmed_hold_and_undersized_hall_block_new_holds_with_distinct_errors
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 21 ERR_HALL_WINDOW_CONFLICT]
          - validations[priority 25 ERR_HALL_CAPACITY_INSUFFICIENT]
          - calculations.hall_occupation_conflict
        distinguishing_aspect: "A CONFIRMED hold is an absolute blocker rather than a rankable one: a rival's overlapping request on Grand Hall A returns 409 ERR_HALL_WINDOW_CONFLICT instead of becoming a SECOND hold, while a window that clears the 48h buffer is admitted as FIRST. On the small Ballroom C the same rival is refused earlier still, with 422 ERR_HALL_CAPACITY_INSUFFICIENT."
        test_recipe:
          setup:
            - "CANONICAL DEFINITE CHAIN, so ${hold_a_id} is CONFIRMED on ${hall_id} for move_in 2028-04-08T00:00:00Z -> move_out 2028-04-13T00:00:00Z; plus a small hall Ballroom C (40000 sqft, 3000 persons, 24h turnaround) and a QUALIFIED rival opportunity with attendance_estimate 6000 and exhibit_sqft_requested 150000"
          setup_api_calls:
            - call: "POST /center-halls"
              payload: { name: "Ballroom C", exhibit_sqft: 40000, capacity_persons: 3000, turnaround_hours: 24 }
              as: CenterScheduler
              captures: { small_hall_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Rival Congress 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 700, total_room_nights_requested: 1200, attendance_estimate: 6000, exhibit_sqft_requested: 150000, rate_ceiling_amount: 209.00 }
              as: SalesManager
              captures: { rival_opp_id: $.data.id }
            - call: "POST /opportunities/${rival_opp_id}/qualify"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /space-holds"
              payload: { opportunity_id: "${rival_opp_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-11T00:00:00Z", move_out_end: "2028-04-16T00:00:00Z" }
              as: CenterScheduler
              captures: { err_conflict: $.data.error_id }
            - call: "POST /space-holds"
              payload: { opportunity_id: "${rival_opp_id}", center_hall_id: "${small_hall_id}", move_in_start: "2028-04-09T00:00:00Z", move_out_end: "2028-04-13T00:00:00Z" }
              as: CenterScheduler
              captures: { err_capacity: $.data.error_id }
            - call: "POST /space-holds"
              payload: { opportunity_id: "${rival_opp_id}", center_hall_id: "${hall_id}", move_in_start: "2028-04-15T00:00:00Z", move_out_end: "2028-04-18T00:00:00Z" }
              as: CenterScheduler
              captures: { ok_rank: $.data.hold_rank, ok_status: $.data.status }
          assert:
            - "first call: HTTP 409 and ${err_conflict} == ERR_HALL_WINDOW_CONFLICT - not ERR_HALL_HOLD_LIMIT_REACHED, because the blocker is CONFIRMED rather than HELD"
            - "second call: HTTP 422 and ${err_capacity} == ERR_HALL_CAPACITY_INSUFFICIENT - 6000 persons and 150000 sqft both exceed Ballroom C"
            - "third call: HTTP 201 with ${ok_rank} == FIRST and ${ok_status} == HELD - 2028-04-13 move-out plus 48h turnaround clears a 2028-04-15 move-in"
            - "CenterHall.${hall_id}.confirmed_hold_count == 1 throughout"

      - name: fund_residual_ladder_runs_insufficient_then_exact_zero_then_exhausted
        claim_type: cascading_validation
        grounds:
          - validations[priority 34 ERR_FUND_EXHAUSTED]
          - validations[priority 36 ERR_FUND_INSUFFICIENT]
          - calculations.fund_charge_composition
        distinguishing_aspect: "The residual test is applied to the fee-inclusive charge, so an approval of 9600.00 against a 10000.00 fund fails on the 480.00 fee (total 10080.00) while 9523.81 lands on exactly 10000.00 and is admitted, driving posture to EXHAUSTED. A later decision on a second bid then returns the priority-34 ERR_FUND_EXHAUSTED rather than the priority-35 cap error, even though the fund clamp has driven the cap to 0.00 as well."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; TIER_C planner; fund FY2028 budget 10000.00 (posture OPEN)"
            - "opportunity X: arrival 2028-04-10, departure 2028-04-16 (event_nights 6), peak_rooms_requested 500, total_room_nights_requested 3000, rate_ceiling_amount 219.00, attendance_estimate 8000, exhibit_sqft_requested 200000, fully covered by Harborview Grand (600 committable, 500 committed at 214.33 / cutoff 30, coverage 100.00); PROVISIONAL yield 98550.00, so incentive_cap_amount is min(36000.00, 14782.50) * 1.00 == 14782.50"
            - "bid ${bid_x_id} prepared and requested by sales-11 at INCENTIVE_PENDING; opportunity Y is a second QUALIFIED lead whose bid ${bid_y_id} is also INCENTIVE_PENDING"
          setup_api_calls:
            - call: "GET /bid-packages/${bid_x_id}"
              payload: {}
              as: IncentiveApprover
              captures: { cap_x: $.data.incentive_cap_amount }
          trigger:
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { fund_v_a: $.data.version, uncommitted_a: $.data.uncommitted_amount }
            - call: "POST /bid-packages/${bid_x_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 9600.00, rationale: "Too rich once the admin fee is added", expected_fund_version: "${fund_v_a}" }
              as: IncentiveApprover
              as_user_id: approver-01
              captures: { err_insufficient: $.data.error_id }
            - call: "POST /bid-packages/${bid_x_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 9523.81, rationale: "Charges the fund to exactly zero", expected_fund_version: "${fund_v_a}" }
              as: IncentiveApprover
              as_user_id: approver-01
              captures: { fee_ok: $.data.admin_fee_amount, charge_ok: $.data.total_charge_amount, payback_ok: $.data.tax_payback_ratio }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { fund_v_b: $.data.version, committed_b: $.data.committed_amount, uncommitted_b: $.data.uncommitted_amount, posture_b: $.data.posture }
            - call: "POST /bid-packages/${bid_y_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 100.00, rationale: "Nothing left to give", expected_fund_version: "${fund_v_b}" }
              as: IncentiveApprover
              as_user_id: approver-01
              captures: { err_exhausted: $.data.error_id }
          assert:
            - "${cap_x} == 14782.50 and ${uncommitted_a} == 10000.00 - the 9600.00 request is under the cap, so only the residual can reject it"
            - "${err_insufficient} == ERR_FUND_INSUFFICIENT (HTTP 422) - 9600.00 + 480.00 == 10080.00 exceeds 10000.00"
            - "${fee_ok} == 476.19 (9523.81 * 0.05 == 476.1905 rounded half up) and ${charge_ok} == 10000.00, ${payback_ok} == 9.86"
            - "${committed_b} == 10000.00, ${uncommitted_b} == 0.00 and ${posture_b} == EXHAUSTED"
            - "${err_exhausted} == ERR_FUND_EXHAUSTED (HTTP 409), not ERR_INCENTIVE_EXCEEDS_CAP - priority 34 precedes priority 35"
            - "GET /incentive-funds/${fund_id}/incentive-decisions returns total_count == 1 - the two rejected calls stored no decision row"

      - name: tax_payback_floor_rejects_an_incentive_that_sits_at_its_own_cap
        claim_type: violation_to_error
        grounds:
          - validations[priority 37 ERR_TAX_PAYBACK_BELOW_FLOOR]
          - calculations.fund_charge_composition
          - global_constants.MIN_TAX_PAYBACK_RATIO
        distinguishing_aspect: "For a TIER_A planner the cap alone does not guarantee a payback: approving the full 116000.00 cap costs 120640.00 once the 4% fee applies, giving 2.98 - below the 3.00 floor - so the decision is refused even though it violates neither the cap nor the fund residual. Approving 110000.00 costs 114400.00 and clears the floor at 3.15."
        test_recipe:
          setup:
            - "the fixture of calculations / fee_band_ceiling_is_exclusive_so_one_extra_cent_of_gross_costs_less: TIER_A planner (score 60), fund FY2028 budget 500000.00, opportunity Z with total_room_nights_requested 12000 at rate_ceiling_amount 200.00 (PROVISIONAL lodging_tax_yield_amount 360000.00), coverage 100.00, incentive_cap_amount 116000.00"
            - "bid ${bid_z_id} is INCENTIVE_PENDING, prepared and requested by sales-11"
          setup_api_calls:
            - call: "GET /bid-packages/${bid_z_id}"
              payload: {}
              as: IncentiveApprover
              captures: { cap_z: $.data.incentive_cap_amount }
          trigger:
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { fund_v: $.data.version }
            - call: "POST /bid-packages/${bid_z_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 116000.00, rationale: "Exactly at the cap but the payback fails", expected_fund_version: "${fund_v}" }
              as: IncentiveApprover
              as_user_id: approver-01
              captures: { err_payback: $.data.error_id }
            - call: "POST /bid-packages/${bid_z_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "REDUCED", approved_amount: 110000.00, rationale: "Reduced so the lodging tax still pays back three times", expected_fund_version: "${fund_v}" }
              as: IncentiveApprover
              as_user_id: approver-01
              captures: { decision: $.data.decision, fee: $.data.admin_fee_amount, charge: $.data.total_charge_amount, payback: $.data.tax_payback_ratio, requested: $.data.requested_amount }
            - call: "GET /bid-packages/${bid_z_id}"
              payload: {}
              as: SalesManager
              captures: { bid_status: $.data.status, approved_on_bid: $.data.approved_incentive_amount, payback_on_bid: $.data.tax_payback_ratio }
          assert:
            - "${cap_z} == 116000.00"
            - "${err_payback} == ERR_TAX_PAYBACK_BELOW_FLOOR (HTTP 422) - 360000.00 / 120640.00 == 2.98"
            - "${decision} == REDUCED with ${fee} == 4400.00, ${charge} == 114400.00 and ${payback} == 3.15"
            - "${requested} == 116000.00 - the decision row remembers what was asked as well as what was granted"
            - "${bid_status} == APPROVED, ${approved_on_bid} == 110000.00 and ${payback_on_bid} == 3.15 - REDUCED advances the bid exactly like APPROVED"

      - name: approving_one_cent_over_the_cap_returns_incentive_exceeds_cap
        claim_type: violation_to_error
        grounds:
          - validations[priority 35 ERR_INCENTIVE_EXCEEDS_CAP]
          - calculations.incentive_cap
        distinguishing_aspect: "The cap comparison is <=: for a TIER_C planner with coverage 100.00 the cap is the yield ceiling 8869.50, so 8869.51 is 422 ERR_INCENTIVE_EXCEEDS_CAP while 8869.50 is approved with a 443.48 fee and a 9312.98 charge."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; TIER_C planner; fund FY2028 budget 500000.00; opportunity with total_room_nights_requested 1800 at rate_ceiling_amount 219.00 (PROVISIONAL lodging_spend 394200.00, yield 59130.00), Harborview committing 500 of 500 requested peak rooms so coverage is 100.00"
            - "band_cap is 1800 * 12.00 == 21600.00 and yield_cap is 59130.00 * 0.15 == 8869.50, so incentive_cap_amount == 8869.50; bid ${bid_id} is INCENTIVE_PENDING prepared and requested by sales-11"
          setup_api_calls:
            - call: "GET /bid-packages/${bid_id}"
              payload: {}
              as: IncentiveApprover
              captures: { cap: $.data.incentive_cap_amount, requested_amt: $.data.incentive_request_amount }
          trigger:
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { fund_v: $.data.version }
            - call: "POST /bid-packages/${bid_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 8869.51, rationale: "One cent above the recomputed cap", expected_fund_version: "${fund_v}" }
              as: IncentiveApprover
              as_user_id: approver-01
              captures: { err_cap: $.data.error_id }
            - call: "POST /bid-packages/${bid_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 8869.50, rationale: "Exactly at the recomputed cap", expected_fund_version: "${fund_v}" }
              as: IncentiveApprover
              as_user_id: approver-01
              captures: { fee: $.data.admin_fee_amount, charge: $.data.total_charge_amount, payback: $.data.tax_payback_ratio }
          assert:
            - "${cap} == 8869.50 and ${requested_amt} == 8869.51"
            - "${err_cap} == ERR_INCENTIVE_EXCEEDS_CAP (HTTP 422)"
            - "${fee} == 443.48 (8869.50 * 0.05 == 443.475 rounded half up) and ${charge} == 9312.98, ${payback} == 6.35"
            - "IncentiveFund.${fund_id}.committed_amount == 9312.98 and posture stays OPEN"

      - name: a_second_live_bid_package_returns_bid_round_limit_reached
