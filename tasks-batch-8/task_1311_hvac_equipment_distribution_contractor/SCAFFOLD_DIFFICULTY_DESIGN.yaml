scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc: two calculations, different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: coop_accrual_provisional_vs_final_divergence
        grounds:
          - calculations.coop_accrual_calculation
          - entities.Contractor.fields.coop_accrual_provisional_cents
          - entities.Contractor.fields.coop_accrual_final_cents
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Order.SHIPPED_to_DELIVERED
        distinguishing_aspect: |
          Same line data, two variants on the Contractor entity domain: the
          provisional variant counts SUBMITTED orders (300000 cents on a
          10,000,000-cent DELIVERED order plus a 5,000,000-cent SUBMITTED
          order), the final variant counts DELIVERED only (200000 cents) —
          a 100000-cent divergence for identical line data.
        test_recipe:
          setup:
            - "Contractor C1 with a 10,000,000-cent DELIVERED order (order A) and a 5,000,000-cent SUBMITTED order (order B, still DRAFT until submitted)"
            - "equipment model M1 ACTIVE, list price 10,000,000 cents, family FAM-X with NO allocation pool (line unrestricted)"
            - "logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Alpha Air", license_number: "LIC-001" }
              as: DistributorAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-3T", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-X", list_price_cents: 10000000 }
              as: DistributorAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-5T", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 60000, family_code: "FAM-X", list_price_cents: 5000000 }
              as: DistributorAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c1_id}" }
              as: ContractorUser
              as_user_id: "${c1_id}"
              captures: { oA_id: $.data.id }
            - call: "POST /api/v1/orders/${oA_id}/lines"
              payload: { equipment_model_id: "${m1_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c1_id}"
            - call: "POST /api/v1/orders/${oA_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c1_id}"
            - call: "POST /api/v1/orders/${oA_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${oA_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c1_id}" }
              as: ContractorUser
              as_user_id: "${c1_id}"
              captures: { oB_id: $.data.id }
            - call: "POST /api/v1/orders/${oB_id}/lines"
              payload: { equipment_model_id: "${m2_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c1_id}"
            - call: "POST /api/v1/orders/${oB_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c1_id}"
          trigger:
            - call: "GET /api/v1/contractors/${c1_id}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "Contractor.${c1_id}.coop_accrual_provisional_cents == 300000"
            - "Contractor.${c1_id}.coop_accrual_final_cents == 200000"
            - "Contractor.${c1_id}.ytd_purchase_cents == 10000000"

      - name: unit_price_list_basis_vs_prebuy_basis_divergence
        grounds:
          - calculations.dealer_tier_calculation
          - calculations.prebuy_discount_calculation
          - entities.OrderLine.fields.unit_price_cents
        distinguishing_aspect: |
          Same equipment model and same contractor, two price-basis variants on
          the OrderLine entity domain: a non-prebuy order priced on the
          GOLD-tier basis yields unit_price_cents 950000 (5% tier discount),
          while a pre-buy order yields unit_price_cents 1000000 (list price;
          tier discount suppressed, discount applied later per-line at
          prebuy_discount_calculation).
        test_recipe:
          setup:
            - "Contractor C2 whose ytd_purchase_cents is exactly 20,000,000 (tier GOLD) from one delivered 20,000,000-cent order"
            - "Equipment model M3 list_price_cents 1,000,000, family FAM-Y, no pool"
            - "PreBuyProgram P1 for FAM-Y: window [2026-08-01, 2026-09-01), ship_by 2026-09-15, deposit_pct 0.25, discount_pct 0.10"
            - "logical clock 2026-08-05T00:00:00Z (inside window)"
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Beta Mechanical", license_number: "LIC-002" }
              as: DistributorAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "HP-20M", equipment_type: "HEAT_PUMP", refrigerant_type: "R454B", capacity_btuh: 24000, family_code: "FAM-Y", list_price_cents: 20000000 }
              as: DistributorAdmin
              captures: { m_seed_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "HP-1M", equipment_type: "HEAT_PUMP", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-Y", list_price_cents: 1000000 }
              as: DistributorAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c2_id}" }
              as: ContractorUser
              as_user_id: "${c2_id}"
              captures: { o_seed_id: $.data.id }
            - call: "POST /api/v1/orders/${o_seed_id}/lines"
              payload: { equipment_model_id: "${m_seed_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c2_id}"
            - call: "POST /api/v1/orders/${o_seed_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c2_id}"
            - call: "POST /api/v1/orders/${o_seed_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o_seed_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/prebuy-programs"
              payload: { name: "FALL-PREBUY", family_code: "FAM-Y", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", ship_by_date: "2026-09-15T00:00:00Z", deposit_pct: 0.25, discount_pct: 0.10 }
              as: DistributorAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c2_id}" }
              as: ContractorUser
              as_user_id: "${c2_id}"
              captures: { o_list_id: $.data.id }
            - call: "POST /api/v1/orders/${o_list_id}/lines"
              payload: { equipment_model_id: "${m3_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c2_id}"
              captures: { line_list_id: $.data.id }
            - call: "POST /api/v1/orders/${o_list_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c2_id}"
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c2_id}", prebuy_program_id: "${p1_id}" }
              as: ContractorUser
              as_user_id: "${c2_id}"
              captures: { o_pre_id: $.data.id }
            - call: "POST /api/v1/orders/${o_pre_id}/lines"
              payload: { equipment_model_id: "${m3_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c2_id}"
              captures: { line_pre_id: $.data.id }
            - call: "POST /api/v1/orders/${o_pre_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c2_id}"
          trigger:
            - call: "GET /api/v1/orders/${o_list_id}/lines"
              payload: {}
              as: DistributorAdmin
            - call: "GET /api/v1/orders/${o_pre_id}/lines"
              payload: {}
              as: DistributorAdmin
          assert:
            - "OrderLine.${line_list_id}.unit_price_cents == 950000"
            - "OrderLine.${line_pre_id}.unit_price_cents == 1000000"
            - "OrderLine.${line_pre_id}.line_discount_cents == 100000"
            - "Contractor.${c2_id}.tier == GOLD"

  # =========================================================================
  # Rule 2 — combinatorial_formula: two different modes (b) and (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: prebuy_discount_per_line_rounding_then_sum
        grounds:
          - calculations.prebuy_discount_calculation
          - entities.Order.fields.discount_cents
          - entities.OrderLine.fields.line_discount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: three separate quantity-1 lines with
          unit_price_cents 333333 and 10% discount produce 33333 per line and
          a discount_cents sum of 99999 — the forbidden sum-then-round order
          over the 999999-cent subtotal would yield 100000; the scaffold pins
          per-line-then-sum so the observed total is 99999.
        test_recipe:
          setup:
            - "Contractor C3 STANDARD tier (no tier discount interference; pre-buy pricing suppresses tier anyway)"
            - "Equipment model M4 list_price_cents 333333, family FAM-Z, no pool"
            - "PreBuyProgram P2 for FAM-Z: window [2026-08-01, 2026-09-01), ship_by 2026-09-15, deposit_pct 0.25, discount_pct 0.10; clock 2026-08-05"
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Gamma Climate", license_number: "LIC-003" }
              as: DistributorAdmin
              captures: { c3_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-333", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 24000, family_code: "FAM-Z", list_price_cents: 333333 }
              as: DistributorAdmin
              captures: { m4_id: $.data.id }
            - call: "POST /api/v1/prebuy-programs"
              payload: { name: "ROUNDING-PREBUY", family_code: "FAM-Z", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", ship_by_date: "2026-09-15T00:00:00Z", deposit_pct: 0.25, discount_pct: 0.10 }
              as: DistributorAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c3_id}", prebuy_program_id: "${p2_id}" }
              as: ContractorUser
              as_user_id: "${c3_id}"
              captures: { o_r_id: $.data.id }
            - call: "POST /api/v1/orders/${o_r_id}/lines"
              payload: { equipment_model_id: "${m4_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c3_id}"
            - call: "POST /api/v1/orders/${o_r_id}/lines"
              payload: { equipment_model_id: "${m4_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c3_id}"
            - call: "POST /api/v1/orders/${o_r_id}/lines"
              payload: { equipment_model_id: "${m4_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c3_id}"
            - call: "POST /api/v1/orders/${o_r_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c3_id}"
          trigger:
            - call: "GET /api/v1/orders/${o_r_id}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "Order.${o_r_id}.subtotal_cents == 999999"
            - "Order.${o_r_id}.discount_cents == 99999"
            - "Order.${o_r_id}.total_cents == 900000"
            - "Order.${o_r_id}.deposit_due_cents == 225000"

      - name: rebate_qualification_circular_order_pinned
        grounds:
          - calculations.rebate_qualification_calculation
          - entities.RebateSubmission.fields.qualified_amount_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency resolved by pinned evaluation
          order: the federal credit depends on installed_cost (already
          discounted line totals), not on the qualified amount itself;
          a PREMIUM system with 500000-cent installed cost yields
          min(200000, round_half_up(500000*0.30)) == 150000 cents, and the
          30%-cap term is rounded BEFORE the min() is applied.
        test_recipe:
          setup:
            - "Contractor C4; delivered order with one AHRI-rated PREMIUM system line whose line_total_cents is 500000"
            - "components: condenser OU1 (list 500000), coil IU1; rating R_PRE seer2 17.0 eer2 12.5 (PREMIUM, tax_credit_eligible)"
            - "logical clock 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Delta HVAC", license_number: "LIC-004" }
              as: DistributorAdmin
              captures: { c4_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "OU-1", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-Q", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { ou1_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "IU-1", equipment_type: "COIL", refrigerant_type: "NONE", capacity_btuh: 36000, family_code: "FAM-Q", list_price_cents: 100000 }
              as: DistributorAdmin
              captures: { iu1_id: $.data.id }
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-1001", outdoor_unit_id: "${ou1_id}", indoor_unit_id: "${iu1_id}", seer2: 17.0, eer2: 12.5 }
              as: DistributorAdmin
              captures: { r_pre_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c4_id}" }
              as: ContractorUser
              as_user_id: "${c4_id}"
              captures: { o_q_id: $.data.id }
            - call: "POST /api/v1/orders/${o_q_id}/lines"
              payload: { ahri_rating_id: "${r_pre_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c4_id}"
            - call: "POST /api/v1/orders/${o_q_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c4_id}"
            - call: "POST /api/v1/orders/${o_q_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o_q_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/rebate-submissions"
              payload: { contractor_id: "${c4_id}", order_id: "${o_q_id}", ahri_rating_id: "${r_pre_id}", program_type: "FEDERAL_TAX_CREDIT", homeowner_name: "H Home", install_address: "1 Main St", install_date: "2026-08-09T00:00:00Z", docs: ["AHRI_CERTIFICATE", "INVOICE", "LOAD_CALC", "PERMIT"] }
              as: ContractorUser
              as_user_id: "${c4_id}"
              captures: { rb1_id: $.data.id }
            - call: "POST /api/v1/rebate-submissions/${rb1_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c4_id}"
          trigger:
            - call: "POST /api/v1/rebate-submissions/${rb1_id}/decision"
              payload: { action: "QUALIFY" }
              as: ComplianceOfficer
          assert:
            - "RebateSubmission.${rb1_id}.status == QUALIFIED"
            - "RebateSubmission.${rb1_id}.qualified_amount_cents == 150000"
            - "AHRISystemRating.${r_pre_id}.efficiency_class == PREMIUM"
            - "AHRISystemRating.${r_pre_id}.tax_credit_eligible == true"

  # =========================================================================
  # Rule 3 — non_linear_state_machine: cycles + parallel dims, different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: parts_claim_revision_loop_cycles
        grounds:
          - state_machines.PartsClaim.MORE_INFO_REQUESTED_to_SUBMITTED
          - state_machines.PartsClaim.UNDER_REVIEW_to_MORE_INFO_REQUESTED
          - entities.PartsClaim.fields.revision_count
          - errors[ERR_REVISION_LIMIT]
        distinguishing_aspect: |
          Cyclic machine on PartsClaim: SUBMITTED -> UNDER_REVIEW ->
          MORE_INFO_REQUESTED -> SUBMITTED may loop at most 3 times; the 4th
          resubmit attempt fails with ERR_REVISION_LIMIT while the claim
          remains MORE_INFO_REQUESTED.
        test_recipe:
          setup:
            - "Contractor C5 with a REGISTERED warranty registration W5 (install 2026-06-01, registered same day)"
            - "PartsClaim PC5 filed against W5 and cycled SUBMITTED -> UNDER_REVIEW -> MORE_INFO_REQUESTED -> SUBMITTED three times already (revision_count == 3), currently UNDER_REVIEW then MORE_INFO_REQUESTED again"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Epsilon Air", license_number: "LIC-005" }
              as: DistributorAdmin
              captures: { c5_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-E5", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-W", list_price_cents: 800000 }
              as: DistributorAdmin
              captures: { m5_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c5_id}" }
              as: ContractorUser
              as_user_id: "${c5_id}"
              captures: { o5_id: $.data.id }
            - call: "POST /api/v1/orders/${o5_id}/lines"
              payload: { equipment_model_id: "${m5_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c5_id}"
            - call: "POST /api/v1/orders/${o5_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c5_id}"
            - call: "POST /api/v1/orders/${o5_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o5_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/warranty-registrations"
              payload: { serial_number: "SN-E5-001", equipment_model_id: "${m5_id}", contractor_id: "${c5_id}", order_id: "${o5_id}", install_date: "2026-06-01T00:00:00Z" }
              as: ContractorUser
              as_user_id: "${c5_id}"
              captures: { w5_id: $.data.id }
            - call: "POST /api/v1/warranty-registrations/${w5_id}/register"
              payload: {}
              as: ContractorUser
              as_user_id: "${c5_id}"
            - call: "POST /api/v1/parts-claims"
              payload: { warranty_registration_id: "${w5_id}", contractor_id: "${c5_id}", failure_date: "2026-06-08T00:00:00Z", part_cost_cents: 100000, labor_cost_cents: 40000 }
              as: ContractorUser
              as_user_id: "${c5_id}"
              captures: { pc5_id: $.data.id }
            - call: "POST /api/v1/parts-claims/${pc5_id}/decision"
              payload: { action: "BEGIN_REVIEW" }
              as: WarrantyProcessor
            - call: "POST /api/v1/parts-claims/${pc5_id}/decision"
              payload: { action: "REQUEST_INFO" }
              as: WarrantyProcessor
            - call: "POST /api/v1/parts-claims/${pc5_id}/resubmit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c5_id}"
            - call: "POST /api/v1/parts-claims/${pc5_id}/decision"
              payload: { action: "BEGIN_REVIEW" }
              as: WarrantyProcessor
            - call: "POST /api/v1/parts-claims/${pc5_id}/decision"
              payload: { action: "REQUEST_INFO" }
              as: WarrantyProcessor
            - call: "POST /api/v1/parts-claims/${pc5_id}/resubmit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c5_id}"
            - call: "POST /api/v1/parts-claims/${pc5_id}/decision"
              payload: { action: "BEGIN_REVIEW" }
              as: WarrantyProcessor
            - call: "POST /api/v1/parts-claims/${pc5_id}/decision"
              payload: { action: "REQUEST_INFO" }
              as: WarrantyProcessor
            - call: "POST /api/v1/parts-claims/${pc5_id}/resubmit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c5_id}"
            - call: "POST /api/v1/parts-claims/${pc5_id}/decision"
              payload: { action: "BEGIN_REVIEW" }
              as: WarrantyProcessor
            - call: "POST /api/v1/parts-claims/${pc5_id}/decision"
              payload: { action: "REQUEST_INFO" }
              as: WarrantyProcessor
          trigger:
            - call: "POST /api/v1/parts-claims/${pc5_id}/resubmit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c5_id}"
              captures: { pc5_err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_REVISION_LIMIT"
            - "PartsClaim.${pc5_id}.revision_count == 3"
            - "PartsClaim.${pc5_id}.status == MORE_INFO_REQUESTED"

      - name: order_parallel_billing_and_fulfillment_dimensions
        grounds:
          - state_machines.OrderBilling.UNBILLED_to_DEPOSIT_INVOICED
          - state_machines.OrderBilling.DEPOSIT_PAID_to_FINAL_INVOICED
          - state_machines.Order.ALLOCATED_to_SHIPPED
          - entities.Order.fields.billing_status
        distinguishing_aspect: |
          Parallel state dimensions on the Order entity: fulfillment advances
          ALLOCATED -> SHIPPED while billing is still DEPOSIT_PAID, and
          billing cannot advance to FINAL_INVOICED until fulfillment reaches
          SHIPPED — the two dimensions evolve independently but gate each
          other at the invoice-final join point.
        test_recipe:
          setup:
            - "Contractor C6; PreBuyProgram P6 OPEN (window covers clock 2026-08-05, ship_by 2026-09-15, deposit 0.25, discount 0.10)"
            - "Order O6 with one 1,000,000-cent line, SUBMITTED then ALLOCATED, deposit invoiced and paid (billing DEPOSIT_PAID)"
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Zeta Comfort", license_number: "LIC-006" }
              as: DistributorAdmin
              captures: { c6_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-Z6", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-V", list_price_cents: 1000000 }
              as: DistributorAdmin
              captures: { m6_id: $.data.id }
            - call: "POST /api/v1/prebuy-programs"
              payload: { name: "P6", family_code: "FAM-V", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z", ship_by_date: "2026-09-15T00:00:00Z", deposit_pct: 0.25, discount_pct: 0.10 }
              as: DistributorAdmin
              captures: { p6_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c6_id}", prebuy_program_id: "${p6_id}" }
              as: ContractorUser
              as_user_id: "${c6_id}"
              captures: { o6_id: $.data.id }
            - call: "POST /api/v1/orders/${o6_id}/lines"
              payload: { equipment_model_id: "${m6_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c6_id}"
            - call: "POST /api/v1/orders/${o6_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c6_id}"
            - call: "POST /api/v1/orders/${o6_id}/billing-events"
              payload: { event_type: "INVOICE_DEPOSIT" }
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o6_id}/billing-events"
              payload: { event_type: "PAY_DEPOSIT" }
              as: ContractorUser
              as_user_id: "${c6_id}"
          trigger:
            - call: "POST /api/v1/orders/${o6_id}/billing-events"
              payload: { event_type: "INVOICE_FINAL" }
              as: DistributorAdmin
              captures: { o6_err: $.data.error_id }
            - call: "POST /api/v1/orders/${o6_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o6_id}/billing-events"
              payload: { event_type: "INVOICE_FINAL" }
              as: DistributorAdmin
          assert:
            - "first trigger call error_id == ERR_INVALID_STATE (billing cannot join ahead of fulfillment SHIPPED)"
            - "after ship: Order.${o6_id}.status == SHIPPED and Order.${o6_id}.billing_status == FINAL_INVOICED"

  # =========================================================================
  # Rule 4 — transitive_cascade: two cascades, different triggers, depth >=3 / >=2
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: delivery_cascade_accrual_tier_provisional
        grounds:
          - state_machines.Order.SHIPPED_to_DELIVERED
          - calculations.coop_accrual_calculation
          - calculations.dealer_tier_calculation
          - entities.Contractor.fields.tier
        distinguishing_aspect: |
          Depth-3 cascade originating at the DELIVERED trigger:
          Order.SHIPPED->DELIVERED mutates Contractor.ytd/final accrual
          (link 1); the ytd mutation itself triggers dealer_tier_calculation
          which flips tier STANDARD->SILVER at exactly 5,000,000 cents
          (link 2); the delivery also drops the order's lines from the
          provisional accrual base (link 3) — each link caused by the
          previous one, not by the deliver action directly.
        test_recipe:
          setup:
            - "Contractor C7 with two orders: O7a line total 4,000,000 (DELIVERED already) and O7b line total 1,000,000 (SHIPPED, awaiting deliver)"
            - "after setup: ytd 4,000,000, tier STANDARD; provisional base includes O7b (1,000,000 * 0.02 = 20,000 contribution)"
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Eta Services", license_number: "LIC-007" }
              as: DistributorAdmin
              captures: { c7_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-E7A", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-U", list_price_cents: 4000000 }
              as: DistributorAdmin
              captures: { m7a_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-E7B", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-U", list_price_cents: 1000000 }
              as: DistributorAdmin
              captures: { m7b_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c7_id}" }
              as: ContractorUser
              as_user_id: "${c7_id}"
              captures: { o7a_id: $.data.id }
            - call: "POST /api/v1/orders/${o7a_id}/lines"
              payload: { equipment_model_id: "${m7a_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c7_id}"
            - call: "POST /api/v1/orders/${o7a_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c7_id}"
            - call: "POST /api/v1/orders/${o7a_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o7a_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c7_id}" }
              as: ContractorUser
              as_user_id: "${c7_id}"
              captures: { o7b_id: $.data.id }
            - call: "POST /api/v1/orders/${o7b_id}/lines"
              payload: { equipment_model_id: "${m7b_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c7_id}"
            - call: "POST /api/v1/orders/${o7b_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c7_id}"
            - call: "POST /api/v1/orders/${o7b_id}/ship"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/orders/${o7b_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "GET /api/v1/contractors/${c7_id}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "Contractor.${c7_id}.ytd_purchase_cents == 5000000"
            - "Contractor.${c7_id}.tier == SILVER (crossed the >= 5000000 boundary at link 2)"
            - "Contractor.${c7_id}.coop_accrual_final_cents == 100000"
            - "Contractor.${c7_id}.coop_accrual_provisional_cents == 100000 (in-flight contribution removed at link 3; only DELIVERED lines remain in both bases)"

      - name: registration_lapse_denies_open_claim
        grounds:
          - state_machines.WarrantyRegistration.PENDING_REGISTRATION_to_LAPSED
          - state_machines.PartsClaim.SUBMITTED_to_DENIED
          - entities.WarrantyRegistration.fields.registration_deadline
        distinguishing_aspect: |
          Depth-2 cascade originating at the warranty lapse trigger (different
          from the delivery trigger): the clock-driven LAPSED transition on
          WarrantyRegistration itself causes the anchored SUBMITTED PartsClaim
          to auto-DENY; the claim's denial is not caused by any direct claim
          action, and total_award_cents stays 0.
        test_recipe:
          setup:
            - "Contractor C8; delivered order; WarrantyRegistration W8 with install_date 2026-06-01 (deadline 2026-07-31T00:00:00Z) left PENDING_REGISTRATION"
            - "PartsClaim PC8 against W8 in SUBMITTED state"
            - "logical clock advanced to 2026-08-01T00:00:00Z (past the deadline)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Theta Air", license_number: "LIC-008" }
              as: DistributorAdmin
              captures: { c8_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-T8", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-T", list_price_cents: 800000 }
              as: DistributorAdmin
              captures: { m8_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${c8_id}" }
              as: ContractorUser
              as_user_id: "${c8_id}"
              captures: { o8_id: $.data.id }
            - call: "POST /api/v1/orders/${o8_id}/lines"
              payload: { equipment_model_id: "${m8_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${c8_id}"
            - call: "POST /api/v1/orders/${o8_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${c8_id}"
            - call: "POST /api/v1/orders/${o8_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${o8_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/warranty-registrations"
              payload: { serial_number: "SN-T8-001", equipment_model_id: "${m8_id}", contractor_id: "${c8_id}", order_id: "${o8_id}", install_date: "2026-06-01T00:00:00Z" }
              as: ContractorUser
              as_user_id: "${c8_id}"
              captures: { w8_id: $.data.id }
            - call: "POST /api/v1/parts-claims"
              payload: { warranty_registration_id: "${w8_id}", contractor_id: "${c8_id}", failure_date: "2026-06-20T00:00:00Z", part_cost_cents: 50000, labor_cost_cents: 10000 }
              as: ContractorUser
