# ===========================================================================
# 1.9 Scaffold Corner Design — arena-changeover-ops (task 2523)
# ===========================================================================
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Sections and claim_type values are
# taken verbatim from references/claim-extraction-guide.md; no categories are invented.
#
# SHARED FIXTURE VOCABULARY (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml so the two
# files can share fixtures downstream):
#   VENUE "Lakeside Arena": rigging_capacity_kg 20000, dock_count 4, max_bowl_seats 18000,
#     crew_headcount_cap 60, min_turnaround_buffer_minutes 45, dock_buffer_minutes 30,
#     overnight_shift_start_local_hour 22
#   PROFILE ICE     ICE_HOCKEY        requires_ice true  cover false FULL_BOWL       17000 base 240 crew 30 panels 0   dehum 120 rig 40
#   PROFILE CONCERT CONCERT_END_STAGE requires_ice false cover true  CURTAINED_HALF   9000 base 300 crew 40 panels 120 dehum 0   rig 220
#   PROFILE COURT   COURT_BASKETBALL  requires_ice false cover true  RETRACTABLE_IN  15000 base 180 crew 24 panels 80  dehum 0   rig 60
#   PROFILE FAMILY  FAMILY_SHOW       requires_ice false cover true  FULL_BOWL       12000 base 200 crew 25 panels 40  dehum 0   rig 90
#   ROLE HEADERS: dir-lakeside = VenueOperationsDirector, sup-alpha = ChangeoverSupervisor,
#     BookingManager and LaborCoordinator are opaque (no as_user_id needed),
#     AnchorTenantRep acts as the AnchorTenant id it owns.
# ===========================================================================

scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_all_declared_fields_with_derived_counters_at_zero
        claim_type: creation
        grounds:
          - entities.Venue
          - endpoints.POST_/venues
          - response_envelope.success
        distinguishing_aspect: "POST /venues with every required input returns 201 and a data object whose computed fields read ice_deck_status NONE, rigging_committed_load_kg 0, open_hold_count 0, changeover_debt_minutes 0 and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
          trigger:
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
          assert:
            - "HTTP 201"
            - "response_type == object and meta.api_request_id is present"
            - "Venue.${venue_id}.name == Lakeside Arena"
            - "Venue.${venue_id}.rigging_capacity_kg == 20000"
            - "Venue.${venue_id}.dock_count == 4"
            - "Venue.${venue_id}.crew_headcount_cap == 60"
            - "Venue.${venue_id}.ice_deck_status == NONE"
            - "Venue.${venue_id}.rigging_committed_load_kg == 0.00"
            - "Venue.${venue_id}.open_hold_count == 0"
            - "Venue.${venue_id}.changeover_debt_minutes == 0"
            - "Venue.${venue_id}.version == 1"

      - name: get_venue_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Venue
          - endpoints.GET_/venues/{id}
        distinguishing_aspect: "GET /venues/{id} echoes the row created by POST /venues field for field, including the 45-minute buffer default and version 1, and does not bump version."
        test_recipe:
          setup:
            - "One venue created at 2026-08-01T00:00:00Z with min_turnaround_buffer_minutes left to its default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
          trigger:
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { read_version: $.data.version }
          assert:
            - "HTTP 200"
            - "Venue.${venue_id}.name == Lakeside Arena"
            - "Venue.${venue_id}.min_turnaround_buffer_minutes == 45"
            - "read_version == 1, so the read did not bump version"

      - name: list_event_bookings_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/event-bookings
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three bookings on one venue, GET /event-bookings?venue_id=&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One venue with PROFILE ICE and three DRAFT promoter bookings on 2026-09-10, 2026-09-11 and 2026-09-12."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk1: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 11", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-11T00:00:00Z", event_end_utc: "2026-09-11T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk2: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 12", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-12T00:00:00Z", event_end_utc: "2026-09-12T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk3: $.data.id }
          trigger:
            - call: "GET /event-bookings"
              payload: { venue_id: "${venue_id}", limit: 2, offset: 0 }
              as: BookingManager
            - call: "GET /event-bookings"
              payload: { venue_id: "${venue_id}", limit: 2, offset: 2 }
              as: BookingManager
          assert:
            - "the first trigger call returns response_type == array with exactly 2 items, total_count == 3 and has_more == true"
            - "the second trigger call returns exactly 1 item, total_count == 3 and has_more == false"
            - "the two pages together contain ${bk1}, ${bk2} and ${bk3} with no duplicates"

      - name: get_event_booking_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors.ERR_BOOKING_NOT_FOUND
          - endpoints.GET_/event-bookings/{id}
        distinguishing_aspect: "A GET for a well-formed but unknown booking id returns 404 ERR_BOOKING_NOT_FOUND, not an empty 200 envelope."
        test_recipe:
          setup:
            - "One venue exists; no booking with the requested id has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
          trigger:
            - call: "GET /event-bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BookingManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "err == ERR_BOOKING_NOT_FOUND"
            - "response_type == error"

      - name: create_event_booking_missing_required_config_profile_id_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/event-bookings
        distinguishing_aspect: "Omitting config_profile_id — an input field with no default — returns 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup:
            - "One venue with PROFILE ICE exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
          trigger:
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "err == ERR_INVALID_REQUEST"
            - "GET /event-bookings?venue_id=${venue_id} returns total_count == 0"

      - name: create_event_booking_omitting_rigging_load_kg_applies_the_zero_default
        claim_type: defaults
        grounds:
          - entities.EventBooking.fields.rigging_load_kg
          - endpoints.POST_/event-bookings
        distinguishing_aspect: "A booking created without rigging_load_kg stores 0 and therefore contributes nothing to the grid aggregate once confirmed."
        test_recipe:
          setup:
            - "One venue with PROFILE ICE exists; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
          trigger:
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Rigging-free skate", promoter_name: "Community Skate", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 5000 }
              as: BookingManager
              captures: { bk: $.data.id }
          assert:
            - "HTTP 201"
            - "EventBooking.${bk}.rigging_load_kg == 0"
            - "EventBooking.${bk}.status == DRAFT"
            - "EventBooking.${bk}.displacement_penalty_cents == 0"

      - name: equipment_asset_units_available_is_computed_and_extra_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.EquipmentAsset.fields.units_available
          - calculations.equipment_units_available
          - endpoints.POST_/venues/{id}/equipment-assets
        distinguishing_aspect: "A create carrying units_available 3 and service_due true still stores units_available 10 and service_due false, because both are computed from units_total, outstanding issues and cycles_since_service."
        test_recipe:
          setup:
            - "One venue exists; no equipment pools yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/equipment-assets"
              payload: { asset_class: "FLOOR_PANEL_SET", units_total: 10, service_interval_cycles: 12, units_available: 3, service_due: true }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { asset: $.data.id }
          assert:
            - "HTTP 201"
            - "EquipmentAsset.${asset}.units_available == 10, not the submitted 3"
            - "EquipmentAsset.${asset}.service_due == false, not the submitted true"
            - "EquipmentAsset.${asset}.units_out_of_service == 0"
            - "EquipmentAsset.${asset}.cycles_since_service == 0"
            - "EquipmentAsset.${asset}.status == IN_SERVICE"

      - name: venue_system_fields_are_server_generated_and_client_values_ignored_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Venue
          - endpoints.POST_/venues
        distinguishing_aspect: "A create carrying id, created_at and version is stored with a server-minted id, created_at equal to the logical clock 2026-08-01T00:00:00.000Z and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
          trigger:
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22, id: "client-supplied-id", created_at: "2020-01-01T00:00:00Z", version: 99 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id, made_at: $.data.created_at, ver: $.data.version }
          assert:
            - "HTTP 201"
            - "venue_id != client-supplied-id"
            - "made_at == 2026-08-01T00:00:00.000Z"
            - "ver == 1, not the submitted 99"

      - name: create_configuration_profile_with_an_invalid_seating_mode_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.ConfigurationProfile.fields.seating_mode
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "seating_mode HALF_HOUSE is not a member of {FULL_BOWL, RETRACTABLE_IN, RETRACTABLE_OUT, CURTAINED_HALF} and returns 400 ERR_INVALID_REQUEST while a booking with event_end_utc equal to event_start_utc is rejected by the same rule."
        test_recipe:
          setup:
            - "One venue exists with PROFILE ICE already declared."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "FAMILY_SHOW", requires_ice: false, ice_cover_required: true, seating_mode: "HALF_HOUSE", nominal_seats: 12000, base_changeover_minutes: 200, crew_size_required: 25, floor_protection_panels_required: 40, dehumidification_required_lph: 0, rigging_points_required: 90 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { err_enum: $.data.error_id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Zero-length event", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T00:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { err_interval: $.data.error_id }
          assert:
            - "the first trigger call returns HTTP 400 and err_enum == ERR_INVALID_REQUEST"
            - "the second trigger call returns HTTP 400 and err_interval == ERR_INVALID_REQUEST, because event_end_utc must be strictly greater than event_start_utc"
            - "GET /venues/${venue_id}/configuration-profiles returns total_count == 1"

      - name: configuration_profile_is_immutable_with_no_update_endpoint_and_no_version_field
        claim_type: immutability
        grounds:
          - entities.ConfigurationProfile
          - endpoints.GET_/venues/{id}/configuration-profiles
        distinguishing_aspect: "ConfigurationProfile declares common_fields false, so §1.5 exposes exactly one write path (POST /venues/{id}/configuration-profiles) and the read row carries no version field, which is why every ChangeoverOrder can trust the profile numbers it read at creation."
        test_recipe:
          setup:
            - "One venue with PROFILE ICE and PROFILE CONCERT declared."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "CONCERT_END_STAGE", requires_ice: false, ice_cover_required: true, seating_mode: "CURTAINED_HALF", nominal_seats: 9000, base_changeover_minutes: 300, crew_size_required: 40, floor_protection_panels_required: 120, dehumidification_required_lph: 0, rigging_points_required: 220 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_con: $.data.id }
          trigger:
            - call: "GET /venues/${venue_id}/configuration-profiles"
              payload: {}
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
          assert:
            - "HTTP 200 with total_count == 2"
            - "no row in the response carries a version field"
            - "the ICE row still reads base_changeover_minutes == 240 and dehumidification_required_lph == 120"
            - "the CONCERT row still reads floor_protection_panels_required == 120 and seating_mode == CURTAINED_HALF"
            - "§1.5 declares no PATCH, PUT or DELETE path for configuration profiles"

      - name: create_configuration_profile_under_an_unknown_venue_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ConfigurationProfile.parent
          - validations[priority=40]
          - errors.ERR_VENUE_NOT_FOUND
        distinguishing_aspect: "A profile create nested under an id no venue owns returns 404 ERR_VENUE_NOT_FOUND rather than creating an orphan profile."
        test_recipe:
          setup:
            - "One venue exists but is not the venue addressed by the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /venues/00000000-0000-4000-8000-000000000001/configuration-profiles"
