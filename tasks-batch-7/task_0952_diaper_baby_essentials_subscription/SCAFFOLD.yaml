scenario: "952. Diaper & Baby-Essentials Subscription: plan & size/stage, recurring cadence & auto-resize, delivery & skip, registry & gift, points/loyalty, sensitive-skin/allergy, pause/cancel, referral"
domain_name: diaper-baby-essentials-subscription
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy
    - derived_field_reconciliation

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

  structural_device: |
    TWO structurally different pipelines share ONE derivation ladder.

    Pipeline R (recurring subscription cycle):
      Plan -> Subscription -> Cycle generated on cadence -> CycleLine allocation and
      size/stage resolution -> cutoff lock -> charge -> dispatch (Shipment) -> delivery.
      Governed by SkipRecord, PauseRecord and ResizeEvent.

    Pipeline G (registry and gift order):
      Registry created by RegistryOwner -> RegistryItem requested -> GiftOrder purchased by a
      third-party GiftPurchaser -> paid -> claimed by the RegistryOwner either as a Credit
      (claim_mode=CREDIT) or as a gifted item (claim_mode=ITEM) which produces a ONE-OFF
      Shipment that is NOT a subscription Cycle.

    SHARED rungs (identical for both pipelines): line pricing (calc line_unit_price_cents),
    credit stacking order (calc total_due_cents / gift_credit_applied_cents /
    referral_credit_applied_cents / loyalty_redemption_applied_cents / promo_discount_cents),
    allergen screen (calc sku_allergen_eligibility, validation priority 41),
    substitution ladder (calc substitution_candidate_rank), shipping (calc shipping_cents),
    and the Shipment state machine.

    DIVERGENT rungs (the same ladder resolves differently per pipeline):
      1. Cutoff semantics — Pipeline R uses cutoff_instant = ship_date - 48h and locks the
         cycle; Pipeline G has NO cutoff: a gift shipment is dispatchable the moment it is
         claimed (calc cutoff_instant, applies_to Cycle only).
      2. Who may cancel/refund — Pipeline R refunds are requested by the AccountHolder and
         approved by SupportAgent; Pipeline G refunds are requested by the GiftPurchaser only
         (validations priority 15 and 16).
      3. Proration — Pipeline R cancel uses calc cancel_refund_cents (dual variant on
         dispatched vs undispatched); Pipeline G refunds the full paid face value with NO
         proration and NO restock fee.
      4. Points earning eligibility — only Pipeline R deliveries earn loyalty points
         (calc points_earned, input_set excludes gift shipments entirely).
      5. Auto-resize — applies ONLY to Pipeline R cycles. A gift ITEM shipment ships the
         exact SKU on the RegistryItem and is never auto-resized.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

