            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-09-02T10:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { v1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T10:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/reinspection-visits/${v1}/complete", payload: { results: [ { deficiency_item_id: "${d1}", outcome: "PASS" } ] }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d1}/sign-off", payload: {}, as: Homebuyer, as_user_id: "${b1}" }
            - { call: "GET /api/escrow-holdbacks?home_id=${h1}", payload: {}, as: CustomerCareManager, captures: { esc1: "$.data[0].id", esc_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /api/escrow-holdbacks/${esc1}/release", payload: { expected_escrow_version: "${esc_v}" }, as: CustomerCareManager, captures: { esc_status: "$.data.status", esc_released: "$.data.released_amount_cents", esc_rem: "$.data.remaining_amount_cents" } }
          assert:
            - "remaining_amount_cents == 0 exactly after the release (observed ${esc_rem})"
            - "status == FULLY_RELEASED precisely because remaining hit 0 (flush rule: no open AFTER_CLOSING items remain, entire remaining 40000 released)"
            - "released_amount_cents == 40000 == funded_amount_cents (conservation: funded == released + remaining)"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: complete_requires_verified_primary_attendee
        grounds:
          - state_machines.OrientationAppointment.IN_PROGRESS_to_COMPLETED
          - state_machines.Attendee.PENDING_to_VERIFIED
        distinguishing_aspect: |
          Entity pair OrientationAppointment x Attendee: the appointment's
          IN_PROGRESS -> COMPLETED transition is gated on a DIFFERENT entity —
          at least one Attendee row VERIFIED covering the primary buyer. With
          the attendee still PENDING the complete fails; after verification it
          succeeds. Distinct pair from close_requires_signed_acknowledgment.
        test_recipe:
          setup:
            - "Home h1 orientation IN_PROGRESS; checklist fully marked; attendee for the primary buyer recorded but still PENDING"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/attendees", payload: { appointment_id: "${a1}", attendee_type: "BUYER", buyer_id: "${b1}" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { at1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/PLUMBING/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/ELECTRICAL/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/EXTERIOR/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/SAFETY/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/APPLIANCES/mark", payload: { outcome: "SKIPPED" }, as: CustomerCareRep, as_user_id: "${r1}" }
          trigger:
            - { call: "POST /api/appointments/${a1}/complete", payload: {}, as: CustomerCareRep, as_user_id: "${r1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /api/attendees/${at1}/decide-verification", payload: { decision: "VERIFIED" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/complete", payload: {}, as: CustomerCareRep, as_user_id: "${r1}", captures: { st: "$.data.status" } }
          assert:
            - "first complete with PENDING attendee -> error_id == ERR_ATTENDEE_REQUIREMENT_UNMET (http 409)"
            - "after Attendee.${at1} becomes VERIFIED, second complete -> appointment status == COMPLETED (observed ${st})"

      - name: close_requires_signed_acknowledgment
        grounds:
          - state_machines.Home.READY_TO_CLOSE_to_CLOSED
          - state_machines.AcknowledgmentSignature.PENDING_to_SIGNED
        distinguishing_aspect: |
          Entity pair Home x AcknowledgmentSignature (distinct from
          Appointment x Attendee): the home cannot leave ORIENTED for
          ACKNOWLEDGED/READY_TO_CLOSE, and therefore cannot close, while its
          signature record is PENDING — closing early fails with
          ERR_INVALID_STATE; after the buyer signs, the same close succeeds.
        test_recipe:
          setup:
            - "Home h1 orientation COMPLETED; signature PENDING; escrow provisioned DRAFT (amount 0); home ORIENTED"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/attendees", payload: { appointment_id: "${a1}", attendee_type: "BUYER", buyer_id: "${b1}" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { at1: "$.data.id" } }
            - { call: "POST /api/attendees/${at1}/decide-verification", payload: { decision: "VERIFIED" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/PLUMBING/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/ELECTRICAL/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/EXTERIOR/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/SAFETY/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/APPLIANCES/mark", payload: { outcome: "SKIPPED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/complete", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "GET /api/acknowledgment-signatures?home_id=${h1}", payload: {}, as: CustomerCareManager, captures: { sg1: "$.data[0].id" } }
            - { call: "GET /api/escrow-holdbacks?home_id=${h1}", payload: {}, as: CustomerCareManager, captures: { esc1: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/homes/${h1}/close", payload: {}, as: CustomerCareManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/acknowledgment-signatures/${sg1}/respond", payload: { decision: "SIGN", signature_payload: "sig:alice:1" }, as: Homebuyer, as_user_id: "${b1}" }
            - { call: "POST /api/homes/${h1}/close", payload: {}, as: CustomerCareManager, captures: { home_status: "$.data.status" } }
            - { call: "GET /api/escrow-holdbacks/${esc1}", payload: {}, as: CustomerCareManager, captures: { esc_status: "$.data.status" } }
          assert:
            - "close while signature PENDING -> error_id == ERR_INVALID_STATE (home is ORIENTED, not READY_TO_CLOSE)"
            - "after SIGN: close succeeds, Home.${h1}.status == CLOSED (observed ${home_status})"
            - "zero-amount escrow finalized: EscrowHoldback.${esc1}.status == VOIDED (DRAFT with final 0 voids at close)"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: orientation_buffer_closed_interval_touching_conflict
        grounds:
          - calculations.orientation_overlap_check
          - entities.Community.fields.appointment_buffer_minutes
        distinguishing_aspect: |
          Interval semantics A on OrientationAppointment: CLOSED intervals
          extended by the 30-minute community buffer on both sides — a new
          appointment starting at exactly the buffered end (touching) is a
          CONFLICT, one minute later is allowed. Distinct entity and semantics
          from visit_half_open_adjacency_with_daily_capacity_cap.
        test_recipe:
          setup:
            - "Default community (buffer 30, duration 120); rep r1 occupies 2026-08-25T14:00 (buffered closed interval [13:30, 16:30]) via h1's appointment"
            - "Homes h2, h3 PRE_CLOSE_READY, closing 2026-09-01T17:00:00Z"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-102", address: "2 Riverbend Way", sales_price_cents: 46000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h2: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-103", address: "3 Riverbend Way", sales_price_cents: 47000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h3: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/homes/${h2}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/homes/${h3}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /api/appointments", payload: { home_id: "${h2}", rep_id: "${r1}", scheduled_start: "2026-08-25T17:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /api/appointments", payload: { home_id: "${h3}", rep_id: "${r1}", scheduled_start: "2026-08-25T17:01:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a_ok: "$.data.id", st_ok: "$.data.status" } }
          assert:
            - "17:00 start -> buffered start 16:30 touches occupied closed end 16:30 -> error_id == ERR_REP_SCHEDULE_CONFLICT (http 409)"
            - "17:01 start -> buffered start 16:31 clears the closed interval -> 201, status REQUESTED (observed ${st_ok})"

      - name: visit_half_open_adjacency_with_daily_capacity_cap
        grounds:
          - calculations.reinspection_capacity_check
          - entities.CustomerCareRep.fields.daily_visit_capacity_minutes
        distinguishing_aspect: |
          Interval semantics B on ReinspectionVisit (different resource entity
          than OrientationAppointment): HALF-OPEN pairwise intervals (a visit
          starting exactly when the previous ends is ALLOWED) PLUS a daily
          aggregate capacity of 240 minutes — the 4th 60-minute visit reaching
          exactly 240 is allowed, the 5th (+60) is rejected.
        test_recipe:
          setup:
            - "Default community; rep r1 with default daily_visit_capacity_minutes 240; home h1 exists"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-26T09:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { v1: "$.data.id" } }
            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-26T10:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { v2: "$.data.id" } }
            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-26T11:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { v3: "$.data.id" } }
          trigger:
            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-26T12:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { v4: "$.data.id", v4_status: "$.data.status" } }
            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-26T13:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { err: "$.data.error_id" } }
          assert:
            - "visits at 09/10/11 all created: half-open adjacency (10:00 == 09:00+60) is allowed, no ERR_VISIT_OVERLAP"
            - "4th visit (12:00) bringing the day total to exactly 240 == capacity -> 201 SCHEDULED (observed ${v4_status})"
            - "5th visit (13:00, would make 300 > 240) -> error_id == ERR_DAILY_CAPACITY_EXCEEDED (http 409)"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: escrow_decide_redecide_amount_conservation
        grounds:
          - calculations.escrow_holdback_amount
          - state_machines.DeficiencyItem.DECIDED_to_DECIDED
          - entities.EscrowHoldback.fields.holdback_amount_cents
        distinguishing_aspect: |
          Conserved quantity: escrow holdback cents. Forward action
          decide(AFTER_CLOSING) on item d2 adds exactly its contribution
          (20000), and the compensating decide(COMPLETE_BEFORE_CLOSING) removes
          exactly the same amount — the invariant holdback_amount_cents ==
          sum of per-line contributions over after-open items holds at 40000
          before the pair AND after the pair. Distinct quantity from the
          checklist-count invariant.
        test_recipe:
          setup:
            - "Community multiplier 2.0, min 1000; home h1 orientation completed with escrow ACTIVE 40000 (item d1 WARRANTABLE 20000 AFTER_CLOSING)"
            - "Item d2 WARRANTABLE 10000 CLASSIFIED, not yet decided"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend", holdback_cost_multiplier: 2.0, holdback_min_cents: 1000, holdback_max_cents: 10000000 }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items", payload: { home_id: "${h1}", appointment_id: "${a1}", title: "Furnace ignition fault" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { d1: "$.data.id" } }
            - { call: "POST /api/deficiency-items/${d1}/classify", payload: { classification: "WARRANTABLE", estimated_repair_cost_cents: 20000 }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d1}/decide", payload: { resolution: "COMPLETE_AFTER_CLOSING" }, as: CustomerCareManager }
            - { call: "POST /api/deficiency-items", payload: { home_id: "${h1}", appointment_id: "${a1}", title: "Gate latch misaligned" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { d2: "$.data.id" } }
            - { call: "POST /api/deficiency-items/${d2}/classify", payload: { classification: "WARRANTABLE", estimated_repair_cost_cents: 10000 }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/attendees", payload: { appointment_id: "${a1}", attendee_type: "BUYER", buyer_id: "${b1}" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { at1: "$.data.id" } }
            - { call: "POST /api/attendees/${at1}/decide-verification", payload: { decision: "VERIFIED" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/PLUMBING/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/ELECTRICAL/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/EXTERIOR/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/SAFETY/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/APPLIANCES/mark", payload: { outcome: "SKIPPED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/complete", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "GET /api/escrow-holdbacks?home_id=${h1}", payload: {}, as: CustomerCareManager, captures: { esc1: "$.data[0].id", amt_before: "$.data[0].holdback_amount_cents" } }
          trigger:
            - { call: "POST /api/deficiency-items/${d2}/decide", payload: { resolution: "COMPLETE_AFTER_CLOSING" }, as: CustomerCareManager }
            - { call: "GET /api/escrow-holdbacks/${esc1}", payload: {}, as: CustomerCareManager, captures: { amt_forward: "$.data.holdback_amount_cents" } }
            - { call: "POST /api/deficiency-items/${d2}/decide", payload: { resolution: "COMPLETE_BEFORE_CLOSING" }, as: CustomerCareManager }
            - { call: "GET /api/escrow-holdbacks/${esc1}", payload: {}, as: CustomerCareManager, captures: { amt_after: "$.data.holdback_amount_cents", esc_status: "$.data.status" } }
            - { call: "GET /api/homes/${h1}", payload: {}, as: CustomerCareManager, captures: { ob: "$.data.open_before_closing_count", oa: "$.data.open_after_closing_count" } }
          assert:
            - "before the pair: holdback_amount_cents == 40000 (observed ${amt_before})"
            - "forward decide AFTER on d2: holdback_amount_cents == 60000 (observed ${amt_forward})"
            - "compensating decide BEFORE on d2: holdback_amount_cents == 40000 exactly (observed ${amt_after}) — forward+compensate leaves the conserved quantity unchanged"
            - "EscrowHoldback.${esc1}.status == ACTIVE throughout"
            - "home counters consistent: open_before_closing_count == 1 (d2), open_after_closing_count == 1 (d1)"

      - name: checklist_mark_reset_count_conservation
        grounds:
          - endpoints: "POST /api/appointments/{id}/checklist-items/{system_key}/mark"
          - entities.OrientationAppointment.fields.checklist_demonstrated_count
          - entities.OrientationAppointment.fields.checklist_pending_count
        distinguishing_aspect: |
          Conserved quantity: checklist partition counts (NOT cents): for every
          mark/reset, checklist_total_count == demonstrated + pending + skipped
          == 6; the forward mark (PENDING -> DEMONSTRATED) paired with the
          compensating reset (DEMONSTRATED -> PENDING) restores demonstrated=0,
          pending=6 exactly. Distinct quantity from the escrow-cent invariant.
        test_recipe:
          setup:
            - "Home h1 orientation started; checklist seeded (6 items: 5 required + APPLIANCES optional), all PENDING"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-01T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}", captures: { t0_total: "$.data.checklist_total_count", t0_pend: "$.data.checklist_pending_count", t0_demo: "$.data.checklist_demonstrated_count", t0_skip: "$.data.checklist_skipped_count" } }
          trigger:
            - { call: "POST /api/appointments/${a1}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { t1_total: "$.data.checklist_total_count", t1_pend: "$.data.checklist_pending_count", t1_demo: "$.data.checklist_demonstrated_count" } }
            - { call: "POST /api/appointments/${a1}/checklist-items/HVAC/mark", payload: { outcome: "PENDING" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { t2_total: "$.data.checklist_total_count", t2_pend: "$.data.checklist_pending_count", t2_demo: "$.data.checklist_demonstrated_count" } }
          assert:
            - "at seed: total == 6, pending == 6, demonstrated == 0, skipped == 0 (observed ${t0_total}/${t0_pend}/${t0_demo}/${t0_skip})"
            - "after mark DEMONSTRATED: total == 6, pending == 5, demonstrated == 1 (observed ${t1_total}/${t1_pend}/${t1_demo})"
            - "after compensating reset to PENDING: total == 6, pending == 6, demonstrated == 0 (observed ${t2_total}/${t2_pend}/${t2_demo}) — partition invariant total == pending+demonstrated+skipped == 6 holds before, during, and after the pair"
