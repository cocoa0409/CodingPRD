            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 300.00 }
              as: FinanceClerk
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
            - call: "POST /bookings/${bk_id}/start-service"
              payload: {}
              as: OperationsManager
            - call: "GET /bookings/${bk_id}/event-logs"
              payload: {}
              as: OperationsManager
              captures: { log_id: $.data.0.id, log_v_stale: $.data.0.version }
            - call: "PATCH /event-logs/${log_id}"
              payload: { actual_print_count: 250 }
              as: OperationsManager
          trigger:
            - call: "POST /event-logs/${log_id}/finalize"
              payload: { actual_setup_start: "2026-09-12T18:00:00Z", actual_coverage_start: "2026-09-12T18:00:00Z", actual_coverage_end: "2026-09-12T22:00:00Z", actual_teardown_end: "2026-09-12T22:30:00Z", actual_print_count: 250, expected_eventlog_version: "${log_v_stale}" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"
            - "EventLog.${log_id}.finalized == false"

      - name: cascade_finalize_chain_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.EventLog.OPEN_to_FINALIZED, state_machines.Booking.IN_SERVICE_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / finalize_cascade_depth3_balance_to_completion_gate
          rationale: "The 3-level finalize -> balance_due -> PAID_IN_FULL -> COMPLETED cascade is asserted by the named §1.8 instance."

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_quote_visible_in_create_response
        claim_type: immediate
        grounds: [entities.Booking.fields.quote_subtotal, calculations.estimate_quote]
        excluded_because:
          difficulty_instance: dual_variant_calc / quote_vs_final_settlement_on_booking
          rationale: "Immediate visibility of the computed quote_subtotal in the create response is exercised by the §1.8 dual-variant instance and by the entities create_booking corner above."
