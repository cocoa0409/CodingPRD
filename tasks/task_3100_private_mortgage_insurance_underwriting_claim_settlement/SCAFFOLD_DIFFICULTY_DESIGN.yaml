            - call: "POST /mortgage-insurance/claims/${claim_id}/settle"
              payload: { settlement_option_kind: "CASH", expected_claim_version: "${claim_v}", expected_loan_version: "${loan_v}" }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { error: $.data.error_id }
          assert:
            - "the request carries OCC version values that match the resources, so the ONLY failure in play is the validation-priority conflict"
            - "the response status is 409"
            - "the response error_id == ERR_INVALID_STATE_TRANSITION"
            - "the response error_id != ERR_CURTAILMENT_DISPUTE_OPEN, so the priority-5 state check wins when the priority-17 referential rule is also violated"
            - "Claim.${claim_id}.status is unchanged at FILED, so neither check was bypassed"

      - name: business_safety_beats_business_temporal_on_claim_approval
        grounds:
          - validations[priority=10]
          - validations[priority=16]
          - errors[ERR_CLAIM_BLOCKED_LOSS_MITIGATION]
          - errors[ERR_COVERAGE_NOT_ACTIVE]
        distinguishing_aspect: "The business_safety-versus-business_temporal pairing: a loan whose coverage was already cancelled before the claim's event instant and whose last Class-A report failed the participation standard fails both checks, and the priority-10 safety gate wins so ERR_CLAIM_BLOCKED_LOSS_MITIGATION is returned rather than ERR_COVERAGE_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated loan whose coverage is cancelled, whose single Class-A January report met only outreach and therefore missed the PARTICIPATION_COMPLETE standard."
            - "A claim on that loan whose event instant falls after the cancellation took effect, taken into review."
          setup_api_calls:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "PRIORITY-2", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /mortgage-insurance/delinquency-reports"
              payload: { loan_id: "${loan_id}", servicer_id: "${servicer_id}", as_of_period: "2026-01", delinquency_class: "A", months_delinquent: 2, loss_mitigation_activities: [{ activity_kind: "OUTREACH_SENT", outcome: "COMPLETED", activity_utc: "2026-01-10T00:00:00Z" }] }
              as: Servicer
              as_user_id: "${servicer_id}"
            - call: "POST /mortgage-insurance/loans/${loan_id}/cancellation-notices"
              payload: { request_kind: "SERVICER_LOSS_MITIGATION_FAILURE", requested_by_role: "SERVICER", notice_utc: "2026-01-20T00:00:00Z", evidence_cents: 0, applied_utc: "2026-02-20T00:00:00Z" }
              as: Servicer
              as_user_id: "${servicer_id}"
            - call: "POST /mortgage-insurance/_clock/set_current_utc"
              payload: { current_utc: "2026-03-25T00:00:00Z" }
              as: MasterPolicyAdmin
            - call: "POST /mortgage-insurance/claims"
              payload: { loan_id: "${loan_id}", event_kind: "FORECLOSURE", event_completed_utc: "2026-03-01T00:00:00Z", unpaid_principal_cents: 8000000, accrued_interest_cents: 1500000, allowable_advances_cents: 5000000, gross_proceeds_cents: 7000000, expenses_of_sale_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /mortgage-insurance/claims/${claim_id}/begin-review"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /mortgage-insurance/claims/${claim_id}/approve"
              payload: {}
              as: Underwriter
              captures: { error: $.data.error_id }
          assert:
            - "Loan.${loan_id}.coverage_status == CANCELLED with cancellation_effective_utc 2026-02-20T00:00:00Z, which precedes the claim's 2026-03-01T00:00:00Z event instant"
            - "Loan.${loan_id}.claim_blocked == true"
            - "the response status is 409 and error_id == ERR_CLAIM_BLOCKED_LOSS_MITIGATION"
            - "the response error_id != ERR_COVERAGE_NOT_ACTIVE, so the priority-10 safety gate wins when the priority-16 temporal coverage check is also violated"

  # ===========================================================================
  # Rule 6 — boundary_precision_check
  # Two boundaries on DIFFERENT metrics, each reachable through a DISTINCT
  # endpoint.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: lender_exposure_cap_is_strictly_exceeded_not_merely_reached
        grounds:
          - calculations.lender_exposure_reconciliation
          - validations[priority=11]
          - errors[ERR_LENDER_EXPOSURE_CAP_EXCEEDED]
          - endpoints.POST_/lenders/{id}/exposure-reconciliations
        distinguishing_aspect: "A numeric threshold crossing on the exposure metric reached through the reconciliation endpoint: a lender whose contribution exactly equals its cap reconciles successfully, while the same book one cent over is refused — the comparison is strictly greater, so equality is permitted and the boundary must be probed from both sides."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a delegated lender with a 2975000-cent exposure cap and a single delegated loan whose coverage base is 8500000 cents under the 0.35 exposure rate, giving a contribution of exactly 2975000 cents."
          setup_api_calls:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 2975000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "CAP-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_id: $.data.id }
            - call: "GET /mortgage-insurance/loans/${loan_id}"
              payload: {}
              as: Underwriter
              captures: { loan_v: $.data.version }
          trigger:
            - call: "POST /mortgage-insurance/lenders/${lender_id}/exposure-reconciliations"
              payload: { expected_loan_version: "${loan_v}", loan_id: "${loan_id}" }
              as: Underwriter
              captures: { contribution_cents: $.data.lender_contribution_cents, used_pct: $.data.used_pct, warn: $.data.warn }
          assert:
            - "the response status is 200, so a contribution exactly equal to the cap is permitted"
            - "the response lender_contribution_cents == 2975000"
            - "the response used_pct == 100.0000 and warn == true"
            - "submitting the same reconciliation with a fresh loan version and a loan whose contribution is one cent above a 2974999-cent cap returns 409 ERR_LENDER_EXPOSURE_CAP_EXCEEDED, so the one-cent difference flips the verdict"
            - "the response error_id is absent on the successful call, confirming the equality case took the success path"

      - name: empty_in_force_book_yields_null_concentration_without_error
        grounds:
          - calculations.portfolio_concentration
          - entities.PortfolioSnapshot.fields.lender_concentration_index
          - endpoints.POST_/portfolio-snapshots
          - response_envelope.success
        distinguishing_aspect: "An empty-collection boundary rather than a numeric threshold, on a different metric and a different endpoint: with no in-force loans the snapshot still returns 201 with a null lender concentration index and empty segment lists instead of dividing by zero or erroring."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a master policy, a rate card, a lender and a servicer exist but no loan has been issued, so the in-force book is empty."
          setup_api_calls:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
          trigger:
            - call: "POST /mortgage-insurance/portfolio-snapshots"
              payload: { snapshot_utc: "2026-09-01T00:00:00Z", cluster_in_force_threshold_cents: 17000000 }
              as: MasterPolicyAdmin
              captures: { snapshot_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "PortfolioSnapshot.${snapshot_id}.lender_concentration_index is null rather than 0 or an error"
            - "PortfolioSnapshot.${snapshot_id}.geography_totals == [] and PortfolioSnapshot.${snapshot_id}.segment_statuses == []"
            - "PortfolioSnapshot.${snapshot_id}.aggregate_ceded_cents == 0"
            - "PortfolioSnapshot.${snapshot_id}.status == COMPUTED"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency
  # Two dependencies crossing DIFFERENT entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: loan_cancellation_requires_eligibility_flag_written_by_reporting
        grounds:
          - state_machines.Loan.ACTIVE_to_PENDING_CANCELLATION
          - state_machines.DelinquencyReport.FILED_to_FILED
          - calculations.claim_eligibility_gate
          - errors[ERR_CANCELLATION_NOT_PERMITTED]
          - errors[ERR_SERVICER_NOT_DESIGNATED]
        distinguishing_aspect: "The Loan→DelinquencyReport pair: the Loan's valid transition to PENDING_CANCELLATION on a servicer loss-mitigation ground depends on a flag written by the delinquency-reporting domain, so two identical cancellation requests diverge purely on the state of a different entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; two delegated loans on the same master policy and servicer, each with a Class-A report for 2026-01 carrying only outreach and intake."
          setup_api_calls:
            - call: "POST /mortgage-insurance/master-policies"
              payload: { policy_number: "MP-1001", anniversary_utc: "2026-01-15T00:00:00Z", coverage_percent_default: 25, delegated_curtailment_rate: 0.12, nondelagated_curtailment_rate: 0.08, ltv_variance_tolerance: 0.05, servicer_loss_mitigation_standard: "PARTICIPATION_COMPLETE", rescission_relief_cycles: 2, min_third_party_net_bps: 1500, two_year_effective_flag: true, exposure_contribution_rate: 0.35 }
              as: MasterPolicyAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "831_TO_85", coverage_percent: 25, premium_plan: "BPM", rate_bps: 62, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Northline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "XENT-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_1_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "XENT-2", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_2_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_1_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/coverage-applications/${app_2_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_1_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_deficient_id: $.data.id }
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_2_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
              captures: { loan_clean_id: $.data.id }
            - call: "POST /mortgage-insurance/delinquency-reports"
              payload: { loan_id: "${loan_deficient_id}", servicer_id: "${servicer_id}", as_of_period: "2026-01", delinquency_class: "A", months_delinquent: 2, loss_mitigation_activities: [{ activity_kind: "OUTREACH_SENT", outcome: "COMPLETED", activity_utc: "2026-01-10T00:00:00Z" }] }
              as: Servicer
              as_user_id: "${servicer_id}"
            - call: "POST /mortgage-insurance/delinquency-reports"
              payload: { loan_id: "${loan_clean_id}", servicer_id: "${servicer_id}", as_of_period: "2026-01", delinquency_class: "A", months_delinquent: 2, loss_mitigation_activities: [{ activity_kind: "OUTREACH_SENT", outcome: "COMPLETED", activity_utc: "2026-01-10T00:00:00Z" }] }
              as: Servicer
              as_user_id: "${servicer_id}"
            - call: "POST /mortgage-insurance/loans/${loan_clean_id}/rescission-relief"
              payload: { relief_status: "REVOKED" }
              as: MasterPolicyAdmin
            - call: "POST /mortgage-insurance/servicers"
              payload: { servicer_name: "Redline Servicing", tier: "TIER_2", loss_mitigation_capability: "PARTICIPATION_COMPLETE" }
              as: MasterPolicyAdmin
              captures: { other_servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers/${other_servicer_id}/suspend"
              payload: {}
              as: MasterPolicyAdmin
          trigger:
            - call: "POST /mortgage-insurance/loans/${loan_deficient_id}/cancellation-notices"
              payload: { request_kind: "SERVICER_LOSS_MITIGATION_FAILURE", requested_by_role: "SERVICER", notice_utc: "2026-09-01T00:00:00Z", evidence_cents: 0, applied_utc: "2026-09-01T00:00:00Z" }
              as: Servicer
              as_user_id: "${servicer_id}"
            - call: "POST /mortgage-insurance/loans/${loan_clean_id}/cancellation-notices"
              payload: { request_kind: "SERVICER_LOSS_MITIGATION_FAILURE", requested_by_role: "SERVICER", notice_utc: "2026-09-01T00:00:00Z", evidence_cents: 0, applied_utc: "2026-09-01T00:00:00Z" }
              as: Servicer
              as_user_id: "${servicer_id}"
              captures: { error: $.data.error_id }
            - call: "POST /mortgage-insurance/delinquency-reports"
              payload: { loan_id: "${loan_deficient_id}", servicer_id: "${other_servicer_id}", as_of_period: "2026-04", delinquency_class: "A", months_delinquent: 5, loss_mitigation_activities: [] }
              as: Servicer
              as_user_id: "${other_servicer_id}"
              captures: { error_not_designated: $.data.error_id }
          assert:
            - "Loan.${loan_deficient_id}.claim_blocked == true and Loan.${loan_deficient_id}.coverage_status == PENDING_CANCELLATION"
            - "the second call returns 409 with error_id == ERR_CANCELLATION_NOT_PERMITTED"
            - "the delinquency call from the other servicer returns 409 with error_id == ERR_SERVICER_NOT_DESIGNATED, a first guard on the same Loan→servicer path"
            - "Loan.${loan_clean_id}.claim_blocked == false and Loan.${loan_clean_id}.coverage_status == ACTIVE"
            - "GET /mortgage-insurance/loans/${loan_clean_id}/cancellation-notices returns 0 rows, so the clean loan's own state was untouched"

      - name: rescission_decision_requires_relief_status_from_the_loan_domain
        grounds:
          - state_machines.Claim.DENIED_to_RESCINDED
          - state_machines.Claim.SETTLED_to_RESCINDED
          - calculations.rescission_relief_eligibility
          - errors[ERR_RESCISSION_BARRED_RELIEF_ATTACHED]
        distinguishing_aspect: "The Claim→Loan pair, distinct from the Loan→DelinquencyReport pair: whether a Claim may be driven into RESCINDED depends on the Loan's rescission-relief status, so an identical dispute decision over two identically filed claims diverges purely on the loan each claim belongs to."
