scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc (two entity domains: pricing vs commission)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quoted_vs_frozen_price_when_lane_rate_changes
        grounds:
          - calculations.quote_rated_price
          - state_machines.Reservation.QUOTED_to_CONFIRMED
          - state_machines.LaneRate.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Same reservation inputs produce different total_quoted_cents when the
          ACTIVE LaneRate for the lane is replaced between quote and confirm:
          the quoted_variant uses the rate active at creation, the frozen_variant
          recomputes at confirm — the two variants on the Pricing domain diverge.
        test_recipe:
          setup:
            - "Location A (geo NORTH) and Location B (geo SOUTH), both OPEN"
            - "Dealer DA ACTIVE at A"
            - "EquipmentUnit U1 TRUCK_10FT AVAILABLE at DA"
            - "LaneRate R1 ACTIVE: A->B TRUCK_10FT OFF_PEAK base 5000, surcharge 0, commission 0.10, imbalance_factor 1.0 (initial, <= threshold)"
            - "Customer C1 with verified license, vehicle profile (hitch irrelevant — truck)"
            - "Reservation RSV created for pickup 2026-11-10 (OFF_PEAK), 2-day rental, ONE_WAY A->B; quoted rate snapshot uses R1: daily 5000, total_quoted_cents 10000"
            - "LaneRate R2 created DRAFT with base 8000 for the same lane key, then activated (R1 -> SUPERSEDED)"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-01", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-01", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-ALPHA", name: "Alpha Dealer", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_a: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-1001", equipment_type: "TRUCK_10FT", dealer_id: "${dealer_a}" }
              as: NetworkAdmin
              captures: { unit_1: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh_1: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "c1@x.com", full_name: "Cust One", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_1: $.data.id }
            - call: "POST /rental-network/customers/${cust_1}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_1}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-12T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_1}"
              captures: { rsv_1: $.data.id, rsv_1_v: $.data.version, quoted_total: $.data.price_snapshot.total_quoted_cents }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 8000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_2: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_2}/activate"
              payload: {}
              as: PricingManager
          trigger:
            - call: "POST /rental-network/reservations/${rsv_1}/confirm"
              payload: { expected_reservation_version: "${rsv_1_v}" }
              as: Customer
              as_user_id: "${cust_1}"
          assert:
            - "Reservation.${rsv_1}.status == CONFIRMED"
            - "Reservation.${rsv_1}.price_snapshot.quoted_rate_cents_per_day == 8000"
            - "Reservation.${rsv_1}.price_snapshot.total_quoted_cents == 16000"
            - "the quoted snapshot captured at creation (${quoted_total}) == 10000 and differs from the frozen 16000"
            - "LaneRate.${rate_1}.status == SUPERSEDED"

      - name: commission_override_vs_lane_rate_variant
        grounds:
          - calculations.dealer_settlement
          - entities.Dealer.fields.commission_rate_override
        distinguishing_aspect: |
          On the Commission domain (different from pricing): a dealer with
          commission_rate_override set settles at the flat override rate, while
          an identical dealer without override settles per-lane — identical
          settlement scope yields different commission_cents between variants.
        test_recipe:
          setup:
            - "Locations A (NORTH), B (SOUTH), OPEN; Dealers DA at A (override 0.20), DB at A (no override)"
            - "LaneRate ACTIVE A->B TRUCK_10FT OFF_PEAK base 5000 surcharge 0 commission 0.10"
            - "Two customers, each completing a 2-day one-way A->B rental at 10000 settled total: one checked out by DA, one by DB"
            - "Both agreements SETTLED within 2026-Q4 (returns between 2026-10-01 and 2027-01-01)"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-02", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-02", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-OVR", name: "Override Dealer", location_id: "${loc_a}", commission_rate_override: 0.20 }
              as: NetworkAdmin
              captures: { dealer_ovr: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-LANE", name: "Lane Dealer", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_lane: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-2001", equipment_type: "TRUCK_10FT", dealer_id: "${dealer_ovr}" }
              as: NetworkAdmin
              captures: { unit_ovr: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-2002", equipment_type: "TRUCK_10FT", dealer_id: "${dealer_lane}" }
              as: NetworkAdmin
              captures: { unit_lane: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh_1: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "ca@x.com", full_name: "Cust A", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_a: $.data.id }
            - call: "POST /rental-network/customers/${cust_a}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_ovr}"
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_a}", origin_dealer_id: "${dealer_ovr}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-12T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { rsv_a: $.data.id, rsv_a_v: $.data.version }
            - call: "POST /rental-network/reservations/${rsv_a}/confirm"
              payload: { expected_reservation_version: "${rsv_a_v}" }
              as: Customer
              as_user_id: "${cust_a}"
            - call: "POST /rental-network/rental-agreements"
              payload: { reservation_id: "${rsv_a}", equipment_unit_id: "${unit_ovr}", return_location_id: "${loc_b}" }
              as: DealerAgent
              as_user_id: "${dealer_ovr}"
              captures: { agr_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T10:00:00Z" }
              as: NetworkAdmin
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-DEST", name: "Dest Dealer", location_id: "${loc_b}" }
              as: NetworkAdmin
              captures: { dealer_b: $.data.id }
            - call: "POST /rental-network/rental-agreements/${agr_a}/return"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_b}"
              captures: { agr_a_ret_v: $.data.version }
            - call: "POST /rental-network/rental-agreements/${agr_a}/settle"
              payload: { expected_agreement_version: "${agr_a_ret_v}" }
              as: DealerAgent
              as_user_id: "${dealer_b}"
            - call: "POST /rental-network/customers"
              payload: { email: "cb2@x.com", full_name: "Cust B", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_b: $.data.id }
            - call: "POST /rental-network/customers/${cust_b}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_lane}"
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_b}", origin_dealer_id: "${dealer_lane}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-13T10:00:00Z", dropoff_date: "2026-11-15T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_b}"
              captures: { rsv_b: $.data.id, rsv_b_v: $.data.version }
            - call: "POST /rental-network/reservations/${rsv_b}/confirm"
              payload: { expected_reservation_version: "${rsv_b_v}" }
              as: Customer
              as_user_id: "${cust_b}"
            - call: "POST /rental-network/rental-agreements"
              payload: { reservation_id: "${rsv_b}", equipment_unit_id: "${unit_lane}", return_location_id: "${loc_b}" }
              as: DealerAgent
              as_user_id: "${dealer_lane}"
              captures: { agr_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T10:00:00Z" }
              as: NetworkAdmin
            - call: "POST /rental-network/rental-agreements/${agr_b}/return"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_b}"
              captures: { agr_b_ret_v: $.data.version }
            - call: "POST /rental-network/rental-agreements/${agr_b}/settle"
              payload: { expected_agreement_version: "${agr_b_ret_v}" }
              as: DealerAgent
              as_user_id: "${dealer_b}"
          trigger:
            - call: "POST /rental-network/dealer-settlements"
              payload: { dealer_id: "${dealer_ovr}", period: "2026-Q4" }
              as: FinanceReviewer
              captures: { sett_ovr: $.data.id }
            - call: "POST /rental-network/dealer-settlements"
              payload: { dealer_id: "${dealer_lane}", period: "2026-Q4" }
              as: FinanceReviewer
              captures: { sett_lane: $.data.id }
          assert:
            - "DealerSettlement.${sett_ovr}.gross_rental_cents == 10000"
            - "DealerSettlement.${sett_ovr}.commission_cents == 2000 (flat 0.20 override)"
            - "DealerSettlement.${sett_lane}.gross_rental_cents == 10000"
            - "DealerSettlement.${sett_lane}.commission_cents == 1000 (lane rate 0.10)"
            - "override variant commission (2000) != lane variant commission (1000) on equal gross_rental_cents"
            - "DealerSettlement.${sett_ovr}.clawback_cents == 200 (performance_score 0 < floor 60)"
            - "DealerSettlement.${sett_ovr}.net_cents == 1800"
            - "DealerSettlement.${sett_lane}.clawback_cents == 100"
            - "DealerSettlement.${sett_lane}.net_cents == 900"

  # =====================================================================
  # Rule 2 — combinatorial_formula (modes (b) and (c))
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_then_sum_vs_sum_then_round
        grounds:
          - calculations.cross_sell_bundle
          - calculations.dealer_settlement
        distinguishing_aspect: |
          Mode (b) nested rounding: cross_sell_bundle rounds each supply line
          (catalog_price * qty) to cents BEFORE summing, and dealer_settlement
          rounds each agreement's commission before summing — the pinned order
          yields totals that differ from sum-then-round; the test pins inputs
          where the two orders disagree by at least 1 cent.
        test_recipe:
          setup:
            - "Location A (NORTH, storage_capacity 100), Dealer DA ACTIVE at A"
            - "Cross-sell order with lines chosen so per-line rounding matters: 3 x BOX_SMALL (125c, exact) plus 1 x LOCK (1299c) with 7 storage months at NORTH rate 8900"
            - "Bundle discount applies (supplies > 0 and storage_months > 0): 10% of supplies subtotal, round_half_up"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-03", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 100 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-CS", name: "CrossSell Dealer", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_a: $.data.id }
          trigger:
            - call: "POST /rental-network/cross-sell-orders"
              payload: { dealer_id: "${dealer_a}", line_items: [ { sku: "BOX_SMALL", qty: 3 }, { sku: "LOCK", qty: 1 } ], storage_months: 7 }
              as: DealerAgent
              as_user_id: "${dealer_a}"
              captures: { order_1: $.data.id }
          assert:
            - "CrossSellOrder.${order_1}.supplies_subtotal_cents == 1674"
            - "CrossSellOrder.${order_1}.storage_charge_cents == 62300"
            - "CrossSellOrder.${order_1}.bundle_discount_cents == 167"
            - "CrossSellOrder.${order_1}.total_cents == 63807"

      - name: settlement_evaluation_order_circular_dependency
        grounds:
          - calculations.calculate_settlement
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: late_fee_cents derives from the
          frozen daily rate, which is also a component of base_cents, while
          damage_charge_cents depends on claim approvals that bump agreement
          state before total_settled_cents freezes — the pinned evaluation
          order (rate -> late per-day rounded -> sum) makes the total
          well-defined; reversing the late-fee rounding order yields different
          cents.
        test_recipe:
          setup:
            - "Locations A (NORTH), B (SOUTH); Dealers DA at A, DB at B; ACTIVE lane rate A->B TRUCK_10FT OFF_PEAK base 3333c (odd price so 1.5x rounding matters)"
            - "Customer with verified license; reservation quoted 2 days at 3333/day; confirmed; pickup on logical clock 2026-11-10T10:00Z"
            - "Logical clock advanced to 2026-11-13T11:00Z so actual_days = 4 (ceil(73h/24h) = 4) — 2 late days"
            - "Agreement returned then settled"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-04", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-04", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-A4", name: "Dealer A4", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_a: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-B4", name: "Dealer B4", location_id: "${loc_b}" }
              as: NetworkAdmin
              captures: { dealer_b: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-4001", equipment_type: "TRUCK_10FT", dealer_id: "${dealer_a}" }
              as: NetworkAdmin
              captures: { unit_1: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 3333, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh_1: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "c4@x.com", full_name: "Cust Four", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_1: $.data.id }
            - call: "POST /rental-network/customers/${cust_1}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T09:00:00Z" }
              as: NetworkAdmin
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_1}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-12T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_1}"
              captures: { rsv_1: $.data.id, rsv_1_v: $.data.version }
            - call: "POST /rental-network/reservations/${rsv_1}/confirm"
              payload: { expected_reservation_version: "${rsv_1_v}" }
              as: Customer
              as_user_id: "${cust_1}"
            - call: "POST /rental-network/rental-agreements"
              payload: { reservation_id: "${rsv_1}", equipment_unit_id: "${unit_1}", return_location_id: "${loc_b}" }
              as: DealerAgent
              as_user_id: "${dealer_a}"
              captures: { agr_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-13T11:00:00Z" }
              as: NetworkAdmin
            - call: "POST /rental-network/rental-agreements/${agr_1}/return"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_b}"
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /rental-network/rental-agreements/${agr_1}/settle"
              payload: { expected_agreement_version: "${agr_v}" }
              as: DealerAgent
              as_user_id: "${dealer_b}"
          assert:
            - "RentalAgreement.${agr_1}.actual_days == 4"
            - "RentalAgreement.${agr_1}.late_fee_cents == 10000  (2 late days * round_half_up(3333 * 1.5) = 2 * 5000)"
            - "RentalAgreement.${agr_1}.total_settled_cents == 23332  (base 4 * 3333 = 13332, + late 10000, + damage 0)"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (cycle on DamageClaim, cycle on Reservation)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: damage_claim_deny_reopen_approve_cycle
        grounds:
          - state_machines.DamageClaim.FILED_to_DENIED
          - state_machines.DamageClaim.DENIED_to_FILED
          - state_machines.DamageClaim.FILED_to_APPROVED
        distinguishing_aspect: |
          DamageClaim is cyclic: FILED -> DENIED -> FILED -> APPROVED loops
          while the agreement is unsettled; each deny/reopen round preserves
          the claim identity and only the terminal APPROVED amount feeds the
          agreement's damage_charge_cents.
        test_recipe:
          setup:
            - "Locations A/B OPEN, dealers DA at A and DB at B, ACTIVE rate, unit available"
            - "Customer completes a rental: reservation confirmed, agreement created, returned (agreement RETURNED, not SETTLED)"
            - "DamageProtectionPlan STANDARD (cap 750000c) sold on the agreement"
            - "Claim CL1 filed for 500000c by a DealerAgent of DA (filer_user_id recorded)"
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-05", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "TUS-05", city: "Tucson", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-A5", name: "Dealer A5", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dealer_a: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-B5", name: "Dealer B5", location_id: "${loc_b}" }
              as: NetworkAdmin
              captures: { dealer_b: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-5001", equipment_type: "TRUCK_10FT", dealer_id: "${dealer_a}" }
              as: NetworkAdmin
              captures: { unit_1: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh_1: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "c5@x.com", full_name: "Cust Five", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_1: $.data.id }
            - call: "POST /rental-network/customers/${cust_1}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
