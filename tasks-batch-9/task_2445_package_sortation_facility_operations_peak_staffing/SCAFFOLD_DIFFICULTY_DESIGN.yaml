              payload: { sort_center_id: "${center_id}", exception_type: "MISSORT", package_count: 40, from_destination_lane_id: "${lane1_id}" }
              as: SortSupervisor
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /sortation/package-exceptions/${exc_id}/resolve"
              payload: { resolution: "REROUTE", to_destination_lane_id: "${lane2_id}" }
              as: SortSupervisor
          assert:
            - "before the trigger the identity holds: packages_inducted_count 3000 == wip 600 + exception_hold 40 + disposed 0 + (L-WEST 2360 + L-EAST 0)"
            - "after the trigger the identity still holds: 3000 == wip 600 + exception_hold 0 + disposed 0 + (L-WEST 2360 + L-EAST 40)"
            - "SortCenter.${center_id}.missort_corrected_count == 40 and disposed_package_count == 0"
            - "PackageException.${exc_id}.status == RESOLVED with resolved_via_chute_id == ${chute1_id} and resolved_at == 2026-08-03T06:00:00Z"
            - "OutboundLoad.${load_id}.package_count stays 2400 and cube_used_cuft stays 804.00 (the reroute does not un-load the trailer)"
            - "no counter goes negative at any point and packages_inducted_count is never decremented"

      - name: flex_pool_conservation_across_approve_and_close
        grounds:
          - calculations.flex_pool_conservation_invariant
          - state_machines.ShiftPlan.SUBMITTED_to_APPROVED
          - state_machines.ShiftPlan.APPROVED_to_CLOSED
          - entities.SortCenter.fields.flex_pool_reserved
        distinguishing_aspect: |
          A different conserved quantity from packages: flex headcount capacity. flex_pool_total is
          immutable and always equals available + reserved, and reserved always equals the sum of
          flex_draw_count over APPROVED and AT_RISK plans; approve is the forward reservation and close
          is its exact compensation, releasing the same 3 heads it drew.
        test_recipe:
          setup:
            - "Center SC1 (automation 70, flex_pool_total 20) with one chute C1"
            - "ShiftPlan 2026-08-03 06:00-14:00, forecast_volume 4000, planned_core_headcount 0, planned_seasonal_headcount 1, labor_budget_cents 100000, submitted by u_planner_1 (required_headcount 4, so flex_needed 3)"
            - "No staff assignments are ever created, so the close settles with actual_labor_cents 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 0, planned_seasonal_headcount: 1, labor_budget_cents: 100000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_approve: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v_approve}" }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_close: $.data.version }
          trigger:
            - call: "POST /sortation/shift-plans/${plan_id}/close"
              payload: { expected_center_version: "${center_v_close}" }
              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "after the approve SortCenter.${center_id}.flex_pool_available == 17 and flex_pool_reserved == 3, with 20 == 17 + 3 and reserved equal to ShiftPlan.flex_draw_count 3"
            - "after the trigger SortCenter.${center_id}.flex_pool_available == 20 and flex_pool_reserved == 0, with 20 == 20 + 0"
            - "SortCenter.${center_id}.flex_pool_total == 20 before and after (it is never written after create)"
            - "ShiftPlan.${plan_id}.status == CLOSED and flex_draw_count is still 3 (the historical draw is retained; only the reservation is released)"
            - "reserved 0 equals the sum of flex_draw_count over the center's plans with status IN {APPROVED, AT_RISK}, which is now the empty set"
            - "ShiftPlan.${plan_id}.actual_labor_cents == 0 and final_cost_per_package_cents == 12000.00 (numerator 12000 over the max(1, 0 - 0) denominator)"
            - "the OCC version captured after the approve is required: the approve itself incremented SortCenter.version, so replaying ${center_v_approve} at close would return ERR_STALE_CENTER_VERSION"

      - name: jam_resume_restores_lane_backlog_and_capacity_exactly
        grounds:
          - state_machines.TrailerAppointment.JAM_HELD_to_UNLOADING
          - calculations.lane_pressure
          - entities.DestinationLane.fields.backlog_package_count
          - entities.TrailerAppointment.fields.jam_count
        distinguishing_aspect: |
          A third conserved quantity: lane backlog and assigned capacity. resume-unload is the declared
          compensating transition for jam-hold and must restore backlog_package_count, assigned_capacity_pph
          and lane_pressure_ratio to their exact pre-jam values (and the center's posture with them), while
          deliberately NOT compensating the jam_count retry counter - the one field that must drift.
        test_recipe:
          setup:
            - "Center SC1 (automation 70, posture OPEN) with inbound door IN-1, chute C1 (1200 pph) and lane L-WEST (forecast_hourly_volume 3000) assigned to C1 for 06:00-14:00"
            - "Appointment T-IN-1 (manifest 3000) in status UNLOADING, then jam-held on C1, so the lane is at backlog 3000 / capacity 0 / pressure 3000.0000 and the center is RESTRICTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id, chute_v1: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane1_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v1}" }
              as: SortSupervisor
              captures: { ca1_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-IN-1", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 3000 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/jam-hold"
              payload: { chute_id: "${chute1_id}", jam_reason: "PRIMARY_BELT_JAM" }
              as: InboundCoordinator
          trigger:
            - call: "POST /sortation/trailer-appointments/${appt_id}/resume-unload"
              payload: { chute_id: "${chute1_id}" }
              as: InboundCoordinator
          assert:
            - "before the trigger DestinationLane.${lane1_id}.backlog_package_count == 3000, assigned_capacity_pph == 0, lane_pressure_ratio == 3000.0000 and SortCenter.${center_id}.ops_posture == RESTRICTED"
            - "after the trigger DestinationLane.${lane1_id}.backlog_package_count == 0, assigned_capacity_pph == 1200 and lane_pressure_ratio == 0.0000 - exactly the pre-jam values"
            - "after the trigger SortChute.${chute1_id}.status == ACTIVE, ChuteAssignment.${ca1_id}.status == ACTIVE with suspended_reason == null"
            - "after the trigger SortCenter.${center_id}.open_jam_count == 0 and ops_posture == OPEN again"
            - "the deliberate non-compensation: TrailerAppointment.${appt_id}.jam_count stays 1 and SortChute.${chute1_id}.jam_hold_count stays 1 after the resume"
            - "the backlog floor holds: a second resume-unload would be refused by ERR_INVALID_APPOINTMENT_STATE, so backlog_package_count can never be driven below 0 by repeated compensation"
