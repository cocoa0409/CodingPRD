        excluded_because:
          difficulty_instance: combinatorial_formula / statement_employer_share_rounds_per_redemption_before_summing
          rationale: "That §1.8 instance proves the statement total equals the sum of the per-line rounded shares (404) rather than the rounding of the summed commission (403), which is the reconciliation claim for this variant pair."

  - section: validations
    instances:
      - name: offer_creation_rejects_a_degenerate_window_a_mismatched_discount_shape_and_an_uncovered_region
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - validations[priority=37]
          - validations[priority=38]
          - errors[ERR_INVALID_WINDOW]
          - errors[ERR_DISCOUNT_SHAPE_MISMATCH]
          - errors[ERR_REGION_NOT_COVERED]
          - endpoints[POST /perks/offers]
        distinguishing_aspect: |
          Three separate malformed offers each land on their own rule and code - equal window
          bounds give ERR_INVALID_WINDOW (36), a PERCENT offer carrying discount_value_cents
          gives ERR_DISCOUNT_SHAPE_MISMATCH (37), and region_codes ["TX"] on a CA-only merchant
          gives ERR_REGION_NOT_COVERED (38) - while the well-formed offer is created in DRAFT.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno is ACTIVE with region_codes [CA] and one ACTIVE DINING/CA agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
              payload: { merchant_id: "${merchant_id}", category: "DINING", region_code: "CA" }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { agreement_id: $.data.id, agreement_v0: $.data.version }
            - call: "POST /perks/agreements/${agreement_id}/propose"
              payload: { expected_agreement_version: "${agreement_v0}", commission_rate_bps: 1200, placement_fee_base_cents: 36000, employer_revenue_share_bps: 2500 }
              as: PartnerManager
              as_user_id: "pm-001"
            - call: "POST /perks/agreements/${agreement_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Merchant
              as_user_id: "${merchant_id}"
            - call: "POST /perks/agreements/${agreement_id}/activate"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-001"
          trigger:
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "Zero length window", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { e_window: $.data.error_id }
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "Percent with a cents value", discount_type: "PERCENT", discount_value_cents: 800, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { e_shape: $.data.error_id }
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "Texas only deal", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["TX"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { e_region: $.data.error_id }
            - call: "POST /perks/offers"
              payload: { agreement_id: "${agreement_id}", title: "20 percent off dinner", discount_type: "PERCENT", discount_value_bps: 2000, min_spend_cents: 1000, region_codes: ["CA"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${merchant_id}"
              captures: { good_status: $.data.status, good_category: $.data.category }
          assert:
            - "${e_window} == ERR_INVALID_WINDOW with HTTP 422: window_end <= window_start covers the equal case"
            - "${e_shape} == ERR_DISCOUNT_SHAPE_MISMATCH with HTTP 422"
            - "${e_region} == ERR_REGION_NOT_COVERED with HTTP 422: Offer.region_codes must be a subset of Merchant.region_codes"
            - "${good_status} == DRAFT and ${good_category} == DINING"
            - "GET /perks/offers filtered by agreement_id ${agreement_id} returns meta.total_count == 1: none of the three refusals created a row"

      - name: eligibility_batch_rejects_duplicate_refs_and_listing_rejects_out_of_range_pagination
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - validations[priority=34]
          - errors[ERR_DUPLICATE_EMPLOYEE_REF]
          - errors[ERR_INVALID_PAGINATION]
          - endpoints[GET /perks/memberships]
          - response_envelope.pagination
        distinguishing_aspect: |
          A batch whose records repeat external_employee_ref E-001 is refused with
          ERR_DUPLICATE_EMPLOYEE_REF before any membership is written, and the membership listing
          refuses limit 0, limit 101 and offset -1 with ERR_INVALID_PAGINATION while limit 100
          with offset 0 is accepted.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; employer Northwind Co exists and is branded, with no eligibility file applied yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 2, revenue_share_enabled: false, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id }
            - call: "POST /perks/employers/${employer_id}/storefront"
              payload: { brand_color_hex: "#1155CC", logo_url: "https://cdn.example/nw.png", hero_headline: "Your Northwind perks", featured_categories: ["DINING"] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { employer_v1: $.data.version }
          trigger:
            - call: "POST /perks/employers/${employer_id}/eligibility-files"
              payload: { expected_employer_version: "${employer_v1}", effective_from: "2026-08-01T00:00:00Z", checksum: "sha-dupref-1", records: [{ external_employee_ref: "E-001", employment_status: "ACTIVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }, { external_employee_ref: "E-001", employment_status: "LEAVE", region_code: "CA", eligibility_valid_from: "2026-07-01T00:00:00Z", eligibility_valid_until: "2027-07-01T00:00:00Z" }] }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_dup: $.data.error_id }
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_id}", limit: 0 }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_limit_low: $.data.error_id }
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_id}", limit: 101 }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_limit_high: $.data.error_id }
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_id}", offset: -1 }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_offset: $.data.error_id }
            - call: "GET /perks/memberships"
              payload: { employer_id: "${employer_id}", limit: 100, offset: 0 }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
            - call: "GET /perks/employers/${employer_id}"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { integ_untouched: $.data.integration_status, version_untouched: $.data.version }
          assert:
            - "${e_dup} == ERR_DUPLICATE_EMPLOYEE_REF with HTTP 422"
            - "${e_limit_low} == ERR_INVALID_PAGINATION, ${e_limit_high} == ERR_INVALID_PAGINATION and ${e_offset} == ERR_INVALID_PAGINATION, all HTTP 422"
            - "the limit 100 / offset 0 read returns HTTP 200 with meta.limit == 100, meta.offset == 0, meta.total_count == 0 and meta.has_more == false"
            - "${integ_untouched} == NOT_CONFIGURED and ${version_untouched} == ${employer_v1}: the refused batch neither created a file nor bumped the employer"

      - name: second_agreement_in_the_same_lane_is_rejected_while_the_first_is_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=54]
          - errors[ERR_DUPLICATE_AGREEMENT]
          - endpoints[POST /perks/agreements]
        distinguishing_aspect: |
          With one DRAFT DINING/CA agreement already on the merchant, a second agreement for the
          same (merchant_id, DINING, CA) is refused with ERR_DUPLICATE_AGREEMENT, yet the same
          merchant may open a DINING/TX agreement because the lane key includes region_code.
        test_recipe:
          setup:
