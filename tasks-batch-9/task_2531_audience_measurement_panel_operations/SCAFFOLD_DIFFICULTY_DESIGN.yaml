              as: MethodologyStatistician
              captures: { rs5_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs5_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /markets/${m5_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m5_v_before_universe: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${m5_id}", vintage_label: "2026Q3", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${cell_f_id}", population_households: 120000, population_persons: 300000 }], expected_market_version: "${m5_v_before_universe}" }
              as: MethodologyStatistician
              captures: { ue5_id: "$.data.id" }
            - call: "POST /universe-estimates/${ue5_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /households"
              payload: { market_id: "${m5_id}", quota_cell_id: "${cell_f_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { he1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${he1_id}", meter_type: "TV_TUNER", serial_no: "MT-000401" }
              as: FieldTechnician
              captures: { mte1_id: "$.data.id" }
            - call: "POST /meters/${mte1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
              captures: { mte1_install_status: "$.data.install_status" }
            - call: "POST /households/${he1_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: MethodologyStatistician
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mte1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T18:00:00Z", end_iso: "2026-08-10T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
              as: MethodologyStatistician
            - call: "GET /markets/${m5_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m5_v_before_run: "$.data.version" }
            - call: "POST /processing-runs"
              payload: { market_id: "${m5_id}", universe_estimate_id: "${ue5_id}", edit_rule_set_id: "${rs5_id}", window_start_iso: "2026-08-10T00:00:00Z", window_end_iso: "2026-08-11T00:00:00Z", expected_market_version: "${m5_v_before_run}" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-5"
              captures: { rune_id: "$.data.id" }
          trigger:
