      - name: metric_breach_resteer_chain
        grounds:
          - state_machines.CdnVendor.ACTIVE_to_DEGRADED
          - state_machines.RoutingPolicy.ACTIVE_to_ACTIVE
          - calculations.vendor_health_score
          - calculations.routing_vendor_selection
          - calculations.egress_cost_projection
        distinguishing_aspect: |
          A single metric ingest cascades four hops across a disjoint entity set: the window's
          breach_flag, then the vendor's health and ACTIVE -> DEGRADED transition, then the automatic
          resteer of the policy that named it primary, then that policy's projected_egress_cost_usd
          recomputed against the NEW primary's cost_per_gb_usd (27.00 becomes 81.00).
        test_recipe:
          setup:
            - "One SMART_TV_4K device profile with quality_normalization_factor 1.00."
            - "Three ACTIVE vendors created in order ALPHA (US, 0.0250/GB), BRAVO (US, 0.0300/GB) and CHARLIE (US and CA, 0.0400/GB), all seeded at health 100.00."
            - "Title TTL-STEER-01 (MOVIE) holds one COST-mode routing policy for US, which the selector filled with primary ALPHA and backup BRAVO and priced at 27.00 from the 1000.00 GB no-metrics default."
            - "The logical clock is at its 2026-08-01T00:00:00Z default; the metric window to be ingested ends 2026-07-26T00:00:00Z."
