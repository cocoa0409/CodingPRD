            - call: "POST /challenge-course/program-blocks/${blk1_id}/complete"
              payload: {}
              as: Facilitator
              as_user_id: "${f1_id}"
            - call: "POST /challenge-course/program-blocks/${blk2_id}/start"
              payload: {}
              as: Facilitator
              as_user_id: "${f1_id}"
