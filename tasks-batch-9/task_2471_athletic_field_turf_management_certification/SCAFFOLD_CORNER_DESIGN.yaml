              payload: { outcome: "PLAYED", actual_duration_hours: 2.0, actual_participant_count: 30, weather_condition: "DRY" }
              as: FieldOperationsCoordinator
              as_user_id: ${s_coord}
          trigger:
            - call: "POST /turf/usage-bookings/${b_ng}/close-out"
