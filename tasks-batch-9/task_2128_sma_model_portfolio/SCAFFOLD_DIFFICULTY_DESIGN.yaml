              as: PortfolioManager
            - call: "POST /sma/model-versions/${mv1}/submit"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
            - call: "POST /sma/model-versions/${mv1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /sma/model-versions/${mv1}/publish"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-1"
              captures: { mv1_v: "$.data.version" }
            - call: "POST /sma/sponsor-distributions"
              payload: { sponsor_id: "${sp1}", model_version_id: "${mv1}", effective_from: "2026-01-01T00:00:00Z", effective_until: "2026-06-01T00:00:00Z", expected_model_version_version: "${mv1_v}" }
              as: PortfolioManager
              captures: { d1: "$.data.id" }
            - call: "GET /sma/model-versions/${mv1}"
              payload: {}
              as: PortfolioManager
              captures: { mv1_v2: "$.data.version" }
          trigger:
            - call: "POST /sma/sponsor-distributions"
              payload: { sponsor_id: "${sp1}", model_version_id: "${mv1}", effective_from: "2026-05-01T00:00:00Z", expected_model_version_version: "${mv1_v2}" }
              as: PortfolioManager
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /sma/sponsor-distributions"
              payload: { sponsor_id: "${sp1}", model_version_id: "${mv1}", effective_from: "2026-06-01T00:00:00Z", expected_model_version_version: "${mv1_v2}" }
              as: PortfolioManager
              captures: { d3: "$.data.id" }
          assert:
            - "The 2026-05-01 window returns HTTP 409 with error_id ERR_DISTRIBUTION_WINDOW_OVERLAP"
            - "The 2026-06-01 window returns HTTP 201 because the interval is half-open and touching endpoints do not collide"
            - "SponsorDistribution.${d3}.effective_from == 2026-06-01T00:00:00.000Z and effective_until == null"
            - "GET /sma/sponsor-distributions?sponsor_id=${sp1}&model_id=${m1} returns exactly 2 rows"

