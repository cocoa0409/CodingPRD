              payload: { owner_id: "${owner_id}", name: "Pr23", state_code: "TX", address: "Ad23" }
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN"

