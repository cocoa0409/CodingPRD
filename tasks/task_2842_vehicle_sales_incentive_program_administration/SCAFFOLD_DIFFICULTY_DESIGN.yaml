      - name: empty_claim_set_yields_zero_per_unit_spend_and_zero_residual_impact
        grounds:
          - calculations.per_unit_incentive_spend
          - calculations.residual_value_impact
          - endpoints.GET_programs_id_spend_summary
          - entities.IncentiveProgram.fields.per_unit_spend_cents
          - entities.IncentiveProgram.fields.residual_impact_bps
