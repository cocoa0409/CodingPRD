    side_effects: ["Listing ACTIVE/BACK_ON_MARKET -> UNDER_CONTRACT", "Project STAGED -> DESTAGE_PENDING with destage_eligible true", "Lease ACTIVE/EXTENDED -> ENDING with the window re-derived", "a Pickup is auto-created in state SCHEDULED"]
