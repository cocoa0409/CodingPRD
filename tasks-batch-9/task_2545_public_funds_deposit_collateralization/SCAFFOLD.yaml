# =============================================================================
# PRD-Bench scaffold — Public Funds Deposit Collateralization (task 2545)
# Difficulty target: beyond Expert (§0.4) — 14 entities, 9 state machines,
# 8 calculation rules, 3 OCC races, dense cross-entity coupling.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2545. Public Funds Deposit Collateralization (bank public funds group): eligible depository qualification and state approval for public unit deposits, insured amount determination and required collateral percentage above coverage, eligible collateral types with haircuts and market value monitoring, custodian tri-party arrangements and pledge agreement documentation, daily or periodic mark-to-market with margin call and substitution rules, pooled collateral program participation versus dedicated pledging, public unit reporting, safekeeping receipts and audit confirmations, deposit runoff planning around tax collection and disbursement cycles

domain_name: public-funds-collateral
api_prefix: ""    # flat top-level collections: /depositories, /deposit-accounts, /collateral-assets, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation      # insured-amount basis, risk-grade basis, runoff basis
    - cascading_side_effects        # suspension cascade (depth 4), substitution-settle cascade (depth 4)
    - optimistic_concurrency        # OCC on PledgeAgreement.version, Depository.version, DepositAccount.version
    - ops_run_checkpoint           # POST /_ops/run-daily-cycle advances margin-call deadlines + price staleness

  entity_topology: graph
  # PledgeAllocation is a junction between CollateralAsset and PledgeAgreement; PledgeAgreement is
  # polymorphic over {DepositAccount, PooledCollateralProgram}; DepositAccount joins Depository x PublicUnit.
  # No entity is reachable by a single ownership tree — every aggregate is entered from two directions.

  state_machine_shape: cyclic
  # QualificationReview cycles ATTESTED -> UNDER_REVIEW -> RETURNED_FOR_INFO -> ATTESTED;
  # PledgeAgreement cycles PENDING_SIGNATURES -> AMENDMENT_REQUESTED -> PENDING_SIGNATURES;
  # MarginCall self-loops PARTIALLY_CURED -> PARTIALLY_CURED;
  # DepositAccount carries two independent dimensions (funding_status x collateral_status);
  # SubstitutionRequest is a fork-join (compliance branch x custodian branch -> READY_TO_SETTLE).

  relationship_patterns:
    - one_to_many          # Depository -> QualificationReview, Depository -> MarkToMarketRun
    - many_to_many         # CollateralAsset <-> PledgeAgreement via PledgeAllocation
    - polymorphic          # PledgeAgreement.beneficiary_type in {DEPOSIT_ACCOUNT, POOLED_PROGRAM}
    - cross_aggregate      # DepositAccount coverage depends on allocations owned by the Depository aggregate

  role_model: segregation_of_duties
  # The X-User-ID that submits a qualification package may not attest it; the X-User-ID that submits a
  # substitution request may not compliance-approve it. Custodian and PublicUnitTreasurer are
  # entity-backed and may only act on resources they own.

  consistency_model: immediate

# =============================================================================
# Table 0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:

  - name: PooledCollateralProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name (e.g. 'NE State Pooled Collateral Program')" }
      - { name: administrator_state, type: string, source: input, description: "Two-letter state code administering the pool" }
      - { name: minimum_pool_pct_bps, type: integer, source: input, default: 11000, description: "Statutory floor on pool collateral vs pooled requirement, in basis points", constraints: "10000 <= value <= 20000" }
      - { name: aggregate_required_collateral_cents, type: integer, source: computed, default: 0, description: "Sum of required_collateral_cents over participant DepositAccounts (see calculations.pooled_collateral_waterfall)" }
      - { name: aggregate_collateral_value_cents, type: integer, source: computed, default: 0, description: "Sum of allocated_collateral_value_cents over ACTIVE PledgeAllocations under EXECUTED pooled agreements of this pool" }
      - { name: unallocated_collateral_cents, type: integer, source: computed, default: 0, description: "Pool value left over after the waterfall; conserved-quantity residual" }
      - { name: participant_account_count, type: integer, source: computed, default: 0, description: "Count of DepositAccounts with pledging_mode=POOLED and funding_status IN {FUNDED, RESTRICTED} at member depositories" }
      - { name: pool_posture, type: enum, source: computed, default: ADEQUATE, description: "ADEQUATE | SHORTFALL — SHORTFALL when aggregate_collateral_value_cents * 10000 < aggregate_required_collateral_cents * minimum_pool_pct_bps", constraints: "ADEQUATE | SHORTFALL" }

  - name: Custodian
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Custodian institution name" }
      - { name: custodian_type, type: enum, source: input, description: "FEDERAL_RESERVE | FHLB | TRUST_BANK", constraints: "FEDERAL_RESERVE | FHLB | TRUST_BANK" }
      - { name: tri_party_capable, type: boolean, source: input, default: false, description: "True when the custodian can hold collateral under a tri-party pledge agreement" }
      - { name: concentration_limit_bps, type: integer, source: input, default: 6000, description: "Max share of one depository's total pledged collateral value this custodian may hold, in basis points", constraints: "1000 <= value <= 10000" }
      - { name: approval_status, type: enum, source: system, default: PENDING_APPROVAL, description: "PENDING_APPROVAL | APPROVED | REVOKED", constraints: "PENDING_APPROVAL | APPROVED | REVOKED" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock timestamp of state approval; null while PENDING_APPROVAL" }

  - name: PublicUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Public unit (government depositor) name" }
      - { name: unit_type, type: enum, source: input, description: "SCHOOL_DISTRICT | COUNTY | MUNICIPALITY | STATE_AGENCY — drives pool waterfall priority", constraints: "SCHOOL_DISTRICT | COUNTY | MUNICIPALITY | STATE_AGENCY" }
      - { name: jurisdiction_state, type: string, source: input, description: "Two-letter state code whose public-funds statute governs this unit" }
      - { name: collateral_program_preference, type: enum, source: input, default: DEDICATED, description: "DEDICATED | POOLED — the unit's declared pledging preference; DepositAccount.pledging_mode must match", constraints: "DEDICATED | POOLED" }
      - { name: statutory_max_deposit_cents, type: integer, source: input, description: "Statutory ceiling on this unit's aggregate ledger balance across all its DepositAccounts", constraints: "value > 0" }
      - { name: reporting_frequency, type: enum, source: input, default: MONTHLY, description: "DAILY | MONTHLY — cadence at which the unit expects coverage reports", constraints: "DAILY | MONTHLY" }
      - { name: total_deposit_balance_cents, type: integer, source: computed, default: 0, description: "Sum of ledger_balance_cents over this unit's DepositAccounts with funding_status IN {PENDING_FUNDING, FUNDED, RESTRICTED}" }
      - { name: total_uninsured_cents, type: integer, source: computed, default: 0, description: "Sum of uninsured_amount_cents over the same account set" }
      - { name: exposure_status, type: enum, source: computed, default: NORMAL, description: "NORMAL | WATCH | ESCALATED — ESCALATED when any account funding_status=RESTRICTED, else WATCH when any account collateral_status=DEFICIENT, else NORMAL", constraints: "NORMAL | WATCH | ESCALATED" }

  - name: Depository
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Bank legal name" }
      - { name: charter_type, type: enum, source: input, description: "STATE_CHARTERED | NATIONAL", constraints: "STATE_CHARTERED | NATIONAL" }
      - { name: home_state, type: string, source: input, description: "Two-letter state code of the bank's charter" }
      - { name: capital_ratio_bps, type: integer, source: input, default: 1200, description: "Total risk-based capital ratio in basis points (1200 = 12.00%)", constraints: "0 <= value <= 5000" }
      - { name: capital_tier, type: enum, source: computed, description: "WELL_CAPITALIZED (capital_ratio_bps >= 1000) | ADEQUATELY_CAPITALIZED (>= 800) | UNDERCAPITALIZED (< 800)", constraints: "WELL_CAPITALIZED | ADEQUATELY_CAPITALIZED | UNDERCAPITALIZED" }
      - { name: insurance_determination_basis, type: enum, source: input, default: AGGREGATED_BY_UNIT, description: "AGGREGATED_BY_UNIT | PER_ACCOUNT — selects the insured_amount_determination variant for every account at this depository", constraints: "AGGREGATED_BY_UNIT | PER_ACCOUNT" }
      - { name: pooled_program_id, type: string, source: input, description: "FK -> PooledCollateralProgram.id; nullable — null means this depository pledges only on a dedicated basis" }
      - { name: approval_status, type: enum, source: system, default: DRAFT, description: "DRAFT | UNDER_REVIEW | APPROVED | DENIED | SUSPENDED — state approval for holding public unit deposits", constraints: "DRAFT | UNDER_REVIEW | APPROVED | DENIED | SUSPENDED" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock timestamp when approval_status first became APPROVED" }
      - { name: approved_pledge_capacity_cents, type: integer, source: system, default: 0, description: "Pledge capacity granted by the APPROVED QualificationReview; ceiling on total pledged par" }
      - { name: consecutive_deficiency_runs, type: integer, source: system, default: 0, description: "Count of consecutive MarkToMarketRun rows with outcome=DEFICIENT; reset to 0 by a SUFFICIENT run" }
      - { name: open_margin_call_count, type: integer, source: computed, default: 0, description: "Count of this depository's MarginCalls with status IN {ISSUED, PARTIALLY_CURED, ESCALATED}" }
      - { name: collateral_posture, type: enum, source: computed, default: COMPLIANT, description: "COMPLIANT | MARGIN_DEFICIENT | FROZEN — FROZEN when consecutive_deficiency_runs >= 3; MARGIN_DEFICIENT when open_margin_call_count >= 1 and not FROZEN", constraints: "COMPLIANT | MARGIN_DEFICIENT | FROZEN" }
      - { name: total_required_collateral_cents, type: integer, source: computed, default: 0, description: "Sum of required_collateral_cents over this depository's accounts with funding_status IN {FUNDED, RESTRICTED}" }
      - { name: total_pledged_collateral_value_cents, type: integer, source: computed, default: 0, description: "Sum of allocated_collateral_value_cents over ACTIVE allocations under this depository's EXECUTED agreements with asset eligibility_status=ELIGIBLE" }
      - { name: total_pledged_par_cents, type: integer, source: computed, default: 0, description: "Sum of allocated_par_cents over this depository's ACTIVE PledgeAllocations whose half-open effective interval covers the current logical clock" }
      - { name: risk_score_bps, type: integer, source: computed, default: 0, description: "Weighted collateral-risk score in basis points, written by every MarkToMarketRun (see calculations.depository_risk_grade)" }
      - { name: risk_grade, type: enum, source: computed, default: A, description: "A (risk_score_bps >= 8500) | B (>= 7000) | C (>= 5000) | D (< 5000)", constraints: "A | B | C | D" }
      - { name: mtm_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by each MarkToMarketRun of this depository" }
      - { name: last_mtm_window_end, type: datetime, source: system, description: "window_end of the most recent MarkToMarketRun; null before the first run" }

  - name: QualificationReview
    parent: Depository
    common_fields: true
    fields:
      - { name: depository_id, type: string, source: system, description: "FK -> Depository.id; taken from the path, not the body" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the BankCollateralOfficer that opened the review" }
      - { name: attested_by_user_id, type: string, source: system, description: "X-User-ID of the BankComplianceOfficer that attested the current round; null until attested" }
      - { name: requested_pledge_capacity_cents, type: integer, source: input, description: "Pledge capacity the bank asks the state to authorize", constraints: "value > 0" }
      - { name: attestation_note, type: string, source: input, description: "Free-text attestation supplied on POST /qualification-reviews/{id}/attest" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | ATTESTED | UNDER_REVIEW | RETURNED_FOR_INFO | APPROVED | DENIED", constraints: "SUBMITTED | ATTESTED | UNDER_REVIEW | RETURNED_FOR_INFO | APPROVED | DENIED" }
      - { name: round_count, type: integer, source: system, default: 1, description: "Review round; incremented when a RETURNED_FOR_INFO review is re-attested. Capped by REVIEW_ROUND_LIMIT" }
      - { name: info_request_note, type: string, source: input, description: "Regulator note recorded on POST /qualification-reviews/{id}/return-for-info" }
      - { name: decision_note, type: string, source: input, description: "Regulator note recorded on POST /qualification-reviews/{id}/decide" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the APPROVED/DENIED decision" }

  - name: DepositAccount
    parent: null
    common_fields: true
    fields:
      - { name: depository_id, type: string, source: input, description: "FK -> Depository.id" }
      - { name: public_unit_id, type: string, source: input, description: "FK -> PublicUnit.id" }
      - { name: deposit_class, type: enum, source: input, description: "DEMAND | TIME_AND_SAVINGS — each class carries its own insurance coverage bucket", constraints: "DEMAND | TIME_AND_SAVINGS" }
      - { name: pledging_mode, type: enum, source: input, description: "DEDICATED | POOLED — must equal the owning PublicUnit.collateral_program_preference", constraints: "DEDICATED | POOLED" }
      - { name: group_sequence, type: integer, source: system, description: "Monotone counter starting at 1 within the (public_unit_id, depository_id, deposit_class) insurance group; pins the deterministic order of the insurance waterfall" }
      - { name: ledger_balance_cents, type: integer, source: system, default: 0, description: "Current deposit balance in cents; moved only by POST deposits / withdrawals" }
      - { name: insured_amount_cents, type: integer, source: computed, default: 0, description: "Portion covered by federal deposit insurance (see calculations.insured_amount_determination)" }
      - { name: uninsured_amount_cents, type: integer, source: computed, default: 0, description: "= ledger_balance_cents - insured_amount_cents" }
      - { name: required_collateral_pct_bps, type: integer, source: computed, default: 0, description: "Collateral percentage applied to the uninsured balance (see calculations.required_collateral_percentage)" }
      - { name: required_collateral_cents, type: integer, source: computed, default: 0, description: "= round_half_up(uninsured_amount_cents * required_collateral_pct_bps / 10000)" }
      - { name: assigned_collateral_value_cents, type: integer, source: computed, default: 0, description: "Haircut collateral value assigned to this account: dedicated allocation sum, or pooled waterfall share" }
      - { name: pooled_allocated_collateral_cents, type: integer, source: computed, default: 0, description: "Waterfall share received from the PooledCollateralProgram; always 0 when pledging_mode=DEDICATED" }
      - { name: coverage_ratio_bps, type: integer, source: computed, default: 10000, description: "= 10000 when required_collateral_cents == 0, else floor(assigned_collateral_value_cents * 10000 / required_collateral_cents)" }
      - { name: pool_priority_rank, type: integer, source: computed, default: 4, description: "Waterfall rank from PublicUnit.unit_type: SCHOOL_DISTRICT=1, COUNTY=2, MUNICIPALITY=3, STATE_AGENCY=4" }
      - { name: funding_status, type: enum, source: system, default: PENDING_FUNDING, description: "PENDING_FUNDING | FUNDED | RESTRICTED — dimension 1 of the parallel state machine", constraints: "PENDING_FUNDING | FUNDED | RESTRICTED" }
      - { name: collateral_status, type: enum, source: computed, default: UNSECURED, description: "UNSECURED | SECURED | DEFICIENT — dimension 2 of the parallel state machine", constraints: "UNSECURED | SECURED | DEFICIENT" }
      - { name: restricted_reason, type: string, source: system, description: "Reason recorded when funding_status became RESTRICTED (cascade from depository suspension)" }

  - name: PledgeAgreement
    parent: null
    common_fields: true
    fields:
      - { name: depository_id, type: string, source: input, description: "FK -> Depository.id" }
      - { name: custodian_id, type: string, source: input, description: "FK -> Custodian.id; the tri-party safekeeping agent" }
      - { name: beneficiary_type, type: enum, source: input, description: "DEPOSIT_ACCOUNT | POOLED_PROGRAM — polymorphic beneficiary discriminator", constraints: "DEPOSIT_ACCOUNT | POOLED_PROGRAM" }
      - { name: deposit_account_id, type: string, source: input, description: "FK -> DepositAccount.id; required when beneficiary_type=DEPOSIT_ACCOUNT, must be omitted otherwise" }
      - { name: pooled_program_id, type: string, source: input, description: "FK -> PooledCollateralProgram.id; required when beneficiary_type=POOLED_PROGRAM, must be omitted otherwise" }
      - { name: agreement_number, type: string, source: input, description: "Bank's document number; unique per depository_id" }
      - { name: governing_law_state, type: string, source: input, description: "Two-letter state code named in the pledge agreement" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_SIGNATURES | AMENDMENT_REQUESTED | EXECUTED | TERMINATED", constraints: "DRAFT | PENDING_SIGNATURES | AMENDMENT_REQUESTED | EXECUTED | TERMINATED" }
      - { name: depository_signed_at, type: datetime, source: system, description: "Logical-clock stamp of the DEPOSITORY party signature; cleared by request-amendment" }
      - { name: public_unit_signed_at, type: datetime, source: system, description: "Logical-clock stamp of the PUBLIC_UNIT party signature; cleared by request-amendment" }
      - { name: custodian_signed_at, type: datetime, source: system, description: "Logical-clock stamp of the CUSTODIAN party signature; cleared by request-amendment" }
      - { name: signature_count, type: integer, source: computed, default: 0, description: "Count of non-null party signature stamps; quorum of 3 executes the agreement" }
      - { name: amendment_round, type: integer, source: system, default: 0, description: "Incremented each time request-amendment fires; capped by AMENDMENT_ROUND_LIMIT" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock stamp when status became EXECUTED" }
      - { name: terminated_at, type: datetime, source: system, description: "Logical-clock stamp when status became TERMINATED" }
      - { name: total_pledged_par_cents, type: integer, source: computed, default: 0, description: "Sum of allocated_par_cents over this agreement's ACTIVE PledgeAllocations" }
      - { name: total_collateral_value_cents, type: integer, source: computed, default: 0, description: "Sum of allocated_collateral_value_cents over this agreement's ACTIVE PledgeAllocations with asset eligibility_status=ELIGIBLE" }
      - { name: active_allocation_count, type: integer, source: computed, default: 0, description: "Count of this agreement's PledgeAllocations with status=ACTIVE" }

  - name: CollateralAsset
    parent: null
    common_fields: true
    fields:
      - { name: depository_id, type: string, source: input, description: "FK -> Depository.id; the owner that may pledge this asset" }
      - { name: custodian_id, type: string, source: input, description: "FK -> Custodian.id; where the asset is held in safekeeping" }
      - { name: cusip, type: string, source: input, description: "Security identifier; unique per depository_id" }
      - { name: asset_type, type: enum, source: input, description: "US_TREASURY | AGENCY_DEBENTURE | AGENCY_MBS | MUNI_GO | MUNI_REVENUE | LETTER_OF_CREDIT — drives haircut_bps and state eligibility", constraints: "US_TREASURY | AGENCY_DEBENTURE | AGENCY_MBS | MUNI_GO | MUNI_REVENUE | LETTER_OF_CREDIT" }
      - { name: par_value_cents, type: integer, source: input, description: "Face/par amount in cents", constraints: "value > 0" }
      - { name: market_price_bps, type: integer, source: system, default: 10000, description: "Clean price per 100 of par in basis points (10000 = par); written by POST /collateral-assets/{id}/prices" }
      - { name: priced_at, type: datetime, source: system, description: "Logical-clock stamp of the last price observation; set to the clock at creation" }
      - { name: haircut_bps, type: integer, source: computed, description: "Haircut from HAIRCUT_BPS_BY_TYPE keyed on asset_type" }
      - { name: market_value_cents, type: integer, source: computed, default: 0, description: "= round_half_up(par_value_cents * market_price_bps / 10000)" }
      - { name: collateral_value_cents, type: integer, source: computed, default: 0, description: "= round_half_up(market_value_cents * (10000 - haircut_bps) / 10000)" }
      - { name: pledged_par_cents, type: integer, source: computed, default: 0, description: "Sum of allocated_par_cents over this asset's ACTIVE PledgeAllocations whose half-open effective interval covers the current logical clock" }
      - { name: available_par_cents, type: integer, source: computed, description: "= par_value_cents - pledged_par_cents; conserved-quantity component" }
      - { name: eligibility_status, type: enum, source: system, default: ELIGIBLE, description: "ELIGIBLE | INELIGIBLE — INELIGIBLE assets contribute 0 collateral value", constraints: "ELIGIBLE | INELIGIBLE" }
      - { name: pledge_status, type: enum, source: computed, default: UNPLEDGED, description: "UNPLEDGED (pledged_par_cents == 0) | PARTIALLY_PLEDGED (0 < pledged < par) | FULLY_PLEDGED (pledged == par_value_cents)", constraints: "UNPLEDGED | PARTIALLY_PLEDGED | FULLY_PLEDGED" }
      - { name: ineligible_reason, type: string, source: system, description: "Regulator reason recorded by POST /collateral-assets/{id}/mark-ineligible" }

  - name: PledgeAllocation
    parent: null
    common_fields: true
    fields:
      - { name: pledge_agreement_id, type: string, source: input, description: "FK -> PledgeAgreement.id" }
      - { name: collateral_asset_id, type: string, source: input, description: "FK -> CollateralAsset.id" }
      - { name: allocated_par_cents, type: integer, source: input, description: "Par amount of the asset pledged under this agreement", constraints: "value > 0" }
      - { name: allocated_collateral_value_cents, type: integer, source: computed, default: 0, description: "Per-allocation haircut value; see calculations.allocation_collateral_valuation (PER_ALLOCATION_THEN_SUM)" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the occupation interval on the asset's par" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the occupation interval; omit for open-ended, which stores OPEN_ENDED_SENTINEL" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUBSTITUTED | RELEASED", constraints: "ACTIVE | SUBSTITUTED | RELEASED" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock stamp when status left ACTIVE" }
      - { name: release_reason, type: enum, source: system, description: "OFFICER_RELEASE | AGREEMENT_TERMINATED | ASSET_INELIGIBLE | SUBSTITUTION_SETTLED", constraints: "OFFICER_RELEASE | AGREEMENT_TERMINATED | ASSET_INELIGIBLE | SUBSTITUTION_SETTLED" }
      - { name: created_by_substitution_id, type: string, source: system, description: "FK -> SubstitutionRequest.id; set on the incoming allocation minted by a settled substitution, null otherwise" }

  - name: SubstitutionRequest
    parent: null
    common_fields: true
    fields:
      - { name: pledge_agreement_id, type: string, source: input, description: "FK -> PledgeAgreement.id" }
      - { name: outgoing_allocation_id, type: string, source: input, description: "FK -> PledgeAllocation.id; the ACTIVE allocation to be swapped out" }
      - { name: incoming_asset_id, type: string, source: input, description: "FK -> CollateralAsset.id; the asset to be pledged in its place" }
      - { name: incoming_par_cents, type: integer, source: input, description: "Par of the incoming asset to pledge", constraints: "value > 0" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the BankCollateralOfficer that submitted the request" }
      - { name: compliance_approved_by_user_id, type: string, source: system, description: "X-User-ID of the BankComplianceOfficer that approved; must differ from submitted_by_user_id" }
      - { name: compliance_approved_at, type: datetime, source: system, description: "Logical-clock stamp of the compliance branch completion" }
      - { name: custodian_acked_at, type: datetime, source: system, description: "Logical-clock stamp of the custodian branch completion" }
      - { name: value_adequacy_delta_cents, type: integer, source: computed, description: "= incoming projected allocated_collateral_value_cents - outgoing allocation allocated_collateral_value_cents; written by the compliance branch only" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | COMPLIANCE_APPROVED | CUSTODIAN_ACKED | READY_TO_SETTLE | SETTLED | REJECTED | WITHDRAWN", constraints: "SUBMITTED | COMPLIANCE_APPROVED | CUSTODIAN_ACKED | READY_TO_SETTLE | SETTLED | REJECTED | WITHDRAWN" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded on POST /substitution-requests/{id}/reject" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock stamp when status became SETTLED" }

  - name: MarkToMarketRun
    parent: Depository
    common_fields: false
    fields:
      - { name: depository_id, type: string, source: system, description: "FK -> Depository.id; taken from the path" }
      - { name: run_index, type: integer, source: system, description: "= Depository.mtm_run_index after increment; monotone from 1" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the closed valuation window" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive end of the closed valuation window" }
      - { name: as_of, type: datetime, source: system, description: "Logical clock at run time; the instant at which allocation intervals are tested for coverage" }
      - { name: basis, type: enum, source: input, description: "SUPERVISORY | INTERNAL — selects the depository_risk_grade variant", constraints: "SUPERVISORY | INTERNAL" }
      - { name: deficiency_surcharge_bps_applied, type: integer, source: computed, description: "Surcharge derived from the consecutive_deficiency_runs SNAPSHOT taken before this run mutates it" }
      - { name: total_required_collateral_cents, type: integer, source: computed, description: "Sum of recomputed required_collateral_cents over accounts with funding_status IN {FUNDED, RESTRICTED}" }
      - { name: total_collateral_value_cents, type: integer, source: computed, description: "Sum of per-allocation values over ACTIVE allocations covering as_of under EXECUTED agreements with ELIGIBLE assets" }
      - { name: deficiency_cents, type: integer, source: computed, description: "= max(0, total_required_collateral_cents - total_collateral_value_cents)" }
      - { name: deficiency_ratio_bps, type: integer, source: computed, description: "= 0 when total_required_collateral_cents == 0, else floor(deficiency_cents * 10000 / total_required_collateral_cents)" }
      - { name: outcome, type: enum, source: computed, description: "SUFFICIENT | DEFICIENT", constraints: "SUFFICIENT | DEFICIENT" }
      - { name: coverage_component_bps, type: integer, source: computed, description: "Coverage sub-score of the risk model for this run" }
      - { name: volatility_component_bps, type: integer, source: computed, description: "Volatility sub-score of the risk model for this run" }
      - { name: documentation_component_bps, type: integer, source: computed, description: "Documentation sub-score of the risk model for this run" }
      - { name: risk_score_bps, type: integer, source: computed, description: "Weighted score written to Depository.risk_score_bps under the run's basis" }
      - { name: risk_grade_assigned, type: enum, source: computed, description: "A | B | C | D written to Depository.risk_grade", constraints: "A | B | C | D" }

  - name: MarginCall
    parent: null
    common_fields: true
    fields:
      - { name: depository_id, type: string, source: system, description: "FK -> Depository.id" }
      - { name: mtm_run_id, type: string, source: system, description: "FK -> MarkToMarketRun.id; the run that opened this call" }
      - { name: required_cure_cents, type: integer, source: system, description: "= issuing run's deficiency_cents; frozen at issuance" }
      - { name: cured_cents, type: integer, source: system, default: 0, description: "Cumulative haircut collateral value credited by cure calls" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= max(0, required_cure_cents - cured_cents)" }
      - { name: cure_deadline_at, type: datetime, source: computed, description: "= issuing run's as_of + CURE_DEADLINE_HOURS tier keyed on deficiency_ratio_bps" }
      - { name: escalated_at, type: datetime, source: system, description: "Logical-clock stamp when the ops run escalated this call past cure_deadline_at" }
      - { name: breach_deadline_at, type: datetime, source: computed, description: "= cure_deadline_at + ESCALATION_GRACE_HOURS; after this the ops run breaches the call" }
      - { name: cured_at, type: datetime, source: system, description: "Logical-clock stamp when outstanding_cents first reached 0" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | PARTIALLY_CURED | CURED | ESCALATED | BREACHED", constraints: "ISSUED | PARTIALLY_CURED | CURED | ESCALATED | BREACHED" }

  - name: SafekeepingReceipt
    parent: null
    common_fields: true
    fields:
      - { name: pledge_agreement_id, type: string, source: input, description: "FK -> PledgeAgreement.id" }
      - { name: receipt_number, type: string, source: input, description: "Custodian's receipt number; unique per pledge_agreement_id" }
      - { name: reported_par_cents, type: integer, source: input, description: "Par total the custodian claims to hold under this agreement", constraints: "value >= 0" }
      - { name: reported_asset_count, type: integer, source: input, description: "Distinct asset count the custodian claims to hold", constraints: "value >= 0" }
      - { name: as_of, type: datetime, source: system, description: "Logical clock at issuance; the instant at which allocation intervals are tested" }
      - { name: ledger_par_cents, type: integer, source: computed, description: "Sum of allocated_par_cents over ACTIVE allocations of the agreement whose interval covers as_of" }
      - { name: ledger_asset_count, type: integer, source: computed, description: "Count of distinct collateral_asset_id over that same allocation set" }
      - { name: discrepancy_par_cents, type: integer, source: computed, description: "= reported_par_cents - ledger_par_cents (signed)" }
      - { name: confirmation_status, type: enum, source: system, default: ISSUED, description: "ISSUED | CONFIRMED | EXCEPTION", constraints: "ISSUED | CONFIRMED | EXCEPTION" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of the StateRegulator that ran the audit confirmation" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock stamp of the audit confirmation" }

  - name: RunoffForecast
    parent: null
    common_fields: true
    fields:
      - { name: deposit_account_id, type: string, source: input, description: "FK -> DepositAccount.id; the account whose balance is being projected" }
      - { name: cycle_label, type: enum, source: input, description: "TAX_COLLECTION | DISBURSEMENT | DEBT_SERVICE — the treasury cycle being planned", constraints: "TAX_COLLECTION | DISBURSEMENT | DEBT_SERVICE" }
      - { name: basis, type: enum, source: input, description: "PEAK_WINDOW | PERIOD_END — selects the runoff_collateral_projection variant", constraints: "PEAK_WINDOW | PERIOD_END" }
      - { name: horizon_start, type: datetime, source: input, description: "Inclusive start of the forecast horizon; must equal the first window's window_start" }
      - { name: horizon_end, type: datetime, source: input, description: "Exclusive end of the forecast horizon; must equal the last window's window_end" }
      - { name: projected_windows, type: array, source: input, description: "Ordered array of objects { window_start, window_end, projected_balance_cents }; half-open [start, end) and contiguous with no gaps or overlaps", constraints: "length >= 1" }
      - { name: projected_peak_balance_cents, type: integer, source: computed, description: "Max projected_balance_cents across windows" }
      - { name: projected_required_collateral_cents, type: integer, source: computed, description: "Projected requirement under the selected basis (see calculations.runoff_collateral_projection)" }
      - { name: unpledged_capacity_cents, type: integer, source: computed, description: "Haircut value of the depository's unpledged par at forecast time" }
      - { name: pledge_capacity_gap_cents, type: integer, source: computed, description: "= max(0, projected_required_collateral_cents - unpledged_capacity_cents)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | STALE | SUPERSEDED", constraints: "OPEN | STALE | SUPERSEDED" }
      - { name: requires_reforecast, type: boolean, source: system, default: false, description: "Set true when the owning public unit escalates and this forecast goes STALE" }
      - { name: superseded_at, type: datetime, source: system, description: "Logical-clock stamp when a newer forecast for the same (deposit_account_id, cycle_label) superseded this one" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Depository
  - entity: Depository
    initial_state: DRAFT
    terminal_states: [DENIED, SUSPENDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /qualification-reviews/{id}/begin-review (system side effect on the parent depository)"
        actor: StateRegulator
        preconditions:
          - "QualificationReview.status == ATTESTED"
          - "Depository.approval_status IN {DRAFT, UNDER_REVIEW}"
        side_effects:
          - "QualificationReview.status := UNDER_REVIEW"
          - "Depository.approval_status := UNDER_REVIEW; Depository.version += 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /qualification-reviews/{id}/decide with decision=APPROVE"
        actor: StateRegulator
        preconditions:
          - "QualificationReview.status == UNDER_REVIEW"
          - "QualificationReview.attested_by_user_id != null"
        side_effects:
          - "QualificationReview.status := APPROVED; QualificationReview.decided_at := clock"
          - "Depository.approval_status := APPROVED; Depository.approved_at := clock"
          - "Depository.approved_pledge_capacity_cents := QualificationReview.requested_pledge_capacity_cents"
          - "Depository.version += 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /qualification-reviews/{id}/decide with decision=DENY"
        actor: StateRegulator
        preconditions:
          - "QualificationReview.status == UNDER_REVIEW"
        side_effects:
          - "QualificationReview.status := DENIED; QualificationReview.decided_at := clock"
          - "Depository.approval_status := DENIED; Depository.approved_pledge_capacity_cents := 0"
          - "Depository.version += 1"
        note: "DENIED is terminal for the depository: no further review may be opened (ERR_INVALID_STATE)."
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /depositories/{id}/suspend"
        actor: StateRegulator
        preconditions:
          - "Depository.approval_status == APPROVED"
        side_effects:
          - "CASCADE HOP 1: Depository.approval_status := SUSPENDED; Depository.version += 1"
          - "CASCADE HOP 2 (caused by hop 1): every DepositAccount of this depository with funding_status IN {PENDING_FUNDING, FUNDED} transitions funding_status := RESTRICTED and records restricted_reason := 'DEPOSITORY_SUSPENDED'"
          - "CASCADE HOP 3 (caused by hop 2): for every PublicUnit owning an account that just became RESTRICTED, recompute exposure_status; the RESTRICTED account forces exposure_status := ESCALATED"
          - "CASCADE HOP 4 (caused by hop 3): for every PublicUnit whose exposure_status became ESCALATED, every RunoffForecast whose deposit_account_id belongs to that unit and whose status == OPEN transitions status := STALE and sets requires_reforecast := true"
        note: "Depth-4 transitive cascade (Depository -> DepositAccount -> PublicUnit -> RunoffForecast). Each hop is caused by the preceding hop's mutation, not by the suspend call itself. collateral_status is NOT touched — it is an independent dimension."

  # ------------------------------------------------------- QualificationReview
  - entity: QualificationReview
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: ATTESTED
        trigger: "POST /qualification-reviews/{id}/attest"
        actor: BankComplianceOfficer
        preconditions:
          - "QualificationReview.status IN {SUBMITTED, RETURNED_FOR_INFO}"
          - "X-User-ID != QualificationReview.submitted_by_user_id (segregation of duties)"
          - "Depository.approval_status != DENIED"
        side_effects:
          - "QualificationReview.attested_by_user_id := X-User-ID; attestation_note stored"
      - from: RETURNED_FOR_INFO
        to: ATTESTED
        trigger: "POST /qualification-reviews/{id}/attest (re-attestation of a returned package)"
        actor: BankComplianceOfficer
        preconditions:
          - "QualificationReview.status == RETURNED_FOR_INFO"
          - "X-User-ID != QualificationReview.submitted_by_user_id"
          - "QualificationReview.round_count + 1 <= REVIEW_ROUND_LIMIT"
        side_effects:
          - "QualificationReview.round_count += 1"
          - "QualificationReview.attested_by_user_id := X-User-ID"
        note: "Closes the review cycle ATTESTED -> UNDER_REVIEW -> RETURNED_FOR_INFO -> ATTESTED. Round 4 is rejected with ERR_ROUND_LIMIT_REACHED."
      - from: ATTESTED
        to: UNDER_REVIEW
        trigger: "POST /qualification-reviews/{id}/begin-review"
        actor: StateRegulator
        preconditions:
          - "QualificationReview.status == ATTESTED"
        side_effects:
          - "Depository.approval_status := UNDER_REVIEW (see Depository DRAFT->UNDER_REVIEW)"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_INFO
        trigger: "POST /qualification-reviews/{id}/return-for-info"
        actor: StateRegulator
        preconditions:
          - "QualificationReview.status == UNDER_REVIEW"
        side_effects:
          - "QualificationReview.info_request_note stored; attested_by_user_id := null"
          - "Depository.approval_status remains UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /qualification-reviews/{id}/decide with decision=APPROVE"
        actor: StateRegulator
        preconditions:
          - "QualificationReview.status == UNDER_REVIEW"
          - "QualificationReview.requested_pledge_capacity_cents <= PLEDGE_CAPACITY_STATUTORY_CEILING_CENTS"
        side_effects:
          - "See Depository UNDER_REVIEW->APPROVED for the full side-effect set"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /qualification-reviews/{id}/decide with decision=DENY"
        actor: StateRegulator
        preconditions:
          - "QualificationReview.status == UNDER_REVIEW"
        side_effects:
          - "See Depository UNDER_REVIEW->DENIED for the full side-effect set"

  # ------------------------------------------- DepositAccount (dimension 1/2)
  - entity: DepositAccount
    initial_state: PENDING_FUNDING
    terminal_states: [RESTRICTED]
    transitions:
      - from: PENDING_FUNDING
        to: FUNDED
        trigger: "POST /deposit-accounts/{id}/deposits"
        actor: PublicUnitTreasurer
        preconditions:
          - "DepositAccount.funding_status == PENDING_FUNDING"
          - "Depository.approval_status == APPROVED (cross-entity guard)"
          - "X-User-ID == DepositAccount.public_unit_id"
          - "PublicUnit.total_deposit_balance_cents + amount_cents <= PublicUnit.statutory_max_deposit_cents"
        side_effects:
          - "DepositAccount.ledger_balance_cents += amount_cents; funding_status := FUNDED"
          - "Recompute calculations.insured_amount_determination for EVERY account in the (public_unit_id, depository_id, deposit_class) insurance group, in group_sequence ASC order"
          - "Recompute calculations.required_collateral_percentage and required_collateral_cents for each account touched"
          - "Recompute calculations.pooled_collateral_waterfall when pledging_mode == POOLED, else recompute assigned_collateral_value_cents from the account's dedicated agreements"
          - "Recompute coverage_ratio_bps and collateral_status for each account touched (dimension 2 moves independently of funding_status)"
          - "Recompute PublicUnit.total_deposit_balance_cents, total_uninsured_cents, exposure_status"
          - "Recompute Depository.total_required_collateral_cents"
          - "DepositAccount.version += 1"
      - from: FUNDED
        to: FUNDED
        trigger: "POST /deposit-accounts/{id}/deposits or POST /deposit-accounts/{id}/withdrawals on a funded account"
        actor: PublicUnitTreasurer
        preconditions:
          - "DepositAccount.funding_status == FUNDED"
          - "Depository.approval_status == APPROVED"
          - "X-User-ID == DepositAccount.public_unit_id"
          - "withdrawals only: amount_cents <= DepositAccount.ledger_balance_cents"
        side_effects:
          - "Same recomputation chain as PENDING_FUNDING->FUNDED; funding_status is unchanged even when the balance reaches 0"
          - "DepositAccount.version += 1"
        note: "Self-loop on dimension 1. A withdrawal of the same amount as a preceding deposit restores insured_amount_cents, uninsured_amount_cents and required_collateral_cents to their pre-deposit values (compensating invariant coverage_ledger_identity)."
      - from: PENDING_FUNDING
        to: RESTRICTED
        trigger: "POST /depositories/{id}/suspend (cascade hop 2)"
        actor: system
        preconditions:
          - "Depository.approval_status transitioned APPROVED -> SUSPENDED in this request"
        side_effects:
          - "funding_status := RESTRICTED; restricted_reason := 'DEPOSITORY_SUSPENDED'; version += 1"
          - "Triggers cascade hop 3 on the owning PublicUnit"
      - from: FUNDED
        to: RESTRICTED
        trigger: "POST /depositories/{id}/suspend (cascade hop 2)"
        actor: system
        preconditions:
          - "Depository.approval_status transitioned APPROVED -> SUSPENDED in this request"
        side_effects:
          - "funding_status := RESTRICTED; restricted_reason := 'DEPOSITORY_SUSPENDED'; version += 1"
          - "required_collateral_cents is NOT zeroed — a restricted account still has to be collateralised"
          - "Triggers cascade hop 3 on the owning PublicUnit"

  # ------------------------------------------- DepositAccount (dimension 2/2)
  - entity: DepositAccount.collateral_status
    initial_state: UNSECURED
    terminal_states: []
    transitions:
      - from: UNSECURED
        to: SECURED
        trigger: "system recompute after POST /pledge-allocations, POST /pledge-allocations/{id}/release, POST /collateral-assets/{id}/prices, POST /deposit-accounts/{id}/deposits, POST /deposit-accounts/{id}/withdrawals, POST /substitution-requests/{id}/settle, POST /margin-calls/{id}/cure"
        actor: system
        preconditions:
          - "coverage_ratio_bps >= 10000 after recomputation (boundary is inclusive)"
        side_effects:
          - "collateral_status := SECURED"
          - "Recompute PublicUnit.exposure_status (WATCH clears when no account is DEFICIENT and none is RESTRICTED)"
      - from: UNSECURED
        to: DEFICIENT
        trigger: "same recompute set"
        actor: system
        preconditions:
          - "assigned_collateral_value_cents > 0 AND coverage_ratio_bps < 10000"
        side_effects:
          - "collateral_status := DEFICIENT"
          - "Recompute PublicUnit.exposure_status -> WATCH when the unit has no RESTRICTED account"
      - from: SECURED
        to: DEFICIENT
        trigger: "same recompute set (price drop, requirement increase, allocation release, substitution settlement)"
        actor: system
        preconditions:
          - "coverage_ratio_bps < 10000 AND assigned_collateral_value_cents > 0"
        side_effects:
          - "collateral_status := DEFICIENT; PublicUnit.exposure_status recomputed"
      - from: DEFICIENT
        to: SECURED
        trigger: "same recompute set (new allocation, price rise, withdrawal)"
        actor: system
        preconditions:
          - "coverage_ratio_bps >= 10000"
        side_effects:
          - "collateral_status := SECURED; PublicUnit.exposure_status recomputed"
      - from: SECURED
        to: UNSECURED
        trigger: "same recompute set when every covering allocation leaves ACTIVE"
        actor: system
        preconditions:
          - "assigned_collateral_value_cents == 0 AND required_collateral_cents > 0"
        side_effects:
          - "collateral_status := UNSECURED; PublicUnit.exposure_status recomputed"
      - from: DEFICIENT
        to: UNSECURED
        trigger: "same recompute set when every covering allocation leaves ACTIVE"
        actor: system
        preconditions:
          - "assigned_collateral_value_cents == 0 AND required_collateral_cents > 0"
        side_effects:
          - "collateral_status := UNSECURED; PublicUnit.exposure_status recomputed"
    note: "Dimension 2 is fully independent of dimension 1: a RESTRICTED account still moves between UNSECURED/SECURED/DEFICIENT, and a FUNDED account's collateral_status changes without any funding_status transition."

  # ------------------------------------------------------------ PledgeAgreement
  - entity: PledgeAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURES
        trigger: "POST /pledge-agreements/{id}/circulate"
        actor: BankCollateralOfficer
        preconditions:
          - "PledgeAgreement.status IN {DRAFT, AMENDMENT_REQUESTED}"
          - "Custodian.approval_status == APPROVED AND Custodian.tri_party_capable == true"
          - "Depository.approval_status == APPROVED"
        side_effects:
          - "status := PENDING_SIGNATURES; version += 1"
      - from: AMENDMENT_REQUESTED
        to: PENDING_SIGNATURES
        trigger: "POST /pledge-agreements/{id}/circulate (re-circulation after amendment)"
        actor: BankCollateralOfficer
        preconditions:
          - "PledgeAgreement.status == AMENDMENT_REQUESTED"
          - "amendment_round <= AMENDMENT_ROUND_LIMIT"
        side_effects:
          - "status := PENDING_SIGNATURES; version += 1"
        note: "Closes the documentation cycle PENDING_SIGNATURES -> AMENDMENT_REQUESTED -> PENDING_SIGNATURES."
      - from: PENDING_SIGNATURES
        to: PENDING_SIGNATURES
        trigger: "POST /pledge-agreements/{id}/signatures with party in {DEPOSITORY, PUBLIC_UNIT, CUSTODIAN} when fewer than 2 stamps are already present"
        actor: BankComplianceOfficer | PublicUnitTreasurer | Custodian | StateRegulator
        preconditions:
          - "PledgeAgreement.status == PENDING_SIGNATURES"
          - "the party's signature stamp is currently null (else ERR_PARTY_ALREADY_SIGNED)"
          - "role/party pairing is entitled: DEPOSITORY<-BankComplianceOfficer; CUSTODIAN<-Custodian with X-User-ID == custodian_id; PUBLIC_UNIT<-PublicUnitTreasurer with X-User-ID == the beneficiary DepositAccount.public_unit_id when beneficiary_type=DEPOSIT_ACCOUNT, or <-StateRegulator when beneficiary_type=POOLED_PROGRAM"
        side_effects:
          - "the matching <party>_signed_at := clock; signature_count recomputed; version += 1"
      - from: PENDING_SIGNATURES
        to: EXECUTED
        trigger: "POST /pledge-agreements/{id}/signatures supplying the third distinct party stamp (quorum of 3)"
        actor: BankComplianceOfficer | PublicUnitTreasurer | Custodian | StateRegulator
        preconditions:
          - "PledgeAgreement.status == PENDING_SIGNATURES AND signature_count == 2 before this call"
          - "same role/party entitlement rules"
        side_effects:
          - "the matching <party>_signed_at := clock; signature_count := 3; status := EXECUTED; executed_at := clock; version += 1"
          - "The agreement becomes a legal pledge vehicle: POST /pledge-allocations is unlocked (ERR_AGREEMENT_NOT_EXECUTED before this point)"
      - from: PENDING_SIGNATURES
        to: AMENDMENT_REQUESTED
        trigger: "POST /pledge-agreements/{id}/request-amendment"
        actor: PublicUnitTreasurer | StateRegulator
        preconditions:
          - "PledgeAgreement.status == PENDING_SIGNATURES"
          - "amendment_round + 1 <= AMENDMENT_ROUND_LIMIT"
        side_effects:
          - "status := AMENDMENT_REQUESTED; amendment_round += 1; version += 1"
          - "depository_signed_at := null, public_unit_signed_at := null, custodian_signed_at := null; signature_count := 0 (all prior signatures voided)"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /pledge-agreements/{id}/terminate"
        actor: StateRegulator
        preconditions:
          - "PledgeAgreement.status == EXECUTED"
          - "no SubstitutionRequest of this agreement has status IN {SUBMITTED, COMPLIANCE_APPROVED, CUSTODIAN_ACKED, READY_TO_SETTLE}"
        side_effects:
          - "status := TERMINATED; terminated_at := clock; version += 1"
          - "every PledgeAllocation of this agreement with status == ACTIVE transitions to RELEASED with release_reason := AGREEMENT_TERMINATED"
          - "each released allocation restores CollateralAsset.pledged_par_cents and available_par_cents, then agreement/depository/pool totals and beneficiary coverage are recomputed"

  # ------------------------------------------------------------ CollateralAsset
  - entity: CollateralAsset
    initial_state: ELIGIBLE
    terminal_states: [INELIGIBLE]
    transitions:
      - from: ELIGIBLE
        to: ELIGIBLE
        trigger: "POST /collateral-assets/{id}/prices"
        actor: SystemOperator | BankCollateralOfficer
        preconditions:
          - "CollateralAsset.eligibility_status == ELIGIBLE"
          - "market_price_bps > 0"
        side_effects:
          - "market_price_bps := input; priced_at := clock; market_value_cents and collateral_value_cents recomputed"
          - "every ACTIVE PledgeAllocation on this asset recomputes allocated_collateral_value_cents"
          - "each touched agreement recomputes total_collateral_value_cents; dedicated beneficiaries recompute coverage; pooled agreements re-run calculations.pooled_collateral_waterfall"
          - "Depository.total_pledged_collateral_value_cents recomputed; version += 1"
      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "POST /collateral-assets/{id}/mark-ineligible"
        actor: StateRegulator
        preconditions:
          - "CollateralAsset.eligibility_status == ELIGIBLE"
        side_effects:
          - "eligibility_status := INELIGIBLE; ineligible_reason stored; version += 1"
          - "every ACTIVE PledgeAllocation on this asset transitions to RELEASED with release_reason := ASSET_INELIGIBLE"
          - "each release restores pledged_par_cents/available_par_cents and recomputes the agreement, then the beneficiary account or the pool waterfall, then PublicUnit.exposure_status"
        note: "pledge_status is a derived dimension (UNPLEDGED/PARTIALLY_PLEDGED/FULLY_PLEDGED) recomputed on every allocation change; it is not driven by this machine."

  # ---------------------------------------------------------- PledgeAllocation
  - entity: PledgeAllocation
    initial_state: ACTIVE
    terminal_states: [RELEASED, SUBSTITUTED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /pledge-allocations/{id}/release, or cascade from agreement termination / asset ineligibility"
        actor: BankCollateralOfficer | system
        preconditions:
          - "PledgeAllocation.status == ACTIVE"
          - "officer-initiated release only: the owning PledgeAgreement.status == EXECUTED"
          - "officer-initiated release only: no SubstitutionRequest referencing this allocation as outgoing_allocation_id has status IN {SUBMITTED, COMPLIANCE_APPROVED, CUSTODIAN_ACKED, READY_TO_SETTLE}"
        side_effects:
          - "status := RELEASED; released_at := clock; release_reason set; version += 1"
          - "CollateralAsset.pledged_par_cents -= allocated_par_cents; available_par_cents recomputed; pledge_status recomputed"
          - "PledgeAgreement totals recomputed; then beneficiary recompute (dedicated account coverage, or pool waterfall re-run); then PublicUnit.exposure_status"
      - from: ACTIVE
        to: SUBSTITUTED
        trigger: "POST /substitution-requests/{id}/settle (outgoing leg)"
        actor: Custodian
        preconditions:
          - "PledgeAllocation.status == ACTIVE"
          - "SubstitutionRequest.status == READY_TO_SETTLE"
        side_effects:
          - "status := SUBSTITUTED; released_at := clock; release_reason := SUBSTITUTION_SETTLED; version += 1"
          - "outgoing CollateralAsset.pledged_par_cents -= allocated_par_cents (conserved-quantity leg 1)"

  # ------------------------------------------------------- SubstitutionRequest
  - entity: SubstitutionRequest
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: COMPLIANCE_APPROVED
        trigger: "POST /substitution-requests/{id}/compliance-approve (compliance branch of the fork)"
        actor: BankComplianceOfficer
        preconditions:
          - "SubstitutionRequest.status == SUBMITTED"
          - "X-User-ID != SubstitutionRequest.submitted_by_user_id (segregation of duties)"
          - "value_adequacy_delta_cents >= 0 (incoming haircut value must at least match the outgoing allocation)"
        side_effects:
          - "value_adequacy_delta_cents computed and stored; compliance_approved_by_user_id := X-User-ID; compliance_approved_at := clock"
          - "status := COMPLIANCE_APPROVED; version += 1"
        note: "Branch-specific side-effect set: only this branch writes value_adequacy_delta_cents. No par moves."
      - from: SUBMITTED
        to: CUSTODIAN_ACKED
        trigger: "POST /substitution-requests/{id}/custodian-ack (custodian branch of the fork)"
        actor: Custodian
        preconditions:
          - "SubstitutionRequest.status == SUBMITTED"
          - "X-User-ID == PledgeAgreement.custodian_id"
          - "incoming CollateralAsset.custodian_id == PledgeAgreement.custodian_id"
        side_effects:
          - "custodian_acked_at := clock; status := CUSTODIAN_ACKED; version += 1"
        note: "Branch-specific side-effect set: only this branch stamps custodian_acked_at and asserts tri-party custody alignment. value_adequacy_delta_cents stays null."
      - from: COMPLIANCE_APPROVED
        to: READY_TO_SETTLE
        trigger: "POST /substitution-requests/{id}/custodian-ack (join point, custodian arriving second)"
        actor: Custodian
        preconditions:
          - "SubstitutionRequest.status == COMPLIANCE_APPROVED"
          - "X-User-ID == PledgeAgreement.custodian_id"
        side_effects:
          - "custodian_acked_at := clock; status := READY_TO_SETTLE; version += 1"
      - from: CUSTODIAN_ACKED
        to: READY_TO_SETTLE
        trigger: "POST /substitution-requests/{id}/compliance-approve (join point, compliance arriving second)"
        actor: BankComplianceOfficer
        preconditions:
          - "SubstitutionRequest.status == CUSTODIAN_ACKED"
          - "X-User-ID != SubstitutionRequest.submitted_by_user_id"
          - "value_adequacy_delta_cents >= 0"
        side_effects:
          - "value_adequacy_delta_cents computed and stored; compliance_approved_by_user_id := X-User-ID; compliance_approved_at := clock"
          - "status := READY_TO_SETTLE; version += 1"
      - from: READY_TO_SETTLE
        to: SETTLED
        trigger: "POST /substitution-requests/{id}/settle"
        actor: Custodian
        preconditions:
          - "SubstitutionRequest.status == READY_TO_SETTLE"
          - "X-User-ID == PledgeAgreement.custodian_id"
          - "Custodian.approval_status == APPROVED (cross-entity guard)"
          - "incoming CollateralAsset.eligibility_status == ELIGIBLE AND available_par_cents >= incoming_par_cents"
        side_effects:
          - "CASCADE HOP 1: outgoing PledgeAllocation -> SUBSTITUTED (outgoing asset pledged_par_cents released); a new PledgeAllocation is minted on incoming_asset_id with allocated_par_cents = incoming_par_cents, effective_from := clock, effective_to := OPEN_ENDED_SENTINEL, created_by_substitution_id := this request; incoming asset pledged_par_cents += incoming_par_cents"
          - "CASCADE HOP 2 (caused by hop 1): the PledgeAgreement recomputes total_pledged_par_cents / total_collateral_value_cents / active_allocation_count; when beneficiary_type == POOLED_PROGRAM the pool recomputes aggregate_collateral_value_cents and re-runs calculations.pooled_collateral_waterfall"
          - "CASCADE HOP 3 (caused by hop 2): every participant DepositAccount whose assigned_collateral_value_cents changed recomputes coverage_ratio_bps and collateral_status (SECURED -> DEFICIENT when the ratio drops below 10000)"
          - "CASCADE HOP 4 (caused by hop 3): every PublicUnit owning an account whose collateral_status became DEFICIENT recomputes exposure_status := WATCH (when it holds no RESTRICTED account)"
          - "status := SETTLED; settled_at := clock; version += 1"
        note: "Depth-4 transitive cascade with a different origin than the suspension cascade (SubstitutionRequest -> PledgeAgreement/Pool -> DepositAccount -> PublicUnit)."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /substitution-requests/{id}/reject"
        actor: BankComplianceOfficer
        preconditions:
          - "SubstitutionRequest.status IN {SUBMITTED, CUSTODIAN_ACKED}"
          - "X-User-ID != SubstitutionRequest.submitted_by_user_id"
        side_effects:
          - "status := REJECTED; rejection_reason stored; version += 1"
          - "No allocation or asset field changes — the request never moved par"
      - from: CUSTODIAN_ACKED
        to: REJECTED
        trigger: "POST /substitution-requests/{id}/reject"
        actor: BankComplianceOfficer
        preconditions:
          - "SubstitutionRequest.status == CUSTODIAN_ACKED"
          - "X-User-ID != SubstitutionRequest.submitted_by_user_id"
        side_effects:
          - "status := REJECTED; rejection_reason stored; custodian_acked_at retained for audit; version += 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /substitution-requests/{id}/withdraw"
        actor: BankCollateralOfficer
        preconditions:
          - "SubstitutionRequest.status IN {SUBMITTED, COMPLIANCE_APPROVED, CUSTODIAN_ACKED, READY_TO_SETTLE}"
          - "X-User-ID == SubstitutionRequest.submitted_by_user_id"
        side_effects:
          - "status := WITHDRAWN; version += 1"
      - from: READY_TO_SETTLE
        to: WITHDRAWN
        trigger: "POST /substitution-requests/{id}/withdraw (late withdrawal before settlement)"
        actor: BankCollateralOfficer
        preconditions:
          - "SubstitutionRequest.status == READY_TO_SETTLE"
          - "X-User-ID == SubstitutionRequest.submitted_by_user_id"
        side_effects:
          - "status := WITHDRAWN; version += 1"
          - "No par movement occurs, so every asset's (available_par_cents + pledged_par_cents) is unchanged (compensating invariant asset_par_conservation)"

  # ------------------------------------------------------------------ MarginCall
  - entity: MarginCall
    initial_state: ISSUED
    terminal_states: [CURED, BREACHED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_CURED
        trigger: "POST /margin-calls/{id}/cure crediting less than outstanding_cents"
        actor: BankCollateralOfficer
        preconditions:
          - "MarginCall.status IN {ISSUED, PARTIALLY_CURED, ESCALATED}"
          - "clock < MarginCall.breach_deadline_at"
          - "every credited allocation is ACTIVE, belongs to an EXECUTED agreement of this depository, has an ELIGIBLE asset, and was created after the issuing run's as_of"
          - "sum of credited allocation values < outstanding_cents"
        side_effects:
          - "cured_cents += sum of credited allocations' allocated_collateral_value_cents; outstanding_cents recomputed"
          - "status := PARTIALLY_CURED; version += 1"
      - from: PARTIALLY_CURED
        to: PARTIALLY_CURED
        trigger: "POST /margin-calls/{id}/cure crediting less than the remaining outstanding_cents"
        actor: BankCollateralOfficer
        preconditions:
          - "MarginCall.status == PARTIALLY_CURED"
          - "clock < MarginCall.breach_deadline_at"
          - "sum of credited allocation values < outstanding_cents"
        side_effects:
          - "cured_cents += credited value; outstanding_cents recomputed; version += 1"
        note: "Self-loop: a margin call may be cured in arbitrarily many partial instalments while outstanding_cents stays positive."
      - from: ISSUED
        to: CURED
        trigger: "POST /margin-calls/{id}/cure crediting at least outstanding_cents"
        actor: BankCollateralOfficer
        preconditions:
          - "MarginCall.status IN {ISSUED, PARTIALLY_CURED, ESCALATED}"
          - "clock < MarginCall.breach_deadline_at"
          - "sum of credited allocation values >= outstanding_cents AND <= outstanding_cents + CURE_OVERAGE_TOLERANCE_CENTS"
        side_effects:
          - "cured_cents += credited value; outstanding_cents := 0; cured_at := clock; status := CURED; version += 1"
          - "Depository.open_margin_call_count recomputed; collateral_posture recomputed (COMPLIANT when no open call and consecutive_deficiency_runs < 3)"
      - from: PARTIALLY_CURED
        to: CURED
        trigger: "POST /margin-calls/{id}/cure closing the remaining outstanding_cents"
        actor: BankCollateralOfficer
        preconditions:
          - "MarginCall.status == PARTIALLY_CURED"
          - "clock < MarginCall.breach_deadline_at"
          - "sum of credited allocation values >= outstanding_cents"
        side_effects:
          - "outstanding_cents := 0; cured_at := clock; status := CURED; version += 1"
          - "Depository.open_margin_call_count and collateral_posture recomputed"
      - from: ISSUED
        to: ESCALATED
        trigger: "POST /_ops/run-daily-cycle when clock >= cure_deadline_at"
        actor: system
        preconditions:
          - "MarginCall.status IN {ISSUED, PARTIALLY_CURED}"
          - "clock >= MarginCall.cure_deadline_at AND clock < MarginCall.breach_deadline_at"
        side_effects:
          - "status := ESCALATED; escalated_at := clock; version += 1"
          - "Depository.collateral_posture recomputed"
      - from: PARTIALLY_CURED
        to: ESCALATED
        trigger: "POST /_ops/run-daily-cycle when clock >= cure_deadline_at"
        actor: system
        preconditions:
          - "MarginCall.status == PARTIALLY_CURED"
          - "clock >= MarginCall.cure_deadline_at AND clock < MarginCall.breach_deadline_at"
        side_effects:
          - "status := ESCALATED; escalated_at := clock; version += 1"
      - from: ESCALATED
        to: CURED
        trigger: "POST /margin-calls/{id}/cure inside the escalation grace period"
        actor: BankCollateralOfficer
        preconditions:
          - "MarginCall.status == ESCALATED AND clock < MarginCall.breach_deadline_at"
          - "sum of credited allocation values >= outstanding_cents"
        side_effects:
          - "outstanding_cents := 0; cured_at := clock; status := CURED; version += 1"
      - from: ESCALATED
        to: BREACHED
        trigger: "POST /_ops/run-daily-cycle when clock >= breach_deadline_at"
        actor: system
        preconditions:
          - "MarginCall.status == ESCALATED AND clock >= MarginCall.breach_deadline_at"
        side_effects:
          - "status := BREACHED; version += 1"
          - "Depository.approval_status := SUSPENDED when it is APPROVED, which fires the depth-4 suspension cascade (hops 2-4)"
          - "Depository.collateral_posture := FROZEN"

  # -------------------------------------------------------- SafekeepingReceipt
  - entity: SafekeepingReceipt
    initial_state: ISSUED
    terminal_states: [CONFIRMED, EXCEPTION]
    transitions:
      - from: ISSUED
        to: CONFIRMED
        trigger: "POST /safekeeping-receipts/{id}/confirm"
        actor: StateRegulator
        preconditions:
          - "SafekeepingReceipt.confirmation_status == ISSUED"
          - "discrepancy_par_cents == 0 AND reported_asset_count == ledger_asset_count"
        side_effects:
          - "confirmation_status := CONFIRMED; confirmed_at := clock; confirmed_by_user_id := X-User-ID; version += 1"
        note: "Empty-collection boundary: an agreement with zero ACTIVE allocations reconciles against reported_par_cents=0 / reported_asset_count=0 and CONFIRMS (it does not raise an exception)."
      - from: ISSUED
        to: EXCEPTION
        trigger: "POST /safekeeping-receipts/{id}/confirm"
        actor: StateRegulator
        preconditions:
          - "SafekeepingReceipt.confirmation_status == ISSUED"
          - "discrepancy_par_cents != 0 OR reported_asset_count != ledger_asset_count"
        side_effects:
          - "confirmation_status := EXCEPTION; confirmed_at := clock; confirmed_by_user_id := X-User-ID; version += 1"
          - "Depository.risk model documentation_component_bps is unaffected until the next MarkToMarketRun recomputes it"

  # ------------------------------------------------------------- RunoffForecast
  - entity: RunoffForecast
    initial_state: OPEN
    terminal_states: [SUPERSEDED]
    transitions:
      - from: OPEN
        to: STALE
        trigger: "POST /depositories/{id}/suspend (cascade hop 4) — owning PublicUnit.exposure_status became ESCALATED"
        actor: system
        preconditions:
          - "RunoffForecast.status == OPEN"
          - "the forecast's DepositAccount.public_unit_id belongs to a PublicUnit whose exposure_status became ESCALATED in this request"
        side_effects:
          - "status := STALE; requires_reforecast := true; version += 1"
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /runoff-forecasts creating a newer forecast for the same (deposit_account_id, cycle_label)"
        actor: PublicUnitTreasurer
        preconditions:
          - "RunoffForecast.status IN {OPEN, STALE}"
          - "the new forecast passes every validation and is persisted"
        side_effects:
          - "status := SUPERSEDED; superseded_at := clock; version += 1"
      - from: STALE
        to: SUPERSEDED
        trigger: "POST /runoff-forecasts creating a newer forecast for the same (deposit_account_id, cycle_label)"
        actor: PublicUnitTreasurer
        preconditions:
          - "RunoffForecast.status == STALE"
        side_effects:
          - "status := SUPERSEDED; superseded_at := clock; requires_reforecast := false; version += 1"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only — see §1.2.1 filter)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-agreement
    parent_entity: PledgeAgreement
    write_endpoint: "POST /pledge-allocations"
    occ_field: "expected_pledge_agreement_version"
    description: |
      Creating a PledgeAllocation against a PledgeAgreement whose version has advanced since the
      client last read it is rejected. A second allocation on the same agreement is legitimate
      product behaviour (agreements carry many allocations), so the rejection cannot be expressed
      as a state precondition: it exists purely to stop a writer from pledging against a stale view
      of the agreement's allocation set, custodian, or beneficiary.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: mtm-run-create-stale-depository
    parent_entity: Depository
    write_endpoint: "POST /depositories/{id}/mtm-runs"
    occ_field: "expected_depository_version"
    description: |
      Recording a MarkToMarketRun against a Depository whose version has advanced since the client
      last read it is rejected. Periodic runs on non-overlapping windows are legitimately repeatable,
      so a stale run request would otherwise succeed while valuing collateral against a superseded
      view of the depository's capital tier, deficiency counter, or approval status.
    error_id: ERR_STALE_DEPOSITORY_VERSION
    http_status: 412

  - rule_id: runoff-forecast-supersede-stale-account
    parent_entity: DepositAccount
    write_endpoint: "POST /runoff-forecasts"
    occ_field: "expected_deposit_account_version"
    description: |
      Creating a RunoffForecast supersedes any prior OPEN/STALE forecast for the same
      (deposit_account_id, cycle_label). Because superseding is legitimate, a forecast built on a
      stale view of the account's balance and requirement must be rejected on the version check
      rather than silently replacing a newer forecast.
    error_id: ERR_STALE_DEPOSIT_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# Domain-wide policy constants (referenced by §1.2, §1.3 and §1.4)
# =============================================================================
domain_constants:
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"        # logical-clock startup default (see POST /_clock/set_current_utc)
  OPEN_ENDED_SENTINEL: "9999-12-31T00:00:00Z"      # stored effective_to for open-ended allocations
  REVIEW_ROUND_LIMIT: 3                            # QualificationReview.round_count ceiling
  AMENDMENT_ROUND_LIMIT: 2                         # PledgeAgreement.amendment_round ceiling
  PLEDGE_CAPACITY_STATUTORY_CEILING_CENTS: 500000000000
  MTM_MIN_GAP_HOURS: 4                             # buffer between consecutive MTM windows of one depository
  PRICE_STALE_HOURS: 48                            # a price older than this may not back a new allocation
  ESCALATION_GRACE_HOURS: 24                       # cure_deadline_at -> breach_deadline_at
  CURE_OVERAGE_TOLERANCE_CENTS: 0                  # credited cure value may not exceed outstanding_cents
  RECEIPT_DISCREPANCY_TOLERANCE_CENTS: 0           # audit confirmation is exact-match

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:

  - name: insured_amount_determination
    trigger: "On POST /deposit-accounts (balance 0), POST /deposit-accounts/{id}/deposits, POST /deposit-accounts/{id}/withdrawals, and inside calculations.mtm_run_evaluation step 2"
    algorithm: waterfall_allocation
    formula: |
      # Insurance group = (public_unit_id, depository_id, deposit_class).
      # Group members: DepositAccounts in that group with funding_status IN {PENDING_FUNDING, FUNDED, RESTRICTED}.
      # Processing order: group_sequence ASC (system-assigned monotone integer, never `id`).
      #
      # VARIANT A — AGGREGATED_BY_UNIT (Depository.insurance_determination_basis == AGGREGATED_BY_UNIT):
      remaining = INSURANCE_COVERAGE_LIMIT_CENTS
      for acct in group ORDER BY group_sequence ASC:
          acct.insured_amount_cents   = min(remaining, acct.ledger_balance_cents)
          remaining                  -= acct.insured_amount_cents
          acct.uninsured_amount_cents = acct.ledger_balance_cents - acct.insured_amount_cents
      #
      # VARIANT B — PER_ACCOUNT (Depository.insurance_determination_basis == PER_ACCOUNT):
      for acct in group:                      # order irrelevant, no shared pool
          acct.insured_amount_cents   = min(INSURANCE_COVERAGE_LIMIT_CENTS, acct.ledger_balance_cents)
          acct.uninsured_amount_cents = acct.ledger_balance_cents - acct.insured_amount_cents
      #
      # Invariant in both variants: insured_amount_cents + uninsured_amount_cents == ledger_balance_cents.
    input_set: "Accounts of one (public_unit_id, depository_id, deposit_class) group whose funding_status IN {PENDING_FUNDING, FUNDED, RESTRICTED}; accounts of other classes, other depositories or other units never share coverage."
    constants:
      INSURANCE_COVERAGE_LIMIT_CENTS: 25000000
    precision: "Whole cents; no rounding is performed (min/subtraction only)"
    variants:
      - name: AGGREGATED_BY_UNIT
        when: "Depository.insurance_determination_basis == AGGREGATED_BY_UNIT (default)"
        difference: "One 25,000,000-cent coverage bucket is shared by the whole group and consumed in group_sequence ASC order, so later accounts can end up entirely uninsured."
      - name: PER_ACCOUNT
        when: "Depository.insurance_determination_basis == PER_ACCOUNT"
        difference: "Every account receives its own 25,000,000-cent bucket, so the same two balances produce strictly smaller uninsured totals than AGGREGATED_BY_UNIT whenever the group holds more than one funded account."

  - name: required_collateral_percentage
    trigger: "Immediately after calculations.insured_amount_determination on any account whose uninsured_amount_cents was recomputed, and inside calculations.mtm_run_evaluation step 2"
    algorithm: threshold
    formula: |
      # (1) capital tier of the account's depository — inclusive lower bounds
      if   dep.capital_ratio_bps >= WELL_CAPITALIZED_MIN_BPS:        tier = WELL_CAPITALIZED
      elif dep.capital_ratio_bps >= ADEQUATELY_CAPITALIZED_MIN_BPS:  tier = ADEQUATELY_CAPITALIZED
      else:                                                          tier = UNDERCAPITALIZED
      tier_bps = TIER_REQUIRED_PCT_BPS[tier]
      # (2) pledging-mode surcharge, keyed on the ACCOUNT (not the unit preference)
      mode_bps = PLEDGING_MODE_SURCHARGE_BPS[acct.pledging_mode]
      # (3) deficiency surcharge, keyed on a SNAPSHOT of the depository's deficiency counter
      #     (inside an MTM run the snapshot is the value taken in step 1, before the run mutates it)
      deficiency_bps = DEFICIENCY_SURCHARGE_BPS if snapshot_consecutive_deficiency_runs >= DEFICIENCY_SURCHARGE_TRIGGER_RUNS else 0
      # (4) non-linear combination: additive then hard-capped
      acct.required_collateral_pct_bps = min(MAX_REQUIRED_PCT_BPS, tier_bps + mode_bps + deficiency_bps)
      acct.required_collateral_cents   = round_half_up(acct.uninsured_amount_cents * acct.required_collateral_pct_bps / 10000)
      # coverage side of the same recompute
      acct.coverage_ratio_bps = 10000 if acct.required_collateral_cents == 0
                                else floor(acct.assigned_collateral_value_cents * 10000 / acct.required_collateral_cents)
    input_set: "One DepositAccount plus its Depository (capital_ratio_bps, consecutive_deficiency_runs snapshot). Accounts with funding_status IN {PENDING_FUNDING, FUNDED, RESTRICTED} all carry a requirement; a RESTRICTED account is NOT exempt."
    constants:
      WELL_CAPITALIZED_MIN_BPS: 1000
      ADEQUATELY_CAPITALIZED_MIN_BPS: 800
      TIER_REQUIRED_PCT_BPS: { WELL_CAPITALIZED: 10500, ADEQUATELY_CAPITALIZED: 11000, UNDERCAPITALIZED: 12500 }
      PLEDGING_MODE_SURCHARGE_BPS: { DEDICATED: 0, POOLED: 500 }
      DEFICIENCY_SURCHARGE_BPS: 1000
      DEFICIENCY_SURCHARGE_TRIGGER_RUNS: 2
      MAX_REQUIRED_PCT_BPS: 15000
    precision: "required_collateral_cents: whole cents, round_half_up. coverage_ratio_bps: floor to whole basis points."
    variants: []

  - name: allocation_collateral_valuation
    trigger: "On POST /pledge-allocations, POST /collateral-assets/{id}/prices, POST /substitution-requests/{id}/settle (incoming leg), and whenever an agreement/pool/depository total is recomputed"
    algorithm: aggregation
    formula: |
      # ---- PER-ALLOCATION value (rounding happens HERE, twice, in this order) ----
      alloc_market_value_cents = round_half_up(alloc.allocated_par_cents * asset.market_price_bps / 10000)
      alloc.allocated_collateral_value_cents =
          0 if asset.eligibility_status == INELIGIBLE
          else round_half_up(alloc_market_value_cents * (10000 - HAIRCUT_BPS_BY_TYPE[asset.asset_type]) / 10000)
      #
      # ---- AGGREGATE: pinned order is PER_ALLOCATION_THEN_SUM ----
      # agreement.total_collateral_value_cents = SUM over its ACTIVE allocations of the ALREADY ROUNDED
      # allocated_collateral_value_cents. It is NOT round_half_up(SUM(par * price * (1 - haircut))) —
      # the two orders differ by up to 1 cent per allocation and the scaffold pins the per-allocation order.
      agreement.total_collateral_value_cents = sum(a.allocated_collateral_value_cents for a in agreement.allocations if a.status == ACTIVE and asset(a).eligibility_status == ELIGIBLE)
      agreement.total_pledged_par_cents      = sum(a.allocated_par_cents for a in agreement.allocations if a.status == ACTIVE)
      depository.total_pledged_collateral_value_cents = sum(agr.total_collateral_value_cents for agr in depository.agreements if agr.status == EXECUTED)
      #
      # ---- asset-level mirrors (same two-step rounding on the full par) ----
      asset.market_value_cents     = round_half_up(asset.par_value_cents * asset.market_price_bps / 10000)
      asset.collateral_value_cents = round_half_up(asset.market_value_cents * (10000 - HAIRCUT_BPS_BY_TYPE[asset.asset_type]) / 10000)
      # Interval-aware mirrors: only ACTIVE allocations whose half-open interval covers the CURRENT clock
      # occupy par right now, so available_par_cents can never go negative even when two ACTIVE allocations
      # of the full par sit on disjoint intervals (see §1.4 priority 70).
      asset.pledged_par_cents      = sum(a.allocated_par_cents for a in asset.allocations
                                         if a.status == ACTIVE and a.effective_from <= clock < a.effective_to)
      asset.available_par_cents    = asset.par_value_cents - asset.pledged_par_cents
      depository.total_pledged_par_cents = sum(a.allocated_par_cents for a in ACTIVE allocations of the depository's
                                               EXECUTED agreements if a.effective_from <= clock < a.effective_to)
    input_set: "ACTIVE PledgeAllocations only. SUBSTITUTED and RELEASED allocations contribute 0 to every total; allocations whose asset is INELIGIBLE contribute 0 value but still count in total_pledged_par_cents."
    constants:
      HAIRCUT_BPS_BY_TYPE: { US_TREASURY: 200, AGENCY_DEBENTURE: 300, AGENCY_MBS: 800, MUNI_GO: 1000, MUNI_REVENUE: 1500, LETTER_OF_CREDIT: 0 }
    precision: "Two sequential round_half_up steps per allocation (par*price first, then haircut); aggregates sum already-rounded per-allocation values (PER_ALLOCATION_THEN_SUM)."
    variants: []

  - name: pooled_collateral_waterfall
    trigger: "On POST /pledge-allocations, POST /pledge-allocations/{id}/release, POST /collateral-assets/{id}/prices, POST /collateral-assets/{id}/mark-ineligible, POST /substitution-requests/{id}/settle, POST /pledge-agreements/{id}/terminate, POST /deposit-accounts/{id}/deposits, POST /deposit-accounts/{id}/withdrawals, POST /depositories/{id}/suspend — whenever a pooled agreement's value or a participant's requirement changes"
    algorithm: waterfall_allocation
    formula: |
      pool.aggregate_collateral_value_cents = sum(alloc.allocated_collateral_value_cents
          for alloc in ACTIVE allocations
          where alloc.agreement.status == EXECUTED
            and alloc.agreement.beneficiary_type == POOLED_PROGRAM
            and alloc.agreement.pooled_program_id == pool.id
            and asset(alloc).eligibility_status == ELIGIBLE
            and alloc.effective_from <= clock < alloc.effective_to)      # half-open interval test
      participants = [acct for acct in DepositAccounts
                      where acct.pledging_mode == POOLED
                        and acct.funding_status IN {FUNDED, RESTRICTED}
                        and depository(acct).pooled_program_id == pool.id]
      # ordering: statutory priority, then largest requirement, then oldest account
      participants.sort(key = (acct.pool_priority_rank ASC,
                               acct.required_collateral_cents DESC,
                               acct.created_at ASC))
      remaining = pool.aggregate_collateral_value_cents
      for acct in participants:
          acct.pooled_allocated_collateral_cents   = min(remaining, acct.required_collateral_cents)
          acct.assigned_collateral_value_cents     = acct.pooled_allocated_collateral_cents
          remaining                               -= acct.pooled_allocated_collateral_cents
      pool.unallocated_collateral_cents            = remaining
      pool.aggregate_required_collateral_cents      = sum(acct.required_collateral_cents for acct in participants)
      pool.participant_account_count                = len(participants)
      pool.pool_posture = SHORTFALL if pool.aggregate_collateral_value_cents * 10000 <
                                       pool.aggregate_required_collateral_cents * pool.minimum_pool_pct_bps
                          else ADEQUATE
      # CONSERVED QUANTITY (pool_value_conservation):
      #   pool.aggregate_collateral_value_cents == sum(acct.pooled_allocated_collateral_cents) + pool.unallocated_collateral_cents
    input_set: "Participants are POOLED accounts with funding_status IN {FUNDED, RESTRICTED} at depositories whose pooled_program_id == pool.id; PENDING_FUNDING accounts are excluded. Pool value counts only ACTIVE allocations under EXECUTED pooled agreements on ELIGIBLE assets whose half-open interval covers the current clock."
    constants:
      POOL_PRIORITY_RANK_BY_UNIT_TYPE: { SCHOOL_DISTRICT: 1, COUNTY: 2, MUNICIPALITY: 3, STATE_AGENCY: 4 }
    precision: "Whole cents; min/subtraction only, so the conservation identity is exact"
    variants: []

  - name: mtm_run_evaluation
    trigger: "POST /depositories/{id}/mtm-runs"
    algorithm: constraint_propagation
    formula: |
      # The requirement depends on a surcharge derived from the deficiency counter that THIS run updates.
      # The dependency is broken by an explicit evaluation order — the snapshot in step 1 is authoritative
      # for the whole run, and the counter is only written in step 6.
      #
      # STEP 1 — snapshot (before any mutation):
      S = dep.consecutive_deficiency_runs
      run.deficiency_surcharge_bps_applied = DEFICIENCY_SURCHARGE_BPS if S >= DEFICIENCY_SURCHARGE_TRIGGER_RUNS else 0
      run.as_of = clock ; run.run_index = dep.mtm_run_index + 1
      # STEP 2 — re-derive every account (insured -> uninsured -> pct -> requirement) using S, never S+1:
      for acct in dep.accounts where funding_status IN {FUNDED, RESTRICTED}:
          recompute calculations.insured_amount_determination and calculations.required_collateral_percentage
      # STEP 3 — totals:
      run.total_required_collateral_cents = sum(acct.required_collateral_cents for those accounts)
      run.total_collateral_value_cents    = sum(alloc.allocated_collateral_value_cents
                                                for alloc in ACTIVE allocations of dep's EXECUTED agreements
                                                where asset(alloc).eligibility_status == ELIGIBLE
                                                  and alloc.effective_from <= run.as_of < alloc.effective_to)
      # STEP 4 — deficiency:
      run.deficiency_cents      = max(0, run.total_required_collateral_cents - run.total_collateral_value_cents)
      run.deficiency_ratio_bps  = 0 if run.total_required_collateral_cents == 0
                                  else floor(run.deficiency_cents * 10000 / run.total_required_collateral_cents)
      # STEP 5 — outcome:
      run.outcome = DEFICIENT if run.deficiency_cents > 0 else SUFFICIENT
      # STEP 6 — counter + margin call (the ONLY writes to the counter):
      if run.outcome == DEFICIENT:
          dep.consecutive_deficiency_runs = S + 1
          issue MarginCall(depository_id=dep.id, mtm_run_id=run.id,
                           required_cure_cents=run.deficiency_cents, cured_cents=0, status=ISSUED,
                           cure_deadline_at = run.as_of + CURE_DEADLINE_HOURS_BY_RATIO tier hours,
                           breach_deadline_at = cure_deadline_at + ESCALATION_GRACE_HOURS)
      else:
          dep.consecutive_deficiency_runs = 0                     # reset mechanism
      dep.mtm_run_index = run.run_index ; dep.last_mtm_window_end = run.window_end
      dep.collateral_posture = FROZEN if dep.consecutive_deficiency_runs >= FROZEN_TRIGGER_RUNS
                               else (MARGIN_DEFICIENT if dep.open_margin_call_count >= 1 else COMPLIANT)
      # STEP 7 — risk grade under run.basis (see calculations.depository_risk_grade)
    input_set: "Accounts with funding_status IN {FUNDED, RESTRICTED} at this depository; ACTIVE allocations under this depository's EXECUTED agreements on ELIGIBLE assets whose half-open interval covers run.as_of."
    constants:
      DEFICIENCY_SURCHARGE_BPS: 1000
      DEFICIENCY_SURCHARGE_TRIGGER_RUNS: 2
      FROZEN_TRIGGER_RUNS: 3
      CURE_DEADLINE_HOURS_BY_RATIO: { "ratio_bps >= 2000": 24, "ratio_bps >= 500": 48, "otherwise": 120 }
      ESCALATION_GRACE_HOURS: 24
    precision: "deficiency_ratio_bps floored to whole basis points; deadlines are exact hour offsets from run.as_of"
    variants: []

  - name: depository_risk_grade
    trigger: "Step 7 of calculations.mtm_run_evaluation, on every POST /depositories/{id}/mtm-runs"
    algorithm: weighted_scoring
    formula: |
      # --- per-run component scores (always computed from THIS run's step-3 totals) ---
      cov_ratio_bps = 12000 if run.total_required_collateral_cents == 0
                      else min(12000, floor(run.total_collateral_value_cents * 10000 / run.total_required_collateral_cents))
      run.coverage_component_bps      = max(0, min(10000, round_half_up((cov_ratio_bps - 9000) * 10000 / 3000)))
      run.volatility_component_bps    = 10000 - min(10000, dep.consecutive_deficiency_runs * VOLATILITY_PENALTY_BPS_PER_RUN)   # counter AFTER step 6
      funded_accounts   = count(dep.accounts with funding_status IN {FUNDED, RESTRICTED})
      documented        = count(those accounts that are the beneficiary of an EXECUTED PledgeAgreement,
                                counting POOLED accounts as documented when their depository's pool has
                                at least one EXECUTED pooled agreement)
      run.documentation_component_bps = 10000 if funded_accounts == 0
                                        else min(10000, round_half_up(10000 * documented / funded_accounts))
      #
      # --- VARIANT SUPERVISORY: this run's components only ---
      c_cov, c_vol, c_doc = run.coverage_component_bps, run.volatility_component_bps, run.documentation_component_bps
      #
      # --- VARIANT INTERNAL: component-wise trailing average over the last N runs ---
      # window = this run plus the previous (TRAILING_RUN_WINDOW - 1) runs of this depository ordered by
      # run_index DESC; if fewer exist, average over however many there are.
      c_cov = round_half_up(mean(r.coverage_component_bps      for r in window))
      c_vol = round_half_up(mean(r.volatility_component_bps    for r in window))
      c_doc = round_half_up(mean(r.documentation_component_bps for r in window))
      #
      # --- weighting is identical for both variants; ONE final rounding step ---
      run.risk_score_bps = round_half_up(WEIGHT_COVERAGE * c_cov + WEIGHT_VOLATILITY * c_vol + WEIGHT_DOCUMENTATION * c_doc)
      run.risk_grade_assigned = A if run.risk_score_bps >= GRADE_A_MIN_BPS else
                                B if run.risk_score_bps >= GRADE_B_MIN_BPS else
                                C if run.risk_score_bps >= GRADE_C_MIN_BPS else D
      dep.risk_score_bps = run.risk_score_bps ; dep.risk_grade = run.risk_grade_assigned
    input_set: "MarkToMarketRun rows of ONE depository. SUPERVISORY reads exactly one run; INTERNAL reads the most recent TRAILING_RUN_WINDOW runs by run_index DESC (fewer if the depository has fewer runs)."
    constants:
      WEIGHT_COVERAGE: 0.50
      WEIGHT_VOLATILITY: 0.30
      WEIGHT_DOCUMENTATION: 0.20
      VOLATILITY_PENALTY_BPS_PER_RUN: 2500
      TRAILING_RUN_WINDOW: 3
      GRADE_A_MIN_BPS: 8500
      GRADE_B_MIN_BPS: 7000
      GRADE_C_MIN_BPS: 5000
    precision: "Component averages rounded (round_half_up) to whole bps BEFORE weighting; exactly one further round_half_up after weighting. Averaging-then-weighting is the pinned order."
    variants:
      - name: SUPERVISORY
        when: "MarkToMarketRun.basis == SUPERVISORY (regulator view)"
        difference: "Uses only the current run's component values, so a single bad run immediately moves the grade."
      - name: INTERNAL
        when: "MarkToMarketRun.basis == INTERNAL (bank view)"
        difference: "Averages each component over the trailing 3 runs before weighting, so the same current-run inputs produce a higher (smoothed) score whenever earlier runs were stronger."

  - name: runoff_collateral_projection
    trigger: "POST /runoff-forecasts"
    algorithm: forward_looking
    formula: |
      # windows arrive as an ordered array of { window_start, window_end, projected_balance_cents },
      # half-open [window_start, window_end), contiguous (window[i].window_end == window[i+1].window_start),
      # covering exactly [horizon_start, horizon_end).
      pct = account.required_collateral_pct_bps          # the account's CURRENT percentage, frozen into the forecast
      for w in windows:
          w.projected_uninsured_cents = max(0, w.projected_balance_cents - INSURANCE_COVERAGE_LIMIT_CENTS)
          w.projected_required_cents  = round_half_up(w.projected_uninsured_cents * pct / 10000)
      forecast.projected_peak_balance_cents = max(w.projected_balance_cents for w in windows)
      #
      # VARIANT PEAK_WINDOW  : the treasury must be collateralised for the worst window in the horizon
      forecast.projected_required_collateral_cents = max(w.projected_required_cents for w in windows)
      # VARIANT PERIOD_END   : the treasury plans to the closing position of the horizon
      last = the window with the greatest window_start (tie-break: greatest window_end)
      forecast.projected_required_collateral_cents = last.projected_required_cents
      #
      # capacity comparison is identical for both variants
      forecast.unpledged_capacity_cents = sum(
          round_half_up(round_half_up(a.available_par_cents * a.market_price_bps / 10000) * (10000 - HAIRCUT_BPS_BY_TYPE[a.asset_type]) / 10000)
          for a in CollateralAssets where a.depository_id == account.depository_id
                                      and a.eligibility_status == ELIGIBLE
                                      and a.available_par_cents > 0)
      forecast.pledge_capacity_gap_cents = max(0, forecast.projected_required_collateral_cents - forecast.unpledged_capacity_cents)
    input_set: "The forecast's own projected_windows array plus the referenced DepositAccount's current required_collateral_pct_bps and its depository's ELIGIBLE assets with available_par_cents > 0. Allocations are not consulted — only unpledged par."
    constants:
      INSURANCE_COVERAGE_LIMIT_CENTS: 25000000
      HAIRCUT_BPS_BY_TYPE: { US_TREASURY: 200, AGENCY_DEBENTURE: 300, AGENCY_MBS: 800, MUNI_GO: 1000, MUNI_REVENUE: 1500, LETTER_OF_CREDIT: 0 }
    precision: "Per-window requirement rounded (round_half_up) to whole cents BEFORE the max/last selection; capacity rounded per asset then summed"
    variants:
      - name: PEAK_WINDOW
        when: "RunoffForecast.basis == PEAK_WINDOW"
        difference: "Takes the maximum per-window requirement, so a mid-horizon tax-collection spike sets the plan."
      - name: PERIOD_END
        when: "RunoffForecast.basis == PERIOD_END"
        difference: "Takes the chronologically last window's requirement, so a spike that has already run off by the horizon end is invisible and the projected requirement is strictly lower."

  - name: safekeeping_reconciliation
    trigger: "POST /safekeeping-receipts (computes the ledger side) and POST /safekeeping-receipts/{id}/confirm (decides the outcome)"
    algorithm: aggregation
    formula: |
      covering = [alloc for alloc in allocations(agreement)
                  where alloc.status == ACTIVE
                    and alloc.effective_from <= receipt.as_of < alloc.effective_to]     # half-open
      receipt.ledger_par_cents      = sum(alloc.allocated_par_cents for alloc in covering)      # 0 over the empty set
      receipt.ledger_asset_count    = count(distinct alloc.collateral_asset_id for alloc in covering)
      receipt.discrepancy_par_cents = receipt.reported_par_cents - receipt.ledger_par_cents      # signed
      # confirmation decision (exact match — RECEIPT_DISCREPANCY_TOLERANCE_CENTS is 0):
      receipt.confirmation_status = CONFIRMED if abs(receipt.discrepancy_par_cents) <= RECEIPT_DISCREPANCY_TOLERANCE_CENTS
                                                 and receipt.reported_asset_count == receipt.ledger_asset_count
                                    else EXCEPTION
    input_set: "ACTIVE allocations of exactly one PledgeAgreement whose half-open interval covers receipt.as_of. SUBSTITUTED/RELEASED allocations are excluded even when their interval covers as_of."
    constants:
      RECEIPT_DISCREPANCY_TOLERANCE_CENTS: 0
    precision: "Whole cents, exact integer arithmetic; the empty allocation set yields ledger_par_cents = 0 and ledger_asset_count = 0 (not null, and not an error)"
    variants: []

  - name: margin_call_cure_accounting
    trigger: "POST /margin-calls/{id}/cure"
    algorithm: aggregation
    formula: |
      credited = [alloc for alloc in PledgeAllocations where alloc.id IN request.credited_allocation_ids]
      # eligibility of each credited allocation (all must pass, else ERR_CURE_ALLOCATION_INELIGIBLE):
      #   alloc.status == ACTIVE
      #   agreement(alloc).status == EXECUTED and agreement(alloc).depository_id == call.depository_id
      #   asset(alloc).eligibility_status == ELIGIBLE
      #   alloc.created_at > run(call.mtm_run_id).as_of        # only NEW collateral may cure a call
      credited_value = sum(alloc.allocated_collateral_value_cents for alloc in credited)   # already-rounded values
      if credited_value > call.outstanding_cents + CURE_OVERAGE_TOLERANCE_CENTS: reject ERR_CURE_EXCEEDS_OUTSTANDING
      call.cured_cents      += credited_value
      call.outstanding_cents = max(0, call.required_cure_cents - call.cured_cents)
      call.status            = CURED if call.outstanding_cents == 0 else PARTIALLY_CURED
      dep.open_margin_call_count = count(dep.margin_calls with status IN {ISSUED, PARTIALLY_CURED, ESCALATED})
      dep.collateral_posture     = FROZEN if dep.consecutive_deficiency_runs >= 3
                                   else (MARGIN_DEFICIENT if dep.open_margin_call_count >= 1 else COMPLIANT)
    input_set: "Only the allocations named in credited_allocation_ids; each must be ACTIVE, under an EXECUTED agreement of the same depository, on an ELIGIBLE asset, and created strictly after the issuing run's as_of."
    constants:
      CURE_OVERAGE_TOLERANCE_CENTS: 0
    precision: "Sums already-rounded per-allocation values (PER_ALLOCATION_THEN_SUM); no further rounding"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (evaluated in ascending priority order;
# the FIRST failing rule determines the response error_id)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The role is listed in the endpoint's roles[] in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 25
    category: auth
    check: "Entity-backed ownership: a PublicUnitTreasurer's X-User-ID must equal the target DepositAccount.public_unit_id (or the RunoffForecast's account's public_unit_id, or the PledgeAgreement beneficiary account's public_unit_id); a Custodian's X-User-ID must equal the target PledgeAgreement.custodian_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /deposit-accounts, POST /deposit-accounts/{id}/deposits, POST /deposit-accounts/{id}/withdrawals, POST /runoff-forecasts, POST /pledge-agreements/{id}/signatures, POST /pledge-agreements/{id}/request-amendment, POST /substitution-requests/{id}/custodian-ack, POST /substitution-requests/{id}/settle, POST /safekeeping-receipts, GET /deposit-accounts/{id}/coverage-report"

  - priority: 30
    category: existence
    check: "Every resource referenced by the path exists, validated left-to-right; then every FK in the body exists (declaration order: depository_id, public_unit_id, custodian_id, pooled_program_id, deposit_account_id, pledge_agreement_id, collateral_asset_id, outgoing_allocation_id, incoming_asset_id)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 35
    category: business_constraint
    check: "Request shape: all required input fields present, enums within their declared sets, integer amounts > 0 (>= 0 for reported_par_cents / reported_asset_count), datetimes ISO-8601 UTC, projected_windows non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 40
    category: state
    check: "OCC: the supplied expected_<parent>_version equals the parent's current version (PledgeAgreement for POST /pledge-allocations, Depository for POST /depositories/{id}/mtm-runs, DepositAccount for POST /runoff-forecasts)"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /pledge-allocations, POST /depositories/{id}/mtm-runs, POST /runoff-forecasts — each endpoint returns its own stale-version error_id per §1.2.1"

  - priority: 45
    category: state
    check: "The target resource is in a state that admits this transition (see §1.2); a terminal state rejects every trigger"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 46
    category: state
    check: "Depository.approval_status == APPROVED when opening or funding a deposit account, circulating an agreement, or creating collateral/allocations for that depository"
    error_id: ERR_DEPOSITORY_NOT_APPROVED
    http_status: 409
    applies_to: "POST /deposit-accounts, POST /deposit-accounts/{id}/deposits, POST /deposit-accounts/{id}/withdrawals, POST /pledge-agreements/{id}/circulate, POST /collateral-assets, POST /pledge-allocations"

  - priority: 47
    category: state
    check: "Depository.collateral_posture != FROZEN when creating a new deposit account or a new substitution request at that depository"
    error_id: ERR_DEPOSITORY_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /deposit-accounts, POST /substitution-requests"

  - priority: 48
    category: state
    check: "PledgeAgreement.status == EXECUTED before any allocation, substitution or safekeeping receipt is created against it"
    error_id: ERR_AGREEMENT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /pledge-allocations, POST /substitution-requests, POST /safekeeping-receipts"

  - priority: 50
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID must differ from the user id that produced the prior step (QualificationReview.submitted_by_user_id for attest; SubstitutionRequest.submitted_by_user_id for compliance-approve and reject)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /qualification-reviews/{id}/attest, POST /substitution-requests/{id}/compliance-approve, POST /substitution-requests/{id}/reject"

  - priority: 52
    category: business_safety
    check: "Custodian.approval_status == APPROVED and Custodian.tri_party_capable == true for the agreement's custodian"
    error_id: ERR_CUSTODIAN_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /pledge-agreements/{id}/circulate, POST /substitution-requests/{id}/settle, POST /safekeeping-receipts"

  - priority: 54
    category: business_safety
    check: "The asset's asset_type is on the state's eligible list (MUNI_REVENUE is NOT eligible collateral for public funds) and its eligibility_status == ELIGIBLE"
    error_id: ERR_COLLATERAL_TYPE_INELIGIBLE
    http_status: 422
    applies_to: "POST /pledge-allocations, POST /substitution-requests, POST /substitution-requests/{id}/settle, POST /margin-calls/{id}/cure"

  - priority: 56
    category: business_safety
    check: "Depository.risk_grade != D when opening a new deposit account at that depository"
    error_id: ERR_DEPOSITORY_RISK_GRADE_BLOCKED
    http_status: 409
    applies_to: "POST /deposit-accounts"

  - priority: 60
    category: business_referential
    check: "The collateral asset's custodian_id equals the agreement's custodian_id (tri-party alignment)"
    error_id: ERR_CUSTODIAN_MISMATCH
    http_status: 422
    applies_to: "POST /pledge-allocations, POST /substitution-requests, POST /substitution-requests/{id}/custodian-ack"

  - priority: 61
    category: business_referential
    check: "The collateral asset's depository_id equals the agreement's depository_id"
    error_id: ERR_DEPOSITORY_MISMATCH
    http_status: 422
    applies_to: "POST /pledge-allocations, POST /substitution-requests"

  - priority: 62
    category: business_referential
    check: "Polymorphic beneficiary coherence: beneficiary_type == DEPOSIT_ACCOUNT requires deposit_account_id present and pooled_program_id absent; beneficiary_type == POOLED_PROGRAM requires pooled_program_id present, deposit_account_id absent, and Depository.pooled_program_id == that pooled_program_id"
    error_id: ERR_BENEFICIARY_TARGET_INVALID
    http_status: 422
    applies_to: "POST /pledge-agreements"

  - priority: 63
    category: business_referential
    check: "DepositAccount.pledging_mode equals the owning PublicUnit.collateral_program_preference, and POOLED accounts may only be opened at depositories whose pooled_program_id is non-null"
    error_id: ERR_PLEDGING_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /deposit-accounts"

  - priority: 64
    category: business_referential
    check: "The substitution's outgoing_allocation_id belongs to the named pledge_agreement_id and is ACTIVE"
    error_id: ERR_ALLOCATION_NOT_UNDER_AGREEMENT
    http_status: 422
    applies_to: "POST /substitution-requests"

  - priority: 65
    category: business_temporal
    check: "The asset's priced_at is not older than PRICE_STALE_HOURS (48h) relative to the logical clock when a new allocation or substitution is created"
    error_id: ERR_STALE_COLLATERAL_PRICE
    http_status: 422
    applies_to: "POST /pledge-allocations, POST /substitution-requests"

  - priority: 66
    category: business_temporal
    check: "Allocation interval sanity: effective_from < effective_to; effective_from >= the agreement's executed_at"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /pledge-allocations"

  - priority: 67
    category: business_temporal
    check: "MTM window sanity and spacing on the same depository: window_start <= window_end; window_end <= clock; the CLOSED window [window_start, window_end] must not intersect any prior run's closed window, and window_start must be at least MTM_MIN_GAP_HOURS (4h) after the previous run's window_end"
    error_id: ERR_MTM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /depositories/{id}/mtm-runs"

  - priority: 68
    category: business_temporal
    check: "Forecast windows form a contiguous half-open chain: window[i].window_end == window[i+1].window_start for every i, window[0].window_start == horizon_start, window[last].window_end == horizon_end, and every window has window_start < window_end"
    error_id: ERR_FORECAST_WINDOW_DISCONTINUITY
    http_status: 422
    applies_to: "POST /runoff-forecasts"

  - priority: 69
    category: business_temporal
    check: "A margin call may only be cured while the logical clock is strictly before breach_deadline_at"
    error_id: ERR_CURE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /margin-calls/{id}/cure"

  - priority: 70
    category: business_constraint
    check: "Aggregate par capacity on the asset: over every instant in the requested half-open interval, the sum of allocated_par_cents of ACTIVE allocations on the asset that overlap that instant plus the new allocation must not exceed par_value_cents. Adjacency (existing.effective_to == new.effective_from) does NOT overlap."
    error_id: ERR_ALLOCATION_OVERSUBSCRIBED
    http_status: 409
    applies_to: "POST /pledge-allocations, POST /substitution-requests/{id}/settle"

  - priority: 71
    category: business_constraint
    check: "Custodian concentration: after the write, the share of the depository's total_pledged_collateral_value_cents held at this custodian must not exceed Custodian.concentration_limit_bps"
    error_id: ERR_CUSTODIAN_CONCENTRATION_EXCEEDED
    http_status: 422
    applies_to: "POST /pledge-allocations"

  - priority: 72
    category: business_constraint
    check: "Uniqueness: CollateralAsset.cusip unique per depository_id; PledgeAgreement.agreement_number unique per depository_id; SafekeepingReceipt.receipt_number unique per pledge_agreement_id"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /collateral-assets, POST /pledge-agreements, POST /safekeeping-receipts"

  - priority: 73
    category: business_constraint
    check: "Round/instalment ceilings: QualificationReview.round_count + 1 <= REVIEW_ROUND_LIMIT (3) on re-attestation; PledgeAgreement.amendment_round + 1 <= AMENDMENT_ROUND_LIMIT (2) on request-amendment"
    error_id: ERR_ROUND_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /qualification-reviews/{id}/attest, POST /pledge-agreements/{id}/request-amendment"

  - priority: 74
    category: business_constraint
    check: "Signature discipline: the requested party's stamp must be null (else already signed) and the acting role must be entitled to that party"
    error_id: ERR_PARTY_ALREADY_SIGNED
    http_status: 409
    applies_to: "POST /pledge-agreements/{id}/signatures"

  - priority: 75
    category: business_constraint
    check: "Role/party entitlement on signatures: DEPOSITORY<-BankComplianceOfficer, CUSTODIAN<-Custodian (owner), PUBLIC_UNIT<-PublicUnitTreasurer (owner of the beneficiary account) or StateRegulator (pooled beneficiary)"
    error_id: ERR_SIGNATURE_PARTY_MISMATCH
    http_status: 403
    applies_to: "POST /pledge-agreements/{id}/signatures"

  - priority: 76
    category: business_constraint
    check: "Cure-credit eligibility: every credited allocation is ACTIVE, sits under an EXECUTED agreement of the call's depository, on an ELIGIBLE asset, and was created strictly after the issuing run's as_of"
    error_id: ERR_CURE_ALLOCATION_INELIGIBLE
    http_status: 422
    applies_to: "POST /margin-calls/{id}/cure"

  - priority: 77
    category: business_constraint
    check: "Substitution value adequacy: value_adequacy_delta_cents >= 0 (the incoming haircut value must at least match the outgoing allocation's value)"
    error_id: ERR_SUBSTITUTION_VALUE_SHORTFALL
    http_status: 422
    applies_to: "POST /substitution-requests/{id}/compliance-approve"

  - priority: 80
    category: business_fiscal
    check: "PublicUnit.total_deposit_balance_cents + amount_cents <= PublicUnit.statutory_max_deposit_cents"
    error_id: ERR_STATUTORY_DEPOSIT_LIMIT
    http_status: 422
    applies_to: "POST /deposit-accounts/{id}/deposits"

  - priority: 81
    category: business_fiscal
    check: "amount_cents <= DepositAccount.ledger_balance_cents on a withdrawal"
    error_id: ERR_INSUFFICIENT_LEDGER_BALANCE
    http_status: 422
    applies_to: "POST /deposit-accounts/{id}/withdrawals"

  - priority: 82
    category: business_fiscal
    check: "Pledge capacity: Depository.total_pledged_par_cents + allocated_par_cents <= Depository.approved_pledge_capacity_cents"
    error_id: ERR_PLEDGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /pledge-allocations"

  - priority: 83
    category: business_fiscal
    check: "Requested capacity on a qualification review must not exceed PLEDGE_CAPACITY_STATUTORY_CEILING_CENTS"
    error_id: ERR_CAPACITY_ABOVE_STATUTORY_CEILING
    http_status: 422
    applies_to: "POST /depositories/{id}/qualification-reviews, POST /qualification-reviews/{id}/decide"

  - priority: 84
    category: business_fiscal
    check: "Credited cure value must not exceed outstanding_cents + CURE_OVERAGE_TOLERANCE_CENTS (0)"
    error_id: ERR_CURE_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /margin-calls/{id}/cure"

# =============================================================================
# Table 5: API Endpoint Table   (api_prefix is "" — all collections are top-level)
# =============================================================================
endpoints:

  # ------------------------------------------------------------- custodians
  - method: POST
    path: "/custodians"
    description: "Register a tri-party custodian (state approval still pending)"
    roles: [StateRegulator]
    code: 201
    input: [name, custodian_type, "tri_party_capable?", "concentration_limit_bps?"]
    output: Custodian
    side_effects: ["approval_status := PENDING_APPROVAL"]

  - method: POST
    path: "/custodians/{id}/approve"
    description: "State approval of a custodian for public-funds safekeeping"
    roles: [StateRegulator]
    code: 200
    input: []
    output: Custodian
    side_effects: ["approval_status := APPROVED; approved_at := logical clock; version += 1"]

  - method: GET
    path: "/custodians/{id}"
    description: "Read one custodian"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, Custodian, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: []
    output: Custodian
    side_effects: []

  # ------------------------------------------------------- pooled programs
  - method: POST
    path: "/pooled-programs"
    description: "Create a state pooled collateral program"
    roles: [StateRegulator]
    code: 201
    input: [name, administrator_state, "minimum_pool_pct_bps?"]
    output: PooledCollateralProgram
    side_effects: ["aggregate totals and pool_posture initialised to 0 / ADEQUATE"]

  - method: GET
    path: "/pooled-programs/{id}"
    description: "Read one pooled program including aggregate_collateral_value_cents, unallocated_collateral_cents and pool_posture"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: []
    output: PooledCollateralProgram
    side_effects: []

  - method: GET
    path: "/pooled-programs/{id}/depositories"
    description: "List member depositories of a pooled program (reverse reachability for Depository.pooled_program_id)"
    roles: [StateRegulator, BankCollateralOfficer, PublicUnitTreasurer]
    code: 200
    input: ["approval_status?", "limit?", "offset?"]
    output: Depository[]
    side_effects: []

  # ----------------------------------------------------------- public units
  - method: POST
    path: "/public-units"
    description: "Register a public unit (government depositor)"
    roles: [StateRegulator]
    code: 201
    input: [name, unit_type, jurisdiction_state, statutory_max_deposit_cents, "collateral_program_preference?", "reporting_frequency?"]
    output: PublicUnit
    side_effects: ["exposure_status := NORMAL; totals := 0"]

  - method: GET
    path: "/public-units/{id}"
    description: "Read one public unit including exposure_status and total_uninsured_cents"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: []
    output: PublicUnit
    side_effects: []

  # ----------------------------------------------------------- depositories
  - method: POST
    path: "/depositories"
    description: "Register a bank as a candidate public-funds depository (approval_status starts at DRAFT)"
    roles: [BankCollateralOfficer]
    code: 201
    input: [name, charter_type, home_state, "capital_ratio_bps?", "insurance_determination_basis?", "pooled_program_id?"]
    output: Depository
    side_effects: ["capital_tier derived from capital_ratio_bps; approval_status := DRAFT; collateral_posture := COMPLIANT; risk_grade := A"]

  - method: GET
    path: "/depositories/{id}"
    description: "Read one depository including capital_tier, collateral_posture, risk_grade, consecutive_deficiency_runs and version"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, Custodian, SystemOperator]
    code: 200
    input: []
    output: Depository
    side_effects: []

  - method: GET
    path: "/depositories"
    description: "List depositories with filters (reverse reachability for Depository.pooled_program_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: ["approval_status?", "pooled_program_id?", "collateral_posture?", "risk_grade?", "limit?", "offset?"]
    output: Depository[]
    side_effects: []

  - method: POST
    path: "/depositories/{id}/qualification-reviews"
    description: "Open a qualification review (application) for state approval; records the submitting X-User-ID"
    roles: [BankCollateralOfficer]
    code: 201
    input: [requested_pledge_capacity_cents]
    output: QualificationReview
    side_effects: ["status := SUBMITTED; submitted_by_user_id := X-User-ID; round_count := 1"]

  - method: GET
    path: "/depositories/{id}/qualification-reviews"
    description: "List a depository's qualification reviews (reverse reachability for QualificationReview.depository_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QualificationReview[]
    side_effects: []

  - method: POST
    path: "/qualification-reviews/{id}/attest"
    description: "Second-line attestation of the qualification package; the attester's X-User-ID must differ from submitted_by_user_id"
    roles: [BankComplianceOfficer]
    code: 200
    input: [attestation_note]
    output: QualificationReview
    side_effects: ["status := ATTESTED; attested_by_user_id := X-User-ID; round_count += 1 when re-attesting a RETURNED_FOR_INFO review; version += 1"]

  - method: POST
    path: "/qualification-reviews/{id}/begin-review"
    description: "Regulator takes the attested package under review"
    roles: [StateRegulator]
    code: 200
    input: []
    output: QualificationReview
    side_effects: ["QualificationReview.status := UNDER_REVIEW; Depository.approval_status := UNDER_REVIEW; Depository.version += 1"]

  - method: POST
    path: "/qualification-reviews/{id}/return-for-info"
    description: "Regulator returns the package for more information (opens a new review round)"
    roles: [StateRegulator]
    code: 200
    input: [info_request_note]
    output: QualificationReview
    side_effects: ["status := RETURNED_FOR_INFO; attested_by_user_id := null; version += 1"]

  - method: POST
    path: "/qualification-reviews/{id}/decide"
    description: "Regulator approves or denies the depository for public unit deposits"
    roles: [StateRegulator]
    code: 200
    input: [decision, "decision_note?"]
    output: QualificationReview
    side_effects: ["status := APPROVED|DENIED; decided_at := clock; Depository.approval_status := APPROVED|DENIED; Depository.approved_pledge_capacity_cents := requested_pledge_capacity_cents on approval; Depository.version += 1"]

  - method: POST
    path: "/depositories/{id}/suspend"
    description: "Regulator suspends an approved depository; fires the depth-4 cascade (accounts RESTRICTED -> units ESCALATED -> forecasts STALE)"
    roles: [StateRegulator]
    code: 200
    input: []
    output: Depository
    side_effects: ["approval_status := SUSPENDED; version += 1", "cascade hops 2-4 per §1.2 Depository APPROVED->SUSPENDED"]

  # --------------------------------------------------------- deposit accounts
  - method: POST
    path: "/deposit-accounts"
    description: "Open a public unit deposit account at an approved depository"
    roles: [PublicUnitTreasurer]
    code: 201
    input: [depository_id, public_unit_id, deposit_class, pledging_mode]
    output: DepositAccount
    side_effects: ["group_sequence assigned (monotone from 1 within the (public_unit_id, depository_id, deposit_class) group)", "funding_status := PENDING_FUNDING; collateral_status := UNSECURED; balances and requirement := 0"]

  - method: GET
    path: "/deposit-accounts/{id}"
    description: "Read one deposit account including insured/uninsured amounts, required_collateral_pct_bps, coverage_ratio_bps, both status dimensions and version"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: []
    output: DepositAccount
    side_effects: []

  - method: GET
    path: "/deposit-accounts"
    description: "List deposit accounts with filters (reverse reachability for depository_id and public_unit_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: ["depository_id?", "public_unit_id?", "deposit_class?", "funding_status?", "collateral_status?", "limit?", "offset?"]
    output: DepositAccount[]
    side_effects: []

  - method: POST
    path: "/deposit-accounts/{id}/deposits"
    description: "Credit public funds to the account; re-runs the insurance waterfall for the whole insurance group and every downstream collateral computation"
    roles: [PublicUnitTreasurer]
    code: 200
    input: [amount_cents]
    output: DepositAccount
    side_effects: ["ledger_balance_cents += amount_cents; funding_status := FUNDED", "recompute insured_amount_determination for the group in group_sequence ASC order", "recompute required_collateral_percentage, assigned_collateral_value_cents (or pooled_collateral_waterfall), coverage_ratio_bps, collateral_status", "recompute PublicUnit totals + exposure_status and Depository.total_required_collateral_cents", "version += 1"]

  - method: POST
    path: "/deposit-accounts/{id}/withdrawals"
    description: "Debit public funds (tax-cycle runoff); reverses the same computation chain as a deposit"
    roles: [PublicUnitTreasurer]
    code: 200
    input: [amount_cents]
    output: DepositAccount
    side_effects: ["ledger_balance_cents -= amount_cents (funding_status stays FUNDED even at 0)", "same recomputation chain as deposits", "version += 1"]

  - method: GET
    path: "/deposit-accounts/{id}/coverage-report"
    description: "Public unit reporting: point-in-time collateralisation report for one account"
    roles: [StateRegulator, PublicUnitTreasurer, BankComplianceOfficer]
    code: 200
    input: []
    output: { insured_amount_cents: integer, uninsured_amount_cents: integer, required_collateral_pct_bps: integer, required_collateral_cents: integer, assigned_collateral_value_cents: integer, coverage_ratio_bps: integer, collateral_status: string, pledging_mode: string, insurance_determination_basis: string, report_as_of: string }
    side_effects: []

  - method: GET
    path: "/deposit-accounts/{id}/runoff-forecasts"
    description: "List runoff forecasts of one account (reverse reachability for RunoffForecast.deposit_account_id)"
    roles: [StateRegulator, PublicUnitTreasurer, BankCollateralOfficer]
    code: 200
    input: ["status?", "cycle_label?", "limit?", "offset?"]
    output: RunoffForecast[]
    side_effects: []

  # -------------------------------------------------------- pledge agreements
  - method: POST
    path: "/pledge-agreements"
    description: "Draft a tri-party pledge agreement; beneficiary_type DEPOSIT_ACCOUNT requires deposit_account_id, POOLED_PROGRAM requires pooled_program_id"
    roles: [BankCollateralOfficer]
    code: 201
    input: [depository_id, custodian_id, beneficiary_type, agreement_number, governing_law_state, "deposit_account_id?", "pooled_program_id?"]
    output: PledgeAgreement
    side_effects: ["status := DRAFT; signature_count := 0; amendment_round := 0"]

  - method: GET
    path: "/pledge-agreements/{id}"
    description: "Read one pledge agreement including signature stamps, signature_count, totals and version"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, Custodian, SystemOperator]
    code: 200
    input: []
    output: PledgeAgreement
    side_effects: []

  - method: GET
    path: "/pledge-agreements"
    description: "List pledge agreements with filters (reverse reachability for depository_id, custodian_id, deposit_account_id, pooled_program_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, Custodian]
    code: 200
    input: ["depository_id?", "custodian_id?", "deposit_account_id?", "pooled_program_id?", "beneficiary_type?", "status?", "limit?", "offset?"]
    output: PledgeAgreement[]
    side_effects: []

  - method: POST
    path: "/pledge-agreements/{id}/circulate"
    description: "Circulate the draft agreement for tri-party signature"
    roles: [BankCollateralOfficer]
    code: 200
    input: []
    output: PledgeAgreement
    side_effects: ["status := PENDING_SIGNATURES; version += 1"]

  - method: POST
    path: "/pledge-agreements/{id}/signatures"
    description: "Record one party's signature (party in DEPOSITORY|PUBLIC_UNIT|CUSTODIAN); the third signature executes the agreement. StateRegulator may stamp PUBLIC_UNIT only on a POOLED_PROGRAM-beneficiary agreement (see priority 75)"
    roles: [BankComplianceOfficer, PublicUnitTreasurer, Custodian, StateRegulator]
    code: 200
    input: [party]
    output: PledgeAgreement
    side_effects: ["<party>_signed_at := clock; signature_count += 1", "at signature_count == 3: status := EXECUTED; executed_at := clock", "version += 1"]

  - method: POST
    path: "/pledge-agreements/{id}/request-amendment"
    description: "Public unit or regulator requests an amendment, voiding all collected signatures"
    roles: [PublicUnitTreasurer, StateRegulator]
    code: 200
    input: []
    output: PledgeAgreement
    side_effects: ["status := AMENDMENT_REQUESTED; all *_signed_at := null; signature_count := 0; amendment_round += 1; version += 1"]

  - method: POST
    path: "/pledge-agreements/{id}/terminate"
    description: "Terminate an executed agreement and release every ACTIVE allocation under it"
    roles: [StateRegulator]
    code: 200
    input: []
    output: PledgeAgreement
    side_effects: ["status := TERMINATED; terminated_at := clock", "each ACTIVE PledgeAllocation := RELEASED with release_reason AGREEMENT_TERMINATED; asset par returned", "beneficiary coverage / pool totals recomputed", "version += 1"]

  - method: GET
    path: "/pledge-agreements/{id}/safekeeping-receipts"
    description: "List safekeeping receipts issued under one agreement (reverse reachability for SafekeepingReceipt.pledge_agreement_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, Custodian, PublicUnitTreasurer]
    code: 200
    input: ["confirmation_status?", "limit?", "offset?"]
    output: SafekeepingReceipt[]
    side_effects: []

  # -------------------------------------------------------- collateral assets
  - method: POST
    path: "/collateral-assets"
    description: "Register an eligible collateral asset held at a custodian; haircut derived from asset_type"
    roles: [BankCollateralOfficer]
    code: 201
    input: [depository_id, custodian_id, cusip, asset_type, par_value_cents, "market_price_bps?"]
    output: CollateralAsset
    side_effects: ["haircut_bps := HAIRCUT_BPS_BY_TYPE[asset_type]; priced_at := clock", "market_value_cents and collateral_value_cents computed per allocation_collateral_valuation", "available_par_cents := par_value_cents; pledged_par_cents := 0; eligibility_status := ELIGIBLE; pledge_status := UNPLEDGED"]

  - method: GET
    path: "/collateral-assets/{id}"
    description: "Read one collateral asset including haircut_bps, market_value_cents, collateral_value_cents, available_par_cents and version"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, Custodian, SystemOperator]
    code: 200
    input: []
    output: CollateralAsset
    side_effects: []

  - method: GET
    path: "/collateral-assets"
    description: "List collateral assets with filters (reverse reachability for depository_id and custodian_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, Custodian, SystemOperator]
    code: 200
    input: ["depository_id?", "custodian_id?", "asset_type?", "eligibility_status?", "pledge_status?", "limit?", "offset?"]
    output: CollateralAsset[]
    side_effects: []

  - method: POST
    path: "/collateral-assets/{id}/prices"
    description: "Post a new market price (mark-to-market input); revalues the asset and every ACTIVE allocation on it"
    roles: [SystemOperator, BankCollateralOfficer]
    code: 200
    input: [market_price_bps]
    output: CollateralAsset
    side_effects: ["market_price_bps updated; priced_at := clock; market_value_cents / collateral_value_cents recomputed", "each ACTIVE allocation's allocated_collateral_value_cents recomputed, then agreement / pool / account coverage recomputed", "version += 1"]

  - method: POST
    path: "/collateral-assets/{id}/mark-ineligible"
    description: "Regulator declares an asset ineligible; releases all ACTIVE allocations on it"
    roles: [StateRegulator]
    code: 200
    input: [ineligible_reason]
    output: CollateralAsset
    side_effects: ["eligibility_status := INELIGIBLE; collateral_value_cents := 0", "each ACTIVE allocation := RELEASED with release_reason ASSET_INELIGIBLE; par returned to available_par_cents", "downstream coverage recomputed for every affected account", "version += 1"]

  # ------------------------------------------------------- pledge allocations
  - method: POST
    path: "/pledge-allocations"
    description: "Pledge part of an asset's par to an executed agreement for a half-open effective interval [effective_from, effective_to)"
    roles: [BankCollateralOfficer]
    code: 201
    input: [pledge_agreement_id, collateral_asset_id, allocated_par_cents, effective_from, expected_pledge_agreement_version, "effective_to?"]
    output: PledgeAllocation
    side_effects: ["status := ACTIVE; effective_to defaults to OPEN_ENDED_SENTINEL", "allocated_collateral_value_cents computed per allocation_collateral_valuation", "CollateralAsset.pledged_par_cents += allocated_par_cents; available_par_cents -= allocated_par_cents; pledge_status updated", "PledgeAgreement totals and active_allocation_count updated; increments PledgeAgreement.version by 1", "beneficiary coverage recomputed (dedicated account, or pooled_collateral_waterfall across the program)"]

  - method: GET
    path: "/pledge-allocations/{id}"
    description: "Read one pledge allocation including allocated_collateral_value_cents, interval, status and version"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, Custodian, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: []
    output: PledgeAllocation
    side_effects: []

  - method: GET
    path: "/pledge-allocations"
    description: "List pledge allocations with filters (reverse reachability for pledge_agreement_id, collateral_asset_id and created_by_substitution_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, Custodian, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: ["pledge_agreement_id?", "collateral_asset_id?", "created_by_substitution_id?", "status?", "limit?", "offset?"]
    output: PledgeAllocation[]
    side_effects: []

  - method: POST
    path: "/pledge-allocations/{id}/release"
    description: "Release a pledged allocation back to the depository's free collateral"
    roles: [BankCollateralOfficer]
    code: 200
    input: []
    output: PledgeAllocation
    side_effects: ["status := RELEASED; released_at := clock; release_reason := OFFICER_RELEASE", "asset par returned; agreement totals and beneficiary coverage recomputed", "version += 1"]

  # ------------------------------------------------------ substitution requests
  - method: POST
    path: "/substitution-requests"
    description: "Request substitution of one pledged allocation for par on a different eligible asset (fork-join approval)"
    roles: [BankCollateralOfficer]
    code: 201
    input: [pledge_agreement_id, outgoing_allocation_id, incoming_asset_id, incoming_par_cents]
    output: SubstitutionRequest
    side_effects: ["status := SUBMITTED; submitted_by_user_id := X-User-ID; compliance_approved_at and custodian_acked_at := null", "value_adequacy_delta_cents := incoming collateral value - outgoing collateral value, both computed per allocation_collateral_valuation at request time"]

  - method: GET
    path: "/substitution-requests/{id}"
    description: "Read one substitution request including both approval stamps, value_adequacy_delta_cents and version"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, Custodian, SystemOperator]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []

  - method: GET
    path: "/substitution-requests"
    description: "List substitution requests with filters (reverse reachability for pledge_agreement_id, outgoing_allocation_id and incoming_asset_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, Custodian, SystemOperator]
    code: 200
    input: ["pledge_agreement_id?", "outgoing_allocation_id?", "incoming_asset_id?", "status?", "limit?", "offset?"]
    output: SubstitutionRequest[]
    side_effects: []

  - method: POST
    path: "/substitution-requests/{id}/compliance-approve"
    description: "Compliance leg of the fork-join; requester and approver X-User-ID must differ"
    roles: [BankComplianceOfficer]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["compliance_approved_at := clock; compliance_approved_by_user_id := X-User-ID", "status := COMPLIANCE_APPROVED, or READY_TO_SETTLE when custodian_acked_at is already set", "version += 1"]

  - method: POST
    path: "/substitution-requests/{id}/custodian-ack"
    description: "Custodian leg of the fork-join; only the custodian on the agreement may acknowledge"
    roles: [Custodian]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["custodian_acked_at := clock", "status := CUSTODIAN_ACKED, or READY_TO_SETTLE when compliance_approved_at is already set", "version += 1"]

  - method: POST
    path: "/substitution-requests/{id}/settle"
    description: "Settle the substitution at the custodian; fires the depth-4 swap cascade"
    roles: [Custodian]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["status := SETTLED; settled_at := clock", "outgoing allocation := SUBSTITUTED; new ACTIVE allocation created with created_by_substitution_id := this request", "cascade hops 2-4 per §1.2 SubstitutionRequest READY_TO_SETTLE->SETTLED", "version += 1"]

  - method: POST
    path: "/substitution-requests/{id}/reject"
    description: "Compliance rejects the substitution request"
    roles: [BankComplianceOfficer]
    code: 200
    input: [rejection_reason]
    output: SubstitutionRequest
    side_effects: ["status := REJECTED; version += 1"]

  - method: POST
    path: "/substitution-requests/{id}/withdraw"
    description: "Requesting officer withdraws a request that has not settled"
    roles: [BankCollateralOfficer]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["status := WITHDRAWN; version += 1"]

  # ------------------------------------------------------- mark-to-market runs
  - method: POST
    path: "/depositories/{id}/mtm-runs"
    description: "Execute a mark-to-market run over the closed window [window_start, window_end]; evaluates coverage, issues a margin call on deficiency and scores the depository"
    roles: [BankCollateralOfficer, StateRegulator]
    code: 201
    input: [window_start, window_end, basis, expected_depository_version]
    output: MarkToMarketRun
    side_effects: ["run_index := Depository.mtm_run_index + 1; as_of := logical clock", "totals, deficiency_cents, deficiency_ratio_bps and outcome computed per mtm_run_evaluation", "on DEFICIENT: a MarginCall is created (status ISSUED) with required_cure_cents := deficiency_cents and cure_deadline_at from CURE_DEADLINE_HOURS_BY_RATIO; Depository.consecutive_deficiency_runs += 1 and open_margin_call_count += 1", "on SUFFICIENT: Depository.consecutive_deficiency_runs := 0", "at consecutive_deficiency_runs == FROZEN_TRIGGER_RUNS: Depository.collateral_posture := FROZEN", "risk components / risk_score_bps / risk_grade written per depository_risk_grade and copied to the Depository", "Depository.mtm_run_index and last_mtm_window_end updated; increments Depository.version by 1"]

  - method: GET
    path: "/depositories/{id}/mtm-runs"
    description: "List a depository's mark-to-market runs (reverse reachability for MarkToMarketRun.depository_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: ["basis?", "outcome?", "limit?", "offset?"]
    output: MarkToMarketRun[]
    side_effects: []

  - method: GET
    path: "/mtm-runs/{id}"
    description: "Read one immutable mark-to-market run (no version field: run records are never updated)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: []
    output: MarkToMarketRun
    side_effects: []

  # ------------------------------------------------------------- margin calls
  - method: GET
    path: "/margin-calls/{id}"
    description: "Read one margin call including outstanding_cents, cure_deadline_at, breach_deadline_at and version"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: []
    output: MarginCall
    side_effects: []

  - method: GET
    path: "/margin-calls"
    description: "List margin calls with filters (reverse reachability for depository_id and mtm_run_id)"
    roles: [StateRegulator, BankCollateralOfficer, BankComplianceOfficer, PublicUnitTreasurer, SystemOperator]
    code: 200
    input: ["depository_id?", "mtm_run_id?", "status?", "limit?", "offset?"]
    output: MarginCall[]
    side_effects: []

  - method: POST
    path: "/margin-calls/{id}/cure"
    description: "Credit newly pledged allocations against an open margin call; only allocations created strictly after the issuing run's as_of count"
    roles: [BankCollateralOfficer]
    code: 200
    input: [credited_allocation_ids]
    output: MarginCall
    side_effects: ["cured_cents += credited value per margin_call_cure_accounting; outstanding_cents recomputed", "status := PARTIALLY_CURED while outstanding_cents > 0, or CURED with cured_at := clock at 0", "on CURED: Depository.open_margin_call_count -= 1 and collateral_posture recomputed", "version += 1"]

  # ------------------------------------------------------ safekeeping receipts
  - method: POST
    path: "/safekeeping-receipts"
    description: "Custodian issues a safekeeping receipt for the collateral it holds under an executed agreement"
    roles: [Custodian]
    code: 201
    input: [pledge_agreement_id, receipt_number, reported_par_cents, reported_asset_count]
    output: SafekeepingReceipt
    side_effects: ["as_of := clock; confirmation_status := ISSUED", "ledger_par_cents / ledger_asset_count / discrepancy_par_cents computed per safekeeping_reconciliation over ACTIVE allocations effective at as_of"]

  - method: POST
    path: "/safekeeping-receipts/{id}/confirm"
    description: "Audit confirmation of a safekeeping receipt; confirms only when discrepancy_par_cents is within RECEIPT_DISCREPANCY_TOLERANCE_CENTS, otherwise records an exception"
    roles: [StateRegulator]
    code: 200
    input: []
    output: SafekeepingReceipt
    side_effects: ["confirmation_status := CONFIRMED when |discrepancy_par_cents| <= RECEIPT_DISCREPANCY_TOLERANCE_CENTS, else EXCEPTION", "confirmed_by_user_id := X-User-ID; confirmed_at := clock", "no depository field changes: the exception is recorded on the receipt only", "version += 1"]

  # ------------------------------------------------------- runoff forecasting
  - method: POST
    path: "/runoff-forecasts"
    description: "Create a deposit runoff forecast over a contiguous chain of half-open projection windows around a tax collection / disbursement cycle; supersedes the account's current OPEN forecast for the same cycle_label"
    roles: [PublicUnitTreasurer]
    code: 201
    input: [deposit_account_id, cycle_label, basis, horizon_start, horizon_end, projected_windows, expected_deposit_account_version]
    output: RunoffForecast
    side_effects: ["status := OPEN; requires_reforecast := false", "projected_peak_balance_cents / projected_required_collateral_cents / unpledged_capacity_cents / pledge_capacity_gap_cents computed per runoff_collateral_projection for the declared basis", "any prior OPEN or STALE forecast for the same (deposit_account_id, cycle_label) := SUPERSEDED with superseded_at := clock", "increments DepositAccount.version by 1"]

  - method: GET
    path: "/runoff-forecasts/{id}"
    description: "Read one runoff forecast including projected figures, status, requires_reforecast and version"
    roles: [StateRegulator, PublicUnitTreasurer, BankCollateralOfficer, BankComplianceOfficer, SystemOperator]
    code: 200
    input: []
    output: RunoffForecast
    side_effects: []

  # ------------------------------------------------ test-driving / ops endpoints
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the service's logical clock. The logical clock starts at DEFAULT_CLOCK_UTC 2026-08-01T00:00:00Z on a fresh service and every created_at / *_at / as_of stamp reads from it, so all time-dependent behaviour (cure deadlines, price staleness, effective intervals) is deterministically testable."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601 (no domain records are mutated)"]

  - method: POST
    path: "/_ops/run-daily-cycle"
    description: "Ops run checkpoint: sweeps open margin calls at the current logical clock, escalating those past cure_deadline_at and breaching those past breach_deadline_at (a breach suspends the depository and fires the depth-4 suspension cascade)"
    roles: [SystemOperator]
    code: 200
    input: []
    output: { escalated_margin_call_count: integer, breached_margin_call_count: integer, suspended_depository_count: integer, stale_priced_asset_count: integer, current_utc: string }
    side_effects: ["ISSUED / PARTIALLY_CURED margin calls past cure_deadline_at := ESCALATED with escalated_at := clock and breach_deadline_at := escalated_at + ESCALATION_GRACE_HOURS", "ESCALATED margin calls past breach_deadline_at := BREACHED; the owning Depository is suspended and the §1.2 Depository APPROVED->SUSPENDED cascade runs", "counts assets whose priced_at is older than PRICE_STALE_HOURS relative to the clock (reporting only, no mutation)"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization -----------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty on any endpoint"

  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Acting X-User-Role is not listed in the endpoint's roles"

  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Entity-backed caller acts on a resource it does not own: PublicUnitTreasurer whose X-User-ID differs from the account's public_unit_id, or Custodian whose X-User-ID differs from the agreement's custodian_id"

  - id: ERR_SIGNATURE_PARTY_MISMATCH
    http: 403
    condition: "Signing role does not match the requested party (DEPOSITORY requires BankComplianceOfficer, PUBLIC_UNIT requires the beneficiary PublicUnitTreasurer, CUSTODIAN requires the agreement's Custodian)"

  # --- existence / request shape ----------------------------------------
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path id or referenced FK id does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum value, non-positive amount, malformed ISO-8601 timestamp, or pagination outside limit 1..100 / offset >= 0"

  # --- optimistic concurrency -------------------------------------------
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_pledge_agreement_version does not equal the stored PledgeAgreement.version on POST /pledge-allocations"

  - id: ERR_STALE_DEPOSITORY_VERSION
    http: 412
    condition: "expected_depository_version does not equal the stored Depository.version on POST /depositories/{id}/mtm-runs"

  - id: ERR_STALE_DEPOSIT_ACCOUNT_VERSION
    http: 412
    condition: "expected_deposit_account_version does not equal the stored DepositAccount.version on POST /runoff-forecasts"

  # --- state machine ----------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the entity's current state (includes terminal-state lockdown: DENIED depository, SETTLED/REJECTED/WITHDRAWN substitution, TERMINATED agreement, CURED/BREACHED margin call, SUPERSEDED forecast)"

  - id: ERR_DEPOSITORY_NOT_APPROVED
    http: 409
    condition: "Depository.approval_status is not APPROVED when opening a deposit account, drafting a pledge agreement or registering collateral"

  - id: ERR_DEPOSITORY_POSTURE_FROZEN
    http: 409
    condition: "Depository.collateral_posture is FROZEN (three consecutive deficient mark-to-market runs) and the operation would add or move pledged collateral"

  - id: ERR_AGREEMENT_NOT_EXECUTED
    http: 409
    condition: "PledgeAgreement.status is not EXECUTED when allocating collateral, substituting collateral or issuing a safekeeping receipt"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Acting X-User-ID equals the user who performed the incompatible earlier step (attester equals submitter on a qualification review, compliance approver equals substitution requester)"

  - id: ERR_CUSTODIAN_NOT_ELIGIBLE
    http: 409
    condition: "Custodian.approval_status is not APPROVED, or tri_party_capable is false for a tri-party pledge agreement"

  - id: ERR_DEPOSITORY_RISK_GRADE_BLOCKED
    http: 409
    condition: "Depository.risk_grade is D when opening a new deposit account at that depository"

  - id: ERR_MTM_WINDOW_OVERLAP
    http: 409
    condition: "New mark-to-market window [window_start, window_end] (closed on both ends) overlaps the depository's last_mtm_window_end, or starts within MTM_MIN_GAP_HOURS of it"

  - id: ERR_CURE_WINDOW_CLOSED
    http: 409
    condition: "Cure posted after cure_deadline_at on an ISSUED/PARTIALLY_CURED call, or after breach_deadline_at on an ESCALATED call"

  - id: ERR_ALLOCATION_OVERSUBSCRIBED
    http: 409
    condition: "Sum of allocated_par_cents of ACTIVE allocations whose half-open effective intervals overlap the requested interval, plus the requested par, exceeds CollateralAsset.par_value_cents (adjacent intervals sharing an endpoint do not overlap)"

  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "agreement_number, receipt_number or (depository_id, cusip) already exists"

  - id: ERR_ROUND_LIMIT_REACHED
    http: 409
    condition: "QualificationReview.round_count would exceed REVIEW_ROUND_LIMIT (3), or PledgeAgreement.amendment_round would exceed AMENDMENT_ROUND_LIMIT (2)"

  - id: ERR_PARTY_ALREADY_SIGNED
    http: 409
    condition: "The requested party's *_signed_at stamp is already set in the current amendment round"

  # --- business rules ---------------------------------------------------
  - id: ERR_COLLATERAL_TYPE_INELIGIBLE
    http: 422
    condition: "asset_type is not an eligible collateral type for public funds (MUNI_REVENUE is never eligible), or the asset's eligibility_status is INELIGIBLE"

  - id: ERR_CUSTODIAN_MISMATCH
    http: 422
    condition: "CollateralAsset.custodian_id differs from PledgeAgreement.custodian_id on allocation or substitution"

  - id: ERR_DEPOSITORY_MISMATCH
    http: 422
    condition: "Referenced records belong to different depositories (asset vs agreement, account vs agreement, allocation vs margin call)"

  - id: ERR_BENEFICIARY_TARGET_INVALID
    http: 422
    condition: "beneficiary_type DEPOSIT_ACCOUNT without deposit_account_id (or with pooled_program_id), or POOLED_PROGRAM without pooled_program_id (or with deposit_account_id), or a POOLED_PROGRAM agreement naming a program the depository is not a member of"

  - id: ERR_PLEDGING_MODE_MISMATCH
    http: 422
    condition: "Requested pledging_mode differs from the owning PublicUnit.collateral_program_preference, or a POOLED account is opened at a depository with no pooled_program_id"

  - id: ERR_ALLOCATION_NOT_UNDER_AGREEMENT
    http: 422
    condition: "outgoing_allocation_id (substitution) or a credited_allocation_id (cure) does not belong to the referenced pledge agreement or depository"

  - id: ERR_STALE_COLLATERAL_PRICE
    http: 422
    condition: "CollateralAsset.priced_at is older than PRICE_STALE_HOURS (48) relative to the logical clock when pledging or substituting"

  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "effective_from >= effective_to, window_start >= window_end, horizon_start >= horizon_end, or a window end lies in the future relative to the logical clock for a mark-to-market run"

  - id: ERR_FORECAST_WINDOW_DISCONTINUITY
    http: 422
    condition: "projected_windows are not a contiguous half-open chain covering [horizon_start, horizon_end) exactly (gap, overlap, or uncovered tail)"

  - id: ERR_CUSTODIAN_CONCENTRATION_EXCEEDED
    http: 422
    condition: "Collateral value pledged through one custodian would exceed Custodian.concentration_limit_bps of the depository's total pledged collateral value"

  - id: ERR_CURE_ALLOCATION_INELIGIBLE
    http: 422
    condition: "A credited allocation is not ACTIVE, or was created at or before the issuing mark-to-market run's as_of, or has already been credited to another margin call"

  - id: ERR_SUBSTITUTION_VALUE_SHORTFALL
    http: 422
    condition: "value_adequacy_delta_cents is negative: the incoming collateral value is below the outgoing collateral value"

  - id: ERR_STATUTORY_DEPOSIT_LIMIT
    http: 422
    condition: "Resulting ledger balances for the public unit would exceed PublicUnit.statutory_max_deposit_cents"

  - id: ERR_INSUFFICIENT_LEDGER_BALANCE
    http: 422
    condition: "Withdrawal amount_cents exceeds DepositAccount.ledger_balance_cents"

  - id: ERR_PLEDGE_CAPACITY_EXCEEDED
    http: 422
    condition: "Total pledged par for the depository would exceed Depository.approved_pledge_capacity_cents"

  - id: ERR_CAPACITY_ABOVE_STATUTORY_CEILING
    http: 422
    condition: "requested_pledge_capacity_cents exceeds PLEDGE_CAPACITY_STATUTORY_CEILING_CENTS"

  - id: ERR_CURE_EXCEEDS_OUTSTANDING
    http: 422
    condition: "Credited cure value exceeds outstanding_cents plus CURE_OVERAGE_TOLERANCE_CENTS (0)"

# =============================================================================
# Table 7: RBAC Matrix   (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: StateRegulator
    description: "State treasurer's office / banking department: qualifies and approves depositories, administers pooled collateral programs, registers public units and custodians, confirms safekeeping receipts, declares collateral ineligible, and suspends or terminates arrangements"
    identity: opaque
    exclusive_operations:
      - "POST /custodians — Register a custodian"
      - "POST /custodians/{id}/approve — Approve a custodian"
      - "POST /pooled-programs — Create a pooled collateral program"
      - "POST /public-units — Register a public unit"
      - "POST /qualification-reviews/{id}/begin-review — Take a package under review"
      - "POST /qualification-reviews/{id}/return-for-info — Return a package for more information"
      - "POST /qualification-reviews/{id}/decide — Approve or deny a depository"
      - "POST /depositories/{id}/suspend — Suspend an approved depository"
      - "POST /collateral-assets/{id}/mark-ineligible — Declare an asset ineligible"
      - "POST /pledge-agreements/{id}/terminate — Terminate an executed agreement"
      - "POST /safekeeping-receipts/{id}/confirm — Audit-confirm a safekeeping receipt"
    shared_operations:
      - "POST /depositories/{id}/mtm-runs — Execute a mark-to-market run (shared with BankCollateralOfficer)"
      - "POST /pledge-agreements/{id}/request-amendment — Request an amendment (shared with PublicUnitTreasurer)"
      - "POST /pledge-agreements/{id}/signatures — Sign as party PUBLIC_UNIT on a POOLED_PROGRAM-beneficiary agreement only (shared endpoint, party-restricted)"
      - "GET on custodians, pooled programs, public units, depositories, deposit accounts, coverage reports, pledge agreements, collateral assets, allocations, substitution requests, mark-to-market runs, margin calls, safekeeping receipts and runoff forecasts"

  - name: BankCollateralOfficer
    description: "First line of the bank's public funds group: registers the depository, files qualification packages, posts prices, registers and pledges collateral, requests substitutions, runs mark-to-market and cures margin calls"
    identity: opaque
    exclusive_operations:
      - "POST /depositories — Register a candidate depository"
      - "POST /depositories/{id}/qualification-reviews — File a qualification package"
      - "POST /pledge-agreements — Draft a pledge agreement"
      - "POST /pledge-agreements/{id}/circulate — Circulate for signature"
      - "POST /collateral-assets — Register a collateral asset"
      - "POST /pledge-allocations — Pledge asset par to an agreement"
      - "POST /pledge-allocations/{id}/release — Release an allocation"
      - "POST /substitution-requests — Request a collateral substitution"
      - "POST /substitution-requests/{id}/withdraw — Withdraw a substitution request"
      - "POST /margin-calls/{id}/cure — Cure an open margin call"
    shared_operations:
      - "POST /depositories/{id}/mtm-runs — Execute a mark-to-market run (shared with StateRegulator)"
      - "POST /collateral-assets/{id}/prices — Post a market price (shared with SystemOperator)"
      - "GET on pooled programs, depositories, deposit accounts, pledge agreements, collateral assets, allocations, substitution requests, mark-to-market runs, margin calls, safekeeping receipts and runoff forecasts"

  - name: BankComplianceOfficer
    description: "Second line of the bank: attests qualification packages, signs on behalf of the depository, and independently approves or rejects substitution requests. Cannot originate the work it reviews (segregation of duties enforced on X-User-ID)"
    identity: opaque
    exclusive_operations:
      - "POST /qualification-reviews/{id}/attest — Attest a qualification package"
      - "POST /substitution-requests/{id}/compliance-approve — Approve a substitution"
      - "POST /substitution-requests/{id}/reject — Reject a substitution"
    shared_operations:
      - "POST /pledge-agreements/{id}/signatures — Sign as party DEPOSITORY (shared endpoint, party-restricted)"
      - "GET on depositories, qualification reviews, deposit accounts, coverage reports, pledge agreements, collateral assets, allocations, substitution requests, mark-to-market runs, margin calls, safekeeping receipts and runoff forecasts"

  - name: Custodian
    description: "Tri-party custodian bank holding the pledged collateral: signs as custodian, acknowledges and settles substitutions, and issues safekeeping receipts for the agreements naming it"
    identity: "entity_backed:Custodian"
    exclusive_operations:
      - "POST /substitution-requests/{id}/custodian-ack — Acknowledge a substitution"
      - "POST /substitution-requests/{id}/settle — Settle a substitution at the custodian"
      - "POST /safekeeping-receipts — Issue a safekeeping receipt"
    shared_operations:
      - "POST /pledge-agreements/{id}/signatures — Sign as party CUSTODIAN (shared endpoint, party-restricted)"
      - "GET on its own custodian record, depositories, pledge agreements, collateral assets, allocations, substitution requests and safekeeping receipts"

  - name: PublicUnitTreasurer
    description: "Treasurer of the depositing public unit: opens accounts, deposits and withdraws public funds around tax collection and disbursement cycles, signs as public unit, requests amendments, reads coverage reports and files runoff forecasts. X-User-ID must equal the public_unit_id on the resources it touches"
    identity: "entity_backed:PublicUnit"
    exclusive_operations:
      - "POST /deposit-accounts — Open a deposit account"
      - "POST /deposit-accounts/{id}/deposits — Credit public funds"
      - "POST /deposit-accounts/{id}/withdrawals — Debit public funds"
      - "POST /runoff-forecasts — File a deposit runoff forecast"
    shared_operations:
      - "POST /pledge-agreements/{id}/signatures — Sign as party PUBLIC_UNIT (shared endpoint, party-restricted)"
      - "POST /pledge-agreements/{id}/request-amendment — Request an amendment (shared with StateRegulator)"
      - "GET on its own public unit record, its deposit accounts and coverage reports, depositories, pooled programs, pledge agreements, allocations, mark-to-market runs, margin calls, safekeeping receipts and runoff forecasts"

  - name: SystemOperator
    description: "Operational automation identity: drives the logical clock and the daily margin-call sweep, and feeds market prices from the pricing vendor. Holds no supervisory or bank authority"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — Set the logical clock"
      - "POST /_ops/run-daily-cycle — Run the daily escalation / breach sweep"
    shared_operations:
      - "POST /collateral-assets/{id}/prices — Post a market price (shared with BankCollateralOfficer)"
      - "GET on custodians, pooled programs, public units, depositories, deposit accounts, pledge agreements, collateral assets, allocations, substitution requests, mark-to-market runs, margin calls and runoff forecasts"
