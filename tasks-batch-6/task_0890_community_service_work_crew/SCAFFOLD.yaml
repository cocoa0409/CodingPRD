# =============================================================================
# Community-Service & Work-Crew Program — Scaffold (§1.0–§1.7)
# Expert difficulty. Primary archetype: compliance/audit; secondary: workflow
# orchestration. Flat entity topology, peer entities linked by FK references.
# =============================================================================

scenario: "Community-Service & Work-Crew Program: referral & hours-ordered, site/agency placement & waiver, check-in & hour verification, weekend/alternative & fee-conversion, non-compliance & report-back to court, insurance & supervision, completion certificate, reporting"

domain_name: community-service-work-crew
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers, derived_field_reconciliation]
  entity_topology: flat
  state_machine_shape: parallel   # plus cyclic (Referral, Placement) and branching (FeeConversion)
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties   # blended with peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Offender/participant legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (ISO 8601)" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: risk_level, type: enum, source: input, default: LOW, description: "LOW | MEDIUM | HIGH", constraints: "one of LOW, MEDIUM, HIGH" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Host site / agency name" }
      - { name: agency_type, type: enum, source: input, description: "NONPROFIT | GOVERNMENT | FAITH_BASED | OTHER", constraints: "one of NONPROFIT, GOVERNMENT, FAITH_BASED, OTHER" }
      - { name: address, type: string, source: input, description: "Physical address" }
      - { name: capacity_slots, type: integer, source: input, description: "Max concurrent participants on site at any instant", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: PROSPECTIVE, description: "PROSPECTIVE | ACCEPTING | PAUSED", constraints: "one of PROSPECTIVE, ACCEPTING, PAUSED" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site this liability policy covers" }
      - { name: carrier, type: string, source: input, description: "Insurance carrier name" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Liability coverage amount in cents", constraints: ">= 0" }
      - { name: effective_date, type: datetime, source: input, description: "Coverage start (ISO 8601)" }
      - { name: expiry_date, type: datetime, source: input, description: "Coverage expiry (ISO 8601); policy is invalid once logical clock reaches this instant" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED | REJECTED", constraints: "one of PENDING, VERIFIED, REJECTED" }

  - name: Supervisor
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site the supervisor staffs" }
      - { name: full_name, type: string, source: input, description: "Supervisor name" }
      - { name: max_concurrent_participants, type: integer, source: input, default: 5, description: "Advisory supervision ratio ceiling", constraints: ">= 1" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the person ordered to serve" }
      - { name: court_case_number, type: string, source: input, description: "Originating court docket number" }
      - { name: offense_class, type: enum, source: input, description: "INFRACTION | MISDEMEANOR | FELONY", constraints: "one of INFRACTION, MISDEMEANOR, FELONY" }
      - { name: hours_ordered, type: number, source: input, description: "Total service hours ordered by the court", constraints: "> 0; multiple of 0.25" }
      - { name: deadline_date, type: datetime, source: input, description: "Court-ordered completion deadline (ISO 8601)" }
      - { name: indigency_status, type: enum, source: input, default: NONE, description: "NONE | PARTIAL | FULL; drives sliding-scale fee-conversion rate", constraints: "one of NONE, PARTIAL, FULL" }
      - { name: hours_completed, type: number, source: computed, default: 0, description: "Sum of verified_hours over this referral's VERIFIED, non-VOIDED WorkSessions (round-per-session-then-sum)" }
      - { name: hours_converted, type: number, source: computed, default: 0, description: "Hours discharged via PAID FeeConversions (settled_hours); reversed on FeeConversion REVERSED" }
      - { name: hours_outstanding, type: number, source: computed, default: 0, description: "= hours_ordered - hours_completed - hours_converted (floored at 0)" }
      - { name: fees_settled_cents, type: integer, source: computed, default: 0, description: "Net conversion money: sum(settlement_fee_cents for PAID) - sum(for REVERSED)" }
      - { name: certificate_id, type: string, source: computed, default: null, description: "Certificate.id once a completion certificate is auto-issued; else null" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | NON_COMPLIANT | COMPLETED | CONVERTED | TERMINATED", constraints: "one of ACTIVE, NON_COMPLIANT, COMPLETED, CONVERTED, TERMINATED" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; the court referral being served" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; host site" }
      - { name: supervisor_id, type: string, source: input, description: "FK -> Supervisor.id; assigned supervisor (must belong to site_id)" }
      - { name: waiver_signed, type: boolean, source: system, default: false, description: "True once the participant signs the liability waiver" }
      - { name: waiver_signed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the waiver was signed" }
      - { name: waiver_signature_name, type: string, source: system, default: null, description: "Typed signature captured on waiver" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | ACTIVE | SUSPENDED | COMPLETED | TERMINATED", constraints: "one of PROPOSED, ACTIVE, SUSPENDED, COMPLETED, TERMINATED" }

  - name: WorkSession
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id; the placement this session serves" }
      - { name: participant_id, type: string, source: computed, description: "Participant of the placement's referral, denormalized at creation for overlap checks" }
      - { name: site_id, type: string, source: computed, description: "Site of the placement, denormalized at creation for capacity checks" }
      - { name: session_category, type: enum, source: input, default: STANDARD, description: "STANDARD | WEEKEND_CREW | ALTERNATIVE", constraints: "one of STANDARD, WEEKEND_CREW, ALTERNATIVE" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (ISO 8601)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end (ISO 8601); must be strictly after scheduled_start" }
      - { name: check_in_at, type: datetime, source: system, default: null, description: "Actual check-in instant" }
      - { name: check_out_at, type: datetime, source: system, default: null, description: "Actual check-out instant" }
      - { name: claimed_hours, type: number, source: computed, default: null, description: "Self-reported hours from (check_out_at - check_in_at), rounded to nearest 0.25 (round_half_up)" }
      - { name: verified_hours, type: number, source: computed, default: null, description: "Supervisor-attested hours credited to the referral; <= claimed_hours" }
      - { name: attendance_status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CHECKED_IN | COMPLETED | CANCELLED | VOIDED", constraints: "one of SCHEDULED, CHECKED_IN, COMPLETED, CANCELLED, VOIDED" }
      - { name: verification_status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED | DISPUTED | REJECTED", constraints: "one of PENDING, VERIFIED, DISPUTED, REJECTED" }

  - name: FeeConversion
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; referral whose outstanding hours are bought out" }
      - { name: hours_to_convert, type: number, source: input, description: "Hours the participant asks to discharge by fee", constraints: "> 0; multiple of 0.25" }
      - { name: indigency_status_snapshot, type: enum, source: computed, description: "Referral.indigency_status copied at request time; pins the rate tier" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Provisional fee computed at REQUESTED over hours_to_convert" }
      - { name: settlement_fee_cents, type: integer, source: computed, default: null, description: "Final fee computed at PAID over settled_hours" }
      - { name: settled_hours, type: number, source: computed, default: null, description: "= min(hours_to_convert, referral.hours_outstanding) measured at PAID" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID that created this conversion (segregation-of-duties key)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID that approved this conversion" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | DENIED | PAID | REVERSED", constraints: "one of REQUESTED, APPROVED, DENIED, PAID, REVERSED" }

  - name: ComplianceAction
    parent: null
    common_fields: false   # append-only court-facing event: id, created_at only
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; referral acted upon" }
      - { name: action_type, type: enum, source: input, description: "WARNING | REPORT_BACK", constraints: "one of WARNING, REPORT_BACK" }
      - { name: reason, type: string, source: input, description: "Narrative reason recorded for the court" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filing CourtClerk" }
      - { name: resulting_referral_status, type: enum, source: computed, description: "Referral.status immediately after this action (ACTIVE for WARNING, NON_COMPLIANT for REPORT_BACK)" }

  - name: Certificate
    parent: null
    common_fields: false   # immutable record: id, created_at only
    fields:
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; completed referral" }
      - { name: certificate_number, type: string, source: system, description: "Human-readable certificate number" }
      - { name: total_hours_credited, type: number, source: computed, description: "Referral.hours_completed + hours_converted at issuance" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Site
    initial_state: PROSPECTIVE
    terminal_states: []
    transitions:
      - from: PROSPECTIVE
        to: ACCEPTING
        trigger: "POST /sites/{id}/activate"
        actor: ProgramCoordinator
        preconditions:
          - "Site has >= 1 InsurancePolicy with status == VERIFIED whose expiry_date > current clock (else ERR_INSURANCE_INVALID)"
        side_effects: []
      - from: PAUSED
        to: ACCEPTING
        trigger: "POST /sites/{id}/activate"
        actor: ProgramCoordinator
        preconditions:
          - "Site has >= 1 InsurancePolicy with status == VERIFIED whose expiry_date > current clock (else ERR_INSURANCE_INVALID)"
        side_effects: []
      - from: ACCEPTING
        to: PAUSED
        trigger: "POST /sites/{id}/pause"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["New placements to this site are blocked while PAUSED; existing placements and sessions are unaffected"]

  - entity: InsurancePolicy
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /insurance-policies/{id}/verify"
        actor: ProgramCoordinator
        preconditions:
          - "expiry_date > current clock (else ERR_INSURANCE_INVALID)"
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /insurance-policies/{id}/reject"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []

  - entity: Referral
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CONVERTED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when hours_completed >= hours_ordered after a WorkSession verify credit)"
        actor: system
        preconditions:
          - "hours_completed >= hours_ordered (>= boundary; exact equality completes)"
          - "hours_outstanding == 0"
        side_effects:
          - "Auto-issue Certificate (certificate_number minted, total_hours_credited pinned); set certificate_id"
          - "Cascade: every ACTIVE Placement for this referral -> COMPLETED"
      - from: ACTIVE
        to: CONVERTED
        trigger: "system (automatic when a FeeConversion PAID drives hours_outstanding to 0)"
        actor: system
        preconditions:
          - "hours_outstanding == 0 and hours_completed < hours_ordered (remaining discharged by fee, not by work)"
        side_effects:
          - "Auto-issue Certificate; set certificate_id"
          - "Cascade: every ACTIVE Placement for this referral -> COMPLETED"
      - from: ACTIVE
        to: NON_COMPLIANT
        trigger: "POST /compliance-actions (action_type == REPORT_BACK)"
        actor: CourtClerk
        preconditions: []
        side_effects:
          - "Cascade: every ACTIVE Placement for this referral -> SUSPENDED"
      - from: NON_COMPLIANT
        to: ACTIVE
        trigger: "POST /referrals/{id}/reinstate"
        actor: CourtClerk
        preconditions: []
        side_effects:
          - "Cascade: every SUSPENDED Placement for this referral -> ACTIVE"
        note: "Cycle: ACTIVE -> NON_COMPLIANT -> ACTIVE (reinstatement loop)"
      - from: NON_COMPLIANT
        to: TERMINATED
        trigger: "POST /referrals/{id}/terminate"
        actor: CourtClerk
        preconditions: []
        side_effects:
          - "Cascade: every non-terminal Placement (PROPOSED/ACTIVE/SUSPENDED) for this referral -> TERMINATED"

  - entity: Placement
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /placements/{id}/activate"
        actor: ProgramCoordinator
        preconditions:
          - "Placement.waiver_signed == true (else ERR_WAIVER_REQUIRED)"
          - "Site.status == ACCEPTING (else ERR_SITE_NOT_ACCEPTING)"
          - "Site has a VERIFIED, non-expired InsurancePolicy (else ERR_INSURANCE_INVALID)"
          - "Referral.status == ACTIVE (else ERR_REFERRAL_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade from Referral ACTIVE -> NON_COMPLIANT)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: every SCHEDULED WorkSession under this placement -> CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade from Referral NON_COMPLIANT -> ACTIVE reinstatement)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (cascade from Referral -> COMPLETED or CONVERTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /placements/{id}/terminate or cascade from Referral -> TERMINATED"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /placements/{id}/terminate or cascade from Referral -> TERMINATED"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Cascade: every SCHEDULED WorkSession under this placement -> CANCELLED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /placements/{id}/terminate or cascade from Referral -> TERMINATED"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []

  - entity: WorkSession
    initial_state: SCHEDULED          # attendance_status axis
    terminal_states: [CANCELLED, VOIDED]
    note: "Parallel state dimensions on one row: attendance_status (below) evolves independently of verification_status (PENDING -> VERIFIED | DISPUTED | REJECTED)."
    transitions:
      # --- attendance_status axis ---
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /work-sessions/{id}/check-in"
        actor: SiteSupervisor
        preconditions:
          - "Placement.status == ACTIVE (else ERR_PLACEMENT_NOT_ACTIVE)"
          - "Acting SiteSupervisor X-User-ID == placement.supervisor_id (else ERR_UNAUTHORIZED)"
        side_effects: ["Set check_in_at to provided value or current clock"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /work-sessions/{id}/check-out"
        actor: SiteSupervisor
        preconditions:
          - "check_out_at > check_in_at (else ERR_CHECKOUT_BEFORE_CHECKIN)"
        side_effects:
          - "Set check_out_at; compute claimed_hours = round_quarter(check_out_at - check_in_at)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from Placement -> SUSPENDED or Placement -> TERMINATED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /work-sessions/{id}/void"
        actor: ProgramCoordinator
        preconditions:
          - "Void must not drive referral.hours_completed below 0"
        side_effects:
          - "If verification_status == VERIFIED: reverse credit -> referral.hours_completed -= verified_hours (compensating; partition invariant preserved)"
          - "May reopen a COMPLETED/CONVERTED referral only when credit reversal drops hours_completed below hours_ordered AND referral was COMPLETED by work (handled as ERR_INVALID_STATE if referral already terminal by other path)"
      # --- verification_status axis (independent of attendance) ---
      - from: COMPLETED
        to: COMPLETED
        trigger: "POST /work-sessions/{id}/verify (outcome == VERIFIED)"
        actor: SiteSupervisor
        preconditions:
          - "attendance_status == COMPLETED (else ERR_INVALID_STATE)"
          - "verification_status == PENDING or DISPUTED (else ERR_INVALID_STATE)"
          - "attested_hours (if provided) <= claimed_hours (else ERR_VERIFIED_HOURS_EXCEED_CLAIMED)"
        side_effects:
          - "Set verification_status = VERIFIED; set verified_hours = round_quarter(attested_hours) if provided else claimed_hours"
          - "Credit: referral.hours_completed += verified_hours; recompute hours_outstanding"
          - "If referral.hours_completed >= referral.hours_ordered: trigger Referral ACTIVE -> COMPLETED cascade"
        note: "verification axis; attendance stays COMPLETED"
      - from: COMPLETED
        to: COMPLETED
        trigger: "POST /work-sessions/{id}/verify (outcome == DISPUTED)"
        actor: SiteSupervisor
        preconditions:
          - "verification_status == PENDING (else ERR_INVALID_STATE)"
        side_effects: ["Set verification_status = DISPUTED; no hours credited"]
      - from: COMPLETED
        to: COMPLETED
        trigger: "POST /work-sessions/{id}/verify (outcome == REJECTED)"
        actor: SiteSupervisor
        preconditions:
          - "verification_status == PENDING or DISPUTED (else ERR_INVALID_STATE)"
        side_effects: ["Set verification_status = REJECTED; no hours credited"]

  - entity: FeeConversion
    initial_state: REQUESTED
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /fee-conversions/{id}/approve"
        actor: ProgramCoordinator
        preconditions:
          - "X-User-ID != requested_by_user_id (else ERR_SELF_APPROVAL — four-eyes)"
          - "Referral.status == ACTIVE (else ERR_REFERRAL_NOT_ACTIVE)"
        side_effects: ["Set approved_by_user_id = X-User-ID"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /fee-conversions/{id}/deny"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /fee-conversions/{id}/pay"
        actor: Participant
        preconditions:
          - "Referral.hours_outstanding > 0 (else ERR_NO_REMAINING_HOURS)"
          - "amount_cents == settlement_fee_cents computed at pay time (else ERR_VALIDATION)"
        side_effects:
          - "settled_hours = min(hours_to_convert, referral.hours_outstanding); settlement_fee_cents = conversion_fee(settled_hours, indigency_status_snapshot)"
          - "referral.hours_converted += settled_hours; referral.fees_settled_cents += settlement_fee_cents; recompute hours_outstanding"
          - "If referral.hours_outstanding == 0: trigger Referral ACTIVE -> CONVERTED cascade"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /fee-conversions/{id}/reverse"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
      - from: PAID
        to: REVERSED
        trigger: "POST /fee-conversions/{id}/reverse"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "Compensating: referral.hours_converted -= settled_hours; referral.fees_settled_cents -= settlement_fee_cents; recompute hours_outstanding"
          - "If referral was CONVERTED solely by this conversion: referral.status -> ACTIVE (partition and money invariants both restored)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: fee-conversion-create-stale-referral
    parent_entity: Referral
    write_endpoint: "POST /fee-conversions"
    occ_field: "expected_referral_version"
    description: |
      Creating a FeeConversion against a Referral whose version has advanced
      since the client last observed it is rejected. A new conversion request
      legitimately supersedes any prior REQUESTED conversion for the referral,
      so a second create is not blocked by a state precondition; instead the
      quoted fee is computed over the referral's outstanding hours, which the
      version guards. If the referral's version moved (e.g. a WorkSession verify
      credit or an earlier superseding conversion bumped it), the client's view
      is stale and the create is refused.
    error_id: ERR_STALE_REFERRAL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_claimed_hours
    trigger: "POST /work-sessions/{id}/check-out"
    algorithm: threshold
    formula: |
      raw_hours = (check_out_at - check_in_at) total seconds / 3600
      claimed_hours = round_quarter(raw_hours)
      where round_quarter(x) = round(x / 0.25) * 0.25   # round_half_up on the 0.25 grid
    input_set: "single WorkSession; requires check_in_at and check_out_at both set with check_out_at > check_in_at"
    constants:
      QUARTER_HOUR: 0.25
    precision: "2 decimal places, round_half_up on the 0.25 grid"

  - name: session_credited_hours
    trigger: "POST /work-sessions/{id}/verify (outcome == VERIFIED)"
    algorithm: threshold
    formula: |
      if attested_hours provided: verified_hours = round_quarter(attested_hours)
      else:                       verified_hours = claimed_hours
      require verified_hours <= claimed_hours   # else ERR_VERIFIED_HOURS_EXCEED_CLAIMED
    input_set: "single WorkSession in attendance COMPLETED, verification PENDING/DISPUTED"
    constants:
      QUARTER_HOUR: 0.25
    precision: "2 decimal places, round_half_up on the 0.25 grid"
    variants:
      - name: SELF_REPORTED_CLAIMED
        when: "supervisor does not override; verified_hours := claimed_hours (timestamp-derived)"
        difference: "credited value equals the participant's clock-derived claimed_hours"
      - name: SUPERVISOR_ATTESTED
        when: "supervisor supplies attested_hours (e.g. deducting an unpaid break)"
        difference: "credited value equals attested_hours, strictly less than claimed_hours; the two approaches diverge for the same session"

  - name: referral_hours_completed
    trigger: "WorkSession verify credit and WorkSession void reversal"
    algorithm: aggregation
    formula: |
      hours_completed = SUM( ws.verified_hours
                             for ws in WorkSessions where ws.referral == R
                             and ws.verification_status == VERIFIED
                             and ws.attendance_status != VOIDED )
      # each ws.verified_hours is ALREADY rounded to the 0.25 grid; the SUM is NOT re-rounded.
      # Pinned order: round-per-session THEN sum (NOT sum-of-raw THEN round).
    input_set: "VERIFIED, non-VOIDED WorkSessions belonging to the referral"
    precision: "exact sum of per-session 0.25-grid values; no re-rounding of the total"

  - name: obligation_partition
    trigger: "any change to hours_completed or hours_converted"
    algorithm: aggregation
    formula: |
      hours_outstanding = max(0, hours_ordered - hours_completed - hours_converted)
      INVARIANT (conserved): hours_ordered == hours_completed + hours_converted + hours_outstanding
      holds at all times provided each term >= 0.
    input_set: "single Referral"
    precision: "exact on the 0.25 grid"

  - name: conversion_fee
    trigger: "POST /fee-conversions (quote, provisional) and POST /fee-conversions/{id}/pay (settlement, final)"
    algorithm: tiered_pricing
    formula: |
      rate_cents_per_hour = BASE_CONVERSION_RATE_CENTS * INDIGENCY_MULTIPLIER[tier]
      raw_fee_cents = round_half_up(hours * rate_cents_per_hour)          # hours on 0.25 grid
      fee_cents = min(MAX_FEE_CENTS, max(MIN_FEE_CENTS, raw_fee_cents))   # nested clamp
    input_set: "single FeeConversion; tier = indigency_status_snapshot; hours = hours_to_convert (provisional) or settled_hours (final)"
    constants:
      BASE_CONVERSION_RATE_CENTS: 1500
      INDIGENCY_MULTIPLIER: { NONE: 1.0, PARTIAL: 0.5, FULL: 0.25 }
      MIN_FEE_CENTS: 2500
      MAX_FEE_CENTS: 200000
    precision: "integer cents, round_half_up before clamp"
    variants:
      - name: PROVISIONAL_QUOTE
        when: "computed at REQUESTED over the requested hours_to_convert"
        difference: "quoted_fee_cents uses hours_to_convert as-requested"
      - name: FINAL_SETTLEMENT
        when: "computed at PAID over settled_hours = min(hours_to_convert, current hours_outstanding)"
        difference: "settlement_fee_cents is lower than quoted_fee_cents whenever outstanding hours dropped between request and payment"

  - name: site_concurrent_occupancy
    trigger: "POST /work-sessions (schedule) — capacity guard"
    algorithm: aggregation
    formula: |
      For the candidate [scheduled_start, scheduled_end) on site S:
        concurrent = COUNT( other WorkSessions on S
                            with attendance_status in {SCHEDULED, CHECKED_IN}
                            whose [scheduled_start, scheduled_end) shares any instant with the candidate )
      reject if concurrent + 1 > S.capacity_slots   # aggregate half-open capacity
    input_set: "all non-terminal WorkSessions on the target site"
    precision: "integer count; intervals half-open [start, end)"

  - name: participant_rest_buffer
    trigger: "POST /work-sessions (schedule) — participant overlap guard"
    algorithm: interval_merge
    formula: |
      For participant P's other WorkSessions (attendance in {SCHEDULED, CHECKED_IN, COMPLETED}):
        gap_minutes = minutes between candidate interval and existing interval (0 if they overlap)
        reject if gap_minutes < REST_BUFFER_MINUTES     # pairwise buffered separation
    input_set: "all SCHEDULED/CHECKED_IN/COMPLETED WorkSessions of the same participant"
    constants:
      REST_BUFFER_MINUTES: 60
    precision: "minutes; a gap of exactly 60 is allowed (>=), 59 is rejected"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Role permitted for the operation per §1.7; entity_backed ownership (SiteSupervisor == placement.supervisor_id; Participant == referral.participant_id) enforced", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "All path and body-referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 4, category: business_referential, check: "supervisor_id belongs to the placement's site_id on placement create", error_id: ERR_SUPERVISOR_SITE_MISMATCH, http_status: 422, applies_to: "POST /placements" }
  - { priority: 5, category: business_constraint, check: "Enum members valid; numbers positive; hours multiples of 0.25; scheduled_end > scheduled_start; check_out_at > check_in_at", error_id: ERR_VALIDATION, http_status: 400, applies_to: all }
  - { priority: 6, category: business_fiscal, check: "expected_referral_version matches Referral.version on FeeConversion create", error_id: ERR_STALE_REFERRAL_VERSION, http_status: 412, applies_to: "POST /fee-conversions" }
  - { priority: 7, category: state, check: "Target resource is in a state that admits the requested transition (generic)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-changing endpoints" }
  - { priority: 8, category: state, check: "Referral must be ACTIVE for placement activate, fee-conversion approve", error_id: ERR_REFERRAL_NOT_ACTIVE, http_status: 409, applies_to: "POST /placements/{id}/activate, POST /fee-conversions/{id}/approve" }
  - { priority: 9, category: state, check: "Placement must be ACTIVE for work-session check-in", error_id: ERR_PLACEMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /work-sessions/{id}/check-in" }
  - { priority: 10, category: business_safety, check: "Placement waiver must be signed before activation", error_id: ERR_WAIVER_REQUIRED, http_status: 409, applies_to: "POST /placements/{id}/activate" }
  - { priority: 11, category: business_safety, check: "Site must be ACCEPTING to activate a placement to it", error_id: ERR_SITE_NOT_ACCEPTING, http_status: 409, applies_to: "POST /placements/{id}/activate" }
  - { priority: 12, category: business_safety, check: "Site must carry a VERIFIED, non-expired InsurancePolicy for site activate and placement activate", error_id: ERR_INSURANCE_INVALID, http_status: 409, applies_to: "POST /sites/{id}/activate, POST /placements/{id}/activate, POST /insurance-policies/{id}/verify" }
  - { priority: 13, category: business_safety, check: "The approver of a FeeConversion must differ from its requester (four-eyes segregation of duties)", error_id: ERR_SELF_APPROVAL, http_status: 403, applies_to: "POST /fee-conversions/{id}/approve" }
  - { priority: 14, category: business_temporal, check: "Candidate WorkSession must be >= REST_BUFFER_MINUTES from the participant's other sessions", error_id: ERR_SESSION_OVERLAP, http_status: 409, applies_to: "POST /work-sessions" }
  - { priority: 15, category: business_temporal, check: "Assigned supervisor must not already staff an overlapping [start,end) session (adjacency allowed)", error_id: ERR_SUPERVISOR_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /work-sessions" }
  - { priority: 16, category: business_constraint, check: "Concurrent SCHEDULED/CHECKED_IN sessions on the site must not exceed capacity_slots", error_id: ERR_SITE_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /work-sessions" }
  - { priority: 17, category: business_constraint, check: "hours_to_convert must not exceed referral.hours_outstanding", error_id: ERR_HOURS_EXCEED_OUTSTANDING, http_status: 422, applies_to: "POST /fee-conversions" }
  - { priority: 18, category: business_constraint, check: "attested_hours must not exceed claimed_hours on verify", error_id: ERR_VERIFIED_HOURS_EXCEED_CLAIMED, http_status: 422, applies_to: "POST /work-sessions/{id}/verify" }
  - { priority: 19, category: business_temporal, check: "check_out_at must be strictly after check_in_at", error_id: ERR_CHECKOUT_BEFORE_CHECKIN, http_status: 422, applies_to: "POST /work-sessions/{id}/check-out" }
  - { priority: 20, category: business_fiscal, check: "FeeConversion pay requires referral.hours_outstanding > 0", error_id: ERR_NO_REMAINING_HOURS, http_status: 409, applies_to: "POST /fee-conversions/{id}/pay" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CourtClerk, ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock set to to_iso8601 for all subsequent deadline/expiry/buffer evaluations"]

  # --- Participant ---
  - method: POST
    path: "/participants"
    description: "Register a participant"
    roles: [CourtClerk, ProgramCoordinator]
    code: 201
    input: [full_name, date_of_birth, contact_email, "risk_level?"]
    output: Participant
    side_effects: []
  - method: GET
    path: "/participants/{id}"
    description: "Fetch a participant"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: GET
    path: "/participants"
    description: "List participants"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["risk_level?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  # --- Site ---
  - method: POST
    path: "/sites"
    description: "Create a host site/agency"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, agency_type, address, capacity_slots]
    output: Site
    side_effects: ["status = PROSPECTIVE"]
  - method: GET
    path: "/sites/{id}"
    description: "Fetch a site"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/sites"
    description: "List sites"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []
  - method: POST
    path: "/sites/{id}/activate"
    description: "Activate a site to ACCEPTING (requires a VERIFIED, non-expired policy)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Site
    side_effects: ["status PROSPECTIVE|PAUSED -> ACCEPTING"]
  - method: POST
    path: "/sites/{id}/pause"
    description: "Pause a site (ACCEPTING -> PAUSED)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Site
    side_effects: ["status -> PAUSED"]

  # --- InsurancePolicy ---
  - method: POST
    path: "/insurance-policies"
    description: "File a liability insurance policy for a site"
    roles: [ProgramCoordinator]
    code: 201
    input: [site_id, carrier, coverage_amount_cents, effective_date, expiry_date]
    output: InsurancePolicy
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/insurance-policies/{id}"
    description: "Fetch an insurance policy"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/insurance-policies"
    description: "List insurance policies (filter by site)"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []
  - method: POST
    path: "/insurance-policies/{id}/verify"
    description: "Verify a policy (PENDING -> VERIFIED)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status -> VERIFIED"]
  - method: POST
    path: "/insurance-policies/{id}/reject"
    description: "Reject a policy (PENDING -> REJECTED)"
    roles: [ProgramCoordinator]
    code: 200
    input: ["reason?"]
    output: InsurancePolicy
    side_effects: ["status -> REJECTED"]

  # --- Supervisor ---
  - method: POST
    path: "/supervisors"
    description: "Register a site supervisor"
    roles: [ProgramCoordinator]
    code: 201
    input: [site_id, full_name, "max_concurrent_participants?"]
    output: Supervisor
    side_effects: []
  - method: GET
    path: "/supervisors/{id}"
    description: "Fetch a supervisor"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: Supervisor
    side_effects: []
  - method: GET
    path: "/supervisors"
    description: "List supervisors (filter by site)"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: Supervisor[]
    side_effects: []

  # --- Referral ---
  - method: POST
    path: "/referrals"
    description: "Create a court referral (hours ordered)"
    roles: [CourtClerk]
    code: 201
    input: [participant_id, court_case_number, offense_class, hours_ordered, deadline_date, "indigency_status?"]
    output: Referral
    side_effects: ["status = ACTIVE; hours_completed=0, hours_converted=0, hours_outstanding=hours_ordered, fees_settled_cents=0, version=1"]
  - method: GET
    path: "/referrals/{id}"
    description: "Fetch a referral"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/referrals"
    description: "List referrals (filter by participant)"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: GET
    path: "/referrals/{id}/summary"
    description: "Reporting: computed hours/fee breakdown for a referral"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: "{ referral_id: string, hours_ordered: number, hours_completed: number, hours_converted: number, hours_outstanding: number, fees_settled_cents: integer, status: string, certificate_id: string }"
    side_effects: []
  - method: POST
    path: "/referrals/{id}/reinstate"
    description: "Reinstate a NON_COMPLIANT referral to ACTIVE"
    roles: [CourtClerk]
    code: 200
    input: []
    output: Referral
    side_effects: ["status NON_COMPLIANT -> ACTIVE; cascade SUSPENDED placements -> ACTIVE"]
  - method: POST
    path: "/referrals/{id}/terminate"
    description: "Terminate a NON_COMPLIANT referral"
    roles: [CourtClerk]
    code: 200
    input: ["reason?"]
    output: Referral
    side_effects: ["status -> TERMINATED; cascade non-terminal placements -> TERMINATED"]

  # --- Placement ---
  - method: POST
    path: "/placements"
    description: "Propose a placement of a referral at a site under a supervisor"
    roles: [ProgramCoordinator]
    code: 201
    input: [referral_id, site_id, supervisor_id]
    output: Placement
    side_effects: ["status = PROPOSED; waiver_signed=false"]
  - method: GET
    path: "/placements/{id}"
    description: "Fetch a placement"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: Placement
    side_effects: []
  - method: GET
    path: "/placements"
    description: "List placements (filter by referral, site, or supervisor)"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["referral_id?", "site_id?", "supervisor_id?", "status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []
  - method: POST
    path: "/placements/{id}/sign-waiver"
    description: "Participant signs the liability waiver"
    roles: [Participant]
    code: 200
    input: [signature_name]
    output: Placement
    side_effects: ["waiver_signed=true; waiver_signed_at=clock; waiver_signature_name=signature_name"]
  - method: POST
    path: "/placements/{id}/activate"
    description: "Activate a placement (PROPOSED -> ACTIVE)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/placements/{id}/terminate"
    description: "Terminate a placement"
    roles: [ProgramCoordinator]
    code: 200
    input: ["reason?"]
    output: Placement
    side_effects: ["status -> TERMINATED; cascade SCHEDULED sessions -> CANCELLED"]

  # --- WorkSession ---
  - method: POST
    path: "/work-sessions"
    description: "Schedule a work session under an active placement"
    roles: [SiteSupervisor, ProgramCoordinator]
    code: 201
    input: [placement_id, "session_category?", scheduled_start, scheduled_end]
    output: WorkSession
    side_effects: ["attendance_status=SCHEDULED, verification_status=PENDING; denormalize participant_id, site_id from placement; enforce participant rest-buffer, supervisor double-book, site capacity"]
  - method: GET
    path: "/work-sessions/{id}"
    description: "Fetch a work session"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: WorkSession
    side_effects: []
  - method: GET
    path: "/work-sessions"
    description: "List work sessions (filter by placement)"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["placement_id?", "attendance_status?", "limit?", "offset?"]
    output: WorkSession[]
    side_effects: []
  - method: POST
    path: "/work-sessions/{id}/check-in"
    description: "Supervisor checks the participant in"
    roles: [SiteSupervisor]
    code: 200
    input: ["check_in_at?"]
    output: WorkSession
    side_effects: ["attendance_status SCHEDULED -> CHECKED_IN; set check_in_at"]
  - method: POST
    path: "/work-sessions/{id}/check-out"
    description: "Supervisor checks the participant out; compute claimed_hours"
    roles: [SiteSupervisor]
    code: 200
    input: ["check_out_at?"]
    output: WorkSession
    side_effects: ["attendance_status CHECKED_IN -> COMPLETED; set check_out_at; compute claimed_hours"]
  - method: POST
    path: "/work-sessions/{id}/verify"
    description: "Supervisor verifies (VERIFIED credits hours; DISPUTED/REJECTED do not)"
    roles: [SiteSupervisor]
    code: 200
    input: [outcome, "attested_hours?"]
    output: WorkSession
    side_effects: ["verification_status -> outcome; on VERIFIED set verified_hours and credit referral.hours_completed; may cascade referral -> COMPLETED"]
  - method: POST
    path: "/work-sessions/{id}/void"
    description: "Void a completed session; reverse any verified credit"
    roles: [ProgramCoordinator, SiteSupervisor]
    code: 200
    input: ["reason?"]
    output: WorkSession
    side_effects: ["attendance_status -> VOIDED; if was VERIFIED reverse referral.hours_completed (compensating)"]

  # --- FeeConversion ---
  - method: POST
    path: "/fee-conversions"
    description: "Request buying out outstanding hours with a fee (supersedes prior REQUESTED conversion)"
    roles: [Participant, ProgramCoordinator]
    code: 201
    input: [referral_id, hours_to_convert, expected_referral_version]
    output: FeeConversion
    side_effects: ["status=REQUESTED; snapshot indigency_status; compute quoted_fee_cents; set requested_by_user_id=X-User-ID; supersede prior REQUESTED conversion -> DENIED; increments Referral.version by 1"]
  - method: GET
    path: "/fee-conversions/{id}"
    description: "Fetch a fee conversion"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: FeeConversion
    side_effects: []
  - method: GET
    path: "/fee-conversions"
    description: "List fee conversions (filter by referral)"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["referral_id?", "status?", "limit?", "offset?"]
    output: FeeConversion[]
    side_effects: []
  - method: POST
    path: "/fee-conversions/{id}/approve"
    description: "Approve a fee conversion (four-eyes: approver != requester)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: FeeConversion
    side_effects: ["status REQUESTED -> APPROVED; set approved_by_user_id"]
  - method: POST
    path: "/fee-conversions/{id}/deny"
    description: "Deny a fee conversion"
    roles: [ProgramCoordinator]
    code: 200
    input: ["reason?"]
    output: FeeConversion
    side_effects: ["status REQUESTED -> DENIED"]
  - method: POST
    path: "/fee-conversions/{id}/pay"
    description: "Pay an approved fee conversion; discharges settled_hours"
    roles: [Participant, ProgramCoordinator]
    code: 200
    input: [amount_cents]
    output: FeeConversion
    side_effects: ["status APPROVED -> PAID; compute settled_hours & settlement_fee_cents; referral.hours_converted += settled_hours; fees_settled_cents += settlement_fee_cents; may cascade referral -> CONVERTED"]
  - method: POST
    path: "/fee-conversions/{id}/reverse"
    description: "Reverse an approved/paid fee conversion (compensating refund)"
    roles: [ProgramCoordinator]
    code: 200
    input: ["reason?"]
    output: FeeConversion
    side_effects: ["status -> REVERSED; if was PAID reverse hours_converted and fees_settled_cents; may restore referral to ACTIVE"]

  # --- ComplianceAction ---
  - method: POST
    path: "/compliance-actions"
    description: "File a court-facing compliance action (WARNING or REPORT_BACK)"
    roles: [CourtClerk]
    code: 201
    input: [referral_id, action_type, reason]
    output: ComplianceAction
    side_effects: ["filed_by_user_id=X-User-ID; REPORT_BACK drives referral ACTIVE -> NON_COMPLIANT and cascades placements/sessions; WARNING leaves status ACTIVE"]
  - method: GET
    path: "/compliance-actions/{id}"
    description: "Fetch a compliance action"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: ComplianceAction
    side_effects: []
  - method: GET
    path: "/compliance-actions"
    description: "List compliance actions (filter by referral)"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["referral_id?", "limit?", "offset?"]
    output: ComplianceAction[]
    side_effects: []

  # --- Certificate (auto-issued; read-only) ---
  - method: GET
    path: "/certificates/{id}"
    description: "Fetch a completion certificate"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/certificates"
    description: "List completion certificates (filter by referral)"
    roles: [CourtClerk, ProgramCoordinator, SiteSupervisor, Participant]
    code: 200
    input: ["referral_id?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or entity_backed ownership mismatch" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, bad enum, non-positive number, hours not on 0.25 grid, scheduled_end <= scheduled_start, or fee amount_cents mismatch" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of bounds (limit 1..100, offset >= 0)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that admits the requested transition (generic)" }
  - { id: ERR_REFERRAL_NOT_ACTIVE, http: 409, condition: "Referral must be ACTIVE for this operation" }
  - { id: ERR_PLACEMENT_NOT_ACTIVE, http: 409, condition: "Placement must be ACTIVE for check-in" }
  - { id: ERR_WAIVER_REQUIRED, http: 409, condition: "Placement waiver not signed before activation" }
  - { id: ERR_SITE_NOT_ACCEPTING, http: 409, condition: "Target site is not in ACCEPTING status" }
  - { id: ERR_INSURANCE_INVALID, http: 409, condition: "Site lacks a VERIFIED, non-expired insurance policy (or verify attempted on an already-expired policy)" }
  - { id: ERR_SUPERVISOR_SITE_MISMATCH, http: 422, condition: "supervisor_id does not belong to the placement's site_id" }
  - { id: ERR_SELF_APPROVAL, http: 403, condition: "FeeConversion approver X-User-ID equals its requester (four-eyes violation)" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "Candidate session is within REST_BUFFER_MINUTES of the participant's another session" }
  - { id: ERR_SUPERVISOR_DOUBLE_BOOKED, http: 409, condition: "Assigned supervisor already staffs an overlapping [start,end) session" }
  - { id: ERR_SITE_CAPACITY_EXCEEDED, http: 409, condition: "Concurrent sessions on the site would exceed capacity_slots" }
  - { id: ERR_HOURS_EXCEED_OUTSTANDING, http: 422, condition: "hours_to_convert exceeds referral.hours_outstanding" }
  - { id: ERR_VERIFIED_HOURS_EXCEED_CLAIMED, http: 422, condition: "attested_hours exceeds claimed_hours on verify" }
  - { id: ERR_CHECKOUT_BEFORE_CHECKIN, http: 422, condition: "check_out_at not strictly after check_in_at" }
  - { id: ERR_NO_REMAINING_HOURS, http: 409, condition: "FeeConversion pay attempted with referral.hours_outstanding == 0" }
  - { id: ERR_STALE_REFERRAL_VERSION, http: 412, condition: "expected_referral_version does not match Referral.version on FeeConversion create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CourtClerk
    description: "Court staff; issues referrals, files compliance actions, decides reinstatement/termination"
    identity: opaque
    exclusive_operations:
      - "POST /referrals — create referral"
      - "POST /compliance-actions — file WARNING/REPORT_BACK"
      - "POST /referrals/{id}/reinstate — reinstate referral"
      - "POST /referrals/{id}/terminate — terminate referral"
    shared_operations:
      - "POST /participants — register participant (shared with ProgramCoordinator)"
      - "GET reads across referrals, participants, sites, placements, sessions, certificates, compliance actions"
  - name: ProgramCoordinator
    description: "Program office; manages sites, insurance, supervisors, placements, work-session scheduling, and fee conversions"
    identity: opaque
    exclusive_operations:
      - "POST /sites, POST /sites/{id}/activate, POST /sites/{id}/pause"
      - "POST /insurance-policies, POST /insurance-policies/{id}/verify, POST /insurance-policies/{id}/reject"
      - "POST /supervisors"
      - "POST /placements, POST /placements/{id}/activate, POST /placements/{id}/terminate"
      - "POST /fee-conversions/{id}/approve, POST /fee-conversions/{id}/deny, POST /fee-conversions/{id}/reverse"
    shared_operations:
      - "POST /participants (shared with CourtClerk)"
      - "POST /work-sessions (shared with SiteSupervisor)"
      - "POST /work-sessions/{id}/void (shared with SiteSupervisor)"
      - "POST /fee-conversions, POST /fee-conversions/{id}/pay (shared with Participant)"
      - "GET reads across all collections"
  - name: SiteSupervisor
    description: "On-site supervisor; runs check-in/out and verifies hours for their assigned placements"
    identity: "entity_backed:Supervisor"
    exclusive_operations:
      - "POST /work-sessions/{id}/check-in — must be placement.supervisor_id"
      - "POST /work-sessions/{id}/check-out — must be placement.supervisor_id"
      - "POST /work-sessions/{id}/verify — must be placement.supervisor_id"
    shared_operations:
      - "POST /work-sessions (shared with ProgramCoordinator)"
      - "POST /work-sessions/{id}/void (shared with ProgramCoordinator)"
      - "GET reads across all collections"
  - name: Participant
    description: "The person serving hours; signs waivers, requests and pays fee conversions on their own referrals"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /placements/{id}/sign-waiver — must own the placement's referral"
    shared_operations:
      - "POST /fee-conversions, POST /fee-conversions/{id}/pay (shared with ProgramCoordinator; must own the referral)"
      - "GET reads across own referrals, placements, sessions, certificates"
