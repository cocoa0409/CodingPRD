            - { call: "POST /youth-ministry/trips/${trip}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog}", family_key: "f1", first_name: "P", last_name: "O", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_A", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:01:00Z", medical_notes: "n"}, as: Guardian, as_user_id: "guardian-1", captures: {cfb: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfc: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cfa}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfb}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfc}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg}/submit", as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "GET /youth-ministry/registrations/${reg}/fundraising-account", as: Treasurer, captures: {acct: "$.data[0].id"} }
            - { call: "POST /youth-ministry/fundraising-accounts/${acct}/donations", payload: {donor_name: "D1", amount_cents: 1000, channel: "CASH"}, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /youth-ministry/scholarship-applications", payload: {registration_id: "${reg}", requested_cents: 100000}, as: Guardian, as_user_id: "guardian-1", captures: {app: $.data.id} }
            - { call: "POST /youth-ministry/scholarship-applications/${app}/decide", payload: {decision: "APPROVE"}, as: ScholarshipReviewer, as_user_id: "reviewer-1", captures: {award: $.data.award_cents} }
          trigger:
            - { call: "POST /youth-ministry/scholarship-applications/${app}/disburse", as: Treasurer, as_user_id: "reviewer-1", captures: {e_sod: $.data.error_id} }
            - { call: "POST /youth-ministry/scholarship-applications/${app}/disburse", as: Treasurer, as_user_id: "treasurer-1", captures: {st: $.data.status, disb_by: $.data.disbursed_by_user_id} }
            - { call: "GET /youth-ministry/programs/${prog}", as: ProgramDirector, captures: {res: $.data.scholarship_reserved_cents, dis: $.data.scholarship_disbursed_cents, av: $.data.scholarship_available_cents} }
            - { call: "GET /youth-ministry/registrations/${reg}", as: ProgramDirector, captures: {reg_award: $.data.scholarship_awarded_cents, reg_cov: $.data.covered_cents} }
          assert:
            - "award == 60000 (need 60 = 50 + 5 size + 0 + 5 fundraising-positive branch; need_cap 60000 < requested 100000)"
            - "e_sod == ERR_SOD_VIOLATION (403): reviewer-1 approved, so reviewer-1 cannot disburse — role held is irrelevant, the stored id decides"
            - "st == DISBURSED and disb_by == treasurer-1"
            - "res == 0 and dis == 60000 and av == 440000 (available unchanged by the reserved -> disbursed shift)"
            - "reg_award == 60000 and reg_cov == 60000 (covered now includes the scholarship)"

      - name: reviewer_must_not_be_guardian_sod
        claim_type: segregation_of_duties
        grounds:
