      - name: presenter_decertification_blocks_the_approved_meeting_message
        claim_type: Cross-entity
        grounds:
          - state_machines.Supervisor.transitions.TRAINED_to_UNTRAINED
          - state_machines.CampaignCommunication.transitions.APPROVED_to_BLOCKED
        excluded_because:
          difficulty_instance: transitive_cascade / presenter_decertification_three_hop
          rationale: "The named \u00a71.8 instance drives record-violation on a TRAINED presenter and asserts every hop: supervisor UNTRAINED, Petition.retraining_required true, and the APPROVED message BLOCKED with blocked_reason PRESENTER_DECERTIFIED."

      - name: open_polls_without_an_accepted_voter_list_is_refused
        claim_type: guarded transitions
        grounds:
          - state_machines.ElectionRound.transitions.SCHEDULED_to_POLLS_OPEN
          - errors.ERR_VOTER_LIST_NOT_ACCEPTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / open_polls_requires_accepted_voter_list
          rationale: "The named \u00a71.8 instance asserts the guarded transition in both directions: refused with ERR_VOTER_LIST_NOT_ACCEPTED while the list is DEFICIENT, allowed once the cured list is ACCEPTED."

      - name: blocking_charge_suspends_the_round_and_cancels_its_sessions
        claim_type: Cascade down
        grounds:
          - state_machines.ElectionRound.transitions.SCHEDULED_to_SUSPENDED
          - state_machines.PollSession.transitions.SCHEDULED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / blocking_charge_suspension_four_hop
          rationale: "The named \u00a71.8 instance walks all four hops of the blocking-charge chain, including scheduled_session_count returning to 0 and the sessions landing in CANCELLED."

      - name: insufficient_showing_dismissal_fans_out_to_four_child_families
        claim_type: Conditional cascade
        grounds:
          - state_machines.Petition.transitions.SOI_VERIFIED_to_DISMISSED
        excluded_because:
          difficulty_instance: transitive_cascade / insufficient_showing_dismissal_fan_out
          rationale: "The named \u00a71.8 instance asserts each conditional hop of the dismissal fan-out: only PENDING classifications become MOOT, only non-VOID agreements are voided, only DRAFT lists are cancelled."

      - name: reconsidering_a_ruled_classification_restores_the_pending_bucket
        claim_type: Compensation
        grounds:
          - state_machines.Classification.transitions.INCLUDED_to_PENDING
          - invariants.unit_headcount_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / unit_headcount_conservation_across_rule_and_reconsider
          rationale: "The named \u00a71.8 instance asserts the compensation exactly: after reconsider the headcount buckets return to their pre-ruling values with no drift in total_classified_headcount."

      - name: poll_session_creation_on_a_suspended_round_is_refused
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_ROUND_NOT_SCHEDULED
          - validation_priority_conflicts.state-beats-constraint
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_constraint_on_poll_session_create
          rationale: "The named \u00a71.8 instance triggers ERR_ROUND_NOT_SCHEDULED on a suspended round while a location conflict is also present, which subsumes the plain precondition case."

      - name: deficient_voter_list_cures_back_into_submitted
        claim_type: cyclic
        grounds:
          - state_machines.VoterList.transitions.DEFICIENT_to_SUBMITTED
          - constants.MAX_LIST_RESUBMISSIONS
        excluded_because:
          difficulty_instance: non_linear_state_machine / voter_list_cure_cycle_returns_to_submitted
          rationale: "The named \u00a71.8 instance walks the DEFICIENT -> SUBMITTED cure cycle and asserts the resubmission counter and re-grading on re-entry."

      - name: revision_required_message_re_enters_pending_legal_review
        claim_type: cyclic
        grounds:
          - state_machines.CampaignCommunication.transitions.REVISION_REQUIRED_to_PENDING_LEGAL_REVIEW
          - constants.MAX_REVISION_ROUNDS
        excluded_because:
          difficulty_instance: non_linear_state_machine / campaign_message_revision_loop
          rationale: "The named \u00a71.8 instance walks the revision loop and asserts revision_round growth plus the re-accuracy-review precondition on re-entry."

      - name: rerun_direction_returns_the_case_to_election_set
        claim_type: cyclic
        grounds:
          - state_machines.Petition.transitions.RERUN_DIRECTED_to_ELECTION_SET
          - entities.ElectionRound.fields.prior_round_id
        excluded_because:
          difficulty_instance: non_linear_state_machine / petition_rerun_cycle_reenters_election_set
          rationale: "The named \u00a71.8 instance re-enters ELECTION_SET through schedule-rerun and asserts round_number 2 with prior_round_id pointing at the set-aside round."


  # =========================================================================
  # SECTION - calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: core_wage_snapshot_freezes_on_the_first_score_call
        claim_type: Input Set Filtering
        grounds:
          - calculations.core_wage_snapshot
          - entities.Petition.fields.core_avg_hourly_wage_cents
          - entities.Petition.fields.core_wage_locked_at
          - endpoints.POST_classifications_id_score
        distinguishing_aspect: |
          The snapshot's input set is doubly restricted: only classifications with BOTH positions INCLUDE
          (so QC at 2900 is out) and only those existing at the FIRST score call. The frozen value is
          (2400*60 + 3200*30)/90 = 2666.67 -> 2667; adding LEAD at 2800 afterwards and scoring it must
          leave 2667 in place, which LEAD's own wage_proximity of 95.01 proves (a recomputed core of 2678
          would give 95.55).
        test_recipe:
          setup:
            - "petition 07-RC-340201 in SCOPE_ANALYSIS with PROD 60 @ 2400, MAINT 30 @ 3200 (both INCLUDE) and QC 12 @ 2900 (employer EXCLUDE)"
          setup_api_calls:
