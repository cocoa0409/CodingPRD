              as_user_id: "${std_id}"
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR2", dimension: "TIMELINESS", weight_points: 60, threshold_pct: 80.00, severity: "LOW" }
              as: DataSteward
              as_user_id: "${std_id}"
          trigger:
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "PROVISIONAL", measurements: [{ rule_code: "QR1", measured_pct: 95.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { prov_score: $.data.weighted_score, prov_seq: $.data.run_seq, prov_findings: $.data.findings_created_count }
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "CERTIFIED", measurements: [{ rule_code: "QR1", measured_pct: 95.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { cert_score: $.data.weighted_score, cert_seq: $.data.run_seq, cert_findings: $.data.findings_created_count }
            - call: "GET /mdm/domains/${dom_id}"
