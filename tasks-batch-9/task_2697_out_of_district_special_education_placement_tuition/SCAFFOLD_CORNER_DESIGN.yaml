      - name: occ_stale_school_version_on_rate_schedule_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules.rate-schedule-create-stale-school"
          - "errors[ERR_STALE_SCHOOL_VERSION]"
          - "validations[priority=7]"
          - "endpoints.POST_tuition_rate_schedules"
        distinguishing_aspect: |
          The second §1.2.1 rule. Publishing the FY2027 schedule repoints
          ApprovedPrivateSchool.active_rate_schedule_id and takes the school from version 1 to 2, so a
          rate-setter still holding version 1 must be refused when publishing FY2028 - a different
          fiscal year, therefore no uniqueness or supersession conflict, the ONLY thing wrong is the
          stale view. The two OCC rules use different occ_field names and different error codes, so a
          single shared "expected_version" implementation fails one of the two.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000."
            - "Harbor Academy created APPROVED at version 1, with its version captured, and then a STATE_APPROVED FY2027 schedule published against version 1, taking the school to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
