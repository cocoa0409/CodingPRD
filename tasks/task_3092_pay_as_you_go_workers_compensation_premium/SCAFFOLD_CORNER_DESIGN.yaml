      - name: monopolistic_state_line_rejected_distinct_from_unknown_class
        claim_type: Violation → Error
        grounds: ['validations.priority-8', 'validations.priority-9', 'errors.ERR_MONOPOLISTIC_STATE_EXCLUDED', 'errors.ERR_CLASS_CODE_NOT_ON_POLICY']
        distinguishing_aspect: "A payroll line in monopolistic OH fails with ERR_MONOPOLISTIC_STATE_EXCLUDED at priority 8, BEFORE the class-assignment check at priority 9 — the two errors are observably distinct even though the OH class is also not on the policy."
