              payload: { venue_id: "${venue_id}", tier_code: "T6", seat_capacity: 20 }
              as: FloorManager
            - call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T6", seat_capacity: 20 }
              as: FloorManager
            - call: "POST /service-floor/venues/${venue_id}/run_ops"
              payload: {}
              as: FloorManager
              captures: { charge_70: $.data.restaurant_charge_cents }
          assert:
            - "billable_guest_count at the first run is 5 * min(10, 12) == 50, which sits on the LOW/MEDIUM edge"
            - "the MEDIUM band is inclusive at 50: charge_50 == 50 * 299 == 14950"
            - "two more tables of capacity 20 add min(20, 12) == 12 each, so the count becomes 74 and leaves the band"
            - "charge_70 == 74 * 299 * 1.20 == 26551.2, which is not an integer cent amount and must fail the recompute rather than persist a fractional charge"
            - "the band is selected from the recomputed count on every run, not cached from the previous epoch"

      - name: venue_cost_report_ceiling_applied_once_to_the_sum
        claim_type: Precision
        grounds:
          - calculations.venue_cost_report
          - endpoints.GET_/service-floor/venues/{venue_id}/cost-report
          - constants.ROUNDING_INCREMENT_CENTS
        distinguishing_aspect: "ROUNDING_INCREMENT_CENTS is applied to the summed total once; the per-table products are whole-cent integers and the result is an integer multiple of 100, so a per-table ceil-then-sum implementation would land on the same figure only by coincidence of these inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with one T6 tier of protein_gram_standard 240 and one T4, plus a set of tables."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
          trigger:
            - call: "GET /service-floor/venues/${venue_id}/cost-report"
              payload: {}
              as: FloorManager
              captures: { venue_cost: $.data.venue_cost_cents, guests: $.data.billable_guest_count }
          assert:
            - "guests == min(4, 12) + min(6, 12) + min(2, 12) == 12"
            - "the T4 table contributes 3200 * 240 == 768000, the T6 table 768000, and the T2 table 768000, giving a raw sum of 2304000"
            - "venue_cost == ceil(2304000 / 100) * 100 == 2304000"
            - "the result is an exact integer with no fractional cents and no negative drift"
            - "the read persists nothing: a second identical GET returns the same figure and Venue.version is unchanged"

      - name: settlement_variant_divergence_is_covered_by_the_depth_probe
        claim_type: Variant Divergence
        grounds:
          - calculations.settlement.variants.quote
          - calculations.settlement.variants.final
        excluded_because:
          difficulty_instance: settlement_quote_vs_final_celebration_fee_gap
          rationale: "The quote-versus-final gap on a birthday booking is asserted as the primary outcome of the named §1.8 instance, including the 900-cent delta."

      - name: protein_cost_variant_divergence_is_covered_by_the_depth_probe
        claim_type: Variant Selection
        grounds:
          - calculations.protein_cost.variants.posted
          - calculations.protein_cost.variants.settled
        excluded_because:
          difficulty_instance: protein_cost_posted_vs_settled_control_allowance_gap
          rationale: "The posted-versus-settled split and the never-persisted control allowance are asserted by the named §1.8 instance."

      - name: trueup_ceiling_order_is_covered_by_the_depth_probe
        claim_type: Precision
        grounds:
          - calculations.table_minimum_trueup
        excluded_because:
          difficulty_instance: trueup_band_then_ceiling_order
          rationale: "The pinned band-then-ceil order and its 725-cent result are asserted by the named §1.8 instance."

      - name: seating_overlap_adjacency_is_covered_by_the_depth_probe
        claim_type: interval_merge
        grounds:
          - calculations.turn_over_window
        excluded_because:
          difficulty_instance: half_open_table_seating_intervals_abut_without_conflict
          rationale: "The half-open adjacency rule on a shared grill table is asserted by the named §1.8 instance."

      - name: credit_cap_evaluation_order_is_covered_by_the_depth_probe
        claim_type: constraint_propagation
        grounds:
          - calculations.credit_application
        excluded_because:
          difficulty_instance: credit_cap_read_before_then_applied_after
          rationale: "The pinned two-pass credit-cap evaluation and the 1440-cent result are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: hold_grant_with_an_unknown_table_returns_table_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors.ERR_TABLE_NOT_FOUND
          - endpoints.POST_/service-floor/reservations/{reservation_id}/holds
        distinguishing_aspect: "A hold naming a table id that was never commissioned produces ERR_TABLE_NOT_FOUND from the existence check and the booking is left in REQUESTED, rather than the request being rejected for capacity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue with a T4 tier and a submitted T4 booking; no table exists."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_party
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_missing_table: $.data.id }
            - call: "POST /service-floor/reservations/${res_missing_table}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: Host
              captures: { v_venue_ev1: $.data.version }
          trigger:
            - call: "POST /service-floor/reservations/${res_missing_table}/holds"
              payload: { expected_table_version: "${v_venue_ev1}", table_id: "00000000-0000-4000-8000-000000000077" }
              as: Host
              captures: { err_table: $.data.error_id }
          assert:
            - "the response status is 404 and err_table == ERR_TABLE_NOT_FOUND"
            - "err_table != ERR_TABLE_OVER_CAPACITY and err_table != ERR_TIER_MISMATCH"
            - "GET /service-floor/reservations/${res_missing_table} reports status == REQUESTED with hold_count 0 and table_id null"

      - name: tier_mismatch_edge_between_six_and_seven_guests_on_a_six_seat_tier
        claim_type: Conditional validation
        grounds:
          - validations[priority=7]
          - entities.TableTier.fields.over_capacity_ratio
          - errors.ERR_TIER_MISMATCH
        distinguishing_aspect: "The tier check is inclusive at seat_capacity * over_capacity_ratio: six guests on a six-seat tier passes and seven fails, so the boundary is a single guest and the ratio is doing real work rather than being a rounding decoration."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue with a T6 tier whose over_capacity_ratio is 1.25."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_party
          trigger:
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier6_id}", party_size: 6, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_six: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier6_id}", party_size: 7, scheduled_time: "2026-09-03T20:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { err_seven: $.data.error_id }
          assert:
            - "six guests on a six-seat tier passes: the first create returns 201 and res_six is a live booking"
            - "the limit is seat_capacity * over_capacity_ratio == 6 * 1.25 == 7.5, so 7 guests would still fit the ratio"
            - "seven guests is nevertheless refused at the grill-table capacity check rather than the tier check, because no grill table carries more than six seats"
            - "err_seven == ERR_TABLE_OVER_CAPACITY and not ERR_TIER_MISMATCH — the tier ratio permits it and the table does not"
            - "GET /service-floor/reservations?party_id=${party_id} returns exactly 1 row"

      - name: hold_grant_fails_on_over_capacity_before_the_hold_cap
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_TABLE_OVER_CAPACITY
          - errors.ERR_HOLD_LIMIT_EXCEEDED
        distinguishing_aspect: "When a booking is both too large for the table and already at its hold cap, the capacity check at priority 8 wins over the hold-cap check at priority 9, so the caller is told the real blocker."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers and a T2 table; a two-guest booking already held three times."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - *k_party
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier2_id}", party_size: 2, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_prio: $.data.id }
            - call: "POST /service-floor/reservations/${res_prio}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_p1: $.data.version }
            - call: "POST /service-floor/reservations/${res_prio}/holds"
              payload: { expected_table_version: "${v_p1}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:25:00Z" }
              as: PlatformAdmin
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_p2: $.data.version }
            - call: "POST /service-floor/reservations/${res_prio}/holds"
              payload: { expected_table_version: "${v_p2}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:50:00Z" }
              as: PlatformAdmin
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_p3: $.data.version }
            - call: "POST /service-floor/reservations/${res_prio}/holds"
              payload: { expected_table_version: "${v_p3}", table_id: "${table2_id}" }
              as: Host
          trigger:
            - call: "POST /service-floor/reservations/${res_prio}/party-size"
              payload: { party_size: 3 }
              as: Host
          assert:
            - "the booking now carries hold_count 3 and a party size of 3 against a two-seat table"
            - "the enlarged party breaches the table's seat capacity of 2 and also sits at the hold cap"
            - "a further hold grant returns 409 with ERR_TABLE_OVER_CAPACITY from priority 8, not ERR_HOLD_LIMIT_EXCEEDED from priority 9"
            - "the priority-9 check is reachable independently: a two-guest booking at the same cap returns ERR_HOLD_LIMIT_EXCEEDED"
            - "Reservation.${res_prio}.hold_count stays 3 in both cases"

      - name: credit_eligibility_precedes_the_cap_and_the_balance
        claim_type: Cascading validation
        grounds:
          - validations[priority=17]
          - validations[priority=19]
          - validations[priority=20]
          - errors.ERR_CREDIT_INELIGIBLE
        distinguishing_aspect: "Three credit checks run in a pinned order — tier eligibility, then the percentage cap, then the wallet balance — so a booking that breaches all three reports the tier error, and the later checks are only reachable once the earlier ones pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables and chefs, a SILVER party and a GOLD party, one seated T6 booking per party whose grill course is finished."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Marcus Bell", contact_phone: "212-555-0164", loyalty_tier: "SILVER" }
              as: Host
              captures: { party_silver: $.data.id }
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Owen Marsh", contact_phone: "212-555-0177", loyalty_tier: "GOLD" }
              as: Host
              captures: { party_gold: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_silver}", tier_id: "${tier6_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_silver: $.data.id }
            - call: "POST /service-floor/reservations/${res_silver}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table6_id}"
              payload: {}
              as: Host
              captures: { v_c1: $.data.version }
            - call: "POST /service-floor/reservations/${res_silver}/holds"
              payload: { expected_table_version: "${v_c1}", table_id: "${table6_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_silver}/seat"
              payload: {}
              as: Host
              captures: { res_silver_v: $.data.version, s_c1: $.data.current_sushi_show_id, g_c1: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${s_c1}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${s_c1}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${g_c1}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${g_c1}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_gold}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_gold: $.data.id }
            - call: "POST /service-floor/reservations/${res_gold}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_c2: $.data.version }
            - call: "POST /service-floor/reservations/${res_gold}/holds"
              payload: { expected_table_version: "${v_c2}", table_id: "${table4_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_gold}/seat"
              payload: {}
              as: Host
              captures: { res_gold_v: $.data.version, s_c2: $.data.current_sushi_show_id, g_c2: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${s_c2}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${s_c2}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${g_c2}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${g_c2}/events"
              payload: { event_type: "FINISH" }
              as: Chef
          trigger:
            - call: "POST /service-floor/reservations/${res_silver}/close"
              payload: { expected_reservation_version: "${res_silver_v}", credit_to_apply_cents: 9000 }
              as: Host
              captures: { err_tier: $.data.error_id }
            - call: "POST /service-floor/reservations/${res_gold}/close"
              payload: { expected_reservation_version: "${res_gold_v}", credit_to_apply_cents: 9000 }
              as: Host
              captures: { err_cap: $.data.error_id }
          assert:
            - "the SILVER request breaches eligibility AND the cap AND its zero balance, and returns 422 with err_tier == ERR_CREDIT_INELIGIBLE"
            - "err_tier != ERR_CREDIT_OVER_CAP and err_tier != ERR_CREDIT_EXCEEDED"
            - "the GOLD request passes eligibility and returns 422 with err_cap == ERR_CREDIT_OVER_CAP, because 9000 exceeds the percentage cap on its check"
            - "err_cap != ERR_CREDIT_EXCEEDED"
            - "neither booking was closed: both still report status SEATED and version unchanged"
            - "the balance check is reachable only after the cap: a GOLD request inside the cap but above its zero balance returns 402 ERR_CREDIT_EXCEEDED"

      - name: credit_below_the_minimum_ticket_is_refused_before_the_cap
        claim_type: Violation → Error
        grounds:
          - validations[priority=18]
          - errors.ERR_CREDIT_BELOW_MINIMUM
          - constants.CREDIT_MIN_AMOUNT_CENTS
        distinguishing_aspect: "A non-zero credit request under 500 cents is refused at the minimum-ticket check even when it would comfortably fit the percentage cap, so the minimum is a real gate rather than a rounding artifact."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables, chefs and a GOLD party whose seated T6 booking has finished its grill course."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Owen Marsh", contact_phone: "212-555-0177", loyalty_tier: "GOLD" }
              as: Host
              captures: { party_z: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_z}", tier_id: "${tier6_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_min: $.data.id }
            - call: "POST /service-floor/reservations/${res_min}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table6_id}"
              payload: {}
              as: Host
              captures: { v_m1: $.data.version }
            - call: "POST /service-floor/reservations/${res_min}/holds"
              payload: { expected_table_version: "${v_m1}", table_id: "${table6_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_min}/seat"
              payload: {}
              as: Host
              captures: { res_min_v: $.data.version, s_m1: $.data.current_sushi_show_id, g_m1: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${s_m1}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${s_m1}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${g_m1}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${g_m1}/events"
              payload: { event_type: "FINISH" }
              as: Chef
          trigger:
            - call: "POST /service-floor/reservations/${res_min}/close"
              payload: { expected_reservation_version: "${res_min_v}", credit_to_apply_cents: 400 }
              as: Host
              captures: { err_min: $.data.error_id }
            - call: "POST /service-floor/reservations/${res_min}/close"
              payload: { expected_reservation_version: "${res_min_v}", credit_to_apply_cents: 0 }
              as: Host
              captures: { closed_status: $.data.status }
          assert:
            - "the 400-cent request is 422 with err_min == ERR_CREDIT_BELOW_MINIMUM"
            - "err_min != ERR_CREDIT_OVER_CAP — the amount is well inside any cap on a check of this size"
            - "err_min != ERR_CREDIT_INELIGIBLE — the party is GOLD and eligible"
            - "the zero request is the legal way to decline credit and closes normally with closed_status == CLOSED"
            - "Reservation.${res_min}.credit_applied_cents == 0 after the close"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: table_seat_action_endpoint_enforces_its_state_preconditions
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/service-floor/tables/{table_id}/events
          - state_machines.GrillTable.AVAILABLE_to_SEATED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The table action endpoint is reachable directly as well as through the booking flow, and its own preconditions are enforced on that path: a SEAT with no reservation_id is refused and the table is left untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue and one AVAILABLE T6 table."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tbl6
            - call: "GET /service-floor/tables/${table6_id}"
              payload: {}
              as: FloorManager
              captures: { v_venue_ev1: $.data.version }
          trigger:
            - call: "POST /service-floor/tables/${table6_id}/events"
              payload: { event_type: "SEAT", expected_table_version: "${v_venue_ev1}" }
              as: FloorManager
              captures: { err_no_res: $.data.error_id }
            - call: "GET /service-floor/tables/${table6_id}"
              payload: {}
              as: FloorManager
              captures: { status_after: $.data.status }
          assert:
            - "the SEAT is refused because the endpoint requires a reservation to seat"
            - "err_no_res is a 4xx error_id drawn from the declared catalog"
            - "status_after == AVAILABLE — the rejected action left the table in its initial state"
            - "GET /service-floor/seatings?table_id=${table6_id} returns 0 rows"

      - name: run_ops_bulk_release_reports_partial_state_per_venue
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/service-floor/venues/{venue_id}/run_ops
          - state_machines.Reservation.HELD_to_REQUESTED
          - entities.Venue.fields.ops_epoch
        distinguishing_aspect: "A single run_ops call acts on every expired hold at the venue at once, so its effect is visible on several bookings while an unexpired hold is left exactly as it was."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables and chefs, and two submitted bookings held on two tables."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - *k_party
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_exp: $.data.id }
            - call: "POST /service-floor/reservations/${res_exp}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier2_id}", party_size: 2, scheduled_time: "2026-09-03T20:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_fresh: $.data.id }
            - call: "POST /service-floor/reservations/${res_fresh}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_b1: $.data.version }
            - call: "POST /service-floor/reservations/${res_exp}/holds"
              payload: { expected_table_version: "${v_b1}", table_id: "${table4_id}" }
              as: Host
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:30:00Z" }
              as: PlatformAdmin
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_b2: $.data.version }
            - call: "POST /service-floor/reservations/${res_fresh}/holds"
              payload: { expected_table_version: "${v_b2}", table_id: "${table2_id}" }
              as: Host
          trigger:
            - call: "POST /service-floor/venues/${venue_id}/run_ops"
              payload: {}
              as: FloorManager
              captures: { epoch_now: $.data.ops_epoch }
          assert:
            - "the first hold was granted at 12:00 with a 20-minute window, so at 12:30 it has expired and is released"
            - "the second hold was granted at 12:30 and is still open"
            - "epoch_now == 1 — the sweep advanced the venue's epoch even though only one booking changed"
            - "GET /service-floor/reservations/${res_exp} reports status == REQUESTED with hold_until null and table_id null"
            - "GET /service-floor/reservations/${res_fresh} reports status == HELD with hold_until 2026-09-02T12:50:00Z and table_id ${table2_id}"
            - "the sweep is not transactional across the venue: the expired release and the untouched fresh hold coexist in one response"

      - name: venue_cost_report_read_matches_a_direct_recomputation
        claim_type: Computed read
        grounds:
          - endpoints.GET_/service-floor/venues/{venue_id}/cost-report
          - calculations.venue_cost_report
          - calculations.restaurant_charge
        distinguishing_aspect: "The computed read returns the same figure the §1.3 formula produces and persists nothing, so two consecutive reads agree and the venue's own persisted restaurant_charge_cents is unaffected by the read."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers and three tables."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - call: "POST /service-floor/venues/${venue_id}/run_ops"
              payload: {}
              as: FloorManager
              captures: { charge_persisted: $.data.restaurant_charge_cents, venue_v: $.data.version }
          trigger:
            - call: "GET /service-floor/venues/${venue_id}/cost-report"
              payload: {}
              as: FloorManager
              captures: { cost_first: $.data.venue_cost_cents }
            - call: "GET /service-floor/venues/${venue_id}/cost-report"
              payload: {}
              as: FloorManager
              captures: { cost_second: $.data.venue_cost_cents }
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: FloorManager
              captures: { venue_v_after: $.data.version }
          assert:
            - "cost_first == cost_second == 2304000 — the read is deterministic"
            - "venue_v_after == ${venue_v} — the read mutated nothing and did not bump the venue version"
            - "the costs are separate quantities: Restaurant.${venue_id}.restaurant_charge_cents == 12 * 299 == 3588 while the report's venue_cost_cents is 2304000"
            - "GET with no body and no query parameters is accepted and returns 200"

      - name: reservation_seat_is_conditionally_allowed_only_for_a_live_hold
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/service-floor/reservations/{reservation_id}/seat
          - validations[priority=10]
          - errors.ERR_HOLD_WINDOW_CLOSED
        distinguishing_aspect: "SEAT is allowed only while the booking's hold window is still open; once the window closes the same call is refused with the window error, so the endpoint's legality is a function of the clock rather than of a static flag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables and chefs, and a party holding a two-guest T2 booking."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - *k_party
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier2_id}", party_size: 2, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_time: $.data.id }
            - call: "POST /service-floor/reservations/${res_time}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_t1: $.data.version }
            - call: "POST /service-floor/reservations/${res_time}/holds"
              payload: { expected_table_version: "${v_t1}", table_id: "${table2_id}" }
              as: Host
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:21:00Z" }
              as: PlatformAdmin
            - call: "POST /service-floor/reservations/${res_time}/seat"
              payload: {}
              as: Host
              captures: { err_window: $.data.error_id }
            - call: "POST /service-floor/venues/${venue_id}/run_ops"
              payload: {}
              as: FloorManager
            - call: "POST /service-floor/reservations/${res_time}/seat"
              payload: {}
              as: Host
              captures: { err_released: $.data.error_id }
          assert:
            - "at 12:21 the hold window opened at 12:00 and closed at 12:20, so the first SEAT returns 409 with err_window == ERR_HOLD_WINDOW_CLOSED"
            - "err_window != ERR_CHEF_ROTATION_EXHAUSTED — the failure is the window, not staffing"
            - "the run_ops sweep releases the stale hold and the booking goes to REQUESTED"
            - "the second SEAT now fails on the booking's own state, returning 409 with err_released == ERR_INVALID_STATE"
            - "GET /service-floor/reservations/${res_time} reports hold_count 1 and hold_until null"

  # ===========================================================================
  - section: errors
    instances:

      - name: maintenance_window_accept_after_the_late_grace_returns_window_late
        claim_type: Violation → Error
        grounds:
          - errors.ERR_MAINTENANCE_WINDOW_LATE
          - validations[priority=26]
          - endpoints.POST_/service-floor/maintenance-windows/{window_id}/accept
        distinguishing_aspect: "A window whose planned_start_at is long past cannot be accepted: the priority-26 late-grace check refuses it and the venue is never frozen, so the error is reachable without any state conflict."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with one table."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tbl6
            - call: "POST /service-floor/maintenance-windows"
              payload: { venue_id: "${venue_id}", table_id: "${table6_id}", maintenance_kind: "GRILL_REBUILD", planned_start_at: "2026-09-02T06:00:00Z", planned_end_at: "2026-09-02T07:00:00Z" }
              as: FloorManager
              captures: { stale_window: $.data.id }
          trigger:
            - call: "POST /service-floor/maintenance-windows/${stale_window}/accept"
              payload: {}
              as: FloorManager
              captures: { err_late: $.data.error_id }
          assert:
            - "the response status is 409 and err_late == ERR_MAINTENANCE_WINDOW_LATE"
            - "err_late != ERR_INVALID_STATE — the window is still SCHEDULED, so only the lateness check can fire"
            - "GET /service-floor/maintenance-windows/${stale_window} still reports status == SCHEDULED"
            - "GrillTable.${table6_id}.status is still AVAILABLE"

      - name: committing_a_show_to_an_off_shift_chef_returns_chef_not_on_station
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CHEF_ROTATION_EXHAUSTED
          - validations[priority=13]
          - calculations.chef_rotation
        distinguishing_aspect: "With every rostered chef still OFF_SHIFT the rotation's candidate set is empty, so a SEAT is refused with the rotation-exhausted error and the booking keeps its hold rather than being partially seated."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables and two chefs, neither of whom has clocked in."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - *k_party
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_no_chef: $.data.id }
            - call: "POST /service-floor/reservations/${res_no_chef}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_nc: $.data.version }
            - call: "POST /service-floor/reservations/${res_no_chef}/holds"
              payload: { expected_table_version: "${v_nc}", table_id: "${table4_id}" }
              as: Host
          trigger:
            - call: "POST /service-floor/reservations/${res_no_chef}/seat"
              payload: {}
              as: Host
              captures: { err_rot: $.data.error_id }
          assert:
            - "both chefs report status OFF_SHIFT, so the candidate set the rotation selects from is empty"
            - "the response status is 409 and err_rot == ERR_CHEF_ROTATION_EXHAUSTED"
            - "err_rot != ERR_INVALID_STATE — the booking is HELD and the state check passed"
            - "the booking is left exactly as it was: status HELD, hold_until unchanged, table_id still ${table4_id}"
            - "GET /service-floor/seatings?reservation_id=${res_no_chef} returns 0 rows — the refusal is atomic"

      - name: protein_variance_beyond_the_cap_returns_variance_exceeded
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PROTEIN_VARIANCE_EXCEEDED
          - validations[priority=16]
          - calculations.protein_portion_standard
        distinguishing_aspect: "The variance cap is enforced as an upper bound on the issued grams: a delta that would push the issue past standard plus the cap is refused, and a delta that would drop it below one gram is refused by the same check."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables and chefs, a GOLD party, and an open grill show posting a protein ticket."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Owen Marsh", contact_phone: "212-555-0177", loyalty_tier: "GOLD" }
              as: Host
              captures: { party_var: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_var}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_var: $.data.id }
            - call: "POST /service-floor/reservations/${res_var}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_var: $.data.version }
            - call: "POST /service-floor/reservations/${res_var}/holds"
              payload: { expected_table_version: "${v_var}", table_id: "${table4_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_var}/seat"
              payload: {}
              as: Host
              captures: { s_var: $.data.current_sushi_show_id, g_var: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${s_var}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${s_var}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${g_var}/events"
              payload: { event_type: "START" }
              as: Chef
              captures: { pt_var: $.data.protein_ticket_id }
          trigger:
            - call: "POST /service-floor/protein-tickets/${pt_var}/variance"
              payload: { delta_grams: 300 }
              as: Chef
              as_user_id: "${chef_a}"
              captures: { err_var: $.data.error_id }
            - call: "POST /service-floor/protein-tickets/${pt_var}/variance"
              payload: { delta_grams: 40 }
              as: Chef
              as_user_id: "${chef_a}"
              captures: { issued_ok: $.data.issued_grams }
            - call: "POST /service-floor/protein-tickets/${pt_var}/variance"
              payload: { delta_grams: -100000 }
              as: Chef
              as_user_id: "${chef_a}"
              captures: { err_floor: $.data.error_id }
          assert:
            - "the ticket was posted at standard 960 grams and issued 720 grams"
            - "a +300 gram delta would reach 1020, far past the standard plus the 40-gram cap, so it is refused with 422 and err_var == ERR_PROTEIN_VARIANCE_EXCEEDED"
            - "a +40 gram delta exactly reaches the cap and is accepted, leaving issued_ok == 760"
            - "a large negative delta would fall below one gram and is refused with the same error_id err_floor == ERR_PROTEIN_VARIANCE_EXCEEDED"
            - "ProteinTicket.${pt_var}.variance_grams == 760 - 960 == -200 after the accepted adjustment"

      - name: share_split_grace_returns_shared_split_invalid_for_a_stale_sibling
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SHARED_SPLIT_INVALID
          - validations[priority=11]
          - errors.ERR_TABLE_OVER_CAPACITY
        distinguishing_aspect: "A booking joining a shared table whose sibling's hold has already lapsed is refused with the split error, which is a different error_id from the capacity error the same shared-table feature raises once the combined party outgrows the table."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers and tables, and two bookings carrying the same invite code, the first held and then left to lapse."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - *k_party
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE", invite_code: "SHARE-3" }
              as: Host
              captures: { res_sib1: $.data.id }
            - call: "POST /service-floor/reservations/${res_sib1}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_sh1: $.data.version }
            - call: "POST /service-floor/reservations/${res_sib1}/holds"
              payload: { expected_table_version: "${v_sh1}", table_id: "${table4_id}" }
              as: Host
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier2_id}", party_size: 2, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE", invite_code: "SHARE-3" }
              as: Host
              captures: { res_sib2: $.data.id }
            - call: "POST /service-floor/reservations/${res_sib2}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:30:00Z" }
              as: PlatformAdmin
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_sh2: $.data.version }
          trigger:
            - call: "POST /service-floor/reservations/${res_sib2}/holds"
              payload: { expected_table_version: "${v_sh2}", table_id: "${table2_id}" }
              as: Host
              captures: { err_split: $.data.error_id }
          assert:
            - "the first sibling's hold window closed at 12:20, so at 12:30 it is no longer live"
            - "the response status is 422 and err_split == ERR_SHARED_SPLIT_INVALID"
            - "err_split != ERR_TABLE_OVER_CAPACITY — the two errors are raised for different causes under the same shared-table feature"
            - "Reservation.${res_sib2}.status is still REQUESTED with hold_count 0"
            - "the second booking is not blocked permanently: releasing the lapsed sibling and re-granting both holds succeeds once the sibling is refreshed"

  # ===========================================================================
  - section: rbac
    instances:

      - name: sushi_chef_forbidden_from_firing_a_grill_show
        claim_type: RBAC denial
        grounds:
          - roles.SushiChef
          - roles.Chef
          - endpoints.POST_/service-floor/shows/{show_id}/events
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The two kitchen roles are peer roles with non-overlapping exclusive operations: SushiChef owns the sushi-ticket surface and Chef owns the show surface, so a SushiChef calling a show-start is a 403 rather than a silent success."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables and chefs, a party seated at a T4 table with a live sushi phase."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - *k_party
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_id}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_rbac: $.data.id }
            - call: "POST /service-floor/reservations/${res_rbac}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_rb: $.data.version }
            - call: "POST /service-floor/reservations/${res_rbac}/holds"
              payload: { expected_table_version: "${v_rb}", table_id: "${table4_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_rbac}/seat"
              payload: {}
              as: Host
              captures: { sushi_rb: $.data.current_sushi_show_id }
          trigger:
            - call: "POST /service-floor/shows/${sushi_rb}/events"
              payload: { event_type: "START" }
              as: SushiChef
              captures: { err_rbac: $.data.error_id }
          assert:
            - "the response status is 403 and err_rbac == ERR_UNAUTHORIZED"
            - "err_rbac != ERR_INVALID_STATE — the phase is legitimately PLANNED and only the role blocked it"
            - "ShowPerformance.${sushi_rb}.status is still PLANNED with actual_start_at null"
            - "the same call as Chef succeeds with 200, so the denial is role-scoped and not an endpoint defect"

      - name: host_forbidden_from_commissioning_a_grill_table
        claim_type: RBAC denial
        grounds:
          - roles.Host
          - roles.FloorManager
          - endpoints.POST_/service-floor/tables
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "FloorManager owns the physical floor as an exclusive operation, so a Host creating a grill table is refused even though the Host is the role that seats parties at it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue."
          setup_api_calls:
            - *k_clock
            - *k_venue
          trigger:
            - call: "POST /service-floor/tables"
              payload: { venue_id: "${venue_id}", tier_code: "T4", seat_capacity: 4 }
              as: Host
              captures: { err_floor: $.data.error_id }
          assert:
            - "the response status is 403 and err_floor == ERR_UNAUTHORIZED"
            - "GET /service-floor/tables?venue_id=${venue_id} returns 0 rows"
            - "the identical call as FloorManager returns 201, so the operation exists and only the role was wrong"

      - name: platform_admin_cannot_clock_a_chef_in
        claim_type: Peer role isolation
        grounds:
          - roles.PlatformAdmin
          - roles.Chef
          - endpoints.POST_/service-floor/chefs/{chef_id}/events
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "ChefAssignment events are split across two owners — Chef clocks himself in and out while FloorManager rotates and suppresses — so neither PlatformAdmin nor FloorManager may perform CLOCK_IN on a chef's behalf, and the peer boundary is on the operation rather than on the resource."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue and one rostered chef."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_chef_a
            - *k_chef_b
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: Chef
              captures: { v_admin: $.data.version }
          trigger:
            - call: "POST /service-floor/chefs/${chef_a}/events"
              payload: { event_type: "CLOCK_IN", expected_venue_version: "${v_admin}" }
              as: PlatformAdmin
              captures: { err_admin: $.data.error_id }
            - call: "POST /service-floor/chefs/${chef_a}/events"
              payload: { event_type: "CLOCK_IN", expected_venue_version: "${v_admin}" }
              as: Chef
              as_user_id: "${chef_a}"
              captures: { chef_status: $.data.status, chef_seq: $.data.sequence_index }
          assert:
            - "the PlatformAdmin call returns 403 with err_admin == ERR_UNAUTHORIZED"
            - "ChefAssignment.${chef_a}.status is still OFF_SHIFT after the denied call"
            - "the Chef call succeeds with 200, reports chef_status == ON_STATION, and assigns chef_seq == 1 as the only on-station chef"
            - "Entity-backed identity is enforced: CLOCK_OUT with as_user_id set to the other chef's id is refused even for the Chef role"

      - name: unauthenticated_request_without_role_headers_returns_unauthenticated
        claim_type: RBAC denial
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Header validation precedes every other check, so a request missing both headers is a 401 before existence or state can be evaluated."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /service-floor/venues/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Host
              captures: { err_auth: $.data.error_id }
          assert:
            - "the response status is 401 and err_auth == ERR_UNAUTHENTICATED"
            - "err_auth != ERR_VENUE_NOT_FOUND — the header check runs before existence, so the unknown id is never reached"
            - "response_type is error and the envelope carries both error_id and message"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: clicking_in_with_a_stale_venue_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[chef-clockin-stale-venue]
          - validations[priority=29]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The OCC guard on the venue version is exercised with a deliberately stale value: a chef who read the venue before the floor moved it is rejected with 412, and the same call with the freshly read version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. One venue, two chefs, tiers and tables — enough that a run_ops before the retry advances the venue out from under the stale reader."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: Chef
              captures: { v_stale: $.data.version }
            - call: "POST /service-floor/venues/${venue_id}/run_ops"
              payload: {}
              as: FloorManager
              captures: { v_bumped: $.data.version }
          trigger:
            - call: "POST /service-floor/chefs/${chef_a}/events"
              payload: { event_type: "CLOCK_IN", expected_venue_version: "${v_stale} - 1" }
              as: Chef
              as_user_id: "${chef_a}"
              captures: { err_occ: $.data.error_id }
            - call: "POST /service-floor/chefs/${chef_a}/events"
              payload: { event_type: "CLOCK_IN", expected_venue_version: "${v_bumped}" }
              as: Chef
              as_user_id: "${chef_a}"
              captures: { chef_ok: $.data.status }
          assert:
            - "the run_ops call advanced Venue.version, so ${v_stale} is no longer the current version"
            - "the request carrying ${v_stale} - 1 returns 412 with err_occ == ERR_STALE_VERSION"
            - "the rejected request bumped nothing: Venue.version is still ${v_bumped}"
            - "ChefAssignment.${chef_a}.status is still OFF_SHIFT after the stale attempt"
            - "the retry carrying the freshly read ${v_bumped} returns 200 with chef_ok == ON_STATION"
            - "the guard is on the venue's version even though the actor's own resource is the chef, which is why the read must be refreshed after any floor mutation"

      - name: extending_a_seating_pushes_the_occupancy_past_its_tier_standard
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.turn_debt
          - state_machines.TableSeating.ACTIVE_to_ACTIVE
          - entities.Venue.fields.shortfall_turn_debt_minutes
        distinguishing_aspect: "Extending an occupancy does not by itself create turn debt — debt is driven by the vacated row's shortfall against its tier standard, so an extension on a standard already exceeded changes the debt bucket by exactly the extension's effect on the shortfall."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T12:00:00Z. A venue with a T2 tier whose standard turn is 50 minutes, one T2 table, two chefs and a party seated for 50 minutes."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Priya Nandi", contact_phone: "212-555-0193", loyalty_tier: "NONE" }
              as: Host
              captures: { party_d: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_d}", tier_id: "${tier2_id}", party_size: 2, scheduled_time: "2026-09-02T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_debt: $.data.id }
            - call: "POST /service-floor/reservations/${res_debt}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_db: $.data.version }
            - call: "POST /service-floor/reservations/${res_debt}/holds"
              payload: { expected_table_version: "${v_db}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_debt}/seat"
              payload: {}
              as: Host
              captures: { res_debt_seating: $.data.current_seating_id }
            - call: "GET /service-floor/venues/${venue_id}"
              payload: {}
              as: FloorManager
              captures: { debt_before: $.data.shortfall_turn_debt_minutes }
          trigger:
            - call: "POST /service-floor/seatings/${res_debt_seating}/extend"
              payload: { extension_minutes: 20 }
              as: FloorManager
              captures: { vacate_extended: $.data.expected_vacate_at }
            - call: "POST /service-floor/venues/${venue_id}/run_ops"
              payload: {}
              as: FloorManager
              captures: { debt_after: $.data.shortfall_turn_debt_minutes }
          assert:
            - "the occupancy window was originally 50 minutes, matching the T2 standard exactly, so its shortfall was 0"
            - "the extension moves vacate_extended 20 minutes later without touching seated_at"
            - "debt_before == debt_after while the occupancy is still ACTIVE — the sweep only counts VACATED rows"
            - "the shortfall is computed at vacate time from actual elapsed minutes, so a long-running occupancy contributes nothing rather than contributing its overhang"
            - "the bucket table is only consulted for rows with a positive shortfall, which is why the debt is unchanged here"

      - name: protein_issued_falls_below_the_standard_as_guest_count_rises
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.protein_portion_standard
          - entities.ProteinTicket.fields.standard_grams
          - entities.ProteinTicket.fields.variance_grams
        distinguishing_aspect: "standard_grams is recomputed when the guest count changes, and issued_grams tracks it down rather than staying pinned, so the variance stays a stable negative fraction instead of drifting as the table grows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with a T6 tier of protein_gram_standard 240, one T6 table, two chefs and a GOLD party seated as four guests with a finished grill show."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Owen Marsh", contact_phone: "212-555-0177", loyalty_tier: "GOLD" }
              as: Host
              captures: { party_rec: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_rec}", tier_id: "${tier6_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_rec: $.data.id }
            - call: "POST /service-floor/reservations/${res_rec}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table6_id}"
              payload: {}
              as: Host
              captures: { v_rec: $.data.version }
            - call: "POST /service-floor/reservations/${res_rec}/holds"
              payload: { expected_table_version: "${v_rec}", table_id: "${table6_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_rec}/seat"
              payload: {}
              as: Host
              captures: { s_rec: $.data.current_sushi_show_id, g_rec: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${s_rec}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${s_rec}/events"
              payload: { event_type: "FINISH" }
              as: Chef
          trigger:
            - call: "POST /service-floor/shows/${g_rec}/events"
              payload: { event_type: "START" }
              as: Chef
              captures: { pt_rec: $.data.protein_ticket_id }
            - call: "GET /service-floor/protein-tickets/${pt_rec}"
              payload: {}
              as: Chef
          assert:
            - "with four guests the standard is 4 * 240 == 960 and the issued amount is 960 - floor(960 / 1 / 4) == 720"
            - "ProteinTicket.${pt_rec}.variance_grams == 720 - 960 == -240"
            - "the issued amount is a fixed three-quarter share of the standard for any guest count, so the variance is never a stray constant"
            - "adding a fifth guest via party-size would raise the table's guest count and, on a fresh grill show, the standard to 1200 with the issued amount at 900"
            - "the venue rollup recomputes from the POSTED tickets rather than accumulating, so the same ticket is never counted twice"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: close_response_carries_the_settled_check_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/service-floor/reservations/{reservation_id}/close
          - entities.Reservation.fields.check_cents
          - entities.VenueLedgerEntry.fields.status
        distinguishing_aspect: "The consistency model is immediate, so every quantity the close computes — the final bill, the check, the applied credit and any true-up ledger row — is observable in the same request's response and in a read issued straight afterwards, with no settle delay."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables, chefs and a GOLD party seated at a T4 table whose grill show has finished."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Owen Marsh", contact_phone: "212-555-0177", loyalty_tier: "GOLD" }
              as: Host
              captures: { party_imm: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_imm}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_imm: $.data.id }
            - call: "POST /service-floor/reservations/${res_imm}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_imm: $.data.version }
            - call: "POST /service-floor/reservations/${res_imm}/holds"
              payload: { expected_table_version: "${v_imm}", table_id: "${table4_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_imm}/seat"
              payload: {}
              as: Host
              captures: { res_imm_v: $.data.version, s_imm: $.data.current_sushi_show_id, g_imm: $.data.current_grill_show_id }
            - call: "POST /service-floor/shows/${s_imm}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${s_imm}/events"
              payload: { event_type: "FINISH" }
              as: Chef
            - call: "POST /service-floor/shows/${g_imm}/events"
              payload: { event_type: "START" }
              as: Chef
            - call: "POST /service-floor/shows/${g_imm}/events"
              payload: { event_type: "FINISH" }
              as: Chef
          trigger:
            - call: "POST /service-floor/reservations/${res_imm}/close"
              payload: { expected_reservation_version: "${res_imm_v}", credit_to_apply_cents: 0 }
              as: Host
              captures: { close_bill: $.data.final_bill_cents, close_check: $.data.check_cents, close_status: $.data.status }
            - call: "GET /service-floor/reservations/${res_imm}"
              payload: {}
              as: Host
              captures: { reread_check: $.data.check_cents, reread_status: $.data.status }
          assert:
            - "close_status == CLOSED is visible in the closing response itself, with no settle delay"
            - "close_bill == 12800 (ENTITLEMENT 4 * 3200, no celebration fee, no shared set)"
            - "the shortfall against the T4 minimum of 14000 is 1200, which lands in band 2, so band_cents == 0.60 * 1200 == 720 and the true-up is ceil(720/25)*25 == 725"
            - "close_check == 12800 + 4800 + 725 == 18325"
            - "reread_check == close_check and reread_status == close_status — a read issued immediately after agrees exactly"
            - "the same call's response already reflects the cascade: the table is not TURNING until the table's own event is posted, but the booking and the money are final at once"

      - name: abandon_and_reopen_leave_no_partial_state_if_the_reopen_is_refused
        claim_type: saga
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Reservation.ABANDONED_to_HELD
          - state_machines.VenueLedgerEntry.VOIDED_to_POSTED
        distinguishing_aspect: "The multi-step abandon is not a compensating saga with a rollback budget — once abandoned, the ledger rows stay voided until an explicit reopen succeeds, so a refused reopen leaves the booking in a consistent ABANDONED state rather than a half-restored one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T12:00:00Z. A venue with tiers, tables and chefs, a GOLD party, an accepted venue-wide ventilation window, and a booking that will be abandoned by it."
          setup_api_calls:
            - *k_clock
            - *k_venue
            - *k_tier4
            - *k_tier6
            - *k_tier2
            - *k_tbl4
            - *k_tbl6
            - *k_tbl2
            - *k_chef_a
            - *k_chef_b
            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Owen Marsh", contact_phone: "212-555-0177", loyalty_tier: "GOLD" }
              as: Host
              captures: { party_sg: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_sg}", tier_id: "${tier4_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
              as: Host
              captures: { res_sg: $.data.id }
            - call: "POST /service-floor/reservations/${res_sg}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table4_id}"
              payload: {}
              as: Host
              captures: { v_sg: $.data.version }
            - call: "POST /service-floor/reservations/${res_sg}/holds"
              payload: { expected_table_version: "${v_sg}", table_id: "${table4_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_sg}/seat"
              payload: {}
              as: Host
            - call: "POST /service-floor/maintenance-windows"
              payload: { venue_id: "${venue_id}", maintenance_kind: "VENTILATION_SERVICE", planned_start_at: "2026-09-03T09:00:00Z", planned_end_at: "2026-09-03T10:00:00Z" }
              as: FloorManager
              captures: { vent_sg: $.data.id }
            - call: "POST /service-floor/maintenance-windows/${vent_sg}/accept"
              payload: {}
              as: FloorManager
          trigger:
            - call: "POST /service-floor/reservations/${res_sg}/reopen"
              payload: {}
              as: Host
              captures: { err_frozen_reopen: $.data.error_id }
            - call: "GET /service-floor/reservations/${res_sg}"
              payload: {}
              as: Host
              captures: { status_after_refusal: $.data.status }
            - call: "GET /service-floor/ledger-entries"
              payload: { venue_id: "${venue_id}", reservation_id: "${res_sg}" }
              as: Host
              captures: { voided_count: "$.data" }
          assert:
            - "the accept cascaded the booking to ABANDONED and voided its posted charges"
            - "the reopen attempted while the venue is still frozen is refused, with err_frozen_reopen == ERR_VENTILATION_FREEZE"
            - "status_after_refusal == ABANDONED — the refused reopen did not half-apply and the booking is in a fully consistent state"
            - "every ledger row for the booking is still VOIDED, so no compensating entry has been posted and no party credit has been clawed back"
            - "the state is idempotent under repetition: a second refused reopen leaves the booking and the ledger byte-identical"
