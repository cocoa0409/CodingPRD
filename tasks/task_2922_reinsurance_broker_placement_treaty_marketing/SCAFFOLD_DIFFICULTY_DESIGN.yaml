# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2922 — Reinsurance Broker Placement & Treaty Marketing
#
# Depth probe. Nine §0.5 rule_ids, 22 instances. Every `grounds:` entry resolves
# into SCAFFOLD.yaml §1.1–§1.7; every `assert:` numeric literal was computed by
# executing the relevant §1.3 `formula:` against its `constants:` in code.
#
# Standing conventions for every chain below:
#   * the logical clock is set explicitly as the first call; the server default
#     is 2026-08-01T00:00:00.000Z, which is inside no fixture treaty period here.
#   * `expected_layer_version` / `expected_program_version` are always taken
#     from a GET immediately before the write (§1.8 contract 3c).
#   * money is integer minor units; percentages carry exactly 4 decimals;
#     scores and index figures carry exactly 2.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  #   instance 1 : SigningLine percentage domain (signing_down_allocation)
  #   instance 2 : Layer money domain            (ceding_commission_settlement)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: signdown_pro_rata_versus_lead_protected_on_signing_line_percentages
        grounds:
          - calculations.signing_down_allocation
          - entities.Program.fields.signdown_method
          - entities.SigningLine.fields.signed_line_pct
          - entities.SigningLine.fields.committed_capacity_minor
          - state_machines.Layer.transitions.OVERSUBSCRIBED_to_SIGNED_DOWN
          - state_machines.SigningLine.transitions.PROVISIONAL_to_SIGNED
        distinguishing_aspect: |
          Two twin layers carrying byte-identical written lines (60.0000 and 50.0000, total
          110.0000) are signed down under the two variants of signing_down_allocation and
          land on different percentages on EVERY line — PRO_RATA gives 54.5455 / 45.4545
          while LEAD_PROTECTED gives 60.0000 / 40.0000, a divergence of exactly 5.4545
          percentage points on each line; this instance's subject is the SigningLine
          percentage domain, not the money domain of instance 2.
        test_recipe:
          setup:
            - "One cedent, two markets (Alpha Re lead-authorised with max_line_pct 60.0000, Bravo Re with max_line_pct 50.0000), both with capacity_limit_minor 2000000000 so no capacity gate ever fires."
            - "Two twin programs of the same cedent in different lines of business (so validations[priority=50] never fires): PROPERTY with signdown_method PRO_RATA and MARINE with signdown_method LEAD_PROTECTED."
            - "Each program carries one CATASTROPHE layer with limit_minor 1000000000 and quoted_gross_premium_minor 97125000, oversubscribed to written_line_total_pct 110.0000 by an Alpha Re line of 60.0000 (from a is_lead=true quote) and a Bravo Re line of 50.0000."
            - "Both programs sit in placement_status FIRM_ORDER and both layers in status OVERSUBSCRIBED; nothing has been signed down yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Alpha Re", security_rating: "AA", capacity_limit_minor: 2000000000, max_line_pct: 60.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { alpha_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Bravo Re", security_rating: "A", capacity_limit_minor: 2000000000, max_line_pct: 50.0000, lead_authorised: false }
              as: PlatformAdmin
              captures: { bravo_id: $.data.id }
            # ---- twin A : PRO_RATA -------------------------------------------------
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000, signdown_method: "PRO_RATA" }
              as: BrokerPlacementLead
              captures: { prog_pr: $.data.id }
            - call: "POST /programs/${prog_pr}/exposure-submissions"
              payload: { package_label: "NW-PROP-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_pr: $.data.id }
            - call: "POST /programs/${prog_pr}/layers"
              payload: { layer_label: "PROP CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_pr: $.data.id }
            - call: "POST /exposure-submissions/${sub_pr}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_pr}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
            - call: "POST /programs/${prog_pr}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_pr}/market-submissions"
              payload: { reinsurer_id: "${alpha_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_pr_a: $.data.id }
            - call: "POST /layers/${layer_pr}/market-submissions"
              payload: { reinsurer_id: "${bravo_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_pr_b: $.data.id }
            - call: "POST /market-submissions/${ms_pr_a}/quotes"
              payload: { offered_line_pct: 60.0000, quoted_rate_pct: 8.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${alpha_id}"
              captures: { q_pr_a: $.data.id }
            - call: "POST /market-submissions/${ms_pr_b}/quotes"
              payload: { offered_line_pct: 50.0000, quoted_rate_pct: 8.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: false }
              as: ReinsurerUnderwriter
              as_user_id: "${bravo_id}"
              captures: { q_pr_b: $.data.id }
            - call: "GET /layers/${layer_pr}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lv_pr_1: $.data.version }
            - call: "POST /quotes/${q_pr_a}/firm-order"
              payload: { accepted_line_pct: 60.0000, expected_layer_version: "${lv_pr_1}" }
              as: BrokerPlacementLead
              captures: { sl_pr_a: $.data.id }
            - call: "GET /layers/${layer_pr}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lv_pr_2: $.data.version }
            - call: "POST /quotes/${q_pr_b}/firm-order"
              payload: { accepted_line_pct: 50.0000, expected_layer_version: "${lv_pr_2}" }
              as: BrokerPlacementLead
              captures: { sl_pr_b: $.data.id }
            # ---- twin B : LEAD_PROTECTED -------------------------------------------
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Marine CAT 2026", line_of_business: "MARINE", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000, signdown_method: "LEAD_PROTECTED" }
              as: BrokerPlacementLead
              captures: { prog_lp: $.data.id }
            - call: "POST /programs/${prog_lp}/exposure-submissions"
              payload: { package_label: "NW-MAR-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_lp: $.data.id }
            - call: "POST /programs/${prog_lp}/layers"
              payload: { layer_label: "MAR CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_lp: $.data.id }
            - call: "POST /exposure-submissions/${sub_lp}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_lp}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
            - call: "POST /programs/${prog_lp}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_lp}/market-submissions"
              payload: { reinsurer_id: "${alpha_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_lp_a: $.data.id }
            - call: "POST /layers/${layer_lp}/market-submissions"
              payload: { reinsurer_id: "${bravo_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_lp_b: $.data.id }
            - call: "POST /market-submissions/${ms_lp_a}/quotes"
              payload: { offered_line_pct: 60.0000, quoted_rate_pct: 8.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${alpha_id}"
              captures: { q_lp_a: $.data.id }
            - call: "POST /market-submissions/${ms_lp_b}/quotes"
              payload: { offered_line_pct: 50.0000, quoted_rate_pct: 8.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: false }
              as: ReinsurerUnderwriter
              as_user_id: "${bravo_id}"
              captures: { q_lp_b: $.data.id }
            - call: "GET /layers/${layer_lp}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lv_lp_1: $.data.version }
            - call: "POST /quotes/${q_lp_a}/firm-order"
              payload: { accepted_line_pct: 60.0000, expected_layer_version: "${lv_lp_1}" }
              as: BrokerPlacementLead
              captures: { sl_lp_a: $.data.id }
            - call: "GET /layers/${layer_lp}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lv_lp_2: $.data.version }
            - call: "POST /quotes/${q_lp_b}/firm-order"
              payload: { accepted_line_pct: 50.0000, expected_layer_version: "${lv_lp_2}" }
              as: BrokerPlacementLead
              captures: { sl_lp_b: $.data.id }
          trigger:
            - call: "POST /layers/${layer_pr}/sign-down"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_lp}/sign-down"
              payload: {}
              as: BrokerPlacementLead
          assert:
            - "SigningLine.${sl_pr_a}.signed_line_pct == 54.5455"
            - "SigningLine.${sl_pr_b}.signed_line_pct == 45.4545"
            - "SigningLine.${sl_pr_a}.committed_capacity_minor == 545455000"
            - "SigningLine.${sl_pr_b}.committed_capacity_minor == 454545000"
            - "SigningLine.${sl_lp_a}.signed_line_pct == 60.0000"
            - "SigningLine.${sl_lp_b}.signed_line_pct == 40.0000"
            - "SigningLine.${sl_lp_a}.committed_capacity_minor == 600000000"
            - "SigningLine.${sl_lp_b}.committed_capacity_minor == 400000000"
            - "SigningLine.${sl_lp_a}.signed_line_pct - SigningLine.${sl_pr_a}.signed_line_pct == 5.4545"
            - "SigningLine.${sl_pr_b}.signed_line_pct - SigningLine.${sl_lp_b}.signed_line_pct == 5.4545"
            - "Layer.${layer_pr}.signed_line_total_pct == 100.0000"
            - "Layer.${layer_lp}.signed_line_total_pct == 100.0000"
            - "Layer.${layer_pr}.status == SIGNED_DOWN"
            - "Layer.${layer_lp}.status == SIGNED_DOWN"
            - "SigningLine.${sl_pr_a}.status == SIGNED and SigningLine.${sl_lp_a}.status == SIGNED"

      - name: ceding_commission_provisional_flat_versus_final_sliding_on_layer_money
        grounds:
          - calculations.ceding_commission_settlement
          - entities.Layer.fields.provisional_ceding_commission_minor
          - entities.Layer.fields.final_ceding_commission_minor
          - entities.Layer.fields.ceding_commission_delta_minor
          - entities.Layer.fields.loss_ratio_pct
          - state_machines.Program.transitions.FIRM_ORDER_to_BOUND
          - state_machines.Program.transitions.BOUND_to_SETTLED
        distinguishing_aspect: |
          The same QUOTA_SHARE layer is commissioned twice on the money axis: PROVISIONAL_FLAT
          at bind ignores the slide entirely and books 222000000, while FINAL_SLIDING at
          settlement slides against a realised loss_ratio_pct of exactly 80.0000, clamps to
          COMMISSION_MIN_PCT 20.0000 and books 148000000 — a ceding_commission_delta_minor of
          -74000000; the subject is Layer money, not the SigningLine percentages of instance 1.
        test_recipe:
          setup:
            - "One cedent, one market Echo Re with max_line_pct 100.0000 and capacity_limit_minor 800000000."
            - "One PROPERTY program whose single QUOTA_SHARE layer has cession_pct 40.0000, base_rate_pct 40.0000, subject_premium_base_minor 2000000000, limit_minor 800000000, ceding_commission_pct 30.0000 and reinstatements_total 0, so quoted_gross_premium_minor is 740000000."
            - "Echo Re takes a 100.0000 line; the layer is FULLY_PLACED and the program reaches FIRM_ORDER."
            - "Brokerage is disclosed and acknowledged, so bind is admissible; documentation is walked to WORDING_AGREED so settle is admissible."
            - "A single claim of gross_claim_minor 1480000000 cedes exactly 592000000 and is fully collected, so Layer.incurred_ceded_minor is 592000000 and the collection movement is settled — no FiduciaryTransaction is left PENDING/APPROVED/HELD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Echo Re", security_rating: "AA", capacity_limit_minor: 800000000, max_line_pct: 100.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { echo_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property QS 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "NW-QS-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "QS 40 pct", layer_type: "QUOTA_SHARE", attachment_minor: 0, limit_minor: 800000000, base_rate_pct: 40.0000, subject_premium_base_minor: 2000000000, expected_loss_cost_minor: 300000000, cession_pct: 40.0000, reinstatements_total: 0, ceding_commission_pct: 30.0000 }
              as: BrokerPlacementLead
              captures: { layer_id: $.data.id }
            - call: "POST /exposure-submissions/${sub_id}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_id}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
            - call: "POST /programs/${prog_id}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_id}/market-submissions"
              payload: { reinsurer_id: "${echo_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_id: $.data.id }
            - call: "POST /market-submissions/${ms_id}/quotes"
              payload: { offered_line_pct: 100.0000, quoted_rate_pct: 40.0000, ceding_commission_pct: 30.0000, reinstatements_offered: 0, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${echo_id}"
              captures: { quote_id: $.data.id }
            - call: "GET /layers/${layer_id}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lv1: $.data.version }
            - call: "POST /quotes/${quote_id}/firm-order"
              payload: { accepted_line_pct: 100.0000, expected_layer_version: "${lv1}" }
              as: BrokerPlacementLead
              captures: { sl_id: $.data.id }
            - call: "POST /programs/${prog_id}/brokerage-disclosures"
              payload: { brokerage_pct: 2.5000 }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { disc_id: $.data.id }
            - call: "POST /brokerage-disclosures/${disc_id}/disclose"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
            - call: "POST /brokerage-disclosures/${disc_id}/decision"
              payload: { decision: "ACKNOWLEDGE" }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
            - call: "POST /programs/${prog_id}/bind"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /programs/${prog_id}/contract-documents"
              payload: { document_type: "SLIP", wording_reference: "NW-QS-2026-SLIP" }
              as: BrokerPlacementLead
            - call: "POST /programs/${prog_id}/contract-documents"
              payload: { document_type: "WORDING_DRAFT", wording_reference: "NW-QS-2026-WD1" }
              as: BrokerPlacementLead
            - call: "POST /programs/${prog_id}/contract-documents"
              payload: { document_type: "AGREED_WORDING", wording_reference: "NW-QS-2026-AW1" }
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_id}/claim-advocacies"
              payload: { claim_reference: "CL-2026-QS-001", event_date: "2026-06-01T00:00:00.000Z", gross_claim_minor: 1480000000 }
              as: BrokerPlacementLead
              captures: { adv_id: $.data.id, ceded_at_notification: $.data.ceded_claim_minor }
            - call: "POST /claim-advocacies/${adv_id}/review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /claim-advocacies/${adv_id}/collections"
              payload: { signing_line_id: "${sl_id}", amount_minor: 592000000 }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { coll_txn: $.data.id }
            - call: "POST /fiduciary-transactions/${coll_txn}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
            - call: "POST /fiduciary-transactions/${coll_txn}/settle"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
          trigger:
            - call: "POST /programs/${prog_id}/settle"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
          assert:
            - "Layer.${layer_id}.provisional_ceding_commission_minor == 222000000"
            - "Layer.${layer_id}.incurred_ceded_minor == 592000000"
            - "Layer.${layer_id}.loss_ratio_pct == 80.0000"
            - "Layer.${layer_id}.final_ceding_commission_minor == 148000000"
            - "Layer.${layer_id}.ceding_commission_delta_minor == -74000000"
            - "Layer.${layer_id}.quoted_gross_premium_minor == 740000000"
            - "Program.${prog_id}.placement_status == SETTLED"
            - "${ceded_at_notification} == 592000000"

  # ===========================================================================
  # RULE 2 — combinatorial formulae in two DIFFERENT modes
  #   instance 1 : mode (c) pinned evaluation order (tier off the PROVISIONAL premium)
  #   instance 2 : mode (b) per-line-then-sum vs sum-then-round brokerage
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cat_layer_premium_pins_volume_tier_to_provisional_not_discounted_premium
        grounds:
          - calculations.layer_technical_premium
          - entities.Layer.fields.quoted_gross_premium_minor
          - validations[priority=52]
        distinguishing_aspect: |
          Mode (c) — pinned evaluation order. layer_technical_premium is a four-stage pipeline
          (reinstatement loading -> provisional premium -> volume tier selected FROM THE
          PROVISIONAL premium -> discount) and the tier boundary sits between the two candidate
          inputs: the provisional 105000000 selects VOLUME_TIER_3 (7.5000) while the discounted
          result 97125000 would wrongly select VOLUME_TIER_2 (5.0000). Re-deriving the tier from
          the discounted figure yields 99750000. Instance 2 exercises mode (b) instead.
        test_recipe:
          setup:
            - "One cedent and one PROPERTY program incepting 2026-01-01 with no layers yet; placement_status DRAFT so layer creation is admitted by validations[priority=32]."
            - "The layer to be created is a CATASTROPHE layer with subject_premium_base_minor 1250000000, base_rate_pct 8.0000, reinstatements_total 1 and reinstatement_premium_pct 100.0000, so the reinstatement loading multiplies the base rate by (1 + 5.0000 * 1 / 100) = 1.05 giving a loaded rate of 8.4000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "PROP CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_id: $.data.id, gross: $.data.quoted_gross_premium_minor }
          assert:
            - "${gross} == 97125000"
            - "Layer.${layer_id}.quoted_gross_premium_minor == 97125000"
            - "Layer.${layer_id}.quoted_gross_premium_minor != 99750000  # tier re-derived from the discounted premium"
            - "Layer.${layer_id}.status == OPEN"

