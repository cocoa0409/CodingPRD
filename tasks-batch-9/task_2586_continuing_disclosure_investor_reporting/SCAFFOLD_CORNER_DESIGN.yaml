              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { reqOpen_id: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${reqFixed_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { itemFixed_id: "$.data[0].id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${reqOpen_id}"
              payload: {}
