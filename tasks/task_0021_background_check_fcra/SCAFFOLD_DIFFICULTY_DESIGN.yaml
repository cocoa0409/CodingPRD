  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: submit_in_wrong_state_beats_salary_history_ban_check
        grounds:
          - validations[priority=50]
          - validations[priority=65]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SALARY_HISTORY_DISCLOSED_BANNED]
        distinguishing_aspect: |
          Pair: state (priority 50, ERR_INVALID_STATE) vs business_safety (priority 65,
          ERR_SALARY_HISTORY_DISCLOSED_BANNED). The same submit request violates both
          rules (application already SUBMITTED + salary_history_disclosed set in a
          salary-ban jurisdiction); state precondition wins because its priority is lower
          (50 < 65), so ERR_INVALID_STATE is returned, NOT ERR_SALARY_HISTORY_DISCLOSED_BANNED.
        test_recipe:
          setup:
            - "Application in SUBMITTED state in CA (salary_history_ban_enabled=true) with salary_history_disclosed=120000."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "CA", ban_the_box_enabled: true, salary_history_ban_enabled: true, pre_adverse_waiting_days: 5 }
              as: PlatformAdmin
              captures: { jur_ca_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Vint Cerf", email: "vint@example.com", date_of_birth: "1943-06-23T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            # First, create + submit an Application with salary null (legal in CA).
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_ca_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { consent_id: $.data.id, consent_v0: $.data.version }
            - call: "POST /api/v1/consents/${consent_id}/grant"
              payload: { expected_consent_disclosure_version: "${consent_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
          trigger:
            # Now re-submit (already SUBMITTED) → both rules violated; state priority wins.
            # The salary_history_disclosed field cannot be re-set after creation, but the
            # application IS in the salary-ban jurisdiction so rule 65 would fire on a
            # fresh submit too — except state precondition rule 50 fires first.
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v1}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_INVALID_STATE'"

      - name: not_found_application_beats_consent_not_granted_check
        grounds:
          - validations[priority=40]
          - validations[priority=80]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_CONSENT_NOT_GRANTED]
        distinguishing_aspect: |
          Pair: existence (priority 40, ERR_NOT_FOUND) vs business_referential (priority
          80, ERR_CONSENT_NOT_GRANTED). POST /background-check-orders with a non-existent
          application_id AND a consent_id whose status is PENDING (not GRANTED) violates
          both. Existence wins (40 < 80), so ERR_NOT_FOUND is returned. Different
          error-category pair than Rule 5a (which is state vs business_safety).
        test_recipe:
          setup:
            - "ConsentDisclosure in PENDING state exists for a real application; a separate non-existent application_id UUID is used in the request."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "MN", ban_the_box_enabled: false, salary_history_ban_enabled: false, pre_adverse_waiting_days: 5 }
              as: PlatformAdmin
              captures: { jur_mn_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Tim Berners-Lee", email: "tim@example.com", date_of_birth: "1955-06-08T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_mn_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { real_app_id: $.data.id, real_app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${real_app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { pending_consent_id: $.data.id }
            # NOTE: consent left in PENDING (not granted). real_app_v0 still 1.
          trigger:
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "00000000-0000-4000-8000-000000000000", consent_id: "${pending_consent_id}", expected_application_version: "${real_app_v0}" }
              as: Recruiter
              as_user_id: "rec-gail"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == 'ERR_NOT_FOUND'"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: finalize_at_exactly_earliest_final_at_succeeds_one_ms_before_fails
        grounds:
          - validations[priority=75]
          - calculations.compute_earliest_final
          - state_machines.AdverseAction.PRE_ADVERSE_SENT_to_FINALIZED
          - errors[ERR_WAITING_PERIOD_NOT_ELAPSED]
        distinguishing_aspect: |
          Numeric (temporal) boundary on the AdverseAction.finalize endpoint: SystemClock.current_utc
          >= AdverseAction.earliest_final_at (>= NOT >). At T - 1ms the finalize returns
          ERR_WAITING_PERIOD_NOT_ELAPSED; at exactly T it succeeds. Reachable through
          POST /adverse-actions/{id}/finalize.
        test_recipe:
          setup:
            - "AdverseAction with pre_adverse_sent_at=2026-06-01T10:00:00.000Z and pre_adverse_waiting_days=5 → earliest_final_at=2026-06-06T10:00:00.000Z."
