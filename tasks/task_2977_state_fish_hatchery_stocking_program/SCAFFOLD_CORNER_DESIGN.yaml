      - name: a_three_million_egg_take_reports_water_right_exceeded
        claim_type: error_triggerable
        grounds:
          - validations.water-right-ceiling
          - calculations.egg_take_projection
          - errors.ERR_WATER_RIGHT_EXCEEDED
        distinguishing_aspect: |
          Acre-feet are charged at 0.05 af per thousand eggs, so a 3,000,000-egg take
          would consume 150.0000 af against a 120.0 af decree — even counting the
          3.0000 af this event already holds in reserve. The refusal must leave the
          reservation intact rather than converting part of it.
        test_recipe:
          setup:
            - "Station SLVC has annual_water_right_af 120.0 with 3.0000 af reserved by spawn event S1"
            - "S1 is PLANNED and the clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
          trigger:
            - call: "POST /spawn-events/${spawn1_id}/record-take"
              payload: { eggs_taken: 3000000, taken_at: "2026-08-10T00:00:00Z" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id ERR_WATER_RIGHT_EXCEEDED — 150.0000 af exceeds 117.0000 available plus the 3.0000 af held"
            - "SpawnEvent.${spawn1_id}.status == PLANNED with eggs_taken == null"
            - "Hatchery.${hatch_id}.water_reserved_af == 3.0000, water_used_af == 0.0000, water_available_af == 117.0000"
            - "BroodStock.${brood_id}.cumulative_eggs_taken == 0 and females_spent == 0"
            - "GET /rearing-lots?spawn_event_id=${spawn1_id} returns total_count == 0 — no lot was born"

      - name: a_trip_costing_more_than_the_appropriation_reports_budget_exceeded
        claim_type: error_triggerable
        grounds:
          - validations.budget-ceiling
          - calculations.transport_cost
          - errors.ERR_BUDGET_EXCEEDED
        distinguishing_aspect: |
          The fiscal gate sits last, at priority 15, so it can only be observed when
          every other rule passes. Station GLDN is given an annual_budget_cents of
          40000 — less than the 45000-cent mobilisation fee alone — so even a
          1000-egg-stage trip costing 45033 cents is unaffordable.
        test_recipe:
          setup:
            - "Station GLDN has annual_budget_cents 40000, annual_water_right_af 50.0 and rearing_capacity_lbs 2000.0"
            - "A 1000-fish EGG-stage lot at avg_weight_g 0.1 exists there, and request R-G was granted 1000 FRY-class fish"
          setup_api_calls:
            - *c_clock_0801
            - *c_water_a
            - &c_hatch2
              call: "POST /hatcheries"
              payload:
                name: "Golden Springs Hatchery"
                station_code: "GLDN"
                water_source_type: "WELL"
                annual_water_right_af: 50.0
                rearing_capacity_lbs: 2000.0
                oxygen_supply_lpm: 6.0
                effluent_permit_number: "CO-0044822"
                tss_permit_limit_mg_l: 25.0
                annual_budget_cents: 40000
              as: ProgramAdmin
              captures: { hatch2_id: $.data.id }
            - &c_brood2
              call: "POST /brood-stocks"
              payload:
                hatchery_id: "${hatch2_id}"
                species: "RAINBOW_TROUT"
                strain: "Hofer"
                female_count: 400
                male_count: 200
                expected_fecundity_per_female: 3000
                spawning_window_start: "2026-08-01T00:00:00Z"
                spawning_window_end: "2026-10-31T00:00:00Z"
                egg_take_target: 120000
              as: HatcheryManager
              as_user_id: "${hatch2_id}"
              captures: { brood2_id: $.data.id }
            - call: "POST /brood-stocks/${brood2_id}/open-spawning-window"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch2_id}"
            - &c_spawn2
              call: "POST /spawn-events"
              payload:
                brood_stock_id: "${brood2_id}"
                planned_take_date: "2026-08-10T00:00:00Z"
                females_spawned: 20
                target_release_count: 500
              as: HatcheryManager
              as_user_id: "${hatch2_id}"
              captures: { spawn2_id: $.data.id }
            - *c_clock_0810
            - call: "POST /spawn-events/${spawn2_id}/record-take"
              payload: { eggs_taken: 1000, taken_at: "2026-08-10T00:00:00Z" }
              as: HatcheryManager
              as_user_id: "${hatch2_id}"
            - &c_lot2
              call: "GET /rearing-lots?spawn_event_id=${spawn2_id}"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch2_id}"
              captures: { lot2_id: "$.data[0].id", lot2_v: "$.data[0].version" }
            - &c_truck2
              call: "POST /transport-units"
              payload:
                hatchery_id: "${hatch2_id}"
                unit_code: "TRK-02"
                tank_gallons: 500.0
                max_load_lbs: 300.0
                oxygen_lpm: 12.0
                certification_expires_at: "2027-01-01T00:00:00Z"
              as: HatcheryManager
              as_user_id: "${hatch2_id}"
              captures: { truck2_id: $.data.id }
            - &c_req_g
              call: "POST /stocking-requests"
              payload:
                water_id: "${water_a_id}"
                species: "RAINBOW_TROUT"
                requested_count: 1000
                size_class: "FRY"
                justification: "Fry plant from Golden Springs"
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { req_g_id: $.data.id }
            - &c_plan_g
              call: "POST /allocation-plans"
              payload:
                hatchery_id: "${hatch2_id}"
                fiscal_year: 2027
                species: "RAINBOW_TROUT"
                size_class: "FRY"
                available_count: 5000
                public_request_cap_pct: 0.20
                allocation_mode: "PRIORITY_WATERFALL"
              as: ProgramAdmin
              captures: { plan_g_id: $.data.id, plan_g_v0: $.data.version }
            - call: "POST /stocking-requests/${req_g_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan_g_id}", expected_plan_version: "${plan_g_v0}" }
              as: RegionalBiologist
              as_user_id: "bio-carla"
            - call: "GET /allocation-plans/${plan_g_id}"
              payload: {}
              as: ProgramAdmin
              captures: { plan_g_v1: $.data.version }
            - call: "POST /allocation-plans/${plan_g_id}/run"
              payload: { expected_plan_version: "${plan_g_v1}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req_g_id}"
                lot_id: "${lot2_id}"
                transport_unit_id: "${truck2_id}"
                fish_count: 1000
                scheduled_depart_at: "2026-08-11T09:00:00Z"
                scheduled_return_at: "2026-08-11T17:00:00Z"
                expected_lot_version: "${lot2_v}"
              as: HatcheryManager
              as_user_id: "${hatch2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id ERR_BUDGET_EXCEEDED — planned_load_lbs 0.22 costs 45000 + ceil(0.22 * 150) = 45033 against 40000 available"
            - "Hatchery.${hatch2_id}.budget_committed_cents == 0, budget_spent_cents == 0, budget_available_cents == 40000"
            - "RearingLot.${lot2_id}.reserved_count == 0 and version == ${lot2_v}"
            - "StockingRequest.${req_g_id}.status == ALLOCATED with allocated_count == 1000 — the grant survives the failed trip"

      - name: unknown_spawn_event_id_returns_spawn_event_not_found
        claim_type: error_triggerable
        grounds:
          - validations.path-entity-exists
          - errors.ERR_SPAWN_EVENT_NOT_FOUND
        distinguishing_aspect: |
          Each collection reports its OWN 404 id. A well-formed UUID that addresses
          no spawn event must produce ERR_SPAWN_EVENT_NOT_FOUND, never a generic
          ERR_INVALID_REQUEST and never another collection's not-found id.
        test_recipe:
          setup:
            - "No spawn event has the id 11111111-1111-4111-8111-111111111111"
          setup_api_calls:
            - *c_clock_0801
          trigger:
            - call: "GET /spawn-events/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_SPAWN_EVENT_NOT_FOUND"

      - name: unknown_inspection_id_returns_inspection_not_found
        claim_type: error_triggerable
        grounds:
          - validations.path-entity-exists
          - errors.ERR_INSPECTION_NOT_FOUND
        distinguishing_aspect: |
          The path row is resolved before the segregation-of-duties rule at priority
          11 can look at sampled_by_user_id, so certifying a non-existent inspection
          is a 404 and not a 403.
        test_recipe:
          setup:
            - "No health inspection has the id 22222222-2222-4222-8222-222222222222"
          setup_api_calls:
            - *c_clock_0801
          trigger:
            - call: "POST /health-inspections/22222222-2222-4222-8222-222222222222/certify"
              payload: {}
              as: FishHealthVeterinarian
              as_user_id: "vet-bruno"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_INSPECTION_NOT_FOUND"
            - "NOT ERR_SEGREGATION_OF_DUTIES — there is no row whose sampler could be compared"

      - name: unknown_request_id_returns_request_not_found
        claim_type: error_triggerable
        grounds:
          - validations.path-entity-exists
          - errors.ERR_REQUEST_NOT_FOUND
        distinguishing_aspect: |
          Withdrawing a request that does not exist must be ERR_REQUEST_NOT_FOUND.
          The caller is a ProgramAdmin, who is exempt from the ownership rule at
          priority 3, so nothing can mask the 404.
        test_recipe:
          setup:
            - "No stocking request has the id 33333333-3333-4333-8333-333333333333"
          setup_api_calls:
            - *c_clock_0801
          trigger:
            - call: "POST /stocking-requests/33333333-3333-4333-8333-333333333333/withdraw"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_REQUEST_NOT_FOUND"
            - "NOT ERR_NOT_REQUEST_OWNER — a ProgramAdmin is exempt from the ownership rule"

      - name: unknown_plan_id_in_the_body_returns_plan_not_found
        claim_type: error_triggerable
        grounds:
          - validations.body-fk-exists
          - errors.ERR_PLAN_NOT_FOUND
        distinguishing_aspect: |
          The body foreign key is resolved at priority 5, ahead of the OCC comparison
          at 7, so a request pointing at a non-existent plan gets ERR_PLAN_NOT_FOUND
          (404) even though the expected_plan_version it carries belongs to a
          different, real plan.
        test_recipe:
          setup:
            - "Request R1 is SUBMITTED and plan P1 exists at version 1"
            - "No allocation plan has the id 44444444-4444-4444-8444-444444444444"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_req1
            - *c_plan1
          trigger:
            - call: "POST /stocking-requests/${req1_id}/attach-to-plan"
              payload: { allocation_plan_id: "44444444-4444-4444-8444-444444444444", expected_plan_version: "${plan1_v0}" }
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_PLAN_NOT_FOUND"
            - "NOT ERR_STALE_PLAN_VERSION (412) — existence is checked two priorities earlier"
            - "StockingRequest.${req1_id}.status == SUBMITTED and AllocationPlan.${plan1_id}.version == ${plan1_v0}"

      - name: unknown_transport_unit_in_the_body_returns_transport_unit_not_found
        claim_type: error_triggerable
        grounds:
          - validations.body-fk-exists
          - errors.ERR_TRANSPORT_UNIT_NOT_FOUND
        distinguishing_aspect: |
          POST /stocking-events declares its foreign keys as request, lot, then unit.
          With a real request and a real lot, the third key is the first to fail, so
          the answer must be ERR_TRANSPORT_UNIT_NOT_FOUND — and it must arrive before
          any state, count or fiscal rule looks at the still-SUBMITTED request.
        test_recipe:
          setup:
            - "Request R1 is SUBMITTED, a rearing lot exists, and no transport unit has the id 55555555-5555-4555-8555-555555555555"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_req1
            - *c_lot_v
          trigger:
            - call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req1_id}"
                lot_id: "${lot_id}"
                transport_unit_id: "55555555-5555-4555-8555-555555555555"
                fish_count: 100
                scheduled_depart_at: "2026-08-11T09:00:00Z"
                scheduled_return_at: "2026-08-11T17:00:00Z"
                expected_lot_version: "${lot_v1}"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_TRANSPORT_UNIT_NOT_FOUND"
            - "NOT ERR_INVALID_STATE and NOT ERR_ALLOCATION_EXCEEDED — the request is only SUBMITTED with allocated_count 0, but existence is checked at priority 5"
            - "RearingLot.${lot_id}.reserved_count == 0 and version == ${lot_v1}"

      - name: unknown_event_id_returns_event_not_found
        claim_type: error_triggerable
        grounds:
          - validations.path-entity-exists
          - errors.ERR_EVENT_NOT_FOUND
        distinguishing_aspect: |
          Aborting a trip that does not exist must be ERR_EVENT_NOT_FOUND at 404, not
          ERR_INVALID_STATE — there is no status to be illegal.
        test_recipe:
          setup:
            - "No stocking event has the id 66666666-6666-4666-8666-666666666666"
          setup_api_calls:
            - *c_clock_0801
          trigger:
            - call: "POST /stocking-events/66666666-6666-4666-8666-666666666666/abort"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_EVENT_NOT_FOUND"
            - "NOT ERR_INVALID_STATE (409)"

      - name: quarantined_lot_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_LOT_QUARANTINED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / quarantine_safety_beats_budget_ceiling_on_event_creation
          rationale: "The named §1.8 instance schedules an unaffordable trip against a QUARANTINED lot and asserts ERR_LOT_QUARANTINED, proving the error is reachable and outranks the fiscal gate."

      - name: brood_stock_not_spawning_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BROOD_STOCK_NOT_SPAWNING
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / spawn_event_creation_requires_brood_stock_in_spawning
          rationale: "The named §1.8 instance asserts the error from a READY group and again from a CLOSED group."

      - name: water_closed_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_WATER_CLOSED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / release_requires_the_destination_water_active
          rationale: "The named §1.8 instance closes the destination under an IN_TRANSIT trip and asserts ERR_WATER_CLOSED on release."

      - name: hatchery_frozen_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HATCHERY_FROZEN
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / load_blocked_while_the_station_posture_is_frozen
          rationale: "The named §1.8 instance drives the station to FROZEN with two effluent exceedances and asserts the load refusal."

      - name: density_cap_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DENSITY_CAP_EXCEEDED
        excluded_because:
          difficulty_instance: boundary_precision_check / density_cap_admits_exactly_one_then_refuses_the_next_increment
          rationale: "The named §1.8 instance asserts the error on the first feeding that would carry density_index above 1.0000."

      - name: health_certificate_expired_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HEALTH_CERTIFICATE_EXPIRED
        excluded_because:
          difficulty_instance: boundary_precision_check / load_one_second_past_expiry_reports_certificate_expired
          rationale: "The named §1.8 instance loads at the expiry instant and one second past it, asserting success then ERR_HEALTH_CERTIFICATE_EXPIRED."

      - name: transport_unit_unavailable_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TRANSPORT_UNIT_UNAVAILABLE
        excluded_because:
          difficulty_instance: resource_temporal_overlap / overlapping_trip_on_the_same_unit_is_refused
          rationale: "The named §1.8 instance books two intersecting trip intervals on one truck and asserts the refusal."

      - name: oxygen_supply_exceeded_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_OXYGEN_SUPPLY_EXCEEDED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / station_oxygen_supply_exceeded_across_two_concurrent_trips
          rationale: "The named §1.8 instance sums oxygen_flow_lpm across two concurrent in-transit trips against the station's bulk supply."

      - name: water_rest_buffer_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_WATER_REST_BUFFER
        excluded_because:
          difficulty_instance: resource_temporal_overlap / water_rest_buffer_refuses_a_release_one_second_early
          rationale: "The named §1.8 instance releases into the same water one second inside the 48-hour buffer and then exactly on it."

      - name: hatchery_scope_violation_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_HATCHERY_SCOPE_VIOLATION
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / hatchery_scope_beats_request_shape_on_foreign_feeding
          rationale: "The named §1.8 instance has one station's manager feed another station's lot with a malformed body and asserts the scope error wins."

  # ===========================================================================
  # SECTION 7 — rbac (§1.7)
  # ===========================================================================
  - section: rbac
    instances:

      - name: program_admin_cannot_schedule_a_stocking_event
        claim_type: role_exclusivity
        grounds:
          - roles.ProgramAdmin.cannot
          - roles.HatcheryManager.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          Production is the manager's duty even for the administrator who owns the
          reference data. The refusal is ERR_FORBIDDEN_ROLE at priority 2, so it must
          arrive even though the request is only SUBMITTED and would otherwise fail
          on state, allocation and species rules further down the ladder.
        test_recipe:
          setup:
            - "A rearing lot and request R1 exist at station SLVC"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_truck1
            - *c_req1
            - *c_lot_v
          trigger:
            - call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req1_id}"
                lot_id: "${lot_id}"
                transport_unit_id: "${truck1_id}"
                fish_count: 100
                scheduled_depart_at: "2026-08-11T09:00:00Z"
                scheduled_return_at: "2026-08-11T17:00:00Z"
                expected_lot_version: "${lot_v1}"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "NOT ERR_ALLOCATION_EXCEEDED and NOT ERR_INVALID_STATE — the role gate is two priorities above existence and eight above state"
            - "GET /stocking-events?lot_id=${lot_id} returns total_count == 0"

      - name: hatchery_manager_cannot_run_an_allocation_plan
        claim_type: role_exclusivity
        grounds:
          - roles.ProgramAdmin.exclusive_operations
          - roles.HatcheryManager.cannot
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          The allocation selector belongs to the administrator alone: a manager may
          not run a plan even for his own station, and the refusal must precede the
          OCC comparison so a manager holding the correct version still gets 403.
        test_recipe:
          setup:
            - "Plan P1 for station SLVC is DRAFT at version 1"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_plan1
          trigger:
            - call: "POST /allocation-plans/${plan1_id}/run"
              payload: { expected_plan_version: "${plan1_v0}" }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "NOT ERR_NO_ELIGIBLE_REQUESTS and NOT ERR_HATCHERY_SCOPE_VIOLATION — the role gate fires first even though the plan belongs to this manager's station"
            - "AllocationPlan.${plan1_id}.status == DRAFT, run_count == 0, version == ${plan1_v0}"

      - name: veterinarian_cannot_record_a_feeding
        claim_type: role_exclusivity
        grounds:
          - roles.FishHealthVeterinarian.cannot
          - roles.HatcheryManager.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          The veterinarian's authority stops at the inspection: husbandry writes are
          refused with ERR_FORBIDDEN_ROLE, so the health role can never move biomass,
          density or FCR.
        test_recipe:
          setup:
            - "A lot of 20000 fish exists at station SLVC"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
          trigger:
            - call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-08-10T12:00:00Z", feed_lbs: 100.0, avg_weight_g_after: 3.99 }
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "RearingLot.${lot_id}.avg_weight_g == 0.1, cumulative_feed_lbs == 0.0 and version unchanged"

      - name: regional_biologist_cannot_record_an_egg_take
        claim_type: role_exclusivity
        grounds:
          - roles.RegionalBiologist.cannot
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          The biologist authors demand and evaluates recoveries but touches no
          production row. Recording a take must be refused before the water-right
          ceiling is consulted, so the station's reservation is untouched.
        test_recipe:
          setup:
            - "Spawn event S1 is PLANNED with 3.0000 af reserved and the clock stands at 2026-08-10T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
          trigger:
            - call: "POST /spawn-events/${spawn1_id}/record-take"
              payload: { eggs_taken: 20000, taken_at: "2026-08-10T00:00:00Z" }
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "SpawnEvent.${spawn1_id}.status == PLANNED and Hatchery.${hatch_id}.water_used_af == 0.0000"
            - "BroodStock.${brood_id}.females_spent == 0 and females_reserved == 20"

      - name: public_requester_cannot_attach_a_request_to_a_plan
        claim_type: role_exclusivity
        grounds:
          - roles.PublicRequester.cannot
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          A member of the public may author and withdraw a request but queueing it
          onto a plan is a program decision. The refusal must be ERR_FORBIDDEN_ROLE
          at priority 2, not ERR_NOT_REQUEST_OWNER at 3 — the caller DOES own the
          request, which is exactly what makes the ordering falsifiable.
        test_recipe:
          setup:
            - "pub-dana authored request R-PUB on Blue Mesa and plan P1 is DRAFT at version 1"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - &c_req_pub
              call: "POST /stocking-requests"
              payload:
                water_id: "${water_a_id}"
                species: "RAINBOW_TROUT"
                requested_count: 500
                size_class: "YEARLING"
                justification: "Family fishing access at the marina"
              as: PublicRequester
              as_user_id: "pub-dana"
              captures: { req_pub_id: $.data.id }
            - *c_plan1
          trigger:
            - call: "POST /stocking-requests/${req_pub_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan1_id}", expected_plan_version: "${plan1_v0}" }
              as: PublicRequester
              as_user_id: "pub-dana"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "NOT ERR_NOT_REQUEST_OWNER — pub-dana is the author, so only the role gate can refuse"
            - "StockingRequest.${req_pub_id}.requester_kind == PUBLIC, status == SUBMITTED, allocation_plan_id == null"
            - "StockingRequest.${req_pub_id}.priority_score == 80.00 — 0.8 * (36 + 31.5 + 20) + 10, the public weight applied to the base only"

      - name: public_requester_cannot_read_a_rearing_lot
        claim_type: role_exclusivity
        grounds:
          - roles.PublicRequester.cannot
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          Production data is closed to the public entirely — not filtered, not
          redacted, but refused. A GET of an existing lot must return
          ERR_FORBIDDEN_ROLE, while a GET of waters and of the caller's own requests
          continues to work.
        test_recipe:
          setup:
            - "A lot exists at station SLVC and Blue Mesa is ACTIVE"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
          trigger:
            - call: "GET /rearing-lots/${lot_id}"
              payload: {}
              as: PublicRequester
              as_user_id: "pub-dana"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "the same caller's GET /waters/${water_a_id} returns 200 — only production reads are closed"

      - name: missing_x_user_id_header_returns_unauthenticated
        claim_type: authentication
        grounds:
          - validations.auth-header-present
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          The header gate sits at priority 1, above the role gate. A completely empty
          X-User-ID (the empty string, not a blank-looking value) must produce
          ERR_UNAUTHENTICATED at 401 even on an endpoint the named role would be
          allowed to call.
        test_recipe:
          setup:
            - "The clock has been set; no other state is needed"
          setup_api_calls:
            - *c_clock_0801
          trigger:
            - call: "POST /waters"
              payload:
                name: "Eleven Mile Reservoir"
                county: "Park"
                water_class: "COLDWATER_LAKE"
                habitat_suitability_score: 75
                angler_demand_index: 85
                plan_species: "RAINBOW_TROUT"
                plan_target_count: 3000
                access_type: "PUBLIC_BOAT"
              as: ProgramAdmin
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "NOT ERR_FORBIDDEN_ROLE — the header is checked before the role"
            - "GET /waters as a valid ProgramAdmin returns total_count == 0"

      - name: hatchery_manager_cannot_read_another_stations_row
        claim_type: scope_isolation
        grounds:
          - roles.HatcheryManager.scope_rule
          - validations.hatchery-scope
          - errors.ERR_HATCHERY_SCOPE_VIOLATION
        distinguishing_aspect: |
          The manager's identity IS his station id, so the scope rule applies to the
          hatchery read itself: SLVC's manager reading GLDN must get
          ERR_HATCHERY_SCOPE_VIOLATION at 403, not a 404 and not a filtered row,
          while the same call against his own station succeeds.
        test_recipe:
          setup:
            - "Stations SLVC and GLDN both exist"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_hatch2
          trigger:
            - call: "GET /hatcheries/${hatch2_id}"
              payload: {}
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_HATCHERY_SCOPE_VIOLATION"
            - "NOT ERR_HATCHERY_NOT_FOUND — GLDN exists and the scope rule at priority 3 precedes existence at 4"
            - "the same caller's GET /hatcheries/${hatch_id} returns 200 with station_code SLVC"

      - name: public_requester_cannot_withdraw_another_requesters_request
        claim_type: ownership_isolation
        grounds:
          - roles.PublicRequester.ownership_rule
          - validations.request-ownership
          - errors.ERR_NOT_REQUEST_OWNER
        distinguishing_aspect: |
          Withdrawal is permitted to the PublicRequester role, so the role gate passes
          and the ownership rule at priority 3 is the one that must fire:
          ERR_NOT_REQUEST_OWNER for pub-eve acting on pub-dana's request, and success
          when pub-dana does it herself.
        test_recipe:
          setup:
            - "pub-dana authored request R-PUB, which is SUBMITTED"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_req_pub
          trigger:
            - call: "POST /stocking-requests/${req_pub_id}/withdraw"
              payload: {}
              as: PublicRequester
              as_user_id: "pub-eve"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_NOT_REQUEST_OWNER"
            - "NOT ERR_FORBIDDEN_ROLE — PublicRequester may withdraw, just not this row"
            - "StockingRequest.${req_pub_id}.status == SUBMITTED"
            - "the same call as pub-dana returns 200 with status WITHDRAWN"

      - name: certifying_veterinarian_cannot_be_the_sampler
        claim_type: segregation_of_duties
        grounds:
          - roles.FishHealthVeterinarian.segregation_rule
          - validations.certify-different-vet
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Two distinct veterinarians are required. vet-anna, who sampled and recorded
          the PASSED result, must be refused her own certification with
          ERR_SEGREGATION_OF_DUTIES at 403 — after the state check at 8, which is
          satisfied because PASSED to CERTIFIED is a legal edge.
        test_recipe:
          setup:
            - "Inspection I1 was sampled by vet-anna and recorded NEGATIVE, so it is PASSED"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
          trigger:
            - call: "POST /health-inspections/${insp1_id}/certify"
              payload: {}
              as: FishHealthVeterinarian
              as_user_id: "vet-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "NOT ERR_INVALID_STATE — PASSED to CERTIFIED is a declared transition"
            - "HealthInspection.${insp1_id}.status == PASSED with certified_by_user_id == null and certified_at == null"
            - "RearingLot.${lot_id}.health_status == UNDER_INSPECTION and certificate_expires_at == null"

      - name: a_second_veterinarian_certification_sets_the_lot_certificate
        claim_type: shared_operation_allowed
        grounds:
          - state_machines.HealthInspection.PASSED_to_CERTIFIED
          - roles.FishHealthVeterinarian.exclusive_operations
        distinguishing_aspect: |
          The positive half of segregation of duties: vet-bruno, who has no other
          relationship to the lot, may certify what vet-anna sampled. The certificate
          runs CERT_VALID_DAYS (30) from the certification instant, so a 2026-08-25
          certification expires at exactly 2026-09-24T00:00:00Z on both the inspection
          and the lot.
        test_recipe:
          setup:
            - "Inspection I1 is PASSED, sampled by vet-anna, and the clock stands at 2026-08-25T00:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
          trigger:
            - *c_certify
          assert:
            - "HTTP 200: HealthInspection.${insp1_id}.status == CERTIFIED with certified_by_user_id == vet-bruno and certified_at == 2026-08-25T00:00:00Z"
            - "HealthInspection.${insp1_id}.certificate_expires_at == 2026-09-24T00:00:00Z"
            - "RearingLot.${lot_id}.health_status == CERTIFIED and certificate_expires_at == 2026-09-24T00:00:00Z"
            - "HealthInspection.${insp1_id}.sampled_by_user_id == vet-anna — the sampler is preserved for the audit trail"

  # ===========================================================================
  # SECTION 8 — cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_lot_version_on_event_creation_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.stocking-event-create-stale-lot
          - errors.ERR_STALE_LOT_VERSION
        distinguishing_aspect: |
          The caller reads the lot, someone feeds it, and the caller then tries to
          reserve fish against the count it read. The refusal must be
          ERR_STALE_LOT_VERSION at 412 and must precede every state, safety, count
          and fiscal rule, leaving reserved_count and budget_committed_cents alone.
        test_recipe:
          setup:
            - "A CERTIFIED YEARLING lot exists; the caller captured its version, and a feeding then advanced that version"
            - "Request R1 holds a 2400-fish grant and the clock stands at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
            - *c_feed1
            - *c_adv_fry
            - *c_adv_fing
            - *c_clock_0820
            - *c_feed2
            - *c_adv_year
            - *c_clock_0825
            - *c_insp1
            - *c_res_neg
            - *c_certify
            - *c_truck1
            - *c_req1
            - *c_plan1
            - *c_attach1
            - *c_plan_v1
            - *c_run1
            - *c_clock_0901
            - *c_lot_v
            - call: "POST /rearing-lots/${lot_id}/feedings"
              payload: { fed_at: "2026-09-01T08:00:00Z", feed_lbs: 50.0, avg_weight_g_after: 45.4, mortality_count: 0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          trigger:
            - call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req1_id}"
                lot_id: "${lot_id}"
                transport_unit_id: "${truck1_id}"
                fish_count: 2400
                scheduled_depart_at: "2026-09-01T09:00:00Z"
                scheduled_return_at: "2026-09-01T17:00:00Z"
                expected_lot_version: "${lot_v1}"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id ERR_STALE_LOT_VERSION"
            - "RearingLot.${lot_id}.version == ${lot_v1} + 1 and reserved_count == 0"
            - "Hatchery.${hatch_id}.budget_committed_cents == 0"
            - "re-reading the lot and retrying with the fresh version returns 201 — the reservation was refused, not lost"

      - name: stale_plan_version_on_the_allocation_run_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.allocation-run-stale-plan
          - errors.ERR_STALE_PLAN_VERSION
        distinguishing_aspect: |
          Every attach bumps the plan, so an administrator who read the plan before
          the attach must be refused: the run would otherwise resolve a candidate set
          it never saw. ERR_STALE_PLAN_VERSION must arrive ahead of
          ERR_NO_ELIGIBLE_REQUESTS and ahead of any grant arithmetic.
        test_recipe:
          setup:
            - "Plan P1 was read at version 1 and request R1 has since been attached, taking it to version 2"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_req1
            - *c_plan1
            - *c_attach1
          trigger:
            - call: "POST /allocation-plans/${plan1_id}/run"
              payload: { expected_plan_version: "${plan1_v0}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id ERR_STALE_PLAN_VERSION"
            - "AllocationPlan.${plan1_id}.status == DRAFT, run_count == 0, version == ${plan1_v0} + 1"
            - "StockingRequest.${req1_id}.status == QUEUED with allocated_count == 0"

      - name: stale_plan_version_on_a_second_attach_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.request-attach-stale-plan
          - errors.ERR_STALE_PLAN_VERSION
        distinguishing_aspect: |
          Two biologists attaching to one plan contend on the SAME version counter:
          the second attach carrying the pre-first-attach version must be refused,
          which is the concrete reason the attach endpoint bumps a version it does
          not otherwise modify.
        test_recipe:
          setup:
            - "Plan P1 was read at version 1; R1 has been attached, taking it to version 2"
            - "R2 on Taylor Park is still SUBMITTED and its owner still holds the stale version"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_water_b
            - *c_req1
            - *c_req2_taylor
            - *c_plan1
            - *c_attach1
          trigger:
            - call: "POST /stocking-requests/${req2_id}/attach-to-plan"
              payload: { allocation_plan_id: "${plan1_id}", expected_plan_version: "${plan1_v0}" }
              as: RegionalBiologist
              as_user_id: "bio-carla"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id ERR_STALE_PLAN_VERSION"
            - "StockingRequest.${req2_id}.status == SUBMITTED with allocation_plan_id == null"
            - "AllocationPlan.${plan1_id}.version == ${plan1_v0} + 1 — the failed attach bumped nothing"

      - name: lot_version_increments_on_every_write_that_touches_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.stocking-event-create-stale-lot.side_effect_on_success
          - entities.RearingLot
        distinguishing_aspect: |
          The OCC token only works if it moves. A lot must be at version 1 when the
          take creates it, 2 after a feeding and 3 after a stage advance — three
          different write shapes, one counter.
        test_recipe:
          setup:
            - "A lot of 20000 eggs has just been created by the record-take"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
          trigger:
            - *c_feed_399
          assert:
            - "at creation RearingLot.${lot_id}.version == 1"
            - "after the feeding RearingLot.${lot_id}.version == 2"
            - "a following advance-stage to FRY returns 200 and takes version to 3"
            - "a GET of the lot does not change the version"

      - name: stocking_requests_listing_filters_by_status_and_paginates
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET /stocking-requests
          - response_envelope.pagination
        distinguishing_aspect: |
          The filter must narrow total_count itself, not just the page: with two
          SUBMITTED requests and one WITHDRAWN, a limit-1 page of SUBMITTED reports
          total_count 2 and has_more true, and the second page reports has_more false
          while total_count stays 2.
        test_recipe:
          setup:
            - "R1 (Blue Mesa) and R2 (Taylor Park) are SUBMITTED; R-PUB was authored by pub-dana and then withdrawn by her"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_water_a
            - *c_water_b
            - *c_req1
            - *c_req2_taylor
            - *c_req_pub
            - call: "POST /stocking-requests/${req_pub_id}/withdraw"
              payload: {}
              as: PublicRequester
              as_user_id: "pub-dana"
          trigger:
            - call: "GET /stocking-requests?status=SUBMITTED&limit=1&offset=0"
              payload: {}
              as: ProgramAdmin
              captures: { page1_first_id: "$.data[0].id" }
          assert:
            - "HTTP 200 with total_count == 2, has_more == true, limit == 1, offset == 0 and exactly one row in data"
            - "the same call with offset=1 returns total_count == 2, has_more == false and one row whose id differs from ${page1_first_id}"
            - "GET /stocking-requests?status=WITHDRAWN returns total_count == 1 — the withdrawn row is excluded from the SUBMITTED filter, not deleted"
            - "GET /stocking-requests?requester_kind=PUBLIC returns total_count == 1"

      - name: exceedance_cascade_freezes_production_and_returns_reservations
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / effluent_exceedance_freezes_production_and_returns_reservations
          rationale: "The named §1.8 instance drives the station to FROZEN with a second exceedance and follows the cascade into brood stocks, planned spawn events and the returned acre-feet."

      - name: dual_variant_layer_is_exercised_on_both_calculations
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / fcr_biological_vs_economic_diverge_on_same_lot
          rationale: "The named §1.8 instance covers the FCR pair, and its sibling contribution_cohort_vs_harvest_diverge_on_same_release covers the contribution pair."

      - name: selector_policy_changes_the_grant_distribution
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers.selector_policy
        excluded_because:
          difficulty_instance: combinatorial_formula / allocation_waterfall_rounds_to_unit_before_decrementing_pool
          rationale: "The named §1.8 instance and its PROPORTIONAL sibling run the same request set under both selector values and assert the differing totals."

  # ===========================================================================
  # SECTION 9 — consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_shows_the_recomputed_station_in_the_same_call
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.hatchery_density_index.recomputed_by
        distinguishing_aspect: |
          consistency_model is immediate, so a feeding's own 201 must already carry
          the recomputed lot figures, and a GET of the station issued immediately
          afterwards must already show the derived biomass and density — no lag, no
          second write needed to reconcile the denormalised fields.
        test_recipe:
          setup:
            - "A lot of 20000 fish exists at station SLVC with biomass 4.41 lbs and density_index 0.0022"
          setup_api_calls:
            - *c_clock_0801
            - *c_hatch
            - *c_brood
            - *c_open
            - *c_spawn1
            - *c_clock_0810
            - *c_take1
            - *c_lot
          trigger:
            - *c_feed_399
          assert:
            - "the feeding's own response body already shows biomass_lbs 175.93, cumulative_feed_lbs 100.0 and fcr_biological 0.583"
            - "an immediately following GET /hatcheries/${hatch_id} shows biomass_on_hand_lbs 175.93 and density_index 0.0880"
            - "an immediately following GET /rearing-lots/${lot_id} shows the same biomass_lbs 175.93 and version 2"
            - "no further write is required for the station's derived fields to agree with the lot's"
