      - name: pagination_bounds_are_rejected_at_zero_at_one_hundred_one_and_at_a_negative_offset
        claim_type: Violation → Error
        grounds:
          - validations[priority 60].ERR_PAGINATION_INVALID
          - response_envelope.pagination
        distinguishing_aspect: "The limit bound is inclusive on both ends, so 0 and 101 fail while 1 and 100 succeed; a negative offset fails on a separate clause of the same rule, and none of the four probes may leak a 500 or a silent clamp."
        test_recipe:
          setup:
