            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance (Delaware)", ein: "11-1111111", state_code: "NY", mission_code: "FS-FOOD_SECURITY", annual_expense_cents: 4000000, unrestricted_net_assets_cents: 1000000 }
