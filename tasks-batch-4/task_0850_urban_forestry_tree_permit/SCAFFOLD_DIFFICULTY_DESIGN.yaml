scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: mitigation_replacement_vs_appraised_diverge
        grounds:
          - calculations.mitigation_fee
          - entities.Permit.fields.mitigation_method
          - entities.Permit.fields.mitigation_fee_cents
        distinguishing_aspect: "For the SAME removed Tree (Permit domain), method REPLACEMENT_COST yields mitigation_fee_cents=40312 while method APPRAISED_VALUE yields 589032 — two valid algorithms, different results."
        test_recipe:
          setup:
            - "Zone Z1 (area_sqm=100, target 30%), non-protected Species Oak (base_replacement_value_dollars=187.50, base_appraisal_value_per_sqin=27.00), Tree T20 dbh=20 GOOD in Z1."
            - "T20 has a FINALIZED benign inspection so a REMOVAL permit can be approved."
            - "Two separate REMOVAL permits on T20, one approved with each mitigation_method."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 1, consequence_score: 1, target_rating: 1 }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay-A" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { pA: $.data.id }
            - call: "POST /forestry/permits/${pA}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay-B" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { pB: $.data.id }
            - call: "POST /forestry/permits/${pB}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
          trigger:
            - call: "POST /forestry/permits/${pA}/review"
              payload: { decision: "APPROVE", mitigation_method: "REPLACEMENT_COST", review_notes: "repl" }
              as: Arborist
              captures: { feeA: $.data.mitigation_fee_cents }
            - call: "POST /forestry/permits/${pB}/review"
              payload: { decision: "APPROVE", mitigation_method: "APPRAISED_VALUE", review_notes: "appr" }
              as: Arborist
              captures: { feeB: $.data.mitigation_fee_cents }
          assert:
            - "Permit.${pA}.mitigation_fee_cents == 40312"
            - "Permit.${pA}.required_replacement_count == 2"
            - "Permit.${pB}.mitigation_fee_cents == 589032"
            - "Permit.${pA}.mitigation_fee_cents != Permit.${pB}.mitigation_fee_cents"

      - name: risk_provisional_vs_final_diverge
        grounds:
          - calculations.risk_rating
          - entities.Inspection.fields.provisional_risk_rating
          - entities.Inspection.fields.final_risk_rating
        distinguishing_aspect: "For the SAME Inspection (Inspection domain), the provisional variant scores 9 -> HIGH while the final variant scores 12 -> SEVERE, a different band from identical inputs."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak, Tree T20 (dbh=20) in Z1."
            - "One inspection with likelihood=3, consequence=3, target_rating=4."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 3, consequence_score: 3, target_rating: 4 }
              as: Inspector
              captures: { insp: $.data.id, prov: $.data.provisional_risk_rating }
          trigger:
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
              captures: { fin: $.data.final_risk_rating }
          assert:
            - "Inspection.${insp}.provisional_risk_score == 9"
            - "Inspection.${insp}.provisional_risk_rating == HIGH"
            - "Inspection.${insp}.final_risk_score == 12"
            - "Inspection.${insp}.final_risk_rating == SEVERE"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mitigation_rounding_order_pinned
        grounds:
          - calculations.mitigation_fee
          - entities.Permit.fields.mitigation_fee_cents
        distinguishing_aspect: "Mode (b) nested rounding: per-tree cost round_half_up(187.50*1.075*100)=20156 summed over 2 trees = 40312; sum-then-round of 40312.5 would give 40313. The pinned per-tree-then-sum order is observable as 40312."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak (base_replacement_value_dollars=187.50), Tree T20 dbh=20 GOOD with a FINALIZED benign inspection."
            - "REMOVAL permit on T20, approved with REPLACEMENT_COST."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 1, consequence_score: 1, target_rating: 1 }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
          trigger:
            - call: "POST /forestry/permits/${p}/review"
              payload: { decision: "APPROVE", mitigation_method: "REPLACEMENT_COST", review_notes: "ok" }
              as: Arborist
          assert:
            - "Permit.${p}.mitigation_fee_cents == 40312"
            - "Permit.${p}.required_replacement_count == 2"

      - name: risk_final_nonlinear_three_inputs
        grounds:
          - calculations.risk_rating
          - entities.Inspection.fields.final_risk_score
        distinguishing_aspect: "Mode (a) >=3 inputs with a conditional branch and a min cap: final = min(likelihood*consequence + (target>=3 ? 3 : 0), 16); likelihood=4,consequence=4,target=4 gives min(16+3,16)=16, proving the cap clamps and the branch fires."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak, Tree T20 dbh=20 in Z1."
            - "One inspection likelihood=4, consequence=4, target_rating=4."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 4, consequence_score: 4, target_rating: 4 }
              as: Inspector
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
          assert:
            - "Inspection.${insp}.final_risk_score == 16"
            - "Inspection.${insp}.final_risk_rating == SEVERE"
            - "Inspection.${insp}.provisional_risk_score == 16"

  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_info_request_revision_cycle
        grounds:
          - state_machines.Permit.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.Permit.INFO_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: "Permit cycles UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW; after a REQUEST_INFO then provide-info the status returns to UNDER_REVIEW, proving the loop (not a linear pipeline)."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak, protected Tree T20, a REMOVAL permit submitted (UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id }
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits/${p}/review"
              payload: { decision: "REQUEST_INFO", review_notes: "need more" }
              as: Arborist
          trigger:
            - call: "POST /forestry/permits/${p}/provide-info"
              payload: { response_note: "here it is" }
              as: Applicant
              as_user_id: "applicant-1"
          assert:
            - "Permit.${p}.status == UNDER_REVIEW"

      - name: inspection_dispute_finalize_cycle
        grounds:
          - state_machines.Inspection.FINALIZED_to_DISPUTED
          - state_machines.Inspection.DISPUTED_to_FINALIZED
        distinguishing_aspect: "Inspection cycles FINALIZED -> DISPUTED -> FINALIZED; re-finalizing a disputed inspection returns status to FINALIZED, a cycle on a different entity than Permit."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak, Tree T20, one inspection finalized then disputed."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 2, consequence_score: 2, target_rating: 2 }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /forestry/inspections/${insp}/dispute"
              payload: {}
              as: ForestryAdmin
          trigger:
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
          assert:
            - "Inspection.${insp}.status == FINALIZED"

  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: workorder_complete_removes_tree_flips_zone_deficit
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.Tree.HEALTHY_to_REMOVED
          - calculations.zone_canopy
          - entities.Zone.fields.canopy_status
        distinguishing_aspect: "Depth-3+ chain from WorkOrder.complete: complete -> tree.health_status=REMOVED -> zone.live_canopy_sqm 50->0 -> current_canopy_pct 50.00->0.00 -> canopy_status MEETS->DEFICIT, each hop caused by the previous."
        test_recipe:
          setup:
            - "Zone Z1 (area 100, target 30), Species Oak (mature_canopy 50), single Tree T20 (dbh=20) -> zone at 50% MEETS."
            - "A REMOVAL permit for T20 approved, fee paid (40312), issued; a work order for it started under a valid dig ticket."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 1, consequence_score: 1, target_rating: 1 }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits/${p}/review"
              payload: { decision: "APPROVE", mitigation_method: "REPLACEMENT_COST", review_notes: "ok" }
              as: Arborist
            - call: "POST /forestry/permits/${p}/pay-fee"
              payload: { amount_cents: 40312 }
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits/${p}/issue"
              payload: {}
              as: Arborist
            - call: "POST /forestry/contractors"
              payload: { name: "Acme Tree", license_number: "L-1", license_expiry: "2027-01-01T00:00:00Z", is_certified_arborist: true, status: "ACTIVE" }
              as: ForestryAdmin
              captures: { c1: $.data.id }
            - call: "POST /forestry/work-orders"
              payload: { tree_id: "${t20}", permit_id: "${p}", contractor_id: "${c1}", work_type: "REMOVAL", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: ForestryStaff
              captures: { wo: $.data.id }
            - call: "POST /forestry/work-orders/${wo}/dig-tickets"
              payload: { ticket_number: "811-1", valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-06-02T00:00:00Z" }
              as: Contractor
              as_user_id: "${c1}"
              captures: { dt: $.data.id }
            - call: "POST /forestry/dig-tickets/${dt}/mark-valid"
              payload: {}
              as: ForestryAdmin
            - call: "POST /forestry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ForestryAdmin
            - call: "POST /forestry/work-orders/${wo}/start"
              payload: {}
              as: Contractor
              as_user_id: "${c1}"
          trigger:
            - call: "POST /forestry/work-orders/${wo}/complete"
              payload: {}
              as: Contractor
              as_user_id: "${c1}"
          assert:
            - "Tree.${t20}.health_status == REMOVED"
            - "Zone.${z1}.live_canopy_sqm == 0"
            - "Zone.${z1}.current_canopy_pct == 0.00"
            - "Zone.${z1}.canopy_status == DEFICIT"
            - "Permit.${p}.status == CLOSED"

      - name: inspection_finalize_hazard_bumps_zone_high_risk
        grounds:
          - state_machines.Inspection.DRAFT_to_FINALIZED
          - state_machines.Tree.HEALTHY_to_HAZARD
          - entities.Zone.fields.high_risk_tree_count
        distinguishing_aspect: "Depth-2 chain from Inspection.finalize (a DIFFERENT trigger than WorkOrder.complete): finalize SEVERE -> tree.health_status=HAZARD & risk_rating=SEVERE -> zone.high_risk_tree_count 0->1."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak, Tree T20; one inspection likelihood=3 consequence=3 target=4 (final SEVERE)."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 3, consequence_score: 3, target_rating: 4 }
              as: Inspector
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
          assert:
            - "Tree.${t20}.risk_rating == SEVERE"
            - "Tree.${t20}.health_status == HAZARD"
            - "Zone.${z1}.high_risk_tree_count == 1"

  # =========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: issue_state_outranks_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=21]
          - errors[ERR_PERMIT_NOT_APPROVED]
          - errors[ERR_FEE_UNPAID]
        distinguishing_aspect: "state vs business_fiscal: issuing an UNDER_REVIEW (not APPROVED) permit that is also unpaid returns ERR_PERMIT_NOT_APPROVED (priority 10), never ERR_FEE_UNPAID (priority 21)."
        test_recipe:
          setup:
            - "Zone Z1, Species Oak, protected Tree T20, a REMOVAL permit submitted (UNDER_REVIEW, fee not computed/paid)."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id }
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
          trigger:
            - call: "POST /forestry/permits/${p}/issue"
              payload: {}
              as: Arborist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PERMIT_NOT_APPROVED"

