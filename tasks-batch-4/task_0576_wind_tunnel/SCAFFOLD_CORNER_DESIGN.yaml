# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — Wind Tunnel
# Breadth probe over §1.1-§1.7 claims not covered by §1.8. Same seven-point contract
# and §1.5 reachability gates as §1.8.
# =============================================================================
scaffold_corner_design:

  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_tunnel_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Tunnel.fields.max_weight_kg, entities.Tunnel.fields.status]
        distinguishing_aspect: "POST /tunnels with all required fields returns 201 and status defaults to OPERATIONAL."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
          assert:
            - "Tunnel.${t_id}.status == OPERATIONAL"
            - "Tunnel.${t_id}.max_weight_kg == 120"
            - "response code == 201"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with an unknown UUID returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_MEMBER_NOT_FOUND"]

      - name: get_session_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_SESSION_NOT_FOUND]"]
        distinguishing_aspect: "GET /sessions/{id} with an unknown UUID returns ERR_SESSION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /sessions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_SESSION_NOT_FOUND"]

      - name: create_member_defaults_empty_health_flags
        claim_type: Defaults
        grounds: [entities.Member.fields.health_flags, entities.Member.fields.membership_tier]
        distinguishing_aspect: "Omitting health_flags defaults it to []; membership_tier defaults to NONE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.health_flags == []"
            - "Member.${m_id}.membership_tier == NONE"

      - name: booking_missing_package_id_returns_validation
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]", entities.Booking.fields.package_id]
        distinguishing_aspect: "POST /bookings without package_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One member exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_VALIDATION"]

      - name: booking_invalid_type_enum_returns_validation
        claim_type: Type Constraints
        grounds: ["errors[ERR_VALIDATION]", entities.Booking.fields.booking_type]
        distinguishing_aspect: "POST /bookings with booking_type outside {WALK_IN, RESERVATION} returns ERR_VALIDATION."
        test_recipe:
          setup: ["A member and a package exist."]
          setup_api_calls:
            - call: "POST /packages"
              payload: { name: "P", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "DROP_IN", party_size: 1 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_VALIDATION"]

      - name: booking_minutes_included_computed
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.minutes_included, entities.Booking.fields.minutes_remaining]
        distinguishing_aspect: "party_size 3 on an included_minutes 2 package -> minutes_included 6, minutes_remaining 6 at create."
        test_recipe:
          setup: ["A member and a 2-minute package."]
          setup_api_calls:
            - call: "POST /packages"
              payload: { name: "P", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 3 }
              as: FrontDesk
              captures: { b_id: $.data.id }
          assert:
            - "Booking.${b_id}.minutes_included == 6"
            - "Booking.${b_id}.minutes_remaining == 6"

      - name: membership_discount_pct_computed
        claim_type: Computed Fields
        grounds: [entities.Membership.fields.discount_pct, entities.Member.fields.membership_tier, calculations.membership_discount]
        distinguishing_aspect: "Enrolling PRO sets Membership.discount_pct 0.15 and Member.membership_tier PRO."
        test_recipe:
          setup: ["A member exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { name: "Bo", weight_kg: 70, experience_status: "RETURNING" }
              as: FrontDesk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /memberships"
              payload: { member_id: "${m_id}", tier: "PRO" }
              as: FrontDesk
              captures: { ms_id: $.data.id }
          assert:
            - "Membership.${ms_id}.discount_pct == 0.15"
            - "Member.${m_id}.membership_tier == PRO"

      - name: session_seats_available_computed_on_create
        claim_type: Computed Fields
        grounds: [entities.Session.fields.seats_available, entities.Session.fields.seats_taken]
        distinguishing_aspect: "A capacity-4 session starts with seats_taken 0 and seats_available 4."
        test_recipe:
          setup: ["One tunnel."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id }
          assert:
            - "Session.${s_id}.seats_taken == 0"
            - "Session.${s_id}.seats_available == 4"

      - name: list_flights_by_session_pagination
        claim_type: Listing
        grounds: [entities.Flight.fields.session_id]
        distinguishing_aspect: "GET /flights?session_id=&limit=1 over a session with 2 flights returns has_more true and total_count 2."
        test_recipe:
          setup: ["A staffed session with two flights from two party-1 bookings."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "P", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "M1", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { name: "M2", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m2_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m1_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b1_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m2_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b2_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b1_id}", session_id: "${s_id}", member_id: "${m1_id}", scheduled_minutes: 2 }
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b2_id}", session_id: "${s_id}", member_id: "${m2_id}", scheduled_minutes: 2 }
              as: FrontDesk
          trigger:
            - call: "GET /flights"
              payload: { session_id: "${s_id}", limit: 1 }
              as: FrontDesk
          assert:
            - "response total_count == 2"
            - "response has_more == true"
            - "len(response data) == 1"

  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: start_session_from_running_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Session.OPEN_to_RUNNING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Starting a RUNNING session again returns ERR_INVALID_STATE; op_status stays RUNNING."
        test_recipe:
          setup: ["A staffed, started (RUNNING) session."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_INVALID_STATE"]

      - name: complete_flight_from_scheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Flight.CHECKED_IN_to_FLOWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /flights/{id}/complete on a SCHEDULED (never checked-in) flight returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A running session with one SCHEDULED (not checked-in) flight."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "P", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /flights/${f_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${i_id}"
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_INVALID_STATE"]

      - name: abort_already_aborted_flight_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Flight.CHECKED_IN_to_ABORTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second abort on an already-ABORTED (terminal) flight returns ERR_INVALID_STATE; no further refund/credit."
        test_recipe:
          setup: ["A flight aborted once (terminal ABORTED)."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "P", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${m_id}", weight_kg_declared: 80, health_ok: true }
              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /flights/${f_id}/abort"
              payload: { flown_minutes: 1 }
              as: Instructor
              as_user_id: "${i_id}"
          trigger:
            - call: "POST /flights/${f_id}/abort"
              payload: { flown_minutes: 1 }
              as: Instructor
              as_user_id: "${i_id}"
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_INVALID_STATE"]

      - name: checkin_with_expired_waiver_returns_waiver_invalid
        claim_type: guarded transitions
        grounds: ["errors[ERR_WAIVER_INVALID]", entities.Waiver.fields.expires_at, state_machines.Waiver.SIGNED_to_EXPIRED]
        distinguishing_aspect: "Waiver signed at default clock expires 2026-07-30; advancing the clock to 2026-08-01 makes check-in fail with ERR_WAIVER_INVALID."
        test_recipe:
          setup: ["A scheduled flight whose member's waiver was signed at the default clock (expires 2026-07-30); clock then advanced past expiry."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "P", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${m_id}", weight_kg_declared: 80, health_ok: true }
              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-08-10T10:00:00Z", end_utc: "2026-08-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FrontDesk
          trigger:
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_WAIVER_INVALID"]

      - name: cancel_booking_with_flown_flight_returns_error
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.CONFIRMED_to_CANCELLED, "errors[ERR_BOOKING_HAS_FLOWN_FLIGHT]"]
        distinguishing_aspect: "Cancelling a booking that has a FLOWN flight is rejected with ERR_BOOKING_HAS_FLOWN_FLIGHT."
        test_recipe:
          setup: ["A booking with one FLOWN flight."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "P", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${m_id}", weight_kg_declared: 80, health_ok: true }
              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /flights/${f_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${i_id}"
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_BOOKING_HAS_FLOWN_FLIGHT"]

  # -------------------------------------------------------------------------
  - section: validations
    instances:
      - name: booking_returning_package_first_time_member_returns_experience_not_eligible
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_EXPERIENCE_NOT_ELIGIBLE]", entities.PackageProduct.fields.min_experience]
        distinguishing_aspect: "A RETURNING-only package booked for a FIRST_TIME member returns ERR_EXPERIENCE_NOT_ELIGIBLE."
        test_recipe:
          setup: ["A RETURNING-only package and a FIRST_TIME member."]
          setup_api_calls:
            - call: "POST /packages"
              payload: { name: "Pro Coaching", included_minutes: 4, base_price_cents: 9000, min_experience: "RETURNING" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Newbie", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_EXPERIENCE_NOT_ELIGIBLE"]

      - name: session_end_before_start_returns_invalid_window
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_SESSION_WINDOW]", entities.Session.fields.end_utc]
        distinguishing_aspect: "POST /sessions with end_utc <= start_utc returns ERR_INVALID_SESSION_WINDOW."
        test_recipe:
          setup: ["One tunnel."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:30:00Z", end_utc: "2026-05-10T10:00:00Z", capacity: 4 }
              as: FrontDesk
              captures: { err: $.data.error_id }
