# =============================================================================
# Task 0115: ABA Autism Behavioral Therapy — seed tables
# =============================================================================

scenario: |
  ABA Autism Behavioral Therapy: diagnostic evaluation, treatment plan,
  unit-hour pre-authorization, BCBA supervision ratio, parent training,
  insurance reimbursement cycle, therapist scheduling, Authorization Renewal.

domain_name: aba-therapy
api_prefix: /patients

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Scheduled / deferred actions"

  entity_topology: hybrid
  state_machine_shape: cyclic     # claim appeal cycle + session dispute cycle + authorization renewal chain
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential            # Authorization.renewed_from_id points to previous Authorization

  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Clinic display name" }
      - { name: now_ts, type: datetime, source: system, description: "Deterministic clock for this clinic — advances only via POST /_clock/advance. ISO 8601 UTC." }

  - name: Patient
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "Owning clinic ID" }
      - { name: legal_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO 8601 date" }
      - { name: insurance_member_id, type: string, source: input, description: "Payer-issued member ID" }
      - { name: clinical_progress_score_provisional, type: number, source: computed, default: 0.0, description: "Provisional progress score; see calculations.patient_clinical_progress_score variant=provisional" }
      - { name: clinical_progress_score_adjudicated, type: number, source: computed, default: 0.0, description: "Adjudicated progress score; see calculations.patient_clinical_progress_score variant=adjudicated" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCHARGED. Set DISCHARGED via DELETE /patients/{id} (soft delete)." }

  - name: DiagnosticEvaluation
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "Owning patient ID" }
      - { name: evaluator_therapist_id, type: string, source: input, description: "Therapist conducting eval; must be Therapist with credential=BCBA" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled start (ISO 8601 UTC)" }
      - { name: completed_at, type: datetime, source: system, required: false, description: "Set when status transitions to COMPLETED" }
      - { name: diagnosis_code, type: string, source: input, required: false, description: "ICD-10 code (e.g., F84.0); required to transition to COMPLETED" }
      - { name: severity_level, type: enum, source: input, required: false, description: "LEVEL_1 | LEVEL_2 | LEVEL_3; required to transition to COMPLETED" }
      - { name: recommended_weekly_hours, type: integer, source: input, required: false, description: "Recommended weekly direct-therapy hours; required to transition to COMPLETED. Range 5–40." }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED → IN_PROGRESS → COMPLETED; SCHEDULED|IN_PROGRESS → VOID" }

  - name: TreatmentPlan
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "Owning patient ID" }
      - { name: source_evaluation_id, type: string, source: input, description: "DiagnosticEvaluation.id this plan is derived from; that evaluation MUST be in status COMPLETED at plan-creation time" }
      - { name: weekly_direct_hours_target, type: integer, source: input, description: "Targeted weekly direct (RBT) hours; must equal source_evaluation.recommended_weekly_hours at plan creation" }
      - { name: weekly_supervision_hours_target, type: number, source: input, description: "Targeted weekly BCBA supervision hours; must satisfy supervision_ratio >= 0.10 against weekly_direct_hours_target" }
      - { name: weekly_parent_training_hours_target, type: number, source: input, description: "Targeted weekly parent-training hours; range 0.5–4.0" }
      - { name: plan_version, type: integer, source: system, default: 1, description: "1 for first plan; incremented when this plan supersedes a prior plan via POST /treatment-plans/{id}/supersede" }
      - { name: superseded_by_id, type: string, source: system, required: false, description: "Set when this plan is superseded by a newer plan (self-referential chain)" }
      - { name: activated_at, type: datetime, source: system, required: false, description: "Set on DRAFT→ACTIVE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → ACTIVE → SUPERSEDED | EXPIRED" }

  - name: Authorization
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "Owning patient ID" }
      - { name: treatment_plan_id, type: string, source: input, description: "Backing TreatmentPlan; must be ACTIVE at submission" }
      - { name: payer_name, type: string, source: input, description: "Insurance payer display name" }
      - { name: cpt_code, type: enum, source: input, description: "97151 (eval) | 97153 (direct RBT) | 97155 (BCBA supervision) | 97156 (parent training)" }
      - { name: approved_units, type: integer, source: input, description: "Total units approved (1 unit = 15 minutes). Range 1–4000." }
      - { name: effective_start, type: datetime, source: input, description: "ISO 8601 UTC; inclusive lower bound for billable sessions" }
      - { name: effective_end, type: datetime, source: input, description: "ISO 8601 UTC; inclusive upper bound for billable sessions; must be > effective_start; (effective_end - effective_start) must be in [90, 366] days" }
      - { name: provisional_units_consumed, type: integer, source: computed, default: 0, description: "Computed; see calculations.authorization_unit_balance variant=provisional" }
      - { name: adjudicated_units_consumed, type: integer, source: computed, default: 0, description: "Computed; see calculations.authorization_unit_balance variant=adjudicated" }
      - { name: renewed_from_id, type: string, source: input, required: false, description: "If this Authorization renews a prior one, the prior Authorization.id (self-referential). NULL for the initial Authorization." }
      - { name: renewed_to_id, type: string, source: system, required: false, description: "Set on parent Authorization when a renewal is APPROVED — points to the renewing Authorization." }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING → APPROVED → ACTIVE → EXHAUSTED | EXPIRED | RENEWED; PENDING → DENIED" }

  - name: Therapist
    parent: Clinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "Owning clinic ID" }
      - { name: legal_name, type: string, source: input, description: "Therapist legal name" }
      - { name: credential, type: enum, source: input, description: "BCBA | RBT" }
      - { name: license_number, type: string, source: input, description: "State license number" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: TherapySession
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "Owning patient ID" }
      - { name: authorization_id, type: string, source: input, description: "Authorization debited for this session; must match session_type via cpt_code" }
      - { name: therapist_id, type: string, source: input, description: "Therapist conducting session" }
      - { name: supervising_therapist_id, type: string, source: input, required: false, description: "Only set on session_type=BCBA_SUPERVISION — id of the RBT being supervised. RBT-session rows leave this NULL." }
      - { name: session_type, type: enum, source: input, description: "DIRECT_RBT | BCBA_SUPERVISION | PARENT_TRAINING" }
      - { name: planned_start, type: datetime, source: input, description: "Scheduled start (ISO 8601 UTC)" }
      - { name: planned_end, type: datetime, source: input, description: "Scheduled end (ISO 8601 UTC); must be > planned_start; (end - start) must be in [15, 480] minutes (1–32 units)" }
      - { name: actual_start, type: datetime, source: system, required: false, description: "Set on SCHEDULED→IN_PROGRESS via POST /sessions/{id}/start; equals clinic.now_ts at trigger time" }
      - { name: actual_end, type: datetime, source: system, required: false, description: "Set on IN_PROGRESS→COMPLETED via POST /sessions/{id}/complete; equals clinic.now_ts at trigger time" }
      - { name: planned_units, type: integer, source: computed, description: "ceil((planned_end - planned_start) in minutes / 15)" }
      - { name: billed_units, type: integer, source: computed, required: false, description: "Set on IN_PROGRESS→COMPLETED to ceil((actual_end - actual_start) in minutes / 15); NULL while SCHEDULED|IN_PROGRESS" }
      - { name: dispute_reason, type: string, source: input, required: false, description: "Free-text; set when COMPLETED→DISPUTED" }
      - { name: progress_rating, type: integer, source: input, required: false, description: "Therapist's progress rating for this session, integer in [1,5]. Required as body field on POST /sessions/{id}/complete; copied here on IN_PROGRESS→COMPLETED. NULL while SCHEDULED|IN_PROGRESS." }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED → IN_PROGRESS → COMPLETED → BILLED; COMPLETED ↔ DISPUTED (cycle); SCHEDULED → CANCELLED" }

  - name: InsuranceClaim
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "Owning patient ID" }
      - { name: authorization_id, type: string, source: input, description: "Authorization the included sessions debit against; all session_ids must reference this same authorization_id" }
      - { name: session_ids, type: array, source: input, description: "Array of TherapySession.id; each MUST be in status COMPLETED and not already part of another non-DENIED claim" }
      - { name: appeal_round, type: integer, source: system, default: 0, description: "0 for original submission; +1 each time DENIED → APPEALED → ADJUDICATED cycles" }
      - { name: submitted_amount_cents, type: integer, source: computed, description: "Sum of per-line submitted amounts (cents); see calculations.claim_total_submitted" }
      - { name: reimbursed_amount_cents, type: integer, source: computed, default: 0, description: "Sum of per-line reimbursed amounts (cents); see calculations.claim_total_reimbursed. Zero until ADJUDICATED." }
      - { name: denial_reason, type: enum, source: input, required: false, description: "Set on ADJUDICATED→DENIED: SUPERVISION_RATIO_BREACH | UNITS_OUT_OF_AUTH | MISSING_PROGRESS_NOTE | DUPLICATE_LINE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → SUBMITTED → ADJUDICATED → PAID; ADJUDICATED → DENIED → APPEALED → ADJUDICATED (cycle); cycle bounded at appeal_round <= 2" }

  - name: BillingLedgerEntry
    parent: Authorization
    common_fields: false              # append-only: only id + created_at
    fields:
      - { name: authorization_id, type: string, source: system, description: "Owning Authorization" }
      - { name: session_id, type: string, source: system, required: false, description: "Source TherapySession.id when entry_type ∈ {PROVISIONAL_DEBIT, PROVISIONAL_CREDIT}" }
      - { name: claim_id, type: string, source: system, required: false, description: "Source InsuranceClaim.id when entry_type ∈ {ADJUDICATED_DEBIT, ADJUDICATED_CREDIT}" }
      - { name: entry_type, type: enum, source: system, description: "PROVISIONAL_DEBIT | PROVISIONAL_CREDIT | ADJUDICATED_DEBIT | ADJUDICATED_CREDIT" }
      - { name: units_delta, type: integer, source: system, description: "Signed unit delta; negative for DEBIT, positive for CREDIT" }
      - { name: reason_code, type: enum, source: system, description: "SESSION_COMPLETED | SESSION_CANCELLED | SESSION_DISPUTED | CLAIM_PAID | CLAIM_DENIED | CLAIM_APPEAL_PAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: DiagnosticEvaluation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, VOID]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /evaluations/{id}/start"
        actor: BCBA
        preconditions:
          - "Evaluation.evaluator_therapist_id == X-User-ID (BCBA acting as themselves)"
          - "clinic.now_ts >= evaluation.scheduled_at"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /evaluations/{id}/complete with {diagnosis_code, severity_level, recommended_weekly_hours}"
        actor: BCBA
        preconditions:
          - "diagnosis_code, severity_level, recommended_weekly_hours present"
          - "recommended_weekly_hours in [5, 40]"
        side_effects:
          - "evaluation.completed_at := clinic.now_ts"
      - from: SCHEDULED
        to: VOID
        trigger: "POST /evaluations/{id}/void"
        actor: ClinicAdmin
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: VOID
        trigger: "POST /evaluations/{id}/void"
        actor: ClinicAdmin
        preconditions: []
        side_effects: []

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /treatment-plans/{id}/activate"
        actor: BCBA
        preconditions:
          - "Patient has no other TreatmentPlan in status ACTIVE (cross-row uniqueness on patient_id where status=ACTIVE)"
          - "TreatmentPlan.source_evaluation_id resolves to DiagnosticEvaluation in status COMPLETED (cross-entity dependency: DiagnosticEvaluation)"
          - "weekly_supervision_hours_target / weekly_direct_hours_target >= 0.10 (validation, also see calculations.supervision_ratio)"
        side_effects:
          - "plan.activated_at := clinic.now_ts"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /treatment-plans/{new_id}/supersede with {previous_plan_id} — activates the new plan and supersedes the old in one step (system event on the old plan)"
        actor: system
        preconditions:
          - "new TreatmentPlan in status DRAFT for same patient"
        side_effects:
          - "old_plan.superseded_by_id := new_plan.id"
          - "new_plan.plan_version := old_plan.plan_version + 1"
          - "new_plan.status := ACTIVE (cascade: triggers TreatmentPlan DRAFT→ACTIVE transition with all its preconditions, except the uniqueness check is satisfied by the simultaneous old→SUPERSEDED)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/advance moves clinic.now_ts past (plan.activated_at + 365 days)"
        actor: system
        preconditions: []
        side_effects:
          - "All Authorizations for this patient in status ACTIVE auto-transition to EXPIRED (cross-entity cascade)"

  - entity: Authorization
    initial_state: PENDING
    terminal_states: [DENIED, EXHAUSTED, EXPIRED, RENEWED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /authorizations/{id}/approve"
        actor: PayerAdmin
        preconditions:
          - "Authorization.treatment_plan_id resolves to TreatmentPlan in status ACTIVE (cross-entity dependency: TreatmentPlan)"
        side_effects: []
      - from: PENDING
        to: DENIED
        trigger: "POST /authorizations/{id}/deny"
        actor: PayerAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /_clock/advance crosses clinic.now_ts >= authorization.effective_start"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "Auto on BillingLedgerEntry append (cascade hop 3 from Claim PAY): adjudicated_units_consumed >= approved_units"
        actor: system
        preconditions:
          - "calculations.authorization_unit_balance.adjudicated_balance <= 0"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/advance crosses clinic.now_ts > authorization.effective_end (strict >, see boundary precision)"
        actor: system
        preconditions: []
        side_effects:
          - "All TherapySession rows for this authorization in status SCHEDULED auto-transition to CANCELLED (cross-entity cascade)"
      - from: ACTIVE
        to: RENEWED
        trigger: "POST /authorizations/{new_id}/approve where new authorization has renewed_from_id == this authorization.id (system event on parent)"
        actor: system
        preconditions:
          - "new Authorization in status PENDING references this Authorization via renewed_from_id"
          - "this Authorization.status == ACTIVE at the time of approval"
        side_effects:
          - "this_auth.renewed_to_id := new_auth.id"
          - "new_auth.status transitions PENDING→APPROVED as the same POST"

  - entity: TherapySession
    initial_state: SCHEDULED
    terminal_states: [BILLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /sessions/{id}/start"
        actor: "Therapist (BCBA for BCBA_SUPERVISION, RBT or BCBA for DIRECT_RBT, BCBA for PARENT_TRAINING)"
        preconditions:
          - "session.therapist_id == X-User-ID (acting therapist must own the session)"
          - "Authorization referenced by session.authorization_id is in status ACTIVE (cross-entity dependency: Authorization)"
          - "Authorization.cpt_code matches session.session_type (DIRECT_RBT↔97153, BCBA_SUPERVISION↔97155, PARENT_TRAINING↔97156)"
          - "clinic.now_ts within [authorization.effective_start, authorization.effective_end]"
        side_effects:
          - "session.actual_start := clinic.now_ts"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete with {progress_rating}"
        actor: "Therapist (must be session.therapist_id)"
        preconditions:
          - "session.therapist_id == X-User-ID"
          - "clinic.now_ts > session.actual_start"
          - "body.progress_rating is an integer in [1,5]"
        side_effects:
          - "session.actual_end := clinic.now_ts"
          - "session.billed_units := ceil((actual_end - actual_start) minutes / 15)"
          - "session.progress_rating := body.progress_rating"
          - "BillingLedgerEntry append (PROVISIONAL_DEBIT, units_delta = -session.billed_units, reason_code=SESSION_COMPLETED) — caused by Session status change"
          - "Authorization.provisional_units_consumed recompute — caused by ledger append"
          - "Patient.clinical_progress_score_provisional recompute — caused by session progress_rating set"
      - from: COMPLETED
        to: BILLED
        trigger: "InsuranceClaim DRAFT→SUBMITTED includes this session (system event on session)"
        actor: system
        preconditions:
          - "session is in COMPLETED at submission time"
        side_effects: []
      - from: COMPLETED
        to: DISPUTED
        trigger: "POST /sessions/{id}/dispute with {dispute_reason}"
        actor: BCBA
        preconditions:
          - "session must not be referenced by any InsuranceClaim in status SUBMITTED|ADJUDICATED|PAID"
        side_effects:
          - "session.dispute_reason := body.dispute_reason"
          - "BillingLedgerEntry append (PROVISIONAL_CREDIT, units_delta = +session.billed_units, reason_code=SESSION_DISPUTED) — caused by Session status change"
          - "Authorization.provisional_units_consumed recompute — caused by ledger append"
      - from: DISPUTED
        to: COMPLETED
        trigger: "POST /sessions/{id}/resolve-dispute (cyclic: returns to COMPLETED)"
        actor: BCBA
        preconditions: []
        side_effects:
          - "BillingLedgerEntry append (PROVISIONAL_DEBIT, units_delta = -session.billed_units, reason_code=SESSION_COMPLETED) — caused by Session status change"
          - "Authorization.provisional_units_consumed recompute — caused by ledger append"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel OR Authorization ACTIVE→EXPIRED cascade"
        actor: "ClinicAdmin or system"
        preconditions: []
        side_effects: []

  - entity: InsuranceClaim
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /claims/{id}/submit"
        actor: ClinicAdmin
        preconditions:
          - "All session_ids resolve to TherapySession in status COMPLETED (cross-entity dependency: TherapySession)"
          - "No session_id appears in another InsuranceClaim in status SUBMITTED|ADJUDICATED|PAID|APPEALED"
        side_effects:
          - "Each referenced TherapySession.status COMPLETED→BILLED (cross-entity cascade)"
          - "claim.submitted_amount_cents := calculations.claim_total_submitted output"
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate with {denial_reason?}"
        actor: PayerAdmin
        preconditions: []
        side_effects: []
      - from: ADJUDICATED
        to: PAID
        trigger: "POST /claims/{id}/pay"
        actor: PayerAdmin
        preconditions:
          - "claim.denial_reason is NULL"
          - "Authorization referenced by claim must satisfy supervision_ratio >= 0.10 over the claim's session window (calculations.supervision_ratio); else ERR_SUPERVISION_RATIO_BREACH"
        side_effects:
          - "claim.reimbursed_amount_cents := calculations.claim_total_reimbursed output"
          - "BillingLedgerEntry append (ADJUDICATED_DEBIT, units_delta = -sum of session.billed_units across claim, reason_code=CLAIM_PAID) — caused by Claim status change"
          - "Authorization.adjudicated_units_consumed recompute — caused by ledger append"
          - "If Authorization.adjudicated_units_consumed >= approved_units, Authorization auto-transitions ACTIVE→EXHAUSTED — caused by recompute (cascade hop 3)"
      - from: ADJUDICATED
        to: DENIED
        trigger: "POST /claims/{id}/deny (only valid when claim.denial_reason set)"
        actor: PayerAdmin
        preconditions:
          - "claim.denial_reason is set"
        side_effects:
          - "Each referenced TherapySession.status BILLED→COMPLETED (cross-entity cascade)"
          - "BillingLedgerEntry append (PROVISIONAL_CREDIT, units_delta = +sum of session.billed_units, reason_code=CLAIM_DENIED) — caused by Claim status change"
          - "Authorization.provisional_units_consumed recompute — caused by ledger append"
      - from: DENIED
        to: APPEALED
        trigger: "POST /claims/{id}/appeal"
        actor: ClinicAdmin
        preconditions:
          - "claim.appeal_round < 2"
        side_effects:
          - "claim.appeal_round += 1"
          - "claim.denial_reason cleared"
          - "Each referenced TherapySession.status COMPLETED→BILLED (cross-entity cascade)"
      - from: APPEALED
        to: ADJUDICATED
        trigger: "POST /claims/{id}/adjudicate with {denial_reason?} (cyclic: same endpoint as initial adjudication)"
        actor: PayerAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two BCBAs simultaneously POST /treatment-plans/{id}/activate for two DRAFT plans of the same patient"
    guarantee: "At most one TreatmentPlan in status ACTIVE per patient; second activation rejected"
    error_id: ERR_TREATMENT_PLAN_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on patient_id where status=ACTIVE"

  - scenario: "Two therapists simultaneously POST /sessions creating overlapping sessions for the same therapist_id"
    guarantee: "At most one TherapySession may occupy any wall-clock minute for a given therapist_id; second creation rejected"
    error_id: ERR_SESSION_THERAPIST_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on (therapist_id, [planned_start, planned_end)) half-open intervals"

  - scenario: "Two BCBAs simultaneously POST /claims/{id}/submit referencing overlapping session_ids"
    guarantee: "A TherapySession may belong to at most one non-DENIED InsuranceClaim; second submission rejected"
    error_id: ERR_SESSION_ALREADY_CLAIMED
    http_status: 409
    serialization: "First-writer-wins on TherapySession.id membership"

  - scenario: "PayerAdmin pays an ADJUDICATED claim while ClinicAdmin appeals after a concurrent DENIED transition"
    guarantee: "Exactly one terminal transition is honored; if status already advanced, loser is rejected"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    serialization: "First-writer-wins on claim.status"

  - scenario: "Two PayerAdmin POST /authorizations/{id}/approve calls race for the same renewal Authorization referencing the same parent via renewed_from_id"
    guarantee: "At most one renewal Authorization per parent Authorization; second approval rejected"
    error_id: ERR_RENEWAL_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on Authorization.renewed_from_id"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: authorization_unit_balance
    trigger: |
      Recomputed whenever a BillingLedgerEntry is appended for this Authorization.
      Triggering transitions:
        - TherapySession IN_PROGRESS→COMPLETED   (provisional_units_consumed only)
        - TherapySession COMPLETED→DISPUTED      (provisional_units_consumed only)
        - TherapySession DISPUTED→COMPLETED      (provisional_units_consumed only)
        - InsuranceClaim ADJUDICATED→PAID        (adjudicated_units_consumed only)
        - InsuranceClaim ADJUDICATED→DENIED      (provisional_units_consumed only — credit-back)
    algorithm: aggregation
    formula: |
      provisional_units_consumed =
        sum( -entry.units_delta for entry in BillingLedgerEntry
             where entry.authorization_id == this.id
               and entry.entry_type in {PROVISIONAL_DEBIT, PROVISIONAL_CREDIT} )

      adjudicated_units_consumed =
        sum( -entry.units_delta for entry in BillingLedgerEntry
             where entry.authorization_id == this.id
               and entry.entry_type in {ADJUDICATED_DEBIT, ADJUDICATED_CREDIT} )

      provisional_balance = approved_units - provisional_units_consumed
      adjudicated_balance = approved_units - adjudicated_units_consumed
    input_set: |
      provisional: BillingLedgerEntry rows with entry_type ∈ {PROVISIONAL_DEBIT, PROVISIONAL_CREDIT}, all in
                   created_at <= clinic.now_ts (i.e., all such entries, since ledger is append-only)
      adjudicated: BillingLedgerEntry rows with entry_type ∈ {ADJUDICATED_DEBIT, ADJUDICATED_CREDIT}
    constants:
      MINUTES_PER_UNIT: 15
    precision: "Integer units (no fractional unit ever stored). All time→unit conversions use ceil(minutes / 15)."
    variants:
      - name: provisional
        when: "Used for pre-session unit-hold gate at POST /sessions creation and at POST /sessions/{id}/start; included in Authorization read responses as provisional_units_consumed/balance"
        difference: "Counts COMPLETED+DISPUTED-effect sessions but ignores claim outcome — diverges from adjudicated whenever a claim is DENIED (then PROVISIONAL_CREDIT restores)."
      - name: adjudicated
        when: "Used for Authorization auto-transition ACTIVE→EXHAUSTED; included in Authorization read responses as adjudicated_units_consumed/balance"
        difference: "Counts only PAID claim outcomes (and APPEAL paid) — strictly lags provisional. Diverges from provisional whenever sessions are COMPLETED but no claim is PAID for them yet."

  - name: patient_clinical_progress_score
    trigger: "Recomputed on TherapySession IN_PROGRESS→COMPLETED (any session type) and on InsuranceClaim ADJUDICATED→PAID for the patient's claims"
    algorithm: aggregation
    formula: |
      WINDOW_END   = clinic.now_ts
      WINDOW_START = clinic.now_ts - 90 days

      provisional_sessions = TherapySession rows where
          patient_id == this.id
          and status in {COMPLETED, BILLED}
          and session_type in {DIRECT_RBT, BCBA_SUPERVISION}
          and actual_end in (WINDOW_START, WINDOW_END]
      provisional_score = (
          sum(s.billed_units * s.progress_rating for s in provisional_sessions)
          / max(1, sum(s.billed_units for s in provisional_sessions))
      )

      adjudicated_sessions = TherapySession rows where
          patient_id == this.id
          and session_type == BCBA_SUPERVISION
          and exists InsuranceClaim c where s.id in c.session_ids and c.status == PAID
          and actual_end in (WINDOW_START, WINDOW_END]
      adjudicated_score = (
          sum(s.billed_units * s.progress_rating for s in adjudicated_sessions)
          / max(1, sum(s.billed_units for s in adjudicated_sessions))
      )
    input_set: |
      provisional: any COMPLETED|BILLED session of type DIRECT_RBT or BCBA_SUPERVISION in trailing 90 days,
                   ordered by actual_end ascending, tie-break on TherapySession.id ascending.
      adjudicated: only BCBA_SUPERVISION sessions whose containing claim status==PAID, trailing 90 days,
                   same sort + tie-break.
    constants:
      WINDOW_DAYS: 90
      PROGRESS_RATING_MIN: 1
      PROGRESS_RATING_MAX: 5
    precision: "round_half_up to 2 decimal places on the final score; intermediate sums kept as integers (units) and integers (ratings)."
    variants:
      - name: provisional
        when: "Stored on Patient.clinical_progress_score_provisional; refreshed on session completion"
        difference: "Includes BOTH direct (RBT) and supervision (BCBA) ratings, regardless of claim outcome."
      - name: adjudicated
        when: "Stored on Patient.clinical_progress_score_adjudicated; refreshed only on claim PAID transitions"
        difference: "Includes ONLY BCBA_SUPERVISION ratings AND only those whose claim is PAID — strictly lags provisional and may diverge sharply when supervision ratings differ from direct ratings."

  - name: supervision_ratio
    trigger: "Computed at three points: (1) TreatmentPlan DRAFT→ACTIVE precondition gate; (2) InsuranceClaim ADJUDICATED→PAID precondition gate; (3) on demand via GET /authorizations/{id}/supervision-ratio"
    algorithm: threshold
    formula: |
      # Inputs (3): authorization, supervision_window_start_ts, supervision_window_end_ts
      # Window is fixed at trailing 30 days ending at the trigger's wall-clock:
      WINDOW_END   = clinic.now_ts
      WINDOW_START = clinic.now_ts - 30 days

      rbt_minutes = sum(
          (s.actual_end - s.actual_start).total_seconds() / 60
          for s in TherapySession
          where s.patient_id == patient_id
            and s.session_type == DIRECT_RBT
            and s.status in {COMPLETED, BILLED}
            and s.actual_end in (WINDOW_START, WINDOW_END]
      )
      bcba_supervision_minutes = sum(
          (s.actual_end - s.actual_start).total_seconds() / 60
          for s in TherapySession
          where s.patient_id == patient_id
            and s.session_type == BCBA_SUPERVISION
            and s.status in {COMPLETED, BILLED}
            and s.actual_end in (WINDOW_START, WINDOW_END]
      )

      # Conditional branch on denominator:
      if rbt_minutes == 0:
          ratio = 1.0                              # vacuously compliant (no RBT to supervise)
      else:
          ratio = bcba_supervision_minutes / rbt_minutes

      compliant = (ratio >= 0.10)                  # boundary precision: 0.10 passes, 0.099999 fails
    input_set: "All sessions for the same patient_id (across both authorizations if any) in trailing 30 days at trigger time, ordered by actual_end ascending, tie-break on id ascending."
    constants:
      SUPERVISION_RATIO_MIN: 0.10
      SUPERVISION_WINDOW_DAYS: 30
    precision: "Ratio carried as Python float; comparison ratio >= 0.10 uses exact float comparison (>=)."

  - name: claim_total_submitted
    trigger: "InsuranceClaim DRAFT→SUBMITTED side_effect sets claim.submitted_amount_cents"
    algorithm: tiered_pricing
    formula: |
      # For each session_id in claim.session_ids, compute a per-line submitted amount IN CENTS,
      # then sum. Rounding order is pinned: ROUND PER LINE, THEN SUM (DO NOT sum then round).
      per_line_cents = []
      for sid in claim.session_ids (ordered by TherapySession.id ascending):
          s   = TherapySession[sid]
          rate_cents_per_unit = TIERED_RATES[s.session_type]
          patient_resp_pct    = PATIENT_RESPONSIBILITY_PCT[authorization.payer_name] or 0.15
          raw_line_dollars    = (s.billed_units * rate_cents_per_unit / 100) * (1 - patient_resp_pct)
          # Pinned rounding step: round_half_up to nearest cent, applied to this line in isolation:
          line_cents          = round_half_up(raw_line_dollars * 100)
          per_line_cents.append(line_cents)

      submitted_amount_cents = sum(per_line_cents)
    input_set: "All TherapySession rows referenced by claim.session_ids, snapshot at submission time."
    constants:
      TIERED_RATES:
        DIRECT_RBT: 3333          # cents per unit (≈ $33.33 / 15 min)
        BCBA_SUPERVISION: 6800    # cents per unit
        PARENT_TRAINING: 5000     # cents per unit
      PATIENT_RESPONSIBILITY_PCT_DEFAULT: 0.15
    precision: |
      round_half_up applied to each per-line cent amount BEFORE summing.
      Order is pinned: per-line rounding first, then integer sum.
      This is the (b) mode of Difficulty Rule 2 — "sum then round" would diverge by ±1 cent on
      typical inputs and is REJECTED.

  - name: claim_total_reimbursed
    trigger: "InsuranceClaim ADJUDICATED→PAID side_effect sets claim.reimbursed_amount_cents"
    algorithm: tiered_pricing
    formula: |
      # If claim.appeal_round == 0: reimbursed = submitted_amount_cents
      # If claim.appeal_round >= 1: appeal penalty applied PER LINE before summing.
      per_line_cents = []
      for sid in claim.session_ids (ordered by TherapySession.id ascending):
          s   = TherapySession[sid]
          base_line_cents = (one entry from claim_total_submitted's per_line_cents for this sid)
          if claim.appeal_round == 0:
              line_cents = base_line_cents
          else:
              # 5% appeal recovery haircut per round, applied per-line, round_half_up after each line:
              factor = (1 - 0.05) ** claim.appeal_round
              line_cents = round_half_up(base_line_cents * factor)
          per_line_cents.append(line_cents)

      reimbursed_amount_cents = sum(per_line_cents)
    input_set: "Same session set as claim_total_submitted; iteration order pinned by TherapySession.id ascending."
    constants:
      APPEAL_HAIRCUT_PER_ROUND: 0.05
    precision: |
      Same per-line round_half_up rule as claim_total_submitted. When appeal_round >= 1, haircut
      factor is applied per line, then rounded per line, then summed.

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:

  # ---------- 1. Authentication ----------
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of {BCBA, RBT, ClinicAdmin, PayerAdmin}"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all (except POST /_clock/advance which requires ClinicAdmin)"

  - priority: 2
    category: auth
    check: "X-User-ID header present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  # ---------- 3. Authorization (RBAC) ----------
  - priority: 3
    category: auth
    check: "Caller's role is permitted for this endpoint per RBAC matrix (§1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  # ---------- 4. Ownership (acting-as) ----------
  - priority: 4
    category: auth
    check: |
      For role BCBA or RBT acting on a TherapySession, DiagnosticEvaluation, or TreatmentPlan:
        - on /sessions/{id}/start, /sessions/{id}/complete: session.therapist_id == X-User-ID
        - on /evaluations/{id}/start, /evaluations/{id}/complete: evaluation.evaluator_therapist_id == X-User-ID
    error_id: ERR_NOT_THERAPIST_OF_RECORD
    http_status: 403
    applies_to: "Therapist-acting endpoints"

  # ---------- 5. Existence (left-to-right path) ----------
  - priority: 5
    category: existence
    check: "Path parameter resources exist; checked LEFT-TO-RIGHT (clinic_id before patient_id before session_id, etc.). Foreign keys in the body checked AFTER path."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parametric endpoints"

  - priority: 6
    category: existence
    check: "Foreign-key fields in request body resolve (e.g., treatment_plan_id, authorization_id, session_ids[*], evaluator_therapist_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH endpoints with FK body fields"

  # ---------- 7. State preconditions ----------
  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is valid (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: state
    check: "InsuranceClaim DRAFT→SUBMITTED: every session_id has TherapySession.status == COMPLETED"
    error_id: ERR_SESSION_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /claims/{id}/submit"

  # ---------- 9. Business — safety / supervision compliance ----------
  - priority: 9
    category: business_safety
    check: |
      InsuranceClaim ADJUDICATED→PAID: calculations.supervision_ratio.compliant == true at trigger
      time (ratio >= 0.10 over patient's trailing 30 days from clinic.now_ts).
    error_id: ERR_SUPERVISION_RATIO_BREACH
    http_status: 422
    applies_to: "POST /claims/{id}/pay"

  - priority: 10
    category: business_safety
    check: |
      TreatmentPlan DRAFT→ACTIVE: weekly_supervision_hours_target / weekly_direct_hours_target >= 0.10
      (boundary precision: 0.10 passes, 0.099999 fails).
    error_id: ERR_PLAN_RATIO_INSUFFICIENT
    http_status: 422
    applies_to: "POST /treatment-plans/{id}/activate"

  # ---------- 11. Business — referential consistency ----------
  - priority: 11
    category: business_referential
    check: |
      InsuranceClaim DRAFT→SUBMITTED: every session_id references a session whose
      authorization_id equals claim.authorization_id (single-auth claim).
    error_id: ERR_SESSION_AUTH_MISMATCH
    http_status: 422
    applies_to: "POST /claims/{id}/submit"

  - priority: 12
    category: business_referential
    check: |
      TherapySession create: session.session_type's CPT code matches Authorization.cpt_code
      (DIRECT_RBT↔97153, BCBA_SUPERVISION↔97155, PARENT_TRAINING↔97156).
    error_id: ERR_CPT_CODE_MISMATCH
    http_status: 422
    applies_to: "POST /sessions, POST /sessions/{id}/start"

  - priority: 13
    category: business_referential
    check: |
      TherapySession create with session_type=BCBA_SUPERVISION: supervising_therapist_id MUST resolve
      to an active RBT therapist of the same clinic, AND that RBT must have at least one
      TherapySession in status COMPLETED|BILLED with the same patient_id in the trailing 30 days.
    error_id: ERR_NO_RBT_TO_SUPERVISE
    http_status: 422
    applies_to: "POST /sessions"

  # ---------- 14. Business — temporal ----------
  - priority: 14
    category: business_temporal
    check: |
      TherapySession create: [planned_start, planned_end) MUST NOT overlap any existing
      TherapySession for the same therapist_id in status SCHEDULED|IN_PROGRESS|COMPLETED|BILLED|DISPUTED.
      Interval semantic: half-open — adjacent (touching) is allowed.
    error_id: ERR_SESSION_THERAPIST_OVERLAP
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 15
    category: business_temporal
    check: |
      TherapySession create with session_type=PARENT_TRAINING: planned interval expanded by 15 minutes
      on each side MUST NOT overlap any other TherapySession for the same patient_id in status
      SCHEDULED|IN_PROGRESS|COMPLETED|BILLED|DISPUTED. Interval semantic: closed-closed with a
      15-minute buffer on each side — touching IS a conflict.
    error_id: ERR_PARENT_TRAINING_BUFFER
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 16
    category: business_temporal
    check: |
      TherapySession create: clinic.now_ts <= planned_start AND
      [planned_start, planned_end] ⊆ [authorization.effective_start, authorization.effective_end]
      (sessions cannot be scheduled in the past, and must fit entirely within the authorization window).
    error_id: ERR_SESSION_OUTSIDE_AUTH_WINDOW
    http_status: 422
    applies_to: "POST /sessions"

  # ---------- 17. Business — fiscal (capacity / quota) ----------
  - priority: 17
    category: business_fiscal
    check: |
      TherapySession create: planned_units <= authorization.provisional_balance (after the prospective
      hold). Boundary precision: planned_units strictly greater than balance fails; planned_units equal
      to balance passes.
    error_id: ERR_AUTH_UNITS_EXHAUSTED
    http_status: 422
    applies_to: "POST /sessions"

  - priority: 18
    category: business_fiscal
    check: |
      InsuranceClaim DRAFT→SUBMITTED: sum(session.billed_units for session in claim.session_ids)
      MUST be > 0 (non-empty, non-zero-units claims only). Boundary precision: sum == 0 fails.
    error_id: ERR_EMPTY_CLAIM
    http_status: 422
    applies_to: "POST /claims/{id}/submit"

  # ---------- 19. Business — constraint ----------
  - priority: 19
    category: business_constraint
    check: |
      TreatmentPlan create: at most one TreatmentPlan in status DRAFT|ACTIVE per patient.
      (For supersession, the new plan is created in DRAFT and the supersede endpoint atomically
      flips both rows.)
    error_id: ERR_TREATMENT_PLAN_CONFLICT
    http_status: 409
    applies_to: "POST /treatment-plans"

  - priority: 20
    category: business_constraint
    check: |
      Authorization create: cpt_code is from {97151, 97153, 97155, 97156}; renewed_from_id (if set)
      must resolve to an Authorization with cpt_code equal to the new authorization's cpt_code.
    error_id: ERR_RENEWAL_CPT_MISMATCH
    http_status: 422
    applies_to: "POST /authorizations"

  - priority: 21
    category: business_constraint
    check: |
      InsuranceClaim DENIED→APPEALED: appeal_round < 2 (claims may be appealed at most twice).
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /claims/{id}/appeal"

  # ---------- 22. Optimistic concurrency ----------
  - priority: 22
    category: state
    check: "PATCH/PUT body version, when present, must equal current resource version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH endpoints"

  # ---------- 23. Pagination ----------
  - priority: 23
    category: business_constraint
    check: "limit in [1, 100]; offset >= 0; if violated, 422"
    error_id: ERR_PAGINATION_PARAMS
    http_status: 422
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------- Test harness ----------
  - method: POST
    path: "/_clock/advance"
    description: "Advance clinic.now_ts by N seconds (test-driver endpoint; required for time-gated transitions: Authorization PENDING→APPROVED→ACTIVE, ACTIVE→EXPIRED, TreatmentPlan ACTIVE→EXPIRED). Body: {clinic_id, seconds: integer>0}."
    roles: [ClinicAdmin]
    code: 200
    input: [clinic_id, seconds]
    output: Clinic
    side_effects:
      - "Re-evaluate all Authorization rows for this clinic: PENDING→APPROVED if approve was already called and now_ts >= effective_start (already-APPROVED→ACTIVE); ACTIVE→EXPIRED if now_ts > effective_end; cascade ACTIVE TherapySession→CANCELLED on EXPIRED."
      - "Re-evaluate TreatmentPlan ACTIVE→EXPIRED for plans where now_ts > activated_at + 365d."

  # ---------- Clinics ----------
  - method: POST
    path: "/clinics"
    description: "Create a clinic; ClinicAdmin bootstrap."
    roles: [ClinicAdmin]
    code: 201
    input: [name]
    output: Clinic
    side_effects: ["clinic.now_ts := 2025-01-01T00:00:00.000Z (deterministic epoch)"]

  - method: GET
    path: "/clinics/{clinic_id}"
    description: "Read a clinic (including now_ts)."
    roles: [BCBA, RBT, ClinicAdmin, PayerAdmin]
    code: 200
    input: []
    output: Clinic
    side_effects: []

  # ---------- Patients ----------
  - method: POST
    path: "/patients"
    description: "Create a patient."
    roles: [ClinicAdmin, BCBA]
    code: 201
    input: [clinic_id, legal_name, date_of_birth, insurance_member_id]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients for caller's clinic (filterable by status)."
    roles: [ClinicAdmin, BCBA, RBT]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}"
    description: "Read a patient (includes clinical_progress_score_provisional and _adjudicated)."
    roles: [ClinicAdmin, BCBA, RBT, PayerAdmin]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---------- Therapists ----------
  - method: POST
    path: "/therapists"
    description: "Register a therapist (BCBA or RBT)."
    roles: [ClinicAdmin]
    code: 201
    input: [clinic_id, legal_name, credential, license_number]
    output: Therapist
    side_effects: []

  - method: GET
    path: "/therapists/{therapist_id}"
    description: "Read a therapist."
    roles: [ClinicAdmin, BCBA, RBT, PayerAdmin]
    code: 200
    input: []
    output: Therapist
    side_effects: []

  # ---------- Diagnostic Evaluations ----------
  - method: POST
    path: "/patients/{patient_id}/evaluations"
    description: "Schedule a diagnostic evaluation."
    roles: [BCBA, ClinicAdmin]
    code: 201
    input: [evaluator_therapist_id, scheduled_at]
    output: DiagnosticEvaluation
    side_effects: []

  - method: POST
    path: "/evaluations/{evaluation_id}/start"
    description: "Begin evaluation (SCHEDULED→IN_PROGRESS)."
    roles: [BCBA]
    code: 200
    input: []
    output: DiagnosticEvaluation
    side_effects: ["status transition"]

  - method: POST
    path: "/evaluations/{evaluation_id}/complete"
    description: "Finish evaluation (IN_PROGRESS→COMPLETED) with diagnosis."
    roles: [BCBA]
    code: 200
    input: [diagnosis_code, severity_level, recommended_weekly_hours]
    output: DiagnosticEvaluation
    side_effects: ["status transition; sets completed_at"]

  - method: POST
    path: "/evaluations/{evaluation_id}/void"
    description: "Cancel an evaluation."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: DiagnosticEvaluation
    side_effects: ["status transition"]

  # ---------- Treatment Plans ----------
  - method: POST
    path: "/patients/{patient_id}/treatment-plans"
    description: "Draft a treatment plan derived from a completed evaluation."
    roles: [BCBA]
    code: 201
    input: [source_evaluation_id, weekly_direct_hours_target, weekly_supervision_hours_target, weekly_parent_training_hours_target]
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/treatment-plans/{plan_id}/activate"
    description: "Activate plan (DRAFT→ACTIVE)."
    roles: [BCBA]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status transition"]

  - method: POST
    path: "/treatment-plans/{plan_id}/supersede"
    description: "Atomically supersede a prior ACTIVE plan with this DRAFT plan (old→SUPERSEDED, new→ACTIVE)."
    roles: [BCBA]
    code: 200
    input: [previous_plan_id]
    output: TreatmentPlan
    side_effects: ["old plan SUPERSEDED, new plan ACTIVE; plan_version increments"]

  - method: GET
    path: "/patients/{patient_id}/treatment-plans"
    description: "List a patient's treatment plans (any status)."
    roles: [BCBA, ClinicAdmin, RBT, PayerAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TreatmentPlan[]"
    side_effects: []

  # ---------- Authorizations ----------
  - method: POST
    path: "/patients/{patient_id}/authorizations"
    description: "Submit an authorization request for a CPT code (PENDING)."
    roles: [ClinicAdmin]
    code: 201
    input: [treatment_plan_id, payer_name, cpt_code, approved_units, effective_start, effective_end, "renewed_from_id?"]
    output: Authorization
    side_effects: []

  - method: POST
    path: "/authorizations/{authorization_id}/approve"
    description: "Approve a pending authorization (PENDING→APPROVED). For a renewal, this also flips parent ACTIVE→RENEWED."
    roles: [PayerAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: ["status transition; on renewal, parent.renewed_to_id set and parent ACTIVE→RENEWED"]

  - method: POST
    path: "/authorizations/{authorization_id}/deny"
    description: "Deny a pending authorization (PENDING→DENIED)."
    roles: [PayerAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: ["status transition"]

  - method: GET
    path: "/authorizations/{authorization_id}"
    description: "Read an authorization (includes provisional and adjudicated unit balances)."
    roles: [ClinicAdmin, BCBA, RBT, PayerAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  - method: GET
    path: "/authorizations/{authorization_id}/supervision-ratio"
    description: "Computed read: returns {ratio, compliant, rbt_minutes, bcba_supervision_minutes, window_start, window_end} per calculations.supervision_ratio."
    roles: [ClinicAdmin, BCBA, PayerAdmin]
    code: 200
    input: []
    output: "SupervisionRatioSnapshot (transient computed object)"
    side_effects: []

  - method: GET
    path: "/authorizations/{authorization_id}/ledger"
    description: "List BillingLedgerEntry rows for the authorization, in created_at ascending order."
    roles: [ClinicAdmin, BCBA, PayerAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BillingLedgerEntry[]"
    side_effects: []

  # ---------- Therapy Sessions ----------
  - method: POST
    path: "/patients/{patient_id}/sessions"
    description: "Schedule a therapy session against an authorization."
    roles: [ClinicAdmin, BCBA]
    code: 201
    input: [authorization_id, therapist_id, session_type, planned_start, planned_end, "supervising_therapist_id?"]
    output: TherapySession
    side_effects: []

  - method: POST
    path: "/sessions/{session_id}/start"
    description: "Begin session (SCHEDULED→IN_PROGRESS); records actual_start."
    roles: [BCBA, RBT]
    code: 200
    input: []
    output: TherapySession
    side_effects: ["status transition"]

  - method: POST
    path: "/sessions/{session_id}/complete"
    description: "Finish session (IN_PROGRESS→COMPLETED); records actual_end, computes billed_units, captures progress_rating, appends BillingLedgerEntry PROVISIONAL_DEBIT, recomputes Authorization.provisional_units_consumed."
    roles: [BCBA, RBT]
    code: 200
    input: [progress_rating]
    output: TherapySession
    side_effects:
      - "status transition"
      - "BillingLedgerEntry append (PROVISIONAL_DEBIT)"
      - "Authorization.provisional_units_consumed recompute"
      - "Patient.clinical_progress_score_provisional recompute"

  - method: POST
    path: "/sessions/{session_id}/dispute"
    description: "Mark a COMPLETED session as DISPUTED (cyclic); reverses provisional unit hold."
    roles: [BCBA]
    code: 200
    input: [dispute_reason]
    output: TherapySession
    side_effects:
      - "status transition"
      - "BillingLedgerEntry append (PROVISIONAL_CREDIT)"
      - "Authorization.provisional_units_consumed recompute"

  - method: POST
    path: "/sessions/{session_id}/resolve-dispute"
    description: "Return DISPUTED session to COMPLETED; re-debits provisional units."
    roles: [BCBA]
    code: 200
    input: []
    output: TherapySession
    side_effects:
      - "status transition"
      - "BillingLedgerEntry append (PROVISIONAL_DEBIT)"
      - "Authorization.provisional_units_consumed recompute"

  - method: POST
    path: "/sessions/{session_id}/cancel"
    description: "Cancel a SCHEDULED session."
    roles: [ClinicAdmin, BCBA]
    code: 200
    input: []
    output: TherapySession
    side_effects: ["status transition"]

  - method: GET
    path: "/patients/{patient_id}/sessions"
    description: "List sessions for a patient (filterable by status, session_type, therapist_id)."
    roles: [BCBA, RBT, ClinicAdmin, PayerAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "session_type?", "therapist_id?"]
    output: "TherapySession[]"
    side_effects: []

  # ---------- Insurance Claims ----------
  - method: POST
    path: "/patients/{patient_id}/claims"
    description: "Draft a claim referencing a set of COMPLETED sessions under one authorization."
    roles: [ClinicAdmin]
    code: 201
    input: [authorization_id, session_ids]
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/claims/{claim_id}/submit"
    description: "Submit a DRAFT claim (DRAFT→SUBMITTED); flips each session COMPLETED→BILLED; computes submitted_amount_cents."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects:
      - "status transition"
      - "TherapySession COMPLETED→BILLED cascade"
      - "claim.submitted_amount_cents := calculations.claim_total_submitted"

  - method: POST
    path: "/claims/{claim_id}/adjudicate"
    description: "Adjudicate a SUBMITTED or APPEALED claim (→ADJUDICATED). Provide denial_reason to mark for denial."
    roles: [PayerAdmin]
    code: 200
    input: ["denial_reason?"]
    output: InsuranceClaim
    side_effects: ["status transition; denial_reason recorded if present"]

  - method: POST
    path: "/claims/{claim_id}/pay"
    description: "Pay an ADJUDICATED claim (ADJUDICATED→PAID); requires supervision_ratio compliance; appends ADJUDICATED_DEBIT to ledger; recomputes Authorization.adjudicated_units_consumed; cascades auto-EXHAUSTED if budget hits zero."
    roles: [PayerAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects:
      - "status transition"
      - "claim.reimbursed_amount_cents := calculations.claim_total_reimbursed"
      - "BillingLedgerEntry append (ADJUDICATED_DEBIT)"
      - "Authorization.adjudicated_units_consumed recompute"
      - "Authorization ACTIVE→EXHAUSTED if adjudicated_balance <= 0 (cascade hop 3)"
      - "Patient.clinical_progress_score_adjudicated recompute"

  - method: POST
    path: "/claims/{claim_id}/deny"
    description: "Reject an ADJUDICATED claim (ADJUDICATED→DENIED); requires denial_reason already recorded; cascades sessions BILLED→COMPLETED."
    roles: [PayerAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects:
      - "status transition"
      - "TherapySession BILLED→COMPLETED cascade"
      - "BillingLedgerEntry append (PROVISIONAL_CREDIT, reason=CLAIM_DENIED)"
      - "Authorization.provisional_units_consumed recompute"

  - method: POST
    path: "/claims/{claim_id}/appeal"
    description: "Appeal a DENIED claim (DENIED→APPEALED); appeal_round increments, sessions return to BILLED."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects:
      - "status transition"
      - "claim.appeal_round += 1; claim.denial_reason cleared"
      - "TherapySession COMPLETED→BILLED cascade"

  - method: GET
    path: "/patients/{patient_id}/claims"
    description: "List claims for a patient."
    roles: [ClinicAdmin, BCBA, PayerAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "InsuranceClaim[]"
    side_effects: []

  - method: GET
    path: "/claims/{claim_id}"
    description: "Read a single claim."
    roles: [ClinicAdmin, BCBA, PayerAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_AUTH_REQUIRED,                http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN,                    http: 403, condition: "Caller's role is not permitted for this endpoint" }
  - { id: ERR_NOT_THERAPIST_OF_RECORD,      http: 403, condition: "Therapist action attempted by user other than the session/evaluation's therapist_id/evaluator_therapist_id" }
  - { id: ERR_NOT_FOUND,                    http: 404, condition: "Path parameter resource or body FK does not exist" }
  - { id: ERR_INVALID_STATE,                http: 409, condition: "Requested transition not valid from current state" }
  - { id: ERR_SESSION_NOT_COMPLETED,        http: 409, condition: "Claim submit references a TherapySession not in COMPLETED state" }
  - { id: ERR_SESSION_THERAPIST_OVERLAP,    http: 409, condition: "Session [planned_start, planned_end) overlaps another non-CANCELLED session for the same therapist_id" }
  - { id: ERR_PARENT_TRAINING_BUFFER,       http: 409, condition: "PARENT_TRAINING session violates 15-minute closed-closed buffer rule on patient_id" }
  - { id: ERR_TREATMENT_PLAN_CONFLICT,      http: 409, condition: "Patient already has a TreatmentPlan in DRAFT or ACTIVE (uniqueness)" }
  - { id: ERR_CLAIM_STATE_INVALID,          http: 409, condition: "Concurrent claim transitions; loser detected via state check" }
  - { id: ERR_RENEWAL_CONFLICT,             http: 409, condition: "Two renewal Authorizations approved for the same parent Authorization" }
  - { id: ERR_SESSION_ALREADY_CLAIMED,      http: 409, condition: "Session_id appears in another claim with status in {SUBMITTED, ADJUDICATED, PAID, APPEALED}" }
  - { id: ERR_VERSION_CONFLICT,             http: 409, condition: "PATCH body version != server version" }
  - { id: ERR_SUPERVISION_RATIO_BREACH,     http: 422, condition: "supervision_ratio < 0.10 at Claim PAY time" }
  - { id: ERR_PLAN_RATIO_INSUFFICIENT,      http: 422, condition: "TreatmentPlan weekly_supervision_hours/weekly_direct_hours < 0.10 at activation" }
  - { id: ERR_SESSION_AUTH_MISMATCH,        http: 422, condition: "Claim's session_ids reference sessions under more than one authorization_id, or under an authorization_id != claim.authorization_id" }
  - { id: ERR_CPT_CODE_MISMATCH,            http: 422, condition: "session_type does not map to authorization.cpt_code" }
  - { id: ERR_NO_RBT_TO_SUPERVISE,          http: 422, condition: "BCBA_SUPERVISION session created without an eligible RBT supervisee (no qualifying RBT session in trailing 30 days)" }
  - { id: ERR_SESSION_OUTSIDE_AUTH_WINDOW,  http: 422, condition: "Session planned interval not contained in [authorization.effective_start, authorization.effective_end], or planned_start in the past" }
  - { id: ERR_AUTH_UNITS_EXHAUSTED,         http: 422, condition: "Session creation would push provisional_units_consumed past approved_units" }
  - { id: ERR_EMPTY_CLAIM,                  http: 422, condition: "Claim has zero session_ids or sum(billed_units)==0 at submit time" }
  - { id: ERR_RENEWAL_CPT_MISMATCH,         http: 422, condition: "Renewal authorization cpt_code != parent authorization cpt_code" }
  - { id: ERR_APPEAL_LIMIT_REACHED,         http: 422, condition: "Claim appeal_round already 2; cannot appeal again" }
  - { id: ERR_PAGINATION_PARAMS,            http: 422, condition: "Invalid limit or offset on list endpoints" }
  - { id: ERR_VALIDATION,                   http: 422, condition: "Schema-level body validation failure not covered by a more specific code (missing required field, type mismatch, enum value out of set)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BCBA
    description: "Board Certified Behavior Analyst — performs evaluations, drafts and activates treatment plans, supervises RBTs, may run any session type."
    identity: "entity_backed:Therapist"   # X-User-ID is a Therapist.id whose credential == BCBA
    exclusive_operations:
      - "POST /evaluations/{id}/start"
      - "POST /evaluations/{id}/complete"
      - "POST /patients/{id}/treatment-plans"
      - "POST /treatment-plans/{id}/activate"
      - "POST /treatment-plans/{id}/supersede"
      - "POST /sessions/{id}/dispute"
      - "POST /sessions/{id}/resolve-dispute"
    shared_operations:
      - "POST /patients (with ClinicAdmin)"
      - "POST /patients/{id}/evaluations (with ClinicAdmin)"
      - "POST /patients/{id}/sessions (with ClinicAdmin)"
      - "POST /sessions/{id}/start (with RBT)"
      - "POST /sessions/{id}/complete (with RBT)"
      - "POST /sessions/{id}/cancel (with ClinicAdmin)"
      - "GET reads on patients, sessions, claims, plans, authorizations"

  - name: RBT
    description: "Registered Behavior Technician — runs DIRECT_RBT sessions assigned to them; cannot manage plans or claims."
    identity: "entity_backed:Therapist"   # X-User-ID is a Therapist.id whose credential == RBT
    exclusive_operations: []
    shared_operations:
      - "POST /sessions/{id}/start (with BCBA, only on sessions where therapist_id == self)"
      - "POST /sessions/{id}/complete (with BCBA, only on sessions where therapist_id == self)"
      - "GET reads on own patient roster"

  - name: ClinicAdmin
    description: "Clinic operations — creates patients/therapists/authorizations, submits claims, advances the clock, cancels sessions."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /clinics"
      - "POST /therapists"
      - "POST /patients/{id}/authorizations"
      - "POST /patients/{id}/claims"
      - "POST /claims/{id}/submit"
      - "POST /claims/{id}/appeal"
      - "POST /evaluations/{id}/void"
    shared_operations:
      - "POST /patients (with BCBA)"
      - "POST /patients/{id}/evaluations (with BCBA)"
      - "POST /patients/{id}/sessions (with BCBA)"
      - "POST /sessions/{id}/cancel (with BCBA)"
      - "GET reads across clinic"

  - name: PayerAdmin
    description: "Insurance payer operator — approves/denies authorizations, adjudicates and pays/denies claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /authorizations/{id}/approve"
      - "POST /authorizations/{id}/deny"
      - "POST /claims/{id}/adjudicate"
      - "POST /claims/{id}/pay"
      - "POST /claims/{id}/deny"
    shared_operations:
      - "GET reads on authorizations, claims, sessions, patients (for adjudication)"
