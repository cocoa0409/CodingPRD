      - name: accruable_set_cardinality_zero_with_a_matched_line_present
        grounds:
          - validations[priority=36].ERR_NO_ACCRUABLE_LINES
          - calculations.rate_card_selection
          - state_machines.PurchaseBatch.NORMALIZED_to_ACCRUED
          - entities.RateCard.fields.status
          - endpoints["POST /purchase-batches/{batch_id}/accrue"]
        distinguishing_aspect: |
          Boundary type = cardinality zero of a derived input set, in the hardest
          shape: the batch DOES have a MATCHED line, so a naive "any matched
          line" guard would let accrue through. The matched line's item carries
          exactly one card and that card is still PROPOSED, so the accruable set
          (MATCHED and resolves an APPROVED card for the invoice_date) is empty
          and the whole call must fail atomically at 422 with the batch left in
          NORMALIZED.
        test_recipe:
          setup:
            - "ProgramTier ELITE, Distributor METRO-01, Member Harbor Grill ACTIVE with a countersigned letter."
            - "Deal PBC-2026 is ACTIVE because item BEEF-PATTY-4OZ-CS40 has an APPROVED PER_CASE 150 card."
            - "A second item CHICKEN-TENDER-CS20 under the SAME active deal has exactly one card, left in status PROPOSED (never approved), covering June 2026."
            - "The June batch holds ONE line of 25 cases reporting CHICKEN-TENDER-CS20; normalize marks it MATCHED because item eligibility does not consider rate cards."
            - "Before the trigger: batch.normalization_status == NORMALIZED, matched_cases == 25, unmatched_cases == 0, and no RebateAccrual row exists."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45, reversal_posture_limit: 1 }
