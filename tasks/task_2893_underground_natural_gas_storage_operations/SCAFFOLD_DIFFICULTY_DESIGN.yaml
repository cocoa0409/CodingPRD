              captures: { e2: $.data.error_id }
          assert:
            - "before the triggers: Nomination.${n1}.status == CURTAILED and revision_round == 2"
            - "${e1} == ERR_NOMINATION_REVISION_LIMIT with HTTP 422 (window still open, only priority 30 is violated)"
            - "${e2} == ERR_NOMINATION_WINDOW_CLOSED with HTTP 422 (both 18 and 30 violated, priority 18 wins)"
            - "Nomination.${n1}.status == CURTAILED, revision_round == 2, confirmed_volume_dth == 90000, curtailed_volume_dth == 10000 after both refusals"
            - "StorageContract.${c1}.scheduled_injection_dth == 90000"

  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: horsepower_allocation_exactly_at_rated_capacity_is_admissible
        grounds:
          - validations.priority_25_ERR_HORSEPOWER_OVERSUBSCRIBED
          - entities.CompressorUnit.fields.rated_horsepower
          - entities.CompressorRun.fields.allocated_horsepower
        distinguishing_aspect: |
          The oversubscription test is > rated_horsepower, not >=: 4000 + 2000 hp in the same window on a
          6000 hp unit is accepted at exactly the ceiling, and adding a single further horsepower to that
          window (6001) is refused with ERR_HORSEPOWER_OVERSUBSCRIBED. A full 6000 hp run in the adjacent
          window starting exactly when the first window ends is also accepted, so the window comparison is
          half-open at both edges.
        test_recipe:
          setup:
            - "Field F_STD with one well (so the posture is OPEN and POST /compressor-runs is not gated)."
            - "One compressor unit rated exactly 6000 hp with the default derate_factor 0.0."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "CU-01", rated_horsepower: 6000 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-05T08:00:00Z", allocated_horsepower: 4000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-05T08:00:00Z", allocated_horsepower: 2000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r2: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-05T08:00:00Z", allocated_horsepower: 1, mode: "INJECTION" }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T08:00:00Z", window_end_at: "2026-08-05T16:00:00Z", allocated_horsepower: 6000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r3: $.data.id }
          assert:
            - "the 2000 hp run ${r2} is created with HTTP 201 and status SCHEDULED (4000 + 2000 == 6000 is admissible)"
            - "${e1} == ERR_HORSEPOWER_OVERSUBSCRIBED with HTTP 409 (6001 > 6000)"
            - "the adjacent 6000 hp run ${r3} is created with HTTP 201 (windows are half-open, 08:00Z does not overlap [00:00Z, 08:00Z))"
            - "CompressorUnit.${u1}.scheduled_run_count == 3 and status == COMMITTED"
            - "CompressorUnit.${u1}.lifetime_fuel_dth == 0 and StorageField.${f1}.fuel_gas_used_dth == 0 (nothing has been completed)"
            - "CompressorRun.${r1}.fuel_consumed_dth is null"

      - name: report_variance_tolerance_boundary_is_inclusive_at_exactly_half_a_percent
        grounds:
          - calculations.report_variance
          - validations.priority_38_ERR_REPORT_VARIANCE_EXCEEDED
          - entities.RegulatoryReport.fields.variance_pct
        distinguishing_aspect: |
          Against a book inventory of exactly 5,000,000 Dth a measured 5,025,000 Dth gives variance_pct
          0.5000, which is exactly MAX_REPORT_VARIANCE_PCT and must submit successfully, while 5,030,000 Dth
          gives 0.6000 and must be refused with ERR_REPORT_VARIANCE_EXCEEDED. The comparison happens after
          rounding to 4 decimal places and on the absolute variance, so an implementation using a strict <
          rejects the compliant report.
        test_recipe:
          setup:
            - "Field F_STD opened with 5,000,000 Dth of working gas (62.50% of the ceiling) and one well."
            - "Two INVENTORY_VERIFICATION reports prepared by compliance user 'officer-prep' for different periods so the (field, type, period_start_date) uniqueness key is not touched: 2026-07-01..2026-07-31 measured 5,025,000 Dth and 2026-08-01..2026-08-31 measured 5,030,000 Dth."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 5000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { storage_field_id: "${f1}", report_type: "INVENTORY_VERIFICATION", period_start_date: "2026-07-01", period_end_date: "2026-07-31", measured_inventory_dth: 5025000.000 }
              as: ComplianceOfficer
              as_user_id: "officer-prep"
              captures: { ra: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { storage_field_id: "${f1}", report_type: "INVENTORY_VERIFICATION", period_start_date: "2026-08-01", period_end_date: "2026-08-31", measured_inventory_dth: 5030000.000 }
              as: ComplianceOfficer
              as_user_id: "officer-prep"
              captures: { rb: $.data.id }
          trigger:
            - call: "POST /regulatory-reports/${ra}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-review"
            - call: "POST /regulatory-reports/${rb}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-review"
              captures: { e1: $.data.error_id }
          assert:
            - "RegulatoryReport.${ra}.book_inventory_dth == 5000000.000, variance_dth == 25000.000, variance_pct == 0.5000"
            - "RegulatoryReport.${ra}.status == SUBMITTED (0.5000 <= 0.5 is admissible)"
            - "RegulatoryReport.${rb}.variance_dth == 30000.000 and variance_pct == 0.6000"
            - "${e1} == ERR_REPORT_VARIANCE_EXCEEDED with HTTP 422 and RegulatoryReport.${rb}.status is still DRAFT"
            - "StorageField.${f1}.inventory_pct == 62.50, current_pressure_psig == 1675, deliverability_tier == TIER_3"
            - "both reports have open_finding_count == 0"

      - name: fuel_band_jumps_upward_across_utilization_ratio_0_850000
        grounds:
          - calculations.compressor_fuel_burn
          - entities.CompressorRun.fields.utilization_ratio
          - entities.CompressorRun.fields.utilization_band
        distinguishing_aspect: |
          The band table is deliberately non-monotonic: HIGH's rate 0.0105 sits above MID's 0.0092, so one
          extra horsepower on a 6000 hp unit — 5099 hp (ratio 0.849833, MID, 375.29 Dth) versus 5100 hp
          (ratio 0.850000, HIGH, 428.40 Dth) — makes fuel jump 53.11 Dth upward. The band floor is >= on the
          6-decimal-place rounded ratio, so 0.850000 belongs to HIGH, and an implementation that compares an
          unrounded ratio or uses > lands the 5100 hp run in MID at 375.36.
        test_recipe:
          setup:
            - "Field F_STD with one well; one compressor unit rated 6000 hp with derate_factor 0.0."
            - "Two adjacent 8-hour INJECTION runs on that unit: 2026-08-05T00:00Z-08:00Z at 5100 hp and 2026-08-05T08:00Z-16:00Z at 5099 hp (adjacent, so horsepower never oversubscribes)."
            - "The clock is moved to 2026-08-05T16:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "CU-01", rated_horsepower: 6000, derate_factor: 0.0 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-05T08:00:00Z", allocated_horsepower: 5100, mode: "INJECTION" }
              as: FieldOperator
              captures: { rh: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-05T08:00:00Z", window_end_at: "2026-08-05T16:00:00Z", allocated_horsepower: 5099, mode: "INJECTION" }
              as: FieldOperator
              captures: { rm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T16:00:00Z" }
              as: FieldOperator
          trigger:
            - call: "POST /compressor-runs/${rh}/complete"
              payload: {}
              as: FieldOperator
            - call: "POST /compressor-runs/${rm}/complete"
              payload: {}
              as: FieldOperator
          assert:
            - "CompressorRun.${rh}.utilization_ratio == 0.850000, utilization_band == HIGH, fuel_consumed_dth == 428.40"
            - "CompressorRun.${rm}.utilization_ratio == 0.849833, utilization_band == MID, fuel_consumed_dth == 375.29"
            - "CompressorRun.${rh}.fuel_consumed_dth - CompressorRun.${rm}.fuel_consumed_dth == 53.11 (one extra horsepower costs 53.11 Dth)"
            - "CompressorRun.${rh}.fuel_consumed_dth != 375.36 (the MID rate applied to 5100 hp)"
            - "CompressorRun.${rh}.effective_horsepower == 5100.00 and CompressorRun.${rm}.effective_horsepower == 5099.00"
            - "CompressorUnit.${u1}.lifetime_fuel_dth == 803.69 and StorageField.${f1}.fuel_gas_used_dth == 803.69"
            - "StorageField.${f1}.working_gas_inventory_dth == 2999196.310"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: nomination_confirm_gated_on_field_posture_driven_by_an_emergency_event
        grounds:
          - state_machines.EmergencyEvent.transitions.DETECTED_to_RESPONDING
          - state_machines.EmergencyEvent.transitions.RESPONDING_to_CONTAINED
          - validations.priority_9_ERR_FIELD_FROZEN
          - calculations.field_posture_derivation
        distinguishing_aspect: |
          Whether a nomination on a healthy contract can be confirmed depends on the status of an
          EmergencyEvent two entities away: while the event is RESPONDING the field is forced FROZEN and the
          confirm returns ERR_FIELD_FROZEN, and the identical confirm succeeds with confirmed_volume_dth
          90000 once the event is advanced to CONTAINED and the posture is re-derived to OPEN. Nothing about
          the nomination, contract, shipper or well changes between the two calls.
        test_recipe:
          setup:
            - "Field F_STD with one well rated 600000 Dth/day; posture OPEN."
            - "One FIRM contract, ACTIVE, with a SUBMITTED nomination of 90000 Dth INJECTION for gas day 2026-08-05 (still SUBMITTED, so the FROZEN sweep has nothing to curtail)."
            - "A SERIOUS LEAK EmergencyEvent on the field advanced to RESPONDING, which forces field_posture to FROZEN."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
