          The rule only exists for distributors that flag requires_advance_guarantee, so it is a
          configuration-conditional validation: the identical payload is legal against the canonical distributor
          and illegal against this one. It fails if the flag is ignored, or if a zero guarantee is silently
          replaced by a positive default.
