      - name: complete_session_before_ends_at_returns_training_session_not_ended
        claim_type: violation_to_error
        grounds:
          - "§1.2 TrainingSession SCHEDULED -> COMPLETED requires the logical clock instant to be at or after ends_at (else ERR_TRAINING_SESSION_NOT_ENDED); §1.6 declares it at 409."
        distinguishing_aspect: "The clock is 13 days before ends_at, so completion is refused with ERR_TRAINING_SESSION_NOT_ENDED at 409 and the session stays SCHEDULED — the guard is the logical clock, not the enrolment count."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One SCHEDULED ROOMS session in TR-1 on 2026-09-14 09:00-12:00 with capacity 5 and enrolled_count 0, while the clock is still 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/training-sessions"
              payload: { program_id: "${prog_id}", title: "Rooms orientation", training_room_code: "TR-1", starts_at: "2026-09-14T09:00:00Z", ends_at: "2026-09-14T12:00:00Z", capacity: 5, department: "ROOMS" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { sess_future: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/training-sessions/${sess_future}/complete"
              payload: {}
              as: TalentManager
              as_user_id: "tm-1"
              captures: { e_notended: "$.data.error_id" }
          assert:
            - "the logical clock is at 2026-09-01T00:00:00Z, before ends_at 2026-09-14T12:00:00Z"
