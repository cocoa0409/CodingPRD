      # -- X3 -------------------------------------------------------------
      - name: three_occ_ids_precede_nine_invalid_state_ids_and_each_entity_owns_its_own_409
        claim_type: Violation → Error
        grounds: "§1.4 priorities 11-13 / the catalogue entries ERR_STALE_PLAYLIST_VERSION, ERR_STALE_MULTIPLEX_VERSION, ERR_STALE_ASSET_VERSION (all 412) and the nine 409 state ids ERR_TRANSMITTER_INVALID_STATE, ERR_CHANNEL_INVALID_AIR_STATE, ERR_ASSET_INVALID_STATE, ERR_PLAYLIST_INVALID_STATE, ERR_ITEM_INVALID_PLAYOUT_STATE, ERR_FEED_WINDOW_INVALID_STATE, ERR_OVERRIDE_INVALID_STATE, ERR_FAULT_INVALID_STATE, ERR_NOTIFICATION_INVALID_STATE; §1.2.1 the six OCC rules"
        distinguishing_aspect: "Only THREE entities are version-guarded (Playlist, Multiplex, Asset) even though nine entities have state machines, so the six OCC-guarded endpoints must be able to name which of the three tokens they consume — and two of them consume a token belonging to a DIFFERENT entity than the one they mutate (POST /channels and PATCH /channels/{id}/allocation consume expected_multiplex_version; POST /spot-orders/{id}/makegoods consumes expected_playlist_version). The nine 409s must never substitute for one another: a playout event on an item of a non-ON_AIR playlist is ERR_PLAYLIST_NOT_ON_AIR (a dedicated id), an event on a PLAYED item is ERR_ITEM_INVALID_PLAYOUT_STATE, and a QC report on an EXPIRED asset is ERR_ASSET_INVALID_STATE — three different ids for what an implementation is tempted to call 'wrong state'. Ordering: the 412 always beats the 409, so a request that is both stale AND illegal is a 412 and the caller learns nothing about the state violation until it re-reads."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, whose playlist has already consumed versions through the ingest / validate / arm / air chain."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /playlists/${pl1_id}/traffic-revisions"
              as: TrafficCoordinator
              payload: {expected_playlist_version: "${pl1_v1}", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-01T12:00:00Z", scheduled_duration_seconds: 3600, max_trim_seconds: 0}]}
              captures: {x3_pl_stale: "$.data.error_id"}
            - call: "POST /assets/${aprog_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${aprog_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 1800}
              captures: {x3_as_stale: "$.data.error_id"}
            - call: "POST /channels"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v1}", call_sign: "WXYZ-DT3", channel_number: "12.3", service_class: SUBCHANNEL, resolution_class: SD_480I, requested_bitrate_kbps: 3000, floor_bitrate_kbps: 2000, priority_rank: 3, parent_channel_id: "${ch1_id}"}
              captures: {x3_mux_stale: "$.data.error_id"}
            - call: "POST /playlists/${pl1_id}/state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_status: ARMED}
              captures: {x3_pl_state: "$.data.error_id"}
            - call: "POST /network-feed-windows"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", feed_source: NETWORK_PRIMARY, anchor_sequence_number: 4, join_utc: "2026-08-01T12:31:00Z", breakaway_utc: "2026-08-01T12:36:00Z", backtiming_mode: PAD_TO_JOIN, guard_seconds: 30}
              captures: {x3_fw_id: "$.data.id"}
            - call: "POST /network-feed-windows/${x3_fw_id}/breakaway"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {}
              captures: {x3_fw_state: "$.data.error_id"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: CAPTION_LOSS, severity: MINOR, detected_utc: "2026-08-01T11:59:00Z", channel_id: "${ch1_id}"}
              captures: {x3_f_id: "$.data.id"}
            - call: "POST /technical-faults/${x3_f_id}/state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: DETECTED}
              captures: {x3_f_state: "$.data.error_id"}
          assert:
            - "the three 412s are entity-specific and each is reached with a token the SETUP itself made stale (${pl1_v1} predates the validate/arm/air chain, ${aprog_v2} predates the setup QC report, ${mux1_v1} predates both channel creations): ${x3_pl_stale} == ERR_STALE_PLAYLIST_VERSION, ${x3_as_stale} == ERR_STALE_ASSET_VERSION, ${x3_mux_stale} == ERR_STALE_MULTIPLEX_VERSION"
            - "the multiplex token is consumed by an endpoint that CREATES a channel, so a caller holding a valid Channel version still gets ERR_STALE_MULTIPLEX_VERSION — the token identifies the CAPACITY POOL, not the row being written"
            - "412 beats 409: the stale traffic-revision request above is ALSO illegal for an ON_AIR playlist, and the answer is the 412; only after re-reading the version does the caller see ERR_PLAYLIST_INVALID_STATE"
            - "${x3_pl_state} == ERR_PLAYLIST_INVALID_STATE for ON_AIR -> ARMED (a backwards move), ${x3_fw_state} == ERR_FEED_WINDOW_INVALID_STATE for a breakaway on a SCHEDULED window that was never joined, and ${x3_f_state} == ERR_FAULT_INVALID_STATE for a self-loop DETECTED -> DETECTED"
            - "STATE-ID CENSUS, one id per entity and never a substitute: ERR_TRANSMITTER_INVALID_STATE for an undeclared power move (FULL_POWER -> FULL_POWER); ERR_CHANNEL_INVALID_AIR_STATE for requesting EAS_OVERRIDE directly through /air-state; ERR_ASSET_INVALID_STATE for a QC report on an EXPIRED or RETRACTED asset; ERR_PLAYLIST_INVALID_STATE for any undeclared playlist move; ERR_ITEM_INVALID_PLAYOUT_STATE for a second CUE or an END on a SCHEDULED item; ERR_FEED_WINDOW_INVALID_STATE for join/breakaway out of order; ERR_OVERRIDE_INVALID_STATE for activating an already-ACTIVE override or releasing a RELEASED one; ERR_FAULT_INVALID_STATE for any undeclared fault move including a move out of AUTO_CLEARED; ERR_NOTIFICATION_INVALID_STATE for filing a notification that is already FILED or LATE_FILED"
            - "the dedicated air ids are NOT part of this family and must not be replaced by it: ERR_PLAYLIST_NOT_ON_AIR, ERR_CHANNEL_NOT_ON_AIR and ERR_PLAYLIST_ITEM_STILL_PLAYING each own their own condition even though all three describe a 'wrong state'"
            - "every 412 and every 409 in this family is side-effect free: version counters unchanged, no as-run rows, no notification rows"

      # -- X4 -------------------------------------------------------------
      - name: the_eight_air_safety_ids_are_cross_entity_and_resolve_in_a_fixed_order
        claim_type: Violation → Error
        grounds: "§1.4 priorities 24-26 and 37-43 / the catalogue entries ERR_ORDER_FULLY_SETTLED (409), ERR_CHANNEL_SUSPENDED_POSTURE (409), ERR_CHANNEL_ALLOCATION_STARVED (409), ERR_TRANSMITTER_OFF_AIR (409), ERR_RF_FAULT_BLOCKS_RESTORE (409), ERR_CRITICAL_FAULT_OPEN (409), ERR_UNCLEARED_CONTENT_ON_AIR (409), ERR_CAPTION_REQUIREMENT_UNMET (409); §1.2 Transmitter REDUCED_POWER|OFF_AIR -> FULL_POWER precondition ('No TechnicalFault with transmitter_id == this transmitter, fault_code == RF_POWER_FAULT and state IN {DETECTED, ACKNOWLEDGED, ESCALATED}')"
        distinguishing_aspect: "Every id in this family is a CROSS-ENTITY refusal: the row being written is legal on its own terms and is blocked by a fact stored somewhere else (a fault on the transmitter, a starvation on the multiplex, a clearance on an asset, a settlement on an order). That makes the family the natural home of the priority pairs: rule 25 (SUSPENDED posture) beats rule 67 (capacity) even though 67 is a higher number; rule 26 (STARVED) beats the channel's own air-state machine so a starved channel can still go to BARS_AND_TONE but not to ON_AIR; and ERR_RF_FAULT_BLOCKS_RESTORE is keyed to the FAULT CODE, so an open AUDIO_LOSS fault of the same severity on the same transmitter does NOT block a power restoration — only RF_POWER_FAULT does, and only while it is in {DETECTED, ACKNOWLEDGED, ESCALATED} (a MITIGATED one still blocks nothing)."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig. Drop the transmitter to 79 percent, open an RF_POWER_FAULT on it, then try to restore full power; resolve the fault, restore, then take the transmitter OFF_AIR and try to bring a channel back to air."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 79, reason: "COOLING_FAULT"}
              captures: {x4_reduced: "$.data.operational_state"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: AUDIO_LOSS, severity: MAJOR, detected_utc: "2026-08-01T11:59:00Z", channel_id: "${ch1_id}"}
              captures: {x4_audio_id: "$.data.id"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: FULL_POWER}
              captures: {x4_restore_ok: "$.data.operational_state"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 79, reason: "COOLING_FAULT"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: RF_POWER_FAULT, severity: MAJOR, detected_utc: "2026-08-01T11:59:00Z", transmitter_id: "${tx1_id}"}
              captures: {x4_rf_id: "$.data.id"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: FULL_POWER}
              captures: {x4_rf_block: "$.data.error_id"}
            - call: "POST /technical-faults/${x4_rf_id}/state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: MITIGATED, mitigation_code: SWITCH_TO_BACKUP}
              captures: {x4_rf_mit: "$.data.state"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: FULL_POWER}
              captures: {x4_restore2: "$.data.operational_state"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: OFF_AIR, reason: "TOTAL_POWER_LOSS"}
              captures: {x4_off: "$.data.operational_state"}
            - call: "POST /channels/${ch2_id}/air-state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_air_status: ON_AIR}
              captures: {x4_off_block: "$.data.error_id"}
          assert:
            - "an open MAJOR AUDIO_LOSS fault does NOT block a power restoration: ${x4_restore_ok} == FULL_POWER while ${x4_audio_id} is still DETECTED — the precondition is keyed to fault_code RF_POWER_FAULT, not to severity"
            - "an open RF_POWER_FAULT does block it: 409 ${x4_rf_block} == ERR_RF_FAULT_BLOCKS_RESTORE, and the transmitter stays REDUCED_POWER"
            - "mitigating the RF fault is enough (the precondition names states {DETECTED, ACKNOWLEDGED, ESCALATED}): ${x4_rf_mit} == MITIGATED and ${x4_restore2} == FULL_POWER without waiting for RESOLVED"
            - "with the transmitter ${x4_off} == OFF_AIR, bringing a channel to air -> 409 ${x4_off_block} == ERR_TRANSMITTER_OFF_AIR, which is a DIFFERENT id from ERR_CHANNEL_INVALID_AIR_STATE (the channel's own DARK -> ON_AIR move is legal; it is the carrier that is dark)"
            - "AIR-SAFETY CENSUS: ERR_ORDER_FULLY_SETTLED from a makegood into a FULLY_AIRED or CLOSED_WITH_CREDIT order (rule 24); ERR_CHANNEL_SUSPENDED_POSTURE from any air-affecting mutation while posture is SUSPENDED, and it BEATS ERR_MULTIPLEX_CAPACITY_EXCEEDED (rule 25, PRIORITY PAIR b); ERR_CHANNEL_ALLOCATION_STARVED from taking a STARVED channel to ON_AIR or from a START event on it, while BARS_AND_TONE and DARK stay legal (rule 26); ERR_TRANSMITTER_OFF_AIR from any operation needing a radiating carrier; ERR_RF_FAULT_BLOCKS_RESTORE only from a power restoration with an open RF_POWER_FAULT; ERR_CRITICAL_FAULT_OPEN from taking a channel to ON_AIR with an open CRITICAL fault; ERR_UNCLEARED_CONTENT_ON_AIR from CUEing an item whose clearance_status is UNCLEARED or BLOCKED; ERR_CAPTION_REQUIREMENT_UNMET from clearing or airing an asset whose captions_required is true but caption_present is false"
            - "the family's ids are mutually exclusive by construction: a starved channel with an open CRITICAL fault on a dark transmitter returns exactly ONE id, the lowest-priority-number applicable rule (ERR_CHANNEL_SUSPENDED_POSTURE at 25, then ERR_CHANNEL_ALLOCATION_STARVED at 26, then the 37-43 block in ascending order)"
            - "every refusal in this family is a pure rejection: the fault rows, the posture and the transmitter state are exactly as they were before the refused call, and no AsRunEntry is appended"

      # -- X5 -------------------------------------------------------------
      - name: the_eleven_authority_and_waiver_ids_are_identity_tests_not_threshold_tests
        claim_type: Violation → Error
        grounds: "§1.4 priorities 27-36 and 62 / the catalogue entries ERR_QC_WAIVER_SCORE_TOO_LOW (409), ERR_WAIVER_JUSTIFICATION_REQUIRED (422), ERR_SELF_AUTHORIZATION_FORBIDDEN (409), ERR_OVERRIDE_AUTHORITY_INSUFFICIENT (403), ERR_EAS_OVERRIDE_ACTIVE (409), ERR_CRAWL_TEXT_REQUIRED (422), ERR_EAS_MINIMUM_DURATION_NOT_MET (409), ERR_REJECTION_REASON_REQUIRED (422), ERR_MITIGATION_CODE_REQUIRED (422), ERR_FAULT_ESCALATION_TOO_EARLY (409), ERR_OPERATOR_ROLE_CLASS_INVALID (409); §1.1 Operator.override_authority and Operator.role_class"
        distinguishing_aspect: "This family is where the API distinguishes WHO from WHAT, and it contains the only 403 that is not part of the auth ladder: ERR_OVERRIDE_AUTHORITY_INSUFFICIENT is a 403 raised on a BODY field (authorized_by_operator_id) rather than on a header, so the caller can be perfectly authorized to call the endpoint and still get a 403 about somebody else's authority. ERR_OPERATOR_ROLE_CLASS_INVALID is its 409 twin: also about a referenced operator, but about their role_class rather than their authority, and it must not be confused with the 403 ERR_ROLE_IDENTITY_MISMATCH that concerns the CALLER's header. ERR_SELF_AUTHORIZATION_FORBIDDEN completes the triangle by comparing two body fields to each other (requested_by vs authorized_by) and is evaluated BEFORE the authority check, so an operator with insufficient authority who authorizes their own request gets the self-authorization error, not the authority error."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig: Dov Imre is PROGRAM_DIRECTOR with override_authority FULL, Ben Ochs is MASTER_CONTROL with CRAWL_AND_CUTIN, Ada Rowe is ENGINEER with NONE."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /emergency-overrides"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {channel_id: "${ch1_id}", requested_by_operator_id: "${op_pd_id}", alert_class: EAS_MANDATORY, override_mode: CUT_IN, requested_start_utc: "2026-08-01T11:59:30Z", expected_duration_seconds: 300}
              captures: {x5_ov_id: "$.data.id"}
            - call: "POST /emergency-overrides/${x5_ov_id}/activate"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {authorized_by_operator_id: "${op_pd_id}", override_mode: CUT_IN}
              captures: {x5_self: "$.data.error_id"}
            - call: "POST /emergency-overrides/${x5_ov_id}/activate"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {authorized_by_operator_id: "${op_mco_id}", override_mode: FULL_TAKEOVER}
              captures: {x5_authority: "$.data.error_id"}
            - call: "POST /emergency-overrides/${x5_ov_id}/activate"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {authorized_by_operator_id: "${op_eng_id}", override_mode: CUT_IN}
              captures: {x5_roleclass: "$.data.error_id"}
            - call: "POST /emergency-overrides/${x5_ov_id}/activate"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {authorized_by_operator_id: "${op_mco_id}", override_mode: CUT_IN}
              captures: {x5_state: "$.data.state"}
            - call: "POST /playlist-items/${it1_id}/playout-events"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {event_kind: CUE, event_utc: "2026-08-01T11:59:00Z", source: OPERATOR}
              captures: {x5_eas_active: "$.data.error_id"}
            - call: "POST /emergency-overrides/${x5_ov_id}/release"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {}
              captures: {x5_dwell: "$.data.error_id"}
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${apromo_v2}", inspected_by_operator_id: "${op_eng_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 60}
              captures: {x5_qc_roleclass: "$.data.error_id"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: AUTOMATION_STALL, severity: MINOR, detected_utc: "2026-08-01T11:59:00Z", channel_id: "${ch1_id}"}
              captures: {x5_f_id: "$.data.id"}
            - call: "POST /technical-faults/${x5_f_id}/state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: ESCALATED}
              captures: {x5_escalate: "$.data.error_id"}
          assert:
            - "authorizing one's own request -> 409 ${x5_self} == ERR_SELF_AUTHORIZATION_FORBIDDEN, even though Dov Imre holds override_authority FULL and would otherwise be the ideal authorizer (rule 28 beats rule 27)"
            - "a CRAWL_AND_CUTIN operator authorizing a FULL_TAKEOVER -> 403 ${x5_authority} == ERR_OVERRIDE_AUTHORITY_INSUFFICIENT: a 403 about a BODY field, raised on a call the header identity was fully permitted to make"
            - "naming an ENGINEER as the authorizer -> 409 ${x5_roleclass} == ERR_OPERATOR_ROLE_CLASS_INVALID: authorization is reserved to MASTER_CONTROL and PROGRAM_DIRECTOR role_classes, and this is a 409 about a referenced row, NOT the 403 ERR_ROLE_IDENTITY_MISMATCH about the caller"
            - "a CRAWL_AND_CUTIN operator authorizing a CUT_IN succeeds: ${x5_state} == ACTIVE_CUTIN — the authority check is a set-membership test on override_mode, not a rank comparison"
            - "with the override active, an unrelated playout event -> 409 ${x5_eas_active} == ERR_EAS_OVERRIDE_ACTIVE: the channel is in EAS_OVERRIDE and normal playout is frozen until release"
            - "releasing an EAS_MANDATORY override before 120 s of dwell -> 409 ${x5_dwell} == ERR_EAS_MINIMUM_DURATION_NOT_MET; the same release of a SEVERE_WEATHER override would be accepted immediately, so the id is gated on alert_class"
            - "a QC report whose inspected_by_operator_id names an ENGINEER -> 409 ${x5_qc_roleclass} == ERR_OPERATOR_ROLE_CLASS_INVALID (rule 62), the same id in a completely different context — the referenced operator's role_class must match the field's required class"
            - "escalating a fault 0 s after detection -> 409 ${x5_escalate} == ERR_FAULT_ESCALATION_TOO_EARLY; at exactly 120 s it is accepted"
            - "REMAINING CENSUS: ERR_QC_WAIVER_SCORE_TOO_LOW from a waiver on an asset whose governing INGEST score is 39 or less (40 is waivable); ERR_WAIVER_JUSTIFICATION_REQUIRED from a 19-character justification (20 is accepted); ERR_CRAWL_TEXT_REQUIRED from a CRAWL create or activate with no non-blank crawl_text; ERR_REJECTION_REASON_REQUIRED from any release aimed at a PENDING override; ERR_MITIGATION_CODE_REQUIRED from a MITIGATED or RESOLVED fault move with no mitigation_code"
            - "no refusal in this family mutates anything: the override stays PENDING through the three failed activations, the fault stays DETECTED, and the asset's QC history gains no report"

      # -- X6 -------------------------------------------------------------
      - name: the_thirteen_temporal_ids_each_own_one_interval_rule_and_none_is_a_generic_timing_error
        claim_type: Violation → Error
        grounds: "§1.4 priorities 37-42, 55-59 and 63-67 / the catalogue entries ERR_SCHEDULE_GAP_DETECTED, ERR_SCHEDULE_OVERLAP_DETECTED, ERR_FEED_WINDOW_OVERLAP, ERR_JOIN_OUTSIDE_GUARD_WINDOW, ERR_BREAKAWAY_TOO_EARLY, ERR_ENCODER_CAPACITY_EXCEEDED, ERR_OVERRIDE_WINDOW_OVERLAP, ERR_PLAYOUT_EVENT_OUT_OF_ORDER, ERR_EVENT_TIMESTAMP_IN_FUTURE, ERR_CLOCK_NOT_MONOTONIC, ERR_DELIVERY_DEADLINE_PASSED, ERR_MAKEGOOD_DEADLINE_PASSED, ERR_ARM_VARIANCE_EXCEEDED (all 409); §1.4 priority 40 ('RESOURCE-TEMPORAL OVERLAP (open-ended interval): a channel accepts at most one non-terminal EmergencyOverride'); §1.3 playlist_timeline_integrity (half-open, adjacency MANDATORY), live_encoder_concurrency_peak"
        distinguishing_aspect: "Thirteen ids for what a lazy implementation calls one thing ('bad time'), and they differ in the SHAPE of the interval each defends: the playlist timeline is half-open with adjacency MANDATORY, so a hole is ERR_SCHEDULE_GAP_DETECTED and a collision is ERR_SCHEDULE_OVERLAP_DETECTED and abutment is neither; feed windows are closed-interval resources on one channel (ERR_FEED_WINDOW_OVERLAP) while overrides are OPEN-ENDED intervals with no scheduled end, so ERR_OVERRIDE_WINDOW_OVERLAP fires for any non-terminal override on the channel regardless of the requested_start_utc — two overrides scheduled a week apart still collide; the encoder pool is a half-open concurrency PEAK across a multiplex (ERR_ENCODER_CAPACITY_EXCEEDED) where releases at an instant precede claims at the same instant; and the three clock ids defend three different reference points (the logical now for ERR_EVENT_TIMESTAMP_IN_FUTURE, the previous event for ERR_PLAYOUT_EVENT_OUT_OF_ORDER, the previous clock for ERR_CLOCK_NOT_MONOTONIC) so a single event can violate one and satisfy the other two."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, which already carries one feed window slot (item 4, 12:31-12:36) and a spot order with a 14:10 makegood deadline."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /emergency-overrides"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", requested_by_operator_id: "${op_mco_id}", alert_class: SEVERE_WEATHER, override_mode: CUT_IN, requested_start_utc: "2026-08-01T12:10:00Z", expected_duration_seconds: 120}
              captures: {x6_ov1: "$.data.id"}
            - call: "POST /emergency-overrides"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", requested_by_operator_id: "${op_mco_id}", alert_class: SEVERE_WEATHER, override_mode: CUT_IN, requested_start_utc: "2026-08-08T12:10:00Z", expected_duration_seconds: 120}
              captures: {x6_ov_overlap: "$.data.error_id"}
            - call: "POST /emergency-overrides"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch2_id}", requested_by_operator_id: "${op_mco_id}", alert_class: SEVERE_WEATHER, override_mode: CUT_IN, requested_start_utc: "2026-08-01T12:10:00Z", expected_duration_seconds: 120}
              captures: {x6_ov2: "$.data.id"}
            - call: "POST /playlists"
              as: TrafficCoordinator
              payload:
                channel_id: "${ch2_id}"
                broadcast_day: "2026-08-03"
                schedule_start_utc: "2026-08-03T12:00:00Z"
                items:
                  - {sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-03T12:00:00Z", scheduled_duration_seconds: 1800, max_trim_seconds: 0}
                  - {sequence_number: 2, element_kind: PROMO, asset_id: "${apromo_id}", scheduled_start_utc: "2026-08-03T12:29:30Z", scheduled_duration_seconds: 60, max_trim_seconds: 30}
              captures: {x6_overlap: "$.data.error_id"}
            - call: "POST /playlists"
              as: TrafficCoordinator
              payload:
                channel_id: "${ch2_id}"
                broadcast_day: "2026-08-03"
                schedule_start_utc: "2026-08-03T12:00:00Z"
                items:
                  - {sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-03T12:00:00Z", scheduled_duration_seconds: 1800, max_trim_seconds: 0}
                  - {sequence_number: 2, element_kind: PROMO, asset_id: "${apromo_id}", scheduled_start_utc: "2026-08-03T12:30:01Z", scheduled_duration_seconds: 60, max_trim_seconds: 30}
              captures: {x6_gap: "$.data.error_id"}
            - call: "POST /playlist-items/${it3_id}/playout-events"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {event_kind: END, event_utc: "2026-08-01T11:59:00Z", measured_duration_seconds: 30, source: AUTOMATION}
              captures: {x6_order: "$.data.error_id"}
          assert:
            - "a SECOND non-terminal override on the same channel is refused no matter how far away its requested_start_utc is: ${x6_ov_overlap} == ERR_OVERRIDE_WINDOW_OVERLAP for a request a WEEK later, because an override's interval is open-ended (rule 40)"
            - "the same request on a DIFFERENT channel succeeds (${x6_ov2}): the resource is the channel, not the station"
            - "a 30-second collision between items 1 and 2 -> 409 ${x6_overlap} == ERR_SCHEDULE_OVERLAP_DETECTED; a ONE-SECOND hole between them -> 409 ${x6_gap} == ERR_SCHEDULE_GAP_DETECTED — two different ids for the two directions of the same adjacency rule, and exact abutment at 12:30:00 is accepted"
            - "an END event on an item that was never CUEd -> 409 ${x6_order} == ERR_PLAYOUT_EVENT_OUT_OF_ORDER, not ERR_ITEM_INVALID_PLAYOUT_STATE: the id names the LOG ordering violation"
            - "TEMPORAL CENSUS: ERR_FEED_WINDOW_OVERLAP from a second feed window whose [join_utc, breakaway_utc] touches an existing one on the same channel; ERR_JOIN_OUTSIDE_GUARD_WINDOW from a join more than guard_seconds late (30 accepted, 31 refused); ERR_BREAKAWAY_TOO_EARLY from a breakaway before breakaway_utc - guard_seconds (exact boundary accepted); ERR_ENCODER_CAPACITY_EXCEEDED when the half-open concurrency peak across the multiplex exceeds live_encoder_units_total (peak == total accepted); ERR_EVENT_TIMESTAMP_IN_FUTURE from event_utc one second past the logical clock; ERR_CLOCK_NOT_MONOTONIC from a clock set equal to or before the current instant; ERR_DELIVERY_DEADLINE_PASSED from a delivery more than 3600 s past the deadline on an asset that has not yet been swept; ERR_MAKEGOOD_DEADLINE_PASSED from a placement one second past makegood_deadline_utc; ERR_ARM_VARIANCE_EXCEEDED from an arm whose actual start differs from the schedule by 31 s or more"
            - "the three clock-family ids are independent: an event_utc equal to the logical now is legal for rule 41 yet can still violate rule 42 if the previous event on the item is later, and a clock set backwards is refused even when every event in the log would remain consistent"
            - "ERR_DELIVERY_DEADLINE_PASSED is only observable on an asset the sweep has NOT expired (a QC_FAILED asset), because a still-EXPECTED asset is moved to EXPIRED by checkpoint (c) first and then answers ERR_ASSET_INVALID_STATE instead"
            - "every rejected request in this family leaves no partial timeline: the ingest attempts create no playlist row at all, so GET /channels/${ch2_id}/playlists?broadcast_day=2026-08-03 is empty"

      # -- X7 -------------------------------------------------------------
      - name: five_air_window_ids_and_nine_shape_uniqueness_ids_never_collapse_into_each_other
        claim_type: Violation → Error
        grounds: "§1.4 priorities 44-55 and 63-66 / the catalogue entries ERR_PLAYLIST_AIR_TOO_EARLY, ERR_PLAYLIST_NOT_ON_AIR, ERR_CHANNEL_NOT_ON_AIR, ERR_CHANNEL_PLAYLIST_ALREADY_ON_AIR, ERR_PLAYLIST_ITEM_STILL_PLAYING (all 409), ERR_DUPLICATE_CHANNEL_NUMBER, ERR_DUPLICATE_HOUSE_NUMBER, ERR_DUPLICATE_ORDER_REFERENCE (409), ERR_SUBCHANNEL_PARENT_REQUIRED (422), ERR_PRIMARY_CHANNEL_PARENT_FORBIDDEN (422), ERR_INVALID_CHANNEL_PARENT (409), ERR_CROSS_MULTIPLEX_PARENT (409), ERR_BITRATE_FLOOR_EXCEEDS_REQUEST (422), ERR_BITRATE_FLOOR_BELOW_RESOLUTION_MINIMUM (422); §1.4 priority 52 ('SELF-REFERENTIAL SHAPE: the parent chain is exactly one level deep')"
        distinguishing_aspect: "The parentage cluster is the sharpest part of the surface because five ids describe five DIFFERENT ways one field can be wrong, split across two HTTP codes: a SUBCHANNEL with no parent is 422 (a shape error), a PRIMARY with a parent is 422 (also shape), a parent that is itself a SUBCHANNEL or is the channel itself is 409 (a graph error), and a parent on another multiplex is a different 409 (a scope error) — so the same missing/extra/illegal/foreign axis produces 422, 422, 409, 409 and an implementation that funnels them into one id fails four ways. The air-window five are the mirror image on the playout side: four of them are about DIFFERENT rows (the playlist's own status, the channel's air_status, a sibling playlist already on air, a sibling item still playing) and one is about time (the preroll window), which means the caller can distinguish 'not yet' from 'not you' from 'not here'."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, whose MUX-A carries PRIMARY 12.1 and SUBCHANNEL 12.2, plus MUX-B on the same transmitter carrying channel 20.1."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /assets"
              as: TrafficCoordinator
              payload: {house_number: "HN-PROG-01", title: "Duplicate House", source: SATELLITE, expected_duration_seconds: 1800, delivery_deadline_utc: "2026-08-01T23:00:00Z", required_resolution_class: HD_1080I, captions_required: false}
              captures: {x7_dup_house: "$.data.error_id"}
            - call: "POST /spot-orders"
              as: TrafficCoordinator
              payload: {channel_id: "${ch1_id}", advertiser_name: "Copycat Motors", order_reference: "ORD-2026-0001", ordered_spots: 2, unit_duration_seconds: 30, rate_cents_total: 100000, daypart: PRIME, priority_class: PREEMPTIBLE, makegood_deadline_utc: "2026-08-01T23:00:00Z"}
              captures: {x7_dup_order: "$.data.error_id"}
            - call: "POST /channels"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v3}", call_sign: "WXYZ-DT4", channel_number: "12.4", service_class: SUBCHANNEL, resolution_class: SD_480I, requested_bitrate_kbps: 3000, floor_bitrate_kbps: 2000, priority_rank: 4, parent_channel_id: "${ch2_id}"}
              captures: {x7_bad_parent: "$.data.error_id"}
            - call: "POST /playlist-items/${it1_id}/playout-events"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {event_kind: CUE, event_utc: "2026-08-01T11:59:00Z", source: OPERATOR}
              captures: {x7_cue1: "$.data.event_kind"}
            - call: "POST /playlist-items/${it2_id}/playout-events"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {event_kind: CUE, event_utc: "2026-08-01T11:59:00Z", source: OPERATOR}
              captures: {x7_still_playing: "$.data.error_id"}
          assert:
            - "reusing an existing house_number -> 409 ${x7_dup_house} == ERR_DUPLICATE_HOUSE_NUMBER; reusing an order_reference -> 409 ${x7_dup_order} == ERR_DUPLICATE_ORDER_REFERENCE; reusing a channel_number on the same multiplex -> 409 ERR_DUPLICATE_CHANNEL_NUMBER — three distinct ids for three distinct uniqueness scopes (station-wide, station-wide, per-multiplex)"
            - "parenting a SUBCHANNEL to another SUBCHANNEL -> 409 ${x7_bad_parent} == ERR_INVALID_CHANNEL_PARENT: the chain is exactly one level deep, and the SAME id covers a channel naming itself as parent"
            - "cueing a second item while another is PLAYING -> 409 ${x7_still_playing} == ERR_PLAYLIST_ITEM_STILL_PLAYING (${x7_cue1} == CUE succeeded first), and NOT ERR_ITEM_INVALID_PLAYOUT_STATE — the target item is perfectly SCHEDULED; the obstacle is a sibling row"
            - "PARENTAGE CENSUS with its 422/409 split: SUBCHANNEL with parent_channel_id absent -> 422 ERR_SUBCHANNEL_PARENT_REQUIRED; PRIMARY with a parent_channel_id -> 422 ERR_PRIMARY_CHANNEL_PARENT_FORBIDDEN; parent that is a SUBCHANNEL or the channel itself -> 409 ERR_INVALID_CHANNEL_PARENT; parent on a different multiplex -> 409 ERR_CROSS_MULTIPLEX_PARENT; parent uuid naming nothing -> 404 ERR_CHANNEL_NOT_FOUND (a fifth, different answer)"
            - "BITRATE SHAPE CENSUS: floor_bitrate_kbps greater than requested_bitrate_kbps -> 422 ERR_BITRATE_FLOOR_EXCEEDS_REQUEST (equal is accepted); floor below the resolution minimum (1999 for SD_480I whose minimum is 2000) -> 422 ERR_BITRATE_FLOOR_BELOW_RESOLUTION_MINIMUM; and when both are wrong the lower rule id (54) wins"
            - "AIR-WINDOW CENSUS: taking a playlist ON_AIR before schedule_start_utc minus the preroll -> ERR_PLAYLIST_AIR_TOO_EARLY; a playout event on an item whose playlist is not ON_AIR -> ERR_PLAYLIST_NOT_ON_AIR; a playout event on an item of a playlist whose CHANNEL is not ON_AIR -> ERR_CHANNEL_NOT_ON_AIR; taking a second playlist ON_AIR on a channel that already has one -> ERR_CHANNEL_PLAYLIST_ALREADY_ON_AIR; cueing or starting an item while a sibling is PLAYING -> ERR_PLAYLIST_ITEM_STILL_PLAYING"
            - "the air-window ids are ordered among themselves: when the playlist is ARMED on a DARK channel the answer is ERR_CHANNEL_NOT_ON_AIR only if the channel check has the lower rule id, otherwise ERR_PLAYLIST_NOT_ON_AIR — the pair must be resolved consistently in both directions and asserted explicitly"
            - "every refusal here is total: no asset, order, channel or as-run row is created, and the already-PLAYING item keeps exactly one CUE entry"

      # -- X8 -------------------------------------------------------------
      - name: the_final_fifteen_ids_cover_referential_inventory_and_arithmetic_refusals
        claim_type: Violation → Error
        grounds: "§1.4 priorities 56-61 and 67 plus the business rows / the catalogue entries ERR_SEQUENCE_NUMBER_CONFLICT, ERR_ANCHOR_ITEM_NOT_FOUND, ERR_SUBSTITUTE_RESOLUTION_MISMATCH, ERR_TRIM_EXCEEDS_MAX, ERR_PLAYLIST_EMPTY_INGEST, ERR_PLAYLIST_NO_PROGRAM_CONTENT, ERR_FILING_DETAILS_REQUIRED, ERR_SPOT_ORDER_CHANNEL_MISMATCH, ERR_ITEM_PLAYLIST_MISMATCH, ERR_FAULT_TARGET_MISMATCH, ERR_COMMERCIAL_INVENTORY_EXCEEDED, ERR_NO_CREDITED_SPOT_TO_MAKEGOOD, ERR_ORDER_NOT_PREEMPTIBLE, ERR_BITRATE_FLOOR_UNSATISFIABLE, ERR_MULTIPLEX_CAPACITY_EXCEEDED; §1.4 priority 61 ('Fault codes RF_POWER_FAULT and LOSS_OF_SIGNAL require transmitter_id; AUDIO_LOSS, BLACK_FRAME and CAPTION_LOSS require channel_id')"
        distinguishing_aspect: "The last fifteen ids are the ones an implementation reaches only if it models RELATIONSHIPS rather than rows. Three of them are pure cross-entity mismatches that all look like 'wrong id' to a naive validator but differ in WHICH pair must agree: ERR_SPOT_ORDER_CHANNEL_MISMATCH (order.channel_id vs playlist.channel_id), ERR_ITEM_PLAYLIST_MISMATCH (makegood target playlist vs the order's channel, or a replacement asset already placed in the same hour) and ERR_FAULT_TARGET_MISMATCH (fault_code vs which of channel_id / transmitter_id / playlist_item_id is supplied, plus the item-belongs-to-channel and transmitter-carries-multiplex checks). Two more are inventory and preemption policies rather than shapes: ERR_COMMERCIAL_INVENTORY_EXCEEDED counts SECONDS per clock hour across a bucketing boundary, and ERR_ORDER_NOT_PREEMPTIBLE refuses a GUARANTEED order that only the explicit force_preempt_guaranteed flag can override. And two are the arithmetic terminus of the waterfall: an infeasible FLOOR SUM is ERR_BITRATE_FLOOR_UNSATISFIABLE while an over-capacity PIN is ERR_MULTIPLEX_CAPACITY_EXCEEDED — same inequality, different id, chosen by which side of the allocation the caller supplied."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, then create a spot order on channel 12.2 and try to place it on a channel 12.1 playlist, and file faults whose code and target disagree."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: AUDIO_LOSS, severity: MAJOR, detected_utc: "2026-08-01T11:59:00Z", transmitter_id: "${tx1_id}"}
              captures: {x8_fault_target: "$.data.error_id"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: LOSS_OF_SIGNAL, severity: CRITICAL, detected_utc: "2026-08-01T11:59:00Z", channel_id: "${ch1_id}"}
              captures: {x8_fault_needs_tx: "$.data.error_id"}
            - call: "POST /spot-orders"
              as: TrafficCoordinator
              payload: {channel_id: "${ch2_id}", advertiser_name: "Subchannel Motors", order_reference: "ORD-2026-0099", ordered_spots: 2, unit_duration_seconds: 30, rate_cents_total: 100000, daypart: PRIME, priority_class: PREEMPTIBLE, makegood_deadline_utc: "2026-08-02T23:00:00Z"}
              captures: {x8_ord2: "$.data.id"}
            - call: "POST /playlists"
              as: TrafficCoordinator
              payload:
                channel_id: "${ch1_id}"
                broadcast_day: "2026-08-04"
                schedule_start_utc: "2026-08-04T12:00:00Z"
                items:
                  - {sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-04T12:00:00Z", scheduled_duration_seconds: 1800, max_trim_seconds: 0}
                  - {sequence_number: 2, element_kind: COMMERCIAL, asset_id: "${aspot_id}", spot_order_id: "${x8_ord2}", scheduled_start_utc: "2026-08-04T12:30:00Z", scheduled_duration_seconds: 30, max_trim_seconds: 0}
              captures: {x8_order_mismatch: "$.data.error_id"}
            - call: "POST /network-feed-windows"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", feed_source: NETWORK_PRIMARY, anchor_sequence_number: 99, join_utc: "2026-08-01T12:31:00Z", breakaway_utc: "2026-08-01T12:36:00Z", backtiming_mode: PAD_TO_JOIN, guard_seconds: 30}
              captures: {x8_anchor: "$.data.error_id"}
          assert:
            - "AUDIO_LOSS filed against a transmitter -> 409 ${x8_fault_target} == ERR_FAULT_TARGET_MISMATCH, and LOSS_OF_SIGNAL filed against a channel -> 409 ${x8_fault_needs_tx} == ERR_FAULT_TARGET_MISMATCH: the id is symmetric, the required target is dictated by the fault_code"
            - "placing a channel-12.2 order in a channel-12.1 playlist -> 409 ${x8_order_mismatch} == ERR_SPOT_ORDER_CHANNEL_MISMATCH, and the whole ingest is rejected (no partial playlist)"
            - "a feed window whose anchor_sequence_number names no item -> 409 ${x8_anchor} == ERR_ANCHOR_ITEM_NOT_FOUND, which is a 409 rather than the 404 ERR_PLAYLIST_ITEM_NOT_FOUND because the anchor is an ORDINAL within a playlist, not an id"
            - "REFERENTIAL CENSUS: ERR_ITEM_PLAYLIST_MISMATCH from a makegood whose target_playlist_id belongs to another channel, and from a substitution naming a replacement asset already placed as an unaired item in the same playlist hour; ERR_SEQUENCE_NUMBER_CONFLICT from a revision or makegood whose sequence_numbers duplicate or leave a hole in the dense 1..N run"
            - "INVENTORY AND PREEMPTION CENSUS: ERR_COMMERCIAL_INVENTORY_EXCEEDED when a clock hour's commercial seconds pass 960 (960 accepted, 961 refused, and the bucketing is per CLOCK hour, not per playlist); ERR_NO_CREDITED_SPOT_TO_MAKEGOOD when a makegood is placed against an order with no credited spot to restore; ERR_ORDER_NOT_PREEMPTIBLE when an override or overrun would preempt a GUARANTEED order, which only force_preempt_guaranteed: true overrides (and which then credits the spot in full)"
            - "ARITHMETIC CENSUS: ERR_BITRATE_FLOOR_UNSATISFIABLE when the SUM of the floors on a multiplex exceeds effective_capacity_kbps (a sum exactly equal is accepted and every channel receives exactly its floor); ERR_MULTIPLEX_CAPACITY_EXCEEDED when a PIN or an admitted allocation pushes the assigned total over the same capacity — same inequality, different id, distinguished by whether the caller supplied a floor or a pin"
            - "SHAPE CENSUS COMPLETION: ERR_PLAYLIST_EMPTY_INGEST for items == [] (422, and it precedes the 409 ERR_PLAYLIST_NO_PROGRAM_CONTENT which fires only for a non-empty list with no PROGRAM element); ERR_FILING_DETAILS_REQUIRED for a blank filed_reference or narrative; ERR_SUBSTITUTE_RESOLUTION_MISMATCH for a replacement of the wrong delivered_resolution_class OR outside the max_trim window; ERR_TRIM_EXCEEDS_MAX for a requested trim above max_trim_seconds, including any trim of a COMMERCIAL"
            - "ALL 96 ids are now reachable: 7 auth + 3 shape + 13 not-found + 3 occ + 9 invalid-state + 8 air-safety + 11 authority/waiver + 13 temporal + 5 air-window + 9 uniqueness/parentage/bitrate + 15 referential/inventory/arithmetic = 96, with ERR_MISSING_AUTH_HEADERS and ERR_UNKNOWN_ROLE reachable only through malformed headers rather than through any well-formed request body"

  # ===========================================================================
  # RBAC — 7 roles x 59 endpoints. StationAdmin appears on all 59; the other six
  # own 16 exclusive write endpoints between them (BroadcastEngineer 7,
  # MasterControlOperator 4, TrafficCoordinator 3, QCTechnician 1,
  # ProgramDirector 1, ComplianceOfficer 1) plus the 2 operator endpoints that
  # are StationAdmin-only. 4 role_classes back 4 roles; 3 roles are opaque.
  # ===========================================================================
  - section: rbac
    instances:

      # -- R1 -------------------------------------------------------------
      - name: station_admin_is_a_strict_superset_of_all_59_endpoints_but_bypasses_no_business_rule
        claim_type: Correct Result
        grounds: "§1.5 the roles list of every endpoint: StationAdmin appears on all 59, and POST /operators and POST /operators/{id}/status name StationAdmin ALONE; §1.6 role table; §1.4 priorities 5, 25, 26, 54 and 62"
        distinguishing_aspect: "StationAdmin is the only role whose permission set is the whole API, which makes it the natural place to test that RBAC and business rules are INDEPENDENT layers: the superset role must still be refused by every posture, starvation, capacity, state and role_class rule, and — the sharpest part — it must still name OTHER people's operator ids in body fields, because StationAdmin has no Operator row and therefore no role_class of its own. So StationAdmin can call POST /emergency-overrides/{id}/activate (permission) but cannot be the authorizer (identity), can call POST /assets/{id}/qc-reports but cannot be the inspector, and can call POST /assets/{id}/qc-waivers but cannot be the waiver-holder. Conversely it is the ONLY role that can mint or suspend operators, so the entire identity substrate of rules 3, 6 and 7 is reachable only through it."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /operators"
              as: StationAdmin
              payload: {full_name: "Gil Payne", role_class: PROGRAM_DIRECTOR, override_authority: FULL, certification_expires_utc: "2026-12-31T00:00:00Z"}
              captures: {r1_op_id: "$.data.id"}
            - call: "POST /operators"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {full_name: "Imposter", role_class: QC, override_authority: NONE, certification_expires_utc: "2026-12-31T00:00:00Z"}
              captures: {r1_denied_create: "$.data.error_id"}
            - call: "POST /operators/${r1_op_id}/status"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {status: SUSPENDED}
              captures: {r1_denied_status: "$.data.error_id"}
            - call: "POST /channels/${ch2_id}/air-state"
              as: StationAdmin
              payload: {target_air_status: BARS_AND_TONE, reason: "ADMIN_INTERVENTION"}
              captures: {r1_admin_air: "$.data.air_status"}
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: StationAdmin
              payload: {expected_asset_version: "${apromo_v2}", inspected_by_operator_id: "${op_qc_id}", basis: AIR_CHECK, defect_codes: [], measured_duration_seconds: 60}
              captures: {r1_admin_qc: "$.data.id"}
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: StationAdmin
              payload: {expected_asset_version: "${apromo_v2}", inspected_by_operator_id: "${op_eng_id}", basis: AIR_CHECK, defect_codes: [], measured_duration_seconds: 60}
              captures: {r1_admin_roleclass: "$.data.error_id"}
          assert:
            - "StationAdmin creates operators (${r1_op_id}) and is the ONLY role that can: ${r1_denied_create} == ERR_ROLE_NOT_PERMITTED for ProgramDirector and ${r1_denied_status} == ERR_ROLE_NOT_PERMITTED for BroadcastEngineer on the status endpoint"
            - "StationAdmin exercises another role's exclusive write without impersonating it: ${r1_admin_air} == BARS_AND_TONE on an endpoint whose only other role is MasterControlOperator, and no X-User-ID is required because StationAdmin is an opaque role"
            - "StationAdmin can file a QC report (${r1_admin_qc}) only by naming a QC-class inspector; naming the ENGINEER instead -> 409 ${r1_admin_roleclass} == ERR_OPERATOR_ROLE_CLASS_INVALID — permission and identity are independent layers"
            - "StationAdmin bypasses NO business rule: on a SUSPENDED-posture channel it still gets ERR_CHANNEL_SUSPENDED_POSTURE, on a STARVED channel ERR_CHANNEL_ALLOCATION_STARVED, over capacity ERR_MULTIPLEX_CAPACITY_EXCEEDED, on a stale token ERR_STALE_MULTIPLEX_VERSION and on an illegal transition the entity's own 409"
            - "StationAdmin cannot satisfy rules 3, 6 or 7 for itself and cannot be suspended: there is no Operator row for it, so no request can ever return ERR_ROLE_IDENTITY_MISMATCH, ERR_OPERATOR_SUSPENDED or ERR_OPERATOR_CERTIFICATION_EXPIRED for a StationAdmin caller"
            - "the superset is exact, not approximate: for every one of the 59 endpoints there exists a StationAdmin request that returns something other than ERR_ROLE_NOT_PERMITTED"

      # -- R2 -------------------------------------------------------------
      - name: broadcast_engineer_owns_the_rf_and_capacity_plane_and_is_locked_out_of_content
        claim_type: Correct Result
        grounds: "§1.5 the 7 endpoints whose only non-admin role is BroadcastEngineer (POST /transmitters, POST /transmitters/{id}/power-state, POST /multiplexes, POST /multiplexes/{id}/rebalance, POST /channels, PATCH /channels/{id}/allocation) plus its 21-endpoint total surface; §1.1 Operator.role_class ENGINEER"
        distinguishing_aspect: "BroadcastEngineer is the only role that can change PHYSICS (power, capacity, allocation) and one of the narrowest at 21 of 59 endpoints, which produces the domain's most interesting privilege inversion: an engineer can DARKEN the whole station by taking a transmitter OFF_AIR — cascading every channel to DARK, every on-air playlist to SUSPENDED_AIR and creating a regulatory notification — yet cannot take a single channel to air, cannot cue an element, cannot ingest a playlist, cannot QC an asset and cannot read the reconciliation view. So the role with the largest blast radius has no content authority at all, and every one of its writes must be reachable without ever touching an asset, a playlist or an order."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /multiplexes"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {transmitter_id: "${tx1_id}", name: "MUX-D", total_capacity_kbps: 12000, pilot_reserved_kbps: 500, live_encoder_units_total: 2}
              captures: {r2_mux: "$.data.id"}
            - call: "POST /channels/${ch1_id}/air-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_air_status: DARK, reason: "ENGINEER_ATTEMPT"}
              captures: {r2_denied_air: "$.data.error_id"}
            - call: "POST /playlist-items/${it1_id}/playout-events"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {event_kind: CUE, event_utc: "2026-08-01T11:59:00Z", source: OPERATOR}
              captures: {r2_denied_cue: "$.data.error_id"}
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_asset_version: "${apromo_v2}", inspected_by_operator_id: "${op_qc_id}", basis: AIR_CHECK, defect_codes: [], measured_duration_seconds: 60}
              captures: {r2_denied_qc: "$.data.error_id"}
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {basis: FINAL}
              captures: {r2_denied_recon: "$.data.error_id"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: OFF_AIR, reason: "TOTAL_POWER_LOSS"}
              captures: {r2_off: "$.data.operational_state"}
            - call: "GET /channels/${ch1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: {r2_ch_air: "$.data.air_status"}
          assert:
            - "the engineer creates capacity freely (${r2_mux}) and rebalances, pins and re-ranks every channel on it"
            - "the engineer is denied the entire content plane: ${r2_denied_air} == ${r2_denied_cue} == ${r2_denied_qc} == ${r2_denied_recon} == ERR_ROLE_NOT_PERMITTED (air-state, playout events, QC reports and the reconciliation read)"
            - "yet the engineer can dark the station: ${r2_off} == OFF_AIR drives ${r2_ch_air} == DARK on a channel it is not allowed to touch directly, plus the on-air playlist to SUSPENDED_AIR and an outage epoch that later becomes a regulatory notification"
            - "the privilege inversion must be asserted in both directions: the role that can cause the cascade cannot undo its content consequences (returning the channel to ON_AIR needs MasterControlOperator, re-arming the playlist needs MasterControlOperator or ProgramDirector, and filing the resulting notification needs ComplianceOfficer)"
            - "the engineer's reads are broader than its writes: GET on transmitters, multiplexes, channels, feed windows, faults and operators are permitted, while GET /assets, GET /qc-reports, GET /playlists/{id} and GET /spot-orders are NOT in its 21-endpoint surface"
            - "an ENGINEER-class operator can never be named in an inspected_by, waived_by, requested_by or authorized_by field: every such attempt is ERR_OPERATOR_ROLE_CLASS_INVALID"

      # -- R3 -------------------------------------------------------------
      - name: master_control_owns_the_air_chain_but_is_the_only_content_role_denied_the_money_view
        claim_type: Correct Result
        grounds: "§1.5 the 4 endpoints whose only non-admin role is MasterControlOperator (POST /channels/{id}/air-state, POST /playlist-items/{id}/playout-events, POST /network-feed-windows/{id}/join, POST /network-feed-windows/{id}/breakaway), its 38-endpoint surface (the largest after StationAdmin), and the role lists that EXCLUDE it: GET /playlists/{id}/reconciliation [TrafficCoordinator, ProgramDirector, StationAdmin, ComplianceOfficer] and GET /transmitters/{id}/notifications [ComplianceOfficer, BroadcastEngineer, StationAdmin]"
        distinguishing_aspect: "MasterControlOperator writes every row that MONEY is computed from — the as-run log, the preemptions, the short airs — and is then forbidden to see the money: it is the only content role excluded from GET /playlists/{id}/reconciliation, and it is also excluded from the regulatory notification list even though its own air decisions create outages. That is segregation of duties expressed purely through role lists, and it means a correct implementation cannot 'helpfully' widen either read. On the write side MCO is the only role that can move an element through the playout machine at all, so every AsRunEntry in the system is attributable to MCO or StationAdmin, which is what makes the as_run log's authorship checkable."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /playlist-items/${it1_id}/playout-events"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {event_kind: CUE, event_utc: "2026-08-01T11:59:00Z", source: OPERATOR}
              captures: {r3_cue: "$.data.event_kind"}
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {r3_denied_recon: "$.data.error_id"}
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {r3_denied_ntf: "$.data.error_id"}
            - call: "POST /playlists"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch2_id}", broadcast_day: "2026-08-05", schedule_start_utc: "2026-08-05T12:00:00Z", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-05T12:00:00Z", scheduled_duration_seconds: 1800, max_trim_seconds: 0}]}
              captures: {r3_denied_ingest: "$.data.error_id"}
            - call: "POST /assets/${apromo_id}/qc-waivers"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {waived_by_operator_id: "${op_pd_id}", waiver_justification: "Operational necessity for the top of hour."}
              captures: {r3_denied_waiver: "$.data.error_id"}
            - call: "GET /spot-orders/${ord1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: {r3_order_read: "$.data.status"}
          assert:
            - "MCO drives the air chain: ${r3_cue} == CUE, and the same role owns air-state, join and breakaway — the only writes that can move a channel to ON_AIR or an element to PLAYING"
            - "MCO is denied the money view (${r3_denied_recon} == ERR_ROLE_NOT_PERMITTED) and the notification list (${r3_denied_ntf} == ERR_ROLE_NOT_PERMITTED) even though its own writes are what those views summarise"
            - "MCO can still READ the orders it credits (${r3_order_read} is returned by GET /spot-orders/{id}, where MCO IS listed) — the exclusion is specific to the reconciliation projection, not to the order entity"
            - "MCO cannot ingest or revise a playlist (${r3_denied_ingest} == ERR_ROLE_NOT_PERMITTED) and cannot waive QC (${r3_denied_waiver} == ERR_ROLE_NOT_PERMITTED) even when it names a legitimate PROGRAM_DIRECTOR as the waiver-holder — permission is checked before the body"
            - "every AsRunEntry in the system is authored by MasterControlOperator or StationAdmin, which makes authorship an assertable invariant of the as-run log"
            - "MCO shares the override plane with ProgramDirector (create, activate, release) but only up to its own override_authority: a CRAWL_AND_CUTIN operator cannot authorize FULL_TAKEOVER, so the role list is necessary but not sufficient"

      # -- R4 -------------------------------------------------------------
      - name: traffic_owns_ingest_and_orders_and_can_still_trigger_an_air_cascade_through_the_clock
        claim_type: Correct Result
        grounds: "§1.5 the 3 endpoints whose only non-admin role is TrafficCoordinator (POST /playlists, POST /playlists/{id}/traffic-revisions, POST /spot-orders), its 24-endpoint surface, the role lists that exclude it (GET /technical-faults [MasterControlOperator, BroadcastEngineer, StationAdmin, ComplianceOfficer, QCTechnician], every /air-state and /playout-events endpoint) and POST /_clock/set_current_utc (all 7 roles)"
        distinguishing_aspect: "TrafficCoordinator is the commercial plane: it mints orders, ingests the day, revises it and places makegoods, but it may not touch air and may not even LOOK at the technical faults that preempt its spots. The corner is the clock: because POST /_clock/set_current_utc is open to all 7 roles, a TrafficCoordinator can advance time and thereby cause an asset expiry (checkpoint c) that BLOCKS items, a fault auto-clear (checkpoint d) that changes a channel's posture, and an overdue notification (checkpoint b) it cannot read — three effects on planes it has no direct write access to. Any implementation that gates the clock by role, or that runs the sweeps under the caller's permissions, produces the wrong answer here."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, then ingest an asset for tomorrow that will never be delivered."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /spot-orders"
              as: TrafficCoordinator
              payload: {channel_id: "${ch1_id}", advertiser_name: "Riverbend Dental", order_reference: "ORD-2026-0002", ordered_spots: 2, unit_duration_seconds: 30, rate_cents_total: 60000, daypart: PRIME, priority_class: PREEMPTIBLE, makegood_deadline_utc: "2026-08-02T23:00:00Z"}
              captures: {r4_ord: "$.data.id"}
            - call: "POST /channels/${ch1_id}/air-state"
              as: TrafficCoordinator
              payload: {target_air_status: DARK, reason: "TRAFFIC_ATTEMPT"}
              captures: {r4_denied_air: "$.data.error_id"}
            - call: "GET /technical-faults"
              as: TrafficCoordinator
              payload: {channel_id: "${ch1_id}"}
              captures: {r4_denied_faults: "$.data.error_id"}
            - call: "POST /assets"
              as: TrafficCoordinator
              payload: {house_number: "HN-NEVER-01", title: "Never Arrives", source: SATELLITE, expected_duration_seconds: 60, delivery_deadline_utc: "2026-08-01T12:00:00Z", required_resolution_class: HD_1080I, captions_required: false}
              captures: {r4_asset: "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              as: TrafficCoordinator
              payload: {current_utc: "2026-08-01T13:00:01Z"}
            - call: "GET /assets/${r4_asset}"
              as: TrafficCoordinator
              captures: {r4_asset_status: "$.data.status"}
          assert:
            - "TrafficCoordinator mints orders (${r4_ord}) and owns the only two playlist-authoring endpoints in the API"
            - "TrafficCoordinator is denied air (${r4_denied_air} == ERR_ROLE_NOT_PERMITTED) and is denied even READING the fault list (${r4_denied_faults} == ERR_ROLE_NOT_PERMITTED) although faults are what preempt its spots"
            - "the clock is open to it, and its advance performs sweeps on planes it cannot write: ${r4_asset_status} == EXPIRED via checkpoint (c), with the CASCADE B' clearance chain blocking any item that pointed at the asset"
            - "the sweeps run with SYSTEM authority, not the caller's: a TrafficCoordinator-triggered advance may auto-clear a MINOR fault and recompute a channel posture even though the same caller cannot read a fault or set an air state"
            - "TrafficCoordinator may place makegoods (shared with ProgramDirector and StationAdmin) and retract assets (shared with ProgramDirector), so its exclusive set is exactly the three authoring endpoints and nothing else"
            - "TrafficCoordinator is an OPAQUE role: it carries no Operator row, so it can never be named as inspected_by, waived_by, requested_by or authorized_by, and it can never be suspended or certification-expired"

      # -- R5 -------------------------------------------------------------
      - name: qc_technician_has_the_narrowest_surface_and_can_never_forgive_its_own_verdict
        claim_type: Correct Result
        grounds: "§1.5 POST /assets/{id}/qc-reports (only non-admin role QCTechnician) and the 14-endpoint QCTechnician surface; §1.5 POST /assets/{id}/qc-waivers (roles [ProgramDirector, StationAdmin]); §1.2 Asset QC_FAILED -> QC_WAIVED precondition ('X-User-ID != inspected_by_operator_id of the governing (newest non-superseded) QCReport (ERR_SELF_AUTHORIZATION_FORBIDDEN)'); §1.4 priority 62 (role_class of the referenced operator)"
        distinguishing_aspect: "QCTechnician touches only 14 of 59 endpoints, and the shape of that set is the point: it can CREATE the verdict that blocks the whole station's content but has no power to unblock it — the waiver belongs to ProgramDirector, the clearance flip is a side effect it cannot trigger, and it cannot even see the playlist-level consequences beyond the item list. The segregation is doubly enforced (role list AND the self-authorization precondition), which produces a structural curiosity worth asserting: because the inspector must be QC-class and the waiver-holder must be PROGRAM_DIRECTOR-class, the two ids can NEVER be equal, so ERR_SELF_AUTHORIZATION_FORBIDDEN is unreachable on the waiver path and reachable only on override activation, where both fields accept the same two role classes."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, then fail the promo asset with a QC report so a waiver becomes relevant."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${apromo_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [VIDEO_ARTIFACT, FORMAT_MISMATCH], measured_duration_seconds: 58}
              captures: {r5_qc_id: "$.data.id", r5_verdict: "$.data.verdict"}
            - call: "POST /assets/${apromo_id}/qc-waivers"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {waived_by_operator_id: "${op_qc_id}", waiver_justification: "I graded it and I forgive it entirely."}
              captures: {r5_denied_waiver: "$.data.error_id"}
            - call: "POST /channels/${ch2_id}/air-state"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {target_air_status: BARS_AND_TONE, reason: "QC_ATTEMPT"}
              captures: {r5_denied_air: "$.data.error_id"}
            - call: "POST /playlists/${pl1_id}/state"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {target_status: VALIDATED}
              captures: {r5_denied_state: "$.data.error_id"}
            - call: "GET /playlists/${pl1_id}/items"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {clearance_status: BLOCKED}
              captures: {r5_blocked_read: "$.data[0].id"}
            - call: "POST /assets/${apromo_id}/qc-waivers"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {waived_by_operator_id: "${op_pd_id}", waiver_justification: "Cleared for air by program management."}
              captures: {r5_waived: "$.data.status"}
          assert:
            - "QCTechnician authors the verdict (${r5_qc_id}) and the asset's derived ${r5_verdict} follows the score arithmetic, blocking every item that points at it"
            - "QCTechnician cannot waive: ${r5_denied_waiver} == ERR_ROLE_NOT_PERMITTED — the role list is checked before the self-authorization precondition, so the caller never learns which of the two rules would have stopped it"
            - "the same operator ONLY graded: ${r5_denied_air} == ${r5_denied_state} == ERR_ROLE_NOT_PERMITTED for air-state and playlist state — QC has no air or playlist authority at all"
            - "QCTechnician CAN observe the damage it caused: ${r5_blocked_read} is returned by GET /playlists/{id}/items?clearance_status=BLOCKED, one of the reads QC is listed on (alongside GET /playlist-items, GET /technical-faults and the asset / qc-report reads)"
            - "the ProgramDirector waiver succeeds where QC's failed: ${r5_waived} == QC_WAIVED, and the item clearance flips to CLEARED as a side effect QC could never trigger"
            - "ERR_SELF_AUTHORIZATION_FORBIDDEN is UNREACHABLE on the waiver path: rule 62 forces the inspector to be QC-class and the waiver-holder to be PROGRAM_DIRECTOR-class, so X-User-ID can never equal the governing report's inspected_by_operator_id; the id is reachable only through override activation, where requested_by and authorized_by draw from the SAME two role classes"
            - "QCTechnician's 14 endpoints include the clock (all roles) but no write outside the asset plane: assert that every one of the other 45 endpoints returns ERR_ROLE_NOT_PERMITTED for it"

      # -- R6 -------------------------------------------------------------
      - name: program_director_holds_the_forgiveness_powers_and_the_waiver_endpoint_declares_an_impossible_occ
        claim_type: Correct Result
        grounds: "§1.5 POST /assets/{id}/qc-waivers (only non-admin role ProgramDirector; input [waived_by_operator_id, waiver_justification] — NO expected_asset_version) versus §1.2 Asset QC_FAILED -> QC_WAIVED preconditions ('expected_asset_version matches Asset.version (ERR_STALE_ASSET_VERSION)' and 'Governing QCReport.defect_codes does not contain AUDIO_LOSS (ERR_CAPTION_REQUIREMENT_UNMET)'); §1.5 the 34-endpoint ProgramDirector surface (overrides, substitutions, makegoods, retractions, playlist state, reconciliation)"
        distinguishing_aspect: "ProgramDirector is the forgiveness role: it waives QC, retracts assets, authorizes FULL_TAKEOVER overrides, substitutes elements and places makegoods — every escape hatch in the domain. Its signature endpoint also carries the specification's sharpest internal contradiction: the QC_FAILED -> QC_WAIVED transition lists an expected_asset_version precondition, but POST /assets/{id}/qc-waivers declares NO such input, so the OCC check cannot be performed and ERR_STALE_ASSET_VERSION is unreachable on that path — an implementation must accept the two-field body as declared and must NOT require an undeclared version field. The same transition also mislabels its content rule: an AUDIO_LOSS defect is refused with ERR_CAPTION_REQUIREMENT_UNMET, an error id that mentions captions, so the mapping cannot be guessed from the id name."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, then fail the promo asset twice: once with a waivable defect set and once with AUDIO_LOSS."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${apromo_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [AUDIO_LOSS], measured_duration_seconds: 60}
              captures: {r6_audio_report: "$.data.id", r6_audio_score: "$.data.technical_score"}
            - call: "POST /assets/${apromo_id}/qc-waivers"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {waived_by_operator_id: "${op_pd_id}", waiver_justification: "Audio will be re-laid live in studio."}
              captures: {r6_audio_block: "$.data.error_id"}
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${apromo_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [VIDEO_ARTIFACT, FORMAT_MISMATCH], measured_duration_seconds: 60}
              captures: {r6_ok_report: "$.data.id"}
            - call: "POST /assets/${apromo_id}/qc-waivers"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {waived_by_operator_id: "${op_mco_id}", waiver_justification: "Approved for air by program management."}
              captures: {r6_waived: "$.data.status", r6_waived_by: "$.data.waived_by_operator_id"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 50, reason: "PD_ATTEMPT"}
              captures: {r6_denied_power: "$.data.error_id"}
          assert:
            - "an AUDIO_LOSS defect makes the asset unwaivable and the id is counter-intuitive: ${r6_audio_block} == ERR_CAPTION_REQUIREMENT_UNMET, NOT ERR_QC_WAIVER_SCORE_TOO_LOW and NOT a defect-specific id — even though ${r6_audio_score} may be well above 40"
            - "after a fresh governing report without AUDIO_LOSS the waiver succeeds: ${r6_waived} == QC_WAIVED and ${r6_waived_by} == ${op_pd_id}"
            - "the waiver body is exactly two fields: the request carries NO expected_asset_version and must still be accepted, so ERR_STALE_ASSET_VERSION is unreachable on this endpoint despite the transition's precondition list — requiring the undeclared field is a bug, and so is inventing a silent version check that rejects a concurrent report"
            - "the waiver is evaluated against the GOVERNING report only: the superseded AUDIO_LOSS report (${r6_audio_report}) no longer blocks anything once ${r6_ok_report} supersedes it, which is the only way the same asset can go from unwaivable to waivable with no re-delivery"
            - "the body field is NOT the source of truth: naming ${op_mco_id} as waived_by_operator_id still records ${r6_waived_by} == ${op_pd_id}, because the transition writes waived_by_operator_id = X-User-ID — a declared input that the side effect overwrites, so it can never be used to launder authority"
            - "ProgramDirector has no engineering authority: ${r6_denied_power} == ERR_ROLE_NOT_PERMITTED on the power endpoint, and the same holds for multiplex creation, rebalancing and channel allocation"
            - "ProgramDirector shares the override plane with MasterControlOperator but outranks it in AUTHORITY (FULL vs CRAWL_AND_CUTIN), so the pair (role list, override_authority) must both be checked — the role list alone is not sufficient and the authority alone is not sufficient"

      # -- R7 -------------------------------------------------------------
      - name: compliance_officer_is_read_only_across_28_endpoints_with_exactly_one_write_that_stops_a_clock_sweep
        claim_type: Correct Result
        grounds: "§1.5 POST /regulatory-notifications/{id}/file (only non-admin role ComplianceOfficer) and the 28-endpoint ComplianceOfficer read surface (as-run log, faults, outages, notifications, overrides, EAS, playlists, assets, channels, transmitters, multiplexes); §1.6 role table (ComplianceOfficer is not one of the four role_class values); §1.4 the OVERDUE sweep on notifications"
        distinguishing_aspect: "ComplianceOfficer is the auditor: the widest READ surface of any non-admin role (28 endpoints, including the as-run log and the reconciliation-adjacent order views' parents) but exactly ONE write in the entire API. That write is the only defence against a clock sweep — filing before the due instant is the difference between FILED and OVERDUE, and once OVERDUE the filing endpoint is still legal but the state does not rewind. It is also an opaque role: because role_class has no COMPLIANCE member, a ComplianceOfficer can never be named in any operator reference field, so it can neither inspect, waive, authorize an override, nor be the subject of a suspension — its identity exists only in the X-User-ID header and in filed_by attribution."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, raise a CRITICAL fault to mint an OUTAGE notification, then race the clock."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: LOSS_OF_SIGNAL, severity: CRITICAL, detected_utc: "2026-08-02T11:59:00Z", channel_id: "${ch1_id}"}
              captures: {r7_fault: "$.data.id", r7_sev: "$.data.severity"}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceOfficer
              payload: {current_utc: "2026-08-02T12:29:00Z"}
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: ComplianceOfficer
              payload: {kind: OUTAGE}
              captures: {r7_notif_id: "$.data[0].id", r7_status_before: "$.data[0].status", r7_due: "$.data[0].due_utc"}
            - call: "POST /regulatory-notifications/${r7_notif_id}/file"
              as: ComplianceOfficer
              payload: {filed_reference: "FCC-EFR-2026-08-02-0001", narrative: "Loss of signal on primary program channel; backup path engaged within the reporting window."}
              captures: {r7_status_after: "$.data.status", r7_filed: "$.data.filed_utc"}
            - call: "POST /technical-faults/${r7_fault}/state"
              as: ComplianceOfficer
              payload: {target_state: MITIGATED, mitigation_code: SWITCH_TO_BACKUP}
              captures: {r7_denied_mitigate: "$.data.error_id"}
            - call: "POST /assets/${apromo_id}/qc-waivers"
              as: ComplianceOfficer
              payload: {waived_by_operator_id: "${op_pd_id}", waiver_justification: "Compliance approves this promotional element."}
              captures: {r7_denied_waiver: "$.data.error_id"}
          assert:
            - "the CRITICAL fault (${r7_sev} == CRITICAL) mints the OUTAGE notification the auditor must file; ComplianceOfficer can READ it (${r7_notif_id}, ${r7_status_before} == PENDING) although it did not create it and cannot create one"
            - "ComplianceOfficer may set the logical clock — POST /_clock/set_current_utc lists all 7 roles — so the auditor can move itself closer to its own deadline; assert 12:29 is still before or equal to ${r7_due} (11:59 + 30 min == 12:29:00Z, inclusive) and the notification is therefore still ${r7_status_before} == PENDING"
            - "the single write succeeds: ${r7_status_after} == FILED with ${r7_filed} == the logical clock instant, and the OVERDUE sweep can no longer touch it on any later advance"
            - "everything else is denied: ${r7_denied_mitigate} == ${r7_denied_waiver} == ERR_ROLE_NOT_PERMITTED — the fault-state attempt is a perfectly well-formed MITIGATED transition and the waiver names a legitimate PROGRAM_DIRECTOR operator, yet both die on the role list, which is checked before every reference and state rule"
            - "ComplianceOfficer is OPAQUE: role_class ∈ {MASTER_CONTROL, QC, PROGRAM_DIRECTOR, ENGINEER} has no compliance member, so no Operator row can represent one; ${op_comp_id} does not exist as an entity and the role carries no X-User-ID at all, which is why it can never appear in inspected_by_operator_id, waived_by_operator_id, authorized_by_operator_id or requested_by_operator_id"
            - "the read set is asserted exhaustively: GET /transmitters/{id}/notifications, GET /regulatory-notifications/{id}, GET /playlists/{id}/as-run, GET /playlists/{id}/reconciliation, GET /qc-reports, GET /technical-faults, GET /emergency-overrides and the single-resource reads all resolve for ComplianceOfficer, while every POST except /regulatory-notifications/{id}/file and /_clock/set_current_utc returns ERR_ROLE_NOT_PERMITTED"

      # -- R8 -------------------------------------------------------------
      - name: three_roles_are_header_only_identities_so_the_operator_lifecycle_rules_are_structurally_inapplicable_to_them
        claim_type: Correct Result
        grounds: "§1.1 Operator.role_class enum (MASTER_CONTROL | QC | PROGRAM_DIRECTOR | ENGINEER — four values for seven roles); §1.4 priorities 3, 4, 6, 7 (operator existence, SUSPENDED, certification expiry, role_class match); §1.5 POST /operators and POST /operators/{id}/status (StationAdmin only); §1.6 the seven-role table"
        distinguishing_aspect: "Seven roles map onto only four role_class values, so TrafficCoordinator, ComplianceOfficer and StationAdmin are HEADER-ONLY identities: no Operator row can ever carry their role, therefore rules 3/4/6/7 (unknown operator, suspended operator, expired certification, role_class mismatch) are structurally inapplicable to them. This produces the sharpest authority asymmetry in the domain: a MasterControlOperator can be locked out of its own endpoints by a certification lapse it cannot fix, while a TrafficCoordinator holding the identical X-User-ID guarantees can never be suspended, never expire, and never be refused for anything except the role list. Conversely those three roles can never be NAMED in a body field, so StationAdmin — which can call all 59 endpoints — cannot satisfy any rule that requires it to name itself."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, then suspend the MCO and try the same air write under two different identities."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /operators"
              as: StationAdmin
              payload: {full_name: "Traffic Desk Two", role_class: TRAFFIC, override_authority: NONE, certification_expires_utc: "2027-01-01T00:00:00Z"}
              captures: {r8_bad_class: "$.data.error_id"}
            - call: "POST /operators/${op_mco_id}/status"
              as: StationAdmin
              payload: {status: SUSPENDED}
              captures: {r8_susp: "$.data.status", r8_susp_v: "$.data.version"}
            - call: "POST /playlist-items/${pl1_item5_id}/playout-events"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {event_kind: CUE, event_utc: "2026-08-02T12:29:00Z", source: AUTOMATION}
              captures: {r8_susp_denied: "$.data.error_id"}
            - call: "POST /playlists"
              as: TrafficCoordinator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", broadcast_day: "2026-08-03", schedule_start_utc: "2026-08-03T12:00:00Z", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-03T12:00:00Z", scheduled_duration_seconds: 1800}]}
              captures: {r8_traffic_ok: "$.data.id"}
            - call: "POST /channels/${ch1_id}/air-state"
              as: StationAdmin
              payload: {target_air_status: BARS_AND_TONE, reason: "Admin intervention during investigation."}
              captures: {r8_admin_air: "$.data.air_status"}
            - call: "POST /emergency-overrides/${ovr_id}/activate"
              as: StationAdmin
              payload: {authorized_by_operator_id: "${op_mco_id}", override_mode: CRAWL}
              captures: {r8_admin_override: "$.data.error_id"}
          assert:
            - "role_class rejects the three header-only roles at creation: ${r8_bad_class} == ERR_INVALID_ENUM_VALUE for TRAFFIC (and identically for COMPLIANCE and ADMIN) — the enum has exactly four members and no Operator row can represent a TrafficCoordinator, ComplianceOfficer or StationAdmin"
            - "suspension bites the entity-backed role: ${r8_susp} == SUSPENDED (POST /operators/{id}/status is a three-optional-field patch with NO version token, so this is a last-writer-wins mutation) and the MCO's next air write is ${r8_susp_denied} == ERR_OPERATOR_SUSPENDED (403, priority 4) — evaluated BEFORE any air-safety or state check"
            - "the same suspended uuid presented under a header-only role is unaffected: the TrafficCoordinator playlist create succeeds (${r8_traffic_ok}) even though X-User-ID is the suspended operator's id, because rules 3/4/6/7 never run for a role with no role_class — assert this is not a leak but the direct consequence of the enum"
            - "StationAdmin needs no X-User-ID at all and still performs the air write (${r8_admin_air} == BARS_AND_TONE), which is the escalation path when every content role is suspended or expired"
            - "but StationAdmin cannot name ITSELF: ${r8_admin_override} is a refusal on the REFERENCED operator (ERR_OPERATOR_SUSPENDED for the suspended MCO, or ERR_OPERATOR_ROLE_CLASS_INVALID for a QC or ENGINEER authorizer, since §1.4 priority 62 admits only PROGRAM_DIRECTOR or MASTER_CONTROL), and there is no admin operator row to substitute — every rule demanding a named authorizer forces StationAdmin to depend on a healthy entity-backed operator"
            - "the RBAC matrix therefore has two kinds of cell: 4 roles × (role list AND lifecycle rules) versus 3 roles × (role list ONLY); enumerate all 7 × 59 = 413 cells and assert exactly 218 permitted cells (StationAdmin 59 + MCO 38 + ProgramDirector 34 + Compliance 28 + Traffic 24 + Engineer 21 + QC 14 == 218) and 195 refused cells returning ERR_ROLE_NOT_PERMITTED"
  # =====================================================================
  # CROSS-CUTTING LAYERS
  # One instance per §1.2.1 optimistic-concurrency rule, plus the
  # token-free mutators, the end-to-end cascade, the two envelopes, the
  # governing-report selector and the full priority ladder.
  # TRUE TOKEN CENSUS — 6 OCC rules over only 3 token fields:
  #   expected_playlist_version  -> POST /playlists/{id}/traffic-revisions
  #                                 POST /spot-orders/{id}/makegoods
  #   expected_multiplex_version -> POST /channels
  #                                 PATCH /channels/{id}/allocation
  #                                 POST /multiplexes/{id}/rebalance
  #   expected_asset_version     -> POST /assets/{id}/qc-reports
  # Every OTHER mutating endpoint (air-state, playlist state, playout
  # events, substitute, delivery, retract, waiver, fault state, power
  # state, operator status, override create/activate/release, feed join
  # and breakaway) carries NO token at all — see L5.
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      # -- L1 -------------------------------------------------------------
      - name: playlist_revision_occ_counts_the_parent_once_per_call_no_matter_how_many_children_it_rewrites
        claim_type: Correct Result
        grounds: "§1.2.1 rule playlist-revision-stale-playlist (parent Playlist, POST /playlists/{id}/traffic-revisions, expected_playlist_version, ERR_STALE_PLAYLIST_VERSION 412, 'a revision legitimately supersedes every SCHEDULED item of the prior revision'); §1.5 input [expected_playlist_version, items, removed_sequence_numbers?]; §1.4 OCC precedes state and content validation"
        distinguishing_aspect: "A revision may replace the entire item set, yet the version increments by exactly ONE and the token names the PLAYLIST, never an item. This is the pure test of 'parent-scoped token, batch-scoped effect': two concurrent revisions that touch disjoint sequence numbers must STILL collide, because the guard is the parent counter. It also pins the ordering of the 412 against the 409 and the 422 in a call that would fail all three, and pins that a REJECTED revision must not advance the counter."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, then build a second, IMPORTED playlist for the next broadcast day so revisions are legal."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /playlists"
              as: TrafficCoordinator
              payload: {channel_id: "${ch1_id}", broadcast_day: "2026-08-03", schedule_start_utc: "2026-08-03T12:00:00Z", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-03T12:00:00Z", scheduled_duration_seconds: 1800}]}
              captures: {l1_pl: "$.data.id", l1_v1: "$.data.version", l1_status: "$.data.status"}
            - call: "POST /playlists/${l1_pl}/traffic-revisions"
              as: TrafficCoordinator
              payload: {expected_playlist_version: "${l1_v1}", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-03T12:00:00Z", scheduled_duration_seconds: 1800}, {sequence_number: 2, element_kind: COMMERCIAL, asset_id: "${aspot_id}", scheduled_start_utc: "2026-08-03T12:30:00Z", scheduled_duration_seconds: 30}, {sequence_number: 3, element_kind: PROMO, asset_id: "${apromo_id}", scheduled_start_utc: "2026-08-03T12:30:30Z", scheduled_duration_seconds: 60}]}
              captures: {l1_v2: "$.data.version", l1_count: "$.data.item_count", l1_rev: "$.data.traffic_revision"}
            - call: "POST /playlists/${l1_pl}/traffic-revisions"
              as: TrafficCoordinator
              payload: {expected_playlist_version: "${l1_v1}", items: [{sequence_number: 3, element_kind: PROMO, asset_id: "${apromo_id}", scheduled_start_utc: "2026-08-03T12:30:30Z", scheduled_duration_seconds: 60}]}
              captures: {l1_stale: "$.data.error_id"}
            - call: "POST /playlists/${l1_pl}/traffic-revisions"
              as: TrafficCoordinator
              payload: {expected_playlist_version: "${l1_v2}", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-03T12:00:00Z", scheduled_duration_seconds: 1800}, {sequence_number: 2, element_kind: COMMERCIAL, asset_id: "${aspot_id}", scheduled_start_utc: "2026-08-03T12:29:00Z", scheduled_duration_seconds: 30}]}
              captures: {l1_gap: "$.data.error_id"}
            - call: "GET /playlists/${l1_pl}"
              as: TrafficCoordinator
              payload: {}
              captures: {l1_v3: "$.data.version", l1_rev2: "$.data.traffic_revision", l1_count2: "$.data.item_count"}
            - call: "POST /playlists/${l1_pl}/traffic-revisions"
              as: TrafficCoordinator
              payload: {expected_playlist_version: "${l1_v3}", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-03T12:00:00Z", scheduled_duration_seconds: 3600}], removed_sequence_numbers: [2, 3]}
              captures: {l1_v4: "$.data.version", l1_count3: "$.data.item_count"}
          assert:
            - "the playlist is born IMPORTED (${l1_status} == IMPORTED — there is no DRAFT state in this domain) at version ${l1_v1}"
            - "three items in one revision is ONE version bump: ${l1_v2} == ${l1_v1} + 1, ${l1_count} == 3 and ${l1_rev} == 2 — the parent counter is call-scoped, never item-scoped, and traffic_revision and version advance in lockstep here but are NOT the same number"
            - "the disjoint concurrent revision still collides: ${l1_stale} == ERR_STALE_PLAYLIST_VERSION (412) even though it names only sequence_number 3 — ANY prior successful revision invalidates ANY held token, because a revision supersedes the whole SCHEDULED set"
            - "a REJECTED revision must not advance the counter: the gap-producing revision fails with ${l1_gap} == ERR_SCHEDULE_GAP_DETECTED and ${l1_v3} == ${l1_v2}, ${l1_rev2} == ${l1_rev}, ${l1_count2} == 3 — otherwise a client's token would die for a write that never happened"
            - "removed_sequence_numbers is part of the same atomic revision: ${l1_v4} == ${l1_v3} + 1 and ${l1_count3} == 1 in a single call, not one bump per removal"
            - "the successful response is the PLAYLIST (with the new version and counters), not the item list — a client must re-read GET /playlists/{id}/items to see the children, and the items carry their own independent identities"

      # -- L2 -------------------------------------------------------------
      - name: the_makegood_token_names_a_playlist_while_the_path_names_a_spot_order
        claim_type: Correct Result
        grounds: "§1.2.1 rule makegood-placement-stale-playlist (parent Playlist, write endpoint POST /spot-orders/{id}/makegoods, occ_field expected_playlist_version, 'makegood placement is position-sensitive so a stale view would place the spot against a schedule that no longer exists'); §1.5 input [target_playlist_id, expected_playlist_version, sequence_number, scheduled_start_utc, scheduled_duration_seconds?] returning PlaylistItem 201"
        distinguishing_aspect: "This is the only write in the domain whose PATH entity, TOKEN entity and RESPONSE entity are three different things: the path is a SpotOrder, the token guards the target Playlist, and the body returns a PlaylistItem. Every naive implementation guards the wrong row — bumping or checking SpotOrder.version instead of Playlist.version — and that mistake is invisible unless the test places two makegoods from two different orders into the same playlist and shows that they serialise, while two makegoods from the SAME order into two different playlists do not."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig, then build a fresh IMPORTED playlist as the makegood target."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /spot-orders"
              as: TrafficCoordinator
              payload: {channel_id: "${ch1_id}", advertiser_name: "Northgate Motors", order_reference: "NG-2026-08-002", ordered_spots: 2, unit_duration_seconds: 30, rate_cents_total: 200000, daypart: PRIME, priority_class: GUARANTEED, makegood_deadline_utc: "2026-08-09T23:59:59Z"}
              captures: {l2_ord2: "$.data.id"}
            - call: "POST /playlists"
              as: TrafficCoordinator
              payload: {channel_id: "${ch1_id}", broadcast_day: "2026-08-04", schedule_start_utc: "2026-08-04T12:00:00Z", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-04T12:00:00Z", scheduled_duration_seconds: 1800}]}
              captures: {l2_pl: "$.data.id", l2_pl_v1: "$.data.version"}
            - call: "POST /spot-orders/${ord1_id}/makegoods"
              as: TrafficCoordinator
              payload: {target_playlist_id: "${l2_pl}", expected_playlist_version: "${l2_pl_v1}", sequence_number: 2, scheduled_start_utc: "2026-08-04T12:30:00Z", scheduled_duration_seconds: 30}
              captures: {l2_mg1: "$.data.id", l2_mg1_flag: "$.data.is_makegood", l2_mg1_seq: "$.data.sequence_number"}
            - call: "POST /spot-orders/${l2_ord2}/makegoods"
              as: TrafficCoordinator
              payload: {target_playlist_id: "${l2_pl}", expected_playlist_version: "${l2_pl_v1}", sequence_number: 3, scheduled_start_utc: "2026-08-04T12:30:30Z", scheduled_duration_seconds: 30}
              captures: {l2_cross_order_stale: "$.data.error_id"}
            - call: "GET /playlists/${l2_pl}"
              as: TrafficCoordinator
              payload: {}
              captures: {l2_pl_v2: "$.data.version", l2_pl_count: "$.data.item_count"}
            - call: "POST /spot-orders/${l2_ord2}/makegoods"
              as: TrafficCoordinator
              payload: {target_playlist_id: "${l2_pl}", expected_playlist_version: "${l2_pl_v2}", sequence_number: 3, scheduled_start_utc: "2026-08-04T12:30:30Z", scheduled_duration_seconds: 30}
              captures: {l2_mg2: "$.data.id", l2_mg2_flag: "$.data.is_makegood"}
            - call: "POST /spot-orders/${ord1_id}/makegoods"
              as: TrafficCoordinator
              payload: {target_playlist_id: "${l1_pl}", expected_playlist_version: "${l2_pl_v1}", sequence_number: 4, scheduled_start_utc: "2026-08-03T12:45:00Z", scheduled_duration_seconds: 30}
              captures: {l2_wrong_parent: "$.data.error_id"}
          assert:
            - "the first makegood succeeds and returns a PlaylistItem, not a SpotOrder: ${l2_mg1_flag} == true and ${l2_mg1_seq} == 2, while the path named ${ord1_id}"
            - "CROSS-ORDER SERIALISATION: the second makegood, from a COMPLETELY DIFFERENT spot order, fails with ${l2_cross_order_stale} == ERR_STALE_PLAYLIST_VERSION (412) because the shared TARGET PLAYLIST advanced — an implementation guarding SpotOrder.version passes every single-order test and fails exactly here"
            - "the playlist counter is what moved: ${l2_pl_v2} == ${l2_pl_v1} + 1 and ${l2_pl_count} == 2 after ONE makegood; the two SpotOrders' own versions are irrelevant to the guard"
            - "re-reading and retrying with the fresh token succeeds: ${l2_mg2} exists with ${l2_mg2_flag} == true, so the 412 was a genuine staleness signal and not a permanent refusal"
            - "the token must belong to the TARGET playlist named in the body, not to any playlist: presenting ${l2_pl_v1} while targeting ${l1_pl} yields ${l2_wrong_parent} == ERR_STALE_PLAYLIST_VERSION (or ERR_PLAYLIST_INVALID_STATE if that playlist has since been armed) — never a silent success, because a token from the wrong parent must never validate"
            - "both §1.2.1 playlist rules share ONE error id: ERR_STALE_PLAYLIST_VERSION is reachable from POST /playlists/{id}/traffic-revisions AND POST /spot-orders/{id}/makegoods, and a revision on the target playlist kills a held makegood token exactly as a makegood kills a held revision token"

      # -- L3 -------------------------------------------------------------
      - name: three_multiplex_writes_share_one_counter_so_every_bitrate_change_in_a_pool_serialises
        claim_type: Correct Result
        grounds: "§1.2.1 rules channel-create-stale-multiplex (POST /channels), channel-allocation-stale-multiplex (PATCH /channels/{id}/allocation) and multiplex-rebalance-stale-multiplex (POST /multiplexes/{id}/rebalance) — all three occ_field expected_multiplex_version, ERR_STALE_MULTIPLEX_VERSION 412; §1.5 PATCH input [expected_multiplex_version, requested_bitrate_kbps?, floor_bitrate_kbps?, priority_rank?, pin_allocated_kbps?] returning Channel"
        distinguishing_aspect: "Three endpoints, three different paths, three different response entities, ONE counter. Two of them name a CHILD in the path (POST /channels names the multiplex in the body; PATCH names a channel) yet are guarded by the parent, so allocations on two different channels of the same multiplex must serialise — the exact opposite of the independent per-item behaviour clients expect. The corner also pins that the PATCH response is a Channel whose own version is NOT the next token, which is the single easiest client-side mistake to make and the hardest to detect."
        test_recipe:
          setup: "Reuse the standing 11:59 rig: MUX-A effective 38000 with ch1 16000 (rank 1) and ch2 6000 (rank 2), available 16000."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {}
              captures: {l3_v1: "$.data.version", l3_avail1: "$.data.available_kbps", l3_eff1: "$.data.effective_capacity_kbps"}
            - call: "PATCH /channels/${ch1_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${l3_v1}", pin_allocated_kbps: 20000}
              captures: {l3_ch1_alloc: "$.data.allocated_bitrate_kbps", l3_ch1_state: "$.data.allocation_state", l3_ch1_ver: "$.data.version"}
            - call: "PATCH /channels/${ch2_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${l3_v1}", pin_allocated_kbps: 8000}
              captures: {l3_sibling_stale: "$.data.error_id"}
            - call: "PATCH /channels/${ch2_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${l3_ch1_ver}", pin_allocated_kbps: 8000}
              captures: {l3_wrong_entity_token: "$.data.error_id"}
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {}
              captures: {l3_v2: "$.data.version", l3_avail2: "$.data.available_kbps"}
            - call: "POST /channels"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {multiplex_id: "${mux1_id}", expected_multiplex_version: "${l3_v1}", call_sign: "KTST-D3", channel_number: 3, service_class: STANDARD, resolution_class: SD_480I, requested_bitrate_kbps: 4000, floor_bitrate_kbps: 2000, priority_rank: 3}
              captures: {l3_create_stale: "$.data.error_id"}
            - call: "POST /multiplexes/${mux1_id}/rebalance"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${l3_v2}", clear_pins: true}
              captures: {l3_v3: "$.data.version", l3_avail3: "$.data.available_kbps"}
            - call: "PATCH /channels/${ch1_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${l3_v2}", pin_allocated_kbps: 20000}
              captures: {l3_after_rebalance: "$.data.error_id"}
          assert:
            - "the pin on ch1 succeeds: ${l3_ch1_alloc} == 20000, ${l3_ch1_state} == PINNED (or the declared pinned state) and ${l3_avail2} == ${l3_eff1} - 20000 - 6000 == 12000, with ${l3_v2} == ${l3_v1} + 1"
            - "SIBLING SERIALISATION: the ch2 allocation holding the same pre-image token fails with ${l3_sibling_stale} == ERR_STALE_MULTIPLEX_VERSION (412) even though it names a DIFFERENT channel — shared-capacity writes serialise across the whole pool"
            - "the returned Channel's own version is NOT the next token: presenting ${l3_ch1_ver} (a Channel.version, typically a small number) yields ${l3_wrong_entity_token} == ERR_STALE_MULTIPLEX_VERSION unless it coincidentally equals the multiplex's version — assert the two counters are independent by construction so the coincidence cannot be relied on"
            - "channel CREATION uses the same counter: ${l3_create_stale} == ERR_STALE_MULTIPLEX_VERSION for a token that was valid before the allocation, so provisioning and tuning contend with each other"
            - "the rebalance consumes the same counter: ${l3_v3} == ${l3_v2} + 1 and clear_pins true restores the proportional split so ${l3_avail3} == ${l3_avail1} == 16000"
            - "an allocation token issued before the rebalance is dead: ${l3_after_rebalance} == ERR_STALE_MULTIPLEX_VERSION — a rebalance the engineer did not initiate invalidates every outstanding allocation and creation token on that multiplex"
            - "the serialisation domain is exactly ONE multiplex: the identical PATCH against a channel of a different multiplex, holding that multiplex's own token, succeeds concurrently"

      # -- L4 -------------------------------------------------------------
      - name: the_asset_token_has_exactly_one_call_site_although_two_transitions_claim_it
        claim_type: Correct Result
        grounds: "§1.2.1 rule qc-report-stale-asset (parent Asset, POST /assets/{id}/qc-reports, expected_asset_version, ERR_STALE_ASSET_VERSION 412); §1.5 POST /assets/{id}/qc-waivers input [waived_by_operator_id, waiver_justification] and POST /assets/{id}/retract input [reason] — NEITHER declares a version field, against §1.2 QC_FAILED -> QC_WAIVED which lists 'expected_asset_version matches Asset.version (ERR_STALE_ASSET_VERSION)' as a precondition"
        distinguishing_aspect: "The asset plane contains the specification's sharpest internal contradiction: the QC_WAIVED transition lists an OCC precondition for which its endpoint declares no input. The resolution must be pinned in both directions — qc-reports MUST 412 on a stale token (so a second inspector can never blind-supersede a report), while the waiver and the retract MUST accept their declared bodies and MUST NOT demand an undeclared field. ERR_STALE_ASSET_VERSION therefore has exactly ONE reachable call site out of three candidate endpoints, even though delivery, waiver and retract all bump the very counter it guards."
        test_recipe:
          setup: "Reuse the standing 11:59 rig; the promo asset is DELIVERED and QC-clean at ${apromo_v2}."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "GET /assets/${apromo_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {}
              captures: {l4_v1: "$.data.version", l4_state1: "$.data.status"}
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${l4_v1}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [VIDEO_ARTIFACT, LOUDNESS_OUT_OF_SPEC], measured_duration_seconds: 60}
              captures: {l4_rep1: "$.data.id", l4_score1: "$.data.technical_score", l4_verdict1: "$.data.verdict"}
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc2_id}"
              payload: {expected_asset_version: "${l4_v1}", inspected_by_operator_id: "${op_qc2_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 60}
              captures: {l4_second_stale: "$.data.error_id"}
            - call: "GET /assets/${apromo_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {}
              captures: {l4_v2: "$.data.version", l4_state2: "$.data.status"}
            - call: "POST /assets/${apromo_id}/qc-waivers"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {waived_by_operator_id: "${op_pd_id}", waiver_justification: "Artifact is confined to the first two frames; approved for air."}
              captures: {l4_waived: "$.data.status", l4_v3: "$.data.version"}
            - call: "POST /assets/${apromo_id}/retract"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {reason: "Rights window closed before transmission."}
              captures: {l4_retract_state: "$.data.error_id"}
            - call: "POST /assets/${aprog_id}/retract"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {reason: "Rights window closed before transmission."}
              captures: {l4_retracted: "$.data.status", l4_v4: "$.data.version"}
          assert:
            - "the first report wins, bumps the asset and sets the verdict: ${l4_rep1} exists, ${l4_score1} follows the penalty arithmetic and ${l4_verdict1} == FAIL with ${l4_v2} == ${l4_v1} + 1, ${l4_state2} == QC_FAILED"
            - "a SECOND inspector holding the pre-image token cannot supersede blind: ${l4_second_stale} == ERR_STALE_ASSET_VERSION (412) — this guard is what makes the governing-report selector deterministic, because superseding is always an explicit act against a known version"
            - "the waiver carries NO token and MUST succeed: ${l4_waived} == QC_WAIVED. An implementation that requires expected_asset_version here answers ERR_MISSING_REQUIRED_FIELD for a field the endpoint never declared — a violation of §1.5 even though §1.2 lists the precondition"
            - "the waiver still BUMPS the counter (${l4_v3} == ${l4_v2} + 1), so it silently invalidates every held qc-report token without ever being guarded by one — an asymmetry that is required, not accidental"
            - "the retract likewise carries only [reason] (and note §1.2 names a reason_code that no endpoint declares): retracting the WAIVED asset fails on state with ${l4_retract_state} == ERR_ASSET_INVALID_STATE (409, legal only from QC_PASSED), while the retract of the passing program asset succeeds with ${l4_retracted} == RETRACTED and ${l4_v4} == its prior version + 1"
            - "ERR_STALE_ASSET_VERSION has exactly ONE reachable call site (POST /assets/{id}/qc-reports) although FOUR endpoints bump Asset.version (delivery, qc-reports, qc-waivers, retract) — count them and assert the other three can never emit it"

      # -- L5 -------------------------------------------------------------
      - name: every_other_mutating_endpoint_is_token_free_so_last_writer_wins_is_the_declared_model_there
        claim_type: Correct Result
        grounds: "§1.2.1 lists exactly 6 OCC rules over 3 token fields; §1.5 the remaining mutating endpoints declare no expected_*_version at all — POST /channels/{id}/air-state, POST /playlists/{id}/state, POST /playlist-items/{id}/playout-events, POST /playlist-items/{id}/substitute, POST /assets/{id}/delivery, /qc-waivers, /retract, POST /technical-faults{,/{id}/state}, POST /transmitters{,/{id}/power-state}, POST /operators{,/{id}/status}, POST /emergency-overrides{,/{id}/activate,/release}, POST /network-feed-windows{,/{id}/join,/breakaway}, POST /spot-orders, POST /multiplexes, POST /_clock/set_current_utc"
        distinguishing_aspect: "The interesting half of the concurrency story is where the guard is ABSENT. Twenty-plus writes — including every air-critical one — are last-writer-wins by design, because master control cannot be told 'your token is stale' while a channel is dark. The test must prove that (a) no such endpoint invents a version requirement, (b) presenting one anyway is a shape error rather than a 412, (c) the state machine alone provides the safety (a second identical transition fails with a 409, not a 412), and (d) the three 412 ids are therefore NOT interchangeable: no endpoint may answer ERR_STALE_PLAYLIST_VERSION for a multiplex, and no token from one entity validates against another."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig with pl1 ON_AIR on ch1."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /channels/${ch1_id}/air-state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_air_status: BARS_AND_TONE, reason: "Downstream keyer fault; going to bars."}
              captures: {l5_air1: "$.data.air_status", l5_ch_v1: "$.data.version"}
            - call: "POST /channels/${ch1_id}/air-state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_air_status: BARS_AND_TONE, reason: "Second operator sends the same command."}
              captures: {l5_air_repeat: "$.data.error_id"}
            - call: "POST /channels/${ch1_id}/air-state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_air_status: ON_AIR, reason: "Keyer restored; back to program.", expected_channel_version: "${l5_ch_v1}"}
              captures: {l5_extra_field: "$.data.error_id"}
            - call: "POST /playlists/${pl1_id}/state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_status: CLOSED, reason: "Day complete."}
              captures: {l5_closed: "$.data.status", l5_pl_v5: "$.data.version"}
            - call: "POST /playlists/${pl1_id}/state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_status: CLOSED, reason: "Duplicate close from a second console."}
              captures: {l5_close_repeat: "$.data.error_id"}
            - call: "POST /playlists/${pl1_id}/traffic-revisions"
              as: TrafficCoordinator
              payload: {expected_playlist_version: "${pl1_v4}", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-02T12:00:00Z", scheduled_duration_seconds: 1800}]}
              captures: {l5_rev_after_close: "$.data.error_id"}
          assert:
            - "the token-free air write simply applies: ${l5_air1} == BARS_AND_TONE, and the Channel's version advances (${l5_ch_v1}) even though no caller was asked to present it"
            - "safety comes from the STATE MACHINE, not from a token: the repeated identical transition answers ${l5_air_repeat} == ERR_CHANNEL_INVALID_AIR_STATE (409) — a 409, never a 412, because there is nothing to be stale about"
            - "presenting an undeclared token is a SHAPE error: ${l5_extra_field} == ERR_INVALID_FIELD_VALUE (or the declared unexpected-field id, 422) — an implementation must not silently accept expected_channel_version, and must certainly not honour it as an OCC check"
            - "the same holds on the playlist state machine: ${l5_closed} == CLOSED then ${l5_close_repeat} == ERR_PLAYLIST_INVALID_STATE (409); state transitions are idempotency-unsafe by design and the caller must read before retrying"
            - "the ONE token the playlist does have still guards its own endpoint after an unguarded transition moved the row: ${l5_rev_after_close} is ERR_STALE_PLAYLIST_VERSION if the state writes bumped the version, or ERR_PLAYLIST_INVALID_STATE if they did not — assert whichever follows from §1.2's declared side effects, and assert it is never a success"
            - "TOKEN CENSUS: exactly 3 distinct expected_* fields exist in the whole API (playlist, multiplex, asset) across 6 endpoints; enumerate the other 20+ mutating endpoints and assert none of them accepts, requires or emits any expected_*_version or any 412"
            - "the three 412 ids are entity-specific and never substituted for one another: a stale multiplex token never yields ERR_STALE_PLAYLIST_VERSION, and neither id is ever returned by an endpoint that has no token"

      # -- L6 -------------------------------------------------------------
      - name: one_chronological_scenario_touches_all_14_entities_and_every_cascade_edge_in_the_domain
        claim_type: Correct Result
        grounds: "§1.1 all 14 entities; §1.2 all 11 state machines; §1.4 the cascade edges (QC verdict -> item clearance -> playlist counters; fault severity -> notification + channel posture; playout events -> as-run + spot reconciliation; capacity change -> allocations)"
        distinguishing_aspect: "Every earlier instance isolates one mechanism; this one asserts they COMPOSE in a single timeline with no mechanism re-entered or double-applied. Each hop crosses an entity boundary no single endpoint owns: a QC report on an Asset changes a PlaylistItem's clearance and a Playlist's blocked_item_count; a TechnicalFault changes a Channel's posture and mints a RegulatoryNotification against the TRANSMITTER (not the channel); a playout event writes an AsRunEntry and moves SpotOrder money; a clock move sweeps notifications, faults, assets and operators at once. The failure mode caught here is a partially-applied cascade."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig (Transmitter, Multiplex, two Channels, Operators, Assets, QCReports, SpotOrder, Playlist and PlaylistItems already exist)."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /playlist-items/${it1_id}/playout-events"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {event_kind: CUE, event_utc: "2026-08-02T12:00:00Z", source: AUTOMATION}
              captures: {l6_asrun1: "$.data.id", l6_evt1: "$.data.event_kind", l6_seq1: "$.data.sequence_number"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: RF_POWER_FAULT, severity: MAJOR, detected_utc: "2026-08-02T12:05:00Z", transmitter_id: "${tx1_id}"}
              captures: {l6_fault: "$.data.id", l6_sev: "$.data.severity", l6_fstate: "$.data.state"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 50, reason: "RF fault: running on the reserve amplifier."}
              captures: {l6_pwr: "$.data.operational_state", l6_pct: "$.data.current_power_pct"}
            - call: "POST /emergency-overrides"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {channel_id: "${ch1_id}", requested_by_operator_id: "${op_mco_id}", alert_class: EAS_MANDATORY, override_mode: CUT_IN, requested_start_utc: "2026-08-02T12:10:00Z", expected_duration_seconds: 120}
              captures: {l6_ovr: "$.data.id", l6_ovr_state: "$.data.state"}
            - call: "POST /emergency-overrides/${l6_ovr}/activate"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {authorized_by_operator_id: "${op_pd_id}", override_mode: CUT_IN, activated_utc: "2026-08-02T12:10:00Z"}
              captures: {l6_ovr_state2: "$.data.state", l6_preempted: "$.data.preempted_item_count"}
            - call: "POST /_clock/set_current_utc"
              as: StationAdmin
              payload: {current_utc: "2026-08-02T12:40:00Z"}
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: ComplianceOfficer
              payload: {}
              captures: {l6_notif: "$.data[0].id", l6_notif_kind: "$.data[0].kind", l6_notif_status: "$.data[0].status", l6_pct_obs: "$.data[0].observed_power_pct"}
            - call: "GET /playlists/${pl1_id}/as-run"
              as: ComplianceOfficer
              payload: {}
              captures: {l6_asrun_first: "$.data[0].id", l6_asrun_kind: "$.data[0].event_kind"}
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: TrafficCoordinator
              payload: {basis: FINAL}
              captures: {l6_credit: "$.data.reconciliation_credit_cents", l6_variance: "$.data.asrun_end_variance_seconds"}
          assert:
            - "hop 1 (item -> as-run): the CUE writes exactly ONE AsRunEntry (${l6_asrun1}) with ${l6_evt1} == CUE and ${l6_seq1} == the item's sequence_number copied at write time, and flips the item to CUED — the item's playout_status is NOT in the response because the endpoint returns an AsRunEntry, so it must be re-read"
            - "hop 2 (fault -> transmitter plane): ${l6_sev} == MAJOR and ${l6_fstate} == DETECTED; a MAJOR RF fault does NOT by itself mint a notification — ${l6_notif_kind} == POWER_REDUCTION, minted by the power-state write, and it is filed against the TRANSMITTER (the notification entity has transmitter_id and no channel_id)"
            - "hop 3 (power -> deadline): ${l6_pwr} == REDUCED_POWER, ${l6_pct} == 50 and ${l6_pct_obs} == 50 is copied onto the notification; by 12:40 the filing deadline has passed so ${l6_notif_status} == OVERDUE, applied exactly once no matter how many times the clock is set forward again"
            - "hop 4 (override -> air): ${l6_ovr_state} == PENDING then ${l6_ovr_state2} == ACTIVE_CUTIN, and ${l6_preempted} counts the items it displaced — the override does NOT clear the RF fault and does NOT change the transmitter's power state"
            - "hop 5 (playout -> money): ${l6_credit} counts only spots whose items reached a terminal playout_status by 12:40, and ${l6_variance} is derived from as-run instants only; GET /playlists/{id}/reconciliation returns the PLAYLIST entity and mutates nothing"
            - "NO CASCADE RUNS TWICE: one AsRunEntry per event, one notification per triggering event, and ${l6_asrun_first}/${l6_asrun_kind} show the log ordered chronologically with insertion-order tie-breaking"
            - "all 14 entity kinds are materialised by the end of this scenario (NetworkFeedWindow via the setup chain's feed window, RegulatoryNotification via the power reduction, EmergencyOverride via the EAS cut-in) and every one of the 11 state machines has been entered at least once across this file"

      # -- L7 -------------------------------------------------------------
      - name: the_two_envelopes_are_uniform_and_the_logical_clock_has_no_read_endpoint_at_all
        claim_type: Error Handling
        grounds: "§1.0 response_envelope ({data: ...} on success, {error_id, message, details} on failure) with pagination defaults limit 10 / max 100 / offset 0; §1.5 POST /_clock/set_current_utc (all seven roles, output null) — there is NO GET clock endpoint anywhere in the 59; §1.4 'all temporal comparisons use the logical clock'"
        distinguishing_aspect: "Two cross-cutting shapes must never vary, and one of them is invisible. The envelope test is negative-heavy: a 401, a 403, a 404, a 409, a 412 and a 422 from six different endpoints must carry the same three keys and never leak a partial data object. The clock is the sharper corner — the API can only SET the logical instant and returns null, so the current time is observable ONLY through derived fields (filed_utc, cleared_utc, actual_start_utc, as-run instants). A test suite therefore proves determinism indirectly, and an implementation that reads the wall clock is detectable only by comparing those derived fields against the instant it was told."
        test_recipe:
          setup: "Reuse the standing 11:59 rig, then provoke one failure of each HTTP class from six different endpoints and pin one derived timestamp against the instant just set."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "GET /assets"
              as: QCTechnician
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
              payload: {}
              captures: {l7_401: "$.data.error_id"}
            - call: "POST /transmitters"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {facility_id: "FAC-99999", call_sign: "KTST-DT", authorized_erp_kw: 25}
              captures: {l7_403: "$.data.error_id"}
            - call: "GET /assets/00000000-0000-0000-0000-0000000000aa"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {}
              captures: {l7_404: "$.data.error_id"}
            - call: "POST /playlists/${pl1_id}/state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_status: VALIDATED}
              captures: {l7_409: "$.data.error_id"}
            - call: "POST /assets/${aprog_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${aprog_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 1800}
              captures: {l7_412: "$.data.error_id"}
            - call: "GET /assets"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {status: NOT_A_STATUS}
              captures: {l7_422: "$.data.error_id"}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceOfficer
              payload: {current_utc: "2026-08-02T12:31:00Z"}
            - call: "POST /technical-faults"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {fault_code: CAPTION_LOSS, severity: MINOR, detected_utc: "2026-08-02T12:31:00Z", channel_id: "${ch1_id}"}
              captures: {l7_fault: "$.data.id"}
            - call: "POST /technical-faults/${l7_fault}/state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: RESOLVED}
              captures: {l7_cleared: "$.data.cleared_utc", l7_dur: "$.data.duration_seconds"}
          assert:
            - "six endpoints, six HTTP classes, ONE envelope: ${l7_401} == ERR_OPERATOR_NOT_FOUND (401), ${l7_403} == ERR_ROLE_NOT_PERMITTED (403), ${l7_404} == ERR_ASSET_NOT_FOUND (404), ${l7_409} == ERR_PLAYLIST_INVALID_STATE (409, pl1 is already ON_AIR), ${l7_412} == ERR_STALE_ASSET_VERSION (412, the setup already reported against ${aprog_v2}) and ${l7_422} == ERR_INVALID_ENUM_VALUE (422) — each body carries exactly error_id, message and details and no data payload"
            - "every success body is {data: ...}; a collection read is {data: [...], total_count, limit, offset} with limit defaulting to 10 and offset to 0, and total_count is the FILTERED total on all 14 collection reads"
            - "THE CLOCK CANNOT BE READ: POST /_clock/set_current_utc returns 200 with a null body and there is no GET for it, so no capture can ever be taken from it — the logical now is observable only through derived fields"
            - "the derived field proves the time source: ${l7_cleared} == 2026-08-02T12:31:00Z exactly (the instant just set) rather than any wall-clock value, and ${l7_dur} == 0 because detection and resolution share that instant — a wall-clock implementation produces a nonzero duration and a drifting timestamp"
            - "all seven roles may set the clock (it is the only endpoint with a complete role list), which is why every sweep must be idempotent under repeated identical instants and monotonic under decreasing ones"
            - "pagination bounds are envelope-level, not endpoint-level: limit 0 and limit 101 are 422 on every collection read, and an empty result is 200 with data: [] rather than a 404"

      # -- L8 -------------------------------------------------------------
      - name: the_governing_qc_report_selector_is_one_policy_read_by_six_different_rules
        claim_type: Correct Result
        grounds: "§1.1 QCReport.superseded and QCReport.verdict; §1.2 Asset DELIVERED -> QC_PASSED / QC_FAILED and QC_FAILED -> QC_WAIVED preconditions (score, defect_codes, inspector identity, all against 'the governing (newest non-superseded) QCReport'); §1.4 the waiver rule ('the asset's latest non-superseded INGEST technical_score_ingest >= 40'); §1.5 GET /qc-reports [asset_id?, inspected_by_operator_id?, basis?, include_superseded?]"
        distinguishing_aspect: "Six independent rules read the SAME selector — the asset's verdict, the item's clearance_status, the waiver's minimum score, the waiver's AUDIO_LOSS refusal, the waiver's self-authorization comparison and the substitution's duration comparison. Getting the selector wrong changes six answers at once, and it has three traps: 'newest' is by creation order and NOT by score, so a second inspector can reverse a pass; 'non-superseded' means an explicitly flagged surviving row that GET must still return under include_superseded=true; and INGEST versus AIR_CHECK are SEPARATE governing rows, so a clean AIR_CHECK report cannot rescue a failed INGEST one — the waiver rule names the INGEST score specifically."
        test_recipe:
          setup: "Reuse the standing 11:59 rig, then stack reports on the promo asset across two bases."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "GET /assets/${apromo_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {}
              captures: {l8_v1: "$.data.version", l8_status0: "$.data.status"}
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc2_id}"
              payload: {expected_asset_version: "${l8_v1}", inspected_by_operator_id: "${op_qc2_id}", basis: INGEST, defect_codes: [AUDIO_LOSS, VIDEO_ARTIFACT], measured_duration_seconds: 60}
              captures: {l8_r2: "$.data.id", l8_s2: "$.data.technical_score", l8_verdict2: "$.data.verdict"}
            - call: "GET /assets/${apromo_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {}
              captures: {l8_v2: "$.data.version", l8_status2: "$.data.status"}
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${l8_v2}", inspected_by_operator_id: "${op_qc_id}", basis: AIR_CHECK, defect_codes: [], measured_duration_seconds: 60}
              captures: {l8_r3: "$.data.id", l8_s3: "$.data.technical_score"}
            - call: "POST /assets/${apromo_id}/qc-waivers"
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              payload: {waived_by_operator_id: "${op_pd_id}", waiver_justification: "The air-check pass should supersede the ingest finding."}
              captures: {l8_waiver_block: "$.data.error_id"}
            - call: "GET /qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {asset_id: "${apromo_id}", include_superseded: true}
              captures: {l8_all_first: "$.data[0].id", l8_all_first_sup: "$.data[0].superseded"}
            - call: "GET /qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {asset_id: "${apromo_id}", basis: INGEST}
              captures: {l8_gov_ingest: "$.data[0].id", l8_gov_sup: "$.data[0].superseded"}
          assert:
            - "the setup's clean INGEST report made the asset QC_PASSED (${l8_status0} == QC_PASSED); the newer report is worse and still GOVERNS: ${l8_verdict2} == FAIL, ${l8_status2} == QC_FAILED — 'newest' beats 'best', so a second inspector can reverse a pass"
            - "the earlier report is flagged, not deleted: ${l8_all_first_sup} is visible under include_superseded=true and the default (false) hides it, while ${l8_gov_ingest} == ${l8_r2} with ${l8_gov_sup} == false is the single surviving INGEST row"
            - "PER-BASIS GOVERNANCE: the clean AIR_CHECK report (${l8_r3}, ${l8_s3} == 100) does NOT supersede the failed INGEST row and does NOT rescue the asset — ${l8_waiver_block} == ERR_CAPTION_REQUIREMENT_UNMET, still driven by the INGEST row's AUDIO_LOSS defect, because §1.4 names the INGEST score specifically"
            - "one selector, six consumers: the asset verdict, every referencing item's clearance_status (BLOCKED), the waiver score gate (>= 40), the waiver AUDIO_LOSS gate, the waiver self-authorization comparison and the substitute duration comparison ALL resolve against ${l8_r2} and none against the superseded row or the AIR_CHECK row"
            - "each report bumps the asset (${l8_v2} == ${l8_v1} + 1) and is OCC-guarded, so the selector can never advance without an explicit guarded write — there is no implicit or time-based re-selection"
            - "include_superseded is the only way to audit the history, and its default MUST be false: assert the two calls differ in row count for the same asset_id"

      # -- L9 -------------------------------------------------------------
      - name: one_maximally_illegal_call_pins_the_entire_priority_ladder_from_auth_to_arithmetic
        claim_type: Error Handling
        grounds: "§1.4 the 67-row priority ladder (auth 1-2, operator identity and lifecycle 3-7, shape 8-19, OCC 20, entity state 21-30, air safety 31-38, authority 39-46, temporal 47-56, window and uniqueness 57-62, referential and arithmetic 63-67); §1.0 exactly one error_id per response; §1.5 POST /playlist-items/{id}/substitute input [replacement_asset_id, scheduled_duration_seconds?, reason?]"
        distinguishing_aspect: "The response carries exactly ONE error_id, so a call violating ten rules has exactly one correct answer, and peeling the violations off one at a time walks the ladder in the declared order. This is the most discriminating test in the file: an implementation that validates in the natural coding order (shape, then references, then state, then authorization) produces a different id at nearly every step, and no test of an individual rule can distinguish the two orders because each rule in isolation is correct. The chosen endpoint is token-free, so the ladder here runs auth -> identity -> role -> shape -> state -> window -> referential with no 412 to hide behind."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig; item 5 is a PROMO of 60 s with max_trim_seconds 30 on the ON_AIR playlist."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: QCTechnician
              payload: {replacement_asset_id: "00000000-0000-0000-0000-0000000000bb", scheduled_duration_seconds: -5, reason: "Everything about this request is wrong."}
              captures: {l9_1: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: QCTechnician
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
              payload: {replacement_asset_id: "00000000-0000-0000-0000-0000000000bb", scheduled_duration_seconds: -5, reason: "Unknown operator, everything else still wrong."}
              captures: {l9_2: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_qc_id}"
              payload: {replacement_asset_id: "00000000-0000-0000-0000-0000000000bb", scheduled_duration_seconds: -5, reason: "A QC operator wearing the master-control role."}
              captures: {l9_3: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {replacement_asset_id: "00000000-0000-0000-0000-0000000000bb", scheduled_duration_seconds: -5, reason: "Correct identity, wrong role for this endpoint."}
              captures: {l9_4: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {scheduled_duration_seconds: -5, reason: "Right role, no replacement named."}
              captures: {l9_5: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "00000000-0000-0000-0000-0000000000bb", scheduled_duration_seconds: -5, reason: "Right role, negative duration, unknown asset."}
              captures: {l9_6: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "00000000-0000-0000-0000-0000000000bb", scheduled_duration_seconds: 60, reason: "Shape now clean, asset still unknown."}
              captures: {l9_7: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "${ainter_id}", scheduled_duration_seconds: 29, reason: "Real asset, trim one second beyond the maximum."}
              captures: {l9_8: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "${ainter_id}", scheduled_duration_seconds: 30, reason: "Trim exactly at the maximum."}
              captures: {l9_9: "$.data.error_id"}
            - call: "POST /playlist-items/${it5_id}/substitute"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {replacement_asset_id: "${ainter_id}", reason: "Default duration: inherit the outgoing element's 60 seconds."}
              captures: {l9_10: "$.data.replaces_item_id", l9_10_seq: "$.data.sequence_number"}
          assert:
            - "ladder step 1 (priority 1, missing headers): ${l9_1} == ERR_MISSING_AUTH_HEADERS — the negative duration and the unknown asset are invisible at this point"
            - "ladder step 2 (priority 3, unknown operator): ${l9_2} == ERR_OPERATOR_NOT_FOUND (401), still ahead of every shape rule"
            - "ladder step 3 (identity before authorization): ${l9_3} == ERR_ROLE_IDENTITY_MISMATCH (403) — a REAL QC operator presenting X-User-Role MasterControlOperator is rejected on the role_class mapping, NOT on the endpoint's role list, which would have admitted MasterControlOperator"
            - "ladder step 4 (priority 2, role list): ${l9_4} == ERR_ROLE_NOT_PERMITTED — the same operator honestly presenting QCTechnician is refused because QC is not listed on substitute; steps 3 and 4 are two different 403s that a single-check implementation collapses into one"
            - "ladder step 5 (priority 8, required field): ${l9_5} == ERR_MISSING_REQUIRED_FIELD for the absent replacement_asset_id — missing beats malformed, so the negative duration in the same body is not reported"
            - "ladder step 6 (priority 9-19, field shape): ${l9_6} == ERR_INVALID_FIELD_VALUE for scheduled_duration_seconds == -5 — shape beats the referential check on the unknown asset id in the same body"
            - "ladder step 7 (priority 63, referential): ${l9_7} == ERR_ASSET_NOT_FOUND (404) — the unknown replacement is diagnosed only once auth, identity, role and shape are all clean, which is why it is the LAST id a naive implementation reaches and near-last in the declared order"
            - "ladder step 8 (priority 58, trim): ${l9_8} == ERR_TRIM_EXCEEDS_MAX — 60 - 29 == 31 exceeds max_trim_seconds 30 by one second"
            - "ladder step 9 (priority 57/58 boundary and 47-56 adjacency): a trim of exactly 30 satisfies rule 58 (the boundary is inclusive) and then fails on the schedule adjacency it creates — ${l9_9} == ERR_SCHEDULE_GAP_DETECTED, proving the previous refusal was the trim rule and not a blanket duration check"
            - "ladder step 10 (success): omitting scheduled_duration_seconds inherits the outgoing 60 s, so ${l9_10} == ${it5_id} and ${l9_10_seq} == 5 — the tenth attempt differs from the first only by peeling ten violations in the declared order"
            - "no response ever carries two ids, and details never enumerates multiple violations: single-error semantics are absolute across all 96 ids"

  # =====================================================================
  # CONSISTENCY MODEL
  # This domain is IMMEDIATE end to end: every derived field, cascade and
  # sweep is visible the instant its cause is accepted, and nothing is
  # eventual, queued, batched or backgrounded. Broadcast tolerates no
  # delayed clearance flip, so the two instances below pin the model from
  # both sides — what a successful write must already show, and what a
  # rejected write must leave untouched.
  # =====================================================================
  - section: consistency_model
    instances:
      # -- C1 -------------------------------------------------------------
      - name: every_derived_field_is_immediate_and_visible_in_the_causing_response_itself
        claim_type: Correct Result
        grounds: "§1.0 consistency model: immediate; §1.1 the computed fields (QCReport.technical_score and verdict, Channel.allocated_bitrate_kbps / allocation_state / posture / open_fault_count, Multiplex.effective_capacity_kbps / assigned_kbps / available_kbps / starved_channel_count, Playlist.item_count / blocked_item_count / reconciliation_credit_cents, PlaylistItem.clearance_status, TechnicalFault.severity / duration_seconds); §1.4 the cascade rules"
        distinguishing_aspect: "Immediate means the CAUSING response already carries the consequence, not the next read. A QC report's response must show the score and verdict it just computed; a rebalance's response must show every recomputed pool figure; a fault must show its duration the moment it clears. The failure this catches is a two-phase implementation that persists first and recomputes on read: it satisfies every GET-based assertion and fails here. The strictest form is the cross-entity case, where the write returns entity A while the consequence lands on entity B and must be observable on the very next read with no refresh call, no queue drain and no clock movement."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /assets/${apromo_id}/qc-reports"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              payload: {expected_asset_version: "${apromo_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [AUDIO_LOSS, FORMAT_MISMATCH], measured_duration_seconds: 60}
              captures: {c1_score: "$.data.technical_score", c1_verdict: "$.data.verdict", c1_report: "$.data.id"}
            - call: "GET /playlist-items/${it5_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {}
              captures: {c1_clearance: "$.data.clearance_status"}
            - call: "GET /playlists/${pl1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {}
              captures: {c1_blocked: "$.data.blocked_item_count", c1_count: "$.data.item_count"}
            - call: "POST /multiplexes/${mux1_id}/rebalance"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${mux1_v2}", clear_pins: false}
              captures: {c1_effective: "$.data.effective_capacity_kbps", c1_assigned: "$.data.assigned_kbps", c1_available: "$.data.available_kbps", c1_starved: "$.data.starved_channel_count"}
            - call: "POST /transmitters/${tx1_id}/power-state"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {target_state: REDUCED_POWER, power_pct: 60, reason: "Amplifier derate under thermal load."}
              captures: {c1_state: "$.data.operational_state", c1_pct: "$.data.current_power_pct"}
            - call: "GET /channels/${ch1_id}"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {}
              captures: {c1_posture: "$.data.posture", c1_air: "$.data.air_status", c1_alloc: "$.data.allocated_bitrate_kbps"}
            - call: "GET /transmitters/${tx1_id}/notifications"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {status: PENDING}
              captures: {c1_notif: "$.data[0].id", c1_notif_due: "$.data[0].due_utc"}
          assert:
            - "the QC response ALREADY carries what it computed: ${c1_score} follows the penalty arithmetic and ${c1_verdict} == FAIL in the 201 body — the caller never has to re-read the asset to learn the verdict"
            - "the cascade is immediate across entities: ${c1_clearance} == BLOCKED and ${c1_blocked} == 1 on the very next reads, with no intervening write, no clock movement and no refresh endpoint (there is none), while ${c1_count} is unchanged"
            - "the rebalance response carries the whole recomputed pool: ${c1_effective} == 38000, ${c1_assigned} == 22000, ${c1_available} == 16000 and ${c1_starved} == 0 — an acknowledgement without the figures is a failure"
            - "the power write returns the Transmitter (${c1_state} == REDUCED_POWER, ${c1_pct} == 60) while its consequences land elsewhere and are already visible: ${c1_posture} reflects the derate, ${c1_alloc} reflects any re-slicing, and the POWER_REDUCTION notification ${c1_notif} exists with its deadline ${c1_notif_due} already computed"
            - "the notification is minted synchronously by the power write, not by the next clock move: assert it is PENDING and readable BEFORE any call to POST /_clock/set_current_utc"
            - "nothing in this domain is eventual: there is no queue, no retry, no reconciliation job, no 202 Accepted and no endpoint whose effect is described as pending — every 200/201 is fully applied when it returns"

      # -- C2 -------------------------------------------------------------
      - name: a_rejected_call_leaves_no_trace_and_a_successful_one_leaves_every_trace_atomically
        claim_type: Correct Result
        grounds: "§1.0 consistency model: immediate; §1.0 single-error responses; §1.2 the transition side-effect lists (as-run writes, notification minting, clearance flips, counter refreshes, version increments); §1.2.1 the six OCC rules"
        distinguishing_aspect: "The other half of immediacy is ATOMICITY: a failed call must leave the database bit-identical — above all it must NOT bump a version, because a phantom bump silently kills every other client's token — and a successful call must land all of its side effects together. The dangerous cases are the multi-effect writes: a traffic revision that ingests three items and then fails on the third, a rebalance that recomputes four channels and then finds a floor unsatisfiable, an air transition that would write an as-run entry before hitting an air-safety rule. None may leave a partial result, and the compliance log must never contain an event that did not happen."
        test_recipe:
          setup: "Reuse the standing 11:59 on-air rig and capture every counter a failing call might disturb."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {}
              captures: {c2_mux_v: "$.data.version", c2_mux_avail: "$.data.available_kbps", c2_mux_assigned: "$.data.assigned_kbps"}
            - call: "PATCH /channels/${ch1_id}/allocation"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {expected_multiplex_version: "${c2_mux_v}", pin_allocated_kbps: 36001}
              captures: {c2_over: "$.data.error_id"}
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              payload: {}
              captures: {c2_mux_v2: "$.data.version", c2_mux_avail2: "$.data.available_kbps"}
            - call: "POST /playlists"
              as: TrafficCoordinator
              payload: {channel_id: "${ch1_id}", broadcast_day: "2026-08-05", schedule_start_utc: "2026-08-05T12:00:00Z", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-05T12:00:00Z", scheduled_duration_seconds: 1800}]}
              captures: {c2_pl: "$.data.id", c2_pl_v: "$.data.version", c2_pl_count: "$.data.item_count"}
            - call: "POST /playlists/${c2_pl}/traffic-revisions"
              as: TrafficCoordinator
              payload: {expected_playlist_version: "${c2_pl_v}", items: [{sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-05T12:00:00Z", scheduled_duration_seconds: 1800}, {sequence_number: 2, element_kind: COMMERCIAL, asset_id: "${aspot_id}", scheduled_start_utc: "2026-08-05T12:30:00Z", scheduled_duration_seconds: 30}, {sequence_number: 4, element_kind: PROMO, asset_id: "${apromo_id}", scheduled_start_utc: "2026-08-05T12:30:30Z", scheduled_duration_seconds: 60}]}
              captures: {c2_partial: "$.data.error_id"}
            - call: "GET /playlists/${c2_pl}"
              as: TrafficCoordinator
              payload: {}
              captures: {c2_pl_v2: "$.data.version", c2_pl_count2: "$.data.item_count", c2_pl_rev: "$.data.traffic_revision"}
            - call: "POST /channels/${ch2_id}/air-state"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              payload: {target_air_status: ON_AIR, reason: "Lighting a channel that has no armed playlist."}
              captures: {c2_air_fail: "$.data.error_id"}
            - call: "GET /playlists/${c2_pl}/items"
              as: TrafficCoordinator
              payload: {}
              captures: {c2_items_first: "$.data[0].id"}
          assert:
            - "the over-capacity pin fails with ${c2_over} == ERR_MULTIPLEX_CAPACITY_EXCEEDED and changes NOTHING: ${c2_mux_v2} == ${c2_mux_v} and ${c2_mux_avail2} == ${c2_mux_avail} == 16000 with ${c2_mux_assigned} unchanged — a failed write must never bump the version, or every concurrent client's token dies for a write that never happened"
            - "a multi-item revision is all-or-nothing: the sparse sequence run (1, 2, 4) fails with ${c2_partial} == ERR_SEQUENCE_NUMBER_CONFLICT and the first two items are NOT ingested — ${c2_pl_count2} == ${c2_pl_count} == 1, ${c2_pl_v2} == ${c2_pl_v} and ${c2_pl_rev} is unchanged"
            - "the surviving item is the ORIGINAL one: ${c2_items_first} is the playlist's own sequence-1 element, not an orphan from the rejected revision, and the collection read returns exactly one row"
            - "a refused air transition writes NO as-run entry: ${c2_air_fail} is the declared air precondition id (the ch2 playlist is not ARMED) and GET /playlists/{id}/as-run for that channel's playlist stays empty — the compliance log can never contain an event that did not happen"
            - "conversely every SUCCESSFUL air transition writes exactly one AsRunEntry in the same instant as the status flip, so the log and the state can never disagree in either direction"
            - "atomicity holds across entity boundaries: a failed qc-report leaves no report row, no clearance flip and no asset version bump; a failed makegood leaves no PlaylistItem and no SpotOrder counter movement; and a non-monotonic clock set applies no sweep at all"
