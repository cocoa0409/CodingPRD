            - "no ServiceRecord is persisted, the system stays at 60.0 lb and the cylinder stays SENT_FOR_RECLAIM with 20.0 lb shipped"
            - "after a reclaim certification of 20.0 lb with purity_verified true the identical ADD call returns 201, so disposition is the only bar"

