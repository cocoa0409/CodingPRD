        claim_type: error_triggerable
        grounds:
          - errors[ERR_PARTNER_SUSPENDED]
          - calculations.partner_posture_derivation
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_dispatch_depends_on_delivery_partner_posture
          rationale: "That §1.8 instance walks a partner OPEN -> RESTRICTED -> SUSPENDED and asserts the same dispatch call succeeds, succeeds, then fails 422 ERR_PARTNER_SUSPENDED at each posture."

