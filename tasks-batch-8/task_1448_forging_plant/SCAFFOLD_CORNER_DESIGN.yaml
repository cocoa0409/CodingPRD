            - { call: "POST /work-orders/${wo_a}/cancel", payload: {}, as: SalesPlanner, captures: { wa_st: "$.data.status" } }
            - { call: "GET /forge-runs/${r1}", payload: {}, as: ForgeOperator, captures: { r1_st: "$.data.status" } }
            - { call: "GET /forge-runs/${r2}", payload: {}, as: ForgeOperator, captures: { r2_st: "$.data.status" } }
          assert:
            - "WO-30 CANCELLED; its run R1 cascaded to CANCELLED"
            - "WO-31's run R2 remains SCHEDULED (conditional cascade touches only the cancelled order's runs)"

      - name: soak_gate_uses_logical_clock
        claim_type: precondition_enforcement
        grounds: [state_machines.FurnaceCharge.SOAKING_to_READY, "errors[ERR_SOAK_TIME_NOT_ELAPSED]"]
        distinguishing_aspect: "mark-ready is clock-gated: at closed_at + 59 minutes it fails with ERR_SOAK_TIME_NOT_ELAPSED; at exactly closed_at + soak_minutes (boundary, >=) it succeeds."
        test_recipe:
          setup: ["Alloy; heat CERT_VERIFIED; 1 billet; charge created 08:00, closed at 08:00, soak 60 min"]
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-7111", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 1 } ] }, as: SawOperator, captures: { b1: "$.data[0].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { chg_id: "$.data.id" } }
            - { call: "POST /furnace-charges/${chg_id}/close-loading", payload: {}, as: FurnaceOperator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:59:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg_id}/mark-ready", payload: {}, as: FurnaceOperator, captures: { err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg_id}/mark-ready", payload: {}, as: FurnaceOperator, captures: { st: "$.data.status" } }
          assert:
            - "at +59 min: HTTP 409, error_id == ERR_SOAK_TIME_NOT_ELAPSED"
            - "at exactly +60 min: status == READY (inclusive boundary)"

