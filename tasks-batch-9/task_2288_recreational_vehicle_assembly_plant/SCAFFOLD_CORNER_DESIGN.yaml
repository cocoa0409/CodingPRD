      - name: option_band_reports_discontinued_before_mutual_exclusion
        claim_type: priority_conflict
        grounds:
          - validations[priority 13]
          - errors.ERR_OPTION_DISCONTINUED
          - errors.ERR_OPTION_MUTUALLY_EXCLUSIVE
        distinguishing_aspect: "One order violates two rules inside the same priority-13 band; the band's internal order decides, so the DISCONTINUED status is reported first and the exclusion surfaces only after the option is reinstated."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; FP-TOW; two mutually exclusive INTERIOR options OPT-X1 and OPT-X2 (OPT-X2 excludes OPT-X1); dealer D-TOW; one DRAFT order on both options; OPT-X1 is then discontinued."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-X1", category: "INTERIOR", install_station: "FINISH", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { o_x1: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-X2", category: "INTERIOR", install_station: "FINISH", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 0, water_demand_gal: 0, excludes_option_codes: ["OPT-X1"] }
              as: PlantAdmin
              captures: { o_x2: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${o_x1}", "${o_x2}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_id: $.data.id }
            - call: "PATCH /option-items/${o_x1}"
              payload: { status: "DISCONTINUED" }
              as: PlantAdmin
              captures: { x1_status: $.data.status }
          trigger:
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { e_first: $.data.error_id }
            - call: "PATCH /option-items/${o_x1}"
              payload: { status: "ACTIVE" }
              as: PlantAdmin
              captures: { x1_back: $.data.status }
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { e_second: $.data.error_id }
            - call: "PUT /unit-orders/${ord_id}/configuration"
              payload: { selected_option_ids: ["${o_x2}"] }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { cfg_status: $.data.status }
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { final_status: $.data.status }
          assert:
            - "x1_status == DISCONTINUED and e_first == ERR_OPTION_DISCONTINUED with status 422, even though the exclusion pair is also present"
            - "x1_back == ACTIVE and e_second == ERR_OPTION_MUTUALLY_EXCLUSIVE with status 422 — the same order, the same body, a different code"
            - "cfg_status == DRAFT — replacing the configuration returns the order to DRAFT"
            - "final_status == CONFIG_VALIDATED once only OPT-X2 is selected"
            - "the exclusion is symmetric in effect: it is declared on OPT-X2 alone yet the pair is still refused"

      - name: booth_window_and_clock_bounds_are_rejected_as_invalid_request
        claim_type: temporal_validation
        grounds:
