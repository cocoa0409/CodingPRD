      - name: circulator_registration_precondition_rejections
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Circulator.PENDING_TRAINING_to_TRAINED
          - state_machines.Circulator.TRAINED_to_REGISTERED
          - errors[ERR_TRAINING_NOT_COMPLETE]
          - errors[ERR_TRAINING_COURSE_NOT_APPROVED]
          - errors[ERR_AFFIDAVIT_NOT_SWORN]
          - errors[ERR_PAID_DISCLOSURE_MISSING]
          - calculations.required_valid_signature_threshold.constants.APPROVED_TRAINING_COURSES
        distinguishing_aspect: |
          Each of the four preconditions guarding the two registration transitions is
          violated in isolation on a circulator that satisfies all the others, so the
          returned code identifies which precondition fired rather than merely that
          registration failed. c1 is unpaid, so its affidavit needs no disclosure and the
          only barriers are the missing training and the unsworn flag; c2 is paid with no
          disclosure on file, so its affidavit fails on paid_disclosure_on_file alone even
          though training is complete and the affidavit is sworn. Every rejection leaves
          registration_status exactly where it was.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z. No petition, county or standard is required - circulator registration is independent of them."
            - "Circulator c1 is created unpaid (is_paid omitted), so paid_disclosure_on_file is true from the start."
            - "Circulator c2 is created with is_paid true and no employer_name, so paid_disclosure_on_file is false."
            - "APPROVED_TRAINING_COURSES == [SOS-CIRC-101, SOS-CIRC-201]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators"
              payload: { full_name: "Cora Carter", residency_state_code: "CA" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id, c1_disc: $.data.paid_disclosure_on_file }
            - call: "POST /circulators"
              payload: { full_name: "Paul Paid", residency_state_code: "NV", is_paid: true }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c2_id: $.data.id, c2_disc: $.data.paid_disclosure_on_file }
          trigger:
            - call: "POST /circulators/${c1_id}/affidavit"
              payload: { sworn: true }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_no_training: $.data.error_id }
            - call: "POST /circulators/${c1_id}/training"
              payload: { training_course_code: "SOS-CIRC-999" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_course: $.data.error_id }
            - call: "POST /circulators/${c1_id}/training"
              payload: { training_course_code: "SOS-CIRC-101" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c1_after_training: $.data.registration_status, c1_course: $.data.training_course_code, c1_trained_at: $.data.training_completed_at }
            - call: "POST /circulators/${c1_id}/affidavit"
              payload: { sworn: false }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_not_sworn: $.data.error_id }
            - call: "POST /circulators/${c2_id}/training"
              payload: { training_course_code: "SOS-CIRC-201" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c2_after_training: $.data.registration_status }
            - call: "POST /circulators/${c2_id}/affidavit"
              payload: { sworn: true }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_disclosure: $.data.error_id }
            - call: "PUT /circulators/${c2_id}/paid-disclosure"
              payload: { disclosure_document_id: "DISC-1", employer_name: "Signatures Inc" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c2_disc_after: $.data.paid_disclosure_on_file, c2_doc: $.data.disclosure_document_id }
            - call: "POST /circulators/${c2_id}/affidavit"
              payload: { sworn: true }
              as: CirculatorAgent
              as_user_id: "${c2_id}"
              captures: { c2_final: $.data.registration_status, c2_aff_at: $.data.affidavit_filed_at }
          assert:
            - "${c1_disc} == true and ${c2_disc} == false at creation"
            - "${e_no_training} == ERR_TRAINING_NOT_COMPLETE with HTTP 422 - the affidavit is refused from PENDING_TRAINING"
            - "${e_course} == ERR_TRAINING_COURSE_NOT_APPROVED with HTTP 422 and Circulator.${c1_id}.registration_status is still PENDING_TRAINING with training_course_code null"
            - "${c1_after_training} == TRAINED, ${c1_course} == SOS-CIRC-101, ${c1_trained_at} == 2026-08-01T00:00:00.000Z"
            - "${e_not_sworn} == ERR_AFFIDAVIT_NOT_SWORN with HTTP 422 and Circulator.${c1_id}.registration_status is still TRAINED with affidavit_filed_at null"
            - "${c2_after_training} == TRAINED and ${e_disclosure} == ERR_PAID_DISCLOSURE_MISSING with HTTP 422 - training is complete and the affidavit is sworn, so only the disclosure gate can be firing"
            - "${c2_disc_after} == true and ${c2_doc} == DISC-1 and Circulator.${c2_id}.employer_name == \"Signatures Inc\""
            - "${c2_final} == REGISTERED and ${c2_aff_at} == 2026-08-01T00:00:00.000Z - the CirculatorAgent acting on its own id is accepted"

      - name: single_subject_and_title_summary_clearance_gates
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Petition.FORMAT_REVIEW_to_TITLE_PENDING
          - state_machines.Petition.TITLE_PENDING_to_CLEARED
          - errors[ERR_SINGLE_SUBJECT_VIOLATION]
          - errors[ERR_TITLE_SUMMARY_MISSING]
          - calculations.required_valid_signature_threshold
        distinguishing_aspect: |
          Two petitions under one standard separate the two gates that stand between
          FORMAT_REVIEW and circulation. pet_multi carries two subject codes, which the
          create and submit calls accept (1..5 codes is a valid array) and only the APPROVE
          decision rejects - so the single-subject rule must live on the approval, not on
          the create. pet_single then proves clearance is refused while official_title and
          official_summary are null and succeeds the moment the TitleExaminer has written
          both, freezing required_valid_signatures at 2 and stamping the 180-day deadline.
        test_recipe:
          setup:
            - "Standard SOS-G: gubernatorial_vote_total 100, signature_pct_bps 200, circulation_window_days 180."
            - "pet_multi is created with measure_subject_codes [TAX, HEALTH]; pet_single with [TAX]. Both are submitted, so both sit in FORMAT_REVIEW."
            - "Clock pinned at 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-G", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250, circulation_window_days: 180 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Gate Committee", submitted_title: "Two Subject Measure", measure_subject_codes: ["TAX", "HEALTH"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { multi_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Gate Committee", submitted_title: "One Subject Measure", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { single_id: $.data.id }
            - call: "POST /petitions/${multi_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${single_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
          trigger:
            - call: "POST /petitions/${multi_id}/format-decision"
              payload: { decision: "APPROVE", reviewer_note: "two subjects" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { e_subject: $.data.error_id }
            - call: "POST /petitions/${single_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { single_status: $.data.status, single_v: $.data.version }
            - call: "POST /petitions/${single_id}/clear-for-circulation"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { e_title: $.data.error_id }
            - call: "PUT /petitions/${single_id}/title-summary"
              payload: { official_title: "The Tax Fairness Act", official_summary: "Adjusts the property tax base.", expected_petition_version: "${single_v}" }
              as: TitleExaminer
              as_user_id: "title-1"
              captures: { t_status: $.data.status, t_title: $.data.official_title }
            - call: "POST /petitions/${single_id}/clear-for-circulation"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { c_status: $.data.status, c_req: $.data.required_valid_signatures, c_cleared: $.data.cleared_at, c_deadline: $.data.circulation_deadline }
          assert:
            - "${e_subject} == ERR_SINGLE_SUBJECT_VIOLATION with HTTP 422 and Petition.${multi_id}.status is still FORMAT_REVIEW with format_review_round still 0 - a refused approval is not a rejection"
            - "${single_status} == TITLE_PENDING"
            - "${e_title} == ERR_TITLE_SUMMARY_MISSING with HTTP 422 and Petition.${single_id}.status is still TITLE_PENDING with cleared_at null"
            - "${t_status} == TITLE_PENDING and ${t_title} == \"The Tax Fairness Act\" - the title write is a self-loop, not an advance"
            - "${c_status} == CLEARED, ${c_req} == 2 (ceil(100 * 200 / 10000)), ${c_cleared} == 2026-08-01T00:00:00.000Z, ${c_deadline} == 2027-01-28T00:00:00.000Z"

      - name: petition_submit_twice_second_attempt_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Petition.DRAFT_to_FORMAT_REVIEW
          - errors[ERR_INVALID_PETITION_STATE]
          - endpoints[POST /petitions/{petition_id}/submit]
        distinguishing_aspect: |
          The submit endpoint is not idempotent: replaying it against a petition already in
          FORMAT_REVIEW must return ERR_INVALID_PETITION_STATE rather than silently
          re-succeeding, and - the sharper half - it must NOT increment
          format_review_round, which only the examiner's decision advances. An
          implementation that bumps the round counter on submit would exhaust
          MAX_FORMAT_REVIEW_ROUNDS after two harmless retries.
        test_recipe:
          setup:
            - "Standard SOS-S and one petition created by prop-1; clock at 2026-08-01T00:00:00Z."
            - "The petition is submitted exactly once, so it sits in FORMAT_REVIEW with format_review_round 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-S", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Retry Committee", submitted_title: "Retry Measure", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id, draft_status: $.data.status, draft_round: $.data.format_review_round }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
              captures: { first_status: $.data.status, first_round: $.data.format_review_round, first_at: $.data.updated_at }
          trigger:
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
              captures: { e_replay: $.data.error_id }
          assert:
            - "${draft_status} == DRAFT and ${draft_round} == 0 at creation"
            - "${first_status} == FORMAT_REVIEW, ${first_round} == 0, ${first_at} == 2026-08-01T00:00:00.000Z (the logical clock, not wall time)"
            - "${e_replay} == ERR_INVALID_PETITION_STATE with HTTP 409"
            - "Petition.${pet_id}.format_review_round is still 0, status is still FORMAT_REVIEW and updated_at is still 2026-08-01T00:00:00.000Z - the rejected replay changed nothing"

      - name: invalid_from_state_rejections_across_round_batch_and_circulator
        claim_type: invalid_transitions
        grounds:
          - state_machines.VerificationRound.CLOSED
          - state_machines.SignatureBatch.INVALIDATED
          - state_machines.Circulator.REVOKED
          - errors[ERR_INVALID_ROUND_STATE]
          - errors[ERR_INVALID_BATCH_STATE]
          - errors[ERR_BATCH_ALREADY_TERMINAL]
          - errors[ERR_INVALID_CIRCULATOR_STATE]
        distinguishing_aspect: |
          Nine transitions are attempted from states that do not admit them, and the four
          distinct 409 codes prove the implementation discriminates the dimension that
          refused rather than emitting one generic conflict. The pairs that are easy to
          collapse are deliberately adjacent: a second tally and a second void are both
          ERR_INVALID_ROUND_STATE, but a second invalidate is ERR_BATCH_ALREADY_TERMINAL
          and not ERR_INVALID_BATCH_STATE; suspending a PENDING_TRAINING circulator,
          reinstating a REGISTERED one and re-revoking a REVOKED one all collapse to
          ERR_INVALID_CIRCULATOR_STATE. Every probe is interleaved with the successful
          transition it shadows, so the successful void proves the round really was OPEN.
