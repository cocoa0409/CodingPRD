            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-IMM-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_imm_pol: $.data.id }
            - call: "POST /wc/policies/${cd_imm_pol}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${cd_imm_pol}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "imm-run-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
            - call: "GET /wc/policies/${cd_imm_pol}"
              as: Underwriter
              captures: { cd_imm_billed: $.data.cumulative_billed_cents }
          assert:
            - "immediately after acceptance, GET policy shows cumulative_billed_cents == 155250"
            - "GET /wc/policies/${cd_imm_pol}/invoices shows the PAYROLL invoice in ISSUED in the same read cycle"
