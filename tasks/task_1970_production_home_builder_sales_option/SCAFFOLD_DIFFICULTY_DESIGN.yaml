            - "PurchaseAgreement.${agr_id}.status == CANCELLED with cancel_reason == BUILDER_DEFAULT"
            - "PurchaseAgreement.${agr_id}.refund_amount_cents == 500000 and forfeited_amount_cents == 0 (BUILDER_DEFAULT full refund)"
            - "Lot.${lot_id}.status == RELEASED (hop 2)"
            - "Lot.${lot_id}.release_count == 1 and release_price_cents == 10190820 = round_half_up(9991000 * 1.02) (hop 3: re-release repricing, not a phase re-evaluation)"
            - "Lot.${lot_id}.reserved_buyer_id == null and hold_expires_at == null"

