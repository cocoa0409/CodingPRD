# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0545 estate-sale
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls
# chain drives empty-DB -> the described precondition using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_estimated_vs_final_net_diverges
        grounds:
          - calculations.settlement_net_to_client
          - calculations.commission_tiered
          - entities.Project.fields.estimated_net_to_client_cents
          - entities.SettlementStatement.fields.net_to_client_cents
        distinguishing_aspect: |
          On the SAME two consignment lots the estimated variant (list prices 300000+400000=700000,
          commission 260000, no card fees) yields Project.estimated_net_to_client_cents=440000, while
          the final variant (day-1 markdown sale prices 225000+300000=525000, commission 207500, card
          fees 15225) yields SettlementStatement.net_to_client_cents=302275 — a Project-domain divergence.
        test_recipe:
          setup:
            - "Project CONTRACTED with two CONSIGNMENT lots priced 300000 and 400000, min commission 50000"
            - "Estimate snapshotted at SALE_SETUP = 440000; both lots sold day-1 by CARD at 25% markdown; sale closed; project SETTLING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /estate/clients", payload: { name: "Ada Owner", phone: "555-0100" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "1 Elm St", estimated_total_value_cents: 1000000, minimum_commission_cents: 50000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED", assessment_notes: "full house" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Dining set", handling_type: "CONSIGNMENT", list_price_cents: 300000, reserve_price_cents: 1000 }, as: Appraiser, captures: { lotA_id: "$.data.id" } }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "China cabinet", handling_type: "CONSIGNMENT", list_price_cents: 400000, reserve_price_cents: 1000 }, as: Appraiser, captures: { lotB_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "RESEARCHED", research_notes: "comps ok" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "RESEARCHED", research_notes: "comps ok" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "POST /estate/crews", payload: { name: "Crew A" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-03T00:00:00Z" }, as: SaleManager, captures: { se_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_LIVE" }, as: SaleManager }
            - { call: "PATCH /estate/sale-events/${se_id}", payload: { status: "OPEN" }, as: SaleManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lotA_id}", payment_method: "CARD" }, as: Cashier }
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lotB_id}", payment_method: "CARD" }, as: Cashier }
            - { call: "POST /estate/sale-events/${se_id}/close", payload: {}, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SETTLING" }, as: SaleManager, captures: { proj_v: "$.data.version" } }
          trigger:
            - { call: "POST /estate/settlement-statements", payload: { project_id: "${proj_id}", expected_project_version: "${proj_v}" }, as: SaleManager, captures: { settle_id: "$.data.id" } }
          assert:
            - "Project.${proj_id}.estimated_net_to_client_cents == 440000"
            - "SettlementStatement.${settle_id}.net_to_client_cents == 302275"
            - "SettlementStatement.${settle_id}.gross_consignment_cents == 525000"

      - name: winning_bid_first_price_vs_second_price
        grounds:
          - calculations.winning_bid_price
          - entities.Lot.fields.winning_bid_price_cents
          - entities.Lot.fields.bid_mode
        distinguishing_aspect: |
          Given identical bids {12000, 15000, 13000} over reserve 10000 with min_increment 1000, the
          FIRST_PRICE lot resolves winning_bid_price_cents=15000 (winner pays own top bid) while the
          SECOND_PRICE lot resolves 14000 (min(15000, 13000+1000)) — a Lot/Bid-domain divergence.
        test_recipe:
          setup:
            - "Project SALE_SETUP with two LISTED bid lots: lotF bid_mode FIRST_PRICE, lotS bid_mode SECOND_PRICE, both reserve 10000, min_increment 1000"
            - "Both lots carry the same three PLACED bids: 12000, 15000, 13000"
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Ben Owner", phone: "555-0111" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "2 Oak St", estimated_total_value_cents: 500000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Coin lot F", is_bid_lot: true, bid_mode: "FIRST_PRICE", list_price_cents: 20000, reserve_price_cents: 10000, min_increment_cents: 1000 }, as: Appraiser, captures: { lotF_id: "$.data.id" } }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Coin lot S", is_bid_lot: true, bid_mode: "SECOND_PRICE", list_price_cents: 20000, reserve_price_cents: 10000, min_increment_cents: 1000 }, as: Appraiser, captures: { lotS_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lotF_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotF_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotS_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotS_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lotF_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotF_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotF_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotS_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotS_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotS_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "POST /estate/bids", payload: { lot_id: "${lotF_id}", amount_cents: 12000, bidder_name: "b1" }, as: Cashier }
            - { call: "POST /estate/bids", payload: { lot_id: "${lotF_id}", amount_cents: 15000, bidder_name: "b2" }, as: Cashier }
            - { call: "POST /estate/bids", payload: { lot_id: "${lotF_id}", amount_cents: 13000, bidder_name: "b3" }, as: Cashier }
            - { call: "POST /estate/bids", payload: { lot_id: "${lotS_id}", amount_cents: 12000, bidder_name: "b1" }, as: Cashier }
            - { call: "POST /estate/bids", payload: { lot_id: "${lotS_id}", amount_cents: 15000, bidder_name: "b2" }, as: Cashier }
            - { call: "POST /estate/bids", payload: { lot_id: "${lotS_id}", amount_cents: 13000, bidder_name: "b3" }, as: Cashier }
          trigger:
            - { call: "PATCH /estate/lots/${lotF_id}", payload: { status: "BID_CLOSED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotS_id}", payload: { status: "BID_CLOSED" }, as: Appraiser }
          assert:
            - "Lot.${lotF_id}.winning_bid_price_cents == 15000"
            - "Lot.${lotS_id}.winning_bid_price_cents == 14000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: commission_marginal_tiered_rate
        grounds:
          - calculations.commission_tiered
          - entities.SettlementStatement.fields.commission_cents
        distinguishing_aspect: |
          Mode (a): non-linear tiered formula. gross_consignment 700000 -> commission
          500000*0.40 + 200000*0.30 = 260000, floored by min_commission 50000; this differs from any
          single flat rate (700000*0.40=280000 or 700000*0.30=210000).
        test_recipe:
          setup:
            - "Project CONTRACTED, min commission 50000; two CONSIGNMENT lots 300000 and 400000 sold at full price (day 0) by CASH; sale closed; project SETTLING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /estate/clients", payload: { name: "Cy Owner", phone: "555-0122" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "3 Pine St", estimated_total_value_cents: 900000, minimum_commission_cents: 50000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Sofa", list_price_cents: 300000, reserve_price_cents: 1000 }, as: Appraiser, captures: { lotA_id: "$.data.id" } }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Rug", list_price_cents: 400000, reserve_price_cents: 1000 }, as: Appraiser, captures: { lotB_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "POST /estate/crews", payload: { name: "Crew B" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-02T00:00:00Z" }, as: SaleManager, captures: { se_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_LIVE" }, as: SaleManager }
            - { call: "PATCH /estate/sale-events/${se_id}", payload: { status: "OPEN" }, as: SaleManager }
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lotA_id}", payment_method: "CASH" }, as: Cashier }
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lotB_id}", payment_method: "CASH" }, as: Cashier }
            - { call: "POST /estate/sale-events/${se_id}/close", payload: {}, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SETTLING" }, as: SaleManager, captures: { proj_v: "$.data.version" } }
          trigger:
            - { call: "POST /estate/settlement-statements", payload: { project_id: "${proj_id}", expected_project_version: "${proj_v}" }, as: SaleManager, captures: { settle_id: "$.data.id" } }
          assert:
            - "SettlementStatement.${settle_id}.commission_cents == 260000"
            - "SettlementStatement.${settle_id}.card_fees_cents == 0"

      - name: card_fee_round_per_transaction_then_sum
        grounds:
          - calculations.card_processing_fee
          - entities.SettlementStatement.fields.card_fees_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned. Two CARD sales of 500 cents each -> per-transaction
          round_half_up(500*0.029=14.5)=15 twice -> 30; the sum-then-round alternative
          round_half_up(1000*0.029=29.0)=29 is explicitly NOT used.
        test_recipe:
          setup:
            - "Project CONTRACTED with min commission 0; two CONSIGNMENT lots priced 500 each sold at full price (day 0) by CARD; sale closed; project SETTLING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /estate/clients", payload: { name: "Di Owner", phone: "555-0133" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "4 Fir St", estimated_total_value_cents: 2000, minimum_commission_cents: 0 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Mug A", list_price_cents: 500, reserve_price_cents: 100 }, as: Appraiser, captures: { lotA_id: "$.data.id" } }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Mug B", list_price_cents: 500, reserve_price_cents: 100 }, as: Appraiser, captures: { lotB_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotA_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lotB_id}", payload: { status: "LISTED" }, as: Appraiser }
            - { call: "POST /estate/crews", payload: { name: "Crew C" }, as: PlatformAdmin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-02T00:00:00Z" }, as: SaleManager, captures: { se_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_LIVE" }, as: SaleManager }
            - { call: "PATCH /estate/sale-events/${se_id}", payload: { status: "OPEN" }, as: SaleManager }
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lotA_id}", payment_method: "CARD" }, as: Cashier }
            - { call: "POST /estate/transactions", payload: { sale_event_id: "${se_id}", lot_id: "${lotB_id}", payment_method: "CARD" }, as: Cashier }
            - { call: "POST /estate/sale-events/${se_id}/close", payload: {}, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SETTLING" }, as: SaleManager, captures: { proj_v: "$.data.version" } }
          trigger:
            - { call: "POST /estate/settlement-statements", payload: { project_id: "${proj_id}", expected_project_version: "${proj_v}" }, as: SaleManager, captures: { settle_id: "$.data.id" } }
          assert:
            - "SettlementStatement.${settle_id}.card_fees_cents == 30"
            - "SettlementStatement.${settle_id}.gross_consignment_cents == 1000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: project_contract_negotiation_cycle
        grounds:
          - state_machines.Project.PROPOSED_to_COUNTERED
          - state_machines.Project.COUNTERED_to_PROPOSED
        distinguishing_aspect: |
          Project revisits PROPOSED after a COUNTERED step (PROPOSED -> COUNTERED -> PROPOSED), a genuine
          revision loop on the Project entity — not a one-way LEAD..SETTLED pipeline.
        test_recipe:
          setup:
            - "Project ASSESSED then PROPOSED"
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Ed Owner", phone: "555-0144" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "5 Ash St", estimated_total_value_cents: 300000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
          trigger:
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "COUNTERED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED", minimum_commission_cents: 60000 }, as: SaleManager }
          assert:
            - "Project.${proj_id}.status == PROPOSED"
            - "Project.${proj_id}.minimum_commission_cents == 60000"

      - name: lot_reprice_revert_cycle
        grounds:
          - state_machines.Lot.LISTED_to_RESEARCHED
          - state_machines.Lot.RESEARCHED_to_PRICED
        distinguishing_aspect: |
          A LISTED lot reverts to RESEARCHED and re-flows to PRICED with a new list_price (5000 -> 6000),
          a cycle back through an earlier state — distinct from the Project negotiation loop and from any
          linear forward-only lot pipeline.
        test_recipe:
          setup:
            - "Project SALE_SETUP with one lot LISTED at list_price 5000"
          setup_api_calls:
            - { call: "POST /estate/clients", payload: { name: "Fi Owner", phone: "555-0155" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "6 Bay St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Lamp", list_price_cents: 5000, reserve_price_cents: 100 }, as: Appraiser, captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "PRICED" }, as: Appraiser }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "SALE_SETUP" }, as: SaleManager }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "STAGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "TAGGED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "LISTED" }, as: Appraiser }
          trigger:
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED", research_notes: "underpriced, redo" }, as: Appraiser }
