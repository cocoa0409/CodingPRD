          - calculations.sponsor_invoice_net_total
          - validations[priority 43]
        distinguishing_aspect: "Three sponsor-held charges of 1200000, 900000 and 100000 are ranked oldest-service-first; the second breaches INVOICE_MAX_GROSS_CENTS so the loop BREAKS, and the 100000 charge that would still have fit under the cap is deliberately left behind - line_count 1, gross 1200000, credit 24000, net 1176000."
        test_recipe:
          setup:
            - "One INVESTIGATOR_INITIATED study (effective indirect rate 0.0) with an APPROVED analysis on item J9999 and three interface-posted charges reviewed to HOLD_FOR_SPONSOR: 1200000 on 2026-08-02, 900000 on 2026-08-03 and 100000 on 2026-08-04."
