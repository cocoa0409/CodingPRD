scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: organization_creation_defaults_applied
        claim_type: defaults_and_creation
        grounds: ["entities.Organization"]
        distinguishing_aspect: "Omitting backup_key_minimum and approved_firmware_versions applies defaults 2 and []; response carries status ACTIVE and version 1."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Default Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"] }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { def_min: $.data.backup_key_minimum, def_fw: $.data.approved_firmware_versions, def_st: $.data.status, def_v: $.data.version }
          assert:
            - "def_min == 2"
            - "def_fw == []"
            - "def_st == ACTIVE"
            - "def_v == 1"

      - name: key_model_duplicate_model_code_rejected
        claim_type: uniqueness_violation
        grounds: ["entities.KeyModel.fields.model_code", "validations[priority=10]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second KeyModel creation with an existing model_code is rejected with ERR_DUPLICATE 409."
        test_recipe:
          setup: ["KeyModel M-Z exists"]
          setup_api_calls:
            - call: "POST /v1/key-models"
              payload: { model_code: "M-Z", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
          trigger:
            - call: "POST /v1/key-models"
              payload: { model_code: "M-Z", connectors: ["USB_A"], protocols: ["U2F"], form_factor: "NANO", unit_price_cents: 200 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { err_dup: $.data.error_id }
          assert:
            - "err_dup == ERR_DUPLICATE"

      - name: employee_creation_creates_identity_account_atomically
        claim_type: computed_field_and_side_effect
        grounds: ["entities.Employee.fields.identity_account_id", "entities.IdentityAccount"]
        distinguishing_aspect: "Employee creation returns identity_account_id and the account starts UNENROLLED with registered_key_count 0 and backup_compliant false."
        test_recipe:
          setup: ["ORG_C1 exists (STANDARD/STANDARD, idp [FIDO2])"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Atomic Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgc1: $.data.id }
          trigger:
            - call: "POST /v1/organizations/${orgc1}/employees"
              payload: { employee_ref: "E-A1", location: "HQ", directory_user_id: "u-a1" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { accta: $.data.identity_account_id }
            - call: "GET /v1/identity-accounts/${accta}"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { accta_st: $.data.status, accta_keys: $.data.registered_key_count, accta_ok: $.data.backup_compliant, accta_dir: $.data.directory_user_id }
          assert:
            - "accta_st == UNENROLLED"
            - "accta_keys == 0"
            - "accta_ok == false"
            - "accta_dir == u-a1 (copied from the employee)"

      - name: purchase_order_line_count_computed_and_input_ignored
        claim_type: computed_field
        grounds: ["entities.PurchaseOrder.fields.line_count"]
        distinguishing_aspect: "line_count is the sum of line quantities computed by the server; a client-supplied value is ignored."
        test_recipe:
          setup: ["ORG_C2 exists; KeyModel M-Y (100c)"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Count Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgc2: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-Y", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
          trigger:
            - call: "POST /v1/organizations/${orgc2}/purchase-orders"
              payload: { lines: [{ model_code: "M-Y", quantity: 7 }], shipping_location: "HQ", line_count: 999 }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { lc: $.data.line_count, qt: $.data.quoted_total_cents, st_c2: $.data.status }
          assert:
            - "lc == 7 (client input 999 ignored)"
            - "qt == 700 (provisional base)"
            - "st_c2 == PENDING_APPROVAL (initial state)"

      - name: security_key_bulk_duplicate_serial_rejected
        claim_type: uniqueness_violation
        grounds: ["entities.SecurityKey.fields.serial_number", "validations[priority=10]"]
        distinguishing_aspect: "Bulk key pre-registration containing a serial_number that already exists is rejected with ERR_DUPLICATE."
        test_recipe:
          setup: ["ORG_C3; KeyModel M-X; APPROVED order PO_C3; key with serial DUP-1 already registered anywhere"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Serial Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgc3: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-X", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgc3}/purchase-orders"
              payload: { lines: [{ model_code: "M-X", quantity: 3 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { poc3: $.data.id, poc3_v: $.data.version }
            - call: "POST /v1/organizations/${orgc3}/purchase-orders/${poc3}/approve"
              payload: { expected_purchase_order_version: "${poc3_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgc3}/purchase-orders/${poc3}/keys"
              payload: { keys: [{ serial_number: "DUP-1", firmware_version: "5.4.3" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
          trigger:
            - call: "POST /v1/organizations/${orgc3}/purchase-orders/${poc3}/keys"
              payload: { keys: [{ serial_number: "DUP-1", firmware_version: "5.4.3" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { err_serial: $.data.error_id }
          assert:
            - "err_serial == ERR_DUPLICATE"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_terminal_state_lockdown_after_quarantine_release_cycle
        claim_type: invalid_transition
        grounds: ["state_machines.PurchaseOrder"]
        distinguishing_aspect: "From QUARANTINED, ship is not a valid transition (only release is); ERR_INVALID_STATE."
        test_recipe:
          setup: ["ORG_S1; KeyModel M-W; order PO_S1 driven to QUARANTINED via approve -> ship -> receive -> quarantine"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Lock Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgs1: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-W", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgs1}/purchase-orders"
              payload: { lines: [{ model_code: "M-W", quantity: 1 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { pos1: $.data.id, pos1_v: $.data.version }
            - call: "POST /v1/organizations/${orgs1}/purchase-orders/${pos1}/approve"
              payload: { expected_purchase_order_version: "${pos1_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgs1}/purchase-orders/${pos1}/ship"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgs1}/purchase-orders/${pos1}/receive"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgs1}/purchase-orders/${pos1}/quarantine"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
          trigger:
            - call: "POST /v1/organizations/${orgs1}/purchase-orders/${pos1}/ship"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { err_s1: $.data.error_id }
          assert:
            - "err_s1 == ERR_INVALID_STATE (QUARANTINED has no ship edge)"

      - name: return_to_stock_blocked_when_enrollment_pending
        claim_type: precondition_enforcement
        grounds: ["state_machines.SecurityKey.ASSIGNED_to_PRE_REGISTERED"]
        distinguishing_aspect: "Return-to-stock requires no PENDING/ACTIVE/EXPIRING ceremony for the key; with a PENDING ceremony it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ORG_S2; KeyModel M-V; employee + account ACCT_S2; RECEIVED order PO_S2; key K_S2 ASSIGNED to ACCT_S2; enrollment EN_S2 PENDING"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Stock2 Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgs2: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-V", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgs2}/employees"
              payload: { employee_ref: "E-T1", location: "HQ", directory_user_id: "u-t1" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { accts2: $.data.identity_account_id }
            - call: "POST /v1/organizations/${orgs2}/purchase-orders"
              payload: { lines: [{ model_code: "M-V", quantity: 1 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { pos2: $.data.id, pos2_v: $.data.version }
            - call: "POST /v1/organizations/${orgs2}/purchase-orders/${pos2}/approve"
              payload: { expected_purchase_order_version: "${pos2_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgs2}/purchase-orders/${pos2}/ship"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgs2}/purchase-orders/${pos2}/receive"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgs2}/purchase-orders/${pos2}/keys"
              payload: { keys: [{ serial_number: "V-001", firmware_version: "5.4.3" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { ks2: "$.data[0].id" }
            - call: "POST /v1/organizations/${orgs2}/security-keys/${ks2}/assign"
              payload: { identity_account_id: "${accts2}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/identity-accounts/${accts2}/enrollments"
              payload: { security_key_id: "${ks2}" }
              as: SecurityAdmin
              as_user_id: "seca1"
          trigger:
            - call: "POST /v1/organizations/${orgs2}/security-keys/${ks2}/return-to-stock"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { err_s2: $.data.error_id }
          assert:
            - "err_s2 == ERR_INVALID_STATE (PENDING ceremony pins the assignment)"

      - name: use_of_used_grant_idempotency_rejection
        claim_type: idempotency
        grounds: ["state_machines.TemporaryAccessGrant.ACTIVE_to_USED"]
        distinguishing_aspect: "Using the same grant twice: first use succeeds (USED), the identical second request fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ORG_S3; employee EMP_S3 + account ACCT_S3; ACTIVE grant G_S3 (SMART_CARD, 24h)"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Twice Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgs3: $.data.id }
            - call: "POST /v1/organizations/${orgs3}/employees"
              payload: { employee_ref: "E-U1", location: "HQ", directory_user_id: "u-u1" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { emps3: $.data.id, accts3: $.data.identity_account_id }
            - call: "POST /v1/identity-accounts/${accts3}/temporary-access"
              payload: { method: "SMART_CARD", duration_hours: 24 }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { gs3: $.data.id }
          trigger:
            - call: "POST /v1/identity-accounts/${accts3}/temporary-access/${gs3}/use"
              payload: {}
              as: Employee
              as_user_id: "${emps3}"
              captures: { gs3_st: $.data.status }
            - call: "POST /v1/identity-accounts/${accts3}/temporary-access/${gs3}/use"
              payload: {}
              as: Employee
              as_user_id: "${emps3}"
              captures: { err_s3: $.data.error_id }
          assert:
            - "gs3_st == USED"
            - "err_s3 == ERR_INVALID_STATE (second use of a USED grant)"

      - name: initial_state_of_each_entity
        claim_type: initial_state
        grounds: ["state_machines.PurchaseOrder", "state_machines.SecurityKey", "state_machines.TemporaryAccessGrant", "state_machines.HelpDeskCase"]
        distinguishing_aspect: "Fresh entities start in their declared initial states: order PENDING_APPROVAL, key PRE_REGISTERED+UNVERIFIED, grant ACTIVE, case OPEN."
        test_recipe:
          setup: ["ORG_S4; KeyModel M-U; employee + account ACCT_S4; APPROVED order PO_S4"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Init Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgs4: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-U", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgs4}/employees"
              payload: { employee_ref: "E-I1", location: "HQ", directory_user_id: "u-i1" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { accts4: $.data.identity_account_id }
            - call: "POST /v1/organizations/${orgs4}/purchase-orders"
              payload: { lines: [{ model_code: "M-U", quantity: 1 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { pos4: $.data.id, pos4_v: $.data.version, pos4_st: $.data.status }
            - call: "POST /v1/organizations/${orgs4}/purchase-orders/${pos4}/approve"
              payload: { expected_purchase_order_version: "${pos4_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
          trigger:
            - call: "POST /v1/organizations/${orgs4}/purchase-orders/${pos4}/keys"
              payload: { keys: [{ serial_number: "U-001", firmware_version: "5.4.3" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { k_hw: "$.data[0].hardware_status", k_att: "$.data[0].attestation_status" }
            - call: "POST /v1/identity-accounts/${accts4}/temporary-access"
              payload: { method: "SMART_CARD", duration_hours: 4 }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { g_st: $.data.status }
            - call: "POST /v1/help-desk-cases"
              payload: { identity_account_id: "${accts4}", category: "OTHER", description: "check" }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { case_st: $.data.status }
          assert:
            - "pos4_st == PENDING_APPROVAL"
            - "k_hw == PRE_REGISTERED and k_att == UNVERIFIED"
            - "g_st == ACTIVE"
            - "case_st == OPEN"

      - name: lost_key_resolve_revokes_distributes_and_replaces
        claim_type: valid_transition_with_cascade
        grounds: ["state_machines.HelpDeskCase.PENDING_REVIEW_to_RESOLVED", "calculations.replacement_key_selection"]
        distinguishing_aspect: "REVOKED_AND_REPLACED resolution cascades: old key REVOKED, its ACTIVE enrollment REVOKED, account counters recomputed, and a replacement ceremony created in PENDING bound to the selected spare key."
        test_recipe:
          setup:
            - "ORG_S5 (STANDARD/STANDARD, idp [FIDO2], minimum 2); device D_S5 (USB_C, FIDO2)"
            - "KeyModel M-T (150c, USB_C, FIDO2)"
            - "employee + account ACCT_S5; RECEIVED order PO_S5 with keys K_LOST (enrolled ACTIVE) and K_SPARE (PRE_REGISTERED, VERIFIED, eligible)"
            - "case CASE_S5 opened by hd1, submitted to review"
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Lost Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgs5: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-T", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 150 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgs5}/devices"
              payload: { asset_tag: "D-S5", platform: "WINDOWS", connectors: ["USB_C"], protocol_capability: ["FIDO2"] }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgs5}/employees"
              payload: { employee_ref: "E-L1", location: "HQ", directory_user_id: "u-l1" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { accts5: $.data.identity_account_id }
            - call: "POST /v1/organizations/${orgs5}/purchase-orders"
              payload: { lines: [{ model_code: "M-T", quantity: 2 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { pos5: $.data.id, pos5_v: $.data.version }
            - call: "POST /v1/organizations/${orgs5}/purchase-orders/${pos5}/approve"
              payload: { expected_purchase_order_version: "${pos5_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgs5}/purchase-orders/${pos5}/ship"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgs5}/purchase-orders/${pos5}/receive"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgs5}/purchase-orders/${pos5}/keys"
              payload: { keys: [{ serial_number: "T-001", firmware_version: "5.4.3" }, { serial_number: "T-002", firmware_version: "5.4.3" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { k_lost: "$.data[0].id", k_spare: "$.data[1].id" }
            - call: "POST /v1/organizations/${orgs5}/security-keys/${k_lost}/attest"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgs5}/security-keys/${k_spare}/attest"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgs5}/security-keys/${k_lost}/assign"
              payload: { identity_account_id: "${accts5}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgs5}/security-keys/${k_lost}/mark-distributed"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/identity-accounts/${accts5}/enrollments"
              payload: { security_key_id: "${k_lost}" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { en_lost: $.data.id }
            - call: "GET /v1/identity-accounts/${accts5}"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { av_s5: $.data.version }
            - call: "POST /v1/identity-accounts/${accts5}/enrollments/${en_lost}/activate"
              payload: { expected_identity_account_version: "${av_s5}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/help-desk-cases"
              payload: { identity_account_id: "${accts5}", category: "LOST_KEY", description: "lost at airport" }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { case_s5: $.data.id }
            - call: "POST /v1/help-desk-cases/${case_s5}/submit-review"
              payload: {}
              as: HelpDeskAgent
              as_user_id: "hd1"
          trigger:
            - call: "POST /v1/help-desk-cases/${case_s5}/resolve"
              payload: { resolution: "REVOKED_AND_REPLACED" }
              as: HelpDeskAgent
              as_user_id: "hd2"
              captures: { case_s5_st: $.data.status, case_s5_res: $.data.resolution }
            - call: "GET /v1/organizations/${orgs5}/security-keys"
              payload: { purchase_order_id: "${pos5}" }
              as: HelpDeskAgent
              as_user_id: "hd2"
              captures: { k_lost_hw: "$.data[0].hardware_status", k_spare_hw: "$.data[1].hardware_status" }
            - call: "GET /v1/identity-accounts/${accts5}/enrollments"
              payload: {}
              as: HelpDeskAgent
              as_user_id: "hd2"
              captures: { en_old_st: "$.data[0].status" }
            - call: "GET /v1/identity-accounts/${accts5}"
              payload: {}
              as: HelpDeskAgent
              as_user_id: "hd2"
              captures: { accts5_keys: $.data.registered_key_count }
          assert:
            - "case_s5_st == RESOLVED and case_s5_res == REVOKED_AND_REPLACED"
            - "k_lost_hw == REVOKED"
            - "en_old_st == REVOKED"
            - "k_spare_hw == ASSIGNED (selector auto-assigned the spare)"
            - "accts5_keys == 0 (the replacement ceremony is PENDING, not counted)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: fleet_fit_report_counts_and_uncovered_list
        claim_type: correct_result
        grounds: ["calculations.fleet_fit_report"]
        distinguishing_aspect: "Fleet-fit math: 3 ACTIVE devices (2 fit, 1 not) against model M-F1 yield coverage_pct 67 (round_half_up of 66.66...) and the uncovered list contains exactly the misfit device."
        test_recipe:
          setup:
            - "ORG_F1 (STANDARD/STANDARD, idp [FIDO2])"
            - "KeyModel M-F1 (USB_C, FIDO2)"
            - "Devices: D1 (USB_C, FIDO2), D2 (USB_C + NFC, FIDO2), D3 (LIGHTNING, U2F) — D3 misfits on both axes; one RETIRED device D4 excluded from the computation"
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Fit Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgf1: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-F1", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgf1}/devices"
              payload: { asset_tag: "D-1", platform: "WINDOWS", connectors: ["USB_C"], protocol_capability: ["FIDO2"] }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgf1}/devices"
              payload: { asset_tag: "D-2", platform: "MACOS", connectors: ["USB_C", "NFC"], protocol_capability: ["FIDO2"] }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgf1}/devices"
              payload: { asset_tag: "D-3", platform: "IOS", connectors: ["LIGHTNING"], protocol_capability: ["U2F"] }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { d3: $.data.id }
            - call: "POST /v1/organizations/${orgf1}/devices"
              payload: { asset_tag: "D-4", platform: "LINUX", connectors: ["LIGHTNING"], protocol_capability: ["U2F"], lifecycle_status: "RETIRED" }
              as: SecurityAdmin
              as_user_id: "seca1"
          trigger:
            - call: "GET /v1/organizations/${orgf1}/fleet-fit"
              payload: { model_code: "M-F1" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { fit_pct: $.data.coverage_pct, fit_total: $.data.total_devices, fit_unc: $.data.uncovered_device_ids }
          assert:
            - "fit_total == 3 (RETIRED device excluded)"
            - "fit_pct == 67"
            - "fit_unc == [${d3}]"

      - name: fleet_fit_empty_fleet_rejected
        claim_type: boundary_condition
        grounds: ["calculations.fleet_fit_report", "errors[ERR_EMPTY_FLEET]"]
        distinguishing_aspect: "Zero ACTIVE devices -> ERR_EMPTY_FLEET (empty-set edge), not a division by zero or 0% report."
        test_recipe:
          setup: ["ORG_F2 with no devices; KeyModel M-F2"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Empty Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgf2: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-F2", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
          trigger:
            - call: "GET /v1/organizations/${orgf2}/fleet-fit"
              payload: { model_code: "M-F2" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { err_f2: $.data.error_id }
          assert:
            - "err_f2 == ERR_EMPTY_FLEET"

      - name: replacement_selector_cheapest_first_then_created_at
        claim_type: selector_determinism
        grounds: ["calculations.replacement_key_selection"]
        distinguishing_aspect: "Selector ranking verified: two eligible spares of different prices pick the cheaper; two equal-price spares pick the one created first (created_at ASC tie-break)."
        test_recipe:
          setup:
            - "ORG_F3 (STANDARD/STANDARD, idp [FIDO2], min 2); device D_F3 (USB_C, FIDO2)"
            - "KeyModels M-CH (100c) and M-EX (300c), both USB_C/FIDO2"
            - "employee + account ACCT_F3 with ACTIVE enrollment on key K_OLD"
            - "RECEIVED order PO_F3 with spare keys: K_EXP (M-EX, created first), K_CHEAP (M-CH, created second), K_CHEAP2 (M-CH, created third)"
            - "case CASE_F3 in PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Select Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgf3: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-CH", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/key-models"
              payload: { model_code: "M-EX", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 300 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgf3}/devices"
              payload: { asset_tag: "D-F3", platform: "WINDOWS", connectors: ["USB_C"], protocol_capability: ["FIDO2"] }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgf3}/employees"
              payload: { employee_ref: "E-F3", location: "HQ", directory_user_id: "u-f3" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { acctf3: $.data.identity_account_id }
            - call: "POST /v1/organizations/${orgf3}/purchase-orders"
              payload: { lines: [{ model_code: "M-CH", quantity: 3 }, { model_code: "M-EX", quantity: 1 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { pof3: $.data.id, pof3_v: $.data.version }
            - call: "POST /v1/organizations/${orgf3}/purchase-orders/${pof3}/approve"
              payload: { expected_purchase_order_version: "${pof3_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgf3}/purchase-orders/${pof3}/ship"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgf3}/purchase-orders/${pof3}/receive"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/organizations/${orgf3}/purchase-orders/${pof3}/keys"
              payload: { keys: [{ serial_number: "F-EXP", model_code: "M-EX", firmware_version: "5.4.3" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { k_exp: "$.data[0].id" }
            - call: "POST /v1/organizations/${orgf3}/purchase-orders/${pof3}/keys"
              payload: { keys: [{ serial_number: "F-CH1", model_code: "M-CH", firmware_version: "5.4.3" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { k_cheap: "$.data[0].id" }
            - call: "POST /v1/organizations/${orgf3}/purchase-orders/${pof3}/keys"
              payload: { keys: [{ serial_number: "F-CH2", model_code: "M-CH", firmware_version: "5.4.3" }, { serial_number: "F-OLD", model_code: "M-CH", firmware_version: "5.4.3" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { k_cheap2: "$.data[0].id", k_old: "$.data[1].id" }
            - call: "POST /v1/organizations/${orgf3}/security-keys/${k_old}/attest"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgf3}/security-keys/${k_old}/assign"
              payload: { identity_account_id: "${acctf3}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgf3}/security-keys/${k_old}/mark-distributed"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logc1"
            - call: "POST /v1/identity-accounts/${acctf3}/enrollments"
              payload: { security_key_id: "${k_old}" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { en_f3: $.data.id }
            - call: "GET /v1/identity-accounts/${acctf3}"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { av_f3: $.data.version }
            - call: "POST /v1/identity-accounts/${acctf3}/enrollments/${en_f3}/activate"
              payload: { expected_identity_account_version: "${av_f3}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/help-desk-cases"
              payload: { identity_account_id: "${acctf3}", category: "LOST_KEY", description: "lost" }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { case_f3: $.data.id }
            - call: "POST /v1/help-desk-cases/${case_f3}/submit-review"
              payload: {}
              as: HelpDeskAgent
              as_user_id: "hd1"
          trigger:
            - call: "POST /v1/help-desk-cases/${case_f3}/resolve"
              payload: { resolution: "REVOKED_AND_REPLACED" }
              as: HelpDeskAgent
              as_user_id: "hd2"
            - call: "GET /v1/identity-accounts/${acctf3}/enrollments"
              payload: { status: "PENDING" }
              as: HelpDeskAgent
              as_user_id: "hd2"
              captures: { repl_key: "$.data[0].security_key_id" }
          assert:
            - "repl_key == ${k_cheap} (cheapest model first; equal-price tie broken by earliest created_at, so K_CH1 beats K_CH2 and K_EXP)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers fails priority-1 auth before anything else: ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/organizations"
              payload: { legal_name: "No Auth", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"] }
              as: Anonymous
              captures: { err_auth: $.data.error_id }
          assert:
            - "err_auth == ERR_UNAUTHENTICATED"

      - name: unknown_organization_id_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Referencing a non-existent organization id in the path returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/organizations/00000000-0000-0000-0000-000000000000/devices"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { err_nf: $.data.error_id }
          assert:
            - "err_nf == ERR_NOT_FOUND"

      - name: cross_org_reference_returns_not_found_not_forbidden
        claim_type: cross_entity_validation
        grounds: ["validations[priority=4]"]
        distinguishing_aspect: "A key created under ORG_A addressed via ORG_B's path prefix returns ERR_NOT_FOUND (scoping rule), never ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["ORG_V1 and ORG_V2 exist; KeyModel M-VV; APPROVED order PO_V1 under ORG_V1 with key K_V1"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Org V1", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgv1: $.data.id }
            - call: "POST /v1/organizations"
              payload: { legal_name: "Org V2", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgv2: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-VV", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgv1}/purchase-orders"
              payload: { lines: [{ model_code: "M-VV", quantity: 1 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { pov1: $.data.id, pov1_v: $.data.version }
            - call: "POST /v1/organizations/${orgv1}/purchase-orders/${pov1}/approve"
              payload: { expected_purchase_order_version: "${pov1_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
            - call: "POST /v1/organizations/${orgv1}/purchase-orders/${pov1}/keys"
              payload: { keys: [{ serial_number: "VV-1", firmware_version: "5.4.3" }] }
              as: LogisticsCoordinator
              as_user_id: "logc1"
              captures: { kv1: "$.data[0].id" }
          trigger:
            - call: "POST /v1/organizations/${orgv2}/security-keys/${kv1}/attest"
              payload: {}
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { err_v: $.data.error_id }
          assert:
            - "err_v == ERR_NOT_FOUND (cross-org reference hidden as 404)"

      - name: segregation_of_duties_on_purchase_approval
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The SecurityAdmin whose X-User-ID equals the order's created_by cannot approve; a different SecurityAdmin can."
        test_recipe:
          setup: ["ORG_V3; KeyModel M-V3; order PO_V3 created by proca1 (note: creator role is ProcurementAdmin; the SoD check compares the recorded created_by with the approver id)"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "SoD Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgv3: $.data.id }
            - call: "POST /v1/key-models"
              payload: { model_code: "M-V3", connectors: ["USB_C"], protocols: ["FIDO2"], form_factor: "KEYCHAIN", unit_price_cents: 100 }
              as: PlatformAdmin
              as_user_id: "pa1"
            - call: "POST /v1/organizations/${orgv3}/purchase-orders"
              payload: { lines: [{ model_code: "M-V3", quantity: 1 }], shipping_location: "HQ" }
              as: ProcurementAdmin
              as_user_id: "shared-user"
              captures: { pov3: $.data.id, pov3_v: $.data.version }
          trigger:
            - call: "POST /v1/organizations/${orgv3}/purchase-orders/${pov3}/approve"
              payload: { expected_purchase_order_version: "${pov3_v}" }
              as: SecurityAdmin
              as_user_id: "shared-user"
              captures: { err_v3: $.data.error_id }
            - call: "POST /v1/organizations/${orgv3}/purchase-orders/${pov3}/approve"
              payload: { expected_purchase_order_version: "${pov3_v}" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { pov3_st: $.data.status }
          assert:
            - "err_v3 == ERR_SEGREGATION_OF_DUTIES (same user id as created_by)"
            - "pov3_st == APPROVED (different approver succeeds)"

      - name: grant_duration_outside_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_GRANT_WINDOW]"]
        distinguishing_aspect: "duration_hours 0 and 73 are both outside [1,72]; both rejected with ERR_GRANT_WINDOW while 72 succeeds."
        test_recipe:
          setup: ["ORG_V4; employee + account ACCT_V4"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Window2 Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgv4: $.data.id }
            - call: "POST /v1/organizations/${orgv4}/employees"
              payload: { employee_ref: "E-V4", location: "HQ", directory_user_id: "u-v4" }
              as: SecurityAdmin
              as_user_id: "seca1"
              captures: { acctv4: $.data.identity_account_id }
          trigger:
            - call: "POST /v1/identity-accounts/${acctv4}/temporary-access"
              payload: { method: "SMART_CARD", duration_hours: 0 }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { err_h0: $.data.error_id }
            - call: "POST /v1/identity-accounts/${acctv4}/temporary-access"
              payload: { method: "SMART_CARD", duration_hours: 73 }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { err_h73: $.data.error_id }
            - call: "POST /v1/identity-accounts/${acctv4}/temporary-access"
              payload: { method: "SMART_CARD", duration_hours: 72 }
              as: HelpDeskAgent
              as_user_id: "hd1"
              captures: { g72: $.data.status }
          assert:
            - "err_h0 == ERR_GRANT_WINDOW"
            - "err_h73 == ERR_GRANT_WINDOW"
            - "g72 == ACTIVE (72 is the inclusive upper bound)"

      - name: second_active_subscription_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=10]", "entities.Subscription"]
        distinguishing_aspect: "At most one ACTIVE subscription per organization: the second create fails with ERR_DUPLICATE even though each row is individually valid."
        test_recipe:
          setup: ["ORG_V5 with an ACTIVE subscription"]
          setup_api_calls:
            - call: "POST /v1/organizations"
              payload: { legal_name: "Sub Org", assurance_tier: "STANDARD", authentication_policy: "STANDARD", idp_protocols: ["FIDO2"], backup_key_minimum: 2 }
              as: PlatformAdmin
              as_user_id: "pa1"
              captures: { orgv5: $.data.id }
            - call: "POST /v1/organizations/${orgv5}/subscriptions"
              payload: { tier: "BASIC", refresh_interval_days: 30, replacement_credits_total: 10 }
              as: ProcurementAdmin
              as_user_id: "proca1"
          trigger:
            - call: "POST /v1/organizations/${orgv5}/subscriptions"
              payload: { tier: "ENTERPRISE", refresh_interval_days: 60, replacement_credits_total: 20 }
              as: ProcurementAdmin
              as_user_id: "proca1"
              captures: { err_v5: $.data.error_id }
          assert:
            - "err_v5 == ERR_DUPLICATE"

