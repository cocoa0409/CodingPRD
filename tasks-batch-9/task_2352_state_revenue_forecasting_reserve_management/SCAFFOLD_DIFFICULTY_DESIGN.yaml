  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # Two DIFFERENT entity pairs:
  #   (ConsensusRound, ForecastCycle)
  #   (RatingAgencyBriefing, ReserveFund)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: consensus_round_open_depends_on_forecast_cycle_being_locked
        grounds:
          - validations[priority 10 ERR_CYCLE_NOT_LOCKED]
          - state_machines.ForecastCycle.DRAFT_to_INPUTS_LOCKED
          - state_machines.ForecastCycle.INPUTS_LOCKED_to_IN_CONSENSUS
          - concurrency_rules[round-open-stale-cycle]
          - endpoints[POST /consensus-rounds]
        distinguishing_aspect: |
          A ConsensusRound's creation is gated on a state that lives on a different entity: the very
          same POST body, with the correct expected_cycle_version pinned each time, is rejected with
          ERR_CYCLE_NOT_LOCKED (409) while the ForecastCycle is DRAFT and accepted once the cycle has
          been moved to INPUTS_LOCKED — proving the gate is the cycle's status, not the request.
        test_recipe:
          setup:
            - "One FY2027 cycle in DRAFT with all three scenarios (weights summing to 10000) and two ACTIVE revenue sources — everything lock-inputs needs, but lock-inputs has not been called."
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /revenue-sources"
