          assert:
            - "response error_id == ERR_GUEST_NOT_CLEARED"
            - "response status == 409"

      - name: departure_confirm_requires_vehicle_available
        grounds:
          - state_machines.Departure.SCHEDULED_to_CONFIRMED
          - entities.Vehicle.fields.status
          - errors[ERR_VEHICLE_UNAVAILABLE]
        distinguishing_aspect: |
          Departure SCHEDULED->CONFIRMED depends on the assigned Vehicle's state: if Vehicle.status is
          OUT_OF_SERVICE the confirm is rejected with ERR_VEHICLE_UNAVAILABLE — a Departure->Vehicle
          cross-entity dependency, a different entity pair than Booking->Guest.
        test_recipe:
          setup:
            - "SCHEDULED departure with a CONFIRMED stop and a RESERVED booking party 4, but its van set OUT_OF_SERVICE"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /partner-venues"
              payload: { name: "Oak", kind: "WINERY", commission_pct: 0.10, tasting_cost_per_guest_cents: 1200 }
              as: Operator
              captures: { venue_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { dep_id: $.data.id, dep_v0: $.data.version }
            - call: "POST /stops"
              payload: { departure_id: "${dep_id}", partner_venue_id: "${venue_id}", sequence: 1, dwell_minutes: 60 }
              as: Operator
              captures: { stop_id: $.data.id }
            - call: "POST /venue-confirmations"
              payload: { stop_id: "${stop_id}", requested_headcount: 4 }
              as: Operator
              captures: { vc_id: $.data.id }
            - call: "POST /venue-confirmations/${vc_id}/confirm"
              payload: {}
              as: PartnerVenue
              as_user_id: "${venue_id}"
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/reserve"
              payload: { expected_departure_version: "${dep_v0}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /vehicles/${veh_id}/set-status"
              payload: { status: "OUT_OF_SERVICE" }
              as: Operator
          trigger:
            - call: "POST /departures/${dep_id}/confirm"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VEHICLE_UNAVAILABLE"
            - "response status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: shared_van_seat_pool_aggregate_capacity_overlap
        grounds:
          - validations[priority=21]
          - entities.Departure.fields.seats_taken
          - entities.Departure.fields.seat_capacity
          - errors[ERR_SEAT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics = AGGREGATE-CAPACITY occupation of a shared van seat pool: many bookings overlap on
          the same Departure resource and are rejected only when their summed party_size would exceed seat_capacity
          (sum-based, not pairwise geometric). Reaches ERR_SEAT_CAPACITY_EXCEEDED on the Departure resource.
        test_recipe:
          setup:
            - "SCHEDULED departure seat_capacity 10 with two RESERVED bookings party 4 and party 4 (seats_taken 8); a DRAFT booking party 4 (8+4 > 10)"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 10 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { dep_id: $.data.id, dep_v0: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G1", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g1_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G2", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g2_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G3", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g3_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g1_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /bookings/${b1_id}/reserve"
              payload: { expected_departure_version: "${dep_v0}" }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { dep_v1: $.data.version }
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g2_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g2_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /bookings/${b2_id}/reserve"
              payload: { expected_departure_version: "${dep_v1}" }
              as: Guest
              as_user_id: "${g2_id}"
              captures: { dep_v2: $.data.version }
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g3_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g3_id}"
              captures: { b3_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b3_id}/reserve"
              payload: { expected_departure_version: "${dep_v2}" }
              as: Guest
              as_user_id: "${g3_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SEAT_CAPACITY_EXCEEDED"
            - "Departure.${dep_id}.seats_taken == 8"

      - name: private_charter_whole_van_exclusive_occupation
        grounds:
          - validations[priority=17]
          - entities.Departure.fields.is_private_charter
          - errors[ERR_CHARTER_WHOLE_VAN_REQUIRED]
        distinguishing_aspect: |
          Interval semantics = EXCLUSIVE whole-resource occupation: a private-charter Departure admits exactly one
          booking that must take the entire seat_capacity; a booking smaller than the full van (or a second booking)
          collides with the exclusivity rule and is rejected with ERR_CHARTER_WHOLE_VAN_REQUIRED. This is whole-van
          exclusivity, not the additive aggregate-capacity arithmetic of the shared-pool overlap above.
        test_recipe:
          setup:
            - "Private-charter SCHEDULED departure on a 12-seat van; a DRAFT booking party 6 (less than the whole van)"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000, charter_fee_cents: 5000 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z", is_private_charter: true }
              as: Operator
              captures: { dep_id: $.data.id, dep_v0: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 6 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/reserve"
              payload: { expected_departure_version: "${dep_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHARTER_WHOLE_VAN_REQUIRED"
            - "response status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_pool_conserved_under_reserve_then_cancel
        grounds:
          - state_machines.Booking.DRAFT_to_RESERVED
          - state_machines.Booking.RESERVED_to_CANCELLED
          - entities.Departure.fields.seats_taken
        distinguishing_aspect: |
          Conserved quantity = SEAT COUNT. Invariant pinned as Departure.seats_taken == sum of party_size over
          Bookings in {RESERVED,PAID,CHECKED_IN}. A reserve (party 6, seats_taken 0->6) paired with its cancel
          (seats_taken 6->0) leaves seats_taken back at 0 — no seat drift.
        test_recipe:
          setup:
            - "SCHEDULED departure seat_capacity 12, seats_taken 0; a DRAFT booking party 6"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { dep_id: $.data.id, dep_v0: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 6 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/reserve"
              payload: { expected_departure_version: "${dep_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { seats_after_reserve: $.data.version }
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "GET /departures/${dep_id}"
              payload: {}
              as: Operator
              captures: { seats_final: $.data.seats_taken }
          assert:
            - "Departure.${dep_id}.seats_taken == 0"

      - name: payment_ledger_conserved_under_pay_then_weather_refund
        grounds:
          - state_machines.Booking.RESERVED_to_PAID
          - state_machines.Departure.CONFIRMED_to_CANCELLED_WEATHER
          - entities.Booking.fields.amount_paid_cents
          - entities.Booking.fields.refund_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (net charge = amount_paid_cents - refund_cents). A pay (amount_paid 71154)
          paired with a weather cancellation (refund 71154, 100% override) leaves net charge == 0 — distinct
          conserved quantity (money) from the seat-count invariant above.
        test_recipe:
          setup:
            - "CONFIRMED departure with one CONFIRMED stop and one PAID booking party 6 cheese (amount_paid 71154)"
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000, gratuity_pct: 0.18 }
              as: Operator
              captures: { prod_id: $.data.id }
            - call: "POST /tour-products/${prod_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /add-ons"
              payload: { tour_product_id: "${prod_id}", name: "Cheese", price_per_person_cents: 1500 }
              as: Operator
              captures: { addon_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /partner-venues"
              payload: { name: "Oak", kind: "WINERY", commission_pct: 0.10, tasting_cost_per_guest_cents: 1200 }
              as: Operator
              captures: { venue_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${prod_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { dep_id: $.data.id, dep_v0: $.data.version }
            - call: "POST /stops"
              payload: { departure_id: "${dep_id}", partner_venue_id: "${venue_id}", sequence: 1, dwell_minutes: 60 }
              as: Operator
              captures: { stop_id: $.data.id }
            - call: "POST /venue-confirmations"
              payload: { stop_id: "${stop_id}", requested_headcount: 6 }
              as: Operator
              captures: { vc_id: $.data.id }
            - call: "POST /venue-confirmations/${vc_id}/confirm"
              payload: {}
              as: PartnerVenue
              as_user_id: "${venue_id}"
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
            - call: "POST /_verify/age"
              payload: { guest_id: "${g_id}" }
              as: Operator
            - call: "POST /guests/${g_id}/sign-waiver"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /bookings"
              payload: { departure_id: "${dep_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 6, add_on_id: "${addon_id}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/reserve"
              payload: { expected_departure_version: "${dep_v0}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /bookings/${b_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { paid: $.data.amount_paid_cents }
            - call: "POST /departures/${dep_id}/confirm"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /departures/${dep_id}/cancel-weather"
              payload: { cancel_reason: "storm" }
              as: Operator
            - call: "GET /bookings/${b_id}"
              payload: {}
              as: Operator
              captures: { paid_final: $.data.amount_paid_cents, refund_final: $.data.refund_cents }
          assert:
            - "Booking.${b_id}.amount_paid_cents == 71154"
            - "Booking.${b_id}.refund_cents == 71154"
            - "Booking.${b_id}.amount_paid_cents - Booking.${b_id}.refund_cents == 0"
