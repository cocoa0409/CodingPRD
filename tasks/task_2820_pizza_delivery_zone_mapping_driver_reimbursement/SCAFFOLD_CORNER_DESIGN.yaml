              payload: { order_id: "${ord_id}", hot_bag_slots: 1 }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { stop_id: $.data.id }
            - call: "POST /store-ops/dispatches/${dsp_id}/lock"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /store-ops/dispatches/${dsp_id}/depart"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:36:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/dispatches/${dsp_id}/stops/${stop_id}/door-arrival"
              payload: { actual_miles: 3.40, cash_collected_cents: 0 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { gross_before_remake: $.data.status }
          trigger:
            - call: "POST /store-ops/orders/${ord_id}/remake"
              payload: { reason: "LATE" }
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "${gross_before_remake} == 'DELIVERED', the stop having been delivered before the remake"
            - "Order.${ord_id}.fulfillment_status == 'REMAKE_QUEUED' and settlement_status == 'ADJUSTED'"
            - "Order.${ord_id}.remake_count == 1 and remake_credit_cents == 2200"
            - "Order.${ord_id}.remake_hold_minutes == 0, because the remake was raised at the same logical instant as the door arrival"
            - "Order.${ord_id}.door_arrival_at == null, order_to_door_gross_minutes == null and order_to_door_net_minutes == null"
            - "DispatchStop.${stop_id}.status == 'REMADE' and its actual_miles is still 3.40"
            - "Dispatch.${dsp_id}.status is still 'EN_ROUTE' and actual_reimbursement_cents is still null"
            - "Store.${store_id}.unassigned_order_count == 1, REMAKE_QUEUED being one of the four counted statuses"
            - "GET /store-ops/reimbursement-lines?dispatch_id=${dsp_id} still reports exactly 1 line, of line_type PROVISIONAL_STOP and status PROVISIONAL, so Driver.${drv_id}.reimbursement_accrued_cents == 0"

  - section: calculations
    instances:

      - name: grid_distance_adds_both_axis_deltas_instead_of_euclidean
        claim_type: correct_result
        grounds:
          - calculations.grid_distance_miles
          - entities.ServiceAddress.fields.grid_miles
          - entities.ServiceAddress.fields.drive_time_estimate_minutes
        distinguishing_aspect: "An address 90000 micro-degrees north and 45000 micro-degrees west of the store is 9.00 rectilinear miles away, not the 6.71 Euclidean miles a Pythagorean implementation would report, and the drive time 6 + ceil(9.00 * 3) = 33 inherits the difference."
        test_recipe:
          setup:
            - "A store at (39000000, -84000000) with an ACTIVE zone version whose model is base 6, minutes_per_mile 3, ceiling 40."
            - "The logical clock sits at 09:00Z, outside PEAK_HOURS_UTC."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "90 Grid Ave", latitude_micro: 39090000, longitude_micro: -84045000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_id: $.data.id, addr_miles: $.data.grid_miles, addr_drive: $.data.drive_time_estimate_minutes }
          assert:
            - "${addr_miles} == 9.00, i.e. (90000 + 45000) / 15000, NOT the Euclidean 6.71"
            - "${addr_drive} == 33, i.e. 6 + ceil(9.00 * 3) + 0"
            - "ServiceAddress.${addr_id}.zone_state == 'IN_ZONE', because 33 <= 40"
            - "ServiceAddress.${addr_id}.zone_version_id == ${zv1_id}, the model that priced it"

      - name: grid_distance_rounds_half_up_and_the_ceil_term_inherits_the_extra_cent_of_a_mile
        claim_type: precision
        grounds:
          - calculations.grid_distance_miles
          - calculations.drive_time_estimate
          - entities.ServiceAddress.fields.grid_miles
        distinguishing_aspect: "A raw 6.665 miles must round HALF UP to 6.67, and because the per-mile term is a ceil, that single hundredth of a mile is observable in the drive time: 6 + ceil(6.67 * 3) = 6 + ceil(20.01) = 27, whereas truncating to 6.66 would give 6 + ceil(19.98) = 26."
        test_recipe:
          setup:
            - "A store at (39000000, -84000000) with an ACTIVE zone version: base 6, minutes_per_mile 3, ceiling 40."
            - "The logical clock sits at 09:00Z, outside PEAK_HOURS_UTC."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "665 Halfway Ln", latitude_micro: 39066650, longitude_micro: -84033325, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_id: $.data.id, addr_miles: $.data.grid_miles, addr_drive: $.data.drive_time_estimate_minutes }
          assert:
            - "${addr_miles} == 6.67, the half-up rounding of (66650 + 33325) / 15000 == 6.665"
            - "${addr_drive} == 27, NOT 26, so the rounding happened before the ceil term"
            - "ServiceAddress.${addr_id}.zone_state == 'IN_ZONE', because 27 <= 40"

      - name: drive_time_surcharge_is_the_max_of_peak_and_barrier_not_their_sum
        claim_type: constants_applied
        grounds:
          - calculations.drive_time_estimate
          - entities.ZoneVersion.fields.peak_surcharge_minutes
          - entities.ZoneVersion.fields.barrier_surcharge_minutes
          - entities.ServiceAddress.fields.crosses_barrier
        distinguishing_aspect: "At 18:00Z (inside PEAK_HOURS_UTC) with crosses_barrier true, both surcharges are live but only the larger one is charged: 6 + ceil(3.00 * 3) + max(7, 4) = 22, not the summed 26 and not the base-only 15."
        test_recipe:
          setup:
            - "A store with an ACTIVE zone version: base 6, minutes_per_mile 3, peak 7, barrier 4, ceiling 40."
            - "The logical clock sits at 18:00Z, which is one of PEAK_HOURS_UTC [17, 18, 19, 20]."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T18:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "12 Bridge St", latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: true }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_id: $.data.id, addr_miles: $.data.grid_miles, addr_drive: $.data.drive_time_estimate_minutes }
          assert:
            - "${addr_miles} == 3.00"
            - "${addr_drive} == 22, NOT 26 (sum of both surcharges) and NOT 15 (neither surcharge)"
            - "ServiceAddress.${addr_id}.zone_state == 'IN_ZONE', because 22 <= 40"
            - "an order placed against ${addr_id} prices at fee_tier 'MID', because 15 < 22 <= 25, so the surcharge choice is visible in the customer's fee too"

      - name: drive_time_ceiling_boundary_separates_in_zone_from_edge
        claim_type: threshold
        grounds:
          - calculations.zone_state_classification
          - entities.ZoneVersion.fields.max_drive_time_minutes
        excluded_because:
          difficulty_instance: boundary_precision_check / drive_time_ceiling_is_inclusive_at_forty_and_edge_at_forty_one
          rationale: "That §1.8 instance places two addresses one hundredth of a mile apart on either side of the ceiling and asserts 40 -> IN_ZONE, 41 -> EDGE, which is exactly the threshold-boundary claim for this calculation."

      - name: on_ring_address_is_inside_while_one_micro_degree_outside_is_out_of_zone
        claim_type: correct_result
        grounds:
          - calculations.zone_state_classification
          - entities.ServiceAddress.fields.zone_state
          - entities.ZoneVersion.fields.polygon
        distinguishing_aspect: "Two addresses with IDENTICAL grid_miles 13.33 and drive time 46 classify differently: the one lying exactly on the western ring segment counts as INSIDE and is therefore EDGE (disputable), while the one a single micro-degree further west is OUT_OF_ZONE — so there is no tolerance band and no epsilon."
        test_recipe:
          setup:
            - "A store at (39000000, -84000000) whose ACTIVE ring has its western segment at longitude_micro -84200000, ceiling 40."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "1 Ring Rd", latitude_micro: 39000000, longitude_micro: -84200000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_e_id: $.data.id, e_miles: $.data.grid_miles, e_drive: $.data.drive_time_estimate_minutes, e_state: $.data.zone_state }
          trigger:
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "2 Ring Rd", latitude_micro: 39000000, longitude_micro: -84200001, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_o_id: $.data.id, o_miles: $.data.grid_miles, o_drive: $.data.drive_time_estimate_minutes, o_state: $.data.zone_state }
          assert:
            - "${e_miles} == 13.33 and ${o_miles} == 13.33, the two addresses being indistinguishable on distance"
            - "${e_drive} == 46 and ${o_drive} == 46, both over the ceiling of 40"
            - "${e_state} == 'EDGE', because a point exactly on a ring segment counts as INSIDE and the ceiling test then demotes it"
            - "${o_state} == 'OUT_OF_ZONE', one micro-degree being enough to fall outside the ring"
            - "ServiceAddress.${addr_e_id}.effective_zone_state == 'EDGE' and ServiceAddress.${addr_o_id}.effective_zone_state == 'OUT_OF_ZONE', neither having an override"

      - name: delivery_charge_applies_the_tier_surcharge_before_the_waiver
        claim_type: tiered_pricing
        grounds:
          - calculations.customer_delivery_charge
        excluded_because:
          difficulty_instance: combinatorial_formula / delivery_charge_tier_then_waiver_ordering_yields_275
          rationale: "That §1.8 instance pins the MID tier at 549 and then halves it to 275, and contrasts it with the two wrong orderings (274 and 200), which is exactly the tier-boundary / marginal-rate claim for this calculation."

      - name: full_waiver_at_the_three_thousand_cent_threshold_zeroes_the_delivery_fee
        claim_type: threshold
        grounds:
          - calculations.customer_delivery_charge
          - entities.Order.fields.fee_waiver_pct
          - entities.Order.fields.delivery_fee_cents
          - entities.Order.fields.total_charge_cents
        distinguishing_aspect: "food_subtotal_cents exactly at WAIVER_FULL_THRESHOLD_CENTS 3000 gives fee_waiver_pct 100 and delivery_fee_cents 0, so the BASE-tier base fee of 399 vanishes entirely and total_charge_cents is food + tip only (3000 + 0 + 500 = 3500)."
        test_recipe:
          setup:
            - "A store with delivery_fee_cents 399, an ACTIVE zone version and one IN_ZONE address at drive 15 (BASE tier)."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000, delivery_fee_cents: 399 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "12 Oak St", latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_a_id: $.data.id }
          trigger:
            - call: "POST /store-ops/orders"
              payload: { store_id: "${store_id}", service_address_id: "${addr_a_id}", customer_name: "Ann", customer_phone: "555-0101", food_subtotal_cents: 3000, payment_method: "CARD", tip_cents: 500 }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { ord_id: $.data.id, tier: $.data.fee_tier, base_fee: $.data.base_delivery_fee_cents, pct: $.data.fee_waiver_pct, fee: $.data.delivery_fee_cents, total: $.data.total_charge_cents }
          assert:
            - "${tier} == 'BASE' and ${base_fee} == 399, the BASE surcharge being 0"
            - "${pct} == 100 and ${fee} == 0"
            - "${total} == 3500, i.e. 3000 + 0 + 500; the tip is added to the total but never counted toward the waiver test"
            - "Order.${ord_id}.drive_time_snapshot_minutes == 15, the value the tier was read from"

      - name: waiver_thresholds_are_inclusive_so_1999_pays_full_fee_and_2000_pays_half
        claim_type: constants_applied
        grounds:
          - calculations.customer_delivery_charge
          - entities.Order.fields.fee_waiver_pct
        distinguishing_aspect: "One cent decides the fee: food 1999 sits below WAIVER_HALF_THRESHOLD_CENTS 2000 and pays the whole 399, while food 2000 sits exactly ON the threshold and pays round_half_up(199.5) = 200 — proving the comparison is >= and not >."
        test_recipe:
          setup:
            - "A store with delivery_fee_cents 399 and one IN_ZONE address at drive 15 (BASE tier), no tip on either order."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000, delivery_fee_cents: 399 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "12 Oak St", latitude_micro: 39030000, longitude_micro: -84015000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_a_id: $.data.id }
            - call: "POST /store-ops/orders"
              payload: { store_id: "${store_id}", service_address_id: "${addr_a_id}", customer_name: "Ann", customer_phone: "555-0101", food_subtotal_cents: 1999, payment_method: "CARD", tip_cents: 0 }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { ord_below_id: $.data.id, pct_below: $.data.fee_waiver_pct, fee_below: $.data.delivery_fee_cents, total_below: $.data.total_charge_cents }
          trigger:
            - call: "POST /store-ops/orders"
              payload: { store_id: "${store_id}", service_address_id: "${addr_a_id}", customer_name: "Bob", customer_phone: "555-0102", food_subtotal_cents: 2000, payment_method: "CARD", tip_cents: 0 }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { ord_at_id: $.data.id, pct_at: $.data.fee_waiver_pct, fee_at: $.data.delivery_fee_cents, total_at: $.data.total_charge_cents }
          assert:
            - "${pct_below} == 0, ${fee_below} == 399 and ${total_below} == 2398"
            - "${pct_at} == 50, ${fee_at} == 200 and ${total_at} == 2200"
            - "the one-cent difference in food_subtotal_cents changed the fee by 199 cents, so the threshold is inclusive at 2000"
            - "both Order.${ord_below_id}.fee_tier and Order.${ord_at_id}.fee_tier == 'BASE'"

      - name: delivery_fee_rounds_half_up_at_three_seventy_four_point_five_on_the_far_tier
        claim_type: precision
        grounds:
          - calculations.customer_delivery_charge
          - entities.Order.fields.delivery_fee_cents
        distinguishing_aspect: "The FAR surcharge makes the base fee 749, an odd number, so the 50% waiver lands exactly on a half cent: round_half_up(374.5) = 375, not the 374 that banker's rounding or truncation would produce, and the total 2500 + 375 + 300 = 3175 carries the extra cent."
        test_recipe:
          setup:
            - "A store with delivery_fee_cents 399 and one IN_ZONE address at drive 27, which is over TIER_MID_MAX_MINUTES 25 and therefore FAR."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000, delivery_fee_cents: 399 }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
