      - name: enrollment_seat_and_agreement_parallel_dimensions
        grounds:
          - state_machines.Enrollment
          - entities.Enrollment.fields.seat_status
          - entities.Enrollment.fields.agreement_status
        distinguishing_aspect: |
          Entity: Enrollment. Two parallel state dimensions: seat_status
          (RESERVED|CONFIRMED|WAITLISTED|RELEASED|CANCELLED) and agreement_status
          (PENDING|SIGNED|EXPIRED|REVOKED) evolve independently; a RESERVED
          enrollment with agreement_status=PENDING can transition seat_status to
          WAITLISTED (capacity exceeded) without changing agreement_status.
        test_recipe:
          setup:
            - "Program P, PeerGroup G with base_capacity=1, status=ACTIVE"
            - "Two Participants A and B, both ACTIVE with SIGNED agreements"
            - "A enrolled first (RESERVED); B enrolled second"
            - "Confirm A (occupies the single seat). Then attempt to confirm B."
            - "B's enrollment transitions RESERVED → WAITLISTED (system) without changing agreement_status"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
