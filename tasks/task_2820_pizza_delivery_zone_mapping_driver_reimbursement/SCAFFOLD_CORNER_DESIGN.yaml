      - name: withdrawn_dispute_rejects_a_further_review_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AddressDispute.SUBMITTED_to_WITHDRAWN
          - validations.priority_12
          - errors.ERR_INVALID_DISPUTE_STATE
        distinguishing_aspect: "WITHDRAWN is terminal, so a START_REVIEW on a withdrawn dispute fails with ERR_INVALID_DISPUTE_STATE (409) and neither review_round_count nor the address's override_state moves."
        test_recipe:
          setup:
            - "A store with an ACTIVE zone version and one EDGE address exactly on the ring at grid 13.33 miles (drive 46 > 40)."
            - "One dispute on that address, withdrawn by the customer-care agent while still SUBMITTED."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
