          assert:
            - "the doubly-invalid check-in returns HTTP 422 with error_id == ERR_ID_DOCUMENT_EXPIRED (priority 21), NOT ERR_IDENTITY_VERIFICATION_FAILED (priority 23)"
            - "the second call, with a valid document but the same score of 40, returns HTTP 422 with error_id == ERR_IDENTITY_VERIFICATION_FAILED — proving rule 23 was live and merely outranked"
            - "after both rejections ExamSession.${sess_id}.session_status is still SCHEDULED with checked_in_at == null, identity_verified_at == null, id_document_type == null and biometric_match_score == null"
      - name: course_signoff_by_another_providers_instructor_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=32]
          - errors.ERR_INSTRUCTOR_NOT_AUTHORIZED
          - endpoints[POST /access-codes/{id}/course-completion]
        distinguishing_aspect: |
          Validity depends on a THIRD entity's fields: the signing instructor must have INSTRUCTOR in
          roles_held, registration_status REGISTERED, and the same training_provider_id as the code's batch.
          A fully REGISTERED instructor belonging to another provider fails with
          ERR_INSTRUCTOR_NOT_AUTHORIZED (422), and the owning provider's own instructor succeeds on the
          identical call, stamping course_completed_at while the code stays ASSIGNED.
