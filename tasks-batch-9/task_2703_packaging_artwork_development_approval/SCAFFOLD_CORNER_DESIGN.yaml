      - name: waiver_requires_a_failed_verdict_and_only_halves_its_deduction
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=26]
          - errors[ERR_ELEMENT_CHECK_NOT_FAILED]
          - entities.ElementCheck.fields.result
          - entities.ElementCheck.fields.deduction_points
          - entities.ElementCheck.fields.waived_by_user_id
          - entities.ArtworkVersion.fields.waived_element_count
