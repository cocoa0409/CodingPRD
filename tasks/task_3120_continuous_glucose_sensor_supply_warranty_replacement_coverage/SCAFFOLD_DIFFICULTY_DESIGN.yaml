            - call: "POST /cgm/payers"
              payload: { name: "PYRV", plan_code: "PRV", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
