  - section: cross_cutting_layers
    instances:

      - name: occ_stale_application_create_returns_412_then_fresh_succeeds
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[application-create-stale-school]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "optimistic_concurrency layer: an application create carrying the school version captured before a dues payment (v1, stale after the payment bumped it to v2) is rejected 412 ERR_STALE_VERSION; re-reading and resubmitting with v2 succeeds 201."
        test_recipe:
          setup:
            - "School created (version 1 captured); a dues payment then bumps the school to version 2."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/schools"
              payload: { name: "OCC School", display_name: "OCC Schoolhouse", uses_method_name: false, contact_email: "occ@x.org" }
              as: SocietyAdmin
              captures: { os_id: $.data.id, os_v1: $.data.version }
            - call: "POST /society/schools/${os_id}/dues-payments"
              payload: { period_start: "2026-09-01", period_end: "2027-09-01", amount_cents: 60000 }
              as: SocietyAdmin
              captures: { os_v2: $.data.version }
          trigger:
            - call: "POST /society/school-applications"
              payload: { school_id: "${os_id}", type: "AFFILIATION", expected_school_version: "${os_v1}" }
              as: SchoolAdmin
              as_user_id: "${os_id}"
              captures: { err: $.data.error_id }
            - call: "POST /society/school-applications"
              payload: { school_id: "${os_id}", type: "AFFILIATION", expected_school_version: "${os_v2}" }
              as: SchoolAdmin
              as_user_id: "${os_id}"
              captures: { oa_id: $.data.id }
          assert:
            - "os_v1 == 1 and os_v2 == 2 (the dues payment bumped the parent version)"
            - "err == ERR_STALE_VERSION (http 412) for the create carrying the pre-payment version"
            - "the retry with the fresh version succeeds: SchoolApplication.${oa_id}.status == DRAFT and the school version advances to 3"

      - name: occ_stale_plan_respond_returns_412
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[plan-respond-stale-plan]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "optimistic_concurrency layer on the plan: after a first respond bumps the plan version, a second respond replaying the captured older version is rejected 412 ERR_STALE_VERSION and the plan stays SUBMITTED."
        test_recipe:
