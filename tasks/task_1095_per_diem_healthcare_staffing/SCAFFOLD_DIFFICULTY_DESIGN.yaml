  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_parallel_work_and_pay_axes_advance_independently
        grounds:
          - state_machines.Assignment.PENDING_CONFIRMATION_to_CONFIRMED
          - state_machines.Assignment.CONFIRMED_to_WORKED
          - state_machines.Assignment.UNBILLED_to_TIMESHEET_PENDING
          - state_machines.Assignment.TIMESHEET_PENDING_to_PAYABLE
          - entities.Assignment.fields.work_status
          - entities.Assignment.fields.pay_status
        distinguishing_aspect: |
          PARALLEL state dimensions on the Assignment entity: confirming moves work_status
          PENDING_CONFIRMATION -> CONFIRMED while pay_status stays UNBILLED, and verifying
          moves pay_status TIMESHEET_PENDING -> PAYABLE while work_status stays WORKED — the
          two axes on the same row never move together except at the shared timesheet-submit
          event.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Cedar Ridge requiring RN_LICENSE; RN rate card 7500."
            - "Clinician Elle Park with a VERIFIED RN_LICENSE."
            - "Shift 2026-06-08T07:00Z..19:00Z claimed by Elle and AWARDED, leaving the Assignment at work_status PENDING_CONFIRMATION and pay_status UNBILLED."
