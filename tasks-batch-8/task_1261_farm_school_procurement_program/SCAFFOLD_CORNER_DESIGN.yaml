  - section: errors
    instances:
      - name: err_farm_and_agreement_guard_family
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FARM_NOT_APPLIED]
          - errors[ERR_FARM_NOT_SUSPENDED]
          - errors[ERR_OFFERING_YEAR_MISMATCH]
          - errors[ERR_AGREEMENT_WINDOW_OUTSIDE_OFFERING]
          - errors[ERR_AGREEMENT_NOT_AMENDABLE]
        distinguishing_aspect: "Remaining guard sweep: double approve (ERR_FARM_NOT_APPLIED), reinstate of an APPROVED farm (ERR_FARM_NOT_SUSPENDED), agreement created against another year's offering (ERR_OFFERING_YEAR_MISMATCH), agreement window exceeding the offering window (ERR_AGREEMENT_WINDOW_OUTSIDE_OFFERING), amendment on a PROPOSED agreement (ERR_AGREEMENT_NOT_AMENDABLE)."
        test_recipe:
          setup: ["Two OPEN years Y1/Y2; product season 1..20; farm APPROVED with VERIFIED offering in Y1 (window 4..12); forecast line Y1 planned 400 week 6"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y2", start_date: "2027-07-01", end_date: "2028-06-23", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr2: $.data.id } }
            - { call: "POST /f2s/program-years/${yr2}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off: $.data.id } }
            - { call: "POST /f2s/offerings/${off}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/offerings/${off}/verify", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 400 }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr}", offering_id: "${off}", committed_quantity: 200, harvest_start_week: 5, harvest_end_week: 10 }, as: DistrictProgramAdmin, captures: { agr: $.data.id, agr_v: $.data.version } }
          trigger:
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /f2s/farms/${farm}/reinstate", payload: {}, as: DistrictProgramAdmin, captures: { e2: $.data.error_id } }
            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr2}", offering_id: "${off}", committed_quantity: 10, harvest_start_week: 5, harvest_end_week: 10 }, as: DistrictProgramAdmin, captures: { e3: $.data.error_id } }
            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr}", offering_id: "${off}", committed_quantity: 10, harvest_start_week: 8, harvest_end_week: 13 }, as: DistrictProgramAdmin, captures: { e4: $.data.error_id } }
            - { call: "POST /f2s/planting-agreements/${agr}/amendments", payload: { new_unit_price_cents: 260, expected_agreement_version: "${agr_v}" }, as: FarmManager, as_user_id: "${farm}", captures: { e5: $.data.error_id } }
          assert:
            - "e1 == ERR_FARM_NOT_APPLIED (already APPROVED)"
            - "e2 == ERR_FARM_NOT_SUSPENDED (reinstate requires SUSPENDED)"
            - "e3 == ERR_OFFERING_YEAR_MISMATCH (offering belongs to Y1, agreement targets Y2)"
            - "e4 == ERR_AGREEMENT_WINDOW_OUTSIDE_OFFERING (8..13 not inside 4..12)"
            - "e5 == ERR_AGREEMENT_NOT_AMENDABLE (PROPOSED agreement; state check fires before the OCC check)"
