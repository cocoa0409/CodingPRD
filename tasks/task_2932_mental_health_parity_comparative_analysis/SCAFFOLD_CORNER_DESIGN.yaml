          - response_envelope.pagination_defaults
        distinguishing_aspect: "Filter and window interact on the same collection: total_count reports the filtered population (not the table), has_more is derived from that population, and a limit outside 1..100 is a shape failure rather than a clamp."
        test_recipe:
          setup:
            - "One Administrator and three PlanYears (labels 2024, 2025 and 2026) owned by it."
            - "One classification on the 2026 plan year carrying one ACTIVE MEDICAL_SURGICAL COPAY row and one ACTIVE MENTAL_HEALTH_SUD COPAY row."
