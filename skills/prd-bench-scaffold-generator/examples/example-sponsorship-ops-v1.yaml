# =============================================================================
# Example: sponsorship-ops benchmark seed tables (v1)
# =============================================================================

scenario: |
  Event sponsorship management system. Manages sponsorship packages, sponsor
  applications, commitments (slot reservations), and benefit claims for events.
  Sponsors apply for packages, get approved via a hold/waitlist system, and then
  use benefit claims (LEAD_SCANS, STAGE_MINUTES, SPOTLIGHT). Considerations:
  event posture (DRAFT/OPEN/LOCKDOWN/ARCHIVED), sponsor trust status with cascade
  effects, inventory tracking (package slots, spotlight slots), hold expiry,
  waitlist promotion, activation deadlines, and ops checkpoint batch processing.

domain_name: sponsorship-ops
api_prefix: /events

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: spotlight_slot_count, type: integer, source: input, description: "Total spotlight placements for this event" }
      - { name: posture, type: enum, source: system, description: "DRAFT → OPEN → LOCKDOWN / ARCHIVED" }
      - { name: ops_run_index, type: integer, source: system, description: "Checkpoint counter, bumped by run_ops" }
      - { name: spotlight_slots_remaining, type: integer, source: computed, description: "Spotlight slots not yet consumed by finalized claims" }

  - name: Package
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "Associated event ID" }
      - { name: label, type: string, source: input, description: "Package label (e.g. GOLD, SILVER)" }
      - { name: price_cents, type: integer, source: input, description: "Package price in cents" }
      - { name: slot_count, type: integer, source: input, description: "Total sponsor slots for this package" }
      - { name: included_benefits, type: array, source: input, description: "List of benefit_kind and quantity" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }
      - { name: slots_remaining, type: integer, source: computed, description: "Available slots (slot_count minus committed slots)" }

  - name: Sponsor
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "Associated event ID" }
      - { name: display_name, type: string, source: input, description: "Sponsor display name" }
      - { name: legal_name, type: string, source: input, description: "Sponsor legal name" }
      - { name: primary_contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, description: "PROSPECT → VETTED / WATCHLIST / BLOCKED" }

  - name: Application
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "Associated event ID" }
      - { name: sponsor_id, type: string, source: input, description: "Applying sponsor ID" }
      - { name: package_id, type: string, source: input, description: "Target package ID" }
      - { name: note, type: string, source: input, required: false, description: "Free-form comments" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED / REJECTED / WITHDRAWN / EXPIRED" }
      - { name: submit_seq, type: integer, source: system, required: false, description: "Monotonically increasing sequence, set on submit" }
      - { name: hold_status, type: enum, source: system, required: false, description: "HELD | WAITLISTED — set on submit" }
      - { name: hold_expires_on_ops, type: integer, source: system, required: false, description: "Ops run index when hold expires" }
      - { name: commitment_id, type: string, source: system, required: false, description: "ID of commitment created on approval" }

  - name: Commitment
    parent: Event
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "Associated event ID" }
      - { name: sponsor_id, type: string, source: system, description: "Sponsor who owns this commitment" }
      - { name: package_id, type: string, source: system, description: "Package this commitment is for" }
      - { name: status, type: enum, source: system, description: "PENDING_COUNTERSIGN → ACTIVE / SUSPENDED / RESCINDED" }
      - { name: activation_deadline_on_ops, type: integer, source: system, required: false, description: "Ops run index deadline for activation" }
      - { name: benefits_left, type: object, source: computed, description: "Map from benefit_kind to remaining quantity" }
      - { name: claims, type: array, source: system, description: "List of claims with claim_id, benefit_kind, quantity, status" }

  - name: Claim
    parent: Commitment
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: system, description: "Associated commitment ID" }
      - { name: benefit_kind, type: enum, source: input, description: "LEAD_SCANS | STAGE_MINUTES | SPOTLIGHT" }
      - { name: quantity, type: integer, source: input, description: "Quantity to claim (SPOTLIGHT always 1)" }
      - { name: status, type: enum, source: system, description: "PROPOSED → FINALIZED / VOIDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    field: posture
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: PATCH /events/:event_id
        actor: ops
        preconditions: []
        side_effects: []

      - from: OPEN
        to: LOCKDOWN
        trigger: PATCH /events/:event_id
        actor: ops
        preconditions: []
        side_effects: []

      - from: LOCKDOWN
        to: OPEN
        trigger: PATCH /events/:event_id
        actor: ops
        preconditions: []
        side_effects: []

      - from: OPEN
        to: ARCHIVED
        trigger: PATCH /events/:event_id
        actor: ops
        preconditions: []
        side_effects: []

      - from: LOCKDOWN
        to: ARCHIVED
        trigger: PATCH /events/:event_id
        actor: ops
        preconditions: []
        side_effects: []
    note: "Cannot rewind to DRAFT or un-archive. DRAFT→OPEN, OPEN↔LOCKDOWN, OPEN/LOCKDOWN→ARCHIVED."

  - entity: Package
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /events/:event_id/packages/:package_id/transition (action=RETIRE)"
        actor: ops
        preconditions: []
        side_effects:
          - "Current HELD submissions release their slot reservations"
          - "Those submissions move to WAITLISTED (keep place in line)"
          - "Waitlist stops advancing while retired"

      - from: RETIRED
        to: ACTIVE
        trigger: "POST /events/:event_id/packages/:package_id/transition (action=REACTIVATE)"
        actor: ops
        preconditions: []
        side_effects: []

  - entity: Sponsor
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: VETTED
        trigger: PATCH /events/:event_id/sponsors/:sponsor_id
        actor: ops
        preconditions: []
        side_effects: []

      - from: PROSPECT
        to: WATCHLIST
        trigger: PATCH /events/:event_id/sponsors/:sponsor_id
        actor: ops
        preconditions: []
        side_effects:
          - "Active commitments → SUSPENDED"

      - from: PROSPECT
        to: BLOCKED
        trigger: PATCH /events/:event_id/sponsors/:sponsor_id
        actor: ops
        preconditions: []
        side_effects:
          - "Non-terminal applications → WITHDRAWN"
          - "Non-rescinded commitments → RESCINDED"
          - "Claims under those commitments → VOIDED"

      - from: VETTED
        to: WATCHLIST
        trigger: PATCH /events/:event_id/sponsors/:sponsor_id
        actor: ops
        preconditions: []
        side_effects:
          - "Active commitments → SUSPENDED"

      - from: VETTED
        to: BLOCKED
        trigger: PATCH /events/:event_id/sponsors/:sponsor_id
        actor: ops
        preconditions: []
        side_effects:
          - "Same cascades as PROSPECT → BLOCKED"

      - from: WATCHLIST
        to: VETTED
        trigger: PATCH /events/:event_id/sponsors/:sponsor_id
        actor: ops
        preconditions: []
        side_effects: []
        note: "Does not auto-undo prior suspensions"

      - from: WATCHLIST
        to: BLOCKED
        trigger: PATCH /events/:event_id/sponsors/:sponsor_id
        actor: ops
        preconditions: []
        side_effects:
          - "Same cascades as PROSPECT → BLOCKED"

  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /events/:event_id/applications/:application_id/transition (action=SUBMIT)"
        actor: ops
        preconditions:
          - "Event posture is not LOCKDOWN or ARCHIVED"
          - "Package is ACTIVE"
          - "Sponsor is not BLOCKED"
          - "No concurrent non-terminal application for same sponsor+package (ERR_DUPLICATE_APPLICATION)"
        side_effects:
          - "submit_seq assigned"
          - "If slot available and no waitlist: hold_status=HELD, hold_expires_on_ops set"
          - "If no slot or waitlist exists: hold_status=WAITLISTED"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /events/:event_id/applications/:application_id/transition (action=APPROVE)"
        actor: ops
        preconditions:
          - "Event posture is not LOCKDOWN or ARCHIVED"
          - "hold_status must be HELD (ERR_NO_ACTIVE_HOLD)"
        side_effects:
          - "Creates a Commitment (PENDING_COUNTERSIGN)"
          - "commitment_id set on application"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /events/:event_id/applications/:application_id/transition (action=REJECT)"
        actor: ops
        preconditions: []
        side_effects:
          - "If HELD: slot released"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /events/:event_id/applications/:application_id/transition (action=WITHDRAW)"
        actor: ops
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /events/:event_id/applications/:application_id/transition (action=WITHDRAW)"
        actor: ops
        preconditions: []
        side_effects:
          - "If HELD: slot released"
          - "If WAITLISTED: removed from waitlist"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (run_ops: hold_expires_on_ops reached)"
        actor: system
        preconditions:
          - "hold_status is HELD"
          - "hold_expires_on_ops <= current ops_run_index"
        side_effects:
          - "Slot released"

  - entity: Commitment
    initial_state: PENDING_COUNTERSIGN
    terminal_states: [RESCINDED]
    transitions:
      - from: PENDING_COUNTERSIGN
        to: ACTIVE
        trigger: "POST /events/:event_id/commitments/:commitment_id/transition (action=COUNTERSIGN)"
        actor: ops
        preconditions:
          - "Event posture is not LOCKDOWN or ARCHIVED"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (sponsor moved to WATCHLIST)"
        actor: system
        preconditions: []
        side_effects:
          - "activation_deadline_on_ops set"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /events/:event_id/commitments/:commitment_id/transition (action=COUNTERSIGN)"
        actor: ops
        preconditions:
          - "Event posture is not LOCKDOWN or ARCHIVED"
        side_effects:
          - "activation_deadline_on_ops cleared"

      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /events/:event_id/commitments/:commitment_id/transition (action=RESCIND)"
        actor: ops
        preconditions:
          - "No finalized claims unless triggered by policy (BLOCKED or run_ops abandonment)"
        side_effects:
          - "Package slot released"
          - "Policy-triggered rescind: all claims voided"

      - from: PENDING_COUNTERSIGN
        to: RESCINDED
        trigger: "system (run_ops: activation_deadline_on_ops reached) or policy (sponsor BLOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "Package slot released"
          - "All claims voided"

      - from: SUSPENDED
        to: RESCINDED
        trigger: "system (run_ops: activation_deadline_on_ops reached) or policy (sponsor BLOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "Package slot released"
          - "All claims voided"

  - entity: Claim
    initial_state: PROPOSED
    terminal_states: [VOIDED]
    transitions:
      - from: PROPOSED
        to: FINALIZED
        trigger: "POST /events/:event_id/commitments/:commitment_id/claims/:claim_id/transition (action=FINALIZE)"
        actor: ops
        preconditions:
          - "Event posture is not LOCKDOWN or ARCHIVED"
          - "Commitment must be ACTIVE (ERR_COMMITMENT_NOT_ACTIVE)"
          - "benefit_kind must be in package's included_benefits (ERR_BENEFIT_NOT_INCLUDED)"
          - "Sufficient benefits_left (ERR_INSUFFICIENT_BENEFIT)"
          - "SPOTLIGHT: event has spotlight_slots_remaining > 0 (ERR_SPOTLIGHT_FULL)"
        side_effects:
          - "benefits_left decremented"
          - "SPOTLIGHT: spotlight_slots_remaining decremented"

      - from: PROPOSED
        to: VOIDED
        trigger: "POST .../claims/:claim_id/transition (action=VOID) or system (commitment rescind cascade)"
        actor: "ops or system"
        preconditions: []
        side_effects: []

      - from: FINALIZED
        to: VOIDED
        trigger: "POST .../claims/:claim_id/transition (action=VOID) or system (commitment rescind cascade)"
        actor: "ops or system"
        preconditions: []
        side_effects:
          - "benefits_left restored"
          - "SPOTLIGHT: spotlight_slots_remaining restored"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: slots_remaining
    trigger: "commitment creation, rescind, application hold/release, package retire"
    algorithm: aggregation
    formula: |
      slots_remaining = slot_count - count(non-rescinded commitments for this package)
      Holds (SUBMITTED+HELD applications) temporarily reserve slots but are not commitments.

  - name: spotlight_slots_remaining
    trigger: "claim finalize, claim void, commitment rescind cascade"
    algorithm: aggregation
    formula: |
      spotlight_slots_remaining = spotlight_slot_count - count(FINALIZED SPOTLIGHT claims across all commitments)

  - name: benefits_left
    trigger: "claim finalize, claim void"
    algorithm: aggregation
    formula: |
      benefits_left[kind] = package.included_benefits[kind].quantity - sum(FINALIZED claims of that kind for this commitment)

  - name: hold_expiry
    trigger: "run_ops"
    algorithm: threshold
    formula: |
      If application is SUBMITTED and HELD and hold_expires_on_ops <= ops_run_index after bump:
        application → EXPIRED, slot released

  - name: activation_deadline
    trigger: "run_ops"
    algorithm: threshold
    formula: |
      If commitment is PENDING_COUNTERSIGN or SUSPENDED and activation_deadline_on_ops <= ops_run_index after bump:
        commitment → RESCINDED, claims voided, slot released

  - name: waitlist_advancement
    trigger: "run_ops (after expiry and abandonment processing)"
    algorithm: priority_queue
    formula: |
      For each ACTIVE package with freed slots:
        Grant holds to oldest waitlisted submissions (lowest submit_seq).
        No line-cutting: if waitlist exists, new submissions always join waitlist.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: concurrency
    check: "If-Match required for PUT/PATCH"
    error_id: ERR_PRECONDITION_REQUIRED
    http_status: 428
    applies_to: PUT/PATCH endpoints

  - priority: 2
    category: existence
    check: "Resource IDs in path must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints

  - priority: 3
    category: concurrency
    check: "If-Match version must match"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: PUT/PATCH endpoints

  - priority: 4
    category: posture
    check: "Event must be OPEN for forward-progress operations"
    error_id: ERR_EVENT_NOT_OPEN
    http_status: 409
    applies_to: "create resources, submit, approve, countersign, finalize"

  - priority: 4b
    category: posture
    check: "Event in LOCKDOWN blocks forward progress but allows corrections"
    error_id: ERR_EVENT_LOCKDOWN
    http_status: 409
    applies_to: "same as ERR_EVENT_NOT_OPEN"

  - priority: 5
    category: state
    check: "Resource must be in the correct state for the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_sponsor
    check: "Sponsor must not be BLOCKED"
    error_id: ERR_SPONSOR_BLOCKED
    http_status: 409
    applies_to: "submit, approve"

  - priority: 7
    category: business_package
    check: "Package must be ACTIVE"
    error_id: ERR_PACKAGE_RETIRED
    http_status: 409
    applies_to: "submit"

  - priority: 8
    category: business_application
    check: "No concurrent non-terminal application for same sponsor+package"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "submit"

  - priority: 9
    category: business_application
    check: "Application must have hold_status=HELD for approval"
    error_id: ERR_NO_ACTIVE_HOLD
    http_status: 409
    applies_to: "approve"

  - priority: 10
    category: business_commitment
    check: "Commitment must be ACTIVE for claims"
    error_id: ERR_COMMITMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "finalize claim"

  - priority: 11
    category: business_benefit
    check: "Benefit kind must be in package's included_benefits"
    error_id: ERR_BENEFIT_NOT_INCLUDED
    http_status: 400
    applies_to: "create claim"

  - priority: 12
    category: business_benefit
    check: "Sufficient benefits_left for the claim quantity"
    error_id: ERR_INSUFFICIENT_BENEFIT
    http_status: 409
    applies_to: "finalize claim"

  - priority: 13
    category: business_spotlight
    check: "No duplicate non-voided SPOTLIGHT claims per commitment"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "create SPOTLIGHT claim"

  - priority: 13b
    category: business_spotlight
    check: "SPOTLIGHT quantity must be 1"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: "create SPOTLIGHT claim"

  - priority: 14
    category: business_spotlight
    check: "Event must have spotlight_slots_remaining > 0"
    error_id: ERR_SPOTLIGHT_FULL
    http_status: 409
    applies_to: "finalize SPOTLIGHT claim"

  - priority: 15
    category: business_spotlight
    check: "SPOTLIGHT already in use by this commitment"
    error_id: ERR_SPOTLIGHT_IN_USE
    http_status: 409
    applies_to: "create SPOTLIGHT claim when non-voided exists"

  - priority: 16
    category: business_commitment
    check: "Polite rescind blocked when finalized claims exist"
    error_id: ERR_HAS_FINALIZED_CLAIMS
    http_status: 409
    applies_to: "rescind commitment (manual)"

  - priority: 17
    category: business_commitment
    check: "Duplicate commitment for same sponsor+package"
    error_id: ERR_DUPLICATE_COMMITMENT
    http_status: 409
    applies_to: "approve (would create duplicate)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (18 endpoints)
# =============================================================================
endpoints:
  # --- Event ---
  - method: POST
    path: "/events"
    description: "Create a new Event"
    roles: [ops]
    code: 201
    input: [name, spotlight_slot_count]
    output: Event
    side_effects: ["posture=DRAFT, ops_run_index=0, spotlight_slots_remaining=spotlight_slot_count"]

  - method: GET
    path: "/events/:event_id"
    description: "Get a specific Event"
    roles: [Any]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: PATCH
    path: "/events/:event_id"
    description: "Update event posture"
    roles: [ops]
    code: 200
    input: [posture]
    output: Event
    side_effects: ["Posture transition with rules"]

  - method: POST
    path: "/events/:event_id/run_ops"
    description: "Run the ops checkpoint"
    roles: [ops]
    code: 200
    input: []
    output: Event
    side_effects:
      - "ops_run_index incremented"
      - "Expire holds"
      - "Revoke abandoned commitments"
      - "Advance waitlists"

  # --- Package ---
  - method: POST
    path: "/events/:event_id/packages"
    description: "Create a new Package"
    roles: [ops]
    code: 201
    input: [label, price_cents, slot_count, included_benefits]
    output: Package
    side_effects: ["status=ACTIVE, slots_remaining=slot_count"]

  - method: GET
    path: "/events/:event_id/packages/:package_id"
    description: "Get a specific Package"
    roles: [Any]
    code: 200
    input: []
    output: Package
    side_effects: []

  - method: POST
    path: "/events/:event_id/packages/:package_id/transition"
    description: "Transition package status (RETIRE or REACTIVATE)"
    roles: [ops]
    code: 200
    input: [action]
    output: Package
    side_effects:
      - "RETIRE: held submissions release slots, move to waitlisted"
      - "REACTIVATE: package back to ACTIVE"

  # --- Sponsor ---
  - method: POST
    path: "/events/:event_id/sponsors"
    description: "Create a new Sponsor"
    roles: [ops]
    code: 201
    input: [display_name, legal_name, primary_contact_email]
    output: Sponsor
    side_effects: ["status=PROSPECT"]

  - method: GET
    path: "/events/:event_id/sponsors/:sponsor_id"
    description: "Get a specific Sponsor"
    roles: [Any]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  - method: PATCH
    path: "/events/:event_id/sponsors/:sponsor_id"
    description: "Update sponsor status"
    roles: [ops]
    code: 200
    input: [status]
    output: Sponsor
    side_effects:
      - "WATCHLIST: active commitments → SUSPENDED"
      - "BLOCKED: cascade withdraw + rescind + void"

  # --- Application ---
  - method: POST
    path: "/events/:event_id/applications"
    description: "Create a new Application"
    roles: [ops]
    code: 201
    input: [sponsor_id, package_id, "note?"]
    output: Application
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/events/:event_id/applications/:application_id"
    description: "Get a specific Application"
    roles: [Any]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: PUT
    path: "/events/:event_id/applications/:application_id"
    description: "Update application (note, while DRAFT)"
    roles: [ops]
    code: 200
    input: ["note?"]
    output: Application
    side_effects: []

  - method: POST
    path: "/events/:event_id/applications/:application_id/transition"
    description: "Transition application (SUBMIT, APPROVE, REJECT, WITHDRAW)"
    roles: [ops]
    code: 200
    input: [action]
    output: Application
    side_effects:
      - "SUBMIT: assign submit_seq, hold or waitlist"
      - "APPROVE: create commitment, set commitment_id"
      - "REJECT: release held slot"
      - "WITHDRAW: release held slot or remove from waitlist"

  # --- Commitment ---
  - method: GET
    path: "/events/:event_id/commitments/:commitment_id"
    description: "Get a specific Commitment"
    roles: [Any]
    code: 200
    input: []
    output: Commitment
    side_effects: []

  - method: POST
    path: "/events/:event_id/commitments/:commitment_id/transition"
    description: "Transition commitment (COUNTERSIGN, RESCIND)"
    roles: [ops]
    code: 200
    input: [action]
    output: Commitment
    side_effects:
      - "COUNTERSIGN: status → ACTIVE"
      - "RESCIND: slot released, policy-triggered also voids claims"

  # --- Claim ---
  - method: POST
    path: "/events/:event_id/commitments/:commitment_id/claims"
    description: "Create a new Claim"
    roles: [ops]
    code: 201
    input: [benefit_kind, quantity]
    output: Claim
    side_effects: ["status=PROPOSED"]

  - method: POST
    path: "/events/:event_id/commitments/:commitment_id/claims/:claim_id/transition"
    description: "Transition claim (FINALIZE, VOID)"
    roles: [ops]
    code: 200
    input: [action]
    output: Claim
    side_effects:
      - "FINALIZE: benefits_left decremented, SPOTLIGHT→spotlight_slots_remaining decremented"
      - "VOID: benefits_left restored, SPOTLIGHT→spotlight_slots_remaining restored"

# =============================================================================
# Table 6: Error Code Catalogue (19 error codes)
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "General request format error"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource with given ID does not exist"

  - id: ERR_PRECONDITION_REQUIRED
    http: 428
    condition: "If-Match header missing on PUT/PATCH"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match version does not match current version"

  - id: ERR_EVENT_NOT_OPEN
    http: 409
    condition: "Event must be OPEN for this operation"

  - id: ERR_EVENT_LOCKDOWN
    http: 409
    condition: "Event is in LOCKDOWN; forward-progress operations blocked"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in the correct state for this operation"

  - id: ERR_PACKAGE_RETIRED
    http: 409
    condition: "Package is RETIRED; cannot submit application"

  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "Sponsor already has a non-terminal application for this package"

  - id: ERR_DUPLICATE_COMMITMENT
    http: 409
    condition: "A commitment already exists for this sponsor and package"

  - id: ERR_NO_ACTIVE_HOLD
    http: 409
    condition: "Application must be HELD to approve; cannot approve from waitlist"

  - id: ERR_SPONSOR_BLOCKED
    http: 409
    condition: "Sponsor is BLOCKED; cannot progress"

  - id: ERR_COMMITMENT_NOT_ACTIVE
    http: 409
    condition: "Commitment must be ACTIVE for claim operations"

  - id: ERR_BENEFIT_NOT_INCLUDED
    http: 400
    condition: "Benefit kind not in the package's included_benefits"

  - id: ERR_INSUFFICIENT_BENEFIT
    http: 409
    condition: "Not enough benefits_left for the requested quantity"

  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "Duplicate non-voided claim (e.g. SPOTLIGHT)"

  - id: ERR_SPOTLIGHT_FULL
    http: 409
    condition: "No spotlight slots remaining on the event"

  - id: ERR_SPOTLIGHT_IN_USE
    http: 409
    condition: "Commitment already has a non-voided SPOTLIGHT claim"

  - id: ERR_HAS_FINALIZED_CLAIMS
    http: 409
    condition: "Cannot politely rescind commitment while finalized claims exist"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: ops
    description: "Event operations team managing all sponsorship workflows"
    exclusive_operations:
      - "POST /events — Create event"
      - "PATCH /events/:event_id — Update event posture"
      - "POST .../run_ops — Run ops checkpoint"
      - "POST .../packages — Create package"
      - "POST .../packages/:id/transition — Retire/reactivate package"
      - "POST .../sponsors — Create sponsor"
      - "PATCH .../sponsors/:id — Update sponsor status"
      - "POST .../applications — Create application"
      - "PUT .../applications/:id — Update application"
      - "POST .../applications/:id/transition — Submit/approve/reject/withdraw application"
      - "POST .../commitments/:id/transition — Countersign/rescind commitment"
      - "POST .../claims — Create claim"
      - "POST .../claims/:id/transition — Finalize/void claim"

  - name: Any
    description: "Shared read access"
    shared_operations:
      - "GET /events/:event_id — Get event"
      - "GET .../packages/:id — Get package"
      - "GET .../sponsors/:id — Get sponsor"
      - "GET .../applications/:id — Get application"
      - "GET .../commitments/:id — Get commitment"
