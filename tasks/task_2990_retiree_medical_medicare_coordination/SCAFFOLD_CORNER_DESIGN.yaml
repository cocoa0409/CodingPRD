      - name: premium_invoice_partial_hra_offset_leaves_six_cents_due
        claim_type: waterfall_allocation
        grounds:
          - calculations.premium_invoice_assembly
          - endpoints["POST /retiree-benefits/premium-invoices"]
          - entities.PremiumInvoice.fields.hra_applied_cents
        distinguishing_aspect: |
          The HRA bucket is drained before the retiree is billed, and it can only
          partially cover the share. A one-month HraAccount funds 15416 against a
          retiree share of 15422, so hra_applied_cents is min(15416, 15422) ==
          15416 and net_due_cents is exactly 6 - the invoice stays ISSUED rather
