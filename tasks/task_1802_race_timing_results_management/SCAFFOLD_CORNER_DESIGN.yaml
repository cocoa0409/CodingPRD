        claim_type: violation_to_error
        grounds: ["roles[TimingOperator]", "roles[RaceDirector]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Exclusive-op denial: TimingOperator (mats/reads) cannot run publish-results (RaceDirector exclusive); role check precedes existence so even an unknown race id yields 403."
