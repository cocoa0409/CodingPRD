scenario: |
  Brokerage Franchise Brand Licensing & Royalty Administration (Anywhere Real Estate): franchise agreements granting brand rights in a territory with term, royalty and marketing fund obligations, royalty computation on gross commission income with caps, tiers and volume incentives, brand standards covering signage, marketing, technology adoption and agent onboarding with compliance audits, national advertising fund collection and spending governance with franchisee advisory councils, franchise sales to independent brokerages with conversion support and transition timelines, agent count and production reporting that drives royalty and program eligibility, franchisee default, termination and post-termination de-identification obligations, multi-brand portfolio management preventing brand conflict in a market

domain_name: brokerage-franchise-royalty
api_prefix: /franchise

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_level: expert_plus
  entity_count: 12
  endpoint_count: 44
  error_code_count: 32
  calculation_count: 9

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: brand_code
        type: string
        source: input
        description: "Stable uppercase brand code, unique across all brands"
        constraints: "unique; 2-16 uppercase letters/digits"
      - name: display_name
        type: string
        source: input
        description: "Human-readable brand name"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | RETIRED; RETIRED brands cannot grant new agreements"
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: Market
    parent: null
    common_fields: true
    fields:
      - name: market_code
        type: string
        source: input
        description: "Unique market code, e.g. PHX-METRO"
        constraints: "unique"
      - name: name
        type: string
        source: input
        description: "Human-readable market name"

  - name: Brokerage
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the independent brokerage company"
      - name: home_market_id
        type: string
        source: input
        description: "FK -> Market.id; market in which the brokerage's principal office sits"
      - name: principal_email
        type: string
        source: input
        description: "Contact email of the brokerage principal"
      - name: status
        type: enum
        source: system
        description: "PROSPECT | FRANCHISED | TERMINATED"
        constraints: "PROSPECT | FRANCHISED | TERMINATED"

  - name: FranchiseAgreement
    parent: Brokerage
    common_fields: true
    fields:
      - name: brokerage_id
        type: string
        source: input
        description: "FK -> Brokerage.id; owning brokerage"
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; licensed brand"
      - name: market_id
        type: string
        source: input
        description: "FK -> Market.id; exclusive territory"
      - name: term_start
        type: datetime
        source: input
        description: "First day (inclusive) of the license term; ISO8601 date at 00:00:00Z"
      - name: term_end
        type: datetime
        source: input
        description: "Last day (inclusive) of the license term; must be after term_start"
      - name: base_royalty_rate_bps
        type: integer
        source: input
        description: "Base royalty rate in basis points applied to GCI (100 bps = 1%)"
        constraints: "0 < base_royalty_rate_bps <= 10000"
      - name: annual_royalty_cap_cents
        type: integer
        source: input
        description: "Annual royalty cap in cents; royalties stop accruing past this per agreement calendar year"
        constraints: "> 0"
      - name: volume_incentive_threshold_cents
        type: integer
        source: input
        description: "Annual GCI at which the volume-incentive rebate on marginal royalty becomes available"
        constraints: "> 0"
      - name: volume_incentive_rate_bps
        type: integer
        source: input
        description: "Marginal royalty rate above the volume threshold (lower than base)"
        constraints: "0 <= volume_incentive_rate_bps < base_royalty_rate_bps"
      - name: ad_fund_rate_bps
        type: integer
        source: input
        description: "National advertising fund contribution rate in basis points of GCI"
        constraints: "0 < ad_fund_rate_bps <= 1000"
      - name: status
        type: enum
        source: system
        description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | TERMINATED | DEIDENTIFYING | CLOSED"
        constraints: "DRAFT | ACTIVE | SUSPENDED | EXPIRED | TERMINATED | DEIDENTIFYING | CLOSED"
      - name: activated_at
        type: datetime
        source: system
        description: "Timestamp of DRAFT -> ACTIVE transition; null until activation"
      - name: renewed_from_id
        type: string
        source: input
        description: "FK -> FranchiseAgreement.id; optional link to the prior agreement this one renews (self-referential); null for fresh grants"
      - name: cumulative_billed_royalty_cents
        type: integer
        source: computed
        description: "Running total of billed royalty (post-cap) across the current agreement calendar year; resets when a period in a new calendar year is created"
        default: 0
      - name: cumulative_gci_cents
        type: integer
        source: computed
        description: "Running total of GCI reported in the current agreement calendar year; same reset rule as cumulative_billed_royalty_cents"
        default: 0
      - name: open_cure_count
        type: integer
        source: computed
        description: "Count of linked DefaultCase rows with status OPEN or CURING"
        default: 0

  - name: ConversionPlan
    parent: FranchiseAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FranchiseAgreement.id; the DRAFT agreement this plan converts"
      - name: milestones
        type: array
        source: input
        description: "Array of milestone objects {name, target_date, sequence}; sequence must be a 1-based contiguous permutation; each milestone tracks its own completion"
      - name: milestones_done
        type: integer
        source: computed
        description: "Count of milestones with done=true"
        default: 0
      - name: ready
        type: boolean
        source: computed
        description: "true iff milestones_done == len(milestones) and len(milestones) > 0"
        default: false

  - name: Agent
    parent: Brokerage
    common_fields: true
    fields:
      - name: brokerage_id
        type: string
        source: input
        description: "FK -> Brokerage.id; brokerage the agent affiliates with"
      - name: full_name
        type: string
        source: input
        description: "Agent full name"
      - name: license_no
        type: string
        source: input
        description: "State license number; unique per brokerage"
        constraints: "unique within brokerage_id"
      - name: affiliated_on
        type: datetime
        source: input
        description: "Date the agent affiliated; ISO8601"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | INACTIVE"
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"

  - name: AgentCountReport
    parent: FranchiseAgreement
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FranchiseAgreement.id; agreement the report covers"
      - name: period_month
        type: string
        source: input
        description: "Month key in YYYY-MM form; unique per agreement"
        constraints: "unique within agreement_id; format YYYY-MM"
      - name: active_agent_count
        type: integer
        source: input
        description: "Number of agents with status ACTIVE at report time"
        constraints: ">= 0"
      - name: reported_at
        type: datetime
        source: system
        description: "Timestamp the report was submitted"

  - name: GCIReport
    parent: FranchiseAgreement
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FranchiseAgreement.id; agreement the report covers"
      - name: period_month
        type: string
        source: input
        description: "Month key in YYYY-MM form; unique per agreement"
        constraints: "unique within agreement_id; format YYYY-MM"
      - name: gci_cents
        type: integer
        source: input
        description: "Gross commission income for the month in cents"
        constraints: ">= 0"
      - name: reported_at
        type: datetime
        source: system
        description: "Timestamp the report was submitted"
      - name: reported_by_role
        type: string
        source: system
        description: "X-User-Role that submitted the report (FRANCHISEE_ADMIN or FRANCHISOR_OPS) — drives the royalty_rate_assessment variant selection"

  - name: RoyaltyPeriod
    parent: FranchiseAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FranchiseAgreement.id; agreement billed"
      - name: period_month
        type: string
        source: input
        description: "Month key in YYYY-MM form; the billed month; unique per agreement"
        constraints: "unique within agreement_id; format YYYY-MM"
      - name: gci_cents
        type: integer
        source: computed
        description: "GCI snapshot copied from the GCIReport for period_month at assessment time"
      - name: royalty_due_cents
        type: integer
        source: computed
        description: "Final royalty for the month after tier split, cap, and volume-incentive rebate (per royalty_rate_assessment)"
      - name: provisional_royalty_cents
        type: integer
        source: computed
        description: "Provisional variant of the same month's royalty computed with PROVISIONAL constants; always >= royalty_due_cents for identical inputs under the pinned constants"
      - name: ad_fund_due_cents
        type: integer
        source: computed
        description: "National advertising fund contribution due for the month (ad_fund_accrual); zero when the agreement is SUSPENDED at assessment time"
      - name: status
        type: enum
        source: system
        description: "ASSESSED | SETTLED | WAIVED"
        constraints: "ASSESSED | SETTLED | WAIVED"
      - name: settled_at
        type: datetime
        source: system
        description: "Timestamp of ASSESSED -> SETTLED; null until settled"

  - name: DefaultCase
    parent: FranchiseAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FranchiseAgreement.id; agreement in default"
      - name: reason_code
        type: enum
        source: input
        description: "PAYMENT | BRAND_STANDARDS | REPORTING | TERRITORY"
        constraints: "PAYMENT | BRAND_STANDARDS | REPORTING | TERRITORY"
      - name: status
        type: enum
        source: system
        description: "OPEN | CURING | RESOLVED | ESCALATED"
        constraints: "OPEN | CURING | RESOLVED | ESCALATED"
      - name: opened_at
        type: datetime
        source: system
        description: "Timestamp the default was opened"
      - name: cure_deadline
        type: datetime
        source: computed
        description: "opened_at + 30 days; hard deadline after which ESCALATED defaults may drive termination"
      - name: escalated_at
        type: datetime
        source: system
        description: "Timestamp of ESCALATED transition; null until escalated"

  - name: AdFundLedgerEntry
    parent: Brand
    common_fields: false
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; brand whose national advertising fund this entry touches"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FranchiseAgreement.id; contributing agreement for COLLECT entries; null for SPEND entries"
      - name: period_id
        type: string
        source: input
        description: "FK -> RoyaltyPeriod.id for COLLECT entries; null for SPEND entries"
      - name: entry_type
        type: enum
        source: input
        description: "COLLECT (contribution in) | SPEND (governed spend out)"
        constraints: "COLLECT | SPEND"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed magnitude in cents; COLLECT adds, SPEND subtracts"
        constraints: "> 0"

  - name: AdvisoryCouncil
    parent: Brand
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; brand this council advises"
      - name: seat_count
        type: integer
        source: input
        description: "Number of seats; quorum is derived as floor(seat_count / 2) + 1"
        constraints: ">= 3 and odd"
      - name: member_brokerage_ids
        type: array
        source: input
        description: "Array of brokerage ids holding seats; length must equal seat_count; each brokerage may sit on at most one council per brand"
      - name: quorum_votes
        type: integer
        source: computed
        description: "floor(seat_count / 2) + 1; recomputed whenever seat_count changes"

  - name: AdFundSpendProposal
    parent: Brand
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; brand fund the proposal spends from"
      - name: council_id
        type: string
        source: input
        description: "FK -> AdvisoryCouncil.id; council that must ratify"
      - name: title
        type: string
        source: input
        description: "Short proposal title"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount requested from the fund"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "DRAFT | SUBMITTED | APPROVED | REJECTED | EXECUTED"
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | EXECUTED"
      - name: approvals
        type: integer
        source: computed
        description: "Count of distinct seated council members who cast APPROVE votes"
        default: 0
      - name: rejections
        type: integer
        source: computed
        description: "Count of distinct seated council members who cast REJECT votes"
        default: 0
      - name: approver_ids
        type: array
        source: system
        description: "Brokerage ids that voted APPROVE; used for duplicate-vote rejection and segregation audit"
        default: []
      - name: rejecter_ids
        type: array
        source: system
        description: "Brokerage ids that voted REJECT"
        default: []

  - name: ComplianceAudit
    parent: FranchiseAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FranchiseAgreement.id; audited agreement"
      - name: audit_type
        type: enum
        source: input
        description: "SIGNAGE | MARKETING | TECH_ADOPTION | AGENT_ONBOARDING"
        constraints: "SIGNAGE | MARKETING | TECH_ADOPTION | AGENT_ONBOARDING"
      - name: started_at
        type: datetime
        source: system
        description: "Timestamp the audit was started"
      - name: finding
        type: enum
        source: input
        description: "PASS | FAIL; set on completion"
        constraints: "PASS | FAIL"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED"
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED"

  - name: DeidentificationTask
    parent: FranchiseAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> FranchiseAgreement.id; agreement being wound down"
      - name: category
        type: enum
        source: input
        description: "SIGNAGE_REMOVAL | MARKETING_WITHDRAWAL | DATA_PURGE | DOMAIN_RELEASE | DIRECTORY_REMOVAL"
        constraints: "SIGNAGE_REMOVAL | MARKETING_WITHDRAWAL | DATA_PURGE | DOMAIN_RELEASE | DIRECTORY_REMOVAL"
      - name: status
        type: enum
        source: system
        description: "PENDING | COMPLETED | VERIFIED"
        constraints: "PENDING | COMPLETED | VERIFIED"
      - name: due_at
        type: datetime
        source: computed
        description: "Agreement termination timestamp + 60 days; the agreement cannot close until every task is VERIFIED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Brokerage
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: FRANCHISED
        trigger: "system — side effect of the brokerage's first FranchiseAgreement transitioning DRAFT -> ACTIVE"
        actor: system
        preconditions:
          - "Brokerage.status == PROSPECT"
        side_effects:
          - "Brokerage.status := FRANCHISED"
          - "increments Brokerage.version by 1"
      - from: FRANCHISED
        to: TERMINATED
        trigger: "system — side effect of the brokerage's last remaining non-terminal FranchiseAgreement reaching CLOSED"
        actor: system
        preconditions:
          - "no FranchiseAgreement of this brokerage remains in status DRAFT | ACTIVE | SUSPENDED | TERMINATED | DEIDENTIFYING"
        side_effects:
          - "Brokerage.status := TERMINATED"
          - "every Agent of this brokerage with status ACTIVE flips to INACTIVE"
          - "increments Brokerage.version by 1"

  - entity: FranchiseAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /franchise/agreements/{id}/activate"
        actor: FranchisorOps
        preconditions:
          - "Agreement.status == DRAFT"
          - "Brand.status == ACTIVE"
          - "a ConversionPlan exists for this agreement with ready == true"
          - "no other FranchiseAgreement with the same brand_id and market_id is in status ACTIVE | SUSPENDED | DEIDENTIFYING (brand-market conflict check)"
          - "expected_agreement_version matches current version"
        side_effects:
          - "Agreement.status := ACTIVE; activated_at := now"
          - "if Brokerage.status == PROSPECT: Brokerage PROSPECT -> FRANCHISED (its own side effects fire)"
          - "increments FranchiseAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /franchise/agreements/{id}/suspend"
        actor: FranchisorOps
        preconditions:
          - "Agreement.status == ACTIVE"
          - "Agreement.open_cure_count >= 1 (at least one DefaultCase OPEN or CURING)"
        side_effects:
          - "Agreement.status := SUSPENDED"
          - "increments FranchiseAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — side effect of the last OPEN|CURING DefaultCase reaching RESOLVED (open_cure_count falls to 0)"
        actor: system
        preconditions:
          - "Agreement.status == SUSPENDED"
          - "Agreement.open_cure_count == 0"
        side_effects:
          - "Agreement.status := ACTIVE"
          - "increments FranchiseAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — clock sweep when current logical date > term_end and status == ACTIVE"
        actor: system
        preconditions:
          - "Agreement.status == ACTIVE"
          - "logical clock date > term_end"
        side_effects:
          - "Agreement.status := EXPIRED (no de-identification obligations on natural expiry)"
          - "increments FranchiseAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /franchise/agreements/{id}/terminate"
        actor: FranchisorOps
        preconditions:
          - "Agreement.status == ACTIVE or SUSPENDED"
          - "at least one DefaultCase with status ESCALATED and escalated_at <= now - 0 (escalation has occurred)"
        side_effects:
          - "Agreement.status := TERMINATED"
          - "create one DeidentificationTask in status PENDING for each of the five categories with due_at := now + 60 days"
          - "Agreement transitions TERMINATED -> DEIDENTIFYING in the same request once tasks exist"
          - "increments FranchiseAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /franchise/agreements/{id}/terminate"
        actor: FranchisorOps
        preconditions:
          - "Agreement.status == ACTIVE or SUSPENDED"
          - "at least one DefaultCase with status ESCALATED"
        side_effects:
          - "identical to ACTIVE -> TERMINATED side effects"
          - "increments FranchiseAgreement.version by 1"
      - from: TERMINATED
        to: DEIDENTIFYING
        trigger: "system — immediate same-request hop after termination tasks are created"
        actor: system
        preconditions:
          - "Agreement.status == TERMINATED"
        side_effects:
          - "Agreement.status := DEIDENTIFYING"
      - from: DEIDENTIFYING
        to: CLOSED
        trigger: "system — side effect of the last DeidentificationTask reaching VERIFIED"
        actor: system
        preconditions:
          - "every DeidentificationTask of this agreement has status == VERIFIED"
          - "no DefaultCase of this agreement is in status OPEN | CURING | ESCALATED"
        side_effects:
          - "Agreement.status := CLOSED"
          - "if no non-terminal agreement remains for the Brokerage: Brokerage FRANCHISED -> TERMINATED (its side effects fire)"
          - "increments FranchiseAgreement.version by 1"

  - entity: DefaultCase
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: CURING
        trigger: "POST /franchise/default-cases/{id}/start-cure"
        actor: FranchisorOps
        preconditions:
          - "DefaultCase.status == OPEN"
        side_effects:
          - "DefaultCase.status := CURING"
          - "increments DefaultCase.version by 1"
      - from: CURING
        to: RESOLVED
        trigger: "POST /franchise/default-cases/{id}/resolve"
        actor: FranchisorOps
        preconditions:
          - "DefaultCase.status == CURING"
        side_effects:
          - "DefaultCase.status := RESOLVED"
          - "Agreement.open_cure_count recomputed; if Agreement.status == SUSPENDED and open_cure_count == 0: Agreement SUSPENDED -> ACTIVE (its side effects fire)"
          - "increments DefaultCase.version by 1"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /franchise/default-cases/{id}/resolve"
        actor: FranchisorOps
        preconditions:
          - "DefaultCase.status == OPEN"
        side_effects:
          - "identical recompute side effects as CURING -> RESOLVED"
          - "increments DefaultCase.version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /franchise/default-cases/{id}/escalate"
        actor: FranchisorOps
        preconditions:
          - "DefaultCase.status == OPEN or CURING"
        side_effects:
          - "DefaultCase.status := ESCALATED; escalated_at := now"
          - "increments DefaultCase.version by 1"
      - from: CURING
        to: ESCALATED
        trigger: "POST /franchise/default-cases/{id}/escalate"
        actor: FranchisorOps
        preconditions:
          - "DefaultCase.status == OPEN or CURING"
        side_effects:
          - "DefaultCase.status := ESCALATED; escalated_at := now"
          - "increments DefaultCase.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /franchise/default-cases/{id}/resolve"
        actor: FranchisorOps
        preconditions:
          - "DefaultCase.status == ESCALATED"
        side_effects:
          - "DefaultCase.status := RESOLVED"
          - "Agreement.open_cure_count recomputed (ESCALATED no longer counts once RESOLVED; open_cure_count counts only OPEN | CURING)"
          - "increments DefaultCase.version by 1"

  - entity: RoyaltyPeriod
    initial_state: ASSESSED
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: ASSESSED
        to: SETTLED
        trigger: "POST /franchise/royalty-periods/{id}/settle"
        actor: FranchisorOps
        preconditions:
          - "RoyaltyPeriod.status == ASSESSED"
        side_effects:
          - "RoyaltyPeriod.status := SETTLED; settled_at := now"
          - "increments RoyaltyPeriod.version by 1"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /franchise/royalty-periods/{id}/waive"
        actor: FranchisorOps
        preconditions:
          - "RoyaltyPeriod.status == ASSESSED"
          - "royalty_due_cents == 0 (only zero-due periods may be waived)"
        side_effects:
          - "RoyaltyPeriod.status := WAIVED"
          - "increments RoyaltyPeriod.version by 1"

  - entity: AdFundSpendProposal
    initial_state: DRAFT
    terminal_states: [REJECTED, EXECUTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /franchise/ad-fund-proposals/{id}/submit"
        actor: FranchisorOps
        preconditions:
          - "AdFundSpendProposal.status == DRAFT"
          - "AdvisoryCouncil exists for council_id"
        side_effects:
          - "AdFundSpendProposal.status := SUBMITTED"
          - "increments AdFundSpendProposal.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "system — side effect of a cast-vote call when approvals reaches the council quorum_votes"
        actor: system
        preconditions:
          - "AdFundSpendProposal.status == SUBMITTED"
          - "approvals >= AdvisoryCouncil.quorum_votes"
        side_effects:
          - "AdFundSpendProposal.status := APPROVED"
          - "increments AdFundSpendProposal.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system — side effect of a cast-vote call when rejections reaches the council quorum_votes"
        actor: system
        preconditions:
          - "AdFundSpendProposal.status == SUBMITTED"
          - "rejections >= AdvisoryCouncil.quorum_votes"
        side_effects:
          - "AdFundSpendProposal.status := REJECTED"
          - "increments AdFundSpendProposal.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /franchise/ad-fund-proposals/{id}/execute"
        actor: FranchisorOps
        preconditions:
          - "AdFundSpendProposal.status == APPROVED"
          - "ad fund balance for the brand >= amount_cents (brand_fund_balance calculation)"
        side_effects:
          - "create AdFundLedgerEntry {entry_type: SPEND, amount_cents, brand_id, agreement_id: null, period_id: null}"
          - "AdFundSpendProposal.status := EXECUTED"
          - "increments AdFundSpendProposal.version by 1"

  - entity: ComplianceAudit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /franchise/compliance-audits/{id}/start"
        actor: BrandAuditor
        preconditions:
          - "ComplianceAudit.status == SCHEDULED"
          - "FranchiseAgreement.status == ACTIVE"
        side_effects:
          - "ComplianceAudit.status := IN_PROGRESS; started_at := now"
          - "increments ComplianceAudit.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /franchise/compliance-audits/{id}/complete"
        actor: BrandAuditor
        preconditions:
          - "ComplianceAudit.status == IN_PROGRESS"
          - "finding is provided in the request body"
        side_effects:
          - "ComplianceAudit.status := COMPLETED; finding := request finding"
          - "if finding == FAIL: create DefaultCase {agreement_id, reason_code: BRAND_STANDARDS, status: OPEN}; Agreement.open_cure_count recomputed"
          - "increments ComplianceAudit.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /franchise/compliance-audits/{id}/cancel"
        actor: BrandAuditor
        preconditions:
          - "ComplianceAudit.status == SCHEDULED"
        side_effects:
          - "ComplianceAudit.status := CANCELLED"
          - "increments ComplianceAudit.version by 1"

  - entity: DeidentificationTask
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /franchise/deidentification-tasks/{id}/complete"
        actor: FranchiseeAdmin
        preconditions:
          - "DeidentificationTask.status == PENDING"
          - "acting FranchiseeAdmin's X-User-ID equals the agreement's brokerage_id (own-agreement scope)"
        side_effects:
          - "DeidentificationTask.status := COMPLETED"
          - "increments DeidentificationTask.version by 1"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /franchise/deidentification-tasks/{id}/verify"
        actor: FranchisorOps
        preconditions:
          - "DeidentificationTask.status == COMPLETED"
        side_effects:
          - "DeidentificationTask.status := VERIFIED"
          - "if every DeidentificationTask of the agreement is VERIFIED and no DefaultCase is OPEN | CURING | ESCALATED: Agreement DEIDENTIFYING -> CLOSED (its side effects fire, including possible Brokerage FRANCHISED -> TERMINATED and Agent deactivation cascade)"
          - "increments DeidentificationTask.version by 1"

  - entity: Agent
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /franchise/agents/{id}/deactivate OR system cascade on Brokerage TERMINATED"
        actor: FranchiseeAdmin | system
        preconditions:
          - "Agent.status == ACTIVE"
          - "manual path: acting FranchiseeAdmin's X-User-ID equals Agent.brokerage_id"
        side_effects:
          - "Agent.status := INACTIVE"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /franchise/agents/{id}/reactivate"
        actor: FranchiseeAdmin
        preconditions:
          - "Agent.status == INACTIVE"
          - "Brokerage.status == FRANCHISED (cannot reactivate agents of a TERMINATED brokerage)"
          - "acting FranchiseeAdmin's X-User-ID equals Agent.brokerage_id"
        side_effects:
          - "Agent.status := ACTIVE"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-activate-stale-version
    parent_entity: FranchiseAgreement
    write_endpoint: "POST /franchise/agreements/{id}/activate"
    occ_field: "expected_agreement_version"
    description: |
      Activating a FranchiseAgreement whose version has advanced since the
      client last read it is rejected with 412. The canonical case: the client
      read version N, another write (e.g. a milestone completion that made the
      ConversionPlan ready was followed by any agreement mutation) advanced the
      version, and the client's activation attempt carries a stale expectation.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-amend-stale-version
    parent_entity: FranchiseAgreement
    write_endpoint: "POST /franchise/agreements/{id}/amend"
    occ_field: "expected_agreement_version"
    description: |
      Amending a DRAFT FranchiseAgreement's commercial terms is rejected with
      412 when expected_agreement_version does not match the agreement's
      current version, so two writers cannot interleave amendments.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: royalty_rate_assessment
    trigger: "POST /franchise/agreements/{id}/royalty-periods (period assessment)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: G = gci_cents for the month; B = agreement.base_royalty_rate_bps;
      # V = agreement.volume_incentive_rate_bps; T = agreement.volume_incentive_threshold_cents;
      # C = agreement.annual_royalty_cap_cents;
      # Y = agreement.cumulative_gci_cents BEFORE this month (same agreement calendar year);
      # R = agreement.cumulative_billed_royalty_cents BEFORE this month.
      # Step 1 (tier split on annual cumulative GCI):
      pre_gci = Y
      post_gci = Y + G
      low_part = max(0, min(post_gci, T) - min(pre_gci, T))
      high_part = G - low_part
      raw_royalty_cents = floor(low_part * B / 10000) + floor(high_part * V / 10000)
      # Step 2 (rounding): each leg is floored independently BEFORE summing —
      # round-per-leg-then-sum is pinned; sum-then-round is forbidden.
      # Step 3 (annual cap):
      billed_royalty_cents = min(raw_royalty_cents, max(0, C - R))
      # Step 4 (volume incentive rebate — evaluation order pinned AFTER the cap,
      # so the rebate never re-opens capped royalty):
      rebate_cents = 0
      if post_gci > T:
        rebate_cents = floor(high_part * (B - V) * REBATE_PCT / 100 / 10000)
      royalty_due_cents = max(0, billed_royalty_cents - rebate_cents)
      # Step 5: update running totals
      agreement.cumulative_billed_royalty_cents = R + billed_royalty_cents
      agreement.cumulative_gci_cents = post_gci
      # Calendar-year reset: when a RoyaltyPeriod is created whose period_month's
      # calendar year differs from the year of the agreement's most recent prior
      # RoyaltyPeriod (or when no prior period exists and term_start's year
      # differs), both cumulative fields reset to 0 BEFORE this formula runs.
    input_set: "GCIReport row for (agreement_id, period_month); agreement commercial fields; agreement cumulative counters for the current agreement calendar year"
    constants:
      REBATE_PCT: 50
      BPS_DENOMINATOR: 10000
    precision: "integer cents; each multiplication leg uses floor division; round-per-leg-then-sum pinned"
    variants:
      - name: provisional
        when: "RoyaltyPeriod.provisional_royalty_cents, computed at the same assessment for reporting"
        difference: "Ignores the annual cap (Step 3 skipped) and ignores the volume-incentive rebate (Step 4 skipped): provisional_royalty_cents = raw_royalty_cents. Same GCI input, different result whenever cap or rebate binds."
      - name: final
        when: "RoyaltyPeriod.royalty_due_cents"
        difference: "Full five-step pipeline including cap and rebate."

  - name: ad_fund_accrual
    trigger: "POST /franchise/agreements/{id}/royalty-periods (same assessment as royalty_rate_assessment)"
    algorithm: aggregation
    formula: |
      # Suspension rule: if the agreement's status is SUSPENDED at assessment
      # time, ad_fund_due_cents = 0 and NO AdFundLedgerEntry is created for the
      # period. Otherwise:
      ad_fund_due_cents = floor(G * agreement.ad_fund_rate_bps / 10000)
      # Rounding order pinned: floor per period at accrual time, then ledger
      # balance sums already-floored integers — there is exactly one rounding
      # event per period, at accrual, never at aggregation.
      # Side effect: create AdFundLedgerEntry {entry_type: COLLECT, amount_cents:
      # ad_fund_due_cents, brand_id: agreement.brand_id, agreement_id,
      # period_id: new period id} — but only when ad_fund_due_cents > 0.
    input_set: "same GCI snapshot as royalty_rate_assessment; agreement.ad_fund_rate_bps; agreement.status at assessment time"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents; floor at accrual; no second rounding downstream"

  - name: quorum_rule
    trigger: "on AdvisoryCouncil creation and seat_count change; consulted on every AdFundSpendProposal cast-vote"
    algorithm: threshold
    formula: |
      quorum_votes = floor(seat_count / 2) + 1
      # A SUBMITTED proposal auto-approves the moment approvals >= quorum_votes;
      # auto-rejects the moment rejections >= quorum_votes. Comparison is >=
      # (inclusive): at quorum exactly, the proposal resolves.
    input_set: "AdvisoryCouncil.seat_count; AdFundSpendProposal.approvals / rejections"
    constants: {}
    precision: "integer; exact floor"

  - name: brand_fund_balance
    trigger: "GET /franchise/brands/{id}/ad-fund-balance; precondition of AdFundSpendProposal execute"
    algorithm: aggregation
    formula: |
      balance_cents = sum(amount_cents for COLLECT entries of brand)
                      - sum(amount_cents for SPEND entries of brand)
      # Both sums are over AdFundLedgerEntry rows with entry_type COLLECT /
      # SPEND respectively, all periods, no time window. Entries are append-only.
    input_set: "all AdFundLedgerEntry rows with brand_id == brand"
    constants: {}
    precision: "integer cents; exact"

  - name: brand_market_conflict
    trigger: "FranchiseAgreement activation (DRAFT -> ACTIVE)"
    algorithm: constraint_propagation
    formula: |
      conflict_exists = any other FranchiseAgreement A' where
        A'.brand_id == A.brand_id AND A'.market_id == A.market_id
        AND A'.status in {ACTIVE, SUSPENDED, DEIDENTIFYING}
      # A TERMINATED agreement still blocks re-grant: it is mid-de-identification
      # only in DEIDENTIFYING; plain TERMINATED is a transient hop state and is
      # treated as blocking as well via the DEIDENTIFYING it immediately enters.
      # EXPIRED and CLOSED and DRAFT do NOT block.
      # Note the interval semantics: territory rights are treated as occupying
      # the half-open interval [term_start, term_end + 1 day); an agreement whose
      # term_end is yesterday imposes no conflict today.
    input_set: "all FranchiseAgreement rows sharing (brand_id, market_id) with the candidate"
    constants: {}
    precision: "boolean; exact set membership"

  - name: open_cure_count
    trigger: "on DefaultCase create / resolve / escalate"
    algorithm: aggregation
    formula: |
      Agreement.open_cure_count = count of DefaultCase rows where
        agreement_id == agreement AND status in {OPEN, CURING}
      # ESCALATED defaults do NOT count toward open_cure_count (they gate
      # termination instead). RESOLVED never counts.
    input_set: "DefaultCase rows of the agreement"
    constants: {}
    precision: "integer; exact"

  - name: conversion_readiness
    trigger: "on every ConversionPlan milestone completion"
    algorithm: threshold
    formula: |
      milestones_done = count of milestones with done == true
      ready = (milestones_done == len(milestones)) and (len(milestones) > 0)
      # Boundary: an empty milestones array is never ready; a plan with all
      # milestones done is ready — the comparison is equality, not >.
    input_set: "ConversionPlan.milestones"
    constants: {}
    precision: "integer count; boolean"

  - name: council_seat_eligibility
    trigger: "on AdvisoryCouncil creation and member replacement"
    algorithm: constraint_propagation
    formula: |
      eligible(brokerage, brand) =
        exists FranchiseAgreement A where A.brokerage_id == brokerage
          AND A.brand_id == brand AND A.status in {ACTIVE, SUSPENDED}
        AND NOT exists AdvisoryCouncil C' where C'.brand_id == brand
          AND C'.id != council AND brokerage in C'.member_brokerage_ids
      # A brokerage must hold an active-or-suspended agreement in the brand and
      # must not already sit on another council of the same brand.
    input_set: "FranchiseAgreement rows; AdvisoryCouncil rows of the brand"
    constants: {}
    precision: "boolean; exact"

  - name: deidentification_deadline
    trigger: "on Agreement termination (task creation) and on close attempt"
    algorithm: projection
    formula: |
      task.due_at = agreement_termination_timestamp + 60 days
      # The agreement cannot transition DEIDENTIFYING -> CLOSED until every task
      # is VERIFIED, regardless of whether due_at has passed; due_at is advisory
      # for lateness reporting, not a gate. Late-but-verified still closes.
    input_set: "agreement termination timestamp; task statuses"
    constants:
      DEIDENTIFY_WINDOW_DAYS: 60
    precision: "datetime; exact day arithmetic"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "ownership: FranchiseeAdmin X-User-ID must equal the brokerage_id of the target resource's brokerage scope (agents, agent-count reports, GCI reports, de-identification task completion)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /franchise/agents/{id}/deactivate, POST /franchise/agents/{id}/reactivate, POST /franchise/agreements/{id}/agent-count-reports, POST /franchise/agreements/{id}/gci-reports, POST /franchise/deidentification-tasks/{id}/complete"
  - priority: 4
    category: existence
    check: "every id referenced in path or body (agreement, brand, market, brokerage, council, proposal, default case, audit, task, period) exists; path ids validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "target entity is in a state from which the requested transition exists per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "occ: expected_agreement_version matches FranchiseAgreement.version on activate/amend"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /franchise/agreements/{id}/activate, POST /franchise/agreements/{id}/amend"
  - priority: 7
    category: business_constraint
    check: "payload shape: required fields present, enum values valid, ranges respected (rates in bps bounds, amounts > 0, dates ordered)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 8
    category: business_temporal
    check: "brand-market conflict: activating an agreement whose (brand_id, market_id) matches another agreement in ACTIVE | SUSPENDED | TERMINATED | DEIDENTIFYING status is rejected"
    error_id: ERR_TERRITORY_CONFLICT
    http_status: 409
    applies_to: "POST /franchise/agreements/{id}/activate"
  - priority: 9
    category: business_temporal
    check: "term sanity: term_end strictly after term_start; renewal agreement's term_start must be >= renewed_from agreement's term_end"
    error_id: ERR_INVALID_TERM
    http_status: 422
    applies_to: "POST /franchise/agreements, POST /franchise/agreements/{id}/amend"
  - priority: 10
    category: business_referential
    check: "council seat eligibility: every member_brokerage_id passes council_seat_eligibility for the brand"
    error_id: ERR_COUNCIL_INELIGIBLE_MEMBER
    http_status: 422
    applies_to: "POST /franchise/advisory-councils, POST /franchise/advisory-councils/{id}/replace-member"
  - priority: 11
    category: business_constraint
    check: "report uniqueness: no existing AgentCountReport or GCIReport with the same (agreement_id, period_month)"
    error_id: ERR_DUPLICATE_REPORT
    http_status: 409
    applies_to: "POST /franchise/agreements/{id}/agent-count-reports, POST /franchise/agreements/{id}/gci-reports"
  - priority: 12
    category: business_constraint
    check: "period uniqueness: no existing RoyaltyPeriod with the same (agreement_id, period_month)"
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST /franchise/agreements/{id}/royalty-periods"
  - priority: 13
    category: business_referential
    check: "assessment requires a GCIReport for (agreement_id, period_month) to exist"
    error_id: ERR_GCI_REPORT_MISSING
    http_status: 422
    applies_to: "POST /franchise/agreements/{id}/royalty-periods"
  - priority: 14
    category: business_fiscal
    check: "ad fund spend: proposal.amount_cents <= brand_fund_balance at execute time"
    error_id: ERR_INSUFFICIENT_FUND_BALANCE
    http_status: 422
    applies_to: "POST /franchise/ad-fund-proposals/{id}/execute"
  - priority: 15
    category: business_safety
    check: "vote uniqueness: the voting brokerage has not already cast a vote (approve or reject) on this proposal"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /franchise/ad-fund-proposals/{id}/votes"
  - priority: 16
    category: business_safety
    check: "vote membership: the voting brokerage is a seated member of the proposal's council"
    error_id: ERR_NOT_COUNCIL_MEMBER
    http_status: 403
    applies_to: "POST /franchise/ad-fund-proposals/{id}/votes"
  - priority: 17
    category: business_constraint
    check: "waive requires royalty_due_cents == 0"
    error_id: ERR_WAIVE_REQUIRES_ZERO_DUE
    http_status: 422
    applies_to: "POST /franchise/royalty-periods/{id}/waive"
  - priority: 18
    category: business_constraint
    check: "termination requires at least one ESCALATED DefaultCase on the agreement"
    error_id: ERR_TERMINATION_REQUIRES_ESCALATED_DEFAULT
    http_status: 422
    applies_to: "POST /franchise/agreements/{id}/terminate"
  - priority: 19
    category: business_constraint
    check: "suspension requires open_cure_count >= 1"
    error_id: ERR_SUSPENSION_REQUIRES_OPEN_DEFAULT
    http_status: 422
    applies_to: "POST /franchise/agreements/{id}/suspend"
  - priority: 20
    category: business_constraint
    check: "activation requires an existing ConversionPlan with ready == true for this agreement"
    error_id: ERR_CONVERSION_INCOMPLETE
    http_status: 422
    applies_to: "POST /franchise/agreements/{id}/activate"
  - priority: 21
    category: business_constraint
    check: "milestone completion index must reference an existing milestone not already done"
    error_id: ERR_MILESTONE_INVALID
    http_status: 422
    applies_to: "POST /franchise/conversion-plans/{id}/milestones/complete"
  - priority: 22
    category: state
    check: "audit start/complete requires the parent agreement to be ACTIVE (start); complete only from IN_PROGRESS"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /franchise/compliance-audits/{id}/start, POST /franchise/compliance-audits/{id}/complete"
  - priority: 23
    category: business_temporal
    check: "clock sweep: POST /franchise/_clock/set_current_utc moves the logical clock forward only; setting it backwards is rejected"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /franchise/_clock/set_current_utc"
  - priority: 24
    category: business_constraint
    check: "reports only accepted while agreement is ACTIVE or SUSPENDED"
    error_id: ERR_AGREEMENT_NOT_LIVE
    http_status: 409
    applies_to: "POST /franchise/agreements/{id}/agent-count-reports, POST /franchise/agreements/{id}/gci-reports, POST /franchise/agreements/{id}/royalty-periods"
  - priority: 25
    category: business_constraint
    check: "agent license_no unique within brokerage"
    error_id: ERR_DUPLICATE_LICENSE
    http_status: 409
    applies_to: "POST /franchise/brokerages/{id}/agents"
  - priority: 26
    category: business_constraint
    check: "agent create requires brokerage status PROSPECT or FRANCHISED (not TERMINATED)"
    error_id: ERR_BROKERAGE_TERMINATED
    http_status: 409
    applies_to: "POST /franchise/brokerages/{id}/agents"
  - priority: 27
    category: business_constraint
    check: "agreement create requires brand status ACTIVE and brokerage status PROSPECT or FRANCHISED"
    error_id: ERR_BRAND_OR_BROKERAGE_INACTIVE
    http_status: 409
    applies_to: "POST /franchise/agreements"
  - priority: 28
    category: business_constraint
    check: "renewal: renewed_from_id must reference an agreement of the same brokerage and same brand, and must not itself be a renewal orphan (target must exist)"
    error_id: ERR_RENEWAL_TARGET_INVALID
    http_status: 422
    applies_to: "POST /franchise/agreements"
  - priority: 29
    category: business_safety
    check: "segregation: a council member brokerage may not vote on a proposal whose brand fund it is in default to (brokerage has an ESCALATED DefaultCase on any agreement of the proposal's brand)"
    error_id: ERR_VOTER_IN_DEFAULT
    http_status: 403
    applies_to: "POST /franchise/ad-fund-proposals/{id}/votes"
  - priority: 30
    category: business_constraint
    check: "de-identification verify order: a task must be COMPLETED before it can be VERIFIED (state precondition covers), and agreement close requires all five categories present"
    error_id: ERR_DEIDENTIFICATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /franchise/deidentification-tasks/{id}/verify"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/franchise/brands"
    description: "Create a brand"
    roles: [FranchisorOps]
    code: 201
    input: [brand_code, display_name]
    output: Brand
    side_effects: []
  - method: GET
    path: "/franchise/brands"
    description: "List brands with pagination"
    roles: [FranchisorOps, FranchiseeAdmin, BrandAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Brand[]"
    side_effects: []
  - method: GET
    path: "/franchise/brands/{id}"
    description: "Get one brand"
    roles: [FranchisorOps, FranchiseeAdmin, BrandAuditor]
    code: 200
    input: []
    output: Brand
    side_effects: []
  - method: GET
    path: "/franchise/brands/{id}/ad-fund-balance"
    description: "Computed read of brand_fund_balance"
    roles: [FranchisorOps, FranchiseeAdmin]
    code: 200
    input: []
    output: "{ balance_cents: integer, brand_id: string }"
    side_effects: []
  - method: GET
    path: "/franchise/brands/{id}/ad-fund-ledger"
    description: "Reverse-reachability: list AdFundLedgerEntry rows for a brand"
    roles: [FranchisorOps, FranchiseeAdmin]
    code: 200
    input: ["limit?", "offset?", "entry_type?", "agreement_id?", "period_id?"]
    output: "AdFundLedgerEntry[]"
    side_effects: []
  - method: POST
    path: "/franchise/markets"
    description: "Create a market"
    roles: [FranchisorOps]
    code: 201
    input: [market_code, name]
    output: Market
    side_effects: []
  - method: GET
    path: "/franchise/markets"
    description: "List markets"
    roles: [FranchisorOps, FranchiseeAdmin, BrandAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Market[]"
    side_effects: []
  - method: POST
    path: "/franchise/brokerages"
    description: "Register a prospective brokerage"
    roles: [FranchisorOps]
    code: 201
    input: [legal_name, home_market_id, principal_email]
    output: Brokerage
    side_effects: []
  - method: GET
    path: "/franchise/brokerages"
    description: "List brokerages"
    roles: [FranchisorOps, BrandAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "home_market_id?"]
