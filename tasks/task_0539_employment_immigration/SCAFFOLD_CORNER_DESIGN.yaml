          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "entity_backed ownership: acting as Employer B (X-User-ID==emp_b), POST /prevailing-wage-determinations with employer_id==emp_a → ERR_UNAUTHORIZED (resource.employer_id != X-User-ID)."
        test_recipe:
          setup:
            - "Two Employers A and B exist."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "700000006", legal_name: "Owner A", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_a: $.data.id }
            - call: "POST /employers"
              payload: { fein: "700000007", legal_name: "Owner B", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_b: $.data.id }
          trigger:
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_a}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"
            - "response status == 403"

      - name: missing_x_user_id_header_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request carrying X-User-Role EmployerAgent but NO X-User-ID header → ERR_UNAUTHENTICATED (401); both headers are required (as_user_id intentionally omitted below to signal the absent X-User-ID header)."
        test_recipe:
          setup:
            - "One Employer exists to address by id."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "700000008", legal_name: "NoId Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /employers/${emp_id}"
              as: EmployerAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"
            - "response status == 401"

      - name: shared_get_allowed_for_all_roles
        claim_type: peer_roles
        grounds:
          - roles.DOLAnalyst
          - roles.ComplianceAuditor
          - endpoints.GET /employers/{id}
        distinguishing_aspect: "GET /employers/{id} is a shared_operation; a DOLAnalyst (opaque) and a ComplianceAuditor can both read it → 200, no ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "One Employer exists."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "700000009", legal_name: "SharedGet Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /employers/${emp_id}"
              as: DOLAnalyst
              captures: { name_dol: $.data.legal_name }
            - call: "GET /employers/${emp_id}"
              as: ComplianceAuditor
              captures: { name_ca: $.data.legal_name }
          assert:
            - "both responses status == 200"
            - "Employer.${emp_id}.legal_name == \"SharedGet Co\" in both responses"

  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_employer_version_on_pwd_issue_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pwd-issue-stale-employer]
          - validations[priority=6]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST /prevailing-wage-determinations/{id}/transitions
        distinguishing_aspect: "After PWD_A is issued (Employer.version advances 1→2), issuing PWD_B with expected_employer_version still bound to the original (now-stale) value 1 → ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Employer created (version captured as 1); PWD_A and PWD_B both PENDING; PWD_A then issued so Employer.version==2 while PWD_B stays PENDING."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "800000001", legal_name: "Occ Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_a: $.data.id }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_B", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 11000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_b: $.data.id }
            - call: "POST /prevailing-wage-determinations/${pwd_a}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v0}" }
              as: DOLAnalyst
          trigger:
            - call: "POST /prevailing-wage-determinations/${pwd_b}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v0}" }
              as: DOLAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "response status == 412"
            - "PrevailingWageDetermination.${pwd_b}.status == PENDING (unchanged)"

      - name: occ_current_employer_version_issues_and_increments_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pwd-issue-stale-employer]
          - entities.Employer.fields.version
          - state_machines.PrevailingWageDetermination.PENDING_to_ISSUED
        distinguishing_aspect: "Issuing a PWD with expected_employer_version matching the current Employer.version (1) succeeds; PWD becomes ISSUED and Employer.version increments to 2."
        test_recipe:
          setup:
            - "Employer (version 1) with one PENDING PWD."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "800000002", legal_name: "OccOk Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id }
          trigger:
            - call: "POST /prevailing-wage-determinations/${pwd_id}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v0}" }
              as: DOLAnalyst
              captures: { st: $.data.status }
            - call: "GET /employers/${emp_id}"
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { emp_v1: $.data.version }
          assert:
            - "PrevailingWageDetermination.${pwd_id}.status == ISSUED"
            - "Employer.${emp_id}.version == 2"

      - name: cascade_pwd_supersede_reverts_perm_and_voids_steps
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PrevailingWageDetermination.ISSUED_to_SUPERSEDED
        excluded_because:
          difficulty_instance: transitive_cascade / pwd_supersede_reverts_perm_and_voids_steps
          rationale: "The depth-3 PWD-supersede → PermCase-revert → RecruitmentStep-void chain is fully asserted by the named §1.8 instance."

      - name: cascade_lca_withdraw_denies_petition
        claim_type: cascading_side_effects
        grounds:
          - state_machines.LCA.CERTIFIED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / petition_submit_state_beats_referential
          rationale: "The LCA WITHDRAWN → H1BPetition DENIED cascade is set up and asserted (petition DENIED) inside the named §1.8 instance."

      - name: dual_variant_required_wage_switch
        claim_type: dual_variant_calculation
        grounds:
          - calculations.required_wage
        excluded_because:
          difficulty_instance: dual_variant_calc / lca_required_wage_provisional_vs_final
          rationale: "Both required_wage variants and the delta on certification are asserted by the named §1.8 instance."

  # ===========================================================================
  # Section 9 — Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_wage_obligation_visible_right_after_certify
        claim_type: immediate
        grounds:
          - state_machines.LCA.DRAFT_to_CERTIFIED
          - entities.Employer.fields.total_wage_obligation_cents
        distinguishing_aspect: "immediate consistency: certifying an LCA (required_wage 12000000) makes Employer.total_wage_obligation_cents==12000000 observable on the very next GET /employers/{id} within the same request flow (no lag)."
        test_recipe:
          setup:
            - "An Employer with total_wage_obligation_cents 0 and a DRAFT LCA (offered 12000000 >= prevailing 10000000)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "900000001", legal_name: "Immediate Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2028-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { lca_id: $.data.id }
          trigger:
            - call: "POST /lcas/${lca_id}/transitions"
              payload: { to_status: "CERTIFIED" }
              as: DOLAnalyst
            - call: "GET /employers/${emp_id}"
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { oblig: $.data.total_wage_obligation_cents }
          assert:
            - "Employer.${emp_id}.total_wage_obligation_cents == 12000000 (immediately after certify)"
