          assert:
            - "Review of rider B: 200 with review_status 'GAP_IDENTIFIED' and capability_gaps exactly ['RIGGING_NEAR_LIMIT'] - 4500 >= 4500 trips the inclusive boundary."
            - "Rider A (4499 kg, one kilogram lower) is CAPABLE with capability_gaps == [] - the threshold is not `>`-shifted."
            - "Clear of rider B: 200 with review_status 'CLEARED' and additional_equipment_cost_cents == 0, with no equipment line ever created - priority 77 exempts RIGGING_NEAR_LIMIT."
            - "Booking B still has additional_equipment_cost_cents == 0 and deposit_required_cents == 175000: the CAPABLE-branch invariance of the deposit also holds for a gap-exempt clear."
            - "Neither rider was rejected: 4500 <= 5000, so REJECTED_INFEASIBLE (which needs submitted_rigging_kg > capacity) was never reachable here."

      - name: dynamic_ticket_price_in_the_high_band_is_clamped_by_the_tier_ceiling
        claim_type: threshold_boundary
        grounds:
          - "§1.3 dynamic_single_ticket_price: sell_through_before >= DYNAMIC_HIGH_BAND 0.85 -> DYNAMIC_HIGH_MULTIPLIER 1.30; unit_price = min(round_half_up(base * multiplier), price_ceiling_cents)."
          - "§1.3 CAPITAL_RESTORATION_FEE_CENTS 200 per ticket."
          - "§1.5 POST /price-tiers/{id}/ticket-sales recomputes tier.sold_qty / gross_cents / available_qty and engagement.realized_gross_cents but does NOT bump Engagement.version."
        distinguishing_aspect: >-
          Lands exactly on the upper band boundary (85 of 100 seats sold gives
          sell_through_before == 0.8500) and makes the high-band price exceed the
          tier ceiling, so the clamp is the observable outcome: 13000 computed,
          12000 charged. The mid-band case that §1.8 owns never reaches the
          ceiling, so the clamp is untested elsewhere.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' (guarantee_floor_cents 200000, historical_sell_through_pct 0.8, routing 2026-09-01 -> 2026-12-31) exist."
            - "A PRESENTED engagement (performance 2026-10-11T19:00Z-22:00Z) has one ACTIVE tier ORCH: 100 seats, base_price_cents 10000, price_ceiling_cents 12000, dynamic_pricing_enabled true, subscription_eligible false."
            - "Round 1 was opened at 300000 / 0.10 and accepted by the artist's representative, so negotiated_fee_cents is 300000 and fee_accepted_by_user_id is the artist's id."
            - "Risk was then assessed: projected_gross = round_half_up(10000 * 100 * 0.8) = 800000, exposure 300000/800000 = 0.375 -> 0.16875; routing slack min(40, 80) = 40 >= 14 -> 0; lead 71 days -> 0.081667; sell-through 0.02. Score = round_half_up(27.04) = 27 -> LOW -> CLEARED, projected_margin_cents = 800000 - 550000 = 250000 (positive, so the accept cascade never escalated it)."
            - "The rider (1000 kg / 200 A / 2 universes) was reviewed to CAPABLE and cleared, the engagement was confirmed, and tickets went on sale."
            - "85 of the 100 seats were then sold in one order at the base price: sell_through_before was 0/100 = 0.0000, multiplier 1.00, unit 10000, gross 850000, restoration 17000."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 100, base_price_cents: 10000, price_ceiling_cents: 12000, dynamic_pricing_enabled: true, subscription_eligible: false }
              captures: { tier_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
              captures: { eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/accept"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
              captures: { eng_v1: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/assess-risk"
              as: FinanceController
              payload: { expected_engagement_version: "${eng_v1}" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_id: "$.data.id" }
            - call: "POST /tech-riders/${rider_id}/review"
              as: TechnicalDirector
            - call: "POST /tech-riders/${rider_id}/clear"
              as: TechnicalDirector
            - call: "POST /engagements/${engagement_id}/confirm"
              as: ProgrammingDirector
            - call: "POST /engagements/${engagement_id}/on-sale"
              as: BoxOfficeManager
              captures: { eng_v2: "$.data.version" }
            - call: "POST /price-tiers/${tier_id}/ticket-sales"
              as: BoxOfficeManager
              payload: { qty: 85, channel: "WEB" }
              captures: { sale1: "$.data.id" }
          trigger:
            - call: "POST /price-tiers/${tier_id}/ticket-sales"
              as: BoxOfficeManager
              payload: { qty: 1, channel: "WINDOW" }
              captures: { sale2: "$.data.id" }
            - call: "GET /price-tiers/${tier_id}"
              as: BoxOfficeManager
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
          assert:
            - "201 with sell_through_pct_at_sale == 0.8500 (85/100, computed BEFORE this sale) and dynamic_multiplier_applied == 1.30 - the `>=` boundary of DYNAMIC_HIGH_BAND is inclusive."
            - "unit_price_cents == 12000, NOT 13000: round_half_up(10000 * 1.30) = 13000 is clamped to price_ceiling_cents."
            - "gross_cents == 12000 and restoration_fee_cents == 200 for the single ticket."
            - "Tier after the sale: sold_qty 86, gross_cents == 862000 (850000 + 12000), available_qty == 14 (100 - 86 - 0 subscription holds), status still ACTIVE."
            - "engagement.realized_gross_cents == 862000 while engagement.version is still ${eng_v2} - ticket sales never bump the engagement's version."
            - "The first sale is unchanged at unit_price_cents 10000 with dynamic_multiplier_applied 1.00: enabling dynamic pricing does not retro-price earlier orders."

      - name: education_subsidy_is_capped_by_the_per_participant_allowance
        claim_type: constants_applied
        grounds:
          - "§1.3 education_subsidy_allowance: base 400000 STUDENT_MATINEE / 150000 MASTERCLASS / 250000 COMMUNITY_WORKSHOP, plus SUBSIDY_PER_PARTICIPANT_CENTS 1500 * participant_capacity; approved = min(requested, allowance)."
          - "§1.5 POST /engagements/{id}/education-programs appends an EDUCATION_SUBSIDY_DRAW entry of -subsidy_approved_cents."
          - "§1.5 GET /engagements/{id}/reserve-ledger-entries lists only entries whose engagement_id is this engagement."
        distinguishing_aspect: >-
          Exercises both branches of the min() in one chain - a request above the
          allowance (capped) and a request below it (honoured) - with two
          different program bases, so an implementation that hard-codes one base
          or always caps is caught. Also pins that the draw posted to the ledger
          is the APPROVED amount, not the requested amount.
        test_recipe:
          setup:
            - "The reserve was opened with a single OPENING_BALANCE entry of 10000000 cents (engagement_id null), so the running balance is 10000000, far above the 5000000 floor."
            - "Grand Hall and artist 'Cadence Quartet' exist; a DRAFT PRESENTED engagement (2026-10-11 performance) exists (education programs require PRESENTED per §1.4 priority 50)."
          setup_api_calls:
            - call: "POST /reserve-ledger-entries"
              as: CenterAdmin
              payload: { entry_type: "OPENING_BALANCE", amount_cents: 10000000, memo: "FY27 education and capital reserve opening balance" }
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/education-programs"
              as: ProgrammingDirector
              payload: { program_type: "MASTERCLASS", participant_capacity: 100, subsidy_requested_cents: 500000 }
              captures: { prog_capped: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/education-programs"
              as: ProgrammingDirector
              payload: { program_type: "STUDENT_MATINEE", participant_capacity: 50, subsidy_requested_cents: 100000 }
              captures: { prog_uncapped: "$.data.id" }
            - call: "GET /engagements/${engagement_id}/reserve-ledger-entries"
              as: FinanceController
              payload: { limit: 10, offset: 0 }
          assert:
            - "Masterclass: allowance = 150000 + 1500*100 = 300000, so subsidy_approved_cents == 300000 against a 500000 request, status 'FUNDED'."
            - "Student matinee: allowance = 400000 + 1500*50 = 475000, which exceeds the 100000 request, so subsidy_approved_cents == 100000 - the min() is not a blind cap."
            - "The engagement-scoped ledger listing reports meta.total_count == 2 and both rows are EDUCATION_SUBSIDY_DRAW with amount_cents -300000 and -100000 (the APPROVED figures, negative)."
            - "balance_after_cents runs 9700000 then 9600000; the center-level OPENING_BALANCE row is absent from this listing because its engagement_id is null."

      - name: education_subsidy_guard_reads_the_latest_ledger_balance
        claim_type: input_set_filtering
        grounds:
          - "§1.3 education_subsidy_allowance: reserve_balance_before = balance_after_cents of the ReserveLedgerEntry with the greatest created_at, or 0 when none exists."
          - "§1.3 requires reserve_balance_before - subsidy_approved_cents >= EDUCATION_RESERVE_FLOOR_CENTS 5000000, comparison `>=`."
          - "§1.6 ERR_RESERVE_INSUFFICIENT (402)."
        distinguishing_aspect: >-
          The input set is deliberately ambiguous: two ledger entries exist and
          only the LATEST balance (5300000) may be consulted - an implementation
          that reads the opening balance (6000000) or sums amount_cents in the
          wrong order would allow the 550000 draw. The second draw then lands the
          balance exactly on the 5000000 floor, proving the comparison is `>=`
          and not `>`.
        test_recipe:
          setup:
            - "The reserve has exactly two entries: OPENING_BALANCE +6000000 (balance_after 6000000) and MANUAL_ADJUSTMENT -700000 (balance_after 5300000), both center-level."
            - "Grand Hall, artist 'Cadence Quartet' and a DRAFT PRESENTED engagement (2026-10-11 performance) exist."
            - "A COMMUNITY_WORKSHOP for 200 participants has allowance 250000 + 1500*200 = 550000, so a 600000 request would be approved at 550000 and would leave 4750000 - below the floor."
          setup_api_calls:
            - call: "POST /reserve-ledger-entries"
              as: CenterAdmin
              payload: { entry_type: "OPENING_BALANCE", amount_cents: 6000000, memo: "FY27 opening balance" }
            - call: "POST /reserve-ledger-entries"
              as: CenterAdmin
              payload: { entry_type: "MANUAL_ADJUSTMENT", amount_cents: -700000, memo: "Orchestra shell replacement transfer" }
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/education-programs"
              as: ProgrammingDirector
              payload: { program_type: "COMMUNITY_WORKSHOP", participant_capacity: 200, subsidy_requested_cents: 600000 }
              captures: { err: "$.data.error_id" }
            - call: "POST /engagements/${engagement_id}/education-programs"
              as: ProgrammingDirector
              payload: { program_type: "COMMUNITY_WORKSHOP", participant_capacity: 200, subsidy_requested_cents: 300000 }
              captures: { prog_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}/reserve-ledger-entries"
              as: CenterAdmin
              payload: { limit: 10, offset: 0 }
          assert:
            - "First attempt: 402 ERR_RESERVE_INSUFFICIENT - 5300000 - 550000 = 4750000 < 5000000. Reading the opening balance instead (6000000 - 550000 = 5450000) would have wrongly succeeded."
            - "No EducationProgram row and no EDUCATION_SUBSIDY_DRAW entry were created by the rejected attempt."
            - "Second attempt: 201 with subsidy_approved_cents == 300000 (the request is below the 550000 allowance) and status 'FUNDED'."
            - "The appended draw has balance_after_cents == 5000000 exactly, and the call succeeded - the floor comparison is `>=`, so landing on the floor is permitted."
            - "The engagement-scoped listing reports meta.total_count == 1: only the successful draw is engagement-scoped."

      - name: rental_settlement_bills_marked_up_services_and_no_artist_split
        claim_type: variant_selection
        grounds:
          - "§1.3 settlement_financials RENTAL_FOUR_WALL: adjusted_gross / guarantee / reimbursable / artist_share all 0; service_charges = round_half_up(1.15 * (labor + equipment)); charges = facility_fee + service_charges + marketing; balance_due = charges - deposit_paid; net = charges - labor - equipment."
          - "§1.3 reserve_pct = 0.05 when 0 <= net < RESERVE_HIGH_BAND_CENTS 1000000; the RENTAL branch adds no restoration term."
          - "§1.2 Settlement DRAFT -> EXPENSES_RECONCILED -> FINALIZED with the PERFORMED -> SETTLED cascade."
        distinguishing_aspect: >-
          Selects the four-wall variant on an engagement that has box-office
          machinery available but sells nothing, which is exactly where a
          PRESENTED-shaped implementation would still compute a guarantee split.
          The SERVICE_MARKUP_PCT step is observable on its own (46000 from 40000
          of labor), and the client-ledger consequence of balance_due is asserted
          after finalization.
        test_recipe:
          setup:
            - "The reserve was opened with OPENING_BALANCE 10000000."
            - "Grand Hall, rental client 'Meridian Dance Company' (credit A, outstanding 0) and UnionDepartment STAGEHANDS (roster 20, 5000/h, defaults) exist."
