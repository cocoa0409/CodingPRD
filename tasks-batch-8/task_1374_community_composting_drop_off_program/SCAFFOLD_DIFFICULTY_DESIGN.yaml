              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "p@x.com", full_name: "P", household_size: 1 }
              as: Anonymous
              captures: { part_id: $.data.id, part_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${part_id}/verify"
              payload: { verification_token: "${part_tok}" }
