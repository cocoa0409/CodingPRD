  # =================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tcp_closed_interval_shared_endpoint_conflicts
        grounds:
          - state_machines.TechnologyControlPlan.DRAFT_to_ACTIVE
          - errors[ERR_TCP_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource: enclave_id; semantics: CLOSED intervals. TCP-A [2026-01-01, 2026-06-30]
          ACTIVE and TCP-B [2026-06-30, 2026-12-31] on the same enclave share the date
          2026-06-30 — under closed-interval semantics that single shared endpoint date IS a
          conflict (ERR_TCP_PERIOD_OVERLAP), unlike the grant half-open rule.
        test_recipe:
          setup:
            - "EAR99 product CLASSIFIED (TCP activation requires a CLASSIFIED product)"
            - "TCP-A on enclave LAB-7, effective 2026-01-01..2026-06-30, activated"
            - "TCP-B on enclave LAB-7, effective 2026-06-30..2026-12-31, in DRAFT"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-960", name: "Gyroscope", controlled_content_pct: 20, unit_value_cents: 5000 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "7A003", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/tcps"
              payload: { name: "TCP-A", enclave_id: "LAB-7", product_id: "${p_id}", segregation_level: "LEVEL_2", effective_from: "2026-01-01", effective_to: "2026-06-30" }
              as: ComplianceAnalyst
              captures: { ta_id: $.data.id }
            - call: "POST /compliance/tcps/${ta_id}/set-status"
              payload: { to: "ACTIVE" }
              as: ComplianceAnalyst
            - call: "POST /compliance/tcps"
              payload: { name: "TCP-B", enclave_id: "LAB-7", product_id: "${p_id}", segregation_level: "LEVEL_1", effective_from: "2026-06-30", effective_to: "2026-12-31" }
              as: ComplianceAnalyst
              captures: { tb_id: $.data.id }
          trigger:
            - call: "POST /compliance/tcps/${tb_id}/set-status"
              payload: { to: "ACTIVE" }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_TCP_PERIOD_OVERLAP\" (closed interval: 2026-06-30 belongs to both)"
            - "TechnologyControlPlan.${tb_id}.status == \"DRAFT\" (unchanged)"
            - "TechnologyControlPlan.${ta_id}.status == \"ACTIVE\" (unchanged)"

      - name: grant_half_open_adjacent_intervals_allowed
        grounds:
          - state_machines.AccessGrant.REQUESTED_to_APPROVED
          - errors[ERR_GRANT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource: (party_id, tcp_id); semantics: HALF-OPEN [start, end). Grant G1
          [2026-08-01, 2026-09-01) ACTIVE and G2 [2026-09-01, 2026-10-01) share only the
          endpoint date — under half-open semantics this is NOT an overlap and G2 is
          APPROVED, the exact opposite outcome of the TCP closed-interval rule.
        test_recipe:
          setup:
            - "EAR99 product CLASSIFIED; TCP on enclave LAB-9 ACTIVE (2026-01-01..2027-01-01)"
            - "Foreign-national party (is_foreign_national=true), clean posture"
            - "G1 [2026-08-01, 2026-09-01) requested by analyst-1, approved by manager-1, activated at the default clock (2026-08-01)"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-970", name: "Accelerometer", controlled_content_pct: 20, unit_value_cents: 7000 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "7A003", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/tcps"
              payload: { name: "TCP-LAB9", enclave_id: "LAB-9", product_id: "${p_id}", segregation_level: "LEVEL_2", effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ComplianceAnalyst
              captures: { tcp_id: $.data.id }
            - call: "POST /compliance/tcps/${tcp_id}/set-status"
              payload: { to: "ACTIVE" }
              as: ComplianceAnalyst
            - call: "POST /compliance/parties"
              payload: { legal_name: "Chen Wei", country_code: "CHN", city: "Shanghai", party_type: "FOREIGN_NATIONAL", is_foreign_national: true }
              as: ComplianceAnalyst
              captures: { party_id: $.data.id }
            - call: "POST /compliance/access-grants"
              payload: { tcp_id: "${tcp_id}", party_id: "${party_id}", start_date: "2026-08-01", end_date: "2026-09-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { g1_id: $.data.id }
            - call: "POST /compliance/access-grants/${g1_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/access-grants/${g1_id}/activate"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/access-grants"
              payload: { tcp_id: "${tcp_id}", party_id: "${party_id}", start_date: "2026-09-01", end_date: "2026-10-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { g2_id: $.data.id }
          trigger:
            - call: "POST /compliance/access-grants/${g2_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
          assert:
            - "AccessGrant.${g2_id}.status == \"APPROVED\" (adjacent [09-01,10-01) vs [08-01,09-01): 09-01 < 09-01 is false, no overlap)"
            - "AccessGrant.${g1_id}.status == \"ACTIVE\" (unchanged)"
            - "Party.${party_id}.active_grant_count == 1 (only G1 is ACTIVE)"

  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: license_value_conserved_across_release_and_return
        grounds:
          - calculations.license_consumption
          - state_machines.Shipment.SCREENED_to_RELEASED
          - state_machines.Shipment.IN_TRANSIT_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity: license VALUE — approved_value_cents == remaining_value_cents +
          consumed_value_cents. Release (consumed +5000 / remaining -5000) paired with its
          compensating RETURN restores both fields exactly; the compliance fee is explicitly
          NOT refunded (order.accumulated_fees_cents stays 75).
        test_recipe:
          setup:
            - "Product EAR 5A002 (pct 50, unit 1000) CLASSIFIED; License APPROVED value 100000 qty 100; clean party; order qty 20 LICENSED -> RELEASED"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-980", name: "Transducer", controlled_content_pct: 50, unit_value_cents: 1000 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "5A002", determination_basis: "CCATS" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/licenses"
              payload: { product_id: "${p_id}", issuing_authority: "BIS", approved_value_cents: 100000, approved_quantity: 100, valid_from: "2026-07-01", valid_until: "2026-12-31", conditions: [] }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /compliance/licenses/${l_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/licenses/${l_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Iberian Components SL", country_code: "ESP", city: "Madrid", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "ESP", end_use: "DUAL_USE", quantity: 20 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
            - call: "POST /compliance/orders/${o_id}/submit"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/orders/${o_id}/attach-license"
              payload: { license_id: "${l_id}" }
              as: TradeOpsSpecialist
            - call: "POST /compliance/orders/${o_id}/release"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments"
              payload: { order_id: "${o_id}", quantity: 5, planned_ship_date: "2026-08-15" }
              as: TradeOpsSpecialist
              captures: { s_id: $.data.id }
            - call: "POST /compliance/shipments/${s_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
          trigger:
            - call: "POST /compliance/shipments/${s_id}/release"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments/${s_id}/advance"
              payload: { event: "DEPART" }
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments/${s_id}/advance"
              payload: { event: "RETURN" }
              as: TradeOpsSpecialist
            - call: "GET /compliance/audit-records?entity_type=Shipment&entity_id=${s_id}&event_type=SHIPMENT_RETURNED"
              payload: {}
              as: ComplianceDirector
              captures: { ar_ret: "$.data[0].event_type" }
          assert:
            - "License.${l_id}.remaining_value_cents == 100000 (release -5000, RETURN +5000: net zero)"
            - "License.${l_id}.consumed_value_cents == 0"
            - "invariant: approved_value_cents (100000) == remaining_value_cents (100000) + consumed_value_cents (0)"
            - "License.${l_id}.remaining_quantity == 100"
            - "Order.${o_id}.shipped_quantity == 0 (release +5, RETURN -5)"
            - "Order.${o_id}.accumulated_fees_cents == 75 (fee NOT refunded on return)"
            - "ar_ret == \"SHIPMENT_RETURNED\""

      - name: party_active_grant_count_conserved_across_activate_revoke
        grounds:
          - state_machines.AccessGrant.APPROVED_to_ACTIVE
          - state_machines.AccessGrant.ACTIVE_to_REVOKED
          - entities.Party.fields.active_grant_count
        distinguishing_aspect: |
          Conserved quantity: a COUNT (different type from license value) —
          Party.active_grant_count == number of the party's grants in status ACTIVE.
          Activate (+1) paired with its compensating revoke (-1) returns the count to 0.
        test_recipe:
          setup:
            - "EAR99 product CLASSIFIED; TCP enclave LAB-11 ACTIVE (2026-01-01..2027-01-01); foreign-national party, clean posture"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-990", name: "Optics", controlled_content_pct: 0, unit_value_cents: 9000 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
