      - name: corner_error_confirmatory_regulatory_ordering_window_officer_then_hold_time
        claim_type: Priority Ordering
        grounds: ["errors[ERR_RETEST_WINDOW_EXPIRED]", "errors[ERR_CONFIRMATORY_SAME_OFFICER]", "errors[ERR_WATER_TEST_HOLD_TIME_EXCEEDED]", "validations[priority=22]", "validations[priority=23]", "validations[priority=25]", "segregation_of_duties"]
        distinguishing_aspect: |
          Three confirmatory attempts against ONE presumptive-positive panel sampled
          2026-06-01T00:00:00Z separate the three G6 rows by their priority order. A
          sample drawn 2026-06-23T00:00:00Z (22 days, out of the right-closed 21-day
          window) submitted by the SAME officer who recorded the presumptive is
          answered ERR_RETEST_WINDOW_EXPIRED, because priority 22 precedes priority 23;
          moving the sample to 2026-06-22T00:00:00Z (exactly 21 days, in window) leaves
          only the segregation-of-duties objection and yields
          ERR_CONFIRMATORY_SAME_OFFICER; and a different officer submitting that same
          in-window sample analysed 36 hours later yields
          ERR_WATER_TEST_HOLD_TIME_EXCEEDED at priority 25. All three write nothing:
          the panel stays ANALYZED_PRESUMPTIVE_POSITIVE, the well stays ADVISORY and no
          child WaterTest exists.
        test_recipe:
          setup:
            - "One account, property, well and technician."
            - "One BACTERIOLOGICAL panel sampled 2026-06-01T00:00:00Z, analysed 2026-06-02T00:00:00Z with coliform present, recorded by officer-alpha, so it sits at ANALYZED_PRESUMPTIVE_POSITIVE and the well at ADVISORY with advisory_reason PRESUMPTIVE_COLIFORM."
            - "Clock advanced to 2026-06-24T00:00:00Z, which is past the retest window but the lapse sweep has NOT been run."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Retest Order Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "ro@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "21 Retest", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 3 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Retest Order Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/water-tests"
              payload: { well_profile_id: "${well_id}", collected_by_technician_id: "${tech_id}", panel_type: "BACTERIOLOGICAL", sample_datetime: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { wt_id: $.data.id }
            - call: "POST /water-service/water-tests/${wt_id}/lab-result"
              payload: { analyzed_at: "2026-06-02T00:00:00Z", coliform_present: true }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-24T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /water-service/water-tests/${wt_id}/confirmatory-result"
              payload: { confirm_sample_datetime: "2026-06-23T00:00:00Z", confirm_analyzed_at: "2026-06-23T06:00:00Z", confirm_coliform_present: false, collected_by_technician_id: "${tech_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { err_window: $.data.error_id }
            - call: "POST /water-service/water-tests/${wt_id}/confirmatory-result"
              payload: { confirm_sample_datetime: "2026-06-22T00:00:00Z", confirm_analyzed_at: "2026-06-22T06:00:00Z", confirm_coliform_present: false, collected_by_technician_id: "${tech_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { err_officer: $.data.error_id }
            - call: "POST /water-service/water-tests/${wt_id}/confirmatory-result"
              payload: { confirm_sample_datetime: "2026-06-22T00:00:00Z", confirm_analyzed_at: "2026-06-23T12:00:00Z", confirm_coliform_present: false, collected_by_technician_id: "${tech_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-bravo"
              captures: { err_hold: $.data.error_id }
          assert:
            - "${err_window} == ERR_RETEST_WINDOW_EXPIRED"
            - "HTTP status is 422 on the 22-day sample"
            - "${err_officer} == ERR_CONFIRMATORY_SAME_OFFICER"
            - "HTTP status is 403 on the same-officer call"
            - "${err_hold} == ERR_WATER_TEST_HOLD_TIME_EXCEEDED"
            - "HTTP status is 422 on the 36-hour confirmatory analysis"
            - "WaterTest.${wt_id}.result_status == ANALYZED_PRESUMPTIVE_POSITIVE"
            - "WaterTest.${wt_id}.confirmed_by_user_id == null"
            - "WellProfile.${well_id}.potability_status == ADVISORY and WellProfile.${well_id}.advisory_reason == PRESUMPTIVE_COLIFORM"
            - "GET /water-service/water-tests with parent_test_id == ${wt_id} returns exactly 0 rows"

      - name: corner_error_scope_gate_outranks_technician_unavailable_on_inspection_start
        claim_type: Priority Ordering
        grounds: ["errors[ERR_ACTOR_SCOPE_VIOLATION]", "errors[ERR_TECHNICIAN_UNAVAILABLE]", "validations[priority=4]", "validations[priority=51]", "state_machines.Inspection.SCHEDULED_to_IN_PROGRESS"]
        distinguishing_aspect: |
          One SCHEDULED inspection assigned to an OFF_DUTY technician answers two
          different codes depending on who calls. A DIFFERENT technician is refused 403
          ERR_ACTOR_SCOPE_VIOLATION at G4 (rank 4) and never reaches the availability
          check at G9 (rank 9); the ASSIGNED but OFF_DUTY technician is refused 409
          ERR_TECHNICIAN_UNAVAILABLE; and once that technician is patched back to
          AVAILABLE the same call succeeds. An implementation that checks availability
          before ownership answers 409 to the stranger too.
        test_recipe:
          setup:
            - "One account, property and well, and two JOURNEYMAN technicians."
            - "One SCHEDULED inspection whose technician_id is the first technician, who is then patched to OFF_DUTY."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Scope Order Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "sq@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "2 Scope", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 3 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Assigned Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_assigned: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Stranger Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_stranger: $.data.id }
            - call: "POST /water-service/inspections"
              payload: { well_profile_id: "${well_id}", technician_id: "${tech_assigned}", scheduled_for: "2026-06-01T10:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "PATCH /water-service/technicians/${tech_assigned}"
              payload: { status: "OFF_DUTY" }
              as: PlatformAdmin
          trigger:
            - call: "POST /water-service/inspections/${insp_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_stranger}"
              captures: { err_scope: $.data.error_id }
            - call: "POST /water-service/inspections/${insp_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_assigned}"
              captures: { err_unavail: $.data.error_id }
            - call: "PATCH /water-service/technicians/${tech_assigned}"
              payload: { status: "AVAILABLE" }
              as: PlatformAdmin
            - call: "POST /water-service/inspections/${insp_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_assigned}"
          assert:
            - "${err_scope} == ERR_ACTOR_SCOPE_VIOLATION"
            - "HTTP status is 403 on the stranger technician's call"
            - "${err_unavail} == ERR_TECHNICIAN_UNAVAILABLE"
            - "HTTP status is 409 on the OFF_DUTY assigned technician's call"
            - "Inspection.${insp_id}.status == IN_PROGRESS"
            - "Technician.${tech_assigned}.status == AVAILABLE"

  - section: rbac
