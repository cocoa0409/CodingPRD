          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A read issued with no X-User-Role and no X-User-ID header returns ERR_UNAUTHENTICATED with HTTP 401 before existence is even checked; the test omits both headers entirely."
        test_recipe:
          setup:
            - "One patient exists."
          setup_api_calls:
            - call: "POST /glp1/patients"
              payload: { email: "rb1@example.com", full_name: "Rb One", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "GET /glp1/patients/${p_id}"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the same request with X-User-Role PlatformAdmin returns HTTP 200"

