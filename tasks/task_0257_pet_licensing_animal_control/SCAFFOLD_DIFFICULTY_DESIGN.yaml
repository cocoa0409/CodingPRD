  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dangerous_overturn_restores_license_final_fee
        grounds:
          - state_machines.DangerousDogCase.INVESTIGATING_to_DESIGNATED
          - state_machines.DangerousDogCase.APPEALED_to_OVERTURNED
          - calculations.dangerous_surcharge
          - entities.License.fields.final_fee_cents
          - entities.Pet.fields.is_dangerous
        distinguishing_aspect: |
          Conserved quantity = License.final_fee_cents. A BITE designation adds surcharge 5000 to an
          ACTIVE license's final_fee_cents; the compensating OVERTURNED transition subtracts exactly
          5000, so after designate-then-overturn the license's final_fee_cents returns to its baseline
          4000 (net surcharge contribution zero) and Pet.is_dangerous returns to false.
        test_recipe:
          setup:
            - "Owner ON pet PN holds one ACTIVE INDIVIDUAL license LN (unaltered, final_fee 4000 at approval, no designation then)"
            - "A BITE case is opened, investigated and DESIGNATED (final_fee → 9000, is_dangerous true), then appealed"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "Owner N", email: "on@x.com", address_zip: "15001" }
              as: LicensingClerk
              captures: { on_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${on_id}", name: "Zeus", species: "DOG", breed: "B", is_altered: false, birth_date: "2022-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${on_id}"
              captures: { pn_id: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${pn_id}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "VN" }
              as: Owner
              as_user_id: "${on_id}"
              captures: { vn_id: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${on_id}", pet_id: "${pn_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${on_id}"
              captures: { ln_id: $.data.id }
            - call: "POST /licenses/${ln_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${on_id}"
            - call: "POST /licenses/${ln_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${ln_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${ln_id}/attach-vaccination"
              payload: { vaccination_record_id: "${vn_id}" }
              as: Owner
              as_user_id: "${on_id}"
            - call: "POST /licenses/${ln_id}/approve"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${ln_id}/issue-tag"
              payload: {}
              as: LicensingClerk
            - call: "POST /dangerous-dog-cases"
              payload: { pet_id: "${pn_id}", incident_summary: "bite", severity: "BITE" }
              as: AnimalControlOfficer
              captures: { nc_id: $.data.id }
            - call: "POST /dangerous-dog-cases/${nc_id}/investigate"
              payload: {}
              as: AnimalControlOfficer
            - call: "POST /dangerous-dog-cases/${nc_id}/designate"
              payload: {}
              as: AnimalControlOfficer
            - call: "POST /dangerous-dog-cases/${nc_id}/appeal"
              payload: {}
              as: Owner
              as_user_id: "${on_id}"
          trigger:
            - call: "POST /dangerous-dog-cases/${nc_id}/overturn"
              payload: {}
              as: AnimalControlOfficer
            - call: "GET /licenses/${ln_id}"
              payload: {}
              as: LicensingClerk
              captures: { ln_final: $.data.final_fee_cents }
          assert:
            - "License.${ln_id}.final_fee_cents == 4000"
            - "Pet.${pn_id}.is_dangerous == false"
            - "DangerousDogCase.${nc_id}.status == OVERTURNED"

      - name: lost_found_unmatch_restores_open_report_count
        grounds:
          - state_machines.LostFoundReport.OPEN_to_MATCHED
          - state_machines.LostFoundReport.MATCHED_to_OPEN
          - entities.LostFoundReport.fields.status
          - entities.LostFoundReport.fields.matched_report_id
          - entities.LostFoundReport.fields.match_score
        distinguishing_aspect: |
          Conserved quantity = number of OPEN reports in the lost/found pool AND link symmetry. Matching
          a LOST/FOUND pair removes both from OPEN (open-count drops by 2) and sets mutual matched_report_id;
          the compensating unmatch returns both to OPEN (open-count restored) and clears both links and
          both match_scores to 0 — a different conserved quantity (report open-count + link symmetry) than
          the License-fee invariant above.
        test_recipe:
          setup:
            - "Two OPEN reports (LOST RO and FOUND FO, same species+zip) matched into a pair (both MATCHED, mutual links, scores 30)"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AnimalControlOfficer
            - call: "POST /lost-found-reports"
              payload: { report_type: "FOUND", species: "DOG", zip_seen: "55555", reported_at: "2026-03-01T08:00:00Z" }
              as: AnimalControlOfficer
              captures: { fo_id: $.data.id }
            - call: "POST /lost-found-reports"
              payload: { report_type: "LOST", species: "DOG", zip_seen: "55555", reported_at: "2026-03-01T07:00:00Z" }
              as: AnimalControlOfficer
              captures: { ro_id: $.data.id }
            - call: "POST /lost-found-reports/${ro_id}/match"
              payload: {}
              as: AnimalControlOfficer
              captures: { ro_score: $.data.match_score }
          trigger:
            - call: "POST /lost-found-reports/${ro_id}/unmatch"
              payload: {}
              as: AnimalControlOfficer
            - call: "GET /lost-found-reports/${fo_id}"
              payload: {}
              as: AnimalControlOfficer
              captures: { fo_status: $.data.status, fo_match: $.data.matched_report_id, fo_score: $.data.match_score }
          assert:
            - "LostFoundReport.${ro_id}.status == OPEN"
            - "LostFoundReport.${ro_id}.matched_report_id == null"
            - "LostFoundReport.${ro_id}.match_score == 0"
            - "LostFoundReport.${fo_id}.status == OPEN"
            - "LostFoundReport.${fo_id}.matched_report_id == null"
            - "LostFoundReport.${fo_id}.match_score == 0"
