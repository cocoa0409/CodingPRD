              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_a: $.data.id }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_validated: $.data.id }
            - call: "POST /assessments/${assess_validated}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { validated_status: $.data.status }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "BIA", assessed_at: "2026-11-01T09:30:00Z", measured_weight_lbs: 158.0, body_fat_pct: 13.8, urine_specific_gravity: 1.021 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_draft: $.data.id, draft_status: $.data.status }
          trigger:
            - call: "POST /assessors/${assessor_id}/suspension"
              payload: { reason: "Program audit irregularities under investigation" }
              as: StateOffice
              captures: { susp_status: $.data.status, susp_validated_count: $.data.validated_assessment_count }
            - call: "GET /assessments/${assess_draft}"
              payload: {}
              as: StateOffice
              captures: { draft_after: $.data.status, draft_reason: $.data.void_reason }
            - call: "GET /assessments/${assess_validated}"
              payload: {}
              as: StateOffice
              captures: { validated_after: $.data.status, validated_reason: $.data.void_reason }
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: StateOffice
              captures: { w_cert: $.data.certification_status, w_source: $.data.source_assessment_id, w_min: $.data.min_weight_class_lbs }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T11:00:00Z", measured_weight_lbs: 157.0, body_fat_pct: 13.5, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { err_not_certified: $.data.error_id }
            - call: "POST /assessors/${assessor_id}/suspension"
              payload: { reason: "Second attempt" }
              as: StateOffice
              captures: { err_repeat: $.data.error_id }
          assert:
            - "${pre_status} == 'CERTIFIED' (8 hours reached the threshold) and ${validated_status} == 'VALIDATED', ${draft_status} == 'DRAFT' before the action"
            - "The action returns 200 with ${susp_status} == 'SUSPENDED' and ${susp_validated_count} == 1 (the counter is history, suspension does not rewrite it)"
            - "${draft_after} == 'VOIDED' with ${draft_reason} == 'ASSESSOR_SUSPENDED' — the declared side effect fired"
            - "${validated_after} == 'VALIDATED' with ${validated_reason} == null: suspension alone voids DRAFTs only, unlike the audit-FAIL cascade which also voids VALIDATED work"
            - "${w_cert} == 'PROVISIONAL', ${w_source} == ${assess_validated} and ${w_min} == 150 — the wrestler's certified figures survive their assessor's suspension"
            - "${err_not_certified} == 'ERR_ASSESSOR_NOT_CERTIFIED' (409, priority 17) — the suspended assessor can no longer open assessments"
            - "${err_repeat} == 'ERR_ASSESSOR_INVALID_STATE' (409) — the action is not idempotent, and the assessor's version was incremented exactly once across both calls"

