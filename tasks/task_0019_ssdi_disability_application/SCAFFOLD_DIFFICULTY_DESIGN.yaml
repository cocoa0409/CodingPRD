      - name: award_suspend_reinstate_invariant_pia_unchanged
        grounds:
          - state_machines.BenefitAward.transitions.ACTIVE_to_SUSPENDED
          - state_machines.BenefitAward.transitions.SUSPENDED_to_ACTIVE
          - entities.BenefitAward.fields.primary_insurance_amount_cents
          - entities.BenefitAward.fields.monthly_benefit_cents
        distinguishing_aspect: |
          Different conserved quantity from instance 1 (categorical
          application status): here the invariant is a NUMERIC monetary
          quantity — BenefitAward.primary_insurance_amount_cents AND
          BenefitAward.monthly_benefit_cents. Forward action: POST
          /awards/{id}/suspend (sets status=SUSPENDED, cascades child
          termination). Compensating action: POST /awards/{id}/reinstate
          (restores status=ACTIVE). The invariant pinned as explicit formula:
          BenefitAward.primary_insurance_amount_cents_at_T0 ==
          BenefitAward.primary_insurance_amount_cents_at_T2 (=196092)
          AND BenefitAward.monthly_benefit_cents_at_T0 ==
          BenefitAward.monthly_benefit_cents_at_T2 (=196092). The
          suspend/reinstate cycle MUST NOT mutate the PIA or
          monthly_benefit; any drift indicates a faulty recompute. (Child
          auxiliaries are deliberately asymmetric per scaffold design but
          PIA is not.)
        test_recipe:
          setup:
            - "AWARDED state, 1 ACTIVE child auxiliary."
            - "Count active children = 1 (pre)."
            - "Suspend → cascade child to TERMINATED_PARENT."
          setup_api_calls:
