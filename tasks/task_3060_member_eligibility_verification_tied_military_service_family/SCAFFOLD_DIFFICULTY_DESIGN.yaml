            - "Both cases remain INTAKE"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: family_case_submit_depends_on_sponsor_member_state
        grounds:
          - validations[priority=20]
          - state_machines.EligibilityCase.INTAKE_to_UNDER_REVIEW
        distinguishing_aspect: |
          Entity pair EligibilityCase -> Member (sponsor): a FAMILY_DERIVATION
          case whose sponsor is SUSPENDED cannot transition INTAKE ->
          UNDER_REVIEW (ERR_SPONSOR_NOT_ACTIVE); reinstating the sponsor (a
          Member-side transition) unblocks the very same submit call with no
          change to the case itself.
        test_recipe:
          setup:
            - "Sponsor S ACTIVE then SUSPENDED (DOCUMENTATION_REVOKED); family case F for S's child sits in INTAKE with evidence attached."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Pat Parent", applicant_dob: "1978-02-02", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
