            - call: "POST /credentials/${credC}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${credC}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${credC}/exam-attempts"
              payload: { exam_type: "ORAL", score: 74, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${credC}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${credC}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-8001", hearing_type: "PLEA", in_custody: true, scheduled_start: "2026-09-15T09:00:00.000Z", scheduled_end: "2026-09-15T10:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { h1: "$.data.id", h1_v1: "$.data.version" }
          trigger:
            - call: "POST /assignments"
              payload: { hearing_id: "${h1}", interpreter_id: "${iA}", delivery_mode: "IN_PERSON", expected_hearing_version: "${h1_v1}" }
              as: SchedulingCoordinator
              captures: { a1: "$.data.id" }
            - call: "GET /hearings/${h1}"
              payload: {}
              as: SchedulingCoordinator
              captures: { h1_v2: "$.data.version", h1_status: "$.data.status" }
            - call: "POST /assignments"
              payload: { hearing_id: "${h1}", interpreter_id: "${iC}", delivery_mode: "IN_PERSON", expected_hearing_version: "${h1_v1}" }
              as: SchedulingCoordinator
              captures: { e_stale_hearing: "$.data.error_id" }
            - call: "POST /assignments"
              payload: { hearing_id: "${h1}", interpreter_id: "${iC}", delivery_mode: "IN_PERSON", expected_hearing_version: "${h1_v2}" }
              as: SchedulingCoordinator
              captures: { a2: "$.data.id", a2_service: "$.data.service_status" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${iC}", language_id: "${lang_kor}", target_tier: "REGISTERED", expected_interpreter_version: "${iC_v1}" }
              as: CredentialingOfficer
              captures: { e_stale_interpreter: "$.data.error_id" }
            - call: "GET /interpreters/${iC}"
              payload: {}
              as: CredentialingOfficer
              captures: { iC_vnow: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${iC}", language_id: "${lang_kor}", target_tier: "REGISTERED", expected_interpreter_version: "${iC_vnow}" }
              as: CredentialingOfficer
              captures: { credC2: "$.data.id", credC2_status: "$.data.status" }
          assert:
            - "the first create returns 201 and ${h1_v2} > ${h1_v1} while ${h1_status} == SCHEDULED — POST /assignments bumps Hearing.version even though coverage is only recorded at confirm"
            - "${e_stale_hearing} == ERR_STALE_HEARING_VERSION with HTTP 412, and GET /assignments with hearing_id == ${h1} still returns total_count == 1 with ${a1} in PROPOSED — the refused replacement superseded nothing"
            - "the retry with the refreshed ${h1_v2} returns 201 with ${a2_service} == PROPOSED, GET /assignments/${a1} now returns service_status == SUPERSEDED, and GET /hearings/${h1} reports a version strictly greater than ${h1_v2}"
            - "re-sending ${h1_v2} a third time now yields ERR_STALE_HEARING_VERSION as well: the value that was fresh one call earlier is stale once the supersede advanced the hearing again"
            - "${iC_v1} is 1 and ${iC_vnow} is strictly greater — recording ethics training, creating a credential and activating it all advance Interpreter.version without any client writing to the interpreter directly"
            - "${e_stale_interpreter} == ERR_STALE_INTERPRETER_VERSION with HTTP 412, a different code from the hearing rule even though both are priority-8 failures, and GET /credentials with interpreter_id == ${iC} still returns total_count == 1"
            - "the retry with ${iC_vnow} returns 201 with ${credC2_status} == PENDING_WRITTEN in kor, leaving the spa credential ACTIVE and untouched"
            - "each 412 response carries ok == false with only error_id and message in data, and no entity version anywhere advanced on a refused write"

      - name: n_level_cascades_are_verified_end_to_end_with_ordering
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers.cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / substantiated_suspension_cascades_four_hops_to_hearing_and_ledger
          rationale: "That instance walks the full four-hop chain complaint -> action -> roster -> assignment -> hearing -> pay ledger in declared order and asserts every hop, including which rows are deliberately left alone."

      - name: both_pay_variants_produce_their_own_totals_and_the_switch_delta_is_correct
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers.dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_then_final_assignment_pay_diverges_on_served_window
          rationale: "That instance prices the same assignment under PROVISIONAL and FINAL, asserts the divergence and reconciles the exact delta through the courthouse ledger."

      - name: the_late_cancellation_lead_time_threshold_is_inclusive_at_forty_eight_hours_and_flips_the_money_path_thirty_minutes_later
        claim_type: rate_threshold_triggers
        grounds: ["calculations[assignment_pay]", state_machines.Hearing.COVERED_to_SCHEDULED, state_machines.Hearing.COVERED_to_UNMET, "endpoints[POST /assignments/{id}/cancel]", entities.RateSchedule.late_cancellation_hours]
        distinguishing_aspect: "late_cancellation_hours is an instantaneous threshold measured on the logical clock at the moment of cancellation, and the comparison is >= so exactly 48 hours of lead time is still an early cancellation. Two identical assignments cancelled thirty minutes apart therefore take opposite money paths — one releases its encumbrance, the other converts it to an obligation — and the hearing lands in a different state in each case."
        test_recipe:
          setup:
            - "Logical clock starts at its default 2026-08-01T00:00:00Z."
            - "Language spa; Courthouse Central Justice Center (county CAS, CERTIFIED_VRI, capacity 2, pay_budget_cents 5000000); one open-ended RateSchedule from 2026-01-01 with late_cancellation_hours 48, late_cancellation_pay_hours 2.0 and certified_hourly_cents 8750."
            - "Interpreters Ana Reyes (iA) and Beto Cruz (iB), each ACTIVE with a CERTIFIED spa credential and ethics COMPLETED."
            - "Two identical hearings at the same courthouse, both spa PLEA with in_custody true on 2026-09-20 09:00-10:00 IN_PERSON: h1 assigned to iA and h2 assigned to iB. Distinct interpreters keep the interval-conflict rule out of the picture; IN_PERSON keeps VRI capacity out of it."
            - "Both assignments are CONFIRMED at the default clock, so each carries an ENCUMBERED PayClaim of 17500 (2.0 minimum-call hours * 8750, no travel, no rare premium)."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Central Justice Center", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 2, pay_budget_cents: 5000000 }
              as: ProgramAdmin
