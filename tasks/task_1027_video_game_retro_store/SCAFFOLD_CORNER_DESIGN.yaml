  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_grade_tradein_returns_forbidden
        claim_type: RBAC denial
        grounds: [roles, endpoints, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Member calling POST /trade-ins/{id}/grade (Clerk/Manager only) is denied with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A member owns a submitted trade-in."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Mg", email: "mg@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "MGG", kind: "GAME", base_price_cents: 4000, base_trade_value_cents: 3000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { member_id: "${m_id}", product_id: "${p_id}", stated_grade: "A", payout_method: "CASH" }
              as: Clerk
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/grade"
              payload: { final_grade: "A" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_FORBIDDEN"

      - name: clerk_cannot_release_stock_returns_forbidden
        claim_type: RBAC denial
        grounds: [roles, endpoints, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Clerk calling POST /product-stocks/{id}/release (Manager-only) is denied with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["An EMBARGOED pool."]
          setup_api_calls:
            - call: "POST /products"
              payload: { title: "CR", kind: "GAME", base_price_cents: 3000, base_trade_value_cents: 1000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 3000, deposit_cents: 500, total_count: 2 }
              as: Manager
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /product-stocks/${st_id}/release"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_FORBIDDEN"

      - name: member_cannot_cancel_other_members_preorder_returns_forbidden
        claim_type: RBAC denial
        grounds: [roles, "validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Member (entity_backed) cancelling another member's pre-order is denied with ERR_NOT_RESOURCE_OWNER (403) because X-User-ID != PreOrder.member_id."
        test_recipe:
          setup: ["Member A owns a WAITLISTED pre-order; Member B acts as themselves."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "OwnA", email: "owna@x.com" }
              as: Clerk
              captures: { a_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "OwnB", email: "ownb@x.com" }
              as: Clerk
              captures: { b_id: $.data.id }
            - call: "POST /products"
              payload: { title: "OG", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 2000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 6000, deposit_cents: 1000, total_count: 2 }
              as: Manager
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${a_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v}" }
              as: Clerk
              captures: { po_a: $.data.id }
          trigger:
            - call: "POST /pre-orders/${po_a}/cancel"
              payload: {}
              as: Member
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_role_header_returns_unauthenticated
        claim_type: RBAC denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no valid X-User-Role is rejected with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB; the trigger is sent with no X-User-Role header."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "NoRole", email: "norole@x.com" }
              as: Member
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: preorder_create_stale_stock_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[preorder-create-stale-stock]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one pre-order create advances ProductStock.version, a second create still carrying the previously observed version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A RELEASED pool total_count=3; version observed once at v1; a first pre-order create bumps it."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Occ1", email: "occ1@x.com" }
              as: Clerk
              captures: { a_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Occ2", email: "occ2@x.com" }
              as: Clerk
              captures: { b_id: $.data.id }
            - call: "POST /products"
              payload: { title: "OccG", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 2000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 6000, deposit_cents: 1000, total_count: 3 }
              as: Manager
              captures: { st_id: $.data.id }
            - call: "POST /product-stocks/${st_id}/release"
              payload: {}
              as: Manager
              captures: { st_v1: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${a_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v1}" }
              as: Clerk
              captures: { po_a: $.data.id }
          trigger:
            - call: "POST /pre-orders"
              payload: { member_id: "${b_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v1}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_STALE_VERSION"

      - name: stock_version_increments_on_release
        claim_type: optimistic_concurrency
        grounds: [entities.ProductStock.fields.version, state_machines.ProductStock.EMBARGOED_to_RELEASED]
        distinguishing_aspect: "ProductStock.version starts at 1 on creation and increments to 2 after POST release, confirming the OCC counter advances on mutation."
        test_recipe:
          setup: ["A newly created EMBARGOED pool (version 1)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { title: "VerG", kind: "GAME", base_price_cents: 3000, base_trade_value_cents: 1000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 3000, deposit_cents: 500, total_count: 2 }
              as: Manager
              captures: { st_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /product-stocks/${st_id}/release"
              payload: {}
              as: Manager
              captures: { v2: $.data.version }
          assert:
            - "ProductStock.${st_id}.version == 2"
            - "ProductStock.${st_id}.release_state == RELEASED"

      - name: preorder_refund_credited_on_cancel_after_deposit
        claim_type: cascading_side_effects
        grounds: [state_machines.PreOrder.DEPOSIT_PAID_to_REFUNDED, calculations.store_credit_balance, entities.StoreCreditEntry.fields.reason]
        distinguishing_aspect: "Cancelling a DEPOSIT_PAID pre-order (paid 2000) appends a PREORDER_REFUND entry and raises the member's store_credit_balance_cents to 2000."
        test_recipe:
          setup: ["A member with a WAITLISTED pre-order that has paid a 2000 deposit."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Rf", email: "rf@x.com" }
              as: Clerk
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { title: "RfG", kind: "GAME", base_price_cents: 6000, base_trade_value_cents: 2000 }
              as: Clerk
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/stocks"
              payload: { unit_price_cents: 6000, deposit_cents: 2000, total_count: 2 }
              as: Manager
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /pre-orders"
              payload: { member_id: "${m_id}", product_stock_id: "${st_id}", expected_product_stock_version: "${st_v}" }
              as: Clerk
              captures: { po_id: $.data.id }
            - call: "POST /pre-orders/${po_id}/payments"
              payload: { amount_cents: 2000 }
              as: Clerk
          trigger:
            - call: "POST /pre-orders/${po_id}/cancel"
              payload: {}
              as: Clerk
              captures: { pay: $.data.payment_status }
          assert:
            - "PreOrder.${po_id}.payment_status == REFUNDED"
            - "Member.${m_id}.store_credit_balance_cents == 2000"

