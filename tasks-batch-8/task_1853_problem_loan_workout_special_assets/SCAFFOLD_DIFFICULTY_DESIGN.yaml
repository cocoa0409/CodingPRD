            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-1818", original_principal_cents: 100000000, contractual_rate_bps: 975, days_past_due: 70 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/collateral"
              payload: { collateral_type: "CRE_REAL_ESTATE", description: "Winery estate", liquidation_discount_bps: 2000 }
              as: WorkoutOfficer
              captures: { col_id: $.data.id, col_v: $.data.version }
            - call: "POST /loans/${loan_id}/workout-cases"
              payload: { entry_trigger: "DELINQUENCY_60", risk_rating_at_entry: 7, case_officer_id: "officer-18" }
              as: WorkoutOfficer
              captures: { case_id: $.data.id }
            - call: "POST /loans/${loan_id}/collateral/${col_id}/appraisals"
              payload: { appraised_value_cents: 80000000, effective_date: "2026-07-15T00:00:00Z", appraiser_id: "appr-3", expected_collateral_version: "${col_v}" }
              as: AppraisalDesk
              as_user_id: "appr-3"
              captures: { a1: $.data.id }
            - call: "POST /loans/${loan_id}/collateral/${col_id}/appraisals/${a1}/submit"
              payload: {}
              as: AppraisalDesk
              as_user_id: "appr-3"
            - call: "POST /loans/${loan_id}/collateral/${col_id}/appraisals/${a1}/accept"
              payload: {}
              as: AppraisalDesk
              as_user_id: "appr-3"
            - call: "GET /loans/${loan_id}/collateral/${col_id}"
              payload: {}
              as: AppraisalDesk
              captures: { col_v2: $.data.version }
          trigger:
            - call: "POST /loans/${loan_id}/collateral/${col_id}/appraisals"
              payload: { appraised_value_cents: 50000000, effective_date: "2026-07-20T00:00:00Z", appraiser_id: "appr-3", expected_collateral_version: "${col_v2}" }
              as: AppraisalDesk
              as_user_id: "appr-3"
              captures: { a2: $.data.id }
            - call: "POST /loans/${loan_id}/collateral/${col_id}/appraisals/${a2}/submit"
              payload: {}
              as: AppraisalDesk
              as_user_id: "appr-3"
            - call: "POST /loans/${loan_id}/collateral/${col_id}/appraisals/${a2}/accept"
              payload: {}
              as: AppraisalDesk
              as_user_id: "appr-3"
          assert:
            - "After first accept: LGD == 36,000,000 (100,000,000 - 64,000,000); LGD + cover == principal: 36,000,000 + 64,000,000 == 100,000,000"
            - "After second accept (supersede): current_liquidation_value_cents == 40,000,000 (50,000,000 × 80%) and LGD == 60,000,000"
            - "INVARIANT maintained: 60,000,000 + 40,000,000 == 100,000,000 == loan.current_principal_cents — no drift from the superseded 80,000,000 appraisal lingering in the cover"

