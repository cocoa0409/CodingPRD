            - "the second call returns HTTP 404 with error_id ERR_BID_NOT_FOUND"
            - "the project still reads status BID_SOLICITATION, awarded_bid_id null, awarded_by_user_id null and version 1"

      - name: certified_roll_lock_outranks_parcel_status_then_recall_reveals_it
        claim_type: priority_ordering
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - state_machines.AssessmentRoll.CERTIFIED_to_DRAFT
          - calculations.parcel_share_units
        distinguishing_aspect: "A SUBDIVIDED parcel under a CERTIFIED roll reports ERR_CERTIFIED_ROLL_LOCKED (priority 14) rather than ERR_PARCEL_NOT_ACTIVE (priority 15); after the roll is recalled the same call reports ERR_PARCEL_NOT_ACTIVE, and an ACTIVE parcel then patches successfully."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; segment with parcel A (240 ft RESIDENTIAL_YEAR_ROUND, 4 trips, verified member) and parcel B (100 ft, verified member) subdivided into 60 ft and 40 ft children."
