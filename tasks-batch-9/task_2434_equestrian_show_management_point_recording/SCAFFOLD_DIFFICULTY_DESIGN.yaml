  - rule_id: transitive_cascade
    instances:

      - name: footing_hold_unwinds_schedule_and_official_load
        grounds:
          - state_machines.Ring.AVAILABLE_to_MAINTENANCE_HOLD
          - state_machines.RingSlot.SCHEDULED_to_CANCELLED
          - state_machines.ShowClass.SCHEDULED_to_OPEN
          - state_machines.OfficialAssignment.ACTIVE_to_RELEASED
          - calculations.official_load_ledger
          - calculations.ring_schedule_layout
          - entities.Official.fields.assigned_minutes
        distinguishing_aspect: |
          A single grounds-operations write reaches four entity types it never names.
          Ring -> MAINTENANCE_HOLD (link 1) cancels the ring's CLASS slots (link 2), which
          reverts each slot's ShowClass to OPEN and nulls estimated_minutes (link 3), which
          releases every ACTIVE OfficialAssignment on those slots and decrements each
          Official's assigned_minutes by the full warm-up-inclusive occupancy (link 4).
          Link 4 is two hops from anything in the request body.
        test_recipe:
          setup:
            - "One APPROVED show, Ring A (turnover_buffer_minutes 10, footing_condition_score 100)."
            - "One JUMPER division and class 101 OPEN with zero class entries, so its projected duration is the floor 20 minutes."
            - "A JUMPER-licensed JUDGE and a JUMPER-licensed STEWARD, both level 2."
            - "Class 101 booked into Ring A at 2026-09-10T14:00:00Z (end 14:20, warm-up start 13:30), with both officials ACTIVE on that slot."
