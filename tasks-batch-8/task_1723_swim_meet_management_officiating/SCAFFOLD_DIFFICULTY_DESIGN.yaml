            - { call: "POST /swimmers", payload: { team_id: "${team_id}", full_name: "L Four", birth_date: "2014-01-04", gender: "M" }, as: TeamCoach, as_user_id: "${team_id}", captures: { sw4: "$.data.id" } }
            - { call: "POST /events", payload: { meet_id: "${meet_id}", event_number: 7, gender: "M", age_group: "ELEVEN_TWELVE", stroke: "FREESTYLE_RELAY", distance_meters: 200, is_relay: true, session_date: "2026-08-15", scheduled_start_minute: 600, scheduled_end_minute: 630 }, as: MeetDirector, captures: { ev_r: "$.data.id" } }
            - { call: "POST /relay-teams", payload: { team_id: "${team_id}", event_id: "${ev_r}", relay_name: "A", seed_time_cs: 9500 }, as: TeamCoach, as_user_id: "${team_id}", captures: { rl_a: "$.data.id", en_a: "$.data.entry_id" } }
            - { call: "POST /entries/${en_a}/verify", payload: {}, as: MeetDirector }
            - { call: "POST /relay-teams/${rl_a}/legs", payload: { leg_number: 1, swimmer_id: "${sw1}" }, as: TeamCoach, as_user_id: "${team_id}" }
            - { call: "POST /relay-teams/${rl_a}/legs", payload: { leg_number: 2, swimmer_id: "${sw2}" }, as: TeamCoach, as_user_id: "${team_id}" }
            - { call: "POST /relay-teams/${rl_a}/legs", payload: { leg_number: 3, swimmer_id: "${sw3}" }, as: TeamCoach, as_user_id: "${team_id}" }
            - { call: "POST /relay-teams/${rl_a}/legs", payload: { leg_number: 4, swimmer_id: "${sw4}" }, as: TeamCoach, as_user_id: "${team_id}" }
            - { call: "POST /relay-teams/${rl_a}/lock", payload: {}, as: TeamCoach, as_user_id: "${team_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: Any }
            - { call: "POST /meets/${meet_id}/close-entries", payload: {}, as: MeetDirector, captures: { meet_v: "$.data.version" } }
            - { call: "POST /meets/${meet_id}/seed", payload: { expected_meet_version: "${meet_v}" }, as: MeetDirector }
            - { call: "GET /lane-assignments", payload: { entry_id: "${en_a}" }, as: Any, captures: { lane_a: "$.data[0].id", lane_a_st: "$.data[0].lane_status" } }
          trigger:
            - { call: "POST /relay-teams/${rl_a}/scratch", payload: {}, as: TeamCoach, as_user_id: "${team_id}", captures: { rl_st: "$.data.status" } }
            - { call: "GET /entries/${en_a}", payload: {}, as: Any, captures: { en_st: "$.data.status" } }
            - { call: "GET /lane-assignments/${lane_a}", payload: {}, as: Any, captures: { lane_st: "$.data.lane_status" } }
            - { call: "GET /teams/${team_id}", payload: {}, as: Any, captures: { cnt: "$.data.active_entry_count" } }
