scenario: |
  Generate task much harder than expert level!

  Scenario description:
  Foundry Production & Seasoning Line Operations (Lodge Cast Iron): sand casting operations with molding, pouring, shakeout and finishing for heavy cookware with weight and dimensional tolerances, iron melting with scrap charge composition and chemistry control, casting defect detection and scrap rate management with rework limits on cast iron, seasoning line applying and baking oil coatings with cure profiles and food safety documentation, domestic manufacturing cost structure against imported competition with pricing and brand positioning, seasonal demand around holidays with inventory build and retail allocation, foundry environmental permitting for emissions, sand reclamation and dust control, factory outlet and museum operations at the plant site

domain_name: foundry-seasoning-ops
api_prefix: /foundry

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  target_difficulty: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku_code, type: string, source: input, description: "Unique SKU code, e.g. L8SK3", constraints: "unique across all products" }
      - { name: name, type: string, source: input, description: "Display name of the cookware item" }
      - { name: category, type: enum, source: input, description: "Cookware category", constraints: "one of SKILLET, DUTCH_OVEN, GRIDDLE, GRILL_PAN, BAKEWARE" }
      - { name: target_weight_oz, type: number, source: input, description: "Nominal finished weight in ounces", constraints: "> 0" }
      - { name: weight_tolerance_oz, type: number, source: input, description: "Allowed absolute deviation from target_weight_oz at inspection", constraints: "> 0" }
      - { name: target_diameter_in, type: number, source: input, description: "Nominal diameter in inches", constraints: "> 0" }
      - { name: diameter_tolerance_in, type: number, source: input, description: "Allowed absolute deviation from target_diameter_in", constraints: "> 0" }
      - { name: min_wall_thickness_in, type: number, source: input, description: "Minimum acceptable wall thickness in inches", constraints: "> 0" }
      - { name: wholesale_price_cents, type: integer, source: input, description: "Wholesale price to retail chains in cents", constraints: ">= round_half_up(import_landed_cost_cents * 1.15) and <= msrp_cents" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price in cents", constraints: ">= wholesale_price_cents" }
      - { name: import_landed_cost_cents, type: integer, source: input, description: "Landed cost of the comparable imported competitor item in cents (brand-positioning baseline)", constraints: "> 0" }
      - { name: peak_season_start_week, type: integer, source: input, description: "ISO week number (1-53) when holiday peak demand starts", constraints: "1..53, <= peak_season_end_week" }
      - { name: peak_season_end_week, type: integer, source: input, description: "ISO week number (1-53) when holiday peak demand ends", constraints: "1..53" }
      - { name: status, type: enum, source: system, description: "Lifecycle status of the product", default: ACTIVE, constraints: "ACTIVE or DISCONTINUED" }
  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the SKU this order produces" }
      - { name: planned_quantity, type: integer, source: input, description: "Number of finished units planned", constraints: ">= 1" }
      - { name: scheduled_week, type: integer, source: input, description: "ISO week number the order is scheduled for", constraints: "1..53" }
      - { name: state, type: enum, source: system, description: "Workflow stage", default: PLANNED, constraints: "PLANNED, MOLDING, POURING, FINISHING, SEASONING, COMPLETE, CANCELLED" }
      - { name: posture, type: enum, source: computed, description: "Derived gate: FROZEN if any linked MeltBatch is HELD, else RESTRICTED if scrap_index >= 0.08, else OPEN", default: OPEN, constraints: "OPEN, RESTRICTED, FROZEN" }
      - { name: scrap_tier, type: enum, source: computed, description: "Derived from scrap_index: GREEN < 0.04, WATCH in [0.04, 0.08), RED >= 0.08", default: GREEN, constraints: "GREEN, WATCH, RED" }
      - { name: poured_units, type: integer, source: system, description: "Count of CastingUnits poured for this order", default: 0 }
      - { name: good_units, type: integer, source: system, description: "Count of units that reached SEASONED", default: 0 }
      - { name: scrapped_units, type: integer, source: system, description: "Count of units scrapped for any reason", default: 0 }
      - { name: defect_scrapped_units, type: integer, source: system, description: "Count of units scrapped via defect disposition (scrap_reason == DEFECT)", default: 0 }
      - { name: scrap_weighted_units, type: number, source: system, description: "Sum over defect-scrapped units of 1.0 (never reworked) or 1.5 (scrapped after >= 1 rework)", default: 0 }
      - { name: scrap_index, type: number, source: computed, description: "scrap_weighted_units / poured_units; 0 when poured_units == 0; 4 decimal places round_half_up" }
      - { name: labor_hours_actual, type: number, source: system, description: "Actual labor hours recorded at completion", default: null }
      - { name: energy_kwh_actual, type: number, source: system, description: "Actual energy kWh recorded at completion", default: null }
      - { name: unit_cost_provisional_cents, type: integer, source: computed, description: "round_half_up(material_to_date_cents / planned_quantity) + 1450; material_to_date sums actual_charge_cost_cents of non-CANCELLED MeltBatches" }
      - { name: unit_cost_final_cents, type: integer, source: computed, description: "Set at completion: round_half_up((material + labor + energy + overhead) / good_units); null until COMPLETE", default: null }
      - { name: margin_flag, type: boolean, source: computed, description: "true at completion when (wholesale_price_cents - unit_cost_final_cents) / wholesale_price_cents < 0.30", default: false }
  - name: MeltBatch
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id; the order this melt feeds" }
      - { name: furnace_id, type: enum, source: input, description: "Furnace booking resource", constraints: "FURNACE_A or FURNACE_B" }
      - { name: planned_tap_start, type: datetime, source: input, description: "Planned tap window start (half-open interval start)" }
      - { name: planned_tap_end, type: datetime, source: input, description: "Planned tap window end (half-open interval end)", constraints: "must be > planned_tap_start" }
      - { name: planned_iron_lbs, type: number, source: input, description: "Planned iron yield of the melt in pounds", constraints: "> 0" }
      - { name: planned_pig_iron_pct, type: number, source: input, description: "Planned charge percentage of pig iron", constraints: "four planned_*_pct fields must sum to 100.0 (+-0.01)" }
      - { name: planned_scrap_steel_pct, type: number, source: input, description: "Planned charge percentage of purchased scrap steel" }
      - { name: planned_returns_pct, type: number, source: input, description: "Planned charge percentage of internal returns (gates, risers, scrapped castings)" }
      - { name: planned_alloy_pct, type: number, source: input, description: "Planned charge percentage of alloy additions" }
      - { name: state, type: enum, source: system, description: "Melt workflow state", default: CHARGING, constraints: "CHARGING, MELTING, CHEMISTRY_CHECK, ADJUSTMENT, CERTIFIED, TAPPED, EXHAUSTED, HELD, CANCELLED" }
      - { name: state_before_hold, type: enum, source: system, description: "State the batch returns to when an emissions hold lifts; null unless HELD", default: null }
      - { name: adjustment_count, type: integer, source: system, description: "Number of CHEMISTRY_CHECK -> ADJUSTMENT cycles", default: 0 }
      - { name: pig_iron_lbs, type: number, source: system, description: "Charged pig iron pounds (accumulates across charge calls)", default: 0 }
      - { name: scrap_steel_lbs, type: number, source: system, description: "Charged scrap steel pounds", default: 0 }
      - { name: returns_lbs, type: number, source: system, description: "Charged internal returns pounds", default: 0 }
      - { name: alloy_lbs, type: number, source: system, description: "Charged alloy pounds", default: 0 }
      - { name: planned_charge_cost_cents, type: integer, source: computed, description: "round_half_up(planned_iron_lbs * (planned mix pct_i * price_i) / 100) computed at creation" }
      - { name: actual_charge_cost_cents, type: integer, source: computed, description: "Accumulates per charge call: for each call, each component line is round_half_up(lbs * price_cents) THEN lines are summed", default: 0 }
      - { name: carbon_pct, type: number, source: input, description: "Last recorded carbon percent", default: null }
      - { name: silicon_pct, type: number, source: input, description: "Last recorded silicon percent", default: null }
      - { name: manganese_pct, type: number, source: input, description: "Last recorded manganese percent", default: null }
      - { name: sulfur_pct, type: number, source: input, description: "Last recorded sulfur percent", default: null }
      - { name: phosphorus_pct, type: number, source: input, description: "Last recorded phosphorus percent", default: null }
      - { name: bath_temp_f, type: number, source: input, description: "Last recorded bath temperature Fahrenheit", default: null }
      - { name: carbon_equivalent, type: number, source: computed, description: "carbon_pct + (silicon_pct + phosphorus_pct) / 3.0, 2 decimal places round_half_up", default: null }
      - { name: chemistry_recorded_by, type: string, source: system, description: "X-User-ID of the MeltOperator who recorded the current chemistry reading", default: null }
      - { name: certified_by, type: string, source: system, description: "X-User-ID of the QualityInspector who certified chemistry", default: null }
      - { name: tapped_temp_f, type: number, source: input, description: "Tap temperature Fahrenheit", default: null }
      - { name: tapped_lbs, type: number, source: input, description: "Iron tapped into the ladle in pounds", default: null }
      - { name: slag_loss_lbs, type: number, source: computed, description: "round_half_up(tapped_lbs * 0.03, 2 decimal places)", default: null }
      - { name: poured_lbs, type: number, source: system, description: "Total iron poured into molds from this batch", default: 0 }
      - { name: remaining_iron_lbs, type: number, source: computed, description: "tapped_lbs - slag_loss_lbs - poured_lbs", default: null }
      - { name: returns_credit_lbs, type: number, source: system, description: "Sum of pour weights of units from this batch later scrapped by defect disposition (iron returns credit)", default: 0 }
  - name: Mold
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id; order whose pattern this mold imprints" }
      - { name: new_sand_pct, type: number, source: input, description: "Percent new (virgin) sand in the mold mix", constraints: "new_sand_pct + reclaimed_sand_pct == 100.0 (+-0.01)" }
      - { name: reclaimed_sand_pct, type: number, source: input, description: "Percent reclaimed sand in the mold mix", constraints: "<= 85.0" }
      - { name: moisture_pct, type: number, source: input, description: "Moisture percent of the green sand", constraints: "3.0..4.5 inclusive" }
      - { name: clay_pct, type: number, source: input, description: "Clay (bentonite) percent of the sand mix", constraints: "8.0..12.0 inclusive" }
      - { name: sand_weight_lbs, type: number, source: input, description: "Total sand weight packed into this mold", constraints: "> 0" }
      - { name: state, type: enum, source: system, description: "Mold lifecycle", default: PREPARED, constraints: "PREPARED, POURED, SHAKEOUT_DONE, SAND_RECLAIMED, CANCELLED" }
      - { name: reclaimed_sand_lbs, type: number, source: system, description: "Sand recovered by reclamation; set by reclaim", default: null }
      - { name: dust_collected_lbs, type: number, source: system, description: "Dust collected by the baghouse during reclamation; set by reclaim", default: null }
      - { name: reclaim_loss_lbs, type: number, source: computed, description: "sand_weight_lbs - reclaimed_sand_lbs - dust_collected_lbs; must be in [0, 0.12 * sand_weight_lbs]", default: null }
  - name: CastingUnit
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: system, description: "FK -> ProductionOrder.id; copied from the poured melt batch" }
      - { name: melt_batch_id, type: string, source: system, description: "FK -> MeltBatch.id; the batch whose iron formed this unit" }
      - { name: mold_id, type: string, source: system, description: "FK -> Mold.id; the mold this unit was poured into" }
      - { name: seasoning_batch_id, type: string, source: system, description: "FK -> SeasoningBatch.id; set when queued for seasoning, cleared if the batch FAILs", default: null }
      - { name: pour_weight_oz, type: number, source: system, description: "Iron poured for this unit in ounces (from the pour call)" }
      - { name: measured_weight_oz, type: number, source: input, description: "Measured weight at inspection", default: null }
      - { name: measured_diameter_in, type: number, source: input, description: "Measured diameter at inspection", default: null }
      - { name: measured_wall_thickness_in, type: number, source: input, description: "Measured wall thickness at inspection", default: null }
      - { name: state, type: enum, source: system, description: "Unit lifecycle", default: POURED, constraints: "POURED, SHAKEOUT_DONE, DEFECT_REVIEW, REWORK, FINISHED, SEASONING_QUEUED, SEASONED, SCRAPPED" }
      - { name: rework_count, type: integer, source: system, description: "Number of completed REWORK dispositions (max 2)", default: 0 }
      - { name: scrap_reason, type: enum, source: system, description: "DEFECT when scrapped by defect disposition, ORDER_CANCEL when scrapped by order cancel/complete cascade; null while not scrapped", default: null, constraints: "DEFECT, ORDER_CANCEL" }
      - { name: scrapped_after_rework, type: boolean, source: system, description: "true when scrapped by defect disposition with rework_count >= 1 (drives the 1.5 weight in scrap_weighted_units)", default: false }
  - name: DefectReport
    parent: null
    common_fields: true
    fields:
      - { name: casting_unit_id, type: string, source: system, description: "FK -> CastingUnit.id; the defective unit" }
      - { name: defect_type, type: enum, source: input, description: "Observed casting defect", constraints: "POROSITY, COLD_SHUT, MISRUN, SAND_INCLUSION, DIMENSIONAL, CRACK" }
      - { name: severity, type: enum, source: input, description: "Severity drives allowed dispositions", constraints: "MINOR, MAJOR, CRITICAL" }
      - { name: status, type: enum, source: system, description: "OPEN until dispositioned", default: OPEN, constraints: "OPEN, DISPOSITIONED" }
      - { name: disposition, type: enum, source: system, description: "Quality disposition; null while OPEN", default: null, constraints: "REWORK, SCRAP, USE_AS_IS" }
      - { name: dispositioned_by, type: string, source: system, description: "X-User-ID of the QualityInspector who dispositioned", default: null }
      - { name: notes, type: string, source: input, description: "Free-text inspector notes", default: null }
  - name: SeasoningBatch
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id; all units in the batch must belong to this order" }
      - { name: oil_type, type: enum, source: input, description: "Seasoning oil; selects the cure profile", constraints: "SOYBEAN, CANOLA, FLAXSEED" }
      - { name: coating_count, type: integer, source: input, description: "Number of oil coats applied", constraints: "1..3" }
      - { name: unit_ids, type: array, source: input, description: "CastingUnit ids included in this batch (set at creation); every unit must be FINISHED and belong to production_order_id" }
      - { name: unit_count, type: integer, source: computed, description: "len(unit_ids); used for oven capacity accounting" }
      - { name: planned_bake_start, type: datetime, source: input, description: "Planned bake window start" }
      - { name: planned_bake_end, type: datetime, source: input, description: "Planned bake window end", constraints: "must be > planned_bake_start" }
      - { name: oven_id, type: enum, source: system, description: "Seasoning oven resource; single oven constant OVEN_1 with capacity 12 units", default: OVEN_1 }
      - { name: state, type: enum, source: system, description: "Seasoning workflow state", default: COATING, constraints: "COATING, BAKING, RELEASED, FAILED" }
      - { name: actual_bake_temp_f, type: number, source: input, description: "Recorded bake temperature; set by start-bake", default: null }
      - { name: oil_lot_number, type: string, source: input, description: "Food-safety oil lot traceability identifier; set by start-bake", default: null }
      - { name: coa_reference, type: string, source: input, description: "Certificate-of-analysis reference for the oil lot; set by start-bake", default: null }
      - { name: bake_recorded_by, type: string, source: system, description: "X-User-ID of the SeasoningLead who started the bake", default: null }
      - { name: bake_duration_min, type: integer, source: input, description: "Actual bake minutes; set by qa-release", default: null }
      - { name: cure_score, type: integer, source: computed, description: "round_half_up(60 * temp_factor + 40 * duration_factor); temp_factor = 1 - |actual_bake_temp_f - band_mid| / band_half_width when in band else 0; duration_factor = min(bake_duration_min / min_minutes, 1.5) / 1.5", default: null }
      - { name: food_safety_verified, type: boolean, source: input, description: "Inspector attestation that oil lot + COA documentation matches the batch", default: null }
      - { name: released_by, type: string, source: system, description: "X-User-ID of the QualityInspector who released or failed the batch", default: null }
  - name: EnvironmentalPermit
    parent: null
    common_fields: true
    fields:
      - { name: permit_type, type: enum, source: input, description: "Regulated aspect", constraints: "AIR_EMISSIONS, SAND_RECLAMATION, DUST_CONTROL" }
      - { name: limit_value, type: number, source: input, description: "Permitted limit: instantaneous reading limit for AIR_EMISSIONS/DUST_CONTROL; minimum acceptable monthly reclamation rate for SAND_RECLAMATION (e.g. 0.90)", constraints: "> 0" }
      - { name: measurement_unit, type: string, source: input, description: "Unit label for limit_value, e.g. mg_m3, lb_hr, rate" }
      - { name: compliance_period, type: enum, source: input, description: "Aggregation window for compliance accounting", constraints: "MONTHLY (calendar month of the logical clock)" }
      - { name: status, type: enum, source: system, description: "Permit compliance posture", default: ACTIVE, constraints: "ACTIVE, WARNING, BREACH, REMEDIATION" }
      - { name: over_limit_reading_count_current_period, type: integer, source: system, description: "Count of readings >= limit_value recorded in the current calendar month (AIR_EMISSIONS/DUST_CONTROL only)", default: 0 }
      - { name: current_sand_rate, type: number, source: computed, description: "SAND_RECLAMATION only: month-to-date sum(reclaimed_sand_lbs) / sum(sand_weight_lbs) over molds reclaimed this calendar month; null when no molds reclaimed", default: null }
      - { name: last_breach_reading_recorded_by, type: string, source: system, description: "X-User-ID whose reading (or reclamation entry) pushed the permit into BREACH; used for segregation of duties", default: null }
  - name: EmissionsReading
    parent: null
    common_fields: false
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> EnvironmentalPermit.id; permit this reading counts against" }
      - { name: reading_value, type: number, source: input, description: "Measured emission value in the permit's measurement_unit", constraints: "> 0" }
      - { name: source, type: enum, source: input, description: "Emission source on the plant site", constraints: "MELT_FURNACE, SHAKEOUT_LINE, SAND_PLANT, SEASONING_OVEN" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the EnvironmentalOfficer who recorded the reading" }
  - name: InventoryRecord
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; one record per product, auto-created with the product", constraints: "unique per product" }
      - { name: on_hand_units, type: integer, source: system, description: "Physical finished units at the plant warehouse", default: 0 }
      - { name: reserved_units, type: integer, source: system, description: "Sum of allocated_qty over RetailAllocations of this record with status PROPOSED or CONFIRMED", default: 0 }
      - { name: shipped_units, type: integer, source: system, description: "Lifetime units shipped to retail channels", default: 0 }
      - { name: outlet_sold_units, type: integer, source: system, description: "Lifetime units sold through factory outlet and museum store", default: 0 }
      - { name: available_units, type: integer, source: computed, description: "on_hand_units - reserved_units" }
  - name: RetailAllocation
    parent: null
    common_fields: true
    fields:
      - { name: inventory_record_id, type: string, source: input, description: "FK -> InventoryRecord.id; the product inventory this allocation reserves from" }
      - { name: channel, type: enum, source: input, description: "Sales channel receiving the allocation", constraints: "RETAIL_CHAIN, ECOMMERCE, FACTORY_OUTLET, MUSEUM_STORE" }
      - { name: allocated_qty, type: integer, source: input, description: "Units reserved for the channel", constraints: ">= 1 and <= available_units at creation" }
      - { name: ship_week, type: datetime, source: input, description: "ISO8601 date (YYYY-MM-DD) of the Monday of the intended ship week; must be strictly after the current logical date" }
      - { name: status, type: enum, source: system, description: "Allocation lifecycle", default: PROPOSED, constraints: "PROPOSED, CONFIRMED, SHIPPED, CANCELLED" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical timestamp of confirmation", default: null }
  - name: OutletSale
    parent: null
    common_fields: false
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; item sold at the plant site" }
      - { name: channel, type: enum, source: input, description: "On-site channel", constraints: "FACTORY_OUTLET or MUSEUM_STORE" }
      - { name: qty, type: integer, source: input, description: "Units sold", constraints: ">= 1 and <= available_units of the product's InventoryRecord" }
      - { name: unit_price_cents, type: integer, source: input, description: "Sale price per unit in cents", constraints: "FACTORY_OUTLET: >= round_half_up(msrp_cents * 0.55); MUSEUM_STORE: >= msrp_cents" }
      - { name: floor_price_cents, type: integer, source: computed, description: "The enforced price floor used for this sale (channel-dependent)" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of the OutletManager who recorded the sale" }

state_machines:
  - entity: ProductionOrder
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PLANNED
        to: MOLDING
        trigger: "POST /foundry/production-orders/{id}/release"
        actor: FoundryManager
        preconditions: ["order.state == PLANNED", "product.status == ACTIVE"]
        side_effects: ["increments ProductionOrder.version by 1"]
      - from: MOLDING
        to: POURING
        trigger: "system: first successful pour for this order"
        actor: system
        preconditions: []
        side_effects: ["increments ProductionOrder.version by 1"]
      - from: POURING
        to: FINISHING
        trigger: "system: first CastingUnit of this order reaches FINISHED"
        actor: system
        preconditions: []
        side_effects: ["increments ProductionOrder.version by 1"]
      - from: POURING
        to: SEASONING
        trigger: "system: first SeasoningBatch created for this order"
        actor: system
        preconditions: []
        side_effects: ["increments ProductionOrder.version by 1"]
      - from: FINISHING
        to: SEASONING
        trigger: "system: first SeasoningBatch created for this order"
        actor: system
        preconditions: []
        side_effects: ["increments ProductionOrder.version by 1"]
      - from: SEASONING
        to: COMPLETE
        trigger: "POST /foundry/production-orders/{id}/complete"
        actor: FoundryManager
        preconditions:
          - "order.state == SEASONING"
          - "order.posture != FROZEN (RESTRICTED is allowed)"
          - "good_units >= ceil(0.85 * planned_quantity)"
        side_effects:
          - "sets labor_hours_actual and energy_kwh_actual from input"
          - "computes unit_cost_final_cents and margin_flag (calculations.unit_cost, final variant)"
          - "cascade: every CastingUnit still in a non-terminal state -> SCRAPPED with scrap_reason ORDER_CANCEL (does NOT change scrap_weighted_units or scrap_index)"
          - "cascade: MeltBatches in CHARGING, MELTING, CHEMISTRY_CHECK, ADJUSTMENT, CERTIFIED or HELD -> CANCELLED"
          - "cascade: SeasoningBatches in COATING or BAKING -> FAILED (their SEASONING_QUEUED units are then scrapped by the unit cascade with scrap_reason ORDER_CANCEL)"
          - "cascade: Molds in PREPARED -> CANCELLED"
          - "increments ProductionOrder.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /foundry/production-orders/{id}/cancel"
        actor: FoundryManager
        preconditions: ["order.state in {PLANNED, MOLDING, POURING, FINISHING, SEASONING}"]
        side_effects:
          - "cascade: every CastingUnit still in a non-terminal state -> SCRAPPED with scrap_reason ORDER_CANCEL (does NOT change scrap_weighted_units or scrap_index)"
          - "cascade: MeltBatches in CHARGING, MELTING, CHEMISTRY_CHECK, ADJUSTMENT, CERTIFIED or HELD -> CANCELLED"
          - "cascade: SeasoningBatches in COATING or BAKING -> FAILED"
          - "cascade: Molds in PREPARED -> CANCELLED"
          - "increments ProductionOrder.version by 1"
      - from: MOLDING
        to: CANCELLED
        trigger: "POST /foundry/production-orders/{id}/cancel"
        actor: FoundryManager
        preconditions: ["order.state in {PLANNED, MOLDING, POURING, FINISHING, SEASONING}"]
        side_effects: ["same cascade set as PLANNED -> CANCELLED"]
      - from: POURING
        to: CANCELLED
        trigger: "POST /foundry/production-orders/{id}/cancel"
        actor: FoundryManager
        preconditions: ["order.state in {PLANNED, MOLDING, POURING, FINISHING, SEASONING}"]
        side_effects: ["same cascade set as PLANNED -> CANCELLED"]
      - from: FINISHING
        to: CANCELLED
        trigger: "POST /foundry/production-orders/{id}/cancel"
        actor: FoundryManager
        preconditions: ["order.state in {PLANNED, MOLDING, POURING, FINISHING, SEASONING}"]
        side_effects: ["same cascade set as PLANNED -> CANCELLED"]
      - from: SEASONING
        to: CANCELLED
        trigger: "POST /foundry/production-orders/{id}/cancel"
        actor: FoundryManager
        preconditions: ["order.state in {PLANNED, MOLDING, POURING, FINISHING, SEASONING}"]
        side_effects: ["same cascade set as PLANNED -> CANCELLED"]
  - entity: MeltBatch
    initial_state: CHARGING
    terminal_states: [EXHAUSTED, CANCELLED]
    transitions:
      - from: CHARGING
        to: MELTING
        trigger: "POST /foundry/melt-batches/{id}/charge (initial charge)"
        actor: MeltOperator
        preconditions: ["batch.state == CHARGING"]
        side_effects:
          - "sets the four component lbs from input and accumulates actual_charge_cost_cents (per-line round_half_up then sum)"
          - "increments MeltBatch.version by 1"
      - from: ADJUSTMENT
        to: MELTING
        trigger: "POST /foundry/melt-batches/{id}/charge (supplemental charge after an ordered chemistry adjustment)"
        actor: MeltOperator
        preconditions: ["batch.state == ADJUSTMENT"]
        side_effects:
          - "adds input lbs onto the accumulated component totals and adds this call's per-line-rounded charge cost onto actual_charge_cost_cents"
          - "increments MeltBatch.version by 1"
      - from: MELTING
        to: CHEMISTRY_CHECK
        trigger: "POST /foundry/melt-batches/{id}/chemistry-readings"
        actor: MeltOperator
        preconditions: ["batch.state == MELTING"]
        side_effects:
          - "records carbon_pct, silicon_pct, manganese_pct, sulfur_pct, phosphorus_pct, bath_temp_f"
          - "computes carbon_equivalent (calculations.carbon_equivalent)"
          - "sets chemistry_recorded_by = X-User-ID of the caller"
          - "increments MeltBatch.version by 1"
      - from: CHEMISTRY_CHECK
        to: CERTIFIED
        trigger: "POST /foundry/melt-batches/{id}/certify-chemistry with decision CERTIFY"
        actor: QualityInspector
        preconditions:
          - "batch.state == CHEMISTRY_CHECK"
          - "X-User-ID != batch.chemistry_recorded_by (segregation of duties)"
          - "carbon_equivalent in [3.90, 4.30] inclusive AND sulfur_pct <= 0.060 AND phosphorus_pct <= 0.080 AND bath_temp_f >= 2650"
        side_effects: ["sets certified_by = X-User-ID", "increments MeltBatch.version by 1"]
      - from: CHEMISTRY_CHECK
        to: ADJUSTMENT
        trigger: "POST /foundry/melt-batches/{id}/certify-chemistry with decision ORDER_ADJUSTMENT"
        actor: QualityInspector
        preconditions:
          - "batch.state == CHEMISTRY_CHECK"
          - "X-User-ID != batch.chemistry_recorded_by (segregation of duties)"
        side_effects: ["increments adjustment_count by 1", "increments MeltBatch.version by 1"]
        note: "The adjustment cycle: ADJUSTMENT only accepts a supplemental /charge, which moves the batch back to MELTING, from which new chemistry-readings re-enter CHEMISTRY_CHECK. There is no cap on adjustment cycles."
      - from: CERTIFIED
        to: TAPPED
        trigger: "POST /foundry/melt-batches/{id}/tap"
        actor: MeltOperator
        preconditions:
          - "batch.state == CERTIFIED"
          - "the AIR_EMISSIONS EnvironmentalPermit (if one exists) is not in BREACH"
        side_effects:
          - "records tapped_temp_f, tapped_lbs; computes slag_loss_lbs and remaining_iron_lbs"
          - "increments MeltBatch.version by 1"
      - from: TAPPED
        to: EXHAUSTED
        trigger: "system: a pour leaves remaining_iron_lbs == 0"
        actor: system
        preconditions: []
        side_effects: ["increments MeltBatch.version by 1"]
      - from: CHARGING
        to: HELD
        trigger: "system: the AIR_EMISSIONS permit enters BREACH"
        actor: system
        preconditions: []
        side_effects: ["sets state_before_hold = CHARGING", "recompute posture of linked ProductionOrder (posture becomes FROZEN)", "increments MeltBatch.version by 1"]
      - from: MELTING
        to: HELD
        trigger: "system: the AIR_EMISSIONS permit enters BREACH"
        actor: system
        preconditions: []
        side_effects: ["sets state_before_hold = MELTING", "recompute posture of linked ProductionOrder", "increments MeltBatch.version by 1"]
      - from: CHEMISTRY_CHECK
        to: HELD
        trigger: "system: the AIR_EMISSIONS permit enters BREACH"
        actor: system
        preconditions: []
        side_effects: ["sets state_before_hold = CHEMISTRY_CHECK", "recompute posture of linked ProductionOrder", "increments MeltBatch.version by 1"]
      - from: ADJUSTMENT
        to: HELD
        trigger: "system: the AIR_EMISSIONS permit enters BREACH"
        actor: system
        preconditions: []
        side_effects: ["sets state_before_hold = ADJUSTMENT", "recompute posture of linked ProductionOrder", "increments MeltBatch.version by 1"]
      - from: CERTIFIED
        to: HELD
        trigger: "system: the AIR_EMISSIONS permit enters BREACH"
        actor: system
        preconditions: []
        side_effects: ["sets state_before_hold = CERTIFIED", "recompute posture of linked ProductionOrder", "increments MeltBatch.version by 1"]
      - from: HELD
        to: CHARGING
        trigger: "system: the AIR_EMISSIONS permit returns to ACTIVE via certify-remediation; batch resumes its state_before_hold"
        actor: system
        preconditions: ["state_before_hold == CHARGING"]
        side_effects: ["clears state_before_hold", "recompute posture of linked ProductionOrder", "increments MeltBatch.version by 1"]
      - from: HELD
        to: MELTING
        trigger: "system: permit returns to ACTIVE; resume"
        actor: system
        preconditions: ["state_before_hold == MELTING"]
        side_effects: ["clears state_before_hold", "recompute posture of linked ProductionOrder", "increments MeltBatch.version by 1"]
      - from: HELD
        to: CHEMISTRY_CHECK
        trigger: "system: permit returns to ACTIVE; resume"
        actor: system
        preconditions: ["state_before_hold == CHEMISTRY_CHECK"]
        side_effects: ["clears state_before_hold", "recompute posture of linked ProductionOrder", "increments MeltBatch.version by 1"]
      - from: HELD
        to: ADJUSTMENT
        trigger: "system: permit returns to ACTIVE; resume"
        actor: system
        preconditions: ["state_before_hold == ADJUSTMENT"]
        side_effects: ["clears state_before_hold", "recompute posture of linked ProductionOrder", "increments MeltBatch.version by 1"]
      - from: HELD
        to: CERTIFIED
        trigger: "system: permit returns to ACTIVE; resume"
        actor: system
        preconditions: ["state_before_hold == CERTIFIED"]
        side_effects: ["clears state_before_hold", "recompute posture of linked ProductionOrder", "increments MeltBatch.version by 1"]
      - from: CHARGING
        to: CANCELLED
        trigger: "system: linked ProductionOrder is cancelled or completed"
        actor: system
        preconditions: []
        side_effects: ["increments MeltBatch.version by 1"]
      - from: MELTING
        to: CANCELLED
        trigger: "system: linked ProductionOrder is cancelled or completed"
        actor: system
        preconditions: []
        side_effects: ["increments MeltBatch.version by 1"]
      - from: CHEMISTRY_CHECK
        to: CANCELLED
        trigger: "system: linked ProductionOrder is cancelled or completed"
        actor: system
        preconditions: []
        side_effects: ["increments MeltBatch.version by 1"]
      - from: ADJUSTMENT
        to: CANCELLED
        trigger: "system: linked ProductionOrder is cancelled or completed"
        actor: system
        preconditions: []
        side_effects: ["increments MeltBatch.version by 1"]
      - from: CERTIFIED
        to: CANCELLED
        trigger: "system: linked ProductionOrder is cancelled or completed"
        actor: system
        preconditions: []
        side_effects: ["increments MeltBatch.version by 1"]
      - from: HELD
        to: CANCELLED
        trigger: "system: linked ProductionOrder is cancelled or completed"
        actor: system
        preconditions: []
        side_effects: ["increments MeltBatch.version by 1"]
  - entity: Mold
    initial_state: PREPARED
    terminal_states: [SAND_RECLAIMED, CANCELLED]
    transitions:
      - from: PREPARED
        to: POURED
        trigger: "system: POST /foundry/melt-batches/{id}/pour targets this mold"
        actor: system
        preconditions: []
        side_effects: ["increments Mold.version by 1"]
      - from: POURED
        to: SHAKEOUT_DONE
        trigger: "POST /foundry/molds/{id}/shakeout"
        actor: MeltOperator
        preconditions: ["mold.state == POURED"]
        side_effects:
          - "every CastingUnit with mold_id == this mold in state POURED -> SHAKEOUT_DONE (increments each unit's version)"
          - "increments Mold.version by 1"
      - from: SHAKEOUT_DONE
        to: SAND_RECLAIMED
        trigger: "POST /foundry/molds/{id}/reclaim"
        actor: EnvironmentalOfficer
        preconditions:
          - "mold.state == SHAKEOUT_DONE"
          - "reclaimed_sand_lbs + dust_collected_lbs <= sand_weight_lbs"
          - "reclaim_loss_lbs = sand_weight_lbs - reclaimed_sand_lbs - dust_collected_lbs <= 0.12 * sand_weight_lbs"
        side_effects:
          - "sets reclaimed_sand_lbs, dust_collected_lbs, reclaim_loss_lbs"
          - "recomputes current_sand_rate on the SAND_RECLAMATION permit (calculations.sand_reclamation_rate); rate < limit_value -> permit WARNING; rate < limit_value - 0.05 -> permit BREACH (sets last_breach_reading_recorded_by to the reclaiming officer)"
          - "increments Mold.version by 1"
      - from: PREPARED
        to: CANCELLED
        trigger: "system: linked ProductionOrder is cancelled or completed"
        actor: system
        preconditions: []
        side_effects: ["increments Mold.version by 1"]
  - entity: CastingUnit
    initial_state: POURED
    terminal_states: [SEASONED, SCRAPPED]
    transitions:
      - from: POURED
        to: SHAKEOUT_DONE
        trigger: "system: mold shakeout"
        actor: system
        preconditions: []
        side_effects: ["increments CastingUnit.version by 1"]
      - from: SHAKEOUT_DONE
        to: FINISHED
        trigger: "POST /foundry/casting-units/{id}/inspect with outcome PASS"
        actor: QualityInspector
        preconditions:
          - "unit.state == SHAKEOUT_DONE"
          - "|measured_weight_oz - product.target_weight_oz| <= product.weight_tolerance_oz"
          - "|measured_diameter_in - product.target_diameter_in| <= product.diameter_tolerance_in"
          - "measured_wall_thickness_in >= product.min_wall_thickness_in"
        side_effects:
          - "stores the three measured_* fields"
          - "if this is the order's first FINISHED unit, order POURING -> FINISHING"
          - "increments CastingUnit.version by 1"
      - from: SHAKEOUT_DONE
        to: DEFECT_REVIEW
        trigger: "POST /foundry/casting-units/{id}/inspect with outcome DEFECT"
        actor: QualityInspector
        preconditions: ["unit.state == SHAKEOUT_DONE", "defect_type and severity are present"]
        side_effects:
          - "creates a DefectReport (status OPEN) for this unit with the given defect_type and severity"
          - "stores the three measured_* fields"
          - "increments CastingUnit.version by 1"
      - from: DEFECT_REVIEW
        to: REWORK
        trigger: "POST /foundry/defect-reports/{id}/disposition with disposition REWORK on this unit's OPEN report"
        actor: QualityInspector
        preconditions:
          - "report.status == OPEN and report.casting_unit_id == unit.id"
          - "report.severity != CRITICAL (critical defects must be scrapped)"
          - "unit.rework_count < 2"
        side_effects:
          - "report -> DISPOSITIONED with disposition REWORK, dispositioned_by set"
          - "unit.rework_count += 1"
          - "increments CastingUnit.version by 1"
      - from: REWORK
        to: SHAKEOUT_DONE
        trigger: "POST /foundry/casting-units/{id}/complete-rework"
        actor: MeltOperator
        preconditions: ["unit.state == REWORK"]
        side_effects: ["increments CastingUnit.version by 1"]
        note: "The rework loop: REWORK returns to SHAKEOUT_DONE for a fresh inspection. A unit may carry at most 2 REWORK dispositions; the third REWORK disposition attempt is rejected with ERR_REWORK_LIMIT_EXCEEDED."
      - from: DEFECT_REVIEW
        to: FINISHED
        trigger: "POST /foundry/defect-reports/{id}/disposition with disposition USE_AS_IS"
        actor: QualityInspector
        preconditions: ["report.status == OPEN and report.casting_unit_id == unit.id", "report.severity == MINOR"]
        side_effects:
          - "report -> DISPOSITIONED with disposition USE_AS_IS"
          - "if this is the order's first FINISHED unit, order POURING -> FINISHING"
          - "increments CastingUnit.version by 1"
      - from: DEFECT_REVIEW
        to: SCRAPPED
        trigger: "POST /foundry/defect-reports/{id}/disposition with disposition SCRAP"
        actor: QualityInspector
        preconditions: ["report.status == OPEN and report.casting_unit_id == unit.id"]
        side_effects:
          - "report -> DISPOSITIONED with disposition SCRAP"
          - "unit.scrap_reason = DEFECT; unit.scrapped_after_rework = (rework_count >= 1)"
          - "order.scrapped_units += 1; order.defect_scrapped_units += 1"
          - "order.scrap_weighted_units += 1.5 if scrapped_after_rework else 1.0; recompute order.scrap_index and scrap_tier; if scrap_index >= 0.08 and order.posture == OPEN then posture -> RESTRICTED"
          - "linked MeltBatch.returns_credit_lbs += unit.pour_weight_oz / 16.0 (2 decimal places, round_half_up)"
          - "increments CastingUnit.version by 1 and ProductionOrder.version by 1"
      - from: FINISHED
        to: SEASONING_QUEUED
        trigger: "system: a SeasoningBatch creation includes this unit"
        actor: system
        preconditions: []
        side_effects: ["sets seasoning_batch_id", "increments CastingUnit.version by 1"]
      - from: SEASONING_QUEUED
        to: SEASONED
        trigger: "system: the SeasoningBatch is released by qa-release"
        actor: system
        preconditions: []
        side_effects:
          - "order.good_units += 1"
          - "InventoryRecord.on_hand_units += 1 for the order's product (increments InventoryRecord.version)"
          - "increments CastingUnit.version by 1"
      - from: SEASONING_QUEUED
        to: FINISHED
        trigger: "system: the SeasoningBatch FAILs qa-release"
        actor: system
        preconditions: []
        side_effects: ["clears seasoning_batch_id", "increments CastingUnit.version by 1"]
      - from: POURED
        to: SCRAPPED
        trigger: "system: order cancel or order complete cascade"
        actor: system
        preconditions: []
        side_effects: ["scrap_reason = ORDER_CANCEL; order.scrapped_units += 1 (scrap_weighted_units unchanged)", "increments CastingUnit.version by 1"]
      - from: SHAKEOUT_DONE
        to: SCRAPPED
        trigger: "system: order cancel or order complete cascade"
        actor: system
        preconditions: []
        side_effects: ["scrap_reason = ORDER_CANCEL; order.scrapped_units += 1", "increments CastingUnit.version by 1"]
      - from: DEFECT_REVIEW
        to: SCRAPPED
        trigger: "system: order cancel or order complete cascade"
        actor: system
        preconditions: []
        side_effects: ["scrap_reason = ORDER_CANCEL; order.scrapped_units += 1; the unit's OPEN DefectReport -> DISPOSITIONED with disposition SCRAP and dispositioned_by 'system'", "increments CastingUnit.version by 1"]
      - from: REWORK
        to: SCRAPPED
        trigger: "system: order cancel or order complete cascade"
        actor: system
        preconditions: []
        side_effects: ["scrap_reason = ORDER_CANCEL; order.scrapped_units += 1", "increments CastingUnit.version by 1"]
      - from: FINISHED
        to: SCRAPPED
        trigger: "system: order cancel or order complete cascade"
        actor: system
        preconditions: []
        side_effects: ["scrap_reason = ORDER_CANCEL; order.scrapped_units += 1", "increments CastingUnit.version by 1"]
      - from: SEASONING_QUEUED
        to: SCRAPPED
        trigger: "system: order cancel or order complete cascade (runs after the SeasoningBatch -> FAILED cascade)"
        actor: system
        preconditions: []
        side_effects: ["scrap_reason = ORDER_CANCEL; order.scrapped_units += 1; clears seasoning_batch_id", "increments CastingUnit.version by 1"]
  - entity: DefectReport
    initial_state: OPEN
    terminal_states: [DISPOSITIONED]
    transitions:
      - from: OPEN
        to: DISPOSITIONED
        trigger: "POST /foundry/defect-reports/{id}/disposition (or system cascade on order cancel/complete)"
        actor: QualityInspector
        preconditions: ["report.status == OPEN", "disposition rules per CastingUnit transitions above"]
        side_effects: ["drives the linked CastingUnit transition (REWORK / SCRAP / USE_AS_IS)", "increments DefectReport.version by 1"]
  - entity: SeasoningBatch
    initial_state: COATING
    terminal_states: [RELEASED, FAILED]
    transitions:
      - from: COATING
        to: BAKING
        trigger: "POST /foundry/seasoning-batches/{id}/start-bake"
        actor: SeasoningLead
        preconditions: ["batch.state == COATING", "oil_lot_number and coa_reference are present"]
        side_effects: ["records actual_bake_temp_f, oil_lot_number, coa_reference", "sets bake_recorded_by = X-User-ID", "increments SeasoningBatch.version by 1"]
      - from: BAKING
        to: RELEASED
        trigger: "POST /foundry/seasoning-batches/{id}/qa-release with decision RELEASE"
        actor: QualityInspector
        preconditions:
          - "batch.state == BAKING"
          - "X-User-ID != batch.bake_recorded_by (segregation of duties)"
          - "food_safety_verified == true"
          - "cure_score >= 70 (calculations.cure_score)"
        side_effects:
          - "computes cure_score from bake_duration_min and actual_bake_temp_f"
          - "every unit in the batch: SEASONING_QUEUED -> SEASONED; order.good_units += unit_count; InventoryRecord.on_hand_units += unit_count"
          - "sets released_by = X-User-ID"
          - "increments SeasoningBatch.version by 1"
      - from: BAKING
        to: FAILED
        trigger: "POST /foundry/seasoning-batches/{id}/qa-release with decision FAIL"
        actor: QualityInspector
        preconditions: ["batch.state == BAKING", "X-User-ID != batch.bake_recorded_by (segregation of duties)"]
        side_effects:
          - "computes cure_score"
          - "every unit in the batch: SEASONING_QUEUED -> FINISHED (seasoning_batch_id cleared); no inventory change"
          - "sets released_by = X-User-ID"
          - "increments SeasoningBatch.version by 1"
      - from: COATING
        to: FAILED
        trigger: "system: linked ProductionOrder is cancelled or completed"
        actor: system
        preconditions: []
        side_effects: ["units remain SEASONING_QUEUED until the unit cascade scraps them (scrap_reason ORDER_CANCEL)", "increments SeasoningBatch.version by 1"]
      - from: BAKING
        to: FAILED
        trigger: "system: linked ProductionOrder is cancelled or completed"
        actor: system
        preconditions: []
        side_effects: ["units remain SEASONING_QUEUED until the unit cascade scraps them", "increments SeasoningBatch.version by 1"]
  - entity: EnvironmentalPermit
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: WARNING
        trigger: "system: an EmissionsReading with reading_value >= limit_value raises over_limit_reading_count_current_period to 1 (AIR_EMISSIONS/DUST_CONTROL); or a reclamation entry leaves current_sand_rate < limit_value but >= limit_value - 0.05 (SAND_RECLAMATION)"
        actor: system
        preconditions: []
        side_effects: ["increments EnvironmentalPermit.version by 1"]
      - from: WARNING
        to: BREACH
        trigger: "system: a second reading >= limit_value lands in the same calendar month (count >= 2); or current_sand_rate falls below limit_value - 0.05"
        actor: system
        preconditions: []
        side_effects:
          - "sets last_breach_reading_recorded_by to the recording officer's X-User-ID"
          - "cascade: every MeltBatch in CHARGING, MELTING, CHEMISTRY_CHECK, ADJUSTMENT or CERTIFIED -> HELD with state_before_hold preserved"
          - "cascade: every ProductionOrder linked to a HELD batch recomputes posture -> FROZEN"
          - "increments EnvironmentalPermit.version by 1"
      - from: ACTIVE
        to: BREACH
        trigger: "system: a single reading >= 1.5 * limit_value (immediate breach), or a reclamation entry leaves current_sand_rate < limit_value - 0.05 directly"
        actor: system
        preconditions: []
        side_effects: ["same cascade set as WARNING -> BREACH"]
      - from: BREACH
        to: REMEDIATION
        trigger: "POST /foundry/environmental-permits/{id}/acknowledge-breach"
        actor: FoundryManager
        preconditions: ["permit.status == BREACH", "X-User-ID != permit.last_breach_reading_recorded_by (segregation of duties)"]
        side_effects: ["increments EnvironmentalPermit.version by 1"]
      - from: REMEDIATION
        to: ACTIVE
        trigger: "POST /foundry/environmental-permits/{id}/certify-remediation"
        actor: EnvironmentalOfficer
        preconditions: ["permit.status == REMEDIATION", "X-User-ID != permit.last_breach_reading_recorded_by (segregation of duties)"]
        side_effects:
          - "resets over_limit_reading_count_current_period to 0"
          - "cascade: every HELD MeltBatch resumes to its state_before_hold (state_before_hold cleared)"
          - "cascade: every ProductionOrder linked to a resumed batch recomputes posture (FROZEN lifts when no HELD batch remains)"
          - "increments EnvironmentalPermit.version by 1"
      - from: WARNING
        to: ACTIVE
        trigger: "system: POST /foundry/_clock/set_current_utc crosses a calendar-month boundary"
        actor: system
        preconditions: []
        side_effects: ["resets over_limit_reading_count_current_period to 0", "increments EnvironmentalPermit.version by 1"]
        note: "BREACH and REMEDIATION do not auto-clear at month rollover; they require the acknowledge -> remediate path."
  - entity: RetailAllocation
    initial_state: PROPOSED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /foundry/retail-allocations/{id}/confirm"
        actor: RetailPlanner
        preconditions:
          - "allocation.status == PROPOSED"
          - "product.status == ACTIVE"
          - "ship_week is strictly after the current logical date"
        side_effects: ["sets confirmed_at to the logical clock", "increments RetailAllocation.version by 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /foundry/retail-allocations/{id}/cancel"
        actor: RetailPlanner
        preconditions: ["allocation.status == PROPOSED"]
        side_effects: ["InventoryRecord.reserved_units -= allocated_qty (increments InventoryRecord.version)", "increments RetailAllocation.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /foundry/retail-allocations/{id}/cancel"
        actor: RetailPlanner
        preconditions:
          - "allocation.status == CONFIRMED"
          - "if the ISO week of ship_week lies in [product.peak_season_start_week, product.peak_season_end_week], the current logical date must be strictly before (ship_week - 42 days); outside the peak window no freeze applies"
        side_effects: ["InventoryRecord.reserved_units -= allocated_qty (increments InventoryRecord.version)", "increments RetailAllocation.version by 1"]
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /foundry/retail-allocations/{id}/ship"
        actor: RetailPlanner
        preconditions: ["allocation.status == CONFIRMED"]
        side_effects:
          - "InventoryRecord.on_hand_units -= allocated_qty; reserved_units -= allocated_qty; shipped_units += allocated_qty (increments InventoryRecord.version)"
          - "increments RetailAllocation.version by 1"

concurrency_rules:
  - rule_id: melt-create-stale-order
    parent_entity: ProductionOrder
    write_endpoint: "POST /foundry/melt-batches"
    occ_field: expected_production_order_version
    description: |
      Creating a MeltBatch against a ProductionOrder whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created a melt batch (or otherwise mutated
      the order) and the current writer's view of the order is therefore stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: allocation-create-stale-inventory
    parent_entity: InventoryRecord
    write_endpoint: "POST /foundry/retail-allocations"
    occ_field: expected_inventory_version
    description: |
      Creating a RetailAllocation against an InventoryRecord whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another planner has just reserved or released units and the
      current writer's view of availability is therefore stale.
    error_id: ERR_STALE_INVENTORY_VERSION
    http_status: 412

calculations:
  - name: carbon_equivalent
    trigger: "POST /foundry/melt-batches/{id}/chemistry-readings"
    algorithm: threshold
    formula: |
      carbon_equivalent = carbon_pct + (silicon_pct + phosphorus_pct) / 3.0
      Round the result to 2 decimal places, round_half_up.
      Certification gate (evaluated at certify-chemistry, decision CERTIFY):
        accept iff carbon_equivalent >= CE_MIN and carbon_equivalent <= CE_MAX
                 and sulfur_pct <= SULFUR_MAX
                 and phosphorus_pct <= PHOSPHORUS_MAX
                 and bath_temp_f >= BATH_TEMP_MIN_F
      Both band bounds are INCLUSIVE: carbon_equivalent == 4.30 passes, 4.31 fails.
    input_set: "The single MeltBatch's most recent chemistry readings"
    constants:
      CE_MIN: 3.90
      CE_MAX: 4.30
      SULFUR_MAX: 0.060
      PHOSPHORUS_MAX: 0.080
      BATH_TEMP_MIN_F: 2650
    precision: "2 decimal places, round_half_up"
  - name: melt_charge_cost
    trigger: "MeltBatch creation (planned variant) and each POST /foundry/melt-batches/{id}/charge call (actual variant)"
    algorithm: aggregation
    formula: |
      Component prices (cents per lb): PIG_IRON 38, SCRAP_STEEL 12, RETURNS 6, ALLOY 145.
      planned variant (at creation):
        planned_charge_cost_cents = round_half_up(
            planned_iron_lbs * ( planned_pig_iron_pct    * 38
                               + planned_scrap_steel_pct * 12
                               + planned_returns_pct     * 6
                               + planned_alloy_pct       * 145 ) / 100 )
        i.e. ONE rounding of the whole weighted mix.
      actual variant (per charge call, accumulates):
        For THIS call's four component amounts:
          line_pig    = round_half_up(pig_iron_lbs    * 38)
          line_scrap  = round_half_up(scrap_steel_lbs * 12)
          line_return = round_half_up(returns_lbs     * 6)
          line_alloy  = round_half_up(alloy_lbs       * 145)
        actual_charge_cost_cents += line_pig + line_scrap + line_return + line_alloy
        PINNED ROUNDING ORDER: round each component line to integer cents FIRST,
        then sum the integer lines. Summing raw products and rounding once at the
        end is a different (forbidden) order and produces different cents.
    input_set: "The single MeltBatch's planned mix (planned variant) or the charge call's component amounts (actual variant)"
    constants:
      PIG_IRON_CENTS_PER_LB: 38
      SCRAP_STEEL_CENTS_PER_LB: 12
      RETURNS_CENTS_PER_LB: 6
      ALLOY_CENTS_PER_LB: 145
    precision: "integer cents, round_half_up per component line (actual) or per whole mix (planned)"
    variants:
      - name: planned
        when: "at MeltBatch creation, before any /charge call"
        difference: "single rounding over planned_iron_lbs and the planned mix percentages"
      - name: actual
        when: "on each /charge call"
        difference: "per-component-line rounding of weighed amounts, summed onto the accumulator; differs from planned whenever weighed amounts deviate from the planned mix"
  - name: unit_cost
    trigger: "unit_cost_provisional_cents recomputed on every read of a ProductionOrder; unit_cost_final_cents computed once by POST /foundry/production-orders/{id}/complete"
    algorithm: aggregation
    formula: |
      provisional variant (any state, recomputed on read):
        material_to_date_cents = sum(actual_charge_cost_cents) over MeltBatches of this
          order whose state != CANCELLED
        unit_cost_provisional_cents = round_half_up(material_to_date_cents / planned_quantity)
                                      + STD_CONVERSION_CENTS_PER_UNIT
      final variant (at completion):
        material = sum(actual_charge_cost_cents) over MeltBatches of this order whose
          state != CANCELLED
        labor    = round_half_up(labor_hours_actual * LABOR_RATE_CENTS_PER_HOUR)
        energy   = round_half_up(energy_kwh_actual * ENERGY_RATE_CENTS_PER_KWH)
        overhead = OVERHEAD_CENTS_PER_POURED_UNIT * poured_units
        unit_cost_final_cents = round_half_up((material + labor + energy + overhead) / good_units)
      margin_flag = (wholesale_price_cents - unit_cost_final_cents) / wholesale_price_cents < MARGIN_MIN_PCT
    input_set: "All MeltBatches of the ProductionOrder with state != CANCELLED, plus labor/energy actuals recorded at completion"
    constants:
      STD_CONVERSION_CENTS_PER_UNIT: 1450
      LABOR_RATE_CENTS_PER_HOUR: 3200
      ENERGY_RATE_CENTS_PER_KWH: 14
      OVERHEAD_CENTS_PER_POURED_UNIT: 185
      MARGIN_MIN_PCT: 0.30
    precision: "integer cents, round_half_up at each stated rounding point"
    variants:
      - name: provisional
        when: "recomputed on every ProductionOrder read before and after completion"
        difference: "amortizes actual material over PLANNED quantity and uses the flat standard conversion rate; no labor/energy actuals"
      - name: final
        when: "once, at order completion"
        difference: "divides full actuals (material + actual labor + actual energy + per-poured-unit overhead) by GOOD units; differs from provisional in numerator scope, denominator, and conversion basis"
  - name: scrap_index
    trigger: "recomputed on every defect-disposition SCRAP and on every pour for the order"
    algorithm: threshold
    formula: |
      For each defect-scrapped unit (scrap_reason == DEFECT):
        weight = 1.5 if unit.scrapped_after_rework (rework_count >= 1 at scrap time) else 1.0
      scrap_weighted_units = sum(weights)   (accumulated on the order)
      scrap_index = round_half_up(scrap_weighted_units / poured_units, 4)
                  (0 when poured_units == 0)
      scrap_tier:   scrap_index <  SCRAP_WATCH_THRESHOLD    -> GREEN
                    SCRAP_WATCH_THRESHOLD <= scrap_index < SCRAP_RESTRICT_THRESHOLD -> WATCH
                    scrap_index >= SCRAP_RESTRICT_THRESHOLD -> RED
      posture (recomputed on the same triggers and on melt HELD/resume events):
        FROZEN     if any linked MeltBatch is in state HELD
        else RESTRICTED if scrap_tier == RED
        else OPEN
      Boundary semantics: the WATCH lower bound and the RED lower bound are both
      INCLUSIVE (>=). scrap_index == 0.0400 is WATCH (not GREEN); scrap_index == 0.0800
      is RED and drives posture to RESTRICTED.
    input_set: "CastingUnits of the order with scrap_reason == DEFECT (numerator weights); all CastingUnits ever poured for the order (denominator count)"
    constants:
      REWORK_SCRAP_WEIGHT: 1.5
      SCRAP_WATCH_THRESHOLD: 0.04
      SCRAP_RESTRICT_THRESHOLD: 0.08
      MAX_REWORK_COUNT: 2
    precision: "scrap_index 4 decimal places round_half_up; weights exact"
  - name: channel_allocation_split
    trigger: "GET /foundry/inventory-records/{id}/allocation-plan"
    algorithm: waterfall_allocation
    formula: |
      Given build_qty N (>= 1), suggest the seasonal build split across channels.
      PINNED ORDER — percentage channels are computed in exactly this sequence,
      each clamped by what remains:
        remaining = N
        museum_store_units   = min(round_half_up(N * 0.02), remaining); remaining -= museum_store_units
        factory_outlet_units = min(round_half_up(N * 0.08), remaining); remaining -= factory_outlet_units
        ecommerce_units      = min(round_half_up(N * 0.15), remaining); remaining -= ecommerce_units
        retail_chain_units   = remaining
      The nested-rounding order is pinned: round each channel line to integer
      units (round_half_up) in the fixed order above, clamp to the remaining
      pool, and let RETAIL_CHAIN absorb whatever is left. Computing a single
      rounding over the total, or reordering the channels, is forbidden.
    input_set: "The integer build_qty query parameter; channel percentages are constants"
    constants:
      MUSEUM_STORE_PCT: 0.02
      FACTORY_OUTLET_PCT: 0.08
      ECOMMERCE_PCT: 0.15
    precision: "integer units, round_half_up per channel line in the pinned order"
  - name: cure_score
    trigger: "POST /foundry/seasoning-batches/{id}/qa-release"
    algorithm: weighted_scoring
    formula: |
      Cure profile per oil_type: (MIN_TEMP_F, MAX_TEMP_F, MIN_MINUTES)
        SOYBEAN:  (450, 500, 60)
        CANOLA:   (425, 475, 75)
        FLAXSEED: (400, 450, 90)
      band_mid        = (MIN_TEMP_F + MAX_TEMP_F) / 2
      band_half_width = (MAX_TEMP_F - MIN_TEMP_F) / 2
      temp_factor     = 1 - |actual_bake_temp_f - band_mid| / band_half_width
                        when MIN_TEMP_F <= actual_bake_temp_f <= MAX_TEMP_F, else 0
      duration_factor = min(bake_duration_min / MIN_MINUTES, 1.5) / 1.5
      cure_score      = round_half_up(60 * temp_factor + 40 * duration_factor)
      RELEASE requires cure_score >= 70.
    input_set: "The SeasoningBatch's oil_type, actual_bake_temp_f and bake_duration_min"
    constants:
      CURE_RELEASE_THRESHOLD: 70
      SOYBEAN_MIN_TEMP_F: 450
      SOYBEAN_MAX_TEMP_F: 500
      SOYBEAN_MIN_MINUTES: 60
      CANOLA_MIN_TEMP_F: 425
      CANOLA_MAX_TEMP_F: 475
      CANOLA_MIN_MINUTES: 75
      FLAXSEED_MIN_TEMP_F: 400
      FLAXSEED_MAX_TEMP_F: 450
      FLAXSEED_MIN_MINUTES: 90
    precision: "integer score 0..100, round_half_up"
  - name: emissions_period_rollup
    trigger: "POST /foundry/environmental-permits/{id}/readings and POST /foundry/_clock/set_current_utc (month rollover)"
    algorithm: aggregation
    formula: |
      For an AIR_EMISSIONS or DUST_CONTROL permit:
        A reading R (timestamped by the logical clock) counts in the calendar
        month of its timestamp.
        If R >= BREACH_MULTIPLIER * limit_value: permit -> BREACH immediately.
        Else if R >= limit_value:
          over_limit_reading_count_current_period += 1
          count == 1            -> permit -> WARNING
          count >= 2 (same month) -> permit -> BREACH
        Readings < limit_value leave status unchanged (count unchanged).
      On a clock-set that crosses a calendar-month boundary:
        over_limit_reading_count_current_period resets to 0;
        a permit in WARNING returns to ACTIVE.
        BREACH / REMEDIATION are NOT affected by rollover.
    input_set: "EmissionsReadings of the permit in the current calendar month (all sources); the logical clock for period boundaries"
    constants:
      BREACH_MULTIPLIER: 1.5
    precision: "exact comparison on reading_value (2 decimal places when recorded)"
    variants:
      - name: to_date_actual
        when: "default accounting of the current period"
        difference: "counts only readings actually recorded so far in the calendar month"
      - name: immediate_breach
        when: "a single reading reaches 1.5x the limit"
        difference: "bypasses the counting path entirely: one extreme reading breaches directly from ACTIVE or WARNING, where the counting path would have produced only WARNING"
  - name: sand_reclamation_rate
    trigger: "POST /foundry/molds/{id}/reclaim"
    algorithm: aggregation
    formula: |
      For the SAND_RECLAMATION permit, over molds reclaimed in the current
      calendar month (by logical-clock timestamp of the reclaim call):
        current_sand_rate = round_half_up(
            sum(reclaimed_sand_lbs) / sum(sand_weight_lbs), 4)
      rate <  limit_value           -> permit WARNING (if ACTIVE)
      rate <  limit_value - 0.05    -> permit BREACH (from any non-terminal status)
      rate >= limit_value           -> no status change
      Rollover: a clock-set crossing a calendar-month boundary resets the
      month-to-date sums (current_sand_rate becomes null until the next reclaim).
      WARNING auto-clears to ACTIVE at rollover; BREACH does not.
    input_set: "Molds whose reclaim occurred in the current calendar month"
    constants:
      SAND_RATE_BREACH_MARGIN: 0.05
      SAND_LOSS_MAX_PCT: 0.12
    precision: "rate 4 decimal places, round_half_up"
  - name: inventory_availability
    trigger: "recomputed on every mutation of InventoryRecord or its RetailAllocations"
    algorithm: aggregation
    formula: |
      reserved_units  = sum(allocated_qty) over RetailAllocations of this record
                        with status in {PROPOSED, CONFIRMED}
      available_units = on_hand_units - reserved_units
      Conservation invariant (compensating-action target):
        on_hand_units is changed ONLY by seasoning release (+unit_count),
        allocation ship (-allocated_qty) and outlet sale (-qty);
        reserved_units is changed ONLY by allocation create (+allocated_qty),
        allocation cancel (-allocated_qty) and allocation ship (-allocated_qty).
        A create followed by a cancel of the same allocation leaves both
        on_hand_units and reserved_units exactly as before the pair.
    input_set: "The InventoryRecord plus all its RetailAllocations with status in {PROPOSED, CONFIRMED}"
    constants: {}
    precision: "integer units"
  - name: iron_mass_ledger
    trigger: "POST /foundry/melt-batches/{id}/tap (initialize), each pour, and each defect-disposition SCRAP"
    algorithm: waterfall_allocation
    formula: |
      At tap:      slag_loss_lbs      = round_half_up(tapped_lbs * SLAG_LOSS_PCT, 2)
                   remaining_iron_lbs = tapped_lbs - slag_loss_lbs
      At pour:     pour_total_lbs     = unit_count * pour_weight_per_unit_oz / 16.0
                   requires pour_total_lbs <= remaining_iron_lbs (equality allowed,
                   and equality drives the batch to EXHAUSTED)
                   poured_lbs += pour_total_lbs; remaining_iron_lbs -= pour_total_lbs
      At defect-scrap of a unit poured from this batch:
                   returns_credit_lbs += round_half_up(unit.pour_weight_oz / 16.0, 2)
      Conservation invariant (compensating-action target):
        tapped_lbs == poured_lbs + slag_loss_lbs + remaining_iron_lbs
        at every observable instant after tap; a pour paired with the later
        defect-scrap of one of its units conserves accounted iron mass: the
        unit's pour weight leaves remaining_iron_lbs at pour time and re-enters
        the ledger as returns_credit_lbs at scrap time.
    input_set: "The single MeltBatch and the CastingUnits poured from it"
    constants:
      SLAG_LOSS_PCT: 0.03
    precision: "2 decimal places, round_half_up"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role; missing or unknown role is rejected", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "The caller's role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Segregation of duties: certify-chemistry requires X-User-ID != chemistry_recorded_by; qa-release requires X-User-ID != bake_recorded_by; acknowledge-breach and certify-remediation require X-User-ID != last_breach_reading_recorded_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /foundry/melt-batches/{id}/certify-chemistry", "POST /foundry/seasoning-batches/{id}/qa-release", "POST /foundry/environmental-permits/{id}/acknowledge-breach", "POST /foundry/environmental-permits/{id}/certify-remediation"] }
  - { priority: 4, category: existence, check: "Request body is well-formed: all required fields present, no undeclared fields, enum values in range, planned_*_pct sums to 100 (+-0.01), planned_tap_end > planned_tap_start, planned_bake_end > planned_bake_start, quantities >= 1, week numbers in 1..53", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "Every id in the path and every FK id in the body (production_order_id, mold_id, inventory_record_id, product_id, permit id, each element of unit_ids) resolves to an existing resource", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "The target resource is in a from-state that the invoked transition allows (per §1.2); also covers terminal-state lockdown and repeated triggers", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "OCC: expected_production_order_version == current ProductionOrder.version (melt create); expected_inventory_version == current InventoryRecord.version (allocation create)", error_id: ERR_STALE_ORDER_VERSION, http_status: 412, applies_to: ["POST /foundry/melt-batches"] }
  - { priority: 7, category: state, check: "OCC: expected_inventory_version == current InventoryRecord.version", error_id: ERR_STALE_INVENTORY_VERSION, http_status: 412, applies_to: ["POST /foundry/retail-allocations"] }
  - { priority: 8, category: state, check: "ProductionOrder posture gates: melt create, mold create, and pour require posture != FROZEN; seasoning-batch create requires posture == OPEN (FROZEN rejected, RESTRICTED rejected); order complete requires posture != FROZEN", error_id: ERR_ORDER_FROZEN, http_status: 409, applies_to: ["POST /foundry/melt-batches", "POST /foundry/molds", "POST /foundry/melt-batches/{id}/pour", "POST /foundry/seasoning-batches", "POST /foundry/production-orders/{id}/complete"] }
  - { priority: 8, category: state, check: "ProductionOrder posture gate: seasoning-batch create while posture == RESTRICTED (and not FROZEN)", error_id: ERR_ORDER_RESTRICTED, http_status: 409, applies_to: ["POST /foundry/seasoning-batches"] }
  - { priority: 9, category: business_safety, check: "certify-chemistry (decision CERTIFY): carbon_equivalent in [3.90, 4.30], sulfur_pct <= 0.060, phosphorus_pct <= 0.080, bath_temp_f >= 2650", error_id: ERR_CHEMISTRY_OUT_OF_SPEC, http_status: 422, applies_to: ["POST /foundry/melt-batches/{id}/certify-chemistry"] }
  - { priority: 10, category: business_safety, check: "The AIR_EMISSIONS permit (if one exists) is not in BREACH when a new melt is created or a tap is executed; the DUST_CONTROL permit (if one exists) is not in BREACH when a shakeout is executed; the SAND_RECLAMATION permit (if one exists) is not in BREACH when a new mold is created", error_id: ERR_EMISSIONS_PERMIT_BREACH, http_status: 409, applies_to: ["POST /foundry/melt-batches", "POST /foundry/melt-batches/{id}/tap", "POST /foundry/molds/{id}/shakeout", "POST /foundry/molds"] }
  - { priority: 11, category: business_safety, check: "qa-release with decision RELEASE requires food_safety_verified == true (oil lot and COA documentation attested)", error_id: ERR_FOOD_SAFETY_INCOMPLETE, http_status: 422, applies_to: ["POST /foundry/seasoning-batches/{id}/qa-release"] }
  - { priority: 12, category: business_safety, check: "qa-release with decision RELEASE requires cure_score >= 70", error_id: ERR_CURE_PROFILE_VIOLATION, http_status: 422, applies_to: ["POST /foundry/seasoning-batches/{id}/qa-release"] }
  - { priority: 13, category: business_constraint, check: "Furnace booking: the half-open interval [planned_tap_start, planned_tap_end) must not overlap any other MeltBatch on the same furnace_id whose state is not EXHAUSTED or CANCELLED; adjacency (new.start == existing.end or vice versa) is allowed", error_id: ERR_FURNACE_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /foundry/melt-batches"] }
  - { priority: 14, category: business_constraint, check: "Oven capacity: unit_count + sum(unit_count of SeasoningBatches in COATING or BAKING whose [planned_bake_start, planned_bake_end) overlaps the new window) <= 12; overlapping batches share aggregate capacity", error_id: ERR_OVEN_CAPACITY_EXCEEDED, http_status: 409, applies_to: ["POST /foundry/seasoning-batches"] }
  - { priority: 15, category: business_constraint, check: "disposition REWORK requires report.severity != CRITICAL", error_id: ERR_CRITICAL_DEFECT_MUST_SCRAP, http_status: 422, applies_to: ["POST /foundry/defect-reports/{id}/disposition"] }
  - { priority: 16, category: business_constraint, check: "disposition REWORK requires unit.rework_count < 2", error_id: ERR_REWORK_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /foundry/defect-reports/{id}/disposition"] }
  - { priority: 17, category: business_constraint, check: "disposition USE_AS_IS requires report.severity == MINOR", error_id: ERR_USE_AS_IS_MINOR_ONLY, http_status: 422, applies_to: ["POST /foundry/defect-reports/{id}/disposition"] }
  - { priority: 18, category: business_constraint, check: "inspect with outcome PASS requires |measured_weight_oz - target_weight_oz| <= weight_tolerance_oz, |measured_diameter_in - target_diameter_in| <= diameter_tolerance_in, and measured_wall_thickness_in >= min_wall_thickness_in; bounds are inclusive", error_id: ERR_TOLERANCE_EXCEEDED, http_status: 422, applies_to: ["POST /foundry/casting-units/{id}/inspect"] }
  - { priority: 19, category: business_constraint, check: "mold sand mix: new_sand_pct + reclaimed_sand_pct == 100.0 (+-0.01), reclaimed_sand_pct <= 85.0, moisture_pct in [3.0, 4.5], clay_pct in [8.0, 12.0]", error_id: ERR_SAND_MIX_VIOLATION, http_status: 422, applies_to: ["POST /foundry/molds"] }
  - { priority: 20, category: business_constraint, check: "reclaim: reclaimed_sand_lbs + dust_collected_lbs <= sand_weight_lbs and the implied loss <= 0.12 * sand_weight_lbs (loss of exactly 12% is allowed)", error_id: ERR_SAND_LOSS_EXCEEDED, http_status: 422, applies_to: ["POST /foundry/molds/{id}/reclaim"] }
  - { priority: 21, category: business_constraint, check: "pour: the mold's production_order_id equals the melt batch's production_order_id", error_id: ERR_MOLD_ORDER_MISMATCH, http_status: 422, applies_to: ["POST /foundry/melt-batches/{id}/pour"] }
  - { priority: 22, category: business_constraint, check: "seasoning-batch create: unit_ids is non-empty, unit_count <= 12, and every element belongs to the given production_order_id", error_id: ERR_UNITS_NOT_SAME_ORDER, http_status: 422, applies_to: ["POST /foundry/seasoning-batches"] }
  - { priority: 23, category: business_temporal, check: "allocation create and confirm: ship_week (ISO date) is strictly after the current logical date", error_id: ERR_SHIP_WEEK_INVALID, http_status: 422, applies_to: ["POST /foundry/retail-allocations", "POST /foundry/retail-allocations/{id}/confirm"] }
  - { priority: 24, category: business_temporal, check: "allocation cancel of a CONFIRMED allocation whose ship_week ISO week lies in the product's peak window: current logical date must be strictly before ship_week - 42 days (the freeze boundary itself is frozen)", error_id: ERR_ALLOCATION_FROZEN, http_status: 409, applies_to: ["POST /foundry/retail-allocations/{id}/cancel"] }
  - { priority: 25, category: business_referential, check: "product.status == ACTIVE for: production-order create, allocation create, allocation confirm, outlet sale", error_id: ERR_PRODUCT_DISCONTINUED, http_status: 422, applies_to: ["POST /foundry/production-orders", "POST /foundry/retail-allocations", "POST /foundry/retail-allocations/{id}/confirm", "POST /foundry/outlet-sales"] }
  - { priority: 26, category: business_fiscal, check: "product create: wholesale_price_cents >= round_half_up(import_landed_cost_cents * 1.15) (brand premium over imports; equality allowed)", error_id: ERR_PRICE_BELOW_BRAND_FLOOR, http_status: 422, applies_to: ["POST /foundry/products"] }
  - { priority: 27, category: business_fiscal, check: "outlet sale: unit_price_cents >= round_half_up(msrp_cents * 0.55) for FACTORY_OUTLET, >= msrp_cents for MUSEUM_STORE (equality allowed)", error_id: ERR_OUTLET_PRICE_BELOW_FLOOR, http_status: 422, applies_to: ["POST /foundry/outlet-sales"] }
  - { priority: 28, category: business_fiscal, check: "allocation create: allocated_qty <= available_units of the InventoryRecord (equality allowed); outlet sale: qty <= available_units", error_id: ERR_INSUFFICIENT_INVENTORY, http_status: 422, applies_to: ["POST /foundry/retail-allocations", "POST /foundry/outlet-sales"] }
  - { priority: 29, category: business_fiscal, check: "pour: unit_count * pour_weight_per_unit_oz / 16.0 <= batch.remaining_iron_lbs (equality allowed and exhausts the batch); unit_count in 1..48", error_id: ERR_INSUFFICIENT_IRON, http_status: 422, applies_to: ["POST /foundry/melt-batches/{id}/pour"] }
  - { priority: 30, category: business_fiscal, check: "order complete: good_units >= ceil(0.85 * planned_quantity)", error_id: ERR_YIELD_BELOW_MINIMUM, http_status: 422, applies_to: ["POST /foundry/production-orders/{id}/complete"] }

endpoints:
  - { method: POST, path: "/foundry/products", description: "Create a cookware product (SKU). Auto-creates its InventoryRecord (on_hand_units 0, version 1).", roles: [FoundryManager], code: 201, input: [sku_code, name, category, target_weight_oz, weight_tolerance_oz, target_diameter_in, diameter_tolerance_in, min_wall_thickness_in, wholesale_price_cents, msrp_cents, import_landed_cost_cents, peak_season_start_week, peak_season_end_week], output: Product, side_effects: ["creates InventoryRecord for the product", "brand-floor price check (validations priority 26)"] }
  - { method: GET, path: "/foundry/products", description: "List products", roles: [FoundryManager, MeltOperator, QualityInspector, SeasoningLead, EnvironmentalOfficer, RetailPlanner, OutletManager], code: 200, input: ["category?", "status?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/foundry/products/{id}", description: "Read one product", roles: [FoundryManager, MeltOperator, QualityInspector, SeasoningLead, EnvironmentalOfficer, RetailPlanner, OutletManager], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/foundry/products/{id}/discontinue", description: "Discontinue a product: status ACTIVE -> DISCONTINUED. Blocks new production orders, allocation creates/confirms and outlet sales; in-flight work continues.", roles: [FoundryManager], code: 200, input: [], output: Product, side_effects: ["increments Product.version by 1"] }
  - { method: GET, path: "/foundry/products/{id}/outlet-sales", description: "List on-site (factory outlet / museum store) sales of this product", roles: [FoundryManager, OutletManager, RetailPlanner], code: 200, input: ["limit?", "offset?"], output: "OutletSale[]", side_effects: [] }
  - { method: POST, path: "/foundry/production-orders", description: "Create a production order for an ACTIVE product", roles: [FoundryManager], code: 201, input: [product_id, planned_quantity, scheduled_week], output: ProductionOrder, side_effects: ["initial state PLANNED, posture OPEN, scrap_tier GREEN"] }
  - { method: GET, path: "/foundry/production-orders", description: "List production orders", roles: [FoundryManager, MeltOperator, QualityInspector, SeasoningLead, EnvironmentalOfficer, RetailPlanner, OutletManager], code: 200, input: ["product_id?", "state?", "posture?", "limit?", "offset?"], output: "ProductionOrder[]", side_effects: [] }
  - { method: GET, path: "/foundry/production-orders/{id}", description: "Read one production order (posture, scrap_index, unit costs recomputed per calculations)", roles: [FoundryManager, MeltOperator, QualityInspector, SeasoningLead, EnvironmentalOfficer, RetailPlanner, OutletManager], code: 200, input: [], output: ProductionOrder, side_effects: [] }
  - { method: POST, path: "/foundry/production-orders/{id}/release", description: "Release a PLANNED order to the molding floor (PLANNED -> MOLDING)", roles: [FoundryManager], code: 200, input: [], output: ProductionOrder, side_effects: ["increments ProductionOrder.version by 1"] }
  - { method: POST, path: "/foundry/production-orders/{id}/complete", description: "Complete a SEASONING order: records labor/energy actuals, computes unit_cost_final_cents and margin_flag, cascades non-terminal children to closure", roles: [FoundryManager], code: 200, input: [labor_hours_actual, energy_kwh_actual], output: ProductionOrder, side_effects: ["computes unit_cost_final_cents (calculations.unit_cost final variant)", "sets margin_flag", "cascades per state_machines.ProductionOrder SEASONING -> COMPLETE"] }
  - { method: POST, path: "/foundry/production-orders/{id}/cancel", description: "Cancel a non-terminal order; cascades per state_machines.ProductionOrder", roles: [FoundryManager], code: 200, input: [], output: ProductionOrder, side_effects: ["cascades per state_machines.ProductionOrder * -> CANCELLED"] }
  - { method: GET, path: "/foundry/production-orders/{id}/molds", description: "List molds of an order (reverse reachability for Mold.production_order_id)", roles: [FoundryManager, MeltOperator, QualityInspector, EnvironmentalOfficer], code: 200, input: ["limit?", "offset?"], output: "Mold[]", side_effects: [] }
  - { method: POST, path: "/foundry/melt-batches", description: "Create a melt batch: books the furnace window and OCC-pins the order. Requires order.state in {MOLDING, POURING} and order.posture != FROZEN.", roles: [MeltOperator], code: 201, input: [production_order_id, furnace_id, planned_tap_start, planned_tap_end, planned_iron_lbs, planned_pig_iron_pct, planned_scrap_steel_pct, planned_returns_pct, planned_alloy_pct, expected_production_order_version], output: MeltBatch, side_effects: ["computes planned_charge_cost_cents", "furnace half-open overlap check", "increments ProductionOrder.version by 1"] }
  - { method: GET, path: "/foundry/melt-batches", description: "List melt batches (reverse reachability for MeltBatch.production_order_id)", roles: [FoundryManager, MeltOperator, QualityInspector, EnvironmentalOfficer], code: 200, input: ["production_order_id?", "state?", "limit?", "offset?"], output: "MeltBatch[]", side_effects: [] }
  - { method: GET, path: "/foundry/melt-batches/{id}", description: "Read one melt batch", roles: [FoundryManager, MeltOperator, QualityInspector, EnvironmentalOfficer], code: 200, input: [], output: MeltBatch, side_effects: [] }
  - { method: POST, path: "/foundry/melt-batches/{id}/charge", description: "Record a charge (initial from CHARGING, supplemental from ADJUSTMENT); accumulates actual_charge_cost_cents with per-line rounding", roles: [MeltOperator], code: 200, input: [pig_iron_lbs, scrap_steel_lbs, returns_lbs, alloy_lbs], output: MeltBatch, side_effects: ["state -> MELTING", "accumulates component lbs and actual_charge_cost_cents"] }
  - { method: POST, path: "/foundry/melt-batches/{id}/chemistry-readings", description: "Record spectrometer chemistry readings (MELTING -> CHEMISTRY_CHECK); computes carbon_equivalent", roles: [MeltOperator], code: 200, input: [carbon_pct, silicon_pct, manganese_pct, sulfur_pct, phosphorus_pct, bath_temp_f], output: MeltBatch, side_effects: ["computes carbon_equivalent", "sets chemistry_recorded_by = X-User-ID"] }
  - { method: POST, path: "/foundry/melt-batches/{id}/certify-chemistry", description: "Quality certification decision on the current reading: CERTIFY (spec-checked) or ORDER_ADJUSTMENT (cycle back via ADJUSTMENT)", roles: [QualityInspector], code: 200, input: [decision], output: MeltBatch, side_effects: ["CERTIFY -> CERTIFIED and sets certified_by", "ORDER_ADJUSTMENT -> ADJUSTMENT and adjustment_count += 1"] }
  - { method: POST, path: "/foundry/melt-batches/{id}/tap", description: "Tap the certified melt into the ladle (CERTIFIED -> TAPPED); initializes the iron mass ledger", roles: [MeltOperator], code: 200, input: [tapped_temp_f, tapped_lbs], output: MeltBatch, side_effects: ["computes slag_loss_lbs and remaining_iron_lbs"] }
  - { method: POST, path: "/foundry/melt-batches/{id}/pour", description: "Pour unit_count castings from a TAPPED batch into a PREPARED mold of the same order; creates the CastingUnits (state POURED) and debits the iron ledger", roles: [MeltOperator], code: 201, input: [mold_id, unit_count, pour_weight_per_unit_oz], output: "CastingUnit[]", side_effects: ["creates unit_count CastingUnits in POURED", "mold PREPARED -> POURED", "poured_lbs/remaining_iron_lbs updated; remaining == 0 -> batch EXHAUSTED", "order.poured_units += unit_count; scrap_index recomputed", "first pour moves order MOLDING -> POURING", "increments ProductionOrder.version by 1"] }
  - { method: POST, path: "/foundry/molds", description: "Prepare a sand mold for an order. Requires order.state in {MOLDING, POURING} and order.posture != FROZEN.", roles: [FoundryManager], code: 201, input: [production_order_id, new_sand_pct, reclaimed_sand_pct, moisture_pct, clay_pct, sand_weight_lbs], output: Mold, side_effects: ["sand mix validation (priority 19)"] }
  - { method: POST, path: "/foundry/molds/{id}/shakeout", description: "Shake out a POURED mold: mold -> SHAKEOUT_DONE, all its POURED units -> SHAKEOUT_DONE", roles: [MeltOperator], code: 200, input: [], output: Mold, side_effects: ["units POURED -> SHAKEOUT_DONE"] }
  - { method: POST, path: "/foundry/molds/{id}/reclaim", description: "Reclaim the shakeout sand: records reclaimed/dust amounts, enforces the 12% loss tolerance, recomputes the SAND_RECLAMATION permit's month-to-date rate", roles: [EnvironmentalOfficer], code: 200, input: [reclaimed_sand_lbs, dust_collected_lbs], output: Mold, side_effects: ["mold SHAKEOUT_DONE -> SAND_RECLAIMED", "recomputes SAND_RECLAMATION permit current_sand_rate and posture transitions"] }
  - { method: GET, path: "/foundry/casting-units", description: "List casting units; reverse reachability for all CastingUnit FKs", roles: [FoundryManager, MeltOperator, QualityInspector, SeasoningLead], code: 200, input: ["production_order_id?", "melt_batch_id?", "mold_id?", "seasoning_batch_id?", "state?", "limit?", "offset?"], output: "CastingUnit[]", side_effects: [] }
  - { method: GET, path: "/foundry/casting-units/{id}", description: "Read one casting unit", roles: [FoundryManager, MeltOperator, QualityInspector, SeasoningLead], code: 200, input: [], output: CastingUnit, side_effects: [] }
  - { method: POST, path: "/foundry/casting-units/{id}/inspect", description: "Inspect a SHAKEOUT_DONE unit. outcome PASS enforces weight/dimensional tolerances (-> FINISHED); outcome DEFECT requires defect_type+severity and opens a DefectReport (-> DEFECT_REVIEW).", roles: [QualityInspector], code: 200, input: [outcome, measured_weight_oz, measured_diameter_in, measured_wall_thickness_in, "defect_type?", "severity?", "notes?"], output: CastingUnit, side_effects: ["PASS -> FINISHED (tolerance checks)", "DEFECT -> DEFECT_REVIEW and creates OPEN DefectReport", "first FINISHED unit moves order POURING -> FINISHING"] }
  - { method: POST, path: "/foundry/casting-units/{id}/complete-rework", description: "Finish a rework operation (REWORK -> SHAKEOUT_DONE) so the unit can be re-inspected", roles: [MeltOperator], code: 200, input: [], output: CastingUnit, side_effects: [] }
  - { method: GET, path: "/foundry/casting-units/{id}/defect-reports", description: "List defect reports of a unit (reverse reachability for DefectReport.casting_unit_id). Items are returned in created_at ASC order (ties impossible: one report per inspect call).", roles: [FoundryManager, MeltOperator, QualityInspector], code: 200, input: ["limit?", "offset?"], output: "DefectReport[]", side_effects: [] }
  - { method: GET, path: "/foundry/defect-reports", description: "List defect reports. Items are returned in created_at ASC order.", roles: [FoundryManager, QualityInspector], code: 200, input: ["status?", "limit?", "offset?"], output: "DefectReport[]", side_effects: [] }
  - { method: POST, path: "/foundry/defect-reports/{id}/disposition", description: "Disposition an OPEN report: REWORK (non-CRITICAL, rework_count < 2), SCRAP (drives scrap accounting), or USE_AS_IS (MINOR only)", roles: [QualityInspector], code: 200, input: [disposition], output: DefectReport, side_effects: ["drives the linked CastingUnit transition per state_machines.CastingUnit", "SCRAP updates order scrap counters, scrap_index, posture and the melt's returns_credit_lbs"] }
  - { method: POST, path: "/foundry/seasoning-batches", description: "Create a seasoning batch: pulls FINISHED units of one order onto the seasoning line and books oven capacity. Requires order.state in {POURING, FINISHING, SEASONING} and order.posture == OPEN.", roles: [SeasoningLead], code: 201, input: [production_order_id, oil_type, coating_count, planned_bake_start, planned_bake_end, unit_ids], output: SeasoningBatch, side_effects: ["each unit FINISHED -> SEASONING_QUEUED with seasoning_batch_id set", "oven aggregate-capacity check (priority 14)", "first seasoning batch moves order POURING/FINISHING -> SEASONING", "increments ProductionOrder.version by 1"] }
  - { method: GET, path: "/foundry/seasoning-batches", description: "List seasoning batches (reverse reachability for SeasoningBatch.production_order_id)", roles: [FoundryManager, SeasoningLead, QualityInspector], code: 200, input: ["production_order_id?", "state?", "limit?", "offset?"], output: "SeasoningBatch[]", side_effects: [] }
  - { method: GET, path: "/foundry/seasoning-batches/{id}", description: "Read one seasoning batch (includes cure_score after qa-release)", roles: [FoundryManager, SeasoningLead, QualityInspector], code: 200, input: [], output: SeasoningBatch, side_effects: [] }
  - { method: POST, path: "/foundry/seasoning-batches/{id}/start-bake", description: "Start the bake (COATING -> BAKING): records oven temperature and the food-safety oil lot / COA references", roles: [SeasoningLead], code: 200, input: [actual_bake_temp_f, oil_lot_number, coa_reference], output: SeasoningBatch, side_effects: ["sets bake_recorded_by = X-User-ID"] }
  - { method: POST, path: "/foundry/seasoning-batches/{id}/qa-release", description: "Quality release decision (BAKING -> RELEASED | FAILED): records bake duration, computes cure_score, enforces food-safety attestation and segregation of duties", roles: [QualityInspector], code: 200, input: [bake_duration_min, food_safety_verified, decision], output: SeasoningBatch, side_effects: ["RELEASE: units -> SEASONED, order.good_units += unit_count, InventoryRecord.on_hand_units += unit_count (increments InventoryRecord.version)", "FAIL: units -> FINISHED"] }
  - { method: POST, path: "/foundry/environmental-permits", description: "Create an environmental permit (AIR_EMISSIONS, SAND_RECLAMATION or DUST_CONTROL)", roles: [EnvironmentalOfficer], code: 201, input: [permit_type, limit_value, measurement_unit, compliance_period], output: EnvironmentalPermit, side_effects: ["initial status ACTIVE"] }
  - { method: GET, path: "/foundry/environmental-permits", description: "List environmental permits", roles: [FoundryManager, EnvironmentalOfficer, MeltOperator], code: 200, input: ["permit_type?", "status?", "limit?", "offset?"], output: "EnvironmentalPermit[]", side_effects: [] }
  - { method: GET, path: "/foundry/environmental-permits/{id}", description: "Read one environmental permit", roles: [FoundryManager, EnvironmentalOfficer, MeltOperator], code: 200, input: [], output: EnvironmentalPermit, side_effects: [] }
  - { method: POST, path: "/foundry/environmental-permits/{id}/readings", description: "Record an emissions reading against an AIR_EMISSIONS or DUST_CONTROL permit (SAND_RECLAMATION permits are rate-driven and reject readings with ERR_INVALID_REQUEST); timestamped by the logical clock", roles: [EnvironmentalOfficer], code: 201, input: [reading_value, source], output: EmissionsReading, side_effects: ["drives permit status per calculations.emissions_period_rollup", "on BREACH: cascade holds in-flight melts and freezes their orders"] }
  - { method: GET, path: "/foundry/environmental-permits/{id}/readings", description: "List readings of a permit (reverse reachability for EmissionsReading.permit_id)", roles: [FoundryManager, EnvironmentalOfficer], code: 200, input: ["limit?", "offset?"], output: "EmissionsReading[]", side_effects: [] }
  - { method: POST, path: "/foundry/environmental-permits/{id}/acknowledge-breach", description: "FoundryManager acknowledges a BREACH (BREACH -> REMEDIATION); the officer who recorded the breaching reading may not acknowledge it", roles: [FoundryManager], code: 200, input: [], output: EnvironmentalPermit, side_effects: [] }
  - { method: POST, path: "/foundry/environmental-permits/{id}/certify-remediation", description: "EnvironmentalOfficer certifies remediation (REMEDIATION -> ACTIVE); resumes HELD melts and unfreezes their orders", roles: [EnvironmentalOfficer], code: 200, input: [], output: EnvironmentalPermit, side_effects: ["HELD MeltBatches resume state_before_hold", "affected ProductionOrders recompute posture"] }
  - { method: GET, path: "/foundry/inventory-records", description: "List inventory records (reverse reachability for InventoryRecord.product_id)", roles: [FoundryManager, RetailPlanner, OutletManager, SeasoningLead], code: 200, input: ["product_id?", "limit?", "offset?"], output: "InventoryRecord[]", side_effects: [] }
  - { method: GET, path: "/foundry/inventory-records/{id}", description: "Read one inventory record (on_hand, reserved, available)", roles: [FoundryManager, RetailPlanner, OutletManager, SeasoningLead], code: 200, input: [], output: InventoryRecord, side_effects: [] }
  - { method: GET, path: "/foundry/inventory-records/{id}/allocation-plan", description: "Computed read: suggested seasonal channel split for build_qty per calculations.channel_allocation_split (pinned per-channel rounding order)", roles: [FoundryManager, RetailPlanner], code: 200, input: [build_qty], output: "{ museum_store_units: integer, factory_outlet_units: integer, ecommerce_units: integer, retail_chain_units: integer }", side_effects: [] }
  - { method: POST, path: "/foundry/retail-allocations", description: "Create a retail allocation (status PROPOSED) reserving units from an InventoryRecord; OCC-pins the record. ship_week must be after the current logical date.", roles: [RetailPlanner], code: 201, input: [inventory_record_id, channel, allocated_qty, ship_week, expected_inventory_version], output: RetailAllocation, side_effects: ["InventoryRecord.reserved_units += allocated_qty", "increments InventoryRecord.version by 1"] }
  - { method: GET, path: "/foundry/retail-allocations", description: "List retail allocations (reverse reachability for RetailAllocation.inventory_record_id)", roles: [FoundryManager, RetailPlanner], code: 200, input: ["inventory_record_id?", "channel?", "status?", "limit?", "offset?"], output: "RetailAllocation[]", side_effects: [] }
  - { method: GET, path: "/foundry/retail-allocations/{id}", description: "Read one retail allocation", roles: [FoundryManager, RetailPlanner], code: 200, input: [], output: RetailAllocation, side_effects: [] }
  - { method: POST, path: "/foundry/retail-allocations/{id}/confirm", description: "Confirm a PROPOSED allocation (re-checks product ACTIVE and ship_week still in the future)", roles: [RetailPlanner], code: 200, input: [], output: RetailAllocation, side_effects: ["sets confirmed_at"] }
  - { method: POST, path: "/foundry/retail-allocations/{id}/cancel", description: "Cancel a PROPOSED or CONFIRMED allocation; CONFIRMED allocations inside the product's peak window are frozen starting 42 days before ship_week", roles: [RetailPlanner], code: 200, input: [], output: RetailAllocation, side_effects: ["InventoryRecord.reserved_units -= allocated_qty (increments InventoryRecord.version)"] }
  - { method: POST, path: "/foundry/retail-allocations/{id}/ship", description: "Ship a CONFIRMED allocation: decrements on_hand and reserved, increments shipped", roles: [RetailPlanner], code: 200, input: [], output: RetailAllocation, side_effects: ["InventoryRecord on_hand_units -= allocated_qty, reserved_units -= allocated_qty, shipped_units += allocated_qty (increments InventoryRecord.version)"] }
  - { method: POST, path: "/foundry/outlet-sales", description: "Record a factory-outlet or museum-store sale at the plant site; enforces the channel price floor and decrements inventory", roles: [OutletManager], code: 201, input: [product_id, channel, qty, unit_price_cents], output: OutletSale, side_effects: ["computes floor_price_cents", "InventoryRecord on_hand_units -= qty, outlet_sold_units += qty (increments InventoryRecord.version)"] }
  - { method: POST, path: "/foundry/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z (never wall-clock time). to_iso8601 must be strictly after the current logical time. Crossing a calendar-month boundary resets per-period emission counters, clears WARNING permits to ACTIVE, and resets the sand-reclamation month-to-date rate.", roles: [FoundryManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["month-rollover processing per calculations.emissions_period_rollup and calculations.sand_reclamation_rate"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing, or the role value is not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The caller's X-User-ID equals the field the segregation rule excludes (chemistry_recorded_by, bake_recorded_by, or last_breach_reading_recorded_by)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, undeclared field, enum out of range, pct sum != 100 (+-0.01), end <= start, quantity < 1, week out of 1..53, unit_count out of 1..48, or a reading posted to a SAND_RECLAMATION permit" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path id or body FK id does not resolve to an existing resource" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The target resource is not in a from-state allowed for the invoked transition (includes terminal-state lockdown and repeated triggers)" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_production_order_version != current ProductionOrder.version on melt-batch create" }
  - { id: ERR_STALE_INVENTORY_VERSION, http: 412, condition: "expected_inventory_version != current InventoryRecord.version on retail-allocation create" }
  - { id: ERR_ORDER_FROZEN, http: 409, condition: "Operation requires the order's posture != FROZEN (an in-flight melt is HELD by an emissions breach)" }
  - { id: ERR_ORDER_RESTRICTED, http: 409, condition: "Seasoning-batch create while the order's posture is RESTRICTED (scrap_index >= 0.08, no HELD melt)" }
  - { id: ERR_CHEMISTRY_OUT_OF_SPEC, http: 422, condition: "CERTIFY decision with carbon_equivalent outside [3.90, 4.30], sulfur_pct > 0.060, phosphorus_pct > 0.080, or bath_temp_f < 2650" }
  - { id: ERR_EMISSIONS_PERMIT_BREACH, http: 409, condition: "Melt-batch create or tap while AIR_EMISSIONS is in BREACH; shakeout while DUST_CONTROL is in BREACH; mold create while SAND_RECLAMATION is in BREACH" }
  - { id: ERR_FOOD_SAFETY_INCOMPLETE, http: 422, condition: "qa-release decision RELEASE with food_safety_verified != true" }
  - { id: ERR_CURE_PROFILE_VIOLATION, http: 422, condition: "qa-release decision RELEASE with cure_score < 70 for the batch's oil cure profile" }
  - { id: ERR_FURNACE_WINDOW_OVERLAP, http: 409, condition: "Half-open tap window overlaps another active MeltBatch on the same furnace" }
  - { id: ERR_OVEN_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping seasoning batches would put more than 12 units in OVEN_1 at once" }
  - { id: ERR_CRITICAL_DEFECT_MUST_SCRAP, http: 422, condition: "disposition REWORK requested on a CRITICAL defect report" }
  - { id: ERR_REWORK_LIMIT_EXCEEDED, http: 422, condition: "disposition REWORK on a unit whose rework_count is already 2" }
  - { id: ERR_USE_AS_IS_MINOR_ONLY, http: 422, condition: "disposition USE_AS_IS on a report whose severity is not MINOR" }
  - { id: ERR_TOLERANCE_EXCEEDED, http: 422, condition: "inspect outcome PASS with weight, diameter or wall thickness outside the product's tolerances" }
  - { id: ERR_SAND_MIX_VIOLATION, http: 422, condition: "Mold sand mix violates the 100% sum, 85% reclaimed cap, moisture [3.0, 4.5] or clay [8.0, 12.0] bounds" }
  - { id: ERR_SAND_LOSS_EXCEEDED, http: 422, condition: "Reclaim leaves a negative loss or a loss above 12% of sand_weight_lbs" }
  - { id: ERR_MOLD_ORDER_MISMATCH, http: 422, condition: "pour: the mold belongs to a different production order than the melt batch" }
  - { id: ERR_UNITS_NOT_SAME_ORDER, http: 422, condition: "seasoning-batch create: unit_ids empty, unit_count > 12, or a unit belongs to a different order" }
  - { id: ERR_SHIP_WEEK_INVALID, http: 422, condition: "ship_week is not strictly after the current logical date" }
  - { id: ERR_ALLOCATION_FROZEN, http: 409, condition: "Cancel of a CONFIRMED allocation whose ship_week is in the product's peak window on or after the freeze boundary (ship_week - 42 days)" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 422, condition: "Operation requires an ACTIVE product (order create, allocation create/confirm, outlet sale)" }
  - { id: ERR_PRICE_BELOW_BRAND_FLOOR, http: 422, condition: "wholesale_price_cents below round_half_up(import_landed_cost_cents * 1.15)" }
  - { id: ERR_OUTLET_PRICE_BELOW_FLOOR, http: 422, condition: "unit_price_cents below the channel floor (55% of MSRP at FACTORY_OUTLET, 100% of MSRP at MUSEUM_STORE)" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "allocated_qty (or outlet qty) exceeds available_units of the InventoryRecord" }
  - { id: ERR_INSUFFICIENT_IRON, http: 422, condition: "pour requires more iron than remaining_iron_lbs" }
  - { id: ERR_YIELD_BELOW_MINIMUM, http: 422, condition: "complete with good_units < ceil(0.85 * planned_quantity)" }

roles:
  - name: FoundryManager
    description: "Plant manager: owns products, production orders, molds, order completion/cancellation, breach acknowledgment, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /foundry/products", "POST /foundry/products/{id}/discontinue", "POST /foundry/production-orders", "POST /foundry/production-orders/{id}/release", "POST /foundry/production-orders/{id}/complete", "POST /foundry/production-orders/{id}/cancel", "POST /foundry/molds", "POST /foundry/environmental-permits/{id}/acknowledge-breach", "POST /foundry/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: MeltOperator
    description: "Furnace and floor operator: melts, charges, chemistry readings, taps, pours, shakeout, rework completion"
    identity: opaque
    exclusive_operations: ["POST /foundry/melt-batches", "POST /foundry/melt-batches/{id}/charge", "POST /foundry/melt-batches/{id}/chemistry-readings", "POST /foundry/melt-batches/{id}/tap", "POST /foundry/melt-batches/{id}/pour", "POST /foundry/molds/{id}/shakeout", "POST /foundry/casting-units/{id}/complete-rework"]
    shared_operations: ["all GET endpoints"]
  - name: QualityInspector
    description: "Quality authority: certifies melt chemistry, inspects castings, dispositions defects, releases seasoning batches. Segregated from the recording operator by X-User-ID."
    identity: opaque
    exclusive_operations: ["POST /foundry/melt-batches/{id}/certify-chemistry", "POST /foundry/casting-units/{id}/inspect", "POST /foundry/defect-reports/{id}/disposition", "POST /foundry/seasoning-batches/{id}/qa-release"]
    shared_operations: ["all GET endpoints"]
  - name: SeasoningLead
    description: "Seasoning line lead: creates seasoning batches and runs the bake"
    identity: opaque
    exclusive_operations: ["POST /foundry/seasoning-batches", "POST /foundry/seasoning-batches/{id}/start-bake"]
    shared_operations: ["all GET endpoints"]
  - name: EnvironmentalOfficer
