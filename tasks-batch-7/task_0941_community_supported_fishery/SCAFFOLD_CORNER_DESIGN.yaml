        distinguishing_aspect: "Opening a season that is already OPEN violates the season-status rung at priority 25 and returns 409 ERR_SEASON_NOT_OPEN; the season stays OPEN and its version does not advance twice."
        test_recipe:
          setup: ["one season already moved PLANNING -> OPEN"]
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD"], landing_commit_lead_hours: 72 }
