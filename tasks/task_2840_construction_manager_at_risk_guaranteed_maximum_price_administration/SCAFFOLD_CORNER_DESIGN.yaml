      - name: draw_post_is_permitted_or_refused_depending_on_the_derived_approval_flag
        claim_type: conditional_action
        excluded_because:
          difficulty_instance: construction_draw_at_exact_owner_approval_threshold_and_one_cent_above
          rationale: |
            Whether POST /contingency-draws/{id}/post is legal straight from REQUESTED depends on
            the derived requires_owner_approval flag, and the §1.8 instance drives exactly that
            conditional pair - a draw at exactly DRAW_OWNER_APPROVAL_THRESHOLD that posts
            directly and one a cent above that must travel the approval path or be refused with
            ERR_OWNER_APPROVAL_REQUIRED.

  # ===================================================================
  # §1.6 has 43 error codes. 34 of them are already asserted by an `assert` clause
  # of a §1.8 instance or of an earlier §1.9 section, so this section carries only the
  # nine codes that no earlier instance triggers - one instance per remaining code,
  # except that the two entity-specific 404s and the generic body-reference 404 share a
  # single instance because the distinguishing claim IS that they differ from each other.
  - section: errors
    instances:
      - name: unresolvable_ids_return_the_entity_specific_not_found_code_not_a_generic_one
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SUBCONTRACT_NOT_FOUND
          - errors.ERR_CHANGE_EVENT_NOT_FOUND
          - errors.ERR_RESOURCE_NOT_FOUND
          - validations.priority_43
          - validations.priority_52
        distinguishing_aspect: |
          The catalog splits 404s three ways and the split is observable: a Subcontract id in a
          path yields ERR_SUBCONTRACT_NOT_FOUND, a ChangeEvent id in a path yields
          ERR_CHANGE_EVENT_NOT_FOUND, and any of the six entities without a dedicated code -
          here a GmpProposal id in a body - yields the generic ERR_RESOURCE_NOT_FOUND. An
          implementation that returns one code for all three passes no version of this claim.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
          trigger:
            - call: "GET /subcontracts/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: ConstructionManager
              captures: { e1: $.data.error_id }
            - call: "POST /subcontracts/11111111-1111-1111-1111-111111111111/progress-payment"
              payload: { payment_amount: 1000.00 }
              as: ConstructionManager
              captures: { e2: $.data.error_id }
            - call: "GET /change-events/22222222-2222-2222-2222-222222222222"
              payload: {}
              as: OwnerRepresentative
              captures: { e3: $.data.error_id }
            - call: "POST /change-events/22222222-2222-2222-2222-222222222222/submit"
              payload: {}
              as: ConstructionManager
              captures: { e4: $.data.error_id }
            - call: "POST /qualification-items"
              payload: { gmp_proposal_id: "33333333-3333-3333-3333-333333333333", item_type: "ASSUMPTION", text: "orphan assumption" }
              as: ConstructionManager
              captures: { e5: $.data.error_id }
          assert:
            - "trigger calls 1 and 2 both return 404 with data.error_id == ERR_SUBCONTRACT_NOT_FOUND"
            - "trigger calls 3 and 4 both return 404 with data.error_id == ERR_CHANGE_EVENT_NOT_FOUND"
            - "trigger call 5 returns 404 with data.error_id == ERR_RESOURCE_NOT_FOUND, the generic code, because GmpProposal has no dedicated 404"
            - "every one of the five responses carries response_type == error and a non-empty data.message"
            - "no row was created or modified: CmarProject.${proj}.version is unchanged from its value after the decide call"

      - name: a_second_base_proposal_after_execution_returns_gmp_already_executed
        claim_type: error_triggerable
        grounds:
          - errors.ERR_GMP_ALREADY_EXECUTED
          - validations.priority_61
          - state_machines.CmarProject.gmp_status
        distinguishing_aspect: |
          Once the guaranteed maximum price is executed the BASE path closes permanently: a fresh
          BASE proposal is refused with ERR_GMP_ALREADY_EXECUTED even when the payload is
          otherwise perfect and the project version is current, so the refusal cannot be confused
          with the stale-version check at priority 55. The only remaining way to move the price is
          an AMENDMENT minted by a SCOPE_CHANGE classification.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
