# Generated companion to SCAFFOLD.yaml -- SKILL.md 1.8 (Test Targeting Index).
# Every literal below was computed by executing the SCAFFOLD.yaml 1.3 formulas.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: recycled_content_nominal_versus_as_built_diverge
        grounds:
          - calculations.run_mass_balance
          - calculations.regrind_cap_evaluation
          - calculations.pool_mass_balance
          - entities.BlendRecipe.fields.nominal_recycled_content_pct
          - entities.ExtrusionRun.fields.actual_recycled_content_pct
          - concurrency_rules[regrind-reincorporation-stale-pool]
        distinguishing_aspect: |
          The NOMINAL variant reads recipe.regrind_pct (32.000) x product.assumed_regrind_pcr_pct
          (25.0) and lands on 26.000 %, while the AS_BUILT variant reads the mass actually drawn
          from POOL-NF (100.000 kg at the pool's measured embedded_pcr_pct of 50.000) against the
          real gross_output_kg (1000.0) and lands on 21.200 % -- a fixed 4.800-point divergence on
          identical entities, and only the as-built figure is admissible for a dossier claim.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T06:00:00Z, then advanced to 2026-08-05T15:00:00Z"
            - "non-food product P-NF-1 (assumed_regrind_pcr_pct 25.0, max_regrind_pct_nonfood 35.0) on line L-NF"
            - "APPROVED recipe R-NF-6 = 50 % LL-1001 + 50 % PC-7007 (100 % PCR grade), virgin_pcr_pct 50.000"
            - "RUN-NF-Y on R-NF-6 completed with gross 500.0 / scrap 100.0, seeding POOL-NF with 100.000 kg at 50.000 % embedded PCR"
            - "APPROVED recipe R-NF-3 = 50 % LL-1001 + 18 % PC-7007 + 32 % REGRIND (virgin_pcr_pct 18.000, cap 33.000)"
            - "RUN-NF-Z on R-NF-3 RUNNING with 5 gauge readings, target_output_kg 1000.0, pool version read into v_pool"
          setup_api_calls:
            - &a_clock_d1_0600 { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T06:00:00Z" }, as: PlantAdmin }
            - &a_p_nf { call: "POST /products", payload: { product_code: "P-NF-1", customer_code: "CUST-NF", bag_style: "GUSSETED", food_contact_required: false, target_gauge_micron: 40.0, gauge_tolerance_pct: 10.0, layflat_width_mm: 400.0, bag_length_mm: 600.0, gusset_depth_mm: 60.0, perforation_required: true, min_bottom_seal_n_per_15mm: 18.0, min_strength_index: 25.0, max_regrind_pct_food: 10.0, max_regrind_pct_nonfood: 35.0, declared_recycled_content_pct: 0.0, assumed_regrind_pcr_pct: 25.0, bags_per_case: 250, min_partial_case_bags: 100, cases_per_pallet: 30, count_accuracy_tolerance_pct: 3.0, required_layer_count: 1 }, as: PlantAdmin, captures: { p_nf: "$.data.id" } }
            - &a_g_ll { call: "POST /resin-grades", payload: { grade_code: "LL-1001", material_class: "VIRGIN_RESIN", polymer_family: "LLDPE", melt_index: 1.0, density_kg_m3: 918.0, food_contact_approved: true, pcr_content_pct: 0.0, cost_per_kg: 1.45, dart_impact_index: 42.0, haze_index: 8.0, cof_index: 0.42, seal_initiation_temp_c: 105.0, is_barrier: false }, as: PlantAdmin, captures: { g_ll: "$.data.id" } }
            - &a_line_nf { call: "POST /extrusion-lines", payload: { line_code: "L-NF", process_type: "BLOWN", max_layers: 3, min_gauge_micron: 20.0, max_gauge_micron: 120.0, max_layflat_mm: 900.0, purge_buffer_minutes: 45, food_contact_certified: false }, as: PlantAdmin, captures: { line_nf: "$.data.id" } }
            - &a_pool_nf { call: "POST /regrind-pools", payload: { pool_code: "POOL-NF", food_contact_status: "NON_FOOD_ONLY", polymer_family: "LLDPE" }, as: PlantAdmin, captures: { pool_nf: "$.data.id" } }
            - &a_g_pc { call: "POST /resin-grades", payload: { grade_code: "PC-7007", material_class: "VIRGIN_RESIN", polymer_family: "LLDPE", melt_index: 1.2, density_kg_m3: 920.0, food_contact_approved: false, pcr_content_pct: 100.0, cost_per_kg: 1.1, dart_impact_index: 30.0, haze_index: 30.0, cof_index: 0.55, seal_initiation_temp_c: 108.0, is_barrier: false }, as: PlantAdmin, captures: { g_pc: "$.data.id" } }
            - &a_r6_new { call: "POST /blend-recipes", payload: { recipe_code: "R-NF-6", product_id: "${p_nf}", process_type: "BLOWN", layer_count: 1 }, as: BlendEngineer, captures: { r6: "$.data.id" } }
            - &a_r6_c1 { call: "POST /blend-recipes/${r6}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 50.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r6_c2 { call: "POST /blend-recipes/${r6}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 50.0, resin_grade_id: "${g_pc}" }, as: BlendEngineer }
            - &a_r6_sub { call: "POST /blend-recipes/${r6}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-1" }
            - &a_r6_app { call: "POST /blend-recipes/${r6}/approve", payload: {}, as: QualityManager, as_user_id: "u-qm-1" }
            - &a_runY_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-Y", line_id: "${line_nf}", blend_recipe_id: "${r6}", scheduled_start: "2026-08-05T06:00:00Z", scheduled_end: "2026-08-05T14:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { runY: "$.data.id" } }
            - &a_runY_start { call: "POST /extrusion-runs/${runY}/start", payload: {}, as: ExtrusionOperator }
            - &a_gY_40 { call: "POST /extrusion-runs/${runY}/gauge-readings", payload: { thickness_micron: 40.0 }, as: ExtrusionOperator }
            - *a_gY_40
            - *a_gY_40
            - *a_gY_40
            - *a_gY_40
            - &a_runY_comp { call: "POST /extrusion-runs/${runY}/complete", payload: { gross_output_kg: 500.0, scrap_kg: 100.0 }, as: ExtrusionOperator }
            - &a_r3_new { call: "POST /blend-recipes", payload: { recipe_code: "R-NF-3", product_id: "${p_nf}", process_type: "BLOWN", layer_count: 1 }, as: BlendEngineer, captures: { r3: "$.data.id" } }
            - &a_r3_c1 { call: "POST /blend-recipes/${r3}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 50.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r3_c2 { call: "POST /blend-recipes/${r3}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 18.0, resin_grade_id: "${g_pc}" }, as: BlendEngineer }
            - &a_r3_c3 { call: "POST /blend-recipes/${r3}/components", payload: { layer_index: 1, component_kind: "REGRIND", weight_pct: 32.0 }, as: BlendEngineer }
            - &a_r3_sub { call: "POST /blend-recipes/${r3}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-1" }
            - &a_r3_app { call: "POST /blend-recipes/${r3}/approve", payload: {}, as: QualityManager, as_user_id: "u-qm-1" }
            - &a_clock_d1_1500 { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T15:00:00Z" }, as: PlantAdmin }
            - &a_runZ_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-Z", line_id: "${line_nf}", blend_recipe_id: "${r3}", scheduled_start: "2026-08-05T15:00:00Z", scheduled_end: "2026-08-05T20:00:00Z", target_output_kg: 1000.0 }, as: ExtrusionOperator, captures: { runZ: "$.data.id" } }
            - &a_runZ_start { call: "POST /extrusion-runs/${runZ}/start", payload: {}, as: ExtrusionOperator }
            - &a_gZ_40 { call: "POST /extrusion-runs/${runZ}/gauge-readings", payload: { thickness_micron: 40.0 }, as: ExtrusionOperator }
            - *a_gZ_40
            - *a_gZ_40
            - *a_gZ_40
            - *a_gZ_40
            - &a_get_pool_nf { call: "GET /regrind-pools/${pool_nf}", payload: {}, as: ExtrusionOperator, captures: { v_pool: "$.data.version" } }
          trigger:
            - { call: "POST /extrusion-runs/${runZ}/regrind-reincorporations", payload: { pool_id: "${pool_nf}", kg: 100.0, expected_regrind_pool_version: "${v_pool}" }, as: ExtrusionOperator, captures: { txn_z_out: "$.data.id" } }
            - { call: "POST /extrusion-runs/${runZ}/complete", payload: { gross_output_kg: 1000.0, scrap_kg: 60.0 }, as: ExtrusionOperator }
          assert:
            - "BlendRecipe.${r3}.nominal_recycled_content_pct == 26.000"
            - "ExtrusionRun.${runZ}.actual_recycled_content_pct == 21.200"
            - "BlendRecipe.${r3}.nominal_recycled_content_pct - ExtrusionRun.${runZ}.actual_recycled_content_pct == 4.800"
            - "ExtrusionRun.${runZ}.regrind_consumed_kg == 100.000"
            - "ExtrusionRun.${runZ}.regrind_actual_pct == 10.000"
            - "ExtrusionRun.${runZ}.pcr_mass_kg == 212.000"
            - "ExtrusionRun.${runZ}.net_good_kg == 940.000"
            - "ExtrusionRun.${runZ}.status == COMPLETED"
            - "RegrindTransaction.${txn_z_out}.direction == OUT and origin_kind == REINCORPORATION and kg == 100.000 and pcr_kg == 50.000"
            - "RegrindPool.${pool_nf}.cumulative_in_kg == 160.000"
            - "RegrindPool.${pool_nf}.cumulative_out_kg == 100.000"
            - "RegrindPool.${pool_nf}.cumulative_in_pcr_kg == 62.720"
            - "RegrindPool.${pool_nf}.available_kg == 60.000"
            - "RegrindPool.${pool_nf}.embedded_pcr_pct == 39.200"
            - "ExtrusionRun.${runY}.actual_recycled_content_pct == 50.000"
            - "BlendRecipe.${r6}.nominal_recycled_content_pct == 50.000 (the two variants coincide for R-NF-6 because it carries no regrind -- the divergence is a property of R-NF-3, not of the formula pair)"
      - name: seal_provisional_pass_versus_final_fail_forks_lot_to_failed
        grounds:
          - calculations.seal_strength_qualification
          - state_machines.BagLot.TESTING_to_FAILED
          - entities.BagLot.fields.seal_provisional_verdict
          - entities.BagLot.fields.seal_final_verdict
          - calculations.pool_mass_balance
        distinguishing_aspect: |
          The PROVISIONAL variant averages only the three first-pass specimens (25.0 / 23.0 / 18.0
          -> 22.00) and passes on the mean alone against the 22.0 N spec, while the FINAL variant
          builds the superseding panel (the retest 17.0 replaces the 18.0 first pass), reads
          min 17.00 against the 0.80 x spec conditional floor of 17.60 and returns FAIL -- so a
          PASS flips to FAIL on the same specimen log and the lot forks to the terminal FAILED
          branch that scraps all 46000 bags into POOL-FD.
        test_recipe:
          setup:
            - "food-contact product P-FD-1 (min_bottom_seal_n_per_15mm 22.0) fully converted into lot BL-1 (46000 bags)"
            - "BL-1 in TESTING with first-pass specimens 1=25.0, 2=23.0, 3=18.0 and a retest of specimen 3 at 17.0"
            - "POOL-FD already holds the 12.0 kg of extrusion scrap from RUN-FD-1 (generation_count 1)"
          setup_api_calls:
