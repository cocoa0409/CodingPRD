              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/substantiations"
              payload: { assessor_name: "Dr K Vance", assessment_basis: "PRODUCT_SPECIFIC" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "CLINICAL_SAFETY_STUDY", reviewer_credential: "BOARD_CERTIFIED_TOXICOLOGIST", citation: "HRIPT 2025-410" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "IN_VITRO_TOXICOLOGY", reviewer_credential: "ERT", citation: "OECD 492 report" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/submit"
