              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /marketplace/listings"
              payload: { seller_id: "${s_id}", address_line: "95 Cancel St", listing_state: "TX", asking_price_cents: 10000000, listing_kind: "SINGLE", certification_program_id: "${prog_id}", seller_asks_confidential: false }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_id: $.data.id }
            - call: "POST /marketplace/listings/${l_id}/inspection-reports"
              payload: { inspector_name: "I", inspection_date: "2026-08-01T00:00:00Z", overall_score: 80, roof_score: 80, systems_score: 80, disclosed_defects: [], title_grade: "A" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ir: $.data.id }
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/inspection-reports/${ir}/transition"
              payload: { action: "VERIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "SUBMIT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "CERTIFY" }
              as: CertificationReviewer
            - call: "POST /marketplace/listings/${l_id}/transition"
              payload: { action: "PUBLISH" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /marketplace/listings/${l_id}/guarantees"
              payload: { guarantee_kind: "VACANCY", coverage_months: 3 }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
              captures: { l_v: $.data.version }
            - call: "POST /marketplace/listings/${l_id}/offers"
              payload: { buyer_id: "${b1}", amount_cents: 10000000, earnest_money_cents: 50000, financing_type: "CASH", expected_listing_version: "${l_v}" }
              as: Buyer
              as_user_id: "${b1}"
              captures: { off1: $.data.id }
            - call: "POST /marketplace/offers/${off1}/transition"
              payload: { action: "SUBMIT" }
              as: Buyer
              as_user_id: "${b1}"
            - call: "POST /marketplace/offers/${off1}/transition"
              payload: { action: "ACCEPT" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /marketplace/offers/${off1}/escrow"
              as: Buyer
              as_user_id: "${b1}"
              captures: { esc: $.data.0.id }
          trigger:
            - call: "POST /marketplace/escrows/${esc}/transition"
              payload: { action: "CANCEL" }
              as: EscrowOfficer
            - call: "GET /marketplace/listings/${l_id}"
              as: Seller
              as_user_id: "${s_id}"
