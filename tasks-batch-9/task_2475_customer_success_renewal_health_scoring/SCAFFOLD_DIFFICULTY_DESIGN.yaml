            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "SPONSOR_LOSS", play_type: "EXEC_ALIGNMENT", window_start_date: "2026-08-05", window_end_date: "2026-09-05" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /escalation-cases"
              payload: { account_id: "${acct_id}", save_play_id: "${sp_id}", severity: "MEDIUM", summary: "Sponsor transition risk" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { esc_id: $.data.id, esc_v: $.data.version }
            - call: "POST /escalation-cases/${esc_id}/remediation-commitments"
              payload: { description: "Named replacement sponsor within 30 days", due_date: "2026-09-30", credit_cents: 500000, expected_escalation_case_version: "${esc_v}" }
              as: CsExecutive
              as_user_id: "exec-1"
