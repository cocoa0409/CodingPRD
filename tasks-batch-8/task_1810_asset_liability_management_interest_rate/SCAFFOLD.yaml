# =============================================================================
# Task 1810: Asset-Liability Management & Interest Rate Risk (bank ALCO)
# Scaffold seed tables — §1.0–§1.7
# =============================================================================

scenario: |
  1810. Asset-Liability Management & Interest Rate Risk (bank ALCO): cash flow
  modeling with prepayment & deposit decay assumptions, rate shock/ramp scenario
  simulation, net interest income & economic value of equity limits, deposit beta
  assumption governance, hedging strategy & derivative designation, ALCO reporting
  & policy limit breach, backtesting of assumptions, regulatory expectation
  alignment

domain_name: bank-alm-irr
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AlmBook
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Book display name" }
      - { name: base_curve_rate_bps, type: integer, source: input, description: "Flat base yield curve level in basis points (e.g. 400 = 4.00%)" }
      - { name: min_hedged_notional_cents, type: integer, source: input, default: 0, description: "Policy floor for total hedged notional; a decrease event below this floor opens a HEDGE_COVERAGE LimitBreach" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE" }
      - { name: total_assets_cents, type: integer, source: computed, description: "Sum of balance_cents over positions with status ACTIVE and category IN {LOAN, SECURITY}" }
      - { name: total_liabilities_cents, type: integer, source: computed, description: "Sum of balance_cents over positions with status ACTIVE and category IN {DEPOSIT, BORROWING}" }
      - { name: hedged_notional_cents, type: integer, source: computed, description: "Sum of notional_cents over HedgeRelationship with status IN {DESIGNATED, ACTIVE} on positions of this book" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: book_id, type: string, source: input, description: "FK -> AlmBook.id" }
      - { name: category, type: enum, source: input, description: "LOAN | SECURITY | DEPOSIT | BORROWING" }
      - { name: deposit_segment, type: enum, source: input, description: "RETAIL_NONMATURITY | BUSINESS_NONMATURITY | TIME; required iff category=DEPOSIT" , default: null }
      - { name: balance_cents, type: integer, source: input, description: "Current principal balance (> 0)" }
      - { name: rate_bps, type: integer, source: input, description: "Contractual coupon (assets) or paid rate (liabilities), bps, >= 0" }
      - { name: scheduled_runoff_pct, type: number, source: input, description: "Contractual annual principal runoff fraction, percent 0..100" }
      - { name: is_prepayment_eligible, type: boolean, source: input, default: false, description: "Loans only: subject to prepayment assumption set" }
      - { name: duration_years, type: number, source: input, description: "Effective duration used by EVE approximation, >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: AssumptionSet
    parent: null
    common_fields: true
    fields:
      - { name: book_id, type: string, source: input, description: "FK -> AlmBook.id" }
      - { name: domain, type: enum, source: input, description: "PREPAYMENT | DEPOSIT_DECAY | DEPOSIT_BETA; immutable after create" }
      - { name: params, type: object, source: input, description: "Domain-keyed parameter object. PREPAYMENT: {base_cpr_pct, prepay_sensitivity_per_100bps}. DEPOSIT_DECAY: {base_annual_decay_pct, surge_decay_per_100bps}. DEPOSIT_BETA: {up_beta_pct, down_beta_pct, lag_months}" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | SUPERSEDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (segregation of duties anchor)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approver" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Logical clock timestamp of approval" }
      - { name: governance_flag, type: enum, source: system, default: "NONE", description: "NONE | REVIEW_REQUIRED; set by backtest BREACH, cleared when no OPEN BacktestReview remains" }

  - name: RateScenario
    parent: null
    common_fields: true
    fields:
      - { name: book_id, type: string, source: input, description: "FK -> AlmBook.id" }
      - { name: name, type: string, source: input, description: "Scenario display name" }
      - { name: kind, type: enum, source: input, description: "PARALLEL_SHOCK | RAMP | REGULATORY_PRESET" }
      - { name: shock_bps, type: integer, source: input, default: null, description: "Instantaneous parallel shift, bps; required iff kind=PARALLEL_SHOCK" }
      - { name: ramp_total_bps, type: integer, source: input, default: null, description: "Terminal shift reached linearly; required iff kind=RAMP" }
      - { name: ramp_months, type: integer, source: input, default: null, description: "Ramp duration in months, > 0; required iff kind=RAMP" }
      - { name: preset_code, type: enum, source: input, default: null, description: "REG_UP_400 | REG_UP_300 | REG_UP_200 | REG_DOWN_200 | REG_DOWN_300 | REG_DOWN_400; required iff kind=REGULATORY_PRESET" }
      - { name: horizon_months, type: integer, source: input, default: 12, description: "NII projection horizon; 12 or 24" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED" }

  - name: SimulationRun
    parent: null
    common_fields: true
    fields:
      - { name: book_id, type: string, source: input, description: "FK -> AlmBook.id" }
      - { name: scenario_id, type: string, source: input, description: "FK -> RateScenario.id" }
      - { name: prepayment_set_id, type: string, source: input, description: "FK -> AssumptionSet.id; domain PREPAYMENT, must be APPROVED" }
      - { name: decay_set_id, type: string, source: input, description: "FK -> AssumptionSet.id; domain DEPOSIT_DECAY, must be APPROVED" }
      - { name: beta_set_id, type: string, source: input, description: "FK -> AssumptionSet.id; domain DEPOSIT_BETA, must be APPROVED" }
      - { name: balance_sheet_convention, type: enum, source: input, description: "STATIC | DYNAMIC" }
      - { name: annual_growth_pct, type: number, source: input, default: null, description: "Balance growth applied in DYNAMIC convention; required iff DYNAMIC" }
      - { name: book_version_pinned, type: integer, source: system, description: "AlmBook.version at creation (OCC-pinned snapshot)" }
      - { name: status, type: enum, source: system, description: "COMPLETED | PUBLISHED" }
      - { name: period_month, type: string, source: system, description: "YYYY-MM of logical clock at creation" }
      - { name: nii_base_cents, type: integer, source: computed, description: "NII at delta=0 under same convention" }
      - { name: nii_scenario_cents, type: integer, source: computed, description: "NII under scenario" }
      - { name: nii_delta_pct, type: number, source: computed, description: "(scenario-base)/base*100, 2dp round_half_up; 0.00 if base==0" }
      - { name: eve_base_cents, type: integer, source: computed, description: "total_assets - total_liabilities" }
      - { name: eve_scenario_cents, type: integer, source: computed, description: "EVE under terminal scenario shock" }
      - { name: eve_delta_pct, type: number, source: computed, description: "2dp round_half_up; 0.00 if eve_base<=0" }
      - { name: breach_summary, type: enum, source: computed, description: "NONE | NII | EVE | BOTH" }
      - { name: assumption_stale, type: boolean, source: computed, description: "true when any pinned set is no longer APPROVED (superseded after run)" }

  - name: PolicyLimit
    parent: null
    common_fields: true
    fields:
      - { name: book_id, type: string, source: input, description: "FK -> AlmBook.id" }
      - { name: metric, type: enum, source: input, description: "NII_DELTA_PCT | EVE_DELTA_PCT" }
      - { name: applies_to_kinds, type: array, source: input, description: "List of scenario kinds, or the single string ALL" }
      - { name: threshold_pct, type: number, source: input, description: "Decline tolerance percent, > 0; breach iff delta_pct < -threshold_pct" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: LimitBreach
    parent: null
    common_fields: true
    fields:
      - { name: book_id, type: string, source: system, description: "FK -> AlmBook.id" }
      - { name: run_id, type: string, source: system, default: null, description: "FK -> SimulationRun.id; null for HEDGE_COVERAGE breaches" }
      - { name: limit_id, type: string, source: system, default: null, description: "FK -> PolicyLimit.id; null for HEDGE_COVERAGE breaches" }
      - { name: metric, type: enum, source: system, description: "NII_DELTA_PCT | EVE_DELTA_PCT | HEDGE_COVERAGE" }
      - { name: observed_delta_pct, type: number, source: system, default: null, description: "Observed run delta for NII/EVE breaches" }
      - { name: threshold_pct, type: number, source: system, default: null, description: "Limit threshold at breach time" }
      - { name: period_month, type: string, source: system, description: "YYYY-MM of logical clock at creation" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | REMEDIATION_PLANNED | ESCALATED | CLOSED" }
      - { name: remediation_note, type: string, source: input, default: null, description: "Set by remediation-plan" }
      - { name: due_date, type: datetime, source: input, default: null, description: "Remediation due timestamp (ISO8601)" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Set by close" }

  - name: HedgeRelationship
    parent: null
    common_fields: true
    fields:
      - { name: book_id, type: string, source: system, description: "FK -> AlmBook.id" }
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; hedged item" }
      - { name: instrument, type: enum, source: input, description: "PAYER_SWAP | RECEIVER_SWAP | CAP | FLOOR" }
      - { name: designation_type, type: enum, source: input, description: "FAIR_VALUE | CASH_FLOW" }
      - { name: notional_cents, type: integer, source: input, description: "Derivative notional, > 0" }
      - { name: fixed_rate_bps, type: integer, source: input, description: "Swap fixed leg rate, bps >= 0" }
      - { name: start_month, type: string, source: input, default: null, description: "Designation window start YYYY-MM, set at designate" }
      - { name: end_month, type: string, source: input, default: null, description: "Designation window end YYYY-MM exclusive, set at designate" }
      - { name: effectiveness_method, type: enum, source: input, default: null, description: "DOLLAR_OFFSET | REGRESSION; pinned at designate, immutable" }
      - { name: status, type: enum, source: system, description: "PROPOSED | DESIGNATED | ACTIVE | DEDESIGNATED | TERMINATED" }

  - name: HedgeEffectivenessTest
    parent: null
    common_fields: false
    fields:
      - { name: hedge_id, type: string, source: system, description: "FK -> HedgeRelationship.id" }
      - { name: test_month, type: string, source: input, description: "YYYY-MM the test applies to" }
      - { name: method, type: enum, source: system, description: "Snapshot of hedge.effectiveness_method at test time" }
      - { name: hedge_value_change_cents, type: integer, source: input, description: "Period change in derivative fair value (signed)" }
      - { name: hedged_item_value_change_cents, type: integer, source: input, description: "Period change in hedged item fair value (signed)" }
      - { name: slope, type: number, source: input, default: null, description: "REGRESSION input: regression slope" }
      - { name: r_squared, type: number, source: input, default: null, description: "REGRESSION input: R-squared 0..1" }
      - { name: sample_count, type: integer, source: input, default: null, description: "REGRESSION input: observation count" }
      - { name: offset_ratio, type: number, source: computed, default: null, description: "DOLLAR_OFFSET: -(hedge_change/hedged_change), 4dp round_half_up" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL" }

  - name: BacktestReview
    parent: null
    common_fields: true
    fields:
      - { name: book_id, type: string, source: system, description: "FK -> AlmBook.id" }
      - { name: assumption_set_id, type: string, source: input, description: "FK -> AssumptionSet.id; set under review" }
      - { name: domain, type: enum, source: system, description: "Snapshot of set domain" }
      - { name: start_month, type: string, source: input, description: "Observation window start YYYY-MM" }
      - { name: observation_months, type: integer, source: input, description: "Window length in months, > 0" }
      - { name: observed_value_pct, type: number, source: input, description: "Realized value over window: CPR pct | annual decay pct | realized up-beta pct" }
      - { name: predicted_value_pct, type: number, source: computed, description: "PREPAYMENT: base_cpr_pct; DEPOSIT_DECAY: base_annual_decay_pct; DEPOSIT_BETA: up_beta_pct" }
      - { name: deviation_pct, type: number, source: computed, description: "abs(observed - predicted), 2dp round_half_up" }
      - { name: outcome, type: enum, source: computed, description: "WITHIN_TOLERANCE | BREACH (BREACH iff deviation > tolerance, strict)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_ACCEPTED | CLOSED_REVISED" }

  - name: AlcoReport
    parent: null
    common_fields: true
    fields:
      - { name: book_id, type: string, source: system, description: "FK -> AlmBook.id" }
      - { name: period_month, type: string, source: input, description: "YYYY-MM reporting period" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED" }
      - { name: run_count, type: integer, source: computed, description: "PUBLISHED runs in period" }
      - { name: worst_nii_delta_pct, type: number, source: computed, default: null, description: "Minimum nii_delta_pct over PUBLISHED period runs; null if none" }
      - { name: worst_eve_delta_pct, type: number, source: computed, default: null, description: "Minimum eve_delta_pct over PUBLISHED period runs; null if none" }
      - { name: open_breach_count, type: integer, source: computed, description: "LimitBreach of this book+period with status != CLOSED" }
      - { name: regulatory_coverage_complete, type: boolean, source: computed, description: "true iff each of the six preset_code values has >= 1 PUBLISHED run in period" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of submitter" }
      - { name: acknowledged_by_user_id, type: string, source: system, default: null, description: "X-User-ID of acknowledger" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AlmBook
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /books/{id}/activate"
        actor: TreasuryAnalyst
        preconditions:
          - ">= 1 ACTIVE Position with category IN {LOAN, SECURITY} (else ERR_BOOK_ACTIVATION_INCOMPLETE)"
          - ">= 1 ACTIVE Position with category IN {DEPOSIT, BORROWING} (else ERR_BOOK_ACTIVATION_INCOMPLETE)"
        side_effects:
          - "increments AlmBook.version by 1"

  - entity: Position
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /positions/{id}/retire"
        actor: TreasuryAnalyst
        preconditions:
          - "No HedgeRelationship with status IN {PROPOSED, DESIGNATED, ACTIVE} references this position (else ERR_POSITION_HAS_ACTIVE_HEDGE)"
        side_effects:
          - "Recompute book total_assets_cents / total_liabilities_cents (position excluded)"
          - "increments AlmBook.version by 1"

  - entity: AssumptionSet
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /assumption-sets/{id}/submit"
        actor: TreasuryAnalyst
        preconditions:
          - "params keys exactly match the set's domain schema (else ERR_ASSUMPTION_PARAMS_MISMATCH)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /assumption-sets/{id}/approve"
        actor: ALCOChair
        preconditions:
          - "approver X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Any other APPROVED AssumptionSet with same (book_id, domain) -> SUPERSEDED"
          - "Every SimulationRun pinning a newly SUPERSEDED set gets assumption_stale = true"
          - "approved_by_user_id = X-User-ID; approved_at = logical clock"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /assumption-sets/{id}/reject"
        actor: ALCOChair
        preconditions: []
        side_effects:
          - "Set returns to DRAFT for revision (cycle DRAFT->SUBMITTED->DRAFT is allowed repeatedly)"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (another set in same (book_id, domain) is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Every SimulationRun pinning this set gets assumption_stale = true"

  - entity: RateScenario
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /scenarios/{id}/archive"
        actor: TreasuryAnalyst
        preconditions: []
        side_effects:
          - "New SimulationRun creation referencing this scenario is rejected (ERR_SCENARIO_NOT_ACTIVE)"

  - entity: SimulationRun
    initial_state: COMPLETED
    terminal_states: []
    transitions:
      - from: COMPLETED
        to: PUBLISHED
        trigger: "POST /simulation-runs/{id}/publish"
        actor: TreasuryAnalyst
        preconditions: []
        side_effects:
          - "Upsert AlcoReport for (book_id, period_month): create DRAFT if absent; recompute run_count, worst deltas, regulatory_coverage_complete"
          - "If that report was SUBMITTED, it auto-reverts to DRAFT"

  - entity: PolicyLimit
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /policy-limits/{id} with status=SUSPENDED"
        actor: ALCOChair
        preconditions: []
        side_effects:
          - "Limit excluded from subsequent run breach evaluation"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /policy-limits/{id} with status=ACTIVE"
        actor: ALCOChair
        preconditions:
          - "No other ACTIVE limit with same (book_id, metric, applies_to_kinds) (else ERR_LIMIT_SCOPE_CONFLICT)"
        side_effects: []

  - entity: LimitBreach
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /breaches/{id}/acknowledge"
        actor: ALCOChair
        preconditions: []
        side_effects:
          - "Recompute open_breach_count on period AlcoReport"
      - from: ACKNOWLEDGED
        to: REMEDIATION_PLANNED
        trigger: "POST /breaches/{id}/remediation-plan"
        actor: ALCOChair
        preconditions:
          - "remediation_note non-empty and due_date present (else ERR_INVALID_REQUEST)"
        side_effects: []
      - from: REMEDIATION_PLANNED
        to: CLOSED
        trigger: "POST /breaches/{id}/close"
        actor: ALCOChair
        preconditions:
          - "resolution_note non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Recompute open_breach_count on period AlcoReport"
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "POST /breaches/{id}/close"
        actor: ALCOChair
        preconditions:
          - "resolution_note non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Recompute open_breach_count on period AlcoReport"
      - from: OPEN
        to: ESCALATED
        trigger: "system (POST /_clock/set_current_utc sweep: current_utc >= created_at + 5 days and still OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REMEDIATION_PLANNED
        to: ESCALATED
        trigger: "system (POST /_clock/set_current_utc sweep: current_utc > due_date and not CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /breaches/{id}/acknowledge"
        actor: ALCOChair
        preconditions: []
        side_effects:
          - "Recompute open_breach_count on period AlcoReport"

  - entity: HedgeRelationship
    initial_state: PROPOSED
    terminal_states: [DEDESIGNATED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: DESIGNATED
        trigger: "POST /hedges/{id}/designate"
        actor: ALCOChair
        preconditions:
          - "Referenced Position has status ACTIVE (else ERR_POSITION_RETIRED)"
          - "start_month >= current logical month (else ERR_DESIGNATION_WINDOW_PAST); end_month > start_month (else ERR_INVALID_REQUEST)"
          - "Window [start_month, end_month) half-open must not overlap any other DESIGNATED/ACTIVE hedge on the same position (else ERR_HEDGE_WINDOW_OVERLAP); adjacency is allowed"
          - "notional_cents <= position.balance_cents (else ERR_HEDGE_NOTIONAL_EXCEEDS_EXPOSURE)"
        side_effects:
          - "effectiveness_method pinned on the hedge"
          - "Recompute book hedged_notional_cents (DESIGNATED now counts)"
      - from: DESIGNATED
        to: ACTIVE
        trigger: "POST /hedges/{id}/activate"
        actor: ALCOChair
        preconditions:
          - "current logical month >= start_month (else ERR_HEDGE_NOT_ACTIVATABLE)"
        side_effects: []
      - from: ACTIVE
        to: DEDESIGNATED
        trigger: "POST /hedges/{id}/dedesignate OR system (HedgeEffectivenessTest result FAIL)"
        actor: ALCOChair | system
        preconditions: []
        side_effects:
          - "Recompute book hedged_notional_cents (decrease)"
          - "If hedged_notional_cents < book.min_hedged_notional_cents after the decrease: create LimitBreach metric=HEDGE_COVERAGE, status OPEN, run_id=null, limit_id=null"
      - from: DESIGNATED
        to: DEDESIGNATED
        trigger: "POST /hedges/{id}/dedesignate"
        actor: ALCOChair
        preconditions: []
        side_effects:
          - "Recompute book hedged_notional_cents (decrease) and run the same min_hedged_notional floor check"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /hedges/{id}/terminate"
        actor: ALCOChair
        preconditions: []
        side_effects:
          - "Recompute book hedged_notional_cents (decrease) and run the same min_hedged_notional floor check"

  - entity: HedgeEffectivenessTest
    initial_state: null
    terminal_states: []
    note: "Append-only event; no state machine. Creation on an ACTIVE hedge computes result; result FAIL drives HedgeRelationship ACTIVE -> DEDESIGNATED."

  - entity: BacktestReview
    initial_state: OPEN
    terminal_states: [CLOSED_ACCEPTED, CLOSED_REVISED]
    transitions:
      - from: OPEN
        to: CLOSED_ACCEPTED
        trigger: "POST /backtests/{id}/close with outcome=CLOSED_ACCEPTED"
        actor: ALCOChair
        preconditions: []
        side_effects:
          - "If no other OPEN BacktestReview references the same assumption_set_id: set governance_flag = NONE"
      - from: OPEN
        to: CLOSED_REVISED
        trigger: "POST /backtests/{id}/close with outcome=CLOSED_REVISED"
        actor: ALCOChair
        preconditions:
          - "Another AssumptionSet with same (book_id, domain) is APPROVED with created_at later than the reviewed set's created_at (else ERR_BACKTEST_CLOSURE_REQUIRES_REVISION)"
        side_effects:
          - "If no other OPEN BacktestReview references the same assumption_set_id: set governance_flag = NONE"

  - entity: AlcoReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /alco-reports/{id}/submit"
        actor: TreasuryAnalyst
        preconditions:
          - "regulatory_coverage_complete == true (else ERR_REGULATORY_COVERAGE_INCOMPLETE)"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /alco-reports/{id}/acknowledge"
        actor: ALCOChair
        preconditions:
          - "open_breach_count == 0 (else ERR_OPEN_BREACHES_REMAIN)"
          - "acknowledger X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "acknowledged_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: DRAFT
        trigger: "system (a run in this period is published, or a LimitBreach is created in this period, while report is SUBMITTED)"
        actor: system
        preconditions: []
        side_effects:
          - "submitted_by_user_id reset to null; aggregates recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-book
    parent_entity: AlmBook
    write_endpoint: "POST /books/{id}/simulation-runs"
    occ_field: "expected_book_version"
    description: |
      Creating a SimulationRun against an AlmBook whose version has advanced
      since the client last observed it is rejected: the client would be
      modeling a position set that has since changed (a position create, patch,
      or retire bumps AlmBook.version). The client must re-read the book and
      resubmit with the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: position-patch-stale-book
    parent_entity: AlmBook
    write_endpoint: "PATCH /positions/{id}"
    occ_field: "expected_book_version"
    description: |
      Patching a Position while carrying an AlmBook version the client observed
      earlier is rejected when the book version has since advanced, because the
      edit would be computed against a stale view of the book's aggregate
      balances. The client must re-read the book and retry.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: scenario_year1_rate_delta
    trigger: "SimulationRun creation"
    algorithm: aggregation
    formula: |
      PARALLEL_SHOCK / REGULATORY_PRESET: delta_y1_bps = effective_shock_bps
        where REGULATORY_PRESET maps preset_code -> shock: REG_UP_400=+400,
        REG_UP_300=+300, REG_UP_200=+200, REG_DOWN_200=-200, REG_DOWN_300=-300,
        REG_DOWN_400=-400.
      RAMP: linear from 0 to ramp_total_bps over ramp_months; average over the
        first 12 months is pinned as:
          ramp_months <= 12: delta_y1_bps = ramp_total_bps * (12 - ramp_months/2) / 12
          ramp_months >  12: delta_y1_bps = ramp_total_bps * 6 / ramp_months
      EVE always uses the terminal shock instead: effective_shock_bps for
      PARALLEL_SHOCK/REGULATORY_PRESET, ramp_total_bps for RAMP.
    input_set: "the run's RateScenario"
    precision: "delta_y1_bps may be fractional for RAMP; used unrounded in downstream formulas"

  - name: effective_cpr_pct
    trigger: "nii_projection per eligible loan"
    algorithm: threshold
    formula: |
      effective_cpr_pct = clamp(base_cpr_pct
        + prepay_sensitivity_per_100bps * max(0, -delta_y1_bps) / 100, 0, 100)
      Rates falling (delta < 0) speed prepayments up; rising rates do not slow
      them below base_cpr_pct.
    input_set: "run's pinned PREPAYMENT AssumptionSet params; scenario delta_y1_bps"
    precision: "percent, used unrounded"

  - name: effective_deposit_rate_bps
    trigger: "nii_projection per non-maturity deposit"
    algorithm: constraint_propagation
    formula: |
      Applies only to DEPOSIT positions with deposit_segment IN
      {RETAIL_NONMATURITY, BUSINESS_NONMATURITY} (TIME deposits reprice via
      scheduled runoff like borrowings).
      beta_pct = up_beta_pct if delta_y1_bps > 0 else down_beta_pct
      pass_through = 1.0 for PARALLEL_SHOCK / REGULATORY_PRESET;
                     max(0, 12 - lag_months) / 12 for RAMP
      new_rate_bps = max(0, position.rate_bps + beta_pct/100 * delta_y1_bps * pass_through)
    input_set: "run's pinned DEPOSIT_BETA AssumptionSet params; position; scenario kind and delta_y1_bps"
    precision: "bps, used unrounded"

  - name: effective_annual_decay_pct
    trigger: "nii_projection DYNAMIC variant per non-maturity deposit"
    algorithm: decay_function
    formula: |
      effective_annual_decay_pct = clamp(base_annual_decay_pct
        + surge_decay_per_100bps * max(0, delta_y1_bps) / 100, 0, 100)
      Rising rates accelerate non-maturity deposit runoff; falling rates leave
      base decay.
    input_set: "run's pinned DEPOSIT_DECAY AssumptionSet params; scenario delta_y1_bps"
    precision: "percent, used unrounded"

  - name: nii_projection
    trigger: "SimulationRun creation (computed twice: delta=0 for base, scenario delta for shocked)"
    algorithm: aggregation
    formula: |
      ROUNDING ORDER IS PINNED: interest/expense is rounded to integer cents
      (round_half_up) PER POSITION first, then summed. Never sum unrounded
      values and round once.
      For each Position with status ACTIVE in the book:
        ASSET (LOAN | SECURITY):
          runoff_pct = scheduled_runoff_pct
                       + (effective_cpr_pct if category=LOAN and is_prepayment_eligible else 0)
          new_money_bps = max(0, book.base_curve_rate_bps + delta_y1_bps)
          blended_rate_bps = (1 - runoff_pct/100) * rate_bps + (runoff_pct/100) * new_money_bps
          balance_used = balance_cents            (STATIC)
                       = balance_cents * (1 + annual_growth_pct/100)   (DYNAMIC)
          interest_cents = round_half_up(balance_used * blended_rate_bps / 10000)
        DEPOSIT with segment IN {RETAIL_NONMATURITY, BUSINESS_NONMATURITY}:
          rate_used = effective_deposit_rate_bps
          balance_used = balance_cents            (STATIC)
                       = balance_cents * (1 - effective_annual_decay_pct/100)
                         * (1 + annual_growth_pct/100)                 (DYNAMIC; decay first, then growth)
          expense_cents = round_half_up(balance_used * rate_used / 10000)
        DEPOSIT with segment=TIME, and BORROWING:
          blended_rate_bps = (1 - scheduled_runoff_pct/100) * rate_bps
                             + (scheduled_runoff_pct/100) * max(0, base_curve_rate_bps + delta_y1_bps)
          balance_used = balance_cents (STATIC) or balance_cents * (1 + annual_growth_pct/100) (DYNAMIC)
          expense_cents = round_half_up(balance_used * blended_rate_bps / 10000)
      nii_cents = sum(interest_cents) - sum(expense_cents)
      nii_delta_pct = round_half_up_2dp((nii_scenario - nii_base) / nii_base * 100);
                      if nii_base_cents == 0 then nii_delta_pct = 0.00
    input_set: "Positions of the book with status ACTIVE; pinned assumption sets; scenario; convention"
    precision: "integer cents per position (round_half_up), delta pct 2dp round_half_up"
    variants:
      - name: STATIC
        when: "run created with balance_sheet_convention=STATIC"
        difference: "Balances held constant; runoff reprices at new-money rate within the year"
      - name: DYNAMIC
        when: "run created with balance_sheet_convention=DYNAMIC (annual_growth_pct required)"
        difference: "Asset/borrowing balances grow by annual_growth_pct; non-maturity deposits shrink by effective_annual_decay_pct then grow by annual_growth_pct; identical inputs therefore produce different nii_cents than STATIC"

  - name: eve_duration_approximation
    trigger: "SimulationRun creation"
    algorithm: weighted_scoring
    formula: |
      TA = total_assets_cents; TL = total_liabilities_cents (ACTIVE positions only)
      DA = sum(balance_cents * duration_years over ACTIVE LOAN/SECURITY) / TA
      DL = sum(balance_cents * duration_years over ACTIVE DEPOSIT/BORROWING) / TL
      eve_base_cents = TA - TL
      shock_bps = terminal scenario shock (see scenario_year1_rate_delta)
      eve_scenario_cents = round_half_up(eve_base_cents - (DA*TA - DL*TL) * shock_bps / 10000)
      eve_delta_pct = round_half_up_2dp((eve_scenario - eve_base) / eve_base * 100);
                      if eve_base_cents <= 0 then eve_delta_pct = 0.00
    input_set: "Positions of the book with status ACTIVE; scenario terminal shock"
    precision: "integer cents round_half_up; pct 2dp round_half_up"

  - name: policy_limit_evaluation
    trigger: "SimulationRun creation completes (after NII/EVE computed)"
    algorithm: threshold
    formula: |
      For each PolicyLimit of the book with status ACTIVE whose applies_to_kinds
      is ALL or contains the run's scenario kind:
        NII_DELTA_PCT: breach iff nii_delta_pct < -threshold_pct   (strict <)
        EVE_DELTA_PCT: breach iff eve_delta_pct < -threshold_pct   (strict <)
      Exactly at the threshold (delta_pct == -threshold_pct) is NOT a breach.
      Each breached limit creates one LimitBreach (status OPEN, period_month =
      current logical month). breach_summary on the run = NONE | NII | EVE | BOTH.
    input_set: "ACTIVE PolicyLimit rows of the book; run outputs"
    precision: "comparison on the rounded 2dp delta values"

  - name: hedge_effectiveness_result
    trigger: "POST /hedges/{id}/effectiveness-tests"
    algorithm: threshold
    formula: |
      method is pinned on the hedge at designation time.
      DOLLAR_OFFSET:
        if hedged_item_value_change_cents == 0: result = FAIL
        offset_ratio = round_half_up_4dp(-(hedge_value_change_cents / hedged_item_value_change_cents))
        PASS iff 0.8000 <= offset_ratio <= 1.2500 (inclusive both ends)
      REGRESSION:
        PASS iff r_squared >= 0.80 AND 0.80 <= slope <= 1.25 AND sample_count >= 12
      result FAIL drives the hedge ACTIVE -> DEDESIGNATED (see state machine).
    input_set: "the test payload; hedge.effectiveness_method"
    precision: "offset_ratio 4dp round_half_up"
    variants:
      - name: DOLLAR_OFFSET
        when: "hedge designated with effectiveness_method=DOLLAR_OFFSET"
        difference: "Uses only the two value-change inputs; slope/r_squared/sample_count ignored"
      - name: REGRESSION
        when: "hedge designated with effectiveness_method=REGRESSION"
        difference: "Uses slope/r_squared/sample_count; the value-change inputs are ignored; the same payload can therefore PASS under one method and FAIL under the other"

  - name: backtest_deviation
    trigger: "POST /books/{id}/backtests"
    algorithm: threshold
    formula: |
      predicted_value_pct = PREPAYMENT: params.base_cpr_pct
                            DEPOSIT_DECAY: params.base_annual_decay_pct
                            DEPOSIT_BETA: params.up_beta_pct
      deviation_pct = round_half_up_2dp(abs(observed_value_pct - predicted_value_pct))
      tolerance_pct (constants below, per domain)
      outcome = BREACH iff deviation_pct > tolerance_pct (strict >; equality is WITHIN_TOLERANCE)
      On BREACH: assumption_set.governance_flag = REVIEW_REQUIRED; while any
      BacktestReview with outcome BREACH is OPEN for a set, SimulationRun
      creation pinning that set is rejected (ERR_ASSUMPTION_UNDER_REVIEW).
    input_set: "the reviewed AssumptionSet (any status); observed_value_pct"
    constants:
      PREPAYMENT_TOLERANCE_PCT: 3.0
      DEPOSIT_DECAY_TOLERANCE_PCT: 2.0
      DEPOSIT_BETA_TOLERANCE_PCT: 10.0
    precision: "pct 2dp round_half_up"

  - name: hedge_coverage_floor_check
    trigger: "any decrease of book.hedged_notional_cents (dedesignate, terminate, or FAIL-driven dedesignation)"
    algorithm: threshold
    formula: |
      After recomputing hedged_notional_cents:
        if hedged_notional_cents < book.min_hedged_notional_cents:
          create LimitBreach(metric=HEDGE_COVERAGE, status OPEN,
                             period_month=current logical month,
                             run_id=null, limit_id=null)
      Increases never trigger the check.
    input_set: "book hedges with status IN {DESIGNATED, ACTIVE}; book.min_hedged_notional_cents"

  - name: alco_report_aggregates
    trigger: "run publish; breach create/acknowledge/close; report create"
    algorithm: aggregation
    formula: |
      For the report of (book_id, period_month):
        run_count = count of PUBLISHED SimulationRun with same book+period
        worst_nii_delta_pct = min(nii_delta_pct) over those runs (null if none)
        worst_eve_delta_pct = min(eve_delta_pct) over those runs (null if none)
        open_breach_count = count of LimitBreach same book+period with status != CLOSED
        regulatory_coverage_complete = true iff for each of the six preset_code
          values there exists >= 1 PUBLISHED run in the period whose scenario has
          that preset_code
      A publish or breach creation that changes these values while the report is
      SUBMITTED auto-reverts the report to DRAFT.
    input_set: "runs and breaches of the book+period"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: business_constraint
    check: "Body shape: required fields present, enums valid, ranges valid (balance_cents>0, rate_bps>=0, pcts 0..100, observation_months>0); kind-required fields (shock_bps / ramp pair / preset_code) present for scenario kind; annual_growth_pct present iff DYNAMIC; deposit_segment present iff category=DEPOSIT (else ERR_DEPOSIT_SEGMENT_REQUIRED); params keys match assumption domain (else ERR_ASSUMPTION_PARAMS_MISMATCH); observed_value_pct within [0,100] (else ERR_OBSERVED_VALUE_INVALID)"
    error_id: "ERR_INVALID_REQUEST | ERR_DEPOSIT_SEGMENT_REQUIRED | ERR_ASSUMPTION_PARAMS_MISMATCH | ERR_OBSERVED_VALUE_INVALID"
    http_status: "400 | 422"
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_book_version must equal the book's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /books/{id}/simulation-runs; PATCH /positions/{id}"
  - priority: 6
    category: state
    check: "Target resource state permits the transition (incl. book must be ACTIVE for run creation else ERR_BOOK_NOT_ACTIVE; activation completeness else ERR_BOOK_ACTIVATION_INCOMPLETE)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_BOOK_NOT_ACTIVE | ERR_BOOK_ACTIVATION_INCOMPLETE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: assumption approver != creator; report acknowledger != submitter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /assumption-sets/{id}/approve; POST /alco-reports/{id}/acknowledge"
  - priority: 8
    category: business_constraint
    check: "Uniqueness / overlap: one ACTIVE PolicyLimit per (book, metric, applies_to_kinds) (ERR_LIMIT_SCOPE_CONFLICT); one non-terminal AlcoReport per (book, period_month) (ERR_REPORT_PERIOD_CONFLICT); hedge designation half-open window must not overlap same-position DESIGNATED/ACTIVE hedge windows, adjacency allowed (ERR_HEDGE_WINDOW_OVERLAP); backtest windows on the same assumption set must neither overlap nor be adjacent — a gap of >= 1 month is required between windows (ERR_BACKTEST_WINDOW_OVERLAP)"
    error_id: "ERR_LIMIT_SCOPE_CONFLICT | ERR_REPORT_PERIOD_CONFLICT | ERR_HEDGE_WINDOW_OVERLAP | ERR_BACKTEST_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "policy-limit create/resume; report create; hedge designate; backtest create"
  - priority: 9
    category: business_temporal
    check: "Clock-relative windows: hedge designate start_month >= current logical month (ERR_DESIGNATION_WINDOW_PAST); hedge activate current month >= start_month (ERR_HEDGE_NOT_ACTIVATABLE); backtest observation window must be fully elapsed: current month index >= start_month index + observation_months (ERR_BACKTEST_WINDOW_NOT_ELAPSED)"
    error_id: "ERR_DESIGNATION_WINDOW_PAST | ERR_HEDGE_NOT_ACTIVATABLE | ERR_BACKTEST_WINDOW_NOT_ELAPSED"
    http_status: 409
    applies_to: "hedge designate/activate; backtest create"
  - priority: 10
    category: business_fiscal
    check: "Hedge notional must not exceed hedged position balance"
    error_id: ERR_HEDGE_NOTIONAL_EXCEEDS_EXPOSURE
    http_status: 409
    applies_to: "POST /hedges/{id}/designate"
  - priority: 11
    category: business_referential
    check: "Cross-entity state: scenario must be ACTIVE (ERR_SCENARIO_NOT_ACTIVE); each pinned assumption set must be APPROVED (ERR_ASSUMPTION_NOT_APPROVED) and free of OPEN BREACH reviews (ERR_ASSUMPTION_UNDER_REVIEW); hedged position must be ACTIVE (ERR_POSITION_RETIRED); retire blocked while referenced by non-terminal hedge (ERR_POSITION_HAS_ACTIVE_HEDGE); CLOSED_REVISED requires a newer APPROVED set in the domain (ERR_BACKTEST_CLOSURE_REQUIRES_REVISION)"
    error_id: "ERR_SCENARIO_NOT_ACTIVE | ERR_ASSUMPTION_NOT_APPROVED | ERR_ASSUMPTION_UNDER_REVIEW | ERR_POSITION_RETIRED | ERR_POSITION_HAS_ACTIVE_HEDGE | ERR_BACKTEST_CLOSURE_REQUIRES_REVISION"
    http_status: 409
    applies_to: "run create; hedge designate; position retire; backtest close"
  - priority: 12
    category: business_constraint
    check: "Aggregate gates: report submit requires regulatory_coverage_complete (ERR_REGULATORY_COVERAGE_INCOMPLETE); report acknowledge requires open_breach_count == 0 (ERR_OPEN_BREACHES_REMAIN)"
    error_id: "ERR_REGULATORY_COVERAGE_INCOMPLETE | ERR_OPEN_BREACHES_REMAIN"
    http_status: 409
    applies_to: "report submit/acknowledge"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- AlmBook ---
  - method: POST
    path: "/books"
    description: "Create an AlmBook (status DRAFT)"
    roles: [TreasuryAnalyst]
    code: 201
    input: [name, base_curve_rate_bps, "min_hedged_notional_cents?"]
    output: AlmBook
    side_effects: ["status=DRAFT, totals=0"]

  - method: GET
    path: "/books/{id}"
    description: "Get an AlmBook"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: AlmBook
    side_effects: []

  - method: POST
    path: "/books/{id}/activate"
    description: "Activate a book (requires >=1 asset and >=1 liability position)"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: AlmBook
    side_effects: ["status -> ACTIVE", "increments AlmBook.version by 1"]

  # --- Position ---
  - method: POST
    path: "/books/{id}/positions"
    description: "Create a Position in a book"
    roles: [TreasuryAnalyst]
    code: 201
    input: [category, "deposit_segment?", balance_cents, rate_bps, scheduled_runoff_pct, "is_prepayment_eligible?", duration_years]
    output: Position
    side_effects: ["status=ACTIVE", "Recompute book totals", "increments AlmBook.version by 1"]

  - method: GET
    path: "/books/{id}/positions"
    description: "List positions of a book"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: ["category?", "status?"]
    output: "Position[]"
    side_effects: []

  - method: GET
    path: "/positions/{id}"
    description: "Get a Position"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: Position
    side_effects: []

  - method: PATCH
    path: "/positions/{id}"
    description: "Update position economics (OCC-guarded on book version)"
    roles: [TreasuryAnalyst]
    code: 200
    input: [expected_book_version, "balance_cents?", "rate_bps?", "scheduled_runoff_pct?", "is_prepayment_eligible?", "duration_years?"]
    output: Position
    side_effects: ["Recompute book totals", "increments AlmBook.version by 1"]

  - method: POST
    path: "/positions/{id}/retire"
    description: "Retire a position (soft terminal state)"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: Position
    side_effects: ["status -> RETIRED", "Recompute book totals", "increments AlmBook.version by 1"]

  # --- AssumptionSet ---
  - method: POST
    path: "/books/{id}/assumption-sets"
    description: "Create an AssumptionSet (status DRAFT)"
    roles: [TreasuryAnalyst]
    code: 201
    input: [domain, params]
    output: AssumptionSet
    side_effects: ["created_by_user_id = X-User-ID"]

  - method: GET
    path: "/books/{id}/assumption-sets"
    description: "List assumption sets of a book"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: ["domain?", "status?"]
    output: "AssumptionSet[]"
    side_effects: []

  - method: GET
    path: "/assumption-sets/{id}"
    description: "Get an AssumptionSet"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: []

  - method: PATCH
    path: "/assumption-sets/{id}"
    description: "Edit params while DRAFT"
    roles: [TreasuryAnalyst]
    code: 200
    input: [params]
    output: AssumptionSet
    side_effects: []

  - method: POST
    path: "/assumption-sets/{id}/submit"
    description: "Submit for ALCO approval"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/assumption-sets/{id}/approve"
    description: "Approve a submitted set (segregation of duties enforced); supersedes the previously APPROVED set in the same (book, domain)"
    roles: [ALCOChair]
    code: 200
    input: []
    output: AssumptionSet
    side_effects: ["status -> APPROVED", "prior APPROVED set in domain -> SUPERSEDED", "runs pinning superseded sets get assumption_stale=true"]

  - method: POST
    path: "/assumption-sets/{id}/reject"
    description: "Reject a submitted set back to DRAFT"
    roles: [ALCOChair]
    code: 200
    input: [reason]
    output: AssumptionSet
    side_effects: ["status -> DRAFT"]

  # --- RateScenario ---
  - method: POST
    path: "/books/{id}/scenarios"
    description: "Create a RateScenario (status ACTIVE)"
    roles: [TreasuryAnalyst]
    code: 201
    input: [name, kind, "shock_bps?", "ramp_total_bps?", "ramp_months?", "preset_code?", "horizon_months?"]
    output: RateScenario
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/books/{id}/scenarios"
    description: "List scenarios of a book"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: ["kind?", "status?"]
    output: "RateScenario[]"
    side_effects: []

  - method: GET
    path: "/scenarios/{id}"
    description: "Get a RateScenario"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: RateScenario
    side_effects: []

  - method: POST
    path: "/scenarios/{id}/archive"
    description: "Archive a scenario; new runs referencing it are rejected"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: RateScenario
    side_effects: ["status -> ARCHIVED"]

  # --- SimulationRun ---
  - method: POST
    path: "/books/{id}/simulation-runs"
    description: "Create and synchronously compute a SimulationRun (OCC-guarded). Evaluates policy limits and opens LimitBreach rows on breach; upserts the period AlcoReport on breach"
    roles: [TreasuryAnalyst]
    code: 201
    input: [scenario_id, prepayment_set_id, decay_set_id, beta_set_id, balance_sheet_convention, "annual_growth_pct?", expected_book_version]
    output: SimulationRun
    side_effects:
      - "status=COMPLETED; NII/EVE outputs computed; breach_summary set"
      - "LimitBreach created per breached ACTIVE limit (status OPEN, period=current logical month); period report upserted/recomputed and auto-reverted SUBMITTED->DRAFT"
      - "increments AlmBook.version by 1"

  - method: GET
    path: "/simulation-runs"
    description: "List runs with filters"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: ["book_id?", "scenario_id?", "prepayment_set_id?", "decay_set_id?", "beta_set_id?", "status?"]
    output: "SimulationRun[]"
    side_effects: []

  - method: GET
    path: "/simulation-runs/{id}"
    description: "Get a SimulationRun"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: SimulationRun
    side_effects: []

  - method: POST
    path: "/simulation-runs/{id}/publish"
    description: "Publish a completed run into the period ALCO pack"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: SimulationRun
    side_effects: ["status -> PUBLISHED", "period AlcoReport upserted/recomputed; SUBMITTED report auto-reverts to DRAFT"]

  # --- PolicyLimit ---
  - method: POST
    path: "/books/{id}/policy-limits"
    description: "Create a PolicyLimit (status ACTIVE)"
    roles: [ALCOChair]
    code: 201
    input: [metric, applies_to_kinds, threshold_pct]
    output: PolicyLimit
    side_effects: []

  - method: GET
    path: "/books/{id}/policy-limits"
    description: "List policy limits of a book"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: ["metric?", "status?"]
    output: "PolicyLimit[]"
    side_effects: []

  - method: GET
    path: "/policy-limits/{id}"
    description: "Get a PolicyLimit"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: PolicyLimit
    side_effects: []

  - method: PATCH
    path: "/policy-limits/{id}"
    description: "Update threshold_pct and/or status (ACTIVE<->SUSPENDED)"
    roles: [ALCOChair]
    code: 200
    input: ["threshold_pct?", "status?"]
    output: PolicyLimit
    side_effects: []

  # --- LimitBreach ---
  - method: GET
    path: "/breaches"
    description: "List breaches with filters"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: ["book_id?", "run_id?", "limit_id?", "metric?", "status?"]
    output: "LimitBreach[]"
    side_effects: []

  - method: GET
    path: "/breaches/{id}"
    description: "Get a LimitBreach"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: LimitBreach
    side_effects: []

  - method: POST
    path: "/breaches/{id}/acknowledge"
    description: "Acknowledge an OPEN or ESCALATED breach"
    roles: [ALCOChair]
    code: 200
    input: []
    output: LimitBreach
    side_effects: ["status -> ACKNOWLEDGED", "report open_breach_count recomputed"]

  - method: POST
    path: "/breaches/{id}/remediation-plan"
    description: "Attach a remediation plan with due date"
    roles: [ALCOChair]
    code: 200
    input: [remediation_note, due_date]
    output: LimitBreach
    side_effects: ["status -> REMEDIATION_PLANNED"]

  - method: POST
    path: "/breaches/{id}/close"
    description: "Close a breach with a resolution note"
    roles: [ALCOChair]
    code: 200
    input: [resolution_note]
    output: LimitBreach
    side_effects: ["status -> CLOSED", "report open_breach_count recomputed"]

  # --- HedgeRelationship ---
  - method: POST
    path: "/books/{id}/hedges"
    description: "Create a HedgeRelationship (status PROPOSED)"
    roles: [TreasuryAnalyst]
    code: 201
    input: [position_id, instrument, designation_type, notional_cents, fixed_rate_bps]
    output: HedgeRelationship
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/books/{id}/hedges"
    description: "List hedges of a book"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: ["status?"]
    output: "HedgeRelationship[]"
    side_effects: []

  - method: GET
    path: "/positions/{id}/hedges"
    description: "List hedges referencing a position"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: "HedgeRelationship[]"
    side_effects: []

  - method: GET
    path: "/hedges/{id}"
    description: "Get a HedgeRelationship"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: HedgeRelationship
    side_effects: []

  - method: POST
    path: "/hedges/{id}/designate"
    description: "Designate a proposed hedge: pins window and effectiveness method"
    roles: [ALCOChair]
    code: 200
    input: [start_month, end_month, effectiveness_method]
    output: HedgeRelationship
    side_effects: ["status -> DESIGNATED", "book hedged_notional_cents recomputed"]

  - method: POST
    path: "/hedges/{id}/activate"
    description: "Activate a designated hedge once the logical clock reaches start_month"
    roles: [ALCOChair]
    code: 200
    input: []
    output: HedgeRelationship
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/hedges/{id}/dedesignate"
    description: "Remove hedge accounting designation (manual)"
    roles: [ALCOChair]
    code: 200
    input: [reason]
    output: HedgeRelationship
    side_effects: ["status -> DEDESIGNATED", "book hedged_notional_cents recomputed", "hedge_coverage_floor_check"]

  - method: POST
    path: "/hedges/{id}/terminate"
    description: "Terminate an ACTIVE hedge early"
    roles: [ALCOChair]
    code: 200
    input: [reason]
    output: HedgeRelationship
    side_effects: ["status -> TERMINATED", "book hedged_notional_cents recomputed", "hedge_coverage_floor_check"]

  - method: POST
    path: "/hedges/{id}/effectiveness-tests"
    description: "Record a periodic effectiveness test; FAIL auto-dedesignates an ACTIVE hedge"
    roles: [ModelRiskValidator]
    code: 201
    input: [test_month, hedge_value_change_cents, hedged_item_value_change_cents, "slope?", "r_squared?", "sample_count?"]
    output: HedgeEffectivenessTest
    side_effects: ["result computed per pinned method", "FAIL -> hedge DEDESIGNATED -> hedged_notional recompute -> hedge_coverage_floor_check"]

  - method: GET
    path: "/hedges/{id}/effectiveness-tests"
    description: "List effectiveness tests of a hedge"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: "HedgeEffectivenessTest[]"
    side_effects: []

  # --- BacktestReview ---
  - method: POST
    path: "/books/{id}/backtests"
    description: "Create a BacktestReview of an assumption set over an observation window"
    roles: [ModelRiskValidator]
    code: 201
    input: [assumption_set_id, start_month, observation_months, observed_value_pct]
    output: BacktestReview
    side_effects: ["outcome computed", "BREACH -> assumption_set.governance_flag=REVIEW_REQUIRED"]

  - method: GET
    path: "/backtests"
    description: "List backtest reviews with filters"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: ["book_id?", "assumption_set_id?"]
    output: "BacktestReview[]"
    side_effects: []

  - method: GET
    path: "/backtests/{id}"
    description: "Get a BacktestReview"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: BacktestReview
    side_effects: []

  - method: POST
    path: "/backtests/{id}/close"
    description: "Close a review as CLOSED_ACCEPTED or CLOSED_REVISED"
    roles: [ALCOChair]
    code: 200
    input: [outcome]
    output: BacktestReview
    side_effects: ["status -> outcome", "governance_flag cleared when no OPEN review remains for the set"]

  # --- AlcoReport ---
  - method: POST
    path: "/books/{id}/alco-reports"
    description: "Create the ALCO report for a period (status DRAFT)"
    roles: [TreasuryAnalyst]
    code: 201
    input: [period_month]
    output: AlcoReport
    side_effects: ["aggregates initialized from current runs/breaches"]

  - method: GET
    path: "/books/{id}/alco-reports"
    description: "List ALCO reports of a book"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: ["status?"]
    output: "AlcoReport[]"
    side_effects: []

  - method: GET
    path: "/alco-reports/{id}"
    description: "Get an AlcoReport"
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair, Regulator]
    code: 200
    input: []
    output: AlcoReport
    side_effects: []

  - method: POST
    path: "/alco-reports/{id}/submit"
    description: "Submit a DRAFT report to ALCO (requires full regulatory coverage)"
    roles: [TreasuryAnalyst]
    code: 200
    input: []
    output: AlcoReport
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id = X-User-ID"]

  - method: POST
    path: "/alco-reports/{id}/acknowledge"
    description: "ALCO chair acknowledges a submitted report (requires zero open breaches; acknowledger != submitter)"
    roles: [ALCOChair]
    code: 200
    input: []
    output: AlcoReport
    side_effects: ["status -> ACKNOWLEDGED", "acknowledged_by_user_id = X-User-ID"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. Setting the clock triggers the breach escalation sweep (OPEN past 5-day ack deadline -> ESCALATED; REMEDIATION_PLANNED past due_date -> ESCALATED)."
    roles: [TreasuryAnalyst, ModelRiskValidator, ALCOChair]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["LimitBreach escalation sweep"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, out-of-range value, kind-field mismatch, DYNAMIC without annual_growth_pct" }
  - { id: ERR_DEPOSIT_SEGMENT_REQUIRED, http: 422, condition: "category=DEPOSIT without deposit_segment" }
  - { id: ERR_ASSUMPTION_PARAMS_MISMATCH, http: 422, condition: "params keys do not match the assumption set's domain schema" }
  - { id: ERR_OBSERVED_VALUE_INVALID, http: 422, condition: "observed_value_pct outside [0,100]" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_book_version does not match the book's current version" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_BOOK_NOT_ACTIVE, http: 409, condition: "Run creation requires book status ACTIVE" }
  - { id: ERR_BOOK_ACTIVATION_INCOMPLETE, http: 409, condition: "Activation requires >=1 ACTIVE asset and >=1 ACTIVE liability position" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Approver equals creator, or report acknowledger equals submitter" }
  - { id: ERR_ASSUMPTION_NOT_APPROVED, http: 409, condition: "A pinned assumption set is not APPROVED" }
  - { id: ERR_ASSUMPTION_UNDER_REVIEW, http: 409, condition: "A pinned assumption set has an OPEN BREACH BacktestReview" }
  - { id: ERR_SCENARIO_NOT_ACTIVE, http: 409, condition: "Run references an ARCHIVED scenario" }
  - { id: ERR_LIMIT_SCOPE_CONFLICT, http: 409, condition: "An ACTIVE PolicyLimit already exists for the same (book, metric, applies_to_kinds)" }
  - { id: ERR_REPORT_PERIOD_CONFLICT, http: 409, condition: "A non-terminal AlcoReport already exists for (book, period_month)" }
  - { id: ERR_OPEN_BREACHES_REMAIN, http: 409, condition: "Report acknowledge while open_breach_count > 0" }
  - { id: ERR_REGULATORY_COVERAGE_INCOMPLETE, http: 409, condition: "Report submit without a PUBLISHED run for each of the six regulatory presets in the period" }
  - { id: ERR_POSITION_RETIRED, http: 409, condition: "Hedge designation references a RETIRED position" }
  - { id: ERR_POSITION_HAS_ACTIVE_HEDGE, http: 409, condition: "Retire blocked by a PROPOSED/DESIGNATED/ACTIVE hedge on the position" }
  - { id: ERR_HEDGE_WINDOW_OVERLAP, http: 409, condition: "Designation window overlaps another DESIGNATED/ACTIVE hedge on the same position (half-open; adjacency allowed)" }
  - { id: ERR_DESIGNATION_WINDOW_PAST, http: 409, condition: "start_month is before the current logical month" }
  - { id: ERR_HEDGE_NOTIONAL_EXCEEDS_EXPOSURE, http: 409, condition: "notional_cents exceeds hedged position balance_cents" }
  - { id: ERR_HEDGE_NOT_ACTIVATABLE, http: 409, condition: "Activate before designation start_month" }
  - { id: ERR_BACKTEST_WINDOW_NOT_ELAPSED, http: 409, condition: "Observation window not fully elapsed relative to logical clock" }
  - { id: ERR_BACKTEST_WINDOW_OVERLAP, http: 409, condition: "Review window overlaps or is adjacent to an existing review window on the same set (>= 1 month gap required)" }
  - { id: ERR_BACKTEST_CLOSURE_REQUIRES_REVISION, http: 409, condition: "CLOSED_REVISED without a newer APPROVED set in the same domain" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TreasuryAnalyst
    description: "ALM analyst: maintains the book, positions, scenarios, drafts assumption sets, runs and publishes simulations, drafts and submits ALCO reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /books; POST /books/{id}/activate; POST /books/{id}/positions; PATCH /positions/{id}; POST /positions/{id}/retire"
      - "POST /books/{id}/assumption-sets; PATCH /assumption-sets/{id}; POST /assumption-sets/{id}/submit"
      - "POST /books/{id}/scenarios; POST /scenarios/{id}/archive"
      - "POST /books/{id}/simulation-runs; POST /simulation-runs/{id}/publish"
      - "POST /books/{id}/hedges"
      - "POST /books/{id}/alco-reports; POST /alco-reports/{id}/submit"
    shared_operations:
      - "POST /_clock/set_current_utc (with ModelRiskValidator, ALCOChair)"
      - "All GET endpoints (with ModelRiskValidator, ALCOChair, Regulator)"
  - name: ModelRiskValidator
    description: "Independent model risk: runs hedge effectiveness tests and assumption backtests; cannot draft or approve assumptions"
    identity: "opaque"
    exclusive_operations:
      - "POST /hedges/{id}/effectiveness-tests"
      - "POST /books/{id}/backtests"
    shared_operations:
      - "POST /_clock/set_current_utc (with TreasuryAnalyst, ALCOChair)"
      - "All GET endpoints"
  - name: ALCOChair
    description: "ALCO chair: approves/rejects assumption sets, owns policy limits, designates and retires hedges, works the breach lifecycle, closes backtests, acknowledges reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /assumption-sets/{id}/approve; POST /assumption-sets/{id}/reject"
      - "POST /books/{id}/policy-limits; PATCH /policy-limits/{id}"
      - "POST /breaches/{id}/acknowledge; POST /breaches/{id}/remediation-plan; POST /breaches/{id}/close"
      - "POST /hedges/{id}/designate; POST /hedges/{id}/activate; POST /hedges/{id}/dedesignate; POST /hedges/{id}/terminate"
      - "POST /backtests/{id}/close"
      - "POST /alco-reports/{id}/acknowledge"
    shared_operations:
      - "POST /_clock/set_current_utc (with TreasuryAnalyst, ModelRiskValidator)"
      - "All GET endpoints"
  - name: Regulator
    description: "External supervisor: read-only access to books, runs, breaches, reports"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (with all other roles)"
