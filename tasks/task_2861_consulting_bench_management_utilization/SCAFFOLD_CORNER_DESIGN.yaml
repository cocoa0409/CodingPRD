            - "${resk_count} == 1 with ${resk_first_consultant} == ${cesc_id} and ${mon_count} == 1 with ${mon_first_consultant} == ${cfresh_id} — the state filter partitions the two spells"
            - "${by_program_count} == 1 — the reskilling_program_id filter is the reverse-reachability read for BenchSpell.reskilling_program_id"

  - section: errors
    instances:

      - name: master_data_path_ids_return_their_own_not_found_codes
        claim_type: Error triggerable
        grounds:
          - errors[ERR_SKILL_NOT_FOUND]
          - errors[ERR_SKILL_ASSERTION_NOT_FOUND]
          - errors[ERR_OPPORTUNITY_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_BENCH_SPELL_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "Five detail reads on well-formed but unknown UUIDs each return the code named after their own entity, never a generic 404 and never another entity's code."
        test_recipe:
          setup:
            - "An empty system is sufficient; no row needs to exist for a path-id lookup to fail."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
          trigger:
            - call: "GET /skills/00000000-0000-4000-8000-0000000000a1"
              as: PracticePartner
              captures: { err_skill: $.data.error_id }
            - call: "GET /skill-assertions/00000000-0000-4000-8000-0000000000a2"
              as: ResourceManager
              captures: { err_assertion: $.data.error_id }
            - call: "GET /demand-opportunities/00000000-0000-4000-8000-0000000000a3"
              as: SalesLead
              captures: { err_opportunity: $.data.error_id }
            - call: "GET /assignments/00000000-0000-4000-8000-0000000000a4"
              as: ResourceManager
              captures: { err_assignment: $.data.error_id }
            - call: "GET /bench-spells/00000000-0000-4000-8000-0000000000a5"
              as: ResourceManager
              captures: { err_spell: $.data.error_id }
          assert:
            - "${err_skill} == ERR_SKILL_NOT_FOUND, ${err_assertion} == ERR_SKILL_ASSERTION_NOT_FOUND, ${err_opportunity} == ERR_OPPORTUNITY_NOT_FOUND, ${err_assignment} == ERR_ASSIGNMENT_NOT_FOUND, ${err_spell} == ERR_BENCH_SPELL_NOT_FOUND"
            - "every one of the five responses carries HTTP 404 and an error_id, and PracticeGroup.${pg_id} is untouched by all of them"

      - name: sourcing_and_finance_path_ids_return_their_own_not_found_codes
        claim_type: Error triggerable
        grounds:
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_FIRM_NOT_FOUND]
          - errors[ERR_PLACEMENT_NOT_FOUND]
          - errors[ERR_APPROVAL_NOT_FOUND]
          - errors[ERR_FORECAST_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "The other five detail reads complete the 404 catalog, including the immutable HiringForecast, whose absence is still reported as ERR_FORECAST_NOT_FOUND rather than an empty 200."
        test_recipe:
          setup:
            - "An empty system is sufficient."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
          trigger:
            - call: "GET /reskilling-programs/00000000-0000-4000-8000-0000000000b1"
              as: ResourceManager
              captures: { err_program: $.data.error_id }
            - call: "GET /subcontractor-firms/00000000-0000-4000-8000-0000000000b2"
              as: PracticePartner
              captures: { err_firm: $.data.error_id }
            - call: "GET /external-placements/00000000-0000-4000-8000-0000000000b3"
              as: ResourceManager
              captures: { err_placement: $.data.error_id }
            - call: "GET /discount-approvals/00000000-0000-4000-8000-0000000000b4"
              as: FinanceController
              captures: { err_approval: $.data.error_id }
            - call: "GET /hiring-forecasts/00000000-0000-4000-8000-0000000000b5"
              as: FinanceController
              captures: { err_forecast: $.data.error_id }
          assert:
            - "${err_program} == ERR_PROGRAM_NOT_FOUND, ${err_firm} == ERR_FIRM_NOT_FOUND, ${err_placement} == ERR_PLACEMENT_NOT_FOUND, ${err_approval} == ERR_APPROVAL_NOT_FOUND, ${err_forecast} == ERR_FORECAST_NOT_FOUND"
            - "all five are HTTP 404; PracticeGroup.${pg_id} is untouched"

      - name: nested_and_action_paths_check_the_path_before_the_body
        claim_type: Error triggerable
        grounds:
          - errors[ERR_PERIOD_NOT_FOUND]
          - errors[ERR_CONSULTANT_NOT_FOUND]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_BENCH_SPELL_NOT_FOUND]
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: "On the nested period route an unknown periodId under a real consultant gives ERR_PERIOD_NOT_FOUND while an unknown consultantId gives ERR_CONSULTANT_NOT_FOUND, and on the enrolment route an unknown programme id beats an unknown consultant_id in the body — the path is always resolved first."
        test_recipe:
          setup:
            - "Clock 2026-08-03: one NA group, one consultant, one OPEN utilization period, one PLANNED programme on a CLOUD_ARCH skill."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
            - call: "POST /consultants/${c1_id}/utilization-periods"
              payload: { period_start_on: "2026-08-03", period_end_on: "2026-08-28" }
              as: FinanceController
              captures: { up_id: $.data.id }
            - call: "POST /reskilling-programs"
              payload: { skill_id: "${sk_id}", target_proficiency_level: 4, cohort_start_on: "2026-09-01", cohort_end_on: "2026-09-30", seat_capacity: 2 }
              as: ResourceManager
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /consultants/${c1_id}/utilization-periods/00000000-0000-4000-8000-0000000000c1"
              as: FinanceController
              captures: { err_period: $.data.error_id }
            - call: "GET /consultants/00000000-0000-4000-8000-0000000000c2/utilization-periods"
              payload: { limit: 10 }
              as: FinanceController
              captures: { err_nested_parent: $.data.error_id }
            - call: "POST /reskilling-programs/00000000-0000-4000-8000-0000000000c3/enrollments"
              payload: { consultant_id: "00000000-0000-4000-8000-0000000000c4" }
              as: ResourceManager
              captures: { err_program_first: $.data.error_id }
            - call: "POST /reskilling-programs/${p1_id}/enrollments"
              payload: { consultant_id: "00000000-0000-4000-8000-0000000000c4" }
              as: ResourceManager
              captures: { err_body_consultant: $.data.error_id }
            - call: "POST /bench-spells/00000000-0000-4000-8000-0000000000c5/separation-proposal"
              payload: { rationale: "no such spell" }
              as: ResourceManager
              captures: { err_spell: $.data.error_id }
          assert:
            - "${err_period} == ERR_PERIOD_NOT_FOUND with HTTP 404 — the consultant in the path is real, only the periodId is not"
            - "${err_nested_parent} == ERR_CONSULTANT_NOT_FOUND — the nested parent is resolved before the child collection is listed"
            - "${err_program_first} == ERR_PROGRAM_NOT_FOUND, NOT ERR_CONSULTANT_NOT_FOUND, even though the body FK is also unknown"
            - "${err_body_consultant} == ERR_CONSULTANT_NOT_FOUND once the path resolves, and ReskillingProgram.${p1_id}.seats_taken is still 0"
            - "${err_spell} == ERR_BENCH_SPELL_NOT_FOUND — an action route on a missing row 404s before any state rule runs; UtilizationPeriod.${up_id}.status is still \"OPEN\""

  - section: rbac
    instances:

      - name: missing_unknown_and_unbacked_identity_headers_are_rejected
        claim_type: ERR_UNAUTHENTICATED
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles.Consultant.identity
        distinguishing_aspect: "Three separate defects in the identity pair all return 401 and never 403: an empty X-User-Role, a role name that is not one of the five in §1.7, and a Consultant-role caller whose X-User-ID matches no Consultant row — the last one proves the entity_backed identity is resolved against the table, not merely parsed."
        test_recipe:
          setup:
            - "One NA group and one consultant, so a real Consultant id exists to contrast against."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
          trigger:
            - call: "GET /consultants"
              payload: { limit: 10 }
              as: ""
              as_user_id: "u-nobody"
              captures: { err_empty_role: $.data.error_id }
            - call: "GET /consultants"
              payload: { limit: 10 }
              as: PracticeManager
              as_user_id: "u-nobody"
              captures: { err_unknown_role: $.data.error_id }
            - call: "GET /consultants/${c1_id}"
              as: Consultant
              as_user_id: "00000000-0000-4000-8000-0000000000d1"
              captures: { err_unbacked_id: $.data.error_id }
            - call: "POST /consultants"
              payload: { full_name: "Ghost Hire", email: "ghost.hire@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: PracticeManager
              as_user_id: "u-nobody"
              captures: { err_401_before_403: $.data.error_id }
          assert:
            - "${err_empty_role} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${err_unknown_role} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${err_unbacked_id} == ERR_UNAUTHENTICATED with HTTP 401 — NOT ERR_NOT_RESOURCE_OWNER, even though the path id ${c1_id} is a real row"
            - "${err_401_before_403} == ERR_UNAUTHENTICATED, NOT ERR_UNAUTHORIZED: priority 1 runs before priority 2, so an unrecognisable identity is never told which roles the endpoint allows"
            - "GET /consultants with a valid ResourceManager header still returns total_count == 1 — none of the four refusals created or removed a row"

      - name: roles_cannot_reach_each_others_exclusive_operations
        claim_type: ERR_UNAUTHORIZED
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.SalesLead.exclusive_operations
          - roles.ResourceManager.exclusive_operations
          - roles.PracticePartner.exclusive_operations
          - roles.FinanceController.exclusive_operations
        distinguishing_aspect: "Six cross-role attempts each return 403: every authenticated caller is refused another role's exclusive operation, ResourceManager is refused even the READ of the discount ledger that the other three share, and a Consultant addressing its OWN utilization-period collection for a write is still refused with ERR_UNAUTHORIZED because priority 2 precedes the ownership check at priority 6."
        test_recipe:
