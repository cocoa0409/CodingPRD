# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header, or unknown role" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing required field, bad type, unknown enum member, unknown field, empty required array, inverted time window" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed identity mismatch: cashier does not own the session, driver does not own the route, volunteer does not own the assignment" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_STALE_BATCH_VERSION, http: 412, condition: "expected_batch_version != DonationBatch.version on revalue (OCC)" }
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "expected_cycle_version != WeeklyCycle.version on transfer create (OCC)" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "Batch not in the required state (incl. item-add to non-OPEN batch, triage while batch not SORTING, close of non-SORTED batch, cancel with items, receipt on non-SORTED batch, revalue on CLOSED/CANCELLED batch, begin-sort of empty batch)" }
  - { id: ERR_BATCH_HAS_UNTRIAGED_ITEMS, http: 409, condition: "complete-sort while untriaged_count > 0" }
  - { id: ERR_BATCH_RECEIPT_MISSING, http: 409, condition: "close of a receipt_requested batch with no ISSUED receipt" }
  - { id: ERR_REVALUE_BLOCKED_BY_RECEIPT, http: 409, condition: "revalue while an ISSUED receipt exists for the batch" }
  - { id: ERR_ITEM_INVALID_STATE, http: 409, condition: "Item not in the from-state for the attempted action (triage/price/to-floor/hold/release-hold/shrink/sale-line)" }
  - { id: ERR_GUIDELINE_MISSING, http: 422, condition: "No ACTIVE PricingGuideline for the item's category at pricing time" }
  - { id: ERR_HIGH_VALUE_NEEDS_MANAGER, http: 422, condition: "Shrink-alert active and computed price >= 10000 cents; Pricer may not price it, StoreManager must" }
  - { id: ERR_NO_OPEN_CYCLE, http: 409, condition: "Operation needs an OPEN WeeklyCycle (to-floor, shrink, bale settle) but none exists" }
  - { id: ERR_TILL_SESSION_OPEN_EXISTS, http: 409, condition: "Cashier already has an OPEN till session" }
  - { id: ERR_TILL_INVALID_STATE, http: 409, condition: "Till session not in the required state (sale or cashier-void on non-OPEN session, count of non-OPEN, approve of non-PENDING_APPROVAL, close of non-RECONCILED)" }
  - { id: ERR_SALE_INVALID_STATE, http: 409, condition: "Sale already VOIDED (or otherwise not COMPLETED) — wins over void-window checks (priority 6 < 10)" }
  - { id: ERR_SALE_VOID_WINDOW_CLOSED, http: 422, condition: "Void attempted on a later UTC date than the sale or after the session CLOSED" }
  - { id: ERR_ROUTE_INVALID_STATE, http: 409, condition: "Route not in the required state (stop-add to non-DRAFT, start of non-PUBLISHED, unpublish with started stops, complete with non-terminal stops, stop actions while route not IN_PROGRESS)" }
  - { id: ERR_ROUTE_EMPTY, http: 422, condition: "publish with zero SCHEDULED stops" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 422, condition: "Stop volume would push total_volume_cuft above truck_capacity_cuft (equality allowed)" }
  - { id: ERR_STOP_INVALID_STATE, http: 409, condition: "Stop not in the from-state (depart of non-SCHEDULED, complete/no-show of non-EN_ROUTE)" }
  - { id: ERR_STOP_OUT_OF_SEQUENCE, http: 422, condition: "Departing a stop while an earlier-windowed stop on the route is not terminal" }
  - { id: ERR_STOP_WINDOW_CONFLICT, http: 422, condition: "New stop window violates the 30-minute buffer against another SCHEDULED/EN_ROUTE stop on the route (wins over donor/referential failures, priority 10 < 11)" }
  - { id: ERR_DONOR_INACTIVE, http: 422, condition: "Referenced donor is INACTIVE (batch create, stop add)" }
  - { id: ERR_DRIVER_NOT_STAFF, http: 422, condition: "Route driver_worker_id references a non-STAFF or non-ACTIVE worker" }
  - { id: ERR_WORKER_NOT_ACTIVE, http: 422, condition: "Assignment target worker is INACTIVE" }
  - { id: ERR_WORKER_CAP_REACHED, http: 422, condition: "Assignment target worker is CAP_REACHED (TRANSITIONAL program cap)" }
  - { id: ERR_WEEKLY_HOURS_EXCEEDED, http: 422, condition: "TRANSITIONAL worker's same-week assignment hours would exceed 20.0 (equality allowed)" }
  - { id: ERR_SHIFT_FULL, http: 422, condition: "Shift assigned_count == required_headcount" }
  - { id: ERR_SHIFT_OVERLAP, http: 422, condition: "Worker already holds an ASSIGNED/CONFIRMED assignment overlapping the shift interval (touching endpoints allowed, no buffer)" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Assignment not in the from-state (confirm of non-ASSIGNED, complete of non-CONFIRMED, no-show/cancel of terminal)" }
  - { id: ERR_CYCLE_INVALID_STATE, http: 409, condition: "Cycle not in the required state (second OPEN cycle, run-markdown on CLOSED or already-run cycle, close of non-OPEN, transfer on non-CLOSED cycle)" }
  - { id: ERR_TILL_SESSIONS_UNCLOSED, http: 409, condition: "Cycle close blocked: a TillSession is still OPEN, PENDING_APPROVAL, or RECONCILED" }
  - { id: ERR_TRANSFER_INVALID_STATE, http: 409, condition: "Transfer not in the required state (approve of non-DRAFT, disburse of non-APPROVED)" }
  - { id: ERR_ALLOCATION_SUM_INVALID, http: 422, condition: "Transfer allocation pct values do not sum to exactly 100" }
  - { id: ERR_SOD_APPROVER_IS_PREPARER, http: 422, condition: "Transfer approver X-User-ID equals prepared_by_user_id" }
  - { id: ERR_SOD_APPROVER_IS_COUNTER, http: 422, condition: "Variance approver X-User-ID equals counted_by_user_id" }
  - { id: ERR_RECEIPT_INVALID_STATE, http: 409, condition: "Receipt already exists for the batch, or void of a non-ISSUED receipt" }
  - { id: ERR_RECEIPT_LOCKED, http: 422, condition: "Receipt void after the owning batch reached CLOSED" }
  - { id: ERR_RECEIPT_NOT_REQUESTED, http: 422, condition: "Receipt issuance for a batch with receipt_requested == false" }
  - { id: ERR_APPRAISAL_REQUIRED, http: 422, condition: "Receipt blocked: an item has provisional_value_cents >= 500000 with appraisal_confirmed == false" }
  - { id: ERR_DONOR_ADDRESS_REQUIRED, http: 422, condition: "Receipt blocked: total >= 50000 cents and donor.address_line missing" }
  - { id: ERR_BALE_INVALID_STATE, http: 409, condition: "Bale not in the required state (seal of non-ACCUMULATING, ship of non-SEALED, settle of non-SHIPPED)" }
  - { id: ERR_BALE_UNDERWEIGHT, http: 422, condition: "Seal with weight_lbs < 100.0 (wins over vendor-rate failures, priority 9 < 11)" }
  - { id: ERR_VENDOR_RATE_MISSING, http: 422, condition: "Seal vendor declares no rates for the bale's category" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StoreManager
    description: "Store manager: guidelines, shrink authorization, till counts/closes, route management, cycle ops, transfer approval, receipt voids, high-value pricing override, cap extensions"
    identity: opaque
    exclusive_operations: ["POST /api/pricing-guidelines", "POST /api/items/{id}/shrink", "POST /api/till-sessions/{id}/count", "POST /api/till-sessions/{id}/close", "POST /api/pickup-routes*", "POST /api/cycles*", "POST /api/mission-transfers/{id}/approve", "POST /api/tax-receipts/{id}/void", "POST /api/salvage-bales/{id}/seal", "POST /api/salvage-bales/{id}/ship", "POST /api/_clock/set_current_utc"]
    shared_operations: ["POST /api/items/{id}/price (with Pricer)", "POST /api/sales/{id}/void (with Cashier)", "PATCH /api/workers/{id} cap extension (with VolunteerCoordinator)", "all GET endpoints"]
  - name: IntakeAttendant
    description: "Donation intake desk: donors, batches, items, triage, revalue, receipts"
    identity: opaque
    exclusive_operations: ["POST /api/donors", "PATCH /api/donors/{id}", "POST /api/donation-batches and all /api/donation-batches/{id}/* actions", "POST /api/items/{id}/triage", "POST /api/donation-batches/{id}/receipt"]
    shared_operations: ["all GET endpoints"]
  - name: Pricer
    description: "Pricing and floor merchandising: price items, move to floor, manage holds"
    identity: opaque
    exclusive_operations: ["POST /api/items/{id}/to-floor", "POST /api/items/{id}/hold", "POST /api/items/{id}/release-hold"]
    shared_operations: ["POST /api/items/{id}/price (with StoreManager)", "all GET endpoints"]
  - name: Cashier
    description: "Register operator (a STAFF/TRANSITIONAL/VOLUNTEER worker): opens own till session, rings sales, voids within window on own open session"
    identity: "entity_backed:Worker"
    exclusive_operations: ["POST /api/till-sessions", "POST /api/sales"]
    shared_operations: ["POST /api/sales/{id}/void (own OPEN session only)", "all GET endpoints"]
  - name: Driver
    description: "Truck driver (a STAFF worker): executes route stops"
    identity: "entity_backed:Worker"
    exclusive_operations: ["POST /api/pickup-stops/{id}/depart", "POST /api/pickup-stops/{id}/complete", "POST /api/pickup-stops/{id}/no-show"]
    shared_operations: ["all GET endpoints"]
  - name: Volunteer
    description: "Volunteer worker: confirms or cancels own shift assignments"
    identity: "entity_backed:Worker"
    exclusive_operations: []
    shared_operations: ["POST /api/shift-assignments/{id}/confirm (own)", "POST /api/shift-assignments/{id}/cancel (own)", "all GET endpoints"]
  - name: VolunteerCoordinator
    description: "Staffing coordinator: workers, shifts, assignments"
    identity: opaque
    exclusive_operations: ["POST /api/workers", "POST /api/shifts", "POST /api/shifts/{id}/assignments", "POST /api/shift-assignments/{id}/complete", "POST /api/shift-assignments/{id}/no-show"]
    shared_operations: ["PATCH /api/workers/{id} status (with StoreManager)", "POST /api/shift-assignments/{id}/confirm", "POST /api/shift-assignments/{id}/cancel", "all GET endpoints"]
  - name: FinanceClerk
    description: "Back-office finance: variance approval, bale settlement, mission transfer preparation and disbursement"
    identity: opaque
    exclusive_operations: ["POST /api/till-sessions/{id}/approve-variance", "POST /api/salvage-bales/{id}/settle", "POST /api/cycles/{id}/mission-transfers", "POST /api/mission-transfers/{id}/disburse"]
    shared_operations: ["all GET endpoints"]
