  # =========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_create_blocked_by_cancelled_session
        grounds:
          - validations[priority=28]
          - state_machines.ProgramSession.OPEN_to_CANCELLED
          - errors[ERR_SESSION_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Enrollment -> ProgramSession: whether an Enrollment may be created
          at all depends entirely on the sibling ProgramSession's own status field, not
          on anything about the Enrollment.
