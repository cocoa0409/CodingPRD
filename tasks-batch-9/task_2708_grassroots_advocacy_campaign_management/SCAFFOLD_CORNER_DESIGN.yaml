        distinguishing_aspect: "The rule is conditional on the action: a GRANT without lawful_basis and a REVOKE that supplies one both return ERR_LAWFUL_BASIS_INVALID (422), while the same REVOKE without lawful_basis succeeds and stores lawful_basis null."
