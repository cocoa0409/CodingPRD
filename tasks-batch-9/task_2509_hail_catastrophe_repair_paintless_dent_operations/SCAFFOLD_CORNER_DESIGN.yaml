              as: CatastropheDirector
              captures: { ra2: $.data.id }
            - call: "GET /hail-ops/insurers/${ins}"
              payload: {}
              as: CatastropheDirector
              captures: { ins_v0: $.data.version }
          trigger:
            - call: "POST /hail-ops/rate-agreements/${ra1}/activate"
              payload: { expected_insurer_version: "${ins_v0}" }
              as: CatastropheDirector
            - call: "POST /hail-ops/rate-agreements/${ra2}/activate"
              payload: { expected_insurer_version: "${ins_v0}" }
              as: CatastropheDirector
              captures: { err_stale: $.data.error_id }
            - call: "GET /hail-ops/insurers/${ins}"
