  - rule_id: transitive_cascade
    instances:
      - name: not_qualified_run_cascades_zone_preorder_deposit_ledger_account
        grounds:
          - state_machines.BuildZone.campaign_status.PREREG_OPEN_to_NOT_QUALIFIED
          - state_machines.Preorder.preorder_status.PENDING_to_LAPSED
          - state_machines.Preorder.deposit_status.HELD_to_REFUNDED
          - entities.LedgerEntry
          - entities.Account.fields.deposit_held_cents
        distinguishing_aspect: |
          Four caused hops from a single call: qualification-run moves the zone to NOT_QUALIFIED
          (hop 1); *that* zone transition lapses the PENDING preorder with lapse_reason
          ZONE_NOT_QUALIFIED (hop 2); *that* preorder transition flips deposit_status HELD ->
          REFUNDED and appends a DEPOSIT_REFUNDED ledger entry of -1000 (hop 3); *that* ledger
          append drives Account.deposit_held_cents from 1000 back to 0 (hop 4). No hop is a direct
          effect of the endpoint on the account.
