              payload: { project_id: "${proj}", change_event_id: "${ce}" }
              as: ConstructionManager
              captures: { draw: "$.data[0].id", draw_needs_approval: "$.data[0].requires_owner_approval", draw_amount: "$.data[0].amount" }
            - call: "POST /contingency-draws/${draw}/approve"
