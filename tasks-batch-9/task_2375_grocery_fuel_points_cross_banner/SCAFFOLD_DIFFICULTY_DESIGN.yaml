              as: ProgramAdmin
              captures: { g5_id: $.data.id }
            - call: "POST /sites"
              payload: { banner_id: "${bp_id}", site_number: "P-002", site_type: "PARTNER_STATION", partner_code: "PTR-002", per_gallon_cap_cents: 30, max_gallons_per_redemption: 20 }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /members"
              payload: { banner_id: "${bp_id}", alt_id: "5550000006", card_number: "4000000000000006", full_name: "Fay Parallel" }
              as: ProgramAdmin
              captures: { m6_id: $.data.id }
            - call: "POST /purchase-transactions"
              payload: { member_id: "${m6_id}", site_id: "${g5_id}", transacted_at: "2026-08-05T10:00:00Z", lines: [{ category: "GROCERY", amount_cents: 30000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${g5_id}"
              captures: { t6_id: $.data.id }
            - call: "POST /purchase-transactions/${t6_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${g5_id}"
            - call: "GET /members/${m6_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${p2_id}"
              captures: { mv6: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m6_id}", site_id: "${p2_id}", alt_id_presented: "5550000006", points_committed: 300, expected_member_version: "${mv6}" }
              as: PumpTerminal
              as_user_id: "${p2_id}"
              captures: { r6_id: $.data.id }
            - call: "POST /fuel-redemptions/${r6_id}/complete"
