      - name: reserving_beyond_headroom_and_from_a_zero_headroom_lot_are_rejected
        claim_type: aggregate_validation
        grounds:
          - validations.priority_30_device_stock
          - errors.ERR_LOT_DEPLETED
          - errors.ERR_INSUFFICIENT_DEVICE_STOCK
        distinguishing_aspect: "The priority-30 family splits on WHICH arithmetic failed: an explicit request larger than a single lot's headroom is ERR_INSUFFICIENT_DEVICE_STOCK, a request against a lot whose headroom is exactly 0 is ERR_LOT_DEPLETED, and the exactly-equal request in between is accepted while the lot's stored status stays AVAILABLE because quantity_on_hand never moved."
        test_recipe:
          setup:
            - "one SCHEDULED case on 2026-08-01 and one BALLOON lot with received_quantity 5"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Forty", facility_code: "C-40" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MC-40", full_name: "Cato Mensah", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Nils Ferrer", clinician_role: "INTERVENTIONALIST", npi: "2000000401", credential_expires_on: "2027-01-31" }
