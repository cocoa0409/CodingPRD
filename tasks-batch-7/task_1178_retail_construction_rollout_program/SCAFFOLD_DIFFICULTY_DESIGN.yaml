  # ---------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # ---------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: co_approve_rescind_budget_conservation
        grounds:
          - calculations.site_committed_cost
          - calculations.program_budget_rollup
          - state_machines.ChangeOrder.APPROVED_to_RESCINDED
        distinguishing_aspect: |
          Conserved quantity is money: the invariant program.committed_cents ==
          sum over non-REMOVED sites of (base_contract_cents + approved_co_cents)
          holds across the approve/rescind pair — approve moves committed from
          9000000 to 9600000 and reserve from 0 to 150000, rescind returns both
          to exactly 9000000 and 0 with no drift.
        test_recipe:
          setup:
            - "Awarded site, base 9000000, allocation 10000000, program pool 250000; PROPOSED CO +600000"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
            - call: "POST /rollout/programs"
              payload: { name: "FY26 Rollout", fiscal_year: 2026, total_budget_cents: 500000000, contingency_pool_cents: 250000 }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - { call: "POST /rollout/programs/${prog}/activate", payload: {}, as: ProgramDirector }
            - call: "POST /rollout/markets"
              payload: { program_id: "${prog}", name: "DFW", state_code: "TX", max_concurrent_vendor_crews: 2 }
              as: ProgramDirector
              captures: { mkt: $.data.id }
            - call: "POST /rollout/municipality-profiles"
              payload: { municipality_code: "TX-DAL", statutory_review_days: 10, observed_avg_review_days: 20, permit_validity_days: 180, fee_base_cents: 50000, fee_per_sqft_cents: 250 }
              as: PermitCoordinator
            - call: "POST /rollout/sites"
              payload: { program_id: "${prog}", market_id: "${mkt}", municipality_code: "TX-DAL", address: "100 Main St", square_footage: 4000, phase_wave: 1, budget_allocation_cents: 10000000, target_open_date: "2026-09-01" }
              as: ProgramDirector
              captures: { site: $.data.id }
            - call: "POST /rollout/drawing-sets"
              payload: { program_id: "${prog}", jurisdiction_code: "TX-DAL" }
              as: DesignManager
              captures: { ds: $.data.id }
            - { call: "POST /rollout/drawing-sets/${ds}/submit", payload: {}, as: DesignManager }
            - { call: "POST /rollout/drawing-sets/${ds}/approve", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/advance-design", payload: {}, as: DesignManager }
            - { call: "POST /rollout/sites/${site}/submit-design", payload: {}, as: DesignManager }
            - call: "POST /rollout/permits"
              payload: { site_id: "${site}", permit_type: "BUILDING", drawing_set_id: "${ds}" }
              as: PermitCoordinator
              captures: { perm: $.data.id }
            - { call: "POST /rollout/permits/${perm}/file", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/permits/${perm}/start-review", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/permits/${perm}/issue", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/sites/${site}/mark-permitted", payload: {}, as: PermitCoordinator }
            - { call: "POST /rollout/markets/${mkt}/open-bidding", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/bid-packages"
              payload: { market_id: "${mkt}", phase_wave: 1, scope_description: "Wave 1 GC", bid_open_at: "2026-05-01T00:00:00Z", bid_close_at: "2026-05-10T00:00:00Z", evaluation_mode: "LOWEST_PRICE", max_duration_days: 120 }
              as: ProcurementLead
              captures: { pkg: $.data.id }
            - { call: "POST /rollout/bid-packages/${pkg}/open", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/contractors"
              payload: { legal_name: "GC One LLC", license_no: "GC-100", license_state: "TX" }
              as: ProcurementLead
              captures: { gc1: $.data.id }
            - call: "POST /rollout/bids"
              payload: { bid_package_id: "${pkg}", contractor_id: "${gc1}", amount_cents: 9000000, duration_days: 90, tech_score: 80 }
              as: GCVendor
              as_user_id: "${gc1}"
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /rollout/bid-packages/${pkg}/close", payload: {}, as: ProcurementLead }
            - { call: "POST /rollout/bid-packages/${pkg}/award", payload: {}, as: ProcurementLead }
            - call: "POST /rollout/change-orders"
              payload: { site_id: "${site}", description: "Foundation remediation", amount_cents: 600000, cost_category: "SCOPE" }
              as: SiteSuperintendent
              as_user_id: "sup-1"
              captures: { co1: $.data.id }
            - call: "GET /rollout/sites/${site}"
              payload: {}
              as: ProgramDirector
              captures: { sv1: $.data.version }
          trigger:
            - { call: "POST /rollout/change-orders/${co1}/approve", payload: { expected_site_version: "${sv1}" }, as: ProgramDirector, as_user_id: "dir-1" }
            - { call: "POST /rollout/change-orders/${co1}/rescind", payload: { rescind_reason: "scope reverted to prototype" }, as: FinanceController, as_user_id: "fin-1" }
            - call: "GET /rollout/programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { com_after: $.data.committed_cents, res_after: $.data.contingency_reserved_cents, post_after: $.data.budget_posture }
            - call: "GET /rollout/sites/${site}"
              payload: {}
              as: ProgramDirector
              captures: { aco_after: $.data.approved_co_cents }
          assert:
            - "RolloutProgram.${prog}.committed_cents == 9000000 after approve+rescind (was 9000000 before the pair)"
            - "RolloutProgram.${prog}.contingency_reserved_cents == 0 after rescind"
            - "RolloutProgram.${prog}.budget_posture == WITHIN_PLAN after rescind"
            - "Site.${site}.approved_co_cents == 0 after rescind"
            - "ChangeOrder.${co1}.status == RESCINDED"

      - name: vendor_schedule_cancel_capacity_conservation
        grounds:
          - calculations.market_crew_day_capacity
          - state_machines.VendorMobilization.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is crew-day capacity (not money): scheduling a
          FIXTURE window on site A consumes the single market crew for days
          2026-06-10..2026-06-20, blocking site B's overlapping window;
          cancelling A's mobilization returns per-day usage to baseline, so B's
          identical window then schedules — proving the schedule/cancel pair
          conserves the capacity map.
        test_recipe:
          setup:
            - "Market with max_concurrent_vendor_crews 1; awarded sites A and B both IN_BUILD"
          setup_api_calls:
            - { call: "POST /rollout/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramDirector }
