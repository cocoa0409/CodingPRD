      - name: backcross_marker_cycles_loop_then_convert_and_write_the_trait_score
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BackcrossProject
          - calculations.marker_recovery_pct
          - entities.BreedingLine.fields.disease_resistance_scores
          - errors[ERR_PROJECT_NOT_ACTIVE]
        distinguishing_aspect: "ACTIVE -> ACTIVE is a counted self-loop whose side-effect ORDER is pinned - bc_generation is incremented BEFORE marker_recovery_pct runs - so the three cycles read 90.000, 96.250, 99.375 rather than 75.000, 90.000, 96.250; the third crosses CONVERSION_THRESHOLD_PCT 99.0 and its cross-aggregate effect must overwrite the recurrent line's SDS score 4 with CONVERTED_TRAIT_SCORE 8, after which a fourth cycle is refused with ERR_PROJECT_NOT_ACTIVE."
        test_recipe:
          setup:
            - "One program, one objective, recurrent line SX-1002 (SDS score 4) and donor line SX-1001 (SDS score 7)."
