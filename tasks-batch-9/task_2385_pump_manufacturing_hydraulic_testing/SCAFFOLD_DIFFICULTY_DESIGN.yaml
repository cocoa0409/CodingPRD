      - name: pattern_asset_wear_refurbishment_cycle_restarts_wear_curve
        grounds:
          - state_machines.PatternAsset.QUALIFIED_to_WORN
          - state_machines.PatternAsset.WORN_to_IN_REFURB
          - state_machines.PatternAsset.IN_REFURB_to_QUALIFIED
          - calculations.pattern_wear_index
          - state_machines.PumpModel.PATTERN_CONSTRAINED_to_ORDERABLE
          - entities.PatternAsset.fields.refurb_cycles
        distinguishing_aspect: |
          Cyclic shape on the tooling entity: PatternAsset re-enters QUALIFIED after
          QUALIFIED -> WORN -> IN_REFURB -> QUALIFIED, and the loop is not a no-op - it resets
          pours_since_refurb, defect_pours_since_refurb and wear_index to 0 and increments
          refurb_cycles, so a pour that previously pushed wear_index to 3 against a threshold of
          2 leaves the refurbished pattern at wear_index 1 and QUALIFIED.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH ACTIVE; PumpModel HSC-14 ORDERABLE; PatternAsset PAT-HSC14-A with wear_threshold 2, the model's only pattern."
            - "CastingLot H-9001 (4 pieces, window 2026-08-05 to 2026-08-10) poured from PAT-HSC14-A, which lifted pours_since_refurb to 1."
            - "One CRITICAL CastingDefect on that lot lifted defect_pours_since_refurb to 1 and wear_index to 1 + 2 * 1 = 3, driving PAT-HSC14-A to WORN and HSC-14 to PATTERN_CONSTRAINED."
            - "The defect was dispositioned USE_AS_IS by a different actor than the reporter and the lot is ACCEPTED, so no lot blocks refurbishment."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
