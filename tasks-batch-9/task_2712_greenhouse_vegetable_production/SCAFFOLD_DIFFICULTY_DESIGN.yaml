            - call: "POST /bio-control-releases/${rel1}/transitions"
              payload: { to_status: "REQUESTED", decision_reason: "Split the release across two days" }
              as: IPMCoordinator
              as_user_id: "${w_coord}"
              captures: { rev_after_first_return: $.data.revision_count, approved_after_first_return: $.data.approved_release_count }
            - call: "POST /bio-control-releases/${rel1}/approve"
              payload: { revised_release_count: 5500 }
              as: IPMCoordinator
              as_user_id: "${w_coord}"
              captures: { approved_2: $.data.approved_release_count }
            - call: "POST /bio-control-releases/${rel1}/transitions"
              payload: { to_status: "REQUESTED", decision_reason: "Coordinator wants a fresh scouting count first" }
              as: IPMCoordinator
