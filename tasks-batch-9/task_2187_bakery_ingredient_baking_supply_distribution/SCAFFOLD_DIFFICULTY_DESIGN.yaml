          Third domain slice of the same dual-variant pair: under pricing_mode ORDER_DATE_INDEX the
          final_delivery_date variant resolves obs_date to order.order_placed_on (2026-08-05), so
          the 2026-09-10 quote at 47 c/lb is NOT prevailing and the finalized unit price stays 44
