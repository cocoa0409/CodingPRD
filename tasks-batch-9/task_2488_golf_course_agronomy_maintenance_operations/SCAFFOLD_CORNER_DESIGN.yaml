              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_a_id: $.data.id }
            - call: "POST /irrigation-runs/${run_a_id}/complete"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "GET /courses/${course_id}/water-assessment"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { tier_1: $.data.tier, base_1: $.data.base_charge, total_1: $.data.total_charge }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_b_id}", turf_area_id: "${green3_id}", window_start: "2026-08-05T05:00:00Z", window_end: "2026-08-05T06:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_b_v}" }
              as: Agronomist
