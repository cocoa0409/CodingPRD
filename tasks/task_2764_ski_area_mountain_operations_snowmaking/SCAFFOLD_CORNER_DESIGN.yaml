            - "Trigger 4: HTTP 409 with data.error_id == 'ERR_DAY_PLAN_NOT_PUBLISHED' - the only remaining plans are DAY_CLOSED and DRAFT, so priority 13 passes (PAUSED accepts RUNNING) and priority 16 fires."
            - "Trigger 5: the session is still 'PAUSED' with its accumulated_run_minutes unchanged by the rejected resume."
            - "The season is still OPERATING (close-day was not season_final), so the rejection is attributable to the selector and not to priority 11."

      - name: pump_capacity_sweep_treats_touching_windows_as_disjoint
        claim_type: interval_merge
        grounds:
          - calculations.pump_capacity_sweep
          - errors[ERR_PUMP_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: pump_house_aggregate_gpm_half_open_sweep_rejects_and_admits_touching_window
          rationale: "The section 1.8 instance builds the exact boundary-pair sweep this claim needs: two overlapping peers on separate areas, one create rejected on the [11:00, 12:00) pair and a second create at [12:00, 14:00) admitted because touching intervals do not overlap, with peak_committed_gpm asserted at 2100 from a pair the new session never intersects."

      - name: energy_cost_rounds_each_window_before_summing
        claim_type: precision
        grounds:
          - calculations.snowmaking_energy_cost
          - entities.SnowmakingSession.fields.energy_cost_usd
        excluded_because:
          difficulty_instance: energy_cost_per_window_rounding_order_on_snowmaking_session
          rationale: "The section 1.8 combinatorial instance already pins the per-window rounding order at 106.20 against the 106.19 that summing unrounded costs produces, and pins the surcharge composition at 118.94 against the 118.93 of a single final rounding. A separate corner test could only restate it."

      - name: guest_capacity_threshold_is_evaluated_once_on_raw_ccc
        claim_type: constraint_propagation
        grounds:
          - calculations.day_guest_capacity
          - entities.DayPlan.fields.guest_capacity
        excluded_because:
          difficulty_instance: guest_capacity_evaluation_order_on_raw_ccc
          rationale: "The section 1.8 instance drives the single-pass rule directly: it asserts 918 where re-testing the density on the reduced figure would revert the factor to 1.00 and report 1080, which is the only observable difference between one pass and a fixed-point loop."

      - name: base_depth_min_of_stakes_variant_holds_terrain_that_mean_would_open
        claim_type: variant_divergence
        grounds:
          - calculations.terrain_base_depth
          - errors[ERR_BASE_DEPTH_INSUFFICIENT]
        excluded_because:
          difficulty_instance: base_depth_policy_variant_divergence_on_terrain_area
          rationale: "The section 1.8 dual-variant instance runs one identical reading set under both policies in two seasons and asserts the divergence (34.3 versus 27.6) plus the opposite opening outcomes, which subsumes any single-variant corner test."

      - name: metered_actual_bills_only_the_minutes_actually_spent_running
        claim_type: variant_divergence
        grounds:
          - calculations.snowmaking_water_volume
          - entities.SnowmakingSession.fields.water_af_actual
        excluded_because:
          difficulty_instance: water_volume_variant_divergence_on_snowmaking_session
          rationale: "The section 1.8 dual-variant instance reserves 1.547 AF on the declared window, meters 1.326 AF over 360 running minutes and asserts the reservation retirement delta on the season ledger, covering variant selection, divergence and reconciliation in one recipe."

      - name: snow_accounting_excludes_aborted_sessions_from_all_three_ledgers
        claim_type: input_set_filtering
        grounds:
          - calculations.season_snow_accounting
          - entities.SeasonConfig.fields.water_used_af
        excluded_because:
          difficulty_instance: season_water_ledger_conserved_across_session_abort
          rationale: "The section 1.8 compensating-invariant instance asserts the full identity water_used_af + water_reserved_af + water_right_remaining_af == water_right_seasonal_af before and after an abort, which is a strictly stronger statement than the filtering claim on its own."

      - name: incident_response_minutes_rounds_half_up_at_thirty_seconds
        claim_type: precision
        grounds:
          - calculations.incident_response_minutes
          - entities.PatrolIncident.fields.response_minutes
        excluded_because:
          difficulty_instance: incident_dispatch_cascade_depth_three_to_day_plan_posture
          rationale: "The section 1.8 cascade instance dispatches at exactly 7 minutes 30 seconds after the report and asserts response_minutes == 8 against the 7 that truncation would give, so the rounding mode is already pinned at its boundary."

      - name: session_start_above_twenty_seven_wet_bulb_is_rejected
        claim_type: threshold
        grounds:
          - calculations.snowmaking_wet_bulb_yield
          - errors[ERR_WET_BULB_TOO_WARM]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: wet_bulb_at_exactly_27_0_starts_session_and_27_1_rejects
          rationale: "The section 1.8 boundary instance tests 27.0 and 27.1 back to back on the same session, asserting both the accepted start with snow_yield_factor 0.60 and the rejection with the row left SCHEDULED."

      - name: an_empty_reading_set_yields_a_zero_base_depth
        claim_type: aggregation
        grounds:
          - calculations.terrain_base_depth
          - errors[ERR_BASE_DEPTH_INSUFFICIENT]
        excluded_because:
          difficulty_instance: empty_reading_set_yields_zero_base_depth_on_opening_decision
          rationale: "The section 1.8 boundary instance drives the opening decision on an area with no readings at all and asserts base_depth_in 0.0, base_depth_stake_count 0 and ERR_BASE_DEPTH_INSUFFICIENT, covering the empty-input branch end to end."

  - section: validations
    instances:
      - name: a_reading_measured_after_the_logical_clock_is_rejected_at_the_second
        claim_type: temporal_validation
        grounds:
          - validations[priority=9]
          - errors[ERR_READING_TIMESTAMP_FUTURE]
          - entities.SnowDepthReading.fields.measured_at
        distinguishing_aspect: |
          The rule is "not after the logical clock", so a measured_at equal to the clock to the second is
          ACCEPTED and one second later is rejected. Both halves are exercised against the same clock so
          the test distinguishes a correct >= comparison from a > comparison and from a day-granularity
          comparison. The rejection must also leave the area derivation untouched, which is what proves
          the validation ran before the base-depth recompute.
        test_recipe:
          setup:
            - "A season with one inspected lift and one terrain area; logical clock 2026-08-01T06:00:00Z; no readings yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 40.0, measured_at: "2026-08-01T06:00:01Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 40.0, measured_at: "2026-08-01T06:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S2", depth_in: 36.0, measured_at: "2026-08-01T05:59:59Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
          assert:
            - "Trigger 1: HTTP 422 with data.error_id == 'ERR_READING_TIMESTAMP_FUTURE'."
            - "Trigger 2: the area base_depth_in == 0.0 and base_depth_stake_count == 0 - the rejected reading changed nothing."
            - "Trigger 3: HTTP 201 - a measured_at exactly equal to the logical clock is not in the future."
            - "Trigger 4: HTTP 201, and the area now reports base_depth_in == 38.0 with base_depth_stake_count == 2."
            - "GET snow-depth-readings for the area reports total_count == 2, so the rejected row was never persisted."

      - name: a_session_window_that_is_not_strictly_increasing_is_rejected_before_any_capacity_work
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_WINDOW_INVALID]
          - entities.SnowmakingSession.fields.planned_minutes
        distinguishing_aspect: |
          window_start < window_end is strict, so a zero-length window is as invalid as a reversed one.
          Priority 6 sits far above the pump sweep (42), the plant sweep (43) and the water right (44), so
          a malformed window must never reach the reservation arithmetic: the season water ledger and the
          pump house occupancy must both be untouched, and the area must still be CLOSED because the
          CLOSED -> PREP side effect belongs to a successful create only.
