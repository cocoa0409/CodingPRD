      - name: credit_application_branching_conditional_vs_approved
        grounds:
          - state_machines.CreditApplication.status
          - calculations.credit_decision
          - entities.CreditApplication.fields.decision_reason
          - entities.CreditApplication.fields.conditional_down_payment_required_cents
          - endpoints.POST_/credit-applications/{id}/decision
        distinguishing_aspect: |
          CreditApplication.status is a three-way branching fork out of one state: the single
          trigger POST /credit-applications/{id}/decision splits SUBMITTED into APPROVED,
          CONDITIONAL_APPROVED or DECLINED purely on where exposure_at_decision_cents falls
          relative to credit_limit_cents (80000) and the derived conditional_ceiling
          (80000 * 12500 / 10000 = 100000). The middle branch is the one that cannot be
          collapsed: at 89900 it must mint conditional_down_payment_required_cents 9900 and
          approved_principal_cents 80000, while the outer branches must both leave that field
          at 0 for opposite reasons. A two-way approve/decline implementation, or one that
          keys the ceiling off the requested principal instead of the band limit, fails here.
        test_recipe:
          setup:
            - "One customer with outstanding_principal_cents 0 and three SUBMITTED applications: two on Handset B (retail 89900, requested_principal 89900) and one on Handset A (retail 119900, requested_principal 119900)."
            - "No loan is originated in this test, so exposure_at_decision_cents equals the application's requested_principal_cents on every decision."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
