              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_SELFPAY", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
          trigger:
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_SELFPAY", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_PATIENT_VERSION"

      - name: occ_rate_stale_contract_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[rate-ingest-stale-contract]'
          - 'errors[ERR_STALE_CONTRACT_VERSION]'
        distinguishing_aspect: "After a first rate ingest advances PayerContract.version from 1 to 2, a second ingest for the same (contract, procedure) still carrying the pre-ingest version is rejected with ERR_STALE_CONTRACT_VERSION (412)."
        test_recipe:
          setup: ["A DRAFT contract at version 1 and a procedure; one rate ingested (contract now version 2)."]
          setup_api_calls:
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id, con_v0: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 200000, expected_contract_version: "${con_v0}" }
              as: PayerAnalyst
          trigger:
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 250000, expected_contract_version: "${con_v0}" }
              as: PayerAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_CONTRACT_VERSION"

      - name: version_increments_on_contract_activate
        claim_type: optimistic_concurrency
        grounds:
          - entities.PayerContract.fields.status
          - state_machines.PayerContract.DRAFT_to_ACTIVE
        distinguishing_aspect: "Activating a DRAFT contract increments its version from 1 to 2 and sets status=ACTIVE."
        test_recipe:
          setup: ["A DRAFT contract at version 1."]
          setup_api_calls:
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
          assert:
            - "response.data.status == ACTIVE"
            - "response.data.version == 2"

      - name: settlement_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
        excluded_because:
          difficulty_instance: transitive_cascade / tc_settlement_chain_depth3
          rationale: "The complete -> settle -> accumulate -> sibling-stale chain is asserted by the named §1.8 instance."

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_issue_reflected_in_response
        claim_type: immediate
        grounds:
          - 'endpoints["POST /estimates/{id}/issue"]'
        distinguishing_aspect: "Issuing an estimate returns the fully computed money fields in the same response (allowed_amount_cents=200000, patient_responsibility_cents=122500) — no read-after-write lag."
        test_recipe:
          setup: ["A fresh patient, ACTIVE contract, FLAT 200000 rate, single-line insured estimate in DRAFT."]
          setup_api_calls:
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat AF", member_id: "M-AF", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 200000, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_id}" }
              as: ProviderStaff
          trigger:
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
          assert:
            - "response.data.status == ISSUED"
            - "response.data.allowed_amount_cents == 200000"
            - "response.data.patient_responsibility_cents == 122500"
