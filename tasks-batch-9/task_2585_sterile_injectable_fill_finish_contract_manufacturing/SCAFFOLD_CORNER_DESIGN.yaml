    instances:
      - name: every_path_id_resolves_or_returns_its_own_entity_not_found_code
        claim_type: catalogue_reachability
        grounds:
          - validations[priority=30]
          - errors[ERR_CLIENT_PROJECT_NOT_FOUND]
          - errors[ERR_MEDIA_FILL_NOT_FOUND]
          - errors[ERR_QUALIFICATION_NOT_FOUND]
          - errors[ERR_COMPONENT_LOT_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_IN_PROCESS_CHECK_NOT_FOUND]
          - errors[ERR_EM_SAMPLE_NOT_FOUND]
          - errors[ERR_DEVIATION_NOT_FOUND]
          - errors[ERR_BR_REVIEW_NOT_FOUND]
          - errors[ERR_AUDIT_ENGAGEMENT_NOT_FOUND]
        distinguishing_aspect: "Priority 30 must raise the code belonging to the entity that failed to resolve, not one shared 404: ten reads of the same syntactically valid but absent id against ten different collections yield ten distinct error ids, and the AuditEngagement code is only reachable through POST /audit-engagements/{id}/host because the catalogue declares no GET by id for it."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned; the id 00000000-0000-4000-8000-000000000000 exists in no collection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "GET /client-projects/00000000-0000-4000-8000-000000000000"
              as: ProgramManager
            - call: "GET /media-fills/00000000-0000-4000-8000-000000000000"
              as: MicrobiologyAnalyst
            - call: "GET /personnel-qualifications/00000000-0000-4000-8000-000000000000"
              as: ProgramManager
            - call: "GET /component-lots/00000000-0000-4000-8000-000000000000"
              as: ProgramManager
            - call: "GET /component-reservations/00000000-0000-4000-8000-000000000000"
              as: ProgramManager
            - call: "GET /in-process-checks/00000000-0000-4000-8000-000000000000"
              as: ProgramManager
            - call: "GET /em-samples/00000000-0000-4000-8000-000000000000"
              as: MicrobiologyAnalyst
            - call: "GET /deviations/00000000-0000-4000-8000-000000000000"
              as: ProgramManager
            - call: "GET /batch-record-reviews/00000000-0000-4000-8000-000000000000"
