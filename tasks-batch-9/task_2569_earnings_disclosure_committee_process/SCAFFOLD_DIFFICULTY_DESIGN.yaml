      - name: tie_out_tier_multiplier_recomputed_from_snapshot_total_across_whole_item_set
        grounds:
          - calculations.tie_out_variance_and_tolerance_escalation
          - entities.TieOutItem.fields.raw_variance_bp
          - entities.TieOutItem.fields.effective_tolerance_bp
          - entities.DraftDocument.fields.tie_out_total_variance_bp
          - entities.DraftDocument.fields.tie_out_tier_multiplier
          - entities.DraftDocument.fields.tie_out_status
          - state_machines.TieOutItem.MATCHED_to_VARIANCE
        distinguishing_aspect: |
          MODE (c) intermediate reuse: the per-item MATCHED/VARIANCE decision consumes a document-wide
          intermediate (tie_out_total_variance_bp -> tie_out_tier_multiplier) that is itself computed
          from the STEP-1 snapshot of the same item set, and the whole set is re-evaluated on every
          write. Adding a third item whose own raw variance is 81 bp pushes the document total from
          1 bp to 82 bp, crossing TIGHT_MAX_BP, which retroactively tightens the two already-MATCHED
          items from an effective tolerance of 25 to floor(25 * 0.75) = 18 without changing either
          row's stored tolerance_bp. An implementation that evaluates only the row being written, or
          that re-reads statuses instead of the STEP-1 snapshot, cannot produce 82 / 0.75 / [18, 18, 75].
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 1, required_functions [FINANCE]) with one ACTIVE voting non-officer FINANCE member."
            - "A ReportingCycle in CLOSE_OPEN and a DraftDocument in DRAFT of doc_type PERIODIC_FILING authored by that member."
            - "Two TieOutItem rows already MATCHED under a tier multiplier of 1.00: (4120000 vs 4120000, tolerance 25 bp) and (812500 vs 812400, tolerance 25 bp); document tie_out_total_variance_bp is 1 and tie_out_status is PASSED."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Tie-Out Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
