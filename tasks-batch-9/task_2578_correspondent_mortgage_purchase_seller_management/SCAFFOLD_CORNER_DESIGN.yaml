          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Seller Harbor Point with tin 823391045; product CONF30F ${p_conf} carrying adjustment LLPA-F700-L85; product CONF15F ${p_conf15} with no adjustments"
