          trigger:
            - call: "GET /observations/${obs}"
              payload: {}
              as: DataSteward
              captures: { obs_ver_after: $.data.instrument_version, obs_status: $.data.review_status }
          assert:
            - "observation.instrument_version == 1 both at creation and after v2 publishes (pin immutable)"
            - "observation.review_status still == PENDING (instrument lifecycle does not touch observations)"

      - name: engagement_terminated_before_activation_blocks_activate
        claim_type: scheduled_action_cancellation
        grounds: [state_machines.VendorEngagement.PROPOSED_to_TERMINATED, state_machines.VendorEngagement.PROPOSED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A PROPOSED engagement can be cancelled via terminate before its window opens; once TERMINATED, the scheduled activate transition is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["program ACTIVE; engagement PROPOSED"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Cancel", code: "CNC" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc1: $.data.id }
            - call: "POST /programs/${prog}/vendor-engagements"
              payload: { vendor_name: "CancelCo", scope_program_cycle_ids: ["${cyc1}"], access_start: "2026-09-01T00:00:00Z", access_end: "2026-10-01T00:00:00Z", deliverable_due: "2026-10-10T00:00:00Z" }
              as: ProgramDirector
              captures: { eng: $.data.id }
          trigger:
            - call: "POST /vendor-engagements/${eng}/terminate"
              payload: {}
              as: ProgramDirector
              captures: { eng_status: $.data.status }
            - call: "POST /vendor-engagements/${eng}/activate"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "terminate from PROPOSED: status == TERMINATED"
            - "subsequent activate: HTTP 409, error_id == ERR_INVALID_STATE"

      - name: variant_divergence_attainment_covered
        claim_type: variant_divergence
        grounds: [calculations.indicator_attainment]
        excluded_because:
          difficulty_instance: indicator_attainment_provisional_vs_final
          rationale: "Both attainment variants with literal expected values are asserted in the named difficulty instance."

      - name: variant_divergence_dq_covered
        claim_type: variant_divergence
        grounds: [calculations.dq_score]
        excluded_because:
          difficulty_instance: dq_score_standard_vs_strict
          rationale: "STANDARD vs STRICT dq variants over identical data are asserted in the named difficulty instance."

      - name: milestone_deferred_until_due_covered
        claim_type: boundary_edge
        grounds: [calculations.milestone_evaluation]
        excluded_because:
          difficulty_instance: milestone_due_inclusive_boundary
          rationale: "Deferred execution at the inclusive due boundary (and exclusion one second later) is asserted in the named difficulty instance."

      - name: dq_gate_boundary_pass_covered
        claim_type: boundary_edge
        grounds: ["validations[priority=21]"]
        excluded_because:
          difficulty_instance: dq_gate_exactly_80_passes
          rationale: "The inclusive 80.00 gate pass (raw 79.999 rounding to 80.00) is asserted in the named difficulty instance; the failing side is covered by corner instance dq_gate_below_threshold_and_internal_exempt."

      - name: consent_revoke_cascade_covered
        claim_type: side_effect_execution
        grounds: [state_machines.ConsentRecord.GRANTED_to_REVOKED]
        excluded_because:
          difficulty_instance: consent_revoke_depth3
          rationale: "The full revoke -> withdraw -> exclude -> recompute cascade is asserted hop-by-hop in the named difficulty instance."

      - name: instrument_publish_cascade_covered
        claim_type: side_effect_execution
        grounds: [state_machines.Instrument.DRAFT_to_PUBLISHED]
        excluded_because:
          difficulty_instance: instrument_publish_depth2
          rationale: "The publish -> retire-predecessor -> stale-certification cascade is asserted hop-by-hop in the named difficulty instance."

  # ==========================================================================
  # Section: consistency_model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_consistency
        grounds: [complexity_profile, entities.ProgramCycle.fields.total_observation_count]
        distinguishing_aspect: "The consistency model is immediate: the observation create response already carries pinned fields (instrument_version 1, collected_by_id collector-1, review_status PENDING, is_late false), and the very next GET on the cycle shows total_observation_count 1 — no reconciliation lag."
        test_recipe:
          setup: ["cycle ACTIVE; participant ACTIVE with consent; instrument published; collector certified"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Immediate", code: "IMM" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "I1", level: "OUTCOME", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { ind1: $.data.id }
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /programs/${prog}/instruments"
              payload: { code: "SURV", title: "Survey" }
              as: EvaluationLead
              captures: { instr: $.data.id }
            - call: "POST /instruments/${instr}/publish"
              payload: {}
              as: EvaluationLead
            - call: "POST /certifications"
              payload: { staff_user_id: "collector-1", instrument_id: "${instr}", expires_at: "2027-01-01T00:00:00Z" }
              as: EvaluationLead
          trigger:
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${ind1}", instrument_id: "${instr}", value: 10, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { o_ver: $.data.instrument_version, o_by: $.data.collected_by_id, o_status: $.data.review_status, o_late: $.data.is_late }
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: DataSteward
              captures: { cyc_total: $.data.total_observation_count }
          assert:
            - "create response: instrument_version == 1, collected_by_id == collector-1, review_status == PENDING, is_late == false"
            - "immediately after: cycle.total_observation_count == 1"

