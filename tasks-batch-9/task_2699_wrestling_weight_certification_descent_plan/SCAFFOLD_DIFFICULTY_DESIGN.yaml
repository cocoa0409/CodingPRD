  - rule_id: compensating_invariant
    instances:
      - name: team_severity_ledger_restored_by_dismissal
        conserved_quantity: "Team.open_flag_severity_total == SUM(HealthFlag.severity) over that team's flags with status IN {OPEN, ESCALATED} — a weighted severity ledger"
        grounds:
          - calculations.team_compliance_posture
          - entities.Team.fields.open_flag_severity_total
          - state_machines.HealthFlag.OPEN_to_DISMISSED
          - state_machines.Wrestler.ELIGIBLE_to_RESTRICTED
          - state_machines.Wrestler.RESTRICTED_to_ELIGIBLE
        distinguishing_aspect: |
          The conserved quantity is a WEIGHTED SUM of severities, so the compensating action has to
          restore an exact non-zero value: after dismissing the severity-4 weigh-in-deficit flag the
          ledger must read exactly 1 (the surviving hydration flag) — not 0 and not 5. The posture
          and the wrestler's eligibility dimension both unwind with it while the certification
          dimension never moves.
        test_recipe:
          setup:
            - "One OPEN Season with no growth allowances; Alex Mercer CERTIFIED / ELIGIBLE via a certified WEEKLY_STEP plan (minimum_certified_weight_lbs 147.6, lowest eligible class 150 on 2026-12-12)."
            - "One finalized hydration-failed assessment has already raised an OPEN HYDRATION_FAIL flag (severity 1), so Team.open_flag_severity_total is 1 and compliance_status is WATCH; Alex stays ELIGIBLE because the plan was certified while the team was still CLEAR."
            - "Event 'Region Duals' dated 2026-12-12 in status WEIGH_IN_OPEN with Alex's ENTERED entry at weight_class_lbs 150; the clock is at 2026-12-12T08:00:00Z."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
