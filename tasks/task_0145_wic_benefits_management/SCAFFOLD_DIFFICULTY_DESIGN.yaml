      - name: peer_session_buffer_overlap
        grounds:
          - calculations.appointment_overlap
          - calculations.appointment_overlap.constants.SESSION_BUFFER_MINUTES
          - state_machines.PeerSupportSession.initial_state
        distinguishing_aspect: "Counselor resource, 15-minute travel buffer: a session starting 10 minutes after the prior session ends collides (gap 10 < 15), whereas the clinic rule would have allowed a 0-gap adjacency — different interval semantics on a different resource entity."
        test_recipe:
          setup:
            - "A SCHEDULED peer session [10:00,10:30] for counselor pc-1."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency P", state_code: "CA", caseload_cap: 50 }
