              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dbg}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dbg}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rg: "$.data.id" }
            - call: "POST /rolls/${rg}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dbg}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 1, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bg: "$.data.id" }
            - call: "POST /bonds/${bg}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-31T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /installments"
              payload: { parcel_id: "${pg}", installment_year: 1 }
              as: Auditor
              captures: { ig: "$.data[0].id" }
          trigger:
            - call: "POST /installments/${ig}/mark-delinquent"
              payload: {}
              as: CountyTreasurer
          assert:
            - "Installment.${ig}.status == DELINQUENT"
            - "Installment.${ig}.penalty_cents > 0"

  # =========================================================================
