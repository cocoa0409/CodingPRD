# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Auto Dealership Management (DMS) — EXPERT — breadth probe.
# Walks references/claim-extraction-guide.md against this scaffold's §1.1-§1.7.
# excluded_because stubs cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: vehicle_create_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Vehicle, endpoints.POST_/vehicles]
        distinguishing_aspect: "POST /vehicles with all required fields -> 201; response carries server-minted id, created_at, version==1, status==AVAILABLE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000001", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id, v_status: $.data.status, v_ver: $.data.version }
          assert:
            - "response status == 201"
            - "Vehicle.${v_id}.status == AVAILABLE and version == 1"

      - name: vehicle_get_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Vehicle, "errors[ERR_NOT_FOUND]", "endpoints.GET_/vehicles/{id}"]
        distinguishing_aspect: "GET /vehicles/{unknown-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and data.error_id == ERR_NOT_FOUND"

      - name: vehicle_create_missing_required_vin_returns_422
        claim_type: Required Fields
        grounds: [entities.Vehicle.fields.vin, "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "POST /vehicles omitting vin -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: vehicle_create_bad_vin_length_returns_422
        claim_type: Type Constraints
        grounds: [entities.Vehicle.fields.vin, "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "VIN not exactly 17 chars -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "SHORTVIN", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: vehicle_create_bad_condition_enum_returns_422
        claim_type: Type Constraints
        grounds: [entities.Vehicle.fields.condition, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "condition not in {NEW,USED} -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000003", condition: "SALVAGE", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: vehicle_duplicate_vin_returns_409
        claim_type: Type Constraints
        grounds: [entities.Vehicle.fields.vin, "errors[ERR_VIN_DUPLICATE]", "validations[priority=6]"]
        distinguishing_aspect: "Second POST /vehicles with an existing VIN -> 409 ERR_VIN_DUPLICATE."
        test_recipe:
          setup: ["One vehicle with vin 1HGAC1ANCM2000004 exists."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000004", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000004", condition: "USED", make: "ACME", model: "CPE", model_year: 2024, msrp_cents: 1800000, list_price_cents: 1600000 }
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_VIN_DUPLICATE"

      - name: deal_create_fk_not_found_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Deal.fields.vehicle_id, "errors[ERR_FK_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "POST /deals with a non-existent vehicle_id -> 404 ERR_FK_NOT_FOUND."
        test_recipe:
          setup: ["A customer exists; vehicle_id is bogus."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "FK Cust", email: "fk@x.com", monthly_income_cents: 2000000, credit_tier: "TIER_B", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /deals"
              payload: { vehicle_id: "00000000-0000-4000-8000-0000000000aa", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and data.error_id == ERR_FK_NOT_FOUND"

      - name: deal_computed_defaults_zero_on_create
        claim_type: Computed Fields
        grounds: [entities.Deal.fields.amount_financed_cents, entities.Deal.fields.rebate_cents, endpoints.POST_/deals]
        distinguishing_aspect: "On create (DRAFT, pre-desk), computed totals default: rebate_cents==0, fi_products_total_cents==0, trade_equity_cents==0."
        test_recipe:
          setup: ["A vehicle and customer exist."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000006", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Def Cust", email: "def@x.com", monthly_income_cents: 2000000, credit_tier: "TIER_B", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id, reb: $.data.rebate_cents }
          assert:
            - "response status == 201 and Deal.${d_id}.status == DRAFT"
            - "Deal.${d_id}.rebate_cents == 0 and fi_products_total_cents == 0 and trade_equity_cents == 0"

      - name: dealjacketdocument_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.DealJacketDocument, "endpoints.POST_/deals/{id}/documents"]
        distinguishing_aspect: "DealJacketDocument has common_fields:false -> response has id + created_at, no version, no update endpoint."
        test_recipe:
          setup: ["A DRAFT deal exists."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000007", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Doc Cust", email: "doc@x.com", monthly_income_cents: 2000000, credit_tier: "TIER_B", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "CREDIT_APP", uri: "s3://j/doc.pdf" }
              as: SalesManager
              captures: { doc_id: $.data.id }
          assert:
            - "response status == 201 and DealJacketDocument.${doc_id}.id present, created_at present"
            - "GET /deals/${d_id}/documents returns exactly 1 document with doc_type == CREDIT_APP"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: deal_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Deal, entities.Deal.fields.status]
        distinguishing_aspect: "A freshly created Deal starts in DRAFT."
        test_recipe:
          setup: ["A vehicle and customer exist."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000011", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Init Cust", email: "init@x.com", monthly_income_cents: 2000000, credit_tier: "TIER_B", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
          assert:
            - "Deal.${d_id}.status == DRAFT"

      - name: deal_submit_to_lender_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Deal.DESKING_to_SUBMITTED_TO_LENDER, "errors[ERR_INVALID_STATE]", "validations[priority=7]"]
        distinguishing_aspect: "submit-to-lender on a DRAFT (un-desked) deal -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT deal exists (not desked)."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000012", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Inv Cust", email: "inv@x.com", monthly_income_cents: 2000000, credit_tier: "TIER_B", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /deals/${d_id}/submit-to-lender"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: deal_terminal_dead_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Deal, state_machines.Deal.DRAFT_to_DEAD, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After kill (DEAD terminal), desking is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT deal is killed (DEAD)."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000013", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dead Cust", email: "dead@x.com", monthly_income_cents: 2000000, credit_tier: "TIER_B", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/kill"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: testdrive_complete_twice_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.TestDrive.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an already-COMPLETED test drive -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SCHEDULED test drive completed once."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000014", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "TD Cust", email: "tdc@x.com", monthly_income_cents: 2000000, credit_tier: "TIER_B", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /test-drives"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", start_at: "2026-06-20T09:00:00.000Z", end_at: "2026-06-20T09:30:00.000Z" }
              as: SalesManager
              captures: { td_id: $.data.id }
            - call: "POST /test-drives/${td_id}/complete"
              payload: {}
              as: SalesManager
          trigger:
            - call: "POST /test-drives/${td_id}/complete"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: title_dmv_reject_missing_reason_returns_422
        claim_type: Precondition Enforcement
        grounds: [state_machines.TitleRegistration.SUBMITTED_to_REJECTED, "errors[ERR_REJECTION_REASON_REQUIRED]"]
        distinguishing_aspect: "dmv-result REJECT without rejection_reason -> 422 ERR_REJECTION_REASON_REQUIRED."
        test_recipe:
          setup: ["A SUBMITTED TitleRegistration on a funded deal (reuse the funded-deal build, submit once)."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000015", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id, v_ver_create: $.data.version }
            - call: "POST /vehicles/${v_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 1800000, annual_rate_bps: 825, floored_on: "2026-05-01T00:00:00.000Z", expected_vehicle_version: "${v_ver_create}" }
              as: InventoryClerk
            - call: "POST /customers"
              payload: { full_name: "Rej Cust", email: "rej@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /lender-programs"
              payload: { lender_name: "CREDITONE", tier: "TIER_A", buy_rate_bps: 549, max_markup_bps: 200, max_ltv_bps: 12500, max_pti_bps: 1800, max_term_months: 72, active: true }
              as: FinanceManager
              captures: { lp_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "CREDIT_APP", uri: "s3://j/ca.pdf" }
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "INSURANCE", uri: "s3://j/ins.pdf" }
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "ODOMETER", uri: "s3://j/odo.pdf" }
              as: TitleClerk
            - call: "POST /deals/${d_id}/submit-to-lender"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/lender-decision"
              payload: { decision: "APPROVE", lender_program_id: "${lp_id}" }
              as: FinanceManager
              captures: { d_ver_appr: $.data.version }
            - call: "POST /deals/${d_id}/finance-contracts"
              payload: { lender_program_id: "${lp_id}", markup_bps: 100, term_months: 72, expected_deal_version: "${d_ver_appr}" }
              as: FinanceManager
            - call: "POST /deals/${d_id}/contract"
              payload: {}
              as: FinanceManager
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: FinanceManager
              captures: { v_ver_pre_fund: $.data.version }
            - call: "POST /deals/${d_id}/fund"
              payload: { expected_vehicle_version: "${v_ver_pre_fund}" }
              as: FinanceManager
            - call: "GET /title-registrations?deal_id=${d_id}"
              payload: {}
              as: TitleClerk
              captures: { tr_id: "$.data[0].id" }
            - call: "POST /title-registrations/${tr_id}/submit"
              payload: {}
              as: TitleClerk
          trigger:
            - call: "POST /title-registrations/${tr_id}/dmv-result"
              payload: { result: "REJECT" }
              as: TitleClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and data.error_id == ERR_REJECTION_REASON_REQUIRED"

      - name: recondition_complete_from_available_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Vehicle.RECON_to_AVAILABLE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "recondition-complete on an AVAILABLE (non-RECON) vehicle -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An AVAILABLE vehicle."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000016", condition: "USED", make: "ACME", model: "CPE", model_year: 2023, msrp_cents: 1800000, list_price_cents: 1600000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /vehicles/${v_id}/recondition-complete"
              payload: {}
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: unwind_blocked_by_accepted_title
        claim_type: Precondition Enforcement
        grounds: [state_machines.Deal.FUNDED_to_UNWOUND, "errors[ERR_TITLE_ALREADY_ACCEPTED]"]
        distinguishing_aspect: "unwind on a FUNDED deal whose TitleRegistration is ACCEPTED -> 409 ERR_TITLE_ALREADY_ACCEPTED."
        test_recipe:
          setup: ["A FUNDED deal whose title was submitted and DMV-ACCEPTED."]
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM2000017", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id, v_ver_create: $.data.version }
            - call: "POST /vehicles/${v_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 1800000, annual_rate_bps: 825, floored_on: "2026-05-01T00:00:00.000Z", expected_vehicle_version: "${v_ver_create}" }
              as: InventoryClerk
            - call: "POST /customers"
              payload: { full_name: "Acc Cust", email: "acc@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /lender-programs"
              payload: { lender_name: "CREDITONE", tier: "TIER_A", buy_rate_bps: 549, max_markup_bps: 200, max_ltv_bps: 12500, max_pti_bps: 1800, max_term_months: 72, active: true }
              as: FinanceManager
              captures: { lp_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "CREDIT_APP", uri: "s3://j/ca.pdf" }
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "INSURANCE", uri: "s3://j/ins.pdf" }
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "ODOMETER", uri: "s3://j/odo.pdf" }
              as: TitleClerk
            - call: "POST /deals/${d_id}/submit-to-lender"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/lender-decision"
              payload: { decision: "APPROVE", lender_program_id: "${lp_id}" }
              as: FinanceManager
              captures: { d_ver_appr: $.data.version }
            - call: "POST /deals/${d_id}/finance-contracts"
              payload: { lender_program_id: "${lp_id}", markup_bps: 100, term_months: 72, expected_deal_version: "${d_ver_appr}" }
              as: FinanceManager
            - call: "POST /deals/${d_id}/contract"
              payload: {}
              as: FinanceManager
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: FinanceManager
              captures: { v_ver_pre_fund: $.data.version }
            - call: "POST /deals/${d_id}/fund"
              payload: { expected_vehicle_version: "${v_ver_pre_fund}" }
              as: FinanceManager
            - call: "GET /title-registrations?deal_id=${d_id}"
              payload: {}
