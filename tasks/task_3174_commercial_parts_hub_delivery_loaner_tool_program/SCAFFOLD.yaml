# =============================================================================
# SCAFFOLD.yaml — Commercial Parts Hub Delivery & Loaner Tool Program
# Task: task_3174_commercial_parts_hub_delivery_loaner_tool_program
#
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines (+ §1.2.1
# Concurrency) · §1.3 Calculations · §1.4 Validations · §1.5 Endpoints ·
# §1.6 Errors · §1.7 RBAC
#
# Scaffold Difficulty Design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# Scaffold Corner Design lives in SCAFFOLD_CORNER_DESIGN.yaml. Neither key
# appears in this file.
# =============================================================================

scenario: |
  Commercial Parts Hub Delivery & Loaner Tool Program (AutoZone): commercial
  account setup for repair shops with credit terms, tiered pricing and delivery
  service levels, hub and mega-hub inventory strategy where deep assortment feeds
  surrounding stores within delivery windows, order fulfillment routing that
  checks store, hub and distribution center availability with promise times,
  loaner tool program with deposit, return condition inspection and replacement
  of worn tools, parts return and core charge processing including warranty
  replacement without receipt lookup, delivery driver routing across multiple
  shop stops with time commitments, part fitment lookup by vehicle with
  interchange and superseded part handling, commercial sales representative
  account coverage

domain_name: commercial-parts-hub-delivery
api_prefix: /commercial

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy
    - rate_threshold_triggers
    - soft_delete
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: CommercialAccount
    parent: null
    common_fields: true
    fields:
      - { name: shop_name, type: string, source: input, description: "Legal name of the repair shop" }
      - { name: tax_id, type: string, source: input, description: "Business tax identifier; unique across accounts" }
      - { name: billing_address, type: string, source: input, description: "Billing street address" }
      - { name: shipping_address, type: string, source: input, default: null, description: "Shop delivery address used for dispatches; falls back to billing_address when omitted; MUST NOT be assigned the account's home store when an order is delivered" }
      - { name: home_store_id, type: string, source: input, description: "FK -> Store.id; the Commercial Parts Store the account is homed to and that sources all its orders" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Approved revolving credit ceiling in cents" }
      - { name: credit_terms_days, type: integer, source: input, description: "Net terms window in days (30 = NET_30, 45 = NET_45, 60 = NET_60)" }
      - { name: tier, type: enum, source: system, default: "BRONZE", description: "SRP pricing tier: BRONZE | SILVER | GOLD | PLATINUM" }
      - { name: delivery_service_level, type: enum, source: input, description: "DELIVERY_DESK | SHOP_DELIVERY | HUB_DAILY | HOTSHOT" }
      - { name: petty_cash_cents, type: integer, source: system, default: 0, description: "Unapplied cash credit on the account, updated by loaner tool deposits and core credits" }
      - { name: credit_exposure_cents, type: integer, source: computed, description: "Read-only = sum over PartOrders in {DRAFT, CONFIRMED, ALLOCATED, PICKING, DISPATCHED} of parts_subtotal_cents + sum over ToolLoans with deposit_state HELD of deposit_amount_cents; DELIVERED, RETURNED and VOID orders contribute 0 because they have moved to the receivable" }
      - { name: deposit_liability_cents, type: integer, source: computed, description: "Read-only = sum over ToolLoans with deposit_state HELD of (deposit_amount_cents - deposit_forfeited_cents); petty_cash_cents minus this value is the store's conserved deposit position" }
      - { name: receivable_balance_cents, type: integer, source: computed, description: "Read-only = sum of captured_cents over non-VOID invoices on this account" }
      - { name: account_posture, type: enum, source: computed, description: "Computed, not client-settable: OPEN | ON_HOLD | CREDIT_SUSPENDED | CLOSED" }
      - { name: next_cutoff_at, type: datetime, source: computed, description: "Next delivery cutoff instant for this account's delivery schedule" }
      - { name: order_sequence, type: integer, source: system, default: 0, description: "Monotonic counter incremented on every order creation for this account" }
      - { name: is_archived, type: boolean, source: system, default: false, description: "Soft-delete flag; archived accounts are excluded from default list reads" }

  # ---------------------------------------------------------------------------
  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: vin, type: string, source: input, description: "17-character vehicle identification number; unique across vehicles" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: make, type: string, source: input, description: "Manufacturer name" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: engine_code, type: string, source: input, description: "Engine family code, e.g. 2.4L-I4, 3.6L-V6" }
      - { name: drive_type, type: enum, source: input, description: "FWD | RWD | AWD | FOUR_WD" }

  # ---------------------------------------------------------------------------
  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer part number; unique across the active catalogue" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: line_code, type: string, source: input, description: "Product line code" }
      - { name: list_price_cents, type: integer, source: input, description: "List price in cents before tier discount" }
      - { name: core_charge_cents, type: integer, source: input, default: 0, description: "Refundable core deposit in cents; 0 when the part has no core" }
      - { name: is_hazardous, type: boolean, source: input, default: false, description: "Whether the part ships under hazardous-materials rules" }
      - { name: is_returnable, type: boolean, source: input, default: true, description: "Whether the part may be returned after delivery; false for special-order and electrical parts" }
      - { name: is_archived, type: boolean, source: system, default: false, description: "Soft-delete flag; archived parts are excluded from default list reads" }
      - { name: superseded_by_part_id, type: string, source: input, description: "FK -> Part.id; the part that replaces this one, or null when this part is current" }
      - { name: supersession_depth, type: integer, source: computed, description: "Read-only: 0 when current, otherwise 1 + superseded_by_part.supersession_depth, resolved to the terminal current part" }

  # ---------------------------------------------------------------------------
  - name: ToolFitment
    parent: ToolCatalog
    common_fields: false
    fields:
      - { name: tool_catalog_id, type: string, source: system, description: "FK -> ToolCatalog.id; the tool the replacement part fits" }
      - { name: part_id, type: string, source: system, description: "FK -> Part.id; the replacement part" }
      - { name: placement, type: enum, source: input, description: "FRONT | REAR_LEFT | REAR_RIGHT | OTHER; the mount point on the tool" }
      - { name: depth_index, type: integer, source: input, description: "Assembly depth of the part within the tool; lower is preferred by the selector" }

  # ---------------------------------------------------------------------------
  - name: PartInterchange
    parent: Part
    common_fields: false
    fields:
      - { name: part_id, type: string, source: system, description: "FK -> Part.id; the catalogue part" }
      - { name: interchange_sku, type: string, source: input, description: "Competitor or alternate-vendor part number that is functionally equivalent" }
      - { name: interchange_brand, type: string, source: input, description: "Brand of the alternate part" }

  # ---------------------------------------------------------------------------
  - name: PartFitment
    parent: Part
    common_fields: false
    fields:
      - { name: part_id, type: string, source: system, description: "FK -> Part.id; the catalogue part" }
      - { name: year_from, type: integer, source: input, description: "First model year this part fits" }
      - { name: year_to, type: integer, source: input, description: "Last model year this part fits; MUST be >= year_from" }
      - { name: make, type: string, source: input, description: "Make this fitment applies to" }
      - { name: model, type: string, source: input, description: "Model this fitment applies to" }
      - { name: engine_code, type: string, source: input, default: "ANY", description: "Engine code this fitment applies to, or ANY" }
      - { name: drive_type, type: enum, source: input, default: "ANY", description: "FWD | RWD | AWD | FOUR_WD | ANY" }

  # ---------------------------------------------------------------------------
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Store number; unique across stores" }
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: store_type, type: enum, source: input, description: "SATELLITE | HUB | MEGA_HUB | DC" }
      - { name: hub_store_id, type: string, source: input, description: "FK -> Store.id; the hub or mega-hub this store is replenished from, or null for a hub/mega-hub/DC itself" }
      - { name: delivery_radius_miles, type: number, source: input, description: "Delivery radius in miles; the SHOP_DELIVERY source band is [0, 15] miles" }
      - { name: cutoff_hour_local, type: integer, source: input, default: 15, description: "Local hour at which the delivery cutoff falls; cutoff_at = date of request at this hour" }
      - { name: cutoff_buffer_minutes, type: integer, source: input, default: 30, description: "Minutes before the cutoff at which the ordering window closes" }
      - { name: promise_time_minutes, type: integer, source: input, description: "Quoted promise time in minutes for orders sourced from this store, before tier adjustment" }
      - { name: daily_capacity_units, type: integer, source: input, description: "Total units this store can commit across all open orders in one business day" }
      - { name: committed_units_today, type: integer, source: system, default: 0, description: "Units already committed against daily_capacity_units for the current business day" }
      - { name: capacity_epoch_at, type: datetime, source: system, default: "2026-09-01T00:00:00Z", description: "Instant at which committed_units_today was last reset" }
      - { name: is_archived, type: boolean, source: system, default: false, description: "Soft-delete flag; archived stores are excluded from default list reads" }

  # ---------------------------------------------------------------------------
  - name: InventoryItem
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the store, hub, mega-hub or DC that holds this stock line" }
      - { name: part_id, type: string, source: system, description: "FK -> Part.id; the part stocked on this line" }
      - { name: on_hand_units, type: integer, source: input, default: 0, description: "Units physically on the shelf, before reservations" }
      - { name: reserved_units, type: integer, source: system, default: 0, description: "Units committed to open orders but not yet delivered" }
      - { name: available_units, type: integer, source: computed, description: "Read-only = max(0, on_hand_units - reserved_units)" }

  # ---------------------------------------------------------------------------
  - name: SalesRep
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Sales representative email; unique across reps" }
      - { name: full_name, type: string, source: input, description: "Sales representative full name" }
      - { name: district_code, type: string, source: input, description: "District the rep covers" }
      - { name: home_store_id, type: string, source: input, description: "FK -> Store.id; the store the rep reports to" }
      - { name: active_account_count, type: integer, source: computed, description: "Read-only = count of non-archived CommercialAccounts whose home_store_id is assigned to this rep on the current coverage date" }

  # ---------------------------------------------------------------------------
  - name: RepCoverage
    parent: SalesRep
    common_fields: true
    fields:
      - { name: rep_id, type: string, source: system, description: "FK -> SalesRep.id; the representative providing coverage" }
      - { name: account_id, type: string, source: system, description: "FK -> CommercialAccount.id; the account being covered" }
      - { name: effective_from, type: datetime, source: input, description: "Instant at which this coverage assignment takes effect" }
      - { name: effective_to, type: datetime, source: input, description: "Instant after which this coverage assignment ends; MUST be > effective_from" }
      - { name: coverage_posture, type: enum, source: computed, description: "Read-only: ACTIVE | SCHEDULED | EXPIRED, derived from the logical clock against the effective window" }

  # ---------------------------------------------------------------------------
  - name: PartOrder
    parent: CommercialAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CommercialAccount.id; the ordering account" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; the vehicle the order is written against, or null for a stock order" }
      - { name: line_items, type: array, source: input, description: "Order lines: [{part_id, quantity, unit_price_cents}]" }
      - { name: member_sequence, type: integer, source: computed, description: "Read-only: 1 for the first order ever placed by this account, 2 for the second, and so on up to the account's highest member_sequence" }
      - { name: service_route_id, type: string, source: system, description: "FK -> ServiceRoute.id; the delivery route the order is committed to, or null until dispatched" }
      - { name: fulfillment_route, type: enum, source: computed, description: "Read-only routing decision: STORE | HUB | MEGA_HUB | DC | UNROUTABLE; SHORT is not a routing outcome, the HOTSHOT service level is what truncates the promise window on STORE and HUB sources" }
      - { name: reserved_unit_count, type: integer, source: computed, description: "Read-only count of units this order holds against its source store's InventoryItem.reserved_units" }
      - { name: pricing_band, type: enum, source: computed, description: "Read-only tier band resolved from CommercialAccount.order_sequence at creation: BRONZE | SILVER | GOLD | PLATINUM" }
      - { name: parts_subtotal_cents, type: integer, source: computed, description: "Read-only = sum over lines of unit_price_cents * quantity, computed per line and then summed" }
      - { name: core_charge_total_cents, type: integer, source: computed, description: "Read-only = sum over lines of Part.core_charge_cents * quantity" }
      - { name: tier_discount_cents, type: integer, source: computed, description: "Read-only: sum of per-line tier discounts, each rounded individually" }
      - { name: refundable_deposit_cents, type: integer, source: computed, description: "Read-only: amount due back on core return, computed by rounding the order-level core subtotal once" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "Read-only delivery fee, selected by the service-level breakpoint table" }
      - { name: promised_at, type: datetime, source: computed, description: "Read-only quoted delivery instant for this order" }
      - { name: delivered_at, type: datetime, source: system, description: "Instant the order was delivered; null until DELIVERED" }
      - { name: delivered_payment_due_at, type: datetime, source: computed, description: "Read-only = delivered_at + CommercialAccount.credit_terms_days; null until DELIVERED, and the input to the account posture aging test" }
      - { name: refundable_deposit_consumed_cents, type: integer, source: system, default: 0, description: "Cents of refundable_deposit_cents already paid out by credited CoreReturns on this order; the waterfall cap" }
      - { name: order_base_cents, type: integer, source: computed, description: "Read-only base captured ONCE at order creation from the creation-time line basket; line mutations after creation do not change it" }
      - { name: satisfaction_cents, type: integer, source: computed, description: "Read-only satisfaction score in cents, recomputed on every order-line mutation" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | ALLOCATED | PICKING | DISPATCHED | DELIVERED | RETURNED | VOID" }

  # ---------------------------------------------------------------------------
  - name: ToolLoan
    parent: CommercialAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CommercialAccount.id; the borrowing account" }
      - { name: tool_catalog_id, type: string, source: system, description: "FK -> ToolCatalog.id; the tool borrowed under this loan" }
      - { name: loaned_order_id, type: string, source: system, description: "FK -> PartOrder.id; the part order that triggered this loan, or null when the loan was requested standalone" }
      - { name: deposit_amount_cents, type: integer, source: input, description: "Deposit charged to the account at checkout, in cents" }
      - { name: deposit_state, type: enum, source: system, description: "UNCHARGED | HELD | APPLIED_TO_BALANCE | REFUNDED | FORFEITED" }
      - { name: loaned_at, type: datetime, source: system, description: "Instant the tool left the counter; null until CHECKED_OUT" }
      - { name: due_at, type: datetime, source: computed, description: "Read-only = loaned_at + 14 days; null until CHECKED_OUT" }
      - { name: returned_at, type: datetime, source: system, description: "Instant the tool came back to the counter; null until RETURNED" }
      - { name: overdue_days, type: integer, source: computed, description: "Read-only = floor((logical clock - due_at) / 86400) when OVERDUE, otherwise 0" }
      - { name: return_condition, type: enum, source: system, description: "Not set until inspection: GOOD | WORN | BROKEN | LOST" }
      - { name: deposit_forfeited_cents, type: integer, source: computed, description: "Read-only: the portion of deposit_amount_cents kept by the store after inspection" }
      - { name: replacement_part_id, type: string, source: system, description: "FK -> Part.id; the replacement part selected by the selector policy when the tool is WOEN, or null" }
      - { name: wear_intensity, type: number, source: computed, description: "Read-only integer 0-100 derived from tool wear_accumulated" }
      - { name: damage_multiplier, type: number, source: computed, description: "Read-only multiplier applied to the replacement part list price on a BROKEN return" }
      - { name: forfeiture_rate, type: number, source: computed, description: "Read-only fraction 0.00-1.00 of the deposit retained on inspection, selected from the severity band" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CHECKED_OUT | IN_USE | DUE | OVERDUE | RETURNED | INSPECTED | CLOSED | FORFEITED" }

  # ---------------------------------------------------------------------------
  - name: ToolCatalog
    parent: null
    common_fields: true
    fields:
      - { name: tool_sku, type: string, source: input, description: "Tool part number; unique across the tool catalogue" }
      - { name: tool_name, type: string, source: input, description: "Tool display name" }
      - { name: deposit_amount_cents, type: integer, source: input, description: "Standard deposit in cents charged at checkout" }
      - { name: replacement_part_id, type: string, source: system, description: "FK -> Part.id; the replacement part offered when a tool comes back worn or broken; re-selected by replacement_selection level 2 whenever the wear band advances" }
      - { name: replacement_unit_cost_cents, type: integer, source: input, description: "Store cost of the replacement part, used as the fallback base for the replacement charge" }
      - { name: wear_accumulated, type: number, source: system, default: 0, description: "Units of wear consumed by loans; incremented by 0.4 on every return whose condition is WORN or BROKEN" }
      - { name: wear_band, type: enum, source: computed, description: "Read-only LEVEL_1 | LEVEL_2 | LEVEL_3 | LEVEL_4 | LEVEL_5, selected from wear_accumulated" }
      - { name: wear_multiplier_rate, type: number, source: computed, description: "Read-only replacement price multiplier 1.00-2.00 selected from the wear band" }
      - { name: wear_forfeiture_rate, type: number, source: computed, description: "Read-only deposit retention rate 0.00-1.00 selected from the wear band" }
      - { name: wear_grace_period_hours, type: integer, source: computed, description: "Read-only grace period in hours 48-12 selected from the wear band" }

  # ---------------------------------------------------------------------------
  - name: CoreReturn
    parent: PartOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> PartOrder.id; the order the core came off of" }
      - { name: account_id, type: string, source: system, description: "FK -> CommercialAccount.id; the account receiving the core credit" }
      - { name: line_items, type: array, source: input, description: "Core lines: [{part_id, quantity}]" }
      - { name: core_subtotal_cents, type: integer, source: computed, description: "Read-only = sum of Part.core_charge_cents * quantity over this return's lines" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "Read-only restocking fee, computed as 15% of credits not covered by warranty" }
      - { name: warranty_covered, type: boolean, source: computed, description: "Read-only, immutable once INSPECTED: true when any returned line for this account carries a WarrantyRegistration whose warranty_expires_at is at or after the logical clock" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "Read-only credit posted to the account on inspection" }
      - { name: status, type: enum, source: system, description: "INITIATED | IN_TRANSIT | INSPECTED | CREDITED | REJECTED" }

  # ---------------------------------------------------------------------------
  - name: WarrantyRegistration
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CommercialAccount.id; the account that holds the warranty" }
      - { name: part_id, type: string, source: system, description: "FK -> Part.id; the warranted part" }
      - { name: purchase_order_id, type: string, source: system, description: "FK -> PartOrder.id; the original purchase, or null for a warranty recorded without a purchase record" }
      - { name: purchased_at, type: datetime, source: system, description: "Instant the warranted part was purchased" }
      - { name: warranty_expires_at, type: datetime, source: input, description: "Instant the warranty lapses; MUST be > purchased_at" }
      - { name: claim_reference, type: string, source: input, description: "Free-text claim reference supplied by the shop; MAY be null" }

  # ---------------------------------------------------------------------------
  - name: RouteStop
    parent: ServiceRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> ServiceRoute.id; the route containing this stop" }
      - { name: stop_sequence, type: integer, source: computed, description: "Read-only position of this stop on its route, assigned by the deterministic stop-ordering rule" }
      - { name: account_id, type: string, source: system, description: "FK -> CommercialAccount.id; the shop served by this stop" }
      - { name: order_ids, type: array, source: system, description: "FK -> PartOrder.id; orders dropped at this stop, ascending by member_sequence" }
      - { name: delivery_window_start, type: datetime, source: input, description: "Start of the promised delivery window for this stop" }
      - { name: delivery_window_end, type: datetime, source: input, description: "End of the promised delivery window; MUST be > delivery_window_start" }
      - { name: travel_minutes_from_previous, type: integer, source: input, description: "Drive time in minutes from the previous stop on the sequence" }
      - { name: drop_minutes, type: integer, source: input, description: "Dwell time in minutes spent dropping parts at this stop" }
      - { name: projected_arrival_at, type: datetime, source: computed, description: "Read-only = previous stop's projected_departure_at + travel_minutes_from_previous, or route departure_at + travel for the first stop" }
      - { name: projected_departure_at, type: datetime, source: computed, description: "Read-only = projected_arrival_at + drop_minutes" }
      - { name: lateness_minutes, type: integer, source: computed, description: "Read-only = projected_departure_at - delivery_window_end when positive, otherwise 0" }
      - { name: stop_kind, type: enum, source: input, default: "CUSTOMER", description: "CUSTOMER | RETURN_DESK" }
      - { name: delivered_at, type: datetime, source: system, description: "Instant this stop was completed; null until DELIVERED" }
      - { name: status, type: enum, source: system, description: "PLANNED | SEQUENCED | EN_ROUTE | DELIVERED | MISSED | REJECTED" }

  # ---------------------------------------------------------------------------
  - name: ServiceRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Driver route code; unique per service date" }
      - { name: service_date, type: datetime, source: input, description: "Business date the route runs" }
      - { name: driver_id, type: string, source: input, description: "Driver identifier; a driver may hold at most one non-terminal route per service_date" }
      - { name: driver_type, type: enum, source: input, description: "OWNED | AFFILIATE; selects the branch of the route_run_credit calculation" }
      - { name: departure_at, type: datetime, source: input, description: "Instant the driver leaves the hub" }
      - { name: shift_end_at, type: datetime, source: input, description: "End of the driver's shift; no stop may be projected past this instant" }
      - { name: return_at, type: datetime, source: computed, description: "Read-only = the last stop's projected_departure_at, or departure_at when the route has no stops" }
      - { name: effective_departure_at, type: datetime, source: computed, description: "Read-only = departure_at advanced past the latest RETURN_DESK stop's delivery_window_start" }
      - { name: total_miles, type: number, source: computed, description: "Read-only route mileage used for the mileage credit" }
      - { name: run_credit_cents, type: integer, source: computed, description: "Read-only driver run credit, computed separately for OWNED and AFFILIATE driver types" }
      - { name: status, type: enum, source: system, description: "DRAFT | PLANNED | DISPATCHED | COMPLETED | CANCELLED" }# =============================================================================
# §1.2 State Machine Table (8 machines)
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: CommercialAccount
    field: account_posture
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ON_HOLD
        trigger: POST /commercial/commercial-accounts/{accountId}/hold
        actor: CreditAnalyst
        preconditions:
          - "CommercialAccount.account_posture must be OPEN (ERR_INVALID_ACCOUNT_POSTURE)"
          - "CommercialAccount.credit_exposure_cents must exceed CommercialAccount.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Every PartOrder on this account in {DRAFT, CONFIRMED, ALLOCATED, PICKING, DISPATCHED} -> VOID"
          - "For each order voided above that had reserved units: release InventoryItem.reserved_units at the reserved source store by PartOrder.reserved_unit_count"
          - "For each order voided above: Store.committed_units_today at the reserved source store -= PartOrder.reserved_unit_count"
          - "For each order voided above that carried a non-null service_route_id: its RouteStop -> REJECTED, then every later stop on that ServiceRoute is re-derived (stop_sequence, projected_arrival_at, projected_departure_at, lateness_minutes)"
          - "CommercialAccount.credit_exposure_cents recomputed after the voiding cascade"

      - from: ON_HOLD
        to: OPEN
        trigger: POST /commercial/commercial-accounts/{accountId}/release
        actor: CreditAnalyst
        preconditions:
          - "CommercialAccount.account_posture must be ON_HOLD (ERR_INVALID_ACCOUNT_POSTURE)"
          - "CommercialAccount.credit_exposure_cents must not exceed CommercialAccount.credit_limit_cents (ERR_CREDIT_LIMIT_STILL_EXCEEDED)"
        side_effects:
          - "CommercialAccount.account_posture -> OPEN"

      - from: OPEN
        to: CREDIT_SUSPENDED
        trigger: "system (aging evaluation, re-run on every write under the account and readable at POST /commercial/commercial-accounts/{accountId}/posture)"
        actor: system
        preconditions:
          - "CommercialAccount.receivable_balance_cents > 0"
          - "The oldest PartOrder.delivered_payment_due_at on this account is strictly more than CommercialAccount.credit_terms_days + 30 days before the logical clock"
        side_effects:
          - "CommercialAccount.account_posture -> CREDIT_SUSPENDED"

      - from: CREDIT_SUSPENDED
        to: OPEN
        trigger: POST /commercial/commercial-accounts/{accountId}/restore
        actor: CreditAnalyst
        preconditions:
          - "CommercialAccount.account_posture must be CREDIT_SUSPENDED (ERR_INVALID_ACCOUNT_POSTURE)"
          - "CommercialAccount.credit_exposure_cents must not exceed CommercialAccount.credit_limit_cents (ERR_CREDIT_LIMIT_STILL_EXCEEDED)"
        side_effects:
          - "CommercialAccount.account_posture -> OPEN"

      - from: OPEN
        to: CLOSED
        trigger: POST /commercial/commercial-accounts/{accountId}/close
        actor: CreditAnalyst
        preconditions:
          - "No PartOrder on this account in {DRAFT, CONFIRMED, ALLOCATED, PICKING, DISPATCHED} (ERR_OPEN_ORDERS_EXIST)"
          - "No ToolLoan on this account in {REQUESTED, CHECKED_OUT, IN_USE, DUE, OVERDUE, RETURNED, INSPECTED} (ERR_OPEN_LOANS_EXIST)"
          - "No CoreReturn on this account in {INITIATED, IN_TRANSIT, INSPECTED} (ERR_OPEN_CORE_RETURNS_EXIST)"
          - "CommercialAccount.receivable_balance_cents must be 0 (ERR_RECEIVABLE_BALANCE_OUTSTANDING)"
        side_effects:
          - "CommercialAccount.account_posture -> CLOSED"

      - from: ON_HOLD
        to: CLOSED
        trigger: POST /commercial/commercial-accounts/{accountId}/close
        actor: CreditAnalyst
        preconditions:
          - "No PartOrder on this account in {DRAFT, CONFIRMED, ALLOCATED, PICKING, DISPATCHED} (ERR_OPEN_ORDERS_EXIST)"
          - "No ToolLoan on this account in {REQUESTED, CHECKED_OUT, IN_USE, DUE, OVERDUE, RETURNED, INSPECTED} (ERR_OPEN_LOANS_EXIST)"
          - "No CoreReturn on this account in {INITIATED, IN_TRANSIT, INSPECTED} (ERR_OPEN_CORE_RETURNS_EXIST)"
          - "CommercialAccount.receivable_balance_cents must be 0 (ERR_RECEIVABLE_BALANCE_OUTSTANDING)"
        side_effects:
          - "CommercialAccount.account_posture -> CLOSED"

      - from: CREDIT_SUSPENDED
        to: CLOSED
        trigger: POST /commercial/commercial-accounts/{accountId}/close
        actor: CreditAnalyst
        preconditions:
          - "No PartOrder on this account in {DRAFT, CONFIRMED, ALLOCATED, PICKING, DISPATCHED} (ERR_OPEN_ORDERS_EXIST)"
          - "No ToolLoan on this account in {REQUESTED, CHECKED_OUT, IN_USE, DUE, OVERDUE, RETURNED, INSPECTED} (ERR_OPEN_LOANS_EXIST)"
          - "No CoreReturn on this account in {INITIATED, IN_TRANSIT, INSPECTED} (ERR_OPEN_CORE_RETURNS_EXIST)"
          - "CommercialAccount.receivable_balance_cents must be 0 (ERR_RECEIVABLE_BALANCE_OUTSTANDING)"
        side_effects:
          - "CommercialAccount.account_posture -> CLOSED"

  # ---------------------------------------------------------------------------
  - entity: PartOrder
    field: status
    initial_state: DRAFT
    terminal_states: [DELIVERED, RETURNED, VOID]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: POST /commercial/part-orders/{orderId}/confirm
        actor: CommercialSalesRep
        preconditions:
          - "PartOrder.status must be DRAFT (ERR_ORDER_NOT_DRAFT)"
          - "CommercialAccount.account_posture of the owning account must be OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "PartOrder.fulfillment_route must not be UNROUTABLE (ERR_NO_FULFILLMENT_SOURCE)"
          - "For every line, the selected source must hold InventoryItem.available_units >= line quantity for the resolved current part (ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "For every line whose part_id is superseded: the line's part_id is rewritten to the terminal current part of the supersession chain"
          - "Every line's unit_price_cents recomputed from the resolved part's list price and the account tier band"
          - "For every line: the selected source's InventoryItem.reserved_units += line quantity"
          - "For every line: the selected source's Store.committed_units_today += line quantity, then Store.daily_capacity_units is re-checked in a second pass (ERR_CAPACITY_EXCEEDED)"
          - "PartOrder.promised_at and PartOrder.fulfillment_route recomputed from the source promise table"
          - "PartOrder.parts_subtotal_cents, core_charge_total_cents, tier_discount_cents, refundable_deposit_cents, delivery_fee_cents and satisfaction_cents recomputed"
          - "CommercialAccount.credit_exposure_cents recomputed; CommercialAccount.order_sequence += 1"
          - "PartOrder.reserved_unit_count = sum of line quantities, now held against the source store's InventoryItem.reserved_units"
          - "Every existing PartOrder LINE for this account whose status is DRAFT or CONFIRMED is re-priced at this order's pricing band, because the band is keyed on the account's order_sequence at creation and that value has just advanced"
          - "PartOrder.parts_subtotal_cents and PartOrder.tier_discount_cents of those sibling orders are recomputed; their fulfilled lines are left alone"
          - "CommercialAccount.credit_exposure_cents recomputed for the account after the sibling re-pricing"

      - from: CONFIRMED
        to: ALLOCATED
        trigger: POST /commercial/part-orders/{orderId}/allocate
        actor: CommercialSalesRep
        preconditions:
          - "PartOrder.status must be CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
          - "The owning account must not already hold a PartOrder in {ALLOCATED, PICKING} carrying the same member_sequence on the same business day (ERR_SAME_DAY_SLOT_TAKEN) - the slot is keyed on the account and the order, never on the source store"
        side_effects:
          - "PartOrder.status -> ALLOCATED; PartOrder.promise_at recomputed"

      - from: ALLOCATED
        to: PICKING
        trigger: POST /commercial/part-orders/{orderId}/pick
        actor: CommercialSalesRep
        preconditions:
          - "PartOrder.status must be ALLOCATED (ERR_ORDER_NOT_ALLOCATED)"
        side_effects:
          - "PartOrder.status -> PICKING"

      - from: PICKING
        to: DISPATCHED
        trigger: POST /commercial/part-orders/{orderId}/dispatch
        actor: DeliveryDriver
        preconditions:
          - "PartOrder.status must be PICKING (ERR_ORDER_NOT_PICKING)"
          - "PartOrder.service_route_id must be non-null (ERR_ORDER_NOT_ON_ROUTE)"
        side_effects:
          - "PartOrder.status -> DISPATCHED"

      - from: DISPATCHED
        to: DELIVERED
        trigger: POST /commercial/part-orders/{orderId}/deliver
        actor: DeliveryDriver
        preconditions:
          - "PartOrder.status must be DISPATCHED (ERR_ORDER_NOT_DISPATCHED)"
          - "The RouteStop carrying this order must be in SEQUENCED or EN_ROUTE (ERR_ROUTE_STOP_NOT_ACTIVE)"
          - "PartOrder.delivered_at must be unset: a delivered order cannot be delivered a second time (ERR_ORDER_ALREADY_DELIVERED)"
        side_effects:
          - "For every line: the source store's InventoryItem.on_hand_units -= line quantity and InventoryItem.reserved_units -= line quantity"
          - "For every line: the source store's Store.committed_units_today -= line quantity"
          - "PartOrder.delivered_at set to the logical clock; PartOrder.delivered_payment_due_at = delivered_at + CommercialAccount.credit_terms_days"
          - "CommercialAccount.receivable_balance_cents recomputed over non-VOID orders"
          - "PartOrder.status -> DELIVERED"

      - from: DISPATCHED
        to: CONFIRMED
        trigger: POST /commercial/part-orders/{orderId}/refit
        actor: CommercialSalesRep
        preconditions:
          - "PartOrder.status must be DISPATCHED (ERR_ORDER_NOT_DISPATCHED)"
          - "The RouteStop carrying this order must be in REJECTED or MISSED (ERR_ROUTE_STOP_NOT_TERMINAL)"
        side_effects:
          - "PartOrder.service_route_id cleared; PartOrder.status -> CONFIRMED"
          - "The rejected RouteStop is removed from its ServiceRoute, then every later stop on that route is re-derived (stop_sequence, projected_arrival_at, projected_departure_at, lateness_minutes)"

      - from: DELIVERED
        to: RETURNED
        trigger: POST /commercial/part-orders/{orderId}/return
        actor: CommercialSalesRep
        preconditions:
          - "PartOrder.status must be DELIVERED (ERR_ORDER_NOT_DELIVERED)"
          - "The logical clock must be at most PartOrder.delivered_at + CommercialAccount.credit_terms_days + 30 days (ERR_RETURN_WINDOW_CLOSED)"
        side_effects:
          - "PartOrder.status -> RETURNED"
          - "PartOrder.reserved_unit_count = 0 and PartOrder.refundable_deposit_consumed_cents is written back to the account's live deposit pool"
          - "When at least one line's part has Part.core_charge_cents > 0: a CoreReturn is created in INITIATED against this order and the owning account"
          - "The PartOrder's reservations are already released; CommercialAccount.credit_exposure_cents recomputed"

      - from: DRAFT
        to: VOID
        trigger: POST /commercial/part-orders/{orderId}/void
        actor: CommercialSalesRep
        preconditions:
          - "PartOrder.status must be in {DRAFT, CONFIRMED} (ERR_ORDER_NOT_VOIDABLE)"
        side_effects:
          - "PartOrder.status -> VOID; CommercialAccount.credit_exposure_cents recomputed"

      - from: CONFIRMED
        to: VOID
        trigger: POST /commercial/part-orders/{orderId}/void
        actor: CommercialSalesRep
        preconditions:
          - "PartOrder.status must be in {DRAFT, CONFIRMED} (ERR_ORDER_NOT_VOIDABLE)"
        side_effects:
          - "PartOrder.reserved_unit_count = 0"
          - "PartOrder.refundable_deposit_consumed_cents is written back to the account's live deposit pool, so the compensated quantity is exactly restored"
          - "For every line: the reserved source's InventoryItem.reserved_units -= line quantity"
          - "For every line: the reserved source's Store.committed_units_today -= line quantity"
          - "PartOrder.status -> VOID; CommercialAccount.credit_exposure_cents recomputed"

      - from: ALLOCATED
        to: VOID
        trigger: POST /commercial/part-orders/{orderId}/void
        actor: CreditAnalyst
        preconditions:
          - "PartOrder.status must be in {ALLOCATED, PICKING} (ERR_ORDER_NOT_VOIDABLE); a DISPATCHED order is rejected here"
        side_effects:
          - "For every line: the reserved source's InventoryItem.reserved_units -= line quantity"
          - "For every line: the reserved source's Store.committed_units_today -= line quantity"
          - "PartOrder.status -> VOID; CommercialAccount.credit_exposure_cents recomputed"

      - from: PICKING
        to: VOID
        trigger: POST /commercial/part-orders/{orderId}/void
        actor: CreditAnalyst
        preconditions:
          - "PartOrder.status must be in {ALLOCATED, PICKING} (ERR_ORDER_NOT_VOIDABLE); a DISPATCHED order is rejected here"
        side_effects:
          - "For every line: the reserved source's InventoryItem.reserved_units -= line quantity"
          - "For every line: the reserved source's Store.committed_units_today -= line quantity"
          - "PartOrder.status -> VOID; CommercialAccount.credit_exposure_cents recomputed"

  # ---------------------------------------------------------------------------
  - entity: ToolLoan
    field: status
    initial_state: REQUESTED
    terminal_states: [CLOSED, FORFEITED]
    transitions:
      - from: REQUESTED
        to: CHECKED_OUT
        trigger: POST /commercial/tool-loans/{loanId}/checkout
        actor: CommercialSalesRep
        preconditions:
          - "ToolLoan.status must be REQUESTED (ERR_LOAN_NOT_REQUESTED)"
          - "The owning CommercialAccount.account_posture must be OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "ToolLoan.deposit_amount_cents must be >= ToolCatalog.deposit_amount_cents of the linked tool (ERR_DEPOSIT_BELOW_MINIMUM)"
          - "CommercialAccount.credit_exposure_cents + ToolLoan.deposit_amount_cents must not exceed CommercialAccount.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "The ToolCatalog entry must not already have an open ToolLoan in {CHECKED_OUT, IN_USE, DUE, OVERDUE} for the same account (ERR_TOOL_ALREADY_ON_LOAN)"
        side_effects:
          - "ToolLoan.deposit_state -> HELD"
          - "CommercialAccount.petty_cash_cents += ToolLoan.deposit_amount_cents"
          - "ToolLoan.status -> CHECKED_OUT"

      - from: CHECKED_OUT
        to: CHECKED_OUT
        trigger: PUT /commercial/tool-loans/{loanId}
        actor: CreditAnalyst
        preconditions:
          - "ToolLoan.status must be CHECKED_OUT (ERR_LOAN_NOT_CHECKED_OUT)"
          - "The new deposit_amount_cents must be >= ToolCatalog.deposit_amount_cents of the linked tool (ERR_DEPOSIT_BELOW_MINIMUM)"
        side_effects:
          - "CommercialAccount.petty_cash_cents += (new deposit_amount_cents - previous deposit_amount_cents)"
          - "ToolLoan.deposit_amount_cents = new value; CommercialAccount.credit_exposure_cents recomputed"

      - from: CHECKED_OUT
        to: CHECKED_OUT
        trigger: "system (ToolCatalog wear-band re-selection, when wear_accumulated advances for this loan's tool)"
        actor: system
        preconditions:
          - "ToolLoan.status must be CHECKED_OUT (ERR_LOAN_NOT_CHECKED_OUT)"
          - "ToolCatalog.wear_accumulated has crossed a WEAR_BAND of LEVEL_2 (25.0), LEVEL_3 (45.0), LEVEL_4 (65.0) or LEVEL_5 (85.0) since this loan was checked out (ERR_LOAN_NOT_CHECKED_OUT otherwise)"
        note: "Two independent self-transitions exist on CHECKED_OUT; this one is the wear-band respecification and the other is the deposit adjustment. They share a from/to pair but are distinguished by trigger."
        side_effects:
          - "ToolCatalog.replacement_part_id re-selected by replacement_selection level 2 (2a, then 2b, then 2c)"
          - "ToolLoan.replacement_part_id refreshed from the newly selected catalogue part"
          - "ToolCatalog.wear_band set to the highest level the new wear_accumulated has reached"

      - from: CHECKED_OUT
        to: IN_USE
        trigger: "system (logical clock strictly after ToolLoan.loaned_at)"
        actor: system
        preconditions: []
        side_effects:
          - "ToolLoan.due_at = logical clock + 14 days; then ToolLoan.status -> IN_USE"

      - from: IN_USE
        to: DUE
        trigger: "system (logical clock at or after ToolLoan.due_at - 24 hours)"
        actor: system
        preconditions:
          - "CommercialAccount.credit_exposure_cents must not exceed CommercialAccount.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "ToolLoan.status -> DUE"

      - from: DUE
        to: OVERDUE
        trigger: "system (logical clock strictly after ToolLoan.due_at)"
        actor: system
        preconditions:
          - "CommercialAccount.credit_exposure_cents must not exceed CommercialAccount.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "ToolLoan.status -> OVERDUE"
          - "ToolLoan.overdue_days = floor((logical clock - due_at) / 86400 seconds)"

      - from: IN_USE
        to: RETURNED
        trigger: POST /commercial/tool-loans/{loanId}/return
        actor: DeliveryDriver
        preconditions:
          - "ToolLoan.status must be in {IN_USE, DUE, OVERDUE} (ERR_LOAN_NOT_OUT)"
        side_effects:
          - "ToolLoan.status -> RETURNED; ToolLoan.returned_at set to the logical clock"

      - from: DUE
        to: RETURNED
        trigger: POST /commercial/tool-loans/{loanId}/return
        actor: DeliveryDriver
        preconditions:
          - "ToolLoan.status must be in {IN_USE, DUE, OVERDUE} (ERR_LOAN_NOT_OUT)"
        side_effects:
          - "ToolLoan.status -> RETURNED; ToolLoan.returned_at set to the logical clock"

      - from: OVERDUE
        to: RETURNED
        trigger: POST /commercial/tool-loans/{loanId}/return
        actor: DeliveryDriver
        preconditions:
          - "ToolLoan.status must be in {IN_USE, DUE, OVERDUE} (ERR_LOAN_NOT_OUT)"
        side_effects:
          - "ToolLoan.status -> RETURNED; ToolLoan.returned_at set to the logical clock"

      - from: RETURNED
        to: INSPECTED
        trigger: POST /commercial/tool-loans/{loanId}/inspect
        actor: ToolCribAttendant
        preconditions:
          - "ToolLoan.status must be RETURNED (ERR_LOAN_NOT_RETURNED)"
          - "ToolLoan.return_condition must be one of GOOD, WORN, BROKEN, LOST (ERR_INVALID_RETURN_CONDITION)"
          - "A RETURN_DESK RouteStop for the owning account must exist on a ServiceRoute that is not CANCELLED (ERR_RETURN_DESK_STOP_MISSING)"
        side_effects:
          - "ToolLoan.wear_intensity computed; ToolLoan.damage_multiplier computed; ToolLoan.forfeiture_rate computed from the severity band"
          - "ToolLoan.deposit_forfeited_cents = round_half_up(deposit_amount_cents * forfeiture_rate)"
          - "When return_condition is WORN or BROKEN: ToolCatalog.wear_accumulated += 0.4"
          - "When return_condition is WORN: ToolLoan.replacement_part_id selected by the replacement selector policy over PartFitsTool"
          - "When return_condition is LOST: ToolLoan.replacement_part_id set to ToolCatalog.replacement_part_id"

      - from: INSPECTED
        to: CLOSED
        trigger: POST /commercial/tool-loans/{loanId}/close
        actor: ToolCribAttendant
        preconditions:
          - "ToolLoan.status must be INSPECTED (ERR_LOAN_NOT_INSPECTED)"
          - "ToolLoan.return_condition must be GOOD or WORN (ERR_LOAN_NOT_CLOSABLE)"
          - "ToolLoan.deposit_state must be HELD (ERR_DEPOSIT_NOT_HELD)"
        side_effects:
          - "ToolLoan.deposit_state -> REFUNDED"
          - "CommercialAccount.petty_cash_cents -= (deposit_amount_cents - deposit_forfeited_cents)"
          - "CommercialAccount.credit_exposure_cents recomputed"
          - "ToolLoan.status -> CLOSED"

      - from: INSPECTED
        to: FORFEITED
        trigger: POST /commercial/tool-loans/{loanId}/forfeit
        actor: ToolCribAttendant
        preconditions:
          - "ToolLoan.status must be INSPECTED (ERR_LOAN_NOT_INSPECTED)"
          - "ToolLoan.deposit_state must be HELD (ERR_DEPOSIT_NOT_HELD)"
        side_effects:
          - "ToolLoan.deposit_forfeited_cents = ToolLoan.deposit_amount_cents"
          - "When CommercialAccount.receivable_balance_cents > 0: ToolLoan.deposit_state -> APPLIED_TO_BALANCE and CommercialAccount.receivable_balance_cents -= deposit_amount_cents"
          - "When CommercialAccount.receivable_balance_cents == 0: ToolLoan.deposit_state -> FORFEITED and CommercialAccount.petty_cash_cents -= deposit_amount_cents"
          - "CommercialAccount.credit_exposure_cents recomputed"
          - "ToolLoan.status -> FORFEITED"

  # ---------------------------------------------------------------------------
  - entity: CoreReturn
    field: status
    initial_state: INITIATED
    terminal_states: [CREDITED, REJECTED]
    transitions:
      - from: INITIATED
        to: IN_TRANSIT
        trigger: POST /commercial/core-returns/{coreReturnId}/transit
        actor: DeliveryDriver
        preconditions:
          - "CoreReturn.status must be INITIATED (ERR_CORE_RETURN_NOT_INITIATED)"
        side_effects:
          - "CoreReturn.status -> IN_TRANSIT"

      - from: IN_TRANSIT
        to: INSPECTED
        trigger: POST /commercial/core-returns/{coreReturnId}/inspect
        actor: ToolCribAttendant
        preconditions:
          - "CoreReturn.status must be IN_TRANSIT (ERR_CORE_RETURN_NOT_IN_TRANSIT)"
          - "For every line, the line quantity must not exceed the quantity of that part on the referenced PartOrder (ERR_CORE_QUANTITY_EXCEEDS_PURCHASE)"
        side_effects:
          - "CoreReturn.core_subtotal_cents computed"
          - "CoreReturn.warranty_covered computed and pinned for the life of the record"
          - "CoreReturn.restocking_fee_cents computed"
          - "CoreReturn.credit_amount_cents computed"
          - "CoreReturn.status -> INSPECTED"

      - from: INSPECTED
        to: CREDITED
        trigger: POST /commercial/core-returns/{coreReturnId}/credit
        actor: CreditAnalyst
        preconditions:
          - "CoreReturn.status must be INSPECTED (ERR_CORE_RETURN_NOT_INSPECTED)"
          - "CommercialAccount.account_posture of the owning account must not be CLOSED (ERR_ACCOUNT_CLOSED)"
        side_effects:
          - "CommercialAccount.petty_cash_cents += CoreReturn.credit_amount_cents"
          - "CommercialAccount.receivable_balance_cents recomputed over non-VOID orders"
          - "CommercialAccount.credit_exposure_cents recomputed"
          - "CoreReturn.status -> CREDITED"

      - from: INITIATED
        to: REJECTED
        trigger: POST /commercial/core-returns/{coreReturnId}/reject
        actor: ToolCribAttendant
        preconditions:
          - "CoreReturn.status must be in {INITIATED, IN_TRANSIT} (ERR_CORE_RETURN_NOT_REJECTABLE)"
        side_effects:
          - "CoreReturn.status -> REJECTED; no credit posted"

      - from: IN_TRANSIT
        to: REJECTED
        trigger: POST /commercial/core-returns/{coreReturnId}/reject
        actor: ToolCribAttendant
        preconditions:
          - "CoreReturn.status must be in {INITIATED, IN_TRANSIT} (ERR_CORE_RETURN_NOT_REJECTABLE)"
          - "This row's side effect set is the same as INITIATED -> REJECTED"
        side_effects:
          - "CoreReturn.status -> REJECTED; no credit posted"

  # ---------------------------------------------------------------------------
  - entity: ServiceRoute
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLANNED
        trigger: POST /commercial/service-routes/{routeId}/plan
        actor: RouteDispatcher
        preconditions:
          - "ServiceRoute.status must be DRAFT (ERR_ROUTE_NOT_DRAFT)"
          - "The route must carry at least one RouteStop (ERR_ROUTE_HAS_NO_STOPS)"
          - "No RouteStop on the route may have delivery_window_end earlier than ServiceRoute.departure_at (ERR_STOP_WINDOW_BEFORE_DEPARTURE)"
        side_effects:
          - "Every RouteStop on the route: stop_sequence assigned by the deterministic stop-ordering rule"
          - "ServiceRoute.effective_departure_at derived"
          - "Every RouteStop: projected_arrival_at, projected_departure_at, lateness_minutes recomputed in sequence order"
          - "Every RouteStop: status -> SEQUENCED"

      - from: PLANNED
        to: DISPATCHED
        trigger: POST /commercial/service-routes/{routeId}/dispatch
        actor: RouteDispatcher
        preconditions:
          - "ServiceRoute.status must be PLANNED (ERR_ROUTE_NOT_PLANNED)"
          - "No RouteStop's projected_departure_at may fall strictly after ServiceRoute.shift_end_at (ERR_SHIFT_END_EXCEEDED)"
          - "Every PartOrder whose service_route_id is this route and whose status is ALLOCATED must have reached PICKING (ERR_ROUTE_ORDERS_NOT_PICKED)"
        side_effects:
          - "Every RouteStop on the route -> EN_ROUTE"
          - "Every PartOrder whose service_route_id is this route and whose status is PICKING -> DISPATCHED"
          - "ServiceRoute.status -> DISPATCHED"

      - from: PLANNED
        to: DRAFT
        trigger: POST /commercial/service-routes/{routeId}/revert-to-draft
        actor: RouteDispatcher
        preconditions:
          - "ServiceRoute.status must be PLANNED (ERR_ROUTE_NOT_PLANNED)"
        side_effects:
          - "ServiceRoute.status -> DRAFT"
          - "Every RouteStop on the route -> PLANNED; stop_sequence cleared; projected fields cleared"

      - from: DISPATCHED
        to: COMPLETED
        trigger: POST /commercial/service-routes/{routeId}/complete
        actor: RouteDispatcher
        preconditions:
          - "ServiceRoute.status must be DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
          - "No RouteStop on the route may remain in {PLANNED, SEQUENCED, EN_ROUTE, REJECTED} (ERR_ROUTE_STOPS_UNRESOLVED)"
        side_effects:
          - "ServiceRoute.total_miles and ServiceRoute.run_credit_cents computed"
          - "ServiceRoute.status -> COMPLETED"

      - from: DRAFT
        to: CANCELLED
        trigger: POST /commercial/service-routes/{routeId}/cancel
        actor: RouteDispatcher
        preconditions:
          - "ServiceRoute.status must be in {DRAFT, PLANNED, DISPATCHED} (ERR_ROUTE_NOT_CANCELLABLE)"
        side_effects:
          - "Every RouteStop on the route -> REJECTED"
          - "Every PartOrder referencing this route in status DISPATCHED reverts to CONFIRMED and clears service_route_id"
          - "ServiceRoute.status -> CANCELLED"

      - from: PLANNED
        to: CANCELLED
        trigger: POST /commercial/service-routes/{routeId}/cancel
        actor: RouteDispatcher
        preconditions:
          - "ServiceRoute.status must be in {DRAFT, PLANNED, DISPATCHED} (ERR_ROUTE_NOT_CANCELLABLE)"
        side_effects:
          - "Every RouteStop on the route -> REJECTED"
          - "Every PartOrder referencing this route in status DISPATCHED reverts to CONFIRMED and clears service_route_id"
          - "ServiceRoute.status -> CANCELLED"

      - from: DISPATCHED
        to: CANCELLED
        trigger: POST /commercial/service-routes/{routeId}/cancel
        actor: RouteDispatcher
        preconditions:
          - "ServiceRoute.status must be in {DRAFT, PLANNED, DISPATCHED} (ERR_ROUTE_NOT_CANCELLABLE)"
        side_effects:
          - "Every RouteStop on the route -> REJECTED"
          - "Every PartOrder referencing this route in status DISPATCHED reverts to CONFIRMED and clears service_route_id"
          - "ServiceRoute.status -> CANCELLED"

  # ---------------------------------------------------------------------------
  - entity: RouteStop
    field: status
    initial_state: PLANNED
    terminal_states: [DELIVERED, MISSED, REJECTED]
    transitions:
      - from: PLANNED
        to: SEQUENCED
        trigger: "system (route planning at POST /commercial/service-routes/{routeId}/plan)"
        actor: system
        preconditions: []
        side_effects:
          - "RouteStop.stop_sequence assigned; projected_arrival_at, projected_departure_at and lateness_minutes derived"

      - from: SEQUENCED
        to: EN_ROUTE
        trigger: "system (route dispatch at POST /commercial/service-routes/{routeId}/dispatch)"
        actor: system
        preconditions:
          - "ServiceRoute.status must be PLANNED (ERR_ROUTE_NOT_PLANNED)"
        side_effects:
          - "RouteStop.status -> EN_ROUTE"

      - from: EN_ROUTE
        to: DELIVERED
        trigger: POST /commercial/route-stops/{stopId}/deliver
        actor: DeliveryDriver
        preconditions:
          - "RouteStop.status must be EN_ROUTE (ERR_STOP_NOT_EN_ROUTE)"
          - "RouteStop.lateness_minutes must be 0 (ERR_STOP_PAST_WINDOW)"
        side_effects:
          - "RouteStop.status -> DELIVERED; RouteStop.delivered_at set to the logical clock"
          - "Every PartOrder dropped at this stop in DISPATCHED -> DELIVERED through the same side effects as the order's own deliver transition"

      - from: EN_ROUTE
        to: MISSED
        trigger: POST /commercial/route-stops/{stopId}/miss
        actor: DeliveryDriver
        preconditions:
          - "RouteStop.status must be EN_ROUTE (ERR_STOP_NOT_EN_ROUTE)"
        side_effects:
          - "RouteStop.status -> MISSED"
          - "Every PartOrder dropped at this stop reverts to CONFIRMED and clears service_route_id"
          - "Every later RouteStop on the same ServiceRoute is re-derived (stop_sequence, projected_arrival_at, projected_departure_at, lateness_minutes)"

      - from: PLANNED
        to: REJECTED
        trigger: POST /commercial/route-stops/{stopId}/reject
        actor: RouteDispatcher
        preconditions:
          - "RouteStop.status must be in {PLANNED, SEQUENCED} (ERR_STOP_NOT_REJECTABLE)"
        side_effects:
          - "RouteStop.status -> REJECTED"
          - "Every PartOrder dropped at this stop reverts to CONFIRMED and clears service_route_id"
          - "Every later RouteStop on the same ServiceRoute is re-derived"

      - from: SEQUENCED
        to: REJECTED
        trigger: POST /commercial/route-stops/{stopId}/reject
        actor: RouteDispatcher
        preconditions:
          - "RouteStop.status must be in {PLANNED, SEQUENCED} (ERR_STOP_NOT_REJECTABLE)"
        side_effects:
          - "RouteStop.status -> REJECTED"
          - "Every PartOrder dropped at this stop reverts to CONFIRMED and clears service_route_id"
          - "Every later RouteStop on the same ServiceRoute is re-derived"

  # ---------------------------------------------------------------------------
  - entity: Part
    field: catalog_state
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: POST /commercial/parts/{partId}/supersede
        actor: PartsCategoryManager
        preconditions:
          - "Part.catalog_state must be ACTIVE (ERR_PART_ALREADY_SUPERSEDED)"
          - "The target Part must exist and be non-archived (ERR_SUPERSEDING_PART_NOT_FOUND)"
          - "The target Part must be its own terminal current part, i.e. Part.superseded_by_part_id of the target must be null (ERR_SUPERSEDING_PART_NOT_TERMINAL)"
          - "The target Part must not be reachable from this Part by following superseded_by_part_id links (ERR_SUPERSESSION_CYCLE)"
        side_effects:
          - "Part.superseded_by_part_id = target part id"
          - "Part.supersession_depth of every Part whose forward supersession chain contains this Part is recomputed"
          - "Open PartOrder lines are NOT rewritten; supersession is resolved at confirm time"

      - from: SUPERSEDED
        to: ACTIVE
        trigger: POST /commercial/parts/{partId}/unsupersede
        actor: PartsCategoryManager
        preconditions:
          - "Part.catalog_state must be SUPERSEDED (ERR_PART_NOT_SUPERSEDED)"
        side_effects:
          - "Part.superseded_by_part_id cleared"
          - "Part.supersession_depth of every Part whose forward supersession chain contained this Part is recomputed"

  # ---------------------------------------------------------------------------
  - entity: RepCoverage
    field: coverage_posture
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (logical clock at or after RepCoverage.effective_from)"
        actor: system
        preconditions:
          - "The logical clock must be at or after RepCoverage.effective_from (ERR_COVERAGE_NOT_STARTED)"
          - "No other ACTIVE RepCoverage row for the same account_id may span the logical clock (ERR_COVERAGE_OVERLAP)"
        side_effects:
          - "RepCoverage.coverage_posture -> ACTIVE"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock strictly after RepCoverage.effective_to)"
        actor: system
        preconditions:
          - "The logical clock must be strictly after RepCoverage.effective_to (ERR_COVERAGE_STILL_OPEN)"
        side_effects:
          - "RepCoverage.coverage_posture -> EXPIRED"

      - from: EXPIRED
        to: ACTIVE
        trigger: POST /commercial/rep-coverages/{coverageId}/extend
        actor: CommercialSalesRep
        preconditions:
          - "RepCoverage.coverage_posture must be EXPIRED (ERR_COVERAGE_NOT_EXPIRED)"
          - "The new effective_to must be strictly after the logical clock (ERR_COVERAGE_EXTENSION_NOT_FORWARD)"
          - "No other ACTIVE RepCoverage row for the same account_id may span the logical clock (ERR_COVERAGE_OVERLAP)"
        side_effects:
          - "RepCoverage.effective_to = new effective_to"
          - "RepCoverage.coverage_posture -> ACTIVE"
          - "SalesRep.active_account_count is re-derived for the departing and the arriving rep"

      - from: SCHEDULED
        to: EXPIRED
        trigger: POST /commercial/rep-coverages/{coverageId}/end
        actor: CommercialSalesRep
        preconditions:
          - "RepCoverage.coverage_posture must be in {SCHEDULED, ACTIVE} (ERR_COVERAGE_NOT_ENDABLE)"
          - "The new effective_to must be strictly after the logical clock (ERR_COVERAGE_EXTENSION_NOT_FORWARD)"
        side_effects:
          - "RepCoverage.effective_to = new effective_to"
          - "RepCoverage.coverage_posture -> EXPIRED"

      - from: ACTIVE
        to: EXPIRED
        trigger: POST /commercial/rep-coverages/{coverageId}/end
        actor: CommercialSalesRep
        preconditions:
          - "RepCoverage.coverage_posture must be in {SCHEDULED, ACTIVE} (ERR_COVERAGE_NOT_ENDABLE)"
          - "The new effective_to must be strictly after the logical clock (ERR_COVERAGE_EXTENSION_NOT_FORWARD)"
        side_effects:
          - "RepCoverage.effective_to = new effective_to"
          - "RepCoverage.coverage_posture -> EXPIRED"

  # ---------------------------------------------------------------------------
  - entity: ToolCatalog
    field: wear_band
    initial_state: LEVEL_1
    terminal_states: []
    transitions:
      - from: LEVEL_1
        to: LEVEL_2
        trigger: "system (wear inspection at POST /commercial/tool-loans/{loanId}/inspect when the tool's wear_accumulated reaches 25.0)"
        actor: system
        preconditions:
          - "ToolCatalog.wear_accumulated must be at or above 25.0 (ERR_INSUFFICIENT_TOOL_WEAR)"
          - "ToolCatalog.wear_band must be LEVEL_1 (ERR_INVALID_TOOL_WEAR_BAND)"
        side_effects:
          - "ToolCatalog.wear_band -> LEVEL_2"
          - "ToolCatalog.wear_multiplier_rate = 1.20; wear_forfeiture_rate = 0.40; wear_grace_period_hours = 36"
          - "ToolCatalog.replacement_part_id re-selected by replacement_selection level 2 (2a, then 2b, then 2c)"
          - "Every ToolLoan on this tool in {CHECKED_OUT, IN_USE, DUE, OVERDUE}: replacement_part_id refreshed from the newly selected catalogue part"

      - from: LEVEL_2
        to: LEVEL_3
        trigger: "system (wear inspection when wear_accumulated reaches 45.0)"
        actor: system
        preconditions:
          - "ToolCatalog.wear_accumulated must be at or above 45.0 (ERR_INSUFFICIENT_TOOL_WEAR)"
          - "ToolCatalog.wear_band must be LEVEL_2 (ERR_INVALID_TOOL_WEAR_BAND)"
        side_effects:
          - "ToolCatalog.wear_band -> LEVEL_3"
          - "ToolCatalog.wear_multiplier_rate = 1.45; wear_forfeiture_rate = 0.60; wear_grace_period_hours = 24"
          - "ToolCatalog.replacement_part_id re-selected by replacement_selection level 2"
          - "Every open ToolLoan on this tool: replacement_part_id refreshed"

      - from: LEVEL_3
        to: LEVEL_4
        trigger: "system (wear inspection when wear_accumulated reaches 65.0)"
        actor: system
        preconditions:
          - "ToolCatalog.wear_accumulated must be at or above 65.0 (ERR_INSUFFICIENT_TOOL_WEAR)"
          - "ToolCatalog.wear_band must be LEVEL_3 (ERR_INVALID_TOOL_WEAR_BAND)"
        side_effects:
          - "ToolCatalog.wear_band -> LEVEL_4"
          - "ToolCatalog.wear_multiplier_rate = 1.70; wear_forfeiture_rate = 0.80; wear_grace_period_hours = 18"
          - "ToolCatalog.replacement_part_id re-selected by replacement_selection level 2"
          - "Every open ToolLoan on this tool: replacement_part_id refreshed"

      - from: LEVEL_4
        to: LEVEL_5
        trigger: "system (wear inspection when wear_accumulated reaches 85.0)"
        actor: system
        preconditions:
          - "ToolCatalog.wear_accumulated must be at or above 85.0 (ERR_INSUFFICIENT_TOOL_WEAR)"
          - "ToolCatalog.wear_band must be LEVEL_4 (ERR_INVALID_TOOL_WEAR_BAND)"
        side_effects:
          - "ToolCatalog.wear_band -> LEVEL_5"
          - "ToolCatalog.wear_multiplier_rate = 2.00; wear_forfeiture_rate = 1.00; wear_grace_period_hours = 12"
          - "ToolCatalog.replacement_part_id re-selected by replacement_selection level 2"
          - "Every open ToolLoan on this tool: replacement_part_id refreshed"
          - "Every ToolLoan on this tool in {REQUESTED, CHECKED_OUT, IN_USE, DUE, OVERDUE} -> CHECKED_OUT with due_at set to the logical clock"

      - from: LEVEL_2
        to: LEVEL_1
        trigger: POST /commercial/tool-catalog/{toolCatalogId}/reset-wear
        actor: ToolCribAttendant
        preconditions:
          - "ToolCatalog.wear_band must be in {LEVEL_2, LEVEL_3, LEVEL_4, LEVEL_5} (ERR_INVALID_TOOL_WEAR_BAND)"
        side_effects:
          - "ToolCatalog.wear_accumulated = 0; wear_band -> LEVEL_1"
          - "ToolCatalog.wear_multiplier_rate = 1.00; wear_forfeiture_rate = 0.00; wear_grace_period_hours = 48"

      - from: LEVEL_3
        to: LEVEL_1
        trigger: POST /commercial/tool-catalog/{toolCatalogId}/reset-wear
        actor: ToolCribAttendant
        preconditions:
          - "ToolCatalog.wear_band must be in {LEVEL_2, LEVEL_3, LEVEL_4, LEVEL_5} (ERR_INVALID_TOOL_WEAR_BAND)"
        side_effects:
          - "ToolCatalog.wear_accumulated = 0; wear_band -> LEVEL_1"
          - "ToolCatalog.wear_multiplier_rate = 1.00; wear_forfeiture_rate = 0.00; wear_grace_period_hours = 48"

      - from: LEVEL_4
        to: LEVEL_1
        trigger: POST /commercial/tool-catalog/{toolCatalogId}/reset-wear
        actor: ToolCribAttendant
        preconditions:
          - "ToolCatalog.wear_band must be in {LEVEL_2, LEVEL_3, LEVEL_4, LEVEL_5} (ERR_INVALID_TOOL_WEAR_BAND)"
        side_effects:
          - "ToolCatalog.wear_accumulated = 0; wear_band -> LEVEL_1"
          - "ToolCatalog.wear_multiplier_rate = 1.00; wear_forfeiture_rate = 0.00; wear_grace_period_hours = 48"

      - from: LEVEL_5
        to: LEVEL_1
        trigger: POST /commercial/tool-catalog/{toolCatalogId}/reset-wear
        actor: ToolCribAttendant
        preconditions:
          - "ToolCatalog.wear_band must be in {LEVEL_2, LEVEL_3, LEVEL_4, LEVEL_5} (ERR_INVALID_TOOL_WEAR_BAND)"
        side_effects:
          - "ToolCatalog.wear_accumulated = 0; wear_band -> LEVEL_1"
          - "ToolCatalog.wear_multiplier_rate = 1.00; wear_forfeiture_rate = 0.00; wear_grace_period_hours = 48"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only - OCC on the parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-account
    parent_entity: CommercialAccount
    write_endpoint: "POST /commercial/part-orders"
    occ_field: "expected_account_version"
    description: |
      Creating a PartOrder against a CommercialAccount whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just placed an order on the same
      account (legitimately advancing order_sequence, credit_exposure_cents
      and the account version) and the current writer's view of the account
      is therefore stale.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: route-stop-create-stale-route
    parent_entity: ServiceRoute
    write_endpoint: "POST /commercial/service-routes/{routeId}/stops"
    occ_field: "expected_route_version"
    description: |
      Attaching a RouteStop to a ServiceRoute whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has already added or rejected a stop on the same
      route, re-sequencing the stops that follow it, and the current writer's
      view of the route is therefore stale.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

  - rule_id: loan-checkout-stale-account
    parent_entity: CommercialAccount
    write_endpoint: "POST /commercial/tool-loans/{loanId}/checkout"
    occ_field: "expected_account_version"
    description: |
      Checking out a ToolLoan against a CommercialAccount whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just changed the same account's
      credit exposure (order confirm, void, core credit or another deposit
      hold), so the deposit decision was made against a stale credit picture.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table (10 calculations)
#
# Rounding doctrine (applies to every formula below): all money is integer
# cents; the ONLY rounding primitive is round_half_up to the cent, applied at
# exactly the points named in each formula. Where a formula does not name a
# rounding point, no rounding occurs. ceil() is used only where named.
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: tier_line_price
    trigger: "PartOrder create and every order-line mutation; re-based at allocate"
    algorithm: tiered_pricing
    formula: |
      For each order line independently:

        resolved_list_cents = list_price_cents of the line's terminal current
                              part (supersession chain resolved before pricing)
        band = the tier band of the account's order_sequence at the moment the
               order was created (PartOrder.member_sequence):
          member_sequence 1 or 2                           -> BRONZE
          member_sequence 3, 4 or 5                        -> SILVER
          member_sequence 6 or 7                           -> GOLD
          member_sequence 8 or greater                     -> PLATINUM
        rate = TIER_BANDS[band].discount_rate

      PROVISIONAL reading (status DRAFT and CONFIRMED):
        line_discount_cents = round_half_up(resolved_list_cents * rate)
        unit_price_cents    = resolved_list_cents - line_discount_cents
        parts_subtotal_cents = sum(unit_price_cents * quantity)
        tier_discount_cents  = sum(line_discount_cents * quantity)

      FINAL reading (status ALLOCATED and beyond):
        total_list_cents     = sum(resolved_list_cents * quantity)
        tier_discount_cents  = round_half_up(total_list_cents * rate)
        parts_subtotal_cents = total_list_cents - tier_discount_cents
        unit_price_cents is NOT rewritten; it keeps the provisional per-line
        value, so parts_subtotal_cents and sum(unit_price_cents * quantity)
        intentionally disagree after allocation.

      The band is a STEP function of member_sequence, not a marginal schedule:
      the whole line takes the band's rate. member_sequence 1 and 2 both price
      at BRONZE, so an account's first two orders never receive a discount.
    input_set: "Order lines on the PartOrder being priced; band selected from PartOrder.member_sequence"
    constants:
      TIER_BANDS:
        BRONZE:   { discount_rate: 0.00, promise_multiplier: 1.00 }
        SILVER:   { discount_rate: 0.05, promise_multiplier: 0.80 }
        GOLD:     { discount_rate: 0.10, promise_multiplier: 0.60 }
        PLATINUM: { discount_rate: 0.15, promise_multiplier: 0.50 }
    precision: "integer cents; round_half_up at each named rounding point"
    variants:
      - name: provisional
        when: "PartOrder.status is DRAFT or CONFIRMED"
        difference: "Each line is rounded independently, so tier_discount_cents can exceed the order-level figure by up to one cent per line"
      - name: final
        when: "PartOrder.status is ALLOCATED or beyond"
        difference: "tier_discount_cents and parts_subtotal_cents are re-based on the single order-level rounding, so they differ from the provisional values for identical input data"

  # ---------------------------------------------------------------------------
  - name: order_satisfaction
    trigger: "PartOrder create, every line mutation, confirm and allocate"
    algorithm: weighted_scoring
    formula: |
      order_base_cents is computed ONCE at PartOrder creation and then STORED:

        order_base_cents = round_half_up(
                             sum over the creation-time lines of
                             (resolved_list_cents * quantity) * BASE_FRACTION)

      On creation and on every later recompute:

        incremental_cents = round_half_up(
                              order_base_cents * (1 + member_sequence * GROWTH_RATE))
        satisfaction_cents = min(incremental_cents, SATURATION_CEILING)

      member_sequence is the account's order_sequence value captured at
      creation. Line mutations after creation recompute incremental_cents from
      the STORED order_base_cents — the base does not grow with the basket.
    input_set: "The order's creation-time line basket (for order_base_cents only) and PartOrder.member_sequence"
    constants:
      BASE_FRACTION: 0.015
      GROWTH_RATE: 0.20
      SATURATION_CEILING: 1200
    precision: "integer cents; round_half_up at each named rounding point"
    note: "A line added after creation changes nothing in this formula, because order_base_cents is frozen"

  # ---------------------------------------------------------------------------
  - name: delivery_fee_schedule
    trigger: "PartOrder create, confirm and every source re-selection"
    algorithm: threshold
    formula: |
      base_fee_cents = DELIVERY_FEE_CENTS
      delivery_free  = (PartOrder.fulfillment_route == STORE)
                       OR (PartOrder.fulfillment_route == HUB
                           AND account.delivery_service_level == HUB_DAILY)
      (the route string must be exactly "STORE", and the service level string
       must be exactly "HUB_DAILY"; "HUB_DAILY_SHORT" is a different service
       level and does NOT satisfy the free-delivery clause)

      if delivery_free: delivery_fee_cents = 0
      else:             delivery_fee_cents = base_fee_cents

      delivery_fee_cents is NOT recomputed at ALLOCATED or at DELIVERED.
    input_set: "PartOrder.fulfillment_route and the owning CommercialAccount.delivery_service_level"
    constants:
      DELIVERY_FEE_CENTS: 795
    precision: "integer cents; no rounding"
    variants:
      - name: point_of_sale
        when: "Quoted to the shop at DRAFT and CONFIRMED"
        difference: "Reads the routing decision made at that moment"
      - name: final_actual
        when: "Read again at DELIVERED; equal to point_of_sale unless the confirmed source store differs from the delivered source store"
        difference: "Identical routing inputs can read 0 or 795 depending on which moment is observed"

  # ---------------------------------------------------------------------------
  - name: source_promise
    trigger: "PartOrder create (provisional) and confirm (selected)"
    algorithm: threshold
    formula: |
      Routing decision, evaluated in band order; the FIRST matching band wins:

        band 1 (miles in [0, 15]):
          request_at <= cutoff_at - cutoff_buffer_minutes
          AND satellite.available_units >= line_quantity
          AND satellite.committed_units_today + line_quantity <= daily_capacity_units
            -> source = satellite (SATELLITE), source_days = 0
        band 2 (miles in [0, 15]):
          hub.available_units >= line_quantity
          AND cutoff_at >= request_at
          AND cutoff_at + CUTOFF_CUSHION >= request_at + HUB_DELIVERY_MINUTES
            -> source = hub (HUB), source_days = 0
        band 3 (miles in [0, 15]):
          mega_hub.available_units >= line_quantity
          AND cutoff_at >= request_at
          AND cutoff_at + CUTOFF_CUSHION >= request_at + MEGA_HUB_DELIVERY_MINUTES
            -> source = mega_hub (MEGA_HUB), source_days = 0
        band 4 (miles in [0, 15]):
          dc.available_units >= line_quantity AND cutoff_at >= request_at
            -> source = dc (DC), source_days = 1
        band 5 (miles in (15, 35]):
          hub.available_units >= line_quantity
            -> source = hub (HUB), source_days = 1
        band 6 (miles in (15, 35]):
          mega_hub.available_units >= line_quantity
            -> source = mega_hub (MEGA_HUB), source_days = 1
        band 7 (miles in (15, 35]):
          dc.available_units >= line_quantity
            -> source = dc (DC), source_days = 2
        band 8 (miles strictly greater than 35):
            -> no source; fulfillment_route = UNROUTABLE

      Chain limitation: bands 3, 4, 6 and 7 are only reachable when the
      account's home store resolves the chain SATELLITE -> hub -> mega_hub -> DC.
      When the account's home store is itself a HUB or a MEGA_HUB those bands are
      skipped silently (no error), and when it is a DC bands 1..7 all fail
      against the DC's own stock so the order resolves to band 5 or 6 against
      the hub it names.

      The band is chosen on the order's FIRST line; every line of the order
      shares one fulfillment_route. cutoffs and radius are read from the
      account's home store.

      fulfillment_route = SATELLITE -> "STORE", HUB -> "HUB",
                          MEGA_HUB -> "MEGA_HUB", DC -> "DC"

      promised_at = ((request_date + source_days) at 08:00:00Z)
                    + round_half_up(base_promise_minutes * promise_multiplier)

      base_promise_minutes = the winning source Store's promise_time_minutes
      promise_multiplier   = TIER_BANDS[band].promise_multiplier for STORE and
                             HUB sources, and exactly 1.00 for MEGA_HUB and DC
                             sources (no tier acceleration on warehouse drops)
    input_set: "InventoryItem.available_units at the account's home store, its hub, the hub's mega-hub and the mega-hub's DC; Store.committed_units_today and Store.daily_capacity_units; the account's delivery_service_level and tier band"
    constants:
      SHOP_DELIVERY_RADIUS_MILES: 15
      EXTENDED_RADIUS_MILES: 35
      HUB_DELIVERY_MINUTES: 60
      MEGA_HUB_DELIVERY_MINUTES: 90
      CUTOFF_CUSHION: 120
      PROMISE_BASE_08_00_UTC: "08:00:00Z"
    precision: "integer minutes; round_half_up; promised_at is a whole minute"
    variants:
      - name: provisional
        when: "Evaluated at PartOrder create against the home store's live availability"
        difference: "May route to the home store while stock is still unpromised"
      - name: selected
        when: "Evaluated at PartOrder confirm after earlier orders on the same account and store have already been committed"
        difference: "Shifts the identical basket to a deeper band, producing a different fulfillment_route and a later promised_at"

  # ---------------------------------------------------------------------------
  - name: core_credit
    trigger: "CoreReturn inspection"
    algorithm: aggregation
    formula: |
      credit_amount_cents = refundable_portion_cents + core_charge_credit_cents

      refundable_portion_cents =
        min( round_half_up(core_subtotal_cents * REFUNDABLE_RATE),
             PartOrder.refundable_deposit_cents
               - PartOrder.refundable_deposit_consumed_cents )

      core_charge_portion_cents =
        max( ceil(CORE_PORTION_RATE_A * CoreReturn.core_subtotal_cents),
             ceil(CORE_PORTION_RATE_B * PartOrder.core_charge_total_cents) )

      restocking_fee_cents = 0 when warranty_covered
                           = round_half_up(RESTOCKING_RATE
                                           * core_charge_portion_cents) otherwise

      core_charge_credit_cents = core_charge_portion_cents - restocking_fee_cents

      warranty_covered is pinned at inspection and equal to:
        EXISTS a WarrantyRegistration r where
          r.account_id == CoreReturn.account_id
          AND r.part_id is any part on the CoreReturn OR any part on that
              part's supersession chain
          AND r.warranty_expires_at >= the logical clock at inspection
      The lookup performs NO match on claim_reference and NO match on
      purchase_order_id: a credit is issued whether or not the shop can present
      a receipt. purchase_order_id may be null on the registration.
    input_set: "Lines on the CoreReturn; the referenced PartOrder.core_charge_total_cents, refundable_deposit_cents and refundable_deposit_consumed_cents; WarrantyRegistration rows for the account"
    constants:
      REFUNDABLE_RATE: 0.20
      CORE_PORTION_RATE_A: 0.60
      CORE_PORTION_RATE_B: 0.30
      RESTOCKING_RATE: 0.15
    precision: "integer cents; round_half_up for the refundable portion and the restocking fee, ceil for both core-charge portion terms before the max is taken"
    variants:
      - name: receipt_based
        when: "A non-expired WarrantyRegistration resolves for the return, whatever its claim_reference or purchase_order_id"
        difference: "restocking_fee_cents is 0, so the whole core_charge_portion_cents is credited"
      - name: no_receipt_based
        when: "No non-expired WarrantyRegistration resolves"
        difference: "restocking_fee_cents is netted out of core_charge_portion_cents, so the credit is strictly smaller for the identical returned basket"

  # ---------------------------------------------------------------------------
  - name: ordered_quantity_credit
    trigger: "CoreReturn inspection"
    algorithm: aggregation
    formula: |
      For each line on the CoreReturn, in ascending line index order:
        matched_quantity += min( line.quantity,
                                 quantity of that part on the referenced
                                 PartOrder's lines )
      ordered_quantity_credit_cents =
        sum over lines of Part.core_charge_cents of the line's part
                            * matched_quantity
      This is the credit the account is ENTITLED to as a function of what it
      bought, and it is NOT capped.
    input_set: "Core lines and the referenced PartOrder's lines"
    constants:
      UNORDERED_CREDIT_ALLOWED: false
    precision: "integer cents; no rounding"
    note: "Distinct from core_credit, which caps the payout"

  # ---------------------------------------------------------------------------
  - name: refundable_deposit_amount
    trigger: "PartOrder create, confirm and every ToolLoan checkout on the account"
    algorithm: waterfall_allocation
    formula: |
      PartOrder.refundable_deposit_cents = round_half_up(total_core_charge * 0.20)
        + sum over ToolLoans on the account whose loaned_order_id is this order
          of ToolLoan.deposit_amount_cents

      total_core_charge = PartOrder.core_charge_total_cents, computed as
        sum over lines of Part.core_charge_cents * quantity

      The order-level rounding is applied ONCE to the summed core subtotal.
      Payouts are then drawn against this ceiling in ascending CoreReturn
      line index order:

        remaining_cap = PartOrder.refundable_deposit_cents
                        - PartOrder.refundable_deposit_consumed_cents
        refundable_portion_cents = min(payout_requested_cents, remaining_cap)
        PartOrder.refundable_deposit_consumed_cents += refundable_portion_cents

      Once the cap is exhausted further payouts are 0, never negative.
    input_set: "The order's core lines; the account's ToolLoans attached to this order; credits already posted"
    constants:
      DEPOSIT_FRACTION: 0.20
      ALLOW_NEGATIVE_PAYOUT: false
    precision: "integer cents; round_half_up applied once to the order-level core subtotal"

  # ---------------------------------------------------------------------------
  - name: route_run_credit
    trigger: "ServiceRoute completion"
    algorithm: conditional_rate
    formula: |
      AFFILIATE branch (driver_type == AFFILIATE):

        rate_per_mile_cents = LONG_RUN_RATE_CENTS  when total_miles >= LONG_RUN_MILES
                              else STANDARD_RATE_CENTS
        run_credit_cents = BASE_CENTS
                           + rate_per_mile_cents * round_half_up(total_miles)

        (LONG_RUN_RATE_CENTS is exactly HALF of STANDARD_RATE_CENTS. The
         comparison is a greater-or-equal, so a run of exactly LONG_RUN_MILES
         already takes the long-run rate.)

      OWNED branch (driver_type == OWNED):

        attributed_cents = sum over the route's DELIVERED stops of the
                           PartOrder.delivery_fee_cents of the orders dropped there
        run_credit_cents = max( round_half_up(attributed_cents * OWNED_SHARE),
                                MIN_OWNED_CREDIT_CENTS )

      The two branches read DISJOINT inputs — the affiliate branch reads
      ServiceRoute.total_miles and never the orders; the owned branch reads the
      delivered orders and never the mileage. A route is credited under exactly
      one branch, chosen by ServiceRoute.driver_type.
    input_set: "ServiceRoute.total_miles for the affiliate branch; the PartOrders delivered on the route for the owned branch"
    constants:
      BASE_CENTS: 500
      STANDARD_RATE_CENTS: 40
      LONG_RUN_RATE_CENTS: 20
      LONG_RUN_MILES: 40
      OWNED_SHARE: 0.35
      MIN_OWNED_CREDIT_CENTS: 150
    precision: "integer cents; round_half_up at each named point"

  # ---------------------------------------------------------------------------
  - name: replacement_selection
    trigger: "ToolLoan inspection when return_condition is WORN, and ToolCatalog wear-band re-selection"
    algorithm: selector_policy
    formula: |
      Two candidate-set levels exist and are NOT interchangeable:

        LEVEL 2 (catalogue level, used when ToolCatalog.replacement_part_id is
                 re-selected on a wear-band change):
          2a. Parts p such that EXISTS ToolFitment f with
                f.tool_catalog_id == ToolCatalog.id AND f.part_id == p.id
                AND p.catalog_state == ACTIVE
                AND InventoryItem(store == CommercialAccount.home_store_id,
                                  part == p.id).available_units > 0
          2b. Parts p such that EXISTS ToolFitment f with
                f.tool_catalog_id == ToolCatalog.id AND f.part_id == p.id
                AND p.catalog_state == ACTIVE
          2c. The single Part ToolCatalog.replacement_part_id as it stood before
              this re-selection
          Level 2 evaluates 2a, then 2b, then 2c; the first non-empty set wins.

        LEVEL 1 (loan level, used when ToolLoan.replacement_part_id is set at
                 inspection for a WORN return):
          1a. Parts p such that EXISTS ToolFitment f with
                f.tool_catalog_id == ToolLoan.tool_catalog_id AND f.part_id == p.id
                AND p.catalog_state == ACTIVE
                AND InventoryItem(store == that loan's account home_store_id,
                                  part == p.id).available_units > 0
          1b. Parts p such that EXISTS ToolFitment f with
                f.tool_catalog_id == ToolLoan.tool_catalog_id AND f.part_id == p.id
                AND p.catalog_state == ACTIVE
          1c. The single Part ToolCatalog.replacement_part_id of the loan's tool
          Level 1 evaluates 1a, then 1b, then 1c; the first non-empty set wins.

      Within the winning set, candidates are ranked by this sort key, ascending
      on every position:

        sort key = ( PlacementRank ASC, DepthRank ASC, list_price_cents ASC,
                     Part.created_at ASC )

        PlacementRank = 1 when ToolFitment.placement is FRONT or REAR_LEFT
                      = 2 when ToolFitment.placement is REAR_RIGHT
                      = 3 otherwise (OTHER)
        DepthRank     = ToolFitment.depth_index, compared ASC (lower index wins)

      Part.id is NEVER a ranking or tie-break key; Part.created_at breaks any
      remaining tie.

      Boundary notes: FRONT and REAR_LEFT are BOTH rank 1, so a FRONT part and
      a REAR_LEFT part tie on placement and the depth index decides. REAR_RIGHT
      is rank 2 and never rank 1. depth_index is compared ascending.

      Empty candidate set at every level (levels 1a, 1b and 1c all empty):
        -> replacement_part_id stays null, no replacement is offered, and the
           ToolLoan deposit is retained in full (forfeiture_rate pinned to 1.00)
    input_set: "ToolFitment rows for the tool; Part.catalog_state; InventoryItem.available_units at the relevant home store"
    constants:
      FRONT_PLACEMENT_RANK: 1
      REAR_LEFT_PLACEMENT_RANK: 1
      REAR_RIGHT_PLACEMENT_RANK: 2
      OTHER_PLACEMENT_RANK: 3
    precision: "no arithmetic; ordering only"

  # ---------------------------------------------------------------------------
  - name: account_posture_derivation
    trigger: "Every write that can change the account's receivable, orders, loans or core returns"
    algorithm: derived_field
    formula: |
      account_posture is derived on every relevant write; it is NEVER
      client-settable:

        if account_posture is currently CLOSED:
          account_posture = CLOSED            (terminal; nothing re-derives it)
        elif account_posture is currently ON_HOLD
             and the aging condition does NOT hold:
          account_posture = ON_HOLD           (sticky until release)
        elif receivable_balance_cents > 0
             and oldest PartOrder.delivered_payment_due_at on this account
                 < logical clock - (credit_terms_days + AGING_GRACE_DAYS days):
          account_posture = CREDIT_SUSPENDED
        else:
          account_posture = OPEN

      Precedence: CLOSED is checked first, then the ON_HOLD stickiness, then the
      aging test. An account whose oldest due instant is exactly
      credit_terms_days + AGING_GRACE_DAYS before the clock is NOT suspended —
      the comparison is strictly earlier.

      ON_HOLD is only ever SET BY POST .../hold (which requires
      credit_exposure_cents > credit_limit_cents) and only ever cleared by
      POST .../release. The exposure test therefore never appears in this
      derivation.
    input_set: "PartOrder rows on the account; the account's credit_limit_cents, credit_terms_days and the logical clock"
    constants:
      AGING_GRACE_DAYS: 30
    precision: "no rounding; integer day arithmetic"
  # ---------------------------------------------------------------------------
  - name: stop_sequence_derivation
    trigger: "ServiceRoute planning (POST /commercial/service-routes/{routeId}/plan) and every stop-set mutation on a non-terminal route"
    algorithm: chronological
    formula: |
      Every non-REJECTED RouteStop on the route is ordered by an explicit key:

        sort key = ( delivery_window_start ASC, RouteStop.created_at ASC )

      RouteStop.id is NEVER a key, not even as a final tie-break. Two stops
      that share a delivery_window_start are separated by created_at, so the
      stop that was attached first is served first.

      stop_sequence is then assigned 1..N over that ordering, and the projection
      chain is walked in the same order:

        effective_departure_at =
          departure_at when no RETURN_DESK stop exists
          else max(departure_at, the latest RETURN_DESK stop's delivery_window_start)
          (contrast: resolve_departure_time in the PRD prose minimises the
           departure offset instead of maximising it, and the two disagree on
           every route whose return-desk window opens in the evening)

        first stop: projected_arrival_at   = effective_departure_at + travel_minutes_from_previous
        later stops: projected_arrival_at  = previous stop's projected_departure_at
                                             + travel_minutes_from_previous
        projected_departure_at = projected_arrival_at + drop_minutes
        lateness_minutes = max(0, projected_departure_at - delivery_window_end)

      ServiceRoute.return_at = the last stop's projected_departure_at, or
      departure_at when the route has no stops.
    input_set: "Every non-REJECTED RouteStop on the route; ServiceRoute.departure_at"
    constants:
      ORDERING_TIE_BREAK: "RouteStop.created_at ASC"
    precision: "whole minutes; no rounding"
# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
#
# Ordering doctrine: an unconfigured clock (no POST /_clock/set_current_utc
# call yet in the process) is NOT a validation failure. Every time-dependent
# rule below reads the fixed startup default 2026-09-01T00:00:00Z until the
# clock endpoint is called.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and the role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The caller's role must be listed in the endpoint's roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource ids appearing in the path must exist, validated left-to-right in path order"
    error_id: "ERR_{RESOURCE}_NOT_FOUND, chosen by the first failing path segment; the concrete ids are ERR_COMMERCIAL_ACCOUNT_NOT_FOUND, ERR_PART_ORDER_NOT_FOUND, ERR_TOOL_LOAN_NOT_FOUND, ERR_CORE_RETURN_NOT_FOUND, ERR_SERVICE_ROUTE_NOT_FOUND, ERR_ROUTE_STOP_NOT_FOUND, ERR_STORE_NOT_FOUND, ERR_PART_NOT_FOUND, ERR_VEHICLE_NOT_FOUND, ERR_SALES_REP_NOT_FOUND, ERR_COVERAGE_NOT_FOUND, ERR_TOOL_CATALOG_NOT_FOUND, ERR_INVENTORY_ITEM_NOT_FOUND; a malformed body on any of them returns ERR_INVALID_REQUEST"
    http_status: 404
    applies_to: all endpoints carrying an id in the path

  - priority: 4
    category: state
    check: "The target resource must be in the state named by its transition's `from:` clause"
    error_id: "ERR_ORDER_NOT_DRAFT, ERR_LOAN_NOT_REQUESTED, ERR_ROUTE_NOT_DRAFT, ERR_PART_NOT_SUPERSEDED, ERR_CORE_RETURN_NOT_IN_TRANSIT, ERR_COVERAGE_NOT_STARTED, ERR_INVALID_ACCOUNT_POSTURE, ERR_STOP_NOT_EN_ROUTE and their siblings"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 5
    category: business_safety
    check: "Part.is_hazardous lines may not be added to an order whose account delivery_service_level is DELIVERY_DESK"
    error_id: ERR_HAZARDOUS_PART_NOT_DELIVERABLE
    http_status: 400
    applies_to: "PUT /commercial/part-orders/{orderId}, POST /commercial/part-orders/{orderId}/confirm"

  - priority: 6
    category: business_safety
    check: "PartFitment.year_to must be greater than or equal to PartFitment.year_from"
    error_id: ERR_FITMENT_YEAR_RANGE_INVALID
    http_status: 400
    applies_to: "POST /commercial/parts/{partId}/fitments"

  - priority: 7
    category: business_referential
    check: "A PartOrder line's part must either fit PartOrder.vehicle_id through a PartFitment row, or resolve through PartInterchange or the supersession chain to a part that does"
    error_id: ERR_FITMENT_MISMATCH
    http_status: 409
    applies_to: "POST /commercial/part-orders"

  - priority: 8
    category: business_referential
    check: "The superseding part named in a supersession must exist, be non-archived, be the terminal current part of its own chain, and must not already be an ancestor of the part being superseded"
    error_id: "ERR_SUPERSEDING_PART_NOT_FOUND | ERR_SUPERSEDING_PART_NOT_TERMINAL | ERR_SUPERSESSION_CYCLE (first failing condition wins, in that order)"
    http_status: 409
    applies_to: "POST /commercial/parts/{partId}/supersede"

  - priority: 9
    category: business_referential
    check: "A CommercialAccount, Part or Store may not be archived while a non-terminal resource references it"
    error_id: ERR_ARCHIVE_BLOCKED_BY_OPEN_REFERENCE
    http_status: 409
    applies_to: "POST /commercial/parts/{partId}/archive and POST /commercial/stores/{storeId}/archive"

  - priority: 10
    category: business_constraint
    check: "Every line of a confirmed PartOrder must be reservable: the selected source's InventoryItem must hold available_units >= the line quantity for the resolved current part"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "PUT /commercial/part-orders/{orderId}, POST /commercial/part-orders/{orderId}/confirm, POST /commercial/part-orders/{orderId}/allocate"

  - priority: 11
    category: business_constraint
    check: "An account may hold at most one PartOrder in {ALLOCATED, PICKING} against the same source store in the same business day"
    error_id: ERR_SAME_DAY_SLOT_TAKEN
    http_status: 409
    applies_to: "POST /commercial/part-orders/{orderId}/allocate"

  - priority: 12
    category: business_constraint
    check: "After reservation, the selected source store's committed_units_today must not exceed its daily_capacity_units; checked twice — once after unit reservation and once again after the capacity epoch is applied"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /commercial/part-orders/{orderId}/confirm"

  - priority: 13
    category: business_constraint
    check: "A PartOrder and its core lines must be delivered within the window ending 30 days after PartOrder.delivered_payment_due_at"
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /commercial/part-orders/{orderId}/return, POST /commercial/core-returns"

  - priority: 14
    category: business_constraint
    check: "A CoreReturn line's quantity may not exceed the quantity of that part on the referenced PartOrder"
    error_id: ERR_CORE_QUANTITY_EXCEEDS_PURCHASE
    http_status: 409
    applies_to: "POST /commercial/core-returns/{coreReturnId}/inspect"

  - priority: 15
    category: business_temporal
    check: "RouteStop.delivery_window_start must be earlier than RouteStop.delivery_window_end, and no stop's delivery_window_end may be earlier than the route's departure_at"
    error_id: "ERR_INVALID_DELIVERY_WINDOW | ERR_STOP_WINDOW_BEFORE_DEPARTURE"
    http_status: 400
    applies_to: "POST /commercial/service-routes/{routeId}/stops, POST /commercial/service-routes/{routeId}/plan"

  - priority: 16
    category: business_temporal
    check: "A new CUSTOMER RouteStop's delivery window must not overlap an existing non-REJECTED CUSTOMER RouteStop's window for the same account on the same service date; RETURN_DESK stops are exempt so that a shop's return-desk stop and its delivery stop may share a day"
    error_id: ERR_STOP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /commercial/service-routes/{routeId}/stops"

  - priority: 17
    category: business_temporal
    check: "A new RepCoverage effective window must not overlap an existing non-EXPIRED RepCoverage window for the same account_id"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /commercial/rep-coverages"

  - priority: 18
    category: business_temporal
    check: "A driver may hold at most one ServiceRoute in {DRAFT, PLANNED, DISPATCHED} per service_date"
    error_id: ERR_DRIVER_ROUTE_CONFLICT
    http_status: 409
    applies_to: "POST /commercial/service-routes"

  - priority: 19
    category: business_fiscal
    check: "The cumulative credit exposure of the account must remain at or below its credit limit, including the deposit of any ToolLoan being checked out"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /commercial/part-orders/{orderId}/confirm, POST /commercial/tool-loans/{loanId}/checkout, POST /commercial/commercial-accounts/{accountId}/hold"

  - priority: 20
    category: business_fiscal
    check: "The account's receivable balance must be zero before an account may be closed"
    error_id: ERR_RECEIVABLE_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /commercial/commercial-accounts/{accountId}/close"

  - priority: 21
    category: business_fiscal
    check: "Every warranty-covered core credit must belong to a WarrantyRegistration whose warranty_expires_at is at or after the logical clock; an expired warranty does not block the credit but removes the restocking-fee waiver"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /commercial/core-returns"

  - priority: 22
    category: business_fiscal
    check: "The requested refundable amount on a ToolLoan inspection must not exceed ToolLoan.deposit_amount_cents"
    error_id: ERR_DEPOSIT_AMOUNT_EXCEEDS_CHARGE
    http_status: 409
    applies_to: "POST /commercial/tool-loans/{loanId}/inspect"

  - priority: 22
    category: business_constraint
    check: "Every order line's record_id must be greater than zero"
    error_id: ERR_INVALID_LINE_REFERENCE
    http_status: 400
    applies_to: "POST /commercial/part-orders, PUT /commercial/part-orders/{orderId}, POST /commercial/part-orders/{orderId}/confirm"

  - priority: 24
    category: business_constraint
    check: "A destination id supplied on an order must match the PartOrder id in the path"
    error_id: ERR_DESTINATION_MISMATCH
    http_status: 400
    applies_to: "PUT /commercial/part-orders/{orderId}, POST /commercial/part-orders/{orderId}/confirm"

  - priority: 25
    category: business_referential
    check: "A PartOrder may only be priced at the band its own account has reached: repointing an order at another account whose order_sequence differs is rejected"
    error_id: ERR_ACCOUNT_TIER_MISMATCH
    http_status: 409
    applies_to: "PUT /commercial/part-orders/{orderId}"

  - priority: 25
    category: business_referential
    check: "An order's shipping_address must resolve to the account's shipping_address, its billing_address, or its home store's address — it must never be the home store resolved for an unrelated account"
    error_id: ERR_DELIVERY_ADDRESS_MISMATCH
    http_status: 409
    applies_to: "POST /commercial/part-orders/{orderId}/deliver"

  - priority: 26
    category: business_constraint
    check: "Every line on an order being returned must carry Part.is_returnable true"
    error_id: ERR_PART_NOT_RETURNABLE
    http_status: 409
    applies_to: "POST /commercial/part-orders/{orderId}/return"

  - priority: 27
    category: business_constraint
    check: "Restocking fees apply only to non-warranty core credit: a warranty-covered return must be credited with no restocking fee. Vestigial pairing rule kept separate from the other fee checks, evaluated last."
    error_id: ERR_RESTOCKING_FEE_MISAPPLIED
    http_status: 409
    applies_to: "POST /commercial/core-returns/{coreReturnId}/inspect"

  - priority: 23
    category: business_constraint
    check: "Rollback of a DISPATCHED PartOrder must happen within the 30-minute rollback window measured from the earliest RouteStop.delivered_at on its route"
    error_id: ERR_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /commercial/part-orders/{orderId}/refit, POST /commercial/route-stops/{stopId}/reject"

  - priority: 24
    category: business_constraint
    check: "The optimistic-concurrency guard on every parent-versioned write: the supplied expected version must be the parent's current version"
    error_id: "ERR_STALE_ACCOUNT_VERSION | ERR_STALE_ROUTE_VERSION"
    http_status: 412
    applies_to: "POST /commercial/part-orders, PUT /commercial/part-orders/{orderId}, POST /commercial/part-orders/{orderId}/confirm, POST /commercial/part-orders/{orderId}/allocate, PUT /commercial/commercial-accounts/{accountId}, POST /commercial/tool-loans/{loanId}/checkout, PUT /commercial/tool-loans/{loanId}, POST /commercial/service-routes/{routeId}/stops, POST /commercial/service-routes/{routeId}/plan"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- clock (test-driving, last-resort rung of the §1.5 priority ladder) ---
  - method: POST
    path: "/commercial/_clock/set_current_utc"
    description: "Set the server's logical clock. Before the first call the logical clock reads the fixed startup default 2026-09-01T00:00:00Z and never the real wall clock."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime, default_utc: datetime }
    side_effects: ["logical clock = to_iso8601"]

  - method: POST
    path: "/commercial/_epoch/advance"
    description: "Advance the business-day epoch for every Store whose capacity_epoch_at is at least 24 hours before the requested instant: committed_units_today resets to 0 for those stores and capacity_epoch_at is set to the requested instant. Stores whose capacity_epoch_at is already within 24 hours of the requested instant are left untouched. This is the operator relay that makes the daily-capacity boundary observable."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ advanced_store_ids: string[], reset_unit_total: integer }"
    side_effects: ["committed_units_today = 0 for every advanced store", "capacity_epoch_at = to_iso8601 for every advanced store"]

  # --- CommercialAccount ---
  - method: POST
    path: "/commercial/commercial-accounts"
    description: "Create a commercial account for a repair shop"
    roles: [CommercialSalesRep]
    code: 201
    input: ["shop_name", "tax_id", "billing_address", "shipping_address?", "home_store_id", "credit_limit_cents", "credit_terms_days", "delivery_service_level"]
    output: CommercialAccount
    side_effects:
      - "tier = BRONZE; petty_cash_cents = 0; order_sequence = 0; is_archived = false"
      - "account_posture derived by account_posture_derivation"

  - method: GET
    path: "/commercial/commercial-accounts"
    description: "List commercial accounts; archived accounts are excluded unless include_archived=true"
    roles: [CommercialSalesRep, CreditAnalyst, RouteDispatcher, DeliveryDriver, PartsCategoryManager, Any]
    code: 200
    input: ["include_archived?", "shop_name?", "home_store_id?", "limit?", "offset?"]
    output: "CommercialAccount[]"
    side_effects: []

  - method: GET
    path: "/commercial/commercial-accounts/{accountId}"
    description: "Get one commercial account"
    roles: [CommercialSalesRep, CreditAnalyst, RouteDispatcher, DeliveryDriver, PartsCategoryManager, Any]
    code: 200
    input: []
    output: CommercialAccount
    side_effects: []

  - method: GET
    path: "/commercial/commercial-accounts/{accountId}/part-orders"
    description: "Find the part orders placed by a commercial account"
    roles: [CommercialSalesRep, CreditAnalyst, RouteDispatcher, DeliveryDriver, PartsCategoryManager, Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PartOrder[]"
    side_effects: []

  - method: GET
    path: "/commercial/commercial-accounts/{accountId}/tool-loans"
    description: "Find the loaner tool records held by a commercial account"
    roles: [ToolCribAttendant, CommercialSalesRep, CreditAnalyst, DeliveryDriver, Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ToolLoan[]"
    side_effects: []

  - method: GET
    path: "/commercial/commercial-accounts/{accountId}/core-returns"
    description: "Find the core returns raised by a commercial account"
    roles: [CommercialSalesRep, CreditAnalyst, ToolCribAttendant, DeliveryDriver, Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CoreReturn[]"
    side_effects: []

  - method: GET
