              captures: { sale_id: $.data.id }
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /counties/${county_id}/sales/${sale_id}/listings"
              payload: { parcel_id: "${parcel_id}" }
              as: CountyTreasurer
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "Parcel.${parcel_id}.status == ON_SALE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_sub_tax_year_on_certificate
        grounds:
          - validations[priority=13]
          - entities.SubsequentTax.fields.tax_year
          - errors[ERR_DUPLICATE_SUB_TAX]
        distinguishing_aspect: "Discrete-interval (tax-year) overlap on the Certificate resource: a SubsequentTax occupies a single tax_year point; a second sub-tax for the same tax_year on the same certificate collides and is rejected with ERR_DUPLICATE_SUB_TAX (point-equality interval semantics)."
        test_recipe:
          setup:
            - "Certificate ACTIVE held by I1 (escrow 300000) with a POSTED sub-tax for tax_year 2026. A second sub-tax for tax_year 2026 is attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CountyTreasurer
            - call: "POST /counties"
              payload: { name: "Ov County", state_code: "AZ", max_interest_rate_bps: 1600, bid_down_increment_bps: 100, redemption_period_days: 365, sub_tax_interest_rate_bps: 1600, premium_bidding_enabled: false, day_count_basis: 365 }
              as: CountyTreasurer
              captures: { county_id: $.data.id }
            - call: "POST /counties/${county_id}/parcels"
              payload: { apn: "OV-1", owner_name: "Owner OV", assessed_value_cents: 5000000, base_tax_due_cents: 100000 }
