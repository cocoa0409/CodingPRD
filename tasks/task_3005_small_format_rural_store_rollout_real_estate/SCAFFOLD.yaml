    side_effects: []
  - method: GET
    path: "/rollouts/dc-assignments/{asgid}"
    description: "Get a DC assignment by id"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
    code: 200
    input: []
    output: DCAssignment
    side_effects: []
  - method: GET
    path: "/rollouts/route-plans/{rpid}"
    description: "Get a route plan by id"
    roles: [PROGRAM_ADMIN, REAL_ESTATE_MANAGER, NETWORK_PLANNER, OPERATIONS_LEAD, FINANCE_ANALYST]
