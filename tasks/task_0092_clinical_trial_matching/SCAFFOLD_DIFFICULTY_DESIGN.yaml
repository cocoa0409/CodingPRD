          - entities.Visit.fields.scheduled_at
          - entities.Visit.fields.draw_window_minutes
        distinguishing_aspect: "Sum-of-half-widths buffer interval semantics on the Visit resource: two visits collide unless |Δscheduled_at| >= w_a + w_b. With visit A at 10:00 (w=30) and B at 10:45 (w=30), |Δ|=45min < 60min => overlap rejected; B at 11:00 (|Δ|=60==60) is accepted (touching allowed)."
