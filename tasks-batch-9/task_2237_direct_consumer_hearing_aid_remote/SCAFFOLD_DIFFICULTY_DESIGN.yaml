            as: PlatformAdmin
            as_user_id: "admin_1"
            captures: { pol: "$.data.id" }
          - call: "POST /providers"
            payload: { provider_type: "TELECARE_FITTER", npi: "1548273901", full_name: "Sam Fitter", licensed_state_codes: ["CA"], daily_capacity_minutes: 480, buffer_minutes: 10 }
            as: PlatformAdmin
