# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint per §1.7" }

  # --- Existence ---
  - { id: ERR_BRANCH_NOT_FOUND, http: 404, condition: "Branch id does not exist" }
  - { id: ERR_CENTER_MANAGER_NOT_FOUND, http: 404, condition: "CenterManager id does not exist" }
  - { id: ERR_CENTER_NOT_FOUND, http: 404, condition: "Center id does not exist" }
  - { id: ERR_PEER_GROUP_NOT_FOUND, http: 404, condition: "PeerGroup id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "LoanApplication id does not exist" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "Loan id does not exist" }
  - { id: ERR_MEETING_NOT_FOUND, http: 404, condition: "CenterMeeting id does not exist" }
  - { id: ERR_TRAINING_SESSION_NOT_FOUND, http: 404, condition: "GroupTrainingSession id does not exist" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "RepaymentTransaction id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "BranchExpansionPlan id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Member has no SavingsAccount yet" }

  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, bad enum, duplicate national_id, or non-positive / non-multiple-of-100 amount" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "end_time <= start_time (training) or scheduled_end <= scheduled_start (meeting)" }

  # --- Concurrency ---
  - { id: ERR_STALE_LOAN_VERSION, http: 412, condition: "expected_loan_version does not match Loan.version (OCC on restructure creation)" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid source state for the requested transition (e.g., dissolving a FORMING/TRAINING group)" }
  - { id: ERR_APPLICATION_NOT_DRAFT, http: 409, condition: "Submit requires application DRAFT" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "Disburse requires application APPROVED" }
  - { id: ERR_APPLICATION_NOT_VOTING, http: 409, condition: "Vote requires application VOTING" }
  - { id: ERR_MEETING_NOT_SCHEDULED, http: 409, condition: "Open/cancel requires meeting SCHEDULED" }
  - { id: ERR_MEETING_NOT_OPEN, http: 409, condition: "Attendance/collections/close require meeting OPEN" }
  - { id: ERR_MEETING_NOT_CLOSED, http: 409, condition: "Reconcile requires meeting CLOSED" }
  - { id: ERR_ALREADY_RECONCILED, http: 409, condition: "Reconcile requires settlement_status POSTED or DISPUTED (RECONCILED is terminal)" }
  - { id: ERR_MEETING_ALREADY_RECONCILED, http: 409, condition: "Void blocked once the meeting is RECONCILED" }
  - { id: ERR_TXN_NOT_POSTED, http: 409, condition: "Void requires transaction POSTED" }
  - { id: ERR_ACCOUNT_NOT_OPEN, http: 409, condition: "Withdrawal/close requires savings account OPEN" }
  - { id: ERR_ACCOUNT_NOT_FROZEN, http: 409, condition: "Unfreeze requires savings account FROZEN" }
  - { id: ERR_ACCOUNT_NOT_EMPTY, http: 409, condition: "Savings close requires balance_cents == 0" }
  - { id: ERR_ALREADY_VOTED, http: 409, condition: "This voter has already cast a ConsensusVote on this application" }
  - { id: ERR_PLAN_NOT_SUBMITTED, http: 409, condition: "Decide requires plan SUBMITTED" }
  - { id: ERR_TRAINING_NOT_SCHEDULED, http: 409, condition: "Complete/cancel requires session SCHEDULED" }
  - { id: ERR_LOAN_NOT_REPAYABLE, http: 409, condition: "Collection target loan not in ACTIVE or DELINQUENT" }

  # --- Safety / compliance ---
  - { id: ERR_MEMBER_BLACKLISTED, http: 403, condition: "Member.status == BLACKLISTED (or a FINAL bureau report with score_reported < 300 exists); checked before group-membership referential checks" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reconcile actor X-User-ID equals the meeting's closer_user_id" }

  # --- Referential ---
  - { id: ERR_MEMBER_ALREADY_IN_GROUP, http: 422, condition: "Member already has a peer_group_id" }
  - { id: ERR_VOTER_NOT_GROUP_PEER, http: 422, condition: "Voter is not a member of the applicant's group" }
  - { id: ERR_VOTER_IS_APPLICANT, http: 422, condition: "Applicant may not vote on their own application" }
  - { id: ERR_LOAN_MEMBER_MISMATCH, http: 422, condition: "Collection loan_id does not belong to member_id" }
  - { id: ERR_MEMBER_NOT_AT_CENTER, http: 422, condition: "Attendance/collection member's group is not at this meeting's center" }
  - { id: ERR_MANAGER_CENTER_MISMATCH, http: 422, condition: "Training session center_manager_id differs from the group center's manager" }

  # --- Temporal ---
  - { id: ERR_MEETING_OVERLAP, http: 409, condition: "Half-open [start,end) collision with another non-CANCELLED meeting of the same center (adjacency allowed)" }
  - { id: ERR_TRAINING_SLOT_OVERLAP, http: 409, condition: "Closed-interval collision incl. 30-minute buffer with another SCHEDULED/COMPLETED session of the same manager (adjacency within buffer rejected)" }
  - { id: ERR_VOTING_WINDOW_EXPIRED, http: 409, condition: "Vote cast at logical time >= application.voting_deadline" }
  - { id: ERR_MEETING_DAY_MISMATCH, http: 422, condition: "scheduled_start UTC weekday != center.meeting_day_of_week" }

  # --- Constraint / aggregate ---
  - { id: ERR_GROUP_NOT_FORMING, http: 409, condition: "Membership add or first training requires group FORMING (adds also allowed in TRAINING)" }
  - { id: ERR_GROUP_SIZE_INVALID, http: 409, condition: "First training session requires member_count == 5 exactly" }
  - { id: ERR_GROUP_FULL, http: 409, condition: "Group already has 5 members" }
  - { id: ERR_GROUP_NOT_ACTIVE, http: 409, condition: "Submit/dissolve-side rule: application submit requires group ACTIVE" }
  - { id: ERR_GROUP_RESTRICTED, http: 409, condition: "Disburse blocked: applicant's group is RESTRICTED (joint liability)" }
  - { id: ERR_GROUP_HAS_ACTIVE_LOANS, http: 409, condition: "Dissolve blocked: a member's loan is ACTIVE or DELINQUENT" }
  - { id: ERR_MEMBER_NOT_RECRUITED, http: 409, condition: "Group add requires member RECRUITED" }
  - { id: ERR_MEMBER_NOT_ELIGIBLE, http: 409, condition: "Submit/disburse requires member ELIGIBLE or ACTIVE_BORROWER" }
  - { id: ERR_MEMBER_HAS_OPEN_APPLICATION, http: 409, condition: "Member already has an application in DRAFT, VOTING, or APPROVED" }
  - { id: ERR_MEMBER_HAS_ACTIVE_LOAN, http: 409, condition: "Member has a loan in ACTIVE or DELINQUENT (submit/close blocked)" }
  - { id: ERR_ATTENDANCE_INELIGIBLE, http: 409, condition: "Submit blocked: consecutive_absence_streak >= 2 (exactly 2 blocks)" }
  - { id: ERR_NOT_CENTER_MANAGER, http: 409, condition: "Acting CenterManager is not the manager of the meeting's center" }
  - { id: ERR_CASELOAD_CAP_EXCEEDED, http: 409, condition: "Center create/reassign would exceed the target manager's center_cap or member_cap for the current branch tier" }
  - { id: ERR_EXPANSION_INFEASIBLE, http: 409, condition: "Expansion plan fails the pinned feasibility evaluation" }

  # --- Fiscal (checked last) ---
  - { id: ERR_LADDER_CEILING_EXCEEDED, http: 422, condition: "requested_amount_cents > next_loan_ceiling(applicant) at disbursement" }
  - { id: ERR_COLLECTION_BELOW_SAVINGS_MINIMUM, http: 422, condition: "amount_cents < loan.savings_required_cents + 1" }
  - { id: ERR_COLLECTION_EXCEEDS_OUTSTANDING, http: 422, condition: "amount_cents > loan.savings_required_cents + loan.principal_outstanding_cents (collections never overpay)" }
  - { id: ERR_WITHDRAWAL_EXCEEDS_AVAILABLE, http: 422, condition: "amount_cents > account.withdrawable_cents" }
  - { id: ERR_RECONCILIATION_MISMATCH, http: 409, condition: "declared_cash_cents != sum of POSTED transaction amounts; meeting -> DISPUTED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Platform administrator: branches, managers, centers, expansion decisions, logical clock, savings unfreeze"
    identity: opaque
    exclusive_operations:
      - "POST /branches"
      - "POST /center-managers"
      - "POST /centers"
      - "PATCH /centers/{id}"
      - "POST /expansion-plans/{id}/decide"
      - "POST /_clock/set_current_utc"
      - "POST /members/{id}/savings/unfreeze"
    shared_operations:
      - "All GET endpoints"

  - name: BranchManager
    description: "Branch operations manager: disburses approved loans, reconciles meetings, voids transactions, restructures loans, submits expansion plans. Deliberately disjoint from CenterManager (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /loan-applications/{id}/disburse"
      - "POST /center-meetings/{id}/reconcile"
      - "POST /repayment-transactions/{id}/void"
      - "POST /loans/{id}/restructures"
      - "POST /branches/{id}/expansion-plans"
    shared_operations:
      - "All GET endpoints"

  - name: CenterManager
    description: "Center manager (entity-backed): schedules and completes training, schedules/opens/closes/cancels meetings, records attendance, collects repayments. May NOT reconcile, disburse, or void."
    identity: "entity_backed:CenterManager"
    exclusive_operations:
      - "POST /group-training-sessions"
      - "POST /group-training-sessions/{id}/complete"
      - "POST /group-training-sessions/{id}/cancel"
      - "POST /center-meetings"
      - "POST /center-meetings/{id}/open"
      - "POST /center-meetings/{id}/cancel"
      - "POST /center-meetings/{id}/attendance"
      - "POST /center-meetings/{id}/collections"
      - "POST /center-meetings/{id}/close"
    shared_operations:
      - "All GET endpoints"

  - name: FieldOfficer
    description: "Recruitment and group formation officer: recruits members, forms groups, manages membership, drafts/submits applications, dissolves groups. May NOT collect money or disburse."
    identity: opaque
    exclusive_operations:
      - "POST /members"
      - "POST /peer-groups"
      - "POST /peer-groups/{id}/members"
      - "POST /peer-groups/{id}/dissolve"
      - "POST /peer-groups/{id}/loan-applications"
      - "POST /loan-applications/{id}/submit"
    shared_operations:
      - "All GET endpoints"

  - name: Member
    description: "Borrower (entity-backed): casts consensus votes as a peer and manages own savings. X-User-ID must equal the Member id; vote voter_member_id := X-User-ID."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /loan-applications/{id}/votes"
      - "POST /members/{id}/savings/withdrawals"
      - "POST /members/{id}/savings/close"
    shared_operations:
      - "All GET endpoints"
