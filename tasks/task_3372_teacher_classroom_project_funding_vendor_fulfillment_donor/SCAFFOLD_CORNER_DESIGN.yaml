            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
            - *k_vet
            - *k_donor
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 10959 }
              as: Donor
              as_user_id: "${d1}"
            - call: "GET /giving/purchase-orders"
              payload: { project_id: "${p1}" }
              as: PlatformAdmin
              captures: { po1: "$.data[0].id" }
            - call: "POST /giving/purchase-orders/${po1}/advance"
              payload: { action: "SHIP", tracking_number: "1Z999AA10123456784" }
