- section: cross_cutting_layers
  instances:
  - name: client_data_rights_recomputed_on_tier_change
    claim_type: derived_field_reconciliation
    grounds:
    - calculations.data_license_consent_required
    - entities.PortfolioAccount.fields.client_data_rights
    distinguishing_aspect: Moving an account from BASIC to ENTERPRISE rewrites client_data_rights from BROKER_OWNED to CLIENT_OWNED_EXCLUSIVE on the account update response.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE BASIC
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Rights Drift Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: BASIC
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      trigger:
      - call: PUT /api/accounts/${acc}
        payload:
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          r1: $.data.client_data_rights
          v1: $.data.version
      assert:
      - ${r1} == CLIENT_OWNED_EXCLUSIVE
      - ${v1} == 2
  - name: annual_fee_recomputed_on_portfolio_sqft_change
    claim_type: derived_field_reconciliation
    grounds:
    - calculations.commission_credit_nets_fee
    - entities.PortfolioAccount.fields.annual_net_fee_cents
    distinguishing_aspect: Growing portfolio_sqft from 200000 to 400000 moves annual_net_fee_cents from 29000000.00 to 47200000.00 on the update response.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE BASIC portfolio_sqft 200000, no commission records
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Fee Drift Co
          client_name: GlobalTech Industries
          portfolio_sqft: 200000
          platform_tier: BASIC
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      trigger:
      - call: PUT /api/accounts/${acc}
        payload:
          portfolio_sqft: 400000
        as: AccountExecutive
        captures:
          f1: $.data.annual_net_fee_cents
      assert:
      - ${f1} == 47200000.00
  - name: lease_expiration_bucket_recomputed_on_clock_advance
    claim_type: derived_field_reconciliation
    grounds:
    - entities.Lease.fields.expiration_bucket
    - calculations.account_lifecycle_gate
    - endpoints.POST /api/_clock/set_current_utc
    distinguishing_aspect: A lease ending 2028-01-01 reads expiration_bucket LONG_TERM after the account clock is set to 2027-01-01 because the bucket is recomputed on every clock advance.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      - Lease L1 ending 2028-01-01T00:00:00Z
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Bucket Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2028-01-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      trigger:
      - call: GET /api/leases/${L1}
        as: TransactionManager
        captures:
          b0: $.data.expiration_bucket
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2027-01-01T00:00:00Z'
        as: AccountExecutive
      - call: GET /api/leases/${L1}
        as: TransactionManager
        captures:
          b1: $.data.expiration_bucket
      assert:
      - ${b0} == LONG_TERM
      - ${b1} == LONG_TERM
  - name: stale_account_version_on_audit_review_conflict
    claim_type: occ_stale_version
    grounds:
    - concurrency_rules[kpi-recompute-stale-account]
    - errors[ERR_STALE_VERSION]
    - validations[priority=31]
    distinguishing_aspect: An audit-review write carrying the account version observed before a scorecard publication is rejected with 412.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      - Scorecard SC1 DRAFT
      - DisciplineAudit A1 SCHEDULED
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Occ Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/scorecards
        payload:
          account_id: ${acc}
          service_line: JANITORIAL
          quality_bps: 9800
          response_bps: 9300
        as: GovernanceManager
        captures:
          SC1: $.data.id
      - call: POST /api/discipline-audits
        payload:
