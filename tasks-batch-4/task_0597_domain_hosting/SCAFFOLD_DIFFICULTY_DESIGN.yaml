  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pay_then_full_card_refund_restores_net_cash_to_zero
        grounds:
          - calculations.account_cash_conservation
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Invoice.PAID_to_REFUNDED
          - entities.Account.fields.net_cash_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity #1 is MONEY: net_cash_cents = SUM(LedgerEntry.amount_cents WHERE
          entry_type IN {PAYMENT, REFUND}). Paying a 1296-cent invoice in cash and then fully
          refunding it to destination CARD must return net_cash_cents to exactly 0 — the two
          ledger rows (+1296, -1296) cancel with zero drift.
        test_recipe:
          setup:
            - "Account with a card and zero store credit; net_cash_cents starts at 0."
            - "A .xyz registration invoice with WHOIS privacy: subtotal 1198, tax 98, total 1296."
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "cash@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "budgetsite", tld: "xyz", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", whois_privacy: true, auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/invoices/${inv_id}/refund"
              payload: { amount_cents: 1296, destination: "CARD", reason: "customer cancelled" }
              as: BillingAdmin
            - call: "GET /registrar/accounts/${acct_id}/ledger-entries"
              payload: {}
              as: BillingAdmin
          assert:
            - "after the pay: Account.${acct_id}.net_cash_cents == 1296 and a LedgerEntry(PAYMENT, +1296) exists"
            - "after the refund: Account.${acct_id}.net_cash_cents == 0 (the conserved quantity is restored exactly)"
            - "after the refund: a LedgerEntry(REFUND, -1296) exists; the ledger holds exactly 2 entries"
            - "Account.${acct_id}.credit_balance_cents == 0 (a CARD refund creates no credit)"
            - "Invoice.${inv_id}.status == 'REFUNDED' and amount_paid_cents == 1296 and amount_refunded_cents == 1296"
            - "Domain.${dom_id}.lifecycle_status == 'ACTIVE' (a refund moves money only; it never reverts the activation)"

