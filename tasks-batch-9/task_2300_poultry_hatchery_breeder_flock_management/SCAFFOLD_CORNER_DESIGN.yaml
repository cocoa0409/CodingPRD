      - name: flock_cannot_deplete_while_lot_allocated
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BreederFlock.IN_LAY_to_DEPLETED
          - validations.priority_11.ERR_FLOCK_INVALID_STATE
          - state_machines.EggLot.ALLOCATED_to_IN_STORAGE
        distinguishing_aspect: "Depletion is blocked by the state of a child aggregate, not by the flock itself: with one lot ALLOCATED to a PLANNED load the call is 409, and aborting that load (which returns the lot to IN_STORAGE) is what makes the same call succeed."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 IN_LAY; lot L1 (6200 settable) is stored and 6000 eggs are drawn into PLANNED load S1."
