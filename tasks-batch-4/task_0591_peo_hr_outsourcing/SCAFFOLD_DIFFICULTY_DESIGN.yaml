          SUBMITTED -> RETURNED -> SUBMITTED -> APPROVED. Each RETURN burns a revision round
          (revision_rounds reaches 2) and the packet re-enters the same review state it just left;
          only the terminal APPROVE bubbles the employee PENDING_ONBOARDING -> ACTIVE.
