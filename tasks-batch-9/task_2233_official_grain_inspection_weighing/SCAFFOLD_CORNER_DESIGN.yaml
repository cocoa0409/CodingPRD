              captures: { i0: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1449", full_name: "R. Regrader", endorsements: ["GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
