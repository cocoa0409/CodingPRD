  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: items_list_pagination
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /items honors limit/offset and reports total_count/has_more per the fixed envelope."
        test_recipe:
          setup: ["TRANSIT program, LOW policy, location, three items"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "item 1", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "item 2", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "item 3", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
          trigger:
            - call: "GET /items?limit=2&offset=0"
              as: IntakeOfficer
            - call: "GET /items?limit=2&offset=2"
              as: IntakeOfficer
          assert:
            - "first page: 2 entries, total_count == 3, has_more == true"
            - "second page: 1 entry, total_count == 3, has_more == false"
      - name: public_search_excludes_non_listed_and_identification
        claim_type: computed_read
        grounds: [endpoints, entities.Item.fields.is_identification]
        distinguishing_aspect: "GET /public/items returns only LISTED, non-identification items: a STORED item and an ID_DOCUMENT item are both absent; category filter composes."
        test_recipe:
          setup: ["TRANSIT program with LOW ELECTRONICS and LOW ID_DOCUMENT policies; item E (ELECTRONICS, LISTED) and item D (ID_DOCUMENT, STORED)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ID_DOCUMENT", value_tier: "LOW", retention_days: 30, disposal_method: "DESTRUCTION", expected_program_version: "${pt_v} + 1" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { ie: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ID_DOCUMENT", declared_value_cents: 100, description: "driver license", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { idoc: $.data.id }
            - call: "POST /items/${ie}/publish"
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
          trigger:
            - call: "GET /public/items"
              as: PublicUser
            - call: "GET /public/items?category=ID_DOCUMENT"
              as: PublicUser
          assert:
            - "unfiltered public list contains Item.${ie} and does NOT contain Item.${idoc} (STORED and is_identification items excluded)"
            - "category=ID_DOCUMENT filter returns an empty list"
            - "public entries expose only id, category, description, found_at, found_location, program_id (no storage_location_id, no declared_value_cents)"
      - name: retention_policy_supersede_action
        claim_type: action_endpoint
        grounds: [endpoints, entities.RetentionPolicy.fields.active]
        distinguishing_aspect: "Creating a policy with an existing (program, category, tier) key deactivates the old one; subsequent intake uses the new retention_days."
        test_recipe:
          setup: ["TRANSIT program; LOW policy retention_days 10, then superseded by retention_days 20"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
              captures: { pol_old: $.data.id }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 20, disposal_method: "AUCTION", expected_program_version: "${pt_v} + 1" }
              as: ProgramAdmin
              captures: { pol_new: $.data.id }
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
          trigger:
            - call: "GET /retention-policies?program_id=${pt}"
              as: ProgramAdmin
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
          assert:
            - "RetentionPolicy.${pol_old}.active == false and RetentionPolicy.${pol_new}.active == true"
            - "Item.${it}.retention_policy_id == ${pol_new}"
            - "Item.${it}.retention_deadline == \"2026-08-21T09:00:00Z\" (20-day TRANSIT policy applied)"
      - name: release_record_reverse_lookup
        claim_type: cross_reference_link
        grounds: [endpoints, entities.ReleaseRecord]
        distinguishing_aspect: "Release creates an append-only ReleaseRecord discoverable via GET /release-records?item_id; claim and item both reach terminal states."
        test_recipe:
          setup: ["item with an APPROVED claim (LOW, proofs serial+photo, examiner-1)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5000, description: "earbuds", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id, it_v: $.data.version }
            - call: "POST /claimants"
              payload: { full_name: "Pat Owner", email: "pat@x.com" }
              as: PublicUser
              captures: { c1: $.data.id }
            - call: "POST /claims"
              payload: { item_id: "${it}", claimant_id: "${c1}", proof_serial: true, proof_photo: true, proof_receipt: false, proof_description_detail: "BRIEF", expected_item_version: "${it_v}" }
              as: Claimant
              as_user_id: "${c1}"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/start-review"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
            - call: "POST /claims/${cl}/approve"
              as: ClaimsExaminer
              as_user_id: "examiner-1"
          trigger:
            - call: "POST /items/${it}/release"
              payload: { handover_method: "IN_PERSON", id_document_ref: "DL-999" }
              as: ReleaseOfficer
              as_user_id: "officer-release-1"
            - call: "GET /release-records?item_id=${it}"
              as: ReleaseOfficer
              captures: { rr_claim: "$.data[0].claim_id", rr_by: "$.data[0].released_by" }
          assert:
            - "Item.${it}.status == \"RELEASED\" and Claim.${cl}.status == \"RELEASED\""
            - "rr_claim == ${cl} and rr_by == \"officer-release-1\""
            - "exactly one ReleaseRecord exists for the item; ReleaseRecord carries handover_method IN_PERSON and id_document_ref DL-999"
      - name: lot_items_subresource_lists_floor
        claim_type: computed_read
        grounds: [endpoints, entities.LotItem.fields.floor_price_cents]
        distinguishing_aspect: "GET /auction-lots/{lot}/items returns LotItem[] with the computed per-item floor price (sub-resource FK reverse reachability)."
        test_recipe:
          setup: ["DRAFT lot containing one LOW 5005-cent item"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "ELECTRONICS", declared_value_cents: 5005, description: "charger", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { it: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /_sweeps/retention"
              as: ProgramAdmin
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Depot Hall", address: "1 Depot St", insurance_cap_cents: 100000000 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "Aug Sale", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { ev: $.data.id }
            - call: "POST /auction-lots"
              payload: { event_id: "${ev}", title: "Lot X" }
