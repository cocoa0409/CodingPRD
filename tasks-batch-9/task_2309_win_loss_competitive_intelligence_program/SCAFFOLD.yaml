# =============================================================================
# task_2309 — Win-Loss & Competitive Intelligence Program
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design
# (§1.9) live in the sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# SCAFFOLD_CORNER_DESIGN.yaml respectively.
# =============================================================================

scenario: |
  2309. Win-Loss & Competitive Intelligence Program (business-to-business revenue intelligence team): deal outcome sampling with criteria for interview selection across won, lost and no-decision, buyer interview scheduling with incentive handling and independence from the sales team, structured interview guide covering evaluation criteria, competitor positioning and pricing perception, synthesis into competitor battlecards with claim substantiation and legal review, loss reason taxonomy and trend analysis by segment, product gap feedback routed to roadmap prioritization, sales enablement distribution with training and adoption measurement, competitive claim monitoring and response protocols

domain_name: win-loss-intelligence

# Resources are flat, root-level collections joined by foreign keys (see §1.5 for
# the absolute path of every endpoint). The program record is the scoping root
# but is NOT a URL prefix.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - rate_threshold_triggers

  entity_topology: graph
  # graph: LossReason is self-referential (taxonomy tree), BattlecardClaim links
  # to an evidence set of InterviewResponse ids, ProductGap derives its
  # competitor by traversing InterviewResponse -> Interview -> Deal, and Deal
  # participates in both the sampling aggregate and the attribution aggregate.

  state_machine_shape: parallel
  secondary_state_machine_shapes: [cyclic, branching, compound, posture_driven]
  # parallel:  Deal.research_status x Deal.attribution_status evolve independently
  # cyclic:    Battlecard PUBLISHED->DRAFT->LEGAL_REVIEW->...; Interview NO_SHOW->SCHEDULED
  # branching: BattlecardClaim legal decision forks {APPROVED, CONDITIONAL, REJECTED}
  #            with divergent side-effect sets; ProductGap triage forks 3 ways
  # compound:  Battlecard auto-transitions from aggregate claim legal states
  # posture_driven: Program.posture (OPEN/RESTRICTED/FROZEN) gates child writes

  relationship_patterns:
    - one_to_many
    - self_referential      # LossReason.parent_reason_id -> LossReason.id
    - cross_aggregate       # BattlecardClaim evidence -> InterviewResponse (other aggregate)
    - many_to_many          # evidence_response_ids array on BattlecardClaim

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities / 9 state-machine dimensions / 8 calculations / 38 ordered validations
  # / 78 endpoints / 59 error codes / 6 roles / 2 OCC rules

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label of the win-loss program." }
      - { name: fiscal_quarter, type: string, source: input, description: "Fiscal quarter label the program covers.", constraints: "Non-empty string; format not validated." }
      - { name: status, type: enum, source: system, description: "Program lifecycle state.", default: DRAFT, constraints: "One of DRAFT, ACTIVE, CLOSING, CLOSED." }
      - { name: posture, type: enum, source: computed, description: "Derived gate over all child writes; recomputed by calculations.program_incentive_posture on every ledger or status change.", default: OPEN, constraints: "One of OPEN, RESTRICTED, FROZEN." }
      - { name: incentive_budget_usd, type: number, source: input, description: "Total buyer-incentive budget for the program.", constraints: "> 0 at activation; 2 decimal places." }
      - { name: incentive_committed_usd, type: number, source: computed, description: "Sum of Interview.incentive_provisional_usd over interviews whose incentive_status == COMMITTED.", default: 0 }
      - { name: incentive_paid_usd, type: number, source: computed, description: "Sum of Interview.incentive_final_usd over interviews whose incentive_status == PAID.", default: 0 }
      - { name: interview_incentive_cap_usd, type: number, source: input, description: "Per-interview incentive ceiling applied inside calculations.interview_incentive_amount.", constraints: ">= 0." }
      - { name: min_deal_value_usd, type: number, source: input, description: "Sampling eligibility floor on Deal.acr_usd (inclusive >=).", constraints: ">= 0." }
      - { name: required_question_keys, type: array, source: input, description: "Interview-guide topic coverage the guide must ask; array of InterviewResponse.question_key enum members.", default: [EVALUATION_CRITERIA, COMPETITOR_POSITIONING, PRICING_PERCEPTION], constraints: "Must contain at least EVALUATION_CRITERIA, COMPETITOR_POSITIONING and PRICING_PERCEPTION for activation." }
      - { name: guide_version, type: integer, source: system, description: "Interview-guide revision counter; incremented by PUT /programs/{program_id}/interview-guide.", default: 1 }
      - { name: max_open_interviews_per_analyst, type: integer, source: input, description: "Cap on Analyst.open_interview_count enforced at scheduling.", default: 3, constraints: ">= 1." }
      - { name: independence_mode, type: enum, source: input, description: "STRICT enforces analyst independence from the deal's sales owner; ADVISORY records but permits.", default: STRICT, constraints: "One of STRICT, ADVISORY." }

  - name: Competitor
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program." }
      - { name: name, type: string, source: input, description: "Competitor display name.", constraints: "Unique per program, case-insensitive." }
      - { name: tier, type: enum, source: input, description: "Competitive importance tier; feeds selection ranking and product-gap pressure.", constraints: "One of PRIMARY, SECONDARY, EMERGING." }
      - { name: status, type: enum, source: system, description: "Soft-delete flag.", default: ACTIVE, constraints: "One of ACTIVE, ARCHIVED." }
      - { name: published_battlecard_count, type: integer, source: computed, description: "Count of Battlecard rows with competitor_id == this.id AND status == PUBLISHED.", default: 0 }
      - { name: ratified_loss_count, type: integer, source: computed, description: "Count of Deal rows with primary_competitor_id == this.id, outcome IN {LOST, NO_DECISION} and attribution_status == RATIFIED.", default: 0 }
      - { name: win_rate_vs, type: number, source: computed, description: "Cross-entity derived: count(Deal where primary_competitor_id == this.id AND outcome == WON) / count(Deal where primary_competitor_id == this.id AND outcome IN {WON, LOST, NO_DECISION}); null when the denominator is 0.", default: null, constraints: "4 decimal places, round_half_up." }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program." }
      - { name: crm_deal_ref, type: string, source: input, description: "External CRM opportunity reference.", constraints: "Unique per program, case-sensitive." }
      - { name: outcome, type: enum, source: input, description: "Deal outcome; also the sampling stratum key.", constraints: "One of WON, LOST, NO_DECISION." }
      - { name: acr_usd, type: number, source: input, description: "Annual contract revenue of the deal.", constraints: ">= 0; 2 decimal places." }
      - { name: close_date, type: datetime, source: input, description: "Instant the deal closed; matched against SamplingFrame windows.", constraints: "ISO 8601 UTC, three fractional digits." }
      - { name: segment, type: enum, source: input, description: "Customer segment used for stratification and trend grouping.", constraints: "One of ENTERPRISE, MIDMARKET, SMB." }
      - { name: sales_rep_user_ref, type: string, source: input, description: "Opaque X-User-ID of the SalesRep who owned the deal. NOT a foreign key; compared against Analyst.linked_user_ref for the independence check." }
      - { name: primary_competitor_id, type: string, source: input, description: "FK -> Competitor.id; primary competitor on the deal. Nullable.", default: null }
      - { name: sampling_frame_id, type: string, source: system, description: "FK -> SamplingFrame.id; frame that drew this deal. Nullable until selection.", default: null }
      - { name: stratum, type: enum, source: computed, description: "Stratum the deal was drawn into; copied from outcome at draw time.", default: null, constraints: "One of WON, LOST, NO_DECISION or null." }
      - { name: selection_rank_score, type: number, source: computed, description: "Value produced by calculations.sample_selection_rank_score at draw time; null before selection.", default: null, constraints: "4 decimal places, round_half_up." }
      - { name: research_status, type: enum, source: system, description: "Research dimension of the parallel state machine.", default: NOT_SELECTED, constraints: "One of NOT_SELECTED, SELECTED, DECLINED, INTERVIEWED, SYNTHESIZED." }
      - { name: attribution_status, type: enum, source: system, description: "Attribution dimension of the parallel state machine; evolves independently of research_status.", default: UNATTRIBUTED, constraints: "One of UNATTRIBUTED, PROVISIONAL, RATIFIED." }
      - { name: interview_coverage_count, type: integer, source: computed, description: "Count of Interview rows with deal_id == this.id AND status == COMPLETED.", default: 0 }

  - name: Analyst
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program." }
      - { name: full_name, type: string, source: input, description: "Analyst display name." }
      - { name: linked_user_ref, type: string, source: input, description: "Opaque personnel reference of the human behind this analyst record; compared against Deal.sales_rep_user_ref by the independence check. NOT a foreign key." }
      - { name: employment_type, type: enum, source: input, description: "INTERNAL research staff or EXTERNAL_VENDOR interviewer; EXTERNAL_VENDOR earns the incentive uplift.", constraints: "One of INTERNAL, EXTERNAL_VENDOR." }
      - { name: sales_org_member, type: boolean, source: input, description: "True when the analyst reports into the sales organisation; blocks interviewing under STRICT independence.", default: false }
      - { name: certified_until, type: datetime, source: input, description: "Interview-certification expiry; scheduling requires logical clock < certified_until.", constraints: "ISO 8601 UTC, three fractional digits." }
      - { name: status, type: enum, source: system, description: "Analyst availability.", default: ACTIVE, constraints: "One of ACTIVE, INACTIVE." }
      - { name: open_interview_count, type: integer, source: computed, description: "Count of Interview rows with analyst_id == this.id AND status == SCHEDULED.", default: 0 }
      - { name: committed_minutes, type: integer, source: computed, description: "Sum over Interview rows with analyst_id == this.id AND status == SCHEDULED of (scheduled_end_at - scheduled_start_at in whole minutes) + DEBRIEF_BUFFER_MINUTES.", default: 0 }

  - name: BuyerContact
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; deal this buyer participated in." }
      - { name: email, type: string, source: input, description: "Buyer email, stored lower-cased; the person key for the cooling-off window across deals in the same program.", constraints: "Unique per (deal_id, lower(email)); non-empty." }
      - { name: full_name, type: string, source: input, description: "Buyer display name." }
      - { name: title_band, type: enum, source: input, description: "Seniority band driving the incentive base amount.", constraints: "One of ECONOMIC_BUYER, CHAMPION, PROCUREMENT, END_USER." }
      - { name: consent_status, type: enum, source: system, description: "Interview consent lifecycle.", default: NOT_REQUESTED, constraints: "One of NOT_REQUESTED, REQUESTED, GRANTED, REFUSED." }
      - { name: incentive_eligibility, type: enum, source: input, description: "Whether this buyer may receive an incentive at all; non-ELIGIBLE forces a 0.00 incentive.", default: ELIGIBLE, constraints: "One of ELIGIBLE, INELIGIBLE_PUBLIC_SECTOR, INELIGIBLE_POLICY." }
      - { name: completed_interview_count, type: integer, source: computed, description: "Count of Interview rows with buyer_contact_id == this.id AND status == COMPLETED.", default: 0 }
      - { name: last_completed_interview_end_at, type: datetime, source: computed, description: "Maximum Interview.actual_end_at over interviews with buyer_contact_id == this.id AND status == COMPLETED; null when none.", default: null }

  - name: SamplingFrame
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program." }
      - { name: label, type: string, source: input, description: "Frame label, e.g. the sampling wave name." }
      - { name: window_start, type: datetime, source: input, description: "Inclusive lower bound of the close-date window.", constraints: "ISO 8601 UTC, three fractional digits." }
      - { name: window_end, type: datetime, source: input, description: "Exclusive upper bound of the close-date window; window is half-open [window_start, window_end).", constraints: "Must be strictly after window_start." }
      - { name: quota_won, type: integer, source: input, description: "Interview quota for the WON stratum.", constraints: ">= 0." }
      - { name: quota_lost, type: integer, source: input, description: "Interview quota for the LOST stratum.", constraints: ">= 0." }
      - { name: quota_no_decision, type: integer, source: input, description: "Interview quota for the NO_DECISION stratum.", constraints: ">= 0." }
      - { name: selection_basis, type: enum, source: input, description: "Selects the ranking variant inside calculations.sample_selection_rank_score.", constraints: "One of STRATIFIED_BY_SEGMENT, VALUE_WEIGHTED." }
      - { name: status, type: enum, source: system, description: "Frame lifecycle.", default: DRAFT, constraints: "One of DRAFT, SEALED, SUSPENDED, CLOSED." }
      - { name: selected_won_count, type: integer, source: computed, description: "Count of Deal rows with sampling_frame_id == this.id AND stratum == WON AND research_status IN {SELECTED, INTERVIEWED, SYNTHESIZED}.", default: 0 }
      - { name: selected_lost_count, type: integer, source: computed, description: "Count of Deal rows with sampling_frame_id == this.id AND stratum == LOST AND research_status IN {SELECTED, INTERVIEWED, SYNTHESIZED}.", default: 0 }
      - { name: selected_no_decision_count, type: integer, source: computed, description: "Count of Deal rows with sampling_frame_id == this.id AND stratum == NO_DECISION AND research_status IN {SELECTED, INTERVIEWED, SYNTHESIZED}.", default: 0 }
      - { name: open_won_slots, type: integer, source: computed, description: "quota_won - selected_won_count; conserved-quantity counterpart of selected_won_count.", default: 0 }
      - { name: open_lost_slots, type: integer, source: computed, description: "quota_lost - selected_lost_count.", default: 0 }
      - { name: open_no_decision_slots, type: integer, source: computed, description: "quota_no_decision - selected_no_decision_count.", default: 0 }
      - { name: coverage_ratio, type: number, source: computed, description: "(selected_won_count + selected_lost_count + selected_no_decision_count) / (quota_won + quota_lost + quota_no_decision); 0.0000 when total quota is 0.", default: 0, constraints: "4 decimal places, round_half_up." }

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; deal under study." }
      - { name: buyer_contact_id, type: string, source: input, description: "FK -> BuyerContact.id; interviewee." }
      - { name: analyst_id, type: string, source: input, description: "FK -> Analyst.id; independent interviewer." }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Planned start instant.", constraints: "ISO 8601 UTC, three fractional digits." }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Planned end instant; occupation interval is half-open [scheduled_start_at, scheduled_end_at).", constraints: "Must be strictly after scheduled_start_at." }
      - { name: actual_start_at, type: datetime, source: system, description: "Recorded start instant, supplied at completion.", default: null }
      - { name: actual_end_at, type: datetime, source: system, description: "Recorded end instant, supplied at completion.", default: null }
      - { name: status, type: enum, source: system, description: "Interview lifecycle; NO_SHOW can cycle back to SCHEDULED.", default: SCHEDULED, constraints: "One of SCHEDULED, COMPLETED, NO_SHOW, CANCELLED." }
      - { name: incentive_status, type: enum, source: system, description: "Incentive ledger dimension of this interview.", default: COMMITTED, constraints: "One of COMMITTED, PAID, RELEASED, FORFEITED." }
      - { name: incentive_provisional_usd, type: number, source: computed, description: "PROVISIONAL variant output of calculations.interview_incentive_amount, computed from the scheduled duration.", constraints: "2 decimal places, round_half_up." }
      - { name: incentive_final_usd, type: number, source: computed, description: "FINAL variant output of calculations.interview_incentive_amount, computed from the actual duration; null until completion.", default: null, constraints: "2 decimal places, round_half_up." }
      - { name: guide_version_pinned, type: integer, source: system, description: "Program.guide_version copied at scheduling; never re-read afterwards." }
      - { name: required_question_keys_pinned, type: array, source: system, description: "Program.required_question_keys copied at scheduling; the completion coverage gate uses this pinned array, not the program's current value." }
      - { name: coverage_complete, type: boolean, source: computed, description: "True when the set of distinct InterviewResponse.question_key values recorded on this interview is a superset of required_question_keys_pinned.", default: false }
      - { name: reschedule_count, type: integer, source: system, description: "Number of NO_SHOW -> SCHEDULED cycles performed.", default: 0 }

  - name: InterviewResponse
    parent: Interview
    common_fields: false
    fields:
      - { name: interview_id, type: string, source: input, description: "FK -> Interview.id; interview this answer belongs to." }
      - { name: question_key, type: enum, source: input, description: "Guide topic this answer covers.", constraints: "One of EVALUATION_CRITERIA, COMPETITOR_POSITIONING, PRICING_PERCEPTION, LOSS_REASON, PRODUCT_GAP." }
      - { name: verbatim_text, type: string, source: input, description: "Buyer verbatim; the substantiation evidence text.", constraints: "Non-empty." }
      - { name: rating, type: integer, source: input, description: "Buyer rating for the topic; drives evidence strength.", default: null, constraints: "Integer 1..5 inclusive, or null." }
      - { name: competitor_name_verbatim, type: string, source: input, description: "Competitor name as the buyer said it; free text, deliberately NOT a foreign key.", default: null }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock instant at which the answer was recorded; drives evidence recency weighting." }

  - name: LossReason
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program." }
      - { name: parent_reason_id, type: string, source: input, description: "FK -> LossReason.id; parent taxonomy node, null for a root node.", default: null }
      - { name: code, type: string, source: input, description: "Stable taxonomy code.", constraints: "Unique per program, case-insensitive." }
      - { name: label, type: string, source: input, description: "Human label of the reason." }
      - { name: depth, type: integer, source: computed, description: "1 for a root node, otherwise parent.depth + 1.", constraints: "<= 3." }
      - { name: is_leaf, type: boolean, source: computed, description: "True when no LossReason row has parent_reason_id == this.id.", default: true }
      - { name: status, type: enum, source: system, description: "Taxonomy node availability.", default: ACTIVE, constraints: "One of ACTIVE, DEPRECATED." }
      - { name: ratified_attribution_count, type: integer, source: computed, description: "Count of LossAttribution rows with status == RATIFIED whose primary_reason_id == this.id, plus those whose secondary_reason_id == this.id.", default: 0 }

  - name: LossAttribution
    parent: Deal
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; deal being attributed." }
      - { name: primary_reason_id, type: string, source: input, description: "FK -> LossReason.id; dominant reason, must be an ACTIVE leaf in the deal's program." }
      - { name: secondary_reason_id, type: string, source: input, description: "FK -> LossReason.id; contributing reason, must be an ACTIVE leaf distinct from primary_reason_id. Nullable.", default: null }
      - { name: authored_by_analyst_id, type: string, source: system, description: "FK -> Analyst.id; analyst whose X-User-ID created the attribution." }
      - { name: ratified_by_analyst_id, type: string, source: system, description: "FK -> Analyst.id; analyst who ratified it. Null until ratification.", default: null }
      - { name: weight_primary, type: number, source: input, description: "Share of the outcome attributed to primary_reason_id.", constraints: "0.50 <= weight_primary <= 1.00, 2 decimal places; must equal 1.00 when secondary_reason_id is null." }
      - { name: weight_secondary, type: number, source: computed, description: "round_half_up(1 - weight_primary, 2); 0.00 when secondary_reason_id is null.", constraints: "2 decimal places." }
      - { name: status, type: enum, source: system, description: "Attribution lifecycle.", default: PROVISIONAL, constraints: "One of PROVISIONAL, RATIFIED, SUPERSEDED." }
      - { name: confidence_score, type: number, source: computed, description: "round_half_up(weight_primary * min(1.00, 0.40 + 0.20 * Deal.interview_coverage_count), 2) evaluated at creation time.", constraints: "2 decimal places, round_half_up." }

  - name: Battlecard
    parent: null
    common_fields: true
    fields:
      - { name: competitor_id, type: string, source: input, description: "FK -> Competitor.id; competitor the card targets." }
      - { name: title, type: string, source: input, description: "Card title." }
      - { name: version_label, type: string, source: input, description: "Editorial version label supplied by the author." }
      - { name: status, type: enum, source: system, description: "Card lifecycle; cycles back to DRAFT on rejection or reopen.", default: DRAFT, constraints: "One of DRAFT, LEGAL_REVIEW, APPROVED, PUBLISHED, WITHDRAWN." }
      - { name: risk_index_pre, type: number, source: computed, description: "Stage-3 output of calculations.battlecard_risk_index.", default: 0, constraints: "2 decimal places, round_half_up." }
      - { name: risk_index_final, type: number, source: computed, description: "Stage-5 output of calculations.battlecard_risk_index; gates publication.", default: 0, constraints: "2 decimal places, round_half_up." }
      - { name: approved_claim_count, type: integer, source: computed, description: "Count of BattlecardClaim rows with battlecard_id == this.id AND legal_status == APPROVED.", default: 0 }
      - { name: conditional_claim_count, type: integer, source: computed, description: "Count of BattlecardClaim rows with battlecard_id == this.id AND legal_status == CONDITIONAL.", default: 0 }
      - { name: rejected_claim_count, type: integer, source: computed, description: "Count of BattlecardClaim rows with battlecard_id == this.id AND legal_status == REJECTED.", default: 0 }
      - { name: corroborated_claim_count, type: integer, source: computed, description: "Count of BattlecardClaim rows with battlecard_id == this.id AND substantiation_level == CORROBORATED.", default: 0 }
      - { name: assigned_count, type: integer, source: computed, description: "Count of EnablementAssignment rows with battlecard_id == this.id AND status IN {ASSIGNED, FAILED, TRAINED, EXPIRED}.", default: 0 }
      - { name: trained_count, type: integer, source: computed, description: "Count of EnablementAssignment rows with battlecard_id == this.id AND status == TRAINED.", default: 0 }
      - { name: adoption_rate, type: number, source: computed, description: "Output of calculations.battlecard_adoption_rate.", default: 0, constraints: "4 decimal places, round_half_up." }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock instant of the most recent publication; null before first publish.", default: null }
      - { name: reopen_count, type: integer, source: system, description: "Number of PUBLISHED -> DRAFT reopen cycles.", default: 0 }

  - name: BattlecardClaim
    parent: Battlecard
    common_fields: true
    fields:
      - { name: battlecard_id, type: string, source: input, description: "FK -> Battlecard.id; owning card." }
      - { name: claim_text, type: string, source: input, description: "The competitive claim as it will appear on the card.", constraints: "Non-empty." }
      - { name: claim_type, type: enum, source: input, description: "Claim family; sets the base risk points.", constraints: "One of PRICING, FEATURE, PERFORMANCE, REFERENCE." }
      - { name: evidence_response_ids, type: array, source: input, description: "Evidence set; each element is an InterviewResponse.id belonging to a COMPLETED interview in the card's program. Deliberately an array, not a scalar foreign key.", constraints: "At least 1 element; every element must resolve." }
      - { name: substantiation_score, type: number, source: computed, description: "Output of calculations.claim_substantiation_score.", constraints: "2 decimal places, round_half_up." }
      - { name: substantiation_level, type: enum, source: computed, description: "Threshold banding of substantiation_score.", constraints: "One of UNSUBSTANTIATED, ANECDOTAL, CORROBORATED." }
      - { name: risk_class, type: enum, source: computed, description: "Clamped combination of claim_type base risk and substantiation_level offset.", constraints: "One of LOW, MEDIUM, HIGH." }
      - { name: legal_status, type: enum, source: system, description: "Legal review outcome for this claim.", default: PENDING, constraints: "One of PENDING, APPROVED, CONDITIONAL, REJECTED." }
      - { name: conditions_note, type: string, source: system, description: "Legal conditions recorded with a CONDITIONAL decision.", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the most recent legal decision.", default: null }

  - name: ProductGap
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program." }
      - { name: source_response_id, type: string, source: input, description: "FK -> InterviewResponse.id; originating buyer verbatim, must have question_key == PRODUCT_GAP." }
      - { name: additional_response_ids, type: array, source: input, description: "Further corroborating evidence; each element is an InterviewResponse.id with question_key == PRODUCT_GAP.", default: [] }
      - { name: gap_summary, type: string, source: input, description: "Product-manager-facing summary of the gap.", constraints: "Non-empty." }
      - { name: derived_competitor_id, type: string, source: computed, description: "FK -> Competitor.id; derived by traversing source_response_id -> Interview.deal_id -> Deal.primary_competitor_id. Null when that deal has no primary competitor.", default: null }
      - { name: linked_deal_count, type: integer, source: computed, description: "Count of distinct Deal ids reached from source_response_id plus additional_response_ids via Interview.deal_id.", default: 1 }
      - { name: affected_acr_usd, type: number, source: computed, description: "Sum of Deal.acr_usd over the distinct linked deals whose attribution_status == RATIFIED; each deal counted once.", default: 0, constraints: "2 decimal places." }
      - { name: impact_score, type: number, source: computed, description: "Output of calculations.product_gap_impact_score.", default: 0, constraints: "2 decimal places, round_half_up." }
      - { name: roadmap_priority_band, type: enum, source: computed, description: "Threshold banding of impact_score.", default: P3, constraints: "One of P0, P1, P2, P3." }
      - { name: status, type: enum, source: system, description: "Roadmap routing lifecycle.", default: NEW, constraints: "One of NEW, TRIAGED, ACCEPTED, DECLINED, PROMOTED." }
      - { name: roadmap_epic_ref, type: string, source: system, description: "External roadmap epic reference recorded at promotion.", default: null }

  - name: EnablementAssignment
    parent: Battlecard
    common_fields: true
    fields:
      - { name: battlecard_id, type: string, source: input, description: "FK -> Battlecard.id; card the rep must learn." }
      - { name: sales_rep_user_ref, type: string, source: input, description: "Opaque X-User-ID of the assigned SalesRep. NOT a foreign key; no SalesRep entity exists.", constraints: "Unique per (battlecard_id, sales_rep_user_ref)." }
      - { name: assigned_at, type: datetime, source: system, description: "Logical-clock instant of assignment." }
      - { name: due_at, type: datetime, source: input, description: "Training deadline; completion after this instant is rejected and the sweep expires the row.", constraints: "Must be strictly after the logical clock at assignment." }
      - { name: status, type: enum, source: system, description: "Training lifecycle.", default: ASSIGNED, constraints: "One of ASSIGNED, FAILED, TRAINED, EXPIRED." }
      - { name: quiz_score, type: integer, source: input, description: "Score of the most recent attempt; >= QUIZ_PASS_SCORE means TRAINED.", default: null, constraints: "Integer 0..100 inclusive, or null." }
      - { name: attempt_count, type: integer, source: system, description: "Number of completion attempts recorded.", default: 0 }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant of the passing attempt; null unless status == TRAINED.", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    dimension: status
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{program_id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "program.status == DRAFT"
          - "program.incentive_budget_usd > 0"
          - "program.required_question_keys is a superset of {EVALUATION_CRITERIA, COMPETITOR_POSITIONING, PRICING_PERCEPTION}"
        side_effects:
          - "recompute program.posture via calculations.program_incentive_posture (utilization 0.0000 and status floor OPEN => OPEN)"
          - "increments Program.version by 1"
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /programs/{program_id}/begin-closing"
        actor: ProgramAdmin
        preconditions:
          - "program.status == ACTIVE"
          - "no Interview whose deal_id belongs to this program has status == SCHEDULED"
        side_effects:
          - "recompute program.posture via calculations.program_incentive_posture; the CLOSING status floor forces posture >= RESTRICTED"
          - "every SamplingFrame with program_id == program.id AND status IN {DRAFT, SEALED, SUSPENDED} transitions to CLOSED"
          - "increments Program.version by 1"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /programs/{program_id}/close"
        actor: ProgramAdmin
        preconditions:
          - "program.status == CLOSING"
          - "no LossAttribution whose deal_id belongs to this program has status == PROVISIONAL"
        side_effects:
          - "recompute program.posture; the CLOSED status floor forces posture == FROZEN"
          - "every Battlecard whose competitor_id belongs to this program AND status IN {DRAFT, LEGAL_REVIEW, APPROVED} transitions to WITHDRAWN"
          - "increments Program.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "PUT /programs/{program_id}/incentive-budget"
        actor: ProgramAdmin
        preconditions:
          - "program.status IN {DRAFT, ACTIVE, CLOSING}"
          - "expected_program_version == program.version"
          - "incentive_budget_usd >= program.incentive_paid_usd"
        side_effects:
          - "program.incentive_budget_usd replaced"
          - "recompute program.posture via calculations.program_incentive_posture"
          - "when the recomputed posture leaves FROZEN, every SamplingFrame with program_id == program.id AND status == SUSPENDED transitions back to SEALED"
          - "increments Program.version by 1"
        note: "Self-loop on status; the observable change is the ledger + posture, and it is the OCC-guarded write of concurrency_rules[budget-set-stale-program]."
      - from: ACTIVE
        to: ACTIVE
        trigger: "PUT /programs/{program_id}/interview-guide"
        actor: ProgramAdmin
        preconditions:
          - "program.status IN {DRAFT, ACTIVE}"
          - "required_question_keys is a superset of {EVALUATION_CRITERIA, COMPETITOR_POSITIONING, PRICING_PERCEPTION}"
        side_effects:
          - "program.required_question_keys replaced"
          - "program.guide_version incremented by 1"
          - "already-SCHEDULED Interview rows keep their pinned guide_version_pinned and required_question_keys_pinned (no back-propagation)"
          - "increments Program.version by 1"

  - entity: Deal
    initial_state: NOT_SELECTED
    terminal_states: [DECLINED, SYNTHESIZED]
    dimension: research_status
    note: "Dimension 1 of 2 on the same row; evolves independently of attribution_status."
    transitions:
      - from: NOT_SELECTED
        to: SELECTED
        trigger: "POST /sampling-frames/{frame_id}/draw (server-side selector, one transition per drawn deal)"
        actor: ResearchAnalyst
        preconditions:
          - "frame.status == SEALED"
          - "program.posture != FROZEN"
          - "deal.program_id == frame.program_id"
          - "deal.research_status == NOT_SELECTED"
          - "deal.outcome == requested stratum"
          - "deal.acr_usd >= program.min_deal_value_usd"
          - "frame.window_start <= deal.close_date < frame.window_end (half-open)"
          - "at least one BuyerContact with deal_id == deal.id has consent_status IN {REQUESTED, GRANTED}"
          - "open slots for the stratum > 0"
        side_effects:
          - "deal.sampling_frame_id = frame.id; deal.stratum = deal.outcome"
          - "deal.selection_rank_score = calculations.sample_selection_rank_score output"
          - "frame.selected_<stratum>_count incremented by 1 and frame.open_<stratum>_slots decremented by 1 (invariant sampling_slot_conservation)"
          - "recompute frame.coverage_ratio"
          - "increments Deal.version and SamplingFrame.version by 1"
      - from: SELECTED
        to: DECLINED
        trigger: "POST /deals/{deal_id}/decline-selection"
        actor: ResearchAnalyst
        preconditions:
          - "deal.research_status == SELECTED"
          - "no Interview with deal_id == deal.id has status IN {SCHEDULED, COMPLETED}"
          - "frame.status IN {SEALED, SUSPENDED}"
        side_effects:
          - "compensation: frame.selected_<stratum>_count decremented by 1 and frame.open_<stratum>_slots incremented by 1, restoring invariant sampling_slot_conservation to its pre-draw value"
          - "deal.selection_rank_score set to null; deal.stratum and deal.sampling_frame_id retained for audit"
          - "recompute frame.coverage_ratio"
          - "increments Deal.version and SamplingFrame.version by 1"
      - from: SELECTED
        to: INTERVIEWED
        trigger: "system: Interview SCHEDULED -> COMPLETED"
        actor: system
        preconditions:
          - "interview.coverage_complete == true"
          - "deal.research_status == SELECTED"
        side_effects:
          - "deal.interview_coverage_count incremented by 1"
          - "increments Deal.version by 1"
      - from: INTERVIEWED
        to: SYNTHESIZED
        trigger: "system: LossAttribution PROVISIONAL -> RATIFIED"
        actor: system
        preconditions:
          - "deal.research_status == INTERVIEWED"
        side_effects:
          - "increments Deal.version by 1"
      - from: SYNTHESIZED
        to: INTERVIEWED
        trigger: "system: a new LossAttribution supersedes the RATIFIED one (POST /loss-attributions)"
        actor: system
        preconditions:
          - "deal.research_status == SYNTHESIZED"
          - "deal.attribution_status transitions RATIFIED -> PROVISIONAL in the same request"
        side_effects:
          - "increments Deal.version by 1"
        note: "Revert link of cascade attribution_supersede_recompute."

  - entity: Deal
    initial_state: UNATTRIBUTED
    terminal_states: []
    dimension: attribution_status
    note: "Dimension 2 of 2 on the same row; cyclic (RATIFIED -> PROVISIONAL -> RATIFIED)."
    transitions:
      - from: UNATTRIBUTED
        to: PROVISIONAL
        trigger: "POST /loss-attributions"
        actor: ResearchAnalyst
        preconditions:
          - "deal.research_status == INTERVIEWED"
          - "expected_deal_version == deal.version"
          - "primary_reason_id resolves to a LossReason with program_id == deal.program_id, status == ACTIVE, is_leaf == true"
          - "secondary_reason_id, when present, satisfies the same predicate and differs from primary_reason_id"
          - "weight_primary == 1.00 when secondary_reason_id is null"
        side_effects:
          - "LossAttribution created with status PROVISIONAL, authored_by_analyst_id = X-User-ID, confidence_score computed"
          - "increments Deal.version by 1"
      - from: PROVISIONAL
        to: RATIFIED
        trigger: "POST /loss-attributions/{attribution_id}/ratify"
        actor: ResearchAnalyst
        preconditions:
          - "attribution.status == PROVISIONAL"
          - "X-User-ID != attribution.authored_by_analyst_id (segregation of duties)"
          - "X-User-ID is not the analyst_id of any COMPLETED Interview on attribution.deal_id (segregation of duties)"
        side_effects:
          - "attribution.status = RATIFIED; attribution.ratified_by_analyst_id = X-User-ID"
          - "LossReason.ratified_attribution_count incremented by 1 for primary_reason_id and, when present, secondary_reason_id"
          - "when deal.outcome IN {LOST, NO_DECISION} AND deal.primary_competitor_id is not null, Competitor.ratified_loss_count incremented by 1"
          - "deal.research_status INTERVIEWED -> SYNTHESIZED"
          - "increments Deal.version, LossAttribution.version, LossReason.version and Competitor.version by 1"
      - from: RATIFIED
        to: PROVISIONAL
        trigger: "POST /loss-attributions (new attribution superseding the ratified one)"
        actor: ResearchAnalyst
        preconditions:
          - "deal.attribution_status == RATIFIED"
          - "expected_deal_version == deal.version"
          - "reason predicates as for the UNATTRIBUTED -> PROVISIONAL transition"
        side_effects:
          - "cascade attribution_supersede_recompute link 1: the prior RATIFIED LossAttribution transitions to SUPERSEDED and the new one is created PROVISIONAL"
          - "cascade link 2 (caused by link 1): LossReason.ratified_attribution_count decremented for the superseded row's primary and secondary reasons, and Competitor.ratified_loss_count decremented when it had been incremented"
          - "cascade link 3 (caused by link 2 leaving the deal without a ratified attribution): deal.research_status SYNTHESIZED -> INTERVIEWED"
          - "cascade link 4 (caused by link 3): every ProductGap with status IN {NEW, TRIAGED} whose linked deal set contains this deal recomputes affected_acr_usd, impact_score and roadmap_priority_band"
          - "increments Deal.version by 1"

  - entity: SamplingFrame
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /sampling-frames/{frame_id}/seal"
        actor: ResearchAnalyst
        preconditions:
          - "frame.status == DRAFT"
          - "program.status == ACTIVE"
          - "quota_won + quota_lost + quota_no_decision >= 1"
        side_effects:
          - "open_won_slots / open_lost_slots / open_no_decision_slots initialised to the respective quotas"
          - "coverage_ratio set to 0.0000"
          - "increments SamplingFrame.version by 1"
      - from: SEALED
        to: SUSPENDED
        trigger: "system: program.posture recomputed to FROZEN"
        actor: system
        preconditions:
          - "frame.status == SEALED"
        side_effects:
          - "increments SamplingFrame.version by 1"
        note: "Cascade link 4 of interview_completion_posture_cascade."
      - from: SUSPENDED
        to: SEALED
        trigger: "system: program.posture recomputed to OPEN or RESTRICTED (e.g. after PUT /programs/{program_id}/incentive-budget raises the budget)"
        actor: system
        preconditions:
          - "frame.status == SUSPENDED"
          - "program.status IN {ACTIVE, CLOSING}"
        side_effects:
          - "increments SamplingFrame.version by 1"
        note: "Closes the SEALED <-> SUSPENDED cycle."
      - from: SEALED
        to: CLOSED
        trigger: "POST /sampling-frames/{frame_id}/close"
        actor: ResearchAnalyst
        preconditions:
          - "frame.status IN {SEALED, SUSPENDED}"
        side_effects:
          - "coverage_ratio frozen at its current value"
          - "increments SamplingFrame.version by 1"
      - from: DRAFT
        to: CLOSED
        trigger: "system: POST /programs/{program_id}/begin-closing"
        actor: system
        preconditions:
          - "frame.status IN {DRAFT, SEALED, SUSPENDED}"
        side_effects:
          - "increments SamplingFrame.version by 1"

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: "(none)"
        to: SCHEDULED
        trigger: "POST /interviews"
        actor: ResearchAnalyst
        preconditions:
          - "deal.research_status == SELECTED"
          - "deal.sampling_frame_id resolves to a SamplingFrame with status == SEALED"
          - "program.posture != FROZEN"
          - "buyer_contact.deal_id == deal.id AND buyer_contact.consent_status == GRANTED"
          - "analyst.program_id == deal.program_id AND analyst.status == ACTIVE"
          - "logical clock < analyst.certified_until"
          - "program.independence_mode == ADVISORY OR (analyst.sales_org_member == false AND analyst.linked_user_ref != deal.sales_rep_user_ref)"
          - "no other Interview on this buyer person violates validations[priority=19] (cooling-off window)"
          - "no other SCHEDULED Interview on this analyst violates validations[priority=20] (buffered slot overlap)"
          - "analyst.open_interview_count < program.max_open_interviews_per_analyst"
          - "program.incentive_committed_usd + program.incentive_paid_usd + provisional incentive <= program.incentive_budget_usd"
        side_effects:
          - "interview created with status SCHEDULED and incentive_status COMMITTED"
          - "interview.incentive_provisional_usd = calculations.interview_incentive_amount variant PROVISIONAL"
          - "interview.guide_version_pinned = program.guide_version; interview.required_question_keys_pinned = program.required_question_keys (version pinning)"
          - "program.incentive_committed_usd increased by interview.incentive_provisional_usd (invariant incentive_budget_conservation)"
          - "recompute program.posture; increments Program.version by 1"
          - "analyst.open_interview_count incremented by 1; analyst.committed_minutes increased by scheduled duration + DEBRIEF_BUFFER_MINUTES; increments Analyst.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /interviews/{interview_id}/complete"
        actor: ResearchAnalyst
        preconditions:
          - "interview.status == SCHEDULED"
          - "actual_end_at strictly after actual_start_at"
          - "the distinct question_key set recorded on this interview is a superset of interview.required_question_keys_pinned"
        side_effects:
          - "cascade interview_completion_posture_cascade link 1: interview.status = COMPLETED; actual_start_at/actual_end_at stored; interview.incentive_final_usd = calculations.interview_incentive_amount variant FINAL; interview.incentive_status COMMITTED -> PAID; interview.coverage_complete = true"
          - "cascade link 2 (caused by link 1's incentive_status change): program.incentive_committed_usd decreased by interview.incentive_provisional_usd and program.incentive_paid_usd increased by interview.incentive_final_usd; increments Program.version by 1"
          - "cascade link 3 (caused by link 2's ledger change): program.posture recomputed by calculations.program_incentive_posture"
          - "cascade link 4 (caused by link 3 yielding FROZEN): every SamplingFrame with program_id == program.id AND status == SEALED transitions to SUSPENDED"
          - "buyer_contact.completed_interview_count incremented by 1; buyer_contact.last_completed_interview_end_at = actual_end_at"
          - "deal.research_status SELECTED -> INTERVIEWED; deal.interview_coverage_count incremented by 1"
          - "analyst.open_interview_count decremented by 1; analyst.committed_minutes decreased by scheduled duration + DEBRIEF_BUFFER_MINUTES"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /interviews/{interview_id}/no-show"
        actor: ResearchAnalyst
        preconditions:
          - "interview.status == SCHEDULED"
          - "logical clock >= interview.scheduled_start_at + NO_SHOW_GRACE_MINUTES"
        side_effects:
          - "interview.incentive_status COMMITTED -> FORFEITED"
          - "program.incentive_committed_usd decreased by interview.incentive_provisional_usd (invariant incentive_budget_conservation restored); recompute program.posture; increments Program.version by 1"
          - "analyst.open_interview_count decremented by 1; analyst.committed_minutes decreased by scheduled duration + DEBRIEF_BUFFER_MINUTES"
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /interviews/{interview_id}/reschedule"
        actor: ResearchAnalyst
        preconditions:
          - "interview.status == NO_SHOW"
          - "interview.reschedule_count < MAX_RESCHEDULES"
          - "program.posture != FROZEN"
          - "new interval passes validations[priority=19] and validations[priority=20]"
          - "analyst.open_interview_count < program.max_open_interviews_per_analyst"
        side_effects:
          - "scheduled_start_at / scheduled_end_at replaced; interview.reschedule_count incremented by 1"
          - "interview.incentive_provisional_usd recomputed (PROVISIONAL variant on the new interval); interview.incentive_status FORFEITED -> COMMITTED"
          - "program.incentive_committed_usd increased by the new provisional amount; recompute program.posture; increments Program.version by 1"
          - "analyst.open_interview_count incremented by 1; analyst.committed_minutes increased by the new duration + DEBRIEF_BUFFER_MINUTES"
        note: "Closes the SCHEDULED -> NO_SHOW -> SCHEDULED cycle."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /interviews/{interview_id}/cancel"
        actor: ResearchAnalyst
        preconditions:
          - "interview.status == SCHEDULED"
        side_effects:
          - "compensation: interview.incentive_status COMMITTED -> RELEASED; program.incentive_committed_usd decreased by interview.incentive_provisional_usd so that incentive_budget_conservation returns to its pre-scheduling value"
          - "recompute program.posture; increments Program.version by 1"
          - "analyst.open_interview_count decremented by 1; analyst.committed_minutes decreased by scheduled duration + DEBRIEF_BUFFER_MINUTES"
      - from: NO_SHOW
        to: CANCELLED
        trigger: "POST /interviews/{interview_id}/cancel"
        actor: ResearchAnalyst
        preconditions:
          - "interview.status == NO_SHOW"
        side_effects:
          - "interview.incentive_status remains FORFEITED; no ledger movement (already released at NO_SHOW)"
          - "increments Interview.version by 1"

  - entity: Battlecard
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: LEGAL_REVIEW
        trigger: "POST /battlecards/{battlecard_id}/submit-legal"
        actor: ResearchAnalyst
        preconditions:
          - "battlecard.status == DRAFT"
          - "at least 1 BattlecardClaim with battlecard_id == battlecard.id"
          - "no BattlecardClaim on the card has substantiation_level == UNSUBSTANTIATED"
          - "the program owning battlecard.competitor_id has status == ACTIVE"
          - "that program's posture != FROZEN"
        side_effects:
          - "every BattlecardClaim on the card with legal_status == REJECTED keeps that status; all others are (re)set to PENDING"
          - "recompute risk_index_pre and risk_index_final via calculations.battlecard_risk_index"
          - "increments Battlecard.version by 1"
      - from: LEGAL_REVIEW
        to: APPROVED
        trigger: "system: legal decision leaves no PENDING claim, approved_claim_count >= 1 and rejected_claim_count == 0"
        actor: system
        preconditions:
          - "battlecard.status == LEGAL_REVIEW"
        side_effects:
          - "recompute risk_index_pre and risk_index_final"
          - "increments Battlecard.version by 1"
        note: "Join branch A of the fork on BattlecardClaim legal decisions."
      - from: LEGAL_REVIEW
        to: DRAFT
        trigger: "system: a BattlecardClaim on the card receives decision REJECT"
        actor: system
        preconditions:
          - "battlecard.status == LEGAL_REVIEW"
        side_effects:
          - "recompute risk_index_pre and risk_index_final"
          - "no publication side effects fire; the card returns to authoring (divergent from branch A)"
          - "increments Battlecard.version by 1"
        note: "Join branch B of the same fork; closes the DRAFT -> LEGAL_REVIEW -> DRAFT revision cycle."
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /battlecards/{battlecard_id}/publish"
        actor: EnablementManager
        preconditions:
          - "battlecard.status == APPROVED"
          - "battlecard.risk_index_final <= PUBLISH_RISK_CEILING"
          - "the program owning battlecard.competitor_id has posture != FROZEN"
        side_effects:
          - "battlecard.published_at = logical clock"
          - "competitor.published_battlecard_count incremented by 1; increments Competitor.version by 1"
          - "recompute battlecard.adoption_rate via calculations.battlecard_adoption_rate"
          - "increments Battlecard.version by 1"
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /battlecards/{battlecard_id}/reopen"
        actor: ResearchAnalyst
        preconditions:
          - "battlecard.status == PUBLISHED"
        side_effects:
          - "battlecard.reopen_count incremented by 1"
          - "competitor.published_battlecard_count decremented by 1; increments Competitor.version by 1"
          - "every EnablementAssignment with battlecard_id == battlecard.id AND status == ASSIGNED transitions to EXPIRED"
          - "recompute battlecard.assigned_count, trained_count and adoption_rate"
          - "increments Battlecard.version by 1"
        note: "Claim-monitoring response protocol; closes the PUBLISHED -> DRAFT cycle."
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system: a monitored claim is REJECTED and the card is left with approved_claim_count == 0"
        actor: system
        preconditions:
          - "battlecard.status == PUBLISHED"
          - "approved_claim_count == 0 after the decision"
        side_effects:
          - "cascade claim_rejection_withdrawal_cascade link 2: battlecard.status = WITHDRAWN; battlecard.published_at retained for audit"
          - "cascade link 3 (caused by link 2): every EnablementAssignment with battlecard_id == battlecard.id AND status IN {ASSIGNED, FAILED} transitions to EXPIRED, and competitor.published_battlecard_count is decremented by 1"
          - "recompute battlecard.adoption_rate, assigned_count and trained_count"
          - "increments Battlecard.version and Competitor.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system: POST /programs/{program_id}/close"
        actor: system
        preconditions:
          - "battlecard.status IN {DRAFT, LEGAL_REVIEW, APPROVED}"
        side_effects:
          - "increments Battlecard.version by 1"

  - entity: BattlecardClaim
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision with decision == APPROVE"
        actor: LegalReviewer
        preconditions:
          - "claim.legal_status == PENDING"
          - "battlecard.status IN {LEGAL_REVIEW, PUBLISHED}"
          - "claim.substantiation_level != UNSUBSTANTIATED"
        side_effects:
          - "claim.decided_at = logical clock; battlecard.approved_claim_count incremented by 1"
          - "recompute battlecard.risk_index_pre and risk_index_final"
          - "when battlecard.status == LEGAL_REVIEW and no claim remains PENDING and rejected_claim_count == 0, the card auto-transitions LEGAL_REVIEW -> APPROVED"
          - "increments BattlecardClaim.version and Battlecard.version by 1"
      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision with decision == CONDITIONAL"
        actor: LegalReviewer
        preconditions:
          - "claim.legal_status == PENDING"
          - "battlecard.status IN {LEGAL_REVIEW, PUBLISHED}"
          - "conditions_note is present and non-empty"
        side_effects:
          - "claim.conditions_note stored; claim.decided_at = logical clock; battlecard.conditional_claim_count incremented by 1"
          - "recompute risk_index_final, which adds CONDITIONAL_SURCHARGE per conditional claim (divergent from the APPROVE branch)"
          - "when battlecard.status == LEGAL_REVIEW and no claim remains PENDING and rejected_claim_count == 0, the card auto-transitions LEGAL_REVIEW -> APPROVED"
          - "increments BattlecardClaim.version and Battlecard.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision with decision == REJECT"
        actor: LegalReviewer
        preconditions:
          - "claim.legal_status == PENDING"
          - "battlecard.status IN {LEGAL_REVIEW, PUBLISHED}"
        side_effects:
          - "cascade claim_rejection_withdrawal_cascade link 1: claim.legal_status = REJECTED; claim.decided_at = logical clock; battlecard.rejected_claim_count incremented by 1; the claim leaves the risk-index input set"
          - "when battlecard.status == LEGAL_REVIEW, the card transitions LEGAL_REVIEW -> DRAFT (branch B)"
          - "when battlecard.status == PUBLISHED and approved_claim_count becomes 0, the card transitions PUBLISHED -> WITHDRAWN (cascade link 2)"
          - "recompute risk_index_pre and risk_index_final"
          - "increments BattlecardClaim.version and Battlecard.version by 1"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision with decision == REJECT (claim-monitoring re-review of a published card)"
        actor: LegalReviewer
        preconditions:
          - "claim.legal_status == APPROVED"
          - "battlecard.status == PUBLISHED"
        side_effects:
          - "battlecard.approved_claim_count decremented by 1 and rejected_claim_count incremented by 1"
          - "cascade claim_rejection_withdrawal_cascade links 2 and 3 fire when approved_claim_count reaches 0"
          - "recompute risk_index_pre and risk_index_final"
          - "increments BattlecardClaim.version and Battlecard.version by 1"
      - from: CONDITIONAL
        to: APPROVED
        trigger: "POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision with decision == APPROVE"
        actor: LegalReviewer
        preconditions:
          - "claim.legal_status == CONDITIONAL"
          - "battlecard.status IN {LEGAL_REVIEW, PUBLISHED}"
        side_effects:
          - "battlecard.conditional_claim_count decremented by 1 and approved_claim_count incremented by 1"
          - "recompute risk_index_final (the CONDITIONAL_SURCHARGE for this claim is removed)"
          - "increments BattlecardClaim.version and Battlecard.version by 1"

  - entity: ProductGap
    initial_state: NEW
    terminal_states: [DECLINED, PROMOTED]
    transitions:
      - from: NEW
        to: ACCEPTED
        trigger: "POST /product-gaps/{gap_id}/triage with decision == ACCEPT"
        actor: ProductManager
        preconditions:
          - "gap.status IN {NEW, TRIAGED}"
          - "gap.roadmap_priority_band != P3"
        side_effects:
          - "recompute impact_score and roadmap_priority_band immediately before the band check"
          - "increments ProductGap.version by 1"
      - from: NEW
        to: TRIAGED
        trigger: "POST /product-gaps/{gap_id}/triage with decision == NEEDS_EVIDENCE"
        actor: ProductManager
        preconditions:
          - "gap.status == NEW"
        side_effects:
          - "increments ProductGap.version by 1"
        note: "Fork branch that defers the accept/decline decision; convergence happens on the second triage call."
      - from: NEW
        to: DECLINED
        trigger: "POST /product-gaps/{gap_id}/triage with decision == DECLINE"
        actor: ProductManager
        preconditions:
          - "gap.status IN {NEW, TRIAGED}"
        side_effects:
          - "increments ProductGap.version by 1"
      - from: TRIAGED
        to: ACCEPTED
        trigger: "POST /product-gaps/{gap_id}/triage with decision == ACCEPT"
        actor: ProductManager
        preconditions:
          - "gap.status == TRIAGED"
          - "gap.roadmap_priority_band != P3"
        side_effects:
          - "recompute impact_score and roadmap_priority_band immediately before the band check"
          - "increments ProductGap.version by 1"
      - from: ACCEPTED
        to: PROMOTED
        trigger: "POST /product-gaps/{gap_id}/promote"
        actor: ProductManager
        preconditions:
          - "gap.status == ACCEPTED"
          - "gap.roadmap_priority_band IN {P0, P1}"
          - "program.status == ACTIVE"
        side_effects:
          - "gap.roadmap_epic_ref stored"
          - "increments ProductGap.version by 1"

  - entity: EnablementAssignment
    initial_state: ASSIGNED
    terminal_states: [TRAINED, EXPIRED]
    transitions:
      - from: ASSIGNED
        to: TRAINED
        trigger: "POST /enablement-assignments/{assignment_id}/complete with quiz_score >= QUIZ_PASS_SCORE"
        actor: SalesRep
        preconditions:
          - "assignment.status IN {ASSIGNED, FAILED}"
          - "X-User-ID == assignment.sales_rep_user_ref"
          - "battlecard.status == PUBLISHED"
          - "logical clock <= assignment.due_at"
        side_effects:
          - "assignment.quiz_score stored; assignment.attempt_count incremented by 1; assignment.completed_at = logical clock"
          - "battlecard.trained_count incremented by 1; recompute battlecard.adoption_rate"
          - "increments EnablementAssignment.version and Battlecard.version by 1"
      - from: ASSIGNED
        to: FAILED
        trigger: "POST /enablement-assignments/{assignment_id}/complete with quiz_score < QUIZ_PASS_SCORE"
        actor: SalesRep
        preconditions:
          - "assignment.status IN {ASSIGNED, FAILED}"
          - "X-User-ID == assignment.sales_rep_user_ref"
          - "battlecard.status == PUBLISHED"
          - "logical clock <= assignment.due_at"
        side_effects:
          - "assignment.quiz_score stored; assignment.attempt_count incremented by 1; completed_at stays null"
          - "battlecard.trained_count unchanged; recompute battlecard.adoption_rate"
          - "increments EnablementAssignment.version and Battlecard.version by 1"
        note: "Divergent branch of the same trigger; the fork is decided by the quiz_score threshold."
      - from: FAILED
        to: TRAINED
        trigger: "POST /enablement-assignments/{assignment_id}/complete with quiz_score >= QUIZ_PASS_SCORE"
        actor: SalesRep
        preconditions:
          - "assignment.status == FAILED"
          - "logical clock <= assignment.due_at"
        side_effects:
          - "as for ASSIGNED -> TRAINED; attempt_count keeps accumulating"
      - from: ASSIGNED
        to: EXPIRED
        trigger: "POST /programs/{program_id}/enablement-sweep"
        actor: EnablementManager
        preconditions:
          - "assignment.status IN {ASSIGNED, FAILED}"
          - "logical clock > assignment.due_at"
        side_effects:
          - "recompute battlecard.assigned_count, trained_count and adoption_rate for every touched card"
          - "increments EnablementAssignment.version and Battlecard.version by 1"
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system: Battlecard PUBLISHED -> DRAFT (reopen) or PUBLISHED -> WITHDRAWN"
        actor: system
        preconditions:
          - "assignment.status IN {ASSIGNED, FAILED}"
        side_effects:
          - "recompute battlecard.adoption_rate"
          - "increments EnablementAssignment.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: attribution-create-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /loss-attributions"
    occ_field: "expected_deal_version"
    description: |
      Creating a LossAttribution against a Deal whose version has advanced since
      the client last read it is rejected. A new attribution legitimately
      supersedes the deal's prior RATIFIED attribution, so the write carries no
      state precondition that would stop it on its own; the stale-version check
      is what stops an author whose view of the deal (its coverage count, its
      current attribution) predates another author's supersede.
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412

  - rule_id: budget-set-stale-program
    parent_entity: Program
    write_endpoint: "PUT /programs/{program_id}/incentive-budget"
    occ_field: "expected_program_version"
    description: |
      Replacing Program.incentive_budget_usd from a stale view of the program is
      rejected. Budget replacement is idempotent-by-nature and carries no state
      precondition that a repeated call would trip, so without the version check
      an operator who read a pre-cascade ledger would silently overwrite a budget
      that scheduling, completion or forfeiture side effects have since moved.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: sample_selection_rank_score
    description: |
      Ranks the eligible deal pool of a sealed sampling frame and picks the top-N
      per outcome stratum. Two selection bases weight the same raw inputs
      differently, so the same pool can yield a different drawn set.
    trigger: "POST /sampling-frames/{frame_id}/draw (scores every candidate, then draws); the winning deal's score is persisted to Deal.selection_rank_score"
    inputs:
      - "candidate Deal rows with program_id == frame.program_id AND research_status == NOT_SELECTED"
      - "Deal.acr_usd, Deal.close_date, Deal.segment, Deal.outcome, Deal.primary_competitor_id, Deal.created_at"
      - "Competitor.tier of Deal.primary_competitor_id (null competitor contributes 0)"
      - "frame.window_start, frame.window_end, frame.selection_basis, frame.open_<stratum>_slots"
      - "program.min_deal_value_usd"
      - "logical clock (for recency)"
    algorithm: weighted_scoring
    formula: |
      # --- Stage 1: eligibility filter (a deal failing ANY predicate is excluded
      #     from the pool entirely; it is never scored) ---
      eligible(deal) :=
            deal.research_status == NOT_SELECTED
        AND deal.outcome == requested_stratum
        AND deal.acr_usd >= program.min_deal_value_usd            # inclusive floor
        AND frame.window_start <= deal.close_date < frame.window_end   # half-open
        AND exists BuyerContact c where c.deal_id == deal.id
            AND c.consent_status IN {REQUESTED, GRANTED}

      # --- Stage 2: three component terms, each rounded to 4dp on its own ---
      value_term(deal) := round_half_up(
          min(1.0000, deal.acr_usd / VALUE_NORMALIZER_USD), 4)

      days_since_close := floor_days(logical_clock - deal.close_date)
      recency_term(deal) := round_half_up(
          max(0.0000, (RECENCY_HORIZON_DAYS - days_since_close) / RECENCY_HORIZON_DAYS), 4)

      competitor_term(deal) := COMPETITOR_TIER_WEIGHT[tier of deal.primary_competitor_id]
                               (0.00 when primary_competitor_id is null or the
                                competitor's status == ARCHIVED)

      # --- Stage 3: basis-specific combination (dual variant) ---
      if frame.selection_basis == STRATIFIED_BY_SEGMENT:
          raw := 0.40 * value_term + 0.40 * recency_term + competitor_term
          # segment does NOT multiply here; the stratification happens through
          # the per-segment ordering rule in Stage 4 instead
          score := round_half_up(raw, 4)
      else:   # VALUE_WEIGHTED
          raw := 0.65 * value_term + 0.15 * recency_term + competitor_term
          multiplier := ENTERPRISE_VALUE_MULTIPLIER if deal.segment == ENTERPRISE else 1.00
          score := round_half_up(raw * multiplier, 4)

      # --- Stage 4: deterministic ordering, then draw ---
      # STRATIFIED_BY_SEGMENT: order by score DESC, then segment rank
      #   (ENTERPRISE < MIDMARKET < SMB) ASC, then close_date DESC, then created_at ASC
      # VALUE_WEIGHTED:        order by score DESC, then acr_usd DESC,
      #   then close_date DESC, then created_at ASC
      # Deal.id is NEVER a tie-break input.
      draw the first min(open_<stratum>_slots, requested_count) rows of the order
      if the eligible pool is empty -> ERR_NO_ELIGIBLE_DEALS
    constants:
      VALUE_NORMALIZER_USD: 250000
      RECENCY_HORIZON_DAYS: 180
      COMPETITOR_TIER_WEIGHT: { PRIMARY: 0.30, SECONDARY: 0.20, EMERGING: 0.10, NONE: 0.00 }
      ENTERPRISE_VALUE_MULTIPLIER: 1.25
      SEGMENT_RANK: { ENTERPRISE: 1, MIDMARKET: 2, SMB: 3 }
    precision: "each component term 4 decimal places round_half_up; final score 4 decimal places round_half_up"
    variants:
      - name: STRATIFIED_BY_SEGMENT
        when: "frame.selection_basis == STRATIFIED_BY_SEGMENT"
        difference: "weights 0.40/0.40 on value/recency, no segment multiplier, ordering tie-broken by segment rank ascending"
      - name: VALUE_WEIGHTED
        when: "frame.selection_basis == VALUE_WEIGHTED"
        difference: "weights 0.65/0.15 on value/recency, ENTERPRISE deals multiplied by 1.25, ordering tie-broken by acr_usd descending"

  - name: interview_incentive_amount
    description: |
      Buyer-incentive amount for one interview. The PROVISIONAL variant is
      computed from the scheduled interval and commits budget; the FINAL variant
      is computed from the actual interval and converts the commitment to a
      payment. The two variants diverge whenever the interview ran shorter or
      longer than booked.
    trigger: "POST /interviews (PROVISIONAL, writes incentive_provisional_usd); POST /interviews/{interview_id}/reschedule (PROVISIONAL, recomputed on the new interval); POST /interviews/{interview_id}/complete (FINAL, writes incentive_final_usd)"
    inputs:
      - "BuyerContact.title_band, BuyerContact.incentive_eligibility"
      - "Analyst.employment_type"
      - "Interview.scheduled_start_at / scheduled_end_at (PROVISIONAL) or actual_start_at / actual_end_at (FINAL)"
      - "Program.interview_incentive_cap_usd"
    algorithm: threshold
    formula: |
      if buyer_contact.incentive_eligibility != ELIGIBLE:
          return 0.00                      # short-circuits before every other stage

      base := INCENTIVE_BASE_USD[buyer_contact.title_band]

      minutes := floor_minutes(end_at - start_at)      # variant chooses which pair
      # duration tiers are evaluated top-down; the first match wins
      if   minutes >= DURATION_EXTENDED_MIN: duration_factor := EXTENDED_FACTOR
      elif minutes >= DURATION_FULL_MIN:     duration_factor := 1.00
      elif minutes >= DURATION_PARTIAL_MIN:  duration_factor := PARTIAL_FACTOR
      else:                                  duration_factor := 0.00
      # The EXTENDED tier is what makes the FINAL variant able to EXCEED the
      # PROVISIONAL one: a booked 60-minute slot commits at factor 1.00, and an
      # interview that actually ran 75+ minutes pays at 1.25. Completion is
      # deliberately NOT budget-gated (validations priority 33 covers scheduling
      # only), so the overrun is recognised and the program's posture tightens
      # instead of the payment being refused.

      gross := round_half_up(base * duration_factor, 2)
      if analyst.employment_type == EXTERNAL_VENDOR:
          gross := round_half_up(gross * EXTERNAL_VENDOR_UPLIFT, 2)
          # the uplift is applied to the ALREADY-ROUNDED gross, not to
          # base * duration_factor; the two orders differ at 2dp

      return min(gross, program.interview_incentive_cap_usd)
    constants:
      INCENTIVE_BASE_USD: { ECONOMIC_BUYER: 250.00, CHAMPION: 175.00, PROCUREMENT: 150.00, END_USER: 100.00 }
      DURATION_EXTENDED_MIN: 75
      EXTENDED_FACTOR: 1.25
      DURATION_FULL_MIN: 45
      DURATION_PARTIAL_MIN: 25
      PARTIAL_FACTOR: 0.60
      EXTERNAL_VENDOR_UPLIFT: 1.10
      # Scheduling constants referenced by §1.2 Interview transitions and by
      # validations priorities 19, 20 and 36. They are declared here because the
      # interview lifecycle is the only consumer.
      DEBRIEF_BUFFER_MINUTES: 15
      NO_SHOW_GRACE_MINUTES: 15
      COOLING_OFF_DAYS: 90
      MAX_RESCHEDULES: 2
    precision: "2 decimal places, round_half_up; the uplift multiplies the rounded gross (rounding happens twice)"
    variants:
      - name: PROVISIONAL
        when: "scheduling or rescheduling an interview (status becomes SCHEDULED)"
        difference: "minutes derived from scheduled_end_at - scheduled_start_at; result stored in incentive_provisional_usd and ADDED to Program.incentive_committed_usd"
      - name: FINAL
        when: "completing an interview (status becomes COMPLETED)"
        difference: "minutes derived from actual_end_at - actual_start_at; result stored in incentive_final_usd, the provisional amount is REMOVED from incentive_committed_usd and the final amount is added to incentive_paid_usd. Because the EXTENDED tier can lift the factor to 1.25 while a booked slot rarely reaches 75 minutes, the FINAL amount may be strictly larger than the PROVISIONAL one, which is the only way Program.posture can reach FROZEN through a completion."

  - name: claim_substantiation_score
    description: |
      Scores a battlecard claim from its evidence set of interview responses and
      derives both a substantiation level and a risk class. The rounding order is
      pinned: every evidence contribution is rounded to 2dp on its own before the
      sum, so a set of many small contributions scores differently from the
      unrounded sum of the same set.
    trigger: "POST /battlecards/{battlecard_id}/claims; recomputed whenever the claim's evidence set changes"
    inputs:
      - "BattlecardClaim.evidence_response_ids -> InterviewResponse rows"
      - "InterviewResponse.question_key, InterviewResponse.rating, InterviewResponse.recorded_at"
      - "BattlecardClaim.claim_type"
      - "logical clock"
    algorithm: weighted_scoring
    formula: |
      # --- per-item contribution, each rounded to 2dp BEFORE summation ---
      for each response r in evidence set (deduplicated by response id):
          w := SOURCE_WEIGHT[r.question_key]
          rating_factor := 1.00 if r.rating is null else (0.60 + 0.10 * r.rating)
              # rating 1 -> 0.70 ... rating 5 -> 1.10
          age_days := floor_days(logical_clock - r.recorded_at)
          recency_factor := 1.00 if age_days <= EVIDENCE_RECENCY_DAYS else STALE_EVIDENCE_FACTOR
          item := round_half_up(w * rating_factor * recency_factor, 2)

      substantiation_score := round_half_up(sum(item over evidence set), 2)

      # --- level thresholds, evaluated top-down; boundaries are inclusive ---
      if   substantiation_score >= CORROBORATED_MIN: level := CORROBORATED
      elif substantiation_score >= ANECDOTAL_MIN:    level := ANECDOTAL
      else:                                          level := UNSUBSTANTIATED

      # --- risk class from claim type adjusted by level, then clamped ---
      points := CLAIM_TYPE_BASE_RISK[claim.claim_type] + LEVEL_OFFSET[level]
      points := min(3, max(1, points))
      risk_class := {1: LOW, 2: MEDIUM, 3: HIGH}[points]
    constants:
      SOURCE_WEIGHT: { COMPETITOR_POSITIONING: 1.00, PRICING_PERCEPTION: 0.90, EVALUATION_CRITERIA: 0.70, LOSS_REASON: 0.50, PRODUCT_GAP: 0.40 }
      EVIDENCE_RECENCY_DAYS: 90
      STALE_EVIDENCE_FACTOR: 0.75
      CORROBORATED_MIN: 2.00
      ANECDOTAL_MIN: 0.90
      CLAIM_TYPE_BASE_RISK: { PRICING: 3, PERFORMANCE: 3, FEATURE: 2, REFERENCE: 1 }
      LEVEL_OFFSET: { UNSUBSTANTIATED: 1, ANECDOTAL: 0, CORROBORATED: -1 }
    precision: "each evidence item rounded to 2 decimal places round_half_up, then the sum rounded to 2 decimal places round_half_up (round-then-sum, NOT sum-then-round)"

  - name: battlecard_risk_index
    description: |
      Aggregate legal risk of a battlecard. risk_index_pre is the raw claim-risk
      average; risk_index_final applies a legal-review discount whose tier is
      keyed on risk_index_pre (so the discount does not depend on its own output)
      plus a per-conditional-claim surcharge. The five evaluation stages are
      ordered; evaluating them in any other order yields a different index.
    trigger: "POST /battlecards/{battlecard_id}/submit-legal; every POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision; POST /battlecards/{battlecard_id}/publish (re-verified against the ceiling)"
    inputs:
      - "BattlecardClaim rows with battlecard_id == card.id AND legal_status != REJECTED"
      - "BattlecardClaim.risk_class, BattlecardClaim.legal_status"
    algorithm: threshold
    formula: |
      # Stage 1 — input set: claims with legal_status != REJECTED.
      #   REJECTED claims are removed from the card's risk entirely.
      S := {c in claims(card) : c.legal_status != REJECTED}
      if S is empty:
          risk_index_pre := 0.00 ; risk_index_final := 0.00 ; stop

      # Stage 2 — raw average risk, 2dp
      risk_index_pre := round_half_up(sum(RISK_POINTS[c.risk_class] for c in S) / count(S), 2)

      # Stage 3 — discount tier keyed on risk_index_pre (NOT on the running final)
      if   risk_index_pre >= LEGAL_DISCOUNT_HIGH_AT: discount := 0.25
      elif risk_index_pre >= LEGAL_DISCOUNT_MID_AT:  discount := 0.10
      else:                                          discount := 0.00
      # the discount only applies to the portion of S that legal has cleared
      cleared := count(c in S : c.legal_status IN {APPROVED, CONDITIONAL})
      discount_scale := round_half_up(cleared / count(S), 4)

      # Stage 4 — apply the scaled discount to the rounded pre value
      after_discount := round_half_up(risk_index_pre * (1 - round_half_up(discount * discount_scale, 4)), 2)

      # Stage 5 — conditional surcharge, added AFTER the discount, then clamp
      conditional_count := count(c in S : c.legal_status == CONDITIONAL)
      risk_index_final := round_half_up(
          min(3.00, after_discount + CONDITIONAL_SURCHARGE * conditional_count), 2)

      # publish gate: risk_index_final <= PUBLISH_RISK_CEILING
    constants:
      RISK_POINTS: { HIGH: 3, MEDIUM: 2, LOW: 1 }
      LEGAL_DISCOUNT_HIGH_AT: 2.50
      LEGAL_DISCOUNT_MID_AT: 1.50
      CONDITIONAL_SURCHARGE: 0.15
      PUBLISH_RISK_CEILING: 2.20
      RISK_INDEX_CEILING: 3.00
    precision: "risk_index_pre and risk_index_final 2 decimal places round_half_up; discount_scale and the scaled discount 4 decimal places round_half_up"

  - name: loss_reason_trend_shares
    description: |
      Trend analysis of loss reasons by segment over a close-date window. Each
      attribution contributes its weights to the ROOT ancestor of its reason, so
      the taxonomy tree is collapsed to depth 1 before shares are computed.
    trigger: "GET /programs/{program_id}/loss-trends"
    inputs:
      - "LossAttribution rows whose deal belongs to the program"
      - "LossAttribution.status, weight_primary, weight_secondary, primary_reason_id, secondary_reason_id"
      - "Deal.segment, Deal.close_date, Deal.outcome"
      - "LossReason.parent_reason_id chain (to find the root ancestor), LossReason.code"
      - "query parameters window_start, window_end, basis, segment (optional filter)"
    algorithm: aggregation
    formula: |
      # Stage 1 — attribution input set
      if basis == RATIFIED_ONLY:        A := {a : a.status == RATIFIED}
      else:                             A := {a : a.status IN {RATIFIED, PROVISIONAL}}
      A := {a in A : a.deal.outcome IN {LOST, NO_DECISION}
                     AND window_start <= a.deal.close_date < window_end}   # half-open
      if segment filter present: A := {a in A : a.deal.segment == segment}

      # Stage 2 — collapse each reason to its root ancestor by walking
      #           parent_reason_id upward until parent_reason_id is null
      root(reason) := reason if reason.parent_reason_id is null else root(parent)

      # Stage 3 — weighted accumulation, per (segment, root reason)
      for each a in A:
          bucket[a.deal.segment][root(a.primary_reason)]   += a.weight_primary
          if a.secondary_reason_id is not null:
              bucket[a.deal.segment][root(a.secondary_reason)] += a.weight_secondary
      # primary and secondary may collapse to the SAME root; both contributions
      # are kept (they sum into one bucket)

      # Stage 4 — shares within each segment, 4dp
      segment_total[s] := sum over buckets of segment s        # equals count(A restricted to s)
      share[s][r] := round_half_up(bucket[s][r] / segment_total[s], 4)
      # shares within a segment may not re-sum to exactly 1.0000 after rounding;
      # the unrounded weighted totals are reported alongside as weighted_total

      # Stage 5 — ordering inside each segment: share DESC, then
      #           weighted_total DESC, then LossReason.code ASC. Never by id.
      # Segments themselves are ordered ENTERPRISE, MIDMARKET, SMB.
      # A segment with segment_total == 0 is omitted from the response.
    constants:
      SEGMENT_ORDER: [ENTERPRISE, MIDMARKET, SMB]
    precision: "weighted totals 2 decimal places round_half_up; shares 4 decimal places round_half_up"
    variants:
      - name: RATIFIED_ONLY
        when: "basis query parameter == RATIFIED_ONLY (default)"
        difference: "only LossAttribution rows with status == RATIFIED enter the input set; SUPERSEDED and PROVISIONAL rows are excluded"
      - name: INCLUDE_PROVISIONAL
        when: "basis query parameter == INCLUDE_PROVISIONAL"
        difference: "PROVISIONAL rows also enter the input set, changing every denominator and therefore every share; SUPERSEDED rows remain excluded in both variants"

  - name: product_gap_impact_score
    description: |
      Roadmap prioritization score of a product gap, combining the annual
      contract value of the deals that surfaced it, how often it was raised, and
      the tier of the competitor it is associated with.
    trigger: "POST /product-gaps; recomputed on POST /product-gaps/{gap_id}/triage and by cascade attribution_supersede_recompute"
    inputs:
      - "ProductGap.source_response_id plus additional_response_ids -> InterviewResponse rows"
      - "each response's Interview.deal_id -> Deal.acr_usd, Deal.attribution_status"
      - "ProductGap.derived_competitor_id -> Competitor.tier"
    algorithm: weighted_scoring
    formula: |
      # Stage 1 — the linked deal set is the DISTINCT set of deals reachable from
      #   the gap's evidence responses (source + additional), via
      #   InterviewResponse.interview_id -> Interview.deal_id
      D := distinct deals reachable from the evidence responses
      linked_deal_count := count(D)
      # only deals whose loss attribution is RATIFIED contribute revenue weight;
      # this is what makes cascade link 4 of attribution_supersede_recompute
      # observable (a superseded attribution removes its deal's ACR again)
      R := {d in D : d.attribution_status == RATIFIED}
      affected_acr_usd  := round_half_up(sum(d.acr_usd for d in R), 2)

      # Stage 2 — two additive components
      acr_component  := round_half_up(
          min(1.0000, affected_acr_usd / IMPACT_ACR_NORMALIZER) * IMPACT_ACR_WEIGHT, 2)
      freq_component := min(IMPACT_FREQ_CAP, linked_deal_count) * IMPACT_FREQ_WEIGHT

      # Stage 3 — competitive pressure multiplier
      pressure := COMPETITOR_PRESSURE[tier of derived_competitor_id]   # 1.00 when null
      impact_score := round_half_up((acr_component + freq_component) * pressure, 2)

      # Stage 4 — band, evaluated top-down, boundaries inclusive
      if   impact_score >= BAND_P0_MIN: band := P0
      elif impact_score >= BAND_P1_MIN: band := P1
      elif impact_score >= BAND_P2_MIN: band := P2
      else:                             band := P3
    constants:
      IMPACT_ACR_NORMALIZER: 500000
      IMPACT_ACR_WEIGHT: 40
      IMPACT_FREQ_WEIGHT: 4
      IMPACT_FREQ_CAP: 10
      COMPETITOR_PRESSURE: { PRIMARY: 1.30, SECONDARY: 1.10, EMERGING: 1.00, NONE: 1.00 }
      BAND_P0_MIN: 70
      BAND_P1_MIN: 45
      BAND_P2_MIN: 20
    precision: "affected_acr_usd and impact_score 2 decimal places round_half_up; the normalized ACR ratio 4 decimal places round_half_up"

  - name: program_incentive_posture
    description: |
      Derives Program.posture from incentive-budget utilization, with a floor
      imposed by the program's own lifecycle status. The posture gates every
      child write (sampling draws, interview scheduling, battlecard publication).
    trigger: "every write that moves Program.incentive_committed_usd or Program.incentive_paid_usd, plus every Program status transition and PUT /programs/{program_id}/incentive-budget"
    inputs:
      - "Program.incentive_committed_usd, Program.incentive_paid_usd, Program.incentive_budget_usd, Program.status"
    algorithm: threshold
    formula: |
      if program.incentive_budget_usd == 0:
          utilization := 1.0000
      else:
          utilization := round_half_up(
              (incentive_committed_usd + incentive_paid_usd) / incentive_budget_usd, 4)

      # threshold ladder, evaluated top-down, boundaries inclusive
      if   utilization >= POSTURE_FROZEN_AT:     utilization_posture := FROZEN
      elif utilization >= POSTURE_RESTRICTED_AT: utilization_posture := RESTRICTED
      else:                                      utilization_posture := OPEN

      # status floor: the program's lifecycle can only tighten the posture
      status_floor := { DRAFT: OPEN, ACTIVE: OPEN, CLOSING: RESTRICTED, CLOSED: FROZEN }[program.status]

      posture := the STRICTER of utilization_posture and status_floor
                 (severity order OPEN < RESTRICTED < FROZEN)
    constants:
      POSTURE_RESTRICTED_AT: 0.85
      POSTURE_FROZEN_AT: 1.00
      POSTURE_SEVERITY: { OPEN: 0, RESTRICTED: 1, FROZEN: 2 }
    precision: "utilization 4 decimal places round_half_up; the rounded utilization is what is compared to the thresholds"

  - name: battlecard_adoption_rate
    description: |
      Sales-enablement adoption of a published battlecard: the share of its
      assignments that reached TRAINED. EXPIRED assignments stay in the
      denominator (an expired assignment is a missed adoption, not a void one).
    trigger: "POST /enablement-assignments; POST /enablement-assignments/{assignment_id}/complete; POST /programs/{program_id}/enablement-sweep; Battlecard publish, reopen and withdraw"
    inputs:
      - "EnablementAssignment rows with battlecard_id == card.id"
      - "EnablementAssignment.status"
    algorithm: aggregation
    formula: |
      assigned_count := count(assignments with status IN {ASSIGNED, FAILED, TRAINED, EXPIRED})
      trained_count  := count(assignments with status == TRAINED)

      if assigned_count == 0:
          adoption_rate := 0.0000
      else:
          adoption_rate := round_half_up(trained_count / assigned_count, 4)

      adoption_gate_met := adoption_rate >= ADOPTION_GATE
      # POST /battlecards/{battlecard_id}/reopen on a card whose adoption_gate_met
      # is false is still allowed; the gate only blocks
      # POST /programs/{program_id}/close-... style rollups that read it, and it
      # is enforced on POST /product-gaps/{gap_id}/promote of gaps whose
      # derived competitor has a PUBLISHED card (see validations priority 34).
    constants:
      QUIZ_PASS_SCORE: 80
      ADOPTION_GATE: 0.60
    precision: "4 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (strictly ordered; the LOWEST priority number whose
# condition is violated determines the returned error)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-Role header present and X-User-ID header present"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
    description: "Both identity headers are mandatory on every endpoint, including GETs and the clock endpoint."

  - priority: 2
    category: auth
    check: "X-Role is one of ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
    description: "An unrecognised role value is an authentication failure, not an authorization failure."

  - priority: 3
    category: auth
    check: "the endpoint's authorized_roles list contains X-Role"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
    description: "Checked before any path parameter is resolved, so an unauthorized role never learns whether a resource exists."

  - priority: 4
    category: auth
    check: "when X-Role == ResearchAnalyst, X-User-ID resolves to an Analyst row with status == ACTIVE"
    error_id: ERR_ANALYST_IDENTITY_INVALID
    http_status: 403
    applies_to: "all endpoints whose authorized_roles include ResearchAnalyst and that write state"
    description: "ResearchAnalyst is the only entity_backed role; its X-User-ID is an Analyst.id and must resolve."

  - priority: 5
    category: existence
    check: "every path parameter resolves to an existing row of the expected entity"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_COMPETITOR_NOT_FOUND | ERR_DEAL_NOT_FOUND | ERR_ANALYST_NOT_FOUND | ERR_BUYER_CONTACT_NOT_FOUND | ERR_SAMPLING_FRAME_NOT_FOUND | ERR_INTERVIEW_NOT_FOUND | ERR_LOSS_REASON_NOT_FOUND | ERR_LOSS_ATTRIBUTION_NOT_FOUND | ERR_BATTLECARD_NOT_FOUND | ERR_BATTLECARD_CLAIM_NOT_FOUND | ERR_PRODUCT_GAP_NOT_FOUND | ERR_ENABLEMENT_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
    description: "Resolved left to right along the path, so the outermost missing segment reports first. A nested child whose parent path segment does not match its stored parent id reports the CHILD's not-found error."

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body or query string resolves to an existing row"
    error_id: "the corresponding *_NOT_FOUND code from priority 5"
    http_status: 404
    applies_to: "POST /competitors, POST /deals, POST /analysts, POST /sampling-frames, POST /interviews, POST /loss-reasons, POST /loss-attributions, POST /battlecards, POST /battlecards/{battlecard_id}/claims, POST /product-gaps, POST /enablement-assignments, GET list endpoints with filter parameters"
    description: "Body FKs are resolved in the field order declared in §1.5, after all path parameters."

  - priority: 7
    category: validation
    check: "all required body fields present; every field's JSON type matches; every enum value is a declared member; pagination limit in [1,100] and offset >= 0; datetimes are ISO-8601 UTC; arrays are non-empty where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Structural validation. Unknown extra fields are ignored. Fields with source computed or system supplied by the client are ignored, never rejected."

  - priority: 8
    category: validation
    check: "numeric domains: acr_usd > 0; incentive_budget_usd >= 0; interview_incentive_cap_usd >= 0; min_deal_value_usd >= 0; quotas >= 0; max_open_interviews_per_analyst >= 1; rating in [1,5] when non-null; quiz_score in [0,100]; weight_primary in [0.50,1.00]"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /programs, PUT /programs/{program_id}/incentive-budget, POST /deals, PATCH /deals/{deal_id}, POST /sampling-frames, POST /interviews/{interview_id}/responses, POST /loss-attributions, POST /enablement-assignments/{assignment_id}/complete"
    description: "Range checks on individually well-typed values."

  - priority: 9
    category: validation
    check: "interval well-formedness: window_start < window_end; scheduled_start_at < scheduled_end_at; actual_start_at < actual_end_at; due_at > assigned_at"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /sampling-frames, GET /programs/{program_id}/loss-trends, POST /interviews, POST /interviews/{interview_id}/reschedule, POST /interviews/{interview_id}/complete, POST /enablement-assignments"
    description: "Zero-length intervals are rejected (strict inequality)."

  - priority: 10
    category: validation
    check: "every referenced row belongs to the same Program as the operation's scope"
    error_id: ERR_CROSS_PROGRAM_REFERENCE
    http_status: 409
    applies_to: "POST /interviews, POST /loss-attributions, POST /battlecards/{battlecard_id}/claims, POST /sampling-frames/{frame_id}/draw, POST /product-gaps, POST /enablement-assignments"
    description: "Program is the tenancy boundary; a valid id from another program is a conflict, not a not-found."

  - priority: 11
    category: validation
    check: "uniqueness: Competitor.name per program (case-insensitive); Deal.crm_deal_ref per program; BuyerContact.email per deal (case-insensitive); LossReason.code per program; EnablementAssignment.sales_rep_user_ref per battlecard; at most one LossAttribution per deal with status IN {PROVISIONAL, RATIFIED}"
    error_id: ERR_DUPLICATE_RESOURCE_KEY
    http_status: 409
    applies_to: "POST /competitors, POST /deals, POST /deals/{deal_id}/buyer-contacts, POST /loss-reasons, POST /enablement-assignments"
    description: "Checked after existence and structural validation, before optimistic concurrency."

  - priority: 12
    category: concurrency
    check: "expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_DEAL_VERSION | ERR_STALE_PROGRAM_VERSION"
    http_status: 412
    applies_to: "POST /loss-attributions, PUT /programs/{program_id}/incentive-budget"
    description: "See §1.2.1. Deliberately ordered ABOVE state preconditions so a stale writer is told to re-read rather than being told the state is wrong."

  - priority: 13
    category: state
    check: "the entity is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_PROGRAM_STATE_INVALID | ERR_DEAL_STATE_INVALID | ERR_FRAME_STATE_INVALID | ERR_INTERVIEW_STATE_INVALID | ERR_ATTRIBUTION_STATE_INVALID | ERR_BATTLECARD_STATE_INVALID | ERR_CLAIM_STATE_INVALID | ERR_PRODUCT_GAP_STATE_INVALID | ERR_ASSIGNMENT_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"
    description: "Includes terminal-state lockdown: a CLOSED program, SYNTHESIZED-then-DECLINED deal, COMPLETED or CANCELLED interview, WITHDRAWN battlecard, REJECTED claim, PROMOTED or DECLINED gap, TRAINED or EXPIRED assignment reject every further transition."

  - priority: 14
    category: state
    check: "the owning Program.posture != FROZEN for writes that consume incentive budget or extend research"
    error_id: ERR_PROGRAM_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /sampling-frames/{frame_id}/draw, POST /interviews, POST /interviews/{interview_id}/reschedule, POST /battlecards/{battlecard_id}/publish, POST /enablement-assignments"
    description: "A derived-state gate: FROZEN is reached either by utilization >= 1.00 or by the program reaching CLOSED. Ordered above every business rule so a frozen program produces one stable error regardless of which other rule the payload would also break."

  - priority: 15
    category: business_safety
    check: "segregation of duties: the ratifying analyst is neither the attribution's author nor an analyst who conducted a COMPLETED interview on that deal; the legal reviewer of a claim is not its battlecard's author; the sales rep completing an assignment is its own assignee"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /loss-attributions/{attribution_id}/ratify, POST /battlecards/{battlecard_id}/claims/{claim_id}/legal-decision, POST /enablement-assignments/{assignment_id}/complete"
    description: "Identity-based rule evaluated after state so that a wrongly-staged request reports its state problem first."

  - priority: 16
    category: business_safety
    check: "when program.independence_mode == STRICT, the interviewing analyst has sales_org_member == false AND analyst.linked_user_ref != deal.sales_rep_user_ref"
    error_id: ERR_INDEPENDENCE_VIOLATION
    http_status: 422
    applies_to: "POST /interviews, POST /interviews/{interview_id}/reschedule"
    description: "Conditional validation: the whole rule is skipped when independence_mode == ADVISORY."

  - priority: 17
    category: business_safety
    check: "logical clock < analyst.certified_until"
    error_id: ERR_ANALYST_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /interviews, POST /interviews/{interview_id}/reschedule, POST /interviews/{interview_id}/complete"
    description: "Certification is checked against the logical clock at request time, not against the interview's scheduled start."

  - priority: 18
    category: business_safety
    check: "buyer_contact.consent_status == GRANTED"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 422
    applies_to: "POST /interviews, POST /interviews/{interview_id}/reschedule"
    description: "Consent is a safety precondition to contacting a buyer; it outranks every temporal contact rule below."

  - priority: 19
    category: business_temporal
    check: "the buyer person (matched by lower(email) across ALL deals) has no COMPLETED interview whose actual_end_at falls within COOLING_OFF_DAYS before the requested scheduled_start_at, and no other SCHEDULED interview within the same window"
    error_id: ERR_CONTACT_COOLING_OFF_ACTIVE
    http_status: 409
    applies_to: "POST /interviews, POST /interviews/{interview_id}/reschedule"
    description: "Closed-closed rolling window: an interview exactly COOLING_OFF_DAYS before the requested start is still inside the window and blocks. Matching is by person (email), so the same buyer at two different deals collides."

  - priority: 20
    category: business_temporal
    check: "the requested interval, expanded by DEBRIEF_BUFFER_MINUTES at its end, does not overlap any other SCHEDULED interview of the same analyst (also expanded)"
    error_id: ERR_ANALYST_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /interviews, POST /interviews/{interview_id}/reschedule"
    description: "Half-open buffered comparison: [start, end + 15min) versus [other.start, other.end + 15min). Exact back-to-back bookings (gap 0) DO conflict because the debrief buffer of the earlier one covers the later start; a gap of exactly 15 minutes does not conflict."

  - priority: 21
    category: business_temporal
    check: "frame.window_start <= deal.close_date < frame.window_end for the deal being drawn or explicitly attached"
    error_id: ERR_DEAL_OUTSIDE_FRAME_WINDOW
    http_status: 422
    applies_to: "POST /sampling-frames/{frame_id}/draw with an explicit deal_id"
    description: "Half-open window: a deal closing exactly on window_end is out of frame; one closing exactly on window_start is in."

  - priority: 22
    category: business_safety
    check: "analyst.open_interview_count < program.max_open_interviews_per_analyst"
    error_id: ERR_ANALYST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /interviews, POST /interviews/{interview_id}/reschedule"
    description: "Aggregate validation: each individual interview is legal but the collective open workload is capped."

  - priority: 23
    category: business_safety
    check: "the requested stratum has open_<stratum>_slots >= requested_count"
    error_id: ERR_STRATUM_QUOTA_EXHAUSTED
    http_status: 409
    applies_to: "POST /sampling-frames/{frame_id}/draw"
    description: "Quota conservation: quota_X always equals selected_X_count + open_X_slots."

  - priority: 24
    category: business_safety
    check: "after eligibility filtering the candidate pool for the requested stratum is non-empty"
    error_id: ERR_NO_ELIGIBLE_DEALS
    http_status: 422
    applies_to: "POST /sampling-frames/{frame_id}/draw"
    description: "Distinguishes 'no room left in the quota' (priority 23) from 'room exists but nothing qualifies' (this rule)."

  - priority: 25
    category: business_safety
    check: "the distinct question_key set recorded on the interview is a superset of interview.required_question_keys_pinned"
    error_id: ERR_GUIDE_COVERAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /interviews/{interview_id}/complete"
    description: "Coverage is measured against the guide version PINNED at scheduling, not the program's current guide."

  - priority: 26
    category: business_safety
    check: "the referenced LossReason has is_leaf == true"
    error_id: ERR_REASON_NOT_LEAF
    http_status: 422
    applies_to: "POST /loss-attributions"
    description: "Attributions may only cite leaves of the taxonomy; interior nodes exist for roll-up only."

  - priority: 27
    category: business_safety
    check: "the referenced LossReason has status == ACTIVE"
    error_id: ERR_REASON_DEPRECATED
    http_status: 422
    applies_to: "POST /loss-attributions"
    description: "Deprecated reasons remain readable and keep contributing to historical trends but cannot be cited by new attributions."

  - priority: 28
    category: business_safety
    check: "parent_reason_id.depth + 1 <= TAXONOMY_MAX_DEPTH (3)"
    error_id: ERR_TAXONOMY_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /loss-reasons"
    description: "Bounds the recursive root-ancestor walk in calculations.loss_reason_trend_shares."

  - priority: 29
    category: business_safety
    check: "the proposed parent_reason_id is not the node itself nor any of its descendants"
    error_id: ERR_TAXONOMY_CYCLE
    http_status: 409
    applies_to: "POST /loss-reasons, PATCH /loss-reasons/{reason_id}"
    description: "Guards the self-referential edge; a cycle would make the root-ancestor walk non-terminating."

  - priority: 30
    category: business_fiscal
    check: "weight_primary == 1.00 when secondary_reason_id is null; weight_primary + weight_secondary == 1.00 when it is present; secondary_reason_id != primary_reason_id"
    error_id: ERR_WEIGHT_SPLIT_INVALID
    http_status: 422
    applies_to: "POST /loss-attributions"
    description: "Conservation of attribution weight across the primary/secondary split."

  - priority: 31
    category: business_safety
    check: "every claim on the battlecard has substantiation_level != UNSUBSTANTIATED"
    error_id: ERR_CLAIM_UNSUBSTANTIATED
    http_status: 422
    applies_to: "POST /battlecards/{battlecard_id}/submit-legal"
    description: "Substantiation gate before legal review; the boundary is substantiation_score exactly ANECDOTAL_MIN (0.90), which PASSES."

  - priority: 32
    category: business_safety
    check: "battlecard.risk_index_final <= PUBLISH_RISK_CEILING (2.20)"
    error_id: ERR_RISK_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /battlecards/{battlecard_id}/publish"
    description: "Recomputed at publish time; a card that was approved before a later CONDITIONAL surcharge can fail here."

  - priority: 33
    category: business_fiscal
    check: "program.incentive_committed_usd + program.incentive_paid_usd + the new provisional amount <= program.incentive_budget_usd"
    error_id: ERR_INCENTIVE_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /interviews, POST /interviews/{interview_id}/reschedule"
    description: "A fiscal ceiling distinct from the posture gate at priority 14: posture FROZEN blocks all writes at >= 100% utilization, while this rule blocks the individual write that would cross the budget from below. POST /interviews/{interview_id}/complete is deliberately NOT covered: an interview that overran its slot is paid at the EXTENDED factor even when that pushes utilization past 1.00, and the program's posture freezes as a consequence."

  - priority: 34
    category: business_safety
    check: "when the gap's derived competitor has at least one PUBLISHED battlecard, that competitor's most recently published battlecard has adoption_rate >= ADOPTION_GATE (0.60)"
    error_id: ERR_ADOPTION_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /product-gaps/{gap_id}/promote"
    description: "Adoption measurement feeds back into roadmap promotion; the rule is skipped entirely when the competitor has no published card."

  - priority: 35
    category: business_temporal
    check: "logical clock <= assignment.due_at"
    error_id: ERR_ASSIGNMENT_PAST_DUE
    http_status: 409
    applies_to: "POST /enablement-assignments/{assignment_id}/complete"
    description: "Inclusive boundary: completing exactly at due_at succeeds; one second later fails."

  - priority: 36
    category: business_safety
    check: "interview.reschedule_count < MAX_RESCHEDULES (2)"
    error_id: ERR_RESCHEDULE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /interviews/{interview_id}/reschedule"
    description: "Terminates the SCHEDULED -> NO_SHOW -> SCHEDULED cycle after two reschedules."

  - priority: 37
    category: business_safety
    check: "the InterviewResponse referenced by source_response_id has question_key == PRODUCT_GAP"
    error_id: ERR_RESPONSE_NOT_PRODUCT_GAP
    http_status: 422
    applies_to: "POST /product-gaps"
    description: "Only PRODUCT_GAP verbatims may seed a roadmap gap; every other question_key is evidence for battlecards instead."

  - priority: 38
    category: business_safety
    check: "every id in evidence_response_ids resolves to an InterviewResponse of an interview whose deal belongs to the same program as the battlecard's competitor, and the array has at least one distinct member"
    error_id: ERR_EVIDENCE_SET_INVALID
    http_status: 422
    applies_to: "POST /battlecards/{battlecard_id}/claims"
    description: "Cross-aggregate reference integrity for the evidence array. Duplicate ids inside the array are deduplicated, not rejected."

# =============================================================================
# §1.5 API Endpoint Table
#
# All paths are absolute (api_prefix is "/", i.e. flat root-level collections).
# `input:` lists body fields for writes and query parameters for reads; a
# trailing `?` marks the field optional. Every list read additionally accepts
# `limit?` and `offset?` with the envelope defaults from §1.0.
# =============================================================================
endpoints:

  # --- Logical clock (test-driving endpoint, priority-3 escape hatch) --------
  - method: POST
    path: /_clock/set_current_utc
    description: "Sets the server's logical UTC clock. Every temporal rule (recency, cooling-off, certification, due dates, no-show grace) reads this clock rather than wall time."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: [current_utc]
    output: "{ current_utc: datetime }"
    success: 200
    side_effects:
      - "no entity is mutated; subsequent requests evaluate temporal rules against the new clock"
    notes: "Default clock value before any call: 2026-08-01T00:00:00Z."

  # --- Program --------------------------------------------------------------
  - method: POST
    path: /programs
    description: "Creates a win-loss program in DRAFT."
    roles: [ProgramAdmin]
    input: [name, fiscal_quarter, incentive_budget_usd, interview_incentive_cap_usd, min_deal_value_usd, "required_question_keys?", "max_open_interviews_per_analyst?", "independence_mode?"]
    output: Program
    success: 201
    side_effects:
      - "status = DRAFT; posture = OPEN; guide_version = 1; ledger fields = 0.00; version = 1"

  - method: GET
    path: /programs/{program_id}
    description: "Reads one program including its incentive ledger and derived posture."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: Program
    success: 200
    side_effects: []

  - method: POST
    path: /programs/{program_id}/activate
    description: "DRAFT -> ACTIVE."
    roles: [ProgramAdmin]
    input: []
    output: Program
    success: 200
    side_effects:
      - "recomputes posture; increments version"

  - method: POST
    path: /programs/{program_id}/begin-closing
    description: "ACTIVE -> CLOSING; closes every non-closed sampling frame."
    roles: [ProgramAdmin]
    input: []
    output: Program
    success: 200
    side_effects:
