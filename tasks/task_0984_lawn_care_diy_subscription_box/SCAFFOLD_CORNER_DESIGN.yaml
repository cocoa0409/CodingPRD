# =============================================================================
# Task 984 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide taxonomy. Instances already
# exercised by §1.8 appear as excluded_because stubs citing the difficulty
# instance name.
# =============================================================================

scaffold_corner_design:
  # =========================================================== section 1 =====
  - section: entities
    instances:
      - name: customer_register_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Customer, "endpoints[POST /api/customers/register]"]
        distinguishing_aspect: "Registration with no referred_by_code creates an ACTIVE customer with credit_balance_cents 0, a server-minted referral_code, version 1, and a bare-UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers/register"
              payload: { email: "c1@x.com", full_name: "C One", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id, c_status: $.data.status, c_bal: $.data.credit_balance_cents, c_code: $.data.referral_code, c_v: $.data.version }
          assert:
            - "${c_status} == ACTIVE and ${c_bal} == 0 and ${c_v} == 1"
            - "${c_code} is non-null and unique-looking (server-minted)"
            - "${c_id} is a bare UUID with no type prefix"
            - "response envelope has meta.api_request_id and response_type == object"

      - name: customer_register_duplicate_email_rejected
        claim_type: type_constraints
        grounds: [entities.Customer.fields.email, "errors[ERR_EMAIL_TAKEN]"]
        distinguishing_aspect: "Email uniqueness is case-insensitive: a second registration with the same address fails with ERR_EMAIL_TAKEN and the error envelope carries data.error_id + data.message + response_type error."
        test_recipe:
          setup: ["one registered customer c1@x.com"]
          setup_api_calls:
            - call: "POST /api/customers/register"
              payload: { email: "c1@x.com", full_name: "C One", climate_zone: COOL }
              as: Anonymous
          trigger:
            - call: "POST /api/customers/register"
              payload: { email: "c1@x.com", full_name: "C Uno", climate_zone: WARM }
              as: Anonymous
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "${err} == ERR_EMAIL_TAKEN (409)"
            - "error envelope: response_type == error, ${msg} non-empty"

      - name: lawn_create_and_reverse_lookup
        claim_type: parent_relationships
        grounds: [entities.LawnProfile.fields.customer_id, "endpoints[GET /api/lawns]"]
        distinguishing_aspect: "A lawn created with customer_id is discoverable via the filtered list GET /api/lawns?customer_id= (FK reverse-reachability)."
        test_recipe:
          setup: ["one ACTIVE customer"]
          setup_api_calls:
            - call: "POST /api/customers/register"
              payload: { email: "c2@x.com", full_name: "C Two", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id }
            - call: "GET /api/lawns"
              payload: { customer_id: "${c_id}" }
              as: PlatformAdmin
          assert:
            - "POST returns 201 with the stored fields echoed"
            - "GET /api/lawns?customer_id=${c_id} returns exactly 1 row whose id == ${l_id}"

      - name: not_found_sweep_core
        claim_type: not_found
        grounds: ["errors[ERR_CUSTOMER_NOT_FOUND]", "errors[ERR_LAWN_NOT_FOUND]", "errors[ERR_PLAN_NOT_FOUND]", "errors[ERR_SOIL_TEST_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID returns the resource-specific 404 error id for Customer, LawnProfile, PlanVersion, SoilTestKit."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/customers/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /api/lawns/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /api/plans/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /api/soil-tests/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
          assert:
            - "${e1} == ERR_CUSTOMER_NOT_FOUND"
            - "${e2} == ERR_LAWN_NOT_FOUND"
            - "${e3} == ERR_PLAN_NOT_FOUND"
            - "${e4} == ERR_SOIL_TEST_NOT_FOUND"

      - name: not_found_sweep_commerce
        claim_type: not_found
        grounds: ["errors[ERR_SUBSCRIPTION_NOT_FOUND]", "errors[ERR_SHIPMENT_NOT_FOUND]", "errors[ERR_INVOICE_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID returns the resource-specific 404 error id for Subscription, ShipmentBox, Invoice."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/subscriptions/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /api/shipments/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /api/invoices/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_SUBSCRIPTION_NOT_FOUND"
            - "${e2} == ERR_SHIPMENT_NOT_FOUND"
            - "${e3} == ERR_INVOICE_NOT_FOUND"

      - name: not_found_sweep_engagement
        claim_type: not_found
        grounds: ["errors[ERR_APPLICATION_NOT_FOUND]", "errors[ERR_ADD_ON_NOT_FOUND]", "errors[ERR_CLAIM_NOT_FOUND]", "errors[ERR_REFERRAL_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID returns the resource-specific 404 error id for ApplicationTask, AddOnOrder, SatisfactionClaim, Referral."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/applications/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /api/add-ons/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /api/claims/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /api/referrals/11111111-1111-1111-1111-111111111111"
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
          assert:
            - "${e1} == ERR_APPLICATION_NOT_FOUND"
            - "${e2} == ERR_ADD_ON_NOT_FOUND"
            - "${e3} == ERR_CLAIM_NOT_FOUND"
            - "${e4} == ERR_REFERRAL_NOT_FOUND"

      - name: plan_provisional_value_input_ignored
        claim_type: computed_fields
        grounds: [entities.PlanVersion.fields.provisional_value_cents]
        distinguishing_aspect: "A client-supplied provisional_value_cents in the create body is ignored; the response carries the server-computed 1200."
        test_recipe:
          setup:
            - "Catalog FERT-01 (list 1200); customer with lawn and ANALYZED soil test"
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "FERT-01", name: "Fertilizer", category: FERTILIZER, list_price_cents: 1200, tier_t1_cents: 800, tier_t2_cents: 700, tier_t3_cents: 600, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [WEED], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/customers/register"
              payload: { email: "c3@x.com", full_name: "C Three", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.5, nitrogen_ppm: 20, phosphorus_ppm: 15, potassium_ppm: 80, organic_matter_pct: 3.1 }
              as: Agronomist
          trigger:
            - call: "POST /api/plans"
              payload: { lawn_id: "${l_id}", soil_test_id: "${st_id}", season_year: 2026, plan_lines: [ { product_sku: "FERT-01", qty_units: 1, target_month: 4 } ], provisional_value_cents: 9999 }
              as: Agronomist
              captures: { prov: $.data.provisional_value_cents }
          assert:
            - "${prov} == 1200 (1 x list 1200), not the client-supplied 9999"

      - name: credit_ledger_entry_immutability
        claim_type: immutability
        grounds: [entities.CreditLedgerEntry]
        distinguishing_aspect: "CreditLedgerEntry is common_fields:false — the read model exposes id and created_at but no version and no updated_at, and no PATCH/DELETE endpoint exists in §1.5."
        test_recipe:
          setup: ["one customer with one ADJUSTMENT entry"]
          setup_api_calls:
            - call: "POST /api/customers/register"
              payload: { email: "c4@x.com", full_name: "C Four", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/credit-ledger/adjustments"
              payload: { customer_id: "${c_id}", amount_cents: 250, note: "promo" }
              as: PlatformAdmin
              captures: { e_id: $.data.id }
          trigger:
            - call: "GET /api/credit-ledger/${e_id}"
              as: PlatformAdmin
          assert:
            - "response contains id, created_at, entry_type ADJUSTMENT, amount_cents 250, reference_id null"
            - "response contains no version field and no updated_at field"

      - name: weather_advisory_upsert_replaces
        claim_type: creation
        grounds: [entities.WeatherAdvisory, "endpoints[POST /api/weather-advisories]"]
        distinguishing_aspect: "Posting an advisory for an existing (region, date) replaces the values instead of creating a second row."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/weather-advisories"
              payload: { region: "NE-OH", date: "2026-06-10", rain_probability: 0.10, wind_kph: 5, temp_high_c: 22 }
              as: PlatformAdmin
            - call: "POST /api/weather-advisories"
              payload: { region: "NE-OH", date: "2026-06-10", rain_probability: 0.90, wind_kph: 30, temp_high_c: 22 }
              as: PlatformAdmin
            - call: "GET /api/weather-advisories"
              payload: { region: "NE-OH", date: "2026-06-10" }
              as: PlatformAdmin
          assert:
            - "exactly 1 advisory exists for (NE-OH, 2026-06-10)"
            - "its rain_probability == 0.90 and wind_kph == 30 (second write wins)"

      - name: soil_test_initial_state
        claim_type: initial_state
        grounds: [state_machines.SoilTestKit]
        distinguishing_aspect: "A newly ordered soil test starts in KIT_SHIPPED with reship_count 0 and null lab fields."
        test_recipe:
          setup: ["customer with an ACTIVE lawn"]
          setup_api_calls:
            - call: "POST /api/customers/register"
              payload: { email: "c5@x.com", full_name: "C Five", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st: $.data.status, rc: $.data.reship_count }
          assert:
            - "${st} == KIT_SHIPPED and ${rc} == 0"

      - name: lawn_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /api/lawns]"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["one customer with two lawns"]
          setup_api_calls:
            - call: "POST /api/customers/register"
              payload: { email: "c6@x.com", full_name: "C Six", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Back", lawn_size_sqm: 200, grass_type: MIXED, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "GET /api/lawns"
              payload: { customer_id: "${c_id}", limit: 1, offset: 0 }
              as: PlatformAdmin
            - call: "GET /api/lawns"
              payload: { customer_id: "${c_id}", limit: 1, offset: 1 }
              as: PlatformAdmin
          assert:
            - "page 1: exactly 1 row, total_count == 2, has_more == true, response_type == array"
            - "page 2: exactly 1 row, total_count == 2, has_more == false, and the two pages contain different lawn ids"

  # =========================================================== section 2 =====
  - section: state_machines
    instances:
      - name: soil_resample_cycle
        claim_type: valid_transition
        grounds: [state_machines.SoilTestKit.SAMPLE_RETURNED_to_KIT_SHIPPED]
        distinguishing_aspect: "REJECTED lab result cycles the kit back to KIT_SHIPPED with reship_count incremented; the sample can then be returned and analyzed on the second pass."
        test_recipe:
          setup: ["customer with lawn and a soil test kit"]
          setup_api_calls:
            - call: "POST /api/customers/register"
              payload: { email: "s1@x.com", full_name: "S One", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: REJECTED, rejection_reason: "insufficient mass" }
              as: Agronomist
              captures: { s1: $.data.status, rc1: $.data.reship_count }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.4, nitrogen_ppm: 22, phosphorus_ppm: 14, potassium_ppm: 75, organic_matter_pct: 2.9 }
              as: Agronomist
              captures: { s2: $.data.status }
          assert:
            - "after rejection: ${s1} == KIT_SHIPPED and ${rc1} == 1 (cycle, not terminal)"
            - "second pass analyzes cleanly: ${s2} == ANALYZED"

      - name: soil_lab_result_requires_returned
        claim_type: invalid_transition
        grounds: [state_machines.SoilTestKit, "errors[ERR_SOIL_TEST_NOT_RETURNED]"]
        distinguishing_aspect: "lab-result on a KIT_SHIPPED kit (sample never returned) is rejected with ERR_SOIL_TEST_NOT_RETURNED."
        test_recipe:
          setup: ["customer with lawn and a fresh KIT_SHIPPED soil test"]
          setup_api_calls:
            - call: "POST /api/customers/register"
              payload: { email: "s2@x.com", full_name: "S Two", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.4, nitrogen_ppm: 22, phosphorus_ppm: 14, potassium_ppm: 75, organic_matter_pct: 2.9 }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SOIL_TEST_NOT_RETURNED (409)"

      - name: soil_return_sample_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.SoilTestKit.KIT_SHIPPED_to_SAMPLE_RETURNED, "errors[ERR_SOIL_TEST_NOT_SHIPPED]"]
        distinguishing_aspect: "Repeating return-sample after it already succeeded fails with ERR_SOIL_TEST_NOT_SHIPPED — the trigger is not idempotent."
        test_recipe:
          setup: ["soil test already SAMPLE_RETURNED"]
          setup_api_calls:
            - call: "POST /api/customers/register"
              payload: { email: "s3@x.com", full_name: "S Three", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SOIL_TEST_NOT_SHIPPED (409)"

      - name: plan_revision_cycle
        claim_type: valid_transition
        grounds: [state_machines.PlanVersion.PENDING_REVIEW_to_DRAFT]
        distinguishing_aspect: "Editing a PENDING_REVIEW plan cycles it back to DRAFT and recomputes provisional_value_cents from the new lines (2400 after doubling the FERT-01 quantity)."
        test_recipe:
          setup: ["PENDING_REVIEW plan with lines FERT-01 x1 (provisional 1200)"]
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "FERT-01", name: "Fertilizer", category: FERTILIZER, list_price_cents: 1200, tier_t1_cents: 800, tier_t2_cents: 700, tier_t3_cents: 600, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [WEED], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/customers/register"
              payload: { email: "s4@x.com", full_name: "S Four", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.5, nitrogen_ppm: 20, phosphorus_ppm: 15, potassium_ppm: 80, organic_matter_pct: 3.1 }
              as: Agronomist
            - call: "POST /api/plans"
              payload: { lawn_id: "${l_id}", soil_test_id: "${st_id}", season_year: 2026, plan_lines: [ { product_sku: "FERT-01", qty_units: 1, target_month: 4 } ] }
              as: Agronomist
              captures: { p_id: $.data.id }
            - call: "POST /api/plans/${p_id}/submit-review"
              as: Agronomist
          trigger:
            - call: "PATCH /api/plans/${p_id}"
              payload: { plan_lines: [ { product_sku: "FERT-01", qty_units: 2, target_month: 4 } ] }
              as: Agronomist
              captures: { st: $.data.status, prov: $.data.provisional_value_cents }
          assert:
            - "${st} == DRAFT (PENDING_REVIEW -> DRAFT revision cycle)"
            - "${prov} == 2400 (recomputed from 2 x 1200)"

      - name: plan_activate_from_draft_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PlanVersion.PENDING_REVIEW_to_ACTIVE, "errors[ERR_PLAN_NOT_ACTIVATABLE]"]
        distinguishing_aspect: "Activating a DRAFT plan (never submitted for review) fails with ERR_PLAN_NOT_ACTIVATABLE even with a correct expected_lawn_version."
        test_recipe:
          setup: ["DRAFT plan on an analyzed lawn"]
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "FERT-01", name: "Fertilizer", category: FERTILIZER, list_price_cents: 1200, tier_t1_cents: 800, tier_t2_cents: 700, tier_t3_cents: 600, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [WEED], min_gap_days: 14 }
              as: PlatformAdmin
            - call: "POST /api/customers/register"
              payload: { email: "s5@x.com", full_name: "S Five", climate_zone: COOL }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /api/lawns"
              payload: { customer_id: "${c_id}", label: "Front", lawn_size_sqm: 100, grass_type: COOL_SEASON, region: "NE-OH" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /api/soil-tests"
              payload: { lawn_id: "${l_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { st_id: $.data.id }
            - call: "POST /api/soil-tests/${st_id}/return-sample"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /api/soil-tests/${st_id}/lab-result"
              payload: { outcome: ANALYZED, ph: 6.5, nitrogen_ppm: 20, phosphorus_ppm: 15, potassium_ppm: 80, organic_matter_pct: 3.1 }
              as: Agronomist
            - call: "POST /api/plans"
