      - name: snapshot_plan_mismatch_on_analysis
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_SNAPSHOT_PLAN_MISMATCH]
        distinguishing_aspect: "A retirement analysis whose plan_id differs from the plan owning the snapshot's portfolio fails ERR_SNAPSHOT_PLAN_MISMATCH (422) — the FK target exists, so it is a referential mismatch, not a 404."
        test_recipe:
          setup: ["Clock 2026-09-01. Plans P1 and P2 DRAFT; P1 has portfolio PF1 with a 2031 snapshot; COAL unit R decided under P1 retiring 2031."]
