              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i1_v3: $.data.version }
          assert:
            - "call 1: HTTP 200 with status ASSIGNED, assigned_investigator_officer_id == ${inv_a_id}, assignment_count == 1, ${i1_v1} == ${i1_v0} plus 1, and Officer Ahn open_case_load == 1"
            - "call 2: HTTP 412 with ${e_stale} == ERR_STALE_INVESTIGATION_VERSION; assigned_investigator_officer_id is still ${inv_a_id}, assignment_count is still 1, Officer Briggs open_case_load is still 0 and the version is still ${i1_v1}, so the refused write moved neither the assignment nor the ledger"
            - "call 3: ${i1_v2} equals ${i1_v1}, confirming the refused write did not consume a version"
            - "call 4: HTTP 200 with assigned_investigator_officer_id == ${inv_b_id}, assignment_count == 2, ${i1_v3} == ${i1_v2} plus 1, Officer Ahn open_case_load back to 0 and Officer Briggs open_case_load == 1, so the global caseload total is conserved at 1"

      - name: plan_create_rejects_a_stale_alert_version
