              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SM", full_name: "Stu M", email: "sm@x.edu" }
              as: RegistrarClerk
              captures: { sm: $.data.id }
            - call: "POST /r2t4/students/${sm}/enrollments"
