          assert:
            - "cand_status_expired == EXPIRED (clock 2028-12-15 > renewal_due_at 2028-09-01)"
            - "cand_status_reset == CANDIDATE"
            - "cand_status_monitored == MONITORED (second pass through the pathway)"
            - "cand_status_recertified == CERTIFIED — prior teaching evaluations persist across the reset, so the >= 2 evaluations / avg 4.50 gate still passes"
            - "cand_renewal_due == \"2030-12-15T00:00:00Z\" (clock + 24 months)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: guidelines_activation_cancels_legacy_sessions
        grounds:
          - state_machines.GuidelinesVersion.DRAFT_to_ACTIVE
          - state_machines.GuidelinesVersion.ACTIVE_to_SUPERSEDED
          - calculations.guidelines_transition_sweep
          - state_machines.CourseSession.SCHEDULED_to_CANCELLED
          - state_machines.RosterEntry.ENROLLED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain caused link-by-link: activating G2030 supersedes G2025
          (hop 1); the supersession sweeps SCHEDULED sessions on G2025 whose
          start_at exceeds the new transition deadline to CANCELLED (hop 2);
          each cancellation cancels its ENROLLED roster entries (hop 3) and
          recomputes seats_available back to capacity (hop 4) — while a
          session at exactly-or-before the deadline survives as LEGACY.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain with ACTIVE G2025 (transition_deadline_at of the incoming version will be 2027-03-01). Session S1 starts 2027-04-01 (past the incoming deadline) with roster entry E1; session S2 starts 2027-02-01 (before it) with roster entry E2; both capacity 6, SCHEDULED."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2027-04-01T14:00:00Z", end_at: "2027-04-01T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { s1_id: $.data.id }
            - call: "POST /aha/course-sessions/${s1_id}/roster"
              payload: { student_name: "Sam Student", student_email: "sam@x.example" }
              as: TCCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2027-02-01T14:00:00Z", end_at: "2027-02-01T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { s2_id: $.data.id }
            - call: "POST /aha/course-sessions/${s2_id}/roster"
              payload: { student_name: "Rita Rescuer", student_email: "rita@x.example" }
              as: TCCoordinator
              captures: { e2_id: $.data.id }
            - call: "POST /aha/guidelines-versions"
              payload: { code: "G2030", title: "2030 AHA Guidelines", published_at: "2030-10-01T00:00:00Z", transition_deadline_at: "2027-03-01T00:00:00Z" }
              as: NationalAdmin
              captures: { gv2030_id: $.data.id }
          trigger:
            - call: "POST /aha/guidelines-versions/${gv2030_id}/activate"
              payload: {}
              as: NationalAdmin
              captures: { gv2030_status: $.data.status }
            - call: "GET /aha/guidelines-versions/${gv_id}"
              payload: {}
              as: NationalAdmin
              captures: { gv2025_status: $.data.status }
            - call: "GET /aha/course-sessions/${s1_id}"
              payload: {}
              as: TCCoordinator
              captures: { s1_status: $.data.status, s1_reason: $.data.cancel_reason, s1_seats: $.data.seats_available }
            - call: "GET /aha/course-sessions/${s2_id}"
              payload: {}
              as: TCCoordinator
              captures: { s2_status: $.data.status, s2_flag: $.data.curriculum_flag }
            - call: "GET /aha/roster-entries/${e1_id}"
              payload: {}
              as: TCCoordinator
              captures: { e1_status: $.data.status }
            - call: "GET /aha/roster-entries/${e2_id}"
              payload: {}
              as: TCCoordinator
              captures: { e2_status: $.data.status }
          assert:
            - "gv2030_status == ACTIVE and gv2025_status == SUPERSEDED"
            - "s1_status == CANCELLED and s1_reason == GUIDELINES_TRANSITION (start_at 2027-04-01 > deadline 2027-03-01)"
            - "e1_status == CANCELLED"
            - "s1_seats == 6 (seat released by the cascade)"
            - "s2_status == SCHEDULED and s2_flag == LEGACY (start_at 2027-02-01 <= deadline)"
            - "e2_status == ENROLLED"

      - name: critical_finding_suspends_center_cascade
        grounds:
          - state_machines.TrainingCenter.ACTIVE_to_SUSPENDED
          - state_machines.TrainingSite.ALIGNED_to_SUSPENDED
          - state_machines.CourseSession.SCHEDULED_to_CANCELLED
          - state_machines.RosterEntry.ENROLLED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain from a different trigger than the guidelines cascade:
          a CRITICAL AuditFinding suspends the center (hop 1); the center
          suspension suspends its ALIGNED site (hop 2); the site suspension
          cancels its SCHEDULED session (hop 3); the session cancellation
          cancels its ENROLLED roster entry and restores the seat (hop 4).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain; one SCHEDULED session (capacity 6) at the ALIGNED site with one ENROLLED roster entry; an OPEN audit exists against the center."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
            - *session
            - *roster_a
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { center_v_now: $.data.version }
            - call: "POST /aha/quality-audits"
              payload: { target_training_center_id: "${center_id}", expected_training_center_version: "${center_v_now}" }
              as: QAAuditor
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /aha/quality-audits/${audit_id}/findings"
              payload: { severity: "CRITICAL", description: "Cards issued without skills testing records." }
              as: QAAuditor
              captures: { finding_deduction: $.data.deduction_points }
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { center_status: $.data.status }
            - call: "GET /aha/training-sites/${site_id}"
              payload: {}
              as: QAAuditor
              captures: { site_status: $.data.status }
            - call: "GET /aha/course-sessions/${session_id}"
              payload: {}
              as: TCCoordinator
              captures: { sess_status: $.data.status, sess_reason: $.data.cancel_reason, sess_seats: $.data.seats_available }
            - call: "GET /aha/roster-entries/${entry_a_id}"
              payload: {}
              as: TCCoordinator
              captures: { entry_status: $.data.status }
          assert:
            - "finding_deduction == 40"
            - "center_status == SUSPENDED"
            - "site_status == SUSPENDED"
            - "sess_status == CANCELLED and sess_reason == CENTER_SUSPENDED"
            - "entry_status == CANCELLED"
            - "sess_seats == 6"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_on_session_complete
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_SESSION_NOT_IN_PROGRESS
          - errors.ERR_CENTER_ON_PROBATION
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): a complete call on a
          CANCELLED session whose center is also on PROBATION fails
          both priority 4 (ERR_SESSION_NOT_IN_PROGRESS) and priority 5
          (ERR_CENTER_ON_PROBATION); the state error must win.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain; session started then manually cancelled (IN_PROGRESS -> CANCELLED); center then driven to PROBATION via a corrective-action audit close."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
            - *session
            - *roster_a
            - *session_start
            - call: "POST /aha/course-sessions/${session_id}/cancel"
              payload: {}
              as: TCCoordinator
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: QAAuditor
              captures: { center_v_now: $.data.version }
            - call: "POST /aha/quality-audits"
              payload: { target_training_center_id: "${center_id}", expected_training_center_version: "${center_v_now}" }
              as: QAAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /aha/quality-audits/${audit_id}/close"
              payload: { outcome: "CORRECTIVE_ACTION" }
              as: QAAuditor
          trigger:
            - call: "POST /aha/course-sessions/${session_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${cand_id}"
              captures: { err_complete: $.data.error_id }
          assert:
            - "the trigger returns 409 and err_complete == ERR_SESSION_NOT_IN_PROGRESS"
            - "err_complete != ERR_CENTER_ON_PROBATION"
            - "TrainingCenter.${center_id}.status == PROBATION (unchanged by the failed call)"

      - name: business_safety_vs_business_referential_on_session_create
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_SITE_SUSPENDED
          - errors.ERR_INSTRUCTOR_NOT_ALIGNED
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_referential): a
          session create whose site is SUSPENDED and whose primary instructor
          holds no ACTIVE alignment to the center fails both priority 5
          (ERR_SITE_SUSPENDED) and priority 8 (ERR_INSTRUCTOR_NOT_ALIGNED);
          the safety error must win.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain through certification, but NO alignment is created for the candidate; the site is then suspended."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - call: "POST /aha/training-sites/${site_id}/suspend"
              payload: {}
              as: TCAdmin
          trigger:
            - call: "POST /aha/course-sessions"
              payload: { training_center_id: "${center_id}", site_id: "${site_id}", primary_instructor_id: "${cand_id}", guidelines_version_id: "${gv_id}", course_type: "BLS_PROVIDER", delivery_format: "CLASSROOM", start_at: "2026-10-10T14:00:00Z", end_at: "2026-10-10T18:00:00Z", capacity: 6, manikin_count: 2, aed_trainer_count: 1, assisting_instructor_count: 0 }
              as: TCCoordinator
              captures: { err_create: $.data.error_id }
          assert:
            - "the trigger returns 409 and err_create == ERR_SITE_SUSPENDED"
            - "err_create != ERR_INSTRUCTOR_NOT_ALIGNED"
            - "GET /aha/training-centers/${center_id}/course-sessions returns 0 rows"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: skills_score_exactly_84_passes
        grounds:
          - calculations.skills_evaluation_scoring
          - entities.SkillsEvaluation.fields.score_percent
        distinguishing_aspect: |
          Metric: score_percent threshold. 21/25 passed items lands exactly on
          the 84.00 boundary and PASSES (>= semantics), while 20/24 rounds to
          83.33 and returns REMEDIATION_REQUIRED — one point of rounding below
          the line flips the outcome on the skills-evaluations endpoint.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain; session started with two ENROLLED roster entries."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
            - *site_align
            - *center_activate
            - *gv
            - *gv_activate
            - *cand
            - *cand_monitor
            - *cand_eval1
            - *cand_eval2
            - *cand_certify
            - *cand_alignment
            - *session
            - *roster_a
            - *roster_b
            - *session_start
          trigger:
            - call: "POST /aha/roster-entries/${entry_a_id}/skills-evaluations"
              payload: { items: [{ item_code: "I01", critical: true, passed: true }, { item_code: "I02", critical: false, passed: true }, { item_code: "I03", critical: false, passed: true }, { item_code: "I04", critical: false, passed: true }, { item_code: "I05", critical: false, passed: true }, { item_code: "I06", critical: false, passed: true }, { item_code: "I07", critical: false, passed: true }, { item_code: "I08", critical: false, passed: true }, { item_code: "I09", critical: false, passed: true }, { item_code: "I10", critical: false, passed: true }, { item_code: "I11", critical: false, passed: true }, { item_code: "I12", critical: false, passed: true }, { item_code: "I13", critical: false, passed: true }, { item_code: "I14", critical: false, passed: true }, { item_code: "I15", critical: false, passed: true }, { item_code: "I16", critical: false, passed: true }, { item_code: "I17", critical: false, passed: true }, { item_code: "I18", critical: false, passed: true }, { item_code: "I19", critical: false, passed: true }, { item_code: "I20", critical: false, passed: true }, { item_code: "I21", critical: false, passed: true }, { item_code: "I22", critical: false, passed: false }, { item_code: "I23", critical: false, passed: false }, { item_code: "I24", critical: false, passed: false }, { item_code: "I25", critical: false, passed: false }] }
              as: Instructor
              as_user_id: "${cand_id}"
              captures: { score_84: $.data.score_percent, outcome_84: $.data.outcome }
            - call: "POST /aha/roster-entries/${entry_b_id}/skills-evaluations"
              payload: { items: [{ item_code: "I01", critical: true, passed: true }, { item_code: "I02", critical: false, passed: true }, { item_code: "I03", critical: false, passed: true }, { item_code: "I04", critical: false, passed: true }, { item_code: "I05", critical: false, passed: true }, { item_code: "I06", critical: false, passed: true }, { item_code: "I07", critical: false, passed: true }, { item_code: "I08", critical: false, passed: true }, { item_code: "I09", critical: false, passed: true }, { item_code: "I10", critical: false, passed: true }, { item_code: "I11", critical: false, passed: true }, { item_code: "I12", critical: false, passed: true }, { item_code: "I13", critical: false, passed: true }, { item_code: "I14", critical: false, passed: true }, { item_code: "I15", critical: false, passed: true }, { item_code: "I16", critical: false, passed: true }, { item_code: "I17", critical: false, passed: true }, { item_code: "I18", critical: false, passed: true }, { item_code: "I19", critical: false, passed: true }, { item_code: "I20", critical: false, passed: true }, { item_code: "I21", critical: false, passed: false }, { item_code: "I22", critical: false, passed: false }, { item_code: "I23", critical: false, passed: false }, { item_code: "I24", critical: false, passed: false }] }
              as: Instructor
              as_user_id: "${cand_id}"
              captures: { score_83: $.data.score_percent, outcome_83: $.data.outcome }
          assert:
            - "score_84 == 84.0 and outcome_84 == PASS (boundary is inclusive)"
            - "RosterEntry.${entry_a_id}.status == PASSED"
            - "score_83 == 83.33 and outcome_83 == REMEDIATION_REQUIRED"
            - "RosterEntry.${entry_b_id}.status == ENROLLED and remediation_used == true"

      - name: certify_exactly_two_evaluations_at_avg_4
        grounds:
          - calculations.certification_evaluation_average
          - errors.ERR_INSUFFICIENT_TEACHING_EVALUATIONS
          - errors.ERR_EVALUATION_AVERAGE_BELOW_THRESHOLD
        distinguishing_aspect: |
          Metric: evaluation count floor and average threshold on the certify
          endpoint (distinct from the score_percent metric). Exactly 1
          evaluation fails the count check even at score 5; adding a second
          evaluation of 3 lands the average exactly on 4.00 and certification
          succeeds (>= semantics).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Base chain through a MONITORED candidate with exactly one teaching evaluation (score 5)."
          setup_api_calls:
            - *clock
            - *center
            - *faculty
            - *grant_faculty
            - *faculty_alignment
            - *center_v
            - *site
