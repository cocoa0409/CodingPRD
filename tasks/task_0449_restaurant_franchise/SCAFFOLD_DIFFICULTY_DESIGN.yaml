# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Restaurant Franchise Management & Royalty — Expert tier
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: late_fee_simple_vs_compound_on_royalty_statement
        grounds:
          - calculations.late_fee
          - state_machines.RoyaltyStatement.ISSUED_to_OVERDUE
          - state_machines.RoyaltyStatement.OVERDUE_to_WRITTEN_OFF
          - entities.RoyaltyStatement.fields.late_fee_cents
        distinguishing_aspect: |
          Identical principal (840000) and months_late (3) yield late_fee_cents=37800 under the SIMPLE
          provisional variant (linear) but 38370 under the COMPOUND final variant — a 570-cent divergence
          on the RoyaltyStatement domain.
        test_recipe:
          setup:
            - "Brand with default rates; franchisee APPROVED→ACTIVE with one OPEN unit holding an ASSIGNED territory."
            - "One ACCEPTED SalesReport for period 0 with net_sales_cents=11500000 (gross 12000000, discounts 500000)."
            - "RoyaltyStatement for period 0 ISSUED (royalty_cents=610000, ad_fund_cents=230000, total_due_cents=840000, due_period_index=1)."
            - "Brand advanced via close-period until current_period_index=4 (months_late = 4 - 1 = 3); statement became OVERDUE on the first advance, late_fee_cents recomputed as SIMPLE each advance."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Burgers" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T1", name: "North" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ One", owner_user_id: "u_fz1" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "1 Main St" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz1"
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 12000000, discounts_cents: 500000 }
              as: Franchisor
              captures: { sr_id: $.data.id }
            - call: "POST /franchise/sales-reports/${sr_id}/accept"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/royalty-statements"
              payload: { unit_id: "${unit_id}", period_index: 0 }
              as: FinanceClerk
              captures: { rs_id: $.data.id }
            - call: "POST /franchise/royalty-statements/${rs_id}/issue"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
              captures: { brand_v: $.data.version }
          trigger:
            - call: "POST /franchise/royalty-statements/${rs_id}/write-off"
              payload: { expected_brand_version: "${brand_v}" }
              as: FinanceClerk
              captures: { final_late: $.data.late_fee_cents }
          assert:
            - "RoyaltyStatement.${rs_id}.late_fee_cents == 38370   # COMPOUND final variant"
            - "RoyaltyStatement.${rs_id}.late_fee_cents != 37800   # would be the SIMPLE provisional value"
            - "RoyaltyStatement.${rs_id}.status == WRITTEN_OFF"
            - "RoyaltyStatement.${rs_id}.total_due_cents == 878370   # 840000 + 38370"

      - name: rebate_floor_remainder_vs_naive_half_up_on_national_account
        grounds:
          - calculations.rebate_distribution
          - state_machines.RoyaltyStatement.OVERDUE_to_WRITTEN_OFF
          - concurrency_rules[rebate-distribute-stale-brand]
          - entities.VendorAuthorization.fields.qualifying_purchase_cents
        distinguishing_aspect: |
          With pool 5000000 and qualifying purchases A=3000000, B=2000000, C=1500000, the pinned
          floor-then-remainder allocation gives A=2307693, B=1538461 whereas naive independent
          round-half-up gives A=2307692, B=1538462 — a per-unit divergence on the NationalAccount
          rebate domain (distinct from the RoyaltyStatement late-fee dual variant).
        test_recipe:
          setup:
            - "Brand; an APPROVED vendor; an OPEN unit per franchisee region; three ACTIVE VendorAuthorizations for that vendor with qualifying_purchase_cents 3000000, 2000000, 1500000 (created in that order)."
            - "NationalAccount funded by the vendor with rebate_pool_cents=5000000, min_qualifying_cents=1000000, status OPEN."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Tacos" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/vendors"
              payload: { brand_id: "${brand_id}", name: "Acme Foods", category: "FOOD" }
              as: ComplianceAuditor
              captures: { vendor_id: $.data.id }
            - call: "POST /franchise/vendors/${vendor_id}/approve"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "TA", name: "A" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U-A" }
              as: Franchisor
              captures: { unit_a: $.data.id }
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U-B" }
              as: Franchisor
              captures: { unit_b: $.data.id }
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U-C" }
              as: Franchisor
              captures: { unit_c: $.data.id }
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_a}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 3000000 }
              as: Franchisor
              captures: { auth_a: $.data.id }
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_b}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 2000000 }
              as: Franchisor
              captures: { auth_b: $.data.id }
            - call: "POST /franchise/vendor-authorizations"
              payload: { unit_id: "${unit_c}", vendor_id: "${vendor_id}", qualifying_purchase_cents: 1500000 }
              as: Franchisor
              captures: { auth_c: $.data.id }
            - call: "POST /franchise/national-accounts"
              payload: { brand_id: "${brand_id}", vendor_id: "${vendor_id}", name: "Q1 Rebate", rebate_pool_cents: 5000000, min_qualifying_cents: 1000000 }
              as: FinanceClerk
              captures: { na_id: $.data.id }
            - call: "GET /franchise/brands/${brand_id}"
              payload: {}
              as: FinanceClerk
              captures: { brand_v: $.data.version }
          trigger:
            - call: "POST /franchise/national-accounts/${na_id}/distribute"
              payload: { expected_brand_version: "${brand_v}" }
              as: FinanceClerk
          assert:
            - "NationalAccount.${na_id}.status == DISTRIBUTED"
            - "rebate share for VendorAuthorization ${auth_a} == 2307693   # floor 2307692 + 1 remainder cent (highest qpc)"
            - "rebate share for VendorAuthorization ${auth_b} == 1538461   # floor, no remainder"
            - "rebate share for VendorAuthorization ${auth_c} == 1153846"
            - "sum of the three shares == 5000000   # pool conserved; naive half-up would have given auth_a 2307692 / auth_b 1538462"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_royalty_marginal_three_band_nonlinear
        grounds:
          - calculations.royalty
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
          - entities.RoyaltyStatement.fields.royalty_cents
        distinguishing_aspect: |
          (mode a) Royalty has 3 inputs interacting non-linearly via marginal tier selection: a basis of
          11500000 splits as min(basis,5000000)*0.06 + (min(basis,10000000)-5000000)*0.05 +
          (basis-10000000)*0.04 = 300000+250000+60000 = 610000, NOT a single blended rate on 11500000.
        test_recipe:
          setup:
            - "Brand with default royalty tier rates (0.06/0.05/0.04); OPEN unit; one ACCEPTED SalesReport period 0 net_sales_cents=11500000; DRAFT RoyaltyStatement for period 0."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Pizza" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "P1", name: "P" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 11500000, discounts_cents: 0 }
              as: Franchisor
              captures: { sr_id: $.data.id }
            - call: "POST /franchise/sales-reports/${sr_id}/accept"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/royalty-statements"
              payload: { unit_id: "${unit_id}", period_index: 0 }
              as: FinanceClerk
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /franchise/royalty-statements/${rs_id}/issue"
              payload: {}
              as: FinanceClerk
          assert:
            - "RoyaltyStatement.${rs_id}.net_sales_basis_cents == 11500000"
            - "RoyaltyStatement.${rs_id}.royalty_cents == 610000   # marginal tiers, NOT 11500000*0.06=690000"
            - "RoyaltyStatement.${rs_id}.ad_fund_cents == 230000"
            - "RoyaltyStatement.${rs_id}.total_due_cents == 840000"

      - name: royalty_aggregate_basis_then_tier_vs_per_report_order
        grounds:
          - calculations.royalty
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
          - entities.SalesReport.fields.net_sales_cents
        distinguishing_aspect: |
          (mode b) Evaluation order matters: two ACCEPTED reports of net 4000000 each must be SUMMED to an
          8000000 basis THEN tiered (royalty 450000 = 5000000*0.06 + 3000000*0.05), NOT tiered per report
          and summed (which would give 480000 = 240000*2). The scaffold pins aggregate-basis-then-tier.
        test_recipe:
          setup:
            - "Brand default rates; OPEN unit; two ACCEPTED SalesReports for period 0 each net_sales_cents=4000000; DRAFT RoyaltyStatement for period 0."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Subs" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "S1", name: "S" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 4000000, discounts_cents: 0 }
              as: Franchisor
              captures: { sr1: $.data.id }
            - call: "POST /franchise/sales-reports/${sr1}/accept"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 4000000, discounts_cents: 0 }
              as: Franchisor
              captures: { sr2: $.data.id }
            - call: "POST /franchise/sales-reports/${sr2}/accept"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/royalty-statements"
              payload: { unit_id: "${unit_id}", period_index: 0 }
              as: FinanceClerk
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /franchise/royalty-statements/${rs_id}/issue"
              payload: {}
              as: FinanceClerk
          assert:
            - "RoyaltyStatement.${rs_id}.net_sales_basis_cents == 8000000"
            - "RoyaltyStatement.${rs_id}.royalty_cents == 450000   # aggregate-then-tier; per-report-then-sum would be 480000"
            - "RoyaltyStatement.${rs_id}.ad_fund_cents == 160000"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: unit_parallel_operational_and_compliance_dimensions
        grounds:
          - state_machines.Unit.PLANNED_to_OPEN
          - state_machines.Unit.GOOD_STANDING_to_SUSPENDED
          - entities.Unit.fields.operational_status
          - entities.Unit.fields.compliance_status
        distinguishing_aspect: |
          Unit carries two independent state axes on one row: a FAIL audit drives compliance_status
          GOOD_STANDING→SUSPENDED while operational_status stays OPEN — the two dimensions evolve
          independently (a parallel-dimension non-linear machine on the Unit entity).
        test_recipe:
          setup:
            - "Brand; OPEN unit (operational_status=OPEN, compliance_status=GOOD_STANDING); a SCHEDULED audit started to IN_PROGRESS."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Wings" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "W1", name: "W" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit_id}" }
              as: ComplianceAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /franchise/audits/${audit_id}/start"
              payload: {}
              as: ComplianceAuditor
          trigger:
            - call: "POST /franchise/audits/${audit_id}/finalize"
              payload: { food_safety_score: 50, cleanliness_score: 50, service_score: 50, brand_compliance_score: 50 }
              as: ComplianceAuditor
          assert:
            - "Unit.${unit_id}.compliance_status == SUSPENDED   # FAIL audit (overall 50.0 < 70) drives compliance axis"
            - "Unit.${unit_id}.operational_status == OPEN        # operational axis unchanged"
            - "BrandAudit.${audit_id}.grade == FAIL"

      - name: agreement_renewal_pending_branches_to_three_terminals
        grounds:
          - state_machines.FranchiseAgreement.RENEWAL_PENDING_to_RENEWED
          - state_machines.FranchiseAgreement.RENEWAL_PENDING_to_TRANSFERRED
          - state_machines.FranchiseAgreement.RENEWAL_PENDING_to_TERMINATED
          - entities.FranchiseAgreement.fields.successor_agreement_id
        distinguishing_aspect: |
          FranchiseAgreement RENEWAL_PENDING forks to three terminals with divergent side effects: RENEW
          creates a same-franchisee successor; this instance exercises the DECLINE-RENEWAL branch to
          TERMINATED whose side effect (release territories) differs from the RENEWED branch — a branching
          non-linear machine on a different entity than Unit.
        test_recipe:
          setup:
            - "Brand; APPROVED franchisee holding an ASSIGNED territory; an EXECUTED agreement whose renewal window is open (term_end_period_index=1, brand.current_period_index advanced to 1); begin-renewal applied so agreement is RENEWAL_PENDING."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Grill" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "G1", name: "G" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${fz_id}", fdd_version: "2026.1", term_end_period_index: 1 }
              as: Franchisor
              captures: { ag_id: $.data.id }
            - call: "POST /franchise/agreements/${ag_id}/execute"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/agreements/${ag_id}/begin-renewal"
              payload: {}
              as: Franchisor
          trigger:
            - call: "POST /franchise/agreements/${ag_id}/decline-renewal"
              payload: {}
              as: Franchisor
          assert:
            - "FranchiseAgreement.${ag_id}.status == TERMINATED"
            - "FranchiseAgreement.${ag_id}.successor_agreement_id == null   # decline creates no successor (unlike RENEW)"
            - "Territory.${terr_id}.status == AVAILABLE   # decline-renewal releases the held territory"
            - "Territory.${terr_id}.assigned_franchisee_id == null"

  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: audit_fail_suspends_unit_strikes_default_franchisee_depth3
        grounds:
          - state_machines.BrandAudit.IN_PROGRESS_to_FINALIZED
          - state_machines.Unit.GOOD_STANDING_to_SUSPENDED
          - state_machines.Franchisee.ACTIVE_to_DEFAULTED
          - entities.Franchisee.fields.open_compliance_strikes
        distinguishing_aspect: |
          Depth-3 chain from one trigger: finalize FAIL audit on unit-2 → unit-2 compliance_status→SUSPENDED
          (hop 1) → that suspension increments the franchisee's open_compliance_strikes to 2 (hop 2) →
          reaching 2 transitions the ACTIVE franchisee to DEFAULTED (hop 3). Each link is caused by the prior.
        test_recipe:
          setup:
            - "Brand; ACTIVE franchisee with two OPEN units (unit-1 already SUSPENDED by a prior FAIL audit, so open_compliance_strikes=1); unit-2 OPEN, GOOD_STANDING, with an IN_PROGRESS audit."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "Diner" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "D1", name: "D1" }
              as: Franchisor
              captures: { terr1: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "D2", name: "D2" }
              as: Franchisor
              captures: { terr2: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr1}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/territories/${terr2}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr1}", address: "U1" }
              as: Franchisor
              captures: { unit1: $.data.id }
            - call: "POST /franchise/units/${unit1}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr2}", address: "U2" }
              as: Franchisor
              captures: { unit2: $.data.id }
            - call: "POST /franchise/units/${unit2}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit1}" }
              as: ComplianceAuditor
              captures: { audit1: $.data.id }
            - call: "POST /franchise/audits/${audit1}/start"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /franchise/audits/${audit1}/finalize"
              payload: { food_safety_score: 40, cleanliness_score: 40, service_score: 40, brand_compliance_score: 40 }
