      - name: amend_supersedes_the_original_and_clones_a_new_draft
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /amnesty/agreements/{id}/amend]
          - entities.VoluntaryDisclosureAgreement.fields.amends_agreement_id
        distinguishing_aspect: |
          Amendment is a two-row operation, not an in-place edit: the addressed agreement
          becomes SUPERSEDED and still bumps its own version, while a brand-new agreement
          is created in DRAFTED at version 1 carrying amends_agreement_id and the revised
          lookback. The new row is reverse-reachable through
          GET /amnesty/agreements?amends_agreement_id=.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Alderbrook holds an EXECUTED agreement whose lookback runs 2023-09-01..2026-06-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Alderbrook Timber LLC", taxpayer_type: "BUSINESS", tin_last4: "6641" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /amnesty/agreements/${agr_id}/amend"
              payload: { expected_agreement_version: "${agr_v}", lookback_start_date: "2024-01-01", lookback_end_date: "2026-06-30", prospective_compliance_months: 48 }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { new_agr_id: $.data.id }
          assert:
            - "response.status == 201"
            - "the response is the NEW agreement: id != ${agr_id}, status == \"DRAFTED\", version == 1"
            - "VoluntaryDisclosureAgreement.${new_agr_id}.amends_agreement_id == \"${agr_id}\""
            - "VoluntaryDisclosureAgreement.${new_agr_id}.lookback_start_date == \"2024-01-01\""
            - "VoluntaryDisclosureAgreement.${new_agr_id}.prospective_compliance_months == 48"
            - "VoluntaryDisclosureAgreement.${new_agr_id}.executed_at == null and compliance_due_at == null"
            - "VoluntaryDisclosureAgreement.${agr_id}.status == \"SUPERSEDED\""
            - "VoluntaryDisclosureAgreement.${agr_id}.version == ${agr_v} + 1"
            - "GET /amnesty/agreements?amends_agreement_id=${agr_id} returns total_count == 1"
            - "GET /amnesty/agreements?program_id=${prog_id} returns total_count == 2"
            - "AmnestyProgram.${prog_id}.participant_count == 1 (superseding an executed agreement does not double-count the participant)"

      - name: clock_endpoint_drives_every_temporal_read
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - response_envelope
        distinguishing_aspect: |
          The clock is the only source of "now": with no call at all it reads
          2026-08-01T00:00:00Z, and moving it changes the created_at stamped on the very
          next write. Nothing else in the store is touched, so the program created before
          the move keeps its original created_at.
        test_recipe:
          setup:
            - "Empty store; the logical clock has never been set, so it reads 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /amnesty/programs"
              payload: { name: "Default Clock Program", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_default_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
              captures: { now_iso: $.data.current_utc }
            - call: "POST /amnesty/programs"
              payload: { name: "Moved Clock Program", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_moved_id: $.data.id }
          assert:
            - "the first trigger returns status 200 with current_utc == \"2026-09-15T00:00:00.000Z\""
            - "AmnestyProgram.${prog_default_id}.created_at == \"2026-08-01T00:00:00.000Z\""
            - "AmnestyProgram.${prog_moved_id}.created_at == \"2026-09-15T00:00:00.000Z\""
            - "AmnestyProgram.${prog_default_id}.created_at is unchanged by the clock move"
            - "both programs are still in status DRAFT at version 1"

      - name: computed_read_of_the_revenue_summary
        claim_type: Computed read
        grounds:
          - endpoints[GET /amnesty/programs/{id}/revenue-summary]
        excluded_because:
          difficulty_instance: realization_rounds_to_four_places_before_the_forecast_comparison
          rationale: |
            That instance reads the revenue summary as its assertion surface and pins
            every derived member of the payload (collected, realization_pct,
            forecast_status), so a separate computed-read instance would only restate it.

      - name: computed_read_of_the_compliance_behavior_profile
        claim_type: Computed read
        grounds:
          - endpoints[GET /amnesty/taxpayers/{id}/compliance-behavior]
        excluded_because:
          difficulty_instance: historical_vs_program_adjusted_behavior_score_divergence
          rationale: |
            That instance reads the same endpoint and asserts both score variants plus
            every counter it exposes, which subsumes a plain computed-read claim.

  # =========================================================================
  - section: Table 6 Errors
    instances:
      - name: unknown_installment_id_returns_not_found
        claim_type: Error triggerability
        grounds:
          - errors[ERR_INSTALLMENT_NOT_FOUND]
          - endpoints[GET /amnesty/installments/{id}]
        distinguishing_aspect: |
          Installment is a grandchild entity addressed by a flat id, so the not-found path
          must be reachable without any parent context; the 404 fires on a well-formed but
          unknown UUID even though no PaymentPlan exists at all.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; no payment plans and no installments exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /amnesty/installments/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: ProgramAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == \"ERR_INSTALLMENT_NOT_FOUND\""
            - "response.response_type == \"error\" and response.data.message is a non-empty string"
            - "response.data contains no keys other than error_id and message"

      - name: declare_breach_is_rejected_when_nothing_was_ever_waived
        claim_type: Error triggerability
        grounds:
          - errors[ERR_NOTHING_TO_REINSTATE]
          - endpoints[POST /amnesty/agreements/{id}/declare-breach]
        distinguishing_aspect: |
          Breach is a clawback, so it is only meaningful once a waiver exists: an EXECUTED
          agreement with no filed returns has waived_amount_cents 0 and the call is
          refused, leaving the agreement EXECUTED and creating no EnforcementAction. The
          agreement-state guard is not the one that fires here, which is what separates
          this from the ERR_AGREEMENT_NOT_EXECUTED path.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Thornfield holds an EXECUTED agreement with waived_amount_cents 0 and no returns"
          setup_api_calls:
