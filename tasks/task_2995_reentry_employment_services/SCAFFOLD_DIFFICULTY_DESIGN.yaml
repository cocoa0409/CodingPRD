- rule_id: transitive_cascade
  instances:
  - name: separation_releases_subsidy_then_flips_posture_then_promotes_deferred
    grounds:
    - state_machines.Placement_employment.ACTIVE_to_SEPARATED
    - state_machines.WorkShift_status.SCHEDULED_to_CANCELLED
    - calculations.wage_subsidy_total
    - calculations.grant_ledger
    - calculations.deferred_request_promotion
    - state_machines.SupportRequest_status.DEFERRED_to_APPROVED
    - state_machines.Participant_stage.PLACED_to_POST_RELEASE
    distinguishing_aspect: 'Triggering transition Placement_employment.ACTIVE_to_SEPARATED drives a depth-5 chain
      in which each link is CAUSED by the previous one: shift cancellation -> subsidy recomputation and freeze ->
      grant ledger movement -> funding_posture RESTRICTED->OPEN -> deferred promotion of sr2; a fan-out of independent
      effects would not reach link 5.'
    test_recipe:
      setup:
      - Logical clock at 2026-08-01T08:00:00.000Z.
      - Participant p1 released; SupervisionCase sc1 ACTIVE with work authorization APPROVED for window [480, 1020]
        (authorization_change_count 1).
      - EmployerPartnership pt1 ACTIVE; JobOpening jo1 hourly_wage_cents 1850, weekly_hours 35, openings_count 2.
      - 'FunderGrant g1: authorized_cents 30000, per_participant_cap_cents 60000 (restricted_floor 4500 = ROUND_HALF_UP(30000
        * 0.15, 0)).'
      - Placement pl1 ACTIVE with three 8.0-hour SCHEDULED shifts on 2026-08-03/04/05 -> projected_subsidy_cents 22200,
        committed_cents 22200, available_cents 7800, posture OPEN.
      - SupportRequest sr1 (TRANSIT_PASS, requested 5000, fee 0, total 5000) reviewed APPROVED -> committed 27200,
        available 2800, funding_posture RESTRICTED.
      - SupportRequest sr2 (TOOLS, requested 3400, fee 0, total 3400) reviewed APPROVED while available_cents 2800
        < 3400, so it landed in DEFERRED holding no money.
      - Clock advanced to 2026-08-03T18:00:00.000Z and shift sh1 marked WORKED (actual_subsidy_cents 7400, projected
        still 22200).
