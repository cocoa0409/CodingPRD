            - "c_old filed 2023-08-01, expired to UNANSWERED 2023-08-20; c_new filed 2026-09-01, expired to UNANSWERED at the 2026-09-16 sweep."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2023-08-01T00:00:00Z" }
              as: BureauAdmin
            - *k_bureau
