  # ===========================================================================
  # SECTION 6 - From Table 6 (Errors): every catalogued error_id is triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: unknown_or_blank_identity_headers_are_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1
          - response_envelope.error
        distinguishing_aspect: |
          The auth gate is priority 1 and fires before any role or resource check, so a
          role string outside the declared seven, a blank X-User-ID and a wrong-case
          role all return 401 ERR_UNAUTHENTICATED -- never 403 ERR_FORBIDDEN_ROLE and
          never 404 -- while the same request with a declared role and a non-empty user
          id returns 200 against an empty database.
        test_recipe:
          setup:
            - "No fixture at all: the database may be empty, because priority 1 is evaluated before priority 5's existence checks."
            - "GET /grandstand/fair-editions is the probe endpoint because it is a list read that cannot 404 -- an empty list is a legitimate 200, so any non-200 is attributable to the header layer alone."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
          trigger:
            - call: "GET /grandstand/fair-editions"
              payload: {}
              as: StageHand
              as_user_id: "someone-01"
              captures: { err_a1: "$.data.error_id" }
            - call: "GET /grandstand/fair-editions"
              payload: {}
              as: TalentBuyer
              as_user_id: ""
              captures: { err_a2: "$.data.error_id" }
            - call: "GET /grandstand/fair-editions"
              payload: {}
              as: talentbuyer
              as_user_id: "buyer-01"
              captures: { err_a3: "$.data.error_id" }
            - call: "GET /grandstand/fair-editions"
              payload: {}
              as: TalentBuyer
              as_user_id: "buyer-01"
          assert:
            - "The undeclared role StageHand returns HTTP 401 with ${err_a1} == ERR_UNAUTHENTICATED, not 403 ERR_FORBIDDEN_ROLE."
            - "The blank X-User-ID returns HTTP 401 with ${err_a2} == ERR_UNAUTHENTICATED even though the role itself is declared."
            - "The lower-case role string returns HTTP 401 with ${err_a3} == ERR_UNAUTHENTICATED: role matching is exact, not case-insensitive."
            - "Every refusal body is the declared error envelope with response_type == 'error' and $.data == { error_id, message }."
            - "The control call returns HTTP 200 with an empty data array and total_count == 0, proving the endpoint itself was reachable all along."

      - name: roles_cannot_reach_other_roles_exclusive_writes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FORBIDDEN_ROLE
          - validations.priority_2
          - roles.BoxOfficeManager
          - roles.ProductionManager
        distinguishing_aspect: |
          ERR_FORBIDDEN_ROLE / 403 is triggerable on four different exclusive writes by
          four different wrong roles -- BoxOfficeManager on edition create, SettlementController
          on offer create, TalentBuyer on rider rule, ProductionManager on announce --
          and the check precedes existence, so a bogus path id still yields 403 rather
          than 404.
        test_recipe:
          setup:
            - "Canonical edition and Grandstand stage exist so the legitimate-role control calls can succeed; no offers, advances or bookings are needed."
            - "The rider-rule probe deliberately uses a non-existent rider id to prove that priority 2 outranks priority 13."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
