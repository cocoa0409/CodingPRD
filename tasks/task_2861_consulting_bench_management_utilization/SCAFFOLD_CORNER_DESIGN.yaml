      - name: utilization_variants_diverge_and_switch_of_record_on_close
        claim_type: Variant Divergence
        grounds:
          - calculations.utilization_period_metrics.variants.TARGET_BASIS
          - calculations.utilization_period_metrics.variants.AVAILABLE_BASIS
        excluded_because:
          difficulty_instance: dual_variant_calc / utilization_dual_basis_diverges_on_holiday_period
          rationale: "That instance asserts 60.00 versus 63.16 on the same 96.00 billable hours, the of_record switch at close and the variance_pp move, which covers divergence, selection and reconciliation for this calculation."

      - name: realization_variants_diverge_on_investment_hours
        claim_type: Variant Divergence
        grounds:
          - calculations.rate_realization.variants.BOOKED
          - calculations.rate_realization.variants.EARNED
        excluded_because:
          difficulty_instance: dual_variant_calc / realization_booked_vs_earned_diverges_on_investment_mix
          rationale: "That instance drives EARNED strictly below BOOKED with a zero-rate INVESTMENT assignment on the same demand, which is the divergence claim for this pair."

      - name: forecast_variants_diverge_on_the_probability_floor
        claim_type: Variant Selection
        grounds:
          - calculations.weighted_pipeline_demand.variants.WEIGHTED
          - calculations.weighted_pipeline_demand.variants.COMMITTED
        excluded_because:
          difficulty_instance: dual_variant_calc / forecast_weighted_vs_committed_diverges_on_probability_floor
          rationale: "That instance runs both bases over the same demand set and shows COMMITTED reporting both less and more than WEIGHTED, which is the selection-plus-divergence claim."

      - name: forecast_rounds_each_contribution_before_summing
        claim_type: Precision
        grounds:
          - calculations.weighted_pipeline_demand
          - entities.HiringForecast.fields.weighted_demand_fte
        excluded_because:
          difficulty_instance: combinatorial_formula / forecast_round_per_opportunity_then_sum
          rationale: "That instance pins the round-per-opportunity-then-sum answer against the sum-then-round answer on the same data."

      - name: discount_tier_boundaries_and_margin_escalation
        claim_type: Correct Result
        grounds:
          - calculations.discount_tier_and_margin
          - calculations.discount_tier_and_margin.variants.MIX_WEIGHTED
          - calculations.discount_tier_and_margin.variants.LEVEL_FLOOR
        excluded_because:
          difficulty_instance: combinatorial_formula / discount_tier_escalation_single_pass_evaluation_order
          rationale: "That instance walks S1–S7 across the TIER_NONE_MAX_PCT and TIER_L1_MAX_PCT boundaries and shows S6 escalating a sub-5% discount to L2_FINANCE, covering the tier ladder and both S3 variants."

      - name: match_score_combines_six_weighted_components
        claim_type: Correct Result
        grounds:
          - calculations.match_score
        excluded_because:
          difficulty_instance: combinatorial_formula / match_score_six_input_nonlinear_with_cost_clamp
          rationale: "That instance computes the full six-component score with the travel gate at 0.0000 and the cost clamp engaged, which is the primary correct-result claim for this rule."

      - name: bench_ladder_threshold_boundary_days
        claim_type: Correct Result
        grounds:
          - calculations.bench_aging_escalation
        excluded_because:
          difficulty_instance: boundary_precision_check / bench_l1_escalation_at_exact_threshold_day
          rationale: "That instance tests age_days 13 and 14 against the CONSULTANT L1 threshold, which is the threshold-1 / threshold pair for this algorithm."

      - name: coverage_aggregate_reverses_exactly_on_termination
        claim_type: Correct Result
        grounds:
          - calculations.opportunity_coverage
        excluded_because:
          difficulty_instance: compensating_invariant / opportunity_fte_coverage_conserved_across_placement_terminate
          rationale: "That instance asserts the covered_internal + covered_external + open == required_fte identity before and after a placement termination, which is the aggregation-reversal claim."

  - section: validations
    instances:

      - name: uniqueness_conflicts_across_every_declared_unique_key
        claim_type: Violation → Error
        grounds:
          - validations[priority=23]
          - errors[ERR_UNIQUENESS_CONFLICT]
        distinguishing_aspect: "All five uniqueness keys of priority 23 are exercised in one pass — group name, skill code, consultant email, firm name and the (consultant_id, skill_id) assertion pair — and each duplicate is a 409 rather than an upsert."
        test_recipe:
          setup:
            - "One group 'Cloud NA', one skill CLOUD_ARCH, one consultant ada.byron@firm.test, one firm 'NorthStar Partners', one assertion for (ada, CLOUD_ARCH)."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
            - call: "POST /subcontractor-firms"
              payload: { name: "NorthStar Partners", geo_code: "NA", max_concurrent_placements: 2, pass_through_rate_usd_per_hour: 150.00 }
              as: PracticePartner
              captures: { f1_id: $.data.id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 4 }
              as: ResourceManager
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "EMEA" }
              as: PracticePartner
              captures: { err_group: $.data.error_id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture Redux", family: "DATA" }
              as: PracticePartner
              captures: { err_skill: $.data.error_id }
            - call: "POST /consultants"
              payload: { full_name: "Ada B. Lovelace", email: "ada.byron@firm.test", level: "MANAGER", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 200.00, standard_bill_rate_usd_per_hour: 400.00 }
              as: ResourceManager
              captures: { err_consultant: $.data.error_id }
            - call: "POST /subcontractor-firms"
              payload: { name: "NorthStar Partners", geo_code: "EMEA", max_concurrent_placements: 1, pass_through_rate_usd_per_hour: 200.00 }
              as: PracticePartner
              captures: { err_firm: $.data.error_id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 5 }
              as: ResourceManager
              captures: { err_assertion: $.data.error_id }
          assert:
            - "${err_group} == ERR_UNIQUENESS_CONFLICT with HTTP 409 — the geography is different but the name is not"
            - "${err_skill} == ERR_UNIQUENESS_CONFLICT, ${err_consultant} == ERR_UNIQUENESS_CONFLICT, ${err_firm} == ERR_UNIQUENESS_CONFLICT"
            - "${err_assertion} == ERR_UNIQUENESS_CONFLICT — the second assertion for the same pair is refused rather than raising the existing row to proficiency 5"
            - "SkillAssertion.${sa_id}.proficiency_level is still 4, and GET /practice-groups, GET /skills, GET /consultants and GET /subcontractor-firms each still report total_count == 1"

      - name: parent_group_link_may_not_close_a_cycle
        claim_type: Violation → Error
        grounds:
          - validations[priority=24]
          - errors[ERR_GROUP_CYCLE]
          - entities.PracticeGroup.fields.parent_group_id
          - endpoints[PATCH /practice-groups/{id}]
        distinguishing_aspect: "Both cycle shapes are refused on PATCH — a group pointed at itself and a group pointed at its own descendant — while a third-level group under the existing child is accepted, so it is the cycle and not the depth that is illegal."
        test_recipe:
          setup:
            - "Group A 'Cloud Global' (NA) with no parent; group B 'Cloud NA' (NA) whose parent is A."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud Global", geography_code: "NA" }
              as: PracticePartner
              captures: { pga_id: $.data.id }
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA", parent_group_id: "${pga_id}" }
              as: PracticePartner
              captures: { pgb_id: $.data.id }
          trigger:
            - call: "PATCH /practice-groups/${pga_id}"
              payload: { parent_group_id: "${pga_id}" }
              as: PracticePartner
              captures: { err_self: $.data.error_id }
            - call: "PATCH /practice-groups/${pga_id}"
              payload: { parent_group_id: "${pgb_id}" }
              as: PracticePartner
              captures: { err_cycle: $.data.error_id }
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA East", geography_code: "NA", parent_group_id: "${pgb_id}" }
              as: PracticePartner
              captures: { pgc_id: $.data.id }
          assert:
            - "${err_self} == ERR_GROUP_CYCLE with HTTP 409 — parent_group_id equal to the group's own id"
            - "${err_cycle} == ERR_GROUP_CYCLE — A -> B -> A would close a cycle through the transitive chain"
            - "PracticeGroup.${pga_id}.parent_group_id is still null and PracticeGroup.${pgb_id}.parent_group_id is still ${pga_id}"
            - "the third create returned 201 with PracticeGroup.${pgc_id}.parent_group_id == ${pgb_id}, and GET /practice-groups/${pgb_id}/child-groups now has total_count == 1"

      - name: geography_must_agree_between_consultant_group_and_forecast_skill
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=35]
          - errors[ERR_GEOGRAPHY_MISMATCH]
          - endpoints[POST /consultants]
          - endpoints[POST /hiring-forecasts]
        distinguishing_aspect: "One rule guards three writes: hiring into a group whose geography_code differs from home_geo_code, patching that same field to a foreign geography, and asking for a forecast on a skill_code no Skill row carries."
        test_recipe:
          setup:
            - "One NA group and one CLOUD_ARCH skill; one valid NA consultant already hired."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id, c1_v: $.data.version }
          trigger:
            - call: "POST /consultants"
              payload: { full_name: "Blaise Pascal", email: "blaise.pascal@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Paris", home_geo_code: "EMEA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { err_hire: $.data.error_id }
            - call: "PATCH /consultants/${c1_id}"
              payload: { home_geo_code: "APAC" }
              as: ResourceManager
              captures: { err_patch: $.data.error_id }
            - call: "POST /hiring-forecasts"
              payload: { skill_code: "GHOST_SKILL", geography_code: "NA", horizon_start_on: "2026-08-01", horizon_end_on: "2026-08-31" }
              as: FinanceController
              captures: { err_forecast: $.data.error_id }
          assert:
            - "${err_hire} == ERR_GEOGRAPHY_MISMATCH with HTTP 409, and GET /consultants still has total_count == 1"
            - "${err_patch} == ERR_GEOGRAPHY_MISMATCH; Consultant.${c1_id}.home_geo_code is still \"NA\" and its version is still ${c1_v} == 1"
            - "${err_forecast} == ERR_GEOGRAPHY_MISMATCH — the rule also carries the forecast's skill_code existence check, so a bad skill_code is a 409 here and not the 404 a path id would give"
            - "GET /hiring-forecasts returns total_count == 0"

      - name: retiring_a_skill_blocks_new_demand_new_programmes_and_qualify
        claim_type: Conditional validation
        grounds:
          - validations[priority=15]
          - errors[ERR_SKILL_RETIRED]
          - entities.Skill.fields.retired
          - endpoints[PATCH /skills/{id}]
        distinguishing_aspect: "Retirement is retroactive for transitions but not for rows: the existing QUALIFYING demand survives untouched, yet its qualify call and every new demand or programme on the skill are refused at priority 15."
