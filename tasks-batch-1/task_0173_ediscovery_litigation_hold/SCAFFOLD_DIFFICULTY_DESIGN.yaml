scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: collection_volume_estimate_vs_actual
        grounds:
          - calculations.collection_volume
          - entities.CollectionScope.fields.expected_doc_count
          - entities.CollectionScope.fields.collected_actual_count
        distinguishing_aspect: |
          On the CollectionScope domain: the estimate variant sums expected_doc_count over
          DEFINED/COLLECTING scopes (forward-looking) while the actual variant counts collected
          Documents over COLLECTED+ scopes; for one scope with expected_doc_count=100 and 3 docs
          actually collected, estimate_total==0 and actual_total==3 after finish — different numbers.
        test_recipe:
          setup:
            - "Matter with HOLD_ACTIVE; one custodian ACKNOWLEDGED; one CollectionScope finished with expected_doc_count=100 and 3 ingested Documents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LegalOps
            - call: "POST /matters"
              payload: { caption: "Acme v. Beta", bates_prefix: "ABC" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Alice", email: "alice@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "Hold A", instructions: "Preserve", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
            - call: "POST /collection-scopes"
              payload: { matter_id: "${m_id}", custodian_id: "${c1_id}", source_label: "Mailbox", range_start: "2026-06-01T00:00:00Z", range_end: "2026-06-30T00:00:00Z", expected_doc_count: 100 }
              as: LegalOps
              captures: { s1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/start"
              payload: {}
              as: LegalOps
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "aa", page_count: 1 }
              as: LegalOps
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "bb", page_count: 1 }
              as: LegalOps
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "aa", page_count: 1 }
              as: LegalOps
            - call: "POST /collection-scopes/${s1_id}/finish"
              payload: {}
              as: LegalOps
          trigger:
            - call: "GET /matters/${m_id}/collection-summary"
              payload: {}
              as: LegalOps
          assert:
            - "GET /matters/{m_id}/collection-summary .data.estimate_total == 0"
            - "GET /matters/{m_id}/collection-summary .data.actual_total == 3"

      - name: spoliation_risk_provisional_vs_final
        grounds:
          - calculations.spoliation_risk_score
          - entities.Matter.fields.spoliation_risk_score
          - entities.Custodian.fields.ack_state
        distinguishing_aspect: |
          On the Matter domain (different from collection_volume's CollectionScope domain): with 1
          ACKNOWLEDGED and 1 PENDING custodian, days_since_issue=10, responsive_doc_count=0 (R<100,
          mult 1.0), the provisional variant counts the PENDING custodian as unacked (U=1 ->
          base=15+20=35) while the final variant excuses any custodian with an ack record (U=0 ->
          base=0+20=20); 35 != 20.
        test_recipe:
          setup:
            - "Matter hold ISSUED on 2026-06-01; 2 custodians, custodian1 ACKNOWLEDGED, custodian2 still PENDING; clock advanced to 2026-06-11 (10 days); no responsive docs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LegalOps
            - call: "POST /matters"
              payload: { caption: "Risk Co", bates_prefix: "RC" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Alice", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Bob", email: "b@x.com" }
              as: LegalOps
              captures: { c2_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "Hold", instructions: "Preserve", ack_deadline: "2026-06-20T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: LegalOps
          trigger:
            - call: "GET /matters/${m_id}/risk"
              payload: {}
              as: LegalOps
          assert:
            - "GET /matters/{m_id}/risk .data.provisional_risk == 35"
            - "GET /matters/{m_id}/risk .data.final_risk == 20"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: production_cost_round_per_doc_then_sum
        grounds:
          - calculations.production_cost_cents
          - entities.ProductionSet.fields.produced_page_count
          - entities.Document.fields.page_count
        distinguishing_aspect: |
          Mode (b) nested rounding order: with three 1-page docs at 7.3 cents/page, round-per-document
          (round(7.3)=7 each) then sum = 21, whereas the forbidden sum-then-round (round(21.9))=22;
          the scaffold pins per-document-then-sum so produced_page_count==21, not 22.
        test_recipe:
          setup:
            - "A COMPLETED review batch of 3 non-privileged 1-page documents staged into a production set."
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "Cost Co", bates_prefix: "CC" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Alice", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
            - call: "POST /collection-scopes"
              payload: { matter_id: "${m_id}", custodian_id: "${c1_id}", source_label: "Mbx", range_start: "2026-06-01T00:00:00Z", range_end: "2026-06-30T00:00:00Z", expected_doc_count: 3 }
              as: LegalOps
              captures: { s1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/start"
              payload: {}
              as: LegalOps
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "h1", page_count: 1 }
              as: LegalOps
              captures: { d1_id: $.data.id }
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "h2", page_count: 1 }
              as: LegalOps
              captures: { d2_id: $.data.id }
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "h3", page_count: 1 }
              as: LegalOps
              captures: { d3_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/finish"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs"
              payload: { matter_id: "${m_id}", scope_id: "${s1_id}" }
              as: LegalOps
              captures: { j_id: $.data.id }
            - call: "POST /processing-jobs/${j_id}/run"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs/${j_id}/complete"
              payload: {}
              as: LegalOps
            - call: "POST /review-batches"
              payload: { matter_id: "${m_id}", name: "B1" }
              as: ReviewLead
              captures: { b_id: $.data.id }
            - call: "POST /review-batches/${b_id}/reviews"
              payload: { document_id: "${d1_id}" }
              as: ReviewLead
              captures: { dr1_id: $.data.id }
            - call: "POST /review-batches/${b_id}/reviews"
              payload: { document_id: "${d2_id}" }
              as: ReviewLead
              captures: { dr2_id: $.data.id }
            - call: "POST /review-batches/${b_id}/reviews"
              payload: { document_id: "${d3_id}" }
              as: ReviewLead
              captures: { dr3_id: $.data.id }
            - call: "POST /review-batches/${b_id}/open-review"
              payload: {}
              as: ReviewLead
            - call: "POST /document-reviews/${dr1_id}/decide"
              payload: { decision: "RESPONSIVE_NOT_PRIV" }
              as: Reviewer
            - call: "POST /document-reviews/${dr2_id}/decide"
              payload: { decision: "RESPONSIVE_NOT_PRIV" }
              as: Reviewer
            - call: "POST /document-reviews/${dr3_id}/decide"
              payload: { decision: "RESPONSIVE_NOT_PRIV" }
              as: Reviewer
            - call: "POST /review-batches/${b_id}/submit-qc"
              payload: {}
              as: ReviewLead
            - call: "POST /review-batches/${b_id}/complete"
              payload: {}
              as: ReviewLead
            - call: "POST /production-sets"
              payload: { matter_id: "${m_id}", source_batch_id: "${b_id}" }
              as: Producer
              captures: { ps_id: $.data.id }
            - call: "POST /production-sets/${ps_id}/items"
              payload: { document_id: "${d1_id}" }
              as: Producer
            - call: "POST /production-sets/${ps_id}/items"
              payload: { document_id: "${d2_id}" }
              as: Producer
            - call: "POST /production-sets/${ps_id}/items"
              payload: { document_id: "${d3_id}" }
              as: Producer
          trigger:
            - call: "POST /production-sets/${ps_id}/validate"
              payload: {}
              as: Producer
              captures: { ps_status: $.data.status, ppc: $.data.produced_page_count }
          assert:
            - "ProductionSet.${ps_id}.status == STAGED"
            - "ProductionSet.${ps_id}.produced_page_count == 21"

      - name: spoliation_risk_three_input_nonlinear_tier
        grounds:
          - calculations.spoliation_risk_score
          - entities.Matter.fields.responsive_doc_count
          - entities.Matter.fields.custodian_count
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: base = U*15 + min(D,30)*2 caps days at 30, then a
          tiered multiplier keyed on R (responsive_doc_count) selects 1.0/1.2/1.5; with U=2, D=40
          (capped to 30 -> 60), base=90, R=0 -> mult 1.0 -> 90, distinct from the rounding mode (b).
        test_recipe:
          setup:
            - "Matter hold ISSUED on 2026-06-01 with 2 PENDING (un-acknowledged) custodians; clock at 2026-07-15 (>30 days); no responsive docs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LegalOps
            - call: "POST /matters"
              payload: { caption: "Tier Co", bates_prefix: "TC" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Bo", email: "b@x.com" }
              as: LegalOps
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: LegalOps
          trigger:
            - call: "GET /matters/${m_id}/risk"
              payload: {}
              as: LegalOps
          assert:
            - "GET /matters/{m_id}/risk .data.provisional_risk == 90"
            - "GET /matters/{m_id}/risk .data.final_risk == 60"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: review_batch_qc_bounce_back_cycle
        grounds:
          - state_machines.ReviewBatch.QC_REVIEW_to_IN_REVIEW
          - state_machines.ReviewBatch.IN_REVIEW_to_QC_REVIEW
        distinguishing_aspect: |
          ReviewBatch is cyclic: QC_REVIEW -> IN_REVIEW (reopen) returns to a prior state, then
          IN_REVIEW -> QC_REVIEW again; the same batch row revisits IN_REVIEW twice, which a linear
          pipeline cannot do.
        test_recipe:
          setup:
            - "A review batch with one decided UNIQUE document in QC_REVIEW."
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "Cyc Co", bates_prefix: "CY" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
            - call: "POST /collection-scopes"
              payload: { matter_id: "${m_id}", custodian_id: "${c1_id}", source_label: "Mbx", range_start: "2026-06-01T00:00:00Z", range_end: "2026-06-30T00:00:00Z", expected_doc_count: 1 }
              as: LegalOps
              captures: { s1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/start"
              payload: {}
              as: LegalOps
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "h1", page_count: 2 }
              as: LegalOps
              captures: { d1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/finish"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs"
              payload: { matter_id: "${m_id}", scope_id: "${s1_id}" }
              as: LegalOps
              captures: { j_id: $.data.id }
            - call: "POST /processing-jobs/${j_id}/run"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs/${j_id}/complete"
              payload: {}
              as: LegalOps
            - call: "POST /review-batches"
              payload: { matter_id: "${m_id}", name: "B1" }
              as: ReviewLead
              captures: { b_id: $.data.id }
            - call: "POST /review-batches/${b_id}/reviews"
              payload: { document_id: "${d1_id}" }
              as: ReviewLead
              captures: { dr1_id: $.data.id }
            - call: "POST /review-batches/${b_id}/open-review"
              payload: {}
              as: ReviewLead
            - call: "POST /document-reviews/${dr1_id}/decide"
              payload: { decision: "RESPONSIVE_NOT_PRIV" }
              as: Reviewer
            - call: "POST /review-batches/${b_id}/submit-qc"
              payload: {}
              as: ReviewLead
          trigger:
            - call: "POST /review-batches/${b_id}/reopen"
              payload: {}
              as: ReviewLead
              captures: { st1: $.data.status }
            - call: "POST /review-batches/${b_id}/submit-qc"
              payload: {}
              as: ReviewLead
              captures: { st2: $.data.status }
          assert:
            - "ReviewBatch.${b_id}.status after reopen == IN_REVIEW"
            - "ReviewBatch.${b_id}.status after second submit-qc == QC_REVIEW"

      - name: production_set_validate_fork_blocked_vs_staged
        grounds:
          - state_machines.ProductionSet.VALIDATING_to_BLOCKED
          - state_machines.ProductionSet.VALIDATING_to_STAGED
        distinguishing_aspect: |
          ProductionSet branches on a different entity: DRAFT -> VALIDATING forks to BLOCKED when any
          item's Document.privilege_tag==PRIVILEGED, else to STAGED; the divergent side-effect set
          (Bates allocation only on STAGED) makes this a fork-join, not linear.
        test_recipe:
          setup:
            - "A COMPLETED batch of 2 UNIQUE docs, one decided RESPONSIVE_PRIV (so frozen privilege_tag=PRIVILEGED); a production set containing only the non-priv doc validates to STAGED."
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "Fork Co", bates_prefix: "FK" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
