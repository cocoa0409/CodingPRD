        distinguishing_aspect: >-
          Shared operations must work from BOTH sides of the peer pair on the same
          booking: the owner records the POST_TRIP reading while the renter
          records a MID_TRIP one and then closes the trip with /return — a mixed
          authorship sequence that still lands on RETURNED with settlement
          RECONCILING and final_total 151876.
        test_recipe:
          setup: >-
            Full canonical trip IN_TRIP with all five PRE_TRIP photo zones and the
            PRE_TRIP reading recorded.
          setup_api_calls:
