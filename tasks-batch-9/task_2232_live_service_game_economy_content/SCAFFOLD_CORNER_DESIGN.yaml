            That difficulty instance already drives the approval dimension through its
            DRAFT -> IN_REVIEW -> DRAFT loop while cycling the availability dimension
            OFFLINE -> LIVE -> SUSPENDED -> LIVE and asserts that neither dimension perturbs the
            other, which is exactly this claim.

      - name: corner_sm_compensation_reverses_all_side_effects
        claim_type: Compensation
        grounds:
          - state_machines.LiveEvent.APPROVED_to_ROLLED_BACK
          - state_machines.RefundRequest.APPROVED_to_EXECUTED
        excluded_because:
          difficulty_instance: "compensating_invariant / live_event_rollback_conserves_cluster_reserved_ccu"
          rationale: |
            The compensating_invariant instances already prove that undoing a transition reverses
            every original side effect with no drift, on both the capacity reservation and the
            currency ledger.

      - name: corner_sm_ledger_sync_derived_season_fields
        claim_type: Ledger sync
        grounds:
          - state_machines.Episode.SCHEDULED_to_LIVE
          - entities.Season.fields.gross_faucet_minor
        excluded_because:
          difficulty_instance: "transitive_cascade / episode_release_faucet_cascade_to_season_ratio"
          rationale: |
            That instance reconciles the ledger rows minted by one transition against the
            account balances and the season's derived gross_faucet_minor and lifetime_ratio_bp
            before and after, which is the ledger-sync claim in full.

      - name: corner_sm_cross_entity_side_effect_adjusts_other_entity
        claim_type: Cross-entity
        grounds:
          - state_machines.MonitoringRun.OPEN_to_COMPUTED
          - state_machines.Purchase.PENDING_to_DENIED
        excluded_because:
          difficulty_instance: "transitive_cascade / monitoring_compute_suspends_lootbox_and_denies_pending_purchase"
          rationale: |
            One MonitoringRun transition there adjusts the Season, an Offer, a Purchase and a
            Player, and each affected entity's state and derived fields are asserted, covering
            the cross-entity side-effect pattern.

  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_calc_cadence_debt_correct_result_and_posture_flip
        claim_type: Correct Result
        grounds:
          - calculations.season_cadence_debt_days
          - entities.Season.fields.cadence_debt_days
          - entities.Season.fields.content_posture
        distinguishing_aspect: |
          Slip days and overdue days are summed per episode: a 3-day late release alone gives
          cadence_debt_days 3 with posture ON_TRACK, and once the still-SCHEDULED second episode
          is 15 days overdue the same formula yields 18, crossing the 14-day limit into BEHIND.
        test_recipe:
          setup:
            - "Season S7 LIVE, 2026-08-01 -> 2026-10-30."
            - "Episode 1 SCHEDULED for 2026-08-02T00:00:00Z, Episode 2 SCHEDULED for 2026-08-10T00:00:00Z."
            - "Clock moved to 2026-08-05T00:00:00Z so Episode 1 releases three days late."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 1, title: "E1 Tidefall", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 0 }
              as: ContentProducer
              captures: { ep1_id: $.data.id }
            - call: "POST /episodes/${ep1_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 2, title: "E2 Undertow", planned_release_at: "2026-08-10T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 0 }
              as: ContentProducer
              captures: { ep2_id: $.data.id }
            - call: "POST /episodes/${ep2_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /episodes/${ep1_id}/release"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 3, title: "E3 Riptide", planned_release_at: "2026-09-01T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 0 }
              as: ContentProducer
              captures: { ep3_id: $.data.id }
            - call: "POST /episodes/${ep3_id}/schedule"
              payload: {}
              as: ContentProducer
          assert:
            - "Season.${season_id}.cadence_debt_days == 3 after the late release"
            - "Season.${season_id}.content_posture == ON_TRACK after the late release"
            - "Episode.${ep1_id}.actual_release_at == 2026-08-05T00:00:00Z"
            - "Season.${season_id}.cadence_debt_days == 18 after scheduling Episode 3"
            - "Season.${season_id}.content_posture == BEHIND after scheduling Episode 3"
            - "Season.${season_id}.scheduled_episode_count == 2"
            - "Season.${season_id}.released_episode_count == 1"

      - name: corner_calc_grant_selector_filters_and_empty_pool
        claim_type: Input Set Filtering
        grounds:
          - calculations.episode_grant_recipient_set
          - entities.CurrencyAccount.fields.currency_code
          - entities.Player.fields.active_season_id
          - entities.Episode.fields.grant_batch_size
        distinguishing_aspect: |
          The selector admits only ACTIVE SOFT_COIN accounts of players whose active_season_id is
          the releasing season: the buyer's HARD_GEM account and the other season's player are
          both skipped (batch 1), and a season whose only player holds no SOFT_COIN account
          releases successfully with grant_batch_size 0 rather than failing.
        test_recipe:
          setup:
            - "Two concurrent LIVE seasons S7 and S8 share the window 2026-08-01 -> 2026-10-30."
            - "Player p1 is active in S7 and holds both a SOFT_COIN and a HARD_GEM account."
            - "Player p2 is active in S8 and holds only a HARD_GEM account."
            - "Episode E7 (S7, grant 1200) and Episode E8 (S8, grant 900) are both SCHEDULED for 2026-08-02T00:00:00Z; the clock is moved to that instant."
