        distinguishing_aspect: "Dual-failure on propose-match for a Child whose Guardian has consent_on_file=false AND for whom zero eligible Volunteers exist violates BOTH business_referential (priority 9 ERR_CONSENT_NOT_ON_FILE) and business_constraint (priority 12 ERR_NO_ELIGIBLE_VOLUNTEER); the lower priority number wins, so ERR_CONSENT_NOT_ON_FILE is returned. This is a different error-category pair (referential vs constraint) than the state/safety pair above."
        test_recipe:
          setup:
            - "Empty volunteer pool; Guardian with consent_on_file=false; WAITLISTED Child."
