              as_user_id: "rep-1"
            - call: "POST /distribution/orders/${ord}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { ord_v: $.data.version }
            - call: "POST /distribution/shipments"
              payload: { order_id: "${ord}", carrier_id: "${car_haz}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T18:00:00Z", expected_order_version: "${ord_v}" }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { shp: $.data.id }
            - call: "POST /distribution/shipments/${shp}/certify"
              payload: { certification_decision: "APPROVE" }
              as: HazmatCertifier
              as_user_id: "cert-1"
            - call: "POST /distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /distribution/shipments/${shp}/dispatch"
              payload: {}
              as: WarehouseOperator
              as_user_id: "op-1"
            - call: "POST /distribution/shipments/${shp}/deliver"
              payload: {}
              as: WarehouseOperator
              as_user_id: "op-1"
            - call: "POST /distribution/core-returns"
              payload: { account_id: "${acct}", order_id: "${ord}", battery_model_id: "${m_fld}", declared_core_count: 10 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { cr: $.data.id }
            - call: "POST /distribution/core-returns/${cr}/inspect"
              payload: { accepted_core_count: 10 }
              as: WarehouseOperator
              as_user_id: "op-1"
            - call: "POST /distribution/core-returns/${cr}/credit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { cr_lead: $.data.lead_recovered_kg }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_fld}", warehouse_id: "${wh_tx}", manufactured_on: "2024-01-01", quantity_on_hand: 4 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot_exp: $.data.id, exp_state: $.data.condition_state }
            - call: "POST /distribution/disposal-manifests"
              payload: { warehouse_id: "${wh_tx}", epa_id: "TXD988001122", reporting_period: "2026-Q3" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { man: $.data.id, man_v0: $.data.version }
            - call: "POST /distribution/disposal-manifests/${man}/attach-core-return"
              payload: { core_return_id: "${cr}", expected_disposal_manifest_version: "${man_v0}" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { core_lead_after_attach: $.data.core_lead_kg }
            - call: "POST /distribution/inventory-lots/${lot_exp}/scrap"
              payload: { disposal_manifest_id: "${man}" }
              as: ComplianceOfficer
              as_user_id: "comp-1"
            - call: "POST /distribution/disposal-manifests/${man}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { lead_before_reject: $.data.total_lead_kg, lot_lead_before: $.data.lot_lead_kg }
          trigger:
            - call: "POST /distribution/disposal-manifests/${man}/reject"
              payload: { rejection_reason: "EPA generator identifier does not match the site permit on file." }
              as: ComplianceOfficer
              as_user_id: "comp-1"
              captures: { lead_after: $.data.total_lead_kg }
          assert:
            - "${cr_lead} == 120.625"
            - "${exp_state} == SHELF_EXPIRED"
            - "${core_lead_after_attach} == 120.625"
            - "${lot_lead_before} == 50.000"
            - "${lead_before_reject} == 170.625"
            - "DisposalManifest.${man}.status == DRAFT"
            - "${lead_after} == 0.0"
            - "DisposalManifest.${man}.core_lead_kg == 0.0"
            - "DisposalManifest.${man}.lot_lead_kg == 0.0"
            - "DisposalManifest.${man}.attached_core_return_count == 0"
            - "DisposalManifest.${man}.scrapped_lot_count == 0"
            - "CoreReturn.${cr}.disposal_manifest_id == null"
            - "CoreReturn.${cr}.lead_recovered_kg == 120.625"
            - "InventoryLot.${lot_exp}.scrap_manifest_id == null"
            - "InventoryLot.${lot_exp}.condition_state == SHELF_EXPIRED"
            - "Account.${acct}.lifetime_lead_recovered_kg == 120.625"

      - name: submit_then_cancel_conserves_account_open_receivable
        grounds:
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - entities.Account.fields.open_receivable_cents
          - calculations.order_total_assembly
        distinguishing_aspect: |
          Conserved quantity: CURRENCY in cents, a third distinct type. The named
          invariant is
          Account.open_receivable_cents == sum of total_cents over that account's Orders
          whose fulfillment_status IN {SUBMITTED, ALLOCATED, SHIPPED, DELIVERED}.
          Submit books 118080 and cancel returns exactly 118080, leaving 0 with no drift,
          while the order keeps its frozen total_cents of 118080.
        test_recipe:
          setup:
            - "One hazmat-endorsed TX warehouse, one STANDARD TX account with a 100000000 cent credit limit and model IB-AGM-95."
            - "One DRAFT order carrying one line of 4 units with core_expected_count 0."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Lone Star Backup", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 9 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id, rec_before: $.data.open_receivable_cents }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-AGM-95", chemistry: "AGM", nominal_voltage: 12, amp_hour_capacity: 95, peukert_exponent: 1.10, unit_weight_kg: 28.0, lead_content_kg: 13.0, core_deposit_cents: 2500, list_price_cents: 26000, warranty_free_replacement_months: 24, warranty_prorata_months: 36, shelf_life_days: 730, self_discharge_pct_per_month: 3.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_agm: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-11" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_agm}", quantity: 4, core_expected_count: 0 }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /distribution/orders/${ord}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { total: $.data.total_cents }
            - call: "GET /distribution/accounts/${acct}"
              as: SalesRep
              as_user_id: "rep-1"
              captures: { rec_mid: $.data.open_receivable_cents }
          trigger:
            - call: "POST /distribution/orders/${ord}/cancel"
              payload: { cancellation_reason: "Duplicate purchase order raised by the branch." }
              as: SalesRep
              as_user_id: "rep-1"
          assert:
            - "${rec_before} == 0"
            - "${total} == 118080"
            - "${rec_mid} == 118080"
            - "Account.${acct}.open_receivable_cents == 0"
            - "Order.${ord}.fulfillment_status == CANCELLED"
            - "Order.${ord}.credit_status == CLOSED"
            - "Order.${ord}.total_cents == 118080"
            - "Order.${ord}.subtotal_cents == 104000"
