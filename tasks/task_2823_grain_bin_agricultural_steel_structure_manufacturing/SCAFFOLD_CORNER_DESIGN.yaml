              payload: { dealer_order_id: "${o1_id}", failure_mode: "SIDEWALL_BUCKLE", observed_load_kpa: 35.0, measured_coating_loss_pct: 10.0, service_years: 4.0 }
              as: QualityInspector
              captures: { ff_id: $.data.id, ff_status: $.data.status, ff_design: $.data.bin_design_id }
          assert:
            - "all nine authorized calls succeed: the crew is created 201 with status CERTIFIED, the design 201, the analysis 201, submit-review 200 with status UNDER_REVIEW, the seal 200 with status SEALED and sealed_by_engineer_id equal to PE-1002, the coil lot 201 with status AVAILABLE, the order 201 with production_status DRAFT, the freight load 201 with status PLANNED and the field failure 201 with status INTAKE"
            - "the field failure's bin_design_id is populated by the system from the order, so it equals the design id even though it was never sent in the body"
            - "POST /bin-designs issued as PlantAdmin returns HTTP 403 with error_id ERR_UNAUTHORIZED_ROLE, and it still returns exactly that when diameter_m is omitted from the body, because priority 2 outranks priority 3"
            - "POST /bin-designs/{id}/seal issued as DesignEngineer with PE-1002's own X-User-ID returns HTTP 403 ERR_UNAUTHORIZED_ROLE - not ERR_SEAL_SEGREGATION_VIOLATION - because the role check at priority 2 precedes the segregation check at priority 14"
            - "POST /bin-designs/{id}/submit-review issued as SealingEngineer returns HTTP 403 ERR_UNAUTHORIZED_ROLE, so the two engineer seats are disjoint in both directions"
            - "POST /dealer-orders issued as LogisticsCoordinator, POST /freight-loads/{id}/dispatch issued as DealerPrincipal, POST /roll-forming-runs issued as LogisticsCoordinator, POST /field-failures issued as PlantAdmin, POST /dealers/{id}/credit-limit issued as DealerPrincipal and POST /_clock/set_current_utc issued as ProductionPlanner each return HTTP 403 with error_id ERR_UNAUTHORIZED_ROLE"
            - "POST /dealer-orders/{id}/assign-crew issued as DealerPrincipal returns HTTP 403 ERR_UNAUTHORIZED_ROLE even though the dealer owns both the order and the crew - crew assignment is a PlantAdmin seat"
            - "any of those calls issued with the X-User-Role header absent, or with X-User-Role set to a string that is not one of the seven declared roles, returns HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS instead"

      - name: a_dealer_principal_may_write_only_their_own_orders_but_may_read_anyone_s
        claim_type: peer_roles
        grounds:
          - roles.DealerPrincipal
          - validations.p6
          - errors.ERR_DEALER_SCOPE_VIOLATION
        distinguishing_aspect: "The scope rule is asymmetric and the asymmetry is the claim: priority 6 lists only the four POST order operations, so a peer dealership is refused on create, confirm, payments and cancel, yet the identical peer reads the same order and even lists it by the rival's dealer_id with HTTP 200. Two different sources of the dealer id are tested - the body dealer_id on create and the addressed order's dealer_id on the three actions - and the refused payment must leave deposit_paid_cents at 0 rather than recording a payment against the wrong dealership. The owner's own confirm then succeeds, so the 403s were about identity and not about the request bodies."
