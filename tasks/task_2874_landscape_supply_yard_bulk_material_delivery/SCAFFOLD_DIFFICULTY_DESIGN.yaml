  - rule_id: boundary_precision_check
    instances:
      - name: axle_payload_equality_accepted_and_one_hundredth_rejected
        grounds:
          - calculations.truck_load_fit
          - validations[priority=20]
          - entities.DeliveryLoad.fields.planned_payload_lb
          - entities.DeliveryLoad.fields.max_allowed_cubic_yards
        distinguishing_aspect: |
          The <= boundary and the ROUND_HALF_UP rule are probed with a single tick: at
          effective density 1050.00 lb/cubic-yard a 10.00-cubic-yard load weighs exactly
          10500 lb, equal to max_payload_lb, and is ACCEPTED; 10.01 cubic yards weighs
          10.01 * 1050 = 10510.5 lb, which round-half-up turns into 10511 and rejects. A
          round-half-down or round-toward-even implementation would compute 10510 and still
          reject, but an implementation that truncates the product to 10510 while also
          comparing with < instead of <= flips both halves at once.
        test_recipe:
          setup:
            - "Material with density_lb_per_cubic_yard 1000 and moisture_pct 20.0, so effective_density_lb_per_cubic_yard is ROUND_HALF_UP(1000 * 1.05, 2) = 1050.00."
            - "Lot of 100.00 gross cubic yards intaken at 20% moisture, so net_sellable_cubic_yards is ROUND_HALF_UP(100 * 0.90 * 0.95, 2) = 85.50."
            - "CONFIRMED DELIVERY order (CLASS_A, 0.0 miles) with one BULK line of 20.00 cubic yards."
            - "A TRI_AXLE truck with max_payload_lb exactly 10500, bed_capacity_cubic_yards 15.0, min_driveway_access_class CLASS_C."
            - "Load 1 is created at planned_cubic_yards 10.00 in a 2026-08-02 window and is accepted."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "SOIL-WET", name: "Damp Screened Soil", offered_forms: [BULK], seasonal_category: "SOIL", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 20.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 20.0 }
              as: YardAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Boundary Grading LLC", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "DELIVERY", delivery_address: "44 Boundary Rd", driveway_access_class: "CLASS_A", delivery_distance_miles: 0.0 }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 20.0 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /delivery-trucks"
              payload: { truck_code: "T-808", axle_class: "TRI_AXLE", max_payload_lb: 10500, bed_capacity_cubic_yards: 15.0, min_driveway_access_class: "CLASS_C" }
              as: DispatchPlanner
              captures: { truck_id: $.data.id }
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 10.0, window_start: "2026-08-02T08:00:00.000Z", window_end: "2026-08-02T12:00:00.000Z" }
              as: DispatchPlanner
