      - name: expired_certification_stops_earning_its_points
        claim_type: Constants Applied
        grounds:
          - calculations.developer_trust_score.constants.CERT_POINTS
          - endpoints.POST /program-checkpoints
          - entities.Developer.fields.audited_trust_score
        distinguishing_aspect: >-
          CERT_POINTS is gated on certification_expires_at being in the future, so the same
          ASSOCIATE certification is worth 8 points on 2026-08-01 and 0 on 2026-08-11 without
          any field being written by a caller. Only the audited score is recomputed by the
          checkpoint, so trust_score stays frozen at 64 while audited_trust_score falls to 56 —
          and certification_level itself must remain ASSOCIATE rather than being reset to NONE.
        test_recipe:
          setup:
            - "a docs-acknowledged developer (base 50 + docs 6) holds an ASSOCIATE certification expiring 2026-08-10T00:00:00Z"
            - "no violation case exists, so the two variants differ only through the expiry"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /developers/${d1_id}/ecosystem-participations"
              payload: { certification_level: "ASSOCIATE", certification_expires_at: "2026-08-10T00:00:00Z" }
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /program-checkpoints"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /program-checkpoints"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
          assert:
            - "before expiry: trust_score == 64 and the first checkpoint's audited_trust_score == 64, with expired_certification_developer_ids == []"
            - "the second checkpoint: HTTP 200 with expired_certification_developer_ids == [${d1_id}] and rescored_developer_ids containing ${d1_id}"
            - "GET /developers/${d1_id}: audited_trust_score == 56 (CERT_POINTS withdrawn) and trust_score == 64 (the snapshot variant is not rewritten by a checkpoint)"
            - "certification_level == ASSOCIATE and certification_expires_at == 2026-08-10T00:00:00.000Z (nothing is cleared)"

      - name: feedback_scores_round_half_up_at_two_decimals
        claim_type: Precision
        grounds:
          - calculations.feedback_roadmap_prioritisation.precision
          - endpoints.POST /feedback-items/{id}/triage
          - entities.ApiProduct.fields.demand_index
        distinguishing_aspect: >-
          The fixture is chosen so that one priority_score lands exactly on a half at the third
          decimal: 10.00 x 1.0325 = 10.325, which round_half_up must render 10.33 while
          banker's rounding would produce 10.32. Its neighbour, 6.25 x 1.0325 = 6.453125,
          rounds down to 6.45, so a blanket ceil is equally wrong. Both authors are
          assignment-less, pinning author_top_tier to NONE (weight 0.25).
        test_recipe:
          setup:
            - "product P1 has no feedback yet, so demand_index is 0.00"
            - "D1 holds an ASSOCIATE certification (CERT_BONUS 2.5) and no assignment; D2 holds neither"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/ecosystem-participations"
              payload: { certification_level: "ASSOCIATE", certification_expires_at: "2027-08-01T00:00:00Z" }
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /developers"
              payload: { org_name: "Southgate Data", contact_email: "dev2@southgate.example", region_code: "US" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d2_id: $.data.id }
            - call: "POST /feedback-items"
              payload: { developer_id: "${d1_id}", api_product_id: "${p1_id}", category: "DX_FRICTION", body: "Pagination cursors are inconsistent between the catalogue and version endpoints." }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /feedback-items"
              payload: { developer_id: "${d2_id}", api_product_id: "${p1_id}", category: "DEFECT", body: "Catalogue reads intermittently omit the newest scope entry." }
              as: Developer
              as_user_id: "${d2_id}"
              captures: { f2_id: $.data.id }
            - call: "POST /feedback-items/${f1_id}/triage"
              payload: {}
              as: DevRelManager
              as_user_id: "drm-1"
          trigger:
            - call: "POST /feedback-items/${f2_id}/triage"
              payload: {}
              as: DevRelManager
              as_user_id: "drm-1"
          assert:
            - "after the first triage: F1.author_top_tier == NONE, raw_impact == 6.25 (15 x 0.25 + 2.5), demand_index == 6.25, F1.priority_score == 6.33 (6.25 x 1.0125 = 6.328125)"
            - "HTTP 200 with data.raw_impact == 10.00 (40 x 0.25 + 0) and data.state == TRIAGED"
            - "GET /api-products/${p1_id}: demand_index == 16.25"
            - "GET /feedback-items/${f2_id}: priority_score == 10.33 (10.00 x 1.0325 = 10.325, round_half_up — NOT 10.32)"
            - "GET /feedback-items/${f1_id}: priority_score == 6.45 (6.25 x 1.0325 = 6.453125, rounded down) and raw_impact still 6.25"

