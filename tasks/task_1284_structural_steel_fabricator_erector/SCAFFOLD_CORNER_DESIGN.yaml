            - { call: "POST /pieces/${pcr}/start", as: FOREMAN }
            - { call: "POST /welders", payload: { full_name: "Weld Seven", qual_process: "FCAW", qual_expires_on: "2027-01-01" }, as: FABRICATOR_ADMIN, captures: { wcr: $.data.id } }
            - { call: "POST /welds", payload: { piece_id: "${pcr}", welder_id: "${wcr}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: WELDER, as_user_id: "${wcr}", captures: { wld: $.data.id } }
            - { call: "POST /inspections", payload: { job_id: "${jcr}", kind: "WELD_VISUAL", weld_id: "${wld}" }, as: QC_INSPECTOR, captures: { iv1: $.data.id } }
            - { call: "POST /inspections/${iv1}/submit", payload: { outcome: "FAILED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /welds/${wld}/repair", as: WELDER, as_user_id: "${wcr}" }
            - { call: "POST /inspections", payload: { job_id: "${jcr}", kind: "WELD_VISUAL", weld_id: "${wld}" }, as: QC_INSPECTOR, captures: { iv2: $.data.id } }
            - { call: "POST /inspections/${iv2}/submit", payload: { outcome: "FAILED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /welds/${wld}/repair", as: WELDER, as_user_id: "${wcr}", captures: { rc2: $.data.repair_count } }
            - { call: "POST /inspections", payload: { job_id: "${jcr}", kind: "WELD_VISUAL", weld_id: "${wld}" }, as: QC_INSPECTOR, captures: { iv3: $.data.id } }
            - { call: "POST /inspections/${iv3}/submit", payload: { outcome: "FAILED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
          trigger:
            - { call: "POST /welds/${wld}/repair", as: WELDER, as_user_id: "${wcr}", captures: { err: $.data.error_id } }
          assert:
            - "rc2 == 2 after the second repair"
            - "err == ERR_WELD_REPAIR_LIMIT on the third attempt (repair_count >= 2)"
            - "Weld.${wld}.status remains VISUAL_REJECTED"

      - name: aisc_hold_blocks_ship_until_audit_passes
        claim_type: conditional_validation
        grounds: ["state_machines.ShippingLoad.LOADING_to_SHIPPED", "errors[ERR_AISC_HOLD_ACTIVE]", "entities.Job.fields.requires_aisc_hold"]
        distinguishing_aspect: "With requires_aisc_hold=true, ship is rejected until a PASSED non-VOIDED AISC_AUDIT inspection exists for the job; the identical ship succeeds afterward."
        test_recipe:
          setup: ["job with requires_aisc_hold=true; piece READY_TO_SHIP on a LOADING load"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job CA3", contract_value_cents: 10000000, billing_basis: "WEIGHT", requires_aisc_hold: true }, as: FABRICATOR_ADMIN, captures: { ja3: $.data.id } }
            - { call: "POST /jobs/${ja3}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${ja3}", drawing_number: "D-1" }, as: DETAILER, captures: { da3: $.data.id } }
            - { call: "POST /shop-drawings/${da3}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${da3}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${ja3}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${ja3}", seq_number: 1 }, as: FOREMAN, captures: { sa3: $.data.id } }
            - { call: "POST /erection-sequences/${sa3}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${ja3}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { ma3: $.data.id } }
            - { call: "POST /mill-orders/${ma3}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${ja3}", piece_mark: "P1", weight_lbs: 800, drawing_id: "${da3}", sequence_id: "${sa3}" }, as: FOREMAN, captures: { pa3: $.data.id } }
            - { call: "POST /pieces/${pa3}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${ja3}", kind: "FINAL_PIECE", piece_id: "${pa3}" }, as: QC_INSPECTOR, captures: { ia3: $.data.id } }
            - { call: "POST /inspections/${ia3}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${ja3}", load_number: "L-1", laydown_slot: "Y-CA3", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { la3: $.data.id } }
            - { call: "POST /shipping-loads/${la3}/lines", payload: { piece_id: "${pa3}" }, as: FOREMAN }
          trigger:
            - { call: "POST /shipping-loads/${la3}/ship", as: FOREMAN, captures: { err: $.data.error_id } }
            - { call: "POST /inspections", payload: { job_id: "${ja3}", kind: "AISC_AUDIT" }, as: QC_INSPECTOR, captures: { aud: $.data.id } }
            - { call: "POST /inspections/${aud}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads/${la3}/ship", as: FOREMAN, captures: { st: $.data.status } }
          assert:
            - "First ship fails with ERR_AISC_HOLD_ACTIVE"
            - "After AISC_AUDIT PASSED, ship returns status == SHIPPED"
            - "Piece.${pa3}.status == SHIPPED after the successful ship"

      - name: derived_field_reconcile_after_void_covered
        claim_type: correct_result
        grounds: ["entities.Job.fields.billed_to_date_cents"]
        excluded_because:
          difficulty_instance: compensating_invariant / billing_approve_void_currency_invariant
          rationale: "Asserted there: billed_to_date_cents and retainage_held_cents reconcile to 0 after the void reversal."

  # ---------------------------------------------------------------------------
  # From Table 4 (Validations)
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_role_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role fails with ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /jobs"
              payload: { name: "Job V1", contract_value_cents: 10000000, billing_basis: "WEIGHT" }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: detailer_job_create_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "DETAILER invoking POST /jobs (FABRICATOR_ADMIN exclusive) fails with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /jobs", payload: { name: "Job V2", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: DETAILER, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (HTTP 403)"

      - name: drawing_self_approval_forbidden
        claim_type: violation_to_error
        grounds: ["state_machines.ShopDrawing.SUBMITTED_to_APPROVED", "errors[ERR_SELF_APPROVAL_FORBIDDEN]", "validations[priority=7]"]
        distinguishing_aspect: "Segregation of duties: the EOR presenting the same X-User-ID that submitted the drawing is rejected even though the role is correct."
        test_recipe:
          setup: ["drawing SUBMITTED by operator det-9"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job V3", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jv3: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jv3}", drawing_number: "D-1" }, as: DETAILER, captures: { dv3: $.data.id } }
            - { call: "POST /shop-drawings/${dv3}/submit", as: DETAILER, as_user_id: "det-9" }
          trigger:
            - { call: "POST /shop-drawings/${dv3}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "det-9", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SELF_APPROVAL_FORBIDDEN"
            - "ShopDrawing.${dv3}.status remains SUBMITTED"

      - name: weld_inspector_segregation_enforced
        claim_type: violation_to_error
        grounds: ["state_machines.Inspection.SCHEDULED_to_PASSED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Submitting a weld inspection whose X-User-ID equals the weld's welder_id is rejected — a welder cannot inspect their own weld."
        test_recipe:
          setup: ["piece IN_SHOP; weld by welder W; WELD_VISUAL inspection SCHEDULED"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job V4", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jv4: $.data.id } }
            - { call: "POST /jobs/${jv4}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jv4}", drawing_number: "D-1" }, as: DETAILER, captures: { dv4: $.data.id } }
            - { call: "POST /shop-drawings/${dv4}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dv4}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jv4}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jv4}", seq_number: 1 }, as: FOREMAN, captures: { sv4: $.data.id } }
            - { call: "POST /erection-sequences/${sv4}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jv4}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mv4: $.data.id } }
            - { call: "POST /mill-orders/${mv4}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jv4}", piece_mark: "P1", weight_lbs: 800, drawing_id: "${dv4}", sequence_id: "${sv4}" }, as: FOREMAN, captures: { pv4: $.data.id } }
            - { call: "POST /pieces/${pv4}/start", as: FOREMAN }
            - { call: "POST /welders", payload: { full_name: "Weld Eight", qual_process: "FCAW", qual_expires_on: "2027-01-01" }, as: FABRICATOR_ADMIN, captures: { wv4: $.data.id } }
            - { call: "POST /welds", payload: { piece_id: "${pv4}", welder_id: "${wv4}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: WELDER, as_user_id: "${wv4}", captures: { wlv4: $.data.id } }
            - { call: "POST /inspections", payload: { job_id: "${jv4}", kind: "WELD_VISUAL", weld_id: "${wlv4}" }, as: QC_INSPECTOR, captures: { iv4: $.data.id } }
          trigger:
            - { call: "POST /inspections/${iv4}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "${wv4}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES"
            - "Inspection.${iv4}.status remains SCHEDULED"

      - name: occ_stale_drawing_revise_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[drawing-revise-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second revise carrying the pre-first-revise version is rejected with ERR_STALE_VERSION (412); the first revise succeeded with the same value because it matched at the time."
        test_recipe:
          setup: ["drawing rev 1 APPROVED; client observed version v; one revise with v already consumed it"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job V5", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jv5: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jv5}", drawing_number: "D-1" }, as: DETAILER, captures: { dv5: $.data.id } }
            - { call: "POST /shop-drawings/${dv5}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dv5}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "GET /shop-drawings/${dv5}", as: DETAILER, captures: { dv5v: $.data.version } }
            - { call: "POST /shop-drawings/${dv5}/revise", payload: { expected_drawing_version: "${dv5v}" }, as: DETAILER, captures: { dv5r2: $.data.id, dv5r2rev: $.data.revision } }
          trigger:
            - { call: "POST /shop-drawings/${dv5}/revise", payload: { expected_drawing_version: "${dv5v}" }, as: DETAILER, captures: { err: $.data.error_id } }
          assert:
            - "dv5r2rev == 2 (first revise succeeded)"
            - "err == ERR_STALE_VERSION (HTTP 412) on the replayed version"

      - name: occ_stale_billing_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[billing-create-stale-job]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Billing creation snapshots job aggregates; a second create carrying the pre-first-create job version is rejected with ERR_STALE_VERSION."
        test_recipe:
          setup: ["job FABRICATING; client observed job version v; billing #1 created with v (bumping the job version)"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job V6", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jv6: $.data.id } }
            - { call: "POST /jobs/${jv6}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jv6}", drawing_number: "D-1" }, as: DETAILER, captures: { dv6: $.data.id } }
            - { call: "POST /shop-drawings/${dv6}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dv6}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jv6}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "GET /jobs/${jv6}", as: FABRICATOR_ADMIN, captures: { jv6v: $.data.version } }
            - { call: "POST /progress-billings", payload: { job_id: "${jv6}", period_label: "2026-08", expected_job_version: "${jv6v}" }, as: FABRICATOR_ADMIN }
          trigger:
            - { call: "POST /progress-billings", payload: { job_id: "${jv6}", period_label: "2026-09", expected_job_version: "${jv6v}" }, as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_VERSION (HTTP 412)"

      - name: duplicate_period_billing_rejected
        claim_type: violation_to_error
        grounds: ["entities.ProgressBilling.fields.period_label", "errors[ERR_DUPLICATE_BILLING_PERIOD]"]
        distinguishing_aspect: "A second billing reusing the period_label of a non-VOIDED billing of the same job is rejected even with a fresh OCC version."
        test_recipe:
          setup: ["job FABRICATING; billing for period 2026-08 exists (DRAFT)"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job V7", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jv7: $.data.id } }
            - { call: "POST /jobs/${jv7}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jv7}", drawing_number: "D-1" }, as: DETAILER, captures: { dv7: $.data.id } }
            - { call: "POST /shop-drawings/${dv7}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dv7}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jv7}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "GET /jobs/${jv7}", as: FABRICATOR_ADMIN, captures: { jv7v: $.data.version } }
            - { call: "POST /progress-billings", payload: { job_id: "${jv7}", period_label: "2026-08", expected_job_version: "${jv7v}" }, as: FABRICATOR_ADMIN }
            - { call: "GET /jobs/${jv7}", as: FABRICATOR_ADMIN, captures: { jv7v2: $.data.version } }
          trigger:
            - { call: "POST /progress-billings", payload: { job_id: "${jv7}", period_label: "2026-08", expected_job_version: "${jv7v2}" }, as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_BILLING_PERIOD"

      - name: billing_on_unbillable_job_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_JOB_NOT_BILLABLE]"]
        distinguishing_aspect: "Billing creation on an AWARDED job (not yet FABRICATING) fails with ERR_JOB_NOT_BILLABLE despite a correct OCC version."
        test_recipe:
          setup: ["job AWARDED only"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job V8", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jv8: $.data.id } }
            - { call: "POST /jobs/${jv8}/award", as: FABRICATOR_ADMIN }
            - { call: "GET /jobs/${jv8}", as: FABRICATOR_ADMIN, captures: { jv8v: $.data.version } }
          trigger:
            - { call: "POST /progress-billings", payload: { job_id: "${jv8}", period_label: "2026-08", expected_job_version: "${jv8v}" }, as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_JOB_NOT_BILLABLE"

      - name: referential_priority_beats_constraint
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=9]", "errors[ERR_CROSS_JOB_REFERENCE]", "errors[ERR_PIECE_MARK_NOT_UNIQUE]"]
        distinguishing_aspect: "A piece create violating both cross-job FK consistency (priority 8) and piece_mark uniqueness (priority 9) returns ERR_CROSS_JOB_REFERENCE."
        test_recipe:
          setup: ["Job A with piece mark P-1 and sequence; Job B with drawing D-B"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job V9A", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jv9a: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jv9a}", drawing_number: "D-A" }, as: DETAILER, captures: { dv9a: $.data.id } }
            - { call: "POST /erection-sequences", payload: { job_id: "${jv9a}", seq_number: 1 }, as: FOREMAN, captures: { sv9a: $.data.id } }
            - { call: "POST /pieces", payload: { job_id: "${jv9a}", piece_mark: "P-1", weight_lbs: 100, drawing_id: "${dv9a}", sequence_id: "${sv9a}" }, as: FOREMAN }
            - { call: "POST /jobs", payload: { name: "Job V9B", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jv9b: $.data.id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jv9b}", drawing_number: "D-B" }, as: DETAILER, captures: { dv9b: $.data.id } }
          trigger:
            - { call: "POST /pieces", payload: { job_id: "${jv9a}", piece_mark: "P-1", weight_lbs: 100, drawing_id: "${dv9b}", sequence_id: "${sv9a}" }, as: FOREMAN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CROSS_JOB_REFERENCE (priority 8 beats priority 9's ERR_PIECE_MARK_NOT_UNIQUE)"

  # ---------------------------------------------------------------------------
  # From Table 5 (Endpoints)
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: piece_start_without_material_rejected
        claim_type: conditional_action
        grounds: ["state_machines.Piece.DETAILED_to_IN_SHOP", "errors[ERR_MATERIAL_NOT_RECEIVED]"]
        distinguishing_aspect: "Piece start with no RECEIVED mill order for the job fails with ERR_MATERIAL_NOT_RECEIVED even when drawing and sequence gates pass."
        test_recipe:
          setup: ["job FABRICATING; drawing APPROVED; sequence RELEASED; mill order PLACED but not received; piece DETAILED"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job EP1", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { je1: $.data.id } }
            - { call: "POST /jobs/${je1}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${je1}", drawing_number: "D-1" }, as: DETAILER, captures: { de1: $.data.id } }
            - { call: "POST /shop-drawings/${de1}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${de1}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${je1}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${je1}", seq_number: 1 }, as: FOREMAN, captures: { se1: $.data.id } }
            - { call: "POST /erection-sequences/${se1}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${je1}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${je1}", piece_mark: "P1", weight_lbs: 800, drawing_id: "${de1}", sequence_id: "${se1}" }, as: FOREMAN, captures: { pe1: $.data.id } }
          trigger:
            - { call: "POST /pieces/${pe1}/start", as: FOREMAN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MATERIAL_NOT_RECEIVED"
            - "Piece.${pe1}.status remains DETAILED"

      - name: stale_piece_start_rejected
        claim_type: conditional_action
        grounds: ["entities.Piece.fields.stale_revision", "errors[ERR_PIECE_STALE_REVISION]", "validations[priority=8]"]
        distinguishing_aspect: "A DETAILED piece whose pinned revision was superseded fails start with ERR_PIECE_STALE_REVISION — the priority-8 sub-order evaluates staleness before the drawing-approved check."
        test_recipe:
          setup: ["piece DETAILED pinned to drawing rev 1; rev 2 approved so rev 1 is SUPERSEDED and the piece is stale"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job EP2", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { je2: $.data.id } }
