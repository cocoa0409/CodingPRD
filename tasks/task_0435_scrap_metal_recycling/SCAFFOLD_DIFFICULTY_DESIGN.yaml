scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: intake_spot_vs_mill_settlement_variant_diverges
        grounds:
          - calculations.ticket_spot_valuation
          - calculations.mill_settlement_reconciliation
          - entities.ScaleTicket.fields.gross_valuation_cents
          - entities.MillShipment.fields.expected_settlement_cents
        distinguishing_aspect: |
          The intake spot valuation (buy side on ScaleTicket: 11326c) and the mill
          settlement estimate (sell side on MillShipment: 12382c) read the SAME two
          line items yet land on different entity domains and different cents because
          one uses spot_price_cents_per_lb and the other mill_price_cents_per_lb.
        test_recipe:
          setup:
            - "Active CU_BARE_BRIGHT NON_FERROUS price spot=375 mill=410 published."
            - "Seller ACTIVE; ticket WEIGHED with two CU lines (10.1 lb, 20.1 lb), then RELEASED into a NON_FERROUS container, container dispatched and shipped to mill."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "CU_BARE_BRIGHT", category: "NON_FERROUS", spot_price_cents_per_lb: 375, mill_price_cents_per_lb: 410 }
              as: YardManager
              captures: { cu_price_id: $.data.id }
            - call: "POST /yard/sellers"
              payload: { legal_name: "Acme Salvage", id_type: "DRIVERS_LICENSE", id_number: "DL-1", tin: "11-1111111" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "NON_FERROUS", capacity_lb: 100000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CU_BARE_BRIGHT", weight_lb: 10.1 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CU_BARE_BRIGHT", weight_lb: 20.1 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
              captures: { gross_val: $.data.gross_valuation_cents }
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_id}"
              payload: {}
              as: YardManager
              captures: { cont_v: $.data.version }
            - call: "POST /yard/containers/${cont_id}/dispatch"
              payload: { expected_container_version: "${cont_v}" }
              as: YardManager
          trigger:
            - call: "POST /yard/mill-shipments"
              payload: { container_id: "${cont_id}" }
              as: YardManager
              captures: { ship_id: $.data.id, expected_settlement: $.data.expected_settlement_cents }
          assert:
            - "ScaleTicket.${tkt_id}.gross_valuation_cents == 11326"
            - "MillShipment.${ship_id}.expected_settlement_cents == 12382"
            - "MillShipment.${ship_id}.expected_settlement_cents != ScaleTicket.${tkt_id}.gross_valuation_cents"

      - name: cumulative_1099_ledger_vs_hedge_pnl_on_different_entities
        grounds:
          - calculations.rule_1099_issuance
          - calculations.hedge_realization_pnl
          - entities.Seller.fields.ytd_cash_paid_cents
          - entities.HedgePosition.fields.realized_pnl_cents
        distinguishing_aspect: |
          The 1099 cumulative cash ledger accrues on Seller (a running integer sum of
          CASH amounts) while hedge realized P&L accrues on HedgePosition (a signed
          locked-vs-effective-price delta); two different conserved metrics on two
          different entities, neither derivable from the other.
        test_recipe:
          setup:
            - "Seller paid one CASH payout of 11000c -> ytd_cash_paid_cents=11000."
            - "An OPEN NON_FERROUS hedge (1300 lb @ 90c/lb) realized by a settled shipment with final 100000c -> realized_pnl_cents=16900."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Bolt Metals", id_type: "STATE_ID", id_number: "SID-2", tin: "22-2222222" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 1000 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "POST /yard/payouts"
              payload: { ticket_id: "${tkt_id}", method: "CASH" }
              as: PayoutClerk
              captures: { payout_id: $.data.id }
            - call: "POST /yard/payouts/${payout_id}/settle"
              payload: {}
              as: PayoutClerk
              captures: { ytd: $.data.amount_cents }
            - call: "GET /yard/containers/${cont_id}"
              payload: {}
              as: YardManager
              captures: { cont_v: $.data.version }
            - call: "POST /yard/containers/${cont_id}/dispatch"
              payload: { expected_container_version: "${cont_v}" }
              as: YardManager
            - call: "POST /yard/hedges"
              payload: { category: "FERROUS", hedged_weight_lb: 1300, locked_price_cents_per_lb: 90 }
              as: SettlementAccountant
              captures: { hedge_id: $.data.id, hedge_v: $.data.version }
            - call: "POST /yard/mill-shipments"
              payload: { container_id: "${cont_id}", hedge_position_id: "${hedge_id}" }
              as: SettlementAccountant
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /yard/mill-shipments/${ship_id}/settle"
              payload: { final_settlement_cents: 100000, expected_hedge_version: "${hedge_v}" }
              as: SettlementAccountant
              captures: { variance: $.data.settlement_variance_cents }
          assert:
            - "Seller.${seller_id}.ytd_cash_paid_cents == 11000"
            - "HedgePosition.${hedge_id}.realized_pnl_cents == 16900"
            - "HedgePosition.${hedge_id}.realized_weight_lb == 1300"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_round_then_sum_order_pinned   # mode (b): nested rounding order
        grounds:
          - calculations.ticket_spot_valuation
          - entities.ScaleTicket.fields.gross_valuation_cents
          - entities.TicketLineItem.fields.line_valuation_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: two CU lines (10.1 lb and 20.1 lb @375c)
          each produce x.5 cents; per-line round_half_up then sum yields 11326, while
          sum-then-round would yield 11325 — the scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Active CU_BARE_BRIGHT price spot=375 published; ticket with two CU lines (10.1, 20.1 lb)."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "CU_BARE_BRIGHT", category: "NON_FERROUS", spot_price_cents_per_lb: 375, mill_price_cents_per_lb: 410 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Acme Salvage", id_type: "DRIVERS_LICENSE", id_number: "DL-1" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CU_BARE_BRIGHT", weight_lb: 10.1 }
              as: WeighMaster
              captures: { line1_val: $.data.line_valuation_cents }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CU_BARE_BRIGHT", weight_lb: 20.1 }
              as: WeighMaster
              captures: { line2_val: $.data.line_valuation_cents }
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
              captures: { gross_val: $.data.gross_valuation_cents }
          assert:
            - "TicketLineItem(line1).line_valuation_cents == 3788"
            - "TicketLineItem(line2).line_valuation_cents == 7538"
            - "ScaleTicket.${tkt_id}.gross_valuation_cents == 11326"

      - name: hedge_pnl_min_cap_and_nested_min_inputs   # mode (a): >=3 inputs, nested min/branch
        grounds:
          - calculations.hedge_realization_pnl
          - entities.HedgePosition.fields.realized_pnl_cents
          - entities.HedgePosition.fields.realized_weight_lb
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (a) non-linear: realized_pnl uses three inputs (shipped_weight_lb,
          final_settlement_cents, locked_price_cents_per_lb) combined non-linearly —
          effective price = round(final/weight), realize_lb = min(weight, remaining),
          leg = round(realize_lb * (locked - effective)) — branching on favorable vs
          unfavorable, distinct from mode (b) above.
        test_recipe:
          setup:
            - "FERROUS hedge 1300 lb @90c; a SHIPPED shipment (1300 lb) with final 130000c (effective 100c > locked 90c)."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Bolt Metals", id_type: "STATE_ID", id_number: "SID-2" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 1000 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_id}"
              payload: {}
              as: YardManager
              captures: { cont_v: $.data.version }
            - call: "POST /yard/containers/${cont_id}/dispatch"
              payload: { expected_container_version: "${cont_v}" }
              as: YardManager
            - call: "POST /yard/hedges"
              payload: { category: "FERROUS", hedged_weight_lb: 1300, locked_price_cents_per_lb: 90 }
              as: SettlementAccountant
              captures: { hedge_id: $.data.id, hedge_v: $.data.version }
            - call: "POST /yard/mill-shipments"
              payload: { container_id: "${cont_id}", hedge_position_id: "${hedge_id}" }
              as: SettlementAccountant
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /yard/mill-shipments/${ship_id}/settle"
              payload: { final_settlement_cents: 130000, expected_hedge_version: "${hedge_v}" }
              as: SettlementAccountant
          assert:
            - "HedgePosition.${hedge_id}.realized_pnl_cents == -13000"
            - "HedgePosition.${hedge_id}.realized_weight_lb == 1300"
            - "HedgePosition.${hedge_id}.status == CLOSED"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_branch_released_vs_reported   # branching fork with divergent side-effects
        grounds:
          - state_machines.ScaleTicket.WEIGHED_to_RELEASED
          - state_machines.ScaleTicket.WEIGHED_to_REPORTED
          - entities.ScaleTicket.fields.status
        distinguishing_aspect: |
          From WEIGHED the ScaleTicket forks to RELEASED (loads a container, enables
          payout) OR REPORTED (creates a TheftReport, freezes the seller) — two
          branches with disjoint side-effect sets, a non-linear fork on ScaleTicket.
        test_recipe:
          setup:
            - "Two WEIGHED tickets for the same seller; one will be reported, one released."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Fork Co", id_type: "STATE_ID", id_number: "SID-3" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_rel: $.data.id }
            - call: "POST /yard/tickets/${tkt_rel}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_rel}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
          trigger:
            - call: "POST /yard/tickets/${tkt_rel}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
              captures: { rel_status: $.data.status }
          assert:
            - "ScaleTicket.${tkt_rel}.status == RELEASED"
            - "ScaleTicket.${tkt_rel}.container_id == ${cont_id}"
            - "Seller.${seller_id}.status == ACTIVE"

      - name: payout_branch_settled_vs_void   # branching on a different entity
        grounds:
          - state_machines.Payout.PENDING_to_SETTLED
          - state_machines.Payout.PENDING_to_VOID
          - entities.Payout.fields.status
        distinguishing_aspect: |
          From PENDING the Payout forks to SETTLED (disburses, moves the 1099 ledger,
          PAID's the ticket) OR VOID (no disbursement, ticket stays RELEASED) — a
          non-linear fork on a different entity (Payout) than Rule 3's ScaleTicket.
        test_recipe:
          setup:
            - "A RELEASED ticket with a PENDING CASH payout."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Void Co", id_type: "STATE_ID", id_number: "SID-4" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "POST /yard/payouts"
              payload: { ticket_id: "${tkt_id}", method: "CASH" }
              as: PayoutClerk
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /yard/payouts/${payout_id}/void"
              payload: {}
              as: PayoutClerk
              captures: { p_status: $.data.status }
          assert:
            - "Payout.${payout_id}.status == VOID"
            - "ScaleTicket.${tkt_id}.status == RELEASED"
            - "Seller.${seller_id}.ytd_cash_paid_cents == 0"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_shipment_hedge_close_depth3
        grounds:
          - state_machines.MillShipment.SHIPPED_to_SETTLED
          - state_machines.HedgePosition.OPEN_to_CLOSED
          - calculations.hedge_realization_pnl
          - entities.HedgePosition.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from settle: (1) MillShipment SHIPPED->SETTLED sets variance,
          which (2) realizes the linked HedgePosition (realized_weight_lb += 1300,
          realized_pnl recomputed), which (3) auto-transitions that HedgePosition
          OPEN->CLOSED because realized reaches hedged — each hop caused by the prior.
        test_recipe:
          setup:
            - "A SHIPPED shipment (1300 lb) linked to an OPEN FERROUS hedge (1300 lb @90c)."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Casc Co", id_type: "STATE_ID", id_number: "SID-5" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 1000 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_id}"
              payload: {}
              as: YardManager
              captures: { cont_v: $.data.version }
            - call: "POST /yard/containers/${cont_id}/dispatch"
              payload: { expected_container_version: "${cont_v}" }
              as: YardManager
            - call: "POST /yard/hedges"
              payload: { category: "FERROUS", hedged_weight_lb: 1300, locked_price_cents_per_lb: 90 }
              as: SettlementAccountant
              captures: { hedge_id: $.data.id, hedge_v: $.data.version }
            - call: "POST /yard/mill-shipments"
              payload: { container_id: "${cont_id}", hedge_position_id: "${hedge_id}" }
              as: SettlementAccountant
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /yard/mill-shipments/${ship_id}/settle"
              payload: { final_settlement_cents: 100000, expected_hedge_version: "${hedge_v}" }
              as: SettlementAccountant
              captures: { ship_status: $.data.status }
          assert:
            - "MillShipment.${ship_id}.status == SETTLED"
            - "HedgePosition.${hedge_id}.realized_weight_lb == 1300"
            - "HedgePosition.${hedge_id}.status == CLOSED"

      - name: report_cascade_ticket_seller_freeze_depth2
        grounds:
          - state_machines.ScaleTicket.WEIGHED_to_REPORTED
          - entities.Seller.fields.status
          - entities.Seller.fields.open_theft_reports
          - entities.TheftReport.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (ticket report, not settle):
          (1) ScaleTicket WEIGHED->REPORTED creates a TheftReport(OPEN), which
          (2) sets the seller FLAGGED and increments open_theft_reports — the freeze
          is caused by the report row, not directly by the ticket transition.
        test_recipe:
          setup:
            - "A WEIGHED ticket for an ACTIVE seller with no prior theft reports."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "CAT_CONV", category: "NON_FERROUS", spot_price_cents_per_lb: 50000, mill_price_cents_per_lb: 52000 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Susp Co", id_type: "PASSPORT", id_number: "P-6" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 50 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CAT_CONV", weight_lb: 5 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 10 }
              as: WeighMaster
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/report"
              payload: { reason: "serial match on stolen catalytic converter" }
              as: WeighMaster
              captures: { rep_status: $.data.status }
          assert:
            - "ScaleTicket.${tkt_id}.status == REPORTED"
            - "Seller.${seller_id}.status == FLAGGED"
            - "Seller.${seller_id}.open_theft_reports == 1"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: segregation_beats_category_mismatch
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_CATEGORY_MISMATCH]
        distinguishing_aspect: |
          On POST /yard/payouts a segregation-of-duties violation (business_safety,
          priority 5) and on release a category mismatch (business_referential,
          priority 7) are different category pairs; the payout endpoint surfaces
          ERR_SEGREGATION_OF_DUTIES because state/auth checks rank above it and the
          category check is on a different endpoint. This instance pins SoD wins over
          a same-request lower-priority business check on the payout path.
        test_recipe:
          setup:
            - "A RELEASED ticket whose theft_hold_released_by == U_SAME; PayoutClerk acts as the same X-User-ID."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "SoD Co", id_type: "STATE_ID", id_number: "SID-7" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/theft-hold"
              payload: {}
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/clear-hold"
              payload: {}
              as: WeighMaster
              as_user_id: "U_SAME"
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
          trigger:
            - call: "POST /yard/payouts"
              payload: { ticket_id: "${tkt_id}", method: "CASH" }
              as: PayoutClerk
              as_user_id: "U_SAME"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: seller_frozen_beats_tin_required_on_settle
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_SELLER_FROZEN]
          - errors[ERR_TIN_REQUIRED_FOR_1099]
        distinguishing_aspect: |
          On POST /yard/payouts/{id}/settle a frozen seller (business_safety, priority
          6) and a missing-TIN 1099 gate (business_fiscal, priority 12) are a different
          category pair than instance 1; when both hold the seller-frozen check wins.
        test_recipe:
          setup:
            - "A PENDING CASH payout of 70000c whose seller has NO TIN and is FLAGGED by an OPEN theft report filed after release."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "CU_BARE_BRIGHT", category: "NON_FERROUS", spot_price_cents_per_lb: 700, mill_price_cents_per_lb: 720 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Frozen Co", id_type: "STATE_ID", id_number: "SID-8" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "NON_FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CU_BARE_BRIGHT", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "POST /yard/payouts"
              payload: { ticket_id: "${tkt_id}", method: "CASH" }
              as: PayoutClerk
              captures: { payout_id: $.data.id }
            - call: "POST /yard/theft-reports"
              payload: { seller_id: "${seller_id}", reason: "post-release tip", ticket_id: "${tkt_id}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /yard/payouts/${payout_id}/settle"
              payload: {}
              as: PayoutClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SELLER_FROZEN"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tin_1099_threshold_exact_60000_triggers
        grounds:
          - calculations.rule_1099_issuance
          - entities.Seller.fields.requires_1099
          - entities.Payout.fields.form_1099_issued
        distinguishing_aspect: |
          Numeric >= boundary on POST /yard/payouts/{id}/settle: a CASH payout pushing
          ytd_cash_paid_cents to EXACTLY 60000 triggers requires_1099=true and
          form_1099_issued=true (>=, not >); 59999 would not.
        test_recipe:
          setup:
            - "Seller with TIN; a RELEASED ticket valued exactly 60000c (600 lb of a 100c grade), PENDING CASH payout."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "BRASS", category: "NON_FERROUS", spot_price_cents_per_lb: 100, mill_price_cents_per_lb: 110 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Edge Co", id_type: "STATE_ID", id_number: "SID-9", tin: "99-9999999" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "NON_FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "BRASS", weight_lb: 600 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "POST /yard/payouts"
              payload: { ticket_id: "${tkt_id}", method: "CASH" }
              as: PayoutClerk
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /yard/payouts/${payout_id}/settle"
              payload: {}
              as: PayoutClerk
              captures: { issued: $.data.form_1099_issued }
          assert:
            - "Seller.${seller_id}.ytd_cash_paid_cents == 60000"
            - "Seller.${seller_id}.requires_1099 == true"
            - "Payout.${payout_id}.form_1099_issued == true"

      - name: weigh_out_blocked_on_empty_line_item_set
        grounds:
          - state_machines.ScaleTicket.DRAFT_to_WEIGHED
          - validations[priority=14]
          - errors[ERR_NO_LINE_ITEMS]
        distinguishing_aspect: |
          Empty-collection boundary on a DIFFERENT endpoint (POST
          /yard/tickets/{id}/weigh-out): a ticket with zero TicketLineItem rows cannot
          weigh-out — distinct metric (set cardinality == 0) from the numeric 1099
          threshold above.
        test_recipe:
          setup:
            - "A DRAFT ticket with NO line items added."
          setup_api_calls:
            - call: "POST /yard/sellers"
              payload: { legal_name: "Empty Co", id_type: "STATE_ID", id_number: "SID-10" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_LINE_ITEMS"
            - "ScaleTicket.${tkt_id}.status == DRAFT"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_release_requires_seller_active   # ScaleTicket <- Seller
        grounds:
          - state_machines.ScaleTicket.WEIGHED_to_RELEASED
          - entities.Seller.fields.status
          - entities.Seller.fields.open_theft_reports
          - errors[ERR_SELLER_FROZEN]
        distinguishing_aspect: |
          ScaleTicket's WEIGHED->RELEASED transition depends on Seller state: a seller
          with an OPEN theft report (status FLAGGED, open_theft_reports>0) blocks
          release with ERR_SELLER_FROZEN — the ScaleTicket<-Seller pair.
        test_recipe:
          setup:
            - "A WEIGHED ticket whose seller was FLAGGED by a proactive theft report."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Dep Co", id_type: "STATE_ID", id_number: "SID-11" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/theft-reports"
              payload: { seller_id: "${seller_id}", reason: "open investigation" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SELLER_FROZEN"
            - "ScaleTicket.${tkt_id}.status == WEIGHED"

      - name: shipment_settle_requires_hedge_open   # MillShipment <- HedgePosition
        grounds:
          - state_machines.MillShipment.SHIPPED_to_SETTLED
          - entities.HedgePosition.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          MillShipment's SHIPPED->SETTLED transition depends on HedgePosition state:
          settling against a CLOSED hedge is rejected with ERR_INVALID_STATE — a
          different entity pair (MillShipment<-HedgePosition) than instance 1.
        test_recipe:
          setup:
            - "A SHIPPED shipment linked to a hedge that was manually CLOSED before settle."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Hedge Co", id_type: "STATE_ID", id_number: "SID-12" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 1000 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_id}"
              payload: {}
              as: YardManager
              captures: { cont_v: $.data.version }
            - call: "POST /yard/containers/${cont_id}/dispatch"
              payload: { expected_container_version: "${cont_v}" }
              as: YardManager
            - call: "POST /yard/hedges"
              payload: { category: "FERROUS", hedged_weight_lb: 1300, locked_price_cents_per_lb: 90 }
              as: SettlementAccountant
              captures: { hedge_id: $.data.id, hedge_v: $.data.version }
            - call: "POST /yard/mill-shipments"
              payload: { container_id: "${cont_id}", hedge_position_id: "${hedge_id}" }
              as: SettlementAccountant
              captures: { ship_id: $.data.id }
            - call: "POST /yard/hedges/${hedge_id}/close"
              payload: {}
              as: SettlementAccountant
          trigger:
            - call: "POST /yard/mill-shipments/${ship_id}/settle"
              payload: { final_settlement_cents: 100000, expected_hedge_version: "${hedge_v}" }
              as: SettlementAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "MillShipment.${ship_id}.status == SHIPPED"

  # =========================================================================
  # Rule 8 — Resource temporal/aggregate-overlap conflicts (DIFFERENT interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: container_capacity_aggregate_overflow   # capacity = aggregate occupancy on Container
        grounds:
          - state_machines.ScaleTicket.WEIGHED_to_RELEASED
          - validations[priority=10]
          - entities.Container.fields.loaded_weight_lb
          - errors[ERR_CONTAINER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity overlap on Container: net weights of all assigned tickets
          must sum to <= capacity_lb. A second release whose net would push
          loaded_weight_lb past capacity is rejected — additive interval-on-capacity
          arithmetic (sum <= cap), distinct from the over-realize semantics below.
        test_recipe:
          setup:
            - "Container capacity 1000 lb already loaded to 800 lb by ticket A; ticket B (net 300 lb) WEIGHED and ready to release."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Cap Co", id_type: "STATE_ID", id_number: "SID-13" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 1000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1000 }
              as: WeighMaster
              captures: { tkt_a: $.data.id }
            - call: "POST /yard/tickets/${tkt_a}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_a}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_a}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 500 }
              as: WeighMaster
              captures: { tkt_b: $.data.id }
            - call: "POST /yard/tickets/${tkt_b}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_b}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
          trigger:
            - call: "POST /yard/tickets/${tkt_b}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CONTAINER_CAPACITY_EXCEEDED"
            - "Container.${cont_id}.loaded_weight_lb == 800"

      - name: hedge_over_realization_remaining_capacity   # remaining-capacity overlap on HedgePosition
        grounds:
          - state_machines.MillShipment.SHIPPED_to_SETTLED
          - validations[priority=11]
          - entities.HedgePosition.fields.realized_weight_lb
          - errors[ERR_HEDGE_OVER_REALIZED]
        distinguishing_aspect: |
          Remaining-capacity overlap on HedgePosition: a second shipment settling
          against a hedge whose remaining capacity (hedged - realized) is less than the
          shipment's shipped_weight_lb is rejected — strict over-fill of a single
          shrinking residual, different interval semantics and different resource
          entity than the additive Container capacity above.
        test_recipe:
          setup:
            - "Hedge hedged 1000 lb; one settled shipment already realized 600 lb (remaining 400); a second SHIPPED shipment of 600 lb is ready to settle."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Over Co", id_type: "STATE_ID", id_number: "SID-14" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/hedges"
              payload: { category: "FERROUS", hedged_weight_lb: 1000, locked_price_cents_per_lb: 90 }
              as: SettlementAccountant
              captures: { hedge_id: $.data.id, hedge_v0: $.data.version }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_a: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1000 }
              as: WeighMaster
              captures: { tkt_a: $.data.id }
            - call: "POST /yard/tickets/${tkt_a}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_a}/weigh-out"
              payload: { tare_weight_lb: 400 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_a}/release"
              payload: { container_id: "${cont_a}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_a}"
              payload: {}
              as: YardManager
              captures: { cont_a_v: $.data.version }
            - call: "POST /yard/containers/${cont_a}/dispatch"
              payload: { expected_container_version: "${cont_a_v}" }
              as: YardManager
            - call: "POST /yard/mill-shipments"
              payload: { container_id: "${cont_a}", hedge_position_id: "${hedge_id}" }
              as: SettlementAccountant
              captures: { ship_a: $.data.id }
            - call: "POST /yard/mill-shipments/${ship_a}/settle"
              payload: { final_settlement_cents: 50000, expected_hedge_version: "${hedge_v0}" }
              as: SettlementAccountant
              captures: { hedge_v1: $.data.version }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_b: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1000 }
              as: WeighMaster
              captures: { tkt_b: $.data.id }
            - call: "POST /yard/tickets/${tkt_b}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_b}/weigh-out"
              payload: { tare_weight_lb: 400 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_b}/release"
              payload: { container_id: "${cont_b}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_b}"
              payload: {}
              as: YardManager
              captures: { cont_b_v: $.data.version }
            - call: "POST /yard/containers/${cont_b}/dispatch"
              payload: { expected_container_version: "${cont_b_v}" }
              as: YardManager
            - call: "POST /yard/mill-shipments"
              payload: { container_id: "${cont_b}", hedge_position_id: "${hedge_id}" }
              as: SettlementAccountant
              captures: { ship_b: $.data.id }
          trigger:
            - call: "POST /yard/mill-shipments/${ship_b}/settle"
              payload: { final_settlement_cents: 50000, expected_hedge_version: "${hedge_v1}" }
              as: SettlementAccountant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_HEDGE_OVER_REALIZED"
            - "HedgePosition.${hedge_id}.realized_weight_lb == 600"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_payout_leaves_ytd_cash_unchanged
        grounds:
          - state_machines.Payout.PENDING_to_VOID
          - calculations.rule_1099_issuance
          - entities.Seller.fields.ytd_cash_paid_cents
        distinguishing_aspect: |
          Conserved quantity = Seller.ytd_cash_paid_cents. Creating then VOIDing a
          PENDING CASH payout leaves ytd_cash_paid_cents exactly equal to its
          pre-payout value (0 here), because the cumulative ledger only moves on
          SETTLE, not on create/void — no drift in the cash ledger.
        test_recipe:
          setup:
            - "A RELEASED ticket with a PENDING CASH payout for a seller whose ytd_cash_paid_cents is 0."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Inv Co", id_type: "STATE_ID", id_number: "SID-15" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "POST /yard/payouts"
              payload: { ticket_id: "${tkt_id}", method: "CASH" }
              as: PayoutClerk
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /yard/payouts/${payout_id}/void"
              payload: {}
              as: PayoutClerk
          assert:
            - "Payout.${payout_id}.status == VOID"
            - "Seller.${seller_id}.ytd_cash_paid_cents == 0"
            - "Seller.${seller_id}.requires_1099 == false"

      - name: clear_theft_report_restores_open_report_count
        grounds:
          - state_machines.ScaleTicket.WEIGHED_to_REPORTED
          - state_machines.TheftReport.OPEN_to_CLEARED
          - entities.Seller.fields.open_theft_reports
          - entities.Seller.fields.status
        distinguishing_aspect: |
          Conserved quantity = Seller.open_theft_reports. Reporting a ticket increments
          it to 1 and FLAGS the seller; clearing that report decrements it back to 0
          and restores status ACTIVE — the count returns to its pre-report value,
          a different conserved quantity than the cash ledger above.
        test_recipe:
          setup:
            - "A REPORTED ticket whose OPEN TheftReport has the seller FLAGGED with open_theft_reports=1."
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "CAT_CONV", category: "NON_FERROUS", spot_price_cents_per_lb: 50000, mill_price_cents_per_lb: 52000 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Clr Co", id_type: "PASSPORT", id_number: "P-16" }
              as: WeighMaster
              captures: { seller_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${seller_id}", gross_weight_lb: 50 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CAT_CONV", weight_lb: 5 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 10 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/report"
              payload: { reason: "serial match" }
              as: WeighMaster
            - call: "GET /yard/theft-reports"
              payload: { seller_id: "${seller_id}", status: "OPEN" }
              as: ComplianceOfficer
              captures: { report_id: "$.data[0].id" }
          trigger:
            - call: "POST /yard/theft-reports/${report_id}/clear"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "TheftReport.${report_id}.status == CLEARED"
            - "Seller.${seller_id}.open_theft_reports == 0"
            - "Seller.${seller_id}.status == ACTIVE"
