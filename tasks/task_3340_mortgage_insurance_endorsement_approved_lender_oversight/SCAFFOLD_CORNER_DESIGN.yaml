            - { call: "POST /mi/lenders", payload: { legal_name: "Shared GET Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
