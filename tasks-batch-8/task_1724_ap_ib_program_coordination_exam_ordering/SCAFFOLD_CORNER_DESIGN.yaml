              as: Teacher
              as_user_id: "${t3}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN (t3 holds no ASSIGNED ProctorAssignment on session ${se})"

      - name: coordinator_cannot_complete_training_returns_forbidden
        claim_type: rbac_exclusive_denial
        grounds: [roles.Teacher, "endpoints:POST /teacher-authorizations/{id}/complete-training", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: the coordinator who opened the authorization record cannot attest the training — complete-training is Teacher-only (403)."
        test_recipe:
          setup: ["Cycle; course; teacher t1; TA record PENDING_TRAINING"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "T One", email: "t1@x.edu" }
              as: ApCoordinator
              captures: { t1: $.data.id }
            - call: "POST /teacher-authorizations"
              payload: { teacher_id: "${t1}", course_id: "${co}" }
              as: ApCoordinator
              captures: { ta1: $.data.id }
          trigger:
            - call: "POST /teacher-authorizations/${ta1}/complete-training"
              as: ApCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN (complete-training is exclusive to the Teacher role)"
            - "TeacherAuthorization.${ta1}.status remains PENDING_TRAINING"

  # ---------------------------------------------------------------------------
  # Section: cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_rejected_and_version_increments
        claim_type: stale_version_occ
        grounds: ["concurrency_rules[exam-order-patch-stale-version]", "errors[ERR_STALE_VERSION]", "endpoints:PATCH /exam-orders/{id}"]
        distinguishing_aspect: "OCC on ExamOrder.version: a PATCH carrying the version observed at create (1) succeeds and bumps version to 2; replaying the same stale version is rejected 412 ERR_STALE_VERSION; a fresh read then carries the current version."
        test_recipe:
          setup: ["Cycle OPEN; course; one registration; DRAFT order (version 1 captured at create)"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /exam-orders"
              payload: { cycle_id: "${cy}" }
              as: ApCoordinator
              captures: { ord: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "PATCH /exam-orders/${ord}"
              payload: { expected_exam_order_version: "${ord_v}", adjustments: [{ course_id: "${co}", delta: 2 }] }
              as: ApCoordinator
              captures: { ord_v2: $.data.version }
            - call: "PATCH /exam-orders/${ord}"
              payload: { expected_exam_order_version: "${ord_v}", adjustments: [{ course_id: "${co}", delta: 3 }] }
              as: ApCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /exam-orders/${ord}"
              as: ApCoordinator
          assert:
            - "First PATCH succeeds: version becomes 2 (== ${ord_v} + 1) and the ${co} line ordered_count == 3 (1 registered + delta 2), estimate_total_cents == 29400"
            - "Second PATCH with the stale captured version: HTTP 412 and error_id == ERR_STALE_VERSION"
            - "Final GET: version == 2 and ordered_count still 3 (the rejected PATCH wrote nothing)"

      - name: cascading_side_effects_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Course.ACTIVE_to_SUSPENDED, state_machines.ExamSession.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Coverage note: multi-level cascade end-to-end."
        excluded_because:
          difficulty_instance: clock_sweep_expiry_cascade_depth3
          rationale: "That §1.8 instance verifies the three-link expiry cascade end to end."

      - name: dual_variant_calculation_stub
        claim_type: dual_variant_calculation
        grounds: [calculations.order_invoice, calculations.student_balance]
        distinguishing_aspect: "Coverage note: both dual-variant calculations."
        excluded_because:
          difficulty_instance: order_invoice_estimate_vs_final_divergence
          rationale: "Both variants are asserted with literals there (29400 vs 30900) and in student_balance_provisional_vs_projected_divergence (9800 vs 6200)."

      - name: derived_field_reconciliation_stub
        claim_type: derived_field_reconciliation
        grounds: [entities.Student.fields.balance_cents, entities.ExamCycle.fields.rebate_cents, entities.Course.fields.authorized_teacher_count]
        distinguishing_aspect: "Coverage note: derived fields recomputed after source mutations."
        excluded_because:
          difficulty_instance: fee_approval_cascade_depth2
          rationale: "That §1.8 instance asserts balance and rebate recomputation after approval (12400, 1116); seat/count reconciliation is asserted in register_cancel_conserves_session_seats and order_estimate_excludes_cancelled_registrations."

  # ---------------------------------------------------------------------------
  # Section: consistency model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: cancel_response_reflects_cascade_immediately
        claim_type: immediate_visibility
        grounds: [state_machines.ExamRegistration.REGISTERED_to_CANCELLED, entities.Student.fields.balance_cents]
        distinguishing_aspect: "Immediate consistency: the cancel response itself carries registration_status CANCELLED and score_status VOID, and the very next statement read already shows balance 0 — no lag, no reconciliation pass."
        test_recipe:
          setup: ["Cycle OPEN; course fee 9800; student with one registration (balance 9800)"]
          setup_api_calls:
            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-2027", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cy: $.data.id }
            - call: "POST /exam-cycles/${cy}/open"
              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cy}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /registrations/${r1}/cancel"
              as: Student
              as_user_id: "${s1}"
            - call: "GET /students/${s1}/statement"
              as: ApCoordinator
          assert:
            - "Cancel response data: registration_status == CANCELLED and score_status == VOID (mutation visible in its own response)"
            - "Immediate follow-up read: statement.balance_cents == 0 and projected_balance_cents == 0"
