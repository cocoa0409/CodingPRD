              as: Seller
              as_user_id: "${s1_id}"
              captures: { ap1: $.data.id }
            - call: "POST /appeals/${ap1}/start-review"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "DENIED", denial_reason: "RESTRICTED_PRODUCT_RISK", rationale: "The licence covers a different formulation than the one listed." }
