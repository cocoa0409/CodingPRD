    side_effects: []

  - method: POST
    path: "/scan-runs"
    description: "Queues a scan and immediately consumes one SCAN entitlement unit."
    roles: [PrivacyAgent, AccountOwner, Member]
    code: 201
    input: [profile_id, kind]
    output: ScanRun
    side_effects:
      - "creates a ScanRun row in QUEUED with entitlement_units_held 1"
      - "appends a SCAN CONSUME ledger entry with reason_code SCAN_QUEUED"
      - "lowers Account.scan_units_remaining by 1"

  - method: GET
    path: "/scan-runs"
    description: "FK reverse lookup for ScanRun.profile_id. Ordered by created_at ASC."
    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: ["profile_id?", "status?", "kind?", "limit?", "offset?"]
    output: ScanRun[]
    side_effects: []

  - method: GET
    path: "/scan-runs/{id}"
    description: "Reads one scan run including its three derived finding counters."
    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: []
    output: ScanRun
    side_effects: []

  - method: POST
    path: "/scan-runs/{id}/start"
    description: "Moves a queued scan into RUNNING."
    roles: [PrivacyAgent]
    code: 200
    input: []
    output: ScanRun
    side_effects:
      - "ScanRun QUEUED -> RUNNING, stamps started_at"
      - "increments ScanRun.version by 1"

  - method: POST
    path: "/scan-runs/{id}/findings"
    description: "Records one broker hit against a RUNNING scan. Runs calculations.exposure_candidate_selection then calculations.reappearance_classification and returns the ExposureRecord that was created (FRESH) or mutated (REAPPEARANCE / RESIGHTING)."
    roles: [PrivacyAgent]
    code: 200
    input: [broker_id, exposure_kind, source_url]
    output: ExposureRecord
    side_effects:
      - "FRESH: creates a new ExposureRecord in FOUND with discovered_by_scan_id set to this scan"
      - "REAPPEARANCE: mutates the existing row SUPPRESSED|RE_SUPPRESSED -> REAPPEARED, increments its reappearance_count, leaves suppression_count and first_found_at intact, creates no new row"
      - "RESIGHTING: refreshes last_seen_at on the existing FOUND|REAPPEARED row and changes nothing else"
      - "increments ScanRun.findings_count"

  - method: POST
    path: "/scan-runs/{id}/complete"
    description: "Completes a running scan and stamps the profile's last_completed_scan_at, which is what the 7-day recurring-scan interval is measured from."
    roles: [PrivacyAgent]
    code: 200
    input: []
    output: ScanRun
    side_effects:
      - "ScanRun RUNNING -> COMPLETED, stamps completed_at"
      - "sets MonitoredProfile.last_completed_scan_at to current_utc"
      - "increments ScanRun.version by 1"

  - method: POST
    path: "/scan-runs/{id}/fail"
    description: "Marks a running scan FAILED."
    roles: [PrivacyAgent]
    code: 200
    input: [failure_reason]
    output: ScanRun
    side_effects:
      - "ScanRun RUNNING -> FAILED"
      - "increments ScanRun.version by 1"

  - method: POST
    path: "/scan-runs/{id}/retry"
    description: "Requeues a failed scan; capped at MAX_SCAN_RETRIES (2)."
    roles: [PrivacyAgent]
    code: 200
    input: []
    output: ScanRun
    side_effects:
      - "ScanRun FAILED -> QUEUED, increments retry_count"
      - "consumes no additional SCAN unit"
      - "increments ScanRun.version by 1"

  - method: POST
    path: "/scan-runs/{id}/cancel"
    description: "Cancels a QUEUED or FAILED scan and releases its SCAN unit (reason_code SCAN_CANCELLED from QUEUED, SCAN_ABANDONED from FAILED)."
    roles: [PrivacyAgent, AccountOwner, Member]
    code: 200
    input: []
    output: ScanRun
    side_effects:
      - "ScanRun -> CANCELLED, sets entitlement_units_held to 0"
      - "appends a SCAN RELEASE ledger entry"
      - "raises Account.scan_units_released and scan_units_remaining by 1"
      - "increments ScanRun.version by 1"

  - method: GET
    path: "/exposures"
    description: "FK reverse lookup for ExposureRecord.profile_id, .broker_id and .discovered_by_scan_id. Ordered by created_at ASC."
    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: ["profile_id?", "broker_id?", "discovered_by_scan_id?", "status?", "limit?", "offset?"]
    output: ExposureRecord[]
    side_effects: []

  - method: GET
    path: "/exposures/{id}"
    description: "Reads one exposure including fee_exempt, suppression_count and reappearance_count."
    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: []
    output: ExposureRecord
    side_effects: []

  - method: POST
    path: "/removal-requests"
    description: "Drafts an opt-out request against one exposure. Runs calculations.exposure_channel_occupancy then calculations.removal_entitlement_draw."
    roles: [PrivacyAgent, AccountOwner, Member]
    code: 201
    input: [exposure_id]
    output: RemovalRequest
    side_effects:
      - "creates a RemovalRequest in DRAFTED, copying broker_id from the exposure and member_id from the exposure's profile"
      - "when the exposure is not fee_exempt: appends a REMOVAL CONSUME ledger entry (reason_code REMOVAL_DRAFTED) and sets entitlement_units_consumed to 1"
      - "when the exposure is fee_exempt (status REAPPEARED): writes no ledger entry and sets entitlement_units_consumed to 0"

  - method: GET
    path: "/removal-requests"
    description: "FK reverse lookup for RemovalRequest.exposure_id, .broker_id and .member_id. Ordered by created_at ASC."
    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: ["exposure_id?", "broker_id?", "member_id?", "status?", "limit?", "offset?"]
    output: RemovalRequest[]
    side_effects: []

  - method: GET
    path: "/removal-requests/{id}"
    description: "Reads one removal request including sla_deadline_at, deadline_variant and on_time."
    roles: [PlatformAdmin, PrivacyAgent, AccountOwner, Member, Auditor]
    code: 200
    input: []
    output: RemovalRequest
    side_effects: []

  - method: POST
    path: "/removal-requests/{id}/submit"
    description: "Sends the request to the broker and stamps the SLA deadline from calculations.removal_sla_deadline. The variant depends on whether the from-state is DRAFTED or ESCALATED."
    roles: [PrivacyAgent]
    code: 200
    input: []
    output: RemovalRequest
    side_effects:
      - "RemovalRequest DRAFTED -> SUBMITTED (deadline_variant BASE) or ESCALATED -> SUBMITTED (deadline_variant ESCALATED_RESUBMISSION)"
      - "stamps submitted_at, submitted_by_agent_id, effective_window_days and sla_deadline_at"
      - "increments RemovalRequest.version by 1"

  - method: POST
    path: "/removal-requests/{id}/acknowledge"
    description: "Records the broker's acknowledgement ticket."
    roles: [PrivacyAgent]
    code: 200
    input: [broker_reference]
    output: RemovalRequest
    side_effects:
      - "RemovalRequest SUBMITTED -> ACKNOWLEDGED, stamps acknowledged_at"
      - "increments RemovalRequest.version by 1"

  - method: POST
    path: "/removal-requests/{id}/complete"
    description: "Records a successful removal. Enforces segregation of duties and runs the exposure-suppression cascade."
    roles: [PrivacyAgent]
    code: 200
    input: []
    output: RemovalRequest
    side_effects:
      - "RemovalRequest ACKNOWLEDGED -> COMPLETED, stamps closed_at and completed_by_agent_id"
      - "cascade hop 2: the linked ExposureRecord FOUND -> SUPPRESSED or REAPPEARED -> RE_SUPPRESSED, suppression_count incremented"
      - "cascade hop 3: the exposure's MonitoredProfile re-derives open_exposure_count and suppressed_exposure_count"
      - "the Broker re-derives on_time_completion_count and compliance_score"
      - "increments RemovalRequest.version by 1"

  - method: POST
    path: "/removal-requests/{id}/reject"
    description: "Records a broker rejection. The consumed REMOVAL unit is deliberately NOT refunded."
    roles: [PrivacyAgent]
    code: 200
    input: [rejection_reason_code]
    output: RemovalRequest
    side_effects:
      - "RemovalRequest ACKNOWLEDGED -> REJECTED, stamps closed_at"
      - "the Broker re-derives rejected_request_count and compliance_score"
      - "increments RemovalRequest.version by 1"

  - method: POST
    path: "/removal-requests/{id}/expire"
    description: "Marks a request expired once its SLA deadline has been reached (inclusive boundary)."
    roles: [PrivacyAgent, PlatformAdmin]
    code: 200
    input: []
    output: RemovalRequest
    side_effects:
      - "RemovalRequest SUBMITTED|ACKNOWLEDGED -> EXPIRED, stamps closed_at"
      - "the Broker re-derives expired_request_count and compliance_score"
      - "increments RemovalRequest.version by 1"

  - method: POST
    path: "/removal-requests/{id}/escalate"
    description: "Escalates a rejected or expired request so it can be resubmitted on the shorter escalation window; capped at MAX_ESCALATIONS (2)."
    roles: [PrivacyAgent]
    code: 200
    input: []
    output: RemovalRequest
    side_effects:
      - "RemovalRequest REJECTED|EXPIRED -> ESCALATED, increments escalation_count, clears closed_at"
      - "the Broker re-derives expired_request_count / rejected_request_count (the row leaves those input sets) and therefore compliance_score"
      - "increments RemovalRequest.version by 1"

  - method: POST
    path: "/removal-requests/{id}/void"
    description: "Abandons a request that has not yet been handed to the broker and refunds its REMOVAL unit."
    roles: [PrivacyAgent, AccountOwner, Member]
    code: 200
    input: []
    output: RemovalRequest
    side_effects:
      - "RemovalRequest DRAFTED -> VOIDED, stamps closed_at"
      - "when entitlement_units_consumed is 1: appends a REMOVAL RELEASE ledger entry (reason_code REMOVAL_VOIDED) and sets entitlement_units_released to 1"
      - "raises Account.removal_units_remaining and lowers Member.removal_units_consumed_this_cycle"
      - "increments RemovalRequest.version by 1"

  - method: POST
    path: "/breach-events"
