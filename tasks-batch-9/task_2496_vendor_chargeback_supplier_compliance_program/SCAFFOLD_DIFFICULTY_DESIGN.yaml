  - rule_id: cross_entity_state_dependency
    instances:
      - name: violation_creation_depends_on_shipment_receipt_state
        grounds:
          - validations[priority=8]
          - errors.ERR_SHIPMENT_NOT_RECEIVED
          - state_machines.Shipment.IN_TRANSIT_to_RECEIVED
          - endpoints[POST /compliance/shipments/{id}/violations]
        distinguishing_aspect: |
          ENTITY PAIR ComplianceViolation -> Shipment. Creating a ComplianceViolation is legal only
          when the OTHER entity, its Shipment, has reached RECEIVED; while the shipment is
          IN_TRANSIT the same payload must be refused with ERR_SHIPMENT_NOT_RECEIVED, and the
          identical call must succeed once the shipment is received - nothing about the violation
          payload changes, only the parent's state.
        test_recipe:
          setup:
            - "Vendor V-1301 with a PUBLISHED guide RG-2026-A carrying TIER_1 SHP-04."
            - "One shipment of 1000 units still IN_TRANSIT: no received_units, no arrived_at, invoice_value_cents 0."
