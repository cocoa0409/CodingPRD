            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_a}", shop_line: "R24-SHOP-2", scheduled_start_date: "2026-10-01", scheduled_end_date: "2026-10-03", component_qty_consumed: 1 }
              as: ProductionPlanner
              captures: { ok_wo_id: $.data.id, ok_wo_status: $.data.status, ok_wo_days: $.data.shop_days }
            - call: "GET /api/v1/retrofit-program-car-types?retrofit_program_id=${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { covered_type: "$.data[0].car_type_id" }
            - call: "GET /api/v1/lease-fleet-cars/${car_b}"
              payload: {}
              as: PlatformAdmin
              captures: { car_b_status: $.data.status }
            - call: "GET /api/v1/lease-fleet-cars/${car_a}"
              payload: {}
              as: PlatformAdmin
              captures: { car_a_status: $.data.status }
          assert:
            - "LeaseFleetCar ${car_b}.car_type_id == ${car_b_type} == ${ct_b} and LeaseFleetCar ${car_a}.car_type_id == ${car_a_type} == ${ct_a}"
            - "The coverage surface holds exactly one row: GET /api/v1/retrofit-program-car-types?retrofit_program_id=${prog_id} lists car_type_id == ${covered_type} == ${ct_a}, so ${ct_b} is uncovered"
            - "The uncovered work order returns HTTP 409 with data.error_id == ${err_capacity} == \"ERR_CAPACITY_EXCEEDED\""
            - "The identical call against the covered type is accepted with HTTP 201, id ${ok_wo_id}, data.status == ${ok_wo_status} == \"SCHEDULED\" and shop_days == ${ok_wo_days} == 2 == required_shop_days_per_car"
            - "LeaseFleetCar ${car_b}.status == ${car_b_status} == \"HELD\", untouched by the rejected call, while LeaseFleetCar ${car_a}.status == ${car_a_status} == \"UNDER_REPAIR\" after the accepted one"
            - "The program was never started: RetrofitProgram ${prog_id}.status == ${prog_status} == \"PLANNED\", so the rejection is the coverage check and not an enrollment or deadline check"
