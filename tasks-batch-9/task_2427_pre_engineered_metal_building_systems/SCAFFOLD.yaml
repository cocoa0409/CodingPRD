scenario: |
  Generate task harder than expert level!

  2427. Pre-Engineered Metal Building Systems (metal building manufacturer): building configuration with clear span, bay spacing, roof pitch and loading criteria by jurisdiction, engineering design with frame optimization and connection detailing under building code load combinations, sealed drawing production for permitting with local code and wind zone requirements, primary frame fabrication with plate cutting, welding and painting, secondary member roll-forming and panel production with color and profile options, order accessory kits for doors, windows, insulation and ventilation, builder network authorization, quoting tools and territory management, shipment sequencing to match erection order at the site

domain_name: pre-engineered-metal-building-systems
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  # Peer entities linked by explicit foreign keys; URL paths are two-segment
  # collections (`/orders/{id}`), never nested ownership chains. Only two
  # sub-resource reads exist (accessory kits, design components) because those
  # children are never addressed by their own id.
  state_machine_shape: parallel
  # Order carries two independent state dimensions (engineering_status ×
  # production_status); production_status is additionally compound (derived from
  # its ProductionLot children), and EngineeringDesign / BuildingConfiguration /
  # Builder are cyclic.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  # Peer operational roles (each owns its own resource type) plus a hard
  # same-user prohibition: the user who submits an EngineeringDesign may not be
  # the user who reviews it.
  consistency_model: immediate
  difficulty_level: "beyond Expert — 12 entities, 50 endpoints, 47 error codes, 11 calculations (2 dual-variant), 8 state machines, 2 OCC rules"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: unique jurisdiction code used on permit paperwork
        constraints: "unique; 3-32 chars; uppercase alphanumeric and hyphen"
      - name: name
        type: string
        source: input
        description: authority-having-jurisdiction display name
      - name: state_code
        type: string
        source: input
        description: two-letter US state code the jurisdiction sits in; sealing license state must equal this
        constraints: "exactly 2 uppercase letters"
      - name: territory_code
        type: string
        source: input
        description: sales territory this jurisdiction belongs to; builder authorization limits are counted per territory_code
        constraints: "3-16 chars"
      - name: freight_zone
        type: integer
        source: input
        description: freight rate zone selecting FREIGHT_RATE_CENTS_PER_TON_MILE
        constraints: "1..5"
      - name: max_authorized_builders
        type: integer
        source: input
        description: maximum number of Builders with status AUTHORIZED allowed in this jurisdiction's territory_code
        default: 2
        constraints: ">= 1"
      - name: exposure_category
        type: enum
        source: input
        description: wind exposure category selecting EXPOSURE_KZ
        constraints: "one of B, C, D"
      - name: design_wind_speed_mph
        type: number
        source: input
        description: ultimate design wind speed V for the local wind zone
        constraints: "> 0"
      - name: ground_snow_load_psf
        type: number
        source: input
        description: ground snow load pg used to derive the roof snow load
        constraints: ">= 0"
      - name: seismic_design_category
        type: enum
        source: input
        description: local seismic design category recorded on sealed drawings
        constraints: "one of A, B, C, D"
      - name: criteria_revision
        type: integer
        source: computed
        description: monotonic counter incremented by POST /jurisdictions/{id}/loading-criteria; configurations pin this value at lock time
        default: 1
      - name: authorized_builder_count
        type: integer
        source: computed
        description: count of Builders whose territory_code equals this jurisdiction's territory_code and whose status == AUTHORIZED
        default: 0

  - name: Builder
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; home jurisdiction whose territory_code the builder is authorized in
      - name: name
        type: string
        source: input
        description: builder-of-record business name
      - name: territory_code
        type: string
        source: computed
        description: copied from the referenced Jurisdiction.territory_code at creation
      - name: tier
        type: enum
        source: input
        description: network tier selecting TIER_DISCOUNT_RATE
        constraints: "one of BRONZE, SILVER, GOLD"
      - name: credit_limit_cents
        type: integer
        source: input
        description: maximum committed order value the builder may carry
        constraints: ">= 0"
      - name: credit_used_cents
        type: integer
        source: computed
        description: committed order value; incremented on quote acceptance and adjusted by the final-price delta at release
        default: 0
      - name: credit_available_cents
        type: integer
        source: computed
        description: credit_limit_cents - credit_used_cents; conserved quantity of the credit invariant
      - name: status
        type: enum
        source: computed
        description: authorization state in the builder network
        default: PENDING_AUTHORIZATION
        constraints: "one of PENDING_AUTHORIZATION, AUTHORIZED, SUSPENDED"
      - name: authorized_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent authorize transition; null before first authorization

  - name: BuildingConfiguration
    parent: null
    common_fields: true
    fields:
      - name: builder_id
        type: string
        source: input
        description: FK -> Builder.id; builder the configuration is being priced for
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; jurisdiction supplying the loading criteria
      - name: clear_span_ft
        type: number
        source: input
        description: frame clear span in feet
        constraints: "20..200"
      - name: bay_spacing_ft
        type: number
        source: input
        description: distance between primary frames in feet
        constraints: "15..30"
      - name: bay_count
        type: integer
        source: input
        description: number of bays along the building length
        constraints: "1..40"
      - name: eave_height_ft
        type: number
        source: input
        description: eave height in feet, drives the wind height factor
        constraints: "10..60"
      - name: roof_pitch_rise_per_12
        type: number
        source: input
        description: roof rise per 12 units of run
        constraints: "0.25..6"
      - name: panel_profile
        type: enum
        source: input
        description: panel profile selecting PANEL_DEAD_PSF and PANEL_RATE_CENTS_PER_SQFT
        constraints: "one of PBR, STANDING_SEAM, R_PANEL"
      - name: panel_color
        type: enum
        source: input
        description: finish color a PANEL_RUN ProductionLot must match
        constraints: "one of POLAR_WHITE, GALVALUME, BRIGHT_RED, EVERGREEN"
      - name: insulation_r_value
        type: integer
        source: input
        description: insulation R-value contributing to dead load
        constraints: "one of 0, 13, 19, 25"
      - name: building_length_ft
        type: number
        source: computed
        description: bay_spacing_ft * bay_count
      - name: footprint_sqft
        type: number
        source: computed
        description: clear_span_ft * building_length_ft
      - name: roof_slope_factor
        type: number
        source: computed
        description: sqrt(144 + roof_pitch_rise_per_12^2) / 12, rounded to 4 decimals
      - name: panel_area_sqft
        type: number
        source: computed
        description: rounded roof panel area plus rounded wall panel area
      - name: design_wind_pressure_psf
        type: number
        source: computed
        description: velocity pressure times pressure coefficient times height factor
      - name: dead_load_psf
        type: number
        source: computed
        description: panel plus frame allowance plus insulation dead load
      - name: roof_snow_load_psf
        type: number
        source: computed
        description: ground_snow_load_psf times SNOW_ROOF_FACTOR
      - name: estimated_frame_weight_lbs
        type: number
        source: computed
        description: parametric frame weight estimate used by the PRELIMINARY quote variant
      - name: criteria_revision_at_lock
        type: integer
        source: computed
        description: Jurisdiction.criteria_revision captured at the moment of lock; a later jurisdiction revision makes this configuration CRITERIA_STALE
      - name: status
        type: enum
        source: computed
        description: configuration lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, LOCKED, CRITERIA_STALE"
      - name: locked_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent lock transition; null while DRAFT

  - name: AccessoryKit
    parent: BuildingConfiguration
    common_fields: true
    fields:
      - name: configuration_id
        type: string
        source: input
        description: FK -> BuildingConfiguration.id; configuration the kit is ordered against
      - name: kit_type
        type: enum
        source: input
        description: accessory family
        constraints: "one of WALK_DOOR, OVERHEAD_DOOR, WINDOW, INSULATION, VENTILATION"
      - name: quantity
        type: integer
        source: input
        description: number of kits ordered
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: catalog price of one kit in cents
        constraints: ">= 0"
      - name: unit_weight_lbs
        type: number
        source: input
        description: shipping weight of one kit in pounds
        constraints: ">= 0"
      - name: erection_stage
        type: enum
        source: input
        description: erection stage at which the kit is installed on site
        constraints: "one of ANCHORAGE, PRIMARY_FRAME, SECONDARY_FRAME, ROOF_PANEL, WALL_PANEL, TRIM_ACCESSORY"
      - name: extended_price_cents
        type: integer
        source: computed
        description: unit_price_cents * quantity
      - name: extended_weight_lbs
        type: number
        source: computed
        description: round_half_up(unit_weight_lbs * quantity, 2)

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: builder_id
        type: string
        source: input
        description: FK -> Builder.id; builder being quoted
      - name: configuration_id
        type: string
        source: input
        description: FK -> BuildingConfiguration.id; locked configuration being priced
      - name: freight_distance_miles
        type: number
        source: input
        description: shipping distance from plant to job site
        constraints: "> 0"
      - name: adjustment_cents
        type: integer
        source: input
        description: signed commercial adjustment applied before discounting
        default: 0
      - name: quote_variant
        type: enum
        source: computed
        description: pricing variant used to produce quoted_price_cents; always PRELIMINARY on a Quote row
        default: PRELIMINARY
        constraints: "one of PRELIMINARY, FINAL"
      - name: billable_frame_weight_lbs
        type: number
        source: computed
        description: frame weight the steel cost is billed on; the configuration's estimated_frame_weight_lbs under the PRELIMINARY variant
      - name: steel_cost_cents
        type: integer
        source: computed
        description: round_half_up(billable_frame_weight_lbs * STEEL_RATE_CENTS_PER_LB, 0)
      - name: panel_cost_cents
        type: integer
        source: computed
        description: round_half_up(panel_area_sqft * PANEL_RATE_CENTS_PER_SQFT[panel_profile], 0)
      - name: accessory_cost_cents
        type: integer
        source: computed
        description: sum of extended_price_cents over the configuration's AccessoryKit rows
      - name: subtotal_cents
        type: integer
        source: computed
        description: steel_cost_cents + panel_cost_cents + accessory_cost_cents
      - name: billable_weight_lbs
        type: number
        source: computed
        description: billable_frame_weight_lbs plus summed AccessoryKit extended_weight_lbs
      - name: billable_tons
        type: number
        source: computed
        description: round_half_up(billable_weight_lbs / 2000, 3)
      - name: freight_cost_cents
        type: integer
        source: computed
        description: round_half_up(billable_tons * FREIGHT_RATE_CENTS_PER_TON_MILE[freight_zone] * freight_distance_miles, 0)
      - name: pre_discount_total_cents
        type: integer
        source: computed
        description: subtotal_cents + adjustment_cents + freight_cost_cents; this is the value the volume tier is keyed on
      - name: tier_discount_rate
        type: number
        source: computed
        description: TIER_DISCOUNT_RATE[builder.tier]
      - name: volume_discount_rate
        type: number
        source: computed
        description: volume tier rate selected by pre_discount_total_cents
      - name: total_discount_rate
        type: number
        source: computed
        description: min(MAX_DISCOUNT_RATE, tier_discount_rate + volume_discount_rate)
      - name: quoted_price_cents
        type: integer
        source: computed
        description: round_half_up(pre_discount_total_cents * (1 - total_discount_rate), 0)
      - name: valid_until
        type: datetime
        source: computed
        description: issued_at plus QUOTE_VALID_DAYS; acceptance after this instant is rejected
      - name: issued_at
        type: datetime
        source: computed
        description: logical-clock instant of the issue transition; null while DRAFT
      - name: status
        type: enum
        source: computed
        description: quote lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, ACCEPTED"

  - name: EngineeringDesign
    parent: null
    common_fields: true
    fields:
      - name: configuration_id
        type: string
        source: input
        description: FK -> BuildingConfiguration.id; LOCKED configuration the design is engineered against
      - name: design_variant
        type: enum
        source: input
        description: load combination family applied to this design
        constraints: "one of ASD, LRFD"
      - name: governing_combination
        type: enum
        source: computed
        description: load combination producing the largest rounded factored roof pressure within the chosen variant
        constraints: "one of ASD_D_PLUS_S, ASD_D_PLUS_0_6W, ASD_D_PLUS_0_75S_PLUS_0_45W, LRFD_1_4D, LRFD_1_2D_PLUS_1_6S, LRFD_1_2D_PLUS_1_0W_PLUS_0_5S"
      - name: governing_load_psf
        type: number
        source: computed
        description: rounded pressure of the governing combination
      - name: tributary_load_kip_per_ft
        type: number
        source: computed
        description: round_half_up(governing_load_psf * bay_spacing_ft / 1000, 6)
      - name: required_moment_kip_ft
        type: number
        source: computed
        description: round_half_up(tributary_load_kip_per_ft * clear_span_ft^2 / 8, 2)
      - name: frame_weight_lbs
        type: number
        source: computed
        description: summed line weights of PRIMARY_FRAME_MEMBER and SECONDARY_MEMBER components; the FINAL quote variant bills on this
        default: 0
      - name: shippable_weight_lbs
        type: number
        source: computed
        description: summed line weights of every DesignComponent regardless of component_class
        default: 0
      - name: component_count
        type: integer
        source: computed
        description: number of DesignComponent rows attached to this design
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: number of completed revise transitions; capped by MAX_DESIGN_REVISIONS
        default: 0
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the Engineer who performed the most recent submit; null while never submitted
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the EngineeringManager who performed the most recent review; must differ from submitted_by_user_id
      - name: status
        type: enum
        source: computed
        description: design lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, REVISION_REQUIRED, SUPERSEDED, VOIDED"

  - name: DesignComponent
    parent: EngineeringDesign
    common_fields: false
    fields:
      - name: design_id
        type: string
        source: input
        description: FK -> EngineeringDesign.id; design this component belongs to
      - name: component_class
        type: enum
        source: input
        description: role of the component in the building; CONNECTION_DETAIL rows carry no weight fields
        constraints: "one of PRIMARY_FRAME_MEMBER, SECONDARY_MEMBER, PANEL_BUNDLE, ANCHOR_PACKAGE, CONNECTION_DETAIL"
      - name: mark
        type: string
        source: input
        description: shop mark used on drawings and on shipment load manifests
        constraints: "unique within the design; 1-12 chars"
      - name: member_type
        type: enum
        source: input
        description: fabrication family of the component
        constraints: "one of COLUMN, RAFTER, PURLIN, GIRT, PANEL, ANCHOR_BOLT, DETAIL"
      - name: erection_stage
        type: enum
        source: input
        description: erection stage the component is installed at; a ShipmentLoad may only carry marks whose erection_stage equals the load's
        constraints: "one of ANCHORAGE, PRIMARY_FRAME, SECONDARY_FRAME, ROOF_PANEL, WALL_PANEL, TRIM_ACCESSORY"
      - name: quantity
        type: integer
        source: input
        description: number of identical pieces under this mark; required unless component_class == CONNECTION_DETAIL
        constraints: ">= 1 when present"
      - name: length_ft
        type: number
        source: input
        description: piece length in feet; required unless component_class == CONNECTION_DETAIL
        constraints: "> 0 when present"
      - name: weight_per_ft
        type: number
        source: input
        description: pounds per linear foot; required unless component_class == CONNECTION_DETAIL
        constraints: "> 0 when present"
      - name: connection_type
        type: enum
        source: input
        description: detailed connection; required when component_class == CONNECTION_DETAIL, forbidden otherwise
        constraints: "one of KNEE, BASE, RIDGE, ENDWALL"
      - name: capacity_moment_kip_ft
        type: number
        source: input
        description: detailed moment capacity; required when component_class == CONNECTION_DETAIL, forbidden otherwise
        constraints: ">= 0 when present"
      - name: unit_weight_lbs
        type: number
        source: computed
        description: round_half_up(length_ft * weight_per_ft, 2); 0 for CONNECTION_DETAIL
        default: 0
      - name: line_weight_lbs
        type: number
        source: computed
        description: round_half_up(unit_weight_lbs * quantity, 2); 0 for CONNECTION_DETAIL
        default: 0

  - name: DrawingPackage
    parent: null
    common_fields: true
    fields:
      - name: design_id
        type: string
        source: input
        description: FK -> EngineeringDesign.id; APPROVED design the sheets are produced from
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; permitting jurisdiction whose state_code the sealing license must match
      - name: sealing_license_state
        type: string
        source: input
        description: two-letter state code of the professional engineer license used to seal
        constraints: "exactly 2 uppercase letters"
      - name: sheet_count
        type: integer
        source: input
        description: number of sheets in the permit set
        constraints: ">= 1"
      - name: criteria_revision_at_seal
        type: integer
        source: computed
        description: Jurisdiction.criteria_revision captured at the seal transition; null while PENDING
      - name: sealed_at
        type: datetime
        source: computed
        description: logical-clock instant of the seal transition; null while PENDING
      - name: sealed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the SealingEngineer who sealed the package
      - name: status
        type: enum
        source: computed
        description: drawing package lifecycle state
        default: PENDING
        constraints: "one of PENDING, SEALED, VOIDED"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: FK -> Quote.id; accepted quote the order was minted from
      - name: builder_id
        type: string
        source: computed
        description: FK -> Builder.id; copied from the accepted quote
      - name: configuration_id
        type: string
        source: computed
        description: FK -> BuildingConfiguration.id; copied from the accepted quote
      - name: engineering_design_id
        type: string
        source: computed
        description: FK -> EngineeringDesign.id; set when a design for this order's configuration is APPROVED; null before that
      - name: drawing_package_id
        type: string
        source: computed
        description: FK -> DrawingPackage.id; set when a package for this order's approved design is SEALED; null before that
      - name: job_site_code
        type: string
        source: input
        description: job site identifier; unload-window capacity is aggregated across every Order sharing this code
        constraints: "3-16 chars"
      - name: requested_erection_start_date
        type: datetime
        source: input
        description: builder's requested first day of erection
      - name: site_delivery_capacity
        type: integer
        source: input
        description: maximum number of already-booked loads whose closed unload windows a new load may overlap at this job site
        default: 2
        constraints: ">= 1"
      - name: engineering_status
        type: enum
        source: computed
        description: engineering dimension of the order state, independent of production_status
        default: ENG_PENDING
        constraints: "one of ENG_PENDING, ENG_APPROVED, ENG_SEALED, ENG_REWORK"
      - name: production_status
        type: enum
        source: computed
        description: production dimension of the order state, derived from release plus ProductionLot children and hold flags
        default: PROD_NOT_RELEASED
        constraints: "one of PROD_NOT_RELEASED, PROD_RELEASED, PROD_IN_FABRICATION, PROD_COMPLETE, PROD_HOLD"
      - name: permit_hold
        type: boolean
        source: computed
        description: true once a jurisdiction loading-criteria revision voided this order's sealed drawings
        default: false
      - name: commercial_hold
        type: boolean
        source: computed
        description: true once the order's builder was suspended
        default: false
      - name: final_price_cents
        type: integer
        source: computed
        description: FINAL-variant price computed at release-to-fabrication; null before release
      - name: price_delta_cents
        type: integer
        source: computed
        description: final_price_cents - quote.quoted_price_cents; the amount the builder's credit_used_cents moves at release
      - name: total_shippable_weight_lbs
        type: number
        source: computed
        description: design shippable_weight_lbs plus summed AccessoryKit extended_weight_lbs, fixed at release
        default: 0
      - name: assigned_weight_lbs
        type: number
        source: computed
        description: summed gross_weight_lbs of this order's ShipmentLoads with status in PLANNED or DISPATCHED
        default: 0
      - name: unassigned_weight_lbs
        type: number
        source: computed
        description: total_shippable_weight_lbs - assigned_weight_lbs; conserved quantity of the pounds invariant
        default: 0
      - name: released_at
        type: datetime
        source: computed
        description: logical-clock instant of release-to-fabrication; null before release and after cancel-release

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: plant line code
        constraints: "unique; 2-16 chars"
      - name: name
        type: string
        source: input
        description: line display name
      - name: line_type
        type: enum
        source: input
        description: fabrication capability of the line; must match the lot_type being scheduled
        constraints: "one of PLATE_CUT_WELD, ROLL_FORM, PANEL_ROLL"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: paint changeover buffer applied between two lots of different paint_color on this line
        default: 120
        constraints: ">= 0"

  - name: ProductionLot
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> Order.id; released order being fabricated
      - name: line_id
        type: string
        source: input
        description: FK -> ProductionLine.id; line the lot occupies
      - name: lot_type
        type: enum
        source: input
        description: fabrication step; must map to the line's line_type
        constraints: "one of PRIMARY_FRAME_FAB, SECONDARY_ROLL_FORM, PANEL_RUN"
      - name: paint_color
        type: enum
        source: input
        description: paint color run on the line for this lot; for lot_type PANEL_RUN it must equal the configuration's panel_color
        constraints: "one of POLAR_WHITE, GALVALUME, BRIGHT_RED, EVERGREEN"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the line occupation window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the line occupation window
      - name: status
        type: enum
        source: computed
        description: lot lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETE, CANCELLED"
      - name: completed_at
        type: datetime
        source: computed
        description: logical-clock instant of the complete transition; null otherwise

  - name: ShipmentLoad
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> Order.id; released order the load ships against
      - name: carrier_name
        type: string
        source: input
        description: trucking carrier for the load
      - name: erection_stage
        type: enum
        source: input
        description: erection stage every mark on this load must belong to
        constraints: "one of ANCHORAGE, PRIMARY_FRAME, SECONDARY_FRAME, ROOF_PANEL, WALL_PANEL, TRIM_ACCESSORY"
      - name: component_marks
        type: array
        source: input
        description: DesignComponent.mark values carried on this load, resolved against the order's engineering_design_id
        constraints: "non-empty; no duplicates; each mark unassigned on any PLANNED or DISPATCHED load of the same order"
      - name: stage_sequence
        type: integer
        source: computed
        description: ERECTION_STAGE_SEQUENCE[erection_stage]; dispatch order is ascending in this value
      - name: gross_weight_lbs
        type: number
        source: computed
        description: summed line_weight_lbs of the resolved component marks
      - name: unload_window_start
        type: datetime
        source: input
        description: inclusive start of the closed site unload window
      - name: unload_window_end
        type: datetime
        source: input
        description: inclusive end of the closed site unload window
      - name: status
        type: enum
        source: computed
        description: load lifecycle state
        default: PLANNED
        constraints: "one of PLANNED, DISPATCHED, CANCELLED"
      - name: dispatched_at
        type: datetime
        source: computed
        description: logical-clock instant of the dispatch transition; null otherwise

state_machines:
  - entity: Builder
    initial_state: PENDING_AUTHORIZATION
    terminal_states: []
    transitions:
      - from: PENDING_AUTHORIZATION
        to: AUTHORIZED
        trigger: "POST /builders/{id}/authorize"
        actor: PlatformAdmin
        preconditions:
          - "builder.status == PENDING_AUTHORIZATION"
          - "count of Builders with territory_code == builder.territory_code and status == AUTHORIZED < jurisdiction.max_authorized_builders"
        side_effects:
          - "sets builder.status = AUTHORIZED"
          - "sets builder.authorized_at = current logical clock"
          - "recomputes Jurisdiction.authorized_builder_count for every Jurisdiction sharing builder.territory_code"
          - "increments Builder.version by 1"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /builders/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "builder.status == AUTHORIZED"
        side_effects:
          - "sets builder.status = SUSPENDED"
          - "recomputes Jurisdiction.authorized_builder_count for every Jurisdiction sharing builder.territory_code"
          - "cascade hop 1: every Order with order.builder_id == builder.id whose production_status is in {PROD_NOT_RELEASED, PROD_RELEASED, PROD_IN_FABRICATION} gets commercial_hold = true and production_status recomputed to PROD_HOLD"
          - "cascade hop 2: because those Orders became commercial_hold, every ShipmentLoad of those Orders with status == PLANNED transitions to CANCELLED"
          - "cascade hop 3: because those ShipmentLoads were cancelled, each affected Order's assigned_weight_lbs and unassigned_weight_lbs are recomputed by order_shippable_weight_ledger"
          - "increments Builder.version by 1 and Order.version by 1 for each cascaded Order and ShipmentLoad.version by 1 for each cascaded load"
        note: "Cascade B of Rule 4 — depth 3, each hop caused by the previous hop."
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /builders/{id}/authorize"
        actor: PlatformAdmin
        preconditions:
          - "builder.status == SUSPENDED"
          - "count of Builders with territory_code == builder.territory_code and status == AUTHORIZED < jurisdiction.max_authorized_builders"
        side_effects:
          - "sets builder.status = AUTHORIZED"
          - "sets builder.authorized_at = current logical clock"
          - "clears commercial_hold on every Order with order.builder_id == builder.id and recomputes each order's production_status"
          - "increments Builder.version by 1"
        note: "Cyclic shape: AUTHORIZED -> SUSPENDED -> AUTHORIZED. Cancelled ShipmentLoads are NOT resurrected."

  - entity: BuildingConfiguration
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /building-configurations/{id}/lock"
        actor: SalesEngineer
        preconditions:
          - "configuration.status == DRAFT"
          - "builder.status == AUTHORIZED"
        side_effects:
          - "runs configuration_geometry_and_loads and stores building_length_ft, footprint_sqft, roof_slope_factor, panel_area_sqft, design_wind_pressure_psf, dead_load_psf, roof_snow_load_psf, estimated_frame_weight_lbs"
          - "sets criteria_revision_at_lock = jurisdiction.criteria_revision"
          - "sets locked_at = current logical clock"
          - "sets configuration.status = LOCKED"
          - "increments BuildingConfiguration.version by 1"
      - from: LOCKED
        to: CRITERIA_STALE
        trigger: "system: POST /jurisdictions/{id}/loading-criteria raised Jurisdiction.criteria_revision above configuration.criteria_revision_at_lock"
        actor: system
        preconditions:
          - "configuration.status == LOCKED"
          - "configuration.jurisdiction_id == the revised jurisdiction id"
        side_effects:
          - "sets configuration.status = CRITERIA_STALE"
          - "cascade hop 2: because this configuration became CRITERIA_STALE, every EngineeringDesign with design.configuration_id == configuration.id whose status is in {DRAFT, SUBMITTED, APPROVED, REVISION_REQUIRED} transitions to VOIDED"
          - "increments BuildingConfiguration.version by 1"
        note: "Cascade A hop 1->2 of Rule 4."
      - from: CRITERIA_STALE
        to: LOCKED
        trigger: "POST /building-configurations/{id}/lock"
        actor: SalesEngineer
        preconditions:
          - "configuration.status == CRITERIA_STALE"
          - "builder.status == AUTHORIZED"
        side_effects:
          - "re-runs configuration_geometry_and_loads against the jurisdiction's current criteria and overwrites every computed load and weight field"
          - "sets criteria_revision_at_lock = jurisdiction.criteria_revision"
          - "sets locked_at = current logical clock"
          - "sets configuration.status = LOCKED"
          - "increments BuildingConfiguration.version by 1"
        note: "Cyclic shape: LOCKED -> CRITERIA_STALE -> LOCKED. Existing VOIDED designs are not revived; a new design must be created."

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /quotes/{id}/issue"
        actor: SalesEngineer
        preconditions:
          - "quote.status == DRAFT"
          - "configuration.status == LOCKED"
        side_effects:
          - "sets issued_at = current logical clock"
          - "sets valid_until = issued_at + QUOTE_VALID_DAYS days"
          - "sets quote.status = ISSUED"
          - "increments Quote.version by 1"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Builder
        preconditions:
          - "quote.status == ISSUED"
          - "acting X-User-ID == quote.builder_id"
          - "builder.status == AUTHORIZED"
          - "current logical clock <= quote.valid_until"
          - "quote.quoted_price_cents <= builder.credit_available_cents"
        side_effects:
          - "creates one Order with quote_id, builder_id, configuration_id copied from the quote, engineering_status = ENG_PENDING, production_status = PROD_NOT_RELEASED"
          - "increments builder.credit_used_cents by quote.quoted_price_cents and recomputes credit_available_cents"
          - "sets quote.status = ACCEPTED"
          - "increments Quote.version by 1 and Builder.version by 1"

  - entity: EngineeringDesign
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /engineering-designs/{id}/submit"
        actor: Engineer
        preconditions:
          - "design.status == DRAFT"
          - "configuration.status == LOCKED"
          - "design has at least one DesignComponent with component_class == PRIMARY_FRAME_MEMBER"
        side_effects:
          - "sets submitted_by_user_id = acting X-User-ID"
          - "sets design.status = SUBMITTED"
          - "increments EngineeringDesign.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /engineering-designs/{id}/review with decision APPROVE"
        actor: EngineeringManager
        preconditions:
          - "design.status == SUBMITTED"
          - "acting X-User-ID != design.submitted_by_user_id"
        side_effects:
          - "sets reviewed_by_user_id = acting X-User-ID"
          - "sets design.status = APPROVED"
          - "for every Order whose configuration_id == design.configuration_id and production_status != PROD_COMPLETE: sets engineering_design_id = design.id and engineering_status = ENG_APPROVED"
          - "increments EngineeringDesign.version by 1 and Order.version by 1 for each updated order"
      - from: SUBMITTED
        to: REVISION_REQUIRED
        trigger: "POST /engineering-designs/{id}/review with decision REQUEST_REVISION"
        actor: EngineeringManager
        preconditions:
          - "design.status == SUBMITTED"
          - "acting X-User-ID != design.submitted_by_user_id"
        side_effects:
          - "sets reviewed_by_user_id = acting X-User-ID"
          - "sets design.status = REVISION_REQUIRED"
          - "for every Order whose engineering_design_id == design.id: sets engineering_status = ENG_REWORK"
          - "increments EngineeringDesign.version by 1"
        note: "Branch shape: SUBMITTED forks to APPROVED or REVISION_REQUIRED with divergent side-effect sets."
      - from: REVISION_REQUIRED
        to: DRAFT
        trigger: "POST /engineering-designs/{id}/revise"
        actor: Engineer
        preconditions:
          - "design.status == REVISION_REQUIRED"
          - "design.revision_count < MAX_DESIGN_REVISIONS"
        side_effects:
          - "increments design.revision_count by 1"
          - "clears submitted_by_user_id and reviewed_by_user_id to null"
          - "sets design.status = DRAFT"
          - "increments EngineeringDesign.version by 1"
        note: "Cyclic shape: DRAFT -> SUBMITTED -> REVISION_REQUIRED -> DRAFT, bounded by MAX_DESIGN_REVISIONS."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /engineering-designs created a newer design for the same configuration_id"
        actor: system
        preconditions:
          - "design.status is in {DRAFT, SUBMITTED, APPROVED, REVISION_REQUIRED}"
          - "the newly created design has the same configuration_id"
        side_effects:
          - "sets design.status = SUPERSEDED"
          - "increments EngineeringDesign.version by 1"
        note: "Applies from every non-terminal state, not only DRAFT; this legitimate supersede is what makes the OCC rule design-create-stale-configuration a true race."
      - from: APPROVED
        to: VOIDED
        trigger: "system: the design's configuration transitioned LOCKED -> CRITERIA_STALE"
        actor: system
        preconditions:
          - "design.status is in {DRAFT, SUBMITTED, APPROVED, REVISION_REQUIRED}"
          - "configuration.status == CRITERIA_STALE"
        side_effects:
          - "sets design.status = VOIDED"
          - "cascade hop 3: because this design became VOIDED, every DrawingPackage with package.design_id == design.id whose status is in {PENDING, SEALED} transitions to VOIDED"
          - "increments EngineeringDesign.version by 1"
        note: "Cascade A hop 2->3 of Rule 4."

  - entity: DrawingPackage
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: SEALED
        trigger: "POST /drawing-packages/{id}/seal"
        actor: SealingEngineer
        preconditions:
          - "package.status == PENDING"
          - "design.status == APPROVED"
          - "design has at least one DesignComponent with connection_type == KNEE and at least one with connection_type == BASE"
          - "every DesignComponent with connection_type == KNEE has capacity_moment_kip_ft >= design.required_moment_kip_ft"
          - "package.sealing_license_state == jurisdiction.state_code"
        side_effects:
          - "sets sealed_at = current logical clock and sealed_by_user_id = acting X-User-ID"
          - "sets criteria_revision_at_seal = jurisdiction.criteria_revision"
          - "sets package.status = SEALED"
          - "for every Order whose engineering_design_id == package.design_id: sets drawing_package_id = package.id and engineering_status = ENG_SEALED"
          - "increments DrawingPackage.version by 1 and Order.version by 1 for each updated order"
      - from: SEALED
        to: VOIDED
        trigger: "system: the package's design transitioned to VOIDED"
        actor: system
        preconditions:
          - "package.status is in {PENDING, SEALED}"
          - "design.status == VOIDED"
        side_effects:
          - "sets package.status = VOIDED"
          - "cascade hop 4: because this package became VOIDED, every Order with order.drawing_package_id == package.id gets permit_hold = true and engineering_status = ENG_REWORK"
          - "increments DrawingPackage.version by 1"
        note: "Cascade A hop 3->4 of Rule 4."

  - entity: Order
    initial_state: ENG_PENDING
    terminal_states: []
    transitions:
      - from: ENG_PENDING
        to: ENG_APPROVED
        trigger: "system: an EngineeringDesign for order.configuration_id was APPROVED"
        actor: system
        preconditions:
          - "order.engineering_status is in {ENG_PENDING, ENG_REWORK}"
          - "design.configuration_id == order.configuration_id"
        side_effects:
          - "sets order.engineering_design_id = design.id"
          - "sets order.engineering_status = ENG_APPROVED"
          - "increments Order.version by 1"
        note: "engineering dimension only; production_status is untouched by this transition."
      - from: ENG_APPROVED
        to: ENG_SEALED
        trigger: "system: a DrawingPackage for order.engineering_design_id was SEALED"
        actor: system
        preconditions:
          - "order.engineering_status == ENG_APPROVED"
          - "package.design_id == order.engineering_design_id"
        side_effects:
          - "sets order.drawing_package_id = package.id"
          - "sets order.engineering_status = ENG_SEALED"
          - "increments Order.version by 1"
      - from: ENG_SEALED
        to: ENG_REWORK
        trigger: "system: order.drawing_package_id transitioned to VOIDED, or the order's design was moved to REVISION_REQUIRED"
        actor: system
        preconditions:
          - "order.engineering_status is in {ENG_PENDING, ENG_APPROVED, ENG_SEALED}"
        side_effects:
          - "sets order.engineering_status = ENG_REWORK"
          - "sets order.permit_hold = true when the cause was a VOIDED drawing package"
          - "cascade hop 5: because this order entered permit_hold, every ProductionLot of this order with status == SCHEDULED transitions to CANCELLED and order.production_status is recomputed to PROD_HOLD"
          - "increments Order.version by 1"
        note: "Cascade A hop 4->5 of Rule 4."
      - from: PROD_NOT_RELEASED
        to: PROD_RELEASED
        trigger: "POST /orders/{id}/release-to-fabrication"
        actor: ProductionPlanner
        preconditions:
          - "order.production_status == PROD_NOT_RELEASED"
          - "order.permit_hold == false and order.commercial_hold == false"
          - "order.engineering_status == ENG_SEALED"
          - "the DrawingPackage at order.drawing_package_id has status == SEALED"
          - "builder.status == AUTHORIZED"
          - "request expected_order_version == order.version"
          - "price_delta_cents <= builder.credit_available_cents"
        side_effects:
          - "runs quote_price_pipeline under the FINAL variant and stores final_price_cents and price_delta_cents"
          - "moves builder.credit_used_cents by price_delta_cents and recomputes credit_available_cents"
          - "runs order_shippable_weight_ledger and stores total_shippable_weight_lbs, assigned_weight_lbs = 0, unassigned_weight_lbs = total_shippable_weight_lbs"
          - "sets released_at = current logical clock"
          - "sets order.production_status = PROD_RELEASED"
          - "increments Order.version by 1 and Builder.version by 1"
        note: "production dimension only; engineering_status stays ENG_SEALED."
      - from: PROD_RELEASED
        to: PROD_NOT_RELEASED
        trigger: "POST /orders/{id}/cancel-release"
        actor: ProductionPlanner
        preconditions:
          - "order.production_status == PROD_RELEASED"
          - "order has no ProductionLot with status in {SCHEDULED, COMPLETE}"
          - "order has no ShipmentLoad with status in {PLANNED, DISPATCHED}"
          - "request expected_order_version == order.version"
        side_effects:
          - "moves builder.credit_used_cents by -price_delta_cents and recomputes credit_available_cents, restoring the value it held right after quote acceptance"
          - "clears final_price_cents and price_delta_cents to null"
          - "resets total_shippable_weight_lbs, assigned_weight_lbs and unassigned_weight_lbs to 0"
          - "clears released_at to null"
          - "sets order.production_status = PROD_NOT_RELEASED"
          - "increments Order.version by 1 and Builder.version by 1"
        note: "Compensating action for release-to-fabrication; the credit invariant must show zero drift."
      - from: PROD_RELEASED
        to: PROD_IN_FABRICATION
        trigger: "system: order_production_status_rollup after POST /production-lots"
        actor: system
        preconditions:
          - "order.production_status == PROD_RELEASED"
          - "order has at least one ProductionLot with status == SCHEDULED"
        side_effects:
          - "sets order.production_status = PROD_IN_FABRICATION"
          - "increments Order.version by 1"
      - from: PROD_IN_FABRICATION
        to: PROD_COMPLETE
        trigger: "system: order_production_status_rollup after POST /production-lots/{id}/complete"
        actor: system
        preconditions:
          - "every ProductionLot of the order with status in {SCHEDULED, COMPLETE} has status == COMPLETE"
          - "the set of lot_type values over those lots equals {PRIMARY_FRAME_FAB, SECONDARY_ROLL_FORM, PANEL_RUN}"
        side_effects:
          - "sets order.production_status = PROD_COMPLETE"
          - "increments Order.version by 1"
        note: "Compound shape: the parent order's production dimension is derived from its ProductionLot children."
      - from: PROD_IN_FABRICATION
        to: PROD_HOLD
        trigger: "system: permit_hold or commercial_hold was raised on the order"
        actor: system
        preconditions:
          - "order.production_status is in {PROD_NOT_RELEASED, PROD_RELEASED, PROD_IN_FABRICATION}"
          - "order.permit_hold == true or order.commercial_hold == true"
        side_effects:
          - "sets order.production_status = PROD_HOLD"
          - "increments Order.version by 1"

  - entity: ProductionLot
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETE
        trigger: "POST /production-lots/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "lot.status == SCHEDULED"
          - "order.production_status is in {PROD_RELEASED, PROD_IN_FABRICATION}"
        side_effects:
          - "sets lot.status = COMPLETE and completed_at = current logical clock"
          - "runs order_production_status_rollup on the lot's order"
          - "increments ProductionLot.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /production-lots/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "lot.status == SCHEDULED"
        side_effects:
          - "sets lot.status = CANCELLED"
          - "frees the line window for production_line_window_conflict"
          - "runs order_production_status_rollup on the lot's order"
          - "increments ProductionLot.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: the lot's order entered permit_hold or commercial_hold"
        actor: system
        preconditions:
          - "lot.status == SCHEDULED"
          - "order.permit_hold == true or order.commercial_hold == true"
        side_effects:
          - "sets lot.status = CANCELLED"
          - "increments ProductionLot.version by 1"

  - entity: ShipmentLoad
    initial_state: PLANNED
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /shipment-loads/{id}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "load.status == PLANNED"
          - "order.production_status is in {PROD_RELEASED, PROD_IN_FABRICATION, PROD_COMPLETE}"
          - "the ProductionLot of load.order_id whose lot_type == LOT_TYPE_FOR_STAGE[load.erection_stage] has status == COMPLETE, when LOT_TYPE_FOR_STAGE defines one for the stage"
          - "no ShipmentLoad of the same order with a strictly smaller stage_sequence has status == PLANNED"
        side_effects:
          - "sets load.status = DISPATCHED and dispatched_at = current logical clock"
          - "leaves order.assigned_weight_lbs unchanged because DISPATCHED loads remain assigned"
          - "increments ShipmentLoad.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shipment-loads/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "load.status == PLANNED"
        side_effects:
          - "sets load.status = CANCELLED"
          - "releases the load's marks so they may be assigned to another load"
          - "runs order_shippable_weight_ledger on the order, decreasing assigned_weight_lbs by the load's gross_weight_lbs and increasing unassigned_weight_lbs by the same amount"
          - "increments ShipmentLoad.version by 1 and Order.version by 1"
        note: "Compensating action for POST /shipment-loads; the pounds invariant must show zero drift."
      - from: PLANNED
        to: CANCELLED
        trigger: "system: the load's order gained commercial_hold because its builder was suspended"
        actor: system
        preconditions:
          - "load.status == PLANNED"
          - "order.commercial_hold == true"
        side_effects:
          - "sets load.status = CANCELLED"
          - "runs order_shippable_weight_ledger on the order"
          - "increments ShipmentLoad.version by 1"

concurrency_rules:
  - rule_id: design-create-stale-configuration
    parent_entity: BuildingConfiguration
    write_endpoint: "POST /engineering-designs"
    occ_field: "expected_configuration_version"
    description: |
      Creating an EngineeringDesign against a BuildingConfiguration whose
      version has advanced since the client last read it is rejected. A design
      create legitimately supersedes every earlier non-terminal design for the
      same configuration, so a second sequential create issued from a stale
      view of the configuration would silently discard engineering work the
      client never saw; the stale expected_configuration_version makes that
      rejection deterministic.
    error_id: ERR_STALE_CONFIGURATION_VERSION
    http_status: 412

  - rule_id: load-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /shipment-loads"
    occ_field: "expected_order_version"
    description: |
      Creating a ShipmentLoad against an Order whose version has advanced since
      the client last read it is rejected. Load creation reallocates the order's
      assigned_weight_lbs and unassigned_weight_lbs ledger, and any other write
      to the order (release, another load, a cascade) shifts that ledger, so a
      create built on a stale order view would book weight against numbers that
      no longer hold.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

calculations:
  - name: configuration_geometry_and_loads
    trigger: "POST /building-configurations/{id}/lock (both DRAFT -> LOCKED and CRITERIA_STALE -> LOCKED)"
    algorithm: threshold
    formula: |
      building_length_ft  = bay_spacing_ft * bay_count
      footprint_sqft      = clear_span_ft * building_length_ft
      roof_slope_factor   = round_half_up(sqrt(144 + roof_pitch_rise_per_12^2) / 12, 4)
      roof_panel_area     = round_half_up(footprint_sqft * roof_slope_factor, 2)     # uses the 4-decimal rounded slope factor
      wall_panel_area     = round_half_up(2 * (clear_span_ft + building_length_ft) * eave_height_ft, 2)
      panel_area_sqft     = round_half_up(roof_panel_area + wall_panel_area, 2)

      kz                  = EXPOSURE_KZ[jurisdiction.exposure_category]
      qz                  = round_half_up(VELOCITY_PRESSURE_COEFF * kz * jurisdiction.design_wind_speed_mph^2, 4)
      roof_gcp            = (roof_pitch_rise_per_12 <= LOW_SLOPE_PITCH_MAX) ? GCP_ROOF_LOW_SLOPE : GCP_ROOF_STEEP
      gcp                 = max(GCP_WALL, roof_gcp)                                   # nested max over a state-conditional branch
      height_factor       = min(HEIGHT_FACTOR_CAP, 1 + max(0, eave_height_ft - HEIGHT_FACTOR_BASE_FT) * HEIGHT_FACTOR_PER_FT)
      design_wind_pressure_psf = round_half_up(qz * gcp * height_factor, 2)

      dead_load_psf       = round_half_up(PANEL_DEAD_PSF[panel_profile] + FRAME_DEAD_ALLOWANCE_PSF + insulation_r_value * INSULATION_PSF_PER_R, 2)
      roof_snow_load_psf  = round_half_up(jurisdiction.ground_snow_load_psf * SNOW_ROOF_FACTOR, 2)

      span_factor         = 1 + max(0, clear_span_ft - SPAN_FACTOR_FREE_FT) * SPAN_FACTOR_PER_FT
      estimated_frame_weight_lbs = round_half_up(footprint_sqft * ESTIMATE_BASE_PSF * span_factor, 2)
    input_set: "the single BuildingConfiguration being locked plus the Jurisdiction at configuration.jurisdiction_id, read at its current criteria_revision"
    constants:
      EXPOSURE_KZ: { B: 0.70, C: 0.85, D: 1.03 }
      VELOCITY_PRESSURE_COEFF: 0.00256
      GCP_WALL: 0.90
      GCP_ROOF_LOW_SLOPE: 1.10
      GCP_ROOF_STEEP: 0.95
      LOW_SLOPE_PITCH_MAX: 2
      HEIGHT_FACTOR_BASE_FT: 20
      HEIGHT_FACTOR_PER_FT: 0.01
      HEIGHT_FACTOR_CAP: 1.25
      PANEL_DEAD_PSF: { PBR: 1.20, STANDING_SEAM: 1.60, R_PANEL: 1.10 }
      FRAME_DEAD_ALLOWANCE_PSF: 1.50
      INSULATION_PSF_PER_R: 0.02
      SNOW_ROOF_FACTOR: 0.70
      ESTIMATE_BASE_PSF: 4.6
      SPAN_FACTOR_FREE_FT: 80
      SPAN_FACTOR_PER_FT: 0.004
    precision: "roof_slope_factor 4 decimals; qz 4 decimals; every psf, sqft and lbs field 2 decimals; all rounding round_half_up"

  - name: design_load_combination_and_required_moment
    trigger: "POST /engineering-designs"
    algorithm: threshold
    formula: |
      D = configuration.dead_load_psf
      W = configuration.design_wind_pressure_psf
      S = configuration.roof_snow_load_psf

      if design_variant == ASD:
        candidates = [
          (ASD_D_PLUS_S,                  round_half_up(D + S, 2)),
          (ASD_D_PLUS_0_6W,               round_half_up(D + 0.6 * W, 2)),
          (ASD_D_PLUS_0_75S_PLUS_0_45W,   round_half_up(D + 0.75 * S + 0.45 * W, 2)),
        ]
      else:
        candidates = [
          (LRFD_1_4D,                          round_half_up(1.4 * D, 2)),
          (LRFD_1_2D_PLUS_1_6S,                round_half_up(1.2 * D + 1.6 * S, 2)),
          (LRFD_1_2D_PLUS_1_0W_PLUS_0_5S,      round_half_up(1.2 * D + 1.0 * W + 0.5 * S, 2)),
        ]

      governing_load_psf   = max(pressure over candidates)
      governing_combination = the candidate with that pressure; on a tie the earliest candidate in the list order above wins
      tributary_load_kip_per_ft = round_half_up(governing_load_psf * configuration.bay_spacing_ft / 1000, 6)
      required_moment_kip_ft    = round_half_up(tributary_load_kip_per_ft * configuration.clear_span_ft^2 / 8, 2)
    input_set: "the BuildingConfiguration at design.configuration_id, which must be in status LOCKED; the design's own design_variant selects the candidate list"
    constants:
      ASD_COMBINATION_ORDER: [ASD_D_PLUS_S, ASD_D_PLUS_0_6W, ASD_D_PLUS_0_75S_PLUS_0_45W]
      LRFD_COMBINATION_ORDER: [LRFD_1_4D, LRFD_1_2D_PLUS_1_6S, LRFD_1_2D_PLUS_1_0W_PLUS_0_5S]
    precision: "candidate pressures and governing_load_psf 2 decimals; tributary_load_kip_per_ft 6 decimals; required_moment_kip_ft 2 decimals; round_half_up"
    variants:
      - name: ASD
        when: "design.design_variant == ASD — allowable stress design, the family used for permitting in jurisdictions that accept ASD"
        difference: "wind is factored at 0.6 and snow companions at 0.75/0.45, so the governing pressure and therefore required_moment_kip_ft are materially lower than under LRFD for identical configuration loads"
      - name: LRFD
        when: "design.design_variant == LRFD — strength design"
        difference: "wind is factored at 1.0 and dead at 1.2, so the wind-dominated combination governs at a much higher pressure; for the reference configuration ASD yields 1010.94 kip-ft and LRFD yields 1695.00 kip-ft from the same three input loads"

  - name: design_weight_rollup
    trigger: "POST /engineering-designs/{id}/components"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (mode (b)): round each component's unit weight to 2
      # decimals FIRST, multiply by quantity, round that line to 2 decimals, and
      # only THEN sum the lines. Summing raw length_ft * weight_per_ft * quantity
      # products and rounding once at the end is explicitly NOT the rule and
      # yields a different value (46854.22 vs 46854.48 for the reference design).
      for each DesignComponent c of the design:
        if c.component_class == CONNECTION_DETAIL:
          c.unit_weight_lbs = 0
          c.line_weight_lbs = 0
        else:
          c.unit_weight_lbs = round_half_up(c.length_ft * c.weight_per_ft, 2)
          c.line_weight_lbs = round_half_up(c.unit_weight_lbs * c.quantity, 2)

      frame_weight_lbs     = round_half_up(sum(c.line_weight_lbs for c where c.component_class in {PRIMARY_FRAME_MEMBER, SECONDARY_MEMBER}), 2)
      shippable_weight_lbs = round_half_up(sum(c.line_weight_lbs for every c of the design), 2)
      component_count      = count of DesignComponent rows of the design
    input_set: "every DesignComponent row whose design_id equals the design, in DesignComponent.created_at ascending order; no status filter exists because components are immutable and never deleted"
    constants:
      WEIGHT_BEARING_CLASSES: [PRIMARY_FRAME_MEMBER, SECONDARY_MEMBER, PANEL_BUNDLE, ANCHOR_PACKAGE]
      FRAME_WEIGHT_CLASSES: [PRIMARY_FRAME_MEMBER, SECONDARY_MEMBER]
    precision: "unit_weight_lbs, line_weight_lbs, frame_weight_lbs and shippable_weight_lbs each 2 decimals, round_half_up, in the pinned order above"

  - name: quote_price_pipeline
    trigger: "POST /quotes (PRELIMINARY variant) and POST /orders/{id}/release-to-fabrication (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER (mode (c)): the volume tier is keyed on
      # pre_discount_total_cents, which ALREADY contains adjustment_cents and
      # freight_cost_cents. Freight therefore participates in selecting the
      # discount rate that is then applied to freight itself. Steps run exactly
      # in the order 1..7 below; no other ordering is permitted.
      # 1. billable frame weight, per variant
      billable_frame_weight_lbs = (variant == PRELIMINARY)
                                  ? configuration.estimated_frame_weight_lbs
                                  : design.frame_weight_lbs                     # design = order.engineering_design_id
      # 2. component costs
      steel_cost_cents     = round_half_up(billable_frame_weight_lbs * STEEL_RATE_CENTS_PER_LB, 0)
      panel_cost_cents     = round_half_up(configuration.panel_area_sqft * PANEL_RATE_CENTS_PER_SQFT[configuration.panel_profile], 0)
      accessory_cost_cents = sum(kit.extended_price_cents for every AccessoryKit of the configuration)
      subtotal_cents       = steel_cost_cents + panel_cost_cents + accessory_cost_cents
      # 3. freight, from weight not from money
      billable_weight_lbs  = round_half_up(billable_frame_weight_lbs + sum(kit.extended_weight_lbs for every AccessoryKit of the configuration), 2)
      billable_tons        = round_half_up(billable_weight_lbs / 2000, 3)
      freight_cost_cents   = round_half_up(billable_tons * FREIGHT_RATE_CENTS_PER_TON_MILE[jurisdiction.freight_zone] * quote.freight_distance_miles, 0)
      # 4. discount base
      pre_discount_total_cents = subtotal_cents + quote.adjustment_cents + freight_cost_cents
      # 5. rates
      tier_discount_rate   = TIER_DISCOUNT_RATE[builder.tier]
      volume_discount_rate = pre_discount_total_cents >= VOLUME_TIER_3_CENTS ? 0.06
                           : pre_discount_total_cents >= VOLUME_TIER_2_CENTS ? 0.04
                           : pre_discount_total_cents >= VOLUME_TIER_1_CENTS ? 0.02
                           : 0.00
      total_discount_rate  = min(MAX_DISCOUNT_RATE, tier_discount_rate + volume_discount_rate)
      # 6. price
      price_cents          = round_half_up(pre_discount_total_cents * (1 - total_discount_rate), 0)
      # 7. reconciliation, FINAL variant only
      price_delta_cents    = order.final_price_cents - quote.quoted_price_cents
    input_set: "the Quote's builder and configuration, every AccessoryKit whose configuration_id matches the configuration (no status filter — kits are never cancelled), and under the FINAL variant the EngineeringDesign at order.engineering_design_id whose status must be APPROVED"
    constants:
      STEEL_RATE_CENTS_PER_LB: 92
      PANEL_RATE_CENTS_PER_SQFT: { PBR: 210, STANDING_SEAM: 340, R_PANEL: 185 }
      FREIGHT_RATE_CENTS_PER_TON_MILE: { 1: 18, 2: 22, 3: 27, 4: 33, 5: 41 }
      TIER_DISCOUNT_RATE: { BRONZE: 0.00, SILVER: 0.03, GOLD: 0.08 }
      VOLUME_TIER_1_CENTS: 25000000
      VOLUME_TIER_2_CENTS: 50000000
      VOLUME_TIER_3_CENTS: 100000000
      MAX_DISCOUNT_RATE: 0.12
      MAX_ADJUSTMENT_FRACTION: 0.20
      QUOTE_VALID_DAYS: 30
    precision: "billable_weight_lbs 2 decimals; billable_tons 3 decimals; every cents field is an integer produced by round_half_up at 0 decimals; rates carry 2 decimals"
    variants:
      - name: PRELIMINARY
        when: "POST /quotes — the engineering design does not exist yet, so steel is billed on the configuration's parametric estimate"
        difference: "billable_frame_weight_lbs = configuration.estimated_frame_weight_lbs; the result is stored as Quote.quoted_price_cents"
      - name: FINAL
        when: "POST /orders/{id}/release-to-fabrication — the APPROVED design's detailed bill of material exists"
        difference: "billable_frame_weight_lbs = design.frame_weight_lbs, which changes steel_cost_cents, billable_tons and freight_cost_cents together; the result is stored as Order.final_price_cents and the signed difference against the quote becomes Order.price_delta_cents (9719236 -> 9458205, delta -261031 for the reference order)"

  - name: builder_credit_ledger
    trigger: "POST /quotes/{id}/accept, POST /orders/{id}/release-to-fabrication, POST /orders/{id}/cancel-release"
    algorithm: aggregation
    formula: |
      on quote accept:      credit_used_cents = credit_used_cents + quote.quoted_price_cents
      on order release:     credit_used_cents = credit_used_cents + order.price_delta_cents
      on cancel-release:    credit_used_cents = credit_used_cents - order.price_delta_cents
      credit_available_cents = credit_limit_cents - credit_used_cents
      INVARIANT: credit_used_cents + credit_available_cents == credit_limit_cents at every observable instant
      GATE (accept):  quote.quoted_price_cents <= credit_available_cents else ERR_BUILDER_CREDIT_EXCEEDED
      GATE (release): order.price_delta_cents  <= credit_available_cents else ERR_BUILDER_CREDIT_EXCEEDED
                      (a negative or zero delta always passes the gate)
    input_set: "the single Builder at quote.builder_id / order.builder_id; no other builder rows participate"
    constants: {}
    precision: "integer cents, no rounding"

  - name: order_shippable_weight_ledger
    trigger: "POST /orders/{id}/release-to-fabrication, POST /shipment-loads, POST /shipment-loads/{id}/cancel, and the ShipmentLoad PLANNED -> CANCELLED system transition"
    algorithm: aggregation
    formula: |
      at release:
        total_shippable_weight_lbs = round_half_up(design.shippable_weight_lbs
                                     + sum(kit.extended_weight_lbs for every AccessoryKit of order.configuration_id), 2)
      on every load create / cancel:
        assigned_weight_lbs   = round_half_up(sum(load.gross_weight_lbs
                                  for every ShipmentLoad of the order with status in {PLANNED, DISPATCHED}), 2)
        unassigned_weight_lbs = round_half_up(total_shippable_weight_lbs - assigned_weight_lbs, 2)
      at cancel-release: all three fields reset to 0
      INVARIANT: assigned_weight_lbs + unassigned_weight_lbs == total_shippable_weight_lbs at every observable instant
    input_set: "every ShipmentLoad whose order_id equals the order and whose status is in {PLANNED, DISPATCHED}; CANCELLED loads are excluded. The design is the one at order.engineering_design_id (status APPROVED)."
    constants: {}
    precision: "2 decimals, round_half_up"

  - name: shipment_load_gross_weight
    trigger: "POST /shipment-loads"
    algorithm: aggregation
    formula: |
      resolved = [ DesignComponent c where c.design_id == order.engineering_design_id
                   and c.mark in request.component_marks ]
      gross_weight_lbs = round_half_up(sum(c.line_weight_lbs for c in resolved), 2)
    input_set: "DesignComponent rows of the order's engineering_design_id whose mark appears in component_marks, matched one-to-one; every requested mark must resolve or the request is rejected with ERR_MARK_NOT_FOUND"
    constants: {}
    precision: "2 decimals, round_half_up"

  - name: production_line_window_conflict
    trigger: "POST /production-lots"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics [window_start, window_end) with a
      # colour-dependent changeover buffer applied on BOTH sides.
      occupants = [ ProductionLot l where l.line_id == request.line_id
                    and l.status in {SCHEDULED, COMPLETE} ]
      for each occupant o:
        buffer = (o.paint_color == request.paint_color) ? 0 : line.changeover_buffer_minutes
        overlap = (request.window_start < o.window_end   + buffer minutes)
              and (o.window_start       < request.window_end + buffer minutes)
        if overlap: reject with ERR_LINE_WINDOW_CONFLICT
    input_set: "ProductionLot rows on the same line_id with status in {SCHEDULED, COMPLETE}; CANCELLED lots free their window"
    constants:
      DEFAULT_CHANGEOVER_BUFFER_MINUTES: 120
    precision: "minute resolution; window_end is exclusive so a same-colour lot may start exactly at an occupant's window_end"

  - name: site_unload_capacity_check
    trigger: "POST /shipment-loads"
    algorithm: aggregation
    formula: |
      # CLOSED interval semantics [unload_window_start, unload_window_end] with
      # NO buffer and an AGGREGATE per-site capacity: touching endpoints count as
      # overlapping, and the rejection depends on how many existing loads the new
      # window meets, not on any single pairwise collision.
      site_loads = [ ShipmentLoad l where l.status in {PLANNED, DISPATCHED}
                     and Order(l.order_id).job_site_code == Order(request.order_id).job_site_code ]
      overlapping = count of l in site_loads where
                      request.unload_window_start <= l.unload_window_end
                  and l.unload_window_start       <= request.unload_window_end
      if overlapping >= order.site_delivery_capacity: reject with ERR_SITE_UNLOAD_CAPACITY_EXCEEDED
    input_set: "every ShipmentLoad with status in {PLANNED, DISPATCHED} belonging to any Order sharing the same job_site_code, including orders of other builders"
    constants:
      DEFAULT_SITE_DELIVERY_CAPACITY: 2
    precision: "minute resolution; both window bounds inclusive"

  - name: order_production_status_rollup
    trigger: "POST /production-lots, POST /production-lots/{id}/complete, POST /production-lots/{id}/cancel, POST /shipment-loads/{id}/cancel, and every cascade that raises or clears permit_hold / commercial_hold"
    algorithm: projection
    formula: |
      if order.released_at is null:                                    PROD_NOT_RELEASED
      else if order.permit_hold or order.commercial_hold:              PROD_HOLD
      else:
        active = [ ProductionLot l of the order where l.status in {SCHEDULED, COMPLETE} ]
        if active is empty:                                            PROD_RELEASED
        else if every l in active has status == COMPLETE
             and set(l.lot_type for l in active) == {PRIMARY_FRAME_FAB, SECONDARY_ROLL_FORM, PANEL_RUN}:
                                                                       PROD_COMPLETE
        else:                                                          PROD_IN_FABRICATION
    input_set: "ProductionLot rows whose order_id equals the order and whose status is in {SCHEDULED, COMPLETE}; CANCELLED lots are excluded from the rollup entirely"
    constants:
      REQUIRED_LOT_TYPES: [PRIMARY_FRAME_FAB, SECONDARY_ROLL_FORM, PANEL_RUN]
    precision: "exact enum selection; the branches are evaluated top to bottom and the first match wins"

  - name: erection_sequence_projection
    trigger: "GET /orders/{id}/erection-sequence"
    algorithm: topological
    formula: |
      loads = [ ShipmentLoad l of the order where l.status in {PLANNED, DISPATCHED} ]
      order the list by stage_sequence ascending, then by created_at ascending as the tie-break
      planned_load_count      = count of loads with status == PLANNED
      dispatched_load_count   = count of loads with status == DISPATCHED
      next_dispatchable_stage = erection_stage of the first load with status == PLANNED in that order, or "NONE" when there is none
      blocked_load_count      = count of loads with status == PLANNED whose stage_sequence is strictly greater
                                than the smallest stage_sequence among PLANNED loads
      sequence                = the ordered erection_stage values joined with ">"
    input_set: "ShipmentLoad rows of the order with status in {PLANNED, DISPATCHED}; CANCELLED loads are excluded"
    constants:
      ERECTION_STAGE_SEQUENCE: { ANCHORAGE: 1, PRIMARY_FRAME: 2, SECONDARY_FRAME: 3, ROOF_PANEL: 4, WALL_PANEL: 5, TRIM_ACCESSORY: 6 }
      LOT_TYPE_FOR_STAGE: { PRIMARY_FRAME: PRIMARY_FRAME_FAB, SECONDARY_FRAME: SECONDARY_ROLL_FORM, ROOF_PANEL: PANEL_RUN, WALL_PANEL: PANEL_RUN }
    precision: "integer counts; ordering is fully pinned by (stage_sequence ASC, created_at ASC) and never uses id"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the eight roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body shape: every required input field present, types correct, enum members valid, numeric ranges honored (clear_span_ft 20..200, bay_spacing_ft 15..30, freight_zone 1..5, insulation_r_value in {0,13,19,25}, quantity >= 1, sheet_count >= 1, limit 1..100, offset >= 0), component_marks a non-empty array of strings, CONNECTION_DETAIL components carry connection_type + capacity_moment_kip_ft and no weight fields while every other component_class carries quantity + length_ft + weight_per_ft and no connection fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "path and body resource ids resolve, evaluated path ids left to right and then body foreign keys in the order they appear in the endpoint's input list — Jurisdiction"
    error_id: ERR_JURISDICTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /jurisdictions/{id}/loading-criteria, GET /jurisdictions/{id}, POST /builders, POST /building-configurations, POST /drawing-packages"
  - priority: 4
    category: existence
    check: "referenced Builder exists"
    error_id: ERR_BUILDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /builders/{id}, POST /builders/{id}/authorize, POST /builders/{id}/suspend, POST /building-configurations, POST /quotes"
  - priority: 4
    category: existence
    check: "referenced BuildingConfiguration exists"
    error_id: ERR_CONFIGURATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /building-configurations/{id}, POST /building-configurations/{id}/lock, POST /building-configurations/{id}/accessory-kits, GET /building-configurations/{id}/accessory-kits, POST /quotes, POST /engineering-designs"
  - priority: 4
    category: existence
    check: "referenced Quote exists"
    error_id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /quotes/{id}, POST /quotes/{id}/issue, POST /quotes/{id}/accept"
  - priority: 4
    category: existence
    check: "referenced EngineeringDesign exists"
    error_id: ERR_DESIGN_NOT_FOUND
    http_status: 404
    applies_to: "GET /engineering-designs/{id}, POST /engineering-designs/{id}/components, GET /engineering-designs/{id}/components, POST /engineering-designs/{id}/submit, POST /engineering-designs/{id}/review, POST /engineering-designs/{id}/revise, POST /drawing-packages"
  - priority: 4
    category: existence
    check: "referenced DrawingPackage exists"
    error_id: ERR_DRAWING_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /drawing-packages/{id}, POST /drawing-packages/{id}/seal"
  - priority: 4
    category: existence
    check: "referenced Order exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /orders/{id}, GET /orders/{id}/erection-sequence, POST /orders/{id}/release-to-fabrication, POST /orders/{id}/cancel-release, POST /production-lots, POST /shipment-loads"
  - priority: 4
    category: existence
    check: "referenced ProductionLine exists"
    error_id: ERR_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /production-lines/{id}, POST /production-lots"
  - priority: 4
    category: existence
    check: "referenced ProductionLot exists"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /production-lots/{id}, POST /production-lots/{id}/complete, POST /production-lots/{id}/cancel"
  - priority: 4
    category: existence
    check: "referenced ShipmentLoad exists"
    error_id: ERR_LOAD_NOT_FOUND
    http_status: 404
    applies_to: "GET /shipment-loads/{id}, POST /shipment-loads/{id}/dispatch, POST /shipment-loads/{id}/cancel"

  - priority: 5
    category: auth
    check: "when the acting role is Builder, X-User-ID equals the target resource's builder_id (quote.builder_id for quote acceptance)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /quotes/{id}/accept"

  - priority: 6
    category: state
    check: "expected_configuration_version equals the current BuildingConfiguration.version"
    error_id: ERR_STALE_CONFIGURATION_VERSION
    http_status: 412
    applies_to: "POST /engineering-designs"
  - priority: 6
    category: state
    check: "expected_order_version equals the current Order.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /shipment-loads, POST /orders/{id}/release-to-fabrication, POST /orders/{id}/cancel-release"

  - priority: 7
    category: auth
    check: "the reviewing X-User-ID differs from design.submitted_by_user_id — the engineer who submitted a design may never review it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /engineering-designs/{id}/review"

  - priority: 8
    category: state
    check: "the Builder in scope has status == AUTHORIZED"
    error_id: ERR_BUILDER_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /building-configurations, POST /building-configurations/{id}/lock, POST /quotes, POST /quotes/{id}/accept, POST /orders/{id}/release-to-fabrication"

  - priority: 9
    category: state
    check: "the target resource is in the from-state its §1.2 transition requires (quote DRAFT for issue and ISSUED for accept, configuration DRAFT or CRITERIA_STALE for lock, design DRAFT for appending components and for submit / SUBMITTED for review / REVISION_REQUIRED for revise, package PENDING for seal, order PROD_NOT_RELEASED for release and PROD_RELEASED for cancel-release, lot SCHEDULED for complete and cancel, load PLANNED for dispatch and cancel)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /quotes/{id}/issue, POST /quotes/{id}/accept, POST /building-configurations/{id}/lock, POST /engineering-designs/{id}/components, POST /engineering-designs/{id}/submit, POST /engineering-designs/{id}/review, POST /engineering-designs/{id}/revise, POST /drawing-packages/{id}/seal, POST /orders/{id}/release-to-fabrication, POST /orders/{id}/cancel-release, POST /production-lots/{id}/complete, POST /production-lots/{id}/cancel, POST /shipment-loads/{id}/dispatch, POST /shipment-loads/{id}/cancel"

  - priority: 10
    category: state
    check: "the referenced BuildingConfiguration has status == LOCKED"
    error_id: ERR_CONFIGURATION_NOT_LOCKED
    http_status: 409
    applies_to: "POST /quotes, POST /engineering-designs, POST /quotes/{id}/issue"
  - priority: 10
    category: state
    check: "the referenced EngineeringDesign has status == APPROVED"
    error_id: ERR_DESIGN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /drawing-packages/{id}/seal"
  - priority: 10
    category: state
    check: "order.engineering_status == ENG_SEALED, order.drawing_package_id is not null, the DrawingPackage at that id has status == SEALED, and neither permit_hold nor commercial_hold is raised"
    error_id: ERR_DRAWINGS_NOT_SEALED
    http_status: 409
    applies_to: "POST /orders/{id}/release-to-fabrication"
  - priority: 10
    category: state
    check: "order.production_status is in {PROD_RELEASED, PROD_IN_FABRICATION} for lot scheduling and in {PROD_RELEASED, PROD_IN_FABRICATION, PROD_COMPLETE} for load creation and dispatch"
    error_id: ERR_ORDER_NOT_RELEASED
    http_status: 409
    applies_to: "POST /production-lots, POST /shipment-loads, POST /shipment-loads/{id}/dispatch"
  - priority: 10
    category: state
    check: "the ProductionLot of the load's order whose lot_type == LOT_TYPE_FOR_STAGE[load.erection_stage] exists and has status == COMPLETE, when the stage maps to a lot type"
    error_id: ERR_LOT_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /shipment-loads/{id}/dispatch"
  - priority: 10
    category: state
    check: "cancel-release requires the order to carry no ProductionLot with status in {SCHEDULED, COMPLETE} and no ShipmentLoad with status in {PLANNED, DISPATCHED}"
    error_id: ERR_ORDER_HAS_ACTIVE_WORK
    http_status: 409
    applies_to: "POST /orders/{id}/cancel-release"

  - priority: 11
    category: business_safety
    check: "the design carries at least one DesignComponent with component_class == PRIMARY_FRAME_MEMBER"
    error_id: ERR_PRIMARY_FRAME_MEMBERS_MISSING
    http_status: 422
    applies_to: "POST /engineering-designs/{id}/submit"
  - priority: 11
    category: business_safety
    check: "the design carries at least one CONNECTION_DETAIL with connection_type == KNEE and at least one with connection_type == BASE"
    error_id: ERR_CONNECTION_DETAILS_INCOMPLETE
    http_status: 422
    applies_to: "POST /drawing-packages/{id}/seal"
  - priority: 11
    category: business_safety
    check: "every CONNECTION_DETAIL with connection_type == KNEE has capacity_moment_kip_ft >= design.required_moment_kip_ft"
    error_id: ERR_CONNECTION_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /drawing-packages/{id}/seal"

  - priority: 12
    category: business_referential
    check: "package.sealing_license_state equals the state_code of the Jurisdiction at package.jurisdiction_id"
    error_id: ERR_SEAL_LICENSE_STATE_MISMATCH
    http_status: 422
    applies_to: "POST /drawing-packages/{id}/seal"
  - priority: 12
    category: business_referential
    check: "every mark in component_marks resolves to a DesignComponent of the order's engineering_design_id"
    error_id: ERR_MARK_NOT_FOUND
    http_status: 422
    applies_to: "POST /shipment-loads"
  - priority: 12
    category: business_referential
    check: "every resolved component's erection_stage equals the load's erection_stage"
    error_id: ERR_LOAD_ITEM_STAGE_MISMATCH
    http_status: 422
    applies_to: "POST /shipment-loads"
  - priority: 12
    category: business_referential
    check: "for lot_type == PANEL_RUN, lot.paint_color equals the order's configuration.panel_color; PRIMARY_FRAME_FAB and SECONDARY_ROLL_FORM lots carry an unconstrained shop finish colour"
    error_id: ERR_PAINT_COLOR_MISMATCH
    http_status: 422
    applies_to: "POST /production-lots"
  - priority: 12
    category: business_referential
    check: "lot_type maps to the line's line_type — PRIMARY_FRAME_FAB requires PLATE_CUT_WELD, SECONDARY_ROLL_FORM requires ROLL_FORM, PANEL_RUN requires PANEL_ROLL"
    error_id: ERR_LOT_TYPE_LINE_MISMATCH
    http_status: 422
    applies_to: "POST /production-lots"

  - priority: 13
    category: business_temporal
    check: "the current logical clock is at or before quote.valid_until"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 422
    applies_to: "POST /quotes/{id}/accept"
  - priority: 13
    category: business_temporal
    check: "window_end is strictly after window_start for production lots, and unload_window_end is at or after unload_window_start for shipment loads"
    error_id: ERR_INVALID_WINDOW_RANGE
    http_status: 400
    applies_to: "POST /production-lots, POST /shipment-loads"
  - priority: 13
    category: business_temporal
    check: "window_start is at or after the current logical clock"
    error_id: ERR_LOT_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /production-lots"

  - priority: 14
    category: business_constraint
    check: "jurisdiction code is unique across Jurisdictions; production line code is unique across ProductionLines"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /jurisdictions, POST /production-lines"
  - priority: 14
    category: business_constraint
    check: "authorizing this builder would not push the count of AUTHORIZED builders in its territory_code above jurisdiction.max_authorized_builders"
    error_id: ERR_TERRITORY_BUILDER_LIMIT
    http_status: 409
    applies_to: "POST /builders/{id}/authorize"
  - priority: 14
    category: business_constraint
    check: "mark is unique within the design"
    error_id: ERR_DUPLICATE_COMPONENT_MARK
    http_status: 409
    applies_to: "POST /engineering-designs/{id}/components"
  - priority: 14
    category: business_constraint
    check: "design.revision_count < MAX_DESIGN_REVISIONS (3)"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /engineering-designs/{id}/revise"
  - priority: 14
    category: business_constraint
    check: "component_marks contains no repeated value"
    error_id: ERR_DUPLICATE_MARK
    http_status: 400
    applies_to: "POST /shipment-loads"
  - priority: 14
    category: business_constraint
    check: "no mark in component_marks already sits on another ShipmentLoad of the same order with status in {PLANNED, DISPATCHED}"
    error_id: ERR_MARK_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /shipment-loads"
  - priority: 14
    category: business_constraint
    check: "production_line_window_conflict finds no occupant collision on the requested line"
    error_id: ERR_LINE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /production-lots"
  - priority: 14
    category: business_constraint
    check: "site_unload_capacity_check counts fewer overlapping site loads than order.site_delivery_capacity"
    error_id: ERR_SITE_UNLOAD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /shipment-loads"
  - priority: 14
    category: business_constraint
    check: "no ShipmentLoad of the same order with a strictly smaller stage_sequence is still PLANNED"
    error_id: ERR_ERECTION_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /shipment-loads/{id}/dispatch"

  - priority: 15
    category: business_fiscal
    check: "adjustment_cents >= -round_half_up(MAX_ADJUSTMENT_FRACTION * subtotal_cents, 0); a discount deeper than 20 percent of the parts subtotal is rejected"
    error_id: ERR_ADJUSTMENT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /quotes"
  - priority: 15
    category: business_fiscal
    check: "on accept, quote.quoted_price_cents <= builder.credit_available_cents; on release, order.price_delta_cents <= builder.credit_available_cents"
    error_id: ERR_BUILDER_CREDIT_EXCEEDED
    http_status: 402
    applies_to: "POST /quotes/{id}/accept, POST /orders/{id}/release-to-fabrication"

endpoints:
  - method: POST
    path: "/jurisdictions"
    description: "Register an authority-having-jurisdiction with its territory, freight zone and loading criteria."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, state_code, territory_code, freight_zone, exposure_category, design_wind_speed_mph, ground_snow_load_psf, seismic_design_category, "max_authorized_builders?"]
    output: Jurisdiction
    side_effects: ["sets criteria_revision = 1", "sets authorized_builder_count = 0"]

  - method: GET
    path: "/jurisdictions/{id}"
    description: "Read one jurisdiction including its current criteria_revision."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/jurisdictions"
    description: "Paginated jurisdiction list, filterable by territory or state."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["territory_code?", "state_code?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  - method: POST
    path: "/jurisdictions/{id}/loading-criteria"
    description: "Publish a code update: replace the jurisdiction's wind, snow, exposure and seismic criteria and raise criteria_revision. Origin of cascade A."
    roles: [PlatformAdmin]
    code: 200
    input: [exposure_category, design_wind_speed_mph, ground_snow_load_psf, seismic_design_category]
    output: Jurisdiction
    side_effects:
      - "increments Jurisdiction.criteria_revision by 1"
      - "cascade hop 1: every LOCKED BuildingConfiguration of this jurisdiction whose criteria_revision_at_lock is now below criteria_revision transitions LOCKED -> CRITERIA_STALE"
      - "cascade hop 2: each of those configurations voids its non-terminal EngineeringDesigns"
      - "cascade hop 3: each voided design voids its PENDING or SEALED DrawingPackages"
      - "cascade hop 4: each voided package sets permit_hold = true and engineering_status = ENG_REWORK on the Orders pointing at it"
      - "cascade hop 5: each held order cancels its SCHEDULED ProductionLots and recomputes production_status to PROD_HOLD"
      - "increments Jurisdiction.version by 1"

  - method: POST
    path: "/builders"
    description: "Add a builder to the network in PENDING_AUTHORIZATION."
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_id, name, tier, credit_limit_cents]
    output: Builder
    side_effects: ["copies territory_code from the jurisdiction", "sets credit_used_cents = 0 and credit_available_cents = credit_limit_cents"]

  - method: GET
    path: "/builders/{id}"
    description: "Read one builder including its credit ledger."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: Builder
    side_effects: []

  - method: GET
    path: "/builders"
    description: "Paginated builder list, filterable by jurisdiction, territory or authorization status."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["jurisdiction_id?", "territory_code?", "status?", "limit?", "offset?"]
    output: Builder[]
    side_effects: []

  - method: POST
    path: "/builders/{id}/authorize"
    description: "Authorize (or re-authorize) a builder inside its territory's authorization limit."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Builder
    side_effects:
      - "sets status = AUTHORIZED and authorized_at = current logical clock"
      - "recomputes Jurisdiction.authorized_builder_count for the territory"
      - "clears commercial_hold on the builder's Orders and recomputes their production_status"
      - "increments Builder.version by 1"

  - method: POST
    path: "/builders/{id}/suspend"
    description: "Suspend a builder. Origin of cascade B."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Builder
    side_effects:
      - "sets status = SUSPENDED"
      - "recomputes Jurisdiction.authorized_builder_count for the territory"
      - "cascade hop 1: the builder's non-complete Orders gain commercial_hold = true and production_status PROD_HOLD"
      - "cascade hop 2: the held orders' PLANNED ShipmentLoads transition to CANCELLED"
      - "cascade hop 3: the cancelled loads force order_shippable_weight_ledger to recompute assigned_weight_lbs and unassigned_weight_lbs"
      - "increments Builder.version by 1"

  - method: POST
    path: "/building-configurations"
    description: "Draft a building configuration (clear span, bay spacing, pitch, panel profile and colour) for an authorized builder."
    roles: [SalesEngineer]
    code: 201
    input: [builder_id, jurisdiction_id, clear_span_ft, bay_spacing_ft, bay_count, eave_height_ft, roof_pitch_rise_per_12, panel_profile, panel_color, insulation_r_value]
    output: BuildingConfiguration
    side_effects: ["sets status = DRAFT; all geometry and load fields stay null until lock"]

  - method: GET
    path: "/building-configurations/{id}"
    description: "Read one configuration including its computed geometry, loads and version."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: BuildingConfiguration
    side_effects: []

  - method: GET
    path: "/building-configurations"
    description: "Paginated configuration list, filterable by builder, jurisdiction or status."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["builder_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: BuildingConfiguration[]
    side_effects: []

  - method: POST
    path: "/building-configurations/{id}/lock"
    description: "Lock the configuration against the jurisdiction's current loading criteria, computing geometry, design loads and the parametric frame weight estimate. Also used to re-lock a CRITERIA_STALE configuration."
    roles: [SalesEngineer]
    code: 200
    input: []
    output: BuildingConfiguration
    side_effects:
      - "runs configuration_geometry_and_loads"
      - "sets criteria_revision_at_lock, locked_at and status = LOCKED"
      - "increments BuildingConfiguration.version by 1"

  - method: POST
    path: "/building-configurations/{id}/accessory-kits"
    description: "Add a door, window, insulation or ventilation kit to the configuration."
    roles: [SalesEngineer]
    code: 201
    input: [kit_type, quantity, unit_price_cents, unit_weight_lbs, erection_stage]
    output: AccessoryKit
    side_effects: ["computes extended_price_cents and extended_weight_lbs"]

  - method: GET
    path: "/building-configurations/{id}/accessory-kits"
    description: "List the accessory kits of a configuration."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["kit_type?", "limit?", "offset?"]
    output: AccessoryKit[]
    side_effects: []

  - method: POST
    path: "/quotes"
    description: "Price a locked configuration for a builder under the PRELIMINARY variant."
    roles: [SalesEngineer]
    code: 201
    input: [builder_id, configuration_id, freight_distance_miles, "adjustment_cents?"]
    output: Quote
    side_effects:
      - "runs quote_price_pipeline under the PRELIMINARY variant and stores every cost, freight, discount and price field"
      - "sets quote_variant = PRELIMINARY and status = DRAFT"

  - method: GET
    path: "/quotes/{id}"
    description: "Read one quote including its full price breakdown."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/quotes"
    description: "Paginated quote list, filterable by builder, configuration or status."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["builder_id?", "configuration_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/quotes/{id}/issue"
    description: "Issue the quote to the builder, starting the 30-day validity window."
    roles: [SalesEngineer]
    code: 200
    input: []
    output: Quote
    side_effects: ["sets issued_at, valid_until = issued_at + 30 days and status = ISSUED", "increments Quote.version by 1"]

  - method: POST
    path: "/quotes/{id}/accept"
    description: "Builder accepts the issued quote; mints the Order and commits the quoted price against the builder's credit."
    roles: [Builder]
    code: 201
    input: [job_site_code, requested_erection_start_date, "site_delivery_capacity?"]
    output: Order
    side_effects:
      - "creates the Order with engineering_status = ENG_PENDING and production_status = PROD_NOT_RELEASED"
      - "increments builder.credit_used_cents by quote.quoted_price_cents and recomputes credit_available_cents"
      - "sets quote.status = ACCEPTED"
      - "increments Quote.version by 1 and Builder.version by 1"

  - method: POST
    path: "/engineering-designs"
    description: "Open an engineering design against a LOCKED configuration under the ASD or LRFD load combination family. Requires the configuration version the client last observed."
    roles: [Engineer]
    code: 201
    input: [configuration_id, design_variant, expected_configuration_version]
    output: EngineeringDesign
    side_effects:
      - "runs design_load_combination_and_required_moment and stores governing_combination, governing_load_psf, tributary_load_kip_per_ft and required_moment_kip_ft"
      - "transitions every earlier non-terminal design of the same configuration to SUPERSEDED"
      - "increments BuildingConfiguration.version by 1"

  - method: GET
    path: "/engineering-designs/{id}"
    description: "Read one design including governing combination, required moment and rolled-up weights."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: EngineeringDesign
    side_effects: []

  - method: GET
    path: "/engineering-designs"
    description: "Paginated design list, filterable by configuration or status."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["configuration_id?", "status?", "limit?", "offset?"]
    output: EngineeringDesign[]
    side_effects: []

  - method: POST
    path: "/engineering-designs/{id}/components"
    description: "Append a frame member, secondary member, panel bundle, anchor package or connection detail to a DRAFT design."
    roles: [Engineer]
    code: 201
    input: [component_class, mark, member_type, erection_stage, "quantity?", "length_ft?", "weight_per_ft?", "connection_type?", "capacity_moment_kip_ft?"]
    output: DesignComponent
    side_effects:
      - "computes unit_weight_lbs and line_weight_lbs in the pinned rounding order"
      - "re-runs design_weight_rollup and updates design.frame_weight_lbs, design.shippable_weight_lbs and design.component_count"
      - "increments EngineeringDesign.version by 1"

  - method: GET
    path: "/engineering-designs/{id}/components"
    description: "List the components of a design; the only discovery channel for component marks and line weights."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["component_class?", "limit?", "offset?"]
    output: DesignComponent[]
    side_effects: []

  - method: POST
    path: "/engineering-designs/{id}/submit"
    description: "Submit the design for review; records the submitting engineer for the segregation-of-duties check."
    roles: [Engineer]
    code: 200
    input: []
    output: EngineeringDesign
    side_effects: ["sets submitted_by_user_id and status = SUBMITTED", "increments EngineeringDesign.version by 1"]

  - method: POST
    path: "/engineering-designs/{id}/review"
    description: "Approve the design or send it back for revision. The reviewing user may not be the submitting user."
    roles: [EngineeringManager]
    code: 200
    input: [decision]
    output: EngineeringDesign
    side_effects:
      - "APPROVE: status = APPROVED, and every Order on the same configuration gets engineering_design_id and engineering_status = ENG_APPROVED"
      - "REQUEST_REVISION: status = REVISION_REQUIRED, and Orders pointing at the design get engineering_status = ENG_REWORK"
      - "sets reviewed_by_user_id and increments EngineeringDesign.version by 1"

  - method: POST
    path: "/engineering-designs/{id}/revise"
    description: "Return a REVISION_REQUIRED design to DRAFT, consuming one of the three permitted revisions."
    roles: [Engineer]
    code: 200
    input: []
    output: EngineeringDesign
    side_effects: ["increments revision_count by 1", "clears submitted_by_user_id and reviewed_by_user_id", "sets status = DRAFT", "increments EngineeringDesign.version by 1"]

  - method: POST
    path: "/drawing-packages"
    description: "Open a permit drawing set for an approved design in a specific jurisdiction."
    roles: [SealingEngineer]
    code: 201
    input: [design_id, jurisdiction_id, sealing_license_state, sheet_count]
    output: DrawingPackage
    side_effects: ["sets status = PENDING"]

  - method: GET
    path: "/drawing-packages/{id}"
    description: "Read one drawing package."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: DrawingPackage
    side_effects: []

  - method: GET
    path: "/drawing-packages"
    description: "Paginated drawing package list, filterable by design, jurisdiction or status."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["design_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: DrawingPackage[]
    side_effects: []

  - method: POST
    path: "/drawing-packages/{id}/seal"
    description: "Seal the permit set. Enforces connection-detail completeness, knee capacity against the required moment, and licence-state match with the jurisdiction."
    roles: [SealingEngineer]
    code: 200
    input: []
    output: DrawingPackage
    side_effects:
      - "sets sealed_at, sealed_by_user_id, criteria_revision_at_seal and status = SEALED"
      - "sets drawing_package_id and engineering_status = ENG_SEALED on the Orders of the design"
      - "increments DrawingPackage.version by 1 and Order.version by 1 for each updated order"

  - method: GET
    path: "/orders/{id}"
    description: "Read one order with both state dimensions, the credit-relevant prices and the weight ledger."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "Paginated order list, filterable by builder, quote, configuration, design, drawing package or production status."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["builder_id?", "quote_id?", "configuration_id?", "engineering_design_id?", "drawing_package_id?", "production_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/release-to-fabrication"
    description: "Release a sealed order to the plant. Reprices under the FINAL variant, moves the builder's credit by the delta and opens the shippable-weight ledger."
    roles: [ProductionPlanner]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects:
      - "runs quote_price_pipeline under the FINAL variant, storing final_price_cents and price_delta_cents"
      - "moves builder.credit_used_cents by price_delta_cents"
      - "sets total_shippable_weight_lbs, assigned_weight_lbs = 0 and unassigned_weight_lbs = total_shippable_weight_lbs"
      - "sets released_at and production_status = PROD_RELEASED"
      - "increments Order.version by 1 and Builder.version by 1"

  - method: POST
    path: "/orders/{id}/cancel-release"
    description: "Compensating action for release-to-fabrication; only possible while no lot or load is active."
    roles: [ProductionPlanner]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects:
      - "moves builder.credit_used_cents by -price_delta_cents, restoring the post-acceptance value exactly"
      - "clears final_price_cents, price_delta_cents and released_at"
      - "resets the three weight ledger fields to 0"
      - "sets production_status = PROD_NOT_RELEASED"
      - "increments Order.version by 1 and Builder.version by 1"

  - method: GET
    path: "/orders/{id}/erection-sequence"
    description: "Computed read: the order's active loads projected into erection order with the next dispatchable stage."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: "{ order_id: string, sequence: string, next_dispatchable_stage: string, planned_load_count: integer, dispatched_load_count: integer, blocked_load_count: integer }"
    side_effects: []

  - method: POST
    path: "/production-lines"
    description: "Register a plate-cut-and-weld, roll-form or panel line with its paint changeover buffer."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, line_type, "changeover_buffer_minutes?"]
    output: ProductionLine
    side_effects: []

  - method: GET
    path: "/production-lines/{id}"
    description: "Read one production line."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []

  - method: POST
    path: "/production-lots"
    description: "Schedule a fabrication lot on a line inside a half-open window, honouring the colour changeover buffer."
    roles: [ProductionPlanner]
    code: 201
    input: [order_id, line_id, lot_type, paint_color, window_start, window_end]
    output: ProductionLot
    side_effects:
      - "runs production_line_window_conflict before insert"
      - "sets status = SCHEDULED"
      - "runs order_production_status_rollup, moving the order to PROD_IN_FABRICATION"
      - "increments Order.version by 1"

  - method: GET
    path: "/production-lots/{id}"
    description: "Read one production lot."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: ProductionLot
    side_effects: []

  - method: GET
    path: "/production-lots"
    description: "Paginated lot list, filterable by order, line or status."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["order_id?", "line_id?", "status?", "limit?", "offset?"]
    output: ProductionLot[]
    side_effects: []

  - method: POST
    path: "/production-lots/{id}/complete"
    description: "Mark a fabrication lot complete; may bubble the order up to PROD_COMPLETE."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionLot
    side_effects: ["sets status = COMPLETE and completed_at", "runs order_production_status_rollup", "increments ProductionLot.version by 1 and Order.version by 1"]

  - method: POST
    path: "/production-lots/{id}/cancel"
    description: "Cancel a scheduled lot, freeing its line window."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionLot
    side_effects: ["sets status = CANCELLED", "runs order_production_status_rollup", "increments ProductionLot.version by 1 and Order.version by 1"]

  - method: POST
    path: "/shipment-loads"
    description: "Plan a truckload of marks for one erection stage with a closed site unload window. Requires the order version the client last observed."
    roles: [LogisticsCoordinator]
    code: 201
    input: [order_id, carrier_name, erection_stage, component_marks, unload_window_start, unload_window_end, expected_order_version]
    output: ShipmentLoad
    side_effects:
      - "resolves component_marks against the order's design and runs shipment_load_gross_weight"
      - "runs site_unload_capacity_check before insert"
      - "sets stage_sequence and status = PLANNED"
      - "runs order_shippable_weight_ledger, raising assigned_weight_lbs and lowering unassigned_weight_lbs"
      - "increments Order.version by 1"

  - method: GET
    path: "/shipment-loads/{id}"
    description: "Read one shipment load including its gross weight and stage sequence."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: []
    output: ShipmentLoad
    side_effects: []

  - method: GET
    path: "/shipment-loads"
    description: "Paginated load list, filterable by order, status or erection stage."
    roles: [PlatformAdmin, SalesEngineer, Engineer, EngineeringManager, SealingEngineer, ProductionPlanner, LogisticsCoordinator, Builder]
    code: 200
    input: ["order_id?", "status?", "erection_stage?", "limit?", "offset?"]
    output: ShipmentLoad[]
    side_effects: []

  - method: POST
    path: "/shipment-loads/{id}/dispatch"
    description: "Dispatch a planned load. Requires the matching fabrication lot complete and no earlier-stage load still planned."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: ShipmentLoad
    side_effects: ["sets status = DISPATCHED and dispatched_at", "leaves the order weight ledger unchanged", "increments ShipmentLoad.version by 1"]

  - method: POST
    path: "/shipment-loads/{id}/cancel"
    description: "Compensating action for load planning: releases the marks and returns the weight to unassigned."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: ShipmentLoad
    side_effects: ["sets status = CANCELLED", "runs order_shippable_weight_ledger", "increments ShipmentLoad.version by 1 and Order.version by 1"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["moves the logical clock used by every issued_at, valid_until, locked_at, sealed_at, released_at, completed_at and dispatched_at stamp and by every temporal validation"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the eight declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Builder acts on a quote whose builder_id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the reviewing X-User-ID equals design.submitted_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, out-of-range number, empty component_marks, or class-inconsistent component fields"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "no Jurisdiction with the given id"
  - id: ERR_BUILDER_NOT_FOUND
    http: 404
    condition: "no Builder with the given id"
  - id: ERR_CONFIGURATION_NOT_FOUND
    http: 404
    condition: "no BuildingConfiguration with the given id"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "no Quote with the given id"
  - id: ERR_DESIGN_NOT_FOUND
    http: 404
    condition: "no EngineeringDesign with the given id"
  - id: ERR_DRAWING_PACKAGE_NOT_FOUND
    http: 404
    condition: "no DrawingPackage with the given id"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "no Order with the given id"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "no ProductionLine with the given id"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "no ProductionLot with the given id"
  - id: ERR_LOAD_NOT_FOUND
    http: 404
    condition: "no ShipmentLoad with the given id"
  - id: ERR_STALE_CONFIGURATION_VERSION
    http: 412
    condition: "expected_configuration_version does not equal the configuration's current version on design creation"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the order's current version on load creation, release or cancel-release"
  - id: ERR_BUILDER_NOT_AUTHORIZED
    http: 409
    condition: "the builder in scope is PENDING_AUTHORIZATION or SUSPENDED"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target resource is not in the from-state the requested transition requires"
  - id: ERR_CONFIGURATION_NOT_LOCKED
    http: 409
    condition: "the referenced configuration is DRAFT or CRITERIA_STALE where LOCKED is required"
  - id: ERR_DESIGN_NOT_APPROVED
    http: 409
    condition: "sealing a package whose design is not APPROVED"
  - id: ERR_DRAWINGS_NOT_SEALED
    http: 409
    condition: "releasing an order that is not ENG_SEALED, has no drawing_package_id, whose package is not SEALED, or that carries permit_hold or commercial_hold"
  - id: ERR_ORDER_NOT_RELEASED
    http: 409
    condition: "scheduling a lot or planning/dispatching a load against an order that is not in a released production state"
  - id: ERR_LOT_NOT_COMPLETE
    http: 409
    condition: "dispatching a load whose mapped fabrication lot is missing or not COMPLETE"
  - id: ERR_ORDER_HAS_ACTIVE_WORK
    http: 409
    condition: "cancel-release attempted while a lot is SCHEDULED or COMPLETE or a load is PLANNED or DISPATCHED"
  - id: ERR_PRIMARY_FRAME_MEMBERS_MISSING
    http: 422
    condition: "submitting a design with no PRIMARY_FRAME_MEMBER component"
  - id: ERR_CONNECTION_DETAILS_INCOMPLETE
    http: 422
    condition: "sealing a package whose design lacks a KNEE or a BASE connection detail"
  - id: ERR_CONNECTION_CAPACITY_INSUFFICIENT
    http: 422
    condition: "a KNEE connection detail's capacity_moment_kip_ft is below design.required_moment_kip_ft at seal time"
  - id: ERR_SEAL_LICENSE_STATE_MISMATCH
    http: 422
    condition: "sealing_license_state differs from the permitting jurisdiction's state_code"
  - id: ERR_MARK_NOT_FOUND
    http: 422
    condition: "a mark in component_marks does not resolve to a component of the order's design"
  - id: ERR_LOAD_ITEM_STAGE_MISMATCH
    http: 422
    condition: "a resolved component's erection_stage differs from the load's erection_stage"
  - id: ERR_PAINT_COLOR_MISMATCH
    http: 422
    condition: "a PANEL_RUN lot's paint_color differs from the configuration's panel_color"
  - id: ERR_LOT_TYPE_LINE_MISMATCH
    http: 422
    condition: "lot_type does not map to the chosen line's line_type"
  - id: ERR_QUOTE_EXPIRED
    http: 422
    condition: "accepting a quote after quote.valid_until"
  - id: ERR_INVALID_WINDOW_RANGE
    http: 400
    condition: "window_end is not after window_start, or unload_window_end precedes unload_window_start"
  - id: ERR_LOT_WINDOW_IN_PAST
    http: 422
    condition: "window_start is before the current logical clock"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "jurisdiction code or production line code already exists"
  - id: ERR_TERRITORY_BUILDER_LIMIT
    http: 409
    condition: "authorizing would exceed the territory's max_authorized_builders"
  - id: ERR_DUPLICATE_COMPONENT_MARK
    http: 409
    condition: "a component with the same mark already exists on the design"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "revise attempted when revision_count already equals MAX_DESIGN_REVISIONS"
  - id: ERR_DUPLICATE_MARK
    http: 400
    condition: "component_marks contains the same mark twice"
  - id: ERR_MARK_ALREADY_ASSIGNED
    http: 409
    condition: "a mark already sits on another PLANNED or DISPATCHED load of the same order"
  - id: ERR_LINE_WINDOW_CONFLICT
    http: 409
    condition: "the requested line window collides with an occupant window, widened by the changeover buffer when the paint colours differ"
  - id: ERR_SITE_UNLOAD_CAPACITY_EXCEEDED
    http: 409
    condition: "the new closed unload window meets at least site_delivery_capacity existing loads at the same job site"
  - id: ERR_ERECTION_SEQUENCE_VIOLATION
    http: 409
    condition: "dispatching a load while an earlier-stage load of the same order is still PLANNED"
  - id: ERR_ADJUSTMENT_LIMIT_EXCEEDED
    http: 422
    condition: "adjustment_cents is more negative than 20 percent of the parts subtotal"
  - id: ERR_BUILDER_CREDIT_EXCEEDED
    http: 402
    condition: "the accepted quote price, or the positive final-price delta at release, exceeds the builder's credit_available_cents"

roles:
  - name: PlatformAdmin
    description: "Network operations: jurisdictions and their loading criteria, builder authorization and suspension, production lines, logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /jurisdictions/{id}/loading-criteria"
      - "POST /builders"
      - "POST /builders/{id}/authorize"
      - "POST /builders/{id}/suspend"
      - "POST /production-lines"
      - "POST /_clock/set_current_utc"
    shared_operations: ["every GET endpoint"]
  - name: SalesEngineer
    description: "Configures buildings, adds accessory kits, prices and issues quotes."
    identity: "opaque"
    exclusive_operations:
      - "POST /building-configurations"
      - "POST /building-configurations/{id}/lock"
      - "POST /building-configurations/{id}/accessory-kits"
      - "POST /quotes"
      - "POST /quotes/{id}/issue"
    shared_operations: ["every GET endpoint"]
  - name: Engineer
    description: "Creates designs, details components and connections, submits for review and consumes revisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /engineering-designs"
      - "POST /engineering-designs/{id}/components"
      - "POST /engineering-designs/{id}/submit"
      - "POST /engineering-designs/{id}/revise"
    shared_operations: ["every GET endpoint"]
  - name: EngineeringManager
    description: "Reviews submitted designs. Never the submitting user — enforced by the segregation-of-duties check."
    identity: "opaque"
    exclusive_operations:
      - "POST /engineering-designs/{id}/review"
    shared_operations: ["every GET endpoint"]
  - name: SealingEngineer
    description: "Produces and seals permit drawing sets under a state professional-engineer licence."
    identity: "opaque"
    exclusive_operations:
      - "POST /drawing-packages"
      - "POST /drawing-packages/{id}/seal"
    shared_operations: ["every GET endpoint"]
  - name: ProductionPlanner
    description: "Releases sealed orders to the plant, schedules and closes fabrication lots."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/release-to-fabrication"
      - "POST /orders/{id}/cancel-release"
      - "POST /production-lots"
      - "POST /production-lots/{id}/complete"
      - "POST /production-lots/{id}/cancel"
    shared_operations: ["every GET endpoint"]
  - name: LogisticsCoordinator
    description: "Plans, dispatches and cancels truckloads in erection order."
    identity: "opaque"
    exclusive_operations:
      - "POST /shipment-loads"
      - "POST /shipment-loads/{id}/dispatch"
      - "POST /shipment-loads/{id}/cancel"
    shared_operations: ["every GET endpoint"]
  - name: Builder
    description: "Authorized dealer-builder. Accepts issued quotes for itself only; X-User-ID is the Builder row's id."
    identity: "entity_backed:Builder"
    exclusive_operations:
      - "POST /quotes/{id}/accept"
    shared_operations: ["every GET endpoint"]
