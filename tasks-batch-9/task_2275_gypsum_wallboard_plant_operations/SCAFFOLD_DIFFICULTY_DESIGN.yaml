            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 300.000, declared_free_moisture_pct: 9.50, declared_purity_pct: 94.0 }
