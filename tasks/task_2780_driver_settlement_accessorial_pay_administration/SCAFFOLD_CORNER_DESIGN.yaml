      - name: component_type_legality_is_a_function_of_the_package_driver_type
        claim_type: error_triggerable
        grounds:
          - validations[priority=36]
          - errors[ERR_COMPONENT_TYPE_NOT_ALLOWED]
          - entities.PayComponent.fields.component_type
        distinguishing_aspect: |
          The legality matrix is two-sided and neither half may be dropped: an HOURLY component is refused on a
          LEASED_OPERATOR package while a REVENUE_PERCENT component is refused on a COMPANY_SOLO package, and the
          very same HOURLY body that failed on the leased package is accepted on the company package. Both
          failures are ERR_COMPONENT_TYPE_NOT_ALLOWED at 422 and never ERR_INVALID_FIELD_VALUE, because the
          component_type and the unit are declared members correctly paired as HOURLY:HOUR.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "DRAFT package PKG_LEG1 with driver_type LEASED_OPERATOR and no components"
