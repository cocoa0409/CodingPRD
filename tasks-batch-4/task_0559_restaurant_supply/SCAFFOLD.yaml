    input: ["limit?", "offset?"]
    output: "Dock[]"
    side_effects: []

  - method: GET
    path: "/docks/{dock_id}"
    description: "Get a dock"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: []
    output: Dock
    side_effects: []

  - method: POST
    path: "/delivery-appointments"
    description: "Schedule a dock delivery window for a confirmed order (half-open, no overlap)"
    roles: [WarehouseOps]
    code: 201
    input: [order_id, dock_id, window_start, window_end]
    output: DeliveryAppointment
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/delivery-appointments"
    description: "List delivery appointments filtered by order or dock (reverse-reachability for both FKs)"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["order_id?", "dock_id?", "limit?", "offset?"]
    output: "DeliveryAppointment[]"
    side_effects: []

  - method: GET
    path: "/delivery-appointments/{appointment_id}"
    description: "Get a delivery appointment"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: []

  - method: POST
    path: "/delivery-appointments/{appointment_id}/cancel"
    description: "Cancel a delivery appointment (frees the dock interval)"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: ["status → CANCELLED"]

  # ---- InstallCrew / InstallJob ----
  - method: POST
    path: "/install-crews"
    description: "Create an equipment install crew"
    roles: [WarehouseOps]
    code: 201
    input: [name]
    output: InstallCrew
    side_effects: []

  - method: GET
    path: "/install-crews"
    description: "List install crews"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "InstallCrew[]"
    side_effects: []

  - method: GET
    path: "/install-crews/{crew_id}"
    description: "Get an install crew"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: []
    output: InstallCrew
    side_effects: []

  - method: POST
    path: "/install-jobs"
    description: "Schedule an equipment install (buffer between crew jobs; after lead time)"
    roles: [WarehouseOps]
    code: 201
    input: [order_id, crew_id, window_start, window_end]
    output: InstallJob
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/install-jobs"
    description: "List install jobs filtered by order or crew (reverse-reachability for both FKs)"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["order_id?", "crew_id?", "limit?", "offset?"]
    output: "InstallJob[]"
    side_effects: []

  - method: GET
    path: "/install-jobs/{job_id}"
    description: "Get an install job"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: []
    output: InstallJob
    side_effects: []

  - method: POST
    path: "/install-jobs/{job_id}/cancel"
    description: "Cancel an install job (frees the crew interval)"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status → CANCELLED"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. Setting the clock also expires any APPROVED certificate whose expiry_date <= now."
    roles: [WarehouseOps]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced", "APPROVED certs with expiry_date <= now → EXPIRED; owning Account.tax_exempt_status → EXPIRED (Account.version += 1)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_ACCOUNT_OWNER, http: 403, condition: "Buyer's X-User-ID does not match the target resource's account_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, unknown enum value, or out-of-range numeric field" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "window_end <= window_start on an appointment or install job" }
  # not-found
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Account id does not exist" }
  - { id: ERR_CERT_NOT_FOUND, http: 404, condition: "Tax-exempt certificate id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Purchase order id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "Order line id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "Return authorization id does not exist" }
  - { id: ERR_RETURN_LINE_NOT_FOUND, http: 404, condition: "Return line id does not exist" }
  - { id: ERR_DOCK_NOT_FOUND, http: 404, condition: "Dock id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Delivery appointment id does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "Install crew id does not exist" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "Install job id does not exist" }
  # account state
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Suspend requires the account to be ACTIVE" }
  - { id: ERR_ACCOUNT_NOT_SUSPENDED, http: 409, condition: "Reinstate requires the account to be SUSPENDED" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Confirm requires the owning account to be ACTIVE (it is SUSPENDED)" }
  # cert state
  - { id: ERR_CERT_NOT_SUBMITTED, http: 409, condition: "Approve/reject requires certificate in SUBMITTED" }
  - { id: ERR_CERT_NOT_REJECTED, http: 409, condition: "Resubmit requires certificate in REJECTED" }
  - { id: ERR_CERT_ALREADY_EXPIRED, http: 409, condition: "Approve requires expiry_date strictly after the logical clock now" }
  # order/payment state
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Add-line/confirm requires order in DRAFT" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "Operation requires order in CONFIRMED (e.g., ship book, invoice)" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires order in DRAFT or CONFIRMED" }
  - { id: ERR_ORDER_NOT_COMPLETED, http: 409, condition: "Opening a return requires the order in COMPLETED (delivered)" }
  - { id: ERR_PAYMENT_NOT_UNPAID, http: 409, condition: "Invoice requires payment_status UNPAID" }
  - { id: ERR_PAYMENT_NOT_INVOICED, http: 409, condition: "Pay requires payment_status INVOICED" }
  # shipment state
  - { id: ERR_SHIPMENT_NOT_QUOTED, http: 409, condition: "Book requires shipment in QUOTED" }
  - { id: ERR_SHIPMENT_NOT_BOOKED, http: 409, condition: "Deliver requires shipment in BOOKED" }
  - { id: ERR_SHIPMENT_NOT_CANCELLABLE, http: 409, condition: "Cancel requires shipment in QUOTED or BOOKED" }
  # return state
  - { id: ERR_RETURN_NOT_REQUESTED, http: 409, condition: "Approve/reject/add-line requires RMA in REQUESTED" }
  - { id: ERR_RETURN_NOT_APPROVED, http: 409, condition: "Receive/revise requires RMA in APPROVED" }
  - { id: ERR_RETURN_NOT_RECEIVED, http: 409, condition: "Refund requires RMA in RECEIVED" }
  # scheduling / appointment / job state
  - { id: ERR_APPOINTMENT_NOT_SCHEDULED, http: 409, condition: "Cancel requires appointment in SCHEDULED" }
  - { id: ERR_JOB_NOT_SCHEDULED, http: 409, condition: "Cancel requires install job in SCHEDULED" }
  # referential / constraint / temporal / fiscal
  - { id: ERR_PRODUCT_NOT_IN_ORDER, http: 422, condition: "Return line product does not appear on the original order" }
  - { id: ERR_RETURN_QTY_EXCEEDS_ORDERED, http: 422, condition: "Return quantity exceeds quantity ordered for that product" }
  - { id: ERR_ORDER_HAS_NO_LINES, http: 422, condition: "Confirm requires at least one non-CANCELLED line" }
  - { id: ERR_RETURN_HAS_NO_LINES, http: 422, condition: "Approve requires at least one return line" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 422, condition: "Return opened more than RETURN_WINDOW_DAYS after delivery" }
  - { id: ERR_LEAD_TIME_NOT_ELAPSED, http: 422, condition: "Install window_start earlier than confirmed_at + equipment lead_time_days" }
  - { id: ERR_NO_EQUIPMENT_LINE, http: 422, condition: "Install job requires the order to contain an EQUIPMENT line" }
  - { id: ERR_DOCK_DOUBLE_BOOKED, http: 409, condition: "Requested dock window overlaps an existing SCHEDULED appointment on the same dock" }
  - { id: ERR_CREW_BUFFER_CONFLICT, http: 409, condition: "Requested crew window is within INSTALL_BUFFER_MINUTES of an existing SCHEDULED job on the same crew" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Order total exceeds account credit_available_cents at confirm" }
  # concurrency
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match current Account.version at confirm" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Manages accounts, credit terms/limits, credit holds, and tax-exempt certificate approvals; invoices orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts — create account"
      - "POST /accounts/{id}/suspend — credit hold"
      - "POST /accounts/{id}/reinstate — lift hold"
      - "POST /tax-certificates/{id}/approve — approve certificate"
      - "POST /tax-certificates/{id}/reject — reject certificate"
      - "POST /orders/{id}/invoice — invoice a confirmed order"
    shared_operations:
      - "GET reads across accounts, certificates, products, orders, lines, shipments, returns, docks, appointments, crews, jobs"

  - name: Buyer
    description: "The B2B customer; owns and drives their own account's orders, returns, payments, and certificate submissions."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /accounts/{id}/tax-certificates — submit certificate (own account)"
      - "POST /tax-certificates/{id}/resubmit — resubmit rejected certificate (own account)"
      - "POST /orders — create order (own account)"
      - "POST /orders/{id}/lines — add line (own order)"
      - "POST /orders/{id}/confirm — confirm order (own order)"
      - "POST /orders/{id}/cancel — cancel order (own order)"
      - "POST /orders/{id}/pay — pay invoiced order (own order)"
      - "POST /orders/{id}/returns — open RMA (own order)"
      - "POST /returns/{id}/lines — add return line (own RMA)"
    shared_operations:
      - "GET reads across accounts, certificates, products, orders, lines, shipments, returns, docks, appointments, crews, jobs"

  - name: WarehouseOps
    description: "Manages catalog/inventory, order fulfillment (shipments), returns processing, and dock/install scheduling."
    identity: "opaque"
    exclusive_operations:
      - "POST /products, POST /products/{id}/restock — catalog & inventory"
      - "POST /shipments, /shipments/{id}/book, /deliver, /cancel — fulfillment"
      - "POST /returns/{id}/approve, /revise, /reject, /receive, /refund — returns processing"
      - "POST /docks, /delivery-appointments, /delivery-appointments/{id}/cancel — dock scheduling"
      - "POST /install-crews, /install-jobs, /install-jobs/{id}/cancel — install scheduling"
      - "POST /_clock/set_current_utc — logical clock (test-driving)"
    shared_operations:
      - "GET reads across accounts, certificates, products, orders, lines, shipments, returns, docks, appointments, crews, jobs"
