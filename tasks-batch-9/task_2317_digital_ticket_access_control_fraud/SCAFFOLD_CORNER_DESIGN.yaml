              as_user_id: "${p_ada_id}"
              captures: { bind2: $.data.device_binding_status, fp2: $.data.bound_device_fingerprint }
            - call: "POST /tickets/${t_id}/device-binding"
              payload: { device_fingerprint: "DEV-PHONE-2" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { bind3: $.data.device_binding_status, fp3: $.data.bound_device_fingerprint }
            - call: "GET /patrons/${p_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { rb2: $.data.device_rebind_count, sc2: $.data.fraud_risk_score }
            - call: "POST /tickets/${t_id}/device-binding"
              payload: { device_fingerprint: "DEV-PHONE-3" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { tv4: $.data.version }
            - call: "GET /patrons/${p_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { rb3: $.data.device_rebind_count, sc3: $.data.fraud_risk_score }
          assert:
            - "${bind0} == UNBOUND, ${bind1} == BOUND, ${fp1} == DEV-PHONE-1 and ${tv1} == 2"
            - "${rb1} == 0 and ${sc1} == 0 — a first binding is not a rebind"
            - "${bind2} == RELEASED and ${fp2} == null"
            - "${bind3} == BOUND and ${fp3} == DEV-PHONE-2"
            - "${rb2} == 1 and ${sc2} == 0 — churn is 4 * max(1 - 1, 0) == 0"
            - "${rb3} == 2 and ${sc3} == 4 — churn is 4 * max(2 - 1, 0) == 4, still far below FRAUD_BLOCK_THRESHOLD 40"
            - "${tv4} == 5 — each of the four binding writes incremented Ticket.version by exactly 1"
            - "Patron.${p_ada_id}.strike_count == 0 — churn is not a strike"

      - name: occupancy_read_reports_headroom_and_a_finite_clearance_projection
        claim_type: computed_read
        grounds:
          - endpoints[GET /events/{id}/occupancy]
          - calculations.gate_clearance_projection
          - calculations.live_occupancy
          - calculations.zone_posture
        distinguishing_aspect: |
          With one of two tickets admitted through a SCANNING gate of 20 per minute across 2
          lanes, capacity_per_minute is 40 and exactly one ticket is still NOT_ADMITTED, so
          projected_clearance_minutes is ceil(1 / 40) == 1 — the ceiling, not 0 and not a
          fractional value. headroom is measured against the EVENT capacity (200 - 1 == 199)
          while the zone row reports its own occupancy against the zone's 150.
        test_recipe:
          setup:
            - "Event DOORS_OPEN; AccessZone GA1 (fire_code_capacity 150); Gate G1 (20 per minute, 2 lanes) SCANNING; Ada and Bob hold bound PAID tickets; only Ada has been scanned IN at 2026-09-12T18:10:00Z."
