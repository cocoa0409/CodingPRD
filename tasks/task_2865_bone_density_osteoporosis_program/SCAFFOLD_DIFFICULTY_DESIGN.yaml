            - "GET /bone-density/scan-appointments?densitometer_id=${dev_b_id}&status=BOOKED returns total_count 1"

  - rule_id: compensating_invariant
    instances:
      - name: cancelling_a_slot_restores_the_open_order_counter_and_reindexes_the_day
        grounds:
          - entities.Patient.fields.open_scheduled_order_count
          - entities.ScanAppointment.fields.slot_index
          - state_machines.ScanAppointment.BOOKED_to_CANCELLED
          - state_machines.ScanOrder.SCHEDULED_to_REQUESTED
          - endpoints["POST /bone-density/scan-appointments/{id}/cancel"]
        distinguishing_aspect: |
          Booking increments Patient.open_scheduled_order_count and moves the order REQUESTED ->
          SCHEDULED; a patient-requested cancellation must undo exactly that much and no more. The
          counter must return to its pre-booking value of 0 rather than going negative or staying at 1,
          the order must be REQUESTED again with reschedule_required still false — that flag is
          reserved for QC-driven cancellations, so a compensation that reuses the QC cascade path is
          detectable — and the surviving 10:00 appointment of another patient must be reindexed from
          slot_index 2 down to 1 while the cancelled row keeps cancellation_reason_code PATIENT_REQUEST
          and a stamped cancelled_at_utc.
        test_recipe:
          setup:
            - "One ACTIVE densitometer, patients MRN-2201 and MRN-2202 each with one REQUESTED order for 2026-03-10."
            - "MRN-2201 booked at 09:00-09:30 (slot_index 1) and MRN-2202 booked at 10:00-10:30 (slot_index 2)."
            - "The clock is advanced to 2026-03-08T11:00:00Z, before both slots."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
