            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - *c_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 30000, payment_type: "SALARY" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id, pay_1_v: $.data.version }
            - call: "POST /payments/${pay_1}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_1_v}" }
              as: TreasuryOperator
            - call: "GET /offsets"
              payload: { payment_id: "${pay_1}" }
              as: Auditor
              captures: { off_1: "$.data[0].id" }
          trigger:
            - call: "POST /refund-claims"
              payload: { offset_id: "${off_1}", claimed_amount_cents: 30000, reason: "DEBT_NOT_OWED" }
              as: TreasuryOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /payments/${pay_1}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
            - call: "POST /refund-claims"
              payload: { offset_id: "${off_1}", claimed_amount_cents: 30000, reason: "DEBT_NOT_OWED" }
              as: TreasuryOperator
              captures: { claim_1: $.data.id, claim_1_status: $.data.status }
          assert:
            - "while the offset is PROPOSED: 409 with error_id == ERR_OFFSET_NOT_APPLIED and no claim row exists"
            - "after execute flips the offset to APPLIED: the identical filing returns 201 and RefundClaim.${claim_1}.status == FILED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: reciprocal_agreement_half_open
        grounds:
          - entities.ReciprocalAgreement.fields.effective_from
          - entities.ReciprocalAgreement.fields.effective_until
          - errors.ERR_AGREEMENT_OVERLAP
          - endpoints.POST /reciprocal-agreements
          - endpoints.POST /reciprocal-agreements/{reciprocalAgreementId}/activate
        distinguishing_aspect: "Half-open interval semantics on the (state_code, direction-scope) resource: a new TX FED_TO_STATE agreement starting exactly at the incumbent's effective_until (adjacent, gap == 0) is accepted, while one overlapping by a single day is rejected; direction scopes that do not intersect never conflict. The sibling rule uses closed intervals where touching IS a conflict, on a different resource."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. An ACTIVE TX FED_TO_STATE agreement covering [2026-01-01, 2027-01-01)."
          setup_api_calls:
            - *c_clock
            - call: "POST /reciprocal-agreements"
              payload: { state_code: "TX", direction: "FED_TO_STATE", effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: TreasurySupervisor
              captures: { agr_1: $.data.id }
            - call: "POST /reciprocal-agreements/${agr_1}/activate"
              payload: {}
              as: TreasurySupervisor
          trigger:
            - call: "POST /reciprocal-agreements"
              payload: { state_code: "TX", direction: "FED_TO_STATE", effective_from: "2027-01-01T00:00:00Z", effective_until: "2028-01-01T00:00:00Z" }
              as: TreasurySupervisor
              captures: { agr_2: $.data.id }
            - call: "POST /reciprocal-agreements/${agr_2}/activate"
              payload: {}
              as: TreasurySupervisor
              captures: { agr_2_status: $.data.status }
            - call: "POST /reciprocal-agreements"
              payload: { state_code: "TX", direction: "FED_TO_STATE", effective_from: "2026-12-31T00:00:00Z", effective_until: "2027-06-01T00:00:00Z" }
              as: TreasurySupervisor
              captures: { err_overlap: $.data.error_id }
            - call: "POST /reciprocal-agreements"
              payload: { state_code: "TX", direction: "STATE_TO_FED", effective_from: "2026-06-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z" }
              as: TreasurySupervisor
              captures: { agr_4: $.data.id }
            - call: "POST /reciprocal-agreements"
              payload: { state_code: "TX", direction: "BIDIRECTIONAL", effective_from: "2026-09-01T00:00:00Z", effective_until: "2027-09-01T00:00:00Z" }
              as: TreasurySupervisor
              captures: { err_bidi: $.data.error_id }
          assert:
            - "adjacent [2027-01-01, 2028-01-01) is accepted (201) and activates — half-open windows treat effective_until as exclusive"
            - "overlapping [2026-12-31, 2027-06-01) is rejected with 409 ERR_AGREEMENT_OVERLAP"
            - "STATE_TO_FED overlapping in time but disjoint in direction scope is accepted (201)"
            - "BIDIRECTIONAL conflicts with both scopes: rejected with 409 ERR_AGREEMENT_OVERLAP"

      - name: dnp_record_closed_interval_touching
        grounds:
          - entities.DoNotPayRecord.fields.effective_from
          - entities.DoNotPayRecord.fields.effective_until
          - errors.ERR_DNP_WINDOW_OVERLAP
          - endpoints.POST /do-not-pay-records
        distinguishing_aspect: "Closed-interval semantics on the (tin, list_source) resource: a second SAM_EXCLUSION window whose effective_from equals the incumbent's effective_until TOUCHES it and is rejected, while starting one day later is accepted — the exact inverse of the half-open adjacency rule for reciprocal agreements, on a different resource entity."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. An ACTIVE SAM_EXCLUSION record for tin 999-88-7777 covering the closed interval [2026-01-01, 2026-06-01]."
          setup_api_calls:
            - *c_clock
            - call: "POST /do-not-pay-records"
              payload: { tin: "999-88-7777", list_source: "SAM_EXCLUSION", effective_from: "2026-01-01T00:00:00Z", effective_until: "2026-06-01T00:00:00Z" }
              as: TreasuryOperator
              captures: { dnp_1: $.data.id }
          trigger:
            - call: "POST /do-not-pay-records"
              payload: { tin: "999-88-7777", list_source: "SAM_EXCLUSION", effective_from: "2026-06-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z" }
              as: TreasuryOperator
              captures: { err_touch: $.data.error_id }
            - call: "POST /do-not-pay-records"
              payload: { tin: "999-88-7777", list_source: "SAM_EXCLUSION", effective_from: "2026-06-02T00:00:00Z", effective_until: "2026-12-01T00:00:00Z" }
              as: TreasuryOperator
              captures: { dnp_2: $.data.id }
            - call: "POST /do-not-pay-records"
              payload: { tin: "999-88-7777", list_source: "DEATH_MASTER_FILE", effective_from: "2026-03-01T00:00:00Z", effective_until: "2026-09-01T00:00:00Z" }
              as: TreasuryOperator
              captures: { dnp_3: $.data.id }
          assert:
            - "touching closed intervals (new effective_from == existing effective_until) conflict: 409 ERR_DNP_WINDOW_OVERLAP"
            - "effective_from 2026-06-02 (strictly after the incumbent's 2026-06-01 end) is accepted (201)"
            - "the same tin on a different list_source (DEATH_MASTER_FILE) overlaps freely — the resource key is (tin, list_source)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: payment_decomposition_and_reversal
        grounds:
          - entities.Payment.fields.amount_cents
          - entities.Payment.fields.total_offset_cents
          - entities.Payment.fields.disbursed_cents
          - calculations.outstanding_receivable_aggregation
          - state_machines.Payment.EXECUTED_to_REVERSED
        distinguishing_aspect: "Conserved quantity = payment gross decomposition and the creditor's outstanding receivable: at EXECUTED, amount_cents == total_offset_cents + disbursed_cents exactly, and the reversal (compensating action) restores outstanding_receivable_cents to its pre-execute value with zero drift. The sibling invariant conserves the refund decomposition on the remittance ledger."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Federal creditor; payee tin 111-22-3333; FULL SALARY policy ACTIVE; ACTIVE debts 30000 (FEDERAL_TAX) and 20000 (FEDERAL_NONTAX). Creditor outstanding_receivable_cents == 50000 before execution."
          setup_api_calls:
            - *c_clock
            - *c_cred_fed
            - *c_payee1
            - call: "POST /exemption-policies"
              payload: { payment_type: "SALARY", exemption_class: "FULL" }
              as: TreasurySupervisor
              captures: { pol_s: $.data.id }
            - call: "POST /exemption-policies/${pol_s}/activate"
              payload: {}
              as: TreasurySupervisor
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_TAX", original_amount_cents: 30000, delinquent_since: "2026-01-10T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1: $.data.id }
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "POST /debts"
              payload: { creditor_agency_id: "${cred_fed}", debtor_tin: "111-22-3333", debtor_name: "Pat Doe", debt_type: "FEDERAL_NONTAX", original_amount_cents: 20000, delinquent_since: "2026-02-01T00:00:00Z", notice_sent_at: "2026-08-01T00:00:00Z", due_process_completed: true }
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_2: $.data.id }
            - call: "POST /debts/${debt_2}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
            - call: "GET /creditor-agencies/${cred_fed}"
              payload: {}
              as: Auditor
              captures: { out_pre: $.data.outstanding_receivable_cents }
            - *c_file1
            - call: "POST /payment-files/${file_1}/payments"
              payload: { payee_id: "${payee_1}", payee_tin: "111-22-3333", amount_cents: 100000, payment_type: "SALARY" }
              as: PaymentAgencyAnalyst
              captures: { pay_1: $.data.id, pay_1_v: $.data.version }
            - call: "POST /payments/${pay_1}/evaluate-offsets"
              payload: { expected_payment_version: "${pay_1_v}" }
              as: TreasuryOperator
          trigger:
            - call: "POST /payments/${pay_1}/execute"
              payload: {}
              as: TreasuryOperator
              as_user_id: "op-1"
            - call: "GET /payments/${pay_1}"
              payload: {}
              as: Auditor
            - call: "GET /creditor-agencies/${cred_fed}"
              payload: {}
              as: Auditor
              captures: { out_mid: $.data.outstanding_receivable_cents }
            - call: "POST /payments/${pay_1}/reverse"
              payload: {}
              as: TreasuryOperator
            - call: "GET /creditor-agencies/${cred_fed}"
              payload: {}
              as: Auditor
              captures: { out_post: $.data.outstanding_receivable_cents }
          assert:
            - "before execute: outstanding_receivable_cents == 50000"
            - "at EXECUTED: Payment.${pay_1}.amount_cents (100000) == total_offset_cents (50000) + disbursed_cents (50000) — the decomposition invariant holds exactly"
            - "at EXECUTED: outstanding_receivable_cents == 0 (both debts PAID_IN_FULL)"
            - "after the compensating reversal: outstanding_receivable_cents == 50000 again — forward action plus compensation leaves the conserved quantity unchanged"

      - name: remittance_ledger_refund_clawback
        grounds:
          - calculations.refund_restitution
          - entities.RefundClaim.fields.clawback_cents
          - entities.RefundClaim.fields.treasury_absorbed_cents
          - entities.CreditorAgency.fields.remitted_net_total_cents
          - validations[priority=3]
        distinguishing_aspect: "Conserved quantity = the refund decomposition over the remittance ledger: refund_amount_cents == clawback_cents + treasury_absorbed_cents, and the creditor's net ledger after a full refund returns to exactly its pre-offset value (the withheld fee is absorbed by Treasury, never clawed back). The sibling invariant conserves the payment decomposition."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Federal creditor; payee tin 111-22-3333; FULL SALARY policy ACTIVE; ACTIVE 50000-cent FEDERAL_NONTAX debt; a 30000-cent SALARY payment executed by operator op-1 — offset 30000 applied with fee 900 and net remittance 29100; creditor remitted_net_total_cents == 29100. Claim for the full 30000 filed and reviewed."
          setup_api_calls:
            - *c_clock
            - *c_cred_fed
            - *c_payee1
            - call: "POST /exemption-policies"
