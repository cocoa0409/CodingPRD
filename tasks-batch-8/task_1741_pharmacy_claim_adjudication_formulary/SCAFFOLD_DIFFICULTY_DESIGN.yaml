# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pharmacy Claim Adjudication & Formulary Edits — 9 rules x 2 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB via its setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: copay_card_accumulator_vs_maximizer
        grounds:
          - calculations.copay_assistance_application
          - calculations.claim_pricing
          - entities.Plan.fields.assistance_model
          - entities.Member.fields.card_balance_cents
        distinguishing_aspect: |
          Same claim inputs (drug unit 10000, qty 10, fee 200, FLAT copay 3000, card balance 5000)
          under two plans that differ ONLY in assistance_model produce different card/member splits:
          ACCUMULATOR (member floor 500) -> card 2500 / member 500; MAXIMIZER (fill cap 800) ->
          card 800 / member 2200. Entity domain: Claim pricing / Member accumulators.
        test_recipe:
          setup:
            - "Two plans identical except assistance knobs: P_ACC (ACCUMULATOR, member_min_pay_cents 500, card_fill_cap_cents 0) and P_MAX (MAXIMIZER, member_min_pay_cents 0, card_fill_cap_cents 800); both deductible 0, oop_max 1000000, fee 200, both ACTIVE with a FLAT-3000 tier-2 entry for the same drug (unit 10000)"
            - "Members M_ACC on P_ACC and M_MAX on P_MAX, each holding a copay card for the drug with balance 5000"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-ACC", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 500, card_fill_cap_cents: 0, dispensing_fee_cents: 200 }, as: PbmAdmin, captures: { p_acc: $.data.id } }
            - { call: "POST /plans", payload: { name: "P-MAX", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: MAXIMIZER, member_min_pay_cents: 0, card_fill_cap_cents: 800, dispensing_fee_cents: 200 }, as: PbmAdmin, captures: { p_max: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "11111-0001", name: "Brandstatin", therapeutic_class: "STATIN", unit_cost_cents: 10000, max_daily_dose_units: 3, is_specialty: false }, as: PbmAdmin, captures: { drug_a: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_acc}", drug_id: "${drug_a}", tier: 2, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 3000, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_max}", drug_id: "${drug_a}", tier: 2, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 3000, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_acc}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /plans/${p_max}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-R1", name: "Retail One", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph1: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_acc}", external_ref: "M-ACC", full_name: "Pat Acc", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31", card_drug_id: "${drug_a}", card_balance_cents: 5000 }, as: PbmAdmin, captures: { m_acc: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_max}", external_ref: "M-MAX", full_name: "Pat Max", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31", card_drug_id: "${drug_a}", card_balance_cents: 5000 }, as: PbmAdmin, captures: { m_max: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { member_id: "${m_acc}", drug_id: "${drug_a}", prescription_number: "RX-ACC-1", fill_date: "2026-03-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph1}", captures: { c_acc: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_max}", drug_id: "${drug_a}", prescription_number: "RX-MAX-1", fill_date: "2026-03-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph1}", captures: { c_max: $.data.id } }
            - { call: "GET /members/${m_acc}", payload: {}, as: PbmAdmin }
            - { call: "GET /members/${m_max}", payload: {}, as: PbmAdmin }
          assert:
            - "Claim.${c_acc}: allowed_cents == 100200, member_pays_cents == 500, card_applied_cents == 2500, plan_paid_cents == 97200, status == PAID"
            - "Claim.${c_max}: allowed_cents == 100200, member_pays_cents == 2200, card_applied_cents == 800, plan_paid_cents == 97200, status == PAID"
            - "Member.${m_acc}: oop_paid_cents == 500, card_balance_cents == 2500"
            - "Member.${m_max}: oop_paid_cents == 2200, card_balance_cents == 4200"

      - name: audit_clawback_claim_level_vs_extrapolated
        grounds:
          - calculations.audit_clawback_total
          - entities.PharmacyAudit.fields.extrapolation_method
          - entities.PharmacyAudit.fields.total_clawback_cents
        distinguishing_aspect: |
          Two audits with identical findings (clawbacks 3333 and 1001) over identical 3-claim paid
          universes differ only by extrapolation_method: CLAIM_LEVEL totals 4334 while EXTRAPOLATED
          (factor 3/2, per-claim rounding) totals 6502. Entity domain: PharmacyAudit clawback,
          distinct from the Claim pricing domain of copay_card_accumulator_vs_maximizer.
        test_recipe:
          setup:
            - "Plan (deductible 0, fee 100) ACTIVE with FLAT-0 entry for drug X (unit 1000) -> every claim qty 10 prices to allowed 10100, patient_resp 0, plan_paid 10100"
            - "Pharmacies RX1 and RX2 (threshold 1000000, never suspend); member M eligible all of 2026, no card"
            - "3 PAID claims per pharmacy for M and drug X at non-overlapping fill dates (RX1: 03-01, 04-01, 05-01; RX2: 03-15, 04-15, 05-15; days_supply 10)"
            - "Audit A1 on RX1 method CLAIM_LEVEL and A2 on RX2 method EXTRAPOLATED, both window 2026-01-01..2026-12-31, each with findings of 3333 on the first claim and 1001 on the second"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-CLW", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 100 }, as: PbmAdmin, captures: { p_clw: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "22222-0001", name: "Genericillin", therapeutic_class: "ANTIBIOTIC", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_x: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_clw}", drug_id: "${drug_x}", tier: 1, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 0, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_clw}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-A1", name: "Rx One", channel: RETAIL, auto_suspend_threshold_cents: 1000000 }, as: PbmAdmin, captures: { ph_a: $.data.id } }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-A2", name: "Rx Two", channel: RETAIL, auto_suspend_threshold_cents: 1000000 }, as: PbmAdmin, captures: { ph_b: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_clw}", external_ref: "M-CLW", full_name: "Pat Claw", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_clw: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_clw}", drug_id: "${drug_x}", prescription_number: "RX-A1", fill_date: "2026-03-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_a}", captures: { cl_a1: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_clw}", drug_id: "${drug_x}", prescription_number: "RX-A2", fill_date: "2026-04-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_a}", captures: { cl_a2: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_clw}", drug_id: "${drug_x}", prescription_number: "RX-A3", fill_date: "2026-05-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_a}" }
            - { call: "POST /claims", payload: { member_id: "${m_clw}", drug_id: "${drug_x}", prescription_number: "RX-B1", fill_date: "2026-03-15", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_b}", captures: { cl_b1: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_clw}", drug_id: "${drug_x}", prescription_number: "RX-B2", fill_date: "2026-04-15", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_b}", captures: { cl_b2: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_clw}", drug_id: "${drug_x}", prescription_number: "RX-B3", fill_date: "2026-05-15", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_b}" }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_a}", window_start_date: "2026-01-01", window_end_date: "2026-12-31", extrapolation_method: CLAIM_LEVEL }, as: Auditor, captures: { au_a: $.data.id } }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_b}", window_start_date: "2026-01-01", window_end_date: "2026-12-31", extrapolation_method: EXTRAPOLATED }, as: Auditor, captures: { au_b: $.data.id } }
            - { call: "POST /audits/${au_a}/findings", payload: { findings: [ { claim_id: "${cl_a1}", clawback_cents: 3333 }, { claim_id: "${cl_a2}", clawback_cents: 1001 } ] }, as: Auditor }
            - { call: "POST /audits/${au_b}/findings", payload: { findings: [ { claim_id: "${cl_b1}", clawback_cents: 3333 }, { claim_id: "${cl_b2}", clawback_cents: 1001 } ] }, as: Auditor }
          trigger:
            - { call: "POST /audits/${au_a}/close", payload: {}, as: Auditor }
            - { call: "POST /audits/${au_b}/close", payload: {}, as: Auditor }
            - { call: "GET /audits/${au_a}", payload: {}, as: Auditor }
            - { call: "GET /audits/${au_b}", payload: {}, as: Auditor }
          assert:
            - "PharmacyAudit.${au_a}: status == CLOSED_WITH_FINDINGS, sample_size == 2, universe_paid_claims == 3, total_clawback_cents == 4334"
            - "PharmacyAudit.${au_b}: status == CLOSED_WITH_FINDINGS, sample_size == 2, universe_paid_claims == 3, total_clawback_cents == 6502"
            - "Pharmacy.${ph_a}.balance_cents == 25966 (30300 - 4334); Pharmacy.${ph_b}.balance_cents == 23798 (30300 - 6502)"

  - rule_id: combinatorial_formula
    instances:
      - name: pricing_nested_min_max_deductible_crossing
        grounds:
          - calculations.claim_pricing
          - entities.Plan.fields.deductible_cents
          - entities.Member.fields.deductible_paid_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction (allowed amount, remaining deductible,
          tier copay, OOP remainder) composed through nested min/max. A first claim partially spends
          the deductible (10000 of 15000); the second claim's 300000 allowed crosses the remaining
          5000 deductible exactly, so copay applies only post-deductible: deductible_applied 5000,
          copay 3000, member pays 8000, plan pays 292000.
        test_recipe:
          setup:
            - "Plan deductible 15000, oop_max 1000000, fee 0, ACCUMULATOR (min 0), ACTIVE with FLAT-3000 entry for drug Y (unit 10000); member no card, eligible all 2026"
            - "Claim 1 qty 1 on 2026-03-01 PAID: allowed 10000, all absorbed by deductible (member ded 10000, oop 10000, plan_paid 0)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-DED", deductible_cents: 15000, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_ded: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "33333-0001", name: "Pressoril", therapeutic_class: "ANTIHYPERTENSIVE", unit_cost_cents: 10000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_y: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_ded}", drug_id: "${drug_y}", tier: 2, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 3000, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_ded}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-D1", name: "Rx Ded", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_d: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_ded}", external_ref: "M-DED", full_name: "Pat Ded", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_ded: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_ded}", drug_id: "${drug_y}", prescription_number: "RX-D1", fill_date: "2026-03-01", quantity: 1, days_supply: 1 }, as: Pharmacist, as_user_id: "${ph_d}", captures: { c_d1: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { member_id: "${m_ded}", drug_id: "${drug_y}", prescription_number: "RX-D2", fill_date: "2026-04-01", quantity: 30, days_supply: 30 }, as: Pharmacist, as_user_id: "${ph_d}", captures: { c_d2: $.data.id } }
            - { call: "GET /members/${m_ded}", payload: {}, as: PbmAdmin }
          assert:
            - "Claim.${c_d1}: allowed_cents == 10000, deductible_applied_cents == 10000, copay_base_cents == 3000, member_pays_cents == 10000, plan_paid_cents == 0"
            - "Claim.${c_d2}: allowed_cents == 300000, deductible_applied_cents == 5000, copay_base_cents == 3000, member_pays_cents == 8000, plan_paid_cents == 292000"
            - "Member.${m_ded}: deductible_paid_cents == 15000 (exactly met), oop_paid_cents == 18000, oop_max_reached == false"

      - name: audit_extrapolation_per_claim_rounding_order
        grounds:
          - calculations.audit_clawback_total
          - entities.PharmacyAudit.fields.total_clawback_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins round-per-claim-then-sum.
          With universe 3, sample 2 (factor 1.5) and clawbacks 3333 + 1001, the pinned order yields
          round(4999.5)=5000 plus round(1501.5)=1502 = 6502; the forbidden sum-then-round order
          would yield round(6501.0)=6501. Distinct mode from
          pricing_nested_min_max_deductible_crossing (mode a).
        test_recipe:
          setup:
            - "Plan (deductible 0, fee 100) ACTIVE with FLAT-0 entry for drug X (unit 1000); pharmacy RX-E threshold 1000000; member eligible all 2026, no card"
            - "3 PAID claims (plan_paid 10100 each) on 2026-03-01, 2026-04-01, 2026-05-01"
            - "EXTRAPOLATED audit, window 2026-01-01..2026-12-31, findings 3333 on claim 1 and 1001 on claim 2"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-RND", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 100 }, as: PbmAdmin, captures: { p_rnd: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "22222-0002", name: "Genericillin-B", therapeutic_class: "ANTIBIOTIC", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_r: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_rnd}", drug_id: "${drug_r}", tier: 1, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 0, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_rnd}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-E1", name: "Rx Round", channel: RETAIL, auto_suspend_threshold_cents: 1000000 }, as: PbmAdmin, captures: { ph_e: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_rnd}", external_ref: "M-RND", full_name: "Pat Round", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_rnd: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_rnd}", drug_id: "${drug_r}", prescription_number: "RX-E1", fill_date: "2026-03-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_e}", captures: { cl_e1: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_rnd}", drug_id: "${drug_r}", prescription_number: "RX-E2", fill_date: "2026-04-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_e}", captures: { cl_e2: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_rnd}", drug_id: "${drug_r}", prescription_number: "RX-E3", fill_date: "2026-05-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_e}" }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_e}", window_start_date: "2026-01-01", window_end_date: "2026-12-31", extrapolation_method: EXTRAPOLATED }, as: Auditor, captures: { au_e: $.data.id } }
            - { call: "POST /audits/${au_e}/findings", payload: { findings: [ { claim_id: "${cl_e1}", clawback_cents: 3333 }, { claim_id: "${cl_e2}", clawback_cents: 1001 } ] }, as: Auditor }
          trigger:
            - { call: "POST /audits/${au_e}/close", payload: {}, as: Auditor }
            - { call: "GET /audits/${au_e}", payload: {}, as: Auditor }
          assert:
            - "PharmacyAudit.${au_e}.total_clawback_cents == 6502 (per-claim round-then-sum), NOT 6501 (sum-then-round)"
            - "PharmacyAudit.${au_e}.universe_paid_claims == 3 and sample_size == 2"
            - "Pharmacy.${ph_e}.balance_cents == 23798"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_paid_reversed_repaid_cycle
        grounds:
          - state_machines.Claim.PAID_to_REVERSED
          - state_machines.Claim.REVERSED_to_PAID
        distinguishing_aspect: |
          Cyclic machine on Claim: PAID -> REVERSED -> PAID via reprocess with a corrected
          quantity (30 -> 20), proving the loop re-computes all financials (allowed 300000 ->
          200000, plan_paid 297000 -> 197000) and re-tags rebate REBATE_VOID -> REBATE_ELIGIBLE,
          rather than being a terminal refund.
        test_recipe:
          setup:
            - "Plan deductible 0, oop 1000000, fee 0, ACCUMULATOR min 0, ACTIVE; entry FLAT 3000, rebate_eligible true, for drug S (unit 10000, max_daily 100); retail pharmacy threshold 5000; member eligible all 2026, no card"
            - "Claim qty 30 days 30 fill 2026-03-01 -> PAID: allowed 300000, member_pays 3000, plan_paid 297000, pharmacy balance 297000, rebate REBATE_ELIGIBLE"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-CYC", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_cyc: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "44444-0001", name: "Sterodex", therapeutic_class: "STEROID", unit_cost_cents: 10000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_s: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_cyc}", drug_id: "${drug_s}", tier: 3, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 3000, rebate_eligible: true }, as: PbmAdmin }
            - { call: "POST /plans/${p_cyc}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-C1", name: "Rx Cycle", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_c: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_cyc}", external_ref: "M-CYC", full_name: "Pat Cyc", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_cyc: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_cyc}", drug_id: "${drug_s}", prescription_number: "RX-C1", fill_date: "2026-03-01", quantity: 30, days_supply: 30 }, as: Pharmacist, as_user_id: "${ph_c}", captures: { c_cyc: $.data.id } }
          trigger:
            - { call: "POST /claims/${c_cyc}/reverse", payload: { reversal_reason: "dispensing error" }, as: Pharmacist, as_user_id: "${ph_c}" }
            - { call: "GET /claims/${c_cyc}", payload: {}, as: Pharmacist, as_user_id: "${ph_c}" }
            - { call: "GET /members/${m_cyc}", payload: {}, as: PbmAdmin }
            - { call: "GET /pharmacies/${ph_c}", payload: {}, as: PbmAdmin }
            - { call: "POST /claims/${c_cyc}/reprocess", payload: { quantity: 20 }, as: Pharmacist, as_user_id: "${ph_c}" }
            - { call: "GET /claims/${c_cyc}", payload: {}, as: Pharmacist, as_user_id: "${ph_c}" }
            - { call: "GET /members/${m_cyc}", payload: {}, as: PbmAdmin }
            - { call: "GET /pharmacies/${ph_c}", payload: {}, as: PbmAdmin }
          assert:
            - "After reverse: Claim.${c_cyc}.status == REVERSED, rebate_tag == REBATE_VOID; Member.${m_cyc}.oop_paid_cents == 0; Pharmacy.${ph_c}.balance_cents == 0"
            - "After reprocess: Claim.${c_cyc}.status == PAID, quantity == 20, allowed_cents == 200000, member_pays_cents == 3000, plan_paid_cents == 197000, rebate_tag == REBATE_ELIGIBLE"
            - "Member.${m_cyc}.oop_paid_cents == 3000; Pharmacy.${ph_c}.balance_cents == 197000"

      - name: audit_dispute_revision_cycle
        grounds:
          - state_machines.PharmacyAudit.FINDINGS_RECORDED_to_DISPUTED
          - state_machines.PharmacyAudit.DISPUTED_to_FINDINGS_RECORDED
        distinguishing_aspect: |
          Cyclic machine on PharmacyAudit (a different entity than Claim):
          FINDINGS_RECORDED -> DISPUTED -> FINDINGS_RECORDED via revised findings, then close;
          the revision replaces the finding set wholesale so the final clawback reflects only the
          revised 2000, not the disputed 1000.
        test_recipe:
          setup:
            - "Plan (fee 100, FLAT-0 entry, drug X2 unit 1000) ACTIVE; pharmacy RX-F threshold 1000000; member eligible; one PAID claim plan_paid 10100"
            - "CLAIM_LEVEL audit on the pharmacy, window covering the claim"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-DSP", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 100 }, as: PbmAdmin, captures: { p_dsp: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "22222-0003", name: "Genericillin-C", therapeutic_class: "ANTIBIOTIC", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_f: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_dsp}", drug_id: "${drug_f}", tier: 1, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 0, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_dsp}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-F1", name: "Rx Find", channel: RETAIL, auto_suspend_threshold_cents: 1000000 }, as: PbmAdmin, captures: { ph_f: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_dsp}", external_ref: "M-DSP", full_name: "Pat Disp", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_dsp: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_dsp}", drug_id: "${drug_f}", prescription_number: "RX-F1", fill_date: "2026-03-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_f}", captures: { cl_f1: $.data.id } }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_f}", window_start_date: "2026-01-01", window_end_date: "2026-12-31", extrapolation_method: CLAIM_LEVEL }, as: Auditor, captures: { au_f: $.data.id } }
          trigger:
            - { call: "POST /audits/${au_f}/findings", payload: { findings: [ { claim_id: "${cl_f1}", clawback_cents: 1000 } ] }, as: Auditor }
            - { call: "GET /audits/${au_f}", payload: {}, as: Auditor }
            - { call: "POST /audits/${au_f}/dispute", payload: { dispute_reason: "documentation provided" }, as: Pharmacist, as_user_id: "${ph_f}" }
            - { call: "GET /audits/${au_f}", payload: {}, as: Auditor }
            - { call: "POST /audits/${au_f}/findings", payload: { findings: [ { claim_id: "${cl_f1}", clawback_cents: 2000 } ] }, as: Auditor }
            - { call: "GET /audits/${au_f}", payload: {}, as: Auditor }
            - { call: "POST /audits/${au_f}/close", payload: {}, as: Auditor }
            - { call: "GET /audits/${au_f}", payload: {}, as: Auditor }
            - { call: "GET /claims/${cl_f1}", payload: {}, as: Auditor }
          assert:
            - "After first findings: PharmacyAudit.${au_f}.status == FINDINGS_RECORDED and Claim.${cl_f1}.audit_status == FLAGGED"
            - "After dispute: status == DISPUTED, dispute_reason == 'documentation provided'"
            - "After revised findings: status == FINDINGS_RECORDED again (cycle completed), sample_size == 1"
            - "After close: status == CLOSED_WITH_FINDINGS, total_clawback_cents == 2000; Claim.${cl_f1}.audit_status == CLAWED_BACK; Pharmacy.${ph_f}.balance_cents == 8100"

  - rule_id: transitive_cascade
    instances:
      - name: audit_close_clawback_suspension_cascade
        grounds:
          - state_machines.PharmacyAudit.FINDINGS_RECORDED_to_CLOSED_WITH_FINDINGS
          - state_machines.Pharmacy.ACTIVE_to_SUSPENDED
          - entities.Pharmacy.fields.balance_cents
        distinguishing_aspect: |
          Depth-3 chain from POST /audits/{id}/close: (1) finding claims flip audit_status
          FLAGGED -> CLAWED_BACK (and rebate tags void), (2) those per-claim clawbacks debit the
          Pharmacy balance 10000 -> -6000, (3) the balance mutation itself trips the
          auto-suspend threshold (<= -5000) flipping Pharmacy.status ACTIVE -> SUSPENDED.
        test_recipe:
          setup:
            - "Plan (deductible 0, fee 0) ACTIVE with FLAT-0 rebate_eligible entry for drug G (unit 1000); pharmacy threshold 5000; member eligible, no card"
            - "One PAID claim qty 10 days 10 fill 2026-03-01: plan_paid 10000; pharmacy balance 10000"
            - "CLAIM_LEVEL audit, window 2026-01-01..2026-12-31, findings [{claim, 16000}]"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-SUS", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_sus: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "55555-0001", name: "Clawbackin", therapeutic_class: "ANALGESIC", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_g: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_sus}", drug_id: "${drug_g}", tier: 1, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 0, rebate_eligible: true }, as: PbmAdmin }
            - { call: "POST /plans/${p_sus}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-G1", name: "Rx Suspend", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_g: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_sus}", external_ref: "M-SUS", full_name: "Pat Sus", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_sus: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_sus}", drug_id: "${drug_g}", prescription_number: "RX-G1", fill_date: "2026-03-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_g}", captures: { cl_g1: $.data.id } }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_g}", window_start_date: "2026-01-01", window_end_date: "2026-12-31", extrapolation_method: CLAIM_LEVEL }, as: Auditor, captures: { au_g: $.data.id } }
            - { call: "POST /audits/${au_g}/findings", payload: { findings: [ { claim_id: "${cl_g1}", clawback_cents: 16000 } ] }, as: Auditor }
          trigger:
            - { call: "POST /audits/${au_g}/close", payload: {}, as: Auditor }
            - { call: "GET /claims/${cl_g1}", payload: {}, as: Auditor }
            - { call: "GET /pharmacies/${ph_g}", payload: {}, as: Auditor }
            - { call: "POST /claims", payload: { member_id: "${m_sus}", drug_id: "${drug_g}", prescription_number: "RX-G2", fill_date: "2026-06-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_g}", captures: { err_g: $.data.error_id } }
          assert:
            - "Claim.${cl_g1}: audit_status == CLAWED_BACK, rebate_tag == REBATE_VOID (cascade link 1)"
            - "Pharmacy.${ph_g}: balance_cents == -6000 (10000 - 16000, cascade link 2)"
            - "Pharmacy.${ph_g}: status == SUSPENDED (cascade link 3: -6000 <= -5000)"
            - "Subsequent claim submission fails: response 409 with error_id ERR_PHARMACY_SUSPENDED"

      - name: plan_retire_member_pa_cascade
        grounds:
          - state_machines.Plan.ACTIVE_to_RETIRED
          - state_machines.Member.ACTIVE_to_TERMINATED
          - state_machines.PriorAuthorization.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 chain from POST /plans/{id}/retire (a different trigger than audit close):
          (1) the plan's members flip ACTIVE -> TERMINATED, and (2) each member termination itself
          cancels that member's PENDING/APPROVED PAs — the PA cancellation is caused by the member
          transition, not by the retire call addressing PAs directly.
        test_recipe:
          setup:
            - "Plan ACTIVE with entry for drug H; member ACTIVE; one PENDING PA (member, drug H, requested 60)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-RET", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_ret: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "66666-0001", name: "Retirin", therapeutic_class: "ANTIVIRAL", unit_cost_cents: 2000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_h: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_ret}", drug_id: "${drug_h}", tier: 2, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 500, pa_required: true, rebate_eligible: false }, as: PbmAdmin, captures: { fe_ret: $.data.id } }
            - { call: "POST /plans/${p_ret}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /members", payload: { plan_id: "${p_ret}", external_ref: "M-RET", full_name: "Pat Ret", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_ret: $.data.id } }
            - { call: "POST /prior-authorizations", payload: { member_id: "${m_ret}", drug_id: "${drug_h}", requested_quantity: 60, note: "new therapy" }, as: Member, as_user_id: "${m_ret}", captures: { pa_ret: $.data.id } }
          trigger:
            - { call: "POST /plans/${p_ret}/retire", payload: {}, as: PbmAdmin }
            - { call: "GET /plans/${p_ret}", payload: {}, as: PbmAdmin }
            - { call: "GET /members/${m_ret}", payload: {}, as: PbmAdmin }
            - { call: "GET /prior-authorizations/${pa_ret}", payload: {}, as: PbmAdmin }
            - { call: "GET /formulary-entries/${fe_ret}", payload: {}, as: PbmAdmin }
          assert:
            - "Plan.${p_ret}.status == RETIRED"
            - "Member.${m_ret}.status == TERMINATED (link 1)"
            - "PriorAuthorization.${pa_ret}.status == CANCELLED (link 2, caused by member termination)"
            - "FormularyEntry.${fe_ret}.status == INACTIVE"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_pharmacy_vs_days_supply_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=12.10]
          - errors[ERR_PHARMACY_SUSPENDED]
          - errors[ERR_DAYS_SUPPLY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: a claim submitted by a SUSPENDED pharmacy
          that would also fail the days-supply edit (days_supply 999 > max 90) must surface the
          priority-5 state error ERR_PHARMACY_SUSPENDED (409), not the adjudication edit — and no
          claim row is persisted at all (adjudication edits never ran).
        test_recipe:
          setup:
            - "Same suspension fixture shape as audit_close_clawback_suspension_cascade: plan ACTIVE, FLAT-0 entry (max_days_supply 90) for drug G2, pharmacy threshold 5000, one PAID claim plan_paid 10000, CLAIM_LEVEL audit finding 16000 closed -> pharmacy SUSPENDED (balance -6000)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-PR1", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_pr1: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "55555-0002", name: "Clawbackin-B", therapeutic_class: "ANALGESIC", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_g2: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_pr1}", drug_id: "${drug_g2}", tier: 1, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 0, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_pr1}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-P1", name: "Rx Prio", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_p: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_pr1}", external_ref: "M-PR1", full_name: "Pat Prio", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_pr1: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_pr1}", drug_id: "${drug_g2}", prescription_number: "RX-P1", fill_date: "2026-03-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_p}", captures: { cl_p1: $.data.id } }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_p}", window_start_date: "2026-01-01", window_end_date: "2026-12-31", extrapolation_method: CLAIM_LEVEL }, as: Auditor, captures: { au_p: $.data.id } }
            - { call: "POST /audits/${au_p}/findings", payload: { findings: [ { claim_id: "${cl_p1}", clawback_cents: 16000 } ] }, as: Auditor }
            - { call: "POST /audits/${au_p}/close", payload: {}, as: Auditor }
          trigger:
            - { call: "POST /claims", payload: { member_id: "${m_pr1}", drug_id: "${drug_g2}", prescription_number: "RX-P2", fill_date: "2026-06-01", quantity: 10, days_supply: 999 }, as: Pharmacist, as_user_id: "${ph_p}", captures: { err_p: $.data.error_id } }
            - { call: "GET /claims", payload: { pharmacy_id: "${ph_p}", status: REJECTED }, as: PbmAdmin }
          assert:
            - "Response is 409 with error_id ERR_PHARMACY_SUSPENDED (priority 5 state beats priority-12.10 business_safety)"
            - "No REJECTED claim persisted: GET /claims?pharmacy_id&status=REJECTED returns total_count == 0"

      - name: unknown_drug_vs_malformed_quantity_conflict
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_DRUG_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Error-category pair existence vs business_constraint (distinct from instance 1's
          state vs business_safety): a claim naming a non-existent drug_id AND a malformed
          quantity 0 must surface the priority-4 existence error ERR_DRUG_NOT_FOUND (404),
          not the priority-7 shape error ERR_INVALID_REQUEST (400).
        test_recipe:
          setup:
            - "Plan ACTIVE with an entry for drug K; retail pharmacy ACTIVE; member eligible"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-PR2", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_pr2: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "77777-0001", name: "Existin", therapeutic_class: "ANTIFUNGAL", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_k: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_pr2}", drug_id: "${drug_k}", tier: 1, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 0, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_pr2}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-K1", name: "Rx Exist", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_k: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_pr2}", external_ref: "M-PR2", full_name: "Pat Exist", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_pr2: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { member_id: "${m_pr2}", drug_id: "00000000-0000-0000-0000-000000000000", prescription_number: "RX-K9", fill_date: "2026-06-01", quantity: 0, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_k}", captures: { err_k: $.data.error_id } }
          assert:
            - "Response is 404 with error_id ERR_DRUG_NOT_FOUND (priority 4 existence beats priority 7 business_constraint shape check on quantity == 0)"

  - rule_id: boundary_precision_check
    instances:
      - name: quantity_limit_equality_boundary
        grounds:
          - validations[priority=12.9]
          - entities.FormularyEntry.fields.quantity_limit_per_fill
        distinguishing_aspect: |
          Numeric boundary on the quantity metric via POST /claims: quantity == limit (90) passes
          and pays, quantity == limit + 1 (91) is rejected with ERR_QUANTITY_LIMIT_EXCEEDED and the
          claim persists REJECTED with reject_reasons exactly ["ERR_QUANTITY_LIMIT_EXCEEDED"].
        test_recipe:
          setup:
            - "Plan ACTIVE (deductible 0, fee 0, FLAT 100 entry, quantity_limit_per_fill 90) for drug Q (unit 1000, max_daily 3 -> qty 90 over 30 days is exactly 3/day, no HIGH alert); pharmacy ACTIVE; member eligible"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-QTY", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_qty: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "88888-0001", name: "Quantol", therapeutic_class: "ANTICOAGULANT", unit_cost_cents: 1000, max_daily_dose_units: 3, is_specialty: false }, as: PbmAdmin, captures: { drug_q: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_qty}", drug_id: "${drug_q}", tier: 1, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 100, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_qty}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-Q1", name: "Rx Quant", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_q: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_qty}", external_ref: "M-QTY", full_name: "Pat Quant", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_qty: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { member_id: "${m_qty}", drug_id: "${drug_q}", prescription_number: "RX-Q90", fill_date: "2026-03-01", quantity: 90, days_supply: 30 }, as: Pharmacist, as_user_id: "${ph_q}", captures: { c_q90: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_qty}", drug_id: "${drug_q}", prescription_number: "RX-Q91", fill_date: "2026-05-01", quantity: 91, days_supply: 30 }, as: Pharmacist, as_user_id: "${ph_q}", captures: { err_q: $.data.error_id } }
            - { call: "GET /claims", payload: { member_id: "${m_qty}", status: REJECTED }, as: PbmAdmin, captures: { c_q91: "$.data[0].id" } }
          assert:
            - "Claim.${c_q90}: status == PAID, allowed_cents == 90000, plan_paid_cents == 89900 (boundary value passes)"
            - "Quantity 91: response 422 with error_id ERR_QUANTITY_LIMIT_EXCEEDED"
            - "Claim.${c_q91}: status == REJECTED, reject_reasons == [\"ERR_QUANTITY_LIMIT_EXCEEDED\"], plan_paid_cents == 0"

      - name: audit_window_touching_boundary
        grounds:
          - validations[priority=9]
          - entities.PharmacyAudit.fields.window_end_date
        distinguishing_aspect: |
          Temporal boundary on the audit-window metric via POST /audits (a distinct endpoint from
          instance 1's POST /claims): because audit windows are CLOSED intervals, a new window
          starting exactly on the existing window's end date (2026-03-31) overlaps and is rejected;
          starting the next day (2026-04-01) succeeds.
        test_recipe:
          setup:
            - "Pharmacy ACTIVE; an OPEN audit with window 2026-01-01..2026-03-31 (no claims needed)"
          setup_api_calls:
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-W1", name: "Rx Window", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_w: $.data.id } }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_w}", window_start_date: "2026-01-01", window_end_date: "2026-03-31", extrapolation_method: CLAIM_LEVEL }, as: Auditor, captures: { au_w1: $.data.id } }
          trigger:
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_w}", window_start_date: "2026-03-31", window_end_date: "2026-06-30", extrapolation_method: CLAIM_LEVEL }, as: Auditor, captures: { err_w: $.data.error_id } }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_w}", window_start_date: "2026-04-01", window_end_date: "2026-06-30", extrapolation_method: CLAIM_LEVEL }, as: Auditor, captures: { au_w3: $.data.id } }
          assert:
            - "Touching window (start == existing end 2026-03-31): 422 ERR_AUDIT_WINDOW_OVERLAP (closed-interval boundary counts as overlap)"
            - "Next-day window (2026-04-01): 201 created, PharmacyAudit.${au_w3}.status == OPEN"
            - "PharmacyAudit.${au_w1}.status remains OPEN"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_payment_requires_approved_pa
        grounds:
          - validations[priority=12.5]
          - state_machines.PriorAuthorization.PENDING_to_APPROVED
          - calculations.pa_quantity_consumption
        distinguishing_aspect: |
          Entity pair Claim -> PriorAuthorization: a claim for a pa_required drug is REJECTED with
          ERR_PRIOR_AUTH_REQUIRED while no APPROVED PA exists; after the PA is APPROVED (60 units,
          expiry 2026-12-31) a resubmit of the SAME claim pays and consumes 30 units of the PA,
          stamping claim.pa_id.
        test_recipe:
          setup:
            - "Plan ACTIVE (fee 0) with pa_required FLAT-500 entry for drug B (unit 1000); pharmacy ACTIVE; member eligible"
            - "Claim qty 30 days 30 fill 2026-03-01 -> 422 ERR_PRIOR_AUTH_REQUIRED, persisted REJECTED"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-PA", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_pa: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "99999-0001", name: "Authorex", therapeutic_class: "BIOLOGIC", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_b: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_pa}", drug_id: "${drug_b}", tier: 3, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 500, pa_required: true, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_pa}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-B1", name: "Rx Auth", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_b2: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_pa}", external_ref: "M-PA", full_name: "Pat Auth", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_pa: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_pa}", drug_id: "${drug_b}", prescription_number: "RX-B1", fill_date: "2026-03-01", quantity: 30, days_supply: 30 }, as: Pharmacist, as_user_id: "${ph_b2}", captures: { err_b: $.data.error_id } }
            - { call: "GET /claims", payload: { member_id: "${m_pa}", status: REJECTED }, as: PbmAdmin, captures: { c_b1: "$.data[0].id" } }
            - { call: "POST /prior-authorizations", payload: { member_id: "${m_pa}", drug_id: "${drug_b}", requested_quantity: 60, note: "please approve" }, as: Member, as_user_id: "${m_pa}", captures: { pa_b: $.data.id } }
            - { call: "POST /prior-authorizations/${pa_b}/approve", payload: { approved_quantity: 60, expires_at: "2026-12-31" }, as: ClinicalReviewer }
          trigger:
            - { call: "POST /claims/${c_b1}/resubmit", payload: {}, as: Pharmacist, as_user_id: "${ph_b2}", captures: { c_b1_paid: $.data.id } }
            - { call: "GET /prior-authorizations/${pa_b}", payload: {}, as: ClinicalReviewer }
          assert:
            - "Initial submit: 422 ERR_PRIOR_AUTH_REQUIRED; Claim.${c_b1} persisted REJECTED with reject_reasons [\"ERR_PRIOR_AUTH_REQUIRED\"]"
            - "After resubmit: Claim.${c_b1}.status == PAID, pa_id == ${pa_b}, member_pays_cents == 500, plan_paid_cents == 29500, resubmit_count == 1"
            - "PriorAuthorization.${pa_b}.quantity_consumed == 30 (60 approved -> 30 remaining)"

      - name: claim_blocked_by_pharmacy_suspension_until_reinstated
        grounds:
          - validations[priority=5]
          - state_machines.Pharmacy.SUSPENDED_to_ACTIVE
          - state_machines.Pharmacy.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair Claim -> Pharmacy (distinct from Claim -> PriorAuthorization): the claim's
          writability is gated on the pharmacy's derived status — SUSPENDED blocks submission with
          ERR_PHARMACY_SUSPENDED, and only after a balance adjustment restores the ledger above
          -threshold does reinstate re-enable the SAME claim shape to pay.
        test_recipe:
          setup:
            - "Pharmacy RX-V threshold 5000, SUSPENDED via audit clawback cascade (paid claim plan_paid 10000, clawback 16000 -> balance -6000)"
            - "Plan ACTIVE, entry FLAT-0 for drug V (unit 1000), member eligible"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-VSB", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_vsb: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "55555-0003", name: "Clawbackin-C", therapeutic_class: "ANALGESIC", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_v: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_vsb}", drug_id: "${drug_v}", tier: 1, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 0, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_vsb}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-V1", name: "Rx Viable", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_v: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_vsb}", external_ref: "M-VSB", full_name: "Pat Viable", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_vsb: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_vsb}", drug_id: "${drug_v}", prescription_number: "RX-V1", fill_date: "2026-03-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_v}", captures: { cl_v1: $.data.id } }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_v}", window_start_date: "2026-01-01", window_end_date: "2026-12-31", extrapolation_method: CLAIM_LEVEL }, as: Auditor, captures: { au_v: $.data.id } }
            - { call: "POST /audits/${au_v}/findings", payload: { findings: [ { claim_id: "${cl_v1}", clawback_cents: 16000 } ] }, as: Auditor }
            - { call: "POST /audits/${au_v}/close", payload: {}, as: Auditor }
          trigger:
            - { call: "POST /claims", payload: { member_id: "${m_vsb}", drug_id: "${drug_v}", prescription_number: "RX-V2", fill_date: "2026-06-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_v}", captures: { err_v: $.data.error_id } }
            - { call: "POST /pharmacies/${ph_v}/balance-adjustments", payload: { amount_cents: 20000, reason: "clawback settlement" }, as: PbmAdmin }
            - { call: "POST /pharmacies/${ph_v}/reinstate", payload: {}, as: PbmAdmin }
            - { call: "POST /claims", payload: { member_id: "${m_vsb}", drug_id: "${drug_v}", prescription_number: "RX-V2", fill_date: "2026-06-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_v}", captures: { cl_v2: $.data.id } }
          assert:
            - "While SUSPENDED: 409 ERR_PHARMACY_SUSPENDED (Claim gated on Pharmacy.status)"
            - "After settlement: Pharmacy.${ph_v}.balance_cents == 14000; reinstate -> status ACTIVE"
            - "Claim.${cl_v2}: status == PAID, plan_paid_cents == 10000; Pharmacy balance becomes 24000"

  - rule_id: resource_temporal_overlap
    instances:
      - name: early_refill_half_open_adjacency
        grounds:
          - calculations.dur_screening
          - entities.Claim.fields.days_supply
        distinguishing_aspect: |
          Half-open fill-window semantics on the Member x Drug therapy resource: a refill dated
          exactly fill_date + days_supply of a PAID claim (2026-03-31 for a 03-01/30-day fill) is
          adjacent, NOT overlapping -> zero alerts; one day earlier (2026-03-30) overlaps and raises
          an EARLY_REFILL alert (MEDIUM — recorded, does not block payment).
        test_recipe:
          setup:
            - "Plan ACTIVE (fee 0, FLAT 100) with entry for drug E (unit 1000, max_daily 100); pharmacy ACTIVE; member eligible"
            - "Claim 1: fill 2026-03-01, days 30 -> PAID, window [03-01, 03-31)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-ERL", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_erl: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "12121-0001", name: "Refillex", therapeutic_class: "ANTIDIABETIC", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_e: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_erl}", drug_id: "${drug_e}", tier: 1, quantity_limit_per_fill: 120, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 100, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_erl}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-E2", name: "Rx Early", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_e2: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_erl}", external_ref: "M-ERL", full_name: "Pat Early", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_erl: $.data.id } }
            - { call: "POST /claims", payload: { member_id: "${m_erl}", drug_id: "${drug_e}", prescription_number: "RX-EA", fill_date: "2026-03-01", quantity: 30, days_supply: 30 }, as: Pharmacist, as_user_id: "${ph_e2}", captures: { c_ea: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { member_id: "${m_erl}", drug_id: "${drug_e}", prescription_number: "RX-EB", fill_date: "2026-03-31", quantity: 30, days_supply: 30 }, as: Pharmacist, as_user_id: "${ph_e2}", captures: { c_eb: $.data.id } }
            - { call: "GET /claims/${c_eb}/dur-alerts", payload: {}, as: Pharmacist, as_user_id: "${ph_e2}" }
            - { call: "POST /claims", payload: { member_id: "${m_erl}", drug_id: "${drug_e}", prescription_number: "RX-EC", fill_date: "2026-04-29", quantity: 30, days_supply: 30 }, as: Pharmacist, as_user_id: "${ph_e2}", captures: { c_ec: $.data.id } }
            - { call: "GET /claims/${c_ec}/dur-alerts", payload: {}, as: Pharmacist, as_user_id: "${ph_e2}", captures: { alert_ec: "$.data[0].id" } }
          assert:
            - "Claim.${c_eb} (fill exactly at prior window end): PAID and GET dur-alerts returns total_count == 0 (half-open adjacency is not overlap)"
            - "Claim.${c_ec} (fill 2026-04-29 overlaps ${c_eb}'s window [03-31, 04-30)): PAID with exactly 1 DurAlert.${alert_ec}: alert_type EARLY_REFILL, severity MEDIUM, status OPEN"

      - name: audit_window_closed_interval_overlap
        grounds:
          - validations[priority=9]
          - entities.PharmacyAudit.fields.window_start_date
        distinguishing_aspect: |
          Closed-interval semantics on the Pharmacy audit resource (different interval geometry
          from instance 1's half-open fill windows): windows that merely touch at a boundary date
          (new start 2026-03-31 == existing end 2026-03-31) DO overlap and are rejected, whereas
          adjacent half-open claim fill windows are allowed.
        test_recipe:
          setup:
            - "Pharmacy ACTIVE with an OPEN audit window 2026-01-01..2026-03-31"
          setup_api_calls:
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-W2", name: "Rx Window Two", channel: MAIL_ORDER, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_w2: $.data.id } }
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_w2}", window_start_date: "2026-01-01", window_end_date: "2026-03-31", extrapolation_method: EXTRAPOLATED }, as: Auditor, captures: { au_x1: $.data.id } }
          trigger:
            - { call: "POST /audits", payload: { pharmacy_id: "${ph_w2}", window_start_date: "2026-03-31", window_end_date: "2026-06-30", extrapolation_method: CLAIM_LEVEL }, as: Auditor, captures: { err_x: $.data.error_id } }
            - { call: "GET /audits", payload: { pharmacy_id: "${ph_w2}" }, as: Auditor }
          assert:
            - "Touching-window audit: 422 ERR_AUDIT_WINDOW_OVERLAP — inclusive closed bounds make start == existing end an overlap"
            - "GET /audits?pharmacy_id shows total_count == 1 (the rejected audit was not persisted)"

  - rule_id: compensating_invariant
    instances:
      - name: member_accumulators_restored_on_reversal
        grounds:
          - calculations.member_accumulator_posting
          - calculations.copay_assistance_application
          - state_machines.Claim.PAID_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: member fiscal accumulators (currency). Invariant pinned:
          after pay+reverse, deductible_paid_cents, oop_paid_cents, AND card_balance_cents each
          equal their pre-claim values (0, 0, 5000) — card money is restored too, so the card
          ledger and the accumulator ledger both reconcile exactly.
        test_recipe:
          setup:
            - "Plan ACCUMULATOR (ded 0, oop 1000000, min 500, fee 200) ACTIVE, entry FLAT 3000 rebate_eligible for drug A2 (unit 10000); pharmacy ACTIVE threshold 5000"
            - "Member with card for the drug, balance 5000; pre-claim: deductible_paid 0, oop_paid 0, card 5000"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-INV", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 500, card_fill_cap_cents: 0, dispensing_fee_cents: 200 }, as: PbmAdmin, captures: { p_inv: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "11111-0002", name: "Brandstatin-B", therapeutic_class: "STATIN", unit_cost_cents: 10000, max_daily_dose_units: 3, is_specialty: false }, as: PbmAdmin, captures: { drug_a2: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_inv}", drug_id: "${drug_a2}", tier: 2, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 3000, rebate_eligible: true }, as: PbmAdmin }
            - { call: "POST /plans/${p_inv}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-I1", name: "Rx Inv", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_i: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_inv}", external_ref: "M-INV", full_name: "Pat Inv", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31", card_drug_id: "${drug_a2}", card_balance_cents: 5000 }, as: PbmAdmin, captures: { m_inv: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { member_id: "${m_inv}", drug_id: "${drug_a2}", prescription_number: "RX-I1", fill_date: "2026-03-01", quantity: 10, days_supply: 10 }, as: Pharmacist, as_user_id: "${ph_i}", captures: { c_inv: $.data.id } }
            - { call: "POST /claims/${c_inv}/reverse", payload: { reversal_reason: "patient returned medication" }, as: Pharmacist, as_user_id: "${ph_i}" }
            - { call: "GET /members/${m_inv}", payload: {}, as: PbmAdmin }
            - { call: "GET /claims/${c_inv}", payload: {}, as: Pharmacist, as_user_id: "${ph_i}" }
          assert:
            - "After payment: Member oop_paid_cents == 500, card_balance_cents == 2500 (card_applied 2500 = min(5000, 3000-500))"
            - "After reversal (the invariant): Member.${m_inv}.oop_paid_cents == 0 AND deductible_paid_cents == 0 AND card_balance_cents == 5000 — exact pre-claim values"
            - "Claim.${c_inv}.status == REVERSED, rebate_tag == REBATE_VOID"

      - name: pa_quantity_consumption_restored_on_reversal
        grounds:
          - calculations.pa_quantity_consumption
          - state_machines.Claim.PAID_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: PA unit allocation (a count, not currency — distinct type from
          instance 1's money). Invariant pinned: quantity_consumed after pay+reverse equals the
          pre-claim value (0), i.e. approved 60 -> consumed 30 on payment -> consumed 0 after
          reversal.
        test_recipe:
          setup:
            - "Plan ACTIVE with pa_required FLAT-500 entry for drug B2 (unit 1000); pharmacy ACTIVE; member with APPROVED PA (approved_quantity 60, expires 2026-12-31, consumed 0)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "P-INQ", deductible_cents: 0, oop_max_cents: 1000000, assistance_model: ACCUMULATOR, member_min_pay_cents: 0, card_fill_cap_cents: 0, dispensing_fee_cents: 0 }, as: PbmAdmin, captures: { p_inq: $.data.id } }
            - { call: "POST /drugs", payload: { ndc: "99999-0002", name: "Authorex-B", therapeutic_class: "BIOLOGIC", unit_cost_cents: 1000, max_daily_dose_units: 100, is_specialty: false }, as: PbmAdmin, captures: { drug_b2: $.data.id } }
            - { call: "POST /formulary-entries", payload: { plan_id: "${p_inq}", drug_id: "${drug_b2}", tier: 3, quantity_limit_per_fill: 90, max_days_supply: 90, copay_type: FLAT, copay_flat_cents: 500, pa_required: true, rebate_eligible: false }, as: PbmAdmin }
            - { call: "POST /plans/${p_inq}/activate", payload: {}, as: PbmAdmin }
            - { call: "POST /pharmacies", payload: { ncpdp_id: "NCPDP-I2", name: "Rx Inv Qty", channel: RETAIL, auto_suspend_threshold_cents: 5000 }, as: PbmAdmin, captures: { ph_i2: $.data.id } }
            - { call: "POST /members", payload: { plan_id: "${p_inq}", external_ref: "M-INQ", full_name: "Pat Invq", eligibility_start_date: "2026-01-01", eligibility_end_date: "2026-12-31" }, as: PbmAdmin, captures: { m_inq: $.data.id } }
            - { call: "POST /prior-authorizations", payload: { member_id: "${m_inq}", drug_id: "${drug_b2}", requested_quantity: 60 }, as: Member, as_user_id: "${m_inq}", captures: { pa_inq: $.data.id } }
            - { call: "POST /prior-authorizations/${pa_inq}/approve", payload: { approved_quantity: 60, expires_at: "2026-12-31" }, as: ClinicalReviewer }
          trigger:
            - { call: "POST /claims", payload: { member_id: "${m_inq}", drug_id: "${drug_b2}", prescription_number: "RX-IQ", fill_date: "2026-03-01", quantity: 30, days_supply: 30 }, as: Pharmacist, as_user_id: "${ph_i2}", captures: { c_inq: $.data.id } }
            - { call: "GET /prior-authorizations/${pa_inq}", payload: {}, as: ClinicalReviewer }
            - { call: "POST /claims/${c_inq}/reverse", payload: { reversal_reason: "not picked up" }, as: Pharmacist, as_user_id: "${ph_i2}" }
            - { call: "GET /prior-authorizations/${pa_inq}", payload: {}, as: ClinicalReviewer }
          assert:
            - "After payment: PriorAuthorization.${pa_inq}.quantity_consumed == 30 and Claim.${c_inq}.pa_id == ${pa_inq}"
            - "After reversal (the invariant): quantity_consumed == 0 — exactly the pre-claim value; approved_quantity unchanged at 60"
            - "Claim.${c_inq}.status == REVERSED"
