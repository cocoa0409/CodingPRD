      - name: pair_c_facility_section_mismatch_422_outranks_team_date_conflict_409_rejected
        grounds:
          - validations[priority=42]
          - validations[priority=54]
          - calculations.team_calendar_conflict
          - entities.Facility.fields.section_id
          - entities.League.fields.allow_same_day_doubleheader
        distinguishing_aspect: |
          One schedule request names a facility belonging to a DIFFERENT section and lands on a
          UTC calendar date on which both teams already play, so priority 42 (422) and priority
          54 (409) both apply; the referential rule wins, so the answer is 422
          ERR_FACILITY_SECTION_MISMATCH. Because the winning rule is the 422 here and the 409 in
          instance 5a, an implementation that simply prefers 409 over 422 fails exactly one of
          the two instances.
