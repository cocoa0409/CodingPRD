            - "Qualification.${q1}.operating_state == GROUNDED (link 1)"
            - "TrainingEvent.${ev1}.status == CANCELLED (link 2)"
            - "Qualification.${q1}.currency_state == QUALIFIED (currency dimension unaffected)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_on_checkride_record_outcome
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_ENROLLMENT_INVALID_STATE]
          - errors[ERR_CHECK_AIRMAN_CONFLICT]
        distinguishing_aspect: |
          Category pair (state vs business_safety): record-outcome on a checkride
          whose enrollment is WITHDRAWN (state failure, priority 4) AND whose
          check airman previously instructed one of the enrollment's events
          (safety failure, priority 5) must return ERR_ENROLLMENT_INVALID_STATE —
          the state error wins by priority.
        test_recipe:
          setup:
            - "Enrollment reached CHECKRIDE phase; checkride ck1 scheduled with clean airman ca3; ca3 then instructs a CHECKRIDE-phase SESSION event (becoming conflicted for ck1); enrollment then withdrawn (checkride stays SCHEDULED per §1.2 pin); clock at ride time"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "B739", name: "Boeing 737-900", simulator_cost_per_hour_cents: 45000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Ned Ogg", email: "ned@x.com", license_number: "L070", total_flight_hours: 3900 }, as: Recruiter, captures: { ap1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap1}", request_type: "PRIA" }, as: Recruiter, captures: { rr1: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr1}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 29 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap1}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq_id}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cv: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap1}", training_class_id: "${cls}", expected_training_class_version: "${cv}" }, as: TrainingCoordinator, captures: { en1: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en1}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-classes/${cls}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en1}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Ora Gnd", instructor_type: "CHECK_AIRMAN", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ca1: $.data.id } }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Pat Air", instructor_type: "CHECK_AIRMAN", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ca2: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ca1}", phase: "GROUND_SCHOOL", event_type: "MILESTONE", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: TrainingCoordinator, captures: { ev_gm: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev_gm}/complete", payload: { score: 88 }, as: TrainingCoordinator }
            - { call: "POST /pilot-training/simulator-slots", payload: { equipment_id: "${eq_id}", start_at: "2026-08-11T08:00:00Z", end_at: "2026-08-11T18:00:00Z" }, as: TrainingCoordinator, captures: { slot: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ca1}", simulator_slot_id: "${slot}", phase: "SIMULATOR", event_type: "MILESTONE", scheduled_start: "2026-08-11T09:00:00Z", scheduled_end: "2026-08-11T11:00:00Z" }, as: TrainingCoordinator, captures: { ev_sm: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev_sm}/complete", payload: { score: 85 }, as: TrainingCoordinator }
            # Clean third airman ca3 takes the ride...
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Rea Vew", instructor_type: "CHECK_AIRMAN", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ca3: $.data.id } }
            - { call: "POST /pilot-training/checkrides", payload: { enrollment_id: "${en1}", check_airman_id: "${ca3}", ride_type: "PRACTICAL", scheduled_at: "2026-08-12T09:00:00Z" }, as: TrainingCoordinator, captures: { ck1: $.data.id } }
            # ...then ca3 instructs a CHECKRIDE-phase SESSION (phase discipline:
            # IN_PROGRESS requires phase == current_phase == CHECKRIDE; CHECKRIDE
            # phase requires CHECK_AIRMAN tier, which ca3 holds). This makes ca3
            # CONFLICTED for ck1 — the safety failure arm of the dual failure.
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ca3}", phase: "CHECKRIDE", event_type: "SESSION", scheduled_start: "2026-08-11T15:00:00Z", scheduled_end: "2026-08-11T16:00:00Z" }, as: TrainingCoordinator, captures: { ev_prep: $.data.id } }
            # withdraw the enrollment (checkride deliberately NOT cascade-cancelled per §1.2)
            - { call: "POST /pilot-training/enrollments/${en1}/withdraw", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: SystemAdmin }
          trigger:
            # Dual-failure live in one call: enrollment WITHDRAWN (state, p4)
            # AND ca3 conflicted via ${ev_prep} (business_safety, p5).
            - { call: "POST /pilot-training/checkrides/${ck1}/record-outcome", payload: { outcome: "PASS" }, as: CheckAirman, as_user_id: "${ca3}", captures: { err: $.data.error_id } }
          assert:
            - "trigger returns 409 with error_id == ERR_ENROLLMENT_INVALID_STATE (state, priority 4, beats business_safety, priority 5)"
            - "Checkride.${ck1}.status remains SCHEDULED"
      - name: referential_vs_temporal_on_event_creation
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_INSTRUCTOR_NOT_QUALIFIED]
          - errors[ERR_SLOT_TEMPORAL_OVERLAP]
        distinguishing_aspect: |
          Category pair (business_referential vs business_temporal) — different
          from instance 1's (state vs business_safety): creating a SIMULATOR event
