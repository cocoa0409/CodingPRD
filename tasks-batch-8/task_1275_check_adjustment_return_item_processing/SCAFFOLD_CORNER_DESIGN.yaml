              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-OCC", amount_cents: 5000, encoded_amount_cents: 5000, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" }
          trigger:
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-1", expected_adjustment_case_version: "${case_v}" }
              as: OperationsAdmin
              captures: { v_after: $.data.version }
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-2", expected_adjustment_case_version: "${v_after} - 1" }
              as: OperationsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-2", expected_adjustment_case_version: "${v_after}" }
              as: OperationsAdmin
              captures: { ok_assignee: $.data.assigned_analyst_id }
          assert:
            - "v_after == case_v + 1"
            - "err == 'ERR_STALE_VERSION'"
            - "ok_assignee == 'analyst-2'"
      - name: stale_version_on_account_patch_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[account-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /bank/accounts/{id} with a stale expected_depositor_account_version fails 412; the successful patch increments version by exactly 1 and updates risk_tier."
        test_recipe:
          setup: ["account at version 1"]
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { customer_name: "Dee", account_number: "A-2038" }
              as: OperationsAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "PATCH /bank/accounts/${acct_id}"
              payload: { risk_tier: "HIGH_RISK", expected_depositor_account_version: "${acct_v}" }
              as: OperationsAdmin
              captures: { v2: $.data.version, tier2: $.data.risk_tier }
            - call: "PATCH /bank/accounts/${acct_id}"
              payload: { reg_cc_eligible: false, expected_depositor_account_version: "${acct_v}" }
              as: OperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "v2 == acct_v + 1"
            - "tier2 == 'HIGH_RISK'"
            - "err == 'ERR_STALE_VERSION'"
      - name: segregation_of_duties_on_settle
        claim_type: segregation_of_duties
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.AdjustmentClaim.ACKNOWLEDGED_to_SETTLED]
        distinguishing_aspect: "The analyst who manually created a claim cannot settle it (ERR_SEGREGATION_OF_DUTIES); a different analyst can."
        test_recipe:
          setup: ["RETURN_ITEM case assigned to analyst-1; analyst-1 manually created a DRAFT claim, submitted it; acknowledged"]
          setup_api_calls:
