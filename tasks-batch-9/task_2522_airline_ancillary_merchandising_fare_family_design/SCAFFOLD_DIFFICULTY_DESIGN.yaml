            - "Booking.${b_canc_id}.booking_status is still CANCELLED and it owns zero SeatAssignment rows"
            - "the priority-42 and priority-47 checks were also violated by this very request and both lost to priority 9"

      - name: disclosure_stale_beats_publication_and_channel_parity
        grounds:
          - validations.priority_26
          - validations.priority_29
          - validations.priority_30
          - errors.ERR_FEE_DISCLOSURE_STALE
          - errors.ERR_FAMILY_NOT_PUBLISHED_TO_CHANNEL
          - endpoints.PATCH_family-attributes_id.side_effects
        conflict_pair:
          higher: { priority: 26, category: business_safety, error_id: ERR_FEE_DISCLOSURE_STALE, http: 409 }
          lower: { priority: 29, category: business_referential, error_id: ERR_FAMILY_NOT_PUBLISHED_TO_CHANNEL, http: 409 }
        distinguishing_aspect: |
          ONE attribute PATCH simultaneously breaks three ticket preconditions: the passenger's
          disclosure goes STALE (priority 26, business_safety), the publication leaves
          IN_PARITY (priority 29, business_referential) and the channel becomes BREACHED
          (priority 30, business_referential). The regulatory safety check has the lowest
          priority number, so the ticket attempt must answer ERR_FEE_DISCLOSURE_STALE. Note
          that priority 25 is NOT violated: STALE is outside {NOT_ISSUED, PENDING_ACK}, so a
          naive "disclosure not usable" collapse that returns
          ERR_FEE_DISCLOSURE_NOT_ACKNOWLEDGED is also wrong.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; ECO_LITE (BAG_CHECKED_1 INCLUDED q1 at 3500) is PUBLISHED with an IN_PARITY publication on DIRECT_WEB (parity_required true)"
