              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /students"
              payload: { student_number: "SX4", full_name: "Student X Four", race_ethnicity_code: "MULTI", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sx4: $.data.id, sx4_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sx4}", subject_area: "MATH", expected_student_version: "${sx4_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { d_sx4: $.data.id, dv1: $.data.version }
          trigger:
