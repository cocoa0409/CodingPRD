# =============================================================================
# Task 1197: Health Plan Provider Contracting & Fee Schedule Load
# Difficulty target: HARDER THAN EXPERT (deliberately beyond §0.4 Expert band)
# =============================================================================

scenario: |
  1197. Health Plan Provider Contracting & Fee Schedule Load (health plan contracting): contract negotiation terms (rate/term/escalator), fee schedule build & percent-of-Medicare mapping, effective-date & amendment loading with retro adjustments, configuration testing & claim simulation before go-live, contract language exceptions & carve-outs, termination notice & continuity-of-care obligations, rate parity across products, contract repository & audit

domain_name: health-plan-provider-contracting
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 16
  state_machine_count: 10
  calculation_count: 10
  endpoint_count: 78
  error_code_count: 47
  role_count: 6

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Provider legal name" }
      - { name: tin, type: string, source: input, description: "Tax identification number; unique across providers", constraints: "unique" }
      - { name: npi, type: string, source: input, description: "National provider identifier; unique across providers", constraints: "unique" }
      - { name: locality_code, type: string, source: input, description: "Medicare locality code used for benchmark resolution" }
      - { name: provider_status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: Network
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Network display name" }
      - { name: line_of_business, type: enum, source: input, description: "COMMERCIAL_HMO | COMMERCIAL_PPO | MEDICARE_ADVANTAGE | MEDICAID" }
      - { name: network_status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: MedicareBenchmark
    parent: null
    common_fields: true
    fields:
      - { name: benchmark_year, type: integer, source: input, description: "Calendar year this Medicare rate applies to" }
      - { name: locality_code, type: string, source: input, description: "Medicare locality code" }
      - { name: hcpcs_code, type: string, source: input, description: "HCPCS/CPT procedure code" }
      - { name: benchmark_amount_cents, type: integer, source: input, description: "Medicare benchmark amount in cents" }
      - { name: benchmark_status, type: enum, source: system, description: "DRAFT | PUBLISHED", default: DRAFT, constraints: "composite unique (benchmark_year, locality_code, hcpcs_code)" }

  - name: RateParityRule
    parent: null
    common_fields: true
    fields:
      - { name: line_of_business_a, type: enum, source: input, description: "COMMERCIAL_HMO | COMMERCIAL_PPO | MEDICARE_ADVANTAGE | MEDICAID" }
      - { name: line_of_business_b, type: enum, source: input, description: "COMMERCIAL_HMO | COMMERCIAL_PPO | MEDICARE_ADVANTAGE | MEDICAID; must differ from line_of_business_a" }
      - { name: band_bps, type: integer, source: input, description: "Maximum permitted max/min rate ratio in basis points (e.g. 11000 = 110.00%)" }
      - { name: rule_status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "unique unordered pair (line_of_business_a, line_of_business_b) among rule_status == ACTIVE" }

  - name: Contract
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; owning provider (path-bound on create)" }
      - { name: network_id, type: string, source: input, description: "FK -> Network.id; product network this contract participates in" }
      - { name: base_effective_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); first effective date of the contract" }
      - { name: term_months, type: integer, source: input, description: "Initial term length in months" }
      - { name: escalator_bps, type: integer, source: input, description: "Annual rate escalator in basis points (e.g. 300 = 3.00%)" }
      - { name: escalator_mode, type: enum, source: input, description: "ANNIVERSARY (compound on each contract anniversary) | CALENDAR (compound on each Jan 1)" }
      - { name: auto_renew, type: boolean, source: input, description: "Whether the contract auto-renews at term end", default: false }
      - { name: contract_status, type: enum, source: system, description: "DRAFT | IN_NEGOTIATION | PENDING_SIGNATURE | SIGNED | IN_CONFIGURATION | IN_TESTING | READY_FOR_GO_LIVE | ACTIVE | TERMINATION_NOTICE | TERMINATED", default: DRAFT }
      - { name: negotiation_round, type: integer, source: system, description: "Starts at 0; increments by 1 on every counter-offer" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit-for-signature; used for segregation-of-duties on sign" }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID captured at sign" }

  - name: ContractVersion
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; owning contract (path-bound)" }
      - { name: version_number, type: integer, source: input, description: "Sequential amendment number; unique per contract", constraints: "unique per contract_id" }
      - { name: effective_date, type: string, source: input, description: "ISO date this version's rates take effect; unique per contract (half-open window start)" }
      - { name: retro_effective_date, type: string, source: input, description: "Optional ISO date; when present and earlier than effective_date, a retro adjustment run is spawned at activation" }
      - { name: version_status, type: enum, source: system, description: "DRAFT | LOADED | VALIDATED | REJECTED | EFFECTIVE | SUPERSEDED", default: DRAFT }

  - name: FeeScheduleEntry
    parent: ContractVersion
    common_fields: true
    fields:
      - { name: contract_version_id, type: string, source: system, description: "FK -> ContractVersion.id; owning version (path-bound)" }
      - { name: hcpcs_code, type: string, source: input, description: "Procedure code", constraints: "unique per contract_version_id" }
      - { name: service_category, type: string, source: input, description: "Service category used for carve-out matching (e.g. OFFICE_VISIT, INPATIENT_SURGERY)" }
      - { name: rate_type, type: enum, source: input, description: "PERCENT_OF_MEDICARE | FLAT_RATE | PER_DIEM | CASE_RATE" }
      - { name: pct_of_medicare_bps, type: integer, source: input, description: "Required when rate_type == PERCENT_OF_MEDICARE; basis points of the Medicare benchmark" }
      - { name: flat_rate_cents, type: integer, source: input, description: "Required when rate_type in {FLAT_RATE, PER_DIEM, CASE_RATE}; base amount in cents" }
      - { name: benchmark_lookup_mode, type: enum, source: input, description: "STRICT | PROVISIONAL", default: STRICT }
      - { name: medicare_benchmark_id, type: string, source: system, description: "FK -> MedicareBenchmark.id; resolved at map-benchmark, null until mapped" }
      - { name: resolved_benchmark_cents, type: integer, source: system, description: "Benchmark amount captured at map-benchmark, null until mapped" }
      - { name: computed_rate_cents, type: integer, source: computed, description: "Base computed rate in cents at version effective year, null until mapped" }
      - { name: entry_status, type: enum, source: system, description: "STAGED | MAPPED | LOCKED", default: STAGED }

  - name: CarveOut
    parent: ContractVersion
    common_fields: true
    fields:
      - { name: contract_version_id, type: string, source: system, description: "FK -> ContractVersion.id; owning version (path-bound)" }
      - { name: service_category, type: string, source: input, description: "Service category this language exception applies to; the literal value \"*\" is a wildcard matching any claim service_category. Window-conflict checks compare the literal value only" }
      - { name: override_type, type: enum, source: input, description: "FLAT_RATE | PCT_OF_MEDICARE | EXCLUDE" }
      - { name: override_flat_cents, type: integer, source: input, description: "Required when override_type == FLAT_RATE" }
      - { name: override_pct_bps, type: integer, source: input, description: "Required when override_type == PCT_OF_MEDICARE" }
      - { name: start_date, type: string, source: input, description: "ISO date; closed-interval window start" }
      - { name: end_date, type: string, source: input, description: "ISO date; closed-interval window end (inclusive)" }
      - { name: priority_rank, type: integer, source: input, description: "Lower rank wins when multiple carve-outs match a claim" }

  - name: SimulationBatch
    parent: ContractVersion
    common_fields: true
    fields:
      - { name: contract_version_id, type: string, source: system, description: "FK -> ContractVersion.id; version under configuration test (path-bound)" }
      - { name: label, type: string, source: input, description: "Human label for the test batch" }
      - { name: batch_status, type: enum, source: system, description: "OPEN | PRICED | PASSED | FAILED | CLOSED", default: OPEN }
      - { name: total_claims, type: integer, source: computed, description: "Count of all claims in the batch", default: 0 }
      - { name: matched_claims, type: integer, source: computed, description: "Claims with outcome MATCH", default: 0 }
      - { name: mismatched_claims, type: integer, source: computed, description: "Claims with outcome MISMATCH", default: 0 }
      - { name: excluded_claims, type: integer, source: computed, description: "Claims with outcome EXCLUDED", default: 0 }
      - { name: pending_claims, type: integer, source: computed, description: "Claims with outcome PENDING", default: 0 }
      - { name: total_priced_cents, type: integer, source: computed, description: "Sum of priced_allowed_cents over claims with outcome MATCH or MISMATCH (per-line rounded, then summed)", default: 0 }

  - name: SimulationClaim
    parent: SimulationBatch
    common_fields: true
    fields:
      - { name: simulation_batch_id, type: string, source: system, description: "FK -> SimulationBatch.id; owning batch (path-bound)" }
      - { name: hcpcs_code, type: string, source: input, description: "Procedure code on the test claim line" }
      - { name: service_category, type: string, source: input, description: "Service category on the test claim line" }
      - { name: service_date, type: string, source: input, description: "ISO date of service" }
      - { name: billed_cents, type: integer, source: input, description: "Billed charge in cents" }
      - { name: los_days, type: integer, source: input, description: "Length of stay in days; used by PER_DIEM pricing", default: 1 }
      - { name: expected_allowed_cents, type: integer, source: input, description: "Tester's expected allowed amount in cents" }
      - { name: priced_allowed_cents, type: integer, source: computed, description: "System-priced allowed amount, null until priced; null with outcome EXCLUDED or unmatched code" }
      - { name: claim_outcome, type: enum, source: system, description: "PENDING | MATCH | MISMATCH | EXCLUDED", default: PENDING }

  - name: PaidClaimSnapshot
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; contract the claim was paid under (path-bound)" }
      - { name: claim_number, type: string, source: input, description: "External claim number; unique per contract", constraints: "unique per contract_id" }
      - { name: hcpcs_code, type: string, source: input, description: "Procedure code paid" }
      - { name: service_category, type: string, source: input, description: "Service category paid" }
      - { name: service_date, type: string, source: input, description: "ISO date of service" }
      - { name: billed_cents, type: integer, source: input, description: "Billed charge in cents" }
      - { name: paid_cents, type: integer, source: input, description: "Amount originally paid in cents" }
      - { name: snapshot_status, type: enum, source: system, description: "OPEN | ADJUSTED", default: OPEN }

  - name: RetroAdjustmentRun
    parent: ContractVersion
    common_fields: true
    fields:
      - { name: contract_version_id, type: string, source: system, description: "FK -> ContractVersion.id; retro amendment that spawned this run" }
      - { name: run_status, type: enum, source: system, description: "CREATED | COMPUTED | FINALIZED | SETTLED | VOID", default: CREATED }
      - { name: window_start_date, type: string, source: system, description: "Retro window start (inclusive) = version retro_effective_date" }
      - { name: window_end_date, type: string, source: system, description: "Retro window end (exclusive) = version effective_date" }
      - { name: adjustment_count, type: integer, source: computed, description: "Number of non-VOIDED adjustments", default: 0 }
      - { name: total_underpaid_cents, type: integer, source: computed, description: "Sum of positive deltas over non-VOIDED adjustments", default: 0 }
      - { name: total_overpaid_cents, type: integer, source: computed, description: "Sum of absolute negative deltas over non-VOIDED adjustments", default: 0 }
      - { name: net_delta_cents, type: integer, source: computed, description: "total_underpaid_cents - total_overpaid_cents", default: 0 }

  - name: RetroAdjustment
    parent: RetroAdjustmentRun
    common_fields: true
    fields:
      - { name: retro_run_id, type: string, source: system, description: "FK -> RetroAdjustmentRun.id; owning run" }
      - { name: paid_claim_id, type: string, source: system, description: "FK -> PaidClaimSnapshot.id; snapshot being adjusted" }
      - { name: service_date, type: string, source: system, description: "Copied from the snapshot at compute time" }
      - { name: original_paid_cents, type: integer, source: system, description: "Snapshot paid_cents at compute time" }
      - { name: repriced_allowed_cents, type: integer, source: computed, description: "Allowed amount under the retro amendment's rates for the service date" }
      - { name: delta_cents, type: integer, source: computed, description: "repriced_allowed_cents - original_paid_cents (signed)" }
      - { name: direction, type: enum, source: computed, description: "UNDERPAID (delta > 0) | OVERPAID (delta < 0); delta == 0 produces no adjustment row" }
      - { name: adjustment_status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | PAID | RECOVERED | VOIDED", default: PROPOSED }

  - name: TerminationNotice
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; contract being terminated (path-bound)" }
      - { name: notice_date, type: string, source: input, description: "ISO date the notice is dated" }
      - { name: termination_date, type: string, source: input, description: "ISO date termination takes effect; must be >= notice_date + 90 days" }
      - { name: reason, type: string, source: input, description: "Termination reason text" }
      - { name: notice_status, type: enum, source: system, description: "DRAFT | ISSUED | EFFECTIVE | RESCINDED", default: DRAFT }

  - name: ContinuityOfCareCase
    parent: TerminationNotice
    common_fields: true
    fields:
      - { name: termination_notice_id, type: string, source: system, description: "FK -> TerminationNotice.id; owning notice (path-bound)" }
      - { name: member_ref, type: string, source: input, description: "Member reference string" }
      - { name: condition_category, type: enum, source: input, description: "INPATIENT_CONFINEMENT | PREGNANCY | DIALYSIS | ONCOLOGY_TREATMENT | TRANSPLANT_WORKUP" }
      - { name: treatment_end_date, type: string, source: input, description: "ISO date active treatment is expected to end; must be after termination_date" }
      - { name: coverage_end_date, type: string, source: computed, description: "min(termination_date + 90 days, treatment_end_date)" }
      - { name: case_status, type: enum, source: system, description: "IDENTIFIED | NOTIFIED | ACTIVE_COVERAGE | COMPLETED | EXPIRED | CLOSED_RESCINDED", default: IDENTIFIED }

  - name: AuditEvent
    parent: Contract
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; contract the event belongs to" }
      - { name: event_type, type: string, source: system, description: "Machine-readable event name (e.g. CONTRACT_SIGNED, VERSION_EFFECTIVE, NOTICE_ISSUED)" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor (or 'system')" }
      - { name: detail, type: string, source: system, description: "Human-readable event detail" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock timestamp of the event" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: IN_NEGOTIATION
        trigger: "POST /contracts/{id}/begin-negotiation"
        actor: ContractManager
        preconditions: ["contract_status == DRAFT"]
        side_effects:
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_NEGOTIATION_STARTED"
      - from: IN_NEGOTIATION
        to: PENDING_SIGNATURE
        trigger: "POST /contracts/{id}/submit-for-signature"
        actor: ContractManager
        preconditions: ["contract_status == IN_NEGOTIATION"]
        side_effects:
          - "sets submitted_by_user_id = X-User-ID"
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_SUBMITTED_FOR_SIGNATURE"
      - from: PENDING_SIGNATURE
        to: IN_NEGOTIATION
        trigger: "POST /contracts/{id}/counter-offer"
        actor: ContractManager
        preconditions: ["contract_status == PENDING_SIGNATURE"]
        side_effects:
          - "negotiation_round += 1"
          - "clears submitted_by_user_id to null"
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_COUNTER_OFFER"
        note: "Negotiation cycle: submit -> counter -> re-submit; negotiation_round accumulates across cycles."
      - from: PENDING_SIGNATURE
        to: SIGNED
        trigger: "POST /contracts/{id}/sign"
        actor: ContractLegal
        preconditions:
          - "contract_status == PENDING_SIGNATURE"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "sets signed_by_user_id = X-User-ID"
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_SIGNED"
      - from: SIGNED
        to: IN_CONFIGURATION
        trigger: "POST /contracts/{id}/begin-configuration"
        actor: ConfigurationAnalyst
        preconditions: ["contract_status == SIGNED"]
        side_effects:
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_CONFIGURATION_STARTED"
      - from: IN_CONFIGURATION
        to: IN_TESTING
        trigger: "POST /contracts/{id}/begin-testing"
        actor: ConfigurationAnalyst
        preconditions:
          - "contract_status == IN_CONFIGURATION"
          - "at least one ContractVersion with contract_id == this contract has version_status == VALIDATED (cross-entity dependency)"
        side_effects:
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_TESTING_STARTED"
      - from: IN_TESTING
        to: IN_CONFIGURATION
        trigger: "POST /contracts/{id}/return-to-configuration"
        actor: ConfigurationAnalyst
        preconditions: ["contract_status == IN_TESTING"]
        side_effects:
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_RETURNED_TO_CONFIGURATION"
      - from: IN_TESTING
        to: READY_FOR_GO_LIVE
        trigger: "POST /contracts/{id}/mark-ready"
        actor: ConfigurationAnalyst
        preconditions:
          - "contract_status == IN_TESTING"
          - "at least one SimulationBatch with batch_status == PASSED exists under a VALIDATED ContractVersion of this contract (cross-entity dependency)"
        side_effects:
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_READY_FOR_GO_LIVE"
      - from: READY_FOR_GO_LIVE
        to: ACTIVE
        trigger: "POST /contracts/{id}/approve-go-live"
        actor: PlanAdmin
        preconditions:
          - "contract_status == READY_FOR_GO_LIVE"
          - "rate parity evaluation (calculations.parity_band_evaluation) finds no violation for this contract"
        side_effects:
          - "CASCADE LINK 1: the VALIDATED ContractVersion of this contract transitions VALIDATED -> EFFECTIVE (see ContractVersion machine)"
          - "CASCADE LINK 2 (from link 1): that version becoming EFFECTIVE supersedes any prior EFFECTIVE version (-> SUPERSEDED) and, when retro_effective_date is present and < effective_date, creates a RetroAdjustmentRun in CREATED with window [retro_effective_date, effective_date) (see ContractVersion machine side effects)"
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_GO_LIVE"
      - from: ACTIVE
        to: IN_CONFIGURATION
        trigger: "POST /contracts/{id}/begin-configuration (amendment configuration cycle)"
        actor: ConfigurationAnalyst
        preconditions: ["contract_status == ACTIVE"]
        side_effects:
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_AMENDMENT_CONFIGURATION_STARTED"
        note: "Amendment cycle: an ACTIVE contract re-enters configuration to load a new ContractVersion, then proceeds IN_CONFIGURATION -> IN_TESTING -> READY_FOR_GO_LIVE -> ACTIVE."
      - from: ACTIVE
        to: TERMINATION_NOTICE
        trigger: "POST /termination-notices/{id}/issue (on a DRAFT TerminationNotice of this contract)"
        actor: ContractManager
        preconditions: ["contract_status == ACTIVE"]
        side_effects:
          - "increments Contract.version by 1"
          - "appends AuditEvent TERMINATION_NOTICE_ISSUED"
      - from: TERMINATION_NOTICE
        to: TERMINATED
        trigger: "POST /termination-notices/{id}/finalize (on an ISSUED TerminationNotice of this contract)"
        actor: PlanAdmin
        preconditions: ["contract_status == TERMINATION_NOTICE"]
        side_effects:
          - "CASCADE (caused by this transition): every ContinuityOfCareCase under the notice with case_status == NOTIFIED transitions NOTIFIED -> ACTIVE_COVERAGE; cases still IDENTIFIED are unaffected (conditional cascade)"
          - "CASCADE (caused by this transition): every SimulationBatch under every ContractVersion of this contract with batch_status IN {OPEN, PRICED, FAILED} transitions to CLOSED; PASSED batches are unaffected (conditional cascade)"
          - "increments Contract.version by 1"
          - "appends AuditEvent CONTRACT_TERMINATED"
      - from: TERMINATION_NOTICE
        to: ACTIVE
        trigger: "POST /termination-notices/{id}/rescind (on an ISSUED TerminationNotice of this contract)"
        actor: ContractManager
        preconditions: ["contract_status == TERMINATION_NOTICE"]
        side_effects:
          - "COMPENSATION: every ContinuityOfCareCase under the notice with case_status IN {IDENTIFIED, NOTIFIED} transitions to CLOSED_RESCINDED"
          - "increments Contract.version by 1"
          - "appends AuditEvent TERMINATION_NOTICE_RESCINDED"

  - entity: ContractVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOADED
        trigger: "POST /contract-versions/{id}/load"
        actor: ConfigurationAnalyst
        preconditions: ["version_status == DRAFT"]
        side_effects: ["appends AuditEvent VERSION_LOADED on parent contract"]
      - from: LOADED
        to: VALIDATED
        trigger: "POST /contract-versions/{id}/validate (all entries MAPPED and at least one entry exists)"
        actor: ConfigurationAnalyst
        preconditions:
          - "version_status == LOADED"
          - "count of FeeScheduleEntry under this version >= 1"
          - "every FeeScheduleEntry under this version has entry_status == MAPPED"
        side_effects:
          - "every FeeScheduleEntry under this version transitions MAPPED -> LOCKED"
          - "appends AuditEvent VERSION_VALIDATED on parent contract"
      - from: LOADED
        to: REJECTED
        trigger: "POST /contract-versions/{id}/validate (zero entries, or any entry still STAGED)"
        actor: ConfigurationAnalyst
        preconditions:
          - "version_status == LOADED"
          - "zero FeeScheduleEntry rows exist OR at least one has entry_status == STAGED"
        side_effects: ["appends AuditEvent VERSION_REJECTED on parent contract"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /contract-versions/{id}/load (re-load after correction)"
        actor: ConfigurationAnalyst
        preconditions: ["version_status == REJECTED"]
        side_effects: ["appends AuditEvent VERSION_RELOADED on parent contract"]
      - from: VALIDATED
        to: EFFECTIVE
        trigger: "cascade from POST /contracts/{id}/approve-go-live (Contract READY_FOR_GO_LIVE -> ACTIVE)"
        actor: system
        preconditions: ["version_status == VALIDATED", "parent contract transitions READY_FOR_GO_LIVE -> ACTIVE in the same request"]
        side_effects:
          - "any other ContractVersion of the same contract with version_status == EFFECTIVE transitions EFFECTIVE -> SUPERSEDED"
          - "when retro_effective_date is present and retro_effective_date < effective_date: creates RetroAdjustmentRun (run_status CREATED, window_start_date = retro_effective_date, window_end_date = effective_date) under this version"
          - "appends AuditEvent VERSION_EFFECTIVE on parent contract"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "cascade when a newer ContractVersion of the same contract becomes EFFECTIVE"
        actor: system
        preconditions: ["version_status == EFFECTIVE"]
        side_effects: ["appends AuditEvent VERSION_SUPERSEDED on parent contract"]

  - entity: FeeScheduleEntry
    initial_state: STAGED
    terminal_states: [LOCKED]
    transitions:
      - from: STAGED
        to: MAPPED
        trigger: "POST /fee-schedule-entries/{id}/map-benchmark"
        actor: ConfigurationAnalyst
        preconditions:
          - "entry_status == STAGED"
          - "parent ContractVersion version_status IN {DRAFT, LOADED, REJECTED}"
          - "benchmark resolution (calculations.benchmark_resolution) returns a PUBLISHED benchmark"
        side_effects:
          - "sets medicare_benchmark_id and resolved_benchmark_cents from the resolved benchmark"
          - "computes computed_rate_cents via calculations.entry_rate_computation (base rate at version effective year)"
      - from: MAPPED
        to: LOCKED
        trigger: "cascade from POST /contract-versions/{id}/validate (LOADED -> VALIDATED)"
        actor: system
        preconditions: ["entry_status == MAPPED"]
        side_effects: []

  - entity: SimulationBatch
    initial_state: OPEN
    terminal_states: [PASSED, CLOSED]
    transitions:
      - from: OPEN
        to: PRICED
        trigger: "POST /simulation-batches/{id}/price"
        actor: ConfigurationAnalyst
        preconditions: ["batch_status == OPEN"]
        side_effects:
          - "prices every SimulationClaim via calculations.claim_line_pricing: claim_outcome PENDING -> MATCH | MISMATCH | EXCLUDED"
          - "recomputes matched_claims, mismatched_claims, excluded_claims, pending_claims, total_priced_cents"
      - from: PRICED
        to: PASSED
        trigger: "POST /simulation-batches/{id}/score (pass condition met)"
        actor: ConfigurationAnalyst
        preconditions:
          - "batch_status == PRICED"
          - "total_claims >= 1"
          - "simulation_scoring: matched_claims * 10000 >= (matched_claims + mismatched_claims) * PASS_THRESHOLD_BPS"
        side_effects: ["appends AuditEvent SIMULATION_PASSED on parent contract"]
      - from: PRICED
        to: FAILED
        trigger: "POST /simulation-batches/{id}/score (pass condition not met)"
        actor: ConfigurationAnalyst
        preconditions:
          - "batch_status == PRICED"
          - "total_claims >= 1"
          - "matched_claims * 10000 < (matched_claims + mismatched_claims) * PASS_THRESHOLD_BPS"
        side_effects: ["appends AuditEvent SIMULATION_FAILED on parent contract"]
      - from: FAILED
        to: OPEN
        trigger: "POST /simulation-batches/{id}/reopen"
        actor: ConfigurationAnalyst
        preconditions: ["batch_status == FAILED"]
        side_effects:
          - "COMPENSATION: every SimulationClaim with claim_outcome IN {MATCH, MISMATCH, EXCLUDED} reverts to PENDING and priced_allowed_cents resets to null"
          - "recomputes counters: matched_claims = mismatched_claims = excluded_claims = 0, pending_claims = total_claims, total_priced_cents = 0"
      - from: OPEN
        to: CLOSED
        trigger: "cascade from Contract TERMINATION_NOTICE -> TERMINATED"
        actor: system
        preconditions: ["parent contract terminated"]
        side_effects: []
      - from: PRICED
        to: CLOSED
        trigger: "cascade from Contract TERMINATION_NOTICE -> TERMINATED"
        actor: system
        preconditions: ["parent contract terminated"]
        side_effects: []
      - from: FAILED
        to: CLOSED
        trigger: "cascade from Contract TERMINATION_NOTICE -> TERMINATED"
        actor: system
        preconditions: ["parent contract terminated"]
        side_effects: []

  - entity: SimulationClaim
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: MATCH
        trigger: "cascade from POST /simulation-batches/{id}/price (priced == expected)"
        actor: system
        preconditions: ["claim_outcome == PENDING", "priced_allowed_cents == expected_allowed_cents"]
        side_effects: []
      - from: PENDING
        to: MISMATCH
        trigger: "cascade from POST /simulation-batches/{id}/price (priced != expected, or no entry/carve-out resolves the code)"
        actor: system
        preconditions: ["claim_outcome == PENDING", "priced_allowed_cents != expected_allowed_cents OR priced_allowed_cents IS NULL due to unmatched hcpcs_code"]
        side_effects: []
      - from: PENDING
        to: EXCLUDED
        trigger: "cascade from POST /simulation-batches/{id}/price (matching carve-out with override_type EXCLUDE)"
        actor: system
        preconditions: ["claim_outcome == PENDING", "selected carve-out has override_type == EXCLUDE"]
        side_effects: ["priced_allowed_cents remains null"]
      - from: MATCH
        to: PENDING
        trigger: "cascade from POST /simulation-batches/{id}/reopen"
        actor: system
        preconditions: ["batch reopened"]
        side_effects: ["priced_allowed_cents resets to null"]
      - from: MISMATCH
        to: PENDING
        trigger: "cascade from POST /simulation-batches/{id}/reopen"
        actor: system
        preconditions: ["batch reopened"]
        side_effects: ["priced_allowed_cents resets to null"]
      - from: EXCLUDED
        to: PENDING
        trigger: "cascade from POST /simulation-batches/{id}/reopen"
        actor: system
        preconditions: ["batch reopened"]
        side_effects: ["priced_allowed_cents resets to null"]

  - entity: RetroAdjustmentRun
    initial_state: CREATED
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: CREATED
        to: COMPUTED
        trigger: "POST /retro-adjustment-runs/{id}/compute"
        actor: PaymentIntegrityAnalyst
        preconditions: ["run_status == CREATED"]
        side_effects:
          - "sweeps PaidClaimSnapshot rows via calculations.retro_repricing_sweep and creates RetroAdjustment rows in PROPOSED for non-zero deltas (snapshots are NOT mutated by compute)"
          - "recomputes adjustment_count, total_underpaid_cents, total_overpaid_cents, net_delta_cents"
      - from: COMPUTED
        to: FINALIZED
        trigger: "POST /retro-adjustment-runs/{id}/finalize"
        actor: PaymentIntegrityAnalyst
        preconditions: ["run_status == COMPUTED"]
        side_effects:
          - "every PaidClaimSnapshot referenced by a PROPOSED adjustment of this run transitions OPEN -> ADJUSTED"
          - "appends AuditEvent RETRO_RUN_FINALIZED on parent contract"
      - from: COMPUTED
        to: VOID
        trigger: "POST /retro-adjustment-runs/{id}/void"
        actor: PaymentIntegrityAnalyst
        preconditions: ["run_status == COMPUTED"]
        side_effects:
          - "COMPENSATION: every RetroAdjustment of this run with adjustment_status == PROPOSED transitions to VOIDED"
          - "recomputes adjustment_count = 0, total_underpaid_cents = 0, total_overpaid_cents = 0, net_delta_cents = 0"
          - "snapshots remain OPEN (compute never mutated them); the contract paid ledger is unchanged end-to-end"
      - from: FINALIZED
        to: SETTLED
        trigger: "system auto-transition (bubble-up) when every adjustment of the run reaches a terminal state (PAID | RECOVERED | REJECTED)"
        actor: system
        preconditions:
          - "run_status == FINALIZED"
          - "count of adjustments with adjustment_status IN {PROPOSED, APPROVED} == 0"
        side_effects: ["appends AuditEvent RETRO_RUN_SETTLED on parent contract"]

  - entity: RetroAdjustment
    initial_state: PROPOSED
    terminal_states: [PAID, RECOVERED, REJECTED, VOIDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /retro-adjustments/{id}/approve"
        actor: PaymentIntegrityAnalyst
        preconditions: ["adjustment_status == PROPOSED", "parent run run_status IN {COMPUTED, FINALIZED}"]
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /retro-adjustments/{id}/reject"
        actor: PaymentIntegrityAnalyst
        preconditions: ["adjustment_status == PROPOSED", "parent run run_status IN {COMPUTED, FINALIZED}"]
        side_effects: ["may trigger parent run bubble-up to SETTLED when this was the last non-terminal adjustment"]
      - from: APPROVED
        to: PAID
        trigger: "POST /retro-adjustments/{id}/settle (direction == UNDERPAID)"
        actor: PaymentIntegrityAnalyst
        preconditions: ["adjustment_status == APPROVED", "direction == UNDERPAID"]
        side_effects: ["may trigger parent run bubble-up to SETTLED when this was the last non-terminal adjustment"]
      - from: APPROVED
        to: RECOVERED
        trigger: "POST /retro-adjustments/{id}/settle (direction == OVERPAID)"
        actor: PaymentIntegrityAnalyst
        preconditions: ["adjustment_status == APPROVED", "direction == OVERPAID"]
        side_effects: ["may trigger parent run bubble-up to SETTLED when this was the last non-terminal adjustment"]
      - from: PROPOSED
        to: VOIDED
        trigger: "cascade from POST /retro-adjustment-runs/{id}/void"
        actor: system
        preconditions: ["adjustment_status == PROPOSED"]
        side_effects: []

  - entity: TerminationNotice
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, RESCINDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /termination-notices/{id}/issue"
        actor: ContractManager
        preconditions: ["notice_status == DRAFT", "parent contract contract_status == ACTIVE"]
        side_effects:
          - "CASCADE LINK 1: parent Contract transitions ACTIVE -> TERMINATION_NOTICE (see Contract machine)"
          - "appends AuditEvent NOTICE_ISSUED on parent contract"
      - from: ISSUED
        to: EFFECTIVE
        trigger: "POST /termination-notices/{id}/finalize"
        actor: PlanAdmin
        preconditions:
          - "notice_status == ISSUED"
          - "logical clock current date >= termination_date"
        side_effects:
          - "CASCADE LINK 1: parent Contract transitions TERMINATION_NOTICE -> TERMINATED"
          - "CASCADE LINK 2 (caused by link 1's contract transition): ContinuityOfCareCase rows NOTIFIED -> ACTIVE_COVERAGE and non-terminal SimulationBatch rows -> CLOSED, per Contract machine side effects"
          - "appends AuditEvent NOTICE_EFFECTIVE on parent contract"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /termination-notices/{id}/rescind"
        actor: ContractManager
        preconditions: ["notice_status == ISSUED"]
        side_effects:
          - "CASCADE: parent Contract transitions TERMINATION_NOTICE -> ACTIVE (compensation, see Contract machine)"
          - "appends AuditEvent NOTICE_RESCINDED on parent contract"

  - entity: ContinuityOfCareCase
    initial_state: IDENTIFIED
    terminal_states: [COMPLETED, EXPIRED, CLOSED_RESCINDED]
    transitions:
      - from: IDENTIFIED
        to: NOTIFIED
        trigger: "POST /continuity-cases/{id}/notify"
        actor: ContractManager
        preconditions: ["case_status == IDENTIFIED", "parent notice notice_status == ISSUED"]
        side_effects: []
      - from: NOTIFIED
        to: ACTIVE_COVERAGE
        trigger: "POST /continuity-cases/{id}/activate-coverage OR cascade from notice finalize"
        actor: ContractManager
        preconditions:
          - "case_status == NOTIFIED"
          - "parent notice notice_status == EFFECTIVE (cross-entity dependency)"
        side_effects: []
      - from: ACTIVE_COVERAGE
        to: COMPLETED
        trigger: "POST /continuity-cases/{id}/complete"
        actor: ContractManager
        preconditions: ["case_status == ACTIVE_COVERAGE"]
        side_effects: []
      - from: ACTIVE_COVERAGE
        to: EXPIRED
        trigger: "POST /continuity-cases/{id}/expire"
        actor: ContractManager
        preconditions:
          - "case_status == ACTIVE_COVERAGE"
          - "logical clock current date > coverage_end_date"
        side_effects: []
      - from: IDENTIFIED
        to: CLOSED_RESCINDED
        trigger: "cascade from POST /termination-notices/{id}/rescind"
        actor: system
        preconditions: ["parent notice rescinded"]
        side_effects: []
      - from: NOTIFIED
        to: CLOSED_RESCINDED
        trigger: "cascade from POST /termination-notices/{id}/rescind"
        actor: system
        preconditions: ["parent notice rescinded"]
        side_effects: []

  - entity: MedicareBenchmark
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /medicare-benchmarks/{id}/publish"
        actor: PlanAdmin
        preconditions: ["benchmark_status == DRAFT"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; state-precondition conflicts live in 1.2/1.4)
# =============================================================================
concurrency_rules:
  - rule_id: contract-version-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/versions"
    occ_field: "expected_contract_version"
    description: |
      Creating a ContractVersion against a Contract whose version has advanced
      since the client last observed it is rejected. A new version legitimately
      supersedes the client's view of the amendment set (multiple DRAFT/LOADED
      versions may coexist), so the only correct rejection is a stale-version
      OCC check on Contract.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: termination-notice-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/termination-notices"
    occ_field: "expected_contract_version"
    description: |
      Creating a TerminationNotice against a Contract whose version has advanced
      since the client last observed it is rejected. Multiple DRAFT notices may
      legitimately coexist on an ACTIVE contract, so the only correct rejection
      is a stale-version OCC check on Contract.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: benchmark_resolution
    trigger: "POST /fee-schedule-entries/{id}/map-benchmark"
    algorithm: ranked_selector
    formula: |
      Let Y = year of parent ContractVersion.effective_date, L = provider locality_code
      (via ContractVersion.contract_id -> Contract.provider_id -> Provider.locality_code),
      H = entry.hcpcs_code.
      Eligibility filter: MedicareBenchmark rows with hcpcs_code == H AND
      locality_code == L AND benchmark_status == PUBLISHED.
      STRICT variant: keep only rows with benchmark_year == Y.
      PROVISIONAL variant: keep only rows with benchmark_year <= Y, then rank by
      benchmark_year DESC and take the first (composite uniqueness on
      (benchmark_year, locality_code, hcpcs_code) makes ties impossible; no
      id-based fallback is ever used).
      Empty eligible set -> ERR_BENCHMARK_UNPUBLISHED.
    input_set: "MedicareBenchmark rows with benchmark_status == PUBLISHED only; DRAFT rows are excluded"
    constants:
      LOOKUP_MODES: "STRICT | PROVISIONAL"
    precision: "integer cents; no rounding in this rule"
    variants:
      - name: strict_year_match
        when: "entry.benchmark_lookup_mode == STRICT"
        difference: "requires benchmark_year exactly equal to the version effective year; unpublished year -> error, never falls back"
      - name: provisional_latest_prior
        when: "entry.benchmark_lookup_mode == PROVISIONAL"
        difference: "uses the latest PUBLISHED benchmark_year <= version effective year; identical data yields a mapped rate where STRICT fails"

  - name: entry_rate_computation
    trigger: "POST /fee-schedule-entries/{id}/map-benchmark (after benchmark_resolution for PERCENT_OF_MEDICARE)"
    algorithm: tiered_pricing
    formula: |
      if rate_type == PERCENT_OF_MEDICARE:
        computed_rate_cents = round_half_up(resolved_benchmark_cents * pct_of_medicare_bps / 10000)
      if rate_type == FLAT_RATE:
        computed_rate_cents = flat_rate_cents
      if rate_type == PER_DIEM:
        computed_rate_cents = flat_rate_cents   # per-day base; los applied per claim
      if rate_type == CASE_RATE:
        computed_rate_cents = flat_rate_cents   # case base; outlier applied per claim
    input_set: "the single FeeScheduleEntry being mapped"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up"

  - name: escalator_projection
    trigger: "invoked by claim_line_pricing and retro_repricing_sweep for any service_date after the version's effective year start"
    algorithm: forward_looking
    formula: |
      steps(contract, version, service_date):
        if escalator_mode == ANNIVERSARY:
          s = number of completed anniversaries of version.effective_date on or before service_date
        if escalator_mode == CALENDAR:
          s = max(0, year(service_date) - year(version.effective_date))
        s = max(0, s)
      rate_at(service_date) = round_half_up(entry.computed_rate_cents * (1 + contract.escalator_bps / 10000) ^ s)
    input_set: "the Contract row (escalator_bps, escalator_mode), the ContractVersion (effective_date), the FeeScheduleEntry (computed_rate_cents)"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up; compounding applied on the integer base each step"
    variants:
      - name: anniversary_compounding
        when: "contract.escalator_mode == ANNIVERSARY"
        difference: "steps increment only on the effective-date anniversary; a service_date of 2027-06-15 with effective 2026-07-01 yields s = 0"
      - name: calendar_compounding
        when: "contract.escalator_mode == CALENDAR"
        difference: "steps increment every Jan 1; the same service_date 2027-06-15 with effective 2026-07-01 yields s = 1, so identical data prices differently"

  - name: claim_line_pricing
    trigger: "POST /simulation-batches/{id}/price (per SimulationClaim); also defines per-line rounding reused by batch totals"
    algorithm: constraint_propagation
    formula: |
      1. CARVE-OUT OVERRIDE SELECTION: candidate carve-outs = CarveOut rows of the
         batch's ContractVersion where (service_category == claim.service_category OR
         service_category == "*") AND start_date <= claim.service_date <= end_date
         (closed interval). "*" is a wildcard matching any claim category.
         Rank: priority_rank ASC, tie-break created_at ASC. Take the first.
         EXCLUDE -> claim_outcome EXCLUDED, priced_allowed_cents = null, STOP.
         FLAT_RATE -> line_allowed = override_flat_cents, go to step 3.
         PCT_OF_MEDICARE -> line_allowed = round_half_up(entry.resolved_benchmark_cents * override_pct_bps / 10000), go to step 3.
      2. ENTRY PRICING: entry = the FeeScheduleEntry of the batch's version with
         hcpcs_code == claim.hcpcs_code (unique per version). If none, claim_outcome
         MISMATCH with priced_allowed_cents = null, STOP.
         base = escalator_projection.rate_at(claim.service_date) for that entry.
         PERCENT_OF_MEDICARE / FLAT_RATE: line_allowed = base
         PER_DIEM: line_allowed = base * claim.los_days
         CASE_RATE: line_allowed = case_rate_outlier(base, claim.billed_cents) [see step 2a]
      2a. CASE-RATE OUTLIER (nested branch, capped):
         threshold = OUTLIER_THRESHOLD_BPS * base / 10000   (exact rational compare: billed_cents * 10000 > OUTLIER_THRESHOLD_BPS * base)
         if billed_cents * 10000 > OUTLIER_THRESHOLD_BPS * base:
           excess = billed_cents - round_half_up(OUTLIER_THRESHOLD_BPS * base / 10000)
           line_allowed = base + round_half_up(excess * OUTLIER_SHARE_BPS / 10000)
         else:
           line_allowed = base
         line_allowed = min(line_allowed, billed_cents)
      3. ROUNDING ORDER (pinned): round each claim line to integer cents FIRST
         (round_half_up); batch totals are computed by SUMMING the already-rounded
         line values. Sum-then-round is explicitly NOT used.
      4. claim_outcome = MATCH if line_allowed == expected_allowed_cents else MISMATCH.
    input_set: "SimulationClaim rows of the batch with claim_outcome == PENDING; FeeScheduleEntry rows of the batch's version; CarveOut rows of the batch's version"
    constants:
      OUTLIER_THRESHOLD_BPS: 30000
      OUTLIER_SHARE_BPS: 8000
    precision: "integer cents, round_half_up; per-line round then sum (order pinned)"

  - name: retro_repricing_sweep
    trigger: "POST /retro-adjustment-runs/{id}/compute"
    algorithm: chronological
    formula: |
      candidates = PaidClaimSnapshot rows with contract_id == the run's version's
      contract, snapshot_status == OPEN, and window_start_date <= service_date < window_end_date
      (half-open window).
      Processing order: service_date ASC, tie-break created_at ASC (never id).
      For each snapshot, find the run's version's FeeScheduleEntry with
      hcpcs_code == snapshot.hcpcs_code (must exist and be LOCKED); apply carve-out
      override selection exactly as claim_line_pricing step 1 (non-EXCLUDE only;
      EXCLUDE carve-outs leave the snapshot at its entry rate), then
      repriced_allowed_cents = escalator-projected entry rate at snapshot.service_date
      (or carve-out override amount when one matches).
      delta_cents = repriced_allowed_cents - paid_cents.
      delta > 0 -> RetroAdjustment(direction UNDERPAID); delta < 0 -> OVERPAID;
      delta == 0 -> no adjustment row.
      Run totals over all non-VOIDED adjustments:
        total_underpaid_cents = sum(delta where delta > 0)
        total_overpaid_cents  = sum(-delta where delta < 0)
        net_delta_cents       = total_underpaid_cents - total_overpaid_cents
        adjustment_count      = count of non-VOIDED adjustments
    input_set: "PaidClaimSnapshot rows with snapshot_status == OPEN inside the half-open retro window only; ADJUSTED snapshots and out-of-window dates are excluded"
    constants:
      WINDOW_SEMANTICS: "half-open [window_start_date, window_end_date)"
    precision: "integer cents"

  - name: simulation_scoring
    trigger: "POST /simulation-batches/{id}/score"
    algorithm: threshold
    formula: |
      priced_count = matched_claims + mismatched_claims   # EXCLUDED and PENDING never counted
      PASSED iff matched_claims * 10000 >= priced_count * PASS_THRESHOLD_BPS
      (exact integer comparison; no rounding, no division).
      Boundary: a ratio exactly equal to the threshold PASSES (>= semantics).
    input_set: "counter fields of the single SimulationBatch being scored"
    constants:
      PASS_THRESHOLD_BPS: 7500
    precision: "integer basis points, exact comparison"

  - name: parity_band_evaluation
    trigger: "POST /contracts/{id}/approve-go-live (before activation completes)"
    algorithm: threshold
    formula: |
      Let C = contract going live, P = C.provider_id, Lc = line_of_business of C.network_id.
      For each RateParityRule with rule_status == ACTIVE where {line_of_business_a,
      line_of_business_b} contains Lc:
        other_lob = the other side of the pair.
        other_contracts = Contract rows with provider_id == P, contract_status == ACTIVE,
          and network's line_of_business == other_lob.
        For each other_contract O with an EFFECTIVE version Vo, and C's activating
        version Vc: for each hcpcs_code present in BOTH Vo and Vc (as LOCKED entries):
          r = max(rate_c, rate_o) * 10000 (integer floor division) / min(rate_c, rate_o)
          where rate_x = escalator-projected rate of the entry at C's version effective_date.
          if r > rule.band_bps -> ERR_RATE_PARITY_VIOLATION (strictly greater violates;
          exactly equal passes).
      No matching rule, no other ACTIVE contract, or no overlapping hcpcs_code -> passes vacuously.
    input_set: "ACTIVE RateParityRule rows; ACTIVE contracts of the same provider; EFFECTIVE versions and their LOCKED entries"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer basis points via floor division"

  - name: coc_coverage_window
    trigger: "POST /termination-notices/{id}/continuity-cases (on create)"
    algorithm: interval_merge
    formula: |
      coverage_end_date = min(notice.termination_date + 90 days, treatment_end_date)
      Precondition enforced by validation: treatment_end_date > notice.termination_date.
    input_set: "the TerminationNotice row and the new ContinuityOfCareCase row"
    constants:
      COC_MAX_DAYS: 90
    precision: "whole days, date arithmetic"

  - name: notice_period_check
    trigger: "POST /contracts/{id}/termination-notices (on create)"
    algorithm: threshold
    formula: |
      days = termination_date - notice_date (whole days)
      valid iff days >= NOTICE_MIN_DAYS (boundary: exactly 90 days is accepted; 89 rejected)
    input_set: "the TerminationNotice being created"
    constants:
      NOTICE_MIN_DAYS: 90
    precision: "whole days"

  - name: carve_out_window_conflict
    trigger: "POST /contract-versions/{id}/carve-outs (on create)"
    algorithm: interval_merge
    formula: |
      For the same contract_version_id AND service_category, existing carve-out
      windows are CLOSED intervals [start_date, end_date].
      Conflict iff new.start_date <= existing.end_date + 1 day AND
      existing.start_date <= new.end_date + 1 day — i.e. overlap OR adjacency
      (existing.end_date + 1 day == new.start_date) both conflict.
      This closed-with-adjacency semantics deliberately differs from the half-open
      ContractVersion effective-window semantics (where distinct effective dates
      never conflict).
    input_set: "CarveOut rows of the same version with the same service_category"
    constants:
      ADJACENCY_GAP_DAYS: 1
    precision: "whole days"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: business_constraint, check: "Request body conforms to endpoint input schema: required fields present, types valid, enum values in declared sets, no undeclared fields", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "When X-User-Role == ProviderRep on provider-owned reads (providers, contracts and contract descendants), the resource's provider chain must equal X-User-ID", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "GET /providers/{id}, GET /providers/{id}/contracts, GET /contracts/{id}, GET /contracts/{id}/versions, GET /contract-versions/{id}, GET /contract-versions/{id}/fee-schedule-entries, GET /fee-schedule-entries/{id}, GET /contracts/{id}/audit-events" }
  - { priority: 5, category: existence, check: "Path provider id resolves", error_id: ERR_PROVIDER_NOT_FOUND, http_status: 404, applies_to: "POST /providers/{id}/contracts, GET /providers/{id}, GET /providers/{id}/contracts" }
  - { priority: 5, category: existence, check: "Path or body network id resolves", error_id: ERR_NETWORK_NOT_FOUND, http_status: 404, applies_to: "GET /networks/{id}, POST /networks/{id}/retire, GET /networks/{id}/contracts, POST /providers/{id}/contracts" }
  - { priority: 5, category: existence, check: "Path benchmark id resolves", error_id: ERR_BENCHMARK_NOT_FOUND, http_status: 404, applies_to: "GET /medicare-benchmarks/{id}, POST /medicare-benchmarks/{id}/publish" }
  - { priority: 5, category: existence, check: "Path parity rule id resolves", error_id: ERR_PARITY_RULE_NOT_FOUND, http_status: 404, applies_to: "GET /rate-parity-rules/{id}" }
  - { priority: 5, category: existence, check: "Path contract id resolves", error_id: ERR_CONTRACT_NOT_FOUND, http_status: 404, applies_to: "all /contracts/{id}/... endpoints" }
  - { priority: 5, category: existence, check: "Path contract version id resolves", error_id: ERR_VERSION_NOT_FOUND, http_status: 404, applies_to: "all /contract-versions/{id}/... endpoints" }
  - { priority: 5, category: existence, check: "Path fee schedule entry id resolves", error_id: ERR_ENTRY_NOT_FOUND, http_status: 404, applies_to: "GET /fee-schedule-entries/{id}, POST /fee-schedule-entries/{id}/map-benchmark" }
  - { priority: 5, category: existence, check: "Path carve-out id resolves", error_id: ERR_CARVE_OUT_NOT_FOUND, http_status: 404, applies_to: "GET /carve-outs/{id}" }
  - { priority: 5, category: existence, check: "Path simulation batch id resolves", error_id: ERR_BATCH_NOT_FOUND, http_status: 404, applies_to: "all /simulation-batches/{id}/... endpoints" }
  - { priority: 5, category: existence, check: "Path paid claim id resolves", error_id: ERR_PAID_CLAIM_NOT_FOUND, http_status: 404, applies_to: "GET /paid-claims/{id}" }
  - { priority: 5, category: existence, check: "Path retro run id resolves", error_id: ERR_RUN_NOT_FOUND, http_status: 404, applies_to: "all /retro-adjustment-runs/{id}/... endpoints" }
  - { priority: 5, category: existence, check: "Path retro adjustment id resolves", error_id: ERR_ADJUSTMENT_NOT_FOUND, http_status: 404, applies_to: "GET /retro-adjustments/{id}, POST /retro-adjustments/{id}/approve, POST /retro-adjustments/{id}/reject, POST /retro-adjustments/{id}/settle" }
  - { priority: 5, category: existence, check: "Path termination notice id resolves", error_id: ERR_NOTICE_NOT_FOUND, http_status: 404, applies_to: "all /termination-notices/{id}/... endpoints" }
  - { priority: 5, category: existence, check: "Path continuity case id resolves", error_id: ERR_CASE_NOT_FOUND, http_status: 404, applies_to: "all /continuity-cases/{id}/... endpoints" }
  - { priority: 5, category: existence, check: "Path audit event id resolves", error_id: ERR_AUDIT_EVENT_NOT_FOUND, http_status: 404, applies_to: "GET /audit-events/{id}" }
  - { priority: 6, category: state, check: "OCC: expected_contract_version must equal the Contract current version (evaluated with state preconditions)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /contracts/{id}/versions, POST /contracts/{id}/termination-notices" }
  - { priority: 6, category: state, check: "Contract contract_status permits the requested lifecycle transition", error_id: ERR_CONTRACT_INVALID_STATE, http_status: 409, applies_to: "all /contracts/{id}/begin-*, /submit-for-signature, /counter-offer, /sign, /return-to-configuration, /mark-ready, /approve-go-live, POST /contracts/{id}/paid-claims (requires ACTIVE), POST /contracts/{id}/termination-notices (requires ACTIVE)" }
  - { priority: 6, category: state, check: "ContractVersion version_status permits load/validate; entry and carve-out creation only while version_status IN {DRAFT, LOADED, REJECTED}; simulation-batch creation only while version_status IN {VALIDATED, EFFECTIVE}", error_id: ERR_VERSION_INVALID_STATE, http_status: 409, applies_to: "POST /contract-versions/{id}/load, /validate, /fee-schedule-entries, /carve-outs, /simulation-batches" }
  - { priority: 6, category: state, check: "FeeScheduleEntry entry_status == STAGED for map-benchmark", error_id: ERR_ENTRY_INVALID_STATE, http_status: 409, applies_to: "POST /fee-schedule-entries/{id}/map-benchmark" }
  - { priority: 6, category: state, check: "SimulationBatch batch_status permits price (OPEN), score (PRICED), reopen (FAILED), claim creation (OPEN)", error_id: ERR_BATCH_INVALID_STATE, http_status: 409, applies_to: "POST /simulation-batches/{id}/price, /score, /reopen, /claims" }
  - { priority: 6, category: state, check: "RetroAdjustment adjustment_status and parent run state permit approve/reject/settle", error_id: ERR_ADJUSTMENT_INVALID_STATE, http_status: 409, applies_to: "POST /retro-adjustments/{id}/approve, /reject, /settle" }
  - { priority: 6, category: state, check: "RetroAdjustmentRun run_status permits compute (CREATED), finalize (COMPUTED), void (COMPUTED)", error_id: ERR_RUN_INVALID_STATE, http_status: 409, applies_to: "POST /retro-adjustment-runs/{id}/compute, /finalize, /void" }
  - { priority: 6, category: state, check: "TerminationNotice notice_status permits issue (DRAFT), finalize (ISSUED), rescind (ISSUED), continuity-case creation (ISSUED)", error_id: ERR_NOTICE_INVALID_STATE, http_status: 409, applies_to: "POST /termination-notices/{id}/issue, /finalize, /rescind, /continuity-cases" }
  - { priority: 6, category: state, check: "ContinuityOfCareCase case_status permits notify (IDENTIFIED), activate-coverage (NOTIFIED), complete (ACTIVE_COVERAGE), expire (ACTIVE_COVERAGE)", error_id: ERR_CASE_INVALID_STATE, http_status: 409, applies_to: "POST /continuity-cases/{id}/notify, /activate-coverage, /complete, /expire" }
  - { priority: 6, category: state, check: "MedicareBenchmark benchmark_status == DRAFT for publish", error_id: ERR_BENCHMARK_INVALID_STATE, http_status: 409, applies_to: "POST /medicare-benchmarks/{id}/publish" }
  - { priority: 7, category: business_safety, check: "PERCENT_OF_MEDICARE entries: pct_of_medicare_bps >= 8000 (regulatory rate floor SAFETY_FLOOR_BPS = 8000, i.e. 80.00% of Medicare)", error_id: ERR_RATE_BELOW_FLOOR, http_status: 422, applies_to: "POST /contract-versions/{id}/fee-schedule-entries" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: sign caller X-User-ID must differ from contract.submitted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /contracts/{id}/sign" }
  - { priority: 7, category: business_safety, check: "Continuity-of-care case requires treatment_end_date > parent notice termination_date (otherwise no post-termination obligation exists)", error_id: ERR_COC_WINDOW_EXCEEDED, http_status: 422, applies_to: "POST /termination-notices/{id}/continuity-cases" }
  - { priority: 8, category: business_temporal, check: "notice_period_check: termination_date - notice_date >= 90 days", error_id: ERR_NOTICE_PERIOD_INSUFFICIENT, http_status: 422, applies_to: "POST /contracts/{id}/termination-notices" }
  - { priority: 8, category: business_temporal, check: "Version effective-window collision: effective_date must differ from every other ContractVersion effective_date of the same contract (half-open windows; equal starts overlap)", error_id: ERR_VERSION_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /contracts/{id}/versions" }
  - { priority: 8, category: business_temporal, check: "carve_out_window_conflict: closed-interval overlap or adjacency on same version + service_category", error_id: ERR_CARVE_OUT_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /contract-versions/{id}/carve-outs" }
  - { priority: 8, category: business_temporal, check: "retro_effective_date, when present, must satisfy contract.base_effective_date <= retro_effective_date < effective_date", error_id: ERR_RETRO_WINDOW_INVALID, http_status: 422, applies_to: "POST /contracts/{id}/versions" }
  - { priority: 9, category: business_constraint, check: "Composite uniqueness (benchmark_year, locality_code, hcpcs_code)", error_id: ERR_DUPLICATE_BENCHMARK, http_status: 409, applies_to: "POST /medicare-benchmarks" }
  - { priority: 9, category: business_constraint, check: "version_number unique per contract", error_id: ERR_DUPLICATE_VERSION_NUMBER, http_status: 409, applies_to: "POST /contracts/{id}/versions" }
  - { priority: 9, category: business_constraint, check: "hcpcs_code unique per contract version", error_id: ERR_DUPLICATE_SERVICE_CODE, http_status: 409, applies_to: "POST /contract-versions/{id}/fee-schedule-entries" }
  - { priority: 9, category: business_constraint, check: "claim_number unique per contract", error_id: ERR_DUPLICATE_CLAIM_NUMBER, http_status: 409, applies_to: "POST /contracts/{id}/paid-claims" }
  - { priority: 9, category: business_constraint, check: "score requires total_claims >= 1", error_id: ERR_BATCH_EMPTY, http_status: 422, applies_to: "POST /simulation-batches/{id}/score" }
  - { priority: 10, category: business_referential, check: "Entry create: at least one MedicareBenchmark row (any status) exists for (hcpcs_code, provider locality_code)", error_id: ERR_BENCHMARK_UNRESOLVABLE, http_status: 422, applies_to: "POST /contract-versions/{id}/fee-schedule-entries (rate_type == PERCENT_OF_MEDICARE)" }
  - { priority: 10, category: business_referential, check: "map-benchmark: benchmark_resolution returns a PUBLISHED benchmark for the lookup mode", error_id: ERR_BENCHMARK_UNPUBLISHED, http_status: 422, applies_to: "POST /fee-schedule-entries/{id}/map-benchmark" }
  - { priority: 10, category: business_referential, check: "Contract create: referenced Network has network_status == ACTIVE", error_id: ERR_NETWORK_INACTIVE, http_status: 422, applies_to: "POST /providers/{id}/contracts" }
  - { priority: 10, category: business_referential, check: "begin-testing: a VALIDATED ContractVersion exists for the contract", error_id: ERR_NO_VALIDATED_VERSION, http_status: 422, applies_to: "POST /contracts/{id}/begin-testing" }
  - { priority: 11, category: business_fiscal, check: "parity_band_evaluation passes for the activating contract", error_id: ERR_RATE_PARITY_VIOLATION, http_status: 422, applies_to: "POST /contracts/{id}/approve-go-live" }
  - { priority: 11, category: business_fiscal, check: "mark-ready: a PASSED SimulationBatch exists under a VALIDATED version of the contract", error_id: ERR_SIMULATION_THRESHOLD_NOT_MET, http_status: 422, applies_to: "POST /contracts/{id}/mark-ready" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Networks ---
  - { method: POST, path: /networks, description: "Create a network", roles: [PlanAdmin], code: 201, input: [name, line_of_business], output: Network, side_effects: [] }
  - { method: GET, path: /networks, description: "List networks", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: ["line_of_business?"], output: "Network[]", side_effects: [] }
  - { method: GET, path: "/networks/{id}", description: "Get one network", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: Network, side_effects: [] }
  - { method: POST, path: "/networks/{id}/retire", description: "Retire a network (network_status ACTIVE -> RETIRED)", roles: [PlanAdmin], code: 200, input: [], output: Network, side_effects: ["increments Network.version by 1"] }
  - { method: GET, path: "/networks/{id}/contracts", description: "List contracts in a network", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: "Contract[]", side_effects: [] }
  # --- Medicare benchmarks ---
  - { method: POST, path: /medicare-benchmarks, description: "Create a Medicare benchmark row (DRAFT)", roles: [PlanAdmin], code: 201, input: [benchmark_year, locality_code, hcpcs_code, benchmark_amount_cents], output: MedicareBenchmark, side_effects: [] }
  - { method: GET, path: /medicare-benchmarks, description: "List benchmarks with optional filters", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: ["benchmark_year?", "hcpcs_code?", "locality_code?"], output: "MedicareBenchmark[]", side_effects: [] }
  - { method: GET, path: "/medicare-benchmarks/{id}", description: "Get one benchmark", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: MedicareBenchmark, side_effects: [] }
  - { method: POST, path: "/medicare-benchmarks/{id}/publish", description: "Publish a benchmark (DRAFT -> PUBLISHED)", roles: [PlanAdmin], code: 200, input: [], output: MedicareBenchmark, side_effects: ["increments MedicareBenchmark.version by 1"] }
  # --- Rate parity rules ---
  - { method: POST, path: /rate-parity-rules, description: "Create a rate parity rule between two lines of business", roles: [PlanAdmin], code: 201, input: [line_of_business_a, line_of_business_b, band_bps], output: RateParityRule, side_effects: [] }
  - { method: GET, path: /rate-parity-rules, description: "List parity rules", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: "RateParityRule[]", side_effects: [] }
  - { method: GET, path: "/rate-parity-rules/{id}", description: "Get one parity rule", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: RateParityRule, side_effects: [] }
  # --- Providers ---
  - { method: POST, path: /providers, description: "Create a provider", roles: [PlanAdmin], code: 201, input: [legal_name, tin, npi, locality_code], output: Provider, side_effects: [] }
  - { method: GET, path: /providers, description: "List providers (paginated)", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: ["locality_code?", "limit?", "offset?"], output: "Provider[]", side_effects: [] }
  - { method: GET, path: "/providers/{id}", description: "Get one provider", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: Provider, side_effects: [] }
  - { method: POST, path: "/providers/{id}/contracts", description: "Create a contract for a provider (starts DRAFT)", roles: [ContractManager], code: 201, input: [network_id, base_effective_date, term_months, escalator_bps, escalator_mode, "auto_renew?"], output: Contract, side_effects: ["appends AuditEvent CONTRACT_CREATED"] }
  - { method: GET, path: "/providers/{id}/contracts", description: "List contracts of a provider", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: "Contract[]", side_effects: [] }
  # --- Contracts lifecycle ---
  - { method: GET, path: "/contracts/{id}", description: "Get one contract", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: Contract, side_effects: [] }
  - { method: POST, path: "/contracts/{id}/begin-negotiation", description: "DRAFT -> IN_NEGOTIATION", roles: [ContractManager], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1", "appends AuditEvent CONTRACT_NEGOTIATION_STARTED"] }
  - { method: POST, path: "/contracts/{id}/submit-for-signature", description: "IN_NEGOTIATION -> PENDING_SIGNATURE; records submitted_by_user_id", roles: [ContractManager], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1", "sets submitted_by_user_id", "appends AuditEvent CONTRACT_SUBMITTED_FOR_SIGNATURE"] }
  - { method: POST, path: "/contracts/{id}/counter-offer", description: "PENDING_SIGNATURE -> IN_NEGOTIATION; negotiation_round += 1", roles: [ContractManager], code: 200, input: ["note?"], output: Contract, side_effects: ["increments Contract.version by 1", "negotiation_round += 1", "appends AuditEvent CONTRACT_COUNTER_OFFER"] }
  - { method: POST, path: "/contracts/{id}/sign", description: "PENDING_SIGNATURE -> SIGNED; segregation of duties vs submitted_by_user_id", roles: [ContractLegal], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1", "sets signed_by_user_id", "appends AuditEvent CONTRACT_SIGNED"] }
  - { method: POST, path: "/contracts/{id}/begin-configuration", description: "SIGNED -> IN_CONFIGURATION", roles: [ConfigurationAnalyst], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1", "appends AuditEvent CONTRACT_CONFIGURATION_STARTED"] }
  - { method: POST, path: "/contracts/{id}/begin-testing", description: "IN_CONFIGURATION -> IN_TESTING; requires a VALIDATED version", roles: [ConfigurationAnalyst], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1", "appends AuditEvent CONTRACT_TESTING_STARTED"] }
  - { method: POST, path: "/contracts/{id}/return-to-configuration", description: "IN_TESTING -> IN_CONFIGURATION", roles: [ConfigurationAnalyst], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1", "appends AuditEvent CONTRACT_RETURNED_TO_CONFIGURATION"] }
  - { method: POST, path: "/contracts/{id}/mark-ready", description: "IN_TESTING -> READY_FOR_GO_LIVE; requires a PASSED batch", roles: [ConfigurationAnalyst], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1", "appends AuditEvent CONTRACT_READY_FOR_GO_LIVE"] }
  - { method: POST, path: "/contracts/{id}/approve-go-live", description: "READY_FOR_GO_LIVE -> ACTIVE; runs parity check; activates version (VALIDATED -> EFFECTIVE); spawns retro run when retro date present", roles: [PlanAdmin], code: 200, input: [], output: Contract, side_effects: ["increments Contract.version by 1", "ContractVersion VALIDATED -> EFFECTIVE", "prior EFFECTIVE version -> SUPERSEDED", "creates RetroAdjustmentRun when retro_effective_date < effective_date", "appends AuditEvent CONTRACT_GO_LIVE"] }
  # --- Contract versions (amendments) ---
  - { method: POST, path: "/contracts/{id}/versions", description: "Create a contract version/amendment (OCC on Contract.version)", roles: [ContractManager], code: 201, input: [version_number, effective_date, "retro_effective_date?", expected_contract_version], output: ContractVersion, side_effects: ["increments Contract.version by 1", "appends AuditEvent VERSION_CREATED"] }
  - { method: GET, path: "/contracts/{id}/versions", description: "List versions of a contract", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: "ContractVersion[]", side_effects: [] }
  - { method: GET, path: "/contract-versions/{id}", description: "Get one contract version", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: ContractVersion, side_effects: [] }
  - { method: POST, path: "/contract-versions/{id}/load", description: "DRAFT|REJECTED -> LOADED", roles: [ConfigurationAnalyst], code: 200, input: [], output: ContractVersion, side_effects: ["appends AuditEvent VERSION_LOADED"] }
  - { method: POST, path: "/contract-versions/{id}/validate", description: "LOADED -> VALIDATED (locks entries) or LOADED -> REJECTED", roles: [ConfigurationAnalyst], code: 200, input: [], output: ContractVersion, side_effects: ["on VALIDATED: every MAPPED FeeScheduleEntry -> LOCKED", "appends AuditEvent VERSION_VALIDATED or VERSION_REJECTED"] }
  # --- Fee schedule entries ---
  - { method: POST, path: "/contract-versions/{id}/fee-schedule-entries", description: "Add a fee schedule entry (version must be DRAFT/LOADED/REJECTED)", roles: [ConfigurationAnalyst], code: 201, input: [hcpcs_code, service_category, rate_type, "pct_of_medicare_bps?", "flat_rate_cents?", "benchmark_lookup_mode?"], output: FeeScheduleEntry, side_effects: [] }
  - { method: GET, path: "/contract-versions/{id}/fee-schedule-entries", description: "List entries of a version", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: "FeeScheduleEntry[]", side_effects: [] }
  - { method: GET, path: /fee-schedule-entries, description: "Filtered list of entries", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: ["contract_version_id?", "medicare_benchmark_id?"], output: "FeeScheduleEntry[]", side_effects: [] }
  - { method: GET, path: "/fee-schedule-entries/{id}", description: "Get one entry", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: FeeScheduleEntry, side_effects: [] }
  - { method: POST, path: "/fee-schedule-entries/{id}/map-benchmark", description: "Resolve benchmark and compute base rate (STAGED -> MAPPED)", roles: [ConfigurationAnalyst], code: 200, input: [], output: FeeScheduleEntry, side_effects: ["runs benchmark_resolution", "runs entry_rate_computation", "sets medicare_benchmark_id, resolved_benchmark_cents, computed_rate_cents"] }
  # --- Carve-outs ---
  - { method: POST, path: "/contract-versions/{id}/carve-outs", description: "Add a contract-language carve-out", roles: [ContractLegal], code: 201, input: [service_category, override_type, "override_flat_cents?", "override_pct_bps?", start_date, end_date, priority_rank], output: CarveOut, side_effects: [] }
  - { method: GET, path: "/contract-versions/{id}/carve-outs", description: "List carve-outs of a version", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: "CarveOut[]", side_effects: [] }
  - { method: GET, path: "/carve-outs/{id}", description: "Get one carve-out", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: CarveOut, side_effects: [] }
  # --- Simulation batches & claims ---
  - { method: POST, path: "/contract-versions/{id}/simulation-batches", description: "Create a simulation batch (OPEN)", roles: [ConfigurationAnalyst], code: 201, input: [label], output: SimulationBatch, side_effects: [] }
  - { method: GET, path: "/contract-versions/{id}/simulation-batches", description: "List batches of a version", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: "SimulationBatch[]", side_effects: [] }
  - { method: GET, path: "/simulation-batches/{id}", description: "Get one batch with counters", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: SimulationBatch, side_effects: [] }
  - { method: POST, path: "/simulation-batches/{id}/claims", description: "Add a test claim to an OPEN batch", roles: [ConfigurationAnalyst], code: 201, input: [hcpcs_code, service_category, service_date, billed_cents, expected_allowed_cents, "los_days?"], output: SimulationClaim, side_effects: ["recomputes SimulationBatch.total_claims and pending_claims"] }
  - { method: GET, path: "/simulation-batches/{id}/claims", description: "List claims of a batch", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: "SimulationClaim[]", side_effects: [] }
  - { method: POST, path: "/simulation-batches/{id}/price", description: "Price all PENDING claims (OPEN -> PRICED)", roles: [ConfigurationAnalyst], code: 200, input: [], output: SimulationBatch, side_effects: ["runs claim_line_pricing per claim", "recomputes batch counters and total_priced_cents"] }
  - { method: POST, path: "/simulation-batches/{id}/score", description: "Score a PRICED batch (-> PASSED or FAILED)", roles: [ConfigurationAnalyst], code: 200, input: [], output: SimulationBatch, side_effects: ["runs simulation_scoring", "appends AuditEvent SIMULATION_PASSED or SIMULATION_FAILED"] }
  - { method: POST, path: "/simulation-batches/{id}/reopen", description: "FAILED -> OPEN; resets claims to PENDING", roles: [ConfigurationAnalyst], code: 200, input: [], output: SimulationBatch, side_effects: ["resets all claims to PENDING, priced_allowed_cents null", "recomputes batch counters to zero, pending = total"] }
  # --- Paid claims ledger ---
  - { method: POST, path: "/contracts/{id}/paid-claims", description: "Load a paid claim snapshot (contract must be ACTIVE)", roles: [PaymentIntegrityAnalyst], code: 201, input: [claim_number, hcpcs_code, service_category, service_date, billed_cents, paid_cents], output: PaidClaimSnapshot, side_effects: [] }
  - { method: GET, path: "/contracts/{id}/paid-claims", description: "List paid claim snapshots of a contract", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: "PaidClaimSnapshot[]", side_effects: [] }
  - { method: GET, path: "/paid-claims/{id}", description: "Get one paid claim snapshot", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: PaidClaimSnapshot, side_effects: [] }
  # --- Retro adjustment runs & adjustments ---
  - { method: GET, path: "/contract-versions/{id}/retro-adjustment-runs", description: "List retro runs of a version", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: "RetroAdjustmentRun[]", side_effects: [] }
  - { method: GET, path: "/retro-adjustment-runs/{id}", description: "Get one retro run with totals", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: RetroAdjustmentRun, side_effects: [] }
  - { method: POST, path: "/retro-adjustment-runs/{id}/compute", description: "CREATED -> COMPUTED; sweeps paid claims and creates PROPOSED adjustments", roles: [PaymentIntegrityAnalyst], code: 200, input: [], output: RetroAdjustmentRun, side_effects: ["runs retro_repricing_sweep", "creates RetroAdjustment rows", "recomputes run totals"] }
  - { method: POST, path: "/retro-adjustment-runs/{id}/finalize", description: "COMPUTED -> FINALIZED; flips referenced snapshots OPEN -> ADJUSTED", roles: [PaymentIntegrityAnalyst], code: 200, input: [], output: RetroAdjustmentRun, side_effects: ["snapshots OPEN -> ADJUSTED", "appends AuditEvent RETRO_RUN_FINALIZED"] }
  - { method: POST, path: "/retro-adjustment-runs/{id}/void", description: "COMPUTED -> VOID; compensates by voiding PROPOSED adjustments", roles: [PaymentIntegrityAnalyst], code: 200, input: [], output: RetroAdjustmentRun, side_effects: ["adjustments PROPOSED -> VOIDED", "run totals reset to zero", "appends AuditEvent RETRO_RUN_VOIDED"] }
  - { method: GET, path: "/retro-adjustment-runs/{id}/adjustments", description: "List adjustments of a run", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: "RetroAdjustment[]", side_effects: [] }
  - { method: GET, path: /retro-adjustments, description: "Filtered list of adjustments", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: ["paid_claim_id?"], output: "RetroAdjustment[]", side_effects: [] }
  - { method: GET, path: "/retro-adjustments/{id}", description: "Get one adjustment", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: RetroAdjustment, side_effects: [] }
  - { method: POST, path: "/retro-adjustments/{id}/approve", description: "PROPOSED -> APPROVED", roles: [PaymentIntegrityAnalyst], code: 200, input: [], output: RetroAdjustment, side_effects: [] }
  - { method: POST, path: "/retro-adjustments/{id}/reject", description: "PROPOSED -> REJECTED", roles: [PaymentIntegrityAnalyst], code: 200, input: [], output: RetroAdjustment, side_effects: ["may bubble run FINALIZED -> SETTLED"] }
  - { method: POST, path: "/retro-adjustments/{id}/settle", description: "APPROVED -> PAID (UNDERPAID) or RECOVERED (OVERPAID)", roles: [PaymentIntegrityAnalyst], code: 200, input: [], output: RetroAdjustment, side_effects: ["may bubble run FINALIZED -> SETTLED"] }
  # --- Termination notices & continuity of care ---
  - { method: POST, path: "/contracts/{id}/termination-notices", description: "Create a DRAFT termination notice (OCC on Contract.version; contract must be ACTIVE)", roles: [ContractManager], code: 201, input: [notice_date, termination_date, reason, expected_contract_version], output: TerminationNotice, side_effects: ["increments Contract.version by 1", "appends AuditEvent NOTICE_CREATED"] }
  - { method: GET, path: "/contracts/{id}/termination-notices", description: "List notices of a contract", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: "TerminationNotice[]", side_effects: [] }
  - { method: GET, path: "/termination-notices/{id}", description: "Get one notice", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: TerminationNotice, side_effects: [] }
  - { method: POST, path: "/termination-notices/{id}/issue", description: "DRAFT -> ISSUED; contract ACTIVE -> TERMINATION_NOTICE", roles: [ContractManager], code: 200, input: [], output: TerminationNotice, side_effects: ["parent Contract ACTIVE -> TERMINATION_NOTICE", "appends AuditEvent NOTICE_ISSUED"] }
  - { method: POST, path: "/termination-notices/{id}/finalize", description: "ISSUED -> EFFECTIVE (clock >= termination_date); contract -> TERMINATED; CoC cases NOTIFIED -> ACTIVE_COVERAGE; non-terminal batches -> CLOSED", roles: [PlanAdmin], code: 200, input: [], output: TerminationNotice, side_effects: ["parent Contract TERMINATION_NOTICE -> TERMINATED", "CoC cases NOTIFIED -> ACTIVE_COVERAGE", "SimulationBatch OPEN/PRICED/FAILED -> CLOSED", "appends AuditEvent NOTICE_EFFECTIVE"] }
  - { method: POST, path: "/termination-notices/{id}/rescind", description: "ISSUED -> RESCINDED; contract -> ACTIVE; CoC cases -> CLOSED_RESCINDED", roles: [ContractManager], code: 200, input: [], output: TerminationNotice, side_effects: ["parent Contract TERMINATION_NOTICE -> ACTIVE", "CoC cases IDENTIFIED/NOTIFIED -> CLOSED_RESCINDED", "appends AuditEvent NOTICE_RESCINDED"] }
  - { method: POST, path: "/termination-notices/{id}/continuity-cases", description: "Register a continuity-of-care case on an ISSUED notice", roles: [ContractManager], code: 201, input: [member_ref, condition_category, treatment_end_date], output: ContinuityOfCareCase, side_effects: ["computes coverage_end_date via coc_coverage_window"] }
  - { method: GET, path: "/termination-notices/{id}/continuity-cases", description: "List CoC cases of a notice", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: "ContinuityOfCareCase[]", side_effects: [] }
  - { method: GET, path: "/continuity-cases/{id}", description: "Get one CoC case", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: ContinuityOfCareCase, side_effects: [] }
  - { method: POST, path: "/continuity-cases/{id}/notify", description: "IDENTIFIED -> NOTIFIED", roles: [ContractManager], code: 200, input: [], output: ContinuityOfCareCase, side_effects: [] }
  - { method: POST, path: "/continuity-cases/{id}/activate-coverage", description: "NOTIFIED -> ACTIVE_COVERAGE (notice must be EFFECTIVE)", roles: [ContractManager], code: 200, input: [], output: ContinuityOfCareCase, side_effects: [] }
  - { method: POST, path: "/continuity-cases/{id}/complete", description: "ACTIVE_COVERAGE -> COMPLETED", roles: [ContractManager], code: 200, input: [], output: ContinuityOfCareCase, side_effects: [] }
  - { method: POST, path: "/continuity-cases/{id}/expire", description: "ACTIVE_COVERAGE -> EXPIRED (clock > coverage_end_date)", roles: [ContractManager], code: 200, input: [], output: ContinuityOfCareCase, side_effects: [] }
  # --- Audit ---
  - { method: GET, path: "/contracts/{id}/audit-events", description: "List audit events of a contract (append-only log)", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst, ProviderRep], code: 200, input: [], output: "AuditEvent[]", side_effects: [] }
  - { method: GET, path: "/audit-events/{id}", description: "Get one audit event", roles: [PlanAdmin, ContractManager, ContractLegal, ConfigurationAnalyst, PaymentIntegrityAnalyst], code: 200, input: [], output: AuditEvent, side_effects: [] }
  # --- Test-driving clock ---
  - { method: POST, path: /_clock/set_current_utc, description: "Set the logical clock. Default before any call: 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time.", roles: [PlanAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["sets logical current UTC"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, undeclared field, or invalid enum value in request body" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "ProviderRep reads a provider-owned resource whose provider chain does not equal X-User-ID" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "Provider id in path does not resolve" }
  - { id: ERR_NETWORK_NOT_FOUND, http: 404, condition: "Network id in path or body does not resolve" }
  - { id: ERR_BENCHMARK_NOT_FOUND, http: 404, condition: "MedicareBenchmark id in path does not resolve" }
  - { id: ERR_PARITY_RULE_NOT_FOUND, http: 404, condition: "RateParityRule id in path does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "Contract id in path does not resolve" }
  - { id: ERR_VERSION_NOT_FOUND, http: 404, condition: "ContractVersion id in path does not resolve" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "FeeScheduleEntry id in path does not resolve" }
  - { id: ERR_CARVE_OUT_NOT_FOUND, http: 404, condition: "CarveOut id in path does not resolve" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "SimulationBatch id in path does not resolve" }
  - { id: ERR_PAID_CLAIM_NOT_FOUND, http: 404, condition: "PaidClaimSnapshot id in path does not resolve" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "RetroAdjustmentRun id in path does not resolve" }
  - { id: ERR_ADJUSTMENT_NOT_FOUND, http: 404, condition: "RetroAdjustment id in path does not resolve" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "TerminationNotice id in path does not resolve" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "ContinuityOfCareCase id in path does not resolve" }
  - { id: ERR_AUDIT_EVENT_NOT_FOUND, http: 404, condition: "AuditEvent id in path does not resolve" }
  - { id: ERR_CONTRACT_INVALID_STATE, http: 409, condition: "Contract contract_status does not permit the requested lifecycle transition" }
  - { id: ERR_VERSION_INVALID_STATE, http: 409, condition: "ContractVersion version_status does not permit load/validate or child creation" }
  - { id: ERR_ENTRY_INVALID_STATE, http: 409, condition: "FeeScheduleEntry entry_status is not STAGED for map-benchmark" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "SimulationBatch batch_status does not permit the requested action" }
  - { id: ERR_ADJUSTMENT_INVALID_STATE, http: 409, condition: "RetroAdjustment adjustment_status or parent run state does not permit approve/reject/settle" }
  - { id: ERR_RUN_INVALID_STATE, http: 409, condition: "RetroAdjustmentRun run_status does not permit compute/finalize/void" }
  - { id: ERR_NOTICE_INVALID_STATE, http: 409, condition: "TerminationNotice notice_status does not permit the requested action (including finalize before termination_date)" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "ContinuityOfCareCase case_status does not permit the requested action (including expire before coverage_end_date)" }
  - { id: ERR_BENCHMARK_INVALID_STATE, http: 409, condition: "MedicareBenchmark benchmark_status is not DRAFT for publish" }
  - { id: ERR_RATE_BELOW_FLOOR, http: 422, condition: "PERCENT_OF_MEDICARE entry with pct_of_medicare_bps < 8000 violates the regulatory rate floor" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Sign caller X-User-ID equals contract.submitted_by_user_id" }
  - { id: ERR_COC_WINDOW_EXCEEDED, http: 422, condition: "Continuity-of-care case treatment_end_date is not after the notice termination_date" }
  - { id: ERR_NOTICE_PERIOD_INSUFFICIENT, http: 422, condition: "termination_date - notice_date < 90 days" }
  - { id: ERR_VERSION_WINDOW_OVERLAP, http: 409, condition: "Another ContractVersion of the same contract already uses this effective_date (half-open window collision)" }
  - { id: ERR_CARVE_OUT_WINDOW_CONFLICT, http: 409, condition: "Carve-out closed window overlaps or is adjacent to an existing carve-out of the same version and service_category" }
  - { id: ERR_RETRO_WINDOW_INVALID, http: 422, condition: "retro_effective_date present but not within [contract.base_effective_date, effective_date)" }
  - { id: ERR_DUPLICATE_BENCHMARK, http: 409, condition: "MedicareBenchmark composite (benchmark_year, locality_code, hcpcs_code) already exists" }
  - { id: ERR_DUPLICATE_VERSION_NUMBER, http: 409, condition: "version_number already used on this contract" }
  - { id: ERR_DUPLICATE_SERVICE_CODE, http: 409, condition: "hcpcs_code already present on this contract version" }
  - { id: ERR_DUPLICATE_CLAIM_NUMBER, http: 409, condition: "claim_number already loaded on this contract" }
  - { id: ERR_BATCH_EMPTY, http: 422, condition: "score invoked on a batch with total_claims == 0" }
  - { id: ERR_BENCHMARK_UNRESOLVABLE, http: 422, condition: "No MedicareBenchmark row (any status) exists for the entry hcpcs_code and provider locality_code at entry creation" }
  - { id: ERR_BENCHMARK_UNPUBLISHED, http: 422, condition: "map-benchmark found no PUBLISHED benchmark satisfying the entry's lookup mode" }
  - { id: ERR_NETWORK_INACTIVE, http: 422, condition: "Referenced Network has network_status != ACTIVE at contract creation" }
  - { id: ERR_NO_VALIDATED_VERSION, http: 422, condition: "begin-testing without any VALIDATED ContractVersion on the contract" }
  - { id: ERR_RATE_PARITY_VIOLATION, http: 422, condition: "parity_band_evaluation finds a max/min rate ratio strictly greater than band_bps at go-live" }
  - { id: ERR_SIMULATION_THRESHOLD_NOT_MET, http: 422, condition: "mark-ready without a PASSED SimulationBatch under a VALIDATED version" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contract_version does not match the Contract's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Health plan platform administrator; owns reference data, go-live approval, termination finalization, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /networks, POST /networks/{id}/retire"
      - "POST /medicare-benchmarks, POST /medicare-benchmarks/{id}/publish"
      - "POST /rate-parity-rules"
      - "POST /providers"
      - "POST /contracts/{id}/approve-go-live"
      - "POST /termination-notices/{id}/finalize"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: ContractManager
    description: "Provider contracting negotiator; owns contract drafting, negotiation cycle, versions/amendments, and termination notices"
    identity: opaque
    exclusive_operations:
      - "POST /providers/{id}/contracts"
      - "POST /contracts/{id}/begin-negotiation, /submit-for-signature, /counter-offer"
      - "POST /contracts/{id}/versions"
      - "POST /contracts/{id}/termination-notices, POST /termination-notices/{id}/issue, /rescind"
      - "POST /termination-notices/{id}/continuity-cases, POST /continuity-cases/{id}/notify, /activate-coverage, /complete, /expire"
    shared_operations: ["all GET endpoints"]
  - name: ContractLegal
    description: "Contract language counsel; signs contracts (segregated from the submitter) and owns carve-outs"
    identity: opaque
    exclusive_operations:
      - "POST /contracts/{id}/sign"
      - "POST /contract-versions/{id}/carve-outs"
    shared_operations: ["all GET endpoints"]
  - name: ConfigurationAnalyst
    description: "Fee schedule configuration and claims testing analyst; owns versions load/validate, entries, and simulation batches"
    identity: opaque
    exclusive_operations:
      - "POST /contracts/{id}/begin-configuration, /begin-testing, /return-to-configuration, /mark-ready"
      - "POST /contract-versions/{id}/load, /validate, /fee-schedule-entries, /simulation-batches"
      - "POST /fee-schedule-entries/{id}/map-benchmark"
      - "POST /simulation-batches/{id}/claims, /price, /score, /reopen"
    shared_operations: ["all GET endpoints"]
  - name: PaymentIntegrityAnalyst
    description: "Payment integrity analyst; owns paid-claim ledger loads and retro adjustment adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /contracts/{id}/paid-claims"
      - "POST /retro-adjustment-runs/{id}/compute, /finalize, /void"
      - "POST /retro-adjustments/{id}/approve, /reject, /settle"
    shared_operations: ["all GET endpoints"]
  - name: ProviderRep
    description: "Provider representative with read-only access scoped to own organization's contract chain"
    identity: "entity_backed:Provider"
    exclusive_operations: []
    shared_operations:
      - "GET /providers/{id}, GET /providers/{id}/contracts (own provider only)"
      - "GET /contracts/{id}, GET /contracts/{id}/versions, GET /contract-versions/{id} (own provider only)"
      - "GET /contract-versions/{id}/fee-schedule-entries, GET /fee-schedule-entries/{id} (own provider only)"
      - "GET /contracts/{id}/audit-events (own provider only)"
      - "GET /networks, GET /networks/{id}, GET /medicare-benchmarks, GET /medicare-benchmarks/{id}, GET /rate-parity-rules, GET /rate-parity-rules/{id}"
