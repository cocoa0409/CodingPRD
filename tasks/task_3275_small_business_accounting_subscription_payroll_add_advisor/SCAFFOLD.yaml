# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AccountantFirm
    field: firm_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /firms/{firm_id}/suspend"
        actor: PlatformAdmin
        preconditions: ["firm_status == ACTIVE"]
        side_effects:
          - "All AccessGrants with firm_id == this firm and grant_status == ACTIVE transition to REVOKED (firm cascade)"
          - "All Subscriptions with billing_firm_id == this firm have billing_owner unchanged but next-Invoice billed_to evaluation flags wholesale discount as inapplicable until firm re-activates"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /firms/{firm_id}/reactivate"
        actor: PlatformAdmin
        preconditions: ["firm_status == SUSPENDED"]
        side_effects:
          - "Wholesale discount eligibility restored"
          - "Revoked AccessGrants are NOT auto-restored — the client or firm must re-issue"
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /firms/{firm_id}/close"
        actor: PlatformAdmin
        preconditions:
          - "No Subscriptions with billing_firm_id == this firm AND billing_owner == FIRM AND lifecycle_status IN (TRIAL, ACTIVE, PAST_DUE, SUSPENDED)"
          - "No AccessGrants with firm_id == this firm AND grant_status IN (PENDING_ACCEPT, ACTIVE)"
        side_effects:
          - "Any remaining BillingTransfers initiated by firm transition to CANCELLED"

  - entity: CompanyUser
    field: user_status
    initial_state: INVITED
    terminal_states: [DISABLED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /companies/{company_id}/users/{user_id}/accept"
        actor: CompanyUser (self, by user_id)
        preconditions:
          - "Subscription.lifecycle_status IN (TRIAL, ACTIVE, PAST_DUE, REACTIVATED)"
          - "Active+Invited seat count for the company (including this user) <= SubscriptionPlan.max_seats — boundary uses <=, see ERR_SEAT_LIMIT_REACHED"
        side_effects:
          - "Subscription.pending_upgrade_prompt cleared if it was set by a prior seat-limit rejection"
      - from: ACTIVE
        to: DISABLED
        trigger: "POST /companies/{company_id}/users/{user_id}/disable"
        actor: CompanyUser (PRIMARY_ADMIN or COMPANY_ADMIN, not self)
        preconditions:
          - "Target user is not the PRIMARY_ADMIN (only transfer of PRIMARY_ADMIN first)"
          - "Actor permission_level IN (PRIMARY_ADMIN, COMPANY_ADMIN)"
        side_effects: []

  - entity: Subscription
    field: lifecycle_status
    initial_state: TRIAL
    terminal_states: [CANCELLED_EXPIRED]
    transitions:
      - from: TRIAL
        to: ACTIVE
        trigger: "POST /companies/{company_id}/subscription/activate (payment method on file) OR system at trial_ends_at when payment method on file"
        actor: "CompanyUser (PRIMARY_ADMIN) or system"
        preconditions:
          - "lifecycle_status == TRIAL"
          - "Payment method recorded (simulated via /_payments/simulate outcome=SUCCEEDED)"
        side_effects:
          - "anchor_day set to day-of-month of activation"
          - "First Invoice issued in ISSUED state"
      - from: TRIAL
        to: CANCELLED_READ_ONLY
        trigger: "system at trial_ends_at when no payment method on file"
        actor: system
        preconditions: ["now >= trial_ends_at AND no successful payment"]
        side_effects:
          - "Company transitions ACTIVE -> READ_ONLY"
          - "cancelled_at = trial_ends_at; read_only_expires_at = trial_ends_at + 365 days"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (invoice unpaid 5 days past ISSUED)"
        actor: system
        preconditions: ["any Invoice in ISSUED with period_end < now - 5 days"]
        side_effects: ["billing_status -> PAST_DUE"]
      - from: PAST_DUE
        to: ACTIVE
        trigger: "system (all PAST_DUE invoices become PAID)"
        actor: system
        preconditions: ["no Invoice in PAST_DUE"]
        side_effects: ["billing_status -> CURRENT"]
      - from: [ACTIVE, PAST_DUE]
        to: SUSPENDED
        trigger: "system (any Invoice PAST_DUE for 30+ days)"
        actor: system
        preconditions: ["Invoice PAST_DUE age >= 30 days"]
        side_effects:
          - "PayrollAddon transitions ACTIVE -> PAUSED (cascade down)"
          - "BankConnections ACTIVE -> STALE"
          - "billing_status -> UNPAID"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (all invoices settled) OR POST /companies/{company_id}/subscription/resume"
        actor: "system or CompanyUser(PRIMARY_ADMIN)"
        preconditions: ["no Invoice in ISSUED/PAST_DUE"]
        side_effects:
          - "PayrollAddon PAUSED -> ACTIVE (compensation of the suspension cascade)"
          - "BankConnections remain STALE — client must re-auth"
          - "billing_status -> CURRENT"
      - from: [TRIAL, ACTIVE, PAST_DUE, SUSPENDED, REACTIVATED]
        to: CANCELLED_READ_ONLY
        trigger: "POST /companies/{company_id}/subscription/cancel"
        actor: "CompanyUser (PRIMARY_ADMIN)"
        preconditions:
          - "lifecycle_status IN (TRIAL, ACTIVE, PAST_DUE, SUSPENDED, REACTIVATED)"
          - "No PENDING_CLIENT_ACCEPT or PENDING_FIRM_ACCEPT BillingTransfer for this subscription"
          - "No DRAFT or IN_PROGRESS Reconciliation for this company"
          - "Actor is PRIMARY_ADMIN (segregation of duties: COMPANY_ADMIN cannot cancel)"
        side_effects:
          - "cancelled_at = now; read_only_expires_at = now + 365 days"
          - "PayrollAddon -> CANCELLED (terminal, cannot resume)"
          - "All AccessGrants ACTIVE -> REVOKED"
          - "All BankConnections -> DISCONNECTED"
          - "All AppIntegrations -> DISCONNECTED; unresolved SyncConflicts stay OPEN but app_integration.conflict_count is preserved for audit"
          - "Company transitions ACTIVE -> READ_ONLY"
          - "Pending MigrationJob QUEUED or CONVERTING -> CANCELLED"
          - "pending_upgrade_prompt cleared"
      - from: CANCELLED_READ_ONLY
        to: REACTIVATED
        trigger: "POST /companies/{company_id}/subscription/reactivate (within read_only window)"
        actor: "CompanyUser (PRIMARY_ADMIN)"
        preconditions:
          - "now < read_only_expires_at"
          - "Payment method valid (simulated SUCCEEDED)"
        side_effects:
          - "Company READ_ONLY -> ACTIVE"
          - "cancelled_at cleared; read_only_expires_at cleared"
          - "Payroll addon NOT auto-restored (was terminal CANCELLED); new PayrollAddon must be created"
          - "AccessGrants remain REVOKED (must re-invite)"
      - from: [CANCELLED_READ_ONLY]
        to: CANCELLED_EXPIRED
        trigger: "system at read_only_expires_at (when clock passes)"
        actor: system
        preconditions: ["now >= read_only_expires_at"]
        side_effects:
          - "Company READ_ONLY -> PURGED"
          - "All ExportRequests in PENDING or READY -> EXPIRED"
      - from: REACTIVATED
        to: ACTIVE
        trigger: "system (first successful invoice payment after reactivation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PayrollAddon
    field: addon_status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "system (parent Subscription enters SUSPENDED) OR POST /companies/{company_id}/payroll/pause"
        actor: "system or CompanyUser(PRIMARY_ADMIN)"
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "system (parent Subscription resumes) OR POST /companies/{company_id}/payroll/resume"
        actor: "system or CompanyUser(PRIMARY_ADMIN)"
        preconditions: ["parent Subscription.lifecycle_status IN (ACTIVE, REACTIVATED)"]
        side_effects: []
      - from: [ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /companies/{company_id}/payroll/cancel OR system on Subscription cancel"
        actor: "CompanyUser(PRIMARY_ADMIN) or system"
        preconditions:
          - "If service_level == FULL_SERVICE, no in-flight tax filing (tax_filing_status != FILED_CURRENT pending final ack) — FULL_SERVICE cancellation during the filing window requires tax_filing_status != FILED_CURRENT"
        side_effects:
          - "All ACTIVE PayrollEmployees remain but no longer accrue per-employee fees (terminal)"

  - entity: PayrollEmployee
    field: employment_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /companies/{company_id}/payroll/employees/{employee_id}/terminate"
        actor: "CompanyUser (PRIMARY_ADMIN or COMPANY_ADMIN) or AccountantUser with FULL_BOOKKEEPING or PAYROLL_ONLY AccessGrant"
        preconditions:
          - "PayrollAddon.addon_status == ACTIVE"
          - "Subscription.lifecycle_status IN (ACTIVE, REACTIVATED, PAST_DUE)"
        side_effects:
          - "terminated_at = now; per-employee fee prorated to termination day at next Invoice"

  - entity: Invoice
    field: invoice_status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system on billing date OR POST /companies/{company_id}/invoices/{invoice_id}/issue"
        actor: "system or PlatformAdmin"
        preconditions: ["Subscription.lifecycle_status IN (ACTIVE, PAST_DUE, REACTIVATED)"]
        side_effects:
          - "Snapshot billed_to, plan price, wholesale_discount, payroll components, tax"
          - "POST /_payments/simulate outcome drives next transition in same call (immediate model)"
      - from: ISSUED
        to: PAID
        trigger: "system (payment simulation outcome=SUCCEEDED) OR POST /companies/{company_id}/invoices/{invoice_id}/pay"
        actor: "system or CompanyUser(PRIMARY_ADMIN) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: []
        side_effects:
          - "Subscription PAST_DUE -> ACTIVE if no other unpaid invoices"
      - from: ISSUED
        to: PAST_DUE
        trigger: "system at period_end + 5 days when unpaid"
        actor: system
        preconditions: []
        side_effects: ["Subscription ACTIVE -> PAST_DUE (bubble-up)"]
      - from: [DRAFT, ISSUED]
        to: VOID
        trigger: "POST /companies/{company_id}/invoices/{invoice_id}/void"
        actor: PlatformAdmin
        preconditions: ["invoice_status IN (DRAFT, ISSUED)"]
        side_effects: []

  - entity: BankConnection
    field: connection_status
    initial_state: PENDING_AUTH
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_AUTH
        to: ACTIVE
        trigger: "POST /companies/{company_id}/bank_connections/{id}/authorize"
        actor: "CompanyUser (PRIMARY_ADMIN or COMPANY_ADMIN)"
        preconditions:
          - "Subscription.lifecycle_status IN (TRIAL, ACTIVE, PAST_DUE, REACTIVATED)"
          - "consent_expires_at > now"
        side_effects: ["last_sync_at set to now"]
      - from: ACTIVE
        to: STALE
        trigger: "system on POST /_sync/bank_feed_tick when consent_expires_at <= now, OR system on Subscription SUSPENDED"
        actor: system
        preconditions: []
        side_effects: ["New transaction ingestion halted"]
      - from: STALE
        to: ACTIVE
        trigger: "POST /companies/{company_id}/bank_connections/{id}/reauthorize"
        actor: "CompanyUser (PRIMARY_ADMIN or COMPANY_ADMIN)"
        preconditions: ["Subscription.lifecycle_status IN (ACTIVE, REACTIVATED, PAST_DUE)"]
        side_effects: []
      - from: [PENDING_AUTH, ACTIVE, STALE]
        to: DISCONNECTED
        trigger: "POST /companies/{company_id}/bank_connections/{id}/disconnect OR system on Subscription cancel"
        actor: "CompanyUser (PRIMARY_ADMIN) or system"
        preconditions: []
        side_effects: ["No new BankTransactions ingested"]
      - from: [DISCONNECTED, STALE]
        to: REVOKED
        trigger: "POST /companies/{company_id}/bank_connections/{id}/revoke (consumer-initiated permanent revocation)"
        actor: "CompanyUser (PRIMARY_ADMIN)"
        preconditions: []
        side_effects: ["Existing BankTransactions are retained for audit (soft-delete-like)"]

  - entity: BankTransaction
    field: txn_status
    initial_state: UNCATEGORIZED
    terminal_states: [MATCHED_RECONCILED]
    transitions:
      - from: UNCATEGORIZED
        to: RULE_SUGGESTED
        trigger: "system on rule evaluation where matching rule has auto_apply == false"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNCATEGORIZED
        to: CATEGORIZED
        trigger: "system on rule evaluation where matching rule has auto_apply == true, OR POST /companies/{company_id}/bank_transactions/{id}/categorize"
        actor: "system or CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions:
          - "SubscriptionPlan.feature_bank_rules == true for rule-applied path (tier gate)"
          - "Manual categorize allowed regardless of tier"
        side_effects: []
      - from: RULE_SUGGESTED
        to: CATEGORIZED
        trigger: "POST /companies/{company_id}/bank_transactions/{id}/accept_suggestion"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: []
        side_effects: []
      - from: RULE_SUGGESTED
        to: UNCATEGORIZED
        trigger: "POST /companies/{company_id}/bank_transactions/{id}/reject_suggestion"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: []
        side_effects: ["category_id and matched_rule_id cleared"]
      - from: CATEGORIZED
        to: UNCATEGORIZED
        trigger: "POST /companies/{company_id}/bank_transactions/{id}/uncategorize"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: ["reconciled_in_id IS NULL"]
        side_effects: ["category_id and matched_rule_id cleared"]
      - from: [UNCATEGORIZED, RULE_SUGGESTED, CATEGORIZED]
        to: EXCLUDED
        trigger: "POST /companies/{company_id}/bank_transactions/{id}/exclude"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: ["reconciled_in_id IS NULL"]
        side_effects: ["Removed from cleared_cents computation"]
      - from: EXCLUDED
        to: UNCATEGORIZED
        trigger: "POST /companies/{company_id}/bank_transactions/{id}/unexclude"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: []
        side_effects: []
      - from: CATEGORIZED
        to: MATCHED_RECONCILED
        trigger: "system when enclosing Reconciliation transitions IN_PROGRESS -> COMPLETED"
        actor: system
        preconditions: []
        side_effects: ["reconciled_in_id set; txn is now immutable"]

  - entity: CategorizationRule
    field: rule_status
    initial_state: ACTIVE
    terminal_states: [DELETED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /companies/{company_id}/categorization_rules/{id}/pause"
        actor: "CompanyUser (STANDARD+)"
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /companies/{company_id}/categorization_rules/{id}/resume"
        actor: "CompanyUser (STANDARD+)"
        preconditions: ["SubscriptionPlan.feature_bank_rules == true"]
        side_effects: []
      - from: [ACTIVE, PAUSED]
        to: DELETED
        trigger: "DELETE /companies/{company_id}/categorization_rules/{id}"
        actor: "CompanyUser (STANDARD+)"
        preconditions: []
        side_effects: ["Existing BankTransactions keep matched_rule_id for audit"]

  - entity: Reconciliation
    field: recon_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, LOCKED]
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: "POST /companies/{company_id}/reconciliations/{id}/start"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions:
          - "Statement window [start, end] does not overlap any existing IN_PROGRESS or COMPLETED Reconciliation for the same bank_connection_id — closed-interval overlap, adjacency allowed (end == start of other is OK only when end is exclusive on one; we treat both as CLOSED, so end+1day required for adjacency). See ERR_STATEMENT_WINDOW_OVERLAP"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /companies/{company_id}/reconciliations/{id}/complete"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions:
          - "difference_cents == 0 (boundary precision: zero and only zero)"
        side_effects:
          - "All CATEGORIZED BankTransactions in window transition to MATCHED_RECONCILED with reconciled_in_id set (cascade)"
          - "completed_at = now"
      - from: [DRAFT, IN_PROGRESS]
        to: LOCKED
        trigger: "system when parent Subscription -> CANCELLED_READ_ONLY"
        actor: system
        preconditions: []
        side_effects: ["Preserved for read-only audit; cannot resume"]
      - from: IN_PROGRESS
        to: DRAFT
        trigger: "POST /companies/{company_id}/reconciliations/{id}/abandon"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: []
        side_effects: ["cleared_cents reset to 0 for this recon (compensation)"]

  - entity: AppIntegration
    field: integration_status
    initial_state: LINKED
    terminal_states: [DISCONNECTED]
    transitions:
      - from: LINKED
        to: ACTIVE
        trigger: "POST /companies/{company_id}/integrations/{id}/activate"
        actor: "CompanyUser (PRIMARY_ADMIN or COMPANY_ADMIN)"
        preconditions: ["Subscription.lifecycle_status IN (TRIAL, ACTIVE, REACTIVATED, PAST_DUE)"]
        side_effects: []
      - from: ACTIVE
        to: CONFLICT_PAUSED
        trigger: "system when a SyncConflict opens on this integration AND conflict_count crosses threshold (>= 3 unresolved OPEN)"
        actor: system
        preconditions: []
        side_effects: ["Sync paused; new conflicts still recorded"]
      - from: CONFLICT_PAUSED
        to: ACTIVE
        trigger: "POST /companies/{company_id}/integrations/{id}/resume"
        actor: "CompanyUser (PRIMARY_ADMIN or COMPANY_ADMIN)"
        preconditions: ["conflict_count == 0"]
        side_effects: []
      - from: [LINKED, ACTIVE, CONFLICT_PAUSED]
        to: DISCONNECTED
        trigger: "POST /companies/{company_id}/integrations/{id}/disconnect OR system on Subscription cancel"
        actor: "CompanyUser (PRIMARY_ADMIN or COMPANY_ADMIN) or system"
        preconditions: []
        side_effects: ["Unresolved SyncConflicts remain OPEN for audit but no further sync"]

  - entity: SyncConflict
    field: conflict_status
    initial_state: OPEN
    terminal_states: [RESOLVED_LOCAL, RESOLVED_REMOTE, IGNORED]
    transitions:
      - from: OPEN
        to: RESOLVED_LOCAL
        trigger: "POST /companies/{company_id}/integrations/{id}/conflicts/{cid}/resolve with resolution=LOCAL"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: []
        side_effects:
          - "local_value retained; integration.conflict_count decremented"
          - "If conflict_count drops below 3 AND integration CONFLICT_PAUSED, integration does NOT auto-resume — manual resume required (asymmetric)"
      - from: OPEN
        to: RESOLVED_REMOTE
        trigger: "POST .../resolve with resolution=REMOTE"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: []
        side_effects:
          - "local_value overwritten by remote_value; integration.conflict_count decremented"
      - from: OPEN
        to: IGNORED
        trigger: "POST .../resolve with resolution=IGNORE"
        actor: "CompanyUser (STANDARD+) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: []
        side_effects: ["conflict_count decremented"]

  - entity: MigrationJob
    field: migration_status
    initial_state: QUEUED
    terminal_states: [COMPLETED_CLEAN, COMPLETED_WITH_LIMITATIONS, FAILED, CANCELLED]
    transitions:
      - from: QUEUED
        to: CONVERTING
        trigger: "POST /companies/{company_id}/migration_jobs/{id}/start"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: CONVERTING
        to: COMPLETED_CLEAN
        trigger: "POST /companies/{company_id}/migration_jobs/{id}/complete with outcome=CLEAN"
        actor: PlatformAdmin
        preconditions:
          - "target_list_entries <= 750000 (combined list ceiling)"
          - "source_product != DESKTOP_ENTERPRISE OR target plan has feature_multi_currency (else limitations)"
        side_effects: []
      - from: CONVERTING
        to: COMPLETED_WITH_LIMITATIONS
        trigger: "POST .../complete with outcome=WITH_LIMITATIONS"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "limitation_codes populated deterministically from source_product + target plan:"
          - "  PAYROLL_NOT_MIGRATED always added when company had Desktop payroll"
          - "  MULTI_CURRENCY_NOT_MIGRATED added when SubscriptionPlan.feature_multi_currency == false"
          - "  LIST_LIMIT_EXCEEDED_PARTIAL added when target_list_entries > 750000"
      - from: CONVERTING
        to: FAILED
        trigger: "POST .../complete with outcome=FAILED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: [QUEUED, CONVERTING]
        to: CANCELLED
        trigger: "POST .../cancel OR system on Subscription cancel"
        actor: "PlatformAdmin or system"
        preconditions: []
        side_effects: []

  - entity: BillingTransfer
    field: transfer_status
    initial_state: PENDING_CLIENT_ACCEPT
    terminal_states: [COMPLETED, DECLINED, EXPIRED, CANCELLED]
    transitions:
      - from: PENDING_CLIENT_ACCEPT
        to: COMPLETED
        trigger: "POST /companies/{company_id}/billing_transfers/{id}/accept (when to_owner == FIRM, client accepts to give up billing)"
        actor: "CompanyUser (PRIMARY_ADMIN)"
        preconditions:
          - "now < expires_at"
          - "Subscription.lifecycle_status IN (ACTIVE, TRIAL, REACTIVATED)"
          - "expected_subscription_version matches Subscription.version (OCC)"
        side_effects:
          - "Subscription.billing_owner -> FIRM, billing_firm_id -> initiating_firm_id"
          - "Subscription.version incremented"
          - "monthly_price_cents recomputed with wholesale discount"
      - from: PENDING_CLIENT_ACCEPT
        to: PENDING_FIRM_ACCEPT
        trigger: "POST /companies/{company_id}/billing_transfers/{id}/counter (client counters: 'yes I'll hand you billing, but confirm wholesale terms')"
        actor: "CompanyUser (PRIMARY_ADMIN)"
        preconditions: ["now < expires_at"]
        side_effects: []
      - from: PENDING_FIRM_ACCEPT
        to: COMPLETED
        trigger: "POST /firms/{firm_id}/billing_transfers/{id}/accept"
        actor: "AccountantUser (is_firm_admin == true)"
        preconditions:
          - "now < expires_at"
          - "AccountantFirm.firm_status == ACTIVE"
        side_effects: ["same as client-accept completion"]
      - from: [PENDING_CLIENT_ACCEPT, PENDING_FIRM_ACCEPT]
        to: DECLINED
        trigger: "POST .../decline with decline_reason"
        actor: "CompanyUser (PRIMARY_ADMIN) or AccountantUser (is_firm_admin)"
        preconditions: []
        side_effects: []
      - from: [PENDING_CLIENT_ACCEPT, PENDING_FIRM_ACCEPT]
        to: EXPIRED
        trigger: "system at expires_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PENDING_CLIENT_ACCEPT, PENDING_FIRM_ACCEPT]
        to: CANCELLED
        trigger: "POST .../cancel by initiating party"
        actor: "initiating party (PRIMARY_ADMIN if from_owner==CLIENT else firm_admin)"
        preconditions: []
        side_effects: []

  - entity: AccessGrant
    field: grant_status
    initial_state: PENDING_ACCEPT
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING_ACCEPT
        to: ACTIVE
        trigger: "POST /firms/{firm_id}/access_grants/{id}/accept"
        actor: "AccountantUser (the grant recipient)"
        preconditions:
          - "AccountantFirm.firm_status == ACTIVE"
          - "expires_at is null OR now < expires_at"
        side_effects: []
      - from: [PENDING_ACCEPT, ACTIVE]
        to: REVOKED
        trigger: "POST /companies/{company_id}/access_grants/{id}/revoke OR system on firm suspend / subscription cancel"
        actor: "CompanyUser (PRIMARY_ADMIN or COMPANY_ADMIN) or system"
        preconditions: []
        side_effects: []
      - from: [PENDING_ACCEPT, ACTIVE]
        to: EXPIRED
        trigger: "system when expires_at <= now"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExportRequest
    field: export_status
    initial_state: PENDING
    terminal_states: [DOWNLOADED, EXPIRED]
    transitions:
      - from: PENDING
        to: READY
        trigger: "system (async render completes; simulated by POST /companies/{company_id}/exports/{id}/mark_ready)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["ready_at = now; download_expires_at = now + 30 days"]
      - from: READY
        to: DOWNLOADED
        trigger: "POST /companies/{company_id}/exports/{id}/download"
        actor: "CompanyUser (PRIMARY_ADMIN) or AccountantUser with FULL_BOOKKEEPING"
        preconditions: ["now < download_expires_at"]
        side_effects: []
      - from: [PENDING, READY]
        to: EXPIRED
        trigger: "system at download_expires_at OR when Subscription -> CANCELLED_EXPIRED"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-plan-change-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /companies/{company_id}/subscription/change_plan"
    occ_field: expected_subscription_version
    description: |
      A plan-change request that carries an expected_subscription_version that
      no longer matches Subscription.version is rejected. Captures the case
      where another writer changed the plan (or a billing transfer completed,
      bumping version) since the caller last observed the subscription.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: subscription-billing-transfer-accept-stale
    parent_entity: Subscription
    write_endpoint: "POST /companies/{company_id}/billing_transfers/{id}/accept"
    occ_field: expected_subscription_version
    description: |
      Accepting a BillingTransfer against a Subscription whose version has
      advanced since the transfer was created is rejected. The accept
      recomputes pricing under the new billing owner and must not double-apply.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payroll-terminate-stale-addon
    parent_entity: PayrollAddon
    write_endpoint: "POST /companies/{company_id}/payroll/employees/{id}/terminate"
    occ_field: expected_payroll_addon_version
    description: |
      Terminating an employee against a PayrollAddon whose version has advanced
      (e.g. another terminate already fired, or service_level changed) is
      rejected so the per-employee proration snapshot is well-defined.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_subscription_price
    description: "Effective monthly price: list price minus wholesale discount if billing_owner == FIRM"
    trigger: "Subscription plan change, billing transfer completion, wholesale_discount_pct change on firm, invoice issue"
    algorithm: tiered_pricing
    formula: |
      if Subscription.billing_owner == "FIRM":
          firm = AccountantFirm[Subscription.billing_firm_id]
          # Discount is capped by firm.proadvisor_tier ceiling
          ceiling = { SILVER: 0.20, GOLD: 0.35, PLATINUM: 0.50 }[firm.proadvisor_tier]
          discount_pct = min(firm.wholesale_discount_pct, ceiling)
          # ROUND_HALF_UP to cents after applying the discount
          discounted_list = round_half_up(SubscriptionPlan.list_price_cents * (1 - discount_pct), 0)
          return discounted_list
      else:
          return SubscriptionPlan.list_price_cents
    input_set: "Subscription x SubscriptionPlan x AccountantFirm (when billing_owner == FIRM)"
    constants:
      SILVER_CEILING: 0.20
      GOLD_CEILING: 0.35
      PLATINUM_CEILING: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: list_price_variant
        when: "billing_owner == CLIENT"
        difference: "no wholesale discount; monthly_price_cents == list_price_cents"
      - name: wholesale_price_variant
        when: "billing_owner == FIRM"
        difference: "list * (1 - min(firm.wholesale_discount_pct, tier_ceiling)), rounded half-up to cents"

  - name: payroll_per_employee_fee
    description: "Monthly payroll add-on per-employee fee — daily proration with per-line rounding then sum"
    trigger: "Invoice issue"
    algorithm: tiered_pricing
    formula: |
      # Pin evaluation order: per-day employee count, per-day prorated fee, THEN sum.
      # Pin rounding order: round each per-day amount half-up to cents, then sum the cents.
      # Sum-then-round vs round-then-sum produces different cents — this scaffold picks
      # ROUND-PER-LINE-THEN-SUM. The 30-day month divisor is fixed regardless of month length.
      result = 0
      for each day d in [period_start, period_end):
          n_active = count of PayrollEmployee with employment_status == ACTIVE on day d
                       (employee is ACTIVE on day d iff hire_date <= d AND (terminated_at is null OR terminated_at > d))
          line_cents = round_half_up(n_active * PayrollAddon.per_employee_fee_cents / 30, 0)
          result += line_cents
      return result
    input_set: "All PayrollEmployees of the addon; days of [Invoice.period_start, period_end)"
    constants:
      DAYS_IN_BILLING_MONTH: 30
    precision: "integer cents; round each daily line half-up to cents, then sum"
    variants:
      - name: provisional_estimate
        when: "Subscription.monthly_price_cents quoted to the user mid-month (e.g. on plan-change preview)"
        difference: "uses CURRENT count of ACTIVE employees * per_employee_fee (no day-by-day), an optimistic estimate; can differ from final invoice line by a few cents"
      - name: final_invoice_value
        when: "Invoice issue"
        difference: "uses the day-by-day proration formula above; the authoritative number"

  - name: invoice_total
    description: "Invoice.total_cents — pinned evaluation order to disambiguate tax base"
    trigger: "Invoice issue"
    algorithm: tiered_pricing
    formula: |
      # Pinned order: subtotal (post-discount) is the tax base. Payroll is added BEFORE tax.
      subtotal = list_subscription_cents - wholesale_discount_cents + payroll_base_cents + payroll_per_employee_cents
      tax_cents = round_half_up(subtotal * tax_rate, 0)
      total_cents = subtotal + tax_cents
      # tax_rate depends on company home_country / data_region (constants below)
    input_set: "Invoice fields plus ClientCompany tax rate"
    constants:
      TAX_RATE_US: 0.0
      TAX_RATE_UK: 0.20
      TAX_RATE_EU: 0.21
    precision: "integer cents, round_half_up on the tax line"

  - name: reconciliation_difference
    description: "Reconciliation.difference_cents — must equal 0 to COMPLETE"
    trigger: "BankTransaction add/remove/categorize/exclude within window; statement balance edit"
    algorithm: aggregation
    formula: |
      cleared_cents = sum(amount_cents for txn in BankTransaction
                          where txn.bank_connection_id == recon.bank_connection_id
                            AND txn.txn_status IN (CATEGORIZED, MATCHED_RECONCILED)
                            AND txn.posted_at IN [statement_period_start, statement_period_end] inclusive)
      difference_cents = statement_ending_balance_cents - (beginning_balance_cents + cleared_cents)
    input_set: "BankTransactions in window with status CATEGORIZED or MATCHED_RECONCILED; EXCLUDED txns do not count"
    precision: "integer cents (no rounding)"
    variants:
      - name: projected_difference
        when: "Reconciliation DRAFT/IN_PROGRESS while txns are still being categorized"
        difference: "difference_cents includes RULE_SUGGESTED txns as if accepted — optimistic view"
      - name: locked_difference
        when: "Reconciliation COMPLETED"
        difference: "computed only over CATEGORIZED+MATCHED_RECONCILED — final, immutable"

  - name: payroll_tax_filing_status
    description: "Derived tax_filing_status — posture-driven over employee, bank, and recon state"
    trigger: "read of PayrollAddon; recomputed on every mutation of dependencies"
    algorithm: threshold
    formula: |
      if PayrollEmployee count where employment_status == ACTIVE == 0:
          return NOT_READY
      if any BankConnection on this company in STALE or REVOKED:
          return NOT_READY
      if any Reconciliation on this company IN_PROGRESS with statement_period_end older than 45 days:
          return PENALTY_RISK
      if all invoices for the trailing 3 months PAID:
          return FILED_CURRENT
      return READY
    input_set: "PayrollEmployees, BankConnections, Reconciliations, Invoices of the parent Subscription's company"
    constants:
      STALE_RECON_AGE_DAYS: 45
    precision: "n/a (enum)"

  - name: seat_count_check
    description: "Boundary check for adding/inviting CompanyUser"
    trigger: "POST /companies/{id}/users or POST .../users/{id}/accept"
    algorithm: threshold
    formula: |
      occupied = count of CompanyUser with company_id == X AND user_status IN (INVITED, ACTIVE)
      if occupied + 1 > SubscriptionPlan.max_seats:
          reject with ERR_SEAT_LIMIT_REACHED; set Subscription.pending_upgrade_prompt = true
      # boundary uses strict-greater-than on (occupied + 1); at exactly max_seats the add succeeds
    input_set: "CompanyUsers in INVITED or ACTIVE; DISABLED do not count"
    precision: "integer"

  - name: rule_match_selector
    description: "Deterministic selector for which CategorizationRule fires on a BankTransaction"
    trigger: "New BankTransaction ingested, or rule created/resumed (re-evaluates UNCATEGORIZED txns)"
    algorithm: weighted_scoring
    formula: |
      eligible_rules = rules where rule_status == ACTIVE
                       AND matches(rule, txn) by match_field:
                           PAYEE_CONTAINS: rule.match_value is case-insensitive substring of txn.payee_raw
                           AMOUNT_EQUALS: int(rule.match_value) == txn.amount_cents
                           AMOUNT_GREATER_THAN: txn.amount_cents > int(rule.match_value)
      # ranking: priority ASC (lower wins)
      # tie-break: created_at ASC (NEVER id — see §1.1 hard rule)
      # empty candidate set: leave UNCATEGORIZED
      if eligible_rules is empty: return none
      winner = min(eligible_rules, key=(priority, created_at))
      if winner.auto_apply: txn -> CATEGORIZED with category_id = winner.assign_category_id, matched_rule_id = winner.id
      else:                  txn -> RULE_SUGGESTED with matched_rule_id = winner.id (category_id remains null)
    input_set: "ACTIVE CategorizationRules for the txn's company"
    precision: "n/a (selector)"

  - name: transfer_proforma_price
    description: "BillingTransfer.proforma_monthly_cents — projected price after owner flip"
    trigger: "BillingTransfer creation"
    algorithm: tiered_pricing
    formula: |
      # Projected monthly price if transfer completes — wholesale vs list.
      # Circular-looking: proforma depends on discount, discount depends on firm's tier ceiling,
      # tier ceiling depends on the firm — but firm is initiating_firm_id (an input), so the
      # evaluation order is pinned: resolve firm -> tier -> ceiling -> effective discount -> price.
      firm = AccountantFirm[BillingTransfer.initiating_firm_id]
      ceiling = { SILVER: 0.20, GOLD: 0.35, PLATINUM: 0.50 }[firm.proadvisor_tier]
      if BillingTransfer.to_owner == "FIRM":
          effective_pct = min(firm.wholesale_discount_pct, ceiling)
          base = round_half_up(SubscriptionPlan.list_price_cents * (1 - effective_pct), 0)
      else:
          base = SubscriptionPlan.list_price_cents
      # add payroll snapshot at CURRENT active-employee count (per the provisional variant)
      payroll = 0
      if PayrollAddon exists AND addon_status == ACTIVE:
          n = count of ACTIVE PayrollEmployees
          payroll = PayrollAddon.base_fee_cents + n * PayrollAddon.per_employee_fee_cents
      return base + payroll
    input_set: "Subscription + Plan + Firm + PayrollAddon + PayrollEmployees"
    precision: "integer cents, round_half_up"


# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "When X-User-Role is entity-backed (CompanyUser, AccountantUser), X-User-ID must equal the id of a persisted instance of that entity; ownership checks (e.g. CompanyUser can only act on their own company_id) enforced here"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all entity-backed role endpoints"

  - priority: 4
    category: existence
    check: "Path-segment ids exist, validated left-to-right; first missing id wins"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Body foreign keys exist (e.g. plan_id, assign_category_id, accountant_user_id, initiating_firm_id) in the order they appear in endpoint input list"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with body FKs"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is allowed (per §1.2 from: list)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 400
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Subscription lifecycle gate: writes to company data require lifecycle_status IN (TRIAL, ACTIVE, PAST_DUE, REACTIVATED); reads allowed in CANCELLED_READ_ONLY; nothing in CANCELLED_EXPIRED"
    error_id: ERR_SUBSCRIPTION_NOT_WRITABLE
    http_status: 400
    applies_to: "all mutating endpoints under /companies/{id}"

  - priority: 8
    category: business_safety
    check: "Feature gating: requested operation requires SubscriptionPlan.feature_<name> == true; otherwise reject"
    error_id: ERR_FEATURE_NOT_IN_TIER
    http_status: 400
    applies_to: "inventory endpoints, project-profitability endpoints, multi-currency endpoints, rule-based categorize endpoints"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: PRIMARY_ADMIN-only operations (cancel subscription, accept billing transfer, change plan) require permission_level == PRIMARY_ADMIN; COMPANY_ADMIN cannot substitute"
    error_id: ERR_REQUIRES_PRIMARY_ADMIN
    http_status: 403
    applies_to: "subscription/cancel, billing_transfers/accept, subscription/change_plan, exports/download with scope=FULL_LEDGER"

  - priority: 10
    category: business_referential
    check: "Reconciliation window overlap: [start, end] must not intersect any existing IN_PROGRESS or COMPLETED recon on the same bank_connection_id; CLOSED interval on both ends — adjacency where other's end == this start IS an overlap (use end+1 day for true adjacency)"
    error_id: ERR_STATEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /companies/{id}/reconciliations and POST .../reconciliations/{id}/start"

  - priority: 11
    category: business_referential
    check: "MigrationJob concurrent-window: only one MigrationJob in (QUEUED, CONVERTING) per company at a time; closed interval over job lifetime"
    error_id: ERR_MIGRATION_ALREADY_IN_FLIGHT
    http_status: 409
    applies_to: "POST /companies/{id}/migration_jobs"

  - priority: 12
    category: business_constraint
    check: "Uniqueness: SubscriptionPlan.plan_code globally unique; CompanyUser.email unique within company_id; AccountantUser.email unique within firm_id; one ACTIVE PayrollAddon per Subscription; one ACTIVE BankConnection per (company_id, institution_name, external_account_mask)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "creation endpoints for those entities"

  - priority: 13
    category: business_constraint
    check: "Enum domain: any enum field value must be in the declared constraint set"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all"

  - priority: 14
    category: business_fiscal
    check: "Seat limit: adding a CompanyUser (INVITED) would exceed SubscriptionPlan.max_seats"
    error_id: ERR_SEAT_LIMIT_REACHED
    http_status: 400
    applies_to: "POST /companies/{id}/users, POST .../users/{id}/accept"

  - priority: 15
    category: business_fiscal
    check: "Billing preconditions: payroll cancel forbidden while FULL_SERVICE tax_filing_status == FILED_CURRENT pending ack; transfer forbidden while transfer pending; firm close blocked while it owns billing on non-terminal subscriptions"
    error_id: ERR_BILLING_STATE_BLOCKED
    http_status: 400
    applies_to: "billing/payroll/firm-lifecycle endpoints"

  - priority: 16
    category: business_temporal
    check: "Time-window checks: BillingTransfer accept before expires_at; AccessGrant accept before expires_at; ExportRequest download before download_expires_at; reactivate before read_only_expires_at"
    error_id: ERR_WINDOW_EXPIRED
    http_status: 400
    applies_to: "transfer/grant/export/reactivate endpoints"

  - priority: 17
    category: business_temporal
    check: "Bank feed consent: connection authorize or reauthorize requires consent_expires_at > now"
    error_id: ERR_CONSENT_EXPIRED
    http_status: 400
    applies_to: "bank_connections authorize / reauthorize"

  - priority: 18
    category: business_referential
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "OCC endpoints (subscription change_plan, billing_transfer accept, payroll terminate)"


# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock & simulation test-drivers (test-only, declared per §1.5 ladder rung 3) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server boots with current_utc == 2026-09-01T00:00:00Z; never falls back to wall clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["re-evaluates time-driven transitions: trial expiry, transfer/grant expiry, export expiry, consent expiry"]
  - method: POST
    path: "/api/_payments/simulate"
    description: "Simulate a payment outcome against an invoice (SUCCEEDED, DECLINED, TIMEOUT)"
    roles: [PlatformAdmin]
    code: 200
    input: [invoice_id, outcome]
    output: Invoice
    side_effects: ["on SUCCEEDED: Invoice ISSUED -> PAID; on DECLINED: stays ISSUED"]
  - method: POST
    path: "/api/_sync/bank_feed_tick"
    description: "Trigger one bank-feed sync tick for a connection: pulls pending transactions and re-evaluates consent_expires_at"
    roles: [PlatformAdmin]
    code: 200
    input: [bank_connection_id]
    output: BankConnection
    side_effects: ["on success: last_sync_at = now; on consent expired: connection -> STALE"]

  # --- Platform admin: plans & firms ---
  - method: POST
    path: "/api/plans"
    description: "Create a subscription plan tier"
    roles: [PlatformAdmin]
    code: 201
    input: [plan_code, list_price_cents, max_seats, feature_inventory, feature_project_profitability, feature_multi_currency, feature_bank_rules, plan_rank]
    output: SubscriptionPlan
    side_effects: []
  - method: GET
    path: "/api/plans/{id}"
    description: "Get a plan"
    roles: [PlatformAdmin, CompanyUser, AccountantUser]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []
  - method: GET
    path: "/api/plans"
    description: "List plans"
    roles: [PlatformAdmin, CompanyUser, AccountantUser]
    code: 200
    input: []
    output: "SubscriptionPlan[]"
    side_effects: []

  - method: POST
    path: "/api/firms"
    description: "Register an accountant firm"
    roles: [PlatformAdmin]
    code: 201
    input: [firm_name, wholesale_discount_pct, proadvisor_tier]
    output: AccountantFirm
    side_effects: []
  - method: GET
    path: "/api/firms/{id}"
    description: "Get a firm"
    roles: [PlatformAdmin, AccountantUser]
    code: 200
    input: []
    output: AccountantFirm
    side_effects: []
  - method: POST
    path: "/api/firms/{id}/suspend"
    description: "Suspend a firm (cascades to grants)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AccountantFirm
    side_effects: ["AccessGrants ACTIVE -> REVOKED"]
  - method: POST
    path: "/api/firms/{id}/reactivate"
    description: "Reactivate a suspended firm"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AccountantFirm
    side_effects: []
  - method: POST
    path: "/api/firms/{id}/close"
    description: "Close a firm (terminal)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AccountantFirm
    side_effects: ["pending BillingTransfers CANCELLED"]

  - method: POST
    path: "/api/firms/{id}/users"
    description: "Create an AccountantUser under a firm"
    roles: [PlatformAdmin]
    code: 201
    input: [firm_id, full_name, email, "is_firm_admin?"]
    output: AccountantUser
    side_effects: []
  - method: GET
    path: "/api/firms/{id}/users"
    description: "List users of a firm (FK reverse-reachability for AccountantUser.firm_id)"
    roles: [PlatformAdmin, AccountantUser]
    code: 200
    input: []
    output: "AccountantUser[]"
    side_effects: []
  - method: GET
    path: "/api/firms/{id}/users/{user_id}"
    description: "Get one accountant user"
    roles: [PlatformAdmin, AccountantUser]
    code: 200
    input: []
    output: AccountantUser
    side_effects: []

  # --- Companies & users ---
  - method: POST
    path: "/api/companies"
    description: "Create a client company; auto-creates a TRIAL Subscription on the default plan"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, admin_email, home_country, data_region, plan_id]
    output: ClientCompany
    side_effects: ["Subscription created in TRIAL, started_at = now, trial_ends_at = now + 30d"]
  - method: GET
    path: "/api/companies/{id}"
    description: "Get a company"
    roles: [PlatformAdmin, CompanyUser, AccountantUser]
    code: 200
    input: []
    output: ClientCompany
    side_effects: []

  - method: POST
    path: "/api/companies/{id}/users"
    description: "Invite a CompanyUser (seat-limit checked here). PlatformAdmin may create the initial PRIMARY_ADMIN at company onboarding; subsequent invites must be by CompanyUser."
    roles: [PlatformAdmin, CompanyUser]
    code: 201
    input: [company_id, email, display_name, permission_level]
    output: CompanyUser
    side_effects: ["CompanyUser created INVITED; Subscription.pending_upgrade_prompt set if seat-limit fires"]
  - method: GET
    path: "/api/companies/{id}/users"
    description: "List users of a company"
    roles: [PlatformAdmin, CompanyUser, AccountantUser]
    code: 200
    input: ["user_status?", "limit?", "offset?"]
    output: "CompanyUser[]"
    side_effects: []
  - method: GET
    path: "/api/companies/{id}/users/{user_id}"
    description: "Get one company user"
    roles: [PlatformAdmin, CompanyUser, AccountantUser]
    code: 200
    input: []
    output: CompanyUser
    side_effects: []
  - method: POST
    path: "/api/companies/{id}/users/{user_id}/accept"
    description: "Accept invitation; INVITED -> ACTIVE; seat-limit re-checked"
    roles: [CompanyUser]
    code: 200
    input: []
    output: CompanyUser
    side_effects: []
  - method: POST
    path: "/api/companies/{id}/users/{user_id}/disable"
    description: "Disable a user (cannot disable PRIMARY_ADMIN)"
    roles: [CompanyUser]
    code: 200
    input: []
    output: CompanyUser
    side_effects: []

  # --- Subscription lifecycle ---
  - method: GET
    path: "/api/companies/{id}/subscription"
    description: "Get the company's subscription"
    roles: [PlatformAdmin, CompanyUser, AccountantUser]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: POST
    path: "/api/companies/{id}/subscription/activate"
    description: "Activate trial (TRIAL -> ACTIVE); records payment method"
    roles: [CompanyUser]
    code: 200
    input: [payment_method_token]
    output: Subscription
    side_effects: ["anchor_day set; first Invoice ISSUED"]
  - method: POST
    path: "/api/companies/{id}/subscription/change_plan"
    description: "Upgrade/downgrade plan (OCC on Subscription.version)"
    roles: [CompanyUser]
    code: 200
    input: [plan_id, expected_subscription_version]
    output: Subscription
    side_effects: ["Subscription.version incremented", "monthly_price_cents recomputed", "pending_upgrade_prompt cleared"]
  - method: POST
    path: "/api/companies/{id}/subscription/cancel"
    description: "Cancel the subscription (PRIMARY_ADMIN only)"
    roles: [CompanyUser]
    code: 200
    input: [reason]
    output: Subscription
    side_effects: ["Cancel cascade: payroll, grants, bank connections, integrations, company READ_ONLY, pending migration cancelled"]
  - method: POST
    path: "/api/companies/{id}/subscription/reactivate"
    description: "Reactivate from CANCELLED_READ_ONLY (within 365-day window)"
    roles: [CompanyUser]
    code: 200
    input: [payment_method_token]
    output: Subscription
    side_effects: ["Company READ_ONLY -> ACTIVE"]
  - method: POST
    path: "/api/companies/{id}/subscription/resume"
    description: "Resume from SUSPENDED after settling invoices"
    roles: [CompanyUser]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Payroll PAUSED -> ACTIVE"]

  # --- Payroll ---
  - method: POST
    path: "/api/companies/{id}/payroll"
    description: "Activate payroll addon on the company's subscription"
    roles: [CompanyUser]
    code: 201
    input: [subscription_id, service_level]
    output: PayrollAddon
    side_effects: ["base_fee/per_employee_fee snapshotted from rate card"]
  - method: GET
    path: "/api/companies/{id}/payroll"
    description: "Get the payroll addon (single per subscription)"
    roles: [PlatformAdmin, CompanyUser, AccountantUser]
    code: 200
    input: []
    output: PayrollAddon
    side_effects: ["tax_filing_status recomputed"]
  - method: POST
    path: "/api/companies/{id}/payroll/pause"
    description: "Pause payroll"
    roles: [CompanyUser]
    code: 200
    input: []
    output: PayrollAddon
    side_effects: []
  - method: POST
    path: "/api/companies/{id}/payroll/resume"
    description: "Resume payroll"
    roles: [CompanyUser]
    code: 200
    input: []
    output: PayrollAddon
    side_effects: []
  - method: POST
    path: "/api/companies/{id}/payroll/cancel"
    description: "Cancel payroll (terminal)"
    roles: [CompanyUser]
    code: 200
    input: []
    output: PayrollAddon
    side_effects: []

  - method: POST
    path: "/api/companies/{id}/payroll/employees"
    description: "Add a payroll employee"
    roles: [CompanyUser, AccountantUser]
    code: 201
    input: [payroll_addon_id, legal_name, hire_date]
    output: PayrollEmployee
    side_effects: []
  - method: GET
    path: "/api/companies/{id}/payroll/employees"
    description: "List payroll employees"
    roles: [PlatformAdmin, CompanyUser, AccountantUser]
    code: 200
    input: ["employment_status?"]
    output: "PayrollEmployee[]"
    side_effects: []
  - method: GET
    path: "/api/companies/{id}/payroll/employees/{eid}"
    description: "Get one employee"
