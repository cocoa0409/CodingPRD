            - "${err} == \"ERR_INSPECTION_NOT_IN_PROGRESS\""
            - "Inspection.${insp_id}.issued_weight_total is still 8.00 and .issued_on is still \"2026-09-01\""
            - "TestSite.${site_id}.open_deficiency_weight == 8.00 and .oversight_posture == RESTRICTED - NOT SUSPENDED, which a doubled 16.00 would have caused"
            - "DeficiencyFinding.${def_id}.weight == 8.00 and .repeat_multiplier == 1.0"

      - name: qc_overdue_lock_leaves_pending_results_unheld_unlike_qc_failure_lock
        claim_type: conditional_cascade
        grounds:
          - state_machines.Device.ACTIVE_to_QC_LOCKED_overdue
          - endpoints[POST /poct/oversight-runs]
          - entities.TestResult.fields.held_by_device_lock_at
          - entities.TestSite.fields.held_result_count
        distinguishing_aspect: |
          Two different triggers reach the SAME target state QC_LOCKED with
          different cascades: the QC_OVERDUE branch of the oversight run leaves
          the pending result in PENDING_REVIEW with held_by_device_lock_at null
          and held_result_count 0, whereas the QC_FAILURE branch would have held
          it. Same state, divergent side-effect set.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T08:00:00Z at build time."
            - "Covered WAIVED site, trained operator, device GLUCO-9 with qc_frequency_days 1, VERIFIED lot, both LEVEL_1 and LEVEL_2 PASS runs on 2026-08-01 so last_two_level_qc_pass_on == 2026-08-01 and qc_next_due_at == 2026-08-02."
            - "One patient result captured on 2026-08-01 sits in PENDING_REVIEW (priority 55 passes because 2026-08-01 <= qc_next_due_at)."
            - "The clock is then advanced to 2026-08-05, so date(now) > qc_next_due_at when the oversight run executes."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
