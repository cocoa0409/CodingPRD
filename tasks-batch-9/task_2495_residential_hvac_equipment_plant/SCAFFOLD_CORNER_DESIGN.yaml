      - name: c_decide_sod_preempts_flammable_refrigerant_prohibition
        claim_type: priority_ordering
        grounds:
          - priority_pair_conflicts.decide-sod-beats-flammable-prohibition
          - validations.segregation-of-duties
          - validations.flammable-refrigerant-prohibited
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_FLAMMABLE_REFRIGERANT_PROHIBITED
        distinguishing_aspect: "The same SUBMITTED A2L filing into a region that bans flammable refrigerant yields two different errors depending only on the caller identity: 409 ERR_SEGREGATION_OF_DUTIES for the submitter wearing the auditor role, and 422 ERR_FLAMMABLE_REFRIGERANT_PROHIBITED for a genuinely different auditor - so the prohibition is never reported to the person barred from deciding."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ACTIVE NORTHEAST standard with prohibits_flammable_refrigerant true and min_seer2_high 16.00."
            - "A RELEASED HIGH-tier A2L platform rated 16.20 SEER2 with max_charge_grams 1800."
            - "A NORTHEAST certification filed and submitted at 16.20 by user-ce-1, so the efficiency gate at priority 70 is satisfied and only the flammability prohibition remains."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/regional-standards"
              payload: { region_code: "NORTHEAST", min_seer2_standard: 14.30, min_seer2_high: 16.00, min_seer2_premium: 17.00, effective_from_utc: "2026-01-01T00:00:00Z", prohibits_flammable_refrigerant: true }
              as: PlantAdmin
              captures: { std_id: $.data.id }
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 16.20, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
              captures: { plat_v: $.data.version }
            - call: "POST /plant/certification-records"
              payload: { platform_id: "${plat_id}", region_code: "NORTHEAST", rated_seer2_submitted: 16.20, expected_platform_version: "${plat_v}" }
              as: CertificationEngineer
              as_user_id: "user-ce-1"
              captures: { cert_id: $.data.id }
            - call: "POST /plant/certification-records/${cert_id}/submit"
              payload: {}
              as: CertificationEngineer
              as_user_id: "user-ce-1"
          trigger:
            - call: "POST /plant/certification-records/${cert_id}/decide"
              payload: { decision: "CERTIFIED" }
              as: RegulatoryAuditor
              as_user_id: "user-ce-1"
              captures: { err_sod_id: $.data.error_id }
            - call: "POST /plant/certification-records/${cert_id}/decide"
              payload: { decision: "CERTIFIED" }
              as: RegulatoryAuditor
              as_user_id: "user-ra-1"
              captures: { err_flam_id: $.data.error_id }
          assert:
            - "First trigger call: HTTP 409 with ${err_sod_id} == ERR_SEGREGATION_OF_DUTIES - priority 60 wins over priority 70"
            - "Second trigger call: HTTP 422 with ${err_flam_id} == ERR_FLAMMABLE_REFRIGERANT_PROHIBITED"
            - "CertificationRecord.${cert_id}.status == SUBMITTED after both calls, decided_by_user_id is null, decided_at is null"
            - "CertificationRecord.${cert_id}.submitted_by_user_id == \"user-ce-1\" and governing_standard_id == ${std_id}"
            - "ProductPlatform.${plat_id}.blocked_region_codes == [\"NORTHEAST\"] and salable_region_count == 0"

