            - call: "POST /shelter-beds"
              payload: { shelter_site: "Haven", bed_label: "P1", features: ["PET_FRIENDLY"] }
              as: ShelterCoordinator
              as_user_id: "${sc_id}"
              captures: { bed_p: $.data.id }
