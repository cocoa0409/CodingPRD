scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_provisional_vs_total_final_on_booking
        grounds:
          - calculations.booking_deposit_due
          - calculations.booking_total_price
          - entities.Booking.fields.deposit_due_cents
          - entities.Booking.fields.total_price_cents
        distinguishing_aspect: |
          Same Booking, two algorithms: deposit_due_cents (provisional deposit fraction) and
          total_price_cents (final full-price settlement) yield different numbers on the Booking domain.
        test_recipe:
          setup:
            - "OPEN event, seat_price_cents=10000, deposit_pct=0.25, table_mode=PRIVATE, 4 seats generated"
            - "Guest books 2 STANDARD seats, party_size=2, byob 0"
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "Tasting Nights", cadence: "WEEKLY", theme: "Nordic", default_seat_capacity: 4, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Loft", address: "1 A St", max_capacity: 50, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "Ada", specialty: "Nordic" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "Guy", email: "g@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "N1", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T22:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "PRIVATE", seat_capacity: 4, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "Amuse", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id", seat1: "$.data[1].id" }
          trigger:
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 2, seat_ids: ["${seat0}", "${seat1}"] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.deposit_due_cents == 5000"
            - "Booking.${booking_id}.total_price_cents == 20000"
            - "Booking.${booking_id}.deposit_due_cents != Booking.${booking_id}.total_price_cents"

      - name: projected_vs_realized_revenue_on_event
        grounds:
          - calculations.event_revenue
          - entities.Event.fields.projected_revenue_cents
          - entities.Event.fields.realized_revenue_cents
        distinguishing_aspect: |
          Same set of Bookings, two algorithms on the Event domain: projected_revenue_cents (forward-looking,
          counts CONFIRMED full totals) vs realized_revenue_cents (chronological, counts only ATTENDED/NO_SHOW) diverge.
        test_recipe:
          setup:
            - "OPEN event with 2 CONFIRMED single-seat bookings, none attended yet"
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "Rev", cadence: "MONTHLY", theme: "Bistro", default_seat_capacity: 2, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Hall", address: "2 B St", max_capacity: 20, corkage_policy: "NOT_ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "Ben", specialty: "Bistro" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "G1", email: "g1@x.com" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /guests"
              payload: { name: "G2", email: "g2@x.com" }
              as: PlatformAdmin
              captures: { g2: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "R1", event_start: "2026-03-20T18:00:00Z", event_end: "2026-03-20T22:00:00Z", booking_deadline: "2026-03-19T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 2, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "Soup", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id", seat1: "$.data[1].id" }
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${g1}", party_size: 1, seat_ids: ["${seat0}"] }
              as: Guest
              as_user_id: "${g1}"
              captures: { b1: $.data.id }
            - call: "POST /bookings/${b1}/pay-deposit"
              payload: { amount_cents: 2500 }
              as: Guest
              as_user_id: "${g1}"
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${g2}", party_size: 1, seat_ids: ["${seat1}"] }
              as: Guest
              as_user_id: "${g2}"
              captures: { b2: $.data.id }
            - call: "POST /bookings/${b2}/pay-deposit"
              payload: { amount_cents: 2500 }
              as: Guest
              as_user_id: "${g2}"
          trigger:
            - call: "GET /events/${event_id}"
              payload: {}
              as: PlatformAdmin
              captures: { proj: $.data.projected_revenue_cents, real: $.data.realized_revenue_cents }
          assert:
            - "Event.${event_id}.projected_revenue_cents == 20000"
            - "Event.${event_id}.realized_revenue_cents == 0"
            - "Event.${event_id}.projected_revenue_cents != Event.${event_id}.realized_revenue_cents"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: group_discount_tiered_nonlinear_total
        grounds:
          - calculations.booking_total_price
          - entities.Event.fields.table_mode
          - entities.Booking.fields.total_price_cents
        distinguishing_aspect: |
          Mode (a): total_price_cents is a >=3-input non-linear formula — subtotal, party_size tier selection
          (0.10 vs 0.15), table_mode branch, and a min() discount cap — not a flat rate.
        test_recipe:
          setup:
            - "OPEN PRIVATE event seat_price_cents=10000, 6 seats; Guest books all 6 STANDARD seats, byob 0"
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "Big", cadence: "MONTHLY", theme: "Feast", default_seat_capacity: 6, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Barn", address: "3 C St", max_capacity: 30, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "Cy", specialty: "Feast" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "Host", email: "h@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "Feast1", event_start: "2026-03-25T18:00:00Z", event_end: "2026-03-25T23:00:00Z", booking_deadline: "2026-03-24T00:00:00Z", table_mode: "PRIVATE", seat_capacity: 6, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "Board", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { s0: "$.data[0].id", s1: "$.data[1].id", s2: "$.data[2].id", s3: "$.data[3].id", s4: "$.data[4].id", s5: "$.data[5].id" }
          trigger:
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 6, seat_ids: ["${s0}", "${s1}", "${s2}", "${s3}", "${s4}", "${s5}"] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.total_price_cents == 54000"
            - "Booking.${booking_id}.deposit_due_cents == 15000"

      - name: deposit_round_per_seat_then_sum
        grounds:
          - calculations.booking_deposit_due
          - entities.Booking.fields.deposit_due_cents
        distinguishing_aspect: |
          Mode (b): deposit_due_cents pins rounding ORDER — round each seat's deposit (1247.5->1248) then sum
          (=2496); sum-then-round would give 2495. The scaffold's pinned order produces 2496.
        test_recipe:
          setup:
            - "OPEN event seat_price_cents=4990, deposit_pct=0.25, 2 seats; Guest books both STANDARD seats"
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "Odd", cadence: "WEEKLY", theme: "Small", default_seat_capacity: 2, base_seat_price_cents: 4990, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Nook", address: "4 D St", max_capacity: 10, corkage_policy: "NOT_ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "Di", specialty: "Small" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "Ph", email: "p@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "Odd1", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 2, seat_price_cents: 4990, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "Bite", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id", seat1: "$.data[1].id" }
          trigger:
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 2, seat_ids: ["${seat0}", "${seat1}"] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.deposit_due_cents == 2496"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: event_suspend_resume_cycle
        grounds:
          - state_machines.Event.OPEN_to_SUSPENDED
          - state_machines.Event.SUSPENDED_to_OPEN
        distinguishing_aspect: |
          Cyclic shape on the Event entity: OPEN->SUSPENDED->OPEN returns the machine to a prior state,
          which a linear pipeline cannot do.
        test_recipe:
          setup:
            - "Event brought to OPEN then SUSPENDED"
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "Cyc", cadence: "WEEKLY", theme: "T", default_seat_capacity: 2, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "5 E St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "Ch", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "C1", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 2, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /events/${event_id}/resume"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Event.${event_id}.status == OPEN"

      - name: booking_parallel_status_dimensions
        grounds:
          - state_machines.Booking.PENDING_DEPOSIT_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_ATTENDED
          - entities.Booking.fields.booking_status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: |
          Parallel dimensions on the Booking entity: booking_status advances to ATTENDED while payment_status
          stays DEPOSIT_PAID — the two axes occupy independent positions on the same row.
        test_recipe:
          setup:
            - "OPEN event; Guest books+pays deposit (CONFIRMED/DEPOSIT_PAID)"
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "Par", cadence: "WEEKLY", theme: "T", default_seat_capacity: 2, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Vp", address: "6 F St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "Cp", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "Gp", email: "gp@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "P1", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 2, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id" }
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 1, seat_ids: ["${seat0}"] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/pay-deposit"
              payload: { amount_cents: 2500 }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/check-in"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Booking.${booking_id}.booking_status == ATTENDED"
            - "Booking.${booking_id}.payment_status == DEPOSIT_PAID"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_booking_refund_seat_chain
        grounds:
          - state_machines.Event.OPEN_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Seat.BOOKED_to_AVAILABLE
        distinguishing_aspect: |
          Depth-3 chain from a single trigger: Event cancel -> Booking CANCELLED (hop1) -> that booking's cancel
          frees its Seat BOOKED->AVAILABLE and appends a full-refund Payment (hop2/hop3), each caused by the prior hop.
        test_recipe:
          setup:
            - "OPEN event, 1 seat; Guest books+pays deposit (CONFIRMED, seat BOOKED, deposit_paid 2500)"
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "Casc", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Vc", address: "7 G St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "Cc", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "Gc", email: "gc@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "Cc1", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "PRIVATE", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id" }
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 1, seat_ids: ["${seat0}"] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/pay-deposit"
              payload: { amount_cents: 2500 }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /events/${event_id}/cancel"
              payload: { reason: "chef ill" }
              as: PlatformAdmin
          assert:
            - "Event.${event_id}.status == CANCELLED"
            - "Booking.${booking_id}.booking_status == CANCELLED"
            - "Booking.${booking_id}.payment_status == REFUNDED"
            - "Booking.${booking_id}.refund_cents == 2500"
            - "GET /bookings/${booking_id}/payments contains a Payment with kind == REFUND and amount_cents == 2500"
            - "GET /events/${event_id}/seats: seat ${seat0} status == AVAILABLE"

      - name: booking_cancel_frees_seat_promotes_waitlist_chain
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.Seat.BOOKED_to_AVAILABLE
          - state_machines.WaitlistEntry.WAITING_to_PROMOTED
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (guest booking cancel, event still OPEN): cancel -> Seat freed
          -> front WAITING WaitlistEntry PROMOTED with an auto-created Booking, each hop caused by the prior.
        test_recipe:
          setup:
            - "OPEN event seat_capacity=1; Guest1 books+pays the only seat (event full); Guest2 joins the waitlist (WAITING)"
            - "logical clock at default 2026-03-01T00:00:00Z (14 days before event_start)"
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "Wl", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Vw", address: "8 H St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "Cw", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "G1", email: "g1w@x.com" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /guests"
              payload: { name: "G2", email: "g2w@x.com" }
              as: PlatformAdmin
              captures: { g2: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "W1", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
