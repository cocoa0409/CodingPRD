      - name: duplicate_open_window_check_outranks_overlap_check
        claim_type: Priority conflict
        grounds:
          - validations.priority_53
          - validations.priority_62
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / constraint_priority_53_beats_temporal_priority_62_on_monitoring_window
          rationale: "The named §1.8 instance violates both rules with one window and asserts ERR_DUPLICATE_OPEN_WINDOW, then closes the first window to expose ERR_MONITORING_WINDOW_OVERLAP."

      - name: endpoint_capacity_is_an_aggregate_across_deployments
        claim_type: Aggregate validation
        grounds:
          - validations.priority_70
          - calculations.endpoint_traffic_ledger
        excluded_because:
          difficulty_instance: combinatorial_formula / ramp_plan_five_input_nonlinear_headroom_interaction
          rationale: "The named §1.8 instance drives two deployments against one endpoint until granted_delta_pct is 0 and asserts ERR_ENDPOINT_CAPACITY_EXHAUSTED with each individual ramp being legal on its own."

      - name: evaluation_sample_quota_is_an_aggregate_across_evaluations
        claim_type: Aggregate validation
        grounds:
