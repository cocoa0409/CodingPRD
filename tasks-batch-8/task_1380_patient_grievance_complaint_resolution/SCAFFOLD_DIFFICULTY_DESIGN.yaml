            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-06T09:00:01Z" }, as: SystemAdmin }
            - { call: "GET /api/patient-cases/${c1}/timeline", as: IntakeCoordinator, captures: { st_late: $.data.regulatory_clock_status } }
          assert:
