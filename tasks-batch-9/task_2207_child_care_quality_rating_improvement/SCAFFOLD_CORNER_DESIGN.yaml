          - entities.RatingCycle.fields.publication_status
          - endpoints[POST /providers/{provider_id}/rating-cycles]
        distinguishing_aspect: "A freshly opened INITIAL cycle is DRAFT with publication_status UNPUBLISHED, awarded_tier null and supersedes_cycle_id null because the provider held no ACTIVE cycle; opened_on is the logical clock date 2026-08-03."
        test_recipe:
          setup:
            - "5 StandardDomain rows (weights summing to 1.00); one ENROLLED provider; clock 2026-08-03."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: StateAdministrator, as_user_id: "admin_ops_1" }
