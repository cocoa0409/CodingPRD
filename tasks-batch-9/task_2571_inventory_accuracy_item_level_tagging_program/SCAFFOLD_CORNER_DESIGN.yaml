            - "the same request linked to a CLOSED THEFT investigation instead computes authority_threshold_cents 10000 — the link is what changes the arithmetic"

      - name: stock_position_accuracy_computed_read_matches_both_variants
        claim_type: computed_read
        grounds:
          - endpoints.GET_stock_positions_accuracy
        distinguishing_aspect: "The accuracy read exposes the unit and value variants side by side together with the promising state derived from the value variant."
        excluded_because:
          difficulty_instance: "dual_variant_calc / stock_accuracy_unit_vs_value_diverge"
          rationale: "The named §1.8 instance reads this endpoint and asserts every field of it on a divergent basket, so a separate §1.9 computed-read test would repeat the same request and the same expectations."

      - name: store_fulfillment_eligibility_computed_read_on_an_empty_store
        claim_type: computed_read
        grounds:
          - endpoints.GET_stores_fulfillment_eligibility
        distinguishing_aspect: "With no positions at all the read must report accuracy_index_bps 10000 and ELIGIBLE rather than dividing by zero."
        excluded_because:
          difficulty_instance: "boundary_precision_check / empty_store_reads_ten_thousand_bps_and_eligible"
          rationale: "The named §1.8 instance already pins the empty-store degenerate case field by field on this exact endpoint."

  # ==========================================================================
  # Errors — every id in the §1.6 catalog must be triggerable. Ids already
  # exercised by an instance in another §1.9 section above are not repeated
  # here; ids owned by a §1.8 instance appear as excluded_because stubs.
  # ==========================================================================
  - section: errors
    instances:

      - name: count_task_create_missing_x_user_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1_ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication is the very first rung: with no X-User-Role header the request is rejected 401 before the body, the schedule lookup or any business rule is consulted, so a payload that would also fail validation still reports ERR_UNAUTHENTICATED."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100 and an ACTIVE HANDHELD schedule due 2026-08-01 all exist."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z" }
              as: "(no X-User-Role header is sent)"
              as_user_id: "(no X-User-ID header is sent)"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 401 and data.error_id == \"ERR_UNAUTHENTICATED\", not ERR_COUNT_WINDOW_NOT_DUE and not ERR_INVALID_WINDOW, even though the window is both not due and zero-length"
            - "response response_type == \"error\" and data carries exactly error_id and message"
            - "the same request with X-User-Role \"Auditor\", a role outside the seven declared in §1.7, also returns 401 ERR_UNAUTHENTICATED"
            - "the same request with a valid role but an empty X-User-ID returns 401 ERR_UNAUTHENTICATED"
            - "GET /inventory-integrity/count-tasks?count_schedule_id=${sched1} as InventoryAnalyst returns total_count 0"

      - name: tag_batch_receive_by_a_different_store_ops_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - errors.ERR_IDENTITY_SCOPE_VIOLATION
          - roles.StoreOps
        distinguishing_aspect: "StoreOps is entity_backed on Store, so receiving a batch whose destination_store_id is S100 while presenting S200's id is a 403 identity-scope violation — the role is permitted on the endpoint, only the identity is wrong."
        test_recipe:
          setup:
            - "Category APPAREL, Stores S100 and S200, Vendor VEND1, Item TEE-001 with SGTIN_96 and epc_prefix_length 7."
            - "A TagBatch destined for S100, encoded so that it is in status ENCODED and ready to receive."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S200", name: "Store 200", reader_capability: "HANDHELD_ONLY", overhead_reader_capacity: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s200: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch1: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches/${batch1}/encode"
              payload: { encoding_scheme: "SGTIN_96", epc_prefix: "0614141" }
              as: VendorRep
              as_user_id: "${vendor1}"
          trigger:
            - call: "POST /inventory-integrity/tag-batches/${batch1}/receive"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s200}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 403 and data.error_id == \"ERR_IDENTITY_SCOPE_VIOLATION\""
            - "GET /inventory-integrity/tag-batches/${batch1} still reads status \"ENCODED\" and received_at null"
            - "the same call with as_user_id ${store_s100} returns 200 with status \"RECEIVED\""
            - "a VendorRep presenting another vendor's id on POST /tag-batches likewise returns 403 ERR_IDENTITY_SCOPE_VIOLATION, and so does a ThirdPartyCounter starting another firm's physical inventory"

      - name: unknown_path_ids_return_family_specific_not_found
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CATEGORY_NOT_FOUND
          - errors.ERR_ITEM_NOT_FOUND
          - errors.ERR_COUNT_TASK_NOT_FOUND
          - validations.priority_10_path_ids
        distinguishing_aspect: "Every path id is resolved left-to-right at priority 10 and each entity family reports its own 404 id, so the error tells the caller which segment failed rather than a generic not-found."
        test_recipe:
          setup:
            - "An otherwise empty database; only the ids used below are absent."
          setup_api_calls: []
          trigger:
            - call: "GET /inventory-integrity/categories/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 404 and data.error_id == \"ERR_CATEGORY_NOT_FOUND\""
            - "GET /inventory-integrity/stores/{unknown} returns ERR_STORE_NOT_FOUND, /vendors/{unknown} ERR_VENDOR_NOT_FOUND, /counter-firms/{unknown} ERR_COUNTER_FIRM_NOT_FOUND and /items/{unknown} ERR_ITEM_NOT_FOUND, each 404"
            - "GET /inventory-integrity/stock-positions/{unknown} returns ERR_STOCK_POSITION_NOT_FOUND, /tag-batches/{unknown} ERR_TAG_BATCH_NOT_FOUND, /count-schedules/{unknown} ERR_COUNT_SCHEDULE_NOT_FOUND, /count-tasks/{unknown} ERR_COUNT_TASK_NOT_FOUND and /count-lines/{unknown} ERR_COUNT_LINE_NOT_FOUND"
            - "GET /inventory-integrity/variance-investigations/{unknown} returns ERR_INVESTIGATION_NOT_FOUND, /adjustments/{unknown} ERR_ADJUSTMENT_NOT_FOUND, /shrink-periods/{unknown} ERR_SHRINK_PERIOD_NOT_FOUND, /physical-inventories/{unknown} ERR_PHYSICAL_INVENTORY_NOT_FOUND and /physical-inventory-lines/{unknown} ERR_PHYSICAL_INVENTORY_LINE_NOT_FOUND"
            - "POST /inventory-integrity/items with an unknown category_id returns 404 ERR_CATEGORY_NOT_FOUND from the priority-12 body check, and with a known category but unknown primary_vendor_id returns ERR_VENDOR_NOT_FOUND — body keys are resolved in the §1.5 input order"

