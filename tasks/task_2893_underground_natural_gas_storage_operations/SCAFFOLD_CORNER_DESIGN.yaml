            - "${e3} == ERR_CONTRACT_RIGHTS_EXCEEDED with HTTP 422 (200000 > max_daily_injection_dth 100000)"
            - "the fourth create returns HTTP 201 with Nomination.${n1}.nominated_volume_dth == 100000 (the daily right is inclusive), status DRAFT, revision_round 0"
