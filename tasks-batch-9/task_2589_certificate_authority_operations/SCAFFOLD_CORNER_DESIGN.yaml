      - name: issuance_requires_the_partition_to_be_operational
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: issuance_gated_on_hsm_partition_state_not_on_the_ceremony
          rationale: "The §1.8 cross_entity_state_dependency instance already drives the guarded READY_TO_ISSUE -> ISSUED transition with an ATTESTED, unexpired ceremony whose partition was quarantined, and asserts ERR_PARTITION_QUARANTINED rather than any ceremony-level error; a §1.9 duplicate would replay the same setup and the same assertion."

      - name: certificate_lifecycle_and_revocation_dimensions_advance_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: certificate_parallel_lifecycle_and_revocation_dimensions
          rationale: "The §1.8 non_linear_state_machine instance already walks the two orthogonal Certificate dimensions (PREISSUANCE/ISSUED/EXPIRED against NONE/REVOCATION_PENDING/REVOKED) and pins the combined states after activation, revocation request and the expiry sweep, which is exactly the parallel-shape claim."

      - name: attestation_revocation_cascades_down_to_every_certificate_of_the_partition
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: attestation_repudiation_four_hop_cascade
          rationale: "The §1.8 transitive_cascade instance already asserts the full depth-4 chain from revoke-attestation through partition quarantine to every non-terminal certificate of the partition moving to REVOCATION_PENDING with a SYSTEM_CASCADE revocation request, including the ordering of the affected certificates."

      - name: invalidating_an_authorization_only_touches_requests_that_consumed_it
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: dcv_reuse_count_conservation_on_authorization_invalidation
          rationale: "The §1.8 compensating_invariant instance already drives invalidate against an authorization consumed by one cleared request and not by another, and asserts that only the consuming request is affected while reuse_count and invalidation_count reconcile - the conditional-cascade claim in full."

  - section: calculations
    instances:
      - name: charge_volume_band_is_keyed_on_the_pre_discount_subtotal_at_the_49999_50000_edge
        claim_type: tiered_pricing
        grounds:
          - calculations.issuance_charge_settlement.constants.VOLUME_BANDS
          - calculations.issuance_charge_settlement.formula.step_3
          - entities.CertificateRequest.fields.projected_charge_cents
          - endpoints[POST /ca/certificate-requests/{id}/clear-validation]
        distinguishing_aspect: "The band lookup uses the pre-discount subtotal: a subtotal of 49999 sits in the 0.00 band and is charged in full, while a subtotal of exactly 50000 (25000 x 2 domains) enters the 0.10 band and is charged 45000 - and 45000 is not re-banded into the 0.00 band afterwards."
        test_recipe:
          setup:
            - "Two ACTIVE DV profiles (base_fee_cents 49999 and 25000) and one subscriber with validated DNS_TXT authorizations for each profile/domain pair."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
