              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { c2p_id: $.data.id }
            - &c_course2p_start
              call: "POST /courses/${c2p_id}/design-actions"
              payload: { action: "START_DESIGN" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
          trigger:
            - call: "POST /courses/${c2p_id}/design-actions"
              payload: { action: "SUBMIT_FOR_FACULTY_REVIEW" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { err5_id: $.data.error_id }
            - *c_course_start
            - *c_course_submit
            - &c_course2p_submit
              call: "POST /courses/${c2p_id}/design-actions"
              payload: { action: "SUBMIT_FOR_FACULTY_REVIEW" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
          assert:
            - "first response status == 409"
            - "${err5_id} == 'ERR_COURSE_INVALID_DESIGN_STATE'"
            - "Course.${c1_id}.design_status == FACULTY_REVIEW"
            - "Course.${c2p_id}.design_status == FACULTY_REVIEW"
            - "Course.${c2p_id}.prerequisite_course_id == ${c1_id}"

  - rule_id: resource_temporal_overlap
    instances:
