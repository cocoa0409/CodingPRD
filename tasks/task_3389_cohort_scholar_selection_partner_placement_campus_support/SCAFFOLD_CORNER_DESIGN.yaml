            - { call: "GET /api/partner-colleges/${coll}/agreements", as: ProgramAdmin }
          assert:
            - "HTTP 412 with error_id == ERR_STALE_VERSION (captured ${err}): ${v1} is stale because A's creation bumped the college to version 2"
