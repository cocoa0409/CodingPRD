  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors", "ERR_UNAUTHENTICATED"]
        distinguishing_aspect: "A call without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/programs", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401 and error_id == ERR_UNAUTHENTICATED (no role headers sent)"

      - name: scheduler_approve_invoice_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors", "ERR_FORBIDDEN"]
        distinguishing_aspect: "Authorization precedes existence: Scheduler calling the ProgramManager-only approve endpoint gets 403 ERR_FORBIDDEN even for a non-existent invoice id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/invoices/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve", payload: {}, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN (not 404 — priority 2 beats priority 4)"

      - name: contractor_mismatch_on_complete
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors", "ERR_CONTRACTOR_MISMATCH"]
        distinguishing_aspect: "Entity-backed ownership: a FieldContractor whose X-User-ID is a DIFFERENT contractor's id cannot complete the appointment (403 ERR_CONTRACTOR_MISMATCH)."
        test_recipe:
          setup: ["contractors C1 (owns the work order) and C2; appointment BOOKED under C1"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/contractors", payload: { program_id: "${prog}", name: "AquaWorks", crew_capacity_per_window: 2, unit_price_cents: 18500 }, as: ProgramManager, captures: { contr1: $.data.id } }
            - { call: "POST /api/contractors", payload: { program_id: "${prog}", name: "HydroPros", crew_capacity_per_window: 2, unit_price_cents: 19000 }, as: ProgramManager, captures: { contr2: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-0019", service_address: "19 Test Way", meter_location: "OUTSIDE", customer_name: "Joy", customer_phone: "555-0019", avg_daily_usage_ccf: 1.5, last_billed_read_value: 500, last_billed_read_at: "2026-04-01T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-0019", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm: $.data.id } }
            - { call: "POST /api/meters/${oldm}/install", payload: { service_account_id: "${acct}", initial_read_value: 500, installed_at: "2026-04-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id, wo_v: $.data.version } }
            - { call: "POST /api/work-orders/${wo}/assign", payload: { contractor_id: "${contr1}", expected_work_order_version: "${wo_v}" }, as: Scheduler }
            - { call: "POST /api/notifications", payload: { work_order_id: "${wo}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notif: $.data.id } }
            - { call: "POST /api/notifications/${notif}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-05-02T10:00:00Z" }, as: Scheduler }
            - { call: "GET /api/work-orders/${wo}", payload: {}, as: Scheduler, captures: { wo_v3: $.data.version } }
            - { call: "POST /api/appointments", payload: { work_order_id: "${wo}", slot_date: "2026-05-06", window: "AM", expected_work_order_version: "${wo_v3}" }, as: Scheduler, captures: { appt: $.data.id } }
          trigger:
            - { call: "POST /api/appointments/${appt}/complete", payload: {}, as: FieldContractor, as_user_id: "${contr2}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 and error_id == ERR_CONTRACTOR_MISMATCH (C2 does not own the appointment)"
            - "Appointment.${appt}.status == BOOKED (unchanged)"

      - name: cross_program_assign_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=22]", "errors", "ERR_CROSS_PROGRAM_REFERENCE"]
        distinguishing_aspect: "Assigning a contractor onboarded to program A to a work order in program B's wave fails with ERR_CROSS_PROGRAM_REFERENCE."
        test_recipe:
          setup: ["programs A and B both ACTIVE; contractor in A; wave + work order in B"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-A", fiscal_year: "FY2027", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { progA: $.data.id } }
            - { call: "POST /api/programs/${progA}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/programs", payload: { name: "AMI-B", fiscal_year: "FY2028", budget_total_cents: 1000000, target_meter_count: 100, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000 }, as: ProgramManager, captures: { progB: $.data.id } }
            - { call: "POST /api/programs/${progB}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/contractors", payload: { program_id: "${progA}", name: "AquaWorks", crew_capacity_per_window: 2, unit_price_cents: 18500 }, as: ProgramManager, captures: { contr: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${progB}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { waveB: $.data.id } }
            - { call: "POST /api/waves/${waveB}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-0020", service_address: "20 Test Way", meter_location: "OUTSIDE", customer_name: "Kit", customer_phone: "555-0020", avg_daily_usage_ccf: 1.5, last_billed_read_value: 500, last_billed_read_at: "2026-04-01T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-0020", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm: $.data.id } }
            - { call: "POST /api/meters/${oldm}/install", payload: { service_account_id: "${acct}", initial_read_value: 500, installed_at: "2026-04-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${waveB}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id, wo_v: $.data.version } }
          trigger:
            - { call: "POST /api/work-orders/${wo}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${wo_v}" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CROSS_PROGRAM_REFERENCE (HTTP 422)"
            - "WorkOrder.${wo}.contractor_id == null (unchanged)"

      - name: swap_reading_sequence_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors", "ERR_READING_SEQUENCE_INVALID"]
        distinguishing_aspect: "Two arms on the same endpoint: final_read_value 900 < last_billed 1000 is rejected; initial_read_value 2 > 1 (factory max) is rejected; the work order is unchanged after both."
