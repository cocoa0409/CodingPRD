# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Net Metering Interconnection Application Processing
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: e_program_creation_defaults
        claim_type: creation
        grounds: [entities.Program]
        distinguishing_aspect: "Program creation applies system defaults: status OPEN, zeroed computed capacity ledger, version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P1", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
          trigger:
            - { call: "GET /programs/${prog}", as: ProgramAdministrator }
          assert:
            - "Program.${prog}.program_status == OPEN and version == 1"
            - "Program.${prog}.interconnected_watts == 0 and reserved_watts == 0 and queued_count == 0"
            - "Program.${prog}.available_capacity_watts == 1000000 (equals aggregate_cap_watts at creation)"

      - name: e_account_creation_defaults
        claim_type: defaults
        grounds: [entities.ServiceAccount]
        distinguishing_aspect: "ServiceAccount creation initializes both parallel state dimensions and zeroed ledger projections."
        test_recipe:
          setup: ["Feeder and transformer exist; customer exists."]
          setup_api_calls:
            - { call: "POST /feeders", payload: { feeder_code: "F-D", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-D", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "D Cust", email: "d@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-D", service_class: RESIDENTIAL, prior_annual_usage_wh: 12000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
          assert:
            - "ServiceAccount.${acct}.account_status == ACTIVE and metering_status == STANDARD"
            - "ServiceAccount.${acct}.credit_balance_cents == 0 and banked_wh == 0 and meter_serial == null"
            - "ServiceAccount.${acct}.version == 1"

      - name: e_application_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.InterconnectionApplication, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input system_size_watts_ac is a schema rejection (400) before any state or business check."
        test_recipe:
          setup: ["Program, account exist."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P2", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /feeders", payload: { feeder_code: "F-RF", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-RF", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "RF Cust", email: "rf@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-RF", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
          trigger:
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: e_application_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.InterconnectionApplication.fields.technology, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "technology outside {SOLAR_PV, WIND, FUEL_CELL} is rejected at schema validation."
        test_recipe:
          setup: ["Program and account exist."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P3", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /feeders", payload: { feeder_code: "F-EN", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-EN", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "EN Cust", email: "en@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-EN", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
          trigger:
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: BIOMASS, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: e_get_application_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Unknown path id yields 404 ERR_NOT_FOUND with the standard error envelope, even while other applications exist."
        test_recipe:
          setup: ["One application exists (so the collection is non-empty); the probed id was never issued."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P5", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /feeders", payload: { feeder_code: "F-NF", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-NF", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "NF Cust", email: "nf@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-NF", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}" }
          trigger:
            - { call: "GET /applications/00000000-0000-0000-0000-000000000000", as: ProgramAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404"
            - "Error envelope carries meta.api_request_id and data.message"

      - name: e_tariff_open_ended_default
        claim_type: defaults
        grounds: [entities.TariffSchedule.fields.effective_to]
        distinguishing_aspect: "Omitting effective_to stores an open-ended window (null), which then satisfies effectivity checks at any future instant."
        test_recipe:
          setup: ["Program exists."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P4", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "T-OPEN", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator, captures: { t: $.data.id } }
          assert:
            - "TariffSchedule.${t}.effective_to == null"
            - "HTTP 201"

      - name: e_ledger_entry_has_no_version_field
        claim_type: immutability
        grounds: [entities.CreditLedgerEntry]
        distinguishing_aspect: "CreditLedgerEntry is append-only (common_fields: false): the read payload exposes id and created_at but no version or updated_at."
        test_recipe:
          setup:
            - "MONETARY_CREDIT program; account with 10000 W application in PTO_GRANTED (standard happy path); one reading posted (import 0, export 100000 Wh, period 2026-08-01 -> 2026-09-01) producing one EXPORT_SURPLUS_CREDIT entry."
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "LED", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "LED-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-LED", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-LED", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Led Cust", email: "led@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-LED", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc2: $.data.id } }
            - { call: "POST /documents/${doc1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app}" }, as: DistributionEngineer }
            - { call: "POST /meter-exchanges", payload: { application_id: "${app}", crew_id: "crew-1", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: MeterTechnician, captures: { ex: $.data.id } }
            - { call: "POST /meter-exchanges/${ex}/complete", payload: { installed_meter_serial: "MTR-1" }, as: MeterTechnician, as_user_id: "tech-1" }
            - { call: "POST /inspections", payload: { application_id: "${app}", scheduled_date: "2026-08-05T09:00:00Z" }, as: Applicant, as_user_id: "${cust}", captures: { insp: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /inspections/${insp}/record-result", payload: { outcome: PASSED, occurred_at: "2026-08-05T10:00:00Z" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /applications/${app}/grant-pto", payload: {}, as: InterconnectionCoordinator }
            - { call: "GET /service-accounts/${acct}", as: ProgramAdministrator, captures: { acct_v: $.data.version } }
          trigger:
            - { call: "POST /meter-readings", payload: { service_account_id: "${acct}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", import_wh: 0, export_wh: 100000, expected_account_version: "${acct_v}" }, as: MeterTechnician }
          assert:
            - "GET /ledger-entries?service_account_id=${acct} returns exactly 1 entry whose payload contains id, created_at, entry_type, amount_cents, quantity_wh and NO version or updated_at keys"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: sm_document_review_from_uploaded_only
        claim_type: invalid_transition
        grounds: [state_machines.ApplicationDocument.UPLOADED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reviewing an already-ACCEPTED document is a terminal-state violation (409), not a schema error."
        test_recipe:
          setup: ["Application in DRAFT with one document already ACCEPTED."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "SD", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /feeders", payload: { feeder_code: "F-SD", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-SD", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "SD Cust", email: "sd@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-SD", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc1: $.data.id } }
            - { call: "POST /documents/${doc1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
          trigger:
            - { call: "POST /documents/${doc1}/review", payload: { outcome: REJECTED, review_note: "second look" }, as: InterconnectionCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with HTTP 409"
            - "ApplicationDocument.${doc1}.review_status == ACCEPTED (unchanged)"

      - name: sm_completeness_decision_on_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InterconnectionApplication.DRAFT_to_PENDING_COMPLETENESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completeness decision requires PENDING_COMPLETENESS; a DRAFT application has not been submitted."
        test_recipe:
          setup: ["Application in DRAFT (never submitted)."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "SC", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /feeders", payload: { feeder_code: "F-SC", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-SC", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "SC Cust", email: "sc@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-SC", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /applications/${app}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with HTTP 409"

      - name: sm_withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.InterconnectionApplication]
        distinguishing_aspect: "A WITHDRAWN application accepts no further transitions; the second withdraw is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Application in DRAFT, then withdrawn."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "SW", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /feeders", payload: { feeder_code: "F-SW", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-SW", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "SW Cust", email: "sw@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-SW", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app: $.data.id } }
            - { call: "POST /applications/${app}/withdraw", payload: {}, as: Applicant, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /applications/${app}/withdraw", payload: {}, as: Applicant, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with HTTP 409"
            - "InterconnectionApplication.${app}.application_status == WITHDRAWN"

      - name: sm_pto_granted_blocks_withdrawal
        claim_type: invalid_transition
        grounds: [state_machines.InterconnectionApplication]
        distinguishing_aspect: "Withdrawal is enumerated from pre-PTO states only; from PTO_GRANTED it is rejected even though PTO_GRANTED is not a terminal state."
        test_recipe:
          setup: ["Application in PTO_GRANTED via the standard happy path."]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "SP", aggregate_cap_watts: 1000000, metering_variant: MONETARY_CREDIT, true_up_mode: AVOIDED_COST_PAYOUT, true_up_month: 4, screening_basis: COMMITTED }, as: ProgramAdministrator, captures: { prog: $.data.id } }
            - { call: "POST /tariff-schedules", payload: { program_id: "${prog}", schedule_code: "SP-2026", effective_from: "2026-01-01T00:00:00Z", import_rate_millicents_per_kwh: 30000, export_rate_millicents_per_kwh: 12000, net_surplus_rate_millicents_per_kwh: 4500 }, as: ProgramAdministrator }
            - { call: "POST /feeders", payload: { feeder_code: "F-SP", peak_load_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { feed: $.data.id } }
            - { call: "POST /service-transformers", payload: { feeder_id: "${feed}", transformer_code: "T-SP", nameplate_watts: 10000000, pre_existing_der_watts: 0 }, as: ProgramAdministrator, captures: { tx: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "SP Cust", email: "sp@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-SP", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc2: $.data.id } }
            - { call: "POST /documents/${doc1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app}" }, as: DistributionEngineer }
            - { call: "POST /meter-exchanges", payload: { application_id: "${app}", crew_id: "crew-1", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: MeterTechnician, captures: { ex: $.data.id } }
            - { call: "POST /meter-exchanges/${ex}/complete", payload: { installed_meter_serial: "MTR-1" }, as: MeterTechnician, as_user_id: "tech-1" }
            - { call: "POST /inspections", payload: { application_id: "${app}", scheduled_date: "2026-08-05T09:00:00Z" }, as: Applicant, as_user_id: "${cust}", captures: { insp: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /inspections/${insp}/record-result", payload: { outcome: PASSED, occurred_at: "2026-08-05T10:00:00Z" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /applications/${app}/grant-pto", payload: {}, as: InterconnectionCoordinator }
          trigger:
