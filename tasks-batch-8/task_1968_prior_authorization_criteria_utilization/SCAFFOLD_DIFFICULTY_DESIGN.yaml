  # ------------------------------------------------------------- Rule 3 -------
  - rule_id: non_linear_state_machine
    instances:
      - name: request_escalation_send_back_cycle
        grounds:
          - state_machines.PriorAuthRequest.PENDED_REVIEW_to_ESCALATED_MD
          - state_machines.PriorAuthRequest.ESCALATED_MD_to_PENDED_REVIEW
          - state_machines.PriorAuthRequest.PENDED_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Entity: PriorAuthRequest. The machine contains a true cycle
          PENDED_REVIEW -> ESCALATED_MD -> PENDED_REVIEW (MD send-back), and
          the cycle is observable: escalated_by_user_id is set on escalation
          and cleared to null on send-back before final reviewer approval.
        test_recipe:
          setup:
            - "Active criteria set + provider; one request pended (FAX, incomplete docs)"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000006", name: "Cycle Provider" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { req: $.data.id, s0: $.data.status } }
          trigger:
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "ESCALATE" }, as: ClinicalReviewer, as_user_id: "u-rev-1", captures: { s1: $.data.status, esc_by: $.data.escalated_by_user_id } }
            - { call: "POST /um/prior-auth-requests/${req}/md-decision", payload: { decision: "SEND_BACK" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { s2: $.data.status, esc_after: $.data.escalated_by_user_id } }
            - { call: "POST /um/prior-auth-requests/${req}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1", captures: { s3: $.data.status } }
            - { call: "GET /um/determinations", payload: { request_id: "${req}" }, as: UMAdmin, captures: { det_role: "$.data[0].decided_by_role", det_outcome: "$.data[0].outcome" } }
          assert:
            - "s0 == PENDED_REVIEW"
            - "s1 == ESCALATED_MD and esc_by == u-rev-1"
            - "s2 == PENDED_REVIEW and esc_after == null (send-back clears the escalation marker)"
            - "s3 == APPROVED (the cycle returns to a state from which approval is again reachable)"
            - "det_role == CLINICAL_REVIEWER and det_outcome == APPROVED"

      - name: provider_gold_card_suspend_reinstate_cycle
        grounds:
          - state_machines.Provider.NOT_GOLD_CARDED_to_GOLD_CARDED
          - state_machines.Provider.GOLD_CARDED_to_SUSPENDED
          - state_machines.Provider.SUSPENDED_to_GOLD_CARDED
          - calculations.gold_card_eligibility
        distinguishing_aspect: |
          Entity: Provider (different entity than the request cycle). The
          gold-card machine cycles NOT_GOLD_CARDED -> GOLD_CARDED -> SUSPENDED
          -> GOLD_CARDED: the suspension hop is system-triggered by a stats
          threshold crossing (10/12 = 0.8333 < 0.90), and reinstatement becomes
          possible only after the two denials are voided (10/10 = 1.0000).
