  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_slot_create
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_CAMPAIGN_NOT_BOOKABLE]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the request violates both
          (campaign CANCELED; slot estimated cost 330 would exceed budget 100) and
          the state-tier error ERR_CAMPAIGN_NOT_BOOKABLE must win over
          ERR_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "approved campaign with budget_cents=100, then canceled (no slots yet, so cancel is legal); reel ASSEMBLING on an in-flight showtime"
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
