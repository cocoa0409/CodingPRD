        claim_type: priority_ordering
        grounds:
          - validations[priority=15]
          - validations[priority=28]
          - errors[ERR_PRODUCTION_STAGE_NOT_READY]
        excluded_because:
          difficulty_instance: validation_priority_conflict / publication_stage_gate_outranks_unpaid_apc_invoice
          rationale: "That §1.8 instance already stages a publication attempt that violates rule 15 and rule 28 simultaneously and pins ERR_PRODUCTION_STAGE_NOT_READY as the reported error."

      - name: reviewer_window_capacity_aggregate_over_overlapping_invitations
        claim_type: aggregate
        grounds:
          - validations[priority=22]
