            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_id}", homeowner_name: "H MX", property_postal_code: "30018", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${cmx_id}", captures: { reg_id: $.data.id } }
