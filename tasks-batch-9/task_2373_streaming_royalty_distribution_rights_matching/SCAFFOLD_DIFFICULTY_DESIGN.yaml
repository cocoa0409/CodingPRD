              payload: { work_id: "${w1}", claimant_id: "${lbl0}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["WORLD"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${w1v}" }
              as: RightsHolderUser
              as_user_id: "${lbl0}"
              captures: { err2: "$.data.error_id" }
          assert:
            - "Both defects present at clock 2026-08-30T00:00:00Z: HTTP 422 with error_id ERR_CLAIM_WINDOW_CLOSED (priority 17), NOT ERR_COLLECTIVE_NOT_ELIGIBLE."
            - "Clock rewound to exactly claim_window_closes_at (2026-08-29T00:00:00Z, inclusive bound satisfied) with the identical payload: HTTP 422 with error_id ERR_COLLECTIVE_NOT_ELIGIBLE (priority 20)."
            - "No RightsRegistration row was created by either call: GET /royalties/rights-registrations filtered by work_id returns an empty list, and the Work's version is unchanged."

      - name: rate_floor_ratchet_beats_schedule_overlap
        grounds:
          - validations.priority_16
          - validations.priority_23
          - errors.ERR_STATUTORY_RATE_FLOOR_BREACH
          - errors.ERR_RATE_SCHEDULE_OVERLAP
        distinguishing_aspect: |
          A promulgation that both lowers the statutory floor (priority 16, business_safety) and
          collides with the incumbent's closed interval (priority 23, business_constraint) must
          return the floor error; and supersede_incumbent == true, which cures the overlap, does
          NOT cure the floor breach — so the same request still returns the priority-16 error while
          a floor-preserving schedule with the same flag succeeds.
        test_recipe:
          setup:
            - "One EFFECTIVE (GB, INDIVIDUAL) schedule with statutory_floor_per_play_millicents 100 over the closed window 2026-01-01..2026-12-31."
            - "Two PROPOSED replacements for the same key over an intersecting window: one lowering the floor to 80, one preserving it at 100."
          setup_api_calls:
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-01", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { rs1: "$.data.id" }
            - call: "POST /royalties/rate-schedules/${rs1}/promulgate"
              payload: {}
              as: RegulatoryOfficer
              captures: { rs1_status: "$.data.status" }
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-LOWER", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7500, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 80, effective_from: "2026-07-01", effective_to: "2027-06-30" }
              as: RegulatoryOfficer
              captures: { rs_low: "$.data.id" }
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-KEEP", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7500, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-07-01", effective_to: "2027-06-30" }
              as: RegulatoryOfficer
              captures: { rs_keep: "$.data.id" }
          trigger:
            - name: promulgate_with_both_defects_returns_floor_error
              call: "POST /royalties/rate-schedules/${rs_low}/promulgate"
              payload: {}
              as: RegulatoryOfficer
              captures: { err: "$.data.error_id" }
            - name: supersede_flag_does_not_cure_floor_breach
              call: "POST /royalties/rate-schedules/${rs_low}/promulgate"
              payload: { supersede_incumbent: true }
              as: RegulatoryOfficer
              captures: { err2: "$.data.error_id" }
            - name: promulgate_with_only_overlap_defect_returns_overlap_error
              call: "POST /royalties/rate-schedules/${rs_keep}/promulgate"
              payload: {}
              as: RegulatoryOfficer
              captures: { err3: "$.data.error_id" }
            - call: "POST /royalties/rate-schedules/${rs_keep}/promulgate"
              payload: { supersede_incumbent: true }
              as: RegulatoryOfficer
              captures: { keep_status: "$.data.status" }
            - call: "GET /royalties/rate-schedules/${rs1}"
              payload: {}
              as: RegulatoryOfficer
              captures: { rs1_after: "$.data.status" }
            - call: "GET /royalties/rate-schedules/${rs_low}"
              payload: {}
              as: RegulatoryOfficer
              captures: { low_after: "$.data.status" }
          assert:
            - "Floor-lowering schedule with both defects: HTTP 422 with error_id ERR_STATUTORY_RATE_FLOOR_BREACH (priority 16), NOT ERR_RATE_SCHEDULE_OVERLAP."
            - "Same schedule with supersede_incumbent == true: STILL HTTP 422 ERR_STATUTORY_RATE_FLOOR_BREACH — the flag removes the priority-23 defect but cannot remove the priority-16 defect."
            - "Floor-preserving schedule without the flag: HTTP 409 with error_id ERR_RATE_SCHEDULE_OVERLAP (priority 23)."
            - "Floor-preserving schedule with the flag: status EFFECTIVE, and the incumbent moves to SUPERSEDED."
            - "The floor-lowering schedule is still PROPOSED after both refusals — it never became EFFECTIVE."

  - rule_id: boundary_precision_check
    instances:
      - name: match_confidence_at_and_below_auto_threshold
        grounds:
          - calculations.usage_line_matching
          - global_constants.AUTO_MATCH_MIN_CONFIDENCE_BPS
          - global_constants.CLAIM_MATCH_MIN_CONFIDENCE_BPS
        distinguishing_aspect: |
          The confidence ladder yields only 10000, 7500 and 5000, and both thresholds are
          inclusive: 7500 exactly equals AUTO_MATCH_MIN_CONFIDENCE_BPS and must AUTO_MATCH, while
          the next value down (5000) must not — yet that same 5000 exactly equals
          CLAIM_MATCH_MIN_CONFIDENCE_BPS and must claim-match, so one single value sits both
          below one inclusive bound and exactly on another.
        test_recipe:
          setup:
            - "Catalogue: RECORDING 'Midnight Ledger' by 'The Reconcilers' (ISRC GBABC2600001) and RECORDING 'Neon Ledger' by 'Halfsleep' (ISRC GBABC2600002)."
            - "One batch with three GB/INDIVIDUAL lines exercising each rung of the ladder: exact ISRC, normalized title + normalized artist with no ISRC, and normalized title only."
            - "A LABEL holder with direct_deal_rate_bps 800 that will later claim the 'Neon Ledger' recording."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { lbl: "$.data.id" }
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600002", title: "Neon Ledger", artist_credit: "Halfsleep" }
              as: RightsOpsAnalyst
              captures: { w2: "$.data.id" }
            - call: "POST /royalties/usage-batches"
              payload: { period_id: "${per}", source_label: "UK client feed" }
              as: RightsOpsAnalyst
              captures: { ub: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_isrc: "GBABC2600001", reported_title: "Wrong Title Entirely", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 300000 }
              as: RightsOpsAnalyst
              captures: { u1: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_title: "  MIDNIGHT   LEDGER!! ", reported_artist: "the reconcilers", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 150000 }
              as: RightsOpsAnalyst
              captures: { u2: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_title: "Neon Ledger", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 50000 }
              as: RightsOpsAnalyst
              captures: { u3: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/seal"
              payload: {}
              as: RightsOpsAnalyst
            - call: "POST /royalties/usage-batches/${ub}/match"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-fuzzy-1"
              captures: { batch_status: "$.data.status", matched: "$.data.matched_play_count", unmatched: "$.data.unmatched_play_count" }
          trigger:
            - call: "GET /royalties/usage-lines/${u1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { c1: "$.data.match_confidence_bps", s1: "$.data.match_status", k1: "$.data.work_id" }
            - call: "GET /royalties/usage-lines/${u2}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { c2: "$.data.match_confidence_bps", s2: "$.data.match_status", k2: "$.data.work_id" }
            - call: "GET /royalties/usage-lines/${u3}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { c3: "$.data.match_confidence_bps", s3: "$.data.match_status", k3: "$.data.work_id" }
            - call: "GET /royalties/works/${w1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { prov: "$.data.provisional_match_by_user_id" }
            - call: "GET /royalties/works/${w2}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { w2v: "$.data.version", w2_prov: "$.data.provisional_match_by_user_id" }
            - call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w2}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["WORLD"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${w2v}" }
              as: RightsHolderUser
