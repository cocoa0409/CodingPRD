          assert:
            - "Pre-trigger baseline: CaseAssignment ${asg_lead_id}.status == 'PROPOSED' with supervision_source == 'AUTO_SELECTED' and supervision_link_id == ${asg_sup_id}; Representative ${acc_rep_id}.active_case_load == 0; Representative ${sup_s_id}.active_case_load == 0 and supervisee_count == 0; sum(active_case_load) == 0 == count of ACTIVE LEAD/CO_COUNSEL assignments."
            - "trigger step 1 returns HTTP 200: CaseAssignment ${asg_lead_id}.status == 'ACTIVE' with activated_at_utc == '2026-09-01T00:00:00.000Z'; Representative ${acc_rep_id}.active_case_load == 1; Representative ${sup_s_id}.supervisee_count == 1 and its active_case_load is STILL 0 because a SUPERVISOR row never counts toward active_case_load."
            - "After step 1 both identities hold: sum(active_case_load) over all representatives == 1 == count(ACTIVE assignments with role_on_case IN {LEAD, CO_COUNSEL}); sum(supervisee_count) == 1 == count(ACTIVE assignments with non-null supervision_link_id)."
            - "After step 1 CaseMatter ${matter_id}.representation_status == 'SUPERVISED_STAFFED' (the ACTIVE lead is a supervision-required representative)."
            - "trigger step 2 returns HTTP 200: CaseAssignment ${asg_lead_id}.status == 'RELEASED' with release_reason_code 'CASELOAD_REBALANCE' and released_at_utc == '2026-09-01T00:00:00.000Z'."
            - "The compensation is exact: Representative ${acc_rep_id}.active_case_load == 0 and Representative ${sup_s_id}.supervisee_count == 0 - both back to their pre-ACTIVATE values - while ${sup_s_id}.active_case_load is still 0."
            - "After step 2 both sums are 0 and match their counts: no ACTIVE LEAD/CO_COUNSEL row exists, and no ACTIVE row carries a non-null supervision_link_id. CaseAssignment ${asg_sup_id} is STILL 'ACTIVE' (releasing a supervisee never touches the supervisor row) and its supervision_link_id is null."
            - "CaseMatter ${matter_id}.representation_status == 'COVERAGE_GAP' because the released row was the only ACTIVE LEAD; no ERR_INVARIANT_VIOLATION was raised by either step."

