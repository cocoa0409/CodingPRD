      - name: a_second_appeal_on_the_same_determination_is_refused
        claim_type: Violation → Error
        grounds: ["validations[priority=27]", "validations[priority=7]", "errors[ERR_APPEAL_LIMIT_EXCEEDED]", "state_machines.PriorRightsDetermination"]
        distinguishing_aspect: "One appeal per determination: the owner appeals the first issue, the adjudicator revises and re-issues - which a different adjudicator must do, because first_issued_by_user_id is now adjudicator-1 - and the second appeal is refused with ERR_APPEAL_LIMIT_EXCEEDED 409 because appeal_round is 1 and the rule demands strictly below 1. The cycle is legal exactly once, so an implementation that either forbids the first appeal or allows the second is wrong."
        test_recipe:
          setup: ["A conflict with an issued determination, then a full appeal-revise-reissue cycle, the re-issue performed by adjudicator-2."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: "$.data.id" } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "UNDOCUMENTED", narrative: "No recorded instrument located for the duct bank." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: "$.data.id" } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { share_first: "$.data.final_state_share_pct", first_issuer: "$.data.first_issued_by_user_id" } }
            - { call: "POST /uro/prior-rights/${d1}/appeal", payload: { appeal_note: "Recorded easement located in the county archive." }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { appealed_status: "$.data.status", appeal_round: "$.data.appeal_round" } }
            - { call: "POST /uro/prior-rights/${d1}/revise", payload: { claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded easement produced on appeal." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-2", captures: { revised_status: "$.data.status" } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-2" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-2", captures: { share_second: "$.data.final_state_share_pct", status_second: "$.data.status" } }
          trigger:
            - { call: "POST /uro/prior-rights/${d1}/appeal", payload: { appeal_note: "Second appeal on the same determination." }, as: UtilityOwnerRep, as_user_id: "${o1}" }
          assert:
            - "${share_first} == 95 (UNDOCUMENTED claimed against a PRIVATE_EASEMENT facility takes the 15-point unsupported-claim deduction off the 100 base plus the 10-point prior-occupancy credit, clamped at 100)"
            - "${appealed_status} == APPEALED with ${appeal_round} == 1, ${revised_status} == DRAFT, ${status_second} == ISSUED and ${share_second} == 100"
            - "${first_issuer} == adjudicator-1 and the re-issue by adjudicator-1 would have returned 403 ERR_SEGREGATION_OF_DUTIES at priority 7"
            - "HTTP 409 with error_id ERR_APPEAL_LIMIT_EXCEEDED (priority 27; appeal_round 1 is not strictly below 1)"
            - "PriorRightsDetermination.${d1}.status stays ISSUED with appeal_round 1 and final_state_share_pct 100"
            - "UtilityConflict.${c1}.state_share_pct == 100 and Project.${p1} liability reflects the re-issued share, not the first one"

      - name: a_not_to_exceed_one_cent_below_the_loaded_estimate_is_rejected
