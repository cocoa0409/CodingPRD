  - rule_id: non_linear_state_machine
    instances:
      - name: absence_offer_decline_loop_revisits_offer_out_then_exhausts_pool
        grounds:
          - state_machines.AbsenceReport.OFFER_OUT_to_DISPATCH_PENDING
          - state_machines.AbsenceReport.DISPATCH_PENDING_to_OFFER_OUT
          - state_machines.AbsenceReport.DISPATCH_PENDING_to_UNCOVERED_GAP
          - calculations.substitute_selector
          - entities.AbsenceReport.fields.dispatch_attempt_count
          - entities.AbsenceReport.fields.excluded_guard_ids
        distinguishing_aspect: |
          The same trigger (POST .../dispatch) fired from the same state
          (DISPATCH_PENDING) three times produces two different target states:
          OFFER_OUT, OFFER_OUT, then UNCOVERED_GAP. The state field alone does not
          determine the next state — the accumulated excluded_guard_ids set does, and
          each decline leaves dispatch_attempt_count monotonically higher (never
          decremented), so the second visit to OFFER_OUT is not equivalent to the
          first. An implementation that treats the machine as memoryless will either
          re-offer to a guard who already declined or reset the attempt counter.
        test_recipe:
          setup:
            - "School with one WARRANTED intersection and one ACTIVE AM post in Z-NORTH."
            - "Assigned guard Rita covering 2026-09-08 -> 2026-09-18; exactly two eligible substitutes, Sam (Z-NORTH) and Nia (Z-SOUTH)."
