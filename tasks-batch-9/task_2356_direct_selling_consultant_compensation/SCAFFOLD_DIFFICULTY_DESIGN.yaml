              payload: { applicant_email: "pia@ex.test", applicant_full_name: "Pia Retry", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}" }
              as: PlatformAdmin
              captures: { app_p_id: "$.data.id", p_kit_total: "$.data.kit_total_cents", p_identity: "$.data.identity_status", p_attempts: "$.data.identity_attempt_count" }
          trigger:
            - call: "POST /direct-selling/enrollment-applications/${app_p_id}/accept-agreement"
              payload: { agreement_version: "AGR-2026-01" }
              as: Applicant
              as_user_id: "${app_p_id}"
              captures: { s_after_agreement: "$.data.status", agr_status: "$.data.agreement_status", agr_at: "$.data.agreement_accepted_at" }
            - call: "POST /direct-selling/enrollment-applications/${app_p_id}/pay-starter-kit"
