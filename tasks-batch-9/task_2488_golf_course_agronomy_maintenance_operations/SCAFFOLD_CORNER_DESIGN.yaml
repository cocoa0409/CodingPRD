      - name: plan_state_family_errors_are_triggered_by_the_difficulty_suite
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PLAN_STATE_INVALID]
          - errors[ERR_WINDOW_STATE_INVALID]
          - errors[ERR_RUN_STATE_INVALID]
          - errors[ERR_EQUIPMENT_STATE_INVALID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / task_scheduling_depends_on_target_window_state
          rationale: "The four remaining state errors are each triggered in §1.8: ERR_WINDOW_STATE_INVALID by this instance, ERR_PLAN_STATE_INVALID by plan_state_outranks_nitrogen_budget_fiscal, ERR_RUN_STATE_INVALID by water_ledger_and_posture_unwind_exactly_on_run_reversal and ERR_EQUIPMENT_STATE_INVALID by engine_hour_meter_is_conserved_across_a_service."

