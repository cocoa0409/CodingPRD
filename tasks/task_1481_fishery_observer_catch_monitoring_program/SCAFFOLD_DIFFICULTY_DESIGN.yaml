  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: entity A's valid transitions depend
  # on entity B's state, across DIFFERENT entity pairs.
  # Instance 1: CoveragePlan publish/selection-run gated on Fishery.status.
  # Instance 2: Deployment create gated on VesselOperator.payment_standing.
  # Instance 3: EMTrip accept gated on a CoveragePlan of the vessel's fishery
  # in SELECTION_COMPLETED whose period contains the trip dates.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: coverage_plan_publish_gated_on_fishery_active
        grounds:
          - state_machines.CoveragePlan.DRAFT_to_PUBLISHED
          - errors[ERR_FISHERY_NOT_ACTIVE]
          - entities.Fishery.fields.status
        distinguishing_aspect: |
          Entity pair CoveragePlan -> Fishery: the DRAFT->PUBLISHED transition of
          a CoveragePlan is valid only while the parent-scope Fishery (referenced
          by CoveragePlan.fishery_id) is in status ACTIVE; suspending the Fishery
          blocks the plan's transition with ERR_FISHERY_NOT_ACTIVE even though the
          plan row itself is untouched.
        test_recipe:
          setup:
            - "Fishery F created (ACTIVE), coverage_target_pct 0.30"
            - "CoveragePlan P created under F (DRAFT)"
            - "Fishery F suspended via PATCH"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-X1", name: "BSAI Cross 1", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 100, projected_em_effort_days: 0 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "PATCH /observer-program/fisheries/${fish_id}"
              payload: { status: "SUSPENDED" }
              as: ProgramAdmin
          trigger:
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Publish fails with ERR_FISHERY_NOT_ACTIVE (409) because Fishery.${fish_id}.status == SUSPENDED"
            - "CoveragePlan.${plan_id}.status remains DRAFT (no transition occurred)"

