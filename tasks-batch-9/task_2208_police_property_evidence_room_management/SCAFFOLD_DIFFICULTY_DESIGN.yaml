              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { loc_r_v_now: $.data.version, occ_before: $.data.occupied_slots }
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_r_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-09T09:00:00Z", scheduled_end_at: "2026-08-09T17:00:00Z", expected_storage_location_version: "${loc_r_v_now}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /audit-sessions/${sess_id}/start"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
          trigger:
            - call: "POST /audit-sessions/${sess_id}/reconcile"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
            - call: "GET /discrepancies?audit_session_id=${sess_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { disc_id: "$.data[0].id", disc_weight: "$.data[0].weight_contribution" }
            - call: "POST /discrepancies/${disc_id}/investigate"
              payload: {}
              as: PropertyRoomManager
            - call: "POST /discrepancies/${disc_id}/resolve"
              payload: { resolution: "FOUND", resolution_note: "Item located in the adjacent tray after re-sweep" }
              as: PropertyRoomManager
          assert:
            - "Before the reconcile: ${occ_before} == 1 and EvidenceItem.${item_id}.custody_state == 'STORED'"
            - "After the reconcile: StorageLocation.${loc_r_id}.occupied_slots == 0 and EvidenceItem.${item_id}.custody_state == 'MISSING'"
            - "After the reconcile: PropertyRoom.${room_id}.open_discrepancy_count == 1 and ${disc_weight} == 8.25 (5.0 * 1.1 * 1.5, the session's location R-01 being REFRIGERATED)"
            - "After investigate: Discrepancy.${disc_id}.status == 'UNDER_INVESTIGATION' and StorageLocation.${loc_r_id}.occupied_slots is still 0 and PropertyRoom.${room_id}.open_discrepancy_count is still 1"
            - "After the FOUND resolution: StorageLocation.${loc_r_id}.occupied_slots == 1, exactly its pre-reconcile value, and EvidenceItem.${item_id}.custody_state == 'STORED'"
            - "After the FOUND resolution: Discrepancy.${disc_id}.status == 'RESOLVED_FOUND', PropertyRoom.${room_id}.open_discrepancy_count == 0, AuditSession.${sess_id}.risk_index == 0.00"
            - "PropertyRoom.${room_id}.posture == 'RESTRICTED' (the seal is still held) and missing_high_risk_count == 0"
            - "EvidenceItem.${item_id}.disposition_state == 'RETAINED' throughout and storage_location_id == ${occ_after_assign}"

      - name: settle_then_disburse_restores_room_escrow_balance
        grounds:
          - "calculations.room_escrow_balance"
          - "state_machines.DispositionOrder.EXECUTED_to_SETTLED"
          - "state_machines.DispositionOrder.SETTLED_to_DISBURSED"
          - "entities.PropertyRoom.fields.escrow_balance_cents"
          - "entities.DispositionOrder.fields.settlement_status"
        distinguishing_aspect: |
          The conserved quantity is a MONETARY ESCROW BALANCE in integer cents, not a slot count:
          PropertyRoom.escrow_balance_cents must equal the sum of settled_net_proceeds_cents over orders
          whose settlement_status == HELD, so settle (+74175) followed by disburse (-74175) returns the
          balance to 0 while the order's own settled_net_proceeds_cents is retained for audit.
        test_recipe:
          setup:
            - "A GENERAL item appraised at 90000 under case 26-00002, stored in G-01, adjudicated and swept to DISPOSAL_ELIGIBLE at 2026-10-30."
            - "An AUCTION order with reserve 50000 is authorized and executed at 2027-05-01 (273 storage days from intake)."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Unclaimed touring bicycle", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 90000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case2_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case2_id}/adjudicate"
              payload: {}
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /property-rooms/${room_id}/daily-sweep"
              payload: {}
              as: PropertyRoomManager
              captures: { escrow_before: $.data.escrow_balance_cents }
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${item_id}", type: "AUCTION", requested_by_custodian_id: "${tech_id}", reserve_price_cents: 50000 }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { order_id: $.data.id }
            - call: "POST /disposition-orders/${order_id}/authorize"
              payload: { court_order_number: "CO-2026-1199" }
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /disposition-orders/${order_id}/execute"
              payload: { executed_by_custodian_id: "${tech2_id}", witness_custodian_id: "${inv_id}" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /disposition-orders/${order_id}/settle"
              payload: { gross_sale_cents: 90000 }
              as: PropertyRoomManager
            - call: "GET /property-rooms/${room_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { escrow_held: $.data.escrow_balance_cents }
            - call: "POST /disposition-orders/${order_id}/disburse"
              payload: { payee_reference: "TREAS-2027-0088" }
              as: PropertyRoomManager
              captures: { order_status: $.data.status }
            - call: "GET /property-rooms/${room_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { escrow_after: $.data.escrow_balance_cents }
          assert:
            - "${escrow_before} == 0 before settlement"
            - "${escrow_held} == 74175 while DispositionOrder.${order_id}.settlement_status == 'HELD'"
            - "${escrow_after} == 0, exactly the pre-settlement value, once ${order_status} == 'DISBURSED'"
            - "DispositionOrder.${order_id}.settlement_status == 'DISBURSED' and payee_reference == 'TREAS-2027-0088'"
            - "DispositionOrder.${order_id}.settled_net_proceeds_cents is still 74175 after disbursement (the audit figure is retained, only the escrow balance is released)"
            - "A second disburse on the same order returns HTTP 409 ERR_NO_PROCEEDS_HELD and leaves PropertyRoom.${room_id}.escrow_balance_cents == 0"
