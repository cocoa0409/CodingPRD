              as: FinanceController
              as_user_id: ""
              captures: { err_id2: "$.data.error_id" }
          assert:
            - "trigger[0]: 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "trigger[1]: 401 with data.error_id == ERR_UNAUTHENTICATED, and no FiscalPeriod row is created"

  - section: Cross-Cutting Complexity Layers
    instances:

      - name: occ_disclosure_create_with_a_stale_funder_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[disclosure-create-stale-funder]
          - errors[ERR_STALE_FUNDER_VERSION]
        distinguishing_aspect: >-
          The version captured when the funder was created is already stale once the independence
          clearance has been recorded, so a disclosure quoting it is refused with 412 while the
          post-clearance version succeeds - the guard is on the parent Funder, not on the
          disclosure being created.
        test_recipe:
          setup: "One coverage area and one funder whose version is captured before and after the independence clearance."
          setup_api_calls:
            - call: "POST /coverage-areas"
              payload: { area_code: "CLIMATE", name: "Climate", editorial_lead_user_id: "user-ed-2" }
              as: EditorialDirector
              as_user_id: user-ed-1
              captures: { ca_id: "$.data.id" }
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f_id: "$.data.id", f_v0: "$.data.version" }
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "SELF_ATTESTED" }
              as: EditorialDirector
              as_user_id: user-ed-1
              captures: { f_v1: "$.data.version" }
          trigger:
            - call: "POST /firewall-disclosures"
              payload: { funder_id: "${f_id}", coverage_area_id: "${ca_id}", disclosure_text: "Ironwood funds climate coverage; the climate desk retains editorial control.", expected_funder_version: "${f_v0}" }
              as: EditorialDirector
              as_user_id: user-ed-1
              captures: { err_id: "$.data.error_id" }
            - call: "POST /firewall-disclosures"
              payload: { funder_id: "${f_id}", coverage_area_id: "${ca_id}", disclosure_text: "Ironwood funds climate coverage; the climate desk retains editorial control.", expected_funder_version: "${f_v1}" }
              as: EditorialDirector
              as_user_id: user-ed-1
          assert:
            - "trigger[0]: 412 with data.error_id == ERR_STALE_FUNDER_VERSION, and no FirewallDisclosure row is created"
            - "trigger[1]: 201 with status == ACTIVE, funder_id == ${f_id}, coverage_area_id == ${ca_id}"
            - "GET /funders/${f_id}: status == CLEARED and version is unchanged by the rejected attempt"

      - name: occ_tier_change_with_a_stale_member_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tier-change-stale-member]
          - errors[ERR_STALE_MEMBER_VERSION]
          - calculations.contribution_deductible_split
        distinguishing_aspect: >-
          Settling the activating contribution and renewing both bump the member's version, so the
          version captured at enrolment is refused with 412; replaying the same call with the
          current version succeeds and retroactively re-splits the unacknowledged 2500-cent
          contribution against the new tier's 6000-cent quid pro quo.
        test_recipe:
          setup: "Two published tiers - SUSTAINER (MONTHLY, 2500, no benefits) and PATRON (ANNUAL, 30000, one 6000-cent benefit) - and a member enrolled on SUSTAINER whose enrolment version is captured, then activated and renewed."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              as_user_id: user-fc-1
              captures: { fp_id: "$.data.id" }
            - call: "POST /membership-tiers"
              payload: { tier_code: "SUSTAINER", name: "Sustainer", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_a: "$.data.id" }
            - call: "POST /membership-tiers/${tier_a}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /membership-tiers"
              payload:
                tier_code: "PATRON"
                name: "Patron"
                renewal_cadence: "ANNUAL"
                contribution_amount_cents: 30000
                benefits:
                  - { benefit_code: "GALA", fulfillment_type: "EVENT_ACCESS", annual_fair_market_value_cents: 6000 }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_b: "$.data.id" }
            - call: "POST /membership-tiers/${tier_b}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /members"
              payload: { tier_id: "${tier_a}", email: "ana@example.org", full_name: "Ana Ruiz" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { m_id: "$.data.id", m_v0: "$.data.version" }
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "MEMBERSHIP", amount_cents: 2500, received_date: "2026-08-01", member_id: "${m_id}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { c_id: "$.data.id" }
            - call: "POST /contributions/${c_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: FinanceController
              as_user_id: user-fc-1
            - call: "POST /members/${m_id}/lifecycle-actions"
              payload: { action: "RENEW" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          trigger:
            - call: "POST /members/${m_id}/tier-change"
              payload: { new_tier_id: "${tier_b}", expected_member_version: "${m_v0}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { err_id: "$.data.error_id" }
            - call: "GET /members/${m_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { m_vnow: "$.data.version" }
            - call: "POST /members/${m_id}/tier-change"
              payload: { new_tier_id: "${tier_b}", expected_member_version: "${m_vnow}" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "trigger[0]: 412 with data.error_id == ERR_STALE_MEMBER_VERSION, and tier_id is still ${tier_a}"
            - "trigger[1]: 200 with tier_id == ${tier_a}, status == ACTIVE"
            - "trigger[2]: 200 with tier_id == ${tier_b} and version == ${m_vnow} + 1"
            - "GET /contributions/${c_id}: acknowledgment_status == UNACKNOWLEDGED, quid_pro_quo_amount_cents == 6000, tax_deductible_amount_cents == 0"

      - name: occ_version_increments_by_exactly_one_per_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - entities.Funder.fields.version
          - entities.MembershipTier.fields.version
        distinguishing_aspect: >-
          Every accepted write advances the row's version by exactly one - not by the number of
          derived columns it recomputed - and reads leave it untouched, which is what makes the
          two concurrency rules usable as guards.
        test_recipe:
          setup: "One funder and one membership tier, each written twice; versions are captured relative to the create response rather than assumed to start at any particular number."
          setup_api_calls:
            - call: "POST /funders"
              payload: { legal_name: "Ironwood Trust", funder_type: "FOUNDATION" }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { f_id: "$.data.id", f_v0: "$.data.version" }
            - call: "POST /membership-tiers"
              payload: { tier_code: "SUSTAINER", name: "Sustainer", renewal_cadence: "MONTHLY", contribution_amount_cents: 2500, benefits: [] }
              as: DevelopmentOfficer
              as_user_id: user-do-1
              captures: { tier_id: "$.data.id", t_v0: "$.data.version" }
          trigger:
            - call: "GET /funders/${f_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /funders/${f_id}/independence-clearance"
              payload: { decision: "CLEAR", basis: "AUDITED", audited_advocacy_index: 4 }
              as: EditorialDirector
              as_user_id: user-ed-1
            - call: "GET /funders/${f_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
            - call: "POST /membership-tiers/${tier_id}/publish"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: user-do-1
          assert:
            - "trigger[0]: version == ${f_v0} (the read does not advance it)"
            - "trigger[1]: version == ${f_v0} + 1, status == CLEARED, risk_basis == AUDITED"
            - "trigger[2]: version == ${f_v0} + 1 (still, after a second read)"
            - "trigger[3]: version == ${t_v0} + 1, status == PUBLISHED"

      - name: layer_major_donor_latch_trips_exactly_at_the_cumulative_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.member_lifetime_giving
          - entities.Member.fields.is_major_donor
          - entities.Member.fields.cultivation_locked
        distinguishing_aspect: >-
          The latch is cumulative, not per-gift: 494999 then 497499 leave is_major_donor false and
          the row lands on 500000 exactly - the threshold itself, not one cent past it - which is
          the point at which both is_major_donor and cultivation_locked turn true.
        test_recipe:
