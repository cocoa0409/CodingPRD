            - "One ENGINEERING plan (headcount_target 1, wave_start_date 2026-09-10) with a single ACCEPTED hire enrolled in a COMPLETED orientation session."
            - "Logical clock at 2026-09-20, after both the session's ends_at and the hire's start_date."
          setup_api_calls:
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Kestrel Bay Resort", brand_code: "KBR", room_count: 130, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 120, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14, slip_tolerance_days: 10 }
              as: ProgramDirector
