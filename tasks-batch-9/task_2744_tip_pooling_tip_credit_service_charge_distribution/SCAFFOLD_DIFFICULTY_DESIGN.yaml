              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_a_id: $.data.id }
            - call: "POST /shifts/${shift_a_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_a_id}/declare-tips"
              payload: { declared_cash_tips_cents: 5000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-05T00:00:00Z", start_at: "2026-08-05T16:00:00Z", end_at: "2026-08-06T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_b_id: $.data.id }
            - call: "POST /shifts/${shift_b_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_b_id}/declare-tips"
              payload: { declared_cash_tips_cents: 500, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "GET /pay-lines"
              payload: { pay_period_id: "${period_id}" }
              as: ComplianceOfficer
              captures: { pay_line_id: "$.data[0].id", pay_line_version: "$.data[0].version" }
            - call: "POST /back-wage-corrections"
              payload: { pay_line_id: "${pay_line_id}", amount_cents: 1000, reason_code: "SIDE_WORK_OVERAGE", expected_pay_line_version: "${pay_line_version}" }
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
              captures: { corr1_id: $.data.id }
            - call: "POST /disputes"
              payload: { pay_line_id: "${pay_line_id}", raised_by_employee_id: "${emp_id}", category: "TIP_CREDIT", claimed_amount_cents: 1500, narrative: "The tip credit was taken without a written notice" }
              as: Employee
