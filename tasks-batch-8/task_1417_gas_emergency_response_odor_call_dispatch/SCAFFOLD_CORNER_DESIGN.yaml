              payload: { channel: "MEDIA", headline: "Gas odor reported", body: "Crews responding" }
              as: Supervisor
              captures: { notif_id: "$.data.id" }
          trigger:
            - call: "POST /gas-ops/public-notifications/${notif_id}/retract"
              payload: {}
              as: Supervisor
              captures: { err: "$.data.error_id" }
            - call: "POST /gas-ops/public-notifications/${notif_id}/issue"
              payload: {}
              as: Supervisor
            - call: "POST /gas-ops/public-notifications/${notif_id}/retract"
              payload: { reason: "all clear" }
              as: Supervisor
            - call: "POST /gas-ops/public-notifications/${notif_id}/issue"
              payload: {}
              as: Supervisor
              captures: { err2: "$.data.error_id" }
          assert:
            - "Retract from DRAFT: err == ERR_NOTIFICATION_NOT_ISSUED, HTTP 409"
            - "Issue from DRAFT succeeds: status ISSUED, issued_at set"
            - "Retract from ISSUED succeeds: status RETRACTED, retracted_at set"
            - "Issue from RETRACTED: err2 == ERR_NOTIFICATION_NOT_DRAFT (terminal lockdown)"

