              payload: { repair_estimate_cents: 6119999, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /inland-marine/claims/${clm_at}/adjust"
              payload: { adjustment_basis: "REPAIR" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
            - call: "POST /inland-marine/claims/${clm_below}/adjust"
              payload: { adjustment_basis: "REPAIR" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "CoveragePart.${cp}.rated_premium_cents == 346636 and Policy.${pol}.written_premium_cents == 360501 (one load on the summed 346636, not two per-part loads)"
            - "Claim.${clm_at}.constructive_total_loss_threshold_cents == 6120000"
            - "Claim.${clm_below}.constructive_total_loss_threshold_cents == 6120000"
            - "Claim.${clm_at}.repair_basis_settlement_cents == 6020000 (computed and stored even though it is unselectable)"
            - "Claim.${clm_at}.total_loss_basis_settlement_cents == 8060000"
            - "GET /inland-marine/claims/${clm_at}/settlement-worksheet returns constructive_total_loss_reached == true and repair_basis_selectable == false"
            - "GET /inland-marine/claims/${clm_below}/settlement-worksheet returns constructive_total_loss_reached == false and repair_basis_selectable == true"
            - "trigger[0] HTTP status == 409"
            - "trigger[0] response error_id == ERR_CONSTRUCTIVE_TOTAL_LOSS"
            - "after trigger[0]: Claim.${clm_at}.adjustment_status == INSPECTED (unchanged)"
            - "after trigger[0]: Claim.${clm_at}.adjustment_basis is null"
            - "after trigger[1]: Claim.${clm_below}.adjustment_status == REPAIR_APPROVED"
            - "after trigger[1]: Claim.${clm_below}.settlement_amount_cents == 6019999"
            - "the two claims differ by exactly 1 cent of repair_estimate_cents and yet one is 409 and the other pays 6019999"

      - name: underreporting_full_reporting_threshold_inclusive_boundary
        grounds:
          - calculations.underreporting_penalty_factor
          - calculations.claim_settlement_amount
          - calculations.reporting_period_earned_premium
          - entities.Claim.fields.underreporting_factor_bp
          - entities.CoveragePart.fields.reporting_annual_rate_bp
        distinguishing_aspect: |
          The full-reporting test snaps at exactly 9000 bp INCLUSIVE: a report of
          9000000 against an actual value at loss of 10000000 gives a ratio of
          exactly 9000 bp and the factor snaps to 10000 (settlement 3900000),
          while 8999000 gives 8999 bp and the raw ratio becomes the factor
          (settlement 3499600), so one thousand cents of reported value moves the
          settlement by 400400.
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "Two ACTIVE REPORTING_FORM CoverageParts P1 and P2, each: ACV, deductible 100000, per_item_limit 20000000, aggregate_limit 200000000, reporting_frequency MONTHLY, reporting_annual_rate_bp 250, reporting_limit_cents 20000000."
            - "One ACTIVE EquipmentItem on each part, both EXCAVATOR model_year 2022 original_cost 12000000 so insured_value_cents 8160000 and the constructive-total-loss threshold is 6120000 on both."
            - "Logical clock at 2026-09-05T00:00:00Z, inside the 2026-09-15 grace date for the August period."
            - "P1 carries one ACCEPTED ValueReport for 2026-08-01..2026-08-31 with reported_value_cents 9000000 (period_earned_premium_cents 19110, late_penalty_cents 0)."
            - "P2 carries one ACCEPTED ValueReport for 2026-08-01..2026-08-31 with reported_value_cents 8999000 (period_earned_premium_cents 19107, late_penalty_cents 0)."
            - "One INSPECTED Claim on each part's item, loss_date 2026-08-20 (inside both reported periods), repair_estimate_cents 4000000 and actual_value_at_loss_cents 10000000."
          setup_api_calls:
