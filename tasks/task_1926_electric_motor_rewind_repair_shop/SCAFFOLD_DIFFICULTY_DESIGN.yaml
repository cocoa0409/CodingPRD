scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc: two calculations where two valid approaches
  # produce different results, on DIFFERENT entity domains.
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_recommendation_flips_under_tco_when_core_loss_fails
        grounds:
          - calculations.rewind_vs_replace_quote
          - calculations.failure_risk_pct
          - entities.Quote.fields.tco_total_cents
          - entities.Quote.fields.recommendation
        distinguishing_aspect: |
          Same winding inputs (12 h labor on a frame-200 motor, 38000c materials,
          replacement_cost 260000c) produce recommendation=REWIND under the
          AS_QUOTED variant but recommendation=REPLACE under TCO_ADJUSTED when a
          FAIL core-loss record forces risk_pct=0.35 — the two variants of
          rewind_vs_replace_quote diverge on the Quote entity domain.
        test_recipe:
          setup:
            - "Shop with canonical rates (small 8500, medium 9500, large 11200, xlarge 13800; rush 0.35; threshold 0.65; supplies 0.08/0.06 break 100000; warranty 12; pool slot 4500; loan daily 1800; grace 3)"
            - "Customer C in GOOD standing; Motor M frame 200, rated 75 kW, manufactured 2008 (age 18 at default clock 2026)"
            - "WorkOrder W for M diagnosed with rewind_hours=12, materials_cents=38000, replacement_cost_cents=260000"
            - "A CORE_LOSS TestRecord on W with measured_watts=3800 (75kW -> 3800/75000 = 5.0667% > 5% -> FAIL)"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-1", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2008 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "CORE_LOSS", measured_watts: 3800 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "winding short", rewind_hours: 12, materials_cents: 38000, replacement_cost_cents: 260000 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v: $.data.version }
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v}" }
              as: Estimator
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.rewind_labor_cents == 102000"
            - "Quote.${q_id}.shop_supplies_cents == 10400"
            - "Quote.${q_id}.rush_premium_cents == 0"
            - "Quote.${q_id}.rewind_total_cents == 150400"
            - "Quote.${q_id}.risk_pct == 0.35"
            - "Quote.${q_id}.risk_cost_cents == 52640"
            - "Quote.${q_id}.tco_total_cents == 203040"
            - "Quote.${q_id}.recommendation == REPLACE  # TCO_ADJUSTED wins the side-by-side; AS_QUOTED would have said REWIND (150400 <= 169000)"

      - name: standing_recomputed_two_ways_on_payment_vs_overdue
        grounds:
          - calculations.customer_standing
          - calculations.payment_waterfall
          - entities.Customer.fields.standing
        distinguishing_aspect: |
          customer_standing is derived two ways from the same ledger: the
          lazy read-time derivation (scan of OVERDUE invoices triggered by GET)
          versus the payment-triggered waterfall recomputation; the same
          customer reads HOLD before the payment and WATCH after, on identical
          invoice rows, because the waterfall's hop changes which invoices
          remain OVERDUE. Entity domain: Customer ledger — distinct from the
          Quote domain of the sibling instance.
        test_recipe:
          setup:
            - "Shop canonical rates; Customer C; two motors M-S1/M-S2"
            - "Work order W1 (1h, 0 materials, frame 200, STANDARD, no core-loss) released at clock 2026-08-01 -> invoice I1 total 34680c issued 2026-08-01, due 2026-08-31"
            - "Work order W2 (2h, 0 materials, frame 200, STANDARD, no core-loss) released at clock 2026-08-02 -> invoice I2 total 43860c issued 2026-08-02, due 2026-09-01"
            - "Clock advanced to 2026-10-01: I1 is 31 days overdue, I2 is 30 days overdue"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-S1", rated_kw: 10, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { ms1: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-S2", rated_kw: 10, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { ms2: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${ms1}", priority: "STANDARD" }
              as: Technician
              captures: { w1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${w1}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${w1}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 1, materials_cents: 0, replacement_cost_cents: 999999 }
              as: Technician
              as_user_id: "op-t"
            - call: "GET /shops/${shop_id}/work-orders/${w1}"
              as: Estimator
              captures: { w1v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${w1}/quotes"
              payload: { expected_work_order_version: "${w1v}" }
              as: Estimator
              captures: { q1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${w1}/quotes/${q1}/send"
              as: Estimator
            - call: "POST /shops/${shop_id}/work-orders/${w1}/quotes/${q1}/accept"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/work-orders/${w1}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${w1}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 22, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.42 }
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${w1}/tests"
              payload: { kind: "FINAL", vibration_mm_s: 2.0, insulation_megohms: 900 }
              as: Technician
              as_user_id: "op-t2"
            - call: "POST /shops/${shop_id}/work-orders/${w1}/release"
              as: ServiceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${ms2}", priority: "STANDARD" }
              as: Technician
              captures: { w2: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${w2}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${w2}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 2, materials_cents: 0, replacement_cost_cents: 999999 }
              as: Technician
              as_user_id: "op-t"
            - call: "GET /shops/${shop_id}/work-orders/${w2}"
              as: Estimator
              captures: { w2v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${w2}/quotes"
              payload: { expected_work_order_version: "${w2v}" }
              as: Estimator
              captures: { q2: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${w2}/quotes/${q2}/send"
              as: Estimator
            - call: "POST /shops/${shop_id}/work-orders/${w2}/quotes/${q2}/accept"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/work-orders/${w2}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${w2}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 22, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.42 }
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${w2}/tests"
              payload: { kind: "FINAL", vibration_mm_s: 2.0, insulation_megohms: 900 }
              as: Technician
              as_user_id: "op-t2"
            - call: "POST /shops/${shop_id}/work-orders/${w2}/release"
              as: ServiceManager
            - call: "GET /shops/${shop_id}/work-orders/${w1}/invoices"
              as: ServiceManager
              captures: { i1: "$.data[0].id" }
            - call: "GET /shops/${shop_id}/work-orders/${w2}/invoices"
              as: ServiceManager
              captures: { i2: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ShopAdmin
            - call: "GET /shops/${shop_id}/customers/${cust_id}"
              as: ServiceManager
          trigger:
            - call: "POST /shops/${shop_id}/customers/${cust_id}/payments"
              payload: { payment_cents: 44680 }
              as: ServiceManager
            - call: "GET /shops/${shop_id}/customers/${cust_id}"
              as: ServiceManager
          assert:
            - "Pre-payment lazy read: Customer.${cust_id}.standing == HOLD   # I1 overdue 31 days (> 30)"
            - "Payment waterfall: response.applied[0].invoice_id == ${i1} and applied[0].applied_cents == 34680 (oldest issued_at first); applied[1].invoice_id == ${i2} and applied[1].applied_cents == 10000; credit_added_cents == 0"
            - "Invoice.${i1}.status == PAID; Invoice.${i2}.status == OVERDUE with balance_due_cents == 33860"
            - "Post-payment recompute: Customer.${cust_id}.standing == WATCH   # I2 overdue exactly 30 days is WATCH, not HOLD — same invoice rows, two derivation paths, different standing"


  - rule_id: combinatorial_formula
    instances:
      - name: rush_premium_stacks_on_supplies_after_tiered_labor
        grounds:
          - calculations.rewind_labor_tiered
          - calculations.shop_supplies_marginal
          - calculations.rush_premium
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — the frame-tiered
          labor rate feeds the supplies base, the marginal supplies tier feeds
          the rush subtotal, and the rush premium branches on priority
          (STANDARD/RUSH/EMERGENCY with a 1.5x multiplier on EMERGENCY).
        test_recipe:
          setup:
            - "Shop canonical rates; Customer C; Motor frame 200; WorkOrder diagnosed 10h / 20000c materials; priority EMERGENCY"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-2", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "EMERGENCY" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "ground fault", rewind_hours: 10, materials_cents: 20000, replacement_cost_cents: 999999 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v: $.data.version }
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v}" }
              as: Estimator
              captures: { q_id: $.data.id }
          assert:
            - "Quote.${q_id}.rewind_labor_cents == 85000"
            - "Quote.${q_id}.shop_supplies_cents == 8300   # marginal: 100000*0.08 + 5000*0.06"
            - "Quote.${q_id}.rush_premium_cents == 59483   # round(113300 * 0.35 * 1.5)"
            - "Quote.${q_id}.rewind_total_cents == 172783"

      - name: invoice_total_rounds_per_line_then_sums
        grounds:
          - calculations.invoice_total
          - calculations.shop_supplies_marginal
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — shop_supplies is rounded
          once after the marginal tier split, each invoice line is rounded to
          integer cents first, then lines are summed; the forbidden
          sum-then-round order yields a different cent on this fixture
          (marginal 11120 vs flat 9120 proves tier mode; per-line rounding is
          what makes 163120 + fees == 200620 exact).
        test_recipe:
          setup:
            - "Shop canonical rates; Customer C; Motor frame 355 (medium rate 9500); WorkOrder diagnosed 12h / 38000c materials; STANDARD priority; core-loss PASS recorded so the core-loss fee line is included; balancing performed"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-3", rated_kw: 75, frame_mm: 355, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "CORE_LOSS", measured_watts: 3200 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "winding short", rewind_hours: 12, materials_cents: 38000, replacement_cost_cents: 9999999 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q_id}/send"
              as: Estimator
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q_id}/accept"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 22, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.42 }
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "FINAL", vibration_mm_s: 2.0, insulation_megohms: 900 }
              as: Technician
              as_user_id: "op-t2"
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/release"
              as: ServiceManager
          assert:
            - "WorkOrder.${wo_id}.invoice_total_cents == 200620   # 7500 + 12000 + 163120 + 9500 + 8500"
            - "Invoice created with total_cents == 200620 and balance_due_cents == 200620"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine: two non-linear machines on DIFFERENT
  # entities.
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_rework_loop_final_test_fail_returns_to_in_rewind
        grounds:
          - state_machines.WorkOrder.FINAL_TEST_to_IN_REWIND
          - state_machines.WorkOrder.IN_REWIND_to_BALANCING
          - calculations.vibration_verdict
        distinguishing_aspect: |
          Cyclic shape on WorkOrder: FINAL_TEST --(verdict FAIL)--> IN_REWIND
          forms a rework loop (BALANCING -> FINAL_TEST -> IN_REWIND ->
          BALANCING); each pass requires a fresh CoilDataRecord and re-runs the
          vibration gate, so the loop is observable through repeated
          coil-data/final-test cycles.
        test_recipe:
          setup:
            - "Full pipeline to BALANCING on a frame-200 motor (vibration limit 2.8 mm/s)"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-4", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "winding short", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q_id}/send"
              as: Estimator
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q_id}/accept"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 22, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.42 }
              as: WindingTechnician
              as_user_id: "op-w"
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "FINAL", vibration_mm_s: 2.81, insulation_megohms: 900 }
              as: Technician
              as_user_id: "op-t2"
              captures: { tr_id: $.data.id }
          assert:
            - "TestRecord.${tr_id}.verdict == FAIL   # 2.81 > 2.8 limit for frame <= 315"
            - "WorkOrder.${wo_id}.status == IN_REWIND   # automatic rework loop fired"
            - "A second POST .../coil-data followed by a FINAL test with vibration_mm_s == 2.8 yields verdict PASS and status FINAL_TEST (boundary: measured == limit passes)"

      - name: quote_revise_cycle_supersedes_and_reissues
        grounds:
          - state_machines.Quote.ISSUED_to_SUPERSEDED
          - state_machines.WorkOrder.AWAITING_APPROVAL_to_QUOTED
          - state_machines.WorkOrder.DIAGNOSED_to_QUOTED
        distinguishing_aspect: |
          Cyclic shape on Quote/WorkOrder: AWAITING_APPROVAL --revise--> QUOTED
          --issue new--> QUOTED (new ISSUED quote) --send--> AWAITING_APPROVAL;
          the superseded quote is terminal while the work order loops. Distinct
          entity from the WorkOrder rework loop's mechanical cycle because the
          state being cycled here is the commercial quote negotiation.
        test_recipe:
          setup:
            - "WorkOrder driven to AWAITING_APPROVAL with an ISSUED quote Q1"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
