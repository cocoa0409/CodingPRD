          One unpriceable line rejects the ENTIRE submit: the other two lines must not be priced and
          the report must stay DRAFT with gross_receipts_cents null. This is the all-or-nothing half
          of the claim — a per-line implementation that prices what it can and skips the rest leaves
          two lines with applied_rate_micros_per_stream set and a partial gross behind, which the
          repeat submit then cannot distinguish from a correct run.
