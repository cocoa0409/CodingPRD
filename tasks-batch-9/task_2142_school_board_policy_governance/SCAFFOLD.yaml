scenario: "desgin task harder than expert level.!!!!2142. School Board Policy & Governance Management (local school board): policy adoption cycle with first/second reading, legal update service & required-policy tracking, agenda building & public comment rules, open-meeting notice & minutes approval, board committee assignment & conflict disclosure, superintendent evaluation cycle, policy exception/waiver requests, policy manual publication & version history"
domain_name: school-board-policy-governance
api_prefix: "/governance"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  state_machine_shape: cyclic

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert
  notes: |
    Governance work is a compliance machine wrapped around a negotiation machine. The compliance
    half is the open-meeting statute (notice lead time, agenda lock, minutes approval at a LATER
    meeting) plus the legal update service that files dated mandates against individual policies.
    The negotiation half is the adoption cycle itself: a PolicyVersion must survive two readings at
    two different meetings, and a failed second reading throws it back to DRAFT so the cycle repeats
    (a genuine A->B->A loop, not a rejection terminal). Meeting carries two independent state axes
    (status and minutes_status) that advance on different triggers, and minutes_status of meeting N
    is a precondition for a vote at meeting N+1 -- a self-referential cross-meeting dependency.
    Public-comment minute allocation and superintendent composite scoring are both dual-variant and
    sit on unrelated entity domains. The compliance sweep is the ops-run checkpoint that turns clock
    movement into OVERDUE mandates, EXPIRED waivers, and LAPSED manual certifications.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: BoardMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Elected trustee's display name."
      - name: seat_number
        type: integer
        source: input
        description: "Numbered board seat the trustee occupies."
        constraints: "1..15; unique across BoardMember rows whose status == SEATED"
      - name: office
        type: enum
        source: input
        description: "Board office held by this trustee."
        default: MEMBER
        constraints: "PRESIDENT | VICE_PRESIDENT | MEMBER; at most one SEATED row may hold PRESIDENT"
      - name: term_start_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the elected term begins."
      - name: term_end_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the elected term ends; must be strictly after term_start_date."
      - name: employer_name
        type: string
        source: input
        description: "Trustee's outside employer, retained for conflict-of-interest review."
      - name: status
        type: enum
        source: system
        description: "Seat lifecycle. SEATED on creation; RESIGNED via the resign endpoint; TERM_EXPIRED set by the compliance sweep once the logical clock passes term_end_date."
        default: SEATED
        constraints: "SEATED | RESIGNED | TERM_EXPIRED"
      - name: open_recusal_count
        type: integer
        source: computed
        description: "Count of this trustee's ConflictDisclosure rows whose status == RECUSAL_REQUIRED."
        default: 0
      - name: active_committee_count
        type: integer
        source: computed
        description: "Count of this trustee's CommitteeAssignment rows whose status IN {ACTIVE, RECUSED}."
        default: 0

  - name: Committee
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Standing committee name."
      - name: charter_type
        type: enum
        source: input
        description: "Subject-matter charter of the committee."
        constraints: "POLICY | FINANCE | PERSONNEL | AUDIT"
      - name: seat_capacity
        type: integer
        source: input
        description: "Total number of committee seats."
        constraints: "3..9"
      - name: quorum_size
        type: integer
        source: input
        description: "Number of ACTIVE assignments required for the committee to transact business."
        constraints: ">= 2 and <= seat_capacity"
      - name: status
        type: enum
        source: system
        description: "Derived committee posture. INQUORATE on creation (zero seats filled); flips to ACTIVE when voting_seat_count >= quorum_size and back to INQUORATE when it falls below."
        default: INQUORATE
        constraints: "ACTIVE | INQUORATE"
      - name: filled_seat_count
        type: integer
        source: computed
        description: "Count of this committee's CommitteeAssignment rows whose status IN {ACTIVE, RECUSED}."
        default: 0
      - name: voting_seat_count
        type: integer
        source: computed
        description: "Count of this committee's CommitteeAssignment rows whose status == ACTIVE."
        default: 0
      - name: vacant_seat_count
        type: integer
        source: computed
        description: "seat_capacity - filled_seat_count. Never negative."
        default: 0

  - name: CommitteeAssignment
    parent: Committee
    common_fields: true
    fields:
      - name: committee_id
        type: string
        source: input
        description: "FK -> Committee.id; the committee whose seat is being filled."
      - name: board_member_id
        type: string
        source: input
        description: "FK -> BoardMember.id; the trustee occupying the seat."
      - name: role_on_committee
        type: enum
        source: input
        description: "Seat role. Exactly one ACTIVE CHAIR per committee is permitted."
        default: MEMBER
        constraints: "CHAIR | MEMBER"
      - name: status
        type: enum
        source: system
        description: "Seat occupancy. ACTIVE on creation; RECUSE/REINSTATE/REMOVE actions move it; REMOVED also set by the trustee-resignation cascade."
        default: ACTIVE
        constraints: "ACTIVE | RECUSED | REMOVED"
      - name: assigned_on
        type: datetime
        source: system
        description: "Logical-clock instant at which the assignment was created."
      - name: removed_on
        type: datetime
        source: system
        description: "Logical-clock instant at which status became REMOVED; null while the seat is held."
        default: null

  - name: ConflictDisclosure
    parent: null
    common_fields: true
    fields:
      - name: board_member_id
        type: string
        source: input
        description: "FK -> BoardMember.id; the disclosing trustee."
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy the disclosed interest touches."
      - name: nature
        type: enum
        source: input
        description: "Category of the disclosed interest."
        constraints: "FINANCIAL | VENDOR | EMPLOYMENT | FAMILIAL"
      - name: narrative
        type: string
        source: input
        description: "Free-text description of the interest, retained for the public record."
      - name: status
        type: enum
        source: system
        description: "Disclosure posture computed at creation (see calculations.disclosure_recusal_classification); CLEARED via the clear endpoint or by the trustee-resignation cascade."
        default: RECUSAL_REQUIRED
        constraints: "RECUSAL_REQUIRED | ADVISORY_ONLY | CLEARED"
      - name: disclosed_on
        type: datetime
        source: system
        description: "Logical-clock instant at which the disclosure was filed."
      - name: cleared_on
        type: datetime
        source: system
        description: "Logical-clock instant at which status became CLEARED; null otherwise."
        default: null

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Board policy code, e.g. BP-4119."
        constraints: "unique across all Policy rows; 3..20 characters"
      - name: title
        type: string
        source: input
        description: "Policy title as it appears in the manual."
      - name: category
        type: enum
        source: input
        description: "Manual chapter the policy belongs to."
        constraints: "GOVERNANCE | INSTRUCTION | PERSONNEL | STUDENTS | BUSINESS"
      - name: legal_requirement_level
        type: enum
        source: input
        description: "How strongly statute compels the board to carry this policy. Drives the second-reading vote threshold and the waiver duration cap."
        constraints: "REQUIRED_BY_LAW | RECOMMENDED | LOCAL_DISCRETION"
      - name: manual_section
        type: string
        source: input
        description: "Ordering key for manual publication, e.g. 4000.19."
      - name: status
        type: enum
        source: system
        description: "UNADOPTED until a PolicyVersion of this policy reaches ADOPTED; then ADOPTED forever."
        default: UNADOPTED
        constraints: "UNADOPTED | ADOPTED"
      - name: adopted_version_no
        type: integer
        source: computed
        description: "version_no of this policy's single ADOPTED PolicyVersion; null while none is adopted."
        default: null
      - name: last_review_date
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent adoption for this policy; null until first adoption."
        default: null
      - name: version_count
        type: integer
        source: computed
        description: "Count of PolicyVersion rows whose policy_id == this Policy.id, in any status."
        default: 0
      - name: open_mandate_count
        type: integer
        source: computed
        description: "Count of this policy's LegalMandate rows whose status IN {OPEN, IN_PROGRESS}."
        default: 0
      - name: overdue_mandate_count
        type: integer
        source: computed
        description: "Count of this policy's LegalMandate rows whose status == OVERDUE."
        default: 0
      - name: active_waiver_count
        type: integer
        source: computed
        description: "Count of this policy's WaiverRequest rows whose status == GRANTED and whose granted_end_date is strictly after the logical clock."
        default: 0
      - name: compliance_state
        type: enum
        source: computed
        description: "Posture derived by calculations.policy_compliance_state; gates manual certification."
        default: ACTION_REQUIRED
        constraints: "COMPLIANT | ACTION_REQUIRED | NON_COMPLIANT"

  - name: PolicyVersion
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy this draft revises."
      - name: version_no
        type: integer
        source: system
        description: "Sequential per policy, starting at 1, assigned in creation order; never reused."
      - name: body_text
        type: string
        source: input
        description: "Full policy text of this version."
      - name: summary_of_change
        type: string
        source: input
        description: "One-line description of what this version changes."
      - name: status
        type: enum
        source: system
        description: "Adoption-cycle state; see state_machines.PolicyVersion."
        default: DRAFT
        constraints: "DRAFT | FIRST_READING_PASSED | ADOPTED | SUPERSEDED | WITHDRAWN"
      - name: reading_count
        type: integer
        source: system
        description: "Number of readings this version has passed. 0 on creation, 1 after a passed first reading, 2 after a passed second reading, reset to 0 when a failed second reading throws the version back to DRAFT."
        default: 0
      - name: first_reading_meeting_id
        type: string
        source: system
        description: "FK -> Meeting.id; the meeting at which the first reading passed. Null until then; cleared back to null when a failed second reading returns the version to DRAFT."
        default: null
      - name: adopting_meeting_id
        type: string
        source: system
        description: "FK -> Meeting.id; the meeting at which the adopting vote passed. Null until adoption."
        default: null
      - name: adopted_at
        type: datetime
        source: system
        description: "Logical-clock instant of adoption; null until ADOPTED."
        default: null
      - name: effective_date
        type: datetime
        source: computed
        description: "adopted_at + EFFECTIVE_DELAY_DAYS days for a regular adoption, adopted_at + 0 days for an emergency adoption. Null until ADOPTED."
        default: null
      - name: superseded_at
        type: datetime
        source: system
        description: "Logical-clock instant at which a newer version of the same policy was adopted; null otherwise."
        default: null
      - name: withdrawn_reason
        type: string
        source: input
        description: "Reason recorded when the version is withdrawn; null while the version is live."
        default: null
      - name: policy_version_after
        type: integer
        source: system
        description: "Value of the parent Policy.version immediately after this PolicyVersion row was created. Lets a client chain the next optimistic-concurrency write without re-reading the policy."

  - name: LegalMandate
    parent: Policy
    common_fields: true
    fields:
      - name: notice_code
        type: string
        source: input
        description: "Legal update service notice identifier, e.g. LUS-2026-014."
        constraints: "unique across all LegalMandate rows"
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the board policy this mandate targets."
      - name: citation
        type: string
        source: input
        description: "Statutory citation the mandate rests on."
      - name: issued_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the legal update service issued the notice."
      - name: compliance_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC instant by which the board must act; must be strictly after issued_on."
      - name: required_action
        type: enum
        source: input
        description: "What the mandate compels."
        constraints: "ADOPT_NEW | REVISE_EXISTING | RESCIND"
      - name: status
        type: enum
        source: system
        description: "Mandate lifecycle; see state_machines.LegalMandate."
        default: OPEN
        constraints: "OPEN | IN_PROGRESS | SATISFIED | OVERDUE"
      - name: satisfied_by_version_no
        type: integer
        source: system
        description: "version_no of the PolicyVersion whose adoption satisfied this mandate; null until SATISFIED."
        default: null
      - name: days_past_deadline
        type: integer
        source: computed
        description: "floor((logical_clock_now - compliance_deadline) / 86400 seconds) when the clock is at or past the deadline and status != SATISFIED, else 0."
        default: 0

  - name: Meeting
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Meeting title as it appears on the public notice."
      - name: scope
        type: enum
        source: input
        description: "Whether this is a full-board meeting or a committee meeting."
        constraints: "FULL_BOARD | COMMITTEE"
      - name: committee_id
        type: string
        source: input
        description: "FK -> Committee.id; required when scope == COMMITTEE, must be omitted or null when scope == FULL_BOARD."
        default: null
      - name: meeting_type
        type: enum
        source: input
        description: "Statutory meeting class; drives notice lead time and public-comment budget."
        constraints: "REGULAR | SPECIAL | EMERGENCY"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the meeting is called to order."
      - name: public_comment_rule
        type: enum
        source: input
        description: "Allocation rule the presiding officer selected for public comment on this meeting."
        default: FIRST_COME_CAPPED
        constraints: "FIRST_COME_CAPPED | EQUAL_SPLIT"
      - name: status
        type: enum
        source: system
        description: "Meeting-conduct axis; see state_machines.Meeting."
        default: DRAFT
        constraints: "DRAFT | NOTICED | OPEN | ADJOURNED"
      - name: minutes_status
        type: enum
        source: system
        description: "Minutes axis, independent of status; see state_machines.Meeting."
        default: NOT_DRAFTED
        constraints: "NOT_DRAFTED | DRAFTED | APPROVED"
      - name: minutes_approved_at_meeting_id
        type: string
        source: system
        description: "FK -> Meeting.id; the LATER meeting at which these minutes were approved. Self-referential; null until minutes_status == APPROVED."
        default: null
      - name: notice_posted_at
        type: datetime
        source: system
        description: "Logical-clock instant the public notice was posted; null while DRAFT."
        default: null
      - name: agenda_locked_at
        type: datetime
        source: system
        description: "Logical-clock instant the agenda closed to new items; set to the same instant as notice_posted_at."
        default: null
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the meeting was called to order; null until OPEN."
        default: null
      - name: adjourned_at
        type: datetime
        source: system
        description: "Logical-clock instant the meeting adjourned; null until ADJOURNED."
        default: null
      - name: seated_member_count_snapshot
        type: integer
        source: system
        description: "Count of BoardMember rows with status == SEATED captured at the instant the meeting was opened. Frozen thereafter; every vote tally on this meeting's items is measured against it."
        default: 0
      - name: attending_member_ids
        type: array
        source: system
        description: "Array of BoardMember.id values recorded present at the open call. Frozen thereafter."
        default: []
      - name: quorum_required
        type: integer
        source: computed
        description: "floor(seated_member_count_snapshot / 2) + 1 once opened; before opening, floor(current SEATED count / 2) + 1."
        default: 0
      - name: public_comment_minutes_budget
        type: integer
        source: computed
        description: "PUBLIC_COMMENT_BUDGET_MINUTES keyed on meeting_type. Fixed at creation."
        default: 0
      - name: public_comment_minutes_remaining
        type: integer
        source: computed
        description: "public_comment_minutes_budget minus the sum of allotted_minutes over this meeting's GRANTED PublicComment rows. Equals the budget until the meeting opens."
        default: 0
      - name: public_comment_allocation_variant
        type: enum
        source: computed
        description: "Which variant of calculations.public_comment_minute_allocation actually ran at open; null before opening."
        default: null
        constraints: "FIRST_COME_CAPPED | EQUAL_SPLIT"

  - name: AgendaItem
    parent: Meeting
    common_fields: true
    fields:
      - name: meeting_id
        type: string
        source: input
        description: "FK -> Meeting.id; the meeting this item sits on."
      - name: sequence_no
        type: integer
        source: system
        description: "Position on the agenda, assigned sequentially per meeting starting at 1 in created_at ASC order; never reused when an item is withdrawn."
      - name: item_type
        type: enum
        source: input
        description: "Kind of board business."
        constraints: "POLICY_FIRST_READING | POLICY_SECOND_READING | WAIVER_DECISION | SUPERINTENDENT_EVALUATION | CONSENT"
      - name: title
        type: string
        source: input
        description: "Agenda line item text."
      - name: policy_version_id
        type: string
        source: input
        description: "FK -> PolicyVersion.id; required when item_type IN {POLICY_FIRST_READING, POLICY_SECOND_READING}, must be null otherwise."
        default: null
      - name: waiver_request_id
        type: string
        source: input
        description: "FK -> WaiverRequest.id; required when item_type == WAIVER_DECISION, must be null otherwise."
        default: null
      - name: requires_public_comment
        type: boolean
        source: computed
        description: "True exactly when item_type IN {POLICY_FIRST_READING, POLICY_SECOND_READING, WAIVER_DECISION}."
        default: false
      - name: status
        type: enum
        source: system
        description: "Item lifecycle; see state_machines.AgendaItem."
        default: PROPOSED
        constraints: "PROPOSED | POSTED | TABLED | ACTED | WITHDRAWN"
      - name: vote_yes
        type: integer
        source: computed
        description: "Length of the yes_member_ids array supplied to the record-vote call."
        default: 0
      - name: vote_no
        type: integer
        source: computed
        description: "Length of the no_member_ids array supplied to the record-vote call."
        default: 0
      - name: vote_abstain
        type: integer
        source: computed
        description: "Length of the abstain_member_ids array supplied to the record-vote call."
        default: 0
      - name: recused_member_count
        type: integer
        source: computed
        description: "Count of Meeting.attending_member_ids entries that hold a ConflictDisclosure with status == RECUSAL_REQUIRED on this item's linked policy, measured at the instant the vote is recorded. Zero for items with no linked policy."
        default: 0
      - name: absent_member_count
        type: integer
        source: computed
        description: "seated_member_count_snapshot - (vote_yes + vote_no + vote_abstain + recused_member_count). Attendees who cast no vote and are not recused are counted here."
        default: 0
      - name: required_yes_votes
        type: integer
        source: computed
        description: "Threshold produced by calculations.vote_tally_outcome; null until the vote is recorded."
        default: null
      - name: vote_outcome
        type: enum
        source: computed
        description: "PASSED when vote_yes >= required_yes_votes, else FAILED. Null until the vote is recorded."
        default: null
        constraints: "PASSED | FAILED"
      - name: acted_at
        type: datetime
        source: system
        description: "Logical-clock instant the vote was recorded; null otherwise."
        default: null
      - name: meeting_version_after
        type: integer
        source: system
        description: "Value of the parent Meeting.version immediately after this AgendaItem row was created. Lets a client chain the next optimistic-concurrency agenda write without re-reading the meeting."

  - name: PublicComment
    parent: AgendaItem
    common_fields: true
    fields:
      - name: agenda_item_id
        type: string
        source: input
        description: "FK -> AgendaItem.id; the item the speaker signed up to address."
      - name: speaker_name
        type: string
        source: input
        description: "Name the speaker signed the card with."
      - name: speaker_affiliation
        type: enum
        source: input
        description: "Constituency the speaker claims."
        constraints: "PARENT | STAFF | STUDENT | COMMUNITY | VENDOR"
      - name: requested_minutes
        type: integer
        source: input
        description: "Minutes the speaker asked for."
        constraints: "1..5"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the speaker card was submitted. Primary ordering key for allocation."
      - name: allotted_minutes
        type: integer
        source: computed
        description: "Minutes actually granted by calculations.public_comment_minute_allocation. 0 while REQUESTED, 0 when DENIED, 0 again once RELEASED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Speaker card lifecycle; see state_machines.PublicComment."
        default: REQUESTED
        constraints: "REQUESTED | GRANTED | DENIED | RELEASED"
      - name: denial_reason
        type: enum
        source: system
        description: "Why the card was denied or released; null while REQUESTED or GRANTED."
        default: null
        constraints: "BUDGET_EXHAUSTED | DUPLICATE_SPEAKER | ITEM_WITHDRAWN"

  - name: WaiverRequest
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the policy the school wants relief from."
      - name: reviewing_committee_id
        type: string
        source: input
        description: "FK -> Committee.id; the standing committee that must recommend before the board votes."
      - name: requesting_school_code
        type: string
        source: input
        description: "Site code of the school seeking the exception, e.g. HS-01."
      - name: justification
        type: string
        source: input
        description: "Narrative justification recorded in the public file."
      - name: requested_start_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the requested relief would begin (inclusive)."
      - name: requested_end_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the requested relief would end (exclusive); must be strictly after requested_start_date."
      - name: status
        type: enum
        source: system
        description: "Waiver lifecycle; see state_machines.WaiverRequest."
        default: SUBMITTED
        constraints: "SUBMITTED | BOARD_PENDING | GRANTED | DENIED | EXPIRED | REVOKED"
      - name: committee_recommendation
        type: enum
        source: system
        description: "Recorded committee position; null until the committee acts."
        default: null
        constraints: "RECOMMEND_GRANT | RECOMMEND_DENY"
      - name: denial_stage
        type: enum
        source: system
        description: "Where the request died; null unless status == DENIED."
        default: null
        constraints: "COMMITTEE | BOARD"
      - name: max_allowed_days
        type: integer
        source: computed
        description: "WAIVER_MAX_DAYS keyed on the linked Policy.legal_requirement_level, fixed at creation."
        default: 0
      - name: granted_start_date
        type: datetime
        source: computed
        description: "Effective start of the granted relief; null unless the board granted it."
        default: null
      - name: granted_end_date
        type: datetime
        source: computed
        description: "Effective end (exclusive) of the granted relief; null unless the board granted it."
        default: null
      - name: granted_days
        type: integer
        source: computed
        description: "floor((granted_end_date - granted_start_date) / 86400 seconds); 0 unless the board granted it."
        default: 0
      - name: revoked_on
        type: datetime
        source: system
        description: "Logical-clock instant the board revoked the granted relief; null otherwise."
        default: null

  - name: SuperintendentEvaluation
    parent: null
    common_fields: true
    fields:
      - name: cycle_year
        type: integer
        source: input
        description: "Evaluation cycle year."
        constraints: "unique across all SuperintendentEvaluation rows; 2020..2100"
      - name: window_start_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the evaluation window opens."
      - name: window_end_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the evaluation window closes; must be strictly after window_start_date."
      - name: midyear_checkpoint_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant of the mid-year checkpoint; must fall strictly between window_start_date and window_end_date."
      - name: goal_count
        type: integer
        source: input
        description: "Number of annual goals adopted for the cycle."
        constraints: "1..10"
      - name: weight_instructional
        type: number
        source: input
        description: "Summative weight for INSTRUCTIONAL_LEADERSHIP."
        constraints: "0.00..1.00, two decimals"
      - name: weight_fiscal
        type: number
        source: input
        description: "Summative weight for FISCAL_STEWARDSHIP."
        constraints: "0.00..1.00, two decimals"
      - name: weight_community
        type: number
        source: input
        description: "Summative weight for COMMUNITY_RELATIONS."
        constraints: "0.00..1.00, two decimals"
      - name: weight_governance
        type: number
        source: input
        description: "Summative weight for GOVERNANCE_SUPPORT."
        constraints: "0.00..1.00, two decimals; the four weights must sum to exactly 1.00"
      - name: status
        type: enum
        source: system
        description: "Evaluation cycle stage; see state_machines.SuperintendentEvaluation."
        default: PLANNING
        constraints: "PLANNING | GOALS_SET | MIDYEAR_REVIEW | SUMMATIVE_DRAFT | ADOPTED"
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times the cycle was reopened from SUMMATIVE_DRAFT back to GOALS_SET."
        default: 0
      - name: rating_count
        type: integer
        source: computed
        description: "Count of EvaluationRating rows whose evaluation_id == this row's id."
        default: 0
      - name: eligible_rater_count
        type: integer
        source: computed
        description: "Count of distinct board_member_id values among this evaluation's ratings whose trustee has status == SEATED and term_end_date >= window_end_date."
        default: 0
      - name: midyear_formative_score
        type: number
        source: computed
        description: "Output of calculations.evaluation_composite_score variant midyear_formative; null until the cycle reaches MIDYEAR_REVIEW."
        default: null
      - name: summative_composite_score
        type: number
        source: computed
        description: "Output of calculations.evaluation_composite_score variant summative_final; null until the cycle reaches ADOPTED, and reset to null on reopen."
        default: null
      - name: adopted_at
        type: datetime
        source: system
        description: "Logical-clock instant the board adopted the summative evaluation; null until ADOPTED."
        default: null

  - name: EvaluationRating
    parent: SuperintendentEvaluation
    common_fields: true
    fields:
      - name: evaluation_id
        type: string
        source: input
        description: "FK -> SuperintendentEvaluation.id; the cycle this rating belongs to."
      - name: board_member_id
        type: string
        source: input
        description: "FK -> BoardMember.id; the trustee submitting the rating."
      - name: domain
        type: enum
        source: input
        description: "Rubric domain being scored."
        constraints: "INSTRUCTIONAL_LEADERSHIP | FISCAL_STEWARDSHIP | COMMUNITY_RELATIONS | GOVERNANCE_SUPPORT"
      - name: score
        type: integer
        source: input
        description: "Rubric score."
        constraints: "1..5"
      - name: comments
        type: string
        source: input
        description: "Optional narrative attached to the rating."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the rating was submitted."
      - name: phase
        type: enum
        source: system
        description: "FORMATIVE when the evaluation was in GOALS_SET or MIDYEAR_REVIEW at submission; SUMMATIVE when it was in SUMMATIVE_DRAFT."
        constraints: "FORMATIVE | SUMMATIVE"
      - name: counted_in_summative
        type: boolean
        source: computed
        description: "True when the submitting trustee has status == SEATED and term_end_date >= the evaluation's window_end_date."
        default: true

  - name: ManualPublication
    parent: null
    common_fields: true
    fields:
      - name: publication_label
        type: string
        source: input
        description: "Human-readable edition label, e.g. 2026-FALL."
        constraints: "unique across all ManualPublication rows"
      - name: as_of_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the edition claims to state the manual as of."
      - name: status
        type: enum
        source: system
        description: "Edition lifecycle; see state_machines.ManualPublication."
        default: BUILDING
        constraints: "BUILDING | PUBLISHED | SUPERSEDED"
      - name: certification_state
        type: enum
        source: system
        description: "PENDING while BUILDING; CERTIFIED or LAPSED thereafter, driven by compliance_gap_count."
        default: PENDING
        constraints: "PENDING | CERTIFIED | LAPSED"
      - name: pinned_entries
        type: array
        source: computed
        description: "Frozen snapshot written at publish time. Array of objects {policy_id, policy_code, version_no, manual_section} ordered by manual_section ASC then policy_code ASC. Empty while BUILDING."
        default: []
      - name: entry_count
        type: integer
        source: computed
        description: "Length of pinned_entries."
        default: 0
      - name: compliance_gap_count
        type: integer
        source: computed
        description: "Count of pinned_entries whose Policy.compliance_state != COMPLIANT, recomputed whenever any pinned policy's compliance_state changes."
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; null while BUILDING."
        default: null
      - name: superseded_by_label
        type: string
        source: system
        description: "publication_label of the edition that superseded this one; null otherwise."
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: PolicyVersion
    shape: cyclic_with_emergency_branch
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FIRST_READING_PASSED
        trigger: "POST /governance/agenda-items/{id}/record-vote on an item whose item_type == POLICY_FIRST_READING and whose computed vote_outcome == PASSED, at a meeting whose meeting_type IN {REGULAR, SPECIAL}, or at an EMERGENCY meeting where vote_yes < seated_member_count_snapshot - 1"
        actor: BoardPresident
        preconditions:
          - "AgendaItem.status == POSTED"
          - "AgendaItem.meeting_id resolves to a Meeting with status == OPEN"
          - "PolicyVersion.status == DRAFT"
          - "no BoardMember id supplied in yes_member_ids / no_member_ids / abstain_member_ids holds a ConflictDisclosure with status == RECUSAL_REQUIRED on PolicyVersion.policy_id"
        side_effects:
          - "AgendaItem.status PROPOSED-or-POSTED -> ACTED; AgendaItem.vote_outcome = PASSED; AgendaItem.acted_at = logical clock"
          - "PolicyVersion.reading_count = 1"
          - "PolicyVersion.first_reading_meeting_id = AgendaItem.meeting_id"
          - "increments PolicyVersion.version by 1 and refreshes PolicyVersion.updated_at"
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /governance/agenda-items/{id}/record-vote on a POLICY_FIRST_READING item at a meeting whose meeting_type == EMERGENCY where vote_yes >= seated_member_count_snapshot - 1 (second reading waived)"
        actor: BoardPresident
        preconditions:
          - "AgendaItem.status == POSTED"
          - "Meeting.status == OPEN and Meeting.meeting_type == EMERGENCY"
          - "PolicyVersion.status == DRAFT"
          - "no recused trustee appears in any vote list"
        side_effects:
          - "AgendaItem.status -> ACTED; vote_outcome = PASSED"
          - "PolicyVersion.reading_count = 2; adopting_meeting_id = AgendaItem.meeting_id; adopted_at = logical clock; effective_date = adopted_at + 0 days (emergency adoptions take effect immediately)"
          - "CASCADE HOP 2 -> the policy's prior ADOPTED PolicyVersion (if any) transitions ADOPTED -> SUPERSEDED with superseded_at = logical clock; Policy.status -> ADOPTED; Policy.adopted_version_no = this version_no; Policy.last_review_date = adopted_at; Policy.version increments by 1"
          - "CASCADE HOP 3 -> because Policy.adopted_version_no changed, every LegalMandate on that policy with status IN {OPEN, IN_PROGRESS, OVERDUE}, required_action IN {ADOPT_NEW, REVISE_EXISTING} and issued_on <= adopted_at transitions to SATISFIED with satisfied_by_version_no = this version_no"
          - "CASCADE HOP 4 -> because mandate statuses changed, Policy.open_mandate_count / overdue_mandate_count are recomputed and calculations.policy_compliance_state phase 2 rewrites Policy.compliance_state"
          - "CASCADE HOP 5 -> because Policy.compliance_state changed, every ManualPublication with status == PUBLISHED whose pinned_entries contains this policy_id recomputes compliance_gap_count and flips certification_state (CERTIFIED when the count reaches 0, LAPSED otherwise)"
        note: "Emergency branch. Same from-state as the regular first-reading transition but a strictly different side-effect set: it skips FIRST_READING_PASSED entirely and fires the full adoption cascade."
      - from: FIRST_READING_PASSED
        to: ADOPTED
        trigger: "POST /governance/agenda-items/{id}/record-vote on an item whose item_type == POLICY_SECOND_READING and whose computed vote_outcome == PASSED"
        actor: BoardPresident
        preconditions:
          - "AgendaItem.status == POSTED and AgendaItem.meeting_id resolves to a Meeting with status == OPEN"
          - "PolicyVersion.status == FIRST_READING_PASSED"
          - "AgendaItem.meeting_id != PolicyVersion.first_reading_meeting_id (a second reading may not be held at the meeting that held the first reading)"
          - "the Meeting identified by PolicyVersion.first_reading_meeting_id has minutes_status == APPROVED"
          - "no recused trustee appears in any vote list"
        side_effects:
          - "AgendaItem.status -> ACTED; vote_outcome = PASSED; acted_at = logical clock"
          - "PolicyVersion.reading_count = 2; adopting_meeting_id = AgendaItem.meeting_id; adopted_at = logical clock; effective_date = adopted_at + EFFECTIVE_DELAY_DAYS days"
          - "CASCADE HOP 2 -> the policy's prior ADOPTED PolicyVersion (if any) transitions ADOPTED -> SUPERSEDED with superseded_at = logical clock; Policy.status -> ADOPTED; Policy.adopted_version_no = this version_no; Policy.last_review_date = adopted_at; Policy.version increments by 1"
          - "CASCADE HOP 3 -> because Policy.adopted_version_no changed, every LegalMandate on that policy with status IN {OPEN, IN_PROGRESS, OVERDUE}, required_action IN {ADOPT_NEW, REVISE_EXISTING} and issued_on <= adopted_at transitions to SATISFIED with satisfied_by_version_no = this version_no"
          - "CASCADE HOP 4 -> because mandate statuses changed, Policy.open_mandate_count / overdue_mandate_count are recomputed and calculations.policy_compliance_state phase 2 rewrites Policy.compliance_state"
          - "CASCADE HOP 5 -> because Policy.compliance_state changed, every ManualPublication with status == PUBLISHED whose pinned_entries contains this policy_id recomputes compliance_gap_count and flips certification_state"
      - from: FIRST_READING_PASSED
        to: DRAFT
        trigger: "POST /governance/agenda-items/{id}/record-vote on a POLICY_SECOND_READING item whose computed vote_outcome == FAILED"
        actor: BoardPresident
        preconditions:
          - "AgendaItem.status == POSTED and its Meeting.status == OPEN"
          - "PolicyVersion.status == FIRST_READING_PASSED"
          - "the Meeting identified by PolicyVersion.first_reading_meeting_id has minutes_status == APPROVED"
        side_effects:
          - "AgendaItem.status -> ACTED; vote_outcome = FAILED; acted_at = logical clock"
          - "PolicyVersion.reading_count reset to 0; first_reading_meeting_id reset to null"
          - "no Policy field changes; no mandate is satisfied"
        note: "The revision loop. A failed second reading returns the version to DRAFT so the whole two-reading cycle must be run again; this is the cycle that makes the machine non-linear."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /governance/policy-versions/{id}/withdraw"
        actor: PolicyAnalyst
        preconditions:
          - "PolicyVersion.status IN {DRAFT, FIRST_READING_PASSED}"
          - "no AgendaItem with status IN {PROPOSED, POSTED} references this PolicyVersion"
        side_effects:
          - "PolicyVersion.withdrawn_reason = supplied reason"
          - "Policy.version_count is recomputed; Policy.version increments by 1"
      - from: FIRST_READING_PASSED
        to: WITHDRAWN
        trigger: "POST /governance/policy-versions/{id}/withdraw"
        actor: PolicyAnalyst
        preconditions:
          - "PolicyVersion.status IN {DRAFT, FIRST_READING_PASSED}"
          - "no AgendaItem with status IN {PROPOSED, POSTED} references this PolicyVersion"
        side_effects:
          - "PolicyVersion.withdrawn_reason = supplied reason; first_reading_meeting_id retained for the record"
          - "Policy.version_count is recomputed; Policy.version increments by 1"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system: a later PolicyVersion of the same Policy reaches ADOPTED"
        actor: system
        preconditions:
          - "another PolicyVersion of the same policy_id has just transitioned to ADOPTED"
        side_effects:
          - "superseded_at = logical clock"
          - "Policy.adopted_version_no now points at the newer version"

  - entity: Meeting
    shape: parallel_dimensions
    initial_state: DRAFT
    terminal_states: [ADJOURNED]
    dimensions:
      - name: status
        states: [DRAFT, NOTICED, OPEN, ADJOURNED]
      - name: minutes_status
        states: [NOT_DRAFTED, DRAFTED, APPROVED]
    transitions:
      - from: DRAFT
        to: NOTICED
        dimension: status
        trigger: "POST /governance/meetings/{id}/notice"
        actor: BoardClerk
        preconditions:
          - "Meeting.status == DRAFT"
          - "scheduled_start_utc - logical_clock_now >= NOTICE_LEAD_HOURS[meeting_type] hours (inclusive at exactly the boundary)"
        side_effects:
          - "notice_posted_at = logical clock; agenda_locked_at = the same instant"
          - "every AgendaItem on this meeting with status == PROPOSED transitions to POSTED"
      - from: NOTICED
        to: OPEN
        dimension: status
        trigger: "POST /governance/meetings/{id}/open"
        actor: BoardPresident
        preconditions:
          - "Meeting.status == NOTICED"
          - "logical_clock_now >= scheduled_start_utc"
          - "every id in attending_member_ids resolves to a BoardMember with status == SEATED"
          - "len(attending_member_ids) >= quorum_required"
        side_effects:
          - "opened_at = logical clock; seated_member_count_snapshot = count of SEATED BoardMember rows; attending_member_ids frozen"
          - "calculations.public_comment_minute_allocation runs over this meeting's REQUESTED PublicComment rows; each is set to GRANTED with allotted_minutes or DENIED with a denial_reason"
          - "public_comment_allocation_variant and public_comment_minutes_remaining are written"
      - from: OPEN
        to: ADJOURNED
        dimension: status
        trigger: "POST /governance/meetings/{id}/adjourn"
        actor: BoardClerk
        preconditions:
          - "Meeting.status == OPEN"
        side_effects:
          - "adjourned_at = logical clock"
          - "every AgendaItem on this meeting still in status POSTED transitions to TABLED"
          - "every PublicComment attached to a newly TABLED item with status == GRANTED transitions to RELEASED with denial_reason = ITEM_WITHDRAWN, allotted_minutes reset to 0, and Meeting.public_comment_minutes_remaining credited back by the released amount"
      - from: NOT_DRAFTED
        to: DRAFTED
        dimension: minutes_status
        trigger: "POST /governance/meetings/{id}/minutes with action == DRAFT"
        actor: BoardClerk
        preconditions:
          - "Meeting.status == ADJOURNED"
          - "Meeting.minutes_status == NOT_DRAFTED"
        side_effects:
          - "minutes_status = DRAFTED; Meeting.version increments by 1"
        note: "The minutes axis only starts moving after the status axis reaches its terminal state, but the two axes are otherwise independent fields on the same row."
      - from: DRAFTED
        to: APPROVED
        dimension: minutes_status
        trigger: "POST /governance/meetings/{id}/minutes with action == APPROVE and approving_meeting_id supplied"
        actor: BoardClerk
        preconditions:
          - "Meeting.minutes_status == DRAFTED"
          - "approving_meeting_id resolves to a Meeting whose status == OPEN"
          - "approving_meeting_id != this meeting's id"
          - "the approving meeting's scheduled_start_utc is strictly after this meeting's scheduled_start_utc"
        side_effects:
          - "minutes_status = APPROVED; minutes_approved_at_meeting_id = approving_meeting_id"
          - "unblocks any POLICY_SECOND_READING vote whose PolicyVersion.first_reading_meeting_id == this meeting id"

  - entity: AgendaItem
    shape: cyclic
    initial_state: PROPOSED
    terminal_states: [ACTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: POSTED
        trigger: "system: POST /governance/meetings/{id}/notice posts the agenda"
        actor: system
        preconditions:
          - "parent Meeting transitions DRAFT -> NOTICED"
        side_effects:
          - "sequence_no is already fixed at creation; no renumbering occurs"
      - from: POSTED
        to: ACTED
        trigger: "POST /governance/agenda-items/{id}/record-vote"
        actor: BoardPresident
        preconditions:
          - "AgendaItem.status == POSTED"
          - "parent Meeting.status == OPEN"
          - "vote_yes + vote_no + vote_abstain + recused_member_count >= Meeting.quorum_required"
        side_effects:
          - "vote_yes / vote_no / vote_abstain / recused_member_count / absent_member_count / required_yes_votes / vote_outcome written; acted_at = logical clock"
          - "downstream transition on the linked PolicyVersion or WaiverRequest fires per those machines"
      - from: POSTED
        to: TABLED
        trigger: "system: POST /governance/meetings/{id}/adjourn with the item still un-acted"
        actor: system
        preconditions:
          - "parent Meeting transitions OPEN -> ADJOURNED while this item is still POSTED"
        side_effects:
          - "GRANTED PublicComment rows on this item transition to RELEASED and their minutes are credited back to the meeting"
      - from: TABLED
        to: POSTED
        trigger: "system: the item is carried to a later meeting by creating it again is NOT how carry-over works; instead POST /governance/meetings/{id}/notice on a re-noticed meeting re-posts tabled items"
        actor: system
        preconditions:
          - "parent Meeting is re-noticed, which is impossible once ADJOURNED"
        side_effects:
          - "no-op in practice"
        note: "Declared for completeness of the TABLED state; unreachable in the current endpoint surface because ADJOURNED is terminal on the status axis. Tests must not rely on it."
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system: the linked WaiverRequest reaches a terminal status (DENIED, EXPIRED or REVOKED)"
        actor: system
        preconditions:
          - "AgendaItem.waiver_request_id is not null and that WaiverRequest just entered a terminal status"
        side_effects:
          - "GRANTED or REQUESTED PublicComment rows on this item transition to RELEASED with denial_reason = ITEM_WITHDRAWN and their minutes are credited back"
      - from: POSTED
        to: WITHDRAWN
        trigger: "system: the linked WaiverRequest reaches a terminal status (DENIED, EXPIRED or REVOKED)"
        actor: system
        preconditions:
          - "AgendaItem.waiver_request_id is not null and that WaiverRequest just entered a terminal status"
        side_effects:
          - "GRANTED or REQUESTED PublicComment rows on this item transition to RELEASED with denial_reason = ITEM_WITHDRAWN, allotted_minutes reset to 0, Meeting.public_comment_minutes_remaining credited back"

  - entity: PublicComment
    shape: branching
    initial_state: REQUESTED
    terminal_states: [DENIED, RELEASED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "system: POST /governance/meetings/{id}/open runs calculations.public_comment_minute_allocation"
        actor: system
        preconditions:
          - "parent AgendaItem.status == POSTED and requires_public_comment == true"
          - "the allocation assigned this card at least MIN_MINUTES_PER_SPEAKER minutes"
        side_effects:
          - "allotted_minutes written; Meeting.public_comment_minutes_remaining debited by that amount"
      - from: REQUESTED
        to: DENIED
        trigger: "system: POST /governance/meetings/{id}/open runs calculations.public_comment_minute_allocation"
        actor: system
        preconditions:
          - "the allocation could not assign MIN_MINUTES_PER_SPEAKER minutes, or an earlier card on the same meeting carries the identical speaker_name"
        side_effects:
          - "denial_reason = BUDGET_EXHAUSTED or DUPLICATE_SPEAKER; allotted_minutes stays 0; the meeting budget is untouched"
      - from: GRANTED
        to: RELEASED
        trigger: "system: the parent AgendaItem transitions to TABLED or WITHDRAWN"
        actor: system
        preconditions:
          - "parent AgendaItem leaves status POSTED without being ACTED"
        side_effects:
          - "denial_reason = ITEM_WITHDRAWN; allotted_minutes reset to 0; Meeting.public_comment_minutes_remaining credited back by the released amount"
      - from: REQUESTED
        to: RELEASED
        trigger: "system: the parent AgendaItem transitions to WITHDRAWN before the meeting opened"
        actor: system
        preconditions:
          - "parent AgendaItem transitions PROPOSED -> WITHDRAWN or POSTED -> WITHDRAWN before allocation ran"
        side_effects:
          - "denial_reason = ITEM_WITHDRAWN; allotted_minutes stays 0; the meeting budget is unchanged"

  - entity: WaiverRequest
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: BOARD_PENDING
        trigger: "POST /governance/waiver-requests/{id}/committee-recommendation with recommendation == RECOMMEND_GRANT"
        actor: BoardMember
        preconditions:
          - "WaiverRequest.status == SUBMITTED"
          - "the reviewing Committee.status == ACTIVE"
          - "the acting X-User-ID holds a CommitteeAssignment on reviewing_committee_id with status == ACTIVE and role_on_committee == CHAIR"
        side_effects:
          - "committee_recommendation = RECOMMEND_GRANT"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /governance/waiver-requests/{id}/committee-recommendation with recommendation == RECOMMEND_DENY"
        actor: BoardMember
        preconditions:
          - "WaiverRequest.status == SUBMITTED"
          - "the reviewing Committee.status == ACTIVE"
          - "the acting X-User-ID holds a CommitteeAssignment on reviewing_committee_id with status == ACTIVE and role_on_committee == CHAIR"
        side_effects:
          - "committee_recommendation = RECOMMEND_DENY; denial_stage = COMMITTEE"
          - "every AgendaItem referencing this waiver with status IN {PROPOSED, POSTED} transitions to WITHDRAWN"
          - "PublicComment rows on those items transition to RELEASED with denial_reason = ITEM_WITHDRAWN and their minutes are credited back"
        note: "Divergent branch: the same endpoint with a different recommendation value produces a strictly different side-effect set and a terminal rather than an intermediate state."
      - from: BOARD_PENDING
        to: GRANTED
        trigger: "POST /governance/agenda-items/{id}/record-vote on a WAIVER_DECISION item whose vote_outcome == PASSED"
        actor: BoardPresident
        preconditions:
          - "WaiverRequest.status == BOARD_PENDING"
          - "AgendaItem.status == POSTED and its Meeting.status == OPEN"
        side_effects:
          - "granted_start_date / granted_end_date / granted_days written by calculations.waiver_grant_window"
          - "Policy.active_waiver_count is recomputed and calculations.policy_compliance_state phase 2 rewrites Policy.compliance_state"
      - from: BOARD_PENDING
        to: DENIED
        trigger: "POST /governance/agenda-items/{id}/record-vote on a WAIVER_DECISION item whose vote_outcome == FAILED"
        actor: BoardPresident
        preconditions:
          - "WaiverRequest.status == BOARD_PENDING"
        side_effects:
          - "denial_stage = BOARD; granted_start_date / granted_end_date stay null"
          - "no other AgendaItem is withdrawn because the deciding item itself has already reached ACTED"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /governance/waiver-requests/{id}/revoke"
        actor: Superintendent
        preconditions:
          - "WaiverRequest.status == GRANTED"
        side_effects:
          - "CASCADE HOP 1 -> revoked_on = logical clock; granted_end_date rewritten to revoked_on; granted_days recomputed as floor((revoked_on - granted_start_date) / 86400)"
          - "CASCADE HOP 2 -> because the waiver is no longer live, Policy.active_waiver_count is recomputed and calculations.policy_compliance_state phase 2 rewrites Policy.compliance_state"
          - "CASCADE HOP 3 -> because the waiver is now terminal, every AgendaItem with waiver_request_id == this id and status IN {PROPOSED, POSTED} transitions to WITHDRAWN"
          - "CASCADE HOP 4 -> because those agenda items were withdrawn, every PublicComment on them with status IN {REQUESTED, GRANTED} transitions to RELEASED with denial_reason = ITEM_WITHDRAWN, allotted_minutes reset to 0, and Meeting.public_comment_minutes_remaining credited back by exactly the released total"
      - from: GRANTED
        to: EXPIRED
        trigger: "system: POST /governance/compliance-sweeps observes logical_clock_now >= granted_end_date"
        actor: system
        preconditions:
          - "WaiverRequest.status == GRANTED"
          - "logical_clock_now >= granted_end_date"
        side_effects:
          - "Policy.active_waiver_count is recomputed and Policy.compliance_state is rewritten"
          - "every AgendaItem referencing this waiver with status IN {PROPOSED, POSTED} transitions to WITHDRAWN and its PublicComment rows are RELEASED with their minutes credited back"

  - entity: LegalMandate
    shape: branching_with_late_recovery
    initial_state: OPEN
    terminal_states: [SATISFIED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "system: a PolicyVersion is created against the mandate's policy_id"
        actor: system
        preconditions:
          - "LegalMandate.status == OPEN"
          - "the new PolicyVersion.policy_id == LegalMandate.policy_id"
        side_effects:
          - "Policy.open_mandate_count is unchanged (both OPEN and IN_PROGRESS count as open)"
      - from: OPEN
        to: OVERDUE
        trigger: "system: POST /governance/compliance-sweeps observes logical_clock_now >= compliance_deadline"
        actor: system
        preconditions:
          - "LegalMandate.status IN {OPEN, IN_PROGRESS}"
          - "logical_clock_now >= compliance_deadline"
        side_effects:
          - "CASCADE HOP 1 -> days_past_deadline recomputed"
          - "CASCADE HOP 2 -> because a mandate became OVERDUE, Policy.overdue_mandate_count is recomputed and Policy.compliance_state becomes NON_COMPLIANT"
          - "CASCADE HOP 3 -> because Policy.compliance_state changed, every PUBLISHED ManualPublication pinning that policy recomputes compliance_gap_count and flips certification_state CERTIFIED -> LAPSED"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system: POST /governance/compliance-sweeps observes logical_clock_now >= compliance_deadline"
        actor: system
        preconditions:
          - "LegalMandate.status IN {OPEN, IN_PROGRESS}"
          - "logical_clock_now >= compliance_deadline"
        side_effects:
          - "same three-hop cascade as the OPEN -> OVERDUE transition"
      - from: IN_PROGRESS
        to: SATISFIED
        trigger: "system: a PolicyVersion of the mandate's policy reaches ADOPTED with adopted_at >= issued_on"
        actor: system
        preconditions:
          - "LegalMandate.status IN {OPEN, IN_PROGRESS, OVERDUE}"
          - "LegalMandate.required_action IN {ADOPT_NEW, REVISE_EXISTING}"
          - "the adopting version's adopted_at >= LegalMandate.issued_on"
        side_effects:
          - "satisfied_by_version_no = the adopting version's version_no; days_past_deadline reset to 0"
          - "Policy counters and compliance_state are recomputed"
      - from: OPEN
        to: SATISFIED
        trigger: "system: a PolicyVersion of the mandate's policy reaches ADOPTED with adopted_at >= issued_on"
        actor: system
        preconditions:
          - "LegalMandate.status IN {OPEN, IN_PROGRESS, OVERDUE}"
          - "LegalMandate.required_action IN {ADOPT_NEW, REVISE_EXISTING}"
        side_effects:
          - "satisfied_by_version_no set; Policy counters and compliance_state recomputed"
      - from: OVERDUE
        to: SATISFIED
        trigger: "system: a PolicyVersion of the mandate's policy reaches ADOPTED with adopted_at >= issued_on (late compliance)"
        actor: system
        preconditions:
          - "LegalMandate.status == OVERDUE"
          - "LegalMandate.required_action IN {ADOPT_NEW, REVISE_EXISTING}"
        side_effects:
          - "satisfied_by_version_no set; days_past_deadline reset to 0"
          - "Policy.overdue_mandate_count decremented and compliance_state recomputed; PUBLISHED manual editions pinning the policy may flip LAPSED -> CERTIFIED"

  - entity: SuperintendentEvaluation
    shape: cyclic
    initial_state: PLANNING
    terminal_states: [ADOPTED]
    transitions:
      - from: PLANNING
        to: GOALS_SET
        trigger: "POST /governance/superintendent-evaluations/{id}/advance with action == SET_GOALS"
        actor: BoardPresident
        preconditions:
          - "status == PLANNING"
          - "goal_count >= 1"
        side_effects:
          - "ratings submitted from now on are stamped phase = FORMATIVE"
      - from: GOALS_SET
        to: MIDYEAR_REVIEW
        trigger: "POST /governance/superintendent-evaluations/{id}/advance with action == MIDYEAR"
        actor: BoardPresident
        preconditions:
          - "status == GOALS_SET"
          - "rating_count >= 1"
        side_effects:
          - "midyear_formative_score written by calculations.evaluation_composite_score variant midyear_formative"
      - from: MIDYEAR_REVIEW
        to: SUMMATIVE_DRAFT
        trigger: "POST /governance/superintendent-evaluations/{id}/advance with action == DRAFT_SUMMATIVE"
        actor: BoardPresident
        preconditions:
          - "status == MIDYEAR_REVIEW"
        side_effects:
          - "ratings submitted from now on are stamped phase = SUMMATIVE"
      - from: SUMMATIVE_DRAFT
        to: GOALS_SET
        trigger: "POST /governance/superintendent-evaluations/{id}/advance with action == REOPEN"
        actor: BoardPresident
        preconditions:
          - "status == SUMMATIVE_DRAFT"
        side_effects:
          - "reopen_count incremented by 1; summative_composite_score reset to null; midyear_formative_score retained"
        note: "The cycle. A reopened evaluation re-enters GOALS_SET and must climb the ladder again, so ratings can be added and the composite recomputed."
      - from: SUMMATIVE_DRAFT
        to: ADOPTED
        trigger: "POST /governance/superintendent-evaluations/{id}/advance with action == ADOPT"
        actor: BoardPresident
        preconditions:
          - "status == SUMMATIVE_DRAFT"
          - "rating_count >= 1"
          - "eligible_rater_count >= 1"
        side_effects:
          - "summative_composite_score written by calculations.evaluation_composite_score variant summative_final; adopted_at = logical clock"

  - entity: ManualPublication
    shape: linear_with_supersede
    initial_state: BUILDING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: BUILDING
        to: PUBLISHED
        trigger: "POST /governance/manual-publications/{id}/publish"
        actor: PolicyAnalyst
        preconditions:
          - "status == BUILDING"
          - "at least one Policy has status == ADOPTED"
        side_effects:
          - "pinned_entries / entry_count / compliance_gap_count written by calculations.manual_publication_snapshot; published_at = logical clock"
          - "certification_state = CERTIFIED when compliance_gap_count == 0, else LAPSED"
          - "every other ManualPublication with status == PUBLISHED transitions to SUPERSEDED with superseded_by_label = this publication_label"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: a newer ManualPublication is published"
        actor: system
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "superseded_by_label = the newer edition's publication_label; pinned_entries are retained verbatim as the historical record"

  - entity: BoardMember
    shape: branching
    initial_state: SEATED
    terminal_states: [RESIGNED, TERM_EXPIRED]
    transitions:
      - from: SEATED
        to: RESIGNED
        trigger: "POST /governance/board-members/{id}/resign"
        actor: BoardClerk
        preconditions:
          - "status == SEATED"
        side_effects:
          - "CASCADE HOP 1 -> status = RESIGNED"
          - "CASCADE HOP 2 -> because the trustee left the board, every CommitteeAssignment of this member with status IN {ACTIVE, RECUSED} transitions to REMOVED with removed_on = logical clock"
          - "CASCADE HOP 3 -> because those seats emptied, each affected Committee recomputes filled_seat_count / voting_seat_count / vacant_seat_count and flips ACTIVE -> INQUORATE when voting_seat_count < quorum_size"
          - "CASCADE HOP 4 -> because the trustee can no longer vote, every ConflictDisclosure of this member with status == RECUSAL_REQUIRED transitions to CLEARED with cleared_on = logical clock, and open_recusal_count drops to 0"
      - from: SEATED
        to: TERM_EXPIRED
        trigger: "system: POST /governance/compliance-sweeps observes logical_clock_now >= term_end_date"
        actor: system
        preconditions:
          - "status == SEATED"
          - "logical_clock_now >= term_end_date"
        side_effects:
          - "every CommitteeAssignment of this member with status IN {ACTIVE, RECUSED} transitions to REMOVED and the affected committees recompute their seat counters and posture"
          - "ConflictDisclosure rows of this member with status == RECUSAL_REQUIRED are NOT cleared, because an expired term does not retroactively dissolve a disclosed interest"
        note: "Deliberate asymmetry with the resignation cascade: the disclosure hop fires on RESIGNED but not on TERM_EXPIRED."

  - entity: CommitteeAssignment
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: RECUSED
        trigger: "POST /governance/committee-assignments/{id}/status with action == RECUSE"
        actor: BoardClerk
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Committee.voting_seat_count decremented; filled_seat_count unchanged; Committee flips ACTIVE -> INQUORATE when voting_seat_count < quorum_size"
      - from: RECUSED
        to: ACTIVE
        trigger: "POST /governance/committee-assignments/{id}/status with action == REINSTATE"
        actor: BoardClerk
        preconditions:
          - "status == RECUSED"
          - "the trustee's BoardMember.status == SEATED"
        side_effects:
          - "Committee.voting_seat_count incremented; Committee flips INQUORATE -> ACTIVE when voting_seat_count >= quorum_size"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /governance/committee-assignments/{id}/status with action == REMOVE"
        actor: BoardClerk
        preconditions:
          - "status IN {ACTIVE, RECUSED}"
        side_effects:
          - "removed_on = logical clock; Committee.filled_seat_count and voting_seat_count decremented, vacant_seat_count incremented so that seat_capacity == filled_seat_count + vacant_seat_count still holds"
      - from: RECUSED
        to: REMOVED
        trigger: "POST /governance/committee-assignments/{id}/status with action == REMOVE"
        actor: BoardClerk
        preconditions:
          - "status IN {ACTIVE, RECUSED}"
        side_effects:
          - "removed_on = logical clock; Committee.filled_seat_count decremented and vacant_seat_count incremented"

  - entity: ConflictDisclosure
    shape: linear
    initial_state: RECUSAL_REQUIRED
    terminal_states: [CLEARED]
    transitions:
      - from: RECUSAL_REQUIRED
        to: CLEARED
        trigger: "POST /governance/conflict-disclosures/{id}/clear"
        actor: BoardPresident
        preconditions:
          - "status IN {RECUSAL_REQUIRED, ADVISORY_ONLY}"
          - "no AgendaItem linked to this policy is currently POSTED on a Meeting with status == OPEN"
        side_effects:
          - "cleared_on = logical clock; BoardMember.open_recusal_count recomputed"
      - from: ADVISORY_ONLY
        to: CLEARED
        trigger: "POST /governance/conflict-disclosures/{id}/clear"
        actor: BoardPresident
        preconditions:
          - "status IN {RECUSAL_REQUIRED, ADVISORY_ONLY}"
        side_effects:
          - "cleared_on = logical clock"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: policy-version-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /governance/policies/{id}/versions"
    occ_field: "expected_policy_version"
    description: |
      Drafting a new PolicyVersion against a Policy whose version has advanced since the client
      last observed it is rejected. The product deliberately allows more than one DRAFT version to
      coexist on a policy, so a second drafting request is legitimate on its own terms; the stale
      expected_policy_version is what tells the server the author was working from a policy record
      that has since changed (a newer draft, an adoption, a mandate satisfaction, or a compliance
      recompute).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: agenda-item-create-stale-meeting
    parent_entity: Meeting
    write_endpoint: "POST /governance/agenda-items"
    occ_field: "expected_meeting_version"
    description: |
      Adding an item to an agenda whose Meeting.version has advanced since the client last read it
      is rejected. Adding a second item is a legitimate operation in its own right, so this is not a
      state precondition; the stale expected_meeting_version records that the clerk was composing
      against an agenda snapshot that no longer reflects the meeting (another item was inserted, or
      the notice was posted and the agenda locked).
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: public_comment_minute_allocation
    trigger: "POST /governance/meetings/{id}/open (Meeting NOTICED -> OPEN); writes PublicComment.status, PublicComment.allotted_minutes, Meeting.public_comment_minutes_remaining and Meeting.public_comment_allocation_variant"
    algorithm: waterfall_allocation
    input_set: |
      Every PublicComment row whose status == REQUESTED and whose parent AgendaItem satisfies
      AgendaItem.meeting_id == this Meeting.id AND AgendaItem.status == POSTED AND
      AgendaItem.requires_public_comment == true. Cards on PROPOSED, TABLED, ACTED or WITHDRAWN
      items are excluded. The set is ordered by submitted_at ASC; ties are broken by created_at ASC
      and, if still tied, by speaker_name ASC (lexicographic, case-sensitive). Row `id` is never
      consulted.
    constants:
      PUBLIC_COMMENT_BUDGET_MINUTES_REGULAR: 30
      PUBLIC_COMMENT_BUDGET_MINUTES_SPECIAL: 5
      PUBLIC_COMMENT_BUDGET_MINUTES_EMERGENCY: 0
      MAX_MINUTES_PER_SPEAKER: 3
      MIN_MINUTES_PER_SPEAKER: 1
      EQUAL_SPLIT_THRESHOLD: 4
      MAX_SPEAKERS_PER_ITEM: 5
    precision: "whole minutes only; every intermediate share is floored, never rounded"
    formula: |
      budget = PUBLIC_COMMENT_BUDGET_MINUTES_<meeting.meeting_type>
      cards  = input_set ordered as described above

      # PASS 0 -- duplicate suppression, runs before either variant
      seen = {}
      for card in cards:
          if card.speaker_name in seen:
              card.status = DENIED; card.denial_reason = DUPLICATE_SPEAKER; card.allotted_minutes = 0
              drop card from cards
          else:
              seen.add(card.speaker_name)

      n = len(cards)
      # PASS 1 -- variant selection
      variant = EQUAL_SPLIT if (meeting.public_comment_rule == EQUAL_SPLIT or n >= EQUAL_SPLIT_THRESHOLD)
                else FIRST_COME_CAPPED
      meeting.public_comment_allocation_variant = variant

      # PASS 2 -- allocation
      remaining = budget
      if variant == FIRST_COME_CAPPED:
          for card in cards:                     # strict submitted_at ASC order
              grant = min(card.requested_minutes, MAX_MINUTES_PER_SPEAKER, remaining)
              if grant >= MIN_MINUTES_PER_SPEAKER:
                  card.status = GRANTED; card.allotted_minutes = grant; remaining -= grant
              else:
                  card.status = DENIED; card.denial_reason = BUDGET_EXHAUSTED; card.allotted_minutes = 0
      else:                                      # EQUAL_SPLIT -- requested_minutes is IGNORED
          base = floor(budget / n)               # ROUNDING ORDER IS PINNED: floor FIRST
          capped_base = min(base, MAX_MINUTES_PER_SPEAKER)
          if capped_base == 0:
              for i, card in enumerate(cards):
                  if i < budget:
                      card.status = GRANTED; card.allotted_minutes = MIN_MINUTES_PER_SPEAKER
                      remaining -= MIN_MINUTES_PER_SPEAKER
                  else:
                      card.status = DENIED; card.denial_reason = BUDGET_EXHAUSTED
          else:
              for card in cards:
                  card.status = GRANTED; card.allotted_minutes = capped_base
                  remaining -= capped_base
              # SINGLE sweep of the integer remainder, in the same submitted_at ASC order
              for card in cards:
                  if remaining == 0: break
                  if card.allotted_minutes < MAX_MINUTES_PER_SPEAKER:
                      card.allotted_minutes += 1
                      remaining -= 1
              # minutes still unassigned after the single sweep stay in `remaining`;
              # they are NOT redistributed in a second sweep

      meeting.public_comment_minutes_remaining = remaining
    variants:
      - name: first_come_capped
        when: "meeting.public_comment_rule == FIRST_COME_CAPPED AND the post-duplicate card count is strictly below EQUAL_SPLIT_THRESHOLD"
        difference: |
          Honours each speaker's requested_minutes as an upper bound, so a speaker who asked for one
          minute receives exactly one minute and the rest of the budget stays unspent. Later cards
          can be starved entirely once the budget runs out.
      - name: equal_split
        when: "meeting.public_comment_rule == EQUAL_SPLIT OR the post-duplicate card count is >= EQUAL_SPLIT_THRESHOLD"
        difference: |
          Ignores requested_minutes completely and hands every speaker the same floored share
          (capped at MAX_MINUTES_PER_SPEAKER), then walks the integer remainder out one minute at a
          time in submitted_at ASC order. On identical card data this produces strictly larger
          per-speaker allotments and a strictly smaller Meeting.public_comment_minutes_remaining
          than first_come_capped whenever the speakers asked for less than their equal share.

  - name: evaluation_composite_score
    trigger: "POST /governance/superintendent-evaluations/{id}/advance -- action MIDYEAR writes midyear_formative_score, action ADOPT writes summative_composite_score"
    algorithm: weighted_scoring
    input_set: |
      EvaluationRating rows whose evaluation_id == this SuperintendentEvaluation.id. The two
      variants filter that set differently -- see each variant's `when` and `difference`.
    constants:
      SCORE_MIN: 1.00
      SCORE_MAX: 5.00
      DOMAINS: "INSTRUCTIONAL_LEADERSHIP, FISCAL_STEWARDSHIP, COMMUNITY_RELATIONS, GOVERNANCE_SUPPORT"
    precision: "2 decimal places, round_half_up, applied exactly where the formula says and nowhere else"
    formula: |
      # ---- variant midyear_formative (action MIDYEAR) ----
      rows_f = [r for r in ratings
                if r.phase == FORMATIVE
                and BoardMember(r.board_member_id).status == SEATED]
      if len(rows_f) == 0: raise ERR_NO_RATINGS_SUBMITTED
      midyear_formative_score = clamp(round_half_up(sum(r.score for r in rows_f) / len(rows_f), 2),
                                      SCORE_MIN, SCORE_MAX)
      # every domain is pooled together; the weights are NOT used

      # ---- variant summative_final (action ADOPT) ----
      rows_s = [r for r in ratings
                if BoardMember(r.board_member_id).status == SEATED
                and BoardMember(r.board_member_id).term_end_date >= evaluation.window_end_date]
      # BOTH phases participate: a FORMATIVE rating still counts toward the summative composite
      if len(rows_s) == 0: raise ERR_NO_RATINGS_SUBMITTED
      weight_of = { INSTRUCTIONAL_LEADERSHIP: weight_instructional,
                    FISCAL_STEWARDSHIP:       weight_fiscal,
                    COMMUNITY_RELATIONS:      weight_community,
                    GOVERNANCE_SUPPORT:       weight_governance }
      present   = [d for d in DOMAINS if any(r.domain == d for r in rows_s)]
      # ROUNDING ORDER IS PINNED: round each domain mean to 2dp FIRST, then weight, then
      # normalise, then round the final composite to 2dp. Never round only once at the end.
      domain_mean = { d: round_half_up(mean(r.score for r in rows_s if r.domain == d), 2)
                      for d in present }
      weighted    = sum(weight_of[d] * domain_mean[d] for d in present)
      weight_sum  = sum(weight_of[d] for d in present)      # renormalisation over present domains
      summative_composite_score = clamp(round_half_up(weighted / weight_sum, 2),
                                        SCORE_MIN, SCORE_MAX)
    variants:
      - name: midyear_formative
        when: "the MIDYEAR advance action (GOALS_SET -> MIDYEAR_REVIEW)"
        difference: |
          Pools every FORMATIVE rating into one unweighted arithmetic mean, ignores the four rubric
          weights entirely, and applies no term-expiry eligibility filter. Only SEATED status is
          checked.
      - name: summative_final
        when: "the ADOPT advance action (SUMMATIVE_DRAFT -> ADOPTED)"
        difference: |
          Takes a per-domain mean, weights the domain means by the rubric weights, renormalises over
          the domains that actually received a rating, and additionally excludes trustees whose
          term_end_date falls before the evaluation window closes. On identical rating rows this
          yields a strictly different number from midyear_formative whenever the ratings are not
          evenly distributed across domains.

  - name: policy_compliance_state
    trigger: |
      Runs on every event that can move a mandate, an adoption, or a waiver: the PolicyVersion
      adoption cascade (both the regular and the emergency branch), the WaiverRequest GRANTED /
      REVOKED / EXPIRED transitions, and POST /governance/compliance-sweeps. Writes
      LegalMandate.status, LegalMandate.days_past_deadline, Policy.open_mandate_count,
      Policy.overdue_mandate_count, Policy.active_waiver_count, Policy.compliance_state,
      ManualPublication.compliance_gap_count and ManualPublication.certification_state.
    algorithm: constraint_propagation
    input_set: |
      For a single Policy P: every LegalMandate whose policy_id == P.id, every WaiverRequest whose
      policy_id == P.id, and every ManualPublication with status == PUBLISHED whose pinned_entries
      contains an object with policy_id == P.id.
    constants:
      REVIEW_CYCLE_DAYS: 1095
    precision: "integer day arithmetic; all comparisons against the logical clock, never wall-clock"
    formula: |
      # THE EVALUATION ORDER IS PINNED AS THREE ONE-WAY PHASES. Phase 3 depends on phase 2 which
      # depends on phase 1, and NO phase may be re-entered inside the same event -- this is what
      # makes the apparent circularity (a publication's certification depends on a policy whose
      # adopted version the publication itself pinned) well defined.

      # PHASE 1 -- mandate refresh (only the compliance sweep may move a mandate to OVERDUE)
      for m in mandates(P):
          if m.status in {OPEN, IN_PROGRESS} and clock_now >= m.compliance_deadline:
              m.status = OVERDUE
          if m.status == SATISFIED:
              m.days_past_deadline = 0
          elif clock_now >= m.compliance_deadline:
              m.days_past_deadline = floor((clock_now - m.compliance_deadline) / 86400)
          else:
              m.days_past_deadline = 0

      # PHASE 2 -- policy aggregate (reads phase-1 output only)
      P.open_mandate_count    = count(m for m in mandates(P) if m.status in {OPEN, IN_PROGRESS})
      P.overdue_mandate_count = count(m for m in mandates(P) if m.status == OVERDUE)
      P.active_waiver_count   = count(w for w in waivers(P)
                                      if w.status == GRANTED and w.granted_end_date > clock_now)
      if   P.overdue_mandate_count > 0:                       P.compliance_state = NON_COMPLIANT
      elif P.open_mandate_count > 0:                          P.compliance_state = ACTION_REQUIRED
      elif P.status == UNADOPTED
           and P.legal_requirement_level == REQUIRED_BY_LAW:  P.compliance_state = ACTION_REQUIRED
      elif P.last_review_date is not null
           and floor((clock_now - P.last_review_date) / 86400) > REVIEW_CYCLE_DAYS:
                                                              P.compliance_state = ACTION_REQUIRED
      else:                                                   P.compliance_state = COMPLIANT

      # PHASE 3 -- publication reconciliation (reads phase-2 output only)
      for pub in published_publications_pinning(P):
          pub.compliance_gap_count = count(e for e in pub.pinned_entries
                                           if Policy(e.policy_id).compliance_state != COMPLIANT)
          pub.certification_state  = CERTIFIED if pub.compliance_gap_count == 0 else LAPSED
    variants:
      - name: sweep_scoped
        when: "invoked from POST /governance/compliance-sweeps"
        difference: "Phases 1-3 run for every Policy in the system, in code ASC order."
      - name: policy_scoped
        when: "invoked from an adoption, grant, revoke or expiry cascade"
        difference: |
          Phases 1-3 run for the single affected Policy only. Phase 1 does NOT move any mandate to
          OVERDUE in this scope -- only the sweep may do that -- so a mandate whose deadline has
          quietly passed stays OPEN until the next sweep even though the clock is past it.

  - name: vote_tally_outcome
    trigger: "POST /governance/agenda-items/{id}/record-vote; writes AgendaItem.vote_yes / vote_no / vote_abstain / recused_member_count / absent_member_count / required_yes_votes / vote_outcome"
    algorithm: threshold
    input_set: |
      The three id arrays supplied in the request body, the frozen
      Meeting.seated_member_count_snapshot, the frozen Meeting.attending_member_ids, and every
      ConflictDisclosure with status == RECUSAL_REQUIRED whose policy_id equals the policy behind
      this item (PolicyVersion.policy_id for reading items, WaiverRequest.policy_id for
      WAIVER_DECISION items, and no policy at all for SUPERINTENDENT_EVALUATION / CONSENT items).
    constants:
      SUPERMAJORITY_NUMERATOR: 2
      SUPERMAJORITY_DENOMINATOR: 3
    precision: "integer arithmetic; ceil for the supermajority threshold, floor for the simple-majority threshold"
    formula: |
      vote_yes      = len(yes_member_ids)
      vote_no       = len(no_member_ids)
      vote_abstain  = len(abstain_member_ids)
      votes_cast    = vote_yes + vote_no + vote_abstain
      snapshot      = meeting.seated_member_count_snapshot

      recused_member_count = count(m for m in meeting.attending_member_ids
                                   if item_policy_id is not null
                                   and exists ConflictDisclosure(board_member_id = m,
                                                                 policy_id = item_policy_id,
                                                                 status = RECUSAL_REQUIRED))
      absent_member_count  = snapshot - (vote_yes + vote_no + vote_abstain + recused_member_count)

      if   item.item_type == POLICY_SECOND_READING
           and Policy(item_policy_id).legal_requirement_level == REQUIRED_BY_LAW:
               required_yes_votes = ceil(SUPERMAJORITY_NUMERATOR * snapshot / SUPERMAJORITY_DENOMINATOR)
      elif item.item_type == POLICY_SECOND_READING:
               required_yes_votes = floor(snapshot / 2) + 1
      elif item.item_type == WAIVER_DECISION:
               required_yes_votes = floor(snapshot / 2) + 1
      else:  # POLICY_FIRST_READING, SUPERINTENDENT_EVALUATION, CONSENT
               required_yes_votes = floor(votes_cast / 2) + 1

      vote_outcome = PASSED if vote_yes >= required_yes_votes else FAILED

      # emergency second-reading waiver -- evaluated only after vote_outcome == PASSED
      emergency_adoption = (item.item_type == POLICY_FIRST_READING
                            and meeting.meeting_type == EMERGENCY
                            and vote_yes >= snapshot - 1)
    variants:
      - name: attendance_majority
        when: "POLICY_FIRST_READING, SUPERINTENDENT_EVALUATION and CONSENT items"
        difference: "The denominator is votes actually cast, so abstentions raise the bar while absences do not."
      - name: seated_body_threshold
        when: "POLICY_SECOND_READING and WAIVER_DECISION items"
        difference: |
          The denominator is the frozen seated_member_count_snapshot, so absences and abstentions
          both count against the motion. REQUIRED_BY_LAW policies additionally need a two-thirds
          supermajority of the whole seated body rather than a simple majority.

  - name: waiver_grant_window
    trigger: "POST /governance/waiver-requests writes max_allowed_days; the WaiverRequest BOARD_PENDING -> GRANTED transition writes granted_start_date / granted_end_date / granted_days; the GRANTED -> REVOKED transition rewrites granted_end_date and granted_days"
    algorithm: interval_merge
    input_set: |
      The single WaiverRequest being written, the logical clock, and the linked
      Policy.legal_requirement_level. Windows are half-open: [start, end).
    constants:
      WAIVER_MAX_DAYS_REQUIRED_BY_LAW: 90
      WAIVER_MAX_DAYS_RECOMMENDED: 180
      WAIVER_MAX_DAYS_LOCAL_DISCRETION: 365
    precision: "integer days via floor(seconds / 86400); no partial days"
    formula: |
      # at creation
      max_allowed_days = WAIVER_MAX_DAYS_<policy.legal_requirement_level>
      requested_days   = floor((requested_end_date - requested_start_date) / 86400)
      if requested_days <= 0:                  raise ERR_INVALID_WAIVER_WINDOW
      if requested_days > max_allowed_days:    raise ERR_WAIVER_DURATION_EXCEEDS_CAP

      # at grant
      granted_start_date = max(requested_start_date, clock_now)
      granted_end_date   = requested_end_date
      granted_days       = max(0, floor((granted_end_date - granted_start_date) / 86400))

      # at revoke
      granted_end_date   = clock_now
      granted_days       = max(0, floor((granted_end_date - granted_start_date) / 86400))
    variants:
      - name: forward_dated_grant
        when: "clock_now < requested_start_date at the moment the board grants"
        difference: "granted_start_date equals requested_start_date and granted_days equals the full requested span."
      - name: clipped_grant
        when: "clock_now >= requested_start_date at the moment the board grants"
        difference: "granted_start_date is pulled forward to clock_now, so granted_days is strictly less than the requested span."

  - name: manual_publication_snapshot
    trigger: "POST /governance/manual-publications/{id}/publish (BUILDING -> PUBLISHED); writes pinned_entries, entry_count, compliance_gap_count, certification_state"
    algorithm: projection
    input_set: |
      Every Policy whose status == ADOPTED and whose adopted_version_no is not null, at the instant
      of publication. UNADOPTED policies are excluded entirely. Ordered by manual_section ASC then
      code ASC (both lexicographic, case-sensitive); Policy.id never participates in the ordering.
    constants: {}
    precision: "integer counts"
    formula: |
      entries = []
      for p in adopted_policies ordered by (manual_section ASC, code ASC):
          entries.append({ policy_id:      p.id,
                           policy_code:    p.code,
                           version_no:     p.adopted_version_no,   # VERSION PINNING happens here
                           manual_section: p.manual_section })
      pinned_entries       = entries
      entry_count          = len(entries)
      compliance_gap_count = count(e for e in entries
                                   if Policy(e.policy_id).compliance_state != COMPLIANT)
      certification_state  = CERTIFIED if compliance_gap_count == 0 else LAPSED
      published_at         = clock_now
      # pinned_entries[*].version_no is frozen: a later adoption on the same policy changes
      # Policy.adopted_version_no but NEVER rewrites an already-published edition's entry.
      # compliance_gap_count and certification_state, by contrast, ARE live and are recomputed by
      # calculations.policy_compliance_state phase 3 whenever a pinned policy's posture moves.
    variants:
      - name: first_edition
        when: "no other ManualPublication has status == PUBLISHED"
        difference: "No supersede cascade fires; superseded_by_label stays null on every row."
      - name: superseding_edition
        when: "another ManualPublication already has status == PUBLISHED"
        difference: |
          The prior edition transitions PUBLISHED -> SUPERSEDED with superseded_by_label set to this
          edition's publication_label, and keeps its own pinned_entries verbatim as the historical
          record of what the manual said at that time.

  - name: disclosure_recusal_classification
    trigger: "POST /governance/conflict-disclosures; writes ConflictDisclosure.status and refreshes BoardMember.open_recusal_count"
    algorithm: constraint_propagation
    input_set: "The submitted `nature` value and the linked Policy.category. No other row participates."
    constants: {}
    precision: "exact enum match"
    formula: |
      if   nature in {FINANCIAL, VENDOR}:                        status = RECUSAL_REQUIRED
      elif nature == EMPLOYMENT and policy.category == PERSONNEL: status = RECUSAL_REQUIRED
      elif nature == FAMILIAL   and policy.category == STUDENTS:  status = RECUSAL_REQUIRED
      else:                                                       status = ADVISORY_ONLY
      board_member.open_recusal_count = count(d for d in disclosures(board_member)
                                              if d.status == RECUSAL_REQUIRED)
    variants:
      - name: categorical_recusal
        when: "nature IN {FINANCIAL, VENDOR}"
        difference: "Recusal is required regardless of which policy the interest touches."
      - name: contextual_recusal
        when: "nature IN {EMPLOYMENT, FAMILIAL}"
        difference: |
          Recusal turns on the linked Policy.category: EMPLOYMENT recuses only on PERSONNEL
          policies and FAMILIAL only on STUDENTS policies. On any other category the same
          disclosure lands as ADVISORY_ONLY and the trustee may still vote.

# ---------------------------------------------------------------------------
# 1.3.1 Global invariants (compensating-action conservation)
# ---------------------------------------------------------------------------
invariants:
  - name: public_comment_minute_conservation
    conserved_quantity: "public-comment minutes on a Meeting"
    formula: |
      Meeting.public_comment_minutes_budget
        == Meeting.public_comment_minutes_remaining
         + SUM(PublicComment.allotted_minutes
               WHERE PublicComment.agenda_item_id IN (SELECT id FROM AgendaItem
                                                      WHERE meeting_id == Meeting.id)
                 AND PublicComment.status == 'GRANTED')
    forward_action: "POST /governance/meetings/{id}/open -- the allocation debits the budget by every granted minute"
    compensating_action: "POST /governance/waiver-requests/{id}/revoke (or adjourn) -- the withdrawal cascade releases the granted cards and credits every released minute back"
    note: "The identity must hold before the forward action, after it, and after the compensating action, with zero drift."

  - name: committee_seat_conservation
    conserved_quantity: "seats on a Committee"
    formula: |
      Committee.seat_capacity == Committee.filled_seat_count + Committee.vacant_seat_count
      AND Committee.filled_seat_count == COUNT(CommitteeAssignment
                                               WHERE committee_id == Committee.id
                                                 AND status IN {ACTIVE, RECUSED})
    forward_action: "POST /governance/committee-assignments -- filled_seat_count +1, vacant_seat_count -1"
    compensating_action: "POST /governance/committee-assignments/{id}/status with action == REMOVE -- filled_seat_count -1, vacant_seat_count +1"
    note: "RECUSE / REINSTATE move voting_seat_count only and must leave both sides of the identity untouched."

  - name: vote_ledger_conservation
    conserved_quantity: "trustee headcount on an ACTED AgendaItem"
    formula: |
      AgendaItem.vote_yes + AgendaItem.vote_no + AgendaItem.vote_abstain
        + AgendaItem.recused_member_count + AgendaItem.absent_member_count
        == Meeting.seated_member_count_snapshot
    forward_action: "POST /governance/agenda-items/{id}/record-vote"
    compensating_action: "none -- the ledger is written once and frozen; the invariant is the audit check on the write"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in the RBAC matrix, and X-User-ID is present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's `roles:` list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Every resource id embedded in the URL path exists, validated left to right. The first missing segment decides the error."
    error_id: "ERR_BOARD_MEMBER_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_DISCLOSURE_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_POLICY_VERSION_NOT_FOUND | ERR_MANDATE_NOT_FOUND | ERR_MEETING_NOT_FOUND | ERR_AGENDA_ITEM_NOT_FOUND | ERR_WAIVER_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_PUBLICATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 10
    category: business_constraint
    check: |
      Request body shape: every required field present; every field of the declared type; every enum
      value a member of its declared set; every numeric field inside its declared range
      (seat_number 1..15, seat_capacity 3..9, quorum_size 2..seat_capacity, requested_minutes 1..5,
      score 1..5, goal_count 1..10, cycle_year 2020..2100, limit 1..100, offset >= 0); every
      datetime a valid ISO 8601 UTC instant; term_end_date > term_start_date;
      compliance_deadline > issued_on; requested_end_date > requested_start_date;
      window_end_date > window_start_date and window_start_date < midyear_checkpoint_date < window_end_date;
      the four evaluation weights each 0.00..1.00; committee_id present exactly when scope == COMMITTEE;
      policy_version_id present exactly when item_type IN {POLICY_FIRST_READING, POLICY_SECOND_READING};
      waiver_request_id present exactly when item_type == WAIVER_DECISION;
      approving_meeting_id present exactly when action == APPROVE.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint that accepts a body or query parameters"

  - priority: 12
    category: business_constraint
    check: "The four evaluation weights sum to exactly 1.00."
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /governance/superintendent-evaluations"

  - priority: 15
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in declaration order of the endpoint's `input:` list."
    error_id: "ERR_BOARD_MEMBER_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_POLICY_VERSION_NOT_FOUND | ERR_MEETING_NOT_FOUND | ERR_AGENDA_ITEM_NOT_FOUND | ERR_WAIVER_NOT_FOUND | ERR_EVALUATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint whose body carries a foreign key"

  - priority: 20
    category: auth
    check: |
      For roles whose identity is entity_backed, X-User-ID must equal the id of the BoardMember the
      operation acts for: the disclosing trustee on POST /governance/conflict-disclosures, the rating
      trustee on POST /governance/evaluation-ratings, and the committee CHAIR on
      POST /governance/waiver-requests/{id}/committee-recommendation. For BoardPresident, X-User-ID
      must be a BoardMember with status == SEATED and office == PRESIDENT.
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /governance/conflict-disclosures, POST /governance/evaluation-ratings, POST /governance/waiver-requests/{id}/committee-recommendation, and every BoardPresident-only endpoint"

  - priority: 25
    category: business_constraint
    check: "The supplied expected_<parent>_version equals the parent's current version field (see concurrency_rules)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /governance/policies/{id}/versions, POST /governance/agenda-items"

  - priority: 30
    category: business_constraint
    check: |
      Scoped uniqueness: Policy.code globally unique; LegalMandate.notice_code globally unique;
      ManualPublication.publication_label globally unique; SuperintendentEvaluation.cycle_year
      globally unique; BoardMember.seat_number unique among SEATED trustees; at most one SEATED
      trustee with office == PRESIDENT; at most one CommitteeAssignment with status IN
      {ACTIVE, RECUSED} per (committee_id, board_member_id) pair; at most one ACTIVE CHAIR per
      committee; at most one EvaluationRating per (evaluation_id, board_member_id, domain, phase).
    error_id: "ERR_DUPLICATE_POLICY_CODE | ERR_DUPLICATE_NOTICE_CODE | ERR_DUPLICATE_PUBLICATION_LABEL | ERR_DUPLICATE_EVALUATION_CYCLE | ERR_DUPLICATE_SEAT_NUMBER | ERR_DUPLICATE_ASSIGNMENT | ERR_DUPLICATE_RATING"
    http_status: 409
    applies_to: "every create endpoint carrying a uniqueness constraint"

  - priority: 40
    category: state
    check: "The target resource named in the path is in a state from which this transition is declared in section 1.2."
    error_id: "ERR_INVALID_MEETING_STATE | ERR_INVALID_MINUTES_STATE | ERR_AGENDA_ITEM_NOT_POSTED | ERR_POLICY_VERSION_NOT_ELIGIBLE | ERR_WAIVER_NOT_IN_REVIEW | ERR_EVALUATION_STAGE_INVALID | ERR_PUBLICATION_ALREADY_PUBLISHED | ERR_MEMBER_NOT_SEATED | ERR_ASSIGNMENT_STATE_INVALID | ERR_DISCLOSURE_ALREADY_CLEARED"
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"

  - priority: 42
    category: state
    check: "The parent Meeting of the agenda item being voted on has status == OPEN."
    error_id: ERR_MEETING_NOT_OPEN
    http_status: 409
    applies_to: "POST /governance/agenda-items/{id}/record-vote"

  - priority: 44
    category: state
    check: "The Meeting a public-comment card is being filed against has status IN {DRAFT, NOTICED} -- speaker sign-up closes the moment the meeting is called to order."
    error_id: ERR_PUBLIC_COMMENT_CLOSED
    http_status: 409
    applies_to: "POST /governance/agenda-items/{id}/public-comments"

  - priority: 45
    category: state
    check: |
      Cross-entity state preconditions. The reviewing Committee.status == ACTIVE before a committee
      recommendation is accepted; the linked PolicyVersion.status == DRAFT for a POLICY_FIRST_READING
      vote and == FIRST_READING_PASSED for a POLICY_SECOND_READING vote; the linked
      WaiverRequest.status == BOARD_PENDING for a WAIVER_DECISION vote; the trustee submitting an
      evaluation rating has BoardMember.status == SEATED.
    error_id: "ERR_COMMITTEE_INQUORATE | ERR_POLICY_VERSION_NOT_ELIGIBLE | ERR_WAIVER_NOT_IN_REVIEW | ERR_MEMBER_NOT_SEATED"
    http_status: 409
    applies_to: "POST /governance/waiver-requests/{id}/committee-recommendation, POST /governance/agenda-items/{id}/record-vote, POST /governance/evaluation-ratings"

  - priority: 50
    category: business_safety
    check: "Open-meeting notice: scheduled_start_utc minus the logical clock is at least NOTICE_LEAD_HOURS for the meeting_type (72h REGULAR, 48h SPECIAL, 24h EMERGENCY). Inclusive: exactly the lead time passes."
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /governance/meetings/{id}/notice"

  - priority: 51
    category: business_safety
    check: "No trustee id supplied in yes_member_ids, no_member_ids or abstain_member_ids holds a ConflictDisclosure with status == RECUSAL_REQUIRED on the policy behind this agenda item."
    error_id: ERR_RECUSED_MEMBER_VOTED
    http_status: 422
    applies_to: "POST /governance/agenda-items/{id}/record-vote"

  - priority: 52
    category: business_safety
    check: "vote_yes + vote_no + vote_abstain + recused_member_count is at least Meeting.quorum_required, and at open, len(attending_member_ids) is at least quorum_required."
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /governance/meetings/{id}/open, POST /governance/agenda-items/{id}/record-vote"

  - priority: 53
    category: business_safety
    check: "A POLICY_SECOND_READING vote may not be held at the same meeting that held the first reading: AgendaItem.meeting_id != PolicyVersion.first_reading_meeting_id. This outranks the minutes rule, because a same-meeting second reading is void no matter what the minutes say."
    error_id: ERR_SECOND_READING_SAME_MEETING
    http_status: 422
    applies_to: "POST /governance/agenda-items/{id}/record-vote"

  - priority: 54
    category: business_safety
    check: "A POLICY_SECOND_READING vote requires that the Meeting identified by the linked PolicyVersion.first_reading_meeting_id has minutes_status == APPROVED."
    error_id: ERR_MINUTES_NOT_APPROVED
    http_status: 422
    applies_to: "POST /governance/agenda-items/{id}/record-vote"

  - priority: 55
    category: business_safety
    check: "Every trustee id in the three vote arrays appears in the frozen Meeting.attending_member_ids."
    error_id: ERR_VOTER_NOT_IN_ATTENDANCE
    http_status: 422
    applies_to: "POST /governance/agenda-items/{id}/record-vote"

  - priority: 58
    category: business_temporal
    check: "The parent Meeting's agenda_locked_at is still null -- items may only be added while the meeting is in DRAFT, before the public notice is posted."
    error_id: ERR_AGENDA_LOCKED
    http_status: 422
    applies_to: "POST /governance/agenda-items"

  - priority: 59
    category: business_temporal
    check: |
      Waiver window overlap, half-open interval semantics on [requested_start_date,
      requested_end_date): reject when another WaiverRequest with the same policy_id AND the same
      requesting_school_code, in status IN {SUBMITTED, BOARD_PENDING, GRANTED}, satisfies
      other.requested_start_date < new.requested_end_date AND new.requested_start_date <
      other.requested_end_date. Exact adjacency (other.requested_end_date ==
      new.requested_start_date) is permitted.
    error_id: ERR_WAIVER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /governance/waiver-requests"

  - priority: 60
    category: business_temporal
    check: |
      Meeting separation buffer, symmetric interval around an instant: reject when another Meeting
      with the same scope AND the same committee_id (null matches null) in status IN
      {DRAFT, NOTICED, OPEN} satisfies abs(other.scheduled_start_utc - new.scheduled_start_utc) <
      MEETING_SEPARATION_MINUTES (240) minutes. Exactly 240 minutes apart is permitted.
    error_id: ERR_MEETING_SEPARATION_VIOLATION
    http_status: 409
    applies_to: "POST /governance/meetings"

  - priority: 61
    category: business_temporal
    check: "A meeting may not be opened before its scheduled_start_utc: logical clock >= scheduled_start_utc."
    error_id: ERR_MEETING_NOT_YET_DUE
    http_status: 422
    applies_to: "POST /governance/meetings/{id}/open"

  - priority: 62
    category: business_temporal
    check: "Minutes may only be approved at a strictly later meeting: approving_meeting_id != this meeting id AND approving_meeting.scheduled_start_utc > this meeting.scheduled_start_utc."
    error_id: ERR_INVALID_APPROVING_MEETING
    http_status: 422
    applies_to: "POST /governance/meetings/{id}/minutes"

  - priority: 65
    category: business_constraint
    check: "floor((requested_end_date - requested_start_date) / 86400) is at least 1 -- a window shorter than a whole day is not a waiver."
    error_id: ERR_INVALID_WAIVER_WINDOW
    http_status: 422
    applies_to: "POST /governance/waiver-requests"

  - priority: 66
    category: business_constraint
    check: "floor((requested_end_date - requested_start_date) / 86400) is at most WAIVER_MAX_DAYS for the linked policy's legal_requirement_level (90 REQUIRED_BY_LAW, 180 RECOMMENDED, 365 LOCAL_DISCRETION)."
    error_id: ERR_WAIVER_DURATION_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /governance/waiver-requests"

  - priority: 67
    category: business_constraint
    check: "No trustee id appears in more than one of yes_member_ids / no_member_ids / abstain_member_ids, and no array contains the same id twice."
    error_id: ERR_DUPLICATE_VOTER
    http_status: 422
    applies_to: "POST /governance/agenda-items/{id}/record-vote"

  - priority: 69
    category: business_constraint
    check: "Committee.vacant_seat_count is at least 1 before a new assignment is created."
    error_id: ERR_COMMITTEE_SEATS_FULL
    http_status: 409
    applies_to: "POST /governance/committee-assignments"

  - priority: 70
    category: business_referential
    check: |
      Linked-object eligibility at agenda-build time: for POLICY_FIRST_READING the linked
      PolicyVersion.status must be DRAFT; for POLICY_SECOND_READING it must be IN
      {DRAFT, FIRST_READING_PASSED}, because a clerk may pre-list the second reading on a later
      agenda before the first reading has actually been held. In both cases the version must not be
      WITHDRAWN, ADOPTED or SUPERSEDED. The VOTE itself (priority 45) still demands exactly
      FIRST_READING_PASSED for a second reading. For WAIVER_DECISION the
      linked WaiverRequest.status must be IN {SUBMITTED, BOARD_PENDING} -- an item may be listed
      while the committee is still deliberating, which is exactly what lets a committee denial
      withdraw it. The VOTE itself (priority 45) still demands BOARD_PENDING.
    error_id: "ERR_POLICY_VERSION_NOT_ELIGIBLE | ERR_WAIVER_NOT_IN_REVIEW"
    http_status: 422
    applies_to: "POST /governance/agenda-items"

  - priority: 71
    category: business_referential
    check: "A PolicyVersion may not be withdrawn while any AgendaItem with status IN {PROPOSED, POSTED} still references it."
    error_id: ERR_VERSION_ON_LIVE_AGENDA
    http_status: 409
    applies_to: "POST /governance/policy-versions/{id}/withdraw"

  - priority: 72
    category: business_referential
    check: "A ManualPublication may only be published when at least one Policy has status == ADOPTED."
    error_id: ERR_NO_ADOPTED_POLICIES
    http_status: 422
    applies_to: "POST /governance/manual-publications/{id}/publish"

  - priority: 73
    category: business_referential
    check: "Advancing a SuperintendentEvaluation with action MIDYEAR requires rating_count >= 1; action ADOPT requires rating_count >= 1 AND eligible_rater_count >= 1."
    error_id: ERR_NO_RATINGS_SUBMITTED
    http_status: 422
    applies_to: "POST /governance/superintendent-evaluations/{id}/advance"

  - priority: 75
    category: business_fiscal
    check: "The meeting's public_comment_minutes_budget is greater than zero -- EMERGENCY meetings carry no public-comment period at all."
    error_id: ERR_PUBLIC_COMMENT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /governance/agenda-items/{id}/public-comments"

  - priority: 76
    category: business_fiscal
    check: "The parent AgendaItem has fewer than MAX_SPEAKERS_PER_ITEM (5) PublicComment rows in status IN {REQUESTED, GRANTED}, and AgendaItem.requires_public_comment == true."
    error_id: ERR_SPEAKER_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /governance/agenda-items/{id}/public-comments"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table   (api_prefix = /governance)
# ---------------------------------------------------------------------------
endpoints:

  # ---- Board members -------------------------------------------------------
  - method: POST
    path: "/governance/board-members"
    description: "Seat an elected trustee."
    roles: [BoardClerk]
    code: 201
    input: [full_name, seat_number, term_start_date, term_end_date, employer_name, "office?"]
    output: BoardMember
    side_effects:
      - "status initialised to SEATED; open_recusal_count and active_committee_count initialised to 0"

  - method: GET
    path: "/governance/board-members/{id}"
    description: "Read one trustee including the derived recusal and committee counters."
    roles: [BoardClerk, BoardPresident, BoardMember, PolicyAnalyst, Superintendent]
    code: 200
    input: []
    output: BoardMember
    side_effects: []

  - method: POST
    path: "/governance/board-members/{id}/resign"
    description: "Record a mid-term resignation."
    roles: [BoardClerk]
    code: 200
    input: []
    output: BoardMember
    side_effects:
      - "BoardMember.status SEATED -> RESIGNED"
      - "every CommitteeAssignment of this trustee with status IN {ACTIVE, RECUSED} -> REMOVED"
      - "each affected Committee recomputes filled_seat_count / voting_seat_count / vacant_seat_count and may flip ACTIVE -> INQUORATE"
      - "every ConflictDisclosure of this trustee with status == RECUSAL_REQUIRED -> CLEARED; open_recusal_count -> 0"

  # ---- Committees ----------------------------------------------------------
  - method: POST
    path: "/governance/committees"
    description: "Charter a standing committee."
    roles: [BoardClerk]
    code: 201
    input: [name, charter_type, seat_capacity, quorum_size]
    output: Committee
    side_effects:
      - "status initialised to INQUORATE; vacant_seat_count initialised to seat_capacity"

  - method: GET
    path: "/governance/committees/{id}"
    description: "Read one committee including its derived seat counters and posture."
    roles: [BoardClerk, BoardPresident, BoardMember, PolicyAnalyst, Superintendent]
    code: 200
    input: []
    output: Committee
    side_effects: []

  - method: POST
    path: "/governance/committee-assignments"
    description: "Seat a trustee on a committee."
    roles: [BoardClerk]
    code: 201
    input: [committee_id, board_member_id, "role_on_committee?"]
    output: CommitteeAssignment
    side_effects:
      - "Committee.filled_seat_count and voting_seat_count incremented, vacant_seat_count decremented"
      - "Committee.status flips INQUORATE -> ACTIVE once voting_seat_count >= quorum_size"
      - "BoardMember.active_committee_count recomputed"

