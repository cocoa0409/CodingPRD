scenario: |
  2907. Crime Laboratory Case Management & Backlog Reduction (state forensic laboratory): evidence
  submission acceptance with case prioritization criteria for violent crime and statutory deadlines,
  discipline routing across biology, chemistry, latent prints, trace evidence and digital forensics
  with queue management, analyst assignment, workload balancing and casework versus training time,
  technical and administrative review before report release with disagreement resolution, quality
  system requirements including proficiency testing, method validation and accreditation audits,
  turnaround time metrics, backlog aging and outsourcing decisions to vendor laboratories, court
  testimony scheduling and discovery request response, corrective action for nonconformances and
  root cause analysis
domain_name: forensic-laboratory-casework
api_prefix: "/lab"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # ExaminationRequest is a hub referencing Case, EvidenceItem, Method and Analyst; Assignment is a
  # self-referential supersede chain; Nonconformance points polymorphically at either an
  # ExaminationRequest or an Analyst (or both). No single ownership tree exists.

  state_machine_shape: cyclic
  # ExaminationRequest carries revision cycles (ADMIN_REVIEW -> IN_ANALYSIS -> TECH_REVIEW) plus a
  # QUEUED fork into {ASSIGNED, OUTSOURCED} that rejoins at TECH_REVIEW with divergent side effects;
  # Analyst.qualification_state cycles QUALIFIED <-> PROBATION <-> SUSPENDED before the DECERTIFIED
  # terminal; Nonconformance cycles ROOT_CAUSE_SUBMITTED -> OPEN on CAPA rejection; Case carries two
  # independent dimensions (workflow_status x discovery_status).

  relationship_patterns:
    - one_to_many          # Case -> EvidenceItem, Case -> ExaminationRequest
    - many_to_many         # Analyst <-> Method via ProficiencyTest and Assignment history
    - self_referential     # Assignment.superseded_by_assignment_id -> Assignment.id
    - polymorphic          # Nonconformance attaches to an ExaminationRequest and/or an Analyst
    - cross_aggregate      # CourtEvent binds an ExaminationRequest to an Analyst calendar

  role_model: segregation_of_duties
  # The analyst who performed the examination may never sign its technical review; the party that
  # submits a corrective-action root cause may never close the nonconformance.

  consistency_model: immediate

difficulty_level: expert

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Analyst
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Examiner display name"
        constraints: "1..120 chars"
      - name: disciplines
        type: array
        source: input
        description: "Discipline codes the examiner is trained in"
        constraints: "non-empty array of {BIOLOGY, CHEMISTRY, LATENT_PRINTS, TRACE, DIGITAL}"
      - name: competency_level
        type: integer
        source: input
        description: "Competency tier used to gate method eligibility; an integer on the closed range 1..5 where 1 is trainee and 5 is technical lead; any integer outside 1..5 is rejected by validations[priority=4]"
        default: 1
        constraints: "1..5"
      - name: weekly_capacity_hours
        type: number
        source: input
        description: "Contracted weekly hours available for lab duties"
        constraints: "> 0.00, <= 60.00, 2 decimals"
      - name: training_hours_per_week
        type: number
        source: input
        description: "Weekly hours reserved for training and competency maintenance; subtracted from capacity before casework"
        default: 0.00
        constraints: ">= 0.00 and <= weekly_capacity_hours"
      - name: employment_status
        type: enum
        source: input
        description: "Staffing availability dimension, independent of qualification_state"
        default: ACTIVE
        constraints: "{ACTIVE, ON_LEAVE, SEPARATED}"
      - name: qualification_state
        type: enum
        source: system
        description: "Quality-system standing driven by proficiency testing and nonconformances (see 1.2 Analyst machine)"
        default: QUALIFIED
        constraints: "{QUALIFIED, PROBATION, SUSPENDED, DECERTIFIED}"
      - name: consecutive_pt_failures
        type: integer
        source: computed
        description: "Count of consecutive SCORED proficiency tests with result FAIL; reset to 0 by a PASS"
        default: 0
        constraints: ">= 0"
      - name: assigned_casework_hours
        type: number
        source: computed
        description: "Sum of estimated_hours over this analyst's Assignment rows with status ACTIVE (see calculations.analyst_workload_variants)"
        default: 0.00
        constraints: ">= 0.00, 2 decimals"
      - name: probation_entered_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the analyst last entered PROBATION; null while QUALIFIED"
      - name: suspended_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the analyst last entered SUSPENDED; null otherwise"

  - name: Method
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Analytical method name"
        constraints: "1..160 chars"
      - name: discipline
        type: enum
        source: input
        description: "Owning discipline; drives queue routing and analyst eligibility"
        constraints: "{BIOLOGY, CHEMISTRY, LATENT_PRINTS, TRACE, DIGITAL}"
      - name: standard_hours_per_item
        type: number
        source: input
        description: "Accredited standard casework hours per examined item; multiplied by ExaminationRequest.item_count for the estimate"
        constraints: "> 0.00, <= 40.00, 2 decimals"
      - name: min_competency_level
        type: integer
        source: input
        description: "Minimum Analyst.competency_level allowed to perform or technically review this method"
        constraints: "1..5"
      - name: max_items_per_request
        type: integer
        source: input
        description: "Accreditation-scope cap on items examined under one request"
        default: 20
        constraints: "1..200"
      - name: is_consumptive
        type: boolean
        source: input
        description: "True when the method consumes the evidence item"
        default: false
      - name: accreditation_scope_code
        type: string
        source: input
        description: "Accreditation scope identifier cited in audit findings"
        constraints: "1..40 chars"
      - name: validation_status
        type: enum
        source: system
        description: "Method validation lifecycle (see 1.2 Method machine)"
        default: DRAFT
        constraints: "{DRAFT, VALIDATED, RETIRED}"
      - name: validation_study_item_count
        type: integer
        source: input
        description: "Items examined in the validation study; recorded at validation"
        constraints: ">= 0"
      - name: precision_cv_pct
        type: number
        source: input
        description: "Coefficient of variation reported by the validation study, in percent"
        constraints: ">= 0.00, 2 decimals"
      - name: validated_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant validation was recorded; null while DRAFT"
      - name: validation_expires_at_utc
        type: datetime
        source: input
        description: "Instant the validation lapses; strictly-after comparison against the logical clock gates analysis start"
      - name: retired_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the method was retired; null unless RETIRED"
      - name: retirement_reason
        type: string
        source: input
        description: "Reason recorded when the method is withdrawn from scope"

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: agency_case_number
        type: string
        source: input
        description: "Submitting agency's own case number"
        constraints: "1..40 chars; unique per submitting_agency"
      - name: submitting_agency
        type: string
        source: input
        description: "Agency that submitted the evidence"
        constraints: "1..80 chars"
      - name: offense_category
        type: enum
        source: input
        description: "Charged offense category driving severity points"
        constraints: "{HOMICIDE, SEXUAL_ASSAULT, AGG_ASSAULT, ROBBERY, BURGLARY, DRUG_OFFENSE, PROPERTY_CRIME, OTHER}"
      - name: violent_crime_flag
        type: boolean
        source: computed
        description: "True when offense_category IN {HOMICIDE, SEXUAL_ASSAULT, AGG_ASSAULT, ROBBERY}"
      - name: suspect_in_custody
        type: boolean
        source: input
        description: "True when a suspect is held pending laboratory results"
        default: false
      - name: statutory_deadline_utc
        type: datetime
        source: input
        description: "Statutory (speedy-trial) deadline; null when the submission carries none"
      - name: court_date_utc
        type: datetime
        source: input
        description: "Scheduled trial date; null when unscheduled"
      - name: received_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of submission; baseline for priority tiers, aging and turnaround"
      - name: priority_score
        type: number
        source: computed
        description: "0.00..100.00 ranking score (see calculations.case_priority_scoring)"
        constraints: "2 decimals, capped at 100.00"
      - name: priority_class
        type: enum
        source: computed
        description: "Queue class derived from statutory proximity, violence and any override (see calculations.case_priority_scoring)"
        constraints: "{P1_STATUTORY, P2_VIOLENT, P3_ROUTINE}"
      - name: priority_override_class
        type: enum
        source: input
        description: "Director-set class that supersedes the derived class; null when no override is in force"
        constraints: "{P1_STATUTORY, P2_VIOLENT, P3_ROUTINE} or null"
      - name: priority_override_reason
        type: string
        source: input
        description: "Justification recorded with the latest priority override"
      - name: workflow_status
        type: enum
        source: system
        description: "Casework dimension of the case lifecycle (see 1.2 Case machine)"
        default: SUBMITTED
        constraints: "{SUBMITTED, ACCEPTED, IN_PROGRESS, AWAITING_ASSIGNMENT, REPORTED, REJECTED}"
      - name: discovery_status
        type: enum
        source: system
        description: "Discovery dimension of the case lifecycle; evolves independently of workflow_status"
        default: NONE
        constraints: "{NONE, RECEIVED, FULFILLED, DENIED}"
      - name: discovery_requested_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the discovery request was logged; null while discovery_status is NONE"
      - name: discovery_due_utc
        type: datetime
        source: computed
        description: "discovery_requested_at_utc + DISCOVERY_RESPONSE_DAYS (30) days; null while discovery_status is NONE"
      - name: discovery_requesting_party
        type: string
        source: input
        description: "Party that served the discovery request"
      - name: open_examination_request_count
        type: integer
        source: computed
        description: "Count of this case's ExaminationRequest rows with status NOT IN {RELEASED, CANCELLED}"
        default: 0
      - name: released_examination_request_count
        type: integer
        source: computed
        description: "Count of this case's ExaminationRequest rows with status RELEASED"
        default: 0
      - name: accepted_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of acceptance; null until ACCEPTED"
      - name: reported_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the case report was released; null until REPORTED"
      - name: gross_turnaround_days
        type: number
        source: computed
        description: "Calendar turnaround variant (see calculations.case_turnaround_variants); null until REPORTED"
        constraints: "2 decimals"
      - name: net_turnaround_days
        type: number
        source: computed
        description: "Lab-custody turnaround variant excluding merged vendor-custody windows (see calculations.case_turnaround_variants); null until REPORTED"
        constraints: "2 decimals, >= 0.00"
      - name: rejection_reason
        type: string
        source: input
        description: "Reason recorded when the submission is refused at intake"

  - name: EvidenceItem
    parent: Case
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the submission this item was logged under"
      - name: item_number
        type: string
        source: input
        description: "Agency item label"
        constraints: "1..20 chars; unique within case_id"
      - name: item_description
        type: string
        source: input
        description: "Free-text description of the item"
      - name: item_type
        type: enum
        source: input
        description: "Physical class of the item; must match the method's discipline per METHOD_ITEM_TYPE_MATRIX"
        constraints: "{BIOLOGICAL, CHEMICAL, FIREARM, LATENT_LIFT, DIGITAL_DEVICE, TRACE_MEDIA}"
      - name: seal_intact
        type: boolean
        source: input
        description: "Chain-of-custody seal integrity as logged at intake"
      - name: custody_status
        type: enum
        source: system
        description: "Custody position (see 1.2 EvidenceItem machine)"
        default: IN_VAULT
        constraints: "{IN_VAULT, IN_ANALYSIS, RETURNED, CONSUMED}"
      - name: checkout_count
        type: integer
        source: computed
        description: "Number of times the item has moved IN_VAULT -> IN_ANALYSIS"
        default: 0
      - name: logged_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the item was logged into the vault"

  - name: ExaminationRequest
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case whose priority_class weights this request in the backlog"
      - name: evidence_item_id
        type: string
        source: input
        description: "FK -> EvidenceItem.id; the item examined; must satisfy evidence_item.case_id == case_id"
      - name: method_id
        type: string
        source: input
        description: "FK -> Method.id; the accredited method to be applied"
      - name: assigned_analyst_id
        type: string
        source: system
        description: "FK -> Analyst.id; holder of the ACTIVE Assignment; null while QUEUED or OUTSOURCED"
      - name: discipline
        type: enum
        source: computed
        description: "Copied from method.discipline at creation; the queue this request sits in"
        constraints: "{BIOLOGY, CHEMISTRY, LATENT_PRINTS, TRACE, DIGITAL}"
      - name: item_count
        type: integer
        source: input
        description: "Number of items examined under this request"
        constraints: ">= 1 at the schema layer; the upper bound against method.max_items_per_request is enforced by validations[priority=24], not by validations[priority=4]"
      - name: estimated_hours
        type: number
        source: computed
        description: "round(method.standard_hours_per_item * item_count, 2); the hours a holder encumbers"
        constraints: "> 0.00, 2 decimals"
      - name: actual_hours_logged
        type: number
        source: input
        description: "Hours reported at complete-analysis; null until the first completion"
        constraints: "> 0.00, <= 400.00, 2 decimals"
      - name: status
        type: enum
        source: system
        description: "Casework lifecycle (see 1.2 ExaminationRequest machine)"
        default: QUEUED
        constraints: "{QUEUED, ASSIGNED, IN_ANALYSIS, TECH_REVIEW, DISAGREEMENT, ADMIN_REVIEW, OUTSOURCED, RELEASED, CANCELLED}"
      - name: revision_round
        type: integer
        source: computed
        description: "Incremented each time the request re-enters IN_ANALYSIS from ADMIN_REVIEW or DISAGREEMENT"
        default: 0
      - name: requested_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of creation; aging baseline for the backlog index"
      - name: released_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of report release; null until RELEASED"
      - name: vendor_custody_days
        type: number
        source: computed
        description: "Sum of custody_days over this request's VendorEngagement rows with status IN {RETURNED}; 0.00 when never outsourced"
        default: 0.00
        constraints: "2 decimals"

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: examination_request_id
        type: string
        source: input
        description: "FK -> ExaminationRequest.id; the request this assignment holds"
      - name: analyst_id
        type: string
        source: input
        description: "FK -> Analyst.id; the holder encumbering estimated_hours while ACTIVE"
      - name: estimated_hours
        type: number
        source: computed
        description: "Snapshot of examination_request.estimated_hours at assignment time"
        constraints: "> 0.00, 2 decimals"
      - name: assignment_reason
        type: enum
        source: input
        description: "How the holder was chosen"
        default: MANUAL
        constraints: "{MANUAL, AUTO_BALANCED}"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle (see 1.2 Assignment machine)"
        default: ACTIVE
        constraints: "{ACTIVE, SUPERSEDED, RELEASED, COMPLETED}"
      - name: superseded_by_assignment_id
        type: string
        source: system
        description: "FK -> Assignment.id; the assignment that replaced this one; null unless status is SUPERSEDED"
      - name: assigned_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the hours were encumbered"
      - name: closed_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the assignment left ACTIVE; null while ACTIVE"

  - name: ReviewRecord
    parent: null
    common_fields: false
    fields:
      - name: examination_request_id
        type: string
        source: input
        description: "FK -> ExaminationRequest.id; the request reviewed"
      - name: reviewer_analyst_id
        type: string
        source: system
        description: "FK -> Analyst.id; the acting examiner for review_type TECHNICAL; null for the other review types"
      - name: reviewer_operator_id
        type: string
        source: system
        description: "Opaque X-User-ID of the acting operator for review_type ADMINISTRATIVE or DISAGREEMENT_RESOLUTION; null for TECHNICAL"
      - name: review_type
        type: enum
        source: computed
        description: "Which review gate produced this immutable record"
        constraints: "{TECHNICAL, ADMINISTRATIVE, DISAGREEMENT_RESOLUTION}"
      - name: decision
        type: enum
        source: input
        description: "Recorded outcome; the admissible set depends on review_type"
        constraints: "TECHNICAL {AGREE, DISAGREE}; ADMINISTRATIVE {APPROVE, RETURN}; DISAGREEMENT_RESOLUTION {UPHOLD_ANALYST, UPHOLD_REVIEWER}"
      - name: rationale
        type: string
        source: input
        description: "Reviewer justification, mandatory on every record"
        constraints: "1..500 chars"
      - name: revision_round_snapshot
        type: integer
        source: computed
        description: "examination_request.revision_round at the instant the record was written"
      - name: recorded_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the review was signed"

  - name: ProficiencyTest
    parent: null
    common_fields: true
    fields:
      - name: analyst_id
        type: string
        source: input
        description: "FK -> Analyst.id; the examiner under test"
      - name: method_id
        type: string
        source: input
        description: "FK -> Method.id; the method the test exercises"
      - name: test_cycle
        type: string
        source: input
        description: "Accreditation test cycle label"
        constraints: "1..20 chars"
      - name: due_utc
        type: datetime
        source: input
        description: "Instant the submission is due; a late submission forces result FAIL"
      - name: status
        type: enum
        source: system
        description: "Test lifecycle (see 1.2 ProficiencyTest machine)"
        default: ASSIGNED
        constraints: "{ASSIGNED, SUBMITTED, SCORED}"
      - name: submitted_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of submission; null while ASSIGNED"
      - name: score_pct
        type: number
        source: input
        description: "Grader score in percent, recorded at scoring"
        constraints: "0.00..100.00, 2 decimals"
      - name: result
        type: enum
        source: computed
        description: "Graded outcome (see calculations.proficiency_test_grading); null until SCORED"
        constraints: "{PASS, INCONCLUSIVE, FAIL}"
      - name: late_submission
        type: boolean
        source: computed
        description: "True when submitted_at_utc > due_utc; forces result FAIL regardless of score_pct"
        default: false
      - name: scored_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of scoring; null until SCORED"

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Vendor laboratory name"
        constraints: "1..120 chars"
      - name: accredited_disciplines
        type: array
        source: input
        description: "Disciplines the vendor is accredited for"
        constraints: "non-empty array of {BIOLOGY, CHEMISTRY, LATENT_PRINTS, TRACE, DIGITAL}"
      - name: accreditation_expires_at_utc
        type: datetime
        source: input
        description: "Instant the vendor accreditation lapses; strictly-after comparison against the logical clock gates awards"
      - name: concurrent_case_capacity
        type: integer
        source: input
        description: "Maximum number of engagements whose closed custody windows may intersect one instant"
        constraints: ">= 1 and <= 50"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Contract price per examined item, in cents"
        constraints: ">= 1"
      - name: rush_surcharge_pct
        type: number
        source: input
        description: "Fraction of base applied as rush surcharge when an engagement sets rush_flag"
        default: 0.00
        constraints: "0.00..0.50, 2 decimals"
      - name: contract_ceiling_cents
        type: integer
        source: input
        description: "Total contract authority in cents; encumbered_cents + spent_cents may never exceed it"
        constraints: ">= 1"
      - name: encumbered_cents
        type: integer
        source: computed
        description: "Sum of award_amount_cents over this vendor's engagements with status IN {AWARDED, AT_VENDOR}"
        default: 0
      - name: spent_cents
        type: integer
        source: computed
        description: "Sum of final_invoice_cents over this vendor's engagements with status RETURNED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Vendor availability for new awards"
        default: ACTIVE
        constraints: "{ACTIVE, SUSPENDED}"
      - name: suspension_reason
        type: string
        source: input
        description: "Reason recorded when quality suspends the vendor"

  - name: VendorEngagement
    parent: null
    common_fields: true
    fields:
      - name: examination_request_id
        type: string
        source: input
        description: "FK -> ExaminationRequest.id; the outsourced request"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the awarded vendor laboratory"
      - name: window_start_utc
        type: datetime
        source: input
        description: "Start of the contracted custody window; closed-interval endpoint for capacity arithmetic"
      - name: window_end_utc
        type: datetime
        source: input
        description: "End of the contracted custody window; closed-interval endpoint for capacity arithmetic"
        constraints: "> window_start_utc"
      - name: rush_flag
        type: boolean
        source: input
        description: "True when the award carries the vendor's rush surcharge"
        default: false
      - name: item_count
        type: integer
        source: computed
        description: "Snapshot of examination_request.item_count at award"
      - name: base_amount_cents
        type: integer
        source: computed
        description: "vendor.unit_price_cents * item_count (see calculations.vendor_award_pricing)"
      - name: rush_surcharge_cents
        type: integer
        source: computed
        description: "Surcharge applied before tier selection (see calculations.vendor_award_pricing)"
        default: 0
      - name: tier_basis_cents
        type: integer
        source: computed
        description: "base_amount_cents + rush_surcharge_cents; the pinned basis on which the volume tier is selected"
      - name: volume_discount_pct
        type: number
        source: computed
        description: "Tier fraction selected from tier_basis_cents (see calculations.vendor_award_pricing)"
        constraints: "one of 0.00, 0.04, 0.08, 0.12"
      - name: discount_amount_cents
        type: integer
        source: computed
        description: "round_half_up(tier_basis_cents * volume_discount_pct)"
        default: 0
      - name: award_amount_cents
        type: integer
        source: computed
        description: "tier_basis_cents - discount_amount_cents; the encumbered amount"
      - name: final_invoice_cents
        type: integer
        source: input
        description: "Invoice recorded at return; null until RETURNED"
        constraints: ">= 0"
      - name: variance_cents
        type: integer
        source: computed
        description: "final_invoice_cents - award_amount_cents; null until RETURNED"
      - name: status
        type: enum
        source: system
        description: "Engagement lifecycle (see 1.2 VendorEngagement machine)"
        default: AWARDED
        constraints: "{AWARDED, AT_VENDOR, RETURNED, CANCELLED}"
      - name: awarded_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant of award; custody-day baseline"
      - name: shipped_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the shipment was confirmed; null while AWARDED"
      - name: returned_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the return was recorded; null until RETURNED"
      - name: custody_days
        type: number
        source: computed
        description: "round_half_up((returned_at_utc - awarded_at_utc) / 86400, 2); null until RETURNED"
        constraints: "2 decimals"
      - name: cancellation_reason
        type: string
        source: input
        description: "Reason recorded when the award is withdrawn"

  - name: Nonconformance
    parent: null
    common_fields: true
    fields:
      - name: examination_request_id
        type: string
        source: input
        description: "FK -> ExaminationRequest.id; the casework the finding attaches to; null for analyst-only or audit-only findings"
      - name: analyst_id
        type: string
        source: input
        description: "FK -> Analyst.id; the examiner the finding is attributed to; null when no individual is implicated"
      - name: source
        type: enum
        source: input
        description: "Origin of the finding"
        constraints: "{TECHNICAL_DISAGREEMENT, PT_FAILURE, PT_INCONCLUSIVE, ACCREDITATION_AUDIT, INTERNAL_QA, DEADLINE_MISS, VENDOR_VARIANCE}"
      - name: severity
        type: enum
        source: input
        description: "Severity tier; drives the CAPA due date and escalates on repeated CAPA rejection"
        constraints: "{MINOR, MAJOR, CRITICAL}"
      - name: description
        type: string
        source: input
        description: "Statement of the nonconformance"
        constraints: "1..500 chars"
      - name: status
        type: enum
        source: system
        description: "Corrective-action lifecycle (see 1.2 Nonconformance machine)"
        default: OPEN
        constraints: "{OPEN, ROOT_CAUSE_SUBMITTED, CAPA_APPROVED, CLOSED, VOIDED}"
      - name: root_cause_category
        type: enum
        source: input
        description: "Root-cause classification submitted with the corrective-action plan; null while OPEN"
        constraints: "{TRAINING, METHOD_DEFICIENCY, EQUIPMENT, DOCUMENTATION, WORKLOAD, VENDOR}"
      - name: corrective_action_plan
        type: string
        source: input
        description: "Planned corrective action; null while OPEN"
        constraints: "1..500 chars"
      - name: capa_rejection_count
        type: integer
        source: computed
        description: "Number of REJECT decisions recorded on this finding; at CAPA_ESCALATION_THRESHOLD the severity escalates one tier"
        default: 0
      - name: opened_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the finding was opened; due-date baseline that survives severity escalation"
      - name: due_utc
        type: datetime
        source: computed
        description: "opened_at_utc + CAPA_SLA_DAYS[severity]; recomputed from the same baseline when severity escalates"
      - name: closed_at_utc
        type: datetime
        source: system
        description: "Logical-clock instant the finding reached CLOSED or VOIDED; null otherwise"
      - name: overdue
        type: boolean
        source: computed
        description: "True when clock_now > due_utc and status NOT IN {CLOSED, VOIDED}"
        default: false

  - name: CourtEvent
    parent: null
    common_fields: true
    fields:
      - name: examination_request_id
        type: string
        source: input
        description: "FK -> ExaminationRequest.id; the released report to be defended"
      - name: analyst_id
        type: string
        source: input
        description: "FK -> Analyst.id; the testifying examiner whose calendar is occupied"
      - name: court_name
        type: string
        source: input
        description: "Court hearing the matter"
        constraints: "1..120 chars"
      - name: docket_number
        type: string
        source: input
        description: "Court docket identifier"
        constraints: "1..40 chars"
      - name: start_utc
        type: datetime
        source: input
        description: "Half-open interval start of the testimony block"
      - name: end_utc
        type: datetime
        source: input
        description: "Half-open interval end of the testimony block, exclusive"
        constraints: "> start_utc"
      - name: notice_days
        type: integer
        source: computed
        description: "floor((start_utc - clock_now) / 86400) evaluated at creation"
      - name: subpoena_received
        type: boolean
        source: input
        description: "Supplied at creation to declare a served subpoena, which bypasses the MIN_TESTIMONY_NOTICE_DAYS floor of validations[priority=19]; also forced to true by the SCHEDULED -> CONFIRMED transition"
        default: false
      - name: status
        type: enum
        source: system
        description: "Testimony lifecycle (see 1.2 CourtEvent machine)"
        default: SCHEDULED
        constraints: "{SCHEDULED, CONFIRMED, TESTIFIED, CANCELLED}"
      - name: testimony_note
        type: string
        source: input
        description: "Note recorded when testimony is completed"
      - name: cancellation_reason
        type: string
        source: input
        description: "Reason recorded when the event is cancelled"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
# Shared definitions referenced by transitions below:
#   ER_ACTIVE_SET   = {ASSIGNED, IN_ANALYSIS, TECH_REVIEW, DISAGREEMENT, ADMIN_REVIEW, OUTSOURCED}
#   ER_TERMINAL_SET = {RELEASED, CANCELLED}
#   ER_HOLD_SET     = {ASSIGNED, IN_ANALYSIS}   # the only states in which an Assignment is ACTIVE
#   CASE_RECOMPUTE(case): applies only when case.workflow_status IN {ACCEPTED, IN_PROGRESS,
#     AWAITING_ASSIGNMENT}. If the case has zero ExaminationRequest rows, leave unchanged. Else if any
#     of its requests is in ER_ACTIVE_SET -> IN_PROGRESS; else if any is QUEUED -> AWAITING_ASSIGNMENT;
#     else -> IN_PROGRESS. Always refreshes open_examination_request_count,
#     released_examination_request_count, updated_at and increments version.
#   PROBATION_RELEASE(analyst): for every Assignment of the analyst with status ACTIVE whose request's
#     case.priority_class IN {P1_STATUTORY, P2_VIOLENT}: assignment.status -> RELEASED,
#     analyst.assigned_casework_hours -= assignment.estimated_hours, request.assigned_analyst_id -> null,
#     request.status -> QUEUED, then CASE_RECOMPUTE(request.case).
#   FULL_RELEASE(analyst): identical to PROBATION_RELEASE but with no priority_class filter - every
#     ACTIVE assignment of the analyst is released.
state_machines:
  - entity: Case
    initial_state: SUBMITTED
    terminal_states: [REPORTED, REJECTED]
    note: "Casework dimension (workflow_status). Evolves independently of the discovery dimension below."
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /lab/cases/{case_id}/accept"
        actor: EvidenceTechnician
        preconditions:
          - "workflow_status == SUBMITTED"
          - "count of EvidenceItem rows with case_id == this case >= 1, else ERR_CASE_HAS_NO_EVIDENCE"
          - "every EvidenceItem of the case has seal_intact == true, else ERR_EVIDENCE_SEAL_BROKEN"
        side_effects:
          - "accepted_at_utc = clock_now"
          - "increments Case.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /lab/cases/{case_id}/reject"
        actor: EvidenceTechnician
        preconditions:
          - "workflow_status == SUBMITTED"
        side_effects:
          - "rejection_reason stored"
          - "cascade hop 1 (cascade down): every EvidenceItem of the case with custody_status == IN_VAULT -> RETURNED"
          - "increments Case.version by 1"
      - from: ACCEPTED
        to: AWAITING_ASSIGNMENT
        trigger: "system: CASE_RECOMPUTE after POST /lab/examination-requests creates the case's first request"
        actor: system
        preconditions:
          - "the new ExaminationRequest is QUEUED and no request of the case is in ER_ACTIVE_SET"
        side_effects:
          - "open_examination_request_count refreshed"
          - "increments Case.version by 1"
      - from: AWAITING_ASSIGNMENT
        to: IN_PROGRESS
        trigger: "system: CASE_RECOMPUTE after a request of the case enters ER_ACTIVE_SET (assignment, auto-assign or vendor award)"
        actor: system
        preconditions:
          - "at least one request of the case is in ER_ACTIVE_SET"
        side_effects:
          - "increments Case.version by 1"
      - from: IN_PROGRESS
        to: AWAITING_ASSIGNMENT
        trigger: "system: CASE_RECOMPUTE after the last active request of the case falls back to QUEUED (assignment release, vendor cancel)"
        actor: system
        preconditions:
          - "no request of the case is in ER_ACTIVE_SET and at least one is QUEUED"
        side_effects:
          - "increments Case.version by 1"
      - from: IN_PROGRESS
        to: REPORTED
        trigger: "POST /lab/cases/{case_id}/report"
        actor: CaseManager
        preconditions:
          - "workflow_status == IN_PROGRESS"
          - "open_examination_request_count == 0, else ERR_CASE_HAS_OPEN_REQUESTS"
          - "released_examination_request_count >= 1, else ERR_CASE_HAS_NO_RELEASED_REQUEST"
        side_effects:
          - "reported_at_utc = clock_now"
          - "gross_turnaround_days and net_turnaround_days computed per calculations.case_turnaround_variants"
          - "increments Case.version by 1"

  - entity: Case
    initial_state: NONE
    terminal_states: [FULFILLED, DENIED]
    note: "Discovery dimension (discovery_status) - a second, independent state axis on the same Case row. A case may be REPORTED while discovery is still RECEIVED, and discovery may be FULFILLED while casework is still IN_PROGRESS."
    transitions:
      - from: NONE
        to: RECEIVED
        trigger: "POST /lab/cases/{case_id}/discovery-request"
        actor: CaseManager
        preconditions:
          - "discovery_status == NONE, else ERR_DISCOVERY_ALREADY_RECEIVED"
          - "workflow_status IN {ACCEPTED, IN_PROGRESS, AWAITING_ASSIGNMENT, REPORTED}, else ERR_CASE_INVALID_STATE"
        side_effects:
          - "discovery_requested_at_utc = clock_now"
          - "discovery_due_utc = discovery_requested_at_utc + DISCOVERY_RESPONSE_DAYS (30) days"
          - "increments Case.version by 1"
      - from: RECEIVED
        to: FULFILLED
        trigger: "POST /lab/cases/{case_id}/discovery-response with decision FULFILL"
        actor: CaseManager
        preconditions:
          - "discovery_status == RECEIVED, else ERR_DISCOVERY_NOT_PENDING"
        side_effects:
          - "cascade hop 1 (cross-entity, conditional): when clock_now > discovery_due_utc a Nonconformance is created with source DEADLINE_MISS, severity MAJOR, examination_request_id null, analyst_id null, description citing the docket"
          - "increments Case.version by 1"
      - from: RECEIVED
        to: DENIED
        trigger: "POST /lab/cases/{case_id}/discovery-response with decision DENY"
        actor: CaseManager
        preconditions:
          - "discovery_status == RECEIVED, else ERR_DISCOVERY_NOT_PENDING"
          - "response_note is present and non-empty, else ERR_INVALID_REQUEST"
        side_effects:
          - "cascade hop 1 (cross-entity, conditional): identical DEADLINE_MISS Nonconformance when clock_now > discovery_due_utc"
          - "increments Case.version by 1"

  - entity: EvidenceItem
    initial_state: IN_VAULT
    terminal_states: [RETURNED, CONSUMED]
    note: "Custody check-out / check-in is a cycle: IN_VAULT -> IN_ANALYSIS -> IN_VAULT repeats once per revision round."
    transitions:
      - from: IN_VAULT
        to: IN_ANALYSIS
        trigger: "system: POST /lab/examination-requests/{examination_request_id}/start-analysis or POST /lab/vendor-engagements/{vendor_engagement_id}/confirm-shipment"
        actor: system
        preconditions:
          - "custody_status == IN_VAULT, else ERR_EVIDENCE_CUSTODY_INVALID_STATE"
          - "seal_intact == true, else ERR_EVIDENCE_SEAL_BROKEN"
        side_effects:
          - "checkout_count += 1"
          - "increments EvidenceItem.version by 1"
      - from: IN_ANALYSIS
        to: IN_VAULT
        trigger: "system: POST /lab/examination-requests/{examination_request_id}/complete-analysis with evidence_consumed false, or POST /lab/vendor-engagements/{vendor_engagement_id}/record-return, or POST /lab/vendor-engagements/{vendor_engagement_id}/cancel"
        actor: system
        preconditions:
          - "custody_status == IN_ANALYSIS"
        side_effects:
          - "increments EvidenceItem.version by 1"
      - from: IN_ANALYSIS
        to: CONSUMED
        trigger: "system: POST /lab/examination-requests/{examination_request_id}/complete-analysis with evidence_consumed true"
        actor: system
        preconditions:
          - "custody_status == IN_ANALYSIS"
          - "method.is_consumptive == true, else ERR_METHOD_NOT_CONSUMPTIVE"
        side_effects:
          - "increments EvidenceItem.version by 1"
      - from: IN_VAULT
        to: RETURNED
        trigger: "POST /lab/evidence-items/{evidence_item_id}/return, or cascade hop 1 of Case SUBMITTED -> REJECTED"
        actor: EvidenceTechnician
        preconditions:
          - "custody_status == IN_VAULT, else ERR_EVIDENCE_CUSTODY_INVALID_STATE"
          - "case.workflow_status IN {REPORTED, REJECTED}, else ERR_CASE_INVALID_STATE"
        side_effects:
          - "increments EvidenceItem.version by 1"

  - entity: ExaminationRequest
    initial_state: QUEUED
    terminal_states: [RELEASED, CANCELLED]
    note: |
      Non-linear on two axes. (1) Fork/join: QUEUED forks into {ASSIGNED (in-house) , OUTSOURCED
      (vendor)} and both branches rejoin at TECH_REVIEW carrying different side-effect sets - the
      in-house branch releases analyst hours and checks evidence back into the vault, the vendor
      branch de-encumbers vendor money, records custody_days and may raise a VENDOR_VARIANCE finding.
      (2) Revision cycles: ADMIN_REVIEW -> IN_ANALYSIS -> TECH_REVIEW -> ADMIN_REVIEW and
      DISAGREEMENT -> IN_ANALYSIS -> TECH_REVIEW -> DISAGREEMENT may repeat, each pass incrementing
      revision_round.
      REOPEN_HOLD(request) - used by both revision transitions: let A be the request's Assignment row
      with status COMPLETED and the greatest assigned_at_utc (tie-break created_at ASC). If
      request.assigned_analyst_id is not null AND that analyst has employment_status == ACTIVE AND
      (qualification_state == QUALIFIED OR (qualification_state == PROBATION AND
      case.priority_class == P3_ROUTINE AND analyst.training_hours_per_week >=
      REMEDIATION_TRAINING_MIN_HOURS)) then A.status -> ACTIVE, A.closed_at_utc = null,
      analyst.assigned_casework_hours += A.estimated_hours, request -> IN_ANALYSIS and the evidence
      item is checked out again (IN_VAULT -> IN_ANALYSIS). Otherwise A stays COMPLETED,
      request.assigned_analyst_id -> null, request -> QUEUED and CASE_RECOMPUTE runs.
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /lab/examination-requests/{examination_request_id}/assignments or POST /lab/examination-requests/{examination_request_id}/auto-assign"
        actor: CaseManager
        preconditions:
          - "status == QUEUED, else ERR_EXAM_REQUEST_INVALID_STATE"
          - "on the manual endpoint: expected_examination_request_version == this request's current version, else ERR_STALE_EXAM_REQUEST_VERSION"
          - "analyst.employment_status == ACTIVE, else ERR_ANALYST_NOT_ACTIVE"
          - "analyst.qualification_state == QUALIFIED, or == PROBATION with case.priority_class == P3_ROUTINE and analyst.training_hours_per_week >= REMEDIATION_TRAINING_MIN_HOURS; QUALIFIED check failure -> ERR_ANALYST_NOT_QUALIFIED, priority breach -> ERR_PROBATION_PRIORITY_RESTRICTED, training breach -> ERR_TRAINING_MINIMUM_NOT_MET"
          - "method.discipline IN analyst.disciplines, else ERR_ANALYST_DISCIPLINE_MISMATCH"
          - "analyst.competency_level >= method.min_competency_level, else ERR_ANALYST_COMPETENCY_INSUFFICIENT"
          - "post-assignment projected_utilization_pct <= 100.00 per calculations.analyst_workload_variants, else ERR_ANALYST_CAPACITY_EXCEEDED"
        side_effects:
          - "a new Assignment row is created with status ACTIVE, estimated_hours snapshotted from the request, assigned_at_utc = clock_now"
          - "analyst.assigned_casework_hours += request.estimated_hours (increments Analyst.version by 1)"
          - "assigned_analyst_id = analyst.id"
          - "increments ExaminationRequest.version by 1"
          - "CASE_RECOMPUTE(case) - ACCEPTED/AWAITING_ASSIGNMENT -> IN_PROGRESS"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /lab/examination-requests/{examination_request_id}/assignments (reassignment that supersedes the incumbent holder)"
        actor: CaseManager
        preconditions:
          - "status == ASSIGNED"
          - "expected_examination_request_version == this request's current version, else ERR_STALE_EXAM_REQUEST_VERSION"
          - "the same eligibility battery as QUEUED -> ASSIGNED applies to the incoming analyst"
          - "analyst_id != current assigned_analyst_id, else ERR_ANALYST_ALREADY_ASSIGNED"
        side_effects:
          - "the incumbent ACTIVE Assignment -> SUPERSEDED, closed_at_utc = clock_now, superseded_by_assignment_id = new assignment id"
          - "outgoing analyst.assigned_casework_hours -= superseded assignment.estimated_hours"
          - "new Assignment created ACTIVE; incoming analyst.assigned_casework_hours += request.estimated_hours"
          - "assigned_analyst_id = incoming analyst.id"
          - "increments ExaminationRequest.version by 1"
      - from: ASSIGNED
        to: QUEUED
        trigger: "system: PROBATION_RELEASE or FULL_RELEASE cascade from an Analyst qualification transition"
        actor: system
        preconditions:
          - "the holder's ACTIVE Assignment is being released by the cascade"
        side_effects:
          - "assigned_analyst_id -> null"
          - "increments ExaminationRequest.version by 1"
          - "CASE_RECOMPUTE(case)"
      - from: ASSIGNED
        to: IN_ANALYSIS
        trigger: "POST /lab/examination-requests/{examination_request_id}/start-analysis"
        actor: Analyst
        preconditions:
          - "status == ASSIGNED, else ERR_EXAM_REQUEST_INVALID_STATE"
          - "X-User-ID == assigned_analyst_id, else ERR_ANALYST_IDENTITY_MISMATCH"
          - "analyst.qualification_state IN {QUALIFIED, PROBATION} and the PROBATION combination still satisfies the P3_ROUTINE + training rule, else ERR_ANALYST_NOT_QUALIFIED"
          - "method.validation_status == VALIDATED, else ERR_METHOD_NOT_VALIDATED"
          - "method.validation_expires_at_utc is null OR method.validation_expires_at_utc > clock_now, else ERR_METHOD_VALIDATION_EXPIRED"
          - "evidence_item.custody_status == IN_VAULT, else ERR_EVIDENCE_CUSTODY_INVALID_STATE"
        side_effects:
          - "cascade hop 1 (cross-entity): evidence item IN_VAULT -> IN_ANALYSIS, checkout_count += 1"
          - "increments ExaminationRequest.version by 1"
      - from: IN_ANALYSIS
        to: TECH_REVIEW
        trigger: "POST /lab/examination-requests/{examination_request_id}/complete-analysis"
        actor: Analyst
        preconditions:
          - "status == IN_ANALYSIS, else ERR_EXAM_REQUEST_INVALID_STATE"
          - "X-User-ID == assigned_analyst_id, else ERR_ANALYST_IDENTITY_MISMATCH"
          - "evidence_consumed true requires method.is_consumptive == true, else ERR_METHOD_NOT_CONSUMPTIVE"
        side_effects:
          - "actual_hours_logged = actual_hours from the request body"
          - "cascade hop 1 (ledger sync): the ACTIVE Assignment -> COMPLETED, closed_at_utc = clock_now, and analyst.assigned_casework_hours -= assignment.estimated_hours"
          - "cascade hop 1 (cross-entity): evidence item IN_ANALYSIS -> IN_VAULT, or -> CONSUMED when evidence_consumed is true"
          - "increments ExaminationRequest.version by 1"
      - from: TECH_REVIEW
        to: ADMIN_REVIEW
        trigger: "POST /lab/examination-requests/{examination_request_id}/technical-review with decision AGREE"
        actor: Analyst
        preconditions:
          - "status == TECH_REVIEW, else ERR_EXAM_REQUEST_INVALID_STATE"
          - "X-User-ID != assigned_analyst_id, else ERR_SEGREGATION_OF_DUTIES"
          - "reviewer.qualification_state == QUALIFIED, else ERR_ANALYST_NOT_QUALIFIED"
          - "method.discipline IN reviewer.disciplines, else ERR_ANALYST_DISCIPLINE_MISMATCH"
          - "reviewer.competency_level >= method.min_competency_level, else ERR_ANALYST_COMPETENCY_INSUFFICIENT"
        side_effects:
          - "an immutable ReviewRecord is created with review_type TECHNICAL, decision AGREE, reviewer_analyst_id = X-User-ID, revision_round_snapshot = request.revision_round"
          - "increments ExaminationRequest.version by 1"
      - from: TECH_REVIEW
        to: DISAGREEMENT
        trigger: "POST /lab/examination-requests/{examination_request_id}/technical-review with decision DISAGREE"
        actor: Analyst
        preconditions:
          - "identical battery to the AGREE branch"
        side_effects:
          - "cascade hop 1: an immutable ReviewRecord is created with review_type TECHNICAL, decision DISAGREE; the request enters DISAGREEMENT"
          - "cascade hop 2 (caused by hop 1's DISAGREEMENT state, not by the request body): a Nonconformance is created with source TECHNICAL_DISAGREEMENT, severity MAJOR, examination_request_id = this request, analyst_id = assigned_analyst_id, opened_at_utc = clock_now, due_utc = opened_at_utc + CAPA_SLA_DAYS[MAJOR]"
          - "cascade hop 3 (caused by hop 2's MAJOR finding carrying an analyst_id): that analyst QUALIFIED -> PROBATION, probation_entered_at_utc = clock_now"
          - "cascade hop 4 (caused by hop 3's PROBATION state): PROBATION_RELEASE(analyst) - every ACTIVE assignment of that analyst on a P1_STATUTORY or P2_VIOLENT case is RELEASED, its request falls back to QUEUED and CASE_RECOMPUTE runs on each affected case"
          - "increments ExaminationRequest.version by 1"
      - from: DISAGREEMENT
        to: ADMIN_REVIEW
        trigger: "POST /lab/examination-requests/{examination_request_id}/disagreement-resolution with decision UPHOLD_ANALYST"
        actor: QualityManager
        preconditions:
          - "status == DISAGREEMENT, else ERR_EXAM_REQUEST_INVALID_STATE"
        side_effects:
          - "an immutable ReviewRecord is created with review_type DISAGREEMENT_RESOLUTION, decision UPHOLD_ANALYST, reviewer_operator_id = X-User-ID"
          - "cascade hop 1 (compensation): the TECHNICAL_DISAGREEMENT Nonconformance for this request with status IN {OPEN, ROOT_CAUSE_SUBMITTED} -> VOIDED, closed_at_utc = clock_now"
          - "cascade hop 2 (caused by hop 1, conditional): the implicated analyst PROBATION -> QUALIFIED only when that analyst has no remaining Nonconformance with status IN {OPEN, ROOT_CAUSE_SUBMITTED, CAPA_APPROVED}"
          - "assignments released by the original PROBATION_RELEASE are NOT restored - the hours ledger stays consistent with ER_HOLD_SET membership"
          - "increments ExaminationRequest.version by 1"
      - from: DISAGREEMENT
        to: IN_ANALYSIS
        trigger: "POST /lab/examination-requests/{examination_request_id}/disagreement-resolution with decision UPHOLD_REVIEWER"
        actor: QualityManager
        preconditions:
          - "status == DISAGREEMENT"
          - "REOPEN_HOLD(request) resolves to the reopen branch (the incumbent analyst is still eligible)"
        side_effects:
          - "an immutable ReviewRecord is created with review_type DISAGREEMENT_RESOLUTION, decision UPHOLD_REVIEWER"
          - "revision_round += 1"
          - "REOPEN_HOLD reopen branch: the COMPLETED Assignment -> ACTIVE, analyst.assigned_casework_hours += estimated_hours, evidence item IN_VAULT -> IN_ANALYSIS"
          - "the TECHNICAL_DISAGREEMENT Nonconformance stays OPEN"
          - "increments ExaminationRequest.version by 1"
      - from: DISAGREEMENT
        to: QUEUED
        trigger: "POST /lab/examination-requests/{examination_request_id}/disagreement-resolution with decision UPHOLD_REVIEWER when the incumbent analyst is no longer eligible"
        actor: QualityManager
        preconditions:
          - "status == DISAGREEMENT"
          - "REOPEN_HOLD(request) resolves to the requeue branch (analyst SUSPENDED, DECERTIFIED, not ACTIVE, or PROBATION on a P1/P2 case)"
        side_effects:
          - "revision_round += 1"
          - "assigned_analyst_id -> null; the COMPLETED Assignment is left COMPLETED and no hours are re-encumbered"
          - "CASE_RECOMPUTE(case)"
          - "increments ExaminationRequest.version by 1"
      - from: ADMIN_REVIEW
        to: RELEASED
        trigger: "POST /lab/examination-requests/{examination_request_id}/administrative-review with decision APPROVE"
        actor: CaseManager
        preconditions:
          - "status == ADMIN_REVIEW, else ERR_EXAM_REQUEST_INVALID_STATE"
        side_effects:
          - "an immutable ReviewRecord is created with review_type ADMINISTRATIVE, decision APPROVE, reviewer_operator_id = X-User-ID"
          - "released_at_utc = clock_now"
          - "CASE_RECOMPUTE(case) refreshes open_examination_request_count and released_examination_request_count"
          - "increments ExaminationRequest.version by 1"
      - from: ADMIN_REVIEW
        to: IN_ANALYSIS
        trigger: "POST /lab/examination-requests/{examination_request_id}/administrative-review with decision RETURN"
        actor: CaseManager
        preconditions:
          - "status == ADMIN_REVIEW"
          - "REOPEN_HOLD(request) resolves to the reopen branch"
        side_effects:
          - "an immutable ReviewRecord is created with review_type ADMINISTRATIVE, decision RETURN"
          - "revision_round += 1"
          - "REOPEN_HOLD reopen branch: COMPLETED Assignment -> ACTIVE, analyst.assigned_casework_hours += estimated_hours, evidence item IN_VAULT -> IN_ANALYSIS"
          - "increments ExaminationRequest.version by 1"
      - from: ADMIN_REVIEW
        to: QUEUED
        trigger: "POST /lab/examination-requests/{examination_request_id}/administrative-review with decision RETURN when the incumbent analyst is no longer eligible"
        actor: CaseManager
        preconditions:
          - "status == ADMIN_REVIEW"
          - "REOPEN_HOLD(request) resolves to the requeue branch"
        side_effects:
          - "revision_round += 1"
          - "assigned_analyst_id -> null; no hours re-encumbered"
          - "CASE_RECOMPUTE(case)"
          - "increments ExaminationRequest.version by 1"
      - from: QUEUED
        to: OUTSOURCED
        trigger: "POST /lab/examination-requests/{examination_request_id}/vendor-engagements"
        actor: CaseManager
        preconditions:
          - "status == QUEUED, else ERR_EXAM_REQUEST_INVALID_STATE"
          - "vendor.status == ACTIVE, else ERR_VENDOR_SUSPENDED"
          - "method.discipline IN vendor.accredited_disciplines AND vendor.accreditation_expires_at_utc > window_end_utc, else ERR_VENDOR_NOT_ACCREDITED"
          - "window_end_utc > window_start_utc, else ERR_INVALID_INTERVAL"
          - "closed-interval capacity check per validations[priority=17], else ERR_VENDOR_CAPACITY_EXCEEDED"
          - "vendor.encumbered_cents + vendor.spent_cents + award_amount_cents <= vendor.contract_ceiling_cents, else ERR_VENDOR_CEILING_EXCEEDED"
        side_effects:
          - "a VendorEngagement is created with status AWARDED, awarded_at_utc = clock_now and the pricing fields from calculations.vendor_award_pricing"
          - "cascade hop 1 (ledger sync): vendor.encumbered_cents += award_amount_cents"
          - "increments ExaminationRequest.version by 1"
          - "CASE_RECOMPUTE(case) - AWAITING_ASSIGNMENT -> IN_PROGRESS"
      - from: OUTSOURCED
        to: TECH_REVIEW
        trigger: "POST /lab/vendor-engagements/{vendor_engagement_id}/record-return"
        actor: CaseManager
        preconditions:
          - "the engagement is AT_VENDOR"
        side_effects:
          - "vendor_custody_days = sum of custody_days over this request's RETURNED engagements"
          - "increments ExaminationRequest.version by 1"
      - from: OUTSOURCED
        to: QUEUED
        trigger: "POST /lab/vendor-engagements/{vendor_engagement_id}/cancel"
        actor: CaseManager
        preconditions:
          - "the engagement is AWARDED or AT_VENDOR"
        side_effects:
          - "increments ExaminationRequest.version by 1"
          - "CASE_RECOMPUTE(case)"
      - from: QUEUED
        to: CANCELLED
        trigger: "system: cascade hop 1 of POST /lab/methods/{method_id}/retire"
        actor: system
        preconditions:
          - "status == QUEUED and the retired method is this request's method"
        side_effects:
          - "increments ExaminationRequest.version by 1"
          - "cascade hop 2 (caused by hop 1's CANCELLED request): CASE_RECOMPUTE(case) refreshes open_examination_request_count"

  - entity: Assignment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, RELEASED]
    note: "COMPLETED -> ACTIVE is a genuine cycle: a returned or reworked request re-encumbers the same assignment row instead of minting a new one."
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: reassignment via POST /lab/examination-requests/{examination_request_id}/assignments"
        actor: system
        preconditions:
          - "status == ACTIVE and a replacement assignment is being created for the same request"
        side_effects:
          - "closed_at_utc = clock_now, superseded_by_assignment_id set"
          - "holder analyst.assigned_casework_hours -= estimated_hours"
          - "increments Assignment.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "system: PROBATION_RELEASE or FULL_RELEASE cascade"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "closed_at_utc = clock_now"
          - "holder analyst.assigned_casework_hours -= estimated_hours"
          - "increments Assignment.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: POST /lab/examination-requests/{examination_request_id}/complete-analysis"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "closed_at_utc = clock_now"
          - "holder analyst.assigned_casework_hours -= estimated_hours"
          - "increments Assignment.version by 1"
      - from: COMPLETED
        to: ACTIVE
        trigger: "system: REOPEN_HOLD reopen branch on administrative RETURN or disagreement UPHOLD_REVIEWER"
        actor: system
        preconditions:
          - "status == COMPLETED and the holder is still eligible per REOPEN_HOLD"
        side_effects:
          - "closed_at_utc = null"
          - "holder analyst.assigned_casework_hours += estimated_hours"
          - "increments Assignment.version by 1"

  - entity: Analyst
    initial_state: QUALIFIED
    terminal_states: [DECERTIFIED]
    note: "Cyclic quality-system standing. QUALIFIED <-> PROBATION and PROBATION <-> SUSPENDED both cycle; only DECERTIFIED is absorbing."
    transitions:
      - from: QUALIFIED
        to: PROBATION
        trigger: "system: POST /lab/proficiency-tests/{proficiency_test_id}/score yielding result FAIL (consecutive_pt_failures becomes 1), OR creation of a Nonconformance with severity IN {MAJOR, CRITICAL} carrying this analyst_id"
        actor: system
        preconditions:
          - "qualification_state == QUALIFIED"
        side_effects:
          - "probation_entered_at_utc = clock_now"
          - "PROBATION_RELEASE(analyst): each ACTIVE assignment on a P1_STATUTORY or P2_VIOLENT case is RELEASED, its request falls back to QUEUED, hours are de-encumbered and CASE_RECOMPUTE runs per affected case"
          - "increments Analyst.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: POST /lab/proficiency-tests/{proficiency_test_id}/score yielding result FAIL with consecutive_pt_failures >= PT_SUSPENSION_THRESHOLD"
        actor: system
        preconditions:
          - "qualification_state == PROBATION"
        side_effects:
          - "suspended_at_utc = clock_now"
          - "FULL_RELEASE(analyst): every ACTIVE assignment is RELEASED regardless of case priority_class, each request falls back to QUEUED and CASE_RECOMPUTE runs"
          - "increments Analyst.version by 1"
      - from: PROBATION
        to: QUALIFIED
        trigger: "system: POST /lab/proficiency-tests/{proficiency_test_id}/score yielding result PASS, OR POST /lab/nonconformances/{nonconformance_id}/verify-close, OR POST /lab/examination-requests/{examination_request_id}/disagreement-resolution with UPHOLD_ANALYST"
        actor: system
        preconditions:
          - "qualification_state == PROBATION"
          - "the analyst has no Nonconformance with status IN {OPEN, ROOT_CAUSE_SUBMITTED, CAPA_APPROVED} after the triggering mutation is applied"
        side_effects:
          - "consecutive_pt_failures = 0 when the trigger is a PASS proficiency test; left unchanged on the nonconformance paths"
          - "probation_entered_at_utc = null"
          - "released assignments are not restored"
          - "increments Analyst.version by 1"
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /lab/analysts/{analyst_id}/reinstate"
        actor: QualityManager
        preconditions:
          - "qualification_state == SUSPENDED, else ERR_ANALYST_INVALID_QUALIFICATION_STATE (DECERTIFIED -> ERR_ANALYST_DECERTIFIED)"
          - "no Nonconformance for this analyst with status IN {OPEN, ROOT_CAUSE_SUBMITTED, CAPA_APPROVED}, else ERR_OPEN_NONCONFORMANCE_BLOCKS_REINSTATEMENT"
          - "at least one SCORED ProficiencyTest for this analyst with result PASS and scored_at_utc > suspended_at_utc, else ERR_REINSTATEMENT_PT_REQUIRED"
        side_effects:
          - "consecutive_pt_failures = 0, suspended_at_utc = null, probation_entered_at_utc = clock_now"
          - "increments Analyst.version by 1"
      - from: SUSPENDED
        to: DECERTIFIED
        trigger: "system: POST /lab/proficiency-tests/{proficiency_test_id}/score yielding result FAIL while SUSPENDED"
        actor: system
        preconditions:
          - "qualification_state == SUSPENDED"
        side_effects:
          - "FULL_RELEASE(analyst)"
          - "increments Analyst.version by 1"

  - entity: Method
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /lab/methods/{method_id}/validate"
        actor: QualityManager
        preconditions:
          - "validation_status == DRAFT, else ERR_METHOD_INVALID_STATE"
          - "validation_study_item_count >= MIN_VALIDATION_STUDY_ITEMS (12), else ERR_METHOD_VALIDATION_INSUFFICIENT"
          - "precision_cv_pct <= MAX_VALIDATION_CV_PCT (5.00), else ERR_METHOD_VALIDATION_INSUFFICIENT"
          - "expires_at_utc > clock_now, else ERR_INVALID_REQUEST"
        side_effects:
          - "validated_at_utc = clock_now, validation_expires_at_utc = expires_at_utc, study fields stored"
          - "increments Method.version by 1"
      - from: VALIDATED
        to: RETIRED
        trigger: "POST /lab/methods/{method_id}/retire"
        actor: QualityManager
        preconditions:
          - "validation_status == VALIDATED, else ERR_METHOD_INVALID_STATE"
        side_effects:
          - "retired_at_utc = clock_now, retirement_reason stored"
          - "cascade hop 1 (cascade down, conditional): every ExaminationRequest with this method_id and status == QUEUED -> CANCELLED"
          - "cascade hop 2 (caused by hop 1): CASE_RECOMPUTE runs on each affected case, refreshing open_examination_request_count"
          - "increments Method.version by 1"

  - entity: ProficiencyTest
    initial_state: ASSIGNED
    terminal_states: [SCORED]
    transitions:
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /lab/proficiency-tests/{proficiency_test_id}/submit"
        actor: Analyst
        preconditions:
          - "status == ASSIGNED, else ERR_PT_INVALID_STATE"
          - "X-User-ID == analyst_id, else ERR_ANALYST_IDENTITY_MISMATCH"
        side_effects:
          - "submitted_at_utc = clock_now, late_submission = (submitted_at_utc > due_utc)"
          - "increments ProficiencyTest.version by 1"
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /lab/proficiency-tests/{proficiency_test_id}/score"
        actor: QualityManager
        preconditions:
          - "status == SUBMITTED, else ERR_PT_INVALID_STATE"
        side_effects:
          - "score_pct stored, scored_at_utc = clock_now, result computed per calculations.proficiency_test_grading"
          - "cascade hop 1 (cross-entity): result FAIL increments analyst.consecutive_pt_failures by 1; result PASS resets it to 0; result INCONCLUSIVE leaves it unchanged"
          - "cascade hop 2 (caused by hop 1's counter/state): analyst QUALIFIED -> PROBATION at 1 failure, PROBATION -> SUSPENDED at PT_SUSPENSION_THRESHOLD failures, SUSPENDED -> DECERTIFIED on a further failure, PROBATION -> QUALIFIED on a PASS with no open findings"
          - "cascade hop 3 (caused by hop 2's qualification transition): PROBATION_RELEASE or FULL_RELEASE de-encumbers assignments and requeues their requests"
          - "cascade hop 4 (caused by hop 3's requeued requests): CASE_RECOMPUTE flips each affected case IN_PROGRESS -> AWAITING_ASSIGNMENT"
          - "result INCONCLUSIVE additionally creates a Nonconformance with source PT_INCONCLUSIVE, severity MINOR, analyst_id set - severity MINOR does not touch qualification_state"
          - "result FAIL additionally creates a Nonconformance with source PT_FAILURE, severity MAJOR, analyst_id set"
          - "increments ProficiencyTest.version by 1"

  - entity: VendorEngagement
    initial_state: AWARDED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: AWARDED
        to: AT_VENDOR
        trigger: "POST /lab/vendor-engagements/{vendor_engagement_id}/confirm-shipment"
        actor: CaseManager
        preconditions:
          - "status == AWARDED, else ERR_VENDOR_ENGAGEMENT_INVALID_STATE"
          - "evidence_item.custody_status == IN_VAULT, else ERR_EVIDENCE_CUSTODY_INVALID_STATE"
        side_effects:
          - "shipped_at_utc = clock_now"
          - "cascade hop 1 (cross-entity): evidence item IN_VAULT -> IN_ANALYSIS, checkout_count += 1"
          - "increments VendorEngagement.version by 1"
      - from: AT_VENDOR
        to: RETURNED
        trigger: "POST /lab/vendor-engagements/{vendor_engagement_id}/record-return"
        actor: CaseManager
        preconditions:
          - "status == AT_VENDOR, else ERR_VENDOR_ENGAGEMENT_INVALID_STATE"
          - "final_invoice_cents >= 0, else ERR_INVALID_REQUEST"
        side_effects:
          - "returned_at_utc = clock_now, custody_days = round_half_up((returned_at_utc - awarded_at_utc) / 86400, 2), variance_cents = final_invoice_cents - award_amount_cents"
          - "cascade hop 1 (ledger sync): vendor.encumbered_cents -= award_amount_cents and vendor.spent_cents += final_invoice_cents"
          - "cascade hop 2 (cross-entity): the request OUTSOURCED -> TECH_REVIEW and its vendor_custody_days refreshed; evidence item IN_ANALYSIS -> IN_VAULT"
          - "cascade hop 3 (conditional, caused by hop 1's variance): when abs(variance_cents) > round_half_up(award_amount_cents * VENDOR_VARIANCE_TOLERANCE_PCT) a Nonconformance is created with source VENDOR_VARIANCE, severity MINOR, examination_request_id set, analyst_id null"
          - "increments VendorEngagement.version by 1"
      - from: AWARDED
        to: CANCELLED
        trigger: "POST /lab/vendor-engagements/{vendor_engagement_id}/cancel"
        actor: CaseManager
        preconditions:
          - "status == AWARDED, else ERR_VENDOR_ENGAGEMENT_INVALID_STATE"
        side_effects:
          - "cancellation_reason stored"
          - "cascade hop 1 (compensation): vendor.encumbered_cents -= award_amount_cents, restoring the pre-award value exactly; vendor.spent_cents untouched"
          - "cascade hop 2 (cross-entity): the request OUTSOURCED -> QUEUED, then CASE_RECOMPUTE(case)"
          - "increments VendorEngagement.version by 1"
      - from: AT_VENDOR
        to: CANCELLED
        trigger: "POST /lab/vendor-engagements/{vendor_engagement_id}/cancel"
        actor: CaseManager
        preconditions:
          - "status == AT_VENDOR"
        side_effects:
          - "cascade hop 1 (compensation): vendor.encumbered_cents -= award_amount_cents; vendor.spent_cents untouched"
          - "cascade hop 2 (cross-entity): the request OUTSOURCED -> QUEUED, evidence item IN_ANALYSIS -> IN_VAULT, then CASE_RECOMPUTE(case)"
          - "increments VendorEngagement.version by 1"

  - entity: Nonconformance
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    note: "ROOT_CAUSE_SUBMITTED -> OPEN on CAPA rejection is a revision cycle; the second rejection escalates severity one tier and recomputes due_utc from the original opened_at_utc."
    transitions:
      - from: OPEN
        to: ROOT_CAUSE_SUBMITTED
        trigger: "POST /lab/nonconformances/{nonconformance_id}/root-cause"
        actor: CaseManager
        preconditions:
          - "status == OPEN, else ERR_NONCONFORMANCE_INVALID_STATE"
        side_effects:
          - "root_cause_category and corrective_action_plan stored"
          - "increments Nonconformance.version by 1"
      - from: ROOT_CAUSE_SUBMITTED
        to: CAPA_APPROVED
        trigger: "POST /lab/nonconformances/{nonconformance_id}/capa-decision with decision APPROVE"
        actor: QualityManager
        preconditions:
          - "status == ROOT_CAUSE_SUBMITTED, else ERR_NONCONFORMANCE_INVALID_STATE"
        side_effects:
          - "increments Nonconformance.version by 1"
      - from: ROOT_CAUSE_SUBMITTED
        to: OPEN
        trigger: "POST /lab/nonconformances/{nonconformance_id}/capa-decision with decision REJECT"
        actor: QualityManager
        preconditions:
          - "status == ROOT_CAUSE_SUBMITTED"
        side_effects:
          - "capa_rejection_count += 1; root_cause_category and corrective_action_plan reset to null"
          - "threshold side effect: when capa_rejection_count == CAPA_ESCALATION_THRESHOLD, severity escalates one tier (MINOR -> MAJOR -> CRITICAL; CRITICAL stays CRITICAL) and due_utc is recomputed as opened_at_utc + CAPA_SLA_DAYS[new severity]"
          - "increments Nonconformance.version by 1"
      - from: CAPA_APPROVED
        to: CLOSED
        trigger: "POST /lab/nonconformances/{nonconformance_id}/verify-close"
        actor: QualityManager
        preconditions:
          - "status == CAPA_APPROVED, else ERR_NONCONFORMANCE_INVALID_STATE"
        side_effects:
          - "closed_at_utc = clock_now, overdue recomputed to false"
          - "cascade hop 1 (conditional, cross-entity): when analyst_id is set and that analyst is PROBATION and has no remaining Nonconformance with status IN {OPEN, ROOT_CAUSE_SUBMITTED, CAPA_APPROVED}, the analyst PROBATION -> QUALIFIED"
          - "increments Nonconformance.version by 1"
      - from: OPEN
        to: VOIDED
        trigger: "system: POST /lab/examination-requests/{examination_request_id}/disagreement-resolution with decision UPHOLD_ANALYST"
        actor: system
        preconditions:
          - "source == TECHNICAL_DISAGREEMENT and examination_request_id matches the resolved request"
        side_effects:
          - "closed_at_utc = clock_now"
          - "cascade hop 1 (conditional): the implicated analyst PROBATION -> QUALIFIED when no other open findings remain"
          - "increments Nonconformance.version by 1"
      - from: ROOT_CAUSE_SUBMITTED
        to: VOIDED
        trigger: "system: POST /lab/examination-requests/{examination_request_id}/disagreement-resolution with decision UPHOLD_ANALYST"
        actor: system
        preconditions:
          - "source == TECHNICAL_DISAGREEMENT and examination_request_id matches the resolved request"
        side_effects:
          - "closed_at_utc = clock_now"
          - "increments Nonconformance.version by 1"

  - entity: CourtEvent
    initial_state: SCHEDULED
    terminal_states: [TESTIFIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /lab/court-events/{court_event_id}/confirm"
        actor: CaseManager
        preconditions:
          - "status == SCHEDULED, else ERR_COURT_EVENT_INVALID_STATE"
        side_effects:
          - "subpoena_received = true"
          - "increments CourtEvent.version by 1"
      - from: CONFIRMED
        to: TESTIFIED
        trigger: "POST /lab/court-events/{court_event_id}/complete"
        actor: CaseManager
        preconditions:
          - "status == CONFIRMED, else ERR_COURT_EVENT_INVALID_STATE"
          - "clock_now >= end_utc, else ERR_COURT_EVENT_NOT_ELAPSED"
        side_effects:
          - "testimony_note stored; the block no longer occupies the analyst calendar for overlap arithmetic"
          - "increments CourtEvent.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lab/court-events/{court_event_id}/cancel"
        actor: CaseManager
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "cancellation_reason stored; the block is released from the analyst calendar"
          - "increments CourtEvent.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /lab/court-events/{court_event_id}/cancel"
        actor: CaseManager
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "cancellation_reason stored; the block is released from the analyst calendar"
          - "increments CourtEvent.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-request
    parent_entity: ExaminationRequest
    write_endpoint: "POST /lab/examination-requests/{examination_request_id}/assignments"
    occ_field: "expected_examination_request_version"
    description: |
      Creating an Assignment against an ExaminationRequest whose version has advanced since the client
      last observed it is rejected. A reassignment legitimately supersedes the incumbent holder, so a
      writer working from a stale view of the request would silently displace a holder it never saw;
      the stale-version check turns that into a deterministic 412.
    error_id: ERR_STALE_EXAM_REQUEST_VERSION
    http_status: 412
  - rule_id: priority-override-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /lab/cases/{case_id}/priority-overrides"
    occ_field: "expected_case_version"
    description: |
      Recording a priority override against a Case whose version has advanced since the client last
      observed it is rejected. Each override supersedes the prior override, and the derived
      priority_class it replaces may have changed through intake, request creation or an earlier
      override; the stale-version check makes the supersede deterministic.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: case_priority_scoring
    trigger: "On POST /lab/cases (initial computation) and on POST /lab/cases/{case_id}/priority-overrides (priority_class re-derivation)"
    algorithm: weighted_scoring
    formula: |
      # ---- evaluation order is pinned; do not reorder ----
      days_to_deadline = null if statutory_deadline_utc is null
                         else floor((statutory_deadline_utc - received_at_utc) / 86400)
      days_to_court    = null if court_date_utc is null
                         else floor((court_date_utc - received_at_utc) / 86400)

      deadline_points = 0  if days_to_deadline is null
                        else 30 if days_to_deadline <= 14
                        else 22 if days_to_deadline <= 30
                        else 14 if days_to_deadline <= 60
                        else 6  if days_to_deadline <= 120
                        else 0
      court_points    = 0  if days_to_court is null
                        else 10 if days_to_court <= 30
                        else 5  if days_to_court <= 60
                        else 0

      violent_crime_flag = offense_category IN {HOMICIDE, SEXUAL_ASSAULT, AGG_ASSAULT, ROBBERY}

      # step 1: severity + custody, then the violence multiplier on that subtotal only
      base_points     = SEVERITY_POINTS[offense_category]
                        + (CUSTODY_POINTS if suspect_in_custody else 0)
      weighted_base   = round_half_up(base_points * (VIOLENT_MULTIPLIER if violent_crime_flag else 1.00), 2)

      # step 2: non-linear temporal blend - the stronger signal counts fully, the weaker one at half
      temporal_points = round_half_up(max(deadline_points, court_points)
                                      + min(deadline_points, court_points) * 0.50, 2)

      # step 3: cap last
      priority_score  = min(SCORE_CAP, round_half_up(weighted_base + temporal_points, 2))

      # class derivation - override wins, then statutory proximity, then violence
      priority_class  = priority_override_class if priority_override_class is not null
                        else P1_STATUTORY if (days_to_deadline is not null and days_to_deadline <= P1_DEADLINE_DAYS)
                        else P2_VIOLENT   if violent_crime_flag
                        else P3_ROUTINE
    input_set: "A single Case row's own input fields plus its system received_at_utc; no other entity participates. priority_score is never recomputed after creation (an override changes priority_class only). SCORE_CAP is a non-binding defensive ceiling under the declared constants: the reachable maximum is weighted_base 60.50 (HOMICIDE 40 + CUSTODY_POINTS 15, times VIOLENT_MULTIPLIER) plus the maximum temporal blend 35.00 (deadline 30 fully, court 10 at half), i.e. 95.50, so no admissible input reaches 100.00 and no test may assert the cap binding."
    constants:
      SEVERITY_POINTS: { HOMICIDE: 40, SEXUAL_ASSAULT: 36, AGG_ASSAULT: 30, ROBBERY: 26, BURGLARY: 16, DRUG_OFFENSE: 12, PROPERTY_CRIME: 8, OTHER: 4 }
      CUSTODY_POINTS: 15
      VIOLENT_MULTIPLIER: 1.10
      SCORE_CAP: 100.00
      P1_DEADLINE_DAYS: 30
    precision: "2 decimal places, round_half_up; day counts are integer floors of whole seconds"

  - name: exam_request_hour_estimate
    trigger: "On POST /lab/examination-requests, and snapshotted onto every Assignment created for the request"
    algorithm: aggregation
    formula: |
      estimated_hours = round_half_up(method.standard_hours_per_item * item_count, 2)
    input_set: "The chosen Method row and the request's own item_count. Never recomputed after creation, so a later Method edit cannot retroactively change an encumbered estimate."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: analyst_workload_variants
    trigger: "On GET /lab/analysts/{analyst_id}/workload, and as the capacity gate on POST /lab/examination-requests/{examination_request_id}/assignments and /auto-assign"
    algorithm: aggregation
    formula: |
      available_hours = round_half_up(max(0.00, weekly_capacity_hours - training_hours_per_week), 2)

      # variant PROJECTED_ESTIMATE - what is encumbered right now
      projected_load_hours = round_half_up(
          sum(a.estimated_hours for a in Assignment where a.analyst_id == analyst.id
                                                     and a.status == ACTIVE), 2)
      projected_utilization_pct = 0.00 if available_hours == 0.00
                                  else round_half_up(projected_load_hours / available_hours * 100, 2)

      # variant REALIZED_LOGGED - what the work actually consumed
      realized_load_hours = round_half_up(
          sum( (er.actual_hours_logged if er.actual_hours_logged is not null else a.estimated_hours)
               for a in Assignment where a.analyst_id == analyst.id
                                     and a.status IN {ACTIVE, COMPLETED}
               for er = a.examination_request ), 2)
      realized_utilization_pct = 0.00 if available_hours == 0.00
                                 else round_half_up(realized_load_hours / available_hours * 100, 2)

      casework_training_ratio = 0.00 if training_hours_per_week == 0.00
                                else round_half_up(projected_load_hours / training_hours_per_week, 2)

      # capacity gate (uses PROJECTED_ESTIMATE only)
      post_assignment_pct = 0.00 if available_hours == 0.00 else round_half_up(
          (projected_load_hours + request.estimated_hours) / available_hours * 100, 2)
      admit if post_assignment_pct <= UTILIZATION_CEILING_PCT
    input_set: "Assignment rows of one analyst. PROJECTED_ESTIMATE counts only status ACTIVE. REALIZED_LOGGED counts status IN {ACTIVE, COMPLETED} and substitutes the request's actual_hours_logged wherever it is non-null, falling back to the snapshotted estimate otherwise. SUPERSEDED and RELEASED assignments are excluded from both variants."
    constants:
      UTILIZATION_CEILING_PCT: 100.00
      REMEDIATION_TRAINING_MIN_HOURS: 8.00
    precision: "2 decimal places, round_half_up on both the numerator sum and the percentage"
    variants:
      - name: projected_estimate
        when: "Assignment admission gate and the projected_* fields of the workload read"
        difference: "Numerator is the sum of snapshotted estimated_hours over ACTIVE assignments only; completed work drops out entirely."
      - name: realized_logged
        when: "The realized_* fields of the workload read, used for backlog and staffing analysis"
        difference: "Numerator adds COMPLETED assignments back in and replaces the estimate with actual_hours_logged whenever the analyst reported hours, so identical assignment history yields a different utilization than projected_estimate."

  - name: case_turnaround_variants
    trigger: "On POST /lab/cases/{case_id}/report, writing Case.gross_turnaround_days and Case.net_turnaround_days"
    algorithm: interval_merge
    formula: |
      # variant GROSS_CALENDAR
      gross_turnaround_days = round_half_up((reported_at_utc - received_at_utc) / 86400, 2)

      # variant NET_LAB_CUSTODY - subtract the UNION of vendor custody windows
      windows = [ (e.awarded_at_utc, e.returned_at_utc)
                  for e in VendorEngagement
                  where e.examination_request.case_id == case.id and e.status == RETURNED ]
      # sort by start ASC, tie-break by created_at ASC; merge closed intervals that overlap or touch
      merged  = merge_intervals(windows)            # [a,b] and [b,c] merge into [a,c]
      vendor_custody_days = round_half_up(sum(b - a for (a,b) in merged) / 86400, 2)
      net_turnaround_days = max(0.00, round_half_up(gross_turnaround_days - vendor_custody_days, 2))
    input_set: "Only VendorEngagement rows with status RETURNED enter the union; AWARDED, AT_VENDOR and CANCELLED engagements are excluded. Overlapping windows from two different requests of the same case are merged once, never double-counted."
    constants: {}
    precision: "2 decimal places, round_half_up; the merge is performed on whole-second instants before any rounding"
    variants:
      - name: gross_calendar
        when: "Published turnaround statistic against statutory expectations"
        difference: "Counts every calendar second from submission to report release, including time the evidence sat in a vendor laboratory."
      - name: net_lab_custody
        when: "Internal backlog and staffing analysis"
        difference: "Subtracts the merged union of vendor custody windows, so the same case yields a smaller number; two overlapping vendor windows reduce it by their union, not their sum."

  - name: vendor_award_pricing
    trigger: "On POST /lab/examination-requests/{examination_request_id}/vendor-engagements, writing the engagement's pricing fields and the vendor's encumbrance"
    algorithm: tiered_pricing
    formula: |
      # The volume tier depends on the total, and the surcharge feeds the total - the circularity is
      # resolved by this pinned order. Do NOT discount before surcharging, and do NOT compute the
      # surcharge on a discounted amount.
      step 1: base_amount_cents   = vendor.unit_price_cents * item_count
      step 2: rush_surcharge_cents = round_half_up(base_amount_cents * vendor.rush_surcharge_pct)
                                     if rush_flag else 0
      step 3: tier_basis_cents    = base_amount_cents + rush_surcharge_cents
      step 4: volume_discount_pct = 0.12 if tier_basis_cents >= 500000
                                    else 0.08 if tier_basis_cents >= 250000
                                    else 0.04 if tier_basis_cents >= 100000
                                    else 0.00
      step 5: discount_amount_cents = round_half_up(tier_basis_cents * volume_discount_pct)
      step 6: award_amount_cents    = tier_basis_cents - discount_amount_cents
      # ceiling gate, evaluated on the finished award
      admit if vendor.encumbered_cents + vendor.spent_cents + award_amount_cents
              <= vendor.contract_ceiling_cents
    input_set: "One Vendor's contract fields and the request's item_count snapshot. Tier thresholds are compared against tier_basis_cents (rush-inclusive), never against base_amount_cents."
    constants:
      TIER_1_THRESHOLD_CENTS: 100000
      TIER_2_THRESHOLD_CENTS: 250000
      TIER_3_THRESHOLD_CENTS: 500000
      TIER_1_PCT: 0.04
      TIER_2_PCT: 0.08
      TIER_3_PCT: 0.12
      VENDOR_VARIANCE_TOLERANCE_PCT: 0.10
    precision: "Integer cents throughout; round_half_up applied at step 2 and step 5 only"

  - name: backlog_aging_index
    trigger: "On GET /lab/backlog-report"
    algorithm: aggregation
    formula: |
      as_of = as_of_utc query parameter if present else clock_now
      open_requests = [ er for er in ExaminationRequest
                        where er.status NOT IN {RELEASED, CANCELLED}
                          and (discipline query parameter is null or er.discipline == that value) ]

      # ---- rounding order is pinned: round the age, weight it, round again, THEN sum ----
      for each er in open_requests:
          age_days_er      = round_half_up((as_of - er.requested_at_utc) / 86400, 2)
          weighted_age_er  = round_half_up(age_days_er * PRIORITY_WEIGHT[er.case.priority_class], 2)
      backlog_index = 0.00 if open_requests is empty
                      else round_half_up(sum(weighted_age_er) / count(open_requests), 2)
      # NOT: round(sum(unrounded_age * weight) / count, 2) - that order is explicitly rejected

      bucket_0_29_count   = count(er where 0.00 <= age_days_er <  30.00)
      bucket_30_59_count  = count(er where 30.00 <= age_days_er < 60.00)
      bucket_60_89_count  = count(er where 60.00 <= age_days_er < 90.00)
      bucket_90_plus_count = count(er where age_days_er >= 90.00)
      p1_open_count       = count(er where er.case.priority_class == P1_STATUTORY)
      outsourcing_recommended = backlog_index >= OUTSOURCE_TRIGGER_INDEX
    input_set: "ExaminationRequest rows with status NOT IN {RELEASED, CANCELLED}, optionally narrowed to one discipline. Buckets are half-open on the left-closed side, so an age of exactly 30.00 days lands in bucket_30_59_count."
    constants:
      PRIORITY_WEIGHT: { P1_STATUTORY: 1.50, P2_VIOLENT: 1.25, P3_ROUTINE: 1.00 }
      OUTSOURCE_TRIGGER_INDEX: 45.00
    precision: "2 decimal places, round_half_up at each of the two pinned steps"

  - name: proficiency_test_grading
    trigger: "On POST /lab/proficiency-tests/{proficiency_test_id}/score, writing ProficiencyTest.result"
    algorithm: threshold
    formula: |
      late_submission = submitted_at_utc > due_utc
      result = FAIL if late_submission                      # lateness overrides the score entirely
               else PASS         if score_pct >= PT_PASS_PCT
               else INCONCLUSIVE if score_pct >= PT_INCONCLUSIVE_PCT
               else FAIL
    input_set: "One ProficiencyTest row; score_pct from the request body and submitted_at_utc / due_utc already stored."
    constants:
      PT_PASS_PCT: 90.00
      PT_INCONCLUSIVE_PCT: 70.00
      PT_SUSPENSION_THRESHOLD: 2
    precision: "score_pct compared at 2 decimal places; boundaries are inclusive on the upper band (90.00 is PASS, 89.99 is INCONCLUSIVE, 70.00 is INCONCLUSIVE, 69.99 is FAIL)"

  - name: analyst_selection_ranking
    trigger: "On POST /lab/examination-requests/{examination_request_id}/auto-assign"
    algorithm: selector_ranking
    formula: |
      # (a) eligibility filter - explicit predicate over entity fields
      candidates = [ a for a in Analyst where
                     a.employment_status == ACTIVE
                     and ( a.qualification_state == QUALIFIED
                           or ( a.qualification_state == PROBATION
                                and case.priority_class == P3_ROUTINE
                                and a.training_hours_per_week >= REMEDIATION_TRAINING_MIN_HOURS ) )
                     and method.discipline IN a.disciplines
                     and a.competency_level >= method.min_competency_level
                     and post_assignment_pct(a) <= UTILIZATION_CEILING_PCT ]
      # (b) ranking expression
      order by post_assignment_pct(a) ASC
      # (c) tie-breaks, applied in order
      then by count(Assignment where analyst_id == a.id and status == ACTIVE) ASC
      then by a.created_at ASC        # never a.id - random identifiers decide nothing
      # (d) empty-pool fallback
      if candidates is empty: reject with ERR_NO_ELIGIBLE_ANALYST and create no Assignment
      selected = first candidate after ordering; a new Assignment is created with
                 assignment_reason = AUTO_BALANCED
    input_set: "All Analyst rows evaluated against one ExaminationRequest and its Case; post_assignment_pct(a) is the PROJECTED_ESTIMATE variant of analyst_workload_variants including this request's estimated_hours."
    constants:
      UTILIZATION_CEILING_PCT: 100.00
      REMEDIATION_TRAINING_MIN_HOURS: 8.00
    precision: "Ranking compares post_assignment_pct at 2 decimal places; ties fall through to the declared tie-breaks in order"

  - name: capa_due_and_escalation
    trigger: "On Nonconformance creation (any source) and on POST /lab/nonconformances/{nonconformance_id}/capa-decision with decision REJECT"
    algorithm: threshold
    formula: |
      due_utc = opened_at_utc + CAPA_SLA_DAYS[severity] days
      on REJECT:
          capa_rejection_count += 1
          if capa_rejection_count == CAPA_ESCALATION_THRESHOLD:
              severity = MAJOR if severity == MINOR else CRITICAL if severity == MAJOR else CRITICAL
              due_utc  = opened_at_utc + CAPA_SLA_DAYS[severity] days   # same baseline, new SLA
      overdue = clock_now > due_utc and status NOT IN {CLOSED, VOIDED}
    input_set: "One Nonconformance row. The escalation baseline is always the original opened_at_utc, never the rejection instant."
    constants:
      CAPA_SLA_DAYS: { MINOR: 60, MAJOR: 30, CRITICAL: 10 }
      CAPA_ESCALATION_THRESHOLD: 2
      DISCOVERY_RESPONSE_DAYS: 30
    precision: "Whole days added to a whole-second instant; comparisons are strict (> due_utc is overdue, == due_utc is not)"

  - name: committed_casework_hours_invariant
    trigger: "Checked after every Assignment mutation (create, supersede, release, complete, reopen) and exposed through GET /lab/analysts/{analyst_id}/workload"
    algorithm: aggregation
    formula: |
      sum(Analyst.assigned_casework_hours for every Analyst)
        == round_half_up(sum(er.estimated_hours for er in ExaminationRequest
                             where er.status IN {ASSIGNED, IN_ANALYSIS}
                               and er.assigned_analyst_id is not null), 2)
      # equivalently, per analyst:
      Analyst.assigned_casework_hours
        == round_half_up(sum(a.estimated_hours for a in Assignment
                             where a.analyst_id == Analyst.id and a.status == ACTIVE), 2)
    input_set: "All Assignment rows with status ACTIVE, and all ExaminationRequest rows in ER_HOLD_SET. SUPERSEDED, RELEASED and COMPLETED assignments contribute nothing to either side."
    constants: {}
    precision: "2 decimal places, round_half_up; the identity must hold exactly with no drift after any forward/compensating pair"

  - name: vendor_encumbrance_invariant
    trigger: "Checked after every VendorEngagement mutation (award, confirm-shipment, record-return, cancel) and exposed through GET /lab/vendors/{vendor_id}"
    algorithm: aggregation
    formula: |
      Vendor.encumbered_cents
        == sum(e.award_amount_cents for e in VendorEngagement
               where e.vendor_id == Vendor.id and e.status IN {AWARDED, AT_VENDOR})
      Vendor.spent_cents
        == sum(e.final_invoice_cents for e in VendorEngagement
               where e.vendor_id == Vendor.id and e.status == RETURNED)
      # cancellation is the exact compensating action of an award:
      encumbered_cents_after_cancel == encumbered_cents_before_award
      spent_cents_after_cancel      == spent_cents_before_award
    input_set: "All VendorEngagement rows of one Vendor. CANCELLED engagements contribute to neither sum."
    constants: {}
    precision: "Integer cents; the identity must hold exactly - a cancelled award leaves zero residue in either counter"

# =============================================================================
# 1.4 Validation Rules Table (ordered - lowest priority number is checked first)
# =============================================================================
# The order below is normative for every write endpoint. When a single request violates
# two rules, the rule with the smaller priority number determines the response, and no
# side effect of any later rule is applied.
validations:
  - priority: 1
    rule: "Both X-Role and X-User-ID request headers are present and non-empty on every endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    note: "A header supplied as an empty string counts as absent."
  - priority: 2
    rule: "The X-Role value is one of the five declared roles and that role is permitted to call this endpoint per the §1.7 matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    category: auth
    note: "An unrecognised role string is also 403 here, never 400 - authorization outranks schema."
  - priority: 3
    rule: "Every {id} path segment resolves to an existing row of the declared entity, checked left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    category: existence
    note: "For nested paths the parent segment is resolved first; a child that exists but belongs to a different parent is ERR_<CHILD>_NOT_FOUND for that path."
  - priority: 4
    rule: "The request body parses, contains every required field, contains no unknown field, and every value matches its declared type / enum domain / numeric range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: schema
    note: "Malformed ISO-8601 instants, negative item_count, and score_pct outside 0.00-100.00 all land here."
  - priority: 5
    rule: "Every foreign-key id carried in the request body resolves to an existing row of its declared entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    category: existence
    note: "Body FKs are checked after schema so that a syntactically invalid id yields 400, not 404."
  - priority: 6
    rule: "When the caller's role is Analyst, the X-User-ID header equals the analyst the operation acts as: ExaminationRequest.assigned_analyst_id on start-analysis and complete-analysis, and ProficiencyTest.analyst_id on submit"
    error_id: ERR_ANALYST_IDENTITY_MISMATCH
    http_status: 403
    category: auth
    note: "Roles other than Analyst are unaffected by this rule; it never applies to CaseManager, QualityManager, EvidenceTechnician or LabDirector writes. Technical review is the mirror image: there the acting X-User-ID must NOT equal assigned_analyst_id, which is priority 14."
  - priority: 7
    rule: "Scoped uniqueness holds: Case.agency_case_number is unique per submitting_agency; EvidenceItem.item_number is unique per case_id; ExaminationRequest is unique per (evidence_item_id, method_id) among rows whose status is not CANCELLED; ProficiencyTest is unique per (analyst_id, method_id, test_cycle); CourtEvent is unique per (docket_number, analyst_id) among rows whose status is not CANCELLED"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    category: uniqueness
    note: "A cancelled ExaminationRequest or CourtEvent frees its key for reuse."
  - priority: 8
    rule: "The target row is in a state from which the requested trigger has a declared transition in §1.2"
    error_id: "ERR_<ENTITY>_INVALID_STATE"
    http_status: 409
    category: state
    note: "This is the general non-linear-state-machine guard and it outranks every temporal, capacity and fiscal check below."
  - priority: 9
    rule: "When the endpoint declares an expected_<parent>_version field, its value equals the parent row's current version"
    error_id: "ERR_STALE_<PARENT>_VERSION"
    http_status: 412
    category: concurrency
    note: "Only the two §1.2.1 rules declare an OCC field; no other endpoint accepts one."
  - priority: 10
    rule: "Cross-entity referential coherence holds: the EvidenceItem named by an ExaminationRequest belongs to the named Case; the Method's discipline is admissible for the evidence item_type per METHOD_ITEM_TYPE_MATRIX; a CourtEvent's analyst is the assigned analyst of the named ExaminationRequest; a ReviewRecord's examination request and reviewer are mutually consistent"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 409
    category: business_referential
    note: "All named rows exist (priority 5 passed); they simply do not belong together. The METHOD_ITEM_TYPE_MATRIX admits BIOLOGY for BIOLOGICAL, CHEMISTRY for CHEMICAL, LATENT_PRINTS for LATENT_LIFT or FIREARM, TRACE for TRACE_MEDIA, and DIGITAL for DIGITAL_DEVICE."
  - priority: 11
    rule: "Evidence seal integrity holds: every EvidenceItem of a case being accepted has seal_intact true, and an item is never checked out of the vault with a broken seal"
    error_id: ERR_EVIDENCE_SEAL_BROKEN
    http_status: 409
    category: business_safety
    note: "Chain-of-custody integrity is the highest-ranked business rule; it outranks the item_count cap at priority 24. The related custody-position guard (IN_VAULT before checkout, IN_ANALYSIS before check-in, never re-checkout a CONSUMED item) is a state precondition and therefore reports ERR_EVIDENCE_CUSTODY_INVALID_STATE at priority 8."
  - priority: 12
    rule: "The named Method has validation_status VALIDATED and validation_expires_at_utc strictly after the current clock at the moment analysis starts or a report is released"
    error_id: ERR_METHOD_NOT_VALIDATED
    http_status: 409
    category: cross_entity_state
    note: "A method that is DRAFT or RETIRED yields ERR_METHOD_NOT_VALIDATED; a method that is VALIDATED but whose validation_expires_at_utc is at or before the logical clock yields the distinct ERR_METHOD_VALIDATION_EXPIRED. Expiry is evaluated against the logical clock, so a request queued under a live method is blocked at start once the validation lapses."
  - priority: 13
    rule: "The acting analyst has employment_status ACTIVE and qualification_state QUALIFIED or PROBATION; a SUSPENDED or DECERTIFIED analyst cannot be assigned, cannot start analysis and cannot author a technical review"
    error_id: ERR_ANALYST_NOT_QUALIFIED
    http_status: 409
    category: cross_entity_state
    note: "Applies to the subject analyst of the operation, not to the caller identity (that is priority 6). employment_status other than ACTIVE yields the distinct ERR_ANALYST_NOT_ACTIVE, and a DECERTIFIED analyst yields ERR_ANALYST_DECERTIFIED; both are checked before the QUALIFIED/PROBATION test."
  - priority: 14
    rule: "Segregation of duties holds: the technical reviewer is neither the assigned analyst nor the same X-User-ID that completed the analysis; the administrative reviewer is neither the assigned analyst nor the technical reviewer of the same revision_round; a disagreement resolver is none of the three"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    category: business_rule
    note: "Compared on both reviewer_analyst_id and reviewer_operator_id so a director acting under a personal user id cannot review their own casework."
  - priority: 15
    rule: "The named Vendor's accredited_disciplines contains the request's discipline and accreditation_expires_at_utc is strictly after the engagement window_end_utc"
    error_id: ERR_VENDOR_NOT_ACCREDITED
    http_status: 409
    category: business_safety
    note: "Accreditation is a safety gate and deliberately outranks the fiscal ceiling at priority 26 - an unaccredited vendor is refused even when the award would also blow the contract ceiling."
  - priority: 16
    rule: "The named Vendor has status ACTIVE"
    error_id: ERR_VENDOR_SUSPENDED
    http_status: 409
    category: business_rule
    note: "Checked after accreditation so that a suspended and unaccredited vendor reports the accreditation defect."
  - priority: 17
    rule: "Aggregate vendor capacity holds: the count of the vendor's engagements in status AWARDED or AT_VENDOR whose closed window [window_start_utc, window_end_utc] intersects the requested closed window, plus one, does not exceed concurrent_case_capacity"
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 409
    category: resource_temporal
    note: "Intervals are CLOSED on both ends, so a new window starting exactly at an existing window's end instant intersects and is refused; starting one second later is admitted. CANCELLED and RETURNED engagements never occupy capacity."
  - priority: 18
    rule: "Testimony non-overlap holds: the analyst has no CourtEvent in status SCHEDULED or CONFIRMED whose window, extended by TRAVEL_BUFFER_MINUTES on both ends, intersects the requested [start_utc, end_utc)"
    error_id: ERR_TESTIMONY_SCHEDULE_CONFLICT
    http_status: 409
    category: resource_temporal
    note: "TRAVEL_BUFFER_MINUTES is 60. Court windows are half-open, so a new event beginning exactly TRAVEL_BUFFER_MINUTES after an existing event ends is admitted while one second earlier is refused. Deliberately ranked below the request-state guard at priority 8."
  - priority: 19
    rule: "notice_days computed as floor((start_utc - clock_now)/86400) is at least MIN_TESTIMONY_NOTICE_DAYS unless subpoena_received is true"
    error_id: ERR_INSUFFICIENT_TESTIMONY_NOTICE
    http_status: 422
    category: temporal
    note: "MIN_TESTIMONY_NOTICE_DAYS is 7. A received subpoena waives the notice floor entirely; the overlap check at priority 18 is never waived."
  - priority: 20
    rule: "An analyst whose qualification_state is PROBATION is assigned only to requests whose Case.priority_class is P3_ROUTINE"
    error_id: ERR_PROBATION_PRIORITY_RESTRICTED
    http_status: 409
    category: business_rule
    note: "Evaluated against the case's effective priority_class, so a priority override to P3_ROUTINE makes an otherwise blocked assignment admissible."
  - priority: 21
    rule: "An analyst whose qualification_state is PROBATION has training_hours_per_week of at least REMEDIATION_TRAINING_MIN_HOURS before receiving any assignment"
    error_id: ERR_TRAINING_MINIMUM_NOT_MET
    http_status: 409
    category: business_rule
    note: "Checked after the priority restriction so a probationary analyst offered a P1 case reports the restriction, not the training shortfall."
  - priority: 22
    rule: "The subject analyst's disciplines array contains the Method's discipline"
    error_id: ERR_ANALYST_DISCIPLINE_MISMATCH
    http_status: 409
    category: business_rule
    note: "Applies to the incoming holder on assignment and to the reviewer on technical review."
  - priority: 23
    rule: "The subject analyst's competency_level is greater than or equal to the Method's min_competency_level"
    error_id: ERR_ANALYST_COMPETENCY_INSUFFICIENT
    http_status: 409
    category: business_rule
    note: "Competency is the ordered scale TRAINEE < COMPETENT < SENIOR < TECHNICAL_LEAD; checked after the discipline test so an out-of-discipline junior reports the discipline defect."
  - priority: 24
    rule: "item_count on an ExaminationRequest does not exceed the Method's max_items_per_request"
    error_id: ERR_ITEM_COUNT_EXCEEDS_METHOD_LIMIT
    http_status: 422
    category: constraint
    note: "Deliberately ranked below evidence seal integrity at priority 11 so a broken-seal item with an over-cap count reports the seal defect."
  - priority: 25
    rule: "The subject analyst's post-assignment PROJECTED_ESTIMATE utilization does not exceed UTILIZATION_CEILING_PCT of available_hours"
    error_id: ERR_ANALYST_CAPACITY_EXCEEDED
    http_status: 409
    category: capacity
    note: "Exactly 100.00 percent is admitted; 100.01 is refused. available_hours of 0.00 refuses every assignment."
  - priority: 26
    rule: "On auto-assign, the eligibility filter of analyst_selection_ranking yields at least one candidate"
    error_id: ERR_NO_ELIGIBLE_ANALYST
    http_status: 409
    category: capacity
    note: "An empty candidate pool creates no Assignment and leaves the request in QUEUED."
  - priority: 27
    rule: "The vendor's encumbered_cents + spent_cents + the computed award_amount_cents does not exceed contract_ceiling_cents"
    error_id: ERR_VENDOR_CEILING_EXCEEDED
    http_status: 402
    category: business_fiscal
    note: "The lowest-ranked gate: the award is priced in full (including tier discount) before the ceiling is tested, and every safety gate above has already passed. Ranked deliberately below vendor accreditation at priority 15 so an unaccredited vendor whose award would also breach the ceiling reports the accreditation defect."

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- test-driving
  - method: POST
    path: "/lab/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary instant so statutory-deadline, method-expiry, backlog-aging, vendor-window, CAPA-SLA and testimony-notice rules are deterministic. The server starts with the logical clock at exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time either before or after this call."
    roles: [LabDirector]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["every subsequent system-sourced *_at_utc stamp, notice_days, overdue flag, custody_days and aging computation reads the new instant"]

  # ---------------------------------------------------------------- analysts
  - method: POST
    path: "/lab/analysts"
    description: "Register an examiner with their disciplines, competency level, weekly capacity and standing training commitment"
    roles: [LabDirector]
    code: 201
    input: [full_name, disciplines, "competency_level?", weekly_capacity_hours, "training_hours_per_week?", "employment_status?"]
    output: Analyst
    side_effects: ["qualification_state initialised to QUALIFIED", "consecutive_pt_failures initialised to 0 and assigned_casework_hours to 0.00"]
  - method: PATCH
    path: "/lab/analysts/{analyst_id}"
    description: "Adjust an examiner's weekly capacity, training commitment, competency level, discipline set or employment status"
    roles: [LabDirector]
    code: 200
    input: ["weekly_capacity_hours?", "training_hours_per_week?", "competency_level?", "disciplines?", "employment_status?"]
    output: Analyst
    side_effects: ["available_hours and both utilization variants of calculations.analyst_workload_variants are re-derived on the next read", "no existing Assignment is released and no snapshotted estimated_hours is re-priced", "increments Analyst.version by 1"]
  - method: POST
    path: "/lab/analysts/{analyst_id}/reinstate"
    description: "Return a SUSPENDED examiner to PROBATION once a passing proficiency test scored after the suspension exists and no finding attributed to them is still open"
