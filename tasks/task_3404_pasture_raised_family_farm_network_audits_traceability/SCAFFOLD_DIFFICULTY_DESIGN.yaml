  - rule_id: priority_pair_validation_conflict
    instances:
      - name: audit_complete_state_error_beats_window_error
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_AUDIT_NOT_SCHEDULED]
          - errors[ERR_AUDIT_WINDOW_MISSED]
        distinguishing_aspect: |
          Category pair state (priority 7) vs business_temporal (priority 11): completing an
          already-PASSED audit while the clock sits outside its window violates both, and the
          state error ERR_AUDIT_NOT_SCHEDULED must win.
        test_recipe:
          setup:
            - "farm F with INITIAL audit A1 passed 2026-09-03T09:00:00Z and ANNUAL audit A2 (scheduled 2026-10-03) completed PASSED at 2026-10-03T09:00:00Z"
            - "clock then advanced to 2026-11-01 (outside A2's completion window [2026-09-30, 2026-10-10])"
