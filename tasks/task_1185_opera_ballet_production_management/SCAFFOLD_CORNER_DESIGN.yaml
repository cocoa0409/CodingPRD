      - name: demand_tier_boundary_at_half_ratio
        claim_type: boundary
        grounds: [calculations.seat_price_cents]
        distinguishing_aspect: "sold_ratio crossing 0.5 flips the demand multiplier from 1.0 to 1.2 (>= boundary): at 4/10 sold the unit price is 10,000; after one more sale (5/10 == 0.5) it is 12,000."
        test_recipe:
          setup: ["production in REHEARSAL; performance STALLS 10 @ 10,000 ON_SALE; 4 seats sold"]
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Carmen", work_type: "OPERA", build_budget_cents: 60000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-07-01T19:00:00Z", ends_at: "2026-07-01T22:00:00Z", sections: [ { section: "STALLS", total_seats: 10, base_price_cents: 10000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
            - call: "POST /opera/performances/${perf}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "GET /opera/performances/${perf}/seat-inventories"
              payload: {}
              as: Any
              captures: { inv: "$.data[0].id" }
            - call: "POST /opera/seat-inventories/${inv}/purchase"
              payload: { quantity: 4 }
              as: BoxOfficeManager
              captures: { price_at_4: $.data.current_price_cents }
          trigger:
            - call: "POST /opera/seat-inventories/${inv}/purchase"
              payload: { quantity: 1 }
              as: BoxOfficeManager
              captures: { price_at_5: $.data.current_price_cents }
          assert:
            - "price after 4/10 sold == 10000  (ratio 0.4 < 0.5 -> multiplier 1.0)"
            - "price after 5/10 sold == 12000  (ratio 0.5 >= 0.5 -> multiplier 1.2; boundary is inclusive)"
            - "the fifth seat itself was charged at the pre-purchase price 10000 (ratio evaluated before counting the purchase)"

      - name: rental_negotiation_round_limit_rejected
