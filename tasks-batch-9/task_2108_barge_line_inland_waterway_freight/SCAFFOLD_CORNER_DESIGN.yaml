            - "FleetingAssignment.${fa_id}.status == CANCELLED, fee_cents == 0 and billable_days == 0"
            - "FleetingAssignment.${fa_id}.estimated_fee_cents == 90000 is retained for the record"
            - "FleetingBerth.${fb_id}.occupied_barge_count == 0 - exactly the pre-reservation value"
            - "Barge.${b_id}.operational_status == IDLE"

      - name: release_an_already_released_fleeting_assignment_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.FleetingAssignment.RESERVED_to_RELEASED
          - errors[ERR_FLEETING_ASSIGNMENT_INVALID_STATE]
        distinguishing_aspect: "RELEASED is terminal, so a second release must fail with ERR_FLEETING_ASSIGNMENT_INVALID_STATE and must not double-charge - fee_cents stays at the 75000 fixed by the first release."
        test_recipe:
          setup: ["Berth Cairo Harbor; one hull reserved from 2026-08-18T00:00Z and already released at 2026-08-19T00:00Z."]
          setup_api_calls:
            - call: "POST /fleeting-berths"
              payload: { harbor_name: "Cairo Harbor", river_mile: 955.0, capacity_barges: 2, daily_fee_cents_per_barge: 15000, switch_fee_cents: 60000 }
              as: WaterwayAdmin
              captures: { fb_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-9901", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b_id: $.data.id }
            - call: "POST /fleeting-assignments"
              payload: { barge_id: "${b_id}", fleeting_berth_id: "${fb_id}", start_at: "2026-08-18T00:00:00Z", end_at: "2026-08-20T00:00:00Z" }
              as: HarborAgent
              captures: { fa_id: $.data.id }
            - call: "POST /fleeting-assignments/${fa_id}/release"
              payload: { released_at: "2026-08-19T00:00:00Z" }
              as: HarborAgent
          trigger:
            - call: "POST /fleeting-assignments/${fa_id}/release"
              payload: { released_at: "2026-08-19T06:00:00Z" }
              as: HarborAgent
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FLEETING_ASSIGNMENT_INVALID_STATE with HTTP 409"
            - "FleetingAssignment.${fa_id}.billable_days == 1 and fee_cents == 75000 - unchanged by the refused call"
            - "FleetingBerth.${fb_id}.occupied_barge_count == 0"

      - name: lock_reservation_reschedule_returns_a_granted_slot_to_the_queue
        claim_type: Valid Transition
        grounds:
          - state_machines.LockReservation.GRANTED_to_REQUESTED
          - calculations.lock_transit_window
          - entities.Lock.fields.granted_reservation_count
        distinguishing_aspect: "Reschedule is the revert edge: a GRANTED slot returns to REQUESTED, granted_reservation_count drops back to 0, and scheduled_start_at, scheduled_end_at and occupied_until_at are re-pinned to the new 11:00 start."
        test_recipe:
          setup: ["Lock Chain of Rocks OPEN with a 45-minute cycle and a 30-minute buffer; one empty tow holding a GRANTED slot at 2026-08-15T08:00:00Z."]
          setup_api_calls:
            - call: "POST /locks"
              payload: { lock_name: "Chain of Rocks", river_mile: 185.0, chamber_capacity_barges: 9, cycle_minutes: 45, turnback_buffer_minutes: 30 }
              as: WaterwayAdmin
              captures: { lock_id: $.data.id }
            - call: "POST /tows"
              payload: { towboat_name: "M/V Delta", horsepower: 4000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { tow_id: $.data.id, tow_v: $.data.version }
            - call: "POST /lock-reservations"
              payload: { lock_id: "${lock_id}", tow_id: "${tow_id}", requested_start_at: "2026-08-15T08:00:00Z", expected_tow_version: "${tow_v}" }
              as: TowboatDispatcher
              captures: { lr_id: $.data.id }
            - call: "POST /lock-reservations/${lr_id}/grant"
              payload: {}
              as: LockMaster
              as_user_id: "${lock_id}"
          trigger:
            - call: "POST /lock-reservations/${lr_id}/reschedule"
              payload: { requested_start_at: "2026-08-15T11:00:00Z" }
              as: LockMaster
              as_user_id: "${lock_id}"
          assert:
            - "before the trigger Lock.${lock_id}.granted_reservation_count == 1"
            - "LockReservation.${lr_id}.status == REQUESTED"
            - "LockReservation.${lr_id}.scheduled_start_at == \"2026-08-15T11:00:00Z\""
            - "LockReservation.${lr_id}.scheduled_end_at == \"2026-08-15T11:45:00Z\""
            - "LockReservation.${lr_id}.occupied_until_at == \"2026-08-15T12:15:00Z\""
            - "Lock.${lock_id}.granted_reservation_count == 0 and Tow.${tow_id}.pending_lock_reservation_count == 1"

      - name: clear_a_reservation_that_never_entered_the_chamber_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LockReservation.IN_CHAMBER_to_CLEARED
          - errors[ERR_LOCK_RESERVATION_INVALID_STATE]
        distinguishing_aspect: "CLEARED is reachable only from IN_CHAMBER; clearing a REQUESTED slot must fail with ERR_LOCK_RESERVATION_INVALID_STATE and leave delay_minutes at 0."
        test_recipe:
          setup: ["Lock Chain of Rocks OPEN; one REQUESTED reservation that was never granted."]
          setup_api_calls:
            - call: "POST /locks"
              payload: { lock_name: "Chain of Rocks", river_mile: 185.0, chamber_capacity_barges: 9, cycle_minutes: 45, turnback_buffer_minutes: 30 }
              as: WaterwayAdmin
              captures: { lock_id: $.data.id }
            - call: "POST /tows"
              payload: { towboat_name: "M/V Echo", horsepower: 4000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { tow_id: $.data.id, tow_v: $.data.version }
            - call: "POST /lock-reservations"
              payload: { lock_id: "${lock_id}", tow_id: "${tow_id}", requested_start_at: "2026-08-15T08:00:00Z", expected_tow_version: "${tow_v}" }
              as: TowboatDispatcher
              captures: { lr_id: $.data.id }
          trigger:
            - call: "POST /lock-reservations/${lr_id}/clear"
              payload: { actual_end_at: "2026-08-15T09:00:00Z" }
