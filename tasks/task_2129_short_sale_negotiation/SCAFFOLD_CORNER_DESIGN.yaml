        as_user_id: neg-001
        captures:
          case_id: $.data.id
      - call: POST /short-sale/cases/${case_id}/junior-liens
        payload:
          lien_position: 2
          holder_name: Truckee Credit Union
          holder_user_id: jlh-700
          balance_cents: 3500000
        as: Negotiator
        as_user_id: neg-001
        captures:
          lien_id: $.data.id
      - call: POST /short-sale/junior-liens/${lien_id}/demand
        payload:
          demand_cents: 900000
        as: Negotiator
        as_user_id: neg-001
      trigger:
      - call: POST /short-sale/junior-liens/${lien_id}/response
        payload:
