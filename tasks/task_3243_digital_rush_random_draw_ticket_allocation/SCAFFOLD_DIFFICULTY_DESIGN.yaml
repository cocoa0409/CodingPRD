      - TicketPurchase.${pur_id}.refunded_cents == ${ref_after_apply} and it equals 1000 == 500 + (10000 - 9500), the pinned compensating formula
      - after the ops run compensated the application, TicketPurchase.${pur_id}.refunded_cents == ${ref_after_comp} and it equals 0, so no money drifted
      - TicketPurchase.${pur_id}.payment_status == ${pay_after_comp} and it is SETTLED again, the pre-application value
      - the conserved quantity is the original 10000 money split, which is a different kind of quantity from the seats conserved in the sibling instance
