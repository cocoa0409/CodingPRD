          assert:
            - "error_id == ERR_CROSS_CAMPAIGN_REFERENCE (HTTP 422), NOT ERR_STAFF_DOUBLE_BOOKED — referential (p7) beats temporal (p8)"

      - name: event_publish_past_beats_budget_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_EVENT_IN_PAST]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair (business_temporal, business_fiscal): at publish time
          the event's start is in the past AND its cost exceeds the remaining
          budget; priority 8 temporal must win over priority 10 fiscal.
        test_recipe:
          setup:
            - "Campaign OPEN, total_budget_cents 10000; school ENROLLED; event created while clock is 2026-08-01 with start 2026-09-01 (future then) and cost_estimate_cents 20000; staffing invariant trivially satisfied (required_expert_count 0, no languages)"
            - "Clock then advanced to 2026-09-05 so the event start is now in the past"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 10000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T12:00:00Z", capacity: 10, cost_estimate_cents: 20000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
            - { call: "POST /_clock/set_current_utc", as: CampaignAdmin, payload: { to_iso8601: "2026-09-05T00:00:00Z" } }
          trigger:
            - { call: "POST /fafsa/events/${ev}/publish", as: SchoolCoordinator, as_user_id: "${sch}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_IN_PAST (HTTP 409), NOT ERR_BUDGET_EXCEEDED — temporal (p8) beats fiscal (p10)"

  - rule_id: boundary_precision_check
    instances:
      - name: match_score_exact_threshold_auto_confirm
        grounds:
          - calculations.match_score
          - entities.Campaign.fields.auto_confirm_threshold
        distinguishing_aspect: |
          Metric: match_score on POST /fafsa/match-links. Score exactly 0.90
          (dob+name+school, district differs) meets >= auto_confirm_threshold
          and yields AUTO_CONFIRMED, while 0.85 (dob+name+district, school
          differs) yields SUGGESTED — pinning the inclusive boundary.
        test_recipe:
          setup:
            - "Campaign OPEN, default thresholds; school ENROLLED (SC01/D01); two seniors with no links"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr1: $.data.id, sr1_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "E1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC01", district_code: "D99", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { ar1: $.data.id } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S2", full_name: "Bob Kim", dob: "2009-05-06", home_language: "en" }, captures: { sr2: $.data.id, sr2_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "E2", full_name: "Bob Kim", dob: "2009-05-06", school_code: "SC99", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { ar2: $.data.id } }
          trigger:
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr1}", aid_record_id: "${ar1}", expected_senior_record_version: "${sr1_v}" }, captures: { lk1: $.data.id, sc1: $.data.match_score, st1: $.data.status } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr2}", aid_record_id: "${ar2}", expected_senior_record_version: "${sr2_v}" }, captures: { lk2: $.data.id, sc2: $.data.match_score, st2: $.data.status } }
          assert:
            - "MatchLink.${lk1}: match_score == 0.9 and status == AUTO_CONFIRMED (0.90 >= 0.90 inclusive)"
            - "MatchLink.${lk2}: match_score == 0.85 and status == SUGGESTED (one component below the threshold)"

      - name: event_registration_exact_capacity_full
        grounds:
          - calculations.overlap_checks
          - errors[ERR_EVENT_FULL]
          - entities.CompletionEvent.fields.capacity
        distinguishing_aspect: |
          Metric: registered-count vs capacity on POST /fafsa/event-registrations
          (a different metric and endpoint from the match-score boundary). At
          count == capacity-1 the write succeeds; at count == capacity it is
          rejected with ERR_EVENT_FULL (>= semantics).
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; event PUBLISHED with capacity 2, staffing trivially satisfied"
            - "Three seniors each holding GRANTED OUTREACH consent"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 2, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
            - { call: "POST /fafsa/events/${ev}/publish", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "A One", dob: "2009-01-01", home_language: "en" }, captures: { sr1: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr1}", scopes: ["OUTREACH"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S2", full_name: "A Two", dob: "2009-01-02", home_language: "en" }, captures: { sr2: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr2}", scopes: ["OUTREACH"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S3", full_name: "A Three", dob: "2009-01-03", home_language: "en" }, captures: { sr3: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr3}", scopes: ["OUTREACH"], granted_by: "PARENT" } }
          trigger:
            - { call: "POST /fafsa/event-registrations", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", senior_record_id: "${sr1}" }, captures: { reg1: $.data.id } }
            - { call: "POST /fafsa/event-registrations", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", senior_record_id: "${sr2}" }, captures: { reg2: $.data.id } }
            - { call: "POST /fafsa/event-registrations", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", senior_record_id: "${sr3}" }, captures: { err: $.data.error_id } }
          assert:
            - "Registrations 1 and 2 succeed (count reaches exactly capacity 2)"
            - "Third registration: error_id == ERR_EVENT_FULL (HTTP 409) — count 2 >= capacity 2 rejects"

      - name: report_subgroup_exact_suppression_threshold
        grounds:
          - calculations.subgroup_suppression
          - entities.CompletionReport.fields.rows
        distinguishing_aspect: |
          Metric: subgroup eligible_count vs min_subgroup_size on
          POST /fafsa/completion-reports (distinct metric and endpoint from the
          other two boundaries). A row at exactly min_subgroup_size is INCLUDED
          (strict < suppression); one below is omitted, while campaign totals
          still count the suppressed students.
        test_recipe:
          setup:
            - "Campaign OPEN, min_subgroup_size 2; school ENROLLED"
            - "LANGUAGE/en: 2 eligible seniors; LANGUAGE/es: 1 eligible senior (all matched, DATA_SHARE consented, aid STARTED)"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000, min_subgroup_size: 2 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "E1", full_name: "En One", dob: "2009-01-01", home_language: "en" }, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "AE1", full_name: "En One", dob: "2009-01-01", school_code: "SC01", district_code: "D01", initial_status: "STARTED", effective_date: "2027-01-10" }, captures: { a1: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${s1}", aid_record_id: "${a1}", expected_senior_record_version: "${s1_v}" } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${s1}", scopes: ["DATA_SHARE"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "E2", full_name: "En Two", dob: "2009-01-02", home_language: "en" }, captures: { s2: $.data.id, s2_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "AE2", full_name: "En Two", dob: "2009-01-02", school_code: "SC01", district_code: "D01", initial_status: "STARTED", effective_date: "2027-01-10" }, captures: { a2: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${s2}", aid_record_id: "${a2}", expected_senior_record_version: "${s2_v}" } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${s2}", scopes: ["DATA_SHARE"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "E3", full_name: "Es One", dob: "2009-02-01", home_language: "es" }, captures: { s3: $.data.id, s3_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "AE3", full_name: "Es One", dob: "2009-02-01", school_code: "SC01", district_code: "D01", initial_status: "STARTED", effective_date: "2027-01-10" }, captures: { a3: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${s3}", aid_record_id: "${a3}", expected_senior_record_version: "${s3_v}" } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${s3}", scopes: ["DATA_SHARE"], granted_by: "PARENT" } }
          trigger:
            - { call: "POST /fafsa/completion-reports", as: CampaignAdmin, payload: { campaign_id: "${camp}", variant: "SUBMISSION_BASED" }, captures: { rep: $.data.id } }
          assert:
            - "Report.${rep}.rows contains a row {dimension: LANGUAGE, key: 'en', eligible_count: 2} (exactly at threshold -> included)"
            - "Report.${rep}.rows contains NO row {dimension: LANGUAGE, key: 'es'} (1 < 2 -> suppressed)"
            - "Report.${rep}.eligible_count == 3 (suppressed students still counted in totals)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: registration_requires_event_published
        grounds:
          - state_machines.CompletionEvent
          - state_machines.EventRegistration
          - errors[ERR_EVENT_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair EventRegistration -> CompletionEvent: a registration can
          only be created while the referenced event is PUBLISHED; DRAFT is
          rejected with ERR_EVENT_NOT_PUBLISHED and the same request succeeds
          after publish. Distinct pair from the other two instances.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; event in DRAFT (staffing trivially satisfiable); senior with GRANTED OUTREACH consent"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id } }
            - { call: "POST /fafsa/consent-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { senior_record_id: "${sr}", scopes: ["OUTREACH"], granted_by: "PARENT" } }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /fafsa/event-registrations", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", senior_record_id: "${sr}" }, captures: { err: $.data.error_id } }
            - { call: "POST /fafsa/events/${ev}/publish", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/event-registrations", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", senior_record_id: "${sr}" }, captures: { reg: $.data.id, reg_st: $.data.status } }
          assert:
            - "First registration attempt: error_id == ERR_EVENT_NOT_PUBLISHED (HTTP 409)"
            - "After publish: registration succeeds with status REGISTERED"

      - name: checkin_requires_event_in_progress
        grounds:
          - state_machines.StaffAssignment
          - state_machines.CompletionEvent
          - errors[ERR_EVENT_NOT_IN_PROGRESS]
        distinguishing_aspect: |
          Entity pair StaffAssignment -> CompletionEvent: check-in is gated on
          the parent event being IN_PROGRESS (clock-driven); PUBLISHED rejects,
          and the same call succeeds after the clock crosses start_time.
          Different entity pair from registration/event and case/checklist.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; event 2026-09-10T10:00:00Z-12:00:00Z PUBLISHED with one CONFIRMED volunteer (background CLEARED)"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/events", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", title: "E1", start_time: "2026-09-10T10:00:00Z", end_time: "2026-09-10T12:00:00Z", capacity: 10, cost_estimate_cents: 1000, required_expert_count: 0, supported_languages: [] }, captures: { ev: $.data.id } }
            - { call: "POST /fafsa/staff-profiles", as: CampaignAdmin, payload: { campaign_id: "${camp}", full_name: "Vol Vic", capabilities: ["EVENT_STAFF"], languages: ["en"] }, captures: { st: $.data.id } }
            - { call: "POST /fafsa/staff-profiles/${st}/background-check", as: CampaignAdmin, payload: { result: "CLEARED" } }
            - { call: "POST /fafsa/staff-assignments", as: SchoolCoordinator, as_user_id: "${sch}", payload: { event_id: "${ev}", staff_profile_id: "${st}", assigned_role: "VOLUNTEER" }, captures: { asg: $.data.id } }
            - { call: "POST /fafsa/staff-assignments/${asg}/accept", as: StaffMember, as_user_id: "${st}" }
            - { call: "POST /fafsa/staff-assignments/${asg}/confirm", as: SchoolCoordinator, as_user_id: "${sch}" }
            - { call: "POST /fafsa/events/${ev}/publish", as: SchoolCoordinator, as_user_id: "${sch}" }
          trigger:
            - { call: "POST /fafsa/staff-assignments/${asg}/check-in", as: SchoolCoordinator, as_user_id: "${sch}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", as: CampaignAdmin, payload: { to_iso8601: "2026-09-10T11:00:00Z" } }
            - { call: "POST /fafsa/staff-assignments/${asg}/check-in", as: SchoolCoordinator, as_user_id: "${sch}", captures: { st_after: $.data.status } }
          assert:
            - "First check-in: error_id == ERR_EVENT_NOT_IN_PROGRESS (event PUBLISHED, not yet IN_PROGRESS)"
            - "After clock crosses start_time the event auto-flips to IN_PROGRESS and check-in succeeds: status == CHECKED_IN"

      - name: verification_resolve_requires_checklist_complete
        grounds:
          - state_machines.SupportCase
          - state_machines.DocumentChecklist
          - errors[ERR_CHECKLIST_NOT_COMPLETE]
        distinguishing_aspect: |
          Entity pair SupportCase -> DocumentChecklist: resolving a
          VERIFICATION_FOLLOWUP case is gated on the senior's checklist being
          COMPLETE; the resolve fails while any item is non-terminal and
          succeeds after all four items are verified. Different pair from the
          other two instances.
        test_recipe:
          setup:
            - "Campaign OPEN; school ENROLLED; specialist (CASE_SPECIALIST, [en])"
            - "Senior AUTO_CONFIRMED-matched to an aid record whose initial status is VERIFICATION_SELECTED -> auto-case fires at link creation; GRANTED STATUS_DETAIL consent so the case starts OPEN"
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 100000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
