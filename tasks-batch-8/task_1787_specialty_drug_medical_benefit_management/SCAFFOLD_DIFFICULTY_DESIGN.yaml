# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Specialty Drug Medical-Benefit Management
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dose_rounding_vial_vs_increment
        grounds:
          - calculations.dose_optimization
          - entities.DrugCatalogEntry.fields.dose_rounding_mode
          - entities.PriorAuthorization.fields.approved_dose_mg
        distinguishing_aspect: |
          Same raw dose (68.8 kg x 2.5 mg/kg = 172 mg) on the PriorAuthorization
          domain yields approved_dose_mg 200 under the VIAL variant (ceil to whole
          vial) but 170 under the INCREMENT variant (round_half_up to 10 mg) — two
          valid rounding approaches, different results, entity domain = PriorAuthorization.
        test_recipe:
          setup:
            - "Two weight-based drugs: DRUG_V (mode VIAL, vial 100 mg, unit 10 mg) and DRUG_I (mode INCREMENT, increment 10 mg), both mg_per_kg 2.5, max_single_dose_mg 1000"
            - "Each drug has an ACTIVE clinical policy covering diagnosis C50"
            - "One auth per drug for members with weight_kg 68.8, requested_start_date 2026-08-01 (default clock)"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J9001", drug_name: "VialDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", weight_based_dosing: true, mg_per_kg: 2.5, dose_rounding_mode: "VIAL", max_single_dose_mg: 1000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_v_id: $.data.id, drug_v_ver: $.data.version }
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_v_id}", status: "ACTIVE", expected_drug_version: "${drug_v_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/drugs"
              payload: { j_code: "J9002", drug_name: "IncrDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", weight_based_dosing: true, mg_per_kg: 2.5, dose_rounding_mode: "INCREMENT", rounding_increment_mg: 10, max_single_dose_mg: 1000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_i_id: $.data.id, drug_i_ver: $.data.version }
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_i_id}", status: "ACTIVE", expected_drug_version: "${drug_i_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/provider-accounts"
              payload: { name: "Oncology Partners" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_v_id}", member_id: "MEM-1", diagnosis_code: "C50", requested_start_date: "2026-08-01", weight_kg: 68.8 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_v_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_i_id}", member_id: "MEM-2", diagnosis_code: "C50", requested_start_date: "2026-08-01", weight_kg: 68.8 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_i_id: $.data.id }
          trigger:
            - call: "POST /api/prior-authorizations/${auth_v_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
              captures: { dose_v: $.data.approved_dose_mg }
            - call: "POST /api/prior-authorizations/${auth_i_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
              captures: { dose_i: $.data.approved_dose_mg }
          assert:
            - "PriorAuthorization.${auth_v_id}.approved_dose_mg == 200  (VIAL: ceil(172/100)*100)"
            - "PriorAuthorization.${auth_i_id}.approved_dose_mg == 170  (INCREMENT: round_half_up(172/10)*10)"
            - "approved doses differ for identical weight and mg_per_kg inputs"

      - name: forecast_baseline_vs_policy_adjusted
        grounds:
          - calculations.pipeline_spend_forecast
          - entities.SpendForecastRun.fields.variant
          - entities.SpendForecastRun.fields.pipeline_total_cents
        distinguishing_aspect: |
          Identical pipeline inputs on the SpendForecastRun domain: BASELINE totals
          457,643,836 cents vs POLICY_ADJUSTED 343,232,877 cents (x (1 - 0.25)
          erosion) — dual-variant divergence on a different entity domain
          (SpendForecastRun) than dose_rounding_vial_vs_increment (PriorAuthorization).
        test_recipe:
          setup:
            - "Clock at startup default 2026-08-01T00:00:00Z (no set needed)"
            - "One pipeline drug: approval 2027-01-15, prevalence 50/100k, annual cost 1,200,000 cents, year1 uptake 0.30, steady-state 0.60, erosion 0.25"
            - "No claims exist, so inline_annualized_cents == 0"
          setup_api_calls:
            - call: "POST /api/pipeline-drugs"
              payload: { drug_name: "PipelineX", expected_approval_date: "2027-01-15", prevalence_per_100k: 50, projected_annual_cost_cents: 1200000, year1_uptake_pct: 0.30, steady_state_uptake_pct: 0.60, biosimilar_erosion_pct: 0.25 }
              as: PlanAdmin
              captures: { pd_id: $.data.id }
          trigger:
            - call: "POST /api/spend-forecasts"
              payload: { variant: "BASELINE", horizon_years: 2, enrollment_projection: 1000000 }
              as: PharmacyAnalyst
              captures: { run_b_id: $.data.id }
            - call: "POST /api/spend-forecasts"
              payload: { variant: "POLICY_ADJUSTED", horizon_years: 2, enrollment_projection: 1000000 }
              as: PharmacyAnalyst
              captures: { run_p_id: $.data.id }
          assert:
            - "SpendForecastRun.${run_b_id}.pipeline_total_cents == 457643836  (year1: round(500 x 1200000 x 0.30 x 198/365) = 97643836; year2: 360000000)"
            - "SpendForecastRun.${run_b_id}.inline_annualized_cents == 0"
            - "SpendForecastRun.${run_b_id}.total_projected_cents == 457643836"
            - "SpendForecastRun.${run_p_id}.pipeline_total_cents == 343232877  (round(457643836 x 0.75))"
            - "SpendForecastRun.${run_p_id}.total_projected_cents == 343232877"
            - "baseline total != policy-adjusted total"

  - rule_id: combinatorial_formula
    instances:
      - name: claim_allowed_per_component_rounding
        grounds:
          - calculations.claim_allowed_amount
          - entities.InfusionClaim.fields.allowed_amount_cents
          - entities.InfusionClaim.fields.payable_waste_units
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-component-then-sum.
          rate 325, addon 0.06, billed 3 + JW waste 1 gives 1034 + 345 = 1379 cents;
          the alternative sum-then-round gives 1378 — order changes the cents.
        test_recipe:
          setup:
            - "Drug J1745: unit 10 mg, vial 100 mg single-dose, sourcing EITHER, non-weight-based, mode VIAL, max 2000"
            - "ASP 325 cents/unit effective 2026-01-01 (EFFECTIVE at default clock 2026-08-01)"
            - "ACTIVE policy covering C50; auth approved (requested 100 mg -> approved 100 mg, max_administrations 4)"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J1745", drug_name: "RoundDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_id: $.data.id, drug_ver: $.data.version }
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 325 }
              as: PlanAdmin
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_id}", status: "ACTIVE", expected_drug_version: "${drug_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/provider-accounts"
              payload: { name: "Infusion Center A" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_id}", member_id: "MEM-3", diagnosis_code: "C50", requested_start_date: "2026-08-01", requested_dose_mg: 100 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
          trigger:
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J1745", billed_units: 3, waste_units: 1, jw_modifier: true }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "InfusionClaim.${claim_id}.status == APPROVED_FOR_PAYMENT"
            - "InfusionClaim.${claim_id}.payable_waste_units == 1"
            - "InfusionClaim.${claim_id}.allowed_amount_cents == 1379  (round(3x325x1.06)=1034 + round(1x325x1.06)=345; NOT 1378 from sum-then-round)"
            - "InfusionClaim.${claim_id}.member_cost_share_cents == 276  (round(1379 x 0.20))"

      - name: forecast_year_proration_and_exclusion
        grounds:
          - calculations.pipeline_spend_forecast
          - entities.SpendForecastRun.fields.per_drug_projections
        distinguishing_aspect: |
          Mode (a) multi-input conditional formula: launch-year proration
          (patients x annual cost x year1_uptake x days-remaining/365) coexists with
          steady-state years and a beyond-horizon exclusion branch — distinct from
          the nested-rounding mode of claim_allowed_per_component_rounding.
        test_recipe:
          setup:
            - "Clock default 2026-08-01T00:00:00Z"
            - "P_IN: approval 2027-01-15 (inside forecast year 1), prevalence 50/100k, cost 1,200,000, uptakes 0.30/0.60, erosion 0.25"
            - "P_OUT: approval 2030-01-01 (beyond the 2-year horizon ending 2028-08-01) — must be excluded"
            - "No claims exist"
          setup_api_calls:
            - call: "POST /api/pipeline-drugs"
              payload: { drug_name: "InHorizon", expected_approval_date: "2027-01-15", prevalence_per_100k: 50, projected_annual_cost_cents: 1200000, year1_uptake_pct: 0.30, steady_state_uptake_pct: 0.60, biosimilar_erosion_pct: 0.25 }
              as: PlanAdmin
              captures: { pd_in: $.data.id }
            - call: "POST /api/pipeline-drugs"
              payload: { drug_name: "BeyondHorizon", expected_approval_date: "2030-01-01", prevalence_per_100k: 80, projected_annual_cost_cents: 900000, year1_uptake_pct: 0.40, steady_state_uptake_pct: 0.70, biosimilar_erosion_pct: 0.10 }
              as: PlanAdmin
              captures: { pd_out: $.data.id }
          trigger:
            - call: "POST /api/spend-forecasts"
              payload: { variant: "BASELINE", horizon_years: 2, enrollment_projection: 1000000 }
              as: PharmacyAnalyst
              captures: { run_id: $.data.id }
          assert:
            - "SpendForecastRun.${run_id}.per_drug_projections contains exactly 1 entry"
            - "per_drug_projections entry for ${pd_in}.projected_cents == 457643836"
            - "per_drug_projections has no entry for ${pd_out} (excluded: approval at/after end of horizon year 2 = 2028-08-01)"
            - "SpendForecastRun.${run_id}.pipeline_total_cents == 457643836"

  - rule_id: non_linear_state_machine
    instances:
      - name: auth_suspend_reinstate_cycle
        grounds:
          - state_machines.PriorAuthorization.APPROVED_to_SUSPENDED
          - state_machines.PriorAuthorization.SUSPENDED_to_APPROVED
          - state_machines.InfusionClaim.APPROVED_FOR_PAYMENT_to_PENDED
        distinguishing_aspect: |
          Cyclic shape on PriorAuthorization (APPROVED -> SUSPENDED -> APPROVED);
          the cycle conditionally pends only unpaid APPROVED_FOR_PAYMENT claims —
          a PAID sibling claim is untouched.
        test_recipe:
          setup:
            - "Drug (rate 500, unit 10, vial 100 single-dose, VIAL mode, sourcing EITHER, max 2000), ACTIVE policy C50, provider account"
            - "Auth approved: requested 100 -> approved 100, max_administrations 4"
            - "Claim C_PAID: 10 units, service 2026-08-01, approved (allowed 5300) then PAID"
            - "Claim C_OPEN: 10 units, approved, still APPROVED_FOR_PAYMENT"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J2500", drug_name: "CycleDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_id: $.data.id, drug_ver: $.data.version }
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 500 }
              as: PlanAdmin
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_id}", status: "ACTIVE", expected_drug_version: "${drug_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/provider-accounts"
              payload: { name: "Cycle Provider" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_id}", member_id: "MEM-4", diagnosis_code: "C50", requested_start_date: "2026-08-01", requested_dose_mg: 100 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J2500", billed_units: 10 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { c_paid: $.data.id }
            - call: "POST /api/claims/${c_paid}/pay"
              payload: {}
              as: PlanAdmin
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J2500", billed_units: 10 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { c_open: $.data.id }
          trigger:
            - call: "POST /api/prior-authorizations/${auth_id}/suspend"
              payload: {}
              as: MedicalPolicyOfficer
            - call: "POST /api/prior-authorizations/${auth_id}/reinstate"
              payload: {}
              as: MedicalPolicyOfficer
          assert:
            - "PriorAuthorization.${auth_id}.status == APPROVED after the cycle"
            - "InfusionClaim.${c_open}.status == APPROVED_FOR_PAYMENT after reinstate (PENDED with pend_reason AUTH_SUSPENDED in between)"
            - "InfusionClaim.${c_paid}.status == PAID throughout (conditional cascade skips paid claims)"
            - "PriorAuthorization.${auth_id}.administrations_used == 2 (debits survived the cycle)"

      - name: claim_branching_fork_join
        grounds:
          - state_machines.InfusionClaim.SUBMITTED_to_APPROVED_FOR_PAYMENT
          - state_machines.InfusionClaim.SUBMITTED_to_PENDED
          - state_machines.InfusionClaim.PENDED_to_APPROVED_FOR_PAYMENT
          - entities.InfusionClaim.fields.override_by
        distinguishing_aspect: |
          Branching fork-join on InfusionClaim: the direct branch (dose within
          approved) reaches APPROVED_FOR_PAYMENT with override_by null, while the
          PENDED branch joins the same state via override-approve with override_by
          set — divergent side-effect sets per branch, on a different entity than
          the auth cycle.
        test_recipe:
          setup:
            - "Drug (rate 500, unit 10, vial 100 single-dose, VIAL, sourcing EITHER, max 2000), ACTIVE policy C50, provider"
            - "Auth approved 100 mg, max_administrations 4"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J2600", drug_name: "BranchDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_id: $.data.id, drug_ver: $.data.version }
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 500 }
              as: PlanAdmin
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_id}", status: "ACTIVE", expected_drug_version: "${drug_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/provider-accounts"
              payload: { name: "Branch Provider" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_id}", member_id: "MEM-5", diagnosis_code: "C50", requested_start_date: "2026-08-01", requested_dose_mg: 100 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
          trigger:
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J2600", billed_units: 10 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { c_direct: $.data.id }
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J2600", billed_units: 11 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { c_pend: $.data.id }
            - call: "POST /api/claims/${c_pend}/override-approve"
              payload: {}
              as: MedicalPolicyOfficer
              as_user_id: "mpo-7"
          assert:
            - "InfusionClaim.${c_direct}.status == APPROVED_FOR_PAYMENT via direct branch; override_by is null"
            - "InfusionClaim.${c_pend} lands PENDED with pend_reason DOSE_REVIEW (110 mg within inclusive 110% tolerance of 100 mg)"
            - "After override-approve: InfusionClaim.${c_pend}.status == APPROVED_FOR_PAYMENT and override_by == 'mpo-7'"
            - "PriorAuthorization.${auth_id}.administrations_used == 2 (both branches debit exactly once, the PENDED branch debiting only at final approval)"

  - rule_id: transitive_cascade
    instances:
      - name: asp_retro_schedule_to_ledger_cascade
        grounds:
          - state_machines.AspRateSchedule.SCHEDULED_to_EFFECTIVE
          - state_machines.InfusionClaim.PAID_to_ADJUSTED
          - calculations.asp_retro_repricing
          - entities.ProviderAccount.fields.cumulative_paid_cents
        distinguishing_aspect: |
          Depth-3 chain from POST /api/asp-schedules: new schedule EFFECTIVE
          supersedes the old schedule (hop 1), the supersession reprices the PAID
          claim into ADJUSTED and spawns a ClaimAdjustment (hop 2), and each
          adjustment's delta_cents moves ProviderAccount.cumulative_paid_cents
          (hop 3) — each hop caused by the previous one, not by the request.
        test_recipe:
          setup:
            - "Drug J3490 (unit 10, vial 100 single-dose, VIAL, sourcing EITHER, max 2000) with ASP 500 effective 2026-01-01"
            - "ACTIVE policy C50; auth approved 100 mg (max_administrations 4); claim of 2 units on 2026-07-15 approved (allowed 1060) and PAID; provider cumulative_paid_cents == 1060"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J3490", drug_name: "CascadeDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_id: $.data.id, drug_ver: $.data.version }
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 500 }
              as: PlanAdmin
              captures: { sched_1: $.data.id }
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_id}", status: "ACTIVE", expected_drug_version: "${drug_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/provider-accounts"
              payload: { name: "Cascade Provider" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_id}", member_id: "MEM-6", diagnosis_code: "C50", requested_start_date: "2026-07-01", requested_dose_mg: 100 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 4 }
              as: MedicalPolicyOfficer
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-07-15", site_of_care: "HOPD", sourcing_path: "BUY_AND_BILL", j_code_billed: "J3490", billed_units: 2 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/pay"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 600 }
              as: PlanAdmin
              captures: { sched_2: $.data.id }
          assert:
            - "AspRateSchedule.${sched_1}.status == SUPERSEDED and AspRateSchedule.${sched_2}.status == EFFECTIVE (hop 1)"
            - "InfusionClaim.${claim_id}.status == ADJUSTED with allowed_amount_cents == 1272 (hop 2: round(2 x 600 x 1.06))"
            - "ClaimAdjustment for ${claim_id}: old_allowed_cents 1060, new_allowed_cents 1272, delta_cents 212, reason ASP_RETRO, asp_schedule_id == ${sched_2} (hop 2 artifact)"
            - "ProviderAccount.${prov_id}.cumulative_paid_cents == 1272 (hop 3: 1060 + 212)"
            - "ProviderAccount.${prov_id}.status == ACTIVE (positive delta creates no recoupment)"

      - name: claim_approval_exhausts_auth_cascade
        grounds:
          - state_machines.InfusionClaim.SUBMITTED_to_APPROVED_FOR_PAYMENT
          - state_machines.PriorAuthorization.APPROVED_to_EXHAUSTED
          - entities.PriorAuthorization.fields.administrations_used
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /api/claims, not an ASP
          schedule create): claim approval debits auth.administrations_used (hop 1),
          and the debit reaching max_administrations itself flips the auth to
          EXHAUSTED (hop 2), which then rejects further claims.
        test_recipe:
          setup:
            - "Drug (rate 500, unit 10, vial 100 single-dose, VIAL, sourcing EITHER, max 2000), ASP 500 from 2026-01-01, ACTIVE policy C50, provider"
            - "Auth approved 100 mg with max_administrations 1"
          setup_api_calls:
            - call: "POST /api/drugs"
              payload: { j_code: "J2700", drug_name: "ExhaustDrug", billing_unit_mg: 10, vial_size_mg: 100, single_dose_vial: true, sourcing_rule: "EITHER", dose_rounding_mode: "VIAL", max_single_dose_mg: 2000, site_of_care_eligible: false }
              as: PlanAdmin
              captures: { drug_id: $.data.id, drug_ver: $.data.version }
            - call: "POST /api/asp-schedules"
              payload: { drug_id: "${drug_id}", effective_start: "2026-01-01", asp_rate_cents: 500 }
              as: PlanAdmin
            - call: "POST /api/clinical-policies"
              payload: { drug_id: "${drug_id}", status: "ACTIVE", expected_drug_version: "${drug_ver}", covered_diagnoses: ["C50"], step_therapy_required: false, requires_site_of_care_redirection: false, biosimilar_substitution: "DISABLED" }
              as: MedicalPolicyOfficer
            - call: "POST /api/provider-accounts"
              payload: { name: "Exhaust Provider" }
              as: PlanAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /api/prior-authorizations"
              payload: { drug_id: "${drug_id}", member_id: "MEM-7", diagnosis_code: "C50", requested_start_date: "2026-08-01", requested_dose_mg: 100 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /api/prior-authorizations/${auth_id}/approve"
              payload: { max_administrations: 1 }
              as: MedicalPolicyOfficer
          trigger:
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J2700", billed_units: 10 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims"
              payload: { auth_id: "${auth_id}", drug_id: "${drug_id}", service_date: "2026-08-01", site_of_care: "OFFICE", sourcing_path: "BUY_AND_BILL", j_code_billed: "J2700", billed_units: 10 }
              as: ProviderRep
              as_user_id: "${prov_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "InfusionClaim.${claim_id}.status == APPROVED_FOR_PAYMENT (hop 1: administrations_used 0 -> 1)"
            - "PriorAuthorization.${auth_id}.status == EXHAUSTED (hop 2: debit reaching max_administrations auto-exhausts)"
            - "Second claim rejected: error_id == ERR_AUTH_NOT_APPROVED (EXHAUSTED is terminal, not APPROVED)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_state_vs_fiscal_priority
        grounds:
          - validations[priority=5.5]
          - validations[priority=10]
          - errors[ERR_AUTH_NOT_APPROVED]
          - errors[ERR_DOSE_EXCEEDS_APPROVED]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): the claim violates BOTH
          the auth-state gate (auth SUSPENDED) and the fiscal dose gate (250 mg >
          110% of approved 100 mg); priority 5.5 state beats priority 10 fiscal.
        test_recipe:
          setup:
            - "Drug (rate 500, unit 10, vial 100, VIAL, sourcing EITHER, max 2000), ASP 500 from 2026-01-01, ACTIVE policy C50, provider"
