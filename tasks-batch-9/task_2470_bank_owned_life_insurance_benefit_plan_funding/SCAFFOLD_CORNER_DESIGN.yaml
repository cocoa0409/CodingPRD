  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_carrier_version_on_reserve_capacity_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reserve-capacity-stale-carrier]
          - errors[ERR_STALE_CARRIER_VERSION]
          - endpoints[POST /purchase-requests/{id}/reserve-capacity]
        distinguishing_aspect: "The carrier OCC guard on reserve-capacity rejects a version one behind the stored value with ERR_STALE_CARRIER_VERSION (412), leaves reserved_premium_usd at 0.00, and then accepts the current version — proving the failed attempt did not itself bump the carrier."
        test_recipe:
          setup:
            - "One CapitalPosition with tier1_capital_usd 1000000000.00."
