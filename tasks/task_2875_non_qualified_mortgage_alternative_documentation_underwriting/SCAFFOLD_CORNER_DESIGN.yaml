      - name: corner_immediate_consistency_fee_recompute_visible_on_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /points-and-fees-items
          - endpoints.POST /loan-files/{id}/points-and-fees-test
          - entities.LoanFile.fields.points_and_fees_test_result
