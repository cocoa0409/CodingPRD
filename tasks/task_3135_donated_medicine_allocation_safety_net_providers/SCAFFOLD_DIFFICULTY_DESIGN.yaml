  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: license_expiration_interval_vs_logical_clock
        grounds:
          - state_machines.License.VERIFIED_to_EXPIRED
          - calculations.site_active_license_count
          - validations.priority_13_business_temporal
        distinguishing_aspect: |
          Resource = License. Interval semantics: a license occupies the
          half-open interval [verified_at, expires_on) — verify is allowed iff
          expires_on > current logical clock. The boundary case expires_on ==
          current logical clock MUST reject (license already expired at the
          instant it would become usable). Strict > comparison.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. Site S (PENDING_REVIEW)."
            - "License L1 with expires_on = 2026-09-15T00:00:00Z (exactly the clock)."
            - "License L2 with expires_on = 2026-09-15T00:00:01Z (one second later)."
          setup_api_calls:
            - call: "POST /medicine-relief/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /medicine-relief/sites"
              payload: { organization_name: "C", site_type: "FREE_CLINIC", country_code: "US", cold_storage_capacity_l: 100, has_dea_registration: false, monthly_patient_volume: 100, underserved_index: 0.5 }
              as: ComplianceOfficer
              captures: { site_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-edge", expires_on: "2026-09-15T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic1_id: $.data.id }
            - call: "POST /medicine-relief/licenses"
              payload: { site_id: "${site_id}", license_type: "PHARMACY", issuing_authority: "TX BoP", license_number: "L-ok", expires_on: "2026-09-15T00:00:01Z" }
              as: ComplianceOfficer
              captures: { lic2_id: $.data.id }
          trigger:
            - call: "POST /medicine-relief/licenses/${lic1_id}/verify"
              payload: {}
              as: ComplianceOfficer
              captures: { lic1_err: $.data.error_id }
            - call: "POST /medicine-relief/licenses/${lic2_id}/verify"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "License.${lic1_id} verification returns 422 ERR_LICENSE_EXPIRED (expires_on == clock is rejected)"
            - "License.${lic2_id}.verification_status == VERIFIED (strictly-after clock is accepted)"
            - "RecipientSite.${site_id}.active_license_count == 1"

      - name: reservation_ttl_forfeiture_at_exact_boundary
        grounds:
          - calculations.reservation_ttl
          - state_machines.AllocationLine.RESERVED_to_FORFEITED
        distinguishing_aspect: |
          Resource = AllocationLine reservation window. Interval semantics are
          different from license expiry: the line occupies a TTL interval that
          ENDS at reservation_expires_at, and the forfeit sweep fires when
          logical clock >= reservation_expires_at (inclusive endpoint). The
          inclusive >= boundary and the per-line TTL window is geometrically
          distinct from the strictly-greater license-expiry rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Donor D, RELEASABLE lot L quantity 100."
            - "Site S QUALIFIED. Request R for 10 units; decision D finalized at 2026-09-01T00:00:00Z, so reservation_expires_at = 2026-09-04T00:00:00Z (72h TTL, non-emergency)."
