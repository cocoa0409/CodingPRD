            - "trigger call 3 returns HTTP 201 (2026-08-01 - MOVE_DATE_PAST_GRACE_DAYS 30 == 2026-07-02, inclusive) with duplicate_match_score == 0.00, because the 210-day gap puts the earlier move outside the feed's 30-day dedupe window and therefore outside the candidate pool"
