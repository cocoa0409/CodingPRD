            - "trigger call 1 -> 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\": ra-001 filed this authority (submitted_by_user_id) and may not verify it; status stays \"SUBMITTED\", verified_at stays null and the talent's postmortem_registration_number stays null"
            - "trigger call 2 -> 200 with status \"VERIFIED\", verified_by_user_id \"ra-002\", and Talent.${tb_id}.postmortem_registration_number == \"CA-REG-77\""
            - "trigger call 3 -> 403 ERR_SEGREGATION_OF_DUTIES even though the acting ROLE is RightsAdministrator: the check compares X-User-ID against case.triaged_by_user_id \"co-001\"; status stays \"TAKEDOWN_ISSUED\", escalated_by_user_id null and rights_posture \"CLEAR\""
            - "trigger call 4 -> 200 with status \"LEGAL_ESCALATED\", escalated_by_user_id \"ra-002\" and rights_posture \"FROZEN\" — the identical body from a different pair of hands is accepted, so the refusal was the duty rung and not the severity floor (0.8950 >= 0.5000 throughout)"

  - section: cross_cutting_complexity_layers
    instances:
      - name: both_occ_rules_reject_a_stale_parent_version_and_accept_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.consent-create-stale-talent, concurrency_rules.license-issue-stale-replica, errors.ERR_TALENT_VERSION_STALE, errors.ERR_REPLICA_VERSION_STALE]
        distinguishing_aspect: >-
          Both §1.2.1 rules are exercised on the same fixture, each through the write endpoint and
          occ_field it declares, and each with the crucial retry leg: a sequential retry would find no
          blocking status field and would succeed, so only the version guard reveals the lost update.
          Both writes also advance their parent's version, which is what makes the SECOND stale attempt
          in each pair fail with the same token that worked for the first.
        test_recipe:
          setup:
            - "CA profile; one talent (version captured at creation, BEFORE any grant advances it)"
            - "One ACTIVE grant, one asset, one APPROVED_FOR_USE replica (version captured at approval) and TWO APPROVED performances on that replica"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
