              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/transfer_statements"
              payload: { direction: "OUTBOUND", counterparty_firm_name: "Broker X", security_id: "${sec_id}", quantity: 10, transfer_date: "2025-04-01T00:00:00Z", lots_payload: [{ acquisition_date: "2025-01-05T00:00:00Z", quantity: 10, original_cost_basis_cents: 10000 }] }
              as: TaxOps
              captures: { ts_id: $.data.id }
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/restrict"
              payload: {}
              as: TaxOps
            - call: "POST /firms/${firm_id}/accounts/${acct_id}/reopen"
              payload: {}
              as: TaxOps
          trigger:
            - call: "POST /firms/${firm_id}/transfer_statements/${ts_id}/deliver"
              payload: { expected_account_version: "${acct_v0}" }
              as: TaxOps
              captures: { err: $.data.error_id }
          assert:
