scenario: "588. Marketing / Advertising Agency Operations: client/retainer & SOW, campaign brief & creative project, media-buy plan & insertion order, time/utilization & billable rate, deliverable approval & version, vendor/freelancer cost, markup & invoice, performance reporting"
domain_name: ad-agency-ops
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: flat
  # Every entity is a root collection (/clients, /sows, /campaigns, /time-entries, ...).
  # Relationships are expressed by foreign keys carried in request bodies, never by
  # nesting in the URL. The only sub-resource GETs are reverse-lookup reads.

  state_machine_shape: cyclic
  # Deliverable runs a genuine revision loop (SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED).
  # Invoice carries two independent state dimensions (approval_status x payment_status).
  # Campaign has a revert edge (IN_FLIGHT <-> ON_HOLD) driven purely by cascade.
  # Retainer has a revert edge (ACTIVE <-> DEPLETED) driven purely by balance movement.

  relationship_patterns:
    - one_to_many          # Client -> Retainer/SOW/Campaign/Invoice; Campaign -> Deliverable/TimeEntry/VendorCost/MediaPlan
    - cross_aggregate      # Invoice reaches across Campaign, Retainer, SOW, TimeEntry, VendorCost, InsertionOrder
    - many_to_many         # MediaPlacement <-> MediaPlan, joined through InsertionOrder

  role_model: segregation_of_duties
  # The StaffMember who logs a TimeEntry may never be the StaffMember who approves it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the advertiser.
        constraints: non-empty, max 120 chars
      - name: industry
        type: enum
        source: input
        description: Advertiser vertical, used only for reporting segmentation.
        constraints: one of RETAIL, FINANCE, CPG, TECH, AUTO
      - name: billing_email
        type: string
        source: input
        description: Accounts-payable contact for invoices.
        constraints: non-empty
      - name: status
        type: enum
        source: computed
        description: >-
          ACTIVE normally. Flips to CREDIT_HOLD as a cascade when any Retainer of this
          Client reaches status DEPLETED; flips back to ACTIVE when every Retainer of
          this Client has status ACTIVE.
        default: ACTIVE
        constraints: one of ACTIVE, CREDIT_HOLD

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human label of the published rate card, e.g. "Standard 2026".
        constraints: non-empty
      - name: rate_junior_cents_per_hour
        type: integer
        source: input
        description: Live billable hourly rate for grade JUNIOR, in cents.
        constraints: integer >= 0
      - name: rate_senior_cents_per_hour
        type: integer
        source: input
        description: Live billable hourly rate for grade SENIOR, in cents.
        constraints: integer >= 0
      - name: rate_director_cents_per_hour
        type: integer
        source: input
        description: Live billable hourly rate for grade DIRECTOR, in cents.
        constraints: integer >= 0

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Agency employee name.
        constraints: non-empty
      - name: grade
        type: enum
        source: input
        description: Billing grade; selects which RateCard rate column applies to this person.
        constraints: one of JUNIOR, SENIOR, DIRECTOR
      - name: standard_daily_capacity_minutes
        type: integer
        source: input
        description: Contracted working minutes per weekday; the denominator of capacity-based utilization.
        default: 480
        constraints: integer between 1 and 1440
      - name: cost_rate_cents_per_hour
        type: integer
        source: input
        description: Internal (unbilled) cost of this person per hour, in cents. Used by the campaign performance report.
        constraints: integer >= 0

  - name: MediaPlacement
    parent: null
    common_fields: true
    fields:
      - name: publisher_name
        type: string
        source: input
        description: Media owner offering this inventory slot.
        constraints: non-empty
      - name: channel
        type: enum
        source: input
        description: Channel of this inventory slot; matched against MediaPlan.allowed_channels.
        constraints: one of DISPLAY, VIDEO, SOCIAL, OOH, PRINT
      - name: min_dark_days
        type: integer
        source: input
        description: >-
          Mandatory dark (unsold) days the publisher requires strictly between two
          consecutive flights booked on this placement. 0 means back-to-back flights are allowed.
        default: 0
        constraints: integer between 0 and 30

  - name: Retainer
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the advertiser whose prepaid balance this is.
      - name: period_start
        type: datetime
        source: input
        description: Inclusive first date (ISO 8601 date) of the retainer period.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive last date (ISO 8601 date) of the retainer period.
        constraints: must be strictly after period_start
      - name: funded_cents
        type: integer
        source: computed
        description: >-
          Total cash ever placed on this retainer. Set to initial_funding_cents at creation
          and increased by every POST /retainers/{id}/fund. Never decreases.
        constraints: integer >= 0
      - name: balance_cents
        type: integer
        source: computed
        description: >-
          Unconsumed cash. Set to initial_funding_cents at creation; decreased by
          Invoice.retainer_applied_cents when an Invoice is ISSUED; increased when an
          ISSUED Invoice is VOIDed or when the retainer is funded.
        constraints: integer >= 0
      - name: status
        type: enum
        source: computed
        description: >-
          ACTIVE while balance_cents > 0; DEPLETED the moment balance_cents reaches exactly 0;
          back to ACTIVE the moment balance_cents becomes > 0 again.
        default: ACTIVE
        constraints: one of ACTIVE, DEPLETED

  - name: SOW
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the advertiser this statement of work binds.
      - name: rate_card_id
        type: string
        source: input
        description: FK -> RateCard.id; the rate card this SOW references while in status DRAFT.
      - name: title
        type: string
        source: input
        description: Statement-of-work title.
        constraints: non-empty
      - name: labor_cap_cents
        type: integer
        source: input
        description: Hard ceiling on cumulative estimated labor bookable against this SOW.
        constraints: integer >= 0
      - name: markup_pct
        type: number
        source: input
        description: Pass-through markup applied to every VendorCost billed under this SOW, e.g. 0.175 = 17.5%.
        constraints: number between 0 and 1
      - name: effective_start
        type: datetime
        source: input
        description: Inclusive first date (ISO 8601 date) the SOW covers.
      - name: effective_end
        type: datetime
        source: input
        description: Exclusive last date (ISO 8601 date) the SOW covers.
        constraints: must be strictly after effective_start
      - name: status
        type: enum
        source: computed
        description: >-
          DRAFT at creation; COUNTERSIGNED after the client signs; EXPIRED once the logical
          clock reaches effective_end.
        default: DRAFT
        constraints: one of DRAFT, COUNTERSIGNED, EXPIRED
      - name: pinned_rate_card_version
        type: integer
        source: computed
        description: >-
          RateCard.version copied at countersign. null while DRAFT. Later edits to the
          RateCard do NOT change this SOW's pinned rates.
        default: null
      - name: pinned_rate_junior_cents_per_hour
        type: integer
        source: computed
        description: RateCard.rate_junior_cents_per_hour copied at countersign. null while DRAFT.
        default: null
      - name: pinned_rate_senior_cents_per_hour
        type: integer
        source: computed
        description: RateCard.rate_senior_cents_per_hour copied at countersign. null while DRAFT.
        default: null
      - name: pinned_rate_director_cents_per_hour
        type: integer
        source: computed
        description: RateCard.rate_director_cents_per_hour copied at countersign. null while DRAFT.
        default: null
      - name: consumed_labor_cents
        type: integer
        source: computed
        description: >-
          Sum of TimeEntry.estimated_amount_cents over every TimeEntry whose campaign's
          sow_id == this SOW and whose status IN {SUBMITTED, APPROVED, BILLED}. Recomputed
          on every TimeEntry creation. See calculations.sow_labor_consumption.
        default: 0
        constraints: integer >= 0

  - name: Campaign
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; advertiser this campaign runs for.
      - name: sow_id
        type: string
        source: input
        description: FK -> SOW.id; the SOW that funds this campaign. Its client_id must equal this campaign's client_id.
      - name: name
        type: string
        source: input
        description: Campaign name.
        constraints: non-empty
      - name: brief_summary
        type: string
        source: input
        description: The campaign brief. Must be non-empty before the campaign can launch.
        constraints: non-empty, max 2000 chars
      - name: objective
        type: enum
        source: input
        description: Primary brief objective.
        constraints: one of AWARENESS, CONSIDERATION, CONVERSION
      - name: status
        type: enum
        source: computed
        description: >-
          DRAFT at creation; IN_FLIGHT after launch; ON_HOLD when the owning Client goes
          CREDIT_HOLD; WRAP_UP when every Deliverable of this campaign is APPROVED;
          CLOSED when an ISSUED Invoice for this campaign reaches payment_status PAID.
        default: DRAFT
        constraints: one of DRAFT, IN_FLIGHT, ON_HOLD, WRAP_UP, CLOSED

  - name: Deliverable
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign this creative asset belongs to.
      - name: title
        type: string
        source: input
        description: Deliverable title, e.g. "Hero film 30s cut".
        constraints: non-empty
      - name: current_asset_version
        type: integer
        source: computed
        description: Incremented by exactly 1 on every submit. 0 until the first submit.
        default: 0
        constraints: integer >= 0
      - name: approved_asset_version
        type: integer
        source: computed
        description: >-
          Frozen copy of current_asset_version at the moment of client approval.
          null until the deliverable reaches APPROVED.
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: >-
          Incremented by exactly 1 on every request-changes. Capped at
          calculations constant MAX_REVISION_ROUNDS.
        default: 0
        constraints: integer >= 0
      - name: last_feedback
        type: string
        source: computed
        description: Feedback text supplied by the client on the most recent request-changes. null until then.
        default: null
      - name: status
        type: enum
        source: computed
        description: Creative review state.
        default: DRAFT
        constraints: one of DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED

  - name: TimeEntry
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign the work was done for.
      - name: staff_id
        type: string
        source: input
        description: FK -> StaffMember.id; who did the work. Must equal the caller's X-User-ID.
      - name: approved_by_staff_id
        type: string
        source: computed
        description: FK -> StaffMember.id; the approver's X-User-ID, stamped at approval. null while SUBMITTED.
        default: null
      - name: started_at
        type: datetime
        source: input
        description: ISO 8601 UTC start instant of the worked interval (inclusive).
      - name: ended_at
        type: datetime
        source: input
        description: ISO 8601 UTC end instant of the worked interval (exclusive).
        constraints: must be strictly after started_at, and on the same UTC calendar date
      - name: work_date
        type: string
        source: computed
        description: UTC calendar date (YYYY-MM-DD) of started_at. The bucket key for the daily minute cap and the overtime threshold.
      - name: minutes
        type: integer
        source: computed
        description: Whole minutes between started_at and ended_at.
        constraints: integer >= 1
      - name: billable
        type: boolean
        source: input
        description: Whether this interval is chargeable to the client.
        default: true
      - name: pinned_rate_cents_per_hour
        type: integer
        source: computed
        description: >-
          The SOW's pinned rate column matching StaffMember.grade, copied at TimeEntry creation.
          0 when billable is false.
        default: 0
      - name: estimated_amount_cents
        type: integer
        source: computed
        description: >-
          Straight-line value with NO overtime uplift, computed at creation.
          See calculations.time_entry_estimated_amount. 0 when billable is false.
        default: 0
      - name: regular_minutes
        type: integer
        source: computed
        description: Portion of minutes billed at 1.0x, decided at approval. 0 while SUBMITTED.
        default: 0
      - name: overtime_minutes
        type: integer
        source: computed
        description: Portion of minutes billed at OVERTIME_MULTIPLIER, decided at approval. 0 while SUBMITTED.
        default: 0
      - name: billable_amount_cents
        type: integer
        source: computed
        description: >-
          Final chargeable value including the overtime split, decided at approval.
          See calculations.time_entry_billable_amount. 0 while SUBMITTED and 0 when billable is false.
        default: 0
      - name: internal_cost_cents
        type: integer
        source: computed
        description: >-
          round_half_up(minutes * StaffMember.cost_rate_cents_per_hour / 60), computed at creation
          for every entry regardless of `billable`. Feeds the campaign performance report.
        default: 0
      - name: status
        type: enum
        source: computed
        description: SUBMITTED at creation; APPROVED on approval; BILLED when a FINAL Invoice that includes it is ISSUED.
        default: SUBMITTED
        constraints: one of SUBMITTED, APPROVED, BILLED

  - name: VendorCost
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign this pass-through cost belongs to.
      - name: vendor_name
        type: string
        source: input
        description: Freelancer or production supplier name.
        constraints: non-empty
      - name: vendor_type
        type: enum
        source: input
        description: Cost category.
        constraints: one of FREELANCER, PRODUCTION, PRINT, OTHER
      - name: incurred_on
        type: datetime
        source: input
        description: ISO 8601 date the cost was incurred. Decides which Invoice period the cost falls into.
      - name: estimated_amount_cents
        type: integer
        source: input
        description: Quoted supplier cost, known at submission. Used by PROVISIONAL invoices.
        constraints: integer >= 0
      - name: actual_amount_cents
        type: integer
        source: computed
        description: >-
          Invoiced supplier cost, supplied at approval. null while SUBMITTED.
          Used by FINAL invoices.
        default: null
      - name: status
        type: enum
        source: computed
        description: SUBMITTED at creation; APPROVED on approval; BILLED when a FINAL Invoice that includes it is ISSUED.
        default: SUBMITTED
        constraints: one of SUBMITTED, APPROVED, BILLED

  - name: MediaPlan
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign whose media spend this plan governs.
      - name: approved_budget_cents
        type: integer
        source: input
        description: Total gross media budget this plan may commit.
        constraints: integer >= 0
      - name: allowed_channels
        type: array
        source: input
        description: >-
          Non-empty list of channel enum members this plan may buy. An InsertionOrder whose
          MediaPlacement.channel is not a member is rejected with ERR_PLACEMENT_NOT_ELIGIBLE.
        constraints: non-empty array, members drawn from DISPLAY, VIDEO, SOCIAL, OOH, PRINT
      - name: uncommitted_cents
        type: integer
        source: computed
        description: >-
          approved_budget_cents at creation. Decreased by InsertionOrder.gross_cents when an IO
          is created (RESERVED); increased by the same amount when that IO is CANCELLED.
          See calculations.media_budget_ledger.
        constraints: integer >= 0
      - name: status
        type: enum
        source: computed
        description: >-
          DRAFT at creation; APPROVED when the client signs the plan off; LOCKED as a cascade
          when the owning Campaign reaches WRAP_UP.
        default: DRAFT
        constraints: one of DRAFT, APPROVED, LOCKED

  - name: InsertionOrder
    parent: MediaPlan
    common_fields: true
    fields:
      - name: media_plan_id
        type: string
        source: input
        description: FK -> MediaPlan.id; the plan whose budget this order commits.
      - name: placement_id
        type: string
        source: input
        description: FK -> MediaPlacement.id; the publisher inventory slot this order occupies.
      - name: flight_start
        type: datetime
        source: input
        description: ISO 8601 date of the first day on air (INCLUSIVE).
      - name: flight_end
        type: datetime
        source: input
        description: ISO 8601 date of the last day on air (INCLUSIVE — the flight interval is closed at both ends).
        constraints: must be on or after flight_start
      - name: gross_cents
        type: integer
        source: input
        description: Gross media cost committed to the publisher.
        constraints: integer >= 1
      - name: delivered_impressions
        type: integer
        source: computed
        description: Impressions reported by the publisher at delivery. 0 until DELIVERED.
        default: 0
      - name: delivered_spend_cents
        type: integer
        source: computed
        description: Actual spend reported by the publisher at delivery. 0 until DELIVERED.
        default: 0
      - name: status
        type: enum
        source: computed
        description: RESERVED at creation (budget committed) -> PLACED -> DELIVERED; RESERVED or PLACED may go to CANCELLED.
        default: RESERVED
        constraints: one of RESERVED, PLACED, DELIVERED, CANCELLED

  - name: Invoice
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: FK -> Client.id; the advertiser being billed.
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the campaign being billed. Its client_id must equal this invoice's client_id.
      - name: retainer_id
        type: string
        source: input
        description: FK -> Retainer.id; the prepaid balance drawn down at issue. Its client_id must equal this invoice's client_id.
      - name: billing_mode
        type: enum
        source: input
        description: >-
          PROVISIONAL bills forecast values from unapproved work; FINAL bills only approved
          work at actual values. Selects the calculations.invoice_assembly variant.
        constraints: one of PROVISIONAL, FINAL
      - name: period_start
        type: datetime
        source: input
        description: Inclusive first date (ISO 8601 date) of the billing window.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive last date (ISO 8601 date) of the billing window.
        constraints: must be strictly after period_start
      - name: line_count
        type: integer
        source: computed
        description: >-
          Number of included TimeEntry rows + number of included VendorCost rows +
          (1 if media_gross_cents > 0 else 0). An invoice with line_count == 0 is rejected at creation.
        default: 0
      - name: labor_cents
        type: integer
        source: computed
        description: Labor component of the subtotal. See calculations.invoice_assembly.
        default: 0
      - name: vendor_base_cents
        type: integer
        source: computed
        description: Un-marked-up supplier cost included in this invoice.
        default: 0
      - name: vendor_marked_up_cents
        type: integer
        source: computed
        description: Supplier cost after SOW.markup_pct, rounded PER LINE then summed. See calculations.vendor_cost_markup.
        default: 0
      - name: media_gross_cents
        type: integer
        source: computed
        description: Gross media in scope for this invoice period. See calculations.invoice_assembly.
        default: 0
      - name: media_commission_cents
        type: integer
        source: computed
        description: Agency commission on media_gross_cents. See calculations.media_commission.
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: labor_cents + vendor_marked_up_cents + media_commission_cents.
        default: 0
      - name: discount_pct
        type: number
        source: computed
        description: Volume discount rate selected from subtotal_cents ONLY. See calculations.invoice_total.
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: round_half_up(subtotal_cents * discount_pct).
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: round_half_up(ADMIN_FEE_PCT * (subtotal_cents - discount_cents)). Computed AFTER the discount.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents - discount_cents + admin_fee_cents.
        default: 0
      - name: retainer_applied_cents
        type: integer
        source: computed
        description: >-
          Cash drawn from the Retainer at issue = min(retainer.balance_cents, total_cents).
          0 while approval_status is DRAFT.
        default: 0
      - name: cash_due_cents
        type: integer
        source: computed
        description: total_cents - retainer_applied_cents, decided at issue. 0 while approval_status is DRAFT.
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Cumulative cash received against cash_due_cents.
        default: 0
      - name: approval_status
        type: enum
        source: computed
        description: >-
          Dimension 1 of the Invoice's parallel state. DRAFT at creation; ISSUED on issue;
          VOID on void. Independent of payment_status.
        default: DRAFT
        constraints: one of DRAFT, ISSUED, VOID
      - name: payment_status
        type: enum
        source: computed
        description: >-
          Dimension 2 of the Invoice's parallel state. UNPAID while amount_paid_cents == 0 and
          cash_due_cents > 0; PARTIALLY_PAID while 0 < amount_paid_cents < cash_due_cents;
          PAID once amount_paid_cents == cash_due_cents (which is immediate at issue when
          cash_due_cents == 0). Independent of approval_status.
        default: UNPAID
        constraints: one of UNPAID, PARTIALLY_PAID, PAID
      - name: void_reason
        type: string
        source: computed
        description: Free text supplied on void. null otherwise.
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Client
    dimension: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system — cascade hop 3 of invoice issue: a Retainer of this Client transitioned ACTIVE -> DEPLETED"
        actor: system
        preconditions:
          - "at least one Retainer with client_id == this Client has status == DEPLETED"
        side_effects:
          - "cascade hop 4: every Campaign with client_id == this Client and status == IN_FLIGHT transitions IN_FLIGHT -> ON_HOLD"
          - "increments Client.version by 1"
        note: "Never triggered by a direct endpoint; only by the Retainer balance movement described in calculations.retainer_application."
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "system — a Retainer of this Client transitioned DEPLETED -> ACTIVE (funding or invoice void)"
        actor: system
        preconditions:
          - "every Retainer with client_id == this Client has status == ACTIVE"
        side_effects:
          - "compensating cascade: every Campaign with client_id == this Client and status == ON_HOLD transitions ON_HOLD -> IN_FLIGHT"
          - "increments Client.version by 1"

  - entity: Retainer
    dimension: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system — cascade hop 2 of POST /invoices/{id}/issue: balance_cents reached exactly 0"
        actor: system
        preconditions:
          - "balance_cents == 0 after applying Invoice.retainer_applied_cents"
        side_effects:
          - "cascade hop 3: the owning Client transitions ACTIVE -> CREDIT_HOLD"
          - "increments Retainer.version by 1"
      - from: DEPLETED
        to: ACTIVE
        trigger: "system — balance_cents became > 0 via POST /retainers/{id}/fund or POST /invoices/{id}/void"
        actor: system
        preconditions:
          - "balance_cents > 0"
        side_effects:
          - "compensating cascade: the owning Client transitions CREDIT_HOLD -> ACTIVE if all its Retainers are ACTIVE"
          - "increments Retainer.version by 1"

  - entity: SOW
    dimension: status
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: COUNTERSIGNED
        trigger: "POST /sows/{id}/countersign"
        actor: ClientReviewer
        preconditions:
          - "SOW.status == DRAFT"
          - "X-User-ID == SOW.client_id"
          - "logical clock now < SOW.effective_end"
        side_effects:
          - "copies RateCard.version into SOW.pinned_rate_card_version"
          - "copies RateCard.rate_junior_cents_per_hour / rate_senior_cents_per_hour / rate_director_cents_per_hour into the three SOW.pinned_rate_* fields (version-pinning on approval — later PATCH /rate-cards edits never reach this SOW)"
          - "increments SOW.version by 1"
      - from: COUNTERSIGNED
        to: EXPIRED
        trigger: "system — POST /_clock/set_current_utc moved the logical clock to or past SOW.effective_end"
        actor: system
        preconditions:
          - "logical clock now >= SOW.effective_end (date comparison)"
        side_effects:
          - "increments SOW.version by 1"
          - "no cascade to Campaign: campaigns stay IN_FLIGHT, but POST /time-entries against them now fails with ERR_SOW_EXPIRED"

  - entity: Campaign
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: IN_FLIGHT
        trigger: "POST /campaigns/{id}/launch"
        actor: AccountManager
        preconditions:
          - "Campaign.status == DRAFT"
          - "Campaign.brief_summary is non-empty"
          - "the referenced SOW.status == COUNTERSIGNED (DRAFT -> ERR_SOW_NOT_COUNTERSIGNED, EXPIRED -> ERR_SOW_EXPIRED)"
          - "the owning Client.status == ACTIVE (CREDIT_HOLD -> ERR_CAMPAIGN_ON_HOLD)"
        side_effects:
          - "increments Campaign.version by 1"
      - from: IN_FLIGHT
        to: ON_HOLD
        trigger: "system — cascade hop 4 of invoice issue: the owning Client transitioned ACTIVE -> CREDIT_HOLD"
        actor: system
        preconditions:
          - "owning Client.status == CREDIT_HOLD"
        side_effects:
          - "increments Campaign.version by 1"
          - "blocks POST /time-entries, POST /vendor-costs and POST /deliverables/{id}/approve for this campaign with ERR_CAMPAIGN_ON_HOLD"
      - from: ON_HOLD
        to: IN_FLIGHT
        trigger: "system — the owning Client transitioned CREDIT_HOLD -> ACTIVE"
        actor: system
        preconditions:
          - "owning Client.status == ACTIVE"
        side_effects:
          - "increments Campaign.version by 1"
      - from: IN_FLIGHT
        to: WRAP_UP
        trigger: "system — cascade hop 1 of POST /deliverables/{id}/approve: every Deliverable of this campaign is now APPROVED"
        actor: system
        preconditions:
          - "the campaign has >= 1 Deliverable"
          - "every Deliverable with campaign_id == this Campaign has status == APPROVED"
        side_effects:
          - "cascade hop 2: every MediaPlan with campaign_id == this Campaign and status == APPROVED transitions APPROVED -> LOCKED"
          - "increments Campaign.version by 1"
      - from: WRAP_UP
        to: CLOSED
        trigger: "system — an Invoice with campaign_id == this Campaign and approval_status == ISSUED reached payment_status == PAID"
        actor: system
        preconditions:
          - "Campaign.status == WRAP_UP"
        side_effects:
          - "increments Campaign.version by 1"

  - entity: Deliverable
    dimension: status
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /deliverables/{id}/submit"
        actor: CreativeLead
        preconditions:
          - "Deliverable.status IN {DRAFT, CHANGES_REQUESTED}"
          - "owning Campaign.status == IN_FLIGHT"
        side_effects:
          - "current_asset_version += 1"
          - "increments Deliverable.version by 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /deliverables/{id}/submit — the return edge of the revision loop"
        actor: CreativeLead
        preconditions:
          - "Deliverable.status == CHANGES_REQUESTED"
          - "owning Campaign.status == IN_FLIGHT"
        side_effects:
          - "current_asset_version += 1"
          - "increments Deliverable.version by 1"
        note: "This edge together with SUBMITTED -> CHANGES_REQUESTED forms the cycle."
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /deliverables/{id}/request-changes"
        actor: ClientReviewer
        preconditions:
          - "Deliverable.status == SUBMITTED"
          - "X-User-ID == the owning Campaign's client_id"
          - "Deliverable.revision_round < MAX_REVISION_ROUNDS (3), else ERR_REVISION_LIMIT_EXCEEDED"
          - "owning Campaign.status == IN_FLIGHT"
        side_effects:
          - "revision_round += 1"
          - "last_feedback = the supplied feedback string"
          - "increments Deliverable.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /deliverables/{id}/approve"
        actor: ClientReviewer
        preconditions:
          - "Deliverable.status == SUBMITTED"
          - "X-User-ID == the owning Campaign's client_id"
          - "owning Campaign.status == IN_FLIGHT (ON_HOLD -> ERR_CAMPAIGN_ON_HOLD)"
        side_effects:
          - "approved_asset_version = current_asset_version (version-pinning on approval)"
          - "cascade hop 1: if the campaign has >= 1 Deliverable and all of them are now APPROVED, the Campaign transitions IN_FLIGHT -> WRAP_UP"
          - "cascade hop 2 (caused by hop 1): every MediaPlan of that Campaign with status == APPROVED transitions APPROVED -> LOCKED"
          - "cascade hop 3 (caused by hop 2): every InsertionOrder of that LOCKED MediaPlan with status == RESERVED transitions RESERVED -> CANCELLED and its gross_cents is released back into MediaPlan.uncommitted_cents; InsertionOrders with status PLACED or DELIVERED are left untouched"
          - "increments Deliverable.version by 1"

  - entity: TimeEntry
    dimension: status
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /time-entries/{id}/approve"
        actor: AccountManager
        preconditions:
          - "TimeEntry.status == SUBMITTED"
          - "X-User-ID != TimeEntry.staff_id (segregation of duties), else ERR_SEGREGATION_OF_DUTIES"
          - "owning Campaign.status == IN_FLIGHT (ON_HOLD -> ERR_CAMPAIGN_ON_HOLD)"
        side_effects:
          - "approved_by_staff_id = X-User-ID"
          - "computes regular_minutes / overtime_minutes / billable_amount_cents per calculations.time_entry_billable_amount"
          - "increments TimeEntry.version by 1"
      - from: APPROVED
        to: BILLED
        trigger: "system — POST /invoices/{id}/issue on an Invoice whose billing_mode == FINAL and whose line set includes this entry"
        actor: system
        preconditions:
          - "TimeEntry.status == APPROVED"
          - "the issuing Invoice.billing_mode == FINAL"
        side_effects:
          - "increments TimeEntry.version by 1"
        note: "A PROVISIONAL invoice never moves a TimeEntry to BILLED."
      - from: BILLED
        to: APPROVED
        trigger: "system — POST /invoices/{id}/void on the FINAL Invoice that had billed this entry"
        actor: system
        preconditions:
          - "TimeEntry.status == BILLED"
          - "the voided Invoice is the one whose issue billed it"
        side_effects:
          - "increments TimeEntry.version by 1"
        note: "Compensation: voiding a FINAL invoice releases its lines so they can be billed again."

  - entity: VendorCost
    dimension: status
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vendor-costs/{id}/approve"
        actor: AccountManager
        preconditions:
          - "VendorCost.status == SUBMITTED"
          - "owning Campaign.status == IN_FLIGHT (ON_HOLD -> ERR_CAMPAIGN_ON_HOLD)"
        side_effects:
          - "actual_amount_cents = the supplied actual_amount_cents"
          - "increments VendorCost.version by 1"
      - from: APPROVED
        to: BILLED
        trigger: "system — POST /invoices/{id}/issue on an Invoice whose billing_mode == FINAL and whose line set includes this cost"
        actor: system
        preconditions:
          - "VendorCost.status == APPROVED"
          - "the issuing Invoice.billing_mode == FINAL"
        side_effects:
          - "increments VendorCost.version by 1"
      - from: BILLED
        to: APPROVED
        trigger: "system — POST /invoices/{id}/void on the FINAL Invoice that had billed this cost"
        actor: system
        preconditions:
          - "VendorCost.status == BILLED"
          - "the voided Invoice is the one whose issue billed it"
        side_effects:
          - "increments VendorCost.version by 1"

  - entity: MediaPlan
    dimension: status
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /media-plans/{id}/approve"
        actor: ClientReviewer
        preconditions:
          - "MediaPlan.status == DRAFT"
          - "X-User-ID == the owning Campaign's client_id"
          - "owning Campaign.status == IN_FLIGHT"
        side_effects:
          - "increments MediaPlan.version by 1"
      - from: APPROVED
        to: LOCKED
        trigger: "system — cascade hop 2 of deliverable approval: the owning Campaign transitioned IN_FLIGHT -> WRAP_UP"
        actor: system
        preconditions:
          - "owning Campaign.status == WRAP_UP"
        side_effects:
          - "cascade hop 3: every InsertionOrder with media_plan_id == this plan and status == RESERVED transitions RESERVED -> CANCELLED, and MediaPlan.uncommitted_cents += that IO's gross_cents (conditional cascade: PLACED and DELIVERED IOs are untouched)"
          - "increments MediaPlan.version by 1"

  - entity: InsertionOrder
    dimension: status
    initial_state: RESERVED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: RESERVED
        to: PLACED
        trigger: "POST /insertion-orders/{id}/place"
        actor: MediaBuyer
        preconditions:
          - "InsertionOrder.status == RESERVED"
          - "the owning MediaPlan.status == APPROVED, else ERR_MEDIA_PLAN_NOT_APPROVED"
        side_effects:
          - "increments InsertionOrder.version by 1"
      - from: PLACED
        to: DELIVERED
        trigger: "POST /insertion-orders/{id}/deliver"
        actor: MediaBuyer
        preconditions:
          - "InsertionOrder.status == PLACED"
        side_effects:
          - "delivered_impressions and delivered_spend_cents = the supplied publisher figures"
          - "increments InsertionOrder.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /insertion-orders/{id}/cancel, OR system cascade hop 3 when the owning MediaPlan is LOCKED"
        actor: MediaBuyer | system
        preconditions:
          - "InsertionOrder.status == RESERVED"
        side_effects:
          - "MediaPlan.uncommitted_cents += InsertionOrder.gross_cents (compensating action of the reserve)"
          - "increments MediaPlan.version by 1"
          - "increments InsertionOrder.version by 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /insertion-orders/{id}/cancel"
        actor: MediaBuyer
        preconditions:
          - "InsertionOrder.status == PLACED"
        side_effects:
          - "MediaPlan.uncommitted_cents += InsertionOrder.gross_cents"
          - "increments MediaPlan.version by 1"
          - "increments InsertionOrder.version by 1"
        note: "The MediaPlan LOCK cascade does NOT cancel PLACED orders; only an explicit call does."

  - entity: Invoice
    dimension: approval_status
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: AgencyAdmin
        preconditions:
          - "Invoice.approval_status == DRAFT"
          - "payload expected_retainer_version == Retainer.version, else ERR_STALE_RETAINER_VERSION (412)"
        side_effects:
          - "computes retainer_applied_cents = min(Retainer.balance_cents, total_cents) and cash_due_cents = total_cents - retainer_applied_cents (calculations.retainer_application)"
          - "cascade hop 1: Retainer.balance_cents -= retainer_applied_cents; increments Retainer.version by 1"
          - "cascade hop 2 (caused by hop 1): if Retainer.balance_cents == 0 the Retainer transitions ACTIVE -> DEPLETED"
          - "cascade hop 3 (caused by hop 2): the owning Client transitions ACTIVE -> CREDIT_HOLD"
          - "cascade hop 4 (caused by hop 3): every Campaign of that Client with status == IN_FLIGHT transitions IN_FLIGHT -> ON_HOLD"
          - "if billing_mode == FINAL: every included TimeEntry transitions APPROVED -> BILLED and every included VendorCost transitions APPROVED -> BILLED"
          - "if cash_due_cents == 0 the Invoice's payment_status dimension jumps straight to PAID"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: AgencyAdmin
        preconditions:
          - "Invoice.approval_status == ISSUED"
          - "Invoice.amount_paid_cents == 0, else ERR_INVALID_STATE"
        side_effects:
          - "compensating action: Retainer.balance_cents += Invoice.retainer_applied_cents; increments Retainer.version by 1"
          - "if the Retainer was DEPLETED and balance_cents is now > 0 it transitions DEPLETED -> ACTIVE, which un-holds the Client and its ON_HOLD Campaigns"
          - "if billing_mode == FINAL: every TimeEntry and VendorCost this invoice had billed reverts BILLED -> APPROVED"
          - "void_reason = the supplied reason"
          - "increments Invoice.version by 1"
        note: "retainer_applied_cents is NOT zeroed; the conservation invariant excludes VOID invoices by approval_status filter."

  - entity: Invoice
    dimension: payment_status
    initial_state: UNPAID
    terminal_states: [PAID]
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments"
        actor: ClientReviewer
        preconditions:
          - "Invoice.approval_status == ISSUED, else ERR_INVALID_STATE"
          - "X-User-ID == Invoice.client_id"
          - "amount_paid_cents + amount_cents < cash_due_cents"
        side_effects:
          - "amount_paid_cents += amount_cents"
          - "increments Invoice.version by 1"
        note: "Independent of the approval_status dimension, which stays ISSUED throughout."
      - from: UNPAID
        to: PAID
        trigger: "POST /invoices/{id}/payments settling the full cash_due_cents in one call, OR POST /invoices/{id}/issue when cash_due_cents == 0"
        actor: ClientReviewer | system
        preconditions:
          - "amount_paid_cents + amount_cents == cash_due_cents (or cash_due_cents == 0 at issue)"
        side_effects:
          - "amount_paid_cents = cash_due_cents"
          - "if the owning Campaign.status == WRAP_UP it transitions WRAP_UP -> CLOSED"
          - "increments Invoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{id}/payments"
        actor: ClientReviewer
        preconditions:
          - "Invoice.approval_status == ISSUED"
          - "amount_paid_cents + amount_cents == cash_due_cents, else ERR_PAYMENT_EXCEEDS_BALANCE when the sum exceeds cash_due_cents"
        side_effects:
          - "amount_paid_cents = cash_due_cents"
          - "if the owning Campaign.status == WRAP_UP it transitions WRAP_UP -> CLOSED"
          - "increments Invoice.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: io-create-stale-media-plan
    parent_entity: MediaPlan
    write_endpoint: "POST /insertion-orders"
    occ_field: "expected_media_plan_version"
    description: |
      Creating an InsertionOrder against a MediaPlan whose version has advanced since the
      client last observed it is rejected. The budget-committing create is legitimate on its
      own — a second create for a different placement would succeed under natural product
      semantics — so the stale-version guard is the only thing that stops a writer from
      committing budget against an out-of-date view of uncommitted_cents.
    error_id: ERR_STALE_MEDIA_PLAN_VERSION
    http_status: 412

  - rule_id: invoice-issue-stale-retainer
    parent_entity: Retainer
    write_endpoint: "POST /invoices/{id}/issue"
    occ_field: "expected_retainer_version"
    description: |
      Issuing an Invoice that draws down a Retainer whose version has advanced since the
      client last observed it is rejected. Issuing a second, different invoice against the
      same retainer is legitimate under natural product semantics, so nothing in the state
      machine would stop a writer holding a stale balance_cents view from over-drawing.
    error_id: ERR_STALE_RETAINER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: time_entry_estimated_amount
    trigger: "POST /time-entries (at creation)"
    algorithm: aggregation
    formula: |
      minutes = whole_minutes(ended_at - started_at)
      if billable == false:
          pinned_rate_cents_per_hour = 0
          estimated_amount_cents     = 0
      else:
          pinned_rate_cents_per_hour = {
             JUNIOR:   SOW.pinned_rate_junior_cents_per_hour,
             SENIOR:   SOW.pinned_rate_senior_cents_per_hour,
             DIRECTOR: SOW.pinned_rate_director_cents_per_hour,
          }[StaffMember.grade]
          estimated_amount_cents = round_half_up(minutes * pinned_rate_cents_per_hour / 60)
      internal_cost_cents = round_half_up(minutes * StaffMember.cost_rate_cents_per_hour / 60)
    input_set: "The SOW reached through Campaign.sow_id; its pinned_rate_* columns, never the live RateCard."
    constants: {}
    precision: "integer cents, round_half_up"
    variants: []
    note: "estimated_amount_cents carries NO overtime uplift — that is decided only at approval."

  - name: time_entry_billable_amount
    trigger: "POST /time-entries/{id}/approve — the SUBMITTED -> APPROVED transition"
    algorithm: threshold
    formula: |
      # Combinatorial mode (a): three interacting inputs (this entry's minutes, the pinned
      # grade rate, and the staff member's already-approved minutes on the same UTC date)
      # combined through nested max/min and a rate uplift.
      prior_minutes = SUM(TimeEntry.minutes)
                      WHERE staff_id            == this.staff_id
                        AND work_date           == this.work_date
                        AND billable            == true
                        AND status              IN {APPROVED, BILLED}
                        AND id                  != this.id
      regular_minutes  = max(0, min(this.minutes, OVERTIME_THRESHOLD_MINUTES - prior_minutes))
      overtime_minutes = this.minutes - regular_minutes
      billable_amount_cents =
            round_half_up(regular_minutes  * pinned_rate_cents_per_hour / 60)
          + round_half_up(overtime_minutes * pinned_rate_cents_per_hour * OVERTIME_MULTIPLIER / 60)
      # Rounding order is PINNED: round each of the two legs to a whole cent, then add.
      if billable == false: regular_minutes = overtime_minutes = billable_amount_cents = 0
    input_set: >-
      prior_minutes counts ONLY billable TimeEntry rows of the same staff_id on the same
      work_date whose status IN {APPROVED, BILLED}. SUBMITTED rows and non-billable rows are
      excluded, so approval order across a day is what decides which entry absorbs overtime.
    constants:
      OVERTIME_THRESHOLD_MINUTES: 480
      OVERTIME_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up per leg then sum"
    variants: []
    note: >-
      Boundary: with prior_minutes == 479 and minutes == 2, exactly 1 minute is regular and
      1 minute is overtime. With prior_minutes == 480 the whole entry is overtime.

  - name: sow_labor_consumption
    trigger: "POST /time-entries (recomputed as a side effect of every TimeEntry creation)"
    algorithm: aggregation
    formula: |
      SOW.consumed_labor_cents = SUM(TimeEntry.estimated_amount_cents)
        WHERE TimeEntry.campaign_id IN (SELECT id FROM Campaign WHERE sow_id == SOW.id)
          AND TimeEntry.status IN {SUBMITTED, APPROVED, BILLED}
      # Cap check at creation, evaluated on the POST-inclusive figure:
      #   reject when SOW.consumed_labor_cents(before) + new_entry.estimated_amount_cents
      #               > SOW.labor_cap_cents      ->  ERR_SOW_LABOR_CAP_EXCEEDED
      # Exactly equal to the cap PASSES (the comparison is strictly greater-than).
    input_set: "All TimeEntry rows under every Campaign of this SOW; no status is excluded because SUBMITTED, APPROVED and BILLED are the only three."
    constants: {}
    precision: "integer cents"
    variants: []

  - name: staff_utilization
    trigger: "GET /staff-members/{id}/utilization"
    algorithm: weighted_scoring
    formula: |
      # Half-open period window: [period_start, period_end)
      weekdays        = count of UTC calendar dates d in [period_start, period_end)
                        where d.weekday() IN {MON, TUE, WED, THU, FRI}
      capacity_minutes = weekdays * StaffMember.standard_daily_capacity_minutes

      billable_minutes = SUM(TimeEntry.minutes)   WHERE staff_id == S
                                                    AND billable == true
                                                    AND status IN {APPROVED, BILLED}
                                                    AND work_date IN [period_start, period_end)
      logged_minutes   = SUM(TimeEntry.minutes)   WHERE staff_id == S
                                                    AND status IN {SUBMITTED, APPROVED, BILLED}
                                                    AND work_date IN [period_start, period_end)
      billed_amount_cents = SUM(TimeEntry.billable_amount_cents)
                                                  WHERE staff_id == S
                                                    AND billable == true
                                                    AND status IN {APPROVED, BILLED}
                                                    AND work_date IN [period_start, period_end)

      effective_billable_rate_cents_per_hour =
          round_half_up(billed_amount_cents * 60 / billable_minutes) if billable_minutes > 0 else 0
    input_set: >-
      billable_minutes counts only billable rows in {APPROVED, BILLED}. logged_minutes counts
      EVERY row in {SUBMITTED, APPROVED, BILLED} regardless of the `billable` flag. The two
      denominators are what make the two variants diverge on identical data.
    constants: {}
    precision: "percentages: 1 decimal place, round_half_up. Rates: integer cents, round_half_up."
    variants:
      - name: capacity_based
        when: "Always emitted as utilization_pct_capacity_based."
        difference: >-
          utilization_pct_capacity_based = round_half_up(billable_minutes / capacity_minutes * 100, 1),
          or 0.0 when capacity_minutes == 0. Denominator is contracted weekday capacity, so idle
          time and non-billable admin time both drag the number down.
      - name: logged_based
        when: "Always emitted as utilization_pct_logged_based."
        difference: >-
          utilization_pct_logged_based = round_half_up(billable_minutes / logged_minutes * 100, 1),
          or 0.0 when logged_minutes == 0. Denominator is what the person actually logged, so idle
          time is invisible and only the billable/non-billable split moves the number.

  - name: vendor_cost_markup
    trigger: "POST /invoices (during line assembly)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (b): the rounding ORDER is the whole difficulty and is PINNED.
      vendor_base_cents      = SUM(base_cents(vc)          for vc in included_vendor_costs)
      vendor_marked_up_cents = SUM(round_half_up(base_cents(vc) * (1 + SOW.markup_pct))
                                                            for vc in included_vendor_costs)
      # PINNED: round PER LINE to a whole cent, THEN sum.
      # FORBIDDEN: round_half_up(SUM(base_cents) * (1 + markup_pct)) — "sum then round" —
      # which differs by up to one cent per line (two lines of 1_000_002 at markup 0.175 give
      # 2_350_004 per-line vs 2_350_005 sum-then-round).
      # base_cents(vc) is vc.estimated_amount_cents for PROVISIONAL invoices and
      # vc.actual_amount_cents for FINAL invoices — see calculations.invoice_assembly.
    input_set: "The VendorCost rows selected by calculations.invoice_assembly for this invoice's billing_mode and period."
    constants: {}
    precision: "integer cents, round_half_up, applied per line before summation"
    variants: []

  - name: media_commission
    trigger: "POST /invoices (during line assembly)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): tier selection + two clamps over one aggregate input.
      gross = Invoice.media_gross_cents
      rate  = 0.15  if gross <  TIER1_CENTS
            = 0.12  if TIER1_CENTS <= gross < TIER2_CENTS
            = 0.10  if gross >= TIER2_CENTS
      raw   = round_half_up(gross * rate)
      media_commission_cents = 0 if gross == 0
                               else min(max(raw, MIN_COMMISSION_CENTS), MAX_COMMISSION_CENTS)
    input_set: "media_gross_cents as assembled by calculations.invoice_assembly."
    constants:
      TIER1_CENTS: 5000000
      TIER2_CENTS: 20000000
      MIN_COMMISSION_CENTS: 50000
      MAX_COMMISSION_CENTS: 2500000
    precision: "integer cents, round_half_up before clamping"
    variants: []
    note: >-
      Tier boundaries are inclusive-low: gross == 5_000_000 selects 0.12, not 0.15;
      gross == 20_000_000 selects 0.10, not 0.12. A zero-gross invoice takes 0 commission,
      NOT the MIN_COMMISSION_CENTS floor.

  - name: invoice_assembly
    trigger: "POST /invoices (at creation)"
    algorithm: forward_looking
    formula: |
      # Period window is half-open: [period_start, period_end)
      # -- labor ---------------------------------------------------------------
      labor_cents = SUM(labor_value(te) for te in included_time_entries)
      # -- vendor --------------------------------------------------------------
      vendor_base_cents / vendor_marked_up_cents per calculations.vendor_cost_markup
      # -- media ---------------------------------------------------------------
      media_gross_cents      = SUM(io.gross_cents for io in included_insertion_orders)
      media_commission_cents per calculations.media_commission
      # -- line count ----------------------------------------------------------
      line_count = len(included_time_entries) + len(included_vendor_costs)
                   + (1 if media_gross_cents > 0 else 0)
      # line_count == 0  ->  ERR_INVOICE_NO_LINES (422), invoice is NOT created.
    input_set: >-
      included_time_entries: TimeEntry rows with campaign_id == Invoice.campaign_id and
      work_date IN [period_start, period_end); the status filter and the money column depend
      on billing_mode (see variants).
      included_vendor_costs: VendorCost rows with campaign_id == Invoice.campaign_id and
      incurred_on IN [period_start, period_end); status filter and money column per variant.
      included_insertion_orders: InsertionOrder rows whose media_plan_id belongs to a MediaPlan
      with campaign_id == Invoice.campaign_id and whose flight_start IN [period_start, period_end);
      status filter per variant.
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "Invoice.billing_mode == PROVISIONAL"
        difference: >-
          TimeEntry filter status IN {SUBMITTED, APPROVED} and labor_value(te) =
          te.estimated_amount_cents (NO overtime uplift). VendorCost filter status IN
          {SUBMITTED, APPROVED} and base_cents(vc) = vc.estimated_amount_cents.
          InsertionOrder filter status IN {RESERVED, PLACED, DELIVERED}. Issuing a PROVISIONAL
          invoice does NOT move any TimeEntry or VendorCost to BILLED.
      - name: final
        when: "Invoice.billing_mode == FINAL"
        difference: >-
          TimeEntry filter status == APPROVED only and labor_value(te) = te.billable_amount_cents
          (WITH the overtime uplift). VendorCost filter status == APPROVED only and
          base_cents(vc) = vc.actual_amount_cents. InsertionOrder filter status IN
          {PLACED, DELIVERED} only. Issuing a FINAL invoice moves every included TimeEntry and
          VendorCost from APPROVED to BILLED.
    note: >-
      The two variants read the same rows and produce different money for identical data:
      PROVISIONAL sees unapproved work at forecast values, FINAL sees only approved work at
      actual values with overtime applied.

  - name: invoice_total
    trigger: "POST /invoices (after calculations.invoice_assembly)"
    algorithm: constraint_propagation
    formula: |
      # Combinatorial mode (c): a circular-LOOKING dependency, resolved by a PINNED
      # evaluation order. The volume-discount tier looks like it should key on what the
      # client actually owes (which includes the admin fee), but the admin fee is itself a
      # percentage of the DISCOUNTED subtotal. The scaffold breaks the loop as follows and
      # any other order is wrong:
      #
      #   step 1  subtotal_cents  = labor_cents + vendor_marked_up_cents + media_commission_cents
      #   step 2  discount_pct    = tier selected from subtotal_cents ONLY
      #                             (never from a total that already contains the admin fee)
      #   step 3  discount_cents  = round_half_up(subtotal_cents * discount_pct)
      #   step 4  admin_fee_cents = round_half_up(ADMIN_FEE_PCT * (subtotal_cents - discount_cents))
      #   step 5  total_cents     = subtotal_cents - discount_cents + admin_fee_cents
      #
      discount_pct = 0.00  if subtotal_cents <  DISCOUNT_TIER1_CENTS
                   = 0.05  if DISCOUNT_TIER1_CENTS <= subtotal_cents < DISCOUNT_TIER2_CENTS
                   = 0.08  if subtotal_cents >= DISCOUNT_TIER2_CENTS
    input_set: "The three subtotal components produced by calculations.invoice_assembly."
    constants:
      DISCOUNT_TIER1_CENTS: 10000000
      DISCOUNT_TIER2_CENTS: 25000000
      ADMIN_FEE_PCT: 0.03
    precision: "integer cents, round_half_up at steps 3 and 4"
    variants: []
    note: >-
      Trap: a subtotal of 9_800_000 takes discount_pct 0.00 and admin_fee 294_000 for a total of
      10_094_000. Keying the tier on the total (10_094_000 >= 10_000_000) would wrongly grant 5%.

  - name: retainer_application
    trigger: "POST /invoices/{id}/issue — the DRAFT -> ISSUED transition"
    algorithm: waterfall_allocation
    formula: |
      retainer_applied_cents = min(Retainer.balance_cents, Invoice.total_cents)
      cash_due_cents         = Invoice.total_cents - retainer_applied_cents
      Retainer.balance_cents = Retainer.balance_cents - retainer_applied_cents
      if Retainer.balance_cents == 0: Retainer.status = DEPLETED
      if cash_due_cents == 0:         Invoice.payment_status = PAID
    input_set: "The single Retainer named by Invoice.retainer_id. Retainer.status is NOT a filter: a DEPLETED retainer simply contributes 0."
    constants: {}
    precision: "integer cents"
    variants: []
    note: >-
      CONSERVATION INVARIANT (retainer cash):
        Retainer.funded_cents == Retainer.balance_cents
                               + SUM(Invoice.retainer_applied_cents
                                     WHERE Invoice.retainer_id == R.id
                                       AND Invoice.approval_status == 'ISSUED')
      POST /invoices/{id}/void is the compensating action: it adds retainer_applied_cents back
      to balance_cents and moves the invoice out of the ISSUED filter, leaving zero drift.
      Boundary: balance_cents exactly equal to total_cents applies the whole total, leaves
      balance_cents == 0 and flips the retainer to DEPLETED.

  - name: media_budget_ledger
    trigger: "POST /insertion-orders, POST /insertion-orders/{id}/cancel, and the MediaPlan LOCK cascade"
    algorithm: aggregation
    formula: |
      on IO create   (status RESERVED): MediaPlan.uncommitted_cents -= io.gross_cents
      on IO cancel   (RESERVED|PLACED -> CANCELLED): MediaPlan.uncommitted_cents += io.gross_cents
      # Budget check at create, evaluated BEFORE the decrement:
      #   reject when io.gross_cents > MediaPlan.uncommitted_cents -> ERR_MEDIA_BUDGET_EXCEEDED
      #   exactly equal to uncommitted_cents PASSES (comparison is strictly greater-than).
    input_set: "InsertionOrder rows of this MediaPlan; only status IN {RESERVED, PLACED, DELIVERED} hold committed budget."
    constants: {}
    precision: "integer cents"
    variants: []
    note: >-
      CONSERVATION INVARIANT (media budget):
        MediaPlan.approved_budget_cents == MediaPlan.uncommitted_cents
                                          + SUM(InsertionOrder.gross_cents
                                                WHERE media_plan_id == P.id
                                                  AND status IN {RESERVED, PLACED, DELIVERED})
      Cancel is the compensating action of create; DELIVERED orders keep holding their budget.

  - name: campaign_performance_report
    trigger: "GET /campaigns/{id}/performance-report"
    algorithm: aggregation
    formula: |
      ios = InsertionOrder rows whose media_plan_id belongs to a MediaPlan of this Campaign
            AND status == DELIVERED
      delivered_impressions = SUM(io.delivered_impressions for io in ios)
      delivered_spend_cents = SUM(io.delivered_spend_cents for io in ios)
      effective_cpm_cents   = round_half_up(delivered_spend_cents * 1000 / delivered_impressions)
                              if delivered_impressions > 0 else 0

      billed_revenue_cents  = SUM(Invoice.total_cents)
                              WHERE campaign_id == C.id AND approval_status == 'ISSUED'
      direct_cost_cents     = SUM(TimeEntry.internal_cost_cents)
                              WHERE campaign_id == C.id AND status IN {APPROVED, BILLED}
                            + SUM(VendorCost.actual_amount_cents)
                              WHERE campaign_id == C.id AND status IN {APPROVED, BILLED}
      agency_gross_profit_cents = billed_revenue_cents - direct_cost_cents
      gross_margin_pct = round_half_up(agency_gross_profit_cents / billed_revenue_cents * 100, 1)
                         if billed_revenue_cents > 0 else 0.0
    input_set: >-
      Only DELIVERED InsertionOrders contribute impressions/spend. Only ISSUED invoices count as
      revenue (VOID invoices drop out). Only APPROVED/BILLED time and vendor rows count as cost;
      SUBMITTED rows are excluded. Non-billable TimeEntry rows DO contribute internal_cost_cents.
    constants: {}
    precision: "cents as integers; gross_margin_pct 1 decimal place, round_half_up"
    variants: []
    note: "Zero-impression boundary: effective_cpm_cents is 0, not a division error."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority — lowest number wins)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of AgencyAdmin, AccountManager, CreativeLead, MediaBuyer, ClientReviewer"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role in X-User-Role appears in the endpoint's `roles:` list in section 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: business_constraint
    check: >-
      Request body shape: every required `input:` field is present, enum values are members of the
      declared set, integers are integers within their declared range, ISO dates/datetimes parse,
      MediaPlan.allowed_channels is a non-empty array, TimeEntry.ended_at > started_at and on the
      same UTC date, InsertionOrder.flight_end >= flight_start, period_end > period_start
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: existence
    check: "every {id} in the path resolves, checked left-to-right"
    error_id: "ERR_<ENTITY>_NOT_FOUND (ERR_CLIENT_NOT_FOUND, ERR_RETAINER_NOT_FOUND, ERR_SOW_NOT_FOUND, ERR_CAMPAIGN_NOT_FOUND, ERR_DELIVERABLE_NOT_FOUND, ERR_TIME_ENTRY_NOT_FOUND, ERR_VENDOR_COST_NOT_FOUND, ERR_MEDIA_PLAN_NOT_FOUND, ERR_INSERTION_ORDER_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_RATE_CARD_NOT_FOUND, ERR_STAFF_MEMBER_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with a path {id}"

  - priority: 6
    category: existence
    check: >-
      every foreign key carried in the request body resolves, checked in the field order declared
      in the endpoint's `input:` list (e.g. POST /invoices checks client_id, then campaign_id, then retainer_id)
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /retainers, POST /sows, POST /campaigns, POST /deliverables, POST /time-entries, POST /vendor-costs, POST /media-plans, POST /insertion-orders, POST /invoices"

  - priority: 7
    category: auth
    check: >-
      Ownership for entity_backed roles. ClientReviewer: X-User-ID must equal the Client.id the
      target resource resolves to (SOW.client_id; Invoice.client_id; MediaPlan -> Campaign.client_id;
      Deliverable -> Campaign.client_id). Staff roles on POST /time-entries: X-User-ID must equal
      the body's staff_id.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /sows/{id}/countersign, POST /media-plans/{id}/approve, POST /deliverables/{id}/request-changes, POST /deliverables/{id}/approve, POST /invoices/{id}/payments, POST /time-entries"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: on POST /time-entries/{id}/approve the caller's X-User-ID must differ from TimeEntry.staff_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /time-entries/{id}/approve"

  - priority: 9
    category: state
    check: "OCC: the payload's expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_MEDIA_PLAN_VERSION on POST /insertion-orders; ERR_STALE_RETAINER_VERSION on POST /invoices/{id}/issue"
    http_status: 412
    applies_to: "POST /insertion-orders, POST /invoices/{id}/issue"

  - priority: 10
    category: state
    check: >-
      the target entity is in a `from:` state that section 1.2 declares for this transition
      (e.g. approving an already-APPROVED Deliverable, issuing an ISSUED Invoice, placing a
      CANCELLED InsertionOrder, paying a DRAFT Invoice, voiding an Invoice with amount_paid_cents > 0)
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 11
    category: state
    check: >-
      Cross-entity state gate on the owning Campaign: Campaign.status must be IN_FLIGHT.
      A Campaign in ON_HOLD rejects with ERR_CAMPAIGN_ON_HOLD; any other non-IN_FLIGHT status
      rejects with ERR_INVALID_STATE. Also applies to POST /campaigns/{id}/launch when the owning
      Client.status == CREDIT_HOLD.
    error_id: "ERR_CAMPAIGN_ON_HOLD (409) or ERR_INVALID_STATE (409)"
    http_status: 409
    applies_to: "POST /time-entries, POST /time-entries/{id}/approve, POST /vendor-costs, POST /vendor-costs/{id}/approve, POST /deliverables/{id}/submit, POST /deliverables/{id}/request-changes, POST /deliverables/{id}/approve, POST /media-plans/{id}/approve, POST /campaigns/{id}/launch"

  - priority: 12
    category: state
    check: >-
      Cross-entity state gate on the governing SOW: SOW.status must be COUNTERSIGNED.
      DRAFT rejects with ERR_SOW_NOT_COUNTERSIGNED; EXPIRED rejects with ERR_SOW_EXPIRED.
    error_id: "ERR_SOW_NOT_COUNTERSIGNED (409) or ERR_SOW_EXPIRED (409)"
    http_status: 409
    applies_to: "POST /time-entries, POST /campaigns/{id}/launch"

  - priority: 13
    category: state
    check: "Cross-entity state gate on the governing MediaPlan: POST /insertion-orders/{id}/place requires MediaPlan.status == APPROVED"
    error_id: ERR_MEDIA_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /insertion-orders/{id}/place"

  - priority: 14
    category: business_referential
    check: >-
      Referential eligibility: on POST /insertion-orders the referenced MediaPlacement.channel must
      be a member of the MediaPlan.allowed_channels array. Also on POST /campaigns the referenced
      SOW.client_id must equal the body's client_id, and on POST /invoices the referenced Campaign
      and Retainer must both have client_id equal to the body's client_id (ERR_INVALID_REQUEST).
    error_id: "ERR_PLACEMENT_NOT_ELIGIBLE (422) on POST /insertion-orders; ERR_INVALID_REQUEST (400) on POST /campaigns and POST /invoices"
    http_status: 422
    applies_to: "POST /insertion-orders, POST /campaigns, POST /invoices"

  - priority: 15
    category: business_temporal
    check: >-
      Interval-occupancy conflicts.
      (i) POST /insertion-orders: the CLOSED date interval [flight_start, flight_end] plus the
          placement's min_dark_days buffer must not collide with any other InsertionOrder on the
          SAME placement_id whose status IN {RESERVED, PLACED, DELIVERED}. Collision test:
            new.flight_start <= existing.flight_end + min_dark_days days
            AND existing.flight_start <= new.flight_end + min_dark_days days
          -> ERR_PLACEMENT_FLIGHT_CONFLICT.
      (ii) POST /time-entries: the HALF-OPEN instant interval [started_at, ended_at) must not
          overlap any other TimeEntry of the SAME staff_id whose status IN {SUBMITTED, APPROVED, BILLED}.
          Collision test: new.started_at < existing.ended_at AND existing.started_at < new.ended_at.
          Touching endpoints (new.started_at == existing.ended_at) are ALLOWED.
          -> ERR_TIME_ENTRY_OVERLAP.
    error_id: "ERR_PLACEMENT_FLIGHT_CONFLICT (409) or ERR_TIME_ENTRY_OVERLAP (409)"
    http_status: 409
    applies_to: "POST /insertion-orders, POST /time-entries"

  - priority: 16
    category: business_constraint
    check: >-
      Cardinality / round limits.
      (i) POST /deliverables/{id}/request-changes: Deliverable.revision_round must be < 3
          (MAX_REVISION_ROUNDS) -> ERR_REVISION_LIMIT_EXCEEDED.
      (ii) POST /invoices: the assembled line_count must be > 0 -> ERR_INVOICE_NO_LINES.
    error_id: "ERR_REVISION_LIMIT_EXCEEDED (422) or ERR_INVOICE_NO_LINES (422)"
    http_status: 422
    applies_to: "POST /deliverables/{id}/request-changes, POST /invoices"

  - priority: 17
    category: business_fiscal
    check: >-
      Capacity / budget ceilings, all evaluated LAST.
      (i) POST /time-entries: SUM of minutes of every TimeEntry of the same staff_id on the same
          work_date with status IN {SUBMITTED, APPROVED, BILLED}, PLUS the new entry's minutes,
          must be <= MAX_DAILY_MINUTES (600). Non-billable entries count. Exactly 600 PASSES,
          601 FAILS -> ERR_DAILY_MINUTES_EXCEEDED.
      (ii) POST /time-entries: SOW.consumed_labor_cents + new.estimated_amount_cents must be
          <= SOW.labor_cap_cents. Exactly equal PASSES -> ERR_SOW_LABOR_CAP_EXCEEDED.
      (iii) POST /insertion-orders: gross_cents must be <= MediaPlan.uncommitted_cents.
          Exactly equal PASSES -> ERR_MEDIA_BUDGET_EXCEEDED.
      (iv) POST /invoices/{id}/payments: amount_paid_cents + amount_cents must be
          <= cash_due_cents -> ERR_PAYMENT_EXCEEDS_BALANCE.
    error_id: "ERR_DAILY_MINUTES_EXCEEDED / ERR_SOW_LABOR_CAP_EXCEEDED / ERR_MEDIA_BUDGET_EXCEEDED / ERR_PAYMENT_EXCEEDS_BALANCE"
    http_status: 422
    applies_to: "POST /time-entries, POST /insertion-orders, POST /invoices/{id}/payments"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # --- Client -------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Register an advertiser."
    roles: [AgencyAdmin]
    code: 201
    input: [name, industry, billing_email]
    output: Client
    side_effects: ["Client.status initialised to ACTIVE"]

  - method: GET
    path: "/clients/{id}"
    description: "Read one advertiser, including the cascaded status field."
    roles: [AgencyAdmin, AccountManager, CreativeLead, MediaBuyer, ClientReviewer]
    code: 200
    input: []
    output: Client
    side_effects: []

  # --- RateCard -----------------------------------------------------------
  - method: POST
    path: "/rate-cards"
    description: "Publish a rate card."
    roles: [AgencyAdmin]
    code: 201
    input: [name, rate_junior_cents_per_hour, rate_senior_cents_per_hour, rate_director_cents_per_hour]
    output: RateCard
    side_effects: []

  - method: PATCH
    path: "/rate-cards/{id}"
    description: >-
      Edit the live rates on a rate card. Every COUNTERSIGNED SOW keeps the rates it pinned at
      countersign, so this call never changes past or future billing on those SOWs.
    roles: [AgencyAdmin]
    code: 200
    input: ["rate_junior_cents_per_hour?", "rate_senior_cents_per_hour?", "rate_director_cents_per_hour?"]
    output: RateCard
    side_effects: ["increments RateCard.version by 1"]

  # --- StaffMember --------------------------------------------------------
  - method: POST
    path: "/staff-members"
    description: "Register an agency employee."
    roles: [AgencyAdmin]
    code: 201
    input: [full_name, grade, "standard_daily_capacity_minutes?", cost_rate_cents_per_hour]
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/staff-members/{id}/utilization"
    description: "Computed read of the dual-variant utilization figures over a half-open [period_start, period_end) window."
    roles: [AgencyAdmin, AccountManager, CreativeLead, MediaBuyer]
    code: 200
    input: [period_start, period_end]
    output: { staff_id: string, period_start: string, period_end: string, capacity_minutes: integer, logged_minutes: integer, billable_minutes: integer, billed_amount_cents: integer, utilization_pct_capacity_based: number, utilization_pct_logged_based: number, effective_billable_rate_cents_per_hour: integer }
    side_effects: []

  # --- MediaPlacement -----------------------------------------------------
  - method: POST
    path: "/media-placements"
    description: "Register a publisher inventory slot that insertion orders can occupy."
    roles: [AgencyAdmin]
    code: 201
    input: [publisher_name, channel, "min_dark_days?"]
    output: MediaPlacement
    side_effects: []

  # --- Retainer -----------------------------------------------------------
  - method: POST
    path: "/retainers"
    description: "Open a prepaid retainer for a client."
    roles: [AgencyAdmin]
    code: 201
    input: [client_id, initial_funding_cents, period_start, period_end]
    output: Retainer
    side_effects: ["funded_cents = balance_cents = initial_funding_cents", "status initialised to ACTIVE"]

  - method: GET
    path: "/retainers/{id}"
    description: "Read one retainer. The canonical way to observe balance_cents and the version needed for the invoice-issue OCC guard."
    roles: [AgencyAdmin, AccountManager, ClientReviewer]
    code: 200
    input: []
    output: Retainer
    side_effects: []

  - method: GET
    path: "/retainers"
    description: "List retainers, filterable by client and status."
    roles: [AgencyAdmin, AccountManager, ClientReviewer]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Retainer[]
    side_effects: []

  - method: POST
    path: "/retainers/{id}/fund"
    description: "Top the retainer up with more cash."
    roles: [AgencyAdmin]
    code: 200
    input: [amount_cents]
    output: Retainer
    side_effects:
      - "funded_cents += amount_cents; balance_cents += amount_cents"
      - "if status was DEPLETED and balance_cents > 0: DEPLETED -> ACTIVE, which un-holds the Client and every ON_HOLD Campaign of that Client"
      - "increments Retainer.version by 1"

  # --- SOW ----------------------------------------------------------------
  - method: POST
    path: "/sows"
    description: "Draft a statement of work referencing a rate card."
    roles: [AccountManager]
    code: 201
    input: [client_id, rate_card_id, title, labor_cap_cents, markup_pct, effective_start, effective_end]
    output: SOW
    side_effects: ["status initialised to DRAFT", "all pinned_rate_* fields initialised to null"]

  - method: GET
    path: "/sows/{id}"
    description: "Read one SOW, including its pinned rate snapshot and consumed_labor_cents."
    roles: [AgencyAdmin, AccountManager, CreativeLead, MediaBuyer, ClientReviewer]
    code: 200
    input: []
    output: SOW
    side_effects: []

  - method: GET
    path: "/sows"
    description: "List SOWs, filterable by client and by the rate card they reference."
    roles: [AgencyAdmin, AccountManager, ClientReviewer]
    code: 200
    input: ["client_id?", "rate_card_id?", "status?", "limit?", "offset?"]
    output: SOW[]
    side_effects: []

  - method: POST
    path: "/sows/{id}/countersign"
    description: "Client signs the SOW. Freezes the rate card's four values onto the SOW."
    roles: [ClientReviewer]
    code: 200
    input: []
    output: SOW
    side_effects:
      - "status DRAFT -> COUNTERSIGNED"
      - "pinned_rate_card_version and the three pinned_rate_* columns copied from the RateCard"
      - "increments SOW.version by 1"

  # --- Campaign -----------------------------------------------------------
  - method: POST
    path: "/campaigns"
    description: "Create a campaign under a SOW and record its brief."
    roles: [AccountManager]
    code: 201
    input: [client_id, sow_id, name, brief_summary, objective]
    output: Campaign
    side_effects: ["status initialised to DRAFT"]

  - method: GET
    path: "/campaigns/{id}"
    description: "Read one campaign."
    roles: [AgencyAdmin, AccountManager, CreativeLead, MediaBuyer, ClientReviewer]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/campaigns"
    description: "List campaigns, filterable by client and by SOW."
    roles: [AgencyAdmin, AccountManager, CreativeLead, MediaBuyer, ClientReviewer]
    code: 200
    input: ["client_id?", "sow_id?", "status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: POST
    path: "/campaigns/{id}/launch"
    description: "Take the campaign live. Requires a COUNTERSIGNED SOW and an ACTIVE client."
    roles: [AccountManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status DRAFT -> IN_FLIGHT", "increments Campaign.version by 1"]

  - method: GET
    path: "/campaigns/{id}/deliverables"
    description: "Reverse lookup of every Deliverable of this campaign."
    roles: [AgencyAdmin, AccountManager, CreativeLead, MediaBuyer, ClientReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []

  - method: GET
    path: "/campaigns/{id}/vendor-costs"
    description: "Reverse lookup of every VendorCost of this campaign."
    roles: [AgencyAdmin, AccountManager, MediaBuyer, ClientReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VendorCost[]
    side_effects: []

  - method: GET
    path: "/campaigns/{id}/performance-report"
    description: "Computed read: delivered media, effective CPM, issued revenue, direct cost and gross margin."
    roles: [AgencyAdmin, AccountManager, MediaBuyer, ClientReviewer]
    code: 200
    input: []
    output: { campaign_id: string, delivered_impressions: integer, delivered_spend_cents: integer, effective_cpm_cents: integer, billed_revenue_cents: integer, direct_cost_cents: integer, agency_gross_profit_cents: integer, gross_margin_pct: number }
    side_effects: []

  # --- Deliverable --------------------------------------------------------
  - method: POST
    path: "/deliverables"
    description: "Open a creative deliverable on a campaign."
    roles: [CreativeLead]
    code: 201
    input: [campaign_id, title]
    output: Deliverable
    side_effects: ["status DRAFT, current_asset_version 0, revision_round 0"]

  - method: POST
    path: "/deliverables/{id}/submit"
    description: "Submit a new asset cut for client review. Legal from DRAFT and from CHANGES_REQUESTED (the revision loop)."
    roles: [CreativeLead]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["current_asset_version += 1", "status -> SUBMITTED", "increments Deliverable.version by 1"]

  - method: POST
    path: "/deliverables/{id}/request-changes"
    description: "Client bounces the cut back to the creative team. Capped at 3 rounds."
    roles: [ClientReviewer]
    code: 200
    input: [feedback]
    output: Deliverable
    side_effects: ["status SUBMITTED -> CHANGES_REQUESTED", "revision_round += 1", "last_feedback set", "increments Deliverable.version by 1"]

  - method: POST
    path: "/deliverables/{id}/approve"
    description: "Client approves the current cut. Pins the approved version and may wrap the whole campaign up."
    roles: [ClientReviewer]
    code: 200
    input: []
    output: Deliverable
    side_effects:
      - "status SUBMITTED -> APPROVED; approved_asset_version = current_asset_version"
      - "cascade: Campaign IN_FLIGHT -> WRAP_UP when every Deliverable of the campaign is APPROVED"
      - "cascade: that Campaign's APPROVED MediaPlans -> LOCKED"
      - "cascade: those plans' RESERVED InsertionOrders -> CANCELLED with their gross_cents released back to uncommitted_cents"
      - "increments Deliverable.version by 1"

  # --- TimeEntry ----------------------------------------------------------
  - method: POST
    path: "/time-entries"
    description: "Log a worked interval against a campaign. The caller may only log their own time."
    roles: [AccountManager, CreativeLead, MediaBuyer]
    code: 201
    input: [campaign_id, staff_id, started_at, ended_at, "billable?"]
    output: TimeEntry
    side_effects:
      - "minutes, work_date, pinned_rate_cents_per_hour, estimated_amount_cents, internal_cost_cents computed"
      - "status initialised to SUBMITTED"
      - "SOW.consumed_labor_cents recomputed"

  - method: GET
    path: "/time-entries/{id}"
    description: "Read one time entry."
    roles: [AgencyAdmin, AccountManager, CreativeLead, MediaBuyer]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []

  - method: GET
    path: "/time-entries"
    description: "List time entries, filterable by campaign, by the person who logged them, and by the person who approved them."
    roles: [AgencyAdmin, AccountManager, CreativeLead, MediaBuyer]
    code: 200
    input: ["campaign_id?", "staff_id?", "approved_by_staff_id?", "status?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []

  - method: POST
    path: "/time-entries/{id}/approve"
    description: "An account manager approves someone else's time. Never their own."
    roles: [AccountManager]
    code: 200
    input: []
    output: TimeEntry
    side_effects:
      - "status SUBMITTED -> APPROVED; approved_by_staff_id = X-User-ID"
      - "regular_minutes / overtime_minutes / billable_amount_cents computed per calculations.time_entry_billable_amount"
      - "increments TimeEntry.version by 1"

  # --- VendorCost ---------------------------------------------------------
  - method: POST
    path: "/vendor-costs"
    description: "Record a freelancer or production pass-through cost against a campaign."
    roles: [AccountManager]
    code: 201
    input: [campaign_id, vendor_name, vendor_type, estimated_amount_cents, incurred_on]
    output: VendorCost
    side_effects: ["status initialised to SUBMITTED; actual_amount_cents null"]

  - method: POST
    path: "/vendor-costs/{id}/approve"
    description: "Approve the supplier invoice and record what the vendor actually charged."
    roles: [AccountManager]
    code: 200
    input: [actual_amount_cents]
    output: VendorCost
    side_effects: ["status SUBMITTED -> APPROVED; actual_amount_cents set", "increments VendorCost.version by 1"]

  # --- MediaPlan ----------------------------------------------------------
  - method: POST
    path: "/media-plans"
    description: "Draft a media-buy plan with a budget and a channel whitelist."
    roles: [MediaBuyer]
    code: 201
    input: [campaign_id, approved_budget_cents, allowed_channels]
    output: MediaPlan
    side_effects: ["uncommitted_cents = approved_budget_cents", "status initialised to DRAFT"]

  - method: GET
    path: "/media-plans/{id}"
    description: "Read one media plan. The canonical way to re-read the version needed for the insertion-order OCC guard."
    roles: [AgencyAdmin, AccountManager, MediaBuyer, ClientReviewer]
    code: 200
    input: []
    output: MediaPlan
    side_effects: []

  - method: GET
    path: "/media-plans"
    description: "List media plans, filterable by campaign."
    roles: [AgencyAdmin, AccountManager, MediaBuyer, ClientReviewer]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: MediaPlan[]
    side_effects: []

  - method: POST
    path: "/media-plans/{id}/approve"
    description: "Client signs the media plan off, unlocking insertion-order placement."
    roles: [ClientReviewer]
    code: 200
    input: []
    output: MediaPlan
    side_effects: ["status DRAFT -> APPROVED", "increments MediaPlan.version by 1"]

  # --- InsertionOrder -----------------------------------------------------
  - method: POST
    path: "/insertion-orders"
    description: >-
      Reserve publisher inventory. Commits gross_cents out of the plan's uncommitted budget.
      Guarded by OCC on the MediaPlan's version.
    roles: [MediaBuyer]
    code: 201
    input: [media_plan_id, placement_id, flight_start, flight_end, gross_cents, expected_media_plan_version]
    output: InsertionOrder
    side_effects:
      - "status initialised to RESERVED"
      - "MediaPlan.uncommitted_cents -= gross_cents"
      - "increments MediaPlan.version by 1"

  - method: GET
    path: "/insertion-orders/{id}"
    description: "Read one insertion order."
    roles: [AgencyAdmin, AccountManager, MediaBuyer, ClientReviewer]
    code: 200
    input: []
    output: InsertionOrder
    side_effects: []

  - method: GET
    path: "/insertion-orders"
    description: "List insertion orders, filterable by media plan and by placement."
    roles: [AgencyAdmin, AccountManager, MediaBuyer, ClientReviewer]
    code: 200
    input: ["media_plan_id?", "placement_id?", "status?", "limit?", "offset?"]
    output: InsertionOrder[]
    side_effects: []

  - method: POST
    path: "/insertion-orders/{id}/place"
    description: "Send the order to the publisher. Requires the owning MediaPlan to be APPROVED."
    roles: [MediaBuyer]
    code: 200
    input: []
    output: InsertionOrder
    side_effects: ["status RESERVED -> PLACED", "increments InsertionOrder.version by 1"]

  - method: POST
    path: "/insertion-orders/{id}/cancel"
    description: "Cancel the order and release its committed budget. The compensating action of create."
    roles: [MediaBuyer]
    code: 200
    input: []
    output: InsertionOrder
    side_effects:
      - "status RESERVED|PLACED -> CANCELLED"
      - "MediaPlan.uncommitted_cents += gross_cents"
      - "increments MediaPlan.version by 1"
      - "increments InsertionOrder.version by 1"

  - method: POST
    path: "/insertion-orders/{id}/deliver"
    description: "Record the publisher's post-flight delivery figures."
    roles: [MediaBuyer]
    code: 200
    input: [delivered_impressions, delivered_spend_cents]
    output: InsertionOrder
    side_effects: ["status PLACED -> DELIVERED", "delivered_impressions / delivered_spend_cents set", "increments InsertionOrder.version by 1"]

  # --- Invoice ------------------------------------------------------------
  - method: POST
    path: "/invoices"
    description: >-
      Assemble a DRAFT invoice for one campaign over a half-open period. All money columns are
      computed here — issuing does not re-price anything.
    roles: [AccountManager]
    code: 201
    input: [client_id, campaign_id, retainer_id, billing_mode, period_start, period_end]
    output: Invoice
    side_effects:
      - "runs calculations.invoice_assembly, .vendor_cost_markup, .media_commission, .invoice_total"
      - "approval_status DRAFT, payment_status UNPAID"
      - "rejects with ERR_INVOICE_NO_LINES when line_count == 0"

  - method: GET
    path: "/invoices/{id}"
    description: "Read one invoice with every money column and both state dimensions."
    roles: [AgencyAdmin, AccountManager, ClientReviewer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List invoices, filterable by client, campaign, retainer and approval_status."
    roles: [AgencyAdmin, AccountManager, ClientReviewer]
    code: 200
    input: ["client_id?", "campaign_id?", "retainer_id?", "approval_status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{id}/issue"
    description: >-
      Issue the invoice and draw the retainer down. Guarded by OCC on the Retainer's version.
      Head of the four-hop credit-hold cascade.
    roles: [AgencyAdmin]
    code: 200
    input: [expected_retainer_version]
    output: Invoice
    side_effects:
      - "approval_status DRAFT -> ISSUED"
      - "retainer_applied_cents / cash_due_cents computed per calculations.retainer_application"
      - "Retainer.balance_cents -= retainer_applied_cents; increments Retainer.version by 1"
      - "cascade: Retainer ACTIVE -> DEPLETED -> Client ACTIVE -> CREDIT_HOLD -> that Client's IN_FLIGHT Campaigns -> ON_HOLD"
      - "if billing_mode == FINAL: included TimeEntry and VendorCost rows APPROVED -> BILLED"
      - "if cash_due_cents == 0: payment_status -> PAID"
      - "increments Invoice.version by 1"

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an unpaid issued invoice. The compensating action of issue; leaves zero retainer drift."
    roles: [AgencyAdmin]
    code: 200
    input: [reason]
    output: Invoice
    side_effects:
      - "approval_status ISSUED -> VOID; void_reason set"
      - "Retainer.balance_cents += retainer_applied_cents; increments Retainer.version by 1"
      - "cascade: Retainer DEPLETED -> ACTIVE -> Client CREDIT_HOLD -> ACTIVE -> that Client's ON_HOLD Campaigns -> IN_FLIGHT"
      - "if billing_mode == FINAL: every TimeEntry and VendorCost this invoice had billed reverts BILLED -> APPROVED"
      - "increments Invoice.version by 1"

  - method: POST
    path: "/invoices/{id}/payments"
    description: "Client pays cash against cash_due_cents. Moves only the payment_status dimension."
    roles: [ClientReviewer]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects:
      - "amount_paid_cents += amount_cents"
      - "payment_status recomputed: UNPAID / PARTIALLY_PAID / PAID"
      - "if payment_status becomes PAID and the Campaign is WRAP_UP: Campaign -> CLOSED"
      - "increments Invoice.version by 1"

  # --- Test-driving -------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock. Before any call to this endpoint the logical clock reads
      exactly 2026-05-01T00:00:00Z; it NEVER falls back to real wall-clock time. Moving the clock
      forward expires every COUNTERSIGNED SOW whose effective_end is on or before the new time.
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: string, expired_sow_ids: string[] }"
    side_effects: ["every SOW with status == COUNTERSIGNED and effective_end <= now transitions COUNTERSIGNED -> EXPIRED"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty, or X-User-Role is not one of the five declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed caller acted on a resource they do not own (ClientReviewer on another client's resource; a staff role logging time under someone else's staff_id)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The AccountManager approving a TimeEntry is the same StaffMember who logged it."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad enum member, bad type/range, unparseable date, empty allowed_channels, ended_at <= started_at, ended_at on a different UTC date, flight_end < flight_start, period_end <= period_start, or a body FK that points at a resource belonging to a different client."
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id in the path or body does not resolve."
  - id: ERR_RATE_CARD_NOT_FOUND
    http: 404
    condition: "rate_card_id in the path or body does not resolve."
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "staff_id in the path or body does not resolve."
  - id: ERR_RETAINER_NOT_FOUND
    http: 404
    condition: "retainer_id in the path or body does not resolve."
  - id: ERR_SOW_NOT_FOUND
    http: 404
    condition: "sow_id in the path or body does not resolve."
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign_id in the path or body does not resolve."
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "The deliverable {id} in the path does not resolve."
  - id: ERR_TIME_ENTRY_NOT_FOUND
    http: 404
    condition: "The time entry {id} in the path does not resolve."
  - id: ERR_VENDOR_COST_NOT_FOUND
    http: 404
    condition: "The vendor cost {id} in the path does not resolve."
  - id: ERR_MEDIA_PLAN_NOT_FOUND
    http: 404
    condition: "media_plan_id in the path or body does not resolve."
  - id: ERR_MEDIA_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placement_id in the body does not resolve."
  - id: ERR_INSERTION_ORDER_NOT_FOUND
    http: 404
    condition: "The insertion order {id} in the path does not resolve."
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "The invoice {id} in the path does not resolve."
  - id: ERR_STALE_MEDIA_PLAN_VERSION
    http: 412
    condition: "POST /insertion-orders carried an expected_media_plan_version that is not the MediaPlan's current version."
  - id: ERR_STALE_RETAINER_VERSION
    http: 412
    condition: "POST /invoices/{id}/issue carried an expected_retainer_version that is not the Retainer's current version."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity is not in a from-state that section 1.2 declares for the requested transition (includes voiding an invoice with amount_paid_cents > 0 and paying an invoice whose approval_status is not ISSUED)."
  - id: ERR_SOW_NOT_COUNTERSIGNED
    http: 409
    condition: "An operation that requires a signed SOW found SOW.status == DRAFT (POST /campaigns/{id}/launch, POST /time-entries)."
  - id: ERR_SOW_EXPIRED
    http: 409
    condition: "An operation that requires a live SOW found SOW.status == EXPIRED (POST /campaigns/{id}/launch, POST /time-entries), or a countersign was attempted at or past effective_end."
  - id: ERR_CAMPAIGN_ON_HOLD
    http: 409
    condition: "The owning Campaign is ON_HOLD (or, on launch, the owning Client is CREDIT_HOLD), so no time, vendor cost, deliverable review or plan approval may proceed."
  - id: ERR_MEDIA_PLAN_NOT_APPROVED
    http: 409
    condition: "POST /insertion-orders/{id}/place was called while the owning MediaPlan.status != APPROVED."
  - id: ERR_PLACEMENT_NOT_ELIGIBLE
    http: 422
    condition: "The referenced MediaPlacement.channel is not a member of the MediaPlan.allowed_channels array."
  - id: ERR_PLACEMENT_FLIGHT_CONFLICT
    http: 409
    condition: "The new flight's closed date interval, widened by the placement's min_dark_days buffer, collides with an existing RESERVED/PLACED/DELIVERED order on the same placement."
  - id: ERR_TIME_ENTRY_OVERLAP
    http: 409
    condition: "The new half-open [started_at, ended_at) interval overlaps another SUBMITTED/APPROVED/BILLED entry of the same staff member. Touching endpoints do not collide."
  - id: ERR_DAILY_MINUTES_EXCEEDED
    http: 422
    condition: "The staff member's total logged minutes for that UTC date would exceed MAX_DAILY_MINUTES (600). Exactly 600 is accepted."
  - id: ERR_SOW_LABOR_CAP_EXCEEDED
    http: 422
    condition: "SOW.consumed_labor_cents + the new entry's estimated_amount_cents would exceed SOW.labor_cap_cents. Exactly equal is accepted."
  - id: ERR_MEDIA_BUDGET_EXCEEDED
    http: 422
    condition: "The insertion order's gross_cents exceeds MediaPlan.uncommitted_cents. Exactly equal is accepted."
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 422
    condition: "A fourth request-changes was attempted on a Deliverable whose revision_round is already 3 (MAX_REVISION_ROUNDS)."
  - id: ERR_INVOICE_NO_LINES
    http: 422
    condition: "POST /invoices assembled zero lines: no eligible time entries, no eligible vendor costs and zero media gross for the billing_mode and period."
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_paid_cents + amount_cents would exceed Invoice.cash_due_cents."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: AgencyAdmin
    description: "Agency operations/finance. Owns the reference data and the cash: clients, rate cards, staff, placements, retainers, invoice issue/void, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /rate-cards"
      - "PATCH /rate-cards/{id}"
      - "POST /staff-members"
      - "POST /media-placements"
      - "POST /retainers"
      - "POST /retainers/{id}/fund"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /clients/{id}, GET /retainers, GET /retainers/{id}, GET /sows, GET /sows/{id}, GET /campaigns, GET /campaigns/{id}, GET /campaigns/{id}/deliverables, GET /campaigns/{id}/vendor-costs, GET /campaigns/{id}/performance-report, GET /staff-members/{id}/utilization, GET /time-entries, GET /time-entries/{id}, GET /media-plans, GET /media-plans/{id}, GET /insertion-orders, GET /insertion-orders/{id}, GET /invoices, GET /invoices/{id}"

  - name: AccountManager
    description: "Client-facing agency lead. Drafts SOWs and campaigns, launches them, approves other people's time, records and approves vendor costs, and assembles invoices."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /sows"
      - "POST /campaigns"
      - "POST /campaigns/{id}/launch"
      - "POST /time-entries/{id}/approve"
      - "POST /vendor-costs"
      - "POST /vendor-costs/{id}/approve"
      - "POST /invoices"
    shared_operations:
      - "POST /time-entries (own staff_id only)"
      - "all GET endpoints except none"

  - name: CreativeLead
    description: "Creative team lead. Opens deliverables and submits asset cuts for client review."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /deliverables"
      - "POST /deliverables/{id}/submit"
    shared_operations:
      - "POST /time-entries (own staff_id only)"
      - "GET /clients/{id}, GET /sows/{id}, GET /campaigns, GET /campaigns/{id}, GET /campaigns/{id}/deliverables, GET /staff-members/{id}/utilization, GET /time-entries, GET /time-entries/{id}"

  - name: MediaBuyer
    description: "Media planning and buying. Owns media plans and the whole insertion-order lifecycle."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /media-plans"
      - "POST /insertion-orders"
      - "POST /insertion-orders/{id}/place"
      - "POST /insertion-orders/{id}/cancel"
      - "POST /insertion-orders/{id}/deliver"
    shared_operations:
      - "POST /time-entries (own staff_id only)"
      - "GET /clients/{id}, GET /sows/{id}, GET /campaigns, GET /campaigns/{id}, GET /campaigns/{id}/deliverables, GET /campaigns/{id}/vendor-costs, GET /campaigns/{id}/performance-report, GET /staff-members/{id}/utilization, GET /time-entries, GET /time-entries/{id}, GET /media-plans, GET /media-plans/{id}, GET /insertion-orders, GET /insertion-orders/{id}"

  - name: ClientReviewer
    description: "The advertiser's approver. X-User-ID is the Client's id. Countersigns SOWs, signs off media plans, runs the deliverable review loop, and pays invoices."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /sows/{id}/countersign"
      - "POST /media-plans/{id}/approve"
      - "POST /deliverables/{id}/request-changes"
      - "POST /deliverables/{id}/approve"
      - "POST /invoices/{id}/payments"
    shared_operations:
      - "GET /clients/{id}, GET /retainers, GET /retainers/{id}, GET /sows, GET /sows/{id}, GET /campaigns, GET /campaigns/{id}, GET /campaigns/{id}/deliverables, GET /campaigns/{id}/vendor-costs, GET /campaigns/{id}/performance-report, GET /media-plans, GET /media-plans/{id}, GET /insertion-orders, GET /insertion-orders/{id}, GET /invoices, GET /invoices/{id}"
