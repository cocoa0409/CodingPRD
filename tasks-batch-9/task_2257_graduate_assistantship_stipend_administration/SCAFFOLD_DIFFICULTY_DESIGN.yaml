              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /pay-periods"
              payload: { term_id: "${term_id}", sequence_no: 1, period_start: "2026-09-01", period_end_exclusive: "2026-10-01", pay_date: "2026-10-05" }
