              as: ProgramAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "p@x.com", full_name: "P", household_size: 1 }
              as: Anonymous
              captures: { part_id: $.data.id, part_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${part_id}/verify"
              payload: { verification_token: "${part_tok}" }
              as: Anonymous
            - call: "POST /programs/${prog_id}/participants/${part_id}/grants"
              payload: { site_id: "${site_id}", bucket_quota: 5, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { grant_id: $.data.id }
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { sv: $.data.version }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 10.00, contamination_kg: 1.00, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${sv}" }
              as: Participant
              as_user_id: "${part_id}"
              captures: { drop_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/sites/${site_id}/contamination-reports"
              payload: { drop_event_id: "${drop_id}", auditor_id: "aud-1", severity: "MINOR", finding_note: "plastic bag" }
              as: MunicipalAuditor
              captures: { rep_id: $.data.id }
            - call: "GET /programs/${prog_id}/participants/${part_id}"
              payload: {}
              as: ProgramAdmin
              captures: { bal: $.data.bucket_credit_balance }
          assert:
            - "DropEvent.${drop_id}.verification_state == FLAGGED_CONTAMINATED"
            - "DropEvent.${drop_id}.credit_state == UNCREDITED (independent dimension unchanged)"
            - "bal == 0 (no credits granted while flagged)"

      - name: complaint_ticket_cyclic_reopen_loop
        grounds:
          - state_machines.ComplaintTicket
          - entities.ComplaintTicket.fields.reopen_count
        distinguishing_aspect: |
          ComplaintTicket carries a bounded cycle RESOLVED → REOPENED →
          RESOLVED (reopen_count < 2): a non-linear cyclic shape on a different
          entity than DropEvent. The third reopen attempt must fail with
          ERR_COMPLAINT_REOPEN_LIMIT.
        test_recipe:
          setup:
            - "Program ACTIVE; site OPERATIONAL with agreement and material"
            - "Complaint filed; resolve → reopen → resolve → reopen (reopen_count=2)"
