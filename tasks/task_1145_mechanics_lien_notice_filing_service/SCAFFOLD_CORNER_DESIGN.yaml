# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Enumerative walk of references/claim-extraction-guide.md against §1.1–§1.7.
# Corners already exercised by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: company_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Company]
        distinguishing_aspect: "POST /lien/companies returns 201 with prepaid_balance_cents 0, open_notice_count 0, version 1, and server-minted id/created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "Corner Co", contact_email: "cc@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, bal: $.data.prepaid_balance_cents, oncnt: $.data.open_notice_count, ver: $.data.version } }
          trigger: []
          assert:
            - "prepaid_balance_cents == 0 (system default)"
            - "open_notice_count == 0"
            - "version == 1 and id/created_at/updated_at present"

      - name: company_create_missing_required_name_returns_400
        claim_type: required_fields
        grounds: [entities.Company, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field name yields ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /lien/companies", payload: { contact_email: "x@x.com" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: project_creation_initial_state
        claim_type: creation
        grounds: [entities.Project, state_machines.Project]
        distinguishing_aspect: "New project starts UNRESEARCHED with lien_posture CLEAR, zero counts, null furnishing dates, and company_id taken from the caller header."
        test_recipe:
          setup: ["company exists"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "P Co", contact_email: "p@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
          trigger:
            - { call: "POST /lien/projects", payload: { name: "P1", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 1", contract_value_cents: 1000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id, rs: $.data.research_status, posture: $.data.lien_posture, ffd: $.data.first_furnishing_date } }
          assert:
            - "research_status == UNRESEARCHED, lien_posture == CLEAR"
            - "open_notice_count == 0 and open_lien_count == 0"
            - "first_furnishing_date is null and last_furnishing_date is null"
            - "Project.${proj_id}.company_id == ${comp_id}"

      - name: project_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent uuid returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /lien/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: project_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Project.fields.lien_posture, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Client-supplied computed/system fields (lien_posture) are not accepted on create: rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["company exists"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "CI Co", contact_email: "ci@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
          trigger:
            - { call: "POST /lien/projects", payload: { name: "CI", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 2", contract_value_cents: 1000, approved_extras_cents: 0, retainage_held_cents: 0, lien_posture: "ENCUMBERED" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (computed field is not client-settable)"

      - name: fk_reverse_reachability_lists
        claim_type: parent_relationships
        grounds: [entities.Party.fields.project_id, entities.NoticeOrder.fields.recipient_party_id]
        distinguishing_aspect: "Sub-resource GETs resolve children from parent ids: project -> parties returns the created party; party -> notices returns an empty array before any notice exists."
        test_recipe:
          setup: ["company + project + one party"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "FK Co", contact_email: "fk@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
            - { call: "POST /lien/projects", payload: { name: "FK Job", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 3", contract_value_cents: 1000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 Fk Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { party_id: $.data.id } }
          trigger:
            - { call: "GET /lien/projects/${proj_id}/parties", payload: {}, as: OpsAgent, captures: { first_party: "$.data[0].id" } }
            - { call: "GET /lien/parties/${party_id}/notices", payload: {}, as: OpsAgent }
          assert:
            - "GET project parties returns exactly 1 row with id == ${party_id}"
            - "GET party notices returns an empty array with total_count 0"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: research_verify_blocked_by_unverified_parties
        claim_type: precondition_enforcement
        grounds: [state_machines.Project.RESEARCHED_to_VERIFIED, "errors[ERR_PARTIES_UNVERIFIED]"]
        distinguishing_aspect: "RESEARCHED -> VERIFIED is rejected while a required party (OWNER) is still PENDING; succeeds after decide VERIFIED."
        test_recipe:
          setup: ["company, CA rule, project with OWNER party PENDING, project advanced once to RESEARCHED"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "R Co", contact_email: "r@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "R Job", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 4", contract_value_cents: 1000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 R Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 R Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g_l: $.data.id } }
            - { call: "POST /lien/parties/${p_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { rs1: $.data.research_status } }
          trigger:
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { err: $.data.error_id } }
            - { call: "POST /lien/parties/${p_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { rs2: $.data.research_status } }
          assert:
            - "rs1 == RESEARCHED"
            - "Second advance returns ERR_PARTIES_UNVERIFIED while OWNER is PENDING"
            - "After both parties VERIFIED, advance succeeds: research_status == VERIFIED"

      - name: research_advance_on_verified_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Project, "errors[ERR_RESEARCH_ALREADY_VERIFIED]"]
        distinguishing_aspect: "VERIFIED is terminal for research: a third advance returns ERR_RESEARCH_ALREADY_VERIFIED."
        test_recipe:
          setup: ["verified project (no LENDER required: rule prelim_notice_required false; OWNER+GC verified)"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "RV Co", contact_email: "rv@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: false, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "RV Job", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 5", contract_value_cents: 1000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 Rv Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 Rv Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g_l: $.data.id } }
            - { call: "POST /lien/parties/${p_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { rs: $.data.research_status } }
          trigger:
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { err: $.data.error_id } }
          assert:
            - "rs == VERIFIED after two advances"
            - "Third advance returns ERR_RESEARCH_ALREADY_VERIFIED (409)"
      - name: notice_serve_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.NoticeOrder.DRAFT_to_SERVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Served notice cannot be served again: second /serve returns ERR_INVALID_STATE (409) and served_at is unchanged."
        test_recipe:
          setup: ["Verified CA project with ACTIVE span; notice N served on 2026-05-20"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "NS Co", contact_email: "ns@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, comp_v: $.data.version } }
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 1000000, reason: "seed", expected_company_version: "${comp_v}" }, as: PlatformAdmin }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "NS Job", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 6", contract_value_cents: 1000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 Ns Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 Ns Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g_l: $.data.id } }
            - { call: "POST /lien/parties/${p_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { pv: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/notices", payload: { project_id: "${proj_id}", recipient_party_id: "${p_o}", delivery_method: "CERTIFIED_MAIL" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { n_id: $.data.id } }
            - { call: "POST /lien/notices/${n_id}/serve", payload: { served_at: "2026-05-20" }, as: OpsAgent }
          trigger:
            - { call: "POST /lien/notices/${n_id}/serve", payload: { served_at: "2026-05-21" }, as: OpsAgent, captures: { err: $.data.error_id } }
            - { call: "GET /lien/notices/${n_id}", payload: {}, as: OpsAgent, captures: { served: $.data.served_at } }
          assert:
            - "Second serve returns ERR_INVALID_STATE (409)"
            - "served_at remains '2026-05-20' (no mutation from the rejected call)"

      - name: notice_proof_on_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.NoticeOrder, "errors[ERR_NOTICE_NOT_SERVED]"]
        distinguishing_aspect: "Proof can only be recorded on SERVED: /proof on a DRAFT notice returns ERR_NOTICE_NOT_SERVED."
        test_recipe:
          setup: ["Verified CA project with ACTIVE span; notice N in DRAFT"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "NP Co", contact_email: "np@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, comp_v: $.data.version } }
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 1000000, reason: "seed", expected_company_version: "${comp_v}" }, as: PlatformAdmin }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "NP Job", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 7", contract_value_cents: 1000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 Np Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 Np Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g_l: $.data.id } }
            - { call: "POST /lien/parties/${p_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { pv: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/notices", payload: { project_id: "${proj_id}", recipient_party_id: "${p_o}", delivery_method: "CERTIFIED_MAIL" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { n_id: $.data.id } }
          trigger:
            - { call: "POST /lien/notices/${n_id}/proof", payload: { result: "DELIVERED", proof_url: "https://proof/x" }, as: OpsAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOTICE_NOT_SERVED and NoticeOrder.${n_id}.status remains DRAFT"

      - name: notice_clock_expiry_and_terminal_lockdown
        claim_type: valid_transition
        grounds: [state_machines.NoticeOrder.DRAFT_to_EXPIRED]
        distinguishing_aspect: "Pure clock-driven expiry (no rule change): with the clock at 2026-05-23, reading a DRAFT notice whose deadline was 2026-05-22 flips it to EXPIRED, and EXPIRED is terminal — reprepare returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Verified CA project with ACTIVE span (prelim deadline 2026-05-22); notice N in DRAFT; clock advanced to 2026-05-23"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "NE Co", contact_email: "ne@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, comp_v: $.data.version } }
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 1000000, reason: "seed", expected_company_version: "${comp_v}" }, as: PlatformAdmin }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "NE Job", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 8", contract_value_cents: 1000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 Ne Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 Ne Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g_l: $.data.id } }
            - { call: "POST /lien/parties/${p_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { pv: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/notices", payload: { project_id: "${proj_id}", recipient_party_id: "${p_o}", delivery_method: "CERTIFIED_MAIL" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { n_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-23T00:00:00Z" }, as: PlatformAdmin }
