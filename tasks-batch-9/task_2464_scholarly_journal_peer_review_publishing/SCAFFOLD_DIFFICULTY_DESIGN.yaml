              as: ProductionStaff
              captures: { apc_id: $.data.id, apc_total: $.data.total_due_cents }
            - call: "GET /journals/${j_id}"
              as: SystemAdmin
              captures: { j_recv_mid: $.data.apc_receivable_cents }
          trigger:
            - call: "POST /apc-invoices/${apc_id}/settlement"
              payload: { action: "CANCEL", waiver_reason: "Invoice raised against the wrong license" }
              as: ProductionStaff
              captures: { apc_status: $.data.status, apc_settled_at: $.data.settled_at }
            - call: "GET /journals/${j_id}"
              as: SystemAdmin
              captures: { j_recv_after: $.data.apc_receivable_cents, j_waived_after: $.data.apc_waived_cents }
          assert:
            - "Journal.${j_id}.apc_receivable_cents == 0 before the invoice was issued"
            - "APCInvoice.${apc_id}.total_due_cents == 180000"
            - "Journal.${j_id}.apc_receivable_cents == 180000 while the invoice is ISSUED"
            - "APCInvoice.${apc_id}.status == CANCELLED"
            - "APCInvoice.${apc_id}.settled_at == 2026-08-01T00:00:00.000Z"
            - "Journal.${j_id}.apc_receivable_cents == 0 after the cancel (restored to the pre-issue value)"
            - "Journal.${j_id}.apc_waived_cents == 0 (the cancel does not touch the waiver ledger)"
            - "Manuscript.${m_id}.status == SUBMITTED"
