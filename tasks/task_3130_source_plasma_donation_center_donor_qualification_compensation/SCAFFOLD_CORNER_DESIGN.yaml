# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 3130: Source Plasma Donation Center. Breadth walk over §1.1–§1.7 per
# the claim-extraction guide; §1.8-covered corners appear as excluded_because stubs.
scaffold_corner_design:
- section: entities
  instances:
  - name: center_create_success_defaults_and_system_fields
    claim_type: creation
    grounds:
    - entities.PlasmaCenter
    - endpoints.POST /plasma-centers
    distinguishing_aspect: POST /plasma-centers with all required inputs returns 201 with status OPERATIONAL, version 1, and server-minted id/created_at/updated_at.
    test_recipe:
      setup:
      - empty DB; logical clock at default
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          cid: $.data.id
          st: $.data.status
          ver: $.data.version
      assert:
      - HTTP 201; ${st} == OPERATIONAL; ${ver} == 1
      - ${cid} is a server-minted UUID with no type prefix; created_at == updated_at == 2026-09-01T09:00:00.000Z (logical clock, three fractional digits)
  - name: get_nonexistent_center_returns_not_found
    claim_type: not_found
    grounds:
    - entities.PlasmaCenter
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but unknown center UUID resolves to ERR_NOT_FOUND (404), never a 500 or empty object.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /plasma-centers/00000000-0000-0000-0000-000000000000
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_NOT_FOUND and HTTP status 404
  - name: donor_create_missing_required_field_returns_400
    claim_type: required_fields
    grounds:
    - entities.Donor.fields.external_donor_ref
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting external_donor_ref (input field, no default) is rejected ERR_INVALID_REQUEST (400); no Donor row is created.
    test_recipe:
      setup:
      - center exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      trigger:
      - call: POST /donors
        payload:
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c}
        as: Recorder
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST and HTTP status 400
      - GET /donors returns total_count == 0
  - name: duplicate_external_donor_ref_across_centers_rejected
    claim_type: type_constraints
    grounds:
    - entities.Donor.fields.external_donor_ref
    - errors[ERR_DUPLICATE_DONOR]
    distinguishing_aspect: 'external_donor_ref uniqueness is GLOBAL across centers: registering the same ref at a different home center returns ERR_DUPLICATE_DONOR (409).'
    test_recipe:
      setup:
      - centers c1 and c2; donor with ref DL-TX-000001 registered at c1
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c1: $.data.id
      - call: POST /plasma-centers
        payload:
          center_code: CSL-FTW-002
          legal_name: CSL Plasma Fort Worth 002
          state_code: TX
          screening_lanes: 1
          donor_floor_beds: 1
          observation_chairs: 1
        as: PlatformAdmin
        captures:
          c2: $.data.id
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c1}
        as: Recorder
      trigger:
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c2}
        as: Recorder
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_DUPLICATE_DONOR and HTTP status 409
  - name: underage_donor_registration_rejected
    claim_type: type_constraints
    grounds:
    - entities.Donor.fields.date_of_birth
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: date_of_birth that makes the donor younger than 18 at registration (2010-01-01 with clock at 2026-09-01) is rejected ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - center exists; clock 2026-09-01
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      trigger:
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000009
          legal_first_name: Kid
          legal_last_name: Young
          date_of_birth: '2010-01-01'
          weight_kg: 72.5
          home_center_id: ${c}
        as: Recorder
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST and HTTP status 400
  - name: donor_create_computed_field_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.Donor.fields.ytd_compensation_cents
    - entities.Donor.fields.lifetime_donation_count
    distinguishing_aspect: 'Client-supplied ytd_compensation_cents / lifetime_donation_count / donor_status values in the create payload are ignored: the response shows the system-initialized values.'
    test_recipe:
      setup:
      - center exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      trigger:
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c}
          ytd_compensation_cents: 999999
          lifetime_donation_count: 42
          donor_status: QUALIFIED
        as: Recorder
        captures:
          ytd: $.data.ytd_compensation_cents
          cnt: $.data.lifetime_donation_count
          st: $.data.donor_status
      assert:
      - 'HTTP 201 and inputs ignored: ${ytd} == 0, ${cnt} == 0, ${st} == APPLICANT'
  - name: schedule_create_defaults_promo_fields
    claim_type: defaults
    grounds:
    - entities.CompensationSchedule.fields.promo_code
    - entities.CompensationSchedule.fields.promo_bonus_cents
    - entities.CompensationSchedule.fields.promo_qualifying_donation_count
    distinguishing_aspect: Omitting the three optional promo fields yields promo_code null, promo_bonus_cents 0, promo_qualifying_donation_count 0, schedule_status ACTIVE, version 1.
    test_recipe:
      setup:
      - center exists (version 1)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
          cv: $.data.version
      trigger:
      - call: POST /plasma-centers/${c}/compensation-schedules
        payload:
          effective_from: '2026-08-01T00:00:00Z'
          effective_to: '2026-12-01T00:00:00Z'
          base_cents_first_donation: 3000
          base_cents_second_donation: 2500
          base_cents_subsequent_donation: 2000
          expected_center_version: ${cv}
        as: PlatformAdmin
        captures:
          pc: $.data.promo_code
          pb: $.data.promo_bonus_cents
          pq: $.data.promo_qualifying_donation_count
          ss: $.data.schedule_status
          sv: $.data.version
      assert:
      - ${pc} == null, ${pb} == 0, ${pq} == 0, ${ss} == ACTIVE, ${sv} == 1
  - name: duplicate_sub_record_type_rejected
    claim_type: type_constraints
    grounds:
    - entities.ScreeningSubRecord.fields.record_type
    - errors[ERR_DUPLICATE_SUB_RECORD]
    distinguishing_aspect: 'At most one ScreeningSubRecord per (screening_visit_id, record_type): a second IDENTITY post on the same visit returns ERR_DUPLICATE_SUB_RECORD (409).'
    test_recipe:
      setup:
      - center; donor; screening s1 IN_PROGRESS with IDENTITY already recorded
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c}
        as: Recorder
        captures:
          d: $.data.id
      - call: POST /donors/${d}/screening-visits
        payload:
          center_id: ${c}
          scheduled_for: '2026-09-01T08:00:00Z'
        as: Recorder
        captures:
          s1: $.data.id
      - call: POST /screening-visits/${s1}/sub-records
        payload:
          record_type: IDENTITY
          payload:
            document_number: TXDL-883491
        as: Recorder
        as_user_id: rec-01
      trigger:
      - call: POST /screening-visits/${s1}/sub-records
        payload:
          record_type: IDENTITY
          payload:
            document_number: TXDL-OTHER1
        as: Recorder
        as_user_id: rec-01
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_DUPLICATE_SUB_RECORD and HTTP status 409
  - name: physical_exam_out_of_band_vital_fails_visit
    claim_type: computed_fields
    grounds:
    - entities.ScreeningSubRecord.fields.outcome
    - state_machines.ScreeningVisit.IN_PROGRESS_to_FAILED
    distinguishing_aspect: 'outcome is computed at write time from per-record-type band rules: pulse_bpm 120 (> 100) makes the PHYSICAL_EXAM outcome FAIL and auto-flips the visit to FAILED.'
    test_recipe:
      setup:
      - center; donor; screening s1 SCHEDULED at 08:00, clock 09:00
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c}
        as: Recorder
        captures:
          d: $.data.id
      - call: POST /donors/${d}/screening-visits
        payload:
          center_id: ${c}
          scheduled_for: '2026-09-01T08:00:00Z'
        as: Recorder
        captures:
          s1: $.data.id
      trigger:
      - call: POST /screening-visits/${s1}/sub-records
        payload:
          record_type: PHYSICAL_EXAM
          payload:
            weight_kg: 72.5
            pulse_bpm: 120
            systolic_mmhg: 118
            diastolic_mmhg: 76
            temperature_c: 36.7
            hematocrit_pct: 43.0
            total_protein_g_dl: 7.2
        as: Recorder
        as_user_id: rec-01
        captures:
          oc: $.data.outcome
      - call: GET /screening-visits/${s1}
        as: PlatformAdmin
        captures:
          vst: $.data.visit_status
      assert:
      - ${oc} == FAIL (pulse_bpm 120 exceeds the 50..100 band)
      - 'auto-transition fired: ${vst} == FAILED'
  - name: underweight_physical_exam_rejected_422
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DONOR_UNDERWEIGHT]
    - entities.ScreeningSubRecord.fields.payload
    distinguishing_aspect: weight_kg 49.9 (< 50.0 floor) in a PHYSICAL_EXAM payload is rejected outright with ERR_DONOR_UNDERWEIGHT (422) — the donor cannot even be failed into the pipeline with an underweight exam.
    test_recipe:
      setup:
      - center; donor registered with weight_kg 49.9; screening SCHEDULED
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 49.9
          home_center_id: ${c}
        as: Recorder
        captures:
          d: $.data.id
      - call: POST /donors/${d}/screening-visits
        payload:
          center_id: ${c}
          scheduled_for: '2026-09-01T08:00:00Z'
        as: Recorder
        captures:
          s1: $.data.id
      trigger:
      - call: POST /screening-visits/${s1}/sub-records
        payload:
          record_type: PHYSICAL_EXAM
          payload:
            weight_kg: 49.9
            pulse_bpm: 72
            systolic_mmhg: 118
            diastolic_mmhg: 76
            temperature_c: 36.7
            hematocrit_pct: 43.0
            total_protein_g_dl: 7.2
        as: Recorder
        as_user_id: rec-01
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_DONOR_UNDERWEIGHT and HTTP status 422
  - name: sub_record_on_terminal_visit_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.ScreeningVisit
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'A ScreeningVisit already FAILED (health-history risk flag) accepts no further sub-records: the next POST returns ERR_INVALID_STATE (409).'
    test_recipe:
      setup:
      - center; donor; screening FAILED via HEALTH_HISTORY risk_flags non-empty
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c}
        as: Recorder
        captures:
          d: $.data.id
      - call: POST /donors/${d}/screening-visits
        payload:
          center_id: ${c}
          scheduled_for: '2026-09-01T08:00:00Z'
        as: Recorder
        captures:
          s1: $.data.id
      - call: POST /screening-visits/${s1}/sub-records
        payload:
          record_type: HEALTH_HISTORY
          payload:
            risk_flags:
            - TRAVEL_MALARIA
        as: Recorder
        as_user_id: rec-01
      trigger:
      - call: POST /screening-visits/${s1}/sub-records
        payload:
          record_type: IDENTITY
          payload:
            document_number: TXDL-883491
        as: Recorder
        as_user_id: rec-01
        captures:
          err: $.data.error_id
      assert:
      - 'HEALTH_HISTORY with non-empty risk_flags FAILED the visit; further writes rejected: ${err} == ERR_INVALID_STATE and HTTP status 409'
  - name: donor_list_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints.GET /donors
    distinguishing_aspect: GET /donors?limit=1&offset=0 with two registered donors returns exactly 1 row and pagination fields total_count == 2, has_more == true; offset=1 returns the second row with has_more == false.
    test_recipe:
      setup:
      - center; two donors registered
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c}
        as: Recorder
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000002
          legal_first_name: John
          legal_last_name: Roe
          date_of_birth: '1985-05-05'
          weight_kg: 80.0
          home_center_id: ${c}
        as: Recorder
      trigger:
      - call: GET /donors
        payload:
          limit: 1
          offset: 0
        as: PlatformAdmin
      assert:
      - 'page 1: data length == 1, total_count == 2, has_more == true, limit == 1, offset == 0'
      - 'page 2 (limit=1, offset=1): data length == 1, has_more == false, and the two pages carry disjoint donor ids'
- section: state_machines
  instances:
  - name: screening_initial_state_and_auto_in_progress
    claim_type: initial_state
    grounds:
    - state_machines.ScreeningVisit.SCHEDULED_to_IN_PROGRESS
    distinguishing_aspect: A created ScreeningVisit starts SCHEDULED with all four sub-record flags false; the FIRST sub-record write flips it to IN_PROGRESS (system transition) and sets the matching flag.
    test_recipe:
      setup:
      - center; donor; screening s1 created at clock 09:00 (scheduled 08:00)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c}
        as: Recorder
        captures:
          d: $.data.id
      - call: POST /donors/${d}/screening-visits
        payload:
          center_id: ${c}
          scheduled_for: '2026-09-01T08:00:00Z'
        as: Recorder
        captures:
          s1: $.data.id
          st0: $.data.visit_status
          iv0: $.data.identity_verified
      trigger:
      - call: POST /screening-visits/${s1}/sub-records
        payload:
          record_type: IDENTITY
          payload:
            document_number: TXDL-883491
        as: Recorder
        as_user_id: rec-01
      - call: GET /screening-visits/${s1}
        as: PlatformAdmin
        captures:
          st1: $.data.visit_status
          iv1: $.data.identity_verified
          hh1: $.data.health_history_recorded
      assert:
      - 'initial: ${st0} == SCHEDULED and ${iv0} == false'
      - 'after first sub-record: ${st1} == IN_PROGRESS, ${iv1} == true, untouched flags stay false (${hh1} == false)'
  - name: screening_clear_happy_path
    claim_type: valid_transition
    grounds:
    - state_machines.ScreeningVisit.IN_PROGRESS_to_CLEARED
    distinguishing_aspect: All four PASS sub-records + clearing screener id different from every recorded_by_user_id -> CLEARED and visit.version incremented.
    test_recipe:
      setup:
      - center; donor; screening with all four PASS sub-records recorded by rec-01
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T09:00:00Z'
        as: PlatformAdmin
      - call: POST /plasma-centers
        payload:
          center_code: CSL-DAL-014
          legal_name: CSL Plasma Dallas 014
          state_code: TX
          screening_lanes: 2
          donor_floor_beds: 2
          observation_chairs: 2
        as: PlatformAdmin
        captures:
          c: $.data.id
      - call: POST /donors
        payload:
          external_donor_ref: DL-TX-000001
          legal_first_name: Jane
          legal_last_name: Doe
          date_of_birth: '1990-04-12'
          weight_kg: 72.5
          home_center_id: ${c}
        as: Recorder
        captures:
          d: $.data.id
      - call: POST /donors/${d}/screening-visits
        payload:
          center_id: ${c}
          scheduled_for: '2026-09-01T08:00:00Z'
        as: Recorder
        captures:
          s1: $.data.id
          v0: $.data.version
