            - call: "POST /assignments/${as1}/respond"
              payload: { outcome: "ACCEPT" }
              as: Subcontractor
              as_user_id: "${sf}"
            - call: "GET /subcontractors/${sf}"
              as: Dispatcher
              captures: { c1: $.data.active_assignment_count }
            - call: "POST /assignments/${as1}/withdraw"
              payload: {}
              as: Dispatcher
            - call: "GET /subcontractors/${sf}"
              as: Dispatcher
              captures: { c2: $.data.active_assignment_count }
          assert:
            - "c0 == 0 (baseline; the OFFERED offer does not consume capacity)"
            - "c1 == 1 after the forward ACCEPT"
            - "c2 == 0 after the compensating withdraw — invariant restored exactly"
            - "Assignment[${as1}].status == CANCELLED"
            - "Job[${j}].work_status == INTAKE (withdrawn subcontractor excluded; pool empty)"

      - name: material_total_add_void_restores
        grounds:
          - entities.Job.fields.total_planned_sheets
          - state_machines.ScopeItem.PLANNED_to_VOIDED
          - concurrency_rules[scope-add-stale-job]
        distinguishing_aspect: |
          Conserved quantity = planned material on the job: total_planned_sheets = sum of
          planned_qty over BOARD items in {PLANNED, INSTALLED}. Adding a scope item (+2)
          paired with the compensating void MUST return the aggregate to its prior value
          (0 -> 2 -> 0) with no drift — a different conserved quantity than crew slots.
        test_recipe:
          setup:
            - "Job P3 in INTAKE (SEA, property wind LOW); no scope items yet"
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m1}", address_line: "1 Pine St", wind_zone: "LOW" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "STORM", priority: "P3" }
              as: Dispatcher
              captures: { j: $.data.id, t0: $.data.total_planned_sheets, jv1: $.data.version }
          trigger:
            - call: "POST /jobs/${j}/scope-items"
              payload: { kind: "BOARD", opening_count: 4, width_in: 48, height_in: 36, door_count: 0, expected_job_version: "${jv1}" }
              as: Dispatcher
              captures: { si: $.data.id }
            - call: "GET /jobs/${j}"
              as: Dispatcher
              captures: { t1: $.data.total_planned_sheets }
            - call: "POST /scope-items/${si}/void"
              payload: {}
              as: Dispatcher
            - call: "GET /jobs/${j}"
              as: Dispatcher
              captures: { t2: $.data.total_planned_sheets }
          assert:
            - "t0 == 0 (baseline)"
            - "t1 == 2 after the forward add (4 openings of 12 sqft = 48 sqft -> ceil(48/32) = 2 sheets)"
            - "t2 == 0 after the compensating void — invariant restored exactly"
            - "ScopeItem[${si}].status == VOIDED"
