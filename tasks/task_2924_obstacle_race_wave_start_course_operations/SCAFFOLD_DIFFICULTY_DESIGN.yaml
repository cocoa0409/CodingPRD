          setup:
            - "The vacate cascade of the transitive_cascade instance is already applied: PUBLISHED course, roster LOCKED, station 3 UNSTAFFED, readiness_posture RESTRICTED, bottleneck_capacity_pph 0."
            - "Wave A1 (capacity 112) therefore sits at release_status HELD with hold_reason COURSE_RESTRICTED and roster_status LOCKED."
