# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CaptiveManager
    description: "Manages captive lifecycle, filings, collateral, operating units, and governance"
    identity: opaque
    exclusive_operations:
      - "POST /captives — Create captive"
      - "POST /captives/{id}/activate — Activate captive"
      - "POST /captives/{id}/dissolve — Dissolve captive"
      - "POST .../domicile-filings — Create filing"
      - "POST .../domicile-filings/{id}/submit — Submit filing"
      - "POST .../domicile-filings/{id}/withdraw — Withdraw filing"
      - "POST .../fronting/{id}/post-collateral — Post collateral"
      - "POST .../collateral — Create collateral posting"
      - "POST .../collateral/{id}/verify — Verify collateral"
      - "POST /captives/{id}/operating-units — Create operating unit"
      - "POST .../allocations/{id}/dispute — Dispute allocation"
      - "POST .../allocations/{id}/resolve-dispute — Resolve dispute"
      - "POST .../claims/{id}/tpa — Assign TPA"
      - "POST .../tpa/{id}/suspend — Suspend TPA"
      - "POST .../tpa/{id}/reinstate — Reinstate TPA"
      - "POST .../tpa/{id}/terminate — Terminate TPA"
      - "POST .../reserves/{id}/file — File reserve"
      - "POST /captives/{id}/annual-statements — Create statement"
      - "POST .../statements/{id}/submit-for-review — Submit for review"
      - "POST .../statements/{id}/file — File statement"
      - "POST .../statements/{id}/amend — Amend statement"
      - "POST .../board-meetings/{id}/file — File meeting minutes"
      - "POST .../tax-positions/{id}/file — File tax position"
      - "POST /_clock/set_current_utc — Set logical clock"
    shared_operations:
      - "GET /captives — List captives"
      - "GET /captives/{id} — Get captive"
      - "GET .../domicile-filings — List filings"
      - "GET .../programs — List programs"
      - "GET .../claims — List claims"
      - "GET .../allocations — List allocations"
      - "GET .../reserves — List reserves"
      - "GET .../annual-statements — List statements"
      - "GET .../board-meetings — List meetings"
      - "GET .../tax-positions — List tax positions"
      - "GET .../audit-logs — List audit logs"

  - name: DomicileRegulator
    description: "Regulatory authority for domicile jurisdiction; approves filings and oversees solvency"
    identity: opaque
    exclusive_operations:
      - "POST .../domicile-filings/{id}/acknowledge — Acknowledge filing"
      - "POST .../domicile-filings/{id}/approve — Approve filing"
      - "POST .../domicile-filings/{id}/reject — Reject filing"
      - "POST /captives/{id}/suspend — Suspend captive"
      - "POST /captives/{id}/reinstate — Reinstate captive"
    shared_operations:
      - "GET /captives — List captives"
      - "GET /captives/{id} — Get captive"
      - "GET .../domicile-filings — List filings"
      - "GET .../audit-logs — List audit logs"

  - name: Underwriter
    description: "Designs insurance programs, manages fronting arrangements, and premium allocations"
    identity: opaque
    exclusive_operations:
      - "POST /captives/{id}/programs — Create program"
      - "POST .../programs/{id}/quote — Quote program"
      - "POST .../programs/{id}/bind — Bind program"
      - "POST .../programs/{id}/activate — Activate program"
      - "POST .../programs/{id}/enter-runoff — Enter run-off"
      - "POST .../programs/{id}/close — Close program"
      - "POST .../programs/{id}/cancel — Cancel program"
      - "POST .../fronting — Create fronting arrangement"
      - "POST .../fronting/{id}/agree-terms — Agree terms"
      - "POST .../fronting/{id}/activate — Activate fronting"
      - "POST .../fronting/{id}/terminate — Terminate fronting"
      - "POST .../allocations — Create premium allocation"
      - "POST .../allocations/{id}/cancel — Cancel allocation"
    shared_operations:
      - "GET /captives — List captives"
      - "GET /captives/{id} — Get captive"
      - "GET .../programs — List programs"
      - "GET .../fronting — List fronting arrangements"
      - "GET .../collateral — List collateral"
      - "GET .../operating-units — List operating units"
      - "GET .../allocations — List allocations"
      - "GET .../claims — List claims"
      - "GET .../reserves — List reserves"

  - name: Actuary
    description: "Performs actuarial analysis, sets reserves, and certifies reserve adequacy"
    identity: opaque
    exclusive_operations:
      - "POST .../claims/{id}/set-reserve — Set claim reserve"
      - "POST .../allocations/{id}/audit — Audit allocation"
      - "POST .../allocations/{id}/finalize — Finalize allocation"
      - "POST .../reserves — Create actuarial reserve"
      - "POST .../reserves/{id}/review — Review reserve"
      - "POST .../reserves/{id}/certify — Certify reserve"
    shared_operations:
      - "GET /captives — List captives"
      - "GET /captives/{id} — Get captive"
      - "GET .../programs — List programs"
      - "GET .../operating-units — List operating units"
      - "GET .../allocations — List allocations"
      - "GET .../claims — List claims"
      - "GET .../reserves — List reserves"
      - "GET .../annual-statements — List statements"

  - name: ClaimsAdjuster
    description: "Handles claims processing, investigation, and settlement"
    identity: opaque
    exclusive_operations:
      - "POST .../claims — Report claim"
      - "POST .../claims/{id}/acknowledge — Acknowledge claim"
      - "POST .../claims/{id}/investigate — Investigate claim"
      - "POST .../claims/{id}/settle — Settle claim"
      - "POST .../claims/{id}/deny — Deny claim"
      - "POST .../claims/{id}/close-without-payment — Close claim"
    shared_operations:
      - "GET /captives — List captives"
      - "GET /captives/{id} — Get captive"
      - "GET .../programs — List programs"
      - "GET .../claims — List claims"
      - "GET .../tpa — List TPA assignments"

  - name: BoardDirector
    description: "Board governance, meeting management, and annual statement approval"
    identity: opaque
    exclusive_operations:
      - "POST /captives/{id}/board-meetings — Schedule meeting"
      - "POST .../board-meetings/{id}/convene — Convene meeting"
      - "POST .../board-meetings/{id}/draft-minutes — Draft minutes"
      - "POST .../board-meetings/{id}/approve-minutes — Approve minutes"
      - "POST .../board-meetings/{id}/cancel — Cancel meeting"
      - "POST .../statements/{id}/board-approve — Board approve statement"
    shared_operations:
      - "GET /captives — List captives"
      - "GET /captives/{id} — Get captive"
      - "GET .../annual-statements — List statements"
      - "GET .../board-meetings — List meetings"

  - name: TaxAdvisor
    description: "Analyzes tax positions, risk distribution, and issues opinions"
    identity: opaque
    exclusive_operations:
      - "POST /captives/{id}/tax-positions — Create tax position"
      - "POST .../tax-positions/{id}/analyze — Analyze position"
      - "POST .../tax-positions/{id}/issue-opinion — Issue opinion"
      - "POST .../tax-positions/{id}/challenge — Challenge position"
    shared_operations:
      - "GET /captives — List captives"
      - "GET /captives/{id} — Get captive"
      - "GET .../tax-positions — List tax positions"

