    side_effects: ["VenueSlot → RELEASED"]
  - method: POST
    path: "/showcases/{showcaseId}/cancel"
    description: "PLANNED/SCHEDULED → CANCELLED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: ShowcaseEvent
    side_effects: ["VenueSlot → RELEASED if was RESERVED"]

