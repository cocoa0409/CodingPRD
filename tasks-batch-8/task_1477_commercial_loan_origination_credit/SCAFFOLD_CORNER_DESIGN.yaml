            - "commitment-letters?loan_application_id: length 1 (${letter}); letter mirrors sheet: committed_amount_cents == 200000000, rate_bps == 650, term_months == 60, origination_fee_cents == 1750000"
            - "application -> document-checklist-items: length 2 (${doc1}, ${cc1}); both created without is_required/severity show defaults is_required == true, severity == STANDARD"
            - "application -> covenants: length 1 (${cov}, MONITORING); application -> participations: length 1 (${p1}, PROPOSED); application -> funding-authorizations: length 1 (${fa}, REQUESTED)"
            - "financial-statements?loan_application_id=${app}: length 1 (${stmt}, FINAL)"

      - name: financial_statement_list_filters
        claim_type: parent_relationships
        grounds: ["endpoints.GET /credit/financial-statements", entities.FinancialStatement.fields.restatement_of_id]
        distinguishing_aspect: "Both FK filters on the statement list work: loan_application_id returns both an original and its restatement, while restatement_of_id selects exactly the restatement row that supersedes its target."
        test_recipe:
          setup:
            - "Application in EXCEPTION_REVIEW (Beacon shape: revenue 20,000,000; ebitda 11,000,000; addbacks 3,000,000; distributions 800,000; capex 450,000; existing ds 2,500,000; assets 80,000,000; liabilities 40,000,000; requested 30,000,000/60; stress exception OPEN)"
            - "Restatement S2 of S1 (same period 2025-12-31; ebitda 15,000,000, addbacks 0) created, spread and finalized — S1 now SUPERSEDED"
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
