  - name: lot_release_blocked_from_quarantined_state
    claim_type: invalid_transitions
    grounds:
    - state_machines.ProductionLot
    - errors[ERR_LOT_STATE_INVALID]
    excluded_because:
      difficulty_instance: release_state_error_outranks_joint_safety_error
      rationale: That §1.8 priority_pair_validation_conflict instance already fires the release trigger on a QUARANTINED lot and asserts ERR_LOT_STATE_INVALID with the lot unchanged, so a separate invalid-transition
        corner would repeat the same call sequence.
  - name: product_design_and_market_dimensions_move_independently
    claim_type: valid_transition
    grounds:
    - state_machines.Product
    - complexity_profile.state_machine_shape
    excluded_because:
      difficulty_instance: product_market_transition_leaves_design_dimension_untouched
      rationale: The parallel-dimension claim is the entire point of that §1.8 non_linear_state_machine instance, which asserts both dimensions before and after a market-status move.
- section: calculations
  instances:
  - name: risk_score_excludes_reported_and_not_substantiated_incidents
    claim_type: input_set_filtering
    grounds:
    - calculations.design_risk_score
    - state_machines.FieldIncident
    distinguishing_aspect: 'Only incidents that reached UNDER_INVESTIGATION or later with a substantiated finding contribute: a still-REPORTED incident and a NOT_SUBSTANTIATED one are both excluded, so
      a single MINOR/SLIP_FALL incident leaves gross at exactly 6.00.'
    test_recipe:
      setup:
      - 'Product FG-EXT-24-IA exists with three incidents: FI-1 still REPORTED (HOSPITALIZATION / RAIL_FRACTURE, 36.00 points), FI-2 UNDER_INVESTIGATION (MINOR / SLIP_FALL, 6.00 points) and FI-3 UNDER_INVESTIGATION
        (FATALITY / RAIL_FRACTURE, 90.00 points) about to be resolved as NOT_SUBSTANTIATED.'
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: SystemOperator
      - call: POST /ladder-ops/products
        payload:
          model_code: FG-EXT-24-IA
          product_type: EXTENSION_LADDER
          material: FIBERGLASS_PULTRUSION
          duty_rating: TYPE_IA
          working_length_ft: 24.0
          retail_sku: SKU-FG24IA
        as: DesignEngineer
        as_user_id: eng-1
        captures:
          p1: $.data.id
          p1v: $.data.version
      - call: POST /ladder-ops/field-incidents
        payload:
          product_id: ${p1}
          incident_type: RAIL_FRACTURE
          injury_severity: HOSPITALIZATION
          occurred_at: '2026-07-10T00:00:00Z'
          narrative: Reported only; no investigation opened yet.
        as: SafetyDirector
        as_user_id: safety-1
        captures:
          fi1: $.data.id
      - call: POST /ladder-ops/field-incidents
        payload:
          product_id: ${p1}
          incident_type: SLIP_FALL
          injury_severity: MINOR
          occurred_at: '2026-07-12T00:00:00Z'
          narrative: Minor slip during descent.
        as: SafetyDirector
        as_user_id: safety-1
        captures:
          fi2: $.data.id
      - call: POST /ladder-ops/field-incidents/${fi2}/investigate
        payload: {}
        as: SafetyDirector
        as_user_id: safety-1
      - call: POST /ladder-ops/field-incidents
        payload:
          product_id: ${p1}
          incident_type: RAIL_FRACTURE
          injury_severity: FATALITY
          occurred_at: '2026-07-14T00:00:00Z'
          narrative: Claim later found unrelated to the product.
        as: SafetyDirector
        as_user_id: safety-1
        captures:
          fi3: $.data.id
      - call: POST /ladder-ops/field-incidents/${fi3}/investigate
        payload: {}
        as: SafetyDirector
        as_user_id: safety-1
      trigger:
      - call: POST /ladder-ops/field-incidents/${fi3}/resolve-investigation
        payload:
          finding: NOT_SUBSTANTIATED
        as: SafetyDirector
        as_user_id: safety-1
      assert:
      - HTTP status == 200
      - FieldIncident.${fi3}.status == NOT_SUBSTANTIATED and FieldIncident.${fi3}.finding == NOT_SUBSTANTIATED
      - FieldIncident.${fi3}.requires_capa == false
      - FieldIncident.${fi1}.status == REPORTED
      - Product.${p1}.risk_score_gross == 6.00
      - Product.${p1}.risk_score_mitigated == 6.00
      - the 30 x 3.0 = 90.00 points of the NOT_SUBSTANTIATED incident are absent from both scores
      - the 12 x 3.0 = 36.00 points of the still-REPORTED incident are absent from both scores
  - name: recall_exposure_excludes_scrapped_lot_from_both_bases
