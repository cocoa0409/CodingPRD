# =============================================================================
# 1.8 SCAFFOLD DIFFICULTY DESIGN — draft-line-service-ops (task_2541)
#
# Nine §0.5 difficulty rules, 21 instances total. Every numeric literal in an
# `assert:` was produced by executing the matching `calculations[].formula`
# from SCAFFOLD.yaml against the pinned `setup_api_calls` inputs — none are
# estimates. Every `${var}` is bound by a `captures:` block earlier in the same
# instance. Every `expected_*_version` payload value is a `${var}`.
#
# Clock discipline: the logical clock starts at 2026-08-01T00:00:00Z
# (complexity_profile.logical_clock.startup_default_utc) and every instance
# that depends on elapsed time sets it explicitly via
# POST /draft-service/_clock/set_current_utc.
#
#   dual_variant_calc                 2 instances
#   combinatorial_formula             3 instances (modes a, b, c)
#   non_linear_state_machine          2 instances
#   transitive_cascade                2 instances
#   priority_pair_validation_conflict 3 instances
#   boundary_precision_check          3 instances
#   cross_entity_state_dependency     2 instances
#   resource_temporal_overlap         2 instances
#   compensating_invariant            2 instances
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # Two structurally different domains: service revenue in integer cents
  # (visit_charge_settlement) and beer volume in liters (yield_loss_estimate).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_charge_provisional_bills_every_serviced_line_settled_bills_only_pass_lines
        grounds:
          - calculations.visit_charge_settlement
          - calculations.chemical_cycle_dosing
          - state_machines.ServiceVisit.work_status.IN_PROGRESS_to_WORK_COMPLETE
          - state_machines.ServiceVisit.verification_status.UNVERIFIED_to_SIGNED
          - entities.ServiceVisit.fields.provisional_charge_cents
          - entities.ServiceVisit.fields.settled_charge_cents
          - entities.ServiceContract.fields.frequency_multiplier
        distinguishing_aspect: |
          Money domain (integer cents on ServiceVisit): the same three POSTED
          cleaning cycles yield provisional_charge_cents 24474 at complete-work
          and settled_charge_cents 19881 at signature, because the provisional
          variant's inclusion set is serviced_line_count 3 while the settled
          variant's is passed_line_count 2 — a 4593-cent divergence that is
          exactly one per_line_amount_cents.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z."
            - "ServiceAccount 'Harbor Taproom' ACTIVE, access window 480-1080, no glycol system, billing_mode DIRECT_BILL."
            - "ServiceContract ACTIVE: cleaning_frequency_days 21 (frequency_multiplier 1.10), contracted_line_count 4, per_line_rate_cents 4175, visit_base_fee_cents 7500, no brewer_program_id (funding_status NONE)."
            - "Three BeerLine rows IN_SERVICE: #1 32ft/4ft/0.375in ALE, #2 32ft/4ft/0.375in LAGER, #3 15ft/3ft/0.375in ALE."
            - "Technician 'Dana Ruiz' MASTER, caustic_certified true, ACTIVE."
            - "ServiceVisit ROUTINE_CLEANING on 2026-08-05 540-660, work_status IN_PROGRESS."
            - "ChemicalLot C-1001 CAUSTIC AVAILABLE, concentration_pct_stock 45.0, liters_remaining 20.0, expires_on 2026-12-31."
            - "Three POSTED CleaningCycle rows: lines #1 and #2 graded PASS, line #3 graded FAIL_CONTACT_TIME (so line #3 is OUT_OF_SERVICE; 1 of 4 contracted lines out does NOT suspend the account)."
            - "One ComponentInspection with action_taken REPLACED consuming FAUCET-88 at 3195 cents."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Harbor Taproom", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id }
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 2, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "LAGER", average_daily_throughput_liters: 10.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line2: $.data.id }
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 3, run_length_feet: 15, vertical_rise_feet: 3, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 8.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line3: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/parts"
              payload: { sku: "FAUCET-88", component_type: "FAUCET", unit_price_cents: 3195, stock_on_hand: 5, brewer_funded_eligible: true }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { faucet_part: $.data.id }
            - call: "POST /draft-service/chemical-lots"
              payload: { chemical_type: "CAUSTIC", lot_code: "C-1001", concentration_pct_stock: 45.0, liters_initial: 20.0, expires_on: "2026-12-31" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lot_caustic: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/service-visits/${visit}/start"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
            - call: "POST /draft-service/cleaning-cycles"
              payload: { visit_id: "${visit}", line_id: "${line1}", chemical_lot_id: "${lot_caustic}", chemical_type: "CAUSTIC", contact_minutes: 20, recirculation_temp_f: 96.0, concentrate_liters_used: 0.31 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { cyc1: $.data.id }
            - call: "POST /draft-service/cleaning-cycles"
              payload: { visit_id: "${visit}", line_id: "${line2}", chemical_lot_id: "${lot_caustic}", chemical_type: "CAUSTIC", contact_minutes: 20, recirculation_temp_f: 96.0, concentrate_liters_used: 0.31 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { cyc2: $.data.id }
            - call: "POST /draft-service/cleaning-cycles"
              payload: { visit_id: "${visit}", line_id: "${line3}", chemical_lot_id: "${lot_caustic}", chemical_type: "CAUSTIC", contact_minutes: 14, recirculation_temp_f: 96.0, concentrate_liters_used: 0.18 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { cyc3: $.data.id, cyc3_result: $.data.compliance_result }
            - call: "POST /draft-service/component-inspections"
              payload: { visit_id: "${visit}", line_id: "${line1}", component_type: "FAUCET", condition_grade: "WORN", action_taken: "REPLACED", part_sku_id: "${faucet_part}" }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { insp1: $.data.id }
          trigger:
            - call: "POST /draft-service/service-visits/${visit}/complete-work"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { prov: $.data.provisional_charge_cents }
            - call: "POST /draft-service/service-visits/${visit}/verification"
              payload: { decision: "SIGN", signer_name: "Priya N." }
              as: VenueManager
              as_user_id: "${acct}"
              captures: { settled: $.data.settled_charge_cents }
          assert:
            - "CleaningCycle.${cyc3}.compliance_result == FAIL_CONTACT_TIME"
            - "CleaningCycle.${cyc3}.effective_active_pct == 2.025"
            - "CleaningCycle.${cyc3}.required_contact_minutes == 15"
            - "ServiceVisit.${visit}.serviced_line_count == 3"
            - "ServiceVisit.${visit}.provisional_charge_cents == 24474"
            - "ServiceVisit.${visit}.parts_charge_cents == 3195"
            - "ServiceVisit.${visit}.billable_line_count == 2"
            - "ServiceVisit.${visit}.cleaning_subtotal_cents == 9186"
            - "ServiceVisit.${visit}.settled_charge_cents == 19881"
            - "ServiceVisit.${visit}.account_due_cents == 19881"
            - "ServiceVisit.${visit}.brewer_funded_cents == 0"
            - "ServiceVisit.${visit}.settlement_state == SETTLED"
            - "ServiceVisit.${visit}.provisional_charge_cents - ServiceVisit.${visit}.settled_charge_cents == 4593"
            - "BeerLine.${line3}.status == OUT_OF_SERVICE"
            - "ServiceAccount.${acct}.status == ACTIVE"
            - "ServiceAccount.${acct}.lines_out_of_service_count == 1"

      - name: complaint_yield_loss_provisional_severity_estimate_vs_settled_measured_waste
        grounds:
          - calculations.yield_loss_estimate
          - state_machines.QualityComplaint.ABSENT_to_OPEN
          - state_machines.QualityComplaint.OPEN_to_RESOLVED
          - entities.QualityComplaint.fields.provisional_yield_loss_cents
          - entities.QualityComplaint.fields.settled_yield_loss_cents
          - entities.BeerLine.fields.last_cleaned_at
        distinguishing_aspect: |
          Volume domain (liters of beer on QualityComplaint, not cents on a
          visit): the provisional variant multiplies SEVERITY_FACTOR[FOAMY_POUR]
          by days_at_risk 17 and throughput 12.0 to reach 71.40 L / 34272 cents,
          while the settled variant discards the severity model entirely and uses
          the technician's measured_waste_liters 18.5 plus a 2-day foam allowance
          to reach 19.50 L / 9360 cents — a 24912-cent downward reconciliation
          recorded on the SAME row beside the frozen provisional figure.
        test_recipe:
          setup:
            - "ServiceAccount ACTIVE, no glycol system; ServiceContract ACTIVE with cleaning_frequency_days 21, contracted_line_count 4."
            - "BeerLine #1 32ft/4ft/0.375in ALE with average_daily_throughput_liters 12.0, IN_SERVICE."
            - "A POSTED PASS CleaningCycle logged at 2026-08-03T08:00:00Z, so BeerLine.last_cleaned_at == 2026-08-03T08:00:00Z and next_due_at == 2026-08-24T08:00:00Z."
            - "Clock advanced to 2026-08-20T12:00:00Z before the complaint is filed (17 whole days of exposure)."
            - "Clock advanced to 2026-08-22T09:00:00Z before closure (days_open 2, counting the report day)."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Anchor Tap", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { line1: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/chemical-lots"
              payload: { chemical_type: "CAUSTIC", lot_code: "C-2001", concentration_pct_stock: 45.0, liters_initial: 20.0, expires_on: "2026-12-31" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lot_caustic: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-03", scheduled_start_minute: 480, scheduled_end_minute: 600 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/service-visits/${visit}/start"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
            - call: "POST /draft-service/cleaning-cycles"
              payload: { visit_id: "${visit}", line_id: "${line1}", chemical_lot_id: "${lot_caustic}", chemical_type: "CAUSTIC", contact_minutes: 20, recirculation_temp_f: 96.0, concentrate_liters_used: 0.31 }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { cyc1: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
          trigger:
            - call: "POST /draft-service/quality-complaints"
              payload: { account_id: "${acct}", line_id: "${line1}", symptom: "FOAMY_POUR" }
              as: VenueManager
              as_user_id: "${acct}"
              captures: { cmp: $.data.id, prov_cents: $.data.provisional_yield_loss_cents }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T09:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/quality-complaints/${cmp}/closure"
              payload: { disposition: "RESOLVED", measured_waste_liters: 18.5 }
              as: QualityAuditor
              as_user_id: "auditor-2"
              captures: { settled_cents: $.data.settled_yield_loss_cents }
          assert:
            - "CleaningCycle.${cyc1}.compliance_result == PASS"
            - "QualityComplaint.${cmp}.days_at_risk == 17"
            - "QualityComplaint.${cmp}.provisional_yield_loss_liters == 71.40"
            - "QualityComplaint.${cmp}.provisional_yield_loss_cents == 34272"
            - "QualityComplaint.${cmp}.settled_yield_loss_liters == 19.50"
            - "QualityComplaint.${cmp}.settled_yield_loss_cents == 9360"
            - "QualityComplaint.${cmp}.provisional_yield_loss_cents - QualityComplaint.${cmp}.settled_yield_loss_cents == 24912"
            - "QualityComplaint.${cmp}.status == RESOLVED"
            - "QualityComplaint.${cmp}.measured_waste_liters == 18.5"
            - "QualityComplaint.${cmp}.closed_by_user_id == auditor-2"
            - "ServiceAccount.${acct}.open_complaint_count == 0"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # Mode (a): three independent selectors combining multiplicatively.
  # Mode (b): rounding order (per-line before sum) changes the result.
  # Mode (c): a later factor is selected by an earlier DERIVED factor.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: gas_balance_style_temperature_band_and_bore_each_swap_one_constant
        grounds:
          - calculations.gas_balance_target
          - state_machines.BalanceRecord.ABSENT_to_PROPOSED
          - concurrency_rules[balance-record-create-stale-line]
          - entities.BeerLine.fields.beer_style_group
          - entities.BeerLine.fields.inner_diameter_inches
          - entities.BalanceRecord.fields.required_co2_pct
          - validations[priority=56]
          - validations[priority=57]
        distinguishing_aspect: |
          Mode (a) — three orthogonal selectors: beer_style_group and the
          measured-temperature band jointly index TARGET_CO2_VOLUMES while
          inner_diameter_inches independently indexes RESTRICTION_PSI_PER_FOOT,
          and the two picks divide into required_co2_pct. Changing exactly one
          selector at a time moves required_co2_pct 59.2 -> 48.5 (temp band
          MILD -> COLD), 59.2 -> 67.3 (ALE -> LAGER) and 59.2 -> 40.0 (bore
          0.375 -> 0.25, where the raw 25.8 is clamped up to the 40.0 floor).
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z."
            - "ServiceAccount ACTIVE with access window 480-1080; ServiceContract ACTIVE with contracted_line_count 4."
            - "Three BeerLine rows, all 32ft run / 4ft rise: A = 0.375in ALE, B = 0.375in LAGER, C = 0.25in ALE."
            - "ServiceVisit ROUTINE_CLEANING IN_PROGRESS with technician Dana Ruiz assigned."
            - "No BalanceRecord rows yet; each line's version is read immediately before its proposal because every PROPOSED create bumps BeerLine.version by 1."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Gasworks Bar", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 1, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lineA: $.data.id }
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 2, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.375, beer_style_group: "LAGER", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lineB: $.data.id }
            - call: "POST /draft-service/beer-lines"
              payload: { account_id: "${acct}", line_number: 3, run_length_feet: 32, vertical_rise_feet: 4, inner_diameter_inches: 0.25, beer_style_group: "ALE", average_daily_throughput_liters: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lineC: $.data.id }
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { visit: $.data.id }
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/service-visits/${visit}/start"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
          trigger:
            - call: "GET /draft-service/beer-lines/${lineA}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { lineA_v1: $.data.version }
            - call: "POST /draft-service/balance-records"
              payload: { visit_id: "${visit}", line_id: "${lineA}", measured_temp_f: 40.0, proposed_applied_psi: 13.6, proposed_co2_pct: 59.2, expected_line_version: "${lineA_v1}" }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { recA: $.data.id }
            - call: "GET /draft-service/beer-lines/${lineA}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { lineA_v2: $.data.version }
            - call: "POST /draft-service/balance-records"
              payload: { visit_id: "${visit}", line_id: "${lineA}", measured_temp_f: 38.0, proposed_applied_psi: 13.6, proposed_co2_pct: 48.5, expected_line_version: "${lineA_v2}" }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { recA_cold: $.data.id }
            - call: "GET /draft-service/beer-lines/${lineB}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { lineB_v1: $.data.version }
            - call: "POST /draft-service/balance-records"
              payload: { visit_id: "${visit}", line_id: "${lineB}", measured_temp_f: 40.0, proposed_applied_psi: 13.6, proposed_co2_pct: 67.3, expected_line_version: "${lineB_v1}" }
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { recB: $.data.id }
            - call: "GET /draft-service/beer-lines/${lineC}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech}"
              captures: { lineC_v1: $.data.version }
            - call: "POST /draft-service/balance-records"
              payload: { visit_id: "${visit}", line_id: "${lineC}", measured_temp_f: 40.0, proposed_applied_psi: 31.2, proposed_co2_pct: 40.0, expected_line_version: "${lineC_v1}" }
              as: ServiceTechnician
              as_user_id: "${tech}"
