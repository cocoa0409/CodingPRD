  # =========================================================================
  # RULE 6 - boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: utilization_exactly_at_portable_trigger_percent
        grounds:
          calculations: [utilization_and_portable_need]
          entities: [CapacityStudy, School, Room, EnrollmentProjection]
          endpoints: ["POST /facilities/capacity-studies/{id}/submit"]
        metric: "utilization_pct, the projected enrolment expressed as a percentage of program capacity, rounded half-up to one decimal"
        boundary: "PORTABLE_TRIGGER_PCT = 95.0, evaluated with >= so that exactly 95.0 trips the trigger"
        distinguishing_aspect: >
          Three campuses share an identical 100 seat building program and differ
          only in projected enrolment: 94, 95 and 96 pupils, producing utilization
          94.0, 95.0 and 96.0. At exactly 95.0 the portable trigger is met even
          though the seat deficit is still zero, because the deficit is measured
          against the effective capacity floor(100 * 95 / 100) = 95 rather than
          against the trigger. One pupil more and the deficit becomes 1 and one
          portable is required; one pupil fewer and the trigger is not met at all.
          An implementation using a strict greater-than, or deriving the trigger
          from the deficit, gets the middle campus wrong in one direction or the
          other.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-01T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
          - call: "POST /facilities/class-size-policies"
