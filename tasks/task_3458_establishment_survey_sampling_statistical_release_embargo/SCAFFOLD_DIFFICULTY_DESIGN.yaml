            - "g_status == ACCESSED and g_accessed == 2026-10-01T13:00:00Z (first read flips ISSUED -> ACCESSED)"

  # ---------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (2 instances, different entity pairs)
  # ---------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_create_blocked_when_cycle_processing
        grounds:
          - validations[priority=12]
          - state_machines.SurveyCycle.COLLECTING_to_PROCESSING
          - errors[ERR_CYCLE_NOT_COLLECTING]
        distinguishing_aspect: |
          Entity pair ResponseReport x SurveyCycle: whether a report may be
          created depends on the CYCLE's state, not the report's — once the
          cycle leaves COLLECTING (closed at 2026-09-21), E2's submission is
          rejected even though E2's enrollment is ENROLLED and E1's earlier
          report succeeded on identical payload shape.
        test_recipe:
          setup:
            - "Program CES (budget 3); frame frozen; E1,E2 enrolled/accepted"
            - "September cycle COLLECTING; E1 report (employment 9) accepted during collection"
            - "Collection closed at 2026-09-21 (cycle PROCESSING)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3, embargo_window_minutes: 30, annual_burden_budget_minutes: 500 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001401", name: "XD-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001402", name: "XD-E2", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e2: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e2}", program_code: "CES" }, as: CollectionOfficer, captures: { en2: $.data.id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}" }
            - { call: "POST /survey/panel-enrollments/${en2}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e2}" }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: OPEN_COLLECTION }, as: CollectionOfficer }
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en1}", cycle_id: "${cyc}", employment: 9 }, as: Respondent, as_user_id: "${e1}", captures: { r1: $.data.id } }
            - { call: "POST /survey/response-reports/${r1}/advance", payload: { action: ACCEPT }, as: CollectionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: CLOSE_COLLECTION }, as: CollectionOfficer }
          trigger:
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en2}", cycle_id: "${cyc}", employment: 7 }, as: Respondent, as_user_id: "${e2}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CYCLE_NOT_COLLECTING (state category, priority 12 — beats the also-true temporal violation ERR_REPORT_WINDOW_CLOSED at priority 26)"
            - "no report row exists for (${en2}, ${cyc}) afterwards"

      - name: grant_issuance_skips_suspended_outlet
        grounds:
          - state_machines.ReleaseEvent.SCHEDULED_to_EMBARGO_OPEN
          - state_machines.MediaOutlet.ACCREDITED_to_SUSPENDED
          - entities.EmbargoGrant.fields.grant_status
        distinguishing_aspect: |
          Entity pair EmbargoGrant x MediaOutlet (distinct from the sibling's
          Report x Cycle pair): OPEN_EMBARGO mints grants only for outlets
          ACCREDITED at that instant — O2, suspended beforehand, receives no
          grant at all, while O1 (accredited) does.
        test_recipe:
          setup:
            - "Program CES (budget 3); September cycle fully reported and CERTIFIED (analyst-1)"
            - "Outlet O1 ACCREDITED; outlet O2 accredited then SUSPENDED before the embargo opens"
            - "Release created (release_at 2026-10-01T13:30:00Z), disclosure APPROVED (officer-7), clock at embargo_open_at"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3, embargo_window_minutes: 30, annual_burden_budget_minutes: 500 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001501", name: "GI-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}" }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: OPEN_COLLECTION }, as: CollectionOfficer }
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en1}", cycle_id: "${cyc}", employment: 9 }, as: Respondent, as_user_id: "${e1}", captures: { r1: $.data.id } }
            - { call: "POST /survey/response-reports/${r1}/advance", payload: { action: ACCEPT }, as: CollectionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: CLOSE_COLLECTION }, as: CollectionOfficer }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: COMPUTE_ESTIMATES }, as: EstimationAnalyst }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: CERTIFY }, as: EstimationAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /survey/media-outlets", payload: { name: "Wire Service", outlet_code: "WIRE1" }, as: ReleaseManager, captures: { o1: $.data.id } }
            - { call: "POST /survey/media-outlets", payload: { name: "Daily News", outlet_code: "DAILY2" }, as: ReleaseManager, captures: { o2: $.data.id } }
            - { call: "POST /survey/media-outlets/${o1}/accreditation", payload: { action: ACCREDIT }, as: ReleaseManager }
            - { call: "POST /survey/media-outlets/${o2}/accreditation", payload: { action: ACCREDIT }, as: ReleaseManager }
            - { call: "POST /survey/media-outlets/${o2}/accreditation", payload: { action: SUSPEND }, as: ReleaseManager }
            - { call: "POST /survey/release-events", payload: { cycle_id: "${cyc}", release_at: "2026-10-01T13:30:00Z" }, as: ReleaseManager, captures: { rel: $.data.id, rv1: $.data.version } }
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: APPROVE_DISCLOSURE, expected_release_version: "${rv1}" }, as: DisclosureOfficer, as_user_id: "officer-7", captures: { rv2: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T13:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /survey/release-events/${rel}/advance", payload: { action: OPEN_EMBARGO, expected_release_version: "${rv2}" }, as: ReleaseManager, captures: { grant_count: $.data.active_embargo_grant_count } }
            - { call: "GET /survey/embargo-grants", payload: { release_event_id: "${rel}", media_outlet_id: "${o1}" }, as: ReleaseManager, captures: { g1: "$.data[0].id", g1_status: "$.data[0].grant_status" } }
          assert:
            - "grant_count == 1 (only O1 was ACCREDITED at OPEN_EMBARGO)"
            - "g1_status == ISSUED and g1's media_outlet_id == ${o1}"
            - "GET /survey/embargo-grants?media_outlet_id=${o2} returns an empty array with total_count == 0 — the suspended outlet received no grant"

  # ---------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ---------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: embargo_windows_half_open_adjacency
        grounds:
          - validations[priority=44]
          - errors[ERR_EMBARGO_WINDOW_OVERLAP]
          - entities.ReleaseEvent.fields.embargo_open_at
        distinguishing_aspect: |
          Interval semantics: half-open windows [embargo_open_at, release_at) on
          the ReleaseEvent resource — back-to-back windows (R1 ends 13:30, R2
          opens 13:30) do NOT overlap and are accepted, while a window shifted
          one second earlier (13:29:59) overlaps and is rejected.
        test_recipe:
          setup:
            - "Program CES (embargo_window_minutes 30); three cycles exist (2026-09, 2026-10, 2026-11)"
            - "R1 scheduled for the Sep cycle at release_at 2026-10-01T13:30:00Z (window [13:00, 13:30))"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3, embargo_window_minutes: 30, annual_burden_budget_minutes: 500 }, as: ProgramAdmin }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc_sep: $.data.id } }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-10" }, as: ProgramAdmin, captures: { cyc_oct: $.data.id } }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-11" }, as: ProgramAdmin, captures: { cyc_nov: $.data.id } }
            - { call: "POST /survey/release-events", payload: { cycle_id: "${cyc_sep}", release_at: "2026-10-01T13:30:00Z" }, as: ReleaseManager, captures: { r1: $.data.id, r1_open: $.data.embargo_open_at } }
          trigger:
            - { call: "POST /survey/release-events", payload: { cycle_id: "${cyc_oct}", release_at: "2026-10-01T14:00:00Z" }, as: ReleaseManager, captures: { r2: $.data.id, r2_open: $.data.embargo_open_at } }
            - { call: "POST /survey/release-events", payload: { cycle_id: "${cyc_nov}", release_at: "2026-10-01T13:29:59Z" }, as: ReleaseManager, captures: { err: $.data.error_id } }
          assert:
            - "r1_open == 2026-10-01T13:00:00Z"
            - "R2 created successfully (201): its window [13:30, 14:00) is adjacent to R1's [13:00, 13:30) — half-open semantics treat touching endpoints as non-overlapping"
            - "r2_open == 2026-10-01T13:30:00Z"
            - "err == ERR_EMBARGO_WINDOW_OVERLAP for R3: window [12:59:59, 13:29:59) intersects R1's window"

      - name: frame_quarters_strict_contiguity
        grounds:
          - validations[priority=41]
          - errors[ERR_FRAME_PERIOD_GAP]
          - errors[ERR_DUPLICATE_FRAME_PERIOD]
          - concurrency_rules[frame-create-stale-program]
        distinguishing_aspect: |
          Interval semantics: strict quarter contiguity (gap-forbidden) on the
          SampleFrame resource — unlike the half-open overlap rule for releases,
          a frame must be the IMMEDIATE successor of the latest non-superseded
          frame: skipping 2026-Q4 to 2027-Q1 fails with ERR_FRAME_PERIOD_GAP
          and re-entering 2026-Q3 fails with ERR_DUPLICATE_FRAME_PERIOD.
        test_recipe:
          setup:
            - "Program CES; one DRAFT frame for 2026-Q3 already created (first frame: any quarter allowed)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3, embargo_window_minutes: 30, annual_burden_budget_minutes: 500 }, as: ProgramAdmin, captures: { prog_v1: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v1}" }, as: ProgramAdmin, captures: { f1: $.data.id } }
            - { call: "GET /survey/programs", payload: {}, as: ProgramAdmin, captures: { prog_v2: "$.data[0].version" } }
          trigger:
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2027-Q1", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v2}" }, as: ProgramAdmin, captures: { err_gap: $.data.error_id } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v2}" }, as: ProgramAdmin, captures: { err_dup: $.data.error_id } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q4", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v2}" }, as: ProgramAdmin, captures: { f2: $.data.id } }
          assert:
            - "err_gap == ERR_FRAME_PERIOD_GAP (2027-Q1 skips the successor quarter 2026-Q4)"
            - "err_dup == ERR_DUPLICATE_FRAME_PERIOD (2026-Q3 already has a non-SUPERSEDED frame)"
            - "f2 created successfully — 2026-Q4 is the immediate successor"
            - "failed creates did not bump SurveyProgram.version: the successful Q4 create still used the pre-failure version"

  # ---------------------------------------------------------------
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ---------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: burden_record_void_pair_conserves_minutes
        grounds:
          - state_machines.FollowUpCase.OPEN_to_IN_CONTACT
          - entities.FollowUpCase.fields.total_contact_minutes
          - entities.PanelEnrollment.fields.burden_minutes_ytd
        distinguishing_aspect: |
          Conserved quantity: burden minutes. RECORD_CONTACT (+12) followed by
          its compensating VOID_CONTACT leaves enrollment.burden_minutes_ytd and
          case.total_contact_minutes EXACTLY at their pre-pair values (0 and 0);
          the voided entry remains visible with voided == true.
        test_recipe:
          setup:
            - "Program CES (budget 3, burden budget 120); frame frozen; E1 reports (accepted), E2 silent -> case opened at close"
            - "Clock at 2026-09-22T09:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3, embargo_window_minutes: 30, annual_burden_budget_minutes: 120 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001601", name: "BI-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001602", name: "BI-E2", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e2: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e2}", program_code: "CES" }, as: CollectionOfficer, captures: { en2: $.data.id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}" }
            - { call: "POST /survey/panel-enrollments/${en2}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e2}" }
            - { call: "POST /survey/survey-cycles", payload: { program_code: "CES", reference_month: "2026-09" }, as: ProgramAdmin, captures: { cyc: $.data.id } }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: OPEN_COLLECTION }, as: CollectionOfficer }
            - { call: "POST /survey/response-reports", payload: { enrollment_id: "${en1}", cycle_id: "${cyc}", employment: 9 }, as: Respondent, as_user_id: "${e1}", captures: { r1: $.data.id } }
            - { call: "POST /survey/response-reports/${r1}/advance", payload: { action: ACCEPT }, as: CollectionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: CLOSE_COLLECTION }, as: CollectionOfficer }
            - { call: "GET /survey/follow-up-cases", payload: { enrollment_id: "${en2}", cycle_id: "${cyc}" }, as: CollectionOfficer, captures: { case_id: "$.data[0].id" } }
            - { call: "GET /survey/panel-enrollments/${en2}", payload: {}, as: CollectionOfficer, captures: { burden_pre: $.data.burden_minutes_ytd } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T09:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /survey/follow-up-cases/${case_id}/advance", payload: { action: RECORD_CONTACT, contact_minutes: 12, channel: "PHONE" }, as: CollectionOfficer, captures: { case_mid_minutes: $.data.total_contact_minutes, case_mid_status: $.data.case_status } }
            - { call: "GET /survey/panel-enrollments/${en2}", payload: {}, as: CollectionOfficer, captures: { burden_mid: $.data.burden_minutes_ytd } }
            - { call: "POST /survey/follow-up-cases/${case_id}/advance", payload: { action: VOID_CONTACT, contact_seq: 1 }, as: CollectionOfficer, captures: { case_end_minutes: $.data.total_contact_minutes } }
            - { call: "GET /survey/panel-enrollments/${en2}", payload: {}, as: CollectionOfficer, captures: { burden_end: $.data.burden_minutes_ytd } }
          assert:
            - "burden_pre == 0 and burden_mid == 12 (forward action) and burden_end == 0 == burden_pre (compensating action restores the invariant)"
            - "case_mid_minutes == 12 and case_end_minutes == 0"
            - "case_mid_status == IN_CONTACT (first contact moved OPEN -> IN_CONTACT; voiding does not revert the status)"
            - "the case's contacts[0].voided == true and contacts[0].contact_minutes == 12 (entry preserved, excluded from totals)"

      - name: suspend_reinstate_pair_conserves_enrolled_count
        grounds:
          - state_machines.PanelEnrollment.ENROLLED_to_SUSPENDED
          - state_machines.PanelEnrollment.SUSPENDED_to_ENROLLED
        distinguishing_aspect: |
          Conserved quantity: the program's ENROLLED panel count (distinct from
          the burden-minutes quantity of the sibling instance). SUSPEND
          decrements it and the compensating REINSTATE restores it exactly:
          count(ENROLLED) is 2 before the pair, 1 inside, 2 after.
        test_recipe:
          setup:
            - "Program CES (budget 3); frame frozen; E1,E2 enrolled and accepted (panel count 2)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3, embargo_window_minutes: 30, annual_burden_budget_minutes: 500 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001701", name: "SR-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001702", name: "SR-E2", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e2: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { en1: $.data.id } }
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e2}", program_code: "CES" }, as: CollectionOfficer, captures: { en2: $.data.id } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e1}" }
            - { call: "POST /survey/panel-enrollments/${en2}/lifecycle", payload: { action: ACCEPT }, as: Respondent, as_user_id: "${e2}" }
          trigger:
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: SUSPEND }, as: CollectionOfficer, captures: { mid_status: $.data.enrollment_status } }
            - { call: "GET /survey/panel-enrollments", payload: { program_code: "CES", enrollment_status: ENROLLED }, as: CollectionOfficer, captures: { mid_only: "$.data[0].id" } }
            - { call: "POST /survey/panel-enrollments/${en1}/lifecycle", payload: { action: REINSTATE }, as: CollectionOfficer, captures: { end_status: $.data.enrollment_status } }
          assert:
            - "before the pair: GET /survey/panel-enrollments?enrollment_status=ENROLLED has total_count == 2"
            - "mid_status == SUSPENDED and the ENROLLED list then contains exactly one row (mid_only == ${en2}) with total_count == 1"
            - "end_status == ENROLLED and the ENROLLED list is back to total_count == 2 — the forward/compensating pair conserves the panel count"
