  - section: cross_cutting_complexity_layers
    instances:
      - name: ccl_stale_asset_version_refused_and_future_date_outranks_it
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority=18]
          - validations[priority=10]
          - endpoints[POST /assets/{id}/condition-assessments]
          - entities.SurplusAsset.fields.version
        distinguishing_aspect: "The asset's version token is consumed by the assessment endpoint, so the same expected_asset_version can be spent exactly once: replaying it is refused with 412 even though the payload is otherwise legal, and the caller must re-read the asset to obtain the advanced token. The ordering half of the claim is that a payload carrying both a spent token and a future assessed_on answers the 422 date error, because the field-level date check has the lower priority number."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one ACTIVE agency and one SUBMITTED turn-in holding one FURNITURE asset with acquisition_cost_cents 1000000 acquired 2026-01-10"
            - "the asset's version token captured at creation time as ${a1_v}"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Modular workstation cluster", acquisition_cost_cents: 1000000, acquisition_date: "2026-01-10" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
          trigger:
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C1", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-15", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { ca1: "$.data.id" }
            - call: "GET /assets/${a1}"
              payload: {}
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { a1_v2: "$.data.version" }
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C3", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-20", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C3", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-09-01", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { e_future: "$.data.error_id" }
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C3", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-20", expected_asset_version: "${a1_v2}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { ca2: "$.data.id" }
            - call: "GET /assets/${a1}/condition-assessments"
              payload: {}
              as: SurplusAssessor
              as_user_id: "assessor-01"
          assert:
            - "the first assessment returns 201 and SurplusAsset.${a1}.fair_market_value_cents == 1000000 with condition_code C1 and version == ${a1_v} + 1 == ${a1_v2}"
            - "the replay of ${a1_v} returns 412 with data.error_id == \"ERR_STALE_ASSET_VERSION\""
            - "the payload carrying both the spent token and assessed_on 2026-09-01 returns 422 with data.error_id == \"ERR_FUTURE_DATE\" — priority 10 outranks priority 18, so the date error is reported even though the token is also wrong"
