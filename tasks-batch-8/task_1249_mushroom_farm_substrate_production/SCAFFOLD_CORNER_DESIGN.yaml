        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_INVALID_STATE]", state_machines.ContaminationEvent]
        distinguishing_aspect: "ERR_EVENT_INVALID_STATE is reachable twice: remediate on a REPORTED event, and confirm on an already-CONFIRMED event."
        test_recipe:
          setup: ["Room r1 exists; event ev1 REPORTED (severity 1)"]
          setup_api_calls:
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id } }
            - { call: "POST /api/contamination-events", payload: { room_id: "${r_id}", pathogen: "VIRUS", severity: 1, affected_zone_pct: 5.0 }, as: QualityInspector, captures: { ev_id: $.data.id } }
          trigger:
