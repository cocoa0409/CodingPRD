  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: shop_brand_window_closed_interval_buffer_overlap
        grounds:
          - calculations.shop_brand_window_overlap
          - calculations.shop_brand_window_overlap.constants[BUFFER_HOURS]
          - validations[priority=9]
          - errors[ERR_BRAND_WINDOW_OVERLAP]
        distinguishing_aspect: |
          This overlap rule uses CLOSED intervals with a mandatory two-hour buffer on both ends, which
          is the opposite geometric treatment from the half-open, buffer-free dock buckets: an
          adjacent event that starts exactly when the previous one ends is still refused, and the
          same refusal appears when a third event of the same shop collides with two others at once.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Vendor V1, Shop S1. Event EA on S1 with window 2026-09-05T00:00:00Z to 2026-09-06T00:00:00Z, already SCHEDULED."
            - "A second Event EB on S1 with window 2026-09-10T00:00:00Z to 2026-09-11T00:00:00Z, still DRAFT, whose buffered interval already sits clear of EA's."
            - "Two further candidates are prepared: EC adjacent to EA, and ED spanning far enough to collide with both EA and EB at once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Event A", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-06T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_a_id: $.data.id }
