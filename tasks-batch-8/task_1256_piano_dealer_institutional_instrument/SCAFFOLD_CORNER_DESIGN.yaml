              as: StoreManager
            - call: "POST /piano-dealer/instruments/${f2}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${f1}", unit_price_cents: 600000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o1: $.data.id }
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${f2}", unit_price_cents: 600000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o2: $.data.id }
