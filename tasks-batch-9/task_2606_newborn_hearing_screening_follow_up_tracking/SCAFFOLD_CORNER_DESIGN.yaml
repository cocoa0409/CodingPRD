              captures: { ep_diag_id: "$.data.id" }
          assert:
            - "${v_stale} == 2 (create + REFER encounter) and ${v_after_patch} == 3 — every write increments Infant.version by exactly 1"
            - "Create with the stale 2: HTTP 412 with data.error_id == ERR_STALE_INFANT_VERSION; FollowUpEpisode.${ep_rescreen_id}.status still PENDING_SCHEDULING and GET /follow-up-episodes?infant_id=${ioc_id} returns total_count == 1"
            - "${v_fresh} == 3; the retry returns HTTP 201 with FollowUpEpisode.${ep_diag_id}.episode_type == DIAGNOSTIC, benchmark_days == 90 and due_date == 2026-10-30T00:00:00Z"
            - "FollowUpEpisode.${ep_rescreen_id}.status == SUPERSEDED with closure_reason SUPERSEDED, and Infant.${ioc_id}.version == 4 with screening_status == DIAGNOSTIC_IN_PROGRESS"

      - name: stale_expected_facility_version_on_report_submit_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.report-submit-stale-facility
          - "errors[ERR_STALE_FACILITY_VERSION]"
          - validations.priority_9_occ_facility
        distinguishing_aspect: "The second concurrency rule guards a different parent: a penalty adjustment moves Facility.version from 1 to 2, so a filing built on version 1 is 412 ERR_STALE_FACILITY_VERSION even though the report body is otherwise valid, and the re-read version files successfully."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) at version 1; August period (2026-08-01..2026-09-01, due 2026-09-05); clock 2026-08-15T00:00:00Z; a +2 penalty adjustment is applied after the version was read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id", bh_v_stale: "$.data.version" }
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_due_datetime: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { per_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /facilities/${bh_id}/penalty-adjustments"
              payload: { points_delta: 2, reason: "late roster update" }
              as: ProgramAdmin
              captures: { bh_v_after_adj: "$.data.version" }
          trigger:
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh_id}", reporting_period_id: "${per_id}", attested_screened_count: 0, attested_refer_count: 0, expected_facility_version: "${bh_v_stale}" }
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { e_occ2: "$.data.error_id" }
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { bh_v_fresh: "$.data.version" }
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh_id}", reporting_period_id: "${per_id}", attested_screened_count: 0, attested_refer_count: 0, expected_facility_version: "${bh_v_fresh}" }
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { rep_id: "$.data.id" }
          assert:
            - "${bh_v_stale} == 1 and ${bh_v_after_adj} == 2 with penalty_points_balance == 2 and reporting_compliance_status == COMPLIANT"
            - "Filing on version 1: HTTP 412 with data.error_id == ERR_STALE_FACILITY_VERSION; GET /facility-reports?facility_id=${bh_id} returns total_count == 0"
            - "${bh_v_fresh} == 2; the retry returns HTTP 201 with FacilityReport.${rep_id}.status == SUBMITTED, variance_case_count == 0 and submitted_late == false"

      - name: risk_band_crosses_into_critical_at_exactly_forty_five_points
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.ltf_risk_score.bands
          - calculations.ltf_risk_score.constants.RISK_FACTOR_POINTS
          - endpoints.GET_infants_id_timeliness
        distinguishing_aspect: "The CRITICAL band opens at exactly 45: a home-birth infant with a language gap, one registry entry and 12 age-pressure points sits at 41 (HIGH), and the second registry entry adds the 4 points that land the score on 45 and rewrite the band to CRITICAL."
        test_recipe:
          setup:
            - "MW1 (MIDWIFE_PRACTICE, R1) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with navigator N1 whose languages are ['EN'] only; HOME_BIRTH infant born 2026-08-01T00:00:00Z at 39 weeks with preferred_language ZH and interpreter_required true (auto INITIAL_SCREEN episode, benchmark 30); one FAMILY_HISTORY registry entry; clock then advanced to 2026-08-26T00:00:00Z (effective age 25, so 30 - 10 < 25 <= 30 gives 12 age-pressure points)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "MW1", facility_type: "MIDWIFE_PRACTICE", region_code: "R1" }
              as: ProgramAdmin
              captures: { mw_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${mw_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "NAVIGATOR", full_name: "N1", region_code: "R1", languages: ["EN"] }
              as: ProgramAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${mw_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "HOME_BIRTH", gestational_age_weeks: 39, preferred_language: "ZH", interpreter_required: true, guardian_name: "G-CB", guardian_contact_phone: "5556701" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { icb_id: "$.data.id" }
            - call: "POST /risk-factor-entries"
              payload: { infant_id: "${icb_id}", risk_factor_code: "FAMILY_HISTORY", identified_at: "2026-08-01T04:00:00Z" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { rf1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /infants/${icb_id}/timeliness"
              payload: {}
              as: ProgramAuditor
            - call: "POST /risk-factor-entries"
              payload: { infant_id: "${icb_id}", risk_factor_code: "CRANIOFACIAL_ANOMALY", identified_at: "2026-08-26T00:00:00Z" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { rf2_id: "$.data.id" }
            - call: "GET /infants/${icb_id}/timeliness"
              payload: {}
              as: ProgramAuditor
          assert:
            - "First read: effective_age_days == 25, benchmark_age_basis == CHRONOLOGICAL, ltf_risk_score == 41 (HOME_BIRTH 15 + language_gap 10 + 1 entry 4 + age_pressure 12) and priority_band == HIGH"
            - "Adding RiskFactorEntry.${rf2_id}: HTTP 201 with status ACTIVE and Infant.${icb_id}.risk_factor_count == 2"
            - "Second read: ltf_risk_score == 45 and priority_band == CRITICAL — the band opens at 45 inclusive, so the 4-point step crosses it"
            - "Infant.${icb_id}.ltf_risk_score == 45 and priority_band == CRITICAL on the stored row as well (the registry write recomputed both)"

      - name: cascading_side_effects_layer_covered_by_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DiagnosticEvaluation.ATTESTED_to_FINALIZED_LOSS
        excluded_because:
          difficulty_instance: multi_hop_cascade / finalize_loss_cascade_six_links_home_birth_risk_15_to_7
          rationale: "The six-link CASCADE C1 chain is asserted end-to-end, link by link, by the named §1.8 instance, including the ordering-sensitive risk rescore at the tail."
      - name: dual_variant_calculation_layer_covered_by_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - calculations.facility_performance_score.variants
        excluded_because:
          difficulty_instance: dual_variant_divergence / facility_performance_cohort_vs_encounter_basis_diverge_45_vs_70
          rationale: "Both variants and their delta on the same data are asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: booking_side_effects_are_all_visible_without_any_further_write
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - state_machines.FollowUpEpisode.PENDING_SCHEDULING_to_SCHEDULED
          - calculations.navigation_units_cost
        distinguishing_aspect: "One booking request writes five rows, and every one of them reads back correctly on the very next call with no intervening write: the appointment carries its linked task id in its own 201 body, the slot is FULL, the episode is SCHEDULED with attempt_count 1, the interpreter task is OPEN and the facility budget is already 5 units lighter."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1, budget 40) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with audiologist A1 and navigator N1 whose languages are ['EN','ES']; INPATIENT infant with preferred_language ES and interpreter_required true, screened BIRTH_ADMISSION REFER/REFER so a RESCREEN episode is open; one capacity-1 RESCREEN slot on 2026-08-05T09:00:00Z..10:00:00Z; clock 2026-08-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "NAVIGATOR", full_name: "N1", region_code: "R1", languages: ["EN", "ES"] }
              as: ProgramAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, preferred_language: "ES", interpreter_required: true, guardian_name: "G-IM", guardian_contact_phone: "5556801" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { iim_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${iim_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-01T04:00:00Z", left_ear_result: "REFER", right_ear_result: "REFER" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "GET /follow-up-episodes"
              payload: { infant_id: "${iim_id}" }
              as: ProgramAdmin
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", slot_type: "RESCREEN" }
              as: FacilityAdmin
              as_user_id: "${ac_id}"
              captures: { slot_id: "$.data.id" }
          trigger:
            - call: "POST /rescreen-appointments"
              payload: { episode_id: "${ep_id}", slot_id: "${slot_id}", interpreter_needed: true }
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { appt_id: "$.data.id", task_id: "$.data.linked_navigation_task_id" }
            - call: "GET /clinic-slots/${slot_id}"
              payload: {}
              as: Navigator
              as_user_id: "${n1_id}"
            - call: "GET /follow-up-episodes/${ep_id}"
              payload: {}
              as: Navigator
              as_user_id: "${n1_id}"
            - call: "GET /navigation-tasks/${task_id}"
              payload: {}
              as: Navigator
              as_user_id: "${n1_id}"
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: Navigator
              as_user_id: "${n1_id}"
            - call: "GET /infants/${iim_id}"
              payload: {}
              as: Navigator
              as_user_id: "${n1_id}"
          assert:
            - "The 201 body itself already carries RescreenAppointment.${appt_id}.status == BOOKED, infant_id == ${iim_id} (copied from the episode) and a non-null linked_navigation_task_id == ${task_id}"
            - "GET /clinic-slots/${slot_id}: booked_count == 1, remaining_capacity == 0, status == FULL"
            - "GET /follow-up-episodes/${ep_id}: status == SCHEDULED with attempt_count == 1"
            - "GET /navigation-tasks/${task_id}: task_type == INTERPRETER_SESSION, status == OPEN, assigned_provider_id == ${n1_id} (the only ES-speaking navigator in R1), units_reserved == 5 (2 base + 3 interpreter), episode_id == ${ep_id}, funding_facility_id == ${bh_id}"
            - "GET /facilities/${bh_id}: navigation_budget_units_remaining == 35"
            - "GET /infants/${iim_id}: ltf_risk_score == 0 and priority_band == LOW — the raw total is -8 (navigation relief with no other term) and the clamp lifts it to 0 in the same request"
