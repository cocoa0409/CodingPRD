              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { charge: $.data.carrier_charge_cents }
          assert:
            # wh component: 43.20 Wh all in tier1 at $0.12 = $5.184
            # weight: 7.77 kg * 40 cents/kg = 310.8 cents = $3.108
            # pre-multiplier: 5.184 + 3.108 = $8.292
            # DG mult for UN3481 = 1.15 → $9.5358
            # round HALF_UP to integer cents → 954
            # If rounded tier-first: tier1=518.4→518, weight=310.8→311, sum=829, *1.15=953.35→953 (different)
            - "TransportShipment.${ship_id}.carrier_charge_cents == 954"
            - "TransportShipment.${ship_id}.status == TENDERED"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: battery_pack_parallel_axes_independent_progression
        grounds:
          - state_machines.BatteryPack
          - entities.BatteryPack.fields.assembly_status
          - entities.BatteryPack.fields.logistics_status
        distinguishing_aspect: |
          BatteryPack has TWO parallel state axes (assembly_status × logistics_status)
          on a single row. Each evolves independently between guarded join points:
          a pack can be TEST_QUEUED while still NOT_STORED, and READY_TO_STORE
          while PICKED is forbidden — but CLASSIFIED/NOT_STORED then
          READY_TO_STORE/NOT_STORED → STAGED → ... → SHIPPED with assembly_status
          frozen at READY_TO_STORE proves the axes are parallel.
        test_recipe:
          setup:
            - "Pack PK built through READY_TO_STORE (assembly axis); never placed"
            - "After READY_TO_STORE, observe logistics axis still NOT_STORED"
            - "Drive logistics axis NOT_STORED → STAGED → STORED → PICKED → PACKED_FOR_SHIP → SHIPPED → DELIVERED; assembly axis frozen at READY_TO_STORE throughout"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-E", storage_capacity_wh: 50000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-E", cell_count: 100, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.55, visual_defect_count: 0, outcome: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/pack-boms"
              payload: { bom_code: "BOM-E", cell_lot_id: "${lot_id}", cells_required: 4, series_count: 2, parallel_count: 2, welding_profile: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { bom_id: $.data.id, bom_v: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs"
              payload: { bom_id: "${bom_id}", expected_bom_version: "${bom_v}" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { pack_id: $.data.id, pack_v0: $.data.version }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records"
              payload: { weld_count: 8, current_amps: 80.0, pulse_ms: 15, electrode_force_n: 30.0, weld_profile_used: "WELD_PROFILE_A" }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { wr_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/welding-records/${wr_id}/certify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares"
              payload: { firmware_version: "1.0.0", binary_sha256: "d1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5", supports_soc_hysteresis: false }
              as: AssemblyLead
              as_user_id: "al-1"
              captures: { fw_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/submit-review"
              payload: {}
              as: AssemblyLead
              as_user_id: "al-1"
            - call: "POST /api/integration-programs/${prog_id}/bms-firmwares/${fw_id}/approvals"
              payload: { decision: "APPROVE", rationale: "Bench pass" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/bms-flash-records"
              payload: { bms_firmware_id: "${fw_id}" }
              as: AssemblyLead
              as_user_id: "al-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { doss_id: $.data.id }
            - call: "PUT /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}"
              payload:
                expected_pack_version: "${pack_v0} + 3"
                altitude_sim_kpa: 11.6
                thermal_cycles: 10
                vibration_minutes: 180
                shock_g_peak: 150.0
                external_short_circuit_ok: true
                impact_crush_ok: true
                overcharge_ok: true
                forced_discharge_ok: true
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}/submit"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/safety-test-dossiers/${doss_id}/approve"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
            # Now drive logistics axis; assembly axis frozen at READY_TO_STORE
            - call: "POST /api/integration-programs/${prog_id}/storage-locations"
              payload: { location_code: "SL-E", fire_zone: "ZONE_A", capacity_wh: 5000, accepts_soc_band: ["SOC_MID"] }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { loc_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/storage-placements"
              payload: { storage_location_id: "${loc_id}", battery_pack_id: "${pack_id}" }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { place_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/storage-placements/${place_id}/store"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
            - call: "POST /api/integration-programs/${prog_id}/battery-packs/${pack_id}/pick"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments"
              payload: { carrier_code: "UPS-DG", un_class_code: "UN3480", declared_weight_kg: 5.00 }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/attach"
              payload: { battery_pack_id: "${pack_id}" }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/tender"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "lc-1"
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/carrier-accept"
              payload: {}
              as: CarrierAgent
              as_user_id: "ca-1"
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/mark-in-transit"
              payload: {}
              as: CarrierAgent
              as_user_id: "ca-1"
          trigger:
            - call: "POST /api/integration-programs/${prog_id}/transport-shipments/${ship_id}/mark-delivered"
              payload: {}
              as: CarrierAgent
              as_user_id: "ca-1"
            - call: "GET /api/integration-programs/${prog_id}/battery-packs/${pack_id}"
              payload: {}
              as: Any
              captures: { asmb: $.data.assembly_status, logi: $.data.logistics_status }
          assert:
            - "BatteryPack.${pack_id}.assembly_status == READY_TO_STORE"
            - "BatteryPack.${pack_id}.logistics_status == DELIVERED"
            - "BatteryPack.${pack_id}.disposition == IN_SERVICE"

      - name: cell_lot_cyclic_retest_loop_bounded
        grounds:
          - state_machines.CellLot.REJECTED_to_QUARANTINE
          - state_machines.CellLot.QUARANTINE_to_QUARANTINE
        distinguishing_aspect: |
          CellLot exhibits a cycle (REJECTED → QUARANTINE via retest, plus
          QUARANTINE → QUARANTINE self-loop on FAIL_SOFT) with a termination
          bound (quarantine_cycle_count < 2 enforced on retest endpoint).
        test_recipe:
          setup:
            - "Program P open"
            - "CellLot L received; quarantined; FAIL_SOFT (cycle_count=1, stays QUARANTINE)"
            - "Second inspection FAIL_HARD → REJECTED"
            - "Retest → QUARANTINE (cycle_count=2)"
            - "Third inspection FAIL_HARD → REJECTED"
            - "Now cycle_count == 2 → next retest must be rejected"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-F", storage_capacity_wh: 50000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
              payload: { lot_code: "LOT-F", cell_count: 50, rated_capacity_mah: 3000, receiving_soc_percent: 40.0 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { lot_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/quarantine"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            # First inspection FAIL_SOFT — self-loop, count=1
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.50, visual_defect_count: 1, outcome: "FAIL_SOFT" }
              as: QualityEngineer
              as_user_id: "qe-1"
            # Second inspection FAIL_HARD → REJECTED
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.10, visual_defect_count: 12, outcome: "FAIL_HARD" }
              as: QualityEngineer
              as_user_id: "qe-1"
            # Retest — allowed (count was 1 < 2), goes to QUARANTINE with count=2
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/retest"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            # Third inspection FAIL_HARD → REJECTED again
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/inspections"
              payload: { measured_soc_percent: 40.0, measured_voltage_v: 3.05, visual_defect_count: 20, outcome: "FAIL_HARD" }
              as: QualityEngineer
              as_user_id: "qe-1"
          trigger:
            # Fourth retest must fail (count == 2 not < 2)
            - call: "POST /api/integration-programs/${prog_id}/cell-lots/${lot_id}/retest"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RETEST_LIMIT_EXCEEDED"
            - "CellLot.${lot_id}.status == REJECTED"
            - "CellLot.${lot_id}.quarantine_cycle_count == 2"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: recall_activation_cascades_pack_placement_slot_program
        grounds:
          - state_machines.RecallCampaign.DRAFT_to_ACTIVE
          - state_machines.BatteryPack.READY_TO_STORE_to_RECALLED
          - state_machines.StoragePlacement.STAGED_to_RELEASED
        distinguishing_aspect: |
          Depth ≥3 chain triggered by RecallCampaign.activate: recall → pack
          (RECALLED) → placement (force-RELEASED) → slot wh_occupied decrement →
          program wh_committed decrement. Each link is CAUSED by the prior link,
          not directly by the original action.
        test_recipe:
          setup:
            - "Program P capacity 10000; lot accepted SOC=40.0; BOM; pack PK energy=43.20 READY_TO_STORE"
            - "StorageLocation SL capacity 5000 accepts SOC_MID"
            - "PK placed at SL and STORED"
            - "SL.wh_occupied == 43.20; P.wh_committed == 43.20"
          setup_api_calls:
            - call: "POST /api/integration-programs"
              payload: { program_code: "PRG-G", storage_capacity_wh: 10000 }
              as: SafetyOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /api/integration-programs/${prog_id}/cell-lots"
