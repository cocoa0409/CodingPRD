        claim_type: variant_divergence
        grounds:
          - calculations.volatile_solids_reduction
          - entities.SolidsBatch.fields.vsr_pct_van_kleeck
          - entities.SolidsBatch.fields.vsr_pct_mass_balance
        excluded_because:
          difficulty_instance: dual_variant_calc / vsr_van_kleeck_gates_while_mass_balance_only_reports
          rationale: "Both variants are computed from identical inputs and asserted at 47.62 and 37.14 by the named §1.8 instance, together with the fact that only van Kleeck gates certification."

      - name: calc_agronomic_rate_cap_four_way_nested_minimum
        claim_type: correct_result
        grounds:
          - calculations.agronomic_rate_cap
          - entities.ApplicationEvent.fields.agronomic_rate_cap_dry_tons_per_acre
          - entities.ApplicationEvent.fields.binding_rate_constraint
        excluded_because:
          difficulty_instance: combinatorial_formula / agronomic_cap_nested_min_selects_nitrogen_over_three_rivals
          rationale: "The nitrogen, phosphorus, APLR and agreement candidates and the 9.88 dry tons/acre winner with binding_rate_constraint NITROGEN are asserted by the named §1.8 instance."

      - name: calc_loading_ledger_rounds_per_entry_then_sums
        claim_type: precision
        grounds:
          - calculations.cumulative_loading_ledger
          - entities.LoadingLedgerEntry.fields.kg_per_hectare_delta
          - endpoints.GET_/land-application-sites/{siteId}/loading-summary
        excluded_because:
          difficulty_instance: combinatorial_formula / loading_ledger_rounds_each_entry_before_summing
          rationale: "The pinned round-then-sum order (two 0.0448 entries summing to 0.0896, never 0.0897) and the resulting headroom figures are asserted by the named §1.8 instance."

      - name: calc_outlet_cost_tier_lookup_after_fuel_escalator
        claim_type: correct_result
        grounds:
          - calculations.outlet_cost_comparison
          - entities.DiversionOrder.fields.surcharge_pct
          - endpoints.GET_/diversion-orders/{orderId}/cost-comparison
        excluded_because:
          difficulty_instance: combinatorial_formula / outlet_cost_escalator_applies_to_hauling_before_tier_lookup
          rationale: "The six pinned steps, the tier boundary crossing and the per-outlet comparison rows are asserted by the named §1.8 instance."

      - name: calc_storage_projection_zero_net_change_sentinel
        claim_type: correct_result
        grounds:
          - calculations.storage_drawdown_projection
          - entities.TreatmentFacility.fields.days_of_capacity
          - endpoints.GET_/treatment-facilities/{facilityId}/storage-projection
        excluded_because:
