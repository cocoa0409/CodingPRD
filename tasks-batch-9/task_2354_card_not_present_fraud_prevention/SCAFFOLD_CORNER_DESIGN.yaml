      - name: performance_cohort_selector_defaults_to_decision_cohort
        claim_type: variant_selection
        grounds:
          - calculations.rule_pack_performance_metrics.variants
          - endpoints[GET /fraud/rule-packs/{id}/performance]
        distinguishing_aspect: "The cohort query parameter is the variant selector: omitting it must reproduce cohort=DECISION_COHORT exactly (denominator 2, insult_rate 0.5000), while cohort=GOOD_CUSTOMER_COHORT selects a cohort that is empty here and must report the guarded 0.0000 rather than falling back to the decision cohort's rate."
        test_recipe:
          setup:
            - "BOOT-W. Assessment A1 (amount 20000, p 0.4021 -> blended 39.95) is scored to DECIDED_APPROVE; assessment A2 (amount 20000, p 0.6806 -> model_points 86.67 -> blended 60.00) is scored to DECIDED_DECLINE at the inclusive decline floor."
            - "Neither assessment has good_customer_at_decision true: A1 was decided when approved_count was 0 and A2 when approved_count was 1, both below GOOD_CUSTOMER_MIN_APPROVED."
            - "No chargeback exists, so both rows carry outcome_label UNKNOWN."
          setup_api_calls:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
