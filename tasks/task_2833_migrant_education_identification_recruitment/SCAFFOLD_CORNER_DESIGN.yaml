            - "first read: data.move_band_points == 0, data.interruption_points == 4, data.academic_points == 28, data.credit_points == 9 and data.pfs_score == 41 with data.pfs_flag == false"
            - "second read: data.recent_verified_moves == 1 - only ${move_3_id} entered the input set"
            - "second read: data.move_band_points == 18 and data.pfs_score == 59 (18 + 4 + 28 + 9) with data.pfs_flag == false, since 59 < 60"
