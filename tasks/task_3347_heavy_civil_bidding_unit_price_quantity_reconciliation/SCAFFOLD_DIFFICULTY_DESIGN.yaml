        as: ContractingOfficer
        captures:
          capsum_err: $.data.error_id
      assert:
      - error response error_id == ERR_AGGREGATE_CAPACITY_EXCEEDED
      - error response http_status == 422
      - Surety.${s_o2}.capacity_consumed_cents == 120000000
      - Surety.${s_o2}.available_capacity_cents == 80000000
      - SuretyCommitment.${cm_o2}.commitment_status == RESERVED
