# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims not already
# probed by §1.8. Enumerated from references/claim-extraction-guide.md against
# SCAFFOLD.yaml §1.1–§1.7. Negative-trigger instance names follow the linter's
# recognized patterns so intentional role/payload rejections are not flagged.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ entities
  - section: entities
    instances:
      - name: create_client_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /clients with required fields -> 201; id/created_at/version(=1)/status(INTAKE) system-generated."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "New Client", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 3 }
              as: IntakeCoordinator
              captures: { cid: $.data.id }
          assert:
            - "Response 201; data.id is a non-empty UUID; data.status == INTAKE; data.version == 1; data.created_at present"

      - name: create_client_missing_payer_type_returns_422
        claim_type: Required Fields
        grounds: [entities.Client.fields.payer_type, "validations[priority=5]"]
        distinguishing_aspect: "Omitting required payer_type -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "No Payer", dob: "2015-01-01" }
              as: IntakeCoordinator
          assert: ["Response 422 error_id == ERR_VALIDATION"]

      - name: get_client_nonexistent_returns_404
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_CLIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /clients/{unknown} -> ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IntakeCoordinator
          assert: ["Response 404 error_id == ERR_CLIENT_NOT_FOUND"]

      - name: create_therapist_invalid_discipline_returns_422
        claim_type: Type Constraints
        grounds: [entities.Therapist.fields.discipline, "validations[priority=5]"]
        distinguishing_aspect: "discipline not in {MUSIC,ART} -> ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /therapists"
              payload: { full_name: "Bad D", discipline: "DANCE", credential: "X" }
              as: IntakeCoordinator
          assert: ["Response 422 error_id == ERR_VALIDATION"]

      - name: computed_visits_remaining_on_client_create
        claim_type: Computed Fields
        grounds: [entities.Client.fields.insurance_visits_remaining, entities.Client.fields.insurance_visits_used]
        distinguishing_aspect: "insurance_visits_remaining derived as authorized(7) - used(0) at create."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Ins C", dob: "2015-01-01", payer_type: "INSURANCE", insurance_payer_name: "BlueCo", insurance_visits_authorized: 7 }
              as: IntakeCoordinator
              captures: { cid: $.data.id }
          assert:
            - "data.insurance_visits_used == 0"
            - "data.insurance_visits_remaining == 7"

      - name: list_sessions_pagination_returns_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /sessions returns array envelope with limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Empty DB (zero sessions acceptable)."]
          setup_api_calls: []
          trigger:
            - call: "GET /sessions"
              payload: { limit: 10, offset: 0 }
              as: IntakeCoordinator
          assert:
            - "response_type == array; meta.api_request_id present"
            - "pagination fields total_count and has_more present"

  # ------------------------------------------------------------ state_machines
  - section: state_machines
    instances:
      - name: activate_already_active_plan_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.TreatmentPlan.DRAFT_to_ACTIVE, "errors[ERR_PLAN_INVALID_STATE]"]
        distinguishing_aspect: "Activating an ACTIVE plan (no DRAFT/UNDER_REVISION source) -> ERR_PLAN_INVALID_STATE."
        test_recipe:
          setup: ["A plan already ACTIVE."]
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 40 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { pid: $.data.id }
            - call: "POST /treatment-plans/${pid}/activate"
              payload: {}
              as: ClinicalDirector
          trigger:
            - call: "POST /treatment-plans/${pid}/activate"
              payload: {}
              as: ClinicalDirector
          assert: ["Response 409 error_id == ERR_PLAN_INVALID_STATE"]

      - name: assess_declined_referral_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Referral.RECEIVED_to_DECLINED, "errors[ERR_REFERRAL_INVALID_STATE]"]
        distinguishing_aspect: "Re-assessing a DECLINED (terminal) referral -> ERR_REFERRAL_INVALID_STATE."
        test_recipe:
          setup: ["A referral assessed NOT_APPROPRIATE -> DECLINED."]
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { cid: $.data.id }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/assess"
              payload: { recommendation: "NOT_APPROPRIATE", baseline_score: 10 }
              as: Therapist
              as_user_id: "${ther_id}"
          trigger:
            - call: "POST /referrals/${ref}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 40 }
              as: Therapist
              as_user_id: "${ther_id}"
          assert: ["Response 409 error_id == ERR_REFERRAL_INVALID_STATE"]

      - name: referral_decline_branch_sets_declined
        claim_type: Valid Transition
        grounds: [state_machines.Referral.RECEIVED_to_DECLINED]
        distinguishing_aspect: "assess with NOT_APPROPRIATE routes RECEIVED -> DECLINED (branch fork), not ASSESSED."
        test_recipe:
          setup: ["A RECEIVED referral."]
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { cid: $.data.id }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref: $.data.id }
          trigger:
            - call: "POST /referrals/${ref}/assess"
              payload: { recommendation: "NOT_APPROPRIATE", baseline_score: 12 }
              as: Therapist
              as_user_id: "${ther_id}"
          assert:
            - "data.status == DECLINED"
            - "data.assessed_by_therapist_id == ${ther_id}"

      - name: plan_create_on_declined_referral_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Referral.ASSESSED_to_CONVERTED, "errors[ERR_REFERRAL_INVALID_STATE]"]
        distinguishing_aspect: "Creating a plan from a DECLINED referral (not ASSESSED+recommended) -> ERR_REFERRAL_INVALID_STATE."
        test_recipe:
          setup: ["A DECLINED referral."]
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/assess"
              payload: { recommendation: "NOT_APPROPRIATE", baseline_score: 10 }
              as: Therapist
              as_user_id: "${ther_id}"
          trigger:
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
          assert: ["Response 409 error_id == ERR_REFERRAL_INVALID_STATE"]

      - name: goal_auto_met_at_attendance_boundary
        claim_type: Bubble up
        grounds: [state_machines.Goal.OPEN_to_MET, calculations.goal_progress, entities.Goal.fields.progress_attendance]
        distinguishing_aspect: "target_sessions=1: completing one attended session yields progress_attendance==1.00 and auto-transitions Goal -> MET."
        test_recipe:
          setup: ["ACTIVE plan; goal target_sessions=1; one INDIVIDUAL session with the client enrolled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 40 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { pid: $.data.id }
            - call: "POST /treatment-plans/${pid}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${pid}/goals"
              payload: { description: "g", target_sessions: 1, weight: 1.0 }
              as: ClinicalDirector
              captures: { gid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "R", capacity: 3 }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${rid}", plan_id: "${pid}", goal_id: "${gid}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sid: $.data.id }
            - call: "POST /sessions/${sid}/enrollments"
              payload: { client_id: "${cid}" }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:30:00Z" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /sessions/${sid}/complete"
              payload: { attended_client_ids: ["${cid}"] }
              as: Therapist
              as_user_id: "${ther_id}"
          assert:
            - "Goal.${gid}.progress_attendance == 1.00"
            - "Goal.${gid}.status == MET"

      - name: cancel_completed_session_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Session.SCHEDULED_to_CANCELLED, "errors[ERR_SESSION_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal scheduling) session -> ERR_SESSION_INVALID_STATE."
        test_recipe:
          setup: ["A COMPLETED session (client attended)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 40 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { pid: $.data.id }
            - call: "POST /treatment-plans/${pid}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${pid}/goals"
              payload: { description: "g", target_sessions: 6, weight: 1.0 }
              as: ClinicalDirector
              captures: { gid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "R", capacity: 3 }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${rid}", plan_id: "${pid}", goal_id: "${gid}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sid: $.data.id }
            - call: "POST /sessions/${sid}/enrollments"
              payload: { client_id: "${cid}" }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:30:00Z" }
              as: IntakeCoordinator
            - call: "POST /sessions/${sid}/complete"
              payload: { attended_client_ids: ["${cid}"] }
              as: Therapist
              as_user_id: "${ther_id}"
          trigger:
            - call: "POST /sessions/${sid}/cancel"
              payload: {}
              as: Therapist
              as_user_id: "${ther_id}"
          assert: ["Response 409 error_id == ERR_SESSION_INVALID_STATE"]

      - name: complete_before_start_utc_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Session.SCHEDULED_to_COMPLETED, "errors[ERR_SESSION_INVALID_STATE]"]
        distinguishing_aspect: "Completing while current_utc(2026-06-01T08:00) < start_utc(09:00) -> ERR_SESSION_INVALID_STATE."
        test_recipe:
          setup: ["A SCHEDULED session at 09:00 with clock at 08:00; client enrolled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", dob: "2015-01-01", payer_type: "SELF_PAY", household_income_cents: 4000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 40 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { pid: $.data.id }
            - call: "POST /treatment-plans/${pid}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${pid}/goals"
              payload: { description: "g", target_sessions: 6, weight: 1.0 }
              as: ClinicalDirector
              captures: { gid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "R", capacity: 3 }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${rid}", plan_id: "${pid}", goal_id: "${gid}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sid: $.data.id }
            - call: "POST /sessions/${sid}/enrollments"
              payload: { client_id: "${cid}" }
              as: Therapist
              as_user_id: "${ther_id}"
          trigger:
            - call: "POST /sessions/${sid}/complete"
              payload: { attended_client_ids: ["${cid}"] }
              as: Therapist
              as_user_id: "${ther_id}"
          assert: ["Response 409 error_id == ERR_SESSION_INVALID_STATE"]

      - name: adjudicate_voided_superbill_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Superbill.SUBMITTED_to_VOIDED, "errors[ERR_SUPERBILL_INVALID_STATE]"]
        distinguishing_aspect: "Adjudicating a VOIDED (terminal) superbill -> ERR_SUPERBILL_INVALID_STATE."
        test_recipe:
          setup: ["An INSURANCE superbill created then voided."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", dob: "2015-01-01", payer_type: "INSURANCE", insurance_payer_name: "BlueCo", insurance_coinsurance_pct: 0.20, insurance_contracted_rate_cents: 12503, insurance_visits_authorized: 3 }
              as: IntakeCoordinator
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${cid}", referral_source: "S", reason: "x", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 40 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${cid}/treatment-plans"
              payload: { referral_id: "${ref}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { pid: $.data.id }
            - call: "POST /treatment-plans/${pid}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${pid}/goals"
              payload: { description: "g", target_sessions: 6, weight: 1.0 }
              as: ClinicalDirector
              captures: { gid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "R", capacity: 3 }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${rid}", plan_id: "${pid}", goal_id: "${gid}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sid: $.data.id }
            - call: "POST /sessions/${sid}/enrollments"
              payload: { client_id: "${cid}" }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:30:00Z" }
              as: IntakeCoordinator
            - call: "POST /sessions/${sid}/complete"
              payload: { attended_client_ids: ["${cid}"] }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /superbills"
              payload: { session_id: "${sid}", client_id: "${cid}" }
              as: BillingSpecialist
              captures: { sb: $.data.id }
            - call: "POST /superbills/${sb}/void"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /superbills/${sb}/adjudicate"
              payload: { allowed_amount_cents: 10000 }
              as: BillingSpecialist
          assert: ["Response 409 error_id == ERR_SUPERBILL_INVALID_STATE"]

  # ------------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: contract_budget_boundary_and_exceeded
        claim_type: Constants Applied
        grounds: [calculations.contract_budget_check, "errors[ERR_CONTRACT_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "budget 5000/rate 5000: first contract session succeeds (spent 0+5000<=5000, strict > not tripped); a second trips 10000>5000 -> ERR_CONTRACT_BUDGET_EXCEEDED."
        test_recipe:
          setup: ["ACTIVE plan+goal; contract budget_cents=5000 rate_cents_per_session=5000."]
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
