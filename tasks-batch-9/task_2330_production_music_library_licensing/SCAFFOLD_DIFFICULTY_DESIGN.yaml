  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: sync_request_revision_cycle_then_edit_branch_to_delivery
        grounds:
          - state_machines.SyncRequest.QUOTED_to_REVISION_REQUESTED
          - state_machines.SyncRequest.REVISION_REQUESTED_to_QUOTED
          - state_machines.SyncRequest.ACCEPTED_to_EDIT_IN_PROGRESS
          - state_machines.SyncRequest.EDIT_IN_PROGRESS_to_DELIVERED
          - state_machines.SyncRequest.ACCEPTED_to_DELIVERED
          - entities.SyncRequest.fields.revision_round
          - entities.SyncRequest.fields.delivered_asset_count
          - validations[priority=33]
        distinguishing_aspect: |
          SyncRequest is non-linear in two ways at once on the SyncRequest entity: the cycle
          QUOTED -> REVISION_REQUESTED -> QUOTED re-runs the pricing side effect and lifts
          revision_round to 1, and the fork out of ACCEPTED has two branches whose guards differ, so
          the direct ACCEPTED -> DELIVERED edge is refused with ERR_EDIT_PASS_REQUIRED while the
          ACCEPTED -> EDIT_IN_PROGRESS -> DELIVERED path succeeds on identical input.
        test_recipe:
          setup:
            - "Composer with an ACTIVE ROYALTY_SPLIT agreement and one CATALOGED composition."
            - "BROADCAST_TV tier base_rate_cents 300000, term range 1-120; licensee credit_limit_cents 5000000."
            - "SyncRequest with custom_edit_requested true, stems_requested true and alternate_lengths_sec [30, 60], BROADCAST_TV / NATIONAL / 12 months, reviewed."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Owen Frey", pro_affiliation: "SESAC", payee_country: "US", tax_withholding_pct: 0.30 }
              as: RightsManager
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 60.00, publisher_share_pct: 40.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Owen Frey" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Glasshouse", duration_sec: 165, tempo_bpm: 128, genre: "ELECTRONIC", mood_tags: ["QUIRKY", "UPLIFTING"], instrumentation: ["SYNTH"] }
              as: CatalogAdmin
              captures: { comp1: $.data.id }
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
              captures: { comp1_v: $.data.version }
            - call: "POST /music-library/license-tiers"
              payload: { code: "BTV-STD", media_type: "BROADCAST_TV", allowed_scales: ["LOCAL", "NATIONAL", "WORLDWIDE"], base_rate_cents: 300000, min_term_months: 1, max_term_months: 120, per_use_eligible: true, blanket_eligible: false }
              as: CatalogAdmin
              captures: { tierBtv: $.data.id }
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Foxglove Productions", licensee_type: "PRODUCTION_COMPANY", credit_limit_cents: 5000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${comp1}", licensee_id: "${lee1}", tier_id: "${tierBtv}", media_type: "BROADCAST_TV", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 12, exclusive_requested: false, custom_edit_requested: true, stems_requested: true, alternate_lengths_sec: [30, 60], rush_requested: false, brief_note: "need a 30 and a 60 cutdown" }
              as: LicensingAgent
              captures: { sr1: $.data.id }
            - call: "POST /music-library/sync-requests/${sr1}/review"
              payload: {}
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
          trigger:
            - call: "POST /music-library/sync-requests/${sr1}/request-revision"
              payload: { revision_note: "make it two years", revised_term_months: 24 }
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/accept"
              payload: {}
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/licenses"
              payload: { license_mode: "PER_USE", sync_request_id: "${sr1}", expected_composition_version: "${comp1_v}" }
              as: LicensingAgent
              captures: { lic1: $.data.id }
            - call: "POST /music-library/sync-requests/${sr1}/deliver"
              payload: { delivered_asset_count: 4, delivery_note: "skipping the edit pass" }
              as: CatalogAdmin
            - call: "POST /music-library/sync-requests/${sr1}/start-edit"
              payload: { edit_note: "cutdowns plus stems" }
              as: CatalogAdmin
            - call: "POST /music-library/sync-requests/${sr1}/deliver"
              payload: { delivered_asset_count: 4, delivery_note: "master, stems, 30s, 60s" }
              as: CatalogAdmin
          assert:
            - "the first quote (before the revision) set quoted_fee_cents == 489000 (core 390000 plus addons 45000 + 30000 + 2*12000)"
            - "after request-revision: SyncRequest.${sr1}.status == REVISION_REQUESTED, revision_round == 1, quoted_fee_cents == null, quote_expires_at == null"
            - "Licensee.${lee1}.reserved_spend_cents == 0 while the request sits in REVISION_REQUESTED"
            - "after the second quote: status == QUOTED, quoted_spend_basis_cents == 664500, quoted_discount_pct == 5.00, quoted_fee_cents == 631275"
            - "License.${lic1}.final_fee_cents == 631275 and License.${lic1}.term_end == 2028-08-31T00:00:00Z"
            - "the deliver call made from ACCEPTED returns error_id == ERR_EDIT_PASS_REQUIRED with status 409 and leaves SyncRequest.${sr1}.status == ACCEPTED"
            - "after start-edit: SyncRequest.${sr1}.status == EDIT_IN_PROGRESS"
            - "after the second deliver: SyncRequest.${sr1}.status == DELIVERED and delivered_asset_count == 4"
            - "Licensee.${lee1}.committed_spend_cents == 631275 and reserved_spend_cents == 0 after issuance"

      - name: composition_catalog_and_availability_axes_move_independently
        grounds:
          - state_machines.Composition.INGESTED_to_CATALOGED
          - state_machines.Composition.AVAILABLE_to_RESTRICTED
          - state_machines.Composition.RESTRICTED_to_AVAILABLE
          - state_machines.Composition.AVAILABLE_to_WITHDRAWN
          - entities.Composition.fields.catalog_status
          - entities.Composition.fields.availability_status
          - entities.Composition.fields.open_claim_count
        distinguishing_aspect: |
          A different entity from the SyncRequest instance and a different flavour of non-linearity:
          Composition carries two parallel state dimensions on one row, so an infringement notice moves
          availability_status AVAILABLE -> RESTRICTED -> AVAILABLE (a cycle) while catalog_status stays
          CATALOGED throughout, and only the retire transition couples the axes by setting RETIRED and
          WITHDRAWN in the same request.
        test_recipe:
          setup:
            - "Composer with an ACTIVE ROYALTY_SPLIT agreement (sync_fee_share_pct 40)."
            - "One composition CATALOGED and AVAILABLE, with no licenses (active_license_count 0)."
            - "One FingerprintMatch on that work: UGC_VIDEO, 225 matched seconds, confidence 99.0."
            - "One InfringementClaim on that match sitting in DETECTED with statutory_amount_cents 225000."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Pia Lindqvist", pro_affiliation: "PRS", payee_country: "SE", tax_withholding_pct: 0.15 }
              as: RightsManager
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Pia Lindqvist" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Northern Drift", duration_sec: 240, tempo_bpm: 100, genre: "CLASSICAL", mood_tags: ["CALM"], instrumentation: ["STRINGS", "PIANO"] }
              as: CatalogAdmin
              captures: { comp1: $.data.id }
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
            - call: "POST /music-library/fingerprint-matches"
              payload: { composition_id: "${comp1}", source_platform: "UGC_VIDEO", source_reference: "ugc:northern-drift-lift", matched_seconds: 225, confidence_pct: 99.0 }
              as: CatalogAdmin
              captures: { fm1: $.data.id }
            - call: "POST /music-library/infringement-claims"
              payload: { fingerprint_match_id: "${fm1}" }
              as: RightsManager
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /music-library/infringement-claims/${cl1}/notice"
              payload: { notice_channel: "PLATFORM_FORM" }
              as: RightsManager
            - call: "PATCH /music-library/compositions/${comp1}"
              payload: { tempo_bpm: 140, mood_tags: ["CALM", "HOPEFUL"] }
              as: CatalogAdmin
            - call: "POST /music-library/infringement-claims/${cl1}/settle"
              payload: { settlement_basis: "STATUTORY", payment_received: true }
              as: RightsManager
            - call: "POST /music-library/compositions/${comp1}/retire"
              payload: { reason: "catalogue pruning" }
              as: CatalogAdmin
          assert:
            - "after notice: Composition.${comp1}.availability_status == RESTRICTED AND catalog_status == CATALOGED (the catalog axis did not move)"
            - "after notice: Composition.${comp1}.open_claim_count == 1 and InfringementClaim.${cl1}.status == NOTICED"
            - "after the PATCH: Composition.${comp1}.tempo_bpm == 140, availability_status still RESTRICTED, catalog_status still CATALOGED"
            - "after settle: Composition.${comp1}.availability_status == AVAILABLE (cycle closed) AND catalog_status == CATALOGED"
            - "after settle: Composition.${comp1}.open_claim_count == 0, InfringementClaim.${cl1}.status == SETTLED, settlement_amount_cents == 225000, settlement_basis == STATUTORY"
            - "InfringementClaim.${cl1}.settlement_floor_cents == 67500 and composer_share_cents == 90000"
            - "after retire: Composition.${comp1}.catalog_status == RETIRED AND availability_status == WITHDRAWN (the only transition that moves both axes)"
            - "Composition.${comp1}.active_license_count == 0 throughout, so the retire precondition holds"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: usage_report_acceptance_five_step_pool_cascade
        grounds:
          - state_machines.UsageReport.SUBMITTED_to_ACCEPTED
          - calculations.blanket_overage
          - calculations.blanket_pool_distribution
          - entities.BlanketAgreement.fields.reported_minutes_ytd
          - entities.BlanketAgreement.fields.overage_minutes
          - entities.UsageReport.fields.pool_cents
          - entities.UsageReport.fields.pool_allocations
          - entities.RoyaltyLedgerEntry.fields.source_type
          - entities.Composer.fields.accrued_unpaid_cents
        distinguishing_aspect: |
          Depth-5 chain from the usage-report acceptance trigger: acceptance freezes the report's
          minutes (step 1), which is the only reason BlanketAgreement.reported_minutes_ytd is recomputed
          (step 2), which is the only reason overage_minutes/overage_cents are re-derived (step 3),
          which is the only reason this report's pool_cents/pool_allocations are computed (step 4), which
          is the only reason two BLANKET_POOL ledger entries (34953 and 10567) exist and move two
          different composers' accrued_unpaid_cents (step 5).
