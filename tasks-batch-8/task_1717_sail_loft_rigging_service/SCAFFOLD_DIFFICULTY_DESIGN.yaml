scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: work_order_provisional_vs_final_invoice_diverge
        grounds:
          - calculations.sail_price
          - calculations.final_invoice
          - entities.LoftWorkOrder.fields.quoted_total_cents
          - entities.LoftWorkOrder.fields.invoiced_total_cents
        distinguishing_aspect: |
          Entity domain LoftWorkOrder: the provisional variant (forward-looking
          from the APPROVED design's option_codes) and the final variant
          (chronological over QC_PASSED jobs + fitted options) produce different
          totals for the same work order when the customer declines an option at
          fit check — provisional includes BATTENS, final excludes it.
        test_recipe:
          setup:
            - "Customer C1 (credit_limit 900000000, balance 0, ACTIVE) owns Boat B1 (racing_class NONE, hull 12.0)"
            - "MeasurementSheet MS1 FROZEN with i=12,j=4,p=15,e=5 → measured_area_sqm = 61.50"
            - "SailDesign D1 APPROVED pinned to MS1, cloth_tier RACE, reinforcement_level 1, option_codes [BATTENS]"
            - "ClothLedgerEntry for RACE with total 500 sqm price 9500/sqm"
            - "LoftWorkOrder WO1 order_kind NEW_SAIL pinned to D1, locked → quoted_total_cents computed"
            - "ProductionJob PJ1 QC_PASSED with reserved_cloth_sqm 61.50"
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C One", email: "c1@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c1_id: $.data.id }
            - call: "POST /lofts/customers/${c1_id}/boats"
              payload: { boat_name: "B1", hull_length_m: 12.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z", running_rigging_hours_accumulated: 0 }
              as: LoftManager
              captures: { b1_id: $.data.id }
            - call: "POST /lofts/boats/${b1_id}/measurement-sheets"
              payload: { i_height_m: 12.0, j_base_m: 4.0, p_main_m: 15.0, e_main_m: 5.0 }
              as: Measurer
              captures: { ms1_id: $.data.id }
            - call: "POST /lofts/boats/${b1_id}/measurement-sheets/${ms1_id}/freeze"
              payload: {}
              as: Measurer
            - call: "GET /lofts/boats/${b1_id}"
              payload: {}
              as: Sailmaker
              captures: { b1_v: $.data.version }
            - call: "POST /lofts/boats/${b1_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms1_id}", cloth_tier: "RACE", reinforcement_level: 1, option_codes: ["BATTENS"], expected_boat_version: "${b1_v}" }
              as: Sailmaker
              captures: { d1_id: $.data.id }
            - call: "POST /lofts/boats/${b1_id}/sail-designs/${d1_id}/submit"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/boats/${b1_id}/sail-designs/${d1_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c1_id}"
            - call: "POST /lofts/cloth-ledger"
              payload: { bolt_code: "RACE-BOLT-1", cloth_tier: "RACE", total_sqm: 500.0, price_per_sqm_cents: 9500 }
              as: LoftManager
            - call: "POST /lofts/work-orders"
              payload: { customer_id: "${c1_id}", boat_id: "${b1_id}", order_kind: "NEW_SAIL", sail_design_id: "${d1_id}" }
              as: LoftManager
              captures: { wo1_id: $.data.id }
            - call: "POST /lofts/work-orders/${wo1_id}/lock-design"
              payload: {}
              as: LoftManager
            - call: "POST /lofts/work-orders/${wo1_id}/production-jobs"
              payload: { bay_code: "BAY_A", scheduled_start_date: "2026-09-01", scheduled_end_date: "2026-09-05" }
              as: Sailmaker
              captures: { pj1_id: $.data.id }
            - call: "POST /lofts/work-orders/${wo1_id}/production-jobs/${pj1_id}/start-cutting"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo1_id}/production-jobs/${pj1_id}/advance"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo1_id}/production-jobs/${pj1_id}/advance"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo1_id}/production-jobs/${pj1_id}/qc-pass"
              payload: {}
              as: Sailmaker
          trigger:
            - call: "GET /lofts/work-orders/${wo1_id}"
              payload: {}
              as: LoftManager
              captures: { quoted: $.data.quoted_total_cents }
            - call: "POST /lofts/work-orders/${wo1_id}/confirm-delivery"
              payload: { fitted_option_codes: [] }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { invoiced: $.data.invoiced_total_cents }
          assert:
            - "LoftWorkOrder.${wo1_id}.quoted_total_cents == 602250"
            - "LoftWorkOrder.${wo1_id}.invoiced_total_cents == 584250"
            - "quoted_total_cents != invoiced_total_cents"

      - name: rigging_calendar_vs_hours_variants_diverge
        grounds:
          - calculations.standing_rigging_replacement_due
          - calculations.running_rigging_replacement_due
          - entities.RiggingInspection.fields.standing_replacement_due_date
          - entities.RiggingInspection.fields.running_replacement_due_hours
        distinguishing_aspect: |
          Entity domain RiggingInspection (a different domain from LoftWorkOrder):
          the calendar-months variant (standing, 120-month threshold) and the
          sail-hours variant (running, 2000-hour threshold) produce different
          verdict floors for the same boat — a 2-year-old boat with 2100
          accumulated hours trips the hours rule but passes the calendar rule.
        test_recipe:
          setup:
            - "Customer C2 owns Boat B2 (standing_rigging_install_date 2025-08-01 = 24 months before 2027-08-01, running_rigging_hours_accumulated 2100)"
            - "RiggingInspection RI1 SCHEDULED with scope FULL"
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C Two", email: "c2@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c2_id: $.data.id }
            - call: "POST /lofts/customers/${c2_id}/boats"
              payload: { boat_name: "B2", hull_length_m: 10.0, racing_class: "J70", standing_rigging_install_date: "2025-08-01T00:00:00Z", running_rigging_hours_accumulated: 2100 }
              as: LoftManager
              captures: { b2_id: $.data.id, b2_v: $.data.version }
            - call: "POST /lofts/boats/${b2_id}/rigging-inspections"
              payload: { rigging_scope: "FULL", expected_boat_version: "${b2_v}" }
              as: Rigger
              captures: { ri1_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b2_id}/rigging-inspections/${ri1_id}/report"
              payload: { verdict: "PASS" }
              as: Rigger
          assert:
            - "RiggingInspection.${ri1_id}.standing_replacement_due_date == 2035-08-01T00:00:00Z (install + 120 months, calendar variant)"
            - "RiggingInspection.${ri1_id}.running_replacement_due_hours == 2000 (hours variant threshold)"
            - "The hours variant overrides the inspector PASS to ADVISORY (2100 >= 2000) while the calendar variant does not override (24 < 120) — net verdict == ADVISORY"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) vs (b))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sail_price_tiered_multi_input_mode_a
        grounds:
          - calculations.sail_price
          - entities.SailDesign.fields.cloth_tier
          - entities.SailDesign.fields.reinforcement_level
          - entities.Boat.fields.racing_class
        distinguishing_aspect: |
          Mode (a) formula with >=3 inputs and non-linear interaction: cloth
          tier rate x area, conditional branch on area > 150.00 (strict) that
          multiplies by (1 + 0.04 * reinforcement_level), additive options, and
          a class-complexity multiplier keyed on boat.racing_class — nested
          branch + tier selection in one formula.
        test_recipe:
          setup:
            - "Customer C3 (credit 900000000) owns Boat B3 (racing_class TP52 → complexity 1.15)"
            - "MS3 FROZEN with i=21,j=6,p=22,e=8 → area = 63 + 88 = 151.00 sqm (> 150.00 → heavy-duty branch)"
            - "SailDesign D3 APPROVED: cloth_tier CRUISE (4200/sqm), reinforcement_level 2, option_codes [BATTENS, UV_STRIP]"
            - "WO3 NEW_SAIL pinned to D3"
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C Three", email: "c3@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c3_id: $.data.id }
            - call: "POST /lofts/customers/${c3_id}/boats"
              payload: { boat_name: "B3", hull_length_m: 15.6, racing_class: "TP52", standing_rigging_install_date: "2024-01-01T00:00:00Z", running_rigging_hours_accumulated: 0 }
              as: LoftManager
              captures: { b3_id: $.data.id }
            - call: "POST /lofts/boats/${b3_id}/measurement-sheets"
              payload: { i_height_m: 21.0, j_base_m: 6.0, p_main_m: 22.0, e_main_m: 8.0 }
              as: Measurer
              captures: { ms3_id: $.data.id }
            - call: "POST /lofts/boats/${b3_id}/measurement-sheets/${ms3_id}/freeze"
              payload: {}
              as: Measurer
            - call: "GET /lofts/boats/${b3_id}"
              payload: {}
              as: Sailmaker
              captures: { b3_v: $.data.version }
            - call: "POST /lofts/boats/${b3_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms3_id}", cloth_tier: "CRUISE", reinforcement_level: 2, option_codes: ["BATTENS", "UV_STRIP"], expected_boat_version: "${b3_v}" }
              as: Sailmaker
              captures: { d3_id: $.data.id }
            - call: "POST /lofts/boats/${b3_id}/sail-designs/${d3_id}/submit"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/boats/${b3_id}/sail-designs/${d3_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c3_id}"
            - call: "POST /lofts/work-orders"
              payload: { customer_id: "${c3_id}", boat_id: "${b3_id}", order_kind: "NEW_SAIL", sail_design_id: "${d3_id}" }
              as: LoftManager
              captures: { wo3_id: $.data.id }
          trigger:
            - call: "POST /lofts/work-orders/${wo3_id}/lock-design"
              payload: {}
              as: LoftManager
          assert:
            - "LoftWorkOrder.${wo3_id}.quoted_total_cents == round_half_up((151.00*4200*(1+0.04*2) + 18000 + 9000) * 1.15) == round_half_up((684936 + 27000) * 1.15) == round_half_up(818726.4) == 818726"

      - name: storage_fee_per_item_round_then_sum_mode_b
        grounds:
          - calculations.storage_fee
          - entities.StorageContract.fields.quoted_storage_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the scaffold PINS
          per-item-round-then-sum (each wash fee rounded to cents first, then
          summed, then added to the hull-tier season base). A sum-then-round
          implementation yields a different cent value when fractional pricing
          applies; the pinned order is the only accepted one.
        test_recipe:
          setup:
            - "Customer C4 owns Boat B4 (hull_length_m 12.0 → season base tier SEASON_BASE_10M_TO_15M = 260000)"
            - "StorageContract SC4 with wash_item_codes [MAIN_WASH, GENOA_WASH, SPINNAKER_WASH, RIG_WASH]"
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C Four", email: "c4@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c4_id: $.data.id }
            - call: "POST /lofts/customers/${c4_id}/boats"
              payload: { boat_name: "B4", hull_length_m: 12.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z", running_rigging_hours_accumulated: 0 }
              as: LoftManager
              captures: { b4_id: $.data.id }
            - call: "POST /lofts/boats/${b4_id}/storage-contracts"
              payload: { season_code: "WINTER_2026", wash_item_codes: ["MAIN_WASH", "GENOA_WASH", "SPINNAKER_WASH", "RIG_WASH"] }
              as: LoftManager
              captures: { sc4_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b4_id}/storage-contracts/${sc4_id}/receive"
              payload: {}
              as: LoftManager
          assert:
            - "StorageContract.${sc4_id}.quoted_storage_fee_cents == 260000 + (14550 + 12350 + 9875 + 21000) == 260000 + 57775 == 317775"
            - "StorageContract.${sc4_id}.contract_status == RECEIVED"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sail_design_revision_loop_cycles_back_to_draft
        grounds:
          - state_machines.SailDesign.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.SailDesign.REVISION_REQUESTED_to_DRAFT
        distinguishing_aspect: |
          Entity SailDesign exhibits a CYCLE: DRAFT→SUBMITTED→REVISION_REQUESTED
          →DRAFT, and the same row loops (revision_number unchanged across the
          loop); the loop can repeat before approval.
        test_recipe:
          setup:
            - "Customer C5 owns Boat B5; MS5 FROZEN; D5 created DRAFT and submitted"
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C Five", email: "c5@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c5_id: $.data.id }
            - call: "POST /lofts/customers/${c5_id}/boats"
              payload: { boat_name: "B5", hull_length_m: 9.0, racing_class: "J70", standing_rigging_install_date: "2024-01-01T00:00:00Z", running_rigging_hours_accumulated: 0 }
              as: LoftManager
              captures: { b5_id: $.data.id }
            - call: "POST /lofts/boats/${b5_id}/measurement-sheets"
              payload: { i_height_m: 12.0, j_base_m: 4.0, p_main_m: 15.0, e_main_m: 5.0 }
              as: Measurer
              captures: { ms5_id: $.data.id }
            - call: "POST /lofts/boats/${b5_id}/measurement-sheets/${ms5_id}/freeze"
              payload: {}
              as: Measurer
            - call: "GET /lofts/boats/${b5_id}"
              payload: {}
              as: Sailmaker
              captures: { b5_v: $.data.version }
            - call: "POST /lofts/boats/${b5_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms5_id}", cloth_tier: "CRUISE", reinforcement_level: 1, option_codes: [], expected_boat_version: "${b5_v}" }
              as: Sailmaker
              captures: { d5_id: $.data.id }
            - call: "POST /lofts/boats/${b5_id}/sail-designs/${d5_id}/submit"
              payload: {}
              as: Sailmaker
          trigger:
            - call: "POST /lofts/boats/${b5_id}/sail-designs/${d5_id}/request-revision"
              payload: { rejection_reason: "too heavy" }
              as: Customer
              as_user_id: "${c5_id}"
            - call: "POST /lofts/boats/${b5_id}/sail-designs/${d5_id}/redraft"
              payload: {}
              as: Sailmaker
          assert:
            - "SailDesign.${d5_id}.design_status == DRAFT after the loop"
            - "SailDesign.${d5_id}.revision_number == 1 (loop does not increment revision)"
            - "SailDesign.${d5_id}.rejection_reason == 'too heavy'"

      - name: production_job_qc_fail_loops_back_to_scheduled
        grounds:
          - state_machines.ProductionJob.FINISHING_to_QC_FAILED
          - state_machines.ProductionJob.QC_FAILED_to_SCHEDULED
        distinguishing_aspect: |
          Entity ProductionJob (different entity from SailDesign) exhibits a
          CYCLE: ...→FINISHING→QC_FAILED→SCHEDULED, allowing rework through the
          pipeline again; the same row can loop multiple times.
        test_recipe:
          setup:
            - "WO6 NEW_SAIL DESIGN_LOCKED with PJ6 driven to FINISHING"
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C Six", email: "c6@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c6_id: $.data.id }
            - call: "POST /lofts/customers/${c6_id}/boats"
              payload: { boat_name: "B6", hull_length_m: 11.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z", running_rigging_hours_accumulated: 0 }
              as: LoftManager
              captures: { b6_id: $.data.id }
            - call: "POST /lofts/boats/${b6_id}/measurement-sheets"
              payload: { i_height_m: 12.0, j_base_m: 4.0, p_main_m: 15.0, e_main_m: 5.0 }
              as: Measurer
              captures: { ms6_id: $.data.id }
            - call: "POST /lofts/boats/${b6_id}/measurement-sheets/${ms6_id}/freeze"
              payload: {}
              as: Measurer
            - call: "GET /lofts/boats/${b6_id}"
              payload: {}
              as: Sailmaker
              captures: { b6_v: $.data.version }
            - call: "POST /lofts/boats/${b6_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms6_id}", cloth_tier: "CRUISE", reinforcement_level: 1, option_codes: [], expected_boat_version: "${b6_v}" }
              as: Sailmaker
              captures: { d6_id: $.data.id }
            - call: "POST /lofts/boats/${b6_id}/sail-designs/${d6_id}/submit"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/boats/${b6_id}/sail-designs/${d6_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c6_id}"
            - call: "POST /lofts/cloth-ledger"
              payload: { bolt_code: "CR-BOLT-6", cloth_tier: "CRUISE", total_sqm: 500.0, price_per_sqm_cents: 4200 }
              as: LoftManager
            - call: "POST /lofts/work-orders"
              payload: { customer_id: "${c6_id}", boat_id: "${b6_id}", order_kind: "NEW_SAIL", sail_design_id: "${d6_id}" }
              as: LoftManager
              captures: { wo6_id: $.data.id }
            - call: "POST /lofts/work-orders/${wo6_id}/lock-design"
              payload: {}
              as: LoftManager
            - call: "POST /lofts/work-orders/${wo6_id}/production-jobs"
              payload: { bay_code: "BAY_B", scheduled_start_date: "2026-09-10", scheduled_end_date: "2026-09-12" }
              as: Sailmaker
              captures: { pj6_id: $.data.id }
            - call: "POST /lofts/work-orders/${wo6_id}/production-jobs/${pj6_id}/start-cutting"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo6_id}/production-jobs/${pj6_id}/advance"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo6_id}/production-jobs/${pj6_id}/advance"
              payload: {}
              as: Sailmaker
          trigger:
            - call: "POST /lofts/work-orders/${wo6_id}/production-jobs/${pj6_id}/qc-fail"
              payload: { qc_notes: "seam puckering" }
              as: Sailmaker
            - call: "POST /lofts/work-orders/${wo6_id}/production-jobs/${pj6_id}/reschedule"
              payload: { bay_code: "BAY_B", scheduled_start_date: "2026-09-20", scheduled_end_date: "2026-09-22" }
              as: Sailmaker
          assert:
            - "ProductionJob.${pj6_id}.job_status == SCHEDULED after rework loop"
            - "ProductionJob.${pj6_id}.qc_notes == 'seam puckering'"
            - "ProductionJob.${pj6_id}.scheduled_start_date == '2026-09-20'"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: work_order_cancel_cascades_three_hops
        grounds:
          - state_machines.LoftWorkOrder.OPEN_to_CANCELLED
          - state_machines.ProductionJob.SCHEDULED_to_CANCELLED
          - entities.ClothLedgerEntry.fields.available_sqm
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /work-orders/{id}/cancel: work order
          CANCELLED → (hop 1) ProductionJobs → CANCELLED → (hop 2) each
          cancellation releases reserved_cloth_sqm so ClothLedgerEntry.
          available_sqm rises → (hop 3) the orphaned SailDesign (no remaining
          non-cancelled order references it) → ARCHIVED.
        test_recipe:
          setup:
            - "C7/B7/MS7 FROZEN/D7 APPROVED; CRUISE bolt total 500 sqm; WO7 OPEN with PJ7 SCHEDULED reserving 61.50 sqm (available 438.50)"
            - "WO7 is still OPEN (lock-design NOT called) — cancel is legal from OPEN"
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C Seven", email: "c7@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c7_id: $.data.id }
            - call: "POST /lofts/customers/${c7_id}/boats"
              payload: { boat_name: "B7", hull_length_m: 11.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z", running_rigging_hours_accumulated: 0 }
              as: LoftManager
              captures: { b7_id: $.data.id }
            - call: "POST /lofts/boats/${b7_id}/measurement-sheets"
              payload: { i_height_m: 12.0, j_base_m: 4.0, p_main_m: 15.0, e_main_m: 5.0 }
              as: Measurer
              captures: { ms7_id: $.data.id }
            - call: "POST /lofts/boats/${b7_id}/measurement-sheets/${ms7_id}/freeze"
              payload: {}
              as: Measurer
            - call: "GET /lofts/boats/${b7_id}"
              payload: {}
              as: Sailmaker
              captures: { b7_v: $.data.version }
            - call: "POST /lofts/boats/${b7_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms7_id}", cloth_tier: "CRUISE", reinforcement_level: 1, option_codes: [], expected_boat_version: "${b7_v}" }
              as: Sailmaker
              captures: { d7_id: $.data.id }
            - call: "POST /lofts/boats/${b7_id}/sail-designs/${d7_id}/submit"
              payload: {}
              as: Sailmaker
            - call: "POST /lofts/boats/${b7_id}/sail-designs/${d7_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c7_id}"
            - call: "POST /lofts/cloth-ledger"
              payload: { bolt_code: "CR-BOLT-7", cloth_tier: "CRUISE", total_sqm: 500.0, price_per_sqm_cents: 4200 }
              as: LoftManager
              captures: { bolt7_id: $.data.id }
            - call: "POST /lofts/work-orders"
              payload: { customer_id: "${c7_id}", boat_id: "${b7_id}", order_kind: "NEW_SAIL", sail_design_id: "${d7_id}" }
              as: LoftManager
              captures: { wo7_id: $.data.id }
            - call: "POST /lofts/work-orders/${wo7_id}/production-jobs"
              payload: { bay_code: "BAY_A", scheduled_start_date: "2026-10-01", scheduled_end_date: "2026-10-03" }
              as: Sailmaker
              captures: { pj7_id: $.data.id }
          trigger:
            - call: "POST /lofts/work-orders/${wo7_id}/cancel"
              payload: {}
              as: LoftManager
          assert:
            - "LoftWorkOrder.${wo7_id}.order_status == CANCELLED"
            - "ProductionJob.${pj7_id}.job_status == CANCELLED (hop 1)"
            - "ClothLedgerEntry.${bolt7_id}.available_sqm == 500.0 (hop 2: reservation released)"
            - "SailDesign.${d7_id}.design_status == ARCHIVED (hop 3: orphaned design archived)"

      - name: rigging_fail_cascades_two_hops_to_mast_events
        grounds:
          - state_machines.RiggingInspection.SCHEDULED_to_REPORTED
          - state_machines.MastServiceEvent.BOOKED_to_RIGGING_HOLD
          - entities.Boat.fields.status
        distinguishing_aspect: |
          Depth-2 chain triggered by POST /rigging-inspections/{id}/report with
          verdict FAIL (different trigger from work-order cancel): inspection
          REPORTED → (hop 1) Boat.status → OUT_OF_SERVICE → (hop 2) every BOOKED
          MastServiceEvent for that boat → RIGGING_HOLD.
        test_recipe:
          setup:
            - "C8 owns B8 (ACTIVE); MastServiceEvent ME8 BOOKED for B8; RI8 SCHEDULED on B8"
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C Eight", email: "c8@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c8_id: $.data.id }
            - call: "POST /lofts/customers/${c8_id}/boats"
              payload: { boat_name: "B8", hull_length_m: 10.5, racing_class: "J105", standing_rigging_install_date: "2024-01-01T00:00:00Z", running_rigging_hours_accumulated: 100 }
              as: LoftManager
              captures: { b8_id: $.data.id }
            - call: "POST /lofts/boats/${b8_id}/mast-service-events"
              payload: { service_kind: "UNSTEP", slot_start_utc: "2026-09-01T08:00:00Z", slot_end_utc: "2026-09-01T12:00:00Z" }
              as: Rigger
              captures: { me8_id: $.data.id }
            - call: "GET /lofts/boats/${b8_id}"
              payload: {}
              as: Rigger
              captures: { b8_v: $.data.version }
            - call: "POST /lofts/boats/${b8_id}/rigging-inspections"
              payload: { rigging_scope: "STANDING", expected_boat_version: "${b8_v}" }
              as: Rigger
              captures: { ri8_id: $.data.id }
          trigger:
            - call: "POST /lofts/boats/${b8_id}/rigging-inspections/${ri8_id}/report"
              payload: { verdict: "FAIL" }
              as: Rigger
          assert:
            - "RiggingInspection.${ri8_id}.inspection_status == REPORTED"
            - "Boat.${b8_id}.status == OUT_OF_SERVICE (hop 1)"
            - "MastServiceEvent.${me8_id}.event_status == RIGGING_HOLD (hop 2, caused by hop 1 + FAIL verdict)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_design_approve
        grounds:
          - validations[priority=5]
          - validations[priority=12]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): approving a design that is
          still DRAFT (never submitted) while the customer's projected balance
          would also exceed credit_limit must return the state error
          ERR_DESIGN_NOT_IN_REQUIRED_STATE (priority 5), not
          ERR_CREDIT_LIMIT_EXCEEDED (priority 12).
        test_recipe:
          setup:
            - "C9 credit_limit_cents 500000, balance 0; B9 with MS9 FROZEN; D9 created but left in DRAFT (never submitted)"
            - "Projected quote (RACE 61.50 sqm = 584250) would exceed the 500000 limit — fiscal rule would also fail"
          setup_api_calls:
