scenario: "2401. Disaster Recovery Testing & Failover Exercise (information technology resilience team): application tiering with recovery time and recovery point objectives agreed with business owners, dependency mapping across applications, data stores and infrastructure to define recovery groups, exercise scoping across tabletop, component failover and full site failover with production impact decisions, runbook maintenance with step-level ownership and last-validated dates, exercise execution with timing measurement against objectives and issue capture, data validation after failover with integrity checks and reconciliation, failback planning and execution with data synchronization, findings remediation with owner assignment and re-test scheduling, audit and regulator evidence packages"
domain_name: "dr-failover-exercise"
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: "Graph constraint"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  # Applications and Assets are peer nodes joined by polymorphic DependencyEdge rows;
  # RecoveryGroup membership is a flat FK on each node; ExerciseScopeItem is a
  # many-to-many junction between Exercise and RecoveryGroup. No nesting in URL paths.
  state_machine_shape: parallel
  # Exercise carries three independent axes (execution_state x data_state x failback_state);
  # Runbook, RunbookStep, Finding and EvidencePackage each carry a revision cycle.
  relationship_patterns:
    - many_to_many        # ExerciseScopeItem joins Exercise <-> RecoveryGroup
    - self_referential    # DependencyEdge joins Application/Asset nodes into a DAG
    - polymorphic         # DependencyEdge.from_node_id / to_node_id resolve by *_node_kind
    - cross_aggregate     # RunbookStep.covers_application_id reaches into the tiering aggregate
    - one_to_many         # Runbook -> RunbookStep, Exercise -> StepExecution
  role_model: segregation_of_duties
  consistency_model: immediate

entities:
  - name: Stakeholder
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: person's display name
      - name: email
        type: string
        source: input
        description: unique contact address
        constraints: "unique across Stakeholder"
      - name: org_roles
        type: array
        source: input
        description: "organisational hats this person wears; the acting X-User-Role must map into this set"
        constraints: "non-empty array of enum {BUSINESS_OWNER, RESILIENCE_COORDINATOR, IT_OPERATOR, RISK_APPROVER, AUDIT_LIAISON}; a person may hold several, which is what makes the segregation-of-duties rules reachable"
      - name: approval_authority_level
        type: enum
        source: input
        description: highest production-impact level this person may approve
        default: LEVEL_1
        constraints: "enum {LEVEL_1, LEVEL_2, LEVEL_3}; ordered LEVEL_1 < LEVEL_2 < LEVEL_3"
      - name: status
        type: enum
        source: input
        description: employment/participation status
        default: ACTIVE
        constraints: "enum {ACTIVE, SUSPENDED}; SUSPENDED set via PATCH /stakeholders/{id}"

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: data-centre display name
      - name: site_code
        type: string
        source: input
        description: short code
        constraints: "unique across Site"
      - name: role
        type: enum
        source: input
        description: whether the site normally runs production or receives failover
        constraints: "enum {PRIMARY, RECOVERY}"
      - name: usable_capacity_units
        type: integer
        source: input
        description: failover capacity units this site can host at once
        constraints: ">= 0"
      - name: reserved_capacity_units
        type: integer
        source: computed
        description: "sum of Exercise.required_capacity_units over exercises on this site in execution_state IN {SCHEDULED, IN_EXECUTION, FAILOVER_COMPLETE}; see calculations.site_reserved_capacity_units"
        default: 0

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: application display name
      - name: app_code
        type: string
        source: input
        description: short code
        constraints: "unique across Application"
      - name: business_owner_id
        type: string
        source: input
        description: "FK -> Stakeholder.id; the business owner who agrees tier/RTO/RPO"
      - name: primary_site_id
        type: string
        source: input
        description: "FK -> Site.id; where the application normally runs"
      - name: recovery_group_id
        type: string
        source: computed
        description: "FK -> RecoveryGroup.id; set by POST /applications/{id}/group-assignments; null until assigned"
        default: null
      - name: criticality_weight
        type: integer
        source: input
        description: business criticality contribution to production-impact scoring
        constraints: "integer 1..10"
      - name: tier_agreement_status
        type: enum
        source: computed
        description: tier negotiation state with the business owner
        default: DRAFT
        constraints: "enum {DRAFT, TIER_PROPOSED, AGREED, CHANGES_REQUESTED}"
      - name: tier
        type: enum
        source: computed
        description: agreed tier, copied from proposed_tier on AGREE
        default: null
        constraints: "enum {TIER_1, TIER_2, TIER_3} or null before first agreement"
      - name: rto_minutes
        type: integer
        source: computed
        description: agreed recovery time objective in minutes, copied from proposed_rto_minutes on AGREE
        default: null
      - name: rpo_minutes
        type: integer
        source: computed
        description: agreed recovery point objective in minutes, copied from proposed_rpo_minutes on AGREE
        default: null
      - name: proposed_tier
        type: enum
        source: input
        description: tier put forward by the resilience coordinator
        default: null
        constraints: "enum {TIER_1, TIER_2, TIER_3}"
      - name: proposed_rto_minutes
        type: integer
        source: input
        description: proposed recovery time objective in minutes
        default: null
        constraints: ">= 0"
      - name: proposed_rpo_minutes
        type: integer
        source: input
        description: proposed recovery point objective in minutes
        default: null
        constraints: ">= 0"
      - name: proposed_by_id
        type: string
        source: computed
        description: "FK -> Stakeholder.id; X-User-ID of the acting coordinator on the latest tier proposal; drives the segregation-of-duties check on tier agreement"
        default: null
      - name: retier_count
        type: integer
        source: computed
        description: number of times an AGREED tier was reopened by a new proposal
        default: 0

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: asset display name
      - name: asset_code
        type: string
        source: input
        description: short code
        constraints: "unique across Asset"
      - name: asset_kind
        type: enum
        source: input
        description: whether this node holds data or is infrastructure
        constraints: "enum {DATA_STORE, INFRA_COMPONENT}"
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; where the asset normally lives"
      - name: recovery_group_id
        type: string
        source: computed
        description: "FK -> RecoveryGroup.id; set by POST /assets/{id}/group-assignments; null until assigned"
        default: null
      - name: replication_mode
        type: enum
        source: input
        description: how data reaches the recovery site
        constraints: "enum {SYNCHRONOUS, ASYNCHRONOUS, BATCH_SNAPSHOT}"
      - name: restore_minutes
        type: integer
        source: input
        description: node weight used by the critical-path projection
        constraints: ">= 0"
      - name: expected_txn_rate_per_minute
        type: integer
        source: input
        description: steady-state write rate, divisor of the TRANSACTION_GAP RPO variant
        default: 0
        constraints: ">= 0"

  - name: ReplicationObservation
    parent: Asset
    common_fields: false
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; the observed asset"
      - name: observed_at
        type: datetime
        source: input
        description: instant the measurement was taken; must not be after the current logical clock
      - name: replication_lag_seconds
        type: integer
        source: input
        description: seconds by which the recovery copy trails the primary
        constraints: ">= 0"
      - name: unreplicated_txn_count
        type: integer
        source: input
        description: writes still queued at the primary
        constraints: ">= 0"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the IT operator who recorded the measurement
    note: "Append-only event log — no update or delete endpoint, no version field."

  - name: DependencyEdge
    parent: null
    common_fields: true
    fields:
      - name: from_node_kind
        type: enum
        source: input
        description: discriminator for from_node_id
        constraints: "enum {APPLICATION, ASSET}"
      - name: from_node_id
        type: string
        source: input
        description: "POLY -> Application.id when from_node_kind == APPLICATION, else Asset.id; the dependent node"
      - name: to_node_kind
        type: enum
        source: input
        description: discriminator for to_node_id
        constraints: "enum {APPLICATION, ASSET}"
      - name: to_node_id
        type: string
        source: input
        description: "POLY -> Application.id when to_node_kind == APPLICATION, else Asset.id; the node depended upon"
      - name: edge_kind
        type: enum
        source: input
        description: "HARD edges participate in cycle detection and in the critical-path projection; SOFT edges are documentation only"
        constraints: "enum {HARD, SOFT}"

  - name: RecoveryGroup
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: group display name
      - name: group_code
        type: string
        source: input
        description: short code
        constraints: "unique across RecoveryGroup"
      - name: recovery_site_id
        type: string
        source: input
        description: "FK -> Site.id; the site this group fails over to"
      - name: lead_coordinator_id
        type: string
        source: input
        description: "FK -> Stakeholder.id; resilience coordinator accountable for the group"
      - name: recovery_order
        type: integer
        source: input
        description: sequence position when several groups recover together
        constraints: ">= 1"
      - name: posture
        type: enum
        source: computed
        description: "gating posture derived by calculations.recovery_group_posture_derivation"
        default: RESTRICTED
        constraints: "enum {READY, RESTRICTED, FROZEN}"
      - name: posture_reason
        type: enum
        source: computed
        description: why the posture holds its current value
        default: NO_VALIDATED_RUNBOOK
        constraints: "enum {NO_VALIDATED_RUNBOOK, RUNBOOK_STALE, OPEN_CRITICAL_FINDING, READY_ALL_CHECKS_PASSED}"
      - name: current_runbook_id
        type: string
        source: computed
        description: "FK -> Runbook.id; the group's most recently VALIDATED or STALE runbook revision; null before the first validation"
        default: null
      - name: projected_recovery_minutes
        type: integer
        source: computed
        description: "longest HARD-edge node-weight path across member nodes; see calculations.projected_recovery_minutes_critical_path"
        default: 0
      - name: recovery_sequence
        type: array
        source: computed
        description: ordered node ids along the winning critical path, from the highest dependent down to the deepest dependency
        default: []
      - name: open_finding_count
        type: integer
        source: computed
        description: "count of Findings on this group in a non-terminal state; see calculations.recovery_group_open_finding_count"
        default: 0
      - name: change_freeze_start_at
        type: datetime
        source: input
        description: inclusive start of the group's change-freeze interval
        default: null
      - name: change_freeze_end_at
        type: datetime
        source: input
        description: inclusive end of the group's change-freeze interval
        default: null

  - name: Runbook
    parent: RecoveryGroup
    common_fields: true
    fields:
      - name: recovery_group_id
        type: string
        source: input
        description: "FK -> RecoveryGroup.id; the group this runbook recovers"
      - name: title
        type: string
        source: input
        description: runbook title
      - name: author_id
        type: string
        source: input
        description: "FK -> Stakeholder.id; authoring resilience coordinator"
      - name: revision
        type: integer
        source: computed
        description: "1 + count of prior Runbooks on the same recovery_group_id, ordered by created_at ASC"
      - name: status
        type: enum
        source: computed
        description: publication/validation state
        default: DRAFT
        constraints: "enum {DRAFT, IN_REVIEW, VALIDATED, STALE, SUPERSEDED}"
      - name: validity_days
        type: integer
        source: input
        description: how many days a validation remains acceptable for exercise scoping
        default: 180
        constraints: "integer 1..3650"
      - name: validated_at
        type: datetime
        source: computed
        description: logical-clock instant of the VALIDATE transition; null until validated
        default: null
      - name: readiness_score
        type: number
        source: computed
        description: "weighted step-freshness score in 0.00..100.00; see calculations.runbook_readiness_score"
        default: 0.00
      - name: stale_reason
        type: enum
        source: computed
        description: why this runbook lost its VALIDATED standing
        default: NONE
        constraints: "enum {NONE, APPLICATION_RETIERED, STEP_OWNER_SUSPENDED, SUPERSEDED_BY_REVISION}"

  - name: RunbookStep
    parent: Runbook
    common_fields: true
    fields:
      - name: runbook_id
        type: string
        source: input
        description: "FK -> Runbook.id; owning runbook revision"
      - name: step_number
        type: integer
        source: input
        description: execution order within the runbook
        constraints: ">= 1; unique per runbook_id"
      - name: description
        type: string
        source: input
        description: what the operator must do
      - name: owner_id
        type: string
        source: input
        description: "FK -> Stakeholder.id; step-level owner; may not record this step's own StepExecution"
      - name: expected_minutes
        type: integer
        source: input
        description: planned duration of the step
        constraints: ">= 0"
      - name: weight
        type: integer
        source: input
        description: weight of this step inside runbook_readiness_score
        constraints: "integer 1..20"
      - name: validation_status
        type: enum
        source: computed
        description: whether the step has a current validation
        default: PENDING
        constraints: "enum {PENDING, VALIDATED, INVALIDATED}"
      - name: last_validated_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent validation; the decay origin for readiness scoring
        default: null
      - name: covers_application_id
        type: string
        source: input
        description: "FK -> Application.id; the application this step recovers; null when the step covers infrastructure only"
        default: null
      - name: covers_asset_id
        type: string
        source: input
        description: "FK -> Asset.id; the asset this step recovers; null when the step covers an application only"
        default: null

  - name: Exercise
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: exercise display name
      - name: exercise_type
        type: enum
        source: input
        description: scope of the rehearsal
        constraints: "enum {TABLETOP, COMPONENT_FAILOVER, FULL_SITE_FAILOVER}"
      - name: recovery_site_id
        type: string
        source: input
        description: "FK -> Site.id; the site whose capacity and window this exercise occupies"
      - name: coordinator_id
        type: string
        source: input
        description: "FK -> Stakeholder.id; the running coordinator; may not approve this exercise's production impact"
      - name: planned_start_at
        type: datetime
        source: input
        description: inclusive start of the site occupation interval
      - name: planned_end_at
        type: datetime
        source: input
        description: exclusive end of the site occupation interval
      - name: execution_state
        type: enum
        source: computed
        description: lifecycle axis 1 of 3
        default: DRAFT
        constraints: "enum {DRAFT, SCOPED, PENDING_IMPACT_APPROVAL, APPROVED, SCHEDULED, IN_EXECUTION, FAILOVER_COMPLETE, CLOSED, CANCELLED, ABORTED}"
      - name: data_state
        type: enum
        source: computed
        description: lifecycle axis 2 of 3 — post-failover data validation and reconciliation
        default: DATA_NOT_STARTED
        constraints: "enum {DATA_NOT_STARTED, DATA_VALIDATING, DATA_VERIFIED, DATA_DIVERGENT, DATA_RECONCILING}"
      - name: failback_state
        type: enum
        source: computed
        description: lifecycle axis 3 of 3 — failback planning and data synchronisation
        default: FAILBACK_NOT_PLANNED
        constraints: "enum {FAILBACK_NOT_PLANNED, FAILBACK_PLANNED, SYNC_IN_PROGRESS, SYNC_FAILED, FAILBACK_COMPLETE}"
      - name: production_impact_score
        type: number
        source: computed
        description: "final impact score including the governance surcharge; see calculations.production_impact_score_with_governance_surcharge"
        default: null
      - name: provisional_impact_score
        type: number
        source: computed
        description: pre-surcharge impact score retained for audit of the pinned evaluation order
        default: null
      - name: required_approval_level
        type: enum
        source: computed
        description: authority level an approver must hold, derived once from production_impact_score
        default: null
        constraints: "enum {LEVEL_1, LEVEL_2, LEVEL_3}"
      - name: impact_approved_by_id
        type: string
        source: computed
        description: "FK -> Stakeholder.id; risk approver who approved the production impact; null until approved"
        default: null
      - name: required_capacity_units
        type: integer
        source: computed
        description: "sum of ExerciseScopeItem.capacity_units_contributed; see calculations.exercise_required_capacity_units"
        default: 0
      - name: rto_objective_minutes
        type: integer
        source: computed
        description: "tightest in-scope agreed RTO, pinned at START; see calculations.exercise_objectives_baseline"
        default: null
      - name: rpo_objective_minutes
        type: integer
        source: computed
        description: "tightest in-scope agreed RPO, pinned at START; see calculations.exercise_objectives_baseline"
        default: null
      - name: achieved_rto_minutes
        type: integer
        source: computed
        description: "measured recovery time; dual-variant, see calculations.achieved_rto_minutes"
        default: null
      - name: achieved_rpo_minutes
        type: integer
        source: computed
        description: "measured data-loss window; dual-variant, see calculations.achieved_rpo_minutes"
        default: null
      - name: rto_met
        type: boolean
        source: computed
        description: achieved_rto_minutes <= rto_objective_minutes
        default: null
      - name: rpo_met
        type: boolean
        source: computed
        description: achieved_rpo_minutes <= rpo_objective_minutes
        default: null
      - name: execution_started_at
        type: datetime
        source: computed
        description: logical-clock instant of the START transition
        default: null
      - name: failover_completed_at
        type: datetime
        source: computed
        description: logical-clock instant of the COMPLETE_FAILOVER transition
        default: null
      - name: closure_reason
        type: enum
        source: computed
        description: why the exercise left the pre-execution or execution path
        default: NONE
        constraints: "enum {NONE, CLOSED_NORMALLY, CANCELLED_BY_COORDINATOR, CANCELLED_GROUP_FROZEN, ABORTED_IN_EXECUTION}"

  - name: ExerciseScopeItem
    parent: Exercise
    common_fields: true
    fields:
      - name: exercise_id
        type: string
        source: input
        description: "FK -> Exercise.id; the scoping exercise"
      - name: recovery_group_id
        type: string
        source: input
        description: "FK -> RecoveryGroup.id; the in-scope group"
      - name: runbook_id_snapshot
        type: string
        source: computed
        description: "FK -> Runbook.id; the group's current_runbook_id captured at scoping; StepExecutions must cite steps of this revision"
      - name: group_projected_recovery_minutes_snapshot
        type: integer
        source: computed
        description: RecoveryGroup.projected_recovery_minutes captured at scoping
      - name: capacity_units_contributed
        type: integer
        source: computed
        description: "CAPACITY_BY_TYPE[Exercise.exercise_type]; see calculations.exercise_required_capacity_units"

  - name: StepExecution
    parent: Exercise
    common_fields: true
    fields:
      - name: exercise_id
        type: string
        source: input
        description: "FK -> Exercise.id; the running exercise"
      - name: runbook_step_id
        type: string
        source: input
        description: "FK -> RunbookStep.id; the step being timed"
      - name: outcome
        type: enum
        source: input
        description: result of the step
        constraints: "enum {PASSED, PASSED_WITH_ISSUE, FAILED, SKIPPED}"
      - name: elapsed_seconds
        type: integer
        source: input
        description: measured wall time of the step in seconds
        constraints: ">= 0"
      - name: elapsed_minutes
        type: integer
        source: computed
        description: "ceil(elapsed_seconds / 60)"
      - name: performed_by_user_id
        type: string
        source: system
        description: X-User-ID of the recorder; enforced not to equal RunbookStep.owner_id
      - name: notes
        type: string
        source: input
        description: free-text observation
        default: null

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - name: exercise_id
        type: string
        source: input
        description: "FK -> Exercise.id; the exercise that surfaced the finding"
      - name: recovery_group_id
        type: string
        source: input
        description: "FK -> RecoveryGroup.id; the group whose posture this finding gates"
      - name: severity
        type: enum
        source: input
        description: severity band
        constraints: "enum {CRITICAL, HIGH, MEDIUM, LOW}"
      - name: title
        type: string
        source: input
        description: short title
      - name: description
        type: string
        source: input
        description: what went wrong
      - name: owner_id
        type: string
        source: computed
        description: "FK -> Stakeholder.id; remediation owner set by the ASSIGN transition; null while OPEN"
        default: null
      - name: state
        type: enum
        source: computed
        description: remediation lifecycle with a re-test loop
        default: OPEN
        constraints: "enum {OPEN, REMEDIATION_ASSIGNED, REMEDIATED, RETEST_SCHEDULED, RETEST_FAILED, CLOSED, WITHDRAWN}"
      - name: retest_exercise_id
        type: string
        source: computed
        description: "FK -> Exercise.id; exercise nominated by SCHEDULE_RETEST; null until scheduled"
        default: null
      - name: retest_failure_count
        type: integer
        source: computed
        description: number of RECORD_RETEST_RESULT transitions with retest_result FAILED
        default: 0
      - name: escalated
        type: boolean
        source: computed
        description: "true once retest_failure_count >= 2 AND severity == CRITICAL; freezes the group"
        default: false
      - name: due_at
        type: datetime
        source: input
        description: remediation due date
        default: null

  - name: EvidencePackage
    parent: Exercise
    common_fields: true
    fields:
      - name: exercise_id
        type: string
        source: input
        description: "FK -> Exercise.id; the exercise being evidenced"
      - name: prepared_by_id
        type: string
        source: input
        description: "FK -> Stakeholder.id; audit liaison who assembled the package; may not sign it off"
      - name: signed_off_by_id
        type: string
        source: computed
        description: "FK -> Stakeholder.id; risk approver who signed off; null until SIGNED_OFF"
        default: null
      - name: state
        type: enum
        source: computed
        description: audit submission lifecycle with a return loop and a tamper-evident seal
        default: DRAFT
        constraints: "enum {DRAFT, SUBMITTED, RETURNED, SIGNED_OFF, SEALED}"
      - name: manifest_line_count
        type: integer
        source: computed
        description: "line count of the evidence manifest; see calculations.evidence_manifest_line_count"
        default: 0
      - name: return_reason
        type: enum
        source: computed
        description: why the regulator/reviewer returned the package
        default: NONE
        constraints: "enum {NONE, INCOMPLETE_MANIFEST}"
      - name: sealed_at
        type: datetime
        source: computed
        description: logical-clock instant of the SEAL transition
        default: null

state_machines:
  - entity: Application
    state_field: tier_agreement_status
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic negotiation: proposal -> agreement or change request -> re-proposal. Re-proposing an AGREED tier is the head of cascade A."
    transitions:
      - from: DRAFT
        to: TIER_PROPOSED
        trigger: "POST /applications/{id}/tier-proposals"
        actor: ResilienceCoordinator
        preconditions:
          - "acting Stakeholder.status == ACTIVE and org_roles contains RESILIENCE_COORDINATOR"
          - "proposed_rto_minutes <= TIER_RTO_CAP[proposed_tier] (validations priority 33)"
          - "proposed_rpo_minutes <= TIER_RPO_CAP[proposed_tier] (validations priority 34)"
        side_effects:
          - "stores proposed_tier, proposed_rto_minutes, proposed_rpo_minutes"
          - "sets proposed_by_id = X-User-ID"
      - from: CHANGES_REQUESTED
        to: TIER_PROPOSED
        trigger: "POST /applications/{id}/tier-proposals"
        actor: ResilienceCoordinator
        preconditions:
          - "same caps as from DRAFT"
        side_effects:
          - "overwrites the proposal fields and proposed_by_id"
      - from: TIER_PROPOSED
        to: AGREED
        trigger: "POST /applications/{id}/tier-decisions with action AGREE"
        actor: BusinessOwner
        preconditions:
          - "X-User-ID == Application.business_owner_id"
          - "X-User-ID != Application.proposed_by_id (validations priority 17, segregation of duties)"
        side_effects:
          - "copies proposed_tier -> tier, proposed_rto_minutes -> rto_minutes, proposed_rpo_minutes -> rpo_minutes"
          - "recomputes RecoveryGroup.projected_recovery_minutes and recovery_sequence for Application.recovery_group_id when non-null"
      - from: TIER_PROPOSED
        to: CHANGES_REQUESTED
        trigger: "POST /applications/{id}/tier-decisions with action REQUEST_CHANGES"
        actor: BusinessOwner
        preconditions:
          - "X-User-ID == Application.business_owner_id"
        side_effects:
          - "leaves tier, rto_minutes, rpo_minutes untouched"
      - from: AGREED
        to: TIER_PROPOSED
        trigger: "POST /applications/{id}/tier-proposals (re-tiering an agreed application)"
        actor: ResilienceCoordinator
        preconditions:
          - "same caps as from DRAFT"
        side_effects:
          - "CASCADE A hop 1: retier_count += 1; proposed_by_id = X-User-ID; tier/rto_minutes/rpo_minutes retain their last agreed values"
          - "CASCADE A hop 2 (caused by hop 1): every RunbookStep with covers_application_id == this application and validation_status == VALIDATED moves to INVALIDATED"
          - "CASCADE A hop 3 (caused by hop 2): each Runbook owning an invalidated step and holding status VALIDATED moves to STALE with stale_reason APPLICATION_RETIERED, and its readiness_score is recomputed"
          - "CASCADE A hop 4 (caused by hop 3): each RecoveryGroup whose current_runbook_id is now STALE has posture recomputed -> RESTRICTED with posture_reason RUNBOOK_STALE"
          - "CASCADE A hop 5 (caused by hop 4): every Exercise in execution_state SCHEDULED holding an ExerciseScopeItem on that group reverts to SCOPED with closure_reason NONE"
          - "CASCADE A hop 6 (caused by hop 5): Site.reserved_capacity_units is recomputed for each reverted exercise's recovery_site_id and decreases by that exercise's required_capacity_units"

  - entity: Runbook
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Revision loop: STALE runbooks return to IN_REVIEW rather than dying."
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /runbooks/{id}/transitions with action SUBMIT_FOR_REVIEW"
        actor: ResilienceCoordinator
        preconditions:
          - "runbook has at least one RunbookStep"
        side_effects:
          - "recomputes readiness_score"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /runbooks/{id}/transitions with action RETURN_TO_DRAFT"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "recomputes readiness_score"
      - from: IN_REVIEW
        to: VALIDATED
        trigger: "POST /runbooks/{id}/transitions with action VALIDATE"
        actor: ResilienceCoordinator
        preconditions:
          - "every RunbookStep of this runbook has validation_status == VALIDATED"
        side_effects:
          - "sets validated_at = current logical clock; stale_reason = NONE"
          - "recomputes readiness_score"
          - "sets RecoveryGroup.current_runbook_id = this runbook and marks any earlier revision of the same group SUPERSEDED with stale_reason SUPERSEDED_BY_REVISION"
          - "recomputes RecoveryGroup.posture (typically READY with posture_reason READY_ALL_CHECKS_PASSED)"
      - from: STALE
        to: IN_REVIEW
        trigger: "POST /runbooks/{id}/transitions with action SUBMIT_FOR_REVIEW"
        actor: ResilienceCoordinator
        preconditions:
          - "every RunbookStep of this runbook has validation_status != INVALIDATED"
        side_effects:
          - "recomputes readiness_score"
      - from: VALIDATED
        to: STALE
        trigger: "system event: a covered Application is re-tiered, or a step owner is suspended"
        actor: system
        preconditions:
          - "at least one RunbookStep of this runbook moved to INVALIDATED in the same request"
        side_effects:
          - "sets stale_reason to APPLICATION_RETIERED or STEP_OWNER_SUSPENDED according to the originating cascade"
          - "recomputes readiness_score and then the owning RecoveryGroup.posture"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "system event: a later revision of the same recovery group is VALIDATED"
        actor: system
        preconditions:
          - "another Runbook on the same recovery_group_id reached VALIDATED in the same request"
        side_effects:
          - "sets stale_reason SUPERSEDED_BY_REVISION"
      - from: STALE
        to: SUPERSEDED
        trigger: "system event: a later revision of the same recovery group is VALIDATED"
        actor: system
        preconditions:
          - "another Runbook on the same recovery_group_id reached VALIDATED in the same request"
        side_effects:
          - "sets stale_reason SUPERSEDED_BY_REVISION"

  - entity: RunbookStep
    state_field: validation_status
    initial_state: PENDING
    terminal_states: []
    note: "Cyclic: a step invalidated by a cascade can be re-validated, and a VALIDATED step can be re-validated to refresh its decay origin."
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "POST /runbook-steps/{id}/validations"
        actor: ITOperator
        preconditions:
          - "owning Runbook.status IN {DRAFT, IN_REVIEW, VALIDATED, STALE}"
          - "when covers_application_id is non-null, that Application.tier_agreement_status == AGREED (validations priority 25)"
        side_effects:
          - "sets last_validated_at = current logical clock"
          - "recomputes owning Runbook.readiness_score, then the owning RecoveryGroup.posture"
      - from: INVALIDATED
        to: VALIDATED
        trigger: "POST /runbook-steps/{id}/validations"
        actor: ITOperator
        preconditions:
          - "same as from PENDING"
        side_effects:
          - "sets last_validated_at = current logical clock"
          - "recomputes owning Runbook.readiness_score, then the owning RecoveryGroup.posture"
      - from: VALIDATED
        to: VALIDATED
        trigger: "POST /runbook-steps/{id}/validations (re-validation refreshes the decay origin)"
        actor: ITOperator
        preconditions:
          - "same as from PENDING"
        side_effects:
          - "advances last_validated_at to the current logical clock without touching Runbook.validated_at"
          - "recomputes owning Runbook.readiness_score, then the owning RecoveryGroup.posture"
      - from: VALIDATED
        to: INVALIDATED
        trigger: "system event: covered Application re-tiered (cascade A hop 2) or owner Stakeholder suspended (cascade C hop 2)"
        actor: system
        preconditions:
          - "the step's covers_application_id was re-tiered, or the step's owner_id moved to SUSPENDED"
        side_effects:
          - "clears nothing; last_validated_at is retained for audit but scores as zero contribution"

  - entity: RecoveryGroup
    state_field: posture
    initial_state: RESTRICTED
    terminal_states: []
    note: "Derived gating posture. Every transition is a system re-derivation of calculations.recovery_group_posture_derivation; POST /recovery-groups/{id}/posture-refresh re-runs it against the current logical clock."
    transitions:
      - from: RESTRICTED
        to: READY
        trigger: "system re-derivation after runbook validation, step validation, finding closure or POST /recovery-groups/{id}/posture-refresh"
        actor: system
        preconditions:
          - "current_runbook_id is non-null and that Runbook.status == VALIDATED"
          - "that Runbook.readiness_score >= 80.00 as of the current logical clock"
          - "no Finding on this group has escalated == true with state NOT IN {CLOSED, WITHDRAWN}"
        side_effects:
          - "sets posture_reason READY_ALL_CHECKS_PASSED"
      - from: READY
        to: RESTRICTED
        trigger: "system re-derivation after a runbook goes STALE, readiness decays below the floor, or POST /recovery-groups/{id}/posture-refresh"
        actor: system
        preconditions:
          - "current_runbook_id is null, or that Runbook.status != VALIDATED, or readiness_score < 80.00"
        side_effects:
          - "sets posture_reason NO_VALIDATED_RUNBOOK when current_runbook_id is null, otherwise RUNBOOK_STALE"
      - from: READY
        to: FROZEN
        trigger: "system re-derivation after a CRITICAL Finding on this group becomes escalated (cascade B hop 3)"
        actor: system
        preconditions:
          - "some Finding on this group has escalated == true and state NOT IN {CLOSED, WITHDRAWN}"
        side_effects:
          - "sets posture_reason OPEN_CRITICAL_FINDING"
          - "CASCADE B hop 4 (caused by this transition): every Exercise holding an ExerciseScopeItem on this group with execution_state IN {SCOPED, PENDING_IMPACT_APPROVAL, APPROVED, SCHEDULED} moves to CANCELLED with closure_reason CANCELLED_GROUP_FROZEN"
          - "CASCADE B hop 5 (caused by hop 4): for each exercise cancelled by hop 4 that was in execution_state SCHEDULED, Site.reserved_capacity_units is recomputed for its recovery_site_id and decreases by that exercise's required_capacity_units; exercises cancelled from SCOPED, PENDING_IMPACT_APPROVAL or APPROVED held no reservation, so the recompute leaves the site unchanged"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system re-derivation after a CRITICAL Finding on this group becomes escalated (cascade B hop 3)"
        actor: system
        preconditions:
          - "some Finding on this group has escalated == true and state NOT IN {CLOSED, WITHDRAWN}"
        side_effects:
          - "sets posture_reason OPEN_CRITICAL_FINDING"
          - "same cascade B hop 4 exercise cancellation and hop 5 capacity release as from READY"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system re-derivation after the escalated CRITICAL Finding reaches CLOSED or WITHDRAWN"
        actor: system
        preconditions:
          - "no Finding on this group has escalated == true with state NOT IN {CLOSED, WITHDRAWN}"
          - "current_runbook_id is null, or that Runbook.status != VALIDATED, or readiness_score < 80.00"
        side_effects:
          - "sets posture_reason NO_VALIDATED_RUNBOOK or RUNBOOK_STALE as above; cancelled exercises are NOT resurrected"
      - from: FROZEN
        to: READY
        trigger: "system re-derivation after the escalated CRITICAL Finding reaches CLOSED or WITHDRAWN with a valid fresh runbook in place"
        actor: system
        preconditions:
          - "no Finding on this group has escalated == true with state NOT IN {CLOSED, WITHDRAWN}"
          - "current_runbook_id Runbook.status == VALIDATED and readiness_score >= 80.00"
        side_effects:
          - "sets posture_reason READY_ALL_CHECKS_PASSED"

  - entity: Exercise
    state_field: execution_state
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED, ABORTED]
    note: "Axis 1 of 3 parallel dimensions on Exercise. Independent of data_state and failback_state until CLOSE, which is the single join point."
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /exercises/{id}/scope-items (first accepted scope item)"
        actor: ResilienceCoordinator
        preconditions:
          - "expected_exercise_version == Exercise.version (concurrency_rules scope-item-add-stale-exercise)"
          - "RecoveryGroup.posture != FROZEN (validations priority 24)"
          - "the group's current runbook is VALIDATED with readiness_score >= 80.00 (validations priority 22)"
          - "RecoveryGroup.recovery_site_id == Exercise.recovery_site_id (validations priority 26)"
          - "the snapshot runbook's validated_at is at most validity_days old (validations priority 39)"
          - "planned interval does not intersect the group's closed change-freeze interval (validations priority 38)"
        side_effects:
          - "creates ExerciseScopeItem with runbook_id_snapshot, group_projected_recovery_minutes_snapshot and capacity_units_contributed"
          - "recomputes Exercise.required_capacity_units"
          - "increments Exercise.version by 1"
      - from: SCOPED
        to: SCOPED
        trigger: "POST /exercises/{id}/scope-items (additional group)"
        actor: ResilienceCoordinator
        preconditions:
          - "same as DRAFT -> SCOPED, plus no existing ExerciseScopeItem for that recovery_group_id (validations priority 30)"
        side_effects:
          - "creates the scope item, recomputes required_capacity_units, increments Exercise.version by 1"
      - from: SCOPED
        to: PENDING_IMPACT_APPROVAL
        trigger: "POST /exercises/{id}/impact-submissions"
        actor: ResilienceCoordinator
        preconditions:
          - "at least one ExerciseScopeItem exists"
          - "every in-scope RecoveryGroup.posture == READY (validations priority 23)"
        side_effects:
          - "computes provisional_impact_score, production_impact_score and required_approval_level per calculations.production_impact_score_with_governance_surcharge"
      - from: PENDING_IMPACT_APPROVAL
        to: APPROVED
        trigger: "POST /exercises/{id}/impact-decisions with action APPROVE"
        actor: RiskApprover
        preconditions:
          - "X-User-ID != Exercise.coordinator_id (validations priority 18, segregation of duties)"
          - "acting Stakeholder.approval_authority_level >= required_approval_level (validations priority 21)"
        side_effects:
          - "sets impact_approved_by_id = X-User-ID"
      - from: PENDING_IMPACT_APPROVAL
        to: SCOPED
        trigger: "POST /exercises/{id}/impact-decisions with action REJECT"
        actor: RiskApprover
        preconditions:
          - "X-User-ID != Exercise.coordinator_id"
        side_effects:
          - "clears production_impact_score, provisional_impact_score and required_approval_level back to null"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /exercises/{id}/schedule"
        actor: ResilienceCoordinator
        preconditions:
          - "planned interval does not collide with another SCHEDULED/IN_EXECUTION exercise on the same recovery site under half-open semantics plus the FULL_SITE post-window buffer (validations priority 37)"
          - "Site.reserved_capacity_units + Exercise.required_capacity_units <= Site.usable_capacity_units (validations priority 41)"
        side_effects:
          - "recomputes Site.reserved_capacity_units for recovery_site_id, which increases by required_capacity_units"
      - from: SCHEDULED
        to: SCOPED
        trigger: "system event: an in-scope group left posture READY (cascade A hop 5)"
        actor: system
        preconditions:
          - "an ExerciseScopeItem points at a RecoveryGroup whose posture moved out of READY in the same request"
        side_effects:
          - "recomputes Site.reserved_capacity_units for recovery_site_id, which decreases by required_capacity_units"
      - from: SCHEDULED
        to: IN_EXECUTION
        trigger: "POST /exercises/{id}/execution-transitions with action START"
        actor: ResilienceCoordinator
        preconditions:
          - "at least one Application with tier_agreement_status == AGREED is a member of an in-scope group (validations priority 42)"
        side_effects:
          - "sets execution_started_at = current logical clock"
          - "pins rto_objective_minutes and rpo_objective_minutes per calculations.exercise_objectives_baseline"
      - from: IN_EXECUTION
        to: FAILOVER_COMPLETE
        trigger: "POST /exercises/{id}/execution-transitions with action COMPLETE_FAILOVER"
        actor: ResilienceCoordinator
        preconditions:
          - "at least one StepExecution exists for this exercise"
          - "every in-scope DATA_STORE Asset has at least one ReplicationObservation with observed_at <= current logical clock (validations priority 43)"
        side_effects:
          - "sets failover_completed_at = current logical clock"
          - "computes achieved_rto_minutes per calculations.achieved_rto_minutes and sets rto_met"
          - "computes achieved_rpo_minutes per calculations.achieved_rpo_minutes and sets rpo_met"
      - from: IN_EXECUTION
        to: ABORTED
        trigger: "POST /exercises/{id}/execution-transitions with action ABORT"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "sets closure_reason ABORTED_IN_EXECUTION"
          - "recomputes Site.reserved_capacity_units, which decreases by required_capacity_units"
      - from: FAILOVER_COMPLETE
        to: CLOSED
        trigger: "POST /exercises/{id}/execution-transitions with action CLOSE"
        actor: ResilienceCoordinator
        preconditions:
          - "data_state == DATA_VERIFIED"
          - "failback_state == FAILBACK_COMPLETE"
        side_effects:
          - "sets closure_reason CLOSED_NORMALLY"
          - "recomputes Site.reserved_capacity_units, which decreases by required_capacity_units"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /exercises/{id}/execution-transitions with action CANCEL"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "sets closure_reason CANCELLED_BY_COORDINATOR"
      - from: SCOPED
        to: CANCELLED
        trigger: "POST /exercises/{id}/execution-transitions with action CANCEL"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "sets closure_reason CANCELLED_BY_COORDINATOR"
      - from: PENDING_IMPACT_APPROVAL
        to: CANCELLED
        trigger: "POST /exercises/{id}/execution-transitions with action CANCEL"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "sets closure_reason CANCELLED_BY_COORDINATOR"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /exercises/{id}/execution-transitions with action CANCEL"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "sets closure_reason CANCELLED_BY_COORDINATOR"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /exercises/{id}/execution-transitions with action CANCEL"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "sets closure_reason CANCELLED_BY_COORDINATOR"
          - "recomputes Site.reserved_capacity_units, which decreases by required_capacity_units"
      - from: SCOPED
        to: CANCELLED
        trigger: "system event: an in-scope group became FROZEN (cascade B hop 4)"
        actor: system
        preconditions:
          - "an ExerciseScopeItem points at a RecoveryGroup that moved to posture FROZEN in the same request"
        side_effects:
          - "sets closure_reason CANCELLED_GROUP_FROZEN"
          - "CASCADE B hop 5 (caused by hop 4): Site.reserved_capacity_units is recomputed for recovery_site_id; a SCOPED exercise held no reservation, so the recomputed value is unchanged"
      - from: PENDING_IMPACT_APPROVAL
        to: CANCELLED
        trigger: "system event: an in-scope group became FROZEN (cascade B hop 4)"
        actor: system
        preconditions:
          - "an ExerciseScopeItem points at a RecoveryGroup that moved to posture FROZEN in the same request"
        side_effects:
          - "sets closure_reason CANCELLED_GROUP_FROZEN"
          - "same cascade B hop 5 capacity recompute as from SCOPED, with no change to the site because no reservation was held"
      - from: APPROVED
        to: CANCELLED
        trigger: "system event: an in-scope group became FROZEN (cascade B hop 4)"
        actor: system
        preconditions:
          - "an ExerciseScopeItem points at a RecoveryGroup that moved to posture FROZEN in the same request"
        side_effects:
          - "sets closure_reason CANCELLED_GROUP_FROZEN"
          - "same cascade B hop 5 capacity recompute as from SCOPED, with no change to the site because no reservation was held"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: an in-scope group became FROZEN (cascade B hop 4)"
        actor: system
        preconditions:
          - "an ExerciseScopeItem points at a RecoveryGroup that moved to posture FROZEN in the same request"
        side_effects:
          - "sets closure_reason CANCELLED_GROUP_FROZEN"
          - "CASCADE B hop 5 (caused by hop 4): Site.reserved_capacity_units is recomputed for recovery_site_id and decreases by required_capacity_units — this is the only cancel-by-freeze path that releases capacity"

  - entity: Exercise
    state_field: data_state
    initial_state: DATA_NOT_STARTED
    terminal_states: [DATA_VERIFIED]
    note: "Axis 2 of 3. Reconciliation loop: DATA_DIVERGENT -> DATA_RECONCILING -> DATA_VALIDATING."
    transitions:
      - from: DATA_NOT_STARTED
        to: DATA_VALIDATING
        trigger: "POST /exercises/{id}/data-transitions with action BEGIN_VALIDATION"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["no cross-entity effect"]
      - from: DATA_VALIDATING
        to: DATA_VERIFIED
        trigger: "POST /exercises/{id}/data-transitions with action VERIFY"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["unblocks the CLOSE join on axis 1"]
      - from: DATA_VALIDATING
        to: DATA_DIVERGENT
        trigger: "POST /exercises/{id}/data-transitions with action FLAG_DIVERGENT"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["no cross-entity effect; axis 1 remains FAILOVER_COMPLETE and CLOSE stays blocked"]
      - from: DATA_DIVERGENT
        to: DATA_RECONCILING
        trigger: "POST /exercises/{id}/data-transitions with action RECONCILE"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["no cross-entity effect"]
      - from: DATA_RECONCILING
        to: DATA_VALIDATING
        trigger: "POST /exercises/{id}/data-transitions with action REVALIDATE"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["closes the reconciliation loop; VERIFY or FLAG_DIVERGENT may fire again"]

  - entity: Exercise
    state_field: failback_state
    initial_state: FAILBACK_NOT_PLANNED
    terminal_states: [FAILBACK_COMPLETE]
    note: "Axis 3 of 3. Retry loop: SYNC_IN_PROGRESS -> SYNC_FAILED -> SYNC_IN_PROGRESS."
    transitions:
      - from: FAILBACK_NOT_PLANNED
        to: FAILBACK_PLANNED
        trigger: "POST /exercises/{id}/failback-transitions with action PLAN"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["no cross-entity effect"]
      - from: FAILBACK_PLANNED
        to: SYNC_IN_PROGRESS
        trigger: "POST /exercises/{id}/failback-transitions with action START_SYNC"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["no cross-entity effect"]
      - from: SYNC_IN_PROGRESS
        to: SYNC_FAILED
        trigger: "POST /exercises/{id}/failback-transitions with action RECORD_SYNC_FAILURE"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["no cross-entity effect; the CLOSE join on axis 1 stays blocked"]
      - from: SYNC_FAILED
        to: SYNC_IN_PROGRESS
        trigger: "POST /exercises/{id}/failback-transitions with action RETRY_SYNC"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["no cross-entity effect"]
      - from: SYNC_IN_PROGRESS
        to: FAILBACK_COMPLETE
        trigger: "POST /exercises/{id}/failback-transitions with action COMPLETE"
        actor: ITOperator
        preconditions:
          - "execution_state == FAILOVER_COMPLETE"
        side_effects: ["unblocks the CLOSE join on axis 1"]

  - entity: Finding
    state_field: state
    initial_state: OPEN
    terminal_states: [CLOSED, WITHDRAWN]
    note: "Cyclic re-test loop and the head of cascade B."
    transitions:
      - from: OPEN
        to: REMEDIATION_ASSIGNED
        trigger: "POST /findings/{id}/transitions with action ASSIGN"
        actor: ResilienceCoordinator
        preconditions:
          - "owner_id payload references an ACTIVE Stakeholder"
        side_effects:
          - "sets Finding.owner_id"
          - "recomputes RecoveryGroup.open_finding_count (unchanged: both states are non-terminal)"
      - from: REMEDIATION_ASSIGNED
        to: REMEDIATED
        trigger: "POST /findings/{id}/transitions with action REMEDIATE"
        actor: ResilienceCoordinator
        preconditions:
          - "owner_id is non-null"
        side_effects: ["no cross-entity effect"]
      - from: REMEDIATED
        to: RETEST_SCHEDULED
        trigger: "POST /findings/{id}/transitions with action SCHEDULE_RETEST"
        actor: ResilienceCoordinator
        preconditions:
          - "retest_exercise_id payload references an Exercise in execution_state NOT IN {CLOSED, CANCELLED, ABORTED}"
          - "that exercise holds an ExerciseScopeItem on Finding.recovery_group_id (validations priority 32)"
        side_effects:
          - "sets retest_exercise_id"
      - from: RETEST_SCHEDULED
        to: CLOSED
        trigger: "POST /findings/{id}/transitions with action RECORD_RETEST_RESULT and retest_result PASSED"
        actor: ResilienceCoordinator
        preconditions:
          - "retest_exercise_id is non-null"
        side_effects:
          - "recomputes RecoveryGroup.open_finding_count, which decreases by 1"
          - "recomputes RecoveryGroup.posture"
      - from: RETEST_SCHEDULED
        to: RETEST_FAILED
        trigger: "POST /findings/{id}/transitions with action RECORD_RETEST_RESULT and retest_result FAILED"
        actor: ResilienceCoordinator
        preconditions:
          - "retest_exercise_id is non-null"
        side_effects:
          - "CASCADE B hop 1: retest_failure_count += 1"
          - "CASCADE B hop 2 (caused by hop 1): escalated becomes true when retest_failure_count >= 2 AND severity == CRITICAL"
          - "CASCADE B hop 3 (caused by hop 2): the owning RecoveryGroup.posture is re-derived to FROZEN with posture_reason OPEN_CRITICAL_FINDING"
          - "cascade B hops 4 and 5 continue in the RecoveryGroup READY/RESTRICTED -> FROZEN transitions"
      - from: RETEST_FAILED
        to: REMEDIATION_ASSIGNED
        trigger: "POST /findings/{id}/transitions with action ASSIGN"
        actor: ResilienceCoordinator
        preconditions:
          - "owner_id payload references an ACTIVE Stakeholder"
        side_effects:
          - "sets Finding.owner_id; retest_failure_count and escalated are retained"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /findings/{id}/transitions with action WITHDRAW"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "recomputes RecoveryGroup.open_finding_count, which decreases by 1"
          - "recomputes RecoveryGroup.posture"
      - from: REMEDIATION_ASSIGNED
        to: WITHDRAWN
        trigger: "POST /findings/{id}/transitions with action WITHDRAW"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "recomputes RecoveryGroup.open_finding_count, which decreases by 1"
          - "recomputes RecoveryGroup.posture"
      - from: RETEST_FAILED
        to: WITHDRAWN
        trigger: "POST /findings/{id}/transitions with action WITHDRAW"
        actor: ResilienceCoordinator
        preconditions: []
        side_effects:
          - "recomputes RecoveryGroup.open_finding_count, which decreases by 1"
          - "recomputes RecoveryGroup.posture, which leaves FROZEN when this was the only escalated CRITICAL finding"

  - entity: EvidencePackage
    state_field: state
    initial_state: DRAFT
    terminal_states: [SEALED]
    note: "Return loop plus a tamper-evident terminal seal."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /evidence-packages/{id}/transitions with action SUBMIT"
        actor: AuditLiaison
        preconditions:
          - "Exercise.execution_state == CLOSED (validations priority 40)"
        side_effects:
          - "computes manifest_line_count per calculations.evidence_manifest_line_count"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /evidence-packages/{id}/transitions with action RETURN"
        actor: AuditLiaison
        preconditions: []
        side_effects:
          - "sets return_reason INCOMPLETE_MANIFEST"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /evidence-packages/{id}/transitions with action SUBMIT"
        actor: AuditLiaison
        preconditions:
          - "Exercise.execution_state == CLOSED"
        side_effects:
          - "recomputes manifest_line_count; clears return_reason to NONE"
      - from: SUBMITTED
        to: SIGNED_OFF
        trigger: "POST /evidence-packages/{id}/transitions with action SIGN_OFF"
        actor: RiskApprover
        preconditions:
          - "X-User-ID != EvidencePackage.prepared_by_id (validations priority 20, segregation of duties)"
        side_effects:
          - "sets signed_off_by_id = X-User-ID"
      - from: SIGNED_OFF
        to: SEALED
        trigger: "POST /evidence-packages/{id}/transitions with action SEAL"
        actor: AuditLiaison
        preconditions: []
        side_effects:
          - "sets sealed_at = current logical clock; the package is immutable afterwards (validations priority 16)"

concurrency_rules:
  - rule_id: runbook-publish-stale-recovery-group
    parent_entity: RecoveryGroup
    write_endpoint: "POST /runbooks"
    occ_field: "expected_recovery_group_version"
    description: |
      Creating a Runbook revision against a RecoveryGroup whose version has
      advanced since the client last observed it is rejected. Publishing a
      revision legitimately supersedes the group's earlier revision and
      re-points current_runbook_id, so a writer holding a stale view of the
      group's membership, posture or projected recovery path would silently
      author against superseded facts.
    error_id: ERR_STALE_RECOVERY_GROUP_VERSION
    http_status: 412

  - rule_id: scope-item-add-stale-exercise
    parent_entity: Exercise
    write_endpoint: "POST /exercises/{id}/scope-items"
    occ_field: "expected_exercise_version"
    description: |
      Adding an ExerciseScopeItem to an Exercise whose version has advanced
      since the client last observed it is rejected. Each accepted scope item
      re-derives required_capacity_units and therefore changes what a later
      capacity and window evaluation will see, so a writer working from a
      stale exercise view would append scope on top of facts it never read.
    error_id: ERR_STALE_EXERCISE_VERSION
    http_status: 412

calculations:
  - name: projected_recovery_minutes_critical_path
    trigger: "recomputed on POST /applications/{id}/group-assignments, POST /assets/{id}/group-assignments, POST /dependency-edges, the Application TIER_PROPOSED -> AGREED transition, and POST /recovery-groups/{id}/posture-refresh; writes RecoveryGroup.projected_recovery_minutes and RecoveryGroup.recovery_sequence"
    algorithm: topological
    formula: |
      nodes = [Application a WHERE a.recovery_group_id == group.id]
            + [Asset s WHERE s.recovery_group_id == group.id]
      weight(Application a) = a.rto_minutes IF a.rto_minutes IS NOT NULL ELSE 0
      weight(Asset s)       = s.restore_minutes
      edges = [DependencyEdge e WHERE e.edge_kind == 'HARD'
                                 AND e.from_node_id IN nodes
                                 AND e.to_node_id   IN nodes]     # SOFT edges are ignored
      # longest directed node-weight path over a DAG (cycle creation is blocked at
      # write time by validations priority 28, so the subgraph is always acyclic)
      projected_recovery_minutes = max over every directed path p in (nodes, edges) of
                                     sum(weight(n) for n in p)
      # a single isolated node is itself a path of length 1; empty membership yields 0
      recovery_sequence = the node ids of the winning path, ordered from source to sink
    input_set: "Applications and Assets whose recovery_group_id equals the group; HARD DependencyEdges whose both endpoints are members; SOFT edges excluded; Applications whose tier_agreement_status != AGREED contribute weight 0 because rto_minutes is still null"
    constants:
      SOFT_EDGE_WEIGHT_CONTRIBUTION: 0
    precision: "integer minutes, no rounding"
    tie_break: "when two paths tie on total weight, the path whose source node has the earlier created_at wins; if still tied, compare successive nodes pairwise by created_at ASC"

  - name: runbook_readiness_score
    trigger: "recomputed on POST /runbook-steps/{id}/validations, every POST /runbooks/{id}/transitions action, POST /recovery-groups/{id}/posture-refresh, cascade-driven Runbook VALIDATED -> STALE, and immediately before validations priority 22 is evaluated inside POST /exercises/{id}/scope-items; writes Runbook.readiness_score"
    algorithm: weighted_scoring
    formula: |
      now          = current logical clock
      total_weight = sum(step.weight for step in steps(runbook))       # all steps, any status
      FOR each step in steps(runbook):
        IF step.validation_status == 'VALIDATED':
          age_days   = floor((now - step.last_validated_at) / 86400 seconds)
          step_score = round_half_up(100 * (1 - age_days / DECAY_HORIZON_DAYS), 2)
          step_score = max(0.00, step_score)
        ELSE:
          step_score = 0.00                                            # PENDING or INVALIDATED
        contribution = round_half_up(step_score * step.weight / total_weight, 2)
      readiness_score = sum(contribution for each step)                 # NO further rounding
      # PINNED ROUNDING ORDER: round each step contribution to 2dp FIRST, then sum.
      # The alternative order (sum the unrounded contributions, then round once) is
      # explicitly NOT used: three VALIDATED steps of weight 10 validated today give
      # 33.33 + 33.33 + 33.33 = 99.99 under the pinned order and 100.00 under the
      # rejected order.
      # total_weight == 0 (a runbook with no steps) yields readiness_score 0.00
    input_set: "every RunbookStep whose runbook_id is this runbook, including PENDING and INVALIDATED steps, which enter total_weight but contribute 0.00"
    constants:
      DECAY_HORIZON_DAYS: 360
      READINESS_FLOOR_FOR_SCOPING: 80.00
    precision: "2 decimal places, round_half_up, applied twice per step (step_score then contribution) and never to the final sum"

  - name: recovery_group_posture_derivation
    trigger: "re-derived at the end of any request that touches the group's runbooks, steps, findings or membership, and on POST /recovery-groups/{id}/posture-refresh; writes RecoveryGroup.posture and RecoveryGroup.posture_reason"
    algorithm: constraint_propagation
    formula: |
      escalated_open = EXISTS Finding f WHERE f.recovery_group_id == group.id
                                          AND f.escalated == true
                                          AND f.state NOT IN {CLOSED, WITHDRAWN}
      IF escalated_open:
        posture = 'FROZEN';      posture_reason = 'OPEN_CRITICAL_FINDING'
      ELSE IF group.current_runbook_id IS NULL:
        posture = 'RESTRICTED';  posture_reason = 'NO_VALIDATED_RUNBOOK'
      ELSE IF runbook(group.current_runbook_id).status != 'VALIDATED'
           OR runbook(group.current_runbook_id).readiness_score < READINESS_FLOOR_FOR_SCOPING:
        posture = 'RESTRICTED';  posture_reason = 'RUNBOOK_STALE'
      ELSE:
        posture = 'READY';       posture_reason = 'READY_ALL_CHECKS_PASSED'
      # Evaluation order is pinned: the finding check dominates the runbook check, so a
      # frozen group stays FROZEN even while holding a perfectly fresh VALIDATED runbook.
    input_set: "Findings on this group in states OPEN, REMEDIATION_ASSIGNED, REMEDIATED, RETEST_SCHEDULED, RETEST_FAILED; the single Runbook referenced by current_runbook_id"
    constants:
      READINESS_FLOOR_FOR_SCOPING: 80.00
    precision: "not applicable"

  - name: recovery_group_open_finding_count
    trigger: "recomputed on POST /findings and on every POST /findings/{id}/transitions action; writes RecoveryGroup.open_finding_count"
    algorithm: aggregation
    formula: |
      open_finding_count = count(Finding f WHERE f.recovery_group_id == group.id
                                             AND f.state IN {OPEN, REMEDIATION_ASSIGNED,
                                                             REMEDIATED, RETEST_SCHEDULED,
                                                             RETEST_FAILED})
    input_set: "Findings whose recovery_group_id equals the group and whose state is non-terminal; CLOSED and WITHDRAWN are excluded"
    constants: {}
    precision: "integer count"

  - name: exercise_required_capacity_units
    trigger: "recomputed on each accepted POST /exercises/{id}/scope-items; writes ExerciseScopeItem.capacity_units_contributed and Exercise.required_capacity_units"
    algorithm: aggregation
    formula: |
      capacity_units_contributed(item) = CAPACITY_BY_TYPE[exercise.exercise_type]
      required_capacity_units = sum(capacity_units_contributed(item)
                                    for item in scope_items(exercise))
    input_set: "every ExerciseScopeItem of the exercise; scope items are never deleted, so the sum only grows while the exercise accepts scope"
    constants:
      CAPACITY_BY_TYPE: { TABLETOP: 0, COMPONENT_FAILOVER: 2, FULL_SITE_FAILOVER: 6 }
    precision: "integer units"

  - name: site_reserved_capacity_units
    trigger: "recomputed whenever an Exercise on this site enters or leaves {SCHEDULED, IN_EXECUTION, FAILOVER_COMPLETE} — POST /exercises/{id}/schedule, execution-transitions START/COMPLETE_FAILOVER/CLOSE/ABORT/CANCEL, cascade A hop 6 and cascade B hop 5; writes Site.reserved_capacity_units"
    algorithm: aggregation
    formula: |
      reserved_capacity_units = sum(e.required_capacity_units
                                    for Exercise e
                                    WHERE e.recovery_site_id == site.id
                                      AND e.execution_state IN {SCHEDULED, IN_EXECUTION,
                                                                FAILOVER_COMPLETE})
      # Full recompute from the exercise table on every touch — never an incremental
      # delta — so schedule/cancel pairs cannot drift (compensating invariant).
    input_set: "Exercises on this recovery site in execution_state SCHEDULED, IN_EXECUTION or FAILOVER_COMPLETE; DRAFT, SCOPED, PENDING_IMPACT_APPROVAL, APPROVED, CLOSED, CANCELLED and ABORTED are excluded"
    constants: {}
    precision: "integer units"

  - name: production_impact_score_with_governance_surcharge
    trigger: "runs on POST /exercises/{id}/impact-submissions (SCOPED -> PENDING_IMPACT_APPROVAL); writes Exercise.provisional_impact_score, Exercise.production_impact_score and Exercise.required_approval_level"
    algorithm: threshold
    formula: |
      # STEP 1 — provisional score
      criticality_component = sum(a.criticality_weight
                                  for Application a
                                  WHERE a.tier_agreement_status == 'AGREED'
                                    AND a.recovery_group_id IN in_scope_group_ids(exercise))
      capacity_component    = round_half_up(CAPACITY_WEIGHT * exercise.required_capacity_units
                                            / site(exercise.recovery_site_id).usable_capacity_units, 2)
      provisional_impact_score = round_half_up(TYPE_BASE[exercise.exercise_type]
                                               + criticality_component
                                               + capacity_component, 2)
      # STEP 2 — provisional level from the PROVISIONAL score
      provisional_level = level_of(provisional_impact_score)
      # STEP 3 — surcharge keyed on the PROVISIONAL level (not on the final one)
      surcharge = SURCHARGE_BY_LEVEL[provisional_level]
      # STEP 4 — final score
      production_impact_score = round_half_up(provisional_impact_score + surcharge, 2)
      # STEP 5 — required_approval_level is derived EXACTLY ONCE, from the FINAL score
      required_approval_level = level_of(production_impact_score)
      # level_of(s) = 'LEVEL_3' IF s >= 60.00 ELSE 'LEVEL_2' IF s >= 40.00 ELSE 'LEVEL_1'
      #
      # PINNED EVALUATION ORDER. The dependency looks circular — the surcharge depends
      # on the level, the level depends on the score, the score depends on the surcharge
      # — and it is resolved by exactly one forward pass: the surcharge keeps the value
      # of the PROVISIONAL band even when the final score lands in a higher band, and
      # the level is NOT re-derived a second time to grow the surcharge. No iteration to
      # a fixed point.
    input_set: "Applications with tier_agreement_status == AGREED whose recovery_group_id appears in an ExerciseScopeItem of this exercise; the recovery Site named by exercise.recovery_site_id"
    constants:
      TYPE_BASE: { TABLETOP: 5, COMPONENT_FAILOVER: 20, FULL_SITE_FAILOVER: 40 }
      CAPACITY_WEIGHT: 10.0
      SURCHARGE_BY_LEVEL: { LEVEL_1: 1, LEVEL_2: 3, LEVEL_3: 5 }
      LEVEL_2_FLOOR: 40.00
      LEVEL_3_FLOOR: 60.00
    precision: "2 decimal places, round_half_up on capacity_component, on provisional_impact_score and on production_impact_score"

  - name: exercise_objectives_baseline
    trigger: "runs on POST /exercises/{id}/execution-transitions with action START (SCHEDULED -> IN_EXECUTION); writes Exercise.rto_objective_minutes and Exercise.rpo_objective_minutes"
    algorithm: aggregation
    formula: |
      baseline_apps = [Application a WHERE a.tier_agreement_status == 'AGREED'
                                       AND a.recovery_group_id IN in_scope_group_ids(exercise)]
      IF baseline_apps IS EMPTY: reject with ERR_NO_RTO_BASELINE (validations priority 42)
      rto_objective_minutes = min(a.rto_minutes for a in baseline_apps)   # tightest objective
      rpo_objective_minutes = min(a.rpo_minutes for a in baseline_apps)
    input_set: "Applications with tier_agreement_status == AGREED that are members of an in-scope recovery group; DRAFT, TIER_PROPOSED and CHANGES_REQUESTED applications are excluded, which is what makes the empty-set boundary reachable"
    constants: {}
    precision: "integer minutes"

  - name: achieved_rto_minutes
    trigger: "runs on POST /exercises/{id}/execution-transitions with action COMPLETE_FAILOVER (IN_EXECUTION -> FAILOVER_COMPLETE); writes Exercise.achieved_rto_minutes and Exercise.rto_met"
    algorithm: chronological
    formula: |
      variant_applied = 'WALL_CLOCK' IF exercise.exercise_type == 'FULL_SITE_FAILOVER'
                        ELSE 'NET_EXECUTION'
      IF variant_applied == 'WALL_CLOCK':
        achieved_rto_minutes = ceil((exercise.failover_completed_at
                                     - exercise.execution_started_at) / 60 seconds)
      ELSE:
        achieved_rto_minutes = sum(se.elapsed_minutes
                                   for StepExecution se
                                   WHERE se.exercise_id == exercise.id
                                     AND se.outcome IN {PASSED, PASSED_WITH_ISSUE, FAILED})
      rto_met = (achieved_rto_minutes <= exercise.rto_objective_minutes)
      # se.elapsed_minutes = ceil(se.elapsed_seconds / 60), pinned per StepExecution at
      # write time, so the sum is a sum of already-ceiled per-step minutes and NOT
      # ceil(sum(seconds)/60).
    input_set: "WALL_CLOCK reads only the two Exercise timestamps; NET_EXECUTION reads StepExecutions of this exercise whose outcome is PASSED, PASSED_WITH_ISSUE or FAILED — SKIPPED rows are excluded from the sum"
    constants: {}
    precision: "integer minutes; per-step ceiling applied before summation"
    variants:
      - name: WALL_CLOCK
        when: "exercise_type == FULL_SITE_FAILOVER — a whole-site rehearsal is judged on the elapsed outage window including gaps between steps"
        difference: "ceil of (failover_completed_at - execution_started_at); idle time between steps counts against the objective"
      - name: NET_EXECUTION
        when: "exercise_type IN {TABLETOP, COMPONENT_FAILOVER} — a partial rehearsal is judged only on hands-on step time"
        difference: "sum of per-step ceiled minutes for non-SKIPPED steps; idle time between steps is invisible"

  - name: achieved_rpo_minutes
    trigger: "runs on POST /exercises/{id}/execution-transitions with action COMPLETE_FAILOVER (IN_EXECUTION -> FAILOVER_COMPLETE); writes Exercise.achieved_rpo_minutes and Exercise.rpo_met"
    algorithm: projection
    formula: |
      scoped_stores = [Asset s WHERE s.asset_kind == 'DATA_STORE'
                                 AND s.recovery_group_id IN in_scope_group_ids(exercise)]
      latest(s) = the ReplicationObservation of s with the greatest observed_at
                  (tie-break: greatest created_at) among rows with
                  observed_at <= exercise.failover_completed_at
      variant_applied = 'TRANSACTION_GAP'
                        IF EXISTS s IN scoped_stores WHERE s.replication_mode == 'BATCH_SNAPSHOT'
                        ELSE 'REPLICATION_LAG'
      IF variant_applied == 'REPLICATION_LAG':
        achieved_rpo_minutes = max(ceil(latest(s).replication_lag_seconds / 60)
                                   for s in scoped_stores)
      ELSE:
        achieved_rpo_minutes = max(ceil(latest(s).unreplicated_txn_count
                                        / s.expected_txn_rate_per_minute)
                                   for s in scoped_stores
                                   WHERE s.expected_txn_rate_per_minute > 0)
      rpo_met = (achieved_rpo_minutes <= exercise.rpo_objective_minutes)
      # A DATA_STORE with expected_txn_rate_per_minute == 0 is skipped by TRANSACTION_GAP
      # (no division by zero); if that leaves the set empty the result is 0.
    input_set: "DATA_STORE Assets whose recovery_group_id is in scope; per asset the single latest ReplicationObservation at or before failover_completed_at; INFRA_COMPONENT assets are excluded"
    constants: {}
    precision: "integer minutes; ceiling applied per asset before the max"
    variants:
      - name: REPLICATION_LAG
        when: "no in-scope DATA_STORE runs replication_mode BATCH_SNAPSHOT — the measured stream lag is the honest data-loss window"
        difference: "ceil(replication_lag_seconds / 60) per asset, maximised"
      - name: TRANSACTION_GAP
        when: "at least one in-scope DATA_STORE runs replication_mode BATCH_SNAPSHOT — lag seconds are meaningless between snapshots, so the queued write backlog is divided by the steady-state write rate"
        difference: "ceil(unreplicated_txn_count / expected_txn_rate_per_minute) per asset, maximised, skipping assets whose rate is 0"

  - name: finding_retest_escalation
    trigger: "runs on POST /findings/{id}/transitions with action RECORD_RETEST_RESULT and retest_result FAILED (RETEST_SCHEDULED -> RETEST_FAILED); writes Finding.retest_failure_count and Finding.escalated"
    algorithm: threshold
    formula: |
      retest_failure_count = retest_failure_count + 1
      escalated = (retest_failure_count >= ESCALATION_FAILURE_THRESHOLD
                   AND severity == 'CRITICAL')
      # escalated is monotonic: once true it stays true until the finding reaches
      # CLOSED or WITHDRAWN, at which point it stops gating the group's posture.
    input_set: "the single Finding under transition; severity is the row's own input value"
    constants:
      ESCALATION_FAILURE_THRESHOLD: 2
    precision: "integer count"

  - name: evidence_manifest_line_count
    trigger: "runs on POST /evidence-packages/{id}/transitions with action SUBMIT (DRAFT -> SUBMITTED and RETURNED -> SUBMITTED); writes EvidencePackage.manifest_line_count"
    algorithm: aggregation
    formula: |
      manifest_line_count = MANIFEST_HEADER_LINES
                          + count(ExerciseScopeItem WHERE exercise_id == package.exercise_id)
                          + count(StepExecution     WHERE exercise_id == package.exercise_id)
                          + count(Finding f WHERE f.exercise_id == package.exercise_id
                                              AND f.state != 'WITHDRAWN')
    input_set: "all scope items and all step executions of the evidenced exercise regardless of outcome, plus its Findings excluding WITHDRAWN ones"
    constants:
      MANIFEST_HEADER_LINES: 1
    precision: "integer count"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for every entity_backed role, X-User-ID resolves to a Stakeholder with status ACTIVE whose org_roles contains the org_role mapped from X-User-Role (BusinessOwner->BUSINESS_OWNER, ResilienceCoordinator->RESILIENCE_COORDINATOR, ITOperator->IT_OPERATOR, RiskApprover->RISK_APPROVER, AuditLiaison->AUDIT_LIAISON)"
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all endpoints except POST /stakeholders, PATCH /stakeholders/{id} and POST /_clock/set_current_utc, which are PlatformAdmin (opaque)"
  - priority: 4
    category: existence
    check: "path-templated ids exist, validated left-to-right"
    error_id: "ERR_STAKEHOLDER_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_DEPENDENCY_EDGE_NOT_FOUND | ERR_RECOVERY_GROUP_NOT_FOUND | ERR_RUNBOOK_NOT_FOUND | ERR_RUNBOOK_STEP_NOT_FOUND | ERR_EXERCISE_NOT_FOUND | ERR_SCOPE_ITEM_NOT_FOUND | ERR_STEP_EXECUTION_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_EVIDENCE_PACKAGE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a templated path segment"
  - priority: 5
    category: existence
    check: "foreign keys supplied in the request body reference existing rows, validated in the order the fields are listed in the endpoint's input"
    error_id: "ERR_STAKEHOLDER_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_RECOVERY_GROUP_NOT_FOUND | ERR_RUNBOOK_NOT_FOUND | ERR_RUNBOOK_STEP_NOT_FOUND | ERR_EXERCISE_NOT_FOUND"
    http_status: 404
    applies_to: "every POST/PATCH carrying foreign keys"
  - priority: 6
    category: business_constraint
    check: "required input fields are present, enum values are members of their declared set, integers are within their declared range, datetimes are ISO 8601 UTC, and pagination limit is 1..100 with offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 7
    category: state
    check: "the OCC field matches the parent's current version — expected_recovery_group_version on POST /runbooks, expected_exercise_version on POST /exercises/{id}/scope-items (see §1.2.1)"
    error_id: "ERR_STALE_RECOVERY_GROUP_VERSION | ERR_STALE_EXERCISE_VERSION"
    http_status: 412
    applies_to: "POST /runbooks, POST /exercises/{id}/scope-items"
  - priority: 8
    category: state
    check: "Exercise.execution_state is a declared from-state for the requested action"
    error_id: ERR_INVALID_EXERCISE_STATE
    http_status: 409
    applies_to: "POST /exercises/{id}/scope-items, impact-submissions, impact-decisions, schedule, execution-transitions, step-executions"
  - priority: 9
    category: state
    check: "Exercise.data_state is a declared from-state for the requested data action, and execution_state == FAILOVER_COMPLETE"
    error_id: ERR_INVALID_DATA_STATE
    http_status: 409
    applies_to: "POST /exercises/{id}/data-transitions, POST /exercises/{id}/execution-transitions with action CLOSE"
  - priority: 10
    category: state
    check: "Exercise.failback_state is a declared from-state for the requested failback action, and execution_state == FAILOVER_COMPLETE"
    error_id: ERR_INVALID_FAILBACK_STATE
    http_status: 409
    applies_to: "POST /exercises/{id}/failback-transitions, POST /exercises/{id}/execution-transitions with action CLOSE"
  - priority: 11
    category: state
    check: "Runbook.status is a declared from-state for the requested action and the action's preconditions hold (SUBMIT_FOR_REVIEW needs >= 1 step; VALIDATE needs every step VALIDATED)"
    error_id: ERR_INVALID_RUNBOOK_STATE
    http_status: 409
    applies_to: "POST /runbooks/{id}/transitions"
  - priority: 12
    category: state
    check: "the owning Runbook.status is not SUPERSEDED when validating a step"
    error_id: ERR_INVALID_STEP_STATE
    http_status: 409
    applies_to: "POST /runbook-steps/{id}/validations, POST /runbook-steps"
  - priority: 13
    category: state
    check: "Application.tier_agreement_status is a declared from-state for the requested tier action (tier-decisions require TIER_PROPOSED)"
    error_id: ERR_INVALID_APPLICATION_TIER_STATE
    http_status: 409
    applies_to: "POST /applications/{id}/tier-proposals, POST /applications/{id}/tier-decisions"
  - priority: 14
    category: state
    check: "Finding.state is a declared from-state for the requested action"
    error_id: ERR_INVALID_FINDING_STATE
    http_status: 409
    applies_to: "POST /findings/{id}/transitions"
  - priority: 15
    category: state
    check: "EvidencePackage.state is a declared from-state for the requested action"
    error_id: ERR_INVALID_EVIDENCE_STATE
    http_status: 409
    applies_to: "POST /evidence-packages/{id}/transitions"
  - priority: 16
    category: state
    check: "a SEALED EvidencePackage accepts no further transition"
    error_id: ERR_EVIDENCE_SEALED
    http_status: 409
    applies_to: "POST /evidence-packages/{id}/transitions"
  - priority: 17
    category: business_safety
    check: "segregation of duties — X-User-ID must differ from Application.proposed_by_id when agreeing a tier"
    error_id: ERR_SOD_TIER_PROPOSER
    http_status: 422
    applies_to: "POST /applications/{id}/tier-decisions with action AGREE"
  - priority: 18
    category: business_safety
    check: "segregation of duties — X-User-ID must differ from Exercise.coordinator_id when deciding production impact"
    error_id: ERR_SOD_IMPACT_APPROVER
    http_status: 422
    applies_to: "POST /exercises/{id}/impact-decisions"
  - priority: 19
    category: business_safety
    check: "segregation of duties — X-User-ID must differ from RunbookStep.owner_id when recording that step's execution"
    error_id: ERR_SOD_STEP_OWNER
    http_status: 422
    applies_to: "POST /exercises/{id}/step-executions"
  - priority: 20
    category: business_safety
    check: "segregation of duties — X-User-ID must differ from EvidencePackage.prepared_by_id when signing off"
    error_id: ERR_SOD_EVIDENCE_SIGNER
    http_status: 422
    applies_to: "POST /evidence-packages/{id}/transitions with action SIGN_OFF"
  - priority: 21
    category: business_safety
    check: "the acting Stakeholder.approval_authority_level is >= Exercise.required_approval_level in the order LEVEL_1 < LEVEL_2 < LEVEL_3"
    error_id: ERR_INSUFFICIENT_APPROVAL_AUTHORITY
    http_status: 403
    applies_to: "POST /exercises/{id}/impact-decisions with action APPROVE"
  - priority: 22
    category: business_safety
    check: "the group's current_runbook_id is non-null, that Runbook.status == VALIDATED, and its readiness_score recomputed as of the current logical clock is >= 80.00"
    error_id: ERR_RUNBOOK_STALE
    http_status: 422
    applies_to: "POST /exercises/{id}/scope-items"
  - priority: 23
    category: business_safety
    check: "every in-scope RecoveryGroup.posture == READY when submitting production impact"
    error_id: ERR_GROUP_NOT_READY
    http_status: 422
    applies_to: "POST /exercises/{id}/impact-submissions"
  - priority: 24
    category: business_safety
    check: "the RecoveryGroup being scoped is not in posture FROZEN"
    error_id: ERR_GROUP_FROZEN
    http_status: 422
    applies_to: "POST /exercises/{id}/scope-items"
  - priority: 25
    category: business_safety
    check: "when RunbookStep.covers_application_id is non-null, that Application.tier_agreement_status == AGREED"
    error_id: ERR_STEP_COVERS_UNAGREED_APPLICATION
    http_status: 422
    applies_to: "POST /runbook-steps/{id}/validations"
  - priority: 26
    category: business_referential
    check: "RecoveryGroup.recovery_site_id == Exercise.recovery_site_id for every scope item"
    error_id: ERR_GROUP_SITE_MISMATCH
    http_status: 422
    applies_to: "POST /exercises/{id}/scope-items"
  - priority: 27
    category: business_referential
    check: "a dependency edge's from node and to node are not the same node"
    error_id: ERR_SELF_DEPENDENCY
    http_status: 422
    applies_to: "POST /dependency-edges"
  - priority: 28
    category: business_referential
    check: "adding a HARD edge must not create a directed cycle among HARD edges; SOFT edges are exempt"
    error_id: ERR_DEPENDENCY_CYCLE
    http_status: 422
    applies_to: "POST /dependency-edges"
  - priority: 29
    category: business_referential
    check: "no existing DependencyEdge has the same from_node_id, to_node_id and edge_kind"
    error_id: ERR_DUPLICATE_DEPENDENCY_EDGE
    http_status: 409
    applies_to: "POST /dependency-edges"
  - priority: 30
    category: business_referential
    check: "no existing ExerciseScopeItem on this exercise already names the recovery_group_id"
    error_id: ERR_DUPLICATE_SCOPE_ITEM
    http_status: 409
    applies_to: "POST /exercises/{id}/scope-items"
  - priority: 31
    category: business_referential
    check: "the cited RunbookStep.runbook_id equals the runbook_id_snapshot of one of this exercise's scope items"
    error_id: ERR_STEP_NOT_IN_SCOPE
    http_status: 422
    applies_to: "POST /exercises/{id}/step-executions"
  - priority: 32
    category: business_referential
    check: "the nominated retest Exercise holds an ExerciseScopeItem on Finding.recovery_group_id"
    error_id: ERR_RETEST_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /findings/{id}/transitions with action SCHEDULE_RETEST"
  - priority: 33
    category: business_constraint
    check: "proposed_rto_minutes <= TIER_RTO_CAP[proposed_tier] with caps TIER_1 60, TIER_2 240, TIER_3 1440"
    error_id: ERR_TIER_RTO_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /applications/{id}/tier-proposals"
  - priority: 34
    category: business_constraint
    check: "proposed_rpo_minutes <= TIER_RPO_CAP[proposed_tier] with caps TIER_1 15, TIER_2 60, TIER_3 1440"
    error_id: ERR_TIER_RPO_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /applications/{id}/tier-proposals"
  - priority: 35
    category: business_constraint
    check: "site_code, app_code, asset_code, group_code and Stakeholder.email are unique within their entity"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /sites, POST /applications, POST /assets, POST /recovery-groups, POST /stakeholders"
  - priority: 36
    category: business_constraint
    check: "step_number is unique within the runbook"
    error_id: ERR_DUPLICATE_STEP_NUMBER
    http_status: 409
    applies_to: "POST /runbook-steps"
  - priority: 37
    category: business_temporal
    check: "the exercise interval [planned_start_at, planned_end_at) must not intersect the interval of another Exercise on the same recovery_site_id in execution_state IN {SCHEDULED, IN_EXECUTION}; intervals are half-open so touching endpoints (A.planned_end_at == B.planned_start_at) do NOT conflict; additionally no interval may START within FULL_SITE_BUFFER_MINUTES after the planned_end_at of such an exercise whose exercise_type == FULL_SITE_FAILOVER (buffer 240 minutes)"
    error_id: ERR_SITE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /exercises/{id}/schedule"
  - priority: 38
    category: business_temporal
    check: "the exercise interval must not intersect the CLOSED interval [change_freeze_start_at, change_freeze_end_at] of any in-scope RecoveryGroup; because the freeze interval is closed on both ends, an exercise that merely touches an endpoint DOES conflict"
    error_id: ERR_GROUP_CHANGE_FREEZE_CONFLICT
    http_status: 409
    applies_to: "POST /exercises/{id}/scope-items"
  - priority: 39
    category: business_temporal
    check: "floor((current logical clock - Runbook.validated_at) / 86400 seconds) <= Runbook.validity_days for the snapshot runbook"
    error_id: ERR_RUNBOOK_VALIDITY_EXPIRED
    http_status: 422
    applies_to: "POST /exercises/{id}/scope-items"
  - priority: 40
    category: business_referential
    check: "the evidenced Exercise.execution_state == CLOSED when submitting an evidence package"
    error_id: ERR_EXERCISE_NOT_CLOSED
    http_status: 422
    applies_to: "POST /evidence-packages/{id}/transitions with action SUBMIT"
  - priority: 41
    category: business_fiscal
    check: "Site.reserved_capacity_units + Exercise.required_capacity_units <= Site.usable_capacity_units — equality is allowed"
    error_id: ERR_SITE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /exercises/{id}/schedule"
  - priority: 42
    category: business_constraint
    check: "at least one Application with tier_agreement_status == AGREED is a member of an in-scope RecoveryGroup when starting execution"
    error_id: ERR_NO_RTO_BASELINE
    http_status: 422
    applies_to: "POST /exercises/{id}/execution-transitions with action START"
  - priority: 43
    category: business_constraint
    check: "every in-scope DATA_STORE Asset has at least one ReplicationObservation with observed_at <= the current logical clock"
    error_id: ERR_NO_REPLICATION_OBSERVATION
    http_status: 422
    applies_to: "POST /exercises/{id}/execution-transitions with action COMPLETE_FAILOVER"
  - priority: 44
    category: business_temporal
    check: "planned_end_at > planned_start_at on exercises, and change_freeze_end_at >= change_freeze_start_at on change freezes"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /exercises, POST /recovery-groups/{id}/change-freeze"
  - priority: 45
    category: business_temporal
    check: "observed_at <= the current logical clock"
    error_id: ERR_OBSERVATION_IN_FUTURE
    http_status: 422
    applies_to: "POST /assets/{id}/replication-observations"
  - priority: 46
    category: business_referential
    check: "on a tier decision the acting X-User-ID equals Application.business_owner_id — the tier is agreed by the application's own business owner, not by any holder of the BUSINESS_OWNER org_role. Deliberately the lowest priority: an application in the wrong tier state reports the state error at priority 13 and a self-agreed proposal reports the segregation-of-duties error at priority 17 before ownership is considered"
    error_id: ERR_NOT_APPLICATION_OWNER
    http_status: 403
    applies_to: "POST /applications/{id}/tier-decisions"

endpoints:
  # ---------- Stakeholders ----------
  - method: POST
    path: "/stakeholders"
    description: "register a person and the organisational hats they wear"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, org_roles, "approval_authority_level?"]
    output: Stakeholder
    side_effects: ["none"]
  - method: PATCH
    path: "/stakeholders/{id}"
    description: "update participation status, authority level or organisational roles; suspending a person is the head of cascade C"
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "approval_authority_level?", "org_roles?"]
    output: Stakeholder
    side_effects:
      - "CASCADE C hop 1: status ACTIVE -> SUSPENDED"
      - "CASCADE C hop 2 (caused by hop 1): every RunbookStep owned by this person with validation_status VALIDATED moves to INVALIDATED"
      - "CASCADE C hop 3 (caused by hop 2): each owning Runbook in status VALIDATED moves to STALE with stale_reason STEP_OWNER_SUSPENDED and its readiness_score is recomputed"
      - "CASCADE C hop 4 (caused by hop 3): each affected RecoveryGroup.posture is re-derived, typically to RESTRICTED with posture_reason RUNBOOK_STALE"
  - method: GET
    path: "/stakeholders/{id}"
    description: "read one stakeholder"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: Stakeholder
    side_effects: ["none"]
  - method: GET
    path: "/stakeholders"
    description: "paginated stakeholder list"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Stakeholder[]
    side_effects: ["none"]

  # ---------- Sites ----------
  - method: POST
    path: "/sites"
    description: "register a data centre and its failover capacity"
    roles: [PlatformAdmin]
    code: 201
    input: [name, site_code, role, usable_capacity_units]
    output: Site
    side_effects: ["initialises reserved_capacity_units to 0"]
  - method: GET
    path: "/sites/{id}"
    description: "read one site including its reserved capacity"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: Site
    side_effects: ["none"]
  - method: GET
    path: "/sites"
    description: "paginated site list"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["role?", "limit?", "offset?"]
    output: Site[]
    side_effects: ["none"]

  # ---------- Applications and tiering ----------
  - method: POST
    path: "/applications"
    description: "register an application awaiting tier agreement"
    roles: [ResilienceCoordinator, PlatformAdmin]
    code: 201
    input: [name, app_code, business_owner_id, primary_site_id, criticality_weight]
    output: Application
    side_effects: ["tier_agreement_status starts at DRAFT with tier, rto_minutes and rpo_minutes null"]
  - method: GET
    path: "/applications/{id}"
    description: "read one application"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["none"]
  - method: GET
    path: "/applications"
    description: "paginated application list filtered by owner, primary site, recovery group, proposer or agreement state"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["business_owner_id?", "primary_site_id?", "recovery_group_id?", "proposed_by_id?", "tier_agreement_status?", "limit?", "offset?"]
    output: Application[]
    side_effects: ["none"]
  - method: POST
    path: "/applications/{id}/tier-proposals"
    description: "propose tier, RTO and RPO; re-proposing an AGREED application is the head of cascade A"
    roles: [ResilienceCoordinator, PlatformAdmin]
    code: 201
    input: [proposed_tier, proposed_rto_minutes, proposed_rpo_minutes, "rationale?"]
    output: Application
    side_effects:
      - "sets tier_agreement_status TIER_PROPOSED and proposed_by_id = X-User-ID"
      - "from AGREED: runs cascade A hops 1-6 (retier_count, step invalidation, runbook STALE, posture RESTRICTED, scheduled exercises revert to SCOPED, site reserved capacity recomputed)"
  - method: POST
    path: "/applications/{id}/tier-decisions"
    description: "business owner agrees the proposal or requests changes"
    roles: [BusinessOwner]
    code: 201
    input: [action, "decision_note?"]
    output: Application
    side_effects:
      - "AGREE copies the proposal into tier, rto_minutes, rpo_minutes and recomputes the group's projected_recovery_minutes and recovery_sequence"
      - "REQUEST_CHANGES sets tier_agreement_status CHANGES_REQUESTED and leaves the agreed values untouched"
  - method: POST
    path: "/applications/{id}/group-assignments"
    description: "assign the application to a recovery group"
    roles: [ResilienceCoordinator]
    code: 201
    input: [recovery_group_id]
    output: Application
    side_effects:
      - "sets Application.recovery_group_id"
      - "recomputes RecoveryGroup.projected_recovery_minutes and recovery_sequence"
      - "increments RecoveryGroup.version by 1"

  # ---------- Assets, observations and dependencies ----------
  - method: POST
    path: "/assets"
    description: "register a data store or infrastructure component"
    roles: [ITOperator, ResilienceCoordinator]
    code: 201
    input: [name, asset_code, asset_kind, site_id, replication_mode, restore_minutes, "expected_txn_rate_per_minute?"]
    output: Asset
    side_effects: ["none"]
  - method: GET
    path: "/assets/{id}"
    description: "read one asset"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: Asset
    side_effects: ["none"]
  - method: GET
    path: "/assets"
    description: "paginated asset list filtered by site, recovery group or kind"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["site_id?", "recovery_group_id?", "asset_kind?", "limit?", "offset?"]
    output: Asset[]
    side_effects: ["none"]
  - method: POST
    path: "/assets/{id}/group-assignments"
    description: "assign the asset to a recovery group"
    roles: [ResilienceCoordinator]
    code: 201
    input: [recovery_group_id]
    output: Asset
    side_effects:
      - "sets Asset.recovery_group_id"
      - "recomputes RecoveryGroup.projected_recovery_minutes and recovery_sequence"
      - "increments RecoveryGroup.version by 1"
  - method: POST
    path: "/assets/{id}/replication-observations"
    description: "append a replication measurement to the asset's immutable observation log"
    roles: [ITOperator]
    code: 201
    input: [observed_at, replication_lag_seconds, unreplicated_txn_count]
    output: ReplicationObservation
    side_effects: ["sets recorded_by_user_id = X-User-ID; no entity is mutated"]
  - method: GET
    path: "/assets/{id}/replication-observations"
    description: "list an asset's replication observations, newest observed_at first"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReplicationObservation[]
    side_effects: ["none"]
  - method: POST
    path: "/dependency-edges"
    description: "declare a dependency between two application/asset nodes"
    roles: [ResilienceCoordinator]
    code: 201
    input: [from_node_kind, from_node_id, to_node_kind, to_node_id, edge_kind]
    output: DependencyEdge
    side_effects:
      - "HARD edges are cycle-checked, then recompute projected_recovery_minutes and recovery_sequence for every RecoveryGroup containing both endpoints, incrementing that group's version by 1"
      - "SOFT edges are recorded without touching any projection"
  - method: GET
    path: "/dependency-edges/{id}"
    description: "read one dependency edge"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: DependencyEdge
    side_effects: ["none"]
  - method: GET
    path: "/dependency-edges"
    description: "paginated dependency-edge list filtered by either endpoint or kind"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["from_node_id?", "to_node_id?", "edge_kind?", "limit?", "offset?"]
    output: DependencyEdge[]
    side_effects: ["none"]

  # ---------- Recovery groups ----------
  - method: POST
    path: "/recovery-groups"
    description: "create a recovery group targeting a recovery site"
    roles: [ResilienceCoordinator]
    code: 201
    input: [name, group_code, recovery_site_id, lead_coordinator_id, recovery_order]
    output: RecoveryGroup
    side_effects: ["posture starts RESTRICTED with posture_reason NO_VALIDATED_RUNBOOK; projected_recovery_minutes 0; open_finding_count 0"]
  - method: GET
    path: "/recovery-groups/{id}"
    description: "read one recovery group including posture, projection and version"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: RecoveryGroup
    side_effects: ["none"]
  - method: GET
    path: "/recovery-groups"
    description: "paginated recovery-group list filtered by site, lead, current runbook or posture"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["recovery_site_id?", "lead_coordinator_id?", "current_runbook_id?", "posture?", "limit?", "offset?"]
    output: RecoveryGroup[]
    side_effects: ["none"]
  - method: POST
    path: "/recovery-groups/{id}/change-freeze"
    description: "set the group's closed change-freeze interval"
    roles: [ResilienceCoordinator]
    code: 201
    input: [change_freeze_start_at, change_freeze_end_at]
    output: RecoveryGroup
    side_effects: ["stores the interval; increments RecoveryGroup.version by 1"]
  - method: POST
    path: "/recovery-groups/{id}/posture-refresh"
    description: "re-derive readiness_score of the current runbook and then posture/posture_reason against the current logical clock"
    roles: [ResilienceCoordinator, AuditLiaison]
    code: 200
    input: []
    output: RecoveryGroup
    side_effects:
      - "recomputes Runbook.readiness_score for current_runbook_id"
      - "recomputes projected_recovery_minutes, recovery_sequence and open_finding_count"
      - "re-derives posture and posture_reason; a posture drop out of READY fires cascade A hop 5 for SCHEDULED exercises"

  # ---------- Runbooks and steps ----------
  - method: POST
    path: "/runbooks"
    description: "open a new runbook revision for a recovery group; guarded by OCC on the group's version"
    roles: [ResilienceCoordinator]
    code: 201
    input: [recovery_group_id, title, author_id, expected_recovery_group_version, "validity_days?"]
    output: Runbook
    side_effects:
      - "revision = 1 + count of prior runbooks on the group ordered by created_at ASC"
      - "status DRAFT, readiness_score 0.00, stale_reason NONE"
      - "increments RecoveryGroup.version by 1"
  - method: GET
    path: "/runbooks/{id}"
    description: "read one runbook including readiness_score and validated_at"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: Runbook
    side_effects: ["none"]
  - method: GET
    path: "/runbooks"
    description: "paginated runbook list filtered by group, author or status"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["recovery_group_id?", "author_id?", "status?", "limit?", "offset?"]
    output: Runbook[]
    side_effects: ["none"]
  - method: POST
    path: "/runbooks/{id}/transitions"
    description: "advance the runbook lifecycle (SUBMIT_FOR_REVIEW, RETURN_TO_DRAFT, VALIDATE)"
    roles: [ResilienceCoordinator]
    code: 201
    input: [action, "note?"]
    output: Runbook
    side_effects:
      - "recomputes readiness_score on every action"
      - "VALIDATE stamps validated_at, re-points RecoveryGroup.current_runbook_id, marks the previous revision SUPERSEDED and re-derives the group's posture"
  - method: POST
    path: "/runbook-steps"
    description: "add a step with an owner, expected duration and readiness weight"
    roles: [ResilienceCoordinator, ITOperator]
    code: 201
    input: [runbook_id, step_number, description, owner_id, expected_minutes, weight, "covers_application_id?", "covers_asset_id?"]
    output: RunbookStep
    side_effects: ["validation_status starts PENDING with last_validated_at null"]
  - method: GET
    path: "/runbook-steps/{id}"
    description: "read one runbook step"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: RunbookStep
    side_effects: ["none"]
  - method: GET
    path: "/runbook-steps"
    description: "paginated step list filtered by runbook, owner or covered node"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["runbook_id?", "owner_id?", "covers_application_id?", "covers_asset_id?", "validation_status?", "limit?", "offset?"]
    output: RunbookStep[]
    side_effects: ["none"]
  - method: POST
    path: "/runbook-steps/{id}/validations"
    description: "record a step validation, refreshing last_validated_at to the current logical clock"
    roles: [ITOperator]
    code: 201
    input: ["validation_note?"]
    output: RunbookStep
    side_effects:
      - "sets validation_status VALIDATED and last_validated_at = current logical clock"
      - "recomputes the owning Runbook.readiness_score, then the owning RecoveryGroup.posture"

  # ---------- Exercises ----------
  - method: POST
    path: "/exercises"
    description: "create an exercise with its planned site-occupation interval"
    roles: [ResilienceCoordinator]
    code: 201
    input: [name, exercise_type, recovery_site_id, coordinator_id, planned_start_at, planned_end_at]
    output: Exercise
    side_effects: ["all three state axes start at DRAFT / DATA_NOT_STARTED / FAILBACK_NOT_PLANNED with required_capacity_units 0"]
  - method: GET
    path: "/exercises/{id}"
    description: "read one exercise including all three state axes, scores and measured objectives"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: Exercise
    side_effects: ["none"]
  - method: GET
    path: "/exercises"
    description: "paginated exercise list filtered by site, coordinator, approver or execution state"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["recovery_site_id?", "coordinator_id?", "impact_approved_by_id?", "execution_state?", "limit?", "offset?"]
    output: Exercise[]
    side_effects: ["none"]
  - method: POST
    path: "/exercises/{id}/scope-items"
    description: "bring a recovery group into scope; guarded by OCC on the exercise's version"
    roles: [ResilienceCoordinator]
    code: 201
    input: [recovery_group_id, expected_exercise_version]
    output: ExerciseScopeItem
    side_effects:
      - "recomputes the group's current Runbook.readiness_score as of the current logical clock before evaluating validations priority 22"
      - "snapshots runbook_id_snapshot and group_projected_recovery_minutes_snapshot"
      - "sets capacity_units_contributed from CAPACITY_BY_TYPE and recomputes Exercise.required_capacity_units"
      - "moves execution_state DRAFT -> SCOPED on the first accepted item"
      - "increments Exercise.version by 1"
  - method: GET
    path: "/exercise-scope-items/{id}"
    description: "read one scope item with its snapshots"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: ExerciseScopeItem
    side_effects: ["none"]
  - method: GET
    path: "/exercise-scope-items"
    description: "paginated scope-item list filtered by exercise, group or snapshot runbook"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["exercise_id?", "recovery_group_id?", "runbook_id_snapshot?", "limit?", "offset?"]
    output: ExerciseScopeItem[]
    side_effects: ["none"]
  - method: POST
    path: "/exercises/{id}/impact-submissions"
    description: "submit the exercise for production-impact approval, computing the impact score and required authority level"
    roles: [ResilienceCoordinator]
    code: 201
    input: []
    output: Exercise
    side_effects:
      - "requires every in-scope group posture READY"
      - "writes provisional_impact_score, production_impact_score and required_approval_level per the pinned evaluation order"
      - "moves execution_state SCOPED -> PENDING_IMPACT_APPROVAL"
  - method: POST
    path: "/exercises/{id}/impact-decisions"
    description: "risk approver approves or rejects the production impact"
    roles: [RiskApprover]
    code: 201
    input: [action, "decision_note?"]
    output: Exercise
    side_effects:
      - "APPROVE sets impact_approved_by_id and moves to APPROVED"
      - "REJECT clears the three impact fields and returns the exercise to SCOPED"
  - method: POST
    path: "/exercises/{id}/schedule"
    description: "reserve the recovery site window and capacity for an approved exercise"
    roles: [ResilienceCoordinator]
    code: 201
    input: ["scheduling_note?"]
    output: Exercise
    side_effects:
      - "moves execution_state APPROVED -> SCHEDULED"
      - "recomputes Site.reserved_capacity_units, which increases by required_capacity_units"
  - method: POST
    path: "/exercises/{id}/execution-transitions"
    description: "drive execution axis 1 (START, COMPLETE_FAILOVER, ABORT, CLOSE, CANCEL)"
    roles: [ResilienceCoordinator]
    code: 201
    input: [action, "reason?"]
    output: Exercise
    side_effects:
      - "START stamps execution_started_at and pins rto_objective_minutes / rpo_objective_minutes"
      - "COMPLETE_FAILOVER stamps failover_completed_at and computes achieved_rto_minutes, rto_met, achieved_rpo_minutes, rpo_met"
      - "CLOSE requires DATA_VERIFIED and FAILBACK_COMPLETE and releases the site reservation"
      - "ABORT and CANCEL set closure_reason and release the site reservation when one was held"
  - method: POST
    path: "/exercises/{id}/step-executions"
    description: "record the timing and outcome of one runbook step during execution"
    roles: [ITOperator, ResilienceCoordinator]
    code: 201
    input: [runbook_step_id, outcome, elapsed_seconds, "notes?"]
    output: StepExecution
    side_effects:
      - "computes elapsed_minutes = ceil(elapsed_seconds / 60)"
      - "sets performed_by_user_id = X-User-ID, which must differ from RunbookStep.owner_id"
  - method: GET
    path: "/step-executions/{id}"
    description: "read one step execution"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: StepExecution
    side_effects: ["none"]
  - method: GET
    path: "/step-executions"
    description: "paginated step-execution list filtered by exercise, step or outcome"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["exercise_id?", "runbook_step_id?", "outcome?", "limit?", "offset?"]
    output: StepExecution[]
    side_effects: ["none"]
  - method: POST
    path: "/exercises/{id}/data-transitions"
    description: "drive data axis 2 (BEGIN_VALIDATION, VERIFY, FLAG_DIVERGENT, RECONCILE, REVALIDATE)"
    roles: [ITOperator]
    code: 201
    input: [action, "note?"]
    output: Exercise
    side_effects: ["moves data_state only; execution_state and failback_state are untouched"]
  - method: POST
    path: "/exercises/{id}/failback-transitions"
    description: "drive failback axis 3 (PLAN, START_SYNC, RECORD_SYNC_FAILURE, RETRY_SYNC, COMPLETE)"
    roles: [ITOperator]
    code: 201
    input: [action, "note?"]
    output: Exercise
    side_effects: ["moves failback_state only; execution_state and data_state are untouched"]

  # ---------- Findings ----------
  - method: POST
    path: "/findings"
    description: "raise a finding against an exercise and a recovery group"
    roles: [ResilienceCoordinator, ITOperator, AuditLiaison]
    code: 201
    input: [exercise_id, recovery_group_id, severity, title, description, "due_at?"]
    output: Finding
    side_effects:
      - "state starts OPEN with retest_failure_count 0 and escalated false"
      - "recomputes RecoveryGroup.open_finding_count, which increases by 1"
  - method: GET
    path: "/findings/{id}"
    description: "read one finding"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: Finding
    side_effects: ["none"]
  - method: GET
    path: "/findings"
    description: "paginated finding list filtered by exercise, group, owner, retest exercise or state"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["exercise_id?", "recovery_group_id?", "owner_id?", "retest_exercise_id?", "state?", "severity?", "limit?", "offset?"]
    output: Finding[]
    side_effects: ["none"]
  - method: POST
    path: "/findings/{id}/transitions"
    description: "drive remediation (ASSIGN, REMEDIATE, SCHEDULE_RETEST, RECORD_RETEST_RESULT, CLOSE, WITHDRAW)"
    roles: [ResilienceCoordinator]
    code: 201
    input: [action, "owner_id?", "retest_exercise_id?", "retest_result?", "note?"]
    output: Finding
    side_effects:
      - "ASSIGN sets owner_id; SCHEDULE_RETEST sets retest_exercise_id"
      - "RECORD_RETEST_RESULT with FAILED runs cascade B hops 1-5 (failure count, escalation, group FROZEN, exercise cancellation, site capacity release)"
      - "CLOSE and WITHDRAW recompute RecoveryGroup.open_finding_count and re-derive posture"

  # ---------- Evidence packages ----------
  - method: POST
    path: "/evidence-packages"
    description: "start an audit evidence package for an exercise"
    roles: [AuditLiaison]
    code: 201
    input: [exercise_id, prepared_by_id]
    output: EvidencePackage
    side_effects: ["state starts DRAFT with manifest_line_count 0 and return_reason NONE"]
  - method: GET
    path: "/evidence-packages/{id}"
    description: "read one evidence package"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: []
    output: EvidencePackage
    side_effects: ["none"]
  - method: GET
    path: "/evidence-packages"
    description: "paginated evidence-package list filtered by exercise, preparer, signer or state"
    roles: [ResilienceCoordinator, BusinessOwner, ITOperator, RiskApprover, AuditLiaison, PlatformAdmin]
    code: 200
    input: ["exercise_id?", "prepared_by_id?", "signed_off_by_id?", "state?", "limit?", "offset?"]
    output: EvidencePackage[]
    side_effects: ["none"]
  - method: POST
    path: "/evidence-packages/{id}/transitions"
    description: "drive the audit submission lifecycle (SUBMIT, RETURN, SIGN_OFF, SEAL)"
    roles: [AuditLiaison, RiskApprover]
    code: 201
    input: [action, "note?"]
    output: EvidencePackage
    side_effects:
      - "SUBMIT requires the exercise CLOSED and computes manifest_line_count"
      - "RETURN sets return_reason INCOMPLETE_MANIFEST; SIGN_OFF (RiskApprover, not the preparer) sets signed_off_by_id; SEAL stamps sealed_at and freezes the row"

  # ---------- Test-driving surface ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every decay, validity and window rule is evaluated against this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["no entity is mutated; subsequent computed timestamps and age calculations read the new value"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the endpoint"
  - id: ERR_ROLE_IDENTITY_MISMATCH
    http: 403
    condition: "X-User-ID is not an ACTIVE Stakeholder holding the org_role mapped from X-User-Role"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, non-member enum value, out-of-range integer, malformed datetime, or pagination limit outside 1..100"
  - id: ERR_STAKEHOLDER_NOT_FOUND
    http: 404
    condition: "a referenced stakeholder id does not exist"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "a referenced site id does not exist"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "a referenced application id does not exist"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "a referenced asset id does not exist"
  - id: ERR_DEPENDENCY_EDGE_NOT_FOUND
    http: 404
    condition: "a referenced dependency edge id does not exist"
  - id: ERR_RECOVERY_GROUP_NOT_FOUND
    http: 404
    condition: "a referenced recovery group id does not exist"
  - id: ERR_RUNBOOK_NOT_FOUND
    http: 404
    condition: "a referenced runbook id does not exist"
  - id: ERR_RUNBOOK_STEP_NOT_FOUND
    http: 404
    condition: "a referenced runbook step id does not exist"
  - id: ERR_EXERCISE_NOT_FOUND
    http: 404
    condition: "a referenced exercise id does not exist"
  - id: ERR_SCOPE_ITEM_NOT_FOUND
    http: 404
    condition: "a referenced exercise scope item id does not exist"
  - id: ERR_STEP_EXECUTION_NOT_FOUND
    http: 404
    condition: "a referenced step execution id does not exist"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "a referenced finding id does not exist"
  - id: ERR_EVIDENCE_PACKAGE_NOT_FOUND
    http: 404
    condition: "a referenced evidence package id does not exist"
  - id: ERR_STALE_RECOVERY_GROUP_VERSION
    http: 412
    condition: "expected_recovery_group_version does not equal RecoveryGroup.version on POST /runbooks"
  - id: ERR_STALE_EXERCISE_VERSION
    http: 412
    condition: "expected_exercise_version does not equal Exercise.version on POST /exercises/{id}/scope-items"
  - id: ERR_INVALID_EXERCISE_STATE
    http: 409
    condition: "the exercise's execution_state is not a declared from-state for the requested action"
  - id: ERR_INVALID_DATA_STATE
    http: 409
    condition: "the exercise's data_state is not a declared from-state for the requested data action, or execution_state is not FAILOVER_COMPLETE"
  - id: ERR_INVALID_FAILBACK_STATE
    http: 409
    condition: "the exercise's failback_state is not a declared from-state for the requested failback action, or execution_state is not FAILOVER_COMPLETE"
  - id: ERR_INVALID_RUNBOOK_STATE
    http: 409
    condition: "the runbook's status is not a declared from-state for the action, or VALIDATE was attempted with a step that is not VALIDATED, or SUBMIT_FOR_REVIEW was attempted on a runbook with no steps"
  - id: ERR_INVALID_STEP_STATE
    http: 409
    condition: "the owning runbook is SUPERSEDED when adding or validating a step"
  - id: ERR_INVALID_APPLICATION_TIER_STATE
    http: 409
    condition: "the application's tier_agreement_status is not a declared from-state for the requested tier action"
  - id: ERR_INVALID_FINDING_STATE
    http: 409
    condition: "the finding's state is not a declared from-state for the requested action"
  - id: ERR_INVALID_EVIDENCE_STATE
    http: 409
    condition: "the evidence package's state is not a declared from-state for the requested action"
  - id: ERR_EVIDENCE_SEALED
    http: 409
    condition: "a transition was attempted on a SEALED evidence package"
  - id: ERR_SOD_TIER_PROPOSER
    http: 422
    condition: "the acting user proposed the tier they are now agreeing"
  - id: ERR_SOD_IMPACT_APPROVER
    http: 422
    condition: "the acting user is the exercise coordinator deciding their own exercise's production impact"
  - id: ERR_SOD_STEP_OWNER
    http: 422
    condition: "the acting user owns the runbook step whose execution they are recording"
  - id: ERR_SOD_EVIDENCE_SIGNER
    http: 422
    condition: "the acting user prepared the evidence package they are signing off"
  - id: ERR_INSUFFICIENT_APPROVAL_AUTHORITY
    http: 403
    condition: "the approver's approval_authority_level is below the exercise's required_approval_level"
  - id: ERR_RUNBOOK_STALE
    http: 422
    condition: "the group has no VALIDATED current runbook, or its readiness_score is below 80.00 at the current logical clock"
  - id: ERR_GROUP_NOT_READY
    http: 422
    condition: "an in-scope recovery group is not in posture READY at impact submission"
  - id: ERR_GROUP_FROZEN
    http: 422
    condition: "the recovery group being scoped is in posture FROZEN"
  - id: ERR_STEP_COVERS_UNAGREED_APPLICATION
    http: 422
    condition: "a step covering an application whose tier_agreement_status is not AGREED was validated"
  - id: ERR_GROUP_SITE_MISMATCH
    http: 422
    condition: "the group's recovery_site_id differs from the exercise's recovery_site_id"
  - id: ERR_SELF_DEPENDENCY
    http: 422
    condition: "from_node_id equals to_node_id on a dependency edge"
  - id: ERR_DEPENDENCY_CYCLE
    http: 422
    condition: "the new HARD edge would close a directed cycle among HARD edges"
  - id: ERR_DUPLICATE_DEPENDENCY_EDGE
    http: 409
    condition: "an edge with the same from_node_id, to_node_id and edge_kind already exists"
  - id: ERR_DUPLICATE_SCOPE_ITEM
    http: 409
    condition: "the recovery group is already in scope for this exercise"
  - id: ERR_STEP_NOT_IN_SCOPE
    http: 422
    condition: "the cited runbook step does not belong to any runbook_id_snapshot of this exercise's scope items"
  - id: ERR_RETEST_SCOPE_MISMATCH
    http: 422
    condition: "the nominated retest exercise does not scope the finding's recovery group"
  - id: ERR_TIER_RTO_EXCEEDS_CAP
    http: 422
    condition: "proposed_rto_minutes exceeds the cap for the proposed tier"
  - id: ERR_TIER_RPO_EXCEEDS_CAP
    http: 422
    condition: "proposed_rpo_minutes exceeds the cap for the proposed tier"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "site_code, app_code, asset_code, group_code or stakeholder email already exists"
  - id: ERR_DUPLICATE_STEP_NUMBER
    http: 409
    condition: "step_number already exists in the runbook"
  - id: ERR_SITE_WINDOW_CONFLICT
    http: 409
    condition: "the exercise interval intersects another SCHEDULED/IN_EXECUTION exercise's half-open interval on the same site, or starts inside the 240-minute buffer after a FULL_SITE_FAILOVER exercise's planned_end_at"
  - id: ERR_GROUP_CHANGE_FREEZE_CONFLICT
    http: 409
    condition: "the exercise interval intersects an in-scope group's closed change-freeze interval, including a touch at either endpoint"
  - id: ERR_RUNBOOK_VALIDITY_EXPIRED
    http: 422
    condition: "the snapshot runbook was validated more than validity_days ago at the current logical clock"
  - id: ERR_EXERCISE_NOT_CLOSED
    http: 422
    condition: "an evidence package was submitted while the exercise is not CLOSED"
  - id: ERR_SITE_CAPACITY_EXCEEDED
    http: 409
    condition: "reserved_capacity_units + required_capacity_units would exceed usable_capacity_units"
  - id: ERR_NO_RTO_BASELINE
    http: 422
    condition: "no AGREED application is a member of any in-scope recovery group when starting execution"
  - id: ERR_NO_REPLICATION_OBSERVATION
    http: 422
    condition: "an in-scope DATA_STORE asset has no replication observation at or before the current logical clock when completing failover"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "planned_end_at is not after planned_start_at, or change_freeze_end_at is before change_freeze_start_at"
  - id: ERR_OBSERVATION_IN_FUTURE
    http: 422
    condition: "observed_at is after the current logical clock"
  - id: ERR_NOT_APPLICATION_OWNER
    http: 403
    condition: "the acting business owner is not the Application.business_owner_id of the application being decided"

roles:
  - name: ResilienceCoordinator
    description: "owns recovery groups, dependency mapping, runbook revisions and exercise orchestration"
    identity: "entity_backed:Stakeholder"
    exclusive_operations:
      - "create/assign recovery groups and dependency edges"
      - "open runbook revisions and drive runbook transitions"
      - "propose application tiers"
      - "create exercises, add scope items, submit production impact, schedule and drive execution transitions"
      - "drive finding transitions"
    shared_operations:
      - "create applications (with PlatformAdmin)"
      - "create assets (with ITOperator)"
      - "add runbook steps (with ITOperator)"
      - "record step executions (with ITOperator)"
      - "raise findings (with ITOperator and AuditLiaison)"
      - "refresh recovery-group posture (with AuditLiaison)"
      - "all GET reads"
  - name: BusinessOwner
    description: "agrees or rejects the tier, RTO and RPO proposed for the applications they own"
    identity: "entity_backed:Stakeholder"
    exclusive_operations:
      - "agree or request changes on a tier proposal for an application whose business_owner_id is this user (enforced by validations priority 46)"
    shared_operations:
      - "all GET reads"
  - name: ITOperator
    description: "runs the technical work — assets, replication observations, step validation, step timing, data validation and failback"
    identity: "entity_backed:Stakeholder"
    exclusive_operations:
      - "append replication observations"
      - "validate runbook steps"
      - "drive data-transitions and failback-transitions"
    shared_operations:
      - "create assets (with ResilienceCoordinator)"
      - "add runbook steps (with ResilienceCoordinator)"
      - "record step executions (with ResilienceCoordinator)"
      - "raise findings (with ResilienceCoordinator and AuditLiaison)"
      - "all GET reads"
  - name: RiskApprover
    description: "approves production impact at or above the required authority level and signs off evidence"
    identity: "entity_backed:Stakeholder"
    exclusive_operations:
      - "approve or reject an exercise's production impact"
      - "SIGN_OFF on an evidence package"
    shared_operations:
      - "evidence-package transitions endpoint, shared with AuditLiaison (which action each may take is fixed by the transition's actor)"
      - "all GET reads"
  - name: AuditLiaison
    description: "assembles, submits, returns and seals the audit and regulator evidence packages"
    identity: "entity_backed:Stakeholder"
    exclusive_operations:
      - "create evidence packages"
      - "SUBMIT, RETURN and SEAL an evidence package"
    shared_operations:
      - "raise findings (with ResilienceCoordinator and ITOperator)"
      - "refresh recovery-group posture (with ResilienceCoordinator)"
      - "all GET reads"
  - name: PlatformAdmin
    description: "operational administrator: registers people and sites and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "create and patch stakeholders"
      - "create sites"
      - "set the logical clock"
    shared_operations:
      - "create applications and propose tiers (with ResilienceCoordinator)"
      - "all GET reads"
