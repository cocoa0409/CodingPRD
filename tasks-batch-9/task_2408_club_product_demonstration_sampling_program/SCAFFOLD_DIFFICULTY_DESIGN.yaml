      - name: zero_cases_delivered_yields_variance_pct_zero_not_a_division_by_zero
        grounds:
          - calculations.sample_reconciliation_variance
          - entities.SampleReconciliation.fields.variance_pct
          - state_machines.SampleShipment.transitions.IN_TRANSIT_to_REJECTED
          - state_machines.SampleReconciliation.transitions.OPEN_to_BALANCED
        distinguishing_aspect: |
          The only shipment on the event is received at cases_received 0, so it
          lands in REJECTED and contributes 0 to cases_delivered — making
          units_delivered exactly 0, the denominator of variance_pct. The
          contract's explicit guard must return variance_pct 0.00 rather than
          raising, returning null, or emitting Infinity/NaN, and because
          variance_units is also 0 the row forks to BALANCED on the first
          branch of the recon_status test (variance_units == 0) without ever
          consulting VARIANCE_TOLERANCE_PCT. A follow-up write-off attempt on
          that BALANCED row must be refused, since WRITTEN_OFF is reachable
          only from VARIANCE_FLAGGED. Choosing a NON_FOOD_DEMO event keeps
          validations[priority=45] — which would otherwise demand at least one
          received case before CLOSE_OUT — out of the picture, so the
          zero-denominator path is actually reachable.
