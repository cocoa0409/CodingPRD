              as: ClubCardSpecialist
              captures: { ca_id: $.data.id }
            - call: "POST /stores/club-card-applications/${ca_id}/underwrite"
              payload: { underwriter_user_id: "uw_2201" }
              as: CreditUnderwriter
          trigger:
            - call: "POST /stores/club-card-applications/${ca_id}/decide"
              payload: { decision_user_id: "uw_2201", decision: "APPROVED", decision_reason: "thin file but strong trade", credit_limit_cents: 300000 }
              as: CreditOfficer
              captures: { err: $.data.error_id }
            - call: "POST /stores/club-card-applications/${ca_id}/decide"
              payload: { decision_user_id: "off_7702", decision: "APPROVED", decision_reason: "independent review", credit_limit_cents: 300000 }
              as: CreditOfficer
