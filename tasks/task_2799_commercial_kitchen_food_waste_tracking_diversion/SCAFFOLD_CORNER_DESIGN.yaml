# =============================================================================
# 1.9 SCAFFOLD CORNER DESIGN — Commercial Kitchen Food Waste Tracking & Diversion
# -----------------------------------------------------------------------------
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Section names and claim_type values
# are taken from references/claim-extraction-guide.md; nothing is invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub instead of a test_recipe.
#
# Shared fixture vocabulary used by the recipes below (each recipe is still
# self-contained and drives the system from an empty DB):
#   Site        HK-01 "Harbor Kitchen", region NE, target intensity default 10.0
#   Station     PREP-1 (PREP), DISH-1 (DISH_RETURN), calibration 2026-12-31
#   FoodType    "Chicken Breast" PROTEIN 640 c/kg, donation ok, feed no, compost ok
#   Shift       2026-08-01 AM, 250 meals served
#   Clock       advanced to 2026-08-01T12:00:00Z so a 10:00:00Z capture is in the past
#   Identities  pa-1 (PlatformAdmin), sl-1 / sl-2 (ShiftLead), ks-1 (KitchenStaff),
#               csl-1 / csl-2 (CorporateSustainabilityLead); SiteSustainabilityManager
#               always acts as ${site_id} and HaulerOperator as ${hauler_id}
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION: entities  (claim-extraction-guide Table 1)
  # ===========================================================================
  - section: entities
    instances:
      - name: site_creation_persists_inputs_and_zeroed_aggregates
        claim_type: creation
        grounds: ["entities.Site", "endpoints[POST /sites]"]
        distinguishing_aspect: "A freshly created Site returns every declared input field verbatim and all four derived aggregates at their zero/null start values with version 1."
        test_recipe:
          setup: ["Empty database. No clock movement is needed because no timestamped row is written."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE", target_intensity_kg_per_1k_meals: 11.5 }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "HTTP 201 with response_type == \"object\""
            - "Site.name == \"Harbor Kitchen\" and Site.site_code == \"HK-01\" and Site.region_code == \"NE\""
            - "Site.target_intensity_kg_per_1k_meals == 11.5"
            - "Site.total_captured_weight_grams == 0 and Site.valued_waste_cost_cents == 0 and Site.diverted_weight_grams_settled == 0"
            - "Site.diversion_rate_pct == null and Site.open_alert_count == 0 and Site.coaching_posture == \"MONITORING\""
            - "Site.version == 1 and Site.id, Site.created_at, Site.updated_at are all present"

      - name: site_defaults_target_intensity_to_ten_when_omitted
        claim_type: defaults
        grounds: ["entities.Site.target_intensity_kg_per_1k_meals", "endpoints[POST /sites]"]
        distinguishing_aspect: "Omitting the only optional Site input yields exactly 10.0, the declared default, not null and not 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Riverside Kitchen", site_code: "RK-02", region_code: "MW" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "Site.target_intensity_kg_per_1k_meals == 10.0"

      - name: site_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds: ["endpoints[GET /sites/{id}]", "entities.Site"]
        distinguishing_aspect: "A GET by id returns the same field values the creating POST returned, read by a role that never wrote the row."
        test_recipe:
          setup: ["One Site HK-01 exists with an explicit target intensity of 11.5."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE", target_intensity_kg_per_1k_meals: 11.5 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "GET /sites/${site_id}"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
          assert:
            - "HTTP 200 and Site.id == ${site_id}"
            - "Site.site_code == \"HK-01\" and Site.target_intensity_kg_per_1k_meals == 11.5 and Site.coaching_posture == \"MONITORING\""

      - name: sites_listing_reports_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints[GET /sites]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three Sites and limit 2 the first page carries has_more true and total_count 3; the second page carries one row and has_more false."
        test_recipe:
          setup: ["Three Sites exist, all in region NE."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /sites"
              payload: { name: "Riverside Kitchen", site_code: "RK-02", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /sites"
              payload: { name: "Uptown Kitchen", site_code: "UK-03", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "GET /sites?limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "GET /sites?limit=2&offset=2"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "first response: response_type == \"array\", data length == 2, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "second response: data length == 1, offset == 2, total_count == 3, has_more == false"

      - name: site_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=40]", "errors[ERR_SITE_NOT_FOUND]"]
        distinguishing_aspect: "An unknown Site id on the path yields ERR_SITE_NOT_FOUND (404), not an empty 200 body."
        test_recipe:
          setup: ["Empty database — no Site has ever been created."]
          setup_api_calls: []
          trigger:
            - call: "GET /sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_SITE_NOT_FOUND\""

      - name: site_creation_missing_required_site_code_is_rejected
        claim_type: required_fields
        grounds: ["validations[priority=30]", "errors[ERR_INVALID_REQUEST]", "entities.Site.site_code"]
        distinguishing_aspect: "site_code has source input and no default, so omitting it fails schema validation before any uniqueness check runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "no Site row is created: a following GET /sites returns total_count == 0"

      - name: site_code_outside_the_declared_length_range_is_rejected
        claim_type: type_constraints
        grounds: ["entities.Site.site_code", "entities.Site.target_intensity_kg_per_1k_meals", "validations[priority=30]"]
        distinguishing_aspect: "The declared 2-12 character bound on site_code and the > 0 bound on target_intensity_kg_per_1k_meals are both enforced at priority 30."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Tiny", site_code: "H", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /sites"
              payload: { name: "Long", site_code: "HARBOR-KITCHEN-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /sites"
              payload: { name: "Zero", site_code: "ZK-04", region_code: "NE", target_intensity_kg_per_1k_meals: 0 }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "all three responses are HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""

      - name: tracking_station_defaults_tare_lock_and_active_status
        claim_type: defaults
        grounds: ["entities.TrackingStation.tare_grams", "entities.TrackingStation.capture_lock_seconds", "entities.TrackingStation.status"]
        distinguishing_aspect: "Omitting all three optional station inputs yields tare_grams 0, capture_lock_seconds 30 and status ACTIVE."
        test_recipe:
          setup: ["Site HK-01 exists."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "TrackingStation.tare_grams == 0 and TrackingStation.capture_lock_seconds == 30 and TrackingStation.status == \"ACTIVE\""
            - "TrackingStation.site_id == ${site_id} and TrackingStation.station_code == \"PREP-1\""

      - name: tracking_station_for_an_unknown_site_returns_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=45]", "errors[ERR_SITE_NOT_FOUND]", "complexity_profile.entity_topology"]
        distinguishing_aspect: "In the flat topology the parent link is a body FK, so an unresolvable site_id fails at priority 45 with the referenced entity's own 404 code."
        test_recipe:
          setup: ["Empty database — no Site exists."]
          setup_api_calls: []
          trigger:
            - call: "POST /tracking-stations"
              payload: { site_id: "00000000-0000-0000-0000-000000000000", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "HTTP 404 with data.error_id == \"ERR_SITE_NOT_FOUND\""

      - name: food_type_defaults_donation_shelf_life_hours_to_zero
        claim_type: defaults
        grounds: ["entities.FoodType.donation_shelf_life_hours"]
        distinguishing_aspect: "Omitting donation_shelf_life_hours yields 0, which makes every later DONATION routing of that food type expire at the capture instant itself."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /food-types"
              payload: { name: "Day-Old Bread", category: "BAKERY", default_cost_per_kg_cents: 210, donation_eligible: true, animal_feed_eligible: true, compostable: true }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "FoodType.donation_shelf_life_hours == 0 and FoodType.default_cost_per_kg_cents == 210"

      - name: food_type_category_enum_rejects_an_undeclared_member
        claim_type: type_constraints
        grounds: ["entities.FoodType.category", "validations[priority=30]"]
        distinguishing_aspect: "category accepts only PRODUCE|PROTEIN|PREPARED|BAKERY|DAIRY; the undeclared member FROZEN is a 400, never a stored value."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /food-types"
              payload: { name: "Frozen Peas", category: "FROZEN", default_cost_per_kg_cents: 180, donation_eligible: false, animal_feed_eligible: true, compostable: true }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""

      - name: recipe_creation_computes_cost_fields_and_leaves_published_cost_null
        claim_type: computed_fields
        grounds: ["entities.Recipe.total_ingredient_cost_cents", "entities.Recipe.usable_yield_kg", "entities.Recipe.cost_per_kg_cents", "entities.Recipe.published_cost_per_kg_cents"]
        distinguishing_aspect: "A single-ingredient recipe with zero trim loss (2.0 kg at 500 c/kg) computes 1000 / 2.000 / 500 at creation while published_cost_per_kg_cents stays null in DRAFT."
        test_recipe:
          setup: ["Empty database. One ingredient line, chosen so that no rounding step can hide an ordering error."]
          setup_api_calls: []
          trigger:
            - call: "POST /recipes"
              payload: { recipe_code: "STK-PLN", name: "Plain Stock", ingredients: [{ ingredient_name: "Stock Base", quantity_kg: 2.0, unit_cost_cents_per_kg: 500, trim_loss_pct: 0.00 }] }
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "Recipe.total_ingredient_cost_cents == 1000"
            - "Recipe.usable_yield_kg == 2.000"
            - "Recipe.cost_per_kg_cents == 500"
            - "Recipe.status == \"DRAFT\" and Recipe.published_cost_per_kg_cents == null and Recipe.published_at == null"

      - name: waste_entry_system_and_computed_fields_are_server_owned_input_ignored
        claim_type: system_fields
        grounds: ["entities.WasteEntry.status", "entities.WasteEntry.site_id", "entities.WasteEntry.stream", "entities.WasteEntry.captured_by_user_id", "calculations.entry_stream_segmentation"]
        distinguishing_aspect: "Client-supplied status, site_id, stream and captured_by_user_id are discarded: the row comes back RECORDED, scoped to the station's site, PRE_CONSUMER, and stamped with the caller's X-User-ID."
        test_recipe:
          setup: ["Site HK-01 with PREP station PREP-1, food type Chicken Breast, OPEN shift 2026-08-01 AM at 250 meals; clock at 2026-08-01T12:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
          trigger:
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "OVERPRODUCTION", captured_at: "2026-08-01T10:00:00Z", status: "VOIDED", stream: "POST_CONSUMER", captured_by_user_id: "someone-else" }
              as: KitchenStaff
              as_user_id: "ks-1"
          assert:
            - "WasteEntry.status == \"RECORDED\" (the supplied VOIDED is ignored)"
            - "WasteEntry.stream == \"PRE_CONSUMER\" (PREP station + OVERPRODUCTION; the supplied POST_CONSUMER is ignored)"
            - "WasteEntry.captured_by_user_id == \"ks-1\" (the supplied value is ignored)"
            - "WasteEntry.site_id == ${site_id} and WasteEntry.provisional_cost_cents == 640 and WasteEntry.routed_weight_grams == 0 and WasteEntry.unrouted_weight_grams == 1000"

      - name: consignment_line_carries_no_version_and_has_no_update_endpoint
        claim_type: immutability
        grounds: ["entities.ConsignmentLine.common_fields", "endpoints[POST /consignment-lines]", "endpoints[DELETE /consignment-lines/{id}]"]
        distinguishing_aspect: "ConsignmentLine is the scaffold's only common_fields:false entity: its response carries id and created_at but no version and no updated_at, and §1.5 exposes create/read/delete only."
        test_recipe:
          setup: ["Site HK-01 with one PREP station, one food type, an OPEN AM shift and one 1000 g capture; a PENDING hauler and a DRAFT COMPOST consignment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "OVERPRODUCTION", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { entry_id: "$.data.id" }
            - call: "POST /haulers"
              payload: { name: "Green Haul", channels: ["COMPOST", "DONATION"], rate_cents_per_tonne: 52000, stop_fee_cents: 1800, capacity_kg_per_pickup: 500 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { hauler_id: "$.data.id" }
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "${hauler_id}", channel: "COMPOST", pickup_window_start: "2026-08-02T09:00:00Z", pickup_window_end: "2026-08-02T11:00:00Z" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { consignment_id: "$.data.id" }
          trigger:
            - call: "POST /consignment-lines"
              payload: { consignment_id: "${consignment_id}", waste_entry_id: "${entry_id}", allocated_weight_grams: 400 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          assert:
            - "HTTP 201; ConsignmentLine.id and ConsignmentLine.created_at are present"
            - "the ConsignmentLine response body contains no version field and no updated_at field"
            - "ConsignmentLine.allocated_weight_grams == 400 and ConsignmentLine.created_by_user_id == ${site_id}"

      - name: rollup_site_ids_must_all_resolve_or_the_request_is_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=45]", "entities.CorporateRollup.site_ids", "errors[ERR_SITE_NOT_FOUND]"]
        distinguishing_aspect: "Every member of the site_ids array is FK-checked, so one unknown id among otherwise valid ones still yields ERR_SITE_NOT_FOUND."
        test_recipe:
          setup: ["One Site HK-01 exists."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /corporate-rollups"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", site_ids: ["${site_id}", "00000000-0000-0000-0000-000000000000"] }
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
          assert:
            - "HTTP 404 with data.error_id == \"ERR_SITE_NOT_FOUND\""
            - "no CorporateRollup row is created: a following GET /corporate-rollups returns total_count == 0"

      - name: baseline_period_end_date_before_start_date_is_rejected
        claim_type: type_constraints
        grounds: ["entities.BaselinePeriod.end_date", "validations[priority=30]"]
        distinguishing_aspect: "The declared end_date >= start_date range invariant is a priority-30 schema failure, not a business overlap error."
        test_recipe:
          setup: ["Site HK-01 exists; the SiteSustainabilityManager identity is the site id."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /baseline-periods"
              payload: { site_id: "${site_id}", start_date: "2026-08-10", end_date: "2026-08-01" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""

      - name: waste_entry_weight_above_two_hundred_kilograms_is_rejected
        claim_type: type_constraints
        grounds: ["entities.WasteEntry.weight_grams", "validations[priority=30]"]
        distinguishing_aspect: "weight_grams accepts exactly 200000 g but rejects 200001 g, and the accepted boundary value is valued at 128000 cents (200 kg at 640 c/kg)."
        test_recipe:
          setup: ["Site HK-01 with PREP-1, food type Chicken Breast at 640 c/kg, OPEN AM shift at 250 meals; clock at 2026-08-01T12:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
          trigger:
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 200001, loss_reason: "SPOILAGE", captured_at: "2026-08-01T09:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 200000, loss_reason: "SPOILAGE", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
          assert:
            - "first response: HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "second response: HTTP 201 with WasteEntry.weight_grams == 200000 and WasteEntry.provisional_cost_cents == 128000"

