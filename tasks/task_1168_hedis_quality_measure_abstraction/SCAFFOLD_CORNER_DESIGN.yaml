  # ===========================================================================
  - section: endpoints
    instances:
      - name: population_entries_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints.GET /hedis/measure-runs/{id}/population-entries"
        distinguishing_aspect: "List endpoints honor limit/offset against the envelope's pagination fields: 3 entries with limit 2 page as [2 rows + has_more true] then [1 row]."
        test_recipe:
          setup: ["ADMIN fixture: members M1/M2/M3; run POPULATED (3 entries minted in member_ref ASC order)"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M2", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M3", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m3: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m3}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
          trigger:
            - { call: "GET /hedis/measure-runs/${run_id}/population-entries", payload: { limit: 2 }, as: QualityAnalyst, captures: { p0: "$.data[0].member_ref", p1: "$.data[1].member_ref", total: "$.meta.total_count", more: "$.meta.has_more" } }
            - { call: "GET /hedis/measure-runs/${run_id}/population-entries", payload: { limit: 2, offset: 2 }, as: QualityAnalyst, captures: { q0: "$.data[0].member_ref", qmore: "$.meta.has_more" } }
          assert:
            - "p0 == 'M1' and p1 == 'M2' — first page of 2 in member_ref ASC order"
            - "total == 3 and more == true"
            - "q0 == 'M3' and qmore == false — offset 2 returns the tail row"

      - name: population_entry_exclude_action
        claim_type: conditional_action
        grounds:
          - "endpoints.POST /hedis/population-entries/{entryId}/exclude"
          - "entities.MeasureRun.fields.exclusion_count"
        distinguishing_aspect: "Pre-draw exclusion on an ADMIN run flips is_excluded, stores the reason, and decrements denominator_count while incrementing exclusion_count."
        test_recipe:
          setup: ["ADMIN fixture: members M1/M2; run POPULATED (denominator 2)"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M2", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "GET /hedis/measure-runs/${run_id}/population-entries", as: QualityAnalyst, captures: { e1: "$.data[0].id", e1m: "$.data[0].member_ref" } }
          trigger:
            - { call: "POST /hedis/population-entries/${e1}/exclude", payload: { reason: "DISENROLLED" }, as: QualityAnalyst, captures: { ex: $.data.is_excluded, rs: $.data.exclusion_reason } }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { den: $.data.denominator_count, exc: $.data.exclusion_count } }
          assert:
            - "e1m == 'M1' and ex == true and rs == 'DISENROLLED'"
            - "den == 1 and exc == 1"

  # ===========================================================================
  - section: rbac
    instances:
      - name: abstractor_cannot_draw_sample
        claim_type: role_exclusive_denial
        grounds:
          - "roles.Abstractor"
          - "validations[priority=3]"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "POST /hedis/samples is exclusive to QualityAnalyst; the role check (priority 3) fires before existence (priority 4), so even a bogus run_id yields 403."
        test_recipe:
          setup: ["empty DB (role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hedis/samples", payload: { run_id: "00000000-0000-0000-0000-000000000000" }, as: Abstractor, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INSUFFICIENT_PERMISSIONS'"

      - name: overreader_cannot_create_abstraction
        claim_type: role_exclusive_denial
        grounds:
          - "roles.OverReader"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "POST /hedis/abstractions is exclusive to Abstractor; OverReader is denied."
        test_recipe:
          setup: ["empty DB (role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hedis/abstractions", payload: { chase_id: "00000000-0000-0000-0000-000000000000", result: "HIT" }, as: OverReader, as_user_id: "orr-1", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INSUFFICIENT_PERMISSIONS'"

      - name: providerrelations_cannot_certify_run
        claim_type: role_exclusive_denial
        grounds:
          - "roles.ProviderRelations"
          - "roles.QualityDirector"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "certify is exclusive to QualityDirector; ProviderRelations is denied before any state evaluation."
        test_recipe:
          setup: ["empty DB (role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hedis/measure-runs/00000000-0000-0000-0000-000000000000/certify", payload: { decision: "CERTIFIED" }, as: ProviderRelations, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INSUFFICIENT_PERMISSIONS'"

      - name: qualitydirector_cannot_screen_batch
        claim_type: role_exclusive_denial
        grounds:
          - "roles.QualityDirector"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Supplemental screening is exclusive to QualityAnalyst; the certification role has no data-operations rights."
        test_recipe:
          setup: ["empty DB (role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hedis/supplemental-batches/00000000-0000-0000-0000-000000000000/screen", as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INSUFFICIENT_PERMISSIONS'"

      - name: abstractor_cannot_submit_others_abstraction
        claim_type: role_exclusive_denial
        grounds:
          - "roles.Abstractor"
          - "state_machines.Abstraction.DRAFT_to_SUBMITTED"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Beyond role membership, abstraction mutations enforce ownership: X-User-ID must equal abstractor_user_id, so abs-2 cannot submit abs-1's DRAFT."
        test_recipe:
          setup: ["HYBRID floor-1 fixture: abstraction a1 (HIT) in DRAFT owned by abs-1"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
