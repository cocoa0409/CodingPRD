      - name: compensating_speaker_decline_rewinds_option_proposal_and_inquiry_states
        grounds:
          - state_machines.Engagement.OFFERED_to_DECLINED_BY_SPEAKER
          - state_machines.ProposalOption.SELECTED_to_REJECTED
          - state_machines.Proposal.ACCEPTED_to_PRESENTED
          - state_machines.Inquiry.WON_to_PROPOSED
        distinguishing_aspect: |
          A backwards compensation across four entities that must restore the pre-selection
          shape exactly: the declined option becomes REJECTED, but the siblings that selection
          had rejected must return to OFFERED, and the proposal and inquiry must rewind out of
          their terminal-looking ACCEPTED/WON states. The proof of no drift is that a second,
          different selection then runs normally on the same proposal.
