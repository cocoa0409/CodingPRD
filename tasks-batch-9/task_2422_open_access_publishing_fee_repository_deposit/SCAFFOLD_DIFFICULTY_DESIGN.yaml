  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_outranks_author_cap_on_fund_decision
        grounds:
          - validations[priority=8]
          - validations[priority=33]
          - errors[ERR_REQUEST_NOT_REVIEWABLE]
          - errors[ERR_AUTHOR_CAP_EXHAUSTED]
          - state_machines.FundRequest.INFO_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          With the request in INFO_REQUESTED and the author's annual cap at 0, both priority 8
          (state, 409 ERR_REQUEST_NOT_REVIEWABLE) and priority 33 (business_fiscal, 422
          ERR_AUTHOR_CAP_EXHAUSTED) are violated by the same APPROVE call; the 409 is returned
          first, and only after a resubmission clears the state violation does the identical
          call surface the 422 — a state-versus-fiscal category pair.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "author ELIGIBLE_FACULTY with annual_cap_cents explicitly 0"
            - "publisher with a FULLY_OA journal at list_apc_cents 300000; GOLD_OA funder with apc_allowable true; ACTIVE grant"
            - "APC fund FY2027, budget 1000000, priority 1, per-article cap 300000, open for ELIGIBLE_FACULTY"
            - "article accepted 2026-08-05 with a FUND_APC determination (eligible_request_cents 300000)"
            - "fund request for 300000 driven to INFO_REQUESTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { p9_id: $.data.id }
            - call: "POST /journals"
