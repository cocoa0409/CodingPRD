# =============================================================================
# task_2215 — Marketplace Fulfillment Inventory & Storage Cost Management
# §1.9 Scaffold Corner Design (breadth probe)
#
# Taxonomy: references/claim-extraction-guide.md — nine sections, per-section
# claim_type rows only. Corners already asserted by §1.8 appear as
# excluded_because stubs citing the covering instance by name.
# Logical clock default 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: seller_account_creation_returns_declared_defaults
        claim_type: Creation
        grounds:
          - endpoints[POST /fulfillment/sellers]
          - entities.SellerAccount
        distinguishing_aspect: "POST /fulfillment/sellers with all three required inputs returns 201 and every computed ledger seeded at zero with seller_status ACTIVE."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
          trigger:
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id", s_ver: "$.data.version" }
          assert:
            - "response status is 201"
            - "SellerAccount.${s_id}.legal_name == Northwind Goods"
            - "SellerAccount.${s_id}.storage_cubic_feet_entitlement == 1000.0000"
            - "SellerAccount.${s_id}.unit_cost_cap_cents == 200000"
            - "SellerAccount.${s_id}.seller_status == ACTIVE"
            - "SellerAccount.${s_id}.restock_reserved_units == 0"
            - "SellerAccount.${s_id}.open_discrepancy_units == 0"
            - "SellerAccount.${s_id}.suppressed_listing_count == 0"
            - "SellerAccount.${s_id}.storage_utilization_ratio == 0.0000"
            - "SellerAccount.${s_id}.storage_fee_accrued_cents == 0"
            - "SellerAccount.${s_id}.reimbursement_credit_cents == 0"
            - "SellerAccount.${s_id}.mcf_fee_accrued_cents == 0"
            - "${s_ver} == 1"
            - "SellerAccount.${s_id}.created_at == 2026-08-01T00:00:00Z"

      - name: sku_listing_retrieval_returns_stored_and_initial_derived_fields
        claim_type: Retrieval
        grounds:
          - endpoints[GET /fulfillment/sku-listings/{id}]
          - state_machines.SkuListing.initial_state
          - entities.SkuListing
        distinguishing_aspect: "A freshly created SkuListing reads back listing_status ACTIVE with inventory_health OUT_OF_STOCK and lot_ever_created false — the two parallel dimensions start on different values."
        test_recipe:
          setup:
            - "One seller and one SkuListing SKU-ALPHA with unit_cubic_feet 1.0000; no InventoryLot rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-ALPHA", unit_cubic_feet: 1.0000, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { l1_id: "$.data.id" }
          trigger:
            - call: "GET /fulfillment/sku-listings/${l1_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { got_sku: "$.data.sku", got_health: "$.data.inventory_health" }
          assert:
            - "${got_sku} == SKU-ALPHA"
            - "SkuListing.${l1_id}.unit_cubic_feet == 1.0000"
            - "SkuListing.${l1_id}.unit_cost_cents == 1250"
            - "SkuListing.${l1_id}.listing_status == ACTIVE"
            - "SkuListing.${l1_id}.suppression_reason == NONE"
            - "${got_health} == OUT_OF_STOCK"
            - "SkuListing.${l1_id}.fulfillable_units == 0"
            - "SkuListing.${l1_id}.unfulfillable_units == 0"
            - "SkuListing.${l1_id}.missing_units == 0"
            - "SkuListing.${l1_id}.aged_over_365_units == 0"
            - "SkuListing.${l1_id}.lot_ever_created == false"
            - "SkuListing.${l1_id}.recommended_replenishment_units == 0"

      - name: inbound_shipment_plan_listing_paginates_and_filters_by_status
        claim_type: Listing
        grounds:
          - endpoints[GET /fulfillment/inbound-shipment-plans]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three plans of one seller and one CONFIRMED, the list endpoint returns total_count 3 / has_more true at limit 2, total_count 3 / has_more false at offset 2, and total_count 1 when status=CONFIRMED is supplied."
        test_recipe:
          setup:
            - "One seller with an ACTIVE quota, one FC, one listing."
            - "Three plans created in order P1, P2, P3; P1 carries a 100-unit line item and is CONFIRMED; P2 and P3 stay DRAFT with no line items."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/fulfillment-centers"
              payload: { fc_code: "FC-A1", region_code: "US-WEST", prep_profile: "LABEL_ONLY", case_pack_min_units: 1, receiving_capacity_units_per_window: 100000, monthly_storage_rate_cents_per_cubic_foot: 87, ltsf_rate_cents_per_cubic_foot: 620 }
              as: MarketplaceAdmin
              captures: { fc_id: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-ALPHA", unit_cubic_feet: 1.0000, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { l1_id: "$.data.id" }
            - call: "POST /fulfillment/sellers/${s_id}/restock-quotas"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", base_capacity_units: 1000, sell_through_rate: 2.5000, excess_units_ratio: 0.0000, stranded_ratio: 0.0000, in_stock_rate: 1.0000 }
              as: MarketplaceAdmin
              captures: { q_id: "$.data.id" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv1: "$.data.version" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-10T00:00:00Z", appointment_window_end: "2026-08-11T00:00:00Z", expected_seller_account_version: "${sv1}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/line-items"
              payload: { sku_listing_id: "${l1_id}", units: 100, case_pack_units: 10, polybagged: true, label_type: "FNSKU" }
              as: SellerOperator
              as_user_id: "${s_id}"
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/confirm"
              payload: {}
              as: SellerOperator
              as_user_id: "${s_id}"
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv2: "$.data.version" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-12T00:00:00Z", appointment_window_end: "2026-08-13T00:00:00Z", expected_seller_account_version: "${sv2}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { p2_id: "$.data.id" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv3: "$.data.version" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-14T00:00:00Z", appointment_window_end: "2026-08-15T00:00:00Z", expected_seller_account_version: "${sv3}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { p3_id: "$.data.id" }
          trigger:
            - call: "GET /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", limit: 2, offset: 0 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", limit: 2, offset: 2 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { second_page_head: "$.data[0].id" }
            - call: "GET /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", status: "CONFIRMED" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { confirmed_head: "$.data[0].id" }
          assert:
            - "first call: response_type == array, meta.api_request_id and meta.api_request_timestamp are present"
            - "first call: total_count == 3, has_more == true, exactly 2 elements returned"
            - "${first_page_head} == ${p1_id}"
            - "second call: total_count == 3, has_more == false, exactly 1 element returned"
            - "${second_page_head} == ${p3_id}"
            - "third call: total_count == 1, has_more == false"
            - "${confirmed_head} == ${p1_id}"
            - "InboundShipmentPlan.${p2_id}.status == DRAFT"
            - "InboundShipmentPlan.${p3_id}.status == DRAFT"

      - name: path_ids_that_do_not_resolve_return_family_specific_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_SELLER_NOT_FOUND]
          - errors[ERR_FC_NOT_FOUND]
          - errors[ERR_LISTING_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_REMOVAL_ORDER_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: "Each of the seven resource families returns its own 404 error_id for an unresolvable {id} path parameter — never a shared generic not-found code."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no entity ids exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
          trigger:
            - call: "GET /fulfillment/sellers/11111111-1111-4111-8111-111111111111"
              as: MarketplaceAdmin
              captures: { e_seller: "$.data.error_id" }
            - call: "GET /fulfillment/fulfillment-centers/22222222-2222-4222-8222-222222222222"
              as: MarketplaceAdmin
              captures: { e_fc: "$.data.error_id" }
            - call: "GET /fulfillment/sku-listings/33333333-3333-4333-8333-333333333333"
              as: MarketplaceAdmin
              captures: { e_listing: "$.data.error_id" }
            - call: "GET /fulfillment/inbound-shipment-plans/44444444-4444-4444-8444-444444444444"
              as: MarketplaceAdmin
              captures: { e_plan: "$.data.error_id" }
            - call: "GET /fulfillment/inventory-lots/55555555-5555-4555-8555-555555555555"
              as: MarketplaceAdmin
              captures: { e_lot: "$.data.error_id" }
            - call: "GET /fulfillment/removal-orders/66666666-6666-4666-8666-666666666666"
              as: MarketplaceAdmin
              captures: { e_removal: "$.data.error_id" }
            - call: "GET /fulfillment/reimbursement-claims/77777777-7777-4777-8777-777777777777"
              as: MarketplaceAdmin
              captures: { e_claim: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404 with response_type == error"
            - "${e_seller} == ERR_SELLER_NOT_FOUND"
            - "${e_fc} == ERR_FC_NOT_FOUND"
            - "${e_listing} == ERR_LISTING_NOT_FOUND"
            - "${e_plan} == ERR_PLAN_NOT_FOUND"
            - "${e_lot} == ERR_LOT_NOT_FOUND"
            - "${e_removal} == ERR_REMOVAL_ORDER_NOT_FOUND"
            - "${e_claim} == ERR_CLAIM_NOT_FOUND"

      - name: body_foreign_keys_that_do_not_resolve_are_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_SELLER_NOT_FOUND]
          - errors[ERR_FC_NOT_FOUND]
          - errors[ERR_LISTING_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology: FK fields carried in the request body (seller_account_id, destination_fc_id, sku_listing_id, inventory_lot_id) are resolved at priority 5 and each returns its family's 404, before any state or fiscal rule runs."
        test_recipe:
          setup:
            - "One seller, one FC, one listing and one DRAFT plan exist so that only the FK under test is unresolvable in each call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/fulfillment-centers"
              payload: { fc_code: "FC-A1", region_code: "US-WEST", prep_profile: "LABEL_ONLY", case_pack_min_units: 1, receiving_capacity_units_per_window: 100000, monthly_storage_rate_cents_per_cubic_foot: 87, ltsf_rate_cents_per_cubic_foot: 620 }
              as: MarketplaceAdmin
              captures: { fc_id: "$.data.id" }
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-ALPHA", unit_cubic_feet: 1.0000, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { l1_id: "$.data.id" }
            - call: "POST /fulfillment/sellers/${s_id}/restock-quotas"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", base_capacity_units: 1000, sell_through_rate: 2.5000, excess_units_ratio: 0.0000, stranded_ratio: 0.0000, in_stock_rate: 1.0000 }
              as: MarketplaceAdmin
              captures: { q_id: "$.data.id" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv1: "$.data.version" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-10T00:00:00Z", appointment_window_end: "2026-08-11T00:00:00Z", expected_seller_account_version: "${sv1}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { p1_id: "$.data.id" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv2: "$.data.version" }
          trigger:
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "11111111-1111-4111-8111-111111111111", sku: "SKU-ORPHAN", unit_cubic_feet: 1.0000, unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { e_seller: "$.data.error_id" }
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "22222222-2222-4222-8222-222222222222", appointment_window_start: "2026-08-10T00:00:00Z", appointment_window_end: "2026-08-11T00:00:00Z", expected_seller_account_version: "${sv2}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { e_fc: "$.data.error_id" }
            - call: "POST /fulfillment/inbound-shipment-plans/${p1_id}/line-items"
              payload: { sku_listing_id: "33333333-3333-4333-8333-333333333333", units: 100, case_pack_units: 10, polybagged: true, label_type: "FNSKU" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { e_listing: "$.data.error_id" }
            - call: "POST /fulfillment/reimbursement-claims"
              payload: { inventory_lot_id: "55555555-5555-4555-8555-555555555555", claim_type: "LOST_INBOUND", claimed_units: 5, evidence_document_count: 2, evidence_reference: "X-1" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { e_lot: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404"
            - "${e_seller} == ERR_SELLER_NOT_FOUND"
            - "${e_fc} == ERR_FC_NOT_FOUND"
            - "${e_listing} == ERR_LISTING_NOT_FOUND"
            - "${e_lot} == ERR_LOT_NOT_FOUND"
            - "SellerAccount.${s_id}.version == ${sv2} (the rejected plan creation did not bump the seller version)"
            - "InboundShipmentPlan.${p1_id}.declared_units == 0"

      - name: sku_listing_creation_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /fulfillment/sku-listings]
        distinguishing_aspect: "Omitting the required unit_cubic_feet input on POST /fulfillment/sku-listings returns ERR_INVALID_REQUEST (400) at priority 3, before the seller FK is resolved."
        test_recipe:
          setup:
            - "One seller exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /fulfillment/sku-listings"
              payload: { seller_account_id: "${s_id}", sku: "SKU-ALPHA", unit_cost_cents: 1250 }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { e_invalid: "$.data.error_id" }
          assert:
            - "trigger returns HTTP 400 with ${e_invalid} == ERR_INVALID_REQUEST"
            - "GET /fulfillment/sellers/${s_id}/sku-listings returns total_count == 0"

      - name: plan_creation_defaults_applied_to_every_computed_counter
        claim_type: Defaults
        grounds:
          - state_machines.InboundShipmentPlan.initial_state
          - entities.InboundShipmentPlan
        distinguishing_aspect: "A newly created plan defaults to status DRAFT with declared_units, provisional_allocated_units, final_allocated_units, allocated_units, received_units and missing_units all 0, allocation_status WITHIN_LIMIT, prep_compliance_status PENDING and confirmed_at null."
        test_recipe:
          setup:
            - "One seller with an ACTIVE quota and one OPEN FC."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /fulfillment/fulfillment-centers"
              payload: { fc_code: "FC-A1", region_code: "US-WEST", prep_profile: "LABEL_ONLY", case_pack_min_units: 1, receiving_capacity_units_per_window: 100000, monthly_storage_rate_cents_per_cubic_foot: 87, ltsf_rate_cents_per_cubic_foot: 620 }
              as: MarketplaceAdmin
              captures: { fc_id: "$.data.id" }
            - call: "POST /fulfillment/sellers/${s_id}/restock-quotas"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z", base_capacity_units: 1000, sell_through_rate: 2.5000, excess_units_ratio: 0.0000, stranded_ratio: 0.0000, in_stock_rate: 1.0000 }
              as: MarketplaceAdmin
              captures: { q_id: "$.data.id" }
            - call: "GET /fulfillment/sellers/${s_id}"
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { sv1: "$.data.version" }
          trigger:
            - call: "POST /fulfillment/inbound-shipment-plans"
              payload: { seller_account_id: "${s_id}", destination_fc_id: "${fc_id}", appointment_window_start: "2026-08-10T00:00:00Z", appointment_window_end: "2026-08-11T00:00:00Z", expected_seller_account_version: "${sv1}" }
              as: SellerOperator
              as_user_id: "${s_id}"
              captures: { p1_id: "$.data.id", p1_status: "$.data.status" }
          assert:
            - "${p1_status} == DRAFT"
            - "InboundShipmentPlan.${p1_id}.declared_units == 0"
            - "InboundShipmentPlan.${p1_id}.provisional_allocated_units == 0"
            - "InboundShipmentPlan.${p1_id}.final_allocated_units == 0"
            - "InboundShipmentPlan.${p1_id}.allocated_units == 0"
            - "InboundShipmentPlan.${p1_id}.allocation_status == WITHIN_LIMIT"
            - "InboundShipmentPlan.${p1_id}.prep_compliance_status == PENDING"
            - "InboundShipmentPlan.${p1_id}.received_units == 0"
            - "InboundShipmentPlan.${p1_id}.missing_units == 0"
            - "InboundShipmentPlan.${p1_id}.confirmed_at == null"
            - "SellerAccount.${s_id}.version == ${sv1} + 1"

      - name: line_item_computed_allocation_client_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.ShipmentLineItem.fields.provisional_allocated_units
          - calculations.restock_allocation
          - endpoints[POST /fulfillment/inbound-shipment-plans/{id}/line-items]
        distinguishing_aspect: "A client-supplied provisional_allocated_units value on line-item creation is ignored: the field is written only by the PROVISIONAL waterfall, which grants 100 for this line."
        test_recipe:
          setup:
            - "One seller with quota restock_limit_units 3000, one FC with prep_profile LABEL_ONLY, one listing, one DRAFT plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
