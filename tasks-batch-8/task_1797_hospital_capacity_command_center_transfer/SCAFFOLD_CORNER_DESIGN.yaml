              as: HouseSupervisor
              as_user_id: "hs_1"
              captures: { dv: $.data.id }
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/diversions/${dv}/lift"
              payload: {}
              as: HouseSupervisor
              as_user_id: "hs_2"
          trigger:
            - call: "POST /cc/diversions/${dv}/lift"
              payload: {}
              as: HouseSupervisor
              as_user_id: "hs_3"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_DIVERSION_INVALID_STATE"

      - name: hold_release_twice_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOLD_INVALID_STATE]"]
        distinguishing_aspect: "release requires ACTIVE; releasing an already-RELEASED hold fails ERR_HOLD_INVALID_STATE."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician; bed; request ACCEPTED; hold created then released once"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "HIS Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
