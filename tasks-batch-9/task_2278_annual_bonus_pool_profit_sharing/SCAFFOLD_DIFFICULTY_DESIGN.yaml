      - name: certification_return_rewinds_scorecards_and_zeroes_the_multiplier
        grounds:
          - state_machines.BonusPlan
          - state_machines.BusinessUnitPool
          - calculations.bu_weighted_achievement
          - calculations.funding_curve_multiplier
          - entities.BonusPlan.fields.certified_by_user_id
          - endpoints."POST /bonus-plans/{planId}/certification-decision"
        distinguishing_aspect: |
          RETURN is not the inverse of submit: it rewinds the plan to
          TARGETS_SET *and* drags every SCORECARD_CERTIFIED pool back to
          DRAFT, which empties the input set of bu_weighted_achievement and
          therefore resets bu_weighted / blended / funding_multiplier to
          0.00 / 0.00 / 0.0000 even though no metric actual changed. The plan
          cannot be resubmitted until each scorecard is re-submitted and
          re-certified, and only the second pass through
          PENDING_CERTIFICATION produces multiplier 0.5000.
