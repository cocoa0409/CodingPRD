# =============================================================================
# Scaffold: Salary Survey Participation & Market Pricing
# =============================================================================

scenario: |
  Salary Survey Participation & Market Pricing (corporate compensation function):
  survey selection & submission data preparation, job matching to survey benchmarks
  & confidence rating, aging & blending of multiple sources, geographic and industry
  cut selection, market position analysis vs strategy (percentile targets),
  compensation committee reporting, off-cycle market adjustment process, survey
  vendor contract & data governance.

domain_name: salary-survey-market-pricing
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal entity name" }
      - { name: base_currency, type: string, source: input, description: "ISO 4217 currency code (e.g., USD)" }
      - { name: fiscal_year_start_month, type: integer, source: input, default: 1, description: "1..12; month the fiscal year begins" }
      - { name: market_as_of_date, type: string, source: input, description: "ISO date to which all survey data is aged (YYYY-MM-DD)" }
      - { name: strategy_policy_id, type: string, source: system, description: "FK -> MarketStrategyPolicy.id; active strategy governing percentile targets; null until first activation" }

  - name: MarketStrategyPolicy
    parent: Organization
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: name, type: string, source: input, description: "Policy display name" }
      - { name: target_percentile, type: integer, source: input, description: "Target market percentile for midpoint positioning; one of {25, 50, 65, 75, 90}" }
      - { name: geo_differential_policy, type: enum, source: input, description: "NATIONAL | METRO_TIER | CUSTOM_GEO_INDEX" }
      - { name: industry_cut, type: enum, source: input, description: "ALL_INDUSTRIES | HIGH_TECH | FINANCIAL_SERVICES | HEALTHCARE | MANUFACTURING | RETAIL" }
      - { name: effective_from, type: string, source: input, description: "ISO date this policy begins governing (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO date this policy stops governing (exclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: Employee
    parent: Organization
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: full_name, type: string, source: input, description: "Employee legal name" }
      - { name: email, type: string, source: input, description: "Work email; unique per org" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; current job assignment" }
      - { name: geo_code, type: string, source: input, description: "Location code used for geographic differentials (e.g., US-SF, US-NYC, US-REMOTE)" }
      - { name: base_salary_annual_cents, type: integer, source: input, description: "Current annualized base salary in cents" }
      - { name: hire_date, type: string, source: input, description: "ISO date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LEAVE | TERMINATED" }

  - name: Job
    parent: Organization
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: job_code, type: string, source: input, description: "Internal job code; unique per org" }
      - { name: title, type: string, source: input, description: "Job title" }
      - { name: job_family, type: string, source: input, description: "Job family grouping (e.g., ENG, FIN, HR)" }
      - { name: career_level, type: enum, source: input, description: "IC1 | IC2 | IC3 | IC4 | IC5 | M1 | M2 | M3" }
      - { name: flsa_status, type: enum, source: input, description: "EXEMPT | NON_EXEMPT" }
      - { name: current_market_composite_id, type: string, source: system, description: "FK -> MarketComposite.id; latest PUBLISHED composite for this job (null until first publication)" }

  - name: SurveyVendor
    parent: Organization
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: vendor_name, type: string, source: input, description: "Vendor name (e.g., Radford, Mercer, WTW)" }
      - { name: contract_start_date, type: string, source: input, description: "ISO date of contract start (inclusive)" }
      - { name: contract_end_date, type: string, source: input, description: "ISO date of contract end (exclusive)" }
      - { name: data_use_scope, type: enum, source: input, description: "BENCHMARK_ONLY | FULL_PARTICIPATION; governs whether org may submit incumbent data" }
      - { name: confidentiality_tier, type: enum, source: input, description: "PUBLIC | CONFIDENTIAL | RESTRICTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }

  - name: Survey
    parent: SurveyVendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> SurveyVendor.id" }
      - { name: org_id, type: string, source: system, description: "FK -> Organization.id (denormalized)" }
      - { name: survey_code, type: string, source: input, description: "Vendor's survey identifier; unique per vendor" }
      - { name: edition_year, type: integer, source: input, description: "Survey edition year (e.g., 2026)" }
      - { name: data_effective_date, type: string, source: input, description: "ISO date as of which the survey data is effective; used by aging" }
      - { name: submission_deadline, type: string, source: input, description: "ISO date; submissions accepted while current_utc_date <= submission_deadline (closed interval)" }
      - { name: industry_cut_supported, type: array, source: input, description: "List of industry cuts this survey publishes" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED | SUBMITTED | ACCEPTED | REJECTED" }

  - name: SurveyBenchmark
    parent: Survey
    common_fields: true
    fields:
      - { name: survey_id, type: string, source: system, description: "FK -> Survey.id" }
      - { name: benchmark_code, type: string, source: input, description: "Vendor's benchmark code (e.g., ENG.SWE.IC3)" }
      - { name: benchmark_title, type: string, source: input, description: "Vendor's benchmark title" }
      - { name: career_level, type: enum, source: input, description: "IC1 | IC2 | IC3 | IC4 | IC5 | M1 | M2 | M3" }
      - { name: industry_cut, type: enum, source: input, description: "ALL_INDUSTRIES | HIGH_TECH | FINANCIAL_SERVICES | HEALTHCARE | MANUFACTURING | RETAIL" }
      - { name: geo_scope, type: string, source: input, description: "NATIONAL or a geo_code" }
      - { name: p25_cents, type: integer, source: input, description: "25th percentile annual base" }
      - { name: p50_cents, type: integer, source: input, description: "50th percentile annual base" }
      - { name: p75_cents, type: integer, source: input, description: "75th percentile annual base" }
      - { name: p90_cents, type: integer, source: input, description: "90th percentile annual base" }
      - { name: sample_size, type: integer, source: input, description: "Incumbent count contributing to the benchmark" }

  - name: SurveySubmission
    parent: Survey
    common_fields: true
    fields:
      - { name: survey_id, type: string, source: system, description: "FK -> Survey.id" }
      - { name: submitted_by_employee_id, type: string, source: input, description: "FK -> Employee.id of CompAnalyst who prepared the submission" }
      - { name: incumbent_snapshot, type: array, source: input, description: "Array of { employee_id, job_id, base_salary_annual_cents, geo_code } entries to submit" }
      - { name: prepared_at, type: datetime, source: system, description: "Server timestamp when submission entered READY; null until then" }
      - { name: submitted_at, type: datetime, source: system, description: "Server timestamp when submission entered SUBMITTED; null until then" }
      - { name: rejection_reason, type: string, source: system, description: "Vendor-provided reason when status=RETURNED; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | READY | SUBMITTED | ACCEPTED | RETURNED" }

  - name: SurveyJobMatch
    parent: Survey
    common_fields: true
    fields:
      - { name: survey_id, type: string, source: system, description: "FK -> Survey.id" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id being matched" }
      - { name: benchmark_id, type: string, source: input, description: "FK -> SurveyBenchmark.id matched to" }
      - { name: match_confidence, type: enum, source: input, description: "HIGH | MEDIUM | LOW" }
      - { name: match_weight_pct, type: integer, source: input, description: "Weight 1..100 this match contributes to the job's blend within this survey" }
      - { name: proposed_by_employee_id, type: string, source: input, description: "FK -> Employee.id of CompAnalyst who proposed the match" }
      - { name: reviewer_employee_id, type: string, source: system, description: "FK -> Employee.id of CompManager who approved; null until approved" }
      - { name: status, type: enum, source: system, description: "PROPOSED | REVIEWED | APPROVED | REJECTED" }

  - name: MarketComposite
    parent: Job
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id" }
      - { name: strategy_policy_id, type: string, source: system, description: "FK -> MarketStrategyPolicy.id used for geo/industry cut selection" }
      - { name: job_geo_code, type: string, source: input, description: "Geo code pinned at composite creation; drives geographic_differential lookup (e.g., US-SF)" }
      - { name: blended_p25_cents, type: integer, source: computed, description: "Aged & blended 25th percentile" }
      - { name: blended_p50_cents, type: integer, source: computed, description: "Aged & blended 50th percentile (market midpoint)" }
      - { name: blended_p75_cents, type: integer, source: computed, description: "Aged & blended 75th percentile" }
      - { name: blended_p90_cents, type: integer, source: computed, description: "Aged & blended 90th percentile" }
      - { name: geo_differential_bp, type: integer, source: computed, description: "Geographic differential applied in basis points (10000 = 1.0x); null when NATIONAL" }
      - { name: source_count, type: integer, source: computed, description: "Number of APPROVED SurveyJobMatches blended" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp of publication; null until PUBLISHED" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED" }

  - name: MarketAdjustmentCycle
    parent: Organization
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: name, type: string, source: input, description: "Cycle display name (e.g., 2026-Q3 off-cycle)" }
      - { name: effective_date, type: string, source: input, description: "ISO date adjustments become effective" }
      - { name: budget_cents, type: integer, source: input, description: "Total adjustment budget in cents" }
      - { name: allocated_cents, type: integer, source: computed, description: "Sum of proposed_amount_cents over child adjustments in {APPROVED, APPLIED}" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | CLOSED" }

  - name: MarketAdjustment
    parent: MarketAdjustmentCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> MarketAdjustmentCycle.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id receiving the adjustment" }
      - { name: job_id, type: string, source: system, description: "FK -> Job.id (denormalized from employee at creation)" }
      - { name: proposed_amount_cents, type: integer, source: input, description: "Proposed adjustment in cents (must be > 0 and <= 15% of current base)" }
      - { name: proposed_by_employee_id, type: string, source: input, description: "FK -> Employee.id of CompAnalyst who proposed" }
      - { name: approved_by_employee_id, type: string, source: system, description: "FK -> Employee.id of CompManager approver (must differ from proposer); null until approved" }
      - { name: pre_adjustment_compa_ratio_bp, type: integer, source: computed, description: "Compa-ratio in basis points at submit time (10000 = 1.0x)" }
      - { name: post_adjustment_compa_ratio_bp, type: integer, source: computed, description: "Compa-ratio in basis points if proposed amount applied" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | APPLIED | REJECTED" }

  - name: CompensationReport
    parent: Organization
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: title, type: string, source: input, description: "Report title" }
      - { name: reporting_period_start, type: string, source: input, description: "ISO date (inclusive)" }
      - { name: reporting_period_end, type: string, source: input, description: "ISO date (exclusive)" }
      - { name: pinned_strategy_policy_id, type: string, source: input, description: "FK -> MarketStrategyPolicy.id pinned at draft time" }
      - { name: snapshot_payload, type: object, source: computed, description: "Frozen snapshot: per-job market position, percentile attainment, outliers; null until FINALIZED" }
      - { name: presented_at, type: datetime, source: system, description: "Timestamp when presented to committee; null until PRESENTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | PRESENTED" }

  - name: AuditEvent
    parent: Organization
    common_fields: false
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: actor_employee_id, type: string, source: system, description: "FK -> Employee.id of actor; null for system or opaque roles" }
      - { name: action, type: string, source: system, description: "Machine name of the action (e.g., SURVEY_SUBMIT, MATCH_APPROVE)" }
      - { name: target_entity, type: string, source: system, description: "Entity type of the mutation target" }
      - { name: target_id, type: string, source: system, description: "ID of the mutation target" }
      - { name: payload_hash, type: string, source: system, description: "SHA-256 of canonical JSON of side-effect payload" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MarketStrategyPolicy
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /orgs/{id}/strategies/{id}/activate"
        actor: CompManager
        preconditions:
          - "effective_from < effective_to (ERR_INVALID_REQUEST)"
          - "No other ACTIVE strategy for this org whose [effective_from, effective_to) overlaps this policy's window (ERR_STRATEGY_WINDOW_OVERLAP)"
        side_effects:
          - "Organization.strategy_policy_id = this strategy id"
          - "Organization.version += 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /orgs/{id}/strategies/{id}/retire"
        actor: CompManager
        preconditions: []
        side_effects:
          - "If Organization.strategy_policy_id == this id: set to null"

  - entity: SurveyVendor
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /orgs/{id}/vendors/{id}/activate"
        actor: VendorAdmin
        preconditions:
          - "contract_start_date <= current_utc_date < contract_end_date (ERR_VENDOR_CONTRACT_WINDOW)"
        side_effects:
          - "Emit AuditEvent VENDOR_ACTIVATE"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when current_utc_date >= contract_end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "All child Survey rows in {DRAFT, OPEN} transition to REJECTED"
          - "Emit AuditEvent VENDOR_EXPIRE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /orgs/{id}/vendors/{id}/terminate"
        actor: VendorAdmin
        preconditions:
          - "No child Survey in status SUBMITTED (ERR_VENDOR_HAS_OPEN_SUBMISSIONS)"
        side_effects:
          - "All child Survey rows in {DRAFT, OPEN} transition to REJECTED"
          - "Each REJECTED Survey cascades: its Submission rows in {DRAFT, READY} transition to RETURNED with rejection_reason='VENDOR_TERMINATED'"
          - "Emit AuditEvent VENDOR_TERMINATE"

  - entity: Survey
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /orgs/{id}/surveys/{id}/open"
        actor: VendorAdmin
        preconditions:
          - "Vendor.status == ACTIVE (ERR_VENDOR_NOT_ACTIVE)"
          - "current_utc_date <= submission_deadline (ERR_SUBMISSION_WINDOW_CLOSED)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /orgs/{id}/surveys/{id}/close OR system at submission_deadline+1"
        actor: VendorAdmin | system
        preconditions: []
        side_effects:
          - "Child SurveySubmission rows in DRAFT or READY transition to RETURNED with rejection_reason='SURVEY_CLOSED'"
      - from: CLOSED
        to: SUBMITTED
        trigger: "system (immediate after close, when at least one child Submission is SUBMITTED)"
        actor: system
        preconditions:
          - "At least one SurveySubmission in SUBMITTED"
        side_effects: []
      - from: CLOSED
        to: REJECTED
        trigger: "system (immediate after close, when zero child Submissions are SUBMITTED)"
        actor: system
        preconditions:
          - "Zero SurveySubmission rows in SUBMITTED"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /orgs/{id}/surveys/{id}/accept"
        actor: VendorAdmin
        preconditions:
          - "All SurveySubmission rows are in {SUBMITTED, ACCEPTED, RETURNED} (ERR_SUBMISSIONS_PENDING)"
        side_effects:
          - "All SurveySubmission rows in SUBMITTED transition to ACCEPTED"
          - "Emit AuditEvent SURVEY_ACCEPT"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /orgs/{id}/surveys/{id}/reject"
        actor: VendorAdmin
        preconditions: []
        side_effects:
          - "All SurveySubmission rows in SUBMITTED transition to RETURNED with rejection_reason from request"
          - "Emit AuditEvent SURVEY_REJECT"
      - from: DRAFT
        to: REJECTED
        trigger: "system (cascade from Vendor terminate/expire)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: REJECTED
        trigger: "system (cascade from Vendor terminate/expire)"
        actor: system
        preconditions: []
        side_effects:
          - "Child Submission rows in {DRAFT, READY} transition to RETURNED with rejection_reason='VENDOR_TERMINATED'"

  - entity: SurveySubmission
    initial_state: DRAFT
    terminal_states: [ACCEPTED, RETURNED]
    transitions:
      - from: DRAFT
        to: READY
        trigger: "POST /orgs/{id}/submissions/{submissionId}/mark_ready"
        actor: CompAnalyst
        preconditions:
          - "Parent Survey.status == OPEN (ERR_SURVEY_NOT_OPEN)"
          - "incumbent_snapshot has at least 1 entry (ERR_EMPTY_SUBMISSION)"
          - "Every snapshot entry references an ACTIVE Employee of this org (ERR_EMPLOYEE_NOT_ACTIVE)"
          - "Vendor.data_use_scope == FULL_PARTICIPATION (ERR_VENDOR_SCOPE_FORBIDS_SUBMISSION)"
        side_effects:
          - "prepared_at = current_utc"
      - from: READY
        to: SUBMITTED
        trigger: "POST /orgs/{id}/submissions/{submissionId}/submit"
        actor: CompAnalyst
        preconditions:
          - "current_utc_date <= submission_deadline (ERR_SUBMISSION_WINDOW_CLOSED)"
          - "Survey.status == OPEN (ERR_SURVEY_NOT_OPEN)"
        side_effects:
          - "submitted_at = current_utc"
          - "Emit AuditEvent SURVEY_SUBMIT"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /orgs/{id}/submissions/{submissionId}/accept OR cascade from Survey accept"
        actor: VendorAdmin | system
        preconditions: []
        side_effects:
          - "Emit AuditEvent SUBMISSION_ACCEPT"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /orgs/{id}/submissions/{submissionId}/return OR cascade from Survey reject"
        actor: VendorAdmin | system
        preconditions: []
        side_effects:
          - "rejection_reason = request.reason (or cascade-provided reason)"
      - from: DRAFT
        to: RETURNED
        trigger: "system (cascade from Survey close or Vendor terminate)"
        actor: system
        preconditions: []
        side_effects:
          - "rejection_reason = 'SURVEY_CLOSED' or 'VENDOR_TERMINATED'"
      - from: READY
        to: RETURNED
        trigger: "system (cascade from Survey close or Vendor terminate)"
        actor: system
        preconditions: []
        side_effects:
          - "rejection_reason = 'SURVEY_CLOSED' or 'VENDOR_TERMINATED'"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /orgs/{id}/submissions/{submissionId}/rework"
        actor: CompAnalyst
        preconditions:
          - "Parent Survey.status == OPEN (ERR_SURVEY_NOT_OPEN)"
          - "current_utc_date <= submission_deadline (ERR_SUBMISSION_WINDOW_CLOSED)"
        side_effects:
          - "rejection_reason = null"
          - "prepared_at = null"
          - "submitted_at = null"

  - entity: SurveyJobMatch
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: REVIEWED
        trigger: "POST /orgs/{id}/matches/{matchId}/review"
        actor: CompManager
        preconditions:
          - "Parent Survey.status IN {OPEN, CLOSED, SUBMITTED, ACCEPTED} (ERR_SURVEY_NOT_OPEN)"
          - "match_weight_pct in [1, 100] (ERR_INVALID_WEIGHT)"
        side_effects: []
      - from: REVIEWED
        to: APPROVED
        trigger: "POST /orgs/{id}/matches/{matchId}/approve"
        actor: CompManager
        preconditions:
          - "Approver (X-User-ID) MUST NOT equal proposed_by_employee_id (segregation of duties: ERR_SOD_VIOLATION)"
          - "Benchmark.sample_size >= 5 (ERR_SAMPLE_SIZE_TOO_SMALL)"
        side_effects:
          - "reviewer_employee_id = X-User-ID"
          - "Emit AuditEvent MATCH_APPROVE"
      - from: REVIEWED
        to: REJECTED
        trigger: "POST /orgs/{id}/matches/{matchId}/reject"
        actor: CompManager
        preconditions: []
        side_effects:
          - "Emit AuditEvent MATCH_REJECT"
      - from: REVIEWED
        to: PROPOSED
        trigger: "POST /orgs/{id}/matches/{matchId}/revise"
        actor: CompAnalyst
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: PROPOSED
        trigger: "POST /orgs/{id}/matches/{matchId}/revise"
        actor: CompAnalyst
        preconditions: []
        side_effects: []

  - entity: MarketComposite
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /orgs/{id}/composites/{compositeId}/publish"
        actor: CompManager
        preconditions:
          - "source_count >= 1 (ERR_NO_SOURCES)"
          - "Job has no other PUBLISHED composite whose strategy_policy_id equals this composite's (ERR_ALREADY_PUBLISHED)"
          - "expected_job_version == Job.version (ERR_STALE_VERSION)"
        side_effects:
          - "published_at = current_utc"
          - "Job.current_market_composite_id = this composite id"
          - "Job.version += 1"
          - "The change of Job.current_market_composite_id triggers: any prior PUBLISHED MarketComposite for the same Job transitions to SUPERSEDED"
          - "Emit AuditEvent COMPOSITE_PUBLISH"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (cascade from Job.current_market_composite_id repointing)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MarketAdjustmentCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /orgs/{id}/cycles/{id}/lock"
        actor: CompManager
        preconditions:
          - "No child MarketAdjustment in PENDING_APPROVAL (ERR_CYCLE_HAS_PENDING)"
        side_effects:
          - "Emit AuditEvent CYCLE_LOCK"
      - from: LOCKED
        to: CLOSED
        trigger: "POST /orgs/{id}/cycles/{id}/close"
        actor: CompManager
        preconditions:
          - "All child MarketAdjustment rows are in {APPLIED, REJECTED} (ERR_CYCLE_HAS_UNAPPLIED)"
        side_effects:
          - "Emit AuditEvent CYCLE_CLOSE"
      - from: LOCKED
        to: OPEN
        trigger: "POST /orgs/{id}/cycles/{id}/unlock"
        actor: CompManager
        preconditions: []
        side_effects:
          - "Emit AuditEvent CYCLE_UNLOCK"

  - entity: MarketAdjustment
    initial_state: DRAFT
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /orgs/{id}/adjustments/{adjustmentId}/submit"
        actor: CompAnalyst
        preconditions:
          - "Parent cycle.status == OPEN (ERR_CYCLE_NOT_OPEN)"
          - "proposed_amount_cents > 0 (ERR_INVALID_AMOUNT)"
          - "proposed_amount_cents <= 15% of employee's current base (ERR_INVALID_AMOUNT)"
          - "Employee.status == ACTIVE (ERR_EMPLOYEE_NOT_ACTIVE)"
          - "Job.current_market_composite_id is not null (ERR_NO_PUBLISHED_COMPOSITE)"
        side_effects:
          - "Compute pre_adjustment_compa_ratio_bp from current salary and composite blended_p50_cents"
          - "Compute post_adjustment_compa_ratio_bp with proposed_amount_cents added"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /orgs/{id}/adjustments/{adjustmentId}/approve"
        actor: CompManager
        preconditions:
          - "Approver (X-User-ID) MUST NOT equal proposed_by_employee_id (segregation of duties: ERR_SOD_VIOLATION)"
          - "expected_cycle_version == cycle.version (ERR_STALE_VERSION)"
          - "cycle.allocated_cents + proposed_amount_cents <= cycle.budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "cycle.allocated_cents += proposed_amount_cents"
          - "cycle.version += 1"
          - "approved_by_employee_id = X-User-ID"
          - "Emit AuditEvent ADJUSTMENT_APPROVE"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /orgs/{id}/adjustments/{adjustmentId}/reject"
        actor: CompManager
        preconditions: []
        side_effects:
          - "Emit AuditEvent ADJUSTMENT_REJECT"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /orgs/{id}/adjustments/{adjustmentId}/retract"
        actor: CompAnalyst
        preconditions:
          - "Retractor (X-User-ID) MUST equal proposed_by_employee_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: "POST /orgs/{id}/adjustments/{adjustmentId}/apply"
        actor: CompManager
        preconditions:
          - "Parent cycle.status == LOCKED (ERR_CYCLE_NOT_LOCKED)"
          - "current_utc_date >= cycle.effective_date (ERR_ADJUSTMENT_NOT_YET_EFFECTIVE)"
        side_effects:
          - "Employee.base_salary_annual_cents += proposed_amount_cents"
          - "Employee.version += 1"
          - "Emit AuditEvent ADJUSTMENT_APPLY"

  - entity: CompensationReport
    initial_state: DRAFT
    terminal_states: [PRESENTED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /orgs/{id}/reports/{reportId}/finalize"
        actor: CompManager
        preconditions:
          - "pinned_strategy_policy.status == ACTIVE (ERR_STRATEGY_NOT_ACTIVE)"
          - "Every PUBLISHED MarketComposite for the org references pinned_strategy_policy_id OR is explicitly excluded via exclude_job_ids (ERR_MIXED_STRATEGY_SOURCES)"
        side_effects:
          - "snapshot_payload = market_position_snapshot()"
      - from: FINALIZED
        to: PRESENTED
        trigger: "POST /orgs/{id}/reports/{reportId}/present"
        actor: HRDirector
        preconditions: []
        side_effects:
          - "presented_at = current_utc"
          - "Emit AuditEvent REPORT_PRESENT"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: composite-publish-stale-job
    parent_entity: Job
    write_endpoint: "POST /orgs/{id}/composites/{compositeId}/publish"
    occ_field: "expected_job_version"
    description: |
      Publishing a MarketComposite against a Job whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just published a newer composite (which legitimately supersedes
      the prior under §1.2 MarketComposite) and the current writer's view of the
      job is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: adjustment-approve-stale-cycle
    parent_entity: MarketAdjustmentCycle
    write_endpoint: "POST /orgs/{id}/adjustments/{adjustmentId}/approve"
    occ_field: "expected_cycle_version"
    description: |
      Approving a MarketAdjustment against a cycle whose version has advanced
      since the client last observed it is rejected. The version moves whenever
      allocated_cents changes, so a stale read would otherwise let two approvers
      sequentially over-commit the budget.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: aging_adjustment
    trigger: "market composite recompute (publish and on-demand recompute)"
    algorithm: chronological
    formula: |
      months_elapsed = floor((market_as_of_date - survey.data_effective_date) in calendar months)
      if months_elapsed < 0: months_elapsed = 0
      aging_factor = (1 + ANNUAL_AGING_RATE) ** (months_elapsed / 12)
      aged_pXX_cents = round_half_up(benchmark.pXX_cents * aging_factor)
      Apply independently to p25, p50, p75, p90.
      Calendar-month arithmetic: a month boundary is crossed when the day-of-month
      of market_as_of_date is >= day-of-month of data_effective_date for that month.
    constants:
      ANNUAL_AGING_RATE: 0.03
    precision: "0 decimal places (whole cents), round_half_up applied once at the final multiplication per percentile"

  - name: geographic_differential
    trigger: "market composite recompute (runs after aging_adjustment, before industry_cut_premium)"
    algorithm: weighted_scoring
    formula: |
      if strategy.geo_differential_policy == NATIONAL:
        geo_differential_bp = 10000
      elif strategy.geo_differential_policy == METRO_TIER:
        geo_differential_bp = METRO_TIER_BP[composite.job_geo_code]
        if composite.job_geo_code not in METRO_TIER_BP: geo_differential_bp = 10000
      elif strategy.geo_differential_policy == CUSTOM_GEO_INDEX:
        geo_differential_bp = CUSTOM_GEO_INDEX_BP[composite.job_geo_code]
        if composite.job_geo_code not in CUSTOM_GEO_INDEX_BP: raise ERR_GEO_INDEX_MISSING
      geo_adjusted_pXX_cents = round_half_up(aged_pXX_cents * geo_differential_bp / 10000)
    constants:
      METRO_TIER_BP:
        US-SF: 12800
        US-NYC: 12200
        US-SEA: 11200
        US-AUS: 10400
        US-REMOTE: 9500
      CUSTOM_GEO_INDEX_BP:
        US-SF: 13100
        US-NYC: 12400
        US-CHI: 10600
        US-REMOTE: 9200
    precision: "0 decimal places (whole cents), round_half_up"

  - name: industry_cut_premium
    trigger: "market composite recompute (runs after geographic_differential, before weighted_blend)"
    algorithm: threshold
    formula: |
      If strategy.industry_cut == ALL_INDUSTRIES:
        industry_premium_bp = 10000
      elif benchmark.industry_cut == strategy.industry_cut:
        industry_premium_bp = INDUSTRY_PREMIUM_BP[strategy.industry_cut]
      else:
        industry_premium_bp = 10000
      premium_adjusted_pXX_cents = round_half_up(geo_adjusted_pXX_cents * industry_premium_bp / 10000)
    constants:
      INDUSTRY_PREMIUM_BP:
        HIGH_TECH: 10800
        FINANCIAL_SERVICES: 11200
        HEALTHCARE: 10300
        MANUFACTURING: 9800
        RETAIL: 9400
        ALL_INDUSTRIES: 10000
    precision: "0 decimal places (whole cents), round_half_up"

  - name: weighted_blend
    trigger: "market composite recompute (final step; consumes premium_adjusted_pXX_cents per source)"
    algorithm: weighted_scoring
    formula: |
      Input set: all SurveyJobMatch rows for the composite's Job whose status ==
      APPROVED AND whose parent Survey.status == ACCEPTED AND whose parent
      SurveyVendor.status == ACTIVE.
      For each included match m with benchmark b:
        match_weight = m.match_weight_pct / 100
        confidence_factor = CONFIDENCE_FACTOR[m.match_confidence]
        sample_factor = min(1.0, b.sample_size / MIN_FULL_SAMPLE)
        effective_weight = match_weight * confidence_factor * sample_factor
      If sum(effective_weight) == 0: raise ERR_NO_SOURCES
      Normalize: w_i = effective_weight_i / sum(effective_weight)
      blended_pXX_cents = round_half_up(sum(w_i * premium_adjusted_pXX_cents_i))
    constants:
      CONFIDENCE_FACTOR:
        HIGH: 1.00
        MEDIUM: 0.75
        LOW: 0.40
      MIN_FULL_SAMPLE: 30
    precision: "0 decimal places (whole cents), round_half_up applied at the final sum only (NOT per-term)"
    variants:
      - name: conservative_blend
        when: "Job.career_level IN {M1, M2, M3} — executive-level jobs use a conservative blend"
        difference: "Replaces CONFIDENCE_FACTOR[LOW] with 0.20 (halved) and outright excludes any benchmark whose sample_size < 10 (rather than scaling via sample_factor)."

  - name: market_position_compa_ratio
    trigger: "market adjustment submit (pre and post); compensation report snapshot"
    algorithm: threshold
    formula: |
      compa_ratio_bp = round_half_up(employee.base_salary_annual_cents * 10000 / composite.blended_p50_cents)
      position_band =
        BELOW_RANGE    if compa_ratio_bp <  8000
        BELOW_TARGET   if 8000 <= compa_ratio_bp <  9500
        AT_TARGET      if 9500 <= compa_ratio_bp <= 10500
        ABOVE_TARGET   if 10500 < compa_ratio_bp <= 12000
        ABOVE_RANGE    if compa_ratio_bp > 12000
    constants:
      BELOW_RANGE_BP: 8000
      BELOW_TARGET_BP: 9500
      AT_TARGET_UPPER_BP: 10500
      ABOVE_TARGET_BP: 12000
    precision: "0 decimal places (basis points), round_half_up"

  - name: percentile_position
    trigger: "compensation report snapshot (per employee)"
    algorithm: weighted_scoring
    formula: |
      For employee salary S against composite {p25, p50, p75, p90}:
      if S < p25: percentile_attainment_bp = round_half_up(2500 * S / p25)
      elif S < p50: percentile_attainment_bp = 2500 + round_half_up(2500 * (S - p25) / (p50 - p25))
      elif S < p75: percentile_attainment_bp = 5000 + round_half_up(2500 * (S - p50) / (p75 - p50))
      elif S < p90: percentile_attainment_bp = 7500 + round_half_up(1500 * (S - p75) / (p90 - p75))
      else: percentile_attainment_bp = 9000 + min(1000, round_half_up(1000 * (S - p90) / p90))
      Denominator uses the exact blended values (no intermediate rounding of ratios).
    precision: "0 decimal places (basis points), round_half_up at each segment's inner term"

  - name: recommended_adjustment
    trigger: "market adjustment submit (advisory) and compensation report snapshot"
    algorithm: waterfall_allocation
    formula: |
      P = strategy.target_percentile
      target_cents = composite.blended_pP_cents  (e.g., blended_p50_cents if P=50)
      raw_gap_cents = max(0, target_cents - employee.base_salary_annual_cents)
      cap_cents = round_half_up(MAX_SINGLE_ADJUSTMENT_BP * employee.base_salary_annual_cents / 10000)
      compa_ratio_bp computed per market_position_compa_ratio
      if compa_ratio_bp >= AT_TARGET_UPPER_BP: recommended = 0
      elif compa_ratio_bp < BELOW_RANGE_BP:    recommended = min(raw_gap_cents, cap_cents)
      elif compa_ratio_bp < BELOW_TARGET_BP:   recommended = min(raw_gap_cents, round_half_up(cap_cents * 0.6))
      else:                                     recommended = 0
    constants:
      MAX_SINGLE_ADJUSTMENT_BP: 1500
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: provisional_recommendation
        when: "Computed at adjustment-submit time against the CURRENT PUBLISHED composite; advisory only."
        difference: "Uses blended values from the composite PUBLISHED at submit time; NOT recomputed on approve. The approved amount is the proposer's proposed_amount_cents, which may differ from the recommendation."
      - name: final_recommendation
        when: "Computed at report-finalize time as a snapshot field."
        difference: "Uses the composite PUBLISHED at finalize time. If a newer composite superseded between submit and finalize, pre- and post-snapshot values will diverge — this is intentional."

  - name: market_position_snapshot
    trigger: "compensation report finalize"
    algorithm: aggregation
    formula: |
      snapshot_payload = {
        strategy_policy_id,
        generated_at_utc,
        jobs: [
          for each Job in org with current_market_composite_id != null
          AND NOT excluded via exclude_job_ids:
            {
              job_id, job_code, career_level,
              blended_p50_cents,
              headcount: count of ACTIVE Employees assigned to job,
              avg_compa_ratio_bp: round_half_up(mean of market_position_compa_ratio over those employees),
              below_target_count: count of ACTIVE employees whose position_band in {BELOW_RANGE, BELOW_TARGET},
              above_target_count: count of ACTIVE employees whose position_band in {ABOVE_TARGET, ABOVE_RANGE},
              total_market_gap_cents: sum of max(0, blended_p50_cents - salary) across ACTIVE employees
            }
        ],
        org_wide_avg_compa_ratio_bp: headcount-weighted mean of per-job avg_compa_ratio_bp
      }
    precision: "0 decimal places (basis points and cents), round_half_up"

  - name: cycle_allocation
    trigger: "market adjustment approve (increment) and reject/retract from APPROVED is not allowed — value only changes on approve"
    algorithm: aggregation
    formula: |
      cycle.allocated_cents = sum(proposed_amount_cents) over child MarketAdjustment
      rows whose status IN {APPROVED, APPLIED}.
      Recomputed eagerly on every transition that enters APPROVED.
      Evaluation order on approve: (1) read current allocated_cents; (2) check
      allocated_cents + proposed_amount_cents <= budget_cents; (3) only then add.
    precision: "0 decimal places (whole cents)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role has permission for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced resources exist within the org scope (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Request body parses; required input fields present; enum fields use declared values; date fields are valid ISO dates"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource is in a state where the requested transition is permitted (survey open, cycle open/locked, etc.)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: state
    check: "Cycle gating — OPEN required for adjustment submit/retract/create; LOCKED required for apply; no PENDING_APPROVAL at lock; all terminal at close"
    error_id: "ERR_CYCLE_NOT_OPEN / ERR_CYCLE_NOT_LOCKED / ERR_CYCLE_HAS_PENDING / ERR_CYCLE_HAS_UNAPPLIED"
    http_status: 409
    applies_to: "POST .../cycles/{id}/lock, POST .../cycles/{id}/close, POST .../adjustments, POST .../adjustments/{id}/submit, POST .../adjustments/{id}/apply, POST .../adjustments/{id}/retract"

  - priority: 7
    category: state
    check: "Survey lifecycle gating for submissions and matches"
    error_id: "ERR_SURVEY_NOT_OPEN / ERR_SUBMISSIONS_PENDING / ERR_VENDOR_HAS_OPEN_SUBMISSIONS / ERR_NO_PUBLISHED_COMPOSITE"
    http_status: 409
    applies_to: "POST .../submissions/{id}/*, POST .../matches, POST .../surveys/{id}/accept, POST .../vendors/{id}/terminate, POST .../adjustments/{id}/submit"

  - priority: 8
    category: business_safety
    check: "Segregation of duties — approver (X-User-ID) MUST differ from proposer on both SurveyJobMatch and MarketAdjustment"
    error_id: ERR_SOD_VIOLATION
    http_status: 409
    applies_to: "POST .../matches/{id}/approve, POST .../adjustments/{id}/approve"

  - priority: 9
    category: business_temporal
    check: "Temporal windows — vendor contract window, submission deadline, adjustment effective date"
    error_id: "ERR_VENDOR_CONTRACT_WINDOW / ERR_SUBMISSION_WINDOW_CLOSED / ERR_ADJUSTMENT_NOT_YET_EFFECTIVE"
    http_status: 409
    applies_to: "POST .../vendors/{id}/activate, POST .../surveys/{id}/open, POST .../submissions/{id}/submit, POST .../submissions/{id}/rework, POST .../adjustments/{id}/apply"

  - priority: 10
    category: business_temporal
    check: "Strategy window overlap — no two ACTIVE strategies for the same org may have overlapping [effective_from, effective_to) intervals (half-open)"
    error_id: ERR_STRATEGY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST .../strategies/{id}/activate"

  - priority: 11
    category: business_temporal
    check: "Cycle effective_date uniqueness — a new cycle's effective_date MUST NOT fall inside [created_date, effective_date] of any other OPEN or LOCKED cycle for the same org (point-in-window)"
    error_id: ERR_CYCLE_EFFECTIVE_OVERLAP
    http_status: 409
    applies_to: "POST .../cycles"

  - priority: 12
    category: business_referential
    check: "Vendor and strategy referential gates — vendor must be ACTIVE, vendor scope must allow participation, pinned strategy must be ACTIVE"
    error_id: "ERR_VENDOR_NOT_ACTIVE / ERR_VENDOR_SCOPE_FORBIDS_SUBMISSION / ERR_STRATEGY_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST .../surveys/{id}/open, POST .../submissions/{id}/mark_ready, POST .../reports/{id}/finalize"

  - priority: 13
    category: business_referential
    check: "Report cannot mix composites from different strategy policies unless exclusions are explicit"
    error_id: ERR_MIXED_STRATEGY_SOURCES
    http_status: 409
    applies_to: "POST .../reports/{id}/finalize"

  - priority: 14
    category: business_constraint
    check: "Sample size floor — benchmark sample_size >= 5 for match approval"
    error_id: ERR_SAMPLE_SIZE_TOO_SMALL
    http_status: 409
    applies_to: "POST .../matches/{id}/approve"

  - priority: 15
    category: business_constraint
    check: "match_weight_pct integer in [1, 100]"
    error_id: ERR_INVALID_WEIGHT
    http_status: 422
    applies_to: "POST .../matches, POST .../matches/{id}/review"

  - priority: 16
    category: business_constraint
    check: "incumbent_snapshot non-empty; every entry references an ACTIVE Employee of this org"
    error_id: "ERR_EMPTY_SUBMISSION / ERR_EMPLOYEE_NOT_ACTIVE"
    http_status: 422
    applies_to: "POST .../submissions/{id}/mark_ready"

  - priority: 17
    category: business_constraint
    check: "A job may have at most one PUBLISHED composite per strategy_policy_id"
    error_id: ERR_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST .../composites/{id}/publish"

  - priority: 18
    category: business_constraint
    check: "Job has at least one APPROVED match contributing to a composite"
    error_id: ERR_NO_SOURCES
    http_status: 409
    applies_to: "POST .../composites/{id}/publish, POST .../composites/{id}/recompute"

  - priority: 19
    category: business_constraint
    check: "CUSTOM_GEO_INDEX policy requires a geo_index entry for the job_geo_code"
    error_id: ERR_GEO_INDEX_MISSING
    http_status: 422
    applies_to: "POST .../composites, POST .../composites/{id}/recompute"

  - priority: 20
    category: business_constraint
    check: "Optimistic concurrency: expected_<parent>_version must match current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../composites/{id}/publish, POST .../adjustments/{id}/approve"

  - priority: 21
    category: business_fiscal
    check: "Cycle budget not exceeded by approval: cycle.allocated_cents + proposed_amount_cents <= cycle.budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST .../adjustments/{id}/approve"

  - priority: 22
    category: business_fiscal
    check: "proposed_amount_cents > 0 and <= 15% of employee's current base salary"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST .../adjustments, POST .../adjustments/{id}/submit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Org / bootstrap ---
  - method: POST
    path: "/orgs"
    description: "Create an Organization"
    roles: [VendorAdmin]
    code: 201
    input: [name, base_currency, "fiscal_year_start_month?", market_as_of_date]
    output: Organization
    side_effects: []

  - method: GET
    path: "/orgs/{id}"
    description: "Get an Organization"
    roles: [CompAnalyst, CompManager, CompCommitteeReviewer, HRDirector, VendorAdmin]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: GET
    path: "/orgs"
    description: "List Organizations (supports filtering by strategy_policy_id)"
    roles: [CompAnalyst, CompManager, CompCommitteeReviewer, HRDirector, VendorAdmin]
    code: 200
    input: ["strategy_policy_id?"]
    output: "Organization[]"
    side_effects: []

  # --- Strategy policies ---
  - method: POST
    path: "/orgs/{id}/strategies"
    description: "Create a MarketStrategyPolicy (status=DRAFT) under an org"
    roles: [CompManager]
    code: 201
    input: [name, target_percentile, geo_differential_policy, industry_cut, effective_from, effective_to]
    output: MarketStrategyPolicy
    side_effects: []

  - method: GET
    path: "/strategies/{id}"
    description: "Get a MarketStrategyPolicy"
    roles: [CompAnalyst, CompManager, CompCommitteeReviewer, HRDirector, VendorAdmin]
    code: 200
    input: []
    output: MarketStrategyPolicy
    side_effects: []

  - method: GET
    path: "/strategies"
    description: "List MarketStrategyPolicies (filtered)"
    roles: [CompAnalyst, CompManager, CompCommitteeReviewer, HRDirector, VendorAdmin]
    code: 200
    input: ["org_id?", "status?"]
    output: "MarketStrategyPolicy[]"
    side_effects: []

  - method: GET
    path: "/orgs/{id}/strategies"
    description: "List Strategies under an Organization (sub-resource)"
    roles: [CompAnalyst, CompManager, CompCommitteeReviewer, HRDirector, VendorAdmin]
    code: 200
    input: []
    output: "MarketStrategyPolicy[]"
    side_effects: []

  - method: POST
    path: "/strategies/{id}/activate"
    description: "Activate a DRAFT strategy"
    roles: [CompManager]
    code: 200
    input: []
    output: MarketStrategyPolicy
    side_effects:
      - "status → ACTIVE"
      - "Organization.strategy_policy_id = this strategy id"
      - "Organization.version += 1"

  - method: POST
    path: "/strategies/{id}/retire"
    description: "Retire an ACTIVE strategy"
    roles: [CompManager]
    code: 200
    input: []
    output: MarketStrategyPolicy
    side_effects:
      - "status → RETIRED"
      - "If Organization.strategy_policy_id == this id: set to null"

  # --- Jobs ---
  - method: POST
    path: "/orgs/{id}/jobs"
    description: "Create a Job under an org"
    roles: [CompManager]
    code: 201
    input: [job_code, title, job_family, career_level, flsa_status]
    output: Job
    side_effects: []

  - method: GET
    path: "/jobs/{id}"
    description: "Get a Job"
    roles: [CompAnalyst, CompManager, CompCommitteeReviewer, HRDirector, VendorAdmin]
    code: 200
    input: []
    output: Job
    side_effects: []

  - method: GET
    path: "/jobs"
    description: "List Jobs (filtered)"
    roles: [CompAnalyst, CompManager, CompCommitteeReviewer, HRDirector, VendorAdmin]
    code: 200
