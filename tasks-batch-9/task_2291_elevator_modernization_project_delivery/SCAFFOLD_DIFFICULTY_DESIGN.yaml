  - rule_id: transitive_cascade
    instances:
      - name: scope_rescind_unwinds_procurement_staging_posture_and_outage
        grounds:
          - state_machines.ScopeOption.APPROVED_to_SUPERSEDED
          - state_machines.ProcurementOrder.STAGED_to_CANCELLED
          - state_machines.StagingReservation.HELD_to_RELEASED
          - state_machines.ElevatorCar.work_status.PROCURING_to_SCOPED
          - state_machines.OutageWindow.PLANNED_to_CANCELLED
          - calculations.project_downtime_posture
        distinguishing_aspect: |
          Depth 6 from a single scope rescind: option SUPERSEDED and the project ledger decremented
          (1) causes its live procurement orders to CANCEL (2), which causes their HELD staging
          reservations to RELEASE and staging_committed_sqft to fall (3), which causes the posture
          to recompute RESTRICTED -> OPEN (4), which coexists with the car dropping PROCURING ->
          SCOPED and compliance_status -> NOT_EVALUATED (5), which causes the car's PLANNED outage
          windows to CANCEL (6). Trigger is POST /scope-options/{id}/rescind, an operator
          withdrawal.
