    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: ["category_plan_id?", "status?", "limit?", "offset?"]
    output: ReforecastCycle[]
    side_effects: []
  - method: POST
    path: "/otb/reforecast-cycles/{id}/close"
    description: "close a cycle once no proposed decision remains; accepted from DECIDED and from OPEN (the empty-cycle escape), rejected with ERR_OPEN_DECISIONS_REMAIN while any decision is still PROPOSED"
    roles: [PlanningDirector]
    code: 200
    input: []
    output: ReforecastCycle
    side_effects:
      - "cycle.status := CLOSED"
      - "increments ReforecastCycle.version by 1"
  - method: POST
    path: "/otb/chase-cancel-decisions"
    description: "propose a chase, cancel or hold decision inside an open reforecast cycle; records the proposer's X-User-ID"
    roles: [MerchandisePlanner, CategoryBuyer]
    code: 201
    input: [reforecast_cycle_id, assortment_item_id, action, requested_units, rationale]
    output: ChaseCancelDecision
    side_effects:
      - "decision created with status PROPOSED, approved_units null, proposed_by_user_id := X-User-ID"
      - "a DECIDED parent cycle reopens to OPEN and increments ReforecastCycle.version by 1"
  - method: GET
    path: "/otb/chase-cancel-decisions/{id}"
    description: "read one chase/cancel decision including its allocated units"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: []
    output: ChaseCancelDecision
    side_effects: []
  - method: GET
    path: "/otb/chase-cancel-decisions"
    description: "list chase/cancel decisions filtered by cycle, item, action or status"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: ["reforecast_cycle_id?", "assortment_item_id?", "action?", "status?", "limit?", "offset?"]
    output: ChaseCancelDecision[]
    side_effects: []
  - method: POST
    path: "/otb/chase-cancel-decisions/{id}/approve"
    description: "approve a proposed decision; runs the chase/cancel waterfall and writes approved_units"
    roles: [PlanningDirector]
    code: 200
    input: ["decision_note?"]
    output: ChaseCancelDecision
    side_effects:
      - "decision.status := APPROVED and approved_units := calculations.chase_cancel_allocation"
      - "CHASE creates COMMITTED commitments per funded month and moves the item IN_SEASON -> CHASED; CANCEL reduces existing commitments and moves the item IN_SEASON -> CANCELLED_IN_SEASON; HOLD writes approved_units 0"
      - "touched PlanMonth rows and the CategoryPlan have their OTB, posture and version fields recomputed"
      - "the parent cycle bubbles OPEN -> DECIDED when no PROPOSED decision remains"
  - method: POST
    path: "/otb/chase-cancel-decisions/{id}/reject"
    description: "reject a proposed decision without touching any month or item"
    roles: [PlanningDirector]
    code: 200
    input: ["decision_note?"]
    output: ChaseCancelDecision
    side_effects:
      - "decision.status := REJECTED and approved_units := 0"
      - "the parent cycle bubbles OPEN -> DECIDED when no PROPOSED decision remains"
      - "increments ChaseCancelDecision.version by 1"
  - method: POST
    path: "/otb/localization-overlays"
    description: "author a localization overlay in DRAFT for one (plan, cluster) pair and one localization dimension"
    roles: [MerchandisePlanner]
    code: 201
    input: [category_plan_id, store_cluster_id, overlay_type, effective_start, effective_end, unit_multiplier_bps]
    output: LocalizationOverlay
    side_effects: ["overlay.status initialised to DRAFT"]
  - method: GET
    path: "/otb/localization-overlays/{id}"
    description: "read one localization overlay"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: []
    output: LocalizationOverlay
    side_effects: []
  - method: GET
    path: "/otb/localization-overlays"
    description: "list localization overlays filtered by plan, cluster, type or status"
    roles: [MerchOpsAdmin, MerchandisePlanner, PlanningDirector, CategoryBuyer]
    code: 200
    input: ["category_plan_id?", "store_cluster_id?", "overlay_type?", "status?", "limit?", "offset?"]
    output: LocalizationOverlay[]
    side_effects: []
  - method: POST
    path: "/otb/localization-overlays/{id}/activate"
    description: "activate a DRAFT overlay and re-resolve the effective multiplier and sell-through of every adopted item in the cluster"
    roles: [PlanningDirector]
    code: 200
    input: []
    output: LocalizationOverlay
    side_effects:
      - "overlay.status := ACTIVE"
      - "affected AssortmentItem rows get effective_overlay_multiplier_bps and sell_through_bps recomputed"
      - "increments LocalizationOverlay.version by 1 and AssortmentItem.version by 1 per affected item"
  - method: POST
    path: "/otb/_clock/set_current_utc"
    description: "test-driving endpoint that sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Setting the clock expires any ACTIVE overlay whose effective_end is now in the past."
    roles: [MerchOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_overlay_count: integer }
    side_effects:
      - "logical clock := to_iso8601"
      - "every ACTIVE LocalizationOverlay whose effective_end < the new clock reading transitions ACTIVE -> EXPIRED and the affected items' multipliers and sell-through forecasts are recomputed"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # -- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, empty, or X-User-Role is not one of the five declared role names"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "the caller's X-User-Role is a declared role but is not listed in the target endpoint's roles"
  - id: ERR_NOT_COMMITMENT_VENDOR
    http: 403
    condition: "a VendorRep calls /ship or /receipts on a ReceiptCommitment whose vendor_id does not equal the caller's X-User-ID"
  # -- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, has the wrong JSON type, violates a declared numeric range or length bound, carries an unknown enum value, or an ISO-8601 field is unparseable"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is not an integer in 1..100 or offset is not an integer >= 0 on any list endpoint"
  # -- existence -----------------------------------------------------------
  - id: ERR_DEPARTMENT_NOT_FOUND
    http: 404
    condition: "the addressed Department id, or a department_id referenced in a payload or filter, matches no Department"
  - id: ERR_CATEGORY_NOT_FOUND
    http: 404
    condition: "the addressed Category id, or a category_id referenced in a payload or filter, matches no Category"
  - id: ERR_STORE_CLUSTER_NOT_FOUND
    http: 404
    condition: "the addressed StoreCluster id, or a store_cluster_id referenced in a payload or filter, matches no StoreCluster"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "the addressed Vendor id, or a vendor_id referenced in a payload or filter, matches no Vendor"
  - id: ERR_VENDOR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "the addressed VendorAuthorization id matches no VendorAuthorization"
  - id: ERR_CATEGORY_PLAN_NOT_FOUND
    http: 404
    condition: "the addressed CategoryPlan id, or a category_plan_id referenced in a payload or filter, matches no CategoryPlan"
  - id: ERR_PLAN_MONTH_NOT_FOUND
    http: 404
    condition: "the addressed PlanMonth id, or a plan_month_id referenced in a payload or filter, matches no PlanMonth"
  - id: ERR_OPTION_PLAN_NOT_FOUND
    http: 404
    condition: "the addressed OptionPlan id, or an option_plan_id referenced in a payload or filter, matches no OptionPlan"
  - id: ERR_ASSORTMENT_ITEM_NOT_FOUND
    http: 404
    condition: "the addressed AssortmentItem id, or an assortment_item_id referenced in a payload or filter, matches no AssortmentItem"
  - id: ERR_RECEIPT_COMMITMENT_NOT_FOUND
    http: 404
    condition: "the addressed ReceiptCommitment id matches no ReceiptCommitment"
  - id: ERR_REFORECAST_CYCLE_NOT_FOUND
    http: 404
    condition: "the addressed ReforecastCycle id, or a reforecast_cycle_id referenced in a payload or filter, matches no ReforecastCycle"
  - id: ERR_CHASE_CANCEL_DECISION_NOT_FOUND
    http: 404
    condition: "the addressed ChaseCancelDecision id matches no ChaseCancelDecision"
  - id: ERR_LOCALIZATION_OVERLAY_NOT_FOUND
    http: 404
    condition: "the addressed LocalizationOverlay id matches no LocalizationOverlay"
  # -- segregation of duties ------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID equals the recorded originator of the step being approved: approving a CategoryPlan whose submitted_by_user_id is the caller, or approving a ChaseCancelDecision whose proposed_by_user_id is the caller"
  # -- state ---------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared for the entity's current state in §1.2 (including any trigger fired on a terminal state, and any repeat of an already-applied trigger)"
  - id: ERR_PLAN_MONTH_NOT_OPEN
    http: 409
    condition: "a receipt commitment or actuals post targets a PlanMonth whose status is not the one that operation requires (LOCKED_PLAN or IN_SEASON for commitments, IN_SEASON for actuals posts)"
  - id: ERR_OPTION_PLAN_NOT_SLOTTED
    http: 409
    condition: "an AssortmentItem is adopted while its parent OptionPlan.status is not SLOTTED"
  - id: ERR_CATEGORY_PLAN_NOT_APPROVED
    http: 409
    condition: "a PlanMonth is opened for season, or a reforecast cycle is requested, while the parent CategoryPlan.status is not APPROVED"
  - id: ERR_VENDOR_NOT_AUTHORIZED
    http: 409
    condition: "a receipt commitment is committed while the Vendor.status is PENDING or SUSPENDED rather than AUTHORIZED"
  - id: ERR_OPEN_DECISIONS_REMAIN
    http: 409
    condition: "a ReforecastCycle close is attempted while at least one child ChaseCancelDecision is still PROPOSED"
  # -- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_PLAN_MONTH_VERSION
    http: 412
    condition: "expected_plan_month_version on POST /otb/receipt-commitments does not equal the current PlanMonth.version"
  - id: ERR_STALE_CATEGORY_PLAN_VERSION
    http: 412
    condition: "expected_category_plan_version on POST /otb/category-plans/{id}/reforecasts does not equal the current CategoryPlan.version"
  # -- business safety ------------------------------------------------------
  - id: ERR_OTB_POSTURE_FROZEN
    http: 409
    condition: "a buyer-originated receipt commitment is created or committed while the governing CategoryPlan.otb_posture is FROZEN"
  - id: ERR_POSTURE_RESTRICTED_NEW_ITEM
    http: 409
    condition: "an AssortmentItem with lifecycle_stage NEW is adopted while the governing CategoryPlan.otb_posture is RESTRICTED"
  - id: ERR_REFORECAST_ROUND_LIMIT
    http: 409
    condition: "a reforecast cycle is requested when CategoryPlan.reforecast_round has already reached the cap of 3"
  # -- business referential -------------------------------------------------
  - id: ERR_VENDOR_NOT_AUTHORIZED_FOR_CATEGORY
    http: 422
    condition: "no ACTIVE VendorAuthorization joins the commitment's vendor to the category of the plan that owns the target month"
  - id: ERR_PLAN_SCOPE_MISMATCH
    http: 422
    condition: "two referenced rows do not belong to the same CategoryPlan (item's option plan vs target month, decision's item vs cycle's plan, overlay's cluster vs plan's option plans)"
  - id: ERR_CLUSTER_NOT_IN_PLAN
    http: 422
    condition: "a localization overlay names a StoreCluster for which the CategoryPlan has no OptionPlan row"
  # -- business constraint --------------------------------------------------
  - id: ERR_DUPLICATE_CATEGORY_PLAN
    http: 409
    condition: "a CategoryPlan already exists for the same (category_id, season_code, fiscal_year)"
  - id: ERR_DUPLICATE_PLAN_MONTH
    http: 409
    condition: "a PlanMonth already exists for the same (category_plan_id, month_index)"
  - id: ERR_DUPLICATE_OPTION_PLAN
    http: 409
    condition: "an OptionPlan already exists for the same (category_plan_id, store_cluster_id, tier)"
  - id: ERR_DUPLICATE_ACTUALS_WEEK
    http: 409
    condition: "an ActualsPost already exists for the same (plan_month_id, week_index)"
  - id: ERR_SIZE_CURVE_EMPTY
    http: 422
    condition: "a size-curve replacement submits zero cells"
  - id: ERR_SIZE_CURVE_NOT_BALANCED
    http: 422
    condition: "the submitted size-curve pct_bps values do not sum to exactly 10000, or size_label / size_sort_order repeats within the submitted set"
  - id: ERR_SIZE_CURVE_ZERO_CELL
    http: 422
    condition: "a submitted size-curve cell rounds to zero allocated units at the cell's target depth, i.e. its share is too thin to stock"
  - id: ERR_NO_OPTION_SLOT
    http: 409
    condition: "an AssortmentItem is adopted when its OptionPlan.option_slots_open is already 0"
  - id: ERR_BELOW_VENDOR_MINIMUM
    http: 422
    condition: "the commitment's units are below the vendor's min_order_units, or a chase allocation would fund fewer units than that minimum"
  - id: ERR_VENDOR_CAPACITY_EXCEEDED
    http: 409
    condition: "the aggregate open units of every PROPOSED or COMMITTED commitment whose ship window overlaps the candidate's, plus the candidate's units, exceed Vendor.weekly_unit_capacity; or the vendor's open units for the category plus the candidate's exceed VendorAuthorization.max_open_units"
  - id: ERR_OVERLAY_WINDOW_CONFLICT
    http: 409
    condition: "the overlay's closed window, expanded by the mandatory 7-day separation buffer on each side, touches or overlaps another DRAFT or ACTIVE overlay of the same overlay_type on the same StoreCluster"
  # -- business temporal ----------------------------------------------------
  - id: ERR_SHIP_WINDOW_INVERTED
    http: 422
    condition: "ship_window_end is earlier than or equal to ship_window_start on a receipt commitment (the window is half-open, so a zero-length window is rejected)"
  - id: ERR_OVERLAY_WINDOW_INVERTED
    http: 422
    condition: "effective_end is earlier than effective_start on a localization overlay (the window is closed, so a single-day window is accepted)"
  - id: ERR_LEAD_TIME_INFEASIBLE
    http: 422
    condition: "ship_window_start is earlier than the logical clock plus the vendor's lead_time_days"
  - id: ERR_CANCEL_CUTOFF_PASSED
    http: 409
    condition: "a COMMITTED commitment is cancelled fewer than the vendor's cancel_cutoff_days before its ship_window_start"
  # -- business fiscal ------------------------------------------------------
  - id: ERR_OTB_EXCEEDED
    http: 422
    condition: "the commitment's cost at cost exceeds PlanMonth.otb_open_cents by one cent or more"
  - id: ERR_RECEIPT_BUDGET_ZERO
    http: 422
    condition: "the approval of a CategoryPlan resolves calculations.plan_receipt_budget to zero, leaving no receipt dollars to distribute"
  - id: ERR_NO_FEASIBLE_RECEIPT_MONTH
    http: 422
    condition: "an approved CHASE decision finds no PlanMonth inside the chase window with any open-to-buy left to fund"
  - id: ERR_RECEIPT_OVER_COMMITMENT
    http: 422
    condition: "received_units_delta would push a commitment's received_units above its committed units"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: MerchOpsAdmin
    description: "merchandise systems operator: maintains the reference spine (departments, categories, store clusters, vendors, vendor authorizations), posts weekly actuals, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /otb/departments"
      - "POST /otb/categories"
      - "POST /otb/store-clusters"
      - "POST /otb/vendors"
      - "POST /otb/vendors/{id}/status"
      - "POST /otb/vendor-authorizations"
      - "POST /otb/actuals-posts"
      - "POST /otb/_clock/set_current_utc"
    shared_operations:
      - "every GET in the API"
  - name: MerchandisePlanner
    description: "builds category plans, months, option plans and size curves, authors localization overlays, requests reforecast cycles and proposes chase/cancel decisions; may never approve its own work"
    identity: "opaque"
    exclusive_operations:
      - "POST /otb/category-plans"
      - "POST /otb/category-plans/{id}/submit"
      - "POST /otb/plan-months"
      - "POST /otb/option-plans"
      - "PUT /otb/option-plans/{id}/size-curve"
      - "POST /otb/category-plans/{id}/reforecasts"
      - "POST /otb/localization-overlays"
      - "POST /otb/plan-months/{id}/open-season"
    shared_operations:
      - "POST /otb/assortment-items"
      - "POST /otb/chase-cancel-decisions"
      - "every GET in the API"
  - name: PlanningDirector
    description: "financial gatekeeper: approves or rejects plans, closes plans, activates overlays, adjudicates chase/cancel decisions and closes reforecast cycles"
    identity: "opaque"
    exclusive_operations:
      - "POST /otb/category-plans/{id}/approve"
      - "POST /otb/category-plans/{id}/reject"
      - "POST /otb/category-plans/{id}/close"
      - "POST /otb/chase-cancel-decisions/{id}/approve"
      - "POST /otb/chase-cancel-decisions/{id}/reject"
      - "POST /otb/reforecast-cycles/{id}/close"
      - "POST /otb/localization-overlays/{id}/activate"
    shared_operations:
      - "every GET in the API"
  - name: CategoryBuyer
    description: "spends the open-to-buy: adopts, activates and closes assortment items and creates, commits and cancels receipt commitments"
    identity: "opaque"
    exclusive_operations:
      - "POST /otb/assortment-items/{id}/adopt"
      - "POST /otb/assortment-items/{id}/activate"
      - "POST /otb/assortment-items/{id}/close"
      - "POST /otb/receipt-commitments"
      - "POST /otb/receipt-commitments/{id}/commit"
      - "POST /otb/receipt-commitments/{id}/cancel"
    shared_operations:
      - "POST /otb/assortment-items"
      - "POST /otb/chase-cancel-decisions"
      - "every GET in the API"
  - name: VendorRep
    description: "supplier-side actor; X-User-ID is the id of the Vendor row it represents and it may only touch commitments placed with that vendor"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /otb/receipt-commitments/{id}/ship"
      - "POST /otb/receipt-commitments/{id}/receipts"
    shared_operations:
      - "GET /otb/receipt-commitments"
      - "GET /otb/receipt-commitments/{id}"
