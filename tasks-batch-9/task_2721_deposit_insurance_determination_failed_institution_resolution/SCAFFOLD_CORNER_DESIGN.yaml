          - complexity_profile.role_model
        excluded_because:
          difficulty_instance: certify_state_error_outranks_segregation_of_duties
          rationale: "§1.8 already drives the same-user certify: after the state gate is satisfied, the ClaimsCertifier acting under the preparer's X-User-ID receives ERR_SEGREGATION_OF_DUTIES_VIOLATION and a distinct certifier id then succeeds, which is the whole content of this RBAC row."

  - section: cross_cutting_complexity_layers
    coverage_note: |
      complexity_profile.complexity_layers declares optimistic_concurrency,
      cascading_side_effects, dual_variant_calculation and rate_threshold_triggers.
      Both §1.2.1 concurrency rules get their own stale-version instance here (which is what
      makes ERR_STALE_DEPOSITOR_VERSION and ERR_STALE_INSTITUTION_VERSION triggerable), plus a
      version-monotonicity instance and the threshold-reset instance; the cascade and
      dual-variant rows are already driven end-to-end by §1.8 and are stubbed.
    instances:
      - name: occ_stale_depositor_version_blocks_the_determination_create_and_outranks_the_uniqueness_check
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[determination-create-stale-depositor]
          - validations[priority=30]
          - errors[ERR_STALE_DEPOSITOR_VERSION]
        distinguishing_aspect: "The guard is an exact equality against DepositorRecord.version at the moment of the write, so one-behind is ERR_STALE_DEPOSITOR_VERSION (412) and the freshly read value succeeds; because prepare writes DepositorRecord.attributed_total_cents the same captured version goes stale mid-workflow, and replaying it then still yields 412 rather than the priority-47 ERR_ACTIVE_DETERMINATION_EXISTS."
        test_recipe:
          setup:
            - "Institution 61084 is CLOSED_IN_RECEIVERSHIP with depositor Yara holding one SINGLE account of 8000000 (fully insured)."
            - "no determination exists yet; the depositor's current version was read once and captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61084", legal_name: "Depositor OCC Bank", charter_state: "MS", book_asset_value_cents: 11000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { do_inst_id: $.data.id }
            - call: "POST /institutions/${do_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-DO-1", legal_name: "Yara Haddad", depositor_type: "NATURAL_PERSON", contact_email: "yara@example.com" }
              as: ClaimsAgent
              captures: { do_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${do_inst_id}", primary_depositor_id: "${do_dep_id}", account_number: "DO-0001", ownership_category: "SINGLE", balance_cents: 8000000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${do_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 8000000 }
              as: ClosingManager
              captures: { do_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${do_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${do_inst_id}/close"
              as: ClosingManager
            - call: "GET /depositor-records/${do_dep_id}"
              as: ClaimsAgent
              captures: { do_dep_ver: $.data.version }
          trigger:
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${do_dep_id}", expected_depositor_record_version: "${do_dep_ver} - 1" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AC"
              captures: { do_err1: $.data.error_id }
            - call: "GET /insurance-determinations"
              payload: { depositor_record_id: "${do_dep_id}" }
              as: ClaimsAgent
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${do_dep_id}", expected_depositor_record_version: "${do_dep_ver}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AC"
              captures: { do_det_id: $.data.id }
            - call: "POST /insurance-determinations/${do_det_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AC"
            - call: "GET /depositor-records/${do_dep_id}"
              as: ClaimsAgent
              captures: { do_dep_ver2: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${do_dep_id}", expected_depositor_record_version: "${do_dep_ver}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AC"
              captures: { do_err2: $.data.error_id }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${do_dep_id}", expected_depositor_record_version: "${do_dep_ver2}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AC"
              captures: { do_err3: $.data.error_id }
          assert:
            - "trigger[0]: HTTP 412, data.error_id == 'ERR_STALE_DEPOSITOR_VERSION'"
            - "trigger[1]: 0 rows, total_count == 0 — the refused create wrote nothing"
            - "trigger[2]: HTTP 201, status == 'DRAFT' — the freshly read version is accepted"
            - "trigger[3]: HTTP 200, status == 'PREPARED', insured_amount_cents == 8000000"
            - "trigger[4]: version > '${do_dep_ver}' — prepare wrote attributed_total_cents on the depositor, so the captured version is now stale"
            - "trigger[5]: HTTP 412, data.error_id == 'ERR_STALE_DEPOSITOR_VERSION' — the priority-30 OCC check outranks the priority-47 uniqueness check"
            - "trigger[6]: HTTP 409, data.error_id == 'ERR_ACTIVE_DETERMINATION_EXISTS' — with a current version the uniqueness check is finally the one that fires"

      - name: occ_stale_institution_version_blocks_the_dividend_declaration_after_any_intervening_write
