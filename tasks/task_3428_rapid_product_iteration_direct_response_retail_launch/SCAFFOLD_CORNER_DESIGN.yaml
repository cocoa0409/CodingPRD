# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3428_rapid_product_iteration_direct_response_retail_launch
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Claims already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Anchors (&c_*) are local to this file; each instance runs on a fresh DB.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: season_create_returns_declared_fields_and_open_posture
        claim_type: Creation
        grounds: [entities.LaunchSeason, endpoints.POST_/launch-seasons]
        distinguishing_aspect: "A season created with only season_code comes back 201 with posture SEASON_OPEN, review_index 0, penalty_accrual_cents 0, version 1, and system-minted id/created_at/updated_at — posture is never client-supplied."
        test_recipe:
          setup: ["Logical clock at the startup default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &c_clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_season
              call: "POST /launch-seasons"
              payload: { season_code: "FW26" }
              as: PlatformAdmin
              captures: { season_id: $.data.id, posture: $.data.posture, ridx: $.data.review_index, ver: $.data.version, pen: $.data.penalty_accrual_cents }
          assert:
            - "response status is 201 and response_type is object"
            - "posture == SEASON_OPEN and ridx == 0 and pen == 0 and ver == 1"
            - "LaunchSeason.${season_id} carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: category_get_round_trips_computed_fields
        claim_type: Retrieval
        grounds: [entities.Category, "endpoints.GET_/categories/{id}"]
        distinguishing_aspect: "A category created with crowding_base 6 round-trips through GET with exposure_index 6, exposure_level CLEAR, active_reserve_cents 0 — the computed fields are initialized from inputs at creation."
        test_recipe:
          setup: ["Season FW26 exists."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - &c_cat
              call: "POST /categories"
              payload: { season_id: "${season_id}", name: "Cordless Vacuums", crowding_base: 6 }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
          trigger:
            - call: "GET /categories/${cat_id}"
              payload: {}
              as: ProductLead
              captures: { ei: $.data.exposure_index, el: $.data.exposure_level, res: $.data.active_reserve_cents, cb: $.data.crowding_base }
          assert:
            - "response status is 200"
            - "cb == 6 and ei == 6 and el == CLEAR and res == 0"

      - name: variants_list_paginates_and_reports_envelope_fields
        claim_type: Listing
        grounds: [endpoints.GET_/model-variants, response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "With three variants on one concept, GET /model-variants?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup: ["Concept ENGINEERING_LOCKED with three DRAFT variants (CV100-AMZ, CV200-BBX, CV300-CLB)."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - &c_concept
              call: "POST /concepts"
              payload: { category_id: "${cat_id}", title: "Faster pet-hair pickup" }
              as: ProductLead
              captures: { concept_id: $.data.id }
            - &c_ins_a
              call: "POST /concepts/${concept_id}/insights"
              payload: { points: 40, observed_at: "2026-09-01T00:00:00Z" }
              as: ProductLead
            - &c_ins_b
              call: "POST /concepts/${concept_id}/insights"
              payload: { points: 16, observed_at: "2026-09-08T00:00:00Z" }
              as: ProductLead
            - &c_clock0910
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - &c_advance
              call: "POST /concepts/${concept_id}/advance"
              payload: {}
              as: ProductLead
            - *c_advance
            - *c_advance
            - &c_round
              call: "POST /concepts/${concept_id}/rounds"
              payload: {}
              as: ProductLead
              captures: { round_id: $.data.id }
            - &c_round_pass
              call: "POST /prototype-rounds/${round_id}/complete"
              payload: { score: 80 }
              as: ProductLead
            - *c_advance
            - &c_variant
              call: "POST /model-variants"
              payload: { concept_id: "${concept_id}", model_number: "CV100-AMZ", channel: "AMAZON" }
              as: ProductLead
              captures: { variant_id: $.data.id }
            - call: "POST /model-variants"
              payload: { concept_id: "${concept_id}", model_number: "CV200-BBX", channel: "BIG_BOX" }
              as: ProductLead
            - call: "POST /model-variants"
              payload: { concept_id: "${concept_id}", model_number: "CV300-CLB", channel: "CLUB" }
              as: ProductLead
          trigger:
            - call: "GET /model-variants"
              payload: { concept_id: "${concept_id}", limit: 2, offset: 0 }
              as: ProductLead
              captures: { page1_rows: $.data }
          assert:
            - "len(page1_rows) == 2 and total_count == 3 and has_more == true"
            - "a second GET with limit 2 offset 2 returns exactly 1 row with has_more false and total_count 3"

      - name: concept_get_unknown_id_returns_typed_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/concepts/{id}", "errors[ERR_CONCEPT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but absent concept UUID returns 404 with error_id ERR_CONCEPT_NOT_FOUND, not a generic 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clock0
          trigger:
            - call: "GET /concepts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProductLead
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404 and err == ERR_CONCEPT_NOT_FOUND"

      - name: study_create_missing_claim_text_rejected
        claim_type: Required Fields
        grounds: [entities.ClaimStudy.fields.claim_text, endpoints.POST_/claim-studies, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /claim-studies without claim_text fails 400 ERR_INVALID_REQUEST even when variant_id is valid and TOOLED."
        test_recipe:
          setup: ["Variant CV100-AMZ TOOLED."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
            - &c_partner
              call: "POST /factory-partners"
              payload: { name: "Shenzhen Precision", capacity_units_total: 500 }
              as: SourcingManager
              captures: { partner_id: $.data.id }
            - *c_variant
            - &c_tool
              call: "POST /model-variants/${variant_id}/tool"
              payload: { factory_partner_id: "${partner_id}" }
              as: SourcingManager
          trigger:
            - call: "POST /claim-studies"
              payload: { variant_id: "${variant_id}" }
              as: ClaimsScientist
              captures: { err: $.data.error_id }
          assert:
            - "response status is 400 and err == ERR_INVALID_REQUEST"

      - name: partner_create_defaults_status_active_and_zero_allocation
        claim_type: Defaults
        grounds: [entities.FactoryPartner.fields.status, entities.FactoryPartner.fields.allocated_units]
        distinguishing_aspect: "POST /factory-partners without status/allocated_units yields status ACTIVE and allocated_units 0 — both are system/computed fields with declared defaults."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clock0
          trigger:
            - *c_partner
          assert:
            - "FactoryPartner.${partner_id}.status == ACTIVE and allocated_units == 0 and version == 1"

      - name: category_computed_fields_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Category.fields.exposure_index, entities.Category.fields.exposure_level]
        distinguishing_aspect: "Posting exposure_index 999 and exposure_level SEVERE on create is ignored: the stored category computes exposure_index 6 from crowding_base and bands CLEAR."
        test_recipe:
          setup: ["Season FW26 exists."]
          setup_api_calls:
            - *c_clock0
            - *c_season
          trigger:
            - call: "POST /categories"
              payload: { season_id: "${season_id}", name: "Air Fryers", crowding_base: 6, exposure_index: 999, exposure_level: "SEVERE" }
              as: PlatformAdmin
              captures: { ei: $.data.exposure_index, el: $.data.exposure_level }
          assert:
            - "ei == 6 and el == CLEAR (client-supplied computed fields are discarded)"
            - "the owning season's posture remains SEASON_OPEN"

      - name: variant_create_client_input_ignored
        claim_type: System Fields
        grounds: [entities.ModelVariant, common_fields]
        distinguishing_aspect: "Posting id, created_at, or lifecycle on variant create is ignored: the server mints id, stamps created_at from the logical clock, and initializes lifecycle DRAFT."
        test_recipe:
          setup: ["Concept ENGINEERING_LOCKED."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
          trigger:
            - call: "POST /model-variants"
              payload: { concept_id: "${concept_id}", model_number: "CV900-DTC", channel: "DTC", id: "11111111-2222-3333-4444-555555555555", lifecycle: "RETIRED" }
              as: ProductLead
              captures: { vid: $.data.id, lc: $.data.lifecycle, ts: $.data.created_at }
          assert:
            - "vid != '11111111-2222-3333-4444-555555555555' (server-minted)"
            - "lc == DRAFT (client-sent RETIRED ignored)"
            - "ts == '2026-09-10T00:00:00Z' (stamped from the logical clock, not wall clock)"

      - name: invalid_enum_and_range_values_rejected
        claim_type: Type Constraints
        grounds: [entities.PatentCase.fields.severity, entities.PrototypeRound.fields.score, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "severity outside LOW|MED|HIGH and score 101 outside 0..100 both fail 400 ERR_INVALID_REQUEST at the write that carries them."
        test_recipe:
          setup: ["Season FW26 with category (base 6); concept in PROTOTYPE_CYCLING with an OPEN round."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
          trigger:
            - call: "POST /patent-cases"
              payload: { category_id: "${cat_id}", case_number: "PT-9001", claim_cents: 500000, severity: "CRITICAL" }
              as: LegalCounsel
              captures: { err1: $.data.error_id }
            - call: "POST /prototype-rounds/${round_id}/complete"
              payload: { score: 101 }
              as: ProductLead
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_REQUEST (enum violation)"
            - "err2 == ERR_INVALID_REQUEST (range violation) and the round remains OPEN"

      - name: commitment_with_unknown_agreement_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.LaunchCommitment.fields.agreement_id, "errors[ERR_AGREEMENT_NOT_FOUND]"]
        distinguishing_aspect: "A commitment body referencing a non-existent agreement_id fails 404 ERR_AGREEMENT_NOT_FOUND at the existence priority before any business rule runs."
        test_recipe:
          setup: ["Season FW26 with a category and one real DRAFT agreement (its version captured only to source a well-formed OCC field; the commitment then references a BOGUS agreement id)."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - call: "POST /retail-agreements"
              payload: { category_id: "${cat_id}", retailer_name: "BigBoxCo", exclusive: false, window_start: "2026-10-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", min_launch_units: 100 }
              as: RetailExec
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /launch-commitments"
              payload: { agreement_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", variant_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", committed_units: 10, need_by_date: "2026-10-15T00:00:00Z", expected_agreement_version: "${agr_v}" }
              as: SourcingManager
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404 and err == ERR_AGREEMENT_NOT_FOUND (body FKs validate left-to-right after path ids; existence at priority 3 precedes the OCC check at priority 6)"

      - name: variant_duplicate_model_number_rejected
        claim_type: Type Constraints
        grounds: [entities.ModelVariant.fields.model_number, "errors[ERR_MODEL_NUMBER_CONFLICT]"]
        distinguishing_aspect: "model_number is globally unique across channels — reusing CV100-AMZ on a different concept and channel still fails 409 ERR_MODEL_NUMBER_CONFLICT (price-comparison-limiting differentiation forbids reuse)."
        test_recipe:
          setup: ["Concept ENGINEERING_LOCKED with variant CV100-AMZ; second concept also ENGINEERING_LOCKED."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
            - *c_variant
            - call: "POST /concepts"
              payload: { category_id: "${cat_id}", title: "Quieter motor" }
              as: ProductLead
              captures: { concept2_id: $.data.id }
            - call: "POST /concepts/${concept2_id}/insights"
              payload: { points: 40, observed_at: "2026-09-01T00:00:00Z" }
              as: ProductLead
            - call: "POST /concepts/${concept2_id}/insights"
              payload: { points: 16, observed_at: "2026-09-08T00:00:00Z" }
              as: ProductLead
            - call: "POST /concepts/${concept2_id}/advance"
              payload: {}
              as: ProductLead
            - call: "POST /concepts/${concept2_id}/advance"
              payload: {}
              as: ProductLead
            - call: "POST /concepts/${concept2_id}/advance"
              payload: {}
              as: ProductLead
            - call: "POST /concepts/${concept2_id}/rounds"
              payload: {}
              as: ProductLead
              captures: { round2_id: $.data.id }
            - call: "POST /prototype-rounds/${round2_id}/complete"
              payload: { score: 90 }
              as: ProductLead
            - call: "POST /concepts/${concept2_id}/advance"
              payload: {}
              as: ProductLead
          trigger:
            - call: "POST /model-variants"
              payload: { concept_id: "${concept2_id}", model_number: "CV100-AMZ", channel: "CLUB" }
              as: ProductLead
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 and err == ERR_MODEL_NUMBER_CONFLICT"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: round_complete_records_score_and_consumes_budget
        claim_type: Valid Transition
        grounds:
          - state_machines.PrototypeRound.OPEN_to_SCORED
          - entities.ProductConcept.fields.rounds_used
        distinguishing_aspect: "Completing an OPEN round with a passing score stores the score, flips SCORED, and increments the concept's rounds_used to 1 without reverting (revert only fires on failure at budget exhaustion)."
        test_recipe:
          setup: ["Concept in PROTOTYPE_CYCLING with round 1 OPEN."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
          trigger:
            - *c_round_pass
            - call: "GET /concepts/${concept_id}"
              payload: {}
              as: ProductLead
              captures: { c_status: $.data.status, c_rounds: $.data.rounds_used }
          assert:
            - "round status == SCORED and score == 80 (from the complete response)"
            - "c_status == PROTOTYPE_CYCLING and c_rounds == 1 (passing consumes budget but does not revert)"

      - name: round_complete_twice_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PrototypeRound.OPEN_to_SCORED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second complete on an already-SCORED round fails 409 ERR_INVALID_STATE — terminal states accept no further transitions."
        test_recipe:
          setup: ["Round 1 SCORED."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
          trigger:
            - call: "POST /prototype-rounds/${round_id}/complete"
              payload: { score: 10 }
              as: ProductLead
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 and err == ERR_INVALID_STATE"
            - "the round's stored score remains 80 (the rejected write changed nothing)"

      - name: media_air_from_decided_scale_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MediaTest
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Air on a DECIDED_SCALE media test fails ERR_INVALID_STATE — EDITING is the only valid source state."
        test_recipe:
          setup: ["Media test DECIDED_SCALE."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
            - *c_partner
            - *c_variant
            - *c_tool
            - &c_study
              call: "POST /claim-studies"
              payload: { variant_id: "${variant_id}", claim_text: "50% more suction than the leading competitor" }
              as: ClaimsScientist
              as_user_id: "sci-anna"
              captures: { study_id: $.data.id }
            - &c_complete
              call: "POST /claim-studies/${study_id}/complete"
              payload: { our_metric: 115, baseline_metric: 100, sample_size: 40 }
              as: ClaimsScientist
              as_user_id: "sci-anna"
            - &c_substantiate
              call: "POST /claim-studies/${study_id}/substantiate"
              payload: {}
              as: ClaimsScientist
              as_user_id: "sci-bob"
            - &c_media
              call: "POST /media-tests"
              payload: { variant_id: "${variant_id}", title: "Infomercial A", media_spend_cents: 1000 }
              as: MediaBuyer
              captures: { media_id: $.data.id }
            - &c_air
              call: "POST /media-tests/${media_id}/air"
              payload: { projected_gross_cents: 1500 }
              as: MediaBuyer
            - &c_decide_scale
              call: "POST /media-tests/${media_id}/decide"
              payload:
                decision: "SCALE"
                order_lines: [ { revenue_cents: 5000, cancels_cents: 0, returns_cents: 0 } ]
              as: MediaBuyer
          trigger:
            - call: "POST /media-tests/${media_id}/air"
              payload: { projected_gross_cents: 2000 }
              as: MediaBuyer
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 and err == ERR_INVALID_STATE"

      - name: retired_variant_rejects_tooling_and_replenishment
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ModelVariant.lifecycle
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A RETIRED variant rejects both a tool call (not DRAFT) and a replenishment create (not RETAIL_LIVE) with ERR_INVALID_STATE — terminal lifecycle is locked."
        test_recipe:
          setup: ["Variant RETIRED via the two-review refresh cadence (retail_live 2026-10-16; candidacy 2027-06-14; retired 2027-07-15)."]
          setup_api_calls:
            - *c_clock0
            - *c_season
            - *c_cat
            - *c_concept
            - *c_ins_a
            - *c_ins_b
            - *c_clock0910
            - *c_advance
            - *c_advance
            - *c_advance
            - *c_round
            - *c_round_pass
            - *c_advance
            - *c_partner
            - *c_variant
            - *c_tool
            - *c_study
            - *c_complete
            - *c_substantiate
            - *c_media
            - *c_air
            - *c_decide_scale
            - &c_agr_long
              call: "POST /retail-agreements"
              payload: { category_id: "${cat_id}", retailer_name: "BigBoxCo", exclusive: true, window_start: "2026-10-01T00:00:00Z", window_end: "2028-01-01T00:00:00Z", min_launch_units: 100 }
              as: RetailExec
              captures: { agr_id: $.data.id }
            - &c_sign
              call: "POST /retail-agreements/${agr_id}/sign"
              payload: {}
              as: RetailExec
              captures: { agr_v: $.data.version }
            - &c_commit_future
              call: "POST /launch-commitments"
              payload: { agreement_id: "${agr_id}", variant_id: "${variant_id}", committed_units: 300, need_by_date: "2027-08-01T00:00:00Z", expected_agreement_version: "${agr_v}" }
              as: SourcingManager
              captures: { commitment_id: $.data.id }
            - &c_clock1016
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - &c_review
              call: "POST /launch-seasons/${season_id}/run-review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-14T00:00:00Z" }
              as: PlatformAdmin
            - *c_review
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T00:00:00Z" }
              as: PlatformAdmin
            - *c_review
          trigger:
            - call: "POST /model-variants/${variant_id}/tool"
              payload: { factory_partner_id: "${partner_id}" }
              as: SourcingManager
              captures: { err1: $.data.error_id }
            - call: "GET /model-variants/${variant_id}"
              payload: {}
              as: RetailExec
              captures: { v_ret: $.data.version }
            - call: "POST /replenishment-orders"
              payload: { variant_id: "${variant_id}", weekly_velocity: 120, on_hand_units: 0, in_transit_units: 0, case_pack_units: 24, expected_variant_version: "${v_ret}" }
              as: RetailExec
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_STATE (RETIRED is terminal for tooling)"
            - "err2 == ERR_INVALID_STATE (RETIRED is not RETAIL_LIVE for replenishment)"

      - name: concept_deadline_autokill_at_review
        claim_type: Valid Transition
        grounds:
          - state_machines.ProductConcept
          - state_machines.LaunchSeason.run_review
        distinguishing_aspect: "A concept still IDENTIFIED 121 days after creation is auto-killed at run-review with killed_reason DEADLINE_EXCEEDED — the short-development-timeline cadence is system-enforced."
        test_recipe:
          setup: ["Concept created 2026-09-01, never advanced."]
