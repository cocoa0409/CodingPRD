            - call: "GET /field-force/sample-lots/${lot_id}"
              payload: {}
              as: QualityAssurance
            - call: "GET /field-force/sample-disbursements/${d1}"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /field-force/sample-transfers/${tr_id}"
              payload: {}
