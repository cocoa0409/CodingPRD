        grounds:
          - state_machines.DeliveryAttempt.INITIATED_to_ID_VERIFIED
          - entities.CourierCertification.fields.restriction_type
          - entities.Order.fields.restriction_types
          - validations[priority=52]
          - errors.ERR_CERTIFICATION_MISSING_FOR_RESTRICTION
