            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "DONOR_DECLARED", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
