          trigger:
            - call: "PATCH /gpo/contracts/${c1}/tiers"
              payload: { tiers: [ { tier_code: "TIER_A", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 100 }, { tier_code: "TIER_B", min_committed_volume_units: 3000, min_compliance_pct: 85.00, discount_bps: 900 } ] }
              as: ContractManager
              captures: { dt1: $.data.default_tier_code, cv1: $.data.version }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
              captures: { cs: $.data.status }
            - call: "PATCH /gpo/contracts/${c1}/tiers"
              payload: { tiers: [ { tier_code: "TIER_A", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 200 } ] }
              as: ContractManager
              captures: { e3: $.data.error_id }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/endorse"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "CR-2"
              captures: { rs: $.data.status }
            - call: "PATCH /gpo/contracts/${c1}/tiers"
              payload: { tiers: [ { tier_code: "TIER_A", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 200 } ] }
              as: ContractManager
              captures: { dt2: $.data.default_tier_code, cv2: $.data.version }
          assert:
            - "${dt0} == TIER_0 at creation; after the DRAFT patch ${dt1} == TIER_A and ${cv1} == ${cv0} + 1 — the ladder is replaced wholesale and the default re-derived"
            - "${ws} == 7.15 with ${rec} == CONVERT while the review is still UNDER_REVIEW"
            - "${cs} == ACTIVE, then ${e3} == ERR_CLINICAL_REVIEW_NOT_ENDORSED with HTTP 409 — a passing score is not an endorsement"
            - "${rs} == ENDORSED (endorsed by CR-2, who is not the submitter), after which the identical patch returns 200 with ${dt2} == TIER_A and ${cv2} == ${cv1} + 3 — one bump for activate, one for the endorse's evidence_endorsed recompute, one for the patch itself"
            - "Contract.${c1}.evidence_endorsed == true only after the endorse call"

      - name: leakage_report_denominator_includes_unmatched_and_ranks_top_three
        claim_type: computed_read
        grounds:
