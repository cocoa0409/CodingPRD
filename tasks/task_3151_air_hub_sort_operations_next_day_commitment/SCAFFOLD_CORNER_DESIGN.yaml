            - *c_hub
          trigger:
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_id: $.data.id }
            - call: "GET /airhub/lanes/${lane_id}"
              payload: {}
              as: SortOperator
          assert:
            - "the creation returns 201 and the read returns 200"
            - "SortLane.${lane_id}.lane_code == \"P-01\", lane_kind == PRIMARY and commodity_capability == GENERAL"
            - "SortLane.${lane_id}.capacity_weight_grams == 60000 and certified_until_minutes == 1700"
            - "SortLane.${lane_id}.turnout_start_minutes == 1400 and turnout_end_minutes == 1500"
            - "SortLane.${lane_id}.status == AVAILABLE and lane_load_grams == 0 and version == 1"

      - name: service_failure_reopen_from_a_disputed_failure_succeeds
        claim_type: Action Endpoint
        grounds:
          - endpoints.POST_/airhub/failures/{failure_id}/reopen
          - state_machines.ServiceFailure.transitions.DISPUTED_to_OPEN
        distinguishing_aspect: "The reopen action participates in a genuine cycle on the ServiceFailure axis: OPEN -> DISPUTED -> OPEN -> DISPUTED, with the failure's version advancing on each pass."
        test_recipe:
          setup:
            - "Clock 1500. SDF hub, BANK_A with N701UP landed and unloaded, lane P-01, shift N-A, and one GENERAL package carrying a BAD_ADDRESS failure."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-RO-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_ro: $.data.id }
            - call: "POST /airhub/failures"
              payload: { hub_id: "${hub_id}", package_id: "${pkg_ro}", cause_code: "BAD_ADDRESS", failure_minutes: 1500 }
              as: RefundAdjuster
              captures: { fail_ro: $.data.id, fail_ro_v: $.data.version }
          trigger:
            - call: "POST /airhub/failures/${fail_ro}/dispute"
              payload: {}
              as: RefundAdjuster
              captures: { disputed: $.data.status }
            - call: "POST /airhub/failures/${fail_ro}/reopen"
              payload: {}
              as: RefundAdjuster
              captures: { reopened: $.data.status }
            - call: "POST /airhub/failures/${fail_ro}/dispute"
              payload: {}
              as: RefundAdjuster
              captures: { redisputed: $.data.status }
          assert:
            - "the failure moved to ${disputed} == DISPUTED, then back to ${reopened} == OPEN, then to ${redisputed} == DISPUTED"
            - "ServiceFailure.${fail_ro}.attributed_role == CUSTOMER and refund_eligible == false throughout"
            - "the failure's version advanced on each pass from its creation version ${fail_ro_v}"
            - "the axis is a cycle rather than a pipeline, since OPEN is reached twice"

