            - { call: "POST /grants/panels/${tpan}/slate", payload: { ranked_application_ids: ["${appA}", "${appB}", "${appC}"], expected_panel_version: "${tpan_v}" }, as: Panelist, as_user_id: "${tpl1}" }
            - { call: "POST /grants/panels/${tpan}/slate", payload: { ranked_application_ids: ["${appA}", "${appA}", "${appB}"], expected_panel_version: "${tpan_v}" }, as: Panelist, as_user_id: "${tpl1}" }
            - { call: "POST /grants/panels/${tpan}/slate", payload: { ranked_application_ids: ["${appB}", "${appA}"], expected_panel_version: "${tpan_v}" }, as: Panelist, as_user_id: "${tpl1}" }
          assert:
            - "The one-id slate returns 409 ERR_INCOMPLETE_SLATE"
            - "The three-id slate returns 404 ERR_APPLICATION_NOT_ON_PANEL — the DRAFT application has assigned_panel_id null"
            - "The duplicated-id slate returns 409 ERR_INCOMPLETE_SLATE (exactly-once coverage, not merely set membership)"
            - "The final call returns 200 and the ranking follows the submitted order, not the score order: rank 1 is appB and rank 2 is appA"

      - name: tax_report_read_is_pure_and_variant_parameterised
        claim_type: computed_read
        grounds:
