          - endpoints[POST /initial-budgets/{id}/adoption]
        distinguishing_aspect: "Recording is a child-to-parent write: the package's own recorded_at, the
          project's declaration_recorded_at AND the project's warranty_start_at must all be stamped with
          the SAME logical instant (2026-08-01T00:00:00Z), and the project must advance
          DOCUMENTS_PREPARATION -> REGISTRATION. warranty_start_at is the clock that every warranty
          window is later measured from, so a server that stamps only the package silently disables
          every warranty expiry computation."
