              payload: { book_balance_cents: 10000000, bank_balance_cents: 10000000, outstanding_items_cents: 0, trial_balance_cents: 9800000, unidentified_funds_cents: 0, aged_unidentified_over_90_cents: 0, snapshot_as_of: "2026-07-31" }
              as: AgencyPrincipal
