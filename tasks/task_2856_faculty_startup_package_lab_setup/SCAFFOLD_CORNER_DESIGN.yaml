      - name: corner_sm_negotiation_loop_counter_revise_resubmit_round_counter
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.StartupPackage.transitions.DEAN_REVIEW_to_COUNTERED
          - state_machines.StartupPackage.transitions.COUNTERED_to_DRAFT
        distinguishing_aspect: "The counter/revise loop returns the package to DRAFT with negotiation_round incremented and both signature fields voided, while the spend axis never leaves NOT_YET_AVAILABLE."
        excluded_because:
          difficulty_instance: package_negotiation_cycle_with_independent_spend_axis
          rationale: "The difficulty instance walks two full negotiation rounds through DEAN_REVIEW -> COUNTERED -> DRAFT -> SUBMITTED -> DEAN_REVIEW -> APPROVED, asserting negotiation_round 1 -> 2, the voiding of endorsed_by_user_id and proposed_by_user_id, the re-endorsement requirement, and that spend_status stays NOT_YET_AVAILABLE across the whole loop. A separate cyclic-shape corner would replay the same edges with weaker assertions."

      - name: corner_sm_install_fork_to_utility_blocked_and_join_back
        claim_type: branching
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.EquipmentOrder.transitions.DELIVERED_to_UTILITY_BLOCKED
          - state_machines.EquipmentOrder.transitions.UTILITY_BLOCKED_to_INSTALLED
        distinguishing_aspect: "One trigger (/install) has two targets chosen by equipment_utility_feasibility, and the blocked branch rejoins INSTALLED after a utility upgrade with the full ledger side-effect set firing exactly once."
        excluded_because:
          difficulty_instance: equipment_delivered_fork_to_blocked_and_join_back_to_installed
          rationale: "The difficulty instance drives the same /install trigger twice - once into UTILITY_BLOCKED with utility_block_reason pinned to the first failing check and zero ledger movement, then, after POST /lab-spaces/{id}/utility-upgrade, into INSTALLED with the disbursement cascade - so both fork arms and the join point are already asserted with exact literals."

      - name: corner_sm_separation_cascade_down_through_appointments_and_tranches
        claim_type: Cascade down
        grounds:
          - state_machines.StartupPackage.spend_status.transitions.FROZEN_to_SETTLED.side_effects
          - state_machines.StaffAppointment.transitions.ACTIVE_to_ENDED
          - state_machines.CommitmentTranche.transitions.OPEN_to_RECAPTURED
        distinguishing_aspect: "POST /faculty/{id}/separate cascades from the faculty row down through the package, its appointments and orders, each affected tranche and finally the three funder units, touching only non-terminal children."
        excluded_because:
          difficulty_instance: separation_depth_four_faculty_to_package_to_appointment_to_tranche_to_funder
          rationale: "The difficulty instance asserts every hop of that four-level chain with exact cent literals (disbursed 1796664, unspent 70203336, per-funder reserved and refunded movements), including that already-terminal children are skipped. Repeating it as a breadth corner would add no new claim."

      - name: corner_sm_substantial_completion_bubbles_up_to_space_and_assignment
        claim_type: Bubble up
        grounds:
          - state_machines.RenovationProject.transitions.IN_PROGRESS_to_COMPLETED.side_effects
          - state_machines.LabSpace.transitions.UNDER_RENOVATION_to_ASSIGNED
          - state_machines.SpaceAssignment.transitions.PROPOSED_to_ACTIVE
        distinguishing_aspect: "Once every phase is COMPLETE the project completion bubbles up to the room and then out to the room's PROPOSED assignments, promoting them to ACTIVE in the same request."
        excluded_because:
          difficulty_instance: substantial_completion_depth_three_project_to_space_to_assignment
          rationale: "The difficulty instance asserts the three-hop promotion end to end - project COMPLETED, LabSpace UNDER_RENOVATION -> ASSIGNED, the PROPOSED assignment promoted to ACTIVE and allocated_share_pct recomputed from the windows containing the clock - plus the final-variant renovation reconciliation on the same call."

      - name: corner_sm_cancel_compensates_every_open_encumbrance_without_drift
        claim_type: Compensation
        grounds:
          - state_machines.EquipmentOrder.transitions.ORDERED_to_CANCELLED.side_effects
          - entities.SpendTransaction.fields.reverses_transaction_id
        distinguishing_aspect: "Cancelling a placed order posts one RELEASE row per open ENCUMBRANCE row, copying the stored per-funder split of the row it reverses so that no funder cent drifts and the tranche balance identity is restored exactly."
        excluded_because:
          difficulty_instance: order_cancel_restores_tranche_budget_identity_with_no_drift
          rationale: "The difficulty instance places an order that spans two tranches, cancels it, and asserts that each RELEASE row mirrors its ENCUMBRANCE row's split cent for cent, that both tranches return to their pre-place balances, and that re-splitting the total instead of copying the stored shares would leave a one-cent residue."

      - name: corner_sm_install_guarded_by_room_renovation_status
        claim_type: guarded transitions
        grounds:
          - state_machines.EquipmentOrder.transitions.DELIVERED_to_INSTALLED.preconditions
          - validations.priority_23_ERR_SPACE_NOT_READY_FOR_INSTALL
        distinguishing_aspect: "The DELIVERED -> INSTALLED edge is guarded by a different entity's state: the room must be LabSpace.status ASSIGNED, so a room still UNDER_RENOVATION blocks the install even when every utility check would pass."
        excluded_because:
          difficulty_instance: equipment_install_gated_by_lab_space_renovation_status
          rationale: "The difficulty instance installs the same order twice against the same room - once while the room is UNDER_RENOVATION (409 ERR_SPACE_NOT_READY_FOR_INSTALL, no ledger movement) and once after substantial completion returns it to ASSIGNED (INSTALLED with the disbursement cascade) - which is exactly the cross-entity guard claim."

