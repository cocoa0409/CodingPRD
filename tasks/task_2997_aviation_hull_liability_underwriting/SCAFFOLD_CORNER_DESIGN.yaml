            - call: "GET /aviation/aircraft/${ac2_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "Trigger call 1 returns 409 with data.error_id == 'ERR_DUPLICATE_REGISTRATION' — the clash is decided on registration_mark only, even though aircraft_class, manufacture_year, hull_new_value_cents, seat_count and max_takeoff_weight_kg all differ"
            - "Trigger call 2 returns 201 with a new id != ${ac2_id} — an identical spec under a free mark is accepted, so the constraint is not on the spec"
            - "Trigger call 3 shows Aircraft.${ac2_id} still reads aircraft_class == 'SINGLE_PISTON', manufacture_year == 2020 and hull_new_value_cents == 40000000: the rejected call did not overwrite the incumbent row"
      - name: corner_removed_hull_is_not_live_and_rejects_writes
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_SCHEDULE_NOT_LIVE]
          - state_machines[AircraftSchedule].transitions[ACTIVE->REMOVED]
          - calculations.endorsement_premium_delta
        distinguishing_aspect: "REMOVED is one of the two coverage states that stop being 'live', and the rule must bite on BOTH endpoints it is declared for: a value revision and a new claim on the removed hull each return 409 ERR_SCHEDULE_NOT_LIVE, while the byte-identical value revision on its still-ACTIVE sibling on the same policy succeeds — so the check is per-schedule, not per-policy."
        test_recipe:
