              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", segment_label: "WL-D-01", pipe_material: PVC_C900, diameter_in: 12, length_ft: 200.0, bedding_class: CLASS_B, design_invert_depth_ft: 8.0, design_slope_pct: 1.0, requires_dewatering: false }
