  # ===========================================================================
  - section: calculations
    instances:
      - name: alleged_ratio_rounds_to_four_places
        claim_type: precision
        grounds:
          - calculations.alleged_rvc_ratio
        distinguishing_aspect: "10001 / 7000 = 1.42871... renders as exactly 1.4287 (4 decimal places, round_half_up) — not 1.4286 (truncate) and not 1.429 (3dp)."
        test_recipe:
          setup:
            - "Carrier OKTX exists."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 10001, alleged_variable_cost_cents_per_ton: 7000, annual_tons: 100, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
          assert:
            - "RateComplaint.${rc1}.alleged_rvc_ratio == 1.4287"

      - name: five_year_average_partial_history
        claim_type: input_set_filtering
        grounds:
          - calculations.revenue_adequacy_roi
        excluded_because:
          difficulty_instance: current_year_vs_five_year_roi_finding_divergence
          rationale: "The 2021 finding's five_year_avg_roi_bps == 1200 (single available year) is asserted directly in the difficulty instance."

      - name: relief_cap_applied_on_three_benchmark
        claim_type: constants_applied
        grounds:
          - calculations.prescribed_rate_and_relief
        distinguishing_aspect: "THREE_BENCHMARK track: raw relief 8300 cents/ton x 20000 tons = 166000000 exceeds the 100000000 cap, so relief_granted_cents is exactly 100000000 (cap clamps via min, no error)."
        test_recipe:
          setup:
            - "Clock default. Carrier OKTX with findings 2021-2025 (ADEQUATE). Complaint (challenged 19500, alleged 10000, tons 20000, relief_sought 100000000 -> THREE_BENCHMARK, year 2025) in EVIDENTIARY_PHASE with VERIFIED evidence (reference 11200, cost 10500)."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/carriers/${c1}/revenue-adequacy-findings"
              payload: { fiscal_year: 2021, operating_revenue_cents: 620000000, operating_expense_cents: 500000000, net_investment_cents: 1000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c1}/revenue-adequacy-findings"
              payload: { fiscal_year: 2022, operating_revenue_cents: 600000000, operating_expense_cents: 500000000, net_investment_cents: 800000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c1}/revenue-adequacy-findings"
              payload: { fiscal_year: 2023, operating_revenue_cents: 565000000, operating_expense_cents: 500000000, net_investment_cents: 500000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c1}/revenue-adequacy-findings"
              payload: { fiscal_year: 2024, operating_revenue_cents: 730000000, operating_expense_cents: 500000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c1}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 20000, relief_sought_cents: 100000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "THREE_BENCHMARK_PACKET", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-1", tons: 10.000 }] }
              as: BoardAdjudicator
          assert:
            - "RateComplaint.${rc1}.track == THREE_BENCHMARK"
            - "RateComplaint.${rc1}.relief_granted_cents == 100000000 (raw 166000000 clamped to the track cap)"
            - "RateComplaint.${rc1}.prescribed_rate_cents_per_ton == 11200 and award_granted_cents == 83000 (reparation award is computed from shipments and is NOT capped)"

      - name: public_interest_score_bands_enforced
        claim_type: correct_result
        grounds:
          - calculations.public_interest_score
          - errors[ERR_DECISION_INCONSISTENT_WITH_SCORE]
          - errors[ERR_SERVICE_ASSURANCE_PLAN_REQUIRED]
        distinguishing_aspect: "Score 59.00 admits only APPROVED_WITH_CONDITIONS: APPROVED fails ERR_DECISION_INCONSISTENT_WITH_SCORE (422); WITH_CONDITIONS without a plan fails ERR_SERVICE_ASSURANCE_PLAN_REQUIRED (409, regulatory gate precedes score consistency); with a plan filed, WITH_CONDITIONS succeeds."
        test_recipe:
          setup:
            - "Clock default 2026-09-01T00:00:00Z. Carriers CSXT and NSOR exist. Merger M1 scores (50,70,60) -> 59.00, in COMMENT_PERIOD. Clock advanced to 2026-10-16T00:00:00Z."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "CSXT", legal_name: "Crescent South Extension Transport", carrier_class: "I", base_route_miles: 2100 }
              as: PlatformAdmin
              captures: { c_csxt: $.data.id }
            - call: "POST /stb/carriers"
              payload: { carrier_code: "NSOR", legal_name: "Northern & Southern Railway", carrier_class: "II", base_route_miles: 640 }
              as: PlatformAdmin
              captures: { c_nsor: $.data.id }
            - call: "POST /stb/merger-applications"
              payload: { acquiring_carrier_id: "${c_csxt}", target_carrier_id: "${c_nsor}", transaction_value_cents: 900000000, competition_preservation_score: 50, service_reliability_score: 70, shipper_impact_score: 60 }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { m1: $.data.id }
            - call: "POST /stb/_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /stb/merger-applications/${m1}/decide"
              payload: { outcome: "APPROVED" }
              as: BoardAdjudicator
              captures: { err1: $.data.error_id }
            - call: "POST /stb/merger-applications/${m1}/decide"
              payload: { outcome: "APPROVED_WITH_CONDITIONS", conditions: ["Oversight"] }
              as: BoardAdjudicator
              captures: { err2: $.data.error_id }
            - call: "POST /stb/merger-applications/${m1}/service-assurance-plans"
              payload: { plan_name: "Late SAP", commitments: ["Weekly service metrics to the Board"] }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { sap1: $.data.id }
            - call: "POST /stb/merger-applications/${m1}/decide"
              payload: { outcome: "APPROVED_WITH_CONDITIONS", conditions: ["Oversight"] }
              as: BoardAdjudicator
          assert:
            - "err1 == ERR_DECISION_INCONSISTENT_WITH_SCORE (59.00 < 60.00 bars APPROVED)"
            - "err2 == ERR_SERVICE_ASSURANCE_PLAN_REQUIRED (no plan yet; regulatory gate 5 precedes score consistency)"
            - "final decide succeeds: MergerApplication.${m1}.status == APPROVED_WITH_CONDITIONS and ServiceAssurancePlan.${sap1}.status == MONITORING"

      - name: prescribed_rate_reference_above_floor
        claim_type: correct_result
        grounds:
          - calculations.prescribed_rate_and_relief
        excluded_because:
          difficulty_instance: prescription_floor_switches_with_revenue_adequacy
          rationale: "The ADEQUATE-carrier branch (reference 11200 > floor 10500 -> prescribed 11200) is asserted in the difficulty instance."

  # ===========================================================================
  - section: validations
    instances:
