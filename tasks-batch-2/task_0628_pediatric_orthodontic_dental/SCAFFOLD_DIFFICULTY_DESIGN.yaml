              as: Orthodontist
              as_user_id: "ortho-18"
              captures: { ceph_id: $.data.id }
            - call: "POST /growth-records/${ceph_id}/finalize"
              payload: {}
              as: Orthodontist
              as_user_id: "ortho-18"
