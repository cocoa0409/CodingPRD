          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: |
          Category pair (state vs business_fiscal): issuing a PAID invoice that
          also has zero APPROVED charges violates both priority-4 state and
          priority-12 fiscal rules — the state error ERR_INVOICE_NOT_ISSUABLE
          (priority 4) MUST win over ERR_INVALID_AMOUNT.
