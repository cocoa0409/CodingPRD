  # ---------------------------------------------------------------- Rule 3 --
  - rule_id: non_linear_state_machine
    instances:
      - name: dictation_job_rework_cycle
        grounds:
          - state_machines.DictationJob.SUBMITTED_to_EDITING
          - state_machines.DictationJob.EDITING_to_SUBMITTED
          - state_machines.Transcript.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          DictationJob is cyclic: EDITING -> SUBMITTED -> EDITING on QA FAIL,
          traversed twice before DELIVERED; each loop burns a Transcript version
          (v1, v2 REJECTED; v3 DELIVERED) and increments rework_count.
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; one ROUTINE job J"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 1, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 1, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 0, major_error_count: 1, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01", captures: { outcome: $.data.outcome } }
            - { call: "GET /dictation-jobs/${j}", payload: {}, as: VendorAdmin, captures: { st: $.data.workflow_status, rw: $.data.rework_count } }
            - { call: "GET /transcripts?dictation_job_id=${j}", payload: {}, as: VendorAdmin }
          assert:
            - "third QAReview.outcome == PASS (score 95.0)"
            - "DictationJob.workflow_status == DELIVERED and rework_count == 2  # two full EDITING->SUBMITTED->EDITING loops"
            - "GET /transcripts?dictation_job_id returns 3 versions: v1 REJECTED, v2 REJECTED, v3 DELIVERED"
            - "Editor.qa_review_count == 3 (< 5) so Editor.status remains ACTIVE — rework loops alone never trigger standing evaluation"

      - name: editor_standing_probation_recovery_cycle
        grounds:
          - state_machines.Editor.ACTIVE_to_PROBATION
          - state_machines.Editor.PROBATION_to_ACTIVE
          - calculations.editor_rolling_quality_and_standing
        distinguishing_aspect: |
          Editor standing machine is cyclic on a different entity: ACTIVE ->
          PROBATION at rolling 84.00 (< 85) after the 5th review, then PROBATION
          -> ACTIVE at rolling exactly 90.00 (>= 90) after three perfect reviews
          — recovery boundary uses >= while the drop uses <.
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window"
            - "Reviews 1-5: five ROUTINE jobs, each scored m=3,i=1 (84.0 PASS) -> rolling 84.00 -> PROBATION"
            - "Reviews 6-8: three ROUTINE jobs scored perfect 100 -> rolling 86.67, 88.57, then 90.00 -> ACTIVE"
