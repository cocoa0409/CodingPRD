        grounds:
          - validations.priority_44_ERR_EMAIL_ALREADY_REGISTERED
          - errors.ERR_EMAIL_ALREADY_REGISTERED
        distinguishing_aspect: "Guest email uniqueness is case-insensitive: re-registering DUP@GUEST.TEST after dup@guest.test returns 409 ERR_EMAIL_ALREADY_REGISTERED, while the same address on a Host row is accepted because the two uniqueness domains are separate."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and one guest at dup@guest.test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/guests"
              payload: { full_name: "Original Guest", email: "dup@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /rentals/guests"
              payload: { full_name: "Copycat Guest", email: "DUP@GUEST.TEST", country_code: "CA" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == ERR_EMAIL_ALREADY_REGISTERED"
            - "GET /rentals/guests reports total_count 1 — only ${g1} exists"
            - "POST /rentals/hosts with email dup@guest.test returns 201, because uniqueness is per entity table"

      - name: jurisdiction_code_taken_rejected
        claim_type: error_triggerable
        grounds:
          - validations.priority_45_ERR_JURISDICTION_CODE_TAKEN
          - errors.ERR_JURISDICTION_CODE_TAKEN
        distinguishing_aspect: "A second rule for an existing jurisdiction_code returns 409 ERR_JURISDICTION_CODE_TAKEN even when every policy value differs, and the stored rule keeps its original policy values untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and one rule for US-CA-SFO with min_stay_nights 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j1: $.data.id }
          trigger:
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 7, max_occupancy_cap: 2, events_prohibited: true, registration_required: true, indoor_camera_allowed: false, indoor_audio_allowed: false, sensor_notice_required: false, noise_threshold_db: 55 }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == ERR_JURISDICTION_CODE_TAKEN"
            - "JurisdictionRule.${j1}.min_stay_nights == 2 and JurisdictionRule.${j1}.noise_threshold_db == 70 and JurisdictionRule.${j1}.registration_required == false"
            - "GET /rentals/jurisdiction-rules filtered by jurisdiction_code US-CA-SFO reports total_count 1"

      - name: deposit_product_config_invalid_rejected
        claim_type: error_triggerable
        grounds:
          - validations.priority_48_ERR_PRODUCT_CONFIG_INVALID
          - errors.ERR_PRODUCT_CONFIG_INVALID
        distinguishing_aspect: "Protection-product coherence is a fiscal check at priority 48: a DEPOSIT listing carrying a non-zero waiver_nightly_fee_cents alongside its deposit returns 422 ERR_PRODUCT_CONFIG_INVALID, and a WAIVER listing with deposit_amount_cents > 0 fails the mirror clause."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one host and one jurisdiction rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Corner Stays LLC", email: "errhost1@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
