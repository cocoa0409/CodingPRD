        distinguishing_aspect: |
          Depth-3 cascade from POST /sleep/orders/{id}/cancel: (1) order cancel
          mutates its SCHEDULED visit to CANCELLED; (2) that visit's mutation
          releases slot_need on its DeliveryWindow (reserved_slots 2 -> 0);
          (3) the window's freed slots promote a DIFFERENT order's WAITLISTED
