  - section: complexity_layers
    note: "Table-8 walk over the four declared layers: both \u00a71.2.1 concurrency_rules get a full stale-version instance (version bump asserted, rejected write proven to leave no trace), while dual_variant_calculation, cascading_side_effects and rate_threshold_triggers are already discharged in full by \u00a71.8 instances and are cross-referenced rather than duplicated."
    instances:

      - name: stale_expected_listing_version_after_a_fourth_account_is_added
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[valuation-supersede-stale-listing]"
          - "errors.ERR_STALE_LISTING_VERSION"
          - "complexity_profile.complexity_layers.optimistic_concurrency"
          - "endpoints[POST /route-listings/{id}/valuations]"
        distinguishing_aspect: "The guard protects a DERIVED read: the caller's expected_listing_version was captured before a fourth account joined the route, so the valuation it is about to write would have been computed from a three-account roll-up. The rejection is not a state error -- re-creating a valuation is always legal -- and the very same body succeeds once the version is re-read, this time valuing 53000 rather than 43000."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ profile, ACTIVE seller, APPROVED buyer."
            - "DRAFT listing PHX-NE holds A1 (16000 recurring, 1500 repair, age 88), A2 (15000 PASS_THROUGH, 2000 repair, age 38) and A3 (12000, 500 repair, age 17); claimed_recurring_mrr_cents 43000, claimed_repair_mrr_cents 4000, claimed_account_count 3."
            - "A LISTED_BASIS valuation of 463500 already exists, written against ${listing_v}, which is the listing version as of three accounts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
