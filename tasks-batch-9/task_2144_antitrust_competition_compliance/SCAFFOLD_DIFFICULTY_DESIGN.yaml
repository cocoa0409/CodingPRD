  - rule_id: resource_temporal_overlap
    instances:
      - name: delegate_closed_interval_with_briefing_buffer_rejects_touching_windows
        grounds:
          - calculations.attendee_occupancy_interval
          - validations[priority=22]
          - errors[ERR_ATTENDEE_WINDOW_CONFLICT]
          - entities.MeetingAttendance.fields.occupied_start
        distinguishing_aspect: |
          Contended resource: the DELEGATE (EmployeeProfile), capacity exactly 1,
          interval semantics CLOSED-CLOSED with a 60-minute pre-meeting briefing
          buffer folded into the left edge. A meeting starting at 12:00 occupies
          from 11:00 and therefore TOUCHES an existing occupancy ending at 11:00
          — touching is a conflict. Shifting the same meeting by one minute
          (12:01, occupying from 11:01) is accepted.
        test_recipe:
          setup:
            - "BusinessUnit posture OPEN, SALES employee with current training and clearance GRANTED, one ACTIVE participation."
            - "Meeting M1 on 2026-09-10 09:00-11:00Z already booked; the delegate's occupancy is the closed interval [08:00, 11:00]."
            - "Meeting M2 on 2026-09-10 12:00-13:00Z (occupancy [11:00, 13:00]) and meeting M3 on 2026-09-10 12:01-13:01Z (occupancy [11:01, 13:01]) both exist, both with agendas received."
