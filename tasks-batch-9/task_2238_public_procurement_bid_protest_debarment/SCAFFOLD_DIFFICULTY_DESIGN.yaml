            - call: "POST /procurement/protests"
              payload: { solicitation_id: "${s16_id}", protester_vendor_id: "${v20_id}", grounds_code: "SOLICITATION_IMPROPRIETY", narrative: "the permit-of-record clause is internally contradictory" }
              as: Vendor
              as_user_id: "${v20_id}"
              captures: { p10_id: $.data.id }
            - call: "POST /procurement/protests"
              payload: { solicitation_id: "${s17_id}", protester_vendor_id: "${v20_id}", grounds_code: "SOLICITATION_IMPROPRIETY", narrative: "the permit-of-record clause is internally contradictory" }
              as: Vendor
