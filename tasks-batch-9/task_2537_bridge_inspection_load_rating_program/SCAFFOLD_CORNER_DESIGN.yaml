  - section: complexity_layers
    instances:
      - name: load_rating_create_against_stale_bridge_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.load-rating-create-stale-bridge
          - errors.ERR_STALE_BRIDGE_VERSION
          - validations.priority_8
        distinguishing_aspect: "The §1.2.1 rule load-rating-create-stale-bridge is exercised on its declared write_endpoint with its declared occ_field: a version read BEFORE the acceptance cascade is stale afterwards, so the create is 412; re-reading the bridge makes the identical body succeed, and the successful create bumps Bridge.version again."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z, stepped to 2026-09-02T12:00:00Z and 2026-09-03T09:00:00Z."
            - "The engineer reads Bridge.version while the inspection is still DRAFT, then the QA acceptance cascade publishes ratings and bumps that version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
