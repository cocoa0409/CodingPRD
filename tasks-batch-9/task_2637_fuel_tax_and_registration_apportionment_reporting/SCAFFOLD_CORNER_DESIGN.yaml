              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", trip_start_utc: "2026-04-05T06:00:00Z", trip_end_utc: "2026-04-05T18:00:00Z", start_odometer: 1000.0, end_odometer: 1650.0, legs: [ { jurisdiction_code: "IL", leg_miles: 650.0 } ] }
              as: MileageAnalyst
              as_user_id: "analyst-1"
              captures: { t1_id: $.data.id }
            - call: "POST /apportionment/trip-records/${t1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", jurisdiction_code: "IL", purchase_date: "2026-05-02", gallons: 100.000, tax_paid_flag: true, receipt_reference: "RCPT-IL-4471" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /apportionment/fuel-tax-returns"
              payload: { carrier_id: "${c1_id}", filing_year: 2026, filing_quarter: 2 }
