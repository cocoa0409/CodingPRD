            - "Patient.${pat_id}.strikes has length 1 with kind NO_SHOW and magnitude 25"
            - "Patient.${pat_id}.recovery_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fee_split_nested_rounding_order
        grounds:
          - calculations.calc_fee_split
          - entities.Charge.fields.marketplace_fee_cents
          - entities.Charge.fields.processing_cents
          - entities.Charge.fields.net_to_practice_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: gross 9999 pins the per-component rounding
          order — fee rounds 1499.85 up to 1500, processing rounds 289.971 up to
          290 then adds the flat 30, and net (8179) is the subtraction of the
          rounded parts. An implementation that subtracts the UNROUNDED fee and
          processing parts and rounds only the final net returns 8180 and fails.
        test_recipe:
          setup:
            - "Bookable practice/provider with appointment type copay 9999"
            - "One OPEN slot; patient with no contact events (ATTRIBUTED)"
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
