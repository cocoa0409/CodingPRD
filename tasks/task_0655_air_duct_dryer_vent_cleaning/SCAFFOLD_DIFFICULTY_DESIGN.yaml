# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Air-Duct & Dryer-Vent Cleaning (Expert). 9 rules × 2 instances = 18 instances.
# All numeric asserts are literals computed against §1.3 formulas + constants.
# Shared PricingConfig used across instances (cents):
#   duct_base=12000, duct_per_system=4000, dryer_vent_flat=9000,
#   sanitize_per_system=5000, addon_sanitizer=3000, addon_uv=7000, addon_coil=2500,
#   multi_system_discount_pct=0.10, plan_member_discount_pct=0.15, tax_pct=0.08.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_estimate_vs_invoice_diverge_on_system_change
        grounds:
          - calculations.estimate_total
          - calculations.invoice_total
          - state_machines.WorkOrder.QUOTED_to_SCHEDULED
          - entities.WorkOrder.fields.estimate_total_cents
          - entities.WorkOrder.fields.invoice_total_cents
        distinguishing_aspect: |
          Same WorkOrder, two cost algorithms: estimate (live n=3 at quote) yields
          36720 while invoice (live n=2 at complete after a decommission, pinned
          config) yields 32832 for identical performed lines — divergent cost numbers.
        test_recipe:
          setup:
            - "ACTIVE PricingConfig with the shared rates above."
            - "Home in zone Z1 with 3 ACTIVE HvacSystems, no recurring plan."
            - "WorkOrder with one DUCT line (system A) + one DRYER_VENT line + UV add-on, inspected, quoted (estimate computed at n=3), then committed/started; one system decommissioned so n=2 before completion."
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Owner", email: "ada@x.com", phone: "555-0100" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "1 Vent Rd", zone_code: "Z1", square_footage: 2000 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 8 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys B", register_count: 8 }
              as: PlanAdmin
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys C", register_count: 8 }
              as: PlanAdmin
              captures: { sys_c: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech Uv", home_zone_code: "Z1", certified_for_uv: true }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" }, { service_type: "DRYER_VENT" } ], addons: [ "UV" ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 3, dust_severity: 5 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
              captures: { est_total: $.data.estimate_total_cents, dur: $.data.duration_minutes }
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-04-10", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-plans/${route_id}/commit"
              payload: { work_order_id: "${wo_id}", scheduled_start_minute: 540, expected_route_plan_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /route-plans/${route_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /homes/${home_id}/systems/${sys_c}/decommission"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { after_photo_count: 4, dust_severity: 5, performed_service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" }, { service_type: "DRYER_VENT" } ], performed_addons: [ "UV" ] }
              as: Technician
              as_user_id: "${crew_id}"
              captures: { inv_total: $.data.invoice_total_cents }
          assert:
            - "WorkOrder.${wo_id}.estimate_total_cents == 36720"
            - "WorkOrder.${wo_id}.invoice_total_cents == 32832"
            - "WorkOrder.${wo_id}.estimate_total_cents != WorkOrder.${wo_id}.invoice_total_cents"

      - name: dual_variant_cost_vs_contamination_risk_different_domains
        grounds:
          - calculations.invoice_total
          - calculations.contamination_risk_score
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - entities.Inspection.fields.dust_severity
          - entities.UpsellReferral.fields.severity_at_referral
        distinguishing_aspect: |
          Invoice (cost accounting on WorkOrder) and contamination_risk_score (severity
          on Inspection/Home) operate on DIFFERENT entity domains: a referral is created
          off risk score >= 40 (sev=4, reg_sum=24, n=3 -> 48) independent of the invoice total.
        test_recipe:
          setup:
            - "ACTIVE PricingConfig as above; Home Z1 with 3 ACTIVE systems (register_count 8 each => sum 24), no plan."
            - "WorkOrder with one DUCT line on system A, inspected, quoted, committed, locked, started."
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ben Owner", email: "ben@x.com", phone: "555-0101" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "2 Vent Rd", zone_code: "Z1", square_footage: 1800 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 8 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys B", register_count: 8 }
              as: PlanAdmin
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys C", register_count: 8 }
              as: PlanAdmin
            - call: "POST /crew-members"
              payload: { full_name: "Tech One", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 600 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 2, dust_severity: 6 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-04-11", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-plans/${route_id}/commit"
              payload: { work_order_id: "${wo_id}", scheduled_start_minute: 600, expected_route_plan_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /route-plans/${route_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { after_photo_count: 3, dust_severity: 4, recommend_hvac_repair: true, performed_service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ] }
              as: Technician
              as_user_id: "${crew_id}"
              captures: { inv_total: $.data.invoice_total_cents }
          assert:
            - "WorkOrder.${wo_id}.invoice_total_cents == 19440"
            - "A new UpsellReferral exists with work_order_id == ${wo_id} and status == PENDING and severity_at_referral == 4"
            - "UpsellReferral.severity_at_referral is derived from Inspection domain, not from WorkOrder.invoice_total_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_duration_nonlinear_big_home_factor
        grounds:
          - calculations.work_order_duration
          - state_machines.WorkOrder.INSPECTED_to_QUOTED
          - entities.WorkOrder.fields.duration_minutes
          - entities.Home.fields.square_footage
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — per_line is multiplied by
          BIG_HOME_FACTOR only when BOTH active_system_count>=2 AND square_footage>=3000;
          n=3, sqft=3500, DUCT+DRYER+UV -> per_line round_half_up(60*1.25)=75, total 105.
        test_recipe:
          setup:
            - "ACTIVE PricingConfig as above; Home Z1 with 3 ACTIVE systems and square_footage 3500."
            - "WorkOrder DUCT(system A)+DRYER_VENT+UV add-on, inspected."
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Cal Owner", email: "cal@x.com", phone: "555-0102" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "3 Vent Rd", zone_code: "Z1", square_footage: 3500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 6 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys B", register_count: 6 }
              as: PlanAdmin
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys C", register_count: 6 }
              as: PlanAdmin
            - call: "POST /crew-members"
              payload: { full_name: "Tech Uv", home_zone_code: "Z1", certified_for_uv: true }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" }, { service_type: "DRYER_VENT" } ], addons: [ "UV" ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 2, dust_severity: 5 }
              as: Technician
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
              captures: { dur: $.data.duration_minutes }
          assert:
            - "WorkOrder.${wo_id}.duration_minutes == 105"

      - name: combinatorial_estimate_pinned_eval_order_discount_then_plan_then_tax
        grounds:
          - calculations.estimate_total
          - state_machines.WorkOrder.INSPECTED_to_QUOTED
          - entities.WorkOrder.fields.estimate_total_cents
          - entities.Home.fields.has_active_plan
        distinguishing_aspect: |
          Mode (b)/(c): nested round_half_up where evaluation ORDER is pinned —
          multi-system discount on duct subtotal FIRST, then whole-subtotal plan
          discount, then tax; 2 DUCT lines + SANITIZE + DRYER + SANITIZER + COIL at
          n=3 with active plan -> 50949 (round-per-step, not sum-then-round).
        test_recipe:
          setup:
            - "ACTIVE PricingConfig as above; Home Z1 with 3 ACTIVE systems and an ACTIVE recurring plan (has_active_plan true)."
            - "WorkOrder with two DUCT lines (systems A,B), one SANITIZE (system C), one DRYER_VENT, add-ons SANITIZER+COIL, inspected."
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Dee Owner", email: "dee@x.com", phone: "555-0103" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "4 Vent Rd", zone_code: "Z1", square_footage: 2200 }
              as: PlanAdmin
              captures: { home_id: $.data.id, home_v: $.data.version }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 6 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys B", register_count: 6 }
              as: PlanAdmin
              captures: { sys_b: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys C", register_count: 6 }
              as: PlanAdmin
              captures: { sys_c: $.data.id, home_v3: $.data.version }
            - call: "POST /homes/${home_id}/recurring-plans"
              payload: { cadence_months: 12, expected_home_version: "${home_v3}" }
              as: PlanAdmin
            - call: "POST /crew-members"
              payload: { full_name: "Tech Two", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" }, { service_type: "DUCT", system_id: "${sys_b}" }, { service_type: "SANITIZE", system_id: "${sys_c}" }, { service_type: "DRYER_VENT" } ], addons: [ "SANITIZER", "COIL" ], requested_start_minute: 600 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 2, dust_severity: 3 }
              as: Technician
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
              captures: { est: $.data.estimate_total_cents }
          assert:
            - "WorkOrder.${wo_id}.estimate_total_cents == 50949"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_work_order_reinspect_cycle
        grounds:
          - state_machines.WorkOrder.QUOTED_to_INSPECTED
          - state_machines.WorkOrder.INSPECTED_to_QUOTED
          - entities.WorkOrder.fields.estimate_total_cents
          - entities.WorkOrder.fields.pricing_config_id
        distinguishing_aspect: |
          WorkOrder cycle QUOTED->INSPECTED->QUOTED: re-inspect from QUOTED clears
          estimate_total_cents and pricing_config_id to null; a second quote recomputes
          them — a genuine revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE PricingConfig; Home Z1 1 ACTIVE system; WorkOrder DUCT(sys A) inspected then quoted (estimate set), uncommitted."
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Eve Owner", email: "eve@x.com", phone: "555-0104" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "5 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech Three", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 2, dust_severity: 4 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
              captures: { est1: $.data.estimate_total_cents }
          trigger:
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 5, dust_severity: 7 }
              as: Technician
              as_user_id: "${crew_id}"
              captures: { wo_status: $.data.status, est_after_reinspect: $.data.estimate_total_cents }
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
              captures: { est2: $.data.estimate_total_cents }
          assert:
            - "After re-inspect WorkOrder.${wo_id}.status == INSPECTED and estimate_total_cents == null and pricing_config_id == null"
            - "After second quote WorkOrder.${wo_id}.status == QUOTED and estimate_total_cents == 12960"

      - name: nonlinear_callback_ticket_reopen_cycle
        grounds:
          - state_machines.CallbackTicket.RESOLVED_to_REOPENED
          - state_machines.CallbackTicket.REOPENED_to_RESOLVED
          - entities.CallbackTicket.fields.status
        distinguishing_aspect: |
          CallbackTicket cycle RESOLVED->REOPENED->RESOLVED on a DIFFERENT entity than
          the WorkOrder cycle; reopen then resolve loops the ticket back to RESOLVED.
        test_recipe:
          setup:
            - "A COMPLETED WorkOrder exists; a CallbackTicket on it is OPEN then RESOLVED."
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Fay Owner", email: "fay@x.com", phone: "555-0105" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "6 Vent Rd", zone_code: "Z1", square_footage: 1600 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech Four", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 2, dust_severity: 3 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-04-12", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-plans/${route_id}/commit"
              payload: { work_order_id: "${wo_id}", scheduled_start_minute: 540, expected_route_plan_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /route-plans/${route_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { after_photo_count: 2, dust_severity: 3, performed_service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ] }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /callback-tickets"
              payload: { work_order_id: "${wo_id}", reason: "Still dusty", redo_required: true }
              as: Dispatcher
