            - { call: "POST /certification-projects/${p_id}/lock-strategy", payload: { expected_project_version: "${p_v}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_1}/assign-owner", payload: { documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_2}/assign-owner", payload: { documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_1}/mark-ready", as: DocumentationSpecialist, as_user_id: "${m_spec}" }
            - { call: "POST /credit-attempts/${a_2}/mark-ready", as: DocumentationSpecialist, as_user_id: "${m_spec}" }
            - { call: "POST /certification-projects/${p_id}/submit-phase", payload: { phase: "DESIGN" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_1}/begin-review", as: CertificationReviewer }
            - { call: "POST /credit-attempts/${a_2}/begin-review", as: CertificationReviewer }
          trigger:
            - { call: "POST /credit-attempts/${a_1}/award", payload: { raw_points_earned: 1.4 }, as: CertificationReviewer }
            - { call: "POST /credit-attempts/${a_2}/award", payload: { raw_points_earned: 1.4 }, as: CertificationReviewer }
            - { call: "GET /certification-projects/${p_id}", as: Any, captures: { tot: $.data.points_awarded_total } }
          assert:
