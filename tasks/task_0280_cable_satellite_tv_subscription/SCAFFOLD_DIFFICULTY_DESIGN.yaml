              as: BillingAdmin
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech One", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech1: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Adj", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T10:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-02T10:00:00Z", window_end: "2026-06-02T11:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
              captures: { v2: $.data.id, st: $.data.status }
          assert:
            - "ServiceVisit.${st} == SCHEDULED"

