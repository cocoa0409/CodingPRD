              as: MemberServicesAnalyst
              captures: { dis_id: $.data.id }
            - { call: "POST /disability-applications/${dis_id}/decision", payload: { outcome: "APPROVE" }, as: MedicalReviewer, as_user_id: "reviewer-1" }
            # purchase opened AFTER retirement (allowed: only DECEASED blocks)
            - call: "POST /members/${mem_id}/service-purchases"
              payload: { purchase_type: "PRIOR_SERVICE", service_period_start: "2005-01-01", service_period_end: "2006-12-31", years_purchased: 2.0 }
              as: MemberServicesAnalyst
              captures: { pur_id: $.data.id }
            - { call: "POST /service-purchases/${pur_id}/quote", payload: {}, as: MemberServicesAnalyst }
            - call: "POST /service-purchases/${pur_id}/accept"
              payload: { installment_count: 12 }
              as: MemberServicesAnalyst
              captures: { pv1: $.data.version }
            - call: "GET /service-purchases/${pur_id}/payments"
              payload: {}
              as: MemberServicesAnalyst
              captures: { pay1: "$.data[0].id", pay2: "$.data[1].id" }
            - { call: "POST /service-purchases/${pur_id}/payments", payload: { payment_id: "${pay1}", expected_purchase_version: "${pv1}" }, as: MemberServicesAnalyst }
            - call: "GET /service-purchases/${pur_id}"
              payload: {}
              as: MemberServicesAnalyst
              captures: { pv2: $.data.version }
            - { call: "POST /service-purchases/${pur_id}/payments", payload: { payment_id: "${pay2}", expected_purchase_version: "${pv2}" }, as: MemberServicesAnalyst }
          trigger:
            - call: "PATCH /members/${mem_id}"
              payload: { deceased_at: "2026-08-01" }
              as: MemberServicesAnalyst
              captures: { mem_status: $.data.status }
          assert:
            - "Member.${mem_id}.status == DECEASED (link 1)"
            - "ServicePurchase.${pur_id}.status == CANCELLED, balance_due_cents == 0, refunded_total_cents == 440000 (link 2)"
            - "PurchasePayment.${pay1}.status == REFUNDED and PurchasePayment.${pay2}.status == REFUNDED (link 3); payments 3-12 stay PENDING on the CANCELLED purchase and can never be paid (ERR_PLAN_NOT_ACTIVE)"
            - "The member's Benefit (kind DISABILITY) status == TERMINATED (parallel hop-2 branch)"
            - "Chain order is observable via field consequences: refunded_total_cents == 440000 exactly equals the two APPLIED installments, proving payment mutation followed purchase cancellation"

      - name: line_review_bubble_up_reconciles_variance_report
        grounds:
          - state_machines.ContributionLine.REJECTED_to_ACCEPTED
          - state_machines.ContributionReport.VARIANCE_to_RECONCILED
