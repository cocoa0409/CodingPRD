# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2133_crane_rigging_lift — 9 rule_ids, 20 instances
# Logical clock starts at 2026-08-01T00:00:00Z on every server boot.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: ground_bearing_provisional_survey_vs_final_engineered
        grounds:
          - calculations.ground_bearing_pressure
          - entities.LiftPlan.fields.bearing_variant
          - entities.LiftPlan.fields.bearing_pressure_psf
          - entities.LiftPlan.fields.mat_count
          - state_machines.LiftPlan.PENDING_ENGINEERING_to_APPROVED
          - state_machines.EngineeringReview.UNDER_REVIEW_to_STAMPED
        distinguishing_aspect: |
          This dual-variant lives in the geotechnical domain on the LiftPlan+Site pair: identical
          crane weights, load and soil capacity yield per_outrigger_load_lb 90875.00 under
          PROVISIONAL_SURVEY (four-way equal split) and 239910.00 under FINAL_ENGINEERED
          (0.60 worst-case share times a 1.10 dynamic factor), so bearing_pressure_psf moves
          2271.88 -> 5997.75 and mat_count moves 8 -> 16 with no input changing.
        test_recipe:
          setup:
            - "A customer, a site with soil_bearing_capacity_psf 2000, a 275-ton crane with a 40 sqft outrigger pad, one MAIN_BOOM/120ft/40ft chart row at 100000 lb, an operator, a rigger, one inspected sling, and two engineers all exist."
            - "A lift plan for a 73000 lb load has been surveyed, has one ACTIVE sling assignment, and has been configured onto the crane, landing in PENDING_ENGINEERING with the PROVISIONAL_SURVEY bearing figures stored."
            - "Engineer A has submitted an EngineeringReview that is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial", billing_terms: "NET_30" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Bergen Plant 4", jurisdiction_code: "NJ-BERGEN", soil_bearing_capacity_psf: 2000, proximity_to_energized_lines_ft: 45, over_water: false }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /cranes"
              payload: { model_code: "LTM-1250", class_tons: 275, gross_weight_lb: 190000, counterweight_lb: 100000, outrigger_pad_area_sqft: 40.0, max_line_pull_lb: 20000, rated_max_wind_mph: 30, annual_inspection_expires_on: "2027-06-30T00:00:00Z", mob_demob_cents: 250000, hourly_rate_cents: 45375 }
              as: Dispatcher
              captures: { crane_id: $.data.id }
            - call: "POST /load-chart-entries"
              payload: { crane_id: "${crane_id}", configuration: "MAIN_BOOM", boom_length_ft: 120, radius_ft: 40, gross_capacity_lb: 100000 }
              as: Dispatcher
            - call: "POST /personnel"
              payload: { full_name: "Ray Kolb", role_type: "OPERATOR", certification_number: "NCCCO-88421", certification_expires_on: "2027-03-31T00:00:00Z", endorsement_class_tons: 300 }
              as: Dispatcher
              captures: { op_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Dina Ruiz", role_type: "RIGGER", certification_number: "NCCER-5510", certification_expires_on: "2027-04-30T00:00:00Z", rigger_level: "ADVANCED" }
              as: Dispatcher
              captures: { rig_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Alan Pope", role_type: "ENGINEER", certification_number: "PE-NJ-3391", certification_expires_on: "2028-01-31T00:00:00Z", pe_license_state: "NJ" }
              as: Dispatcher
              captures: { eng_a_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Mei Sato", role_type: "ENGINEER", certification_number: "PE-NJ-4102", certification_expires_on: "2028-02-28T00:00:00Z", pe_license_state: "NJ" }
              as: Dispatcher
              captures: { eng_b_id: $.data.id }
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-4001", gear_type: "SLING", rated_wll_lb: 25000, weight_lb: 500, inspection_interval_days: 90 }
              as: SafetyManager
              captures: { gear_id: $.data.id }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "PASS", inspector_note: "initial acceptance" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: Dispatcher
              captures: { gear_v: $.data.version }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-7781", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T16:00:00Z", load_weight_lb: 73000, sail_area_sqft: 150.0, road_closure_requested: true }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/site-survey"
              payload: { confirmed_soil_bearing_capacity_psf: 2000, access_notes: "north gate", mat_inventory_available: true }
              as: Dispatcher
              captures: { plan_v1: $.data.version }
            - call: "POST /gear-assignments"
              payload: { lift_plan_id: "${plan_id}", gear_id: "${gear_id}", leg_count: 4, sling_angle_deg: 60, expected_gear_version: "${gear_v}" }
              as: Dispatcher
              captures: { ga_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/configure"
              payload: { crane_id: "${crane_id}", operator_id: "${op_id}", rigger_id: "${rig_id}", configuration: "MAIN_BOOM", boom_length_ft: 120, radius_ft: 40, parts_of_line: 8, block_weight_lb: 2000, jib_weight_lb: 0, aux_head_weight_lb: 0, expected_lift_plan_version: "${plan_v1}" }
              as: Dispatcher
              captures: { prov_variant: $.data.bearing_variant, prov_per_outrigger: $.data.per_outrigger_load_lb, prov_psf: $.data.bearing_pressure_psf, prov_mats: $.data.mat_count }
            - call: "POST /engineering-reviews"
              payload: { lift_plan_id: "${plan_id}", author_personnel_id: "${eng_a_id}", analysis_notes: "rev 1 analysis" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { er_id: $.data.id }
          trigger:
            - call: "POST /engineering-reviews/${er_id}/decision"
              payload: { action: "STAMP", note: "PE stamp applied" }
              as: Engineer
              as_user_id: "${eng_b_id}"
              captures: { final_psf_on_review: $.data.final_bearing_pressure_psf, final_mats_on_review: $.data.final_mat_count }
            - call: "GET /lift-plans/${plan_id}"
              payload: {}
              as: Dispatcher
              captures: { post_variant: $.data.bearing_variant, post_psf: $.data.bearing_pressure_psf, post_mats: $.data.mat_count }
          assert:
            - "${prov_variant} == PROVISIONAL_SURVEY"
            - "${prov_per_outrigger} == 90875.00"
            - "${prov_psf} == 2271.88"
            - "${prov_mats} == 8"
            - "${final_psf_on_review} == 5997.75"
            - "${final_mats_on_review} == 16"
            - "${post_variant} == FINAL_ENGINEERED"
            - "${post_psf} == 5997.75"
            - "${post_mats} == 16"
            - "LiftPlan.${plan_id}.per_outrigger_load_lb == 239910.00"
            - "LiftPlan.${plan_id}.plan_status == APPROVED"
            - "EngineeringReview.${er_id}.status == STAMPED"
            - "EngineeringReview.${er_id}.stamped_by_personnel_id == ${eng_b_id}"

      - name: invoice_hourly_vs_lump_sum_diverge_on_identical_job
        grounds:
          - calculations.invoice_line_rounding
          - calculations.invoice_discount_and_surcharge_order
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.billing_mode
          - state_machines.Invoice.DRAFT_to_VOIDED
        distinguishing_aspect: |
          This dual-variant lives in the financial domain on the Invoice entity, a different
          subject from the geotechnical dual-variant: the identical closed job (9.5 on-site
          hours, 1.5 travel hours, 62.3 travel miles, 3.25 merged standby hours, 45375 cent
          rate) totals 1011734 cents under HOURLY and 974016 cents under LUMP_SUM, because
          HOURLY bills a 4.0 hour minimum with 1.5x overtime plus separate mob/demob and no
          free standby, while LUMP_SUM absorbs mob/demob and forgives the first 2.0 standby hours.
        test_recipe:
          setup:
            - "The full canonical job has run to completion: plan CLOSED, field_status DEMOBILIZED, two adjacent CLOSED standby windows merged to 3.1667 raw hours and rounded up to standby_hours_billable 3.25."
            - "The assigned crane bills 45375 cents per hour with 250000 cents round-trip mob/demob."
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial", billing_terms: "NET_30" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Bergen Plant 4", jurisdiction_code: "NJ-BERGEN", soil_bearing_capacity_psf: 2000, proximity_to_energized_lines_ft: 45, over_water: false }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /cranes"
              payload: { model_code: "LTM-1250", class_tons: 275, gross_weight_lb: 190000, counterweight_lb: 100000, outrigger_pad_area_sqft: 40.0, max_line_pull_lb: 20000, rated_max_wind_mph: 30, annual_inspection_expires_on: "2027-06-30T00:00:00Z", mob_demob_cents: 250000, hourly_rate_cents: 45375 }
              as: Dispatcher
              captures: { crane_id: $.data.id }
            - call: "POST /load-chart-entries"
              payload: { crane_id: "${crane_id}", configuration: "MAIN_BOOM", boom_length_ft: 120, radius_ft: 40, gross_capacity_lb: 100000 }
              as: Dispatcher
            - call: "POST /personnel"
              payload: { full_name: "Ray Kolb", role_type: "OPERATOR", certification_number: "NCCCO-88421", certification_expires_on: "2027-03-31T00:00:00Z", endorsement_class_tons: 300 }
              as: Dispatcher
              captures: { op_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Dina Ruiz", role_type: "RIGGER", certification_number: "NCCER-5510", certification_expires_on: "2027-04-30T00:00:00Z", rigger_level: "ADVANCED" }
              as: Dispatcher
              captures: { rig_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Alan Pope", role_type: "ENGINEER", certification_number: "PE-NJ-3391", certification_expires_on: "2028-01-31T00:00:00Z", pe_license_state: "NJ" }
              as: Dispatcher
              captures: { eng_a_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Mei Sato", role_type: "ENGINEER", certification_number: "PE-NJ-4102", certification_expires_on: "2028-02-28T00:00:00Z", pe_license_state: "NJ" }
              as: Dispatcher
              captures: { eng_b_id: $.data.id }
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-4001", gear_type: "SLING", rated_wll_lb: 25000, weight_lb: 500, inspection_interval_days: 90 }
              as: SafetyManager
              captures: { gear_id: $.data.id }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "PASS", inspector_note: "initial acceptance" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: Dispatcher
              captures: { gear_v: $.data.version }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-7781", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T16:00:00Z", load_weight_lb: 73000, sail_area_sqft: 150.0, road_closure_requested: true }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/site-survey"
              payload: { confirmed_soil_bearing_capacity_psf: 2000, access_notes: "north gate", mat_inventory_available: true }
              as: Dispatcher
              captures: { plan_v1: $.data.version }
            - call: "POST /gear-assignments"
              payload: { lift_plan_id: "${plan_id}", gear_id: "${gear_id}", leg_count: 4, sling_angle_deg: 60, expected_gear_version: "${gear_v}" }
              as: Dispatcher
            - call: "POST /lift-plans/${plan_id}/configure"
              payload: { crane_id: "${crane_id}", operator_id: "${op_id}", rigger_id: "${rig_id}", configuration: "MAIN_BOOM", boom_length_ft: 120, radius_ft: 40, parts_of_line: 8, block_weight_lb: 2000, jib_weight_lb: 0, aux_head_weight_lb: 0, expected_lift_plan_version: "${plan_v1}" }
              as: Dispatcher
            - call: "POST /engineering-reviews"
              payload: { lift_plan_id: "${plan_id}", author_personnel_id: "${eng_a_id}", analysis_notes: "rev 1 analysis" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { er_id: $.data.id }
            - call: "POST /engineering-reviews/${er_id}/decision"
              payload: { action: "STAMP", note: "PE stamp applied" }
              as: Engineer
              as_user_id: "${eng_b_id}"
            - call: "POST /permits"
              payload: { lift_plan_id: "${plan_id}", permit_type: "ROAD_CLOSURE", jurisdiction_code: "NJ-BERGEN" }
              as: Dispatcher
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Dispatcher
            - call: "POST /permits/${permit_id}/record-decision"
              payload: { decision: "APPROVE", agency_reference: "NJB-2026-1188" }
              as: Dispatcher
            - call: "POST /lift-plans/${plan_id}/release"
              payload: {}
              as: LiftDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T06:00:00Z" }
              as: Dispatcher
            - call: "POST /lift-plans/${plan_id}/field-status"
              payload: { action: "MOBILIZE" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /lift-plans/${plan_id}/field-status"
              payload: { action: "START_LIFT" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /standby-events"
              payload: { lift_plan_id: "${plan_id}", cause: "WIND", wind_speed_mph: 24.0, started_at: "2026-09-10T09:00:00Z" }
              as: SafetyManager
              captures: { se1_id: $.data.id }
            - call: "POST /standby-events/${se1_id}/close"
              payload: { ended_at: "2026-09-10T11:00:00Z" }
              as: SafetyManager
            - call: "POST /lift-plans/${plan_id}/field-status"
              payload: { action: "RESUME" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /standby-events"
              payload: { lift_plan_id: "${plan_id}", cause: "WIND", wind_speed_mph: 22.0, started_at: "2026-09-10T11:00:00Z" }
              as: SafetyManager
              captures: { se2_id: $.data.id }
            - call: "POST /standby-events/${se2_id}/close"
              payload: { ended_at: "2026-09-10T12:10:00Z" }
              as: SafetyManager
            - call: "POST /lift-plans/${plan_id}/field-status"
              payload: { action: "RESUME" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /lift-plans/${plan_id}/field-status"
              payload: { action: "SECURE" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /lift-plans/${plan_id}/field-status"
              payload: { action: "DEMOBILIZE" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { plan_v_closed: $.data.version, standby_billable: $.data.standby_hours_billable }
          trigger:
            - call: "POST /invoices"
              payload: { lift_plan_id: "${plan_id}", billing_mode: "HOURLY", on_site_hours: 9.5, travel_hours: 1.5, travel_miles: 62.3, expected_lift_plan_version: "${plan_v_closed}" }
              as: BillingClerk
              captures: { inv_hourly_id: $.data.id, hourly_total: $.data.total_cents, hourly_subtotal: $.data.subtotal_cents }
            - call: "GET /lift-plans/${plan_id}"
              payload: {}
              as: BillingClerk
              captures: { plan_v_after_inv1: $.data.version }
            - call: "POST /invoices"
              payload: { lift_plan_id: "${plan_id}", billing_mode: "LUMP_SUM", on_site_hours: 9.5, travel_hours: 1.5, travel_miles: 62.3, lump_sum_cents: 850000, expected_lift_plan_version: "${plan_v_after_inv1}" }
              as: BillingClerk
              captures: { inv_lump_id: $.data.id, lump_total: $.data.total_cents, lump_subtotal: $.data.subtotal_cents }
          assert:
            - "${standby_billable} == 3.25"
            - "${hourly_subtotal} == 945546"
            - "${hourly_total} == 1011734"
            - "${lump_subtotal} == 910295"
            - "${lump_total} == 974016"
            - "${hourly_total} != ${lump_total}"
            - "Invoice.${inv_hourly_id}.line_mobdemob_cents == 250000 and Invoice.${inv_lump_id}.line_mobdemob_cents == 0"
            - "Invoice.${inv_hourly_id}.line_standby_cents == 110602 and Invoice.${inv_lump_id}.line_standby_cents == 42539"
            - "Invoice.${inv_hourly_id}.status == VOIDED  (superseded by the newer draft)"
            - "Invoice.${inv_lump_id}.status == DRAFT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: net_capacity_nested_min_over_chart_ceiling_and_line_pull
        grounds:
          - calculations.net_capacity_and_utilization
          - calculations.lift_class_determination
          - entities.LiftPlan.fields.chart_gross_capacity_lb
          - entities.LiftPlan.fields.hoist_line_capacity_lb
          - entities.LiftPlan.fields.net_capacity_lb
          - entities.LoadChartEntry.fields.radius_ft
        distinguishing_aspect: |
          Mode (a): four inputs interact non-linearly — a ceiling lookup that must pick the
          40 ft chart row (100000 lb) for a 38 ft request rather than the 50 ft row (78000 lb),
          a reeving-derived ceiling of 20000 * 4 = 80000 lb, a nested min() between the two,
          and a 2000 lb deduction — producing net_capacity_lb 78000 and utilization_pct 94.23,
          which the tier ladder then reads as ENGINEERED_CRITICAL.
        test_recipe:
          setup:
            - "A 275-ton crane carries TWO MAIN_BOOM/120 ft chart rows: radius 40 ft at 100000 lb and radius 50 ft at 78000 lb."
            - "A surveyed lift plan for a 73000 lb load holds one ACTIVE 500 lb sling assignment."
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Northgate Industrial" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Bergen Plant 4", jurisdiction_code: "NJ-BERGEN", soil_bearing_capacity_psf: 2000, proximity_to_energized_lines_ft: 45 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /cranes"
              payload: { model_code: "LTM-1250", class_tons: 275, gross_weight_lb: 190000, counterweight_lb: 100000, outrigger_pad_area_sqft: 40.0, max_line_pull_lb: 20000, rated_max_wind_mph: 30, annual_inspection_expires_on: "2027-06-30T00:00:00Z", mob_demob_cents: 250000, hourly_rate_cents: 45375 }
              as: Dispatcher
              captures: { crane_id: $.data.id }
            - call: "POST /load-chart-entries"
              payload: { crane_id: "${crane_id}", configuration: "MAIN_BOOM", boom_length_ft: 120, radius_ft: 40, gross_capacity_lb: 100000 }
              as: Dispatcher
            - call: "POST /load-chart-entries"
              payload: { crane_id: "${crane_id}", configuration: "MAIN_BOOM", boom_length_ft: 120, radius_ft: 50, gross_capacity_lb: 78000 }
              as: Dispatcher
            - call: "POST /personnel"
              payload: { full_name: "Ray Kolb", role_type: "OPERATOR", certification_number: "NCCCO-88421", certification_expires_on: "2027-03-31T00:00:00Z", endorsement_class_tons: 300 }
              as: Dispatcher
              captures: { op_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Dina Ruiz", role_type: "RIGGER", certification_number: "NCCER-5510", certification_expires_on: "2027-04-30T00:00:00Z", rigger_level: "MASTER" }
              as: Dispatcher
              captures: { rig_id: $.data.id }
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-4001", gear_type: "SLING", rated_wll_lb: 45000, weight_lb: 500, inspection_interval_days: 90 }
              as: SafetyManager
              captures: { gear_id: $.data.id }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "PASS", inspector_note: "initial acceptance" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: Dispatcher
              captures: { gear_v: $.data.version }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-7782", window_start: "2026-09-12T06:00:00Z", window_end: "2026-09-12T14:00:00Z", load_weight_lb: 73000, sail_area_sqft: 150.0 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/site-survey"
              payload: { confirmed_soil_bearing_capacity_psf: 2000, access_notes: "east lay-down", mat_inventory_available: true }
              as: Dispatcher
              captures: { plan_v1: $.data.version }
            - call: "POST /gear-assignments"
              payload: { lift_plan_id: "${plan_id}", gear_id: "${gear_id}", leg_count: 4, sling_angle_deg: 60, expected_gear_version: "${gear_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /lift-plans/${plan_id}/configure"
              payload: { crane_id: "${crane_id}", operator_id: "${op_id}", rigger_id: "${rig_id}", configuration: "MAIN_BOOM", boom_length_ft: 120, radius_ft: 38, parts_of_line: 4, block_weight_lb: 2000, jib_weight_lb: 0, aux_head_weight_lb: 0, expected_lift_plan_version: "${plan_v1}" }
              as: Dispatcher
              captures: { chart_gross: $.data.chart_gross_capacity_lb, hoist_cap: $.data.hoist_line_capacity_lb, net_cap: $.data.net_capacity_lb, util: $.data.utilization_pct, cls: $.data.lift_class }
          assert:
            - "${chart_gross} == 100000   (ceiling lookup picked the 40 ft row, not the 50 ft row)"
            - "${hoist_cap} == 80000"
            - "${net_cap} == 78000"
            - "LiftPlan.${plan_id}.total_load_lb == 73500"
            - "${util} == 94.23"
            - "${cls} == ENGINEERED_CRITICAL"
            - "LiftPlan.${plan_id}.plan_status == PENDING_ENGINEERING"

      - name: invoice_subtotal_rounds_each_line_before_summing
        grounds:
          - calculations.invoice_line_rounding
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.line_overtime_cents
          - entities.Invoice.fields.line_standby_cents
          - entities.Invoice.fields.line_travel_cents
        distinguishing_aspect: |
          Mode (b): three of the five HOURLY lines land on fractional cents (204187.5,
          110601.5625 and 17755.5). Rounding each line first and summing gives subtotal_cents
          945546; summing the raw values and rounding once gives 945545. The scaffold pins
          round-per-line-then-sum, so the correct answer is exactly 945546 and the wrong
          reading is off by one cent.
