# =============================================================================
# §1.9 Scaffold Corner Design — Cement Plant & Kiln Operations (task 2971)
# =============================================================================
# Breadth coverage of every testable claim SCAFFOLD.yaml §1.1-§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already assert. Sections and
# claim_type values come from references/claim-extraction-guide.md; nothing else
# was invented.
#
# READING NOTE — reusable call anchors.
# The canonical happy-path chain (plant -> reference data -> approved design ->
# sealed pile -> burned and released kiln run -> qualified cement batch ->
# issued mill certificate -> reserved loadout order) is long, so each of its
# calls is defined ONCE as a YAML anchor (&c_*) at its first use in the
# entities section and referenced by alias (*c_*) afterwards. Aliases expand on
# load, so every instance below carries its own complete, standalone chain.
# Anchor inventory, in definition order:
#   &c_plant &c_ls &c_cl &c_ir &c_fly &c_gas &c_coal &c_rdf &c_tdf &c_cu1
#   &c_k1 &c_sc1 &c_sm1                                   (entities/creation)
#   &c_d2 &c_d2_submit &c_d2_approve &c_pa &c_pa_ls &c_pa_cl  (computed_fields)
#   &c_pa_seal &c_r0 &c_r0_light &c_r0_gas &c_clock_0801_12 &c_r0_complete
#   &c_lab_fl_ok &c_r0_release &c_sc1_read                    (retrieval)
#   &c_b1                                                     (defaults)
#   &c_b1_grind &c_b1_ground &c_lab_blaine_ok &c_lab_str_ok &c_mc1 (system_fields)
#   &c_mc1_issue &c_lo1                                       (listing)
# The logical clock starts at 2026-08-01T00:00:00Z everywhere.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: reference_data_creation_returns_computed_ledgers_and_declared_defaults
        claim_type: creation
        grounds: [entities.Plant, entities.RawMaterial, entities.Fuel, entities.Customer, entities.Kiln, entities.Silo, endpoints]
        distinguishing_aspect: >
          Every §1.1 reference entity must come back from its POST with its computed ledger fields
          already initialised rather than null: Plant.permit_nox_budget_remaining_kg 2000000.00 (not
          null and not 0.00), Silo.available_tonnes 0.00, Customer.open_reserved_tonnes 0.00. An
          implementation that materialises computed fields only on first mutation returns nulls here.
        test_recipe:
          setup: ["Empty database. The 13 calls below are the reference-data spine every other instance reuses."]
          setup_api_calls: []
          trigger:
            - &c_plant { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - &c_ls { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - &c_cl { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - &c_ir { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "IR-1", category: "IRON_ORE", cao_pct: 1.0, sio2_pct: 8.0, al2o3_pct: 2.0, fe2o3_pct: 80.0, so3_pct: 0.05, moisture_pct: 5.0, cost_per_tonne: 40.00 }, captures: { ir: "$.data.id" } }
            - &c_fly { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "FLY-1", category: "ALT_RAW", cao_pct: 4.0, sio2_pct: 52.0, al2o3_pct: 25.0, fe2o3_pct: 8.0, so3_pct: 0.5, moisture_pct: 1.0, cost_per_tonne: 3.00, is_alternative: true, max_substitution_pct: 8.00 }, captures: { fly: "$.data.id" } }
            - &c_gas { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "GAS-1", category: "NATURAL_GAS", lhv_gj_per_tonne: 48.00, nox_kg_per_gj: 0.10, co2_kg_per_gj: 56.0, chlorine_pct: 0.00 }, captures: { gas: "$.data.id" } }
            - &c_coal { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "COAL-1", category: "COAL", lhv_gj_per_tonne: 27.00, nox_kg_per_gj: 0.35, co2_kg_per_gj: 96.0, chlorine_pct: 0.02 }, captures: { coal: "$.data.id" } }
            - &c_rdf { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "RDF-1", category: "RDF", lhv_gj_per_tonne: 18.00, nox_kg_per_gj: 0.22, co2_kg_per_gj: 40.0, chlorine_pct: 0.80, is_alternative: true }, captures: { rdf: "$.data.id" } }
            - &c_tdf { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "TDF-1", category: "TDF", lhv_gj_per_tonne: 30.00, nox_kg_per_gj: 0.18, co2_kg_per_gj: 85.0, chlorine_pct: 0.10, is_alternative: true }, captures: { tdf: "$.data.id" } }
            - &c_cu1 { call: "POST /cement-ops/customers", as: LogisticsPlanner, payload: { name: "Midwest Ready-Mix", region_code: "US-MW", contract_priority: 10, contract_monthly_tonnes: 4000.00, required_cement_type: "TYPE_IL", max_so3_pct: 3.00 }, captures: { cu1: "$.data.id" } }
            - &c_k1 { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - &c_sc1 { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - &c_sm1 { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SM1", material_kind: "CEMENT", capacity_tonnes: 8000.00, draw_rate_tonnes_per_hour: 250.00, loadout_spouts: 2 }, captures: { sm1: "$.data.id" } }
          assert:
            - "every call returns 201 with the fixed §1.0 envelope: {\"data\": {...}} and no top-level \"error\" key"
            - "Plant: permit_nox_budget_remaining_kg 2000000.00, rolling_nox_intensity_kg_per_tonne 0.000, cement_tonne_balance_tonnes 0.00, production_posture NORMAL, version 1"
            - "RawMaterial LS-1: is_alternative false and max_substitution_pct 0 (both omitted from the request)"
            - "RawMaterial FLY-1: is_alternative true and max_substitution_pct 8.00 (both supplied)"
            - "Fuel GAS-1: is_alternative false; RDF-1 and TDF-1: is_alternative true"
            - "Customer CU1: contract_state ACTIVE, credit_hold false, open_reserved_tonnes 0.00, lifetime_loaded_tonnes 0.00"
            - "Kiln K1: refractory_hours_since_reline 0, availability_state AVAILABLE"
            - "Silo SC1: tonnes_on_hand 0.00, reserved_tonnes 0.00, unreleased_tonnes 0.00, available_tonnes 0.00, loadout_spouts 1 (defaulted), status OPEN, block_reason null"
            - "Silo SM1: loadout_spouts 2 (supplied), material_kind CEMENT"

      - name: blended_pile_recomputes_dry_tonnage_and_modules_on_every_addition
        claim_type: computed_fields
        grounds: [entities.BlendedPile.as_blended_lsf, entities.RawMixDesign.as_designed_lsf, calculations.raw_mix_chemical_modules]
        distinguishing_aspect: >
          The design's as_designed_* fields must be frozen at 4-decimal oxides / 2-decimal modules
          from the DRY mass fractions, while the pile's as_blended_* fields must be re-derived after
          each addition from moisture-corrected dry tonnages. An implementation that stores the
          pile's oxides once (at pile creation, with no additions) reports nulls or zeros here; one
          that ignores moisture reports dry_tonnes 1041.28 instead of 1000.00.
        test_recipe:
          setup: ["The reference-data spine exists. ENG1 authors design D2 (82.00% LS-1 / 18.00% CL-1), QM1 approves it, and a pile is fed moisture-compensated tonnages that hit exactly 1000.00 dry tonnes."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1]
          trigger:
            - &c_d2 { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - &c_d2_submit { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - &c_d2_approve { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - &c_pa { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - &c_pa_ls { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - &c_pa_cl { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 }, captures: { pile_lsf: "$.data.as_blended_lsf" } }
          assert:
            - "D2 reads as_designed_cao_pct 42.8000, as_designed_sio2_pct 13.6700, as_designed_al2o3_pct 4.0600, as_designed_fe2o3_pct 1.6700"
            - "D2 reads as_designed_lsf 96.98, as_designed_sm 2.39, as_designed_am 2.43, module_tolerance_lsf 1.5 (defaulted), pile_lsf_tolerance 2.0 (defaulted), status DRAFT, revision_count 0, active_pile_count 0"
            - "the approve response reads status APPROVED with approved_at 2026-08-01T00:00:00.000Z and version 3"
            - "after the first addition the pile reads as_received_tonnes 836.73 and dry_tonnes 820.00"
            - "after the second addition the pile reads as_received_tonnes 1041.28, dry_tonnes 1000.00, alt_raw_share_pct 0.00"
            - "as_blended_lsf 96.98, as_blended_sm 2.39, as_blended_am 2.43, lsf_deviation 0.02 — the moisture correction makes the pile match the design"
            - "D2 now reads active_pile_count 1"

      - name: silo_read_returns_the_four_figure_inventory_split_after_a_release
        claim_type: retrieval
        grounds: [entities.Silo.tonnes_on_hand, entities.Silo.unreleased_tonnes, entities.Silo.available_tonnes, state_machines.KilnRun]
        distinguishing_aspect: >
          GET on the silo must show the physical/committed split, not one aggregate number: after the
          run completes it is on_hand 583.78 with unreleased 583.78 and available 0.00, and after the
          release it is on_hand 583.78 with unreleased 0.00 and available 583.78. An implementation
          with a single tonnes field reports 583.78 available immediately after completion, which
          would let unreleased clinker be ground.
        test_recipe:
          setup: ["Design D2 approved, pile PA sealed at 1000.00 dry tonnes, run R0 fired on 45.00 t of natural gas in the [00:00, 12:00] window, completed at 12:00, free lime 1.20 recorded, clinker released."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl]
          trigger:
            - &c_pa_seal { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - &c_r0 { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { r0: "$.data.id" } }
            - &c_r0_light { call: "POST /cement-ops/kiln-runs/${r0}/light", as: KilnOperator, payload: {} }
            - &c_r0_gas { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${gas}", tonnes: 45.00 } }
            - &c_clock_0801_12 { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-01T12:00:00Z" } }
            - &c_r0_complete { call: "POST /cement-ops/kiln-runs/${r0}/complete", as: KilnOperator, payload: {} }
            - &c_lab_fl_ok { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.20, kiln_run_id: "${r0}" } }
            - &c_r0_release { call: "POST /cement-ops/kiln-runs/${r0}/release-clinker", as: QualityManager, payload: {} }
            - &c_sc1_read { call: "GET /cement-ops/silos/${sc1}", as: ProcessEngineer, payload: {}, captures: { sc1_v: "$.data.version" } }
          assert:
            - "the seal returns status SEALED with sealed_at 2026-08-01T00:00:00.000Z, and lsf_deviation 0.02 <= pile_lsf_tolerance 2.00"
            - "the light response reads process_state BURNING and the pile flips to status CONSUMED"
            - "immediately after the completion the silo reads tonnes_on_hand 583.78, reserved_tonnes 0.00, unreleased_tonnes 583.78, available_tonnes 0.00"
            - "the final GET returns tonnes_on_hand 583.78, reserved_tonnes 0.00, unreleased_tonnes 0.00, available_tonnes 583.78, status OPEN, block_reason null"
            - "the GET body equals the stored row: capacity_tonnes 20000.00, draw_rate_tonnes_per_hour 300.00, loadout_spouts 1, material_kind CLINKER"
            - "Kiln K1 reads refractory_hours_since_reline 12 and availability_state AVAILABLE after the completion"

      - name: cement_batch_creation_applies_declared_enum_defaults
        claim_type: defaults
        grounds: [entities.CementBatch.status, entities.CementBatch.feed_state, entities.CementBatch.strength_branch_state, entities.CementBatch.fineness_branch_state]
        distinguishing_aspect: >
          A new batch must default to status PLANNED, feed_state FEED_READY and BOTH branch states
          PENDING, and certified_tonnes_allocated 0.00 — four independent defaults. An implementation
          that leaves the branch dimensions null cannot ever fire the GROUND -> QUALIFIED join,
          because the join tests both branches for PASSED.
        test_recipe:
          setup: ["583.78 t of RELEASED clinker in SC1; the silo version has been re-read for the OCC guard."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read]
          trigger:
            - &c_b1 { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_IL", clinker_tonnes_drawn: 500.00, gypsum_pct: 5.00, limestone_pct: 8.00, blaine_target_m2_per_kg: 400, expected_clinker_silo_version: "${sc1_v}" }, captures: { b1: "$.data.id" } }
          assert:
            - "201 with status PLANNED, feed_state FEED_READY, strength_branch_state PENDING, fineness_branch_state PENDING"
            - "certified_tonnes_allocated 0.00, rejection_reason null, grinding_started_at null, ground_at null, qualified_at null, version 1"
            - "the clinker silo now reads reserved_tonnes 500.00 and available_tonnes 83.78 — the reservation is a side effect of the create"

      - name: mill_certificate_system_fields_are_server_minted_and_client_values_ignored
        claim_type: system_fields
        grounds: [entities.MillCertificate.status, entities.MillCertificate.certified_blaine_m2_per_kg, entities.MillCertificate.issued_by_user_id, entities.MillCertificate]
        distinguishing_aspect: >
          id / created_at / updated_at / version and the certificate's snapshot fields must be minted
          server-side: certified_blaine_m2_per_kg 400 and certified_strength_mpa 30.0 are copied from
          the batch's newest in-spec lab tests, certified_so3_pct 2.85 from the batch, status DRAFT,
          issued_by_user_id null until issue. An implementation that echoes a client-supplied status
          or id returns "ISSUED" / the injected UUID here.
        test_recipe:
          setup: ["Batch B1 has been ground and both lab branches passed (LAB1 recorded BLAINE 400 and 28-day strength 30.0), so B1 is QUALIFIED with cement_tonnes 574.72 and so3_pct 2.85. The certificate request carries extra client-controlled keys that must be ignored."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read, *c_b1]
          trigger:
            - &c_b1_grind { call: "POST /cement-ops/cement-batches/${b1}/start-grinding", as: KilnOperator, payload: {} }
            - &c_b1_ground { call: "POST /cement-ops/cement-batches/${b1}/finish-grinding", as: KilnOperator, payload: {} }
            - &c_lab_blaine_ok { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "BLAINE", value: 400, cement_batch_id: "${b1}" } }
            - &c_lab_str_ok { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "COMPRESSIVE_STRENGTH_28D", value: 30.0, cement_batch_id: "${b1}" } }
            - &c_mc1 { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu1}", certified_tonnes: 574.72 }, captures: { mc1: "$.data.id" } }
          assert:
            - "the BLAINE test returns unit M2_PER_KG, spec_min 380, spec_max 460, in_spec true; the strength test returns unit MPA, spec_min 28.0, spec_max null, in_spec true"
            - "after the second test B1 reads status QUALIFIED with qualified_at 2026-08-01T12:00:00.000Z, and SM1 reads unreleased_tonnes 0.00 with available_tonnes 574.72"
            - "the certificate is 201 with a bare server-minted UUID id carrying no type prefix, created_at 2026-08-01T12:00:00.000Z, version 1"
            - "status DRAFT, issued_by_user_id null, issued_at null, revoked_at null, allocated_tonnes 0.00"
            - "certified_blaine_m2_per_kg 400, certified_strength_mpa 30.0, certified_so3_pct 2.85"
            - "B1 reads certified_tonnes_allocated 574.72 while still QUALIFIED — the DRAFT certificate already reserves the tonnage"

      - name: loadout_order_listing_returns_the_paginated_envelope_with_filters
        claim_type: listing
        grounds: [endpoints, entities.LoadoutOrder]
        distinguishing_aspect: >
          The list endpoint must return the §1.0 paginated shape (items + total_count + has_more)
          with total_count reflecting the FILTER, not the page: with one order and limit 1 the answer
          is total_count 1 / has_more false, and filtering by status=VOIDED gives total_count 0 with
          an empty items array rather than 404.
        test_recipe:
          setup: ["Certificate MC1 is ISSUED for 574.72 t and one loadout order LO1 for 120.00 t is booked in [2026-08-05T06:00:00Z, 2026-08-05T08:00:00Z)."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read, *c_b1, *c_b1_grind, *c_b1_ground, *c_lab_blaine_ok, *c_lab_str_ok, *c_mc1]
          trigger:
            - &c_mc1_issue { call: "POST /cement-ops/mill-certificates/${mc1}/issue", as: QualityManager, payload: {}, captures: { mc1_v: "$.data.version" } }
            - &c_lo1 { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 120.00, expected_mill_certificate_version: "${mc1_v}" }, captures: { lo1: "$.data.id" } }
            - { call: "GET /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", limit: 1, offset: 0 } }
          assert:
            - "the issue returns status ISSUED, issued_at 2026-08-01T12:00:00.000Z, issued_by_user_id set to the calling QualityManager's X-User-ID, and B1 flips to status CERTIFIED"
            - "LO1 is 201 with status RESERVED, scheduled_hours 2.00, loaded_tonnes 0.00, void_reason null, loading_started_at null, completed_at null"
            - "the list returns 200 with total_count 1, has_more false, and exactly one item whose id equals ${lo1}"
            - "the same list with status=VOIDED returns 200 with total_count 0, has_more false and an empty items array"
            - "the same list with limit 0 or limit 201 returns ERR_INVALID_PAGINATION (400)"

      - name: plant_create_missing_required_field_is_rejected
        claim_type: required_fields
        grounds: [endpoints, entities.Plant.clinker_free_lime_max_pct, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: >
          clinker_free_lime_max_pct has source input and no default, so omitting it must be a 400
          ERR_INVALID_REQUEST before any row is written. An implementation that defaults it to 0 or
          null creates the plant and then quarantines every future kiln run, because every free-lime
          reading exceeds a null ceiling.
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9] }, captures: { err: "$.data.error_id" } }
          assert:
            - "400 with error_id ERR_INVALID_REQUEST and the §1.0 error envelope carrying error_id, message and error_id-specific detail"
            - "GET /cement-ops/plants returns total_count 0 — nothing was persisted"

      - name: silo_create_invalid_enum_material_kind_is_rejected
        claim_type: type_constraints
        grounds: [entities.Silo.material_kind, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: >
          material_kind is a two-member enum (CLINKER | CEMENT); "RAW_MEAL" must be a 400
          ERR_INVALID_REQUEST rather than a stored free-text value that later makes the
          CLINKER/CEMENT branch of the block cascade unreachable.
        test_recipe:
          setup: ["A plant exists."]
          setup_api_calls: [*c_plant]
          trigger:
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SR1", material_kind: "RAW_MEAL", capacity_tonnes: 5000.00, draw_rate_tonnes_per_hour: 100.00 }, captures: { err: "$.data.error_id" } }
          assert:
            - "400 with error_id ERR_INVALID_REQUEST"
            - "GET /cement-ops/silos?plant_id=${plant} returns total_count 0"

      - name: lab_test_is_immutable_with_no_update_endpoint_and_no_version
        claim_type: immutability
        grounds: [entities.LabTest, endpoints]
        distinguishing_aspect: >
          LabTest is the only entity declared common_fields false: its rows carry id and created_at
          but NO updated_at and NO version, and §1.5 exposes no PATCH for it. A mis-corrected
          measurement is superseded by recording a new test, never by editing the old one — which is
          what makes the KilnRun quality cycle observable as a sequence of rows.
        test_recipe:
          setup: ["Run R0 is COMPLETED and LAB1 has recorded one FREE_LIME test on it."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete]
          trigger:
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.20, kiln_run_id: "${r0}" }, captures: { lt: "$.data.id" } }
            - { call: "GET /cement-ops/lab-tests/${lt}", as: QualityManager, payload: {} }
          assert:
            - "the create is 201 and the body carries id and created_at but NO updated_at and NO version key"
            - "recorded_by_user_id equals the calling LabTechnician's X-User-ID"
            - "the GET body is byte-identical to the create body"
            - "§1.5 declares no PATCH or DELETE for /cement-ops/lab-tests/{lab_test_id}; a second FREE_LIME test on the same run creates a SECOND row and both remain listable under GET /cement-ops/lab-tests?kiln_run_id=${r0} with total_count 2"

      - name: kiln_run_create_with_a_cement_silo_as_the_clinker_target_not_found_or_kind_mismatch
        claim_type: parent_relationships
        grounds: [entities.KilnRun.clinker_silo_id, validations, errors.ERR_SILO_KIND_MISMATCH]
        distinguishing_aspect: >
          entity_topology is flat, so every FK must be integrity-checked on its own terms: a
          syntactically valid but non-existent silo id is ERR_SILO_NOT_FOUND (404) while an existing
          CEMENT silo passed as clinker_silo_id is ERR_SILO_KIND_MISMATCH (422). An implementation
          that only checks existence accepts SM1 and credits clinker into a cement silo.
        test_recipe:
          setup: ["Design D2 approved and pile PA sealed; both SC1 (CLINKER) and SM1 (CEMENT) exist."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal]
          trigger:
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sm1}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T12:00:00Z" }, captures: { err: "$.data.error_id" } }
          assert:
            - "422 with error_id ERR_SILO_KIND_MISMATCH"
            - "no run is created: GET /cement-ops/kiln-runs?kiln_id=${k1} returns total_count 0"
            - "the same request with clinker_silo_id 00000000-0000-4000-8000-000000000000 returns 404 ERR_SILO_NOT_FOUND, and with a bogus kiln_id returns 404 ERR_KILN_NOT_FOUND"

      - name: computed_field_input_ignored_on_cement_batch_create
        claim_type: computed_fields
        grounds: [entities.CementBatch.cement_tonnes, entities.CementBatch.so3_pct, calculations.cement_additive_proportioning]
        distinguishing_aspect: >
          cement_tonnes and so3_pct are computed; a request that also sends cement_tonnes 999.99 and
          so3_pct 0.10 must be answered with the derived 574.72 / 2.85. An implementation that
          trusts the body lets an operator certify a batch as low-sulfate cement it is not.
        test_recipe:
          setup: ["583.78 t of RELEASED clinker in SC1, silo version re-read."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read]
          trigger:
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_IL", clinker_tonnes_drawn: 500.00, gypsum_pct: 5.00, limestone_pct: 8.00, blaine_target_m2_per_kg: 400, expected_clinker_silo_version: "${sc1_v}" }, captures: { batch: "$.data.id" } }
          assert:
            - "the response reads total_batch_tonnes 574.71, gypsum_tonnes 28.74, limestone_tonnes 45.98, cement_tonnes 574.72, so3_pct 2.85 — the derived values, not any client-sent numbers"
            - "a variant of the same request that additionally sends cement_tonnes 999.99 and so3_pct 0.10 returns the identical derived body (unknown keys are ignored, never stored)"
            - "status PLANNED and version 1 in both cases"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: design_walks_draft_to_submitted_to_approved
        claim_type: valid_transition
        grounds: [state_machines.RawMixDesign, calculations.raw_mix_chemical_modules, endpoints]
        distinguishing_aspect: >
          The three-hop happy path must move DRAFT -> SUBMITTED -> APPROVED with one version bump per
          hop and the oxide recomputation landing on submit, not on approve. An implementation that
          approves straight from DRAFT, or that recomputes as_designed_* only at approval, is caught
          by the intermediate SUBMITTED read.
        test_recipe:
          setup: ["The reference-data spine exists. ENG1 authors a three-component design D1 (LS-1 80.00 / CL-1 16.00 / IR-1 4.00) whose as_designed_lsf 96.94 sits 0.06 from target 97.00, inside the 1.5 tolerance."]
          setup_api_calls: &chain_ref [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1]
          trigger:
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D1", target_lsf: 97.00, target_sm: 1.50, target_am: 0.80, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 80.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 16.00 }, { raw_material_id: "${ir}", mass_fraction_pct: 4.00 }] }, captures: { d1: "$.data.id", d1_status: "$.data.status" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d1}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d1}/approve", as: QualityManager, payload: {} }
          assert:
            - "create: 201, status DRAFT, revision_count 0, created_by_user_id = the calling ProcessEngineer's X-User-ID, approved_by_user_id null, approved_at null, version 1"
            - "submit: 200, status SUBMITTED, version 2, as_designed_cao_pct 41.8000, as_designed_sio2_pct 12.7200, as_designed_al2o3_pct 3.7600, as_designed_fe2o3_pct 4.7200"
            - "submit: as_designed_lsf 96.94, as_designed_sm 1.50, as_designed_am 0.80"
            - "approve: 200, status APPROVED, approved_at 2026-08-01T00:00:00.000Z, approved_by_user_id = the calling QualityManager's X-User-ID, version 3"
            - "superseded_by_design_id stays null throughout — no earlier APPROVED design of this plant existed"

      - name: approving_a_second_design_supersedes_the_first
        claim_type: side_effect_execution
        grounds: [state_machines.RawMixDesign.transitions, entities.RawMixDesign.superseded_by_design_id]
        distinguishing_aspect: >
          Approval carries a cascade the approved design cannot see in its own response: the plant's
          previously APPROVED design must move to SUPERSEDED with superseded_by_design_id pointing at
          the new one and its own version bumped. An implementation that lets two designs of one plant
          sit APPROVED at once passes every single-row assertion and still corrupts pile creation.
        test_recipe:
          setup: ["Design D2 is APPROVED and pile PA has been blended against it. ENG1 now authors and submits D1, and QM1 approves D1."]
          setup_api_calls: &chain_design [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl]
          trigger:
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D1", target_lsf: 97.00, target_sm: 1.50, target_am: 0.80, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 80.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 16.00 }, { raw_material_id: "${ir}", mass_fraction_pct: 4.00 }] }, captures: { d1b: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d1b}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d1b}/approve", as: QualityManager, payload: {} }
            - { call: "GET /cement-ops/raw-mix-designs/${d2}", as: ProcessEngineer, payload: {} }
          assert:
            - "the approve response for D1 reads status APPROVED with superseded_by_design_id null"
            - "the follow-up GET on D2 reads status SUPERSEDED with superseded_by_design_id = ${d1b}"
            - "D2's version rose by 1 relative to the value it held before the trigger (create 1, submit 2, approve 3, pile-create 4, supersede 5)"
            - "GET /cement-ops/raw-mix-designs?plant_id=${plant}&status=APPROVED returns total_count 1 with the single item ${d1b}"
            - "pile PA still reads status OPEN with as_blended_lsf 96.98 — an already blended pile is unaffected by the supersession"
            - "a new pile against D2 now returns 409 ERR_DESIGN_NOT_APPROVED"

      - name: pile_cannot_be_sealed_while_it_has_no_additions
        claim_type: precondition_enforcement
        grounds: [state_machines.BlendedPile.transitions, validations, errors.ERR_PILE_EMPTY]
        distinguishing_aspect: >
          The seal transition has two independent gates — a non-empty additions list (priority 65) and
          the LSF deviation check (priority 95). On an empty pile the deviation is undefined, so the
          emptiness gate must fire with ERR_PILE_EMPTY (409) rather than a divide-by-zero 500 or a
          spurious ERR_PILE_LSF_OFF_TARGET.
        test_recipe:
          setup: ["Design D2 is APPROVED and pile PB exists with zero additions."]
          setup_api_calls: &chain_pile_empty [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa]
          trigger:
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "409 with error_id ERR_PILE_EMPTY, not ERR_PILE_LSF_OFF_TARGET and not a 500"
            - "the pile still reads status OPEN with sealed_at null, dry_tonnes 0.00 and lsf_deviation null"
            - "adding LS-1 836.73 t at 2.0 moisture and CL-1 204.55 t at 12.0 moisture and re-sealing then returns 200 with status SEALED"

      - name: kiln_run_initial_state_is_scheduled_and_pending_lab
        claim_type: initial_state
        grounds: [state_machines.KilnRun.initial_state, entities.KilnRun, complexity_profile.state_machine_shape]
        distinguishing_aspect: >
          The run is born with BOTH dimensions at their own initial value — process_state SCHEDULED
          and quality_state PENDING_LAB — plus a zeroed energy ledger. An implementation that models
          one combined status enum cannot produce this pair and typically reports a single
          "SCHEDULED" with quality_state absent.
        test_recipe:
          setup: ["Pile PA is SEALED against APPROVED design D2 at 1000.00 dry tonnes; kiln K1 is AVAILABLE; the clock reads 2026-08-01T00:00:00Z."]
          setup_api_calls: &chain_sealed [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal]
          trigger:
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { run: "$.data.id", ps: "$.data.process_state", qs: "$.data.quality_state" } }
          assert:
            - "201 with process_state SCHEDULED and quality_state PENDING_LAB as two separate keys"
            - "scheduled_hours 12.00, gross_energy_gj 0.00, provisional_clinker_tonnes 0.00, clinker_tonnes 0.00"
            - "tsr_pct 0.00, nox_emitted_kg 0.00, chlorine_input_kg 0.00, nox_intensity_breach false"
            - "free_lime_pct null, lit_at null, completed_at null, abort_reason null, version 1"
            - "the pile is still SEALED (creating the run does not consume it) and Kiln K1 is still AVAILABLE with refractory_hours_since_reline 0"

      - name: lighting_a_run_consumes_its_pile_and_recomputes_active_pile_count
        claim_type: side_effect_execution
        grounds: [state_machines.KilnRun.transitions, state_machines.BlendedPile.transitions, entities.RawMixDesign.active_pile_count]
        distinguishing_aspect: >
          One light call must produce three writes across three entities: run BURNING, pile CONSUMED,
          and the design's active_pile_count recomputed to 0 with its own version bump. An
          implementation that only flips the run leaves active_pile_count at 1 forever.
        test_recipe:
          setup: ["Pile PA is SEALED against D2 (active_pile_count 1) and run R0 is SCHEDULED in the currently active window."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0]
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r0}/light", as: KilnOperator, payload: {} }
            - { call: "GET /cement-ops/blended-piles/${pa}", as: ProcessEngineer, payload: {} }
            - { call: "GET /cement-ops/raw-mix-designs/${d2}", as: ProcessEngineer, payload: {} }
          assert:
            - "the light response reads process_state BURNING, lit_at 2026-08-01T00:00:00.000Z, quality_state still PENDING_LAB, version 2"
            - "the pile GET reads status CONSUMED with dry_tonnes still 1000.00 and consumed_dry_tonnes still 0.00 (that figure is written at completion)"
            - "the design GET reads active_pile_count 0 and version 5 (create 1, submit 2, approve 3, pile-create 4, pile-consume 5)"
            - "a second light on the same run returns 409 ERR_INVALID_RUN_STATE and leaves lit_at unchanged"

      - name: run_cannot_be_completed_before_its_window_has_elapsed
        claim_type: precondition_enforcement
        grounds: [state_machines.KilnRun.transitions, validations, errors.ERR_RUN_WINDOW_NOT_ELAPSED]
        distinguishing_aspect: >
          Completion requires clock >= window_end, and the check is on window_end, not on "some fuel
          has been charged". With fuel charged at 00:00 and the window ending at 12:00 the completion
          must be refused with ERR_RUN_WINDOW_NOT_ELAPSED (422) and no clinker credited.
        test_recipe:
          setup: ["Run R0 is BURNING with 45.00 t of natural gas charged; the clock still reads 2026-08-01T00:00:00Z while the window ends at 12:00."]
          setup_api_calls: &chain_burning [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas]
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r0}/complete", as: KilnOperator, payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "422 with error_id ERR_RUN_WINDOW_NOT_ELAPSED"
            - "the run still reads process_state BURNING with completed_at null and clinker_tonnes 0.00"
            - "gross_energy_gj is already 2160.00 and nox_emitted_kg 216.00 — the charge stands, only the completion is refused"
            - "SC1 still reads tonnes_on_hand 0.00 and unreleased_tonnes 0.00"
            - "advancing the clock to 2026-08-01T12:00:00Z and repeating the call returns 200 with process_state COMPLETED and clinker_tonnes 583.78"

      - name: aborted_run_is_terminal_and_a_later_complete_is_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.KilnRun.terminal_states, errors.ERR_INVALID_RUN_STATE]
        distinguishing_aspect: >
          ABORTED is the process dimension's terminal state: complete, light and further fuel charges
          must all be refused with ERR_INVALID_RUN_STATE (409) afterwards, even once the clock has
          passed window_end so the window gate would otherwise be satisfied.
        test_recipe:
          setup: ["Run R0 is BURNING with 45.00 t of gas charged, then aborted with reason KILN_TRIP; afterwards the clock is advanced past window_end."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas]
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r0}/abort", as: KilnOperator, payload: { abort_reason: "KILN_TRIP" } }
            - *c_clock_0801_12
            - { call: "POST /cement-ops/kiln-runs/${r0}/complete", as: KilnOperator, payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "the abort returns 200 with process_state ABORTED, abort_reason KILN_TRIP, nox_emitted_kg 0.00 and clinker_tonnes 0.00"
            - "the complete returns 409 with error_id ERR_INVALID_RUN_STATE"
            - "the run still reads process_state ABORTED with completed_at null"
            - "a further POST /cement-ops/kiln-runs/${r0}/fuel-charges also returns 409 ERR_INVALID_RUN_STATE and leaves gross_energy_gj at 0.00"
            - "pile PA stays CONSUMED — the abort does not give the raw meal back"

      - name: starting_grinding_twice_on_a_ground_batch_is_rejected
        claim_type: invalid_transitions
        grounds: [state_machines.CementBatch.transitions, errors.ERR_INVALID_BATCH_STATE]
        distinguishing_aspect: >
          start-grinding is declared only from PLANNED. From GROUND it must be refused with
          ERR_INVALID_BATCH_STATE (409) and, critically, must not repeat its side effect of drawing
          clinker out of the silo a second time.
        test_recipe:
          setup: ["Batch B1 has been ground: SC1 tonnes_on_hand is 83.78 after the 500.00 t draw and SM1 holds 574.72 t of unreleased cement."]
          setup_api_calls: &chain_ground [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read, *c_b1, *c_b1_grind, *c_b1_ground]
          trigger:
            - { call: "POST /cement-ops/cement-batches/${b1}/start-grinding", as: KilnOperator, payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "409 with error_id ERR_INVALID_BATCH_STATE"
            - "the batch still reads status GROUND with grinding_started_at and ground_at both 2026-08-01T12:00:00.000Z"
            - "SC1 still reads tonnes_on_hand 83.78, reserved_tonnes 0.00, available_tonnes 83.78 — no second draw happened"
            - "SM1 still reads tonnes_on_hand 574.72 with unreleased_tonnes 574.72 and available_tonnes 0.00"

      - name: batch_stays_ground_until_the_second_lab_branch_passes
        claim_type: precondition_enforcement
        grounds: [state_machines.CementBatch.transitions, entities.CementBatch.fineness_branch_state, complexity_profile.state_machine_shape]
        distinguishing_aspect: >
          The GROUND -> QUALIFIED join needs BOTH branches PASSED. One passing branch must move only
          its own dimension and must NOT release the cement into available_tonnes. An implementation
          that qualifies on the first in-spec test sells cement whose strength was never measured.
        test_recipe:
          setup: ["Batch B1 is GROUND with both branch dimensions PENDING and 574.72 t sitting unreleased in SM1."]
          setup_api_calls: *chain_ground
          trigger:
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "BLAINE", value: 400, cement_batch_id: "${b1}" } }
            - { call: "GET /cement-ops/cement-batches/${b1}", as: QualityManager, payload: {} }
            - { call: "GET /cement-ops/silos/${sm1}", as: QualityManager, payload: {} }
          assert:
            - "the lab test is 201 with unit M2_PER_KG, spec_min 380, spec_max 460, in_spec true"
            - "the batch GET reads fineness_branch_state PASSED, strength_branch_state PENDING, status still GROUND, qualified_at null"
            - "the silo GET reads tonnes_on_hand 574.72, unreleased_tonnes 574.72, available_tonnes 0.00"
            - "recording COMPRESSIVE_STRENGTH_28D 30.0 afterwards flips status to QUALIFIED with qualified_at 2026-08-01T12:00:00.000Z and available_tonnes 574.72"

      - name: failing_strength_branch_rejects_the_batch_and_strands_its_cement
        claim_type: side_effect_execution
        grounds: [state_machines.CementBatch.transitions, entities.CementBatch.rejection_reason, calculations.lab_spec_bounds]
        distinguishing_aspect: >
          A failing branch short-circuits the join: status REJECTED with rejection_reason
          STRENGTH_OUT_OF_SPEC, and the cement stays counted in unreleased_tonnes forever so
          available_tonnes remains 0.00. An implementation that clears unreleased_tonnes on any
          terminal outcome makes rejected cement sellable.
        test_recipe:
          setup: ["Batch B1 is GROUND and its Blaine branch has already PASSED at 400 m2/kg. TYPE_IL requires 28.0 MPa."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read, *c_b1, *c_b1_grind, *c_b1_ground, *c_lab_blaine_ok]
          trigger:
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "COMPRESSIVE_STRENGTH_28D", value: 27.9, cement_batch_id: "${b1}" } }
            - { call: "GET /cement-ops/cement-batches/${b1}", as: QualityManager, payload: {} }
            - { call: "GET /cement-ops/silos/${sm1}", as: QualityManager, payload: {} }
          assert:
            - "the lab test is 201 with unit MPA, spec_min 28.0, spec_max null, in_spec false"
            - "the batch reads status REJECTED, rejection_reason STRENGTH_OUT_OF_SPEC, strength_branch_state FAILED, fineness_branch_state PASSED, qualified_at null"
            - "the silo reads tonnes_on_hand 574.72, unreleased_tonnes 574.72, available_tonnes 0.00 — the cement is stranded, not released"
            - "GET /cement-ops/plants/${plant} reads cement_tonne_balance_tonnes 574.72 (the tonnes are physically in the silo whatever the verdict)"
            - "a later in-spec 30.0 MPa test does not resurrect the batch: it stays REJECTED (REJECTED is terminal)"

      - name: burn_test_authorized_branch_mints_a_bounded_validity_window
        claim_type: valid_transition
        grounds: [state_machines.BurnTest.transitions, entities.BurnTest.valid_until, calculations.thermal_substitution_rate]
        distinguishing_aspect: >
          The AUTHORIZED branch is the only one that mints a window, and authorized_max_tsr_pct is
          clamped by BOTH the request (25.00) and the permit (35.00). valid_from is the logical clock
          at adjudication and valid_until is valid_from + valid_days, so a 30-day authorization opened
          on 2026-08-01 expires exactly at 2026-08-31T00:00:00Z.
        test_recipe:
          setup: ["The reference-data spine exists. LAB1 runs a trial burn of RDF-1 requesting a 25.00% ceiling for 30 days and records compliant stack results; ENV1 (a different user) adjudicates."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/burn-tests", as: EnvironmentalOfficer, payload: { plant_id: "${plant}", fuel_id: "${rdf}", requested_max_tsr_pct: 25.00, valid_days: 30 }, captures: { bt: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt}/start", as: LabTechnician, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.80, measured_nox_kg_per_gj: 0.22, stack_compliant: true } }
            - { call: "POST /cement-ops/burn-tests/${bt}/adjudicate", as: EnvironmentalOfficer, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 25.00 }, captures: { valid_until: "$.data.valid_until" } }
          assert:
            - "create: 201 with status REQUESTED, authorized_max_tsr_pct 0.00, valid_from null, valid_until null, version 1"
            - "start: status IN_PROGRESS, version 2; record-result: status RESULT_RECORDED with result_recorded_by_user_id = the LabTechnician's X-User-ID, version 3"
            - "adjudicate: status AUTHORIZED, authorized_max_tsr_pct 25.00, valid_from 2026-08-01T00:00:00.000Z, valid_until 2026-08-31T00:00:00.000Z, adjudicated_by_user_id = the EnvironmentalOfficer's X-User-ID, version 4"
            - "an adjudication asking for authorized_max_tsr_pct 40.00 instead returns 422 ERR_INVALID_REQUEST because it exceeds both requested_max_tsr_pct 25.00 and permit_max_tsr_pct 35.00"

      - name: burn_test_rejected_branch_mints_no_window_at_all
        claim_type: side_effect_execution
        grounds: [state_machines.BurnTest.transitions, entities.BurnTest.authorized_max_tsr_pct, entities.BurnTest.decision_reason]
        distinguishing_aspect: >
          The REJECTED branch's side-effect set diverges from AUTHORIZED's: decision_reason is stored
          but authorized_max_tsr_pct stays 0.00 and BOTH window ends stay null. An implementation
          that shares one adjudicate handler and always stamps valid_from/valid_until leaves a
          rejected fuel chargeable.
        test_recipe:
          setup: ["A trial burn of TDF-1 has reached RESULT_RECORDED with stack_compliant false."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/burn-tests", as: LabTechnician, payload: { plant_id: "${plant}", fuel_id: "${tdf}", requested_max_tsr_pct: 10.00, valid_days: 30 }, captures: { bt2: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt2}/start", as: LabTechnician, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt2}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.10, measured_nox_kg_per_gj: 0.40, stack_compliant: false } }
            - { call: "POST /cement-ops/burn-tests/${bt2}/adjudicate", as: EnvironmentalOfficer, payload: { decision: "REJECTED", decision_reason: "STACK_NON_COMPLIANT" } }
          assert:
            - "the adjudication is 200 with status REJECTED, decision_reason STACK_NON_COMPLIANT, version 4"
            - "authorized_max_tsr_pct 0.00, valid_from null, valid_until null"
            - "GET /cement-ops/burn-tests?plant_id=${plant}&status=AUTHORIZED returns total_count 0"
            - "an AUTHORIZED decision on the same row would have been refused anyway, because stack_compliant is false"
            - "REJECTED is terminal: a second adjudicate returns 409 ERR_INVALID_BURN_TEST_STATE"

      - name: second_issue_on_an_issued_certificate_is_rejected
        claim_type: idempotency
        grounds: [state_machines.MillCertificate.transitions, errors.ERR_INVALID_CERTIFICATE_STATE, entities.CementBatch.certified_tonnes_allocated]
        distinguishing_aspect: >
          Re-issuing must be refused with ERR_INVALID_CERTIFICATE_STATE (409) and must not re-apply
          its side effect. A handler that is idempotent on status but not on the ledger would push
          certified_tonnes_allocated to 1149.44 on a 574.72 t batch.
        test_recipe:
          setup: ["Certificate MC1 for 574.72 t is ISSUED and batch B1 is CERTIFIED with certified_tonnes_allocated 574.72."]
          setup_api_calls: &chain_cert [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read, *c_b1, *c_b1_grind, *c_b1_ground, *c_lab_blaine_ok, *c_lab_str_ok, *c_mc1, *c_mc1_issue]
          trigger:
            - { call: "POST /cement-ops/mill-certificates/${mc1}/issue", as: QualityManager, payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "409 with error_id ERR_INVALID_CERTIFICATE_STATE"
            - "the certificate still reads status ISSUED with issued_at 2026-08-01T12:00:00.000Z unchanged and no extra version bump"
            - "the batch still reads status CERTIFIED with certified_tonnes_allocated 574.72, not 1149.44"

      - name: revoked_certificate_cannot_be_revoked_a_second_time
        claim_type: terminal_state_lockdown
        grounds: [state_machines.MillCertificate.terminal_states, errors.ERR_INVALID_CERTIFICATE_STATE]
        distinguishing_aspect: >
          REVOKED is terminal, so a second revoke must be a 409 that fires no further cascade. The
          observable is that the four-hop cascade's downstream rows are untouched by the second call:
          the batch stays DECERTIFIED at 0.00 allocated and the silo keeps the FIRST revocation's
          block_reason.
        test_recipe:
          setup: ["Certificate MC1 is ISSUED and then revoked with reason CUSTOMER_COMPLAINT, which has already cascaded to batch, silo and orders."]
          setup_api_calls: *chain_cert
          trigger:
            - { call: "POST /cement-ops/mill-certificates/${mc1}/revoke", as: QualityManager, payload: { revoke_reason: "CUSTOMER_COMPLAINT" } }
            - { call: "POST /cement-ops/mill-certificates/${mc1}/revoke", as: QualityManager, payload: { revoke_reason: "SECOND_ATTEMPT" }, captures: { err: "$.data.error_id" } }
          assert:
            - "the first revoke is 200 with status REVOKED, revoke_reason CUSTOMER_COMPLAINT, revoked_at 2026-08-01T12:00:00.000Z"
            - "the second revoke is 409 with error_id ERR_INVALID_CERTIFICATE_STATE"
            - "revoke_reason is still CUSTOMER_COMPLAINT — the refused call stored nothing"
            - "the batch still reads status DECERTIFIED with certified_tonnes_allocated 0.00"
            - "SM1 still reads status BLOCKED with block_reason DECERTIFIED_CEMENT (not SECOND_ATTEMPT)"

      - name: blocking_a_cement_silo_cancels_its_open_loadout_orders
        claim_type: side_effect_execution
        grounds: [state_machines.Silo.transitions, state_machines.LoadoutOrder.transitions, entities.Customer.open_reserved_tonnes]
        distinguishing_aspect: >
          A direct PATCH to BLOCKED on a CEMENT silo must run the same conditional cascade the
          revocation path runs — orders to CANCELLED_BY_QUALITY carrying the silo's block_reason, silo
          reservations released, customer ledger recomputed — while the material_kind == CLINKER
          branch does something entirely different. An implementation that wires the cascade only
          into the revocation handler leaves trucks booked against blocked cement.
        test_recipe:
          setup: ["Certificate MC1 is ISSUED and LO1 reserves 120.00 t out of SM1 for CU1, so SM1 reads reserved_tonnes 120.00 / available_tonnes 454.72 and CU1 reads open_reserved_tonnes 120.00."]
          setup_api_calls: &chain_order [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read, *c_b1, *c_b1_grind, *c_b1_ground, *c_lab_blaine_ok, *c_lab_str_ok, *c_mc1, *c_mc1_issue, *c_lo1]
          trigger:
            - { call: "PATCH /cement-ops/silos/${sm1}", as: PlantAdmin, payload: { status: "BLOCKED", block_reason: "SILO_INSPECTION" } }
            - { call: "GET /cement-ops/loadout-orders/${lo1}", as: LogisticsPlanner, payload: {} }
            - { call: "GET /cement-ops/customers/${cu1}", as: LogisticsPlanner, payload: {} }
          assert:
            - "the PATCH is 200 with status BLOCKED and block_reason SILO_INSPECTION"
            - "the order GET reads status CANCELLED_BY_QUALITY with void_reason SILO_INSPECTION and loaded_tonnes 0.00"
            - "SM1 reads reserved_tonnes 0.00, tonnes_on_hand 574.72, unreleased_tonnes 0.00, available_tonnes 574.72"
            - "the customer GET reads open_reserved_tonnes 0.00 and lifetime_loaded_tonnes 0.00"
            - "a new loadout order on SM1 now returns 409 ERR_SILO_BLOCKED"
            - "CANCELLED_BY_QUALITY is terminal: POST /cement-ops/loadout-orders/${lo1}/start-loading returns 409 ERR_INVALID_ORDER_STATE"

      - name: outage_completed_without_refractory_replacement_leaves_the_kiln_reline_due
        claim_type: side_effect_execution
        grounds: [state_machines.KilnOutage.transitions, entities.Kiln.availability_state, entities.KilnOutage.demand_season_class]
        distinguishing_aspect: >
          The complete transition's side-effect set BRANCHES on refractory_replaced: false leaves
          refractory_hours_since_reline untouched, so a kiln at or past reline_due_hours returns to
          RELINE_DUE rather than AVAILABLE. An implementation that unconditionally clears the hour
          meter (or unconditionally sets AVAILABLE) lets an unrelined kiln be lit.
        test_recipe:
          setup: ["Kiln K2 is created with reline_due_hours 10 and burns one 12-hour run, so it reads refractory_hours_since_reline 12 and availability_state RELINE_DUE. A shoulder-season refractory outage is planned for October, approved and started."]
          setup_api_calls: *chain_sealed
          trigger:
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K2", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 10 }, captures: { k2: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k2}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { rb: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${rb}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${rb}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${gas}", tonnes: 45.00 } }
            - *c_clock_0801_12
            - { call: "POST /cement-ops/kiln-runs/${rb}/complete", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k2}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-03T00:00:00Z", scope: "REFRACTORY" }, captures: { ko: "$.data.id", season: "$.data.demand_season_class" } }
            - { call: "POST /cement-ops/kiln-outages/${ko}/approve", as: PlantAdmin, payload: {} }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-10-01T00:00:00Z" } }
            - { call: "POST /cement-ops/kiln-outages/${ko}/start", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-outages/${ko}/complete", as: ProcessEngineer, payload: { refractory_replaced: false } }
            - { call: "GET /cement-ops/kilns/${k2}", as: ProcessEngineer, payload: {} }
          assert:
            - "after the run completes, K2 reads refractory_hours_since_reline 12 and availability_state RELINE_DUE (12 >= reline_due_hours 10)"
            - "the outage create is 201 with status PLANNED, demand_season_class SHOULDER (October is neither in peak_season_months [5,6,7,8,9] nor in OFF_SEASON_MONTHS [12,1,2]), peak_season_override false"
            - "approve: status APPROVED with approved_by_user_id = the PlantAdmin's X-User-ID; start: status IN_PROGRESS, started_at 2026-10-01T00:00:00.000Z, and K2 availability_state IN_OUTAGE"
            - "complete: status COMPLETED, completed_at 2026-10-01T00:00:00.000Z, refractory_replaced false"
            - "the kiln GET reads refractory_hours_since_reline 12 (NOT 0) and availability_state RELINE_DUE (NOT AVAILABLE)"
            - "running the same outage flow with refractory_replaced true instead yields refractory_hours_since_reline 0 and availability_state AVAILABLE"

      - name: quality_dimension_retest_cycle_on_a_completed_run
        claim_type: valid_transition
        grounds: [state_machines.KilnRun.transitions]
        excluded_because:
          difficulty_instance: non_linear_state_machine / kiln_run_quality_dimension_cycles_while_process_dimension_stays_completed
          rationale: "The PENDING_LAB <-> QUARANTINED loop and the independence of the two dimensions are the whole subject of the named §1.8 instance."

      - name: design_revision_cycle_terminates_at_the_third_round
        claim_type: valid_transition
        grounds: [state_machines.RawMixDesign.transitions]
        excluded_because:
          difficulty_instance: non_linear_state_machine / design_revision_cycle_is_capped_at_three_rounds_then_rejected
          rationale: "The DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT loop and its ERR_REVISION_LIMIT_EXCEEDED termination are asserted there round by round."

      - name: certificate_revocation_cascade_reaches_the_customer_ledger
        claim_type: side_effect_execution
        grounds: [state_machines.MillCertificate.transitions]
        excluded_because:
          difficulty_instance: transitive_cascade / certificate_revocation_cascades_four_hops_to_the_customer_ledger
          rationale: "All four hops (batch, silo, orders, customer) are asserted hop by hop in the named §1.8 instance."

      - name: release_clinker_cascade_restores_feed_short_batches
        claim_type: side_effect_execution
        grounds: [state_machines.KilnRun.transitions]
        excluded_because:
          difficulty_instance: transitive_cascade / requarantine_withdrawal_cascades_three_hops_into_plant_production_posture
          rationale: "That instance walks the withdrawal cascade and then the reverse walk (FREE_LIME 1.40 plus release-clinker restoring FEED_READY, reserved_tonnes and production_posture) in its final assert."

      - name: lighting_requires_the_pile_to_be_sealed
        claim_type: precondition_enforcement
        grounds: [state_machines.KilnRun.transitions]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lighting_a_kiln_requires_the_blended_pile_to_be_sealed
          rationale: "The OPEN-pile refusal with ERR_INVALID_PILE_STATE is that instance's trigger."

      - name: abort_reverses_every_fuel_charge_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.KilnRun.transitions]
        excluded_because:
          difficulty_instance: compensating_invariant / aborting_a_burning_run_returns_the_annual_nox_budget_to_its_pre_charge_value
          rationale: "The compensation (nox_emitted_kg to 0.00, budget restored to exactly 2000000.00, no clinker credited) is asserted there with literals."

      - name: voiding_a_completed_order_reverses_the_shipment
        claim_type: side_effect_execution
        grounds: [state_machines.LoadoutOrder.transitions]
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_a_completed_loadout_restores_the_plant_cement_balance_with_no_drift
          rationale: "The COMPLETED -> VOIDED compensation and the plant cement balance invariant are that instance's subject."

  # ===========================================================================
  - section: calculations
    instances:

      - name: tier_one_burn_produces_the_low_efficiency_clinker_yield
        claim_type: correct_result
        grounds: [calculations.clinker_output_from_fuel_energy, entities.KilnRun.effective_shc_gj_per_tonne]
        distinguishing_aspect: >
          A 79.00 t coal charge lands the provisional tonnage at 592.50, strictly below the 600.00
          tier boundary, so effective_shc is 4.00 and clinker_tonnes is 533.25 — not the 592.50 a
          nominal-SHC implementation reports and not the 576.49 a 3.70 implementation reports. Every
          downstream figure (NOx, feed, intensity) is keyed off that 533.25.
        test_recipe:
          setup: ["Pile PA is SEALED at 1000.00 dry tonnes and run RC is BURNING on kiln K1 (nominal_shc 3.60) in the [00:00, 12:00] window."]
          setup_api_calls: *chain_sealed
          trigger:
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { rc: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${rc}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${rc}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 79.00 }, captures: { clinker: "$.data.clinker_tonnes" } }
            - *c_clock_0801_12
            - { call: "POST /cement-ops/kiln-runs/${rc}/complete", as: KilnOperator, payload: {} }
          assert:
            - "the charge response reads gross_energy_gj 2133.00, provisional_clinker_tonnes 592.50, effective_shc_gj_per_tonne 4.00, clinker_tonnes 533.25"
            - "nox_emitted_kg 746.55, chlorine_input_kg 15.80, tsr_pct 0.00 (coal is not an alternative fuel)"
            - "nox_intensity_kg_per_tonne 1.400 and nox_intensity_breach true (cap 1.20)"
            - "the plant reads permit_nox_budget_remaining_kg 1999253.45"
            - "the completion is 200: round(533.25 * 1.55, 2) = 826.54 dry tonnes of feed <= dry_tonnes 1000.00, and SC1 reads tonnes_on_hand 533.25 with unreleased_tonnes 533.25"
            - "release-clinker after an in-spec free lime reading is then refused with 422 ERR_PERMIT_NOX_INTENSITY_EXCEEDED, because the rolling window holds only this 1.400 run"

      - name: nox_and_tonnage_precision_is_three_and_two_decimals
        claim_type: precision
        grounds: [calculations.nox_emission_intensity, calculations.clinker_output_from_fuel_energy, calculations.nox_budget_conservation]
        distinguishing_aspect: >
          Intensities carry exactly three decimals and tonnages exactly two, ROUND_HALF_UP, with
          trailing zeros preserved in the JSON: 216.00 / 583.78 is 0.3700024... and must serialise as
          0.370, never 0.37 and never 0.3700024. The budget ledger is a 2-decimal figure at
          1999784.00, not 1999784.
        test_recipe:
          setup: ["Run R0 has burned 45.00 t of natural gas, completed at 12:00 with an in-spec free lime of 1.20, and its clinker has been released."]
          setup_api_calls: &chain_run [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read]
          trigger:
            - { call: "GET /cement-ops/kiln-runs/${r0}", as: EnvironmentalOfficer, payload: {}, captures: { intensity: "$.data.nox_intensity_kg_per_tonne" } }
            - { call: "GET /cement-ops/plants/${plant}", as: EnvironmentalOfficer, payload: {} }
          assert:
            - "the run reads nox_intensity_kg_per_tonne 0.370 (three decimals, trailing zero kept) and nox_intensity_breach false"
            - "the run reads gross_energy_gj 2160.00, provisional_clinker_tonnes 600.00, effective_shc_gj_per_tonne 3.70, clinker_tonnes 583.78, nox_emitted_kg 216.00, chlorine_input_kg 0.00"
            - "the plant reads rolling_nox_intensity_kg_per_tonne 0.370 and permit_nox_budget_remaining_kg 1999784.00"
            - "the plant reads cement_tonne_balance_tonnes 0.00 — clinker is not cement"
            - "no figure in either body is a bare integer or carries more decimals than its declared precision"

      - name: pile_additions_never_rewrite_the_designs_own_basis
        claim_type: variant_selection
        grounds: [calculations.raw_mix_chemical_modules.variants, entities.BlendedPile.as_blended_lsf, entities.RawMixDesign.as_designed_lsf]
        distinguishing_aspect: >
          The as_designed variant is evaluated on design create/PATCH/submit ONLY, and the as_blended
          variant on pile additions ONLY. Dropping 10.00 t of iron ore into the pile must move the
          pile's modules (LSF 96.98 -> 95.43) and leave the design's as_designed_lsf at 96.98. An
          implementation that runs one shared recompute on both rows rewrites an APPROVED recipe from
          a delivery record.
        test_recipe:
          setup: ["Design D2 is APPROVED with as_designed_lsf 96.98 and pile PA has been fed the moisture-compensated limestone and clay (dry 820.00 + 180.00 = 1000.00 t, as_blended_lsf 96.98)."]
          setup_api_calls: *chain_design
          trigger:
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ir}", tonnes_as_received: 10.00, moisture_pct: 5.0 }, captures: { blended_lsf: "$.data.as_blended_lsf" } }
            - { call: "GET /cement-ops/raw-mix-designs/${d2}", as: ProcessEngineer, payload: {} }
          assert:
            - "the pile reads as_received_tonnes 1051.28 and dry_tonnes 1009.50 (10.00 as-received at 5.0% moisture = 9.50 dry)"
            - "the pile reads as_blended_cao_pct 42.4264, as_blended_sio2_pct 13.6166, as_blended_al2o3_pct 4.0406, as_blended_fe2o3_pct 2.4071"
            - "the pile reads as_blended_lsf 95.43, as_blended_sm 2.11, as_blended_am 1.68, lsf_deviation 1.57, alt_raw_share_pct 0.00 (iron ore is not an alternative raw material)"
            - "the design GET still reads as_designed_lsf 96.98, as_designed_sm 2.39, as_designed_am 2.43 and as_designed_cao_pct 42.8000"
            - "the pile is still sealable because lsf_deviation 1.57 <= pile_lsf_tolerance 2.00"

      - name: distribution_plan_fills_the_top_priority_bucket_first
        claim_type: correct_result
        grounds: [calculations.distribution_plan_waterfall, endpoints]
        distinguishing_aspect: >
          The waterfall must exhaust the pool on the highest-priority customer before the next one
          sees a tonne: with a 454.72 t pool and a peak-season month, CU1 (priority 10) takes 454.72
          of its 5000.00 demand and CU2 (priority 5) is listed with allocated_tonnes 0.00 and its
          FULL 2500.00 as shortfall. A pro-rata implementation returns roughly 303/151 instead.
        test_recipe:
          setup: ["Certificate MC1 is ISSUED and LO1 reserves 120.00 t, so the CEMENT silo pool is 574.72 - 120.00 = 454.72 t. A second in-region customer CU2 (priority 5, 2000.00 t/month) is added."]
          setup_api_calls: *chain_order
          trigger:
            - { call: "POST /cement-ops/customers", as: LogisticsPlanner, payload: { name: "Prairie Concrete", region_code: "US-MW", contract_priority: 5, contract_monthly_tonnes: 2000.00, required_cement_type: "TYPE_IL", max_so3_pct: 3.00 }, captures: { cu2: "$.data.id" } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 8 } }
          assert:
            - "200 with plant_id ${plant}, as_of_month 8, seasonal_factor 1.25, available_pool_tonnes 454.72"
            - "allocations has exactly 2 entries, ordered CU1 then CU2 (contract_priority DESC)"
            - "allocations[0]: customer_id ${cu1}, contract_priority 10, demand_tonnes 5000.00, allocated_tonnes 454.72, shortfall_tonnes 4545.28"
            - "allocations[1]: customer_id ${cu2}, contract_priority 5, demand_tonnes 2500.00, allocated_tonnes 0.00, shortfall_tonnes 2500.00"
            - "total_allocated_tonnes 454.72 and total_shortfall_tonnes 7045.28"
            - "total_allocated_tonnes equals available_pool_tonnes exactly — the pool is exhausted, never over-allocated"
            - "nothing is persisted: repeating the call returns the identical body and no entity version changes"

      - name: distribution_plan_excludes_suspended_held_and_out_of_region_customers
        claim_type: input_set_filtering
        grounds: [calculations.distribution_plan_waterfall, entities.Customer.contract_state, entities.Customer.credit_hold]
        distinguishing_aspect: >
          Three independent eligibility filters must all apply — contract_state == ACTIVE,
          credit_hold == false and region_code == Plant.region_code. An implementation that filters on
          contract_state alone still ranks a credit-held customer first and starves the payer.
        test_recipe:
          setup: ["The pool is 454.72 t. CU2 is in region and ACTIVE but put on credit hold; CU3 is out of region (US-SW); CU4 is in region but SUSPENDED."]
          setup_api_calls: *chain_order
          trigger:
            - { call: "POST /cement-ops/customers", as: LogisticsPlanner, payload: { name: "Prairie Concrete", region_code: "US-MW", contract_priority: 99, contract_monthly_tonnes: 2000.00, required_cement_type: "TYPE_IL", max_so3_pct: 3.00 }, captures: { cu2b: "$.data.id" } }
            - { call: "PATCH /cement-ops/customers/${cu2b}", as: LogisticsPlanner, payload: { credit_hold: true } }
            - { call: "POST /cement-ops/customers", as: LogisticsPlanner, payload: { name: "Desert Mix", region_code: "US-SW", contract_priority: 98, contract_monthly_tonnes: 1000.00, required_cement_type: "TYPE_IL", max_so3_pct: 3.00 }, captures: { cu3: "$.data.id" } }
            - { call: "POST /cement-ops/customers", as: LogisticsPlanner, payload: { name: "Lakeside Precast", region_code: "US-MW", contract_priority: 97, contract_monthly_tonnes: 900.00, required_cement_type: "TYPE_IL", max_so3_pct: 3.00, contract_state: "SUSPENDED" }, captures: { cu4: "$.data.id" } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: PlantAdmin, payload: { as_of_month: 8 } }
          assert:
            - "the PATCH is 200 with credit_hold true and contract_state still ACTIVE"
            - "the plan's allocations has exactly 1 entry: customer_id ${cu1} with allocated_tonnes 454.72 and shortfall_tonnes 4545.28"
            - "${cu2b}, ${cu3} and ${cu4} appear nowhere in allocations, even though their contract_priority values 99, 98 and 97 all outrank CU1's 10"
            - "total_allocated_tonnes 454.72 and total_shortfall_tonnes 4545.28"
            - "clearing the hold with PATCH credit_hold false puts ${cu2b} back at the head of the ranking with allocated_tonnes 454.72 and CU1 dropping to 0.00"

      - name: seasonal_factors_come_from_the_declared_constants
        claim_type: constants_applied
        grounds: [calculations.distribution_plan_waterfall.constants, entities.Plant.peak_season_months]
        distinguishing_aspect: >
          The factor is a three-way lookup driven by the PLANT's peak_season_months and the global
          OFF_SEASON_MONTHS [12, 1, 2], with the peak branch checked first: 1.25 for month 8, 0.70 for
          month 1, 1.00 for month 3. A hard-coded northern-hemisphere calendar or a single 1.0 factor
          diverges on the very first month tested.
        test_recipe:
          setup: ["The pool is 454.72 t and CU1 (4000.00 t/month) is the only eligible customer. The plant's peak_season_months are [5, 6, 7, 8, 9]."]
          setup_api_calls: *chain_order
          trigger:
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 1 } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 3 } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 5 } }
          assert:
            - "month 1: seasonal_factor 0.70, demand_tonnes 2800.00, allocated_tonnes 454.72, shortfall_tonnes 2345.28"
            - "month 3: seasonal_factor 1.00, demand_tonnes 4000.00, allocated_tonnes 454.72, shortfall_tonnes 3545.28"
            - "month 5: seasonal_factor 1.25, demand_tonnes 5000.00, allocated_tonnes 454.72, shortfall_tonnes 4545.28"
            - "available_pool_tonnes is 454.72 in all three responses — seasonality moves demand, never supply"
            - "as_of_month 0 or 13 returns 400 ERR_INVALID_REQUEST"

      - name: rolling_intensity_is_re_derived_over_the_whole_completed_set
        claim_type: reconciliation
        grounds: [calculations.nox_emission_intensity.variants, entities.Plant.rolling_nox_intensity_kg_per_tonne]
        distinguishing_aspect: >
          The plant ledger is a ratio of two sums, not a running average of per-run intensities: with
          R0 at 0.370 and RC at 1.400 the answer is 962.55 / 1117.03 = 0.862, not the arithmetic mean
          0.885. Each completion must re-derive it from the whole window set, so the second completion
          moves it from 0.370 to 0.862 in one write.
        test_recipe:
          setup: ["R0 (45.00 t gas) is COMPLETED and RELEASED, leaving rolling_nox_intensity 0.370. A second pile PB is blended and sealed against D2, and run RC burns 79.00 t of coal on 2026-08-02."]
          setup_api_calls: *chain_run
          trigger:
            - { call: "GET /cement-ops/raw-mix-designs/${d2}", as: ProcessEngineer, payload: {}, captures: { d2_v2: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PB", expected_raw_mix_design_version: "${d2_v2}" }, captures: { pb: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pb}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pb}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pb}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pb}", clinker_silo_id: "${sc1}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T12:00:00Z" }, captures: { rc2: "$.data.id" } }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-02T00:00:00Z" } }
            - { call: "POST /cement-ops/kiln-runs/${rc2}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${rc2}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 79.00 } }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-02T12:00:00Z" } }
            - { call: "POST /cement-ops/kiln-runs/${rc2}/complete", as: KilnOperator, payload: {} }
            - { call: "GET /cement-ops/plants/${plant}", as: EnvironmentalOfficer, payload: {} }
          assert:
            - "before the trigger the plant reads rolling_nox_intensity_kg_per_tonne 0.370"
            - "the second completion is 200 with clinker_tonnes 533.25 and nox_emitted_kg 746.55"
            - "the plant GET reads rolling_nox_intensity_kg_per_tonne 0.862 — round(962.55 / 1117.03, 3), NOT the mean of 0.370 and 1.400"
            - "the plant reads permit_nox_budget_remaining_kg 1999037.45 and SC1 reads tonnes_on_hand 1117.03"
            - "R0 still reads nox_intensity_kg_per_tonne 0.370 and RC2 1.400 — the per-run figures are untouched by the ledger"
            - "releasing RC2's clinker after an in-spec free lime reading now SUCCEEDS, because 0.862 <= the 1.20 cap"

      - name: cement_balance_counts_only_completed_orders
        claim_type: input_set_filtering
        grounds: [calculations.cement_tonne_conservation, entities.LoadoutOrder.status]
        distinguishing_aspect: >
          The shipped term sums loaded_tonnes over COMPLETED orders only. With LO1 merely RESERVED the
          balance is 574.72, not 694.72: an implementation that sums every non-void order double-counts
          cement that is still standing in the silo.
        test_recipe:
          setup: ["Batch B1 is CERTIFIED, SM1 holds 574.72 t on hand with 120.00 t reserved by LO1, and LO1 has status RESERVED with loaded_tonnes 0.00."]
          setup_api_calls: *chain_order
          trigger:
            - { call: "GET /cement-ops/plants/${plant}", as: LogisticsPlanner, payload: {}, captures: { balance: "$.data.cement_tonne_balance_tonnes" } }
          assert:
            - "cement_tonne_balance_tonnes 574.72, not 694.72"
            - "SM1 reads tonnes_on_hand 574.72, reserved_tonnes 120.00, unreleased_tonnes 0.00, available_tonnes 454.72"
            - "starting and completing LO1 with loaded_tonnes 120.00 leaves cement_tonne_balance_tonnes at exactly 574.72 (silo 454.72 + shipped 120.00)"
            - "the CLINKER silo SC1 contributes nothing to the figure whatever its contents"

      - name: blaine_bounds_follow_the_subject_batchs_cement_type
        claim_type: correct_result
        grounds: [calculations.lab_spec_bounds, calculations.cement_additive_proportioning.constants, entities.CementBatch.rejection_reason]
        distinguishing_aspect: >
          The identical measured value 400 m2/kg is in spec on a TYPE_IL batch (band 380-460) and out
          of spec on a TYPE_III batch (band 500-600), because the bounds are read from the SUBJECT, not
          from a global constant. The TYPE_III batch therefore fails its fineness branch and is
          rejected with FINENESS_OUT_OF_SPEC.
        test_recipe:
          setup: ["Batch B1 (TYPE_IL) is GROUND and SC1 still has 83.78 t of released clinker. A small TYPE_III batch B3 is planned from 50.00 t of it with a 520 m2/kg target, ground, and then measured at 400."]
          setup_api_calls: *chain_ground
          trigger:
            - { call: "GET /cement-ops/silos/${sc1}", as: ProcessEngineer, payload: {}, captures: { sc1_v3: "$.data.version" } }
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_III", clinker_tonnes_drawn: 50.00, gypsum_pct: 5.00, limestone_pct: 5.00, blaine_target_m2_per_kg: 520, expected_clinker_silo_version: "${sc1_v3}" }, captures: { b3: "$.data.id" } }
            - { call: "POST /cement-ops/cement-batches/${b3}/start-grinding", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/cement-batches/${b3}/finish-grinding", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "BLAINE", value: 400, cement_batch_id: "${b3}" }, captures: { in_spec: "$.data.in_spec" } }
          assert:
            - "B3 is created with total_batch_tonnes 55.56, gypsum_tonnes 2.78, limestone_tonnes 2.78, cement_tonnes 55.56, so3_pct 2.87 (2.87 <= the TYPE_III ceiling 4.50)"
            - "the lab test is 201 with unit M2_PER_KG, spec_min 500, spec_max 600, in_spec false"
            - "B3 reads fineness_branch_state FAILED, status REJECTED, rejection_reason FINENESS_OUT_OF_SPEC"
            - "the identical 400 recorded against B1 (TYPE_IL) returns spec_min 380, spec_max 460, in_spec true"
            - "B3's 55.56 t stays in SM1.unreleased_tonnes: SM1 reads tonnes_on_hand 630.28 with available_tonnes 0.00"
            - "a blaine_target_m2_per_kg of 400 on a TYPE_III batch would have been refused at creation with 400 ERR_INVALID_REQUEST (outside the 500-600 band)"

      - name: raw_mix_module_divergence_between_the_two_bases
        claim_type: variant_divergence
        grounds: [calculations.raw_mix_chemical_modules]
        excluded_because:
          difficulty_instance: dual_variant_calc / raw_mix_modules_diverge_between_design_basis_and_pile_basis
          rationale: "The 96.94 vs 104.82 delta and both variants' oxide sets are asserted there with literals."

      - name: per_run_versus_rolling_nox_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.nox_emission_intensity]
        excluded_because:
          difficulty_instance: dual_variant_calc / per_run_nox_intensity_breaches_while_rolling_window_variant_permits_release
          rationale: "The 1.295 breach against the 0.833 rolling figure, and which variant gates the release, are that instance's subject."

      - name: shc_tier_boundary_at_exactly_six_hundred_tonnes
        claim_type: correct_result
        grounds: [calculations.clinker_output_from_fuel_energy]
        excluded_because:
          difficulty_instance: boundary_precision_check / shc_tier_is_selected_from_the_provisional_tonnage_and_never_re_selected
          rationale: "The inclusive-upward boundary at 600.00 and the single-pass tier rule are asserted there against the 540.00 re-tiering trap."

      - name: tsr_ceiling_propagates_through_every_authorization
        claim_type: constants_applied
        grounds: [calculations.thermal_substitution_rate]
        excluded_because:
          difficulty_instance: combinatorial_formula / tsr_ceiling_is_a_nested_min_over_permit_and_every_charged_fuel_authorization
          rationale: "The nested min over the permit and each charged alternative fuel's authorization is that instance's whole subject."

      - name: additive_rounding_does_not_drift
        claim_type: precision
        grounds: [calculations.cement_additive_proportioning]
        excluded_because:
          difficulty_instance: combinatorial_formula / cement_tonnage_uses_round_then_sum_not_sum_then_round
          rationale: "The 574.72 vs 574.71 divergence and the SO3 recomputation from the rounded components are asserted there."

      - name: free_lime_threshold_is_an_inclusive_ceiling
        claim_type: correct_result
        grounds: [calculations.lab_spec_bounds]
        excluded_because:
          difficulty_instance: boundary_precision_check / free_lime_exactly_at_the_plant_ceiling_is_in_spec
          rationale: "The 1.50 / 1.51 pair at the plant ceiling is that instance's trigger."

      - name: nox_budget_running_total_survives_a_reversal
        claim_type: input_set_filtering
        grounds: [calculations.nox_budget_conservation]
        excluded_because:
          difficulty_instance: compensating_invariant / aborting_a_burning_run_returns_the_annual_nox_budget_to_its_pre_charge_value
          rationale: "The input-set membership of ABORTED runs and the exact restoration to 2000000.00 are asserted there."

  # ===========================================================================
  - section: validations
    instances:

      - name: blank_auth_headers_beat_a_nonexistent_path_id_unauthenticated
        claim_type: priority_ordering
        grounds: [validations, errors.ERR_UNAUTHENTICATED, errors.ERR_PLANT_NOT_FOUND]
        distinguishing_aspect: >
          Rule 10 runs before rule 30, so a request with both auth headers sent as empty strings
          against a plant id that does not exist must answer 401 ERR_UNAUTHENTICATED — never 404. An
          implementation that resolves the path row before authenticating leaks row existence to
          anonymous callers.
        test_recipe:
          setup: ["Empty database. The request carries X-User-ID: \"\" and X-User-Role: \"\" (both present but empty, which §1.4 rule 10 counts as absent) and a syntactically valid but unknown plant id."]
          setup_api_calls: []
          trigger:
            - { call: "GET /cement-ops/plants/00000000-0000-4000-8000-000000000000", as: PlantAdmin, payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "401 with error_id ERR_UNAUTHENTICATED"
            - "the body carries no plant fields and no hint that the id is unknown"
            - "the same call with valid PlantAdmin headers returns 404 ERR_PLANT_NOT_FOUND"

      - name: unknown_path_id_beats_an_invalid_payload_not_found
        claim_type: priority_ordering
        grounds: [validations, errors.ERR_SILO_NOT_FOUND, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: >
          Rule 30 (path existence) outranks rule 40 (request shape), so a PATCH to a nonexistent silo
          carrying an invalid status enum answers 404 ERR_SILO_NOT_FOUND, not 400 ERR_INVALID_REQUEST.
          Frameworks that validate the body in a decorator before loading the row invert this.
        test_recipe:
          setup: ["A plant exists but no silo with the requested id does. The payload's status value MELTED is not a member of {OPEN, BLOCKED}."]
          setup_api_calls: [*c_plant]
          trigger:
            - { call: "PATCH /cement-ops/silos/00000000-0000-4000-8000-000000000000", as: PlantAdmin, payload: { status: "MELTED" }, captures: { err: "$.data.error_id" } }
          assert:
            - "404 with error_id ERR_SILO_NOT_FOUND, not 400 ERR_INVALID_REQUEST"
            - "the same invalid payload against an EXISTING silo returns 400 ERR_INVALID_REQUEST and leaves that silo's status OPEN"

      - name: stale_silo_version_priority_50_beats_silo_blocked_priority_62
        claim_type: priority_ordering
        grounds: [validations, concurrency_rules, errors.ERR_STALE_SILO_VERSION, errors.ERR_SILO_BLOCKED]
        distinguishing_aspect: >
          The OCC guard (priority 50) is checked before the silo-status gate (priority 62). Blocking the
          silo both makes the caller's read stale AND closes the silo, so the answer must be 412
          ERR_STALE_SILO_VERSION — the caller is told to re-read rather than told the silo is shut.
        test_recipe:
          setup: ["583.78 t of RELEASED clinker sits in SC1 and the caller has read its version. A PlantAdmin then blocks SC1, which bumps that version."]
          setup_api_calls: *chain_run
          trigger:
            - { call: "PATCH /cement-ops/silos/${sc1}", as: PlantAdmin, payload: { status: "BLOCKED", block_reason: "SILO_INSPECTION" } }
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_IL", clinker_tonnes_drawn: 500.00, gypsum_pct: 5.00, limestone_pct: 8.00, blaine_target_m2_per_kg: 400, expected_clinker_silo_version: "${sc1_v}" }, captures: { err: "$.data.error_id" } }
          assert:
            - "412 with error_id ERR_STALE_SILO_VERSION, not 409 ERR_SILO_BLOCKED"
            - "no batch is created: GET /cement-ops/cement-batches?plant_id=${plant} returns total_count 0"
            - "SC1 still reads reserved_tonnes 0.00 and available_tonnes 583.78 — the refused create reserved nothing"
            - "re-reading SC1 and retrying with the CURRENT version then returns 409 ERR_SILO_BLOCKED, the next gate down the ladder"

      - name: segregation_priority_55_beats_certificate_state_priority_60
        claim_type: priority_ordering
        grounds: [validations, errors.ERR_SEGREGATION_OF_DUTIES, errors.ERR_INVALID_CERTIFICATE_STATE]
        distinguishing_aspect: >
          Rule 55 outranks rule 60, so when the caller is the very user who recorded the batch's newest
          28-day strength AND the certificate has already been issued, the answer is 403
          ERR_SEGREGATION_OF_DUTIES. The state gate would have produced a 409, which hides the real
          governance failure.
        test_recipe:
          setup: ["Certificate MC1 is already ISSUED. The retry is made under the X-User-ID that recorded B1's newest COMPRESSIVE_STRENGTH_28D LabTest, enrolled here with the QualityManager role."]
          setup_api_calls: [*c_plant, *c_ls, *c_cl, *c_ir, *c_fly, *c_gas, *c_coal, *c_rdf, *c_tdf, *c_cu1, *c_k1, *c_sc1, *c_sm1, *c_d2, *c_d2_submit, *c_d2_approve, *c_pa, *c_pa_ls, *c_pa_cl, *c_pa_seal, *c_r0, *c_r0_light, *c_r0_gas, *c_clock_0801_12, *c_r0_complete, *c_lab_fl_ok, *c_r0_release, *c_sc1_read, *c_b1, *c_b1_grind, *c_b1_ground, *c_lab_blaine_ok]
          trigger:
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "COMPRESSIVE_STRENGTH_28D", value: 30.0, cement_batch_id: "${b1}" }, captures: { strength_user: "$.data.recorded_by_user_id" } }
            - { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu1}", certified_tonnes: 574.72 }, captures: { mc2: "$.data.id" } }
            - { call: "POST /cement-ops/mill-certificates/${mc2}/issue", as: QualityManager, payload: {} }
            - { call: "POST /cement-ops/mill-certificates/${mc2}/issue", as: QualityManager, as_user_id: "${strength_user}", payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "the first issue is 200 with status ISSUED and issued_by_user_id = the ordinary QualityManager's X-User-ID"
            - "the second issue returns 403 with error_id ERR_SEGREGATION_OF_DUTIES, NOT 409 ERR_INVALID_CERTIFICATE_STATE"
            - "the certificate is unchanged: status ISSUED with the original issued_by_user_id and issued_at 2026-08-01T12:00:00.000Z"

      - name: alt_raw_share_exactly_at_the_substitution_cap_is_accepted
        claim_type: satisfaction_to_pass
        grounds: [validations, entities.RawMaterial.max_substitution_pct, entities.BlendedPile.alt_raw_share_pct]
        distinguishing_aspect: >
          Rule 94 allows equality and measures the share on an AS-RECEIVED basis, not the dry basis the
          modules use. 90.55 t of fly ash on top of 1041.28 as-received tonnes is exactly 8.00% and must
          be accepted; 91.00 t is 8.04% and must be refused. An implementation that computes the share
          from dry tonnages gets 8.22% for the accepted case and rejects a legal delivery.
        test_recipe:
          setup: ["Pile PA holds 1041.28 as-received tonnes (dry 1000.00). FLY-1 is an ALT_RAW material with max_substitution_pct 8.00."]
          setup_api_calls: *chain_design
          trigger:
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${fly}", tonnes_as_received: 90.55, moisture_pct: 1.0 }, captures: { share: "$.data.alt_raw_share_pct" } }
          assert:
            - "201 with alt_raw_share_pct 8.00 — equality with max_substitution_pct 8.00 passes"
            - "as_received_tonnes 1131.83 and dry_tonnes 1089.64 (90.55 at 1.0% moisture = 89.64 dry)"
            - "the same addition at 91.00 t instead returns 422 ERR_ALT_RAW_SUBSTITUTION_EXCEEDED with alt_raw_share_pct unchanged at 0.00 and dry_tonnes unchanged at 1000.00"
            - "the dry-basis share of the accepted case is 8.23%, which is NOT the figure the rule uses"

      - name: design_components_that_do_not_sum_to_one_hundred_are_rejected
        claim_type: violation_to_error
        grounds: [validations, errors.ERR_COMPONENTS_SUM_INVALID, calculations.raw_mix_chemical_modules]
        distinguishing_aspect: >
          Rule 91 demands EXACTLY 100.00 and at least two components: 99.99 must be a 422
          ERR_COMPONENTS_SUM_INVALID rather than silently normalised to 100. A normalising
          implementation would report as_designed oxides for a mix nobody specified.
        test_recipe:
          setup: ["The reference-data spine exists."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "DX", target_lsf: 97.00, target_sm: 1.50, target_am: 0.80, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 79.99 }, { raw_material_id: "${cl}", mass_fraction_pct: 16.00 }, { raw_material_id: "${ir}", mass_fraction_pct: 4.00 }] }, captures: { err: "$.data.error_id" } }
          assert:
            - "422 with error_id ERR_COMPONENTS_SUM_INVALID"
            - "GET /cement-ops/raw-mix-designs?plant_id=${plant} returns total_count 0 — no partially valid design is stored"
            - "a single-component design summing to exactly 100.00 also returns 422 ERR_COMPONENTS_SUM_INVALID (the rule needs >= 2 entries)"
            - "correcting the first component to 80.00 returns 201 with as_designed_lsf 96.94"

      - name: module_deviation_exactly_at_tolerance_passes_submit
        claim_type: satisfaction_to_pass
        grounds: [validations, entities.RawMixDesign.module_tolerance_lsf, errors.ERR_MODULE_TARGET_DEVIATION]
        distinguishing_aspect: >
          Rule 92 fires on submit, not on create, and allows equality: a design whose as_designed_lsf
          96.94 sits exactly 1.50 from target 95.44 with tolerance 1.5 must submit successfully, while
          target 90.00 (deviation 6.94) is a 422. Both designs must be creatable — the gate is on the
          transition.
        test_recipe:
          setup: ["The reference-data spine exists. Two three-component designs are created with the same components (LS-1 80.00 / CL-1 16.00 / IR-1 4.00, as_designed_lsf 96.94) but different targets."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "DT", target_lsf: 95.44, target_sm: 1.50, target_am: 0.80, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 80.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 16.00 }, { raw_material_id: "${ir}", mass_fraction_pct: 4.00 }] }, captures: { dt: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${dt}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "DU", target_lsf: 90.00, target_sm: 1.50, target_am: 0.80, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 80.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 16.00 }, { raw_material_id: "${ir}", mass_fraction_pct: 4.00 }] }, captures: { du: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${du}/submit", as: ProcessEngineer, payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "DT submit: 200 with status SUBMITTED and as_designed_lsf 96.94 (round(abs(96.94 - 95.44), 2) = 1.50 <= module_tolerance_lsf 1.5, equality allowed)"
            - "DU create: 201 with status DRAFT — the create endpoint does not run rule 92"
            - "DU submit: 422 with error_id ERR_MODULE_TARGET_DEVIATION and status still DRAFT"
            - "raising DU's module_tolerance_lsf to 7.0 via PATCH and resubmitting then returns 200 with status SUBMITTED"

      - name: outage_window_ending_before_it_starts_is_rejected
        claim_type: violation_to_error
        grounds: [validations, errors.ERR_INVALID_WINDOW, entities.KilnOutage.window_start]
        distinguishing_aspect: >
          Rule 81 demands window_start < window_end AND window_start >= the logical clock, so a
          zero-length window (start == end) and a backwards window are both 422 ERR_INVALID_WINDOW, as
          is a window that opens in the past. All three must be caught before the seasonality gate at
          priority 108.
        test_recipe:
          setup: ["Kiln K1 exists and the clock reads 2026-08-01T00:00:00Z."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-10-03T00:00:00Z", window_end: "2026-10-03T00:00:00Z", scope: "MECHANICAL" }, captures: { err: "$.data.error_id" } }
          assert:
            - "422 with error_id ERR_INVALID_WINDOW for the zero-length window"
            - "window_start 2026-10-05T00:00:00Z with window_end 2026-10-03T00:00:00Z also returns 422 ERR_INVALID_WINDOW"
            - "window_start 2026-07-01T00:00:00Z (before the clock) also returns 422 ERR_INVALID_WINDOW, even though it is a valid ordered window"
            - "no outage row is created in any of the three cases: GET /cement-ops/kiln-outages?kiln_id=${k1} returns total_count 0"
            - "the ordered future window [2026-10-01T00:00:00Z, 2026-10-03T00:00:00Z) returns 201 with demand_season_class SHOULDER"

      - name: peak_season_outage_without_an_override_is_rejected
        claim_type: violation_to_error
        grounds: [validations, errors.ERR_PEAK_SEASON_OUTAGE, entities.KilnOutage.peak_season_override]
        distinguishing_aspect: >
          Rule 108 is a conditional validation: it applies only when the window intersects a month in
          the PLANT's peak_season_months, and it demands BOTH override true AND a PlantAdmin caller. A
          ProcessEngineer sending peak_season_override true must still be refused.
        test_recipe:
          setup: ["The plant's peak_season_months are [5, 6, 7, 8, 9] and the clock reads 2026-08-01T00:00:00Z."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-12T00:00:00Z", scope: "COMBINED" }, captures: { err: "$.data.error_id" } }
          assert:
            - "422 with error_id ERR_PEAK_SEASON_OUTAGE"
            - "the same window with peak_season_override true, still sent by the ProcessEngineer, returns 422 ERR_PEAK_SEASON_OUTAGE (the rule also pins the caller)"
            - "the same window with peak_season_override true sent by a PlantAdmin returns 201 with demand_season_class PEAK and status PLANNED"
            - "a window entirely inside October needs no override at all and is 201 with demand_season_class SHOULDER"
            - "a window spanning 2026-09-28 to 2026-10-02 is classed PEAK, because the class is the worst month the window intersects"

      - name: chlorine_gate_outranks_the_expired_authorization_gate
        claim_type: priority_ordering
        grounds: [validations]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / chlorine_input_priority_70_beats_expired_burn_test_priority_80
          rationale: "The 70-over-80 pair is asserted there with both orders of the same two violations."

      - name: silo_blocked_gate_outranks_the_clinker_availability_gate
        claim_type: priority_ordering
        grounds: [validations]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / silo_blocked_priority_62_beats_insufficient_clinker_priority_103
          rationale: "The 62-over-103 pair is asserted there, including the single-violation control cases."

      - name: limestone_cap_outranks_the_clinker_availability_gate
        claim_type: priority_ordering
        grounds: [validations]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / limestone_limit_priority_96_beats_insufficient_clinker_priority_103
          rationale: "The 96-over-103 pair is asserted there against the same batch-create call."

      - name: pile_lsf_deviation_gate_at_seal
        claim_type: violation_to_error
        grounds: [validations]
        excluded_because:
          difficulty_instance: dual_variant_calc / raw_mix_modules_diverge_between_design_basis_and_pile_basis
          rationale: "That instance seals a pile whose lsf_deviation is 7.82 against a 2.00 tolerance and asserts the ERR_PILE_LSF_OFF_TARGET refusal."

      - name: kiln_window_overlap_is_a_closed_interval_comparison
        claim_type: violation_to_error
        grounds: [validations]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / kiln_run_windows_are_closed_intervals_so_touching_windows_conflict
          rationale: "Touching windows, the one-second gap and ERR_KILN_WINDOW_CONFLICT are that instance's subject."

      - name: spout_capacity_is_an_aggregate_over_overlapping_orders
        claim_type: violation_to_error
        grounds: [validations]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / loadout_windows_are_half_open_and_spout_capacity_is_an_aggregate_over_overlaps
          rationale: "ERR_SILO_SPOUT_CAPACITY, ERR_DRAW_RATE_EXCEEDED and the half-open convention are all asserted there."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: customer_patch_is_a_partial_update
        claim_type: standard_crud
        grounds: [endpoints, entities.Customer.contract_state, entities.Customer.credit_hold]
        distinguishing_aspect: >
          Every input of PATCH /cement-ops/customers/{id} is optional, so a body carrying only
          credit_hold must leave contract_priority, contract_monthly_tonnes, max_so3_pct and
          contract_state exactly as they were and still bump version. An implementation that treats
          absent keys as null wipes the contract terms.
        test_recipe:
          setup: ["Customer CU1 exists with contract_priority 10, contract_monthly_tonnes 4000.00, max_so3_pct 3.00, contract_state ACTIVE, credit_hold false."]
          setup_api_calls: [*c_plant, *c_cu1]
          trigger:
            - { call: "PATCH /cement-ops/customers/${cu1}", as: LogisticsPlanner, payload: { credit_hold: true } }
            - { call: "GET /cement-ops/customers/${cu1}", as: LogisticsPlanner, payload: {} }
          assert:
            - "the PATCH is 200 with credit_hold true, contract_state ACTIVE, contract_priority 10, contract_monthly_tonnes 4000.00, max_so3_pct 3.00, required_cement_type TYPE_IL, version 2"
            - "the GET body equals the PATCH body field for field"
            - "an empty PATCH body {} is accepted and changes nothing except updated_at and version"
            - "a PATCH sending required_cement_type is ignored — it is not in the endpoint's input list, so TYPE_IL survives"
            - "open_reserved_tonnes and lifetime_loaded_tonnes stay 0.00 — computed fields are never writable"

      - name: start_loading_is_gated_on_the_half_open_appointment_window
        claim_type: action_endpoint
        grounds: [endpoints, state_machines.LoadoutOrder.transitions, errors.ERR_LOADOUT_WINDOW_NOT_ACTIVE]
        distinguishing_aspect: >
          The action endpoint enforces clock >= window_start AND clock < window_end. At exactly
          window_start it must succeed and at exactly window_end it must fail — the loadout convention
          is half-open, unlike the closed kiln-run windows, so the same overlap helper cannot serve both.
        test_recipe:
          setup: ["Order LO1 reserves 120.00 t out of SM1 for the window [2026-08-05T06:00:00Z, 2026-08-05T08:00:00Z); the clock still reads 2026-08-01T12:00:00Z."]
          setup_api_calls: *chain_order
          trigger:
            - { call: "POST /cement-ops/loadout-orders/${lo1}/start-loading", as: LogisticsPlanner, payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-05T06:00:00Z" } }
            - { call: "POST /cement-ops/loadout-orders/${lo1}/start-loading", as: LogisticsPlanner, payload: {} }
          assert:
            - "the first attempt returns 422 ERR_LOADOUT_WINDOW_NOT_ACTIVE with the order still RESERVED and loading_started_at null"
            - "the second attempt returns 200 with status LOADING and loading_started_at 2026-08-05T06:00:00.000Z (the window opens inclusively)"
            - "at exactly 2026-08-05T08:00:00Z the same call on a fresh RESERVED order returns 422 ERR_LOADOUT_WINDOW_NOT_ACTIVE (the window closes exclusively)"
            - "SM1 still reads reserved_tonnes 120.00 and available_tonnes 454.72 — LOADING does not move stock, only complete does"
            - "completing with loaded_tonnes 0.00 returns 400 ERR_INVALID_REQUEST, and with 120.01 returns 400 ERR_INVALID_REQUEST (0 < loaded_tonnes <= tonnes)"

      - name: distribution_plan_is_a_pure_computed_read
        claim_type: computed_read
        grounds: [endpoints, calculations.distribution_plan_waterfall]
        distinguishing_aspect: >
          as_of_month is a required input, and the endpoint persists nothing: no entity's version moves
          and two consecutive calls return byte-identical bodies. An implementation that caches the plan
          onto the Plant row (or that defaults as_of_month to the clock's month) is caught here.
        test_recipe:
          setup: ["Certificate MC1 is ISSUED, LO1 reserves 120.00 t and CU1 is the only eligible customer."]
          setup_api_calls: *chain_order
          trigger:
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: {} , captures: { err: "$.data.error_id" } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 8 } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: PlantAdmin, payload: { as_of_month: 8 } }
          assert:
            - "the call without as_of_month returns 400 ERR_INVALID_REQUEST — the input is required, not defaulted"
            - "the two month-8 calls return identical bodies with seasonal_factor 1.25, available_pool_tonnes 454.72, total_allocated_tonnes 454.72"
            - "the Plant version is the same before and after all three calls, and no LoadoutOrder or Silo version moves"
            - "the plan body carries plant_id, as_of_month, seasonal_factor, available_pool_tonnes, allocations[], total_allocated_tonnes and total_shortfall_tonnes — no pagination envelope, because it is not a list endpoint"
            - "a KilnOperator calling the same path returns 403 ERR_UNAUTHORIZED (only PlantAdmin and LogisticsPlanner are declared)"

      - name: unblocking_a_clinker_silo_restores_only_the_batches_it_can_cover
        claim_type: conditional_action
        grounds: [endpoints, state_machines.Silo.transitions, entities.CementBatch.feed_state, entities.Plant.production_posture]
        distinguishing_aspect: >
          PATCH status=OPEN runs the restore walk in created_at ASC order and only while available_tonnes
          still covers each batch's draw, so the FIRST batch is restored and the SECOND (whose 200.00 t
          no longer fit under the remaining 83.78 t) stays FEED_SHORT — which keeps production_posture
          CONSTRAINED. An implementation that flips every FEED_SHORT batch back over-reserves the silo.
        test_recipe:
          setup: ["SC1 holds 583.78 t of released clinker. Batch B1 (500.00 t) and then batch B4 (200.00 t) are planned against it, so B4 is already FEED_SHORT at creation; blocking SC1 then also drops B1 to FEED_SHORT."]
          setup_api_calls: *chain_run
          trigger:
            - *c_b1
            - { call: "GET /cement-ops/silos/${sc1}", as: ProcessEngineer, payload: {}, captures: { sc1_v4: "$.data.version" } }
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_IL", clinker_tonnes_drawn: 200.00, gypsum_pct: 5.00, limestone_pct: 8.00, blaine_target_m2_per_kg: 400, expected_clinker_silo_version: "${sc1_v4}" }, captures: { err: "$.data.error_id" } }
            - { call: "PATCH /cement-ops/silos/${sc1}", as: PlantAdmin, payload: { status: "BLOCKED", block_reason: "SILO_INSPECTION" } }
            - { call: "PATCH /cement-ops/silos/${sc1}", as: PlantAdmin, payload: { status: "OPEN" } }
            - { call: "GET /cement-ops/cement-batches/${b1}", as: ProcessEngineer, payload: {} }
          assert:
            - "the 200.00 t batch create returns 422 ERR_INSUFFICIENT_CLINKER, because only 83.78 t remain unreserved — so exactly one PLANNED batch (B1) exists"
            - "the block is 200 and leaves B1 at feed_state FEED_SHORT with status PLANNED, SC1 reserved_tonnes 0.00, and the plant at production_posture CONSTRAINED"
            - "the unblock is 200 with status OPEN and block_reason null"
            - "the batch GET reads feed_state FEED_READY with clinker_tonnes_drawn still 500.00, SC1 reads reserved_tonnes 500.00 and available_tonnes 83.78"
            - "the plant reads production_posture NORMAL again — no batch of the plant is FEED_SHORT"
            - "start-grinding on B1 now returns 200 with status GRINDING, which it would not before the unblock"

      - name: lab_test_needs_exactly_one_subject_of_the_right_kind
        claim_type: cross_reference_link
        grounds: [endpoints, entities.LabTest.kiln_run_id, entities.LabTest.cement_batch_id, errors.ERR_TEST_SUBJECT_INVALID]
        distinguishing_aspect: >
          The polymorphic subject must be exactly one of kiln_run_id / cement_batch_id AND must match
          the test_type: FREE_LIME belongs to a KilnRun, BLAINE and 28-day strength to a CementBatch.
          Neither, both, or the wrong kind is 422 ERR_TEST_SUBJECT_INVALID — an implementation that only
          checks presence records free lime against a cement batch and computes bounds from the wrong
          parent.
        test_recipe:
          setup: ["Run R0 is COMPLETED and batch B1 is GROUND, so both subject kinds exist and are in testable states."]
          setup_api_calls: *chain_ground
          trigger:
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.20 }, captures: { err: "$.data.error_id" } }
          assert:
            - "422 with error_id ERR_TEST_SUBJECT_INVALID when neither subject id is supplied"
            - "supplying BOTH kiln_run_id ${r0} and cement_batch_id ${b1} also returns 422 ERR_TEST_SUBJECT_INVALID"
            - "test_type FREE_LIME with cement_batch_id ${b1} returns 422 ERR_TEST_SUBJECT_INVALID, and BLAINE with kiln_run_id ${r0} does too"
            - "a bogus kiln_run_id returns 404 ERR_KILN_RUN_NOT_FOUND (rule 35 outranks rule 89)"
            - "the correct pairing FREE_LIME + kiln_run_id ${r0} returns 201 with unit PCT, spec_max 1.50 and in_spec true"

      - name: kiln_run_list_filters_compose_across_both_state_dimensions
        claim_type: standard_crud
        grounds: [endpoints, entities.KilnRun.process_state, entities.KilnRun.quality_state]
        distinguishing_aspect: >
          process_state and quality_state are independent query filters that must AND together, and
          total_count must reflect the filtered set. An implementation that maps both onto one status
          column returns the run for one filter and nothing for the other.
        test_recipe:
          setup: ["Run R0 is COMPLETED with quality_state RELEASED; it is the only run in the database."]
          setup_api_calls: *chain_run
          trigger:
            - { call: "GET /cement-ops/kiln-runs", as: KilnOperator, payload: { process_state: "COMPLETED", quality_state: "RELEASED", limit: 50, offset: 0 } }
            - { call: "GET /cement-ops/kiln-runs", as: KilnOperator, payload: { process_state: "COMPLETED", quality_state: "QUARANTINED" } }
            - { call: "GET /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", clinker_silo_id: "${sm1}" } }
          assert:
            - "the first list returns total_count 1, has_more false and one item whose id is ${r0}"
            - "the second list returns total_count 0 with an empty items array and has_more false — the two dimensions AND together"
            - "the third list returns total_count 0: the run's clinker_silo_id is ${sc1}, so a correct kiln_id plus a wrong silo filter matches nothing"
            - "GET /cement-ops/kiln-runs?blended_pile_id=${pa} returns total_count 1 — the FK filter gives the pile its reverse-reachability"
            - "offset 1 with limit 50 returns total_count 1 with an empty items array"

  # ===========================================================================
  # Section 6 — errors. The contract is triggerability: every one of the 74
  # ERR_* codes in SCAFFOLD.yaml §1.6 must be reachable by at least one test in
  # the union of §1.8 and §1.9. Codes already raised by an earlier §1.9 section
  # (ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST,
  # ERR_INVALID_PAGINATION, ERR_PILE_EMPTY, ERR_DESIGN_NOT_APPROVED,
  # ERR_COMPONENTS_SUM_INVALID, ERR_MODULE_TARGET_DEVIATION,
  # ERR_ALT_RAW_SUBSTITUTION_EXCEEDED, ERR_PEAK_SEASON_OUTAGE,
  # ERR_INVALID_WINDOW, ERR_RUN_WINDOW_NOT_ELAPSED, ERR_LOADOUT_WINDOW_NOT_ACTIVE,
  # ERR_TEST_SUBJECT_INVALID, ERR_INVALID_BATCH_STATE, ERR_INVALID_CERTIFICATE_STATE,
  # ERR_STALE_SILO_VERSION, ERR_SEGREGATION_OF_DUTIES) are not repeated here;
  # ERR_CUSTOMER_SCOPE_VIOLATION lands in the rbac section and the three
  # ERR_STALE_*_VERSION codes in the cross-cutting section.
  - section: errors
    instances:

      - name: every_entity_id_path_returns_its_own_not_found
        claim_type: error_triggerable
        grounds: [errors, endpoints]
        distinguishing_aspect: >
          Fifteen distinct 404 codes exist because the message must name the entity that was missing.
          An implementation with one generic ERR_NOT_FOUND passes a single-entity test and fails
          fourteen others; one that returns 500 on an unparseable id fails all fifteen.
        test_recipe:
          setup: ["The reference layer exists so that every collection is non-empty; the probed id belongs to no row."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "GET /cement-ops/plants/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "GET /cement-ops/raw-materials/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/fuels/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/customers/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/raw-mix-designs/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/blended-piles/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/burn-tests/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/kilns/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/kiln-runs/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/kiln-outages/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/silos/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/cement-batches/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/lab-tests/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/mill-certificates/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
            - { call: "GET /cement-ops/loadout-orders/11111111-1111-1111-1111-111111111111", as: PlantAdmin, payload: {} }
          assert:
            - "the fifteen calls return 404 with error_id ERR_PLANT_NOT_FOUND, ERR_RAW_MATERIAL_NOT_FOUND, ERR_FUEL_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_DESIGN_NOT_FOUND, ERR_PILE_NOT_FOUND, ERR_BURN_TEST_NOT_FOUND, ERR_KILN_NOT_FOUND, ERR_KILN_RUN_NOT_FOUND, ERR_OUTAGE_NOT_FOUND, ERR_SILO_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_LAB_TEST_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND and ERR_ORDER_NOT_FOUND respectively"
            - "every body carries a non-empty message and an error_id — never a bare 404 with an empty body"
            - "a syntactically impossible id such as 'not-a-uuid' on the same paths still returns the entity's own 404 code, not 400 and not 500"
            - "an id that exists but belongs to a DIFFERENT entity (a Plant id used on GET /cement-ops/silos/{silo_id}) returns 404 ERR_SILO_NOT_FOUND"
            - "the list endpoints are unaffected: GET /cement-ops/silos still returns 200 with total_count 2"

      - name: each_lifecycle_rejects_a_transition_from_the_wrong_state
        claim_type: error_triggerable
        grounds: [errors.ERR_INVALID_DESIGN_STATE, errors.ERR_INVALID_BURN_TEST_STATE, errors.ERR_INVALID_OUTAGE_STATE, validations.60]
        distinguishing_aspect: >
          Rule 60 is one rule but eight error codes: the code names the SUBJECT entity, so the same
          "wrong from-state" fault must surface as ERR_INVALID_DESIGN_STATE on a design, as
          ERR_INVALID_BURN_TEST_STATE on a burn test and as ERR_INVALID_OUTAGE_STATE on an outage.
          Rule 60 also outranks the later semantic rules, so the burn test's own segregation check
          (55 is earlier) and the design's revision counter (93 is later) must not be consulted here.
        test_recipe:
          setup: ["Design D2 is APPROVED. A burn test for RDF-1 has just been requested (status REQUESTED). A refractory outage for K1 is PLANNED in shoulder-season October."]
          setup_api_calls: *chain_design
          trigger:
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/request-revision", as: QualityManager, payload: { revision_reason: "late second thoughts" } }
            - { call: "POST /cement-ops/burn-tests", as: EnvironmentalOfficer, payload: { plant_id: "${plant}", fuel_id: "${rdf}", requested_max_tsr_pct: 25.00, valid_days: 30 }, captures: { bt: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt}/adjudicate", as: EnvironmentalOfficer, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 25.00 } }
            - { call: "POST /cement-ops/burn-tests/${bt}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.80, measured_nox_kg_per_gj: 0.22, stack_compliant: true } }
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-03T00:00:00Z", scope: "REFRACTORY" }, captures: { ko: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-outages/${ko}/complete", as: ProcessEngineer, payload: { refractory_replaced: true } }
            - { call: "POST /cement-ops/kiln-outages/${ko}/start", as: ProcessEngineer, payload: {} }
          assert:
            - "the second approve returns 409 ERR_INVALID_DESIGN_STATE — APPROVED is not a legal from-state for approve"
            - "submit and request-revision on the APPROVED design also return 409 ERR_INVALID_DESIGN_STATE, and the design's revision_count stays 0 (rule 60 fires before rule 93 is ever evaluated)"
            - "adjudicate on the REQUESTED burn test returns 409 ERR_INVALID_BURN_TEST_STATE, not 422 — the state gate precedes the stack_compliant and authorized_max_tsr_pct checks"
            - "record-result on the REQUESTED burn test returns 409 ERR_INVALID_BURN_TEST_STATE too: start must run first"
            - "complete and start on the PLANNED outage both return 409 ERR_INVALID_OUTAGE_STATE, and the outage stays PLANNED with started_at and completed_at null"
            - "the design's version, the burn test's version and the outage's version are all unchanged by the nine refusals"

      - name: lighting_a_kiln_outside_its_window_or_while_unavailable_is_rejected
        claim_type: error_triggerable
        grounds: [errors.ERR_RUN_WINDOW_NOT_ACTIVE, errors.ERR_KILN_UNAVAILABLE, validations.66, validations.82]
        distinguishing_aspect: >
          Two different refusals guard the same action and rule 66 is checked before rule 82, so a
          kiln that is already BURNING must answer ERR_KILN_UNAVAILABLE even when the clock is ALSO
          outside the second run's window. An implementation that checks the window first reports the
          wrong code for the ordinary "kiln is busy" case.
        test_recipe:
          setup: ["Pile PA is SEALED, kiln K1 is AVAILABLE and the clock reads 2026-08-01T00:00:00Z."]
          setup_api_calls: *chain_sealed
          trigger:
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T12:00:00Z" }, captures: { rc: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${rc}/light", as: KilnOperator, payload: {}, captures: { err: "$.data.error_id" } }
            - *c_r0
            - *c_r0_light
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T12:00:00Z" }, captures: { rb: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${rb}/light", as: KilnOperator, payload: {} }
          assert:
            - "lighting RC at 2026-08-01T00:00:00Z returns 422 ERR_RUN_WINDOW_NOT_ACTIVE: the clock has not reached its 2026-08-10T00:00:00Z start"
            - "lighting R0 succeeds with process_state BURNING because the clock sits exactly on its window_start (the firing window is entered inclusively)"
            - "lighting RB returns 409 ERR_KILN_UNAVAILABLE, NOT 422 ERR_RUN_WINDOW_NOT_ACTIVE and NOT 409 ERR_INVALID_PILE_STATE — rule 66 is the earliest failing rule even though the clock is outside RB's window and PA is already CONSUMED"
            - "RB stays process_state SCHEDULED and K1 keeps exactly one BURNING run"
            - "after aborting R0, lighting RB still returns 422 ERR_RUN_WINDOW_NOT_ACTIVE — with the kiln free, rule 82 becomes the first failing rule"

      - name: an_outage_window_colliding_with_a_run_or_another_outage_is_rejected
        claim_type: error_triggerable
        grounds: [errors.ERR_OUTAGE_WINDOW_CONFLICT, validations.87]
        distinguishing_aspect: >
          Rule 87 has two limbs with different geometry: a cooldown-buffered clearance against
          SCHEDULED/BURNING runs, and a plain half-open overlap against other live outages. It also
          outranks the peak-season override gate, so an August outage that collides with a run answers
          ERR_OUTAGE_WINDOW_CONFLICT — not ERR_PEAK_SEASON_OUTAGE — even though August is a peak month.
        test_recipe:
          setup: ["Run R0 is SCHEDULED for [2026-08-01T00:00:00Z, 2026-08-01T12:00:00Z] on K1, whose cooldown_buffer_hours is 12. Plant peak_season_months are [5,6,7,8,9]."]
          setup_api_calls: *chain_sealed
          trigger:
            - *c_r0
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-08-01T18:00:00Z", window_end: "2026-08-02T06:00:00Z", scope: "REFRACTORY", peak_season_override: true }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-03T00:00:00Z", scope: "REFRACTORY" }, captures: { ko1: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-10-02T00:00:00Z", window_end: "2026-10-04T00:00:00Z", scope: "BURNER" } }
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-10-03T00:00:00Z", window_end: "2026-10-05T00:00:00Z", scope: "BURNER" } }
          assert:
            - "the 2026-08-01T18:00:00Z outage returns 409 ERR_OUTAGE_WINDOW_CONFLICT: the run ends at 12:00 and 12:00 + 12 cooldown hours = 2026-08-02T00:00:00Z, which is past the outage's start"
            - "that refusal is 409 ERR_OUTAGE_WINDOW_CONFLICT and not 422 ERR_PEAK_SEASON_OUTAGE, even though the window sits in peak month 8 — priority 87 precedes priority 108"
            - "the October 1-3 outage is created with status PLANNED and demand_season_class SHOULDER"
            - "the October 2-4 outage returns 409 ERR_OUTAGE_WINDOW_CONFLICT — it overlaps the PLANNED outage, which counts even before approval"
            - "the October 3-5 outage is accepted: [2026-10-01, 2026-10-03) and [2026-10-03, 2026-10-05) merely touch, and touching windows do not overlap on the outage-versus-outage limb"
            - "an outage on a DIFFERENT kiln covering 2026-10-02 to 2026-10-04 is accepted — the rule is scoped per kiln"

      - name: a_lab_test_on_an_untestable_subject_is_rejected
        claim_type: error_triggerable
        grounds: [errors.ERR_LAB_SUBJECT_STATE_INVALID, validations.90]
        distinguishing_aspect: >
          Rule 89 checks that the subject KIND matches the test type; rule 90 then checks that the
          subject is in a testable STATE, which differs per kind (a run must be BURNING or COMPLETED,
          a batch must be GROUND). A SCHEDULED run and a PLANNED batch are therefore 409s, not 422s,
          and the two rules must not be collapsed into one code.
        test_recipe:
          setup: ["Run R0 is COMPLETED and RELEASED with its free-lime test on file; the clock reads 2026-08-01T12:00:00Z."]
          setup_api_calls: *chain_run
          trigger:
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T12:00:00Z" }, captures: { rs: "$.data.id" } }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.20, kiln_run_id: "${rs}" }, captures: { err: "$.data.error_id" } }
            - *c_b1
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "BLAINE", value: 400, cement_batch_id: "${b1}" } }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "COMPRESSIVE_STRENGTH_28D", value: 30.0, cement_batch_id: "${b1}" } }
          assert:
            - "the FREE_LIME test on the SCHEDULED run RS returns 409 ERR_LAB_SUBJECT_STATE_INVALID (the run has not been lit)"
            - "the BLAINE test on the PLANNED batch B1 returns 409 ERR_LAB_SUBJECT_STATE_INVALID, and so does the 28-day strength test — GROUND is the only testable batch state"
            - "no LabTest row is created by any of the three refusals: GET /cement-ops/lab-tests?cement_batch_id=${b1} returns total_count 0"
            - "B1 keeps strength_branch_state and fineness_branch_state at PENDING and its version does not move"
            - "the identical FREE_LIME call against the COMPLETED run ${r0} returns 201, proving the refusal is about state and not about the payload"

      - name: charging_an_unauthorized_alternative_fuel_is_rejected
        claim_type: error_triggerable
        grounds: [errors.ERR_BURN_TEST_NOT_AUTHORIZED, validations.80, calculations.thermal_substitution_rate]
        distinguishing_aspect: >
          The authorization is per (plant, fuel) pair, so authorizing TDF-1 does nothing for RDF-1, and
          an unauthorized fuel is refused OUTRIGHT rather than being folded into the TSR ceiling as a
          zero. An implementation that keys the burn test off the plant alone lets any alternative fuel
          ride on the first authorization it finds.
        test_recipe:
          setup: ["Run R0 is BURNING with 45.00 t of GAS-1 charged (2160.00 GJ gross). No burn test exists yet."]
          setup_api_calls: *chain_burning
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${rdf}", tonnes: 5.00 }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/burn-tests", as: EnvironmentalOfficer, payload: { plant_id: "${plant}", fuel_id: "${tdf}", requested_max_tsr_pct: 10.00, valid_days: 30 }, captures: { bt2: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt2}/start", as: LabTechnician, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt2}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.10, measured_nox_kg_per_gj: 0.18, stack_compliant: true } }
            - { call: "POST /cement-ops/burn-tests/${bt2}/adjudicate", as: EnvironmentalOfficer, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 10.00 } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${rdf}", tonnes: 5.00 } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${tdf}", tonnes: 5.00 } }
          assert:
            - "the first RDF-1 charge returns 422 ERR_BURN_TEST_NOT_AUTHORIZED, and the run keeps gross_energy_gj 2160.00 and tsr_pct 0.00"
            - "the refusal is ERR_BURN_TEST_NOT_AUTHORIZED and not ERR_TSR_CAP_EXCEEDED: at 5.00 t the would-be TSR is 90.00 / 2250.00 = 4.00 %, comfortably under the 35.00 permit ceiling, so no ceiling arithmetic can explain the refusal"
            - "the TDF-1 burn test walks REQUESTED -> IN_PROGRESS -> RESULT_RECORDED -> AUTHORIZED with valid_from 2026-08-01T00:00:00.000Z and valid_until 2026-08-31T00:00:00.000Z"
            - "the second RDF-1 charge still returns 422 ERR_BURN_TEST_NOT_AUTHORIZED — the AUTHORIZED row is for TDF-1"
            - "the TDF-1 charge of 5.00 t is accepted: gross_energy_gj 2310.00, alt energy 150.00 and tsr_pct 6.49, under the collapsed ceiling min(35.00, 10.00) = 10.00"
            - "a charge of a NON-alternative fuel (COAL-1) never consults a burn test at all"

      - name: a_charge_that_would_overdraw_the_annual_nox_budget_is_rejected
        claim_type: error_triggerable
        grounds: [errors.ERR_NOX_BUDGET_EXCEEDED, validations.100, entities.Plant.permit_nox_budget_remaining_kg]
        distinguishing_aspect: >
          The budget check is prospective — it is evaluated on the value the plant WOULD have after the
          charge — and it precedes the kiln-feed sufficiency check, so an absurd charge answers
          ERR_NOX_BUDGET_EXCEEDED rather than ERR_INSUFFICIENT_KILN_FEED. A refused charge must also
          leave the ledger untouched.
        test_recipe:
          setup: ["Run R0 is BURNING with 45.00 t of GAS-1: nox_emitted_kg 216.00, so the plant's permit_nox_budget_remaining_kg reads 1999784.00 out of 2000000."]
          setup_api_calls: *chain_burning
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 220000.00 }, captures: { err: "$.data.error_id" } }
            - { call: "GET /cement-ops/plants/${plant}", as: EnvironmentalOfficer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 79.00 } }
            - { call: "GET /cement-ops/plants/${plant}", as: EnvironmentalOfficer, payload: {} }
          assert:
            - "the 220000.00 t charge returns 422 ERR_NOX_BUDGET_EXCEEDED: it would emit 220000.00 * 27.00 * 0.35 = 2079000.00 kg against 1999784.00 kg remaining"
            - "the refusal is ERR_NOX_BUDGET_EXCEEDED and not ERR_INSUFFICIENT_KILN_FEED (priority 100 precedes 101), and not ERR_CHLORINE_INPUT_EXCEEDED — the chlorine input would be 44.00 kg, under the 500.00 ceiling"
            - "the first plant read still shows permit_nox_budget_remaining_kg 1999784.00 and the run still shows gross_energy_gj 2160.00 with no third FuelCharge recorded"
            - "the 79.00 t charge is accepted and the second plant read shows permit_nox_budget_remaining_kg 1999037.45 (2000000 - 216.00 - 746.55)"
            - "a charge landing the remainder at exactly 0.00 is accepted — equality is allowed"

      - name: crediting_more_clinker_than_the_silo_can_hold_is_rejected
        claim_type: error_triggerable
        grounds: [errors.ERR_SILO_CAPACITY_EXCEEDED, validations.102, state_machines.KilnRun.transitions]
        distinguishing_aspect: >
          Clinker is credited at COMPLETE, not at release, so the capacity ceiling is enforced by the
          complete action — and it is checked after the kiln-feed sufficiency rule. An implementation
          that credits the silo first and validates afterwards leaves a silo above its own capacity.
        test_recipe:
          setup: ["A second clinker silo SC2 holds only 500.00 t. Run RD burns pile PA (dry 1000.00 t) into SC2 and produces 583.78 t of clinker from 45.00 t of GAS-1."]
          setup_api_calls: *chain_sealed
          trigger:
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC2", material_kind: "CLINKER", capacity_tonnes: 500.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc2: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc2}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { rd: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${rd}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${rd}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${gas}", tonnes: 45.00 } }
            - *c_clock_0801_12
            - { call: "POST /cement-ops/kiln-runs/${rd}/complete", as: KilnOperator, payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "GET /cement-ops/silos/${sc2}", as: ProcessEngineer, payload: {} }
          assert:
            - "the complete returns 422 ERR_SILO_CAPACITY_EXCEEDED: 0.00 on hand + 583.78 credited exceeds capacity_tonnes 500.00"
            - "the refusal is ERR_SILO_CAPACITY_EXCEEDED and not ERR_INSUFFICIENT_KILN_FEED — round(583.78 * 1.55, 2) = 904.86 is under the pile's dry_tonnes 1000.00, so rule 101 passes"
            - "the silo read shows tonnes_on_hand 0.00, unreleased_tonnes 0.00 and available_tonnes 0.00 — nothing was credited before the check"
            - "run RD stays process_state BURNING with clinker_tonnes still provisional and completed_at null, and K1 still reads availability_state AVAILABLE with refractory_hours_since_reline 0"
            - "with SC2's capacity at exactly 583.78 the same complete succeeds and the silo reads tonnes_on_hand 583.78, unreleased_tonnes 583.78, available_tonnes 0.00 — equality is allowed"

      - name: certificate_creation_rejects_an_unqualified_batch_and_an_unmet_customer_spec
        claim_type: error_triggerable
        grounds: [errors.ERR_BATCH_NOT_QUALIFIED, errors.ERR_CUSTOMER_SPEC_NOT_MET, validations.98, validations.99]
        distinguishing_aspect: >
          Two consecutive rules with different HTTP statuses: the batch-state gate is a 409 and the
          contract-spec mismatch is a 422, and the spec limb has two independent legs (cement type and
          SO3 ceiling). An implementation that only compares cement types certifies 2.85 % SO3 cement
          to a customer capped at 2.50 %.
        test_recipe:
          setup: ["Batch B1 is GROUND (TYPE_IL, cement_tonnes 574.72, so3_pct 2.85) with both lab branches still PENDING."]
          setup_api_calls: *chain_ground
          trigger:
            - { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu1}", certified_tonnes: 100.00 }, captures: { err: "$.data.error_id" } }
            - *c_lab_blaine_ok
            - *c_lab_str_ok
            - { call: "POST /cement-ops/customers", as: LogisticsPlanner, payload: { name: "Type One Only", region_code: "US-MW", contract_priority: 20, contract_monthly_tonnes: 1000.00, required_cement_type: "TYPE_I", max_so3_pct: 3.00 }, captures: { cu3: "$.data.id" } }
            - { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu3}", certified_tonnes: 100.00 } }
            - { call: "POST /cement-ops/customers", as: LogisticsPlanner, payload: { name: "Low Sulfate Spec", region_code: "US-MW", contract_priority: 30, contract_monthly_tonnes: 1000.00, required_cement_type: "TYPE_IL", max_so3_pct: 2.50 }, captures: { cu4: "$.data.id" } }
            - { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu4}", certified_tonnes: 100.00 } }
            - { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu1}", certified_tonnes: 100.00 }, captures: { mcx: "$.data.id" } }
          assert:
            - "the first certificate attempt returns 409 ERR_BATCH_NOT_QUALIFIED — GROUND is not in {QUALIFIED, CERTIFIED}"
            - "after the two in-spec lab tests the batch is QUALIFIED and its cement becomes sellable"
            - "the TYPE_I customer attempt returns 422 ERR_CUSTOMER_SPEC_NOT_MET on the cement-type leg"
            - "the max_so3_pct 2.50 customer attempt returns 422 ERR_CUSTOMER_SPEC_NOT_MET on the SO3 leg, because the batch's so3_pct 2.85 is above it — the cement type matches, so a type-only implementation wrongly accepts"
            - "the CU1 attempt returns 201 with status DRAFT and certified_tonnes 100.00, while the batch stays QUALIFIED with certified_tonnes_allocated 0.00 until the certificate is issued"
            - "none of the three refusals creates a MillCertificate row: GET /cement-ops/mill-certificates?cement_batch_id=${b1} returns total_count 1"

      - name: loadout_order_creation_rejects_every_certificate_defect
        claim_type: error_triggerable
        grounds: [errors.ERR_CERTIFICATE_NOT_ISSUED, errors.ERR_CERTIFICATE_CUSTOMER_MISMATCH, errors.ERR_CERTIFICATE_ALLOCATION_EXCEEDED, errors.ERR_INSUFFICIENT_CEMENT, errors.ERR_SILO_KIND_MISMATCH, validations.105]
        distinguishing_aspect: >
          Rule 105 is one rule with three ordered limbs, and rules 88 and 104 sit in front of it. So
          the same endpoint must distinguish five refusals whose only difference is which field is
          wrong — and the cement-availability check must fire BEFORE the certificate allocation check,
          which is what separates "the silo cannot supply it" from "the certificate does not cover it".
        test_recipe:
          setup: ["Batch B1 is GROUND; the two in-spec lab tests qualify it, so SM1 has 574.72 t available. MC2 certifies 100.00 t to CU1 and is ISSUED; MC3 certifies another 100.00 t to CU1 and stays DRAFT."]
          setup_api_calls: *chain_ground
          trigger:
            - *c_lab_blaine_ok
            - *c_lab_str_ok
            - { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu1}", certified_tonnes: 100.00 }, captures: { mc2: "$.data.id" } }
            - { call: "POST /cement-ops/mill-certificates/${mc2}/issue", as: QualityManager, payload: {}, captures: { mc2_v: "$.data.version" } }
            - { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu1}", certified_tonnes: 100.00 }, captures: { mc3: "$.data.id", mc3_v: "$.data.version" } }
            - { call: "POST /cement-ops/customers", as: LogisticsPlanner, payload: { name: "Other Buyer", region_code: "US-MW", contract_priority: 40, contract_monthly_tonnes: 1000.00, required_cement_type: "TYPE_IL", max_so3_pct: 3.00 }, captures: { cu5: "$.data.id" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc2}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 100.01, expected_mill_certificate_version: "${mc2_v}" }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc2}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 600.00, expected_mill_certificate_version: "${mc2_v}" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu5}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc2}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 50.00, expected_mill_certificate_version: "${mc2_v}" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc3}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 50.00, expected_mill_certificate_version: "${mc3_v}" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sc1}", mill_certificate_id: "${mc2}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 50.00, expected_mill_certificate_version: "${mc2_v}" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc2}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 100.00, expected_mill_certificate_version: "${mc2_v}" } }
          assert:
            - "tonnes 100.01 returns 422 ERR_CERTIFICATE_ALLOCATION_EXCEEDED: allocated 0.00 + 100.01 is above the certificate's 100.00, while 100.01 t of cement IS available"
            - "tonnes 600.00 returns 422 ERR_INSUFFICIENT_CEMENT, not ERR_CERTIFICATE_ALLOCATION_EXCEEDED — rule 104 precedes rule 105, and it also precedes the 500.00 t draw-rate ceiling of rule 107"
            - "the CU5 order returns 422 ERR_CERTIFICATE_CUSTOMER_MISMATCH — the certificate belongs to CU1"
            - "the MC3 order returns 422 ERR_CERTIFICATE_NOT_ISSUED because MC3 is DRAFT; the same code answers a REVOKED certificate"
            - "the order aimed at the CLINKER silo SC1 returns 422 ERR_SILO_KIND_MISMATCH (rule 88 precedes both 104 and 105)"
            - "the final 100.00 t order is created RESERVED with the certificate's allocated_tonnes moving to exactly 100.00 (equality allowed) and SM1 reserved_tonnes 100.00, available_tonnes 474.72"
            - "no refused attempt leaves a LoadoutOrder row or moves the certificate's allocated_tonnes off 0.00"

      - name: a_distribution_plan_with_no_eligible_customer_is_rejected
        claim_type: error_triggerable
        grounds: [errors.ERR_NO_ELIGIBLE_CUSTOMERS, validations.109, calculations.distribution_plan_waterfall]
        distinguishing_aspect: >
          Eligibility, not availability, drives this refusal: the plan is refused when the eligible set
          is EMPTY even though a pool may exist, and it is returned with an all-zero pool when the set
          is non-empty. An implementation that returns an empty allocations array instead of erroring
          hides a broken customer filter.
        test_recipe:
          setup: ["CU1 (US-MW, ACTIVE, no hold) is the only customer of the plant."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 8 } }
            - { call: "PATCH /cement-ops/customers/${cu1}", as: LogisticsPlanner, payload: { credit_hold: true } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 8 }, captures: { err: "$.data.error_id" } }
            - { call: "PATCH /cement-ops/customers/${cu1}", as: LogisticsPlanner, payload: { credit_hold: false, contract_state: "SUSPENDED" } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 8 } }
          assert:
            - "the first plan returns 200 with available_pool_tonnes 0.00 and one allocation for CU1 with demand_tonnes 5000.00, allocated_tonnes 0.00 and shortfall_tonnes 5000.00 — an empty pool is not an error"
            - "with CU1 on credit hold the plan returns 422 ERR_NO_ELIGIBLE_CUSTOMERS"
            - "with the hold cleared but contract_state SUSPENDED the plan still returns 422 ERR_NO_ELIGIBLE_CUSTOMERS — the two eligibility legs are independent"
            - "a customer whose region_code is not the plant's returns the same 422 when it is the only customer, proving the region leg is also part of eligibility"
            - "the refusals persist nothing: CU1's version reflects only the two PATCH calls"

      # --- codes whose only sensible trigger is already a §1.8 depth instance ---

      - name: err_tsr_cap_exceeded_is_reached_by_the_ceiling_boundary_pair
        claim_type: error_triggerable
        grounds: [errors.ERR_TSR_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / tsr_at_exactly_the_ceiling_is_allowed_and_one_hundredth_over_is_refused
          rationale: >
            That instance charges the exact-ceiling mix (accepted) and then one hundredth over
            (refused with ERR_TSR_CAP_EXCEEDED), so the code is triggered at its only interesting
            input. A separate corner test could only re-issue an oversized charge.

      - name: err_chlorine_and_expired_burn_test_are_reached_by_their_priority_pair
        claim_type: error_triggerable
        grounds: [errors.ERR_CHLORINE_INPUT_EXCEEDED, errors.ERR_BURN_TEST_EXPIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / chlorine_input_priority_70_beats_expired_burn_test_priority_80
          rationale: >
            The pair test constructs a charge that violates both rules, asserts
            ERR_CHLORINE_INPUT_EXCEEDED, then fixes the chlorine and asserts ERR_BURN_TEST_EXPIRED
            from the same clock position — both codes are triggered, in the order the ladder demands.

      - name: err_revision_limit_exceeded_is_reached_by_the_capped_revision_cycle
        claim_type: error_triggerable
        grounds: [errors.ERR_REVISION_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / design_revision_cycle_is_capped_at_three_rounds_then_rejected
          rationale: >
            Reaching the code requires walking three full DRAFT -> SUBMITTED -> REVISION_REQUESTED
            rounds, which is exactly the cycle that instance walks before asserting the fourth
            request-revision returns ERR_REVISION_LIMIT_EXCEEDED.

      - name: err_silo_blocked_is_reached_by_the_blocked_over_insufficient_pair
        claim_type: error_triggerable
        grounds: [errors.ERR_SILO_BLOCKED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / silo_blocked_priority_62_beats_insufficient_clinker_priority_103
          rationale: >
            The code is asserted there against a silo that is both blocked and short at once, which
            is a strictly stronger trigger than a plain blocked-silo draw.

      - name: err_limestone_and_insufficient_clinker_are_reached_by_their_priority_pair
        claim_type: error_triggerable
        grounds: [errors.ERR_LIMESTONE_LIMIT_EXCEEDED, errors.ERR_INSUFFICIENT_CLINKER]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / limestone_limit_priority_96_beats_insufficient_clinker_priority_103
          rationale: >
            That instance asserts ERR_LIMESTONE_LIMIT_EXCEEDED on the doubly-invalid batch and then
            ERR_INSUFFICIENT_CLINKER once the limestone share is legal, triggering both codes.

      - name: err_free_lime_out_of_spec_is_reached_by_the_ceiling_boundary
        claim_type: error_triggerable
        grounds: [errors.ERR_FREE_LIME_OUT_OF_SPEC]
        excluded_because:
          difficulty_instance: boundary_precision_check / free_lime_exactly_at_the_plant_ceiling_is_in_spec
          rationale: >
            The boundary instance releases at exactly the ceiling and then asserts that one hundredth
            above it quarantines the run and refuses the release with ERR_FREE_LIME_OUT_OF_SPEC,
            including the no-test-at-all case.

      - name: err_invalid_pile_state_is_reached_by_the_sealed_pile_gate
        claim_type: error_triggerable
        grounds: [errors.ERR_INVALID_PILE_STATE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lighting_a_kiln_requires_the_blended_pile_to_be_sealed
          rationale: >
            The cross-entity gate instance lights against a BLENDING pile and then against a CONSUMED
            one, asserting ERR_INVALID_PILE_STATE for both from-states.

      - name: err_batch_feed_short_is_reached_by_the_cross_entity_feed_gate
        claim_type: error_triggerable
        grounds: [errors.ERR_BATCH_FEED_SHORT]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / grinding_is_gated_on_a_feed_state_owned_by_a_different_entitys_quality_verdict
          rationale: >
            Triggering the code needs a batch whose feed_state was flipped by another entity's
            re-quarantine; that instance builds exactly that state and asserts the start-grinding
            refusal.

      - name: err_kiln_window_conflict_is_reached_by_the_closed_interval_touch
        claim_type: error_triggerable
        grounds: [errors.ERR_KILN_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / kiln_run_windows_are_closed_intervals_so_touching_windows_conflict
          rationale: >
            The overlap instance asserts the code for a merely touching window, for a nested window
            and for the outage-clearance limb — every geometry that can raise it.

      - name: err_spout_capacity_and_draw_rate_are_reached_by_the_half_open_aggregate
        claim_type: error_triggerable
        grounds: [errors.ERR_SILO_SPOUT_CAPACITY, errors.ERR_DRAW_RATE_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / loadout_windows_are_half_open_and_spout_capacity_is_an_aggregate_over_overlaps
          rationale: >
            That instance saturates both spouts to raise ERR_SILO_SPOUT_CAPACITY and then asks for one
            tonne more than the draw rate allows to raise ERR_DRAW_RATE_EXCEEDED.

      - name: err_invalid_order_state_is_reached_by_the_revocation_cascade
        claim_type: error_triggerable
        grounds: [errors.ERR_INVALID_ORDER_STATE]
        excluded_because:
          difficulty_instance: transitive_cascade / certificate_revocation_cascades_four_hops_to_the_customer_ledger
          rationale: >
            The cascade leaves orders in CANCELLED_BY_QUALITY, and that instance asserts that a
            later start-loading on such an order returns ERR_INVALID_ORDER_STATE — a terminal
            from-state a standalone test cannot reach as cheaply.

      - name: err_invalid_run_state_is_reached_by_the_quality_dimension_cycle
        claim_type: error_triggerable
        grounds: [errors.ERR_INVALID_RUN_STATE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / kiln_run_quality_dimension_cycles_while_process_dimension_stays_completed
          rationale: >
            The two-dimensional machine instance asserts ERR_INVALID_RUN_STATE for a release attempted
            while QUARANTINED and for a complete attempted on a COMPLETED run, covering both
            dimensions of the code.

      - name: err_permit_nox_intensity_exceeded_is_reached_by_the_dual_variant_release
        claim_type: error_triggerable
        grounds: [errors.ERR_PERMIT_NOX_INTENSITY_EXCEEDED]
        excluded_because:
          difficulty_instance: dual_variant_calc / per_run_nox_intensity_breaches_while_rolling_window_variant_permits_release
          rationale: >
            The code only fires when the ROLLING variant is above the cap, which needs the two-run
            fleet that instance builds; a single-run corner test would assert the wrong variant.

      - name: err_certified_tonnes_exceed_batch_is_reached_by_the_round_then_sum_ledger
        claim_type: error_triggerable
        grounds: [errors.ERR_CERTIFIED_TONNES_EXCEED_BATCH]
        excluded_because:
          difficulty_instance: combinatorial_formula / cement_tonnage_uses_round_then_sum_not_sum_then_round
          rationale: >
            The interesting trigger is the one-hundredth of a tonne that only exists under
            round-then-sum, and that instance certifies up to the exact cement_tonnes and then one
            hundredth beyond it.

      - name: err_insufficient_kiln_feed_is_reached_by_the_frozen_shc_tier
        claim_type: error_triggerable
        grounds: [errors.ERR_INSUFFICIENT_KILN_FEED]
        excluded_because:
          difficulty_instance: boundary_precision_check / shc_tier_is_selected_from_the_provisional_tonnage_and_never_re_selected
          rationale: >
            Reaching the code means charging enough energy that the tier-derived clinker outgrows the
            pile's dry tonnage, which is the boundary that instance already walks on both sides.

      - name: err_pile_lsf_off_target_is_reached_by_the_two_basis_divergence
        claim_type: error_triggerable
        grounds: [errors.ERR_PILE_LSF_OFF_TARGET]
        excluded_because:
          difficulty_instance: dual_variant_calc / raw_mix_modules_diverge_between_design_basis_and_pile_basis
          rationale: >
            The seal refusal is the payoff of the dual-basis instance: it asserts the accepted
            deviation at the tolerance and the refused one just past it with ERR_PILE_LSF_OFF_TARGET.

      - name: batch_create_rejects_a_gypsum_share_that_overshoots_the_so3_ceiling
        claim_type: error_triggerable
        grounds: [errors.ERR_SO3_LIMIT_EXCEEDED, validations.97, calculations.cement_batch_proportioning]
        distinguishing_aspect: >
          The SO3 ceiling is per cement type and it is checked against the COMPUTED so3_pct, which
          depends on the round-then-sum cement tonnage — so the refusal cannot be predicted from the
          gypsum share alone. TYPE_I caps SO3 at 3.00 while TYPE_III caps it at 4.50, so the identical
          recipe is refused for one type and accepted for another.
        test_recipe:
          setup: ["SC1 holds 583.78 t of released clinker at version ${sc1_v}."]
          setup_api_calls: *chain_run
          trigger:
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_I", clinker_tonnes_drawn: 500.00, gypsum_pct: 7.00, limestone_pct: 5.00, blaine_target_m2_per_kg: 380, expected_clinker_silo_version: "${sc1_v}" }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_I", clinker_tonnes_drawn: 500.00, gypsum_pct: 7.01, limestone_pct: 5.00, blaine_target_m2_per_kg: 380, expected_clinker_silo_version: "${sc1_v}" } }
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_I", clinker_tonnes_drawn: 500.00, gypsum_pct: 5.00, limestone_pct: 5.00, blaine_target_m2_per_kg: 380, expected_clinker_silo_version: "${sc1_v}" }, captures: { bx: "$.data.id" } }
          assert:
            - "the 7.00 % gypsum TYPE_I batch returns 422 ERR_SO3_LIMIT_EXCEEDED: total 568.18, gypsum 39.77, limestone 28.41, cement 568.18 and so3_pct 3.79 against the 3.00 ceiling"
            - "the 7.01 % attempt returns 400 ERR_INVALID_REQUEST instead — the gypsum band [2.00, 7.00] is an envelope check that precedes every computed gate"
            - "the 5.00 % gypsum TYPE_I batch is created with cement_tonnes 555.56 and so3_pct 2.87, under the same 3.00 ceiling"
            - "SC1's reserved_tonnes moves only for the accepted batch (500.00) and its version bumps exactly once across the three calls"
            - "the identical 7.00 % recipe declared as TYPE_III is refused for a different reason — blaine 380 is outside the 500-600 band — so the SO3 ceiling must be probed with a Blaine target inside the type's own band"

  # ===========================================================================
  # Section 7 — rbac. Eight roles: for each one, its exclusive operations
  # succeed and every other role is refused with 403 ERR_UNAUTHORIZED; shared
  # operations admit exactly their declared owners. The certificate-issue leg of
  # segregation of duties is already covered by the validations instance
  # segregation_priority_55_beats_certificate_state_priority_60, so only the
  # design-approval and burn-test-adjudication legs are re-walked here.
  - section: rbac
    instances:

      - name: plant_admin_master_data_is_exclusive_and_other_roles_are_forbidden
        claim_type: role_capability
        grounds: [rbac.PlantAdmin, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          PlantAdmin is the only writer of plants, kilns and silos, and the only role that can flip a
          silo's status. Roles that are heavy READERS of silos (ProcessEngineer, KilnOperator) must
          still be refused the PATCH, so read access cannot be reused as write access.
        test_recipe:
          setup: ["The reference layer exists: plant, materials, fuels, customer, kiln K1, silos SC1 and SM1."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "PATCH /cement-ops/silos/${sc1}", as: PlantAdmin, payload: { status: "BLOCKED", block_reason: "SILO_INSPECTION" } }
            - { call: "POST /cement-ops/plants", as: ProcessEngineer, payload: { name: "Rogue Plant", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/kilns", as: KilnOperator, payload: { plant_id: "${plant}", code: "K9", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 } }
            - { call: "POST /cement-ops/silos", as: QualityManager, payload: { plant_id: "${plant}", code: "SC9", material_kind: "CLINKER", capacity_tonnes: 1000.00, draw_rate_tonnes_per_hour: 100.00 } }
            - { call: "PATCH /cement-ops/silos/${sc1}", as: ProcessEngineer, payload: { status: "OPEN" } }
            - { call: "PATCH /cement-ops/silos/${sc1}", as: LogisticsPlanner, payload: { status: "OPEN" } }
          assert:
            - "the PlantAdmin PATCH returns 200 with status BLOCKED and block_reason SILO_INSPECTION"
            - "the four writes by ProcessEngineer, KilnOperator, QualityManager and LogisticsPlanner all return 403 ERR_UNAUTHORIZED"
            - "the silo is still BLOCKED after both refused PATCH calls, and its version bumped exactly once"
            - "the same roles CAN read the silo: GET /cement-ops/silos/${sc1} returns 200 for every internal role"
            - "no Plant, Kiln or Silo row was created by the refusals: GET /cement-ops/silos returns total_count 2"

      - name: process_engineer_design_and_pile_writes_are_forbidden_to_other_roles
        claim_type: role_capability
        grounds: [rbac.ProcessEngineer, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          Design authoring and pile blending are ProcessEngineer-exclusive, while APPROVING a design is
          QualityManager-exclusive — the two halves of the design lifecycle live in different roles, so
          an implementation that grants the author role the whole lifecycle passes the happy path and
          fails here.
        test_recipe:
          setup: ["Design D2 is APPROVED and pile PA has its limestone and clay additions."]
          setup_api_calls: *chain_design
          trigger:
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D3", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d3: "$.data.id" } }
            - { call: "PATCH /cement-ops/raw-mix-designs/${d3}", as: ProcessEngineer, payload: { target_lsf: 96.50 } }
            - { call: "POST /cement-ops/raw-mix-designs/${d3}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs", as: KilnOperator, payload: { plant_id: "${plant}", code: "D9", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { err: "$.data.error_id" } }
            - { call: "PATCH /cement-ops/raw-mix-designs/${d3}", as: QualityManager, payload: { target_lsf: 90.00 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: LogisticsPlanner, payload: { raw_material_id: "${ir}", tonnes_as_received: 10.00, moisture_pct: 5.0 } }
            - { call: "POST /cement-ops/blended-piles", as: EnvironmentalOfficer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PZ", expected_raw_mix_design_version: "${d2_v}" } }
          assert:
            - "the four ProcessEngineer calls succeed: D3 is created DRAFT, patched, submitted, and PA is sealed"
            - "the KilnOperator design create, the QualityManager PATCH, the LogisticsPlanner addition and the EnvironmentalOfficer pile create all return 403 ERR_UNAUTHORIZED"
            - "D3 stays SUBMITTED with target_lsf 96.50 — the refused QualityManager PATCH changed nothing"
            - "PA stays SEALED with two additions and its dry_tonnes still exactly 1000.00"
            - "QualityManager retains its own half of the lifecycle: POST /cement-ops/raw-mix-designs/${d3}/approve returns 200"

      - name: kiln_operator_firing_actions_are_forbidden_to_other_roles
        claim_type: role_capability
        grounds: [rbac.KilnOperator, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          Creating a run is SHARED with ProcessEngineer but every firing action is KilnOperator-only,
          so the same entity has a mixed authorisation profile. Release-clinker on the very same run is
          QualityManager-only, which splits the run's two state dimensions across two roles.
        test_recipe:
          setup: ["Run R0 is BURNING with 45.00 t of GAS-1 charged."]
          setup_api_calls: *chain_burning
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 5.00 } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/light", as: ProcessEngineer, payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: QualityManager, payload: { fuel_id: "${coal}", tonnes: 5.00 } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/complete", as: LogisticsPlanner, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r0}/abort", as: LabTechnician, payload: { abort_reason: "curiosity" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/release-clinker", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r0}/abort", as: KilnOperator, payload: { abort_reason: "REFRACTORY_ALARM" } }
          assert:
            - "the KilnOperator charge returns 201 and the run's gross_energy_gj becomes 2295.00"
            - "the ProcessEngineer light, QualityManager charge, LogisticsPlanner complete and LabTechnician abort all return 403 ERR_UNAUTHORIZED"
            - "the KilnOperator release-clinker returns 403 ERR_UNAUTHORIZED as well — the quality dimension belongs to QualityManager even though the process dimension does not"
            - "the KilnOperator abort returns 200 with process_state ABORTED, proving the refusals were about the role and not about the run's state"
            - "POST /cement-ops/kiln-runs itself is accepted from BOTH KilnOperator and ProcessEngineer, so the shared create and the exclusive actions are authorised separately"

      - name: lab_technician_measurement_writes_are_forbidden_to_other_roles
        claim_type: role_capability
        grounds: [rbac.LabTechnician, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          The burn-test lifecycle is deliberately split: EnvironmentalOfficer and LabTechnician share
          the create, LabTechnician alone starts and records, EnvironmentalOfficer alone adjudicates.
          An implementation that gives the whole lifecycle to either role fails half of these calls.
        test_recipe:
          setup: ["Batch B1 is GROUND and awaiting both lab branches; RDF-1 exists as an alternative fuel."]
          setup_api_calls: *chain_ground
          trigger:
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "BLAINE", value: 400, cement_batch_id: "${b1}" } }
            - { call: "POST /cement-ops/lab-tests", as: QualityManager, payload: { test_type: "COMPRESSIVE_STRENGTH_28D", value: 30.0, cement_batch_id: "${b1}" }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/burn-tests", as: EnvironmentalOfficer, payload: { plant_id: "${plant}", fuel_id: "${rdf}", requested_max_tsr_pct: 25.00, valid_days: 30 }, captures: { bt3: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt3}/start", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt3}/start", as: LabTechnician, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt3}/record-result", as: EnvironmentalOfficer, payload: { measured_chlorine_pct: 0.80, measured_nox_kg_per_gj: 0.22, stack_compliant: true } }
            - { call: "POST /cement-ops/burn-tests/${bt3}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.80, measured_nox_kg_per_gj: 0.22, stack_compliant: true } }
          assert:
            - "the LabTechnician BLAINE test returns 201 and flips the batch's fineness_branch_state to PASSED"
            - "the QualityManager lab test returns 403 ERR_UNAUTHORIZED, and the batch's strength_branch_state is still PENDING"
            - "the EnvironmentalOfficer burn-test create returns 201 (shared operation) but its record-result returns 403 ERR_UNAUTHORIZED"
            - "the ProcessEngineer start returns 403 ERR_UNAUTHORIZED while the LabTechnician start returns 200 with status IN_PROGRESS"
            - "the LabTechnician record-result returns 200 with status RESULT_RECORDED, and the burn test's version reflects exactly the two accepted transitions"

      - name: quality_manager_approval_and_certificate_writes_are_forbidden_to_other_roles
        claim_type: role_capability
        grounds: [rbac.QualityManager, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          QualityManager owns three unrelated verbs — design approval, clinker release and the
          certificate lifecycle — and no other role may perform any of them, including PlantAdmin.
          PlantAdmin being a superuser for master data must not make it a superuser for quality.
        test_recipe:
          setup: ["Batch B1 is GROUND; the two in-spec lab tests are recorded in the trigger so the batch qualifies."]
          setup_api_calls: *chain_ground
          trigger:
            - *c_lab_blaine_ok
            - *c_lab_str_ok
            - { call: "POST /cement-ops/mill-certificates", as: PlantAdmin, payload: { cement_batch_id: "${b1}", customer_id: "${cu1}", certified_tonnes: 100.00 }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu1}", certified_tonnes: 100.00 }, captures: { mc4: "$.data.id" } }
            - { call: "POST /cement-ops/mill-certificates/${mc4}/issue", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/mill-certificates/${mc4}/issue", as: QualityManager, payload: {} }
            - { call: "POST /cement-ops/mill-certificates/${mc4}/revoke", as: LogisticsPlanner, payload: { revoke_reason: "unauthorised attempt" } }
          assert:
            - "the PlantAdmin certificate create returns 403 ERR_UNAUTHORIZED — master-data ownership grants nothing here"
            - "the QualityManager create returns 201 DRAFT and the QualityManager issue returns 200 ISSUED"
            - "the ProcessEngineer issue and the LogisticsPlanner revoke both return 403 ERR_UNAUTHORIZED, and the certificate is still ISSUED with revoked_at null"
            - "the refusals leave the batch at status CERTIFIED with certified_tonnes_allocated 100.00 — exactly the effect of the one accepted issue"
            - "release-clinker on ${r0} by any role other than QualityManager returns 403 ERR_UNAUTHORIZED, and approve on a SUBMITTED design likewise"

      - name: environmental_officer_adjudication_is_forbidden_to_other_roles
        claim_type: role_capability
        grounds: [rbac.EnvironmentalOfficer, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          Adjudicating a trial burn is the EnvironmentalOfficer's single exclusive operation, and it is
          the permit gate for every alternative fuel. Fuel registration is shared with PlantAdmin,
          which is the only overlap.
        test_recipe:
          setup: ["The reference layer exists; TDF-1 is an alternative fuel."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/fuels", as: PlantAdmin, payload: { code: "PET-1", category: "PETCOKE", lhv_gj_per_tonne: 32.00, nox_kg_per_gj: 0.30, co2_kg_per_gj: 100.0, chlorine_pct: 0.01 } }
            - { call: "POST /cement-ops/burn-tests", as: LabTechnician, payload: { plant_id: "${plant}", fuel_id: "${tdf}", requested_max_tsr_pct: 10.00, valid_days: 30 }, captures: { bt4: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt4}/start", as: LabTechnician, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt4}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.10, measured_nox_kg_per_gj: 0.18, stack_compliant: true } }
            - { call: "POST /cement-ops/burn-tests/${bt4}/adjudicate", as: LabTechnician, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 10.00 }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/burn-tests/${bt4}/adjudicate", as: QualityManager, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 10.00 } }
            - { call: "POST /cement-ops/burn-tests/${bt4}/adjudicate", as: EnvironmentalOfficer, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 10.00 } }
          assert:
            - "the PlantAdmin fuel create returns 201 — fuels are shared with EnvironmentalOfficer"
            - "the LabTechnician burn-test create, start and record-result all succeed (create is shared, the other two are its own)"
            - "the LabTechnician and QualityManager adjudications both return 403 ERR_UNAUTHORIZED and the burn test stays RESULT_RECORDED"
            - "the EnvironmentalOfficer adjudication returns 200 with status AUTHORIZED and authorized_max_tsr_pct 10.00"
            - "a ProcessEngineer fuel create returns 403 ERR_UNAUTHORIZED — the fuel share is PlantAdmin plus EnvironmentalOfficer only"

      - name: logistics_planner_loadout_writes_are_forbidden_to_other_roles
        claim_type: role_capability
        grounds: [rbac.LogisticsPlanner, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          The whole loadout lifecycle plus customer master data belongs to LogisticsPlanner (customers
          shared with PlantAdmin), and the distribution plan is readable by exactly those two roles.
          Nobody else may create, start, complete or void an order.
        test_recipe:
          setup: ["Certificate MC1 is ISSUED for CU1 with 574.72 t certified and SM1 holds the qualified cement."]
          setup_api_calls: *chain_cert
          trigger:
            - *c_lo1
            - { call: "POST /cement-ops/loadout-orders", as: PlantAdmin, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-06T06:00:00Z", window_end: "2026-08-06T08:00:00Z", tonnes: 50.00, expected_mill_certificate_version: "${mc1_v}" }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/loadout-orders/${lo1}/start-loading", as: QualityManager, payload: {} }
            - { call: "POST /cement-ops/loadout-orders/${lo1}/complete", as: ProcessEngineer, payload: { loaded_tonnes: 120.00 } }
            - { call: "POST /cement-ops/loadout-orders/${lo1}/void", as: KilnOperator, payload: { void_reason: "unauthorised attempt" } }
            - { call: "POST /cement-ops/loadout-orders/${lo1}/void", as: LogisticsPlanner, payload: { void_reason: "CUSTOMER_CANCELLED" } }
          assert:
            - "the LogisticsPlanner order create returns 201 RESERVED for 120.00 t"
            - "the PlantAdmin create, QualityManager start-loading, ProcessEngineer complete and KilnOperator void all return 403 ERR_UNAUTHORIZED"
            - "the order is still RESERVED after those four refusals, with loading_started_at null and SM1 reserved_tonnes 120.00"
            - "the LogisticsPlanner void returns 200 with status VOIDED and SM1 reserved_tonnes back to 0.00"
            - "customers stay shared: POST /cement-ops/customers and PATCH /cement-ops/customers/{id} are accepted from PlantAdmin as well, but refused for KilnOperator with 403 ERR_UNAUTHORIZED"

      - name: customer_role_cannot_write_and_cannot_read_another_customers_rows
        claim_type: row_scoping
        grounds: [rbac.Customer, errors.ERR_CUSTOMER_SCOPE_VIOLATION, errors.ERR_UNAUTHORIZED, validations.45]
        distinguishing_aspect: >
          The Customer role is entity-backed: X-User-ID IS a Customer.id, so authorisation is per ROW.
          Single reads of a foreign row are 403 ERR_CUSTOMER_SCOPE_VIOLATION while LIST reads are
          silently filtered to the caller's own rows — two different behaviours for the same scope
          rule. Endpoints the role does not appear on answer the different code ERR_UNAUTHORIZED.
        test_recipe:
          setup: ["Certificate MC1 belongs to CU1 and order LO1 is CU1's; a second customer CU6 owns nothing."]
          setup_api_calls: *chain_order
          trigger:
            - { call: "POST /cement-ops/customers", as: LogisticsPlanner, payload: { name: "Bystander Buyer", region_code: "US-MW", contract_priority: 50, contract_monthly_tonnes: 500.00, required_cement_type: "TYPE_IL", max_so3_pct: 3.00 }, captures: { cu6: "$.data.id" } }
            - { call: "GET /cement-ops/mill-certificates/${mc1}", as: Customer, as_user_id: "${cu1}", payload: {} }
            - { call: "GET /cement-ops/mill-certificates/${mc1}", as: Customer, as_user_id: "${cu6}", payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "GET /cement-ops/loadout-orders", as: Customer, as_user_id: "${cu6}", payload: { limit: 50, offset: 0 } }
            - { call: "GET /cement-ops/loadout-orders", as: Customer, as_user_id: "${cu1}", payload: { limit: 50, offset: 0 } }
            - { call: "GET /cement-ops/loadout-orders/${lo1}", as: Customer, as_user_id: "${cu6}", payload: {} }
            - { call: "POST /cement-ops/loadout-orders", as: Customer, as_user_id: "${cu1}", payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-07T06:00:00Z", window_end: "2026-08-07T08:00:00Z", tonnes: 10.00, expected_mill_certificate_version: "${mc1_v}" } }
            - { call: "GET /cement-ops/plants/${plant}", as: Customer, as_user_id: "${cu1}", payload: {} }
          assert:
            - "CU1 reading its own certificate returns 200 with customer_id ${cu1}"
            - "CU6 reading CU1's certificate returns 403 ERR_CUSTOMER_SCOPE_VIOLATION, and reading CU1's order returns the same code"
            - "CU6's order list returns 200 with total_count 0 and an empty items array — list reads are filtered, never refused"
            - "CU1's order list returns 200 with total_count 1 and item id ${lo1}"
            - "the Customer order create returns 403 ERR_UNAUTHORIZED (the role is not on that endpoint at all), which is a different code from the scope violation"
            - "GET /cement-ops/plants/${plant} as Customer returns 403 ERR_UNAUTHORIZED — 'every GET in the API' is a privilege of the seven internal roles only"

      - name: design_author_cannot_approve_its_own_design
        claim_type: segregation_of_duties
        grounds: [rbac.QualityManager, errors.ERR_SEGREGATION_OF_DUTIES, state_machines.RawMixDesign.transitions]
        distinguishing_aspect: >
          The control compares X-User-ID against created_by_user_id, NOT the role header — so a caller
          who authored the design as ProcessEngineer and returns wearing the QualityManager role is
          still refused. An implementation that only checks the role lets one person walk the whole
          design lifecycle.
        test_recipe:
          setup: ["The reference layer exists. Design D5 is authored and submitted by the user 'user-pe-1'."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, as_user_id: "user-pe-1", payload: { plant_id: "${plant}", code: "D5", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d5: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d5}/submit", as: ProcessEngineer, as_user_id: "user-pe-1", payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d5}/approve", as: QualityManager, as_user_id: "user-pe-1", payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d5}/approve", as: QualityManager, as_user_id: "user-qm-1", payload: {} }
          assert:
            - "the self-approval returns 403 ERR_SEGREGATION_OF_DUTIES and the design stays SUBMITTED with approved_by_user_id null"
            - "the refusal is 403 ERR_SEGREGATION_OF_DUTIES, not 403 ERR_UNAUTHORIZED — the role IS permitted on the endpoint"
            - "the approval by user-qm-1 returns 200 with status APPROVED and approved_by_user_id user-qm-1"
            - "created_by_user_id stays user-pe-1 throughout, and the design's version bumps only for the submit and the accepted approve"
            - "request-revision by user-pe-1 wearing QualityManager is refused the same way, so the whole QualityManager verb set on this row is closed to the author"

      - name: burn_test_recorder_cannot_adjudicate_its_own_result
        claim_type: segregation_of_duties
        grounds: [rbac.EnvironmentalOfficer, errors.ERR_SEGREGATION_OF_DUTIES, state_machines.BurnTest.transitions]
        distinguishing_aspect: >
          The bar is on the RESULT RECORDER, not on the requester — the same user may create the burn
          test and adjudicate it, but may not both record the measurement and adjudicate it. So the
          check must read result_recorded_by_user_id, not created_by_user_id.
        test_recipe:
          setup: ["The reference layer exists. Burn test BT5 for TDF-1 is requested by user-eo-1 and its result is recorded by user-lab-7."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/burn-tests", as: EnvironmentalOfficer, as_user_id: "user-eo-1", payload: { plant_id: "${plant}", fuel_id: "${tdf}", requested_max_tsr_pct: 10.00, valid_days: 30 }, captures: { bt5: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt5}/start", as: LabTechnician, as_user_id: "user-lab-7", payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt5}/record-result", as: LabTechnician, as_user_id: "user-lab-7", payload: { measured_chlorine_pct: 0.10, measured_nox_kg_per_gj: 0.18, stack_compliant: true } }
            - { call: "POST /cement-ops/burn-tests/${bt5}/adjudicate", as: EnvironmentalOfficer, as_user_id: "user-lab-7", payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 10.00 }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/burn-tests/${bt5}/adjudicate", as: EnvironmentalOfficer, as_user_id: "user-eo-1", payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 10.00 } }
          assert:
            - "the adjudication by user-lab-7 returns 403 ERR_SEGREGATION_OF_DUTIES and the burn test stays RESULT_RECORDED with valid_from and valid_until null"
            - "the adjudication by user-eo-1 — the same user who REQUESTED the test — returns 200 with status AUTHORIZED, proving the bar is on the recorder alone"
            - "result_recorded_by_user_id reads user-lab-7 and adjudicated_by_user_id reads user-eo-1"
            - "a REJECTED decision by user-lab-7 is refused identically, so the control is on the action rather than on the outcome"
            - "the refused call leaves no authorization window, so a later RDF-1 or TDF-1 charge would still see no AUTHORIZED row until the second adjudication lands"

      - name: shared_operations_admit_both_owners_and_refuse_everyone_else_unauthorized
        claim_type: role_capability
        grounds: [rbac, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          Five endpoints have exactly two authorised roles each, and the pairs are all different
          (raw-materials = PlantAdmin + ProcessEngineer, fuels = PlantAdmin + EnvironmentalOfficer,
          burn-tests = EnvironmentalOfficer + LabTechnician, kiln-outages = PlantAdmin +
          ProcessEngineer, distribution-plan = PlantAdmin + LogisticsPlanner). An implementation that
          collapses these into one "staff" role passes every positive call and no negative one.
        test_recipe:
          setup: ["The reference layer exists and the clock reads 2026-08-01T00:00:00Z."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/raw-materials", as: PlantAdmin, payload: { code: "LS-2", category: "LIMESTONE", cao_pct: 51.0, sio2_pct: 4.0, al2o3_pct: 1.2, fe2o3_pct: 0.6, so3_pct: 0.05, moisture_pct: 3.0, cost_per_tonne: 9.00 } }
            - { call: "POST /cement-ops/raw-materials", as: LabTechnician, payload: { code: "LS-3", category: "LIMESTONE", cao_pct: 51.0, sio2_pct: 4.0, al2o3_pct: 1.2, fe2o3_pct: 0.6, so3_pct: 0.05, moisture_pct: 3.0, cost_per_tonne: 9.00 }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/fuels", as: ProcessEngineer, payload: { code: "COAL-2", category: "COAL", lhv_gj_per_tonne: 26.00, nox_kg_per_gj: 0.34, co2_kg_per_gj: 95.0, chlorine_pct: 0.02 } }
            - { call: "POST /cement-ops/burn-tests", as: KilnOperator, payload: { plant_id: "${plant}", fuel_id: "${rdf}", requested_max_tsr_pct: 25.00, valid_days: 30 } }
            - { call: "POST /cement-ops/kiln-outages", as: PlantAdmin, payload: { kiln_id: "${k1}", window_start: "2026-10-05T00:00:00Z", window_end: "2026-10-06T00:00:00Z", scope: "BURNER" } }
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-10-08T00:00:00Z", window_end: "2026-10-09T00:00:00Z", scope: "COOLER" } }
            - { call: "POST /cement-ops/kiln-outages", as: QualityManager, payload: { kiln_id: "${k1}", window_start: "2026-10-11T00:00:00Z", window_end: "2026-10-12T00:00:00Z", scope: "COOLER" } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LabTechnician, payload: { as_of_month: 8 } }
          assert:
            - "the PlantAdmin raw-material create returns 201 while the LabTechnician one returns 403 ERR_UNAUTHORIZED"
            - "the ProcessEngineer fuel create returns 403 ERR_UNAUTHORIZED — fuels are shared with EnvironmentalOfficer, not with ProcessEngineer"
            - "the KilnOperator burn-test create returns 403 ERR_UNAUTHORIZED"
            - "both October outages are created PLANNED (one by PlantAdmin, one by ProcessEngineer) while the QualityManager attempt returns 403 ERR_UNAUTHORIZED"
            - "the LabTechnician distribution-plan read returns 403 ERR_UNAUTHORIZED even though every other GET in the API is open to that role"
            - "each refusal leaves no row behind: GET /cement-ops/kiln-outages returns total_count 2 and GET /cement-ops/fuels returns total_count 4"

      - name: every_get_is_open_to_all_seven_internal_roles
        claim_type: role_capability
        grounds: [rbac, endpoints]
        distinguishing_aspect: >
          Read access is deliberately universal for the seven internal roles, so a role restriction on
          any GET is a defect. This is the positive complement of the denial claims: an implementation
          that mirrors the write matrix onto reads breaks the KilnOperator's ability to see designs and
          the LabTechnician's ability to see silos.
        test_recipe:
          setup: ["Run R0 is COMPLETED and RELEASED, so every collection is populated."]
          setup_api_calls: *chain_run
          trigger:
            - { call: "GET /cement-ops/raw-mix-designs/${d2}", as: KilnOperator, payload: {} }
            - { call: "GET /cement-ops/silos/${sc1}", as: LabTechnician, payload: {} }
            - { call: "GET /cement-ops/kiln-runs/${r0}", as: LogisticsPlanner, payload: {} }
            - { call: "GET /cement-ops/blended-piles/${pa}", as: EnvironmentalOfficer, payload: {} }
            - { call: "GET /cement-ops/plants/${plant}", as: QualityManager, payload: {} }
            - { call: "GET /cement-ops/kilns", as: ProcessEngineer, payload: { plant_id: "${plant}", limit: 50, offset: 0 } }
            - { call: "GET /cement-ops/lab-tests", as: PlantAdmin, payload: { kiln_run_id: "${r0}" } }
          assert:
            - "all seven reads return 200 — one per internal role, each on a resource the role can never write"
            - "the KilnOperator design read exposes the full computed module block (as_designed_lsf 96.98 and friends), not a redacted projection"
            - "the LogisticsPlanner run read exposes clinker_tonnes 583.78 and nox_emitted_kg 216.00"
            - "the PlantAdmin lab-test list returns total_count 1 with the free-lime row"
            - "no GET mutates anything: every entity's version is unchanged after the seven reads"

      - name: only_a_plant_admin_can_set_the_peak_season_override
        claim_type: role_capability
        grounds: [rbac.PlantAdmin, validations.108, errors.ERR_PEAK_SEASON_OUTAGE]
        distinguishing_aspect: >
          The override is a role-conditioned PAYLOAD privilege, not an endpoint privilege: both
          PlantAdmin and ProcessEngineer may create outages, so a ProcessEngineer sending
          peak_season_override true must be refused with 422 ERR_PEAK_SEASON_OUTAGE — not 403
          ERR_UNAUTHORIZED, and not silently accepted with the flag dropped.
        test_recipe:
          setup: ["Plant peak_season_months are [5,6,7,8,9]; kiln K1 has no runs or outages yet."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-08-15T00:00:00Z", window_end: "2026-08-17T00:00:00Z", scope: "REFRACTORY", peak_season_override: true }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/kiln-outages", as: PlantAdmin, payload: { kiln_id: "${k1}", window_start: "2026-08-15T00:00:00Z", window_end: "2026-08-17T00:00:00Z", scope: "REFRACTORY" } }
            - { call: "POST /cement-ops/kiln-outages", as: PlantAdmin, payload: { kiln_id: "${k1}", window_start: "2026-08-15T00:00:00Z", window_end: "2026-08-17T00:00:00Z", scope: "REFRACTORY", peak_season_override: true }, captures: { kop: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-outages", as: ProcessEngineer, payload: { kiln_id: "${k1}", window_start: "2026-10-20T00:00:00Z", window_end: "2026-10-22T00:00:00Z", scope: "COOLER" } }
          assert:
            - "the ProcessEngineer override attempt returns 422 ERR_PEAK_SEASON_OUTAGE, not 403 ERR_UNAUTHORIZED — the endpoint admits the role, the payload privilege does not"
            - "the PlantAdmin attempt WITHOUT the flag also returns 422 ERR_PEAK_SEASON_OUTAGE — the override defaults to false and both legs of rule 108 must hold"
            - "the PlantAdmin attempt WITH the flag returns 201 with demand_season_class PEAK and peak_season_override true"
            - "the ProcessEngineer October outage returns 201 with demand_season_class SHOULDER and peak_season_override false — the gate only bites on peak months"
            - "GET /cement-ops/kiln-outages returns total_count 2, so neither refusal left a row"

  # ===========================================================================
  # Section 8 — the four declared cross-cutting complexity layers of §1.0:
  # optimistic_concurrency (one claim per §1.2.1 rule), cascading_side_effects,
  # dual_variant_calculation and rate_threshold_triggers.
  - section: cross-cutting complexity layers
    instances:

      - name: pile_create_refuses_a_stale_design_version
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.pile-create-stale-design, errors.ERR_STALE_DESIGN_VERSION]
        distinguishing_aspect: >
          The guard is self-invalidating: a successful pile creation recomputes the design's
          active_pile_count and therefore bumps RawMixDesign.version, so the SECOND pile built from the
          same read version must be refused with 412 even though nothing else touched the design. An
          implementation that only bumps the version on PATCH lets the second write through.
        test_recipe:
          setup: ["Design D6 is authored, submitted and approved; the approve response carries the version the caller reads."]
          setup_api_calls: *chain_ref
          trigger:
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D6", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d6: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d6}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d6}/approve", as: QualityManager, payload: {}, captures: { d6_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d6}", pile_code: "P1", expected_raw_mix_design_version: "${d6_v}" }, captures: { p1: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d6}", pile_code: "P2", expected_raw_mix_design_version: "${d6_v}" }, captures: { err: "$.data.error_id" } }
            - { call: "GET /cement-ops/raw-mix-designs/${d6}", as: ProcessEngineer, payload: {}, captures: { d6_v2: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d6}", pile_code: "P2", expected_raw_mix_design_version: "${d6_v2}" }, captures: { p2: "$.data.id" } }
          assert:
            - "P1 is created 201 with status BLENDING and the design's active_pile_count becomes 1 with its version incremented past ${d6_v}"
            - "the P2 attempt carrying the stale ${d6_v} returns 412 ERR_STALE_DESIGN_VERSION"
            - "the refusal creates no pile and leaves active_pile_count at 1: GET /cement-ops/blended-piles?raw_mix_design_id=${d6} returns total_count 1"
            - "after re-reading the version, the identical P2 payload succeeds and active_pile_count becomes 2"
            - "omitting expected_raw_mix_design_version entirely returns 400 ERR_INVALID_REQUEST — the field is required, so the OCC guard cannot be skipped"
            - "a version far in the future (${d6_v} + 100) also returns 412 ERR_STALE_DESIGN_VERSION: the rule is equality, not 'at least'"

      - name: batch_create_refuses_a_stale_clinker_silo_version
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.batch-create-stale-clinker-silo, errors.ERR_STALE_SILO_VERSION]
        distinguishing_aspect: >
          The silo's version moves on reservations, draws, credits, withdrawals AND status changes, so a
          caller who read the balance before its own first batch is stale for the second. The guard also
          precedes every capacity rule, so a stale version wins over an insufficient balance.
        test_recipe:
          setup: ["SC1 holds 583.78 t of released clinker; the caller read Silo.version as ${sc1_v} before creating any batch."]
          setup_api_calls: *chain_run
          trigger:
            - *c_b1
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_IL", clinker_tonnes_drawn: 50.00, gypsum_pct: 5.00, limestone_pct: 8.00, blaine_target_m2_per_kg: 400, expected_clinker_silo_version: "${sc1_v}" }, captures: { err: "$.data.error_id" } }
            - { call: "GET /cement-ops/silos/${sc1}", as: ProcessEngineer, payload: {}, captures: { sc1_v2: "$.data.version" } }
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_IL", clinker_tonnes_drawn: 50.00, gypsum_pct: 5.00, limestone_pct: 8.00, blaine_target_m2_per_kg: 400, expected_clinker_silo_version: "${sc1_v2}" }, captures: { b5: "$.data.id" } }
            - { call: "POST /cement-ops/cement-batches", as: ProcessEngineer, payload: { plant_id: "${plant}", clinker_silo_id: "${sc1}", cement_silo_id: "${sm1}", cement_type: "TYPE_IL", clinker_tonnes_drawn: 900.00, gypsum_pct: 5.00, limestone_pct: 8.00, blaine_target_m2_per_kg: 400, expected_clinker_silo_version: "${sc1_v}" } }
          assert:
            - "B1 reserves 500.00 t and bumps SC1's version past ${sc1_v}, leaving available_tonnes 83.78"
            - "the 50.00 t batch carrying the stale ${sc1_v} returns 412 ERR_STALE_SILO_VERSION even though 50.00 t IS available"
            - "after re-reading, the same 50.00 t batch is created and SC1 reads reserved_tonnes 550.00, available_tonnes 33.78"
            - "the 900.00 t batch carrying the stale version returns 412 ERR_STALE_SILO_VERSION, NOT 422 ERR_INSUFFICIENT_CLINKER — rule 50 precedes rule 103"
            - "SC1's version increments exactly twice across the five calls, once per accepted batch"

      - name: loadout_order_create_refuses_a_stale_certificate_version
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.loadout-create-stale-certificate, errors.ERR_STALE_CERTIFICATE_VERSION]
        distinguishing_aspect: >
          Consuming allocated_tonnes bumps MillCertificate.version, so the second order built from the
          version returned by issue is stale. The guard also precedes the allocation ceiling, which is
          what stops two orders from both believing the full certified tonnage is free.
        test_recipe:
          setup: ["MC1 is ISSUED for 574.72 t to CU1; ${mc1_v} is the version the issue call returned."]
          setup_api_calls: *chain_cert
          trigger:
            - *c_lo1
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-06T06:00:00Z", window_end: "2026-08-06T08:00:00Z", tonnes: 100.00, expected_mill_certificate_version: "${mc1_v}" }, captures: { err: "$.data.error_id" } }
            - { call: "GET /cement-ops/mill-certificates/${mc1}", as: LogisticsPlanner, payload: {}, captures: { mc1_v2: "$.data.version" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-06T06:00:00Z", window_end: "2026-08-06T08:00:00Z", tonnes: 100.00, expected_mill_certificate_version: "${mc1_v2}" }, captures: { lo2: "$.data.id" } }
          assert:
            - "LO1 reserves 120.00 t, drives the certificate's allocated_tonnes to 120.00 and bumps its version past ${mc1_v}"
            - "the second order carrying the stale ${mc1_v} returns 412 ERR_STALE_CERTIFICATE_VERSION and leaves allocated_tonnes at 120.00"
            - "after re-reading, the same order is created RESERVED and allocated_tonnes becomes 220.00 with SM1 reserved_tonnes 220.00"
            - "a revoke of the certificate would bump the version too, so an order built on a pre-revocation read is refused with the same 412 rather than being accepted against a dead certificate"
            - "the 412 body carries error_id and message and no partial order payload"

      - name: finish_grinding_credits_the_cement_silo_within_the_same_request
        claim_type: cascading_side_effects
        grounds: [state_machines.CementBatch.transitions, entities.Silo.unreleased_tonnes, entities.Plant.cement_tonne_balance_tonnes]
        distinguishing_aspect: >
          One batch walk moves two silos and one plant aggregate across three requests, and each hop is
          a different kind of move: start-grinding converts a RESERVATION into a physical draw on the
          clinker silo, finish-grinding credits the cement silo as UNRELEASED, and qualification is what
          finally makes that cement sellable. An implementation that credits cement as available at
          finish-grinding lets uncertified cement be loaded out.
        test_recipe:
          setup: ["SC1 holds 583.78 t of released clinker (available 583.78) and SM1 is empty."]
          setup_api_calls: *chain_run
          trigger:
            - *c_b1
            - { call: "GET /cement-ops/silos/${sc1}", as: ProcessEngineer, payload: {} }
            - *c_b1_grind
            - { call: "GET /cement-ops/silos/${sc1}", as: ProcessEngineer, payload: {} }
            - *c_b1_ground
            - { call: "GET /cement-ops/silos/${sm1}", as: ProcessEngineer, payload: {} }
            - *c_lab_blaine_ok
            - *c_lab_str_ok
            - { call: "GET /cement-ops/silos/${sm1}", as: ProcessEngineer, payload: {} }
            - { call: "GET /cement-ops/plants/${plant}", as: PlantAdmin, payload: {} }
          assert:
            - "after the batch create SC1 reads tonnes_on_hand 583.78, reserved_tonnes 500.00, unreleased_tonnes 0.00, available_tonnes 83.78"
            - "after start-grinding SC1 reads tonnes_on_hand 83.78, reserved_tonnes 0.00 and available_tonnes 83.78 — the reservation became a physical draw in the same request"
            - "after finish-grinding SM1 reads tonnes_on_hand 574.72, unreleased_tonnes 574.72 and available_tonnes 0.00, and the batch is GROUND with both branches PENDING"
            - "after the two in-spec lab tests the batch is QUALIFIED and SM1 reads unreleased_tonnes 0.00 with available_tonnes 574.72 — the third hop is what unlocks the cement"
            - "the plant read shows cement_tonne_balance_tonnes 574.72, and every hop was visible in the response of the call that caused it"
            - "a REJECTED batch would leave SM1's 574.72 t in unreleased_tonnes forever, so the unlock is genuinely conditional on the verdict"

      - name: both_nox_intensity_variants_are_exposed_side_by_side
        claim_type: dual_variant_calculation
        grounds: [calculations.nox_emission_intensity, entities.KilnRun.nox_intensity_kg_per_tonne, entities.Plant.rolling_nox_intensity_kg_per_tonne]
        distinguishing_aspect: >
          The two variants live on two different rows at two different precisions and are never allowed
          to overwrite each other: the run keeps its own per_run_actual figure plus a breach flag, while
          the plant keeps the rolling-window figure that gates the release. With a single completed run
          the two coincide, which is exactly the case where a one-variant implementation looks correct.
        test_recipe:
          setup: ["Run R0 is COMPLETED and RELEASED: 45.00 t of GAS-1, nox_emitted_kg 216.00 and clinker_tonnes 583.78."]
          setup_api_calls: *chain_run
          trigger:
            - { call: "GET /cement-ops/kiln-runs/${r0}", as: EnvironmentalOfficer, payload: {} }
            - { call: "GET /cement-ops/plants/${plant}", as: EnvironmentalOfficer, payload: {} }
          assert:
            - "the run reads nox_intensity_kg_per_tonne 0.370 at three decimals (216.00 / 583.78 = 0.36999...) with nox_intensity_breach false"
            - "the plant reads rolling_nox_intensity_kg_per_tonne 0.370 — with one completed run the rolling variant equals the per-run variant"
            - "the plant also reads permit_nox_budget_remaining_kg 1999784.00, which is a MASS ledger and must not be confused with either intensity"
            - "both fields are present on their own rows in one read: the run does not expose a rolling figure and the plant does not expose a per-run figure"
            - "the release succeeded because 0.370 is under the 1.20 cap, and the cap is documented as applying to the ROLLING variant only"

      - name: the_draw_rate_ceiling_scales_with_the_window_length_and_admits_equality
        claim_type: rate_threshold_triggers
        grounds: [validations.107, errors.ERR_DRAW_RATE_EXCEEDED, entities.Silo.draw_rate_tonnes_per_hour]
        distinguishing_aspect: >
          The threshold is a rate times a duration, so the SAME tonnage is legal in a two-hour window
          and illegal in a one-hour one, and equality is allowed. It also sits behind the availability
          rule, so a request that breaks both answers ERR_INSUFFICIENT_CEMENT.
        test_recipe:
          setup: ["SM1 has 574.72 t available at draw_rate_tonnes_per_hour 250.00 with 2 spouts; MC1 certifies 574.72 t to CU1."]
          setup_api_calls: *chain_cert
          trigger:
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 500.01, expected_mill_certificate_version: "${mc1_v}" }, captures: { err: "$.data.error_id" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-06T06:00:00Z", window_end: "2026-08-06T07:00:00Z", tonnes: 300.00, expected_mill_certificate_version: "${mc1_v}" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-06T06:00:00Z", window_end: "2026-08-06T07:00:00Z", tonnes: 250.00, expected_mill_certificate_version: "${mc1_v}" }, captures: { lo3: "$.data.id" } }
            - { call: "GET /cement-ops/mill-certificates/${mc1}", as: LogisticsPlanner, payload: {}, captures: { mc1_v3: "$.data.version" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 600.00, expected_mill_certificate_version: "${mc1_v3}" } }
          assert:
            - "500.01 t across a 2-hour window returns 422 ERR_DRAW_RATE_EXCEEDED: the ceiling is round(250.00 * 2, 2) = 500.00"
            - "300.00 t across a 1-hour window returns 422 ERR_DRAW_RATE_EXCEEDED, because the same rate now yields a 250.00 ceiling — the tonnage alone decides nothing"
            - "250.00 t across that 1-hour window returns 201 RESERVED — equality is allowed"
            - "600.00 t across a 2-hour window then returns 422 ERR_INSUFFICIENT_CEMENT (only 324.72 t remain available), not ERR_DRAW_RATE_EXCEEDED: rule 104 precedes rule 107"
            - "a 90-minute window yields round(250.00 * 1.5, 2) = 375.00, so the ceiling is not rounded up to whole hours"

      # --- layer claims whose sharpest form is already a §1.8 depth instance ---

      - name: deep_cascade_depth_is_covered_by_the_revocation_ledger_walk
        claim_type: cascading_side_effects
        grounds: [complexity_profile.cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / certificate_revocation_cascades_four_hops_to_the_customer_ledger
          rationale: >
            The layer's hardest claim is depth greater than two with a cross-entity terminus; that
            instance walks certificate -> batch -> silo -> orders -> customer ledger in one request and
            asserts every hop, which no shallower corner test can strengthen.

      - name: withdrawal_direction_of_the_cascade_is_covered_by_the_requarantine_walk
        claim_type: cascading_side_effects
        grounds: [complexity_profile.cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / requarantine_withdrawal_cascades_three_hops_into_plant_production_posture
          rationale: >
            The reverse direction — a withdrawal that propagates into feed states and then into the
            plant's production posture — is asserted hop by hop there, including the posture flip that
            only a cascade can produce.

      - name: module_variant_divergence_is_covered_by_the_two_basis_instance
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / raw_mix_modules_diverge_between_design_basis_and_pile_basis
          rationale: >
            Variant SELECTION and divergence for the module family are the whole subject of that
            instance, which drives the two bases apart on purpose and asserts both figures plus the
            deviation derived from them.

      - name: intensity_variant_divergence_is_covered_by_the_two_run_fleet
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / per_run_nox_intensity_breaches_while_rolling_window_variant_permits_release
          rationale: >
            Making the rolling variant differ from the per-run variant needs a second completed run;
            that instance builds the fleet and asserts the aggregate 0.862 against the per-run 1.400,
            proving the two variants are computed independently.

      - name: the_shc_tier_step_function_is_covered_by_the_frozen_tier_instance
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.rate_threshold_triggers]
        excluded_because:
          difficulty_instance: boundary_precision_check / shc_tier_is_selected_from_the_provisional_tonnage_and_never_re_selected
          rationale: >
            The sharpest rate-threshold claim in the domain is the specific-heat tier, which is a step
            function of a PROVISIONAL quantity and must not be re-selected from the final one; that
            instance walks both sides of the tier boundary.

      - name: the_spout_aggregate_threshold_is_covered_by_the_overlap_instance
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.rate_threshold_triggers]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / loadout_windows_are_half_open_and_spout_capacity_is_an_aggregate_over_overlaps
          rationale: >
            The spout ceiling is a count-based threshold aggregated over overlapping half-open windows,
            which that instance saturates exactly and then exceeds by one order.

  # ===========================================================================
  # Section 9 — consistency model. §1.0 declares `immediate`: every change is
  # visible in the response of the request that caused it, with no polling,
  # no eventual settlement and no 202 handoff.
  - section: consistency model
    instances:

      - name: aggregates_and_plans_reflect_the_write_that_just_happened
        claim_type: immediate
        grounds: [consistency_model, calculations.distribution_plan_waterfall, entities.Plant.cement_tonne_balance_tonnes]
        distinguishing_aspect: >
          Derived read surfaces are the place where a lazily-refreshed implementation shows: the
          distribution plan and the plant's conserved cement balance must both change on the very next
          request after an order is reserved, and change back when it is voided. Nothing is
          recomputed on a schedule.
        test_recipe:
          setup: ["MC1 is ISSUED and SM1 holds 574.72 t of qualified, sellable cement; the clock reads 2026-08-01T12:00:00Z."]
          setup_api_calls: *chain_cert
          trigger:
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 8 } }
            - *c_lo1
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 8 } }
            - { call: "GET /cement-ops/plants/${plant}", as: PlantAdmin, payload: {} }
            - { call: "POST /cement-ops/loadout-orders/${lo1}/void", as: LogisticsPlanner, payload: { void_reason: "CUSTOMER_CANCELLED" } }
            - { call: "GET /cement-ops/plants/${plant}/distribution-plan", as: LogisticsPlanner, payload: { as_of_month: 8 } }
          assert:
            - "the first plan reads available_pool_tonnes 574.72 with CU1 allocated 574.72 and shortfall 4425.28 against its 5000.00 t seasonal demand"
            - "immediately after the 120.00 t order the plan reads available_pool_tonnes 454.72 — one request later, with no refresh step"
            - "the plant read in the same sequence shows cement_tonne_balance_tonnes 574.72: the reservation moved availability, not mass"
            - "after the void the plan reads available_pool_tonnes 574.72 again, exactly the pre-order figure"
            - "no endpoint in the sequence returned 202 and no field was stale at any point"

      - name: every_write_returns_the_full_updated_row_in_the_same_response
        claim_type: immediate
        grounds: [consistency_model, endpoints]
        distinguishing_aspect: >
          Action endpoints return the updated entity itself — new state, new computed fields, new
          version — rather than an acknowledgement the client must follow with a read. A subsequent GET
          must therefore be byte-identical to the action's response body.
        test_recipe:
          setup: ["Pile PA is SEALED and kiln K1 is AVAILABLE at 2026-08-01T00:00:00Z."]
          setup_api_calls: *chain_sealed
          trigger:
            - *c_r0
            - *c_r0_light
            - { call: "GET /cement-ops/kiln-runs/${r0}", as: KilnOperator, payload: {} }
            - *c_r0_gas
            - { call: "GET /cement-ops/kiln-runs/${r0}", as: KilnOperator, payload: {} }
          assert:
            - "the create returns 201 with process_state SCHEDULED, quality_state PENDING_LAB, gross_energy_gj 0.00 and version 1 — every computed field already present"
            - "the light returns 200 with process_state BURNING and lit_at 2026-08-01T00:00:00.000Z, and the GET that follows is byte-identical to it"
            - "the fuel charge returns the run with fuel_charges holding one entry, gross_energy_gj 2160.00, provisional_clinker_tonnes 600.00, effective_shc_gj_per_tonne 3.70, clinker_tonnes 583.78, nox_emitted_kg 216.00 and nox_intensity_kg_per_tonne 0.370"
            - "the second GET matches that body field for field, so nothing settled between the two requests"
            - "no action endpoint in the API returns 202 Accepted or an empty body"
