# =============================================================================
# Hospital Case Management & Discharge Planning — benchmark seed tables (v1)
# Difficulty target: beyond Expert (§0.4) — 12 entities, 49 endpoints,
# 6 state machines (parallel / cyclic / branching / compound), 7 calculations.
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2158. Hospital Case Management & Discharge Planning
  (hospital case management): risk screening at admission & barrier identification, post-acute
  placement search & bed offers, insurance authorization for SNF/home health, durable medical
  equipment & transport arrangement, discharge-readiness criteria & delay reason coding, patient
  choice documentation & referral fairness, readmission-risk intervention, length-of-stay &
  throughput reporting

domain_name: hospital-case-management
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Peer entities linked by explicit foreign keys, plus two many-to-many hubs
  # (NetworkContract joins Payer x PostAcuteProvider; BedOffer joins Referral x
  # PostAcuteProvider). All resource URLs are top-level; only two read-only
  # sub-resource listings exist (Episode -> screenings / barriers).

  state_machine_shape: parallel
  # Episode carries two independent axes (case_status x barrier_posture);
  # Referral and Barrier and AuthorizationRequest are cyclic; BedOffer and
  # LogisticsOrder are branching; barrier_posture is compound over children.

  relationship_patterns:
    - one_to_many          # Episode -> RiskScreening / Barrier / Referral / AuthorizationRequest / LogisticsOrder
    - many_to_many         # Payer <-> PostAcuteProvider via NetworkContract
    - polymorphic          # LogisticsOrder.order_type selects vehicle_id vs supplier_provider_id
    - cross_aggregate      # BedOffer bridges Referral and PostAcuteProvider

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Insurance plan display name" }
      - { name: snf_auth_required, type: boolean, source: input, default: true, description: "When true, a placement whose level_of_care is SNF/IRF/LTACH may only be chosen once an AuthorizationRequest for that provider is APPROVED or PARTIALLY_APPROVED" }
      - { name: hh_auth_required, type: boolean, source: input, default: true, description: "Same gate for level_of_care HOME_HEALTH" }
      - { name: coinsurance_pct, type: number, source: input, description: "Member coinsurance share applied in calculations.placement_cost_projection; 0.000 <= value <= 0.500, three decimals" }
      - { name: auth_expiry_days, type: integer, source: input, default: 30, description: "Days added to decided_at to produce AuthorizationRequest.expires_at" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique across all Patient rows" }
      - { name: full_name, type: string, source: input, description: "Patient display name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: primary_payer_id, type: string, source: input, description: "FK -> Payer.id; the payer whose rules gate every authorization on this patient's episodes" }
      - { name: prior_admissions_180d, type: integer, source: input, description: "Reported inpatient admissions in the trailing 180 days; >= 0" }
      - { name: lives_alone, type: boolean, source: input, description: "Social-support flag consumed by calculations.composite_readmission_risk_score" }
      - { name: has_pcp, type: boolean, source: input, description: "Whether the patient has an established primary care provider" }

  - name: Episode
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the admitted patient" }
      - { name: admission_type, type: enum, source: input, description: "EMERGENT | ELECTIVE | OBSERVATION" }
      - { name: drg_code, type: string, source: input, description: "Diagnosis-related group code used for reporting" }
      - { name: drg_gmlos_days, type: number, source: input, description: "DRG geometric-mean length of stay in days; > 0, up to two decimals" }
      - { name: attending_unit, type: string, source: input, description: "Inpatient unit code" }
      - { name: admitted_at, type: datetime, source: input, description: "ISO 8601 UTC admission instant; must be <= the logical clock at create" }
      - { name: assigned_case_manager_id, type: string, source: system, description: "X-User-ID of the CaseManager that created the episode; opaque operator id, never an entity id" }
      - { name: case_status, type: enum, source: system, default: "ADMITTED", description: "ADMITTED | SCREENED | PLANNING | READY_FOR_DISCHARGE | DISCHARGED | CANCELLED" }
      - { name: barrier_posture, type: enum, source: computed, description: "CLEAR | ACTIVE | ESCALATED; recomputed from this episode's Barrier children per calculations.barrier_posture_rollup" }
      - { name: discharge_disposition, type: enum, source: system, default: null, description: "null until mark-ready; HOME_SELF_CARE | HOME_WITH_HH | SNF | IRF | LTACH | HOSPICE | AMA" }
      - { name: current_risk_score, type: integer, source: computed, description: "Latest composite_readmission_risk_score for the episode; 0..100" }
      - { name: current_risk_band, type: enum, source: computed, description: "LOW | MODERATE | HIGH | VERY_HIGH" }
      - { name: risk_variant_applied, type: enum, source: computed, description: "ADMISSION_VARIANT | PREDISCHARGE_VARIANT — which variant produced current_risk_score" }
      - { name: barriers_ever_opened_count, type: integer, source: computed, description: "Count of Barrier rows whose episode_id equals this episode, all statuses included (WAIVED counted, reopens not double-counted)" }
      - { name: pcp_followup_booked, type: boolean, source: system, default: false, description: "Readmission-risk intervention flag" }
      - { name: med_reconciliation_completed, type: boolean, source: system, default: false, description: "Readmission-risk intervention flag" }
      - { name: tcm_call_scheduled, type: boolean, source: system, default: false, description: "Readmission-risk intervention flag (transitional care management outreach)" }
      - { name: home_monitoring_enrolled, type: boolean, source: system, default: false, description: "Readmission-risk intervention flag" }
      - { name: readmission_bundle_complete, type: boolean, source: computed, description: "True when every flag required by calculations.readmission_bundle_requirement for current_risk_band is true" }
      - { name: logistics_committed_cents, type: integer, source: computed, description: "Conserved ledger: sum of LogisticsOrder.cost_cents over this episode's orders with status IN {CONFIRMED, COMPLETED}" }
      - { name: authorized_days_total, type: integer, source: computed, description: "Sum of AuthorizationRequest.approved_days over this episode's requests with status IN {APPROVED, PARTIALLY_APPROVED}" }
      - { name: avoidable_delay_hours, type: number, source: computed, description: "Merged avoidable barrier-clock union, one decimal; see calculations.avoidable_delay_hours" }
      - { name: los_hours, type: number, source: computed, description: "(discharged_at or logical clock now) - admitted_at, one decimal" }
      - { name: adjusted_los_hours, type: number, source: computed, description: "los_hours - avoidable_delay_hours, one decimal, floored at 0.0" }
      - { name: expected_los_hours, type: number, source: computed, description: "drg_gmlos_days * 24 * acuity multiplier for current_risk_band, one decimal" }
      - { name: observed_expected_ratio, type: number, source: computed, description: "adjusted_los_hours / expected_los_hours, three decimals, round_half_up" }
      - { name: throughput_grade, type: enum, source: computed, description: "EXEMPLARY | ON_TARGET | ABOVE_TARGET | OUTLIER" }
      - { name: marked_ready_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the CaseManager that marked the episode ready; cleared on revert-to-planning; opaque operator id" }
      - { name: marked_ready_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the mark-ready transition; cleared on revert" }
      - { name: discharged_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the discharge transition" }

  - name: RiskScreening
    parent: Episode
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> Episode.id; the episode being screened" }
      - { name: screening_type, type: enum, source: input, description: "ADMISSION | RESCREEN" }
      - { name: functional_score, type: integer, source: input, description: "Independence in activities of daily living, 0 (dependent) .. 10 (independent)" }
      - { name: cognitive_score, type: integer, source: input, description: "Cognition, 0 .. 10" }
      - { name: social_support_score, type: integer, source: input, description: "Available caregiver support, 0 .. 10" }
      - { name: medication_count, type: integer, source: input, description: "Discharge medication count; >= 0; polypharmacy points apply at >= POLYPHARMACY_THRESHOLD" }
      - { name: prior_admissions_snapshot, type: integer, source: system, description: "Copy of Patient.prior_admissions_180d taken at screening create" }
      - { name: lives_alone_snapshot, type: boolean, source: system, description: "Copy of Patient.lives_alone taken at screening create" }
      - { name: has_pcp_snapshot, type: boolean, source: system, description: "Copy of Patient.has_pcp taken at screening create" }
      - { name: variant_applied, type: enum, source: computed, description: "ADMISSION_VARIANT | PREDISCHARGE_VARIANT; set at submit from screening_type" }
      - { name: composite_risk_score, type: integer, source: computed, description: "0 until submit; then calculations.composite_readmission_risk_score, clamped 0..100" }
      - { name: risk_band, type: enum, source: computed, description: "LOW | MODERATE | HIGH | VERY_HIGH" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | SUPERSEDED" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of submit" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the submitting CaseManager; opaque operator id" }

  - name: Barrier
    parent: Episode
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> Episode.id; the episode this barrier delays" }
      - { name: barrier_code, type: enum, source: input, description: "HOUSING | TRANSPORT | INSURANCE_AUTH | DME_DELIVERY | GUARDIANSHIP | BEHAVIORAL | FAMILY_DECISION | PHYSICIAN_ORDER | BED_AVAILABILITY" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: delay_reason_code, type: enum, source: input, description: "AWAITING_BED | AWAITING_AUTH | AWAITING_DME | AWAITING_TRANSPORT | AWAITING_FAMILY | AWAITING_PHYSICIAN | CLINICAL_INSTABILITY | PATIENT_REFUSAL" }
      - { name: avoidable, type: boolean, source: computed, description: "True iff delay_reason_code is in AVOIDABLE_DELAY_CODES (the six AWAITING_* codes)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | MITIGATING | RESOLVED | WAIVED" }
      - { name: clock_start_at, type: datetime, source: system, description: "Logical-clock instant at which the current delay interval opened; reset on each reopen" }
      - { name: clock_stop_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which the current delay interval closed (RESOLVED or WAIVED); null while OPEN or MITIGATING" }
      - { name: accrued_delay_minutes, type: integer, source: computed, description: "Sum of all closed intervals plus the currently open interval up to the logical clock; per-barrier, before union merge" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of RESOLVED -> OPEN transitions on this row" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID that created the barrier, or the literal 'system' for auto-created barriers; opaque operator id" }
      - { name: origin, type: enum, source: system, description: "MANUAL | SCREENING_AUTO | AUTH_DENIAL_AUTO | REVERT_AUTO" }

  - name: PostAcuteProvider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Provider display name" }
      - { name: provider_type, type: enum, source: input, description: "SNF | HOME_HEALTH | IRF | LTACH | DME_SUPPLIER" }
      - { name: quality_star_rating, type: integer, source: input, description: "1 .. 5 stars; feeds calculations.bed_offer_rank_score" }
      - { name: distance_miles_from_hospital, type: integer, source: input, description: "Whole miles, >= 0" }
      - { name: bed_unit_codes, type: array, source: input, description: "List of bed-unit code strings this provider can hold; empty array for DME_SUPPLIER" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED; SUSPENDED providers are excluded from every referral candidate pool" }
      - { name: held_bed_units, type: integer, source: computed, description: "Conserved ledger: count of BedOffer rows for this provider with status IN {OFFERED, ACCEPTED_BY_PATIENT}" }
      - { name: offers_received_count, type: integer, source: computed, description: "Number of broadcast rounds whose provider_ids included this provider" }
      - { name: offers_submitted_count, type: integer, source: computed, description: "Count of BedOffer rows this provider has created, all statuses" }
      - { name: offers_accepted_count, type: integer, source: computed, description: "Count of BedOffer rows for this provider with status ACCEPTED_BY_PATIENT" }
      - { name: acceptance_rate_pct, type: number, source: computed, description: "round_half_up(offers_accepted_count * 100 / offers_submitted_count, 1); exactly 0.0 when offers_submitted_count == 0" }

  - name: NetworkContract
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> PostAcuteProvider.id" }
      - { name: in_network, type: boolean, source: input, description: "When true the negotiated rate variant of calculations.placement_cost_projection applies" }
      - { name: negotiated_daily_rate_cents, type: integer, source: input, description: "Contracted per-diem in cents; > 0" }

  - name: Referral
    parent: Episode
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> Episode.id; the episode seeking placement" }
      - { name: requested_level_of_care, type: enum, source: input, description: "SNF | HOME_HEALTH | IRF | LTACH" }
      - { name: projected_stay_days, type: integer, source: input, description: "Planned post-acute days; >= 1; the covered-day count used by placement_cost_projection" }
      - { name: needed_by, type: datetime, source: input, description: "Logical-clock instant by which a bed must be available" }
      - { name: round_index, type: integer, source: system, default: 0, description: "Negotiation round; 0 while DRAFT, incremented on each broadcast" }
      - { name: broadcast_provider_ids, type: array, source: system, description: "Provider ids included in the current round's broadcast, stored in the order supplied" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | BROADCAST | CHOICE_PENDING | PLACED | WITHDRAWN | EXPIRED" }
      - { name: chosen_bed_offer_id, type: string, source: system, default: null, description: "FK -> BedOffer.id; null until PLACED" }
      - { name: choice_basis, type: enum, source: system, default: null, description: "PATIENT_PREFERENCE | FAMILY_PREFERENCE | CLINICAL_MATCH | ONLY_AVAILABLE; recorded at document-choice" }
      - { name: patient_choice_attested, type: boolean, source: system, default: false, description: "Compliance attestation captured at document-choice" }
      - { name: recommended_bed_offer_id, type: string, source: computed, description: "Advisory selector output (not a stored relationship): id of the top-ranked eligible BedOffer of the current round per calculations.bed_offer_rank_score; null when the eligible set is empty. Recomputed on every read; never constrains patient choice." }

  - name: BedOffer
    parent: Referral
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id; the referral round this offer answers" }
      - { name: provider_id, type: string, source: system, description: "FK -> PostAcuteProvider.id; the offering provider (equals the PostAcuteLiaison X-User-ID)" }
      - { name: round_index, type: integer, source: system, description: "Copy of Referral.round_index at offer creation" }
      - { name: bed_unit_code, type: string, source: input, description: "Must be a member of the provider's bed_unit_codes array" }
      - { name: bed_available_from, type: datetime, source: input, description: "Inclusive start of the half-open bed-hold interval" }
      - { name: hold_expires_at, type: datetime, source: input, description: "Exclusive end of the half-open bed-hold interval; must be strictly after bed_available_from" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Provider's billed per-diem in cents; > 0" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED_BY_PATIENT | DECLINED_BY_PATIENT | WITHDRAWN | EXPIRED" }
      - { name: rank_score, type: integer, source: computed, description: "calculations.bed_offer_rank_score output; recomputed on every read of the offer or its referral" }
      - { name: rate_variant_applied, type: enum, source: computed, description: "NETWORK_RATE | BILLED_RATE" }
      - { name: projected_gross_cents, type: integer, source: computed, description: "Tiered per-diem total from calculations.placement_cost_projection" }
      - { name: projected_patient_share_cents, type: integer, source: computed, description: "round_half_up(projected_gross_cents * payer.coinsurance_pct)" }
      - { name: projected_plan_share_cents, type: integer, source: computed, description: "projected_gross_cents - projected_patient_share_cents" }

  - name: AuthorizationRequest
    parent: Episode
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> Episode.id" }
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; copied from the episode's patient primary_payer_id at create" }
      - { name: provider_id, type: string, source: input, description: "FK -> PostAcuteProvider.id; the post-acute provider the days are requested for" }
      - { name: level_of_care, type: enum, source: input, description: "SNF | HOME_HEALTH | IRF | LTACH; must equal the provider's provider_type" }
      - { name: requested_days, type: integer, source: input, description: ">= 1" }
      - { name: billed_daily_rate_cents, type: integer, source: input, description: "Provider's billed per-diem used when no in-network contract exists; > 0" }
      - { name: approved_days, type: integer, source: system, default: null, description: "Null until a decision; 0 on DENY; <= requested_days on PARTIAL" }
      - { name: appeal_round, type: integer, source: system, default: 0, description: "Number of appeals filed; capped at MAX_APPEAL_ROUNDS" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | PENDED | APPROVED | PARTIALLY_APPROVED | DENIED | EXPIRED" }
      - { name: denial_reason, type: enum, source: system, default: null, description: "NOT_MEDICALLY_NECESSARY | OUT_OF_NETWORK | INCOMPLETE_CLINICALS" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent decision" }
      - { name: expires_at, type: datetime, source: system, default: null, description: "decided_at + payer.auth_expiry_days days; only set on APPROVED / PARTIALLY_APPROVED" }
      - { name: rate_variant_applied, type: enum, source: computed, description: "NETWORK_RATE | BILLED_RATE" }
      - { name: gross_projection_cents, type: integer, source: computed, description: "raw_daily * approved_days, pre-discount; 0 before a decision" }
      - { name: volume_discount_pct, type: number, source: computed, description: "Tier keyed on gross_projection_cents (pre-discount) per calculations.authorization_award" }
      - { name: authorized_amount_cents, type: integer, source: computed, description: "gross_projection_cents - round_half_up(gross_projection_cents * volume_discount_pct)" }

  - name: TransportVehicle
    parent: null
    common_fields: true
    fields:
      - { name: operator_name, type: string, source: input, description: "Transport operator display name" }
      - { name: vehicle_type, type: enum, source: input, description: "WHEELCHAIR_VAN | BLS_AMBULANCE | ALS_AMBULANCE" }
      - { name: base_rate_cents, type: integer, source: input, description: "Flat dispatch fee in cents; > 0" }
      - { name: per_mile_cents, type: integer, source: input, description: "Marginal per-mile charge in cents; >= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | OUT_OF_SERVICE" }

  - name: LogisticsOrder
    parent: Episode
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK -> Episode.id" }
      - { name: order_type, type: enum, source: input, description: "PATIENT_TRANSPORT | DME_DELIVERY" }
      - { name: vehicle_id, type: string, source: input, default: null, description: "FK -> TransportVehicle.id; required when order_type is PATIENT_TRANSPORT, must be absent otherwise" }
      - { name: supplier_provider_id, type: string, source: input, default: null, description: "FK -> PostAcuteProvider.id; required when order_type is DME_DELIVERY and the provider_type must be DME_SUPPLIER; must be absent otherwise" }
      - { name: destination_provider_id, type: string, source: input, default: null, description: "FK -> PostAcuteProvider.id; optional transport destination, must equal the placed referral's provider when the episode has a PLACED Referral" }
      - { name: item_code, type: enum, source: input, default: null, description: "HOSPITAL_BED | OXYGEN_CONCENTRATOR | WHEELCHAIR | WALKER | CPAP; required for DME_DELIVERY, absent otherwise" }
      - { name: mileage_miles, type: integer, source: input, default: null, description: "Whole miles; required for PATIENT_TRANSPORT, absent otherwise; >= 0" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the closed service window" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive end of the closed service window; must be strictly after window_start" }
      - { name: cost_cents, type: integer, source: computed, description: "calculations.logistics_cost output; fixed at create and never re-derived afterwards" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED" }
      - { name: cancel_reason, type: enum, source: system, default: null, description: "SUPERSEDED | CLINICAL_CHANGE | VEHICLE_UNAVAILABLE | READINESS_REVERTED | USER_REQUEST" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:

  # --- Episode, axis 1 of 2: case_status (linear forward + one revert cycle) ---
  - entity: Episode
    state_field: case_status
    initial_state: ADMITTED
    terminal_states: [DISCHARGED, CANCELLED]
    transitions:
      - from: ADMITTED
        to: SCREENED
        trigger: "system: POST /screenings/{id}/submit where the screening's screening_type == ADMISSION"
        actor: system
        preconditions:
          - "episode.case_status == ADMITTED"
          - "the submitted RiskScreening belongs to this episode"
        side_effects:
          - "Episode.current_risk_score / current_risk_band / risk_variant_applied set from the screening (risk_variant_applied = ADMISSION_VARIANT)"
          - "Auto-create Barriers per calculations.screening_barrier_derivation; each new Barrier sets clock_start_at = logical clock now and origin = SCREENING_AUTO"
          - "Episode.barrier_posture recomputed by calculations.barrier_posture_rollup"
          - "Episode.readmission_bundle_complete recomputed by calculations.readmission_bundle_requirement"
      - from: SCREENED
        to: PLANNING
        trigger: "system: first planning artifact created — POST /episodes/{id}/referrals, POST /episodes/{id}/authorizations, POST /episodes/{id}/logistics-orders, or POST /episodes/{id}/readmission-bundle"
        actor: system
        preconditions:
          - "episode.case_status == SCREENED"
        side_effects:
          - "case_status → PLANNING"
        note: "Idempotent: when case_status is already PLANNING the artifact is created and case_status is left unchanged."
      - from: PLANNING
        to: READY_FOR_DISCHARGE
        trigger: "POST /episodes/{id}/mark-ready"
        actor: CaseManager
        preconditions:
          - "episode.case_status == PLANNING"
          - "episode.barrier_posture != ESCALATED"
          - "no Barrier on this episode has status IN {OPEN, MITIGATING}"
          - "episode.readmission_bundle_complete == true, evaluated against the current_risk_band IN EFFECT BEFORE this transition's predischarge recompute"
          - "when discharge_disposition IN {SNF, IRF, LTACH, HOME_WITH_HH}: at least one Referral on this episode has status PLACED"
        side_effects:
          - "discharge_disposition set from the request body"
          - "marked_ready_by_user_id = X-User-ID; marked_ready_at = logical clock now"
          - "Episode.current_risk_score / current_risk_band recomputed with the PREDISCHARGE variant of calculations.composite_readmission_risk_score; risk_variant_applied = PREDISCHARGE_VARIANT"
          - "Episode.readmission_bundle_complete re-derived against the NEW band (may become false without blocking, since the gate already passed)"
          - "Episode throughput fields (los_hours, adjusted_los_hours, expected_los_hours, observed_expected_ratio, throughput_grade) recomputed"
        note: "Precedence pin: bundle completeness is judged on the pre-transition band; the predischarge rescore happens strictly after every precondition passes."
      - from: READY_FOR_DISCHARGE
        to: PLANNING
        trigger: "POST /episodes/{id}/revert-to-planning, or system revert cascaded from an AuthorizationRequest DENY"
        actor: CaseManager | UtilizationReviewNurse | system
        preconditions:
          - "episode.case_status == READY_FOR_DISCHARGE"
        side_effects:
          - "marked_ready_by_user_id = null; marked_ready_at = null; discharge_disposition retained"
          - "A Barrier is auto-created with barrier_code = the request's reason_code mapping, severity = HIGH, origin = REVERT_AUTO, clock_start_at = logical clock now"
          - "Every LogisticsOrder on this episode with order_type == PATIENT_TRANSPORT and status == CONFIRMED → CANCELLED with cancel_reason = READINESS_REVERTED; each cancellation releases that order's vehicle interval and debits Episode.logistics_committed_cents by its cost_cents"
          - "Episode.barrier_posture recomputed"
        note: "This is the cycle in the case_status axis: PLANNING → READY_FOR_DISCHARGE → PLANNING may repeat without bound. The auto-Barrier is created ONLY when the revert is driven by POST /episodes/{id}/revert-to-planning (which supplies reason_code); a system revert cascaded from an AuthorizationRequest DENY or a Barrier reopen creates no extra barrier, because the barrier that caused the cascade already exists."
      - from: READY_FOR_DISCHARGE
        to: DISCHARGED
        trigger: "POST /episodes/{id}/discharge"
        actor: DischargeCoordinator
        preconditions:
          - "episode.case_status == READY_FOR_DISCHARGE"
          - "X-User-ID != episode.marked_ready_by_user_id (four-eyes segregation of duties)"
          - "no LogisticsOrder on this episode has status == REQUESTED"
        side_effects:
          - "case_status → DISCHARGED; discharged_at = logical clock now"
          - "Every LogisticsOrder with status == CONFIRMED → COMPLETED (cost stays committed; logistics_committed_cents unchanged)"
          - "Every BedOffer on this episode's referrals with status == OFFERED → EXPIRED; each expiry decrements that provider's held_bed_units and releases its bed-hold interval"
          - "Every Barrier with status IN {OPEN, MITIGATING} → RESOLVED with clock_stop_at = logical clock now (none can exist, since mark-ready required an empty open set and any post-ready barrier forces a revert)"
          - "Episode throughput fields finalized against discharged_at"
      - from: ADMITTED
        to: CANCELLED
        trigger: "POST /episodes/{id}/revert-to-planning with reason_code == PATIENT_LEFT_AMA"
        actor: CaseManager | UtilizationReviewNurse
        preconditions:
          - "episode.case_status == ADMITTED"
          - "request body reason_code == PATIENT_LEFT_AMA"
        side_effects:
          - "case_status → CANCELLED; discharge_disposition = AMA; discharged_at = logical clock now"
          - "Every Barrier with status IN {OPEN, MITIGATING} → WAIVED with clock_stop_at = logical clock now"
        note: "reason_code == PATIENT_LEFT_AMA is the only cancellation path; from every other reason_code this endpoint is a READY_FOR_DISCHARGE → PLANNING revert."
      - from: SCREENED
        to: CANCELLED
        trigger: "POST /episodes/{id}/revert-to-planning with reason_code == PATIENT_LEFT_AMA"
        actor: CaseManager | UtilizationReviewNurse
        preconditions:
          - "episode.case_status == SCREENED"
          - "request body reason_code == PATIENT_LEFT_AMA"
        side_effects:
          - "case_status → CANCELLED; discharge_disposition = AMA; discharged_at = logical clock now"
          - "Every Referral with status IN {DRAFT, BROADCAST, CHOICE_PENDING} → WITHDRAWN; each withdrawal moves its round's OFFERED BedOffers → WITHDRAWN, decrementing held_bed_units for each affected provider"
          - "Every LogisticsOrder with status IN {REQUESTED, CONFIRMED} → CANCELLED with cancel_reason = CLINICAL_CHANGE, debiting Episode.logistics_committed_cents for the CONFIRMED ones"
          - "Every Barrier with status IN {OPEN, MITIGATING} → WAIVED with clock_stop_at = logical clock now"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /episodes/{id}/revert-to-planning with reason_code == PATIENT_LEFT_AMA"
        actor: CaseManager | UtilizationReviewNurse
        preconditions:
          - "episode.case_status == PLANNING"
          - "request body reason_code == PATIENT_LEFT_AMA"
        side_effects:
          - "identical to the SCREENED → CANCELLED row above"

  # --- Episode, axis 2 of 2: barrier_posture (compound, derived from children) ---
  - entity: Episode
    state_field: barrier_posture
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: ACTIVE
        trigger: "system: any Barrier on the episode enters or remains in {OPEN, MITIGATING} after a barrier create/status change, an auth denial cascade, or a readiness revert"
        actor: system
        preconditions:
          - "at least one Barrier with status IN {OPEN, MITIGATING}"
          - "no such Barrier has severity == CRITICAL"
          - "no such Barrier has (logical clock now - clock_start_at) >= ESCALATION_HOURS hours"
        side_effects:
          - "barrier_posture → ACTIVE"
      - from: ACTIVE
        to: ESCALATED
        trigger: "system: recomputed on every request that reads or writes this Episode or any of its Barriers"
        actor: system
        preconditions:
          - "at least one Barrier with status IN {OPEN, MITIGATING} that has severity == CRITICAL OR has been open for >= ESCALATION_HOURS hours"
        side_effects:
          - "barrier_posture → ESCALATED; POST /episodes/{id}/mark-ready and POST /episodes/{id}/discharge are both rejected with ERR_ESCALATED_POSTURE while this holds"
      - from: ESCALATED
        to: ACTIVE
        trigger: "system: the escalating Barrier is resolved or waived while other non-critical barriers remain open"
        actor: system
        preconditions:
          - "no remaining Barrier with status IN {OPEN, MITIGATING} is CRITICAL or aged >= ESCALATION_HOURS"
          - "at least one Barrier still has status IN {OPEN, MITIGATING}"
        side_effects:
          - "barrier_posture → ACTIVE"
      - from: ACTIVE
        to: CLEAR
        trigger: "system: the last Barrier in {OPEN, MITIGATING} moves to RESOLVED or WAIVED"
        actor: system
        preconditions:
          - "no Barrier on this episode has status IN {OPEN, MITIGATING}"
        side_effects:
          - "barrier_posture → CLEAR"
      - from: ESCALATED
        to: CLEAR
        trigger: "system: the last open Barrier (itself the escalating one) moves to RESOLVED or WAIVED"
        actor: system
        preconditions:
          - "no Barrier on this episode has status IN {OPEN, MITIGATING}"
        side_effects:
          - "barrier_posture → CLEAR"
      - from: CLEAR
        to: ESCALATED
        trigger: "system: a Barrier with severity == CRITICAL is created on an episode whose open set was empty"
        actor: system
        preconditions:
          - "the newly created Barrier has severity == CRITICAL"
        side_effects:
          - "barrier_posture → ESCALATED"

  # --- RiskScreening (linear with supersede) ---
  - entity: RiskScreening
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /screenings/{id}/submit"
        actor: CaseManager
        preconditions:
          - "screening.status == DRAFT"
          - "episode.case_status IN {ADMITTED, SCREENED, PLANNING}"
          - "when screening_type == ADMISSION: no other RiskScreening on this episode has status SUBMITTED with screening_type ADMISSION"
        side_effects:
          - "variant_applied = ADMISSION_VARIANT when screening_type == ADMISSION, else PREDISCHARGE_VARIANT"
          - "composite_risk_score and risk_band computed by calculations.composite_readmission_risk_score"
          - "submitted_at = logical clock now; submitted_by_user_id = X-User-ID"
          - "any other RiskScreening on this episode with status SUBMITTED → SUPERSEDED"
          - "Episode.current_risk_score / current_risk_band / risk_variant_applied adopt this screening's values"
          - "Barriers auto-created per calculations.screening_barrier_derivation"
          - "Episode.barrier_posture and Episode.readmission_bundle_complete recomputed"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a later RiskScreening on the same episode is submitted"
        actor: system
        preconditions:
          - "screening.status == SUBMITTED"
        side_effects:
          - "score and band are frozen at their submitted values"

  # --- Barrier (cyclic: RESOLVED → OPEN revision loop) ---
  - entity: Barrier
    initial_state: OPEN
    terminal_states: [WAIVED]
    transitions:
      - from: OPEN
        to: MITIGATING
        trigger: "POST /barriers/{id}/status with to_status == MITIGATING"
        actor: CaseManager | UtilizationReviewNurse
        preconditions:
          - "barrier.status == OPEN"
        side_effects:
          - "clock_start_at unchanged; the delay interval keeps accruing"
          - "Episode.barrier_posture recomputed"
      - from: MITIGATING
        to: RESOLVED
        trigger: "POST /barriers/{id}/status with to_status == RESOLVED"
        actor: CaseManager | UtilizationReviewNurse
        preconditions:
          - "barrier.status == MITIGATING"
        side_effects:
          - "clock_stop_at = logical clock now; accrued_delay_minutes closed out"
          - "Episode.avoidable_delay_hours recomputed by calculations.avoidable_delay_hours"
          - "Episode.barrier_posture recomputed"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /barriers/{id}/status with to_status == RESOLVED"
        actor: CaseManager | UtilizationReviewNurse
        preconditions:
          - "barrier.status == OPEN"
        side_effects:
          - "identical to the MITIGATING → RESOLVED row"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /barriers/{id}/status with to_status == OPEN, or system reopen cascaded from an AuthorizationRequest DENY on a matching INSURANCE_AUTH barrier"
        actor: CaseManager | UtilizationReviewNurse | system
        preconditions:
          - "barrier.status == RESOLVED"
        side_effects:
          - "reopen_count += 1; clock_start_at = logical clock now; clock_stop_at = null"
          - "Episode.avoidable_delay_hours recomputed — the freshly opened zero-length interval [now, now) contributes 0 minutes to the union"
          - "Episode.barrier_posture recomputed"
          - "when Episode.case_status == READY_FOR_DISCHARGE, the episode reverts to PLANNING (cascade)"
        note: "This is the cycle: OPEN → MITIGATING → RESOLVED → OPEN may repeat without bound; reopen_count records the loop count."
      - from: OPEN
        to: WAIVED
        trigger: "POST /barriers/{id}/status with to_status == WAIVED"
        actor: UtilizationReviewNurse
        preconditions:
          - "barrier.status == OPEN"
          - "X-User-Role == UtilizationReviewNurse"
          - "X-User-ID != barrier.opened_by_user_id (segregation of duties)"
        side_effects:
          - "clock_stop_at = logical clock now"
          - "the barrier's intervals are removed from the avoidable union entirely (WAIVED barriers never count toward avoidable_delay_hours, including their previously closed intervals)"
          - "Episode.avoidable_delay_hours and Episode.barrier_posture recomputed"
      - from: MITIGATING
        to: WAIVED
        trigger: "POST /barriers/{id}/status with to_status == WAIVED"
        actor: UtilizationReviewNurse
        preconditions:
          - "barrier.status == MITIGATING"
          - "X-User-ID != barrier.opened_by_user_id"
        side_effects:
          - "identical to the OPEN → WAIVED row"

  # --- Referral (cyclic: negotiation rounds) ---
  - entity: Referral
    initial_state: DRAFT
    terminal_states: [PLACED, WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: BROADCAST
        trigger: "POST /referrals/{id}/broadcast"
        actor: CaseManager
        preconditions:
          - "referral.status == DRAFT"
          - "episode.case_status == PLANNING"
          - "provider_ids contains >= MIN_BROADCAST_PROVIDERS distinct providers whose status == ACTIVE and provider_type == referral.requested_level_of_care"
          - "provider_ids contains EVERY ACTIVE provider whose provider_type == requested_level_of_care and which has a NetworkContract with in_network == true for the episode's payer (no-steering fairness rule)"
        side_effects:
          - "round_index += 1 (0 → 1); broadcast_provider_ids = the supplied list, order preserved"
          - "each listed provider's offers_received_count += 1"
          - "Referral.version += 1"
      - from: BROADCAST
        to: CHOICE_PENDING
        trigger: "system: the first BedOffer of the current round is created by POST /referrals/{id}/offers"
        actor: system
        preconditions:
          - "referral.status == BROADCAST"
        side_effects:
          - "status → CHOICE_PENDING"
      - from: CHOICE_PENDING
        to: PLACED
        trigger: "POST /referrals/{id}/document-choice"
        actor: CaseManager
        preconditions:
          - "referral.status == CHOICE_PENDING"
          - "the chosen BedOffer belongs to this referral, has round_index == referral.round_index, and status == OFFERED"
          - "logical clock now < chosen offer.hold_expires_at"
          - "patient_choice_attested == true in the request body"
          - "when the payer requires authorization for this level of care: an AuthorizationRequest for (episode, chosen offer's provider) has status IN {APPROVED, PARTIALLY_APPROVED} and expires_at > logical clock now"
          - "that authorization's approved_days >= referral.projected_stay_days"
        side_effects:
          - "chosen BedOffer → ACCEPTED_BY_PATIENT; its provider's offers_accepted_count += 1 and acceptance_rate_pct recomputed"
          - "every OTHER BedOffer of this round with status == OFFERED → DECLINED_BY_PATIENT; each decline decrements that provider's held_bed_units and releases its bed-hold interval"
          - "Referral.status → PLACED; chosen_bed_offer_id, choice_basis, patient_choice_attested recorded"
          - "cascade hop 3: every Barrier on the episode with barrier_code == BED_AVAILABILITY and status IN {OPEN, MITIGATING} → RESOLVED with clock_stop_at = logical clock now"
          - "cascade hop 4: that barrier resolution recomputes Episode.avoidable_delay_hours and Episode.barrier_posture"
          - "Referral.version += 1"
      - from: CHOICE_PENDING
        to: BROADCAST
        trigger: "POST /referrals/{id}/broadcast (next round)"
        actor: CaseManager
        preconditions:
          - "referral.status == CHOICE_PENDING"
          - "every BedOffer with round_index == referral.round_index has status IN {DECLINED_BY_PATIENT, WITHDRAWN, EXPIRED}"
          - "the same fairness and MIN_BROADCAST_PROVIDERS rules as the DRAFT → BROADCAST row"
        side_effects:
          - "round_index += 1; broadcast_provider_ids replaced; each listed provider's offers_received_count += 1"
          - "Referral.version += 1"
        note: "This is the negotiation cycle: BROADCAST → CHOICE_PENDING → BROADCAST repeats one round per iteration."
      - from: CHOICE_PENDING
        to: WITHDRAWN
        trigger: "system: cascaded from an Episode cancellation (PATIENT_LEFT_AMA)"
        actor: system
        preconditions:
          - "referral.status IN {DRAFT, BROADCAST, CHOICE_PENDING}"
        side_effects:
          - "every OFFERED BedOffer of the current round → WITHDRAWN, decrementing held_bed_units per provider"
      - from: BROADCAST
        to: EXPIRED
        trigger: "system: logical clock now >= referral.needed_by while no offer of the current round is OFFERED; evaluated at the start of every request that reads or writes this Referral"
        actor: system
        preconditions:
          - "referral.status == BROADCAST"
          - "logical clock now >= referral.needed_by"
        side_effects:
          - "status → EXPIRED"
          - "a Barrier with barrier_code == BED_AVAILABILITY, severity = HIGH, delay_reason_code = AWAITING_BED, origin = REVERT_AUTO is created if none is open on the episode"

  # --- BedOffer (branching fork with divergent side-effect sets) ---
  - entity: BedOffer
    initial_state: OFFERED
    terminal_states: [ACCEPTED_BY_PATIENT, DECLINED_BY_PATIENT, WITHDRAWN, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED_BY_PATIENT
        trigger: "system: this offer is the chosen_bed_offer_id of POST /referrals/{id}/document-choice"
        actor: system
        preconditions:
          - "offer.status == OFFERED and offer.round_index == referral.round_index"
        side_effects:
          - "provider.offers_accepted_count += 1; acceptance_rate_pct recomputed"
          - "the bed-hold interval stays occupied (held_bed_units unchanged)"
      - from: OFFERED
        to: DECLINED_BY_PATIENT
        trigger: "system: a sibling offer of the same round is chosen"
        actor: system
        preconditions:
          - "offer.status == OFFERED and offer.round_index == referral.round_index"
        side_effects:
          - "provider.held_bed_units -= 1; the bed-hold interval is released for reuse"
          - "provider.acceptance_rate_pct recomputed (denominator unchanged, numerator unchanged)"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /offers/{id}/withdraw"
        actor: PostAcuteLiaison
        preconditions:
          - "offer.status == OFFERED"
          - "X-User-ID == offer.provider_id (a liaison may only withdraw its own offers)"
        side_effects:
          - "provider.held_bed_units -= 1; the bed-hold interval is released"
          - "when this was the last non-terminal offer of the round, Referral.status stays CHOICE_PENDING (a rebroadcast is required to continue)"
      - from: OFFERED
        to: EXPIRED
        trigger: "system: logical clock now >= offer.hold_expires_at; evaluated at the start of every request that reads or writes this BedOffer or its Referral"
        actor: system
        preconditions:
          - "offer.status == OFFERED"
          - "logical clock now >= offer.hold_expires_at"
        side_effects:
          - "provider.held_bed_units -= 1; the bed-hold interval is released"

  # --- AuthorizationRequest (cyclic: appeal rounds) ---
  - entity: AuthorizationRequest
    initial_state: SUBMITTED
    terminal_states: [EXPIRED]
    transitions:
      - from: SUBMITTED
        to: PENDED
        trigger: "POST /authorizations/{id}/decide with decision == PEND"
        actor: PayerRepresentative
        preconditions:
          - "authorization.status == SUBMITTED"
          - "X-User-ID == authorization.payer_id"
        side_effects:
          - "decided_at = logical clock now; approved_days stays null"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /authorizations/{id}/decide with decision == APPROVE"
        actor: PayerRepresentative
        preconditions:
          - "authorization.status IN {SUBMITTED, PENDED}"
          - "X-User-ID == authorization.payer_id"
        side_effects:
          - "approved_days = requested_days; decided_at = now; expires_at = now + payer.auth_expiry_days days"
          - "gross_projection_cents / volume_discount_pct / authorized_amount_cents computed by calculations.authorization_award"
          - "Episode.authorized_days_total += approved_days"
          - "every Barrier on the episode with barrier_code == INSURANCE_AUTH and status IN {OPEN, MITIGATING} → RESOLVED with clock_stop_at = now; Episode.avoidable_delay_hours and barrier_posture recomputed"
      - from: PENDED
        to: APPROVED
        trigger: "POST /authorizations/{id}/decide with decision == APPROVE"
        actor: PayerRepresentative
        preconditions:
          - "authorization.status == PENDED"
        side_effects:
          - "identical to the SUBMITTED → APPROVED row"
      - from: SUBMITTED
        to: PARTIALLY_APPROVED
        trigger: "POST /authorizations/{id}/decide with decision == PARTIAL and approved_days < requested_days"
        actor: PayerRepresentative
        preconditions:
          - "authorization.status IN {SUBMITTED, PENDED}"
          - "1 <= approved_days < requested_days"
        side_effects:
          - "same ledger and barrier side effects as APPROVED, using the smaller approved_days"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /authorizations/{id}/decide with decision == DENY"
        actor: PayerRepresentative
        preconditions:
          - "authorization.status IN {SUBMITTED, PENDED}"
        side_effects:
          - "approved_days = 0; denial_reason recorded; decided_at = now; expires_at stays null"
          - "cascade hop 2: a Barrier with barrier_code = INSURANCE_AUTH, severity = HIGH, delay_reason_code = AWAITING_AUTH, origin = AUTH_DENIAL_AUTO is created (clock_start_at = now); if such a barrier already exists in status RESOLVED it is reopened instead (reopen_count += 1)"
          - "cascade hop 3: Episode.barrier_posture recomputed to ACTIVE (or ESCALATED when the new barrier ages past ESCALATION_HOURS), and when Episode.case_status == READY_FOR_DISCHARGE the episode reverts to PLANNING"
          - "cascade hop 4: that revert cancels every CONFIRMED PATIENT_TRANSPORT LogisticsOrder with cancel_reason = READINESS_REVERTED, releasing each vehicle interval and debiting Episode.logistics_committed_cents"
      - from: PENDED
        to: DENIED
        trigger: "POST /authorizations/{id}/decide with decision == DENY"
        actor: PayerRepresentative
        preconditions:
          - "authorization.status == PENDED"
        side_effects:
          - "identical to the SUBMITTED → DENIED row"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /authorizations/{id}/appeal"
        actor: UtilizationReviewNurse | CaseManager
        preconditions:
          - "authorization.status == DENIED"
          - "authorization.appeal_round < MAX_APPEAL_ROUNDS"
        side_effects:
          - "appeal_round += 1; denial_reason = null; decided_at = null; approved_days = null"
          - "gross_projection_cents = 0, volume_discount_pct = 0.00, authorized_amount_cents = 0"
        note: "This is the cycle: SUBMITTED → DENIED → SUBMITTED repeats up to MAX_APPEAL_ROUNDS times."
      - from: APPROVED
        to: EXPIRED
        trigger: "system: logical clock now >= expires_at; evaluated at the start of every request that reads or writes this AuthorizationRequest or its Episode"
        actor: system
        preconditions:
          - "authorization.status IN {APPROVED, PARTIALLY_APPROVED}"
          - "logical clock now >= expires_at"
        side_effects:
          - "Episode.authorized_days_total -= approved_days (the conserved total returns to its pre-approval value)"
      - from: PARTIALLY_APPROVED
        to: EXPIRED
        trigger: "system: logical clock now >= expires_at"
        actor: system
        preconditions:
          - "logical clock now >= expires_at"
        side_effects:
          - "identical to the APPROVED → EXPIRED row"

  # --- LogisticsOrder (branching by order_type, with compensation) ---
  - entity: LogisticsOrder
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /logistics-orders/{id}/confirm"
        actor: DischargeCoordinator
        preconditions:
          - "order.status == REQUESTED"
          - "episode.case_status IN {PLANNING, READY_FOR_DISCHARGE}"
          - "PATIENT_TRANSPORT branch: vehicle.status == ACTIVE, and the buffered closed window [window_start - TURNAROUND_BUFFER_MINUTES, window_end + TURNAROUND_BUFFER_MINUTES] does not intersect the buffered window of any other CONFIRMED order on the same vehicle"
          - "DME_DELIVERY branch: supplier provider.status == ACTIVE and provider_type == DME_SUPPLIER; window_end must be <= the episode's needed_by of its PLACED referral when one exists"
        side_effects:
          - "status → CONFIRMED; Episode.logistics_committed_cents += cost_cents"
          - "PATIENT_TRANSPORT branch only: the buffered vehicle interval becomes occupied"
          - "Episode.version += 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /logistics-orders/{id}/cancel"
        actor: DischargeCoordinator | CaseManager
        preconditions:
          - "order.status == REQUESTED"
        side_effects:
          - "cancel_reason recorded; Episode.logistics_committed_cents unchanged (an unconfirmed order was never committed)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /logistics-orders/{id}/cancel, a readiness revert, a superseding PATIENT_TRANSPORT create, or an episode cancellation"
        actor: DischargeCoordinator | CaseManager | system
        preconditions:
          - "order.status == CONFIRMED"
        side_effects:
          - "cancel_reason recorded; Episode.logistics_committed_cents -= cost_cents (compensating action restores the conserved total exactly)"
          - "PATIENT_TRANSPORT branch only: the buffered vehicle interval is released and immediately reusable"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: POST /episodes/{id}/discharge"
        actor: system
        preconditions:
          - "order.status == CONFIRMED"
        side_effects:
          - "Episode.logistics_committed_cents unchanged (COMPLETED remains inside the committed set)"
          - "PATIENT_TRANSPORT branch only: the vehicle interval remains occupied for the historical window"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on parent `version`)
# =============================================================================
concurrency_rules:
  - rule_id: bed-offer-create-stale-referral
    parent_entity: Referral
    write_endpoint: "POST /referrals/{id}/offers"
    occ_field: "expected_referral_version"
    description: |
      Creating a BedOffer against a Referral whose version has advanced since the
      liaison last read it is rejected. The advance means the round the liaison is
      answering has already moved on — a competing offer opened the round
      (BROADCAST → CHOICE_PENDING), a choice was documented, or the case manager
      rebroadcast a new round — so the liaison's view of round_index and of the
      broadcast list is stale and the offer would legitimately attach to the wrong
      round.
    error_id: ERR_STALE_REFERRAL_VERSION
    http_status: 412

  - rule_id: transport-order-create-stale-episode
    parent_entity: Episode
    write_endpoint: "POST /episodes/{id}/logistics-orders"
    occ_field: "expected_episode_version"
    description: |
      Creating a LogisticsOrder against an Episode whose version has advanced since
      the case manager last read it is rejected. A PATIENT_TRANSPORT create
      legitimately supersedes any prior PATIENT_TRANSPORT order in {REQUESTED,
      CONFIRMED} on the same episode, so the write is destructive to state the
      caller may not have seen; the version check forces the caller to re-read the
      episode (including logistics_committed_cents and case_status) before
      superseding.
    error_id: ERR_STALE_EPISODE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:

  - name: composite_readmission_risk_score
    trigger: "POST /screenings/{id}/submit (both variants) and POST /episodes/{id}/mark-ready (predischarge variant, recomputed from the episode's most recent SUBMITTED screening)"
    algorithm: weighted_scoring
    formula: |
      base = min(prior_admissions_snapshot, PRIOR_ADMIT_CAP) * PRIOR_ADMIT_POINTS
           + (10 - functional_score)      * FUNCTIONAL_WEIGHT
           + (10 - cognitive_score)       * COGNITIVE_WEIGHT
           + (10 - social_support_score)  * SOCIAL_WEIGHT
           + (LIVES_ALONE_POINTS if lives_alone_snapshot else 0)
           + (NO_PCP_POINTS      if has_pcp_snapshot == false else 0)
           + (POLYPHARMACY_POINTS if medication_count >= POLYPHARMACY_THRESHOLD else 0)

      # variant-specific terms
      ADMISSION_VARIANT:    adjust = 0
      PREDISCHARGE_VARIANT: adjust = min(Episode.barriers_ever_opened_count, BARRIER_HISTORY_CAP) * BARRIER_HISTORY_POINTS
                                   - (PLACEMENT_CREDIT_POINTS if the episode has a Referral with status == PLACED
                                      whose requested_level_of_care IN {SNF, IRF, LTACH} else 0)

      composite_risk_score = clamp(base + adjust, 0, 100)   # integer arithmetic throughout, no rounding

      risk_band = VERY_HIGH if composite_risk_score >= 70
                  else HIGH      if composite_risk_score >= 50
                  else MODERATE  if composite_risk_score >= 30
                  else LOW
    input_set: |
      The four snapshot fields (prior_admissions_snapshot, lives_alone_snapshot, has_pcp_snapshot, and the
      three 0..10 scores plus medication_count) are frozen on the RiskScreening at CREATE time, so later
      edits to the Patient row never change an already-created screening. barriers_ever_opened_count counts
      every Barrier row on the episode, all statuses (WAIVED included); reopens do not double-count.
    constants:
      PRIOR_ADMIT_CAP: 4
      PRIOR_ADMIT_POINTS: 8
      FUNCTIONAL_WEIGHT: 3
      COGNITIVE_WEIGHT: 2
      SOCIAL_WEIGHT: 2
      LIVES_ALONE_POINTS: 6
      NO_PCP_POINTS: 5
      POLYPHARMACY_THRESHOLD: 10
      POLYPHARMACY_POINTS: 7
      BARRIER_HISTORY_CAP: 5
      BARRIER_HISTORY_POINTS: 3
      PLACEMENT_CREDIT_POINTS: 12
    precision: "Integer points; no rounding anywhere; clamp applied last"
    variants:
      - name: ADMISSION_VARIANT
        when: "screening_type == ADMISSION, i.e. the screening submitted while the episode is still ADMITTED/SCREENED"
        difference: "adjust = 0 — barrier history is ignored and no placement credit is granted, because neither exists yet at admission"
      - name: PREDISCHARGE_VARIANT
        when: "screening_type == RESCREEN, and again as the mark-ready side effect"
        difference: "adjust adds up to 15 points of accumulated barrier history and subtracts a 12-point credit once an institutional placement is confirmed, so identical clinical scores yield a different score and often a different band"

  - name: screening_barrier_derivation
    trigger: "POST /screenings/{id}/submit — evaluated immediately after composite_readmission_risk_score"
    algorithm: constraint_propagation
    formula: |
      # Evaluated in this exact order; each rule creates at most one Barrier.
      S1: if risk_band IN {HIGH, VERY_HIGH} and has_pcp_snapshot == false
            -> Barrier(barrier_code = PHYSICIAN_ORDER, severity = MEDIUM,
                       delay_reason_code = AWAITING_PHYSICIAN, origin = SCREENING_AUTO)
      S2: if lives_alone_snapshot == true and functional_score <= 5
            -> Barrier(barrier_code = HOUSING, severity = HIGH,
                       delay_reason_code = AWAITING_FAMILY, origin = SCREENING_AUTO)
      Dedup: a rule is skipped when the episode already has a Barrier with the same barrier_code
             in status IN {OPEN, MITIGATING}.
      Every created Barrier gets clock_start_at = logical clock now and opened_by_user_id = "system";
      rows are created in rule order so created_at is strictly ascending S1 before S2.
    input_set: "Only the submitting screening's own snapshot fields and its freshly computed risk_band"
    constants: {}
    precision: "n/a"

  - name: barrier_posture_rollup
    trigger: "Recomputed at the start of every request that reads or writes an Episode or any of its Barriers"
    algorithm: aggregation
    formula: |
      open_set = { Barrier b : b.episode_id == episode.id and b.status IN {OPEN, MITIGATING} }
      if open_set is empty:                                          barrier_posture = CLEAR
      elif exists b in open_set with b.severity == CRITICAL
           or (logical_clock_now - b.clock_start_at) >= ESCALATION_HOURS hours:  barrier_posture = ESCALATED
      else:                                                          barrier_posture = ACTIVE
    input_set: "Barrier rows of this episode only; RESOLVED and WAIVED rows never participate"
    constants:
      ESCALATION_HOURS: 72
    precision: "Age comparison uses >= on whole hours computed from the logical clock, not >"

  - name: avoidable_delay_hours
    trigger: "Recomputed whenever a Barrier is created, changes status, or is reopened, and on every read of Episode or GET /episodes/{id}/throughput"
    algorithm: interval_merge
    formula: |
      intervals = []
      for each Barrier b with b.episode_id == episode.id:
          if b.delay_reason_code NOT IN AVOIDABLE_DELAY_CODES:  skip        # non-avoidable never counts
          if b.status == WAIVED:                                skip        # waiving erases the whole history of that row
          start = b.clock_start_at
          end   = b.clock_stop_at if b.clock_stop_at is not null else logical_clock_now
          if end <= start:  skip                                            # zero-length or inverted intervals contribute nothing
          intervals.append([start, end))                                    # half-open
      sort intervals by start ASC, then by end ASC        # deterministic; never by id
      merge: two intervals join when next.start <= current.end (adjacent, gap == 0, merges)
      total_minutes = sum of merged interval lengths in whole minutes
      avoidable_delay_hours = round_half_up(total_minutes / 60, 1)
    input_set: |
      Only the CURRENT interval of each barrier is modelled: clock_start_at is reset on every reopen, so a
      reopened barrier contributes only its newest interval. A barrier reopened and re-resolved at the same
      logical instant contributes a zero-length interval and is skipped, leaving the union unchanged.
    constants:
      AVOIDABLE_DELAY_CODES: "[AWAITING_BED, AWAITING_AUTH, AWAITING_DME, AWAITING_TRANSPORT, AWAITING_FAMILY, AWAITING_PHYSICIAN]"
      NON_AVOIDABLE_DELAY_CODES: "[CLINICAL_INSTABILITY, PATIENT_REFUSAL]"
    precision: "One decimal place, round_half_up, applied once at the very end after the union is summed in minutes"

  - name: placement_cost_projection
    trigger: "POST /referrals/{id}/offers (at BedOffer creation) and recomputed on every read of the BedOffer or its Referral"
    algorithm: tiered_pricing
    formula: |
      contract = the NetworkContract with payer_id == episode's patient's primary_payer_id
                 and provider_id == offer.provider_id   (at most one such row exists; uniqueness is enforced)

      if contract exists and contract.in_network == true:
          rate_variant_applied = NETWORK_RATE
          raw_daily = contract.negotiated_daily_rate_cents
      else:
          rate_variant_applied = BILLED_RATE
          raw_daily = round_half_up(offer.daily_rate_cents * OUT_OF_NETWORK_MULTIPLIER)

      covered_days = referral.projected_stay_days

      # PINNED ROUNDING ORDER: round EACH day's rate to whole cents first, THEN sum.
      # (Summing first and rounding once is explicitly WRONG and yields a different total.)
      projected_gross_cents = 0
      for d in 1 .. covered_days:
          day_rate = raw_daily if d <= TIER1_DAYS
                     else round_half_up(raw_daily * TIER2_RATE_PCT)
          projected_gross_cents += day_rate

      projected_patient_share_cents = round_half_up(projected_gross_cents * payer.coinsurance_pct)
      projected_plan_share_cents    = projected_gross_cents - projected_patient_share_cents
    input_set: "One BedOffer, its referral's projected_stay_days, the episode's payer, and the single (payer, provider) NetworkContract row when one exists"
    constants:
      OUT_OF_NETWORK_MULTIPLIER: 1.25
      TIER1_DAYS: 20
      TIER2_RATE_PCT: 0.85
    precision: "Whole cents, round_half_up, applied per-day and then once more on the coinsurance share"
    variants:
      - name: NETWORK_RATE
        when: "a NetworkContract row exists for (payer, provider) with in_network == true"
        difference: "raw_daily is the contracted per-diem and the out-of-network multiplier is never applied"
      - name: BILLED_RATE
        when: "no contract row exists, or the row has in_network == false"
        difference: "raw_daily = round_half_up(offer.daily_rate_cents * 1.25); the same offer therefore projects a materially larger gross, patient share, and plan share"

  - name: authorization_award
    trigger: "POST /authorizations/{id}/decide with decision IN {APPROVE, PARTIAL}; reset to zeros by POST /authorizations/{id}/appeal"
    algorithm: threshold
    formula: |
      contract = the NetworkContract for (authorization.payer_id, authorization.provider_id)
      if contract exists and contract.in_network == true:
          rate_variant_applied = NETWORK_RATE
          raw_daily = contract.negotiated_daily_rate_cents
      else:
          rate_variant_applied = BILLED_RATE
          raw_daily = round_half_up(authorization.billed_daily_rate_cents * OUT_OF_NETWORK_MULTIPLIER)

      # Step 1 (must run first): flat pre-discount gross. No day tiering here — the
      # tiering lives in placement_cost_projection, not in the award.
      gross_projection_cents = raw_daily * approved_days

      # Step 2: the discount tier is keyed on the PRE-DISCOUNT gross from step 1.
      # It is NOT re-keyed on authorized_amount_cents, even though that value is what
      # the payer ultimately owes — the dependency looks circular and the order is
      # pinned here to make it well-defined.
      volume_discount_pct = 0.05 if gross_projection_cents >= VOLUME_TIER2_CENTS
                            else 0.03 if gross_projection_cents >= VOLUME_TIER1_CENTS
                            else 0.00

      # Step 3
      authorized_amount_cents = gross_projection_cents
                              - round_half_up(gross_projection_cents * volume_discount_pct)
    input_set: "A single decided AuthorizationRequest, its payer, its provider, and the at-most-one matching NetworkContract"
    constants:
      OUT_OF_NETWORK_MULTIPLIER: 1.25
      VOLUME_TIER1_CENTS: 500000
      VOLUME_TIER2_CENTS: 1500000
    precision: "Whole cents, round_half_up on the discount only; tier comparison uses >= (500000 exactly is already tier 1)"

  - name: bed_offer_rank_score
    trigger: "Recomputed on every read of a BedOffer or of its Referral; drives Referral.recommended_bed_offer_id"
    algorithm: weighted_scoring
    formula: |
      in_network = a NetworkContract exists for (episode's payer, offer.provider_id) with in_network == true

      rank_score = provider.quality_star_rating * STAR_WEIGHT
                 + (IN_NETWORK_BONUS if in_network else 0)
                 + max(0, PROXIMITY_BASE - provider.distance_miles_from_hospital)
                 - floor(offer.daily_rate_cents / COST_PENALTY_DIVISOR)

      # Selector for Referral.recommended_bed_offer_id
      eligibility filter : offers o where o.referral_id == referral.id
                             AND o.round_index == referral.round_index
                             AND o.status == OFFERED
                             AND logical_clock_now < o.hold_expires_at
                             AND provider(o).status == ACTIVE
      ranking expression : rank_score DESC
      tie-break 1        : offer.daily_rate_cents ASC
      tie-break 2        : offer.created_at ASC      (never offer.id)
      empty-set fallback : recommended_bed_offer_id = null; no error is raised on read
    input_set: "Only offers of the referral's CURRENT round; superseded rounds never participate"
    constants:
      STAR_WEIGHT: 10
      IN_NETWORK_BONUS: 25
      PROXIMITY_BASE: 20
      COST_PENALTY_DIVISOR: 5000
    precision: "Integer points; floor() on the cost penalty; no rounding"

  - name: readmission_bundle_requirement
    trigger: "Recomputed on every read or write of an Episode; gates POST /episodes/{id}/mark-ready"
    algorithm: threshold
    formula: |
      required_flags(current_risk_band) =
          LOW       -> {}
          MODERATE  -> { pcp_followup_booked }
          HIGH      -> { pcp_followup_booked, med_reconciliation_completed }
          VERY_HIGH -> { pcp_followup_booked, med_reconciliation_completed,
                         tcm_call_scheduled, home_monitoring_enrolled }
      readmission_bundle_complete = every flag in required_flags is true
      (LOW is vacuously complete, so an empty required set yields true)
    input_set: "The four intervention booleans on the Episode and current_risk_band at evaluation time"
    constants: {}
    precision: "Boolean"

  - name: logistics_cost
    trigger: "POST /episodes/{id}/logistics-orders — computed once at create and never re-derived, so later vehicle rate edits do not disturb the committed ledger"
    algorithm: aggregation
    formula: |
      PATIENT_TRANSPORT: cost_cents = vehicle.base_rate_cents + vehicle.per_mile_cents * mileage_miles
      DME_DELIVERY:      cost_cents = DME_ITEM_RATE_CENTS[item_code]
    input_set: "A single LogisticsOrder plus, for transport, its vehicle row as of create time"
    constants:
      DME_ITEM_RATE_CENTS: "{ HOSPITAL_BED: 45000, OXYGEN_CONCENTRATOR: 32000, WHEELCHAIR: 21000, WALKER: 8000, CPAP: 27000 }"
    precision: "Whole cents, exact integer arithmetic, no rounding"

  - name: episode_throughput_metrics
    trigger: "POST /episodes/{id}/mark-ready, POST /episodes/{id}/discharge, and GET /episodes/{id}/throughput"
    algorithm: projection
    formula: |
      # PINNED EVALUATION ORDER — the steps look mutually dependent (the band feeds
      # expected_los_hours, while barrier history feeds the band, and barriers also feed
      # the delay union), so the order below is normative.
      1. current_risk_score / current_risk_band := composite_readmission_risk_score,
         PREDISCHARGE_VARIANT once the episode has ever reached READY_FOR_DISCHARGE,
         otherwise the variant of the most recent SUBMITTED screening.
      2. avoidable_delay_hours := calculations.avoidable_delay_hours
      3. los_hours          := round_half_up(((discharged_at or logical_clock_now) - admitted_at) in minutes / 60, 1)
      4. adjusted_los_hours := max(0.0, round_half_up(los_hours - avoidable_delay_hours, 1))
      5. expected_los_hours := round_half_up(drg_gmlos_days * 24 * ACUITY_MULTIPLIER[band from step 1], 1)
      6. observed_expected_ratio := round_half_up(adjusted_los_hours / expected_los_hours, 3)
      7. throughput_grade := EXEMPLARY    if observed_expected_ratio <= 0.900
                             ON_TARGET    if observed_expected_ratio <= 1.050
                             ABOVE_TARGET if observed_expected_ratio <= 1.250
                             OUTLIER      otherwise
    input_set: "One Episode and all of its Barrier rows; no cross-episode data participates"
    constants:
      ACUITY_MULTIPLIER: "{ LOW: 0.90, MODERATE: 1.00, HIGH: 1.15, VERY_HIGH: 1.30 }"
    precision: "One decimal on hour quantities, three decimals on the ratio, round_half_up at each numbered step"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority; lower number = checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in Table 5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles, X-User-ID equals the id of the entity the operation acts on behalf of: PostAcuteLiaison's X-User-ID must equal the offering / withdrawing provider_id; PayerRepresentative's X-User-ID must equal authorization.payer_id"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /referrals/{id}/offers, POST /offers/{id}/withdraw, POST /authorizations/{id}/decide"

  - priority: 4
    category: existence
    check: "Every resource named in the URL path exists, validated left to right"
    error_id: "ERR_EPISODE_NOT_FOUND | ERR_SCREENING_NOT_FOUND | ERR_BARRIER_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_BED_OFFER_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_LOGISTICS_ORDER_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_PAYER_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_NETWORK_CONTRACT_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "Request body is well formed: required fields present, enums are declared members, integers within their declared ranges (0..10 scores, star rating 1..5, coinsurance_pct 0.000..0.500, positive rates and day counts), pagination limit within 1..100"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: "Every resource id referenced in the request BODY exists (patient_id, primary_payer_id, provider_id, vehicle_id, supplier_provider_id, destination_provider_id, chosen_bed_offer_id, every member of provider_ids)"
    error_id: "ERR_PATIENT_NOT_FOUND | ERR_PAYER_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_BED_OFFER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints whose input carries a foreign key"

  - priority: 7
    category: business_constraint
    check: "Patient.mrn is unique across all Patient rows"
    error_id: ERR_DUPLICATE_MRN
    http_status: 409
    applies_to: "POST /patients"

  - priority: 8
    category: business_constraint
    check: "At most one NetworkContract row may exist for a given (payer_id, provider_id) pair"
    error_id: ERR_DUPLICATE_NETWORK_CONTRACT
    http_status: 409
    applies_to: "POST /network-contracts"

  - priority: 10
    category: state
    check: "The OCC guard field matches the parent's current version: expected_referral_version == referral.version, expected_episode_version == episode.version"
    error_id: "ERR_STALE_REFERRAL_VERSION | ERR_STALE_EPISODE_VERSION"
    http_status: 412
    applies_to: "POST /referrals/{id}/offers, POST /episodes/{id}/logistics-orders"

  - priority: 20
    category: state
    check: "The target resource is in a state from which the requested transition is declared in Table 2"
    error_id: "ERR_INVALID_EPISODE_STATE | ERR_INVALID_SCREENING_STATE | ERR_INVALID_BARRIER_STATE | ERR_INVALID_REFERRAL_STATE | ERR_INVALID_OFFER_STATE | ERR_INVALID_AUTHORIZATION_STATE | ERR_INVALID_LOGISTICS_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 21
    category: state
    check: "A BedOffer whose hold_expires_at has been reached is no longer choosable; the lazy OFFERED → EXPIRED sweep runs before the state check and the offer then reads as EXPIRED"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /referrals/{id}/document-choice, POST /offers/{id}/withdraw"

  - priority: 22
    category: state
    check: "Episode.barrier_posture must not be ESCALATED"
    error_id: ERR_ESCALATED_POSTURE
    http_status: 409
    applies_to: "POST /episodes/{id}/mark-ready, POST /episodes/{id}/discharge"

  - priority: 30
    category: business_safety
    check: "Four-eyes segregation of duties: the discharging DischargeCoordinator's X-User-ID must differ from episode.marked_ready_by_user_id, and the waiving UtilizationReviewNurse's X-User-ID must differ from barrier.opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /episodes/{id}/discharge, POST /barriers/{id}/status with to_status == WAIVED"

  - priority: 31
    category: business_safety
    check: "A barrier may only be WAIVED by a UtilizationReviewNurse; a CaseManager attempting to_status == WAIVED is refused even though the endpoint admits the role for other transitions"
    error_id: ERR_WAIVER_ROLE_REQUIRED
    http_status: 403
    applies_to: "POST /barriers/{id}/status"

  - priority: 32
    category: business_safety
    check: "patient_choice_attested must be true in the document-choice body — the compliance attestation is unconditional and is checked before any coverage or cost consideration"
    error_id: ERR_CHOICE_NOT_ATTESTED
    http_status: 422
    applies_to: "POST /referrals/{id}/document-choice"

  - priority: 33
    category: business_safety
    check: "Referral fairness / no-steering: the broadcast provider_ids must contain every ACTIVE provider whose provider_type equals requested_level_of_care and which has an in_network NetworkContract with the episode's payer"
    error_id: ERR_REFERRAL_FAIRNESS_VIOLATION
    http_status: 422
    applies_to: "POST /referrals/{id}/broadcast"

  - priority: 34
    category: business_safety
    check: "Patient choice must be presented from a pool of at least MIN_BROADCAST_PROVIDERS (3) distinct ACTIVE providers of the requested level of care; a pool of exactly 3 passes and a pool of 2 (or an empty pool) fails"
    error_id: ERR_INSUFFICIENT_PROVIDER_CHOICE
    http_status: 422
    applies_to: "POST /referrals/{id}/broadcast"

  - priority: 40
    category: business_referential
    check: "Type agreement across the graph: an offering provider's provider_type must equal referral.requested_level_of_care; AuthorizationRequest.level_of_care must equal its provider's provider_type; a DME_DELIVERY order's supplier provider_type must be DME_SUPPLIER"
    error_id: ERR_PROVIDER_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /referrals/{id}/offers, POST /episodes/{id}/authorizations, POST /episodes/{id}/logistics-orders"

  - priority: 41
    category: business_referential
    check: "A liaison may only answer a round it was invited to: offer.provider_id must be a member of referral.broadcast_provider_ids for the current round"
    error_id: ERR_PROVIDER_NOT_IN_BROADCAST
    http_status: 422
    applies_to: "POST /referrals/{id}/offers"

  - priority: 42
    category: business_referential
    check: "bed_unit_code must be a member of the offering provider's bed_unit_codes array"
    error_id: ERR_UNKNOWN_BED_UNIT
    http_status: 422
    applies_to: "POST /referrals/{id}/offers"

  - priority: 43
    category: business_referential
    check: "Polymorphic shape agreement on LogisticsOrder: PATIENT_TRANSPORT requires vehicle_id and mileage_miles and forbids supplier_provider_id and item_code; DME_DELIVERY requires supplier_provider_id and item_code and forbids vehicle_id and mileage_miles"
    error_id: ERR_ORDER_SHAPE_MISMATCH
    http_status: 422
    applies_to: "POST /episodes/{id}/logistics-orders"

  - priority: 44
    category: business_referential
    check: "When the episode has a Referral with status PLACED, a PATIENT_TRANSPORT order's destination_provider_id, if supplied, must equal that referral's chosen offer's provider_id"
    error_id: ERR_TRANSPORT_DESTINATION_MISMATCH
    http_status: 422
    applies_to: "POST /episodes/{id}/logistics-orders"

  - priority: 45
    category: business_referential
    check: "A resource referenced by an action must not be a SUSPENDED provider or an OUT_OF_SERVICE vehicle"
    error_id: ERR_RESOURCE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /referrals/{id}/broadcast, POST /referrals/{id}/offers, POST /logistics-orders/{id}/confirm"

  - priority: 50
    category: business_temporal
    check: "Interval well-formedness: BedOffer.hold_expires_at must be strictly after bed_available_from; LogisticsOrder.window_end must be strictly after window_start; Episode.admitted_at must be <= the logical clock; Referral.needed_by must be > the logical clock at create"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /referrals/{id}/offers, POST /episodes/{id}/logistics-orders, POST /episodes, POST /episodes/{id}/referrals"

  - priority: 51
    category: business_temporal
    check: "Bed-hold exclusivity, HALF-OPEN semantics: the new offer's [bed_available_from, hold_expires_at) must not intersect the interval of any other BedOffer on the same (provider_id, bed_unit_code) with status IN {OFFERED, ACCEPTED_BY_PATIENT}. Touching endpoints (prev.hold_expires_at == new.bed_available_from) do NOT intersect and are accepted"
    error_id: ERR_BED_HOLD_OVERLAP
    http_status: 409
    applies_to: "POST /referrals/{id}/offers"

  - priority: 52
    category: business_temporal
    check: "Vehicle exclusivity, CLOSED semantics with a symmetric buffer: the order's window expanded to [window_start - 45min, window_end + 45min] must not intersect the identically expanded window of any other CONFIRMED PATIENT_TRANSPORT order on the same vehicle. Because both ends are inclusive, sharing a single instant is a conflict"
    error_id: ERR_VEHICLE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /logistics-orders/{id}/confirm"

  - priority: 53
    category: business_temporal
    check: "A DME_DELIVERY window must end at or before the placed referral's needed_by when the episode has a PLACED Referral"
    error_id: ERR_DELIVERY_AFTER_NEEDED_BY
    http_status: 422
    applies_to: "POST /logistics-orders/{id}/confirm"

  - priority: 60
    category: business_constraint
    check: "Discharge readiness: no Barrier on the episode may be in status OPEN or MITIGATING"
    error_id: ERR_BARRIER_UNRESOLVED
    http_status: 422
    applies_to: "POST /episodes/{id}/mark-ready"

  - priority: 61
    category: business_constraint
    check: "The readmission-risk intervention bundle required for the episode's CURRENT band (the band in effect before the mark-ready predischarge rescore) must be complete"
    error_id: ERR_READMISSION_BUNDLE_INCOMPLETE
    http_status: 422
    applies_to: "POST /episodes/{id}/mark-ready"

  - priority: 62
    category: business_constraint
    check: "A disposition of SNF, IRF, LTACH, or HOME_WITH_HH requires a Referral on this episode with status PLACED"
    error_id: ERR_PLACEMENT_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /episodes/{id}/mark-ready"

  - priority: 63
    category: business_constraint
    check: "No LogisticsOrder on the episode may still be REQUESTED at discharge"
    error_id: ERR_LOGISTICS_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /episodes/{id}/discharge"

  - priority: 64
    category: business_constraint
    check: "appeal_round must be strictly less than MAX_APPEAL_ROUNDS (2) before a new appeal is accepted"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /authorizations/{id}/appeal"

  - priority: 65
    category: business_constraint
    check: "A rebroadcast requires every BedOffer of the current round to be in a terminal non-accepted status {DECLINED_BY_PATIENT, WITHDRAWN, EXPIRED}"
    error_id: ERR_ROUND_STILL_OPEN
    http_status: 422
    applies_to: "POST /referrals/{id}/broadcast"

  - priority: 70
    category: business_fiscal
    check: "When the episode's payer requires authorization for the chosen level of care (snf_auth_required for SNF/IRF/LTACH, hh_auth_required for HOME_HEALTH), an AuthorizationRequest for (episode, chosen provider) must be APPROVED or PARTIALLY_APPROVED and not past expires_at"
    error_id: ERR_AUTHORIZATION_REQUIRED
    http_status: 422
    applies_to: "POST /referrals/{id}/document-choice"

  - priority: 71
    category: business_fiscal
    check: "That authorization's approved_days must be >= referral.projected_stay_days"
    error_id: ERR_AUTHORIZATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /referrals/{id}/document-choice"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, expiry, hold window and delay clock in this system reads. Before the first call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Setting the clock never sweeps state by itself; lazy expiries (BedOffer holds, AuthorizationRequest expiries, Referral needed_by) are evaluated at the start of the next request that reads or writes the affected row."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock replaced; no rows are mutated"]

  # --- Payer ----------------------------------------------------------------
  - method: POST
    path: "/payers"
    description: "Register an insurance payer"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "coinsurance_pct", "snf_auth_required?", "hh_auth_required?", "auth_expiry_days?"]
    output: Payer
    side_effects: ["snf_auth_required and hh_auth_required default to true; auth_expiry_days defaults to 30"]

  - method: GET
    path: "/payers/{id}"
    description: "Read one payer"
    roles: [PlatformAdmin, CaseManager, UtilizationReviewNurse, PayerRepresentative]
    code: 200
    input: []
    output: Payer
    side_effects: []

  # --- Patient --------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [PlatformAdmin, CaseManager]
    code: 201
    input: [mrn, full_name, date_of_birth, primary_payer_id, prior_admissions_180d, lives_alone, has_pcp]
    output: Patient
    side_effects: ["mrn uniqueness enforced"]

  - method: GET
    path: "/patients/{id}"
    description: "Read one patient"
    roles: [PlatformAdmin, CaseManager, UtilizationReviewNurse]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients, ordered by created_at ASC; filterable by payer or MRN"
    roles: [PlatformAdmin, CaseManager, UtilizationReviewNurse]
    code: 200
    input: ["primary_payer_id?", "mrn?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # --- PostAcuteProvider ----------------------------------------------------
  - method: POST
    path: "/providers"
    description: "Register a post-acute provider or DME supplier"
    roles: [PlatformAdmin]
    code: 201
    input: [name, provider_type, quality_star_rating, distance_miles_from_hospital, bed_unit_codes]
    output: PostAcuteProvider
    side_effects: ["status = ACTIVE; all four counters and held_bed_units start at 0; acceptance_rate_pct starts at 0.0"]

  - method: GET
    path: "/providers/{id}"
    description: "Read one provider, including its live held_bed_units and referral-fairness counters"
    roles: [PlatformAdmin, CaseManager, UtilizationReviewNurse, PostAcuteLiaison, DischargeCoordinator]
    code: 200
    input: []
    output: PostAcuteProvider
    side_effects: ["lazy BedOffer hold expiry is swept for this provider before the response is built"]

  - method: GET
    path: "/providers"
    description: "List providers, ordered by created_at ASC; the candidate pool a case manager must broadcast to"
    roles: [PlatformAdmin, CaseManager, UtilizationReviewNurse]
    code: 200
    input: ["provider_type?", "status?", "limit?", "offset?"]
    output: PostAcuteProvider[]
    side_effects: []

  - method: POST
    path: "/providers/{id}/suspend"
    description: "Suspend a provider, removing it from every future referral candidate pool"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PostAcuteProvider
    side_effects: ["status → SUSPENDED; existing OFFERED bed holds are left untouched"]

  # --- NetworkContract ------------------------------------------------------
  - method: POST
    path: "/network-contracts"
    description: "Link a payer and a provider with a network status and a contracted per-diem"
    roles: [PlatformAdmin]
    code: 201
    input: [payer_id, provider_id, in_network, negotiated_daily_rate_cents]
    output: NetworkContract
    side_effects: ["at most one row per (payer_id, provider_id)"]

  - method: GET
    path: "/network-contracts/{id}"
    description: "Read one network contract"
    roles: [PlatformAdmin, CaseManager, PayerRepresentative]
    code: 200
    input: []
    output: NetworkContract
    side_effects: []

  - method: GET
    path: "/network-contracts"
    description: "List network contracts, ordered by created_at ASC"
    roles: [PlatformAdmin, CaseManager, PayerRepresentative]
    code: 200
    input: ["payer_id?", "provider_id?", "limit?", "offset?"]
    output: NetworkContract[]
    side_effects: []

  # --- TransportVehicle -----------------------------------------------------
  - method: POST
    path: "/vehicles"
    description: "Register a transport vehicle"
    roles: [PlatformAdmin]
    code: 201
    input: [operator_name, vehicle_type, base_rate_cents, per_mile_cents]
    output: TransportVehicle
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Read one transport vehicle"
    roles: [PlatformAdmin, DischargeCoordinator, CaseManager]
    code: 200
    input: []
    output: TransportVehicle
    side_effects: []

  - method: POST
    path: "/vehicles/{id}/out-of-service"
    description: "Take a vehicle out of service; already CONFIRMED orders keep their intervals but no new order may confirm against it"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TransportVehicle
    side_effects: ["status → OUT_OF_SERVICE"]

  # --- Episode --------------------------------------------------------------
  - method: POST
    path: "/episodes"
    description: "Open a case-management episode for an admitted patient"
    roles: [CaseManager]
    code: 201
    input: [patient_id, admission_type, drg_code, drg_gmlos_days, attending_unit, admitted_at]
    output: Episode
    side_effects:
      - "case_status = ADMITTED; barrier_posture = CLEAR; assigned_case_manager_id = X-User-ID"
      - "current_risk_score = 0, current_risk_band = LOW, risk_variant_applied = ADMISSION_VARIANT"
      - "logistics_committed_cents = 0; authorized_days_total = 0; all four bundle flags false"

  - method: GET
    path: "/episodes/{id}"
    description: "Read one episode with every derived field recomputed (posture, risk, delay union, throughput, ledgers)"
    roles: [CaseManager, UtilizationReviewNurse, DischargeCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Episode
    side_effects: ["lazy sweeps run first: BedOffer hold expiry, AuthorizationRequest expiry, Referral needed_by expiry"]

  - method: GET
    path: "/episodes"
    description: "List episodes, ordered by created_at ASC"
    roles: [CaseManager, UtilizationReviewNurse, PlatformAdmin]
    code: 200
    input: ["patient_id?", "case_status?", "limit?", "offset?"]
    output: Episode[]
    side_effects: []

  - method: POST
    path: "/episodes/{id}/readmission-bundle"
    description: "Record readmission-risk interventions. Any omitted flag keeps its stored value; supplying false clears a flag."
    roles: [CaseManager]
    code: 200
    input: ["pcp_followup_booked?", "med_reconciliation_completed?", "tcm_call_scheduled?", "home_monitoring_enrolled?"]
    output: Episode
    side_effects:
      - "the supplied flags are written; readmission_bundle_complete recomputed"
      - "case_status SCREENED → PLANNING when this is the episode's first planning artifact"
      - "increments Episode.version by 1"

  - method: POST
    path: "/episodes/{id}/mark-ready"
    description: "Declare the episode ready for discharge with a disposition"
    roles: [CaseManager]
    code: 200
    input: [discharge_disposition]
    output: Episode
    side_effects:
      - "case_status → READY_FOR_DISCHARGE; marked_ready_by_user_id = X-User-ID; marked_ready_at = clock now"
      - "predischarge rescore runs AFTER all preconditions pass; risk_variant_applied → PREDISCHARGE_VARIANT"
      - "throughput fields recomputed; increments Episode.version by 1"

  - method: POST
    path: "/episodes/{id}/revert-to-planning"
    description: "Send a ready episode back to planning, or cancel the case outright. reason_code maps to an auto-barrier: CLINICAL_DETERIORATION → (PHYSICIAN_ORDER, CLINICAL_INSTABILITY); AUTH_LOST → (INSURANCE_AUTH, AWAITING_AUTH); TRANSPORT_FAILED → (TRANSPORT, AWAITING_TRANSPORT); FAMILY_WITHDREW → (FAMILY_DECISION, AWAITING_FAMILY). reason_code PATIENT_LEFT_AMA instead cancels the episode from ADMITTED, SCREENED, PLANNING or READY_FOR_DISCHARGE."
    roles: [CaseManager, UtilizationReviewNurse]
    code: 200
    input: [reason_code]
    output: Episode
    side_effects:
      - "case_status → PLANNING (or CANCELLED for PATIENT_LEFT_AMA); marked_ready_by_user_id and marked_ready_at cleared"
      - "auto-Barrier created with severity HIGH and origin REVERT_AUTO (not for PATIENT_LEFT_AMA)"
      - "every CONFIRMED PATIENT_TRANSPORT order → CANCELLED (READINESS_REVERTED), releasing its vehicle interval and debiting logistics_committed_cents"
      - "increments Episode.version by 1"

  - method: POST
    path: "/episodes/{id}/discharge"
    description: "Discharge a ready episode; requires a different operator than the one who marked it ready"
    roles: [DischargeCoordinator]
    code: 200
    input: []
    output: Episode
    side_effects:
      - "case_status → DISCHARGED; discharged_at = clock now"
      - "CONFIRMED logistics orders → COMPLETED; OFFERED bed offers → EXPIRED (releasing held_bed_units)"
      - "throughput fields finalized; increments Episode.version by 1"

  - method: GET
    path: "/episodes/{id}/throughput"
    description: "Length-of-stay and throughput report for one episode, computed by calculations.episode_throughput_metrics in its pinned step order"
    roles: [PlatformAdmin, CaseManager, UtilizationReviewNurse]
    code: 200
    input: []
    output: { los_hours: number, avoidable_delay_hours: number, adjusted_los_hours: number, expected_los_hours: number, observed_expected_ratio: number, throughput_grade: string, current_risk_score: integer, current_risk_band: string, barriers_ever_opened_count: integer }
    side_effects: []

  # --- RiskScreening --------------------------------------------------------
  - method: POST
    path: "/episodes/{id}/screenings"
    description: "Create a DRAFT risk screening; the patient's prior_admissions_180d, lives_alone and has_pcp are snapshotted now"
    roles: [CaseManager]
    code: 201
    input: [screening_type, functional_score, cognitive_score, social_support_score, medication_count]
    output: RiskScreening
    side_effects: ["status = DRAFT; composite_risk_score = 0; risk_band = LOW; snapshots copied from the patient"]

  - method: POST
    path: "/screenings/{id}/submit"
    description: "Submit a draft screening, scoring it and deriving barriers"
    roles: [CaseManager]
    code: 200
    input: []
    output: RiskScreening
    side_effects:
      - "status → SUBMITTED; composite_risk_score and risk_band computed; prior SUBMITTED screening → SUPERSEDED"
      - "Episode risk fields adopt this screening; auto-barriers created per calculations.screening_barrier_derivation"
      - "Episode case_status ADMITTED → SCREENED when screening_type == ADMISSION; barrier_posture and readmission_bundle_complete recomputed"

  - method: GET
    path: "/episodes/{id}/screenings"
    description: "List an episode's screenings, ordered by created_at ASC"
    roles: [CaseManager, UtilizationReviewNurse, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RiskScreening[]
    side_effects: []

  # --- Barrier --------------------------------------------------------------
  - method: POST
    path: "/episodes/{id}/barriers"
    description: "Record a discharge barrier with its delay reason code"
    roles: [CaseManager, UtilizationReviewNurse]
    code: 201
    input: [barrier_code, severity, delay_reason_code]
    output: Barrier
    side_effects:
      - "status = OPEN; clock_start_at = clock now; opened_by_user_id = X-User-ID; origin = MANUAL"
      - "avoidable derived from delay_reason_code; Episode.barrier_posture recomputed"
      - "case_status SCREENED → PLANNING is NOT triggered by a barrier (barriers are not planning artifacts)"

  - method: POST
    path: "/barriers/{id}/status"
    description: "Move a barrier along OPEN → MITIGATING → RESOLVED, reopen it (RESOLVED → OPEN), or waive it. to_status ∈ {OPEN, MITIGATING, RESOLVED, WAIVED}."
    roles: [CaseManager, UtilizationReviewNurse]
    code: 200
    input: ["to_status", "note?"]
    output: Barrier
    side_effects:
      - "RESOLVED / WAIVED set clock_stop_at = clock now; OPEN (reopen) sets clock_start_at = clock now, clock_stop_at = null, reopen_count += 1"
      - "Episode.avoidable_delay_hours and Episode.barrier_posture recomputed"
      - "a reopen on a READY_FOR_DISCHARGE episode cascades a revert to PLANNING"

  - method: GET
    path: "/episodes/{id}/barriers"
    description: "List an episode's barriers, ordered by created_at ASC"
    roles: [CaseManager, UtilizationReviewNurse, PlatformAdmin, DischargeCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Barrier[]
    side_effects: []

  # --- Referral / BedOffer --------------------------------------------------
  - method: POST
    path: "/episodes/{id}/referrals"
    description: "Open a post-acute placement search"
    roles: [CaseManager]
    code: 201
    input: [requested_level_of_care, projected_stay_days, needed_by]
    output: Referral
    side_effects: ["status = DRAFT; round_index = 0; broadcast_provider_ids = []; case_status SCREENED → PLANNING"]

  - method: POST
    path: "/referrals/{id}/broadcast"
    description: "Broadcast the referral to a slate of providers, opening round_index + 1. Enforces the no-steering fairness rule and the three-provider choice minimum."
    roles: [CaseManager]
    code: 200
    input: [provider_ids]
    output: Referral
    side_effects:
      - "round_index += 1; broadcast_provider_ids replaced; each listed provider's offers_received_count += 1"
      - "status → BROADCAST; increments Referral.version by 1"

  - method: POST
    path: "/referrals/{id}/offers"
    description: "A post-acute liaison answers the current round with a bed offer and a half-open bed hold"
    roles: [PostAcuteLiaison]
    code: 201
    input: [expected_referral_version, bed_unit_code, bed_available_from, hold_expires_at, daily_rate_cents]
    output: BedOffer
    side_effects:
      - "status = OFFERED; round_index copied from the referral; provider.held_bed_units += 1; provider.offers_submitted_count += 1"
      - "cost projection computed by calculations.placement_cost_projection"
      - "Referral BROADCAST → CHOICE_PENDING on the round's first offer"
      - "increments Referral.version by 1"

  - method: POST
    path: "/offers/{id}/withdraw"
    description: "A liaison retracts its own outstanding offer, releasing the bed hold"
    roles: [PostAcuteLiaison]
    code: 200
    input: []
    output: BedOffer
    side_effects: ["status → WITHDRAWN; provider.held_bed_units -= 1; the hold interval becomes reusable"]

  - method: POST
    path: "/referrals/{id}/document-choice"
    description: "Document the patient's placement choice. Any OFFERED offer of the current round may be chosen — the advisory recommended_bed_offer_id never constrains the choice, only choice_basis records why."
    roles: [CaseManager]
    code: 200
    input: [chosen_bed_offer_id, patient_choice_attested, choice_basis]
    output: Referral
    side_effects:
      - "chosen offer → ACCEPTED_BY_PATIENT; sibling OFFERED offers of the round → DECLINED_BY_PATIENT (releasing their holds)"
      - "Referral → PLACED; BED_AVAILABILITY barriers RESOLVED; Episode delay union and posture recomputed"
      - "increments Referral.version by 1"

  - method: GET
    path: "/referrals/{id}"
    description: "Read one referral, including the freshly ranked recommended_bed_offer_id"
    roles: [CaseManager, UtilizationReviewNurse, PlatformAdmin, PostAcuteLiaison]
    code: 200
    input: []
    output: Referral
    side_effects: ["lazy BedOffer hold expiry and Referral needed_by expiry are swept first"]

  - method: GET
    path: "/referrals"
    description: "List referrals, ordered by created_at ASC"
    roles: [CaseManager, UtilizationReviewNurse, PlatformAdmin]
    code: 200
    input: ["episode_id?", "chosen_bed_offer_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/offers/{id}"
    description: "Read one bed offer with its rank score and cost projection"
    roles: [CaseManager, UtilizationReviewNurse, PlatformAdmin, PostAcuteLiaison]
    code: 200
    input: []
    output: BedOffer
    side_effects: ["lazy hold expiry is swept first"]

  - method: GET
    path: "/offers"
    description: "List bed offers, ordered by created_at ASC"
    roles: [CaseManager, UtilizationReviewNurse, PlatformAdmin, PostAcuteLiaison]
    code: 200
    input: ["referral_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: BedOffer[]
    side_effects: []

  # --- AuthorizationRequest -------------------------------------------------
  - method: POST
    path: "/episodes/{id}/authorizations"
    description: "Submit an insurance authorization request for SNF / home-health days; payer_id is derived from the episode's patient"
    roles: [CaseManager]
    code: 201
    input: [provider_id, level_of_care, requested_days, billed_daily_rate_cents]
    output: AuthorizationRequest
    side_effects: ["status = SUBMITTED; appeal_round = 0; payer_id copied from the patient; case_status SCREENED → PLANNING"]

  - method: POST
    path: "/authorizations/{id}/decide"
    description: "The payer pends, approves, partially approves, or denies. decision ∈ {PEND, APPROVE, PARTIAL, DENY}; approved_days is required for PARTIAL and forbidden otherwise; denial_reason is required for DENY and forbidden otherwise."
    roles: [PayerRepresentative]
    code: 200
    input: ["decision", "approved_days?", "denial_reason?"]
    output: AuthorizationRequest
    side_effects:
      - "APPROVE / PARTIAL: approved_days set, expires_at = now + payer.auth_expiry_days days, award computed, Episode.authorized_days_total credited, INSURANCE_AUTH barriers resolved"
      - "DENY: approved_days = 0 and the four-hop denial cascade fires (auto INSURANCE_AUTH barrier → posture → readiness revert → transport cancellation)"

  - method: POST
    path: "/authorizations/{id}/appeal"
    description: "File an appeal on a denied authorization, returning it to SUBMITTED"
    roles: [UtilizationReviewNurse, CaseManager]
    code: 200
    input: [appeal_note]
    output: AuthorizationRequest
    side_effects: ["appeal_round += 1; status → SUBMITTED; award fields reset to zero; approved_days = null"]

  - method: GET
    path: "/authorizations/{id}"
    description: "Read one authorization request with its award figures"
    roles: [CaseManager, UtilizationReviewNurse, PlatformAdmin, PayerRepresentative]
    code: 200
    input: []
    output: AuthorizationRequest
    side_effects: ["lazy expiry sweep runs first"]

  - method: GET
    path: "/authorizations"
    description: "List authorization requests, ordered by created_at ASC"
    roles: [CaseManager, UtilizationReviewNurse, PlatformAdmin, PayerRepresentative]
    code: 200
    input: ["episode_id?", "payer_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: AuthorizationRequest[]
    side_effects: []

  # --- LogisticsOrder -------------------------------------------------------
  - method: POST
    path: "/episodes/{id}/logistics-orders"
    description: "Arrange durable medical equipment delivery or patient transport. A PATIENT_TRANSPORT create supersedes any prior PATIENT_TRANSPORT order in {REQUESTED, CONFIRMED} on the episode, cancelling it with cancel_reason = SUPERSEDED."
    roles: [CaseManager]
    code: 201
    input: ["expected_episode_version", "order_type", "window_start", "window_end", "vehicle_id?", "supplier_provider_id?", "destination_provider_id?", "item_code?", "mileage_miles?"]
    output: LogisticsOrder
    side_effects:
      - "status = REQUESTED; cost_cents fixed by calculations.logistics_cost"
      - "a superseded prior transport order → CANCELLED (SUPERSEDED), releasing its vehicle interval and debiting logistics_committed_cents when it was CONFIRMED"
      - "case_status SCREENED → PLANNING; increments Episode.version by 1"

  - method: POST
    path: "/logistics-orders/{id}/confirm"
    description: "Confirm an order, committing its cost and (for transport) occupying the buffered vehicle window"
    roles: [DischargeCoordinator]
    code: 200
    input: []
    output: LogisticsOrder
    side_effects: ["status → CONFIRMED; Episode.logistics_committed_cents += cost_cents; increments Episode.version by 1"]

  - method: POST
    path: "/logistics-orders/{id}/cancel"
    description: "Cancel an order. reason_code ∈ {USER_REQUEST, CLINICAL_CHANGE, VEHICLE_UNAVAILABLE}; SUPERSEDED and READINESS_REVERTED are system-only."
    roles: [DischargeCoordinator, CaseManager]
    code: 200
    input: [reason_code]
    output: LogisticsOrder
    side_effects: ["status → CANCELLED; a CONFIRMED order debits Episode.logistics_committed_cents by cost_cents and releases its vehicle interval"]

  - method: GET
    path: "/logistics-orders/{id}"
    description: "Read one logistics order"
    roles: [CaseManager, DischargeCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: LogisticsOrder
    side_effects: []

  - method: GET
    path: "/logistics-orders"
    description: "List logistics orders, ordered by created_at ASC"
    roles: [CaseManager, DischargeCoordinator, PlatformAdmin]
    code: 200
    input: ["episode_id?", "vehicle_id?", "supplier_provider_id?", "destination_provider_id?", "status?", "limit?", "offset?"]
    output: LogisticsOrder[]
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,           http: 401, condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE,            http: 403, condition: "The acting role is not listed for the endpoint in Table 5" }
  - { id: ERR_NOT_OWNER,                 http: 403, condition: "A PostAcuteLiaison acts on an offer whose provider_id is not its X-User-ID, or a PayerRepresentative decides an authorization whose payer_id is not its X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES,     http: 403, condition: "Discharge attempted by the same operator that marked the episode ready, or a barrier waived by the operator that opened it" }
  - { id: ERR_WAIVER_ROLE_REQUIRED,      http: 403, condition: "to_status == WAIVED requested by a role other than UtilizationReviewNurse" }
  - { id: ERR_VALIDATION,                http: 400, condition: "Malformed body: missing required field, unknown enum member, out-of-range integer, or pagination limit outside 1..100" }
  - { id: ERR_PAYER_NOT_FOUND,           http: 404, condition: "payer id in path or body does not resolve" }
  - { id: ERR_PATIENT_NOT_FOUND,         http: 404, condition: "patient id in path or body does not resolve" }
  - { id: ERR_EPISODE_NOT_FOUND,         http: 404, condition: "episode id in path does not resolve" }
  - { id: ERR_SCREENING_NOT_FOUND,       http: 404, condition: "screening id in path does not resolve" }
  - { id: ERR_BARRIER_NOT_FOUND,         http: 404, condition: "barrier id in path does not resolve" }
  - { id: ERR_PROVIDER_NOT_FOUND,        http: 404, condition: "provider id in path or body (including a member of provider_ids) does not resolve" }
  - { id: ERR_NETWORK_CONTRACT_NOT_FOUND, http: 404, condition: "network contract id in path does not resolve" }
  - { id: ERR_REFERRAL_NOT_FOUND,        http: 404, condition: "referral id in path does not resolve" }
  - { id: ERR_BED_OFFER_NOT_FOUND,       http: 404, condition: "bed offer id in path or chosen_bed_offer_id does not resolve, or the offer belongs to a different referral" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND,   http: 404, condition: "authorization id in path does not resolve" }
  - { id: ERR_VEHICLE_NOT_FOUND,         http: 404, condition: "vehicle id in path or body does not resolve" }
  - { id: ERR_LOGISTICS_ORDER_NOT_FOUND, http: 404, condition: "logistics order id in path does not resolve" }
  - { id: ERR_DUPLICATE_MRN,             http: 409, condition: "A Patient with the same mrn already exists" }
  - { id: ERR_DUPLICATE_NETWORK_CONTRACT, http: 409, condition: "A NetworkContract already exists for the (payer_id, provider_id) pair" }
  - { id: ERR_STALE_REFERRAL_VERSION,    http: 412, condition: "expected_referral_version does not equal the referral's current version" }
  - { id: ERR_STALE_EPISODE_VERSION,     http: 412, condition: "expected_episode_version does not equal the episode's current version" }
  - { id: ERR_INVALID_EPISODE_STATE,     http: 409, condition: "The episode's case_status does not admit the requested transition" }
  - { id: ERR_INVALID_SCREENING_STATE,   http: 409, condition: "Submit attempted on a screening that is not DRAFT, or a second ADMISSION screening submitted while one is already SUBMITTED" }
  - { id: ERR_INVALID_BARRIER_STATE,     http: 409, condition: "The requested to_status is not reachable from the barrier's current status (WAIVED is terminal; RESOLVED → MITIGATING is undeclared)" }
  - { id: ERR_INVALID_REFERRAL_STATE,    http: 409, condition: "Broadcast or document-choice attempted from a referral status that does not admit it" }
  - { id: ERR_INVALID_OFFER_STATE,       http: 409, condition: "Withdraw or choice attempted on an offer that is no longer OFFERED" }
  - { id: ERR_INVALID_AUTHORIZATION_STATE, http: 409, condition: "Decide attempted on an authorization that is not SUBMITTED or PENDED, or appeal attempted on one that is not DENIED" }
  - { id: ERR_INVALID_LOGISTICS_STATE,   http: 409, condition: "Confirm or cancel attempted from a status that does not admit it" }
  - { id: ERR_OFFER_EXPIRED,             http: 409, condition: "The logical clock has reached the offer's hold_expires_at" }
  - { id: ERR_ESCALATED_POSTURE,         http: 409, condition: "Episode.barrier_posture is ESCALATED (a CRITICAL barrier, or one open for >= 72 hours)" }
  - { id: ERR_ROUND_STILL_OPEN,          http: 422, condition: "Rebroadcast attempted while an offer of the current round is still OFFERED or ACCEPTED_BY_PATIENT" }
  - { id: ERR_CHOICE_NOT_ATTESTED,       http: 422, condition: "patient_choice_attested is not true on document-choice" }
  - { id: ERR_REFERRAL_FAIRNESS_VIOLATION, http: 422, condition: "The broadcast slate omits an ACTIVE, in-network provider of the requested level of care" }
  - { id: ERR_INSUFFICIENT_PROVIDER_CHOICE, http: 422, condition: "Fewer than 3 distinct ACTIVE providers of the requested level of care are on the slate, including the empty-slate case" }
  - { id: ERR_PROVIDER_TYPE_MISMATCH,    http: 422, condition: "Provider type disagrees with the requested level of care, the authorization's level_of_care, or the DME_SUPPLIER requirement" }
  - { id: ERR_PROVIDER_NOT_IN_BROADCAST, http: 422, condition: "The offering provider is not a member of the referral's current broadcast_provider_ids" }
  - { id: ERR_UNKNOWN_BED_UNIT,          http: 422, condition: "bed_unit_code is not a member of the provider's bed_unit_codes" }
  - { id: ERR_ORDER_SHAPE_MISMATCH,      http: 422, condition: "The LogisticsOrder body does not match its order_type's required/forbidden field set" }
  - { id: ERR_TRANSPORT_DESTINATION_MISMATCH, http: 422, condition: "destination_provider_id differs from the placed referral's chosen provider" }
  - { id: ERR_RESOURCE_UNAVAILABLE,      http: 422, condition: "A SUSPENDED provider or an OUT_OF_SERVICE vehicle is referenced by the action" }
  - { id: ERR_INVALID_INTERVAL,          http: 422, condition: "An interval end is not strictly after its start, admitted_at is in the future, or needed_by is not after the logical clock" }
  - { id: ERR_BED_HOLD_OVERLAP,          http: 409, condition: "The half-open bed-hold interval intersects another live hold on the same (provider, bed_unit_code)" }
  - { id: ERR_VEHICLE_WINDOW_CONFLICT,   http: 409, condition: "The 45-minute-buffered closed transport window intersects another CONFIRMED order's buffered window on the same vehicle" }
  - { id: ERR_DELIVERY_AFTER_NEEDED_BY,  http: 422, condition: "A DME delivery window ends after the placed referral's needed_by" }
  - { id: ERR_BARRIER_UNRESOLVED,        http: 422, condition: "mark-ready attempted while a barrier is OPEN or MITIGATING" }
  - { id: ERR_READMISSION_BUNDLE_INCOMPLETE, http: 422, condition: "The interventions required by the episode's current risk band are not all recorded" }
  - { id: ERR_PLACEMENT_NOT_CONFIRMED,   http: 422, condition: "A post-acute disposition was requested without a PLACED referral" }
  - { id: ERR_LOGISTICS_NOT_CONFIRMED,   http: 422, condition: "Discharge attempted while a logistics order is still REQUESTED" }
  - { id: ERR_APPEAL_LIMIT_REACHED,      http: 422, condition: "appeal_round has already reached MAX_APPEAL_ROUNDS (2)" }
  - { id: ERR_AUTHORIZATION_REQUIRED,    http: 422, condition: "The payer requires authorization for this level of care and no live APPROVED / PARTIALLY_APPROVED request covers the chosen provider" }
  - { id: ERR_AUTHORIZATION_INSUFFICIENT, http: 422, condition: "approved_days is below the referral's projected_stay_days" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational registry owner. Seeds payers, patients, providers, network contracts and vehicles, drives the logical clock, and reads throughput reports. Holds no clinical authority: cannot screen, cannot place, cannot decide authorizations, cannot discharge."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /payers"
      - "POST /providers"
      - "POST /providers/{id}/suspend"
      - "POST /network-contracts"
      - "POST /vehicles"
      - "POST /vehicles/{id}/out-of-service"
    shared_operations:
      - "POST /patients (with CaseManager)"
      - "GET /payers/{id}, GET /patients, GET /patients/{id}, GET /providers, GET /providers/{id}"
      - "GET /network-contracts, GET /network-contracts/{id}, GET /vehicles/{id}"
      - "GET /episodes, GET /episodes/{id}, GET /episodes/{id}/throughput"
      - "GET /episodes/{id}/screenings, GET /episodes/{id}/barriers"
      - "GET /referrals, GET /referrals/{id}, GET /offers, GET /offers/{id}"
      - "GET /authorizations, GET /authorizations/{id}, GET /logistics-orders, GET /logistics-orders/{id}"

  - name: CaseManager
    description: "Owns the case from admission to readiness: screening, barrier identification, placement search, authorization submission, DME and transport arrangement, readmission-risk interventions, and the mark-ready declaration. Cannot waive a barrier, cannot decide an authorization, and cannot discharge."
    identity: opaque
    exclusive_operations:
      - "POST /episodes"
      - "POST /episodes/{id}/screenings"
      - "POST /screenings/{id}/submit"
      - "POST /episodes/{id}/referrals"
      - "POST /referrals/{id}/broadcast"
      - "POST /referrals/{id}/document-choice"
      - "POST /episodes/{id}/authorizations"
      - "POST /episodes/{id}/logistics-orders"
      - "POST /episodes/{id}/readmission-bundle"
      - "POST /episodes/{id}/mark-ready"
    shared_operations:
      - "POST /patients (with PlatformAdmin)"
      - "POST /episodes/{id}/barriers, POST /barriers/{id}/status (with UtilizationReviewNurse; WAIVED excluded)"
      - "POST /episodes/{id}/revert-to-planning (with UtilizationReviewNurse)"
      - "POST /authorizations/{id}/appeal (with UtilizationReviewNurse)"
      - "POST /logistics-orders/{id}/cancel (with DischargeCoordinator)"
      - "read access to episodes, screenings, barriers, referrals, offers, authorizations, logistics orders, providers, payers, patients, vehicles, network contracts, throughput"

  - name: UtilizationReviewNurse
    description: "Independent compliance reviewer. The only role that may WAIVE a barrier, and only on a barrier it did not open. Also files authorization appeals and can force a ready episode back to planning."
    identity: opaque
    exclusive_operations:
      - "POST /barriers/{id}/status with to_status == WAIVED"
    shared_operations:
      - "POST /episodes/{id}/barriers, POST /barriers/{id}/status (non-WAIVED, with CaseManager)"
      - "POST /episodes/{id}/revert-to-planning (with CaseManager)"
      - "POST /authorizations/{id}/appeal (with CaseManager)"
      - "read access to episodes, screenings, barriers, referrals, offers, authorizations, providers, payers, patients, throughput"

  - name: PayerRepresentative
    description: "Acts on behalf of exactly one Payer. Decides authorization requests belonging to that payer and nothing else."
    identity: "entity_backed:Payer"
    exclusive_operations:
      - "POST /authorizations/{id}/decide"
    shared_operations:
      - "GET /payers/{id}, GET /network-contracts, GET /network-contracts/{id}"
      - "GET /authorizations, GET /authorizations/{id}"

  - name: PostAcuteLiaison
    description: "Acts on behalf of exactly one PostAcuteProvider. Answers referral rounds with bed offers and retracts its own outstanding offers. Cannot document a patient's choice — that separation is what keeps referral fairness auditable."
    identity: "entity_backed:PostAcuteProvider"
    exclusive_operations:
      - "POST /referrals/{id}/offers"
      - "POST /offers/{id}/withdraw"
    shared_operations:
      - "GET /providers/{id}, GET /referrals/{id}, GET /offers, GET /offers/{id}"

  - name: DischargeCoordinator
    description: "Executes the discharge itself. Confirms and cancels logistics orders, and performs the discharge — but only on an episode marked ready by a different operator (four-eyes control)."
    identity: opaque
    exclusive_operations:
      - "POST /logistics-orders/{id}/confirm"
      - "POST /episodes/{id}/discharge"
    shared_operations:
      - "POST /logistics-orders/{id}/cancel (with CaseManager)"
      - "GET /episodes/{id}, GET /episodes/{id}/barriers, GET /providers/{id}, GET /vehicles/{id}"
      - "GET /logistics-orders, GET /logistics-orders/{id}"
