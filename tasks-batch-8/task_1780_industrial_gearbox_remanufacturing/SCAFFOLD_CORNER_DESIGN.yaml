        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "end_date <= start_date (here equal) returns ERR_INVALID_WINDOW 422 — zero-length windows are invalid even though half-open adjacency across assignments is allowed."
