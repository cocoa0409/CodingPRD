              as: VendorRelationshipManager
              captures: { c_cw2: $.data.id }
            - call: "GET /tprm/engagements/${e_cw2}"
              payload: {}
              as: RiskOfficer
              captures: { e_cw2_v2: $.data.version }
            - call: "POST /tprm/contracts/${c_cw2}/execute"
              payload: { expected_engagement_version: "${e_cw2_v2}" }
              as: RiskOfficer
            - call: "POST /tprm/vendors/${v_cw2}/activate"
              payload: {}
              as: RiskOfficer
            - call: "GET /tprm/vendors/${v_cw2}/monitoring-cycles"
              payload: {}
              as: RiskOfficer
              captures: { first_cycle_id: "$.data[0].id", first_cycle_due: "$.data[0].due_at" }
            - call: "POST /tprm/monitoring-cycles/${first_cycle_id}/begin"
              payload: {}
