      - name: tier_create_referential_vs_temporal_priority
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_REFERENTIAL_INTEGRITY]
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair business_referential (P6) vs business_temporal (P7): a
          tier-create whose sales window overlaps an existing tier AND whose
          expected_event_version is correct but which references a malformed
          sales window (sales_start >= sales_end is a structural violation
          reported under referential/shape checks per P6) must surface the P6
          error before the P7 overlap check runs. Concretely here: the request
          carries sales_start after sales_end (ERR_REFERENTIAL_INTEGRITY class)
          while also overlapping — the P6-class error wins.
        test_recipe:
          setup:
            - "Event with one existing tier occupying [2026-05-01, 2026-06-01); second tier request has sales_start=2026-06-15 > sales_end=2026-06-01 (invalid shape) which would also overlap nothing but fails shape check first"
