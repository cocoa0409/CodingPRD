              payload: { full_name: "Ove Sand", credential: "CO", credential_expires_on: "2027-12-31", privilege_scope: "OFF_SHELF_ONLY" }
              as: PracticeAdmin
              captures: { fitter_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ray Lund", dob: "1972-11-11", payer_type: "COMMERCIAL", member_id: "CM-441", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /dme/suppliers"
