              as: FieldTechnician
          trigger:
            - call: "POST /bottler/cold-drink-equipment/${eq_id}/service-windows"
              payload: { technician_label: "T-7", window_start: "2026-10-01T11:00:00Z", window_end: "2026-10-01T12:00:00Z", cost_cents: 100 }
              as: FieldTechnician
            - call: "POST /bottler/cold-drink-equipment/${eq_id}/service-windows"
              payload: { technician_label: "T-7", window_start: "2026-10-01T11:59:00Z", window_end: "2026-10-01T13:00:00Z", cost_cents: 100 }
              as: FieldTechnician
              captures: { err: $.data.error_id }
          assert:
            - "adjacent window [11:00,12:00) accepted (half-open: end == start is not overlap)"
            - "overlapping window [11:59,13:00) rejected with ERR_SERVICE_WINDOW_OVERLAP"
            - "BottlerAgreement.${ag_id}.service_spent_cents == 200 (only accepted windows charge)"

      - name: equipment_placement_closed_interval_touching_dates_conflict
        grounds:
          - state_machines.ColdDrinkEquipment.IN_WAREHOUSE_to_PLACED
          - errors[ERR_EQUIPMENT_PLACEMENT_OVERLAP]
        distinguishing_aspect: "Interval semantics #2 (closed [from,until] placement history on ColdDrinkEquipment — different resource than technician windows): a new placement whose start date EQUALS a prior placement's end date IS an overlap (adjacency forbidden), the opposite of the half-open rule."
        test_recipe:
          setup:
            - "Seeded ACTIVE agreement; equipment placed 2026-09-15..2026-09-30 at c1, then uninstalled; second ACTIVE customer c2."
