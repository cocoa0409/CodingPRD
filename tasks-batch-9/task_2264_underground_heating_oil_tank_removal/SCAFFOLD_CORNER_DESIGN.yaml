            - call: "POST /laboratories"
              payload: { lab_name: "Scope Gates Labs", accredited: true, committed_turnaround_hours: 72, holding_time_hours: 336, max_concurrent_analyses: 2 }
              as: ComplianceOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /soil-samples"
              payload: { tank_project_id: "${proj_id}", work_order_id: "${wo_id}", laboratory_id: "${lab_id}", sample_point: "CONFIRMATION_FLOOR", depth_inches: 84 }
              as: FieldTechnician
