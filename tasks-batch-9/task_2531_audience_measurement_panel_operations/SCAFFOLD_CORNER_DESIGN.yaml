      - name: impact_analysis_gates_reject_a_non_distinct_target_or_a_foreign_baseline
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 53]
          - validations[priority 54]
          - validations[priority 55]
        distinguishing_aspect: "Rule 53 rejects both shapes of a bad rule-set pair - identical ids and a target that is not the currently PUBLISHED set - and rule 55 rejects a baseline run that is perfectly valid in itself but whose market is not in the change's affected_market_ids. Rule 54 then fires from BOTH directions: impact-analyses needs DRAFT while request-revision refuses DRAFT."
        test_recipe:
          setup:
            - "CHAIN C complete with CODE DMA-677, RANK 177, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002083, LABEL RS-C71, opened by stat-opener-77 and published by stat-publisher-77. RS-C71 is the only PUBLISHED rule set and the run projected 24306 at clock 2026-08-11T00:00:00Z."
            - "A bare market DMA-678 (rank 178) with no cells, used as a foreign affected market."
            - "Two DRAFT rule sets: RS-C72 (identical to RS-C71 except missing_interval_ascription_minutes 66) and RS-C73 (identical except invalid_tuning_max_minutes 800)."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: GovernanceDirector
              captures: { run77_id: "$.data[0].id", m77_id: "$.data[0].market_id", rs71_id: "$.data[0].edit_rule_set_id" }
            - call: "POST /markets"
              payload: { name: "Metro Unaffected", market_code: "DMA-678", dma_rank: 178, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m78_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C72", missing_interval_ascription_minutes: 66, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs72_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C73", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 800, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs73_id: "$.data.id" }
          trigger:
            - call: "POST /methodology-changes"
              payload: { title: "No-op change", target_edit_rule_set_id: "${rs71_id}", proposed_edit_rule_set_id: "${rs71_id}", affected_market_ids: ["${m77_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-77"
              captures: { e77a: "$.data.error_id" }
            - call: "POST /methodology-changes"
              payload: { title: "Draft to draft", target_edit_rule_set_id: "${rs72_id}", proposed_edit_rule_set_id: "${rs73_id}", affected_market_ids: ["${m77_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-77"
              captures: { e77b: "$.data.error_id" }
            - call: "POST /methodology-changes"
              payload: { title: "Ascription 60 -> 66, wrong market list", target_edit_rule_set_id: "${rs71_id}", proposed_edit_rule_set_id: "${rs72_id}", affected_market_ids: ["${m78_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-77"
              captures: { ch77a_id: "$.data.id", ch77a_v: "$.data.version" }
            - call: "POST /methodology-changes/${ch77a_id}/impact-analyses"
              payload: { baseline_processing_run_id: "${run77_id}", expected_methodology_change_version: "${ch77a_v}" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-77"
              captures: { e77c: "$.data.error_id" }
            - call: "POST /methodology-changes/${ch77a_id}/request-revision"
              payload: { reason: "Fix the market list" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-77"
              captures: { e77d: "$.data.error_id" }
            - call: "POST /methodology-changes"
              payload: { title: "Ascription 60 -> 66", target_edit_rule_set_id: "${rs71_id}", proposed_edit_rule_set_id: "${rs72_id}", affected_market_ids: ["${m77_id}", "${m78_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-77"
              captures: { ch77b_id: "$.data.id", ch77b_v: "$.data.version" }
            - call: "POST /methodology-changes/${ch77b_id}/impact-analyses"
              payload: { baseline_processing_run_id: "${run77_id}", expected_methodology_change_version: "${ch77b_v}" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-77"
              captures: { ch77b_v2: "$.data.version" }
            - call: "POST /methodology-changes/${ch77b_id}/impact-analyses"
              payload: { baseline_processing_run_id: "${run77_id}", expected_methodology_change_version: "${ch77b_v2}" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-77"
              captures: { e77e: "$.data.error_id" }
          assert:
            - "Trigger call 1: HTTP 422 with ${e77a} == ERR_RULE_SET_NOT_DISTINCT - target and proposed name the same row"
            - "Trigger call 2: HTTP 422 with ${e77b} == ERR_RULE_SET_NOT_DISTINCT - the two ids differ but the target is a DRAFT set, and the rule demands the target be the one currently PUBLISHED"
            - "Trigger call 3: HTTP 201 with data.state == DRAFT, data.impact_delta_pct == null, data.impact_tier == null, data.created_by_user_id == gov-drafter-77 and ${ch77a_v} == 1"
            - "Trigger call 4: HTTP 422 with ${e77c} == ERR_BASELINE_RUN_INVALID - the baseline run is PUBLISHED and pins the target rule set, but its market DMA-677 is absent from affected_market_ids == [DMA-678's id]"
            - "Trigger call 5: HTTP 409 with ${e77d} == ERR_CHANGE_NOT_DRAFT - request-revision requires IMPACT_ASSESSED or NOTIFIED, so a DRAFT change is rejected by the same rule that guards impact-analyses from the opposite side"
            - "Trigger call 7: HTTP 201 with data.state == IMPACT_ASSESSED, data.impact_delta_pct == round_half_up(0.25 * min(1.0, 6/60), 4) == 0.0250, data.impact_tier == MINOR, data.notification_lead_hours == 72 and data.notification_deadline_at == 2026-08-14T00:00:00Z"
            - "Trigger call 8: HTTP 409 with ${e77e} == ERR_CHANGE_NOT_DRAFT - the version pin is current (${ch77b_v2}), so priority 8 passes and the state gate at 54 is what rejects the second analysis"

      - name: notify_and_activate_gates_run_in_declared_priority_order
        claim_type: priority_ordering
        grounds:
          - validations[priority 44]
          - validations[priority 56]
          - validations[priority 57]
          - validations[priority 58]
          - validations[priority 59]
          - validations[priority 72]
        distinguishing_aspect: "Five gates guard activation and they must be reported in priority order: segregation of duties (44) beats the state gate (57), and the acknowledgement gate (58) beats the waiting-period gate (59) even though both are violated by the same call. Notification itself is refused when the affected markets have no contracted client at all, and activation is legal at exactly the deadline instant."
        test_recipe:
          setup:
            - "CHAIN C complete with CODE DMA-679, RANK 179, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002084, LABEL RS-C74, opened by stat-opener-79 and published by stat-publisher-79; the clock reads 2026-08-11T00:00:00Z."
            - "A DRAFT rule set RS-C75 identical to RS-C74 except missing_interval_ascription_minutes 66, which yields impact_delta_pct 0.0250 (MINOR, 72-hour lead)."
            - "NO client exists yet, so the market has no contracted subscriber when notify is first attempted."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: GovernanceDirector
              captures: { run79_id: "$.data[0].id", m79_id: "$.data[0].market_id", rs74_id: "$.data[0].edit_rule_set_id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C75", missing_interval_ascription_minutes: 66, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs75_id: "$.data.id" }
          trigger:
            - call: "POST /methodology-changes"
              payload: { title: "Ascription 60 -> 66", target_edit_rule_set_id: "${rs74_id}", proposed_edit_rule_set_id: "${rs75_id}", affected_market_ids: ["${m79_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-79"
              captures: { ch79_id: "$.data.id", ch79_v: "$.data.version" }
            - call: "POST /methodology-changes/${ch79_id}/impact-analyses"
              payload: { baseline_processing_run_id: "${run79_id}", expected_methodology_change_version: "${ch79_v}" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-79"
            - call: "POST /methodology-changes/${ch79_id}/activate"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-drafter-79"
              captures: { e79a: "$.data.error_id" }
            - call: "POST /methodology-changes/${ch79_id}/activate"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-activator-79"
              captures: { e79b: "$.data.error_id" }
            - call: "POST /methodology-changes/${ch79_id}/notify"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-drafter-79"
              captures: { e79c: "$.data.error_id" }
            - call: "POST /clients"
              payload: { name: "Harbor Broadcasting", tier: "STANDARD", contract_market_ids: ["${m79_id}"] }
              as: ClientServiceRep
              captures: { cl79_id: "$.data.id" }
            - call: "POST /methodology-changes/${ch79_id}/notify"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-drafter-79"
            - call: "POST /methodology-changes/${ch79_id}/notify"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-drafter-79"
              captures: { e79d: "$.data.error_id" }
            - call: "POST /methodology-changes/${ch79_id}/activate"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-activator-79"
              captures: { e79e: "$.data.error_id" }
            - call: "GET /client-notifications"
              payload: { methodology_change_id: "${ch79_id}" }
              as: ClientServiceRep
              captures: { n79_id: "$.data[0].id" }
            - call: "POST /client-notifications/${n79_id}/acknowledge"
              payload: {}
              as: ClientUser
              as_user_id: "${cl79_id}"
            - call: "POST /methodology-changes/${ch79_id}/activate"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-activator-79"
              captures: { e79f: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T00:00:00Z" }
              as: GovernanceDirector
            - call: "POST /methodology-changes/${ch79_id}/activate"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-activator-79"
            - call: "GET /processing-runs/${run79_id}"
              payload: {}
              as: GovernanceDirector
            - call: "GET /edit-rule-sets/${rs74_id}"
              payload: {}
              as: GovernanceDirector
          assert:
            - "Trigger call 2: data.state == IMPACT_ASSESSED, data.impact_tier == MINOR, data.notification_lead_hours == 72 and data.notification_deadline_at == 2026-08-14T00:00:00Z"
            - "Trigger call 3: HTTP 409 with ${e79a} == ERR_SEGREGATION_OF_DUTIES - the drafter cannot activate, and priority 44 is reported even though the change is not NOTIFIED yet (57 would also be violated)"
            - "Trigger call 4: HTTP 409 with ${e79b} == ERR_CHANGE_NOT_NOTIFIED - a different operator clears rule 44 and now reaches the state gate"
            - "Trigger call 5: HTTP 409 with ${e79c} == ERR_NO_AFFECTED_CLIENTS - no client's contract_market_ids intersects the affected markets, so there is nobody to disclose to"
            - "Trigger call 7: HTTP 200 with data.state == NOTIFIED, data.notified_client_count == 1, data.acknowledged_client_count == 0 and one ClientNotification created in state SENT with impact_tier MINOR, disclosed_delta_pct 0.0250 and sent_at 2026-08-11T00:00:00Z"
            - "Trigger call 8: HTTP 409 with ${e79d} == ERR_CHANGE_NOT_ASSESSED - notify is not idempotent; the state is now NOTIFIED"
            - "Trigger call 9: HTTP 409 with ${e79e} == ERR_ACKNOWLEDGEMENTS_MISSING - acknowledged 0 != notified 1, and priority 58 beats the still-open waiting period at 59"
            - "Trigger call 11: HTTP 200 with data.state == ACKNOWLEDGED and the change's acknowledged_client_count now 1"
            - "Trigger call 12: HTTP 409 with ${e79f} == ERR_NOTIFICATION_PERIOD_OPEN - the acknowledgement gate is satisfied, so the clock gate is the last one standing at 2026-08-11 < 2026-08-14"
            - "Trigger call 14: HTTP 200 with data.state == EFFECTIVE and data.activated_at == 2026-08-14T00:00:00Z - the comparison is >=, so activation at exactly notification_deadline_at is allowed"
            - "Trigger call 15: data.state is STILL PUBLISHED and data.repin_required_reason == null - the repin cascade only reaches NON-terminal runs, and PUBLISHED is a terminal ProcessingRun state"
            - "Trigger call 16: data.status == SUPERSEDED for RS-C74, and RS-C75 is now PUBLISHED with published_at 2026-08-14T00:00:00Z"

