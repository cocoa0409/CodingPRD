        grounds:
          - validations[priority=40]
          - state_machines.HarvestAuthorization.ISSUED_to_ACTIVE
          - state_machines.GrowingArea.APPROVED_to_RESTRICTED
          - entities.GrowingArea.fields.classification
          - entities.HarvestAuthorization.fields.growing_area_id
        distinguishing_aspect: |
          The blocking state lives two hops away from the addressed row -- GrowingArea.classification
          reached through Lease.growing_area_id -- and it is the CLASSIFICATION dimension that blocks
          while harvest_status stays OPEN, so no closure cascade is involved and the authorization
