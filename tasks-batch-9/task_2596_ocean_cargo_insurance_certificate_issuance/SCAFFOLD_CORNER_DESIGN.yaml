      - name: security_posting_rejects_a_short_guarantee_or_a_short_cash_deposit
        claim_type: violation_to_error
        grounds:
          - validations.priority_29
          - errors.ERR_SECURITY_AMOUNT_INSUFFICIENT
          - calculations.ga_contribution_allocation
          - state_machines.GaSecurityPosting.status.REQUIRED_to_POSTED
        distinguishing_aspect: |
          The guarantee and the cash deposit are checked against two DIFFERENT
          computed figures — contribution_amount 157500.00 and
          cash_deposit_expected_amount 31500.00 — and one cent short on either
          leg refuses the whole posting with the same error. The single-contributor
          case is the sharpest: the waterfall residual -0.42 has already pulled
          the raw 157500.42 back to a round 157500.00, so an implementation that
          compares the guarantee against the unrounded raw contribution accepts
          157500.00 on the first attempt where it should not matter, and rejects
          the exact figure on the third where it must be accepted.
          The refused attempts must leave the posting in REQUIRED and the policy's
          security_deposit_held_amount at 0.00.
        test_recipe:
          setup:
            - "one ISSUED certificate of insured_value 1155000.00 on MV Kite sailing 2026-08-10"
            - "GA event sacrifice 120000.00, salvage award 30000.00 -> fee 7500.00, allowance 157500.00"
            - "single contributor: rate round(157500/1155000, 6) == 0.136364, raw 157500.42, residual -0.42, contribution 157500.00, expected deposit 31500.00"
