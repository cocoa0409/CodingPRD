            - "Property.${property_id}.units_under_hap_count == 20 and Property.${property_id}.enhanced_voucher_unit_count == 0 and Property.${property_id}.released_unit_count == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: applied_utility_allowances_must_be_twelve_whole_months_apart_on_the_same_property
        grounds:
          - validations[priority=58]
          - errors[ERR_UA_INTERVAL_OVERLAP]
          - entities.Property.fields.last_applied_ua_effective_date
          - calculations.utility_allowance_adjustment
          - concurrency_rules[ua-apply-stale-property]
          - state_machines.UtilityAllowanceAnalysis.APPROVED_to_APPLIED
        distinguishing_aspect: |
          The contended resource is the Property's utility-allowance coverage interval, and the
          boundary is INCLUSIVE: an analysis effective exactly twelve whole months after the last
          applied one is accepted, while one effective a single day earlier is refused 409. The
          conflict is only detected at apply time, so three analyses can coexist in DRAFT and
          APPROVED without complaint; the guard also compounds, because each successful apply
          moves the baseline (11500 -> 12535 -> 13663) and the coverage window with it.
        test_recipe:
          setup:
            - "Owner and one IL property with baseline_utility_allowance_cents 11500 and no analysis ever applied, so the first apply is unconditionally allowed."
            - "Clock at the default 2026-08-01; the property has no households, so every apply recertifies nobody."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id, property_version_0: $.data.version }
            - call: "POST /pbra/utility-allowance-analyses"
              payload: { property_id: "${property_id}", method: "FACTOR_BASED", effective_date: "2026-09-01", utility_rate_change_pct: 0.09 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { ua1_id: $.data.id, ua1_proposed: $.data.proposed_allowance_cents }
            - call: "POST /pbra/utility-allowance-analyses/${ua1_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/utility-allowance-analyses/${ua1_id}/decide"
              payload: { decision: "ACCEPT" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
          trigger:
            - call: "POST /pbra/utility-allowance-analyses/${ua1_id}/apply"
              payload: { expected_property_version: "${property_version_0}" }
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { ua1_state: $.data.state, ua1_recertified: $.data.recertified_tenant_count }
            - call: "GET /pbra/properties/${property_id}"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { property_version_1: $.data.version, current_ua_1: $.data.current_utility_allowance_cents, last_applied_1: $.data.last_applied_ua_effective_date }
            - call: "POST /pbra/utility-allowance-analyses"
              payload: { property_id: "${property_id}", method: "FACTOR_BASED", effective_date: "2027-09-01", utility_rate_change_pct: 0.09 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { ua2_id: $.data.id, ua2_proposed: $.data.proposed_allowance_cents, ua2_baseline: $.data.baseline_allowance_cents }
            - call: "POST /pbra/utility-allowance-analyses/${ua2_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/utility-allowance-analyses/${ua2_id}/decide"
              payload: { decision: "ACCEPT" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "POST /pbra/utility-allowance-analyses/${ua2_id}/apply"
              payload: { expected_property_version: "${property_version_1}" }
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { ua2_state: $.data.state }
            - call: "GET /pbra/properties/${property_id}"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { property_version_2: $.data.version, current_ua_2: $.data.current_utility_allowance_cents, last_applied_2: $.data.last_applied_ua_effective_date }
            - call: "POST /pbra/utility-allowance-analyses"
              payload: { property_id: "${property_id}", method: "FACTOR_BASED", effective_date: "2027-08-31", utility_rate_change_pct: 0.09 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { ua3_id: $.data.id, ua3_proposed: $.data.proposed_allowance_cents }
            - call: "POST /pbra/utility-allowance-analyses/${ua3_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/utility-allowance-analyses/${ua3_id}/decide"
              payload: { decision: "ACCEPT" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
            - call: "POST /pbra/utility-allowance-analyses/${ua3_id}/apply"
              payload: { expected_property_version: "${property_version_2}" }
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
          assert:
            - "${ua1_proposed} == 12535 and ${ua1_state} == APPLIED and ${ua1_recertified} == 0"
            - "${current_ua_1} == 12535 and ${last_applied_1} == 2026-09-01"
            - "${ua2_baseline} == 12535 and ${ua2_proposed} == 13663"
            - "${ua2_state} == APPLIED (effective_date 2027-09-01 is exactly UA_COVERAGE_MONTHS whole months after 2026-09-01, and the inclusive boundary accepts it)"
            - "${current_ua_2} == 13663 and ${last_applied_2} == 2027-09-01"
            - "${ua3_proposed} == 14893 and UtilityAllowanceAnalysis.${ua3_id}.change_pct == 0.0900"
            - "The apply on ${ua3_id} returns HTTP 409 with error_id ERR_UA_INTERVAL_OVERLAP because 2027-08-31 is one day inside the coverage window that runs to 2028-09-01"
            - "UtilityAllowanceAnalysis.${ua3_id}.state == APPROVED and Property.${property_id}.current_utility_allowance_cents == 13663 and Property.${property_id}.last_applied_ua_effective_date == 2027-09-01"

      - name: tenant_certifications_need_a_strictly_longer_than_thirty_day_gap_on_the_same_household
        grounds:
          - validations[priority=59]
          - errors[ERR_CERT_INTERVAL_CONFLICT]
          - concurrency_rules[cert-create-stale-tenant]
          - entities.TenantCertification.fields.effective_date
          - entities.TenantCertification.fields.status
        distinguishing_aspect: |
          The contended resource is a different one (a TenantHousehold's certification timeline,
          not a Property's allowance window), the spacing constant is expressed in days rather
          than whole months, and the boundary has the OPPOSITE strictness: a certification
          effective exactly CERT_BUFFER_DAYS = 30 days after the ACTIVE one is REJECTED, and only
          day 31 is accepted. The conflict is also detected at creation time rather than at a
          later apply step, and the failed attempt does not consume the household's version, so
          the accepted third call reuses the same expected_tenant_version.
        test_recipe:
          setup:
            - "Owner, IL property, HapContract with contract_rent_per_unit_cents 118000, clock at the default 2026-08-01."
            - "One household in unit 101 with an ACTIVE INITIAL certification effective 2026-07-01."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pbra/tenant-households"
              payload: { property_id: "${property_id}", unit_number: "101", household_name: "Alvarez", annual_adjusted_income_cents: 1800000, annual_gross_income_cents: 1920000, family_size: 3 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { t1_id: $.data.id, t1_version_0: $.data.version }
            - call: "POST /pbra/tenant-certifications"
              payload: { tenant_id: "${t1_id}", cert_type: "INITIAL", effective_date: "2026-07-01", expected_tenant_version: "${t1_version_0}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { cert1_id: $.data.id, cert1_hap: $.data.hap_cents, cert1_ttp: $.data.ttp_cents }
            - call: "GET /pbra/tenant-households/${t1_id}"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { t1_version_1: $.data.version }
          trigger:
            - call: "POST /pbra/tenant-certifications"
              payload: { tenant_id: "${t1_id}", cert_type: "ANNUAL", effective_date: "2026-07-31", expected_tenant_version: "${t1_version_1}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/tenant-certifications"
              payload: { tenant_id: "${t1_id}", cert_type: "ANNUAL", effective_date: "2026-08-01", expected_tenant_version: "${t1_version_1}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { cert3_id: $.data.id, cert3_hap: $.data.hap_cents, cert3_status: $.data.status }
          assert:
            - "${cert1_ttp} == 45000 and ${cert1_hap} == 84500"
            - "The 2026-07-31 certification returns HTTP 409 with error_id ERR_CERT_INTERVAL_CONFLICT because 2026-07-01 plus CERT_BUFFER_DAYS = 30 days is 2026-07-31 and the comparison is strict"
            - "After the refusal TenantCertification.${cert1_id}.status == ACTIVE and TenantHousehold.${t1_id}.version == ${t1_version_1}"
            - "The 2026-08-01 certification is created: ${cert3_status} == ACTIVE and ${cert3_hap} == 84500"
            - "TenantCertification.${cert1_id}.status == SUPERSEDED"
            - "TenantHousehold.${t1_id}.current_hap_cents == 84500 and TenantHousehold.${t1_id}.current_ttp_cents == 45000"

  - rule_id: compensating_invariant
    instances:
      - name: reversing_a_paid_voucher_restores_the_hap_ledger_exactly_and_frees_the_period_again
        grounds:
          - calculations.hap_budget_conservation
          - calculations.subsidy_reconciliation
          - state_machines.VoucherSubmission.PAID_to_REVERSED
          - validations[priority=35]
          - errors[ERR_DUPLICATE_VOUCHER_PERIOD]
          - entities.HapContract.fields.hap_ledger_balance_cents
          - entities.HapContract.fields.paid_hap_total_cents
        distinguishing_aspect: |
          The invariant is monetary: hap_ledger_balance_cents == authorized_hap_budget_cents -
          paid_hap_total_cents - paid_claims_total_cents must hold before, during and after the
          compensation, and paid_amount_cents is deliberately RETAINED on the reversed row for
          audit while ceasing to count toward the ledger. The compensation also releases a
          uniqueness slot: after the reversal the same period_month can be voucher-ed again, which
          is what proves the reversal left no residue anywhere but the audit trail.
        test_recipe:
          setup:
            - "Owner, IL property, HapContract with authorized_hap_budget_cents 30000000, two certified households, clock at the default 2026-08-01."
            - "A 2026-07 voucher submission worth 211500 in state SUBMITTED."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id, contract_version_0: $.data.version, ledger_0: $.data.hap_ledger_balance_cents }
            - call: "POST /pbra/tenant-households"
              payload: { property_id: "${property_id}", unit_number: "101", household_name: "Alvarez", annual_adjusted_income_cents: 1800000, annual_gross_income_cents: 1920000, family_size: 3 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { t1_id: $.data.id, t1_version: $.data.version }
            - call: "POST /pbra/tenant-households"
              payload: { property_id: "${property_id}", unit_number: "102", household_name: "Boone", annual_adjusted_income_cents: 60000, annual_gross_income_cents: 60000, family_size: 1 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { t2_id: $.data.id, t2_version: $.data.version }
            - call: "POST /pbra/tenant-certifications"
              payload: { tenant_id: "${t1_id}", cert_type: "INITIAL", effective_date: "2026-07-01", expected_tenant_version: "${t1_version}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/tenant-certifications"
              payload: { tenant_id: "${t2_id}", cert_type: "INITIAL", effective_date: "2026-07-01", expected_tenant_version: "${t2_version}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/voucher-submissions"
              payload: { contract_id: "${contract_id}", period_month: "2026-07", expected_contract_version: "${contract_version_0}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { voucher_id: $.data.id, requested_hap: $.data.requested_hap_cents, included_count: $.data.included_certification_count }
            - call: "POST /pbra/voucher-submissions/${voucher_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /pbra/voucher-submissions/${voucher_id}/pay"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { paid_amount: $.data.paid_amount_cents }
            - call: "GET /pbra/hap-contracts/${contract_id}/reconciliation"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { rec1_requested: $.data.requested_total_cents, rec1_paid: $.data.paid_hap_total_cents, rec1_reversed: $.data.reversed_total_cents, rec1_ledger: $.data.hap_ledger_balance_cents, rec1_variance: $.data.variance_cents, rec1_periods: $.data.paid_period_count }
            - call: "POST /pbra/voucher-submissions/${voucher_id}/reverse"
              payload: { reason: "Duplicate disbursement discovered in the July close" }
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { reversed_state: $.data.state, retained_amount: $.data.paid_amount_cents }
            - call: "GET /pbra/hap-contracts/${contract_id}/reconciliation"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { rec2_requested: $.data.requested_total_cents, rec2_paid: $.data.paid_hap_total_cents, rec2_reversed: $.data.reversed_total_cents, rec2_ledger: $.data.hap_ledger_balance_cents, rec2_variance: $.data.variance_cents, rec2_periods: $.data.paid_period_count }
            - call: "GET /pbra/hap-contracts/${contract_id}"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { contract_version_after: $.data.version, ledger_after: $.data.hap_ledger_balance_cents, paid_total_after: $.data.paid_hap_total_cents }
            - call: "POST /pbra/voucher-submissions"
              payload: { contract_id: "${contract_id}", period_month: "2026-07", expected_contract_version: "${contract_version_after}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { voucher2_id: $.data.id, voucher2_state: $.data.state, voucher2_requested: $.data.requested_hap_cents }
          assert:
            - "${ledger_0} == 30000000 and ${requested_hap} == 211500 and ${included_count} == 2"
            - "${paid_amount} == 211500"
            - "${rec1_requested} == 211500 and ${rec1_paid} == 211500 and ${rec1_reversed} == 0 and ${rec1_ledger} == 29788500 and ${rec1_variance} == 0 and ${rec1_periods} == 1"
            - "${reversed_state} == REVERSED and ${retained_amount} == 211500"
            - "${rec2_requested} == 0 and ${rec2_paid} == 0 and ${rec2_reversed} == 211500 and ${rec2_ledger} == 30000000 and ${rec2_variance} == 0 and ${rec2_periods} == 0"
            - "${ledger_after} == 30000000 and ${paid_total_after} == 0"
            - "${contract_version_after} > ${contract_version_0} (compensation restores the money, never the version)"
            - "${voucher2_state} == DRAFT and ${voucher2_requested} == 211500 (the REVERSED row no longer occupies the 2026-07 slot, so no ERR_DUPLICATE_VOUCHER_PERIOD)"
            - "HapContract.${contract_id}.hap_ledger_balance_cents == 30000000 after the second voucher is created, because DRAFT rows move no money"

      - name: rescinding_an_issued_enhanced_voucher_restores_the_three_unit_counters_without_drift
        grounds:
          - calculations.assisted_unit_conservation
          - state_machines.EnhancedVoucher.ISSUED_to_RESCINDED
          - state_machines.TenantHousehold.EV_ISSUED_to_OPT_OUT_NOTICED
          - entities.Property.fields.units_under_hap_count
          - entities.Property.fields.enhanced_voucher_unit_count
          - entities.Property.fields.released_unit_count
        distinguishing_aspect: |
          The invariant here is a unit-count identity rather than a money identity
          (units_under_hap + enhanced_voucher + released == assisted_unit_count = 20), and it is
          restored by a compensation owned by a different role (PhaAdministrator) acting on a
          different entity family. Two counters move in opposite directions on both the forward
          and the reverse leg, so a compensation that forgot one of them would still leave the
          sum right while leaving the split wrong — which is exactly what the per-counter asserts
          catch. Unlike the notice-driven cascade, no other entity is touched: the case stays
          OPT_OUT_NOTICED and the second voucher stays PENDING throughout.
        test_recipe:
          setup:
            - "Owner, IL property with assisted_unit_count 20, HapContract, two certified households, clock at 2026-12-01."
            - "Renewal case with an OPT_OUT_ONE_YEAR notice effective 2027-12-31 and record-opt-out applied, so two PENDING enhanced vouchers exist and the counters read 20 / 0 / 0."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id, units_hap_0: $.data.units_under_hap_count, ev_units_0: $.data.enhanced_voucher_unit_count, released_0: $.data.released_unit_count }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pbra/tenant-households"
              payload: { property_id: "${property_id}", unit_number: "101", household_name: "Alvarez", annual_adjusted_income_cents: 1800000, annual_gross_income_cents: 1920000, family_size: 3 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { t1_id: $.data.id, t1_version: $.data.version }
            - call: "POST /pbra/tenant-households"
              payload: { property_id: "${property_id}", unit_number: "102", household_name: "Boone", annual_adjusted_income_cents: 60000, annual_gross_income_cents: 60000, family_size: 1 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { t2_id: $.data.id, t2_version: $.data.version }
            - call: "POST /pbra/tenant-certifications"
              payload: { tenant_id: "${t1_id}", cert_type: "INITIAL", effective_date: "2026-07-01", expected_tenant_version: "${t1_version}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/tenant-certifications"
              payload: { tenant_id: "${t2_id}", cert_type: "INITIAL", effective_date: "2026-07-01", expected_tenant_version: "${t2_version}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${contract_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case_id: $.data.id }
            - call: "POST /pbra/tenant-notices"
              payload: { renewal_case_id: "${case_id}", notice_type: "OPT_OUT_ONE_YEAR", effective_date: "2027-12-31" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { notice_id: $.data.id }
            - call: "POST /pbra/renewal-cases/${case_id}/record-opt-out"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "GET /pbra/renewal-cases/${case_id}/enhanced-vouchers"
              payload: {}
              as: PhaAdministrator
              as_user_id: "pha-1"
              captures: { ev_t1_id: "$.data[0].id", ev_t2_id: "$.data[1].id" }
            - call: "GET /pbra/properties/${property_id}"
              payload: {}
              as: PhaAdministrator
              as_user_id: "pha-1"
              captures: { property_version_before: $.data.version, units_hap_1: $.data.units_under_hap_count, ev_units_1: $.data.enhanced_voucher_unit_count, released_1: $.data.released_unit_count }
          trigger:
            - call: "POST /pbra/enhanced-vouchers/${ev_t1_id}/issue"
              payload: {}
              as: PhaAdministrator
              as_user_id: "pha-1"
              captures: { ev_state_issued: $.data.state, ev_pha: $.data.issuing_pha_user_id, ev_issued_on: $.data.issued_on_date }
            - call: "GET /pbra/properties/${property_id}"
              payload: {}
              as: PhaAdministrator
              as_user_id: "pha-1"
              captures: { units_hap_2: $.data.units_under_hap_count, ev_units_2: $.data.enhanced_voucher_unit_count, released_2: $.data.released_unit_count }
            - call: "POST /pbra/enhanced-vouchers/${ev_t1_id}/rescind"
              payload: { reason: "PHA withdrew the voucher before lease-up" }
              as: PhaAdministrator
              as_user_id: "pha-1"
              captures: { ev_state_rescinded: $.data.state }
            - call: "GET /pbra/properties/${property_id}"
              payload: {}
              as: PhaAdministrator
              as_user_id: "pha-1"
              captures: { property_version_after: $.data.version, units_hap_3: $.data.units_under_hap_count, ev_units_3: $.data.enhanced_voucher_unit_count, released_3: $.data.released_unit_count }
            - call: "GET /pbra/tenant-households/${t1_id}"
              payload: {}
              as: PhaAdministrator
              as_user_id: "pha-1"
              captures: { t1_status_after: $.data.status }
          assert:
            - "${units_hap_0} == 20 and ${ev_units_0} == 0 and ${released_0} == 0"
            - "${units_hap_1} == 20 and ${ev_units_1} == 0 and ${released_1} == 0 (record-opt-out mints PENDING vouchers only and moves no counter)"
            - "${ev_state_issued} == ISSUED and ${ev_pha} == pha-1 and ${ev_issued_on} == 2026-12-01"
            - "${units_hap_2} == 19 and ${ev_units_2} == 1 and ${released_2} == 0"
            - "${ev_state_rescinded} == RESCINDED and ${t1_status_after} == OPT_OUT_NOTICED"
            - "${units_hap_3} == 20 and ${ev_units_3} == 0 and ${released_3} == 0"
            - "${units_hap_3} + ${ev_units_3} + ${released_3} == 20 and Property.${property_id}.assisted_unit_count == 20"
            - "${property_version_after} > ${property_version_before} (two writes happened; only the counters are restored)"
            - "EnhancedVoucher.${ev_t2_id}.state == PENDING and RenewalCase.${case_id}.notice_track_status == OPT_OUT_NOTICED and TenantNotice.${notice_id}.status == ISSUED"
