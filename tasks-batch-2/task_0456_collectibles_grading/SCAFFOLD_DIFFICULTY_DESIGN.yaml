              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ACTIVE_SLAB_EXISTS"

      - name: duplicate_intake_blocks_second_intake_on_item
        grounds:
          - state_machines.SubmissionItem.REGISTERED_to_INTAKE_LOGGED
          - errors[ERR_DUPLICATE_INTAKE]
          - entities.IntakeRecord.fields.received_at
        distinguishing_aspect: |
          Different resource (SubmissionItem 'intake slot') and different interval
          semantics: intake is an at-most-once occupancy keyed by existence of any
          prior IntakeRecord (no time window, no buffer) — the second intake on the
          same item is rejected ERR_DUPLICATE_INTAKE, distinct from the slab
