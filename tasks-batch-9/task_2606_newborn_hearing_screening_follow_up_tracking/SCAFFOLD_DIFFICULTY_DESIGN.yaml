              as: ProgramAdmin
              captures: { per_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-05T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-N", guardian_contact_phone: "5551001" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { n_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${n_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "OAE", performed_at: "2026-08-05T04:00:00Z", left_ear_result: "PASS", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { bh_ver: "$.data.version" }
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh_id}", reporting_period_id: "${per_id}", attested_screened_count: 1, attested_refer_count: 0, expected_facility_version: "${bh_ver}" }
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { rep_id: "$.data.id" }
            - call: "POST /facility-reports/${rep_id}/review"
              payload: { decision: "ACCEPT", note: "counts reconcile" }
