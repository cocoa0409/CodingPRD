# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7 per the claim-extraction guide.
# Default logical clock at boot: 2026-09-01T00:00:00Z. Error-expecting triggers
# capture $.data.error_id. The recurring "season to IN_SEASON with an accepted
# allocation" chain is written out in full for every instance (no shared
# fixtures — each recipe replays from empty DB).
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: season_create_returns_initial_state_and_echoed_fields
        claim_type: creation
        grounds: [entities.Season, "endpoints.POST /grillops/seasons"]
        distinguishing_aspect: "A fully-specified season create returns 201 with status PLANNING, version 1, and every input field echoed."
        test_recipe:
          setup: ["empty database; clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { st: "$.data.status", ver: "$.data.version" } }
          assert:
            - "captured st == PLANNING (initial state) and ver == 1"
            - "response echoes name == 'Grilling Season 2026', year == 2026, demand_forecast_units == 1000 and all five window timestamps verbatim"

      - name: season_create_rejected_when_dates_out_of_order
        claim_type: type_constraint
        grounds: [entities.Season, "validations[priority=6]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "clearance_start earlier than in_season_start violates the pinned date ordering and fails with ERR_VALIDATION before any persistence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grillops/seasons", payload: { name: "Broken Season", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-02-15T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_VALIDATION (http 400): clearance_start 2026-02-15 < in_season_start 2026-03-01 breaks build_start < allocation_open < in_season_start < clearance_start < season_end"

      - name: model_create_applies_coverage_and_firmware_defaults
        claim_type: defaults
        grounds: [entities.GrillModel, "endpoints.POST /grillops/models"]
        distinguishing_aspect: "Omitting the coverage/support/firmware inputs applies the catalogued defaults (10/5/3/2 years, 7 support years, '1.0.0'); status starts ACTIVE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { bc: "$.data.burner_coverage_years", gc: "$.data.grate_coverage_years", ec: "$.data.electronics_coverage_years", oc: "$.data.other_coverage_years", psy: "$.data.parts_support_years", fw: "$.data.current_firmware_version", st: "$.data.status" } }
          assert:
            - "captured bc == 10, gc == 5, ec == 3, oc == 2 (component coverage defaults)"
            - "captured psy == 7 and fw == '1.0.0'; st == ACTIVE; support_obligation_until is null while ACTIVE"

      - name: channel_subsidy_derived_from_channel_type
        claim_type: computed_fields
        grounds: [entities.ChannelAccount.fields.subsidy_bp, calculations.calc_assembly_fee]
        distinguishing_aspect: "subsidy_bp is computed from channel_type (HOME_CENTER 2000, DIRECT 0) — an input-provided subsidy_bp is not even in the create schema."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { sub_hc: "$.data.subsidy_bp" } }
            - { call: "POST /grillops/channels", payload: { name: "WebDirect", channel_type: "DIRECT", allocation_priority: 5, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { sub_d: "$.data.subsidy_bp" } }
          assert:
            - "captured sub_hc == 2000 (SUBSIDY_BP_HOME_CENTER)"
            - "captured sub_d == 0 (SUBSIDY_BP_DIRECT); attach rates initialize to 0.0"

      - name: unknown_ids_return_entity_specific_not_found
        claim_type: not_found
        grounds: ["errors[ERR_SEASON_NOT_FOUND]", "errors[ERR_MODEL_NOT_FOUND]", "errors[ERR_ALLOCATION_NOT_FOUND]", "errors[ERR_JOB_NOT_FOUND]"]
        distinguishing_aspect: "GET/transition on a random UUID returns 404 with the entity-specific error code, not a generic one — four different path templates shown."
        test_recipe:
          setup: ["empty database (any id is unknown)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /grillops/seasons/00000000-0000-4000-8000-000000000000", as: PlannerAdmin, captures: { e1: "$.data.error_id" } }
            - { call: "GET /grillops/models/00000000-0000-4000-8000-000000000001", as: PlannerAdmin, captures: { e2: "$.data.error_id" } }
            - { call: "GET /grillops/allocations/00000000-0000-4000-8000-000000000002", as: PlannerAdmin, captures: { e3: "$.data.error_id" } }
            - { call: "POST /grillops/assembly-jobs/00000000-0000-4000-8000-000000000003/transition", payload: { action: "CANCEL" }, as: ServiceAgent, captures: { e4: "$.data.error_id" } }
          assert:
            - "captured e1 == ERR_SEASON_NOT_FOUND, e2 == ERR_MODEL_NOT_FOUND, e3 == ERR_ALLOCATION_NOT_FOUND, e4 == ERR_JOB_NOT_FOUND (all http 404)"

      - name: lot_create_computes_forward_sizing_and_nulls_actual
        claim_type: computed_fields
        grounds: [entities.InventoryLot.fields.recommended_build_forward_units, calculations.calc_build_sizing]
        distinguishing_aspect: "With no prior season, the forward variant falls back to demand_forecast_units (floor(1000 x 1.10 x 0.50) = 550) while the actual variant stays null before IN_SEASON."
        test_recipe:
          setup: ["one season (PLANNING) with demand_forecast_units 1000; one model with demand_share_bp 5000"]
          setup_api_calls:
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 10 }, as: PlannerAdmin, captures: { fwd: "$.data.recommended_build_forward_units", act: "$.data.recommended_build_actual_units", st: "$.data.status" } }
          assert:
            - "captured fwd == 550 (forecast fallback: floor(1000 x 11000/10000 x 5000/10000))"
            - "captured act == null (actual variant undefined before IN_SEASON) and st == BUILDING"

      - name: sale_create_rejected_when_serials_length_mismatches_quantity
        claim_type: type_constraint
        grounds: [entities.Sale.fields.serials, "validations[priority=6]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "quantity 2 with a single serial violates the serials-length invariant and returns ERR_VALIDATION after the posture gates pass."
        test_recipe:
          setup: ["Season 2026 IN_SEASON (clock 2026-04-01); HOME_CENTER BigBox with ACCEPTED allocation of 10 GX-100 from a 50-unit lot"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 50 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 10, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
          trigger:
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 2, serials: ["SN-ONLY-ONE"] }, as: ChannelRep, as_user_id: "${ch_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_VALIDATION (http 400): len(serials) 1 != quantity 2"
  - section: state_machines
    instances:
      - name: season_advance_rejected_when_skipping_a_state
        claim_type: invalid_transition
        grounds: [state_machines.Season, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Advance with target_status ALLOCATION from PLANNING is not a declared transition and returns ERR_INVALID_STATE; only the immediate next state is legal."
        test_recipe:
          setup: ["one season in PLANNING"]
          setup_api_calls:
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
          trigger:
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_STATE (http 409); season remains PLANNING"

      - name: season_closed_terminal_lockdown_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Season, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After walking the full lifecycle to CLOSED, any further advance is rejected — terminal states emit no transitions."
        test_recipe:
          setup: ["Season 2026 walked PLANNING -> BUILD -> ALLOCATION -> IN_SEASON -> CLEARANCE -> TRANSITIONED -> CLOSED with clock pushes (lot required for the BUILD -> ALLOCATION guard)"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 5 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "CLEARANCE" }, as: PlannerAdmin }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "TRANSITIONED" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "CLOSED" }, as: PlannerAdmin, captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured st == CLOSED after the full walk"
            - "captured err == ERR_INVALID_STATE (http 409) — CLOSED is terminal"

      - name: declined_allocation_cannot_be_accepted
        claim_type: terminal_lockdown
        grounds: [state_machines.Allocation.OFFERED_to_DECLINED, "errors[ERR_ALLOCATION_NOT_ACTIONABLE]"]
        distinguishing_aspect: "A DECLINED allocation is terminal: a later ACCEPT carrying the CURRENT version still fails with ERR_ALLOCATION_NOT_ACTIONABLE (state gate, not OCC)."
        test_recipe:
          setup: ["Season 2026 in ALLOCATION with a 10-unit lot; channel BigBox; one OFFERED allocation of 8, then DECLINED by its channel"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 10 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 8, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "DECLINE", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "GET /grillops/allocations/${a_id}", as: PlannerAdmin, captures: { a_v2: "$.data.version" } }
          trigger:
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v2}" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_ALLOCATION_NOT_ACTIONABLE (http 409) even with the fresh version — DECLINED is terminal"
            - "Allocation.${a_id}.status remains DECLINED and its 8 units stay with the lot"

      - name: settled_claim_rejects_further_adjudication
        claim_type: terminal_lockdown
        grounds: [state_machines.WarrantyClaim.APPROVED_to_SETTLED, "errors[ERR_CLAIM_NOT_ADJUDICATABLE]"]
        distinguishing_aspect: "SETTLED is terminal: any adjudicate action afterwards returns ERR_CLAIM_NOT_ADJUDICATABLE; also proves the empty-selector settlement fallback (no compatible part in catalog -> settlement_parts_order_id null, part_actual = schedule cost)."
        test_recipe:
          setup: ["Season 2026 IN_SEASON; BigBox allocation 10; REGISTERED sale; BURNER claim approved (provisional 7700 <= cap) and settled with actual_labor_cents 4000 and an EMPTY parts catalog"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 50 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 10, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-T" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /grillops/warranty-claims", payload: { sale_id: "${sale_id}", component: "BURNER", failure_description: "Burner corroded" }, as: ServiceAgent, captures: { cl_id: "$.data.id" } }
            - { call: "POST /grillops/warranty-claims/${cl_id}/adjudicate", payload: { action: "REVIEW" }, as: ServiceAgent }
            - { call: "POST /grillops/warranty-claims/${cl_id}/adjudicate", payload: { action: "APPROVE" }, as: ServiceAgent }
            - { call: "POST /grillops/warranty-claims/${cl_id}/adjudicate", payload: { action: "SETTLE", actual_labor_cents: 4000 }, as: ServiceAgent, captures: { fin: "$.data.final_settlement_cents", po: "$.data.settlement_parts_order_id" } }
          trigger:
            - { call: "POST /grillops/warranty-claims/${cl_id}/adjudicate", payload: { action: "DENY" }, as: ServiceAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "captured fin == 7200 (empty selector pool -> schedule cost 3200 + 4000 labor) and po == null"
            - "captured err == ERR_CLAIM_NOT_ADJUDICATABLE (http 409) — SETTLED is terminal"
      - name: restock_fills_backorders_in_creation_order
        claim_type: side_effect_execution
        grounds: [state_machines.PartSku.EXHAUSTED_to_AVAILABLE, state_machines.PartsOrder.BACKORDERED_to_ALLOCATED, entities.PartsOrder.fields.seq_no]
        distinguishing_aspect: "A RESTOCK of 1 unit fills only the earliest-created backorder (created_at ASC, seq_no ASC tie-break); the later one stays BACKORDERED and the part flips straight back to EXHAUSTED."
        test_recipe:
          setup:
            - "Season 2026 IN_SEASON (clock 2026-04-01T00:00:00Z); DIRECT WebDirect allocation 10; one sale (SOLD is fine for parts orders)"
            - "Part GRT-7 (GRATE, compatible GX-100, chain CH-R position 1) created with stock 1"
            - "Order-1 qty 1 ALLOCATED draining stock to 0 (part -> EXHAUSTED); order-2 BACKORDERED at 2026-04-01T00:00:00Z; clock nudged +1 minute; order-3 BACKORDERED at 2026-04-01T00:01:00Z"
          setup_api_calls:
