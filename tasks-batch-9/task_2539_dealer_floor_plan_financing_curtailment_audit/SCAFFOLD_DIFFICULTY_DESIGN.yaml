            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Dealer with one ACTIVE CreditLine whose credit_limit_cents is 500000000, max_unit_advance_cents_new is 20000000 and which carries a NEW tier [90,unbounded) at 1000 bps. No covenant test has ever been filed, so last_covenant_result is null."
