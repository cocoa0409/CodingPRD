            - call: "POST /coop/sitting-requests/${reqB_id}/claims"
              payload: { message: "Taking sit B" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { claimB_id: $.data.id }
            - call: "POST /coop/sitting-requests/${reqB_id}/claims/${claimB_id}/accept"
              payload: { expected_sitting_request_version: "${reqB_v}" }
              as: Member
              as_user_id: "${f1_id}"
            - call: "GET /coop/sitting-requests/${reqB_id}/assignment"
              as: CoopAdmin
              captures: { asgB_id: "$.data[0].id" }
            - call: "GET /coop/sitting-assignments/${asgB_id}/access-handoff"
              as: CoopAdmin
              captures: { hoB_id: "$.data[0].id" }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T08:30:00Z" }
              as: CoopAdmin
            - call: "POST /coop/access-handoffs/${hoB_id}/confirm-handoff"
              payload: {}
              as: Member
              as_user_id: "${f1_id}"
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T10:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asgB_id}/entry-logs"
              payload: { event_type: "CHECK_IN", occurred_at: "2026-09-11T10:00:00Z" }
              as: Member
              as_user_id: "${f2_id}"
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T12:59:00Z" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asgB_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${f2_id}"
          trigger:
            - call: "POST /coop/sitting-assignments/${asg_id}/settle"
              payload: {}
              as: CoopAdmin
