            - { call: "POST /plant/imposition-plans/${plan}/lock", payload: { expected_job_version: "${job_v3}" }, as: StructuralDesigner }
            - { call: "POST /plant/jobs/${job}/mark-press-ready", payload: {}, as: StructuralDesigner }
            - { call: "POST /plant/presses", payload: { press_code: "P-OFF-9", press_type: "OFFSET", max_sheet_w_cin: 5000, max_sheet_h_cin: 4000, max_sheets_per_booking: 1000 }, as: PlantAdmin, captures: { press: $.data.id } }
            - { call: "POST /plant/press-bookings", payload: { job_id: "${job}", press_id: "${press}", planned_sheets: 60, start_utc: "2026-08-10T10:00:00Z", end_utc: "2026-08-10T12:00:00Z" }, as: PressOperator, captures: { bk1: $.data.id } }
          trigger:
            - { call: "POST /plant/press-bookings", payload: { job_id: "${job}", press_id: "${press}", planned_sheets: 60, start_utc: "2026-08-10T12:00:00Z", end_utc: "2026-08-10T14:00:00Z" }, as: PressOperator, captures: { bk2: $.data.id, bk2_st: $.data.status } }
            - { call: "POST /plant/press-bookings", payload: { job_id: "${job}", press_id: "${press}", planned_sheets: 60, start_utc: "2026-08-10T11:00:00Z", end_utc: "2026-08-10T13:00:00Z" }, as: PressOperator, captures: { err3: $.data.error_id } }
          assert:
            - "adjacent [12:00,14:00) ACCEPTED: booking created with status SCHEDULED (${bk2_st})"
            - "overlapping [11:00,13:00) rejected: error_id == ERR_PRESS_WINDOW_CONFLICT (${err3}), http 409"
            - "same-press only: the conflict is keyed on press_id, not on job"

      - name: finishing_booking_padded_closed_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_FINISHING_WINDOW_CONFLICT]
          - entities.FinishingLine.fields.setup_buffer_minutes
        distinguishing_aspect: |
          Resource = FinishingLine, semantics = padded closed [start-buffer, end]: a booking starting
          exactly at the prior run's end (12:00) CONFLICTS because its padded start 11:30 < prior end
          12:00 — the same clock adjacency the press resource accepts. Only a start >= 12:30 (padded
          start == 12:00, touching) clears the buffer.
