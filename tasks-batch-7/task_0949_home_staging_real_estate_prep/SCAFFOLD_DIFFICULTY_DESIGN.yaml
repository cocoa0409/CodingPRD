      - name: holdover_tier_boundary_at_day_seven_versus_day_eight
        grounds:
          - calculations.holdover_days
          - calculations.holdover_charge
          - entities.Lease.fields.holdover_charge
          - state_machines.Lease.ENDING_to_HOLDOVER
        distinguishing_aspect: |
          BOUNDARY 3 — a DAY-COUNT tier boundary on a THIRD endpoint (accrue-holdover).
          Seven chargeable days cost 7 * 45.00 = 315.00; the eighth day crosses into tier 2
          and costs 315.00 + 75.00 = 390.00, a 75.00 step that only appears if the tier
          comparison uses <= rather than <.
        test_recipe:
          setup:
            - "The canonical VACANT project, term marked complete at 2026-10-08T09:00:00Z, pickup window ending 2026-10-20T09:00:00Z, no pickup ever completed."
            - "The clock is advanced to 2026-10-30T09:00:00Z: ten elapsed days minus the two-day grace equals eight chargeable days."
          setup_api_calls: *v_staged
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T09:00:00Z" }
