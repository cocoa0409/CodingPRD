            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /exemption-certificates", payload: { registration_id: "${rgn}", customer_reference: "CUST-1", certificate_type: "RESALE", valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: TaxAnalyst, captures: { crt: $.data.id } }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000, customer_reference: "CUST-1" }, as: TaxAnalyst, captures: { ev1: $.data.id } }
            - { call: "POST /taxable-events/${ev1}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000, customer_reference: "CUST-1" }, as: TaxAnalyst, captures: { ev2: $.data.id } }
            - { call: "POST /taxable-events/${ev2}/classify", payload: {}, as: TaxAnalyst }
          trigger:
            - { call: "POST /taxable-events/${ev1}/rate", payload: { exemption_certificate_id: "${crt}" }, as: TaxAnalyst, captures: { err1: $.data.error_id } }
            - { call: "POST /exemption-certificates/${crt}/verify", payload: {}, as: TaxReviewer }
            - { call: "POST /taxable-events/${ev1}/rate", payload: { exemption_certificate_id: "${crt}" }, as: TaxAnalyst, captures: { t1: $.data.tax_cents } }
            - { call: "POST /exemption-certificates/${crt}/revoke", payload: {}, as: TaxReviewer }
            - { call: "POST /taxable-events/${ev2}/rate", payload: { exemption_certificate_id: "${crt}" }, as: TaxAnalyst, captures: { err2: $.data.error_id } }
          assert:
            - "PENDING_VERIFICATION certificate: 409 ERR_CERTIFICATE_NOT_ACTIVE"
            - "ACTIVE certificate: rate succeeds, tax_cents == 0"
            - "REVOKED certificate: 409 ERR_CERTIFICATE_NOT_ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: tax_rate_half_open_window_adjacency
        grounds:
          - validations[priority=20]
          - calculations.rate_window_resolution
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on TaxRate. A new rate
          starting exactly at the prior rate's effective_to is accepted (adjacency allowed),
          while one starting inside the prior window is rejected with ERR_RATE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Jurisdiction CA-BOE; class DIESEL; rate1 [2026-01-01, 2026-09-01) at 24300mc"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: ComplianceAdmin, captures: { rate1: $.data.id } }
          trigger:
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 30000, effective_from: "2026-09-01T00:00:00Z" }, as: ComplianceAdmin, captures: { rate2: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 31000, effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }, as: ComplianceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent create (effective_from == prior effective_to 2026-09-01) succeeds: 201, rate ${rate2} created"
            - "Interior create (2026-08-15 inside [2026-01-01, 2026-09-01)) rejected: 409 ERR_RATE_WINDOW_OVERLAP"

      - name: certificate_closed_interval_gap_required
        grounds:
          - validations[priority=21]
          - entities.ExemptionCertificate.fields.valid_to
        distinguishing_aspect: |
          Interval semantics: CLOSED [valid_from, valid_to] on ExemptionCertificate — different
          geometry than the half-open TaxRate window and a different resource. Two certificates
          for the same (registration, customer_reference, product_class) may not even TOUCH:
          valid_from == prior valid_to is rejected; valid_from == valid_to + 1 day is accepted.
        test_recipe:
          setup:
            - "CA-BOE; registrant; registration (no activation needed for certificate intake)"
            - "cert1 RESALE CUST-9 [2026-03-01, 2026-06-30]"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /exemption-certificates", payload: { registration_id: "${rgn}", customer_reference: "CUST-9", certificate_type: "RESALE", valid_from: "2026-03-01T00:00:00Z", valid_to: "2026-06-30T00:00:00Z" }, as: TaxAnalyst, captures: { crt1: $.data.id } }
          trigger:
            - { call: "POST /exemption-certificates", payload: { registration_id: "${rgn}", customer_reference: "CUST-9", certificate_type: "RESALE", valid_from: "2026-06-30T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: TaxAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /exemption-certificates", payload: { registration_id: "${rgn}", customer_reference: "CUST-9", certificate_type: "RESALE", valid_from: "2026-07-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: TaxAnalyst, captures: { crt2: $.data.id } }
          assert:
            - "Touching windows (valid_from == prior valid_to 2026-06-30): 409 ERR_CERTIFICATE_WINDOW_OVERLAP"
            - "One-day gap (valid_from 2026-07-01): 201 created"

      - name: audit_case_month_bucket_overlap
        grounds:
          - validations[priority=22]
          - entities.AuditCase.fields.period_start
        distinguishing_aspect: |
          Interval semantics: DISCRETE month-bucket ranges on AuditCase — a third geometry
          (neither continuous half-open nor closed-with-gap) on a third resource. Ranges sharing
          any month bucket are rejected; ranges on adjacent buckets ([.., 2026-08] then
          [2026-09, ..]) are accepted.
        test_recipe:
          setup:
            - "CA-BOE; registrant; registration"
            - "Audit case A OPENED covering [2026-06, 2026-08]"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /audit-cases", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", period_start: "2026-06", period_end: "2026-08" }, as: JurisdictionAuditor, captures: { aud1: $.data.id } }
          trigger:
            - { call: "POST /audit-cases", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", period_start: "2026-08", period_end: "2026-10" }, as: JurisdictionAuditor, captures: { err: $.data.error_id } }
            - { call: "POST /audit-cases", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", period_start: "2026-09", period_end: "2026-10" }, as: JurisdictionAuditor, captures: { aud2: $.data.id } }
          assert:
            - "Overlapping range [2026-08, 2026-10] shares bucket 2026-08: 409 ERR_AUDIT_RANGE_OVERLAP"
            - "Adjacent range [2026-09, 2026-10]: 201 created (bucket adjacency is allowed)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: claim_apply_reverse_conserves_return_credit_ledger
        grounds:
          - state_machines.CreditClaim.APPROVED_to_APPLIED
          - state_machines.CreditClaim.APPLIED_to_REVERSED
          - entities.TaxReturn.fields.credits_cents
        distinguishing_aspect: |
          Conserved quantity: the return's monetary credit ledger. Forward apply (+24300 credits)
          paired with a full compensating reverse (-24300) leaves credits_cents == 0 and
          net_due_cents == 26740, exactly the pre-claim values; claim lands in REVERSED.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE registration; one 1000-unit EXPORT event rated; return FILED with no deposits paid (net_due 26740 = 24300 tax + 2430 underpayment penalty)"
            - "EXPORT claim 24300 APPROVED"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_d}", event_date: "2026-08-03T00:00:00Z", quantity_units: 1000, is_export: true }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "POST /returns/${ret}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxReviewer, captures: { v: $.data.version } }
            - { call: "POST /returns/${ret}/file", payload: { expected_return_version: "${v}" }, as: TaxReviewer, as_user_id: "reviewer-1", captures: { nd_pre: $.data.net_due_cents } }
            - { call: "POST /credit-claims", payload: { registration_id: "${rgn}", return_id: "${ret}", claim_type: "EXPORT", claimed_cents: 24300, event_ids: ["${ev}"], justification: "export docs" }, as: TaxAnalyst, captures: { clm: $.data.id } }
            - { call: "POST /credit-claims/${clm}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /credit-claims/${clm}/approve", payload: { approved_cents: 24300 }, as: TaxReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /credit-claims/${clm}/apply", payload: {}, as: TaxAnalyst }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { cr_mid: $.data.credits_cents, nd_mid: $.data.net_due_cents } }
            - { call: "POST /credit-claims/${clm}/reverse", payload: { amount_cents: 24300 }, as: TaxReviewer, as_user_id: "reviewer-2" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxAnalyst, captures: { cr_post: $.data.credits_cents, nd_post: $.data.net_due_cents } }
            - { call: "GET /credit-claims/${clm}", payload: {}, as: TaxAnalyst, captures: { clm_st: $.data.status, clm_rev: $.data.reversed_cents } }
          assert:
            - "Pre-claim net_due_cents == 26740"
            - "After apply: credits_cents == 24300 and net_due_cents == 2440"
            - "After full reverse: credits_cents == 0 and net_due_cents == 26740 (== pre-claim value — invariant restored, no drift)"
            - "Claim status == REVERSED with reversed_cents == 24300 == applied_cents"

      - name: movement_partial_default_conserves_units
        grounds:
          - state_machines.BondedMovement.RECEIVED_to_PARTIAL_DEFAULT
          - entities.BondedMovement.fields.defaulted_quantity_units
        distinguishing_aspect: |
          Conserved quantity: physical units (not money). A 1000-unit movement received at 600
          and then defaulted conserves exactly: quantity_received_units (600) +
          defaulted_quantity_units (400) == quantity_units (1000); the spawned default-assessment
          event carries exactly the 400-unit shortfall (14580 cents at the 36450mc punitive rate).
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc only rate in the jurisdiction (punitive = round_half_up(1.5 x 24300) = 36450mc)"
            - "ACTIVE registration bonded 1500000; 1000-unit DIESEL movement dispatched and partially received (600)"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "DIESEL", description: "Diesel fuel", base_unit: "GALLON" }, as: ComplianceAdmin, captures: { pc_d: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_d}", rate_millicents_per_unit: 24300, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Fuels", fein: "12-3456789" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /bonded-movements", payload: { registration_id: "${rgn}", bond_id: "${bnd}", product_class_id: "${pc_d}", quantity_units: 1000, origin_facility: "TERM-A", destination_facility: "TERM-B" }, as: TaxAnalyst, captures: { mvt: $.data.id } }
            - { call: "POST /bonded-movements/${mvt}/dispatch", payload: {}, as: TaxAnalyst }
            - { call: "POST /bonded-movements/${mvt}/receive", payload: { quantity_received_units: 600 }, as: TaxAnalyst }
          trigger:
            - { call: "POST /bonded-movements/${mvt}/default", payload: {}, as: ComplianceAdmin, captures: { mst: $.data.status, rec: $.data.quantity_received_units, def: $.data.defaulted_quantity_units } }
            - { call: "GET /taxable-events", payload: { bonded_movement_id: "${mvt}" }, as: TaxAnalyst, captures: { evq: "$.data[0].quantity_units", evt: "$.data[0].tax_cents" } }
          assert:
            - "Movement status == PARTIAL_DEFAULT with quantity_received_units == 600 and defaulted_quantity_units == 400"
            - "Conservation: 600 + 400 == 1000 == quantity_units (no units created or destroyed)"
            - "Spawned event: quantity_units == 400 and tax_cents == 14580 (round_half_up(400 x 36450 / 1000))"

      - name: deposit_waterfall_conserves_cash
        grounds:
          - calculations.return_settlement
          - entities.Deposit.fields.applied_amount_cents
          - entities.Registrant.fields.overpayment_balance_cents
        distinguishing_aspect: |
          Conserved quantity: deposit cash through the filing waterfall. A 120000-cent payment
          against a 100000-cent liability splits without loss: applied_amount_cents == 100000 and
          overpayment contribution == 20000; paid == applied + excess holds exactly and the
          registrant's overpayment_balance_cents == 20000.
        test_recipe:
          setup:
            - "CA-BOE; SPIRITS@25000mc; ACTIVE SAFE_HARBOR registration bonded 1500000"
            - "One 4000-unit SPIRITS event rated (tax 100000); depA paid 120000; depB unpaid"
          setup_api_calls:
            - { call: "POST /jurisdictions", payload: { code: "CA-BOE", name: "California", level: "STATE", return_frequency: "MONTHLY", deposit_frequency: "SEMI_MONTHLY" }, as: ComplianceAdmin, captures: { jur: $.data.id } }
            - { call: "POST /product-classes", payload: { code: "SPIRITS", description: "Distilled spirits", base_unit: "PROOF_GALLON" }, as: ComplianceAdmin, captures: { pc_s: $.data.id } }
            - { call: "POST /tax-rates", payload: { jurisdiction_id: "${jur}", product_class_id: "${pc_s}", rate_millicents_per_unit: 25000, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /registrants", payload: { legal_name: "Acme Spirits", fein: "33-3333333" }, as: ComplianceAdmin, captures: { rgt: $.data.id } }
            - { call: "POST /registrations", payload: { registrant_id: "${rgt}", jurisdiction_id: "${jur}", deposit_method: "SAFE_HARBOR" }, as: ComplianceAdmin, captures: { rgn: $.data.id } }
            - { call: "POST /bonds", payload: { registration_id: "${rgn}", surety_name: "SureCo", principal_amount_cents: 1500000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }, as: ComplianceAdmin, captures: { bnd: $.data.id } }
            - { call: "POST /bonds/${bnd}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /registrations/${rgn}/activate", payload: {}, as: ComplianceAdmin }
            - { call: "POST /taxable-events", payload: { registration_id: "${rgn}", jurisdiction_id: "${jur}", product_class_id: "${pc_s}", event_date: "2026-08-03T00:00:00Z", quantity_units: 4000 }, as: TaxAnalyst, captures: { ev: $.data.id } }
            - { call: "POST /taxable-events/${ev}/classify", payload: {}, as: TaxAnalyst }
            - { call: "POST /taxable-events/${ev}/rate", payload: {}, as: TaxAnalyst, captures: { ret: $.data.return_id } }
            - { call: "GET /deposits", payload: { registration_id: "${rgn}", period: "2026-08" }, as: TaxAnalyst, captures: { depA: "$.data[0].id" } }
            - { call: "POST /deposits/${depA}/pay", payload: { amount_cents: 120000 }, as: TaxAnalyst }
            - { call: "POST /returns/${ret}/submit", payload: {}, as: TaxAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /returns/${ret}", payload: {}, as: TaxReviewer, captures: { v: $.data.version } }
          trigger:
            - { call: "POST /returns/${ret}/file", payload: { expected_return_version: "${v}" }, as: TaxReviewer, as_user_id: "reviewer-1", captures: { nd: $.data.net_due_cents, da: $.data.deposits_applied_cents } }
            - { call: "GET /deposits/${depA}", payload: {}, as: TaxAnalyst, captures: { paid: $.data.paid_amount_cents, applied: $.data.applied_amount_cents } }
            - { call: "GET /registrants/${rgt}", payload: {}, as: TaxAnalyst, captures: { over: $.data.overpayment_balance_cents } }
          assert:
            - "Deposit.${depA}: paid_amount_cents == 120000 and applied_amount_cents == 100000"
            - "TaxReturn.${ret}: deposits_applied_cents == 100000, net_due_cents == 0"
            - "Registrant.${rgt}.overpayment_balance_cents == 20000"
            - "Conservation: paid (120000) == applied (100000) + overpayment contribution (20000)"
