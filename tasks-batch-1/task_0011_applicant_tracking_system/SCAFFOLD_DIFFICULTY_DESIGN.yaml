            - "No Interview row is created"

  # ===================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: interview_recommendation_threshold_exact_4_50_strong_hire
        grounds:
          - calculations.interview_recommendation_rule
          - state_machines.Interview.SCHEDULED_to_COMPLETED
          - validations[priority=14]
        distinguishing_aspect: |
          Numeric threshold boundary on /interviews/{id}/complete: aggregate_score exactly == 4.50
          MUST yield STRONG_HIRE (inclusive low end with >=); 4.49 yields HIRE. Two feedback rows
          with scores [4, 5] produce mean exactly 4.50, sitting on the boundary the calculation
          pins as STRONG_HIRE.
        test_recipe:
          setup:
            - "Interview scheduled with panel size 2 (panelist_a, panelist_b)"
            - "panelist_a submits score=4, panelist_b submits score=5 → mean=4.50"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "IntDept", cost_center_code: "INT-001", hiring_budget_cents: 100000000 }
