            - call: "POST /ipa/quality-scorecards"
              payload: { physician_id: "${p_x2}", measurement_period: "2026-H1", hedis_composite_bps: 5000, access_score_bps: 5000, patient_experience_bps: 5000, attributed_member_months: 12, expected_physician_version: "${p_x2_v3}" }
              as: IpaAdmin
              captures: { err_stale_phys: "$.data.error_id" }
            - call: "GET /ipa/quality-scorecards/${sc_x2a}"
              as: IpaAdmin
              captures: { sc_x2a_status_after_reject: "$.data.status" }
            - call: "POST /ipa/quality-scorecards"
              payload: { physician_id: "${p_x2}", measurement_period: "2026-H1", hedis_composite_bps: 5000, access_score_bps: 5000, patient_experience_bps: 5000, attributed_member_months: 12, expected_physician_version: "${p_x2_v4}" }
              as: IpaAdmin
