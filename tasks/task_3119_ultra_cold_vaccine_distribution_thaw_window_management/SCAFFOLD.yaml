      - "status = RECORDED"
      - "every earlier RECORDED verification on the same site with equipment_type ULTRA_COLD_FREEZER → INVALIDATED with invalidated_at set to the logical clock"
      - "storage_site.equipment_certified recomputed"
      - "storage_site.equipment_verification_id recomputed"
  - method: GET
    path: "/vaccine-distribution/site-equipment-verifications"
