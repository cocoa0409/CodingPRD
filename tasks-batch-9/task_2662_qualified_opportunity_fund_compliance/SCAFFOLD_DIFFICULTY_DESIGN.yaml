            - "cascade link 6 — DeferralElection.${elect_id}.status == INCLUDED_FULL, included_amount == 400000.00, included_fraction_total == 1.0000, deferred_remaining == 0.00"
            - "cascade link 7 — Investor.${inv_id}.deferred_gain_outstanding == 0.00 and included_gain_total == 400000.00"
            - "AssetTest.${t1_id}.status == CERTIFIED_FAIL (the earlier test is untouched by the cascade)"

      - name: wcsh_blowout_disqualifies_business_chain
        grounds:
          - state_machines.WorkingCapitalPlan.ACTIVE_to_BLOWN
          - state_machines.QOZBusiness.QUALIFIED_to_DISQUALIFIED
          - calculations.wcsh_pacing_compliance
          - calculations.qozb_prong_evaluation
          - entities.QOZBusiness.fields.blown_unspent_amount
        distinguishing_aspect: |
          Depth-4 cascade with a completely different trigger —
          POST /qof/wcsh-plans/{id}/evaluate-checkpoint — running through the
          working-capital dimension instead of the asset-test dimension:
          checkpoint miss -> plan BLOWN and its protection withdrawn ->
          the unspent balance reappears as the business's NQFP -> the open
          MEASURED BusinessTest is re-measured to an nqfp FAIL -> the business
          is DISQUALIFIED and its QOZB_EQUITY asset demoted. Depth 4 vs the
          depth-7 asset-test chain, and no penalty or inclusion link is touched.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund and one QOZBusiness with declared_nqfp_amount 0.00, total_asset_value 1000000.00 and total_tangible_property_basis 900000.00."
            - "One QOZB_EQUITY FundAsset of 900000.00 pointing at that business."
            - "A WorkingCapitalPlan covering 300000.00 with window_start 2026-01-01 and a 3-month schedule of 100000.00 per month, reference WCSH-PLAN-2026-A, activated so wcsh_protected_amount is 300000.00."
            - "A first BusinessTest at testing_date 2026-03-31 measured and certified PASSED, so the business is QUALIFIED and its equity asset QUALIFIED."
            - "A second BusinessTest at testing_date 2026-06-30 measured with the same inputs and left in MEASURED so the cascade has an open test to re-measure."
            - "Only 20000.00 of OPERATING_WORKING_CAPITAL has actually been spent against the plan."
