  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: batch_balance_invariant_captured_equals_declared
        grounds:
          - entities.RemittanceBatch.fields.captured_item_count
          - entities.RemittanceBatch.fields.captured_total_cents
          - entities.RemittanceBatch.fields.declared_item_count
          - entities.RemittanceBatch.fields.declared_total_cents
          - validations[priority=9]
        distinguishing_aspect: |
          Conserved quantity = batch balance equation: captured_item_count ==
          declared_item_count AND captured_total_cents == declared_total_cents at
          the BALANCED transition. The compensating action pair is
          (capture item) ↔ (return item / force_out_of_balance then resume_capture).
          After a balanced batch, the invariant MUST hold; violating it is rejected.
        test_recipe:
          setup:
            - "Bank, customer, agreement, site LIVE"
            - "Batch declared_item_count=2, declared_total_cents=3000"
            - "One item captured so far (1000c) → batch imbalanced"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
