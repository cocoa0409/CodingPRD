# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8. Instances
# marked excluded_because are covered by the cited SCAFFOLD_DIFFICULTY_DESIGN
# instance and carry no test_recipe. Default logical clock at server start is
# 2026-09-01T00:00:00Z. All list reads return rows created_at ASC.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: candidate_creation_defaults
        claim_type: creation
        grounds: [entities.Candidate, roles.Candidate]
        distinguishing_aspect: "A new candidate starts with status ACTIVE, membership_tier CANDIDATE, version 1, null admission timestamps, and a server-minted UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /actuarial/candidates"
              payload: { email: "fresh@example.com", full_name: "Fresh Candidate" }
              as: Anonymous
              captures: { cid: $.data.id, st: $.data.status, tier: $.data.membership_tier, ver: $.data.version, until: $.data.suspended_until }
          assert:
            - "${st} == ACTIVE and ${tier} == CANDIDATE and ${ver} == 1"
            - "${until} == null and ${cid} is a UUID without any type prefix"
      - name: candidate_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Candidate, "validations[priority=3]"]
        distinguishing_aspect: "Client-supplied system fields (status, membership_tier, version, transfer_credit_hours) are ignored, not honored and not rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /actuarial/candidates"
              payload: { email: "sneaky@example.com", full_name: "Sneaky", status: "EXPELLED", membership_tier: "FELLOW", version: 99, transfer_credit_hours: 1000 }
              as: Anonymous
              captures: { st: $.data.status, tier: $.data.membership_tier, ver: $.data.version, tch: $.data.transfer_credit_hours }
          assert:
            - "creation succeeds (unknown/system fields ignored) with ${st} == ACTIVE, ${tier} == CANDIDATE, ${ver} == 1, ${tch} == 0"
      - name: candidate_email_uniqueness
        claim_type: type_constraints
        grounds: [entities.Candidate.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "The unique email constraint rejects a second registration with the same email while a different email succeeds."
        test_recipe:
          setup: ["one candidate with email dup@example.com"]
          setup_api_calls:
            - call: "POST /actuarial/candidates"
              payload: { email: "dup@example.com", full_name: "First" }
              as: Anonymous
          trigger:
            - call: "POST /actuarial/candidates"
              payload: { email: "dup@example.com", full_name: "Second" }
              as: Anonymous
              captures: { err: $.data.error_id }
            - call: "POST /actuarial/candidates"
              payload: { email: "other@example.com", full_name: "Third" }
              as: Anonymous
              captures: { ok_id: $.data.id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (400) on the duplicate email"
            - "${ok_id} is a non-null id for the distinct email"
      - name: syllabus_credit_map_default_empty
        claim_type: defaults
        grounds: [entities.SyllabusVersion.fields.credit_map]
        distinguishing_aspect: "Omitting credit_map at creation stores the empty object and leaves the version DRAFT."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { cmap: $.data.credit_map, st: $.data.status }
          assert:
            - "${cmap} == {} and ${st} == DRAFT"
      - name: module_cooldown_default_echoed
        claim_type: defaults
        grounds: [entities.Module.fields.cooldown_days, entities.Module.fields.is_capstone]
        distinguishing_aspect: "Omitting cooldown_days and is_capstone stores the defaults 14 and false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /actuarial/modules"
              payload: { module_code: "QFI-M1", track_code: "QFI", sequence_index: 1, title: "QF Module 1", passing_score: 70 }
              as: Registrar
              captures: { cd: $.data.cooldown_days, cap: $.data.is_capstone }
          assert:
            - "${cd} == 14 and ${cap} == false"
      - name: transfer_equivalency_mutual_recognition_tiers
        claim_type: computed_fields
        grounds: [calculations.transfer_equivalency, entities.TransferCreditRequest.fields.agreement_class, entities.TransferCreditRequest.fields.granted_hours]
        distinguishing_aspect: "Mutual-recognition tiers computed at creation: IFOA 40 -> GRANTED 30 (bilateral cap); CIA 25 -> GRANTED 25; CAS 40 -> GRANTED 15 (non-bilateral 50% capped); IAA 20 -> GRANTED 10; OTHER 50 -> DENIED 0."
        test_recipe:
          setup: ["one ACTIVE candidate"]
          setup_api_calls:
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /actuarial/transfer-credit-requests"
              payload: { source_body: "IFOA", claimed_hours: 40 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { r1_status: $.data.status, r1_hours: $.data.granted_hours, r1_class: $.data.agreement_class }
            - call: "POST /actuarial/transfer-credit-requests"
              payload: { source_body: "CIA", claimed_hours: 25 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { r2_hours: $.data.granted_hours }
            - call: "POST /actuarial/transfer-credit-requests"
              payload: { source_body: "CAS", claimed_hours: 40 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { r3_hours: $.data.granted_hours, r3_class: $.data.agreement_class }
            - call: "POST /actuarial/transfer-credit-requests"
              payload: { source_body: "IAA", claimed_hours: 20 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { r4_hours: $.data.granted_hours }
            - call: "POST /actuarial/transfer-credit-requests"
              payload: { source_body: "OTHER", claimed_hours: 50 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { r5_status: $.data.status, r5_hours: $.data.granted_hours }
            - call: "GET /actuarial/candidates/${cand_id}"
              as: Registrar
              captures: { transfer_total: $.data.transfer_credit_hours }
          assert:
            - "${r1_status} == GRANTED, ${r1_class} == BILATERAL, ${r1_hours} == 30 (min(40, 30))"
            - "${r2_hours} == 25 (min(25, 30))"
            - "${r3_class} == NON_BILATERAL, ${r3_hours} == 15 (min(round_half_up(20), 15))"
            - "${r4_hours} == 10 (round_half_up(20 * 0.5))"
            - "${r5_status} == DENIED and ${r5_hours} == 0 (UNRECOGNIZED body)"
            - "${transfer_total} == 70 (30 + 25 + 15 + 10; DENIED contributes 0)"
      - name: listing_pagination_and_status_filter
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, "endpoints[GET /actuarial/exams]"]
        distinguishing_aspect: "Pagination envelope interacts with the status filter: 12 DRAFT exams, limit 5 returns 5 rows with total_count 12 and has_more true; status=ACTIVE returns 0 rows before activation."
        test_recipe:
          setup: ["one DRAFT syllabus with 12 exams E01..E12 (none ACTIVE)"]
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E01", title: "Exam 01", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E02", title: "Exam 02", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E03", title: "Exam 03", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E04", title: "Exam 04", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E05", title: "Exam 05", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E06", title: "Exam 06", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E07", title: "Exam 07", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E08", title: "Exam 08", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E09", title: "Exam 09", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E10", title: "Exam 10", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E11", title: "Exam 11", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
            - call: "POST /actuarial/exams"
              payload: { exam_code: "E12", title: "Exam 12", credit_hours: 1, syllabus_version_id: "${syl_id}" }
              as: Registrar
          trigger:
            - call: "GET /actuarial/exams?limit=5"
              as: Registrar
              captures: { first_code: "$.data[0].exam_code", total: "$.meta.total_count", more: "$.meta.has_more" }
            - call: "GET /actuarial/exams?status=ACTIVE"
              as: Registrar
              captures: { active_total: "$.meta.total_count" }
            - call: "GET /actuarial/exams"
              as: Registrar
              captures: { default_page_total: "$.meta.total_count" }
          assert:
            - "${first_code} == E01 (created_at ASC ordering) and ${total} == 12 and ${more} == true"
            - "${active_total} == 0 (syllabus never activated)"
            - "${default_page_total} == 12 with default limit 10 applied"
      - name: exam_registration_projected_result_computed
        claim_type: computed_fields
        grounds: [entities.ExamRegistration.fields.projected_result]
        excluded_because:
          difficulty_instance: "dual_variant_calc / score_projection_diverges_from_official_result"
          rationale: "projected_result computed pre-publish (PASS under proposed 6.0) and cleared post-publish are both asserted there."
      - name: track_enrollment_completion_pct_computed
        claim_type: computed_fields
        grounds: [entities.TrackEnrollment.fields.completion_pct]
        excluded_because:
          difficulty_instance: "combinatorial_formula / track_completion_pct_two_phase_evaluation"
          rationale: "completion_pct asserted at all four milestones (22.22/44.44/66.67/100.0)."
      - name: exam_window_seats_held_computed
        claim_type: computed_fields
        grounds: [entities.ExamWindow.fields.seats_held, entities.ExamWindow.fields.waitlist_count]
        excluded_because:
          difficulty_instance: "compensating_invariant / seats_held_invariant_under_register_cancel_promote"
          rationale: "seats_held and waitlist_count asserted before and after the cancel+promote pair."
  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: window_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.ExamWindow, "endpoints[POST /actuarial/_clock/set_current_utc]"]
        distinguishing_aspect: "A window whose registration_opens_at equals the default clock (2026-09-01T00:00:00Z) is still SCHEDULED after creation: sweeps run ONLY on clock-set calls, never implicitly."
        test_recipe:
          setup: ["ACTIVE syllabus with exam P; no clock-set call has been made"]
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { st: $.data.status, ver: $.data.version }
          assert:
            - "${st} == SCHEDULED and ${ver} == 1 (no implicit sweep at creation)"
      - name: window_full_sweep_single_mutation
        claim_type: side_effect_execution
        grounds: [state_machines.ExamWindow, entities.ExamWindow.fields.version, state_machines.ExamRegistration.REGISTERED_to_SAT]
        distinguishing_aspect: "One clock-set from before the deadline to past testing_ends_at advances the window REGISTRATION_OPEN -> SCORING as a SINGLE mutation (version +1, not +3) and marks the REGISTERED registration SAT in the same sweep."
        test_recipe:
          setup: ["window REGISTRATION_OPEN (version 2 after the 2026-09-01 sweep) with one REGISTERED registration"]
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { ver_before: $.data.version }
          trigger:
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: Registrar
              captures: { swept: $.data.windows_advanced, sat_count: $.data.registrations_marked_sat }
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { st: $.data.status, ver_after: $.data.version }
            - call: "GET /actuarial/candidates/${cand_id}/registrations"
              as: Registrar
              captures: { reg_logi: "$.data[0].logistics_status", reg_sat_at: "$.data[0].sat_at" }
          assert:
            - "${ver_before} == 2 (creation + open sweep)"
            - "${swept} == 1 and ${st} == SCORING and ${ver_after} == 3 — exactly one version bump for the multi-state jump"
            - "${sat_count} == 1 and ${reg_logi} == SAT and ${reg_sat_at} == 2026-10-13T00:00:00Z"
      - name: registration_after_publish_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ExamWindow, "errors[ERR_WINDOW_NOT_OPEN]"]
        distinguishing_aspect: "After RESULTS_PUBLISHED (terminal) a registration attempt fails with ERR_WINDOW_NOT_OPEN."
        test_recipe:
          setup: ["window fully scored and published (SAT registration released with PASS); a second candidate exists"]
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand1_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand2@example.com", full_name: "Cand Two" }
              as: Anonymous
              captures: { cand2_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations/${reg_id}/record-score"
              payload: { raw_score: 39 }
              as: ExamCommittee
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { win_ver: $.data.version }
            - call: "POST /actuarial/exam-windows/${win_id}/pass-mark-settings"
              payload: { proposed_mark: 6.5, expected_exam_window_version: "${win_ver}" }
              as: ExamCommittee
              captures: { pms_id: $.data.id }
            - call: "POST /actuarial/pass-mark-settings/${pms_id}/ratify"
              payload: { ratified_mark: 6.5 }
              as: ExamCommittee
            - call: "POST /actuarial/pass-mark-settings/${pms_id}/publish"
              payload: {}
              as: ExamCommittee
          trigger:
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_WINDOW_NOT_OPEN (RESULTS_PUBLISHED is terminal for new registrations)"
      - name: registration_cancel_after_release_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ExamRegistration, "errors[ERR_REGISTRATION_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancel on a SAT+RELEASED registration fails with ERR_REGISTRATION_NOT_CANCELLABLE; the registration is unchanged."
        test_recipe:
          setup: ["cand1's registration SAT and RELEASED (result PASS) in a published window"]
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations/${reg_id}/record-score"
              payload: { raw_score: 39 }
              as: ExamCommittee
            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { win_ver: $.data.version }
            - call: "POST /actuarial/exam-windows/${win_id}/pass-mark-settings"
              payload: { proposed_mark: 6.5, expected_exam_window_version: "${win_ver}" }
              as: ExamCommittee
              captures: { pms_id: $.data.id }
            - call: "POST /actuarial/pass-mark-settings/${pms_id}/ratify"
              payload: { ratified_mark: 6.5 }
              as: ExamCommittee
            - call: "POST /actuarial/pass-mark-settings/${pms_id}/publish"
              payload: {}
              as: ExamCommittee
          trigger:
            - call: "POST /actuarial/exam-registrations/${reg_id}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { err: $.data.error_id }
            - call: "GET /actuarial/candidates/${cand_id}/registrations"
              as: Registrar
              captures: { logi: "$.data[0].logistics_status", res: "$.data[0].result" }
          assert:
