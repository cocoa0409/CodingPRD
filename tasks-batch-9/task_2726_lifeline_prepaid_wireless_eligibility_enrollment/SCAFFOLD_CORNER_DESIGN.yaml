      - name: stale_address_version_blocks_the_second_resolution
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.address-resolution-stale-address
          - errors[ERR_STALE_ADDRESS_VERSION]
          - endpoints[POST /lifeline/addresses/{id}/duplicate-resolution]
        distinguishing_aspect: |
          The re-flag path makes this a genuine stale read rather than a state precondition:
          a dwelling resolved as two independent households is legitimately re-flagged when a
          third spelling of the same address arrives, and an administrator holding the
          version returned by the FIRST resolution is refused with ERR_STALE_ADDRESS_VERSION
          even though the row is once again DUPLICATE_FLAGGED and the operation is otherwise
          legal. The re-read then admits the corrected count of 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE carrier."
            - "A1 '1200 N Main St, Apt 4B' and A2 '1200 n. main st., apt 4-b' normalise to the same hash, so both are DUPLICATE_FLAGGED with cohort_address_count 2."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143183", study_area_code: "489183", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { a1_id: $.data.id, a1_hash: $.data.address_hash }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 n. main st.", unit_designator: "apt 4-b", city: "EL PASO", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { a2_id: $.data.id, a2_hash: $.data.address_hash }
            - call: "GET /lifeline/addresses/${a1_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { ver_0: $.data.version, cohort_0: $.data.cohort_address_count }
            - call: "POST /lifeline/addresses/${a1_id}/duplicate-resolution"
              payload: { resolution: "MULTI_HOUSEHOLD", expected_address_version: "${ver_0}", declared_household_count: 2, independent_household_worksheet_ref: "WS-21" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
              captures: { status_1: $.data.status, slots_1: $.data.max_permitted_benefit_slots, ver_stale: $.data.version }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 NORTH MAIN STREET", unit_designator: "APT 4 B", city: "El Paso", state_code: "TX", postal_code: "79901-1234" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { a3_id: $.data.id, a3_hash: $.data.address_hash }
          trigger:
            - call: "POST /lifeline/addresses/${a1_id}/duplicate-resolution"
              payload: { resolution: "MULTI_HOUSEHOLD", expected_address_version: "${ver_stale}", declared_household_count: 3, independent_household_worksheet_ref: "WS-22" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
              captures: { e_stale: $.data.error_id }
            - call: "GET /lifeline/addresses/${a1_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { ver_fresh: $.data.version, status_2: $.data.status, slots_2: $.data.max_permitted_benefit_slots, cohort_2: $.data.cohort_address_count }
            - call: "POST /lifeline/addresses/${a1_id}/duplicate-resolution"
              payload: { resolution: "MULTI_HOUSEHOLD", expected_address_version: "${ver_fresh}", declared_household_count: 3, independent_household_worksheet_ref: "WS-22" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
              captures: { status_3: $.data.status, slots_3: $.data.max_permitted_benefit_slots, ver_final: $.data.version, worksheet_3: $.data.independent_household_worksheet_ref }
          assert:
            - "${a1_hash} == ${a2_hash} == ${a3_hash} == 1200NMAINST|APT4B|ELPASO|TX|79901 and ${cohort_0} == 2"
            - "${status_1} == RESOLVED_MULTI_HOUSEHOLD, ${slots_1} == 2 and ${ver_stale} == ${ver_0} + 1"
            - "the first trigger returns HTTP 412 and ${e_stale} == ERR_STALE_ADDRESS_VERSION"
            - "${status_2} == DUPLICATE_FLAGGED, ${slots_2} == 1 and ${cohort_2} == 3 - the third spelling re-flagged the cohort"
            - "${ver_fresh} == ${ver_stale} + 1"
            - "HouseholdAddress.${a1_id}.declared_household_count == 2 after the refused resolution"
            - "the third trigger returns HTTP 200 with ${status_3} == RESOLVED_MULTI_HOUSEHOLD, ${slots_3} == 3, ${worksheet_3} == WS-22 and ${ver_final} == ${ver_fresh} + 1"
            - "HouseholdAddress.${a2_id}.status == DUPLICATE_FLAGGED and HouseholdAddress.${a3_id}.status == DUPLICATE_FLAGGED - resolving one row does not resolve its cohort peers"

      - name: penalty_rate_tiers_flip_at_exactly_five_hundred_and_fifteen_hundred
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.audit_recoupment_amount
          - calculations.claim_support_amount
        distinguishing_aspect: |
          Both penalty cut-offs are hit EXACTLY, and by construction rather than by luck:
          carrier A's June claim prices at 1000 so one failure in two samples extrapolates to
          exactly PENALTY_TIER_1_CENTS (500) and must take the MID rate 0.10, while carrier
          B's claim prices at 2250 so two failures in three samples extrapolate to exactly
          PENALTY_TIER_2_CENTS (1500) and must take the HIGH rate 0.20. Carrier B is
          adjudicated one sample at a time, so the tier is observed MOVING from MID (750) to
          HIGH (1500) as the cumulative error rate rises - and in neither carrier does the
          extrapolated figure equal the sum of the failed lines (400 vs 500, 1850 vs 1500),
          so a implementation that recoups the actual failed lines gets both wrong.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-02T00:00:00Z, so service month 2026-06 (30 days) is closed."
            - "Carrier A holds two non-tribal BROADBAND enrollments (monthly rate 1200): EA1 from 2026-06-16 (15 days -> 600) and EA2 from 2026-06-21 (10 days -> 400); final_amount_cents 1000."
