scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_refund_guest_vs_operator_variant
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.DEPOSIT_PAID_to_CANCELLED
          - entities.Booking.fields.refund_cents
        distinguishing_aspect: "On the Booking domain, a guest-initiated 30-day cancel yields refund_cents=45225 (0.50 tier), whereas the operator-cancel variant would refund the full 90450; same amount_paid, two algorithms, different money."
        test_recipe:
          setup:
            - "PUBLISHED retreat starting 2026-09-01, base_price_cents=150000, capacity 20, one LODGING room bed_count 4."
            - "A guest books party_size 2 (deposit_cents=90450) and pays the deposit; clock advanced to 2026-08-02 (exactly 30 days before start)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "Calm Coast", theme: "YOGA", location: "Bali", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 20, base_price_cents: 150000 }
              as: Operator
              captures: { retreat_id: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${retreat_id}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${retreat_id}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "g1@x.com", full_name: "G One" }
              as: Anonymous
              captures: { guest_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${retreat_id}", guest_id: "${guest_id}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /v1/bookings/${booking_id}/pay-deposit"
              payload: { amount_cents: 90450 }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /v1/bookings/${booking_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "Booking.${booking_id}.status == CANCELLED"
            - "Booking.${booking_id}.cancelled_by == GUEST"
            - "Booking.${booking_id}.refund_cents == 45225"

      - name: facilitator_payout_flat_vs_per_head_variant
        grounds:
          - calculations.facilitator_payout
          - state_machines.Retreat.PUBLISHED_to_COMPLETED
          - entities.Facilitator.fields.payout_cents
        distinguishing_aspect: "On the Facilitator domain, the final per_head payout_cents=6000 (PER_HEAD_CENTS 3000 * 2 attendees) diverges from the provisional per_session_flat value 40000 (FACILITATOR_FLAT_CENTS * 1 slot) for the same schedule."
        test_recipe:
          setup:
            - "PUBLISHED retreat with a LODGING room and a COMMON room; one ACTIVE facilitator scheduled for one slot."
            - "One guest booking party_size 2 taken all the way to CONFIRMED (deposit + cleared waiver + balance); clock advanced past end_date; retreat COMPLETED."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "Renew", theme: "DETOX", location: "Ojai", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 20, base_price_cents: 150000 }
              as: Operator
              captures: { retreat_id: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${retreat_id}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "L1" }
              as: Operator
              captures: { lodge_id: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${retreat_id}", kind: "COMMON", tier: "STANDARD", tier_delta_cents: 0, bed_count: 0, label: "Hall" }
              as: Operator
              captures: { common_id: $.data.id }
            - call: "POST /v1/facilitators"
              payload: { full_name: "Fac A", email: "fa@x.com", specialty: "Vinyasa" }
              as: Operator
              captures: { fac_id: $.data.id }
            - call: "POST /v1/retreats/${retreat_id}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "g2@x.com", full_name: "G Two" }
              as: Anonymous
              captures: { guest_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${retreat_id}", guest_id: "${guest_id}", room_id: "${lodge_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /v1/bookings/${booking_id}/pay-deposit"
              payload: { amount_cents: 90450 }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /v1/waivers"
              payload: { booking_id: "${booking_id}", health_disclosures: "none" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { waiver_id: $.data.id }
            - call: "POST /v1/waivers/${waiver_id}/sign"
              payload: { signature_name: "G Two" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /v1/waivers/${waiver_id}/review"
              payload: { decision: "CLEAR" }
              as: Operator
            - call: "POST /v1/bookings/${booking_id}/pay-balance"
              payload: { amount_cents: 211050 }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /v1/activity-slots"
              payload: { retreat_id: "${retreat_id}", facilitator_id: "${fac_id}", room_id: "${common_id}", title: "Sunrise", start_datetime: "2026-09-02T09:00:00Z", end_datetime: "2026-09-02T10:00:00Z" }
              as: Operator
              captures: { slot_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /v1/retreats/${retreat_id}/complete"
              payload: {}
              as: Operator
          assert:
            - "Facilitator.${fac_id}.payout_cents == 6000"
            - "Booking.${booking_id}.status == CONFIRMED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booking_total_nonlinear_tiered_mode_a
        grounds:
          - calculations.booking_total_charge
          - entities.Booking.fields.total_cents
          - entities.Booking.fields.group_discount_pct
        distinguishing_aspect: "Mode (a): a non-linear formula with >=3 inputs (base_price*party, room tier delta, add-on price, party-size-tiered discount, conditional diet surcharge) yields total_cents=570250 and group_discount_pct=0.15 for party_size 4."
        test_recipe:
          setup:
            - "PUBLISHED retreat base_price_cents=150000; one LODGING PRIVATE room tier_delta_cents=40000 bed_count 4; a SPA add-on priced 25000."
            - "A guest books party_size 4 with has_special_diet=true, then attaches the SPA add-on (recomputing charges)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "Deep", theme: "DETOX", location: "Sedona", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 20, base_price_cents: 150000 }
              as: Operator
              captures: { retreat_id: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${retreat_id}", kind: "LODGING", tier: "PRIVATE", tier_delta_cents: 40000, bed_count: 4, label: "Suite" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${retreat_id}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "g3@x.com", full_name: "G Three" }
              as: Anonymous
              captures: { guest_id: $.data.id }
            - call: "POST /v1/addons"
              payload: { name: "Deep Tissue", category: "SPA", price_cents: 25000 }
              as: Operator
              captures: { addon_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${retreat_id}", guest_id: "${guest_id}", room_id: "${room_id}", party_size: 4, has_special_diet: true, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /v1/booking-addons"
              payload: { booking_id: "${booking_id}", addon_id: "${addon_id}" }
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "Booking.${booking_id}.subtotal_cents == 665000"
            - "Booking.${booking_id}.group_discount_pct == 0.15"
            - "Booking.${booking_id}.discount_cents == 99750"
            - "Booking.${booking_id}.special_diet_surcharge_cents == 5000"
            - "Booking.${booking_id}.total_cents == 570250"

      - name: booking_tax_per_line_rounding_mode_b
        grounds:
          - calculations.booking_tax
          - entities.Booking.fields.tax_cents
          - entities.Booking.fields.grand_total_cents
        distinguishing_aspect: "Mode (b): rounding order pinned to per-line-then-sum — three 202-cent line items at TAX_PCT 0.085 give tax_cents=51 (round(17.17)*3), NOT 52 (round(51.51) from sum-then-round)."
        test_recipe:
          setup:
            - "PUBLISHED retreat base_price_cents=202; one LODGING room tier_delta_cents=202 bed_count 4; a MEAL add-on priced 202."
            - "A guest books party_size 1, then attaches the 202-cent add-on producing three equal 202-cent pre-discount line items."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "Tiny", theme: "SILENT", location: "Taos", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 20, base_price_cents: 202 }
              as: Operator
              captures: { retreat_id: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${retreat_id}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 202, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${retreat_id}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "g4@x.com", full_name: "G Four" }
              as: Anonymous
              captures: { guest_id: $.data.id }
            - call: "POST /v1/addons"
              payload: { name: "Box Lunch", category: "MEAL", price_cents: 202 }
              as: Operator
              captures: { addon_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${retreat_id}", guest_id: "${guest_id}", room_id: "${room_id}", party_size: 1, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /v1/booking-addons"
              payload: { booking_id: "${booking_id}", addon_id: "${addon_id}" }
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "Booking.${booking_id}.subtotal_cents == 606"
            - "Booking.${booking_id}.tax_cents == 51"
            - "Booking.${booking_id}.grand_total_cents == 657"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: retreat_full_publish_capacity_cycle
        grounds:
          - state_machines.Retreat.PUBLISHED_to_FULL
          - state_machines.Retreat.FULL_to_PUBLISHED
          - entities.Retreat.fields.reserved_count
        distinguishing_aspect: "Retreat cycles PUBLISHED->FULL->PUBLISHED: a party_size-2 booking on a capacity-2 retreat drives status to FULL, and cancelling it returns status to PUBLISHED (a genuine A->B->A loop, not a linear pipeline)."
        test_recipe:
          setup:
            - "PUBLISHED retreat capacity 2 with one LODGING room bed_count 2; a guest books party_size 2 so reserved_count becomes 2 == capacity and status becomes FULL."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "Small", theme: "YOGA", location: "Kauai", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 2, base_price_cents: 150000 }
              as: Operator
              captures: { retreat_id: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${retreat_id}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 2, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${retreat_id}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "g5@x.com", full_name: "G Five" }
              as: Anonymous
              captures: { guest_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${retreat_id}", guest_id: "${guest_id}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings/${booking_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "Retreat.${retreat_id}.status == PUBLISHED"
            - "Retreat.${retreat_id}.reserved_count == 0"

      - name: booking_branch_pending_to_cancelled_divergent
        grounds:
          - state_machines.Booking.PENDING_DEPOSIT_to_CANCELLED
          - state_machines.Booking.PENDING_DEPOSIT_to_DEPOSIT_PAID
          - entities.Booking.fields.refund_cents
        distinguishing_aspect: "Booking forks from PENDING_DEPOSIT into {DEPOSIT_PAID, CANCELLED} with divergent side-effect sets: the CANCELLED branch from an unpaid booking releases beds and yields refund_cents=0 (no Payment), unlike the deposit branch."
        test_recipe:
          setup:
            - "PUBLISHED retreat capacity 20, LODGING room bed_count 4; a guest creates a party_size-2 booking that stays PENDING_DEPOSIT (no deposit paid)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "Fork", theme: "YOGA", location: "Maui", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 20, base_price_cents: 150000 }
              as: Operator
              captures: { retreat_id: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${retreat_id}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${retreat_id}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "g6@x.com", full_name: "G Six" }
              as: Anonymous
              captures: { guest_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${retreat_id}", guest_id: "${guest_id}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /v1/bookings/${booking_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
          assert:
            - "Booking.${booking_id}.status == CANCELLED"
            - "Booking.${booking_id}.refund_cents == 0"
            - "Room.${room_id}.reserved_beds == 0"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: retreat_cancel_cascade_to_shuttle_depth3
        grounds:
          - state_machines.Retreat.PUBLISHED_to_CANCELLED
          - state_machines.Booking.DEPOSIT_PAID_to_CANCELLED
          - state_machines.TransportSegment.BOOKED_to_CANCELLED
          - entities.Shuttle.fields.reserved_seats
        distinguishing_aspect: "Depth-3 chain from retreat cancel: Retreat->CANCELLED causes Booking->CANCELLED, which causes its TransportSegment->CANCELLED, which decrements Shuttle.reserved_seats to 0 — each hop caused by the prior one."
        test_recipe:
          setup:
            - "PUBLISHED retreat, LODGING room bed 4, a party_size-2 booking with deposit paid, a shuttle seat_capacity 4, and a transport segment reserving 2 seats (reserved_seats=2)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "Casc", theme: "YOGA", location: "Tulum", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 20, base_price_cents: 150000 }
              as: Operator
              captures: { retreat_id: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${retreat_id}", kind: "LODGING", tier: "STANDARD", tier_delta_cents: 0, bed_count: 4, label: "R1" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/retreats/${retreat_id}/publish"
              payload: {}
              as: Operator
              captures: { rv: $.data.version }
            - call: "POST /v1/guests"
              payload: { email: "g7@x.com", full_name: "G Seven" }
              as: Anonymous
              captures: { guest_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { retreat_id: "${retreat_id}", guest_id: "${guest_id}", room_id: "${room_id}", party_size: 2, expected_retreat_version: "${rv}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /v1/bookings/${booking_id}/pay-deposit"
              payload: { amount_cents: 90450 }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /v1/shuttles"
              payload: { retreat_id: "${retreat_id}", direction: "ARRIVAL", depart_datetime: "2026-08-31T12:00:00Z", seat_capacity: 4 }
              as: Operator
              captures: { shuttle_id: $.data.id }
            - call: "POST /v1/transport-segments"
              payload: { booking_id: "${booking_id}", shuttle_id: "${shuttle_id}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /v1/retreats/${retreat_id}/cancel"
              payload: {}
              as: Operator
          assert:
            - "Booking.${booking_id}.status == CANCELLED"
            - "Booking.${booking_id}.cancelled_by == OPERATOR"
            - "Booking.${booking_id}.refund_cents == 90450"
            - "TransportSegment.${seg_id}.status == CANCELLED"
            - "Shuttle.${shuttle_id}.reserved_seats == 0"

      - name: facilitator_withdraw_cascade_to_schedule_depth2
        grounds:
          - state_machines.Facilitator.ACTIVE_to_WITHDRAWN
          - state_machines.ActivitySlot.SCHEDULED_to_CANCELLED
          - entities.Retreat.fields.schedule_ready
        distinguishing_aspect: "Depth-2 chain from a different trigger (facilitator withdraw): Facilitator->WITHDRAWN causes its only SCHEDULED ActivitySlot->CANCELLED, which causes Retreat.schedule_ready to recompute to false."
        test_recipe:
          setup:
            - "A retreat with a COMMON room and an ACTIVE facilitator leading exactly one SCHEDULED activity slot (schedule_ready=true)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
              payload: { name: "Sched", theme: "YOGA", location: "Big Sur", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-08T00:00:00Z", capacity: 20, base_price_cents: 150000 }
              as: Operator
              captures: { retreat_id: $.data.id }
            - call: "POST /v1/rooms"
              payload: { retreat_id: "${retreat_id}", kind: "COMMON", tier: "STANDARD", tier_delta_cents: 0, bed_count: 0, label: "Studio" }
              as: Operator
              captures: { room_id: $.data.id }
            - call: "POST /v1/facilitators"
              payload: { full_name: "Fac B", email: "fb@x.com", specialty: "Breathwork" }
              as: Operator
              captures: { fac_id: $.data.id }
            - call: "POST /v1/activity-slots"
              payload: { retreat_id: "${retreat_id}", facilitator_id: "${fac_id}", room_id: "${room_id}", title: "Breath", start_datetime: "2026-09-02T09:00:00Z", end_datetime: "2026-09-02T10:00:00Z" }
              as: Operator
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /v1/facilitators/${fac_id}/withdraw"
              payload: {}
              as: Operator
          assert:
            - "Facilitator.${fac_id}.status == WITHDRAWN"
            - "ActivitySlot.${slot_id}.status == CANCELLED"
            - "Retreat.${retreat_id}.schedule_ready == false"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_pay_balance
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.Booking.DEPOSIT_PAID_to_CANCELLED
        distinguishing_aspect: "State (priority 5) beats business_fiscal (priority 10): paying the balance on an already-CANCELLED booking with a wrong amount returns ERR_INVALID_STATE, not ERR_PAYMENT_AMOUNT_MISMATCH."
        test_recipe:
          setup:
            - "A booking with deposit paid, then cancelled by the guest (status CANCELLED)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Operator
            - call: "POST /v1/retreats"
