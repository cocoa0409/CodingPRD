  - section: endpoints
    instances:

      - name: production_lot_list_composes_filters_and_pages_in_created_at_order
        claim_type: standard_crud
        grounds:
          - endpoints[GET /production-lots]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Six filters (product_id, rod_lot_id, order_id, line_code, process_state, quality_state) compose freely on one collection that is ordered created_at ASC - the opposite of the quote list - and total_count always describes the filtered set, so an offset page reports 3 while returning 1 row and an empty filter result reports total_count 0 rather than 404."
        test_recipe:
          setup:
            - "One SKU THHN-12-CU, one COPPER rod lot of 20000 lbs, one order SO-1001 for 5.000 kft."
            - "Three lots of 1000 ft created in order: LOT-1 (line EXT-1, order-linked, advanced to DRAWN), LOT-2 (line EXT-2, no order, left QUEUED), LOT-3 (line EXT-1 in a non-overlapping window, order-linked, advanced to DRAWN)."
