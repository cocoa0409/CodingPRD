            - "closing the AWARDED solicitation fails 409 ERR_SOLICITATION_NOT_OPEN; Solicitation.${sol_tx_id}.status stays AWARDED"
            - "ProductionLine.${line_a1_id}.committed_slot_days == 0 — releasing a PLANNED slot subtracts nothing"
            - "BusUnit.${unit_tx_id}.production_status is still PLANNED (it was never SLOTTED)"

      - name: publishing_a_published_profile_twice_reports_profile_not_draft
        claim_type: idempotency
        grounds:
          - state_machines.StateSpecProfile.DRAFT_to_PUBLISHED
          - validations[priority=21]
          - errors[ERR_PROFILE_NOT_DRAFT]
          - entities.StateSpecProfile.fields.published_at
        distinguishing_aspect: |
          publish is a one-shot transition, not an idempotent upsert: the second call on the same profile
          is refused with ERR_PROFILE_NOT_DRAFT and — crucially — published_at keeps its first value
          2026-08-15T00:00:00Z even though the logical clock has since moved to 2026-09-01, proving the
          refusal executed no side effect.
        test_recipe:
          setup:
            - "One DRAFT StateSpecProfile NV 2026-2027 published once at clock 2026-08-15, clock then advanced to 2026-09-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /state-spec-profiles"
              payload: { state_code: "NV", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 75.0, terrain_class: "FLAT" }
