  # ===========================================================================
  - section: rbac
    instances:

      - name: each_role_is_refused_another_roles_exclusive_operation
        claim_type: exclusive_operations
        grounds:
          - roles.ProgramAdministrator.exclusive_operations
          - roles.InventoryAnalyst.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.FieldTechnician.exclusive_operations
          - roles.CustomerRepresentative.exclusive_operations
          - roles.ReplacementContractor.exclusive_operations
        distinguishing_aspect: "Six cross-role attempts each return ERR_UNAUTHORIZED 403, and the four that address an unassigned UUID prove the priority-20 authorization check runs BEFORE the priority-40 existence check (403, never 404)."
        test_recipe:
          setup:
            - "Empty database; every path id below is deliberately an unassigned UUID where one is needed."
          setup_api_calls: []
          trigger:
