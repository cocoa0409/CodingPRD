              as: MountainOpsDirector
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/lift-staff-assignments/00000000-0000-0000-0000-0000000000ff/release"
              payload: {  }
              as: LiftOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 404 with data.error_id == 'ERR_SEASON_NOT_FOUND'."
            - "Trigger 2: HTTP 404 with data.error_id == 'ERR_LIFT_NOT_FOUND'."
            - "Trigger 3: HTTP 404 with data.error_id == 'ERR_TERRAIN_AREA_NOT_FOUND'."
            - "Trigger 4: HTTP 404 with data.error_id == 'ERR_PUMP_HOUSE_NOT_FOUND'."
            - "Trigger 5: HTTP 404 with data.error_id == 'ERR_SESSION_NOT_FOUND'."
            - "Trigger 6: HTTP 404 with data.error_id == 'ERR_GROOMING_TASK_NOT_FOUND'."
            - "Trigger 7: HTTP 404 with data.error_id == 'ERR_PATROLLER_NOT_FOUND'."
            - "Trigger 8: HTTP 404 with data.error_id == 'ERR_MISSION_NOT_FOUND'."
            - "Trigger 9: HTTP 404 with data.error_id == 'ERR_INCIDENT_NOT_FOUND'."
            - "Trigger 10: HTTP 404 with data.error_id == 'ERR_DAY_PLAN_NOT_FOUND'."
            - "Trigger 11: HTTP 404 with data.error_id == 'ERR_RESERVATION_NOT_FOUND'."
            - "Trigger 12: HTTP 404 with data.error_id == 'ERR_SEASON_NOT_FOUND' - the derived snow-accounting read resolves its {id} exactly like the plain season read, and does not return a zero-filled report."
            - "Trigger 13: HTTP 404 with data.error_id == 'ERR_STAFF_ASSIGNMENT_NOT_FOUND' - not ERR_WORKFLOW_STATE_INVALID, because priority 3 runs before priority 15."
            - "All thirteen responses carry twelve DISTINCT error_id values, so no shared 404 constant can satisfy the set."
            - "None of the thirteen triggers reports the generic ERR_RECORD_NOT_FOUND: that id is the priority-3 umbrella declared for a templated segment whose entity family has no typed id of its own, and every templated segment in section 1.5 belongs to one of the twelve families."

      - name: a_body_foreign_key_from_another_season_is_a_cross_season_error_while_a_bogus_one_is_a_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CROSS_SEASON_REFERENCE]
          - errors[ERR_SEASON_NOT_FOUND]
          - errors[ERR_LIFT_NOT_FOUND]
          - validations[priority=4]
          - entities.TerrainArea.fields.serving_lift_id
        distinguishing_aspect: |
          Priority 4 does two different things in one rule: an unresolvable body FK is a 404 with that
          family's typed id, while a FK that resolves perfectly but belongs to a different season is a 422
          ERR_CROSS_SEASON_REFERENCE. The two are indistinguishable to a naive existence check, and the
          declaration order matters too - with BOTH season_id and serving_lift_id bogus the reported id
          must be the season's, because the rule resolves body FKs in declaration order. The final two
          triggers prove the cross-season rule is not a blanket ban: the identical shapes succeed once both
          FKs live in the same season.
