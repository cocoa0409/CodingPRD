          setup:
            - "chain_l3 is replayed, then the trigger head drafts and submits the large-cap replacement exactly as chain_l5 does."
          setup_api_calls: *chain_l3
          trigger:
            - *b_plan_v_read
            - *b_prop_lc
            - *b_prop_submit
            - call: "POST /governance/fund-replacements/${prop_lc_id}/submit"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "the response status is 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "FundReplacementProposal.${prop_lc_id}.status is still UNDER_REVIEW with pinned_ips_id == ${ips_a_id}"
            - "Plan.${plan_id}.draft_proposal_count == 1, matching count(status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, BLOCKED})"
            - "GET /governance/fund-replacements?plan_id=${plan_id}&status=UNDER_REVIEW returns exactly one row, ${prop_lc_id}"

      - name: finalize_drives_the_four_hop_breach_cascade_to_a_restricted_posture
