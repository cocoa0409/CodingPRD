            - call: "POST /wells"
              payload: { storage_field_id: "${f2}", well_name: "TWO-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
