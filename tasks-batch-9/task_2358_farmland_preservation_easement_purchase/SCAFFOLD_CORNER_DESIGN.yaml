  # ===========================================================================
  - section: calculations
    instances:

      - name: installment_schedule_floors_annual_payments_and_lands_the_residue_on_the_final_year
        claim_type: Correct Result
        grounds:
          - calculations.installment_schedule_split
          - state_machines.Application.RANKED_to_OFFER_ISSUED.side_effects
          - entities.Application.fields.installment_years
        distinguishing_aspect: "An INSTALLMENT offer of 175,550,000 carries donation_pct 0, so the total is 178,183,250; over six years annual FLOORS to 29,697,208, the final year absorbs the two-cent residue at 29,697,210 so annual*(n-1) + final reconstructs the total exactly, and interest uses the average-balance shortcut once: round_half_up(178,183,250 * 0.0275 * 5 / 2) = 12,250,098."
        test_recipe:
          setup:
            - "Application AP1 is RANKED with certified_easement_value_cents 175,550,000. Clock 2026-10-05."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
          trigger:
            - call: "POST /applications/${app_a_id}/offers"
              payload: { expected_application_version: "${app_a_v1}", offer_cents: 175550000, structure: "INSTALLMENT", installment_years: 6, offer_expires_on: "2026-11-19T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
          assert:
            - "the trigger returns HTTP 200 with Application.${app_a_id}.status == OFFER_ISSUED"
            - "Application.${app_a_id}.structure == INSTALLMENT and installment_years == 6 and donation_pct == 0"
            - "Application.${app_a_id}.donation_cents == 0"
            - "Application.${app_a_id}.bargain_sale_price_cents == 175550000"
            - "Application.${app_a_id}.admin_fee_cents == 2633250"
            - "Application.${app_a_id}.total_program_cost_cents == 178183250"
            - "Application.${app_a_id}.first_installment_cents == 29697208"
            - "Application.${app_a_id}.final_installment_cents == 29697210"
            - "Application.${app_a_id}.installment_interest_total_cents == 12250098"

      - name: waterfall_skips_sources_by_status_and_by_obligation_window
