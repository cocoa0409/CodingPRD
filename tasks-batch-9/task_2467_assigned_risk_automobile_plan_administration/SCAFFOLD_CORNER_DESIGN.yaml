# =============================================================================
# 2467. Assigned Risk Automobile Plan Administration - SCAFFOLD_CORNER_DESIGN
# 1.9 breadth probe. Sections and claim_type values come from
# references/claim-extraction-guide.md; corners already asserted by a named
# 1.8 instance carry an excluded_because stub instead of a test_recipe.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: carrier_enrolment_returns_envelope_with_system_and_computed_defaults
        claim_type: creation
        grounds:
          - entities.Carrier
          - endpoints[POST /plan/carriers]
          - response_envelope.success
        distinguishing_aspect: |
          First write against an empty database: every system and computed Carrier field must be
          server-minted (enrollment_sequence 1, status ACTIVE, performance_score 100, posture OPEN,
          all counters zero, version 1) and the payload must be echoed back inside the declared
          envelope, not at the top level.
        test_recipe:
          setup:
            - "Empty database; the logical clock has been set to 2026-09-01."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /plan/carriers"
              payload: { name: "Atlas Mutual", naic_code: "11111", voluntary_market_share_bps: 6000, licensed_territories: ["T01", "T02"] }
              as: PlanAdministrator
              captures: { c1_id: $.data.id }
          assert:
            - "the response is 201 and carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "data.name == Atlas Mutual, data.naic_code == 11111, data.voluntary_market_share_bps == 6000, data.licensed_territories == [T01, T02]"
            - "Carrier.${c1_id}.enrollment_sequence == 1 and Carrier.${c1_id}.status == ACTIVE"
            - "Carrier.${c1_id}.performance_score == 100 and Carrier.${c1_id}.posture == OPEN"
            - "Carrier.${c1_id}.assigned_risk_count == 0 and Carrier.${c1_id}.voluntary_credit_units == 0.0 and Carrier.${c1_id}.penalty_balance_cents == 0"
            - "Carrier.${c1_id}.quota_target_units == 0 and Carrier.${c1_id}.overallocated == false"
            - "Carrier.${c1_id}.version == 1 and Carrier.${c1_id}.created_at == 2026-09-01T00:00:00.000Z"
      - name: applicant_read_returns_stored_input_plus_derived_clean_years
        claim_type: retrieval
        grounds:
          - entities.Applicant
          - endpoints[GET /plan/applicants/{id}]
          - calculations.clean_years_credited
        distinguishing_aspect: |
          A plain read must return the stored input fields unchanged AND the derived record fields:
          with no violations and no at-fault claims the clean-years clock runs from
          first_licensed_date and is capped at 5, and voluntary_market_eligible is false until an
          exit actually happens.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; one applicant exists, first licensed 2010-06-01, with no applications, violations or claims."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /plan/applicants"
              payload: { full_name: "Owen Pike", driver_license_number: "D-99011", territory_code: "T02", driver_class: "ADULT", first_licensed_date: "2010-06-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { a1_id: $.data.id }
          trigger:
            - call: "GET /plan/applicants/${a1_id}"
              as: ComplianceExaminer
              as_user_id: "EX-1"
          assert:
            - "the response is 200 with data.full_name == Owen Pike and data.driver_license_number == D-99011"
            - "Applicant.${a1_id}.territory_code == T02 and Applicant.${a1_id}.driver_class == ADULT"
            - "Applicant.${a1_id}.last_chargeable_event_date == 2010-06-01T00:00:00Z"
            - "Applicant.${a1_id}.clean_years_credited == 5 (CLEAN_YEARS_CAP, not 16)"
            - "Applicant.${a1_id}.voluntary_market_eligible == false"
      - name: application_listing_pages_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Application
          - endpoints[GET /plan/applications]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Pagination metadata must describe the whole filtered set, not the page: three applications
          read with limit 2 report total_count 3 and has_more true on the first page and has_more
          false on the second, and the rows arrive in intake_sequence order rather than by id.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; three applications exist for the same producer, created in the order Owen Pike, Nadia Frost, Iris Bell (intake_sequence 1, 2, 3)."
            - "All three are SUBMITTED with two market rejections and a 38939-cent deposit each."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /plan/carriers"
              payload: { name: "Atlas Mutual", naic_code: "11111", voluntary_market_share_bps: 6000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /plan/carriers"
              payload: { name: "Beacon Casualty", naic_code: "22222", voluntary_market_share_bps: 4000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c2_id: $.data.id }
            - call: "POST /plan/producers"
              payload: { name: "Harbor Agency", license_number: "PL-4471", appointed_territories: ["T01", "T02", "T03"] }
              as: PlanAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /plan/plan-periods"
              payload: { period_code: "2026-P3", window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-30T00:00:00Z", underserved_territories: ["T03"] }
              as: PlanAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /plan/applicants"
              payload: { full_name: "Owen Pike", driver_license_number: "D-99011", territory_code: "T02", driver_class: "ADULT", first_licensed_date: "2010-06-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /plan/applicants/${a1_id}/vehicles"
              payload: { vin: "1HGCM82633A004360", vehicle_class_code: "PLEASURE", garaging_territory_code: "T02", model_year: 2019 }
              as: PlanAdministrator
              captures: { v1_id: $.data.id }
            - call: "POST /plan/applications"
              payload: { applicant_id: "${a1_id}", producer_id: "${p1_id}", vehicle_id: "${v1_id}", requested_effective_date: "2026-09-15T00:00:00Z", declared_violations: [] }
              as: ProducerAgent
              as_user_id: "${p1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /plan/applications/${app1_id}/market-rejections"
              payload: { rejecting_carrier_naic_code: "11111", rejection_date: "2026-08-10T00:00:00Z", reason_code: "UNACCEPTABLE_DRIVING_RECORD", document_reference: "DEC-30-1" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app1_id}/market-rejections"
              payload: { rejecting_carrier_naic_code: "22222", rejection_date: "2026-08-12T00:00:00Z", reason_code: "UNDERWRITING_GUIDELINES", document_reference: "DEC-30-2" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app1_id}/mvr-verification"
              payload: { verified_violations: [] }
              as: ComplianceExaminer
              as_user_id: "EX-1"
            - call: "POST /plan/applications/${app1_id}/deposit"
              payload: { amount_cents: 38939 }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applicants"
              payload: { full_name: "Nadia Frost", driver_license_number: "D-99012", territory_code: "T02", driver_class: "ADULT", first_licensed_date: "2010-06-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { a2_id: $.data.id }
            - call: "POST /plan/applicants/${a2_id}/vehicles"
              payload: { vin: "1HGCM82633A004361", vehicle_class_code: "PLEASURE", garaging_territory_code: "T02", model_year: 2019 }
              as: PlanAdministrator
              captures: { v2_id: $.data.id }
            - call: "POST /plan/applications"
              payload: { applicant_id: "${a2_id}", producer_id: "${p1_id}", vehicle_id: "${v2_id}", requested_effective_date: "2026-09-15T00:00:00Z", declared_violations: [] }
              as: ProducerAgent
              as_user_id: "${p1_id}"
              captures: { app2_id: $.data.id }
            - call: "POST /plan/applications/${app2_id}/market-rejections"
              payload: { rejecting_carrier_naic_code: "11111", rejection_date: "2026-08-10T00:00:00Z", reason_code: "UNACCEPTABLE_DRIVING_RECORD", document_reference: "DEC-31-1" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app2_id}/market-rejections"
              payload: { rejecting_carrier_naic_code: "22222", rejection_date: "2026-08-12T00:00:00Z", reason_code: "UNDERWRITING_GUIDELINES", document_reference: "DEC-31-2" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app2_id}/mvr-verification"
              payload: { verified_violations: [] }
              as: ComplianceExaminer
              as_user_id: "EX-1"
            - call: "POST /plan/applications/${app2_id}/deposit"
              payload: { amount_cents: 38939 }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applicants"
              payload: { full_name: "Iris Bell", driver_license_number: "D-99013", territory_code: "T02", driver_class: "ADULT", first_licensed_date: "2010-06-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { a3_id: $.data.id }
            - call: "POST /plan/applicants/${a3_id}/vehicles"
              payload: { vin: "1HGCM82633A004362", vehicle_class_code: "PLEASURE", garaging_territory_code: "T02", model_year: 2019 }
              as: PlanAdministrator
              captures: { v3_id: $.data.id }
            - call: "POST /plan/applications"
              payload: { applicant_id: "${a3_id}", producer_id: "${p1_id}", vehicle_id: "${v3_id}", requested_effective_date: "2026-09-15T00:00:00Z", declared_violations: [] }
              as: ProducerAgent
              as_user_id: "${p1_id}"
              captures: { app3_id: $.data.id }
            - call: "POST /plan/applications/${app3_id}/market-rejections"
              payload: { rejecting_carrier_naic_code: "11111", rejection_date: "2026-08-10T00:00:00Z", reason_code: "UNACCEPTABLE_DRIVING_RECORD", document_reference: "DEC-32-1" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app3_id}/market-rejections"
              payload: { rejecting_carrier_naic_code: "22222", rejection_date: "2026-08-12T00:00:00Z", reason_code: "UNDERWRITING_GUIDELINES", document_reference: "DEC-32-2" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications/${app3_id}/mvr-verification"
              payload: { verified_violations: [] }
              as: ComplianceExaminer
              as_user_id: "EX-1"
            - call: "POST /plan/applications/${app3_id}/deposit"
              payload: { amount_cents: 38939 }
              as: ProducerAgent
              as_user_id: "${p1_id}"
          trigger:
            - call: "GET /plan/applications?producer_id=${p1_id}&limit=2&offset=0"
              as: PlanAdministrator
            - call: "GET /plan/applications?producer_id=${p1_id}&limit=2&offset=2"
              as: PlanAdministrator
          assert:
            - "the first page returns 200 with response_type == array, total_count == 3, has_more == true and exactly 2 rows"
            - "the first page rows are Application.${app1_id} then Application.${app2_id} (intake_sequence 1 then 2)"
            - "the second page returns total_count == 3, has_more == false and exactly 1 row, Application.${app3_id}"
            - "Application.${app3_id}.intake_sequence == 3"
      - name: unknown_identifiers_return_entity_scoped_not_found_errors
        claim_type: not_found
        grounds:
          - errors[ERR_CARRIER_NOT_FOUND]
          - errors[ERR_PRODUCER_NOT_FOUND]
          - errors[ERR_APPLICANT_NOT_FOUND]
          - errors[ERR_VEHICLE_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_PLAN_PERIOD_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_CYCLE_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_COMPLAINT_NOT_FOUND]
          - errors[ERR_QUOTA_RECONCILIATION_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          Every path and body identifier resolves against its own entity, so each miss must name that
          entity: a well-formed but unknown UUID never yields a generic 404 or a 422, and the
          existence tier (priority 4) runs before any state, business or fiscal check.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; the database holds no rows of any entity type."
            - "The literal 00000000-0000-4000-8000-000000000000 is a syntactically valid UUID that matches nothing."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "GET /plan/carriers/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
            - call: "GET /plan/producers/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
            - call: "GET /plan/applicants/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
            - call: "POST /plan/applicants/00000000-0000-4000-8000-000000000000/vehicles"
              payload: { vin: "1HGCM82633A004399", vehicle_class_code: "PLEASURE", garaging_territory_code: "T02", model_year: 2019 }
              as: PlanAdministrator
            - call: "GET /plan/applications/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
            - call: "GET /plan/plan-periods/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
            - call: "POST /plan/assignment-cycles/00000000-0000-4000-8000-000000000000/run"
              as: PlanAdministrator
            - call: "GET /plan/assignments/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
            - call: "GET /plan/policies/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
            - call: "GET /plan/claims/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
            - call: "GET /plan/complaints/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
            - call: "GET /plan/quota-reconciliations/00000000-0000-4000-8000-000000000000"
              as: PlanAdministrator
          assert:
            - "GET /plan/carriers/{unknown} returns 404 with error_id ERR_CARRIER_NOT_FOUND"
            - "GET /plan/producers/{unknown} returns 404 with error_id ERR_PRODUCER_NOT_FOUND"
            - "GET /plan/applicants/{unknown} returns 404 with error_id ERR_APPLICANT_NOT_FOUND"
            - "POST /plan/applicants/{unknown}/vehicles returns 404 with error_id ERR_APPLICANT_NOT_FOUND (the parent is checked before the vehicle body)"
            - "GET /plan/applications/{unknown} returns 404 with error_id ERR_APPLICATION_NOT_FOUND"
            - "GET /plan/plan-periods/{unknown} returns 404 with error_id ERR_PLAN_PERIOD_NOT_FOUND"
            - "POST /plan/assignment-cycles/{unknown}/run returns 404 with error_id ERR_ASSIGNMENT_CYCLE_NOT_FOUND"
            - "GET /plan/assignments/{unknown} returns 404 with error_id ERR_ASSIGNMENT_NOT_FOUND"
            - "GET /plan/policies/{unknown} returns 404 with error_id ERR_POLICY_NOT_FOUND"
            - "GET /plan/claims/{unknown} returns 404 with error_id ERR_CLAIM_NOT_FOUND"
            - "GET /plan/complaints/{unknown} returns 404 with error_id ERR_COMPLAINT_NOT_FOUND"
            - "GET /plan/quota-reconciliations/{unknown} returns 404 with error_id ERR_QUOTA_RECONCILIATION_NOT_FOUND"
            - "every response body carries data.error_id and data.message with response_type == error"
      - name: application_creation_rejects_a_payload_missing_any_declared_input_field
        claim_type: required_fields
        grounds:
          - endpoints[POST /plan/applications].input
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: |
          The request-shape tier (priority 3) fires before existence, state or business rules, so a
          payload missing any of the five declared inputs must return ERR_INVALID_REQUEST even
          though the referenced applicant, producer and vehicle all exist and are perfectly valid.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; one applicant with one vehicle and one ACTIVE producer exist, all mutually consistent."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /plan/carriers"
              payload: { name: "Atlas Mutual", naic_code: "11111", voluntary_market_share_bps: 6000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /plan/carriers"
              payload: { name: "Beacon Casualty", naic_code: "22222", voluntary_market_share_bps: 4000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c2_id: $.data.id }
            - call: "POST /plan/producers"
              payload: { name: "Harbor Agency", license_number: "PL-4471", appointed_territories: ["T01", "T02", "T03"] }
              as: PlanAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /plan/applicants"
              payload: { full_name: "Owen Pike", driver_license_number: "D-99011", territory_code: "T02", driver_class: "ADULT", first_licensed_date: "2010-06-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /plan/applicants/${a1_id}/vehicles"
              payload: { vin: "1HGCM82633A004360", vehicle_class_code: "PLEASURE", garaging_territory_code: "T02", model_year: 2019 }
              as: PlanAdministrator
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /plan/applications"
              payload: { producer_id: "${p1_id}", vehicle_id: "${v1_id}", requested_effective_date: "2026-09-15T00:00:00Z", declared_violations: [] }
              as: ProducerAgent
              as_user_id: "${p1_id}"
            - call: "POST /plan/applications"
              payload: { applicant_id: "${a1_id}", producer_id: "${p1_id}", vehicle_id: "${v1_id}", declared_violations: [] }
              as: ProducerAgent
              as_user_id: "${p1_id}"
          assert:
            - "the applicant_id-less request returns 422 with error_id ERR_INVALID_REQUEST"
            - "the requested_effective_date-less request returns 422 with error_id ERR_INVALID_REQUEST"
            - "no Application row is created: GET /plan/applications?producer_id=${p1_id} returns total_count == 0"
            - "Applicant.${a1_id} and Vehicle.${v1_id} are unchanged"
      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /plan/plan-periods].input
          - entities.PlanPeriod.fields.underserved_territories
          - entities.PlanPeriod.fields.status
          - entities.Producer.fields.status
        distinguishing_aspect: |
          underserved_territories and Producer.status are the only optional inputs on the write
          surface: omitting them must yield an empty territory list and an ACTIVE producer, and the
          period must open with both frozen totals at zero rather than null.
        test_recipe:
          setup:
            - "Clock at 2026-09-01 with an empty database."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /plan/plan-periods"
              payload: { period_code: "2026-P3", window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-30T00:00:00Z" }
              as: PlanAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /plan/producers"
              payload: { name: "Harbor Agency", license_number: "PL-4471", appointed_territories: ["T01", "T02", "T03"] }
              as: PlanAdministrator
              captures: { p1_id: $.data.id }
          assert:
            - "PlanPeriod.${pp_id}.underserved_territories == [] (no territory earns the 1.5x credit)"
            - "PlanPeriod.${pp_id}.status == OPEN"
            - "PlanPeriod.${pp_id}.total_assignable_units == 0 and PlanPeriod.${pp_id}.total_assignable_car_years == 0"
            - "Producer.${p1_id}.status == ACTIVE"
            - "both responses are 201 with version == 1"
      - name: application_estimate_and_required_deposit_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Application.fields.estimated_total_charge_cents
          - entities.Application.fields.required_deposit_cents
          - calculations.required_deposit
          - calculations.annual_premium
          - calculations.plan_expense_charge
        distinguishing_aspect: |
          The client supplies no money at all on POST /plan/applications; the estimate chain
          (declared violations to premium to expense charge to 25% deposit) is computed server-side,
          so an ADULT PLEASURE risk in T02 must come back with 148337 / 7417 / 155754 / 38939 and a
          deposit_balance_cents of 0 before any payment.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; an ADULT applicant in T02 with a PLEASURE vehicle garaged in T02 and an empty violation list has just been submitted with no deposit and no MVR."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /plan/carriers"
              payload: { name: "Atlas Mutual", naic_code: "11111", voluntary_market_share_bps: 6000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /plan/carriers"
              payload: { name: "Beacon Casualty", naic_code: "22222", voluntary_market_share_bps: 4000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c2_id: $.data.id }
            - call: "POST /plan/producers"
              payload: { name: "Harbor Agency", license_number: "PL-4471", appointed_territories: ["T01", "T02", "T03"] }
              as: PlanAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /plan/plan-periods"
              payload: { period_code: "2026-P3", window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-30T00:00:00Z", underserved_territories: ["T03"] }
              as: PlanAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /plan/applicants"
              payload: { full_name: "Owen Pike", driver_license_number: "D-99011", territory_code: "T02", driver_class: "ADULT", first_licensed_date: "2010-06-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /plan/applicants/${a1_id}/vehicles"
              payload: { vin: "1HGCM82633A004360", vehicle_class_code: "PLEASURE", garaging_territory_code: "T02", model_year: 2019 }
              as: PlanAdministrator
              captures: { v1_id: $.data.id }
            - call: "POST /plan/applications"
