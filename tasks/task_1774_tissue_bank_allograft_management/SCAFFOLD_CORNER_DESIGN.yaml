            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: ISO_CERTIFICATE, document_ref: "ISO-1", valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-05-01T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { e2: $.data.error_id } }
            - { call: "POST /tissue-bank/recalls", payload: { supplier_id: "${sup}", lot_numbers: ["L1"], received_window_start: "2026-12-31T00:00:00Z", received_window_end: "2026-01-01T00:00:00Z", reason: "Inverted window" }, as: QualityManager, as_user_id: "qm-1", captures: { e3: $.data.error_id } }
          assert:
            - "e1 == ERR_INVALID_WINDOW (equal start/end rejected; end must be strictly after start)"
            - "e2 == ERR_INVALID_WINDOW and e3 == ERR_INVALID_WINDOW"

