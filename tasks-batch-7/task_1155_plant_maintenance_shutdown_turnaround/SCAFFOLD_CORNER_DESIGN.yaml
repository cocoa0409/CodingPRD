# =============================================================================
# Task 1155 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: turnaround_create_defaults
        claim_type: creation
        grounds: [entities.Turnaround, endpoints: "POST /turnarounds"]
        distinguishing_aspect: "Creation returns 201 with system defaults: status PLANNING, cost_posture WITHIN_BUDGET, all ledgers 0, schedule_run_index 0, version 1, scope_frozen_at null."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-DEF", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { st: "$.data.status", cp: "$.data.cost_posture", com: "$.data.committed_cost_cents", rep: "$.data.reported_cost_cents", sri: "$.data.schedule_run_index", ver: "$.data.version", sf: "$.data.scope_frozen_at" } }
          trigger: []
          assert:
            - "status == PLANNING; cost_posture == WITHIN_BUDGET"
            - "committed_cost_cents == 0; reported_cost_cents == 0; critical_path_slip_hours == 0; schedule_run_index == 0"
            - "version == 1; scope_frozen_at == null; handed_over_at == null"

      - name: work_item_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.WorkItem, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field title yields 422 ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["turnaround in PLANNING"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-RQ", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { system_area: "CRU-2-X", work_type: "CORRECTIVE", risk_class: "B", estimated_hours: 10, estimated_cost_cents: 5000 }, as: Planner, captures: { err: "$.data.error_id" } }
          assert:
            - "rejected with ERR_INVALID_REQUEST (422)"

      - name: work_item_create_rank_score_input_ignored
        claim_type: computed_fields
        grounds: [entities.WorkItem.fields.rank_score]
        distinguishing_aspect: "Client-supplied rank_score is ignored: the response keeps rank_score null (computed only at freeze-scope)."
        test_recipe:
          setup: ["turnaround in PLANNING"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-CI", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Gasket swap", system_area: "CRU-2-G", work_type: "PREVENTIVE", risk_class: "C", estimated_hours: 8, estimated_cost_cents: 9000, rank_score: 999999 }, as: Planner, captures: { rs: "$.data.rank_score", rp: "$.data.rank_position" } }
          assert:
            - "response rank_score == null and rank_position == null (input value ignored)"

      - name: turnaround_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown turnaround id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /turnarounds/11111111-2222-4333-8444-555555555555", payload: {}, as: TurnaroundManager, captures: { err: "$.data.error_id" } }
          assert:
            - "rejected with ERR_NOT_FOUND (404)"

      - name: work_items_list_pagination
        claim_type: listing
        grounds: [entities.WorkItem, response_envelope]
        distinguishing_aspect: "limit/offset/total_count/has_more semantics: 3 items, limit 2 -> 2 rows + has_more true; offset 2 -> 1 row + has_more false."
        test_recipe:
          setup: ["turnaround PLANNING with three PROPOSED work items"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-PG", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Item one", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000 }, as: Planner }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Item two", system_area: "B", work_type: "PREVENTIVE", risk_class: "B", estimated_hours: 20, estimated_cost_cents: 20000 }, as: Planner }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Item three", system_area: "C", work_type: "INSPECTION", risk_class: "C", estimated_hours: 30, estimated_cost_cents: 30000 }, as: Planner }
          trigger:
            - { call: "GET /turnarounds/${t_id}/work-items", payload: { limit: 2, offset: 0 }, as: Planner, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /turnarounds/${t_id}/work-items", payload: { limit: 2, offset: 2 }, as: Planner, captures: { last_id: "$.data[0].id" } }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 row, has_more == false, and the row id differs from page 1 rows"

      - name: work_items_list_filter_status
        claim_type: listing
        grounds: [entities.WorkItem, endpoints: "GET /turnarounds/{id}/work-items"]
        distinguishing_aspect: "status filter returns only matching members: after a cutoff-1 freeze of two items, status=DEFERRED yields exactly the lower-ranked item."
        test_recipe:
          setup: ["turnaround SCOPE_FROZEN; W_A FROZEN (rank 1), W_B DEFERRED (rank 2)"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-FL", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "High risk", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 120000 }, as: Planner, captures: { wa_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Low risk", system_area: "B", work_type: "PREVENTIVE", risk_class: "C", estimated_hours: 20, estimated_cost_cents: 40000 }, as: Planner, captures: { wb_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
          trigger:
            - { call: "GET /turnarounds/${t_id}/work-items", payload: { status: "DEFERRED" }, as: Planner, captures: { only_id: "$.data[0].id" } }
          assert:
            - "filtered list has exactly 1 row and it is ${wb_id}"
            - "unfiltered list has total_count == 2"

      - name: worker_create_system_fields_generated
        claim_type: system_fields
        grounds: [entities.Worker, state_machines.Worker]
        distinguishing_aspect: "Server mints id/created_at/version and sets badge_status REGISTERED regardless of inputs."
        test_recipe:
          setup: ["turnaround SCOPE_FROZEN with contractor invited"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-SF", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Anchor item", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000 }, as: Planner }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 3 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id", st: "$.data.badge_status", ver: "$.data.version", fat: "$.data.fatigue_penalty_score", led: "$.data.ledger_hours" } }
          assert:
            - "id is a server-minted UUID; version == 1; badge_status == REGISTERED; fatigue_penalty_score == 0; ledger_hours == 0; total_shift_hours == 0"

      - name: shift_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Shift.fields.shift_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "shift_type outside {DAY, NIGHT} is rejected 422."
        test_recipe:
          setup: ["turnaround exists (any pre-terminal status)"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-EN", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-15", shift_type: "MIDDAY", starts_at: "2026-06-15T08:00:00Z", ends_at: "2026-06-15T16:00:00Z", planned_headcount: 2 }, as: Planner, captures: { err: "$.data.error_id" } }
          assert:
            - "rejected with ERR_INVALID_REQUEST (422)"

      - name: worker_create_unknown_contractor_not_found
        claim_type: parent_relationships
        grounds: [entities.Worker.fields.contractor_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Nested creation under a non-existent contractor id returns 404 (left-to-right path validation)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /contractors/11111111-2222-4333-8444-555555555555/workers", payload: { full_name: "Ghost Worker", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "11111111-2222-4333-8444-555555555555", captures: { err: "$.data.error_id" } }
          assert:
            - "rejected with ERR_NOT_FOUND (404)"

  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.Turnaround, state_machines.WorkItem, state_machines.Isolation, state_machines.Contractor, state_machines.Shift, state_machines.StagingReservation, state_machines.DiscoveryWork]
        distinguishing_aspect: "Freshly created entities land in their declared initial states: Turnaround PLANNING, WorkItem PROPOSED, Isolation PLANNED, Contractor INVITED, Shift PLANNED, StagingReservation RESERVED."
        test_recipe:
          setup: ["turnaround progressed to SCOPE_FROZEN (unlocks isolation creation); contractor invited; shift planned; lay-down area with one reservation"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-IN", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id", t_st: "$.data.status" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Anchor", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000 }, as: Planner, captures: { w_id: "$.data.id", w_st: "$.data.status" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/isolations", payload: { equipment_tag: "V-101", isolation_mode: "EXCLUSIVE", isolated_from: "2026-06-10T00:00:00Z", isolated_until: "2026-06-20T00:00:00Z" }, as: PermitCoordinator, captures: { i_st: "$.data.status" } }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 3 }, as: TurnaroundManager, captures: { c_st: "$.data.mobilization_status", c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-15", shift_type: "DAY", starts_at: "2026-06-15T08:00:00Z", ends_at: "2026-06-15T16:00:00Z", planned_headcount: 2 }, as: Planner, captures: { s_st: "$.data.status" } }
            - { call: "POST /turnarounds/${t_id}/laydown-areas", payload: { name: "North Laydown", capacity_sqm: 300 }, as: TurnaroundManager, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
          trigger:
            - { call: "POST /laydown-areas/${a_id}/reservations", payload: { material_description: "Blind stock", area_sqm: 40, window_from: "2026-06-10T00:00:00Z", window_until: "2026-06-18T00:00:00Z", expected_laydown_area_version: "${a_v}" }, as: Planner, captures: { r_st: "$.data.status" } }
          assert:
            - "turnaround PLANNING; work item PROPOSED; isolation PLANNED; contractor INVITED; shift PLANNED; reservation RESERVED"

      - name: work_item_start_from_frozen_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WorkItem.FROZEN_to_SCHEDULED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start is only legal from SCHEDULED/ON_HOLD/REOPENED; a FROZEN (never scheduled) item in an EXECUTION turnaround is rejected."
        test_recipe:
          setup: ["turnaround in EXECUTION; W1 FROZEN (requires_permit false), never scheduled"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-IV", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Anchor", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 3 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
          trigger:
            - { call: "POST /work-items/${w1_id}/start", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "rejected with ERR_INVALID_STATE (409); WorkItem remains FROZEN"

      - name: terminal_state_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.WorkItem, state_machines.Worker, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Terminal states reject further transitions: verify on a VERIFIED work item fails; reinstating a DEBADGED worker fails. Also idempotency: the first verify already consumed the transition."
        test_recipe:
          setup: ["turnaround EXECUTION; W1 VERIFIED; worker W2 DEBADGED (was BADGED)"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-TL", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Anchor", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 3 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /work-items/${w1_id}/schedule", payload: {}, as: Planner }
            - { call: "POST /work-items/${w1_id}/start", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /work-items/${w1_id}/complete", payload: { actual_hours: 9 }, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /work-items/${w1_id}/verify", payload: { outcome: "VERIFIED" }, as: OperationsRep }
            - { call: "POST /workers/${wk_id}/badge-transition", payload: { to: "DEBADGED" }, as: PermitCoordinator }
          trigger:
            - { call: "POST /work-items/${w1_id}/verify", payload: { outcome: "VERIFIED" }, as: OperationsRep, captures: { err1: "$.data.error_id" } }
            - { call: "POST /workers/${wk_id}/badge-transition", payload: { to: "BADGED" }, as: PermitCoordinator, captures: { err2: "$.data.error_id" } }
          assert:
            - "second verify on VERIFIED -> ERR_INVALID_STATE (409)"
            - "badge-transition DEBADGED -> BADGED -> ERR_INVALID_STATE (409)"

      - name: turnaround_cancel_cascades_conditional
        claim_type: cascade_down
        grounds: [state_machines.Turnaround.PLANNING_to_CANCELLED, state_machines.WorkItem.FROZEN_to_CANCELLED]
        distinguishing_aspect: "Conditional cascade: cancel from SCOPE_FROZEN cancels PROPOSED/FROZEN items but leaves DEFERRED items untouched; the cancelled turnaround rejects advance."
        test_recipe:
          setup: ["turnaround SCOPE_FROZEN; W_A FROZEN (rank 1), W_B DEFERRED (rank 2)"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-CN", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "High risk", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 120000 }, as: Planner, captures: { wa_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Low risk", system_area: "B", work_type: "PREVENTIVE", risk_class: "C", estimated_hours: 20, estimated_cost_cents: 40000 }, as: Planner, captures: { wb_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
          trigger:
            - { call: "POST /turnarounds/${t_id}/cancel", payload: {}, as: TurnaroundManager, captures: { t_st: "$.data.status" } }
            - { call: "GET /work-items/${wa_id}", payload: {}, as: Planner, captures: { wa_st: "$.data.status" } }
            - { call: "GET /work-items/${wb_id}", payload: {}, as: Planner, captures: { wb_st: "$.data.status" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager, captures: { err: "$.data.error_id" } }
          assert:
            - "Turnaround.status == CANCELLED"
            - "W_A.status == CANCELLED (was FROZEN); W_B.status == DEFERRED (untouched by the cascade)"
            - "advance on CANCELLED -> ERR_INVALID_STATE (409)"

      - name: worker_debadge_cancels_assignments
        claim_type: cascade_down
        grounds: [state_machines.Worker.BADGED_to_DEBADGED, entities.Contractor.fields.badged_headcount]
        distinguishing_aspect: "Debadging a worker cascades: their ASSIGNED assignment becomes CANCELLED and the contractor's badged_headcount decrements 1 -> 0."
        test_recipe:
          setup: ["turnaround EXECUTION; worker BADGED and ASSIGNED to a future shift"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-DB", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Anchor", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 10000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 3 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
