          - entities.SyndicationJob.fields.transmitted_at
          - calculations.feed_slot_reservation_ledger
        distinguishing_aspect: "TRANSMITTED is a holding state: the transmit call stamps transmitted_at and leaves feed_slots_reserved at 4 and the listing on PENDING, unlike a response or a cancel which release the slots."
