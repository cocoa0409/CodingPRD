              as: WaterChemist
              captures: { c9b_asset: $.data.id }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /wt/assets/${c9b_asset}/blowdown-events"
