        distinguishing_aspect: "Anniversary scan on 2026-08-20 processes the employee whose hire_date 2021-08-20 hits the configured 5-year milestone (500 points, budget committed +500); a second same-day scan records SKIPPED_DUPLICATE and grants nothing."
