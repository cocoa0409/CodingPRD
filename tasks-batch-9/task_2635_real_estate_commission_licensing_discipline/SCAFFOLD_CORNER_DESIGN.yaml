  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_trust_account_version_is_refused_and_the_refreshed_one_appends
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.ledger-entry-stale-trust-account
          - errors.ERR_TRUST_ACCOUNT_VERSION_CONFLICT
          - endpoints["POST /commission/trust-accounts/{id}/ledger-entries"]
        distinguishing_aspect: |
          Ledger appends are legitimately repeatable, so the ONLY thing standing between two clients
          and a double-spend of the same reconciled balance is the parent version. The instance
          replays the version the client held one append ago - a value that was valid when it was
          read - and requires 412, then proves the identical body succeeds once refreshed, and that
          the refused append left neither a row nor a version bump behind.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising and an OPEN ESCROW account TA"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account opened" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: Broker
              as_user_id: "${br_id}"
              captures: { ta_v_pre: $.data.version }
          trigger:
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 400000, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-A", expected_trust_account_version: "${ta_v_pre}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 250000, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-B", expected_trust_account_version: "${ta_v_pre}" }
              as: Broker
              as_user_id: "${br_id}"
              captures: { e1: $.data.error_id }
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: Broker
              as_user_id: "${br_id}"
              captures: { ta_v_post: $.data.version }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 250000, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-B", expected_trust_account_version: "${ta_v_post}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: Broker
              as_user_id: "${br_id}"
              captures: { ta_v_final: $.data.version }
          assert:
            - "the first append returns 201 and the account's bank_available_cents becomes 400000"
            - "the second append, replaying ${ta_v_pre}, returns 412 with ${e1} == ERR_TRUST_ACCOUNT_VERSION_CONFLICT - the amount, the entry type and the transaction_reference were all acceptable"
            - "GET after the refusal shows bank_available_cents still 400000 and GET /commission/trust-accounts/${ta_id}/ledger-entries returns total_count == 1: a 412 has no side effect at all"
            - "${ta_v_post} == ${ta_v_pre} + 1 - the version advanced exactly once, for the one successful write, and the failed write did not bump it"
            - "the identical body resubmitted with ${ta_v_post} returns 201, bank_available_cents becomes 650000 and the ledger holds 2 rows"
            - "${ta_v_final} == ${ta_v_post} + 1, so every successful write and only a successful write increments version"
      - name: a_stale_brokerage_version_is_refused_because_an_earlier_affiliation_moved_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.affiliation-stale-brokerage
