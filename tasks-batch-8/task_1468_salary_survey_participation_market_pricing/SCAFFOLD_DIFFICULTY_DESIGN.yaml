scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: blend_base_vs_conservative_on_market_composite
        grounds:
          - calculations.weighted_blend
          - entities.MarketComposite
          - entities.Job
        distinguishing_aspect: |
          Operates on the MarketComposite / Job domain. Two variants of the same
          weighted_blend formula produce different blended_p50_cents for identical
          match inputs: base (IC-level job) uses CONFIDENCE_FACTOR[LOW]=0.40 and
          includes sample_size>=10 benchmarks; conservative (M-level job) uses
          CONFIDENCE_FACTOR[LOW]=0.20 and excludes sample_size<10 benchmarks.
        test_recipe:
          setup:
            - "Org with strategy ACTIVE (NATIONAL geo, ALL_INDUSTRIES cut)"
            - "Two jobs: job_ic3 (career_level=IC3) and job_m1 (career_level=M1)"
            - "Two ACCEPTED surveys each contributing one APPROVED match for each job"
            - "Match A: p50=10000000, sample=50, weight=60, confidence=HIGH"
            - "Match B: p50=12000000, sample=20, weight=40, confidence=LOW"
            - "survey.data_effective_date=2026-01-01; market_as_of_date=2026-08-01 (7 months)"
            - "Clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_ic3: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.M1", title: "Eng Mgr", job_family: "ENG", career_level: "M1", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_m1: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Analyst A", email: "a@x.com", job_id: "${job_ic3}", geo_code: "US-SF", base_salary_annual_cents: 10000000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Manager M", email: "m@x.com", job_id: "${job_m1}", geo_code: "US-SF", base_salary_annual_cents: 15000000, hire_date: "2023-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { mgr_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/strategies", payload: { name: "FY26", target_percentile: 50, geo_differential_policy: "NATIONAL", industry_cut: "ALL_INDUSTRIES", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompManager, as_user_id: "${mgr_id}", captures: { strat_id: $.data.id } }
            - { call: "POST /strategies/${strat_id}/activate", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/benchmarks", payload: { benchmark_code: "B1", benchmark_title: "SWE IC3", career_level: "IC3", industry_cut: "ALL_INDUSTRIES", geo_scope: "NATIONAL", p25_cents: 8000000, p50_cents: 10000000, p75_cents: 12500000, p90_cents: 15000000, sample_size: 50 }, as: VendorAdmin, captures: { bench_a: $.data.id } }
            - { call: "POST /surveys/${survey_id}/benchmarks", payload: { benchmark_code: "B2", benchmark_title: "SWE IC3 alt", career_level: "IC3", industry_cut: "ALL_INDUSTRIES", geo_scope: "NATIONAL", p25_cents: 9600000, p50_cents: 12000000, p75_cents: 15000000, p90_cents: 18000000, sample_size: 20 }, as: VendorAdmin, captures: { bench_b: $.data.id } }
            # Get survey into ACCEPTED so its benchmarks are blend-eligible
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Subject S", email: "s@x.com", job_id: "${job_ic3}", geo_code: "US-SF", base_salary_annual_cents: 9000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject_id}", job_id: "${job_ic3}", base_salary_annual_cents: 9000000, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /submissions/${sub_id}/mark_ready", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /submissions/${sub_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /surveys/${survey_id}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/accept", payload: {}, as: VendorAdmin }
            # Propose + approve matches for both jobs (SoD: mgr != analyst)
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_ic3}", benchmark_id: "${bench_a}", match_confidence: "HIGH", match_weight_pct: 60, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match_ic3_a: $.data.id } }
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_ic3}", benchmark_id: "${bench_b}", match_confidence: "LOW", match_weight_pct: 40, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match_ic3_b: $.data.id } }
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_m1}", benchmark_id: "${bench_a}", match_confidence: "HIGH", match_weight_pct: 60, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match_m1_a: $.data.id } }
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_m1}", benchmark_id: "${bench_b}", match_confidence: "LOW", match_weight_pct: 40, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match_m1_b: $.data.id } }
            - { call: "POST /matches/${match_ic3_a}/review", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_ic3_a}/approve", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_ic3_b}/review", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_ic3_b}/approve", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_m1_a}/review", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_m1_a}/approve", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_m1_b}/review", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_m1_b}/approve", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            # Create composites and recompute
            - { call: "POST /jobs/${job_ic3}/composites", payload: { strategy_policy_id: "${strat_id}", job_geo_code: "US-SF" }, as: CompManager, as_user_id: "${mgr_id}", captures: { comp_ic3: $.data.id } }
            - { call: "POST /jobs/${job_m1}/composites", payload: { strategy_policy_id: "${strat_id}", job_geo_code: "US-SF" }, as: CompManager, as_user_id: "${mgr_id}", captures: { comp_m1: $.data.id } }
            - { call: "POST /composites/${comp_ic3}/recompute", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { blend_ic3_p50: $.data.blended_p50_cents } }
            - { call: "POST /composites/${comp_m1}/recompute", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { blend_m1_p50: $.data.blended_p50_cents } }
          trigger: []
          assert:
            - "MarketComposite.${comp_ic3}.blended_p50_cents == 10481058 (base variant with LOW confidence factor 0.40)"
            - "MarketComposite.${comp_m1}.blended_p50_cents == 10340026 (conservative variant with LOW confidence factor 0.20)"
            - "MarketComposite.${comp_ic3}.blended_p50_cents != MarketComposite.${comp_m1}.blended_p50_cents"

      - name: recommended_adjustment_provisional_vs_final_on_market_adjustment
        grounds:
          - calculations.recommended_adjustment
          - entities.MarketAdjustment
          - entities.Employee
        distinguishing_aspect: |
          Operates on the MarketAdjustment / Employee domain (different from
          MarketComposite above). provisional_recommendation is computed at
          adjustment-submit time against the then-PUBLISHED composite;
          final_recommendation is computed at report-finalize time against the
          composite PUBLISHED at that later moment. When a newer composite
          supersedes between submit and finalize, the two variants produce
          different recommended amounts for the same employee.
        test_recipe:
          setup:
            - "Org with strategy ACTIVE (NATIONAL, ALL_INDUSTRIES, target_percentile=50)"
            - "Job with PUBLISHED composite C1 (blended_p50=14064429 from canonical chain)"
            - "Employee subject with salary 11251543 (compa_ratio = 8000, BELOW_TARGET)"
            - "Adjustment A proposed for subject at time T1 against C1"
            - "Newer composite C2 (blended_p50=16000000) published, superseding C1"
            - "Report finalized at T2 reads C2"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Analyst", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 10000000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Manager", email: "m@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 15000000, hire_date: "2023-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { mgr_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Subject", email: "s@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 11251543, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/strategies", payload: { name: "FY26", target_percentile: 50, geo_differential_policy: "NATIONAL", industry_cut: "ALL_INDUSTRIES", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompManager, as_user_id: "${mgr_id}", captures: { strat_id: $.data.id } }
            - { call: "POST /strategies/${strat_id}/activate", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/benchmarks", payload: { benchmark_code: "B1", benchmark_title: "SWE IC3", career_level: "IC3", industry_cut: "ALL_INDUSTRIES", geo_scope: "NATIONAL", p25_cents: 8000000, p50_cents: 10000000, p75_cents: 12500000, p90_cents: 15000000, sample_size: 50 }, as: VendorAdmin, captures: { bench_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject_id}", job_id: "${job_id}", base_salary_annual_cents: 11251543, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /submissions/${sub_id}/mark_ready", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /submissions/${sub_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /surveys/${survey_id}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/accept", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_id}", benchmark_id: "${bench_id}", match_confidence: "HIGH", match_weight_pct: 100, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match_id: $.data.id } }
            - { call: "POST /matches/${match_id}/review", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match_id}/approve", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /jobs/${job_id}/composites", payload: { strategy_policy_id: "${strat_id}", job_geo_code: "US-SF" }, as: CompManager, as_user_id: "${mgr_id}", captures: { comp_id: $.data.id } }
            - { call: "POST /composites/${comp_id}/recompute", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /jobs/${job_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { job_v: $.data.version } }
            - { call: "POST /composites/${comp_id}/publish", payload: { expected_job_version: "${job_v}" }, as: CompManager, as_user_id: "${mgr_id}" }
            # C1 published with blended_p50=10173921 (NATIONAL, ALL_INDUSTRIES, single HIGH source)
            # Submit adjustment for subject (provisional_recommendation computed against C1)
            - { call: "POST /orgs/${org_id}/cycles", payload: { name: "2026-Q3", effective_date: "2026-09-01", budget_cents: 1000000 }, as: CompManager, as_user_id: "${mgr_id}", captures: { cycle_id: $.data.id } }
            - { call: "POST /cycles/${cycle_id}/adjustments", payload: { employee_id: "${subject_id}", proposed_amount_cents: 100000, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { adj_id: $.data.id } }
            - { call: "POST /adjustments/${adj_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { pre_compa: $.data.pre_adjustment_compa_ratio_bp, post_compa: $.data.post_adjustment_compa_ratio_bp } }
          trigger:
            # Now publish a NEW composite C2 with a higher benchmark, then finalize a report
            - { call: "POST /surveys/${survey_id}/benchmarks", payload: { benchmark_code: "B2", benchmark_title: "SWE IC3 v2", career_level: "IC3", industry_cut: "ALL_INDUSTRIES", geo_scope: "NATIONAL", p25_cents: 12800000, p50_cents: 16000000, p75_cents: 20000000, p90_cents: 24000000, sample_size: 100 }, as: VendorAdmin, captures: { bench2_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/matches", payload: { job_id: "${job_id}", benchmark_id: "${bench2_id}", match_confidence: "HIGH", match_weight_pct: 100, proposed_by_employee_id: "${analyst_id}" }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { match2_id: $.data.id } }
            - { call: "POST /matches/${match2_id}/review", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /matches/${match2_id}/approve", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /jobs/${job_id}/composites", payload: { strategy_policy_id: "${strat_id}", job_geo_code: "US-SF" }, as: CompManager, as_user_id: "${mgr_id}", captures: { comp2_id: $.data.id } }
            - { call: "POST /composites/${comp2_id}/recompute", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "GET /jobs/${job_id}", payload: {}, as: CompManager, as_user_id: "${mgr_id}", captures: { job_v2: $.data.version } }
            - { call: "POST /composites/${comp2_id}/publish", payload: { expected_job_version: "${job_v2}" }, as: CompManager, as_user_id: "${mgr_id}" }
          assert:
            - "MarketAdjustment.${adj_id}.pre_adjustment_compa_ratio_bp == 11059 (provisional: salary=11251543 vs C1 blended_p50=10173921, round_half_up)"
            - "After C2 publish: Job.${job_id}.current_market_composite_id == ${comp2_id}"
            - "MarketComposite.${comp_id}.status == SUPERSEDED"
            - "MarketComposite.${comp2_id}.status == PUBLISHED"
            - "Provisional recommendation (frozen on adjustment) reflects C1's blended_p50=10173921; a fresh final_recommendation computed against C2 (blended_p50=16295748) would differ — demonstrating the variant divergence"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: weighted_blend_three_input_nonlinear
        grounds:
          - calculations.weighted_blend
          - calculations.aging_adjustment
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs with non-linear interaction. weighted_blend
          combines match_weight_pct, match_confidence (via lookup), and
          sample_size (via min(1, s/30) truncation) — three inputs interacting
          non-linearly (truncation + lookup + normalization), and the normalized
          weights feed a final weighted sum.
        test_recipe:
          setup:
            - "Org with NATIONAL strategy, ACCEPTED survey"
            - "Two APPROVED matches on job_ic3 with different (weight, confidence, sample_size) triples"
            - "Match A: weight=60, conf=HIGH, sample=50 → eff=0.60 * 1.00 * 1.00 = 0.60"
            - "Match B: weight=40, conf=MEDIUM, sample=20 → eff=0.40 * 0.75 * min(1,20/30)=0.40*0.75*0.6667=0.20"
            - "After aging (7mo): aged_p50_A=10173921, aged_p50_B=12208706"
            - "Blended = 0.60/0.80 * 10173921 + 0.20/0.80 * 12208706 = 0.75*10173921 + 0.25*12208706"
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/jobs", payload: { job_code: "ENG.IC3", title: "Sr Eng", job_family: "ENG", career_level: "IC3", flsa_status: "EXEMPT" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { job_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Analyst", email: "a@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 10000000, hire_date: "2024-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { analyst_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Manager", email: "m@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 15000000, hire_date: "2023-01-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { mgr_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/employees", payload: { full_name: "Subject", email: "s@x.com", job_id: "${job_id}", geo_code: "US-SF", base_salary_annual_cents: 9000000, hire_date: "2024-06-01" }, as: CompManager, as_user_id: "emp_mgr_1", captures: { subject_id: $.data.id } }
            - { call: "POST /orgs/${org_id}/strategies", payload: { name: "FY26", target_percentile: 50, geo_differential_policy: "NATIONAL", industry_cut: "ALL_INDUSTRIES", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompManager, as_user_id: "${mgr_id}", captures: { strat_id: $.data.id } }
            - { call: "POST /strategies/${strat_id}/activate", payload: {}, as: CompManager, as_user_id: "${mgr_id}" }
            - { call: "POST /orgs/${org_id}/vendors", payload: { vendor_name: "V1", contract_start_date: "2026-01-01", contract_end_date: "2027-01-01", data_use_scope: "FULL_PARTICIPATION", confidentiality_tier: "CONFIDENTIAL" }, as: VendorAdmin, captures: { vendor_id: $.data.id } }
            - { call: "POST /vendors/${vendor_id}/activate", payload: {}, as: VendorAdmin }
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey_id: $.data.id } }
            - { call: "POST /surveys/${survey_id}/open", payload: {}, as: VendorAdmin }
            - { call: "POST /surveys/${survey_id}/benchmarks", payload: { benchmark_code: "B1", benchmark_title: "A", career_level: "IC3", industry_cut: "ALL_INDUSTRIES", geo_scope: "NATIONAL", p25_cents: 8000000, p50_cents: 10000000, p75_cents: 12500000, p90_cents: 15000000, sample_size: 50 }, as: VendorAdmin, captures: { bench_a: $.data.id } }
            - { call: "POST /surveys/${survey_id}/benchmarks", payload: { benchmark_code: "B2", benchmark_title: "B", career_level: "IC3", industry_cut: "ALL_INDUSTRIES", geo_scope: "NATIONAL", p25_cents: 9600000, p50_cents: 12000000, p75_cents: 15000000, p90_cents: 18000000, sample_size: 20 }, as: VendorAdmin, captures: { bench_b: $.data.id } }
