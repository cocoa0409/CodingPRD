            - "second load with the stale expected_hopper_version rejected with ERR_STALE_HOPPER_VERSION (412)"
      - name: derived_posture_recomputed_on_sensor_and_load
        claim_type: derived_field_reconciliation
        grounds: ["entities.AssemblyLine.fields.posture"]
        distinguishing_aspect: "Derived posture flips OPEN -> RESTRICTED on the depleting sensor reading and back RESTRICTED -> OPEN after reload — recomputed on every hopper mutation, never stored stale."
