  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: sitter_fill_requires_confirmed_covering_assignment
        grounds:
          - state_machines.SitterRequest.PENDING_to_FILLED
          - validations[priority=7]
          - errors[ERR_NO_COVERING_ASSIGNMENT]
        distinguishing_aspect: |
          Entity pair SitterRequest -> ShiftAssignment: fill is legal only while the nurse's
          covering assignment is CONFIRMED; while it is merely ACCEPTED the fill is rejected with
          ERR_NO_COVERING_ASSIGNMENT, and after confirm the same fill succeeds.
        test_recipe:
          setup:
            - "ICU unit with matrix; DAY shift 2026-08-10 (07:00-19:00Z) required 2"
            - "CORE ICU nurse with an ACCEPTED (not yet CONFIRMED) assignment on the shift"
            - "PENDING SitterRequest window 2026-08-10T09:00:00Z-13:00:00Z (inside the shift interval)"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU K", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Sara Sitter", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /sitter-requests"
              payload: { unit_id: "${u}", patient_ref: "P-1001", start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T13:00:00Z" }
              as: ChargeNurse
              captures: { sr: $.data.id }
          trigger:
            - call: "POST /sitter-requests/${sr}/fill"
              payload: { nurse_id: "${n1}" }
              as: ChargeNurse
              captures: { err: $.data.error_id }
            - call: "POST /assignments/${a1}/confirm"
              as: ChargeNurse
            - call: "POST /sitter-requests/${sr}/fill"
              payload: { nurse_id: "${n1}" }
              as: ChargeNurse
              captures: { st: $.data.status, cov: $.data.covering_assignment_id }
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { div: $.data.sitter_diversion_count }
          assert:
            - "First fill (assignment ACCEPTED) error_id == ERR_NO_COVERING_ASSIGNMENT"
            - "After confirm, fill succeeds: SitterRequest.${sr}.status == FILLED and covering_assignment_id == ${a1}"
            - "Shift.${sh}.sitter_diversion_count == 1"

      - name: report_submit_requires_all_shifts_locked
        grounds:
          - state_machines.ComplianceReport.DRAFT_to_SUBMITTED
          - errors[ERR_SHIFTS_NOT_LOCKED]
        distinguishing_aspect: |
          Entity pair ComplianceReport -> Shift: submission is gated by the state of a different
          entity (every shift for report_date must be LOCKED); with the shift still OPEN the
          submit is rejected with ERR_SHIFTS_NOT_LOCKED and the report stays DRAFT.
        test_recipe:
          setup:
            - "ICU unit with matrix; DAY shift 2026-08-10 required 2, status OPEN (never locked)"
            - "ComplianceReport for 2026-08-10 in DRAFT"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU L", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id }
            - call: "POST /compliance-reports"
              payload: { report_date: "2026-08-10" }
              as: NurseAdmin
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /compliance-reports/${rep}/submit"
              as: NurseAdmin
              captures: { err: $.data.error_id }
            - call: "GET /compliance-reports/${rep}"
              as: NurseAdmin
              captures: { st: $.data.status }
          assert:
            - "error_id == ERR_SHIFTS_NOT_LOCKED (shift OPEN blocks submission)"
            - "ComplianceReport.${rep}.status == DRAFT after the failed submit"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: nurse_half_open_overlap_adjacency
        grounds:
          - calculations.overlap_half_open_check
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Resource: Nurse; interval semantics: half-open pairwise overlap. Same-clock-time DAY
          shifts collide (ERR_SHIFT_OVERLAP) while a NIGHT shift starting exactly at the DAY
          shift's end (19:00Z) is adjacent and allowed.
        test_recipe:
          setup:
            - "ICU unit A and MED_SURG unit B, each with matrix and DAY shift 2026-08-10 (07:00-19:00Z); B also has a NIGHT shift (19:00Z-07:00Z)"
            - "Nurse competent in both ICU and MED_SURG, holding a PROPOSED assignment on unit A's DAY shift"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU M", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { ua: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${ua}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${ua}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sha: $.data.id, sha_v: $.data.version }
            - call: "POST /units"
              payload: { name: "MS M", unit_type: "MED_SURG", bed_count: 30, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { ub: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "MED_SURG", acuity_level: "LOW", patients_per_nurse: 5 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "MED_SURG", acuity_level: "MODERATE", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "MED_SURG", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "MED_SURG", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${ub}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 5, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${ub}", shift_date: "2026-08-10", shift_code: "NIGHT", census_low: 5, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${ub}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { shb: $.data.id, shb_v: $.data.version }
            - call: "POST /shifts"
              payload: { unit_id: "${ub}", shift_date: "2026-08-10", shift_code: "NIGHT" }
              as: NurseAdmin
              captures: { shc: $.data.id, shc_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Olive Overlap", employment_type: "CORE", competencies: ["ICU", "MED_SURG"], base_hourly_rate_cents: 5000, home_unit_id: "${ua}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /shifts/${sha}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sha_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /shifts/${shb}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${shb_v}" }
              as: ChargeNurse
              captures: { err: $.data.error_id }
            - call: "POST /shifts/${shc}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${shc_v}" }
              as: ChargeNurse
              captures: { a2: $.data.id, a2_status: $.data.status }
          assert:
            - "DAY-vs-DAY create (identical 07:00-19:00Z interval) error_id == ERR_SHIFT_OVERLAP"
            - "NIGHT create (starts 19:00Z == DAY end) succeeds: ShiftAssignment.${a2}.status == PROPOSED — half-open adjacency is not overlap"
            - "ShiftAssignment.${a1}.status == PROPOSED (unchanged)"

      - name: charge_slot_capacity_one
        grounds:
          - state_machines.ShiftAssignment.ACCEPTED_to_CONFIRMED
          - errors[ERR_CHARGE_SLOT_TAKEN]
        distinguishing_aspect: |
          Resource: Shift charge-coverage slot; interval semantics: aggregate capacity of exactly 1
          over the shift interval (not pairwise half-open). Confirming a second is_charge assignment
          is rejected even though the two nurses' intervals are identical.
        test_recipe:
          setup:
            - "ICU unit with matrix; DAY shift 2026-08-10 required 2"
            - "Two charge-qualified CORE ICU nurses, both with ACCEPTED is_charge assignments; first already CONFIRMED"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU N", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Q One", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, charge_qualified: true, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { q1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Q Two", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, charge_qualified: true, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { q2: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${q1}", is_charge: true, expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { sh_v2: $.data.version }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${q2}", is_charge: true, expected_shift_version: "${sh_v2}" }
              as: ChargeNurse
              captures: { a2: $.data.id }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${q1}"
            - call: "POST /assignments/${a2}/accept"
              as: StaffNurse
              as_user_id: "${q2}"
            - call: "POST /assignments/${a1}/confirm"
              as: ChargeNurse
          trigger:
            - call: "POST /assignments/${a2}/confirm"
              as: ChargeNurse
              captures: { err: $.data.error_id }
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { charge: $.data.charge_covered, counted: $.data.counted_assignments }
          assert:
            - "Second is_charge confirm error_id == ERR_CHARGE_SLOT_TAKEN (capacity-1 slot saturated)"
            - "Shift.${sh}.charge_covered == true and counted_assignments == 2 (a2 remains ACCEPTED)"

  # ===========================================================================
  # Rule 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: incentive_budget_reserve_release_invariant
        grounds:
          - calculations.incentive_budget_ledger
          - calculations.incentive_premium_reserve
          - state_machines.IncentiveOffer.OFFERED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: incentive budget cents. create(+reserve) paired with withdraw(-reserve)
          returns incentive_reserved_cents to 0 with incentive_spent_cents untouched — the forward
          and compensating actions leave the budget ledger exactly unchanged.
        test_recipe:
          setup:
            - "ICU unit with budget 500000; DAY shift required 4 (census 2/3/2/1), zero assignments -> CRITICAL (offers allowed)"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU O", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 2, census_moderate: 3, census_high: 2, census_critical: 1 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /incentive-offers"
              payload: { shift_id: "${sh}", premium_multiplier: 1.5, flat_bonus_cents: 5000 }
              as: NurseAdmin
              captures: { off: $.data.id, res: $.data.premium_reserve_cents }
            - call: "GET /units/${u}"
              as: NurseAdmin
              captures: { reserved1: $.data.incentive_reserved_cents }
            - call: "POST /incentive-offers/${off}/withdraw"
              as: NurseAdmin
              captures: { wst: $.data.status }
            - call: "GET /units/${u}"
              as: NurseAdmin
              captures: { reserved2: $.data.incentive_reserved_cents, spent2: $.data.incentive_spent_cents }
          assert:
            - "IncentiveOffer.${off}.premium_reserve_cents == 41000 (5000 + round_half_up(12 * 6000 * 0.5) = 5000 + 36000)"
            - "After create: NursingUnit.${u}.incentive_reserved_cents == 41000"
            - "After withdraw: incentive_reserved_cents == 0 and incentive_spent_cents == 0 (create+withdraw conserve the budget)"
            - "IncentiveOffer.${off}.status == WITHDRAWN"

      - name: nurse_projected_hours_create_cancel_invariant
        grounds:
          - calculations.nurse_week_hours_ledger
          - state_machines.ShiftAssignment.PROPOSED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: nurse projected weekly hours. create(+12.0) paired with cancel(-12.0)
          returns the week-33 projected_hours ledger to 0.0 — a different conserved quantity type
          (hours, not cents) than the incentive budget invariant.
        test_recipe:
          setup:
            - "ICU unit with matrix; DAY shift 2026-08-10 required 2; CORE ICU nurse with zero week-33 hours"
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU P", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Pam Projected", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
          trigger:
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "GET /nurses/${n1}/week-ledger"
              payload: { week_start: "2026-08-10" }
              as: NurseAdmin
              captures: { proj1: $.data.projected_hours }
            - call: "POST /assignments/${a1}/cancel"
              as: ChargeNurse
            - call: "GET /nurses/${n1}/week-ledger"
              payload: { week_start: "2026-08-10" }
              as: NurseAdmin
              captures: { proj2: $.data.projected_hours, comp2: $.data.completed_hours }
          assert:
            - "After create: projected_hours == 12.0 for week starting 2026-08-10"
            - "After cancel: projected_hours == 0.0 (forward + compensating action leave the ledger unchanged)"
            - "completed_hours == 0.0 (cancel never touches the completed ledger)"
