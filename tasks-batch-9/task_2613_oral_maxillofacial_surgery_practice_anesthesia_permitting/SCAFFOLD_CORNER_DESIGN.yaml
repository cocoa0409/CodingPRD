            - "trigger[8]: HTTP 200 with total_count == 1 and has_more == false"

  # ==========================================================================
  - section: state_machines
    instances:
      - name: permit_starts_in_applied_with_zeroed_compliance
        claim_type: initial_state
        grounds:
          - state_machines[AnesthesiaPermit.status].initial_state
          - endpoints["POST /anesthesia-permits"]
        distinguishing_aspect: "A freshly filed permit is APPLIED with drill_compliance_ratio 0.00, probation_count 0 and no issued_at/expires_at; the practice stays UNPERMITTED because filing an application grants nothing."
        test_recipe:
          setup:
            - "one practice, logical clock 2026-09-01T10:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Initial OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
          trigger:
            - call: "POST /anesthesia-permits"
              payload: { practice_id: "${prac_id}", permit_level: "MODERATE_SEDATION", applied_on: "2026-09-01T09:00:00Z" }
              as: PracticeAdministrator
              captures: { perm_id: $.data.id }
          assert:
            - "HTTP 201 with data.status == APPLIED, data.drill_compliance_ratio == 0.00, data.probation_count == 0"
            - "data.issued_at == null, data.expires_at == null, data.remediation_deadline_at == null, data.last_enforcement_reason == null"
            - "data.required_drill_types == [AIRWAY_OBSTRUCTION, LARYNGOSPASM, LOCAL_ANESTHETIC_TOXICITY, CARDIAC_ARREST] for MODERATE_SEDATION"
            - "GET /practices/${prac_id} still reports sedation_privilege_state == UNPERMITTED"

      - name: permit_activation_stamps_issue_and_expiry_dates
        claim_type: valid_transition
        grounds:
          - state_machines[AnesthesiaPermit.status] INSPECTION_PENDING -> ACTIVE
          - calculations.inspection_score
          - endpoints["POST /facility-inspections/{inspectionId}/result"]
        distinguishing_aspect: "Both hops are observable in one chain: scheduling the inspection moves APPLIED -> INSPECTION_PENDING, and a passing result (1 minor + 1 major = score 91) moves INSPECTION_PENDING -> ACTIVE, stamping issued_at at the logical clock and expires_at exactly 24 calendar months later while flipping the practice to PERMITTED."
        test_recipe:
          setup:
            - "MINIMAL_SEDATION permit with both required drill types logged (ratio 1.00, above the 0.75 floor)"
            - "inspection scheduled for 2026-09-12T09:00:00Z, then the clock advances past it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Activation OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Mo Monitor", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { mon_id: $.data.id }
            - call: "POST /anesthesia-permits"
              payload: { practice_id: "${prac_id}", permit_level: "MINIMAL_SEDATION", applied_on: "2026-09-01T00:00:00Z" }
              as: PracticeAdministrator
              captures: { perm_id: $.data.id }
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "AIRWAY_OBSTRUCTION", conducted_at: "2026-06-01T09:00:00Z", participant_staff_ids: ["${surg_id}", "${mon_id}"] }
              as: PracticeAdministrator
            - call: "POST /emergency-drills"
              payload: { practice_id: "${prac_id}", drill_type: "LOCAL_ANESTHETIC_TOXICITY", conducted_at: "2026-06-02T09:00:00Z", participant_staff_ids: ["${surg_id}", "${mon_id}"] }
              as: PracticeAdministrator
          trigger:
            - call: "POST /facility-inspections"
              payload: { permit_id: "${perm_id}", scheduled_for: "2026-09-12T09:00:00Z" }
              as: PracticeAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /facility-inspections/${insp_id}/result"
              payload: { minor_deficiency_count: 1, major_deficiency_count: 1, critical_deficiency_count: 0 }
              as: PracticeAdministrator
          assert:
            - "after trigger[0]: FacilityInspection.${insp_id}.status == SCHEDULED and AnesthesiaPermit.${perm_id}.status == INSPECTION_PENDING"
            - "after trigger[2]: FacilityInspection.${insp_id}.inspection_score == 91 (100 - 2 - 7) with status == PASSED and outcome_recorded_at == 2026-09-12T10:00:00Z"
            - "after trigger[2]: AnesthesiaPermit.${perm_id}.status == ACTIVE, drill_compliance_ratio == 1.00, issued_at == 2026-09-12T10:00:00Z, expires_at == 2028-09-12T10:00:00Z"
            - "after trigger[2]: GET /practices/${prac_id} reports sedation_privilege_state == PERMITTED"

      - name: inspection_result_before_the_scheduled_instant_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines[FacilityInspection.status] SCHEDULED -> PASSED
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations[priority=40]
        distinguishing_aspect: "The result form carries its own temporal precondition (scheduled_for <= logical clock). Posting an outcome for an inspection that has not happened yet must be refused even though every other precondition is satisfied."
        test_recipe:
          setup:
            - "logical clock 2026-09-11T10:00:00Z with an inspection booked for 2026-09-12T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Early OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /anesthesia-permits"
              payload: { practice_id: "${prac_id}", permit_level: "MINIMAL_SEDATION", applied_on: "2026-09-01T00:00:00Z" }
              as: PracticeAdministrator
              captures: { perm_id: $.data.id }
            - call: "POST /facility-inspections"
              payload: { permit_id: "${perm_id}", scheduled_for: "2026-09-12T09:00:00Z" }
              as: PracticeAdministrator
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /facility-inspections/${insp_id}/result"
              payload: { minor_deficiency_count: 0, major_deficiency_count: 0, critical_deficiency_count: 0 }
              as: PracticeAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "FacilityInspection.${insp_id}.status is still SCHEDULED with inspection_score == null and outcome_recorded_at == null"
            - "AnesthesiaPermit.${perm_id}.status is still INSPECTION_PENDING"

      - name: block_release_moves_open_minutes_into_released_minutes
        claim_type: side_effect_execution
        grounds:
          - state_machines[BlockTime.status] RESERVED -> PARTIALLY_RELEASED
          - endpoints["POST /block-times/{blockId}/release"]
          - calculations.block_utilization
        distinguishing_aspect: "Release is the counterpart of cancellation: the still-open 180 minutes move into released_minutes (not back into the sellable pool), committed_minutes and utilization_pct are untouched, and the block becomes PARTIALLY_RELEASED rather than RELEASED because 60 minutes remain committed."
        test_recipe:
          setup:
            - "one 240-minute block with a single 60-minute LOCAL_ONLY case holding it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Release OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Release", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /block-times"
              payload: { practice_id: "${prac_id}", surgeon_id: "${surg_id}", room_code: "OR-1", block_start: "2026-09-14T13:00:00Z", block_end: "2026-09-14T17:00:00Z", release_deadline_hours: 48 }
              as: SchedulingCoordinator
              captures: { blk_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 50000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /surgical-cases/${case_id}/hold-block"
              payload: { block_id: "${blk_id}" }
              as: SchedulingCoordinator
          trigger:
            - call: "POST /block-times/${blk_id}/release"
              payload: { release_note: "surgeon vacation" }
              as: SchedulingCoordinator
          assert:
            - "before the trigger: BlockTime.${blk_id}.status == RESERVED, committed_minutes == 60, released_minutes == 0, open_minutes == 180, utilization_pct == 25.00"
            - "after the trigger: status == PARTIALLY_RELEASED, committed_minutes == 60, released_minutes == 180, open_minutes == 0, utilization_pct == 25.00 (60 + 180 + 0 == 240)"
            - "the held case is untouched: SurgicalCase.${case_id}.scheduling_status == BLOCK_HELD with block_id == ${blk_id}"

      - name: start_recovery_from_draft_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines[SurgicalCase.scheduling_status] CONFIRMED -> IN_RECOVERY
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations[priority=40]
        distinguishing_aspect: "start-recovery is declared only from CONFIRMED. Firing it on a DRAFT case must be refused by the state guard even though the caller IS the case's primary surgeon (so the actor check passes and only the from-state fails)."
        test_recipe:
          setup:
            - "one DRAFT case whose primary surgeon is the acting user"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T13:30:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Invalid OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Draft", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
