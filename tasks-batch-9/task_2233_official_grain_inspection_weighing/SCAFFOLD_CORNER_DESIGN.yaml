          rationale: "Both variants and the signed rounding_variance_lbs delta are asserted there from one six-draft body."

      - name: protein_basis_variant_selection_and_reconciliation
        claim_type: variant_selection
        grounds:
          - "calculations.protein_moisture_basis_conversion.variants"
        excluded_because:
          difficulty_instance: dual_variant_calc / protein_basis_instrument_moisture_vs_official_moisture
          rationale: "Instrument-basis selection at creation, official-basis selection after grading, and the recompute reconciliation are all asserted there."

      - name: fee_tier_boundaries_and_marginal_inversion
        claim_type: tiered_pricing
        grounds:
          - "calculations.fee_assessment.constants.volume_tiers_bp"
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_tier_mode_b_discount_inversion_at_50000_boundary
          rationale: "The 50000 and 150000 tier boundaries and the more-grain-lower-fee inversion are asserted there."

      - name: ledger_aggregation_after_reversal_and_refund
        claim_type: aggregation
        grounds:
          - "calculations.applicant_balance_ledger"
        excluded_because:
          difficulty_instance: compensating_invariant / payment_waterfall_then_appeal_reversal_conserves_the_applicant_ledger_into_credit
          rationale: "Running totals after charge, payment, reversal and refund (including the negative open balance) are asserted there."

      - name: rolling_bias_window_keeps_only_the_last_three_checks
        claim_type: constants_applied
        grounds:
          - "calculations.instrument_comparison_bias.constants"
        excluded_because:
          difficulty_instance: non_linear_state_machine / instrument_drift_watch_then_recovery_to_approved
          rationale: "The three-deep window, the 0.15 and 0.30 rolling thresholds and the recovery edge are asserted there."

  - section: validations
    instances:
      - name: equipment_field_applicability_is_conditional_on_the_kind
        claim_type: conditional_validation
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_EQUIPMENT_FIELD_APPLICABILITY]"
          - "entities.Equipment.fields.capacity_lbs"
          - "endpoints[POST /grain-inspection/equipment/{id}/certify]"
        distinguishing_aspect: "The same two payload keys are mandatory for one kind and forbidden for the others, and the rule also reaches the certify endpoint: test_error_lbs is required for a SCALE and must be absent for a probe or an instrument, so four different bodies map to one error code."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; one DESIGNATED service area exists."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-APP", model: "Diverter D2", capacity_lbs: 400000, tolerance_lbs: 20.0 }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_EQUIPMENT_FIELD_APPLICABILITY: capacity_lbs and tolerance_lbs must be omitted for a SAMPLING_DEVICE"
            - "equipment_kind SCALE with neither capacity_lbs nor tolerance_lbs -> 422 ERR_EQUIPMENT_FIELD_APPLICABILITY"
            - "A registered SCALE certified without test_error_lbs -> 422 ERR_EQUIPMENT_FIELD_APPLICABILITY; with test_error_lbs 5.0 -> 200 and last_certification_error_lbs == 5.0"
            - "A registered SAMPLING_DEVICE certified WITH test_error_lbs 5.0 -> 422 ERR_EQUIPMENT_FIELD_APPLICABILITY; without it -> 200 and last_certification_error_lbs == null"
            - "No Equipment row is created by the refused registrations: GET /grain-inspection/equipment?service_area_id=${area}&equipment_kind=SAMPLING_DEVICE counts only the accepted ones"

      - name: equipment_kind_must_match_the_role_it_is_used_in
        claim_type: violation_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_EQUIPMENT_KIND_MISMATCH]"
          - "endpoints[POST /grain-inspection/weighing-records]"
          - "endpoints[POST /grain-inspection/samples]"
        distinguishing_aspect: "Every device FK resolves and every device is APPROVED, so only the kind check can reject: a certified probe passed as scale_id, a certified scale passed as sampling_device_id and a probe passed as instrument_id must all fail at priority 7, before the priority-9 state checks that would otherwise pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DELEGATED area with an APPROVED SAMPLING_DEVICE, an APPROVED SCALE and an APPROVED PROTEIN_INSTRUMENT."
            - "An inspector holding SAMPLING, GRADING, PROTEIN and WEIGHING and a CORN request with GRADING, WEIGHING and PROTEIN requested."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-107", contact_email: "billing@prairie.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1401", full_name: "K. Kinds", endorsements: ["SAMPLING", "GRADING", "PROTEIN", "WEIGHING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-KIND", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SCALE", asset_code: "SCALE-KIND", model: "HopperMax 400", capacity_lbs: 400000, tolerance_lbs: 20.0 }
              captures: { scale: "$.data.id" }
            - call: POST /grain-inspection/equipment/${scale}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z", test_error_lbs: 5.0 }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-KIND", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
            - call: POST /grain-inspection/equipment/${nir}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-KIND", declared_quantity_bushels: 3500, requested_services: ["GRADING", "WEIGHING", "PROTEIN"] }
              captures: { req: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req}"
                scale_id: "${probe}"
                weigher_inspector_id: "${insp}"
                dockage_pct: 1.5
                drafts:
                  - { gross_lbs: 55000, tare_lbs: 21300 }
                  - { gross_lbs: 55000, tare_lbs: 21100 }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_EQUIPMENT_KIND_MISMATCH: the probe resolves and is APPROVED but is not a SCALE"
            - "GET /grain-inspection/inspection-requests/${req} -> weighing_status == PENDING and GET /grain-inspection/weighing-records?inspection_request_id=${req} -> total_count 0"
            - "POST /grain-inspection/samples with sampling_device_id ${scale} -> 422 ERR_EQUIPMENT_KIND_MISMATCH"
            - "POST /grain-inspection/protein-analyses with instrument_id ${probe} -> 422 ERR_EQUIPMENT_KIND_MISMATCH"
            - "POST /grain-inspection/comparison-checks with instrument_id ${scale} -> 422 ERR_EQUIPMENT_KIND_MISMATCH (comparison programs exist only for protein instruments)"
            - "The same weighing body with scale_id ${scale} -> 201, proving every other precondition was already satisfied"

      - name: identifier_uniqueness_is_scoped_to_its_container
        claim_type: violation_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_DUPLICATE_IDENTIFIER]"
          - "entities.Sample.fields.seal_number"
          - "entities.Inspector.fields.license_number"
        distinguishing_aspect: "Four identifiers with three different scopes: seal_number is unique per inspection request, license_number and asset_code per service area, account_code globally — so the same literal must be simultaneously rejected inside its scope and accepted just outside it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "Two DELEGATED areas A1 and A2, an applicant with account_code DUP-100, an inspector L-DUP in A1, a certified SAMPLING_DEVICE PROBE-DUP in A1."
            - "Two CORN requests R1 and R2 for that applicant in A1; R1 already carries an ORIGINAL sample sealed SEAL-DUP."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
              captures: { a1: "$.data.id" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
