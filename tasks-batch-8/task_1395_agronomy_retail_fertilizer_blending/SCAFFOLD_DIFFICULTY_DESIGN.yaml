# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Agronomy Retail & Fertilizer Blending
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: recommendation_build_vs_maintenance_rates
        grounds:
          - calculations.nutrient_recommendation_rates
          - entities.Recommendation.fields.rate_variant
        distinguishing_aspect: |
          Dual-variant divergence on the AGRONOMIC domain (Recommendation rates):
          identical soil test (p_ppm=12, k_ppm=90, CORN 220 bu) yields
          p2o5=153/k2o=219 under BUILD_RATE but p2o5=81/k2o=59 under
          MAINTENANCE_RATE; N is 220 in both.
        test_recipe:
          setup:
            - "Grower with a 50-acre STANDARD field"
            - "One RESULTED soil test with p_ppm=12, k_ppm=90, ph=6.1"
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Prairie View Farms", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "North 40", acres: 50, watershed_zone: "STANDARD" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
            - call: "POST /agronomy/soil-tests/${st_id}/record-sampling"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
          trigger:
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_b_p: $.data.p2o5_lbs_per_acre, rec_b_k: $.data.k2o_lbs_per_acre, rec_b_n: $.data.n_lbs_per_acre }
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "MAINTENANCE_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_m_p: $.data.p2o5_lbs_per_acre, rec_m_k: $.data.k2o_lbs_per_acre, rec_m_n: $.data.n_lbs_per_acre }
          assert:
            - "rec_b_p == 153 (round_half_up(0.37*220 + (20-12)*9) = round_half_up(153.4))"
            - "rec_b_k == 219 (round_half_up(0.27*220 + (130-90)*4) = round_half_up(219.4))"
            - "rec_m_p == 81 (round_half_up(81.4); no build component)"
            - "rec_m_k == 59 (round_half_up(59.4))"
            - "rec_b_n == 220 and rec_m_n == 220 (variant only affects P/K)"
            - "rec_b_p != rec_m_p and rec_b_k != rec_m_k (same soil test, two valid variants, different results)"

      - name: blend_order_provisional_vs_final_pricing
        grounds:
          - calculations.blend_line_pricing
          - calculations.invoice_total_aggregation
          - state_machines.BlendBatch
        distinguishing_aspect: |
          Dual-variant divergence on the FISCAL domain (BlendOrder pricing): a
          FLOATING order quoted at MOP 44500 c/ton shows provisional_total_cents
          1365834, but after the MOP sheet is expired and republished at 46000 the
          batch completion re-prices the MOP line to 419750 and final_total_cents
          becomes 1379521 — same lines, same quantities, different totals.
        test_recipe:
          setup:
            - "Full pipeline: grower (limit 10000000), 50-ac field, RESULTED soil test, APPROVED BUILD recommendation, APPROVED NMP cap 300 for 2026"
            - "Products UREA 46-0-0 / DAP 18-46-0 / MOP 0-0-60 with PUBLISHED FALL sheets 52000/61000/44500 covering the default clock"
            - "ACTIVE FERTILIZER_STORAGE (1000t) and BLENDER_SITE permits for SITE-1; lots 20t per product; blender SITE-1 BOTH"
            - "Order (50 ac, FLOATING) lines DAP 332.6 / MOP 365.0 / UREA 348.1 lb per acre, BOOKED, batch SCHEDULED and IN_PROGRESS"
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Cedar Ridge Ag", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "Home Farm", acres: 50, watershed_zone: "STANDARD" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
            - call: "POST /agronomy/soil-tests/${st_id}/record-sampling"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_id: $.data.id }
            - call: "POST /agronomy/recommendations/${rec_id}/submit"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/recommendations/${rec_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/fields/${f_id}/nutrient-plans"
              payload: { crop_year: 2026, n_cap_lbs_per_acre: 300, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }
              as: Agronomist
              captures: { nmp_id: $.data.id }
            - call: "POST /agronomy/nutrient-plans/${nmp_id}/submit"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/nutrient-plans/${nmp_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/products"
              payload: { name: "UREA 46-0-0", analysis_n_pct: 46, analysis_p2o5_pct: 0, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_urea: $.data.id }
            - call: "POST /agronomy/products"
              payload: { name: "DAP 18-46-0", analysis_n_pct: 18, analysis_p2o5_pct: 46, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_dap: $.data.id }
            - call: "POST /agronomy/products"
              payload: { name: "MOP 0-0-60", analysis_n_pct: 0, analysis_p2o5_pct: 0, analysis_k2o_pct: 60, form: "DRY" }
              as: BranchAdmin
              captures: { p_mop: $.data.id }
            - call: "POST /agronomy/products/${p_urea}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 52000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_urea: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_urea}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/products/${p_dap}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 61000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_dap: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_dap}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/products/${p_mop}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 44500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_mop: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_mop}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/environmental-permits"
              payload: { permit_type: "FERTILIZER_STORAGE", site_code: "SITE-1", setback_ft: 200, max_storage_tons: 1000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /agronomy/environmental-permits/${sp_id}/begin-inspection"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/environmental-permits/${sp_id}/activate"
              payload: { expires_at: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /agronomy/environmental-permits"
              payload: { permit_type: "BLENDER_SITE", site_code: "SITE-1", setback_ft: 150 }
              as: ComplianceOfficer
              captures: { bp_id: $.data.id }
            - call: "POST /agronomy/environmental-permits/${bp_id}/begin-inspection"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/environmental-permits/${bp_id}/activate"
              payload: { expires_at: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /agronomy/inventory-lots"
              payload: { product_id: "${p_urea}", warehouse_code: "WH-A", received_tons: 20, lot_cost_cents_per_ton: 40000 }
              as: PlantOperator
            - call: "POST /agronomy/inventory-lots"
              payload: { product_id: "${p_dap}", warehouse_code: "WH-A", received_tons: 20, lot_cost_cents_per_ton: 48000 }
              as: PlantOperator
            - call: "POST /agronomy/inventory-lots"
              payload: { product_id: "${p_mop}", warehouse_code: "WH-A", received_tons: 20, lot_cost_cents_per_ton: 36000 }
              as: PlantOperator
            - call: "POST /agronomy/blenders"
              payload: { name: "BLENDER-1", site_code: "SITE-1", capacity_tons_per_hour: 40, form_supported: "BOTH" }
              as: PlantOperator
              captures: { b_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/blend-orders"
              payload:
                field_id: "${f_id}"
                recommendation_id: "${rec_id}"
                acres: 50
                price_mode: "FLOATING"
                lines:
                  - { product_id: "${p_dap}", target_rate_lbs_per_acre: 332.6 }
                  - { product_id: "${p_mop}", target_rate_lbs_per_acre: 365.0 }
                  - { product_id: "${p_urea}", target_rate_lbs_per_acre: 348.1 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { o_id: $.data.id, o_prov: $.data.provisional_total_cents }
            - call: "POST /agronomy/blend-orders/${o_id}/book"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
            - call: "POST /agronomy/blend-orders/${o_id}/batches"
              payload: { blender_id: "${b_id}", scheduled_start: "2026-08-05T08:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }
              as: PlantOperator
              captures: { ba_id: $.data.id }
            - call: "POST /agronomy/blend-batches/${ba_id}/start"
              payload: {}
              as: PlantOperator
            - call: "GET /agronomy/blend-orders/${o_id}/lines"
              as: PlantOperator
              captures: { ln_dap: "$.data[0].id", ln_mop: "$.data[1].id", ln_urea: "$.data[2].id" }
            - call: "POST /agronomy/price-sheets/${ps_mop}/expire"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/products/${p_mop}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 46000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_mop2: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_mop2}/publish"
              payload: {}
              as: BranchAdmin
          trigger:
            - call: "POST /agronomy/blend-batches/${ba_id}/complete"
              payload:
                actuals:
                  - { blend_line_id: "${ln_dap}", actual_rate_lbs_per_acre: 332.6 }
                  - { blend_line_id: "${ln_mop}", actual_rate_lbs_per_acre: 365.0 }
                  - { blend_line_id: "${ln_urea}", actual_rate_lbs_per_acre: 348.1 }
              as: PlantOperator
          assert:
            - "o_prov == 1365834 (DAP 8.315t*61000=507215 + MOP 9.125t*44500=406063 + UREA 8.703t*52000=452556)"
            - "GET /agronomy/blend-orders/${o_id}: final_total_cents == 1379521 (507215 + 9.125*46000=419750 + 452556)"
            - "MOP line: unit_price_cents == 44500 (quote-time) but final_unit_price_cents == 46000 (completion-time); line_final_cents == 419750"
            - "final_total_cents != provisional_total_cents despite identical quantities — PROVISIONAL and FINAL variants diverge"
            - "order.payment_status == INVOICED and fulfillment_status == BATCHED"

      - name: grower_credit_exposure_vs_billed_balance
        grounds:
          - calculations.credit_utilization
          - entities.GrowerAccount.fields.credit_used_cents
        distinguishing_aspect: |
          Dual-variant divergence on the CREDIT RISK domain (GrowerAccount): with
          one BOOKED order the BILLED variant reads 0 while the EXPOSURE variant
          reads 1365834 — same ledger, same instant, different answers by design.
        test_recipe:
          setup:
            - "Grower limit 5000000 with full order pipeline through BOOKED (order C: DAP 332.6 / MOP 365.0 / UREA 348.1 on 50 ac)"
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Maple Line Farms", credit_limit_cents: 5000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "Creek Field", acres: 50, watershed_zone: "STANDARD" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
            - call: "POST /agronomy/soil-tests/${st_id}/record-sampling"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_id: $.data.id }
            - call: "POST /agronomy/recommendations/${rec_id}/submit"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/recommendations/${rec_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/fields/${f_id}/nutrient-plans"
              payload: { crop_year: 2026, n_cap_lbs_per_acre: 300, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }
              as: Agronomist
              captures: { nmp_id: $.data.id }
            - call: "POST /agronomy/nutrient-plans/${nmp_id}/submit"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/nutrient-plans/${nmp_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/products"
              payload: { name: "UREA 46-0-0", analysis_n_pct: 46, analysis_p2o5_pct: 0, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_urea: $.data.id }
            - call: "POST /agronomy/products"
              payload: { name: "DAP 18-46-0", analysis_n_pct: 18, analysis_p2o5_pct: 46, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_dap: $.data.id }
            - call: "POST /agronomy/products"
              payload: { name: "MOP 0-0-60", analysis_n_pct: 0, analysis_p2o5_pct: 0, analysis_k2o_pct: 60, form: "DRY" }
              as: BranchAdmin
              captures: { p_mop: $.data.id }
            - call: "POST /agronomy/products/${p_urea}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 52000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_urea: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_urea}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/products/${p_dap}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 61000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_dap: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_dap}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/products/${p_mop}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 44500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_mop: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_mop}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/environmental-permits"
              payload: { permit_type: "FERTILIZER_STORAGE", site_code: "SITE-1", setback_ft: 200, max_storage_tons: 1000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /agronomy/environmental-permits/${sp_id}/begin-inspection"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/environmental-permits/${sp_id}/activate"
              payload: { expires_at: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /agronomy/inventory-lots"
              payload: { product_id: "${p_urea}", warehouse_code: "WH-A", received_tons: 20, lot_cost_cents_per_ton: 40000 }
              as: PlantOperator
            - call: "POST /agronomy/inventory-lots"
              payload: { product_id: "${p_dap}", warehouse_code: "WH-A", received_tons: 20, lot_cost_cents_per_ton: 48000 }
              as: PlantOperator
            - call: "POST /agronomy/inventory-lots"
              payload: { product_id: "${p_mop}", warehouse_code: "WH-A", received_tons: 20, lot_cost_cents_per_ton: 36000 }
              as: PlantOperator
            - call: "POST /agronomy/growers/${g_id}/blend-orders"
              payload:
                field_id: "${f_id}"
                recommendation_id: "${rec_id}"
                acres: 50
                price_mode: "FLOATING"
                lines:
                  - { product_id: "${p_dap}", target_rate_lbs_per_acre: 332.6 }
                  - { product_id: "${p_mop}", target_rate_lbs_per_acre: 365.0 }
                  - { product_id: "${p_urea}", target_rate_lbs_per_acre: 348.1 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { o_id: $.data.id }
            - call: "POST /agronomy/blend-orders/${o_id}/book"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
          trigger:
            - call: "GET /agronomy/growers/${g_id}/exposure"
              as: CreditManager
              captures: { billed: $.data.billed_balance_cents, booked: $.data.booked_exposure_cents, expo: $.data.exposure_balance_cents, avail: $.data.available_credit_cents }
          assert:
            - "billed == 0 (BILLED variant: nothing invoiced yet)"
            - "booked == 1365834 (provisional totals of BOOKED orders)"
            - "expo == 1365834 (EXPOSURE variant = billed + booked)"
            - "avail == 3634166 (5000000 - 1365834)"
            - "billed != expo — two sanctioned variants of the same credit posture differ"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: formulation_solver_ordered_nutrient_assignment
        grounds:
          - calculations.blend_formulation_solver
          - endpoints."POST /agronomy/recommendations/{recommendationId}/formulation-preview"
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction and conditional
          branches: for N=220/P2O5=153/K2O=219 the solver assigns P first
          (DAP 332.6 lb), credits its N (59.868 lb at 3-decimal rounding), covers K
          (MOP 365.0), then solves the residual N on UREA (348.1); changing product
          order or the intermediate rounding changes every downstream rate.
        test_recipe:
          setup:
            - "RESULTED soil test (p 12, k 90) with a DRAFT-or-better BUILD recommendation (N 220, P2O5 153, K2O 219)"
            - "Products UREA 46-0-0, DAP 18-46-0, MOP 0-0-60 exist"
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Solver Test Farms", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "West 80", acres: 50, watershed_zone: "STANDARD" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
            - call: "POST /agronomy/soil-tests/${st_id}/record-sampling"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_id: $.data.id }
            - call: "POST /agronomy/products"
              payload: { name: "UREA 46-0-0", analysis_n_pct: 46, analysis_p2o5_pct: 0, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_urea: $.data.id }
            - call: "POST /agronomy/products"
              payload: { name: "DAP 18-46-0", analysis_n_pct: 18, analysis_p2o5_pct: 46, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_dap: $.data.id }
            - call: "POST /agronomy/products"
