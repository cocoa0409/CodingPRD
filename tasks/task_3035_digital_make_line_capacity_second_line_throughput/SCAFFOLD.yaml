  - method: GET
    path: "/api/v1/production-windows"
    description: "List production windows filtered by store (FK reverse reachability)"
    roles: [PlatformAdmin, StoreManager, GeneralManager, LineWorker]
    code: 200
    input: ["limit?", "offset?", "store_id?", "status?"]
    output: "ProductionWindow[]"
    side_effects: []

  # --- Order ---
  - method: POST
    path: "/api/v1/stores/{storeId}/orders"
    description: "Place an order (FIRST_PARTY_DIGITAL, IN_STORE, or MARKETPLACE injection). Runs the full acceptance chain: suppression, FIFO ingredient check, capacity waterfall, pricing variant."
    roles: [LineWorker, StoreManager, MarketplaceChannel]
    code: 201
    input: [channel, "marketplace_channel_id?", "external_order_ref?", lines]
    output: Order
    side_effects:
      - "line = DIGITAL for FIRST_PARTY_DIGITAL and MARKETPLACE; IN_STORE otherwise"
      - "promise_slotting selects the ProductionWindow; promised_at stamped"
      - "fifo_consumption decrements batches; on_hand thresholds may fire suppression_cascade"
      - "marketplace_net_revenue or first_party_variant computes subtotal/commission/net"
      - "ProductionWindow committed += entree_count; Store interval load += entree_count; throttle_band re-evaluated"
      - "payment_status=AUTHORIZED, fulfillment_status=ACCEPTED on success (PLACED only transiently), accuracy_status=UNVERIFIED"
      - "OrderLine.lid_label_code minted per line"

