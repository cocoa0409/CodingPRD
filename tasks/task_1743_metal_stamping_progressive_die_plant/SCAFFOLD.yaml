    side_effects: ["SCHEDULED ProductionRuns referencing the die become ABORTED"]
  - method: POST
    path: "/api/dies/{id}/complete-repair"
    description: "Complete die repair; resets shots_since_repair to 0"
    roles: [ToolroomManager]
