          assert:
            - "First trigger call (self-block A -> A): HTTP 422 with error_id == ERR_TICKET_CYCLE"
            - "Second trigger call (transitive loop A -> B -> A): HTTP 422 with error_id == ERR_TICKET_CYCLE"
            - "Ticket.${ta_id}.blocking_ticket_id == null   (neither rejected call mutated the blocker graph)"
            - "Ticket.${tb_id}.blocking_ticket_id == ${ta_id}"
