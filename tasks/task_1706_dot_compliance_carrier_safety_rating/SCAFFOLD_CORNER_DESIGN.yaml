            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2322", full_name: "Gil Onu", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2322", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "MS" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "396.3", severity_weight: 3, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v_id: $.data.id } }
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v_id}", reason_code: "DUPLICATE_REPORT", evidence_note: "dup of R-2321" }, as: ComplianceAnalyst, captures: { ch: $.data.id } }
