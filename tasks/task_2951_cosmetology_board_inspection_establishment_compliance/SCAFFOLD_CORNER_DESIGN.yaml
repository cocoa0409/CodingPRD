          - validations.priority_62.ERR_HAZARD_CLEARANCE_REINSPECTION_REQUIRED
        distinguishing_aspect: "The establishment completes a full closure loop back to ACTIVE, and the loop's exit condition is external: it needs a distinct FINALIZED REINSPECTION of the same establishment scoring <= 10.00, so the same inspection can never clear its own hazard."
