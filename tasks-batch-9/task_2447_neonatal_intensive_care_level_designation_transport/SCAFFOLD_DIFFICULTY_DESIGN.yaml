              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /surge-escalations"
              payload: { unit_id: "${unit_a}", requested_beds: 6, effective_from: "2026-08-03T00:00:00Z", effective_to: "2026-08-04T00:00:00Z" }
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
