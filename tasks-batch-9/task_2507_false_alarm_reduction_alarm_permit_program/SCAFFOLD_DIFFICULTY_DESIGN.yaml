            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Callback Central Station", license_number: "AC-2507-CB", contact_email: "ops@callback2507.example", contact_phone: "+15550107101", score_mode: "PERIOD_EQUAL"}, as: ProgramAdministrator, captures: {company_cb: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-CB-8-DIALTONE-DR", street_address: "8 Dialtone Dr", city: "Fairview", zip_code: "44016", occupancy_class: "RESIDENTIAL", police_beat: "B08"}, as: PermitClerk, captures: {site_cb: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_cb}", full_name: "Tessa Nim", phone_number: "+15550107102", relationship: "OWNER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {bc_1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_cb}", full_name: "Uri Nim", phone_number: "+15550107103", relationship: "SPOUSE", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {bc_2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_cb}", monitoring_company_id: "${company_cb}", system_type: "BURGLARY", zone_count: 5, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-03-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_cb1: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_cb}", monitoring_company_id: "${company_cb}", system_type: "BURGLARY", zone_count: 5, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-03-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_cb2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys_cb1}/approve-registration", payload: {}, as: PermitClerk}
            - {call: "POST /false-alarm-program/alarm-systems/${sys_cb2}/approve-registration", payload: {}, as: PermitClerk}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-05-06T00:00:00Z"}, as: ProgramAdministrator}
