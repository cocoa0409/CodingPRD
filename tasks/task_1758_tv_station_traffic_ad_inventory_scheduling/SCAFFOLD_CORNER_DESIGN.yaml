  # ======================================================================
  # Section: consistency_model
  # ======================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_post_buy_reflects_reconcile
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "post-buy figures computed in the reconcile request are visible in the immediately following GET post-buy with no delay — consistency is immediate."
        test_recipe:
          setup:
            - "advertiser, program (weekday 2, rating 4.0), week, unit (2026-08-04, 60s), approved order (30s x 1, rate 10000c, guarantee 4.0), copy received, spot placed, log finalized"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "IC", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Tue IC", daypart_code: "LATE_NEWS", airs_weekday: 2, start_time_local: "23:00", duration_minutes: 30, rating_estimate: 4.0 }
              as: TrafficManager
              captures: { prog_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week_id}/avail-units"
              payload: { program_id: "${prog_id}", air_date: "2026-08-04", break_position: 1, total_seconds: 60 }
              as: TrafficManager
              captures: { unit_id: "$.data.id",  unit_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order_id: "$.data.id"}
            - call: "POST /traffic/orders/${order_id}/lines"
              payload: { program_id: "${prog_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 10000, guaranteed_rating: 4.0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order_id}"
              payload: {}
              as: SalesRep
              captures: { order_v: "$.data.version"}
            - call: "POST /traffic/orders/${order_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: TrafficManager
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv_id}", length_seconds: 30 }
              as: CopyCoordinator
              captures: { copy_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "GET /traffic/orders/${order_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot_id: "$.data[0].id"}
            - call: "POST /traffic/spots/${spot_id}/place"
              payload: { avail_unit_id: "${unit_id}", expected_avail_unit_version: "${unit_v0}" }
              as: TrafficManager
            - call: "POST /traffic/avail-weeks/${week_id}/log-days"
              payload: { log_date: "2026-08-04" }
              as: TrafficManager
              captures: { log_id: "$.data.id"}
            - call: "POST /traffic/log-days/${log_id}/finalize"
              payload: {}
              as: TrafficManager
          trigger:
            - call: "POST /traffic/log-days/${log_id}/reconcile"
              payload: { entries: [ { spot_id: "${spot_id}", aired: true, actual_rating: 3.0 } ] }
              as: BillingClerk
            - call: "GET /traffic/orders/${order_id}/post-buy"
              payload: { method_variant: "per_spot_strict" }
              as: BillingClerk
              captures: { shortfall: "$.data.shortfall_credit_cents"}
          assert:
            - "${shortfall} == 2500 immediately after reconcile — deficit max(0, 4.0-3.0) == 1.0 point, cpp == 10000/4.0 == 2500, floor(1.0 * 2500) == 2500"
            - "Spot.${spot_id}.status == AIRED in the same read-your-writes window"
