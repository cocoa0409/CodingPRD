      - name: deciding_a_suspension_from_proposed_is_a_proceeding_state_violation
        claim_type: invalid_transitions
        grounds:
          - state_machines.SuspensionProceeding.PROPOSED_to_NOTICE_SENT
          - validations.priority_33.ERR_PROCEEDING_STATE_INVALID
          - errors.ERR_DUE_PROCESS_INCOMPLETE
        distinguishing_aspect: "From PROPOSED the only declared trigger is send-notice, so both decide and respond return ERR_PROCEEDING_STATE_INVALID 409 at priority 33 — which pre-empts the priority-47 ERR_DUE_PROCESS_INCOMPLETE that describes the same underlying defect, and rescind on a non-ACTIVE proceeding is refused for the same reason."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; rider with three unexcused NO_SHOWs in the 90-day window and one PROPOSED proceeding raised manually by co-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Rafe Donnelly", date_of_birth: "1980-08-18", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-10", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-17", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { rider_v: $.data.version }
          trigger:
            - call: "POST /applicants/${rider_id}/suspension-proceedings"
              payload: { expected_applicant_version: "${rider_v}", review_window_end_date: "2026-08-31", grounds_note: "two no-shows in July" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { proc_id: $.data.id, proc_status: $.data.status }
            - call: "POST /suspension-proceedings/${proc_id}/decide"
              payload: { decision: "UPHELD", suspension_start_date: "2026-09-01" }
              as: ConductOfficer
              as_user_id: "co-2"
              captures: { early_decide_err: $.data.error_id }
            - call: "POST /suspension-proceedings/${proc_id}/respond"
              payload: { rider_response_note: "I was hospitalised" }
              as: Applicant
              as_user_id: "${rider_id}"
              captures: { early_respond_err: $.data.error_id }
            - call: "POST /suspension-proceedings/${proc_id}/rescind"
              payload: {}
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { early_rescind_err: $.data.error_id }
          assert:
            - "the proceeding is created HTTP 201 with data.status == \"PROPOSED\", data.origin == \"MANUAL\", data.proposed_by_user_id == \"co-1\", data.notice_sent_at == null, data.response_deadline_date == null, data.duration_days == 0, data.days_served == 0 and data.days_forgiven == 0"
            - "all three follow-up calls return HTTP 409 with data.error_id == \"ERR_PROCEEDING_STATE_INVALID\" (priority 33 pre-empts ERR_DUE_PROCESS_INCOMPLETE at 47)"
            - "SuspensionProceeding.${proc_id}.status == \"PROPOSED\" and decision == null"
            - "Applicant.${rider_id}.service_status == \"ACTIVE\", prior_upheld_suspension_count == 0 and suspension_days_ledger_total == 0"

