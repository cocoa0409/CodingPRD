            - "trigger[0].response.data.error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics, different resources
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cd_72h_window_inclusive_lower_bound_clock_overlap
        grounds:
          - state_machines.ClosingDisclosure.DELIVERED_to_ACKNOWLEDGED
          - calculations.cd_reissue_clock_reset
          - validations[priority=7]
        distinguishing_aspect: |
          The ClosingDisclosure "wait window" is the closed half-open interval
          [issued_at, issued_at + 72h). An acknowledge inside this interval (clock strictly less
          than issued_at + 72h) is rejected; at the inclusive upper boundary the wait is complete
          and acknowledge succeeds. The interval semantics here are CLOSED on the upper boundary
          (>=), which contrasts with instance 2's STRICT upper boundary semantics on
          ExchangeAccount identification (<=). Resource: ClosingDisclosure (different from instance 2's
          ExchangeAccount). The "occupying interval" is the CD's mandatory wait period; the
          attempted acknowledge call must observe the interval to be over.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; CD delivered (issued_at=2026-06-01T00:00:00Z, earliest_consummation_at=2026-06-04T00:00:00Z)."
            - "Clock advanced to exactly 2026-06-04T00:00:00Z (closed inclusive boundary)."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /purchase-agreements"
              payload: { buyer_name: "B", seller_name: "S", property_address: "1 B8 St", purchase_price_cents: 50000000, earnest_money_required_cents: 1000000, scheduled_closing_date: "2026-08-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /purchase-agreements/${agr_id}/activate"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /escrow-accounts"
              payload: { agreement_id: "${agr_id}" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /earnest-money-deposits"
              payload: { escrow_account_id: "${esc_id}", amount_cents: 1000000, depositor_role: "BUYER" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { emd_id: $.data.id }
            - call: "POST /earnest-money-deposits/${emd_id}/confirm"
              payload: { confirmation_reference: "BANK-B8" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /purchase-agreements/${agr_id}"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { agr_v: $.data.version }
            - call: "POST /closing-disclosures"
              payload: { agreement_id: "${agr_id}", expected_agreement_version: "${agr_v}", cd_apr_bps: 600, cd_total_loan_amount_cents: 40000000, cd_monthly_payment_cents: 250000, cd_product_type: "FIXED", cd_prepayment_penalty: false }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { cd_id: $.data.id }
            - call: "POST /closing-disclosures/${cd_id}/deliver"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "POST /_clock/advance"
              payload: { seconds: 259200 }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
          trigger:
            - call: "POST /closing-disclosures/${cd_id}/acknowledge"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { cd_status: $.data.status, cd_acked_at: $.data.acknowledged_at }
          assert:
            - "ClosingDisclosure.${cd_id}.status == ACKNOWLEDGED"
            - "ClosingDisclosure.${cd_id}.acknowledged_at == 2026-06-04T00:00:00Z"

      - name: exchange_identification_45d_strict_upper_buffer
        grounds:
          - state_machines.ExchangeAccount.OPEN_to_IDENTIFIED
          - validations[priority=16]
        distinguishing_aspect: |
          The ExchangeAccount identification window is the closed interval
          [relinquished_closing_date, relinquished_closing_date + 45d]: at the inclusive
          boundary (clock == identification_deadline) identify succeeds; at strictly greater
          (clock > identification_deadline) identify fails with ERR_EXCHANGE_ID_DEADLINE_PASSED.
          Different interval semantics from instance 1: this is a deadline buffer on a
          DIFFERENT resource (ExchangeAccount, not ClosingDisclosure), and the inclusivity
          rule is the right-closed window for a calendar boundary; the inclusivity is on the
          ENTITY's clock-tied deadline, not on a "wait period" anchored at the entity's creation.
        test_recipe:
          setup:
            - "Clock at 2026-07-16T00:00:00Z (exactly 45 days after a 2026-06-01 relinquished_closing_date)."
            - "ExchangeAccount opened with relinquished_closing_date=2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            - call: "POST /exchange-accounts"
              payload: { taxpayer_name: "Sx2", qualified_intermediary_name: "QI", relinquished_closing_date: "2026-06-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { ea_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { seconds: 3888000 }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
          trigger:
            - call: "POST /exchange-accounts/${ea_id}/identify"
              payload: { replacement_property_address: "100 Boundary Ln" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { ea_status_at_boundary: $.data.status }
            - call: "POST /_clock/advance"
              payload: { seconds: 1 }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
            # Identify on a second exchange account just over the boundary
            - call: "POST /exchange-accounts"
              payload: { taxpayer_name: "Sx3", qualified_intermediary_name: "QI", relinquished_closing_date: "2026-06-01T00:00:00Z" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { ea2_id: $.data.id }
            - call: "POST /exchange-accounts/${ea2_id}/identify"
              payload: { replacement_property_address: "101 Over Ln" }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
          assert:
            - "ExchangeAccount.${ea_id}.status == IDENTIFIED"
            - "trigger[3].response.status_code == 409"
            - "trigger[3].response.data.error_id == ERR_EXCHANGE_ID_DEADLINE_PASSED"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: earnest_refund_invariant_sum_preserved_on_terminate
        grounds:
          - state_machines.PurchaseAgreement.ACTIVE_to_TERMINATED
          - calculations.earnest_refund_split
        distinguishing_aspect: |
          Forward action (POST /earnest-money-deposits twice + POST /purchase-agreements/{id}/terminate)
          paired with its compensating side-effect (REFUNDED deposits + EARNEST_REFUND Disbursements)
          MUST leave the conserved quantity invariant:
            sum(EarnestMoneyDeposit.amount_cents flipped to REFUNDED)
              == sum(Disbursement.amount_cents emitted with purpose=EARNEST_REFUND).
          Conserved quantity: earnest-money refund dollars (per-line invariant). Different from
          instance 2's escrow-balance/disbursement-total conservation.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "Agreement A in ACTIVE with two PENDING deposits (1500000 and 1000000) and a LOCKED BUYER WireInstruction."
          setup_api_calls:
            - call: "POST /users"
              payload: { full_name: "CO", role: "ComplianceOfficer" }
              as: ComplianceOfficer
              as_user_id: "bootstrap"
              captures: { co_id: $.data.id }
            - call: "POST /users"
              payload: { full_name: "EO", role: "EscrowOfficer" }
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { eo_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
