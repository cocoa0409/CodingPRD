  # ---------------------------------------------------------------- agreements
  - method: POST
    path: /agreements
    roles: [PlatformAdmin, StoreManager, SalesAssociate]
    input:
      customer_id: string
      unit_id: string
      term_type: enum
      renewal_count: integer
      disclosure_acknowledged: boolean
    output: Agreement
    side_effects:
      - "runs calculations.agreement_pricing in its pinned step order and stores adjusted_cash_price_cents, renewal_rate_cents, rent_subtotal_cents, processing_fee_cents, total_of_payments_cents and monthly_equivalent_rate_cents"
      - "snapshots store_id from the unit, state_code_snapshot from the store and state_rule_version_snapshot from the matched StateRtoRule.version; later edits to that rule never re-price an existing agreement"
      - "sets payment_status = CURRENT, possession_status = PENDING_DELIVERY, collections_stage = NONE, periods_paid = 0, all money counters 0, paid_pct = 0.0000, swap_count = 0, service_credit_days = 0, late_fee_period_index_last = 0, collection_contact_count_7d = 0"
      - "leaves cycle_anchor_at and current_period_due_at null: billing does not start until the unit is actually delivered, so no day-close can assess a fee against an undelivered agreement"
      - "transitions the unit AVAILABLE -> RESERVED"
      - "sets created_by_user_id = X-User-ID"
    notes: "term_type is WEEKLY | MONTHLY. renewal_count is the number of renewal periods the customer contracts for and is capped by StateRtoRule.max_term_renewals. The processing fee is not a client input: it is derived statutorily as min(state cap, 5% of the rent subtotal), so a state whose processing_fee_max_cents is 0 simply never charges one."

