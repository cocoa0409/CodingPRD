        distinguishing_aspect: |
          DIFFERENT conserved quantity = money (committed credit). available = credit_limit - committed.
          Approval commits 20000 (available 80000); cancelling the AUTHORIZED job releases the same 20000
          (available 100000). available_credit returns to its pre-approval value — money is conserved, not
