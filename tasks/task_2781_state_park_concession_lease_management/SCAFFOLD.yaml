    input: [draw_amount_cents]
    output: ComplianceAction
    side_effects: ["status NOTICE_ISSUED -> BOND_DRAW_ORDERED", "hop 1: draw_amount_cents persisted", "hop 2: the bond debits available_balance_cents and credits drawn_total_cents, landing in PARTIALLY_DRAWN or INSUFFICIENT", "hop 3: on INSUFFICIENT, Lease.compliance_status DEFICIENT -> DEFAULT and contract_status ACTIVE|HOLDOVER -> TERMINATED_DEFAULT", "hop 4: the terminated lease's live operating plans become SUPERSEDED and its unfinished improvements become WITHDRAWN, decrementing Park.open_closure_window_count per formerly APPROVED row", "when reconciliation_id is set and draw_amount_cents equals that row's additional_fee_due_cents, the reconciliation becomes SETTLED and Lease.outstanding_fee_balance_cents is recomputed", "increments ComplianceAction.version by 1"]
  - method: GET
    path: "/compliance-actions"
    description: "Lists compliance actions; filter by lease or by the reconciliation that provoked them."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: ["lease_id?", "reconciliation_id?", "status?", "origin?", "limit?", "offset?"]
    output: ComplianceAction[]
    side_effects: []
  - method: GET
    path: "/compliance-actions/{id}"
    description: "Reads one compliance action including cure_deadline and draw_amount_cents."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: []
    output: ComplianceAction
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:
  # -- authentication and authorization
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, or the role is not one declared in §1.7" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "the acting role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "a Concessionaire acts on a proposal, bond, improvement, plan, report, reconciliation or audit that belongs to a different Offeror" }

  # -- existence (path parameters first, then body foreign keys)
  - { id: ERR_PARK_NOT_FOUND, http: 404, condition: "no Park matches the path {id} or the body's park_id" }
  - { id: ERR_OPPORTUNITY_NOT_FOUND, http: 404, condition: "no ConcessionOpportunity matches the path {id} or the body's opportunity_id" }
  - { id: ERR_PROSPECTUS_NOT_FOUND, http: 404, condition: "no Prospectus matches the path {id} or the body's prospectus_id" }
  - { id: ERR_OFFEROR_NOT_FOUND, http: 404, condition: "no Offeror matches the path {id} or the body's offeror_id" }
  - { id: ERR_PROPOSAL_NOT_FOUND, http: 404, condition: "no Proposal matches the path {id}" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "no ProposalEvaluation matches the path {id}" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "no Lease matches the path {id}, the body's lease_id, or the body's successor_lease_id" }
  - { id: ERR_BOND_NOT_FOUND, http: 404, condition: "no PerformanceBond matches the path {id}" }
  - { id: ERR_IMPROVEMENT_NOT_FOUND, http: 404, condition: "no CapitalImprovement matches the path {id}" }
  - { id: ERR_OPERATING_PLAN_NOT_FOUND, http: 404, condition: "no OperatingPlan matches the path {id}" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "no GrossReceiptsReport matches the path {id}" }
  - { id: ERR_RECONCILIATION_NOT_FOUND, http: 404, condition: "no FeeReconciliation matches the path {id} or the body's reconciliation_id (or it belongs to a different lease)" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "no AuditEngagement matches the path {id}" }
  - { id: ERR_COMPLIANCE_ACTION_NOT_FOUND, http: 404, condition: "no ComplianceAction matches the path {id}" }

  # -- request shape and concurrency
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required field is missing or null, an enum value is not a declared member, a money field is not a non-negative integer inside its bound, a percentage carries more than 2 decimals or falls outside its bound, or a date/datetime is malformed" }
  - { id: ERR_WEIGHTS_NOT_NORMALIZED, http: 422, condition: "the five prospectus evaluation weights do not total exactly 100" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "a half-open interval has start >= end, or a closed interval has start > end" }
  - { id: ERR_STALE_LEASE_VERSION, http: 412, condition: "expected_lease_version does not equal the lease's current version" }

  # -- own-status preconditions on the path resource
  - { id: ERR_OPPORTUNITY_STATUS_INVALID, http: 409, condition: "the opportunity's status does not admit the requested transition" }
  - { id: ERR_PROSPECTUS_STATUS_INVALID, http: 409, condition: "the prospectus's status does not admit the requested transition" }
  - { id: ERR_OFFEROR_STATUS_INVALID, http: 409, condition: "the offeror is already DEBARRED" }
  - { id: ERR_PROPOSAL_STATUS_INVALID, http: 409, condition: "the proposal's status does not admit the requested transition" }
  - { id: ERR_LEASE_STATUS_INVALID, http: 409, condition: "the lease's contract_status does not admit the requested operation, either as the path resource or as the lease referenced by the body" }
  - { id: ERR_BOND_STATUS_INVALID, http: 409, condition: "the bond's status does not admit posting or reinstatement" }
  - { id: ERR_IMPROVEMENT_STATUS_INVALID, http: 409, condition: "the improvement's status does not admit the requested transition" }
  - { id: ERR_OPERATING_PLAN_STATUS_INVALID, http: 409, condition: "the operating plan's status does not admit the requested transition" }
  - { id: ERR_REPORT_STATUS_INVALID, http: 409, condition: "the report's status does not admit acceptance, rejection or amendment" }
  - { id: ERR_RECONCILIATION_STATUS_INVALID, http: 409, condition: "the reconciliation is not PENDING_PAYMENT" }
  - { id: ERR_AUDIT_STATUS_INVALID, http: 409, condition: "the audit's status does not admit the requested transition" }
  - { id: ERR_COMPLIANCE_ACTION_STATUS_INVALID, http: 409, condition: "the compliance action is no longer NOTICE_ISSUED" }

  # -- cross-entity state guards
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "the referenced lease's contract_status is not ACTIVE, so improvements, operating plans, gross receipts reports and reconciliations cannot be filed against it" }
  - { id: ERR_OPPORTUNITY_NOT_APPROVED, http: 409, condition: "the prospectus's opportunity has not reached APPROVED_FOR_SOLICITATION" }
  - { id: ERR_BOND_NOT_ACTIVE, http: 409, condition: "the lease's performance bond is not in a status that supports the operation (ACTIVE for execution; ACTIVE or PARTIALLY_DRAWN for an improvement approval or a draw)" }
  - { id: ERR_OFFEROR_DEBARRED, http: 409, condition: "the submitting offeror has been debarred" }
  - { id: ERR_AUDIT_IN_PROGRESS, http: 409, condition: "an audit on the lease is still OPENED, FIELDWORK, FINDINGS_ISSUED or CONTESTED, so the lease cannot be closed out" }
  - { id: ERR_SUCCESSOR_ALREADY_ACTIVE, http: 409, condition: "a successor lease naming this lease as predecessor is already ACTIVE, so holdover is pointless" }
  - { id: ERR_AUDIT_ALREADY_SETTLED, http: 409, condition: "the reconciliation this audit minted is no longer PENDING_PAYMENT, so the findings cannot be withdrawn" }
  - { id: ERR_NO_RECONCILIATION_FOR_PERIOD, http: 409, condition: "no PENDING_PAYMENT or SETTLED reconciliation exists for the lease year the audit window falls in" }
  - { id: ERR_AUDIT_PERIOD_EMPTY, http: 409, condition: "no ACCEPTED gross receipts report lies inside the audit window" }
  - { id: ERR_EVALUATION_ALREADY_STARTED, http: 409, condition: "a score sheet already exists, so the proposal can no longer be returned for revision" }
  - { id: ERR_PANEL_ALREADY_COMPLETE, http: 409, condition: "the proposal already carries REQUIRED_PANELIST_COUNT score sheets" }
  - { id: ERR_NO_APPROVED_OPERATING_PLAN, http: 409, condition: "no APPROVED operating plan season covers every day of the reporting period" }
  - { id: ERR_NO_RESPONSIVE_PROPOSAL, http: 422, condition: "award_selection finds no eligible candidate on the prospectus" }

  # -- safety and segregation of duties
  - { id: ERR_INSURANCE_LAPSED, http: 409, condition: "the certificate of insurance on file expires at or before the logical clock date" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "the acting officer scored a proposal on the prospectus being awarded, or is the same officer who awarded the lease now being executed" }

  # -- temporal
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 409, condition: "the logical clock is at or after the prospectus submission deadline" }
  - { id: ERR_SUBMISSION_WINDOW_OPEN, http: 409, condition: "the logical clock is still before the submission deadline, so the solicitation cannot close" }
  - { id: ERR_TERM_NOT_ELAPSED, http: 409, condition: "the logical clock has not reached term_end (holdover) or not passed it (expiry)" }
  - { id: ERR_CURE_PERIOD_OPEN, http: 409, condition: "the compliance action's cure deadline has not passed" }
  - { id: ERR_RECONCILIATION_PERIOD_NOT_ELAPSED, http: 409, condition: "the lease year being reconciled has not finished as of the logical clock" }
  - { id: ERR_IN_SERVICE_BEFORE_WINDOW, http: 409, condition: "the reported in-service date precedes the approved construction window" }
  - { id: ERR_PERIOD_OUTSIDE_TERM, http: 422, condition: "the reporting period is not fully inside the contract term" }
  - { id: ERR_CONSTRUCTION_WINDOW_OUTSIDE_TERM, http: 422, condition: "the construction closure window is not fully inside the contract term" }

  # -- constraint satisfaction
  - { id: ERR_SEASON_OVERLAP, http: 409, condition: "the closed season interval shares a calendar day with another APPROVED season on the same lease" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "the half-open reporting period intersects a live report on the same lease" }
  - { id: ERR_DUPLICATE_PROPOSAL, http: 409, condition: "the offeror already holds a live proposal on this prospectus" }
  - { id: ERR_DUPLICATE_PANELIST_EVALUATION, http: 409, condition: "the acting panelist already filed a score sheet on this proposal" }
  - { id: ERR_PARK_CLOSURE_CAPACITY, http: 409, condition: "approving the improvement would leave more than MAX_OVERLAPPING_PARK_CLOSURES approved construction closures overlapping on the park" }
  - { id: ERR_RATE_EXCEEDS_CEILING, http: 422, condition: "a maximum public rate exceeds RATE_CEILING_MULTIPLIER times the park's benchmark for that category" }
  - { id: ERR_REVISION_LIMIT_REACHED, http: 409, condition: "the proposal has already used MAX_REVISION_ROUNDS revision rounds" }

  # -- fiscal
  - { id: ERR_OPPORTUNITY_NOT_VIABLE, http: 422, condition: "the projected annual gross receipts are below MIN_VIABLE_ANNUAL_RECEIPTS_CENTS" }
  - { id: ERR_FEE_BELOW_MINIMUM, http: 422, condition: "the offered franchise fee percentage is below the prospectus minimum" }
  - { id: ERR_GUARANTEE_BELOW_MINIMUM, http: 422, condition: "the proposed annual guarantee is below the prospectus minimum annual guarantee" }
  - { id: ERR_IMPROVEMENT_EXCEEDS_OBLIGATION, http: 422, condition: "approving the improvement would push committed capital past the lease's capital investment obligation" }
  - { id: ERR_MAINTENANCE_RESERVE_INSUFFICIENT, http: 422, condition: "a reserve-funded improvement costs more than the accrued maintenance reserve balance" }
  - { id: ERR_REMITTANCE_MISMATCH, http: 422, condition: "the logged remittance does not equal the period's assessed fee" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "the payment does not equal the reconciliation's additional_fee_due_cents" }
  - { id: ERR_BOND_INSUFFICIENT, http: 422, condition: "the posted penal sum is below the required bond amount" }
  - { id: ERR_BOND_EXCEEDS_CAPACITY, http: 422, condition: "the posted penal sum exceeds the offeror's attested bond capacity" }
  - { id: ERR_DRAW_EXCEEDS_BOND, http: 422, condition: "the ordered draw exceeds the bond's available balance" }
  - { id: ERR_REINSTATEMENT_EXCEEDS_DRAWN, http: 422, condition: "the reinstatement amount is not strictly positive or exceeds the amount drawn" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================

roles:
  - name: ProgramAdministrator
    description: "Statewide concessions program administrator. Maintains the park register and the offeror register, debars offerors, and positions the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /parks"
      - "POST /offerors"
      - "POST /offerors/{id}/debar"
    shared_operations:
      - "every GET endpoint except GET /proposal-evaluations and GET /proposal-evaluations/{id}, which are shared with the evaluation and audit roles only"

  - name: ConcessionSpecialist
    description: "Program staff who identify opportunities, run the market analysis, draft and issue the prospectus, close the solicitation and shepherd proposals through review. Cannot approve solicitation and cannot award."
    identity: "opaque"
    exclusive_operations:
      - "POST /concession-opportunities"
      - "POST /concession-opportunities/{id}/market-analysis"
      - "POST /prospectuses"
      - "POST /prospectuses/{id}/issue"
      - "POST /prospectuses/{id}/close"
      - "POST /proposals/{id}/begin-review"
      - "POST /proposals/{id}/request-revision"
    shared_operations:
      - "every GET endpoint"

  - name: ContractingOfficer
    description: "Warranted officer who approves solicitation, awards, executes and administers the lease: operating plan and improvement approvals, report acceptance, annual reconciliation, compliance notices and bond draws. Two distinct officers are required across award/execution and across scoring/award."
    identity: "opaque"
    exclusive_operations:
      - "POST /concession-opportunities/{id}/approve-solicitation"
      - "POST /prospectuses/{id}/award"
      - "POST /leases/{id}/execute"
      - "POST /leases/{id}/insurance-certificate"
      - "POST /leases/{id}/enter-holdover"
      - "POST /leases/{id}/expire"
      - "POST /leases/{id}/close-out"
      - "POST /capital-improvements/{id}/approve"
      - "POST /capital-improvements/{id}/return"
      - "POST /operating-plans/{id}/approve"
      - "POST /operating-plans/{id}/return"
      - "POST /gross-receipts-reports/{id}/accept"
      - "POST /gross-receipts-reports/{id}/reject"
      - "POST /fee-reconciliations"
      - "POST /compliance-actions"
      - "POST /compliance-actions/{id}/accept-cure"
      - "POST /compliance-actions/{id}/order-bond-draw"
    shared_operations:
      - "every GET endpoint"

  - name: EvaluationPanelist
    description: "Subject-matter panelist who files exactly one score sheet per proposal. Filing a sheet on any proposal of a prospectus permanently bars the same user id from awarding that prospectus."
    identity: "opaque"
    exclusive_operations:
      - "POST /proposals/{id}/evaluations"
    shared_operations:
      - "every GET endpoint"

  - name: AuditorGeneral
    description: "Independent auditor who exercises the lease's audit rights: opens engagements, freezes reported receipts, issues findings, finalizes the restatement and may withdraw final findings."
    identity: "opaque"
    exclusive_operations:
      - "POST /audit-engagements"
      - "POST /audit-engagements/{id}/begin-fieldwork"
      - "POST /audit-engagements/{id}/issue-findings"
      - "POST /audit-engagements/{id}/finalize"
      - "POST /audit-engagements/{id}/withdraw-findings"
    shared_operations:
      - "every GET endpoint"

  - name: Concessionaire
    description: "The offeror side. X-User-ID is an Offeror.id; every write is confined to resources reachable from a lease whose offeror_id equals that id (or, before award, to its own proposals)."
    identity: "entity_backed:Offeror"
    exclusive_operations:
      - "POST /proposals"
      - "POST /proposals/{id}/resubmit"
      - "POST /proposals/{id}/withdraw"
      - "POST /performance-bonds/{id}/post"
      - "POST /performance-bonds/{id}/reinstate"
      - "POST /capital-improvements"
      - "POST /capital-improvements/{id}/resubmit"
      - "POST /capital-improvements/{id}/place-in-service"
      - "POST /operating-plans"
      - "POST /operating-plans/{id}/resubmit"
      - "POST /gross-receipts-reports"
      - "POST /gross-receipts-reports/{id}/amend"
      - "POST /fee-reconciliations/{id}/settle"
      - "POST /audit-engagements/{id}/contest"
    shared_operations:
      - "every GET endpoint except GET /proposal-evaluations and GET /proposal-evaluations/{id} — score sheets are not disclosed to offerors"
