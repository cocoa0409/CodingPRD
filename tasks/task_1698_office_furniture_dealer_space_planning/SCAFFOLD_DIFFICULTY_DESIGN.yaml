              captures: { o_credit: $.data.credit_applied_cents, o_grand: $.data.grand_total_cents }
            - call: "GET /api/customers/${c_id}"
              payload: {}
              as: FinanceManager
              captures: { bal_1: $.data.liquidation_credit_balance_cents }
            - call: "POST /api/project-orders/${o_id}/cancel"
              payload: {}
              as: AccountExecutive
              captures: { o_fee_cancel: $.data.cancel_fee_cents }
            - call: "GET /api/customers/${c_id}"
              payload: {}
              as: FinanceManager
              captures: { bal_2: $.data.liquidation_credit_balance_cents }
          assert:
