            - "after APPROVE, BrokerAgreement.${agr_id}.status == APPROVED, Broker.${brk_id}.diligence_status == APPROVED, Broker.${brk_id}.approved_agreement_count == 1"
            - "attempt 3, byte-identical apart from program_name, returns HTTP 201"
            - "DepositProgram.${prog_id}.state == PENDING_CLASSIFICATION and version == 1"
            - "GET /deposit-programs?institution_id=${inst_id} returns total_count == 1 — the two refused attempts persisted nothing"

