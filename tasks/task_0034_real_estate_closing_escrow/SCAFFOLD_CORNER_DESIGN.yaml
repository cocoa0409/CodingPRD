              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "POST /wire-instructions/${wi_b}/lock"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
          trigger:
            - call: "POST /purchase-agreements/${agr_id}/terminate"
              payload: { terminated_reason: "Title material defect could not be resolved." }
              as: EscrowOfficer
              as_user_id: "${eo_id}"
            - call: "GET /escrow-accounts/${esc_id}"
              payload: {}
              as: EscrowOfficer
              as_user_id: "${eo_id}"
              captures: { esc_status: "$.data.status" }
          assert:
            - "EarnestMoneyDeposit.${emd_id}.status == REFUNDED"
            - "EscrowAccount.${esc_id}.status == CLOSED"
            - "PurchaseAgreement.${agr_id}.status == TERMINATED"

