            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 1 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "cA", primary_language: "EN" }, as: ContactAdmin, captures: { cA: "$.data.id" } }
            - { call: "POST /contacts/${cA}/channels", payload: { channel_type: "SMS", address: "+15550020" }, as: ContactAdmin, captures: { chA: "$.data.id", tokA: "$.data.confirmation_token" } }
            - { call: "POST /channels/${chA}/confirm", payload: { confirmation_token: "${tokA}" }, as: Contact, as_user_id: "${cA}" }
            - { call: "POST /contacts", payload: { full_name: "cB", primary_language: "EN" }, as: ContactAdmin, captures: { cB: "$.data.id" } }
            - { call: "POST /contacts/${cB}/channels", payload: { channel_type: "SMS", address: "+15550021" }, as: ContactAdmin, captures: { chB: "$.data.id", tokB: "$.data.confirmation_token" } }
            - { call: "POST /channels/${chB}/confirm", payload: { confirmation_token: "${tokB}" }, as: Contact, as_user_id: "${cB}" }
            - { call: "POST /groups", payload: { name: "gA" }, as: ContactAdmin, captures: { gA: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${cA}", subscription_type: "GROUP", group_id: "${gA}" }, as: ContactAdmin }
            - { call: "POST /groups", payload: { name: "gB" }, as: ContactAdmin, captures: { gB: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${cB}", subscription_type: "GROUP", group_id: "${gB}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "A1", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${gA}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "A1." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
            - { call: "POST /alerts", payload: { title: "A2", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${gB}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a2: "$.data.id" } }
            - { call: "POST /alerts/${a2}/localizations", payload: { language: "EN", message_text: "A2." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a2}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a2}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av2: "$.data.version" } }
          trigger:
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1", captures: { st1: "$.data.status" } }
            - { call: "POST /alerts/${a2}/dispatch", payload: { expected_alert_version: "${av2}" }, as: Dispatcher, as_user_id: "disp1", captures: { err: "$.data.error_id" } }
          assert:
            - "first dispatch -> Alert.${a1}.status == DISPATCHING (projected window_count 1 == cap)"
            - "second dispatch -> HTTP 409, data.error_id == ERR_THROTTLE_EXCEEDED (projected 2 > cap)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: alert_submit_requires_published_template
        grounds:
          - state_machines.Alert.DRAFT_to_PENDING_APPROVAL
          - state_machines.Template.DRAFT_to_PUBLISHED
          - errors[ERR_TEMPLATE_NOT_PUBLISHED]
        distinguishing_aspect: "PAIR (Alert, Template): Alert DRAFT->PENDING_APPROVAL is blocked while its template_id points to a DRAFT template (ERR_TEMPLATE_NOT_PUBLISHED), and succeeds once the Template is PUBLISHED."
        test_recipe:
          setup:
            - "Template t1 in DRAFT; alert a1 (WARNING,[SMS],GROUP=g1, template_id=t1) with one EN localization, still DRAFT."
          setup_api_calls:
            - { call: "POST /templates", payload: { name: "Tmpl", default_severity: "WARNING", body_by_language: { EN: "Body." } }, as: ContactAdmin, captures: { t1: "$.data.id" } }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", template_id: "${t1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
          trigger:
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { err: "$.data.error_id" } }
            - { call: "POST /templates/${t1}/publish", payload: {}, as: ContactAdmin }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { st: "$.data.status" } }
          assert:
            - "first submit -> HTTP 422, data.error_id == ERR_TEMPLATE_NOT_PUBLISHED"
            - "after publish, submit -> Alert.${a1}.status == PENDING_APPROVAL"

      - name: subscription_requires_open_group
        grounds:
          - state_machines.Group.OPEN_to_CLOSED
          - validations[priority=6]
          - errors[ERR_GROUP_NOT_OPEN]
        distinguishing_aspect: "PAIR (Subscription, Group) — different from (Alert, Template): a GROUP subscription against a CLOSED group is rejected with ERR_GROUP_NOT_OPEN."
        test_recipe:
          setup:
            - "Contact c1; group g1 created then CLOSED."
          setup_api_calls:
            - { call: "POST /contacts", payload: { full_name: "Ivy", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /groups/${g1}/close", payload: {}, as: ContactAdmin }
          trigger:
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "subscribe -> HTTP 409, data.error_id == ERR_GROUP_NOT_OPEN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: gateway_maintenance_halfopen_overlap
        grounds:
          - entities.GatewayMaintenanceWindow.fields.start_at
          - entities.GatewayMaintenanceWindow.fields.end_at
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: "Resource=Gateway, semantics=half-open [start,end): a new window [11:00,13:00) overlaps existing [10:00,12:00) → ERR_WINDOW_OVERLAP (an adjacency [12:00,13:00) would be allowed)."
        test_recipe:
          setup:
            - "SMS gateway gw1 with one maintenance window [2026-03-12T10:00:00Z, 2026-03-12T12:00:00Z)."
          setup_api_calls:
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin, captures: { gw1: "$.data.id" } }
            - { call: "POST /gateways/${gw1}/maintenance-windows", payload: { start_at: "2026-03-12T10:00:00Z", end_at: "2026-03-12T12:00:00Z" }, as: ContactAdmin }
          trigger:
            - { call: "POST /gateways/${gw1}/maintenance-windows", payload: { start_at: "2026-03-12T11:00:00Z", end_at: "2026-03-12T13:00:00Z" }, as: ContactAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "second window -> HTTP 422, data.error_id == ERR_WINDOW_OVERLAP"

      - name: drill_buffer_gap_overlap_on_group
        grounds:
          - entities.Drill.fields.scheduled_start
          - entities.Drill.fields.scheduled_end
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: "Resource=Group, semantics=buffer-gap (DRILL_BUFFER_MINUTES=30, closed intervals): a drill starting 20 min after another's end violates the 30-min buffer → ERR_WINDOW_OVERLAP; different resource and interval arithmetic than the gateway half-open rule."
        test_recipe:
          setup:
            - "Group g1 with a SCHEDULED drill [2026-03-12T10:00:00Z, 2026-03-12T11:00:00Z]."
          setup_api_calls:
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /drills", payload: { group_id: "${g1}", scheduled_start: "2026-03-12T10:00:00Z", scheduled_end: "2026-03-12T11:00:00Z" }, as: ContactAdmin }
          trigger:
            - { call: "POST /drills", payload: { group_id: "${g1}", scheduled_start: "2026-03-12T11:20:00Z", scheduled_end: "2026-03-12T12:00:00Z" }, as: ContactAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "second drill -> HTTP 422, data.error_id == ERR_WINDOW_OVERLAP (gap 20 min < 30 min buffer)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: gateway_window_count_conserved_across_dispatch_and_cancel
        grounds:
          - calculations.gateway_window_count
          - state_machines.Alert.APPROVED_to_DISPATCHING
          - state_machines.Alert.SENT_to_CANCELLED
          - entities.Gateway.fields.window_count
        distinguishing_aspect: "Conserved quantity = Gateway.window_count == COUNT(non-SUPPRESSED notifications of the channel_type in the window): dispatch drives it 0->1, the compensating cancel drives it 1->0 with zero drift."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; SMS gateway gw1; contact c1 CONFIRMED SMS in g1; alert a1 dispatched (1 QUEUED notification), window_count read as 1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin, captures: { gw1: "$.data.id" } }
            - { call: "POST /contacts", payload: { full_name: "Jo", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550030" }, as: ContactAdmin, captures: { ch1: "$.data.id", tok1: "$.data.confirmation_token" } }
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "${tok1}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
