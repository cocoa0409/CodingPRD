# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — section 1.8 Test Targeting Index
# Task: task_3447_crayon_manufacturing_color_retirement_experience_attraction
# 9 rules x 3 instances = 27 instances. Every instance grounds in SCAFFOLD.yaml
# sections 1.1-1.7 and replays only against section 1.5 endpoints.
# Logical clock default: 2026-09-01T00:00:00Z. All literal dates >= that.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: allocation_waterfall_provisional_includes_projection_vs_final_physical_only
        grounds:
          - calculations.retail_allocation_waterfall
          - entities.RetailAllocation.fields.allocated_boxes_provisional
          - entities.RetailAllocation.fields.allocated_boxes_final
          - endpoints.POST_/crayon-works/retail-allocations
          - endpoints.POST_/crayon-works/retail-allocations/{id}/decision
        distinguishing_aspect: "Dual-variant calculation on the RetailAllocation/InventoryLot domain: the PROVISIONAL variant's pool adds in-season planned production (25 projected boxes) while the FINAL variant counts physical on-hand only, so the same 300-box request yields 156 provisional but 131 final."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; color Cerulean ACTIVE; RETAIL spec {Cerulean:8} at 1600 cents/box; batch CERTIFIED; formula APPROVED."
            - "Run R1 completed with 1000 packed units (125 boxes lot); run R2 completed with 50 packed units (6 boxes lot, 2 waste); run R3 PLANNED for 25 boxes ending 2027-05-20 (inside the season window, so it projects)."
            - "Spec boxes_available == 131; projected pool == 25."
          setup_api_calls:
            - &d_clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_color
              call: "POST /crayon-works/colors"
              payload: { name: "Cerulean", hex_code: "#02A4D3", is_core_curriculum: true }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - &d_camp_intro
              call: "POST /crayon-works/colors/${c_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-05T00:00:00Z", closes_on: "2026-09-20T23:59:59Z" }
              as: PlatformAdmin
              captures: { camp_id: $.data.id }
            - &d_clock_open
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - &d_epoch
              call: "POST /crayon-works/ops/run-epoch"
              payload: {}
              as: PlatformAdmin
            - &d_votes_pass
              call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp_id}", voter_segment: KIDS, choice: "YES", count: 20 }
              as: Consumer
            - &d_clock_close
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - *d_epoch
            - &d_spec
              call: "POST /crayon-works/assortment-specs"
              payload: { name: "Cerulean 8-box", kind: RETAIL, entries: [{ color_id: "${c_id}", count: 8 }], wholesale_price_cents: 1600 }
              as: PlatformAdmin
              captures: { spec_id: $.data.id }
            - &d_batch
              call: "POST /crayon-works/pigment-batches"
              payload: { pigment_name: "Phthalo Blue", supplier_name: "PigmentCo", hazard_class: STANDARD, received_quantity_kg: 500, certification_mark: ACMI_AP }
              as: SourcingManager
              as_user_id: "sm-1"
              captures: { bat_id: $.data.id }
            - &d_certify
              call: "POST /crayon-works/pigment-batches/${bat_id}/certification-decision"
              payload: { decision: CERTIFY }
              as: QualityAssurance
              as_user_id: "qa-1"
            - &d_formula
              call: "POST /crayon-works/formulas"
              payload: { color_id: "${c_id}", intended_use: CRAYON, pigment_recipe: [{ pigment_name: "Phthalo Blue", parts: 3 }] }
              as: Formulator
              as_user_id: "f-1"
              captures: { frm_id: $.data.id }
            - &d_submit
              call: "POST /crayon-works/formulas/${frm_id}/transition"
              payload: { action: SUBMIT }
              as: Formulator
              as_user_id: "f-1"
            - &d_get_tests
              call: "GET /crayon-works/formulas/${frm_id}/safety-tests"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { test_id: "$.data[0].id" }
            - &d_test_pass
              call: "POST /crayon-works/safety-tests/${test_id}/record-result"
              payload: { outcome: PASS, result_notes: "clean" }
              as: LabTechnician
              as_user_id: "lab-1"
            - &d_approve
              call: "POST /crayon-works/formulas/${frm_id}/transition"
              payload: { action: APPROVE }
              as: SafetyOfficer
              as_user_id: "so-1"
            - &d_run1
              call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 125, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - &d_run1_adv1
              call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - &d_run1_adv2
              call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - &d_run1_adv3
              call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - &d_run1_complete
              call: "POST /crayon-works/production-runs/${r1_id}/transition"
              payload: { action: ADVANCE, packed_counts: [{ color_id: "${c_id}", count: 1000 }] }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 6, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /crayon-works/production-runs/${r2_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r2_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r2_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${r2_id}/transition"
              payload: { action: ADVANCE, packed_counts: [{ color_id: "${c_id}", count: 50 }] }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec_id}", pigment_batch_id: "${bat_id}", planned_boxes: 25, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { r3_id: $.data.id }
            - call: "GET /crayon-works/assortment-specs/${spec_id}"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { spec_v: $.data.version }
          trigger:
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "MegaMart", priority_tier: PLATINUM, requested_boxes: 300, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${spec_v}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /crayon-works/retail-allocations/${alloc_id}/decision"
              payload: { action: COMMIT }
              as: AllocationPlanner
              as_user_id: "ap-1"
          assert:
            - "RetailAllocation.${alloc_id}.allocated_boxes_provisional == 156 (131 physical + 25 projected in-season)"
            - "RetailAllocation.${alloc_id}.allocated_boxes_final == 131 (physical on-hand only)"
            - "the two variants diverge on identical request data: 156 != 131"
            - "GET /crayon-works/assortment-specs/${spec_id} shows boxes_available == 0 and boxes_reserved == 131"
            - "GET /crayon-works/production-runs/${r1_id}/inventory-lots shows data[0].boxes_committed == 125 and data[0].boxes_on_hand == 0"
            - "GET /crayon-works/production-runs/${r2_id}/inventory-lots shows data[0].boxes_committed == 6"

      - name: vote_tally_identical_ballots_pass_introduction_but_fail_retirement
        grounds:
          - calculations.vote_tally
          - state_machines.Color.IN_VOTE_to_ACTIVE
          - state_machines.Color.RETIRE_VOTE_to_ACTIVE
          - endpoints.POST_/crayon-works/votes
        distinguishing_aspect: "Dual-variant calculation on the VoteCampaign/Color domain (different domain from the allocation waterfall): the RETIREMENT variant reweights COLLECTORS ballots 1.2 -> 2.5 and raises the threshold 0.55 -> 0.60, so the identical ballot multiset (10 KIDS yes, 1 COLLECTORS yes, 4 COLLECTORS no) PASSES an introduction (0.70 >= 0.55) but FAILS a retirement (0.5556 < 0.60)."
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-01T00:00:00Z. Colors Mango Tango and Retro Mauve both become ACTIVE via passing introduction campaigns."
            - "Mango Tango's introduction campaign k1 receives 10 KIDS yes, 1 COLLECTORS yes, 4 COLLECTORS no."
            - "Retro Mauve's retirement campaign k3 receives the identical ballot multiset."
          setup_api_calls:
            - *d_clock0
            - call: "POST /crayon-works/colors"
              payload: { name: "Mango Tango", hex_code: "#FF8244" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /crayon-works/colors"
              payload: { name: "Retro Mauve", hex_code: "#915C83" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /crayon-works/colors/${c1_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-05T00:00:00Z", closes_on: "2026-09-20T23:59:59Z" }
              as: PlatformAdmin
              captures: { k1_id: $.data.id }
            - call: "POST /crayon-works/colors/${c2_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-05T00:00:00Z", closes_on: "2026-09-20T23:59:59Z" }
              as: PlatformAdmin
              captures: { k2_id: $.data.id }
            - *d_clock_open
            - *d_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k1_id}", voter_segment: KIDS, choice: "YES", count: 10 }
              as: Consumer
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k1_id}", voter_segment: COLLECTORS, choice: "YES", count: 1 }
              as: Consumer
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k1_id}", voter_segment: COLLECTORS, choice: "NO", count: 4 }
              as: Consumer
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k2_id}", voter_segment: KIDS, choice: "YES", count: 20 }
              as: Consumer
            - *d_clock_close
            - *d_epoch
            - call: "POST /crayon-works/colors/${c2_id}/vote-campaigns"
              payload: { kind: RETIREMENT, opens_on: "2026-10-01T00:00:00Z", closes_on: "2026-10-15T23:59:59Z" }
              as: PlatformAdmin
              captures: { k3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - *d_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k3_id}", voter_segment: KIDS, choice: "YES", count: 10 }
              as: Consumer
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k3_id}", voter_segment: COLLECTORS, choice: "YES", count: 1 }
              as: Consumer
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${k3_id}", voter_segment: COLLECTORS, choice: "NO", count: 4 }
              as: Consumer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - *d_epoch
          assert:
            - "GET /crayon-works/colors/${c1_id}/vote-campaigns shows data[0].outcome == PASSED (introduction: yes 11.2 / total 16.0 = 0.70 >= 0.55)"
            - "GET /crayon-works/colors/${c2_id}/vote-campaigns shows data[1].outcome == FAILED (retirement: yes 12.5 / total 22.5 = 0.5556 < 0.60)"
            - "Color.${c1_id}.status == ACTIVE and Color.${c2_id}.status == ACTIVE"
            - "both campaigns saw turnout_count == 15 with an identical ballot multiset — only the variant differs"

      - name: licensed_royalty_gross_base_vs_net_base_diverge
        grounds:
          - calculations.licensed_royalty
          - entities.LicensedLine.fields.projected_royalty_cents
          - entities.LicensedLine.fields.royalty_base
        distinguishing_aspect: "Dual-variant calculation on the LicensedLine domain (third distinct domain): with lifetime gross 200000 cents, returns 40000 and packing penalties 76, the GROSS variant yields round(0.08 * 200000) == 16000 while NET yields round(0.08 * (200000 - 40000 - 76)) == 12794 — identical sales data, different royalty base."
        test_recipe:
          setup:
            - "Colors Cerulean (core) and Denim both ACTIVE; spec S1 {Cerulean:8} at 1600 cents/box; spec S2 {Cerulean:8, Denim:8} at 3200 cents/box; batch CERTIFIED; formulas for both colors APPROVED."
            - "Run R1 on S1 completed with exactly 125 boxes. Allocation A1 (PLATINUM, 100 boxes) COMMITTED; allocation A2 (GOLD, 25 boxes) COMMITTED then RELEASED."
            - "Run R2 on S2 completed with packed 78/78 against expected 80/80, recording packing_penalty_cents == 76."
            - "Licensed lines L-G (royalty_base GROSS) and L-N (royalty_base NET) both APPROVED on the Cerulean formula, rate 0.08."
          setup_api_calls:
            - *d_clock0
            - *d_color
            - *d_camp_intro
            - *d_clock_open
            - *d_epoch
            - *d_votes_pass
            - *d_clock_close
            - *d_epoch
            - call: "POST /crayon-works/colors"
              payload: { name: "Denim", hex_code: "#1560BD" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /crayon-works/colors/${c2_id}/vote-campaigns"
              payload: { kind: INTRODUCTION, opens_on: "2026-09-25T00:00:00Z", closes_on: "2026-10-10T23:59:59Z" }
              as: PlatformAdmin
              captures: { camp2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-26T00:00:00Z" }
              as: PlatformAdmin
            - *d_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp2_id}", voter_segment: KIDS, choice: "YES", count: 20 }
              as: Consumer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: PlatformAdmin
            - *d_epoch
            - *d_spec
            - *d_batch
            - *d_certify
            - *d_formula
            - *d_submit
            - *d_get_tests
            - *d_test_pass
            - *d_approve
            - call: "POST /crayon-works/formulas"
              payload: { color_id: "${c2_id}", intended_use: CRAYON, pigment_recipe: [{ pigment_name: "Prussian Blue", parts: 2 }] }
              as: Formulator
              as_user_id: "f-1"
              captures: { frm2_id: $.data.id }
            - call: "POST /crayon-works/formulas/${frm2_id}/transition"
              payload: { action: SUBMIT }
              as: Formulator
              as_user_id: "f-1"
            - call: "GET /crayon-works/formulas/${frm2_id}/safety-tests"
              payload: {}
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { test2_id: "$.data[0].id" }
            - call: "POST /crayon-works/safety-tests/${test2_id}/record-result"
              payload: { outcome: PASS }
              as: LabTechnician
              as_user_id: "lab-1"
            - call: "POST /crayon-works/formulas/${frm2_id}/transition"
              payload: { action: APPROVE }
              as: SafetyOfficer
              as_user_id: "so-1"
            - *d_run1
            - *d_run1_adv1
            - *d_run1_adv2
            - *d_run1_adv3
            - *d_run1_complete
            - call: "POST /crayon-works/assortment-specs"
              payload: { name: "Cerulean-Denim 16-box", kind: RETAIL, entries: [{ color_id: "${c_id}", count: 8 }, { color_id: "${c2_id}", count: 8 }], wholesale_price_cents: 3200 }
              as: PlatformAdmin
              captures: { spec2_id: $.data.id }
            - call: "POST /crayon-works/production-runs"
              payload: { assortment_spec_id: "${spec2_id}", pigment_batch_id: "${bat_id}", planned_boxes: 10, planned_start_date: "2027-04-15T00:00:00Z", planned_end_date: "2027-05-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /crayon-works/production-runs/${rp_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${rp_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${rp_id}/transition"
              payload: { action: ADVANCE }
              as: PlatformAdmin
            - call: "POST /crayon-works/production-runs/${rp_id}/transition"
              payload: { action: ADVANCE, packed_counts: [{ color_id: "${c_id}", count: 78 }, { color_id: "${c2_id}", count: 78 }] }
              as: PlatformAdmin
            - call: "GET /crayon-works/assortment-specs/${spec_id}"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { spec_v: $.data.version }
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "MegaMart", priority_tier: PLATINUM, requested_boxes: 100, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${spec_v}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { a1_id: $.data.id }
            - call: "POST /crayon-works/retail-allocations/${a1_id}/decision"
              payload: { action: COMMIT }
              as: AllocationPlanner
              as_user_id: "ap-1"
            - call: "GET /crayon-works/assortment-specs/${spec_id}"
              payload: {}
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { spec_v2: $.data.version }
            - call: "POST /crayon-works/retail-allocations"
              payload: { assortment_spec_id: "${spec_id}", retailer_name: "ValueShop", priority_tier: GOLD, requested_boxes: 25, requested_ship_date: "2027-07-15T00:00:00Z", expected_assortment_spec_version: "${spec_v2}" }
              as: AllocationPlanner
              as_user_id: "ap-1"
              captures: { a2_id: $.data.id }
            - call: "POST /crayon-works/retail-allocations/${a2_id}/decision"
              payload: { action: COMMIT }
              as: AllocationPlanner
              as_user_id: "ap-1"
            - call: "POST /crayon-works/retail-allocations/${a2_id}/decision"
              payload: { action: RELEASE }
              as: AllocationPlanner
              as_user_id: "ap-1"
            - call: "GET /crayon-works/formulas/${frm_id}"
              payload: {}
              as: BrandManager
              as_user_id: "bm-1"
              captures: { fcg_v: $.data.version }
            - call: "POST /crayon-works/licensed-lines"
              payload: { name: "GrossLine", licensor_user_id: "lic-1", formula_id: "${frm_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2028-08-31T23:59:59Z", royalty_rate: 0.08, royalty_base: GROSS }
              as: BrandManager
              as_user_id: "bm-1"
              captures: { lg_id: $.data.id }
            - call: "POST /crayon-works/licensed-lines/${lg_id}/transition"
              payload: { action: SUBMIT, expected_formula_version: "${fcg_v}" }
              as: BrandManager
              as_user_id: "bm-1"
            - call: "POST /crayon-works/licensed-lines/${lg_id}/transition"
              payload: { action: LICENSOR_APPROVE, expected_formula_version: "${fcg_v}" }
              as: Licensor
              as_user_id: "lic-1"
            - call: "POST /crayon-works/licensed-lines/${lg_id}/transition"
              payload: { action: BRAND_APPROVE, expected_formula_version: "${fcg_v}" }
              as: BrandManager
              as_user_id: "bm-2"
            - call: "GET /crayon-works/formulas/${frm_id}"
              payload: {}
              as: BrandManager
              as_user_id: "bm-1"
              captures: { fcg_v2: $.data.version }
            - call: "POST /crayon-works/licensed-lines"
              payload: { name: "NetLine", licensor_user_id: "lic-1", formula_id: "${frm_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2028-08-31T23:59:59Z", royalty_rate: 0.08, royalty_base: NET }
              as: BrandManager
              as_user_id: "bm-1"
              captures: { ln_id: $.data.id }
            - call: "POST /crayon-works/licensed-lines/${ln_id}/transition"
              payload: { action: SUBMIT, expected_formula_version: "${fcg_v2}" }
              as: BrandManager
              as_user_id: "bm-1"
            - call: "POST /crayon-works/licensed-lines/${ln_id}/transition"
              payload: { action: LICENSOR_APPROVE, expected_formula_version: "${fcg_v2}" }
              as: Licensor
              as_user_id: "lic-1"
            - call: "POST /crayon-works/licensed-lines/${ln_id}/transition"
              payload: { action: BRAND_APPROVE, expected_formula_version: "${fcg_v2}" }
              as: BrandManager
              as_user_id: "bm-2"
          trigger:
            - call: "GET /crayon-works/licensed-lines/${lg_id}"
              payload: {}
              as: BrandManager
              as_user_id: "bm-1"
            - call: "GET /crayon-works/licensed-lines/${ln_id}"
              payload: {}
              as: BrandManager
              as_user_id: "bm-1"
          assert:
            - "LicensedLine.${lg_id}.projected_royalty_cents == 16000 (round_half_up(0.08 * 200000))"
            - "LicensedLine.${ln_id}.projected_royalty_cents == 12794 (round_half_up(0.08 * (200000 - 40000 - 76)))"
            - "the variants diverge by exactly the returns-plus-penalties term: 16000 - 12794 == 3206 == round_half_up(0.08 * 40076)"
            - "both lines show status == APPROVED and pinned_formula_version equal to the formula version captured at their own approval"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: ticket_price_stacks_capacity_tier_group_discount_and_weekend
        grounds:
          - calculations.ticket_dynamic_price
          - entities.Ticket.fields.price_cents
