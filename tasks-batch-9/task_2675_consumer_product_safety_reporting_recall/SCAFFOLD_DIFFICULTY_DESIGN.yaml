        grounds:
          - validations[19].ERR_AUDIT_WINDOW_CONFLICT
          - endpoints["POST /product-safety/audit-visits"]
          - entities.AuditVisit.fields.window_start
          - entities.AuditVisit.fields.window_end
        distinguishing_aspect: |
          A DIFFERENT metric (an interval/buffer instant, not money or day counts)
          on a DIFFERENT endpoint (/audit-visits, not /section-reports/{id}/submit).
          The existing SCHEDULED window ends 2026-03-17T17:00:00Z and the new window
          starts at exactly 2026-03-18T17:00:00Z — precisely existing.window_end +
          AUDIT_BUFFER_HOURS 24. The conflict predicate is
