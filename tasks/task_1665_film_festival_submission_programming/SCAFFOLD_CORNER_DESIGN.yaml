          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { edv0: $.data.version } }
          trigger:
            - { call: "POST /festival/slates/00000000-0000-0000-0000-000000000000/lock", payload: {}, as: PROGRAM_CHAIR, captures: { e1: $.data.error_id } }
            - { call: "POST /festival/travel-packages/00000000-0000-0000-0000-000000000000/approve", payload: { expected_edition_version: "${edv0}" }, as: SCHEDULING_OPS, captures: { e2: $.data.error_id } }
            - { call: "POST /festival/awards", payload: { edition_id: "00000000-0000-0000-0000-000000000000", name: "X", section: SHORTS, prize_cents: 1, assigned_juror_ids: [] }, as: JUROR, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { e3: $.data.error_id } }
            - { call: "POST /festival/editions/00000000-0000-0000-0000-000000000000/advance", payload: { to_status: INTAKE_OPEN }, as: TRAVEL_COORDINATOR, captures: { e4: $.data.error_id } }
