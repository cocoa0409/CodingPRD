      - name: winery_annual_state_liters_accumulates_then_nets_out_a_returned_shipment
        claim_type: aggregation
        grounds:
          - calculations.winery_annual_state_volume_liters
          - validations.priority_85
          - errors[ERR_WINERY_VOLUME_LIMIT_EXCEEDED]
          - entities.VolumeLedgerEntry.fields.event_type
          - entities.Winery.fields.excise_reversed_cents
        distinguishing_aspect: |
          The winery aggregate is only observable through the priority-85 gate, so the running total is
          probed at three points: it clears at exactly 9.000 L (equality clears), it blocks the very next
          0.750 L order, and after a RETURN_TO_SENDER writes a negative RETURN_CREDIT row the same 0.750 L order
          clears. The reversal must move the aggregate back down without deleting the original
          SHIPMENT_ACCEPTED row — three ledger rows survive, summing to 4.500.
