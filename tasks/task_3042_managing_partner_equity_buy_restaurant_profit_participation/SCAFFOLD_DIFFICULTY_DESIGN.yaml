          - state_machines.MeatCutBatch.VARIANCE_CONFIRMED_to_VARIANCE_WAIVED
          - calculations.restaurant_profit_computation
        distinguishing_aspect: |
          Two DIFFERENT conserved quantities: (a) capital mass — escrow moved
          to capital_account on activation (2500000 = 2500000, escrow zeroed),
          and escrow fully refunded to zero on lapse; (b) waste-charge mass —
          confirming then waiving a batch returns the period's consolidated
          waste deduction to zero (forward action + compensating action leave
          the quantity unchanged).
