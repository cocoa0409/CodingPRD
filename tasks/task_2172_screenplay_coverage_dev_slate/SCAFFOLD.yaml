scenario: "desgin task harder than expert level.!!!!2172. Screenplay Coverage & Development Slate (studio development department): submission intake & release-form requirement, reader assignment & coverage report standard, rating/recommendation & tracking board, option agreement & rights chain documentation, development milestone (draft/polish) & payment schedule, writer attachment & rewrite assignment, turnaround/reversion clauses, slate greenlight committee review"
domain_name: "screenplay-coverage-dev-slate"
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: "beyond_expert"
  notes: |
    Sixteen entities wired into one graph: LiteraryProperty is the hub, with a
    self-referential chain-of-title document graph on one side, a submission ->
    release-form -> assignment -> coverage-report -> tracking-board pipeline on
    another, and an option -> project -> engagement -> milestone -> greenlight
    spine on a third. DevelopmentProject carries two INDEPENDENT state axes
    (rights_status x development_status); CoverageReport carries a revision
    cycle; GreenlightReview is a weighted fork-join with veto. Every difficulty
    knob (§0.5 rules 1-9) is instantiated at least twice, several three times.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: LiteraryProperty
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Title of the underlying literary material.
      - name: material_type
        type: enum
        source: input
        description: Form of the underlying material.
        constraints: "one of SPEC_SCRIPT, BOOK, ARTICLE, PLAY, LIFE_RIGHTS_STORY, ORIGINAL_PITCH"
      - name: source_author_name
        type: string
        source: input
        description: Name of the underlying author of record.
      - name: genre
        type: enum
        source: input
        description: Primary genre; drives reader specialty matching in the selector policy.
        constraints: "one of DRAMA, COMEDY, THRILLER, HORROR, SCIFI, FAMILY, DOCUMENTARY"
      - name: logline
        type: string
        source: input
        description: One-sentence logline.
        default: ""
      - name: rights_chain_status
        type: enum
        source: computed
        description: Chain-of-title posture derived from the property's RightsChainDocument set by calculation `rights_chain_status_derivation`.
        default: UNVERIFIED
        constraints: "one of UNVERIFIED, PARTIAL, CLEAR, DISPUTED"
      - name: verified_document_count
        type: integer
        source: computed
        description: Count of RightsChainDocument rows on this property with verified == true AND superseded == false.
        default: 0
      - name: tracking_tier
        type: enum
        source: computed
        description: Mirror of the highest-tier LIVE TrackingBoardEntry on this property; PRIORITY is forced by a PASSED GreenlightReview.
        default: NONE
        constraints: "one of NONE, WATCH, HOT, PRIORITY"
      - name: encumbrance_count
        type: integer
        source: computed
        description: Count of OptionAgreement rows on this property with status IN {ACTIVE, EXTENDED, EXERCISED}.
        default: 0

  - name: RightsChainDocument
    parent: LiteraryProperty
    common_fields: false
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> LiteraryProperty.id; the property whose chain of title this document evidences."
      - name: doc_type
        type: enum
        source: input
        description: Category of chain-of-title evidence.
        constraints: "one of CHAIN_OF_TITLE, COPYRIGHT_CERT, WGA_REGISTRATION, PRIOR_ASSIGNMENT, LIFE_RIGHTS_RELEASE, CLEARANCE_OPINION"
      - name: executed_on
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the document was executed.
      - name: verified
        type: boolean
        source: input
        description: Whether Business Affairs has verified the document.
      - name: supersedes_document_id
        type: string
        source: input
        description: "FK -> RightsChainDocument.id; the earlier document this one replaces, or null. Self-referential edge forming the chain-of-title graph."
        default: null
      - name: notes
        type: string
        source: input
        description: Free-text annotation.
        default: ""
      - name: superseded
        type: boolean
        source: computed
        description: True when some other RightsChainDocument row carries supersedes_document_id == this row's id.
        default: false

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> LiteraryProperty.id; the material being submitted."
      - name: submitting_agency
        type: string
        source: input
        description: Name of the submitting agency/company; matched against SIGNATORY_AGENCIES to decide the release-form requirement.
      - name: submitter_contact_email
        type: string
        source: input
        description: Contact address for the submitting party.
      - name: submitted_via
        type: enum
        source: input
        description: Channel the submission arrived through.
        constraints: "one of AGENCY, MANAGER, ATTORNEY, UNSOLICITED, INTERNAL"
      - name: priority_flag
        type: enum
        source: input
        description: Intake priority; selects the coverage turnaround budget.
        default: STANDARD
        constraints: "one of RUSH, STANDARD, BACKLOG"
      - name: release_form_required
        type: boolean
        source: computed
        description: Computed at create by calculation `release_form_requirement`; frozen thereafter.
      - name: received_at
        type: datetime
        source: system
        description: Logical clock value at create.
      - name: coverage_due_at
        type: datetime
        source: computed
        description: received_at + TURNAROUND_HOURS[priority_flag]; default window_due for the coverage assignment.
      - name: status
        type: enum
        source: system
        description: Intake/coverage lifecycle state.
        default: RECEIVED
        constraints: "one of RECEIVED, RELEASE_PENDING, INTAKE_CLEARED, READER_ASSIGNED, COVERAGE_IN_REVIEW, TRACKED, PASSED, IN_DEVELOPMENT, WITHDRAWN"
      - name: decision
        type: enum
        source: computed
        description: Mirror of the APPROVED CoverageReport's recommendation; PENDING until a report is approved.
        default: PENDING
        constraints: "one of PENDING, PASS, CONSIDER, RECOMMEND, STRONG_RECOMMEND"
      - name: withdrawal_reason
        type: string
        source: input
        description: Reason captured on withdraw.
        default: null

  - name: ReleaseForm
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the submission this release covers."
      - name: status
        type: enum
        source: system
        description: Release-form lifecycle state; lazily expired at assign-reader time.
        default: REQUIRED
        constraints: "one of REQUIRED, SENT, EXECUTED, WAIVED, EXPIRED"
      - name: expires_at
        type: datetime
        source: input
        description: Instant after which the release is no longer good; lazy expiry compares the logical clock strictly greater than this value.
      - name: signer_name
        type: string
        source: input
        description: Name of the individual who executed the release.
        default: null
      - name: signed_at
        type: datetime
        source: system
        description: Logical clock value at execution.
        default: null
      - name: waiver_reason
        type: string
        source: input
        description: Reason Business/Legal waived the release requirement.
        default: null

  - name: Reader
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Story analyst's name.
      - name: specialty_genre
        type: enum
        source: input
        description: Genre this reader specializes in; drives selector eligibility and ranking.
        constraints: "one of DRAMA, COMEDY, THRILLER, HORROR, SCIFI, FAMILY, DOCUMENTARY"
      - name: weekly_capacity
        type: integer
        source: input
        description: Maximum number of open assignments this reader may hold at once; a capacity ceiling on active_assignment_count.
        constraints: "integer, 1..20"
      - name: employment_type
        type: enum
        source: input
        description: STAFF readers are eligible for any genre; FREELANCE readers only for their specialty.
        constraints: "one of STAFF, FREELANCE"
      - name: status
        type: enum
        source: input
        description: Availability state.
        default: ACTIVE
        constraints: "one of ACTIVE, ON_LEAVE, INACTIVE"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Conserved counter: count of CoverageAssignment rows for this reader with status IN {ASSIGNED, IN_PROGRESS, SUBMITTED}."
        default: 0
      - name: completed_report_count
        type: integer
        source: computed
        description: Count of CoverageReport rows authored by this reader with status == APPROVED.
        default: 0
      - name: calibration_bias
        type: number
        source: computed
        description: round_half_up(avg(composite_score of this reader's APPROVED reports) - CALIBRATION_ANCHOR, 2); 0.00 when the reader has no APPROVED report.
        default: 0.00

  - name: CoverageAssignment
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the submission being covered."
      - name: reader_id
        type: string
        source: input
        description: "FK -> Reader.id; supplied explicitly or chosen by the `reader_selection_policy` selector."
      - name: assigned_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the StoryEditor who created this assignment; NOT a foreign key. Used by the segregation-of-duties check on coverage approval.
      - name: window_start
        type: datetime
        source: input
        description: Start of the reader's occupation window; defaults to the logical clock at create.
      - name: window_due
        type: datetime
        source: input
        description: End of the reader's occupation window; defaults to submission.coverage_due_at.
      - name: status
        type: enum
        source: system
        description: Assignment lifecycle state.
        default: ASSIGNED
        constraints: "one of ASSIGNED, IN_PROGRESS, SUBMITTED, COMPLETED, RECALLED"
      - name: recall_reason
        type: string
        source: input
        description: Reason captured on recall.
        default: null
      - name: auto_selected
        type: boolean
        source: system
        description: True when reader_id was chosen by the selector rather than supplied in the request.
        default: false

  - name: CoverageReport
    parent: CoverageAssignment
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> CoverageAssignment.id; the assignment this report answers. The report row is created in DRAFT as a side effect of assign-reader."
      - name: logline_score
        type: integer
        source: input
        description: Logline craft score.
        default: null
        constraints: "integer, 1..10"
      - name: structure_score
        type: integer
        source: input
        description: Structure craft score.
        default: null
        constraints: "integer, 1..10"
      - name: character_score
        type: integer
        source: input
        description: Character craft score.
        default: null
        constraints: "integer, 1..10"
      - name: dialogue_score
        type: integer
        source: input
        description: Dialogue craft score.
        default: null
        constraints: "integer, 1..10"
      - name: marketability_score
        type: integer
        source: input
        description: Marketability score.
        default: null
        constraints: "integer, 1..10"
      - name: recommendation
        type: enum
        source: input
        description: The reader's recommendation line.
        default: null
        constraints: "one of PASS, CONSIDER, RECOMMEND, STRONG_RECOMMEND"
      - name: synopsis_word_count
        type: integer
        source: input
        description: Word count of the synopsis section; the coverage standard requires at least COVERAGE_MIN_SYNOPSIS_WORDS.
        default: 0
      - name: comparable_titles
        type: array
        source: input
        description: List of comparable titles cited in the report.
        default: []
      - name: composite_score
        type: number
        source: computed
        description: "Variant AS_SUBMITTED of `coverage_score_pair`: the raw weighted score, recomputed on every submit."
        default: null
      - name: normalized_score
        type: number
        source: computed
        description: "Variant CALIBRATED of `coverage_score_pair`: the raw weighted score less the author reader's calibration_bias as of submit time, clamped to [1.00, 10.00]. Never recomputed after submit."
        default: null
      - name: revision_round_count
        type: integer
        source: system
        description: Number of times the story editor has sent this report back; capped at COVERAGE_MAX_REVISION_ROUNDS.
        default: 0
      - name: revision_note
        type: string
        source: input
        description: Latest revision note from the story editor.
        default: null
      - name: status
        type: enum
        source: system
        description: Coverage report lifecycle state; cycles SUBMITTED -> REVISION_REQUESTED -> SUBMITTED.
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, REJECTED"
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the StoryEditor who approved; NOT a foreign key.
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: Reason captured on reject.
        default: null

  - name: TrackingBoardEntry
    parent: LiteraryProperty
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> LiteraryProperty.id; the property placed on the tracking board."
      - name: report_id
        type: string
        source: input
        description: "FK -> CoverageReport.id; the approved coverage report that produced this entry."
      - name: board_tier
        type: enum
        source: computed
        description: Tier derived from heat_score by the THRESHOLD ladder in `tracking_heat_score`.
        constraints: "one of NONE, WATCH, HOT, PRIORITY"
      - name: heat_score
        type: number
        source: computed
        description: Output of calculation `tracking_heat_score`, two decimals.
      - name: competing_submission_count
        type: integer
        source: computed
        description: Count of OTHER Submission rows on the same property_id with status IN {TRACKED, IN_DEVELOPMENT} at the instant the entry is created.
      - name: entered_at
        type: datetime
        source: system
        description: Logical clock value at create.
      - name: status
        type: enum
        source: system
        description: LIVE while the entry drives property.tracking_tier; ARCHIVED once superseded or greenlit.
        default: LIVE
        constraints: "one of LIVE, ARCHIVED"

  - name: OptionAgreement
    parent: LiteraryProperty
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> LiteraryProperty.id; the property being optioned."
      - name: option_fee_cents
        type: integer
        source: input
        description: Fee paid for the initial option period.
        constraints: "integer, >= 1"
      - name: purchase_price_cents
        type: integer
        source: input
        description: Unescalated purchase price on exercise.
        constraints: "integer, >= 1"
      - name: initial_period_months
        type: integer
        source: input
        description: Length of the initial exclusive option period, in calendar months.
        constraints: "integer, 1..36"
      - name: extension_period_months
        type: integer
        source: input
        description: Length of the single permitted extension, in calendar months.
        default: 0
        constraints: "integer, 0..24"
      - name: extension_fee_cents
        type: integer
        source: input
        description: Fee payable to exercise the extension.
        default: 0
      - name: applicable_to_purchase
        type: boolean
        source: input
        description: Variant selector for `option_net_purchase_due` — true selects APPLICABLE, false selects NON_APPLICABLE.
        default: true
      - name: option_start_at
        type: datetime
        source: input
        description: Start of the exclusive option window (half-open interval start).
      - name: option_end_at
        type: datetime
        source: computed
        description: option_start_at plus initial_period_months, plus extension_period_months once extension_exercised; half-open interval end (exclusive).
        default: null
      - name: extension_exercised
        type: boolean
        source: system
        description: True once the single extension has been taken.
        default: false
      - name: escalation_bps
        type: integer
        source: computed
        description: Step 1 of `option_net_purchase_due`; band-selected from the linked DevelopmentProject's budget_cents, 0 when no project is linked.
        default: 0
      - name: adjusted_purchase_price_cents
        type: integer
        source: computed
        description: Step 2 of `option_net_purchase_due`.
        default: null
      - name: applicable_credit_cents
        type: integer
        source: computed
        description: Step 4 of `option_net_purchase_due`; 0 under the NON_APPLICABLE variant.
        default: 0
      - name: net_purchase_due_cents
        type: integer
        source: computed
        description: adjusted_purchase_price_cents - applicable_credit_cents.
        default: null
      - name: status
        type: enum
        source: system
        description: Option lifecycle state.
        default: DRAFTED
        constraints: "one of DRAFTED, ACTIVE, EXTENDED, EXERCISED, LAPSED, REVERTED, TERMINATED"
      - name: termination_reason
        type: string
        source: input
        description: Reason captured on terminate or on supersede.
        default: null
      - name: exercise_notice_at
        type: datetime
        source: system
        description: Logical clock value at exercise.
        default: null

  - name: DevelopmentProject
    parent: LiteraryProperty
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> LiteraryProperty.id; the underlying property."
      - name: option_agreement_id
        type: string
        source: input
        description: "FK -> OptionAgreement.id; the option that supplies the rights."
      - name: owning_exec_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the DevelopmentExec who created the project; NOT a foreign key. Drives the greenlight segregation-of-duties check.
      - name: budget_cents
        type: integer
        source: input
        description: All-in production budget estimate; selects the option escalation band.
        constraints: "integer, >= 1"
      - name: slate_year
        type: integer
        source: input
        description: Slate year the project is tracked against.
      - name: rights_status
        type: enum
        source: system
        description: "Rights axis of the parallel state machine — evolves independently of development_status."
        default: OPTIONED
        constraints: "one of OPTIONED, OWNED, LAPSED_RIGHTS, REVERTED"
      - name: development_status
        type: enum
        source: system
        description: "Development axis of the parallel state machine — evolves independently of rights_status."
        default: SETUP
        constraints: "one of SETUP, WRITING, DRAFT_DELIVERED, POLISH, POLISH_DELIVERED, GREENLIT, TURNAROUND, DEAD"
      - name: committed_writer_fee_cents
        type: integer
        source: computed
        description: Sum of WriterEngagement.total_fee_cents on this project with status IN {ATTACHED, ACTIVE, COMPLETED}.
        default: 0
      - name: writer_budget_cap_cents
        type: integer
        source: computed
        description: floor(budget_cents * DEV_BUDGET_WRITER_SHARE_BPS / 10000).
      - name: turnaround_start_at
        type: datetime
        source: system
        description: Logical clock value when the project was placed in turnaround.
        default: null
      - name: turnaround_eligible_at
        type: datetime
        source: computed
        description: turnaround_start_at plus TURNAROUND_REVERSION_MONTHS calendar months, day-of-month clamped to the last valid day of the target month.
        default: null
      - name: turnaround_reason
        type: string
        source: input
        description: Reason captured on place-in-turnaround.
        default: null
      - name: greenlight_ready
        type: boolean
        source: computed
        description: True when rights_status == OWNED AND development_status IN {DRAFT_DELIVERED, POLISH_DELIVERED}.
        default: false

  - name: Writer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Writer's name.
      - name: guild_member
        type: boolean
        source: input
        description: Whether the writer is a guild member; gates the guild minimum check.
        default: true
      - name: quote_cents
        type: integer
        source: input
        description: The writer's standing quote.
      - name: status
        type: enum
        source: input
        description: Availability state.
        default: ACTIVE
        constraints: "one of ACTIVE, UNAVAILABLE"
      - name: committed_fee_cents
        type: integer
        source: computed
        description: "Conserved quantity: sum of MilestonePayment.gross_amount_cents across this writer's engagements where MilestonePayment.status IN {SCHEDULED, DUE, APPROVED}."
        default: 0
      - name: paid_fee_cents
        type: integer
        source: computed
        description: Sum of MilestonePayment.gross_amount_cents across this writer's engagements where MilestonePayment.status == PAID.
        default: 0
      - name: active_engagement_count
        type: integer
        source: computed
        description: Count of WriterEngagement rows for this writer with status IN {ATTACHED, ACTIVE}.
        default: 0

  - name: WriterEngagement
    parent: DevelopmentProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> DevelopmentProject.id; the project the writer is engaged on."
      - name: writer_id
        type: string
        source: input
        description: "FK -> Writer.id; the attached writer."
      - name: engagement_type
        type: enum
        source: input
        description: Step of the development ladder this engagement covers; selects the milestone template.
        constraints: "one of ORIGINAL_DRAFT, REWRITE, POLISH, PRODUCTION_REWRITE"
      - name: total_fee_cents
        type: integer
        source: input
        description: Total compensation across all milestones.
        constraints: "integer, >= 1"
      - name: start_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the engagement window opens; closed-interval start for the writer concurrency check.
      - name: end_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the engagement window closes; closed-interval end for the writer concurrency check.
      - name: status
        type: enum
        source: system
        description: Engagement lifecycle state.
        default: PROPOSED
        constraints: "one of PROPOSED, ATTACHED, ACTIVE, COMPLETED, TERMINATED"
      - name: guild_minimum_cents
        type: integer
        source: computed
        description: GUILD_MINIMUM_FEE_CENTS[engagement_type]; 0 when writer.guild_member == false.
      - name: milestone_count
        type: integer
        source: computed
        description: Number of MilestonePayment rows generated on attach.
        default: 0
      - name: termination_reason
        type: string
        source: input
        description: Reason captured on terminate or on cascade termination.
        default: null

  - name: MilestonePayment
    parent: WriterEngagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: input
        description: "FK -> WriterEngagement.id; the engagement this milestone belongs to."
      - name: milestone_type
        type: enum
        source: system
        description: Milestone step from the engagement_type template.
        constraints: "one of COMMENCEMENT, FIRST_DRAFT_DELIVERY, FIRST_DRAFT_ACCEPTANCE, REWRITE_DELIVERY, POLISH_DELIVERY, PRODUCTION_BONUS"
      - name: sequence_index
        type: integer
        source: system
        description: Zero-based position of this milestone inside its template; pins payment ordering.
      - name: percentage_bps
        type: integer
        source: system
        description: Share of total_fee_cents in basis points, from the template.
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Output of calculation `milestone_payment_schedule` — floor per line, remainder to the largest share.
      - name: status
        type: enum
        source: system
        description: Payment lifecycle state.
        default: SCHEDULED
        constraints: "one of SCHEDULED, DUE, APPROVED, PAID, VOIDED"
      - name: due_on
        type: string
        source: system
        description: engagement.start_date plus MILESTONE_DUE_OFFSET_DAYS[milestone_type] days.
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the BusinessAffairs approver; NOT a foreign key.
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Logical clock value at payment.
        default: null

  - name: GreenlightReview
    parent: DevelopmentProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> DevelopmentProject.id; the project under committee review."
      - name: session_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) of the committee session.
      - name: status
        type: enum
        source: system
        description: Review lifecycle state; fork-join over the committee's votes.
        default: OPEN
        constraints: "one of OPEN, VOTING, PASSED, DECLINED, DEFERRED, WITHDRAWN"
      - name: eligible_weight_bps
        type: integer
        source: computed
        description: Snapshot at open-voting of the summed vote_weight_bps of CommitteeMember rows with status == ACTIVE; frozen thereafter.
        default: 0
      - name: cast_weight_bps
        type: integer
        source: computed
        description: Sum of weight_bps_snapshot over all CommitteeVote rows on this review (all four vote values).
        default: 0
      - name: decisive_weight_bps
        type: integer
        source: computed
        description: cast_weight_bps less the summed weight of ABSTAIN votes.
        default: 0
      - name: approve_weight_bps
        type: integer
        source: computed
        description: Sum of weight_bps_snapshot over CommitteeVote rows with vote_value == APPROVE.
        default: 0
      - name: quorum_pct
        type: number
        source: computed
        description: round_half_up(100 * cast_weight_bps / eligible_weight_bps, 2), computed at close.
        default: 0.00
      - name: approval_pct
        type: number
        source: computed
        description: round_half_up(100 * approve_weight_bps / decisive_weight_bps, 2), computed at close; 0.00 when decisive_weight_bps == 0.
        default: 0.00
      - name: veto_cast
        type: boolean
        source: computed
        description: True when at least one CommitteeVote on this review has vote_value == VETO from a member whose veto_power was true at vote time.
        default: false
      - name: decision_note
        type: string
        source: input
        description: Note recorded by the chair at close.
        default: null
      - name: withdrawal_reason
        type: string
        source: input
        description: Reason captured on withdraw or on supersede.
        default: null

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Committee member's name.
      - name: vote_weight_bps
        type: integer
        source: input
        description: Voting weight in basis points.
        constraints: "integer, 1..10000"
      - name: veto_power
        type: boolean
        source: input
        description: Whether this member may cast a binding VETO.
        default: false
      - name: exec_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the DevelopmentExec this member is the same person as, or null. NOT a foreign key; drives the greenlight segregation-of-duties check.
        default: null
      - name: status
        type: enum
        source: input
        description: Membership state; only ACTIVE members are counted into eligible_weight_bps.
        default: ACTIVE
        constraints: "one of ACTIVE, INACTIVE"

  - name: CommitteeVote
    parent: GreenlightReview
    common_fields: false
    fields:
      - name: review_id
        type: string
        source: input
        description: "FK -> GreenlightReview.id; the review being voted on."
      - name: member_id
        type: string
        source: input
        description: "FK -> CommitteeMember.id; the voting member (taken from X-User-ID)."
      - name: vote_value
        type: enum
        source: input
        description: The ballot.
        constraints: "one of APPROVE, DECLINE, ABSTAIN, VETO"
      - name: weight_bps_snapshot
        type: integer
        source: system
        description: The member's vote_weight_bps frozen at the instant the vote was cast.
      - name: comment
        type: string
        source: input
        description: Optional note attached to the ballot.
        default: null

state_machines:
  - entity: Submission
    initial_state: RECEIVED
    terminal_states: [PASSED, IN_DEVELOPMENT, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: RELEASE_PENDING
        trigger: "POST /submissions/{id}/release-forms"
        actor: StoryEditor
        preconditions:
          - "submission.release_form_required == true"
          - "no ReleaseForm on this submission with status IN {REQUIRED, SENT, EXECUTED, WAIVED}"
        side_effects:
          - "creates ReleaseForm with status REQUIRED"
          - "increments Submission.version by 1"
      - from: RECEIVED
        to: INTAKE_CLEARED
        trigger: "POST /submissions/{id}/clear-intake"
        actor: StoryEditor
        preconditions:
          - "submission.status == RECEIVED (the transition is declared from RECEIVED only; from RELEASE_PENDING it is ERR_INVALID_STATE)"
          - "the release-form requirement of validation priority 82 is satisfied - see that row for the ERR_RELEASE_FORM_REQUIRED path"
        side_effects:
          - "increments Submission.version by 1"
        note: "Signatory-agency submissions skip the release-form leg entirely; an unsolicited submission that has never had a release executed or waived is refused here with ERR_RELEASE_FORM_REQUIRED, not ERR_INVALID_STATE."
      - from: RELEASE_PENDING
        to: INTAKE_CLEARED
        trigger: "POST /release-forms/{id}/execute"
        actor: Submitter
        preconditions:
          - "ReleaseForm.status == SENT"
          - "current_utc <= ReleaseForm.expires_at"
        side_effects:
          - "ReleaseForm.status := EXECUTED; ReleaseForm.signed_at := current_utc"
          - "increments Submission.version by 1"
      - from: RELEASE_PENDING
        to: INTAKE_CLEARED
        trigger: "POST /release-forms/{id}/waive"
        actor: StoryEditor
        preconditions:
          - "ReleaseForm.status IN {REQUIRED, SENT}"
        side_effects:
          - "ReleaseForm.status := WAIVED"
          - "increments Submission.version by 1"
      - from: INTAKE_CLEARED
        to: READER_ASSIGNED
        trigger: "POST /submissions/{id}/assign-reader"
        actor: StoryEditor
        preconditions:
          - "property.rights_chain_status != DISPUTED"
          - "when submission.release_form_required == true, the ReleaseForm status IN {EXECUTED, WAIVED} after lazy expiry has been applied"
          - "the resolved reader passes eligibility, capacity and window-overlap checks"
        side_effects:
          - "lazy expiry: any ReleaseForm on this submission with status IN {REQUIRED, SENT, EXECUTED} and expires_at < current_utc is first set to EXPIRED"
          - "creates CoverageAssignment with status ASSIGNED, assigned_by_user_id := X-User-ID"
          - "creates CoverageReport with status DRAFT for the new assignment"
          - "Reader.active_assignment_count += 1"
          - "increments Submission.version by 1"
      - from: READER_ASSIGNED
        to: COVERAGE_IN_REVIEW
        trigger: "system, on POST /coverage-reports/{id}/submit"
        actor: system
        preconditions:
          - "CoverageReport.status transitions to SUBMITTED"
        side_effects:
          - "CoverageAssignment.status := SUBMITTED"
          - "increments Submission.version by 1"
      - from: COVERAGE_IN_REVIEW
        to: READER_ASSIGNED
        trigger: "system, on POST /coverage-reports/{id}/request-revision"
        actor: system
        preconditions:
          - "CoverageReport.revision_round_count < COVERAGE_MAX_REVISION_ROUNDS"
        side_effects:
          - "CoverageAssignment.status := IN_PROGRESS"
          - "increments Submission.version by 1"
        note: "Cycle: INTAKE_CLEARED -> READER_ASSIGNED -> COVERAGE_IN_REVIEW -> READER_ASSIGNED."
      - from: COVERAGE_IN_REVIEW
        to: TRACKED
        trigger: "system, on POST /coverage-reports/{id}/approve when recommendation != PASS"
        actor: system
        preconditions:
          - "CoverageReport.recommendation IN {CONSIDER, RECOMMEND, STRONG_RECOMMEND}"
        side_effects:
          - "Submission.decision := CoverageReport.recommendation"
          - "CoverageAssignment.status := COMPLETED; Reader.active_assignment_count -= 1; Reader.completed_report_count += 1; Reader.calibration_bias recomputed"
          - "creates TrackingBoardEntry (status LIVE) with heat_score and board_tier from `tracking_heat_score`"
          - "LiteraryProperty.tracking_tier := the new entry's board_tier when that tier ranks strictly higher than the current value under NONE < WATCH < HOT < PRIORITY"
          - "increments Submission.version by 1"
      - from: COVERAGE_IN_REVIEW
        to: PASSED
        trigger: "system, on POST /coverage-reports/{id}/approve when recommendation == PASS"
        actor: system
        preconditions:
          - "CoverageReport.recommendation == PASS"
        side_effects:
          - "Submission.decision := PASS"
          - "CoverageAssignment.status := COMPLETED; Reader.active_assignment_count -= 1; Reader.completed_report_count += 1; Reader.calibration_bias recomputed"
          - "no TrackingBoardEntry is created and LiteraryProperty.tracking_tier is left unchanged"
          - "increments Submission.version by 1"
      - from: READER_ASSIGNED
        to: INTAKE_CLEARED
        trigger: "POST /coverage-assignments/{id}/recall"
        actor: StoryEditor
        preconditions:
          - "CoverageAssignment.status IN {ASSIGNED, IN_PROGRESS}"
        side_effects:
          - "CoverageAssignment.status := RECALLED"
          - "Reader.active_assignment_count -= 1"
          - "the assignment's CoverageReport, if status IN {DRAFT, REVISION_REQUESTED}, becomes REJECTED"
          - "increments Submission.version by 1"
      - from: COVERAGE_IN_REVIEW
        to: INTAKE_CLEARED
        trigger: "POST /coverage-reports/{id}/reject"
        actor: StoryEditor
        preconditions:
          - "CoverageReport.status == SUBMITTED"
          - "CoverageReport.revision_round_count >= COVERAGE_MAX_REVISION_ROUNDS"
        side_effects:
          - "CoverageReport.status := REJECTED"
          - "CoverageAssignment.status := RECALLED; Reader.active_assignment_count -= 1"
          - "increments Submission.version by 1"
      - from: TRACKED
        to: IN_DEVELOPMENT
        trigger: "system, on POST /development-projects"
        actor: system
        preconditions:
          - "the created DevelopmentProject.property_id == submission.property_id"
        side_effects:
          - "increments Submission.version by 1"
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: Submitter | StoryEditor
        preconditions: ["submission.status NOT IN {PASSED, IN_DEVELOPMENT, WITHDRAWN}"]
        side_effects:
          - "Submission.withdrawal_reason := reason"
          - "increments Submission.version by 1"
      - from: RELEASE_PENDING
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: Submitter | StoryEditor
        preconditions: ["submission.status NOT IN {PASSED, IN_DEVELOPMENT, WITHDRAWN}"]
        side_effects:
          - "any ReleaseForm with status IN {REQUIRED, SENT} becomes EXPIRED"
          - "increments Submission.version by 1"
      - from: INTAKE_CLEARED
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: Submitter | StoryEditor
        preconditions: ["submission.status NOT IN {PASSED, IN_DEVELOPMENT, WITHDRAWN}"]
        side_effects: ["increments Submission.version by 1"]
      - from: READER_ASSIGNED
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: Submitter | StoryEditor
        preconditions: ["submission.status NOT IN {PASSED, IN_DEVELOPMENT, WITHDRAWN}"]
        side_effects:
          - "the open CoverageAssignment becomes RECALLED; Reader.active_assignment_count -= 1"
          - "its CoverageReport, if not APPROVED, becomes REJECTED"
          - "increments Submission.version by 1"
      - from: COVERAGE_IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: Submitter | StoryEditor
        preconditions: ["submission.status NOT IN {PASSED, IN_DEVELOPMENT, WITHDRAWN}"]
        side_effects:
          - "the open CoverageAssignment becomes RECALLED; Reader.active_assignment_count -= 1"
          - "its CoverageReport, if not APPROVED, becomes REJECTED"
          - "increments Submission.version by 1"

  - entity: ReleaseForm
    initial_state: REQUIRED
    terminal_states: [EXECUTED, WAIVED, EXPIRED]
    transitions:
      - from: REQUIRED
        to: SENT
        trigger: "POST /release-forms/{id}/send"
        actor: StoryEditor
        preconditions: ["ReleaseForm.status == REQUIRED", "current_utc <= ReleaseForm.expires_at"]
        side_effects: ["increments ReleaseForm.version by 1"]
      - from: SENT
        to: EXECUTED
        trigger: "POST /release-forms/{id}/execute"
        actor: Submitter
        preconditions: ["ReleaseForm.status == SENT", "current_utc <= ReleaseForm.expires_at"]
        side_effects:
          - "ReleaseForm.signed_at := current_utc"
          - "Submission.status := INTAKE_CLEARED"
      - from: REQUIRED
        to: WAIVED
        trigger: "POST /release-forms/{id}/waive"
        actor: StoryEditor
        preconditions: ["ReleaseForm.status IN {REQUIRED, SENT}"]
        side_effects: ["Submission.status := INTAKE_CLEARED"]
      - from: SENT
        to: WAIVED
        trigger: "POST /release-forms/{id}/waive"
        actor: StoryEditor
        preconditions: ["ReleaseForm.status IN {REQUIRED, SENT}"]
        side_effects: ["Submission.status := INTAKE_CLEARED"]
      - from: REQUIRED
        to: EXPIRED
        trigger: "system, lazy expiry evaluated at the start of POST /submissions/{id}/assign-reader and POST /submissions/{id}/withdraw"
        actor: system
        preconditions: ["current_utc > ReleaseForm.expires_at"]
        side_effects: ["increments ReleaseForm.version by 1"]
      - from: SENT
        to: EXPIRED
        trigger: "system, lazy expiry evaluated at the start of POST /submissions/{id}/assign-reader and POST /submissions/{id}/withdraw"
        actor: system
        preconditions: ["current_utc > ReleaseForm.expires_at"]
        side_effects: ["increments ReleaseForm.version by 1"]
      - from: EXECUTED
        to: EXPIRED
        trigger: "system, lazy expiry evaluated at the start of POST /submissions/{id}/assign-reader"
        actor: system
        preconditions: ["current_utc > ReleaseForm.expires_at"]
        side_effects: ["increments ReleaseForm.version by 1"]
        note: "An executed release goes stale; the submission stays INTAKE_CLEARED but reader assignment is blocked by ERR_RELEASE_FORM_EXPIRED."

  - entity: CoverageAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, RECALLED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /coverage-assignments/{id}/start"
        actor: Reader
        preconditions: ["X-User-ID == CoverageAssignment.reader_id", "status == ASSIGNED"]
        side_effects: ["increments CoverageAssignment.version by 1"]
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "system, on POST /coverage-reports/{id}/submit"
        actor: system
        preconditions: ["the assignment's CoverageReport passes the coverage standard"]
        side_effects: ["Submission.status := COVERAGE_IN_REVIEW"]
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "system, on POST /coverage-reports/{id}/submit"
        actor: system
        preconditions: ["the assignment's CoverageReport passes the coverage standard"]
        side_effects: ["Submission.status := COVERAGE_IN_REVIEW"]
      - from: SUBMITTED
        to: IN_PROGRESS
        trigger: "system, on POST /coverage-reports/{id}/request-revision"
        actor: system
        preconditions: ["CoverageReport.revision_round_count < COVERAGE_MAX_REVISION_ROUNDS"]
        side_effects: ["Submission.status := READER_ASSIGNED"]
      - from: SUBMITTED
        to: COMPLETED
        trigger: "system, on POST /coverage-reports/{id}/approve"
        actor: system
        preconditions: ["CoverageReport.status == SUBMITTED"]
        side_effects:
          - "Reader.active_assignment_count -= 1"
          - "Reader.completed_report_count += 1"
          - "Reader.calibration_bias recomputed by `reader_calibration_bias`"
      - from: ASSIGNED
        to: RECALLED
        trigger: "POST /coverage-assignments/{id}/recall"
        actor: StoryEditor
        preconditions: ["status IN {ASSIGNED, IN_PROGRESS}"]
        side_effects:
          - "Reader.active_assignment_count -= 1"
          - "CoverageReport := REJECTED"
          - "Submission.status := INTAKE_CLEARED"
      - from: IN_PROGRESS
        to: RECALLED
        trigger: "POST /coverage-assignments/{id}/recall"
        actor: StoryEditor
        preconditions: ["status IN {ASSIGNED, IN_PROGRESS}"]
        side_effects:
          - "Reader.active_assignment_count -= 1"
          - "CoverageReport := REJECTED"
          - "Submission.status := INTAKE_CLEARED"
      - from: SUBMITTED
        to: RECALLED
        trigger: "system, on POST /coverage-reports/{id}/reject"
        actor: system
        preconditions: ["CoverageReport.revision_round_count >= COVERAGE_MAX_REVISION_ROUNDS"]
        side_effects:
          - "Reader.active_assignment_count -= 1"
          - "Submission.status := INTAKE_CLEARED"

  - entity: CoverageReport
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /coverage-reports/{id}/submit"
        actor: Reader
        preconditions:
          - "X-User-ID == the assignment's reader_id"
          - "all five craft scores are non-null integers in 1..10"
          - "recommendation is non-null"
          - "synopsis_word_count >= COVERAGE_MIN_SYNOPSIS_WORDS"
          - "CoverageAssignment.status IN {ASSIGNED, IN_PROGRESS}"
        side_effects:
          - "composite_score := `coverage_score_pair` variant AS_SUBMITTED"
          - "normalized_score := `coverage_score_pair` variant CALIBRATED using the author reader's calibration_bias as of this instant"
          - "CoverageAssignment.status := SUBMITTED; Submission.status := COVERAGE_IN_REVIEW"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /coverage-reports/{id}/request-revision"
        actor: StoryEditor
        preconditions:
          - "status == SUBMITTED"
          - "revision_round_count < COVERAGE_MAX_REVISION_ROUNDS"
        side_effects:
          - "revision_round_count += 1; revision_note := revision_note"
          - "CoverageAssignment.status := IN_PROGRESS; Submission.status := READER_ASSIGNED"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /coverage-reports/{id}/submit"
        actor: Reader
        preconditions:
          - "X-User-ID == the assignment's reader_id"
          - "all five craft scores are non-null integers in 1..10"
          - "recommendation is non-null"
          - "synopsis_word_count >= COVERAGE_MIN_SYNOPSIS_WORDS"
        side_effects:
          - "composite_score and normalized_score are recomputed from the current field values"
          - "CoverageAssignment.status := SUBMITTED; Submission.status := COVERAGE_IN_REVIEW"
        note: "Closes the revision cycle SUBMITTED -> REVISION_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /coverage-reports/{id}/approve"
        actor: StoryEditor
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != CoverageAssignment.assigned_by_user_id (segregation of duties)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "CoverageAssignment.status := COMPLETED (link 1)"
          - "Reader.active_assignment_count -= 1; Reader.completed_report_count += 1; Reader.calibration_bias recomputed (link 2, caused by link 1)"
          - "Submission.status := TRACKED or PASSED and Submission.decision := recommendation (link 3, caused by link 1)"
          - "when Submission became TRACKED, a TrackingBoardEntry is created with heat_score/board_tier (link 4, caused by link 3)"
          - "LiteraryProperty.tracking_tier := the new entry's board_tier when strictly higher (link 5, caused by link 4)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /coverage-reports/{id}/reject"
        actor: StoryEditor
        preconditions:
          - "status == SUBMITTED"
          - "revision_round_count >= COVERAGE_MAX_REVISION_ROUNDS"
        side_effects:
          - "rejection_reason := reason"
          - "CoverageAssignment.status := RECALLED; Reader.active_assignment_count -= 1"
          - "Submission.status := INTAKE_CLEARED"
      - from: DRAFT
        to: REJECTED
        trigger: "system, on POST /coverage-assignments/{id}/recall or POST /submissions/{id}/withdraw"
        actor: system
        preconditions: ["the parent CoverageAssignment is being recalled"]
        side_effects: ["increments CoverageReport.version by 1"]
      - from: REVISION_REQUESTED
        to: REJECTED
        trigger: "system, on POST /coverage-assignments/{id}/recall or POST /submissions/{id}/withdraw"
        actor: system
        preconditions: ["the parent CoverageAssignment is being recalled"]
        side_effects: ["increments CoverageReport.version by 1"]

  - entity: OptionAgreement
    initial_state: DRAFTED
    terminal_states: [LAPSED, REVERTED, TERMINATED]
    transitions:
      - from: DRAFTED
        to: ACTIVE
        trigger: "POST /option-agreements/{id}/execute"
        actor: BusinessAffairs
        preconditions:
          - "property.rights_chain_status == CLEAR"
          - "no other OptionAgreement on the same property with status IN {ACTIVE, EXTENDED, EXERCISED} whose half-open window [option_start_at, option_end_at) intersects this one"
        side_effects:
          - "option_end_at := option_start_at + initial_period_months"
          - "escalation_bps, adjusted_purchase_price_cents, applicable_credit_cents, net_purchase_due_cents := `option_net_purchase_due`"
          - "LiteraryProperty.encumbrance_count += 1"
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /option-agreements/{id}/extend"
        actor: BusinessAffairs
        preconditions:
          - "extension_exercised == false"
          - "extension_period_months >= 1"
          - "current_utc < option_end_at"
        side_effects:
          - "extension_exercised := true; option_end_at += extension_period_months"
          - "net_purchase_due_cents recomputed by `option_net_purchase_due` (total fees paid now include extension_fee_cents)"
      - from: ACTIVE
        to: EXERCISED
        trigger: "POST /option-agreements/{id}/exercise"
        actor: BusinessAffairs
        preconditions:
          - "current_utc < option_end_at"
          - "a DevelopmentProject exists with option_agreement_id == this option and rights_status == OPTIONED"
        side_effects:
          - "exercise_notice_at := current_utc"
          - "net_purchase_due_cents recomputed by `option_net_purchase_due`"
          - "DevelopmentProject.rights_status := OWNED"
      - from: EXTENDED
        to: EXERCISED
        trigger: "POST /option-agreements/{id}/exercise"
        actor: BusinessAffairs
        preconditions:
          - "current_utc < option_end_at"
          - "a DevelopmentProject exists with option_agreement_id == this option and rights_status == OPTIONED"
        side_effects:
          - "exercise_notice_at := current_utc"
          - "net_purchase_due_cents recomputed by `option_net_purchase_due`"
          - "DevelopmentProject.rights_status := OWNED"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /option-agreements/{id}/lapse"
        actor: BusinessAffairs
        preconditions:
          - "current_utc >= option_end_at"
        side_effects:
          - "LiteraryProperty.encumbrance_count -= 1 (link 1)"
          - "the linked DevelopmentProject.rights_status := LAPSED_RIGHTS (link 2, caused by link 1's loss of encumbrance)"
          - "because rights_status became LAPSED_RIGHTS, DevelopmentProject.development_status := DEAD and every WriterEngagement on the project with status IN {PROPOSED, ATTACHED, ACTIVE} becomes TERMINATED (link 3)"
          - "because those engagements became TERMINATED, each of their MilestonePayment rows with status IN {SCHEDULED, DUE, APPROVED} becomes VOIDED (link 4)"
          - "because those milestones were voided, each affected Writer.committed_fee_cents is reduced by the summed gross_amount_cents of its voided rows and Writer.active_engagement_count is reduced by its terminated ATTACHED/ACTIVE engagements (link 5)"
      - from: EXTENDED
        to: LAPSED
        trigger: "POST /option-agreements/{id}/lapse"
        actor: BusinessAffairs
        preconditions:
          - "current_utc >= option_end_at"
        side_effects:
          - "identical five-link cascade as the ACTIVE -> LAPSED transition"
      - from: EXERCISED
        to: REVERTED
        trigger: "system, on POST /development-projects/{id}/reversion-notice"
        actor: system
        preconditions:
          - "DevelopmentProject.development_status == TURNAROUND"
          - "current_utc >= DevelopmentProject.turnaround_eligible_at"
        side_effects:
          - "LiteraryProperty.encumbrance_count -= 1"
          - "LiteraryProperty.rights_chain_status := PARTIAL when it was CLEAR (reversion clouds the chain until re-papered)"
          - "DevelopmentProject.rights_status := REVERTED; DevelopmentProject.development_status := DEAD"
      - from: DRAFTED
        to: TERMINATED
        trigger: "POST /option-agreements/{id}/terminate"
        actor: BusinessAffairs
        preconditions: ["status == DRAFTED"]
        side_effects: ["termination_reason := reason"]
      - from: DRAFTED
        to: TERMINATED
        trigger: "system, on POST /option-agreements when another option is created on the same property"
        actor: system
        preconditions: ["status == DRAFTED"]
        side_effects:
          - "termination_reason := 'SUPERSEDED_BY_NEW_DRAFT'"
        note: "Create-with-supersede; the OCC rule `option-create-stale-property` guards it."

  - entity: DevelopmentProject
    initial_state: "rights_status=OPTIONED x development_status=SETUP"
    terminal_states: [DEAD]
    transitions:
      - from: "rights_status=OPTIONED"
        to: "rights_status=OWNED"
        trigger: "system, on POST /option-agreements/{id}/exercise"
        actor: system
        preconditions: ["the option reaching EXERCISED is this project's option_agreement_id"]
        side_effects: ["greenlight_ready recomputed", "increments DevelopmentProject.version by 1"]
        note: "Rights axis moves independently of development_status."
      - from: "rights_status=OPTIONED"
        to: "rights_status=LAPSED_RIGHTS"
        trigger: "system, on POST /option-agreements/{id}/lapse"
        actor: system
        preconditions: ["the lapsing option is this project's option_agreement_id"]
        side_effects: ["development_status := DEAD", "engagement/milestone/writer cascade links 3-5"]
      - from: "rights_status=OWNED"
        to: "rights_status=REVERTED"
        trigger: "system, on POST /development-projects/{id}/reversion-notice"
        actor: system
        preconditions: ["development_status == TURNAROUND", "current_utc >= turnaround_eligible_at"]
        side_effects: ["development_status := DEAD"]
      - from: "development_status=SETUP"
        to: "development_status=WRITING"
        trigger: "system, on POST /writer-engagements/{id}/attach with engagement_type IN {ORIGINAL_DRAFT, REWRITE, PRODUCTION_REWRITE}"
        actor: system
        preconditions: ["rights_status IN {OPTIONED, OWNED}"]
        side_effects: ["committed_writer_fee_cents += engagement.total_fee_cents"]
      - from: "development_status=WRITING"
        to: "development_status=DRAFT_DELIVERED"
        trigger: "POST /writer-engagements/{id}/deliver with milestone_type == FIRST_DRAFT_DELIVERY"
        actor: Writer
        preconditions: ["engagement.status IN {ATTACHED, ACTIVE}", "a SCHEDULED MilestonePayment of that type exists on the engagement"]
        side_effects: ["that MilestonePayment.status := DUE", "greenlight_ready recomputed"]
      - from: "development_status=DRAFT_DELIVERED"
        to: "development_status=WRITING"
        trigger: "system, on POST /writer-engagements/{id}/attach with engagement_type == REWRITE"
        actor: system
        preconditions: ["rights_status IN {OPTIONED, OWNED}"]
        side_effects: ["committed_writer_fee_cents += engagement.total_fee_cents", "greenlight_ready := false"]
        note: "Rewrite cycle: WRITING -> DRAFT_DELIVERED -> WRITING."
      - from: "development_status=DRAFT_DELIVERED"
        to: "development_status=POLISH"
        trigger: "system, on POST /writer-engagements/{id}/attach with engagement_type == POLISH"
        actor: system
        preconditions: ["rights_status IN {OPTIONED, OWNED}"]
        side_effects: ["committed_writer_fee_cents += engagement.total_fee_cents", "greenlight_ready := false"]
      - from: "development_status=POLISH"
        to: "development_status=POLISH_DELIVERED"
        trigger: "POST /writer-engagements/{id}/deliver with milestone_type == POLISH_DELIVERY"
        actor: Writer
        preconditions: ["engagement.status IN {ATTACHED, ACTIVE}"]
        side_effects: ["that MilestonePayment.status := DUE", "greenlight_ready recomputed"]
      - from: "development_status=DRAFT_DELIVERED"
        to: "development_status=GREENLIT"
        trigger: "system, on POST /greenlight-reviews/{id}/close resolving to PASSED"
        actor: system
        preconditions: ["rights_status == OWNED"]
        side_effects:
          - "LiteraryProperty.tracking_tier := PRIORITY"
          - "every LIVE TrackingBoardEntry on the property becomes ARCHIVED"
      - from: "development_status=POLISH_DELIVERED"
        to: "development_status=GREENLIT"
        trigger: "system, on POST /greenlight-reviews/{id}/close resolving to PASSED"
        actor: system
        preconditions: ["rights_status == OWNED"]
        side_effects:
          - "LiteraryProperty.tracking_tier := PRIORITY"
          - "every LIVE TrackingBoardEntry on the property becomes ARCHIVED"
      - from: "development_status IN {SETUP, WRITING, DRAFT_DELIVERED, POLISH, POLISH_DELIVERED}"
        to: "development_status=TURNAROUND"
        trigger: "POST /development-projects/{id}/place-in-turnaround"
        actor: DevelopmentExec
        preconditions: ["development_status NOT IN {GREENLIT, TURNAROUND, DEAD}"]
        side_effects:
          - "turnaround_start_at := current_utc; turnaround_eligible_at := turnaround_start_at + TURNAROUND_REVERSION_MONTHS (link 1)"
          - "because the project entered turnaround, every WriterEngagement with status IN {PROPOSED, ATTACHED, ACTIVE} becomes TERMINATED (link 2)"
          - "because those engagements terminated, their MilestonePayment rows with status IN {SCHEDULED, DUE, APPROVED} become VOIDED and Writer.committed_fee_cents / Writer.active_engagement_count are reduced accordingly (link 3)"
          - "any OPEN or VOTING GreenlightReview on the project becomes WITHDRAWN"
      - from: "development_status=TURNAROUND"
        to: "development_status=DEAD"
        trigger: "POST /development-projects/{id}/reversion-notice"
        actor: BusinessAffairs
        preconditions:
          - "current_utc >= turnaround_eligible_at"
          - "the linked OptionAgreement.status == EXERCISED"
        side_effects:
          - "OptionAgreement.status := REVERTED; rights_status := REVERTED"
          - "LiteraryProperty.encumbrance_count -= 1; LiteraryProperty.rights_chain_status := PARTIAL when it was CLEAR"

  - entity: WriterEngagement
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ATTACHED
        trigger: "POST /writer-engagements/{id}/attach"
        actor: DevelopmentExec
        preconditions:
          - "writer.status == ACTIVE"
          - "the project's OptionAgreement.status IN {ACTIVE, EXTENDED, EXERCISED}"
          - "project.development_status NOT IN {GREENLIT, TURNAROUND, DEAD}"
          - "writer holds at most WRITER_MAX_CONCURRENT_ENGAGEMENTS - 1 other ATTACHED/ACTIVE engagements whose closed [start_date, end_date] window intersects this one"
          - "project.committed_writer_fee_cents + total_fee_cents <= project.writer_budget_cap_cents"
        side_effects:
          - "MilestonePayment rows generated by `milestone_payment_schedule`; milestone_count := len(template)"
          - "the sequence_index 0 milestone (COMMENCEMENT) is set to DUE, the rest stay SCHEDULED"
          - "Writer.committed_fee_cents += total_fee_cents; Writer.active_engagement_count += 1"
          - "project.committed_writer_fee_cents += total_fee_cents"
          - "project.development_status advances per the DevelopmentProject development axis"
      - from: ATTACHED
        to: ACTIVE
        trigger: "system, on POST /milestone-payments/{id}/pay for the COMMENCEMENT milestone"
        actor: system
        preconditions: ["the paid milestone has sequence_index == 0"]
        side_effects: ["increments WriterEngagement.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /writer-engagements/{id}/complete"
        actor: DevelopmentExec
        preconditions:
          - "every MilestonePayment on this engagement has status IN {PAID, VOIDED}"
        side_effects: ["Writer.active_engagement_count -= 1"]
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /writer-engagements/{id}/terminate"
        actor: DevelopmentExec
        preconditions: ["status NOT IN {COMPLETED, TERMINATED}"]
        side_effects: ["termination_reason := reason"]
      - from: ATTACHED
        to: TERMINATED
        trigger: "POST /writer-engagements/{id}/terminate"
        actor: DevelopmentExec
        preconditions: ["status NOT IN {COMPLETED, TERMINATED}"]
        side_effects:
          - "every MilestonePayment with status IN {SCHEDULED, DUE, APPROVED} becomes VOIDED"
          - "Writer.committed_fee_cents -= summed gross_amount_cents of those voided rows"
          - "Writer.active_engagement_count -= 1"
          - "project.committed_writer_fee_cents -= total_fee_cents"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /writer-engagements/{id}/terminate"
        actor: DevelopmentExec
        preconditions: ["status NOT IN {COMPLETED, TERMINATED}"]
        side_effects:
          - "every MilestonePayment with status IN {SCHEDULED, DUE, APPROVED} becomes VOIDED"
          - "Writer.committed_fee_cents -= summed gross_amount_cents of those voided rows"
          - "Writer.active_engagement_count -= 1"
          - "project.committed_writer_fee_cents -= total_fee_cents"

  - entity: MilestonePayment
    initial_state: SCHEDULED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system, on POST /writer-engagements/{id}/attach (sequence_index 0) or POST /writer-engagements/{id}/deliver (matching milestone_type)"
        actor: system
        preconditions: ["engagement.status IN {ATTACHED, ACTIVE}"]
        side_effects: ["increments MilestonePayment.version by 1"]
      - from: DUE
        to: APPROVED
        trigger: "POST /milestone-payments/{id}/approve"
        actor: BusinessAffairs
        preconditions:
          - "status == DUE"
          - "every MilestonePayment on the same engagement with a lower sequence_index has status IN {PAID, VOIDED}"
        side_effects: ["approved_by_user_id := X-User-ID"]
      - from: APPROVED
        to: PAID
        trigger: "POST /milestone-payments/{id}/pay"
        actor: BusinessAffairs
        preconditions:
          - "status == APPROVED"
          - "X-User-ID != MilestonePayment.approved_by_user_id (segregation of duties)"
        side_effects:
          - "paid_at := current_utc"
          - "Writer.committed_fee_cents -= gross_amount_cents; Writer.paid_fee_cents += gross_amount_cents"
          - "when sequence_index == 0, WriterEngagement.status := ACTIVE"
      - from: SCHEDULED
        to: VOIDED
        trigger: "system, on engagement termination or project turnaround/reversion cascade"
        actor: system
        preconditions: ["the parent engagement is being terminated"]
        side_effects: ["Writer.committed_fee_cents -= gross_amount_cents"]
      - from: DUE
        to: VOIDED
        trigger: "system, on engagement termination or project turnaround/reversion cascade"
        actor: system
        preconditions: ["the parent engagement is being terminated"]
        side_effects: ["Writer.committed_fee_cents -= gross_amount_cents"]
      - from: APPROVED
        to: VOIDED
        trigger: "system, on engagement termination or project turnaround/reversion cascade"
        actor: system
        preconditions: ["the parent engagement is being terminated"]
        side_effects: ["Writer.committed_fee_cents -= gross_amount_cents"]

  - entity: GreenlightReview
    initial_state: OPEN
    terminal_states: [PASSED, DECLINED, DEFERRED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: VOTING
        trigger: "POST /greenlight-reviews/{id}/open-voting"
        actor: SlateAdmin
        preconditions:
          - "project.rights_status == OWNED"
          - "project.development_status IN {DRAFT_DELIVERED, POLISH_DELIVERED}"
          - "at least GREENLIGHT_MIN_ACTIVE_MEMBERS CommitteeMember rows have status == ACTIVE"
        side_effects:
          - "eligible_weight_bps := summed vote_weight_bps of ACTIVE members, frozen"
      - from: VOTING
        to: VOTING
        trigger: "POST /greenlight-reviews/{id}/votes"
        actor: CommitteeMember
        preconditions:
          - "no CommitteeVote already exists on this review with the same member_id"
          - "the acting member's status == ACTIVE"
          - "the acting member's exec_user_id != project.owning_exec_user_id (segregation of duties)"
        side_effects:
          - "creates CommitteeVote with weight_bps_snapshot := member.vote_weight_bps"
          - "cast_weight_bps, decisive_weight_bps, approve_weight_bps, veto_cast recomputed"
      - from: VOTING
        to: PASSED
        trigger: "POST /greenlight-reviews/{id}/close"
        actor: SlateAdmin
        preconditions:
          - "quorum_pct >= GREENLIGHT_QUORUM_PCT"
          - "veto_cast == false"
          - "decisive_weight_bps > 0"
          - "approval_pct >= GREENLIGHT_APPROVAL_PCT"
        side_effects:
          - "project.development_status := GREENLIT"
          - "LiteraryProperty.tracking_tier := PRIORITY; LIVE TrackingBoardEntry rows on the property become ARCHIVED"
      - from: VOTING
        to: DECLINED
        trigger: "POST /greenlight-reviews/{id}/close"
        actor: SlateAdmin
        preconditions:
          - "quorum_pct >= GREENLIGHT_QUORUM_PCT"
          - "veto_cast == true, OR (decisive_weight_bps > 0 AND approval_pct < GREENLIGHT_APPROVAL_PCT)"
        side_effects: ["decision_note := decision_note; project state unchanged"]
      - from: VOTING
        to: DEFERRED
        trigger: "POST /greenlight-reviews/{id}/close"
        actor: SlateAdmin
        preconditions:
          - "quorum_pct >= GREENLIGHT_QUORUM_PCT"
          - "veto_cast == false"
          - "decisive_weight_bps == 0 (every cast ballot was ABSTAIN)"
        side_effects: ["decision_note := decision_note; project state unchanged"]
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /greenlight-reviews/{id}/withdraw"
        actor: SlateAdmin
        preconditions: ["status IN {OPEN, VOTING}"]
        side_effects: ["withdrawal_reason := reason"]
      - from: VOTING
        to: WITHDRAWN
        trigger: "POST /greenlight-reviews/{id}/withdraw"
        actor: SlateAdmin
        preconditions: ["status IN {OPEN, VOTING}"]
        side_effects: ["withdrawal_reason := reason"]
      - from: OPEN
        to: WITHDRAWN
        trigger: "system, on POST /greenlight-reviews when another review is created on the same project, or on POST /development-projects/{id}/place-in-turnaround"
        actor: system
        preconditions: ["status IN {OPEN, VOTING}"]
        side_effects: ["withdrawal_reason := 'SUPERSEDED_BY_NEW_REVIEW' or 'PROJECT_IN_TURNAROUND'"]
      - from: VOTING
        to: WITHDRAWN
        trigger: "system, on POST /greenlight-reviews when another review is created on the same project, or on POST /development-projects/{id}/place-in-turnaround"
        actor: system
        preconditions: ["status IN {OPEN, VOTING}"]
        side_effects: ["withdrawal_reason := 'SUPERSEDED_BY_NEW_REVIEW' or 'PROJECT_IN_TURNAROUND'"]

concurrency_rules:
  - rule_id: option-create-stale-property
    parent_entity: LiteraryProperty
    write_endpoint: "POST /option-agreements"
    occ_field: "expected_property_version"
    description: |
      Creating an OptionAgreement against a LiteraryProperty whose version has
      advanced since the client last observed it is rejected. Creating a new
      DRAFTED option legitimately supersedes every other DRAFTED option on the
      same property (they are set to TERMINATED with termination_reason
      SUPERSEDED_BY_NEW_DRAFT), so a writer working from a stale view of the
      property would silently destroy a draft it never saw. The stale-version
      check makes that observable.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: greenlight-create-stale-project
    parent_entity: DevelopmentProject
    write_endpoint: "POST /greenlight-reviews"
    occ_field: "expected_project_version"
    description: |
      Creating a GreenlightReview against a DevelopmentProject whose version has
      advanced since the client last observed it is rejected. A new review
      legitimately supersedes any OPEN or VOTING review on the same project
      (set to WITHDRAWN with withdrawal_reason SUPERSEDED_BY_NEW_REVIEW), so a
      chair working from a stale project view would discard ballots it never
      saw. The stale-version check makes that observable.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: engagement-create-stale-project
    parent_entity: DevelopmentProject
    write_endpoint: "POST /writer-engagements"
    occ_field: "expected_project_version"
    description: |
      Creating a WriterEngagement against a DevelopmentProject whose version has
      advanced since the client last observed it is rejected. A new PROPOSED
      engagement of a given engagement_type legitimately supersedes any other
      PROPOSED engagement of the same type on the project (set to TERMINATED
      with termination_reason SUPERSEDED_BY_NEW_PROPOSAL), and the project's
      writer budget headroom moves under the client's feet as siblings attach.
      The stale-version check makes both observable.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: release_form_requirement
    trigger: "on POST /submissions, once, at create; the resulting boolean is frozen for the life of the submission"
    algorithm: threshold
    formula: |
      release_form_required =
          (submitted_via == 'UNSOLICITED')
          OR (submitting_agency NOT IN SIGNATORY_AGENCIES)
      # String comparison against SIGNATORY_AGENCIES is exact and case-sensitive.
    input_set: "The submission's own submitted_via and submitting_agency values only; no other row is consulted."
    constants:
      SIGNATORY_AGENCIES: ["CAA", "WME", "UTA", "GERSH", "APA"]
    precision: "boolean"

  - name: coverage_turnaround_due
    trigger: "on POST /submissions, at create"
    algorithm: threshold
    formula: |
      coverage_due_at = received_at + TURNAROUND_HOURS[priority_flag] hours
    input_set: "The submission's own priority_flag and the logical clock at create."
    constants:
      TURNAROUND_HOURS: { RUSH: 24, STANDARD: 72, BACKLOG: 168 }
    precision: "whole hours, ISO 8601 UTC with three fractional digits"

  - name: rights_chain_status_derivation
    trigger: "on POST /literary-properties/{id}/rights-documents, after the new row is stored"
    algorithm: constraint_propagation
    formula: |
      # A row D is superseded when some other row on the same property carries
      # supersedes_document_id == D.id. Superseded rows never count.
      live_rows      = [d for d in property's RightsChainDocument rows if d.superseded == false]
      verified_rows  = [d for d in live_rows if d.verified == true]
      verified_document_count = len(verified_rows)
      verified_types = { d.doc_type for d in verified_rows }

      # Ladder is evaluated top to bottom; the FIRST matching branch wins.
      if any(d.doc_type == 'PRIOR_ASSIGNMENT' and d.verified == false for d in live_rows):
          rights_chain_status = 'DISPUTED'
      elif REQUIRED_CHAIN_TYPES is a subset of verified_types
           and verified_document_count >= CHAIN_CLEAR_MIN_DOCS:
          rights_chain_status = 'CLEAR'
      elif verified_document_count >= 1:
          rights_chain_status = 'PARTIAL'
      else:
          rights_chain_status = 'UNVERIFIED'
    input_set: "All RightsChainDocument rows whose property_id equals this property, with superseded == false. Superseded rows are excluded from both the DISPUTED scan and the verified counts."
    constants:
      REQUIRED_CHAIN_TYPES: ["CHAIN_OF_TITLE", "COPYRIGHT_CERT"]
      CHAIN_CLEAR_MIN_DOCS: 3
    precision: "enum"

  - name: reader_selection_policy
    trigger: "on POST /submissions/{id}/assign-reader when the request omits reader_id"
    algorithm: weighted_scoring
    formula: |
      # (a) Eligibility filter — an explicit predicate, no adjectives.
      candidates = [ r for r in Reader
                     if r.status == 'ACTIVE'
                     and r.active_assignment_count < r.weekly_capacity
                     and (r.specialty_genre == property.genre or r.employment_type == 'STAFF')
                     and r.id not in request.excluded_reader_ids
                     and r.id not in { a.reader_id for a in CoverageAssignment
                                       if a.submission_id == submission.id
                                       and a.status == 'RECALLED' }
                     and the reader passes `reader_window_overlap` for the requested window ]

      # (b) Ranking expression — three keys, ascending, evaluated left to right.
      genre_penalty = 0 if r.specialty_genre == property.genre else 1
      load_ratio    = r.active_assignment_count / r.weekly_capacity      # exact rational, no rounding
      rank_key      = (genre_penalty ASC, load_ratio ASC, r.completed_report_count DESC)

      # (c) Tie-break when rank_key ties completely: r.created_at ASC. Never r.id.
      # (d) Empty candidate set: reject the whole request with ERR_NO_ELIGIBLE_READER (409);
      #     no CoverageAssignment and no CoverageReport row is created.
    input_set: "Every Reader row, filtered by (a). Readers already holding a window-conflicting assignment are removed before ranking, so the selector never returns a reader the overlap rule would then reject."
    constants: {}
    precision: "load_ratio compared as an exact rational; no rounding is applied before comparison"

  - name: coverage_score_pair
    trigger: "on POST /coverage-reports/{id}/submit, for both the DRAFT->SUBMITTED and the REVISION_REQUESTED->SUBMITTED transition"
    algorithm: weighted_scoring
    formula: |
      raw = 0.10 * logline_score
          + 0.30 * structure_score
          + 0.25 * character_score
          + 0.15 * dialogue_score
          + 0.20 * marketability_score

      composite_score  = round_half_up(raw, 2)
      normalized_score = round_half_up(
                            min(10.00, max(1.00, raw - author_reader.calibration_bias)),
                            2)
      # author_reader.calibration_bias is read at THIS instant. normalized_score is
      # never recomputed afterwards - approving the report does not restate it.
    input_set: "The report's own five craft scores plus the calibration_bias of the Reader named by the report's assignment, as of the submit call."
    constants:
      SCORE_WEIGHTS: { logline: 0.10, structure: 0.30, character: 0.25, dialogue: 0.15, marketability: 0.20 }
    precision: "2 decimal places, round_half_up; the clamp is applied before rounding"
    variants:
      - name: AS_SUBMITTED
        when: "always stored in composite_score; the number shown on the coverage report itself and the number that feeds reader calibration"
        difference: "no calibration adjustment and no clamp"
      - name: CALIBRATED
        when: "always stored in normalized_score; the ONLY score that feeds `tracking_heat_score`"
        difference: "subtracts the author reader's calibration_bias and clamps into [1.00, 10.00], so a generous reader's report scores lower on the board than on its own face"

  - name: reader_calibration_bias
    trigger: "on POST /coverage-reports/{id}/approve, after the report reaches APPROVED"
    algorithm: aggregation
    formula: |
      approved = [ rep for rep in CoverageReport
                   if rep's assignment.reader_id == reader.id
                   and rep.status == 'APPROVED' ]           # includes the report just approved
      if len(approved) == 0:
          calibration_bias = 0.00
      else:
          calibration_bias = round_half_up(
              (sum(rep.composite_score for rep in approved) / len(approved)) - CALIBRATION_ANCHOR,
              2)
      completed_report_count = len(approved)
    input_set: "CoverageReport rows with status == APPROVED authored by this reader, ordered irrelevant (a mean). Reports in DRAFT, SUBMITTED, REVISION_REQUESTED or REJECTED are excluded."
    constants:
      CALIBRATION_ANCHOR: 5.50
    precision: "2 decimal places, round_half_up; the division is carried at full precision and rounded once, at the end"

  - name: tracking_heat_score
    trigger: "on POST /coverage-reports/{id}/approve when the submission moves to TRACKED, at TrackingBoardEntry creation"
    algorithm: threshold
    formula: |
      competing_submission_count =
          count of Submission rows s where s.property_id == property.id
                                      and s.id != this submission's id
                                      and s.status IN {'TRACKED', 'IN_DEVELOPMENT'}

      heat_score = round_half_up(
            report.normalized_score * 10
          + RECOMMENDATION_BONUS[report.recommendation]
          + min(COMPETITION_BONUS_CAP, COMPETITION_BONUS_PER_RIVAL * competing_submission_count)
          + (CLEAR_CHAIN_BONUS if property.rights_chain_status == 'CLEAR' else 0)
          - REVISION_PENALTY * report.revision_round_count
          , 2)

      # Tier ladder, evaluated top to bottom, INCLUSIVE lower bounds (>=, not >).
      if   heat_score >= TIER_PRIORITY_MIN: board_tier = 'PRIORITY'
      elif heat_score >= TIER_HOT_MIN:      board_tier = 'HOT'
      elif heat_score >= TIER_WATCH_MIN:    board_tier = 'WATCH'
      else:                                 board_tier = 'NONE'
    input_set: "The approved report's normalized_score, recommendation and revision_round_count; the property's rights_chain_status at the instant of approval; and the sibling-submission count defined above."
    constants:
      RECOMMENDATION_BONUS: { PASS: 0, CONSIDER: 8, RECOMMEND: 18, STRONG_RECOMMEND: 30 }
      COMPETITION_BONUS_PER_RIVAL: 3
      COMPETITION_BONUS_CAP: 15
      CLEAR_CHAIN_BONUS: 10
      REVISION_PENALTY: 5
      TIER_WATCH_MIN: 60.00
      TIER_HOT_MIN: 85.00
      TIER_PRIORITY_MIN: 110.00
    precision: "2 decimal places, round_half_up; the tier ladder is applied to the ROUNDED heat_score"

  - name: option_net_purchase_due
    trigger: "on POST /option-agreements/{id}/execute, on .../extend, on .../exercise, and on POST /development-projects (the newly linked budget changes the escalation band)"
    algorithm: tiered_pricing
    formula: |
      # The four steps are evaluated in EXACTLY this order. Step 3's tier is keyed
      # on the step-2 ESCALATED price, never on the raw purchase_price_cents - that
      # is the circular-looking dependency this rule pins down.

      # step 1
      if the option has no linked DevelopmentProject:
          escalation_bps = 0
      else:
          b = linked_project.budget_cents
          escalation_bps = 0    if b <  ESCALATION_BAND_MID_MIN
                           1500 if ESCALATION_BAND_MID_MIN <= b < ESCALATION_BAND_HIGH_MIN
                           2500 if b >= ESCALATION_BAND_HIGH_MIN

      # step 2
      adjusted_purchase_price_cents =
          round_half_up(purchase_price_cents * (10000 + escalation_bps) / 10000)

      # step 3 - tier keyed on the step-2 value
      p = adjusted_purchase_price_cents
      credit_cap_bps = 10000 if p <  CREDIT_BAND_MID_MIN
                        7500 if CREDIT_BAND_MID_MIN <= p < CREDIT_BAND_HIGH_MIN
                        5000 if p >= CREDIT_BAND_HIGH_MIN

      # step 4
      total_option_fees_paid_cents = option_fee_cents
                                   + (extension_fee_cents if extension_exercised else 0)
      applicable_credit_cents = min(total_option_fees_paid_cents,
                                    floor(adjusted_purchase_price_cents * credit_cap_bps / 10000))
                                if applicable_to_purchase else 0
      net_purchase_due_cents = adjusted_purchase_price_cents - applicable_credit_cents
    input_set: "The option's own fee/price fields plus the budget_cents of the DevelopmentProject whose option_agreement_id equals this option, when one exists. Projects with rights_status == REVERTED still count; no project at all means escalation_bps = 0."
    constants:
      ESCALATION_BAND_MID_MIN: 2000000000
      ESCALATION_BAND_HIGH_MIN: 6000000000
      CREDIT_BAND_MID_MIN: 25000000
      CREDIT_BAND_HIGH_MIN: 100000000
    precision: "whole cents; step 2 rounds half-up, step 4's cap floors"
    variants:
      - name: APPLICABLE
        when: "applicable_to_purchase == true"
        difference: "option fees paid are credited against the escalated purchase price, capped at credit_cap_bps of that price"
      - name: NON_APPLICABLE
        when: "applicable_to_purchase == false"
        difference: "applicable_credit_cents is 0, so net_purchase_due_cents equals adjusted_purchase_price_cents; the studio pays the fees on top of the price"

  - name: option_window_arithmetic
    trigger: "on POST /option-agreements/{id}/execute and on .../extend"
    algorithm: interval_merge
    formula: |
      add_months(t, n):
          advance t by n calendar months; if the resulting day-of-month does not
          exist in the target month, clamp to the last valid day of that month;
          the time-of-day component is preserved exactly.

      option_end_at = add_months(option_start_at, initial_period_months)
                      then, once extension_exercised becomes true,
                      add_months(option_end_at, extension_period_months)

      # The occupied window is HALF-OPEN: [option_start_at, option_end_at).
    input_set: "The option's own option_start_at, initial_period_months, extension_period_months."
    precision: "instant-exact; no truncation to day boundaries"

  - name: turnaround_reversion_maturity
    trigger: "on POST /development-projects/{id}/place-in-turnaround"
    algorithm: threshold
    formula: |
      turnaround_start_at    = current_utc
      turnaround_eligible_at = add_months(turnaround_start_at, TURNAROUND_REVERSION_MONTHS)
      # add_months clamps day-of-month exactly as `option_window_arithmetic` defines.
      # A reversion notice is admissible when current_utc >= turnaround_eligible_at
      # (INCLUSIVE - the instant itself is mature).
    input_set: "The project's turnaround_start_at and the logical clock at the reversion-notice call."
    constants:
      TURNAROUND_REVERSION_MONTHS: 18
    precision: "instant-exact, inclusive lower bound"

  - name: milestone_payment_schedule
    trigger: "on POST /writer-engagements/{id}/attach (PROPOSED -> ATTACHED)"
    algorithm: waterfall_allocation
    formula: |
      template = MILESTONE_TEMPLATES[engagement.engagement_type]   # ordered list of
                                                                   # (milestone_type, percentage_bps)
      # PINNED ROUNDING ORDER: floor EVERY line item first, then push the whole
      # remainder into ONE line. Rounding half-up per line and summing is a
      # DIFFERENT, WRONG answer - it does not reconcile to total_fee_cents.
      for i, (mtype, pct) in enumerate(template):
          gross[i] = floor(engagement.total_fee_cents * pct / 10000)
          sequence_index[i] = i
      remainder = engagement.total_fee_cents - sum(gross)

      # Remainder recipient: the line with the LARGEST percentage_bps.
      # Tie-break when two lines share the largest percentage_bps: the LOWEST
      # sequence_index. created_at is never consulted; id is never consulted.
      winner = argmax over lines of (percentage_bps, -sequence_index)
      gross[winner] += remainder

      due_on[i] = engagement.start_date + MILESTONE_DUE_OFFSET_DAYS[mtype] days
      # Invariant: sum(gross) == engagement.total_fee_cents, exactly, always.
    input_set: "The engagement's engagement_type and total_fee_cents only. No prior milestones on other engagements participate."
    constants:
      MILESTONE_TEMPLATES:
        ORIGINAL_DRAFT: [[COMMENCEMENT, 3000], [FIRST_DRAFT_DELIVERY, 4000], [FIRST_DRAFT_ACCEPTANCE, 3000]]
        REWRITE: [[COMMENCEMENT, 4000], [REWRITE_DELIVERY, 6000]]
        POLISH: [[COMMENCEMENT, 5000], [POLISH_DELIVERY, 5000]]
        PRODUCTION_REWRITE: [[COMMENCEMENT, 3334], [REWRITE_DELIVERY, 3333], [PRODUCTION_BONUS, 3333]]
      MILESTONE_DUE_OFFSET_DAYS:
        COMMENCEMENT: 0
        FIRST_DRAFT_DELIVERY: 84
        FIRST_DRAFT_ACCEPTANCE: 98
        REWRITE_DELIVERY: 56
        POLISH_DELIVERY: 28
        PRODUCTION_BONUS: 120
    precision: "whole cents; floor per line, remainder allocated once"

  - name: writer_commitment_ledger
    trigger: "on POST /writer-engagements/{id}/attach, on .../terminate, on POST /milestone-payments/{id}/pay, and on every cascade that voids milestones"
    algorithm: aggregation
    formula: |
      committed_fee_cents = sum( m.gross_amount_cents
                                 for m in MilestonePayment
                                 if m's engagement.writer_id == writer.id
                                 and m.status IN {'SCHEDULED', 'DUE', 'APPROVED'} )
      paid_fee_cents      = sum( m.gross_amount_cents
                                 for m in MilestonePayment
                                 if m's engagement.writer_id == writer.id
                                 and m.status == 'PAID' )
      active_engagement_count = count( e for e in WriterEngagement
                                       if e.writer_id == writer.id
                                       and e.status IN {'ATTACHED', 'ACTIVE'} )
      # CONSERVED QUANTITY (money): for any engagement E, attach(E) followed by
      # terminate(E) with no intervening payment leaves committed_fee_cents at
      # exactly its pre-attach value, and paid_fee_cents unchanged.
    input_set: "Every MilestonePayment row reachable from this writer's engagements, filtered by status as written. VOIDED rows are in neither sum."
    precision: "whole cents; exact integer arithmetic, no rounding"

  - name: reader_assignment_ledger
    trigger: "on POST /submissions/{id}/assign-reader, on POST /coverage-assignments/{id}/recall, on coverage approval/rejection, and on submission withdrawal"
    algorithm: aggregation
    formula: |
      active_assignment_count = count( a for a in CoverageAssignment
                                       if a.reader_id == reader.id
                                       and a.status IN {'ASSIGNED', 'IN_PROGRESS', 'SUBMITTED'} )
      # CONSERVED QUANTITY (capacity): assign-reader followed by recall of that
      # same assignment leaves active_assignment_count at exactly its pre-assign
      # value, and completed_report_count untouched.
    input_set: "Every CoverageAssignment row for this reader, filtered by status as written. COMPLETED and RECALLED rows are excluded."
    precision: "exact integer count"

  - name: greenlight_weighted_tally
    trigger: "on POST /greenlight-reviews/{id}/votes (running tallies) and on POST /greenlight-reviews/{id}/close (percentages and outcome)"
    algorithm: aggregation
    formula: |
      votes            = CommitteeVote rows with review_id == review.id
      cast_weight_bps  = sum(v.weight_bps_snapshot for v in votes)
      abstain_weight   = sum(v.weight_bps_snapshot for v in votes if v.vote_value == 'ABSTAIN')
      decisive_weight_bps = cast_weight_bps - abstain_weight
      approve_weight_bps  = sum(v.weight_bps_snapshot for v in votes if v.vote_value == 'APPROVE')
      veto_cast = any(v.vote_value == 'VETO' and that member's veto_power was true at vote time)

      quorum_pct   = round_half_up(100 * cast_weight_bps / review.eligible_weight_bps, 2)
      approval_pct = round_half_up(100 * approve_weight_bps / decisive_weight_bps, 2)
                     if decisive_weight_bps > 0 else 0.00

      # Outcome ladder at close - evaluated top to bottom, first match wins.
      # 1. quorum_pct <  GREENLIGHT_QUORUM_PCT  -> reject the close call with
      #                  ERR_QUORUM_NOT_MET; the review STAYS in VOTING.
      # 2. veto_cast == true                    -> DECLINED
      # 3. decisive_weight_bps == 0             -> DEFERRED
      # 4. approval_pct >= GREENLIGHT_APPROVAL_PCT -> PASSED   (INCLUSIVE)
      # 5. otherwise                            -> DECLINED
    input_set: "All CommitteeVote rows on the review, using each vote's weight_bps_snapshot rather than the member's current vote_weight_bps, and the review's frozen eligible_weight_bps."
    constants:
      GREENLIGHT_QUORUM_PCT: 60.00
      GREENLIGHT_APPROVAL_PCT: 66.67
      GREENLIGHT_MIN_ACTIVE_MEMBERS: 3
    precision: "percentages to 2 decimal places, round_half_up; the comparison uses the ROUNDED value"

  - name: project_writer_budget_cap
    trigger: "on POST /development-projects (at create) and on every change to committed_writer_fee_cents"
    algorithm: threshold
    formula: |
      writer_budget_cap_cents = floor(budget_cents * DEV_BUDGET_WRITER_SHARE_BPS / 10000)
      committed_writer_fee_cents = sum( e.total_fee_cents for e in WriterEngagement
                                        if e.project_id == project.id
                                        and e.status IN {'ATTACHED', 'ACTIVE', 'COMPLETED'} )
      # Headroom test used by ERR_BUDGET_EXCEEDED, INCLUSIVE upper bound:
      #   admissible iff committed_writer_fee_cents + candidate.total_fee_cents
      #                  <= writer_budget_cap_cents
      guild_minimum_cents = GUILD_MINIMUM_FEE_CENTS[engagement_type] if writer.guild_member else 0
    input_set: "WriterEngagement rows on this project with status IN {ATTACHED, ACTIVE, COMPLETED}. PROPOSED and TERMINATED engagements do not consume headroom."
    constants:
      DEV_BUDGET_WRITER_SHARE_BPS: 1200
      GUILD_MINIMUM_FEE_CENTS:
        ORIGINAL_DRAFT: 7500000
        REWRITE: 5000000
        POLISH: 2500000
        PRODUCTION_REWRITE: 5000000
    precision: "whole cents; floor on the cap"

  - name: reader_window_overlap
    trigger: "on POST /submissions/{id}/assign-reader, before the CoverageAssignment is created"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with a TRAILING BUFFER on the incumbent.
      # Touching endpoints COLLIDE.
      conflict(existing, candidate) =
             candidate.window_start <= existing.window_due + READER_BUFFER_HOURS hours
         AND existing.window_start  <= candidate.window_due
      # Evaluated against every CoverageAssignment of the same reader whose
      # status IN {ASSIGNED, IN_PROGRESS, SUBMITTED}. COMPLETED and RECALLED
      # assignments never conflict.
    input_set: "CoverageAssignment rows for the resolved reader with status IN {ASSIGNED, IN_PROGRESS, SUBMITTED}."
    constants:
      READER_BUFFER_HOURS: 12
    precision: "instant-exact; both bounds inclusive, buffer added only to the incumbent's trailing edge"

  - name: option_period_overlap
    trigger: "on POST /option-agreements/{id}/execute, before the option becomes ACTIVE"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [start, end). Back-to-back windows do NOT collide:
      # candidate.option_start_at == existing.option_end_at is ADMISSIBLE.
      conflict(existing, candidate) =
             candidate.option_start_at <  existing.option_end_at
         AND existing.option_start_at  <  candidate.option_end_at
      # Evaluated against every OptionAgreement on the same property_id whose
      # status IN {ACTIVE, EXTENDED, EXERCISED}. Capacity on the resource is 1:
      # a single conflicting incumbent is enough to reject.
    input_set: "OptionAgreement rows with the same property_id and status IN {ACTIVE, EXTENDED, EXERCISED}, excluding the candidate itself."
    constants: {}
    precision: "instant-exact; start inclusive, end exclusive"

  - name: writer_concurrency_capacity
    trigger: "on POST /writer-engagements/{id}/attach, before the engagement becomes ATTACHED"
    algorithm: aggregation
    formula: |
      # CLOSED date intervals, AGGREGATE CAPACITY rather than pairwise exclusion.
      overlaps = count( e for e in WriterEngagement
                        if e.writer_id == candidate.writer_id
                        and e.id != candidate.id
                        and e.status IN {'ATTACHED', 'ACTIVE'}
                        and e.start_date <= candidate.end_date
                        and candidate.start_date <= e.end_date )
      # Admissible iff overlaps <= WRITER_MAX_CONCURRENT_ENGAGEMENTS - 1.
      # Two concurrent engagements are fine; the third overlapping attach fails.
    input_set: "WriterEngagement rows for the same writer with status IN {ATTACHED, ACTIVE}. PROPOSED, COMPLETED and TERMINATED rows do not occupy capacity."
    constants:
      WRITER_MAX_CONCURRENT_ENGAGEMENTS: 2
    precision: "date-granular, both bounds inclusive"

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, non-empty, and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 30
    category: existence
    check: "every resource id in the URL path exists, validated left to right"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_RELEASE_FORM_NOT_FOUND | ERR_READER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_OPTION_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_WRITER_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_BOARD_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 35
    category: existence
    check: "every foreign-key id supplied in the request body references an existing row (property_id, option_agreement_id, project_id, writer_id, reader_id, supersedes_document_id)"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_OPTION_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_WRITER_NOT_FOUND | ERR_READER_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /submissions, POST /literary-properties/{id}/rights-documents, POST /option-agreements, POST /development-projects, POST /writer-engagements, POST /submissions/{id}/assign-reader"

  - priority: 40
    category: business_constraint
    check: "every required input field is present and of the declared JSON type; unknown fields are ignored; computed and system fields supplied by the client are ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 45
    category: business_constraint
    check: "every enum-typed input field carries a declared member of that enum"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all write endpoints with enum inputs"

  - priority: 50
    category: business_constraint
    check: "numeric inputs sit inside their declared ranges: craft scores 1..10, weekly_capacity 1..20, vote_weight_bps 1..10000, initial_period_months 1..36, extension_period_months 0..24, option_fee_cents/purchase_price_cents/total_fee_cents/budget_cents >= 1, limit 1..100, offset >= 0"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "all endpoints with numeric inputs"

  - priority: 55
    category: auth
    check: "for entity-backed roles the acting X-User-ID owns the resource: Reader acts only on assignments/reports whose assignment.reader_id equals it; Writer acts only on engagements whose writer_id equals it; CommitteeMember votes only as itself"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /coverage-assignments/{id}/start, PATCH /coverage-reports/{id}, POST /coverage-reports/{id}/submit, POST /writer-engagements/{id}/deliver, POST /greenlight-reviews/{id}/votes"

  - priority: 60
    category: state
    check: "the supplied expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /option-agreements, POST /writer-engagements, POST /greenlight-reviews"

  - priority: 70
    category: state
    check: "the target resource is in a state from which the requested transition is declared in the state machine table"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 71
    category: state
    check: "for creation endpoints the parent is in an admissible state: DevelopmentProject.development_status NOT IN {GREENLIT, TURNAROUND, DEAD} for engagement and greenlight-review creation; Submission.status == RECEIVED for release-form creation; OptionAgreement creation requires the property to have no OptionAgreement in status EXERCISED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /writer-engagements, POST /greenlight-reviews, POST /submissions/{id}/release-forms, POST /option-agreements"

  - priority: 72
    category: state
    check: "the target resource is not already in one of its terminal states"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "POST /submissions/{id}/withdraw, POST /option-agreements/{id}/terminate, POST /writer-engagements/{id}/terminate, POST /greenlight-reviews/{id}/withdraw, POST /coverage-assignments/{id}/recall"

  - priority: 75
    category: business_safety
    check: "segregation of duties: the approving StoryEditor's X-User-ID differs from CoverageAssignment.assigned_by_user_id; the paying BusinessAffairs user differs from MilestonePayment.approved_by_user_id; the voting CommitteeMember's exec_user_id differs from DevelopmentProject.owning_exec_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /coverage-reports/{id}/approve, POST /milestone-payments/{id}/pay, POST /greenlight-reviews/{id}/votes"

  - priority: 80
    category: business_safety
    check: "after lazy expiry has been applied, no ReleaseForm on the submission is in status EXPIRED"
    error_id: ERR_RELEASE_FORM_EXPIRED
    http_status: 409
    applies_to: "POST /submissions/{id}/assign-reader"

  - priority: 82
    category: business_safety
    check: "when submission.release_form_required == true, at least one ReleaseForm on that submission has status IN {EXECUTED, WAIVED}"
    error_id: ERR_RELEASE_FORM_REQUIRED
    http_status: 409
    applies_to: "POST /submissions/{id}/clear-intake, POST /submissions/{id}/assign-reader"

  - priority: 85
    category: business_referential
    check: "the property's rights_chain_status equals CLEAR"
    error_id: ERR_RIGHTS_CHAIN_INCOMPLETE
    http_status: 409
    applies_to: "POST /option-agreements/{id}/execute"

  - priority: 86
    category: business_referential
    check: "the submission's property does not have rights_chain_status == DISPUTED"
    error_id: ERR_PROPERTY_RIGHTS_DISPUTED
    http_status: 409
    applies_to: "POST /submissions/{id}/assign-reader"

  - priority: 90
    category: business_referential
    check: "the project's linked OptionAgreement has status IN {ACTIVE, EXTENDED, EXERCISED}"
    error_id: ERR_OPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /writer-engagements/{id}/attach"

  - priority: 91
    category: business_referential
    check: "the option_agreement_id supplied belongs to the same property_id supplied"
    error_id: ERR_OPTION_MISMATCH
    http_status: 409
    applies_to: "POST /development-projects"

  - priority: 92
    category: business_referential
    check: "the project's rights_status equals OWNED"
    error_id: ERR_RIGHTS_NOT_OWNED
    http_status: 409
    applies_to: "POST /greenlight-reviews/{id}/open-voting"

  - priority: 95
    category: business_temporal
    check: "the candidate option's half-open window [option_start_at, option_end_at) does not intersect any ACTIVE/EXTENDED/EXERCISED option on the same property, per `option_period_overlap`"
    error_id: ERR_OPTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /option-agreements/{id}/execute"

  - priority: 96
    category: business_temporal
    check: "the candidate coverage window does not collide with any open assignment of the resolved reader under `reader_window_overlap` (closed intervals, 12-hour trailing buffer on the incumbent)"
    error_id: ERR_READER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /submissions/{id}/assign-reader"

  - priority: 97
    category: business_temporal
    check: "current_utc is strictly before option_end_at"
    error_id: ERR_OPTION_EXPIRED
    http_status: 409
    applies_to: "POST /option-agreements/{id}/exercise, POST /option-agreements/{id}/extend"

  - priority: 98
    category: business_temporal
    check: "current_utc is at or after project.turnaround_eligible_at"
    error_id: ERR_TURNAROUND_NOT_MATURE
    http_status: 409
    applies_to: "POST /development-projects/{id}/reversion-notice"

  - priority: 99
    category: business_temporal
    check: "the writer holds at most WRITER_MAX_CONCURRENT_ENGAGEMENTS - 1 other ATTACHED/ACTIVE engagements whose closed date window intersects the candidate's, per `writer_concurrency_capacity`"
    error_id: ERR_WRITER_OVERCOMMITTED
    http_status: 409
    applies_to: "POST /writer-engagements/{id}/attach"

  - priority: 100
    category: business_constraint
    check: "when reader_id is omitted, the `reader_selection_policy` candidate set is non-empty"
    error_id: ERR_NO_ELIGIBLE_READER
    http_status: 409
    applies_to: "POST /submissions/{id}/assign-reader"

  - priority: 101
    category: business_constraint
    check: "when reader_id is supplied explicitly, that reader has status == ACTIVE and active_assignment_count < weekly_capacity"
    error_id: ERR_READER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /submissions/{id}/assign-reader"

  - priority: 102
    category: business_constraint
    check: "the coverage standard is met: all five craft scores non-null, recommendation non-null, and synopsis_word_count >= COVERAGE_MIN_SYNOPSIS_WORDS"
    error_id: ERR_COVERAGE_INCOMPLETE
    http_status: 422
    applies_to: "POST /coverage-reports/{id}/submit"

  - priority: 103
    category: business_constraint
    check: "revision_round_count is strictly below COVERAGE_MAX_REVISION_ROUNDS"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /coverage-reports/{id}/request-revision"

  - priority: 104
    category: business_constraint
    check: "no CommitteeVote already exists on this review from the acting member"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /greenlight-reviews/{id}/votes"

  - priority: 105
    category: business_constraint
    check: "at least GREENLIGHT_MIN_ACTIVE_MEMBERS CommitteeMember rows have status == ACTIVE"
    error_id: ERR_COMMITTEE_TOO_SMALL
    http_status: 409
    applies_to: "POST /greenlight-reviews/{id}/open-voting"

  - priority: 106
    category: business_constraint
    check: "quorum_pct is at or above GREENLIGHT_QUORUM_PCT; on failure the review stays in VOTING"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /greenlight-reviews/{id}/close"

  - priority: 107
    category: business_constraint
    check: "every MilestonePayment on the same engagement with a lower sequence_index has status IN {PAID, VOIDED}"
    error_id: ERR_MILESTONE_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /milestone-payments/{id}/approve"

  - priority: 110
    category: business_fiscal
    check: "project.committed_writer_fee_cents + candidate.total_fee_cents <= project.writer_budget_cap_cents (inclusive upper bound)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /writer-engagements, POST /writer-engagements/{id}/attach"

  - priority: 112
    category: business_fiscal
    check: "when the writer is a guild member, total_fee_cents >= GUILD_MINIMUM_FEE_CENTS[engagement_type]"
    error_id: ERR_GUILD_MINIMUM_VIOLATION
    http_status: 422
    applies_to: "POST /writer-engagements"

domain_constants:
  COVERAGE_MIN_SYNOPSIS_WORDS: 250
  COVERAGE_MAX_REVISION_ROUNDS: 2
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
  TIER_RANK_ORDER: ["NONE", "WATCH", "HOT", "PRIORITY"]

endpoints:
  # ---- Literary properties & chain of title -------------------------------
  - method: POST
    path: "/literary-properties"
    description: "Register underlying material. rights_chain_status starts UNVERIFIED, tracking_tier NONE, encumbrance_count 0."
    roles: [StoryEditor, SlateAdmin]
    code: 201
    input: [title, material_type, source_author_name, genre, "logline?"]
    output: LiteraryProperty
    side_effects: ["sets rights_chain_status=UNVERIFIED, verified_document_count=0, tracking_tier=NONE, encumbrance_count=0"]
  - method: GET
    path: "/literary-properties/{id}"
    description: "Read one property, including its derived rights_chain_status, tracking_tier and version."
    roles: [SlateAdmin, StoryEditor, BusinessAffairs, DevelopmentExec, Reader, CommitteeMember]
    code: 200
    input: []
    output: LiteraryProperty
    side_effects: []
  - method: GET
    path: "/literary-properties"
    description: "List properties with filters and pagination."
    roles: [SlateAdmin, StoryEditor, BusinessAffairs, DevelopmentExec, Reader, CommitteeMember]
    code: 200
    input: ["tracking_tier?", "rights_chain_status?", "genre?", "limit?", "offset?"]
    output: LiteraryProperty[]
    side_effects: []
  - method: POST
    path: "/literary-properties/{id}/rights-documents"
    description: "File a chain-of-title document. Re-derives the property's rights_chain_status and verified_document_count."
    roles: [BusinessAffairs]
    code: 201
    input: [doc_type, executed_on, verified, "supersedes_document_id?", "notes?"]
    output: RightsChainDocument
    side_effects:
      - "marks the superseded document's superseded=true when supersedes_document_id is given"
      - "recomputes LiteraryProperty.rights_chain_status and verified_document_count via `rights_chain_status_derivation`"
      - "increments LiteraryProperty.version by 1"
  - method: GET
    path: "/literary-properties/{id}/rights-documents"
    description: "List the chain-of-title documents filed against one property."
    roles: [SlateAdmin, StoryEditor, BusinessAffairs, DevelopmentExec]
    code: 200
    input: ["doc_type?", "limit?", "offset?"]
    output: RightsChainDocument[]
    side_effects: []
  - method: GET
    path: "/rights-chain-documents/{id}"
    description: "Read one chain-of-title document."
    roles: [SlateAdmin, StoryEditor, BusinessAffairs]
    code: 200
    input: []
    output: RightsChainDocument
    side_effects: []
  - method: GET
    path: "/rights-chain-documents"
    description: "List chain-of-title documents across properties; supersedes_document_id resolves the self-referential edge."
    roles: [SlateAdmin, StoryEditor, BusinessAffairs]
    code: 200
    input: ["property_id?", "supersedes_document_id?", "doc_type?", "limit?", "offset?"]
    output: RightsChainDocument[]
    side_effects: []

  # ---- Submission intake & release forms ----------------------------------
  - method: POST
    path: "/submissions"
    description: "Log an incoming submission. release_form_required and coverage_due_at are computed here and frozen."
    roles: [Submitter, StoryEditor]
    code: 201
    input: [property_id, submitting_agency, submitter_contact_email, submitted_via, "priority_flag?"]
    output: Submission
    side_effects:
      - "received_at := current_utc"
      - "release_form_required := `release_form_requirement`"
      - "coverage_due_at := `coverage_turnaround_due`"
      - "status := RECEIVED, decision := PENDING"
  - method: GET
    path: "/submissions/{id}"
    description: "Read one submission."
    roles: [SlateAdmin, StoryEditor, BusinessAffairs, DevelopmentExec, Reader, Submitter]
    code: 200
    input: []
    output: Submission
    side_effects: []
  - method: GET
    path: "/submissions"
    description: "List submissions with filters and pagination."
    roles: [SlateAdmin, StoryEditor, BusinessAffairs, DevelopmentExec, Reader]
    code: 200
    input: ["property_id?", "status?", "submitted_via?", "limit?", "offset?"]
    output: Submission[]
    side_effects: []
  - method: POST
    path: "/submissions/{id}/release-forms"
    description: "Open the release-form requirement on a submission that needs one."
    roles: [StoryEditor]
    code: 201
    input: [expires_at]
    output: ReleaseForm
    side_effects: ["Submission.status := RELEASE_PENDING", "increments Submission.version by 1"]
  - method: GET
    path: "/submissions/{id}/release-forms"
    description: "List the release forms opened on one submission."
    roles: [SlateAdmin, StoryEditor, Submitter]
    code: 200
    input: ["limit?", "offset?"]
    output: ReleaseForm[]
    side_effects: []
  - method: GET
    path: "/release-forms/{id}"
    description: "Read one release form."
    roles: [SlateAdmin, StoryEditor, Submitter]
    code: 200
    input: []
    output: ReleaseForm
    side_effects: []
  - method: POST
    path: "/release-forms/{id}/send"
    description: "Send the release form to the submitting party."
    roles: [StoryEditor]
    code: 200
    input: []
    output: ReleaseForm
    side_effects: ["status := SENT"]
  - method: POST
    path: "/release-forms/{id}/execute"
    description: "Submitting party executes the release; clears intake on the parent submission."
    roles: [Submitter]
    code: 200
    input: [signer_name]
    output: ReleaseForm
    side_effects: ["status := EXECUTED, signed_at := current_utc", "Submission.status := INTAKE_CLEARED"]
  - method: POST
    path: "/release-forms/{id}/waive"
    description: "Legal waives the release requirement; clears intake on the parent submission."
    roles: [StoryEditor]
    code: 200
    input: [waiver_reason]
    output: ReleaseForm
    side_effects: ["status := WAIVED", "Submission.status := INTAKE_CLEARED"]
  - method: POST
    path: "/submissions/{id}/clear-intake"
    description: "Clear intake for a submission still in RECEIVED. Refused with ERR_RELEASE_FORM_REQUIRED when the submission requires a release form and none is EXECUTED or WAIVED."
    roles: [StoryEditor]
    code: 200
    input: []
    output: Submission
    side_effects: ["status := INTAKE_CLEARED"]
  - method: POST
    path: "/submissions/{id}/withdraw"
    description: "Withdraw a submission; recalls any open assignment and rejects its non-approved report."
    roles: [Submitter, StoryEditor]
    code: 200
    input: [reason]
    output: Submission
    side_effects:
      - "status := WITHDRAWN, withdrawal_reason := reason"
      - "open CoverageAssignment := RECALLED and Reader.active_assignment_count -= 1"
      - "its CoverageReport, if not APPROVED, := REJECTED"
      - "REQUIRED/SENT release forms := EXPIRED"

  # ---- Readers, assignments, coverage reports -----------------------------
  - method: POST
    path: "/readers"
    description: "Create a story analyst."
    roles: [SlateAdmin]
    code: 201
    input: [display_name, specialty_genre, weekly_capacity, employment_type, "status?"]
    output: Reader
    side_effects: ["active_assignment_count=0, completed_report_count=0, calibration_bias=0.00"]
  - method: GET
    path: "/readers/{id}"
    description: "Read one reader, including active_assignment_count, completed_report_count and calibration_bias."
    roles: [SlateAdmin, StoryEditor, Reader]
    code: 200
    input: []
    output: Reader
    side_effects: []
  - method: GET
    path: "/readers"
    description: "List readers with filters and pagination."
    roles: [SlateAdmin, StoryEditor]
    code: 200
    input: ["status?", "specialty_genre?", "employment_type?", "limit?", "offset?"]
    output: Reader[]
    side_effects: []
  - method: PATCH
    path: "/readers/{id}"
    description: "Adjust a reader's availability or weekly capacity."
    roles: [SlateAdmin]
    code: 200
    input: ["status?", "weekly_capacity?"]
    output: Reader
    side_effects: ["increments Reader.version by 1"]
  - method: POST
    path: "/submissions/{id}/assign-reader"
    description: "Assign coverage. Omit reader_id to invoke `reader_selection_policy`. Applies release-form lazy expiry first, then the window-overlap check. Creates the assignment plus its DRAFT coverage report."
    roles: [StoryEditor]
    code: 201
    input: ["reader_id?", "window_start?", "window_due?", "excluded_reader_ids?"]
    output: CoverageAssignment
    side_effects:
      - "lazy expiry of stale ReleaseForm rows on this submission"
      - "creates CoverageAssignment (status ASSIGNED, assigned_by_user_id := X-User-ID, auto_selected set)"
      - "creates the assignment's CoverageReport in DRAFT"
      - "Reader.active_assignment_count += 1"
      - "Submission.status := READER_ASSIGNED"
  - method: GET
    path: "/coverage-assignments/{id}"
    description: "Read one coverage assignment."
    roles: [SlateAdmin, StoryEditor, Reader, DevelopmentExec]
    code: 200
    input: []
    output: CoverageAssignment
    side_effects: []
  - method: GET
    path: "/coverage-assignments"
    description: "List coverage assignments filtered by submission, reader or status."
    roles: [SlateAdmin, StoryEditor, Reader, DevelopmentExec]
    code: 200
    input: ["submission_id?", "reader_id?", "status?", "limit?", "offset?"]
    output: CoverageAssignment[]
    side_effects: []
  - method: POST
    path: "/coverage-assignments/{id}/start"
    description: "Reader marks the assignment in progress."
    roles: [Reader]
    code: 200
    input: []
    output: CoverageAssignment
    side_effects: ["status := IN_PROGRESS"]
  - method: POST
    path: "/coverage-assignments/{id}/recall"
    description: "Story editor pulls the assignment back; compensating action for assign-reader."
    roles: [StoryEditor]
    code: 200
    input: [reason]
    output: CoverageAssignment
    side_effects:
      - "status := RECALLED, recall_reason := reason"
      - "Reader.active_assignment_count -= 1"
      - "CoverageReport := REJECTED"
      - "Submission.status := INTAKE_CLEARED"
  - method: GET
    path: "/coverage-reports/{id}"
    description: "Read one coverage report including composite_score and normalized_score."
    roles: [SlateAdmin, StoryEditor, Reader, DevelopmentExec]
    code: 200
    input: []
    output: CoverageReport
    side_effects: []
  - method: GET
    path: "/coverage-reports"
    description: "List coverage reports; assignment_id resolves the report auto-created by assign-reader."
    roles: [SlateAdmin, StoryEditor, Reader, DevelopmentExec]
    code: 200
    input: ["assignment_id?", "status?", "recommendation?", "limit?", "offset?"]
    output: CoverageReport[]
    side_effects: []
  - method: PATCH
    path: "/coverage-reports/{id}"
    description: "Reader fills in the coverage report body. Scores are only stored here, never computed."
    roles: [Reader]
    code: 200
    input: ["logline_score?", "structure_score?", "character_score?", "dialogue_score?", "marketability_score?", "recommendation?", "synopsis_word_count?", "comparable_titles?"]
    output: CoverageReport
    side_effects: ["increments CoverageReport.version by 1"]
  - method: POST
    path: "/coverage-reports/{id}/submit"
    description: "Reader submits coverage. Computes composite_score and normalized_score."
    roles: [Reader]
    code: 200
    input: []
    output: CoverageReport
    side_effects:
      - "composite_score and normalized_score := `coverage_score_pair`"
      - "CoverageAssignment.status := SUBMITTED"
      - "Submission.status := COVERAGE_IN_REVIEW"
  - method: POST
    path: "/coverage-reports/{id}/request-revision"
    description: "Story editor returns the report for revision; drives the SUBMITTED -> REVISION_REQUESTED -> SUBMITTED cycle."
    roles: [StoryEditor]
    code: 200
    input: [revision_note]
    output: CoverageReport
    side_effects:
      - "status := REVISION_REQUESTED, revision_round_count += 1"
      - "CoverageAssignment.status := IN_PROGRESS"
      - "Submission.status := READER_ASSIGNED"
  - method: POST
    path: "/coverage-reports/{id}/approve"
    description: "Story editor approves coverage. Segregation of duties: the approver must not be the editor who made the assignment. Drives the five-link approval cascade."
    roles: [StoryEditor]
    code: 200
    input: []
    output: CoverageReport
    side_effects:
      - "status := APPROVED, approved_by_user_id := X-User-ID"
      - "CoverageAssignment.status := COMPLETED; Reader counters and calibration_bias recomputed"
      - "Submission.status := TRACKED or PASSED; Submission.decision := recommendation"
      - "TrackingBoardEntry created with heat_score/board_tier when TRACKED"
      - "LiteraryProperty.tracking_tier raised when the new tier ranks strictly higher"
  - method: POST
    path: "/coverage-reports/{id}/reject"
    description: "Story editor rejects coverage after the revision allowance is exhausted."
    roles: [StoryEditor]
    code: 200
    input: [reason]
    output: CoverageReport
    side_effects:
      - "status := REJECTED, rejection_reason := reason"
      - "CoverageAssignment.status := RECALLED; Reader.active_assignment_count -= 1"
      - "Submission.status := INTAKE_CLEARED"

  # ---- Tracking board ------------------------------------------------------
  - method: GET
    path: "/tracking-board-entries/{id}"
    description: "Read one tracking board entry."
    roles: [SlateAdmin, StoryEditor, DevelopmentExec, BusinessAffairs, CommitteeMember]
    code: 200
    input: []
    output: TrackingBoardEntry
    side_effects: []
  - method: GET
    path: "/tracking-board-entries"
    description: "The tracking board. Filter by property, source report, tier or LIVE/ARCHIVED status."
    roles: [SlateAdmin, StoryEditor, DevelopmentExec, BusinessAffairs, CommitteeMember]
    code: 200
    input: ["property_id?", "report_id?", "board_tier?", "status?", "limit?", "offset?"]
    output: TrackingBoardEntry[]
    side_effects: []

  # ---- Option agreements ---------------------------------------------------
  - method: POST
    path: "/option-agreements"
    description: "Draft an option. Creating a draft supersedes every other DRAFTED option on the property, so the caller must supply the property version it last observed."
    roles: [BusinessAffairs]
    code: 201
    input: [property_id, expected_property_version, option_fee_cents, purchase_price_cents, initial_period_months, option_start_at, "extension_period_months?", "extension_fee_cents?", "applicable_to_purchase?"]
    output: OptionAgreement
    side_effects:
      - "status := DRAFTED"
      - "other DRAFTED options on the property := TERMINATED with termination_reason SUPERSEDED_BY_NEW_DRAFT"
      - "increments LiteraryProperty.version by 1"
  - method: GET
    path: "/option-agreements/{id}"
    description: "Read one option agreement including the four computed pricing fields."
    roles: [SlateAdmin, BusinessAffairs, DevelopmentExec, StoryEditor]
    code: 200
    input: []
    output: OptionAgreement
    side_effects: []
  - method: GET
    path: "/option-agreements"
    description: "List option agreements filtered by property or status."
    roles: [SlateAdmin, BusinessAffairs, DevelopmentExec, StoryEditor]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: OptionAgreement[]
    side_effects: []
  - method: POST
    path: "/option-agreements/{id}/execute"
    description: "Execute the option. Requires a CLEAR chain of title and a non-overlapping half-open window on the property."
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: OptionAgreement
    side_effects:
      - "status := ACTIVE; option_end_at := `option_window_arithmetic`"
      - "escalation_bps / adjusted_purchase_price_cents / applicable_credit_cents / net_purchase_due_cents := `option_net_purchase_due`"
      - "LiteraryProperty.encumbrance_count += 1"
  - method: POST
    path: "/option-agreements/{id}/extend"
    description: "Exercise the single permitted extension before the option window closes."
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: OptionAgreement
    side_effects:
      - "status := EXTENDED; extension_exercised := true; option_end_at extended"
      - "net_purchase_due_cents recomputed with the extension fee now paid"
  - method: POST
    path: "/option-agreements/{id}/exercise"
    description: "Exercise the option to purchase; flips the linked project's rights axis to OWNED."
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: OptionAgreement
    side_effects:
      - "status := EXERCISED; exercise_notice_at := current_utc"
      - "net_purchase_due_cents recomputed"
      - "DevelopmentProject.rights_status := OWNED"
  - method: POST
    path: "/option-agreements/{id}/lapse"
    description: "Record that the option window closed unexercised. Fires the five-link lapse cascade down to writer ledgers."
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: OptionAgreement
    side_effects:
      - "status := LAPSED; LiteraryProperty.encumbrance_count -= 1"
      - "DevelopmentProject.rights_status := LAPSED_RIGHTS then development_status := DEAD"
      - "open WriterEngagement rows := TERMINATED"
      - "their SCHEDULED/DUE/APPROVED MilestonePayment rows := VOIDED"
      - "Writer.committed_fee_cents and Writer.active_engagement_count reduced accordingly"
  - method: POST
    path: "/option-agreements/{id}/terminate"
    description: "Tear up an option that was never executed."
    roles: [BusinessAffairs]
    code: 200
    input: [reason]
    output: OptionAgreement
    side_effects: ["status := TERMINATED, termination_reason := reason"]

  # ---- Development projects ------------------------------------------------
  - method: POST
    path: "/development-projects"
    description: "Set up a slate project against an option on the same property. The option may still be DRAFTED - a writer simply cannot be attached until it is executed. Linking the budget re-bands the option's escalation and therefore its net purchase price."
    roles: [DevelopmentExec]
    code: 201
    input: [property_id, option_agreement_id, budget_cents, slate_year]
    output: DevelopmentProject
    side_effects:
      - "rights_status := OPTIONED, development_status := SETUP, owning_exec_user_id := X-User-ID"
      - "writer_budget_cap_cents := `project_writer_budget_cap`"
      - "the linked option's escalation_bps / adjusted_purchase_price_cents / net_purchase_due_cents recomputed"
      - "Submission rows on the same property with status TRACKED := IN_DEVELOPMENT"
  - method: GET
    path: "/development-projects/{id}"
    description: "Read one project, including both state axes and the current version."
    roles: [SlateAdmin, DevelopmentExec, BusinessAffairs, StoryEditor, CommitteeMember]
    code: 200
    input: []
    output: DevelopmentProject
    side_effects: []
  - method: GET
    path: "/development-projects"
    description: "List projects filtered by property, option, either state axis, or slate year."
    roles: [SlateAdmin, DevelopmentExec, BusinessAffairs, StoryEditor, CommitteeMember]
    code: 200
    input: ["property_id?", "option_agreement_id?", "development_status?", "rights_status?", "slate_year?", "limit?", "offset?"]
    output: DevelopmentProject[]
    side_effects: []
  - method: POST
    path: "/development-projects/{id}/place-in-turnaround"
    description: "Place the project in turnaround; starts the reversion clock and terminates open engagements."
    roles: [DevelopmentExec]
    code: 200
    input: [reason]
    output: DevelopmentProject
    side_effects:
      - "development_status := TURNAROUND, turnaround_start_at := current_utc, turnaround_eligible_at := +18 months"
      - "open WriterEngagement rows := TERMINATED; their unpaid milestones := VOIDED; writer ledgers reduced"
      - "OPEN/VOTING GreenlightReview rows := WITHDRAWN"
  - method: POST
    path: "/development-projects/{id}/reversion-notice"
    description: "Serve the turnaround reversion notice once the 18-month clock has matured (inclusive)."
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: DevelopmentProject
    side_effects:
      - "OptionAgreement.status := REVERTED; rights_status := REVERTED; development_status := DEAD"
      - "LiteraryProperty.encumbrance_count -= 1; rights_chain_status := PARTIAL when it was CLEAR"

  # ---- Writers, engagements, milestones ------------------------------------
  - method: POST
    path: "/writers"
    description: "Register a writer."
    roles: [SlateAdmin]
    code: 201
    input: [name, guild_member, quote_cents, "status?"]
    output: Writer
    side_effects: ["committed_fee_cents=0, paid_fee_cents=0, active_engagement_count=0"]
  - method: GET
    path: "/writers/{id}"
    description: "Read one writer, including the committed/paid fee ledger."
    roles: [SlateAdmin, DevelopmentExec, BusinessAffairs, Writer]
    code: 200
    input: []
    output: Writer
    side_effects: []
  - method: GET
    path: "/writers"
    description: "List writers."
    roles: [SlateAdmin, DevelopmentExec, BusinessAffairs]
    code: 200
    input: ["status?", "guild_member?", "limit?", "offset?"]
    output: Writer[]
    side_effects: []
  - method: POST
    path: "/writer-engagements"
    description: "Propose a writer engagement. Supersedes any other PROPOSED engagement of the same type on the project, so the caller must supply the project version it last observed."
    roles: [DevelopmentExec]
    code: 201
    input: [project_id, writer_id, engagement_type, total_fee_cents, start_date, end_date, expected_project_version]
    output: WriterEngagement
    side_effects:
      - "status := PROPOSED; guild_minimum_cents computed"
      - "other PROPOSED engagements of the same engagement_type on the project := TERMINATED with termination_reason SUPERSEDED_BY_NEW_PROPOSAL"
      - "increments DevelopmentProject.version by 1"
  - method: GET
    path: "/writer-engagements/{id}"
    description: "Read one engagement."
    roles: [SlateAdmin, DevelopmentExec, BusinessAffairs, Writer]
    code: 200
    input: []
    output: WriterEngagement
    side_effects: []
  - method: GET
    path: "/writer-engagements"
    description: "List engagements filtered by project, writer or status."
    roles: [SlateAdmin, DevelopmentExec, BusinessAffairs, Writer]
    code: 200
    input: ["project_id?", "writer_id?", "status?", "engagement_type?", "limit?", "offset?"]
    output: WriterEngagement[]
    side_effects: []
  - method: POST
    path: "/writer-engagements/{id}/attach"
    description: "Attach the writer. Generates the milestone payment schedule and moves the project's development axis."
    roles: [DevelopmentExec]
    code: 200
    input: []
    output: WriterEngagement
    side_effects:
      - "status := ATTACHED; MilestonePayment rows generated by `milestone_payment_schedule`; milestone_count set"
      - "the sequence_index 0 milestone := DUE"
      - "Writer.committed_fee_cents += total_fee_cents; Writer.active_engagement_count += 1"
      - "DevelopmentProject.committed_writer_fee_cents += total_fee_cents; development_status advanced"
  - method: POST
    path: "/writer-engagements/{id}/deliver"
    description: "Writer delivers a draft or polish; flips the matching milestone to DUE and advances the project's development axis."
    roles: [Writer]
    code: 200
    input: [milestone_type]
    output: WriterEngagement
    side_effects:
      - "the matching SCHEDULED MilestonePayment := DUE"
      - "DevelopmentProject.development_status := DRAFT_DELIVERED or POLISH_DELIVERED"
  - method: POST
    path: "/writer-engagements/{id}/complete"
    description: "Close out an engagement whose milestones are all settled."
    roles: [DevelopmentExec]
    code: 200
    input: []
    output: WriterEngagement
    side_effects: ["status := COMPLETED; Writer.active_engagement_count -= 1"]
  - method: POST
    path: "/writer-engagements/{id}/terminate"
    description: "Terminate an engagement; compensating action for attach. Voids unpaid milestones and unwinds the writer's committed ledger."
    roles: [DevelopmentExec]
    code: 200
    input: [reason]
    output: WriterEngagement
    side_effects:
      - "status := TERMINATED, termination_reason := reason"
      - "SCHEDULED/DUE/APPROVED MilestonePayment rows := VOIDED"
      - "Writer.committed_fee_cents reduced by the voided sum; Writer.active_engagement_count -= 1"
      - "DevelopmentProject.committed_writer_fee_cents -= total_fee_cents"
  - method: GET
    path: "/milestone-payments/{id}"
    description: "Read one milestone payment."
    roles: [SlateAdmin, DevelopmentExec, BusinessAffairs, Writer]
    code: 200
    input: []
    output: MilestonePayment
    side_effects: []
  - method: GET
    path: "/milestone-payments"
    description: "List milestone payments filtered by engagement, type or status; ordered by sequence_index ascending."
    roles: [SlateAdmin, DevelopmentExec, BusinessAffairs, Writer]
    code: 200
    input: ["engagement_id?", "milestone_type?", "status?", "limit?", "offset?"]
    output: MilestonePayment[]
    side_effects: []
  - method: POST
    path: "/milestone-payments/{id}/approve"
    description: "Business affairs approves a due milestone. Lower sequence_index milestones must be settled first."
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: MilestonePayment
    side_effects: ["status := APPROVED, approved_by_user_id := X-User-ID"]
  - method: POST
    path: "/milestone-payments/{id}/pay"
    description: "Business affairs pays an approved milestone. Segregation of duties: the payer must not be the approver."
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: MilestonePayment
    side_effects:
      - "status := PAID, paid_at := current_utc"
      - "Writer.committed_fee_cents -= gross_amount_cents; Writer.paid_fee_cents += gross_amount_cents"
      - "when sequence_index == 0, WriterEngagement.status := ACTIVE"

