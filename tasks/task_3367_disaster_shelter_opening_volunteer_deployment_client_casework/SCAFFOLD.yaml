    roles: [NationalHQAdmin, RegionalCoordinator, ShelterManager]
    code: 200
    input: ["reunification_verified_by_user_id?"]
    output: ShelterRegistration
    side_effects: ["occupied_until_at stamped from the logical clock", "status=REUNIFIED when reunification_status is VERIFIED else CHECKED_OUT", "shelter_occupancy_counts recomputed", "ShelterOperation.posture re-evaluated (RESTRICTED -> OPEN when staffing_sufficiency >= 0.60 and beds are free)", "increments ShelterRegistration.version by 1"]
  - method: POST
    path: "/api/v1/shelter-operations/{id}/feeding-services"
