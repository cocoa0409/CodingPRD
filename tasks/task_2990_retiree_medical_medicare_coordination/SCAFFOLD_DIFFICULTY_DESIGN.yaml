      - name: plan_year_close_denies_open_elections_depth_three
        grounds:
          - state_machines.PlanYear.OPEN_to_CLOSED
          - state_machines.PlanOption.ACTIVE_to_CLOSED_TO_NEW
          - state_machines.ElectionEvent.SUBMITTED_to_DENIED
          - entities.ElectionEvent.fields.denial_reason_code
          - validations[priority=17]
        distinguishing_aspect: |
          One POST /retiree-benefits/plan-years/{id}/status propagates exactly
          three hops in a strict chain - PlanYear OPEN -> CLOSED, then every
          ACTIVE PlanOption of that year -> CLOSED_TO_NEW, then every
          SUBMITTED or UNDER_REVIEW ElectionEvent requesting one of those
          options -> DENIED with denial_reason_code PLAN_CLOSED - and the third
          hop is caused by the second, so an election on a DRAFT option of the
