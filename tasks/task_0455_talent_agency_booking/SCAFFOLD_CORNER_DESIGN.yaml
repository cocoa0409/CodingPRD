          - state_machines.Booking.PENDING_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already-CANCELLED (PENDING-origin) booking a second time returns ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["PENDING booking cancelled once."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
