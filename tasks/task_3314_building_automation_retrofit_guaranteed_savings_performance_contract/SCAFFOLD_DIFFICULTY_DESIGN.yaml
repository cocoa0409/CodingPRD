- rule_id: non_linear_state_machine
  instances:
  - name: savings_report_dispute_cycle_returns_to_attested
    grounds:
    - state_machines.SavingsReport
    - state_machines.DisputeNotice
    distinguishing_aspect: 'SavingsReport has a CYCLE: SUBMITTED → ATTESTED → DISPUTED → ATTESTED

      (on dispute resolution), with verified_savings_cents overwritten by

      dispute.resolution_savings_cents on the loop-back — a cyclic machine

      on SavingsReport.

