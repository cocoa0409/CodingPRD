        as_user_id: ${mem_id}
        captures:
          fld_id: $.data.id
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: W
          folder_id: ${fld_id}
          trigger_type: POLLING
          poll_interval_seconds: 900
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_id: $.data.id
      - call: POST /zapier/workflows/${wf_id}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
        captures:
          act1: $.data.id
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
      trigger:
      - call: POST /zapier/_simulate/action-charge
        payload:
          account_id: ${acct_id}
          action_id: ${act1}
          attempt_no: 1
          service_latency_ms: 10
          expected_account_version: ${acct_v}
        as: PlatformAdmin
        captures:
          err_id: $.data.error_id
      assert:
      - the charge returns error_id ERR_STALE_ACCOUNT_VERSION
      - 'TeamAccount.${acct_id}.tasks_used_current == 0   # no task consumed by the rejected charge'
