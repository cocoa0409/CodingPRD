          assert:
            - "Response status 409 and data.error_id == ERR_ADDRESS_HOLD_OVERLAP (clock 2027-01-01T12:00Z is inside [created_at, activates_at) of 0xDUP)"

      - name: staking_closed_cooldown_overlap
        grounds:
          - validations[priority=7.6]
          - entities.StakingPosition.fields.unbond_started_at
          - entities.StakingPosition.fields.unbond_available_at
          - state_machines.StakingPosition.ACTIVE_to_UNBONDING
          - errors[ERR_STAKE_COOLDOWN_OVERLAP]
        distinguishing_aspect: |
          CLOSED [unbond_started_at, unbond_available_at] with INCLUSIVE endpoints: a new stake on
          (account, ETH) while an existing UNBONDING ETH position's closed cooldown interval
          contains current_clock is rejected; the inclusive right endpoint differs from the
          half-open address rule. Resource: StakingPosition (different entity).
        test_recipe:
          setup:
            - "ETH spot 2000; account TIER_1 holds 200 ETH; one ETH StakingPosition staked then UNBONDING (cooldown 2027-02-01..2027-02-08)"
          setup_api_calls:
