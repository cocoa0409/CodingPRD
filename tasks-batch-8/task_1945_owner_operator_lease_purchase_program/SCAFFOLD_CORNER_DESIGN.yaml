            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "GET /lease-program/lease-agreements/${lease}", payload: {}, as: LeaseAdmin, captures: { lv: "$.data.version" } }
            - { call: "POST /lease-program/buyout-quotes", payload: { lease_id: "${lease}", quote_kind: "EARLY", expected_lease_version: "${lv}" }, as: LeaseAdmin, captures: { q1: "$.data.id" } }
          trigger:
            - { call: "POST /lease-program/buyout-quotes", payload: { lease_id: "${lease}", quote_kind: "EARLY", expected_lease_version: "${lv}" }, as: LeaseAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_STALE_VERSION (http 412): expected_lease_version == observed-before-first-create, but the first create bumped the version"
            - "exactly one GENERATED quote exists for the lease (GET /buyout-quotes?lease_id -> 1 item, id == ${q1})"

      - name: buyout_create_fresh_version_supersedes_prior
        claim_type: side_effect_execution
        grounds: ["concurrency_rules[buyout-quote-create-stale-lease]", "state_machines.BuyoutQuote.GENERATED_to_SUPERSEDED"]
        distinguishing_aspect: "A fresh OCC version succeeds and supersedes: the prior GENERATED quote flips to SUPERSEDED, the new quote is GENERATED, and each creation increments the lease version by exactly 1."
        test_recipe:
          setup: ["ACTIVE lease; one EARLY quote created; client re-reads the lease to obtain the fresh version"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-XL2" }, as: LeaseAdmin, captures: { op: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: "$.data.id" } }
