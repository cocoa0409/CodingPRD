              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 12, size_on_hand: [{ size_code: "S", units: 3 }, { size_code: "M", units: 4 }, { size_code: "L", units: 3 }, { size_code: "XL", units: 2 }], min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
