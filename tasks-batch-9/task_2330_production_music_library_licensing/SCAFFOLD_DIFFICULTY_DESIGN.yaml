              payload: { composition_id: "${comp1}", licensee_id: "${lee1}", tier_id: "${tierBtv}", media_type: "BROADCAST_TV", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 24, exclusive_requested: true, rush_requested: false }
