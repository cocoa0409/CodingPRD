  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lot_administered_count_conserved_across_recall_and_reverse
        grounds:
          - calculations.lot_inventory_balance
          - state_machines.Immunization.RECORDED_to_INVALIDATED
          - state_machines.Immunization.INVALIDATED_to_RECORDED
          - entities.VaccineLot.fields.administered_count
        distinguishing_aspect: >
          Conserved quantity = VaccineLot.administered_count (== count of RECORDED/AMENDED
          doses on the lot). Recall decrements it, recall-reverse increments it back; after
          forward+compensating actions the lot returns to its pre-recall administered_count of 1.
        test_recipe:
          setup:
            - "Clock 2026-06-01. C1 product; lot with one recorded dose (administered_count 1); recall issued then reversed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "C1", antigen: "C1", doses_in_series: 1, min_age_days: 0, recommended_age_days: 0, min_interval_days: 0, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { prod_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic P", vfc_pin: "PIN-P", authorized_product_codes: ["C1"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod_id}", lot_number: "LP", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child G", date_of_birth: "2024-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-01-01" }
              as: ImmunizationRegistrar
            - call: "POST /lots/${lot_id}/recalls"
              payload: { reason: "precaution" }
              as: ImmunizationRegistrar
              captures: { recall_id: $.data.id }
          trigger:
            - call: "POST /lots/${lot_id}/recalls/${recall_id}/reverse"
              payload: {}
              as: ImmunizationRegistrar
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: ImmunizationRegistrar
              captures: { ac: $.data.administered_count }
          assert:
            - "VaccineLot.${lot_id}.administered_count == 1"
            - "VaccineLot.${lot_id}.status == AVAILABLE"

      - name: valid_dose_count_conserved_across_amend_and_delete
        grounds:
          - calculations.compute_dose_validity
          - state_machines.Immunization.RECORDED_to_DELETED
          - state_machines.Immunization.RECORDED_to_AMENDED
          - entities.Immunization.fields.dose_number
        distinguishing_aspect: >
          Different conserved quantity = the patient's per-antigen valid-dose count (the
          dose_number sequence). After amending dose2's date and deleting it, dose1 remains
          the only VALID dose with dose_number 1 — the count returns to 1 with no gaps.
        test_recipe:
          setup:
            - "Clock 2026-06-01. DTAP product. Patient with two valid doses (2025-02-08, 2025-03-08); dose2 amended then deleted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ImmunizationRegistrar
            - call: "POST /products"
              payload: { product_code: "DTAP", antigen: "DTAP", doses_in_series: 5, min_age_days: 42, recommended_age_days: 60, min_interval_days: 28, grace_period_days: 4 }
              as: ImmunizationRegistrar
              captures: { dtap_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "Clinic Q", vfc_pin: "PIN-Q", authorized_product_codes: ["DTAP"] }
              as: ImmunizationRegistrar
              captures: { prov_id: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${dtap_id}", lot_number: "LQ", received_date: "2024-01-01", expiration_date: "2027-01-01", doses_total: 50 }
              as: ImmunizationRegistrar
              captures: { lot_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Child H", date_of_birth: "2025-01-01", state_code: "CA" }
              as: ImmunizationRegistrar
              captures: { pat_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-02-08" }
              as: ImmunizationRegistrar
              captures: { dose1_id: $.data.id }
            - call: "POST /immunizations"
              payload: { patient_id: "${pat_id}", lot_id: "${lot_id}", provider_id: "${prov_id}", administered_date: "2025-03-08" }
              as: ImmunizationRegistrar
              captures: { dose2_id: $.data.id }
            - call: "PATCH /immunizations/${dose2_id}"
              payload: { administered_date: "2025-03-15" }
              as: RecordsClerk
          trigger:
            - call: "DELETE /immunizations/${dose2_id}"
              payload: {}
              as: ImmunizationRegistrar
          assert:
            - "Immunization.${dose1_id}.dose_number == 1"
            - "Immunization.${dose1_id}.validity == VALID"
            - "Immunization.${dose2_id}.status == DELETED"
