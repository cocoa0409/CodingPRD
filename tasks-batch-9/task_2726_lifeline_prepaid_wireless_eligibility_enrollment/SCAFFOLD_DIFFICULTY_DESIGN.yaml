  # =========================================================================
  # RULE 3 - non_linear_state_machine
  # Two instances on DIFFERENT ENTITIES:
  #   3A -> Enrollment: four PARALLEL, independently advancing state dimensions;
  #   3B -> SubscriberCase: a genuine CYCLE (UNDER_REVIEW -> REMANDED -> UNDER_REVIEW)
  #         with a bounded loop counter.
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: enrollment_four_parallel_dimensions_advance_independently
        grounds:
          - state_machines.Enrollment.usage_status.USING_to_NON_USAGE_FLAGGED
          - state_machines.Enrollment.recert_status.NOT_DUE_to_NOTICED
          - state_machines.Enrollment.device_status.AWAITING_DEVICE_to_DEVICE_ISSUED
          - state_machines.Enrollment.benefit_status.ACTIVE_to_ACTIVE
          - calculations.non_usage_cure_window
          - calculations.recertification_window
          - calculations.enrollment_audit_risk_score
          - calculations.compliance_sweep_processing_order
        distinguishing_aspect: |
          Enrollment carries FOUR independent state dimensions and a single sweep leaves
          them in four different values at once (benefit_status ACTIVE, usage_status
          NON_USAGE_FLAGGED, recert_status NOTICED, device_status DEVICE_ISSUED); a
          subsequent usage call moves usage_status to USING while leaving the other three
          bit-for-bit unchanged, which no single-dimension state machine can reproduce.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE provider licensed in TX with enrollment_cap 50 and exactly one BASIC device in stock."
            - "Enrollment E1: VOICE, benefit_start_date 2026-08-01, device issued the same instant, no usage ever recorded."
            - "recert_due_date is therefore 2027-08-01 and the notice window opens 2027-06-02."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143006", study_area_code: "489006", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/providers/${prov_a_id}/devices"
              payload: { imei: "350000000000001", model_tier: "BASIC", unit_cost_cents: 2100 }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { dev1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-E1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/enrollments/${enr1_id}/device-issuance"
              payload: { device_id: "${dev1_id}" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
          trigger:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers/${prov_a_id}/compliance-sweep"
              payload: {}
              as: ProgramAdministrator
              captures: { flagged_ids: $.data.non_usage_flagged_enrollment_ids, noticed_ids: $.data.recert_noticed_enrollment_ids, deenrolled_ids: $.data.cure_expired_de_enrolled_enrollment_ids }
            - call: "GET /lifeline/enrollments/${enr1_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { risk_after_sweep: $.data.audit_risk_score, cure_at: $.data.cure_deadline_at, recert_deadline: $.data.recert_response_deadline_at, dev_status_after_sweep: $.data.device_status }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/enrollments/${enr1_id}/usage"
              payload: { usage_kind: "OUTBOUND_CALL" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
          assert:
            - "${flagged_ids} == [${enr1_id}]"
            - "${noticed_ids} == [${enr1_id}]"
            - "${deenrolled_ids} == []"
            - "${cure_at} == 2027-06-17T23:59:59.999Z"
            - "${recert_deadline} == 2027-08-01T23:59:59.999Z"
            - "${dev_status_after_sweep} == DEVICE_ISSUED"
            - "${risk_after_sweep} == 40"
            - "Enrollment.${enr1_id}.usage_status == USING"
            - "Enrollment.${enr1_id}.non_usage_flagged_at == null"
            - "Enrollment.${enr1_id}.cure_deadline_at == null"
            - "Enrollment.${enr1_id}.last_usage_at == 2027-06-10T00:00:00Z"
            - "Enrollment.${enr1_id}.recert_status == NOTICED"
            - "Enrollment.${enr1_id}.recert_response_deadline_at == 2027-08-01T23:59:59.999Z"
            - "Enrollment.${enr1_id}.device_status == DEVICE_ISSUED"
            - "Enrollment.${enr1_id}.benefit_status == ACTIVE"
            - "Enrollment.${enr1_id}.audit_risk_score == 10"
            - "Device.${dev1_id}.status == ISSUED"

      - name: subscriber_case_remand_cycle_bounded_at_three_review_rounds
        grounds:
          - state_machines.SubscriberCase.status.UNDER_REVIEW_to_REMANDED
          - state_machines.SubscriberCase.status.REMANDED_to_UNDER_REVIEW
          - entities.SubscriberCase.fields.review_round
          - validations[priority=99]
          - validations[priority=34]
        distinguishing_aspect: |
          SubscriberCase contains a real CYCLE: UNDER_REVIEW -> REMANDED -> UNDER_REVIEW
          traversed three times, and the loop is terminated not by a state but by the
          review_round counter reaching MAX_REVIEW_ROUNDS 3, so the fourth assign-review
          is rejected with ERR_REVIEW_ROUND_LIMIT while status stays REMANDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Enrollment E1 de-enrolled at 2026-08-01 with reason SUBSCRIBER_REQUEST by the provider agent, so appeal_deadline_at is 2026-08-31T23:59:59.999Z."
            - "A DE_ENROLLMENT_APPEAL case filed by the subscriber, already cycled UNDER_REVIEW -> REMANDED twice and assigned a third reviewer, review_round 3."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143007", study_area_code: "489007", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-F1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /lifeline/enrollments/${enr1_id}/de-enroll"
              payload: { de_enrollment_reason: "SUBSCRIBER_REQUEST", note: "moving out of state" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
            - call: "POST /lifeline/subscriber-cases"
              payload: { subscriber_id: "${sub1_id}", enrollment_id: "${enr1_id}", case_type: "DE_ENROLLMENT_APPEAL", narrative: "I never asked to be dropped" }
              as: Subscriber
              as_user_id: "${sub1_id}"
              captures: { case_id: $.data.id }
            - call: "POST /lifeline/subscriber-cases/${case_id}/assign-review"
              payload: { reviewer_ref: "REV-1" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
            - call: "POST /lifeline/subscriber-cases/${case_id}/decide"
              payload: { decision: "REMAND", decision_rationale: "need the porting log" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
            - call: "POST /lifeline/subscriber-cases/${case_id}/assign-review"
              payload: { reviewer_ref: "REV-2" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
            - call: "POST /lifeline/subscriber-cases/${case_id}/decide"
              payload: { decision: "REMAND", decision_rationale: "porting log incomplete" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
            - call: "POST /lifeline/subscriber-cases/${case_id}/assign-review"
              payload: { reviewer_ref: "REV-3" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
          trigger:
            - call: "POST /lifeline/subscriber-cases/${case_id}/decide"
              payload: { decision: "REMAND", decision_rationale: "third look still inconclusive" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
            - call: "POST /lifeline/subscriber-cases/${case_id}/assign-review"
              payload: { reviewer_ref: "REV-4" }
              as: ProgramAdministrator
              as_user_id: "PA-1"
              captures: { round_err: $.data.error_id }
          assert:
            - "SubscriberCase.${case_id}.status == REMANDED"
            - "SubscriberCase.${case_id}.review_round == 3"
            - "SubscriberCase.${case_id}.reviewer_ref == REV-3"
            - "SubscriberCase.${case_id}.decision == null"
            - "SubscriberCase.${case_id}.decided_at == null"
            - "the second trigger call returns HTTP 409 and ${round_err} == ERR_REVIEW_ROUND_LIMIT"
            - "Enrollment.${enr1_id}.benefit_status == DE_ENROLLED"
            - "Enrollment.${enr1_id}.reinstatement_count == 0"

  # =========================================================================
  # RULE 4 - transitive_cascade
  # Two cascades from DIFFERENT TRIGGERING TRANSITIONS:
  #   4A -> depth 4, triggered by the compliance sweep's recert non-response step;
  #   4B -> depth 4, triggered by an audit sample adjudication.
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: sweep_recert_non_response_cascades_to_address_release_and_duplicate_hold_lift
        grounds:
          - state_machines.Enrollment.recert_status.NOTICED_to_NON_RESPONSIVE
          - state_machines.Enrollment.benefit_status.ACTIVE_to_DE_ENROLLED
          - state_machines.HouseholdAddress.status.DUPLICATE_FLAGGED_to_RESOLVED_SINGLE_HOUSEHOLD
          - state_machines.Subscriber.status.DUPLICATE_HOLD_to_VERIFIED_ELIGIBLE
          - calculations.recertification_window
          - calculations.compliance_sweep_processing_order
          - calculations.household_benefit_occupancy
        distinguishing_aspect: |
          A single POST /lifeline/providers/{id}/compliance-sweep drives a FOUR-LINK chain
          in which every link is caused by the previous one: recert_status NOTICED ->
          NON_RESPONSIVE causes benefit_status ACTIVE -> DE_ENROLLED, which causes the
          certified address occupied_benefit_slots 1 -> 0 and its DUPLICATE_FLAGGED ->
          RESOLVED_SINGLE_HOUSEHOLD, which in turn causes the co-resident DUPLICATE_HOLD
          subscriber to become VERIFIED_ELIGIBLE - the triggering transition is a recert
          lapse, not an audit finding.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Provider licensed in TX, enrollment_cap 50."
            - "Address A1 '1200 N Main St / Apt 4B / El Paso / TX / 79901'; subscriber S1 enrolled there on VOICE with benefit_start_date 2026-08-01, so recert_due_date is 2027-08-01."
            - "Address A2 is a differently punctuated spelling of the same dwelling, so both A1 and A2 become DUPLICATE_FLAGGED and A1.max_permitted_benefit_slots stays 1."
            - "Subscriber S2, created at A1 AFTER the flagging, is in DUPLICATE_HOLD and by 2027-06-02 holds an ELIGIBLE_CONFIRMED check that expires 2027-08-31."
            - "At 2027-06-02 usage is recorded (so the sweep's non-usage step cannot fire yet) and the sweep issues E1's recert notice with response deadline 2027-08-01T23:59:59.999Z; no recertification response is ever submitted."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143008", study_area_code: "489008", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
