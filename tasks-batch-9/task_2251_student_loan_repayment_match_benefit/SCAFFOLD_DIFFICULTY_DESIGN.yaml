          same submit call and the lower-numbered state check wins with a 409.
        test_recipe:
          setup:
            - "One PlanYear 2026 whose annual_deferral_limit_cents is 2300000, walked DRAFT -> OPEN -> LOCKED."
            - "One Employee whose single ContributionRecord posts 10000000 cents compensation and 2300000 cents elective deferral, so remaining_qslp_space_cents excluding this claim is exactly 0."
            - "One VERIFIED LoanAccount and one DRAFT LoanCertification carrying a 30000-cent line, both created while the plan year was still OPEN."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z", annual_deferral_limit_cents: 2300000 }
