  - section: endpoints
    instances:

      - name: clock_set_shifts_created_at_of_every_later_write
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - envelope.logical_clock
        distinguishing_aspect: "Every timestamp is drawn from the logical clock, not the wall clock: a county written before any clock call carries created_at 2026-08-01T00:00:00Z, and after the clock is set to 2026-09-15 a seller written next carries created_at 2026-09-15T00:00:00Z while the county's own created_at is untouched."
        test_recipe:
          setup:
            - "Empty system at the default logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_created: $.data.created_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /seller-profiles"
              payload: { legal_name: "Late Vines LLC", contact_email: "late@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_created: $.data.created_at }
            - call: "GET /counties/${c_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c_created_again: $.data.created_at }
          assert:
            - "${c_created} == 2026-08-01T00:00:00Z (the default clock, no wall-clock leakage)"
            - "${s_created} == 2026-09-15T00:00:00Z"
            - "${c_created_again} == ${c_created}: setting the clock rewrites nothing already stored"
            - "the clock endpoint returns HTTP 200 and is the only way the instant moves"

