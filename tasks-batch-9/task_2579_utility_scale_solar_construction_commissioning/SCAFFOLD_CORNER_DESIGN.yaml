  - section: state_machines
    instances:
      - name: outage_window_request_is_approved_by_the_utility
        claim_type: valid_transition
        grounds:
          - state_machines.OutageWindow.REQUESTED_to_APPROVED
          - endpoints[POST /solar/outage-windows/{window_id}/utility-response]
        distinguishing_aspect: "The happy-path utility response moves REQUESTED -> APPROVED, stores utility_reference and responded_at, and bumps version by exactly one; the window is not yet EXECUTED because nothing has been energized."
        test_recipe:
          setup:
            - "One project with one substation in SITE_CIVIL and one REQUESTED BACKFEED window [2026-08-10T00:00Z, 2026-08-10T04:00Z]"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Transition Mesa", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/substations"
              payload: { substation_code: "S1", interconnection_voltage_kv: 138.0, mv_collection_km: 12.5 }
              as: UtilityCoordinator
              captures: { sub: $.data.id }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-10T04:00:00Z", purpose: "BACKFEED" }
              as: UtilityCoordinator
              captures: { ow: $.data.id, st0: $.data.status, v0: $.data.version, ref0: $.data.utility_reference }
          trigger:
            - call: "POST /solar/outage-windows/${ow}/utility-response"
              payload: { decision: "APPROVE", utility_reference: "SO-4471" }
              as: UtilityCoordinator
              captures: { st1: $.data.status, v1: $.data.version, ref1: $.data.utility_reference }
          assert:
            - "${st0} == REQUESTED, ${v0} == 1 and ${ref0} == null"
            - "HTTP 200 with ${st1} == APPROVED, ${ref1} == \"SO-4471\" and responded_at non-null"
            - "${v1} == 2 — exactly one version increment"
            - "Substation.${sub}.status == SITE_CIVIL and energizing_outage_window_id == null — approval alone energizes nothing"

      - name: grading_area_acceptance_before_grading_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GradingArea.GRADED_to_ACCEPTED
          - validations[priority=8]
          - errors[ERR_GRADING_AREA_NOT_OPEN_FOR_WORK]
        distinguishing_aspect: "The GRADED -> ACCEPTED transition names status == GRADED as its first precondition: an area that has only been CLEARED is refused with 409 ERR_GRADING_AREA_NOT_OPEN_FOR_WORK even though the compaction and drainage inputs would both pass, and the same payload succeeds once the GRADING log lands."
        test_recipe:
          setup:
            - "One project with one grading area that has absorbed a CLEARING log only (status CLEARED)"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Precondition Bench", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T20:00:00Z", acreage_disturbed_delta: 10.00 }
              as: CivilSuperintendent
              captures: { st0: $.data.status }
          trigger:
            - call: "POST /solar/grading-areas/${ga}/acceptance"
              payload: { compaction_test_pct: 96.5, drainage_inspection_passed: true }
              as: OwnerEngineer
              captures: { eid: $.data.error_id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-02T12:00:00Z", work_end_at: "2026-08-02T20:00:00Z", acreage_disturbed_delta: 8.00 }
              as: CivilSuperintendent
              captures: { st1: $.data.status }
            - call: "POST /solar/grading-areas/${ga}/acceptance"
              payload: { compaction_test_pct: 96.5, drainage_inspection_passed: true }
              as: OwnerEngineer
              captures: { st2: $.data.status, comp: $.data.compaction_test_pct }
          assert:
            - "${st0} == CLEARED"
            - "the first acceptance returns 409 with ${eid} == ERR_GRADING_AREA_NOT_OPEN_FOR_WORK, and compaction_test_pct stays null"
            - "${st1} == GRADED"
            - "the second acceptance returns 200 with ${st2} == ACCEPTED and ${comp} == 96.5"
            - "GradingArea.${ga}.disturbed_acreage_current == 18.00 — the refused acceptance disturbed nothing"

      - name: mechanical_completion_stores_measurements_and_recomputes_readiness
        claim_type: side_effect_execution
        grounds:
          - state_machines.Block.PILES_COMPLETE_to_MECH_COMPLETE
          - calculations.module_availability_check
          - calculations.block_and_project_readiness_rollup
        distinguishing_aspect: "Every declared side effect of the mechanical-completion transition is observable in one call: the two measurements are stored, mc_ready is recomputed (and stays false because the electrical dimension is still PLANNED), and Block.version increments — while Project.blocks_mc_ready_count stays 0."
        test_recipe:
          setup:
            - "One project with an ACCEPTED grading area, an ACCEPTED 60-unit MODULE delivery (57 accepted units) and one block whose single pile is ACCEPTED (mechanical_status PILES_COMPLETE)"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Side Effect Flat", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T20:00:00Z", acreage_disturbed_delta: 10.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-02T12:00:00Z", work_end_at: "2026-08-02T20:00:00Z", acreage_disturbed_delta: 8.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/acceptance"
              payload: { compaction_test_pct: 96.5, drainage_inspection_passed: true }
              as: OwnerEngineer
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, yzv: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 60, pallets: 60, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${yzv}" }
              as: ProcurementCoordinator
              captures: { dlv: $.data.id }
            - call: "POST /solar/deliveries/${dlv}/receipt"
              payload: { received_unit_qty: 60, damaged_unit_qty: 3 }
              as: ProcurementCoordinator
            - call: "POST /solar/projects/${proj}/blocks"
              payload: { grading_area_id: "${ga}", block_code: "B1", dc_capacity_kw: 130, planned_pile_count: 1, planned_string_count: 1 }
              as: EpcProjectManager
              captures: { blk: $.data.id }
