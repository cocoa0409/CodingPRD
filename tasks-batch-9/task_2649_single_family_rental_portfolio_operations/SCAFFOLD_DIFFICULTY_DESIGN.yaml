# =============================================================================
# 1.8 Scaffold Difficulty Design - sfr-portfolio-ops
#
# Every instance below is replayable from an empty database using only endpoints
# declared in SCAFFOLD.yaml section 1.5. Every numeric literal in `assert:` was
# computed by executing the section 1.3 formula in code against the pinned
# fixture inputs (Market ATL, Home H1, the three scope templates).
#
# Two setup chains recur:
#   Chain S - clock 2026-08-01, Market ATL, three scope templates, Home H1,
#             UnderwritingCase UC1 submitted and APPROVED (home ACQUIRED),
#             RenovationProject with one IN_HOUSE PAINT_INT work order, scope
#             locked on 2026-08-05 (home RENOVATING / FROZEN), the work order
#             dispatched, clock advanced to 2026-09-06 and the work order
#             completed -> project RENT_READY, home STABILIZED, posture OPEN.
#   Chain L - the same spine with approved_budget_cents 1600000 and three work
#             orders (PAINT_INT IN_HOUSE 300000/310000, HVAC_REPLACE VENDOR
#             640000/640000, FLOOR_LVP IN_HOUSE 570000/570000), so the realized
#             renovation cost is 1520000 instead of 300000.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: yield_on_cost_underwritten_versus_realized_diverges_28_bps
        grounds:
          - calculations.yield_on_cost
          - entities.UnderwritingCase.fields.underwritten_yield_on_cost_bps
          - entities.UnderwritingCase.fields.realized_yield_on_cost_bps
          - entities.UnderwritingCase.fields.realized_renovation_cost_cents
          - entities.Home.fields.hold_sell_score_bps
          - entities.Home.fields.disposition_flagged
          - state_machines.Lease.DRAFT_to_EXECUTED
        distinguishing_aspect: |
          The same UnderwritingCase row carries both variants at once: the underwritten variant
          prices planned scope (1479843) against estimated rent (215000) and yields 559 bps, while
          the realized variant prices COMPLETED work-order actuals (1520000) against the EXECUTED
          lease rent (208000) and yields 531 bps - a 28 bps divergence that flips
          Home.disposition_flagged to true, and the two field groups are disjoint on the same row.
        test_recipe:
          setup:
            - "Market ATL and the three scope templates exist; Home H1 assessed 28000000, asking rent 215000."
            - "UC1 is APPROVED with planned_renovation_budget_cents 1479843 and underwritten_yield_on_cost_bps 559, so Home H1 is ACQUIRED."
            - "Chain L: three work orders completed for 310000 + 640000 + 570000 = 1520000, project RENT_READY on 2026-09-06, home STABILIZED and OPEN."
            - "The realized variant has already run once with the estimated-rent fallback, producing realized_yield_on_cost_bps 558."
            - "Prospect P1 is VERIFIED (fraud 1093), her application is CONDITIONAL_APPROVED with total_move_in_deposit_cents 352500, and lease L1 is DRAFT at 208000/month with the deposit fully funded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { mkt_id: $.data.id }
            - call: "POST /scope-templates"
              payload: { code: "PAINT_INT", name: "Interior Paint", certification_code: "PAINT", unit: "HOME", benchmark_unit_cost_cents: 285050, default_crew_size: 3, default_crew_days: 3, safety_critical: false }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { st_paint_id: $.data.id }
            - call: "POST /scope-templates"
              payload: { code: "HVAC_REPLACE", name: "HVAC System Replacement", certification_code: "HVAC", unit: "SYSTEM", benchmark_unit_cost_cents: 612450, default_crew_size: 3, default_crew_days: 3, safety_critical: true }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { st_hvac_id: $.data.id }
            - call: "POST /scope-templates"
              payload: { code: "FLOOR_LVP", name: "Luxury Vinyl Plank Flooring", certification_code: "FLOOR", unit: "SQFT", benchmark_unit_cost_cents: 475, default_crew_size: 2, default_crew_days: 2, safety_critical: false }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { st_floor_id: $.data.id }
            - call: "POST /homes"
              payload: { market_id: "${mkt_id}", address_line1: "118 Peachtree Way", city: "Atlanta", state_code: "GA", postal_code: "30318", bedrooms: 3, bathrooms: 2, square_feet: 1650, year_built: 1998, assessed_value_cents: 28000000, asking_rent_cents: 215000, insurance_carrier_name: "Southeast Mutual", insurance_annual_premium_cents: 180000, insurance_binder_expires_on: "2027-06-30", hoa_name: "Peachtree HOA", hoa_annual_cents: 60000 }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { home_id: $.data.id, home_v: $.data.version }
            - call: "POST /underwriting-cases"
              payload: { home_id: "${home_id}", expected_home_version: "${home_v}", purchase_price_cents: 25000000, acquisition_closing_costs_cents: 750000, estimated_monthly_rent_cents: 215000, turn_reserve_annual_cents: 120000, planned_scope_lines: [{ scope_template_id: "${st_paint_id}", quantity: 1 }, { scope_template_id: "${st_hvac_id}", quantity: 1 }, { scope_template_id: "${st_floor_id}", quantity: 1150 }] }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { uc_id: $.data.id }
            - call: "POST /underwriting-cases/${uc_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
            - call: "POST /underwriting-cases/${uc_id}/decision"
              payload: { decision: "APPROVE", decision_note: "IC approves at 559 bps" }
              as: InvestmentCommittee
              as_user_id: "ic-1"
            - call: "POST /vendors"
              payload: { legal_name: "Peachtree Mechanical LLC", market_id: "${mkt_id}", daily_crew_capacity: 6, cost_index_bps: 9800, quality_score_bps: 8600, insurance_expires_on: "2027-05-31" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /vendor-certifications"
              payload: { vendor_id: "${v1_id}", certification_code: "HVAC", effective_on: "2026-01-01", expires_on: "2027-01-31" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /renovation-projects"
              payload: { home_id: "${home_id}", project_type: "ACQUISITION_RENOVATION", approved_budget_cents: 1600000 }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { proj_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", scope_template_id: "${st_paint_id}", work_type: "RENOVATION", quantity: 1, crew_size: 3, scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-12", fulfillment_channel: "IN_HOUSE", quoted_cost_cents: 300000, project_id: "${proj_id}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { wo_paint_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", scope_template_id: "${st_hvac_id}", work_type: "RENOVATION", quantity: 1, crew_size: 3, scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-12", fulfillment_channel: "VENDOR", quoted_cost_cents: 640000, project_id: "${proj_id}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { wo_hvac_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", scope_template_id: "${st_floor_id}", work_type: "RENOVATION", quantity: 1150, crew_size: 2, scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-12", fulfillment_channel: "IN_HOUSE", quoted_cost_cents: 570000, project_id: "${proj_id}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { wo_floor_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: System
            - call: "POST /renovation-projects/${proj_id}/lock-scope"
              payload: { turn_started_on: "2026-08-05" }
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /work-orders/${wo_paint_id}/dispatch"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /work-orders/${wo_hvac_id}/dispatch"
              payload: { vendor_id: "${v1_id}" }
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /work-orders/${wo_hvac_id}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v1_id}"
            - call: "POST /work-orders/${wo_floor_id}/dispatch"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: System
            - call: "POST /work-orders/${wo_paint_id}/complete"
              payload: { actual_cost_cents: 310000, completed_on: "2026-09-06" }
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /work-orders/${wo_hvac_id}/complete"
              payload: { actual_cost_cents: 640000, completed_on: "2026-09-06" }
              as: Vendor
              as_user_id: "${v1_id}"
            - call: "POST /work-orders/${wo_floor_id}/complete"
              payload: { actual_cost_cents: 570000, completed_on: "2026-09-06" }
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /prospects"
              payload: { email: "p1@example.com", full_name: "Paula One", phone: "+1-404-555-0101", market_id: "${mkt_id}", declared_monthly_income_cents: 700000, credit_tier: "B", prior_eviction_count: 0 }
              as: Anonymous
              as_user_id: "device-p1"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /prospects/${p1_id}/identity-verifications"
              payload: { expected_prospect_version: "${p1_v}", document_type: "DRIVERS_LICENSE", document_match_score_bps: 9200, selfie_liveness_pass: true, verified_monthly_income_cents: 560000, device_reputation_bps: 8800, ip_geo_distance_km: 15 }
              as: Prospect
              as_user_id: "${p1_id}"
            - call: "POST /rental-applications"
              payload: { prospect_id: "${p1_id}", home_id: "${home_id}", requested_move_in_date: "2026-09-20", lease_term_months: 12, pet_count: 1, pet_breeds: ["LABRADOR"] }
              as: Prospect
              as_user_id: "${p1_id}"
              captures: { app_id: $.data.id }
            - call: "POST /rental-applications/${app_id}/screen"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-1"
            - call: "POST /leases"
              payload: { application_id: "${app_id}", start_date: "2026-09-20", term_months: 12, monthly_rent_cents: 208000 }
              as: LeasingAgent
              as_user_id: "agent-1"
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/deposit-payments"
              payload: { amount_cents: 352500 }
              as: LeasingAgent
              as_user_id: "agent-1"
          trigger:
            - call: "POST /leases/${lease_id}/execute"
              payload: { signed_on: "2026-09-06" }
              as: LeasingAgent
              as_user_id: "agent-1"
          assert:
            - "UnderwritingCase.${uc_id}.underwritten_all_in_basis_cents == 27229843"
            - "UnderwritingCase.${uc_id}.underwritten_effective_gross_income_cents == 2425200"
            - "UnderwritingCase.${uc_id}.underwritten_noi_cents == 1521184"
            - "UnderwritingCase.${uc_id}.underwritten_yield_on_cost_bps == 559"
            - "UnderwritingCase.${uc_id}.realized_renovation_cost_cents == 1520000"
            - "UnderwritingCase.${uc_id}.realized_all_in_basis_cents == 27270000"
            - "UnderwritingCase.${uc_id}.realized_noi_cents == 1448541"
            - "UnderwritingCase.${uc_id}.realized_yield_on_cost_bps == 531"
            - "UnderwritingCase.${uc_id}.underwritten_yield_on_cost_bps - UnderwritingCase.${uc_id}.realized_yield_on_cost_bps == 28"
            - "Home.${home_id}.hold_sell_score_bps == -9"
            - "Home.${home_id}.disposition_flagged == true"
            - "Lease.${lease_id}.status == EXECUTED"

      - name: fraud_score_pre_versus_post_verification_diverges_3757_bps
        grounds:
          - calculations.prospect_fraud_risk_score
          - entities.Prospect.fields.fraud_risk_score_bps
          - entities.Prospect.fields.fraud_score_variant
          - state_machines.Prospect.UNVERIFIED_to_VERIFIED
          - concurrency_rules[identity-verification-stale-prospect]
        distinguishing_aspect: |
          One Prospect row scores 4850 bps under the pre_verification variant (identity factor
          pinned at 10000 and device factor at 7000 because nothing is proven, income read from
          declared_monthly_income_cents 700000) and 1093 bps under the post_verification variant
          (identity 800 from document_match_score_bps 9200, device 1200, income read from
          verified_monthly_income_cents 560000) - 3757 bps of divergence on identical credit and
          eviction history, and fraud_score_variant flips PRE_VERIFICATION -> POST_VERIFICATION.
        test_recipe:
          setup:
            - "Market ATL exists with rent_index_cents 210000, so the income coverage denominator is 630000."
            - "Prospect P1 was created anonymously with declared_monthly_income_cents 700000, credit_tier B, prior_eviction_count 0 and has verification_attempt_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { mkt_id: $.data.id }
            - call: "POST /prospects"
              payload: { email: "p1@example.com", full_name: "Paula One", phone: "+1-404-555-0101", market_id: "${mkt_id}", declared_monthly_income_cents: 700000, credit_tier: "B", prior_eviction_count: 0 }
              as: Anonymous
              as_user_id: "device-p1"
              captures: { p1_id: $.data.id, p1_v: $.data.version, pre_score: $.data.fraud_risk_score_bps }
          trigger:
            - call: "POST /prospects/${p1_id}/identity-verifications"
              payload: { expected_prospect_version: "${p1_v}", document_type: "DRIVERS_LICENSE", document_match_score_bps: 9200, selfie_liveness_pass: true, verified_monthly_income_cents: 560000, device_reputation_bps: 8800, ip_geo_distance_km: 15 }
              as: Prospect
              as_user_id: "${p1_id}"
          assert:
            - "${pre_score} == 4850"
            - "Prospect.${p1_id}.fraud_risk_score_bps == 1093"
            - "Prospect.${p1_id}.fraud_score_variant == POST_VERIFICATION"
            - "Prospect.${p1_id}.identity_status == VERIFIED"
            - "Prospect.${p1_id}.verification_attempt_count == 1"
            - "${pre_score} - Prospect.${p1_id}.fraud_risk_score_bps == 3757"
            - "Prospect.${p1_id}.version == ${p1_v} + 1"

  - rule_id: combinatorial_formula
    instances:
      - name: scope_benchmark_per_line_rounding_beats_index_the_sum_by_one_cent
        grounds:
          - calculations.scope_benchmark_total
          - entities.UnderwritingCase.fields.planned_renovation_budget_cents
          - entities.UnderwritingCase.fields.planned_scope_lines
          - entities.ScopeTemplate.fields.benchmark_unit_cost_cents
          - entities.Market.fields.cost_index_bps
        distinguishing_aspect: |
          Three scope lines whose per-line indexed costs are individually rounded to whole cents
          (559906 + 627761 + 292176) sum to 1479843, whereas summing the raw line costs first
          (1443750) and applying cost_index_bps 10250 once to that sum gives 1479844; the case must
          store 1479843, so the rounding boundary sits inside the aggregation, not after it.
        test_recipe:
          setup:
            - "Market ATL exists with cost_index_bps 10250."
            - "Three scope templates exist: PAINT_INT 285050/HOME, HVAC_REPLACE 612450/SYSTEM, FLOOR_LVP 475/SQFT."
            - "Home H1 exists in PIPELINE with version 1 and no underwriting case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { mkt_id: $.data.id }
            - call: "POST /scope-templates"
              payload: { code: "PAINT_INT", name: "Interior Paint", certification_code: "PAINT", unit: "HOME", benchmark_unit_cost_cents: 285050, default_crew_size: 3, default_crew_days: 3, safety_critical: false }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { st_paint_id: $.data.id }
            - call: "POST /scope-templates"
              payload: { code: "HVAC_REPLACE", name: "HVAC System Replacement", certification_code: "HVAC", unit: "SYSTEM", benchmark_unit_cost_cents: 612450, default_crew_size: 3, default_crew_days: 3, safety_critical: true }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { st_hvac_id: $.data.id }
            - call: "POST /scope-templates"
              payload: { code: "FLOOR_LVP", name: "Luxury Vinyl Plank Flooring", certification_code: "FLOOR", unit: "SQFT", benchmark_unit_cost_cents: 475, default_crew_size: 2, default_crew_days: 2, safety_critical: false }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { st_floor_id: $.data.id }
            - call: "POST /homes"
              payload: { market_id: "${mkt_id}", address_line1: "118 Peachtree Way", city: "Atlanta", state_code: "GA", postal_code: "30318", bedrooms: 3, bathrooms: 2, square_feet: 1650, year_built: 1998, assessed_value_cents: 28000000, asking_rent_cents: 215000, insurance_carrier_name: "Southeast Mutual", insurance_annual_premium_cents: 180000, insurance_binder_expires_on: "2027-06-30", hoa_name: "Peachtree HOA", hoa_annual_cents: 60000 }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { home_id: $.data.id, home_v: $.data.version }
          trigger:
            - call: "POST /underwriting-cases"
              payload: { home_id: "${home_id}", expected_home_version: "${home_v}", purchase_price_cents: 25000000, acquisition_closing_costs_cents: 750000, estimated_monthly_rent_cents: 215000, turn_reserve_annual_cents: 120000, planned_scope_lines: [{ scope_template_id: "${st_floor_id}", quantity: 1150 }, { scope_template_id: "${st_hvac_id}", quantity: 1 }, { scope_template_id: "${st_paint_id}", quantity: 1 }] }
              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
              captures: { uc_id: $.data.id }
          assert:
            - "UnderwritingCase.${uc_id}.planned_renovation_budget_cents == 1479843"
            - "UnderwritingCase.${uc_id}.planned_renovation_budget_cents != 1479844"
            - "UnderwritingCase.${uc_id}.underwritten_all_in_basis_cents == 27229843"
            - "UnderwritingCase.${uc_id}.underwritten_effective_gross_income_cents == 2425200"
            - "UnderwritingCase.${uc_id}.underwritten_noi_cents == 1521184"
            - "UnderwritingCase.${uc_id}.underwritten_yield_on_cost_bps == 559"
            - "UnderwritingCase.${uc_id}.status == DRAFT"

      - name: turn_holdback_cap_keyed_on_gross_not_net_turn_cost
        grounds:
          - calculations.turn_holdback
          - entities.RenovationProject.fields.gross_turn_cost_cents
          - entities.RenovationProject.fields.vendor_holdback_cents
          - entities.RenovationProject.fields.net_turn_cost_cents
          - entities.Market.fields.turn_holdback_cap_bps
          - state_machines.RenovationProject.IN_PROGRESS_to_RENT_READY
        distinguishing_aspect: |
          The eight-step holdback chain is only correct in one order: gross 1520000 with 4 overage
          days selects the 2000 bps tier for a raw holdback of 304000, the cap is 1500 bps of the
          GROSS figure (228000) so the cap binds and net becomes 1292000; computing the cap against
          (gross - raw) = 1216000 would yield 182400 and a net of 1337600, wrong by 45600 cents.
        test_recipe:
          setup:
            - "Market ATL exists with make_ready_target_days 30 and turn_holdback_cap_bps 1500."
            - "Home H1 is ACQUIRED through an APPROVED UnderwritingCase; a RenovationProject with approved_budget_cents 1600000 carries three IN_HOUSE work orders quoted 300000 + 640000 + 570000."
            - "The scope was locked on 2026-08-05, so turn_started_on is 2026-08-05, and all three work orders are IN_PROGRESS."
            - "The clock stands at 2026-09-08, which is 34 days after turn_started_on - 4 days past the 30-day make-ready target."
            - "Two of the three work orders are already COMPLETED for 310000 and 640000; the project is still IN_PROGRESS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
