  # ==========================================================================
  # Section: cross_cutting_layers
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_cycle_version_on_configure
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cycle-configure-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential configure calls: first succeeds with the observed version; the second, still carrying the pre-mutation version, is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["ACTIVE bank with 3 items; cycle with 3 pinned items at version V (captured); first configure bumps version"]
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "OCC Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { oc_bank: $.data.id }
            - call: "POST /engagement/item-banks/${oc_bank}/items"
              payload: { item_code: "OC-1", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
              captures: { oc_i1: $.data.id }
            - call: "POST /engagement/item-banks/${oc_bank}/items"
              payload: { item_code: "OC-2", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
              captures: { oc_i2: $.data.id }
            - call: "POST /engagement/item-banks/${oc_bank}/items"
              payload: { item_code: "OC-3", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
              captures: { oc_i3: $.data.id }
            - call: "POST /engagement/item-banks/${oc_bank}/items"
              payload: { item_code: "OC-4", dimension: "GROWTH", weight: 1.0 }
              as: HRAdmin
              captures: { oc_i4: $.data.id }
            - call: "POST /engagement/item-banks/${oc_bank}/activate"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/survey-cycles"
              payload: { label: "OCC Cycle", cycle_kind: "CENSUS", bank_id: "${oc_bank}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z" }
              as: HRAdmin
              captures: { oc_cyc: $.data.id }
            - call: "POST /engagement/survey-cycles/${oc_cyc}/items"
              payload: { item_id: "${oc_i1}", pinned_weight: 1.0, display_order: 1 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${oc_cyc}/items"
              payload: { item_id: "${oc_i2}", pinned_weight: 1.0, display_order: 2 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${oc_cyc}/items"
              payload: { item_id: "${oc_i3}", pinned_weight: 1.0, display_order: 3 }
              as: HRAdmin
            - call: "GET /engagement/survey-cycles/${oc_cyc}"
              payload: {}
              as: HRAdmin
              captures: { oc_v: $.data.version }
          trigger:
            # Another writer pins a 4th item, which cascades a version bump on the cycle
            - call: "POST /engagement/survey-cycles/${oc_cyc}/items"
              payload: { item_id: "${oc_i4}", pinned_weight: 1.0, display_order: 4 }
              as: HRAdmin
            # The stale writer now configures with the pre-bump version
            - call: "POST /engagement/survey-cycles/${oc_cyc}/configure"
              payload: { expected_cycle_version: "${oc_v}" }
              as: HRAdmin
              captures: { oc_err: $.data.error_id }
            - call: "GET /engagement/survey-cycles/${oc_cyc}"
              payload: {}
              as: HRAdmin
              captures: { oc_v_now: $.data.version, oc_state: $.data.status }
            - call: "POST /engagement/survey-cycles/${oc_cyc}/configure"
              payload: { expected_cycle_version: "${oc_v_now}" }
              as: HRAdmin
              captures: { oc_ok: $.data.status }
          assert:
            - "oc_err == ERR_STALE_VERSION (cycle still DRAFT, so only the OCC guard can fire; item-add bumped version between read and write)"
            - "oc_v_now == oc_v + 1 (the item-add cascade bumped SurveyCycle.version exactly once)"
            - "oc_ok == CONFIGURED (fresh version succeeds)"
            - "oc_state == DRAFT between the rejection and the successful retry"
      - name: occ_stale_plan_version_on_submit
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-submit-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Plan submit with expected_plan_version one behind current (because adding an item bumped the parent plan version) -> 412 ERR_STALE_VERSION."
