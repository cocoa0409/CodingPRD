              payload: {}
              as: CaseManager
              as_user_id: u_cm_1
          assert:
            - "Before the trigger: M2 shows committed_cents 1500000, remaining_pledge_capacity_cents 0, status CAPPED; the presentation shows bridge_tier TIER_C, bridge_authorized_cents 450000, awarded_cents 1950000; the case shows total_committed_cents 1950000 and PARTIALLY_COMMITTED."
            - "After the rescind: the commitment is RESCINDED."
            - "GET M2 -> committed_cents 0, disbursed_cents 0, remaining_pledge_capacity_cents 1500000 which equals annual_pledge_cap_cents exactly, status back to ACTIVE."
            - "GET the presentation -> pledged_total_cents 0, awarded_cents 450000 (the bridge authorization survives), shortfall_cents 2550000."
            - "GET the case -> total_committed_cents 450000, residual_unmet_cents 2550000, funding_status still PARTIALLY_COMMITTED, case_status still ACTIVE_RECOVERY."
      - name: reverse_restores_funding_source_conservation_identity_exactly
        grounds:
          - "state_machines.Disbursement.transitions.PAID_to_REVERSED"
          - "entities.FundingSource.fields.total_cents"
          - "entities.FundingSource.fields.committed_cents"
          - "entities.FundingSource.fields.disbursed_cents"
          - "entities.FundingSource.fields.admin_retained_cents"
          - "entities.FundingSource.fields.available_cents"
        distinguishing_aspect: "The conservation identity `total_cents == available_cents + committed_cents + disbursed_cents + admin_retained_cents` must hold both after the payment (0 + 0 + 1000000 + 35000 = 1035000) and after the reversal (1035000 + 0 + 0 + 0 = 1035000), with status returning EXHAUSTED -> OPEN. An implementation that returns only net_cents on reversal leaves 35000 of retention stranded and the identity short; one that credits gross to available while leaving disbursed_cents populated double-counts to 2035000. The disbursement row itself must retain net_cents 1000000 / admin_retained_cents 35000 / gross_cents 1035000 as an audit record even though the source is fully restored."
        test_recipe:
          setup:
            - "Case C23: STRUCTURE verified 2000000 -> unmet 2000000."
            - "M1 pledges the whole 2000000; AWARD gives TIER_B with gap 0, bridge 0, awarded 2000000, FULLY_COMMITTED, ACTIVE_RECOVERY."
            - "Project PERMITTED."
            - "FS_S23 is STRUCTURE_REPAIR_ONLY with total exactly 1035000 and admin_retention_allowed true, so the net_cap of the whole source is exactly 1000000 (1035000 * 10000 // 10350 = 1000000 with retention 35000 landing on the cent)."
