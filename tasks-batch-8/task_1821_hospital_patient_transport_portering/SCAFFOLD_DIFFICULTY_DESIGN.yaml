          assert:
            - "after DECLINE: status QUEUED (${st_mid}) and decline_count == 1"
            - "after ACCEPT of auto-offer: status ASSIGNED (${st_assigned})"
            - "after RELEASE: status QUEUED (${st_final}), release_count == 1, assigned_transporter_id IS NULL"
            - "excluded_transporter_ids contains both ${t1} and ${t2} (length 2)"

  # ------------------------------------------------------------------
  # Rule 4: transitive_cascade — depth >= 3 and >= 2, different triggers
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: decline_release_autodispatch_chain
        grounds:
          - state_machines.DispatchOffer.PENDING_to_DECLINED
          - state_machines.EquipmentAsset.RESERVED_to_AVAILABLE
          - calculations.auto_dispatch_selection
        distinguishing_aspect: |
          Depth-3 chain from respond DECLINE: offer -> DECLINED (A) causes asset RESERVED ->
          AVAILABLE (B), which itself causes a new auto-dispatch DispatchOffer to T2 plus asset
          AVAILABLE -> RESERVED (C). R2, also queued, is skipped because R1 wins ranking
          (created_at ASC) and T1 is excluded as the decliner.
        test_recipe:
          setup:
            - "Locations HUB, W4, IMG; edges 8/12 and 10/16; T1 then T2 (created in that order), both WHEELCHAIR ON_SHIFT"
            - "Exactly one WHEELCHAIR asset WC-001 at W4"
            - "R1 created 2026-08-01T00:00:00Z (WHEELCHAIR W4->IMG); R2 created 2026-08-01T00:01:00Z (same); offer O1 on R1 to T1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T Two", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t2: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t2}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/transporters/${t2}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t2}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:01:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P2", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r2: $.data.id } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:02:00Z" }, as: TransportSupervisor }
          trigger:
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "DECLINE" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/requests/${r1}/offers", as: TransportDispatcher, captures: { o1_st: "$.data[0].status", o2_id: "$.data[1].id", o2_st: "$.data[1].status", o2_t: "$.data[1].transporter_id", o2_seq: "$.data[1].offer_seq", o2_est: "$.data[1].estimated_travel_minutes" } }
            - { call: "GET /transport/requests/${r2}/offers", as: TransportDispatcher }
            - { call: "GET /transport/equipment-assets/${a1}", as: TransportDispatcher, captures: { a_st: $.data.status } }
          assert:
            - "R1.offers[0].status == DECLINED"
            - "R1.offers[1] exists: status PENDING, transporter_id == ${t2}, offer_seq == 2, estimated_travel_minutes == 19"
            - "R2.offers is empty (length 0) — R1 won the freed asset by created_at ASC"
            - "EquipmentAsset.${a1}.status == RESERVED (freed then re-reserved by the cascade)"

      - name: cancel_release_autodispatch_chain
        grounds:
          - state_machines.TransportRequest.QUEUED_to_CANCELLED
          - state_machines.EquipmentAsset.RESERVED_to_AVAILABLE
          - calculations.auto_dispatch_selection
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (close CANCEL, not respond): cancelling an ASSIGNED
          request frees its RESERVED asset (B), and that release itself auto-dispatches the
          longest-waiting QUEUED request R2 to the freed transporter T1 (C) — the asset ends
          RESERVED again under a new offer on R2.
        test_recipe:
          setup:
            - "Same site as decline_release_autodispatch_chain; T1 (created first) and T2 both WHEELCHAIR ON_SHIFT; one asset WC-001"
            - "R1 ASSIGNED to T1 (offer accepted); R2 QUEUED created one minute later"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T Two", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t2: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t2}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/transporters/${t2}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t2}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:01:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P2", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /transport/requests/${r1}/close", payload: { action: "CANCEL", reason: "ORDER_WITHDRAWN" }, as: TransportDispatcher }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { r1_st: $.data.status } }
            - { call: "GET /transport/requests/${r2}/offers", as: TransportDispatcher, captures: { r2o_st: "$.data[0].status", r2o_t: "$.data[0].transporter_id" } }
            - { call: "GET /transport/equipment-assets/${a1}", as: TransportDispatcher, captures: { a_st: $.data.status } }
          assert:
            - "TransportRequest.${r1}.status == CANCELLED"
            - "R2.offers[0].status == PENDING and transporter_id == ${t1} (deadhead tie 8 == 8 broken by transporter created_at ASC)"
            - "EquipmentAsset.${a1}.status == RESERVED (freed by cancel, re-reserved by auto-dispatch)"

  # ------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different category pairs
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_on_cleaning_finish
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.CleaningTask.IN_PROGRESS_to_AWAITING_VERIFICATION
        distinguishing_aspect: |
          Category pair (state, business_safety): advancing a PENDING DEEP task straight to
          AWAITING_VERIFICATION violates both the state precondition (never started) and the
          15-minute dwell safety rule; priority 6 state must win with ERR_INVALID_CLEANING_STATE.
        test_recipe:
          setup:
            - "CONTACT-isolation WHEELCHAIR trip completed at 2026-08-01T00:05:00Z, spawning a DEEP CleaningTask that stays PENDING (never started)"
            - "Clock at 2026-08-01T00:05:00Z — dwell could never have elapsed either"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"], isolation_certified: true }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR", isolation_precaution: "CONTACT" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:05:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/cleaning-tasks", payload: { equipment_asset_id: "${a1}" }, as: HousekeepingStaff, as_user_id: "hk-1", captures: { ct: "$.data[0].id", ct_type: "$.data[0].task_type" } }
          trigger:
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "AWAITING_VERIFICATION" }, as: HousekeepingStaff, as_user_id: "hk-1", captures: { err: $.data.error_id } }
          assert:
            - "CleaningTask.${ct}.task_type == DEEP (${ct_type})"
            - "error_id == ERR_INVALID_CLEANING_STATE (state priority 6 beats dwell safety priority 7)"

      - name: referential_vs_temporal_on_shift_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: |
          Category pair (business_referential, business_temporal): creating a shift that overlaps
          an existing PLANNED shift for a SUSPENDED transporter violates both rules; priority 8
          referential must win with ERR_TRANSPORTER_SUSPENDED, not ERR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "T1 with PLANNED shift S1 2026-08-01T08:00-16:00; clocked ON_SHIFT at 09:00, then SUSPENDED by supervisor"
            - "New shift S2 2026-08-01T12:00-20:00 would overlap S1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-08-01T08:00:00Z", shift_end: "2026-08-01T16:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "SUSPENDED" }, as: TransportSupervisor }
          trigger:
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-08-01T12:00:00Z", shift_end: "2026-08-01T20:00:00Z" }, as: TransportSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSPORTER_SUSPENDED (referential priority 8 beats temporal priority 9)"

  # ------------------------------------------------------------------
  # Rule 6: boundary_precision_check — different metrics/endpoints
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: response_boundary_exact_target
        grounds:
          - calculations.sla_posture_evaluation
          - entities.TransportRequest.fields.response_minutes
        distinguishing_aspect: |
          Metric: response minutes vs ROUTINE target 120 via the trip-events endpoint. Breach
          requires STRICTLY greater: response_minutes == 120 exactly freezes posture AT_RISK
          (>= 90), and zero DelayRecords are created.
        test_recipe:
          setup:
            - "ROUTINE WHEELCHAIR trip created 2026-08-01T00:00:00Z, accepted instantly"
            - "ARRIVE_PICKUP at exactly 2026-08-01T02:00:00Z (response == 120); PICKUP and COMPLETE at 02:10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: TransportSupervisor }
          trigger:
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:10:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { resp: $.data.response_minutes, post: $.data.sla_posture, st: $.data.status } }
            - { call: "GET /transport/requests/${r1}/delay-records", as: TransportDispatcher }
          assert:
            - "TransportRequest.${r1}.response_minutes == 120 (exactly the ROUTINE target)"
            - "TransportRequest.${r1}.sla_posture == AT_RISK (120 is not > 120; 120 >= floor(3*120/4) = 90)"
            - "TransportRequest.${r1}.status == COMPLETED"
            - "delay-records list is empty (length 0) — no SLA_BREACH at the exact boundary"

      - name: dwell_boundary_exact_15
        grounds:
          - state_machines.CleaningTask.IN_PROGRESS_to_AWAITING_VERIFICATION
        distinguishing_aspect: |
          Metric: DEEP-cleaning dwell minutes via the cleaning advance endpoint. Finishing at
          started_at + 14 minutes fails with ERR_DWELL_NOT_ELAPSED; at exactly +15 the inclusive
          >= boundary passes — a different metric and endpoint from the response-time boundary.
        test_recipe:
          setup:
            - "CONTACT-isolation WHEELCHAIR trip completed, DEEP task created and started (IN_PROGRESS) at 2026-08-01T00:05:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"], isolation_certified: true }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR", isolation_precaution: "CONTACT" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "COMPLETE" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/cleaning-tasks", payload: { equipment_asset_id: "${a1}" }, as: HousekeepingStaff, as_user_id: "hk-1", captures: { ct: "$.data[0].id" } }
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "IN_PROGRESS" }, as: HousekeepingStaff, as_user_id: "hk-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:05:00Z" }, as: TransportSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:19:00Z" }, as: TransportSupervisor }
          trigger:
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "AWAITING_VERIFICATION" }, as: HousekeepingStaff, as_user_id: "hk-1", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:20:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/cleaning-tasks/${ct}/advance", payload: { to_state: "AWAITING_VERIFICATION" }, as: HousekeepingStaff, as_user_id: "hk-1", captures: { ct_st: $.data.status } }
          assert:
            - "at started_at + 14 minutes: error_id == ERR_DWELL_NOT_ELAPSED"
            - "at started_at + 15 minutes exactly: advance succeeds, CleaningTask.${ct}.status == AWAITING_VERIFICATION"

  # ------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_requires_available_equipment
        grounds:
          - state_machines.TransportRequest.QUEUED_to_QUEUED
          - entities.EquipmentAsset.fields.status
        distinguishing_aspect: |
          Entity pair (TransportRequest, EquipmentAsset): an offer on a QUEUED WHEELCHAIR request
          is rejected with ERR_NO_AVAILABLE_EQUIPMENT while the only WHEELCHAIR asset is IN_USE on
          another trip — the request's valid transition depends on the asset's state.
        test_recipe:
          setup:
            - "One WHEELCHAIR asset WC-001, IN_USE on trip R1 (picked up); T1 drives R1, T2 idle ON_SHIFT"
            - "R2 QUEUED (WHEELCHAIR, same route)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T Two", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t2: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t2}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/transporters/${t2}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t2}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "ARRIVE_PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "PICKUP" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/requests", payload: { patient_ref: "P2", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r2: $.data.id, r2_v: $.data.version } }
          trigger:
            - { call: "POST /transport/requests/${r2}/offers", payload: { transporter_id: "${t2}", expected_request_version: "${r2_v}" }, as: TransportDispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_AVAILABLE_EQUIPMENT (asset WC-001 is IN_USE)"

      - name: clockin_requires_shift_coverage
        grounds:
          - state_machines.Transporter.OFF_SHIFT_to_ON_SHIFT
          - entities.StaffingShift.fields.status
        distinguishing_aspect: |
          Entity pair (Transporter, StaffingShift): clock-in is gated on a PLANNED shift covering
          the current clock — without one it fails ERR_NO_SHIFT_COVERAGE; after creating a
          covering shift the same call succeeds.
        test_recipe:
          setup:
            - "T3 registered, OFF_SHIFT, no shifts; clock at 2026-08-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T Three", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { t3: $.data.id } }
          trigger:
            - { call: "POST /transport/transporters/${t3}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t3}", captures: { err: $.data.error_id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t3}", shift_start: "2026-08-01T08:00:00Z", shift_end: "2026-08-01T16:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t3}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t3}", captures: { st: $.data.status } }
          assert:
            - "without covering shift: error_id == ERR_NO_SHIFT_COVERAGE"
            - "after creating covering PLANNED shift: status == ON_SHIFT"

  # ------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_halfopen_overlap_boundary
        grounds:
          - validations[priority=9]
          - entities.StaffingShift.fields.shift_start
        distinguishing_aspect: |
          Semantics: half-open intervals [start, end) on the Transporter resource — a new shift
          starting exactly at the existing shift's end (16:00 == 16:00) is allowed, while one
          starting 30 minutes before it ends conflicts with ERR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "T1 with PLANNED shift 2026-08-01T08:00:00Z-16:00:00Z; clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-08-01T08:00:00Z", shift_end: "2026-08-01T16:00:00Z" }, as: TransportSupervisor, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-08-01T16:00:00Z", shift_end: "2026-08-01T20:00:00Z" }, as: TransportSupervisor, captures: { s2: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-08-01T15:30:00Z", shift_end: "2026-08-01T17:00:00Z" }, as: TransportSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "adjacent shift [16:00,20:00) is created (half-open adjacency allowed), id ${s2} present"
            - "overlapping shift [15:30,17:00) fails: error_id == ERR_SHIFT_OVERLAP"

      - name: patient_min_separation_boundary
        grounds:
          - validations[priority=9]
          - entities.TransportRequest.fields.scheduled_pickup_time
        distinguishing_aspect: |
          Semantics: minimum-separation window on the patient resource — a second non-terminal
          request for the same patient_ref conflicts iff |t1 - t2| < 75 minutes STRICTLY; 40
          minutes apart fails ERR_PATIENT_SCHEDULE_CONFLICT, exactly 75 minutes apart succeeds —
          a different interval semantics (point separation, not interval intersection) on a
          different resource (patient bookings vs transporter shifts).
        test_recipe:
          setup:
            - "Locations W4, IMG, W5; clock 2026-08-01T00:00:00Z"
            - "R1: patient PX, W4->IMG, scheduled_pickup_time 2026-08-01T10:00:00Z (created OK)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W5", name: "Ward 5", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_c: $.data.id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "PX", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY", scheduled_pickup_time: "2026-08-01T10:00:00Z" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /transport/requests", payload: { patient_ref: "PX", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "PORTER_ONLY", scheduled_pickup_time: "2026-08-01T10:40:00Z" }, as: RequestingClinician, as_user_id: "clin-1", captures: { err: $.data.error_id } }
            - { call: "POST /transport/requests", payload: { patient_ref: "PX", origin_location_id: "${loc_a}", destination_location_id: "${loc_c}", priority: "ROUTINE", required_equipment: "PORTER_ONLY", scheduled_pickup_time: "2026-08-01T11:15:00Z" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r3: $.data.id } }
          assert:
            - "40 minutes apart: error_id == ERR_PATIENT_SCHEDULE_CONFLICT (40 < 75)"
            - "exactly 75 minutes apart: request created (id ${r3} present) — boundary is exclusive"

  # ------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: equipment_pool_conservation
        grounds:
          - state_machines.EquipmentAsset.AVAILABLE_to_RESERVED
          - state_machines.EquipmentAsset.RESERVED_to_AVAILABLE
          - state_machines.DispatchOffer.PENDING_to_DECLINED
        distinguishing_aspect: |
          Conserved quantity: count(EquipmentAsset with equipment_type == WHEELCHAIR AND status ==
          AVAILABLE). Offer-create + decline is a compensating pair: the pool reads 2 -> 1 -> 2,
          exactly restored, because the only transporter is excluded after declining so the
          auto-dispatch eval cannot re-reserve.
        test_recipe:
          setup:
            - "Two WHEELCHAIR assets WC-001 and WC-002 created at the same clock instant (tie-break asset_tag ASC selects WC-001)"
            - "T1 the only ON_SHIFT WHEELCHAIR transporter; R1 QUEUED WHEELCHAIR"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-002", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
          trigger:
            - { call: "GET /transport/equipment-assets", payload: { equipment_type: "WHEELCHAIR", status: "AVAILABLE" }, as: TransportDispatcher }
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "GET /transport/equipment-assets", payload: { equipment_type: "WHEELCHAIR", status: "AVAILABLE" }, as: TransportDispatcher }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "DECLINE" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/equipment-assets", payload: { equipment_type: "WHEELCHAIR", status: "AVAILABLE" }, as: TransportDispatcher }
            - { call: "GET /transport/equipment-assets/${a1}", as: TransportDispatcher, captures: { a1_st: $.data.status } }
          assert:
            - "pool before offer == 2; after offer == 1 (WC-001 reserved, asset_tag tie-break); after decline == 2 — invariant: AVAILABLE pool unchanged by create+decline pair"
            - "EquipmentAsset.${a1}.status == AVAILABLE after decline"
            - "TransportRequest.${r1}.decline_count == 1 and status == QUEUED (no auto-offer: sole transporter excluded)"

      - name: transporter_load_conservation
        grounds:
          - state_machines.TransportRequest.ASSIGNED_to_QUEUED
          - state_machines.TransportRequest.QUEUED_to_ASSIGNED
        distinguishing_aspect: |
          Conserved quantity: transporter concurrent active load — count(TransportRequest with
          assigned_transporter_id == T1 AND status IN {ASSIGNED, AT_PICKUP, IN_TRANSIT}). ACCEPT
          then RELEASE is a compensating pair: the load reads 0 -> 1 -> 0 and the request returns
          to QUEUED with assignment fields NULL.
        test_recipe:
          setup:
            - "T1 WHEELCHAIR ON_SHIFT; asset WC-001; R1 QUEUED WHEELCHAIR W4->IMG"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
            - { call: "POST /transport/locations", payload: { code: "IMG", name: "Imaging", location_type: "IMAGING", zone_code: "Z2" }, as: TransportSupervisor, captures: { loc_b: $.data.id } }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_h}", to_location_id: "${loc_a}", base_minutes: 8, airborne_minutes: 12 }, as: TransportSupervisor }
            - { call: "POST /transport/travel-edges", payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", base_minutes: 10, airborne_minutes: 16 }, as: TransportSupervisor }
            - { call: "POST /transport/transporters", payload: { name: "T One", home_location_id: "${loc_h}", certified_equipment: ["WHEELCHAIR"] }, as: TransportSupervisor, captures: { t1: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${t1}", shift_start: "2026-07-31T00:00:00Z", shift_end: "2026-09-01T00:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/transporters/${t1}/set-status", payload: { status: "ON_SHIFT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "POST /transport/equipment-assets", payload: { asset_tag: "WC-001", equipment_type: "WHEELCHAIR", current_location_id: "${loc_a}" }, as: TransportSupervisor }
            - { call: "POST /transport/requests", payload: { patient_ref: "P1", origin_location_id: "${loc_a}", destination_location_id: "${loc_b}", priority: "ROUTINE", required_equipment: "WHEELCHAIR" }, as: RequestingClinician, as_user_id: "clin-1", captures: { r1: $.data.id, r1_v: $.data.version } }
          trigger:
            - { call: "POST /transport/requests/${r1}/offers", payload: { transporter_id: "${t1}", expected_request_version: "${r1_v}" }, as: TransportDispatcher, captures: { o1: $.data.id } }
            - { call: "POST /transport/dispatch-offers/${o1}/respond", payload: { decision: "ACCEPT" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/requests", payload: { assigned_transporter_id: "${t1}", status: "ASSIGNED" }, as: TransportDispatcher }
            - { call: "POST /transport/requests/${r1}/trip-events", payload: { event: "RELEASE" }, as: Transporter, as_user_id: "${t1}" }
            - { call: "GET /transport/requests", payload: { assigned_transporter_id: "${t1}", status: "ASSIGNED" }, as: TransportDispatcher }
            - { call: "GET /transport/requests/${r1}", as: TransportDispatcher, captures: { st: $.data.status, at: $.data.assigned_transporter_id, rc: $.data.release_count } }
          assert:
            - "after ACCEPT: exactly 1 request with assigned_transporter_id == ${t1} and status ASSIGNED"
            - "after RELEASE: 0 such requests — invariant: T1 concurrent load unchanged by accept+release pair"
            - "TransportRequest.${r1}.status == QUEUED, assigned_transporter_id IS NULL, release_count == 1"
