scaffold_corner_design:

  # =========================================================================
  # Section 1 — Entities
  # =========================================================================
  - section: entities
    instances:

      - name: create_service_job_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.ServiceJob.fields.status, entities.ServiceJob.fields.priority]
        distinguishing_aspect: "POST /service-jobs with customer_id+category returns 201; status defaults RECEIVED, priority defaults STANDARD, version starts at 1."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust J", service_address: "1 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK" }
              as: Dispatcher
              captures: { st: $.data.status, pr: $.data.priority, v: $.data.version }
          assert:
            - "create response status code == 201"
            - "ServiceJob.status == RECEIVED"
            - "ServiceJob.priority == STANDARD"
            - "ServiceJob.version == 1"

      - name: create_service_job_missing_category_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.ServiceJob.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /service-jobs without the required category field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust J2", service_address: "2 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "create response status code == 400"
            - "create response data.error_id == ERR_INVALID_REQUEST"

      - name: create_service_job_bad_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.ServiceJob.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category='PLUMBING' is not in {LEAK,DRAIN,WATER_HEATER,REPIPE} → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust J3", service_address: "3 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "PLUMBING" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "create response status code == 400"
            - "create response data.error_id == ERR_INVALID_REQUEST"

      - name: get_service_job_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /service-jobs/{random-uuid} for an id that was never created → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB except the acting operator."]
          setup_api_calls: []
          trigger:
            - call: "GET /plumbing/service-jobs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "GET response status code == 404"
            - "GET response data.error_id == ERR_NOT_FOUND"

      - name: create_customer_omitting_credit_limit_applies_default
        claim_type: Defaults
        grounds: [entities.Customer.fields.credit_limit_cents]
        distinguishing_aspect: "POST /customers without credit_limit_cents applies default 100000; committed_credit_cents defaults 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust DEF", service_address: "4 A St" }
              as: OfficeManager
              captures: { cl: $.data.credit_limit_cents, cc: $.data.committed_credit_cents }
          assert:
            - "Customer.credit_limit_cents == 100000"
            - "Customer.committed_credit_cents == 0"

      - name: create_service_job_with_nonexistent_customer_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.ServiceJob.fields.customer_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /service-jobs whose customer_id FK does not resolve → ERR_NOT_FOUND (404) (flat-topology FK integrity)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "11111111-1111-4111-8111-111111111111", category: "LEAK" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "create response status code == 404"
            - "create response data.error_id == ERR_NOT_FOUND"

      - name: system_fields_generated_on_create_input_ignored
        claim_type: System Fields
        grounds: [entities.Technician.fields.status, entities.Technician.fields.lifetime_completed_count]
        distinguishing_aspect: "POST /technicians: id/created_at/version are server-minted; status defaults AVAILABLE and computed counters start at 0 regardless of input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech SYS", skill_level: 3 }
              as: OfficeManager
              captures: { st: $.data.status, lc: $.data.lifetime_completed_count, v: $.data.version }
          assert:
            - "Technician.status == AVAILABLE"
            - "Technician.lifetime_completed_count == 0"
            - "Technician.version == 1"

      - name: list_service_jobs_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /service-jobs?customer_id=&limit=1 returns a paginated array with total_count and has_more in the meta/pagination fields."
        test_recipe:
          setup: ["One customer with two jobs."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust LS", service_address: "5 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK" }
              as: Dispatcher
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "DRAIN" }
              as: Dispatcher
          trigger:
            - call: "GET /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", limit: 1, offset: 0 }
              as: Dispatcher
          assert:
            - "list response total_count == 2"
            - "list response has_more == true"
            - "list response data array length == 1"

  # =========================================================================
  # Section 2 — State Machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: confirm_already_confirmed_assignment_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.DispatchAssignment.PROPOSED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-confirming a CONFIRMED assignment (already past PROPOSED) returns ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["An assignment was confirmed."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust IC", service_address: "6 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech IC", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T10:00:00.000Z", window_end: "2026-06-15T12:00:00.000Z", eta: "2026-06-15T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "second confirm response status code == 409"
            - "second confirm response data.error_id == ERR_INVALID_STATE"
            - "DispatchAssignment.${asg_id}.status == CONFIRMED"

      - name: cancel_already_cancelled_job_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceJob.RECEIVED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED job is terminal; a second cancel returns ERR_INVALID_STATE with no further side effects."
        test_recipe:
          setup: ["A RECEIVED job was cancelled."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust TL", service_address: "7 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK" }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /plumbing/service-jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /plumbing/service-jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "second cancel response status code == 409"
            - "second cancel response data.error_id == ERR_INVALID_STATE"
            - "ServiceJob.${job_id}.status == CANCELLED"

      - name: initial_state_of_new_estimate_is_draft
        claim_type: Initial State
        grounds: [state_machines.Estimate.initial_state, entities.Estimate.fields.status]
        distinguishing_aspect: "A newly created Estimate starts in DRAFT with zeroed computed totals."
        test_recipe:
          setup: ["A job is ON_SITE."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust IS", service_address: "8 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech IS", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T10:00:00.000Z", window_end: "2026-06-15T12:00:00.000Z", eta: "2026-06-15T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
          trigger:
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st: $.data.status, total: $.data.estimate_total_cents }
          assert:
            - "Estimate.status == DRAFT"
            - "Estimate.estimate_total_cents == 0"

      - name: permit_reapply_cycle_failed_to_issued_increments_count
        claim_type: cyclic
        grounds: [state_machines.Permit.FAILED_to_ISSUED, entities.Permit.fields.reapply_count]
        distinguishing_aspect: "After an inspection FAILED, re-issuing the permit (FAILED->ISSUED) increments reapply_count from 0 to 1."
        test_recipe:
          setup: ["A permit-requiring job approved; permit issued; inspection scheduled then recorded FAILED."]
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-06-15T08:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/inspectors"
              payload: { name: "Insp RC", jurisdiction: "CITY03", max_daily_inspections: 4 }
              as: OfficeManager
              captures: { insp_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "RC-PMT", category: "WATER_HEATER", base_price_cents: 40000, skill_required: 2, requires_permit: true }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust RC", service_address: "9 CITY03 St", credit_limit_cents: 1000000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech RC", skill_level: 3, licensed_for_permits: true }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "WATER_HEATER" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T10:00:00.000Z", window_end: "2026-06-15T12:00:00.000Z", eta: "2026-06-15T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /plumbing/service-jobs/${job_id}/permits"
              payload: {}
              as: OfficeManager
              captures: { permit_id: "$.data[0].id" }
            - call: "POST /plumbing/permits/${permit_id}/issue"
              payload: {}
              as: OfficeManager
            - call: "POST /plumbing/permits/${permit_id}/inspections"
              payload: { inspector_id: "${insp_id}", scheduled_date: "2026-06-16" }
              as: OfficeManager
              captures: { insp_visit_id: $.data.id }
            - call: "POST /plumbing/inspections/${insp_visit_id}/record"
              payload: { result: "FAILED" }
              as: OfficeManager
          trigger:
            - call: "POST /plumbing/permits/${permit_id}/issue"
              payload: {}
              as: OfficeManager
              captures: { rc: $.data.reapply_count, st: $.data.status }
          assert:
            - "Permit.${permit_id}.status == ISSUED"
            - "Permit.${permit_id}.reapply_count == 1"

      - name: cancel_job_cascades_assignment_cancel_conditional
        claim_type: Conditional cascade
        grounds: [state_machines.ServiceJob.AUTHORIZED_to_CANCELLED, state_machines.DispatchAssignment.CONFIRMED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a job with a CONFIRMED assignment cascades the assignment to CANCELLED; the cascade only touches non-terminal assignments."
        test_recipe:
          setup: ["A job has a CONFIRMED assignment (DISPATCHED job)."]
          setup_api_calls:
            - call: "POST /plumbing/customers"
              payload: { name: "Cust CC", service_address: "10 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech CC", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T10:00:00.000Z", window_end: "2026-06-15T12:00:00.000Z", eta: "2026-06-15T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /plumbing/service-jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
            - call: "GET /plumbing/dispatch-assignments/${asg_id}"
              payload: {}
              as: Dispatcher
              captures: { asg_status: $.data.status }
          assert:
            - "ServiceJob.${job_id}.status == CANCELLED"
            - "DispatchAssignment.${asg_id}.status == CANCELLED"

      - name: complete_job_reopen_cycle_already_covered
        claim_type: Valid Transition
        grounds: [state_machines.ServiceJob.COMPLETED_to_REOPENED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / service_job_reopen_cycle_completed_to_reopened_to_completed
          rationale: "The COMPLETED->REOPENED->IN_PROGRESS->COMPLETED cycle is asserted end-to-end by the named §1.8 instance."

  # =========================================================================
  # Section 3 — Calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: emergency_surcharge_applied_for_emergency_priority
        claim_type: Constants Applied
        grounds: [calculations.estimate_provisional_total, entities.Estimate.fields.emergency_surcharge_cents]
        distinguishing_aspect: "A STANDARD-hours, no-plan EMERGENCY job with one base-30000 line gets EMERGENCY_SURCHARGE_CENTS=12000 added: labor 30000 + trip 0 (labor_after>=50000? no→ but >=threshold? 30000<50000 so trip 8900) — total 30000+8900+12000=50900."
        test_recipe:
          setup: ["Plan NONE; flat-rate item base 30000; EMERGENCY job, normal hours, on site; estimate one FLAT_RATE line."]
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-06-16T10:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "EM-1", category: "LEAK", base_price_cents: 30000, skill_required: 1 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust EM", service_address: "11 A St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech EM", skill_level: 2 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK", priority: "EMERGENCY" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-16T10:00:00.000Z", window_end: "2026-06-16T12:00:00.000Z", eta: "2026-06-16T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { em: $.data.emergency_surcharge_cents, total: $.data.estimate_total_cents }
          assert:
            - "Estimate.${est_id}.emergency_surcharge_cents == 12000"
            - "Estimate.${est_id}.trip_fee_cents == 8900"
            - "Estimate.${est_id}.estimate_total_cents == 50900"

      - name: membership_discount_capped_at_max
        claim_type: Correct Result
        grounds: [calculations.estimate_provisional_total, entities.Estimate.fields.discount_cents]
        distinguishing_aspect: "GOLD 0.20 on labor 100000 would be 20000 but is capped at MAX_DISCOUNT_CENTS=15000; labor_after 85000, trip waived (GOLD), total 85000."
        test_recipe:
          setup: ["Plan GOLD 0.20 waives_trip_fee true; flat-rate item base 100000; customer GOLD; normal hours; estimate one FLAT_RATE line."]
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-06-16T10:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/membership-plans"
              payload: { tier_code: "GOLD", name: "Gold", labor_discount_pct: 0.20, waives_trip_fee: true, annual_fee_cents: 24000 }
              as: OfficeManager
              captures: { plan_gold_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "CAP-1", category: "REPIPE", base_price_cents: 100000, skill_required: 2 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/customers"
