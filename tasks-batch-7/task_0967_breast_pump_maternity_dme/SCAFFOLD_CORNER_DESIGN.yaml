  # ================================================================ Endpoints
  - section: endpoints
    instances:
      - name: pump_order_list_filter_and_pagination
        claim_type: standard_crud
        grounds: [entities.PumpOrder, response_envelope]
        distinguishing_aspect: "Filtered list: two orders for one member paginate with limit 1 (has_more true), and fulfillment_status filter narrows results."
        test_recipe:
          setup: ["one member with two PENDING_QUALIFICATION orders (two verified prescriptions)"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Lp Mem", email: "lp@x.com", date_of_birth: "1990-01-01", shipping_address: "16 V St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", pump_allowance_per_period: 2 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx1: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-16", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx2: $.data.id }
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx1}", pump_item_id: "${pump_id}", shipping_address: "16 V St" }
              as: CareCoordinator
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx2}", pump_item_id: "${pump_id}", shipping_address: "16 V St" }
              as: CareCoordinator
          trigger:
            - call: "GET /dme/pump-orders"
              payload: { member_id: "${m_id}", limit: 1, offset: 0 }
              as: CareCoordinator
          assert:
            - "total_count == 2 and has_more == true and data length == 1"
            - "GET /dme/pump-orders?member_id=${m_id}&fulfillment_status=SHIPPED returns total_count == 0"
            - "GET /dme/pump-orders?member_id=${m_id}&prescription_id=${rx1} returns total_count == 1"

      - name: shipment_without_order_fk_returns_invalid_request
        claim_type: violation_to_error
        grounds: [entities.Shipment.fields.pump_order_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Exactly one polymorphic FK is required: neither pump_order_id nor resupply_order_id set fails with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /dme/shipments"
              payload: { carrier: "UPS", tracking_number: "1Z-NONE" }
              as: WarehouseOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and http status == 400"

