        grounds: ["errors[ERR_PICKUP_EXPIRED]", "state_machines.Order.READY_FOR_PICKUP_to_PICKED_UP"]
        distinguishing_aspect: "Without a run-ops sweep the order remains READY_FOR_PICKUP past expires_at; a late pickup attempt rejects with ERR_PICKUP_EXPIRED."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED fee 0; variant M stocked 25; clock 2026-09-05T12:00:00Z; ONLINE CARD order marked READY_FOR_PICKUP (expires 2026-09-12T12:00:00Z); clock advanced to 2026-09-13T00:00:00Z; no run-ops"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
