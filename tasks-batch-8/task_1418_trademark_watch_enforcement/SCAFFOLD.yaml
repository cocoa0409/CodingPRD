# =============================================================================
# PRD Benchmark Scaffold — Trademark Watch & Enforcement (brand protection counsel)
# =============================================================================

scenario: |
  Trademark Watch & Enforcement (brand protection counsel): watch service alert intake & likelihood-of-confusion assessment, opposition/cancellation deadline docketing, cease-and-desist issuance & response tracking, online marketplace & domain takedown filing, coexistence agreement negotiation & monitoring, use evidence collection for maintenance filings, portfolio clearance for new brands, counterfeiting referral & customs recordation

domain_name: trademark-watch-enforcement
api_prefix: /brand

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat          # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: cyclic    # negotiation rounds, re-assessment loops, maintenance cycles
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # drafter != approver, docketed_by != verified_by, collector != verifier
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand owner legal name" }
      - { name: industry, type: string, source: input, description: "Industry vertical" }
      - { name: enforcement_budget_cents, type: integer, source: input, description: "Total enforcement budget in cents; immutable after creation" }
      - { name: budget_spent_cents, type: integer, source: computed, description: "Fees accrued by issued cease-and-desist letters and filed takedown filings", default: 0 }
      - { name: budget_remaining_cents, type: integer, source: computed, description: "= enforcement_budget_cents - budget_spent_cents" }
      - { name: exposure_index, type: number, source: computed, description: "Weighted sum over ACTIVE enforcement matters (see portfolio_exposure_index)", default: 0 }
      - { name: watch_posture, type: enum, source: computed, description: "STANDARD | ELEVATED — ELEVATED iff exposure_index >= 100", default: "STANDARD" }

  - name: TrademarkRecord
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning brand owner" }
      - { name: mark_text, type: string, source: input, description: "The mark text or design label" }
      - { name: mark_type, type: enum, source: input, description: "WORD | DESIGN | COMPOSITE" }
      - { name: jurisdiction, type: string, source: input, description: "Two-letter jurisdiction code, e.g. US, EU, CN" }
      - { name: nice_classes, type: array, source: input, description: "Array of Nice classification integers, each 1..45; at least one" }
      - { name: application_number, type: string, source: input, description: "Office application serial number" }
      - { name: status, type: enum, source: system, description: "APPLICATION_PENDING | PUBLISHED | REGISTERED | UNDER_CHALLENGE | MAINTENANCE_DUE | CANCELLED" }
      - { name: publication_date, type: datetime, source: system, description: "Set by the publish transition" }
      - { name: registration_date, type: datetime, source: system, description: "Set by the register transition" }
      - { name: opposition_due_at, type: datetime, source: computed, description: "publication_date + 30 calendar days, rolled forward over weekends (CALENDAR_ROLL_FORWARD)" }
      - { name: verified_evidence_count, type: integer, source: computed, description: "Count of UseEvidenceItem with trademark_record_id == this AND status == VERIFIED", default: 0 }
      - { name: maintenance_window_open, type: datetime, source: computed, description: "registration_date + 5 years" }
      - { name: maintenance_window_close, type: datetime, source: computed, description: "registration_date + 6 years" }
      - { name: maintenance_grace_close, type: datetime, source: computed, description: "maintenance_window_close + 6 months" }

  - name: WatchAlert
    parent: null
    common_fields: true
    fields:
      - { name: trademark_record_id, type: string, source: input, description: "FK -> TrademarkRecord.id; the watched portfolio mark" }
      - { name: source, type: enum, source: input, description: "WATCH_SERVICE | MANUAL | MARKETPLACE_SWEEP" }
      - { name: conflicting_mark_text, type: string, source: input, description: "Incoming third-party mark text" }
      - { name: conflicting_owner, type: string, source: input, description: "Third-party owner name" }
      - { name: conflicting_classes, type: array, source: input, description: "Nice classes of the conflicting mark" }
      - { name: similarity_mark, type: integer, source: input, description: "Watch-service mark similarity 0..100", constraints: "0 <= v <= 100" }
      - { name: similarity_goods, type: integer, source: input, description: "Goods/services overlap 0..100", constraints: "0 <= v <= 100" }
      - { name: similarity_channels, type: integer, source: input, description: "Trade-channel overlap 0..100", constraints: "0 <= v <= 100" }
      - { name: provisional_score, type: number, source: computed, description: "Fixed-weight confusion score computed at intake (see confusion_score provisional variant)" }
      - { name: provisional_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH from provisional_score" }
      - { name: final_score, type: number, source: computed, description: "Attorney-weighted confusion score from latest assessment; null until first assess" }
      - { name: final_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH from final_score; null until first assess" }
      - { name: assessment_round, type: integer, source: computed, description: "Number of assessments recorded; 0 at intake, +1 per assess", default: 0 }
      - { name: escalation_level, type: enum, source: system, description: "STANDARD | URGENT; set URGENT by the deadline-jeopardy cascade", default: "STANDARD" }
      - { name: confirmed_counterfeit_count, type: integer, source: computed, description: "= count of TakedownFiling with watch_alert_id == this AND basis == COUNTERFEIT AND status == REMOVED", default: 0 }
      - { name: referral_auto_created, type: boolean, source: system, description: "True once the threshold cascade has auto-created a CounterfeitReferral for this alert", default: false }
      - { name: status, type: enum, source: system, description: "NEW | TRIAGED | UNDER_ASSESSMENT | MONITORING | ESCALATED | DISMISSED" }

  - name: EnforcementMatter
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from the alert's record" }
      - { name: trademark_record_id, type: string, source: system, description: "FK -> TrademarkRecord.id; copied from the alert" }
      - { name: watch_alert_id, type: string, source: system, description: "FK -> WatchAlert.id; originating alert" }
      - { name: matter_type, type: enum, source: system, description: "OPPOSITION | CANCELLATION | INFRINGEMENT | COUNTERFEIT (from escalate input)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESOLVED (RESOLVED is reopenable; no hard terminal state)" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | JEOPARDY — JEOPARDY iff any linked Deadline has status == MISSED", default: "NORMAL" }
      - { name: resolution_outcome, type: enum, source: system, description: "FAVORABLE | ADVERSE | SETTLED; null while ACTIVE; cleared to null on reopen" }
      - { name: accrued_fees_cents, type: integer, source: computed, description: "Sum of letter issue/reissue fees accrued to this matter (not reversed unless letter voided)", default: 0 }
      - { name: open_deadline_count, type: integer, source: computed, description: "Count of linked Deadline with status IN {DOCKETED, PENDING, EXTENDED}", default: 0 }

  - name: Deadline
    parent: null
    common_fields: true
    fields:
      - { name: enforcement_matter_id, type: string, source: system, description: "FK -> EnforcementMatter.id; from the docket path" }
      - { name: deadline_type, type: enum, source: input, description: "OPPOSITION_WINDOW | RESPONSE_DUE | OFFICE_ACTION | RENEWAL | CUSTOM" }
      - { name: statutory_basis, type: string, source: input, description: "Free-text citation, e.g. '15 USC 1063'" }
      - { name: basis_date, type: datetime, source: input, description: "Anchor date the offset counts from" }
      - { name: offset_days, type: integer, source: input, description: "Positive day count; interpreted per computation_variant", constraints: "> 0" }
      - { name: computation_variant, type: enum, source: system, description: "CALENDAR_ROLL_FORWARD for OPPOSITION_WINDOW/RENEWAL; BUSINESS_DAY_COUNT for RESPONSE_DUE/OFFICE_ACTION/CUSTOM" }
      - { name: computed_due_at, type: datetime, source: computed, description: "Due instant per deadline_due_at calculation" }
      - { name: extension_count, type: integer, source: system, description: "Extensions granted", default: 0 }
      - { name: max_extensions, type: integer, source: input, description: "Cap on extensions", default: 3 }
      - { name: docketed_by_user_id, type: string, source: system, description: "X-User-ID of the docketing caller; 'system' when auto-docketed" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifying attorney; null until verified" }
      - { name: satisfied_at, type: datetime, source: system, description: "Set on satisfy" }
      - { name: satisfied_late, type: boolean, source: system, description: "false when satisfied at or before computed_due_at; true on late satisfaction from MISSED" }
      - { name: requires_partner_review, type: boolean, source: computed, description: "Set true on sibling non-terminal deadlines when any deadline of the matter flips MISSED", default: false }
      - { name: status, type: enum, source: system, description: "DOCKETED | PENDING | EXTENDED | SATISFIED | MISSED" }

  - name: CeaseDesistLetter
    parent: null
    common_fields: true
    fields:
      - { name: enforcement_matter_id, type: string, source: system, description: "FK -> EnforcementMatter.id; from the draft path" }
      - { name: demand_type, type: enum, source: input, description: "CEASE_USE | CANCEL_REGISTRATION | DELIST_MARKETPLACE" }
      - { name: recipient_name, type: string, source: input, description: "Recipient legal name" }
      - { name: recipient_address, type: string, source: input, description: "Recipient service address" }
      - { name: response_due_days, type: integer, source: input, description: "Business days allowed for response", default: 14 }
      - { name: settlement_amount_cents, type: integer, source: input, description: "Optional agreed settlement, set at draft; schedule computed on COMPLIED" }
      - { name: installment_count, type: integer, source: input, description: "Number of settlement installments", default: 1 }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of drafter" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving partner; null until approved" }
      - { name: issued_at, type: datetime, source: system, description: "Set on each issue/reissue" }
      - { name: response_due_at, type: datetime, source: computed, description: "issued_at + response_due_days business days (BUSINESS_DAY_COUNT)" }
      - { name: reissue_count, type: integer, source: system, description: "Number of reissues (manual or breach cascade)", default: 0 }
      - { name: installment_schedule, type: array, source: computed, description: "Per-installment cents computed on COMPLIED with a settlement (see settlement_installments)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | APPROVED | ISSUED | NEGOTIATING | COMPLIED | REFUSED | ESCALATED_LITIGATION | VOID" }

  - name: TakedownFiling
    parent: null
    common_fields: true
    fields:
      - { name: watch_alert_id, type: string, source: system, description: "FK -> WatchAlert.id; from the create path" }
      - { name: platform, type: enum, source: input, description: "AMAZON | EBAY | ALIBABA | META | DOMAIN_REGISTRAR" }
      - { name: listing_url, type: string, source: input, description: "Infringing listing or domain URL" }
      - { name: basis, type: enum, source: input, description: "TRADEMARK | COUNTERFEIT" }
      - { name: fee_cents, type: integer, source: computed, description: "Platform filing fee per PLATFORM_FEE_CENTS" }
      - { name: appeal_count, type: integer, source: system, description: "Appeals filed; cap 2", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | REJECTED | APPEALED | REMOVED | REINSTATED" }

  - name: CoexistenceAgreement
    parent: null
    common_fields: true
    fields:
      - { name: trademark_record_id, type: string, source: system, description: "FK -> TrademarkRecord.id; from the create path" }
      - { name: enforcement_matter_id, type: string, source: input, description: "FK -> EnforcementMatter.id; optional settling matter reopened on breach" }
      - { name: counterparty_name, type: string, source: input, description: "Counterparty legal name" }
      - { name: territory_codes, type: array, source: input, description: "ISO territory codes the agreement covers" }
      - { name: effective_start, type: datetime, source: input, description: "Term start (half-open interval lower bound, inclusive)" }
      - { name: effective_end, type: datetime, source: input, description: "Term end (half-open interval upper bound, exclusive)" }
      - { name: cure_period_days, type: integer, source: input, description: "Days granted to cure an alleged breach", default: 30 }
      - { name: round_count, type: integer, source: system, description: "Negotiation rounds consumed; +1 per propose and per counter; cap 8", default: 0 }
      - { name: current_terms_text, type: string, source: system, description: "Latest proposed or countered terms" }
      - { name: breach_claimed_at, type: datetime, source: system, description: "Set on breach" }
      - { name: cure_deadline, type: datetime, source: computed, description: "breach_claimed_at + cure_period_days calendar days; set on grant-cure, cleared on cure confirm" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | COUNTERED | EXECUTED | MONITORING | BREACH_ALLEGED | CURE_PERIOD | TERMINATED | EXPIRED" }

  - name: UseEvidenceItem
    parent: null
    common_fields: true
    fields:
      - { name: trademark_record_id, type: string, source: system, description: "FK -> TrademarkRecord.id; from the create path" }
      - { name: nice_class, type: integer, source: input, description: "Nice class this specimen supports; must be in the record's nice_classes", constraints: "1..45" }
      - { name: specimen_type, type: enum, source: input, description: "LABEL | SCREENSHOT | PACKAGING | ADVERTISING" }
      - { name: specimen_date, type: datetime, source: input, description: "Date the specimen evidences use" }
      - { name: collected_by_user_id, type: string, source: system, description: "X-User-ID of collector" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying attorney; null until verified" }
      - { name: status, type: enum, source: system, description: "COLLECTED | VERIFIED | REJECTED" }

  - name: MaintenanceFiling
    parent: null
    common_fields: true
    fields:
      - { name: trademark_record_id, type: string, source: system, description: "FK -> TrademarkRecord.id; from the create path" }
      - { name: filing_type, type: enum, source: input, description: "SECTION_8 | RENEWAL" }
      - { name: evidence_item_ids, type: array, source: input, description: "UseEvidenceItem ids relied on; every record nice_class must be covered by at least one VERIFIED item" }
      - { name: fee_base_cents, type: integer, source: computed, description: "classes_count x PER_CLASS_FEE_CENTS" }
      - { name: fee_surcharge_cents, type: integer, source: computed, description: "Band surcharge on fee_base_cents (see maintenance_filing_fee)" }
      - { name: late_fee_cents, type: integer, source: computed, description: "classes_count x LATE_PER_CLASS_CENTS when filed in the grace window; else 0" }
      - { name: fee_total_cents, type: integer, source: computed, description: "= fee_base_cents + fee_surcharge_cents + late_fee_cents" }
      - { name: is_late, type: boolean, source: computed, description: "True when submitted in the grace window (LATE_FILED)", default: false }
      - { name: status, type: enum, source: system, description: "PREPARED | SUBMITTED | LATE_FILED | ACCEPTED | REJECTED_OFFICE" }

  - name: ClearanceSearch
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; sponsoring client" }
      - { name: proposed_mark, type: string, source: input, description: "Candidate new mark" }
      - { name: proposed_classes, type: array, source: input, description: "Candidate Nice classes" }
      - { name: conflict_hits, type: array, source: computed, description: "Array of {conflicting_mark, severity: LOW|MEDIUM|HIGH|IDENTICAL, disposition: OPEN|WAIVED|BLOCKING}; mutated only via conflict-hits and dispose-hit endpoints; hit_index is the 0-based position" }
      - { name: unresolved_hit_count, type: integer, source: computed, description: "Count of conflict_hits with disposition == OPEN", default: 0 }
      - { name: risk_rating, type: enum, source: computed, description: "Max severity among non-WAIVED hits mapped IDENTICAL->HIGH; none -> LOW" }
      - { name: status, type: enum, source: system, description: "OPEN | CLEARED | BLOCKED" }

  - name: CustomsRecordation
    parent: null
    common_fields: true
    fields:
      - { name: trademark_record_id, type: string, source: system, description: "FK -> TrademarkRecord.id; from the create path" }
      - { name: customs_authority, type: enum, source: input, description: "US_CBP | EU_TAXUD | CN_GACC" }
      - { name: recordation_number, type: string, source: input, description: "Authority-issued recordation number" }
      - { name: term_start, type: datetime, source: input, description: "Recordation term start" }
      - { name: term_end, type: datetime, source: input, description: "Recordation term end" }
      - { name: supersedes_recordation_id, type: string, source: input, description: "FK -> CustomsRecordation.id; optional renewal target that flips to RENEWED and waives the buffer-gap rule" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | RENEWED | REVOKED" }

  - name: CounterfeitReferral
    parent: null
    common_fields: true
    fields:
      - { name: watch_alert_id, type: string, source: system, description: "FK -> WatchAlert.id; from the create path or the threshold cascade" }
      - { name: enforcement_matter_id, type: string, source: system, description: "FK -> EnforcementMatter.id; copied from the alert's ACTIVE matter when the alert is ESCALATED, else null" }
      - { name: referral_channel, type: enum, source: input, description: "LAW_ENFORCEMENT | CUSTOMS_SEIZE | PLATFORM_ESCROW" }
      - { name: seizure_lines, type: array, source: input, description: "Array of {units: integer > 0, unit_value_cents: integer > 0}" }
      - { name: estimated_damages_cents, type: integer, source: computed, description: "Per-line rounded statutory damages sum (see counterfeit_damages)" }
      - { name: auto_created, type: boolean, source: system, description: "True when created by the confirmed-counterfeit threshold cascade", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | REFERRED | ACKNOWLEDGED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TrademarkRecord
    initial_state: APPLICATION_PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: APPLICATION_PENDING
        to: PUBLISHED
        trigger: "POST /brand/trademark-records/{id}/publish"
        actor: Paralegal
        preconditions: []
        side_effects:
          - "publication_date := payload.publication_date"
          - "opposition_due_at := publication_date + 30 calendar days, rolled forward past Saturday/Sunday (CALENDAR_ROLL_FORWARD)"
      - from: PUBLISHED
        to: REGISTERED
        trigger: "POST /brand/trademark-records/{id}/register"
        actor: Paralegal
        preconditions: []
        side_effects:
          - "registration_date := payload.registration_date"
          - "maintenance_window_open := registration_date + 5 years; maintenance_window_close := + 6 years; maintenance_grace_close := window_close + 6 months"
      - from: PUBLISHED
        to: UNDER_CHALLENGE
        trigger: "system — cascade of WatchAlert escalate with matter_type == OPPOSITION"
        actor: system
        preconditions: []
        side_effects: []
      - from: REGISTERED
        to: UNDER_CHALLENGE
        trigger: "system — cascade of WatchAlert escalate with matter_type == CANCELLATION"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_CHALLENGE
        to: PUBLISHED
        trigger: "system — cascade of matter resolve outcome FAVORABLE or SETTLED on an OPPOSITION matter"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_CHALLENGE
        to: REGISTERED
        trigger: "system — cascade of matter resolve outcome FAVORABLE or SETTLED on a CANCELLATION matter"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_CHALLENGE
        to: CANCELLED
        trigger: "system — cascade of matter resolve outcome ADVERSE on an OPPOSITION or CANCELLATION matter"
        actor: system
        preconditions: []
        side_effects:
          - "Every WatchAlert of this record in ESCALATED -> DISMISSED (mooted)"
          - "Every CustomsRecordation of this record in ACTIVE -> REVOKED"
          - "Every CoexistenceAgreement of this record in {EXECUTED, MONITORING, BREACH_ALLEGED, CURE_PERIOD} -> TERMINATED"
      - from: REGISTERED
        to: MAINTENANCE_DUE
        trigger: "system — clock sweep when current_utc >= maintenance_window_open"
        actor: system
        preconditions: []
        side_effects: []
      - from: MAINTENANCE_DUE
        to: REGISTERED
        trigger: "system — cascade of a MaintenanceFiling of this record reaching ACCEPTED"
        actor: system
        preconditions: []
        side_effects:
          - "maintenance_window_open += 10 years; maintenance_window_close += 10 years; maintenance_grace_close += 10 years"
      - from: MAINTENANCE_DUE
        to: CANCELLED
        trigger: "system — clock sweep when current_utc > maintenance_grace_close and no filing of this record is in {SUBMITTED, LATE_FILED, ACCEPTED}"
        actor: system
        preconditions: []
        side_effects:
          - "Same moot cascade as UNDER_CHALLENGE -> CANCELLED"

  - entity: WatchAlert
    initial_state: NEW
    terminal_states: [DISMISSED]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /brand/watch-alerts/{id}/triage"
        actor: Paralegal
        preconditions: []
        side_effects: []
      - from: TRIAGED
        to: UNDER_ASSESSMENT
        trigger: "POST /brand/watch-alerts/{id}/assess"
        actor: AssociateAttorney
        preconditions: ["expected_watch_alert_version matches alert.version (OCC)"]
        side_effects:
          - "assessment_round += 1; final_score/final_tier recomputed from assessed variant; increments WatchAlert.version by 1"
      - from: UNDER_ASSESSMENT
        to: UNDER_ASSESSMENT
        trigger: "POST /brand/watch-alerts/{id}/assess"
        actor: AssociateAttorney
        preconditions: ["expected_watch_alert_version matches alert.version (OCC)"]
        side_effects:
          - "Supersede: assessment_round += 1; final_score/final_tier recomputed; increments WatchAlert.version by 1"
      - from: MONITORING
        to: UNDER_ASSESSMENT
        trigger: "POST /brand/watch-alerts/{id}/assess"
        actor: AssociateAttorney
        preconditions: ["expected_watch_alert_version matches alert.version (OCC)"]
        side_effects:
          - "Re-assessment loop: assessment_round += 1; final_score/final_tier recomputed; increments WatchAlert.version by 1"
      - from: UNDER_ASSESSMENT
        to: ESCALATED
        trigger: "POST /brand/watch-alerts/{id}/escalate"
        actor: AssociateAttorney
        preconditions:
          - "final_score >= 70 (ERR_SCORE_BELOW_THRESHOLD)"
          - "matter_type == OPPOSITION requires record.status == PUBLISHED and current_utc <= record.opposition_due_at (ERR_OPPOSITION_WINDOW_CLOSED; ERR_INVALID_STATE if not PUBLISHED)"
          - "matter_type == CANCELLATION requires record.status == REGISTERED (ERR_INVALID_STATE)"
          - "matter_type IN {INFRINGEMENT, COUNTERFEIT} requires record.status != CANCELLED (ERR_INVALID_STATE)"
        side_effects:
          - "Create EnforcementMatter(status ACTIVE, fields copied from alert) — response body is the created matter"
          - "matter_type OPPOSITION: record PUBLISHED -> UNDER_CHALLENGE; matter_type CANCELLATION: record REGISTERED -> UNDER_CHALLENGE"
          - "Client.exposure_index and watch_posture recomputed"
      - from: UNDER_ASSESSMENT
        to: MONITORING
        trigger: "POST /brand/watch-alerts/{id}/monitor"
        actor: AssociateAttorney
        preconditions: ["40 <= final_score < 70 (ERR_INVALID_STATE otherwise)"]
        side_effects: []
      - from: UNDER_ASSESSMENT
        to: DISMISSED
        trigger: "POST /brand/watch-alerts/{id}/dismiss"
        actor: AssociateAttorney
        preconditions: ["final_score < 40 (ERR_SCORE_ABOVE_DISMISS_CAP otherwise)"]
        side_effects: []
      - from: ESCALATED
        to: DISMISSED
        trigger: "system — moot cascade when the linked TrademarkRecord flips to CANCELLED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EnforcementMatter
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESOLVED
        trigger: "POST /brand/enforcement-matters/{id}/resolve"
        actor: PartnerAttorney
        preconditions: ["open_deadline_count == 0 (ERR_PENDING_DEADLINES)"]
        side_effects:
          - "resolution_outcome := payload.outcome"
          - "outcome ADVERSE and matter_type IN {OPPOSITION, CANCELLATION}: record UNDER_CHALLENGE -> CANCELLED (which cascades to alerts, recordations, agreements)"
          - "outcome FAVORABLE or SETTLED and matter_type == OPPOSITION: record UNDER_CHALLENGE -> PUBLISHED; matter_type == CANCELLATION: record UNDER_CHALLENGE -> REGISTERED"
          - "Client.exposure_index and watch_posture recomputed"
      - from: RESOLVED
        to: ACTIVE
        trigger: "POST /brand/enforcement-matters/{id}/reopen OR system cascade of CoexistenceAgreement breach"
        actor: PartnerAttorney
        preconditions: []
        side_effects:
          - "resolution_outcome := null"
          - "Every CeaseDesistLetter of this matter in COMPLIED -> ISSUED: reissue_count += 1, issued_at := now, response_due_at recomputed, REISSUE_FEE_CENTS accrued (budget check bypassed for the cascade)"
          - "For each reissued letter, auto-docket a Deadline(deadline_type RESPONSE_DUE, basis_date := now, offset_days := letter.response_due_days, status DOCKETED, docketed_by_user_id 'system')"
          - "Client.exposure_index and watch_posture recomputed"

  - entity: Deadline
    initial_state: DOCKETED
    terminal_states: [SATISFIED]
    transitions:
      - from: DOCKETED
        to: PENDING
        trigger: "POST /brand/deadlines/{id}/verify"
        actor: AssociateAttorney
        preconditions: ["X-User-ID != docketed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["verified_by_user_id := X-User-ID"]
      - from: PENDING
        to: EXTENDED
        trigger: "POST /brand/deadlines/{id}/extend"
        actor: Paralegal
        preconditions: ["extension_count < max_extensions (ERR_EXTENSION_CAP_REACHED)"]
        side_effects:
          - "computed_due_at := deadline_due_at(variant, basis := old computed_due_at, offset := additional_days); extension_count += 1"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /brand/deadlines/{id}/extend"
        actor: Paralegal
        preconditions: ["extension_count < max_extensions (ERR_EXTENSION_CAP_REACHED)"]
        side_effects:
          - "computed_due_at recomputed as above; extension_count += 1"
      - from: PENDING
        to: SATISFIED
        trigger: "POST /brand/deadlines/{id}/satisfy"
        actor: Paralegal
        preconditions: ["current_utc <= computed_due_at (guaranteed by the MISSED clock sweep)"]
        side_effects: ["satisfied_at := now; satisfied_late := false"]
      - from: EXTENDED
        to: SATISFIED
        trigger: "POST /brand/deadlines/{id}/satisfy"
        actor: Paralegal
        preconditions: ["current_utc <= computed_due_at"]
        side_effects: ["satisfied_at := now; satisfied_late := false"]
      - from: MISSED
        to: SATISFIED
        trigger: "POST /brand/deadlines/{id}/satisfy with allow_late: true"
        actor: PartnerAttorney
        preconditions:
          - "caller role == PartnerAttorney (ERR_FORBIDDEN otherwise)"
          - "allow_late == true (ERR_VALIDATION otherwise)"
        side_effects:
          - "satisfied_at := now; satisfied_late := true"
          - "Matter posture recomputed (leaves JEOPARDY if no other MISSED deadline remains); Client.exposure_index recomputed"
      - from: PENDING
        to: MISSED
        trigger: "system — clock sweep when current_utc > computed_due_at"
        actor: system
        preconditions: []
        side_effects:
          - "Matter posture := JEOPARDY (any MISSED deadline)"
          - "Every other Deadline of the same matter in {DOCKETED, PENDING, EXTENDED}: requires_partner_review := true"
          - "The matter's WatchAlert escalation_level := URGENT"
          - "Client.exposure_index recomputed with the JEOPARDY multiplier"
      - from: EXTENDED
        to: MISSED
        trigger: "system — clock sweep when current_utc > computed_due_at"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as PENDING -> MISSED"]

