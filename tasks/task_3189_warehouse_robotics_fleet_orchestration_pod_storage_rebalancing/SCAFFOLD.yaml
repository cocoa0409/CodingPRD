    roles: [FleetAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["re-evaluate time-driven cascades: MaintenanceWindow activation, CustomerOrder CUTOFF_MISSED, HumanEntryPermit release eligibility"]

