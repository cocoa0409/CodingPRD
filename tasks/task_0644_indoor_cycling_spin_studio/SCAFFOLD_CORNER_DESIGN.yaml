# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Indoor Cycling / Spin Studio — breadth probe over SCAFFOLD.yaml §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_studio_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Studio
          - endpoints
        distinguishing_aspect: "POST /studios with name+city returns 201, status=ACTIVE, and default late_cancel_window_minutes=720, late_cancel_fee_cents=2000, no_show_fee_cents=3000."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
          assert:
            - "Studio.${studio_id}.status == ACTIVE"
            - "Studio.${studio_id}.late_cancel_window_minutes == 720"
            - "Studio.${studio_id}.late_cancel_fee_cents == 2000"
            - "Studio.${studio_id}.no_show_fee_cents == 3000"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Member
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A studio exists; the member id queried does not."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_session_missing_required_room_id_returns_400
        claim_type: Required Fields
        grounds:
          - entities.ClassSession
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST .../sessions without required room_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A studio and instructor exist; the session create omits room_id."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
          trigger:
            - call: "POST /studios/${studio_id}/sessions"
              payload: { instructor_id: "${instr_id}", start_utc: "2026-06-10T18:00:00Z", end_utc: "2026-06-10T19:00:00Z" }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.http_status == 400"

      - name: create_session_end_before_start_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.ClassSession.fields.end_utc
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "end_utc <= start_utc on session create returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A studio, room, and instructor exist; session create passes end_utc before start_utc."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
          trigger:
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-10T19:00:00Z", end_utc: "2026-06-10T18:00:00Z" }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.http_status == 400"

      - name: session_capacity_computed_from_active_bikes
        claim_type: Computed Fields
        grounds:
          - entities.ClassSession.fields.capacity
          - calculations.session_capacity_snapshot
        distinguishing_aspect: "Session capacity is computed = count of ACTIVE bikes in room at creation (3 bikes -> capacity 3); input value cannot override it."
        test_recipe:
          setup: ["A room with 3 ACTIVE bikes; a session is created in it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 2, label: "A2" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 3, label: "A3" }
              as: StudioManager
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
          trigger:
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-10T18:00:00Z", end_utc: "2026-06-10T19:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id }
          assert:
            - "ClassSession.${s1_id}.capacity == 3"
            - "ClassSession.${s1_id}.booked_count == 0"

      - name: system_fields_generated_on_create
        claim_type: System Fields
        grounds:
          - entities.Studio
          - response_envelope
        distinguishing_aspect: "id (no type prefix), created_at, updated_at, version are server-minted; version starts at 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id, sv: $.data.version }
          assert:
            - "Studio.${studio_id}.version == 1"
            - "response.data.id is a UUID without a type prefix"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_session_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second cancel on an already-CANCELLED session fails ERR_INVALID_STATE (409); no side effects re-fire."
        test_recipe:
          setup: ["A session is created and cancelled once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-20T18:00:00Z", end_utc: "2026-06-20T19:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/cancel"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/cancel"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: check_in_non_booked_reservation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.BOOKED_to_ATTENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Checking in a reservation already ATTENDED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A reservation is booked and checked in once (ATTENDED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "m1@x.com", full_name: "Mem One", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_id}", kind: "CLASS_PACK", purchased_credits: 5, price_cents: 5000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-02T10:00:00Z", end_utc: "2026-06-02T11:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:30:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${r1_id}/check-in"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          trigger:
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${r1_id}/check-in"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: initial_states_on_create
        claim_type: Initial State
        grounds:
          - state_machines.Reservation
          - entities.Reservation.fields.attendance_status
        distinguishing_aspect: "A freshly booked reservation starts attendance_status=BOOKED, billing_status=CREDIT_HELD."
        test_recipe:
          setup: ["A studio/room/bike/member/pack exist; member books a bike on a future session."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "m1@x.com", full_name: "Mem One", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_id}", kind: "CLASS_PACK", purchased_credits: 5, price_cents: 5000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-20T18:00:00Z", end_utc: "2026-06-20T19:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
          trigger:
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_id}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { r1_id: $.data.id }
          assert:
            - "Reservation.${r1_id}.attendance_status == BOOKED"
            - "Reservation.${r1_id}.billing_status == CREDIT_HELD"

      - name: terminal_state_completed_locks_session
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "After COMPLETED, a cancel on the same session returns ERR_INVALID_STATE (409) — terminal lockdown."
        test_recipe:
          setup: ["A session with no bookings is completed after its end_utc."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-05T18:00:00Z", end_utc: "2026-06-05T19:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T19:30:00Z" }
              as: StudioManager
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/complete"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/cancel"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "ClassSession.${s1_id}.status == COMPLETED"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: waitlist_promotion_on_early_cancel_bubble
        claim_type: Side Effect Execution
        grounds:
          - state_machines.WaitlistEntry.WAITING_to_PROMOTED
          - state_machines.Reservation.BOOKED_to_EARLY_CANCELLED
        distinguishing_aspect: "When a full session's booking is early-cancelled, the earliest WAITING entry is PROMOTED, gets a new BOOKED reservation on the freed bike, and one credit is debited from the pre-authorized pack."
        test_recipe:
          setup: ["1-bike session fully booked by member A; member B is on the waitlist with a pre-authorized 5-credit pack; A early-cancels."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "ma@x.com", full_name: "Mem A", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_a: $.data.id }
            - call: "POST /members/register"
              payload: { email: "mb@x.com", full_name: "Mem B", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_b: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_a}", kind: "CLASS_PACK", purchased_credits: 5, price_cents: 5000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_a}"
              captures: { pack_a: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_b}", kind: "CLASS_PACK", purchased_credits: 5, price_cents: 5000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_b}"
              captures: { pack_b: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-20T18:00:00Z", end_utc: "2026-06-20T19:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations"
              payload: { member_id: "${member_a}", bike_id: "${bike1_id}", expected_session_version: "${s1_v}" }
              as: Member
              as_user_id: "${member_a}"
              captures: { ra_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/waitlist"
              payload: { member_id: "${member_b}", credit_pack_id: "${pack_b}" }
              as: Member
              as_user_id: "${member_b}"
              captures: { wl_id: $.data.id }
          trigger:
            - call: "POST /studios/${studio_id}/sessions/${s1_id}/reservations/${ra_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_a}"
          assert:
            - "WaitlistEntry.${wl_id}.status == PROMOTED"
            - "Reservation.${ra_id}.attendance_status == EARLY_CANCELLED"
            - "ClassSession.${s1_id}.booked_count == 1"
            - "CreditPack.${pack_b}.remaining_credits == 4"

      - name: shoe_rental_forfeited_on_late_cancel
        claim_type: Conditional cascade
        grounds:
          - state_machines.Reservation.RESERVED_to_FORFEITED
          - state_machines.Reservation.BOOKED_to_LATE_CANCELLED
        distinguishing_aspect: "A RESERVED shoe (shoe_status) on a reservation that LATE_CANCELs transitions to FORFEITED (conditional cascade keyed on the same reservation's attendance state)."
        test_recipe:
          setup: ["Member books a bike with a shoe rental; late-cancels inside the window."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /studios"
              payload: { name: "Downtown", city: "NYC" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Main" }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms/${room_id}/bikes"
              payload: { position_row: 1, position_col: 1, label: "A1" }
              as: StudioManager
              captures: { bike1_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "i1@x.com", full_name: "Instr One" }
              as: StudioManager
              captures: { instr_id: $.data.id }
            - call: "POST /members/register"
              payload: { email: "m1@x.com", full_name: "Mem One", home_studio_id: "${studio_id}" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${member_id}", kind: "CLASS_PACK", purchased_credits: 5, price_cents: 5000, expires_at: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { pack_id: $.data.id }
            - call: "POST /studios/${studio_id}/sessions"
              payload: { room_id: "${room_id}", instructor_id: "${instr_id}", start_utc: "2026-06-05T18:00:00Z", end_utc: "2026-06-05T19:00:00Z" }
              as: StudioManager
