            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 1 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { s_cart: $.data.error_id }
            - call: "POST /orders/${ordS}/capture"
              payload: {}
