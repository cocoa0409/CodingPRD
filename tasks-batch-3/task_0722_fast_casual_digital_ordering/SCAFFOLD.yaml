scenario: "722. Fast-Casual Digital Ordering & Rewards (Sweetgreen/Chipotle style): menu/customization & modifier, order-ahead & pickup/locker slot, loyalty points/challenge & reward redemption, subscription/perks tier, delivery-channel & fee, allergen/nutrition & calorie, refund/make-it-right, store-throughput & queue"

domain_name: fast-casual-digital-ordering
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (Order, LoyaltyAccount, Subscription, Store) linked by FK references,
  # not nested URL ownership. Order references Customer/Store/PickupSlot/Subscription by FK.

  state_machine_shape: parallel
  # Order carries two independent state axes: order_status (lifecycle) and
  # settlement_status (fulfillment/refund). LoyaltyChallenge cycles. Subscription reverts.

  relationship_patterns:
    - one_to_many        # Store -> PickupSlot; Order -> OrderLine; LoyaltyAccount -> PointsLedgerEntry
    - cross_aggregate    # Order references Subscription, LoyaltyAccount, PickupSlot across aggregates
    - many_to_many       # OrderLine <-> Modifier via applied modifier list

  role_model: peer_roles
  # Customer owns own orders/loyalty/subscription; StoreManager runs a store's throughput/refunds;
  # PlatformAdmin configures menu/plans/clock. Non-overlapping resource ownership.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Store display name.
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code, e.g. "CA". Drives delivery-fee surcharge band.
      - name: throughput_capacity_per_slot
        type: integer
        source: input
        description: Max number of orders a single pickup slot may hold for this store.
        constraints: ">= 1"
      - name: locker_count
        type: integer
        source: input
        description: Number of physical pickup lockers at this store.
        default: 0
        constraints: ">= 0"
      - name: queue_status
        type: enum
        source: computed
        description: >-
          Derived store throughput posture computed from open slot load.
          One of {OPEN, BUSY, SURGE}. OPEN when current-clock active slot is
          below 70% capacity, BUSY at [70%,100%), SURGE at 100%.
        constraints: "enum: OPEN | BUSY | SURGE"
      - name: is_active
        type: boolean
        source: input
        description: Whether the store accepts new orders.
        default: true

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store that offers this menu item."
      - name: name
        type: string
        source: input
        description: Menu item name, e.g. "Harvest Bowl".
      - name: base_price_cents
        type: integer
        source: input
        description: Base price in integer cents before modifiers/discounts.
        constraints: ">= 0"
      - name: base_calories
        type: integer
        source: input
        description: Base calorie count before modifiers.
        constraints: ">= 0"
      - name: allergen_tags
        type: array
        source: input
        description: >-
          Array of allergen strings present in the base item, subset of
          {DAIRY, GLUTEN, NUTS, SOY, EGG, SHELLFISH}.
        default: []
      - name: is_available
        type: boolean
        source: input
        description: Whether the item is currently orderable.
        default: true

  - name: Modifier
    parent: null
    common_fields: true
    fields:
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the menu item this modifier may be applied to."
      - name: name
        type: string
        source: input
        description: Modifier name, e.g. "Extra Avocado".
      - name: price_delta_cents
        type: integer
        source: input
        description: Price change in cents applied per modifier (may be negative).
      - name: calorie_delta
        type: integer
        source: input
        description: Calorie change applied per modifier (may be negative).
      - name: adds_allergen_tags
        type: array
        source: input
        description: >-
          Allergen tags this modifier introduces, subset of
          {DAIRY, GLUTEN, NUTS, SOY, EGG, SHELLFISH}.
        default: []

  - name: PickupSlot
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store this slot belongs to."
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the pickup window (ISO 8601 UTC).
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the pickup window (ISO 8601 UTC).
      - name: channel
        type: enum
        source: input
        description: Fulfillment channel for this slot. One of {COUNTER, LOCKER, DELIVERY}.
        constraints: "enum: COUNTER | LOCKER | DELIVERY"
      - name: reserved_count
        type: integer
        source: computed
        description: >-
          Number of non-terminal Orders currently holding this slot. Incremented
          on order placement, decremented on cancel/refund. Capacity gate uses this.
        default: 0
      - name: is_closed
        type: boolean
        source: computed
        description: Whether the slot has been administratively closed (no new reservations).
        default: false

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Unique customer email.
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: Customer full name.
      - name: home_store_id
        type: string
        source: input
        description: "FK -> Store.id; the customer's default store."
      - name: allergen_blocklist
        type: array
        source: input
        description: >-
          Allergens the customer must never be served, subset of
          {DAIRY, GLUTEN, NUTS, SOY, EGG, SHELLFISH}. Hard safety gate on order placement.
        default: []
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: >-
          Make-it-right / refund wallet balance in cents. Credited by refunds to WALLET,
          debited when applied to a new order. Conserved quantity for refund invariants.
        default: 0
      - name: loyalty_account_id
        type: string
        source: computed
        description: >-
          Convenience reference to the customer's 1:1 LoyaltyAccount.id, set when the
          account is created on registration. Mirrors LoyaltyAccount.customer_id.

  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the owning customer (1:1)."
      - name: points_balance
        type: integer
        source: computed
        description: >-
          Current redeemable points balance. Sum of all PointsLedgerEntry.delta_points
          for this account. Conserved quantity for points invariants.
        default: 0
      - name: lifetime_points_earned
        type: integer
        source: computed
        description: Sum of all positive PointsLedgerEntry.delta_points (never decremented). Drives tier.
        default: 0
      - name: tier
        type: enum
        source: computed
        description: >-
          Loyalty tier derived from lifetime_points_earned thresholds.
          GREEN < 5000 <= GOLD < 15000 <= PLATINUM. Boundaries inclusive on the upper tier.
        constraints: "enum: GREEN | GOLD | PLATINUM"
        default: GREEN

  - name: PointsLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: loyalty_account_id
        type: string
        source: input
        description: "FK -> LoyaltyAccount.id; the account this ledger entry belongs to."
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order that produced this entry (null for adjustments)."
        default: null
      - name: delta_points
        type: integer
        source: input
        description: Signed point change (positive earn, negative redeem/clawback).
      - name: reason
        type: enum
        source: input
        description: >-
          Why the entry exists. One of {EARN, REDEEM, CHALLENGE_BONUS, CLAWBACK, ADJUSTMENT}.
        constraints: "enum: EARN | REDEEM | CHALLENGE_BONUS | CLAWBACK | ADJUSTMENT"

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - name: tier_name
        type: string
        source: input
        description: Plan name, e.g. "PERKS_PLUS".
        constraints: "unique"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: Monthly subscription fee in cents.
        constraints: ">= 0"
      - name: free_delivery
        type: boolean
        source: input
        description: Whether the plan waives the per-order delivery fee.
        default: false
      - name: points_multiplier_bps
        type: integer
        source: input
        description: >-
          Points earn multiplier in basis points applied to base earn (10000 = 1.0x).
        default: 10000
        constraints: ">= 10000"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the subscribing customer."
      - name: plan_id
        type: string
        source: input
        description: "FK -> SubscriptionPlan.id; the plan this subscription is on."
      - name: status
        type: enum
        source: computed
        description: >-
          Subscription lifecycle status. One of
          {PENDING_PAYMENT, ACTIVE, PAST_DUE, CANCELLED}.
        constraints: "enum: PENDING_PAYMENT | ACTIVE | PAST_DUE | CANCELLED"
        default: PENDING_PAYMENT
      - name: current_period_end_utc
        type: datetime
        source: computed
        description: End of the currently paid billing period (ISO 8601 UTC); null until first payment.
        default: null

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the ordering customer."
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the fulfilling store."
      - name: pickup_slot_id
        type: string
        source: input
        description: "FK -> PickupSlot.id; the reserved pickup/delivery slot."
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; subscription applied for perks (null if none)."
        default: null
      - name: channel
        type: enum
        source: computed
        description: >-
          Fulfillment channel copied from the chosen PickupSlot.channel.
          One of {COUNTER, LOCKER, DELIVERY}.
        constraints: "enum: COUNTER | LOCKER | DELIVERY"
      - name: order_status
        type: enum
        source: computed
        description: >-
          Lifecycle axis. One of {CART, PLACED, PREPARING, READY, COMPLETED, CANCELLED}.
        constraints: "enum: CART | PLACED | PREPARING | READY | COMPLETED | CANCELLED"
        default: CART
      - name: settlement_status
        type: enum
        source: computed
        description: >-
          Independent fulfillment/refund axis. One of
          {UNSETTLED, CAPTURED, PARTIALLY_REFUNDED, REFUNDED}.
        constraints: "enum: UNSETTLED | CAPTURED | PARTIALLY_REFUNDED | REFUNDED"
        default: UNSETTLED
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum over OrderLine.line_total_cents. Recomputed on every line mutation.
        default: 0
      - name: delivery_fee_cents
        type: integer
        source: computed
        description: Per-order delivery/channel fee in cents. See §1.3 delivery_fee.
        default: 0
      - name: points_redeemed
        type: integer
        source: input
        description: Points the customer elects to redeem on this order at placement.
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: Cents discount from redeemed points (REDEMPTION_RATE applied). See §1.3.
        default: 0
      - name: wallet_applied_cents
        type: integer
        source: computed
        description: Wallet credit applied to this order at placement.
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: Final charged total. See §1.3 order_total (evaluation order pinned).
        default: 0
      - name: total_calories
        type: integer
        source: computed
        description: Sum over OrderLine.line_calories. Recomputed on every line mutation.
        default: 0
      - name: points_earned
        type: integer
        source: computed
        description: Points awarded on completion. See §1.3 points_earned (dual-variant).
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: Cumulative cents refunded across make-it-right actions.
        default: 0

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the parent order."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; the chosen menu item."
      - name: quantity
        type: integer
        source: input
        description: Number of this item.
        constraints: ">= 1"
      - name: modifier_ids
        type: array
        source: input
        description: Array of Modifier.id applied to this line (each must belong to menu_item_id).
        default: []
      - name: line_total_cents
        type: integer
        source: computed
        description: Per-line price after modifiers x quantity. See §1.3 line_total (rounding order pinned).
        default: 0
      - name: line_calories
        type: integer
        source: computed
        description: Per-line calories after modifiers x quantity.
        default: 0
      - name: effective_allergen_tags
        type: array
        source: computed
        description: Union of item allergen_tags and all applied modifier adds_allergen_tags.
        default: []

  - name: LoyaltyChallenge
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer enrolled in this challenge."
      - name: target_order_count
        type: integer
        source: input
        description: Number of COMPLETED orders required within the round to earn the bonus.
        constraints: ">= 1"
      - name: bonus_points
        type: integer
        source: input
        description: Points granted when the round target is met.
        constraints: ">= 1"
      - name: progress_count
        type: integer
        source: computed
        description: COMPLETED orders counted toward the current round.
        default: 0
      - name: rounds_completed
        type: integer
        source: computed
        description: Number of rounds the customer has completed (cycle counter).
        default: 0
      - name: status
        type: enum
        source: computed
        description: >-
          Challenge round status. One of {IN_PROGRESS, ROUND_COMPLETE, EXPIRED}.
          Cycles: ROUND_COMPLETE -> IN_PROGRESS on a new round.
        constraints: "enum: IN_PROGRESS | ROUND_COMPLETE | EXPIRED"
        default: IN_PROGRESS

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: CART
    terminal_states: [COMPLETED, CANCELLED]
    note: >-
      Order has TWO independent state axes. This block is the order_status lifecycle.
      settlement_status evolves on the second block below.
    transitions:
      - from: CART
        to: PLACED
        trigger: "POST /orders/{id}/place"
        actor: Customer
        preconditions:
          - "Order has >= 1 OrderLine"
          - "Store.is_active == true AND PickupSlot.is_closed == false"
          - "PickupSlot.reserved_count < Store.throughput_capacity_per_slot (strict <)"
          - "For LOCKER channel: count of non-terminal LOCKER orders at store < Store.locker_count (strict <)"
          - "No OrderLine.effective_allergen_tags intersects Customer.allergen_blocklist"
          - "points_redeemed <= LoyaltyAccount.points_balance"
          - "expected_pickup_slot_version matches PickupSlot.version (OCC)"
        side_effects:
          - "Compute subtotal_cents, total_calories from OrderLine rows"
          - "Compute delivery_fee_cents per §1.3 delivery_fee (subscription free_delivery waiver applies)"
          - "Compute discount_cents from points_redeemed per §1.3 redemption_value"
          - "Apply wallet_applied_cents = min(Customer.wallet_credit_cents, residual after discount) per §1.3 order_total"
          - "Compute total_cents per §1.3 order_total (evaluation order pinned)"
          - "settlement_status -> CAPTURED"
          - "PickupSlot.reserved_count += 1; increments PickupSlot.version by 1"
          - "If points_redeemed > 0: append PointsLedgerEntry(delta_points = -points_redeemed, reason REDEEM); LoyaltyAccount.points_balance recomputed"
          - "Debit Customer.wallet_credit_cents by wallet_applied_cents"
          - "Recompute Store.queue_status per §1.3 queue_status"
      - from: PLACED
        to: PREPARING
        trigger: "POST /orders/{id}/advance"
        actor: StoreManager
        preconditions:
          - "order_status == PLACED"
          - "Store.is_active == true"
        side_effects:
          - "updated_at refreshed"
      - from: PREPARING
        to: READY
        trigger: "POST /orders/{id}/advance"
        actor: StoreManager
        preconditions:
          - "order_status == PREPARING"
        side_effects:
          - "updated_at refreshed"
      - from: READY
        to: COMPLETED
        trigger: "POST /orders/{id}/complete"
        actor: StoreManager
        preconditions:
          - "order_status == READY"
        side_effects:
          - "Compute points_earned per §1.3 points_earned (dual-variant: base vs subscription-boosted)"
          - "Append PointsLedgerEntry(delta_points = points_earned, reason EARN); LoyaltyAccount.points_balance and lifetime_points_earned recomputed; tier recomputed"
          - "PickupSlot.reserved_count -= 1; Store.queue_status recomputed"
          - "CASCADE: LoyaltyChallenge.progress_count += 1; if progress_count >= target_order_count -> ROUND_COMPLETE which appends PointsLedgerEntry(CHALLENGE_BONUS) which itself recomputes LoyaltyAccount.points_balance/lifetime/tier (depth-3 cascade)"
      - from: CART
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order_status == CART"
        side_effects:
          - "updated_at refreshed (no slot held yet in CART)"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order_status == PLACED"
        side_effects:
          - "settlement_status -> REFUNDED (full reversal)"
          - "Refund total_cents: re-credit wallet_applied_cents to Customer.wallet_credit_cents AND refund charged amount per refund_destination"
          - "If points_redeemed > 0: append compensating PointsLedgerEntry(delta_points = +points_redeemed, reason ADJUSTMENT); points_balance restored"
          - "PickupSlot.reserved_count -= 1; increments PickupSlot.version by 1; Store.queue_status recomputed"
          - "refunded_cents += total_cents"
      - from: PREPARING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "order_status == PREPARING"
        side_effects:
          - "Same compensation chain as PLACED->CANCELLED (settlement REFUNDED, wallet/points restored, slot released, version bumped)"

  - entity: Order
    initial_state: UNSETTLED
    terminal_states: [REFUNDED]
    note: >-
      settlement_status axis — evolves independently of order_status.
      CAPTURED is reached when order_status -> PLACED. Make-it-right refunds drive
      PARTIALLY_REFUNDED / REFUNDED.
    transitions:
      - from: UNSETTLED
        to: CAPTURED
        trigger: "system: order_status PLACED transition"
        actor: system
        preconditions:
          - "order_status transitioning to PLACED"
        side_effects:
          - "Charged amount = total_cents recorded"
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "POST /orders/{id}/make-it-right"
        actor: StoreManager
        preconditions:
          - "order_status IN {PREPARING, READY, COMPLETED}"
          - "settlement_status == CAPTURED"
          - "0 < refund_amount_cents < (total_cents - refunded_cents)"
        side_effects:
          - "refunded_cents += refund_amount_cents per §1.3 make_it_right_refund"
          - "If refund_destination == WALLET: Customer.wallet_credit_cents += refund_amount_cents"
          - "CASCADE: append PointsLedgerEntry(CLAWBACK, delta_points = -clawback) per §1.3 points_clawback; LoyaltyAccount.points_balance/lifetime/tier recomputed"
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /orders/{id}/make-it-right"
        actor: StoreManager
        preconditions:
          - "order_status IN {PREPARING, READY, COMPLETED}"
          - "settlement_status == CAPTURED"
          - "refund_amount_cents == (total_cents - refunded_cents) (full residual)"
        side_effects:
          - "refunded_cents = total_cents"
          - "If refund_destination == WALLET: Customer.wallet_credit_cents += refund_amount_cents"
          - "CASCADE: append PointsLedgerEntry(CLAWBACK) for full earned points; account recomputed"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /orders/{id}/make-it-right"
        actor: StoreManager
        preconditions:
          - "settlement_status == PARTIALLY_REFUNDED"
          - "refund_amount_cents == (total_cents - refunded_cents) (remaining residual)"
        side_effects:
          - "refunded_cents = total_cents"
          - "Wallet/points clawback for the incremental amount per §1.3"

  - entity: Subscription
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    note: "Branching with revert — PAST_DUE can recover to ACTIVE (revision loop)."
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/pay"
        actor: Customer
        preconditions:
          - "status == PENDING_PAYMENT"
          - "payment outcome == SUCCEEDED"
        side_effects:
          - "current_period_end_utc = clock_now + 30 days"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{id}/lapse"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "clock_now >= current_period_end_utc"
        side_effects:
          - "Subscription perks suspended for new orders while PAST_DUE"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/pay"
        actor: Customer
        preconditions:
          - "status == PAST_DUE"
          - "payment outcome == SUCCEEDED"
        side_effects:
          - "current_period_end_utc = clock_now + 30 days (recovery loop, cycle)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "status IN {ACTIVE, PAST_DUE}"
        side_effects:
          - "Perks immediately removed; future orders earn base points only"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "status == PAST_DUE"
        side_effects:
          - "Perks removed"

  - entity: LoyaltyChallenge
    initial_state: IN_PROGRESS
    terminal_states: [EXPIRED]
    note: "Cyclic — ROUND_COMPLETE returns to IN_PROGRESS for the next round."
    transitions:
      - from: IN_PROGRESS
        to: ROUND_COMPLETE
        trigger: "system: Order completion increments progress_count to target"
        actor: system
        preconditions:
          - "progress_count >= target_order_count"
          - "status == IN_PROGRESS"
        side_effects:
          - "Append PointsLedgerEntry(CHALLENGE_BONUS, delta_points = bonus_points)"
          - "rounds_completed += 1"
      - from: ROUND_COMPLETE
        to: IN_PROGRESS
        trigger: "POST /loyalty-challenges/{id}/start-round"
        actor: Customer
        preconditions:
          - "status == ROUND_COMPLETE"
        side_effects:
          - "progress_count reset to 0 (new round baseline)"
      - from: IN_PROGRESS
        to: EXPIRED
        trigger: "POST /loyalty-challenges/{id}/expire"
        actor: PlatformAdmin
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "Forfeit current-round progress; no bonus"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: place-order-stale-slot
    parent_entity: PickupSlot
    write_endpoint: "POST /orders/{id}/place"
    occ_field: "expected_pickup_slot_version"
    description: |
      Placing an order against a PickupSlot whose version has advanced since the
      client last observed it is rejected with a stale-version error. Another order
      placement (or a cancel releasing the slot) legitimately bumps the slot's
      version and reserved_count; a placement still carrying the prior version is
      working from a stale view of remaining capacity and is rejected.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_total
    trigger: "On POST /orders/{id}/place (and on OrderLine create/update preview)"
    algorithm: aggregation
    formula: |
      per_unit_cents = MenuItem.base_price_cents + sum(Modifier.price_delta_cents for m in modifier_ids)
      line_total_cents = per_unit_cents * quantity      # multiply AFTER summing modifiers; no per-modifier rounding
    input_set: "MenuItem.base_price_cents plus every Modifier whose id is in OrderLine.modifier_ids."
    constants: {}
    precision: "Integer cents; all inputs already integer cents, no rounding needed at line level."
    variants: []

  - name: line_calories
    trigger: "On POST /orders/{id}/place"
    algorithm: aggregation
    formula: |
      per_unit_cal = MenuItem.base_calories + sum(Modifier.calorie_delta for m in modifier_ids)
      line_calories = max(0, per_unit_cal) * quantity   # clamp per-unit at 0 before multiply
    input_set: "MenuItem.base_calories plus modifier calorie deltas for the line."
    constants: {}
    precision: "Integer calories; per-unit floored at 0."
    variants: []

  - name: delivery_fee
    trigger: "On POST /orders/{id}/place"
    algorithm: tiered_pricing
    formula: |
      if channel == COUNTER: raw_fee = 0
      elif channel == LOCKER: raw_fee = LOCKER_FEE_CENTS
      elif channel == DELIVERY:
          band = SURCHARGE_BPS_BY_STATE.get(Store.state_code, DEFAULT_SURCHARGE_BPS)
          raw_fee = DELIVERY_BASE_CENTS + round_half_up(subtotal_cents * band / 10000)
      # subscription waiver applies ONLY to the DELIVERY base+surcharge, NOT to LOCKER fee:
      if channel == DELIVERY and subscription is ACTIVE and plan.free_delivery: delivery_fee_cents = 0
      else: delivery_fee_cents = raw_fee
    input_set: "Order.channel, Store.state_code, computed subtotal_cents, applied Subscription/Plan state."
    constants:
      DELIVERY_BASE_CENTS: 399
      LOCKER_FEE_CENTS: 99
      DEFAULT_SURCHARGE_BPS: 0
      SURCHARGE_BPS_BY_STATE: { CA: 800, NY: 875, TX: 0 }
    precision: "round_half_up on the surcharge term to integer cents."
    variants:
      - name: with_active_subscription_free_delivery
        when: "channel == DELIVERY AND applied Subscription.status == ACTIVE AND plan.free_delivery == true"
        difference: "delivery_fee_cents forced to 0; LOCKER fee never waived even with free_delivery plan."

  - name: redemption_value
    trigger: "On POST /orders/{id}/place when points_redeemed > 0"
    algorithm: threshold
    formula: |
      # points convert to cents in whole MIN_REDEEM_BLOCK blocks; partial blocks are ignored (floored)
      usable_blocks = points_redeemed // MIN_REDEEM_BLOCK     # integer floor
      discount_cents = usable_blocks * BLOCK_VALUE_CENTS
      # discount may not exceed subtotal_cents (cannot discount fee or below zero)
      discount_cents = min(discount_cents, subtotal_cents)
    input_set: "Order.points_redeemed, computed subtotal_cents."
    constants:
      MIN_REDEEM_BLOCK: 100
      BLOCK_VALUE_CENTS: 100
    precision: "Integer cents; blocks floored, capped at subtotal."
    variants: []

  - name: order_total
    trigger: "On POST /orders/{id}/place"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED — circular-looking because delivery_fee depends on subtotal,
      # discount depends on subtotal, wallet depends on the post-discount residual:
      # 1) subtotal_cents = sum(OrderLine.line_total_cents)
      # 2) delivery_fee_cents = delivery_fee(subtotal_cents, channel, subscription)
      # 3) discount_cents = redemption_value(points_redeemed, subtotal_cents)
      # 4) residual_after_discount = subtotal_cents - discount_cents + delivery_fee_cents
      # 5) wallet_applied_cents = min(Customer.wallet_credit_cents, residual_after_discount)
      # 6) total_cents = residual_after_discount - wallet_applied_cents   # never below 0
      total_cents = max(0, subtotal_cents - discount_cents + delivery_fee_cents - wallet_applied_cents)
    input_set: "All OrderLines, channel, subscription, points_redeemed, Customer.wallet_credit_cents."
    constants: {}
    precision: "Integer cents; total floored at 0. Steps applied strictly in order 1->6."
    variants:
      - name: wallet_then_discount_WRONG
        when: "tempting alternative ordering"
        difference: >-
          Applying wallet before points discount, or discounting the delivery fee, yields a
          different total. The pinned order discounts only subtotal, adds fee, THEN applies wallet.

  - name: points_earned
    trigger: "On READY->COMPLETED (POST /orders/{id}/complete)"
    algorithm: weighted_scoring
    formula: |
      # Earn is on the net merchandise spend (subtotal minus discount), NOT on fee or wallet.
      eligible_cents = max(0, subtotal_cents - discount_cents)
      base_points = floor(eligible_cents / CENTS_PER_POINT)     # 1 point per CENTS_PER_POINT cents
      if applied Subscription.status == ACTIVE:
          points_earned = floor(base_points * plan.points_multiplier_bps / 10000)
      else:
          points_earned = base_points
    input_set: "Order.subtotal_cents, discount_cents, applied Subscription state and plan multiplier."
    constants:
      CENTS_PER_POINT: 10
    precision: "Integer points; floor at each step (base floor, then multiplier floor)."
    variants:
      - name: base_earn
        when: "no active subscription applied at completion"
        difference: "points_earned = base_points (multiplier 1.0x)."
      - name: subscription_boosted_earn
        when: "applied Subscription.status == ACTIVE at completion"
        difference: "base_points multiplied by plan.points_multiplier_bps/10000 then floored; differs from base."

  - name: make_it_right_refund
    trigger: "On POST /orders/{id}/make-it-right"
    algorithm: aggregation
    formula: |
      remaining = total_cents - refunded_cents
      assert 0 < refund_amount_cents <= remaining
      refunded_cents_new = refunded_cents + refund_amount_cents
      # destination split (conserved-quantity invariant):
      if refund_destination == WALLET: wallet_credit_delta = +refund_amount_cents
      else (ORIGINAL): wallet_credit_delta = 0   # external charge reversed off-ledger
    input_set: "Order.total_cents, Order.refunded_cents, request refund_amount_cents, refund_destination."
    constants: {}
    precision: "Integer cents. Invariant: refunded_cents never exceeds total_cents."
    variants:
      - name: to_wallet
        when: "refund_destination == WALLET"
        difference: "Customer.wallet_credit_cents increases by refund_amount_cents (in-system conserved)."
      - name: to_original
        when: "refund_destination == ORIGINAL"
        difference: "wallet unchanged; charged amount reversed externally."

  - name: points_clawback
    trigger: "On POST /orders/{id}/make-it-right for a COMPLETED order (earn already granted)"
    algorithm: weighted_scoring
    formula: |
      # Claw back points proportional to the refunded share of eligible merchandise spend.
      if order_status != COMPLETED or points_earned == 0: clawback = 0
      else:
          refund_share = refund_amount_cents / total_cents      # rational
          clawback = round_half_up(points_earned * refund_share)
          clawback = min(clawback, current points_balance attributable, points_earned - prior_clawback)
      append PointsLedgerEntry(CLAWBACK, delta_points = -clawback)
    input_set: "Order.points_earned, Order.total_cents, refund_amount_cents, prior clawbacks on this order."
    constants: {}
    precision: "round_half_up to integer points; clawback never exceeds points_earned net of prior clawbacks."
    variants:
      - name: partial_clawback
        when: "refund_amount_cents < total_cents"
        difference: "Proportional clawback < points_earned."
      - name: full_clawback
        when: "cumulative refund == total_cents"
        difference: "Total clawback equals points_earned exactly (no drift)."

  - name: queue_status
    trigger: "On slot reserve/release (place, cancel, complete, make-it-right slot release)"
    algorithm: threshold
    formula: |
      # Evaluated for the store's most-loaded currently-active slot (clock within [start,end)).
      active_slots = PickupSlots of store where window_start_utc <= clock_now < window_end_utc AND is_closed == false
      if active_slots empty: load_ratio = 0
      else: load_ratio = max(reserved_count / Store.throughput_capacity_per_slot over active_slots)
      if load_ratio >= 1.0: queue_status = SURGE
      elif load_ratio >= 0.70: queue_status = BUSY
      else: queue_status = OPEN
    input_set: "Store.throughput_capacity_per_slot, reserved_count of active slots, clock_now."
    constants:
      BUSY_THRESHOLD: 0.70
      SURGE_THRESHOLD: 1.0
    precision: "Ratio comparison; >= boundary inclusive (0.70 -> BUSY, 1.0 -> SURGE)."
    variants: []

  - name: tier_recompute
    trigger: "On any EARN/CHALLENGE_BONUS PointsLedgerEntry append"
    algorithm: threshold
    formula: |
      L = lifetime_points_earned
      if L >= 15000: tier = PLATINUM
      elif L >= 5000: tier = GOLD
      else: tier = GREEN
    input_set: "LoyaltyAccount.lifetime_points_earned."
    constants:
      GOLD_FLOOR: 5000
      PLATINUM_FLOOR: 15000
    precision: ">= boundary inclusive on the upper tier (exactly 5000 -> GOLD, exactly 15000 -> PLATINUM)."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers, POST /stores (bootstrap public)"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per §1.7; entity_backed roles must own the targeted resource."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (Store, MenuItem, Modifier, PickupSlot, Customer, Order, Subscription)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource id"

  - priority: 4
    category: existence
    check: "Required request-body fields present and well-typed; enum values within declared set."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: business_referential
    check: "Each Modifier in OrderLine.modifier_ids belongs to that line's menu_item_id; MenuItem belongs to Order.store_id."
    error_id: ERR_MODIFIER_MISMATCH
    http_status: 422
    applies_to: "POST /orders/{id}/lines, PATCH /order-lines/{id}"

  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition is defined (order_status / settlement_status / subscription / challenge)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "No OrderLine.effective_allergen_tags intersects the Customer.allergen_blocklist (hard safety gate)."
    error_id: ERR_ALLERGEN_BLOCKED
    http_status: 422
    applies_to: "POST /orders/{id}/place"

  - priority: 8
    category: business_temporal
    check: "Chosen PickupSlot window is active: clock_now < window_end_utc AND not is_closed; channel matches slot.channel."
    error_id: ERR_SLOT_UNAVAILABLE
    http_status: 422
    applies_to: "POST /orders/{id}/place"

  - priority: 9
    category: business_constraint
    check: "PickupSlot.reserved_count < Store.throughput_capacity_per_slot (strict) — slot not full."
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/place"

  - priority: 10
    category: business_constraint
    check: "For LOCKER channel: non-terminal LOCKER order count at store < Store.locker_count (strict) — locker available."
    error_id: ERR_NO_LOCKER_AVAILABLE
    http_status: 409
    applies_to: "POST /orders/{id}/place"

  - priority: 11
    category: business_fiscal
    check: "points_redeemed <= LoyaltyAccount.points_balance (cannot redeem more than held)."
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /orders/{id}/place"

  - priority: 12
    category: business_fiscal
    check: "make-it-right refund_amount_cents in (0, total_cents - refunded_cents] — cannot over-refund."
    error_id: ERR_REFUND_EXCEEDS_CHARGE
    http_status: 422
    applies_to: "POST /orders/{id}/make-it-right"

  - priority: 13
    category: business_constraint
    check: "OCC: expected_pickup_slot_version equals current PickupSlot.version at placement."
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/place"

