            - call: "POST /enrollments/${e1_id}/submit"
              payload: {}
              as: Grower
              as_user_id: "${g1_id}"
            - call: "POST /enrollments/${e1_id}/screen"
              payload: { decision: "ACCEPT" }
              as: ProgramAdmin
              as_user_id: "admin-screener-01"
              captures: { e1_v1: $.data.version }
            - call: "POST /enrollments/${e1_id}/baselines"
              payload: { method: "HISTORICAL_DATA", expected_enrollment_version: "${e1_v1}" }
              as: ProgramAdmin
              as_user_id: "admin-baseline-01"
              captures: { b1_id: $.data.id }
            - call: "POST /baselines/${b1_id}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-baseline-01"
            - call: "POST /enrollments/${e1_id}/data-packets"
              payload: { crop_year: 2026, source: "EQUIPMENT_TELEMETRY", reported_acres: 1000.00, coverage_pct: 92.00, measured_value: 0.3000 }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /data-packets/${p1_id}/qc"
              payload: { decision: "PASS" }
              as: ProgramAdmin
            - call: "GET /enrollments/${e1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { e1_v2: $.data.version }
            - call: "POST /quantification-runs"
              payload: { enrollment_id: "${e1_id}", baseline_id: "${b1_id}", crop_year: 2026, method: "MODEL", expected_enrollment_version: "${e1_v2}" }
              as: ProgramAdmin
              captures: { r1_id: $.data.id }
