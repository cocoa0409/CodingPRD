      - name: corner_offer_response_error_codes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_OPEN_OFFER
          - errors.ERR_NOT_OFFER_RECIPIENT
          - errors.ERR_OFFER_EXPIRED
          - validations.priority_60.ERR_OFFER_EXPIRED
        distinguishing_aspect: |
          The three offer-response rejections are ordered, and the order is observable.
          A non-recipient guard answering a live offer gets ERR_NOT_OFFER_RECIPIENT (403).
          A response against a DISPATCH_PENDING report gets the priority-40
          ERR_NO_OPEN_OFFER (409) even when the caller is also not a recipient, because the
          state check runs first. And once the clock passes the 45-minute expiry at
          2026-09-16T01:45:00Z, the true recipient gets ERR_OFFER_EXPIRED (409) — checked
          after the recipient identity so a stranger never learns whether the offer is
          still live. Advancing the clock does not by itself rewrite the offer to EXPIRED;
          it stays OPEN until a dispatch or response touches it.
