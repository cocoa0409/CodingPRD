            - "second call: error_id == ERR_MEDALLION_COVERAGE_INSUFFICIENT with HTTP 422 (one cent short)"
            - "TransferRequest.${t2}.status remains UNDER_REVIEW"

      - name: dormancy_boundary_inclusive_year
        grounds:
          - calculations.dormancy_determination
          - entities.ShareholderAccount.fields.last_qualifying_contact_date
        distinguishing_aspect: |
          Boundary on a time metric at a different endpoint (POST /escheatment/scan): dormancy uses
          inclusive >=, so a CA account whose last contact is exactly 3 years before the sweep IS
          dormant, while an identical account one day younger is NOT. Different metric (time vs
          money) and different endpoint from medallion_coverage_boundary_inclusive.
        test_recipe:
