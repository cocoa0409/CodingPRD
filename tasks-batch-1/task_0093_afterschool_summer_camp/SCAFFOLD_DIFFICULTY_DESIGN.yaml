scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tuition_provisional_vs_final_on_enrollment
        grounds:
          - calculations.compute_line_tuition
          - state_machines.Enrollment.REQUESTED_to_CONFIRMED
          - state_machines.Invoice.DRAFT_to_FINALIZED
          - entities.Enrollment.fields.provisional_tuition_cents
          - entities.Enrollment.fields.final_tuition_cents
        distinguishing_aspect: |
          Operates on the Enrollment/Invoice billing domain: the provisional variant tracks the
          live scholarship at confirm time while the final variant freezes it at finalize, so a
          scholarship REVOKED between confirm and finalize leaves provisional and final divergent.
        test_recipe:
          setup:
            - "A CAMP program PUBLISHED with one OPEN session (base_weekly_tuition_cents=20000) and one weekly offering, capacity 5."
            - "Child has APPROVED MEDICAL + PICKUP forms, one emergency contact, and an APPROVED PARTIAL scholarship (0.5)."
            - "Child is CONFIRMED on the week; provisional_tuition_cents = 11500 (round_half_up(20000*0.5)=10000 + 1500 surcharge)."
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "g1@x.com", full_name: "G One", phone: "555-0001", home_zip: "94101" }
              as: Anonymous
              captures: { g1: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${g1}", first_name: "Ava", birth_date: "2016-03-01", household_size: 3 }
              as: Guardian
              as_user_id: "${g1}"
              captures: { c1: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${c1}", contact_name: "Nan", contact_phone: "555-9", relationship: "grandparent" }
              as: Guardian
              as_user_id: "${g1}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${c1}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { afm: $.data.id }
            - call: "POST /authorization-forms/${afm}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${c1}", form_type: "PICKUP", authorized_pickup_names: ["G One"] }
              as: Guardian
              as_user_id: "${g1}"
              captures: { afp: $.data.id }
            - call: "POST /authorization-forms/${afp}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /scholarship-awards"
              payload: { child_id: "${c1}", tier: "PARTIAL" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { sch: $.data.id }
            - call: "POST /scholarship-awards/${sch}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "Summer Camp", program_type: "CAMP", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${p1}", title: "Rocketry", age_group_min: 8, age_group_max: 10, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 20000 }
              as: ProgramDirector
              captures: { s1: $.data.id }
            - call: "POST /weekly-offerings"
              payload: { session_id: "${s1}", week_start: "2026-06-08" }
              as: ProgramDirector
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /programs/${p1}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /enrollments"
              payload: { child_id: "${c1}", weekly_offering_id: "${wo1}", expected_weekly_offering_version: "${wo1_v}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { e1: $.data.id, inv1: $.data.invoice_id }
          trigger:
            - call: "POST /scholarship-awards/${sch}/revoke"
              payload: {}
              as: ProgramDirector
            - call: "GET /invoices/${inv1}"
              payload: {}
              as: BillingAdmin
              captures: { inv1_v: $.data.version }
            - call: "POST /invoices/${inv1}/finalize"
              payload: { expected_invoice_version: "${inv1_v}" }
              as: BillingAdmin
            - call: "GET /enrollments/${e1}"
              payload: {}
              as: BillingAdmin
          assert:
            - "Enrollment.${e1}.final_tuition_cents == 21500"
            - "Enrollment.${e1}.provisional_tuition_cents == 21500"
            - "Invoice.${inv1}.subtotal_cents == 21500"

      - name: capacity_state_posture_vs_offering_count
        grounds:
          - calculations.reconcile_offering_counts
          - entities.WeeklyOffering.fields.capacity_state
          - entities.WeeklyOffering.fields.enrolled_count
          - state_machines.Enrollment.REQUESTED_to_WAITLISTED
        distinguishing_aspect: |
          Operates on the WeeklyOffering occupancy domain (not billing): the raw enrolled_count
          and the derived capacity_state posture are two valid reads of the same offering, and the
          posture flips to FULL exactly when count reaches weekly_capacity while count keeps rising
          only via waitlist — proving posture and count diverge in meaning.
        test_recipe:
          setup:
            - "An OPEN CAMP session with weekly_capacity=1 and one weekly offering."
            - "Two distinct eligible children of two guardians both attempt the same week."
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "ga@x.com", full_name: "Ga", phone: "555-1", home_zip: "94101" }
              as: Anonymous
              captures: { ga: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${ga}", first_name: "Al", birth_date: "2016-03-01" }
              as: Guardian
              as_user_id: "${ga}"
              captures: { ca: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${ca}", contact_name: "N", contact_phone: "1", relationship: "aunt" }
              as: Guardian
              as_user_id: "${ga}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${ca}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${ga}"
              captures: { afma: $.data.id }
            - call: "POST /authorization-forms/${afma}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${ca}", form_type: "PICKUP", authorized_pickup_names: ["Ga"] }
              as: Guardian
              as_user_id: "${ga}"
              captures: { afpa: $.data.id }
            - call: "POST /authorization-forms/${afpa}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /guardians"
              payload: { email: "gb@x.com", full_name: "Gb", phone: "555-2", home_zip: "94101" }
              as: Anonymous
              captures: { gb: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${gb}", first_name: "Bo", birth_date: "2016-04-01" }
              as: Guardian
              as_user_id: "${gb}"
              captures: { cb: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${cb}", contact_name: "M", contact_phone: "2", relationship: "uncle" }
              as: Guardian
              as_user_id: "${gb}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${cb}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${gb}"
              captures: { afmb: $.data.id }
            - call: "POST /authorization-forms/${afmb}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${cb}", form_type: "PICKUP", authorized_pickup_names: ["Gb"] }
              as: Guardian
              as_user_id: "${gb}"
              captures: { afpb: $.data.id }
            - call: "POST /authorization-forms/${afpb}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "Camp Cap1", program_type: "CAMP", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { p2: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${p2}", title: "Solo", age_group_min: 8, age_group_max: 10, age_as_of_date: "2026-06-01", weekly_capacity: 1, base_weekly_tuition_cents: 20000 }
              as: ProgramDirector
              captures: { s2: $.data.id }
            - call: "POST /weekly-offerings"
              payload: { session_id: "${s2}", week_start: "2026-06-08" }
              as: ProgramDirector
              captures: { wo2: $.data.id, wo2_v: $.data.version }
            - call: "POST /programs/${p2}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /sessions/${s2}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /enrollments"
              payload: { child_id: "${ca}", weekly_offering_id: "${wo2}", expected_weekly_offering_version: "${wo2_v}" }
              as: Guardian
              as_user_id: "${ga}"
            - call: "GET /weekly-offerings/${wo2}"
              payload: {}
              as: ProgramDirector
              captures: { wo2_v2: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { child_id: "${cb}", weekly_offering_id: "${wo2}", expected_weekly_offering_version: "${wo2_v2}" }
              as: Guardian
              as_user_id: "${gb}"
            - call: "GET /weekly-offerings/${wo2}"
              payload: {}
              as: ProgramDirector
          assert:
            - "WeeklyOffering.${wo2}.enrolled_count == 1"
            - "WeeklyOffering.${wo2}.waitlist_count == 1"
            - "WeeklyOffering.${wo2}.capacity_state == FULL"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: line_tuition_scale_then_round_then_add_surcharge
        grounds:
          - calculations.compute_line_tuition
          - entities.Session.fields.base_weekly_tuition_cents
          - entities.Program.fields.program_type
          - state_machines.Enrollment.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base, scholarship fraction, program_type) with non-linear
          interaction — a multiplicative scholarship reduction with round_half_up applied BEFORE
          a conditional additive CAMP surcharge; base=19999 with PARTIAL 0.5 rounds 9999.5 up to
          10000 then adds 1500 = 11500, demonstrating the pinned scale-then-round-then-add order.
        test_recipe:
          setup:
            - "CAMP PUBLISHED/OPEN session base_weekly_tuition_cents=19999, capacity 5, one offering."
            - "Eligible child with APPROVED PARTIAL scholarship (0.5)."
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "g2@x.com", full_name: "G Two", phone: "555-3", home_zip: "94101" }
              as: Anonymous
              captures: { g2: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${g2}", first_name: "Mia", birth_date: "2016-03-01" }
              as: Guardian
              as_user_id: "${g2}"
              captures: { c2c: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${c2c}", contact_name: "N", contact_phone: "1", relationship: "aunt" }
              as: Guardian
              as_user_id: "${g2}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${c2c}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${g2}"
              captures: { m2: $.data.id }
            - call: "POST /authorization-forms/${m2}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${c2c}", form_type: "PICKUP", authorized_pickup_names: ["G Two"] }
              as: Guardian
              as_user_id: "${g2}"
              captures: { pk2: $.data.id }
            - call: "POST /authorization-forms/${pk2}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /scholarship-awards"
              payload: { child_id: "${c2c}", tier: "PARTIAL" }
              as: Guardian
              as_user_id: "${g2}"
              captures: { sc2: $.data.id }
            - call: "POST /scholarship-awards/${sc2}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "Odd Camp", program_type: "CAMP", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { pp2: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${pp2}", title: "Odd", age_group_min: 8, age_group_max: 10, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 19999 }
              as: ProgramDirector
              captures: { ss2: $.data.id }
            - call: "POST /weekly-offerings"
              payload: { session_id: "${ss2}", week_start: "2026-06-08" }
              as: ProgramDirector
              captures: { woo2: $.data.id, woo2_v: $.data.version }
            - call: "POST /programs/${pp2}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /sessions/${ss2}/open"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /enrollments"
              payload: { child_id: "${c2c}", weekly_offering_id: "${woo2}", expected_weekly_offering_version: "${woo2_v}" }
              as: Guardian
              as_user_id: "${g2}"
              captures: { ee2: $.data.id }
          assert:
            - "Enrollment.${ee2}.provisional_tuition_cents == 11500"
            - "Enrollment.${ee2}.status == CONFIRMED"

      - name: sibling_discount_sum_then_round_evaluation_order
        grounds:
          - calculations.compute_sibling_discount
          - calculations.compute_invoice_totals
          - entities.Invoice.fields.sibling_discount_cents
          - entities.Invoice.fields.total_due_cents
        distinguishing_aspect: |
          Mode (c): the circular-looking dependency total_due = subtotal - sibling_discount where
          sibling_discount itself derives from the per-line tuitions; the scaffold pins evaluation
          order (lines -> sibling_discount -> totals) and pins sum-then-round on the discount, so
          two children with lines 21500 and 11500 yield round_half_up(0.10*11500)=1150, total 31850.
        test_recipe:
          setup:
            - "One guardian with two distinct eligible children, no scholarships."
            - "Child A CONFIRMED on a CAMP week base 20000 (line 21500); Child B CONFIRMED on a CAMP week base 10000 (line 11500), same billing period invoice."
            - "Child A's line (21500) is the anchor; Child B is the eligible sibling."
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "gs@x.com", full_name: "Gs", phone: "555-4", home_zip: "94101" }
              as: Anonymous
              captures: { gs: $.data.id }
            - call: "POST /children"
              payload: { guardian_id: "${gs}", first_name: "Anchor", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${gs}"
              captures: { csa: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${csa}", contact_name: "N", contact_phone: "1", relationship: "aunt" }
              as: Guardian
              as_user_id: "${gs}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${csa}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${gs}"
              captures: { sma: $.data.id }
            - call: "POST /authorization-forms/${sma}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${csa}", form_type: "PICKUP", authorized_pickup_names: ["Gs"] }
              as: Guardian
              as_user_id: "${gs}"
              captures: { spa: $.data.id }
            - call: "POST /authorization-forms/${spa}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /children"
              payload: { guardian_id: "${gs}", first_name: "Sib", birth_date: "2016-02-01" }
              as: Guardian
              as_user_id: "${gs}"
              captures: { csb: $.data.id }
            - call: "POST /emergency-contacts"
              payload: { child_id: "${csb}", contact_name: "M", contact_phone: "2", relationship: "uncle" }
              as: Guardian
              as_user_id: "${gs}"
            - call: "POST /authorization-forms"
              payload: { child_id: "${csb}", form_type: "MEDICAL", medication_notes: "none" }
              as: Guardian
              as_user_id: "${gs}"
              captures: { smb: $.data.id }
            - call: "POST /authorization-forms/${smb}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /authorization-forms"
              payload: { child_id: "${csb}", form_type: "PICKUP", authorized_pickup_names: ["Gs"] }
              as: Guardian
              as_user_id: "${gs}"
              captures: { spb: $.data.id }
            - call: "POST /authorization-forms/${spb}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "Sib Camp", program_type: "CAMP", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { ps: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${ps}", title: "Expensive", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 20000 }
              as: ProgramDirector
              captures: { sexp: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${ps}", title: "Cheap", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 10000 }
              as: ProgramDirector
              captures: { scheap: $.data.id }
            - call: "POST /weekly-offerings"
              payload: { session_id: "${sexp}", week_start: "2026-06-08" }
              as: ProgramDirector
              captures: { woexp: $.data.id, woexp_v: $.data.version }
            - call: "POST /weekly-offerings"
              payload: { session_id: "${scheap}", week_start: "2026-06-15" }
              as: ProgramDirector
              captures: { wocheap: $.data.id, wocheap_v: $.data.version }
            - call: "POST /programs/${ps}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /sessions/${sexp}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /sessions/${scheap}/open"
              payload: {}
              as: ProgramDirector
            - call: "POST /enrollments"
              payload: { child_id: "${csa}", weekly_offering_id: "${woexp}", expected_weekly_offering_version: "${woexp_v}" }
              as: Guardian
              as_user_id: "${gs}"
              captures: { invs: $.data.invoice_id }
          trigger:
            - call: "POST /enrollments"
              payload: { child_id: "${csb}", weekly_offering_id: "${wocheap}", expected_weekly_offering_version: "${wocheap_v}" }
              as: Guardian
              as_user_id: "${gs}"
            - call: "GET /invoices/${invs}"
              payload: {}
              as: BillingAdmin
          assert:
            - "Invoice.${invs}.subtotal_cents == 33000"
            - "Invoice.${invs}.sibling_discount_cents == 1150"
            - "Invoice.${invs}.total_due_cents == 31850"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_fork_join_waitlist_promotion
        grounds:
          - state_machines.Enrollment.REQUESTED_to_WAITLISTED
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
        distinguishing_aspect: |
          Branching fork-join on Enrollment: REQUESTED forks to CONFIRMED or WAITLISTED with
          divergent side-effect sets (invoice line vs none), and the WAITLISTED->CONFIRMED join
          fires only when a CONFIRMED->WITHDRAWN frees a seat — a revision loop, not a linear path.
        test_recipe:
          setup:
            - "OPEN CAMP session weekly_capacity=1, one offering; Child A CONFIRMED, Child B WAITLISTED rank 1."
          setup_api_calls:
            - call: "POST /guardians"
              payload: { email: "gx@x.com", full_name: "Gx", phone: "555-5", home_zip: "94101" }
              as: Anonymous
