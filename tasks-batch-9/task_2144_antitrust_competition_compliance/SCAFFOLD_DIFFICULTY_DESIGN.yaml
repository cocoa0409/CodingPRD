      - name: site_half_open_window_allows_adjacency_but_enforces_aggregate_capacity
        grounds:
          - calculations.site_drill_capacity_check
          - validations[priority=23]
          - errors[ERR_SITE_DRILL_CAPACITY_EXCEEDED]
          - entities.Site.fields.concurrent_drill_capacity
        distinguishing_aspect: |
          A DIFFERENT resource entity (Site) with DIFFERENT interval semantics:
          HALF-OPEN [start, end) and an AGGREGATE capacity of 2 rather than a
          single slot. A third drill overlapping the two existing ones is
          refused, yet a drill starting at exactly the instant an existing drill
          ends is accepted — the precise opposite of the delegate's closed-closed
          touching rule.
        test_recipe:
          setup:
            - "One Site with concurrent_drill_capacity 2."
            - "Drill D1 occupying [2026-09-01T08:00Z, 2026-09-01T12:00Z) and drill D2 occupying [2026-09-01T10:00Z, 2026-09-01T14:00Z), both SCHEDULED."
          setup_api_calls:
            - call: "POST /compliance/sites"
              payload: { name: "Rotterdam Plant", country_code: "NL", concurrent_drill_capacity: 2 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /compliance/readiness-drills"
              payload: { site_id: "${site_id}", drill_type: "DAWN_RAID", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /compliance/readiness-drills"
              payload: { site_id: "${site_id}", drill_type: "DOCUMENT_HOLD", window_start: "2026-09-01T10:00:00Z", window_end: "2026-09-01T14:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { d2_id: $.data.id }
          trigger:
            - call: "POST /compliance/readiness-drills"
              payload: { site_id: "${site_id}", drill_type: "INTERVIEW", window_start: "2026-09-01T11:00:00Z", window_end: "2026-09-01T13:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /compliance/readiness-drills"
              payload: { site_id: "${site_id}", drill_type: "INTERVIEW", window_start: "2026-09-01T12:00:00Z", window_end: "2026-09-01T16:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { d4_id: $.data.id }
          assert:
            - "the overlapping drill returns HTTP 409 with ${err_id} == 'ERR_SITE_DRILL_CAPACITY_EXCEEDED'"
            - "the adjacent drill returns HTTP 201 and ReadinessDrill.${d4_id}.status == SCHEDULED"
            - "ReadinessDrill.${d4_id}.window_start == '2026-09-01T12:00:00.000Z'"
            - "GET /compliance/readiness-drills?site_id=${site_id} returns total_count == 3"
            - "Site.${site_id}.readiness_score == 0"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contact_clearance_restores_exposure_points_exactly
        grounds:
          - state_machines.CompetitorContact.UNDER_REVIEW_to_CLEARED
          - calculations.business_unit_exposure_ledger
          - calculations.contact_exposure_points
          - entities.BusinessUnit.fields.manual_exposure_adjustment_points
        distinguishing_aspect: |
          Conserved quantity #1 — ANTITRUST EXPOSURE POINTS. The invariant is
          BusinessUnit.exposure_points == sum(CompetitorContact.exposure_points_charged
          over non-CLEARED contacts) + sum(MeetingAttendance.exposure_points_assessed
          over reviewed/flagged attendances) + manual_exposure_adjustment_points.
          Logging then clearing a contact must return exposure_points to exactly
          12.00 with zero drift, and must zero the contact's own charge.
        test_recipe:
          setup:
            - "BusinessUnit whose exposure ledger has been adjusted to exactly 12.00 with no contacts and no attendances."
            - "A LEGAL-role employee so the training gate never fires."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25, exposure_budget_points: 200, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ines Vogel", email: "ines.vogel@example.com", role_category: "LEGAL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
            - call: "GET /compliance/business-units/${bu_id}"
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { bu_v1: $.data.version }
            - call: "POST /compliance/business-units/${bu_id}/exposure-adjustments"
              payload: { points_delta: 12, reason: "Opening balance carried over from the legacy register", expected_business_unit_version: "${bu_v1}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          trigger:
            - call: "POST /compliance/competitor-contacts"
              payload: { business_unit_id: "${bu_id}", employee_id: "${emp_id}", competitor_name: "Rivex SA", contact_channel: "TRADE_SHOW", topic_tags: ["CAPACITY"], pricing_topic: false, occurred_at: "2026-07-20T10:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { c_id: $.data.id }
            - call: "POST /compliance/competitor-contacts/${c_id}/review-opening"
              payload: {}
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/competitor-contacts/${c_id}/clearance"
              payload: { notes: "Booth conversation was confined to published capacity data" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
          assert:
            - "immediately after the log call: CompetitorContact.${c_id}.exposure_points_charged == 8.00 and BusinessUnit.${bu_id}.exposure_points == 20.00"
            - "after the clearance call: CompetitorContact.${c_id}.status == CLEARED"
            - "after the clearance call: CompetitorContact.${c_id}.exposure_points_charged == 0.00"
            - "after the clearance call: BusinessUnit.${bu_id}.exposure_points == 12.00"
            - "BusinessUnit.${bu_id}.manual_exposure_adjustment_points == 12.00"
            - "BusinessUnit.${bu_id}.posture == OPEN"

      - name: participation_termination_restores_review_minutes_exactly
        grounds:
          - state_machines.AssociationParticipation.ACTIVE_to_TERMINATED
          - calculations.participation_review_load_minutes
          - entities.BusinessUnit.fields.review_minutes_consumed
          - entities.AssociationParticipation.fields.review_minutes_reserved
        distinguishing_aspect: |
          Conserved quantity #2 — a DIFFERENT KIND of quantity: COUNSEL REVIEW
          LABOUR MINUTES, not risk points. The invariant is
          BusinessUnit.review_minutes_consumed == sum(review_minutes_reserved over
          participations whose status IN {PARTIALLY_APPROVED, ACTIVE, SUSPENDED,
          UNDER_REVIEW}). Terminating the 55-minute participation must drop the
          unit from 165 to exactly 110 while leaving the 110-minute sibling's
          reservation untouched, and must retain review_load_minutes as history.
        test_recipe:
          setup:
            - "BusinessUnit with review_minutes_budget 480 and a SALES employee with current training."
            - "Two APPROVED associations: A55 (TIER_2_MEDIUM, density 25 -> load 55) and A110 (TIER_3_HIGH, density 100 -> load 110)."
            - "Both participations ACTIVE, so review_minutes_consumed is 165."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Industrial Adhesives EMEA", market_code: "EU-ADHES", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25, exposure_budget_points: 100, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/employees"
              payload: { business_unit_id: "${bu_id}", full_name: "Ruth Adeyemi", email: "ruth.adeyemi@example.com", role_category: "SALES" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { emp_id: $.data.id }
            - call: "POST /compliance/training-curricula"
              payload: { code: "AT-SALES-101", title: "Competitor Contact Rules for Sales", target_role_categories: ["SALES", "PRICING"], duration_minutes: 90, validity_days: 365, is_mandatory: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { cur_id: $.data.id }
            - call: "POST /compliance/training-assignments"
              payload: { employee_id: "${emp_id}", curriculum_id: "${cur_id}", due_at: "2026-08-31T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { ta_id: $.data.id }
            - call: "POST /compliance/training-assignments/${ta_id}/start"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /compliance/training-assignments/${ta_id}/completion"
              payload: { score: 91 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /compliance/trade-associations"
              payload: { name: "Benelux Adhesives Forum", approval_tier: "TIER_2_MEDIUM", competitor_density_pct: 25 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { assoc55_id: $.data.id }
            - call: "POST /compliance/trade-associations/${assoc55_id}/approval"
              payload: { decision: "APPROVED" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/trade-associations"
              payload: { name: "European Adhesives Council", approval_tier: "TIER_3_HIGH", competitor_density_pct: 100 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { assoc110_id: $.data.id }
            - call: "POST /compliance/trade-associations/${assoc110_id}/approval"
              payload: { decision: "APPROVED" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/participations"
              payload: { business_unit_id: "${bu_id}", association_id: "${assoc55_id}", employee_id: "${emp_id}", purpose: "Technical committee delegate" }
              as: BusinessLead
              as_user_id: "${bu_id}"
              captures: { part55_id: $.data.id }
            - call: "POST /compliance/participations/${part55_id}/submission"
              payload: {}
              as: BusinessLead
              as_user_id: "${bu_id}"
            - call: "POST /compliance/participations/${part55_id}/legal-clearance"
              payload: { decision: "CLEARED", notes: "Agenda pre-cleared" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/participations/${part55_id}/business-justification"
              payload: { justification: "Only forum where the new bonding standard is drafted" }
              as: BusinessLead
              as_user_id: "${bu_id}"
            - call: "POST /compliance/participations"
              payload: { business_unit_id: "${bu_id}", association_id: "${assoc110_id}", employee_id: "${emp_id}", purpose: "Standards committee observer" }
              as: BusinessLead
              as_user_id: "${bu_id}"
              captures: { part110_id: $.data.id }
            - call: "POST /compliance/participations/${part110_id}/submission"
              payload: {}
              as: BusinessLead
              as_user_id: "${bu_id}"
            - call: "POST /compliance/participations/${part110_id}/legal-clearance"
              payload: { decision: "CLEARED", notes: "Observer only" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
            - call: "POST /compliance/participations/${part110_id}/business-justification"
              payload: { justification: "Standard governs 60 percent of our EMEA line" }
              as: BusinessLead
              as_user_id: "${bu_id}"
          trigger:
            - call: "POST /compliance/participations/${part55_id}/termination"
              payload: { reason: "Forum merged into the European council" }
              as: BusinessLead
              as_user_id: "${bu_id}"
          assert:
            - "before the trigger: BusinessUnit.${bu_id}.review_minutes_consumed == 165"
            - "AssociationParticipation.${part55_id}.status == TERMINATED"
            - "AssociationParticipation.${part55_id}.review_minutes_reserved == 0"
            - "AssociationParticipation.${part55_id}.review_load_minutes == 55"
            - "AssociationParticipation.${part110_id}.status == ACTIVE"
            - "AssociationParticipation.${part110_id}.review_minutes_reserved == 110"
            - "BusinessUnit.${bu_id}.review_minutes_consumed == 110"
