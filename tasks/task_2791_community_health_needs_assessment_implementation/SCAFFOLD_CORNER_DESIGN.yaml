      - name: charge_based_posting_rounds_half_up_at_the_cent
        claim_type: Precision
        grounds:
          - calculations.posting_valued_amount.precision
          - calculations.report_category_totals.constants
        distinguishing_aspect: "Each charge-based posting is rounded half up to whole cents on its own before any summation: 1005 * 0.3200 = 321.6 -> 322 and 1234567 * 0.3200 = 395061.44 -> 395061, so the category total is 395383 and never the 395382 that rounding the summed product would give."
        test_recipe:
          setup:
            - "AssessmentCycle in DRAFT with prior_year_cost_to_charge_ratio 0.3200 and one OPEN CommunityBenefitReport"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep: $.data.id, rep_v: $.data.version }
          trigger:
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1005, direct_cost_cents: 0, expected_report_version: "${rep_v}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep_v2: $.data.version }
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1234567, direct_cost_cents: 0, expected_report_version: "${rep_v2}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "trigger call 1: data.valued_cents == 322 (321.6 rounded half up), ratio_applied == 0.3200"
            - "trigger call 3: data.valued_cents == 395061 (395061.44 truncated by half-up rounding at the cent)"
            - "trigger call 4: data.financial_assistance_cents == 395383 and total_valued_cents == 395383 — per-posting rounding then summation"
            - "trigger call 4: data.valuation_basis == PROVISIONAL and cost_to_charge_ratio == 0.3200"

      - name: cost_based_posting_bypasses_ratio_valuation_entirely
        claim_type: Variant Selection
        grounds:
          - calculations.posting_valued_amount.constants
          - validations.priority_19.ERR_POSTING_BASIS_MISMATCH
        distinguishing_aspect: "The provisional/final ratio variant is selected only for the two charge-based categories: a COMMUNITY_HEALTH_IMPROVEMENT posting is valued at its direct cost with ratio_applied null, so a later audited ratio can never move it."
        test_recipe:
          setup:
            - "AssessmentCycle in DRAFT with prior_year_cost_to_charge_ratio 0.3200 and one OPEN CommunityBenefitReport"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep: $.data.id, rep_v: $.data.version }
          trigger:
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "COMMUNITY_HEALTH_IMPROVEMENT", charges_cents: 0, direct_cost_cents: 850000, expected_report_version: "${rep_v}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "GET /community-benefit-reports/${rep}"
              payload: {}
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "POST /community-benefit-reports/${rep}/finalize"
              payload: { audited_cost_to_charge_ratio: 0.2800 }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /expense-postings"
              payload: { report_id: "${rep}", limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          assert:
            - "trigger call 1: data.valued_cents == 850000 == direct_cost_cents, data.ratio_applied == null, data.valuation_basis_at_posting == PROVISIONAL"
            - "trigger call 2: data.community_health_improvement_cents == 850000, total_valued_cents == 850000, indirect_allocation_cents == 42500 (0.05 tier rate), grand_total_benefit_cents == 892500, benefit_pct_of_expense == 0.74"
            - "trigger call 3: HTTP 200 with data.status == LOCKED, valuation_basis == FINAL and cost_to_charge_ratio == 0.2800"
            - "trigger call 4: the posting's valued_cents is still 850000 — the FINAL variant revalues only charge-based rows"
            - "after finalize the report totals are unchanged (850000 / 42500 / 892500 / 0.74)"

      - name: threshold_algorithm_boundaries_tested_on_both_edges
        claim_type: threshold
        excluded_because:
          difficulty_instance: objective_attainment_exactly_100_marks_met_and_clamps_both_ends
          rationale: "The §1.8 boundary_precision_check instance already probes the MET threshold at 99.92 / exactly 100.00 and both clamps (0.00 floor, 150.00 ceiling) for the objective_attainment threshold calculation."

      - name: tiered_rate_selection_at_each_tier_boundary
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: report_overhead_tier_keyed_on_direct_benefit_not_grand_total
          rationale: "The §1.8 combinatorial_formula instance already asserts the tier boundary on both sides (base 4999999 -> 0.05, base 5000000 -> 0.08) and proves the tier is keyed on the direct benefit base rather than the grand total."

      - name: aggregation_running_total_after_add_and_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: report_total_rounds_per_posting_before_summing
          rationale: "The §1.8 combinatorial_formula instance already verifies the aggregation's running category and grand totals as postings are added, and the compensating-invariant instance covers the reversal direction."

      - name: interval_merge_adjacent_intervals_with_zero_gap
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: interview_adjacent_window_rejected_by_thirty_minute_facilitator_buffer
          rationale: "The §1.8 resource_temporal_overlap instance already tests the zero-gap adjacency case and both strict-inequality edges of the facilitator buffer window."

      - name: interval_merge_disjoint_intervals_preserved
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: partnership_pledge_reused_across_disjoint_windows_but_capped_within_overlap
          rationale: "The §1.8 resource_temporal_overlap instance already shows disjoint half-open pledge windows reusing the same cap while an overlapping window is rejected."

      - name: weighted_scoring_no_rounding_drift_across_terms
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: candidate_disparity_points_capped_by_min_at_100
          rationale: "The §1.8 combinatorial_formula instance already asserts that each weighted term is derived at full precision, capped where declared, and rounded once at the end so no per-term rounding drift accumulates."

      - name: constraint_propagation_reaches_a_fixed_point
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: data_void_cascades_indicator_insufficient_candidate_invalidated_strategy_suspended
          rationale: "The §1.8 transitive_cascade instance already propagates one void through indicator, candidate and strategy state into the recomputed cycle_posture and asserts the settled result."

      - name: variant_divergence_on_identical_inputs
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: candidate_composite_equal_weight_vs_community_weighted_diverges
          rationale: "The §1.8 dual_variant_calc instance already scores one candidate under both weighting variants from identical inputs and asserts the exact delta (76.88 vs 79.00)."

      - name: variant_switch_reconciles_downstream_ledger
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: posting_valuation_provisional_vs_final_ratio_diverges
          rationale: "The §1.8 dual_variant_calc instance already switches a report from the PROVISIONAL to the FINAL ratio at finalize and asserts the revalued postings plus the propagated category, indirect and grand totals."

  - section: validations
    instances:
      - name: duplicate_fiscal_year_and_duplicate_indicator_name_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_18.ERR_DUPLICATE_FISCAL_YEAR
          - validations.priority_18.ERR_DUPLICATE_INDICATOR_NAME
        distinguishing_aspect: "The two uniqueness scopes differ: fiscal_year is unique globally across cycles, while indicator name is unique only within one cycle — so the same indicator name is accepted on a second cycle."
        test_recipe:
          setup:
            - "two AssessmentCycles (fiscal 2026 and 2027) both advanced to DATA_COLLECTION, the 2026 one carrying an indicator named \"Adult depression prevalence\""
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc_a: $.data.id }
            - call: "POST /assessment-cycles/${cyc_a}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc_a}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2027, service_area_name: "Northside District", prior_year_cost_to_charge_ratio: 0.3000, total_operating_expense_cents: 90000000 }
              as: CommunityBenefitOfficer
              captures: { cyc_b: $.data.id }
