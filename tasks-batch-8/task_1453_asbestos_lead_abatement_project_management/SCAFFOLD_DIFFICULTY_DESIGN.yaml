            - "Project.${p_id}.manifested_weight_lbs == 96 while M2 exists in DRAFT (DRAFT excluded)"
            - "Project.${p_id}.manifested_weight_lbs == 96 after M2 voided (create+void pair conserves the total)"
            - "WasteManifest.${m1_id}.fee_cents == 720 (0.048 t x 15000)"

      - name: assignment_create_cancel_conserves_scheduled_hours
        grounds:
          - entities.Worker.fields.assigned_scheduled_hours
          - state_machines.CrewAssignment.SCHEDULED_to_CANCELLED
          - calculations.worker_assigned_hours
        distinguishing_aspect: |
          Conserved quantity is scheduled labor hours (distinct from waste
          mass): creating assignment A2 (96 h) raises assigned_scheduled_hours
          from 216 to 312, and cancelling A2 returns it to exactly 216 — the
          create/cancel pair leaves the worker-level aggregate unchanged.
        test_recipe:
          setup:
            - "Project P ASSESSED; Worker W HANDLER (expiries 2027) with SCHEDULED assignment A1 [2026-08-11, 2026-08-20) = 216.0 hours"
          setup_api_calls:
