  - method: POST
    path: "/comm-services/recipient-numbers"
    description: "Register a recipient number on an account's contact list; returns the server-generated verification_code; ATTORNEY/LEGAL_AID entries auto-enter PRIVILEGE_REQUESTED"
    roles: [AccountHolder, FacilityStaff]
    code: 201
    input: [account_id, e164_number, label, relationship_type]
    output: RecipientNumber
    side_effects: ["verification_status = VERIFICATION_SENT", "verification_code generated and returned", "privilege_status = PRIVILEGE_REQUESTED iff relationship_type IN {ATTORNEY, LEGAL_AID}"]
  - method: GET
    path: "/comm-services/recipient-numbers/{id}"
    description: "Get a recipient number"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: RecipientNumber
    side_effects: []
  - method: GET
    path: "/comm-services/recipient-numbers"
    description: "List recipient numbers (FK reverse-reachability for RecipientNumber.account_id)"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["account_id?", "verification_status?", "block_status?", "privilege_status?", "limit?", "offset?"]
    output: "RecipientNumber[]"
    side_effects: []
  - method: POST
    path: "/comm-services/recipient-numbers/{id}/verify"
    description: "Recipient verifies the number with the code and recording consent; on a BLOCKED number the same call lifts the block (re-consent)"
    roles: [RecipientParty]
    code: 200
    input: [verification_code, consent_to_recording]
    output: RecipientNumber
    side_effects: ["VERIFICATION_SENT -> VERIFIED, or BLOCKED -> NOT_BLOCKED; consent_to_recording = true"]
  - method: POST
    path: "/comm-services/recipient-numbers/{id}/request-block"
    description: "Verified recipient demands a block on calls from this account's inmates"
    roles: [RecipientParty]
    code: 200
    input: ["reason?"]
    output: RecipientNumber
    side_effects: ["block_status NOT_BLOCKED -> BLOCKED"]
  - method: POST
    path: "/comm-services/recipient-numbers/{id}/privilege-decision"
    description: "ComplianceOfficer verifies or revokes attorney privilege (recording exemption)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: RecipientNumber
    side_effects: ["VERIFY: PRIVILEGE_REQUESTED -> PRIVILEGED; REVOKE: PRIVILEGE_REQUESTED|PRIVILEGED -> REVOKED"]

  # --- CallRecord ---
  - method: POST
    path: "/comm-services/calls"
    description: "Connect a call: pins the ACTIVE schedule and cap-min applied rates, resolves recording exemption, checks consent/block then balance"
    roles: [FacilityStaff]
    code: 201
    input: [account_id, inmate_id, recipient_number_id, call_type]
    output: CallRecord
    side_effects: ["status = CONNECTED", "applied rates pinned (effective_rate_snapshot)", "recording_status resolved", "ERR_NUMBER_BLOCKED beats ERR_INSUFFICIENT_BALANCE when both apply"]
  - method: GET
    path: "/comm-services/calls/{id}"
    description: "Get a call record"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: CallRecord
    side_effects: []
  - method: GET
    path: "/comm-services/calls"
    description: "List call records (FK reverse-reachability for all CallRecord FKs)"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["account_id?", "inmate_id?", "facility_id?", "recipient_number_id?", "rate_schedule_id?", "status?", "limit?", "offset?"]
    output: "CallRecord[]"
    side_effects: []
  - method: POST
    path: "/comm-services/calls/{id}/end"
    description: "End a call: duration_seconds == 0 -> NOT_CONNECTED with no charge; > 0 -> COMPLETED with charge per call_charge calc (affordability cutoff may truncate billable minutes)"
    roles: [FacilityStaff]
    code: 200
    input: [duration_seconds]
    output: CallRecord
    side_effects: ["append CALL_CHARGE -total_charge_cents when > 0", "Account.balance_cents recomputed"]

  # --- VideoSession ---
  - method: POST
    path: "/comm-services/video-sessions"
    description: "Request a video visitation session (no charge until confirm; format/window/custody checks at create, capacity/overlap/fiscal checks at confirm)"
    roles: [AccountHolder, FacilityStaff]
    code: 201
    input: [facility_id, inmate_id, account_id, visitor_name, scheduled_start, scheduled_end]
    output: VideoSession
    side_effects: ["status = REQUESTED", "ERR_SESSION_DURATION_INVALID / ERR_SESSION_IN_PAST / ERR_INMATE_NOT_IN_CUSTODY at create"]
  - method: GET
    path: "/comm-services/video-sessions/{id}"
    description: "Get a video session"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: VideoSession
    side_effects: []
  - method: GET
    path: "/comm-services/video-sessions"
    description: "List video sessions (FK reverse-reachability for all VideoSession FKs)"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "inmate_id?", "account_id?", "status?", "limit?", "offset?"]
    output: "VideoSession[]"
    side_effects: []
  - method: POST
    path: "/comm-services/video-sessions/{id}/confirm"
    description: "Staff confirms a requested session: re-validates temporal/capacity/daily-limit rules and charges the video fee"
    roles: [FacilityStaff]
    code: 200
    input: []
    output: VideoSession
    side_effects: ["status -> CONFIRMED", "append VIDEO_CHARGE -charge_cents", "ERR_INMATE_SESSION_OVERLAP beats ERR_FACILITY_CAPACITY_EXCEEDED and ERR_DAILY_SESSION_LIMIT_EXCEEDED when several apply"]
  - method: POST
    path: "/comm-services/video-sessions/{id}/cancel"
    description: "Cancel a session before it starts; CONFIRMED cancellations refund the full fee"
    roles: [AccountHolder, FacilityStaff]
    code: 200
    input: []
    output: VideoSession
    side_effects: ["status -> CANCELLED", "CONFIRMED -> CANCELLED appends VIDEO_REFUND +charge_cents", "ERR_SESSION_NOT_CANCELLABLE once clock >= scheduled_start"]
  - method: POST
    path: "/comm-services/video-sessions/{id}/close-out"
    description: "Staff closes out an ended session as COMPLETED or NO_SHOW (no refund on NO_SHOW)"
    roles: [FacilityStaff]
    code: 200
    input: [outcome]
    output: VideoSession
    side_effects: ["status -> COMPLETED | NO_SHOW", "ERR_SESSION_NOT_ENDED while clock < scheduled_end"]

  # --- TabletMessage ---
  - method: POST
    path: "/comm-services/messages"
    description: "Send a tablet message to an inmate; charges the per-message price at creation (PENDING_REVIEW)"
    roles: [AccountHolder]
    code: 201
    input: [account_id, inmate_id, body_text]
    output: TabletMessage
    side_effects: ["status = PENDING_REVIEW", "append MESSAGE_CHARGE -price_cents", "ERR_MESSAGE_TOO_LONG over 1000 chars"]
  - method: GET
    path: "/comm-services/messages/{id}"
    description: "Get a message"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: TabletMessage
    side_effects: []
  - method: GET
    path: "/comm-services/messages"
    description: "List messages (FK reverse-reachability for TabletMessage.account_id and TabletMessage.inmate_id)"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["account_id?", "inmate_id?", "facility_id?", "status?", "limit?", "offset?"]
    output: "TabletMessage[]"
    side_effects: []
  - method: POST
    path: "/comm-services/messages/{id}/review"
    description: "Content review: APPROVE delivers (charge stands); REJECT refunds the full price"
    roles: [FacilityStaff]
    code: 200
    input: [decision, "review_note?"]
    output: TabletMessage
    side_effects: ["APPROVE -> DELIVERED; REJECT -> REJECTED + MESSAGE_REFUND +price_cents"]

  # --- RefundRequest ---
  - method: GET
    path: "/comm-services/refund-requests/{id}"
    description: "Get a refund request"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: RefundRequest
    side_effects: []
  - method: GET
    path: "/comm-services/refund-requests"
    description: "List refund requests (FK reverse-reachability for RefundRequest.account_id)"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["account_id?", "status?", "source?", "limit?", "offset?"]
    output: "RefundRequest[]"
    side_effects: []
  - method: POST
    path: "/comm-services/refund-requests/{id}/decide"
    description: "ComplianceOfficer approves (computes payout per refund_method variant) or denies (amount becomes unclaimed/escheat-eligible); SoD: staff requester may not self-decide"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "denial_reason?"]
    output: RefundRequest
    side_effects: ["REQUESTED -> APPROVED | DENIED", "DENY with payout > 0 sets account unclaimed_balance_cents and unclaimed_since"]
  - method: POST
    path: "/comm-services/refund-requests/{id}/mark-paid"
    description: "Disburse an APPROVED refund; SoD: payer must differ from decider"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RefundRequest
    side_effects: ["APPROVED -> PAID", "append REFUND_PAYOUT and settling CLOSURE_FEE entries", "account refunded_total_cents / retained_fees_cents updated; ESCHEAT_CLAIM payouts zero the unclaimed balance"]

  # --- Complaint ---
  - method: POST
    path: "/comm-services/complaints"
    description: "File a complaint against a facility (optionally referencing an account or call)"
    roles: [AccountHolder, FacilityStaff]
    code: 201
    input: [facility_id, category, description, "subject_account_id?", "subject_call_id?"]
    output: Complaint
    side_effects: ["status = FILED", "filed_by_user_id / filed_by_role recorded from headers"]
  - method: GET
    path: "/comm-services/complaints/{id}"
    description: "Get a complaint"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: GET
    path: "/comm-services/complaints"
    description: "List complaints (FK reverse-reachability for all Complaint FKs)"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "subject_account_id?", "subject_call_id?", "category?", "status?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: []
  - method: POST
    path: "/comm-services/complaints/{id}/start-review"
    description: "ComplianceOfficer opens review"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status FILED -> UNDER_REVIEW", "reviewed_by_user_id = caller"]
  - method: POST
    path: "/comm-services/complaints/{id}/resolve"
    description: "ComplianceOfficer resolves with a mandatory resolution note"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: Complaint
    side_effects: ["status UNDER_REVIEW -> RESOLVED", "resolved_at = clock"]
  - method: POST
    path: "/comm-services/complaints/{id}/escalate"
    description: "Escalate to the state regulator; allowed only once the complaint is ESCALATION_MIN_AGE_DAYS old"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status UNDER_REVIEW -> ESCALATED_TO_REGULATOR", "escalated_at = clock", "ERR_ESCALATION_TOO_EARLY before the minimum age"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, empty, or not a declared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed role acting on a resource it does not own (AccountHolder != account id, RecipientParty != recipient number id)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: staff requester self-deciding a refund, or refund payer equal to decider" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, out-of-range enum, non-positive amount, COLLECT account without credit limit, missing denial_reason / resolution_note" }
  - { id: ERR_SESSION_DURATION_INVALID, http: 422, condition: "Session end <= start, duration > facility.max_session_minutes, duration < 15 minutes, or start/end on different UTC dates or outside the visiting window" }
  - { id: ERR_SESSION_IN_PAST, http: 422, condition: "Session scheduled_start is not strictly after the logical clock (at create or confirm)" }
  - { id: ERR_MESSAGE_TOO_LONG, http: 422, condition: "Message body exceeds 1000 characters" }
  - { id: ERR_CONSENT_REQUIRED, http: 422, condition: "Verify call with consent_to_recording != true" }
  - { id: ERR_VERIFICATION_CODE_INVALID, http: 422, condition: "Verification code does not match" }
  # --- existence ---
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id does not exist" }
  - { id: ERR_REGULATORY_CAP_NOT_FOUND, http: 404, condition: "RegulatoryCap id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "FacilityContract id does not exist" }
  - { id: ERR_RATE_SCHEDULE_NOT_FOUND, http: 404, condition: "RateSchedule id does not exist" }
  - { id: ERR_INMATE_NOT_FOUND, http: 404, condition: "Inmate id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "Account id does not exist" }
  - { id: ERR_RECIPIENT_NUMBER_NOT_FOUND, http: 404, condition: "RecipientNumber id does not exist" }
  - { id: ERR_CALL_NOT_FOUND, http: 404, condition: "CallRecord id does not exist" }
  - { id: ERR_VIDEO_SESSION_NOT_FOUND, http: 404, condition: "VideoSession id does not exist" }
  - { id: ERR_MESSAGE_NOT_FOUND, http: 404, condition: "TabletMessage id does not exist" }
  - { id: ERR_REFUND_REQUEST_NOT_FOUND, http: 404, condition: "RefundRequest id does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "Complaint id does not exist" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state does not match the transition's required source state" }
  - { id: ERR_FACILITY_NOT_ACTIVE, http: 409, condition: "Facility not ACTIVE for calls, video, messages, deposits; or not ONBOARDING/ACTIVE for contract activation" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Account not ACTIVE for deposits, calls, messages, video creates" }
  - { id: ERR_INMATE_NOT_IN_CUSTODY, http: 409, condition: "Inmate RELEASED: no new calls, sessions, or messages" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Contract not ACTIVE when activating a schedule" }
  - { id: ERR_NO_ACTIVE_CONTRACT, http: 409, condition: "Facility activation or deposit requires an ACTIVE contract" }
  - { id: ERR_NO_ACTIVE_RATE_SCHEDULE, http: 409, condition: "Call connect requires the contract's ACTIVE rate schedule" }
  # --- safety / consent ---
  - { id: ERR_NUMBER_NOT_VERIFIED, http: 409, condition: "Call to a recipient whose verification_status != VERIFIED" }
  - { id: ERR_NUMBER_BLOCKED, http: 409, condition: "Call to a recipient with block_status == BLOCKED; outranks balance failures" }
  # --- temporal ---
  - { id: ERR_INMATE_SESSION_OVERLAP, http: 409, condition: "Inmate already has a CONFIRMED session overlapping [start, end) half-open; outranks capacity/daily-limit failures" }
  - { id: ERR_ESCALATION_TOO_EARLY, http: 409, condition: "Complaint younger than ESCALATION_MIN_AGE_DAYS (7 days)" }
  - { id: ERR_CLAIM_WINDOW_OPEN, http: 409, condition: "Escheat remit attempted before notice + claim_window_days" }
  # --- constraint / capacity ---
  - { id: ERR_FACILITY_CAPACITY_EXCEEDED, http: 409, condition: "Buffered booth-capacity sweep would exceed video_booth_count at some instant" }
  - { id: ERR_DAILY_SESSION_LIMIT_EXCEEDED, http: 409, condition: "Inmate already at the facility's daily CONFIRMED-session limit for that UTC date" }
  - { id: ERR_ACTIVE_CONTRACT_EXISTS, http: 409, condition: "Another contract for the facility is already ACTIVE" }
  - { id: ERR_DUPLICATE_CAP_FOR_STATE, http: 409, condition: "A RegulatoryCap row already exists for state_code" }
  - { id: ERR_DUPLICATE_BOOKING_NUMBER, http: 409, condition: "booking_number already used by an IN_CUSTODY inmate of the facility" }
  - { id: ERR_COMMISSION_EXCEEDS_CAP, http: 409, condition: "commission_pct exceeds RegulatoryCap.max_commission_pct" }
  - { id: ERR_RATE_EXCEEDS_CAP, http: 409, condition: "A schedule rate/fee exceeds the corresponding RegulatoryCap value (rate exactly equal to the cap is allowed)" }
  # --- fiscal ---
  - { id: ERR_INSUFFICIENT_BALANCE, http: 402, condition: "PREPAID/DEBIT balance or COLLECT headroom cannot cover the charge (connect needs connection fee + 1 minute)" }
  - { id: ERR_DEPOSIT_TOO_SMALL, http: 422, condition: "Deposit amount_cents <= the resolved deposit fee (net credit would be <= 0)" }
  - { id: ERR_ACCOUNT_INMATE_MISMATCH, http: 409, condition: "account.inmate_id != the inmate_id supplied for the call/message/session" }
  # --- lifecycle guards ---
  - { id: ERR_ACCOUNT_HAS_ACTIVE_CALLS, http: 409, condition: "Close blocked: a call is still CONNECTED" }
  - { id: ERR_ACCOUNT_HAS_ACTIVE_SESSIONS, http: 409, condition: "Close blocked: a CONFIRMED video session has scheduled_end in the future" }
  - { id: ERR_ACCOUNT_HAS_PENDING_MESSAGES, http: 409, condition: "Close blocked: a message is still PENDING_REVIEW" }
  - { id: ERR_SESSION_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted at or after scheduled_start" }
  - { id: ERR_SESSION_NOT_ENDED, http: 409, condition: "Close-out attempted before scheduled_end" }
  - { id: ERR_REFUND_NOT_PAYABLE, http: 409, condition: "mark-paid on a refund request not in APPROVED" }
  - { id: ERR_ESCHEAT_NOT_CLAIMABLE, http: 409, condition: "claim-unclaimed unless escheat_status IN {DORMANT, NOTICE_SENT}" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_CAP_NOT_CONFIGURED, http: 409, condition: "No RegulatoryCap row exists for the facility's state_code" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Provider platform operator: owns facilities, contracts, rate schedules, the dormancy scan, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /comm-services/facilities, activate, suspend, run-dormancy-scan"
      - "POST /comm-services/contracts, activate, terminate"
      - "POST /comm-services/contracts/{id}/rate-schedules, POST /comm-services/rate-schedules/{id}/activate"
    shared_operations:
      - "POST /comm-services/accounts (with FacilityStaff)"
      - "All GET endpoints"
  - name: StateRegulator
    description: "State regulator: owns the regulatory cap rows for jurisdictions"
    identity: opaque
    exclusive_operations:
      - "POST /comm-services/regulatory-caps"
      - "PUT /comm-services/regulatory-caps/{id}"
    shared_operations:
      - "All GET endpoints"
  - name: FacilityStaff
    description: "Facility operations staff: books and releases inmates, confirms and closes out video sessions, reviews messages, suspends accounts, operates calls"
    identity: opaque
    exclusive_operations:
      - "POST /comm-services/inmates, POST /comm-services/inmates/{id}/release"
      - "POST /comm-services/accounts/{id}/suspend, resume"
      - "POST /comm-services/calls, POST /comm-services/calls/{id}/end"
      - "POST /comm-services/video-sessions/{id}/confirm, close-out"
      - "POST /comm-services/messages/{id}/review"
    shared_operations:
      - "POST /comm-services/accounts, deposits, close, recipient-numbers, video-sessions create/cancel, complaints (with AccountHolder)"
      - "All GET endpoints"
  - name: AccountHolder
    description: "Friend/family member or the inmate acting on their own account; X-User-ID equals the Account id"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /comm-services/accounts/{id}/claim-unclaimed"
      - "POST /comm-services/messages"
    shared_operations:
      - "POST /comm-services/accounts/{id}/deposits, close (self only)"
      - "POST /comm-services/recipient-numbers (own account_id), video-sessions create/cancel (own account_id), complaints (own facility/subject)"
      - "All GET endpoints"
  - name: RecipientParty
    description: "The called party managing their own number record; X-User-ID equals the RecipientNumber id"
    identity: "entity_backed:RecipientNumber"
    exclusive_operations:
      - "POST /comm-services/recipient-numbers/{id}/verify"
      - "POST /comm-services/recipient-numbers/{id}/request-block"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Provider compliance: decides and disburses refunds under segregation of duties, runs escheat notice/remittance, decides attorney privilege, works complaints"
    identity: opaque
    exclusive_operations:
      - "POST /comm-services/refund-requests/{id}/decide, mark-paid"
      - "POST /comm-services/accounts/{id}/send-escheat-notice, remit-escheat"
      - "POST /comm-services/recipient-numbers/{id}/privilege-decision"
      - "POST /comm-services/complaints/{id}/start-review, resolve, escalate"
    shared_operations:
      - "All GET endpoints"
