          - state_machines.HomeboundCase.service_status.EXTENSION_PENDING_to_ACTIVE
          - state_machines.ExtensionRequest.UNDER_REVIEW_to_APPROVED
          - entities.HomeboundCase.fields.funding_status
          - calculations.weekly_entitlement_minutes
        distinguishing_aspect: |
          The service_status dimension leaves ACTIVE, sits in EXTENSION_PENDING and returns to ACTIVE —
          a genuine cycle, not a forward-only path — while the parallel funding_status dimension stays
          ACCRUING across every step, and the return trip carries a payload the outbound trip did not:
          certified_end_date 2026-11-06, extension_count 1 and weekly_entitled_minutes 420.
