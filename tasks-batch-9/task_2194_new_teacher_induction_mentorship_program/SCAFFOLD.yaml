  # --- MentorMatch ------------------------------------------------------------
  - method: POST
    path: "/mentor-matches"
    description: "Propose a mentor-novice pairing. When mentor_id is omitted the mentor_auto_selection policy chooses one; expected_mentor_version guards against acting on a stale view of the mentor and, on the auto-selection path, is compared against the version of the mentor the ranking selects."
    roles: [ProgramAdmin, SiteInductionLead]
    code: 201
    input: ["novice_id", "expected_mentor_version", "mentor_id?"]
    output: MentorMatch
    side_effects: ["match_status initialised to PROPOSED", "selection_mode set to EXPLICIT or AUTO_SELECTED", "subject_match_tier and site_match computed", "pinned_stipend_rate_cents_per_hour left null at creation \u2014 the rate is pinned only by the PROPOSED->ACTIVE transition", "Mentor.version incremented", "NoviceTeacher.program_status ENROLLED->MATCHED"]
  - method: GET
    path: "/mentor-matches/{id}"
    description: "Retrieve one mentor-novice match including its pinned stipend rate and accrued stipend."
    roles: [ProgramAdmin, SiteInductionLead, Mentor, NoviceTeacher, StateCredentialingOfficer]
    code: 200
    input: []
    output: MentorMatch
    side_effects: []
  - method: GET
    path: "/mentor-matches"
    description: "List matches, optionally filtered by mentor, novice or status. Reverse lookup for MentorMatch.mentor_id -> Mentor.id and MentorMatch.novice_id -> NoviceTeacher.id."
    roles: [ProgramAdmin, SiteInductionLead, Mentor, StateCredentialingOfficer]
    code: 200
    input: ["mentor_id?", "novice_id?", "match_status?", "limit?", "offset?"]
    output: "MentorMatch[]"
    side_effects: []
  - method: POST
    path: "/mentor-matches/{id}/disposition"
    description: "Dispose of a proposed or live match: ACTIVATE, REJECT, SUSPEND, RESUME or END."
    roles: [ProgramAdmin, SiteInductionLead]
    code: 200
    input: ["decision", "reason?"]
    output: MentorMatch
    side_effects: ["match_status transition per §1.2", "ACTIVATE stamps activated_at, increments Mentor.active_caseload_count and Site.active_match_count, and moves NoviceTeacher.program_status MATCHED->ACTIVE", "REJECT moves NoviceTeacher.program_status MATCHED->ENROLLED", "END stamps ended_at, decrements both counters, abandons every non-terminal ObservationCycle on the match, and moves NoviceTeacher.program_status ACTIVE->MATCHED or ->ENROLLED"]

  # --- ContactLog -------------------------------------------------------------
  - method: POST
    path: "/contact-logs"
    description: "Submit a mentoring contact record against an active match for later verification."
    roles: [Mentor, SiteInductionLead]
    code: 201
    input: ["match_id", "contact_date", "minutes", "contact_type", "description"]
    output: ContactLog
    side_effects: ["verification_status initialised to SUBMITTED", "submitted_by_user_id stamped from X-User-ID", "credited_minutes and stipend_cents initialised to 0", "resubmit_count initialised to 0", "Mentor.stipend_accrued_cents refreshed through the provisional_accrual variant"]
  - method: GET
    path: "/contact-logs/{id}"
    description: "Retrieve one contact log including its credited minutes and the rate and multiplier pinned at verification."
    roles: [ProgramAdmin, SiteInductionLead, Mentor, NoviceTeacher, StateCredentialingOfficer]
    code: 200
    input: []
    output: ContactLog
    side_effects: []
  - method: GET
    path: "/contact-logs"
    description: "List contact logs, optionally filtered by match, verification status or contact date. Reverse lookup for ContactLog.match_id -> MentorMatch.id."
    roles: [ProgramAdmin, SiteInductionLead, Mentor, StateCredentialingOfficer]
    code: 200
    input: ["match_id?", "verification_status?", "contact_date?", "limit?", "offset?"]
    output: "ContactLog[]"
    side_effects: []
  - method: POST
    path: "/contact-logs/{id}/review"
    description: "Verify, dispute or reject a submitted contact log. The reviewing user may not be the user who submitted it."
    roles: [ProgramAdmin, SiteInductionLead]
    code: 200
    input: ["decision", "note?"]
    output: ContactLog
    side_effects: ["verification_status transition per §1.2", "VERIFY computes credited_minutes, pins rate_tier_at_verification and cert_multiplier_at_verification, computes stipend_cents, stamps verified_by_user_id and verified_at, adds credited_minutes to MentorMatch.verified_minutes_total, Mentor.verified_minutes_lifetime and NoviceTeacher.verified_contact_minutes, adds stipend_cents to MentorMatch.accrued_stipend_cents and Mentor.stipend_accrued_cents, and recomputes novice_readiness_index and the license_advancement_status gate", "DISPUTE and REJECT refresh Mentor.stipend_accrued_cents downward"]
  - method: POST
    path: "/contact-logs/{id}/resubmit"
    description: "Correct and resubmit a disputed contact log, at most twice."
    roles: [Mentor]
    code: 200
    input: ["minutes", "contact_type", "description"]
    output: ContactLog
    side_effects: ["verification_status DISPUTED->SUBMITTED", "submitted_by_user_id restamped from X-User-ID", "resubmit_count incremented", "dispute_reason cleared", "Mentor.stipend_accrued_cents refreshed through the provisional_accrual variant"]
  - method: POST
    path: "/contact-logs/{id}/void"
    description: "Void an already verified contact log, reversing every credited minute and every cent it produced. Head of the four-hop compensating cascade."
    roles: [ProgramAdmin]
    code: 200
    input: ["void_reason"]
    output: ContactLog
    side_effects: ["verification_status VERIFIED->VOIDED and void_reason recorded", "CASCADE hop 1: credited_minutes subtracted from MentorMatch.verified_minutes_total, Mentor.verified_minutes_lifetime and NoviceTeacher.verified_contact_minutes; stipend_cents subtracted from MentorMatch.accrued_stipend_cents and Mentor.stipend_accrued_cents; novice_readiness_index recomputed; the log's own credited_minutes and stipend_cents are reset to 0 while void_reason preserves the audit trail", "CASCADE hop 2: every ATTAINED MilestoneAttainment of the novice whose milestone requirements the reduced counters no longer satisfy transitions ATTAINED->REVOKED with revoke_reason EVIDENCE_WITHDRAWN, processed Milestone.sequence_index ASC", "CASCADE hop 3: revoking a milestone with gates_license_recommendation == true drives license_advancement_status RECOMMENDED->NOT_ELIGIBLE and license_stage back to PRELIMINARY", "CASCADE hop 4: every SUBMITTED_TO_STATE CompletionCertification of the novice transitions to RETURNED with return_reason EVIDENCE_REVOKED"]

  # --- ObservationCycle -------------------------------------------------------
  - method: POST
    path: "/observation-cycles"
