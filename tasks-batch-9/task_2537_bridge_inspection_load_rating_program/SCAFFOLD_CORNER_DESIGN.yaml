          - errors.ERR_RATING_STATE_INVALID
        distinguishing_aspect: "The cascade-created plan starts in REQUIRED, and REQUIRED -> SUBMITTED is not a declared edge: submit returns 409 ERR_RATING_STATE_INVALID until a PUT has moved the plan to DRAFT, so a scour-critical bridge cannot be made poa_compliant by submitting an empty plan."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Rita Rating licensed; Cedar Creek Bridge spans water; one FINAL scour_code 2 evaluation, whose HOP 3 created a PlanOfAction in status REQUIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
