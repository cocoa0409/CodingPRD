      - name: every_catalog_error_has_a_trigger_including_the_timestamp_guard
        claim_type: triggerability
        grounds:
          - errors[ERR_FUTURE_TIMESTAMP]
          - validations[priority=43]
          - validations[priority=5]
        distinguishing_aspect: "ERR_FUTURE_TIMESTAMP is the one catalog error no other instance reaches, and it fires on three distinct shapes — a future occurred_at, a notified_at that precedes it, and a future demand_received_at — while a malformed timestamp still loses to the priority-5 shape rule."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One Terminal and one Driver."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Lima Terminal", terminal_code: "LIM03", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-6101", full_name: "Hanne Broekhuis", cdl_number: "OH-CDL-6101", hire_date: "2014-08-08" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-08-01T00:00:01Z", notified_at: "2026-08-01T00:00:01Z", location_text: "I-75 MM 125", severity: "MINOR", route_class: "LINEHAUL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_future_occurred: $.data.error_id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-31T06:00:00Z", notified_at: "2026-07-31T05:59:59Z", location_text: "I-75 MM 126", severity: "MINOR", route_class: "LINEHAUL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_notified_before: $.data.error_id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-08-01", notified_at: "2026-08-01T00:00:01Z", location_text: "I-75 MM 127", severity: "MINOR", route_class: "LINEHAUL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_shape_first: $.data.error_id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-08-01T00:00:00Z", notified_at: "2026-08-01T00:00:00Z", location_text: "I-75 MM 128", severity: "MODERATE", route_class: "LINEHAUL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_ok: $.data.id, occ_ok: $.data.occurred_at }
            - call: "POST /claims"
              payload: { crash_id: "${c_ok}", claimant_notice_date: "2026-08-01" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_id: $.data.id }
            - call: "POST /claims/${cl_id}/demands"
              payload: { claimant_name: "Ivo Marchetti", claimant_type: "THIRD_PARTY_PROPERTY", demand_amount_cents: 400000, represented_by_counsel: false, demand_received_at: "2026-08-01T00:00:01Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { e_future_demand: $.data.error_id }
            - call: "POST /claims/${cl_id}/demands"
              payload: { claimant_name: "Ivo Marchetti", claimant_type: "THIRD_PARTY_PROPERTY", demand_amount_cents: 400000, represented_by_counsel: false, demand_received_at: "2026-08-01T00:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { dm_id: $.data.id, recv_ok: $.data.demand_received_at }
            - call: "GET /crashes"
              payload: { terminal_id: "${t_id}", limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { crash_page: $.data }
            - call: "GET /claims/${cl_id}/demands"
              payload: { limit: 10, offset: 0 }
              as: Auditor
              as_user_id: "aud-001"
              captures: { demand_page: $.data }
          assert:
            - "${e_future_occurred} == ERR_FUTURE_TIMESTAMP with HTTP 409 — one second past the logical clock is already the future"
            - "${e_notified_before} == ERR_FUTURE_TIMESTAMP with HTTP 409 — the same error covers a notification that precedes the crash it notifies, so this catalog entry guards an ordering rule as well as a ceiling"
            - "${e_shape_first} == ERR_INVALID_REQUEST with HTTP 400 — a date-only occurred_at is a shape violation at priority 5 and never reaches the priority-43 temporal rule, even though notified_at is also in the future in that same body"
            - "${occ_ok} == 2026-08-01T00:00:00Z — occurred_at exactly equal to current_utc is accepted, so the bound is <= and not <"
            - "${recv_ok} == 2026-08-01T00:00:00Z and ${dm_id} is created — demand_received_at is bounded by the same clock with the same inclusive edge"
            - "${e_future_demand} == ERR_FUTURE_TIMESTAMP with HTTP 409, and ${demand_page} has exactly 1 row (${dm_id}) — the rejected demand left no row behind"
            - "${crash_page} has exactly 1 row (${c_ok}) with total_count 1 — the three rejected crash bodies created nothing"
            - "Catalog census: with ERR_FUTURE_TIMESTAMP triggered here, ERR_CLAIM_VERSION_STALE and ERR_REVIEW_CASE_VERSION_STALE triggered by stale_expected_version_is_refused_on_both_occ_write_endpoints, ERR_UNAUTHENTICATED and ERR_UNAUTHORIZED by each_role_is_confined_to_its_own_exclusive_operations, and ERR_SEGREGATION_OF_DUTIES by the_deciding_manager_may_not_grant_the_appeal, every one of the 63 catalog errors is reached by at least one §1.8 or §1.9 instance"

