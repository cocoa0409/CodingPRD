      - call: POST /rtw/placements
        payload:
          restriction_set_id: ${rs_id}
          transitional_job_id: ${job_id}
          start_date: '2026-08-03'
          end_date: '2026-08-28'
          scheduled_hours_per_day: 4
          expected_restriction_set_version: ${rs_v}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          pl_id: $.data.id
          risk_at_create: $.data.reinjury_risk_score
          variant_at_create: $.data.reinjury_risk_variant
      - call: POST /rtw/placements/${pl_id}/submit-to-adjuster
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          dir_id: $.data.current_adjuster_directive_id
      - call: POST /rtw/adjuster-directives/${dir_id}/decide
        payload:
