            - "EconomicImpactEstimate.${est_final_id}.exhibitor_spend_amount == 950000.00"
            - "EconomicImpactEstimate.${est_final_id}.direct_spend_amount == 1611973.70"
            - "${final_total} == 2659756.61"
            - "${final_yield} == 31580.06"
            - "${prov_total} == 9741930.00"
            - "${prov_yield} == 59130.00"
            - "${prov_total} != ${final_total}"

