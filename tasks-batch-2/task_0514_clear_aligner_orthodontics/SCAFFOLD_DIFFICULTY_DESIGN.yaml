              payload: {}
              as: Patient
              as_user_id: "${pat14}"
            - call: "POST /plans"
              payload: { case_id: "${case14}", author_clinician_id: "${clin_id}", proposed_step_count: 14, weeks_per_step: 2 }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { plan14: $.data.id }
            - call: "POST /plans/${plan14}/submit"
              payload: {}
              as: Clinician
              as_user_id: "${clin_id}"
          trigger:
            - call: "POST /plans/${plan14}/approve"
              payload: {}
