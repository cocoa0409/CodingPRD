  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: sample_mass_conserved_across_reserve_settle_cancel
        grounds:
          - calculations.sample_ledger
          - state_machines.LabAnalysis.SCHEDULED_to_CANCELLED
          - state_machines.LabAnalysis.SAMPLE_SHIPPED_to_RESULT_RECORDED
        distinguishing_aspect: |
          Conserved quantity: sample mass. At every step the pinned invariant
          initial == remaining + reserved(active) + consumed(resulted) holds;
          the forward action (reserve 5) paired with its compensating action
          (CANCEL refund 5) leaves remaining_sample_ng exactly where the
          reservation found it, and a partial consumption (12 of 15) refunds
          the difference rather than drifting.
        test_recipe:
          setup:
            - "Case in TESTING with SIGNED agreement; evidence item initial_sample_ng 25, remaining 25."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /jurisdictions"
              payload: { state_code: "TN", name: "Tennessee", has_post_conviction_dna_statute: true, clemency_available: true, compensation_statute_exists: true }
              as: PlatformAdmin
