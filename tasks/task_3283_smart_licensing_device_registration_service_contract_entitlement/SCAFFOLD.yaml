  - { method: GET, path: "/api/devices/{id}/coverages", description: "List contract coverages of a device", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "ContractCoverage[]", side_effects: [] }
  - { method: GET, path: "/api/devices/{id}/rma-cases", description: "List RMA cases of a device", roles: [PlatformAdmin, AccountAdmin, PartnerManager, LogisticsAgent], code: 200, input: ["limit?", "offset?"], output: "RmaCase[]", side_effects: [] }
  - { method: POST, path: "/api/devices/{id}/usage-reports", description: "Submit a usage report from a REGISTERED device; accepted reports reconcile pool consumption", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 201, input: [reported_at, lines], output: UsageReport, side_effects: ["on ACCEPT: applies pool_consumed_quantity reconciled variant per referenced pool", "updates Device.last_sync_at", "may trigger LicensePool COMPLIANT -> IN_GRACE and posture recompute", "on staleness: creates REJECTED report row with rejection_reason, mutates nothing"] }
  - { method: POST, path: "/api/license-assignments", description: "Assign license units from a pool to a REGISTERED device", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 201, input: [device_id, license_pool_id, quantity], output: DeviceLicenseAssignment, side_effects: ["recomputes pool consumed/compliance via pool_consumed_quantity", "may trigger COMPLIANT -> IN_GRACE cascade and posture recompute", "assignments allowed to exceed purchased (creates overage); never blocked by balance"] }
  - { method: POST, path: "/api/license-assignments/{id}/release", description: "Release an assignment", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: DeviceLicenseAssignment, side_effects: ["status ACTIVE -> RELEASED", "recomputes pool consumed/compliance and posture", "increments DeviceLicenseAssignment.version by 1"] }
  - { method: POST, path: "/api/lifecycle-milestones", description: "Declare an EOL/EOS/EOST milestone for a product family", roles: [PlatformAdmin], code: 201, input: [product_family, milestone_type, effective_date], output: ProductLifecycleMilestone, side_effects: [] }
  - { method: GET, path: "/api/lifecycle-milestones", description: "List milestones; filterable by product_family", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["product_family?", "limit?", "offset?"], output: "ProductLifecycleMilestone[]", side_effects: [] }
  - { method: POST, path: "/api/service-contracts", description: "Create a service contract on a smart account", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 201, input: [smart_account_id, contract_number, service_level, support_tier, start_date, end_date], output: ServiceContract, side_effects: [] }
  - { method: GET, path: "/api/service-contracts/{id}", description: "Get one contract", roles: [PlatformAdmin, AccountAdmin, PartnerManager, LogisticsAgent], code: 200, input: [], output: ServiceContract, side_effects: [] }
  - { method: POST, path: "/api/service-contracts/{id}/cancel", description: "Cancel an ACTIVE contract with no open RMA; voids its coverages", roles: [PlatformAdmin, AccountAdmin], code: 200, input: [], output: ServiceContract, side_effects: ["ContractCoverage ACTIVE -> VOIDED", "status ACTIVE -> CANCELLED", "increments ServiceContract.version by 1"] }
  - { method: GET, path: "/api/service-contracts/{id}/coverages", description: "List coverages of a contract", roles: [PlatformAdmin, AccountAdmin, PartnerManager, LogisticsAgent], code: 200, input: ["limit?", "offset?"], output: "ContractCoverage[]", side_effects: [] }
  - { method: POST, path: "/api/contract-coverages", description: "Attach a device serial to a contract", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 201, input: [service_contract_id, device_id], output: ContractCoverage, side_effects: ["sets covered_from to logical clock"] }
  - { method: GET, path: "/api/contract-coverages/{id}", description: "Get one coverage row", roles: [PlatformAdmin, AccountAdmin, PartnerManager, LogisticsAgent], code: 200, input: [], output: ContractCoverage, side_effects: [] }
  - { method: GET, path: "/api/contract-coverages/{id}/rma-cases", description: "List RMA cases opened under a coverage", roles: [PlatformAdmin, AccountAdmin, PartnerManager, LogisticsAgent], code: 200, input: ["limit?", "offset?"], output: "RmaCase[]", side_effects: [] }
  - { method: POST, path: "/api/contract-coverages/{id}/release", description: "Release an active coverage with no open RMA", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: ContractCoverage, side_effects: ["status ACTIVE -> RELEASED", "increments ContractCoverage.version by 1"] }
  - { method: POST, path: "/api/rma-cases", description: "Open an RMA case under an active hardware-capable coverage; branch picked from contract service_level; computes ship_by SLA", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 201, input: [contract_coverage_id, failure_description], output: RmaCase, side_effects: ["computes ship_by per rma_ship_by", "sets opened_at to logical clock"] }
  - { method: GET, path: "/api/rma-cases/{id}", description: "Get one RMA case; lazily re-evaluates sla_breached", roles: [PlatformAdmin, AccountAdmin, PartnerManager, LogisticsAgent], code: 200, input: [], output: RmaCase, side_effects: ["lazy sla_breached evaluation per rma_ship_by / depot_return_sla"] }
  - { method: POST, path: "/api/rma-cases/{id}/ship-replacement", description: "Ship replacement unit (branch-aware)", roles: [PlatformAdmin, LogisticsAgent], code: 200, input: [], output: RmaCase, side_effects: ["OPENED -> REPLACEMENT_SHIPPED (ADVANCE) or DEFECTIVE_RETURNED -> REPLACEMENT_SHIPPED (DEPOT)", "sets sla_breached if past ship_by", "increments RmaCase.version by 1"] }
  - { method: POST, path: "/api/rma-cases/{id}/confirm-delivery", description: "Confirm replacement delivered", roles: [PlatformAdmin, LogisticsAgent], code: 200, input: [], output: RmaCase, side_effects: ["REPLACEMENT_SHIPPED -> REPLACEMENT_DELIVERED", "records delivered_at", "increments RmaCase.version by 1"] }
  - { method: POST, path: "/api/rma-cases/{id}/receive-defective", description: "Receive the defective unit back (branch-aware)", roles: [PlatformAdmin, LogisticsAgent], code: 200, input: [], output: RmaCase, side_effects: ["OPENED -> DEFECTIVE_RETURNED (DEPOT) or REPLACEMENT_DELIVERED -> DEFECTIVE_RETURNED (ADVANCE)", "sets sla_breached per depot_return_sla on ADVANCE branch", "increments RmaCase.version by 1"] }
  - { method: POST, path: "/api/rma-cases/{id}/close", description: "Close an RMA whose defective unit has returned", roles: [PlatformAdmin, LogisticsAgent], code: 200, input: [], output: RmaCase, side_effects: ["DEFECTIVE_RETURNED -> CLOSED", "increments RmaCase.version by 1"] }
  - { method: POST, path: "/api/rma-cases/{id}/cancel", description: "Cancel an OPENED RMA", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: RmaCase, side_effects: ["OPENED -> CANCELLED", "increments RmaCase.version by 1"] }
  - { method: POST, path: "/api/license-transfer-requests", description: "Request a license transfer (hardware refresh, reorg, or partner exit)", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 201, input: [source_pool_id, target_virtual_account_id, quantity, reason], output: LicenseTransferRequest, side_effects: ["records requested_by_partner_org_id when actor is PartnerManager"] }
  - { method: GET, path: "/api/license-transfer-requests/{id}", description: "Get one transfer request", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: LicenseTransferRequest, side_effects: [] }
  - { method: GET, path: "/api/license-transfer-requests", description: "List transfer requests; filterable by source_pool_id, target_virtual_account_id, requested_by_partner_org_id, status", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["source_pool_id?", "target_virtual_account_id?", "requested_by_partner_org_id?", "status?", "limit?", "offset?"], output: "LicenseTransferRequest[]", side_effects: [] }
  - { method: POST, path: "/api/license-transfer-requests/{id}/approve", description: "Approve a pending transfer with OCC; partner-initiated requests require account-side approver", roles: [PlatformAdmin, AccountAdmin], code: 200, input: [expected_transfer_version], output: LicenseTransferRequest, side_effects: ["PENDING_APPROVAL -> APPROVED", "records decided_by", "increments LicenseTransferRequest.version by 1"] }
  - { method: POST, path: "/api/license-transfer-requests/{id}/reject", description: "Reject a pending transfer", roles: [PlatformAdmin, AccountAdmin], code: 200, input: [], output: LicenseTransferRequest, side_effects: ["PENDING_APPROVAL -> REJECTED", "records decided_by", "increments LicenseTransferRequest.version by 1"] }
  - { method: POST, path: "/api/license-transfer-requests/{id}/cancel", description: "Cancel a pending transfer by the requesting side", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: LicenseTransferRequest, side_effects: ["PENDING_APPROVAL -> CANCELLED", "increments LicenseTransferRequest.version by 1"] }
  - { method: POST, path: "/api/license-transfer-requests/{id}/execute", description: "Execute an approved transfer; re-validates balance and target state, applies transfer_recompute", roles: [PlatformAdmin], code: 200, input: [], output: LicenseTransferRequest, side_effects: ["APPROVED -> EXECUTED", "applies transfer_recompute across source and target pools", "increments LicenseTransferRequest.version by 1"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or PartnerManager lacks an ACTIVE delegation with adequate scope over the target smart account" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or enum value outside declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Owning SmartAccount is SUSPENDED or CLOSED for a mutation requiring ACTIVE" }
  - { id: ERR_ACCOUNT_NON_COMPLIANT, http: 409, condition: "Device activation blocked because owning SmartAccount.compliance_posture == NON_COMPLIANT" }
  - { id: ERR_PRODUCT_END_OF_LIFE, http: 409, condition: "Device activation blocked by an in-effect END_OF_LIFE milestone for the product family" }
  - { id: ERR_PRODUCT_END_OF_SUPPORT, http: 422, condition: "Coverage attachment blocked by an in-effect END_OF_SUPPORT milestone for the device product family" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Partner-initiated transfer request cannot be approved by the partner side" }
  - { id: ERR_CONTRACT_WINDOW_INVALID, http: 422, condition: "end_date <= start_date, or coverage attach outside [start_date, end_date), or contract not ACTIVE" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "Device already has an ACTIVE ContractCoverage row" }
  - { id: ERR_REPORT_POOL_MISMATCH, http: 422, condition: "UsageReport line references a LicensePool outside the device's VirtualAccount" }
  - { id: ERR_STALE_REPORT, http: 422, condition: "UsageReport.reported_at earlier than the device's last accepted report" }
  - { id: ERR_INSUFFICIENT_TRANSFERABLE, http: 422, condition: "Source pool un-consumed balance below requested transfer quantity" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "Purchase adjustment would drive purchased_quantity below 0, or quantity field < its floor" }
  - { id: ERR_NO_ACTIVE_COVERAGE, http: 422, condition: "RMA creation requires ACTIVE coverage on an ACTIVE in-window hardware-capable contract" }
  - { id: ERR_RMA_BRANCH_VIOLATION, http: 409, condition: "RMA transition inconsistent with the contract's service_level branch" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness constraint violated (account_ref, partner_ref, contract_number, serial_number, scoped name/sku)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_TIER_DOWNGRADE_FORBIDDEN, http: 422, condition: "tier-upgrade target is not strictly above the current feature_tier (ESSENTIALS < ADVANTAGE < PREMIER)" }

roles:
  - name: PlatformAdmin
    description: "Vendor-side operator with full reach; executes transfers and manages lifecycle milestones, accounts, partners"
    identity: opaque
    exclusive_operations: ["clock set", "smart-account create/suspend/reactivate/close", "partner-org create", "lifecycle-milestone create", "transfer execute"]
    shared_operations: ["all read endpoints", "pool/device/contract/coverage/rma mutations"]
  - name: AccountAdmin
    description: "Customer-side administrator of one SmartAccount (X-User-ID equals the SmartAccount.id they administer)"
    identity: "entity_backed:SmartAccount"
    exclusive_operations: ["approve/reject transfer requests (account side)", "grant/revoke partner delegations"]
    shared_operations: ["virtual-account/pool/device/assignment/contract/coverage/rma-create mutations within own account"]
  - name: PartnerManager
    description: "Partner-side administrator; acts on customer accounts only through an ACTIVE PartnerDelegation whose scope covers the operation (X-User-ID equals PartnerOrg.id)"
    identity: "entity_backed:PartnerOrg"
    exclusive_operations: ["initiate transfer requests as partner (recorded in requested_by_partner_org_id)"]
    shared_operations: ["delegated pool/device/contract/coverage mutations per delegation scope"]
  - name: LogisticsAgent
    description: "Warehouse/logistics operator for RMA physical transitions"
    identity: opaque
    exclusive_operations: ["rma ship-replacement", "rma confirm-delivery", "rma receive-defective", "rma close"]
    shared_operations: ["read devices, rma-cases, contracts, coverages"]











