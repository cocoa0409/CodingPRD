              as_user_id: "ic-1"
            - call: "POST /governance/service-provider-engagements/${eng_aud_id}/benchmark"
              payload: { benchmark_percentile: 74 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/service-provider-engagements/${eng_cus_id}/benchmark"
