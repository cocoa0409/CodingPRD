                code: "EP_COND"
                display_name: "Conditional Action Feed"
                channel_type: "APP"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
