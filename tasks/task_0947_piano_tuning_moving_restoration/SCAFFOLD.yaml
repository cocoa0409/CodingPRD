      - name: allocated_qty
        type: integer
        source: computed
        default: 0
        description: Units reserved to open allocations.
      - name: consumed_qty
        type: integer
        source: computed
        default: 0
        description: Units permanently consumed.
      - name: status
        type: enum
        source: system
        default: OPEN
        constraints: "one of OPEN, DEPLETED"
