scaffold_corner_design:
- section: entities
  instances:
  - name: center_create_returns_every_declared_field_and_starts_open
    claim_type: Creation
    grounds:
    - entities.FulfillmentCenter
    - endpoints.POST_/produce/fulfillment-centers
    distinguishing_aspect: A center created with only code, name, region and insulation_profile comes back 201 with forward_posture OPEN, serving_cycle_index 0, open_claim_count 0, is_active true, max_concurrent_building_cycles 1 and version 1, none of which the client supplied.
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: LONE-1
          name: Lone Star Center
          region: SO
          insulation_profile: LIGHT
        as: PlatformAdmin
      trigger:
      - call: GET /produce/fulfillment-centers?region=SO
        payload: {}
        as: PlatformAdmin
        captures:
          x: $.data[0].id
      assert:
      - the create returns 201 and response_type object
      - the created FulfillmentCenter has forward_posture == OPEN
      - the created FulfillmentCenter has serving_cycle_index == 0 and open_claim_count == 0
      - the created FulfillmentCenter has is_active == true and max_concurrent_building_cycles == 1
      - the created FulfillmentCenter has version == 1 and non-null id and created_at
      - meta.api_request_id and meta.api_request_timestamp are both present
  - name: supplier_create_starts_preferred_with_a_perfect_score
    claim_type: Creation
    grounds:
    - entities.Supplier
    - endpoints.POST_/produce/suppliers
    distinguishing_aspect: A brand-new Supplier carries the four lifetime counters at 0 and still reads reliability_score_bp 10000 with relationship_status PREFERRED, because the quality ratio's zero-denominator guard pins quality_bp to 10000 rather than leaving the row unscored.
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /produce/suppliers
        payload:
          name: Green Start Farms
          region: MW
        as: PlatformAdmin
        captures:
          gs_s: $.data.id
      trigger:
      - call: GET /produce/suppliers/${gs_s}
        as: PlatformAdmin
      assert:
      - the create returns 201
      - Supplier.${gs_s}.status == ACTIVE
      - Supplier.${gs_s}.lots_awarded_total == 0 and lots_accepted_total == 0
      - Supplier.${gs_s}.reliability_score_bp == 10000
      - Supplier.${gs_s}.relationship_status == PREFERRED
  - name: supply_lot_read_returns_the_computed_billing_weight_and_display_price
    claim_type: Retrieval
    grounds:
    - entities.SupplyLot.fields.display_price_cents
    - entities.SupplyLot.fields.billing_weight_grams
    - calculations.display_price_markup
    distinguishing_aspect: 'Every computed lot field round-trips through the read: a FRUIT lot at unit_weight 100 and unit_cost 300 reads billed weight 120 (clamped to the FRUIT floor) and a display price of 450 (the OFF_SPEC multiplier of 300), neither of which was supplied.'
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. One center, supplier and lot CL1 (FRUIT, unit_weight 100, unit_cost 300) awarded and PASS.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-SO
          name: Demo Center
          region: SO
          insulation_profile: LIGHT
          max_concurrent_building_cycles: 5
        as: PlatformAdmin
        captures:
          cl_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Supply Co CL
          region: SO
        as: PlatformAdmin
        captures:
          cl_s: $.data.id
      - call: POST /produce/suppliers/${cl_s}/lots
        payload:
          fulfillment_center_id: ${cl_c}
          product_name: CL1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 300
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          cl_l: $.data.id
          cl_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${cl_l}
          supplier_id: ${cl_s}
          bid_unit_cost_cents: 300
          quantity_offered: 300
        as: Supplier
        as_user_id: ${cl_s}
      - call: POST /produce/supply-lots/${cl_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${cl_lv}
        as: PlatformAdmin
        captures:
          cl_lv2: $.data.version
      - call: POST /produce/supply-lots/${cl_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${cl_lv2}
        as: PlatformAdmin
      trigger:
      - call: GET /produce/supply-lots/${cl_l}
        as: PlatformAdmin
      assert:
      - the read returns 200
      - SupplyLot.${cl_l}.billing_weight_grams == 120 (clamped up from 100 by the FRUIT floor)
      - SupplyLot.${cl_l}.display_price_cents == 450
      - SupplyLot.${cl_l}.shelf_life_days == 19
      - SupplyLot.${cl_l}.preference_eligible == false (preference_tags is the default empty array)
      - SupplyLot.${cl_l}.quality_status == PASS and status == READY
  - name: box_orders_list_paginates_and_reports_total_count_and_has_more
    claim_type: Listing
    grounds:
    - endpoints.GET_/produce/box-orders
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: "With three orders on file, limit 2 offset 0 returns two rows with total_count 3 and has_more true, while the second page returns the remaining row with has_more false \u2014 total_count counts the whole filtered set rather than the page returned."
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. One center, supplier and lot; one customer with a WEEKLY subscription and three DRAFT orders at cycles 1, 2 and 3.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Center
          region: NE
          insulation_profile: LIGHT
          max_concurrent_building_cycles: 5
        as: PlatformAdmin
        captures:
          pg_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Supply Co PG
          region: NE
        as: PlatformAdmin
        captures:
          pg_s: $.data.id
      - call: POST /produce/suppliers/${pg_s}/lots
        payload:
          fulfillment_center_id: ${pg_c}
          product_name: PG1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          pg_l: $.data.id
          pg_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${pg_l}
          supplier_id: ${pg_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${pg_s}
      - call: POST /produce/supply-lots/${pg_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${pg_lv}
        as: PlatformAdmin
        captures:
          pg_lv2: $.data.version
      - call: POST /produce/supply-lots/${pg_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${pg_lv2}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: pg@example.com
          full_name: Sub Pg
          service_region: NE
        as: Anonymous
        captures:
          pg_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${pg_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          pg_sub: $.data.id
          pg_subv: $.data.version
      - call: POST /produce/box-orders
        payload:
          customer_id: ${pg_cu}
          subscription_id: ${pg_sub}
          serving_cycle_index: 1
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          pg_o1: $.data.id
          pg_o1v: $.data.version
      - call: POST /produce/box-orders
        payload:
          customer_id: ${pg_cu}
          subscription_id: ${pg_sub}
          serving_cycle_index: 2
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          pg_o2: $.data.id
          pg_o2v: $.data.version
      - call: POST /produce/box-orders
        payload:
          customer_id: ${pg_cu}
          subscription_id: ${pg_sub}
          serving_cycle_index: 3
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          pg_o3: $.data.id
          pg_o3v: $.data.version
      trigger:
      - call: GET /produce/box-orders?limit=2&offset=0
        as: PlatformAdmin
      assert:
      - the read returns 200 and response_type array
      - the first page returns exactly 2 rows with total_count == 3 and has_more == true
      - GET /produce/box-orders?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false
      - GET /produce/box-orders?customer_id=${pg_cu} returns 3 rows
      - GET /produce/box-orders with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0
  - name: supply_lot_read_with_an_unknown_id_returns_lot_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/produce/supply-lots/{id}
    - errors.ERR_SUPPLY_LOT_NOT_FOUND
    - validations[priority=4]
    distinguishing_aspect: A syntactically valid but unallocated id on the lot path produces the entity-specific 404 ERR_SUPPLY_LOT_NOT_FOUND, not a generic not-found and not a 400.
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls: []
      trigger:
      - call: GET /produce/supply-lots/00000000-0000-4000-8000-000000000000
        payload: {}
        as: PlatformAdmin
        captures:
          nf_err: $.data.error_id
          nf_msg: $.data.message
      assert:
      - the read returns 404 and nf_err == ERR_SUPPLY_LOT_NOT_FOUND
      - response_type is error and data carries both error_id and message
  - name: box_order_create_omitting_the_optional_preference_still_succeeds
    claim_type: Defaults
    grounds:
    - entities.BoxOrder.fields.cuisine_preference
    - endpoints.POST_/produce/box-orders
    excluded_because:
    - the order create returns 400 and df_err == ERR_INVALID_REQUEST
    - GET /produce/box-orders?customer_id=${df_cu} returns exactly 0 rows
    - SupplyLot.${df_l}.allergen_codes == [] and preference_tags == []
    - SupplyLot.${df_l}.quality_status == PASS
  - name: box_order_create_ignores_supplied_version_and_status
    claim_type: System Fields
    grounds:
    - entities.BoxOrder.fields.status
    - entities.BoxOrder.fields.pricing_status
    - endpoints.POST_/produce/box-orders
    excluded_because:
    - the create returns 201
    - BoxOrder.${sf_o}.status == DRAFT
    - BoxOrder.${sf_o}.pricing_status == UNPRICED
    - BoxOrder.${sf_o}.version == 1
    - BoxOrder.${sf_o}.customer_id == ${sf_cu} and subscription_id == ${sf_sub}
    - BoxOrder.${sf_o}.fulfillment_center_id == ${sf_c}
  - name: supplier_create_with_an_unknown_region_returns_invalid_request
    claim_type: Type Constraints
    grounds:
    - entities.Supplier.fields.region
    - validations[priority=3]
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: region is a closed four-member enum, so an unknown member such as XX is rejected at priority 3 with 400 ERR_INVALID_REQUEST and no Supplier is persisted.
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /produce/suppliers
        payload:
          name: Bad Region Co
          region: XX
        as: PlatformAdmin
        captures:
          br_err: $.data.error_id
      assert:
      - the create returns 400 and br_err == ERR_INVALID_REQUEST
      - GET /produce/suppliers returns 0 rows
  - name: subscription_create_with_an_unknown_customer_returns_customer_not_found
    claim_type: Parent Relationships
    grounds:
    - validations[priority=4]
    - endpoints.POST_/produce/subscriptions
    - errors.ERR_CUSTOMER_NOT_FOUND
    distinguishing_aspect: customer_id is a required body foreign key and priority 4 checks it before any state rule, so an unallocated customer id yields 404 ERR_CUSTOMER_NOT_FOUND rather than a 400.
    test_recipe:
      setup:
      - Logical clock default 2026-09-01T00:00:00Z. One center and one registered customer.
      setup_api_calls:
      - call: POST /produce/fulfillment-centers
        payload:
          code: DEMO-NE
          name: Demo Center
          region: NE
          insulation_profile: LIGHT
          max_concurrent_building_cycles: 5
        as: PlatformAdmin
        captures:
          pr_c: $.data.id
      - call: POST /produce/suppliers
        payload:
          name: Supply Co PR
          region: NE
        as: PlatformAdmin
        captures:
          pr_s: $.data.id
      - call: POST /produce/suppliers/${pr_s}/lots
        payload:
          fulfillment_center_id: ${pr_c}
          product_name: PR1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 100
          quantity_available: 300
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          pr_l: $.data.id
          pr_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${pr_l}
          supplier_id: ${pr_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${pr_s}
      - call: POST /produce/supply-lots/${pr_l}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${pr_lv}
        as: PlatformAdmin
        captures:
          pr_lv2: $.data.version
      - call: POST /produce/supply-lots/${pr_l}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${pr_lv2}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: pr@example.com
          full_name: Sub Pr
          service_region: NE
        as: Anonymous
        captures:
          pr_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${pr_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          pr_sub: $.data.id
          pr_subv: $.data.version
      trigger:
      - call: POST /produce/subscriptions
        payload:
          customer_id: 00000000-0000-4000-8000-000000000009
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          pr_err: $.data.error_id
      assert:
      - the create returns 404 and pr_err == ERR_CUSTOMER_NOT_FOUND
      - GET /produce/subscriptions?customer_id=${pr_cu} returns exactly 1 row
  - name: customer_list_filters_by_home_center_and_service_region
    claim_type: Listing
    grounds:
    - endpoints.GET_/produce/customers
    - entities.Customer.fields.home_fulfillment_center_id
