      - name: filing_fee_variants_diverge_between_filing_and_the_respondent_election
        claim_type: variant_divergence
        grounds:
          - calculations.filing_fee_assessment
        excluded_because:
          difficulty_instance: dual_variant_calc / filing_fee_provisional_at_filing_vs_final_at_respondent_election
          rationale: "That instance computes both variants on the same case and reconciles the delta into the ledger, which is the variant-divergence, variant-selection and reconciliation claim for this calculation in one."

      - name: response_deadline_variants_can_move_the_due_date_backwards
        claim_type: variant_divergence
        grounds:
