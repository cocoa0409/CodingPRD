            - { call: "POST /media-blasts/${blast_c}/submit", payload: {}, as: Organizer }
          trigger:
            - { call: "POST /media-blasts/${blast_b}/approve", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}", captures: { err: "$.data.error_id" } }
