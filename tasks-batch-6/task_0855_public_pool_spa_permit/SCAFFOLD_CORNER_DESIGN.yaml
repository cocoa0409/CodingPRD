              payload: { operator_id: "${op_id}", name: "Metro Competition Pool", facility_class: "CLASS_A_COMPETITION", surface_area_sqft: 2000, water_volume_gallons: 100000, max_depth_feet: 13, drain_count: 4, features: ["SLIDE", "DIVING_BOARD"] }
              as: Operator
              as_user_id: "${op_id}"
