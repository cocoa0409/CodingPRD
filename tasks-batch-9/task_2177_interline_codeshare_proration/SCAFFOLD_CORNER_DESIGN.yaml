        distinguishing_aspect: "Suspending a carrier moves every ACTIVE agreement naming it on either side to SUSPENDED with suspension_reason CARRIER_SUSPENDED, while a DRAFT agreement for the same pair keeps status DRAFT and suspension_reason NONE."
        test_recipe:
          setup:
            - "Carriers AA, BB, CC ACTIVE."
