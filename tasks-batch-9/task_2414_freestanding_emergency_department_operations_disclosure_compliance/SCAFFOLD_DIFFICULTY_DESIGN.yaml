          assert:
            - "the first admission attempt for C returns error_id == ERR_OBSERVATION_CAPACITY_EXCEEDED with HTTP 422 while Facility.${fac_id}.observation_beds_occupied == 2"
            - "after A is discharged: Encounter.${enc_a_id}.clinical_state == DISCHARGED, observation_bed_held == false, Facility.${fac_id}.observation_beds_occupied == 1"
            - "the retried admission for C succeeds: Encounter.${enc_c_id}.clinical_state == OBSERVATION and observation_bed_held == true"
            - "the ledger balances at every step: Facility.${fac_id}.observation_beds_occupied == 2 equals the count of encounters with observation_bed_held == true, namely ${enc_b_id} and ${enc_c_id}"
            - "0 <= Facility.${fac_id}.observation_beds_occupied <= Facility.${fac_id}.observation_bed_count holds throughout"
            - "Encounter.${enc_a_id}.observation_started_at == 2026-08-01T08:00:00Z is retained after the discharge (the release clears the hold, not the history)"
