  - rule_id: compensating_invariant
    instances:
      - name: brief_slots_conserved_accept_terminate
        grounds:
          - state_machines.Pitch.SHORTLISTED_to_ACCEPTED
          - state_machines.Deal.ACTIVE_to_TERMINATED
          - entities.Brief.fields.slots_committed
        distinguishing_aspect: |
          Conserved quantity is a slot count: slots_committed + open slots ==
          slots_total (2) across the forward action (accept -> committed 1) and its
          compensating action (terminate -> committed 0), then a second accept
          restores committed 1 — no slot leaks or double-counts.
        test_recipe:
          setup: ["OPEN brief slots_total 2, two ACTIVE creators pitched and shortlisted"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "cri1", email: "cri1@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c1: $.data.id } }
            - { call: "POST /creators/${c1}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c1}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /creators", payload: { handle: "cri2", email: "cri2@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c2: $.data.id } }
            - { call: "POST /creators/${c2}/transition", payload: { to_state: "SCREENING" }, as: TalentManager }
            - { call: "POST /creators/${c2}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "B15", industry: "TECH" }, as: BrandManager, captures: { b_id: $.data.id } }
            - { call: "POST /briefs", payload: { brand_id: "${b_id}", title: "S", niche: "TECH", min_followers: 1000, min_engagement_bps: 50, slots_total: 2, budget_cents: 100000000, deliverables_per_slot: 1, usage_rights_days: 45, exclusivity_category: "NONE", exclusivity_days: 0, whitelisting_required: false, revision_rounds_included: 2, submission_window_start: "2026-08-01T00:00:00Z", submission_window_end: "2026-08-31T23:59:59Z", content_window_start: "2026-08-01T00:00:00Z", content_window_end: "2026-09-30T23:59:59Z" }, as: BrandManager, captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c1}", proposed_fee_cents: 100000, concept_note: "a", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p1: $.data.id } }
            - { call: "GET /briefs/${br_id}", payload: {}, as: BrandManager, captures: { br_v2: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c2}", proposed_fee_cents: 100000, concept_note: "b", expected_brief_version: "${br_v2}" }, as: TalentManager, captures: { p2: $.data.id } }
            - { call: "POST /pitches/${p1}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p1}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d1: $.data.deal_id } }
          trigger:
            - { call: "GET /briefs/${br_id}", payload: {}, as: BrandManager, captures: { sc1: $.data.slots_committed } }
            - { call: "POST /deals/${d1}/terminate", payload: { reason: "compensation test" }, as: BrandManager }
            - { call: "GET /briefs/${br_id}", payload: {}, as: BrandManager, captures: { sc2: $.data.slots_committed } }
            - { call: "POST /pitches/${p2}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p2}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager }
            - { call: "GET /briefs/${br_id}", payload: {}, as: BrandManager, captures: { sc3: $.data.slots_committed } }
          assert:
            - "slots_committed sequence == 1 -> 0 -> 1 across accept, terminate (compensation), re-accept"
            - "invariant: Brief.${br_id}.slots_committed + open slots == 2 at every step"

      - name: brand_outstanding_conserved_issue_void
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Brand.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity is money (brand outstanding cents), a different type than
          the slot count: ISSUE adds total_cents 111804 to
          Brand.outstanding_balance_cents and its compensating VOID subtracts exactly
          the same amount, returning the invariant to 0 with no drift.
        test_recipe:
          setup: ["ACTIVE deal with VERIFIED deliverable; invoice DRAFT created (total 111804)"]
          setup_api_calls:
            - { call: "POST /creators", payload: { handle: "cri3", email: "cri3@x.com", niche: "OTHER", primary_platform: "YOUTUBE", followers: 50000, avg_views_30d: 40000, engagement_rate_bps: 250 }, as: TalentManager, captures: { c_id: $.data.id } }
