  - name: auth_schema_and_existence_errors_are_all_triggerable_in_priority_order
    claim_type: error_triggerability
    grounds:
    - §1.6 ERR_MISSING_AUTH_HEADERS, ERR_INVALID_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST and
      all ten *_NOT_FOUND ids
    - §1.4 priorities 1, 2, 3, 5, 7, 8
    - §1.0 response_envelope error shape
    distinguishing_aspect: |
      The first of four instances whose job is the §1.9 errors obligation: every id in the §1.6 catalogue must be provably reachable. This one takes the whole pre-business band of the ladder — headers, role, schema, existence — because those errors share a property no other error has: they are decided before any row is read, so one fixture reaches all of them. It also pins the envelope shape on the error path, which every other negative assertion in this document silently depends on. The three sibling instances cover the state 409s, the business-rule 422s and the ambiguous-room-block 409 respectively; the closing assertion here is the cross-reference table naming where each remaining id is triggered.
