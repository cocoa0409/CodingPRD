        grounds:
          - calculations.ballot_consensus_evaluation
          - state_machines[Draft].SUBCOMMITTEE_BALLOT_to_DRAFTING
        distinguishing_aspect: "STEP 4 is ordered, and the order is observable: a ballot with one AFFIRMATIVE and one ABSTAIN out of five seats has provisional_approval_pct 100.0 — far above the 50.1 bar — yet return_rate_pct 40.0 is below the 50.0 bar, so consensus_result is FAILED_QUORUM and the draft returns to DRAFTING."
