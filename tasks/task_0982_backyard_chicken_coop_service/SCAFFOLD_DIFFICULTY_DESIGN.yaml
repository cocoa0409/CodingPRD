  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: engagement_confirm_requires_coop_installed
        grounds:
          - state_machines.SittingEngagement.QUOTED_to_CONFIRMED
          - entities.CoopSite.fields.status
          - errors[ERR_COOP_NOT_INSTALLED]
        distinguishing_aspect: |
          Entity pair SittingEngagement -> CoopSite: a QUOTED engagement cannot
          confirm while its CoopSite.status is still PLANNED; the confirm
          transition's valid set is gated by a different entity's state.
        test_recipe:
          setup:
            - "URBAN household; coop in PLANNED status (no SETUP_INSTALL visit ever completed)"
            - "Engagement 2026-09-01 -> 2026-09-02 QUOTED"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H XDep1", email: "hxdep1@x.com", address: "12 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "raw", coop_capacity_hens: 6 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/sitting-engagements"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-02T00:00:00Z", daily_window_start: "08:00" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /coopcare/sitting-engagements/${eng_id}/quote"
              as: Dispatcher
          trigger:
            - call: "POST /coopcare/sitting-engagements/${eng_id}/confirm"
              as: Customer
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COOP_NOT_INSTALLED (CoopSite.status == PLANNED gates the engagement transition)"
            - "SittingEngagement.${eng_id}.status stays QUOTED"

      - name: visit_checkin_requires_household_active
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_ON_SITE
          - entities.HouseholdAccount.fields.status
          - errors[ERR_ACCOUNT_SUSPENDED]
        distinguishing_aspect: |
          Entity pair ServiceVisit -> HouseholdAccount (different pair from
          Engagement -> CoopSite): the assigned technician's check-in is
          rejected when the visit's household is SUSPENDED, and the BILLABLE
          visit itself is NOT cascade-cancelled (only covered visits are), so it
          stays SCHEDULED and reachable for the gate to be observable.
        test_recipe:
          setup:
            - "URBAN household; PLANNED coop; BILLABLE SETUP_INSTALL visit assigned to tech-1 (SCHEDULED); household then SUSPENDED"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H XDep2", email: "hxdep2@x.com", address: "13 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "raw", coop_capacity_hens: 6 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { visit_id: $.data.id, cov: $.data.coverage }
            - call: "POST /coopcare/service-visits/${visit_id}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/households/${hh_id}/suspend"
              as: BillingAdmin
          trigger:
            - call: "POST /coopcare/service-visits/${visit_id}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "ServiceVisit.${visit_id}.coverage == BILLABLE (no subscription; cascade would not cancel it)"
            - "error_id == ERR_ACCOUNT_SUSPENDED (HouseholdAccount.status gates the visit transition)"
            - "ServiceVisit.${visit_id}.status stays SCHEDULED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: engagement_closed_interval_overlap
        grounds:
          - calculations.engagement_date_overlap
          - errors[ERR_ENGAGEMENT_DATE_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on the HouseholdAccount resource: occupancy
          is [start_date, end_date] inclusive, so a new engagement starting
          exactly on the CONFIRMED engagement's end_date collides (rejected),
          while one starting end_date + 1 day is back-to-back and allowed.
        test_recipe:
          setup:
            - "URBAN household with INSTALLED grade-B coop"
            - "PUBLISHED URBAN routes on 2026-08-01, 2026-08-02, 2026-08-04, 2026-08-05"
            - "Engagement A 2026-08-01 -> 2026-08-03 CONFIRMED (stops on 08-01, 08-02)"
            - "Engagement B 2026-08-03 -> 2026-08-05 QUOTED (shares date 08-03 with A)"
            - "Engagement C 2026-08-04 -> 2026-08-06 QUOTED (starts exactly A.end_date + 1 day)"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H Ovl1", email: "hovl1@x.com", address: "14 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
