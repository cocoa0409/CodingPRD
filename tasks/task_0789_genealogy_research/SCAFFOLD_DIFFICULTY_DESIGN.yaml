  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: consumed_hours_conserved_on_time_entry_void
        grounds:
          - state_machines.TimeEntry.ACTIVE_to_VOIDED
          - entities.ResearchProject.fields.consumed_hours
        distinguishing_aspect: |
          Conserved quantity = project.consumed_hours (sum of ACTIVE billable TimeEntry.hours):
          logging 4.0 hours then voiding the entry returns consumed_hours to its pre-log value 0.0;
          the compensating action leaves the invariant unchanged.
        test_recipe:
          setup:
            - "ACTIVE project budget_hours 10; one ACTIVE 4.0-hour billable entry"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "C17", email: "c17@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "R17", email: "r17@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P17", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id }
            - call: "POST /genealogy/projects/${project_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /genealogy/time-entries"
              payload: { project_id: "${project_id}", hours: 4, activity_type: "RESEARCH", billable: true }
              as: Researcher
              as_user_id: "${researcher_id}"
              captures: { te_id: $.data.id }
          trigger:
            - call: "POST /genealogy/time-entries/${te_id}/void"
              payload: { reason: "duplicate entry" }
              as: Researcher
              as_user_id: "${researcher_id}"
          assert:
            - "TimeEntry.${te_id}.status == VOIDED"
            - "ResearchProject.${project_id}.consumed_hours == 0.0"

      - name: net_billed_conserved_on_milestone_cancel
        grounds:
          - state_machines.Milestone.INVOICED_to_CANCELLED
          - entities.ResearchProject.fields.invoiced_total_cents
          - entities.ResearchProject.fields.credited_total_cents
          - entities.ResearchProject.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = net billed money (invoiced_total_cents - credited_total_cents) and
          outstanding_balance_cents -- a different conserved quantity from consumed_hours. Invoicing a
          milestone (line_total 43000) then cancelling it leaves invoiced_total_cents == 43000 ==
          credited_total_cents (net 0) and outstanding_balance_cents 0.
        test_recipe:
          setup:
            - "STANDARD/STANDARD project; milestone base 40000 readied via accepted deliverable, then INVOICED"
          setup_api_calls:
            - call: "POST /genealogy/clients"
