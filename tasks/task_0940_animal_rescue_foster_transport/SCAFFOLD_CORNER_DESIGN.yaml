scaffold_corner_design:
  - section: entities
    instances:
      - name: organization_create_returns_defaults_and_zero_balances
        claim_type: Creation
        grounds:
          - entities.Organization.fields.default_methodology
          - entities.Organization.fields.records_freeze_active
          - entities.Organization.fields.unrestricted_balance_cents
          - endpoints["POST /rescue/organizations"]
        distinguishing_aspect: "A new Organization is returned with default_methodology SAC, freeze_status UNFROZEN, records_freeze_active false and all three derived balances at 0."
        test_recipe:
          setup: ["Empty database with the clock at its 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id, meth: $.data.default_methodology, frozen: $.data.records_freeze_active, unres: $.data.unrestricted_balance_cents, res: $.data.restricted_balance_cents, slots: $.data.open_commitment_slots_total, ver: $.data.version }
          assert:
            - "the response returns HTTP 201"
            - "meth == SAC"
            - "frozen == false"
            - "unres == 0"
            - "res == 0"
            - "slots == 0"
            - "ver == 1"
            - "Organization.${org_id}.freeze_status == UNFROZEN"

      - name: person_household_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Person.fields.youngest_child_age_years
          - entities.Person.fields.housing_type
          - entities.Person.fields.reclaim_history_count
        distinguishing_aspect: "Omitting the household fields yields youngest_child_age_years 99, resident counts 0, housing_type HOUSE, has_fenced_yard false, hardship_certified false and reclaim_history_count 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rescue/persons"
              payload: { full_name: "Nil Default", email: "nil@example.test" }
              as: PlatformAdmin
              captures: { p: $.data.id, child: $.data.youngest_child_age_years, cats: $.data.resident_cat_count, housing: $.data.housing_type, fence: $.data.has_fenced_yard, hardship: $.data.hardship_certified, hist: $.data.reclaim_history_count }
          assert:
            - "child == 99"
            - "cats == 0"
            - "housing == HOUSE"
            - "fence == false"
            - "hardship == false"
            - "hist == 0"
            - "Person.${p}.resident_dog_count == 0"

      - name: animal_identifiable_computed_from_microchip_id
        claim_type: Computed Fields
        grounds:
          - entities.Animal.fields.identifiable
          - entities.Animal.fields.microchip_id
          - entities.Animal.fields.lifecycle_status
        distinguishing_aspect: "identifiable is computed, not accepted from the client: an animal created with a microchip_id is identifiable true, one created without is false, and both start at lifecycle_status PRE_INTAKE."
        test_recipe:
          setup: ["One SHELTER organization."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /rescue/animals"
              payload: { name: "Chipped", species: "DOG", size_class: "SMALL", weight_lb: 12.0, date_of_birth: "2024-01-01T00:00:00Z", current_organization_id: "${org_id}", microchip_id: "985141000123456" }
              as: IntakeOfficer
              captures: { chipped_id: $.data.id, chipped_ident: $.data.identifiable, chipped_life: $.data.lifecycle_status }
            - call: "POST /rescue/animals"
              payload: { name: "Plain", species: "DOG", size_class: "SMALL", weight_lb: 12.0, date_of_birth: "2024-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { plain_id: $.data.id, plain_ident: $.data.identifiable }
          assert:
            - "chipped_ident == true"
            - "plain_ident == false"
            - "chipped_life == PRE_INTAKE"
            - "Animal.${plain_id}.lifecycle_status == PRE_INTAKE"
            - "Animal.${chipped_id}.length_of_stay_days == 0"

      - name: animal_age_weeks_and_months_derived_from_whole_days
        claim_type: Computed Fields
        grounds:
          - calculations.animal_age_derivation
          - entities.Animal.fields.age_weeks
          - entities.Animal.fields.age_months
        distinguishing_aspect: "With the clock at 2026-06-01 an animal born 2026-04-01 has 61 elapsed days, so age_weeks is 8 and age_months is 2 — floor division by fixed day counts, never calendar months."
        test_recipe:
          setup: ["One SHELTER organization and the clock at 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Sprout", species: "CAT", size_class: "SMALL", weight_lb: 3.0, date_of_birth: "2026-04-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { animal_id: $.data.id }
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rescue/animals/${animal_id}"
              payload: {}
              as: PlatformAdmin
              captures: { weeks: $.data.age_weeks, months: $.data.age_months }
          assert:
            - "weeks == 8"
            - "months == 2"

      - name: litter_member_count_tracks_animals_assigned_to_it
        claim_type: Computed Fields
        grounds:
          - entities.Litter.fields.member_count
          - entities.Litter.fields.transport_basis
          - entities.Animal.fields.litter_id
        distinguishing_aspect: "A Litter created with no members has member_count 0 and transport_basis GROUPED; after three animals are created with that litter_id, member_count is 3."
        test_recipe:
          setup: ["One SHELTER organization."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/litters"
              payload: { label: "Birch litter" }
              as: IntakeOfficer
              captures: { litter_id: $.data.id, initial_count: $.data.member_count, initial_basis: $.data.transport_basis }
          trigger:
            - call: "POST /rescue/animals"
              payload: { name: "B1", species: "DOG", size_class: "SMALL", weight_lb: 5.0, date_of_birth: "2026-04-01T00:00:00Z", current_organization_id: "${org_id}", litter_id: "${litter_id}" }
              as: IntakeOfficer
            - call: "POST /rescue/animals"
              payload: { name: "B2", species: "DOG", size_class: "SMALL", weight_lb: 5.0, date_of_birth: "2026-04-01T00:00:00Z", current_organization_id: "${org_id}", litter_id: "${litter_id}" }
              as: IntakeOfficer
            - call: "POST /rescue/animals"
              payload: { name: "B3", species: "DOG", size_class: "SMALL", weight_lb: 5.0, date_of_birth: "2026-04-01T00:00:00Z", current_organization_id: "${org_id}", litter_id: "${litter_id}" }
              as: IntakeOfficer
            - call: "GET /rescue/litters/${litter_id}"
              payload: {}
              as: PlatformAdmin
              captures: { final_count: $.data.member_count }
          assert:
            - "initial_count == 0"
            - "initial_basis == GROUPED"
            - "final_count == 3"
            - "Litter.${litter_id}.split_approved_at is null"

      - name: animal_list_filtered_by_litter_id_returns_only_members
        claim_type: Listing
        grounds:
          - endpoints["GET /rescue/animals"]
          - entities.Animal.fields.litter_id
        distinguishing_aspect: "GET /rescue/animals filtered by litter_id returns exactly the two littermates and excludes the unrelated animal, and the array response carries the pagination envelope."
        test_recipe:
          setup: ["One SHELTER organization, one Litter with two members and one unrelated animal."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/litters"
              payload: { label: "Birch litter" }
              as: IntakeOfficer
              captures: { litter_id: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "B1", species: "DOG", size_class: "SMALL", weight_lb: 5.0, date_of_birth: "2026-04-01T00:00:00Z", current_organization_id: "${org_id}", litter_id: "${litter_id}" }
              as: IntakeOfficer
              captures: { b1: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "B2", species: "DOG", size_class: "SMALL", weight_lb: 5.0, date_of_birth: "2026-04-01T00:00:00Z", current_organization_id: "${org_id}", litter_id: "${litter_id}" }
              as: IntakeOfficer
              captures: { b2: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Loner", species: "CAT", size_class: "SMALL", weight_lb: 8.0, date_of_birth: "2024-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { loner: $.data.id }
          trigger:
            - call: "GET /rescue/animals"
              payload: { litter_id: "${litter_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
              captures: { first_id: "$.data[0].id" }
          assert:
            - "the response contains exactly 2 items, whose ids are ${b1} and ${b2}"
            - "${loner} does not appear in the response"
            - "the response envelope reports total_count 2 and has_more false"
            - "response_type == array"

      - name: contribution_available_cents_and_status_on_create
        claim_type: Computed Fields
        grounds:
          - entities.Contribution.fields.available_cents
          - entities.Contribution.fields.status
          - calculations.restricted_fund_conservation
        distinguishing_aspect: "A newly recorded 5000-cent MEDICAL contribution has applied_cents 0, released_cents 0, available_cents 5000, status RECEIVED and redesignation_count 0, and raises restricted_balance_cents rather than unrestricted_balance_cents."
        test_recipe:
          setup: ["One SHELTER organization and one donor Person."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Gil Marsh", email: "gil@example.test" }
              as: PlatformAdmin
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /rescue/contributions"
              payload: { donor_person_id: "${donor_id}", amount_cents: 5000, donor_reference: "GIFT-1", restriction_category: "MEDICAL", designated_program: "NONE" }
              as: FinanceOfficer
              captures: { c: $.data.id, applied: $.data.applied_cents, released: $.data.released_cents, available: $.data.available_cents, st: $.data.status, redes: $.data.redesignation_count }
            - call: "GET /rescue/organizations/${org_id}"
              payload: {}
              as: FinanceOfficer
              captures: { unres: $.data.unrestricted_balance_cents, res: $.data.restricted_balance_cents }
          assert:
            - "applied == 0"
            - "released == 0"
            - "available == 5000"
            - "st == RECEIVED"
            - "redes == 0"
            - "unres == 0"
            - "res == 5000"

      - name: partner_commitment_slots_open_initialised_to_slots_total
        claim_type: Computed Fields
        grounds:
          - entities.PartnerCommitment.fields.slots_open
          - entities.Organization.fields.open_commitment_slots_total
          - calculations.partner_commitment_slot_conservation
        distinguishing_aspect: "A new 5-slot commitment has slots_drawn 0, slots_released 0, slots_open 5 and status OPEN, and the partner organization's open_commitment_slots_total becomes 5."
        test_recipe:
          setup: ["One PARTNER_RESCUE organization in WA."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Cascade Partner Rescue", org_type: "PARTNER_RESCUE", state_code: "WA" }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
          trigger:
            - call: "POST /rescue/partner-commitments"
              payload: { organization_id: "${partner_id}", species: "CAT", slots_total: 5, expires_at: "2026-07-01T00:00:00Z" }
              as: TransportDispatcher
              captures: { commit_id: $.data.id, drawn: $.data.slots_drawn, rel: $.data.slots_released, open: $.data.slots_open, st: $.data.status }
            - call: "GET /rescue/organizations/${partner_id}"
              payload: {}
              as: PlatformAdmin
              captures: { org_slots: $.data.open_commitment_slots_total }
          assert:
            - "drawn == 0"
            - "rel == 0"
            - "open == 5"
            - "st == OPEN"
            - "org_slots == 5"
            - "PartnerCommitment.${commit_id}.slots_total == 5"

      - name: animal_not_found_returns_animal_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ANIMAL_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: "GET on a well-formed but non-existent animal id returns ERR_ANIMAL_NOT_FOUND with HTTP 404 and the error response envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rescue/animals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ANIMAL_NOT_FOUND"
            - "the response returns HTTP 404"
            - "response_type == error"

      - name: transport_resource_not_found_covers_run_leg_and_manifest
        claim_type: Not Found
        grounds:
          - errors[ERR_TRANSPORT_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "The same ERR_TRANSPORT_RESOURCE_NOT_FOUND code is returned for a missing transport run, a missing transport leg and a missing manifest entry."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rescue/transport-runs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_run: $.data.error_id }
            - call: "GET /rescue/transport-legs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d3"
              payload: {}
              as: PlatformAdmin
              captures: { err_leg: $.data.error_id }
            - call: "GET /rescue/manifest-entries/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d4"
              payload: {}
              as: PlatformAdmin
              captures: { err_entry: $.data.error_id }
          assert:
            - "err_run == ERR_TRANSPORT_RESOURCE_NOT_FOUND"
            - "err_leg == ERR_TRANSPORT_RESOURCE_NOT_FOUND"
            - "err_entry == ERR_TRANSPORT_RESOURCE_NOT_FOUND"
            - "all three return HTTP 404"

      - name: adoption_and_funding_resource_not_found_codes
        claim_type: Not Found
        grounds:
          - errors[ERR_ADOPTION_RESOURCE_NOT_FOUND]
          - errors[ERR_FUNDING_RESOURCE_NOT_FOUND]
          - errors[ERR_MEDICAL_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Missing adoption applications, adoptions and outcomes all route to ERR_ADOPTION_RESOURCE_NOT_FOUND; missing contributions and partner commitments route to ERR_FUNDING_RESOURCE_NOT_FOUND; missing medical records and certificates route to ERR_MEDICAL_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rescue/adoptions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f101"
              payload: {}
              as: PlatformAdmin
              captures: { err_adopt: $.data.error_id }
            - call: "GET /rescue/outcomes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f102"
              payload: {}
              as: PlatformAdmin
              captures: { err_outcome: $.data.error_id }
            - call: "GET /rescue/contributions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f103"
              payload: {}
              as: FinanceOfficer
              captures: { err_contrib: $.data.error_id }
            - call: "GET /rescue/partner-commitments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f104"
              payload: {}
              as: TransportDispatcher
              captures: { err_commit: $.data.error_id }
            - call: "GET /rescue/health-certificates/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f105"
              payload: {}
              as: Veterinarian
              captures: { err_cvi: $.data.error_id }
          assert:
            - "err_adopt == ERR_ADOPTION_RESOURCE_NOT_FOUND"
            - "err_outcome == ERR_ADOPTION_RESOURCE_NOT_FOUND"
            - "err_contrib == ERR_FUNDING_RESOURCE_NOT_FOUND"
            - "err_commit == ERR_FUNDING_RESOURCE_NOT_FOUND"
            - "err_cvi == ERR_MEDICAL_RESOURCE_NOT_FOUND"

      - name: remaining_not_found_codes_follow_the_closed_entity_map
        claim_type: Not Found
        grounds:
          - validations[priority=10]
          - errors[ERR_ORGANIZATION_NOT_FOUND]
          - errors[ERR_LITTER_NOT_FOUND]
          - errors[ERR_INTAKE_RECORD_NOT_FOUND]
          - errors[ERR_HOLD_NOT_FOUND]
          - errors[ERR_FOSTER_HOME_NOT_FOUND]
          - errors[ERR_FOSTER_APPLICATION_NOT_FOUND]
          - errors[ERR_FOSTER_PLACEMENT_NOT_FOUND]
        distinguishing_aspect: "Each of the seven remaining not-found codes is returned for its own entity per the closed map at ladder priority 10, so a missing litter never surfaces as ERR_ANIMAL_NOT_FOUND and a missing foster home never surfaces as ERR_FOSTER_APPLICATION_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /rescue/organizations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f201"
              payload: {}
              as: PlatformAdmin
              captures: { e_org: $.data.error_id }
            - call: "GET /rescue/litters/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f202"
              payload: {}
              as: PlatformAdmin
              captures: { e_litter: $.data.error_id }
            - call: "GET /rescue/intake-records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f203"
              payload: {}
              as: PlatformAdmin
              captures: { e_intake: $.data.error_id }
            - call: "GET /rescue/holds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f204"
              payload: {}
              as: PlatformAdmin
              captures: { e_hold: $.data.error_id }
            - call: "GET /rescue/foster-homes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f205"
              payload: {}
              as: PlatformAdmin
              captures: { e_home: $.data.error_id }
            - call: "GET /rescue/foster-applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f206"
              payload: {}
              as: PlatformAdmin
              captures: { e_app: $.data.error_id }
            - call: "GET /rescue/foster-placements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f207"
              payload: {}
              as: PlatformAdmin
              captures: { e_place: $.data.error_id }
            - call: "GET /rescue/persons/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f208"
              payload: {}
              as: PlatformAdmin
              captures: { e_person: $.data.error_id }
          assert:
            - "e_org == ERR_ORGANIZATION_NOT_FOUND"
            - "e_litter == ERR_LITTER_NOT_FOUND"
            - "e_intake == ERR_INTAKE_RECORD_NOT_FOUND"
            - "e_hold == ERR_HOLD_NOT_FOUND"
            - "e_home == ERR_FOSTER_HOME_NOT_FOUND"
            - "e_app == ERR_FOSTER_APPLICATION_NOT_FOUND"
            - "e_place == ERR_FOSTER_PLACEMENT_NOT_FOUND"
            - "e_person == ERR_PERSON_NOT_FOUND"
            - "all eight requests return HTTP 404"

      - name: animal_create_missing_required_species_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required species field on animal creation returns ERR_VALIDATION with HTTP 400 at ladder priority 6, before any enum or range check."
        test_recipe:
          setup: ["One SHELTER organization."]
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /rescue/animals"
              payload: { name: "NoSpecies", size_class: "SMALL", weight_lb: 10.0, date_of_birth: "2024-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"
            - "the response returns HTTP 400"
            - "no Animal row is created"

      - name: animal_create_invalid_enum_species_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_ENUM]
