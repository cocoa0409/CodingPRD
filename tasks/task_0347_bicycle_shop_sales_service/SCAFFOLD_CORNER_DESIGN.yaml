            - "response.data.error_id == ERR_ALREADY_ACKNOWLEDGED"

      - name: warranty_frame_not_serialized_not_covered
        claim_type: Conditional validation
        grounds: ["validations[priority=9]", "errors[ERR_WARRANTY_NOT_COVERED]"]
        distinguishing_aspect: "Approving a FRAME-defect claim on a FRAME_AND_COMPONENT Sku that is NOT serialized (is_serialized=false) returns ERR_WARRANTY_NOT_COVERED (409) even though the purchase is valid."
        test_recipe:
