            - "error_id == ERR_UNAUTHORIZED"

      - name: billing_clerk_cannot_run_ops
        claim_type: rbac_denial
        grounds: ["roles[OpsManager]", "endpoints[POST /maa/airports/{aid}/run_ops]"]
