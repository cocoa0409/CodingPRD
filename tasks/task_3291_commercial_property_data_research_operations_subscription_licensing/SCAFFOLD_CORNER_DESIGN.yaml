scaffold_corner_design:
- section: entities
  instances:
  - name: property_create_returns_every_declared_field_and_starts_draft_open
    claim_type: Creation
    grounds:
    - entities.Property
    - endpoints.POST_/data-research/properties
    distinguishing_aspect: A Property created with market, address_line, property_type, rentable_sqft and classification comes back 201 in DRAFT/OPEN with version 1 and every computed counter at zero.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - &id002
        call: POST /data-research/organizations
        payload:
          legal_name: Tarrant Field Research LLC
          org_type: DATA_PROVIDER
          home_market: TX-DALLAS
          service_tier: ENTERPRISE
        as: PlatformAdmin
        captures:
          org_dp: $.data.id
      - &id003
        call: POST /data-research/organizations/${org_dp}/users
        payload:
          email: dana.reyes@tarrantresearch.example
          full_name: Dana Reyes
          role: RESEARCH_ANALYST
          assigned_market: TX-DALLAS
        as: PlatformAdmin
        captures:
          analyst_tx: $.data.id
      trigger:
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 1400 Ross Ave
          property_type: OFFICE
          rentable_sqft: 120000
          classification: CLASS_A
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_ross: $.data.id
      assert:
      - the response status is 201 and response_type is object
      - Property.${prop_ross}.research_status == DRAFT and land_posture == OPEN
      - Property.${prop_ross}.version == 1 and id, created_at and updated_at are non-null
      - Property.${prop_ross}.completeness_pct == 0.0 and attribute_total_count == 0 and attribute_verified_count == 0 and stale_source_count == 0
      - Property.${prop_ross}.parent_property_id is null
      - meta.api_request_id and meta.api_request_timestamp are present on the response
  - name: organization_get_returns_the_stored_tier_and_derived_counts
    claim_type: Retrieval
    grounds:
    - entities.Organization
    - endpoints.GET_/data-research/organizations/{organizationId}
    distinguishing_aspect: Every Organization field round-trips through GET, including the defaulted service_tier and the two computed counters.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One SUBSCRIBER organization created without an explicit service_tier.
      setup_api_calls:
      - *id001
      - call: POST /data-research/organizations
        payload:
          legal_name: Meridian Advisory Partners
          org_type: SUBSCRIBER
          home_market: TX-DALLAS
        as: PlatformAdmin
        captures:
          org_sub: $.data.id
      trigger:
      - call: GET /data-research/organizations/${org_sub}
        payload: {}
        as: PlatformAdmin
      assert:
      - the response status is 200 and response_type is object
      - Organization.${org_sub}.legal_name == "Meridian Advisory Partners" and org_type == SUBSCRIBER and home_market == TX-DALLAS
      - Organization.${org_sub}.service_tier == ENTERPRISE because that is the declared default
      - Organization.${org_sub}.status == ACTIVE
      - Organization.${org_sub}.authorized_market_count == 0 and active_contract_count == 0 because no contract has been created yet
  - name: properties_list_paginates_and_filters_by_market
    claim_type: Listing
    grounds:
    - endpoints.GET_/data-research/properties
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: With three properties, limit=2&offset=0 returns two rows with total_count 3 and has_more true, and market=NM-ALBUQUERQUE narrows the filtered set to one while total_count still reports the filtered total.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One data-provider analyst with two TX-DALLAS properties and one NM-ALBUQUERQUE property, all DRAFT.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 1400 Ross Ave
          property_type: OFFICE
          rentable_sqft: 120000
          classification: CLASS_A
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 5000 Maple Ave
          property_type: OFFICE
          rentable_sqft: 90000
          classification: CLASS_B
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/properties
        payload:
          market: NM-ALBUQUERQUE
          address_line: 100 Central Ave NW
          property_type: RETAIL
          rentable_sqft: 15000
          classification: CLASS_C
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      trigger:
      - call: GET /data-research/properties
        payload:
          limit: 2
          offset: 0
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      assert:
      - the response status is 200 and response_type is array
      - the page returns exactly 2 rows with total_count == 3 and has_more == true
      - GET /data-research/properties?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false
      - GET /data-research/properties?market=NM-ALBUQUERQUE returns exactly 1 row
      - GET /data-research/properties with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0
  - name: property_get_with_an_unknown_id_returns_property_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/data-research/properties/{propertyId}
    - errors.ERR_PROPERTY_NOT_FOUND
    - validations.priority_3_existence
    distinguishing_aspect: A syntactically valid but unallocated property id produces the entity-specific 404 ERR_PROPERTY_NOT_FOUND, not a generic ERR_NOT_FOUND and not a 400.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. No property has been created.
      setup_api_calls:
      - *id001
      trigger:
      - call: GET /data-research/properties/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ResearchAnalyst
        captures:
          error_id: $.data.error_id
      assert:
      - the response status is 404 and error_id == ERR_PROPERTY_NOT_FOUND
      - response_type is error and data carries both error_id and message
  - name: property_create_missing_rentable_sqft_returns_invalid_request
    claim_type: Required Fields
    grounds:
    - entities.Property.fields.rentable_sqft
    - validations.priority_1_auth
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: rentable_sqft is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 409 business error.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One data-provider analyst.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      trigger:
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 1400 Ross Ave
          property_type: OFFICE
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          error_id: $.data.error_id
      assert:
      - the response status is 400 and error_id == ERR_INVALID_REQUEST
      - no Property row was created
      - GET /data-research/properties returns 0 rows
  - name: property_create_violating_the_classification_enum_returns_invalid_request
    claim_type: Type Constraints
    grounds:
    - entities.Property.fields.classification
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: classification is an enum restricted to CLASS_A | CLASS_B | CLASS_C, so CLASS_D is rejected as a 400 type-constraint failure.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One data-provider analyst.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      trigger:
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 1400 Ross Ave
          property_type: OFFICE
          rentable_sqft: 120000
          classification: CLASS_D
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          error_id: $.data.error_id
      assert:
      - the response status is 400 and error_id == ERR_INVALID_REQUEST
      - no Property row was created with classification CLASS_D
  - name: property_create_omitting_classification_defaults_to_class_b
    claim_type: Defaults
    grounds:
    - entities.Property.fields.classification
    - endpoints.POST_/data-research/properties
    distinguishing_aspect: classification declares a default of CLASS_B, so omitting it stores CLASS_B rather than null.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One data-provider analyst.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      trigger:
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 7500 N Central Expy
          property_type: OFFICE
          rentable_sqft: 60000
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_default: $.data.id
      assert:
      - Property.${prop_default}.classification == CLASS_B
      - Property.${prop_default}.research_status == DRAFT
  - name: organization_create_with_a_client_supplied_status_extra_field_input_ignored
    claim_type: System Fields
    grounds:
    - entities.Organization.fields.status
    - endpoints.POST_/data-research/organizations
    distinguishing_aspect: 'status is source: system, so a client-supplied SUSPENDED on create is ignored and the stored value is ACTIVE.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: POST /data-research/organizations
        payload:
          legal_name: Rogue Status LLC
          org_type: SUBSCRIBER
          home_market: TX-DALLAS
          status: SUSPENDED
        as: PlatformAdmin
        captures:
          org_rogue: $.data.id
      assert:
      - the request is accepted and Organization.${org_rogue}.status == ACTIVE
      - the client-supplied SUSPENDED was ignored because status is a system field
      - Organization.${org_rogue}.version == 1
  - name: usage_event_get_returns_the_immutable_access_record
    claim_type: Immutability
    grounds:
    - entities.UsageEvent
    - endpoints.GET_/data-research/usage-events/{usageEventId}
    distinguishing_aspect: 'UsageEvent carries common_fields: false, so it exposes only id and created_at and has no update or delete endpoint at all.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. An assigned seat on an ACTIVE contract.
      setup_api_calls:
      - *id001
      - call: POST /data-research/organizations
        payload:
          legal_name: Meridian Advisory Partners
          org_type: SUBSCRIBER
          home_market: TX-DALLAS
          service_tier: MID_MARKET
        as: PlatformAdmin
        captures:
          org_sub: $.data.id
      - call: POST /data-research/organizations/${org_sub}/users
        payload:
          email: priya.nair@meridianadvisory.example
          full_name: Priya Nair
          role: LICENSING_ADMIN
        as: PlatformAdmin
        captures:
          admin_sub: $.data.id
      - call: POST /data-research/organizations/${org_sub}/users
        payload:
          email: ravi.menon@meridianadvisory.example
          full_name: Ravi Menon
          role: SEAT_USER
        as: PlatformAdmin
        captures:
          su_ravi: $.data.id
      - call: POST /data-research/licensing-contracts
        payload:
          subscriber_organization_id: ${org_sub}
          product: CORE_MARKET_DATA
          licensed_markets:
          - TX-DALLAS
          seat_count: 5
          annual_fee_cents: 100000
          auto_renew: true
          renewal_notice_days: 30
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2027-09-01T00:00:00Z'
          audit_intensity: STANDARD
        as: LicensingAdmin
        as_user_id: ${admin_sub}
        captures:
          contract_a: $.data.id
          contract_a_v0: $.data.version
      - call: POST /data-research/licensing-contracts/${contract_a}/seats
        payload:
          market: TX-DALLAS
          index_tier: TIER_2
          last_usage_cycle: '2026-09-01T00:00:00Z'
        as: LicensingAdmin
        as_user_id: ${admin_sub}
        captures:
          seat_a: $.data.id
      - call: POST /data-research/licensing-contracts/${contract_a}/seats/${seat_a}/assignment
        payload:
          occupant_user_id: ${su_ravi}
          expected_contract_version: ${contract_a_v0}
        as: LicensingAdmin
        as_user_id: ${admin_sub}
      - call: GET /data-research/licensing-contracts/${contract_a}
        payload: {}
        as: LicensingAdmin
        as_user_id: ${admin_sub}
        captures:
          contract_a_v1: $.data.version
      - call: POST /data-research/licensing-contracts/${contract_a}/activate
        payload:
          expected_contract_version: ${contract_a_v1}
        as: LicensingAdmin
        as_user_id: ${admin_sub}
      - call: POST /data-research/seats/${seat_a}/usage-events
        payload:
          market: TX-DALLAS
          event_type: API_QUERY
          record_count: 4
          distinguishing_ip: 203.0.113.7
          occurred_at: '2026-09-02T09:00:00Z'
        as: SeatUser
        as_user_id: ${su_ravi}
        captures:
          event_a: $.data.id
      trigger:
      - call: GET /data-research/usage-events/${event_a}
        payload: {}
        as: LicensingAdmin
        as_user_id: ${admin_sub}
        captures:
          event_rc: $.data.record_count
          event_type_captured: $.data.event_type
      assert:
      - the response status is 200 and UsageEvent.${event_a}.record_count == 4 and event_type == API_QUERY
      - the response carries id and created_at but no version and no updated_at field
      - no PUT, PATCH or DELETE endpoint exists for UsageEvent in §1.5
  - name: user_get_with_an_unknown_id_returns_user_not_found
    claim_type: Parent Relationships
    grounds:
    - endpoints.GET_/data-research/users/{userId}
    - errors.ERR_USER_NOT_FOUND
    - entities.User.fields.organization_id
    distinguishing_aspect: An unallocated user id returns 404 ERR_USER_NOT_FOUND, and a User always carries the organization_id of a real parent Organization.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One organization with one user.
      setup_api_calls:
      - *id001
      - *id002
      - call: POST /data-research/organizations/${org_dp}/users
        payload:
          email: dana.reyes@tarrantresearch.example
          full_name: Dana Reyes
          role: RESEARCH_ANALYST
          assigned_market: TX-DALLAS
        as: PlatformAdmin
        captures:
          analyst_tx: $.data.id
      trigger:
      - call: GET /data-research/users/00000000-0000-4000-8000-000000000000
        payload: {}
        as: PlatformAdmin
        captures:
          error_id: $.data.error_id
      assert:
      - the response status is 404 and error_id == ERR_USER_NOT_FOUND
      - GET /data-research/users/${analyst_tx} returns a User whose organization_id == ${org_dp}
      - the two calls use the same endpoint with different path ids, so the not-found path is proven specific
- section: state_machines
  instances:
  - name: finalize_from_draft_with_no_attributes_returns_empty_attribute_set
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.Property.DRAFT_to_VERIFIED
    - errors.ERR_EMPTY_ATTRIBUTE_SET
    distinguishing_aspect: The DRAFT -> VERIFIED edge is refused with 409 ERR_EMPTY_ATTRIBUTE_SET when the property carries zero attributes, proving the attribute-count precondition is enforced on that edge.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One DRAFT property with no attributes.
      setup_api_calls:
      - &id004
        call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - &id005
        call: POST /data-research/organizations
        payload:
          legal_name: Tarrant Field Research LLC
          org_type: DATA_PROVIDER
          home_market: TX-DALLAS
          service_tier: ENTERPRISE
        as: PlatformAdmin
        captures:
          org_dp: $.data.id
      - &id006
        call: POST /data-research/organizations/${org_dp}/users
        payload:
          email: dana.reyes@tarrantresearch.example
          full_name: Dana Reyes
          role: RESEARCH_ANALYST
          assigned_market: TX-DALLAS
        as: PlatformAdmin
        captures:
          analyst_tx: $.data.id
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 2200 Bryan St
          property_type: RETAIL
          rentable_sqft: 30000
          classification: CLASS_C
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_bryan: $.data.id
      trigger:
      - call: POST /data-research/properties/${prop_bryan}/finalize
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          error_id: $.data.error_id
      assert:
      - the response status is 409 and error_id == ERR_EMPTY_ATTRIBUTE_SET
      - Property.${prop_bryan}.research_status remains DRAFT
      - Property.${prop_bryan}.attribute_total_count == 0
  - name: finalize_reaches_verified_through_either_publication_edge
    claim_type: Valid Transition
    grounds:
    - state_machines.Property.DRAFT_to_VERIFIED
    - state_machines.Property.RESEARCHING_to_VERIFIED
    distinguishing_aspect: 'Both legitimate publication paths work: a one-attribute DRAFT property reaches VERIFIED directly through DRAFT -> VERIFIED, and a property advanced to RESEARCHING first reaches the same state through RESEARCHING -> VERIFIED.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Two properties, each with one verified attribute sourced from a fresh DEED.
      setup_api_calls:
      - *id004
      - *id005
      - *id006
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 1400 Ross Ave
          property_type: OFFICE
          rentable_sqft: 120000
          classification: CLASS_A
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_direct: $.data.id
      - call: POST /data-research/properties/${prop_direct}/source-documents
        payload:
          source_type: DEED
          source_name: Dallas County Clerk
          contact_method: RECORDS_REQUEST
          obtained_at: '2026-08-25T00:00:00Z'
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          sd_direct: $.data.id
      - call: POST /data-research/properties/${prop_direct}/attributes
        payload:
          source_document_id: ${sd_direct}
          field_name: tenant_name
          value: ''
          attribute_market: TX-DALLAS
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          att_direct: $.data.id
      - call: GET /data-research/properties/${prop_direct}
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_direct_v1: $.data.version
      - call: POST /data-research/properties/${prop_direct}/attributes/${att_direct}/proposals
        payload:
          value: Harborline Logistics Inc
          expected_property_version: ${prop_direct_v1}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/attributes/${att_direct}/verifications
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 5000 Maple Ave
          property_type: OFFICE
          rentable_sqft: 90000
          classification: CLASS_B
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_via_researching: $.data.id
      - call: POST /data-research/properties/${prop_via_researching}/research/start
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/properties/${prop_via_researching}/source-documents
        payload:
          source_type: DEED
          source_name: Dallas County Clerk
          contact_method: RECORDS_REQUEST
          obtained_at: '2026-08-25T00:00:00Z'
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          sd_second: $.data.id
      - call: POST /data-research/properties/${prop_via_researching}/attributes
        payload:
          source_document_id: ${sd_second}
          field_name: tenant_name
          value: ''
          attribute_market: TX-DALLAS
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          att_second: $.data.id
      - call: GET /data-research/properties/${prop_via_researching}
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_second_v1: $.data.version
      - call: POST /data-research/properties/${prop_via_researching}/attributes/${att_second}/proposals
        payload:
          value: Fulcrum Interiors LLC
          expected_property_version: ${prop_second_v1}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/attributes/${att_second}/verifications
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      trigger:
      - call: POST /data-research/properties/${prop_direct}/finalize
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          direct_status: $.data.research_status
      - call: POST /data-research/properties/${prop_via_researching}/finalize
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          researching_status: $.data.research_status
      assert:
      - direct_status == VERIFIED — the DRAFT -> VERIFIED edge fired
      - researching_status == VERIFIED — the RESEARCHING -> VERIFIED edge fired
      - both properties report research_status VERIFIED and attribute_verified_count == 1
  - name: finalize_is_absent_from_the_verified_state
    claim_type: Terminal State Lockdown
    grounds:
    - state_machines.Property.VERIFIED_to_RESEARCHING
    - errors.ERR_INVALID_STATE
    distinguishing_aspect: No finalize edge leaves VERIFIED, so a second finalize on a VERIFIED property is refused with ERR_INVALID_STATE while the property stays VERIFIED.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. One property already VERIFIED through a single-attribute publication.
      setup_api_calls:
      - *id004
      - *id005
      - *id006
      - call: POST /data-research/properties
        payload:
          market: TX-DALLAS
          address_line: 1400 Ross Ave
          property_type: OFFICE
          rentable_sqft: 120000
          classification: CLASS_A
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_verified: $.data.id
      - call: POST /data-research/properties/${prop_verified}/source-documents
        payload:
          source_type: DEED
          source_name: Dallas County Clerk
          contact_method: RECORDS_REQUEST
          obtained_at: '2026-08-25T00:00:00Z'
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          sd_v: $.data.id
      - call: POST /data-research/properties/${prop_verified}/attributes
        payload:
          source_document_id: ${sd_v}
          field_name: tenant_name
          value: ''
          attribute_market: TX-DALLAS
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          att_v: $.data.id
      - call: GET /data-research/properties/${prop_verified}
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
        captures:
          prop_v1: $.data.version
      - call: POST /data-research/properties/${prop_verified}/attributes/${att_v}/proposals
        payload:
          value: Harborline Logistics Inc
          expected_property_version: ${prop_v1}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
      - call: POST /data-research/attributes/${att_v}/verifications
        payload: {}
        as: ResearchAnalyst
        as_user_id: ${analyst_tx}
