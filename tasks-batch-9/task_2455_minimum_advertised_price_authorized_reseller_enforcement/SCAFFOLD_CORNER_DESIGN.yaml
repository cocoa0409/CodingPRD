        distinguishing_aspect: "Activation is the join point of the two reseller dimensions: the agreement becomes ACTIVE and the reseller lands on AUTHORIZED / OPEN / NONE in one write."
        test_recipe:
          setup: ["Agreement for Acme in COUNTERSIGNED under PUBLISHED policy MAP-2026-A."]
          setup_api_calls:
