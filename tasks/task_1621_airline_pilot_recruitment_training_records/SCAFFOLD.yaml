scenario: |
  Airline Pilot Recruitment & Training Records (Part 121): applicant screening & PRIA/records request, class scheduling & seat allocation with attrition assumptions, ground school/simulator/IOE progression tracking, checkride outcome & retraining loop, qualification/currency (recency/landings) monitoring, seniority & equipment bid awarding, medical certificate expiration & duty grounding, training footprint cost per pilot

domain_name: "airline-pilot-training-records"
api_prefix: "/pilot-training"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - dual_variant_calculation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities — Expert band maximum)
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across all applicants", constraints: "unique; RFC-5322 shape" }
      - { name: license_number, type: string, source: input, description: "FAA airman certificate number" }
      - { name: total_flight_hours, type: integer, source: input, description: "Total logged flight hours at application time; ATP screening gate requires >= 1500" }
      - { name: status, type: enum, source: system, description: "Screening pipeline state", default: SCREENING, constraints: "one of SCREENING, PRIA_PENDING, PRIA_VERIFIED, CLEARED, REJECTED, WITHDRAWN" }
      - { name: seniority_number, type: integer, source: computed, description: "Sequential seniority rank assigned at CLEARED transition as 1 + count of applicants already holding a seniority_number; null until cleared", constraints: "null until status == CLEARED" }
      - { name: current_equipment_id, type: string, source: computed, description: "FK -> Equipment.id; set by bid award cascade; null until awarded", constraints: "nullable" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical-clock timestamp of the CLEARED transition; null until cleared", constraints: "nullable" }
      - { name: ledger_balance_cents, type: integer, source: computed, description: "Signed net sum of all CostLedgerEntry.amount_cents for this applicant; maintained on every ledger insert", default: 0 }

  - name: RecordsRequest
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; subject of the records request" }
      - { name: request_type, type: enum, source: input, description: "Regulatory record family", constraints: "one of PRIA, DRUG_TEST, TRAINING_HISTORY" }
      - { name: status, type: enum, source: system, description: "Request lifecycle", default: DRAFT, constraints: "one of DRAFT, SENT, RECEIVED, VERIFIED, FAILED, EXPIRED" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock timestamp of send transition; null until sent", constraints: "nullable" }
      - { name: due_at, type: datetime, source: computed, description: "sent_at + RECORDS_RESPONSE_WINDOW_DAYS (30) days; null until sent", constraints: "nullable" }
      - { name: response_received_at, type: datetime, source: system, description: "Timestamp of receive transition; null until received or failed", constraints: "nullable" }
      - { name: failure_reason, type: string, source: input, description: "Free-text reason supplied when receive outcome is FAILED", constraints: "nullable" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Fleet code, e.g. A320; unique", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Human-readable fleet name" }
      - { name: simulator_cost_per_hour_cents, type: integer, source: input, description: "Standard rate card for simulator time on this fleet, cents per hour" }
      - { name: ioe_hours_required, type: integer, source: input, description: "Cumulative COMPLETED IOE session hours required before the IOE milestone may be completed" }
      - { name: landings_required_90d, type: integer, source: input, description: "Recency requirement: minimum landings inside the rolling 90-day window", default: 3 }

  - name: TrainingClass
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; fleet this class trains for" }
      - { name: class_date, type: datetime, source: input, description: "Scheduled first day of class (logical clock compared)" }
      - { name: seat_capacity, type: integer, source: input, description: "Physical classroom seat count; hard ceiling input to the overbooking gate", constraints: ">= 1" }
      - { name: base_attrition_rate, type: number, source: input, description: "Assumed wash-out fraction used by the attrition-overbooking gate; decimal in [0, 0.9]", constraints: "0 <= rate <= 0.9" }
      - { name: status, type: enum, source: system, description: "Class lifecycle", default: SCHEDULED, constraints: "one of SCHEDULED, OPEN, IN_SESSION, COMPLETED, CANCELLED" }
      - { name: active_enrollment_count, type: integer, source: computed, description: "Count of enrollments with status IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION}", default: 0 }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of enrollments with status IN {CONFIRMED, IN_PROGRESS, REMEDIATION, COMPLETED}", default: 0 }
      - { name: max_seats_sellable, type: integer, source: computed, description: "floor(seat_capacity * (1 + base_attrition_rate)); the overbooking ceiling", default: 0 }
      - { name: projected_completions_aggregate, type: integer, source: computed, description: "Variant A of class_seat_forecast: floor(active_enrollment_count * (1 - base_attrition_rate))", default: 0 }
      - { name: projected_completions_walk, type: integer, source: computed, description: "Variant B of class_seat_forecast: round_half_up of per-enrollment survival-probability sum in created_at ASC order", default: 0 }
      - { name: over_committed, type: boolean, source: computed, description: "true iff active_enrollment_count > max_seats_sellable (possible after attrition-rate PATCH); blocks new enrollment creation while true", default: false }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; enrolled applicant" }
      - { name: training_class_id, type: string, source: input, description: "FK -> TrainingClass.id; the class holding the seat" }
      - { name: status, type: enum, source: system, description: "Enrollment lifecycle with retraining loop", default: TENTATIVE, constraints: "one of TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION, COMPLETED, DISQUALIFIED, WITHDRAWN" }
      - { name: current_phase, type: enum, source: system, description: "Training pipeline phase", default: GROUND_SCHOOL, constraints: "one of GROUND_SCHOOL, SIMULATOR, CHECKRIDE, IOE, DONE" }
      - { name: failed_attempts, type: integer, source: computed, description: "Count of COMPLETED_FAIL checkrides for this enrollment", default: 0 }
      - { name: entered_remediation_at, type: datetime, source: system, description: "Timestamp of the most recent transition into REMEDIATION; null until first entry", constraints: "nullable" }

  - name: TrainingEvent
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the enrollment this session belongs to" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; delivering instructor" }
      - { name: simulator_slot_id, type: string, source: input, description: "FK -> SimulatorSlot.id; containing availability window; required when phase == SIMULATOR, forbidden otherwise", constraints: "nullable" }
      - { name: phase, type: enum, source: input, description: "Phase this event teaches", constraints: "one of GROUND_SCHOOL, SIMULATOR, CHECKRIDE, IOE" }
      - { name: event_type, type: enum, source: input, description: "SESSION accumulates hours; MILESTONE gates phase advancement (score >= 80)", constraints: "one of SESSION, MILESTONE" }
      - { name: scheduled_start, type: datetime, source: input, description: "Start of the session; must be >= current logical time" }
      - { name: scheduled_end, type: datetime, source: input, description: "End of the session; must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, description: "Event lifecycle", default: SCHEDULED, constraints: "one of SCHEDULED, COMPLETED, FAILED, CANCELLED" }
      - { name: score, type: integer, source: input, description: "0-100 score recorded at completion; pass threshold 80 for MILESTONE events", constraints: "nullable; 0..100" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Per-line billing computed at complete/fail per training_footprint_cost rate card; 0 for CANCELLED", default: 0 }

  - name: Checkride
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrollment under evaluation" }
      - { name: check_airman_id, type: string, source: input, description: "FK -> Instructor.id; must reference an Instructor with instructor_type == CHECK_AIRMAN" }
      - { name: ride_type, type: enum, source: input, description: "Checkride family", constraints: "one of ORAL, PRACTICAL, LINE_CHECK" }
      - { name: status, type: enum, source: system, description: "Checkride lifecycle", default: SCHEDULED, constraints: "one of SCHEDULED, COMPLETED_PASS, COMPLETED_FAIL, CANCELLED" }
      - { name: scheduled_at, type: datetime, source: input, description: "Planned ride time; must be >= current logical time" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp of record-outcome; null until recorded", constraints: "nullable" }
      - { name: attempt_number, type: integer, source: computed, description: "1 + count of prior non-CANCELLED checkrides for this enrollment at creation time" }

  - name: Qualification
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; qualified pilot" }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; fleet the qualification covers" }
      - { name: currency_state, type: enum, source: system, description: "Recency-of-experience dimension (parallel state dimension 1)", default: QUALIFIED, constraints: "one of QUALIFIED, CURRENCY_WARNING, LAPSED, REQUALIFYING, EXPIRED" }
      - { name: operating_state, type: enum, source: system, description: "Medical gate dimension (parallel state dimension 2)", default: ACTIVE, constraints: "one of ACTIVE, GROUNDED" }
      - { name: qualified_at, type: datetime, source: system, description: "Timestamp qualification was granted" }
      - { name: landings_90d, type: integer, source: computed, description: "Sum of FlightActivity.landings with activity_date in the half-open window (now - 90 days, now]", default: 0 }
      - { name: landings_expiring_7d, type: integer, source: computed, description: "Sum of FlightActivity.landings with activity_date in (now - 90 days, now - 83 days] — the oldest 7 days of the window", default: 0 }
      - { name: lapsed_since, type: datetime, source: system, description: "Timestamp currency_state first became LAPSED; cleared on exit from LAPSED; drives the 365-day EXPIRED rule", constraints: "nullable" }
      - { name: last_evaluated_at, type: datetime, source: system, description: "Timestamp of the most recent currency recompute", constraints: "nullable" }

  - name: FlightActivity
    parent: null
    common_fields: true
    fields:
      - { name: qualification_id, type: string, source: input, description: "FK -> Qualification.id; qualification the activity feeds" }
      - { name: activity_date, type: datetime, source: input, description: "When the flying occurred; must be <= current logical time" }
      - { name: landings, type: integer, source: input, description: "Landings logged on this activity", constraints: ">= 0" }
      - { name: hours, type: number, source: input, description: "Flight hours logged", constraints: ">= 0" }
      - { name: activity_type, type: enum, source: input, description: "Source of the flying", constraints: "one of REVENUE, TRAINING, CHECK" }

  - name: MedicalCertificate
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; certificate holder" }
      - { name: cert_class, type: enum, source: input, description: "FAA medical class", constraints: "one of FIRST, SECOND, THIRD" }
      - { name: issued_at, type: datetime, source: input, description: "Issue date; validity windows are computed in whole calendar months from the issue month" }
      - { name: pilot_age_at_issue, type: integer, source: input, description: "Pilot age on issued_at; selects the under-40 / 40-plus validity branches", constraints: ">= 17" }
      - { name: first_class_valid_through, type: datetime, source: computed, description: "Last day (inclusive) of the month that is FIRST-class-privilege months after the issue month (12 months if age < 40 else 6)" }
      - { name: third_class_valid_through, type: datetime, source: computed, description: "Last day (inclusive) of the month that is third-class-privilege months after the issue month (60 if age < 40 else 24)" }
      - { name: status, type: enum, source: system, description: "Evaluated validity; transitions are scan-driven", default: VALID, constraints: "one of VALID, DOWNGRADED, EXPIRED" }

  - name: BidPeriod
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; fleet whose seats are being bid" }
      - { name: opens_at, type: datetime, source: input, description: "Bidding window open (logical clock)" }
      - { name: closes_at, type: datetime, source: input, description: "Bidding window close; strictly after opens_at" }
      - { name: seats_available, type: integer, source: input, description: "Number of awardable seats in this period", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "Bid period lifecycle", default: DRAFT, constraints: "one of DRAFT, OPEN, CLOSED, AWARDED, FINALIZED" }
      - { name: awarded_at, type: datetime, source: system, description: "Timestamp of award execution; null until awarded", constraints: "nullable" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: bid_period_id, type: string, source: input, description: "FK -> BidPeriod.id; period this bid competes in" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; bidding pilot" }
      - { name: preference_rank, type: integer, source: input, description: "Pilot's own preference order for this equipment; informational within a single-equipment period", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "Bid lifecycle", default: SUBMITTED, constraints: "one of SUBMITTED, AWARDED, DENIED, WITHDRAWN" }
      - { name: denial_reason, type: enum, source: system, description: "Set when DENIED: INSUFFICIENT_SENIORITY or INELIGIBLE", constraints: "nullable; one of INSUFFICIENT_SENIORITY, INELIGIBLE" }
      - { name: seniority_snapshot, type: integer, source: computed, description: "Applicant.seniority_number captured at bid submission; ranking uses the snapshot", constraints: "nullable" }
      - { name: awarded_at, type: datetime, source: system, description: "Timestamp of award; null unless AWARDED", constraints: "nullable" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: instructor_type, type: enum, source: input, description: "Qualification tier of the instructor", constraints: "one of GROUND, SIMULATOR, CHECK_AIRMAN" }
      - { name: daily_max_sessions, type: integer, source: input, description: "Aggregate capacity: maximum non-cancelled training events per UTC calendar day", constraints: ">= 1" }

  - name: SimulatorSlot
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; simulator fleet" }
      - { name: start_at, type: datetime, source: input, description: "Availability window start" }
      - { name: end_at, type: datetime, source: input, description: "Availability window end; strictly after start_at" }
      - { name: status, type: enum, source: system, description: "Slot publish state; bookings live inside the window", default: AVAILABLE, constraints: "one of AVAILABLE, MAINTENANCE" }

  - name: CostLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; pilot whose footprint accrues the entry" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; enrollment that caused the entry", constraints: "nullable" }
      - { name: entry_type, type: enum, source: system, description: "Charge family", constraints: "one of GROUND_SCHOOL, SIMULATOR, IOE, CHECKRIDE, RETRAINING, REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount: charges positive, REVERSAL entries negative" }
      - { name: provisional, type: boolean, source: system, description: "Always true for booked entries; the final footprint variant recomputes from source events instead of the ledger", default: true }
      - { name: memo, type: string, source: system, description: "Human-readable cause, e.g. source event id or 'withdrawal reversal'", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table (6 machines; Enrollment + Qualification are cyclic,
#      Qualification carries two parallel state dimensions)
# =============================================================================
state_machines:
  - entity: Applicant
    initial_state: SCREENING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: SCREENING
        to: PRIA_PENDING
        trigger: "POST /pilot-training/applicants/{id}/advance-screening"
        actor: Recruiter
        preconditions:
          - "applicant.status == SCREENING"
          - "applicant.total_flight_hours >= 1500 (ATP_MINIMUM_HOURS)"
        side_effects:
          - "applicant.updated_at refreshed; applicant.version += 1"
      - from: PRIA_PENDING
        to: PRIA_VERIFIED
        trigger: "system bubble-up from POST /pilot-training/records-requests/{id}/verify"
        actor: system
        preconditions:
          - "every RecordsRequest with applicant_id == applicant.id has status == VERIFIED"
          - "at least one such RecordsRequest has request_type == PRIA"
        side_effects:
          - "applicant.updated_at refreshed; applicant.version += 1"
        note: "Evaluated after every RecordsRequest -> VERIFIED transition for that applicant."
      - from: PRIA_VERIFIED
        to: CLEARED
        trigger: "POST /pilot-training/applicants/{id}/clear"
        actor: Recruiter
        preconditions:
          - "applicant.status == PRIA_VERIFIED"
          - "all RecordsRequests for applicant VERIFIED (ERR_RECORDS_INCOMPLETE otherwise)"
          - "exists MedicalCertificate m: m.applicant_id == applicant.id AND m.cert_class == FIRST AND m.status == VALID (ERR_NO_VALID_MEDICAL otherwise)"
        side_effects:
          - "applicant.cleared_at = current logical time"
          - "seniority_assignment runs: applicant.seniority_number = 1 + count(Applicant rows with seniority_number IS NOT NULL)"
      - from: SCREENING
        to: REJECTED
        trigger: "POST /pilot-training/applicants/{id}/reject"
        actor: Recruiter
        preconditions: ["applicant.status IN {SCREENING, PRIA_PENDING, PRIA_VERIFIED}"]
        side_effects: ["applicant.updated_at refreshed; applicant.version += 1"]
      - from: PRIA_PENDING
        to: REJECTED
        trigger: "POST /pilot-training/applicants/{id}/reject"
        actor: Recruiter
        preconditions: ["applicant.status IN {SCREENING, PRIA_PENDING, PRIA_VERIFIED}"]
        side_effects: ["applicant.updated_at refreshed; applicant.version += 1"]
      - from: PRIA_VERIFIED
        to: REJECTED
        trigger: "POST /pilot-training/applicants/{id}/reject"
        actor: Recruiter
        preconditions: ["applicant.status IN {SCREENING, PRIA_PENDING, PRIA_VERIFIED}"]
        side_effects: ["applicant.updated_at refreshed; applicant.version += 1"]
      - from: REJECTED
        to: SCREENING
        trigger: "POST /pilot-training/applicants/{id}/appeal"
        actor: Recruiter
        preconditions: ["applicant.status == REJECTED"]
        side_effects:
          - "applicant.updated_at refreshed; applicant.version += 1"
        note: "Appeal loop — the applicant may cycle REJECTED -> SCREENING repeatedly."
      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /pilot-training/applicants/{id}/withdraw"
        actor: Recruiter
        preconditions: ["applicant.status IN {SCREENING, PRIA_PENDING, PRIA_VERIFIED}"]
        side_effects:
          - "every RecordsRequest for applicant with status IN {DRAFT, SENT} -> CANCELLED-equivalent: set status EXPIRED"
          - "applicant.updated_at refreshed; applicant.version += 1"
      - from: PRIA_PENDING
        to: WITHDRAWN
        trigger: "POST /pilot-training/applicants/{id}/withdraw"
        actor: Recruiter
        preconditions: ["applicant.status IN {SCREENING, PRIA_PENDING, PRIA_VERIFIED}"]
        side_effects:
          - "every RecordsRequest for applicant with status IN {DRAFT, SENT} -> EXPIRED"
          - "applicant.updated_at refreshed; applicant.version += 1"
      - from: PRIA_VERIFIED
        to: WITHDRAWN
        trigger: "POST /pilot-training/applicants/{id}/withdraw"
        actor: Recruiter
        preconditions: ["applicant.status IN {SCREENING, PRIA_PENDING, PRIA_VERIFIED}"]
        side_effects:
          - "every RecordsRequest for applicant with status IN {DRAFT, SENT} -> EXPIRED"
          - "applicant.updated_at refreshed; applicant.version += 1"

  - entity: RecordsRequest
    initial_state: DRAFT
    terminal_states: [VERIFIED, FAILED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /pilot-training/records-requests/{id}/send"
        actor: Recruiter
        preconditions: ["records_request.status == DRAFT"]
        side_effects:
          - "sent_at = current logical time"
          - "due_at = sent_at + 30 days (RECORDS_RESPONSE_WINDOW_DAYS)"
      - from: SENT
        to: RECEIVED
        trigger: "POST /pilot-training/records-requests/{id}/receive with outcome == RECEIVED"
        actor: Recruiter
        preconditions: ["records_request.status == SENT"]
        side_effects: ["response_received_at = current logical time"]
      - from: SENT
        to: FAILED
        trigger: "POST /pilot-training/records-requests/{id}/receive with outcome == FAILED"
        actor: Recruiter
        preconditions: ["records_request.status == SENT"]
        side_effects:
          - "response_received_at = current logical time"
          - "failure_reason = payload.failure_reason (may be null)"
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /pilot-training/records-requests/{id}/verify"
        actor: Recruiter
        preconditions: ["records_request.status == RECEIVED"]
        side_effects:
          - "bubble-up: if all RecordsRequests of the applicant are VERIFIED and >= 1 has request_type == PRIA, Applicant PRIA_PENDING -> PRIA_VERIFIED"
      - from: SENT
        to: EXPIRED
        trigger: "POST /pilot-training/_ops/run-daily-scan (system)"
        actor: system
        preconditions: ["records_request.status == SENT AND current logical time > due_at"]
        side_effects: ["records_request.updated_at refreshed"]

  - entity: TrainingClass
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /pilot-training/training-classes/{id}/open"
        actor: TrainingCoordinator
        preconditions:
          - "training_class.status == SCHEDULED"
          - "training_class.class_date > current logical time (class has not yet begun)"
        side_effects: ["training_class.version += 1; updated_at refreshed"]
      - from: OPEN
        to: IN_SESSION
        trigger: "POST /pilot-training/training-classes/{id}/start"
        actor: TrainingCoordinator
        preconditions:
          - "training_class.status == OPEN"
          - "current logical time >= training_class.class_date"
        side_effects: ["training_class.version += 1; updated_at refreshed"]
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /pilot-training/training-classes/{id}/complete"
        actor: TrainingCoordinator
        preconditions:
          - "training_class.status == IN_SESSION"
          - "no enrollment of this class has status IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION}"
        side_effects: ["training_class.version += 1; updated_at refreshed"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pilot-training/training-classes/{id}/cancel"
        actor: TrainingCoordinator
        preconditions: ["training_class.status IN {SCHEDULED, OPEN, IN_SESSION}"]
        side_effects:
          - "cascade link 1: every Enrollment with training_class_id == class.id and status IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION} -> WITHDRAWN"
          - "cascade link 2 (per withdrawn enrollment, caused by link 1): for each non-reversed charge CostLedgerEntry of that enrollment, a REVERSAL entry is inserted with amount_cents == -charge.amount_cents"
          - "cascade link 3 (per affected applicant, caused by link 2): Applicant.ledger_balance_cents recomputed as signed sum of all its CostLedgerEntry.amount_cents"
          - "class derived counts recomputed (active_enrollment_count, confirmed_count, projections)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /pilot-training/training-classes/{id}/cancel"
        actor: TrainingCoordinator
        preconditions: ["training_class.status IN {SCHEDULED, OPEN, IN_SESSION}"]
      - from: IN_SESSION
        to: CANCELLED
        trigger: "POST /pilot-training/training-classes/{id}/cancel"
        actor: TrainingCoordinator
        preconditions: ["training_class.status IN {SCHEDULED, OPEN, IN_SESSION}"]
        side_effects:
          - "cascade link 1: every non-terminal Enrollment of the class -> WITHDRAWN"
          - "cascade link 2: REVERSAL ledger entries inserted per withdrawn enrollment"
          - "cascade link 3: Applicant.ledger_balance_cents recomputed per affected applicant"
          - "class derived counts recomputed"

  - entity: Enrollment
    initial_state: TENTATIVE
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /pilot-training/enrollments/{id}/confirm"
        actor: TrainingCoordinator
        preconditions: ["enrollment.status == TENTATIVE"]
        side_effects:
          - "TrainingClass derived counts recomputed; class.version += 1"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /pilot-training/enrollments/{id}/start"
        actor: TrainingCoordinator
        preconditions:
          - "enrollment.status == CONFIRMED"
          - "TrainingClass(training_class_id).status == IN_SESSION"
        side_effects:
          - "enrollment.current_phase = GROUND_SCHOOL"
          - "TrainingClass derived counts recomputed; class.version += 1"
      - from: IN_PROGRESS
        to: REMEDIATION
        trigger: "system cascade from POST /pilot-training/checkrides/{id}/record-outcome with outcome == FAIL"
        actor: system
        preconditions: ["enrollment.status == IN_PROGRESS"]
        side_effects:
          - "enrollment.entered_remediation_at = current logical time"
          - "enrollment.failed_attempts recomputed"
          - "CostLedgerEntry RETRAINING charge inserted (round_half_up(CHECKRIDE_FEE_CENTS * RETRAINING_SURCHARGE_RATE)); caused by the enrollment entering REMEDIATION"
          - "Applicant.ledger_balance_cents recomputed from the new ledger entry (chain link caused by the ledger insert)"
      - from: REMEDIATION
        to: IN_PROGRESS
        trigger: "POST /pilot-training/enrollments/{id}/resume"
        actor: TrainingCoordinator
        preconditions:
          - "enrollment.status == REMEDIATION"
          - "exists TrainingEvent te: te.enrollment_id == enrollment.id AND te.event_type == MILESTONE AND te.status == COMPLETED AND te.score >= 80 AND te.updated_at > enrollment.entered_remediation_at"
        side_effects: ["enrollment.updated_at refreshed; enrollment.version += 1"]
      - from: IN_PROGRESS
        to: DISQUALIFIED
        trigger: "POST /pilot-training/enrollments/{id}/disqualify"
        actor: TrainingCoordinator
        preconditions: ["enrollment.status IN {IN_PROGRESS, REMEDIATION}"]
        side_effects: ["TrainingClass derived counts recomputed; class.version += 1"]
      - from: REMEDIATION
        to: DISQUALIFIED
        trigger: "POST /pilot-training/enrollments/{id}/disqualify"
        actor: TrainingCoordinator
        preconditions: ["enrollment.status IN {IN_PROGRESS, REMEDIATION}"]
        side_effects: ["TrainingClass derived counts recomputed; class.version += 1"]
      - from: DISQUALIFIED
        to: REMEDIATION
        trigger: "POST /pilot-training/enrollments/{id}/retrain"
        actor: TrainingCoordinator
        preconditions:
          - "enrollment.status == DISQUALIFIED"
          - "enrollment.failed_attempts <= 2 (MAX_CHECKRIDE_ATTEMPTS; ERR_MAX_ATTEMPTS_EXCEEDED otherwise)"
          - "TrainingClass(training_class_id).status == IN_SESSION"
        side_effects:
          - "enrollment.entered_remediation_at = current logical time"
          - "TrainingClass derived counts recomputed; class.version += 1"
        note: "Retraining loop — DISQUALIFIED is not terminal while failed_attempts <= 2."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /pilot-training/enrollments/{id}/complete"
        actor: TrainingCoordinator
        preconditions:
          - "enrollment.status == IN_PROGRESS"
          - "enrollment.current_phase == DONE"
          - "exists Checkride c: c.enrollment_id == enrollment.id AND c.status == COMPLETED_PASS"
        side_effects:
          - "TrainingClass derived counts recomputed; class.version += 1"
      - from: TENTATIVE
        to: WITHDRAWN
        trigger: "POST /pilot-training/enrollments/{id}/withdraw"
        actor: TrainingCoordinator
        preconditions: ["enrollment.status IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION}"]
        side_effects:
          - "for each non-reversed charge CostLedgerEntry of this enrollment, a REVERSAL entry with amount_cents == -charge.amount_cents is inserted"
          - "Applicant.ledger_balance_cents recomputed as signed sum over all its CostLedgerEntry rows"
          - "TrainingClass derived counts recomputed; class.version += 1"
          - "note: SCHEDULED checkrides of the enrollment are NOT cancelled by withdrawal (explicit cancel only); SCHEDULED training events ARE cancelled"
          - "every TrainingEvent of this enrollment with status == SCHEDULED -> CANCELLED"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /pilot-training/enrollments/{id}/withdraw"
        actor: TrainingCoordinator
        preconditions: ["enrollment.status IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION}"]
        side_effects:
          - "REVERSAL ledger entries for non-reversed charges (none exist yet at CONFIRMED — no-op)"
          - "Applicant.ledger_balance_cents recomputed"
          - "TrainingClass derived counts recomputed; class.version += 1"
      - from: IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /pilot-training/enrollments/{id}/withdraw"
        actor: TrainingCoordinator
        preconditions: ["enrollment.status IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION}"]
        side_effects:
          - "REVERSAL ledger entries inserted for every non-reversed charge of the enrollment"
          - "Applicant.ledger_balance_cents recomputed"
          - "TrainingClass derived counts recomputed; class.version += 1"
          - "SCHEDULED TrainingEvents of the enrollment -> CANCELLED"
      - from: REMEDIATION
        to: WITHDRAWN
        trigger: "POST /pilot-training/enrollments/{id}/withdraw"
        actor: TrainingCoordinator
        preconditions: ["enrollment.status IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION}"]
        side_effects:
          - "REVERSAL ledger entries inserted for every non-reversed charge of the enrollment"
          - "Applicant.ledger_balance_cents recomputed"
          - "TrainingClass derived counts recomputed; class.version += 1"
          - "SCHEDULED TrainingEvents of the enrollment -> CANCELLED"

  - entity: TrainingEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pilot-training/training-events/{id}/complete"
        actor: TrainingCoordinator
        preconditions:
          - "training_event.status == SCHEDULED"
          - "current logical time >= training_event.scheduled_start"
          - "if event_type == MILESTONE and phase == IOE: sum of hours over this enrollment's COMPLETED IOE SESSION events >= TrainingClass.equipment.ioe_hours_required (ERR_PHASE_PREREQUISITE_NOT_MET otherwise)"
        side_effects:
          - "billed_amount_cents computed per training_footprint_cost rate card; CostLedgerEntry inserted (GROUND_SCHOOL flat, SIMULATOR per-hour, IOE per-hour; entry_type matches phase)"
          - "Applicant.ledger_balance_cents recomputed"
          - "if event_type == MILESTONE and score >= 80 (MILESTONE_PASS_SCORE): Enrollment.current_phase advances GROUND_SCHOOL->SIMULATOR, SIMULATOR->CHECKRIDE, IOE->DONE (CHECKRIDE phase advances only via checkride PASS); enrollment.version += 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /pilot-training/training-events/{id}/fail"
        actor: TrainingCoordinator
        preconditions:
          - "training_event.status == SCHEDULED"
          - "current logical time >= training_event.scheduled_start"
        side_effects:
          - "billed_amount_cents computed per rate card (FAILED sessions are billed in full); CostLedgerEntry inserted"
          - "Applicant.ledger_balance_cents recomputed"
          - "no phase advancement"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pilot-training/training-events/{id}/cancel OR cascade (enrollment withdrawal, class cancellation, medical grounding)"
        actor: TrainingCoordinator
        preconditions: ["training_event.status == SCHEDULED"]
        side_effects:
          - "no ledger entry is created for a CANCELLED event (billed_amount_cents stays 0)"

  - entity: Checkride
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, COMPLETED_FAIL, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED_PASS
        trigger: "POST /pilot-training/checkrides/{id}/record-outcome with outcome == PASS"
        actor: CheckAirman
        preconditions:
          - "checkride.status == SCHEDULED"
          - "Enrollment(enrollment_id).status IN {IN_PROGRESS, REMEDIATION} (ERR_ENROLLMENT_INVALID_STATE otherwise)"
          - "acting CheckAirman (X-User-ID) == checkride.check_airman_id"
          - "segregation of duties: check_airman did NOT instruct any non-CANCELLED TrainingEvent of this enrollment (ERR_CHECK_AIRMAN_CONFLICT)"
          - "applicant's Qualification for the class equipment (if one exists) has operating_state != GROUNDED (ERR_MEDICAL_GROUNDED)"
        side_effects:
          - "completed_at = current logical time"
          - "Enrollment.current_phase advances CHECKRIDE -> IOE"
          - "upsert Qualification for (applicant, class equipment): if no row exists, create it with currency_state = QUALIFIED, qualified_at = now; if a row exists, only operating_state is refreshed (ACTIVE iff a VALID FIRST MedicalCertificate exists else GROUNDED) — currency_state is managed exclusively by refresh-currency / requalify / certify-requalification / scan"
          - "CostLedgerEntry CHECKRIDE charge (CHECKRIDE_FEE_CENTS) inserted; Applicant.ledger_balance_cents recomputed"
      - from: SCHEDULED
        to: COMPLETED_FAIL
        trigger: "POST /pilot-training/checkrides/{id}/record-outcome with outcome == FAIL"
        actor: CheckAirman
        preconditions:
          - "checkride.status == SCHEDULED"
          - "Enrollment(enrollment_id).status IN {IN_PROGRESS, REMEDIATION}"
          - "acting CheckAirman (X-User-ID) == checkride.check_airman_id"
          - "segregation of duties: check_airman did NOT instruct any non-CANCELLED TrainingEvent of this enrollment"
          - "applicant's Qualification for the class equipment (if one exists) has operating_state != GROUNDED"
        side_effects:
          - "completed_at = current logical time"
          - "CostLedgerEntry CHECKRIDE charge inserted; Applicant.ledger_balance_cents recomputed"
          - "cascade link 1 (caused by this transition): Enrollment IN_PROGRESS -> REMEDIATION (entered_remediation_at set, failed_attempts recomputed)"
          - "cascade link 2 (caused by link 1 — the enrollment entering REMEDIATION): CostLedgerEntry RETRAINING charge inserted"
          - "cascade link 3 (caused by link 2 — the ledger insert): Applicant.ledger_balance_cents recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pilot-training/checkrides/{id}/cancel"
        actor: TrainingCoordinator
        preconditions: ["checkride.status == SCHEDULED"]
        side_effects: ["checkride.updated_at refreshed; checkride.version += 1"]

  - entity: Qualification
    initial_state: QUALIFIED
    terminal_states: [EXPIRED]
    transitions:
      - from: QUALIFIED
        to: CURRENCY_WARNING
        trigger: "POST /pilot-training/qualifications/{id}/refresh-currency OR POST /pilot-training/_ops/run-daily-scan (system)"
        actor: system
        preconditions: ["currency_recency_check evaluates landings_90d >= required AND (landings_90d - landings_expiring_7d) < required"]
        side_effects: ["last_evaluated_at = now; landings_90d and landings_expiring_7d recomputed"]
      - from: CURRENCY_WARNING
        to: QUALIFIED
        trigger: "POST /pilot-training/qualifications/{id}/refresh-currency OR run-daily-scan"
        actor: system
        preconditions: ["currency_recency_check evaluates landings_90d >= required AND (landings_90d - landings_expiring_7d) >= required"]
        side_effects: ["last_evaluated_at = now; landings_90d and landings_expiring_7d recomputed"]
      - from: QUALIFIED
        to: LAPSED
        trigger: "POST /pilot-training/qualifications/{id}/refresh-currency OR run-daily-scan"
        actor: system
        preconditions: ["currency_recency_check evaluates landings_90d < required"]
        side_effects: ["lapsed_since = now; last_evaluated_at = now"]
      - from: CURRENCY_WARNING
        to: LAPSED
        trigger: "POST /pilot-training/qualifications/{id}/refresh-currency OR run-daily-scan"
        actor: system
        preconditions: ["currency_recency_check evaluates landings_90d < required"]
        side_effects: ["lapsed_since = now; last_evaluated_at = now"]
      - from: LAPSED
        to: REQUALIFYING
        trigger: "POST /pilot-training/qualifications/{id}/requalify"
        actor: CrewScheduler
        preconditions:
          - "qualification.currency_state == LAPSED"
          - "exists TrainingEvent te joined via Enrollment: te.phase == SIMULATOR AND te.event_type == MILESTONE AND te.status == COMPLETED AND te.score >= 80 for a qualification applicant within the 30 days preceding now (requalification ground work)"
        side_effects: ["qualification.updated_at refreshed; qualification.version += 1"]
      - from: REQUALIFYING
        to: QUALIFIED
        trigger: "POST /pilot-training/qualifications/{id}/certify-requalification"
        actor: CheckAirman
        preconditions:
          - "qualification.currency_state == REQUALIFYING"
          - "exists Checkride c joined via Enrollment: c.ride_type == PRACTICAL AND c.status == COMPLETED_PASS for this applicant on this equipment after the LAPSED -> REQUALIFYING transition"
        side_effects: ["lapsed_since = null; last_evaluated_at = now; landings counters recomputed"]
      - from: LAPSED
        to: EXPIRED
        trigger: "POST /pilot-training/_ops/run-daily-scan (system)"
        actor: system
        preconditions: ["currency_state == LAPSED AND lapsed_since <= now - 365 days"]
        side_effects: ["qualification.updated_at refreshed"]
        note: "EXPIRED is terminal — the pilot must be re-qualified from scratch via a new Qualification."
      - from: QUALIFIED
        to: GROUNDED
        trigger: "operating_state dimension: cascade from run-daily-scan when the applicant's MedicalCertificate leaves VALID (VALID -> DOWNGRADED or VALID -> EXPIRED)"
        actor: system
        preconditions: ["no MedicalCertificate m for applicant with m.status == VALID; parallel dimension operating_state currently ACTIVE"]
        side_effects:
          - "cascade link 1 (caused by the medical transition): every Qualification of the applicant operating_state ACTIVE -> GROUNDED"
          - "cascade link 2 (caused by link 1 — the grounding): every SCHEDULED TrainingEvent belonging to any enrollment of the applicant -> CANCELLED"
        note: "operating_state is a PARALLEL state dimension on Qualification, independent of currency_state; this row documents its ACTIVE -> GROUNDED leg."
      - from: GROUNDED
        to: ACTIVE
        trigger: "operating_state dimension: run-daily-scan restores operating when a VALID FIRST-class MedicalCertificate exists again"
        actor: system
        preconditions: ["exists MedicalCertificate m: m.applicant_id == qualification.applicant_id AND m.cert_class == FIRST AND m.status == VALID; operating_state currently GROUNDED"]
        side_effects: ["qualification.updated_at refreshed"]

  - entity: MedicalCertificate
    initial_state: VALID
    terminal_states: [EXPIRED]
    transitions:
      - from: VALID
        to: DOWNGRADED
        trigger: "POST /pilot-training/_ops/run-daily-scan (system)"
        actor: system
        preconditions: ["medical_validity_window: current date > first_class_valid_through AND current date <= third_class_valid_through"]
        side_effects:
          - "grounding cascade: applicant's Qualifications ACTIVE -> GROUNDED; their SCHEDULED TrainingEvents -> CANCELLED"
      - from: VALID
        to: EXPIRED
        trigger: "POST /pilot-training/_ops/run-daily-scan (system)"
        actor: system
        preconditions: ["medical_validity_window: current date > third_class_valid_through"]
        side_effects:
          - "grounding cascade: applicant's Qualifications ACTIVE -> GROUNDED; their SCHEDULED TrainingEvents -> CANCELLED"
      - from: DOWNGRADED
        to: EXPIRED
        trigger: "POST /pilot-training/_ops/run-daily-scan (system)"
        actor: system
        preconditions: ["medical_validity_window: current date > third_class_valid_through"]
        side_effects: ["certificate.updated_at refreshed"]
      - from: VALID
        to: SUSPENDED
        trigger: "POST /pilot-training/medical-certificates/{id}/suspend"
        actor: CrewScheduler
        preconditions: ["certificate.status == VALID"]
        side_effects:
          - "grounding cascade identical to the DOWNGRADED leg (SUSPENDED is not VALID, so operating gate closes)"
        note: "SUSPENDED is administrative; a suspended certificate never resumes — a new certificate must be issued."
    # SUSPENDED is terminal for the certificate; EXPIRED is the natural terminal.

  - entity: BidPeriod
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /pilot-training/bid-periods/{id}/open"
        actor: CrewScheduler
        preconditions:
          - "bid_period.status == DRAFT"
          - "current logical time >= bid_period.opens_at AND current logical time <= bid_period.closes_at"
        side_effects: ["bid_period.version += 1; updated_at refreshed"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /pilot-training/bid-periods/{id}/close OR run-daily-scan when now > closes_at"
        actor: CrewScheduler
        preconditions: ["bid_period.status == OPEN"]
        side_effects: ["bid_period.version += 1; updated_at refreshed"]
      - from: CLOSED
        to: AWARDED
        trigger: "POST /pilot-training/bid-periods/{id}/award"
        actor: CrewScheduler
        preconditions: ["bid_period.status == CLOSED"]
        side_effects:
          - "bid_award_ranking runs: eligible SUBMITTED bids ranked by seniority_snapshot ASC (tie: applicant.cleared_at ASC, then applicant.email ASC); first seats_available winners -> AWARDED (awarded_at = now)"
          - "ranked losers -> DENIED with denial_reason INSUFFICIENT_SENIORITY; ineligible bids -> DENIED with denial_reason INELIGIBLE"
          - "each winner's Applicant.current_equipment_id = bid_period.equipment_id; applicant.version += 1"
          - "bid_period.awarded_at = now; bid_period.version += 1"
      - from: AWARDED
        to: FINALIZED
        trigger: "POST /pilot-training/bid-periods/{id}/finalize"
        actor: CrewScheduler
        preconditions: ["bid_period.status == AWARDED"]
        side_effects: ["bid_period.version += 1; updated_at refreshed"]

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [AWARDED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: AWARDED
        trigger: "system cascade from POST /pilot-training/bid-periods/{id}/award"
        actor: system
        preconditions: ["bid within the first seats_available of the eligible seniority ranking"]
        side_effects: ["awarded_at = now; Applicant.current_equipment_id updated"]
      - from: SUBMITTED
        to: DENIED
        trigger: "system cascade from POST /pilot-training/bid-periods/{id}/award"
        actor: system
        preconditions: ["bid eligible but ranked beyond seats_available, or ineligible"]
        side_effects: ["denial_reason set"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /pilot-training/bids/{id}/withdraw"
        actor: Pilot
        preconditions:
          - "bid.status == SUBMITTED"
          - "BidPeriod(bid_period_id).status == OPEN"
          - "acting Pilot (X-User-ID) == bid.applicant_id"
        side_effects: ["bid.updated_at refreshed; bid.version += 1"]

  - entity: SimulatorSlot
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /pilot-training/simulator-slots/{id}/maintenance"
        actor: TrainingCoordinator
        preconditions:
          - "simulator_slot.status == AVAILABLE"
          - "no TrainingEvent with simulator_slot_id == slot.id and status == SCHEDULED (ERR_SLOT_HAS_BOOKINGS)"
        side_effects: ["slot.updated_at refreshed; slot.version += 1"]
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /pilot-training/simulator-slots/{id}/maintenance (toggle back)"
        actor: TrainingCoordinator
        preconditions: ["simulator_slot.status == MAINTENANCE"]
        side_effects: ["slot.updated_at refreshed; slot.version += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; both pass the
#      serial-observability filter — the class remains OPEN after either
#      successful write, so a second sequential request would succeed on state
#      alone and is rejected only by the stale version)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-class
    parent_entity: TrainingClass
    write_endpoint: "POST /pilot-training/enrollments"
    occ_field: "expected_training_class_version"
    description: |
      Creating an Enrollment against a TrainingClass whose version has advanced
      since the client last observed it is rejected. Each successful enrollment
      creation itself bumps TrainingClass.version (derived seat counters change),
      so a second create carrying the previously observed version is stale even
      though the class is still OPEN and the seat gate would otherwise pass.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: class-attrition-patch-stale
    parent_entity: TrainingClass
    write_endpoint: "PATCH /pilot-training/training-classes/{id}"
    occ_field: "expected_training_class_version"
    description: |
      Patching a TrainingClass's seat_capacity or base_attrition_rate against a
      stale version is rejected. A prior enrollment create/confirm/withdraw or a
      prior PATCH legitimately recomputed the attrition-driven sellable ceiling
      the client based its numbers on, so the client's view of the class is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (6 rules; dual variants on two different
#      entity domains; combinatorial modes (a), (b), (c) all exercised)
# =============================================================================
calculations:
  - name: class_seat_forecast
    trigger: "On every TrainingClass read (GET), on enrollment create/confirm/start/withdraw/disqualify/retrain/resume, and on PATCH /training-classes/{id}"
    algorithm: forward_looking
    formula: |
      # PINNED EVALUATION ORDER (mode (c) — circular-looking dependency):
      #   The enrollment gate depends on max_seats_sellable, which depends on
      #   base_attrition_rate, which a PATCH may change based on over_committed,
      #   which itself depends on max_seats_sellable. Order is pinned as:
      #   (1) recompute counts from current Enrollment statuses;
      #   (2) compute max_seats_sellable from the CURRENT base_attrition_rate;
      #   (3) compute both projection variants;
      #   (4) set over_committed; gates for FUTURE requests use these values.
      active = [e for e in Enrollment where e.training_class_id == class.id
                AND e.status IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION}]
      active_enrollment_count = len(active)
      confirmed_count = count(Enrollment where training_class_id == class.id
                AND status IN {CONFIRMED, IN_PROGRESS, REMEDIATION, COMPLETED})
      max_seats_sellable = floor(seat_capacity * (1 + base_attrition_rate))
      # Variant A — aggregate_projection:
      projected_completions_aggregate = floor(active_enrollment_count * (1 - base_attrition_rate))
      # Variant B — per_enrollment_walk (chronological):
      contributions = []
      for e in active sorted by e.created_at ASC (tie-break: Applicant(e.applicant_id).email ASC):
          if e.status IN {TENTATIVE, CONFIRMED}: p = 1 - base_attrition_rate
          elif e.status == REMEDIATION:          p = 0.80
          else:  p = PHASE_SURVIVAL[e.current_phase]   # IN_PROGRESS lookup
          contributions.append(p)
      projected_completions_walk = round_half_up(sum(contributions))
      over_committed = active_enrollment_count > max_seats_sellable
      # Enrollment gate (used by POST /enrollments):
      #   allowed iff NOT over_committed AND active_enrollment_count < max_seats_sellable
    input_set: "Enrollments of the class with status IN {TENTATIVE, CONFIRMED, IN_PROGRESS, REMEDIATION}; COMPLETED, DISQUALIFIED, WITHDRAWN excluded from active counts (COMPLETED included in confirmed_count only)"
    constants:
      PHASE_SURVIVAL_GROUND_SCHOOL: 0.90
      PHASE_SURVIVAL_SIMULATOR: 0.95
      PHASE_SURVIVAL_CHECKRIDE: 0.97
      PHASE_SURVIVAL_IOE: 0.98
      PHASE_SURVIVAL_REMEDIATION: 0.80
    precision: "integer seats; rates are exact decimals; floor and round_half_up as annotated"
    variants:
      - name: aggregate_projection
        when: "always computed; exposed as projected_completions_aggregate"
        difference: "single floor over the aggregate count; ignores per-phase survival"
      - name: per_enrollment_walk
        when: "always computed; exposed as projected_completions_walk"
        difference: "chronological per-enrollment survival probabilities summed then round_half_up; produces a different integer than aggregate_projection whenever phase mix shifts the sum across a .5 boundary"

  - name: training_footprint_cost
    trigger: "On GET /pilot-training/applicants/{id}/training-footprint; ledger insertions on TrainingEvent complete/fail, Checkride outcome, enrollment withdrawal/class cancellation reversals"
    algorithm: tiered_pricing
    formula: |
      # RATE CARD (per line, before rounding):
      #   GROUND_SCHOOL event (COMPLETED or FAILED): GROUND_SCHOOL_FEE_CENTS flat per session
      #   SIMULATOR event:    duration_hours * Equipment.simulator_cost_per_hour_cents
      #   IOE event:          duration_hours * IOE_RATE_CENTS_PER_HOUR
      #   Checkride (PASS or FAIL): CHECKRIDE_FEE_CENTS flat
      #   Checkride FAIL additionally books: RETRAINING line =
      #       round_half_up(CHECKRIDE_FEE_CENTS * RETRAINING_SURCHARGE_RATE)
      #   duration_hours = (scheduled_end - scheduled_start) / 3600 seconds, exact decimal
      #
      # PINNED ROUNDING ORDER (mode (b) — nested rounding, order matters):
      #   round each line to integer cents with round_half_up FIRST, THEN sum.
      #   ("sum then round" is the rejected alternative and yields different cents.)
      #
      # VARIANT provisional (as-booked):
      provisional_total_cents = sum(e.amount_cents for e in CostLedgerEntry
                                    where e.applicant_id == applicant.id)   # signed
      # VARIANT final (recompute-from-source):
      lines = []
      for te in TrainingEvent (any enrollment of the applicant)
                where te.status IN {COMPLETED, FAILED}
                sorted by te.created_at ASC (tie-break: te.scheduled_start ASC):
          lines.append(round_half_up(rate_card(te)))
      for c in Checkride (any enrollment of the applicant)
                where c.status IN {COMPLETED_PASS, COMPLETED_FAIL}
                sorted by c.created_at ASC (tie-break: c.scheduled_at ASC):
          lines.append(CHECKRIDE_FEE_CENTS)
          if c.status == COMPLETED_FAIL:
              lines.append(round_half_up(CHECKRIDE_FEE_CENTS * RETRAINING_SURCHARGE_RATE))
      final_total_cents = sum(lines)   # REVERSAL entries are ignored; CANCELLED events contribute nothing
    input_set: "Provisional: all CostLedgerEntry rows for the applicant (charges positive, REVERSAL negative). Final: TrainingEvents with status IN {COMPLETED, FAILED} and Checkrides with status IN {COMPLETED_PASS, COMPLETED_FAIL} across all enrollments of the applicant; CANCELLED excluded."
    constants:
      GROUND_SCHOOL_FEE_CENTS: 150000
      IOE_RATE_CENTS_PER_HOUR: 9000
      CHECKRIDE_FEE_CENTS: 120000
      RETRAINING_SURCHARGE_RATE: 0.25
      MILESTONE_PASS_SCORE: 80
      MAX_CHECKRIDE_ATTEMPTS: 2
    precision: "integer cents; round_half_up per line before summing"
    variants:
      - name: provisional
        when: "footprint endpoint called with variant == provisional (the default)"
        difference: "net as-booked ledger sum; withdrawal REVERSAL entries net charges to zero"
      - name: final
        when: "footprint endpoint called with variant == final"
        difference: "gross recompute from source events/checkrides; ignores REVERSAL rows, so a withdrawn-but-trained pilot shows the true consumed cost while provisional shows 0"

  - name: currency_recency_check
    trigger: "POST /pilot-training/qualifications/{id}/refresh-currency and every run-daily-scan"
    algorithm: threshold
    formula: |
      # Mode (a) — multi-branch with >= 3 interacting inputs
      #   (landings_90d, landings_expiring_7d, required, plus medical note below).
      # HALF-OPEN WINDOW (boundary precision): the window is (now - 90d, now];
      # an activity exactly 90 days old is EXCLUDED (strict >), one at 89d23h is included.
      window_low  = now - 90 days            # exclusive
      window_high = now                      # inclusive
      landings_90d = sum(fa.landings for fa in FlightActivity
                         where fa.qualification_id == q.id
                           AND fa.activity_date >  window_low
                           AND fa.activity_date <= window_high)
      landings_expiring_7d = sum(fa.landings for fa in FlightActivity
                         where fa.qualification_id == q.id
                           AND fa.activity_date >  now - 90 days
                           AND fa.activity_date <= now - 83 days)
      required = Equipment(q.equipment_id).landings_required_90d
      if landings_90d >= required and (landings_90d - landings_expiring_7d) >= required:
          next_currency_state = QUALIFIED
      elif landings_90d >= required:
          next_currency_state = CURRENCY_WARNING
      else:
          next_currency_state = LAPSED       # set lapsed_since = now on fresh lapse
      # operating_state is NOT touched here — the medical gate is a parallel dimension.
    input_set: "FlightActivity rows of the qualification with activity_date in (now - 90 days, now]; activity rows for other qualifications excluded"
    constants:
      RECENCY_WINDOW_DAYS: 90
      WARNING_BAND_DAYS: 7
      LAPSED_TO_EXPIRED_DAYS: 365
    precision: "datetime comparisons at second precision; window boundaries strict-exclusive low / inclusive high"

  - name: bid_award_ranking
    trigger: "POST /pilot-training/bid-periods/{id}/award"
    algorithm: weighted_scoring
    formula: |
      # Eligibility filter (pinned):
      eligible_bids = [b for b in Bid where b.bid_period_id == period.id
                       AND b.status == SUBMITTED
                       AND Applicant(b.applicant_id).status == CLEARED
                       AND exists MedicalCertificate m: m.applicant_id == b.applicant_id
                           AND m.cert_class == FIRST AND m.status == VALID]
      ineligible = [b for b in Bid where b.bid_period_id == period.id
                    AND b.status == SUBMITTED] - eligible_bids
      # Ranking expression (pinned): seniority_snapshot ASC
      # Tie-break (pinned): Applicant.cleared_at ASC, then Applicant.email ASC.
      # (Applicant.id MUST NOT participate — random ids never decide awards.)
      ranked = sort(eligible_bids, key = seniority_snapshot ASC,
                    tie = [applicant.cleared_at ASC, applicant.email ASC])
      winners = ranked[0 : seats_available]
      losers  = ranked[seats_available :]
      for b in winners: b -> AWARDED (awarded_at = now);
          Applicant(b.applicant_id).current_equipment_id = period.equipment_id
      for b in losers:  b -> DENIED (denial_reason = INSUFFICIENT_SENIORITY)
      for b in ineligible: b -> DENIED (denial_reason = INELIGIBLE)
    input_set: "Bid rows of the period with status == SUBMITTED; WITHDRAWN excluded"
    constants: {}
    precision: "integer ranking; deterministic under the pinned tie-break chain"

  - name: medical_validity_window
    trigger: "On MedicalCertificate creation and every run-daily-scan"
    algorithm: threshold
    formula: |
      # Calendar-month arithmetic: the validity month is the issue month + N months;
      # the certificate is valid THROUGH the last day of that month (inclusive).
      n1 = 12 if pilot_age_at_issue < 40 else 6     # FIRST-class privilege months
      n3 = 60 if pilot_age_at_issue < 40 else 24    # third-class privilege months
      first_class_valid_through = last_day_of_month(issued_at.year_month + n1 months)
      third_class_valid_through = last_day_of_month(issued_at.year_month + n3 months)
      # Status evaluation (date-granularity, inclusive through-dates):
      if current_date <= first_class_valid_through:  status = VALID
      elif current_date <= third_class_valid_through: status = DOWNGRADED
      else:                                           status = EXPIRED
      # Note: cert_class SECOND is stored for record-keeping only; the operating
      # gate and the clear gate both require cert_class == FIRST AND status == VALID.
    input_set: "The certificate's issued_at and pilot_age_at_issue; current logical date"
    constants:
      FIRST_CLASS_MONTHS_UNDER_40: 12
      FIRST_CLASS_MONTHS_40_PLUS: 6
      THIRD_CLASS_MONTHS_UNDER_40: 60
      THIRD_CLASS_MONTHS_40_PLUS: 24
    precision: "whole-day granularity; through-dates inclusive"

  - name: seniority_assignment
    trigger: "Applicant PRIA_VERIFIED -> CLEARED transition"
    algorithm: chronological
    formula: |
      # Sequential numbering at clear time (never renumbered afterwards):
      applicant.cleared_at = now
      applicant.seniority_number = 1 + count(Applicant where seniority_number IS NOT NULL)
      # Award-time ordering uses Bid.seniority_snapshot ASC; ties (only possible
      # via data import) break by cleared_at ASC then email ASC. Never id.
    input_set: "All Applicant rows holding a seniority_number"
    constants: {}
    precision: "integer sequence, gapless per assignment order"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; evaluation stops at the
#      first failure — dual-failure requests return the higher-priority error)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is in the endpoint's roles list; Pilot and CheckAirman additionally pass ownership/identity checks (Pilot may only act on resources whose applicant_id == X-User-ID; CheckAirman may only record outcomes where check_airman_id == X-User-ID)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path-template ids resolve to existing entities, validated left-to-right; body-supplied FK references (applicant_id, training_class_id, enrollment_id, instructor_id, simulator_slot_id, check_airman_id, qualification_id, equipment_id, bid_period_id) resolve to existing entities", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 3, category: existence, check: "Applicant exists", error_id: ERR_APPLICANT_NOT_FOUND, http_status: 404, applies_to: "endpoints with applicant id in path or body" }
  - { priority: 3, category: existence, check: "RecordsRequest exists", error_id: ERR_RECORDS_REQUEST_NOT_FOUND, http_status: 404, applies_to: "records-request action endpoints" }
  - { priority: 3, category: existence, check: "TrainingClass exists", error_id: ERR_TRAINING_CLASS_NOT_FOUND, http_status: 404, applies_to: "class endpoints and enrollment creation" }
  - { priority: 3, category: existence, check: "Enrollment exists", error_id: ERR_ENROLLMENT_NOT_FOUND, http_status: 404, applies_to: "enrollment endpoints, training-event and checkride creation" }
  - { priority: 3, category: existence, check: "TrainingEvent exists", error_id: ERR_TRAINING_EVENT_NOT_FOUND, http_status: 404, applies_to: "training-event action endpoints" }
  - { priority: 3, category: existence, check: "Checkride exists", error_id: ERR_CHECKRIDE_NOT_FOUND, http_status: 404, applies_to: "checkride action endpoints" }
  - { priority: 3, category: existence, check: "Qualification exists", error_id: ERR_QUALIFICATION_NOT_FOUND, http_status: 404, applies_to: "qualification endpoints and flight-activity creation" }
  - { priority: 3, category: existence, check: "MedicalCertificate exists", error_id: ERR_MEDICAL_CERTIFICATE_NOT_FOUND, http_status: 404, applies_to: "medical-certificate endpoints" }
  - { priority: 3, category: existence, check: "BidPeriod exists", error_id: ERR_BID_PERIOD_NOT_FOUND, http_status: 404, applies_to: "bid-period endpoints and bid creation" }
  - { priority: 4, category: state, check: "Entity-specific from-state guard for the requested transition (Applicant, RecordsRequest, TrainingClass, Enrollment, TrainingEvent, Checkride, Qualification, BidPeriod, Bid, SimulatorSlot state machines)", error_id: ERR_APPLICANT_INVALID_STATE, http_status: 409, applies_to: "applicant action endpoints" }
  - { priority: 4, category: state, check: "RecordsRequest in the required from-state", error_id: ERR_RECORDS_REQUEST_INVALID_STATE, http_status: 409, applies_to: "records-request action endpoints" }
  - { priority: 4, category: state, check: "Enrollment creation requires TrainingClass.status == OPEN", error_id: ERR_CLASS_NOT_OPEN, http_status: 409, applies_to: "POST /pilot-training/enrollments" }
  - { priority: 4, category: state, check: "TrainingClass in the required from-state for open/start/complete/cancel/PATCH (cancel allowed from SCHEDULED/OPEN/IN_SESSION; PATCH allowed only in SCHEDULED or OPEN)", error_id: ERR_CLASS_INVALID_STATE, http_status: 409, applies_to: "training-class action endpoints" }
  - { priority: 4, category: state, check: "Enrollment in the required from-state; also related-entity state guards (class IN_SESSION for start; enrollment IN_PROGRESS/REMEDIATION for checkride record-outcome)", error_id: ERR_ENROLLMENT_INVALID_STATE, http_status: 409, applies_to: "enrollment action endpoints, checkride record-outcome" }
  - { priority: 4, category: state, check: "TrainingEvent in SCHEDULED for complete/fail/cancel", error_id: ERR_TRAINING_EVENT_INVALID_STATE, http_status: 409, applies_to: "training-event action endpoints" }
  - { priority: 4, category: state, check: "Checkride in SCHEDULED for record-outcome/cancel", error_id: ERR_CHECKRIDE_INVALID_STATE, http_status: 409, applies_to: "checkride action endpoints" }
  - { priority: 4, category: state, check: "Qualification currency_state in the required from-state for requalify/certify-requalification", error_id: ERR_QUALIFICATION_INVALID_STATE, http_status: 409, applies_to: "qualification action endpoints" }
  - { priority: 4, category: state, check: "BidPeriod in the required from-state (OPEN for bid create, CLOSED for award, AWARDED for finalize, DRAFT for open)", error_id: ERR_BID_PERIOD_INVALID_STATE, http_status: 409, applies_to: "bid-period action endpoints, POST /pilot-training/bids" }
  - { priority: 4, category: state, check: "Bid in SUBMITTED for withdraw", error_id: ERR_BID_INVALID_STATE, http_status: 409, applies_to: "POST /pilot-training/bids/{id}/withdraw" }
  - { priority: 4, category: state, check: "SimulatorSlot in AVAILABLE for bookings and MAINTENANCE toggle preconditions", error_id: ERR_SLOT_NOT_AVAILABLE, http_status: 409, applies_to: "training-event creation with simulator_slot_id, simulator-slot maintenance" }
  - { priority: 5, category: business_safety, check: "Segregation of duties: check_airman_id of a checkride MUST NOT equal the instructor_id of any non-CANCELLED TrainingEvent of the same enrollment (checked at checkride creation AND at record-outcome)", error_id: ERR_CHECK_AIRMAN_CONFLICT, http_status: 422, applies_to: "POST /pilot-training/checkrides, POST /pilot-training/checkrides/{id}/record-outcome" }
  - { priority: 6, category: business_safety, check: "Medical gate: IOE-phase TrainingEvent creation and checkride record-outcome are forbidden while the applicant's Qualification for the class equipment has operating_state == GROUNDED", error_id: ERR_MEDICAL_GROUNDED, http_status: 422, applies_to: "POST /pilot-training/training-events, POST /pilot-training/checkrides/{id}/record-outcome" }
  - { priority: 7, category: business_safety, check: "Currency gate: IOE-phase TrainingEvent creation is forbidden while the applicant's Qualification for the class equipment has currency_state == LAPSED or EXPIRED", error_id: ERR_CURRENCY_LAPSED, http_status: 422, applies_to: "POST /pilot-training/training-events" }
  - { priority: 8, category: business_referential, check: "Applicant clear requires every RecordsRequest VERIFIED (and >= 1 PRIA)", error_id: ERR_RECORDS_INCOMPLETE, http_status: 409, applies_to: "POST /pilot-training/applicants/{id}/clear" }
  - { priority: 9, category: business_referential, check: "Applicant clear requires a VALID FIRST-class MedicalCertificate", error_id: ERR_NO_VALID_MEDICAL, http_status: 422, applies_to: "POST /pilot-training/applicants/{id}/clear" }
  - { priority: 10, category: business_referential, check: "Instructor qualification: event phase GROUND_SCHOOL requires instructor_type IN {GROUND, CHECK_AIRMAN}; SIMULATOR requires {SIMULATOR, CHECK_AIRMAN}; IOE and CHECKRIDE phases require {CHECK_AIRMAN}; a checkride's check_airman_id must reference instructor_type == CHECK_AIRMAN", error_id: ERR_INSTRUCTOR_NOT_QUALIFIED, http_status: 422, applies_to: "POST /pilot-training/training-events, POST /pilot-training/checkrides" }
  - { priority: 11, category: business_temporal, check: "Simulator containment + half-open overlap: a SIMULATOR event must be fully contained in its SimulatorSlot window (slot.start_at <= scheduled_start AND scheduled_end <= slot.end_at; boundary equality allowed) and must not overlap any other SCHEDULED event in the same slot under half-open [start, end) semantics — back-to-back adjacency is allowed", error_id: ERR_SLOT_TEMPORAL_OVERLAP, http_status: 409, applies_to: "POST /pilot-training/training-events" }
  - { priority: 12, category: business_temporal, check: "Instructor buffer semantics: any two non-CANCELLED events of the same instructor must be separated by >= 30 minutes end-to-start (either direction); mere non-overlap is NOT sufficient — a 0-29 minute gap is rejected", error_id: ERR_INSTRUCTOR_BUFFER_VIOLATION, http_status: 409, applies_to: "POST /pilot-training/training-events" }
  - { priority: 13, category: business_temporal, check: "Scheduling window: scheduled_start >= current logical time; FlightActivity.activity_date <= current logical time; checkride.scheduled_at >= current logical time", error_id: ERR_FUTURE_ACTIVITY_DATE, http_status: 422, applies_to: "POST /pilot-training/training-events, POST /pilot-training/flight-activities, POST /pilot-training/checkrides" }
  - { priority: 14, category: business_constraint, check: "Instructor aggregate capacity: count of the instructor's non-CANCELLED events on the new event's UTC calendar day must be < daily_max_sessions", error_id: ERR_INSTRUCTOR_DAILY_LIMIT, http_status: 409, applies_to: "POST /pilot-training/training-events" }
  - { priority: 15, category: business_constraint, check: "ATP screening gate: total_flight_hours >= 1500", error_id: ERR_INSUFFICIENT_FLIGHT_HOURS, http_status: 422, applies_to: "POST /pilot-training/applicants/{id}/advance-screening" }
  - { priority: 16, category: business_constraint, check: "Applicant email uniqueness across all applicants", error_id: ERR_DUPLICATE_EMAIL, http_status: 409, applies_to: "POST /pilot-training/applicants" }
  - { priority: 16, category: business_constraint, check: "One bid per applicant per bid period", error_id: ERR_DUPLICATE_BID, http_status: 409, applies_to: "POST /pilot-training/bids" }
  - { priority: 16, category: business_constraint, check: "One Qualification row per (applicant_id, equipment_id) pair", error_id: ERR_DUPLICATE_QUALIFICATION, http_status: 409, applies_to: "POST /pilot-training/qualifications" }
  - { priority: 16, category: business_constraint, check: "One non-terminal Enrollment per (applicant_id, training_class_id) pair", error_id: ERR_DUPLICATE_ENROLLMENT, http_status: 409, applies_to: "POST /pilot-training/enrollments" }
  - { priority: 16, category: business_constraint, check: "Phase discipline: event.phase must equal enrollment.current_phase (IN_PROGRESS) or be an earlier phase (REMEDIATION only); IOE MILESTONE completion requires cumulative COMPLETED IOE session hours >= ioe_hours_required; retrain requires failed_attempts <= 2", error_id: ERR_PHASE_PREREQUISITE_NOT_MET, http_status: 422, applies_to: "POST /pilot-training/training-events, POST /pilot-training/training-events/{id}/complete, POST /pilot-training/enrollments/{id}/resume" }
  - { priority: 16, category: business_constraint, check: "Retrain attempt ceiling: failed_attempts <= MAX_CHECKRIDE_ATTEMPTS (2)", error_id: ERR_MAX_ATTEMPTS_EXCEEDED, http_status: 422, applies_to: "POST /pilot-training/enrollments/{id}/retrain" }
  - { priority: 16, category: business_constraint, check: "Slot maintenance blocked while SCHEDULED bookings exist in the window", error_id: ERR_SLOT_HAS_BOOKINGS, http_status: 409, applies_to: "POST /pilot-training/simulator-slots/{id}/maintenance" }
  - { priority: 16, category: business_constraint, check: "Malformed input: missing required fields, wrong types, enum outside the declared set, scheduled_end <= scheduled_start, landings < 0, rate outside [0, 0.9], seat_capacity < 1", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 17, category: business_fiscal, check: "Attrition-overbooking seat gate: enrollment creation allowed iff NOT TrainingClass.over_committed AND active_enrollment_count < max_seats_sellable, both evaluated on pre-request state", error_id: ERR_CLASS_FULL, http_status: 409, applies_to: "POST /pilot-training/enrollments" }
  - { priority: 18, category: state, check: "OCC: expected_training_class_version equals TrainingClass.version, checked last, immediately before the write", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /pilot-training/enrollments, PATCH /pilot-training/training-classes/{id}" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Applicants ----
  - { method: POST, path: "/pilot-training/applicants", description: "Create applicant (initial status SCREENING)", roles: [Recruiter, SystemAdmin], code: 201, input: [full_name, email, license_number, total_flight_hours], output: Applicant, side_effects: [status initialized SCREENING] }
  - { method: GET, path: "/pilot-training/applicants", description: "List applicants with optional filters", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: ["status?", "email?", "current_equipment_id?", "limit?", "offset?"], output: "Applicant[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/applicants/{id}", description: "Read one applicant; Pilot role restricted to own id", roles: [Recruiter, CrewScheduler, TrainingCoordinator, Pilot, SystemAdmin], code: 200, input: [], output: Applicant, side_effects: [] }
  - { method: POST, path: "/pilot-training/applicants/{id}/advance-screening", description: "SCREENING -> PRIA_PENDING (hours gate 1500)", roles: [Recruiter, SystemAdmin], code: 200, input: [], output: Applicant, side_effects: ["applicant.version += 1"] }
  - { method: POST, path: "/pilot-training/applicants/{id}/clear", description: "PRIA_VERIFIED -> CLEARED; assigns seniority_number", roles: [Recruiter, SystemAdmin], code: 200, input: [], output: Applicant, side_effects: ["seniority_assignment runs", "cleared_at stamped", "applicant.version += 1"] }
  - { method: POST, path: "/pilot-training/applicants/{id}/reject", description: "-> REJECTED from SCREENING/PRIA_PENDING/PRIA_VERIFIED", roles: [Recruiter, SystemAdmin], code: 200, input: ["reason?"], output: Applicant, side_effects: ["applicant.version += 1"] }
  - { method: POST, path: "/pilot-training/applicants/{id}/appeal", description: "REJECTED -> SCREENING (appeal loop)", roles: [Recruiter, SystemAdmin], code: 200, input: [], output: Applicant, side_effects: ["applicant.version += 1"] }
  - { method: POST, path: "/pilot-training/applicants/{id}/withdraw", description: "-> WITHDRAWN (terminal); expires open records requests", roles: [Recruiter, Pilot, SystemAdmin], code: 200, input: [], output: Applicant, side_effects: ["open RecordsRequests -> EXPIRED", "applicant.version += 1"] }
  - { method: GET, path: "/pilot-training/applicants/{id}/training-footprint", description: "Computed training cost read; variant param selects provisional (default) or final algorithm", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: ["variant?"], output: "{ applicant_id: string, variant: string, provisional_total_cents: integer, final_total_cents: integer, entry_count: integer }", side_effects: ["training_footprint_cost evaluated"] }

  # ---- Records requests (PRIA) ----
  - { method: POST, path: "/pilot-training/records-requests", description: "Create records request for an applicant (DRAFT)", roles: [Recruiter, SystemAdmin], code: 201, input: [applicant_id, request_type], output: RecordsRequest, side_effects: [] }
  - { method: GET, path: "/pilot-training/records-requests", description: "List records requests; filtered by applicant_id for FK reverse-reachability", roles: [Recruiter, SystemAdmin], code: 200, input: ["applicant_id?", "status?", "limit?", "offset?"], output: "RecordsRequest[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/records-requests/{id}", description: "Read one records request", roles: [Recruiter, SystemAdmin], code: 200, input: [], output: RecordsRequest, side_effects: [] }
  - { method: POST, path: "/pilot-training/records-requests/{id}/send", description: "DRAFT -> SENT; stamps sent_at and due_at = sent_at + 30d", roles: [Recruiter, SystemAdmin], code: 200, input: [], output: RecordsRequest, side_effects: ["sent_at, due_at stamped", "version += 1"] }
  - { method: POST, path: "/pilot-training/records-requests/{id}/receive", description: "SENT -> RECEIVED or FAILED depending on outcome", roles: [Recruiter, SystemAdmin], code: 200, input: [outcome, "failure_reason?"], output: RecordsRequest, side_effects: ["response_received_at stamped", "version += 1"] }
  - { method: POST, path: "/pilot-training/records-requests/{id}/verify", description: "RECEIVED -> VERIFIED; bubbles Applicant PRIA_PENDING -> PRIA_VERIFIED when all requests verified", roles: [Recruiter, SystemAdmin], code: 200, input: [], output: RecordsRequest, side_effects: ["applicant bubble-up re-evaluated", "version += 1"] }

  # ---- Equipment ----
  - { method: POST, path: "/pilot-training/equipment", description: "Create fleet row", roles: [TrainingCoordinator, SystemAdmin], code: 201, input: [code, name, simulator_cost_per_hour_cents, ioe_hours_required, "landings_required_90d?"], output: Equipment, side_effects: [] }
  - { method: GET, path: "/pilot-training/equipment", description: "List equipment", roles: [Recruiter, CrewScheduler, TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: ["limit?", "offset?"], output: "Equipment[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/equipment/{id}", description: "Read one equipment", roles: [Recruiter, CrewScheduler, TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: [], output: Equipment, side_effects: [] }

  # ---- Training classes ----
  - { method: POST, path: "/pilot-training/training-classes", description: "Create class (SCHEDULED); version starts at 1", roles: [TrainingCoordinator, SystemAdmin], code: 201, input: [equipment_id, class_date, seat_capacity, base_attrition_rate], output: TrainingClass, side_effects: ["derived counters initialized"] }
  - { method: GET, path: "/pilot-training/training-classes", description: "List classes; filtered by equipment_id/status", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: ["equipment_id?", "status?", "limit?", "offset?"], output: "TrainingClass[]", side_effects: ["class_seat_forecast recomputed per row"] }
  - { method: GET, path: "/pilot-training/training-classes/{id}", description: "Read class incl. derived counters and both projections", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: [], output: TrainingClass, side_effects: ["class_seat_forecast recomputed"] }
  - { method: POST, path: "/pilot-training/training-classes/{id}/open", description: "SCHEDULED -> OPEN (class_date must be in the future)", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: TrainingClass, side_effects: ["class.version += 1"] }
  - { method: POST, path: "/pilot-training/training-classes/{id}/start", description: "OPEN -> IN_SESSION (clock >= class_date)", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: TrainingClass, side_effects: ["class.version += 1"] }
  - { method: POST, path: "/pilot-training/training-classes/{id}/complete", description: "IN_SESSION -> COMPLETED; requires all enrollments terminal or disqualified", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: TrainingClass, side_effects: ["class.version += 1"] }
  - { method: POST, path: "/pilot-training/training-classes/{id}/cancel", description: "SCHEDULED/OPEN -> CANCELLED; cascades enrollment withdrawals, REVERSAL ledger entries, applicant balance recompute", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: TrainingClass, side_effects: ["non-terminal enrollments -> WITHDRAWN", "REVERSAL CostLedgerEntries", "Applicant.ledger_balance_cents recomputed", "class.version += 1"] }
  - { method: PATCH, path: "/pilot-training/training-classes/{id}", description: "Update seat_capacity / base_attrition_rate under OCC; may drive the class into over_committed", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: ["seat_capacity?", "base_attrition_rate?", expected_training_class_version], output: TrainingClass, side_effects: ["class_seat_forecast recomputed with NEW values", "over_committed recomputed", "class.version += 1"] }

  # ---- Enrollments ----
  - { method: POST, path: "/pilot-training/enrollments", description: "Create enrollment (TENTATIVE) under OCC against the class; seat gate enforced", roles: [TrainingCoordinator, SystemAdmin], code: 201, input: [applicant_id, training_class_id, expected_training_class_version], output: Enrollment, side_effects: ["class derived counters recomputed", "increments TrainingClass.version by 1"] }
  - { method: GET, path: "/pilot-training/enrollments", description: "List enrollments; filtered by applicant_id / training_class_id / status", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: ["applicant_id?", "training_class_id?", "status?", "limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/enrollments/{id}", description: "Read one enrollment", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/pilot-training/enrollments/{id}/confirm", description: "TENTATIVE -> CONFIRMED", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Enrollment, side_effects: ["class counters recomputed", "class.version += 1", "enrollment.version += 1"] }
  - { method: POST, path: "/pilot-training/enrollments/{id}/start", description: "CONFIRMED -> IN_PROGRESS; sets current_phase GROUND_SCHOOL; class must be IN_SESSION", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Enrollment, side_effects: ["class counters recomputed", "class.version += 1", "enrollment.version += 1"] }
  - { method: POST, path: "/pilot-training/enrollments/{id}/withdraw", description: "-> WITHDRAWN; books REVERSAL entries, cancels SCHEDULED events, recomputes class counters", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Enrollment, side_effects: ["REVERSAL CostLedgerEntries", "Applicant.ledger_balance_cents recomputed", "SCHEDULED TrainingEvents -> CANCELLED", "class.version += 1", "enrollment.version += 1"] }
  - { method: POST, path: "/pilot-training/enrollments/{id}/disqualify", description: "IN_PROGRESS/REMEDIATION -> DISQUALIFIED", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Enrollment, side_effects: ["class counters recomputed", "class.version += 1", "enrollment.version += 1"] }
  - { method: POST, path: "/pilot-training/enrollments/{id}/retrain", description: "DISQUALIFIED -> REMEDIATION (loop); requires failed_attempts <= 2 and class IN_SESSION", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Enrollment, side_effects: ["entered_remediation_at stamped", "class counters recomputed", "class.version += 1", "enrollment.version += 1"] }
  - { method: POST, path: "/pilot-training/enrollments/{id}/resume", description: "REMEDIATION -> IN_PROGRESS; requires a passing MILESTONE completed after entered_remediation_at", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Enrollment, side_effects: ["enrollment.version += 1"] }
  - { method: POST, path: "/pilot-training/enrollments/{id}/complete", description: "IN_PROGRESS -> COMPLETED; requires current_phase DONE and a COMPLETED_PASS checkride", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Enrollment, side_effects: ["class counters recomputed", "class.version += 1", "enrollment.version += 1"] }

  # ---- Training events ----
  - { method: POST, path: "/pilot-training/training-events", description: "Schedule a session/milestone; validates phase discipline, instructor tier, slot containment+overlap, instructor buffer and daily limit", roles: [TrainingCoordinator, SystemAdmin], code: 201, input: [enrollment_id, instructor_id, "simulator_slot_id?", phase, event_type, scheduled_start, scheduled_end], output: TrainingEvent, side_effects: [] }
  - { method: GET, path: "/pilot-training/training-events", description: "List events; filtered by enrollment_id / instructor_id / simulator_slot_id / status", roles: [Recruiter, CrewScheduler, TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: ["enrollment_id?", "instructor_id?", "simulator_slot_id?", "status?", "limit?", "offset?"], output: "TrainingEvent[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/training-events/{id}", description: "Read one event", roles: [Recruiter, CrewScheduler, TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: [], output: TrainingEvent, side_effects: [] }
  - { method: POST, path: "/pilot-training/training-events/{id}/complete", description: "SCHEDULED -> COMPLETED; bills the event; passing MILESTONE (score >= 80) advances enrollment phase", roles: [TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: [score], output: TrainingEvent, side_effects: ["billed_amount_cents computed", "CostLedgerEntry inserted", "Applicant.ledger_balance_cents recomputed", "phase advancement on passing MILESTONE", "enrollment.version += 1 when phase advances"] }
  - { method: POST, path: "/pilot-training/training-events/{id}/fail", description: "SCHEDULED -> FAILED; bills in full; no phase advancement", roles: [TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: ["score?"], output: TrainingEvent, side_effects: ["billed_amount_cents computed", "CostLedgerEntry inserted", "Applicant.ledger_balance_cents recomputed"] }
  - { method: POST, path: "/pilot-training/training-events/{id}/cancel", description: "SCHEDULED -> CANCELLED; no billing", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: TrainingEvent, side_effects: ["event.version += 1"] }

  # ---- Checkrides ----
  - { method: POST, path: "/pilot-training/checkrides", description: "Schedule a checkride; enrollment must be IN_PROGRESS with current_phase == CHECKRIDE; airman tier + conflict checks apply", roles: [TrainingCoordinator, SystemAdmin], code: 201, input: [enrollment_id, check_airman_id, ride_type, scheduled_at], output: Checkride, side_effects: ["attempt_number computed"] }
  - { method: GET, path: "/pilot-training/checkrides", description: "List checkrides; filtered by enrollment_id / check_airman_id / status", roles: [Recruiter, CrewScheduler, TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: ["enrollment_id?", "check_airman_id?", "status?", "limit?", "offset?"], output: "Checkride[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/checkrides/{id}", description: "Read one checkride", roles: [Recruiter, CrewScheduler, TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: [], output: Checkride, side_effects: [] }
  - { method: POST, path: "/pilot-training/checkrides/{id}/record-outcome", description: "SCHEDULED -> COMPLETED_PASS/COMPLETED_FAIL; PASS advances phase to IOE and upserts Qualification; FAIL cascades enrollment -> REMEDIATION -> RETRAINING ledger -> applicant balance", roles: [CheckAirman, SystemAdmin], code: 200, input: [outcome], output: Checkride, side_effects: ["completed_at stamped", "CHECKRIDE ledger entry", "PASS: phase -> IOE + Qualification upsert", "FAIL: enrollment REMEDIATION cascade + RETRAINING ledger entry", "Applicant.ledger_balance_cents recomputed"] }
  - { method: POST, path: "/pilot-training/checkrides/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Checkride, side_effects: ["checkride.version += 1"] }

  # ---- Qualifications & currency ----
  - { method: POST, path: "/pilot-training/qualifications", description: "Grant qualification (QUALIFIED/ACTIVE); applicant must be CLEARED; one row per (applicant, equipment)", roles: [CrewScheduler, SystemAdmin], code: 201, input: [applicant_id, equipment_id], output: Qualification, side_effects: ["qualified_at stamped"] }
  - { method: GET, path: "/pilot-training/qualifications", description: "List qualifications; filtered by applicant_id / equipment_id / currency_state", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: ["applicant_id?", "equipment_id?", "currency_state?", "limit?", "offset?"], output: "Qualification[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/qualifications/{id}", description: "Read one qualification incl. computed landings counters", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: [], output: Qualification, side_effects: ["landings counters recomputed"] }
  - { method: POST, path: "/pilot-training/qualifications/{id}/refresh-currency", description: "Re-run currency_recency_check and transition currency_state accordingly", roles: [CrewScheduler, SystemAdmin], code: 200, input: [], output: Qualification, side_effects: ["currency_recency_check evaluated", "lapsed_since set on fresh LAPSED", "qualification.version += 1 on transition"] }
  - { method: POST, path: "/pilot-training/qualifications/{id}/requalify", description: "LAPSED -> REQUALIFYING; requires a recent passing SIMULATOR milestone", roles: [CrewScheduler, SystemAdmin], code: 200, input: [], output: Qualification, side_effects: ["qualification.version += 1"] }
  - { method: POST, path: "/pilot-training/qualifications/{id}/certify-requalification", description: "REQUALIFYING -> QUALIFIED; requires a PRACTICAL checkride PASS after entering REQUALIFYING", roles: [CheckAirman, SystemAdmin], code: 200, input: [], output: Qualification, side_effects: ["lapsed_since cleared", "qualification.version += 1"] }

  # ---- Flight activity ----
  - { method: POST, path: "/pilot-training/flight-activities", description: "Log flying against a qualification; activity_date must not be in the future", roles: [CrewScheduler, SystemAdmin], code: 201, input: [qualification_id, activity_date, landings, hours, activity_type], output: FlightActivity, side_effects: ["landings_90d / landings_expiring_7d recomputed on next refresh or read"] }
  - { method: GET, path: "/pilot-training/flight-activities", description: "List flight activities; filtered by qualification_id", roles: [CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: ["qualification_id?", "limit?", "offset?"], output: "FlightActivity[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/flight-activities/{id}", description: "Read one flight activity", roles: [CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: [], output: FlightActivity, side_effects: [] }

  # ---- Medical certificates ----
  - { method: POST, path: "/pilot-training/medical-certificates", description: "Issue a medical certificate; validity windows computed from issue month + age branch; initial status evaluated immediately", roles: [CrewScheduler, SystemAdmin], code: 201, input: [applicant_id, cert_class, issued_at, pilot_age_at_issue], output: MedicalCertificate, side_effects: ["medical_validity_window evaluated for initial status"] }
  - { method: GET, path: "/pilot-training/medical-certificates", description: "List certificates; filtered by applicant_id / status", roles: [Recruiter, CrewScheduler, SystemAdmin], code: 200, input: ["applicant_id?", "status?", "limit?", "offset?"], output: "MedicalCertificate[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/medical-certificates/{id}", description: "Read one certificate", roles: [Recruiter, CrewScheduler, SystemAdmin], code: 200, input: [], output: MedicalCertificate, side_effects: [] }
  - { method: POST, path: "/pilot-training/medical-certificates/{id}/suspend", description: "VALID -> SUSPENDED (terminal); fires grounding cascade", roles: [CrewScheduler, SystemAdmin], code: 200, input: [], output: MedicalCertificate, side_effects: ["grounding cascade: qualifications GROUNDED, SCHEDULED events CANCELLED", "certificate.version += 1"] }

  # ---- Bid periods & bids ----
  - { method: POST, path: "/pilot-training/bid-periods", description: "Create bid period (DRAFT)", roles: [CrewScheduler, SystemAdmin], code: 201, input: [equipment_id, opens_at, closes_at, seats_available], output: BidPeriod, side_effects: [] }
  - { method: GET, path: "/pilot-training/bid-periods", description: "List bid periods; filtered by equipment_id / status", roles: [Recruiter, CrewScheduler, TrainingCoordinator, Pilot, SystemAdmin], code: 200, input: ["equipment_id?", "status?", "limit?", "offset?"], output: "BidPeriod[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/bid-periods/{id}", description: "Read one bid period", roles: [Recruiter, CrewScheduler, TrainingCoordinator, Pilot, SystemAdmin], code: 200, input: [], output: BidPeriod, side_effects: [] }
  - { method: POST, path: "/pilot-training/bid-periods/{id}/open", description: "DRAFT -> OPEN; requires opens_at <= now <= closes_at", roles: [CrewScheduler, SystemAdmin], code: 200, input: [], output: BidPeriod, side_effects: ["period.version += 1"] }
  - { method: POST, path: "/pilot-training/bid-periods/{id}/close", description: "OPEN -> CLOSED", roles: [CrewScheduler, SystemAdmin], code: 200, input: [], output: BidPeriod, side_effects: ["period.version += 1"] }
  - { method: POST, path: "/pilot-training/bid-periods/{id}/award", description: "CLOSED -> AWARDED; runs bid_award_ranking over SUBMITTED bids", roles: [CrewScheduler, SystemAdmin], code: 200, input: [], output: BidPeriod, side_effects: ["bids -> AWARDED / DENIED with denial_reason", "winner Applicant.current_equipment_id set", "period.awarded_at stamped", "period.version += 1"] }
  - { method: POST, path: "/pilot-training/bid-periods/{id}/finalize", description: "AWARDED -> FINALIZED (locks results)", roles: [CrewScheduler, SystemAdmin], code: 200, input: [], output: BidPeriod, side_effects: ["period.version += 1"] }
  - { method: POST, path: "/pilot-training/bids", description: "Submit a bid (SUBMITTED); period must be OPEN; one bid per applicant per period; snapshots seniority_number", roles: [CrewScheduler, Pilot, SystemAdmin], code: 201, input: [bid_period_id, applicant_id, preference_rank], output: Bid, side_effects: ["seniority_snapshot captured"] }
  - { method: GET, path: "/pilot-training/bids", description: "List bids; filtered by bid_period_id / applicant_id / status", roles: [Recruiter, CrewScheduler, TrainingCoordinator, Pilot, SystemAdmin], code: 200, input: ["bid_period_id?", "applicant_id?", "status?", "limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/bids/{id}", description: "Read one bid", roles: [Recruiter, CrewScheduler, TrainingCoordinator, Pilot, SystemAdmin], code: 200, input: [], output: Bid, side_effects: [] }
  - { method: POST, path: "/pilot-training/bids/{id}/withdraw", description: "SUBMITTED -> WITHDRAWN while period OPEN; Pilot restricted to own bids", roles: [CrewScheduler, Pilot, SystemAdmin], code: 200, input: [], output: Bid, side_effects: ["bid.version += 1"] }

  # ---- Instructors ----
  - { method: POST, path: "/pilot-training/instructors", description: "Create instructor", roles: [TrainingCoordinator, SystemAdmin], code: 201, input: [full_name, instructor_type, daily_max_sessions], output: Instructor, side_effects: [] }
  - { method: GET, path: "/pilot-training/instructors", description: "List instructors", roles: [Recruiter, CrewScheduler, TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: ["instructor_type?", "limit?", "offset?"], output: "Instructor[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/instructors/{id}", description: "Read one instructor", roles: [Recruiter, CrewScheduler, TrainingCoordinator, CheckAirman, SystemAdmin], code: 200, input: [], output: Instructor, side_effects: [] }

  # ---- Simulator slots ----
  - { method: POST, path: "/pilot-training/simulator-slots", description: "Publish a simulator availability window (AVAILABLE)", roles: [TrainingCoordinator, SystemAdmin], code: 201, input: [equipment_id, start_at, end_at], output: SimulatorSlot, side_effects: [] }
  - { method: GET, path: "/pilot-training/simulator-slots", description: "List slots; filtered by equipment_id / status", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: ["equipment_id?", "status?", "limit?", "offset?"], output: "SimulatorSlot[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/simulator-slots/{id}", description: "Read one slot", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: [], output: SimulatorSlot, side_effects: [] }
  - { method: POST, path: "/pilot-training/simulator-slots/{id}/maintenance", description: "Toggle AVAILABLE <-> MAINTENANCE; blocked while SCHEDULED bookings exist", roles: [TrainingCoordinator, SystemAdmin], code: 200, input: [], output: SimulatorSlot, side_effects: ["slot.version += 1"] }

  # ---- Cost ledger (append-only; entries are created only by cascades) ----
  - { method: GET, path: "/pilot-training/cost-ledger", description: "List ledger entries; filtered by applicant_id / enrollment_id / entry_type", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: ["applicant_id?", "enrollment_id?", "entry_type?", "limit?", "offset?"], output: "CostLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/pilot-training/cost-ledger/{id}", description: "Read one ledger entry", roles: [Recruiter, CrewScheduler, TrainingCoordinator, SystemAdmin], code: 200, input: [], output: CostLedgerEntry, side_effects: [] }

  # ---- Ops-run checkpoint & logical clock (test-driving endpoints) ----
  - { method: POST, path: "/pilot-training/_ops/run-daily-scan", description: "Advance all clock-driven rules once: medical validity transitions + grounding cascade + restoration, records-request expiry, bid-period auto-close, currency refresh, LAPSED -> EXPIRED after 365 days", roles: [SystemAdmin], code: 200, input: [], output: "{ medical_updated: integer, requests_expired: integer, bid_periods_closed: integer, qualifications_grounded: integer, qualifications_currency_updated: integer, events_cancelled: integer }", side_effects: ["medical_validity_window evaluated for all certificates", "currency_recency_check evaluated for all non-EXPIRED qualifications", "RecordsRequest SENT past due_at -> EXPIRED", "BidPeriod OPEN past closes_at -> CLOSED", "grounding cascade fires"] }
  - { method: POST, path: "/pilot-training/_clock/set-current-utc", description: "Set the logical clock. Startup default before any set call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced; no rule evaluation until run-daily-scan or endpoint reads"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in endpoint roles, or Pilot/CheckAirman identity check failed (Pilot acting on another applicant's resource; CheckAirman recording a ride not assigned to them)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, out-of-range enum, scheduled_end <= scheduled_start, negative landings, attrition rate outside [0, 0.9]" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Referenced entity id does not exist (generic; per-entity codes below take precedence where declared)" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "Applicant id not found" }
  - { id: ERR_RECORDS_REQUEST_NOT_FOUND, http: 404, condition: "RecordsRequest id not found" }
  - { id: ERR_TRAINING_CLASS_NOT_FOUND, http: 404, condition: "TrainingClass id not found" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id not found" }
  - { id: ERR_TRAINING_EVENT_NOT_FOUND, http: 404, condition: "TrainingEvent id not found" }
  - { id: ERR_CHECKRIDE_NOT_FOUND, http: 404, condition: "Checkride id not found" }
  - { id: ERR_QUALIFICATION_NOT_FOUND, http: 404, condition: "Qualification id not found" }
  - { id: ERR_MEDICAL_CERTIFICATE_NOT_FOUND, http: 404, condition: "MedicalCertificate id not found" }
  - { id: ERR_BID_PERIOD_NOT_FOUND, http: 404, condition: "BidPeriod id not found" }
  - { id: ERR_APPLICANT_INVALID_STATE, http: 409, condition: "Applicant action attempted from a disallowed status (e.g. advance-screening from CLEARED, clear from SCREENING)" }
  - { id: ERR_RECORDS_REQUEST_INVALID_STATE, http: 409, condition: "RecordsRequest action attempted from a disallowed status (e.g. send twice, verify before receive)" }
  - { id: ERR_CLASS_NOT_OPEN, http: 409, condition: "Enrollment creation attempted while TrainingClass.status != OPEN" }
  - { id: ERR_CLASS_INVALID_STATE, http: 409, condition: "Class transition attempted from a disallowed status, or complete attempted with active enrollments remaining" }
  - { id: ERR_ENROLLMENT_INVALID_STATE, http: 409, condition: "Enrollment action attempted from a disallowed status, or a related-entity enrollment-state guard failed (checkride record-outcome requires enrollment IN_PROGRESS/REMEDIATION)" }
  - { id: ERR_TRAINING_EVENT_INVALID_STATE, http: 409, condition: "TrainingEvent action attempted from a non-SCHEDULED status" }
  - { id: ERR_CHECKRIDE_INVALID_STATE, http: 409, condition: "Checkride action attempted from a non-SCHEDULED status" }
  - { id: ERR_QUALIFICATION_INVALID_STATE, http: 409, condition: "Qualification action attempted from a disallowed currency_state (e.g. requalify when not LAPSED)" }
  - { id: ERR_BID_PERIOD_INVALID_STATE, http: 409, condition: "Bid-period action or bid submission attempted from a disallowed period status (bid requires OPEN; award requires CLOSED; finalize requires AWARDED)" }
  - { id: ERR_BID_INVALID_STATE, http: 409, condition: "Bid withdrawal attempted on a non-SUBMITTED bid" }
  - { id: ERR_SLOT_NOT_AVAILABLE, http: 409, condition: "Simulator booking attempted against a slot in MAINTENANCE" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Applicant email already exists" }
  - { id: ERR_INSUFFICIENT_FLIGHT_HOURS, http: 422, condition: "advance-screening with total_flight_hours < 1500" }
  - { id: ERR_RECORDS_INCOMPLETE, http: 409, condition: "clear attempted while some RecordsRequest is not VERIFIED or no PRIA request exists" }
  - { id: ERR_NO_VALID_MEDICAL, http: 422, condition: "clear (or bid eligibility) requires a VALID FIRST-class MedicalCertificate" }
  - { id: ERR_CLASS_FULL, http: 409, condition: "Seat gate: class over_committed or active_enrollment_count >= max_seats_sellable" }
  - { id: ERR_PHASE_PREREQUISITE_NOT_MET, http: 422, condition: "Event phase does not match the enrollment's current phase discipline, or IOE milestone hours short of ioe_hours_required, or resume lacks a passing remediation milestone" }
  - { id: ERR_INSTRUCTOR_NOT_QUALIFIED, http: 422, condition: "Instructor tier does not cover the event phase, or check_airman_id is not a CHECK_AIRMAN" }
  - { id: ERR_CHECK_AIRMAN_CONFLICT, http: 422, condition: "Segregation of duties: check airman previously instructed a non-CANCELLED training event of the same enrollment" }
  - { id: ERR_CURRENCY_LAPSED, http: 422, condition: "IOE event creation while the applicant's qualification currency_state is LAPSED or EXPIRED" }
  - { id: ERR_MEDICAL_GROUNDED, http: 422, condition: "IOE event creation or checkride outcome recording while operating_state == GROUNDED" }
  - { id: ERR_SLOT_TEMPORAL_OVERLAP, http: 409, condition: "Simulator event not contained in the slot window or half-open overlap with another SCHEDULED event in the same slot" }
  - { id: ERR_INSTRUCTOR_BUFFER_VIOLATION, http: 409, condition: "New event leaves < 30 minutes gap (or overlaps) against another non-CANCELLED event of the same instructor" }
  - { id: ERR_INSTRUCTOR_DAILY_LIMIT, http: 409, condition: "New event would push the instructor's non-CANCELLED events for that UTC day to daily_max_sessions + 1" }
  - { id: ERR_DUPLICATE_BID, http: 409, condition: "Second bid by the same applicant in the same bid period" }
  - { id: ERR_DUPLICATE_QUALIFICATION, http: 409, condition: "Qualification row already exists for (applicant_id, equipment_id)" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Applicant already holds a non-terminal enrollment (TENTATIVE/CONFIRMED/IN_PROGRESS/REMEDIATION) in this class" }
  - { id: ERR_FUTURE_ACTIVITY_DATE, http: 422, condition: "Scheduled/event/activity timestamps violate the logical-clock window (scheduling in the past, or flight activity in the future)" }
  - { id: ERR_SLOT_HAS_BOOKINGS, http: 409, condition: "Slot maintenance toggle attempted while SCHEDULED events exist inside the window" }
  - { id: ERR_MAX_ATTEMPTS_EXCEEDED, http: 422, condition: "Retrain attempted with failed_attempts > 2" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_training_class_version does not match the class's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Recruiter
    description: "Owns applicant screening, PRIA records workflow, and applicant lifecycle actions"
    identity: opaque
    exclusive_operations:
      - "POST /pilot-training/applicants"
      - "POST /pilot-training/applicants/{id}/advance-screening"
      - "POST /pilot-training/applicants/{id}/clear"
      - "POST /pilot-training/applicants/{id}/reject"
      - "POST /pilot-training/applicants/{id}/appeal"
      - "POST /pilot-training/records-requests + send/receive/verify"
    shared_operations:
      - "GET reads across applicants, classes, enrollments, events, checkrides, qualifications, medicals, bids, cost-ledger, training-footprint"
      - "POST /pilot-training/applicants/{id}/withdraw (shared with Pilot and SystemAdmin)"
  - name: TrainingCoordinator
    description: "Owns equipment, classes, enrollments, training events, instructors, simulator slots"
    identity: opaque
    exclusive_operations:
      - "POST /pilot-training/equipment"
      - "POST /pilot-training/training-classes + open/start/complete/cancel + PATCH"
      - "POST /pilot-training/enrollments + confirm/start/withdraw/disqualify/retrain/resume/complete"
      - "POST /pilot-training/training-events + cancel"
      - "POST /pilot-training/instructors"
      - "POST /pilot-training/simulator-slots + maintenance"
      - "POST /pilot-training/checkrides (schedule) + cancel"
    shared_operations:
      - "POST /pilot-training/training-events/{id}/complete|fail (shared with CheckAirman)"
      - "GET reads across the surface"
  - name: CheckAirman
    description: "Entity-backed by Instructor; conducts checkrides and may complete/fail events they personally instruct; segregation-of-duties bars them from rides on enrollments they trained"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /pilot-training/checkrides/{id}/record-outcome"
      - "POST /pilot-training/qualifications/{id}/certify-requalification"
    shared_operations:
      - "POST /pilot-training/training-events/{id}/complete|fail (shared with TrainingCoordinator)"
      - "GET reads on equipment, instructors, events, checkrides"
  - name: CrewScheduler
    description: "Owns qualifications, flight activity, medical certificates, bid periods and award execution"
    identity: opaque
    exclusive_operations:
      - "POST /pilot-training/qualifications + refresh-currency + requalify"
      - "POST /pilot-training/flight-activities"
      - "POST /pilot-training/medical-certificates + suspend"
      - "POST /pilot-training/bid-periods + open/close/award/finalize"
    shared_operations:
      - "POST /pilot-training/bids + withdraw (shared with Pilot)"
      - "GET reads across the surface"
  - name: Pilot
    description: "Entity-backed by Applicant; self-service: read own record, submit/withdraw own bids, withdraw own application"
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "GET /pilot-training/applicants/{id} (own id only)"
      - "GET /pilot-training/bid-periods + bids (read)"
      - "POST /pilot-training/bids (own applicant_id only)"
      - "POST /pilot-training/bids/{id}/withdraw (own bids only)"
      - "POST /pilot-training/applicants/{id}/withdraw (own id only)"
  - name: SystemAdmin
    description: "Opaque operator; superset of all endpoints plus the ops checkpoint and logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /pilot-training/_ops/run-daily-scan"
      - "POST /pilot-training/_clock/set-current-utc"
    shared_operations:
      - "all business endpoints"
