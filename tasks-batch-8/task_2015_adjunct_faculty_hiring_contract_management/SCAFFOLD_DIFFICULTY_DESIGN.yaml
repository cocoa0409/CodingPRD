  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_approve_of_withdrawn_application
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the same request
          violates BOTH priority-4 (application already WITHDRAWN — no approve
          transition from terminal) AND priority-6 (acting reviewer DID verify a
          credential, so segregation of duties would also fail). The state error
          must win because state (4) precedes business_safety (6).
        test_recipe:
          setup:
            - "Application UNDER_REVIEW with one VERIFIED credential whose verified_by_hr_id == hr_reviewer_1"
            - "Application then WITHDRAWN by hr_reviewer_2"
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "GEOL", name: "Geology", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Geology Pool", min_education_tier: "BACHELORS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Hal Adjunct", applicant_email: "hal@x.edu", claimed_education_tier: "BACHELORS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app_id: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app_id}/start-review", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRANSCRIPT", evidence_ref: "ev-t-hal", verified_education_tier: "BACHELORS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_t: $.data.id }
            - { call: "POST /adjunct-hr/credentials/${cred_t}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/applications/${app_id}/withdraw", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_2" }
          trigger:
            - call: "POST /adjunct-hr/applications/${app_id}/approve"
              payload: {}
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 6 business_safety)"
            - "NOT ERR_SEGREGATION_OF_DUTIES even though hr_reviewer_1 verified the credential"
            - "AdjunctApplication.${app_id}.application_status == WITHDRAWN (unchanged)"

      - name: referential_beats_fiscal_on_contract_issuance
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - errors[ERR_CONTRACT_REFERENCE_INVALID]
          - errors[ERR_LOAD_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_fiscal (a
          different pair from instance 1): the same contract issuance BOTH
          references a DRAFT (unpublished) rate schedule (priority 14) AND
          would exceed the load cap (priority 15). The referential error must
          win because 14 precedes 15.
        test_recipe:
          setup:
            - "Faculty COMPLIANT with an existing ISSUED contract of load 4.50 in 2026FA (cap 4.50, overage allowance 1.00)"
            - "New section of 3.0 contact hours (prospective total 7.50 > 5.50 -> would trip ERR_LOAD_CAP_EXCEEDED)"
            - "The rate schedule referenced is still DRAFT (never published) -> also trips ERR_CONTRACT_REFERENCE_INVALID"
