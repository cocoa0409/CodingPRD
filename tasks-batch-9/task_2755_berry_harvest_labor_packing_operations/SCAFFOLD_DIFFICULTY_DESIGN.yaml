              payload: { crew_id: "${crew}", full_name: "Picker CI One", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk1: $.data.id }
            - call: "POST /berry-ops/pickers"
