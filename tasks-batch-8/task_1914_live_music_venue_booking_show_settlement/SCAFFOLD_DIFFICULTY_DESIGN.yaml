  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: date_hold_same_room_date_exclusion
        grounds:
          - state_machines.DateHold.ACTIVE_to_CONFIRMED
          - calculations.hold_priority_rank
        distinguishing_aspect: |
          Interval semantics: whole-day exclusion on the (room, show_date) resource.
          Two holds on the SAME (room, show_date) conflict regardless of door/curfew
          times — the entire calendar day is the atomic interval. Resource: (room,
          show_date) pair. Lower-priority hold cannot confirm while a higher-priority
          ACTIVE hold exists on the same pair.
        test_recipe:
          setup:
            - "Two Shows on (MAIN_ROOM, 2026-12-01): S_p1 with P1 hold, S_p2 with P2 hold"
            - "P2 agent attempts to confirm its hold while P1 still ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "OL", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { ol_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA1", agency_name: "A" }
              as: VenueManager
              captures: { ol_a1: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA2", agency_name: "B" }
              as: VenueManager
              captures: { ol_a2: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${ol_a}", room: "MAIN_ROOM", show_date: "2026-12-01", doors_at_utc: "2026-12-01T19:00:00Z", curfew_at_utc: "2026-12-01T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${ol_a1}"
              captures: { ol_s1: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${ol_a}", room: "MAIN_ROOM", show_date: "2026-12-01", doors_at_utc: "2026-12-01T19:00:00Z", curfew_at_utc: "2026-12-01T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${ol_a2}"
              captures: { ol_s2: $.data.id }
            - call: "POST /shows/${ol_s1}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${ol_a1}" }
              as: BookingAgent
              as_user_id: "${ol_a1}"
              captures: { ol_h1: $.data.id }
            - call: "POST /shows/${ol_s2}/date-holds"
              payload: { priority: "P2", booked_by_agent_id: "${ol_a2}" }
              as: BookingAgent
              as_user_id: "${ol_a2}"
              captures: { ol_h2: $.data.id }
            - call: "GET /shows/${ol_s2}"
              payload: {}
              as: VenueManager
              captures: { ol_v2: $.data.version }
          trigger:
            - call: "POST /shows/${ol_s2}/date-holds/${ol_h2}/confirm"
              payload: { expected_show_version: "${ol_v2}" }
              as: BookingAgent
              as_user_id: "${ol_a2}"
              captures: { ol_err: $.data.error_id }
          assert:
            - "P2 confirm returns ERR_INVALID_STATE (higher-priority ACTIVE P1 exists on same room+date)"
            - "DateHold.${ol_h2}.status remains ACTIVE"
            - "Show.${ol_s2}.status remains HOLD_PENDING"

      - name: show_schedule_doors_curfew_overlap_validation
        grounds:
          - validations[priority=11]
          - entities.Show.fields.doors_at_utc
          - entities.Show.fields.curfew_at_utc
        distinguishing_aspect: |
          Interval semantics: half-open time interval WITHIN a single show —
          doors_at_utc < curfew_at_utc required, and doors_at_utc must lie on
          show_date. Adjacency (doors == curfew) is REJECTED as degenerate
          zero-length interval. Resource: the Show's own intraday interval —
          distinct from instance 1's whole-day (room, date) exclusion semantics.
        test_recipe:
          setup:
            - "Artist and agent exist"
            - "Attempt to create a Show with curfew_at_utc == doors_at_utc (zero-length)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "ZS", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { zs_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { zs_agent: $.data.id }
          trigger:
            - call: "POST /shows"
              payload: { artist_id: "${zs_a}", room: "MAIN_ROOM", show_date: "2026-12-05", doors_at_utc: "2026-12-05T20:00:00Z", curfew_at_utc: "2026-12-05T20:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-09-01T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${zs_agent}"
              captures: { zs_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_SHOW_SCHEDULE (curfew must be strictly after doors)"
            - "No Show created"

  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ticket_sale_refund_conserves_gross_revenue
        grounds:
          - state_machines.Show
          - calculations.ticket_scaling_tier_advance
          - entities.Show.fields.gross_ticket_revenue_cents
        distinguishing_aspect: |
          Conserved quantity: Show gross-pair reconciliation.
          INVARIANT: Show.gross_ticket_revenue_cents + (sum of refunded TicketSale
          gross) == sum of all TicketSale gross_amount_cents ever created.
          Forward action: ticket-sale creates +N gross. Compensating action: refund
          sets refund_status=REFUNDED — the refunded amount leaves
          Show.gross_ticket_revenue_cents but is preserved as the sale's own
          gross_amount_cents, so the sum of created sales equals current revenue
          plus refunded revenue exactly.
        test_recipe:
          setup:
            - "Show ON_SALE with tier face=2000, sell 10 tickets (gross=20000), then refund sale of 4 (gross 8000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "IV", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.0 }
              as: VenueManager
              captures: { iv_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { iv_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${iv_a}", room: "MAIN_ROOM", show_date: "2026-12-10", doors_at_utc: "2026-12-10T19:00:00Z", curfew_at_utc: "2026-12-10T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-10T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${iv_agent}"
              captures: { iv_s: $.data.id }
            - call: "POST /shows/${iv_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${iv_agent}" }
              as: BookingAgent
              as_user_id: "${iv_agent}"
              captures: { iv_h: $.data.id }
            - call: "GET /shows/${iv_s}"
              payload: {}
              as: VenueManager
              captures: { iv_v0: $.data.version }
            - call: "POST /shows/${iv_s}/date-holds/${iv_h}/confirm"
              payload: { expected_show_version: "${iv_v0}" }
              as: BookingAgent
              as_user_id: "${iv_agent}"
            - call: "POST /shows/${iv_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 10000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 0, support_budget_cents: 0, bar_split_pct: 0, merch_split_pct: 0 }
              as: BookingAgent
              as_user_id: "${iv_agent}"
              captures: { iv_o: $.data.id }
            - call: "GET /shows/${iv_s}"
              payload: {}
              as: VenueManager
              captures: { iv_v1: $.data.version }
            - call: "POST /shows/${iv_s}/offers/${iv_o}/accept"
              payload: { expected_show_version: "${iv_v1}" }
              as: VenueManager
            - call: "POST /shows/${iv_s}/ticket-tiers"
              payload: { tier_name: "GA", face_price_cents: 2000, capacity: 500, tier_order: 1 }
              as: Promoter
              captures: { iv_t: $.data.id }
            - call: "GET /shows/${iv_s}"
              payload: {}
              as: Promoter
              captures: { iv_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:01Z" }
              as: VenueManager
            - call: "POST /shows/${iv_s}/on-sale"
              payload: { expected_show_version: "${iv_v2}" }
              as: Promoter
            - call: "POST /shows/${iv_s}/ticket-sales"
              payload: { tier_id: "${iv_t}", quantity: 10 }
              as: Promoter
              captures: { iv_sale1: $.data.id }
            - call: "POST /shows/${iv_s}/ticket-sales"
              payload: { tier_id: "${iv_t}", quantity: 4 }
              as: Promoter
              captures: { iv_sale2: $.data.id }
          trigger:
            - call: "POST /shows/${iv_s}/ticket-sales/${iv_sale2}/refund"
              payload: {}
              as: Promoter
            - call: "GET /shows/${iv_s}"
              payload: {}
              as: Promoter
              captures: { iv_gross: $.data.gross_ticket_revenue_cents, iv_sold: $.data.tickets_sold }
          assert:
            - "Before refund: Show.gross_ticket_revenue_cents == 28000  # (10+4) × 2000"
            - "After refund of sale2: Show.gross_ticket_revenue_cents == 20000  # 10 × 2000"
            - "Show.tickets_sold == 10"
            - "TicketSale.${iv_sale2}.refund_status == REFUNDED"
            - "INVARIANT: Show.gross_ticket_revenue_cents (20000) + refunded sale gross (8000) == sum of created sales (28000)"

      - name: wire_deposit_return_conserves_artist_cash_position
        grounds:
          - state_machines.WireTransfer.INITIATED_to_COMPLETED
          - state_machines.WireTransfer.COMPLETED_to_RETURNED
          - entities.Show.fields.deposit_paid_cents
        distinguishing_aspect: |
          Conserved quantity: Show.deposit_paid_cents as net artist-cash position.
          INVARIANT: For any Show, deposit_paid_cents ==
          sum(COMPLETED ARTIST_DEPOSIT wires) − sum(RETURNED ARTIST_DEPOSIT wires).
          Forward: ARTIST_DEPOSIT wire COMPLETED adds amount. Compensating:
          mark-returned on a cancelled force-majeure show subtracts the same amount.
          Distinct conserved quantity from instance 1 (cash deposit vs ticket revenue).
        test_recipe:
          setup:
            - "Show CONFIRMED with deposit 25000 paid (wire COMPLETED)"
            - "Cancel with reason=FORCE_MAJEURE; then mark deposit wire RETURNED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueManager
            - call: "POST /artists"
              payload: { legal_name: "WC", agency: "A", guarantee_floor_cents: 10000, deposit_pct: 0.25 }
              as: VenueManager
              captures: { wc_a: $.data.id }
            - call: "POST /booking-agents"
              payload: { display_name: "BA", agency_name: "A" }
              as: VenueManager
              captures: { wc_agent: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${wc_a}", room: "MAIN_ROOM", show_date: "2026-12-15", doors_at_utc: "2026-12-15T19:00:00Z", curfew_at_utc: "2026-12-15T23:00:00Z", total_capacity: 500, on_sale_at_utc: "2026-08-10T10:00:00Z" }
              as: BookingAgent
              as_user_id: "${wc_agent}"
              captures: { wc_s: $.data.id }
            - call: "POST /shows/${wc_s}/date-holds"
              payload: { priority: "P1", booked_by_agent_id: "${wc_agent}" }
              as: BookingAgent
              as_user_id: "${wc_agent}"
              captures: { wc_h: $.data.id }
            - call: "GET /shows/${wc_s}"
              payload: {}
              as: VenueManager
              captures: { wc_v0: $.data.version }
            - call: "POST /shows/${wc_s}/date-holds/${wc_h}/confirm"
              payload: { expected_show_version: "${wc_v0}" }
              as: BookingAgent
              as_user_id: "${wc_agent}"
            - call: "POST /shows/${wc_s}/offers"
              payload: { deal_kind: "FLAT_GUARANTEE", guarantee_cents: 100000, artist_split_pct: 0, versus_threshold_cents: 0, expense_budget_cents: 10000, support_budget_cents: 0, bar_split_pct: 0, merch_split_pct: 0 }
              as: BookingAgent
              as_user_id: "${wc_agent}"
              captures: { wc_o: $.data.id }
            - call: "GET /shows/${wc_s}"
              payload: {}
              as: VenueManager
              captures: { wc_v1: $.data.version }
            - call: "POST /shows/${wc_s}/offers/${wc_o}/accept"
              payload: { expected_show_version: "${wc_v1}" }
              as: VenueManager
            - call: "POST /shows/${wc_s}/wire-transfers"
              payload: { purpose: "ARTIST_DEPOSIT", amount_cents: 25000, recipient_artist_id: "${wc_a}", support_act_id: "", settlement_id: "" }
              as: Accountant
              captures: { wc_dep: $.data.id }
            - call: "POST /shows/${wc_s}/wire-transfers/${wc_dep}/complete"
              payload: {}
              as: Accountant
          trigger:
            - call: "POST /shows/${wc_s}/cancel"
              payload: { reason: "FORCE_MAJEURE" }
              as: VenueManager
            - call: "POST /shows/${wc_s}/wire-transfers/${wc_dep}/mark-returned"
              payload: {}
              as: Accountant
            - call: "GET /shows/${wc_s}"
              payload: {}
              as: Accountant
              captures: { wc_deposit_after: $.data.deposit_paid_cents }
          assert:
            - "After deposit complete: Show.deposit_paid_cents == 25000"
            - "After cancel + mark-returned: Show.deposit_paid_cents == 0"
            - "INVARIANT: deposit_paid_cents == sum(COMPLETED deposits) − sum(RETURNED deposits) == 25000 − 25000 == 0"
            - "WireTransfer.${wc_dep}.status == RETURNED"
