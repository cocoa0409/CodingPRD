            - { call: "POST /apparatus/${ap_id}/maintenance-windows", payload: { start_at: "2026-04-05T00:00:00Z", end_at: "2026-04-10T00:00:00Z" }, as: Chief, captures: { w3: "$.data.id" } }
          assert:
            - "Overlapping window: HTTP 409, data.error_id == ERR_MAINTENANCE_OVERLAP"
            - "Adjacent window: HTTP 201, MaintenanceWindow.${w3}.status == SCHEDULED"

  - rule_id: compensating_invariant
    instances:
      - name: points_conserved_on_turnout_void
        grounds:
          - calculations.member_points_ytd
          - state_machines.TurnoutResponse.RELEASED_to_VOIDED
          - entities.Member.fields.points_ytd
        distinguishing_aspect: "Conserved quantity = member points ledger: after awarding 9 turnout points then voiding, Member.points_ytd returns to 0 with zero drift (points_ytd == sum of RELEASED non-void turnout + VERIFIED duty + non-reversed adjustments)."
        test_recipe:
          setup:
            - "EMT member M with one RELEASED STRUCTURE_FIRE turnout worth 9 pts (onscene 2.5h); no other point sources."
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Inv", email: "offinv@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M Inv", email: "minv@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { m_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "S12" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-12", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T01:00:00Z" }, as: Chief }
            - { call: "POST /incidents", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", incident_type: "STRUCTURE_FIRE", alarm_at: "2026-03-02T00:50:00Z" }, as: Officer, as_user_id: "${off_id}", captures: { inc_id: "$.data.id" } }
            - { call: "POST /incidents/${inc_id}/enroute", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/arrive", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/turnouts", payload: { member_id: "${m_id}" }, as: Officer, as_user_id: "${off_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T03:30:00Z" }, as: Chief }
            - { call: "POST /incidents/${inc_id}/clear", payload: {}, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "GET /members/${m_id}", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { before: "$.data.points_ytd" } }
            - { call: "POST /turnouts/${t_id}/void", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "GET /members/${m_id}", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { after: "$.data.points_ytd" } }
          assert:
            - "Before void: Member.${m_id}.points_ytd == 9"
            - "After void: Member.${m_id}.points_ytd == 0 AND TurnoutResponse.${t_id}.status == VOIDED AND TurnoutResponse.${t_id}.turnout_points == 0"

      - name: campaign_funds_conserved_on_refund
        grounds:
          - calculations.campaign_raised
          - state_machines.Donation.POSTED_to_REFUNDED
          - entities.FundraisingCampaign.fields.raised_cents
        distinguishing_aspect: "Conserved quantity = campaign money (distinct from points): after posting 5000 + 3000 then refunding the 3000, raised_cents returns to 5000 (raised_cents == sum of POSTED donations), zero drift."
        test_recipe:
          setup:
            - "ACTIVE campaign with two POSTED donations 5000 and 3000 (raised 8000)."
          setup_api_calls:
            - { call: "POST /campaigns", payload: { name: "Boot Drive", goal_cents: 100000 }, as: Chief, captures: { cmp_id: "$.data.id" } }
            - { call: "POST /campaigns/${cmp_id}/open", payload: {}, as: Chief }
            - { call: "POST /campaigns/${cmp_id}/donations", payload: { donor_name: "A", amount_cents: 5000 }, as: Chief, captures: { d1: "$.data.id" } }
            - { call: "POST /campaigns/${cmp_id}/donations", payload: { donor_name: "B", amount_cents: 3000 }, as: Chief, captures: { d2: "$.data.id" } }
          trigger:
            - { call: "GET /campaigns/${cmp_id}", payload: {}, as: Chief, captures: { before: "$.data.raised_cents" } }
            - { call: "POST /donations/${d2}/refund", payload: {}, as: Chief }
            - { call: "GET /campaigns/${cmp_id}", payload: {}, as: Chief, captures: { after: "$.data.raised_cents" } }
          assert:
            - "Before refund: FundraisingCampaign.${cmp_id}.raised_cents == 8000"
            - "After refund: FundraisingCampaign.${cmp_id}.raised_cents == 5000 AND Donation.${d2}.status == REFUNDED"
