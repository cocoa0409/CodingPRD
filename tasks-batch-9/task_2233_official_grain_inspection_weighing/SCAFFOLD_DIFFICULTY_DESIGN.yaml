            - "201; the 20500-bushel certificate has fee_total_cents == 47500 (thousands 21, pre exactly 50000, 500bp tier, discount floor(2500) = 2500)"
            - "The larger lot is cheaper: 47500 < 48000 — the tier boundary is inclusive and evaluated on the pre-discount subtotal"
            - "Neither certificate is floored: minimum_fee_cents 10000 is below both totals"
            - "GET /grain-inspection/applicants/${app} -> open_balance_cents == 95500"
        expected_failure_mode_if_naive: "Choosing the tier from the post-discount or post-adjustment total, or treating the boundary as exclusive, returns 50000 for the 20500-bushel lot."

      - name: grade_matrix_mode_c_five_factor_predicate_walk
        mechanism: |
          §1.3 grade_determination is a 5-factor x 5-grade predicate matrix in which the assigned
          grade depends on the whole factor vector and limiting_factor depends on the canonical factor
          order applied to the NEXT-BETTER grade. The vector (55.2, 14.04, 4.0, 0.15, 2.5) fails
          US_NO_1 on three factors at once (test weight 55.2 < 56.0, damaged 4.0 > 3.0, heat 0.15
          rounds to 0.2 > 0.1) and satisfies US_NO_2 on all five, so the grade is US_NO_2 and the
          limiting factor must be TEST_WEIGHT — the FIRST failure in canonical order, not the largest
          margin and not the last one evaluated. A soybean lot with the same shape resolves against a
          different table with no US_NO_5 row at all.
        distinguishing_aspect: "Mode (c): the combination is an ordered predicate matrix whose output is a pair (grade, limiting factor); no arithmetic is combined, unlike the two fee siblings."
        entities_involved: [InspectionRequest, Sample, GradingResult]
        grounds:
          - "calculations.grade_determination"
          - "entities.GradingResult.fields.rounded_factors"
          - "entities.GradingResult.fields.limiting_factor"
          - "entities.GradingResult.fields.assigned_grade"
          - "errors[ERR_FACTOR_SET_INCONSISTENT]"
        test_recipe:
          setup:
            - "A service area with an APPROVED SAMPLING_DEVICE and an inspector holding SAMPLING and GRADING."
            - "One CORN request and one SOYBEANS request, each with a SEALED sample of at least 2 portions."
            - "No grading result exists on either request, so each determination is the first and becomes FINAL."
