  # ---------------------------------------------------------------------------
  # Rule 9 — compensating-action invariants over different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: unit_status_bucket_conservation
        grounds:
          - entities.Property.fields.units_available_count
          - entities.Property.fields.units_reserved_count
          - entities.Property.fields.units_leased_count
          - state_machines.Unit
        distinguishing_aspect: |
          Conserved quantity = per-status unit census: units_available + units_reserved +
          units_leased + units_out_of_service == units_total == 2 at every step of the
          generate -> decline -> regenerate -> accept cycle; each action and its compensation
          move exactly one unit between buckets without drift.
        test_recipe:
          setup:
            - "Property with TWO AVAILABLE ONE_BR AMI_50 units (101 then 102); one CERTIFIED entry (hh=2, income 3000000 <= 4000000); lottery PUBLISHED"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: $.data.id }
            - call: "POST /occupancy-standards"
              payload: { property_id: "${p}", bedroom_count: "ONE_BR", min_occupants: 1, max_occupants: 3 }
              as: HousingDeveloper
            - call: "POST /ami-limits"
              payload: { property_id: "${p}", household_size: 2, ami_tier: "AMI_50", annual_limit_cents: 4000000 }
              as: HousingDeveloper
            - call: "POST /units"
              payload: { property_id: "${p}", unit_number: "101", bedroom_count: "ONE_BR", ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { u1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${p}", unit_number: "102", bedroom_count: "ONE_BR", ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { u2: $.data.id }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "HOUSING_AUTHORITY_WEBSITE"], marketing_plan_summary: "press and web outreach", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: $.data.id }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Pat P", email: "p@x.com" }
              as: Anonymous
              captures: { ap: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${ap}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /applications/${app}/review"
              payload: { action: "COMPLETE_VERIFICATION" }
              as: ApplicationClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "CLOSE" }
              as: HousingDeveloper
            - call: "GET /campaigns/${c}"
              as: HousingDeveloper
              captures: { cv: $.data.version }
            - call: "POST /lottery-runs"
              payload: { campaign_id: "${c}", seed: "SEED-UNIT", expected_campaign_version: "${cv}" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
              captures: { run: $.data.id }
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "SEAL" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "EXECUTE" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "PUBLISH" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "POST /income-certifications"
              payload: { application_id: "${app}" }
              as: ComplianceOfficer
              captures: { cert: $.data.id }
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "REQUEST_DOCS", required_docs: ["SALARY"] }
              as: ComplianceOfficer
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "SUBMIT_DOCS", income_sources: [{ source_type: "SALARY", amount_per_period_cents: 250000, periods_per_year: 12 }] }
              as: Applicant
              as_user_id: "${ap}"
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "CERTIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /properties/${p}"
              as: HousingDeveloper
              captures: { t0_avail: $.data.units_available_count, t0_res: $.data.units_reserved_count, t0_leased: $.data.units_leased_count, t0_oos: $.data.units_out_of_service_count, t0_total: $.data.units_total }
            - call: "POST /offers/generate"
              payload: { campaign_id: "${c}" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "GET /properties/${p}"
              as: HousingDeveloper
              captures: { t1_avail: $.data.units_available_count, t1_res: $.data.units_reserved_count }
            - call: "GET /offers?campaign_id=${c}&status=PENDING"
              as: LotteryAdministrator
              captures: { offer1: "$.data[0].id", offer1_unit: "$.data[0].unit_id" }
            - call: "POST /offers/${offer1}/respond"
              payload: { action: "DECLINE" }
              as: Applicant
              as_user_id: "${ap}"
            - call: "GET /properties/${p}"
              as: HousingDeveloper
              captures: { t2_avail: $.data.units_available_count, t2_res: $.data.units_reserved_count }
            - call: "POST /offers/generate"
              payload: { campaign_id: "${c}" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "GET /offers?campaign_id=${c}&status=PENDING"
              as: LotteryAdministrator
              captures: { offer2: "$.data[0].id", offer2_unit: "$.data[0].unit_id" }
            - call: "POST /offers/${offer2}/respond"
              payload: { action: "ACCEPT" }
              as: Applicant
              as_user_id: "${ap}"
            - call: "GET /properties/${p}"
              as: HousingDeveloper
              captures: { t3_avail: $.data.units_available_count, t3_res: $.data.units_reserved_count, t3_leased: $.data.units_leased_count }
          assert:
            - "t0: (available, reserved, leased, out_of_service) == (2, 0, 0, 0)"
            - "after generate 1: (1, 1, 0, 0) — offer landed on unit ${u1} (oldest first)"
            - "after decline: (2, 0, 0, 0) — the compensating release exactly restores the pre-offer bucket counts"
            - "after regenerate: (1, 1, 0, 0) and the new offer is on unit ${u2} (prior-decline exclusion)"
            - "after accept: (1, 0, 1, 0)"
            - "at every checkpoint available + reserved + leased + out_of_service == units_total == 2 (no drift across the action/compensation pairs)"

      - name: waitlist_entry_census_conservation
        grounds:
          - entities.LotteryRun.fields.entries_generated
          - entities.ApplicationCampaign.fields.waitlist_active_count
          - state_machines.WaitlistEntry
