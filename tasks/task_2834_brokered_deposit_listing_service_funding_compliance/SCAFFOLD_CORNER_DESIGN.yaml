            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Benchmarked 30 Day CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 30, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
