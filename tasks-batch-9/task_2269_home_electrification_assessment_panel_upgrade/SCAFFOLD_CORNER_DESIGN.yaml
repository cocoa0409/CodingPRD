      - name: stacking_limit_produces_the_expected_allowed_amounts
        claim_type: correct_result
        grounds:
          - calculations.benefit_stacking_limit
        excluded_because:
          difficulty_instance: combinatorial_formula / stacking_single_pass_order_recomputes_federal_credit_exactly_once
          rationale: "That §1.8 instance drives benefit_stacking_limit end to end with literal expected values for every written field (allowed_state_incentive_cents, allowed_federal_credit_cents, combined_benefit_limit_cents, residual_overage_cents), which is exactly the known-inputs -> expected-output claim of this row."

      - name: running_budget_total_correct_after_add_and_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.program_budget_conservation
          - calculations.household_cap_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / program_appropriation_conserved_across_reserve_pay_and_clawback
          rationale: "That §1.8 instance checks the running program totals after an add (reserve), after a commit (pay) and after a reversal (clawback), at three checkpoints with literal values, which subsumes the aggregation add/reverse claim."

      - name: group_cap_first_lines_floor_and_last_line_takes_the_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.measure_incentive_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / group_cap_proration_floors_all_but_last_line_and_assigns_residual
          rationale: "That §1.8 instance pins the floor-all-but-last proration and the residual assignment to the last member in (pinned_sort_order, created_at) order, including the exact per-line cents, which is the remainder-allocation claim of this row."

      - name: inspector_windows_treat_adjacent_and_overlapping_intervals_correctly
        claim_type: interval_merge
        grounds:
          - calculations.inspector_window_conflict
          - calculations.install_window_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / inspector_half_open_window_with_forty_five_minute_travel_buffer
          rationale: "That §1.8 instance tests an exactly-adjacent window, a window inside the 45-minute travel buffer and a disjoint window beyond it, on half-open minute timestamps; its sibling instance covers the closed-interval calendar-date variant for crew capacity."

      - name: weights_do_not_drift_and_rescore_on_new_results
        claim_type: weighted_scoring
        grounds:
          - calculations.contractor_quality_score
        excluded_because:
          difficulty_instance: dual_variant_calc / rolling_window_vs_severity_weighted_contractor_quality
          rationale: "That §1.8 instance computes the 1 + deficiency_count weighted score over three results and pins both the weighted total and the equally-weighted rolling total, which covers weight application and re-scoring."

      - name: provisional_and_final_variants_diverge_on_identical_measure_sets
        claim_type: variant_divergence
        grounds:
          - calculations.measure_incentive_allocation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_project_incentive_divergence
          rationale: "That §1.8 instance asserts both variants on the same three-measure project (1375000 vs 1230000) plus the per-line deltas and the 145000 total delta."

      - name: provisional_variant_reapplied_on_resubmission_from_incomplete
        claim_type: variant_selection
        grounds:
          - calculations.measure_incentive_allocation.variants
        excluded_because:
          difficulty_instance: non_linear_state_machine / rebate_project_incomplete_resubmission_loop_repins_measure_set
          rationale: "That §1.8 instance shows the provisional variant being re-selected on the INCOMPLETE -> DRAFT -> SUBMITTED loop (and re-pinned against the current catalog), which is the context-selection claim; the final variant's selection at POST_INSTALL PASS is asserted by the reconciliation instances above."

