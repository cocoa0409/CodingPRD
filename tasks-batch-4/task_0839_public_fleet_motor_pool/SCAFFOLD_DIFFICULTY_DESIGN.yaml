scaffold_difficulty_design:
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: chargeback_provisional_vs_final_diverge
        grounds:
          - calculations.chargeback_total
          - entities.ChargebackInvoice.fields.basis
          - entities.ChargebackInvoice.fields.total_cents
          - state_machines.ChargebackInvoice.DRAFT_to_ISSUED
        distinguishing_aspect: "On identical usage data a PROVISIONAL invoice scales the usage lines by period_days/elapsed_days (30/15=2) while FINAL does not, so total_cents differs (25000 vs 50000) on the ChargebackInvoice/Department domain."
        test_recipe:
          setup:
            - "SEDAN policy; one department (huge budget); one POOL SEDAN vehicle; one RETURNED reservation for the dept with miles_driven=500 whose requested_start is in June 2026; period 2026-06-01..2026-07-01."
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "Parks", cost_center_code: "CC-100", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-POOL-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { department_id: "${dep_id}", requested_start: "2026-06-10T09:00:00Z", requested_end: "2026-06-10T13:00:00Z", driver_name: "D", purpose: "field" }
              as: MotorPoolClerk
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: MotorPoolClerk
            - call: "POST /reservations/${res_id}/checkout"
              payload: { checkout_odometer: 0 }
              as: MotorPoolClerk
            - call: "POST /reservations/${res_id}/return"
              payload: { return_odometer: 500 }
              as: MotorPoolClerk
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: FleetAdmin
            - call: "GET /departments/${dep_id}"
              payload: {}
              as: FinanceOfficer
              captures: { dep_v1: $.data.version }
            - call: "POST /departments/${dep_id}/chargeback-invoices"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "FINAL", expected_department_version: "${dep_v1}" }
              as: FinanceOfficer
              captures: { inv_final: $.data.id, final_total: $.data.total_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: FleetAdmin
            - call: "GET /departments/${dep_id}"
              payload: {}
              as: FinanceOfficer
              captures: { dep_v2: $.data.version }
            - call: "POST /departments/${dep_id}/chargeback-invoices"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "PROVISIONAL", expected_department_version: "${dep_v2}" }
              as: FinanceOfficer
              captures: { inv_prov: $.data.id, prov_total: $.data.total_cents }
          assert:
            - "ChargebackInvoice.${inv_final}.mileage_charge_cents == 25000"
            - "ChargebackInvoice.${inv_final}.total_cents == 25000"
            - "ChargebackInvoice.${inv_prov}.mileage_charge_cents == 50000"
            - "ChargebackInvoice.${inv_prov}.total_cents == 50000"
      - name: subrogation_gross_vs_net_diverge
        grounds:
          - calculations.subrogation_recovery
          - entities.AccidentClaim.fields.gross_recoverable_cents
          - entities.AccidentClaim.fields.net_recoverable_cents
        distinguishing_aspect: "On the AccidentClaim domain (different entity than chargeback), GROSS = damage*liable_pct = 500000 while NET subtracts deductible 50000 and SUBRO_ADMIN_FEE_CENTS 15000 = 435000, so the two variants diverge."
        test_recipe:
          setup:
            - "One vehicle; one accident claim at_fault=false, damage=1000000, liable_pct=0.5, deductible=50000, moved to SUBROGATION_PENDING."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "VIN-AC-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /accident-claims"
              payload: { vehicle_id: "${veh_id}", reported_at: "2026-03-05T00:00:00Z", at_fault: false, estimated_damage_cents: 1000000, deductible_cents: 50000, third_party_liable_pct: 0.5 }
              as: FinanceOfficer
              captures: { ac_id: $.data.id }
            - call: "POST /accident-claims/${ac_id}/investigate"
              payload: {}
              as: FinanceOfficer
            - call: "POST /accident-claims/${ac_id}/subrogate"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "GET /accident-claims/${ac_id}"
              payload: {}
              as: FinanceOfficer
              captures: { g: $.data.gross_recoverable_cents, n: $.data.net_recoverable_cents }
          assert:
            - "AccidentClaim.${ac_id}.gross_recoverable_cents == 500000"
            - "AccidentClaim.${ac_id}.net_recoverable_cents == 435000"
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mileage_tiering_straddle_mode_a
        grounds:
          - calculations.chargeback_total
          - entities.VehicleClassPolicy.fields.mileage_tier_boundary_miles
          - entities.ChargebackInvoice.fields.mileage_charge_cents
        distinguishing_aspect: "Mode (a): the mileage line is a non-linear >=3-input marginal-tier formula min(miles,boundary)*rate1 + max(0,miles-boundary)*rate2; miles_driven=1500 straddles the 1000 boundary giving 1000*50 + 500*80 = 90000."
        test_recipe:
          setup:
            - "SEDAN policy (boundary 1000, rate1 50, rate2 80); dept; POOL SEDAN vehicle; one RETURNED reservation miles_driven=1500 in June; period June."
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "Roads", cost_center_code: "CC-200", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-POOL-2", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { department_id: "${dep_id}", requested_start: "2026-06-12T08:00:00Z", requested_end: "2026-06-12T12:00:00Z", driver_name: "D", purpose: "haul" }
              as: MotorPoolClerk
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: MotorPoolClerk
            - call: "POST /reservations/${res_id}/checkout"
              payload: { checkout_odometer: 0 }
              as: MotorPoolClerk
            - call: "POST /reservations/${res_id}/return"
              payload: { return_odometer: 1500 }
              as: MotorPoolClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: FleetAdmin
            - call: "GET /departments/${dep_id}"
              payload: {}
              as: FinanceOfficer
              captures: { dep_v: $.data.version }
          trigger:
            - call: "POST /departments/${dep_id}/chargeback-invoices"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", basis: "FINAL", expected_department_version: "${dep_v}" }
              as: FinanceOfficer
              captures: { inv_id: $.data.id }
          assert:
            - "ChargebackInvoice.${inv_id}.mileage_charge_cents == 90000"
      - name: cost_per_mile_single_rounding_mode_b
        grounds:
          - calculations.vehicle_cost_per_mile
          - entities.Vehicle.fields.cost_per_mile_cents
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Mode (b): rounding order is pinned to sum-components-then-divide-then-round-once. maintenance 100 + fuel 100 over 3 miles = round(200/3)=67, whereas rounding each component per-mile first (33+33=66) diverges by 1 cent."
        test_recipe:
          setup:
            - "One vehicle; a fuel log fuel_cost_cents=100 odometer=3; a completed work order total_cost_cents=100."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "VIN-CPM-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /shop-bays"
              payload: { name: "Bay-CPM", bay_type: "GENERAL" }
              as: FleetAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /vehicles/${veh_id}/fuel-logs"
              payload: { reading_at: "2026-03-02T00:00:00Z", gallons: 5, fuel_cost_cents: 100, odometer_miles: 3 }
              as: ShopTech
            - call: "POST /work-orders"
              payload: { vehicle_id: "${veh_id}", bay_id: "${bay_id}", wo_type: "REPAIR", scheduled_start: "2026-03-03T09:00:00Z", scheduled_end: "2026-03-03T11:00:00Z", labor_rate_cents: 100 }
              as: ShopTech
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ShopTech
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { labor_hours: 1, parts_cost_cents: 0 }
              as: ShopTech
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: FleetAdmin
              captures: { cpm: $.data.cost_per_mile_cents }
          assert:
            - "Vehicle.${veh_id}.lifetime_maintenance_cents == 100"
            - "Vehicle.${veh_id}.lifetime_fuel_cents == 100"
            - "Vehicle.${veh_id}.odometer_miles == 3"
            - "Vehicle.${veh_id}.cost_per_mile_cents == 67"
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: vehicle_parallel_operational_and_lifecycle_axes
        grounds:
          - state_machines.Vehicle.IN_SERVICE_to_IN_SHOP
          - state_machines.Vehicle.IN_SHOP_to_IN_SERVICE
          - entities.Vehicle.fields.operational_status
          - entities.Vehicle.fields.lifecycle_status
        distinguishing_aspect: "Vehicle carries two independent axes: operational_status cycles IN_SERVICE->IN_SHOP->IN_SERVICE via work orders while lifecycle_status stays ACTIVE, then lifecycle moves ACTIVE->FLAGGED_FOR_REPLACEMENT via evaluation while operational_status stays IN_SERVICE — neither axis gates the other."
        test_recipe:
          setup:
            - "One vehicle (in_service 2010 so age_sub saturates); one bay; clock 2026-06-01."
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /vehicles"
              payload: { vin: "VIN-PAR-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /shop-bays"
              payload: { name: "Bay-PAR", bay_type: "GENERAL" }
              as: FleetAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /work-orders"
              payload: { vehicle_id: "${veh_id}", bay_id: "${bay_id}", wo_type: "PM", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z", labor_rate_cents: 100 }
              as: ShopTech
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ShopTech
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: FleetAdmin
              captures: { op1: $.data.operational_status, lc1: $.data.lifecycle_status }
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { labor_hours: 0, parts_cost_cents: 0 }
              as: ShopTech
            - call: "POST /vehicles/${veh_id}/fuel-logs"
              payload: { reading_at: "2026-06-03T00:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 150000 }
              as: ShopTech
            - call: "POST /vehicles/${veh_id}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: FleetAdmin
              captures: { op2: $.data.operational_status, lc2: $.data.lifecycle_status }
          assert:
            - "op1 == IN_SHOP"
            - "lc1 == ACTIVE"
            - "op2 == IN_SERVICE"
            - "lc2 == FLAGGED_FOR_REPLACEMENT"
      - name: accident_subrogation_dispute_cycle
        grounds:
          - state_machines.AccidentClaim.SUBROGATION_PENDING_to_UNDER_INVESTIGATION
          - state_machines.AccidentClaim.SUBROGATION_PENDING_to_SUBROGATION_PENDING
          - entities.AccidentClaim.fields.recovered_cents
        distinguishing_aspect: "AccidentClaim is cyclic: SUBROGATION_PENDING self-loops on record-recovery, then dispute loops back to UNDER_INVESTIGATION (a revision round), a non-linear shape on a different entity than Vehicle."
        test_recipe:
          setup:
            - "Vehicle; accident claim at_fault=false damage=1000000 liable 0.5 in SUBROGATION_PENDING with a recovery of 200000 posted."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "VIN-CYC-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /accident-claims"
              payload: { vehicle_id: "${veh_id}", reported_at: "2026-03-05T00:00:00Z", at_fault: false, estimated_damage_cents: 1000000, deductible_cents: 0, third_party_liable_pct: 0.5 }
              as: FinanceOfficer
              captures: { ac_id: $.data.id }
            - call: "POST /accident-claims/${ac_id}/investigate"
              payload: {}
              as: FinanceOfficer
            - call: "POST /accident-claims/${ac_id}/subrogate"
              payload: {}
              as: FinanceOfficer
            - call: "POST /accident-claims/${ac_id}/record-recovery"
              payload: { amount_cents: 200000 }
              as: FinanceOfficer
          trigger:
            - call: "POST /accident-claims/${ac_id}/dispute"
              payload: { reversal_cents: 200000 }
              as: FinanceOfficer
              captures: { st: $.data.status }
          assert:
            - "AccidentClaim.${ac_id}.status == UNDER_INVESTIGATION"
            - "AccidentClaim.${ac_id}.recovered_cents == 0"
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accident_out_of_service_cancels_reservation_releases_budget
        grounds:
          - state_machines.Vehicle.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Department.fields.committed_budget_cents
        distinguishing_aspect: "Depth-3 chain from POST /accident-claims: accident mutates Vehicle (->OUT_OF_SERVICE), that vehicle change cancels the future CONFIRMED Reservation, and that reservation cancel releases the Department budget hold (committed_budget_cents 6000 -> 0)."
        test_recipe:
          setup:
            - "SEDAN policy; dept budget 10000000; one POOL SEDAN vehicle; one CONFIRMED reservation window 2026-06-20 09-13 (future vs clock 2026-06-01), holding 6000."
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "Fire", cost_center_code: "CC-300", monthly_budget_cents: 10000000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "VIN-CAS-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2024-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { department_id: "${dep_id}", requested_start: "2026-06-20T09:00:00Z", requested_end: "2026-06-20T13:00:00Z", driver_name: "D", purpose: "resp" }
              as: MotorPoolClerk
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: MotorPoolClerk
          trigger:
            - call: "POST /accident-claims"
              payload: { vehicle_id: "${veh_id}", reported_at: "2026-06-02T00:00:00Z", at_fault: true, estimated_damage_cents: 800000 }
              as: FinanceOfficer
            - call: "GET /reservations/${res_id}"
              payload: {}
              as: MotorPoolClerk
              captures: { rst: $.data.status }
            - call: "GET /departments/${dep_id}"
              payload: {}
              as: FinanceOfficer
              captures: { cb: $.data.committed_budget_cents }
          assert:
            - "Vehicle.${veh_id}.operational_status == OUT_OF_SERVICE"
            - "Reservation.${res_id}.status == CANCELLED"
            - "Department.${dep_id}.committed_budget_cents == 0"
      - name: workorder_complete_flags_replacement
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - calculations.replacement_score
          - entities.Vehicle.fields.lifecycle_status
        distinguishing_aspect: "Depth-2 chain from a different trigger (POST /work-orders/{id}/complete): completion adds total_cost to lifetime_maintenance_cents, and that field change recomputes replacement_score across the 70.00 threshold flipping lifecycle ACTIVE->FLAGGED_FOR_REPLACEMENT (69.73 before, 70.23 after)."
        test_recipe:
          setup:
            - "Vehicle in_service 2010, acquisition 2000000, odometer 149000 (mile_sub 0.9933); clock 2026-06-01; replacement_score 69.73 (ACTIVE); one bay; scheduled WO labor_rate 20000."
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /vehicles"
              payload: { vin: "VIN-FLAG-1", vehicle_class: "SEDAN", acquisition_cost_cents: 2000000, in_service_date: "2010-01-01T00:00:00Z" }
              as: FleetAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /vehicles/${veh_id}/fuel-logs"
              payload: { reading_at: "2026-06-01T06:00:00Z", gallons: 1, fuel_cost_cents: 0, odometer_miles: 149000 }
              as: ShopTech
            - call: "POST /vehicles/${veh_id}/replacement-evaluation"
              payload: {}
              as: FleetAdmin
              captures: { score_before: $.data.replacement_score, lc_before: $.data.lifecycle_status }
            - call: "POST /shop-bays"
              payload: { name: "Bay-FLAG", bay_type: "GENERAL" }
              as: FleetAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /work-orders"
              payload: { vehicle_id: "${veh_id}", bay_id: "${bay_id}", wo_type: "REPAIR", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z", labor_rate_cents: 20000 }
              as: ShopTech
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ShopTech
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { labor_hours: 1, parts_cost_cents: 0 }
              as: ShopTech
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: FleetAdmin
              captures: { score_after: $.data.replacement_score, lc_after: $.data.lifecycle_status }
          assert:
            - "score_before == 69.73"
            - "lc_before == ACTIVE"
            - "Vehicle.${veh_id}.lifetime_maintenance_cents == 20000"
            - "score_after == 70.23"
            - "Vehicle.${veh_id}.lifecycle_status == FLAGGED_FOR_REPLACEMENT"
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_reconfirm
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
        distinguishing_aspect: "Error-category pair (state vs business_fiscal): re-confirming an already-CONFIRMED reservation whose department is also at/over budget returns ERR_INVALID_STATE (priority 6), not ERR_BUDGET_EXCEEDED (priority 11)."
        test_recipe:
          setup:
            - "SEDAN policy; dept budget exactly 6000; one POOL SEDAN vehicle; a reservation of 4h (hold 6000) already CONFIRMED (committed=6000)."
          setup_api_calls:
            - call: "POST /vehicle-class-policies"
              payload: { vehicle_class: "SEDAN", assignment_fee_cents_per_month: 30000, mileage_tier1_rate_cents: 50, mileage_tier2_rate_cents: 80, mileage_tier_boundary_miles: 1000, fuel_surcharge_multiplier: 1.1, idle_free_minutes: 60, idle_penalty_cents_per_min: 25, replacement_age_years: 10, replacement_mileage: 150000, replacement_maint_ratio: 0.6 }
              as: FleetAdmin
            - call: "POST /departments"
              payload: { name: "Water", cost_center_code: "CC-400", monthly_budget_cents: 6000 }
              as: FleetAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /vehicles"
