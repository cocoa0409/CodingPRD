            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "ID", to_state_code: "WA", move_date: "2026-07-05", work_type: "AGRICULTURAL", worker_relationship: "PARENT", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 440.00 }
              as: Recruiter
