  - rule_id: non_linear_state_machine
    instances:
      - name: shipment_measurement_axis_recovers_while_movement_axis_advances
        grounds:
          - state_machines.Shipment.measurement_status
          - state_machines.Shipment.movement_status
          - state_machines.Shipment.billing_status
          - calculations.scan_tolerance_evaluation
          - entities.Shipment.fields.measurement_status
        distinguishing_aspect: |
          The measurement axis is not a one-way pipeline: PENDING_SCAN -> SCANNED ->
          TOLERANCE_FLAGGED -> SCANNED walks BACKWARD when a later scan lands inside
          tolerance, and it does so while the independent movement axis advances
          IN_TRANSIT -> DELIVERED and the billing axis stays UNBILLED. A single linear
          status field cannot express the state after the third call, and an
          implementation that treats TOLERANCE_FLAGGED as terminal (or that lets deliver
          overwrite the measurement axis) diverges here.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305)."
            - "ServiceLevel GROUND (120 h, not guaranteed). No SurchargeWindow exists."
            - "Shipment PT declared 10 x 10 x 20 in at 30.0 lb, zone 2, non-residential: cube 2000, dim weight 15, billable 30 lb basis ACTUAL, measurement_status PENDING_SCAN, movement_status IN_TRANSIT, billing_status UNBILLED."
            - "Tolerance constants: DIM_VARIANCE_TOLERANCE_PCT 5.0 (breach at >=), WEIGHT_VARIANCE_ABS_LBS 0.5, WEIGHT_VARIANCE_PCT 2.0 -> allowance for 30 lb is max(0.5, 0.6) = 0.6."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "GROUND", name: "Ground", guarantee_hours: 120, guaranteed: false }
              as: CarrierAdmin
              captures: { sl_gnd: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_gnd}", tracking_number: "1Z-TOL-0011", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 20, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { pt: $.data.id, pt_v1: $.data.version }
          trigger:
            - call: "POST /shipments/${pt}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 21, scanned_weight_lbs: 30.0, expected_shipment_version: "${pt_v1}" }
              as: CarrierOps
              captures: { scan1: $.data.id }
            - call: "GET /shipments/${pt}"
              payload: {}
              as: CarrierOps
              captures: { pt_v2: $.data.version }
            - call: "POST /shipments/${pt}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 20.4, scanned_weight_lbs: 30.0, expected_shipment_version: "${pt_v2}" }
              as: CarrierOps
              captures: { scan2: $.data.id }
            - call: "POST /shipments/${pt}/deliver"
              payload: {}
              as: CarrierOps
            - call: "GET /shipments/${pt}/scans"
              payload: {}
              as: CarrierOps
          assert:
            - "DimensionScan.${scan1}.scanned_cube_in3 == 2100, dim_variance_pct == 5.00 exactly, weight_variance_lbs == 0.0, tolerance_status == EXCEEDS_TOLERANCE (the rule breaches at >= 5.0)"
            - "After call 1: Shipment.${pt}.measurement_status == TOLERANCE_FLAGGED, movement_status == IN_TRANSIT, billing_status == UNBILLED"
            - "After call 1: Shipment.${pt}.scanned_cube_in3 == 2100, final_dim_weight_lbs == 16, final_billable_weight_lbs == 30, final_basis == ACTUAL, billable_weight_lbs == 30"
            - "DimensionScan.${scan2}.scanned_cube_in3 == 2000 (20.4 in rounds half-up to 20), dim_variance_pct == 0.00, weight_variance_lbs == 0.0, tolerance_status == WITHIN_TOLERANCE"
            - "After call 3: Shipment.${pt}.measurement_status == SCANNED — the measurement axis moved BACKWARD out of TOLERANCE_FLAGGED"
            - "After the deliver call: Shipment.${pt}.movement_status == DELIVERED and measurement_status is STILL SCANNED (deliver does not touch the measurement axis) and billing_status is STILL UNBILLED"
            - "Shipment.${pt}.delivered_at == 2026-08-01T00:00:00Z and billable_weight_lbs == 30"
            - "GET /shipments/${pt}/scans returns exactly 2 DimensionScan rows — the superseding scan does not delete the flagged one"
      - name: dispute_evidence_round_cap_terminates_the_review_cycle
        grounds:
          - state_machines.Dispute
          - calculations.guarantee_refund
          - validations[priority=48]  # ERR_EVIDENCE_ROUNDS_EXHAUSTED
          - entities.Dispute.fields.round_count
          - entities.Dispute.fields.accepted_evidence_count
        distinguishing_aspect: |
          The dispute lifecycle contains a genuine CYCLE — UNDER_REVIEW ->
          EVIDENCE_REQUESTED -> UNDER_REVIEW — that is bounded by a counter
          (MAX_EVIDENCE_ROUNDS 2) rather than by the state value, so the same
          request-evidence call succeeds twice and then fails with 409 from an
          UNCHANGED status. Progress is therefore not a function of the current state
          alone; a linear implementation either allows unlimited rounds or refuses the
          second one.
        test_recipe:
          setup:
            - "SH-1001 ACTIVE with ACTIVE contract C1 (dim_divisor 139, min_charge_cents 1195, zone-2 rows 380/340/305, RESIDENTIAL override 540). No surcharge window."
            - "Shipment P1 (18.4 x 12.6 x 10.5 in, 9.2 lb, zone 2, EXPRESS, residential) DELIVERED: transportation 7220 + RESIDENTIAL 540 = 7760."
            - "Invoice INV-D over 2026-08-01..2026-08-31 holding P1's line, ISSUED (tsub 7220, tier 0 bps, net 7760), dispute deadline 2026-10-30."
            - "MAX_EVIDENCE_ROUNDS is 2; the clock stays at 2026-08-01T00:00:00Z so the dispute window is open."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-1001", name: "Northwind Freight" }
              as: CarrierAdmin
              captures: { sh1: $.data.id, sh1_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express 24", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl_exp: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh1}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
                accessorial_rate_overrides: { RESIDENTIAL: 540 }
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh1_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh1}", service_level_id: "${sl_exp}", tracking_number: "1Z-P1-0001", zone: 2, residential_declared: true, declared_length_in: 18.4, declared_width_in: 12.6, declared_height_in: 10.5, declared_weight_lbs: 9.2 }
              as: CarrierOps
              captures: { p1: $.data.id }
            - call: "POST /shipments/${p1}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh1}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { invd: $.data.id }
            - call: "POST /invoices/${invd}/issue"
              payload: {}
              as: BillingOps
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${invd}", shipment_id: "${p1}" }
              as: BillingOps
              captures: { line1: "$.data[0].id" }
          trigger:
            - call: "POST /disputes"
              payload: { invoice_line_id: "${line1}", claim_type: "ACCESSORIAL", claimed_reason: "Delivered to a commercial dock, residential fee is wrong", disputed_codes: ["RESIDENTIAL"] }
              as: ShipperUser
              as_user_id: "${sh1}"
              captures: { dsp: $.data.id }
            - call: "POST /disputes/${dsp}/evidence"
              payload: { item_type: "ADDRESS_PROOF", reference: "doc://address-proof-1" }
              as: ShipperUser
              as_user_id: "${sh1}"
            - call: "POST /disputes/${dsp}/request-evidence"
              payload: { required_item_type: "DELIVERY_PHOTO" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
            - call: "POST /disputes/${dsp}/evidence"
              payload: { item_type: "DELIVERY_PHOTO", reference: "img://pod-1" }
              as: ShipperUser
              as_user_id: "${sh1}"
            - call: "POST /disputes/${dsp}/request-evidence"
              payload: { required_item_type: "SCALE_CERT" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
            - call: "POST /disputes/${dsp}/evidence"
              payload: { item_type: "SCALE_CERT", reference: "doc://scale-cert-1" }
              as: ShipperUser
              as_user_id: "${sh1}"
            - call: "POST /disputes/${dsp}/request-evidence"
              payload: { required_item_type: "SCAN_IMAGE" }
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { err_rounds: $.data.error_id }
          assert:
            - "On creation Dispute.${dsp}.status == SUBMITTED with round_count == 0 and accepted_evidence_count == 0"
            - "After the first evidence upload Dispute.${dsp}.status == UNDER_REVIEW, round_count == 0, accepted_evidence_count == 1"
            - "After the first request-evidence Dispute.${dsp}.status == EVIDENCE_REQUESTED, round_count == 1, required_item_type == DELIVERY_PHOTO"
            - "After the second evidence upload the status returns to UNDER_REVIEW with round_count still 1 and accepted_evidence_count == 2 — the cycle re-entered a state it already occupied"
            - "After the second request-evidence Dispute.${dsp}.status == EVIDENCE_REQUESTED, round_count == 2, required_item_type == SCALE_CERT"
            - "After the third evidence upload Dispute.${dsp}.status == UNDER_REVIEW and accepted_evidence_count == 3"
            - "The third request-evidence returns 409 with error_id ERR_EVIDENCE_ROUNDS_EXHAUSTED — refused by the round counter, not by the status, which was legally UNDER_REVIEW"
            - "After the rejected call Dispute.${dsp}.status is STILL UNDER_REVIEW, round_count is STILL 2, required_item_type is STILL SCALE_CERT and accepted_evidence_count is STILL 3 — the failed transition wrote nothing"
            - "GET /disputes/${dsp}/evidence returns exactly 3 EvidenceItem rows, all with accepted == true"
  - rule_id: transitive_cascade
    instances:
      - name: automated_rescan_cascades_through_a_frozen_issued_invoice_to_the_shipper_ledger
        grounds:
          - calculations.billing_reconciliation_branch
          - calculations.accessorial_assessment
          - calculations.shipper_ledger_aggregates
          - state_machines.Invoice.ISSUED_to_ADJUSTED
          - entities.BillingAdjustment.fields.created_by_user_id
        distinguishing_aspect: |
          One AUTOMATED_DWS scan starts a five-hop chain that crosses six entities:
          DimensionScan -> Shipment (billable weight and oversize flag) ->
          AccessorialCharge (a new AUTO OVERSIZE row) -> BillingAdjustment (a
          system-proposed WEIGHT_CORRECTION, because the line is frozen by an ISSUED
          invoice) -> InvoiceLine and Invoice (only once the adjustment is applied) ->
          ShipperAccount.credit_balance_cents and open_charges_cents. Hop 4 is the one
          implementations miss: the frozen base_line_total_cents must NOT be rewritten,
          the delta has to travel as a separate adjustment row, and nothing reaches the
          ledger until a second operator releases it.
