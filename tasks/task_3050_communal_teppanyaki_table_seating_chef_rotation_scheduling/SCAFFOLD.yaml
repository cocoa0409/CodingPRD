  # --- Test-driving endpoint --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default time is exactly 2026-09-01T00:00:00Z, and before this endpoint is called the clock MUST read that default rather than real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["every time-gated rule in §1.2/§1.3/§1.4 re-evaluates against the new clock instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or the role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role may not perform this operation"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Body does not parse, a declared input field is missing, or a field is of the wrong type or outside its declared enum"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "No venue carries the supplied id"
  - id: ERR_PARTY_NOT_FOUND
    http: 404
    condition: "No party carries the supplied id"
  - id: ERR_TIER_NOT_FOUND
    http: 404
    condition: "No table tier carries the supplied id"
  - id: ERR_TABLE_NOT_FOUND
    http: 404
    condition: "No grill table carries the supplied id"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "No booking carries the supplied id"
  - id: ERR_SEATING_NOT_FOUND
    http: 404
    condition: "No table occupancy carries the supplied id"
  - id: ERR_CHEF_NOT_FOUND
    http: 404
    condition: "No chef assignment carries the supplied id"
  - id: ERR_SHOW_NOT_FOUND
    http: 404
    condition: "No show phase carries the supplied id"
  - id: ERR_MAINTENANCE_WINDOW_NOT_FOUND
    http: 404
    condition: "No maintenance window carries the supplied id"
  - id: ERR_SUSHI_TICKET_NOT_FOUND
    http: 404
    condition: "No sushi ticket carries the supplied id"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "No ledger entry carries the supplied id"
  - id: ERR_PROTEIN_TICKET_NOT_FOUND
    http: 404
    condition: "No protein issue carries the supplied id"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared"
  - id: ERR_BOOKING_HORIZON_EXCEEDED
    http: 422
    condition: "scheduled_time is off the 5-minute grid or further ahead than booking_horizon_minutes"
  - id: ERR_MAINTENANCE_CONFLICT
    http: 409
    condition: "The interval the request would occupy overlaps a scheduled or active maintenance window on the same resource"
  - id: ERR_TIER_MISMATCH
    http: 422
    condition: "The party size does not fit the tier's capacity band"
  - id: ERR_TIER_RETIRED
    http: 409
    condition: "The referenced table tier is RETIRED"
  - id: ERR_TABLE_OVER_CAPACITY
    http: 409
    condition: "The guests to be seated would exceed the target grill table's seat capacity"
  - id: ERR_HOLD_LIMIT_EXCEEDED
    http: 409
    condition: "The booking has already been held HOLD_MAX_COUNT times in this episode"
  - id: ERR_HOLD_WINDOW_CLOSED
    http: 409
    condition: "The hold window the request depends on has already closed"
  - id: ERR_SHARED_SPLIT_INVALID
    http: 422
    condition: "A booking sharing an invite_code has an expired hold or a scheduled_time outside the shared grace band"
  - id: ERR_VENTILATION_FREEZE
    http: 409
    condition: "The venue is in VENTILATION_HOLD and its occupancy freeze blocks the operation"
  - id: ERR_CHEF_ROTATION_EXHAUSTED
    http: 409
    condition: "No chef is on station with a clear table and enough reset minutes since the last show"
  - id: ERR_STATION_OCCUPIED
    http: 409
    condition: "Another chef at this venue already holds the requested station zone on station"
  - id: ERR_SHOW_DEPENDENCY
    http: 409
    condition: "The prerequisite course phase for this show has not reached FINISHED"
  - id: ERR_SHOW_UNDERRUN
    http: 409
    condition: "The measured show duration falls short of the tier's per-table performance standard less its tolerance"
  - id: ERR_PROTEIN_VARIANCE_EXCEEDED
    http: 422
    condition: "The requested protein issue exceeds the standard plus the variance cap, or falls below one gram"
  - id: ERR_CREDIT_INELIGIBLE
    http: 422
    condition: "The party's loyalty tier may not apply reusable credit"
  - id: ERR_CREDIT_BELOW_MINIMUM
    http: 422
    condition: "The requested credit application is non-zero but under the minimum ticket amount"
  - id: ERR_CREDIT_OVER_CAP
    http: 422
    condition: "The requested credit application exceeds the percentage or absolute cap on the check"
  - id: ERR_CREDIT_EXCEEDED
    http: 402
    condition: "The party's reusable credit balance does not cover the requested application"
  - id: ERR_PARTY_RESTRICTED
    http: 403
    condition: "The party is RESTRICTED and may not start or join a seating episode"
  - id: ERR_NO_ACTIVE_SEATING
    http: 409
    condition: "The booking has no active table occupancy to close"
  - id: ERR_DUPLICATE_SEATING
    http: 409
    condition: "The booking already occupies the target table"
  - id: ERR_MAINTENANCE_WINDOW_LATE
    http: 409
    condition: "The maintenance window is accepted later than its late grace allows, or the venue is still frozen"
  - id: ERR_SUSHI_PLATE_LATE
    http: 409
    condition: "The plated sushi dwell interval would overlap another plated ticket on the counter"
  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "The same operator is not permitted to perform both steps of this operation"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The expected parent version carried by the request does not match the parent's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Chain operator who opens venues and configures table tiers"
    identity: "opaque"
    exclusive_operations:
      - "POST /venues — open a venue"
    shared_operations:
      - "POST /tiers — configure a table tier"
      - "POST /_clock/set_current_utc — set the logical clock"
      - "every GET endpoint"

  - name: FloorManager
    description: "Duty manager who owns the physical floor: tables, chef roster, and maintenance windows"
    identity: "opaque"
    exclusive_operations:
      - "POST /tables — commission a grill table"
      - "POST /tables/{id}/events — table events (SEAT, TURN, TURN_RELEASE, MAINTENANCE_ENTER)"
      - "POST /venues/{id}/run_ops — advance the venue batch epoch"
      - "POST /chefs — add a chef to the roster"
      - "POST /chefs/{id}/events (ROTATE_SUPPRESS)"
      - "POST /seatings/{id}/extend — extend an occupancy window"
      - "POST /maintenance-windows and its accept/cancel/reopen events"
      - "POST /protein-tickets/{id}/variance — adjust issued protein"
      - "POST /shows/{id}/events (SKIP, REINSTATE)"
    shared_operations:
      - "POST /chefs/{id}/events (CLOCK_IN, CLEAR_FINISH, CLOCK_OUT) shared with Chef"
      - "every GET endpoint"

  - name: Host
    description: "Front-of-house host who books, holds, seats and closes parties"
    identity: "opaque"
    exclusive_operations:
      - "POST /parties — register a guest party"
      - "POST /reservations and its holds/seat/events/party-size/close/reopen actions"
      - "POST /ledger-entries/{id}/void — void a posted charge"
    shared_operations:
      - "every GET endpoint"

  - name: Chef
    description: "Teppanyaki chef who works the grill rotation and performs the show"
    identity: "entity_backed:ChefAssignment"
    exclusive_operations:
      - "POST /chefs/{id}/events (CLOCK_IN, CLEAR_FINISH, CLOCK_OUT)"
      - "POST /shows/{id}/events (START, FINISH)"
      - "POST /protein-tickets/{id}/variance and POST /protein-tickets/{id}/events"
    shared_operations:
      - "every GET endpoint"

  - name: SushiChef
    description: "Sushi counter chef who owns the pre-grill courses and the plating counter"
    identity: "entity_backed:ChefAssignment"
    exclusive_operations:
      - "POST /sushi-tickets — fire a sushi ticket"
      - "POST /sushi-tickets/{id}/events — advance, restage, restart or void a ticket"
    shared_operations:
      - "every GET endpoint"
