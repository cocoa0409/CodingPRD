          assert:
            - "Leg 1 (baseline): REP1 returns 201 with status == SITE_VISIT_SCHEDULED, site_visit_panelist_id == ${p4}, window 2026-08-10..2026-08-14; Panelist.${p4}.site_visit_count == 1"
            - "Leg 2 (closed-interval endpoint share): the 2026-08-14..2026-08-16 attempt on REP2 returns HTTP 409 ERR_SITE_VISIT_BUFFER_CONFLICT - under CLOSED semantics a start equal to an existing end is already an intersection, unlike the half-open campaign windows"
            - "Leg 3 (exactly the buffer): the 2026-08-17..2026-08-20 attempt on REP2 returns HTTP 409 ERR_SITE_VISIT_BUFFER_CONFLICT - the gap 2026-08-14 -> 2026-08-17 is exactly SITE_VISIT_BUFFER_DAYS (3), and the rule requires MORE than 3 days"
            - "Leg 4 (one day past the buffer): the 2026-08-18..2026-08-21 attempt on REP2 returns 201 with status == SITE_VISIT_SCHEDULED, since 2026-08-18 > 2026-08-14 + 3 days; Panelist.${p4}.site_visit_count == 2"
            - "Legs 2 and 3 left no trace: REP2.status was still SUBMITTED with site_visit_panelist_id null immediately before leg 4"
