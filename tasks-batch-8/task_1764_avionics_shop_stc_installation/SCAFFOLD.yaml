# =============================================================================
# SCAFFOLD — Avionics Shop & STC Installation (Garmin dealer avionics shop)
# =============================================================================

scenario: |
  Avionics Shop & STC Installation (Garmin dealer avionics shop): work scope & panel design approval, equipment procurement & lead time, STC/field-approval documentation path, wiring/harness fabrication & installation hours, ground & flight test verification, aircraft downtime estimate vs actual & customer updates, weight & balance revision, warranty & software subscription setup

domain_name: avionics-shop-stc
api_prefix: /avionics

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer (aircraft owner) display name" }
      - { name: contact_email, type: string, source: input, description: "Customer contact email for downtime updates" }
      - { name: customer_kind, type: enum, source: input, default: INDIVIDUAL, description: "INDIVIDUAL | FLIGHT_SCHOOL | FLEET_OPERATOR — drives equipment discount tier in quote_total" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of this aircraft" }
      - { name: tail_number, type: string, source: input, description: "Registration / tail number; unique across all aircraft", constraints: "unique" }
      - { name: make_model, type: string, source: input, description: "Make and model, e.g. 'Cessna 182T'" }
      - { name: baseline_empty_weight_lb, type: number, source: input, description: "Last weighed empty weight in lb (1 decimal)" }
      - { name: baseline_arm_in, type: number, source: input, description: "Baseline empty CG arm in inches (2 decimals)" }
      - { name: baseline_moment_lb_in, type: number, source: computed, description: "= round_half_up(baseline_empty_weight_lb * baseline_arm_in, 1 decimal)" }
      - { name: cg_min_arm_in, type: number, source: input, description: "Forward CG limit arm in inches (2 decimals)" }
      - { name: cg_max_arm_in, type: number, source: input, description: "Aft CG limit arm in inches (2 decimals)" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | IN_SHOP — IN_SHOP while any non-terminal WorkOrder references this aircraft" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; aircraft being worked on" }
      - { name: scope_description, type: string, source: input, description: "Free-text work scope summary" }
      - { name: estimated_downtime_days, type: integer, source: input, description: "Quoted downtime in whole days" }
      - { name: quoted_labor_hours, type: number, source: input, description: "Quoted labor hours (flat-rate estimate input to quote_total)" }
      - { name: bay_code, type: string, source: input, description: "Hangar bay identifier occupied during the bay window" }
      - { name: bay_window_start, type: datetime, source: input, description: "Bay occupancy start (half-open interval start)" }
      - { name: bay_window_end, type: datetime, source: input, description: "Bay occupancy end (half-open interval end; must be > bay_window_start)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_APPROVAL | APPROVED | PARTS_PENDING | INSTALLATION | TESTING | COMPLETED | CANCELLED" }
      - { name: inducted_at, type: datetime, source: system, description: "Logical-clock timestamp when installation began (downtime clock start); null until begin-installation", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until complete", constraints: "nullable" }
      - { name: actual_downtime_days, type: integer, source: computed, description: "= floor((completed_at - inducted_at)/86400s); null until completion", constraints: "nullable" }
      - { name: downtime_overage_days, type: integer, source: computed, description: "= actual_downtime_days - estimated_downtime_days; null until completion", constraints: "nullable" }
      - { name: overage_acknowledged, type: boolean, source: system, default: false, description: "Set true by Customer via acknowledge-overage; gates completion when overage >= 5" }
      - { name: parts_pending_count, type: integer, source: computed, default: 0, description: "Count of EquipmentOrders of this WorkOrder with status IN {PLANNED, ORDERED}" }
      - { name: tasks_unverified_count, type: integer, source: computed, default: 0, description: "Count of InstallTasks of this WorkOrder with status IN {PLANNED, IN_PROGRESS, COMPLETED}" }
      - { name: total_actual_labor_hours, type: number, source: computed, default: 0, description: "Sum of actual_hours over InstallTasks with status IN {COMPLETED, VERIFIED}" }
      - { name: total_billed_labor_cents, type: integer, source: computed, default: 0, description: "Sum of billed_labor_cents over InstallTasks with status VERIFIED" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Set by submit-quote via quote_total; null until then", constraints: "nullable" }
      - { name: warranty_term_months, type: integer, source: input, default: 12, description: "Warranty term in calendar months from completion" }
      - { name: software_subscription_months, type: integer, source: input, default: 12, description: "Garmin software/database subscription term in calendar months from completion" }
      - { name: warranty_expires_at, type: datetime, source: computed, description: "= completed_at + warranty_term_months calendar months; null until completion", constraints: "nullable" }
      - { name: subscription_expires_at, type: datetime, source: computed, description: "= completed_at + software_subscription_months calendar months; null until completion", constraints: "nullable" }

  - name: PanelDesign
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; work order this design revision belongs to" }
      - { name: revision, type: integer, source: system, description: "1-based revision number within the work order, assigned at creation in creation order" }
      - { name: layout_notes, type: string, source: input, description: "Panel layout description" }
      - { name: equipment_list, type: array, source: input, description: "Array of {part_number, description, quantity, unit_price_cents, weight_lb, arm_in, lead_time_days}; may be empty" }
      - { name: total_added_weight_lb, type: number, source: computed, description: "= sum(quantity * weight_lb) over equipment_list lines (1 decimal)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | CHANGES_REQUESTED | SUPERSEDED" }

  - name: EquipmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; work order this procurement line belongs to" }
      - { name: seq, type: integer, source: system, description: "Monotone per-work-order creation sequence (stable ordering for cascade-created rows)" }
      - { name: source, type: enum, source: system, description: "DESIGN_RELEASE (auto-created on design approval) | MANUAL (change-order via POST /equipment-orders)" }
      - { name: source_design_revision, type: integer, source: system, description: "PanelDesign.revision whose equipment_list line produced this order; null for MANUAL", constraints: "nullable" }
      - { name: part_number, type: string, source: input, description: "Part number being procured" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: quantity, type: integer, source: input, description: "Units ordered (>= 1)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Unit price in cents (> 0)" }
      - { name: lead_time_days, type: integer, source: input, description: "Vendor-quoted lead time in calendar days (>= 0)" }
      - { name: ordered_at, type: datetime, source: system, description: "Logical-clock timestamp when marked ordered; null until then", constraints: "nullable" }
      - { name: promised_date, type: datetime, source: computed, description: "= ordered_at + lead_time_days * 86400s; null until ordered", constraints: "nullable" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of receipt; null until received", constraints: "nullable" }
      - { name: is_late, type: boolean, source: computed, description: "true iff (received_at if set else current logical clock) > promised_date (strictly greater); false until ordered" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | ORDERED | RECEIVED | CANCELLED" }

  - name: InstallTask
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; work order this labor task belongs to" }
      - { name: task_kind, type: enum, source: input, description: "HARNESS_FABRICATION | PANEL_ASSEMBLY | INSTALLATION — drives labor rate multiplier" }
      - { name: description, type: string, source: input, description: "Task description (e.g. 'fabricate GTN harness')" }
      - { name: estimated_hours, type: number, source: input, description: "Estimated labor hours (> 0)" }
      - { name: actual_hours, type: number, source: input, description: "Actual hours recorded at completion; null until first completion; replaced (not accumulated) on re-completion after rework", constraints: "nullable" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the Technician who completed the task (latest completion)", constraints: "nullable" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the Inspector who verified the task; null until verified", constraints: "nullable" }
      - { name: billed_labor_cents, type: integer, source: computed, description: "Tiered labor charge computed at verify via labor_billing (actual variant); null when not VERIFIED", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | IN_PROGRESS | COMPLETED | VERIFIED | VOIDED" }

  - name: TestEvent
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; work order under test" }
      - { name: test_kind, type: enum, source: input, description: "GROUND | FLIGHT" }
      - { name: scheduled_start, type: datetime, source: input, description: "Test window start" }
      - { name: scheduled_end, type: datetime, source: input, description: "Test window end (must be > scheduled_start)" }
      - { name: attempt, type: integer, source: system, default: 1, description: "Attempt number; increments on each reschedule after FAIL (max 3)" }
      - { name: result, type: enum, source: system, default: NONE, description: "NONE | PASS | FAIL" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PASSED | FAILED | CANCELLED" }

  - name: RegulatoryPackage
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; work order this approval package documents" }
      - { name: approval_path, type: enum, source: input, description: "STC (existing Supplemental Type Certificate data) | FIELD_APPROVAL (FAA inspector approval)" }
      - { name: stc_number, type: string, source: input, description: "STC certificate number; required iff approval_path == STC", constraints: "conditionally required" }
      - { name: faa_tracking_number, type: string, source: system, description: "Server-minted tracking id for FIELD_APPROVAL packages, assigned on first submit; null for STC", constraints: "nullable" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the Inspector recording the latest decision", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CONFORMITY_REVIEW (STC path) | FAA_SUBMITTED (field-approval path) | APPROVED" }

  - name: WeightBalanceRevision
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; work order this W&B revision belongs to" }
      - { name: method, type: enum, source: input, description: "INCREMENTAL (delta from latest ACCEPTED revision or baseline) | FULL_REWEIGH (baseline + approved design lines + manual lines)" }
      - { name: added_items, type: array, source: input, default: [], description: "Array of {description, weight_lb, arm_in} manual addition lines" }
      - { name: removed_weight_lb, type: number, source: input, default: 0, description: "Weight of removed equipment in lb (>= 0)" }
      - { name: removed_arm_in, type: number, source: input, description: "Arm of removed equipment; required iff removed_weight_lb > 0", constraints: "conditionally required, nullable" }
      - { name: new_empty_weight_lb, type: number, source: computed, description: "Computed per weight_balance_recompute (1 decimal)" }
      - { name: new_moment_lb_in, type: number, source: computed, description: "Computed per weight_balance_recompute (1 decimal); rounding order differs by method" }
      - { name: new_arm_in, type: number, source: computed, description: "= round_half_up(new_moment_lb_in / new_empty_weight_lb, 2 decimals)" }
      - { name: cg_within_limits, type: boolean, source: computed, description: "= (cg_min_arm_in <= new_arm_in <= cg_max_arm_in) on the parent Aircraft" }
      - { name: status, type: enum, source: system, default: COMPUTED, description: "COMPUTED | ACCEPTED | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Aircraft
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: IN_SHOP
        trigger: "system (automatic when a WorkOrder is created for this aircraft)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SHOP
        to: AVAILABLE
        trigger: "system (automatic when the aircraft's WorkOrder reaches COMPLETED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /avionics/work-orders/{workOrderId}/submit-quote"
        actor: ShopManager
        preconditions:
          - "At least one PanelDesign with status IN {DRAFT, SUBMITTED} exists for this work order (ERR_NO_PANEL_DESIGN)"
        side_effects:
          - "quoted_total_cents computed via quote_total from the highest-revision non-SUPERSEDED PanelDesign"
          - "increments WorkOrder.version by 1"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "system (cascade from POST /avionics/panel-designs/{panelDesignId}/decide with outcome=APPROVE when the approved design's equipment_list is empty)"
        actor: system
        preconditions: []
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: PENDING_APPROVAL
        to: PARTS_PENDING
        trigger: "system (cascade from decide APPROVE when the approved design's equipment_list is non-empty)"
        actor: system
        preconditions: []
        side_effects:
          - "one EquipmentOrder (status PLANNED, source DESIGN_RELEASE, source_design_revision = approved revision) auto-created per equipment_list line, in line order (seq assigned)"
          - "parts_pending_count recomputed (= number of created lines)"
          - "increments WorkOrder.version by 1"
      - from: APPROVED
        to: PARTS_PENDING
        trigger: "system (automatic when a MANUAL EquipmentOrder is created while APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "parts_pending_count recomputed"
      - from: APPROVED
        to: INSTALLATION
        trigger: "POST /avionics/work-orders/{workOrderId}/begin-installation"
        actor: ShopManager
        preconditions:
          - "parts_pending_count == 0 (ERR_PARTS_PENDING)"
        side_effects:
          - "inducted_at = current logical clock"
          - "increments WorkOrder.version by 1"
      - from: PARTS_PENDING
        to: INSTALLATION
        trigger: "POST /avionics/work-orders/{workOrderId}/begin-installation"
        actor: ShopManager
        preconditions:
          - "parts_pending_count == 0 (ERR_PARTS_PENDING)"
        side_effects:
          - "inducted_at = current logical clock"
          - "increments WorkOrder.version by 1"
      - from: INSTALLATION
        to: TESTING
        trigger: "POST /avionics/work-orders/{workOrderId}/begin-testing"
        actor: ShopManager
        preconditions:
          - "At least one InstallTask with status VERIFIED exists (ERR_NO_INSTALL_TASKS)"
          - "tasks_unverified_count == 0 (ERR_TASKS_UNVERIFIED)"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: TESTING
        to: INSTALLATION
        trigger: "system (cascade when a FLIGHT TestEvent is recorded FAIL: verified tasks revert to rework)"
        actor: system
        preconditions: []
        side_effects:
          - "tasks_unverified_count and total_billed_labor_cents already recomputed by the InstallTask revert cascade"
          - "increments WorkOrder.version by 1"
        note: "Regression hop of the flight-fail cascade; fires only while tasks_unverified_count > 0 after the revert"
      - from: TESTING
        to: COMPLETED
        trigger: "POST /avionics/work-orders/{workOrderId}/complete"
        actor: ShopManager
        preconditions:
          - "At least one GROUND TestEvent with status PASSED AND at least one FLIGHT TestEvent with status PASSED for this work order (ERR_TESTS_NOT_PASSED)"
          - "A RegulatoryPackage with status APPROVED exists for this work order (ERR_REGULATORY_NOT_APPROVED)"
          - "A WeightBalanceRevision with status ACCEPTED exists for this work order (ERR_WB_NOT_ACCEPTED)"
          - "If floor((clock - inducted_at)/86400s) - estimated_downtime_days >= 5 then overage_acknowledged must be true (ERR_DOWNTIME_OVERAGE_UNACKED)"
        side_effects:
          - "completed_at = current logical clock"
          - "actual_downtime_days and downtime_overage_days computed via downtime_and_warranty"
          - "warranty_expires_at = completed_at + warranty_term_months calendar months (day-of-month clamped to month end)"
          - "subscription_expires_at = completed_at + software_subscription_months calendar months (same clamp)"
          - "Aircraft of this work order: IN_SHOP -> AVAILABLE"
          - "increments WorkOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /avionics/work-orders/{workOrderId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "EquipmentOrders with status IN {PLANNED, ORDERED} -> CANCELLED"
          - "InstallTasks with status IN {PLANNED, IN_PROGRESS, COMPLETED} -> VOIDED"
          - "TestEvents with status IN {SCHEDULED, FAILED} -> CANCELLED"
          - "PanelDesigns with status IN {DRAFT, SUBMITTED, CHANGES_REQUESTED} -> SUPERSEDED"
          - "parts_pending_count, tasks_unverified_count recomputed"
          - "Aircraft: IN_SHOP -> AVAILABLE"
          - "increments WorkOrder.version by 1"
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /avionics/work-orders/{workOrderId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "same cancellation cascade as DRAFT -> CANCELLED"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /avionics/work-orders/{workOrderId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "same cancellation cascade as DRAFT -> CANCELLED"
      - from: PARTS_PENDING
        to: CANCELLED
        trigger: "POST /avionics/work-orders/{workOrderId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "same cancellation cascade as DRAFT -> CANCELLED"
      - from: INSTALLATION
        to: CANCELLED
        trigger: "POST /avionics/work-orders/{workOrderId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "same cancellation cascade as DRAFT -> CANCELLED"
      - from: TESTING
        to: CANCELLED
        trigger: "POST /avionics/work-orders/{workOrderId}/cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "same cancellation cascade as DRAFT -> CANCELLED"

  - entity: PanelDesign
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /avionics/panel-designs/{panelDesignId}/submit"
        actor: ShopManager
        preconditions:
          - "Parent WorkOrder.status IN {DRAFT, PENDING_APPROVAL} (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /avionics/panel-designs/{panelDesignId}/decide with outcome=APPROVE"
        actor: Customer
        preconditions:
          - "Parent WorkOrder.status == PENDING_APPROVAL (ERR_INVALID_STATE)"
          - "X-User-ID equals the Customer.id owning the parent aircraft (ERR_FORBIDDEN)"
        side_effects:
          - "Parent WorkOrder: PENDING_APPROVAL -> APPROVED (empty equipment_list) or -> PARTS_PENDING (non-empty list)"
          - "If equipment_list non-empty: one PLANNED EquipmentOrder auto-created per line (DESIGN_RELEASE), parts_pending_count recomputed"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /avionics/panel-designs/{panelDesignId}/decide with outcome=REQUEST_CHANGES"
        actor: Customer
        preconditions:
          - "Parent WorkOrder.status == PENDING_APPROVAL (ERR_INVALID_STATE)"
          - "X-User-ID equals the Customer.id owning the parent aircraft (ERR_FORBIDDEN)"
        side_effects: []
        note: "WorkOrder stays PENDING_APPROVAL; the shop creates a new revision, which supersedes this one"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new PanelDesign is created for the same work order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (automatic when a new PanelDesign is created for the same work order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHANGES_REQUESTED
        to: SUPERSEDED
        trigger: "system (automatic when a new PanelDesign is created for the same work order)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EquipmentOrder
    initial_state: PLANNED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ORDERED
        trigger: "POST /avionics/equipment-orders/{equipmentOrderId}/mark-ordered"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "ordered_at = current logical clock"
          - "promised_date = ordered_at + lead_time_days * 86400s"
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /avionics/equipment-orders/{equipmentOrderId}/receive"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "received_at = current logical clock"
          - "is_late = (received_at > promised_date) strictly"
          - "parent WorkOrder.parts_pending_count recomputed"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /avionics/equipment-orders/{equipmentOrderId}/cancel or system cascade from work-order cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "parent WorkOrder.parts_pending_count recomputed"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /avionics/equipment-orders/{equipmentOrderId}/cancel or system cascade from work-order cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "parent WorkOrder.parts_pending_count recomputed"

  - entity: InstallTask
    initial_state: PLANNED
    terminal_states: [VOIDED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /avionics/install-tasks/{installTaskId}/start"
        actor: Technician
        preconditions:
          - "Parent WorkOrder.status IN {APPROVED, PARTS_PENDING, INSTALLATION} (ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /avionics/install-tasks/{installTaskId}/complete"
        actor: Technician
        preconditions:
          - "Parent WorkOrder.status IN {APPROVED, PARTS_PENDING, INSTALLATION} (ERR_INVALID_STATE)"
        side_effects:
          - "actual_hours set from request (replaces any prior value after rework)"
          - "performed_by_user_id = X-User-ID of the acting Technician"
          - "parent WorkOrder.total_actual_labor_hours and tasks_unverified_count recomputed"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /avionics/install-tasks/{installTaskId}/verify"
        actor: Inspector
        preconditions:
          - "X-User-ID of the acting Inspector != performed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id = X-User-ID"
          - "billed_labor_cents computed via labor_billing (actual variant)"
          - "parent WorkOrder.total_billed_labor_cents and tasks_unverified_count recomputed"
      - from: VERIFIED
        to: IN_PROGRESS
        trigger: "system (cascade when any FLIGHT TestEvent of the same work order is recorded FAIL — rework)"
        actor: system
        preconditions: []
        side_effects:
          - "billed_labor_cents reset to null; verified_by_user_id reset to null"
          - "parent WorkOrder.total_billed_labor_cents and tasks_unverified_count recomputed"
          - "parent WorkOrder regresses TESTING -> INSTALLATION while tasks_unverified_count > 0"
      - from: PLANNED
        to: VOIDED
        trigger: "POST /avionics/install-tasks/{installTaskId}/void or system cascade from work-order cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "parent WorkOrder.total_actual_labor_hours, total_billed_labor_cents, tasks_unverified_count recomputed"
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "POST /avionics/install-tasks/{installTaskId}/void or system cascade from work-order cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "parent WorkOrder derived fields recomputed"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /avionics/install-tasks/{installTaskId}/void or system cascade from work-order cancel"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "parent WorkOrder derived fields recomputed (its actual_hours leave the COMPLETED/VERIFIED sum)"

  - entity: TestEvent
    initial_state: SCHEDULED
    terminal_states: [PASSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /avionics/test-events/{testEventId}/record-result with result=PASS"
        actor: Inspector
        preconditions:
          - "Parent WorkOrder.status == TESTING (ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /avionics/test-events/{testEventId}/record-result with result=FAIL"
        actor: Inspector
        preconditions:
          - "Parent WorkOrder.status == TESTING (ERR_INVALID_STATE)"
        side_effects:
          - "If test_kind == FLIGHT: every InstallTask of the same work order with status VERIFIED -> IN_PROGRESS (rework cascade); billed_labor_cents voided; WorkOrder.total_billed_labor_cents and tasks_unverified_count recomputed; WorkOrder regresses TESTING -> INSTALLATION"
          - "If test_kind == GROUND: no rework cascade (bench retest only)"
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /avionics/test-events/{testEventId}/reschedule"
        actor: ShopManager
        preconditions:
          - "attempt < 3 (ERR_TEST_ATTEMPT_LIMIT)"
          - "For FLIGHT tests: new window must not conflict with another flight's buffered window on the same aircraft (ERR_FLIGHT_WINDOW_CONFLICT)"
        side_effects:
          - "attempt += 1; result reset to NONE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from work-order cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: CANCELLED
        trigger: "system (cascade from work-order cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RegulatoryPackage
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: CONFORMITY_REVIEW
        trigger: "POST /avionics/regulatory-packages/{regulatoryPackageId}/submit (approval_path == STC)"
        actor: ShopManager
        preconditions:
          - "approval_path == STC (ERR_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: FAA_SUBMITTED
        trigger: "POST /avionics/regulatory-packages/{regulatoryPackageId}/submit (approval_path == FIELD_APPROVAL)"
        actor: ShopManager
        preconditions:
          - "approval_path == FIELD_APPROVAL (ERR_INVALID_STATE)"
        side_effects:
          - "faa_tracking_number minted on first submit and retained on resubmits"
      - from: CONFORMITY_REVIEW
        to: APPROVED
        trigger: "POST /avionics/regulatory-packages/{regulatoryPackageId}/record-decision with decision=APPROVED"
        actor: Inspector
        preconditions: []
        side_effects:
          - "decided_by_user_id = X-User-ID"
      - from: CONFORMITY_REVIEW
        to: DRAFT
        trigger: "POST /avionics/regulatory-packages/{regulatoryPackageId}/record-decision with decision=REJECTED"
        actor: Inspector
        preconditions: []
        side_effects: []
        note: "Conformity rejection loop — data fixed in place, resubmitted via submit"
      - from: FAA_SUBMITTED
        to: APPROVED
        trigger: "POST /avionics/regulatory-packages/{regulatoryPackageId}/record-decision with decision=APPROVED"
        actor: Inspector
        preconditions: []
        side_effects:
          - "decided_by_user_id = X-User-ID"
      - from: FAA_SUBMITTED
        to: DRAFT
        trigger: "POST /avionics/regulatory-packages/{regulatoryPackageId}/record-decision with decision=REJECTED"
        actor: Inspector
        preconditions: []
        side_effects: []
        note: "FAA rejection loop — package returns to DRAFT for correction and resubmission"

  - entity: WeightBalanceRevision
    initial_state: COMPUTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: COMPUTED
        to: ACCEPTED
        trigger: "POST /avionics/weight-balance-revisions/{weightBalanceRevisionId}/accept"
        actor: Inspector
        preconditions:
          - "cg_within_limits == true (ERR_CG_OUT_OF_LIMITS)"
          - "Parent WorkOrder.status IN {INSTALLATION, TESTING} (ERR_INVALID_STATE)"
        side_effects:
          - "Any prior ACCEPTED revision of the same work order -> SUPERSEDED"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (automatic when a newer revision of the same work order is accepted)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: panel-design-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /avionics/panel-designs"
    occ_field: expected_work_order_version
    description: |
      Creating a PanelDesign against a WorkOrder whose version has advanced
      since the client last observed it is rejected. Creating a design revision
      legitimately supersedes the previous DRAFT/SUBMITTED/CHANGES_REQUESTED
      revision and advances WorkOrder.version, so a client holding a stale
      version must re-read before authoring the next revision.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_total
    trigger: "POST submit-quote transition (DRAFT -> PENDING_APPROVAL)"
    algorithm: tiered_pricing
    formula: |
      design = PanelDesign of this work order with status != SUPERSEDED and highest revision
      labor_quote_cents = round_half_up(quoted_labor_hours * SHOP_RATE_CENTS_PER_HOUR)
      equipment_subtotal_cents = sum(line.quantity * line.unit_price_cents for line in design.equipment_list)
      discount_rate = {FLEET_OPERATOR: 0.10, FLIGHT_SCHOOL: 0.05, INDIVIDUAL: 0.00}[aircraft.customer.customer_kind]
      quoted_total_cents = labor_quote_cents + round_half_up(equipment_subtotal_cents * (1 - discount_rate))
    input_set: "The highest-revision non-SUPERSEDED PanelDesign (any of DRAFT/SUBMITTED/CHANGES_REQUESTED); the work order's Aircraft and its Customer for the discount tier"
    constants:
      SHOP_RATE_CENTS_PER_HOUR: 14500
      DISCOUNT_FLEET_OPERATOR: 0.10
      DISCOUNT_FLIGHT_SCHOOL: 0.05
      DISCOUNT_INDIVIDUAL: 0.00
    precision: "integer cents, round_half_up"

  - name: labor_billing
    trigger: "InstallTask COMPLETED -> VERIFIED transition (actual variant); estimated variant feeds quote_total at submit-quote"
    algorithm: tiered_pricing
    formula: |
      regular_hours = min(actual_hours, REGULAR_HOUR_CAP)
      overtime_hours = max(0, actual_hours - REGULAR_HOUR_CAP)
      kind_multiplier = {HARNESS_FABRICATION: 1.0, PANEL_ASSEMBLY: 1.1, INSTALLATION: 1.25}[task_kind]
      billed_labor_cents = round_half_up((regular_hours + overtime_hours * OVERTIME_MULTIPLIER) * SHOP_RATE_CENTS_PER_HOUR * kind_multiplier)
      WorkOrder.total_billed_labor_cents = sum(billed_labor_cents over InstallTasks with status VERIFIED)
    input_set: "The single InstallTask being verified; total aggregates over VERIFIED tasks only (rework reverts remove a task from the set until re-verified)"
    constants:
      REGULAR_HOUR_CAP: 8.0
      OVERTIME_MULTIPLIER: 1.5
      SHOP_RATE_CENTS_PER_HOUR: 14500
      MULT_HARNESS_FABRICATION: 1.0
      MULT_PANEL_ASSEMBLY: 1.1
      MULT_INSTALLATION: 1.25
    precision: "integer cents, round_half_up per task at verify time (never re-rounded in the aggregate)"
    variants:
      - name: estimated
        when: "quote_total at submit-quote"
        difference: "flat quoted_labor_hours * SHOP_RATE_CENTS_PER_HOUR — no overtime tier, no kind multiplier; produces a different total than the actual variant for the same hours"
      - name: actual
        when: "task verification"
        difference: "tiered overtime beyond 8.0 hours per task plus task_kind multiplier, rounded per task"

  - name: weight_balance_recompute
    trigger: "WeightBalanceRevision creation"
    algorithm: aggregation
    formula: |
      Common:
        removed_moment = removed_weight_lb * removed_arm_in (removed_arm_in required iff removed_weight_lb > 0)
        base = (method == INCREMENTAL)
          ? latest ACCEPTED WeightBalanceRevision of this work order (else Aircraft baseline)
          : Aircraft baseline (always, ignoring prior revisions)
        design_lines = (method == FULL_REWEIGH)
          ? equipment_list of the work order's APPROVED PanelDesign (each line contributes quantity * weight_lb at line arm)
          : [] (INCREMENTAL never re-reads design lines)
        added_lines = added_items ++ design_lines
      INCREMENTAL rounding order (PINNED — round per line, then sum):
        added_moment = sum(round_half_up(line.weight * line.arm, 1 decimal) for line in added_lines)
        new_moment_lb_in = round_half_up(base_moment + added_moment - round_half_up(removed_moment, 1), 1)
      FULL_REWEIGH rounding order (PINNED — sum unrounded, then round once):
        added_moment_raw = sum(line.weight * line.arm for line in added_lines)   # unrounded
        new_moment_lb_in = round_half_up(base_moment + added_moment_raw - removed_moment, 1)
      Both methods:
        new_empty_weight_lb = round_half_up(base_weight + sum(line weights incl. quantity) - removed_weight_lb, 1)
        new_arm_in = round_half_up(new_moment_lb_in / new_empty_weight_lb, 2 decimals)
        cg_within_limits = (aircraft.cg_min_arm_in <= new_arm_in <= aircraft.cg_max_arm_in)
    input_set: "INCREMENTAL: latest ACCEPTED revision of the same work order as base (Aircraft baseline when none), added_items only. FULL_REWEIGH: Aircraft baseline as base, added_items plus the APPROVED PanelDesign's equipment lines."
    constants: {}
    precision: "weight 1 decimal, moment 1 decimal, arm 2 decimals; round_half_up; rounding order pinned per method above"
    variants:
      - name: incremental
        when: "method == INCREMENTAL"
        difference: "delta from latest accepted revision; rounds each line moment to 0.1 BEFORE summing"
      - name: full_reweigh
        when: "method == FULL_REWEIGH"
        difference: "rebuilds from aircraft baseline plus approved design lines; rounds the summed moment ONCE — identical inputs can yield a moment 0.1 lb-in different from INCREMENTAL"

  - name: downtime_and_warranty
    trigger: "WorkOrder TESTING -> COMPLETED transition (and overage gate pre-check)"
    algorithm: chronological
    formula: |
      actual_downtime_days = floor((completed_clock - inducted_at) / 86400 seconds)
      downtime_overage_days = actual_downtime_days - estimated_downtime_days
      overage gate: if downtime_overage_days >= OVERAGE_ACK_THRESHOLD_DAYS and overage_acknowledged == false -> reject ERR_DOWNTIME_OVERAGE_UNACKED
      warranty_expires_at = completed_at + warranty_term_months calendar months (day-of-month clamped to last day of target month)
      subscription_expires_at = completed_at + software_subscription_months calendar months (same clamp)
    input_set: "The completing WorkOrder only"
    constants:
      OVERAGE_ACK_THRESHOLD_DAYS: 5
    precision: "whole days via floor; timestamps ISO8601 UTC"

  - name: derived_counts_and_totals
    trigger: "any EquipmentOrder or InstallTask mutation (including cascades)"
    algorithm: aggregation
    formula: |
      WorkOrder.parts_pending_count = count(EquipmentOrder of work order with status IN {PLANNED, ORDERED})
      WorkOrder.tasks_unverified_count = count(InstallTask of work order with status IN {PLANNED, IN_PROGRESS, COMPLETED})
      WorkOrder.total_actual_labor_hours = sum(InstallTask.actual_hours where status IN {COMPLETED, VERIFIED})
      WorkOrder.total_billed_labor_cents = sum(InstallTask.billed_labor_cents where status == VERIFIED)
    input_set: "All child rows of the work order in the named statuses; VOIDED tasks and CANCELLED/RECEIVED orders are excluded"
    constants: {}
    precision: "counts integer; hours 1 decimal; cents integer"

  - name: procurement_schedule
    trigger: "EquipmentOrder PLANNED -> ORDERED; is_late evaluated on read and at receive"
    algorithm: chronological
    formula: |
      promised_date = ordered_at + lead_time_days * 86400 seconds (time-of-day preserved)
      is_late = ((received_at if set else current logical clock) > promised_date)   # strictly greater; equal is NOT late
    input_set: "The single EquipmentOrder"
    constants: {}
    precision: "ISO8601 UTC timestamps"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; for Customer-role actions (decide, acknowledge-overage) X-User-ID must equal the Customer.id that owns the aircraft of the target work order"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present; types valid; enum values in range; quantity >= 1; unit_price_cents > 0; estimated_hours > 0; lead_time_days >= 0; bay_window_end > bay_window_start; scheduled_end > scheduled_start; removed_arm_in present iff removed_weight_lb > 0; stc_number present iff approval_path == STC (ERR_STC_NUMBER_REQUIRED)"
    error_id: "ERR_VALIDATION (ERR_STC_NUMBER_REQUIRED for the conditional stc_number case)"
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK targets (aircraft_id, work_order_id, customer_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 5
    category: state
    check: "Target entity in a valid from-state for the requested transition (incl. terminal lockdown, SUPERSEDED designs, and OCC-guarded creation's state preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Safety/compliance gates, in this sub-order where several apply: (a) verify: X-User-ID != performed_by_user_id (ERR_SEGREGATION_OF_DUTIES); (b) FLIGHT test create: at least one GROUND test PASSED on same work order (ERR_GROUND_TEST_REQUIRED); (c) W&B accept: cg_within_limits == true (ERR_CG_OUT_OF_LIMITS); (d) complete: tests passed (ERR_TESTS_NOT_PASSED), then regulatory approved (ERR_REGULATORY_NOT_APPROVED), then W&B accepted (ERR_WB_NOT_ACCEPTED)"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_GROUND_TEST_REQUIRED | ERR_CG_OUT_OF_LIMITS | ERR_TESTS_NOT_PASSED | ERR_REGULATORY_NOT_APPROVED | ERR_WB_NOT_ACCEPTED"
    http_status: "403 | 409 | 422 | 409 | 409 | 409"
    applies_to: "verify, test-events create, weight-balance-revisions accept, work-orders complete"

  - priority: 7
    category: business_temporal
    check: "Temporal conflicts: bay window half-open overlap on same bay_code (ERR_BAY_WINDOW_CONFLICT); flight window 60-minute buffer exclusion on same aircraft (ERR_FLIGHT_WINDOW_CONFLICT); completion overage >= 5 days without customer acknowledgement (ERR_DOWNTIME_OVERAGE_UNACKED)"
    error_id: "ERR_BAY_WINDOW_CONFLICT | ERR_FLIGHT_WINDOW_CONFLICT | ERR_DOWNTIME_OVERAGE_UNACKED"
    http_status: 409
    applies_to: "work-orders create, test-events create/reschedule, work-orders complete"

  - priority: 8
    category: business_referential
    check: "Cross-reference lineage: submit-quote requires a non-SUPERSEDED PanelDesign (ERR_NO_PANEL_DESIGN); manual EquipmentOrder create requires WorkOrder.status IN {APPROVED, PARTS_PENDING} (ERR_WORK_ORDER_NOT_APPROVED)"
    error_id: "ERR_NO_PANEL_DESIGN | ERR_WORK_ORDER_NOT_APPROVED"
    http_status: 409
    applies_to: "submit-quote, equipment-orders create"

  - priority: 9
    category: business_constraint
    check: "Uniqueness and capacity: tail_number unique (ERR_DUPLICATE_TAIL_NUMBER); one open work order per aircraft — Aircraft.status must be AVAILABLE at create (ERR_AIRCRAFT_BUSY); one RegulatoryPackage per work order (ERR_PACKAGE_ALREADY_EXISTS); reschedule while attempt < 3 (ERR_TEST_ATTEMPT_LIMIT); begin-installation with parts_pending_count == 0 (ERR_PARTS_PENDING); begin-testing with >= 1 VERIFIED task (ERR_NO_INSTALL_TASKS) and tasks_unverified_count == 0 (ERR_TASKS_UNVERIFIED)"
    error_id: "ERR_DUPLICATE_TAIL_NUMBER | ERR_AIRCRAFT_BUSY | ERR_PACKAGE_ALREADY_EXISTS | ERR_TEST_ATTEMPT_LIMIT | ERR_PARTS_PENDING | ERR_NO_INSTALL_TASKS | ERR_TASKS_UNVERIFIED"
    http_status: 409
    applies_to: "aircraft create, work-orders create, regulatory-packages create, test-events reschedule, begin-installation, begin-testing"

  - priority: 10
    category: business_fiscal
    check: "Change-order budget: creating a MANUAL EquipmentOrder whose extended price pushes committed parts spend (sum of quantity*unit_price_cents over non-CANCELLED orders of the work order, including the new one) beyond max(110% of the APPROVED design's equipment subtotal, CHANGE_ORDER_FLOOR_CENTS = 250000) is rejected"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "equipment-orders create (MANUAL only)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any set) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/avionics/customers"
    description: "Register a customer"
    roles: [ShopManager]
    code: 201
    input: [name, contact_email, "customer_kind?"]
    output: Customer
    side_effects: ["customer_kind defaults to INDIVIDUAL"]

  - method: GET
    path: "/avionics/customers/{customerId}"
    description: "Get a customer by id"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Aircraft ---
  - method: POST
    path: "/avionics/aircraft"
    description: "Register an aircraft for a customer"
    roles: [ShopManager]
    code: 201
    input: [customer_id, tail_number, make_model, baseline_empty_weight_lb, baseline_arm_in, cg_min_arm_in, cg_max_arm_in]
    output: Aircraft
    side_effects: ["baseline_moment_lb_in computed; status = AVAILABLE"]

  - method: GET
    path: "/avionics/aircraft/{aircraftId}"
    description: "Get an aircraft by id"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  - method: GET
    path: "/avionics/aircraft"
    description: "List aircraft, optionally filtered by customer; sorted by created_at ASC"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Aircraft[]
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/avionics/work-orders"
    description: "Open a work order (bay window reserved at creation)"
    roles: [ShopManager]
    code: 201
    input: [aircraft_id, scope_description, estimated_downtime_days, quoted_labor_hours, bay_code, bay_window_start, bay_window_end, "warranty_term_months?", "software_subscription_months?"]
    output: WorkOrder
    side_effects:
      - "Aircraft AVAILABLE -> IN_SHOP"
      - "bay half-open overlap check against other non-terminal work orders with same bay_code"
      - "status = DRAFT; derived counts zero"

  - method: GET
    path: "/avionics/work-orders/{workOrderId}"
    description: "Get a work order by id"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/avionics/work-orders"
    description: "List work orders, optionally filtered by aircraft and/or status; sorted by created_at ASC"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: ["aircraft_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/avionics/work-orders/{workOrderId}/submit-quote"
    description: "Submit quote to customer; computes quoted_total_cents from latest design"
    roles: [ShopManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["DRAFT -> PENDING_APPROVAL; quote_total computed; version +1"]

  - method: POST
    path: "/avionics/work-orders/{workOrderId}/begin-installation"
    description: "Induct aircraft and start installation; requires all parts received/cancelled"
    roles: [ShopManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["APPROVED|PARTS_PENDING -> INSTALLATION; inducted_at = clock; version +1"]

  - method: POST
    path: "/avionics/work-orders/{workOrderId}/begin-testing"
    description: "Move to testing; requires all tasks verified"
    roles: [ShopManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["INSTALLATION -> TESTING; version +1"]

  - method: POST
    path: "/avionics/work-orders/{workOrderId}/complete"
    description: "Complete the work order after all closeout gates; computes downtime and warranty dates"
    roles: [ShopManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "TESTING -> COMPLETED; completed_at = clock"
      - "actual_downtime_days, downtime_overage_days, warranty_expires_at, subscription_expires_at computed"
      - "Aircraft IN_SHOP -> AVAILABLE; version +1"

  - method: POST
    path: "/avionics/work-orders/{workOrderId}/cancel"
    description: "Cancel a non-terminal work order; cascades to children"
    roles: [ShopManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["-> CANCELLED; orders CANCELLED; tasks VOIDED; tests CANCELLED; draft designs SUPERSEDED; Aircraft AVAILABLE; version +1"]

  - method: POST
    path: "/avionics/work-orders/{workOrderId}/acknowledge-overage"
    description: "Customer acknowledges the job may exceed the estimated downtime"
    roles: [Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["overage_acknowledged = true; version +1"]

  # --- PanelDesign ---
  - method: POST
    path: "/avionics/panel-designs"
    description: "Create a panel design revision (OCC-guarded; supersedes prior non-terminal revision)"
    roles: [ShopManager]
    code: 201
    input: [work_order_id, expected_work_order_version, layout_notes, equipment_list]
    output: PanelDesign
    side_effects:
      - "OCC: expected_work_order_version must equal WorkOrder.version (ERR_STALE_VERSION 412)"
      - "WorkOrder.status must be DRAFT or PENDING_APPROVAL (ERR_INVALID_STATE)"
      - "Prior PanelDesigns in DRAFT/SUBMITTED/CHANGES_REQUESTED -> SUPERSEDED"
      - "revision = prior count + 1; total_added_weight_lb computed"
      - "increments WorkOrder.version by 1"

  - method: GET
    path: "/avionics/panel-designs/{panelDesignId}"
    description: "Get a panel design by id"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: []
    output: PanelDesign
    side_effects: []

  - method: GET
    path: "/avionics/panel-designs"
    description: "List panel designs, optionally filtered by work order and/or status; sorted by created_at ASC"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: ["work_order_id?", "status?", "limit?", "offset?"]
    output: PanelDesign[]
    side_effects: []

  - method: POST
    path: "/avionics/panel-designs/{panelDesignId}/submit"
    description: "Submit design for customer review"
    roles: [ShopManager]
    code: 200
    input: []
    output: PanelDesign
    side_effects: ["DRAFT -> SUBMITTED"]

  - method: POST
    path: "/avionics/panel-designs/{panelDesignId}/decide"
    description: "Customer decision on a submitted design"
    roles: [Customer]
    code: 200
    input: [outcome]
    output: PanelDesign
    side_effects:
      - "outcome=APPROVE: SUBMITTED -> APPROVED; cascades WorkOrder approval + DESIGN_RELEASE equipment order creation"
      - "outcome=REQUEST_CHANGES: SUBMITTED -> CHANGES_REQUESTED"

  # --- EquipmentOrder ---
  - method: POST
    path: "/avionics/equipment-orders"
    description: "Manually add a change-order equipment line"
    roles: [ShopManager]
    code: 201
    input: [work_order_id, part_number, description, quantity, unit_price_cents, lead_time_days]
    output: EquipmentOrder
    side_effects:
      - "source = MANUAL; status = PLANNED; seq assigned"
      - "WorkOrder APPROVED -> PARTS_PENDING if it was APPROVED; parts_pending_count recomputed"
      - "budget check: committed parts spend <= max(110% of approved design equipment subtotal, 250000 cents) (ERR_BUDGET_EXCEEDED)"

  - method: GET
    path: "/avionics/equipment-orders/{equipmentOrderId}"
    description: "Get an equipment order by id"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects: []

  - method: GET
    path: "/avionics/equipment-orders"
    description: "List equipment orders, optionally filtered by work order and/or status; sorted by created_at ASC then seq ASC"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: ["work_order_id?", "status?", "limit?", "offset?"]
    output: EquipmentOrder[]
    side_effects: []

  - method: POST
    path: "/avionics/equipment-orders/{equipmentOrderId}/mark-ordered"
    description: "Mark the order placed with the vendor"
    roles: [ShopManager]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects: ["PLANNED -> ORDERED; ordered_at = clock; promised_date computed"]

  - method: POST
    path: "/avionics/equipment-orders/{equipmentOrderId}/receive"
    description: "Receive the parts"
    roles: [ShopManager]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects: ["ORDERED -> RECEIVED; received_at = clock; is_late computed; parts_pending_count recomputed"]

  - method: POST
    path: "/avionics/equipment-orders/{equipmentOrderId}/cancel"
    description: "Cancel an un-received order"
    roles: [ShopManager]
    code: 200
    input: []
    output: EquipmentOrder
    side_effects: ["PLANNED|ORDERED -> CANCELLED; parts_pending_count recomputed"]

  # --- InstallTask ---
  - method: POST
    path: "/avionics/install-tasks"
    description: "Add a labor task (harness fabrication, panel assembly, or installation)"
    roles: [ShopManager]
    code: 201
    input: [work_order_id, task_kind, description, estimated_hours]
    output: InstallTask
    side_effects: ["status = PLANNED; tasks_unverified_count recomputed; WorkOrder.status must be APPROVED|PARTS_PENDING|INSTALLATION (ERR_INVALID_STATE)"]

  - method: GET
    path: "/avionics/install-tasks/{installTaskId}"
    description: "Get an install task by id"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: []
    output: InstallTask
    side_effects: []

  - method: GET
    path: "/avionics/install-tasks"
    description: "List install tasks, optionally filtered by work order and/or status; sorted by created_at ASC"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: ["work_order_id?", "status?", "limit?", "offset?"]
    output: InstallTask[]
    side_effects: []

  - method: POST
    path: "/avionics/install-tasks/{installTaskId}/start"
    description: "Technician starts the task"
    roles: [Technician]
    code: 200
    input: []
    output: InstallTask
    side_effects: ["PLANNED -> IN_PROGRESS"]

  - method: POST
    path: "/avionics/install-tasks/{installTaskId}/complete"
    description: "Technician records actual hours and completes the task"
    roles: [Technician]
    code: 200
    input: [actual_hours]
    output: InstallTask
    side_effects: ["IN_PROGRESS -> COMPLETED; actual_hours recorded; performed_by_user_id = X-User-ID; WorkOrder totals recomputed"]

  - method: POST
    path: "/avionics/install-tasks/{installTaskId}/verify"
    description: "Inspector verifies completed work (may not be the performer)"
    roles: [Inspector]
    code: 200
    input: []
    output: InstallTask
    side_effects: ["COMPLETED -> VERIFIED; billed_labor_cents computed via labor_billing; WorkOrder totals recomputed"]

  - method: POST
    path: "/avionics/install-tasks/{installTaskId}/void"
    description: "Void a non-verified task (compensating action)"
    roles: [ShopManager]
    code: 200
    input: []
    output: InstallTask
    side_effects: ["PLANNED|IN_PROGRESS|COMPLETED -> VOIDED; WorkOrder derived fields recomputed"]

  # --- TestEvent ---
  - method: POST
    path: "/avionics/test-events"
    description: "Schedule a ground or flight test"
    roles: [ShopManager]
    code: 201
    input: [work_order_id, test_kind, scheduled_start, scheduled_end]
    output: TestEvent
    side_effects:
      - "WorkOrder.status must be TESTING (ERR_INVALID_STATE)"
      - "FLIGHT requires a PASSED GROUND test on the same work order (ERR_GROUND_TEST_REQUIRED)"
      - "FLIGHT window must not intersect another SCHEDULED/FAILED flight's [start-60min, end+60min) buffered window on the same aircraft (ERR_FLIGHT_WINDOW_CONFLICT)"
      - "status = SCHEDULED; attempt = 1; result = NONE"

  - method: GET
    path: "/avionics/test-events/{testEventId}"
    description: "Get a test event by id"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: []
    output: TestEvent
    side_effects: []

  - method: GET
    path: "/avionics/test-events"
    description: "List test events, optionally filtered by work order and/or kind; sorted by created_at ASC"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: ["work_order_id?", "test_kind?", "limit?", "offset?"]
    output: TestEvent[]
    side_effects: []

  - method: POST
    path: "/avionics/test-events/{testEventId}/record-result"
    description: "Inspector records PASS/FAIL"
    roles: [Inspector]
    code: 200
    input: [result]
    output: TestEvent
    side_effects: ["SCHEDULED -> PASSED|FAILED; FLIGHT FAIL triggers rework cascade (verified tasks -> IN_PROGRESS, WorkOrder regresses to INSTALLATION)"]

  - method: POST
    path: "/avionics/test-events/{testEventId}/reschedule"
    description: "Reschedule a failed test (retest), up to 3 attempts"
    roles: [ShopManager]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: TestEvent
    side_effects: ["FAILED -> SCHEDULED; attempt += 1; result = NONE; buffer conflict check for FLIGHT"]

  # --- RegulatoryPackage ---
  - method: POST
    path: "/avionics/regulatory-packages"
    description: "Create the STC or field-approval documentation package (one per work order)"
    roles: [ShopManager]
    code: 201
    input: [work_order_id, approval_path, "stc_number?"]
    output: RegulatoryPackage
    side_effects: ["WorkOrder.status must be one of PENDING_APPROVAL|APPROVED|PARTS_PENDING|INSTALLATION|TESTING (ERR_INVALID_STATE); status = DRAFT"]

  - method: GET
    path: "/avionics/regulatory-packages/{regulatoryPackageId}"
    description: "Get a regulatory package by id"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: []
    output: RegulatoryPackage
    side_effects: []

  - method: GET
    path: "/avionics/regulatory-packages"
    description: "List regulatory packages, optionally filtered by work order; sorted by created_at ASC"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: ["work_order_id?", "limit?", "offset?"]
    output: RegulatoryPackage[]
    side_effects: []

  - method: POST
    path: "/avionics/regulatory-packages/{regulatoryPackageId}/submit"
    description: "Submit package: STC -> conformity review; FIELD_APPROVAL -> FAA"
    roles: [ShopManager]
    code: 200
    input: []
    output: RegulatoryPackage
    side_effects: ["DRAFT -> CONFORMITY_REVIEW (STC) or FAA_SUBMITTED (FIELD_APPROVAL, mints faa_tracking_number)"]

  - method: POST
    path: "/avionics/regulatory-packages/{regulatoryPackageId}/record-decision"
    description: "Inspector records APPROVED/REJECTED; rejection loops back to DRAFT"
    roles: [Inspector]
    code: 200
    input: [decision]
    output: RegulatoryPackage
    side_effects: ["CONFORMITY_REVIEW|FAA_SUBMITTED -> APPROVED or -> DRAFT"]

  # --- WeightBalanceRevision ---
  - method: POST
    path: "/avionics/weight-balance-revisions"
    description: "Compute a weight & balance revision (INCREMENTAL or FULL_REWEIGH)"
    roles: [ShopManager]
    code: 201
    input: [work_order_id, method, "added_items?", "removed_weight_lb?", "removed_arm_in?"]
    output: WeightBalanceRevision
    side_effects: ["WorkOrder.status must be INSTALLATION or TESTING (ERR_INVALID_STATE); new_empty_weight_lb, new_moment_lb_in, new_arm_in, cg_within_limits computed; status = COMPUTED"]

  - method: GET
    path: "/avionics/weight-balance-revisions/{weightBalanceRevisionId}"
    description: "Get a W&B revision by id"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: []
    output: WeightBalanceRevision
    side_effects: []

  - method: GET
    path: "/avionics/weight-balance-revisions"
    description: "List W&B revisions, optionally filtered by work order; sorted by created_at ASC"
    roles: [ShopManager, Technician, Inspector, Customer]
    code: 200
    input: ["work_order_id?", "limit?", "offset?"]
    output: WeightBalanceRevision[]
    side_effects: []

  - method: POST
    path: "/avionics/weight-balance-revisions/{weightBalanceRevisionId}/accept"
    description: "Inspector accepts a W&B revision within CG limits; supersedes prior ACCEPTED"
    roles: [Inspector]
    code: 200
    input: []
    output: WeightBalanceRevision
    side_effects: ["COMPUTED -> ACCEPTED; prior ACCEPTED -> SUPERSEDED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or Customer-role actor does not own the target work order's aircraft" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid type/enum, non-positive money/hours, or end <= start on any time window" }
  - { id: ERR_STC_NUMBER_REQUIRED, http: 400, condition: "approval_path == STC but stc_number absent" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK target does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition (incl. terminal lockdown, superseded design, scope locked after approval)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_work_order_version does not match WorkOrder.version on panel-design create" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Inspector verifying a task whose performed_by_user_id equals the inspector's X-User-ID" }
  - { id: ERR_GROUND_TEST_REQUIRED, http: 409, condition: "FLIGHT test created while no GROUND test with status PASSED exists for the same work order" }
  - { id: ERR_CG_OUT_OF_LIMITS, http: 422, condition: "Accepting a W&B revision whose new_arm_in falls outside the aircraft CG envelope" }
  - { id: ERR_TESTS_NOT_PASSED, http: 409, condition: "Completion without at least one PASSED GROUND and one PASSED FLIGHT test" }
  - { id: ERR_REGULATORY_NOT_APPROVED, http: 409, condition: "Completion without an APPROVED RegulatoryPackage" }
  - { id: ERR_WB_NOT_ACCEPTED, http: 409, condition: "Completion without an ACCEPTED WeightBalanceRevision" }
  - { id: ERR_BAY_WINDOW_CONFLICT, http: 409, condition: "Bay window half-open overlap with another non-terminal work order on the same bay_code" }
  - { id: ERR_FLIGHT_WINDOW_CONFLICT, http: 409, condition: "Flight window intersects another SCHEDULED/FAILED flight's 60-minute buffered window on the same aircraft" }
  - { id: ERR_DOWNTIME_OVERAGE_UNACKED, http: 409, condition: "Completion with downtime overage >= 5 days and overage_acknowledged == false" }
  - { id: ERR_NO_PANEL_DESIGN, http: 409, condition: "submit-quote with no non-SUPERSEDED PanelDesign" }
  - { id: ERR_WORK_ORDER_NOT_APPROVED, http: 409, condition: "Manual equipment order while WorkOrder.status not in {APPROVED, PARTS_PENDING}" }
  - { id: ERR_DUPLICATE_TAIL_NUMBER, http: 409, condition: "Aircraft created with an already-registered tail_number" }
  - { id: ERR_AIRCRAFT_BUSY, http: 409, condition: "Work order created for an aircraft that already has a non-terminal work order" }
  - { id: ERR_PACKAGE_ALREADY_EXISTS, http: 409, condition: "Second RegulatoryPackage created for the same work order" }
  - { id: ERR_TEST_ATTEMPT_LIMIT, http: 409, condition: "Reschedule when attempt == 3" }
  - { id: ERR_PARTS_PENDING, http: 409, condition: "begin-installation while parts_pending_count > 0" }
  - { id: ERR_TASKS_UNVERIFIED, http: 409, condition: "begin-testing while tasks_unverified_count > 0" }
  - { id: ERR_NO_INSTALL_TASKS, http: 409, condition: "begin-testing with no VERIFIED install task at all" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "Manual equipment order would push committed parts spend beyond max(110% of the approved design's equipment subtotal, 250000 cents)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Avionics shop manager — owns quoting, procurement, scheduling, and closeout administration"
    identity: opaque
    exclusive_operations:
      - "POST /avionics/customers, /avionics/aircraft, /avionics/work-orders"
      - "POST /avionics/work-orders/{id}/submit-quote|begin-installation|begin-testing|complete|cancel"
      - "POST /avionics/panel-designs, /avionics/panel-designs/{id}/submit"
      - "POST /avionics/equipment-orders (+ mark-ordered, receive, cancel)"
      - "POST /avionics/install-tasks, /avionics/install-tasks/{id}/void"
      - "POST /avionics/test-events, /avionics/test-events/{id}/reschedule"
      - "POST /avionics/regulatory-packages (+ submit)"
      - "POST /avionics/weight-balance-revisions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET / list endpoints"

  - name: Technician
    description: "A&P mechanic performing harness fabrication and installation labor"
    identity: opaque
    exclusive_operations:
      - "POST /avionics/install-tasks/{id}/start"
      - "POST /avionics/install-tasks/{id}/complete (records performed_by_user_id = X-User-ID)"
    shared_operations:
      - "All GET / list endpoints"

  - name: Inspector
    description: "IA-holder inspector — conformity, test results, W&B acceptance; must not verify work they performed"
    identity: opaque
    exclusive_operations:
      - "POST /avionics/install-tasks/{id}/verify (rejected when X-User-ID == performed_by_user_id)"
      - "POST /avionics/test-events/{id}/record-result"
      - "POST /avionics/regulatory-packages/{id}/record-decision"
      - "POST /avionics/weight-balance-revisions/{id}/accept"
    shared_operations:
      - "All GET / list endpoints"

  - name: Customer
    description: "Aircraft owner — approves panel designs and acknowledges downtime overages for their own aircraft"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /avionics/panel-designs/{id}/decide (only when X-User-ID owns the work order's aircraft)"
      - "POST /avionics/work-orders/{id}/acknowledge-overage (same ownership rule)"
    shared_operations:
      - "All GET / list endpoints"
