          assert:
            - "FiberReceipt.${rcpt_id}.net_tons == 36.00 AND weighted_contamination_pct == 2.73"
            - "the ${pb_over} start returned HTTP 409 with data.error_id == \"ERR_INSUFFICIENT_FIBER\" and left PulpBatch.${pb_over}.status == QUEUED"
            - "after the failed start FiberInventoryLot.${lot_id}.tons_consumed == 0.000 AND status == AVAILABLE"
