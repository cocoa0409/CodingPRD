            - call: "POST /retention-boxes/${box1}/purge"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_BOX_NOT_STORED (state priority 5 wins over business_safety priority 6)"

      - name: purge_safety_vs_temporal_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.RetentionBox.STORED_to_DESTROYED
        distinguishing_aspect: "On /purge, a STORED box that has an ACTIVE hold (business_safety, priority 6) AND an unelapsed retention schedule (business_temporal, priority 8) fails with ERR_SUBJECT_ON_HOLD — a different category pair (safety vs temporal) than the state-vs-safety conflict."
        test_recipe:
          setup:
            - "ACTIVE account at period 0; box shelved STORED with destroy_after_period 5 (not elapsed); ACTIVE hold on the box"
          setup_api_calls:
            - call: "POST /accounts"
