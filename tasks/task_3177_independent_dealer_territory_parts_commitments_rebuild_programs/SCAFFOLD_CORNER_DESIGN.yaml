            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
            - call: "POST /dealer-network/dealer-agreements/${ag_id}/activate"
              payload: {}
              as: DealerNetworkManager
            - call: "GET /dealer-network/dealer-agreements/${ag_id}"
              payload: {}
              as: DealerNetworkManager
              captures: { ag_v: $.data.version }
            - call: "POST /dealer-network/parts-order-batches"
              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 10, core_units: 0, core_return_required: false, requested_at: "2026-08-28T00:00:00Z" }
              as: PartsManager
              captures: { bt_id: $.data.id }
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/place-order"
              payload: {}
              as: PartsManager
            - call: "POST /dealer-network/dealer-agreements"
              payload: { dealer_id: "${d_id}", product_family: "EARTHMOVING", territory_code: "T-410", exclusivity_level: "SHARED", start_at: "2026-09-01T00:00:00Z", end_at: "2027-09-01T00:00:00Z", performance_plan_share_pct: 15, expected_dealer_version: "${d_v2}" }
              as: DealerNetworkManager
              captures: { ag_draft: $.data.id }
          trigger:
            - call: "POST /dealer-network/dealer-agreements/${ag_draft}/terminate"
              payload: {}
              as: DealerNetworkManager
              captures: { err_draft: $.data.error_id }
            - call: "POST /dealer-network/dealer-agreements/${ag_id}/terminate"
              payload: {}
              as: DealerNetworkManager
              captures: { err_open: $.data.error_id }
          assert:
            - "the terminate from DRAFT returns 409 with err_draft == ERR_INVALID_STATE"
            - "the terminate from ACTIVE returns 409 with err_open == ERR_AGREEMENT_COMMITMENT_OPEN"
            - "DealerAgreement.${ag_id}.status is still ACTIVE"
            - "the two calls produce two different error ids from the same endpoint"

      - name: credit_already_applied_blocks_the_core_credit_suspension
        claim_type: Violation to Error
        grounds:
          - errors.ERR_CREDIT_ALREADY_APPLIED
          - state_machines.PartsCommitment.ORDER_READY_to_CORE_PENDING
          - endpoints.POST_/dealer-network/parts-commitments/{id}/suspend-core-credit
        distinguishing_aspect: "The suspension is refused once the commitment already carries a credit balance, so 409 ERR_CREDIT_ALREADY_APPLIED is raised before the state precondition is even reached, and no SERVICE_ORDER escalation fires."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The T-410 commitment is ORDER_READY with a RECEIVED batch that has already brought 3220 cents of credit onto the balance."
          setup_api_calls:
            - *n_clock
