    roles: [Bookkeeper, FamilyMember, Superintendent]
    code: 200
    input: ["limit?", "offset?", "status?", "waiver_program_id?"]
    output: "WaiverApplication[]"
    side_effects: []
  - method: GET
    path: "/student-accounts/{id}/waiver-applications/{applicationId}"
    description: "Get a waiver application"
    roles: [Bookkeeper, FamilyMember, Superintendent]
    code: 200
    input: []
    output: WaiverApplication
    side_effects: []
  - method: POST
    path: "/student-accounts/{id}/waiver-applications/{applicationId}/approve"
    description: "Approve application (OCC-guarded; runs waiver stacking)"
    roles: [Bookkeeper]
    code: 200
    input: [expected_account_version]
    output: WaiverApplication
    side_effects: ["waiver_stacking final run", "assessments possibly → WAIVED", "account recompute", "increments StudentAccount.version by 1"]
  - method: POST
    path: "/student-accounts/{id}/waiver-applications/{applicationId}/deny"
    description: "Deny application"
