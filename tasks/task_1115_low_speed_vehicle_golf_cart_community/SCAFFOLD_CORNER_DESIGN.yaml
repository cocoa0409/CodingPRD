      - name: route_pass_on_decommissioned_route_rejected
        claim_type: conditional_action
        grounds: [state_machines.Route.DESIGNATED_to_DECOMMISSIONED, "errors[ERR_ROUTE_NOT_DESIGNATED]"]
        distinguishing_aspect: "Booking is allowed only while the route is DESIGNATED; after decommission the same request fails ERR_ROUTE_NOT_DESIGNATED 422 (referential gate on the route's state)."
        test_recipe:
          setup: ["ACTIVE registration; route created then decommissioned by CommunityAdmin"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-DEC", fleet_program_enabled: true }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H DEC", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/vehicles", payload: { holder_id: "${h_id}", vehicle_type: "LSV", seat_count: 6, has_headlights: true, has_brake_lights: true, has_turn_signals: true, has_horn: true, has_windshield: true, has_seatbelts: true, has_reflectors: true, mirror_count: 2 }, as: PermitHolder, as_user_id: "${h_id}", captures: { v_id: $.data.id } }
            - { call: "POST /api/registrations", payload: { vehicle_id: "${v_id}", holder_id: "${h_id}", registration_year: 2026 }, as: PermitHolder, as_user_id: "${h_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /api/inspections", payload: { registration_id: "${reg_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: Inspector, captures: { ins_id: $.data.id } }
            - { call: "POST /api/inspections/${ins_id}/finalize", payload: { headlights_score: 90, brake_lights_score: 90, turn_signals_score: 90, horn_score: 90, mirrors_score: 90, windshield_score: 90, seatbelts_score: 90, reflectors_score: 90 }, as: Inspector }
            - { call: "POST /api/insurance-policies", payload: { holder_id: "${h_id}", vehicle_id: "${v_id}", provider_name: "P", policy_number: "N-DEC", liability_coverage_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/registrations/${reg_id}/activate", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "POST /api/routes", payload: { community_id: "${comm_id}", name: "R-DEC", route_type: "STREET", allowed_vehicle_class: "LSV_ALLOWED" }, as: CommunityAdmin, captures: { rt_id: $.data.id } }
            - { call: "POST /api/routes/${rt_id}/decommission", payload: {}, as: CommunityAdmin }
          trigger:
            - { call: "POST /api/route-passes", payload: { route_id: "${rt_id}", registration_id: "${reg_id}", holder_id: "${h_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ROUTE_NOT_DESIGNATED with http 422"

  # ===========================================================================
  - section: errors
    instances:
      - name: checkout_second_dispatch_fleet_unavailable
        claim_type: violation_to_error
        grounds: ["errors[ERR_FLEET_UNAVAILABLE]", state_machines.FleetVehicle.AVAILABLE_to_CHECKED_OUT]
        distinguishing_aspect: "ERR_FLEET_UNAVAILABLE trigger: a second dispatch whose shift has begun cannot check out while the vehicle is CHECKED_OUT by the first — even though both windows are disjoint and both dispatches are otherwise valid."
        test_recipe:
          setup: ["D1 [09:00-12:00] and D2 [13:00-15:00] booked on the same vehicle; D1 checked out at 10:00; clock 13:30"]
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-FU" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H FU", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-FU", slot_count: 1, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/fleet-vehicles", payload: { community_id: "${comm_id}", station_id: "${st_id}", label: "F-FU" }, as: CommunityAdmin, captures: { fv_id: $.data.id } }
