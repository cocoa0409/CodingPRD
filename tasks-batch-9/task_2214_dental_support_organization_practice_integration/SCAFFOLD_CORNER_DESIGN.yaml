        claim_type: Priority Ordering
        grounds:
          - validations[priority=31]
          - validations[priority=37]
        excluded_because:
          difficulty_instance: validation_priority_pair / cutover_window_conflict_beats_vendor_window_capacity
          rationale: "The named §1.8 instance schedules a window that both collides with a sibling window and exhausts vendor capacity, and asserts the priority 31 code."

