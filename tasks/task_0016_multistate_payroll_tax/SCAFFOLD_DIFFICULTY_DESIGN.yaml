            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_old: $.data.id }
            - call: "POST /w4-forms/${w4_old}/file"
              payload: {}
              as: HRClerk
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "MARRIED_JOINT", supersedes_w4_id: "${w4_old}" }
              as: HRClerk
              captures: { w4_new: $.data.id }
          trigger:
            - call: "POST /w4-forms/${w4_new}/file"
              payload: {}
              as: HRClerk
          assert:
            - "W4Form.${w4_new}.status == FILED"
            - "W4Form.${w4_old}.status == SUPERSEDED"

