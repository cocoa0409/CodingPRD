  - rule_id: transitive_cascade
    instances:
      - name: report_lost_sample_blocks_style_then_items_then_unlocks_session
        grounds:
          - state_machines.Sample.IN_STUDIO_to_LOST
          - state_machines.Style.SCHEDULED_to_BLOCKED
          - state_machines.ShotListItem.ASSIGNED_to_BLOCKED
          - state_machines.ShootSession.LOCKED_to_BOOKED
          - calculations.custody_ledger_counters
          - endpoints[POST /studio/samples/{sample_id}/report-lost]
        distinguishing_aspect: |
          One report-lost call propagates four levels from the Sample: L1 the Vendor ledger
          (outstanding 1 -> 0, strike 0 -> 1), L2 Style SCHEDULED -> BLOCKED, L3 its ASSIGNED
          shot-list item -> BLOCKED, L4 the LOCKED session that held that item reverts to BOOKED -
          and the sample's match axis is deliberately left MATCHED.
