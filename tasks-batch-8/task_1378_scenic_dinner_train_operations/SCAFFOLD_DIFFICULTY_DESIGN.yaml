            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "DIN-1", stock_type: "DINING_CAR", seat_capacity: 16, table_count: 4 }, as: Mechanic, captures: { din: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Regular Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${din}", class_code: "DINING", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Chef Ana", role: "CHEF", is_volunteer: false }, as: CrewManager, captures: { cm_k: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr One", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s1: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr Two", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s2: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_k}", position: "CHEF" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_s1}", position: "SERVER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_s2}", position: "SERVER" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "alice@x.com", class_code: "DINING", party_size: 1, dining_service: "EARLY" }, as: StationAgent, captures: { b_a: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b_a}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "bob@x.com", class_code: "DINING", party_size: 1, dining_service: "LATE" }, as: StationAgent, captures: { b_b: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b_b}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
          trigger:
            - { call: "GET /railroad/excursions/${ex}/provisioning-manifests", as: CateringManager, captures: { load: "$.data[0].galley_load_units", early: "$.data[0].early_diner_count", late: "$.data[0].late_diner_count" } }
          assert:
            - "${early} == 1 and ${late} == 1"
            - "pinned rounding order: ${load} == 8 (ceil(1*3*1.1) + ceil(1*3*1.1) = 4 + 4), NOT 7 (sum-then-ceil would give ceil(6.6))"

  # =========================================================================
  # Rule 3 - non_linear_state_machine: a true cycle on RollingStock vs
  # branching with divergent side-effect sets on Booking (different entities).
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rolling_stock_available_maintenance_cycle
        grounds:
          - state_machines.RollingStock
          - state_machines.MaintenanceWorkOrder
        distinguishing_aspect: |
          Cyclic shape on RollingStock: AVAILABLE -> IN_MAINTENANCE -> AVAILABLE via
          work-order START/COMPLETE, ending back in the exact initial state (a loop,
          not a pipeline).
        test_recipe:
          setup:
            - "One AVAILABLE coach car and one SCHEDULED work order on it (window 2026-10-20T09:00-11:00Z, far from any excursion)"
          setup_api_calls:
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-9", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { car: "$.data.id" } }
            - { call: "POST /railroad/work-orders", payload: { stock_id: "${car}", window_start: "2026-10-20T09:00:00Z", window_end: "2026-10-20T11:00:00Z", scope: "INSPECTION" }, as: Mechanic, captures: { wo: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/work-orders/${wo}/events", payload: { event_type: "START" }, as: Mechanic }
            - { call: "GET /railroad/rolling-stock/${car}", as: Mechanic, captures: { mid_status: "$.data.status" } }
            - { call: "POST /railroad/work-orders/${wo}/events", payload: { event_type: "COMPLETE" }, as: Mechanic }
            - { call: "GET /railroad/rolling-stock/${car}", as: Mechanic, captures: { end_status: "$.data.status", end_v: "$.data.version" } }
          assert:
            - "after START: ${mid_status} == IN_MAINTENANCE"
            - "after COMPLETE the loop closes: ${end_status} == AVAILABLE"
            - "MaintenanceWorkOrder.${wo}.status == COMPLETED"
            - "stock version advanced on each leg: ${end_v} == 3 (create v1, +1 START, +1 COMPLETE)"
      - name: booking_branching_divergent_terminal_paths
        grounds:
          - state_machines.Booking
        distinguishing_aspect: |
          Branching shape on Booking (different entity from RollingStock): two
          CONFIRMED bookings fork into CANCELLED (voluntary, refund 6000, no
          rain-check) vs RAIN_CHECKED (weather cascade, rain-check 6000, refund 0) -
          divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Published REGULAR excursion on 2026-10-15 with one COACH car (capacity 40)"
            - "Two CONFIRMED COACH bookings, party 1 each, paid 6000 each (clock at default 2026-08-01, far beyond the 48h refund line)"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Branch Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "b1@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { b1: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "b2@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { b2: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b2}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
          trigger:
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CANCEL" }, as: StationAgent, captures: { b1_status: "$.data.status", b1_refund: "$.data.refund_cents" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "CANCEL", cancel_reason: "WEATHER" }, as: OperationsManager }
            - { call: "GET /railroad/bookings/${b2}", as: StationAgent, captures: { b2_status: "$.data.status", b2_refund: "$.data.refund_cents" } }
            - { call: "GET /railroad/rain-checks?booking_id=${b2}", as: StationAgent, captures: { rc2_value: "$.data[0].value_cents", rc2_status: "$.data[0].status" } }
          assert:
            - "voluntary branch: ${b1_status} == CANCELLED and ${b1_refund} == 6000 (full refund, >= 48h before departure)"
            - "no rain-check exists for Booking.${b1} (GET /railroad/rain-checks?booking_id=${b1} returns an empty array)"
            - "weather branch: ${b2_status} == RAIN_CHECKED and ${b2_refund} == 0"
            - "rain-check issued for Booking.${b2}: ${rc2_value} == 6000, ${rc2_status} == ISSUED"

  # =========================================================================
  # Rule 4 - transitive_cascade: depth-4 chain from agreement TERMINATE vs
  # depth-2 chain from excursion CANCEL (different triggering transitions).
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: agreement_terminate_depth4_chain
        grounds:
          - state_machines.TrackRightsAgreement.ACTIVE_to_TERMINATED
          - state_machines.OperatingSlot.RESERVED_to_RELEASED
          - state_machines.Excursion.PUBLISHED_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_RAIN_CHECKED
        distinguishing_aspect: |
          Depth-4 chain triggered by agreement TERMINATE: slot RESERVED -> RELEASED
          causes the holding excursion -> CANCELLED (TRACK_RIGHTS_LOST), which causes
          its CONFIRMED booking -> RAIN_CHECKED, which causes a RainCheck to be
          created - each hop caused by the previous hop, not by the original call.
        test_recipe:
          setup:
            - "ACTIVE agreement with one slot RESERVED by a PUBLISHED REGULAR excursion (2026-10-15, coach capacity 40, full crew)"
            - "One CONFIRMED COACH booking, party 1, paid 6000"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Cascade Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "b1@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { b1: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
          trigger:
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "TERMINATE" }, as: OperationsManager }
            - { call: "GET /railroad/slots/${slot}", as: Scheduler, captures: { slot_status: "$.data.status" } }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_status: "$.data.status", ex_reason: "$.data.cancel_reason" } }
            - { call: "GET /railroad/bookings/${b1}", as: StationAgent, captures: { b1_status: "$.data.status" } }
            - { call: "GET /railroad/rain-checks?booking_id=${b1}", as: StationAgent, captures: { rc_value: "$.data[0].value_cents", rc_reason: "$.data[0].reason" } }
            - { call: "GET /railroad/crew-assignments?excursion_id=${ex}", as: CrewManager, captures: { ca_status: "$.data[0].status" } }
          assert:
            - "hop 1: slot ${slot} -> ${slot_status} == RELEASED"
            - "hop 2: excursion ${ex} -> ${ex_status} == CANCELLED with ${ex_reason} == TRACK_RIGHTS_LOST"
            - "hop 3: booking ${b1} -> ${b1_status} == RAIN_CHECKED"
            - "hop 4: rain-check created with ${rc_value} == 6000 and ${rc_reason} == TRACK_RIGHTS_LOST"
            - "crew assignments on the cancelled excursion released: ${ca_status} == RELEASED"
      - name: weather_cancel_depth2_chain
        grounds:
          - state_machines.Excursion.PUBLISHED_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_RAIN_CHECKED
          - state_machines.RainCheck
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (excursion CANCEL with WEATHER, not
          agreement TERMINATE): CANCEL causes CONFIRMED booking -> RAIN_CHECKED, and
          that booking transition itself causes a RainCheck to be minted; the slot
          returns to OPEN here (vs RELEASED under agreement termination).
        test_recipe:
          setup:
            - "PUBLISHED REGULAR excursion on 2026-10-15 with one CONFIRMED COACH booking (party 1, paid 6000)"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Weather Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "b1@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { b1: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
          trigger:
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "CANCEL", cancel_reason: "WEATHER" }, as: OperationsManager }
            - { call: "GET /railroad/bookings/${b1}", as: StationAgent, captures: { b1_status: "$.data.status" } }
            - { call: "GET /railroad/rain-checks?booking_id=${b1}", as: StationAgent, captures: { rc_value: "$.data[0].value_cents", rc_reason: "$.data[0].reason", rc_status: "$.data[0].status" } }
            - { call: "GET /railroad/slots/${slot}", as: Scheduler, captures: { slot_status: "$.data.status" } }
          assert:
            - "link 1: booking ${b1} -> ${b1_status} == RAIN_CHECKED"
            - "link 2 (caused by link 1): rain-check minted with ${rc_value} == 6000, ${rc_reason} == WEATHER, ${rc_status} == ISSUED"
            - "manual cancel returns the slot to the pool: ${slot_status} == OPEN (contrast with RELEASED under agreement termination)"

  # =========================================================================
  # Rule 5 - priority_pair_validation_conflict: (state vs business_fiscal) and
  # (business_constraint vs business_temporal) - different category pairs.
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_redeemed_confirm
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_RAIN_CHECK_INVALID]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the CONFIRM violates both the
          booking from-state (CANCELLED) and the rain-check fiscal rule (already
          REDEEMED); priority 4 state wins over priority 10 fiscal, so the error is
          ERR_INVALID_STATE, not ERR_RAIN_CHECK_INVALID.
        test_recipe:
          setup:
            - "Excursion A (2026-10-15) published, booking B0 confirmed (paid 6000), then excursion A weather-cancelled so RainCheck RC1 (6000, ISSUED) exists"
            - "Excursion B (2026-10-16, same stock/crew) published; booking B1 on B confirmed WITH RC1 (paid 0, RC1 -> REDEEMED), then B1 voluntarily cancelled"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot_a: "$.data.id" } }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-16", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot_b: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Run A", slot_id: "${slot_a}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex_a: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Run B", slot_id: "${slot_b}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex_b: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_a}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_a}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_b}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex_b}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
