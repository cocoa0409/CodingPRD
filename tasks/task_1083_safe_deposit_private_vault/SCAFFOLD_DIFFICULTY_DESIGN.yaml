  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_reverse_restores_balance
        grounds:
          - state_machines.Payment.INITIATED_to_CLEARED
          - state_machines.Payment.CLEARED_to_REVERSED
          - calculations.rental_balance_due
          - entities.Rental.fields.balance_due_cents
        distinguishing_aspect: |
          Conserved quantity = money (rental.balance_due_cents). Clearing a 24000 payment drives balance
          24000→0 and invoice→PAID; reversing it restores balance 0→24000 and invoice→OPEN. The forward
          and compensating actions leave net receivable unchanged.
        test_recipe:
          setup:
            - "Rental ACTIVE, first invoice 24000 OPEN, balance 24000; payment 24000 CLEARED → balance 0, invoice PAID."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Ledger", code: "LG1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "L-901" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Sam Cash", email: "sam@x.com", gov_id_ref: "G-20", date_of_birth: "1985-05-15" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/payments", payload: { rental_id: "${rental_id}", amount_cents: 24000, method: "WIRE" }, as: BillingClerk, captures: { pay_id: "$.data.id" } }
            - { call: "POST /vault/payments/${pay_id}/clear", payload: {}, as: BillingClerk }
          trigger:
            - { call: "POST /vault/payments/${pay_id}/reverse", payload: {}, as: VaultAdmin }
          assert:
            - "Rental(${rental_id}).balance_due_cents == 24000"
            - "Payment(${pay_id}).status == REVERSED"
            - "Invoice(rental=${rental_id}).status == OPEN"

      - name: activate_close_box_occupancy_conserved
        grounds:
          - state_machines.Rental.PENDING_to_ACTIVE
          - state_machines.Rental.SURRENDER_PENDING_to_CLOSED
          - state_machines.Box.DRILLED_to_AVAILABLE
          - entities.Box.fields.status
        distinguishing_aspect: |
          Conserved quantity = branch occupied-box count (a physical count, not money). activate takes the
          box AVAILABLE→RENTED (occupancy +1); the compensating close takes it back RENTED→AVAILABLE
          (occupancy -1), restoring the branch's RENTED-box count to its baseline of 0.
        test_recipe:
          setup:
            - "Rental created; box AVAILABLE (branch RENTED-box count == 0)."
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Ledger", code: "LG2", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "L-902" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Tia Loop", email: "tia@x.com", gov_id_ref: "G-21", date_of_birth: "1989-09-29" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/payments", payload: { rental_id: "${rental_id}", amount_cents: 24000, method: "WIRE" }, as: BillingClerk, captures: { pay_id: "$.data.id" } }
            - { call: "POST /vault/payments/${pay_id}/clear", payload: {}, as: BillingClerk }
            - { call: "POST /vault/rentals/${rental_id}/request-surrender", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/rentals/${rental_id}/close", payload: {}, as: VaultAdmin }
          assert:
            - "Box(${box_id}).status == AVAILABLE"
            - "Rental(${rental_id}).status == CLOSED"
            - "count(Box where branch_id==${branch_id} and status==RENTED) == 0"
