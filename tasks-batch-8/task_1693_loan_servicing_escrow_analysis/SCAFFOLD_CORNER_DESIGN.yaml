  - section: rbac
    instances:
      - name: role_denial_sampling_cannot_perform
        claim_type: role_denial
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]", roles]
        distinguishing_aspect: "Borrower cannot verify payees; EscrowAnalyst cannot resolve error cases; PayeeVerifier cannot create payees — each exclusive-operation denial returns ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
