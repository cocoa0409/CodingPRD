          - errors[ERR_REVIEW_NOT_FOUND]
          - errors[ERR_CHARGE_NOT_FOUND]
        distinguishing_aspect: "Existence failures are resource-specific rather than generic: the same unknown UUID yields ERR_ASSOCIATION_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_CONTRACTOR_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_CREDENTIAL_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_REVIEW_NOT_FOUND and ERR_CHARGE_NOT_FOUND on the nine corresponding single-resource reads."
