  - section: errors
    instances:
      - name: missing_x_user_headers_return_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "Authentication is checked before anything else: the same GET returns ERR_UNAUTHENTICATED (401) when X-User-ID is omitted and when X-User-Role is omitted, and an empty-string header is treated as missing rather than as an unknown role."
        test_recipe:
          setup:
            - "One carrier exists so the target id is real and the failure cannot be confused with a 404."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Argus Life", naic_code: "71027", am_best_rating: "A", statutory_surplus_usd: 500000000.00, domicile_state: "KS" }
              as: PlatformAdmin
              captures: { carrier_ag_id: $.data.id }
          trigger:
            - call: "GET /carriers/${carrier_ag_id}"
              payload: {}
              as: RiskOfficer
            - call: "GET /carriers/${carrier_ag_id}"
              payload: {}
              as: RiskOfficer
            - call: "GET /carriers/${carrier_ag_id}"
              payload: {}
              as: RiskOfficer
          assert:
            - "trigger call 1 is sent with the X-User-ID header omitted and returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "trigger call 2 is sent with the X-User-Role header omitted and returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "trigger call 3 is sent with X-User-ID set to the empty string and returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "every response carries response_type == error with a non-empty data.message"
            - "Carrier.${carrier_ag_id} is unchanged with version == 1"

      - name: unknown_ids_return_the_entity_specific_not_found_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PRODUCT_TYPE_NOT_FOUND]
          - errors[ERR_REVIEW_NOT_FOUND]
          - errors[ERR_REQUEST_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_ANALYSIS_NOT_FOUND]
          - errors[ERR_RECORD_NOT_FOUND]
          - errors[ERR_EMPLOYEE_NOT_FOUND]
        distinguishing_aspect: "Each entity family owns a distinct 404 error_id rather than sharing one generic code, and the catch-all ERR_RECORD_NOT_FOUND is reserved for the entities that have no dedicated code — consent records, valuations, allocations, liabilities, capital positions and risk assessments."
        test_recipe:
          setup:
            - "Empty database; every id below is a well-formed UUID that was never minted."
          setup_api_calls: []
          trigger:
            - call: "GET /product-types/11111111-1111-4111-8111-111111111111"
              payload: {}
