        distinguishing_aspect: "A protected write (POST /intake-batches) with no X-User-Role/X-User-ID -> 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["One ACTIVE agreement exists."]
          setup_api_calls:
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
