          setup:
            - "Site listed, two PARTICIPATING parties A 3960 t class II and B 40 t class IV, both VERIFIED."
            - "Round adopted on two ACCEPT ballots: A final_pct 99.28, B final_pct 0.72, allocated 100.00 / orphan 0.00 / settled 0.00."
