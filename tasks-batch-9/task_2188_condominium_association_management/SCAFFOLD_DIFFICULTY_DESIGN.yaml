  # =====================================================================
  # Rule 8 — Resource/temporal overlap (distinct semantics, distinct resources)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: element_outage_closed_interval_with_24h_buffer_touching_the_buffer_edge_collides
        grounds:
          - validations[priority=29]  # ERR_ELEMENT_WINDOW_CONFLICT
          - endpoints[POST /work-orders]
          - entities.Association.fields.element_window_buffer_hours
          - entities.MaintenanceWorkOrder.fields.window_start
          - concurrency_rules[work-order-create-stale-contract]
        distinguishing_aspect: |
          RESOURCE: CommonElement (outage exclusivity). SEMANTICS: CLOSED interval with a
          symmetric element_window_buffer_hours = 24 buffer applied to BOTH ends, so TOUCHING the
          buffered edge COLLIDES. Against an existing window 2026-10-05T08:00:00Z ..
          2026-10-07T18:00:00Z the forbidden band is [2026-10-04T08:00:00Z, 2026-10-08T18:00:00Z]
          inclusive at both ends: a new window starting at exactly 2026-10-08T18:00:00Z is
          REJECTED and one starting a single second later is ACCEPTED; a new window ending at
          exactly 2026-10-04T08:00:00Z is REJECTED and one ending a second earlier is ACCEPTED.
          Only SCHEDULED / IN_PROGRESS / ON_HOLD orders occupy the element, so cancelling the
          incumbent frees the exact window that was just refused.
        test_recipe:
          setup:
            - "Association with default element_window_buffer_hours 24; three seated directors each owning a unit (3400 / 3300 / 3300 bp)."
            - "Two ROOF CommonElements, el1 and el2, each with its own ACTIVE VendorContract (cap 20000000, term 2026-09-01 to 2027-06-01, insurance_cert_expires_at 2027-06-01)."
            - "Incumbent work order wo1 on el1, SCHEDULED, window 2026-10-05T08:00:00Z to 2026-10-07T18:00:00Z, estimated_cost_cents 1000000."
            - "Clock sits at 2026-09-10T18:00:00Z, before every window, so no temporal start check can interfere."
            - "expected_contract_version is re-read before every creation attempt because each accepted work order bumps VendorContract.version."
