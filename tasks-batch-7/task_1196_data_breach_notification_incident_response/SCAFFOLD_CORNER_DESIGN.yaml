        distinguishing_aspect: "Excluding a subject (IDENTIFIED -> EXCLUDED) decrements incident.total_affected_subjects; derived field stays reconciled after update."
        test_recipe:
          setup: ["Incident with one IDENTIFIED AffectedSubject"]
          setup_api_calls:
            - call: "POST /incidents"
              payload: { title: "X", discovered_at: "2026-04-28T10:00:00Z", occurred_at: "2026-04-25T03:00:00Z", source_channel: "INTERNAL_DETECTION" }
