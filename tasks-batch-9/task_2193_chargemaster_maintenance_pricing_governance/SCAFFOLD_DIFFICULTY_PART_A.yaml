              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
              captures: { pinned_v: $.data.pinned_charge_item_version }
            - call: "POST /chargemaster/change-requests/${cr_id}/implement"
              payload: { implementation_note: "applied" }
              as: RevenueIntegrityAnalyst
              as_user_id: "u_ria_1"
          assert:
            - "Before the trigger: Facility.${fac_id}.aggregate_gross_charge_cents == 1128000 and Facility.${fac_id}.aggregate_cost_basis_cents == 1040000 and Facility.${fac_id}.aggregate_markup_ratio_bp == 10846"
            - "ChangeRequest.${cr_id}.projected_gross_charge_cents == 144000"
            - "ChangeRequest.${cr_id}.projected_markup_ratio_bp == 10947"
            - "ChangeRequest.${cr_id}.projected_markup_ratio_bp != 11724 (the naive live-aggregate order)"
            - "trigger[0] responds 200 (10947 <= 11000) and does NOT return ERR_AGGREGATE_MARKUP_LIMIT"
            - "ChangeRequest.${cr_id}.status == APPROVED after trigger[0]"
            - "ChangeRequest.${cr_id}.approved_by_user_id == u_pca_1 and ChangeRequest.${cr_id}.reviewed_by_user_id == u_ria_1 and ChangeRequest.${cr_id}.submitted_by_user_id == u_dm_sc"
            - "ChargeItem.${b_id}.price_status == REPRICE_PENDING after trigger[0]"
            - "ChangeRequest.${cr_id}.pinned_charge_item_version == ${b_v} + 1"
            - "trigger[1] responds 200 and ChangeRequest.${cr_id}.status == IMPLEMENTED"
            - "ChargeItem.${b_id}.cost_basis_cents == 45000 and ChargeItem.${b_id}.gross_charge_cents == 144000 and ChargeItem.${b_id}.prior_gross_charge_cents == 128000 and ChargeItem.${b_id}.price_status == PRICED_CURRENT"
            - "Facility.${fac_id}.aggregate_gross_charge_cents == 1144000 and Facility.${fac_id}.aggregate_cost_basis_cents == 1045000"
            - "Facility.${fac_id}.aggregate_markup_ratio_bp == 10947 (recomputed from the persisted items, matching the projection exactly)"

  - rule_id: boundary_precision_check
    instances:

      - name: boundary_precision_check__line_variance_bp_exactly_at_tolerance_100_on_reconcile
        grounds:
          - calculations.charge_capture_variance_summary
          - entities.CapturedCharge.fields.line_variance_bp
          - entities.CapturedCharge.fields.match_status
          - entities.ChargeCaptureBatch.fields.matched_line_count
          - entities.ChargeCaptureBatch.fields.exception_line_count
          - state_machines.ChargeCaptureBatch.INGESTED_to_RECONCILING
        distinguishing_aspect: |
          The metric under test is the per-line signed variance in basis points
          (VARIANCE_TOLERANCE_BP = 100) reached through POST
          /chargemaster/charge-capture-batches/{batch_id}/reconcile: with
          expected_charge_cents pinned at exactly 1000000 per line, a posted overage of
          10000 cents is exactly +100 bp and MUST be MATCHED, 10049 cents rounds
          half-up to 100 and is still MATCHED, and 10050 cents rounds half-up to 101 and
          becomes PRICE_VARIANCE — the same three-point split holds symmetrically on the
          negative side.
        test_recipe:
          setup:
            - "Logical clock left at the fixed startup default 2026-08-01T00:00:00Z."
            - "Facility BND with rounding_mode = NEAREST_CENT and aggregate_markup_limit_bp = 40000."
            - "Department IMAGING (manager_user_id = u_dm_img)."
            - "RevenueCode 0320 ACTIVE with an ACTIVE FLAT_FEE PriceRule flat_fee_cents = 1000000, min_medicare_multiple_bp = 12000, market_cap_multiple_bp = 11000."
            - "ChargeItem CDM-5000 with cost_basis_cents = 1000000, medicare_rate_cents = 100 (floor 120) and market_p75_cents = 10000000 (cap 11000000) so the flat fee survives both bounds; repriced to gross_charge_cents = 1000000 exactly and driven to ACTIVE. No companion item."
            - "One INGESTED ChargeCaptureBatch over the closed window 2026-06-01..2026-06-30 with five quantity-1 lines on CDM-5000 (expected_charge_cents 1000000 each) on distinct encounters, posted at 1010000, 1010049, 1010050, 990000 and 989950 cents."
          setup_api_calls:
            - call: "POST /chargemaster/facilities"
              payload: { name: "Boundary General", cms_certification_number: "CCN-2193-B", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Imaging", cost_center_code: "CC-320", manager_user_id: "u_dm_img" }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0320", description: "Radiology diagnostic", requires_hcpcs: false, allowed_code_types: ["CDM_INTERNAL", "REV_ONLY"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_id}", pricing_method: "FLAT_FEE", effective_from: "2026-08-01T00:00:00Z", flat_fee_cents: 1000000, min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc_id}", cdm_number: "CDM-5000", description: "CT ABDOMEN WITH CONTRAST", code_type: "CDM_INTERNAL", cost_basis_cents: 1000000, medicare_rate_cents: 100, market_p75_cents: 10000000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", window_start_date: "2026-06-01T00:00:00Z", window_end_date: "2026-06-30T00:00:00Z" }
              as: DepartmentManager
              as_user_id: "u_dm_img"
              captures: { batch_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-5000", encounter_id: "ENC-1", payer_code: "AETNA_COMM", service_datetime: "2026-06-02T08:00:00Z", quantity: 1, posted_charge_cents: 1010000 }
              as: DepartmentManager
              as_user_id: "u_dm_img"
              captures: { lb_on_pos_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-5000", encounter_id: "ENC-2", payer_code: "AETNA_COMM", service_datetime: "2026-06-03T08:00:00Z", quantity: 1, posted_charge_cents: 1010049 }
              as: DepartmentManager
              as_user_id: "u_dm_img"
              captures: { lb_eps_below_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-5000", encounter_id: "ENC-3", payer_code: "AETNA_COMM", service_datetime: "2026-06-04T08:00:00Z", quantity: 1, posted_charge_cents: 1010050 }
              as: DepartmentManager
              as_user_id: "u_dm_img"
              captures: { lb_eps_above_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-5000", encounter_id: "ENC-4", payer_code: "AETNA_COMM", service_datetime: "2026-06-05T08:00:00Z", quantity: 1, posted_charge_cents: 990000 }
              as: DepartmentManager
              as_user_id: "u_dm_img"
              captures: { lb_on_neg_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/lines"
              payload: { submitted_cdm_number: "CDM-5000", encounter_id: "ENC-5", payer_code: "AETNA_COMM", service_datetime: "2026-06-06T08:00:00Z", quantity: 1, posted_charge_cents: 989950 }
              as: DepartmentManager
              as_user_id: "u_dm_img"
              captures: { lb_eps_below_neg_id: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/reconcile"
              payload: {}
              as: RevenueIntegrityAnalyst
          assert:
            - "ChargeItem.${item_id}.gross_charge_cents == 1000000"
            - "CapturedCharge.${lb_on_pos_id}.line_variance_bp == 100 and CapturedCharge.${lb_on_pos_id}.match_status == MATCHED"
            - "CapturedCharge.${lb_eps_below_id}.line_variance_bp == 100 and CapturedCharge.${lb_eps_below_id}.match_status == MATCHED"
            - "CapturedCharge.${lb_eps_above_id}.line_variance_bp == 101 and CapturedCharge.${lb_eps_above_id}.match_status == PRICE_VARIANCE"
            - "CapturedCharge.${lb_on_neg_id}.line_variance_bp == -100 and CapturedCharge.${lb_on_neg_id}.match_status == MATCHED"
            - "CapturedCharge.${lb_eps_below_neg_id}.line_variance_bp == -101 and CapturedCharge.${lb_eps_below_neg_id}.match_status == PRICE_VARIANCE"
            - "ChargeCaptureBatch.${batch_id}.matched_line_count == 3"
            - "ChargeCaptureBatch.${batch_id}.exception_line_count == 2"
            - "ChargeCaptureBatch.${batch_id}.mean_line_variance_bp == 20"
            - "ChargeCaptureBatch.${batch_id}.total_expected_charge_cents == 5000000"
            - "ChargeCaptureBatch.${batch_id}.total_posted_charge_cents == 5010049"
            - "ChargeCaptureBatch.${batch_id}.status == RECONCILING"

      - name: boundary_precision_check__included_item_count_zero_vs_one_on_transparency_validate
        grounds:
          - calculations.transparency_file_build
          - entities.TransparencyFile.fields.included_item_count
          - entities.TransparencyFile.fields.payer_column_count
          - entities.TransparencyFile.fields.validation_errors
          - entities.TransparencyFile.fields.content_hash
          - entities.Facility.fields.transparency_status
          - entities.Facility.fields.published_transparency_file_id
          - state_machines.TransparencyFile.BUILDING_to_FAILED
          - state_machines.TransparencyFile.BUILDING_to_VALIDATED
          - state_machines.TransparencyFile.VALIDATED_to_PUBLISHED
          - concurrency_rules[transparency-build-stale-facility]
          - validations[priority=17]
        distinguishing_aspect: |
          The metric under test is the EMPTY-COLLECTION edge of included_item_count
          reached through POST /chargemaster/transparency-files/{file_id}/lifecycle
          action=VALIDATE (a different metric and a different endpoint from the numeric
          basis-point tolerance instance): the first build has included_item_count == 0
          with content_hash over the empty row list and VALIDATE routes BUILDING ->
          FAILED with validation_errors == ['NO_PUBLISHABLE_ITEMS'], while a second build
          taken after exactly one item reaches ACTIVE + PRICED_CURRENT has
          included_item_count == 1 and VALIDATE routes BUILDING -> VALIDATED.
        test_recipe:
          setup:
            - "Logical clock left at the fixed startup default 2026-08-01T00:00:00Z."
            - "Facility TRN with rounding_mode = NEAREST_CENT and aggregate_markup_limit_bp = 40000; posture OPEN."
            - "Department OUTPATIENT (manager_user_id = u_dm_op), ACTIVE RevenueCode 0300, one ACTIVE COST_PLUS_MARKUP PriceRule with the default tiers — all created BEFORE the first build, because a BUILDING file drives the facility posture to FROZEN and POST /price-rules is posture-gated."
            - "One ACTIVE PayerContract AETNA_COMM/COMMERCIAL PERCENT_OF_CHARGE 4500bp with term 2026-01-01..2026-12-31 so payer_column_count is 1 in both builds and 'NO_ACTIVE_PAYER_COLUMNS' never appears."
            - "No ChargeItem exists yet when the first transparency file is built, so the inclusion set is empty."
          setup_api_calls:
            - call: "POST /chargemaster/facilities"
              payload: { name: "Transparency Regional", cms_certification_number: "CCN-2193-T", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Outpatient Clinic", cost_center_code: "CC-OP", manager_user_id: "u_dm_op" }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CDM_INTERNAL", "REV_ONLY"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_id}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-08-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule_id: $.data.id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "AETNA_COMM", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", percent_of_charge_bp: 4500, trailing_units: 5, renegotiation_notice_days: 30 }
              as: ContractManager
              captures: { pc_id: $.data.id }
            - call: "GET /chargemaster/facilities/${fac_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { fac_v1: $.data.version }
          trigger:
            - call: "POST /chargemaster/transparency-files"
              payload: { facility_id: "${fac_id}", file_format: "CSV", expected_facility_version: "${fac_v1}" }
              as: ComplianceOfficer
              captures: { f1_id: $.data.id }
            - call: "POST /chargemaster/transparency-files/${f1_id}/lifecycle"
              payload: { action: "VALIDATE", note: "first attempt on an empty chargemaster" }
              as: ComplianceOfficer
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc_id}", cdm_number: "CDM-6000", description: "COMPREHENSIVE METABOLIC PANEL", code_type: "CDM_INTERNAL", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "u_pca_1"
            - call: "GET /chargemaster/facilities/${fac_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { fac_v2: $.data.version }
            - call: "POST /chargemaster/transparency-files"
              payload: { facility_id: "${fac_id}", file_format: "CSV", expected_facility_version: "${fac_v2}" }
              as: ComplianceOfficer
              captures: { f2_id: $.data.id }
            - call: "POST /chargemaster/transparency-files/${f2_id}/lifecycle"
              payload: { action: "VALIDATE", note: "second attempt with exactly one publishable item" }
              as: ComplianceOfficer
            - call: "POST /chargemaster/transparency-files/${f2_id}/lifecycle"
              payload: { action: "PUBLISH", note: "machine-readable file live" }
              as: ComplianceOfficer
          assert:
            - "After trigger[0]: TransparencyFile.${f1_id}.status == BUILDING and TransparencyFile.${f1_id}.as_of_datetime == 2026-08-01T00:00:00Z"
            - "TransparencyFile.${f1_id}.included_item_count == 0"
            - "TransparencyFile.${f1_id}.total_gross_charge_cents == 0"
            - "TransparencyFile.${f1_id}.payer_column_count == 1"
            - "TransparencyFile.${f1_id}.content_hash == e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 (SHA256 of the empty serialization)"
            - "TransparencyFile.${f1_id}.validation_errors == ['NO_PUBLISHABLE_ITEMS']"
            - "After trigger[1]: TransparencyFile.${f1_id}.status == FAILED and Facility.${fac_id}.chargemaster_posture == OPEN"
            - "trigger[2] responds 201 (the FAILED file no longer freezes the facility)"
            - "ChargeItem.${item_id}.gross_charge_cents == 128000"
            - "TransparencyFile.${f2_id}.included_item_count == 1"
            - "TransparencyFile.${f2_id}.total_gross_charge_cents == 128000"
            - "TransparencyFile.${f2_id}.payer_column_count == 1"
            - "TransparencyFile.${f2_id}.content_hash == 74d11e0d8a7d9b2914629ee47d08503957c662da1d790dd0b32119797e9ce9ac (SHA256 of 'CDM-6000|0300||128000')"
            - "TransparencyFile.${f2_id}.validation_errors == []"
            - "After trigger[9]: TransparencyFile.${f2_id}.status == VALIDATED and ChargeItem.${item_id}.price_status == PRICE_FROZEN and Facility.${fac_id}.chargemaster_posture == FROZEN"
            - "After trigger[10]: TransparencyFile.${f2_id}.status == PUBLISHED and TransparencyFile.${f2_id}.published_at == 2026-08-01T00:00:00Z"
            - "ChargeItem.${item_id}.price_status == PRICED_CURRENT after trigger[10]"
            - "Facility.${fac_id}.published_transparency_file_id == ${f2_id} and Facility.${fac_id}.transparency_status == CURRENT and Facility.${fac_id}.chargemaster_posture == OPEN"

      - name: boundary_precision_check__similarity_score_exactly_at_0_8000_threshold_on_mark_duplicate
        grounds:
          - calculations.duplicate_similarity_score
          - calculations.duplicate_similarity_score.variants.FUZZY_DESCRIPTION
          - entities.Facility.fields.duplicate_detection_mode
          - entities.ChargeItem.fields.duplicate_of_item_id
          - validations[priority=48]
          - errors.ERR_DUPLICATE_SIMILARITY_TOO_LOW
          - state_machines.ChargeItem.lifecycle_status.ACTIVE_to_INACTIVE
        distinguishing_aspect: |
          The metric under test is the 4-decimal weighted similarity score against
          SIMILARITY_THRESHOLD = 0.8000 reached through POST
          /chargemaster/charge-items/{charge_item_id}/lifecycle action=MARK_DUPLICATE (a
          third distinct metric on a third distinct endpoint): a pair whose unrounded
          score is 0.79999 lands on exactly 0.8000 after the mandatory 4dp round-half-up
          and MUST be accepted under the >= comparison, a pair scoring 0.7900 MUST be
          rejected with ERR_DUPLICATE_SIMILARITY_TOO_LOW, and a third pair reaching
          exactly 0.80000 through a completely different weight composition (code 0.5 +
          jaccard 1.0000 x 0.3 + revenue-code 0) MUST also be accepted.
        test_recipe:
          setup:
            - "Logical clock left at the fixed startup default 2026-08-01T00:00:00Z."
            - "Facility SIM with rounding_mode = NEAREST_CENT, aggregate_markup_limit_bp = 40000 and duplicate_detection_mode = FUZZY_DESCRIPTION."
            - "Department GENERAL (manager_user_id = u_dm_gen). Two ACTIVE RevenueCodes 0300 and 0301, each with an identically-parameterised ACTIVE COST_PLUS_MARKUP PriceRule (default tiers, min_medicare_multiple_bp 12000, market_cap_multiple_bp 11000)."
            - "Six ChargeItems, all code_type CPT with the SAME code_value 99213 and identical economics (cost_basis_cents 40000, medicare_rate_cents 20000, market_p75_cents 200000 -> gross_charge_cents 128000, standalone markup ratio 32000 bp so every APPROVE passes the 40000 bp limit); all repriced and driven to ACTIVE."
            - "Pair 1 (score exactly 0.8000 via 0.79999): S1 'ALPHA BETA' and T1 'ALPHA GAMMA', both on revenue code 0300 -> code_match 1, rev_match 1, token intersection 1 / union 3 -> jaccard 0.3333."
            - "Pair 2 (score 0.7900, just below): S2 'RED GREEN BLUE ONE TWO THREE' and T2 'RED GREEN BLUE FOUR FIVE SIX SEVEN', both on revenue code 0300 -> code_match 1, rev_match 1, token intersection 3 / union 10 -> jaccard 0.3000."
            - "Pair 3 (score exactly 0.80000 via a different composition): S3 on revenue code 0300 and T3 on revenue code 0301, both described 'OMEGA SIGMA DELTA' -> code_match 1, rev_match 0, jaccard 1.0000."
          setup_api_calls:
            - call: "POST /chargemaster/facilities"
              payload: { name: "Similarity Memorial", cms_certification_number: "CCN-2193-S", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000, duplicate_detection_mode: "FUZZY_DESCRIPTION" }
              as: SystemAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "General", cost_center_code: "CC-GEN", manager_user_id: "u_dm_gen" }
              as: SystemAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "CDM_INTERNAL"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc300_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0301", description: "Laboratory chemistry", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "CDM_INTERNAL"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              captures: { rc301_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc300_id}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-08-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule300_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc301_id}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-08-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule301_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc300_id}", cdm_number: "CDM-7001", description: "ALPHA BETA", code_type: "CPT", code_value: "99213", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc300_id}", cdm_number: "CDM-7002", description: "ALPHA GAMMA", code_type: "CPT", code_value: "99213", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { t1_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc300_id}", cdm_number: "CDM-7003", description: "RED GREEN BLUE ONE TWO THREE", code_type: "CPT", code_value: "99213", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { s2_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc300_id}", cdm_number: "CDM-7004", description: "RED GREEN BLUE FOUR FIVE SIX SEVEN", code_type: "CPT", code_value: "99213", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { t2_id: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc300_id}", cdm_number: "CDM-7005", description: "OMEGA SIGMA DELTA", code_type: "CPT", code_value: "99213", cost_basis_cents: 40000, medicare_rate_cents: 20000, market_p75_cents: 200000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
