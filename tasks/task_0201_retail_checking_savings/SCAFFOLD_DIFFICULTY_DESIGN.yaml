            - "$.data.error_id == ERR_APY_TIER_NOT_FOUND (CHECKING app cannot resolve the SAVINGS-only HYS tier)"
            - "GET /applications/${app_m} -> Application.status == SUBMITTED (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: interest_period_halfopen_overlap_rejected_adjacent_ok
        grounds:
          - validations[priority=15]
          - calculations.interest_accrual_apy
          - entities.InterestPosting.fields.period_start_date
          - entities.InterestPosting.fields.period_end_date
        distinguishing_aspect: |
          InterestPosting intervals are HALF-OPEN [period_start, period_end): an adjacent period
          starting exactly on the prior period's end date is accepted, but a period overlapping
          the prior interval is rejected ERR_INTEREST_PERIOD_OVERLAP. Interval geometry =
          half-open day interval with adjacency allowed (gap=0 OK), on the Account interest
          timeline — distinct from the closed amount-band geometry below.
        test_recipe:
          setup:
            - "Savings account, ledger 1000000, tier HY1 450 bps, with one posted interest period [2026-01-01, 2026-02-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "HY1", product_type: "SAVINGS", min_balance_cents: 0, annual_rate_bps: 450 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Interest Saver", date_of_birth: "1980-01-01", tax_id_last4: "1313", country_of_residence: "US" }
              as: Teller
              captures: { cust_i: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_i}", product_type: "SAVINGS", requested_apy_tier_code: "HY1" }
              as: Teller
              captures: { app_i: $.data.id }
            - call: "POST /applications/${app_i}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_i}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_i: $.data.opened_account_id }
            - call: "POST /accounts/${acct_i}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 1000000 }
              as: AccountHolder
              as_user_id: "${cust_i}"
            - call: "POST /accounts/${acct_i}/post-interest"
              payload: { period_start_date: "2026-01-01", period_end_date: "2026-02-01" }
              as: ComplianceOfficer
              captures: { post1: $.data.id }
            - call: "POST /accounts/${acct_i}/post-interest"
              payload: { period_start_date: "2026-02-01", period_end_date: "2026-03-01" }
              as: ComplianceOfficer
              captures: { post2: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_i}/post-interest"
              payload: { period_start_date: "2026-01-15", period_end_date: "2026-02-15" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent period [2026-02-01, 2026-03-01) (post2) was accepted (201)"
            - "response status == 409 for the overlapping [2026-01-15, 2026-02-15) period"
            - "$.data.error_id == ERR_INTEREST_PERIOD_OVERLAP"
            - "GET /accounts/${acct_i}/interest-postings -> exactly 2 postings exist"

      - name: duplicate_active_stop_payment_amount_band_rejected
        grounds:
          - validations[priority=16]
          - entities.StopPayment.fields.check_number
          - entities.StopPayment.fields.max_amount_cents
          - state_machines.StopPayment.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          StopPayment coverage is a CLOSED amount band [1, max_amount_cents]: two ACTIVE stops on
          the same check_number necessarily overlap (both bands include 1, adjacency impossible),
          so a second ACTIVE stop on check 9001 is rejected ERR_DUPLICATE_STOP_PAYMENT even with a
          different max_amount_cents. Interval geometry = closed amount band, no adjacency —
          distinct from the half-open day interval above.
        test_recipe:
          setup:
            - "An ACTIVE checking account with one ACTIVE stop on check 9001 (max 8000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Stop Owner", date_of_birth: "1990-01-01", tax_id_last4: "1414", country_of_residence: "US" }
              as: Teller
              captures: { cust_j: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_j}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_j: $.data.id }
            - call: "POST /applications/${app_j}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_j}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_j: $.data.opened_account_id }
            - call: "POST /accounts/${acct_j}/stop-payments"
              payload: { check_number: "9001", max_amount_cents: 8000, expires_on: "2026-12-31" }
              as: AccountHolder
              as_user_id: "${cust_j}"
              captures: { stop1: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_j}/stop-payments"
              payload: { check_number: "9001", max_amount_cents: 3000, expires_on: "2026-12-31" }
              as: AccountHolder
              as_user_id: "${cust_j}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "$.data.error_id == ERR_DUPLICATE_STOP_PAYMENT"
            - "GET /accounts/${acct_j}/stop-payments?status=ACTIVE -> exactly 1 ACTIVE stop on check 9001"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ach_settle_reverse_conserves_two_account_total
        grounds:
          - calculations.ach_reversal_invariant
          - state_machines.AchOrigination.STAGED_to_SETTLED
          - state_machines.AchOrigination.SETTLED_to_REVERSED
          - entities.Account.fields.ledger_balance_cents
        distinguishing_aspect: |
          Conserved quantity = the SUM of ledger_balance_cents across the debtor and creditor
          accounts. Settling a batch (CREDIT 5000 to creditor, DEBIT 8000 from debtor) then
          reversing it leaves the two-account total at its pre-batch value 20000. Distinct
          conserved quantity from the single-account ledger conservation below.
        test_recipe:
          setup:
            - "Debtor account ledger 20000 (no courtesy needed), creditor ledger 0, STAGED batch with CREDIT 5000 then DEBIT 8000, CHRONOLOGICAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Inv Debtor", date_of_birth: "1990-01-01", tax_id_last4: "1515", country_of_residence: "US" }
              as: Teller
              captures: { cust_id1: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_id1}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_id1: $.data.id }
            - call: "POST /applications/${app_id1}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_id1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_dbt: $.data.opened_account_id }
            - call: "POST /accounts/${acct_dbt}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 20000 }
              as: AccountHolder
              as_user_id: "${cust_id1}"
            - call: "POST /customers"
              payload: { legal_name: "Inv Cred", date_of_birth: "1990-01-01", tax_id_last4: "1616", country_of_residence: "US" }
              as: Teller
              captures: { cust_id2: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_id2}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_id2: $.data.id }
            - call: "POST /applications/${app_id2}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_id2}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_crd: $.data.opened_account_id }
            - call: "POST /ach-originations"
              payload: { debtor_account_id: "${acct_dbt}", creditor_account_id: "${acct_crd}", posting_order: "CHRONOLOGICAL" }
              as: ComplianceOfficer
              captures: { o_inv: $.data.id, o_inv_v: $.data.version }
            - call: "POST /ach-originations/${o_inv}/legs"
              payload: { leg_role: "CREDIT", amount_cents: 5000, expected_ach_origination_version: "${o_inv_v}" }
              as: ComplianceOfficer
              captures: { o_inv_v2: $.data.version }
            - call: "POST /ach-originations/${o_inv}/legs"
              payload: { leg_role: "DEBIT", amount_cents: 8000, expected_ach_origination_version: "${o_inv_v2}" }
              as: ComplianceOfficer
              captures: { o_inv_v3: $.data.version }
            - call: "POST /ach-originations/${o_inv}/settle"
              payload: { expected_ach_origination_version: "${o_inv_v3}" }
              as: ComplianceOfficer
              captures: { o_inv_v4: $.data.version }
          trigger:
            - call: "POST /ach-originations/${o_inv}/reverse"
              payload: { expected_ach_origination_version: "${o_inv_v4}" }
              as: ComplianceOfficer
          assert:
            - "after settle (pre-trigger): GET /accounts/${acct_dbt} ledger == 12000 and GET /accounts/${acct_crd} ledger == 5000 (sum 17000)"
            - "after reverse: GET /accounts/${acct_dbt} -> Account.ledger_balance_cents == 20000"
            - "after reverse: GET /accounts/${acct_crd} -> Account.ledger_balance_cents == 0"
            - "two-account ledger total after reverse == 20000 == pre-batch total"
            - "GET /ach-originations/${o_inv} -> AchOrigination.status == REVERSED"

      - name: deposit_then_equal_withdrawal_conserves_single_ledger
        grounds:
          - state_machines.Transaction.PENDING_to_POSTED
          - calculations.available_balance
          - entities.Account.fields.ledger_balance_cents
        distinguishing_aspect: |
          Conserved quantity = a SINGLE account's ledger_balance_cents. A DEPOSIT of 7500 paired
          with its compensating WITHDRAWAL of 7500 leaves ledger_balance_cents at its starting
          value (10000), with no fee drift (the withdrawal never overdraws). Distinct conserved
          quantity (one-account ledger) from the two-account total above.
        test_recipe:
          setup:
            - "Account opened with ledger 10000."
          setup_api_calls:
            - call: "POST /apy-tiers"
              payload: { code: "CHK_STD", product_type: "CHECKING", min_balance_cents: 0, annual_rate_bps: 0 }
              as: ComplianceOfficer
            - call: "POST /customers"
              payload: { legal_name: "Conserve Owner", date_of_birth: "1990-01-01", tax_id_last4: "1717", country_of_residence: "US" }
              as: Teller
              captures: { cust_k: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_k}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_k: $.data.id }
            - call: "POST /applications/${app_k}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_k}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_k: $.data.opened_account_id }
            - call: "POST /accounts/${acct_k}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 10000 }
              as: AccountHolder
              as_user_id: "${cust_k}"
          trigger:
            - call: "POST /accounts/${acct_k}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 7500 }
              as: AccountHolder
              as_user_id: "${cust_k}"
            - call: "POST /accounts/${acct_k}/transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 7500 }
              as: AccountHolder
              as_user_id: "${cust_k}"
          assert:
            - "GET /accounts/${acct_k} -> Account.ledger_balance_cents == 10000 (deposit+equal withdrawal conserves the single-account ledger)"
            - "no FeeAssessment exists for acct_k"
            - "GET /accounts/${acct_k}/transactions -> 3 POSTED transactions (initial deposit + the pair)"
