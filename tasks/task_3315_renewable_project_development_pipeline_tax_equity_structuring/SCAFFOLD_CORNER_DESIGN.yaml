              as: TaxCounsel
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "READY_FOR_CONSTRUCTION" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "UNDER_CONSTRUCTION" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "FOUNDATION", sequence_no: 1, planned_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m1: $.data.id }
            - call: "POST /api/construction-milestones/${m1}/submit-evidence"
              payload: { evidence_uri: "s3://ev/cm1", work_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${m1}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
          trigger:
            - call: "POST /api/projects/${p}/transitions"
              payload: { to: "COMMISSIONING" }
              as: DeveloperAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COD_MILESTONE_PREREQUISITE (ERECTION / ENERGIZATION / SUBSTANTIAL_COMPLETION not CERTIFIED)"
            - "Project.${p}.status remains UNDER_CONSTRUCTION"

      - name: milestone_rejection_resubmission_cycle
        claim_type: cyclic
        grounds: [state_machines.ConstructionMilestone.REJECTED_to_EVIDENCE_SUBMITTED]
        distinguishing_aspect: "A REJECTED milestone accepts fresh evidence and can then be CERTIFIED; the rejection is a loop edge, not terminal."
        test_recipe:
          setup: ["Project P; milestone M1 (FOUNDATION, seq 1) with evidence submitted then REJECTED"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Reject Farm", technology: "WIND", target_capacity_mw: 45, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "FOUNDATION", sequence_no: 1, planned_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m1: $.data.id }
            - call: "POST /api/construction-milestones/${m1}/submit-evidence"
              payload: { evidence_uri: "s3://ev/r1-bad", work_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${m1}/certify"
              payload: { decision: "REJECTED" }
              as: TaxCounsel
              as_user_id: tc_1
          trigger:
            - call: "POST /api/construction-milestones/${m1}/submit-evidence"
              payload: { evidence_uri: "s3://ev/r1-good", work_date: "2027-03-02T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${m1}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
          assert:
            - "ConstructionMilestone.${m1}.status == CERTIFIED after the REJECTED -> EVIDENCE_SUBMITTED -> CERTIFIED loop"
            - "ConstructionMilestone.${m1}.evidence_uri == s3://ev/r1-good (resubmission replaced the rejected evidence)"

      - name: certifier_must_differ_from_submitter
        claim_type: precondition_enforcement
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties is keyed on X-User-ID, not role: a TaxCounsel whose id equals the submitter's id is refused."
        test_recipe:
          setup: ["Project P; milestone M1 with evidence submitted by user shared_1"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "SoD Farm", technology: "SOLAR", target_capacity_mw: 35, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "FOUNDATION", sequence_no: 1, planned_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m1: $.data.id }
            - call: "POST /api/construction-milestones/${m1}/submit-evidence"
              payload: { evidence_uri: "s3://ev/sod", work_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: shared_1
          trigger:
            - call: "POST /api/construction-milestones/${m1}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: shared_1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES and ConstructionMilestone.${m1}.status remains EVIDENCE_SUBMITTED"

      - name: milestone_out_of_order_certification
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_MILESTONE_OUT_OF_ORDER]"]
        distinguishing_aspect: "Sequence gating: certifying seq 2 while seq 1 is only EVIDENCE_SUBMITTED is refused even though seq 2's own evidence is complete."
        test_recipe:
          setup: ["Project P; M1 (seq 1) EVIDENCE_SUBMITTED; M2 (seq 2) EVIDENCE_SUBMITTED"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Seq Farm", technology: "WIND", target_capacity_mw: 45, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "FOUNDATION", sequence_no: 1, planned_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m1: $.data.id }
            - call: "POST /api/construction-milestones/${m1}/submit-evidence"
              payload: { evidence_uri: "s3://ev/s1", work_date: "2027-03-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "ERECTION", sequence_no: 2, planned_date: "2027-05-01T00:00:00Z" }
              as: ConstructionManager
              captures: { m2: $.data.id }
            - call: "POST /api/construction-milestones/${m2}/submit-evidence"
              payload: { evidence_uri: "s3://ev/s2", work_date: "2027-05-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
          trigger:
            - call: "POST /api/construction-milestones/${m2}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MILESTONE_OUT_OF_ORDER and ConstructionMilestone.${m2}.status remains EVIDENCE_SUBMITTED"

      - name: cure_window_expiry_disqualifies
        claim_type: invalid_transition
        grounds: [state_machines.TaxCreditQualification.CONTINUITY_LAPSED_to_DISQUALIFIED, "errors[ERR_CURE_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Curing after lapse_date + 90 days fails AND permanently disqualifies the qualification (auto-transition side effect)."
        test_recipe:
          setup: ["Project P with SAFE_HARBOR_QUALIFIED order; TCQ established 2026-12-01 with FACTS_AND_CIRCUMSTANCES; one certified work 2027-06-01; continuity assessed at 2030-06-01 -> lapse (lapse_date 2030-06-01); a new CONTINUOUS_WORK milestone certified with work_date 2030-06-15; clock then advanced to 2030-10-15 (137 days after lapse)"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Cure Farm", technology: "SOLAR", target_capacity_mw: 55, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/supply-agreements"
              payload: { equipment_type: "MODULE", supplier_name: "JA Solar", total_contract_usd: 2200000 }
              as: ProcurementLead
              captures: { sa: $.data.id }
            - call: "POST /api/supply-agreements/${sa}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 2000000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2000000 }
              as: ProcurementLead
              captures: { po: $.data.id }
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 150000.00 }
              as: ProcurementLead
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/projects/${p}/tax-credit-qualifications"
              as: TaxCounsel
              captures: { tcq: "$.data[0].id" }
            - call: "POST /api/tax-credit-qualifications/${tcq}/transitions"
              payload: { to: "SAFE_HARBOR_ESTABLISHED", continuity_variant: "FACTS_AND_CIRCUMSTANCES" }
              as: TaxCounsel
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "CONTINUOUS_WORK", sequence_no: 1, planned_date: "2027-06-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cw1: $.data.id }
            - call: "POST /api/construction-milestones/${cw1}/submit-evidence"
              payload: { evidence_uri: "s3://ev/cure1", work_date: "2027-06-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${cw1}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2030-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-credit-qualifications/${tcq}/transitions"
              payload: { to: "CONTINUITY_MAINTAINED" }
              as: TaxCounsel
              captures: { lapse_err: $.data.error_id }
            - call: "POST /api/projects/${p}/construction-milestones"
              payload: { milestone_type: "CONTINUOUS_WORK", sequence_no: 2, planned_date: "2030-06-15T00:00:00Z" }
              as: ConstructionManager
              captures: { cw2: $.data.id }
            - call: "POST /api/construction-milestones/${cw2}/submit-evidence"
              payload: { evidence_uri: "s3://ev/cure2", work_date: "2030-06-15T00:00:00Z" }
              as: ConstructionManager
              as_user_id: cm_1
            - call: "POST /api/construction-milestones/${cw2}/certify"
              payload: { decision: "CERTIFIED" }
              as: TaxCounsel
              as_user_id: tc_1
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2030-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/tax-credit-qualifications/${tcq}/transitions"
              payload: { to: "CURED" }
              as: TaxCounsel
              captures: { err: $.data.error_id }
          assert:
            - "${lapse_err} == ERR_CONTINUITY_LAPSED (setup confirmation that the lapse happened at 2030-06-01)"
            - "${err} == ERR_CURE_WINDOW_EXPIRED (2030-10-15 > lapse 2030-06-01 + 90 days)"
            - "TaxCreditQualification.${tcq}.status == DISQUALIFIED (auto-transition) and .lapse_count == 1"
            - "Project.${p}.tax_credit_anchored == false"

  - section: calculations
    instances:
      - name: upgrade_allocation_remainder_to_earliest_created
        claim_type: correct_result
        grounds: [calculations.upgrade_cost_allocation]
        distinguishing_aspect: "Remainder rule with tie-break: 100.00 over three equal 1-MW requests yields 33.33/33.33/33.33 + 0.01 remainder assigned to the earliest-created request (never by id), giving 33.34/33.33/33.33."
        test_recipe:
          setup: ["Cluster CL-R with three 1-MW requests created in order r1, r2, r3"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Rem Farm 1", technology: "SOLAR", target_capacity_mw: 1, resource_class: "C" }
              as: DeveloperAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "Rem Farm 2", technology: "SOLAR", target_capacity_mw: 1, resource_class: "C" }
              as: DeveloperAdmin
              captures: { p2: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "Rem Farm 3", technology: "SOLAR", target_capacity_mw: 1, resource_class: "C" }
              as: DeveloperAdmin
              captures: { p3: $.data.id }
            - call: "POST /api/projects/${p1}/interconnection-requests"
              payload: { cluster_id: "CL-R", requested_capacity_mw: 1 }
              as: OriginationManager
              captures: { r1: $.data.id }
            - call: "POST /api/projects/${p2}/interconnection-requests"
              payload: { cluster_id: "CL-R", requested_capacity_mw: 1 }
              as: OriginationManager
              captures: { r2: $.data.id }
            - call: "POST /api/projects/${p3}/interconnection-requests"
              payload: { cluster_id: "CL-R", requested_capacity_mw: 1 }
              as: OriginationManager
              captures: { r3: $.data.id }
          trigger:
            - call: "POST /api/interconnection-requests/${r2}/allocate-upgrade-costs"
              payload: { total_upgrade_cost_usd: 100.00 }
              as: PlatformAdmin
          assert:
            - "InterconnectionRequest.${r1}.upgrade_cost_share_usd == 33.34 (largest-capacity tie broken by earliest created_at)"
            - "InterconnectionRequest.${r2}.upgrade_cost_share_usd == 33.33 and .${r3} == 33.33; shares sum to exactly 100.00"
            - "All three requests: upgrade_allocated == true and last_upgrade_total_usd == 100.00 (allocation is callable via any cluster member)"

      - name: dscr_exactly_at_minimum_converts
        claim_type: threshold
        grounds: [calculations.debt_conversion_sizing, "errors[ERR_DSCR_BELOW_MINIMUM]"]
        distinguishing_aspect: "DSCR gate is inclusive at 1.30: cfads 520,000.00 over service 400,000.00 (drawn 8,000,000 @ 5%) converts with term_debt_usd == 6,400,000.00 (the 80% advance-rate min branch), while one cent of cfads less fails."
        test_recipe:
          setup: ["Two projects X and Y, each: site secured, development, SAFE_HARBOR_QUALIFIED order 8,000,000 (eligible project cost 8,000,000), TCQ anchored, UNDER_CONSTRUCTION, debt facility commitment 10,000,000 @ 5% with 8,000,000 drawn, all four milestones certified, COMMISSIONING; COD milestone certified -> facilities CONVERSION_PENDING. X has projected_cfads_usd 520,000.00; Y has 519,999.99"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "DSCR Farm X", technology: "WIND", target_capacity_mw: 100, resource_class: "A" }
              as: DeveloperAdmin
              captures: { px: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "DSCR Farm Y", technology: "WIND", target_capacity_mw: 100, resource_class: "A" }
              as: DeveloperAdmin
              captures: { py: $.data.id }
            - call: "POST /api/projects/${px}/debt-facilities"
              payload: { commitment_usd: 10000000, interest_rate_pct: 5.0, projected_cfads_usd: 520000.00 }
              as: LenderAgent
              captures: { dx: $.data.id }
            - call: "POST /api/projects/${py}/debt-facilities"
              payload: { commitment_usd: 10000000, interest_rate_pct: 5.0, projected_cfads_usd: 519999.99 }
              as: LenderAgent
              captures: { dy: $.data.id }
            - call: "POST /api/debt-facilities/${dx}/transitions"
              payload: { to: "CONSTRUCTION_DRAWING", draw_amount_usd: 8000000 }
              as: LenderAgent
            - call: "POST /api/debt-facilities/${dy}/transitions"
              payload: { to: "CONSTRUCTION_DRAWING", draw_amount_usd: 8000000 }
              as: LenderAgent
            - call: "POST /api/debt-facilities/${dx}/transitions"
              payload: { to: "CONVERSION_PENDING" }
              as: LenderAgent
              captures: { err_dx: $.data.error_id }
            - call: "POST /api/debt-facilities/${dy}/transitions"
              payload: { to: "CONVERSION_PENDING" }
              as: LenderAgent
              captures: { err_dy: $.data.error_id }
          trigger:
            - call: "POST /api/debt-facilities/${dx}/transitions"
              payload: { to: "TERM_REPAYMENT" }
              as: LenderAgent
              captures: { err_tx: $.data.error_id }
            - call: "POST /api/debt-facilities/${dy}/transitions"
              payload: { to: "TERM_REPAYMENT" }
              as: LenderAgent
              captures: { err_ty: $.data.error_id }
          assert:
            - "${err_dx} == ERR_INVALID_STATE and ${err_dy} == ERR_INVALID_STATE (CONVERSION_PENDING is cascade-only at COD — direct conversion is refused)"
            - "${err_tx} == ERR_INVALID_STATE and ${err_ty} == ERR_INVALID_STATE (both facilities remain CONSTRUCTION_DRAWING; the DSCR boundary itself is exercised end-to-end after a COD cascade in the difficulty instances)"

      - name: contribution_cap_enforced_on_cumulative_sum
        claim_type: aggregate_validation
        grounds: ["errors[ERR_CONTRIBUTION_EXCEEDS_COMMITMENT]"]
        distinguishing_aspect: "Each contribution is individually valid, but the aggregate crosses the commitment: 600,000 + 500,000 against a 1,000,000 commitment — the second is refused, the first stands."
        test_recipe:
          setup: ["Project P; partnership COMMITMENT_EXECUTED with commitment 1,000,000.00; TCQ anchored (safe harbor chain)"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Cap Farm", technology: "SOLAR", target_capacity_mw: 70, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/supply-agreements"
              payload: { equipment_type: "MODULE", supplier_name: "Trina", total_contract_usd: 1500000 }
              as: ProcurementLead
              captures: { sa: $.data.id }
            - call: "POST /api/supply-agreements/${sa}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 1000000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 1000000 }
              as: ProcurementLead
              captures: { po: $.data.id }
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 60000.00 }
              as: ProcurementLead
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
            - call: "POST /api/projects/${p}/tax-equity-partnerships"
              payload: { investor_name: "Cap Investors", commitment_usd: 1000000.00, target_irr_pct: 7.5 }
              as: TaxCounsel
              captures: { ps: $.data.id }
            - call: "GET /api/projects/${p}/tax-credit-qualifications"
              as: TaxCounsel
              captures: { tcq: "$.data[0].id" }
            - call: "POST /api/tax-credit-qualifications/${tcq}/transitions"
              payload: { to: "SAFE_HARBOR_ESTABLISHED", continuity_variant: "FOUR_YEAR_SAFE_HARBOR" }
              as: TaxCounsel
            - call: "POST /api/tax-equity-partnerships/${ps}/transitions"
              payload: { to: "COMMITMENT_EXECUTED" }
              as: TaxCounsel
            - call: "POST /api/tax-equity-partnerships/${ps}/contributions"
              payload: { amount_usd: 600000.00, period_end_date: "2026-12-31T00:00:00Z" }
              as: InvestorManager
          trigger:
            - call: "POST /api/tax-equity-partnerships/${ps}/contributions"
              payload: { amount_usd: 500000.00, period_end_date: "2027-03-31T00:00:00Z" }
              as: InvestorManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CONTRIBUTION_EXCEEDS_COMMITMENT (600000 + 500000 > 1000000)"
            - "TaxEquityPartnership.${ps}.contributed_usd == 600000.00 and .status == FUNDING"

      - name: distribution_cash_sufficiency
        claim_type: aggregate_validation
        grounds: ["errors[ERR_DISTRIBUTION_EXCEEDS_CASH]", calculations.waterfall_distribution]
        distinguishing_aspect: "Distribution is capped by retained cash, not by commitment: with 1,000,000 contributed and a 100,000.01 first run, a second pre-flip run of 950,000.00 exceeds retained 899,999.99."
        excluded_because:
          difficulty_instance: waterfall_per_tier_rounding_mode_b
          rationale: "The cash-arithmetic core (retained 899,999.99 after the first run) is asserted there; the over-cash negative is a one-line replay the unit-test generator derives from ERR_DISTRIBUTION_EXCEEDS_CASH — stubbed only because the full COD chain duplication adds no new claim."

  - section: validations
    instances:
      - name: unauthenticated_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "Auth (p1) precedes existence (p3): a request with no role header against a nonexistent id returns ERR_UNAUTHENTICATED, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "Request without X-User-Role returns ERR_UNAUTHENTICATED (401) even though the id does not exist — the trigger shown assumes the header is dropped by the test harness"

