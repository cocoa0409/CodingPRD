            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s3_id}", mrn: "S3-1000", last_name: "Achterberg", first_name: "Willem", dob: "1958-01-30", sex: "M", ssn_last4: "3131", postal_code: "57104", phone: "6055550101", clinical_element_count: 7 }
              as: IdentityAnalyst
              captures: { rec_s3a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s3_id}", mrn: "S3-2000", last_name: "Achterberg", first_name: "Willem", dob: "1958-01-30", sex: "M", clinical_element_count: 2 }
              as: IdentityAnalyst
              captures: { rec_s3b_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_s3a_id}", record_b_id: "${rec_s3b_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_s3_id: $.data.id }
            - call: "POST /mpi/candidate-pairs/${pair_s3_id}/triage"
              payload: { triage_note: "Same name and dob, different social." }
              as: IdentityAnalyst
