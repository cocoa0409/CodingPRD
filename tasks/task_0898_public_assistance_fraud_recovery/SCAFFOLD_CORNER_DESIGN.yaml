# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Walks references/claim-extraction-guide.md sections against §1.1–§1.7.
# All literals precomputed against SCAFFOLD.yaml §1.3 formulas + constants.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_overpayment_adjustment_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[overpayment-adjustment-stale-version]
          - errors[ERR_STALE_VERSION]
          - entities.Overpayment.fields.version
        distinguishing_aspect: "Two sequential adjustments carrying the same observed version: the first succeeds and bumps version; the second (stale) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "An ESTABLISHED IHE Overpayment; the client has observed its post-establish version, then a first adjustment has already been applied (advancing version)."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Occ One", ssn_last4: "2020", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "SNAP", source: "DATA_MATCH", allegation_summary: "OCC case" }
              as: Intake
              captures: { ref_id: $.data.id }
            - call: "POST /fraud-recovery/referrals/${ref_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Intake
            - call: "POST /fraud-recovery/cases"
              payload: { referral_id: "${ref_id}" }
              as: Investigator
              captures: { case_id: $.data.id }
            - call: "POST /fraud-recovery/cases/${case_id}/assign"
              payload: { investigator_user_id: "inv-1" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/evidence"
              payload: { kind: "DOCUMENT", description: "Rec" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/adjudicate"
              payload: { decision: "SUBSTANTIATE" }
              as: Supervisor
            - call: "POST /fraud-recovery/overpayments"
              payload: { case_id: "${case_id}", claim_type: "IHE" }
              as: Investigator
              captures: { op_id: $.data.id }
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-01", benefits_issued_cents: 50050, benefits_entitled_reported_cents: 30000, benefits_entitled_verified_cents: 20000 }
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-02", benefits_issued_cents: 40000, benefits_entitled_reported_cents: 25000, benefits_entitled_verified_cents: 25000 }
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/calculate"
              payload: {}
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/establish"
              payload: {}
              as: Supervisor
              captures: { op_v: $.data.version }
            - call: "POST /fraud-recovery/overpayments/${op_id}/adjustments"
              payload: { adjustment_amount_cents: 5000, reason: "Fair hearing partial", expected_overpayment_version: "${op_v}" }
              as: Supervisor
          trigger:
            - call: "POST /fraud-recovery/overpayments/${op_id}/adjustments"
              payload: { adjustment_amount_cents: -2000, reason: "Second stale adjustment", expected_overpayment_version: "${op_v}" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

      - name: adjustment_recomputes_final_amount
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Overpayment.fields.final_amount_cents
          - entities.Overpayment.fields.total_adjustments_cents
        distinguishing_aspect: "A +5000 adjustment on a 45050 established claim sets total_adjustments_cents=5000, final_amount_cents=50050, and increments version."
        test_recipe:
          setup:
            - "An ESTABLISHED IHE Overpayment (final 45050); client has its current version."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Adj Two", ssn_last4: "2121", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "SNAP", source: "DATA_MATCH", allegation_summary: "Adjust" }
              as: Intake
              captures: { ref_id: $.data.id }
            - call: "POST /fraud-recovery/referrals/${ref_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Intake
            - call: "POST /fraud-recovery/cases"
              payload: { referral_id: "${ref_id}" }
              as: Investigator
              captures: { case_id: $.data.id }
            - call: "POST /fraud-recovery/cases/${case_id}/assign"
              payload: { investigator_user_id: "inv-1" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/evidence"
              payload: { kind: "DOCUMENT", description: "Rec" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/adjudicate"
              payload: { decision: "SUBSTANTIATE" }
              as: Supervisor
            - call: "POST /fraud-recovery/overpayments"
              payload: { case_id: "${case_id}", claim_type: "IHE" }
              as: Investigator
              captures: { op_id: $.data.id }
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-01", benefits_issued_cents: 50050, benefits_entitled_reported_cents: 30000, benefits_entitled_verified_cents: 20000 }
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-02", benefits_issued_cents: 40000, benefits_entitled_reported_cents: 25000, benefits_entitled_verified_cents: 25000 }
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/calculate"
              payload: {}
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/establish"
              payload: {}
              as: Supervisor
              captures: { op_v: $.data.version }
          trigger:
            - call: "POST /fraud-recovery/overpayments/${op_id}/adjustments"
              payload: { adjustment_amount_cents: 5000, reason: "Fair hearing add", expected_overpayment_version: "${op_v}" }
              as: Supervisor
          assert:
            - "Overpayment.${op_id}.total_adjustments_cents == 5000"
            - "Overpayment.${op_id}.final_amount_cents == 50050"

