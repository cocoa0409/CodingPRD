# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - task_2980_utility_service_line_warranty_program
#
# Breadth index for SKILL.md §1.9. Sections and claim_type values are taken
# verbatim from references/claim-extraction-guide.md; nothing is invented.
#
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs that cite the covering §1.8 instance by name and
# carry no test_recipe.
#
# Shared conventions used by every chain below:
#   * The logical clock is pinned explicitly with POST /_clock/set_current_utc.
#   * Fixed X-User-ID values: mops-001 (MarketingOps), csr-001 (CustomerServiceRep),
#     bill-001 (BillingOps), adj-001 (ClaimsAdjuster), apo-001 (AppealsOfficer),
#     reg-001 (RegulatoryAffairs), ops-001 (OperationsAdmin), pa-001 (PlatformAdmin).
#   * Entity-backed roles bind X-User-ID to an entity id: PartnerBrandReviewer to
#     ${partner_id}, Policyholder to ${premises_id}, NetworkContractor to a
#     contractor id.
#   * The non-existent id used by every 404 corner is the literal
#     00000000-0000-4000-8000-000000000000.
#   * Every numeric literal in an `assert:` was computed by executing the relevant
#     §1.3 formula in .scratch/step2/calc3.py and .scratch/step2/calc4.py.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1 - entities
  # ===========================================================================
  - section: entities
    instances:

      - name: partner_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.UtilityPartner
          - endpoints.POST /partners
        distinguishing_aspect: "A minimal create body (only the three required fields) must still return the full UtilityPartner projection, in ONBOARDING with version 1 and every optional field at its declared default."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, status: $.data.status, version: $.data.version, created_at: $.data.created_at, brand_gate: $.data.brand_approval_required, min_gap: $.data.min_days_between_drops, max_mail: $.data.max_mailings_per_year, filing: $.data.rate_filing_required, insert_ok: $.data.bill_insert_supported, enrolled: $.data.enrolled_premises_count }
          assert:
            - "HTTP 201 with response_type object"
            - "${status} == ONBOARDING and ${version} == 1"
            - "${created_at} == 2026-08-01T00:00:00.000Z"
            - "${brand_gate} == true, ${min_gap} == 30, ${max_mail} == 4, ${filing} == false, ${insert_ok} == false  # declared §1.1 defaults"
            - "${enrolled} == 0  # the cross-entity count starts empty"
            - "${partner_id} is a bare UUID with no type prefix"

      - name: partner_retrieval_returns_the_stored_entity
        claim_type: retrieval
        grounds:
          - endpoints.GET /partners/{partnerId}
          - entities.UtilityPartner
        distinguishing_aspect: "GET /{id} must echo exactly what POST stored, including the version the create returned - no re-derivation and no version bump from a read."
        test_recipe:
          setup:
            - "One UtilityPartner Cascadia Water exists in ONBOARDING with min_days_between_drops 21."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, created_version: $.data.version }
          trigger:
            - call: "GET /partners/${partner_id}"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { read_id: $.data.id, read_name: $.data.name, read_gap: $.data.min_days_between_drops, read_version: $.data.version, read_status: $.data.status }
          assert:
            - "HTTP 200 with ${read_id} == ${partner_id}"
            - "${read_name} == Cascadia Water, ${read_gap} == 21 and ${read_status} == ONBOARDING"
            - "${read_version} == ${created_version} == 1  # a read never mutates"

      - name: service_line_product_listing_is_paginated_in_created_at_order
        claim_type: listing
        grounds:
          - endpoints.GET /service-line-products
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three products, limit 2: the first page must carry total_count 3 and has_more true in created_at ASC order, and the second page must carry has_more false - so total_count is the unpaginated total, not the page size."
        test_recipe:
          setup:
            - "Partner Cascadia Water exists with three products filed in a known order: Water Line Protect, Sewer Guard Basic, then Interior Plumbing Plus."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { p1_id: $.data.id }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Sewer Guard Basic", line_type: "SEWER_LATERAL", ownership_boundary: "PROPERTY_LINE", required_owned_segment: "SEWER_PROPERTY_LINE_TO_MAIN", monthly_price_cents: 3299, waiting_period_days: 30, per_occurrence_cap_cents: 900000, annual_cap_cents: 1200000 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { p2_id: $.data.id }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Interior Plumbing Plus", line_type: "INTERIOR_PLUMBING", ownership_boundary: "INSIDE", required_owned_segment: "INTERIOR_PLUMBING_SYSTEM", monthly_price_cents: 1899, waiting_period_days: 30, per_occurrence_cap_cents: 300000, annual_cap_cents: 500000 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /service-line-products?partner_id=${partner_id}&limit=2&offset=0"
              payload: {}
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /service-line-products?partner_id=${partner_id}&limit=2&offset=2"
              payload: {}
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "page 1 - HTTP 200 with response_type array, limit 2, offset 0, total_count 3, has_more true"
            - "page 1 - ${page1_first} == ${p1_id} and ${page1_second} == ${p2_id}  # created_at ASC"
            - "page 2 - limit 2, offset 2, total_count 3, has_more false and exactly one element"
            - "page 2 - ${page2_first} == ${p3_id}"
            - "total_count is 3 on BOTH pages: it counts matching rows, not returned rows"

      - name: partner_not_found_returns_partner_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_PARTNER_NOT_FOUND
          - endpoints.GET /partners/{partnerId}
        distinguishing_aspect: "A well-formed but unknown UUID must yield ERR_PARTNER_NOT_FOUND (404), not ERR_INVALID_REQUEST - the id parses, it simply does not exist."
        test_recipe:
          setup:
            - "One unrelated partner exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id }
          trigger:
            - call: "GET /partners/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { error_id: $.data.error_id }
          assert:
            - "${error_id} == ERR_PARTNER_NOT_FOUND with HTTP 404 and response_type error"
            - "the error envelope carries data.error_id and data.message and no other business payload"
            - "GET /partners still returns total_count 1 containing ${partner_id}"

      - name: campaign_creation_missing_required_drop_date_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST /campaigns
          - errors.ERR_INVALID_REQUEST
          - entities.MarketingCampaign.fields.drop_date
        distinguishing_aspect: "drop_date carries no default, so omitting it must fail with ERR_INVALID_REQUEST (400) BEFORE any state is written - and specifically not with a null drop_date silently stored."
        test_recipe:
          setup:
            - "Partner Cascadia Water is ACTIVE with one filed product, so no other validation can pre-empt the shape check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed and ready.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /campaigns"
              payload: { partner_id: "${partner_id}", product_id: "${product_id}", name: "August postcard", piece_type: "POSTCARD", requested_quantity: 100 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { error_id: $.data.error_id }
          assert:
            - "${error_id} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /campaigns?partner_id=${partner_id} returns total_count 0  # nothing was persisted"

      - name: premises_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Premises.fields.do_not_mail
          - entities.Premises.fields.address_status
          - entities.Premises.fields.known_defect_reported_at
          - endpoints.POST /premises
        distinguishing_aspect: "Omitting all three optional Premises inputs must yield do_not_mail false, address_status GOOD and known_defect_reported_at null - and the derived suppression_reason must read NONE rather than being left unset."
        test_recipe:
          setup:
            - "Partner Cascadia Water exists; no enrollment or campaign has touched the premises."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id }
          trigger:
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"] }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, dnm: $.data.do_not_mail, addr: $.data.address_status, defect: $.data.known_defect_reported_at, hold: $.data.regulator_hold, suppression: $.data.suppression_reason, suppressed: $.data.suppressed, decision: $.data.last_mail_decision, last_reason: $.data.last_mail_suppression_reason, mail_count: $.data.mail_count_current_year, version: $.data.version }
          assert:
            - "HTTP 201 with ${dnm} == false, ${addr} == GOOD and ${defect} == null"
            - "${hold} == false, ${suppression} == NONE and ${suppressed} == false"
            - "${decision} == NOT_EVALUATED, ${last_reason} == null and ${mail_count} == 0"
            - "${version} == 1"

      - name: enrollment_computed_dates_ignore_client_supplied_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Enrollment.fields.coverage_effective_at
          - entities.Enrollment.fields.term_start_date
          - entities.Enrollment.fields.term_end_date
          - entities.Enrollment.fields.monthly_price_cents
          - calculations.enrollment_term_and_coverage_dates
        distinguishing_aspect: "The create body smuggles coverage_effective_at, term_end_date and monthly_price_cents. All three are source computed, so all three must be recomputed from the clock and the product - the supplied values must not appear anywhere in the response."
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product priced at 2499 cents/month and waiting_period_days 30."
            - "One OR premises owning WATER_CURB_STOP_TO_HOME; the clock stands at 2026-08-05T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed and ready.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"] }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", coverage_effective_at: "2026-08-05T00:00:00.000Z", term_end_date: "2099-01-01", monthly_price_cents: 1 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id, effective: $.data.coverage_effective_at, t_start: $.data.term_start_date, t_end: $.data.term_end_date, price: $.data.monthly_price_cents, prepaid: $.data.prepaid_amount_cents, cap_year: $.data.cap_year_start }
          assert:
            - "${effective} == 2026-09-04T00:00:00.000Z, NOT the supplied 2026-08-05T00:00:00.000Z  # term_start + waiting_period_days 30"
            - "${t_start} == 2026-08-05 and ${t_end} == 2027-08-05, NOT the supplied 2099-01-01  # term_start plus 12 calendar months"
            - "${price} == 2499, NOT the supplied 1  # copied from the product"
            - "${prepaid} == 29988  # DIRECT_BILL default of monthly_price_cents * 12, since prepaid_amount_cents was omitted"
            - "${cap_year} == 2026-08-05  # ENROLLMENT_ANNIVERSARY basis"

      - name: partner_system_fields_are_server_minted_input_ignored
        claim_type: system_fields
        grounds:
          - entities.UtilityPartner
          - endpoints.POST /partners
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted; a create body that supplies all four must have every one of them ignored, and the minted created_at must equal the logical clock rather than wall time."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned to 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", id: "11111111-1111-4111-8111-111111111111", created_at: "1999-01-01T00:00:00.000Z", updated_at: "1999-01-01T00:00:00.000Z", version: 99 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, created_at: $.data.created_at, updated_at: $.data.updated_at, version: $.data.version }
          assert:
            - "${partner_id} != 11111111-1111-4111-8111-111111111111"
            - "${created_at} == 2026-08-01T00:00:00.000Z and ${updated_at} == 2026-08-01T00:00:00.000Z"
            - "${version} == 1, NOT 99"
            - "GET /partners/${partner_id} returns the minted id; GET /partners/11111111-1111-4111-8111-111111111111 returns ERR_PARTNER_NOT_FOUND"

      - name: partner_utility_type_rejects_an_invalid_enum_value
        claim_type: type_constraints
        grounds:
          - entities.UtilityPartner.fields.utility_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "utility_type is constrained to {WATER, WASTEWATER, ELECTRIC, COMBINATION}; a syntactically valid but out-of-domain string must be rejected with ERR_INVALID_REQUEST rather than stored verbatim."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned to 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /partners"
              payload: { name: "Cascadia Telecom", utility_type: "TELECOM", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { error_id: $.data.error_id }
          assert:
            - "${error_id} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /partners returns total_count 0"

      - name: ledger_entry_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.LedgerEntry
          - endpoints.GET /ledger-entries/{ledgerEntryId}
          - endpoints.GET /ledger-entries
        distinguishing_aspect: "LedgerEntry is declared common_fields: false, so it must expose id and created_at only - no version, no updated_at - and §1.5 must offer no write endpoint for it at all: money moves only as a side effect of a business call."
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product; one OR premises enrolled DIRECT_BILL on 2026-08-05. POST /enrollments posts no ledger row of its own, so the single CASH PREMIUM_PAYMENT row under test is posted by an explicit billing event of 29988 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed and ready.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"] }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /enrollments/${enrollment_id}/billing-events"
              payload: { event_type: "PREMIUM_PAYMENT", effective_date: "2026-08-05", amount_cents: 29988, memo: "Opening annual prepayment." }
              as: BillingOps
              as_user_id: "bill-001"
          trigger:
            - call: "GET /ledger-entries?enrollment_id=${enrollment_id}"
              payload: {}
              as: BillingOps
              as_user_id: "bill-001"
              captures: { row_id: "$.data[0].id", row_kind: "$.data[0].ledger_kind", row_type: "$.data[0].entry_type", row_amount: "$.data[0].amount_cents" }
            - call: "GET /ledger-entries/${row_id}"
              payload: {}
              as: BillingOps
              as_user_id: "bill-001"
              captures: { read_id: $.data.id, read_created: $.data.created_at }
          assert:
            - "total_count == 1 with ${row_kind} == CASH, ${row_type} == PREMIUM_PAYMENT and ${row_amount} == 29988"
            - "${read_id} == ${row_id} and ${read_created} == 2026-08-05T00:00:00.000Z"
            - "the LedgerEntry projection contains id and created_at but NO version and NO updated_at field"
            - "§1.5 declares no POST, PUT, PATCH or DELETE on /ledger-entries: the only way to write one is a business side effect"
            - "GET /ledger-entries/00000000-0000-4000-8000-000000000000 returns ERR_LEDGER_ENTRY_NOT_FOUND with HTTP 404"

      - name: service_line_product_requires_an_existing_parent_partner
        claim_type: parent_relationships
        grounds:
          - entities.ServiceLineProduct.fields.partner_id
          - errors.ERR_PARTNER_NOT_FOUND
          - validations.body-fk-exists
        distinguishing_aspect: "entity_topology is flat, so the parent arrives in the BODY rather than the path: an unknown partner_id must produce ERR_PARTNER_NOT_FOUND (404) rather than a 400, and no orphan product may be created."
        test_recipe:
          setup:
            - "One unrelated partner exists so the products collection has a legitimate parent available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id }
          trigger:
            - call: "POST /service-line-products"
              payload: { partner_id: "00000000-0000-4000-8000-000000000000", name: "Orphan Product", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000 }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { error_id: $.data.error_id }
          assert:
            - "${error_id} == ERR_PARTNER_NOT_FOUND with HTTP 404"
            - "GET /service-line-products returns total_count 0"
            - "GET /partners/${partner_id} still reports version 1: the refused create touched nothing"

      - name: claim_recurrence_link_must_name_a_claim_on_the_same_enrollment
        claim_type: parent_relationships
        grounds:
          - entities.Claim.fields.recurrence_of_claim_id
          - validations.recurrence-link-valid
          - errors.ERR_INVALID_RECURRENCE_LINK
          - calculations.claim_eligibility_assessment.recurrence_rule
        distinguishing_aspect: "The self-referential FK is not merely checked for existence: the referenced claim must share the enrollment AND the line_type AND fall inside RECURRENCE_WINDOW_DAYS 30. A claim on a DIFFERENT enrollment exists, so a plain existence check passes and only the relational check catches it."
        test_recipe:
          setup:
            - "Partner Cascadia Water ACTIVE with the Water Line Protect product."
            - "TWO OR premises are each enrolled DIRECT_BILL on 2026-08-05, so there are two independent enrollments; the nightly run at 2026-09-10T08:00:00.000Z activates both."
