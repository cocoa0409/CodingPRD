            - "the cross-project route creation returns 409 with data.error_id == \"ERR_CROSS_PROJECT_REFERENCE\""
            - "GET /cabling/projects/${proj1} returns total_link_count == 1 and GET /cabling/projects/${proj2} returns total_link_count == 0"
            - "GET /cabling/pathway-segments/${seg2} returns occupying_route_count == 0 and version == ${seg2_v1}"

      - name: route_continuity_is_checked_against_the_previous_index_and_forbids_duplicates
        claim_type: cascading_validation
        grounds:
