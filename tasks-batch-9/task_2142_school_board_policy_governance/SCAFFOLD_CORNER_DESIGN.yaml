              payload: { yes_member_ids: ["${bm1}", "${bm2}", "${bm3}"], no_member_ids: [], abstain_member_ids: [] }
              as: BoardPresident
              as_user_id: "${bm1}"
              captures: { item_status: $.data.status, outcome: $.data.vote_outcome }
            - call: "GET /governance/policies/${pol}"
              payload: {}
              as: Public
              captures: { pol_state: $.data.compliance_state, pol_adopted: $.data.adopted_version_no }
          assert:
            - "captured item_status == ACTED and captured outcome == PASSED"
            - "captured pol_adopted == 1"
            - "captured pol_state == COMPLIANT"
            - "Policy.${pol}.status == ADOPTED"
            - "Policy.${pol}.last_review_date == 2026-08-02T18:00:00Z"
            - "PolicyVersion.${pv1}.status == ADOPTED"
            - "PolicyVersion.${pv1}.effective_date == 2026-08-02T18:00:00Z"
            - "PolicyVersion.${pv1}.reading_count == 2"
