# =============================================================================
# §1.8 Scaffold Difficulty Design — Task 2312
# Consumer Affairs & Product Quality Contact Center
#
# All nine Difficulty Rules, 21 instances. Every `assert` value below was
# pre-computed from the §1.3 formulas; no assertion restates a formula.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    rule_summary: "The same quantity is computed under two variants whose results diverge on identical data."
    instances:

      - name: severity_provisional_vs_adjudicated_band_divergence
        grounds: "§1.3 complaint_severity_score, variants intake_provisional and triage_adjudicated; §1.1 Complaint.provisional_severity_score / adjudicated_severity_score / effective_severity_band"
        distinguishing_aspect: "Divergence inside ONE entity's own two severity fields, driven by the regulated-food multiplier reaching across to Product. The band flips S3 -> S2, so downstream template eligibility changes too."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Staff AG1 (CareAgent, TIER_1) and SUP1 (CareSupervisor, TIER_3) exist and are active; Consumer C-1 exists with is_vulnerable_flag false."
            - "Plant P-CHI, line L-01, and the REGULATED-food product SKU-CRACKER exist; ProductionLot A1B-2026-0710 is RELEASED with 200000 units_produced."
            - "One ILLNESS Complaint sits on that lot in handling_status INTAKE with product_identification_status RESOLVED (the reported batch code normalised onto the lot), symptom_codes [NAUSEA, CRAMPS], and its provisional severity already stored; adjudicated_severity_score is still null."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Felt ill after eating the crackers." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: ILLNESS, reported_batch_code: "a1b 2026 0710", symptom_codes: [NAUSEA, CRAMPS] }, captures: { cp1: "$.data.id", cp1_prov: "$.data.provisional_severity_score", cp1_prov_band: "$.data.provisional_severity_band" } }
          trigger:
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Adjudicated against regulated SKU." }, captures: { adj: "$.data.adjudicated_severity_score", adj_band: "$.data.adjudicated_severity_band", eff: "$.data.effective_severity_band" } }
          assert:
            - "setup complaint response: provisional_severity_score == 57.00 and provisional_severity_band == \"S3\""
            - "trigger response: adjudicated_severity_score == 61.28 (57 * 1.075 rounded half-up)"
            - "trigger response: adjudicated_severity_band == \"S2\" while provisional_severity_band is still \"S3\""
            - "trigger response: effective_severity_band == \"S2\""
            - "trigger response: provisional_severity_score is UNCHANGED at 57.00 — the provisional variant is never retro-fitted"

      - name: lot_rate_provisional_vs_adjudicated_numerator_divergence
        grounds: "§1.3 lot_complaint_rate_ppm, variants provisional and adjudicated; §1.5 GET /production-lots/{id}/complaint-rate"
        distinguishing_aspect: "Divergence in a CROSS-ENTITY aggregate read rather than a per-row score: the two variants differ by which rows enter the numerator (input-set filtering), not by which constants are applied. Different entity (ProductionLot) and different algorithm family (aggregation vs weighted_scoring)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1 and SUP1 exist; Consumer C-1 exists."
            - "ProductionLot A1B-2026-0710 is RELEASED with exactly 200000 units_produced on line L-01 of plant P-CHI."
            - "Three non-duplicate Complaints resolve to that one lot (ILLNESS, QUALITY, PACKAGING)."
            - "Exactly ONE of the three has been triaged, so the lot holds provisional_complaint_count 2 and adjudicated_complaint_count 1 and only one complaint carries a non-null adjudicated_severity_score."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: EMAIL, received_at: "2026-08-01T00:00:00Z", raw_message: "Three separate packs were bad." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: ILLNESS, reported_batch_code: "A1B20260710", symptom_codes: [NAUSEA, CRAMPS] }, captures: { cp1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710" }, captures: { cp2: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: PACKAGING, reported_batch_code: "A1B20260710" }, captures: { cp3: "$.data.id" } }
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Only this one has been adjudicated." } }
          trigger:
            - { call: "GET /production-lots/${lot1}/complaint-rate", as: CareSupervisor, as_user_id: "${sup1}", payload: { variant: provisional }, captures: { prov_num: "$.data.numerator", prov_rate: "$.data.rate_ppm" } }
            - { call: "GET /production-lots/${lot1}/complaint-rate", as: CareSupervisor, as_user_id: "${sup1}", payload: { variant: adjudicated }, captures: { adj_num: "$.data.numerator", adj_rate: "$.data.rate_ppm" } }
          assert:
            - "provisional read: numerator == 3, units_produced == 200000, rate_ppm == 15.00, rate_undefined == false"
            - "adjudicated read: numerator == 1, units_produced == 200000, rate_ppm == 5.00, rate_undefined == false"
            - "the two variants differ by exactly 10.00 ppm on identical stored data"
            - "ProductionLot.linked_complaint_count == 3, provisional_complaint_count == 2, adjudicated_complaint_count == 1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    rule_summary: "A formula whose result depends on the combination and the ORDER of several inputs, so that reordering or fusing steps yields a different answer."
    instances:

      - name: severity_sequential_rounding_order_is_normative
        grounds: "§1.3 complaint_severity_score formula, step_1 / step_2 with round_half_up after EACH multiplier; constants VULNERABLE_MULTIPLIER 1.15, REGULATED_MULTIPLIER 1.075"
        distinguishing_aspect: "Mode (b) — nested rounding. Two multiplicative stages where rounding between them changes the final cent: sequential gives 111.89, a single fused multiplication gives 111.88."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1 and SUP1 (TIER_3) exist; Consumer C-1 exists."
            - "The product SKU-CRACKER has is_regulated_food true, so the REGULATED_MULTIPLIER 1.075 will be live at triage."
            - "One FOREIGN_MATERIAL Complaint on lot A1B-2026-0710 is in handling_status INTAKE with foreign_object_class HARD_BLUNT, medical_attention_sought true, three symptom_codes and vulnerable_consumer true, so the VULNERABLE_MULTIPLIER 1.15 will also be live."
            - "Its provisional_severity_score is already stored as the pre-multiplier additive total."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: WEB, received_at: "2026-08-01T00:00:00Z", raw_message: "Metal fragment, child bit it, we saw a doctor." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "A1B20260710", foreign_object_class: HARD_BLUNT, medical_attention_sought: true, symptom_codes: [MOUTH_INJURY, PAIN, BLEEDING], vulnerable_consumer: true }, captures: { cp1: "$.data.id" } }
          trigger:
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Hard blunt object, vulnerable consumer, regulated SKU." }, captures: { adj: "$.data.adjudicated_severity_score" } }
          assert:
            - "setup complaint response: provisional_severity_score == 90.50 (40 + 15 + 25 + 3.5*3, no multipliers)"
            - "trigger response: adjudicated_severity_score == 111.89"
            - "111.89 is the SEQUENTIAL result: round(90.5 * 1.15) = 104.08, then round(104.08 * 1.075) = 111.89"
            - "the fused alternative round(90.5 * 1.15 * 1.075) = 111.88 must NOT be returned — a one-cent difference distinguishes a correct implementation"
            - "trigger response: adjudicated_severity_band == \"S1\" (score is not capped at 100)"

      - name: goodwill_uplift_rate_keyed_on_base_not_payout
        grounds: "§1.3 goodwill_authorization: uplift_pct is selected from base_value_cents, uplift_cents from base * uplift_pct, payout_cents from base + uplift, authority_tier_required from payout"
        distinguishing_aspect: "Mode (c) — circular-looking dependency resolved by a pinned evaluation order. Four interlocking money fields on a DIFFERENT entity (Remedy) with a DIFFERENT algorithm family (tiered_pricing); the trap is keying the rate on the payout it helps produce."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1 exists; Consumer C-1 exists with every goodwill bucket at 0."
            - "The product SKU-CRACKER has unit_retail_price_cents 2500, so a two-unit claim caps the base at 5000 cents."
            - "One QUALITY Complaint on lot A1B-2026-0710 is in handling_status INTAKE with units_claimed 2 and its version captured for the OCC guard."
            - "No Remedy exists yet on that complaint, and no SampleKit has been requested, so no kit-returned credit can apply."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Two packs were stale, want my money back." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710", units_claimed: 2 }, captures: { cp1: "$.data.id", cp1_v: "$.data.version" } }
          trigger:
            - { call: "POST /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", remedy_type: REFUND, requested_value_cents: 4900, expected_complaint_version: "${cp1_v}" }, captures: { rm1: "$.data.id", base: "$.data.base_value_cents", up: "$.data.uplift_cents", pay: "$.data.payout_cents", tier: "$.data.authority_tier_required" } }
          assert:
            - "trigger response: base_value_cents == 4900 (min(4900, 2500 * 2) = 4900; no sample credit, so kit_returned_credit_applied == false)"
            - "trigger response: uplift_pct == 0.10 — the rate is chosen from base 4900, which is below UPLIFT_HIGH_MIN 5000"
            - "trigger response: uplift_cents == 490 and payout_cents == 5390"
            - "the payout-keyed alternative must NOT be returned: keying the rate on payout 5390 would give 0.05, uplift 270 and payout 5170"
            - "trigger response: authority_tier_required == \"TIER_2\" (5390 is above TIER_1_MAX_CENTS 2500 and at or below TIER_2_MAX_CENTS 7500)"

      - name: trend_gate_requires_both_weighted_count_and_rate
        grounds: "§1.3 trend_signal_evaluation: fires(scope) = weighted >= MIN_WEIGHTED_COUNT AND rate >= THRESHOLD_PPM[scope_level]; constants MIN_WEIGHTED_COUNT 3.0, THRESHOLD_PPM.LOT 25.0, SEVERITY_WEIGHT"
        distinguishing_aspect: "Mode (a) — non-linear multi-input gate. Three inputs (severity weights, complaint count, units denominator) combine through a conjunction, so a lot with a much HIGHER rate (50.00 ppm) fires nothing while a lot with a lower rate (30.00 ppm) fires. Neither input alone predicts the outcome; a different entity (TrendSignal) and a different algorithm (threshold)."
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-08-02T00:00:00Z before the trigger."
            - "Staff AG1 (CareAgent) and QL1 (QualityLead, TIER_3) exist; Consumer C-1 exists."
            - "Two RELEASED lots sit on the same line L-01 of plant P-CHI: LOT-B with 100000 units_produced and LOT-C with 40000 units_produced."
            - "Three plain FOREIGN_MATERIAL Complaints resolve to LOT-B and two resolve to LOT-C; all five are in handling_status INTAKE and were created at 2026-08-01T00:00:00Z, inside the 30-day window that ends at the run clock."
            - "No TrendSignal exists, and the plant's oversight_posture is NORMAL."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_1 }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "QL1", full_name: "Quinn Li", role: QUALITY_LEAD, authority_tier: TIER_3 }, captures: { ql1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "LOT-B", code_date: "2026-07-10T00:00:00Z", units_produced: 100000 }, captures: { lotb: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "LOT-C", code_date: "2026-07-11T00:00:00Z", units_produced: 40000 }, captures: { lotc: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: SOCIAL, received_at: "2026-08-01T00:00:00Z", raw_message: "Reporting several bad packs across two batches." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTB" }, captures: { b1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTB" }, captures: { b2: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTB" }, captures: { b3: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTC" }, captures: { c_1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTC" }, captures: { c_2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-02T00:00:00Z" } }
          trigger:
            - { call: "POST /quality-ops-runs", as: QualityLead, as_user_id: "${ql1}", payload: { dry_run: false }, captures: { created: "$.data.signals_created_count", members: "$.data.memberships_created_count" } }
          assert:
            - "every setup complaint has provisional_severity_score == 40.00, provisional_severity_band == \"S3\", SEVERITY_WEIGHT 1"
            - "LOT-B: weighted_complaint_count == 3.00, units_in_scope == 100000, observed_rate_ppm == 30.00 -> FIRES (3.00 >= 3.0 and 30.00 >= 25.0)"
            - "LOT-C: weighted_complaint_count == 2.00, units_in_scope == 40000, observed_rate_ppm == 50.00 -> DOES NOT FIRE even though its rate is 20 ppm higher, because 2.00 < MIN_WEIGHTED_COUNT 3.0"
            - "trigger response: signals_created_count == 1 and memberships_created_count == 3"
            - "GET /trend-signals with lot_id = LOT-C returns total_count 0; with lot_id = LOT-B returns total_count 1 with scope_level \"LOT\", threshold_ppm 25.0, detection_source \"OPS_RUN\""
            - "no LINE or PLANT signal is created: the unconsumed remainder after LOT-B is consumed is LOT-C alone, weighted 2.00 < 3.0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    rule_summary: "A state machine that is not a straight line — parallel dimensions, or a bounded cycle."
    instances:

      - name: complaint_handling_and_regulatory_dimensions_advance_independently
        grounds: "§1.2 Complaint.handling_status (cyclic) and Complaint.regulatory_status (parallel), plus the guard on POST /complaints/{id}/close requiring the regulatory dimension to be settled"
        distinguishing_aspect: "PARALLEL shape: two dimensions on the same row move on disjoint triggers, and only one join point couples them. Demonstrates orthogonality first, then the single guard."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; staff AG1, SUP1 (TIER_3), RO1 and RO2 (two distinct RegulatoryOfficers, for the segregation-of-duties pair on determine/submit) all exist."
