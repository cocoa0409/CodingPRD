      grounds:
        - endpoints.POST_/draw-entries/{entry_id}/claims
        - errors[ERR_INVALID_STATE]
        - state_machines.DrawEntry.WINNER_to_PURCHASED
      distinguishing_aspect: "A claim against an entry that is not WINNER is refused at priority 5b with ERR_INVALID_STATE, so a WAITLISTED entry cannot be converted into a purchase by calling the claim endpoint directly."
      test_recipe:
        setup:
          - "Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production and an ONSALE performance."
          - "A DRAW allocation with daily_quantity 1, claim_window_minutes 30, winner_basis_points 10000 and waitlist_multiplier 1, released for epoch 2026-09-12."
          - "Two patrons entered; the draw executed at 09:05 made the first WINNER and the second WAITLISTED."
        setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-12T09:00:00Z" }
            as: PlatformAdmin
          - call: "POST /markets"
            payload: { market_code: "NYC", city: "New York", handoff_model: "MOBILE_PUSH" }
            as: PlatformAdmin
          - call: "POST /productions"
            payload: { title: "Claim Theatre Play", producer_org: "Corner Partners", refund_window_hours: 720, exchange_fee_cents: 300, exchange_allowed: true }
