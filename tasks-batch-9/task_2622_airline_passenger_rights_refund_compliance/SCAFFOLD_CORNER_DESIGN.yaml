        distinguishing_aspect: "LINK 2b touches only PENDING_DELIVERY children: the flown segment's DELIVERED 2000 ancillary is left alone, so the ledger lands on 63000 (60000 un-flown fare + 3000 for the cancelled leg's ancillary) instead of 65000."
