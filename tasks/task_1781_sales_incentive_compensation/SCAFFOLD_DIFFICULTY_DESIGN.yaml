# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Sales Incentive Compensation Administration
# Canonical curve used across instances (unless overridden):
#   curve_tiers = [{attainment_floor_bps: 0, rate_bps: 1000},
#                  {attainment_floor_bps: 8000, rate_bps: 1500},
#                  {attainment_floor_bps: 10000, rate_bps: 2500}]
#   quota_cents = 1000000  (band edges: 0 / 800000 / 1000000 cents)
# Precomputed curve values (per-band round_half_up, then sum):
#   earned  200000 -> attainment  2000 bps, gross  20000
#   earned  500000 -> attainment  5000 bps, gross  50000
#   earned  999990 -> attainment  9999 bps, gross 109999  (b1 band 29998.5 -> 29999)
#   earned 1000000 -> attainment 10000 bps, gross 110000
#   earned 1000010 -> attainment 10000 bps, gross 110003  (b2 band 2.5 -> 3)
#   earned 1200000 -> attainment 12000 bps, gross 160000
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: attainment_direct_vs_rollup_mode
        grounds:
          - calculations.attainment_calculation
          - entities.CompPlan.fields.attainment_mode
          - entities.CreditEntry.fields.credit_type
        distinguishing_aspect: |
          Same raw credit magnitudes (300000 DIRECT + 300000 ROLLUP on the manager's
          assignment) produce attainment 3000 bps / gross 30000 under DIRECT_ONLY but
          6000 bps / gross 60000 under INCLUDE_ROLLUP — the two variants diverge on
          the CREDITING/attainment domain, selected by plan.attainment_mode.
        test_recipe:
          setup:
            - "Program A with PUBLISHED plan P-dir (attainment_mode DIRECT_ONLY, rollup_rate_bps 5000); manager M1 and rep R1 (manager M1), both with ACCEPTED assignments (quota 1000000)"
            - "M1 direct credit 300000; R1 direct credit 600000 which rolls up 300000 to M1"
            - "Program B mirrors A exactly except plan P-roll has attainment_mode INCLUDE_ROLLUP (manager M2, rep R2)"
            - "Both programs' period 1 closed"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog A" }, as: CompAdmin, captures: { prog_a: $.data.id, pv_a: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_a}", name: "Plan A", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }], attainment_mode: "DIRECT_ONLY", rollup_rate_bps: 5000 }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_a: $.data.id } }
            - { call: "POST /plans/${plan_a}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_a}", name: "Mgr One", employee_ref: "A-M1" }, as: CompAdmin, captures: { m1: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_a}", name: "Rep One", employee_ref: "A-R1", manager_id: "${m1}" }, as: CompAdmin, captures: { r1: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_a}", rep_id: "${m1}", plan_id: "${plan_a}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_m1: $.data.id } }
            - { call: "POST /assignments/${asg_m1}/accept", payload: {}, as: Rep, as_user_id: "${m1}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_a}", rep_id: "${r1}", plan_id: "${plan_a}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_r1: $.data.id } }
            - { call: "POST /assignments/${asg_r1}/accept", payload: {}, as: Rep, as_user_id: "${r1}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_a}", external_ref: "A-T1", amount_cents: 300000, transaction_date: "2026-02-01", splits: [{ rep_id: "${m1}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /transactions", payload: { program_id: "${prog_a}", external_ref: "A-T2", amount_cents: 600000, transaction_date: "2026-02-02", splits: [{ rep_id: "${r1}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /programs/${prog_a}/close-period", payload: { expected_program_version: "${pv_a}" }, as: CompAdmin }
            - { call: "POST /programs", payload: { name: "Prog B" }, as: CompAdmin, captures: { prog_b: $.data.id, pv_b: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_b}", name: "Plan B", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }], attainment_mode: "INCLUDE_ROLLUP", rollup_rate_bps: 5000 }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_b: $.data.id } }
            - { call: "POST /plans/${plan_b}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_b}", name: "Mgr Two", employee_ref: "B-M2" }, as: CompAdmin, captures: { m2: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_b}", name: "Rep Two", employee_ref: "B-R2", manager_id: "${m2}" }, as: CompAdmin, captures: { r2: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_b}", rep_id: "${m2}", plan_id: "${plan_b}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_m2: $.data.id } }
            - { call: "POST /assignments/${asg_m2}/accept", payload: {}, as: Rep, as_user_id: "${m2}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_b}", rep_id: "${r2}", plan_id: "${plan_b}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_r2: $.data.id } }
            - { call: "POST /assignments/${asg_r2}/accept", payload: {}, as: Rep, as_user_id: "${r2}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_b}", external_ref: "B-T1", amount_cents: 300000, transaction_date: "2026-02-01", splits: [{ rep_id: "${m2}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /transactions", payload: { program_id: "${prog_b}", external_ref: "B-T2", amount_cents: 600000, transaction_date: "2026-02-02", splits: [{ rep_id: "${r2}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /programs/${prog_b}/close-period", payload: { expected_program_version: "${pv_b}" }, as: CompAdmin }
          trigger:
            - { call: "GET /statements?assignment_id=${asg_m1}&period_index=1", as: CompAdmin, captures: { m1_att: "$.data[0].attainment_bps", m1_gross: "$.data[0].gross_payout_cents", m1_earned: "$.data[0].earned_credits_cents" } }
            - { call: "GET /statements?assignment_id=${asg_m2}&period_index=1", as: CompAdmin, captures: { m2_att: "$.data[0].attainment_bps", m2_gross: "$.data[0].gross_payout_cents", m2_earned: "$.data[0].earned_credits_cents" } }
          assert:
            - "statement of ${asg_m1}: earned_credits_cents == 300000 (ROLLUP excluded), attainment_bps == 3000, gross_payout_cents == 30000"
            - "statement of ${asg_m2}: earned_credits_cents == 600000 (ROLLUP included), attainment_bps == 6000, gross_payout_cents == 60000"
            - "captured ${m1_att} == 3000 and ${m2_att} == 6000 despite identical raw credit magnitudes"

      - name: payout_provisional_vs_final_estimate
        grounds:
          - calculations.payout_estimate
          - entities.PlanAssignment.fields.provisional_period_payout_cents
          - calculations.period_settlement
        distinguishing_aspect: |
          Identical underlying credits (one 1200000 PENDING credit) yield
          provisional_period_payout_cents == 160000 (forward-looking: PENDING
          included, cap/draw/guarantee ignored) while the final PayoutStatement
          gross_payout_cents == 0 (PENDING excluded at close) — the two variants
          diverge on the PAYOUT domain, not the attainment domain.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan (no cap, rollup_rate_bps 0); rep with ACTIVE assignment quota 1000000 left in acceptance_status OFFERED"
            - "Transaction T1 of 1200000 booked 100% to the rep; because the assignment is not ACCEPTED its DIRECT credit parks PENDING"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Prov" }, as: CompAdmin, captures: { prog_p: $.data.id, pv_p: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_p}", name: "Plan P", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_p: $.data.id } }
            - { call: "POST /plans/${plan_p}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_p}", name: "Rep Prov", employee_ref: "P-R1" }, as: CompAdmin, captures: { rp: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_p}", rep_id: "${rp}", plan_id: "${plan_p}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_p: $.data.id } }
            - { call: "POST /transactions", payload: { program_id: "${prog_p}", external_ref: "P-T1", amount_cents: 1200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rp}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "GET /assignments/${asg_p}", as: CompAdmin, captures: { prov_before: "$.data.provisional_period_payout_cents", earned_before: "$.data.current_period_earned_cents" } }
          trigger:
            - { call: "POST /programs/${prog_p}/close-period", payload: { expected_program_version: "${pv_p}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_p}&period_index=1", as: CompAdmin, captures: { st_gross: "$.data[0].gross_payout_cents", st_earned: "$.data[0].earned_credits_cents" } }
            - { call: "GET /assignments/${asg_p}", as: CompAdmin, captures: { prov_after: "$.data.provisional_period_payout_cents" } }
          assert:
            - "before close: PlanAssignment.${asg_p}.provisional_period_payout_cents == 160000 while current_period_earned_cents == 0 (credit still PENDING)"
            - "statement: earned_credits_cents == 0 and gross_payout_cents == 0 (final variant excludes PENDING)"
            - "after close: provisional_period_payout_cents == 160000 (PENDING still assumed future-posting) — provisional 160000 != final 0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: curve_marginal_tier_straddle
        grounds:
          - calculations.quota_to_payout_curve
          - entities.CompPlan.fields.curve_tiers
          - entities.CompPlan.fields.payout_cap_cents
        distinguishing_aspect: |
          Mode (a): a 4-input non-linear formula (earned x quota x 3 tier rates x cap)
          with marginal band selection via nested clamp/min/max — earned 1200000
          straddles all three tiers giving uncapped 160000, then min() with
          payout_cap_cents 150000 yields gross 150000 with payout_cap_applied == true.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan (canonical tiers, payout_cap_cents 150000); rep with ACCEPTED assignment quota 1000000, no draw, no guarantee"
            - "Transaction of 1200000 booked 100% to the rep and POSTED"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Curve" }, as: CompAdmin, captures: { prog_c: $.data.id, pv_c: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_c}", name: "Plan C", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }], payout_cap_cents: 150000 }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_c: $.data.id } }
            - { call: "POST /plans/${plan_c}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_c}", name: "Rep Curve", employee_ref: "C-R1" }, as: CompAdmin, captures: { rc: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_c}", rep_id: "${rc}", plan_id: "${plan_c}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_c: $.data.id } }
            - { call: "POST /assignments/${asg_c}/accept", payload: {}, as: Rep, as_user_id: "${rc}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_c}", external_ref: "C-T1", amount_cents: 1200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rc}", split_bps: 10000 }] }, as: CompAnalyst }
          trigger:
            - { call: "POST /programs/${prog_c}/close-period", payload: { expected_program_version: "${pv_c}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_c}&period_index=1", as: CompAdmin, captures: { st_gross: "$.data[0].gross_payout_cents", st_cap: "$.data[0].payout_cap_applied", st_att: "$.data[0].attainment_bps" } }
          assert:
            - "attainment_bps == 12000"
            - "uncapped curve would be 80000 + 30000 + 50000 = 160000; with cap: gross_payout_cents == 150000"
            - "payout_cap_applied == true"
            - "net_payable_cents == 150000 (no draw, no guarantee)"

      - name: split_rounding_remainder_allocation
        grounds:
          - calculations.split_credit_allocation
          - entities.SalesTransaction.fields.splits
          - entities.CreditEntry.fields.credit_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — round_half_up PER SPLIT first,
          then reconcile the remainder onto the single largest split_bps (tie:
          lowest array index). 100001 cents split 3333/3333/3334 rounds per-split
          to 33330/33330/33340 (sum 100000), so the +1 remainder lands on the
          third split: 33330/33330/33341. 'Sum then round' would give a different
          per-rep distribution.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan; three manager-less reps R1/R2/R3 each with ACCEPTED assignment (quota 1000000)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Split" }, as: CompAdmin, captures: { prog_s: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prog_s}", name: "Plan S", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_s: $.data.id } }
            - { call: "POST /plans/${plan_s}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_s}", name: "S Rep1", employee_ref: "S-R1" }, as: CompAdmin, captures: { sr1: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_s}", name: "S Rep2", employee_ref: "S-R2" }, as: CompAdmin, captures: { sr2: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_s}", name: "S Rep3", employee_ref: "S-R3" }, as: CompAdmin, captures: { sr3: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_s}", rep_id: "${sr1}", plan_id: "${plan_s}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_s1: $.data.id } }
            - { call: "POST /assignments/${asg_s1}/accept", payload: {}, as: Rep, as_user_id: "${sr1}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_s}", rep_id: "${sr2}", plan_id: "${plan_s}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_s2: $.data.id } }
            - { call: "POST /assignments/${asg_s2}/accept", payload: {}, as: Rep, as_user_id: "${sr2}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_s}", rep_id: "${sr3}", plan_id: "${plan_s}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_s3: $.data.id } }
            - { call: "POST /assignments/${asg_s3}/accept", payload: {}, as: Rep, as_user_id: "${sr3}" }
          trigger:
            - { call: "POST /transactions", payload: { program_id: "${prog_s}", external_ref: "S-T1", amount_cents: 100001, transaction_date: "2026-02-01", splits: [{ rep_id: "${sr1}", split_bps: 3333 }, { rep_id: "${sr2}", split_bps: 3333 }, { rep_id: "${sr3}", split_bps: 3334 }] }, as: CompAnalyst, captures: { txn_s: $.data.id } }
            - { call: "GET /credit-entries?transaction_id=${txn_s}&rep_id=${sr1}", as: CompAdmin, captures: { cr1_amt: "$.data[0].credit_amount_cents" } }
            - { call: "GET /credit-entries?transaction_id=${txn_s}&rep_id=${sr2}", as: CompAdmin, captures: { cr2_amt: "$.data[0].credit_amount_cents" } }
            - { call: "GET /credit-entries?transaction_id=${txn_s}&rep_id=${sr3}", as: CompAdmin, captures: { cr3_amt: "$.data[0].credit_amount_cents" } }
          assert:
            - "credit of ${sr1} == 33330 (round_half_up(100001*3333/10000) = round_half_up(33330.3333))"
            - "credit of ${sr2} == 33330"
            - "credit of ${sr3} == 33341 (33340 + remainder +1 as largest split_bps)"
            - "33330 + 33330 + 33341 == 100001 == SalesTransaction.${txn_s}.amount_cents"

      - name: settlement_evaluation_order_draw_guarantee
        grounds:
          - calculations.period_settlement
          - entities.PlanAssignment.fields.draw_amount_cents_per_period
          - entities.PlanAssignment.fields.guarantee_amount_cents_per_period
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          draw recovery is min(gross, outstanding) computed BEFORE the guarantee
          true-up, and the true-up tops up the post-recovery net. Earned 1200000,
          draw 50000, guarantee 120000 yields net_payable 120000; the reversed
          order (guarantee first, then recovery from the topped-up amount) would
          yield 70000, so the pinned order is observable.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan (no cap); rep with ACCEPTED assignment quota 1000000, draw_amount_cents_per_period 50000 (recoverable), guarantee_amount_cents_per_period 120000"
            - "Transaction of 1200000 POSTED in period 1"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Settle" }, as: CompAdmin, captures: { prog_st: $.data.id, pv_st: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_st}", name: "Plan ST", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_st: $.data.id } }
            - { call: "POST /plans/${plan_st}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_st}", name: "Rep ST", employee_ref: "ST-R1" }, as: CompAdmin, captures: { rst: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_st}", rep_id: "${rst}", plan_id: "${plan_st}", quota_cents: 1000000, draw_amount_cents_per_period: 50000, draw_recoverable: true, guarantee_amount_cents_per_period: 120000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_st: $.data.id } }
            - { call: "POST /assignments/${asg_st}/accept", payload: {}, as: Rep, as_user_id: "${rst}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_st}", external_ref: "ST-T1", amount_cents: 1200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rst}", split_bps: 10000 }] }, as: CompAnalyst }
          trigger:
            - { call: "POST /programs/${prog_st}/close-period", payload: { expected_program_version: "${pv_st}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_st}&period_index=1", as: CompAdmin, captures: { st_net: "$.data[0].net_payable_cents", st_rec: "$.data[0].draw_recovered_cents", st_true: "$.data[0].guarantee_trueup_cents" } }
          assert:
            - "gross_payout_cents == 160000"
            - "draw_paid_cents == 50000 and draw_recovered_cents == min(160000, 50000) == 50000 (recovery BEFORE guarantee)"
            - "net_before_guarantee == 160000 - 50000 == 110000; guarantee_trueup_cents == max(0, 120000 - 110000) == 10000"
            - "net_payable_cents == 110000 + 10000 == 120000 (NOT 70000 as guarantee-first ordering would give)"
            - "PlanAssignment.${asg_st}.draw_outstanding_cents == 0 and lifetime_paid_cents == 120000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_acceptance_cycle_on_plan_revise
        grounds:
          - state_machines.PlanAssignment.ACCEPTED_to_OFFERED
          - state_machines.CompPlan.PUBLISHED_to_PUBLISHED
          - entities.PlanAssignment.fields.accepted_document_version
        distinguishing_aspect: |
          PlanAssignment carries a genuine cycle on its acceptance dimension:
          OFFERED -> ACCEPTED -> (plan revise) OFFERED -> ACCEPTED, while the
          lifecycle dimension stays ACTIVE throughout (parallel dimensions);
          accepted_document_version tracks 1 -> (still 1 while OFFERED) -> 2.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan (document_version 1, version 2 after publish); rep with assignment ACCEPTED at document_version 1"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Cyc" }, as: CompAdmin, captures: { prog_cy: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prog_cy}", name: "Plan CY", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_cy: $.data.id } }
            - { call: "POST /plans/${plan_cy}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2", captures: { plan_cy_v: $.data.version } }
            - { call: "POST /reps", payload: { program_id: "${prog_cy}", name: "Rep CY", employee_ref: "CY-R1" }, as: CompAdmin, captures: { rcy: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_cy}", rep_id: "${rcy}", plan_id: "${plan_cy}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_cy: $.data.id } }
            - { call: "POST /assignments/${asg_cy}/accept", payload: {}, as: Rep, as_user_id: "${rcy}" }
          trigger:
            - { call: "POST /plans/${plan_cy}/revise", payload: { expected_plan_version: "${plan_cy_v}", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1100 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-2", captures: { plan_cy_doc: $.data.document_version } }
            - { call: "GET /assignments/${asg_cy}", as: CompAdmin, captures: { cy_acc1: "$.data.acceptance_status", cy_docv1: "$.data.accepted_document_version", cy_status: "$.data.status" } }
            - { call: "POST /assignments/${asg_cy}/accept", payload: {}, as: Rep, as_user_id: "${rcy}" }
            - { call: "GET /assignments/${asg_cy}", as: CompAdmin, captures: { cy_acc2: "$.data.acceptance_status", cy_docv2: "$.data.accepted_document_version" } }
          assert:
            - "after revise: CompPlan.${plan_cy}.document_version == 2"
            - "after revise: PlanAssignment.${asg_cy}.acceptance_status == OFFERED (cycle back) while status == ACTIVE (lifecycle dimension unchanged)"
            - "accepted_document_version still == 1 while OFFERED (historical acceptance)"
            - "after re-accept: acceptance_status == ACCEPTED and accepted_document_version == 2"

      - name: dispute_branching_fork_with_divergent_side_effects
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_APPROVED
          - state_machines.Dispute.SUBMITTED_to_REJECTED
          - state_machines.Dispute.UNDER_REVIEW_to_WITHDRAWN
        distinguishing_aspect: |
          Dispute is a branching machine: UNDER_REVIEW forks to APPROVED (side
          effect: APPROVED Adjustment of source DISPUTE is created) vs REJECTED
          (no adjustment) vs WITHDRAWN (no adjustment) — three terminal branches
          with divergent side-effect sets, on a different entity than
          PlanAssignment's cycle.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan; rep with ACCEPTED assignment quota 1000000; transaction of 200000 POSTED in period 1 (credited_for_period == 200000)"
            - "Three sequential disputes on (assignment, period 1): D1 approved after review, D2 rejected from SUBMITTED, D3 withdrawn from UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Disp" }, as: CompAdmin, captures: { prog_d: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prog_d}", name: "Plan D", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_d: $.data.id } }
            - { call: "POST /plans/${plan_d}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_d}", name: "Rep D", employee_ref: "D-R1" }, as: CompAdmin, captures: { rd: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_d}", rep_id: "${rd}", plan_id: "${plan_d}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_d: $.data.id } }
            - { call: "POST /assignments/${asg_d}/accept", payload: {}, as: Rep, as_user_id: "${rd}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_d}", external_ref: "D-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rd}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /disputes", payload: { assignment_id: "${asg_d}", period_index: 1, reason: "CREDIT_AMOUNT", requested_amount_cents: 30000 }, as: Rep, as_user_id: "${rd}", captures: { d1: $.data.id } }
            - { call: "POST /disputes/${d1}/start-review", payload: {}, as: CompManager }
          trigger:
            - { call: "POST /disputes/${d1}/approve", payload: { approved_amount_cents: 30000 }, as: CompManager }
            - { call: "POST /disputes", payload: { assignment_id: "${asg_d}", period_index: 1, reason: "DRAW_ERROR", requested_amount_cents: 20000 }, as: Rep, as_user_id: "${rd}", captures: { d2: $.data.id } }
            - { call: "POST /disputes/${d2}/reject", payload: {}, as: CompManager }
            - { call: "POST /disputes", payload: { assignment_id: "${asg_d}", period_index: 1, reason: "OTHER", requested_amount_cents: 10000 }, as: Rep, as_user_id: "${rd}", captures: { d3: $.data.id } }
            - { call: "POST /disputes/${d3}/start-review", payload: {}, as: CompManager }
            - { call: "POST /disputes/${d3}/withdraw", payload: {}, as: Rep, as_user_id: "${rd}" }
            - { call: "GET /adjustments?dispute_id=${d1}", as: CompAdmin, captures: { adj1_amt: "$.data[0].amount_cents", adj1_src: "$.data[0].source", adj1_status: "$.data[0].status" } }
          assert:
            - "Dispute.${d1}.status == APPROVED and approved_amount_cents == 30000"
            - "APPROVED branch side effect: Adjustment for ${d1} exists with amount_cents == 30000, source == DISPUTE, status == APPROVED, period_index == 1"
            - "Dispute.${d2}.status == REJECTED; GET /adjustments?dispute_id=${d2} returns an empty array (REJECTED branch has no adjustment side effect)"
            - "Dispute.${d3}.status == WITHDRAWN; GET /adjustments?dispute_id=${d3} returns an empty array"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: transaction_posting_rollup_chain
        grounds:
          - state_machines.SalesTransaction.create_to_BOOKED
          - state_machines.CreditEntry.PENDING_to_POSTED
          - calculations.rollup_credit_amount
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /transactions: transaction create ->
          (link 1) DIRECT CreditEntry POSTED for the rep -> (link 2) the POSTED
          transition itself spawns a ROLLUP CreditEntry for the manager (NOT a
          fan-out of the create) -> (link 3) the rollup's own POSTED transition
          increments the manager assignment's current_period_earned_cents.
          200000 at rollup_rate_bps 5000 => rollup 100000.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan (rollup_rate_bps 5000); manager M and rep R (manager_id = M) both with ACCEPTED assignments on the plan (quota 1000000)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Roll" }, as: CompAdmin, captures: { prog_ro: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prog_ro}", name: "Plan RO", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }], rollup_rate_bps: 5000 }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_ro: $.data.id } }
            - { call: "POST /plans/${plan_ro}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_ro}", name: "Mgr RO", employee_ref: "RO-M1" }, as: CompAdmin, captures: { mro: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_ro}", name: "Rep RO", employee_ref: "RO-R1", manager_id: "${mro}" }, as: CompAdmin, captures: { rro: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_ro}", rep_id: "${mro}", plan_id: "${plan_ro}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_mro: $.data.id } }
            - { call: "POST /assignments/${asg_mro}/accept", payload: {}, as: Rep, as_user_id: "${mro}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_ro}", rep_id: "${rro}", plan_id: "${plan_ro}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_rro: $.data.id } }
            - { call: "POST /assignments/${asg_rro}/accept", payload: {}, as: Rep, as_user_id: "${rro}" }
          trigger:
            - { call: "POST /transactions", payload: { program_id: "${prog_ro}", external_ref: "RO-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rro}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_ro: $.data.id } }
            - { call: "GET /credit-entries?transaction_id=${txn_ro}&rep_id=${rro}", as: CompAdmin, captures: { cr_direct: "$.data[0].id", cr_direct_status: "$.data[0].status" } }
            - { call: "GET /credit-entries?parent_credit_id=${cr_direct}", as: CompAdmin, captures: { cr_roll_amt: "$.data[0].credit_amount_cents", cr_roll_status: "$.data[0].status", cr_roll_asg: "$.data[0].assignment_id" } }
            - { call: "GET /assignments/${asg_rro}", as: CompAdmin, captures: { r_earned: "$.data.current_period_earned_cents" } }
            - { call: "GET /assignments/${asg_mro}", as: CompAdmin, captures: { m_earned: "$.data.current_period_earned_cents" } }
          assert:
            - "link 1: DIRECT credit ${cr_direct} for ${rro} is POSTED with credit_amount_cents == 200000 and posted_period_index == 1"
            - "link 2: ROLLUP credit exists with parent_credit_id == ${cr_direct}, credit_amount_cents == 100000 (round_half_up(200000 * 5000/10000)), status POSTED"
            - "link 3: PlanAssignment.${asg_mro}.current_period_earned_cents == 100000 (rollup posting incremented the manager's earned — a consequence of link 2, not of the transaction directly)"
            - "PlanAssignment.${asg_rro}.current_period_earned_cents == 200000"

      - name: transaction_cancel_clawback_chain
        grounds:
          - state_machines.SalesTransaction.BOOKED_to_CANCELLED
          - state_machines.CreditEntry.LOCKED_to_REVERSED
          - entities.Adjustment.fields.source
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (POST /transactions/{id}/cancel):
          cancel -> (link 1) LOCKED credits REVERSED (period already closed) ->
          (link 2) each locked reversal spawns an auto-APPROVED CLAWBACK Adjustment
          of -credit_amount_cents into the CURRENT open period — 200000 direct and
          100000 rollup produce adjustments of -200000 (rep) and -100000 (manager).
        test_recipe:
          setup:
            - "Program with PUBLISHED plan (rollup_rate_bps 5000); manager M + rep R (manager M), both ACCEPTED; transaction of 200000 booked and POSTED in period 1 (with 100000 rollup to M)"
            - "Period 1 closed: both credits LOCKED; program now in period 2"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Claw" }, as: CompAdmin, captures: { prog_cl: $.data.id, pv_cl: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_cl}", name: "Plan CL", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }], rollup_rate_bps: 5000 }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_cl: $.data.id } }
            - { call: "POST /plans/${plan_cl}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_cl}", name: "Mgr CL", employee_ref: "CL-M1" }, as: CompAdmin, captures: { mcl: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_cl}", name: "Rep CL", employee_ref: "CL-R1", manager_id: "${mcl}" }, as: CompAdmin, captures: { rcl: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_cl}", rep_id: "${mcl}", plan_id: "${plan_cl}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_mcl: $.data.id } }
            - { call: "POST /assignments/${asg_mcl}/accept", payload: {}, as: Rep, as_user_id: "${mcl}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_cl}", rep_id: "${rcl}", plan_id: "${plan_cl}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_rcl: $.data.id } }
            - { call: "POST /assignments/${asg_rcl}/accept", payload: {}, as: Rep, as_user_id: "${rcl}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_cl}", external_ref: "CL-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rcl}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_cl: $.data.id } }
            - { call: "GET /credit-entries?transaction_id=${txn_cl}&rep_id=${rcl}", as: CompAdmin, captures: { cr_cl_direct: "$.data[0].id" } }
            - { call: "POST /programs/${prog_cl}/close-period", payload: { expected_program_version: "${pv_cl}" }, as: CompAdmin, captures: { pv_cl2: $.data.version } }
          trigger:
            - { call: "POST /transactions/${txn_cl}/cancel", payload: {}, as: CompAnalyst }
            - { call: "GET /credit-entries/${cr_cl_direct}", as: CompAdmin, captures: { cr_cl_status: "$.data.status" } }
            - { call: "GET /credit-entries?parent_credit_id=${cr_cl_direct}", as: CompAdmin, captures: { cr_cl_roll_status: "$.data[0].status" } }
            - { call: "GET /adjustments?assignment_id=${asg_rcl}", as: CompAdmin, captures: { adj_r_amt: "$.data[0].amount_cents", adj_r_src: "$.data[0].source", adj_r_period: "$.data[0].period_index", adj_r_status: "$.data[0].status" } }
            - { call: "GET /adjustments?assignment_id=${asg_mcl}", as: CompAdmin, captures: { adj_m_amt: "$.data[0].amount_cents", adj_m_src: "$.data[0].source" } }
          assert:
            - "SalesTransaction.${txn_cl}.status == CANCELLED"
            - "link 1: DIRECT credit ${cr_cl_direct} status == REVERSED; ROLLUP child status == REVERSED"
            - "link 2: Adjustment on ${asg_rcl}: amount_cents == -200000, source == CLAWBACK, status == APPROVED, period_index == 2 (the open period, not the closed one)"
            - "link 2 (rollup branch): Adjustment on ${asg_mcl}: amount_cents == -100000, source == CLAWBACK"
            - "PlanAssignment.${asg_rcl}.current_period_earned_cents == 0 (LOCKED reversal does NOT touch open-period earned; the clawback flows through the adjustment instead)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispute_approve_state_vs_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_DISPUTE_AMOUNT_EXCEEDS_CREDIT]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): approving an already-REJECTED
          dispute with approved_amount_cents (50000) exceeding requested (30000)
          violates BOTH the state precondition (p4) and the fiscal bound (p9);
          the state error ERR_INVALID_STATE_TRANSITION must win.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan; rep ACCEPTED; transaction 200000 POSTED in period 1; dispute D requested 30000 already REJECTED by a manager"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog PC1" }, as: CompAdmin, captures: { prog_pc1: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prog_pc1}", name: "Plan PC1", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_pc1: $.data.id } }
            - { call: "POST /plans/${plan_pc1}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_pc1}", name: "Rep PC1", employee_ref: "PC1-R1" }, as: CompAdmin, captures: { rpc1: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_pc1}", rep_id: "${rpc1}", plan_id: "${plan_pc1}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_pc1: $.data.id } }
            - { call: "POST /assignments/${asg_pc1}/accept", payload: {}, as: Rep, as_user_id: "${rpc1}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_pc1}", external_ref: "PC1-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rpc1}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /disputes", payload: { assignment_id: "${asg_pc1}", period_index: 1, reason: "CREDIT_AMOUNT", requested_amount_cents: 30000 }, as: Rep, as_user_id: "${rpc1}", captures: { dpc1: $.data.id } }
            - { call: "POST /disputes/${dpc1}/reject", payload: {}, as: CompManager }
          trigger:
            - { call: "POST /disputes/${dpc1}/approve", payload: { approved_amount_cents: 50000 }, as: CompManager, captures: { err_pc1: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (state p4 beats business_fiscal p9), HTTP 409"
            - "Dispute.${dpc1}.status remains REJECTED; GET /adjustments?dispute_id=${dpc1} is empty (no partial side effect)"

      - name: dispute_create_temporal_vs_referential
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_DISPUTE_WINDOW_CLOSED]
          - errors[ERR_DISPUTE_CREDIT_ENTRY_MISMATCH]
        distinguishing_aspect: |
          Category pair (business_temporal, business_referential) — different
          from instance dispute_approve_state_vs_fiscal: filing a dispute for a
          period 3 back (window closed) that ALSO references a credit entry of a
          different assignment must surface ERR_DISPUTE_WINDOW_CLOSED (p6 beats p8).
        test_recipe:
          setup:
            - "Program with PUBLISHED plan; reps RA and RB both ACCEPTED; transaction TA 200000 to RA in period 1, transaction TB 300000 to RB in period 2; three closes bring current_period_index to 4"
            - "RB's period-2 credit entry id is known (belongs to RB's assignment)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog PC2" }, as: CompAdmin, captures: { prog_pc2: $.data.id, pv_pc2: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_pc2}", name: "Plan PC2", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_pc2: $.data.id } }
            - { call: "POST /plans/${plan_pc2}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_pc2}", name: "Rep PC2A", employee_ref: "PC2-RA" }, as: CompAdmin, captures: { ra: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_pc2}", name: "Rep PC2B", employee_ref: "PC2-RB" }, as: CompAdmin, captures: { rb: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_pc2}", rep_id: "${ra}", plan_id: "${plan_pc2}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_ra: $.data.id } }
            - { call: "POST /assignments/${asg_ra}/accept", payload: {}, as: Rep, as_user_id: "${ra}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_pc2}", rep_id: "${rb}", plan_id: "${plan_pc2}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_rb: $.data.id } }
            - { call: "POST /assignments/${asg_rb}/accept", payload: {}, as: Rep, as_user_id: "${rb}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_pc2}", external_ref: "PC2-TA", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${ra}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /programs/${prog_pc2}/close-period", payload: { expected_program_version: "${pv_pc2}" }, as: CompAdmin, captures: { pv_pc2b: $.data.version } }
            - { call: "POST /transactions", payload: { program_id: "${prog_pc2}", external_ref: "PC2-TB", amount_cents: 300000, transaction_date: "2026-03-01", splits: [{ rep_id: "${rb}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_rb: $.data.id } }
            - { call: "GET /credit-entries?transaction_id=${txn_rb}&rep_id=${rb}", as: CompAdmin, captures: { cr_rb: "$.data[0].id" } }
            - { call: "POST /programs/${prog_pc2}/close-period", payload: { expected_program_version: "${pv_pc2b}" }, as: CompAdmin, captures: { pv_pc2c: $.data.version } }
            - { call: "POST /programs/${prog_pc2}/close-period", payload: { expected_program_version: "${pv_pc2c}" }, as: CompAdmin }
          trigger:
            - { call: "POST /disputes", payload: { assignment_id: "${asg_ra}", period_index: 1, credit_entry_id: "${cr_rb}", reason: "CREDIT_AMOUNT", requested_amount_cents: 10000 }, as: Rep, as_user_id: "${ra}", captures: { err_pc2: $.data.error_id } }
          assert:
            - "error_id == ERR_DISPUTE_WINDOW_CLOSED (business_temporal p6 beats business_referential p8), HTTP 409"
            - "no dispute row created for (${asg_ra}, period 1): GET /disputes?assignment_id=${asg_ra} is empty"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: attainment_exactly_100pct_tier_boundary
        grounds:
          - calculations.attainment_calculation
          - calculations.quota_to_payout_curve
          - entities.PayoutStatement.fields.attainment_bps
        distinguishing_aspect: |
          Metric: attainment_bps at the 10000 bps (100%) accelerator floor;
          endpoint: close-period + statements. floor() semantics: 999990 earned
          -> 9999 bps (no accelerator band, gross 109999); exactly 1000000 ->
          10000 bps (top tier reached with zero band credit, gross 110000);
          1000010 -> gross 110003 (2.5 rounds half-up to 3 in the top band).
        test_recipe:
          setup:
            - "Program with PUBLISHED plan (canonical tiers, no cap); three manager-less reps R1/R2/R3 with ACCEPTED assignments (quota 1000000)"
            - "Transactions POSTED in period 1: R1 999990, R2 1000000, R3 1000010"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Bnd" }, as: CompAdmin, captures: { prog_b: $.data.id, pv_b: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_b}", name: "Plan B", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_b: $.data.id } }
            - { call: "POST /plans/${plan_b}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_b}", name: "B Rep1", employee_ref: "B-R1" }, as: CompAdmin, captures: { br1: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_b}", name: "B Rep2", employee_ref: "B-R2" }, as: CompAdmin, captures: { br2: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_b}", name: "B Rep3", employee_ref: "B-R3" }, as: CompAdmin, captures: { br3: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_b}", rep_id: "${br1}", plan_id: "${plan_b}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_b1: $.data.id } }
            - { call: "POST /assignments/${asg_b1}/accept", payload: {}, as: Rep, as_user_id: "${br1}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_b}", rep_id: "${br2}", plan_id: "${plan_b}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_b2: $.data.id } }
            - { call: "POST /assignments/${asg_b2}/accept", payload: {}, as: Rep, as_user_id: "${br2}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_b}", rep_id: "${br3}", plan_id: "${plan_b}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_b3: $.data.id } }
            - { call: "POST /assignments/${asg_b3}/accept", payload: {}, as: Rep, as_user_id: "${br3}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_b}", external_ref: "B-T1", amount_cents: 999990, transaction_date: "2026-02-01", splits: [{ rep_id: "${br1}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /transactions", payload: { program_id: "${prog_b}", external_ref: "B-T2", amount_cents: 1000000, transaction_date: "2026-02-01", splits: [{ rep_id: "${br2}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /transactions", payload: { program_id: "${prog_b}", external_ref: "B-T3", amount_cents: 1000010, transaction_date: "2026-02-01", splits: [{ rep_id: "${br3}", split_bps: 10000 }] }, as: CompAnalyst }
          trigger:
            - { call: "POST /programs/${prog_b}/close-period", payload: { expected_program_version: "${pv_b}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_b1}&period_index=1", as: CompAdmin, captures: { b1_att: "$.data[0].attainment_bps", b1_gross: "$.data[0].gross_payout_cents" } }
            - { call: "GET /statements?assignment_id=${asg_b2}&period_index=1", as: CompAdmin, captures: { b2_att: "$.data[0].attainment_bps", b2_gross: "$.data[0].gross_payout_cents" } }
            - { call: "GET /statements?assignment_id=${asg_b3}&period_index=1", as: CompAdmin, captures: { b3_att: "$.data[0].attainment_bps", b3_gross: "$.data[0].gross_payout_cents" } }
          assert:
            - "R1: attainment_bps == 9999 (floor(999990*10000/1000000) = floor(9999.9)) and gross_payout_cents == 109999"
            - "R2: attainment_bps == 10000 (exactly at the accelerator floor — inclusive lower bound) and gross_payout_cents == 110000"
            - "R3: attainment_bps == 10000 and gross_payout_cents == 110003 (10 cents in the 2500 bps band: 2.5 -> round_half_up 3)"

      - name: dispute_window_exactly_two_periods_back
        grounds:
          - entities.Dispute.fields.period_index
          - errors[ERR_DISPUTE_WINDOW_CLOSED]
          - validations[priority=6]
        distinguishing_aspect: |
          Metric: period distance (current_period_index - period_index) — a
          different metric than attainment_bps and a different endpoint
          (POST /disputes) than the attainment boundary. With current period 4,
          distance exactly 2 (period 2) is ACCEPTED (inclusive bound) while
          distance 3 (period 1) is REJECTED with ERR_DISPUTE_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan; rep ACCEPTED; T1 200000 in period 1; close; T2 300000 in period 2; close; close; current_period_index == 4"
            - "credited_for_period: period 1 -> 200000, period 2 -> 300000"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Win" }, as: CompAdmin, captures: { prog_w: $.data.id, pv_w: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_w}", name: "Plan W", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_w: $.data.id } }
            - { call: "POST /plans/${plan_w}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_w}", name: "Rep W", employee_ref: "W-R1" }, as: CompAdmin, captures: { rw: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_w}", rep_id: "${rw}", plan_id: "${plan_w}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_w: $.data.id } }
            - { call: "POST /assignments/${asg_w}/accept", payload: {}, as: Rep, as_user_id: "${rw}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_w}", external_ref: "W-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rw}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /programs/${prog_w}/close-period", payload: { expected_program_version: "${pv_w}" }, as: CompAdmin, captures: { pv_w2: $.data.version } }
            - { call: "POST /transactions", payload: { program_id: "${prog_w}", external_ref: "W-T2", amount_cents: 300000, transaction_date: "2026-03-01", splits: [{ rep_id: "${rw}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /programs/${prog_w}/close-period", payload: { expected_program_version: "${pv_w2}" }, as: CompAdmin, captures: { pv_w3: $.data.version } }
            - { call: "POST /programs/${prog_w}/close-period", payload: { expected_program_version: "${pv_w3}" }, as: CompAdmin }
          trigger:
            - { call: "POST /disputes", payload: { assignment_id: "${asg_w}", period_index: 2, reason: "CREDIT_MISSING", requested_amount_cents: 10000 }, as: Rep, as_user_id: "${rw}", captures: { disp_w: $.data.id } }
            - { call: "POST /disputes", payload: { assignment_id: "${asg_w}", period_index: 1, reason: "CREDIT_MISSING", requested_amount_cents: 10000 }, as: Rep, as_user_id: "${rw}", captures: { err_w: $.data.error_id } }
          assert:
            - "period_index 2 (distance exactly 2): dispute created, status SUBMITTED — the window bound current-2 is INCLUSIVE"
            - "period_index 1 (distance 3): error_id == ERR_DISPUTE_WINDOW_CLOSED, HTTP 409"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_creation_requires_published_plan
        grounds:
          - state_machines.CompPlan.DRAFT_to_PUBLISHED
          - errors[ERR_PLAN_NOT_PUBLISHED]
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair PlanAssignment -> CompPlan: POST /assignments is rejected
          with ERR_PLAN_NOT_PUBLISHED while the referenced plan is DRAFT, and
          succeeds for the same payload after the plan transitions to PUBLISHED.
        test_recipe:
          setup:
            - "Program with a DRAFT plan (never published); one rep"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog XDep" }, as: CompAdmin, captures: { prog_x: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prog_x}", name: "Plan X", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_x: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_x}", name: "Rep X", employee_ref: "X-R1" }, as: CompAdmin, captures: { rx: $.data.id } }
          trigger:
            - { call: "POST /assignments", payload: { program_id: "${prog_x}", rep_id: "${rx}", plan_id: "${plan_x}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { err_x: $.data.error_id } }
            - { call: "POST /plans/${plan_x}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /assignments", payload: { program_id: "${prog_x}", rep_id: "${rx}", plan_id: "${plan_x}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_x: $.data.id } }
          assert:
            - "while DRAFT: error_id == ERR_PLAN_NOT_PUBLISHED, HTTP 409, no assignment created"
            - "after publish: identical payload succeeds (201), assignment status ACTIVE / acceptance_status OFFERED"

      - name: period_close_blocked_by_open_disputes
        grounds:
          - state_machines.PayoutStatement.create_to_DRAFT
          - errors[ERR_OPEN_DISPUTES_EXIST]
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair CompProgram -> Dispute (different pair than
          PlanAssignment -> CompPlan): close-period is rejected with
          ERR_OPEN_DISPUTES_EXIST while any dispute of the program is
          SUBMITTED; after the dispute reaches a terminal state (REJECTED),
          the same close succeeds and advances current_period_index to 2.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan; rep ACCEPTED; transaction 200000 POSTED in period 1; one dispute on period 1 in SUBMITTED"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Gate" }, as: CompAdmin, captures: { prog_g: $.data.id, pv_g: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_g}", name: "Plan G", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }, { attainment_floor_bps: 8000, rate_bps: 1500 }, { attainment_floor_bps: 10000, rate_bps: 2500 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_g: $.data.id } }
            - { call: "POST /plans/${plan_g}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_g}", name: "Rep G", employee_ref: "G-R1" }, as: CompAdmin, captures: { rg: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_g}", rep_id: "${rg}", plan_id: "${plan_g}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_g: $.data.id } }
            - { call: "POST /assignments/${asg_g}/accept", payload: {}, as: Rep, as_user_id: "${rg}" }
            - { call: "POST /transactions", payload: { program_id: "${prog_g}", external_ref: "G-T1", amount_cents: 200000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rg}", split_bps: 10000 }] }, as: CompAnalyst }
            - { call: "POST /disputes", payload: { assignment_id: "${asg_g}", period_index: 1, reason: "CURVE_MISAPPLIED", requested_amount_cents: 10000 }, as: Rep, as_user_id: "${rg}", captures: { disp_g: $.data.id } }
          trigger:
            - { call: "POST /programs/${prog_g}/close-period", payload: { expected_program_version: "${pv_g}" }, as: CompAdmin, captures: { err_g: $.data.error_id } }
            - { call: "POST /disputes/${disp_g}/reject", payload: {}, as: CompManager }
            - { call: "POST /programs/${prog_g}/close-period", payload: { expected_program_version: "${pv_g}" }, as: CompAdmin, captures: { prog_g_after: "$.data.current_period_index" } }
          assert:
            - "first close: error_id == ERR_OPEN_DISPUTES_EXIST, HTTP 409, current_period_index stays 1"
            - "after dispute REJECTED (terminal): close succeeds; CompProgram.current_period_index == 2"
            - "statement for (${asg_g}, period 1) exists with earned_credits_cents == 200000"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: plan_window_closed_interval_overlap
        grounds:
          - entities.CompPlan.fields.effective_start_date
          - entities.CompPlan.fields.effective_end_date
          - errors[ERR_PLAN_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: CLOSED [start, end] on the CompPlan resource —
          plan B starting 2026-06-30 collides with plan A ending 2026-06-30
          (shared single date counts as overlap), while a plan starting
          2026-07-01 is accepted. Contrasts with the half-open assignment rule.
        test_recipe:
          setup:
            - "Program with plan A effective [2026-01-01, 2026-06-30] (DRAFT)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Win" }, as: CompAdmin, captures: { prog_pw: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prog_pw}", name: "Plan WA", effective_start_date: "2026-01-01", effective_end_date: "2026-06-30", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_wa: $.data.id } }
          trigger:
            - { call: "POST /plans", payload: { program_id: "${prog_pw}", name: "Plan WB", effective_start_date: "2026-06-30", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { err_pw: $.data.error_id } }
            - { call: "POST /plans", payload: { program_id: "${prog_pw}", name: "Plan WC", effective_start_date: "2026-07-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_wc: $.data.id } }
          assert:
            - "plan [2026-06-30, 2026-12-31]: error_id == ERR_PLAN_WINDOW_OVERLAP, HTTP 409 (closed interval: shared boundary date 2026-06-30 overlaps)"
            - "plan [2026-07-01, 2026-12-31]: 201 created (first non-overlapping start)"

      - name: assignment_window_half_open_adjacency
        grounds:
          - entities.PlanAssignment.fields.effective_start_date
          - entities.PlanAssignment.fields.effective_end_date
          - errors[ERR_ASSIGNMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on the PlanAssignment
          resource — the same rep may hold back-to-back assignments where the
          next start EQUALS the previous end (adjacency allowed, unlike plans),
          and null end means open-ended; a mid-window start is rejected.
        test_recipe:
          setup:
            - "Program with PUBLISHED full-year plan; one rep; assignment A1 [2026-01-01, 2026-06-30) already created"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Aw" }, as: CompAdmin, captures: { prog_aw: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prog_aw}", name: "Plan AW", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_aw: $.data.id } }
            - { call: "POST /plans/${plan_aw}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_aw}", name: "Rep AW", employee_ref: "AW-R1" }, as: CompAdmin, captures: { raw: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_aw}", rep_id: "${raw}", plan_id: "${plan_aw}", quota_cents: 1000000, effective_start_date: "2026-01-01", effective_end_date: "2026-06-30" }, as: CompAdmin, captures: { asg_aw1: $.data.id } }
          trigger:
            - { call: "POST /assignments", payload: { program_id: "${prog_aw}", rep_id: "${raw}", plan_id: "${plan_aw}", quota_cents: 900000, effective_start_date: "2026-06-30" }, as: CompAdmin, captures: { asg_aw2: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_aw}", rep_id: "${raw}", plan_id: "${plan_aw}", quota_cents: 800000, effective_start_date: "2026-06-15", effective_end_date: "2026-08-01" }, as: CompAdmin, captures: { err_aw: $.data.error_id } }
          assert:
            - "A2 [2026-06-30, open): 201 created — half-open adjacency, [2026-01-01,2026-06-30) and [2026-06-30,inf) are disjoint"
            - "A3 [2026-06-15, 2026-08-01): error_id == ERR_ASSIGNMENT_WINDOW_OVERLAP, HTTP 409 (intersects both A1 and A2)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: draw_ledger_conservation
        grounds:
          - calculations.draw_ledger
          - entities.PlanAssignment.fields.draw_outstanding_cents
          - entities.PlanAssignment.fields.draw_forgiven_cents
        distinguishing_aspect: |
          Conserved quantity: the draw debt ledger — at every instant
          draw_outstanding == sum(draw_paid) - sum(draw_recovered) - draw_forgiven.
          Forward action (period close pays a 50000 draw -> outstanding 50000)
          paired with the compensating action (terminate forgives the debt ->
          forgiven 50000, outstanding 0) leaves the identity exact at both steps.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan; rep ACCEPTED with draw_amount_cents_per_period 50000 (recoverable), no guarantee, no transactions"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Draw" }, as: CompAdmin, captures: { prog_dr: $.data.id, pv_dr: $.data.version } }
            - { call: "POST /plans", payload: { program_id: "${prog_dr}", name: "Plan DR", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_dr: $.data.id } }
            - { call: "POST /plans/${plan_dr}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_dr}", name: "Rep DR", employee_ref: "DR-R1" }, as: CompAdmin, captures: { rdr: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_dr}", rep_id: "${rdr}", plan_id: "${plan_dr}", quota_cents: 1000000, draw_amount_cents_per_period: 50000, draw_recoverable: true, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_dr: $.data.id } }
            - { call: "POST /assignments/${asg_dr}/accept", payload: {}, as: Rep, as_user_id: "${rdr}" }
          trigger:
            - { call: "POST /programs/${prog_dr}/close-period", payload: { expected_program_version: "${pv_dr}" }, as: CompAdmin }
            - { call: "GET /statements?assignment_id=${asg_dr}&period_index=1", as: CompAdmin, captures: { dr_paid: "$.data[0].draw_paid_cents", dr_rec: "$.data[0].draw_recovered_cents", dr_net: "$.data[0].net_payable_cents" } }
            - { call: "GET /assignments/${asg_dr}", as: CompAdmin, captures: { dr_out1: "$.data.draw_outstanding_cents" } }
            - { call: "POST /assignments/${asg_dr}/terminate", payload: {}, as: CompAdmin, captures: { dr_out2: "$.data.draw_outstanding_cents", dr_forg: "$.data.draw_forgiven_cents" } }
          assert:
            - "after close: statement draw_paid_cents == 50000, draw_recovered_cents == 0 (gross 0), net_payable_cents == 0"
            - "invariant after forward action: draw_outstanding_cents == 50000 == 50000 (paid) - 0 (recovered) - 0 (forgiven)"
            - "after compensating terminate: draw_forgiven_cents == 50000 and draw_outstanding_cents == 0 == 50000 - 0 - 50000 (identity holds, zero drift)"

      - name: credit_allocation_conservation
        grounds:
          - calculations.split_credit_allocation
          - state_machines.CreditEntry.POSTED_to_REVERSED
          - entities.CreditEntry.fields.status
        distinguishing_aspect: |
          Conserved quantity: allocated credit mass per transaction (a different
          quantity than the draw ledger) — forward action (booking 100001 across
          three splits) yields DIRECT credits summing EXACTLY to 100001; the
          compensating cancel flips every credit to REVERSED so the live
          (non-REVERSED) mass returns to 0 while the historical rows still sum
          to 100001 — no cents created or destroyed either way.
        test_recipe:
          setup:
            - "Program with PUBLISHED plan; three manager-less reps with ACCEPTED assignments"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog Mass" }, as: CompAdmin, captures: { prog_m: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${prog_m}", name: "Plan M", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_m: $.data.id } }
            - { call: "POST /plans/${plan_m}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${prog_m}", name: "M Rep1", employee_ref: "M-R1" }, as: CompAdmin, captures: { mr1: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_m}", name: "M Rep2", employee_ref: "M-R2" }, as: CompAdmin, captures: { mr2: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${prog_m}", name: "M Rep3", employee_ref: "M-R3" }, as: CompAdmin, captures: { mr3: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${prog_m}", rep_id: "${mr1}", plan_id: "${plan_m}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_m1: $.data.id } }
            - { call: "POST /assignments/${asg_m1}/accept", payload: {}, as: Rep, as_user_id: "${mr1}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_m}", rep_id: "${mr2}", plan_id: "${plan_m}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_m2: $.data.id } }
            - { call: "POST /assignments/${asg_m2}/accept", payload: {}, as: Rep, as_user_id: "${mr2}" }
            - { call: "POST /assignments", payload: { program_id: "${prog_m}", rep_id: "${mr3}", plan_id: "${plan_m}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_m3: $.data.id } }
            - { call: "POST /assignments/${asg_m3}/accept", payload: {}, as: Rep, as_user_id: "${mr3}" }
          trigger:
            - { call: "POST /transactions", payload: { program_id: "${prog_m}", external_ref: "M-T1", amount_cents: 100001, transaction_date: "2026-02-01", splits: [{ rep_id: "${mr1}", split_bps: 3333 }, { rep_id: "${mr2}", split_bps: 3333 }, { rep_id: "${mr3}", split_bps: 3334 }] }, as: CompAnalyst, captures: { txn_m: $.data.id } }
            - { call: "GET /credit-entries?transaction_id=${txn_m}&status=POSTED", as: CompAdmin, captures: { posted_first_amt: "$.data[0].credit_amount_cents" } }
            - { call: "POST /transactions/${txn_m}/cancel", payload: {}, as: CompAnalyst }
            - { call: "GET /credit-entries?transaction_id=${txn_m}", as: CompAdmin, captures: { m_c0: "$.data[0].status", m_c1: "$.data[1].status", m_c2: "$.data[2].status" } }
          assert:
            - "forward: the three POSTED credits are 33330, 33330, 33341 — sum == 100001 == amount_cents exactly (no cent lost to rounding)"
            - "compensating cancel: all three credits status == REVERSED; live (non-REVERSED) mass == 0"
            - "history preserved: the REVERSED rows still sum to 100001 (33330 + 33330 + 33341) — the pair of actions conserves recorded mass"
