              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off1_pre: $.data.id }
            - call: "POST /nature-center/program-offerings/${off1_id}/materials"
              payload: { phase: "POST_VISIT", url_slug: "pond-post" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off1_post: $.data.id }
            - call: "POST /nature-center/curriculum-materials/${off1_pre}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/curriculum-materials/${off1_post}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off1_id}/submit-for-review"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off1_id}/review"
              payload: { decision: "PUBLISH" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Forest Decomposers", grade_band: "G3_5", delivery_mode: "ONSITE_FIELD_TRIP", duration_minutes: 120, max_group_size: 60, min_chaperone_ratio_students_per_adult: 10, base_fee_cents_per_student: 900, requires_live_animal: false, requires_trail_segment: false, public_contact_required: false }
