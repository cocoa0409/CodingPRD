            - {call: "POST /egg-lots/${la}/grade", payload: {grade_a_count: 10000, cracked_count: 300, dirty_count: 150, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${la}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {lav: "$.data.version"}}
