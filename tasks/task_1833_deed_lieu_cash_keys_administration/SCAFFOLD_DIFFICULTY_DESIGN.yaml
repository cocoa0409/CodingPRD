  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: listing_open_suspension_clamped_at_eval
        grounds:
          - calculations.creditable_marketing_days
          - entities.MarketingListing.fields.creditable_days
          - state_machines.MarketingListing.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Interval semantics = whole-day union-merge with OPEN-INTERVAL CLAMPING on
          the listing's marketing-clock resource: an open suspension (ended_at null)
          is treated as ending at the evaluation date. Listing 2026-05-01 suspended
          2026-06-01 and never resumed, evaluated 2026-08-01: span 92 minus clamped
          suspension 61 = creditable 31 (an implementation ignoring the open
          interval would report 92).
        test_recipe:
          setup:
            - "DIL case LN-OV1 in MARKETING_PERIOD; listing dated 2026-05-01; suspended at 2026-06-01T00:00Z (reason: title objection) and never resumed; clock at 2026-08-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-OV1", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "A. Borrower", email: "a@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { lst_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/listings/${lst_id}/suspend", payload: { reason: "title objection" }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
          trigger:
            - { call: "GET /property-solutions/listings/${lst_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { cd: $.data.creditable_days } }
            - { call: "GET /property-solutions/listings/${lst_id}/suspensions", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { open_end: "$.data[0].ended_at" } }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
          assert:
            - "MarketingListing.${lst_id}.creditable_days == 31 (span 92 - clamped suspension 61)"
            - "The suspension's ended_at is null (still open) yet its days are counted through the evaluation date"
            - "certify-marketing -> ERR_MARKETING_PERIOD_NOT_MET (31 < 90); case stays MARKETING_PERIOD"

      - name: inspector_buffer_conflict_half_open
        grounds:
          - validations[priority=10]
          - errors[ERR_INSPECTOR_SCHEDULE_CONFLICT]
          - entities.InspectionAppointment.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) extended by a 30-minute travel
          buffer at the end, on the inspector-schedule resource (different resource
          and different geometry from the listing's day-granularity union-merge):
          an appointment starting 11:15Z collides with an existing 10:00-11:00Z
          appointment (buffered to 11:30Z), while one starting exactly at 11:30Z —
          touching the buffer boundary — is allowed.
        test_recipe:
          setup:
            - "DIL case LN-OV2 at VACATE_PENDING; inspector insp_1 holds appointment 2026-09-05T10:00-11:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-OV2", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "A. Borrower", email: "a@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/title-commitments", payload: { case_id: "${case_id}" }, as: TitleOfficer, as_user_id: to_1, captures: { tc_id: $.data.id } }
            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "A. Borrower" }, as: TitleOfficer, as_user_id: to_1 }
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "GET /property-solutions/cases/${case_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_v: $.data.version } }
            - { call: "POST /property-solutions/cases/${case_id}/agreements", payload: { vacate_date: "2026-09-01", expected_case_version: "${case_v}" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ag_id: $.data.id } }
            - { call: "POST /property-solutions/agreements/${ag_id}/offer", payload: { offer_valid_days: 10 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/agreements/${ag_id}/accept", as: Borrower, as_user_id: "${bor_id}" }
            - { call: "POST /property-solutions/inspection-appointments", payload: { case_id: "${case_id}", inspector_id: "insp_1", appointment_type: HANDOVER, scheduled_start: "2026-09-05T10:00:00Z", scheduled_end: "2026-09-05T11:00:00Z" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ap1: $.data.id } }
          trigger:
            - { call: "POST /property-solutions/inspection-appointments", payload: { case_id: "${case_id}", inspector_id: "insp_1", appointment_type: RE_INSPECTION, scheduled_start: "2026-09-05T11:15:00Z", scheduled_end: "2026-09-05T12:00:00Z" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { err: $.data.error_id } }
            - { call: "POST /property-solutions/inspection-appointments", payload: { case_id: "${case_id}", inspector_id: "insp_1", appointment_type: RE_INSPECTION, scheduled_start: "2026-09-05T11:30:00Z", scheduled_end: "2026-09-05T12:30:00Z" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ap2: $.data.id } }
          assert:
            - "11:15Z start -> ERR_INSPECTOR_SCHEDULE_CONFLICT (409): inside the 30-minute buffer of the 10:00-11:00Z appointment"
            - "11:30Z start -> 201 created (touches the buffer boundary exactly; half-open semantics permit it)"
            - "InspectionAppointment.${ap2}.status == SCHEDULED"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: disburse_release_clawback_conserves_assistance
        grounds:
          - state_machines.Disbursement.APPROVED_to_RELEASED
          - state_machines.Disbursement.RELEASED_to_CLAWED_BACK
          - entities.WorkoutCase.fields.total_disbursed_cents
          - entities.WorkoutCase.fields.remaining_assistance_cents
        distinguishing_aspect: |
          Conserved quantity = ASSISTANCE DOLLARS: for the case,
          total_disbursed_cents (sum over RELEASED) + remaining_assistance_cents ==
          final_assistance_cents (475002) must hold before release, after a partial
          release of 200000, and after the compensating clawback — release and
          clawback move the same amount in opposite directions between the two
          fields, leaving the sum invariant.
        test_recipe:
          setup:
            - "DIL case LN-CI1 at DISBURSEMENT_PENDING with final_assistance 475002 (two MATERIAL deduction lines, handover 2026-09-05 = 1 penalty day, keys 2); disbursement of 200000 APPROVED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
