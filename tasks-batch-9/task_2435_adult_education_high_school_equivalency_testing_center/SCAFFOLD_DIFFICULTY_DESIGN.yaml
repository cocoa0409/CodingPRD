            - "Clock at 2026-09-02T10:00:00Z (exactly 30 days after the pre-test) with a POST_TEST scored 225 (EFL 4)."
            - "EFL_GAIN OutcomeRecord recorded by coord-1, CERTIFIED by state-1, then allocated FINAL: allocated_cents 10000, committed_cents 10000, available_cents 90000."
