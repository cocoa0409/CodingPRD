          Same error id, but a completely different (entity, blocking entity, endpoint) triple:
          here the mutated entity is a SubstitutionRequest in a legal REQUESTED state, and the
          blocker is its GRANDPARENT Order having advanced to LOADED via route dispatch
          (claim requires the parent order to be NEW or ALLOCATED). Note that CREATING the request
          is still legal at LOADED - only claim and approve are gated - so the failure surfaces one
