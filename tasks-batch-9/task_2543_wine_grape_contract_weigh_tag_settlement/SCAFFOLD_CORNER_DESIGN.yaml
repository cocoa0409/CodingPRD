      - name: independent_state_dimensions_move_without_disturbing_each_other
        claim_type: parallel
        excluded_because:
          difficulty_instance: weigh_tag_parallel_weigh_and_disposition_dimensions_with_dispute_cycle
          rationale: |
            The §1.8 instance already drives the WeighTag's weigh_status and disposition
            dimensions through every legal combination — GROSS_CAPTURED/PENDING,
            NET_FINAL/PENDING, NET_FINAL/ACCEPTED, NET_FINAL/DISPUTED and back — and
            asserts after each step that the untouched dimension held its value. It also
            covers the parallel shape on GrapeContract via the lifecycle/renewal pair.
            A second parallel-shape corner here would replay the same edges with weaker
            assertions.

      - name: state_change_updates_the_ancestor_derived_field
        claim_type: Ledger sync
        excluded_because:
          difficulty_instance: grading_cap_reached_cascade_to_lane_committed_tons
          rationale: |
            That instance is the ledger-sync probe: it reconciles CrushPadLane.committed_tons
            and scheduled_appointment_count before and after a grading that trips the
            tonnage cap, and checks the ancestor totals against the sum of the surviving
            appointments rather than against a remembered constant. The corner adds nothing
            the depth instance does not already assert.

      - name: undo_transition_reverses_every_original_side_effect
        claim_type: Compensation
        excluded_because:
          difficulty_instance: grade_dispute_compensating_cascade_reopens_cap_and_pick_call
          rationale: |
            The dispute-and-regrade path is the only compensating transition in the
            scaffold, and the §1.8 instance walks it end to end: the disputed tag's
            tonnage slices are returned to the contract's available cap, tonnage_status
            reopens, the SUSPENDED_CAP pick call is reinstated, the superseded grade is
            stamped and the settlement line is repriced with no drift.

      - name: cross_entity_precondition_blocks_the_transition
        claim_type: guarded transitions
        excluded_because:
          difficulty_instance: pick_call_issuance_requires_completed_pick_ready_sampling_visit
          rationale: |
            Guarded transitions are the whole subject of §1.8 rule 7
            (cross_entity_state_dependency): pick calls guarded on a COMPLETED PICK_READY
            sampling visit, appointments guarded on an ACKNOWLEDGED pick call, and accept
            guarded on an ACTIVE grower. Those three instances cover every cross-entity
            guard declared in §1.2.

  # ===========================================================================
  # SECTION 3 — Calculations (claim-extraction-guide "From Table 3")
  # ===========================================================================
  - section: calculations
    instances:
      - name: net_weight_conversion_honours_three_decimal_ton_rounding
        claim_type: Precision
        grounds:
          - calculations.net_weight_conversion
          - entities.WeighTag.fields.net_tons
        distinguishing_aspect: |
          Two loads on the same appointment, one exact and one not. 61240 - 17240 = 44000 lbs
          divides evenly into 22.000 tons; 50123 - 17000 = 33123 lbs is 16.5615 tons, which
          must land on 16.562 under round_half_up at 3 dp (truncation would give 16.561 and
          banker's rounding on the trailing 5 would give 16.562 only by luck of the
          preceding digit). net_weight_lbs itself stays a whole integer — the rounding lives
          only in the ton conversion — and the second tag proves LBS_PER_TON is a constant
          2000 rather than a per-lane figure.
