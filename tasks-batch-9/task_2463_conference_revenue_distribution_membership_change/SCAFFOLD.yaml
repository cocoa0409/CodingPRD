    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONFERENCE_NOT_INITIALIZED, ERR_REVENUE_POOL_NOT_FOUND, ERR_INVALID_PAGINATION]

