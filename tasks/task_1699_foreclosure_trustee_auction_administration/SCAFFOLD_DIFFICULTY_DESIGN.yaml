            - { call: "POST /api/surplus-claims/${cl_id}/review", payload: { decision: "APPROVE", approved_amount_cents: 2000000 }, as: CaseManager, as_user_id: "cm_reviewer_1" }
            - { call: "POST /api/foreclosure-cases/${case_id}/distribute-surplus", payload: {}, as: CaseManager, captures: { run1: $.data.run_index } }
            - { call: "GET /api/disbursements?surplus_claim_id=${cl_id}", as: CaseManager, captures: { d1_id: "$.data[0].id", d1_amt: "$.data[0].amount_cents" } }
          trigger:
            - { call: "POST /api/disbursements/${d1_id}/reverse", payload: { reversal_reason: "claim documentation audit" }, as: TrusteeAdmin }
            - { call: "GET /api/foreclosure-cases/${case_id}", as: CaseManager, captures: { und_after: $.data.undistributed_surplus_cents } }
            - { call: "POST /api/foreclosure-cases/${case_id}/distribute-surplus", payload: {}, as: CaseManager, captures: { run2: $.data.run_index } }
          assert:
            - "after run 1: ${d1_amt} == 1640950 and case.undistributed_surplus_cents == 0 (conservation: 1640950 + 0 == close surplus)"
            - "after reverse: Disbursement.${d1_id}.status == REVERSED and ${und_after} == 1640950 (0 + 1640950 == close surplus; forward+reverse leaves the conserved quantity unchanged)"
            - "after reverse: SurplusClaim.${cl_id}.paid_cents == 0 and status == APPROVED"
            - "re-run 2 (${run2} == ${run1} + 1) recreates a CLEARED 1640950 CLAIMANT disbursement; claim paid_cents == 1640950"

      - name: bidding_instruction_supersede_active_cardinality
        grounds:
          - state_machines.BiddingInstruction.ACTIVE_to_SUPERSEDED
          - concurrency_rules[bidding-instruction-create-stale-case]
        distinguishing_aspect: |
          Conserved quantity: ACTIVE-record cardinality, not money. Creating a
          second instruction supersedes the first, so
          COUNT(BiddingInstruction WHERE case AND status == ACTIVE) == 1 both
          before and after — create paired with its compensating supersede
          leaves the cardinality invariant unchanged.
        test_recipe:
          setup:
            - "Case LN-K2 at NOTS_RECORDED (bidding instructions require lifecycle NOTS_RECORDED or SALE_SCHEDULED)"
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary Sigma", reference_code: "BEN-K2", contact_email: "sigma@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-K2", borrower_name: "Borrower S", property_address: "21 Cardinal Ct", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY", prepayment_penalty_applies: false }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-K2" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-K2" }, as: CaseManager, captures: { nots_id: $.data.id } }
            - { call: "GET /api/foreclosure-cases/${case_id}", as: CaseManager, captures: { cv1: $.data.version } }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/bidding-instructions", payload: { opening_bid_cents: 42000000, max_bid_cents: 43000000, strategy: "UP_TO_MAX", expected_foreclosure_case_version: "${cv1}" }, as: Beneficiary, as_user_id: "${ben_id}", captures: { ins1: $.data.id } }
            - { call: "GET /api/foreclosure-cases/${case_id}", as: CaseManager, captures: { cv2: $.data.version } }
            - { call: "POST /api/foreclosure-cases/${case_id}/bidding-instructions", payload: { opening_bid_cents: 41000000, max_bid_cents: 43000000, strategy: "OPENING_ONLY", expected_foreclosure_case_version: "${cv2}" }, as: Beneficiary, as_user_id: "${ben_id}", captures: { ins2: $.data.id } }
            - { call: "GET /api/foreclosure-cases/${case_id}/bidding-instructions?status=ACTIVE", as: Beneficiary, as_user_id: "${ben_id}", captures: { active_n: "$.data[0].id" } }
          assert:
            - "after first create: exactly 1 ACTIVE instruction (${ins1})"
            - "after second create: BiddingInstruction.${ins1}.status == SUPERSEDED and ${ins2}.status == ACTIVE"
            - "ACTIVE-filtered list total_count == 1 and its sole row id == ${ins2} (cardinality conserved at 1 across the create/supersede pair)"
