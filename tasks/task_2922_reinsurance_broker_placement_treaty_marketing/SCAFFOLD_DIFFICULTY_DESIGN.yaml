  # ===========================================================================
  # RULE 3 — non-linear state machines on THREE different entities
  #   instance 1 : Quote      — cyclic counter/requote loop with a hard round cap
  #   instance 2 : Program    — two parallel status dimensions advancing independently
  #   instance 3 : ClaimAdvocacy — fork into arbitration, join back at RESOLVED
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_counter_requote_cycle_rejects_the_fourth_broker_counter
        grounds:
          - state_machines.Quote.transitions.QUOTED_to_COUNTERED
          - state_machines.Quote.transitions.COUNTERED_to_REQUOTED
          - state_machines.Quote.transitions.REQUOTED_to_COUNTERED
          - entities.Quote.fields.negotiation_round
          - validations[priority=57]
          - errors.ERR_NEGOTIATION_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          The Quote machine is cyclic: COUNTERED -> REQUOTED -> COUNTERED can be re-entered, and
          the only thing that terminates the loop is the monotone negotiation_round counter
          reaching MAX_NEGOTIATION_ROUNDS (3). The subject entity is Quote — instance 2 walks
          Program and instance 3 walks ClaimAdvocacy.
        test_recipe:
          setup:
            - "One cedent, one market Echo Re, one PROPERTY program driven to placement_status IN_MARKET."
            - "One CATASTROPHE layer with a single SENT market submission and one quote from Echo Re expiring 2026-02-15T00:00:00.000Z; the clock stays at 2026-01-01T00:00:00.000Z so validations[priority=46] never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Echo Re", security_rating: "AA", capacity_limit_minor: 1000000000, max_line_pct: 100.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { echo_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "NW-CAT-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "PROP CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_id: $.data.id }
            - call: "POST /exposure-submissions/${sub_id}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_id}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
            - call: "POST /programs/${prog_id}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_id}/market-submissions"
              payload: { reinsurer_id: "${echo_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_id: $.data.id }
            - call: "POST /market-submissions/${ms_id}/quotes"
              payload: { offered_line_pct: 100.0000, quoted_rate_pct: 9.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${echo_id}"
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_id}/counter"
              payload: { counter_note: "rate too high, come back at 8.5" }
              as: BrokerPlacementLead
              captures: { r1: $.data.negotiation_round }
            - call: "POST /quotes/${quote_id}/requote"
              payload: { offered_line_pct: 100.0000, quoted_rate_pct: 8.7000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${echo_id}"
            - call: "POST /quotes/${quote_id}/counter"
              payload: { counter_note: "still wide of the mark" }
              as: BrokerPlacementLead
              captures: { r2: $.data.negotiation_round }
            - call: "POST /quotes/${quote_id}/requote"
              payload: { offered_line_pct: 100.0000, quoted_rate_pct: 8.4000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${echo_id}"
            - call: "POST /quotes/${quote_id}/counter"
              payload: { counter_note: "final push to 8.0" }
              as: BrokerPlacementLead
              captures: { r3: $.data.negotiation_round }
            - call: "POST /quotes/${quote_id}/requote"
              payload: { offered_line_pct: 100.0000, quoted_rate_pct: 8.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${echo_id}"
            - call: "POST /quotes/${quote_id}/counter"
              payload: { counter_note: "one more squeeze" }
              as: BrokerPlacementLead
              captures: { err: $.data.error_id }
          assert:
            - "${r1} == 1 and ${r2} == 2 and ${r3} == 3"
            - "the fourth counter returns HTTP 422 with ${err} == ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
            - "Quote.${quote_id}.status == REQUOTED  # unchanged by the rejected counter"
            - "Quote.${quote_id}.negotiation_round == 3"
            - "Quote.${quote_id}.quoted_rate_pct == 8.0000"
            - "Quote.${quote_id}.last_counter_note == 'final push to 8.0'"

