        grounds: [calculations.charter_fee_quote]
        distinguishing_aspect: "round_half_up applies at the extra-day rate step: weekly 100000 -> round_half_up(100000/6) = round_half_up(16666.67) = 16667; an 8-day charter quotes 100000 + 16667 = 116667."
