      - name: general_average_single_contributor_absorbs_the_whole_rounding_residual
        claim_type: waterfall_allocation
        grounds:
          - calculations.ga_contribution_allocation
          - state_machines.GeneralAverageEvent.status.DECLARED_to_SECURITY_COLLECTING
          - entities.GaSecurityPosting.fields.contribution_amount
        distinguishing_aspect: |
          With a single contributor the allocation is degenerate but the
          residual is not: rate round(157500 / 1155000, 6) = 0.136364 applied to
          1155000.00 gives a raw 157500.42, so the residual -0.42 lands on the
          only bucket and the contribution must be exactly 157500.00 — never
          157500.42. This is the opposite sign of a truncating implementation and
          it also proves the adjuster fee (7500.00 = 5% of 150000.00) is charged
          on the pre-fee allowance only, and that the cash deposit is 20% of the
          FINAL contribution (31500.00), not of the raw one (31500.08).
