            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - *c_clock_period_end
            - *c_close_q1
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-25T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-periods/${ap_id}/delinquency-sweep"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
