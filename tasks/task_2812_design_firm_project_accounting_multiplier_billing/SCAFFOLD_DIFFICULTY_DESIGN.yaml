            - "Project.${p_id}.unbilled_wip == 0.00 throughout (a commitment is not a charge) and billing_posture == OPEN"

  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_restores_every_swept_population_without_drift
        grounds:
          - state_machines.Invoice.DRAFT_to_VOID
          - state_machines.TimeEntry.BILLED_to_APPROVED
          - state_machines.ExpenseItem.BILLED_to_UNBILLED
          - calculations.project_rollup_metrics
          - endpoints.POST_invoices_void
        distinguishing_aspect: |
          The conserved quantity is total_charge_value == unbilled_wip + billed_open +
          paid_gross_to_date + written_off_gross. Invoicing moves value between two of those
          buckets and voiding must move it back exactly, across two different charge populations
          (labor and expense), clearing back-references so the charges are rediscoverable as
          unbilled, and leaving earned value untouched — the proof is that re-invoicing the same
          period reproduces a byte-identical set of money fields.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "private client with retainage_pct 0.0500, expense_markup_pct 0.1000, receipt_required_above 75.00"
            - "TIME_AND_MATERIALS project activated with multiplier 3.0500; phase lump_sum_fee 200000.00, budget_labor_cost 60000.00"
            - "two approved entries: 7.35 h -> 1401.11 and 10.00 h -> 1906.25, so labor is 3307.36"
            - "one expense of 74.99 in category REPROGRAPHICS with no receipt: 74.99 is below the inclusive 75.00 threshold, so it lands ALLOWED_BY_RULE with billable 82.49"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
              payload: { name: "Northside Development", is_public_agency: false, retainage_pct: 0.0500, expense_markup_pct: 0.1000, disallowed_categories: ["ENTERTAINMENT"], receipt_required_above: 75.00, review_cycle_days: 30 }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /labor-rates"
              payload: { role_code: "PROJECT_ARCHITECT", raw_cost_rate: 62.50, effective_from: "2026-01-01" }
