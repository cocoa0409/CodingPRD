            - call: "POST /governance/investment-policy-statements/${ips_d_id}/adopt"
              payload: { approving_motion_id: "${motion_watch_id}" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          assert:
            - "trigger call 1 returned 404 with data.error_id == ERR_RESOURCE_NOT_FOUND: subject_id is resolved at priority 30 against the kind implied by subject_type, so a fund id offered as an IPS_ADOPTION subject does not resolve"
            - "trigger call 2 returned 201 with Motion.${motion_watch_id}.subject_type == WATCH_LIST_ACTION, subject_id == ${fund_small_id}, status == OPEN, tally_basis == VOTES_CAST and carried_threshold_pct defaulted from Plan.voting_threshold_pct"
            - "trigger call 6 returned 200 with status == CARRIED, support_pct == 100.0000, for_count == 3 and CommitteeMeeting.${meet7_id}.carried_motion_count == 1"
            - "trigger call 9 returned 409 with data.error_id == ERR_MOTION_SUBJECT_MISMATCH: the motion is CARRIED and its meeting's minutes are APPROVED, but its subject_type is WATCH_LIST_ACTION, so the IPS adopt refuses it on the type before touching ERR_MOTION_NOT_CARRIED"
            - "trigger call 10 is the same failure through a different lens — a wrong subject_id would also raise ERR_MOTION_SUBJECT_MISMATCH; InvestmentPolicyStatement.${ips_c_id} and ${ips_d_id} are both still DRAFT and ${ips_a_id} is still the ADOPTED one"
            - "the two DRAFT IPS rows coexist without ERR_DUPLICATE_RESOURCE because uniqueness is on (plan_id, version_label), and IPS-2026-C / IPS-2026-D differ"
            - "STRUCTURAL NOTE: because subject_id is resolved by kind at priority 30, ERR_MOTION_SUBJECT_MISMATCH is only reachable through a type/id pair that resolves to a real row of the WRONG declared kind — a correctly-typed motion offered to the wrong consumer, as in call 9."

      - name: the_qdia_slot_only_accepts_a_suite_the_committee_actually_moved_and_can_never_be_retired
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/governance/asset-class-slots/{slotId}/seat-fund
          - endpoints.POST_/governance/funds/{fundId}/target-date-selection
          - errors.ERR_QDIA_REQUIRES_TARGET_DATE_SUITE
          - validations.priority_88_ERR_QDIA_SLOT_REQUIRED
        distinguishing_aspect: "Seating the default investment is conditional in three independent ways: the fund must be a suite (rule 56 claims that arm), a CARRIED TARGET_DATE_SELECTION motion must name it (the only reachable arm of ERR_QDIA_REQUIRES_TARGET_DATE_SUITE), and the selector's eligibility filter must be non-empty for the glidepath_type passed in the body — a TO_RETIREMENT request against an all-THROUGH_RETIREMENT bench empties the pool and yields 422. Once seated, the QDIA slot is structurally permanent: retire is refused by the priority-88 structural minimum."
        test_recipe:
          setup:
            - "chain_qdia: chain_l3 plus an EMPTY QDIA TARGET_DATE slot and four THROUGH_RETIREMENT candidates (TDTHR, TDTIE, TDLOW, TDCHP), with one carried motion naming TDTIE and one naming TDTHR, minutes approved."
            - "A fifth TARGET_DATE row, TDNOT, is registered with is_target_date_suite false so the non-suite arm can be probed on the same slot."
          setup_api_calls:
            - *chain_qdia
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TDNOT", fund_name: "Balanced Allocation Fund (not a suite)", asset_class_code: "TARGET_DATE", share_class_code: "R6", gross_expense_ratio_bps: 40, net_expense_ratio_bps: 40, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 36, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9000, plan_assets_cents: 0, is_target_date_suite: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_td_not_id: $.data.id }
          trigger:
            - call: "POST /governance/asset-class-slots/${slot_qdia_id}/seat-fund"
              payload: { fund_id: "${fund_td_not_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/asset-class-slots/${slot_qdia_id}/seat-fund"
              payload: { fund_id: "${fund_td_low_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/funds/${fund_td_thru_id}/target-date-selection"
              payload: { approving_motion_id: "${motion_td_win_id}", glidepath_type: "TO_RETIREMENT" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/funds/${fund_td_thru_id}/target-date-selection"
              payload: { approving_motion_id: "${motion_td_win_id}", glidepath_type: "THROUGH_RETIREMENT" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/asset-class-slots/${slot_qdia_id}/retire"
              payload: { reason: "Sponsor wants to drop the default investment from the menu entirely." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/asset-class-slots"
              payload: { plan_id: "${plan_id}", asset_class_code: "STABLE_VALUE", designation: "QDIA", slot_index: 7 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "trigger call 1 returned 422 with data.error_id == ERR_ASSET_CLASS_MISMATCH, not ERR_QDIA_REQUIRES_TARGET_DATE_SUITE: rule 56 explicitly owns 'a QDIA slot accepts only a fund with is_target_date_suite == true' and carries a priority, while the QDIA error has no row in the §1.4 ladder"
            - "trigger call 2 returned 422 with data.error_id == ERR_QDIA_REQUIRES_TARGET_DATE_SUITE: TDLOW IS a suite and IS ips-eligible, but no CARRIED TARGET_DATE_SELECTION motion names it — this is the only reachable arm of that error id on seat-fund"
            - "trigger call 3 returned 422 with data.error_id == ERR_NO_ELIGIBLE_TARGET_DATE_SUITE: the eligibility filter keeps only candidates whose glidepath_type equals the TO_RETIREMENT value in the body, every candidate is THROUGH_RETIREMENT, and an empty pool is reported before the path fund is compared to any winner"
            - "nothing was mutated by calls 1-3: AssetClassSlot.${slot_qdia_id}.status == EMPTY with current_fund_id null, and TDNOT / TDLOW / TDTHR are all still CANDIDATE with qdia_flag false"
            - "trigger call 4 returned 200 with AssetClassSlot.${slot_qdia_id}.status == ACTIVE, current_fund_id == ${fund_td_thru_id}, Fund.${fund_td_thru_id}.qdia_flag == true and credit_accrual_status == ACCRUING; Plan.${plan_id}.occupied_menu_slots == 6 and available_menu_slots == 0"
            - "trigger call 5 returned 409 with data.error_id == ERR_QDIA_SLOT_REQUIRED: the structural minimum at priority 88 forbids retiring the plan's only QDIA slot, and the seated suite keeps menu_status ACTIVE (no PENDING_REMOVAL cascade runs)"
            - "trigger call 6 returned 409 with data.error_id == ERR_DUPLICATE_RESOURCE: 'at most one QDIA-designated slot per plan' is enforced at create by rule 65, so the sponsor cannot sidestep call 5 by adding a second default"
            - "SPEC CONFLICT recorded, not asserted: §1.6 assigns the non-suite-into-QDIA condition to BOTH ERR_ASSET_CLASS_MISMATCH and ERR_QDIA_REQUIRES_TARGET_DATE_SUITE; only the former has a priority row, so an implementation that follows §1.2's precondition order would answer the other way on call 1."

      - name: the_plan_read_reconciles_the_capacity_triple_and_the_credit_ledger_after_a_full_replacement
        claim_type: Computed read
        grounds:
          - endpoints.GET_/governance/plans/{planId}
          - calculations.menu_slot_capacity
          - entities.Plan.revenue_credit_balance_cents
        distinguishing_aspect: "One read has to reconcile four independently maintained derivations at once: the capacity triple (occupied + reserved + available == menu_slot_capacity), the asset roll-up (total_plan_assets_cents == the sum of seated funds' plan_assets_cents), the credit ledger (accrued - allocated == balance), and the at-risk ratio that drives menu_posture. Taken after chain_l5's execution — where a slot passed through PENDING_REPLACEMENT and back — it proves the reserve was released rather than leaked."
        test_recipe:
          setup:
            - "chain_l5: the large-cap replacement is APPROVED, NOTICE_ISSUED and then EXECUTED at 2026-09-02, so ${slot_lc_id} seats LCGRB with LCGRA's 800,000,000 cents mapped across."
          setup_api_calls: *chain_l5
          trigger:
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
          assert:
            - "the response status is 200"
            - "Plan.${plan_id}.occupied_menu_slots == 5, reserved_menu_slots == 0 and available_menu_slots == 1, and the three sum to menu_slot_capacity 6 — the reserve taken at approve was released by execute, not double-counted"
            - "Plan.${plan_id}.total_plan_assets_cents == 1200000000, unchanged by the mapping: the 800,000,000 cents moved from LCGRA to LCGRB inside the same plan"
            - "Plan.${plan_id}.revenue_credit_accrued_cents == 0, revenue_credit_allocated_cents == 0 and revenue_credit_balance_cents == 0, so accrued - allocated == balance holds trivially"
            - "Plan.${plan_id}.at_risk_slot_ratio == 0.0000 and menu_posture == OPEN: the PENDING_REPLACEMENT interlude touched the ratio's numerator during chain_l5 but the ratio is recomputed, not accumulated"
            - "Plan.${plan_id}.charter_status == ADOPTED, fiscal_quarter_index == 0, documented_acceptance_count == 3 and draft_proposal_count == 0"
            - "Plan.${plan_id}.fee_disclosure_status == COMPLIANT and version reflects every write in chain_l5 — the read itself never increments it"
            - "STRUCTURAL NOTE: revenue_credit_accrued_cents can only ever read 0 on this scaffold — no endpoint increases it — so the ledger identity is verifiable but the interesting arm of it is unreachable, which also makes calculations.total_provider_cost_bps' offset_bps permanently 0.00."

      - name: listing_endpoints_filter_on_derived_state_and_page_without_losing_rows
        claim_type: Listing
        grounds:
          - endpoints.GET_/governance/funds
          - endpoints.GET_/governance/asset-class-slots
          - endpoints.GET_/governance/motions
        distinguishing_aspect: "The list endpoints filter on fields the client never wrote — menu_status, watch_status, slot status, motion status — so a filtered list is a read of derived state. Paging the seven-fund bench with limit 3 and offset 3 must partition it exactly, and the same filter re-run after chain_l5's execution must move LCGRA out of the ACTIVE page and LCGRB into it, with no row appearing twice and none lost."
        test_recipe:
          setup:
            - "chain_l5: seven funds on the plan, five slots seated, LCGRA replaced by LCGRB so LCGRA is PENDING_REMOVAL / REMOVED per the execution cascade and LCGRB is ACTIVE."
          setup_api_calls: *chain_l5
          trigger:
            - call: "GET /governance/funds?plan_id=${plan_id}&limit=3&offset=0"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "GET /governance/funds?plan_id=${plan_id}&limit=3&offset=3"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "GET /governance/funds?plan_id=${plan_id}&menu_status=ACTIVE"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "GET /governance/asset-class-slots?plan_id=${plan_id}&status=ACTIVE"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "GET /governance/motions?meeting_id=${meet3_id}&status=CARRIED"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "GET /governance/funds?plan_id=${plan_id}&watch_status=REMEDIATION"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
          assert:
            - "calls 1 and 2 each returned 200 with 3 rows, and the two pages are disjoint — the union is 6 of the 7 funds on the plan, with the 7th reachable at offset 6"
            - "every paged response carries the same total_count and a has_more that is true on page 1 and consistent with the row count on the last page"
            - "call 3 returned exactly the five funds seated in the five ACTIVE slots — LCGRB is present and LCGRA is absent, so the filter reflects the execution cascade rather than the client's original writes"
            - "call 4 returned 5 slot rows, all with status ACTIVE and non-null current_fund_id; no PENDING_REPLACEMENT row survives the execution"
            - "call 5 returned exactly one row, Motion.${motion_prop_id}, with status CARRIED — the filter is on derived motion state, and WITHDRAWN or OPEN motions of the same meeting would be excluded"
            - "call 6 returned 200 with 0 rows and total_count 0: no fund on the plan ever left CLEAR in chain_l5, so a filter on a legal-but-unoccupied enum value is an empty page rather than an error"
            - "no list response mutated anything: Plan.${plan_id}.version is identical before and after all six reads"

  # ---------------------------------------------------------------------------
  # errors — §1.6 catalog sweep. The instances above already trigger 45 of the
  # 71 catalog ids as their asserted failure paths; this section closes the
  # remaining 26 in seven grouped probes, and records the ids that no chain of
  # §1.5 calls can reach at all (with the structural reason, so the reader can
  # decide whether to reshape §1.5 or delete the id).
  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: the_meeting_and_documentation_gates_fire_in_declaration_order_and_the_vote_lock_outlives_the_ballot
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CHARTER_NOT_ADOPTED
          - errors.ERR_CHAIR_NOT_PRESENT
          - errors.ERR_MEETING_IN_SESSION
          - errors.ERR_MINUTES_NOT_APPROVED
          - errors.ERR_OPEN_MOTION_VOTE_LOCK
        distinguishing_aspect: "One meeting exercises five separate gates in the order §1.2 declares them, each with exactly one gate broken so no priority tie can hide a wrong answer: convening under a DRAFT charter is 409 ERR_CHARTER_NOT_ADOPTED even with a full quorate roster; convening with the acting chair off the roster is 409 ERR_CHAIR_NOT_PRESENT; a second meeting on the same plan is 409 ERR_MEETING_IN_SESSION and so is a seat suspension while that meeting sits; adopting an IPS on a CARRIED motion whose meeting has not reached MINUTES_APPROVED is 409 ERR_MINUTES_NOT_APPROVED; and ending the term of a member who has already voted on a still-OPEN motion is 409 ERR_OPEN_MOTION_VOTE_LOCK, which clears the moment adjournment withdraws that motion."
        test_recipe:
          setup:
