      - name: corner_cyclic_state_machine_shape_on_vacancy
        claim_type: cyclic
        grounds:
          - state_machines.Vacancy.OFFERING_to_OPEN
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: vacancy_offering_open_cycle_reoffers_to_next_member_in_order
          rationale: "The OPEN -> OFFERING -> OPEN -> OFFERING -> FILLED loop and its termination on the second lap are the whole subject of the named §1.8 instance."

      - name: corner_cascade_down_side_effect_pattern_on_leave_approval
        claim_type: Cascade down
        grounds:
          - state_machines.ShiftAssignment.SCHEDULED_to_RELIEVED
          - state_machines.DutyShift.STAFFED_to_HIRING
        excluded_because:
          difficulty_instance: leave_approval_cascade_relieves_seat_reprices_period_reopens_shift
          rationale: "The three-hop cascade from leave approval down to the seat, the work period and the shift is asserted hop-by-hop by the named §1.8 instance."

      - name: corner_compensation_side_effect_pattern_on_seat_cancellation
        claim_type: Compensation
        grounds:
          - state_machines.Vacancy.FILLED_to_OPEN
          - calculations.ot_committed_ledger
        excluded_because:
          difficulty_instance: station_committed_ledger_restored_by_cancelling_hired_overtime_seat
          rationale: "Reversal of every side effect of the hire, with no ledger drift, is the named §1.8 instance's assertion set."
