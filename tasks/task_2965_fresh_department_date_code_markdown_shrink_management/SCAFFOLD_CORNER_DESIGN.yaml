              as: DepartmentManager
              captures: { item_id: $.data.id, item_v1: $.data.version }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id }
            - call: "POST /fresh/lots/${lot_id}/sales"
              payload: { quantity_units: 20, register_lane_code: "L07" }
              as: FreshClerk
            - call: "POST /fresh/shrink-events"
              payload: { lot_id: "${lot_id}", cause_code: "DAMAGE", quantity_units: 2 }
              as: FreshClerk
              as_user_id: "u-clerk-1"
              captures: { shrink_id: $.data.id }
            - call: "POST /fresh/shrink-events/${shrink_id}/verify"
              payload: {}
              as: DepartmentManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /fresh/order-recommendations"
              payload: { item_id: "${item_id}", window_start_date: "2026-08-10", window_end_date: "2026-08-09", expected_item_version: "${item_v1}" }
              as: DepartmentManager
            - call: "POST /fresh/order-recommendations"
              payload: { item_id: "${item_id}", window_start_date: "2026-07-01", window_end_date: "2026-08-31", expected_item_version: "${item_v1}" }
              as: DepartmentManager
            - call: "POST /fresh/order-recommendations"
              payload: { item_id: "${item_id}", window_start_date: "2026-08-01", window_end_date: "2026-08-05", expected_item_version: "${item_v1}" }
