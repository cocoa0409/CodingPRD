            - { call: "POST /psm/moc-requests/${ma}/approve", payload: {}, as: OpsApprover, as_user_id: "${app_id}" }
            - { call: "POST /psm/moc-requests/${ma}/procedure-updates", payload: { document_ref: "SOP-A" }, as: TrainingCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pa}/training-assignments", payload: { personnel_id: "${req_id}" }, as: TrainingCoordinator, captures: { taa: $.data.id } }
