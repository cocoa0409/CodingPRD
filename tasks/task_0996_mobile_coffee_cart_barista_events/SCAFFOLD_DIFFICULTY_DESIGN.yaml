        distinguishing_aspect: |
          Barista interval semantics: UNBUFFERED half-open [event_start, event_end). Back-to-back bookings (b2.event_start == b1.event_end) are ALLOWED — adjacency does not trigger ERR_BARISTA_DOUBLE_BOOKED. Distinct semantics from cart (which has buffer).
