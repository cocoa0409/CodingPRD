# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Locksmith & Lockout Dispatch — cross-reference of §1.1–§1.7 vs §0.5 nine rules.
# 9 rule_ids × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_estimate_vs_final_money_divergence
        grounds:
          - calculations.quote_estimated_total_cents
          - calculations.quote_final_total_cents
          - state_machines.OnSiteQuote.DRAFTED_to_SUBMITTED
          - entities.OnSiteQuote.fields.estimated_total_cents
          - entities.OnSiteQuote.fields.final_total_cents
        distinguishing_aspect: |
          Same OnSiteQuote (money domain): the DRAFT-time estimate uses only the flat
          BASE_RATE_CENTS for service_type and omits labor & parts, while the SUBMIT-time
          final adds measured labor + part lines — so estimated_total_cents != final_total_cents
          for identical inputs.
        test_recipe:
          setup:
            - "A REKEY job at requested_at_minute=600 (daytime, no surcharge), technician on-site."
            - "Quote drafted with labor_hours=2.5 and part_lines [{1500x2},{999x3}], then submitted."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T1", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech1: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C1", customer_user_id: "cust-1", service_type: "REKEY", service_address: "1 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job1: $.data.id }
            - call: "POST /service-jobs/${job1}/dispatches"
              payload: { technician_id: "${tech1}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp1: $.data.id }
            - call: "POST /dispatches/${disp1}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech1}"
            - call: "POST /dispatches/${disp1}/arrive"
              payload: { arrived_at_minute: 645 }
              as: Technician
              as_user_id: "${tech1}"
            - call: "POST /service-jobs/${job1}/quotes"
              payload: { labor_hours: 2.5, part_lines: [{ unit_price_cents: 1500, quantity: 2 }, { unit_price_cents: 999, quantity: 3 }] }
              as: Technician
              as_user_id: "${tech1}"
              captures: { quote1: $.data.id, est1: $.data.estimated_total_cents }
          trigger:
            - call: "POST /quotes/${quote1}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech1}"
              captures: { fin1: $.data.final_total_cents }
          assert:
            - "OnSiteQuote.${quote1}.estimated_total_cents == 12000"
            - "OnSiteQuote.${quote1}.final_total_cents == 25997"
            - "OnSiteQuote.${quote1}.estimated_total_cents != OnSiteQuote.${quote1}.final_total_cents"

      - name: eta_promised_vs_actual_time_divergence
        grounds:
          - calculations.dispatch_promised_eta_minutes
          - calculations.dispatch_actual_response_minutes
          - state_machines.Dispatch.EN_ROUTE_to_ARRIVED
          - entities.Dispatch.fields.promised_eta_minutes
          - entities.Dispatch.fields.actual_response_minutes
        distinguishing_aspect: |
          Different entity domain (Technician/Dispatch timing, not money): promised_eta_minutes
          is a forward-looking projection from base_travel + queue at dispatch, while
          actual_response_minutes is a chronological arrived_minus_requested measured at arrival —
          divergent numbers from independent input sets.
        test_recipe:
          setup:
            - "Technician base_travel_minutes=20, no other live dispatches (promised=20)."
            - "Job requested_at_minute=600; technician arrives at minute 645 (actual=45)."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T2", certified_for: ["LOCKOUT"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech2: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C2", customer_user_id: "cust-2", service_type: "LOCKOUT", service_address: "2 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job2: $.data.id }
            - call: "POST /service-jobs/${job2}/dispatches"
              payload: { technician_id: "${tech2}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp2: $.data.id, promised2: $.data.promised_eta_minutes }
            - call: "POST /dispatches/${disp2}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech2}"
          trigger:
            - call: "POST /dispatches/${disp2}/arrive"
              payload: { arrived_at_minute: 645 }
              as: Technician
              as_user_id: "${tech2}"
              captures: { actual2: $.data.actual_response_minutes }
          assert:
            - "Dispatch.${disp2}.promised_eta_minutes == 20"
            - "Dispatch.${disp2}.actual_response_minutes == 45"
            - "Dispatch.${disp2}.promised_eta_minutes != Dispatch.${disp2}.actual_response_minutes"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_total_nonlinear_multi_input_mode_a
        grounds:
          - calculations.quote_final_total_cents
          - calculations.surcharge_multiplier
          - state_machines.OnSiteQuote.DRAFTED_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: final_total depends on
          requested_at_minute (tiered after-hours selection), is_emergency AND service_type
          (conditional emergency multiplier that stacks only for emergency LOCKOUT), and
          measured labor + parts; multipliers compose multiplicatively (1.5 * 1.25 = 1.875).
        test_recipe:
          setup:
            - "Emergency LOCKOUT job at requested_at_minute=1100 (after-hours), surcharge multiplier 1.875."
            - "Quote labor_hours=1.0, part_lines [{333x1}], submitted on-site."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T3", certified_for: ["LOCKOUT"], base_travel_minutes: 15 }
              as: Dispatcher
              captures: { tech3: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C3", customer_user_id: "cust-3", service_type: "LOCKOUT", service_address: "3 Main St", is_emergency: true, requested_at_minute: 1100 }
              as: Dispatcher
              captures: { job3: $.data.id }
            - call: "POST /service-jobs/${job3}/dispatches"
              payload: { technician_id: "${tech3}", eta_start_minute: 1105, eta_end_minute: 1140 }
              as: Dispatcher
              captures: { disp3: $.data.id }
            - call: "POST /dispatches/${disp3}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech3}"
            - call: "POST /dispatches/${disp3}/arrive"
              payload: { arrived_at_minute: 1130 }
              as: Technician
              as_user_id: "${tech3}"
            - call: "POST /service-jobs/${job3}/quotes"
              payload: { labor_hours: 1.0, part_lines: [{ unit_price_cents: 333, quantity: 1 }] }
              as: Technician
              as_user_id: "${tech3}"
              captures: { quote3: $.data.id }
          trigger:
            - call: "POST /quotes/${quote3}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech3}"
              captures: { fin3: $.data.final_total_cents }
          assert:
            - "OnSiteQuote.${quote3}.final_total_cents == 15624"

      - name: final_total_round_per_line_then_sum_mode_b
        grounds:
          - calculations.quote_final_total_cents
          - calculations.surcharge_multiplier
          - entities.OnSiteQuote.fields.final_total_cents
        distinguishing_aspect: |
          Mode (b) — rounding order matters: with multiplier 1.875 and two identical part lines
          of 333 cents, round-per-line-then-sum gives 624+624=1248 whereas sum-then-round gives
          1249; the scaffold pins round-per-line-then-sum, so the total is 16248 (NOT 16249).
        test_recipe:
          setup:
            - "Emergency LOCKOUT job at requested_at_minute=1100 (multiplier 1.875)."
            - "Quote labor_hours=1.0, part_lines [{333x1},{333x1}] (two separate lines) submitted."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T4", certified_for: ["LOCKOUT"], base_travel_minutes: 15 }
              as: Dispatcher
              captures: { tech4: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C4", customer_user_id: "cust-4", service_type: "LOCKOUT", service_address: "4 Main St", is_emergency: true, requested_at_minute: 1100 }
              as: Dispatcher
              captures: { job4: $.data.id }
            - call: "POST /service-jobs/${job4}/dispatches"
              payload: { technician_id: "${tech4}", eta_start_minute: 1105, eta_end_minute: 1140 }
              as: Dispatcher
              captures: { disp4: $.data.id }
            - call: "POST /dispatches/${disp4}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech4}"
            - call: "POST /dispatches/${disp4}/arrive"
              payload: { arrived_at_minute: 1130 }
              as: Technician
              as_user_id: "${tech4}"
            - call: "POST /service-jobs/${job4}/quotes"
              payload: { labor_hours: 1.0, part_lines: [{ unit_price_cents: 333, quantity: 1 }, { unit_price_cents: 333, quantity: 1 }] }
              as: Technician
              as_user_id: "${tech4}"
              captures: { quote4: $.data.id }
          trigger:
            - call: "POST /quotes/${quote4}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech4}"
              captures: { fin4: $.data.final_total_cents }
          assert:
            - "OnSiteQuote.${quote4}.final_total_cents == 16248"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_submitted_to_drafted
        grounds:
          - state_machines.OnSiteQuote.SUBMITTED_to_DRAFTED
          - state_machines.OnSiteQuote.DRAFTED_to_SUBMITTED
        distinguishing_aspect: |
          OnSiteQuote is cyclic: SUBMITTED -> DRAFTED (request-revision) -> SUBMITTED again,
          a revision loop that returns the entity to a prior state — not a linear pipeline.
        test_recipe:
          setup:
            - "Job on-site with a quote drafted then submitted."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T5", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech5: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C5", customer_user_id: "cust-5", service_type: "REKEY", service_address: "5 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job5: $.data.id }
            - call: "POST /service-jobs/${job5}/dispatches"
              payload: { technician_id: "${tech5}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp5: $.data.id }
            - call: "POST /dispatches/${disp5}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech5}"
            - call: "POST /dispatches/${disp5}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${tech5}"
            - call: "POST /service-jobs/${job5}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${tech5}"
              captures: { quote5: $.data.id }
            - call: "POST /quotes/${quote5}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech5}"
          trigger:
            - call: "POST /quotes/${quote5}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "cust-5"
              captures: { qstat5: $.data.status }
            - call: "POST /quotes/${quote5}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech5}"
              captures: { qstat5b: $.data.status }
          assert:
            - "After request-revision OnSiteQuote.${quote5}.status == DRAFTED"
            - "After re-submit OnSiteQuote.${quote5}.status == SUBMITTED"

      - name: servicejob_parallel_axes_job_vs_payment
        grounds:
          - state_machines.ServiceJob.field=job_status
          - state_machines.ServiceJob.field=payment_status
          - entities.ServiceJob.fields.job_status
          - entities.ServiceJob.fields.payment_status
        distinguishing_aspect: |
          ServiceJob carries two independent state axes on one row: job_status (lifecycle) and
          payment_status (money) evolve independently — a payment capture advances payment_status
          to PAID while job_status remains ON_SITE, proving parallel dimensions, not one pipeline.
        test_recipe:
          setup:
            - "Job ON_SITE with an APPROVED quote whose final_total_cents=8000; no payment yet."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T6", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech6: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C6", customer_user_id: "cust-6", service_type: "REKEY", service_address: "6 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job6: $.data.id }
            - call: "POST /service-jobs/${job6}/dispatches"
              payload: { technician_id: "${tech6}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp6: $.data.id }
            - call: "POST /dispatches/${disp6}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech6}"
            - call: "POST /dispatches/${disp6}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${tech6}"
            - call: "POST /service-jobs/${job6}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${tech6}"
              captures: { quote6: $.data.id }
            - call: "POST /quotes/${quote6}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech6}"
            - call: "POST /quotes/${quote6}/approve"
              payload: {}
              as: Customer
              as_user_id: "cust-6"
          trigger:
            - call: "POST /service-jobs/${job6}/payments"
              payload: { captured_amount_cents: 8000 }
              as: BillingAgent
              captures: { pay6: $.data.id }
          assert:
            - "ServiceJob.${job6}.payment_status == PAID"
            - "ServiceJob.${job6}.job_status == ON_SITE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: job_cancel_cascades_quote_reservation_lockpart_depth3
        grounds:
          - state_machines.ServiceJob.INTAKE_DISPATCHED_ON_SITE_to_CANCELLED
          - state_machines.OnSiteQuote.DRAFTED_SUBMITTED_APPROVED_to_VOIDED
          - state_machines.PartReservation.RESERVED_to_RELEASED
          - calculations.lockpart_unit_ledger
        distinguishing_aspect: |
          Depth-3 chain from job cancel: ServiceJob CANCEL -> OnSiteQuote VOIDED ->
          (that void) PartReservation RELEASED -> (that release) LockPart.units_available
          incremented. Each hop is caused by the previous hop, not by the original cancel.
        test_recipe:
          setup:
            - "Job ON_SITE with a DRAFTED quote and one RESERVED PartReservation of qty 2 against a LockPart (units_total=5)."
            - "Pre-cancel: LockPart units_available=3, units_reserved=2."
          setup_api_calls:
            - call: "POST /lock-parts"
              payload: { sku: "PIN-5", units_total: 5 }
              as: InventoryManager
              captures: { lp7: $.data.id, lp7v: $.data.version }
            - call: "POST /technicians"
              payload: { full_name: "T7", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech7: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C7", customer_user_id: "cust-7", service_type: "REKEY", service_address: "7 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job7: $.data.id }
            - call: "POST /service-jobs/${job7}/dispatches"
              payload: { technician_id: "${tech7}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp7: $.data.id }
            - call: "POST /dispatches/${disp7}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech7}"
            - call: "POST /dispatches/${disp7}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${tech7}"
            - call: "POST /service-jobs/${job7}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${tech7}"
              captures: { quote7: $.data.id }
            - call: "POST /part-reservations"
              payload: { on_site_quote_id: "${quote7}", lock_part_id: "${lp7}", quantity: 2, expected_lockpart_version: "${lp7v}" }
              as: Technician
              as_user_id: "${tech7}"
              captures: { resv7: $.data.id }
          trigger:
            - call: "POST /service-jobs/${job7}/cancel"
              payload: {}
              as: Dispatcher
          assert:
            - "ServiceJob.${job7}.job_status == CANCELLED"
            - "OnSiteQuote.${quote7}.status == VOIDED"
            - "PartReservation.${resv7}.status == RELEASED"
            - "LockPart.${lp7}.units_available == 5"
            - "LockPart.${lp7}.units_reserved == 0"

      - name: quote_approve_then_complete_commits_reservation_lockpart_depth2
        grounds:
          - state_machines.ServiceJob.ON_SITE_to_WORK_COMPLETE
          - state_machines.PartReservation.RESERVED_to_COMMITTED
          - calculations.lockpart_unit_ledger
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (complete-work, not cancel): complete-work ->
          PartReservation RESERVED->COMMITTED -> LockPart units_reserved decremented and
          units_committed incremented. Distinct propagation pattern (commit, not release).
        test_recipe:
          setup:
            - "Job ON_SITE, quote APPROVED, one RESERVED reservation qty 2 on a LockPart (units_total=5, available=3, reserved=2)."
          setup_api_calls:
            - call: "POST /lock-parts"
              payload: { sku: "PIN-8", units_total: 5 }
              as: InventoryManager
              captures: { lp8: $.data.id, lp8v: $.data.version }
            - call: "POST /technicians"
              payload: { full_name: "T8", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech8: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C8", customer_user_id: "cust-8", service_type: "REKEY", service_address: "8 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job8: $.data.id }
            - call: "POST /service-jobs/${job8}/dispatches"
              payload: { technician_id: "${tech8}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp8: $.data.id }
            - call: "POST /dispatches/${disp8}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech8}"
            - call: "POST /dispatches/${disp8}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${tech8}"
            - call: "POST /service-jobs/${job8}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${tech8}"
              captures: { quote8: $.data.id }
            - call: "POST /part-reservations"
              payload: { on_site_quote_id: "${quote8}", lock_part_id: "${lp8}", quantity: 2, expected_lockpart_version: "${lp8v}" }
              as: Technician
              as_user_id: "${tech8}"
              captures: { resv8: $.data.id }
            - call: "POST /quotes/${quote8}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech8}"
            - call: "POST /quotes/${quote8}/approve"
              payload: {}
              as: Customer
              as_user_id: "cust-8"
          trigger:
            - call: "POST /service-jobs/${job8}/complete-work"
              payload: {}
              as: Technician
              as_user_id: "${tech8}"
          assert:
            - "PartReservation.${resv8}.status == COMMITTED"
            - "LockPart.${lp8}.units_reserved == 0"
            - "LockPart.${lp8}.units_committed == 2"
            - "LockPart.${lp8}.units_available == 3"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_payment
        grounds:
          - validations[priority=5]
          - validations[priority=12]
        distinguishing_aspect: |
          state (priority 5, ERR_NO_APPROVED_QUOTE) vs business_fiscal (priority 12,
          ERR_PAYMENT_EXCEEDS_DUE): a capture on a job with NO approved quote and an
          over-due amount fails the state check first — ERR_NO_APPROVED_QUOTE wins (amount_due
          is 0 with no approved quote, so the fiscal check would also flag, but state outranks).
        test_recipe:
          setup:
            - "Job ON_SITE with a SUBMITTED (not approved) quote; amount_due_cents=0."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T9", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech9: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C9", customer_user_id: "cust-9", service_type: "REKEY", service_address: "9 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job9: $.data.id }
            - call: "POST /service-jobs/${job9}/dispatches"
              payload: { technician_id: "${tech9}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp9: $.data.id }
            - call: "POST /dispatches/${disp9}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech9}"
            - call: "POST /dispatches/${disp9}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${tech9}"
            - call: "POST /service-jobs/${job9}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${tech9}"
              captures: { quote9: $.data.id }
            - call: "POST /quotes/${quote9}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech9}"
          trigger:
            - call: "POST /service-jobs/${job9}/payments"
              payload: { captured_amount_cents: 5000 }
              as: BillingAgent
              captures: { err9: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_APPROVED_QUOTE"

      - name: safety_beats_constraint_on_reservation
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          business_safety (priority 9, ERR_AUTHORIZATION_MISSING) vs business_constraint (priority 10,
          ERR_PART_DISCONTINUED): reserving a part that is BOTH restricted_blank (no authorization on
          file) AND DISCONTINUED fails the authorization (safety) check first — ERR_AUTHORIZATION_MISSING
          wins over the discontinued (constraint) check. Disjoint error-category pair from the
          state-vs-fiscal conflict on payment.
        test_recipe:
          setup:
            - "Restricted-blank LockPart units_total=1, then DISCONTINUED; no RESTRICTED_BLANK authorization on the job; quote DRAFTED."
          setup_api_calls:
            - call: "POST /lock-parts"
              payload: { sku: "RB-1", restricted_blank: true, units_total: 1 }
              as: InventoryManager
              captures: { lp10: $.data.id, lp10v: $.data.version }
            - call: "PUT /lock-parts/${lp10}"
              payload: { part_status: "DISCONTINUED", expected_lockpart_version: "${lp10v}" }
              as: InventoryManager
              captures: { lp10v2: $.data.version }
            - call: "POST /technicians"
              payload: { full_name: "T10", certified_for: ["INSTALL"], base_travel_minutes: 20 }
              as: Dispatcher
