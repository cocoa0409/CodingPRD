              captures: { proto_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/substitution-protocols/${proto_id}/activate"
              payload: {}
              as: PharmacyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_ELIGIBLE_SUBSTITUTE (422): substitute pool empty (drug DISCONTINUED); protocol remains DRAFT"
      - name: error_drug_not_in_shortage_on_activate
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRUG_NOT_IN_SHORTAGE]", "validations[priority=35]"]
        distinguishing_aspect: "Activating a protocol whose shortage drug has in_shortage == false -> ERR_DRUG_NOT_IN_SHORTAGE (422)."
