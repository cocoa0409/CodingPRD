              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110, loading_rate_cars_per_hour: 20, is_active: true }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v0: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-9001", track_id: "${trk_id}", expected_track_version: "${trk_v0}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 60, gallons_per_railcar: 2659.00, window_start: "2026-09-05T06:00:00Z", window_end: "2026-09-05T12:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id }
            - call: "GET /ethanol-ops/loading-tracks/${trk_id}"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_v1: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-9002", track_id: "${trk_id}", expected_track_version: "${trk_v1}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 50, gallons_per_railcar: 2659.00, window_start: "2026-09-05T08:00:00Z", window_end: "2026-09-05T14:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh2_id: $.data.id }
            - call: "GET /ethanol-ops/loading-tracks/${trk_id}"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
