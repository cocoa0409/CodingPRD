          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: 00000000-0000-0000-0000-000000000000
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${ca_id}
        captures:
          err: $.data.error_id
      assert:
      - "error_id == ERR_FORBIDDEN_OWNERSHIP, http 403 (clinic A's buyer cannot order as clinic B \u2014 ownership checked before product existence)"
  - name: clinic_buyer_cancels_own_draft_order
    claim_type: rbac_allow
    grounds:
    - roles
    - state_machines.Order.DRAFT_to_CANCELLED
    distinguishing_aspect: "Cancel is a shared operation: the owning ClinicBuyer cancels its own DRAFT order successfully (200) \u2014 the positive leg of the shared_operation row."
    test_recipe:
      setup:
      - ACTIVE clinic; DRAFT order owned by it
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic SC2
          license_number: LIC-SC2
          ship_to_address: 64 Share St
          credit_limit_cents: 1000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-SC2
          product_name: Share Pack
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 2500
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 64 Share St
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      trigger:
      - call: POST /vet/orders/${o_id}/cancel
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_st: $.data.status
      assert:
      - 200, Order.status == CANCELLED (owner ClinicBuyer shares the cancel operation with AccountManager)
  - name: planner_and_officer_read_scopes_allowed
    claim_type: rbac_allow
    grounds:
    - roles
    distinguishing_aspect: "Distributor roles share read scopes: ComplianceOfficer reads lots and SupplyChainPlanner reads orders without error \u2014 the positive leg of peer-role shared reads."
    test_recipe:
      setup:
      - one product with one lot exists
      setup_api_calls:
      - call: POST /vet/products
        payload:
          sku: RD-1
          product_name: Read Pack
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 1000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-RD
          expiry_date: '2027-06-30'
          qty_on_hand: 3
        as: SupplyChainPlanner
      trigger:
      - call: GET /vet/inventory-lots?product_id=${p_id}
        as: ComplianceOfficer
        captures:
          lot_seen: $.data[0].lot_number
      - call: GET /vet/orders
        as: SupplyChainPlanner
      assert:
      - ComplianceOfficer list of lots returns LOT-RD (200)
      - SupplyChainPlanner list of orders returns 200 with response_type array
- section: cross_cutting_complexity_layers
  instances:
  - name: clinic_patch_stale_version_rejected
    claim_type: stale_version_occ
    grounds:
    - concurrency_rules[clinic-update-stale-version]
    - errors[ERR_STALE_CLINIC_VERSION]
    distinguishing_aspect: "PATCH carries expected_clinic_version: the first patch (version 1) succeeds and bumps to 2; replaying the same stale version is rejected 412 ERR_STALE_CLINIC_VERSION \u2014 two\
      \ strictly sequential requests, no wall-clock dependency."
    test_recipe:
      setup:
      - clinic created; version captured at creation
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic OCC
          license_number: LIC-OCC
          ship_to_address: 65 Occ Oaks
          credit_limit_cents: 1000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
          c_v: $.data.version
      trigger:
      - call: PATCH /vet/clinics/${c_id}
        payload:
          expected_clinic_version: ${c_v}
          credit_limit_cents: 2000000
        as: AccountManager
        captures:
          c_v2: $.data.version
      - call: PATCH /vet/clinics/${c_id}
        payload:
          expected_clinic_version: ${c_v}
          credit_limit_cents: 3000000
        as: AccountManager
        captures:
          err: $.data.error_id
      - call: GET /vet/clinics/${c_id}
        as: AccountManager
        captures:
          c_lim: $.data.credit_limit_cents
      assert:
      - first PATCH -> 200, version == 2, credit_limit_cents == 2000000
      - second PATCH with the same stale version -> 412, error_id == ERR_STALE_CLINIC_VERSION
      - 'clinic unchanged after rejection: credit_limit_cents still 2000000'
  - name: enrollment_supersede_requires_fresh_version
    claim_type: stale_version_occ
    grounds:
    - concurrency_rules[enrollment-create-stale-clinic]
    - state_machines.BundleEnrollment.ACTIVE_to_SUPERSEDED
    - errors[ERR_STALE_CLINIC_VERSION]
    distinguishing_aspect: 'CREATE-with-supersede under OCC: enrollment E2 with the clinic version captured before E1''s creation is rejected 412; re-based on the fresh version it succeeds and supersedes
      E1 (E1 SUPERSEDED, its accruals reversed).'
    test_recipe:
      setup:
      - ACTIVE clinic (version 2 after activation, captured); two ACTIVE programs P1, P2
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic OCC2
          license_number: LIC-OC2
          ship_to_address: 66 Occ Oaks
          credit_limit_cents: 1000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
          c_v: $.data.version
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
        captures:
          c_v: $.data.version
      - call: POST /vet/bundle-programs
        payload:
          program_name: P1
          manufacturer_code: GEN
          qualifying_product_types:
          - CONSUMABLE
          min_distinct_categories: 1
          bundle_discount_pct: 0
          rebate_base_rate_bp: 100
          rebate_bonus_rate_bp: 200
          bonus_threshold_cents: 500000
        as: AccountManager
        captures:
          p1_id: $.data.id
      - call: POST /vet/bundle-programs/${p1_id}/activate
        as: AccountManager
      - call: POST /vet/bundle-programs
        payload:
          program_name: P2
          manufacturer_code: GEN
          qualifying_product_types:
          - CONSUMABLE
          min_distinct_categories: 1
          bundle_discount_pct: 5
          rebate_base_rate_bp: 150
          rebate_bonus_rate_bp: 300
          bonus_threshold_cents: 500000
        as: AccountManager
        captures:
          p2_id: $.data.id
      - call: POST /vet/bundle-programs/${p2_id}/activate
        as: AccountManager
      - call: POST /vet/clinics/${c_id}/bundle-enrollments
        payload:
          program_id: ${p1_id}
          quarter: 2026-Q3
          expected_clinic_version: ${c_v}
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          e1_id: $.data.id
      trigger:
      - call: POST /vet/clinics/${c_id}/bundle-enrollments
        payload:
          program_id: ${p2_id}
          quarter: 2026-Q3
          expected_clinic_version: ${c_v}
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          err: $.data.error_id
      - call: GET /vet/clinics/${c_id}
        as: AccountManager
        captures:
          c_v3: $.data.version
      - call: POST /vet/clinics/${c_id}/bundle-enrollments
        payload:
          program_id: ${p2_id}
          quarter: 2026-Q3
          expected_clinic_version: ${c_v3}
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          e2_id: $.data.id
          e2_st: $.data.status
      - call: GET /vet/bundle-enrollments/${e1_id}
        as: AccountManager
        captures:
          e1_st: $.data.status
      assert:
      - E2 with the pre-E1 version -> 412 ERR_STALE_CLINIC_VERSION (E1's creation bumped the clinic to version 3)
      - E2 re-based on the fresh version -> 201 ACTIVE (clinic now version 4)
      - E1.status == SUPERSEDED (same clinic + quarter supersede)
  - name: short_date_credit_expiry_via_clock_sweep
    claim_type: clock_sweep
    grounds:
    - state_machines.ShortDateCredit.APPROVED_to_EXPIRED
    - endpoints
    - errors[ERR_CREDIT_INVALID_STATE]
    distinguishing_aspect: 'Ops-run checkpoint: an APPROVED credit whose 30-day return window lapses is swept to EXPIRED by set_current_utc; a later finalize fails ERR_CREDIT_INVALID_STATE.'
    test_recipe:
      setup:
      - DELIVERED line from lot expiry 2027-02-06; clock 2026-08-10 (180 days, eligible); credit qty 1 REQUESTED and APPROVED on 2026-08-10
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic SW
          license_number: LIC-SW
          ship_to_address: 67 Sweep St
          credit_limit_cents: 1000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-SW
          product_name: Sweep Pack
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 999
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-SW
          expiry_date: '2027-02-06'
          qty_on_hand: 5
        as: SupplyChainPlanner
        captures:
          lot_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 67 Sweep St
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
      - call: POST /vet/shipments
        payload:
          order_id: ${o_id}
          carrier_name: VETEXPRESS
        as: SupplyChainPlanner
        captures:
          s_id: $.data.id
      - call: POST /vet/shipments/${s_id}/dispatch
        as: SupplyChainPlanner
      - call: POST /vet/shipments/${s_id}/deliver
        as: SupplyChainPlanner
      - call: GET /vet/order-lines?order_id=${o_id}
        as: AccountManager
        captures:
          l_id: $.data[0].id
      - call: POST /vet/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T00:00:00Z'
        as: SystemAdmin
      - call: POST /vet/short-date-credits
        payload:
          order_line_id: ${l_id}
          lot_id: ${lot_id}
          qty: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          sdc_id: $.data.id
      - call: POST /vet/short-date-credits/${sdc_id}/approve
        as: ComplianceOfficer
      trigger:
      - call: POST /vet/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: SystemAdmin
      - call: GET /vet/short-date-credits/${sdc_id}
        as: ComplianceOfficer
        captures:
          sdc_st: $.data.status
      - call: POST /vet/short-date-credits/${sdc_id}/finalize
        payload:
          received_qty: 1
        as: ComplianceOfficer
        captures:
          err: $.data.error_id
      assert:
      - 'after sweep to 2026-09-15 (36 days past approval): status == EXPIRED'
      - finalize -> error_id == ERR_CREDIT_INVALID_STATE, http 409
  - name: cascading_side_effects_covered
    claim_type: cascade_chain
    grounds:
    - complexity_profile.complexity_layers
    excluded_because:
      difficulty_instance: cancel_release_refill_depth3_cascade
      rationale: The depth-3 cancel cascade and the clock-sweep expiry cascade are asserted end-to-end by the two transitive_cascade difficulty instances.
  - name: dual_variant_layer_covered
    claim_type: variant_divergence
    grounds:
    - complexity_profile.complexity_layers
    excluded_because:
      difficulty_instance: rebate_provisional_vs_final_quarter_close
      rationale: Both dual-variant calculations (rebate and short-date credit) are asserted with literal divergent amounts by the dual_variant_calc difficulty instances.
- section: consistency_model
  instances:
  - name: immediate_consistency_on_approve_and_read
    claim_type: immediate_visibility
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: 'Immediate consistency: the approve response itself carries the new status, and a read issued right after observes the allocation (line ALLOCATED, lot debited) with no lag or
      reconciliation step.'
    test_recipe:
      setup:
      - ACTIVE clinic; stocked product; SUBMITTED order qty 2
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic IC
          license_number: LIC-IC
          ship_to_address: 68 Imm Isle
          credit_limit_cents: 1000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-IC
          product_name: Imm Pack
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 2500
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-IC
          expiry_date: '2027-06-30'
          qty_on_hand: 5
        as: SupplyChainPlanner
        captures:
          lot_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 68 Imm Isle
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 2
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      trigger:
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
        captures:
          o_st: $.data.status
      - call: GET /vet/order-lines?order_id=${o_id}
        as: AccountManager
        captures:
          l_st: $.data[0].status
          l_lot: $.data[0].lot_id
      - call: GET /vet/inventory-lots/${lot_id}
        as: AccountManager
        captures:
          l_av: $.data.qty_available
      assert:
      - 'approve response: status == APPROVED in the same request'
      - 'immediate read: line ALLOCATED with lot_id == ${lot_id}; lot qty_available == 3'
