            - "after release-hold: execution_status == RUNNING and quality_status == PENDING"
            - "after complete: execution_status == COMPLETED and quality_status == QHOLD (seasoning deviation 0.51 > 0.5)"
            - "after disposition: execution_status == COMPLETED (unchanged) and quality_status == PASSED"

