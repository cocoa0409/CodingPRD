# =============================================================================
# MSP Managed IT — PRD benchmark seed tables (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: |
  Computer/Phone Repair & Managed IT for SMB (MSP style): client/site & asset
  inventory, RMM monitoring & patch, ticket/SLA & remote/onsite dispatch,
  managed-services recurring contract (per-seat), backup/security add-on,
  project work & quote, hardware procurement, QBR/reporting

domain_name: msp-managed-it
# Flat, multi-root topology: entities are peers linked by foreign keys rather
# than nested under one collection, so there is no single URL prefix. The empty
# prefix means every top-level collection lives at the API root (`/clients`,
# `/contracts`, `/tickets`, …).
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration     # ticket/SLA + dispatch + quote pipelines
  secondary_archetype: pricing_engine            # per-seat recurring billing + procurement quotes
  complexity_layers:
    - dual_variant_calculation                   # provisional vs final seat charge; estimated vs actual ticket labor
    - cascading_side_effects                     # client offboard → contract → asset → patch/ticket
    - optimistic_concurrency                     # seat adjustment supersede on Contract.version
    - rate_threshold_triggers                    # SLA breach boundary, tiered volume discount

  entity_topology: flat
  # flat: peer entities with FK references; reverse-reachability via filtered
  # lists and a few parent sub-resources. Deliberately NOT hybrid.

  state_machine_shape: cyclic
  # Ticket loops (RESOLVED→reopen→IN_PROGRESS→RESOLVED) and Quote loops
  # (DRAFT↔SENT) are cyclic; Dispatch branches by mode; Contract/Asset/PatchJob
  # are branching pipelines.

  relationship_patterns:
    - one_to_many          # Client→Site→Asset, Contract→Asset, Ticket→Dispatch
    - cross_aggregate      # Ticket references Contract; Asset references Contract & Site
    - self_referential: false

  role_model: peer_roles
  # Each role owns a distinct slice: Dispatcher owns ticket triage/dispatch,
  # Technician executes field work, AccountManager owns quotes/procurement,
  # ServiceManager owns contracts/clients/billing, ClientContact is the SMB.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "SMB client company name" }
      - { name: primary_contact_email, type: string, source: input, description: "Primary contact email address" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Hardware procurement credit ceiling in cents" }
      - { name: credit_available_cents, type: integer, source: computed, description: "Read-only = credit_limit_cents - sum(ProcurementOrder.total_cents where status==PLACED). Recomputed on place/cancel." }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (initial) → OFFBOARDED (terminal)", constraints: "one of {ACTIVE, OFFBOARDED}" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the owning client" }
      - { name: label, type: string, source: input, description: "Site label / office name" }
      - { name: address, type: string, source: input, description: "Physical address" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: skill_level, type: enum, source: input, default: JUNIOR, description: "JUNIOR | SENIOR", constraints: "one of {JUNIOR, SENIOR}" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Labor rate per hour in cents" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client this managed-services contract covers" }
      - { name: service_tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD (drives SLA targets, included minutes)", constraints: "one of {BRONZE, SILVER, GOLD}" }
      - { name: seat_count, type: integer, source: input, description: "Billable per-seat count; mutated by SeatAdjustment" }
      - { name: per_seat_rate_cents, type: integer, source: input, description: "Monthly rate per seat in cents" }
      - { name: backup_addon, type: boolean, source: input, default: false, description: "Managed backup add-on enabled" }
      - { name: security_addon, type: boolean, source: input, default: false, description: "Managed security add-on enabled" }
      - { name: seats_available, type: integer, source: computed, description: "Read-only = seat_count - count(Asset where contract_id==this AND monitoring_status==ACTIVE)" }
      - { name: period_start, type: datetime, source: system, description: "Current billing period start (set at activation = logical clock)" }
      - { name: period_end, type: datetime, source: system, description: "Current billing period end = period_start + 30 days (half-open)" }
      - { name: period_ticket_minutes, type: integer, source: computed, default: 0, description: "Accrued billable ticket minutes in current period (incremented when a covered Ticket resolves)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT (initial) → ACTIVE → TERMINATED (terminal)", constraints: "one of {DRAFT, ACTIVE, TERMINATED}" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; physical site of the device" }
      - { name: contract_id, type: string, source: system, default: null, description: "FK -> Contract.id; set when assigned to a managed contract, cleared on unassign" }
      - { name: asset_type, type: enum, source: input, description: "LAPTOP | DESKTOP | PHONE | SERVER", constraints: "one of {LAPTOP, DESKTOP, PHONE, SERVER}" }
      - { name: hostname, type: string, source: input, description: "RMM hostname / device label" }
      - { name: monitoring_status, type: enum, source: system, default: UNMONITORED, description: "UNMONITORED (initial) → ACTIVE → RETIRED (terminal); ACTIVE→UNMONITORED on unassign", constraints: "one of {UNMONITORED, ACTIVE, RETIRED}" }
      - { name: patch_compliance_pct, type: number, source: computed, default: 100.0, description: "Read-only = round(100 * succeeded_jobs / (succeeded_jobs + failed_jobs), 2); 100.00 when no completed patch jobs exist" }

  - name: PatchJob
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; the device being patched" }
      - { name: window_start, type: datetime, source: input, description: "Maintenance window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Maintenance window end (exclusive); must be > window_start" }
      - { name: patch_count, type: integer, source: input, default: 0, description: "Number of patches applied in this run" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED (initial) → RUNNING → SUCCEEDED/FAILED (terminal); SCHEDULED→CANCELLED (terminal, cascade from asset retire)", constraints: "one of {SCHEDULED, RUNNING, SUCCEEDED, FAILED, CANCELLED}" }

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; requesting client" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the managed contract governing SLA and billing" }
      - { name: asset_id, type: string, source: input, default: null, description: "FK -> Asset.id; optional device the ticket concerns" }
      - { name: priority, type: enum, source: input, description: "P1 | P2 | P3 | P4", constraints: "one of {P1, P2, P3, P4}" }
      - { name: subject, type: string, source: input, description: "Short problem summary" }
      - { name: owner_technician_id, type: string, source: system, default: null, description: "Technician the ticket is assigned to (set on assign)" }
      - { name: first_response_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of first response (set on assign)" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when ticket resolved" }
      - { name: sla_response_due_at, type: datetime, source: computed, description: "Read-only = created_at + response_target(service_tier, priority) minutes" }
      - { name: sla_resolve_due_at, type: datetime, source: computed, description: "Read-only = created_at + resolve_target(service_tier, priority) minutes" }
      - { name: sla_response_breached, type: boolean, source: computed, description: "Read-only true iff (first_response_at is null AND now >= sla_response_due_at) OR (first_response_at > sla_response_due_at)" }
      - { name: sla_resolve_breached, type: boolean, source: computed, description: "Read-only true iff (resolved_at is null AND now >= sla_resolve_due_at) OR (resolved_at > sla_resolve_due_at)" }
      - { name: billable_minutes, type: integer, source: computed, description: "Read-only labor minutes; ESTIMATED (priority default) until first dispatch completes, then ACTUAL (sum of completed dispatch logged_minutes)" }
      - { name: status, type: enum, source: system, default: NEW, description: "NEW (initial) → IN_PROGRESS → RESOLVED; RESOLVED→IN_PROGRESS (reopen); any non-terminal → CANCELLED (terminal, cascade)", constraints: "one of {NEW, IN_PROGRESS, RESOLVED, CANCELLED}" }

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> Ticket.id; the ticket this dispatch services" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; assigned field/remote technician" }
      - { name: mode, type: enum, source: input, description: "REMOTE | ONSITE", constraints: "one of {REMOTE, ONSITE}" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled start of the visit/session (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled end (exclusive); must be > scheduled_start" }
      - { name: travel_buffer_minutes, type: integer, source: system, description: "Buffer applied AFTER the window for technician conflict math; 30 for ONSITE, 0 for REMOTE" }
      - { name: logged_minutes, type: integer, source: input, default: 0, description: "Actual labor minutes logged at completion (provided on complete)" }
      - { name: resolves_ticket, type: boolean, source: input, default: true, description: "Whether completing this dispatch resolves the parent ticket" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED (initial) → ON_SITE (ONSITE only) → COMPLETED (terminal); SCHEDULED→COMPLETED (REMOTE); SCHEDULED→CANCELLED (terminal)", constraints: "one of {SCHEDULED, ON_SITE, COMPLETED, CANCELLED}" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client the quote is for" }
      - { name: quote_type, type: enum, source: input, description: "PROJECT (project work) | PROCUREMENT (hardware)", constraints: "one of {PROJECT, PROCUREMENT}" }
      - { name: title, type: string, source: input, description: "Quote title" }
      - { name: line_items, type: array, source: input, description: "Array of { description, unit_price_cents, qty }; must be non-empty" }
      - { name: tax_rate, type: number, source: input, default: 0.08, description: "Tax rate applied per line item" }
      - { name: valid_until, type: datetime, source: input, description: "Expiry instant; SENT quote auto-expires when now >= valid_until" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Read-only = sum over line items of unit_price_cents*qty (pre-tax)" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only = sum over line items of round_half_up(unit_price_cents*qty*(1+tax_rate)) [round per line item, THEN sum]" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT (initial) → SENT → ACCEPTED (terminal); SENT→DRAFT (request-revision); SENT→EXPIRED (terminal, clock)", constraints: "one of {DRAFT, SENT, ACCEPTED, EXPIRED}" }

  - name: ProcurementOrder
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client being billed" }
      - { name: quote_id, type: string, source: input, default: null, description: "FK -> Quote.id; optional accepted PROCUREMENT quote this order draws from" }
      - { name: line_items, type: array, source: input, description: "Array of { description, unit_price_cents, qty }; must be non-empty" }
      - { name: tax_rate, type: number, source: input, default: 0.08, description: "Tax rate applied per line item" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only = sum over line items of round_half_up(unit_price_cents*qty*(1+tax_rate)) [round per line item, THEN sum]" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT (initial) → PLACED → CANCELLED (terminal); DRAFT→CANCELLED", constraints: "one of {DRAFT, PLACED, CANCELLED}" }

  - name: Invoice
    parent: null
    common_fields: false   # immutable computed billing record: id + created_at only
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the billed contract" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | FINAL", constraints: "one of {PROVISIONAL, FINAL}" }
      - { name: period_start, type: datetime, source: system, description: "Copied from contract period_start" }
      - { name: period_end, type: datetime, source: system, description: "Copied from contract period_end" }
      - { name: seat_count_snapshot, type: integer, source: computed, description: "Seats used for the base charge: current seat_count (PROVISIONAL) or period-end seat_count (FINAL)" }
      - { name: total_seat_days, type: integer, source: computed, default: 0, description: "FINAL only: accrued seat-days over the period (0 for PROVISIONAL)" }
      - { name: base_seat_charge_cents, type: integer, source: computed, description: "PROVISIONAL = seat_count*per_seat_rate_cents; FINAL = round_half_up(per_seat_rate_cents*total_seat_days/30)" }
      - { name: volume_discount_cents, type: integer, source: computed, description: "round_half_up(base_seat_charge_cents * discount_rate(seat_count_snapshot))" }
      - { name: addon_charge_cents, type: integer, source: computed, description: "(backup?800:0 + security?1500:0) * seat_count_snapshot" }
      - { name: overage_charge_cents, type: integer, source: computed, description: "max(0, period_ticket_minutes - included_minutes(service_tier)) * 250" }
      - { name: total_cents, type: integer, source: computed, description: "base_seat_charge_cents - volume_discount_cents + addon_charge_cents + overage_charge_cents" }

  - name: SeatAdjustment
    parent: null
    common_fields: false   # immutable event: id + created_at only
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the contract whose seat_count this event changes" }
      - { name: delta, type: integer, source: input, description: "Signed seat change (non-zero)" }
      - { name: effective_at, type: datetime, source: input, description: "Instant from which the new seat level applies (drives FINAL seat-day proration)" }
      - { name: reason, type: string, source: input, default: null, description: "Optional note" }
      - { name: seat_count_after, type: integer, source: computed, description: "Contract.seat_count after applying this delta" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: ACTIVE
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /clients/{id}/offboard"
        actor: ServiceManager
        preconditions:
          - "Client must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE link1: every Contract of this client with status in {ACTIVE} transitions ACTIVE→TERMINATED (see Contract terminate)"
          - "Termination of each contract itself cascades to its assets, then to patch jobs and tickets (depth-3+ chain)"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: ServiceManager
        preconditions:
          - "Contract must be DRAFT (ERR_INVALID_STATE)"
          - "Owning Client must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE surrogate: client offboarded blocks activation) — cross-entity"
          - "seat_count > 0"
        side_effects:
          - "period_start = logical clock now; period_end = period_start + 30 days"
          - "period_ticket_minutes = 0"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate (or cascade from Client offboard)"
        actor: ServiceManager
        preconditions:
          - "Contract must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE link2: every Asset with contract_id==this and monitoring_status==ACTIVE transitions ACTIVE→RETIRED (see Asset retire)"
          - "Asset retirement itself cascades to that asset's SCHEDULED PatchJobs (→CANCELLED) and open Tickets (→CANCELLED)"
          - "increments Contract.version by 1"

  - entity: Asset
    initial_state: UNMONITORED
    terminal_states: [RETIRED]
    transitions:
      - from: UNMONITORED
        to: ACTIVE
        trigger: "POST /assets/{id}/assign-contract"
        actor: ServiceManager
        preconditions:
          - "Asset must be UNMONITORED (ERR_INVALID_STATE)"
          - "Target Contract must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE) — cross-entity Asset→Contract"
          - "Contract.seats_available > 0 (ERR_NO_SEATS_AVAILABLE)"
        side_effects:
          - "contract_id = target contract id"
          - "Contract.seats_available recomputed (decremented by 1)"
          - "increments Asset.version by 1"
      - from: ACTIVE
        to: UNMONITORED
        trigger: "POST /assets/{id}/unassign-contract"
        actor: ServiceManager
        preconditions:
          - "Asset must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "contract_id = null"
          - "Contract.seats_available recomputed (incremented by 1) — compensates the assign"
          - "increments Asset.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "system (cascade when covering Contract terminates)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link3a: this asset's PatchJobs in status SCHEDULED transition SCHEDULED→CANCELLED"
          - "CASCADE link3b: this asset's Tickets in status {NEW, IN_PROGRESS} transition to CANCELLED"
          - "Contract.seats_available recomputed"

  - entity: PatchJob
    initial_state: SCHEDULED
    terminal_states: [SUCCEEDED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /patch-jobs/{id}/start"
        actor: Technician
        preconditions:
          - "PatchJob must be SCHEDULED (ERR_INVALID_STATE)"
          - "Asset.monitoring_status must be ACTIVE (ERR_ASSET_NOT_MONITORED) — cross-entity PatchJob→Asset"
        side_effects: []
      - from: RUNNING
        to: SUCCEEDED
        trigger: "POST /patch-jobs/{id}/report (outcome=SUCCEEDED)"
        actor: Technician
        preconditions:
          - "PatchJob must be RUNNING (ERR_INVALID_STATE)"
        side_effects:
          - "Asset.patch_compliance_pct recomputed"
      - from: RUNNING
        to: FAILED
        trigger: "POST /patch-jobs/{id}/report (outcome=FAILED)"
        actor: Technician
        preconditions:
          - "PatchJob must be RUNNING (ERR_INVALID_STATE)"
        side_effects:
          - "Asset.patch_compliance_pct recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade when Asset retires)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Ticket
    initial_state: NEW
    terminal_states: [CANCELLED]
    transitions:
      - from: NEW
        to: IN_PROGRESS
        trigger: "POST /tickets/{id}/assign"
        actor: Dispatcher
        preconditions:
          - "Ticket must be NEW (ERR_INVALID_STATE)"
        side_effects:
          - "owner_technician_id = body.technician_id"
          - "first_response_at = logical clock now (only if still null)"
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /tickets/{id}/resolve (or cascade from Dispatch complete when resolves_ticket)"
        actor: Technician
        preconditions:
          - "Ticket must be IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "resolved_at = logical clock now"
          - "billable_minutes finalized (ACTUAL if any completed dispatch, else ESTIMATED)"
          - "CASCADE: Contract.period_ticket_minutes += this ticket.billable_minutes (link2 of dispatch-complete chain)"
      - from: RESOLVED
        to: IN_PROGRESS
        trigger: "POST /tickets/{id}/reopen"
        actor: Dispatcher
        preconditions:
          - "Ticket must be RESOLVED (ERR_INVALID_STATE)"
        side_effects:
          - "resolved_at = null"
          - "CASCADE: Contract.period_ticket_minutes -= previously accrued billable_minutes for this ticket (reverses the resolve accrual)"
      - from: NEW
        to: CANCELLED
        trigger: "system (cascade when related Asset retires)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (cascade when related Asset retires)"
        actor: system
        preconditions: []
        side_effects:
          - "any SCHEDULED dispatches on this ticket → CANCELLED"

  - entity: Dispatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ON_SITE
        trigger: "POST /dispatches/{id}/arrive"
        actor: Technician
        preconditions:
          - "Dispatch must be SCHEDULED (ERR_INVALID_STATE)"
          - "mode must be ONSITE (ERR_INVALID_STATE — REMOTE dispatches never enter ON_SITE)"
        side_effects: []
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /dispatches/{id}/complete (ONSITE)"
        actor: Technician
        preconditions:
          - "Dispatch must be ON_SITE (ERR_INVALID_STATE)"
        side_effects:
          - "logged_minutes = body.logged_minutes"
          - "CASCADE link1: if resolves_ticket, parent Ticket IN_PROGRESS→RESOLVED (which itself accrues Contract.period_ticket_minutes)"
          - "Ticket.billable_minutes switches to ACTUAL"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /dispatches/{id}/complete (REMOTE)"
        actor: Technician
        preconditions:
          - "Dispatch must be SCHEDULED (ERR_INVALID_STATE)"
          - "mode must be REMOTE (ERR_INVALID_STATE — ONSITE must arrive first)"
        side_effects:
          - "logged_minutes = body.logged_minutes"
          - "CASCADE link1: if resolves_ticket, parent Ticket IN_PROGRESS→RESOLVED"
          - "Ticket.billable_minutes switches to ACTUAL"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dispatches/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Dispatch must be SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{id}/send"
        actor: AccountManager
        preconditions:
          - "Quote must be DRAFT (ERR_INVALID_STATE)"
          - "line_items must be non-empty (ERR_EMPTY_LINE_ITEMS)"
        side_effects: []
      - from: SENT
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: ClientContact
        preconditions:
          - "Quote must be SENT (ERR_INVALID_STATE)"
          - "now < valid_until, else the quote is treated as EXPIRED (ERR_QUOTE_EXPIRED)"
        side_effects: []
      - from: SENT
        to: DRAFT
        trigger: "POST /quotes/{id}/request-revision"
        actor: ClientContact
        preconditions:
          - "Quote must be SENT (ERR_INVALID_STATE)"
        side_effects:
          - "revert to DRAFT so the AccountManager can revise line_items"
      - from: SENT
        to: EXPIRED
        trigger: "system (when logical clock now >= valid_until, evaluated on read/accept)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProcurementOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /procurement-orders/{id}/place"
        actor: AccountManager
        preconditions:
          - "Order must be DRAFT (ERR_INVALID_STATE)"
          - "If quote_id set, that Quote must be ACCEPTED (ERR_QUOTE_NOT_ACCEPTED) — business_referential"
          - "total_cents <= Client.credit_available_cents (ERR_CREDIT_LIMIT_EXCEEDED) — business_fiscal"
        side_effects:
          - "Client.credit_available_cents recomputed (debited by total_cents)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /procurement-orders/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "Order must be DRAFT or PLACED (ERR_INVALID_STATE)"
        side_effects: []
      - from: PLACED
        to: CANCELLED
        trigger: "POST /procurement-orders/{id}/cancel"
        actor: AccountManager
        preconditions:
          - "Order must be DRAFT or PLACED (ERR_INVALID_STATE)"
        side_effects:
          - "Client.credit_available_cents recomputed (refunded by total_cents) — compensates the place debit"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: seat-adjustment-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/seat-adjustments"
    occ_field: "expected_contract_version"
    description: |
      Creating a SeatAdjustment against a Contract whose version has advanced
      since the client last observed it is rejected. A seat adjustment recomputes
      the contract's billing baseline (seat_count and the seat-day accrual that
      feeds the FINAL invoice); a new adjustment legitimately supersedes the prior
      billing baseline, so a writer holding a stale view would double-count seats.
      The stale-version check reduces this to a deterministic precondition: the
      submitted expected_contract_version must equal the current Contract.version.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: seat_base_charge
    trigger: "POST /contracts/{id}/invoices (invoice generation)"
    algorithm: forward_looking
    formula: |
      period_days = 30  (period is half-open [period_start, period_start+30d))
      PROVISIONAL:
        seat_count_snapshot = Contract.seat_count (current)
        total_seat_days = 0
        base_seat_charge_cents = seat_count_snapshot * per_seat_rate_cents
      FINAL:
        Walk seat timeline over the period: start at the seat_count in force at
        period_start, apply every SeatAdjustment whose effective_at is in
        [period_start, period_end), ordered by effective_at ASC then created_at ASC.
        For each sub-interval [t_i, t_{i+1}) accrue seats_i * whole_days(t_i, t_{i+1}).
        total_seat_days = sum of those seat-days.
        seat_count_snapshot = seat_count at period_end (final level)
        base_seat_charge_cents = round_half_up(per_seat_rate_cents * total_seat_days / period_days)
    input_set: "SeatAdjustments with effective_at in [period_start, period_end); ordered by effective_at ASC, created_at ASC tie-break"
    constants:
      PERIOD_DAYS: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "variant=PROVISIONAL — mid-period estimate on the current seat snapshot at full period rate"
        difference: "uses current seat_count for the whole period; ignores intra-period seat timeline"
      - name: FINAL
        when: "variant=FINAL — end-of-period settlement"
        difference: "seat-day weighted proration; diverges from PROVISIONAL whenever any mid-period SeatAdjustment occurred"

  - name: invoice_total
    trigger: "POST /contracts/{id}/invoices (invoice generation)"
    algorithm: tiered_pricing
    formula: |
      base = seat_base_charge_cents            (from seat_base_charge, per variant)
      discount_rate = volume_discount_rate(seat_count_snapshot):
          seat_count_snapshot in [1,9]   -> 0.00
          seat_count_snapshot in [10,24] -> 0.05
          seat_count_snapshot in [25,49] -> 0.10
          seat_count_snapshot >= 50      -> 0.15
      volume_discount_cents = round_half_up(base * discount_rate)
      addon_charge_cents = (backup_addon ? 800 : 0) * seat_count_snapshot
                         + (security_addon ? 1500 : 0) * seat_count_snapshot
      included = included_minutes(service_tier): BRONZE=600, SILVER=1200, GOLD=3000
      overage_minutes = max(0, Contract.period_ticket_minutes - included)
      overage_charge_cents = overage_minutes * OVERAGE_RATE_CENTS_PER_MIN
      total_cents = base - volume_discount_cents + addon_charge_cents + overage_charge_cents
    input_set: "single Contract snapshot at generation time"
    constants:
      BACKUP_RATE_CENTS_PER_SEAT: 800
      SECURITY_RATE_CENTS_PER_SEAT: 1500
      OVERAGE_RATE_CENTS_PER_MIN: 250
      INCLUDED_MINUTES: { BRONZE: 600, SILVER: 1200, GOLD: 3000 }
      VOLUME_TIERS: "[1,9]=0.00 | [10,24]=0.05 | [25,49]=0.10 | [50,inf)=0.15"
    precision: "integer cents, round_half_up; tier selection is on seat_count_snapshot (>= lower bound)"

  - name: order_total
    trigger: "ProcurementOrder create and Quote create (subtotal/total computed on write)"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum over line_items of (unit_price_cents * qty)
      # ROUNDING ORDER IS PINNED: round each line item AFTER tax, THEN sum.
      total_cents = sum over line_items of round_half_up(unit_price_cents * qty * (1 + tax_rate))
      # NOTE: 'sum-then-round' (round(subtotal*(1+tax_rate))) is explicitly NOT used
      # and may differ by a cent from the pinned per-line order.
    input_set: "the order's / quote's own line_items array (must be non-empty)"
    constants:
      DEFAULT_TAX_RATE: 0.08
    precision: "integer cents, round_half_up, per line item then summed"

  - name: ticket_billable_minutes
    trigger: "Ticket read; finalized on resolve"
    algorithm: aggregation
    formula: |
      completed = dispatches on this ticket with status==COMPLETED
      if completed is empty:
        billable_minutes = PRIORITY_ESTIMATE_MINUTES[priority]   (ESTIMATED)
      else:
        billable_minutes = sum(d.logged_minutes for d in completed)  (ACTUAL)
    input_set: "COMPLETED dispatches for this ticket"
    constants:
      PRIORITY_ESTIMATE_MINUTES: { P1: 240, P2: 120, P3: 60, P4: 30 }
    precision: "integer minutes"
    variants:
      - name: ESTIMATED
        when: "no dispatch has completed yet"
        difference: "priority-standard minutes"
      - name: ACTUAL
        when: "at least one dispatch has completed"
        difference: "sum of logged_minutes; diverges from ESTIMATED whenever logged time != priority standard"

  - name: sla_deadlines
    trigger: "Ticket read (computed) — response/resolve due + breach flags"
    algorithm: threshold
    formula: |
      resp_target = SLA_RESPONSE_MINUTES[service_tier][priority]
      resolve_target = SLA_RESOLVE_MINUTES[service_tier][priority]
      sla_response_due_at = created_at + resp_target minutes
      sla_resolve_due_at  = created_at + resolve_target minutes
      # BOUNDARY is '>=' (at exactly the due instant with no response, it is breached):
      sla_response_breached = (first_response_at is null AND now >= sla_response_due_at)
                              OR (first_response_at is not null AND first_response_at > sla_response_due_at)
      sla_resolve_breached  = (resolved_at is null AND now >= sla_resolve_due_at)
                              OR (resolved_at is not null AND resolved_at > sla_resolve_due_at)
    input_set: "single Ticket + logical clock now + its Contract.service_tier"
    constants:
      SLA_RESPONSE_MINUTES: "GOLD{P1:15,P2:30,P3:60,P4:120} SILVER{P1:30,P2:60,P3:120,P4:240} BRONZE{P1:60,P2:120,P3:240,P4:480}"
      SLA_RESOLVE_MINUTES: "GOLD{P1:240,P2:480,P3:1440,P4:2880} SILVER{P1:480,P2:960,P3:2880,P4:5760} BRONZE{P1:960,P2:1920,P3:5760,P4:11520}"

  - name: asset_patch_compliance
    trigger: "PatchJob report (SUCCEEDED/FAILED)"
    algorithm: aggregation
    formula: |
      succeeded = count(PatchJob where asset_id==this AND status==SUCCEEDED)
      failed    = count(PatchJob where asset_id==this AND status==FAILED)
      if (succeeded + failed) == 0:
        patch_compliance_pct = 100.00     (EMPTY-SET boundary: compliant by default)
      else:
        patch_compliance_pct = round_half_up(100 * succeeded / (succeeded + failed), 2)
    input_set: "terminal PatchJobs (SUCCEEDED/FAILED) for this asset; SCHEDULED/RUNNING/CANCELLED excluded"
    precision: "2 decimal places, round_half_up"

  - name: client_credit_available
    trigger: "ProcurementOrder place/cancel"
    algorithm: aggregation
    formula: |
      credit_available_cents = credit_limit_cents
                             - sum(ProcurementOrder.total_cents where client_id==this AND status==PLACED)
    input_set: "ProcurementOrders in status PLACED for this client"
    precision: "integer cents"

  - name: contract_seats_available
    trigger: "Asset assign-contract / unassign-contract; Asset retire cascade"
    algorithm: aggregation
    formula: |
      seats_available = seat_count
                      - count(Asset where contract_id==this AND monitoring_status==ACTIVE)
    input_set: "Assets with monitoring_status==ACTIVE assigned to this contract"
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids exist (validated left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (by type)"
    http_status: 404
    applies_to: all endpoints referencing an id

  - priority: 4
    category: business_referential
    check: "Ownership: entity_backed acting role must own the resource (ClientContact.X-User-ID == resource.client_id; Technician.X-User-ID == dispatch.technician_id / patch job's assigned tech)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ClientContact and Technician mutations on owned resources"

  - priority: 5
    category: state
    check: "Target resource is in a state that admits the requested transition"
    error_id: "ERR_INVALID_STATE (or specific: ERR_TICKET_NOT_DISPATCHABLE, ERR_QUOTE_EXPIRED)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity reference is in the required state (Ticket create: governing Contract ACTIVE; Asset assign: target Contract ACTIVE; PatchJob create: Asset monitoring_status ACTIVE; ProcurementOrder place: linked Quote ACCEPTED)"
    error_id: "ERR_CONTRACT_NOT_ACTIVE | ERR_ASSET_NOT_MONITORED | ERR_QUOTE_NOT_ACCEPTED"
    http_status: 409
    applies_to: "POST /tickets, POST /assets/{id}/assign-contract, POST /assets/{id}/patch-jobs, POST /procurement-orders/{id}/place"

  - priority: 7
    category: business_temporal
    check: "Resource temporal-overlap: technician double-booking (buffered) on dispatch create; patch window overlap (adjacency-allowed) on patch-job create"
    error_id: "ERR_TECHNICIAN_DOUBLE_BOOKED | ERR_PATCH_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /tickets/{id}/dispatches, POST /assets/{id}/patch-jobs"

  - priority: 8
    category: business_constraint
    check: "Constraint satisfaction: non-empty line_items; seat capacity (seats_available>0 to assign; seat delta not below assigned-asset floor); non-zero seat delta; window_end>start"
    error_id: "ERR_EMPTY_LINE_ITEMS | ERR_NO_SEATS_AVAILABLE | ERR_SEAT_FLOOR_VIOLATION | ERR_INVALID_SEAT_DELTA | ERR_INVALID_TIME_WINDOW"
    http_status: 422
    applies_to: "quote/order/dispatch/patch/seat-adjustment/assign endpoints"

  - priority: 9
    category: business_fiscal
    check: "Fiscal ceiling: ProcurementOrder.total_cents must not exceed Client.credit_available_cents at place time"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /procurement-orders/{id}/place"

  - priority: 10
    category: state
    check: "OCC: expected_contract_version must equal current Contract.version on seat-adjustment create"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /contracts/{id}/seat-adjustments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for SLA deadlines, quote expiry, and billing periods. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default (never real wall-clock time). ALL server-stamped timestamps (created_at, updated_at, first_response_at, resolved_at, period_start/period_end) are read from this logical clock, so entity created_at equals the clock value at creation time."
    roles: [ServiceManager]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["logical clock now = to_iso8601"]

  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Create a client"
    roles: [ServiceManager]
    code: 201
    input: ["company_name", "primary_contact_email", "credit_limit_cents?"]
    output: Client
    side_effects: ["status=ACTIVE", "credit_available_cents = credit_limit_cents"]
  - method: GET
    path: "/clients/{id}"
    description: "Get a client (exposes computed credit_available_cents)"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/clients/{id}/offboard"
    description: "Offboard a client; cascades to contracts, assets, patch jobs, tickets"
    roles: [ServiceManager]
    code: 200
    input: []
    output: Client
    side_effects:
      - "status ACTIVE→OFFBOARDED"
      - "each ACTIVE Contract → TERMINATED (cascade → asset retire → patch cancel + ticket cancel)"
      - "increments Client.version by 1"

  # --- Site ---
  - method: POST
    path: "/sites"
    description: "Create a site under a client"
    roles: [ServiceManager, AccountManager]
    code: 201
    input: [client_id, label, address]
    output: Site
    side_effects: []
  - method: GET
    path: "/sites/{id}"
    description: "Get a site"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/sites"
    description: "List sites; filter by client_id"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: "Site[]"
    side_effects: []

  # --- Technician ---
  - method: POST
    path: "/technicians"
    description: "Register a technician"
    roles: [ServiceManager]
    code: 201
    input: ["full_name", "skill_level?", "hourly_rate_cents"]
    output: Technician
    side_effects: []

  # --- Contract ---
  - method: POST
    path: "/contracts"
    description: "Create a managed-services contract (DRAFT)"
    roles: [ServiceManager, AccountManager]
    code: 201
    input: ["client_id", "service_tier", "seat_count", "per_seat_rate_cents", "backup_addon?", "security_addon?"]
    output: Contract
    side_effects: ["status=DRAFT", "seats_available=seat_count", "period_ticket_minutes=0"]
  - method: GET
    path: "/contracts/{id}"
    description: "Get a contract"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts; filter by client_id, status"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []
  - method: POST
    path: "/contracts/{id}/activate"
    description: "Activate a DRAFT contract; opens the first billing period"
    roles: [ServiceManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["status DRAFT→ACTIVE", "period_start=now, period_end=now+30d", "increments Contract.version by 1"]
  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate an ACTIVE contract; cascades to assets/patch/tickets"
    roles: [ServiceManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["status ACTIVE→TERMINATED", "covered ACTIVE assets → RETIRED (cascade)", "increments Contract.version by 1"]
  - method: POST
    path: "/contracts/{id}/seat-adjustments"
    description: "Record a seat change against a contract (OCC-guarded supersede of billing baseline)"
    roles: [ServiceManager, AccountManager]
    code: 201
    input: ["delta", "effective_at", "expected_contract_version", "reason?"]
    output: SeatAdjustment
    side_effects:
      - "Contract.seat_count += delta"
      - "seat_count_after recorded"
      - "Contract.seats_available recomputed"
      - "increments Contract.version by 1"
  - method: GET
    path: "/contracts/{id}/seat-adjustments"
    description: "List seat adjustments for a contract"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "SeatAdjustment[]"
    side_effects: []
  - method: POST
    path: "/contracts/{id}/invoices"
    description: "Generate a PROVISIONAL or FINAL invoice for the contract's current period"
    roles: [ServiceManager]
    code: 201
    input: [variant]
    output: Invoice
    side_effects: ["computes seat_base_charge, volume_discount, addon, overage, total per §1.3"]
  - method: GET
    path: "/contracts/{id}/invoices"
    description: "List invoices generated for a contract"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  # --- Asset ---
  - method: POST
    path: "/assets"
    description: "Add an asset to inventory (UNMONITORED)"
    roles: [ServiceManager, AccountManager]
    code: 201
    input: [client_id, site_id, asset_type, hostname]
    output: Asset
    side_effects: ["monitoring_status=UNMONITORED", "patch_compliance_pct=100.0"]
  - method: GET
    path: "/assets/{id}"
    description: "Get an asset"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: GET
    path: "/assets"
    description: "List assets; filter by client_id, site_id, contract_id, monitoring_status"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["client_id?", "site_id?", "contract_id?", "monitoring_status?", "limit?", "offset?"]
    output: "Asset[]"
    side_effects: []
  - method: POST
    path: "/assets/{id}/assign-contract"
    description: "Assign asset to an ACTIVE contract, consuming a seat and starting RMM monitoring"
    roles: [ServiceManager, AccountManager]
    code: 200
    input: [contract_id]
    output: Asset
    side_effects: ["monitoring_status UNMONITORED→ACTIVE", "contract_id set", "Contract.seats_available decremented", "increments Asset.version by 1"]
  - method: POST
    path: "/assets/{id}/unassign-contract"
    description: "Unassign asset from its contract, releasing the seat"
    roles: [ServiceManager, AccountManager]
    code: 200
    input: []
    output: Asset
    side_effects: ["monitoring_status ACTIVE→UNMONITORED", "contract_id cleared", "Contract.seats_available incremented", "increments Asset.version by 1"]
  - method: POST
    path: "/assets/{id}/patch-jobs"
    description: "Schedule an RMM patch job for a maintenance window on an asset (asset must be actively monitored)"
    roles: [Dispatcher, Technician]
    code: 201
    input: ["window_start", "window_end", "patch_count?"]
    output: PatchJob
    side_effects: ["status=SCHEDULED", "requires Asset.monitoring_status==ACTIVE (ERR_ASSET_NOT_MONITORED); rejects window overlap (ERR_PATCH_WINDOW_CONFLICT)"]
  - method: GET
    path: "/assets/{id}/patch-jobs"
    description: "List patch jobs for an asset"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PatchJob[]"
    side_effects: []

  # --- PatchJob ---
  - method: POST
    path: "/patch-jobs/{id}/start"
    description: "Start a scheduled patch job (asset must be actively monitored)"
    roles: [Technician]
    code: 200
    input: []
    output: PatchJob
    side_effects: ["status SCHEDULED→RUNNING"]
  - method: POST
    path: "/patch-jobs/{id}/report"
    description: "Report a running patch job outcome"
    roles: [Technician]
    code: 200
    input: ["outcome", "patch_count?"]
    output: PatchJob
    side_effects: ["status RUNNING→SUCCEEDED|FAILED", "Asset.patch_compliance_pct recomputed"]

  # --- Ticket ---
  - method: POST
    path: "/tickets"
    description: "Open a support ticket (requires an ACTIVE governing contract)"
    roles: [ServiceManager, Dispatcher, ClientContact]
    code: 201
    input: ["client_id", "contract_id", "priority", "subject", "asset_id?"]
    output: Ticket
    side_effects: ["status=NEW", "sla_*_due_at computed from contract tier + priority + created_at"]
  - method: GET
    path: "/tickets/{id}"
    description: "Get a ticket (computes SLA breach flags against current clock)"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: []
    output: Ticket
    side_effects: []
  - method: GET
    path: "/tickets"
    description: "List tickets; filter by client_id, asset_id, contract_id, status"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["client_id?", "asset_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: "Ticket[]"
    side_effects: []
  - method: POST
    path: "/tickets/{id}/assign"
    description: "Assign a ticket to a technician (records first response)"
    roles: [Dispatcher]
    code: 200
    input: [technician_id]
    output: Ticket
    side_effects: ["status NEW→IN_PROGRESS", "owner_technician_id set", "first_response_at=now (if null)"]
  - method: POST
    path: "/tickets/{id}/resolve"
    description: "Resolve an in-progress ticket"
    roles: [Technician, Dispatcher]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status IN_PROGRESS→RESOLVED", "resolved_at=now", "billable_minutes finalized", "Contract.period_ticket_minutes += billable_minutes"]
  - method: POST
    path: "/tickets/{id}/reopen"
    description: "Reopen a resolved ticket"
    roles: [Dispatcher, ClientContact]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status RESOLVED→IN_PROGRESS", "resolved_at=null", "Contract.period_ticket_minutes -= previously accrued minutes"]
  - method: POST
    path: "/tickets/{id}/dispatches"
    description: "Create a remote/onsite dispatch for a ticket (technician overlap checked)"
    roles: [Dispatcher]
    code: 201
    input: ["technician_id", "mode", "scheduled_start", "scheduled_end", "resolves_ticket?"]
    output: Dispatch
    side_effects: ["status=SCHEDULED", "travel_buffer_minutes = 30 if ONSITE else 0"]

  # --- Dispatch ---
  - method: GET
    path: "/dispatches/{id}"
    description: "Get a dispatch"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: []
    output: Dispatch
    side_effects: []
  - method: GET
    path: "/dispatches"
    description: "List dispatches; filter by ticket_id, technician_id, status"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["ticket_id?", "technician_id?", "status?", "limit?", "offset?"]
    output: "Dispatch[]"
    side_effects: []
  - method: POST
    path: "/dispatches/{id}/arrive"
    description: "Mark an ONSITE dispatch arrived"
    roles: [Technician]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["status SCHEDULED→ON_SITE"]
  - method: POST
    path: "/dispatches/{id}/complete"
    description: "Complete a dispatch, logging labor minutes; may resolve the ticket"
    roles: [Technician]
    code: 200
    input: [logged_minutes]
    output: Dispatch
    side_effects: ["status →COMPLETED", "logged_minutes recorded", "if resolves_ticket: parent Ticket IN_PROGRESS→RESOLVED (cascade)"]
  - method: POST
    path: "/dispatches/{id}/cancel"
    description: "Cancel a scheduled dispatch"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["status SCHEDULED→CANCELLED"]

  # --- Quote ---
  - method: POST
    path: "/quotes"
    description: "Create a project or procurement quote"
    roles: [AccountManager]
    code: 201
    input: ["client_id", "quote_type", "title", "line_items", "valid_until", "tax_rate?"]
    output: Quote
    side_effects: ["status=DRAFT", "subtotal_cents/total_cents computed per order_total"]
  - method: GET
    path: "/quotes/{id}"
    description: "Get a quote (auto-expires SENT quotes past valid_until)"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: GET
    path: "/quotes"
    description: "List quotes; filter by client_id, status"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "Quote[]"
    side_effects: []
  - method: POST
    path: "/quotes/{id}/send"
    description: "Send a draft quote to the client"
    roles: [AccountManager]
    code: 200
    input: []
    output: Quote
    side_effects: ["status DRAFT→SENT"]
  - method: POST
    path: "/quotes/{id}/accept"
    description: "Client accepts a sent quote"
    roles: [ClientContact]
    code: 200
    input: []
    output: Quote
    side_effects: ["status SENT→ACCEPTED"]
  - method: POST
    path: "/quotes/{id}/request-revision"
    description: "Client requests a revision, reverting the quote to DRAFT"
    roles: [ClientContact]
    code: 200
    input: []
    output: Quote
    side_effects: ["status SENT→DRAFT"]

  # --- ProcurementOrder ---
  - method: POST
    path: "/procurement-orders"
    description: "Create a hardware procurement order (DRAFT)"
    roles: [AccountManager]
    code: 201
    input: ["client_id", "line_items", "quote_id?", "tax_rate?"]
    output: ProcurementOrder
    side_effects: ["status=DRAFT", "total_cents computed per order_total"]
  - method: GET
    path: "/procurement-orders/{id}"
    description: "Get a procurement order"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: []
    output: ProcurementOrder
    side_effects: []
  - method: GET
    path: "/procurement-orders"
    description: "List procurement orders; filter by client_id, quote_id, status"
    roles: [ServiceManager, Dispatcher, Technician, AccountManager, ClientContact]
    code: 200
    input: ["client_id?", "quote_id?", "status?", "limit?", "offset?"]
    output: "ProcurementOrder[]"
    side_effects: []
  - method: POST
    path: "/procurement-orders/{id}/place"
    description: "Place a procurement order, debiting client credit"
    roles: [AccountManager, ServiceManager]
    code: 200
    input: []
    output: ProcurementOrder
    side_effects: ["status DRAFT→PLACED", "Client.credit_available_cents debited by total_cents"]
  - method: POST
    path: "/procurement-orders/{id}/cancel"
    description: "Cancel a procurement order; refunds credit if it was placed"
    roles: [AccountManager, ServiceManager]
    code: 200
    input: []
    output: ProcurementOrder
    side_effects: ["status →CANCELLED", "if was PLACED: Client.credit_available_cents refunded by total_cents"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed role acting on a resource it does not own" }
  # input / constraint
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body or missing required field" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries a value outside its declared set" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "end <= start for a patch window or dispatch window" }
  - { id: ERR_EMPTY_LINE_ITEMS, http: 422, condition: "Quote/ProcurementOrder line_items is empty" }
  - { id: ERR_INVALID_SEAT_DELTA, http: 422, condition: "Seat adjustment delta is zero" }
  - { id: ERR_SEAT_FLOOR_VIOLATION, http: 422, condition: "Seat adjustment would drop seat_count below the count of ACTIVE assigned assets" }
  - { id: ERR_NO_SEATS_AVAILABLE, http: 422, condition: "Assign requested but Contract.seats_available == 0" }
  # not found
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id does not exist" }
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "Site id does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "Contract id does not exist" }
  - { id: ERR_ASSET_NOT_FOUND, http: 404, condition: "Asset id does not exist" }
  - { id: ERR_PATCH_JOB_NOT_FOUND, http: 404, condition: "PatchJob id does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "Ticket id does not exist" }
  - { id: ERR_DISPATCH_NOT_FOUND, http: 404, condition: "Dispatch id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "Quote id does not exist" }
  - { id: ERR_PROCUREMENT_ORDER_NOT_FOUND, http: 404, condition: "ProcurementOrder id does not exist" }
  # state
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that admits the requested transition" }
  - { id: ERR_TICKET_NOT_DISPATCHABLE, http: 409, condition: "Dispatch create attempted on a ticket not IN_PROGRESS" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accept attempted on a quote past valid_until" }
  # cross-entity referential
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires the governing/target Contract to be ACTIVE" }
  - { id: ERR_ASSET_NOT_MONITORED, http: 409, condition: "PatchJob start requires Asset.monitoring_status == ACTIVE" }
  - { id: ERR_QUOTE_NOT_ACCEPTED, http: 409, condition: "Placing an order whose linked quote is not ACCEPTED" }
  # temporal
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "New dispatch window (with buffer) overlaps an existing dispatch for the same technician" }
  - { id: ERR_PATCH_WINDOW_CONFLICT, http: 409, condition: "New patch window overlaps an existing non-terminal patch window on the same asset" }
  # fiscal
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "ProcurementOrder.total_cents exceeds Client.credit_available_cents at place time" }
  # concurrency
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version != current Contract.version on seat-adjustment create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ServiceManager
    description: "Operations lead: owns clients, contracts, billing, offboarding, technician roster"
    identity: opaque
    exclusive_operations:
      - "POST /clients — create client"
      - "POST /clients/{id}/offboard — offboard client"
      - "POST /technicians — register technician"
      - "POST /contracts/{id}/activate — activate contract"
      - "POST /contracts/{id}/terminate — terminate contract"
      - "POST /contracts/{id}/invoices — generate invoice"
      - "POST /_clock/set_current_utc — set logical clock (test-driving)"
    shared_operations:
      - "POST /sites, POST /contracts, POST /assets — with AccountManager"
      - "POST /assets/{id}/assign-contract, POST /assets/{id}/unassign-contract, POST /contracts/{id}/seat-adjustments — with AccountManager"
      - "POST /procurement-orders/{id}/place, POST /procurement-orders/{id}/cancel — with AccountManager"
      - "all GET reads"

  - name: Dispatcher
    description: "Service desk: triages tickets, assigns/reopens, schedules dispatches and patch jobs"
    identity: opaque
    exclusive_operations:
      - "POST /tickets/{id}/assign — assign ticket"
      - "POST /tickets/{id}/dispatches — create dispatch"
      - "POST /dispatches/{id}/cancel — cancel dispatch"
    shared_operations:
      - "POST /tickets — with ServiceManager, ClientContact"
      - "POST /tickets/{id}/resolve — with Technician"
      - "POST /tickets/{id}/reopen — with ClientContact"
      - "POST /assets/{id}/patch-jobs — with Technician"
      - "all GET reads"

  - name: Technician
    description: "Field/remote engineer: executes dispatches and patch jobs, logs labor"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /dispatches/{id}/arrive — mark arrived"
      - "POST /dispatches/{id}/complete — complete dispatch"
      - "POST /patch-jobs/{id}/start — start patch job"
      - "POST /patch-jobs/{id}/report — report patch outcome"
    shared_operations:
      - "POST /tickets/{id}/resolve — with Dispatcher"
      - "POST /assets/{id}/patch-jobs — with Dispatcher"
      - "all GET reads"

  - name: AccountManager
    description: "Client-facing: owns quotes, projects, procurement, sites/assets onboarding"
    identity: opaque
    exclusive_operations:
      - "POST /quotes — create quote"
      - "POST /quotes/{id}/send — send quote"
      - "POST /procurement-orders — create procurement order"
    shared_operations:
      - "POST /sites, POST /contracts, POST /assets — with ServiceManager"
      - "POST /assets/{id}/assign-contract, POST /assets/{id}/unassign-contract, POST /contracts/{id}/seat-adjustments — with ServiceManager"
      - "POST /procurement-orders/{id}/place, POST /procurement-orders/{id}/cancel — with ServiceManager"
      - "all GET reads"

  - name: ClientContact
    description: "The SMB customer: opens tickets, accepts/revises quotes, reopens tickets for own client"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /quotes/{id}/accept — accept quote (own client)"
      - "POST /quotes/{id}/request-revision — request revision (own client)"
    shared_operations:
      - "POST /tickets — with ServiceManager, Dispatcher (own client only)"
      - "POST /tickets/{id}/reopen — with Dispatcher (own client only)"
      - "all GET reads (own resources)"
