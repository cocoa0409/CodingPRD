# =============================================================================
# Task 2031: Freight Audit & Payment Services — Scaffold Seed Tables
# =============================================================================

scenario: |
  2031. Freight Audit & Payment Services (freight audit provider): invoice capture &
  rate-contract matching, duplicate & accessorial validation, exception routing &
  carrier dispute, GL coding & cost allocation to business units, payment schedule &
  carrier remittance advice, currency/multi-country handling, savings reporting &
  recovery of overcharges, data feed to transportation analytics

domain_name: freight-audit-payment
api_prefix: /fap

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shipper client display name" }
      - { name: home_country, type: string, source: input, description: "ISO 3166-1 alpha-2 home country" }
      - { name: home_currency, type: string, source: input, description: "ISO 4217 home currency used for savings reporting and FX conversion target" }
      - { name: audit_tolerance_minor, type: integer, source: input, default: 500, description: "Absolute variance tolerance in home-currency minor units; |variance| <= tolerance auto-clears" }
      - { name: audit_tolerance_pct_bp, type: integer, source: input, default: 200, description: "Variance tolerance in basis points of rated total; |variance_pct_bp| <= this auto-clears" }
      - { name: dispute_window_days, type: integer, source: input, default: 30, description: "Days an audit exception may remain unresolved before system expiry" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: savings_realized_minor, type: integer, source: computed, description: "Avoided overcharges on PAID/SHORT_PAID invoices plus recovered_minor on COLLECTED claims (home currency)" }
      - { name: outstanding_liability_minor, type: integer, source: computed, description: "Sum of approved minus paid over invoices with audit_status CLEARED and payment_status in {UNPAID, SCHEDULED} (home currency)" }

  - name: Carrier
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id; owning shipper account" }
      - { name: scac_code, type: string, source: input, description: "Standard Carrier Alpha Code" }
      - { name: legal_name, type: string, source: input, description: "Carrier legal name" }
      - { name: country, type: string, source: input, description: "ISO 3166-1 alpha-2 carrier domicile" }
      - { name: billing_currency, type: string, source: input, description: "Currency the carrier invoices in" }
      - { name: payment_terms_days, type: integer, source: input, default: 30, description: "Days after invoice_date an invoice falls due" }
      - { name: remit_email, type: string, source: input, description: "Remittance advice destination" }
      - { name: status, type: enum, source: system, description: "PENDING_ONBOARD | ACTIVE | SUSPENDED | OFFBOARDED" }

  - name: RateContract
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; contract counterparty" }
      - { name: name, type: string, source: input, description: "Contract label" }
      - { name: currency, type: string, source: input, description: "Currency of all lane rates" }
      - { name: lanes, type: array, source: input, description: "Lane objects: { origin_country, dest_country, mode, weight_breaks: [{min_kg, rate_per_kg_minor}] ascending by min_kg, fuel_surcharge_pct_bp, accessorials: [{code, flat_minor, cap_pct_bp}], minimum_charge_minor }" }
      - { name: effective_from, type: string, source: input, description: "Inclusive start date (YYYY-MM-DD) of half-open window" }
      - { name: effective_to, type: string, source: input, description: "Exclusive end date (YYYY-MM-DD) of half-open window" }
      - { name: supersedes_contract_id, type: string, source: input, required: false, description: "FK -> RateContract.id; the ACTIVE contract this one replaces on activation" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | EXPIRED | DISCARDED" }
      - { name: activated_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of activation; null until ACTIVE" }

  - name: ShipmentRecord
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; hauling carrier" }
      - { name: pro_number, type: string, source: input, description: "PRO number; unique per (client, carrier) among non-VOIDED shipments" }
      - { name: ship_date, type: string, source: input, description: "Ship date YYYY-MM-DD" }
      - { name: origin_country, type: string, source: input, description: "Origin country" }
      - { name: dest_country, type: string, source: input, description: "Destination country" }
      - { name: mode, type: enum, source: input, description: "PARCEL | LTL | FTL | AIR | OCEAN" }
      - { name: actual_weight_kg, type: number, source: input, description: "Actual weight in kilograms" }
      - { name: accessorials_rendered, type: array, source: input, required: false, description: "Accessorial service codes actually rendered, e.g. [LIFTGATE]" }
      - { name: status, type: enum, source: system, description: "REGISTERED | INVOICED | CLOSED | VOIDED" }

  - name: CarrierInvoice
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; invoicing carrier" }
      - { name: shipment_id, type: string, source: input, required: false, description: "FK -> ShipmentRecord.id; matched shipment fact" }
      - { name: rated_contract_id, type: string, source: system, required: false, description: "FK -> RateContract.id; contract used by the most recent rating pass" }
      - { name: invoice_number, type: string, source: input, description: "Carrier invoice number; unique per (client, carrier) among non-VOIDED invoices" }
      - { name: invoice_date, type: string, source: input, description: "Invoice date YYYY-MM-DD" }
      - { name: currency, type: string, source: input, description: "Invoice currency; must equal carrier billing_currency" }
      - { name: billed_total_minor, type: integer, source: input, description: "Carrier-billed total in minor units; must equal sum of lines" }
      - { name: audit_status, type: enum, source: system, description: "RECEIVED | CAPTURED | RATED | CLEARED | EXCEPTION | VOIDED (parallel dimension 1)" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | SCHEDULED | PAID | SHORT_PAID | WRITTEN_OFF (parallel dimension 2)" }
      - { name: duplicate_flag, type: enum, source: system, description: "NONE | FUZZY; set at capture" }
      - { name: rated_total_minor, type: integer, source: computed, description: "Contract-expected total in invoice currency; 0 until rated" }
      - { name: variance_minor, type: integer, source: computed, description: "billed_total_minor - rated_total_minor (signed)" }
      - { name: variance_pct_bp, type: integer, source: computed, description: "floor(|variance_minor| * 10000 / max(rated_total_minor, 1))" }
      - { name: approved_amount_minor, type: integer, source: computed, description: "Amount payable in invoice currency after audit and exception resolutions" }
      - { name: home_total_minor, type: integer, source: computed, description: "Approved amount converted to client home currency at invoice-date FX, per-line rounded then summed" }
      - { name: scheduled_minor, type: integer, source: computed, description: "Sum of PaymentRunItem.scheduled_amount_minor for items in runs with status RELEASED (run currency)" }
      - { name: paid_minor, type: integer, source: computed, description: "Sum settled on this invoice via SETTLED runs (run currency)" }
      - { name: due_date, type: string, source: computed, description: "invoice_date + carrier.payment_terms_days (YYYY-MM-DD)" }

  - name: InvoiceLine
    parent: CarrierInvoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> CarrierInvoice.id" }
      - { name: gl_account_id, type: string, source: input, required: false, description: "FK -> GLAccount.id; primary GL code assigned during GL coding" }
      - { name: charge_code, type: enum, source: input, description: "BASE_FREIGHT | FUEL_SURCHARGE | LIFTGATE | RESIDENTIAL | INSIDE_DELIVERY | DETENTION | STORAGE | OTHER" }
      - { name: billed_amount_minor, type: integer, source: input, description: "Carrier-billed line amount" }
      - { name: rated_amount_minor, type: integer, source: computed, description: "Contract-expected line amount" }
      - { name: variance_minor, type: integer, source: computed, description: "billed_amount_minor - rated_amount_minor (signed)" }

  - name: AuditException
    parent: CarrierInvoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> CarrierInvoice.id" }
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id" }
      - { name: code, type: enum, source: system, description: "RATE_MISMATCH | DUPLICATE_FUZZY | INVALID_ACCESSORIAL | NO_CONTRACT" }
      - { name: disputed_amount_minor, type: integer, source: system, description: "Amount withheld from payment while open" }
      - { name: resolution_credit_minor, type: integer, source: system, default: 0, description: "Credit agreed at resolution" }
      - { name: routed_queue, type: enum, source: system, description: "AUDIT_TEAM | CARRIER | FINANCE; routing per code: NO_CONTRACT/DUPLICATE_FUZZY -> AUDIT_TEAM, RATE_MISMATCH/INVALID_ACCESSORIAL -> CARRIER" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of counter offers made; max 3" }
      - { name: opened_date, type: string, source: system, description: "Logical-clock date the exception was raised" }
      - { name: status, type: enum, source: system, description: "OPEN | CARRIER_NOTIFIED | CARRIER_RESPONDED | RESOLVED_ACCEPTED | RESOLVED_CONCEDED | ESCALATED | EXPIRED" }

  - name: GLAccount
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id" }
      - { name: code, type: string, source: input, description: "GL account code; unique per client" }
      - { name: business_unit, type: string, source: input, description: "Business unit this account rolls up to" }
      - { name: country, type: string, source: input, description: "Country of the account" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive accounts reject new coding" }

  - name: CostAllocation
    parent: InvoiceLine
    common_fields: true
    fields:
      - { name: invoice_line_id, type: string, source: system, description: "FK -> InvoiceLine.id" }
      - { name: gl_account_id, type: string, source: input, description: "FK -> GLAccount.id; allocation target" }
      - { name: percentage_bp, type: integer, source: input, description: "Share of the line amount in basis points; per-line allocations must sum to exactly 10000" }
      - { name: allocated_minor, type: integer, source: computed, description: "Allocated amount in invoice currency; recomputed on every set/replace" }

  - name: PaymentRun
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id" }
      - { name: run_date, type: string, source: input, description: "Scheduled payment date YYYY-MM-DD; must be >= current logical date" }
      - { name: currency, type: string, source: input, description: "Settlement currency of the run" }
      - { name: country_scope, type: string, source: input, required: false, description: "Optional ISO country restricting auto_fill carrier selection" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | RELEASED | SETTLED | CANCELLED" }
      - { name: gross_total_minor, type: integer, source: computed, description: "Sum of item scheduled amounts before discount" }
      - { name: discount_total_minor, type: integer, source: computed, description: "Sum of item discounts computed at lock" }
      - { name: total_minor, type: integer, source: computed, description: "gross_total_minor - discount_total_minor" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID that created the run (segregation of duties)" }
      - { name: locked_by_user_id, type: string, source: system, required: false, description: "X-User-ID that locked the run (segregation of duties)" }

  - name: PaymentRunItem
    parent: PaymentRun
    common_fields: true
    fields:
      - { name: payment_run_id, type: string, source: system, description: "FK -> PaymentRun.id" }
      - { name: invoice_id, type: string, source: input, description: "FK -> CarrierInvoice.id; invoice being scheduled" }
      - { name: scheduled_amount_minor, type: integer, source: computed, description: "Invoice approved_amount_minor converted to run currency at payment-date FX" }
      - { name: discount_minor, type: integer, source: computed, description: "Early-settlement discount computed at lock" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RELEASED | PAID" }

  - name: RemittanceAdvice
    parent: PaymentRun
    common_fields: true
    fields:
      - { name: payment_run_id, type: string, source: system, description: "FK -> PaymentRun.id" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; advice recipient" }
      - { name: total_minor, type: integer, source: computed, description: "Sum of (scheduled - discount) for this carrier's items" }
      - { name: item_count, type: integer, source: computed, description: "Number of run items for this carrier" }
      - { name: status, type: enum, source: system, description: "GENERATED | SENT | ACKNOWLEDGED" }

  - name: FxRate
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id" }
      - { name: from_currency, type: string, source: input, description: "Source currency" }
      - { name: to_currency, type: string, source: input, description: "Target currency" }
      - { name: effective_date, type: string, source: input, description: "Date from which this rate applies (YYYY-MM-DD)" }
      - { name: rate_ppm, type: integer, source: input, description: "Rate in parts per million: target = source * rate_ppm / 1000000" }
      - { name: source, type: enum, source: input, description: "ECB | MANUAL" }

  - name: RecoveryClaim
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id" }
      - { name: invoice_id, type: string, source: system, description: "FK -> CarrierInvoice.id; paid invoice being clawed back" }
      - { name: claimed_amount_minor, type: integer, source: input, description: "Amount sought from carrier (invoice currency)" }
      - { name: channel, type: enum, source: input, description: "CREDIT_MEMO | REFUND | OFFSET" }
      - { name: recovered_minor, type: integer, source: system, default: 0, description: "Amount actually recovered at collect" }
      - { name: status, type: enum, source: system, description: "DRAFTED | FILED | ACKNOWLEDGED | REBUTTED | COLLECTED | ABANDONED" }

  - name: AnalyticsExport
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id" }
      - { name: date_from, type: string, source: input, description: "Inclusive invoice_date lower bound" }
      - { name: date_to, type: string, source: input, description: "Inclusive invoice_date upper bound; must be >= date_from" }
      - { name: include_statuses, type: array, source: input, required: false, description: "Optional audit_status filter list; omitted means all statuses" }
      - { name: row_count, type: integer, source: system, description: "Number of invoices in the export" }
      - { name: checksum, type: string, source: system, description: "'sha256:' + sha256 hex of comma-joined invoice_numbers ordered by invoice created_at ASC then invoice_number ASC" }
      - { name: status, type: enum, source: system, description: "REQUESTED | COMPLETED | FAILED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ClientAccount
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /fap/clients/{id}/activate"
        actor: FapAdmin
        preconditions: []
        side_effects: ["Business mutations gated on status == ACTIVE become available"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fap/clients/{id}/suspend"
        actor: FapAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fap/clients/{id}/activate"
        actor: FapAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /fap/clients/{id}/terminate"
        actor: FapAdmin
        preconditions:
          - "outstanding_liability_minor == 0 and no invoice with payment_status in {UNPAID, SCHEDULED} (ERR_CLIENT_NOT_SETTLED)"
        side_effects: []

  - entity: Carrier
    initial_state: PENDING_ONBOARD
    terminal_states: [OFFBOARDED]
    transitions:
      - from: PENDING_ONBOARD
        to: ACTIVE
        trigger: "POST /fap/carriers/{id}/approve_onboard"
        actor: FapAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fap/carriers/{id}/suspend"
        actor: FapAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fap/carriers/{id}/reinstate"
        actor: FapAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /fap/carriers/{id}/offboard"
        actor: FapAdmin
        preconditions:
          - "No invoices for this carrier with payment_status in {UNPAID, SCHEDULED} (ERR_CARRIER_HAS_OPEN_INVOICES)"
        side_effects: []
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "POST /fap/carriers/{id}/offboard"
        actor: FapAdmin
        preconditions:
          - "No invoices for this carrier with payment_status in {UNPAID, SCHEDULED} (ERR_CARRIER_HAS_OPEN_INVOICES)"
        side_effects: []

  - entity: RateContract
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, DISCARDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fap/rate-contracts/{id}/activate"
        actor: FapAdmin
        preconditions:
          - "OCC: expected_rate_contract_version == RateContract.version (ERR_STALE_VERSION)"
          - "effective_from < effective_to (ERR_CONTRACT_WINDOW_INVALID)"
          - "Every lane's weight_breaks strictly ascending by min_kg (ERR_WEIGHT_BREAK_INVALID)"
          - "Window overlap check (ERR_CONTRACT_WINDOW_OVERLAP) — see validations priority 8"
        side_effects:
          - "activated_at = current logical clock"
          - "RateContract.version increments by 1"
          - "If supersedes_contract_id set: that contract ACTIVE -> SUPERSEDED (cascade hop 1)"
          - "Cascade hop 2: every CarrierInvoice with rated_contract_id == superseded contract and audit_status in {RATED, EXCEPTION} is re-rated against the newly ACTIVE contract (line_rating recalculates rated_total_minor, variance_minor, variance_pct_bp; rated_contract_id updated)"
          - "Cascade hop 3: every AuditException with status in {OPEN, CARRIER_NOTIFIED, CARRIER_RESPONDED} and code == RATE_MISMATCH on a re-rated invoice is re-evaluated: if the new |variance_minor| <= client.audit_tolerance_minor AND new variance_pct_bp <= client.audit_tolerance_pct_bp, the exception auto-transitions to RESOLVED_ACCEPTED with resolution_credit_minor = disputed_amount_minor and the invoice approved_amount_minor := rated_total_minor"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (activation of a contract carrying supersedes_contract_id == this contract)"
        actor: system
        preconditions: []
        side_effects: ["Triggers re-rate cascade described on the activating contract"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /fap/clients/{id}/run_daily_sweep when effective_to <= current logical date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: DISCARDED
        trigger: "POST /fap/rate-contracts/{id}/discard"
        actor: FapAdmin
        preconditions: []
        side_effects: []

  - entity: ShipmentRecord
    initial_state: REGISTERED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: REGISTERED
        to: INVOICED
        trigger: "system (an invoice referencing this shipment_id completes capture)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INVOICED
        to: CLOSED
        trigger: "system (referencing invoice reaches payment_status PAID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REGISTERED
        to: VOIDED
        trigger: "POST /fap/shipments/{id}/void"
        actor: AuditAnalyst
        preconditions:
          - "No non-VOIDED invoice references this shipment (ERR_INVALID_STATE)"
        side_effects: ["PRO number uniqueness scope releases this pro_number"]

  - entity: CarrierInvoice
    initial_state: "RECEIVED / UNPAID (parallel dimensions audit_status x payment_status)"
    terminal_states: ["VOIDED (audit)", "PAID | SHORT_PAID | WRITTEN_OFF (payment)"]
    transitions:
      - from: "audit:RECEIVED"
        to: "audit:CAPTURED"
        trigger: "POST /fap/invoices/{id}/capture"
        actor: AuditAnalyst
        preconditions:
          - "ClientAccount.status == ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "duplicate_detection runs; duplicate_flag set to NONE or FUZZY"
          - "If shipment_id set: ShipmentRecord REGISTERED -> INVOICED"
      - from: "audit:CAPTURED"
        to: "audit:RATED"
        trigger: "POST /fap/invoices/{id}/rate"
        actor: AuditAnalyst
        preconditions:
          - "An ACTIVE or SUPERSEDED contract of the carrier covers the as-of date (else transition to audit:EXCEPTION with NO_CONTRACT exception instead)"
        side_effects:
          - "line_rating computes per-line rated_amount_minor; invoice rated_total_minor, variance_minor, variance_pct_bp; rated_contract_id set"
      - from: "audit:CAPTURED"
        to: "audit:EXCEPTION"
        trigger: "POST /fap/invoices/{id}/rate (no covering contract)"
        actor: system
        preconditions: []
        side_effects: ["AuditException created with code NO_CONTRACT, disputed_amount_minor = billed_total_minor, routed_queue AUDIT_TEAM"]
      - from: "audit:RATED"
        to: "audit:CLEARED"
        trigger: "POST /fap/invoices/{id}/finalize_audit"
        actor: AuditAnalyst
        preconditions:
          - "exception_routing passes: no fuzzy duplicate, all accessorial lines valid, |variance_minor| <= audit_tolerance_minor AND variance_pct_bp <= audit_tolerance_pct_bp, OR a RESOLVED_ACCEPTED/RESOLVED_CONCEDED exception already fixes approved_amount_minor"
        side_effects:
          - "approved_amount_minor := billed_total_minor - max(variance_minor, 0) when no resolution exists; else the resolution-pinned amount"
          - "home_total_minor computed via fx_conversion (invoice_date variant, per-line rounding then summed)"
          - "due_date := invoice_date + carrier.payment_terms_days"
      - from: "audit:RATED"
        to: "audit:EXCEPTION"
        trigger: "POST /fap/invoices/{id}/finalize_audit (routing fails)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditException created; code per precedence DUPLICATE_FUZZY > INVALID_ACCESSORIAL > RATE_MISMATCH; disputed_amount_minor = max(variance_minor, 0) for RATE_MISMATCH/INVALID_ACCESSORIAL, billed_total_minor for DUPLICATE_FUZZY"
      - from: "audit:EXCEPTION"
        to: "audit:RATED"
        trigger: "POST /fap/invoices/{id}/rerate"
        actor: AuditAnalyst
        preconditions:
          - "No AuditException on this invoice with status in {OPEN, CARRIER_NOTIFIED, CARRIER_RESPONDED, ESCALATED} (ERR_EXCEPTION_STILL_ACTIVE)"
        side_effects: ["line_rating re-runs; rated_total_minor/variance recomputed; rated_contract_id refreshed"]
      - from: "audit:RECEIVED"
        to: "audit:VOIDED"
        trigger: "POST /fap/invoices/{id}/void"
        actor: AuditAnalyst
        preconditions: []
        side_effects: ["invoice_number uniqueness scope releases this number"]
      - from: "audit:CAPTURED"
        to: "audit:VOIDED"
        trigger: "POST /fap/invoices/{id}/void"
        actor: AuditAnalyst
        preconditions: []
        side_effects: ["invoice_number uniqueness scope releases this number"]
      - from: "payment:UNPAID"
        to: "payment:SCHEDULED"
        trigger: "system (PaymentRun release covering this invoice)"
        actor: system
        preconditions: ["audit_status == CLEARED"]
        side_effects: ["scheduled_minor += item.scheduled_amount_minor"]
      - from: "payment:SCHEDULED"
        to: "payment:UNPAID"
        trigger: "system (PaymentRun unlock compensation deletes the covering item)"
        actor: system
        preconditions: []
        side_effects: ["scheduled_minor -= removed item.scheduled_amount_minor (returns to 0 when the only item is removed)"]
      - from: "payment:SCHEDULED"
        to: "payment:PAID"
        trigger: "system (PaymentRun settle; item.discount_minor == 0 so applied amount == scheduled amount)"
        actor: system
        preconditions: []
        side_effects:
          - "paid_minor += item.scheduled_amount_minor"
          - "If shipment_id set and shipment INVOICED: ShipmentRecord -> CLOSED"
      - from: "payment:SCHEDULED"
        to: "payment:SHORT_PAID"
        trigger: "system (PaymentRun settle; item.discount_minor > 0 so the retained discount leaves the invoice short-paid)"
        actor: system
        preconditions: []
        side_effects:
          - "paid_minor += (item.scheduled_amount_minor - item.discount_minor)"
          - "If shipment_id set and shipment INVOICED: ShipmentRecord -> CLOSED"
      - from: "payment:UNPAID"
        to: "payment:WRITTEN_OFF"
        trigger: "POST /fap/invoices/{id}/write_off"
        actor: FinanceController
        preconditions:
          - "audit_status == CLEARED (ERR_INVOICE_NOT_PAYABLE)"
        side_effects: ["approved_amount_minor excluded from outstanding_liability_minor"]

  - entity: AuditException
    initial_state: OPEN
    terminal_states: [RESOLVED_ACCEPTED, RESOLVED_CONCEDED, EXPIRED]
    transitions:
      - from: OPEN
        to: CARRIER_NOTIFIED
        trigger: "POST /fap/exceptions/{id}/notify_carrier"
        actor: AuditAnalyst
        preconditions:
          - "current logical date <= opened_date + client.dispute_window_days (ERR_DISPUTE_WINDOW_EXPIRED)"
        side_effects: []
      - from: CARRIER_NOTIFIED
        to: CARRIER_RESPONDED
        trigger: "POST /fap/exceptions/{id}/carrier_respond"
        actor: CarrierRep
        preconditions:
          - "Acting carrier (X-User-ID) == invoice.carrier_id (ERR_FORBIDDEN_FOR_ROLE)"
          - "current logical date <= opened_date + client.dispute_window_days (ERR_DISPUTE_WINDOW_EXPIRED)"
        side_effects: []
      - from: CARRIER_RESPONDED
        to: CARRIER_NOTIFIED
        trigger: "POST /fap/exceptions/{id}/counter"
        actor: AuditAnalyst
        preconditions:
          - "round_count < 3 (ERR_NEGOTIATION_ROUND_LIMIT)"
        side_effects: ["round_count += 1"]
      - from: CARRIER_RESPONDED
        to: RESOLVED_ACCEPTED
        trigger: "POST /fap/exceptions/{id}/resolve with outcome=ACCEPT"
        actor: AuditAnalyst
        preconditions: []
        side_effects:
          - "resolution_credit_minor := disputed_amount_minor (carrier concedes full dispute)"
          - "invoice.approved_amount_minor := rated_total_minor; home_total_minor recomputed"
      - from: CARRIER_RESPONDED
        to: RESOLVED_CONCEDED
        trigger: "POST /fap/exceptions/{id}/resolve with outcome=CONCEDE"
        actor: AuditAnalyst
        preconditions:
          - "credit_minor <= disputed_amount_minor (ERR_CREDIT_EXCEEDS_DISPUTED)"
        side_effects:
          - "resolution_credit_minor := credit_minor"
          - "invoice.approved_amount_minor := billed_total_minor - credit_minor; home_total_minor recomputed"
      - from: ESCALATED
        to: RESOLVED_CONCEDED
        trigger: "POST /fap/exceptions/{id}/resolve with outcome=CONCEDE (admin force)"
        actor: FapAdmin
        preconditions:
          - "credit_minor <= disputed_amount_minor (ERR_CREDIT_EXCEEDS_DISPUTED)"
        side_effects:
          - "resolution_credit_minor := credit_minor"
          - "invoice.approved_amount_minor := billed_total_minor - credit_minor; home_total_minor recomputed"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /fap/exceptions/{id}/escalate"
        actor: AuditAnalyst
        preconditions: []
        side_effects: []
      - from: CARRIER_NOTIFIED
        to: ESCALATED
        trigger: "POST /fap/exceptions/{id}/escalate"
        actor: AuditAnalyst
        preconditions: []
        side_effects: []
      - from: CARRIER_RESPONDED
        to: ESCALATED
        trigger: "POST /fap/exceptions/{id}/escalate"
        actor: AuditAnalyst
        preconditions: []
        side_effects: []
      - from: OPEN
        to: EXPIRED
        trigger: "system (run_daily_sweep when current logical date > opened_date + client.dispute_window_days)"
        actor: system
        preconditions: []
        side_effects: ["Disputed hold released; invoice remains audit:EXCEPTION until rerate"]
      - from: CARRIER_NOTIFIED
        to: EXPIRED
        trigger: "system (run_daily_sweep when current logical date > opened_date + client.dispute_window_days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CARRIER_RESPONDED
        to: EXPIRED
        trigger: "system (run_daily_sweep when current logical date > opened_date + client.dispute_window_days)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PaymentRun
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /fap/payment-runs/{id}/lock"
        actor: FinanceController
        preconditions:
          - "At least one PaymentRunItem exists (ERR_EMPTY_PAYMENT_RUN)"
        side_effects:
          - "run_discount_tier computes per-item discount_minor; gross_total_minor, discount_total_minor, total_minor set"
          - "locked_by_user_id := acting X-User-ID"
      - from: LOCKED
        to: DRAFT
        trigger: "POST /fap/payment-runs/{id}/unlock"
        actor: FinanceController
        preconditions: []
        side_effects:
          - "All items deleted (compensation); any invoice scheduled_minor effects reversed (none outstanding: items only affect invoices at release)"
          - "gross_total_minor, discount_total_minor, total_minor reset to 0"
      - from: LOCKED
        to: RELEASED
        trigger: "POST /fap/payment-runs/{id}/release"
        actor: TreasuryApprover
        preconditions:
          - "Acting X-User-ID != created_by_user_id AND != locked_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Cascade hop 1: every item SCHEDULED -> RELEASED"
          - "Cascade hop 2 (per item): invoice payment_status UNPAID -> SCHEDULED and invoice.scheduled_minor += item.scheduled_amount_minor"
          - "Cascade hop 3: one RemittanceAdvice per distinct carrier among items is created with status GENERATED, total_minor and item_count computed"
      - from: RELEASED
        to: SETTLED
        trigger: "POST /fap/payment-runs/{id}/settle"
        actor: TreasuryApprover
        preconditions: []
        side_effects:
          - "Every item RELEASED -> PAID"
          - "Per item: invoice.paid_minor += (item.scheduled_amount_minor - item.discount_minor); invoice payment_status -> PAID when item.discount_minor == 0 else SHORT_PAID"
          - "Every RemittanceAdvice GENERATED -> SENT"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fap/payment-runs/{id}/cancel"
        actor: FinanceController
        preconditions: []
        side_effects: ["Items (if any) deleted"]

  - entity: PaymentRunItem
    initial_state: SCHEDULED
    terminal_states: [PAID]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "system (PaymentRun release)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: PAID
        trigger: "system (PaymentRun settle)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RemittanceAdvice
    initial_state: GENERATED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: GENERATED
        to: SENT
        trigger: "system (PaymentRun settle)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /fap/remittance-advices/{id}/acknowledge"
        actor: CarrierRep
        preconditions:
          - "Acting carrier (X-User-ID) == advice.carrier_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []

  - entity: RecoveryClaim
    initial_state: DRAFTED
    terminal_states: [COLLECTED, ABANDONED]
    transitions:
      - from: DRAFTED
        to: FILED
        trigger: "POST /fap/recovery-claims/{id}/file"
        actor: AuditAnalyst
        preconditions: []
        side_effects: []
      - from: REBUTTED
        to: FILED
        trigger: "POST /fap/recovery-claims/{id}/file (re-file after rebuttal)"
        actor: AuditAnalyst
        preconditions: []
        side_effects: []
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "POST /fap/recovery-claims/{id}/carrier_respond with outcome=ACKNOWLEDGE"
        actor: CarrierRep
        preconditions:
          - "Acting carrier (X-User-ID) == invoice.carrier_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: FILED
        to: REBUTTED
        trigger: "POST /fap/recovery-claims/{id}/carrier_respond with outcome=REBUT"
        actor: CarrierRep
        preconditions:
          - "Acting carrier (X-User-ID) == invoice.carrier_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: COLLECTED
        trigger: "POST /fap/recovery-claims/{id}/collect"
        actor: FinanceController
        preconditions:
          - "recovered_minor <= claimed_amount_minor (ERR_RECOVERY_EXCEEDS_CLAIMED)"
        side_effects:
          - "recovered_minor set"
          - "client.savings_realized_minor reflects recovered amount (savings_rollup)"
      - from: DRAFTED
        to: ABANDONED
        trigger: "POST /fap/recovery-claims/{id}/abandon"
        actor: AuditAnalyst
        preconditions: []
        side_effects: []
      - from: FILED
        to: ABANDONED
        trigger: "POST /fap/recovery-claims/{id}/abandon"
        actor: AuditAnalyst
        preconditions: []
        side_effects: []
      - from: REBUTTED
        to: ABANDONED
        trigger: "POST /fap/recovery-claims/{id}/abandon"
        actor: AuditAnalyst
        preconditions: []
        side_effects: []

  - entity: AnalyticsExport
    initial_state: REQUESTED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "system (synchronous at creation: rows materialized and checksum computed)"
        actor: system
        preconditions: []
        side_effects: ["row_count and checksum computed over invoices with invoice_date in [date_from, date_to] inclusive, filtered by include_statuses when provided"]

# =============================================================================
# Table 2.1: Concurrency Rules (true races, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: contract-activate-stale-version
    parent_entity: RateContract
    write_endpoint: "POST /fap/rate-contracts/{id}/activate"
    occ_field: "expected_rate_contract_version"
    description: |
      Activating a RateContract with an expected_rate_contract_version that no
      longer matches the contract's current version is rejected. Activation
      bumps version and may trigger the supersede/re-rate cascade, so a writer
      holding an older observed version is acting on stale state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: run-add-item-stale-version
    parent_entity: PaymentRun
    write_endpoint: "POST /fap/payment-runs/{id}/items"
    occ_field: "expected_payment_run_version"
    description: |
      Adding an item to a PaymentRun with an expected_payment_run_version that
      no longer matches the run's current version is rejected. Each successful
      add bumps the run version, so a writer composing a batch from an older
      observed version is acting on stale state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: line_rating
    trigger: "POST /fap/invoices/{id}/rate, POST /fap/invoices/{id}/rerate, and the contract-supersede cascade"
    algorithm: tiered_pricing
    formula: |
      Selector (which contract): among the carrier's RateContracts with status IN {ACTIVE, SUPERSEDED}
      whose half-open window [effective_from, effective_to) contains as_of_date, pick the one with the
      latest activated_at; tie-break: latest created_at. If none: NO_CONTRACT routing (no rating).
      Lane match: lane with origin_country == shipment.origin_country AND dest_country == shipment.dest_country
      AND mode == shipment.mode (shipment required for BASE_FREIGHT lines; invoice without shipment_id rates
      only FUEL_SURCHARGE/accessorial lines as billed==rated 0-variance is NOT assumed — treat missing lane
      as NO_CONTRACT).
      Per line, in invoice currency, round_half_up to whole minor units at each step:
        BASE_FREIGHT: tier = last weight_break with min_kg <= shipment.actual_weight_kg;
          base = tier.rate_per_kg_minor * actual_weight_kg;
          rated = max(base, lane.minimum_charge_minor).
        FUEL_SURCHARGE: rated = round_half_up(BASE_FREIGHT_rated * lane.fuel_surcharge_pct_bp / 10000).
        Accessorial code A (LIFTGATE|RESIDENTIAL|INSIDE_DELIVERY|DETENTION|STORAGE):
          if A not in lane.accessorials OR A not in shipment.accessorials_rendered: rated = 0 and line
            flagged invalid-accessorial; else rated = min(flat_minor, round_half_up(BASE_FREIGHT_rated * cap_pct_bp / 10000)).
        OTHER: rated = billed_amount_minor (uncontested).
      rated_total_minor = sum of line rated_amount_minor.
    input_set: "Invoice lines of the target invoice; carrier contracts status IN {ACTIVE, SUPERSEDED}"
    constants:
      PPM_DENOMINATOR: 10000
    precision: "0 decimal places (whole minor units), round_half_up per line step"
    variants:
      - name: as_of_ship_date
        when: "policy == SHIP_DATE (default when rate/rerate omit policy)"
        difference: "as_of_date := shipment.ship_date; historical contract terms apply"
      - name: as_of_invoice_date
        when: "policy == INVOICE_DATE"
        difference: "as_of_date := invoice.invoice_date; a later-superseding contract with lower rates yields a different rated_total_minor for identical lines"

  - name: exception_routing
    trigger: "POST /fap/invoices/{id}/finalize_audit"
    algorithm: threshold
    formula: |
      If any AuditException on this invoice has status IN {RESOLVED_ACCEPTED, RESOLVED_CONCEDED}:
        CLEARED; approved_amount_minor already pinned by the resolution.
      Else evaluate in precedence order (first match wins):
        1. duplicate_flag == FUZZY -> code DUPLICATE_FUZZY, disputed = billed_total_minor, queue AUDIT_TEAM
        2. any line flagged invalid-accessorial -> code INVALID_ACCESSORIAL,
           disputed = sum(billed of invalid lines), queue CARRIER
        3. |variance_minor| > client.audit_tolerance_minor OR variance_pct_bp > client.audit_tolerance_pct_bp
           -> code RATE_MISMATCH, disputed = max(variance_minor, 0), queue CARRIER
      No match -> CLEARED, approved_amount_minor = billed_total_minor - max(variance_minor, 0).
      Boundary: equality at the tolerance passes (<= clears, > routes).
    input_set: "The invoice being finalized and its lines"
    constants: {}
    precision: "integer minor units and basis points"

  - name: duplicate_detection
    trigger: "POST /fap/invoices/{id}/capture"
    algorithm: chronological
    formula: |
      Exact: another non-VOIDED invoice of same (client_id, carrier_id, invoice_number) -> creation-time
      rejection ERR_DUPLICATE_INVOICE_NUMBER (never reaches capture).
      Fuzzy at capture: any other non-VOIDED invoice of same (client_id, carrier_id) with
      abs(billed_total_minor - other.billed_total_minor) * 10000 <= 50 * max(billed_total_minor, 1)
      AND abs(invoice_date - other.invoice_date) <= 7 days (closed window, both ends inclusive)
      -> duplicate_flag := FUZZY; else NONE.
    input_set: "Non-VOIDED invoices of the same (client, carrier)"
    constants:
      FUZZY_AMOUNT_TOLERANCE_BP: 50
      FUZZY_DATE_WINDOW_DAYS: 7
    precision: "integer comparisons; boundary inclusive on both rules"

  - name: fx_conversion
    trigger: "home_total_minor at finalize_audit (invoice_date variant); PaymentRunItem.scheduled_amount_minor at item add (payment_date variant)"
    algorithm: aggregation
    formula: |
      rate(as_of_date): FxRate of the client with from_currency == source, to_currency == target and
      effective_date <= as_of_date, pick latest effective_date; tie-break latest created_at.
      Missing rate -> ERR_FX_RATE_MISSING at the calling endpoint.
      converted = round_half_up(amount_minor * rate_ppm / 1000000).
      PINNED ORDER for invoice-level home totals: convert each line's approved share first
      (per-line rounding), THEN sum. Sum-then-round is the forbidden alternative.
      Invoice home_total_minor = sum over lines of round_half_up(line_share * rate_ppm / 1000000)
      where line_share = line's share of approved_amount_minor proportional to its rated_amount_minor
      (when rated_total_minor == 0, share = billed line amount).
    input_set: "FxRate rows of the client; the invoice's lines or the scheduled invoice"
    constants:
      PPM: 1000000
    precision: "0 decimal places, round_half_up, per-line then sum"
    variants:
      - name: invoice_date_fx
        when: "Computing home_total_minor and GL reporting amounts"
        difference: "as_of_date := invoice.invoice_date"
      - name: payment_date_fx
        when: "Computing PaymentRunItem.scheduled_amount_minor into run currency"
        difference: "as_of_date := payment_run.run_date; a rate change between invoice_date and run_date yields a different amount for the same invoice"

  - name: run_discount_tier
    trigger: "POST /fap/payment-runs/{id}/lock"
    algorithm: threshold
    formula: |
      PINNED EVALUATION ORDER (breaks the gross<->discount circularity):
        (1) gross_total_minor = sum(item.scheduled_amount_minor)
        (2) tier keyed on GROSS (pre-discount): gross >= 5000000 -> 250 bp; gross >= 1000000 -> 150 bp; else 0 bp
        (3) per item: discount_minor = round_half_up(item.scheduled_amount_minor * tier_bp / 10000)
        (4) discount_total_minor = sum(discount_minor); total_minor = gross_total_minor - discount_total_minor
      The tier MUST be read off the pre-discount gross; keying on net would be a different, wrong result.
    input_set: "Items of the run at lock time"
    constants:
      TIER1_THRESHOLD_MINOR: 1000000
      TIER1_BP: 150
      TIER2_THRESHOLD_MINOR: 5000000
      TIER2_BP: 250
    precision: "0 decimal places, round_half_up per item"

  - name: cost_allocation_split
    trigger: "POST /fap/invoice-lines/{id}/allocations (replace-set semantics)"
    algorithm: waterfall_allocation
    formula: |
      line_amount = invoice line's rated_amount_minor when invoice rated_total_minor > 0 else billed_amount_minor.
      Validation: sum(percentage_bp) must equal exactly 10000 (ERR_ALLOCATION_SUM_INVALID).
      Each row: allocated_minor = round_half_up(line_amount * percentage_bp / 10000).
      Remainder delta = line_amount - sum(allocated_minor); apply delta (positive or negative) to the row
      with the largest percentage_bp; tie-break: gl_account.code ASC, then CostAllocation.created_at ASC.
      Replacing the allocation set deletes prior rows and recomputes from scratch (no drift).
    input_set: "The request's allocations array; the invoice line"
    constants:
      REQUIRED_SUM_BP: 10000
    precision: "0 decimal places, round_half_up per row, remainder to largest share"

  - name: run_item_selection
    trigger: "POST /fap/payment-runs/{id}/items with auto_fill: true"
    algorithm: aggregation
    formula: |
      Eligibility filter (all must hold):
        invoice.client_id == run.client_id; audit_status == CLEARED; payment_status == UNPAID;
        carrier.status == ACTIVE; (run.country_scope null OR carrier.country == country_scope);
        invoice.due_date <= run.run_date + 7 days (inclusive);
        invoice.currency == run.currency OR an FxRate path invoice.currency -> run.currency exists;
        invoice not already an item of any run with status IN {DRAFT, LOCKED, RELEASED}.
      Ranking: due_date ASC; tie-break: CarrierInvoice.created_at ASC.
      Adds one item per eligible invoice in ranking order. Empty eligible set adds zero items
      (lock then fails with ERR_EMPTY_PAYMENT_RUN).
    input_set: "Client's invoices and their carriers"
    constants:
      DUE_WINDOW_DAYS: 7
    precision: "date arithmetic, inclusive boundary"

  - name: savings_rollup
    trigger: "GET /fap/clients/{id}/savings"
    algorithm: aggregation
    formula: |
      avoided_overcharge_minor = sum over invoices with payment_status IN {PAID, SHORT_PAID} of
        max(billed_total_minor - approved_amount_minor, 0) converted to home currency at invoice-date FX
        (identity when invoice.currency == home).
      recovered_minor = sum over RecoveryClaims with status == COLLECTED of recovered_minor
        (claims are denominated in invoice currency; convert at invoice-date FX when different).
      savings_realized_minor = avoided_overcharge_minor + recovered_minor.
      outstanding_liability_minor = sum over invoices with audit_status == CLEARED and payment_status
        IN {UNPAID, SCHEDULED} of (approved_amount_minor - paid-equivalent) in home currency.
    input_set: "Client's invoices in payment_status {PAID, SHORT_PAID}; client's COLLECTED claims"
    constants: {}
    precision: "integer minor units, home currency"

  - name: exception_round_policy
    trigger: "POST /fap/exceptions/{id}/counter"
    algorithm: threshold
    formula: |
      counter succeeds iff round_count < 3; on success round_count += 1.
      Attempting a counter when round_count == 3 fails with ERR_NEGOTIATION_ROUND_LIMIT.
      Boundary: the third counter (round_count 2 -> 3) succeeds; the fourth fails.
    input_set: "The target exception"
    constants:
      MAX_ROUNDS: 3
    precision: "integer counter"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for endpoint; entity_backed roles act only on own scope (CarrierRep: resource's carrier == X-User-ID; ClientViewer: resource's client == X-User-ID; cross-scope reads return ERR_NOT_FOUND)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right; request-body FK references exist and belong to the same client"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: state
    check: "OCC: expected_*_version equals the parent entity's current version (on OCC-guarded writes)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fap/rate-contracts/{id}/activate, POST /fap/payment-runs/{id}/items"
  - priority: 5
    category: state
    check: "ClientAccount.status == ACTIVE for business mutations on its resources"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "all POST mutation endpoints under a client scope (except client lifecycle and clock)"
  - priority: 6
    category: state
    check: "Target resource in a state allowing the transition; unknown body fields rejected as ERR_INVALID_REQUEST before state evaluation is reported"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: payment run release denied when acting X-User-ID equals created_by_user_id or locked_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fap/payment-runs/{id}/release"
  - priority: 8
    category: business_temporal
    check: "Contract window sanity and overlap; exception dispute window; run date not in the past"
    error_id: "ERR_CONTRACT_WINDOW_INVALID | ERR_CONTRACT_WINDOW_OVERLAP | ERR_DISPUTE_WINDOW_EXPIRED | ERR_RUN_DATE_PAST"
    http_status: "409 | 422"
    applies_to: "contract create/activate, exception notify/carrier_respond, payment run create"
  - priority: 9
    category: business_constraint
    check: "Uniqueness (PRO number, invoice number, FX rate per date, GL code), weight-break ordering, allocation sum == 10000bp, billed_total == sum(lines)"
    error_id: "ERR_DUPLICATE_PRO_NUMBER | ERR_DUPLICATE_INVOICE_NUMBER | ERR_DUPLICATE_FX_RATE | ERR_WEIGHT_BREAK_INVALID | ERR_ALLOCATION_SUM_INVALID | ERR_AMOUNT_MISMATCH"
    http_status: "409 | 422"
    applies_to: "shipment create, invoice create, fx-rate create, gl-account create, contract activate, allocations set"
  - priority: 10
    category: business_referential
    check: "Referenced carrier ACTIVE for payment scheduling; GL account active for coding; shipment not VOIDED for invoice linkage; no open exceptions for rerate"
    error_id: "ERR_CARRIER_NOT_ACTIVE | ERR_GL_ACCOUNT_INACTIVE | ERR_EXCEPTION_STILL_ACTIVE | ERR_INVOICE_NOT_PAYABLE"
    http_status: 409
    applies_to: "payment run items, gl-code, allocations, invoice create, rerate, write_off"
  - priority: 11
    category: business_fiscal
    check: "Amounts positive; credit <= disputed; claim <= paid; recovered <= claimed; FX path exists for cross-currency scheduling"
    error_id: "ERR_AMOUNT_INVALID | ERR_CREDIT_EXCEEDS_DISPUTED | ERR_CLAIM_EXCEEDS_PAID | ERR_RECOVERY_EXCEEDS_CLAIMED | ERR_FX_RATE_MISSING"
    http_status: 409
    applies_to: "invoice create, exception resolve, recovery claim create/collect, payment run items"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/fap/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (startup default; never falls back to wall-clock)."
    roles: [FapAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced"]

  # --- ClientAccount ---
  - method: POST
    path: "/fap/clients"
    description: "Create a client account (status ONBOARDING)"
    roles: [FapAdmin]
    code: 201
    input: [name, home_country, home_currency, "audit_tolerance_minor?", "audit_tolerance_pct_bp?", "dispute_window_days?"]
    output: ClientAccount
    side_effects: []
  - method: GET
    path: "/fap/clients/{id}"
    description: "Get a client account"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []
  - method: GET
    path: "/fap/clients"
    description: "List client accounts (paginated)"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClientAccount[]"
    side_effects: []
  - method: POST
    path: "/fap/clients/{id}/activate"
    description: "Activate client (ONBOARDING or SUSPENDED -> ACTIVE)"
    roles: [FapAdmin]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []
  - method: POST
    path: "/fap/clients/{id}/suspend"
    description: "Suspend client (ACTIVE -> SUSPENDED)"
    roles: [FapAdmin]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []
  - method: POST
    path: "/fap/clients/{id}/terminate"
    description: "Terminate client (ACTIVE -> TERMINATED); requires settled ledger"
    roles: [FapAdmin]
    code: 200
    input: []
    output: ClientAccount
    side_effects: ["ERR_CLIENT_NOT_SETTLED when liability or unpaid invoices exist"]
  - method: GET
    path: "/fap/clients/{id}/savings"
    description: "Computed savings rollup read"
    roles: [FapAdmin, AuditAnalyst, FinanceController, TreasuryApprover, CarrierRep, ClientViewer]
    code: 200
    input: []
    output: "{ savings_realized_minor: integer, avoided_overcharge_minor: integer, recovered_minor: integer, outstanding_liability_minor: integer, currency: string }"
    side_effects: ["savings_rollup"]
  - method: POST
    path: "/fap/clients/{id}/run_daily_sweep"
    description: "Ops sweep: expire ACTIVE contracts whose effective_to <= current logical date; expire open exceptions past the dispute window"
    roles: [FapAdmin, System]
    code: 200
    input: []
    output: "{ expired_contract_ids: string[], expired_exception_ids: string[] }"
    side_effects: ["RateContract ACTIVE -> EXPIRED", "AuditException -> EXPIRED"]

  # --- Carrier ---
  - method: POST
    path: "/fap/clients/{id}/carriers"
    description: "Create carrier (PENDING_ONBOARD)"
