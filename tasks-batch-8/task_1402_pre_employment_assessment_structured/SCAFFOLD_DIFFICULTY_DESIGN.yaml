            - { call: "POST /talent/cycles/${cy_raw}/invitations", payload: { candidate_id: "${cr1}" }, as: HiringManager, as_user_id: hm-1, captures: { ar1: $.data.id } }
            - { call: "POST /talent/cycles/${cy_raw}/invitations", payload: { candidate_id: "${cr2}" }, as: HiringManager, as_user_id: hm-1, captures: { ar2: $.data.id } }
            - { call: "POST /talent/cycles/${cy_adj}/invitations", payload: { candidate_id: "${cd1}" }, as: HiringManager, as_user_id: hm-1, captures: { ad1: $.data.id } }
            - { call: "POST /talent/cycles/${cy_adj}/invitations", payload: { candidate_id: "${cd2}" }, as: HiringManager, as_user_id: hm-1, captures: { ad2: $.data.id } }
            - { call: "POST /talent/assessments/${ar1}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${ar2}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${ad1}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${ad2}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/assessments/${ar1}/start", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${ar1}/complete", payload: { raw_score: 50 }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${ar2}/start", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${ar2}/complete", payload: { raw_score: 50 }, as: HiringManager, as_user_id: hm-1 }
