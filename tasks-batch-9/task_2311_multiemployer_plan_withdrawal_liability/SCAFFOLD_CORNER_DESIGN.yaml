      - name: determining_a_cba_partial_cessation_sets_the_type_the_fraction_and_the_employer_status
        claim_type: Action endpoint
        grounds:
          - "endpoints[POST /withdrawal-events/{withdrawal_event_id}/determine]"
          - "calculations.partial_withdrawal_fraction"
          - "entities.Employer.fields.obligation_end_year"
        distinguishing_aspect: |
          A partial withdrawal must leave the contribution obligation alive:
          obligation_end_year stays null and the employer status becomes PARTIAL_WITHDRAWN
          rather than COMPLETE_WITHDRAWN. The fraction is ceased agreements over total
          agreements at four decimals, so 1 of 3 is the repeating value 0.3333 that
          exposes truncation versus half-up rounding.
