  - rule_id: priority_pair_validation_conflict
    instances:
      - name: already_accepted_trip_review_returns_state_error_before_segregation_check
        conflicting_priorities: [17, 26]
        expected_error: ERR_INVALID_TRIP_STATE
        grounds:
          - validations.priority_17_entity_state_family
          - validations.priority_26_ERR_SEGREGATION_OF_DUTIES
          - state_machines.TripRecord.RECONSTRUCTED_to_ACCEPTED
        distinguishing_aspect: |
          State-versus-duty conflict on the trip review endpoint. The second review call violates
          two rules at once: the trip is already ACCEPTED (priority 17) and the caller's
          X-User-ID equals reconstructed_by_user_id, which the segregation rule at priority 26
          forbids. The lower priority number wins, so the response is ERR_INVALID_TRIP_STATE and
          not ERR_SEGREGATION_OF_DUTIES — an already-settled trip is rejected for being settled,
          regardless of who is asking.
        test_recipe:
          setup:
            - "Jurisdictions IL and KY declared; carrier c8 with one power unit."
            - "Trip W1 covers 500.0 mi with a 100.0 mi gap, is reconstructed by analyst-1 as IL 250.0 / KY 350.0, and is then ACCEPTED by officer-1, so reconstructed_by_user_id is still analyst-1."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "KY", name: "Kentucky", fuel_tax_rate_per_gallon: 0.2460, surcharge_rate_per_gallon: 0.0440, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Priority Pair Trucking LLC", usdot_number: "USDOT-2637080", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { c8_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c8_id}", unit_number: "U-801", vin: "1FUJA6CK21L600801", weight_group_code: "W80", factory_price_amount: 155000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { v8_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c8_id}", vehicle_id: "${v8_id}", trip_start_utc: "2026-06-05T06:00:00Z", trip_end_utc: "2026-06-05T16:00:00Z", start_odometer: 600100.0, end_odometer: 600600.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }, { jurisdiction_code: "KY", leg_miles: 200.0 }] }
              as: MileageAnalyst
              captures: { w1_id: $.data.id }
            - call: "POST /apportionment/trip-records/${w1_id}/reconstruct"
              payload: { reconstructed_legs: [{ jurisdiction_code: "IL", leg_miles: 250.0 }, { jurisdiction_code: "KY", leg_miles: 350.0 }], supporting_document_reference: "RECON-W1" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /apportionment/trip-records/${w1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /apportionment/trip-records/${w1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "analyst-1"
          assert:
            - "the response is 409 with error_id ERR_INVALID_TRIP_STATE (priority 17 wins over the priority 26 segregation violation)"
            - "the response body is the fixed error envelope with success false, data null and a non-null error.error_id"
            - "TripRecord.${w1_id}.trip_status is still ACCEPTED and its ACTIVE legs are still IL 250.0 and KY 350.0"
            - "Carrier.${c8_id}.version did not change, proving the rejected call had no side effect"
            - "control: repeating the same call with X-User-ID officer-1 still returns ERR_INVALID_TRIP_STATE, confirming the state rule alone is sufficient to reject"
            - "control: had the trip been left RECONSTRUCTED, the same call with X-User-ID analyst-1 would return ERR_SEGREGATION_OF_DUTIES (409), which is how the pair is proven to be ordered rather than one rule masking the other permanently"

      - name: segregation_of_duties_beats_bond_ceiling_on_return_filing
        conflicting_priorities: [26, 37]
        expected_error: ERR_SEGREGATION_OF_DUTIES
        grounds:
          - validations.priority_26_ERR_SEGREGATION_OF_DUTIES
          - validations.priority_37_ERR_BOND_CEILING_EXCEEDED
          - state_machines.FuelTaxReturn.PREPARED_to_FILED
          - entities.Carrier.fields.bond_ceiling_amount
        distinguishing_aspect: |
          A different pair on a different endpoint, and both members are business rules rather
          than a state guard: the filer's X-User-ID equals prepared_by_user_id (priority 26) and
          the return's total_amount_due 20.24 exceeds the carrier's bond_ceiling_amount 5.00
          (priority 37). Priority 26 is evaluated first, so the caller is told who may not file
          before being told how much is too much to file — the money check never runs.
        test_recipe:
          setup:
