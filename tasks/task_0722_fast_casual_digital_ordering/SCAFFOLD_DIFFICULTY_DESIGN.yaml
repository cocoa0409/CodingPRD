scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: points_earned_base_vs_subscription_boost
        grounds:
          - calculations.points_earned
          - state_machines.Order.READY_to_COMPLETED
          - entities.SubscriptionPlan.fields.points_multiplier_bps
        distinguishing_aspect: >-
          Same completed order (subtotal 2900, discount 0, eligible 2900 -> base 290 points) earns
          290 points with no active subscription but 435 points with an ACTIVE 1.5x plan — divergence
          lives on the LoyaltyAccount/points domain.
        test_recipe:
          setup:
            - "PlatformAdmin created store TX (no delivery surcharge) cap 10, a COUNTER slot active at default clock, a menu item base_price 1450 base_cal 600, no modifiers."
            - "Two customers each with own order of one COUNTER line qty 2 of that item (subtotal 2900); customer B has an ACTIVE 1.5x (15000 bps) subscription applied, customer A has none."
            - "Both orders placed (points_redeemed 0), advanced to READY."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "TX Store", state_code: "TX", throughput_capacity_per_slot: 10, locker_count: 0 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${store_id}", name: "Bowl", base_price_cents: 1450, base_calories: 600 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /subscription-plans"
              payload: { tier_name: "PERKS_15", monthly_fee_cents: 999, free_delivery: false, points_multiplier_bps: 15000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "A", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_a: $.data.id, la_a: $.data.loyalty_account_id }
            - call: "POST /customers"
              payload: { email: "b@x.com", full_name: "B", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_b: $.data.id, la_b: $.data.loyalty_account_id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_b}", plan_id: "${plan_id}" }
              as: Customer
              as_user_id: "${cust_b}"
              captures: { sub_b: $.data.id }
            - call: "POST /subscriptions/${sub_b}/pay"
              payload: { payment_outcome: "SUCCEEDED" }
              as: Customer
              as_user_id: "${cust_b}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_a}", store_id: "${store_id}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { ord_a: $.data.id }
            - call: "POST /orders/${ord_a}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_a}"
            - call: "POST /orders/${ord_a}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { slot_v2: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust_b}", store_id: "${store_id}", pickup_slot_id: "${slot_id}", subscription_id: "${sub_b}" }
              as: Customer
              as_user_id: "${cust_b}"
              captures: { ord_b: $.data.id }
            - call: "POST /orders/${ord_b}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_b}"
            - call: "POST /orders/${ord_b}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v2}" }
              as: Customer
              as_user_id: "${cust_b}"
            - call: "POST /orders/${ord_a}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_a}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_b}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_b}/advance"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${ord_a}/complete"
              payload: {}
              as: StoreManager
              captures: { earned_a: $.data.points_earned }
            - call: "POST /orders/${ord_b}/complete"
              payload: {}
              as: StoreManager
              captures: { earned_b: $.data.points_earned }
          assert:
            - "Order.${ord_a}.points_earned == 290"
            - "Order.${ord_b}.points_earned == 435"
            - "Order.${ord_a}.points_earned != Order.${ord_b}.points_earned"

      - name: refund_destination_wallet_vs_original
        grounds:
          - calculations.make_it_right_refund
          - state_machines.Order.CAPTURED_to_PARTIALLY_REFUNDED
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: >-
          Same 500-cent make-it-right refund yields wallet_credit_cents += 500 under WALLET but leaves
          wallet_credit_cents unchanged under ORIGINAL — divergence is on the Customer wallet domain, a
          different entity domain than points_earned's LoyaltyAccount.
        test_recipe:
          setup:
            - "Two completed COUNTER orders each total 1000 cents (subtotal 1000, no fee/discount/wallet) for two customers with wallet_credit_cents 0."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "TX2", state_code: "TX", throughput_capacity_per_slot: 10, locker_count: 0 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${store_id}", name: "Item1000", base_price_cents: 1000, base_calories: 100 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "w@x.com", full_name: "W", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_w: $.data.id }
            - call: "POST /customers"
              payload: { email: "o@x.com", full_name: "O", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_o: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_w}", store_id: "${store_id}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cust_w}"
              captures: { ord_w: $.data.id }
            - call: "POST /orders/${ord_w}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_w}"
            - call: "POST /orders/${ord_w}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_w}"
              captures: { slot_v2: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust_o}", store_id: "${store_id}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cust_o}"
              captures: { ord_o: $.data.id }
            - call: "POST /orders/${ord_o}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_o}"
            - call: "POST /orders/${ord_o}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v2}" }
              as: Customer
              as_user_id: "${cust_o}"
            - call: "POST /orders/${ord_w}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_w}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_w}/complete"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_o}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_o}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_o}/complete"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${ord_w}/make-it-right"
              payload: { refund_amount_cents: 500, refund_destination: "WALLET" }
              as: StoreManager
            - call: "POST /orders/${ord_o}/make-it-right"
              payload: { refund_amount_cents: 500, refund_destination: "ORIGINAL" }
              as: StoreManager
          assert:
            - "Customer.${cust_w}.wallet_credit_cents == 500"
            - "Customer.${cust_o}.wallet_credit_cents == 0"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_total_pinned_evaluation_order
        grounds:
          - calculations.order_total
          - calculations.delivery_fee
          - calculations.redemption_value
          - entities.Order.fields.total_cents
        distinguishing_aspect: >-
          Mode (c) circular-looking dependency: delivery_fee depends on subtotal, discount depends on
          subtotal, wallet depends on the post-discount-plus-fee residual; pinned order 1->6 yields
          total 2731 for DELIVERY CA subtotal 2900, redeem 350 (discount 300), wallet 500.
        test_recipe:
          setup:
            - "CA store cap 10; DELIVERY slot active; menu item base_price 1450; customer with wallet_credit 500 and points_balance 350 (seeded); order one DELIVERY line qty 2 -> subtotal 2900."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA", throughput_capacity_per_slot: 10, locker_count: 0 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${store_id}", name: "Bowl1450", base_price_cents: 1450, base_calories: 600 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "DELIVERY" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_c: $.data.id, la_c: $.data.loyalty_account_id }
            - call: "POST /customers/${cust_c}/wallet/adjustments"
              payload: { delta_cents: 500, reason: "SEED" }
              as: PlatformAdmin
            - call: "POST /points-ledger-entries"
              payload: { loyalty_account_id: "${la_c}", delta_points: 350, reason: "ADJUSTMENT" }
              as: PlatformAdmin
              captures: { seed_entry: $.data.loyalty_account_id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_c}", store_id: "${store_id}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cust_c}"
              captures: { ord_c: $.data.id }
            - call: "POST /orders/${ord_c}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_c}"
          trigger:
            - call: "POST /orders/${ord_c}/place"
              payload: { points_redeemed: 350, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_c}"
              captures: { total_c: $.data.total_cents }
          assert:
            - "Order.${ord_c}.subtotal_cents == 2900"
            - "Order.${ord_c}.delivery_fee_cents == 631"
            - "Order.${ord_c}.discount_cents == 300"
            - "Order.${ord_c}.wallet_applied_cents == 500"
            - "Order.${ord_c}.total_cents == 2731"

      - name: points_clawback_nested_rounding_then_sum
        grounds:
          - calculations.points_clawback
          - state_machines.Order.CAPTURED_to_PARTIALLY_REFUNDED
          - state_machines.Order.PARTIALLY_REFUNDED_to_REFUNDED
        distinguishing_aspect: >-
          Mode (b) rounding order: clawback rounds per make-it-right call (round_half_up each refund
          share) rather than over the summed refund; two 500-of-1000 refunds on points_earned 100 each
          round to 50, summing to exactly 100 with zero drift.
        test_recipe:
          setup:
            - "Completed COUNTER order total 1000 with points_earned 100 (subtotal 1000 -> eligible 1000 -> base 100, no subscription)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "TX3", state_code: "TX", throughput_capacity_per_slot: 10, locker_count: 0 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${store_id}", name: "Item1000", base_price_cents: 1000, base_calories: 100 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "cb@x.com", full_name: "CB", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_cb: $.data.id, la_cb: $.data.loyalty_account_id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_cb}", store_id: "${store_id}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cust_cb}"
              captures: { ord_cb: $.data.id }
            - call: "POST /orders/${ord_cb}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_cb}"
            - call: "POST /orders/${ord_cb}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_cb}"
            - call: "POST /orders/${ord_cb}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_cb}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_cb}/complete"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${ord_cb}/make-it-right"
              payload: { refund_amount_cents: 500, refund_destination: "ORIGINAL" }
              as: StoreManager
            - call: "POST /orders/${ord_cb}/make-it-right"
              payload: { refund_amount_cents: 500, refund_destination: "ORIGINAL" }
              as: StoreManager
          assert:
            - "LoyaltyAccount.${la_cb}.points_balance == 0"
            - "Order.${ord_cb}.settlement_status == REFUNDED"
            - "Order.${ord_cb}.refunded_cents == 1000"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_status_axes
        grounds:
          - state_machines.Order.READY_to_COMPLETED
          - state_machines.Order.CAPTURED_to_PARTIALLY_REFUNDED
          - entities.Order.fields.settlement_status
        distinguishing_aspect: >-
          Order carries two independent axes: order_status reaches COMPLETED while settlement_status
          moves CAPTURED -> PARTIALLY_REFUNDED on the same row, evolving independently.
        test_recipe:
          setup:
            - "Completed COUNTER order total 1000, points_earned 100; then a partial 400-cent make-it-right."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "TX4", state_code: "TX", throughput_capacity_per_slot: 10, locker_count: 0 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${store_id}", name: "Item1000", base_price_cents: 1000, base_calories: 100 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "px@x.com", full_name: "PX", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_p: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_p}", store_id: "${store_id}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cust_p}"
              captures: { ord_p: $.data.id }
            - call: "POST /orders/${ord_p}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_p}"
            - call: "POST /orders/${ord_p}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_p}"
            - call: "POST /orders/${ord_p}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_p}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_p}/complete"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${ord_p}/make-it-right"
              payload: { refund_amount_cents: 400, refund_destination: "ORIGINAL" }
              as: StoreManager
          assert:
            - "Order.${ord_p}.order_status == COMPLETED"
            - "Order.${ord_p}.settlement_status == PARTIALLY_REFUNDED"

      - name: subscription_past_due_recovery_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Subscription.PAST_DUE_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: >-
          Subscription cycles ACTIVE -> PAST_DUE -> ACTIVE (a revision loop on a different entity than
          Order), with current_period_end_utc re-extended on the recovery pay.
        test_recipe:
          setup:
            - "Customer with an ACTIVE subscription whose 30-day period has elapsed under the logical clock."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "TX5", state_code: "TX", throughput_capacity_per_slot: 10, locker_count: 0 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /subscription-plans"
              payload: { tier_name: "PLAN_A", monthly_fee_cents: 999 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "su@x.com", full_name: "SU", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_s: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_s}", plan_id: "${plan_id}" }
              as: Customer
              as_user_id: "${cust_s}"
              captures: { sub_s: $.data.id }
            - call: "POST /subscriptions/${sub_s}/pay"
              payload: { payment_outcome: "SUCCEEDED" }
              as: Customer
              as_user_id: "${cust_s}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_s}/lapse"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub_s}/pay"
              payload: { payment_outcome: "SUCCEEDED" }
              as: Customer
              as_user_id: "${cust_s}"
          assert:
            - "Subscription.${sub_s}.status == ACTIVE"
            - "Subscription.${sub_s}.current_period_end_utc == 2026-05-31T00:00:00Z"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_order_challenge_bonus_tier_depth3
        grounds:
          - state_machines.Order.READY_to_COMPLETED
          - state_machines.LoyaltyChallenge.IN_PROGRESS_to_ROUND_COMPLETE
          - calculations.tier_recompute
        distinguishing_aspect: >-
          Depth-3 cascade: completing the order (A) appends EARN and increments the challenge
          progress (B); reaching target flips challenge to ROUND_COMPLETE appending CHALLENGE_BONUS (C);
          that bonus recomputes LoyaltyAccount lifetime/tier (D). Each link caused by the prior.
        test_recipe:
          setup:
            - "Customer enrolled in a 1-order challenge with bonus 5000; one COUNTER order subtotal 2900 (base 290 points) at READY; before completion lifetime is 0."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "TX6", state_code: "TX", throughput_capacity_per_slot: 10, locker_count: 0 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${store_id}", name: "Bowl2900", base_price_cents: 1450, base_calories: 600 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "ch@x.com", full_name: "CH", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_ch: $.data.id, la_ch: $.data.loyalty_account_id }
            - call: "POST /loyalty-challenges"
              payload: { customer_id: "${cust_ch}", target_order_count: 1, bonus_points: 5000 }
              as: Customer
              as_user_id: "${cust_ch}"
              captures: { chal_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_ch}", store_id: "${store_id}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cust_ch}"
              captures: { ord_ch: $.data.id }
            - call: "POST /orders/${ord_ch}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_ch}"
            - call: "POST /orders/${ord_ch}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_ch}"
            - call: "POST /orders/${ord_ch}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${ord_ch}/advance"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${ord_ch}/complete"
              payload: {}
              as: StoreManager
          assert:
            - "LoyaltyChallenge.${chal_id}.status == ROUND_COMPLETE"
            - "LoyaltyChallenge.${chal_id}.rounds_completed == 1"
            - "LoyaltyAccount.${la_ch}.lifetime_points_earned == 5290"
            - "LoyaltyAccount.${la_ch}.tier == GOLD"

      - name: cancel_placed_order_release_slot_requeue_depth2
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - calculations.queue_status
          - entities.PickupSlot.fields.reserved_count
        distinguishing_aspect: >-
          Depth-2 cascade from a different trigger (cancel, not complete): cancelling a PLACED order (A)
          decrements PickupSlot.reserved_count (B), and that decrement recomputes Store.queue_status (C)
          from SURGE back to OPEN.
        test_recipe:
          setup:
