scenario: |
  1840. Casting Call & Talent Submission Management (casting director office):
  breakdown release & agent-only vs open call distribution, submission intake &
  self-tape collection, callback scheduling & session management,
  availability/conflict check & pin/avail holds, offer & deal memo negotiation,
  work permit & minor coordination, union eligibility & Taft-Hartley reporting,
  booking confirmation & cancellation

domain_name: casting-call-talent-submission
api_prefix: /casting

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, required: true, description: "Production title" }
      - { name: production_type, type: enum, source: input, required: true, description: "Format of production", constraints: "FILM | TV_SERIES | COMMERCIAL | THEATER | NEW_MEDIA" }
      - { name: union_signatory, type: boolean, source: input, required: true, description: "Whether production is signatory to the performers union (governs Taft-Hartley tracking)" }
      - { name: shoot_city, type: string, source: input, required: true, description: "Principal photography city (drives minor work-permit jurisdiction)" }
      - { name: shoot_state, type: string, source: input, required: true, description: "Two-letter state code governing minor labor rules" }
      - { name: start_date, type: datetime, source: input, required: true, description: "First day of principal photography (date at 00:00:00Z)" }
      - { name: wrap_date, type: datetime, source: input, required: true, description: "Last day of principal photography (date at 00:00:00Z); must be >= start_date" }
      - { name: casting_office_id, type: string, source: input, required: true, description: "Opaque identifier of the casting office running this production (not an entity)" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "SETUP | CASTING | LOCKED | COMPLETED", default: SETUP }
      - { name: active_breakdown_count, type: integer, source: computed, required: true, description: "Count of child Breakdowns with status IN {RELEASED_AGENT_ONLY, RELEASED_OPEN}; recomputed on every breakdown release/close/cancel", default: 0 }

  - name: Breakdown
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, required: true, description: "FK -> Production.id; owning production" }
      - { name: role_id, type: string, source: input, required: true, description: "FK -> Role.id; the role this breakdown casts" }
      - { name: distribution, type: enum, source: input, required: true, description: "Initial distribution channel", constraints: "AGENT_ONLY | OPEN_CALL" }
      - { name: submission_deadline, type: datetime, source: input, required: true, description: "Submissions close at this UTC instant; must be strictly after release time" }
      - { name: rate_weekly_cents, type: integer, source: input, required: true, description: "Posted weekly rate in cents; must be > 0" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "DRAFT | RELEASED_AGENT_ONLY | RELEASED_OPEN | CLOSED | CANCELLED", default: DRAFT }
      - { name: released_at, type: datetime, source: system, required: false, description: "Server-stamped UTC instant of first release (null until first release)" }
      - { name: submission_count, type: integer, source: computed, required: true, description: "Count of Submissions for this breakdown with status != WITHDRAWN", default: 0 }

  - name: Role
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, required: true, description: "FK -> Production.id; owning production" }
      - { name: character_name, type: string, source: input, required: true, description: "Character name" }
      - { name: is_minor_role, type: boolean, source: input, required: true, description: "True if the character is written as a minor (drives work-permit gating at booking)" }
      - { name: is_union_covered, type: boolean, source: input, required: true, description: "True if engagement under this role counts toward union eligibility (Taft-Hartley)" }
      - { name: engagement_start, type: datetime, source: input, required: true, description: "First engagement day (date at 00:00:00Z)" }
      - { name: engagement_end, type: datetime, source: input, required: true, description: "Last engagement day inclusive (date at 00:00:00Z); must be >= engagement_start and within Production.[start_date, wrap_date]" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "OPEN | CAST | CANCELLED", default: OPEN }

  - name: Talent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, required: true, description: "Talent legal name" }
      - { name: stage_name, type: string, source: input, required: false, description: "Professional name" }
      - { name: date_of_birth, type: datetime, source: input, required: true, description: "DOB at 00:00:00Z; used to derive is_minor against current clock" }
      - { name: is_minor, type: boolean, source: computed, required: true, description: "True when age at current logical clock < 18; recomputed on read and at booking" }
      - { name: union_status, type: enum, source: input, required: true, description: "Union affiliation", constraints: "UNION_MEMBER | NON_UNION | ELIGIBLE_PENDING", default: NON_UNION }
      - { name: agent_id, type: string, source: input, required: false, description: "FK -> AgentProfile.id; representing agent (null = unrepresented, open-call self-submission allowed)" }
      - { name: union_engagement_count_365d, type: integer, source: computed, required: true, description: "Count of CONFIRMED Bookings for this talent on Roles with is_union_covered=true whose engagement_start falls within the rolling 365-day window ending at the current logical clock; drives Taft-Hartley eligibility", default: 0 }

  - name: AgentProfile
    parent: null
    common_fields: true
    fields:
      - { name: agency_name, type: string, source: input, required: true, description: "Agency legal name" }
      - { name: contact_email, type: string, source: input, required: true, description: "Agency submission email" }
      - { name: franchise_status, type: enum, source: input, required: true, description: "Union-franchised agencies may submit to AGENT_ONLY breakdowns", constraints: "FRANCHISED | NON_FRANCHISED", default: NON_FRANCHISED }
      - { name: active, type: boolean, source: input, required: true, description: "Soft-deactivate flag; inactive agents may not submit", default: true }

  - name: Submission
    parent: Breakdown
    common_fields: true
    fields:
      - { name: breakdown_id, type: string, source: input, required: true, description: "FK -> Breakdown.id; breakdown submitted to" }
      - { name: talent_id, type: string, source: input, required: true, description: "FK -> Talent.id; submitting talent" }
      - { name: agent_id, type: string, source: input, required: false, description: "FK -> AgentProfile.id; null when talent self-submits on an OPEN_CALL breakdown" }
      - { name: submitted_via, type: enum, source: system, required: true, description: "Derived channel: AGENT if agent_id present else SELF", constraints: "AGENT | SELF" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "SUBMITTED | UNDER_REVIEW | SHORTLISTED | REJECTED | CALLBACK_INVITED | CALLBACK_COMPLETED | OFFER_PENDING | BOOKED | NOT_BOOKED | WITHDRAWN", default: SUBMITTED }
      - { name: duplicate_of_id, type: string, source: system, required: false, description: "FK -> Submission.id; set when this submission was auto-rejected as a duplicate of an earlier active submission for the same (breakdown_id, talent_id)" }
      - { name: reviewed_at, type: datetime, source: system, required: false, description: "Server-stamped when status first left SUBMITTED" }

  - name: SelfTape
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, required: true, description: "FK -> Submission.id; owning submission" }
      - { name: media_url, type: string, source: input, required: true, description: "URL of the uploaded tape asset" }
      - { name: duration_seconds, type: integer, source: input, required: true, description: "Tape length; must be > 0 and <= 600" }
      - { name: tape_index, type: integer, source: system, required: true, description: "1-based ordinal within the submission, assigned in upload order (earliest created_at first)" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "RECEIVED | ACCEPTED | REJECTED", default: RECEIVED }

  - name: AuditionSession
    parent: Breakdown
    common_fields: true
    fields:
      - { name: breakdown_id, type: string, source: input, required: true, description: "FK -> Breakdown.id; breakdown this session callbacks for" }
      - { name: session_start, type: datetime, source: input, required: true, description: "Session start UTC" }
      - { name: session_end, type: datetime, source: input, required: true, description: "Session end UTC; strictly after session_start; sessions are half-open [start, end)" }
      - { name: capacity, type: integer, source: input, required: true, description: "Max simultaneous callback appointments; must be >= 1" }
      - { name: location, type: string, source: input, required: true, description: "Studio / room" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", default: SCHEDULED }
      - { name: booked_count, type: integer, source: computed, required: true, description: "Count of child CallbackAppointments with status = CONFIRMED; recomputed on appointment confirm/cancel", default: 0 }

  - name: CallbackAppointment
    parent: AuditionSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, required: true, description: "FK -> AuditionSession.id; session booked into" }
      - { name: submission_id, type: string, source: input, required: true, description: "FK -> Submission.id; submission being called back" }
      - { name: slot_start, type: datetime, source: input, required: true, description: "Appointment start UTC; must be >= session.session_start" }
      - { name: slot_end, type: datetime, source: input, required: true, description: "Appointment end UTC; half-open [slot_start, slot_end); must be <= session.session_end and > slot_start" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "PROPOSED | CONFIRMED | DECLINED | CANCELLED | NO_SHOW", default: PROPOSED }
      - { name: buffer_minutes, type: integer, source: input, required: true, description: "Per-appointment turnaround buffer appended after slot_end when computing overlap against other appointments of the SAME talent; must be >= 0", default: 0 }

  - name: AvailabilityHold
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, required: true, description: "FK -> Submission.id; submission the hold pins" }
      - { name: talent_id, type: string, source: input, required: true, description: "FK -> Talent.id; denormalized for conflict scans; MUST equal Submission.talent_id" }
      - { name: hold_kind, type: enum, source: input, required: true, description: "PIN (soft) or AVAIL (hard) hold", constraints: "PIN | AVAIL" }
      - { name: window_start, type: datetime, source: input, required: true, description: "Hold window start UTC; half-open [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, required: true, description: "Hold window end UTC; strictly after window_start" }
      - { name: priority_rank, type: integer, source: input, required: true, description: "Lower integer = higher hold priority; ties break by earliest created_at", constraints: ">= 1" }
      - { name: expires_at, type: datetime, source: input, required: true, description: "Hold auto-expires when logical clock >= expires_at; must be > window_start" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "ACTIVE | CONFIRMED | RELEASED | EXPIRED | OUTBID", default: ACTIVE }

  - name: Offer
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, required: true, description: "FK -> Submission.id; submission receiving the offer" }
      - { name: weekly_rate_cents, type: integer, source: input, required: true, description: "Offered weekly rate; must be > 0" }
      - { name: guarantee_cents, type: integer, source: input, required: true, description: "Pay-or-play guarantee; must be >= 0 and <= 52 * weekly_rate_cents" }
      - { name: round_number, type: integer, source: system, required: true, description: "1-based negotiation round; increments on each counter-offer", default: 1 }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "EXTENDED | COUNTERED | ACCEPTED | DECLINED | WITHDRAWN | EXPIRED", default: EXTENDED }
      - { name: expires_at, type: datetime, source: input, required: true, description: "Offer lapses to EXPIRED when logical clock >= expires_at while status IN {EXTENDED, COUNTERED}" }
      - { name: parent_offer_id, type: string, source: system, required: false, description: "FK -> Offer.id; the offer this counter-offer supersedes (null on round 1)" }

  - name: DealMemo
    parent: Offer
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: input, required: true, description: "FK -> Offer.id; accepted offer this memo memorializes (1:1)" }
      - { name: engagement_start, type: datetime, source: input, required: true, description: "Engagement first day (date 00:00:00Z)" }
      - { name: engagement_end, type: datetime, source: input, required: true, description: "Engagement last day inclusive (date 00:00:00Z)" }
      - { name: proration_mode, type: enum, source: input, required: true, description: "Which proration variant this memo locks", constraints: "CALENDAR_SPAN | WORKDAY_SPAN" }
      - { name: computed_fee_cents, type: integer, source: computed, required: true, description: "Prorated engagement fee computed by engagement_fee_proration under proration_mode; frozen at memo creation" }
      - { name: cancellation_penalty_cents, type: integer, source: computed, required: true, description: "Penalty computed by cancellation_penalty_tier at booking cancellation; 0 until then", default: 0 }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "EXECUTED | VOIDED", default: EXECUTED }

  - name: MinorWorkPermit
    parent: Talent
    common_fields: true
    fields:
      - { name: talent_id, type: string, source: input, required: true, description: "FK -> Talent.id; minor talent" }
      - { name: production_id, type: string, source: input, required: true, description: "FK -> Production.id; production the permit covers" }
      - { name: permit_number, type: string, source: input, required: true, description: "State-issued permit number; unique per (talent_id, production_id)" }
      - { name: issued_at, type: datetime, source: input, required: true, description: "Issue date UTC" }
      - { name: valid_until, type: datetime, source: input, required: true, description: "Permit expiry UTC; must be > issued_at" }
      - { name: max_daily_hours_school_day, type: integer, source: input, required: true, description: "Cap on work hours for school days", constraints: ">= 1 and <= 8", default: 5 }
      - { name: max_daily_hours_non_school_day, type: integer, source: input, required: true, description: "Cap on work hours for non-school days", constraints: ">= 1 and <= 10", default: 8 }
      - { name: guardian_user_id, type: string, source: input, required: true, description: "FK -> Guardian.id; guardian who may approve minor logistics" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "PENDING_VERIFICATION | VERIFIED | EXPIRED | REVOKED", default: PENDING_VERIFICATION }

  - name: Guardian
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, required: true, description: "Guardian legal name" }
      - { name: contact_email, type: string, source: input, required: true, description: "Guardian contact email" }
      - { name: relationship, type: string, source: input, required: true, description: "Relationship to minor (parent / legal guardian)" }

  - name: Booking
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, required: true, description: "FK -> Submission.id; booked submission (1:1 while active)" }
      - { name: deal_memo_id, type: string, source: input, required: true, description: "FK -> DealMemo.id; executed deal memo backing this booking" }
      - { name: work_permit_id, type: string, source: input, required: false, description: "FK -> MinorWorkPermit.id; REQUIRED when the role is_minor_role and talent is_minor; must be VERIFIED and valid through engagement_end" }
      - { name: confirmed_at, type: datetime, source: system, required: false, description: "Server-stamped UTC instant booking reached CONFIRMED" }
      - { name: cancelled_at, type: datetime, source: system, required: false, description: "Server-stamped UTC instant of cancellation" }
      - { name: cancellation_reason, type: enum, source: input, required: false, description: "Required on cancel", constraints: "PRODUCTION_CANCELLED | TALENT_CANCELLED | FORCE_MAJEURE | PERMIT_REVOKED" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "PENDING | CONFIRMED | CANCELLED", default: PENDING }

  - name: TaftHartleyReport
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, required: true, description: "FK -> Production.id; production the report covers" }
      - { name: talent_id, type: string, source: input, required: true, description: "FK -> Talent.id; non-union talent hired on union-covered role" }
      - { name: booking_id, type: string, source: input, required: true, description: "FK -> Booking.id; the CONFIRMED booking that triggered the filing obligation" }
      - { name: reason_code, type: enum, source: input, required: true, description: "Statutory basis for hiring non-union talent", constraints: "SPECIAL_SKILL | FIRST_EMPLOYMENT | EXIGENCY", default: FIRST_EMPLOYMENT }
      - { name: filing_deadline, type: datetime, source: system, required: true, description: "booking.confirmed_at + 15 calendar days (Taft-Hartley filing window)" }
      - { name: filed_at, type: datetime, source: system, required: false, description: "Server-stamped when report is FILED" }
      - { name: status, type: enum, source: system, required: true, description: "Lifecycle", constraints: "PENDING | FILED | LATE | WAIVED", default: PENDING }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Production
    initial_state: SETUP
    terminal_states: [COMPLETED]
    transitions:
      - from: SETUP
        to: CASTING
        trigger: "POST /casting/productions/{id}/open-casting"
        actor: CastingDirector
        preconditions:
          - "production.status == SETUP"
          - "at least one child Breakdown with status != CANCELLED exists"
        side_effects:
          - "production.status := CASTING"
          - "increments Production.version by 1"
      - from: CASTING
        to: LOCKED
        trigger: "POST /casting/productions/{id}/lock"
        actor: CastingDirector
        preconditions:
          - "production.status == CASTING"
          - "every child Role with status == OPEN has at least one child Booking (via its breakdown submissions) with status == CONFIRMED"
        side_effects:
          - "production.status := LOCKED"
          - "increments Production.version by 1"
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /casting/productions/{id}/complete"
        actor: CastingDirector
        preconditions:
          - "production.status == LOCKED"
          - "logical clock > production.wrap_date"
        side_effects:
          - "production.status := COMPLETED"
          - "every TaftHartleyReport of this production with status == PENDING transitions to LATE"
          - "increments Production.version by 1"

  - entity: Breakdown
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RELEASED_AGENT_ONLY
        trigger: "POST /casting/breakdowns/{id}/release"
        actor: CastingDirector
        preconditions:
          - "breakdown.status == DRAFT"
          - "payload.distribution == AGENT_ONLY"
          - "parent Production.status IN {SETUP, CASTING}"
          - "child Role.status == OPEN"
        side_effects:
          - "breakdown.released_at := current logical clock"
          - "Production.active_breakdown_count recomputed (increments by 1)"
          - "increments Breakdown.version by 1 AND Production.version by 1"
      - from: DRAFT
        to: RELEASED_OPEN
        trigger: "POST /casting/breakdowns/{id}/release"
        actor: CastingDirector
        preconditions:
          - "breakdown.status == DRAFT"
          - "payload.distribution == OPEN_CALL"
          - "parent Production.status IN {SETUP, CASTING}"
          - "child Role.status == OPEN"
        side_effects:
          - "breakdown.released_at := current logical clock"
          - "Production.active_breakdown_count recomputed (increments by 1)"
          - "increments Breakdown.version by 1 AND Production.version by 1"
      - from: RELEASED_AGENT_ONLY
        to: RELEASED_OPEN
        trigger: "POST /casting/breakdowns/{id}/widen"
        actor: CastingDirector
        preconditions:
          - "breakdown.status == RELEASED_AGENT_ONLY"
          - "logical clock < breakdown.submission_deadline"
        side_effects:
          - "breakdown.distribution := OPEN_CALL"
          - "increments Breakdown.version by 1"
      - from: RELEASED_AGENT_ONLY
        to: CLOSED
        trigger: "POST /casting/breakdowns/{id}/close"
        actor: CastingDirector
        preconditions:
          - "breakdown.status IN {RELEASED_AGENT_ONLY, RELEASED_OPEN}"
        side_effects:
          - "every child Submission with status IN {SUBMITTED, UNDER_REVIEW} transitions to REJECTED (rejection cascade)"
          - "Production.active_breakdown_count recomputed (decrements by 1)"
          - "increments Breakdown.version by 1 AND Production.version by 1"
      - from: RELEASED_OPEN
        to: CLOSED
        trigger: "POST /casting/breakdowns/{id}/close"
        actor: CastingDirector
        preconditions:
          - "breakdown.status IN {RELEASED_AGENT_ONLY, RELEASED_OPEN}"
        side_effects:
          - "every child Submission with status IN {SUBMITTED, UNDER_REVIEW} transitions to REJECTED (rejection cascade)"
          - "Production.active_breakdown_count recomputed (decrements by 1)"
          - "increments Breakdown.version by 1 AND Production.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /casting/breakdowns/{id}/cancel"
        actor: CastingDirector
        preconditions:
          - "breakdown.status == DRAFT"
        side_effects:
          - "increments Breakdown.version by 1"
      - from: RELEASED_AGENT_ONLY
        to: CANCELLED
        trigger: "POST /casting/breakdowns/{id}/cancel"
        actor: CastingDirector
        preconditions:
          - "breakdown.status IN {RELEASED_AGENT_ONLY, RELEASED_OPEN}"
          - "no child Submission has status == BOOKED"
        side_effects:
          - "every child Submission with status NOT IN {WITHDRAWN, REJECTED, NOT_BOOKED} transitions to WITHDRAWN"
          - "every AvailabilityHold linked to those submissions with status == ACTIVE transitions to RELEASED"
          - "every AuditionSession of this breakdown with status == SCHEDULED transitions to CANCELLED; its PROPOSED/CONFIRMED appointments become CANCELLED"
          - "Production.active_breakdown_count recomputed (decrements by 1)"
          - "increments Breakdown.version by 1 AND Production.version by 1"
      - from: RELEASED_OPEN
        to: CANCELLED
        trigger: "POST /casting/breakdowns/{id}/cancel"
        actor: CastingDirector
        preconditions:
          - "breakdown.status IN {RELEASED_AGENT_ONLY, RELEASED_OPEN}"
          - "no child Submission has status == BOOKED"
        side_effects:
          - "every child Submission with status NOT IN {WITHDRAWN, REJECTED, NOT_BOOKED} transitions to WITHDRAWN"
          - "every AvailabilityHold linked to those submissions with status == ACTIVE transitions to RELEASED"
          - "every AuditionSession of this breakdown with status == SCHEDULED transitions to CANCELLED; its PROPOSED/CONFIRMED appointments become CANCELLED"
          - "Production.active_breakdown_count recomputed (decrements by 1)"
          - "increments Breakdown.version by 1 AND Production.version by 1"

  - entity: Submission
    initial_state: SUBMITTED
    terminal_states: [REJECTED, NOT_BOOKED, WITHDRAWN, BOOKED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /casting/submissions/{id}/start-review"
        actor: CastingAssociate
        preconditions:
          - "submission.status == SUBMITTED"
          - "parent Breakdown.status IN {RELEASED_AGENT_ONLY, RELEASED_OPEN}"
        side_effects:
          - "submission.reviewed_at := current logical clock"
          - "increments Submission.version by 1"
      - from: UNDER_REVIEW
        to: SHORTLISTED
        trigger: "POST /casting/submissions/{id}/shortlist"
        actor: CastingAssociate
        preconditions:
          - "submission.status == UNDER_REVIEW"
        side_effects:
          - "increments Submission.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /casting/submissions/{id}/reject"
        actor: CastingAssociate
        preconditions:
          - "submission.status IN {UNDER_REVIEW, SHORTLISTED}"
        side_effects:
          - "every AvailabilityHold on this submission with status == ACTIVE transitions to RELEASED"
          - "increments Submission.version by 1"
      - from: SHORTLISTED
        to: REJECTED
        trigger: "POST /casting/submissions/{id}/reject"
        actor: CastingAssociate
        preconditions:
          - "submission.status IN {UNDER_REVIEW, SHORTLISTED}"
        side_effects:
          - "every AvailabilityHold on this submission with status == ACTIVE transitions to RELEASED"
          - "increments Submission.version by 1"
      - from: SHORTLISTED
        to: CALLBACK_INVITED
        trigger: "POST /casting/sessions/{session_id}/appointments (appointment creation)"
        actor: CastingAssociate
        preconditions:
          - "submission.status == SHORTLISTED"
        side_effects:
          - "increments Submission.version by 1"
      - from: CALLBACK_INVITED
        to: CALLBACK_COMPLETED
        trigger: "POST /casting/appointments/{id}/complete"
        actor: CastingAssociate
        preconditions:
          - "submission.status == CALLBACK_INVITED"
          - "the appointment being completed belongs to this submission"
        side_effects:
          - "increments Submission.version by 1"
      - from: CALLBACK_INVITED
        to: UNDER_REVIEW
        trigger: "POST /casting/appointments/{id}/cancel (last appointment cancelled)"
        actor: CastingAssociate
        preconditions:
          - "submission.status == CALLBACK_INVITED"
          - "no remaining CallbackAppointment on this submission with status IN {PROPOSED, CONFIRMED}"
        side_effects:
          - "increments Submission.version by 1"
      - from: CALLBACK_COMPLETED
        to: OFFER_PENDING
        trigger: "POST /casting/submissions/{id}/offers (offer creation)"
        actor: CastingDirector
        preconditions:
          - "submission.status == CALLBACK_COMPLETED"
        side_effects:
          - "increments Submission.version by 1"
      - from: OFFER_PENDING
        to: BOOKED
        trigger: "POST /casting/bookings (booking creation after offer ACCEPTED)"
        actor: ProductionCoordinator
        preconditions:
          - "submission.status == OFFER_PENDING"
          - "the submission's Offer.status == ACCEPTED"
        side_effects:
          - "parent Role.status := CAST (role is filled)"
          - "every OTHER Submission on the same Breakdown with status IN {SUBMITTED, UNDER_REVIEW, SHORTLISTED, CALLBACK_INVITED, CALLBACK_COMPLETED, OFFER_PENDING} transitions to NOT_BOOKED"
          - "every AvailabilityHold on those other submissions with status == ACTIVE transitions to RELEASED"
          - "Talent.union_engagement_count_365d recomputed"
          - "if Production.union_signatory AND Role.is_union_covered AND Talent.union_status == NON_UNION: a TaftHartleyReport is auto-created with status PENDING"
          - "increments Submission.version by 1 AND Role.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /casting/submissions/{id}/withdraw"
        actor: Agent
        preconditions:
          - "submission.status IN {SUBMITTED, UNDER_REVIEW, SHORTLISTED}"
          - "actor is the submitting agent (submission.agent_id == X-User-ID) OR the talent's own self-submission withdrawn by CastingAssociate"
        side_effects:
          - "every AvailabilityHold on this submission with status == ACTIVE transitions to RELEASED"
          - "Breakdown.submission_count recomputed (decrements by 1)"
          - "increments Submission.version by 1 AND Breakdown.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /casting/submissions/{id}/withdraw"
        actor: Agent
        preconditions:
          - "submission.status IN {SUBMITTED, UNDER_REVIEW, SHORTLISTED}"
        side_effects:
          - "every AvailabilityHold on this submission with status == ACTIVE transitions to RELEASED"
          - "Breakdown.submission_count recomputed (decrements by 1)"
          - "increments Submission.version by 1 AND Breakdown.version by 1"
      - from: SHORTLISTED
        to: WITHDRAWN
        trigger: "POST /casting/submissions/{id}/withdraw"
        actor: Agent
        preconditions:
          - "submission.status IN {SUBMITTED, UNDER_REVIEW, SHORTLISTED}"
        side_effects:
          - "every AvailabilityHold on this submission with status == ACTIVE transitions to RELEASED"
          - "Breakdown.submission_count recomputed (decrements by 1)"
          - "increments Submission.version by 1 AND Breakdown.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system duplicate-detection on POST /casting/breakdowns/{id}/submissions"
        actor: system
        preconditions:
          - "an earlier Submission with same (breakdown_id, talent_id) exists with status NOT IN {REJECTED, WITHDRAWN, NOT_BOOKED}"
        side_effects:
          - "new submission.duplicate_of_id := earlier submission id"
          - "new submission persists as REJECTED (never enters SUBMITTED)"

  - entity: SelfTape
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /casting/self-tapes/{id}/accept"
        actor: CastingAssociate
        preconditions:
          - "self_tape.status == RECEIVED"
          - "parent Submission.status NOT IN {REJECTED, WITHDRAWN, NOT_BOOKED}"
        side_effects:
          - "increments SelfTape.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /casting/self-tapes/{id}/reject"
        actor: CastingAssociate
        preconditions:
          - "self_tape.status == RECEIVED"
        side_effects:
          - "increments SelfTape.version by 1"

  - entity: AuditionSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system clock advance (logical clock >= session_start while status == SCHEDULED)"
        actor: system
        preconditions:
          - "session.status == SCHEDULED"
          - "logical clock >= session.session_start"
        side_effects:
          - "increments AuditionSession.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /casting/sessions/{id}/complete"
        actor: CastingAssociate
        preconditions:
          - "session.status == IN_PROGRESS"
          - "every child CallbackAppointment with status == PROPOSED is resolved (none may remain PROPOSED)"
        side_effects:
          - "every child CallbackAppointment with status == CONFIRMED transitions to NO_SHOW unless individually completed"
          - "increments AuditionSession.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /casting/sessions/{id}/cancel"
        actor: CastingAssociate
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "every child CallbackAppointment with status IN {PROPOSED, CONFIRMED} transitions to CANCELLED; each affected Submission with status == CALLBACK_INVITED and no remaining active appointment reverts to UNDER_REVIEW"
          - "increments AuditionSession.version by 1"

  - entity: CallbackAppointment
    initial_state: PROPOSED
    terminal_states: [DECLINED, CANCELLED, NO_SHOW]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /casting/appointments/{id}/confirm"
        actor: Agent
        preconditions:
          - "appointment.status == PROPOSED"
          - "actor is the submission's agent (or CastingAssociate for self-submissions)"
          - "confirming would not push session.booked_count >= session.capacity"
          - "no overlap with any other CONFIRMED appointment of the SAME talent (using half-open intervals plus this appointment's buffer_minutes)"
        side_effects:
          - "AuditionSession.booked_count recomputed (increments by 1)"
          - "increments CallbackAppointment.version by 1 AND AuditionSession.version by 1"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /casting/appointments/{id}/decline"
        actor: Agent
        preconditions:
          - "appointment.status == PROPOSED"
        side_effects:
          - "if no remaining appointment on this submission with status IN {PROPOSED, CONFIRMED}: Submission reverts CALLBACK_INVITED -> UNDER_REVIEW"
          - "increments CallbackAppointment.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /casting/appointments/{id}/cancel"
        actor: CastingAssociate
        preconditions:
          - "appointment.status IN {PROPOSED, CONFIRMED}"
        side_effects:
          - "if was CONFIRMED: AuditionSession.booked_count recomputed (decrements by 1)"
          - "if no remaining appointment on this submission with status IN {PROPOSED, CONFIRMED}: Submission reverts CALLBACK_INVITED -> UNDER_REVIEW"
          - "increments CallbackAppointment.version by 1 AND AuditionSession.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /casting/appointments/{id}/cancel"
        actor: CastingAssociate
        preconditions:
          - "appointment.status IN {PROPOSED, CONFIRMED}"
        side_effects:
          - "AuditionSession.booked_count recomputed (decrements by 1)"
          - "if no remaining appointment on this submission with status IN {PROPOSED, CONFIRMED}: Submission reverts CALLBACK_INVITED -> UNDER_REVIEW"
          - "increments CallbackAppointment.version by 1 AND AuditionSession.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "session completion sweep (system)"
        actor: system
        preconditions:
          - "appointment.status == CONFIRMED"
          - "parent AuditionSession transitions IN_PROGRESS -> COMPLETED without an explicit appointment complete"
        side_effects:
          - "AuditionSession.booked_count recomputed (decrements by 1)"

  - entity: AvailabilityHold
    initial_state: ACTIVE
    terminal_states: [CONFIRMED, RELEASED, EXPIRED, OUTBID]
    transitions:
      - from: ACTIVE
        to: CONFIRMED
        trigger: "POST /casting/holds/{id}/confirm (converting a hold into a firm commitment, prerequisite for offer on pinned talent)"
        actor: CastingDirector
        preconditions:
          - "hold.status == ACTIVE"
          - "logical clock < hold.expires_at"
          - "hold is the highest-priority ACTIVE hold for this (talent_id, overlapping window): no other ACTIVE hold with strictly lower priority_rank overlaps [window_start, window_end); ties on priority_rank break by earliest created_at"
        side_effects:
          - "every other ACTIVE AvailabilityHold for the same talent_id whose window overlaps this hold's window transitions to OUTBID"
          - "increments AvailabilityHold.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /casting/holds/{id}/release"
        actor: CastingDirector
        preconditions:
          - "hold.status == ACTIVE"
        side_effects:
          - "increments AvailabilityHold.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock sweep when logical clock >= expires_at"
        actor: system
        preconditions:
          - "hold.status == ACTIVE"
          - "logical clock >= hold.expires_at"
        side_effects:
          - "increments AvailabilityHold.version by 1"
      - from: ACTIVE
        to: OUTBID
        trigger: "competing hold confirm (system side effect of another hold's ACTIVE->CONFIRMED)"
        actor: system
        preconditions:
          - "hold.status == ACTIVE"
          - "a competing hold on the same talent with overlapping window and strictly higher priority (lower priority_rank, tie-break earliest created_at) was CONFIRMED"
        side_effects:
          - "increments AvailabilityHold.version by 1"

  - entity: Offer
    initial_state: EXTENDED
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: EXTENDED
        to: COUNTERED
        trigger: "POST /casting/offers/{id}/counter"
        actor: Agent
        preconditions:
          - "offer.status == EXTENDED"
          - "actor is the submission's agent"
          - "logical clock < offer.expires_at"
        side_effects:
          - "creates a NEW Offer row: round_number := parent.round_number + 1, parent_offer_id := this offer id, status := EXTENDED, fields from counter payload"
          - "this offer.status := COUNTERED"
          - "increments Offer.version by 1 (on both rows for the new row's creation)"
      - from: COUNTERED
        to: COUNTERED
        trigger: "POST /casting/offers/{id}/counter (further round on the live offer)"
        actor: CastingDirector
        preconditions:
          - "the LIVE offer (latest round, status == EXTENDED) is being countered by the office side"
          - "logical clock < offer.expires_at"
        side_effects:
          - "creates a NEW Offer row: round_number + 1, parent_offer_id := live offer id"
          - "live offer.status := COUNTERED"
      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /casting/offers/{id}/accept"
        actor: "Agent (submission.agent_id == X-User-ID) | CastingDirector (only when submission.agent_id is null — self-submission countersign)"
        preconditions:
          - "offer.status == EXTENDED"
          - "actor is the submission's agent, OR (submission.agent_id is null AND actor is CastingDirector)"
          - "logical clock < offer.expires_at"
          - "if Role.is_minor_role and Talent.is_minor: a MinorWorkPermit for (talent, production) exists with status == VERIFIED and valid_until >= DealMemo engagement_end to be created"
        side_effects:
          - "creates DealMemo (status EXECUTED) with computed_fee_cents := engagement_fee_proration(proration_mode, engagement span, offer.weekly_rate_cents)"
          - "increments Offer.version by 1"
      - from: EXTENDED
        to: DECLINED
        trigger: "POST /casting/offers/{id}/decline"
        actor: Agent
        preconditions:
          - "offer.status == EXTENDED"
        side_effects:
          - "Submission.status transitions OFFER_PENDING -> CALLBACK_COMPLETED (talent stays in play)"
          - "increments Offer.version by 1 AND Submission.version by 1"
      - from: EXTENDED
        to: WITHDRAWN
        trigger: "POST /casting/offers/{id}/withdraw"
        actor: CastingDirector
        preconditions:
          - "offer.status == EXTENDED"
        side_effects:
          - "Submission.status transitions OFFER_PENDING -> CALLBACK_COMPLETED"
          - "every AvailabilityHold on this submission with status == CONFIRMED transitions to RELEASED"
          - "increments Offer.version by 1 AND Submission.version by 1"
      - from: EXTENDED
        to: EXPIRED
        trigger: "system clock sweep when logical clock >= expires_at"
        actor: system
        preconditions:
          - "offer.status IN {EXTENDED, COUNTERED}"
          - "logical clock >= offer.expires_at"
        side_effects:
          - "if the expiring offer is the live (highest round) offer of its submission: Submission.status transitions OFFER_PENDING -> CALLBACK_COMPLETED"
          - "increments Offer.version by 1"
      - from: COUNTERED
        to: EXPIRED
        trigger: "system clock sweep when logical clock >= expires_at"
        actor: system
        preconditions:
          - "offer.status IN {EXTENDED, COUNTERED}"
          - "logical clock >= offer.expires_at"
        side_effects:
          - "increments Offer.version by 1"

  - entity: DealMemo
    initial_state: EXECUTED
    terminal_states: [VOIDED]
    transitions:
      - from: EXECUTED
        to: VOIDED
        trigger: "POST /casting/deal-memos/{id}/void"
        actor: CastingDirector
        preconditions:
          - "deal_memo.status == EXECUTED"
          - "no Booking referencing this memo has status == CONFIRMED"
        side_effects:
          - "any Booking referencing this memo with status == PENDING transitions to CANCELLED with cancellation_reason := PRODUCTION_CANCELLED and zero penalty"
          - "increments DealMemo.version by 1"

  - entity: MinorWorkPermit
    initial_state: PENDING_VERIFICATION
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /casting/permits/{id}/verify"
        actor: ProductionCoordinator
        preconditions:
          - "permit.status == PENDING_VERIFICATION"
          - "logical clock < permit.valid_until"
        side_effects:
          - "increments MinorWorkPermit.version by 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system clock sweep when logical clock >= valid_until"
        actor: system
        preconditions:
          - "permit.status == VERIFIED"
          - "logical clock >= permit.valid_until"
        side_effects:
          - "every Booking with work_permit_id == this permit and status IN {PENDING, CONFIRMED} whose DealMemo engagement_end > permit.valid_until transitions to CANCELLED with cancellation_reason := PERMIT_REVOKED (permit-lapse cancellation)"
          - "increments MinorWorkPermit.version by 1"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /casting/permits/{id}/revoke"
        actor: ProductionCoordinator
        preconditions:
          - "permit.status == VERIFIED"
        side_effects:
          - "every Booking with work_permit_id == this permit and status IN {PENDING, CONFIRMED} transitions to CANCELLED with cancellation_reason := PERMIT_REVOKED; for CONFIRMED bookings the DealMemo.cancellation_penalty_cents is computed per cancellation_penalty_tier and the memo remains EXECUTED"
          - "increments MinorWorkPermit.version by 1"

  - entity: Booking
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /casting/bookings/{id}/confirm"
        actor: ProductionCoordinator
        preconditions:
          - "booking.status == PENDING"
          - "DealMemo.status == EXECUTED"
          - "if Role.is_minor_role: MinorWorkPermit.status == VERIFIED AND permit.valid_until >= DealMemo.engagement_end"
          - "no other Booking for the same Talent (via submission) with status == CONFIRMED overlapping DealMemo engagement window (CLOSED day-intervals: overlap iff A.engagement_start <= B.engagement_end AND B.engagement_start <= A.engagement_end, comparing calendar dates)"
        side_effects:
          - "booking.confirmed_at := current logical clock"
          - "Talent.union_engagement_count_365d recomputed"
          - "if Production.union_signatory AND Role.is_union_covered AND Talent.union_status == NON_UNION: auto-create TaftHartleyReport (status PENDING, filing_deadline := confirmed_at + 15 days)"
          - "increments Booking.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /casting/bookings/{id}/cancel"
        actor: ProductionCoordinator
        preconditions:
          - "booking.status IN {PENDING, CONFIRMED}"
          - "payload.cancellation_reason present"
        side_effects:
          - "booking.cancelled_at := current logical clock"
          - "DealMemo.cancellation_penalty_cents := 0 (no penalty before confirmation)"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /casting/bookings/{id}/cancel"
        actor: ProductionCoordinator
        preconditions:
          - "booking.status IN {PENDING, CONFIRMED}"
          - "payload.cancellation_reason present"
        side_effects:
          - "booking.cancelled_at := current logical clock"
          - "DealMemo.cancellation_penalty_cents := cancellation_penalty_tier(days_between(clock, engagement_start), DealMemo guarantee via Offer)"
          - "Talent.union_engagement_count_365d recomputed (decremented if this booking was inside window)"
          - "if a TaftHartleyReport references this booking with status == PENDING: it transitions to WAIVED"
          - "Submission.status transitions BOOKED -> NOT_BOOKED and Role.status transitions CAST -> OPEN"
          - "increments Booking.version by 1 AND DealMemo.version by 1 AND Submission.version by 1 AND Role.version by 1"

  - entity: TaftHartleyReport
    initial_state: PENDING
    terminal_states: [FILED, LATE, WAIVED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /casting/taft-hartley/{id}/file"
        actor: ProductionCoordinator
        preconditions:
          - "report.status == PENDING"
          - "logical clock <= report.filing_deadline"
        side_effects:
          - "report.filed_at := current logical clock"
          - "increments TaftHartleyReport.version by 1"
      - from: PENDING
        to: LATE
        trigger: "system clock sweep when logical clock > filing_deadline, or production completion sweep"
        actor: system
        preconditions:
          - "report.status == PENDING"
          - "logical clock > report.filing_deadline"
        side_effects:
          - "increments TaftHartleyReport.version by 1"
      - from: LATE
        to: FILED
        trigger: "POST /casting/taft-hartley/{id}/file (late filing still accepted, recorded against deadline)"
        actor: ProductionCoordinator
        preconditions:
          - "report.status == LATE"
        side_effects:
          - "report.filed_at := current logical clock"
          - "increments TaftHartleyReport.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "system side effect of booking cancellation before filing"
        actor: system
        preconditions:
          - "report.status == PENDING"
          - "referenced Booking transitions to CANCELLED"
        side_effects:
          - "increments TaftHartleyReport.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: submission-create-stale-breakdown
    parent_entity: Breakdown
    write_endpoint: "POST /casting/breakdowns/{id}/submissions"
    occ_field: "expected_breakdown_version"
    description: |
      Creating a Submission against a Breakdown whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      breakdown was widened (AGENT_ONLY -> OPEN_CALL), closed, or its
      submission_count moved since the client rendered its submission form, so
      the client's view of the breakdown is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: offer-counter-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /casting/offers/{id}/counter"
    occ_field: "expected_offer_version"
    description: |
      Countering an Offer whose version has advanced since the client last
      observed it is rejected. This captures the case where the other party has
      just countered (creating a new round) or the offer was withdrawn, so the
      countering client's view of the negotiation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: engagement_fee_proration
    description: "Prorated engagement fee for a multi-day engagement span, driven off the offered weekly rate. Two sanctioned variants produce different fees for identical spans."
    trigger: "Offer EXTENDED -> ACCEPTED (DealMemo creation); recomputed nowhere else (frozen on the memo)"
    algorithm: tiered_pricing
    formula: |
      daily_rate_cents = floor_div(weekly_rate_cents, 5)   # 5 workdays per union week; integer division, remainder discarded
      span_days = dates_inclusive(engagement_start, engagement_end)
      if proration_mode == CALENDAR_SPAN:
          effective_days = count of ALL days in span_days            # weekends count
      else:  # WORKDAY_SPAN
          effective_days = count of days in span_days whose weekday IN {Mon..Fri}
      computed_fee_cents = daily_rate_cents * effective_days
    input_set: "Offer.weekly_rate_cents of the accepted offer; DealMemo.engagement_start/engagement_end; DealMemo.proration_mode"
    constants:
      WORKDAYS_PER_WEEK: 5
    precision: "integer cents; daily rate floor-divided BEFORE multiplication; no rounding after multiplication"
    variants:
      - name: CALENDAR_SPAN
        when: "proration_mode == CALENDAR_SPAN (common for daily/weekly players on film)"
        difference: "Weekend days inside the span count as paid days; fee = daily_rate * total_calendar_days"
      - name: WORKDAY_SPAN
        when: "proration_mode == WORKDAY_SPAN (common for episodic)"
        difference: "Only Mon-Fri days count; fee = daily_rate * weekday_count; identical span yields strictly smaller fee whenever the span contains a weekend day"

  - name: cancellation_penalty_tier
    description: "Cancellation penalty charged against a CONFIRMED booking, tiered by how close to engagement start the cancellation lands. Circular-looking: penalty is computed from guarantee_cents, which lives on the Offer reached via DealMemo.offer_id — evaluation order is pinned."
    trigger: "Booking CONFIRMED -> CANCELLED"
    algorithm: threshold
    formula: |
      # Evaluation order (pinned): resolve guarantee FIRST, then pick tier, then multiply.
      step1: memo = DealMemo(booking.deal_memo_id); offer = Offer(memo.offer_id)
      step2: guarantee = offer.guarantee_cents
      step3: days_out = whole_calendar_days_between(current_clock_date, memo.engagement_start)
             # >= 0; negative (cancelling after start) clamps to 0
      step4: tier_pct = 0   if days_out >= 14
                      25   if 7  <= days_out <= 13
                      50   if 3  <= days_out <= 6
                      100  if 0  <= days_out <= 2
      step5: memo.cancellation_penalty_cents = guarantee * tier_pct / 100   # integer, exact (guarantee multiple of 100 enforced at offer input)
    input_set: "Booking being cancelled; its DealMemo; the Offer behind the memo; current logical clock date vs memo.engagement_start"
    constants:
      TIER_FULL_NOTICE_DAYS: 14
      TIER_HIGH_NOTICE_DAYS: 7
      TIER_LOW_NOTICE_DAYS: 3
      PCT_FULL_NOTICE: 0
      PCT_HIGH_NOTICE: 25
      PCT_LOW_NOTICE: 50
      PCT_LATE: 100
    precision: "integer cents; tier boundaries are INCLUSIVE at the lower bound (days_out == 7 -> 25%; days_out == 14 -> 0%)"

  - name: appointment_overlap_conflict
    description: "Determines whether a proposed CallbackAppointment for a talent collides with that talent's existing CONFIRMED appointments, applying the new appointment's buffer AFTER its slot end. Interval semantics: half-open with one-sided buffer."
    trigger: "CallbackAppointment PROPOSED -> CONFIRMED"
    algorithm: interval_merge
    formula: |
      # Half-open intervals; the BUFFER is applied only to the NEW appointment's tail.
      new_eff_end = new.slot_end + new.buffer_minutes minutes
      conflict EXISTS iff any existing CONFIRMED appointment A of the same talent satisfies:
          A.slot_start < new_eff_end  AND  new.slot_start < A.slot_end
      # Adjacency is NOT a conflict: A.slot_end == new.slot_start does not conflict.
      # The existing appointment's own buffer is NOT symmetric: only the NEW appointment's buffer counts.
    input_set: "All CallbackAppointments with status == CONFIRMED whose submission's talent_id equals the new appointment's talent"
    constants: {}
    precision: "minute granularity; strict inequality at both ends"

  - name: hold_priority_resolution
    description: "Picks which ACTIVE AvailabilityHold wins when several holds on the same talent overlap. Combinatorial: 3 inputs (priority_rank, created_at, window overlap) with non-linear interaction."
    trigger: "AvailabilityHold ACTIVE -> CONFIRMED (precondition evaluation and OUTBID sweep)"
    algorithm: weighted_scoring
    formula: |
      candidates = ACTIVE holds H where H.talent_id == this.talent_id
                   AND H.window_start < this.window_end AND this.window_start < H.window_end
      this hold may confirm iff NO candidate satisfies ANY of:
          (a) candidate.priority_rank <  this.priority_rank
          (b) candidate.priority_rank == this.priority_rank AND candidate.created_at < this.created_at
      on successful confirm: every candidate (regardless of rank) transitions to OUTBID
    input_set: "ACTIVE AvailabilityHolds of the same talent with overlapping half-open windows"
    constants: {}
    precision: "created_at compared at millisecond precision; priority_rank is a strict integer order"

  - name: union_eligibility_tafthartley
    description: "Rolling 365-day count of union-covered confirmed engagements; crossing the threshold flips a NON_UNION talent to ELIGIBLE_PENDING. Threshold precision matters (>= 3 vs > 3)."
    trigger: "Booking transitions to CONFIRMED (increment path) and to CANCELLED from CONFIRMED (decrement path)"
    algorithm: aggregation
    formula: |
      window_start = current_logical_clock - 365 days
      union_engagement_count_365d = count of Bookings B where
          B.submission.talent_id == talent.id
          AND B.status == CONFIRMED
          AND B's DealMemo.engagement_start >= window_start
          AND B's DealMemo.engagement_start <= current_logical_clock
          AND Role(B.submission.breakdown.role_id).is_union_covered == true
      if talent.union_status == NON_UNION AND union_engagement_count_365d >= UNION_THRESHOLD:
          talent.union_status := ELIGIBLE_PENDING
    input_set: "CONFIRMED Bookings of the talent only; CANCELLED/PENDING excluded; engagement_start inside the INCLUSIVE rolling window [clock-365d, clock]"
    constants:
      UNION_THRESHOLD: 3
      WINDOW_DAYS: 365
    precision: "threshold is >= 3 (the third engagement flips status); window bounds are INCLUSIVE at both ends"

  - name: minor_daily_hours_cap
    description: "Validates that a minor's booked engagement day does not exceed the permit's daily hour cap, distinguishing school vs non-school days. Nested rounding / conditional-branch mode."
    trigger: "Booking PENDING -> CONFIRMED when Role.is_minor_role (precondition check)"
    algorithm: constraint_propagation
    formula: |
      for each engagement day D in [DealMemo.engagement_start, DealMemo.engagement_end]:
          is_school_day = D.weekday() IN {Mon..Fri} AND D NOT IN production_hiatus_days
          cap = permit.max_daily_hours_school_day if is_school_day else permit.max_daily_hours_non_school_day
          requested_hours = 8   # standard engagement day unless DealMemo specifies otherwise
          if requested_hours > cap: REJECT with ERR_MINOR_HOURS_EXCEEDED
    input_set: "VERIFIED MinorWorkPermit of (talent, production); DealMemo engagement span; production calendar weekdays"
    constants:
      STANDARD_DAY_HOURS: 8
    precision: "whole hours; school-day determination is Mon-Fri regardless of holidays (hiatus days not modelled as separate input)"

  - name: submission_count_reconcile
    description: "Denormalized counter on Breakdown kept consistent with live submissions. Order-sensitive when cascades fire in bulk."
    trigger: "Submission created (non-duplicate), Submission -> WITHDRAWN, Submission auto-rejected as duplicate (excluded), breakdown close/cancel cascades"
    algorithm: aggregation
    formula: |
      submission_count = count of Submissions S where
          S.breakdown_id == breakdown.id AND S.status != WITHDRAWN
      # duplicates (status REJECTED with duplicate_of_id set) DO count until withdrawn;
      # only WITHDRAWN is excluded.
    input_set: "Submissions of the breakdown in ANY status except WITHDRAWN"
    constants: {}
    precision: "exact integer; recomputed after every cascade batch, not incrementally per row"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "Role is permitted for this endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,            check: "Path-templated resources exist, validated left-to-right (production, then breakdown, then child)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4,  category: existence,            check: "Body-referenced FK ids exist (talent_id, agent_id, session_id, etc.)", error_id: ERR_REFERENCED_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5,  category: state,                check: "Target resource's state machine allows the requested transition from its current state", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6,  category: state,                check: "OCC expected_<parent>_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "[POST /casting/breakdowns/{id}/submissions, POST /casting/offers/{id}/counter]" }
  - { priority: 7,  category: business_safety,      check: "Minor-safety: when Role.is_minor_role and Talent.is_minor, a VERIFIED MinorWorkPermit exists covering (talent, production) and valid through engagement_end; else reject offer-accept and booking-confirm", error_id: ERR_PERMIT_REQUIRED, http_status: 422, applies_to: "[POST /casting/offers/{id}/accept, POST /casting/bookings, POST /casting/bookings/{id}/confirm]" }
  - { priority: 8,  category: business_safety,      check: "Minor daily hours do not exceed permit caps for any engagement day (per minor_daily_hours_cap)", error_id: ERR_MINOR_HOURS_EXCEEDED, http_status: 422, applies_to: "[POST /casting/bookings/{id}/confirm]" }
  - { priority: 9,  category: business_referential, check: "AvailabilityHold.talent_id MUST equal Submission.talent_id of the referenced submission", error_id: ERR_HOLD_TALENT_MISMATCH, http_status: 422, applies_to: "[POST /casting/submissions/{id}/holds]" }
  - { priority: 10, category: business_temporal,    check: "Callback slot fits inside session window: session.session_start <= slot_start < slot_end <= session.session_end", error_id: ERR_SLOT_OUTSIDE_SESSION, http_status: 422, applies_to: "[POST /casting/sessions/{id}/appointments]" }
  - { priority: 11, category: business_temporal,    check: "No overlap with existing CONFIRMED appointments of the same talent (appointment_overlap_conflict, buffer applied)", error_id: ERR_TALENT_CONFLICT, http_status: 409, applies_to: "[POST /casting/appointments/{id}/confirm]" }
  - { priority: 12, category: business_temporal,    check: "Session capacity not exceeded: session.booked_count < session.capacity at confirm time", error_id: ERR_SESSION_FULL, http_status: 409, applies_to: "[POST /casting/appointments/{id}/confirm]" }
  - { priority: 13, category: business_temporal,    check: "Hold window well-formed: window_start < window_end and expires_at > window_start", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "[POST /casting/submissions/{id}/holds]" }
  - { priority: 14, category: business_temporal,    check: "Hold confirm blocked by higher-priority overlapping ACTIVE hold (hold_priority_resolution)", error_id: ERR_HOLD_OUTRANKED, http_status: 409, applies_to: "[POST /casting/holds/{id}/confirm]" }
  - { priority: 15, category: business_temporal,    check: "Submission accepted only while logical clock < breakdown.submission_deadline", error_id: ERR_DEADLINE_PASSED, http_status: 422, applies_to: "[POST /casting/breakdowns/{id}/submissions]" }
  - { priority: 16, category: business_constraint,  check: "Distribution gate: AGENT_ONLY breakdowns accept only submissions with agent_id of a FRANCHISED, active AgentProfile; OPEN_CALL accepts agent or self submissions", error_id: ERR_CHANNEL_FORBIDDEN, http_status: 403, applies_to: "[POST /casting/breakdowns/{id}/submissions]" }
  - { priority: 17, category: business_constraint,  check: "Duplicate active submission for same (breakdown_id, talent_id) is persisted as auto-REJECTED (not an error response; 201 with REJECTED status and duplicate_of_id set)", error_id: ERR_DUPLICATE_SUBMISSION, http_status: 201, applies_to: "[POST /casting/breakdowns/{id}/submissions]" }
  - { priority: 18, category: business_constraint,  check: "SelfTape.duration_seconds within (0, 600]", error_id: ERR_TAPE_TOO_LONG, http_status: 422, applies_to: "[POST /casting/submissions/{id}/self-tapes]" }
  - { priority: 19, category: business_constraint,  check: "Offer.guarantee_cents <= 52 * weekly_rate_cents and both > 0 bounds respected; guarantee_cents multiple of 100", error_id: ERR_INVALID_OFFER_TERMS, http_status: 422, applies_to: "[POST /casting/submissions/{id}/offers, POST /casting/offers/{id}/counter]" }
  - { priority: 20, category: business_constraint,  check: "Only the LIVE offer (highest round_number, status EXTENDED) of a submission may be countered/accepted/declined/withdrawn", error_id: ERR_NOT_LIVE_OFFER, http_status: 409, applies_to: "[POST /casting/offers/{id}/counter, POST /casting/offers/{id}/accept, POST /casting/offers/{id}/decline, POST /casting/offers/{id}/withdraw]" }
  - { priority: 21, category: business_temporal,    check: "Offer actions allowed only while logical clock < offer.expires_at", error_id: ERR_OFFER_EXPIRED, http_status: 422, applies_to: "[POST /casting/offers/{id}/counter, POST /casting/offers/{id}/accept]" }
  - { priority: 22, category: business_constraint,  check: "Booking requires an ACCEPTED offer and an EXECUTED DealMemo; only one non-cancelled booking per submission", error_id: ERR_BOOKING_PRECONDITION, http_status: 422, applies_to: "[POST /casting/bookings]" }
  - { priority: 23, category: business_temporal,    check: "Booking confirm rejected when another CONFIRMED booking for the same talent overlaps the engagement window (CLOSED day-intervals: overlap iff A.start <= B.end AND B.start <= A.end, so shared boundary days count as overlap)", error_id: ERR_ENGAGEMENT_OVERLAP, http_status: 409, applies_to: "[POST /casting/bookings/{id}/confirm]" }
  - { priority: 24, category: business_fiscal,      check: "Taft-Hartley filing only when report.status IN {PENDING, LATE} (PENDING requires clock <= filing_deadline for on-time FILED)", error_id: ERR_FILING_WINDOW, http_status: 422, applies_to: "[POST /casting/taft-hartley/{id}/file]" }
  - { priority: 25, category: business_fiscal,      check: "Production lock requires every OPEN role to have a CONFIRMED booking", error_id: ERR_ROLE_UNFILLED, http_status: 422, applies_to: "[POST /casting/productions/{id}/lock]" }
  - { priority: 26, category: business_constraint,  check: "Required request fields present and well-typed (title, dates, enums)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; mandatory default) ---
  - method: POST
    path: /casting/_clock/set_current_utc
    description: "Advance the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock. Running clock sweeps (hold expiry, offer expiry, session IN_PROGRESS, permit expiry, Taft-Hartley lateness) are evaluated against this logical clock."
    roles: [CastingDirector, ProductionCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["evaluates all clock-driven sweeps: AvailabilityHold EXPIRED, Offer EXPIRED, AuditionSession IN_PROGRESS, MinorWorkPermit EXPIRED, TaftHartleyReport LATE"]

  # --- Production ---
  - method: POST
    path: /casting/productions
    description: "Create a production"
    roles: [CastingDirector]
    code: 201
    input: [title, production_type, union_signatory, shoot_city, shoot_state, start_date, wrap_date, casting_office_id]
    output: Production
    side_effects: []
  - method: GET
    path: /casting/productions/{id}
    description: "Fetch a production"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent, Guardian]
    code: 200
    input: []
    output: Production
    side_effects: []
  - method: GET
    path: /casting/productions
    description: "List productions (paginated)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?", "union_signatory?"]
    output: Production[]
    side_effects: []
  - method: POST
    path: /casting/productions/{id}/open-casting
    description: "Transition Production SETUP -> CASTING"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Production
    side_effects: ["production.status := CASTING", "increments Production.version by 1"]
  - method: POST
    path: /casting/productions/{id}/lock
    description: "Transition Production CASTING -> LOCKED (all OPEN roles must have CONFIRMED bookings)"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Production
    side_effects: ["production.status := LOCKED", "increments Production.version by 1"]
  - method: POST
    path: /casting/productions/{id}/complete
    description: "Transition Production LOCKED -> COMPLETED; PENDING Taft-Hartley reports become LATE"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Production
    side_effects: ["production.status := COMPLETED", "pending TaftHartleyReports -> LATE", "increments Production.version by 1"]

  # --- Role ---
  - method: POST
    path: /casting/productions/{id}/roles
    description: "Create a role under a production"
    roles: [CastingDirector]
    code: 201
    input: [character_name, is_minor_role, is_union_covered, engagement_start, engagement_end]
    output: Role
    side_effects: []
  - method: GET
    path: /casting/roles/{id}
    description: "Fetch a role"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: Role
    side_effects: []
  - method: GET
    path: /casting/productions/{id}/roles
    description: "List roles of a production"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Role[]
    side_effects: []

  # --- Breakdown ---
  - method: POST
    path: /casting/productions/{id}/breakdowns
    description: "Create a breakdown in DRAFT for a role"
    roles: [CastingDirector]
    code: 201
    input: [role_id, distribution, submission_deadline, rate_weekly_cents]
    output: Breakdown
    side_effects: []
  - method: GET
    path: /casting/breakdowns/{id}
    description: "Fetch a breakdown"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: Breakdown
    side_effects: []
  - method: GET
    path: /casting/productions/{id}/breakdowns
    description: "List breakdowns of a production"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Breakdown[]
    side_effects: []
  - method: GET
    path: /casting/breakdowns
    description: "List/filter breakdowns across productions (FK reverse-reachability for Breakdown.role_id)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?", "role_id?", "production_id?"]
    output: Breakdown[]
    side_effects: []
  - method: POST
    path: /casting/breakdowns/{id}/release
    description: "Release a DRAFT breakdown (to RELEASED_AGENT_ONLY or RELEASED_OPEN per payload.distribution)"
    roles: [CastingDirector]
    code: 200
    input: [distribution]
    output: Breakdown
    side_effects: ["released_at := clock", "Production.active_breakdown_count += 1", "increments Breakdown.version by 1 AND Production.version by 1"]
  - method: POST
    path: /casting/breakdowns/{id}/widen
    description: "Widen an AGENT_ONLY breakdown to OPEN_CALL"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Breakdown
    side_effects: ["distribution := OPEN_CALL", "status := RELEASED_OPEN", "increments Breakdown.version by 1"]
  - method: POST
    path: /casting/breakdowns/{id}/close
    description: "Close a released breakdown; unreviewed submissions cascade to REJECTED"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Breakdown
    side_effects: ["unreviewed Submissions -> REJECTED", "Production.active_breakdown_count -= 1", "increments Breakdown.version by 1 AND Production.version by 1"]
  - method: POST
    path: /casting/breakdowns/{id}/cancel
    description: "Cancel a breakdown (no BOOKED submissions allowed); cascades submissions to WITHDRAWN, holds to RELEASED, sessions to CANCELLED"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Breakdown
    side_effects: ["active Submissions -> WITHDRAWN", "ACTIVE AvailabilityHolds -> RELEASED", "SCHEDULED AuditionSessions -> CANCELLED with their appointments", "Production.active_breakdown_count -= 1 when released", "increments Breakdown.version by 1"]

  # --- Agent / Guardian / Talent registry ---
  - method: POST
    path: /casting/agents
    description: "Register an agent profile"
    roles: [CastingDirector]
    code: 201
    input: [agency_name, contact_email, franchise_status, "active?"]
    output: AgentProfile
    side_effects: []
  - method: GET
    path: /casting/agents/{id}
    description: "Fetch an agent profile"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: AgentProfile
    side_effects: []
  - method: POST
    path: /casting/guardians
    description: "Register a guardian"
    roles: [ProductionCoordinator]
    code: 201
    input: [full_name, contact_email, relationship]
    output: Guardian
    side_effects: []
  - method: GET
    path: /casting/guardians/{id}
    description: "Fetch a guardian"
    roles: [CastingDirector, ProductionCoordinator, Guardian]
    code: 200
    input: []
    output: Guardian
    side_effects: []
  - method: POST
    path: /casting/talents
    description: "Register a talent"
    roles: [CastingDirector, Agent]
    code: 201
    input: [full_name, "stage_name?", date_of_birth, union_status, "agent_id?"]
    output: Talent
    side_effects: []
  - method: GET
    path: /casting/talents/{id}
    description: "Fetch a talent (is_minor recomputed against logical clock)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent, Guardian]
    code: 200
    input: []
    output: Talent
    side_effects: ["Talent.is_minor recomputed on read"]
  - method: GET
    path: /casting/talents
    description: "List talents"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "agent_id?", "union_status?"]
    output: Talent[]
    side_effects: []

  # --- Submission intake ---
  - method: POST
    path: /casting/breakdowns/{id}/submissions
    description: "Submit talent to a released breakdown. OCC-guarded on Breakdown.version. Duplicates are persisted as auto-REJECTED (201 with duplicate_of_id)."
    roles: [Agent, CastingAssociate]
    code: 201
    input: [talent_id, "agent_id?", expected_breakdown_version]
    output: Submission
    side_effects: ["Breakdown.submission_count recomputed", "submitted_via derived", "duplicate detection (same breakdown_id+talent_id active) -> persists REJECTED with duplicate_of_id", "increments Breakdown.version by 1"]
  - method: GET
    path: /casting/submissions/{id}
    description: "Fetch a submission"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: Submission
    side_effects: []
  - method: GET
    path: /casting/breakdowns/{id}/submissions
    description: "List submissions of a breakdown"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?", "talent_id?"]
    output: Submission[]
    side_effects: []
  - method: GET
    path: /casting/submissions
    description: "List/filter submissions across breakdowns (FK reverse-reachability for Submission.talent_id, .agent_id, .duplicate_of_id)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?", "talent_id?", "agent_id?", "breakdown_id?", "duplicate_of_id?"]
    output: Submission[]
    side_effects: []
  - method: POST
    path: /casting/submissions/{id}/start-review
    description: "SUBMITTED -> UNDER_REVIEW"
    roles: [CastingAssociate]
    code: 200
    input: []
    output: Submission
    side_effects: ["reviewed_at := clock", "increments Submission.version by 1"]
  - method: POST
    path: /casting/submissions/{id}/shortlist
    description: "UNDER_REVIEW -> SHORTLISTED"
    roles: [CastingAssociate]
    code: 200
    input: []
    output: Submission
    side_effects: ["increments Submission.version by 1"]
  - method: POST
    path: /casting/submissions/{id}/reject
    description: "UNDER_REVIEW|SHORTLISTED -> REJECTED; releases ACTIVE holds"
    roles: [CastingAssociate]
    code: 200
    input: []
    output: Submission
    side_effects: ["ACTIVE AvailabilityHolds on this submission -> RELEASED", "increments Submission.version by 1"]
  - method: POST
    path: /casting/submissions/{id}/withdraw
    description: "Agent withdraws an active submission; releases ACTIVE holds; decrements submission_count"
    roles: [Agent, CastingAssociate]
    code: 200
    input: []
    output: Submission
    side_effects: ["ACTIVE AvailabilityHolds -> RELEASED", "Breakdown.submission_count recomputed", "increments Submission.version by 1 AND Breakdown.version by 1"]

  # --- Self tapes ---
  - method: POST
    path: /casting/submissions/{id}/self-tapes
    description: "Upload a self-tape for a submission"
    roles: [Agent, CastingAssociate]
    code: 201
    input: [media_url, duration_seconds]
    output: SelfTape
    side_effects: ["tape_index assigned in upload order"]
  - method: GET
    path: /casting/self-tapes/{id}
    description: "Fetch a self-tape"
    roles: [CastingDirector, CastingAssociate, Agent]
    code: 200
    input: []
    output: SelfTape
    side_effects: []
  - method: GET
    path: /casting/submissions/{id}/self-tapes
    description: "List self-tapes of a submission"
    roles: [CastingDirector, CastingAssociate, Agent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SelfTape[]
    side_effects: []
  - method: POST
    path: /casting/self-tapes/{id}/accept
    description: "RECEIVED -> ACCEPTED"
    roles: [CastingAssociate]
    code: 200
    input: []
    output: SelfTape
    side_effects: ["increments SelfTape.version by 1"]
  - method: POST
    path: /casting/self-tapes/{id}/reject
    description: "RECEIVED -> REJECTED"
    roles: [CastingAssociate]
    code: 200
    input: []
    output: SelfTape
    side_effects: ["increments SelfTape.version by 1"]

  # --- Sessions & appointments ---
  - method: POST
    path: /casting/breakdowns/{id}/sessions
    description: "Create an audition session for a breakdown"
    roles: [CastingAssociate]
    code: 201
    input: [session_start, session_end, capacity, location]
    output: AuditionSession
    side_effects: []
  - method: GET
    path: /casting/sessions/{id}
    description: "Fetch a session"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: AuditionSession
    side_effects: []
  - method: GET
    path: /casting/breakdowns/{id}/sessions
    description: "List sessions of a breakdown"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: AuditionSession[]
    side_effects: []
  - method: POST
    path: /casting/sessions/{id}/complete
    description: "IN_PROGRESS -> COMPLETED; unresolved CONFIRMED appointments become NO_SHOW"
    roles: [CastingAssociate]
    code: 200
    input: []
    output: AuditionSession
    side_effects: ["CONFIRMED appointments not individually completed -> NO_SHOW", "booked_count recomputed", "increments AuditionSession.version by 1"]
  - method: POST
    path: /casting/sessions/{id}/cancel
    description: "SCHEDULED -> CANCELLED; appointments cascade to CANCELLED; affected submissions revert to UNDER_REVIEW"
    roles: [CastingAssociate]
    code: 200
    input: []
    output: AuditionSession
    side_effects: ["PROPOSED/CONFIRMED appointments -> CANCELLED", "submissions with no remaining active appointments revert CALLBACK_INVITED -> UNDER_REVIEW", "increments AuditionSession.version by 1"]
  - method: POST
    path: /casting/sessions/{id}/appointments
    description: "Propose a callback appointment for a SHORTLISTED submission; transitions submission to CALLBACK_INVITED"
    roles: [CastingAssociate]
    code: 201
    input: [submission_id, slot_start, slot_end, "buffer_minutes?"]
    output: CallbackAppointment
    side_effects: ["Submission SHORTLISTED -> CALLBACK_INVITED", "increments Submission.version by 1"]
  - method: GET
    path: /casting/appointments/{id}
    description: "Fetch an appointment"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: CallbackAppointment
    side_effects: []
  - method: GET
    path: /casting/sessions/{id}/appointments
    description: "List appointments of a session"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CallbackAppointment[]
    side_effects: []
  - method: GET
    path: /casting/submissions/{id}/appointments
    description: "List appointments of a submission (FK reverse-reachability for CallbackAppointment.submission_id)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CallbackAppointment[]
    side_effects: []
  - method: POST
    path: /casting/appointments/{id}/confirm
    description: "PROPOSED -> CONFIRMED; enforces capacity and talent-overlap with buffer"
    roles: [Agent, CastingAssociate]
    code: 200
    input: []
    output: CallbackAppointment
    side_effects: ["AuditionSession.booked_count += 1", "increments CallbackAppointment.version by 1 AND AuditionSession.version by 1"]
  - method: POST
    path: /casting/appointments/{id}/decline
    description: "PROPOSED -> DECLINED"
    roles: [Agent, CastingAssociate]
    code: 200
    input: []
    output: CallbackAppointment
    side_effects: ["submission may revert CALLBACK_INVITED -> UNDER_REVIEW if no active appointments remain", "increments CallbackAppointment.version by 1"]
  - method: POST
    path: /casting/appointments/{id}/cancel
    description: "PROPOSED|CONFIRMED -> CANCELLED; recomputes booked_count"
    roles: [CastingAssociate]
    code: 200
    input: []
    output: CallbackAppointment
    side_effects: ["booked_count recomputed if was CONFIRMED", "submission may revert CALLBACK_INVITED -> UNDER_REVIEW", "increments CallbackAppointment.version by 1"]
  - method: POST
    path: /casting/appointments/{id}/complete
    description: "Mark appointment attended; drives submission CALLBACK_INVITED -> CALLBACK_COMPLETED"
    roles: [CastingAssociate]
    code: 200
    input: []
    output: CallbackAppointment
    side_effects: ["Submission CALLBACK_INVITED -> CALLBACK_COMPLETED", "booked_count -= 1 if appointment was CONFIRMED", "increments CallbackAppointment.version by 1 AND Submission.version by 1"]

  # --- Availability holds ---
  - method: POST
    path: /casting/submissions/{id}/holds
    description: "Place a PIN or AVAIL hold on a submission"
    roles: [CastingDirector, CastingAssociate]
    code: 201
    input: [talent_id, hold_kind, window_start, window_end, priority_rank, expires_at]
    output: AvailabilityHold
    side_effects: []
  - method: GET
    path: /casting/holds
    description: "List/filter holds (FK reverse-reachability for AvailabilityHold.talent_id)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?", "talent_id?", "submission_id?", "hold_kind?"]
    output: AvailabilityHold[]
    side_effects: []
  - method: GET
    path: /casting/holds/{id}
    description: "Fetch a hold"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: AvailabilityHold
    side_effects: []
  - method: GET
    path: /casting/submissions/{id}/holds
    description: "List holds of a submission"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: AvailabilityHold[]
    side_effects: []
  - method: POST
    path: /casting/holds/{id}/confirm
    description: "ACTIVE -> CONFIRMED if highest-priority among overlapping ACTIVE holds; losers go OUTBID"
    roles: [CastingDirector]
    code: 200
    input: []
    output: AvailabilityHold
    side_effects: ["overlapping ACTIVE holds of same talent -> OUTBID", "increments AvailabilityHold.version by 1"]
  - method: POST
    path: /casting/holds/{id}/release
    description: "ACTIVE -> RELEASED"
    roles: [CastingDirector, CastingAssociate]
    code: 200
    input: []
    output: AvailabilityHold
    side_effects: ["increments AvailabilityHold.version by 1"]

  # --- Offers & deal memos ---
  - method: POST
    path: /casting/submissions/{id}/offers
    description: "Extend an offer to a CALLBACK_COMPLETED submission; submission -> OFFER_PENDING"
    roles: [CastingDirector]
    code: 201
    input: [weekly_rate_cents, guarantee_cents, expires_at]
    output: Offer
    side_effects: ["Submission CALLBACK_COMPLETED -> OFFER_PENDING", "round_number := 1", "increments Submission.version by 1"]
  - method: GET
    path: /casting/offers
    description: "List/filter offers (FK reverse-reachability for Offer.parent_offer_id)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?", "submission_id?", "parent_offer_id?"]
    output: Offer[]
    side_effects: []
  - method: GET
    path: /casting/offers/{id}
    description: "Fetch an offer"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: GET
    path: /casting/submissions/{id}/offers
    description: "List offers of a submission (all rounds)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Offer[]
    side_effects: []
  - method: POST
    path: /casting/offers/{id}/counter
    description: "Counter the live offer; OCC-guarded on Offer.version; creates next round"
    roles: [CastingDirector, Agent]
    code: 201
    input: [weekly_rate_cents, guarantee_cents, expires_at, expected_offer_version]
    output: Offer
    side_effects: ["creates new Offer round (round_number+1, parent_offer_id)", "prior offer -> COUNTERED", "increments Offer.version by 1 on the countered row"]
  - method: POST
    path: /casting/offers/{id}/accept
    description: "Accept the live offer; creates DealMemo with frozen prorated fee. Actor must be the submission's agent (Agent with X-User-ID == submission.agent_id) OR, when the submission is a self-submission (agent_id null), a CastingDirector countersigning on the talent's behalf."
    roles: [Agent, CastingDirector]
    code: 200
    input: [engagement_start, engagement_end, proration_mode]
    output: DealMemo
    side_effects: ["Offer -> ACCEPTED", "creates DealMemo (EXECUTED) with computed_fee_cents per engagement_fee_proration", "increments Offer.version by 1"]
  - method: POST
    path: /casting/offers/{id}/decline
    description: "Agent declines the live offer; submission returns to CALLBACK_COMPLETED"
    roles: [Agent]
    code: 200
    input: []
    output: Offer
    side_effects: ["Offer -> DECLINED", "Submission OFFER_PENDING -> CALLBACK_COMPLETED", "increments Offer.version by 1 AND Submission.version by 1"]
  - method: POST
    path: /casting/offers/{id}/withdraw
    description: "Office withdraws the live offer; submission returns to CALLBACK_COMPLETED; CONFIRMED holds released"
    roles: [CastingDirector]
    code: 200
    input: []
    output: Offer
    side_effects: ["Offer -> WITHDRAWN", "Submission OFFER_PENDING -> CALLBACK_COMPLETED", "CONFIRMED AvailabilityHolds on submission -> RELEASED", "increments Offer.version by 1 AND Submission.version by 1"]
  - method: GET
    path: /casting/deal-memos/{id}
    description: "Fetch a deal memo"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: DealMemo
    side_effects: []
  - method: GET
    path: /casting/offers/{id}/deal-memos
    description: "Get the deal memo of an accepted offer (array of 0..1)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: []
    output: DealMemo[]
    side_effects: []
  - method: POST
    path: /casting/deal-memos/{id}/void
    description: "Void an EXECUTED memo with no CONFIRMED booking; PENDING bookings cancel with zero penalty"
    roles: [CastingDirector]
    code: 200
    input: []
    output: DealMemo
    side_effects: ["referencing PENDING Bookings -> CANCELLED (PRODUCTION_CANCELLED, penalty 0)", "increments DealMemo.version by 1"]

  # --- Minor permits & guardians ---
  - method: POST
    path: /casting/permits
    description: "Register a minor work permit"
    roles: [ProductionCoordinator]
    code: 201
    input: [talent_id, production_id, permit_number, issued_at, valid_until, "max_daily_hours_school_day?", "max_daily_hours_non_school_day?", guardian_user_id]
    output: MinorWorkPermit
    side_effects: []
  - method: GET
    path: /casting/permits
    description: "List/filter permits (FK reverse-reachability for MinorWorkPermit.production_id and .guardian_user_id)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Guardian]
    code: 200
    input: ["limit?", "offset?", "status?", "talent_id?", "production_id?", "guardian_user_id?"]
    output: MinorWorkPermit[]
    side_effects: []
  - method: GET
    path: /casting/permits/{id}
    description: "Fetch a permit"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Guardian]
    code: 200
    input: []
    output: MinorWorkPermit
    side_effects: []
  - method: GET
    path: /casting/talents/{id}/permits
    description: "List permits of a talent"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Guardian]
    code: 200
    input: ["limit?", "offset?", "status?", "production_id?"]
    output: MinorWorkPermit[]
    side_effects: []
  - method: POST
    path: /casting/permits/{id}/verify
    description: "PENDING_VERIFICATION -> VERIFIED"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: MinorWorkPermit
    side_effects: ["increments MinorWorkPermit.version by 1"]
  - method: POST
    path: /casting/permits/{id}/revoke
    description: "VERIFIED -> REVOKED; dependent bookings cancel with PERMIT_REVOKED and penalty computed for CONFIRMED ones"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: MinorWorkPermit
    side_effects: ["Bookings with work_permit_id == this permit and status IN {PENDING, CONFIRMED} -> CANCELLED (PERMIT_REVOKED); CONFIRMED ones compute cancellation_penalty_tier onto the DealMemo", "increments MinorWorkPermit.version by 1"]

  # --- Bookings ---
  - method: POST
    path: /casting/bookings
    description: "Create a PENDING booking from an ACCEPTED offer's deal memo"
    roles: [ProductionCoordinator]
    code: 201
    input: [submission_id, deal_memo_id, "work_permit_id?"]
    output: Booking
    side_effects: []
  - method: GET
    path: /casting/bookings/{id}
    description: "Fetch a booking"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent, Guardian]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: /casting/bookings
    description: "List bookings (filtered)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?", "submission_id?", "deal_memo_id?", "work_permit_id?"]
    output: Booking[]
    side_effects: []
  - method: GET
    path: /casting/submissions/{id}/bookings
    description: "List bookings of a submission (array of 0..N historical)"
    roles: [CastingDirector, CastingAssociate, ProductionCoordinator, Agent]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Booking[]
    side_effects: []
  - method: POST
    path: /casting/bookings/{id}/confirm
    description: "PENDING -> CONFIRMED; enforces permit validity, engagement overlap, minor hours; may auto-create TaftHartleyReport"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["confirmed_at := clock", "Talent.union_engagement_count_365d recomputed", "auto-create TaftHartleyReport when union_signatory + union-covered + NON_UNION", "increments Booking.version by 1"]
  - method: POST
    path: /casting/bookings/{id}/cancel
    description: "PENDING|CONFIRMED -> CANCELLED; computes penalty for CONFIRMED; waives PENDING Taft-Hartley; reopens role"
    roles: [ProductionCoordinator]
    code: 200
    input: [cancellation_reason]
    output: Booking
    side_effects: ["cancelled_at := clock", "DealMemo.cancellation_penalty_cents computed when was CONFIRMED", "PENDING TaftHartleyReport -> WAIVED", "Submission BOOKED -> NOT_BOOKED", "Role CAST -> OPEN", "Talent.union_engagement_count_365d recomputed", "increments Booking.version by 1 AND DealMemo.version by 1"]

  # --- Taft-Hartley ---
  - method: GET
    path: /casting/taft-hartley/{id}
    description: "Fetch a report"
    roles: [CastingDirector, ProductionCoordinator]
    code: 200
    input: []
    output: TaftHartleyReport
    side_effects: []
  - method: GET
    path: /casting/productions/{id}/taft-hartley
    description: "List reports of a production"
    roles: [CastingDirector, ProductionCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?", "talent_id?"]
    output: TaftHartleyReport[]
    side_effects: []
  - method: GET
    path: /casting/taft-hartley
    description: "List/filter Taft-Hartley reports across productions (FK reverse-reachability for TaftHartleyReport.talent_id and .booking_id)"
    roles: [CastingDirector, ProductionCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?", "talent_id?", "booking_id?", "production_id?"]
    output: TaftHartleyReport[]
    side_effects: []
  - method: POST
    path: /casting/taft-hartley/{id}/file
    description: "File a report (PENDING -> FILED on-time; LATE -> FILED late)"
    roles: [ProductionCoordinator]
    code: 200
    input: []
    output: TaftHartleyReport
    side_effects: ["filed_at := clock", "increments TaftHartleyReport.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,       http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED,          http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND,             http: 404, condition: "Path-templated resource does not exist" }
  - { id: ERR_REFERENCED_NOT_FOUND,  http: 404, condition: "Body-referenced FK id does not exist" }
  - { id: ERR_INVALID_STATE,         http: 409, condition: "State machine does not allow the transition from the current state (incl. terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION,         http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_PERMIT_REQUIRED,       http: 422, condition: "Minor role + minor talent but no VERIFIED permit covering the full engagement span" }
  - { id: ERR_MINOR_HOURS_EXCEEDED,  http: 422, condition: "An engagement day exceeds the permit's daily hour cap for that day type" }
  - { id: ERR_HOLD_TALENT_MISMATCH,  http: 422, condition: "AvailabilityHold.talent_id differs from Submission.talent_id" }
  - { id: ERR_SLOT_OUTSIDE_SESSION,  http: 422, condition: "slot_start/slot_end not inside the session window" }
  - { id: ERR_TALENT_CONFLICT,       http: 409, condition: "Confirm would overlap an existing CONFIRMED appointment of the same talent (buffer applied)" }
  - { id: ERR_SESSION_FULL,          http: 409, condition: "Session booked_count already == capacity at confirm time" }
  - { id: ERR_INVALID_WINDOW,        http: 422, condition: "Hold window_start >= window_end or expires_at <= window_start" }
  - { id: ERR_HOLD_OUTRANKED,        http: 409, condition: "A higher-priority overlapping ACTIVE hold blocks this confirm" }
  - { id: ERR_DEADLINE_PASSED,       http: 422, condition: "Submission attempted at/after breakdown.submission_deadline" }
  - { id: ERR_CHANNEL_FORBIDDEN,     http: 403, condition: "AGENT_ONLY breakdown rejects self-submissions and non-franchised/inactive agents" }
  - { id: ERR_DUPLICATE_SUBMISSION,  http: 201, condition: "Duplicate active submission persisted as auto-REJECTED with duplicate_of_id (not an error response)" }
  - { id: ERR_TAPE_TOO_LONG,         http: 422, condition: "SelfTape.duration_seconds outside (0, 600]" }
  - { id: ERR_INVALID_OFFER_TERMS,   http: 422, condition: "guarantee_cents out of bounds or not a multiple of 100" }
  - { id: ERR_NOT_LIVE_OFFER,        http: 409, condition: "Action targets a non-live offer (not the highest-round EXTENDED offer of the submission)" }
  - { id: ERR_OFFER_EXPIRED,         http: 422, condition: "Offer action attempted at/after offer.expires_at" }
  - { id: ERR_BOOKING_PRECONDITION,  http: 422, condition: "Booking creation lacks ACCEPTED offer / EXECUTED memo, or submission already has a non-cancelled booking" }
  - { id: ERR_ENGAGEMENT_OVERLAP,    http: 409, condition: "Another CONFIRMED booking for the same talent overlaps the engagement window" }
  - { id: ERR_FILING_WINDOW,         http: 422, condition: "Taft-Hartley filing attempted in an impermissible state/window" }
  - { id: ERR_ROLE_UNFILLED,         http: 422, condition: "Production lock attempted while an OPEN role lacks a CONFIRMED booking" }
  - { id: ERR_INVALID_REQUEST,       http: 400, condition: "Required field missing or value out of domain (bad enum, wrap before start, etc.)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CastingDirector
    description: "Head of the casting office; owns productions, breakdowns, offers (office side), deal memos, holds confirm"
    identity: opaque
    exclusive_operations:
      - "create/open-casting/lock/complete productions"
      - "create/release/widen/close/cancel breakdowns"
      - "register agents"
      - "create offers, counter offers (office side), withdraw offers"
      - "confirm availability holds"
      - "void deal memos"
    shared_operations:
      - "read any resource"
      - "place availability holds"
      - "set logical clock"
  - name: CastingAssociate
    description: "Office staff; runs review, shortlisting, sessions, appointments, self-tape triage"
    identity: opaque
    exclusive_operations:
      - "start-review / shortlist / reject submissions"
      - "create/complete/cancel audition sessions"
      - "propose / complete / cancel appointments"
      - "accept / reject self-tapes"
    shared_operations:
      - "read any resource"
      - "place availability holds, release holds"
      - "create submissions on behalf of unrepresented talent (self-submit path)"
      - "withdraw submissions (self-submission path)"
      - "confirm/decline appointments (self-submission path)"
  - name: Agent
    description: "Talent agent; submits represented talent, confirms callbacks, negotiates offers"
    identity: "entity_backed:AgentProfile"
    exclusive_operations:
      - "submit talent to breakdowns (as representing agent)"
      - "withdraw own submissions"
      - "confirm / decline own appointments"
      - "counter offers (talent side)"
      - "accept / decline offers"
    shared_operations:
      - "read breakdowns, sessions, offers, appointments, deal memos for own talent"
      - "register own talent"
      - "upload self-tapes"
  - name: ProductionCoordinator
    description: "Production-side coordinator; manages permits, bookings, Taft-Hartley filings"
    identity: opaque
    exclusive_operations:
      - "register guardians and minor work permits"
      - "verify / revoke permits"
      - "create / confirm / cancel bookings"
      - "file Taft-Hartley reports"
    shared_operations:
      - "read any resource"
      - "set logical clock"
  - name: Guardian
    description: "Parent/guardian of a minor; read-only visibility into their dependent's permits and bookings"
    identity: "entity_backed:Guardian"
    exclusive_operations: []
    shared_operations:
      - "read permits and bookings linked to their minor"
      - "read productions and talents"
