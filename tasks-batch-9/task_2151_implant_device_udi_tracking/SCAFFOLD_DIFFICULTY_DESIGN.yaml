  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: lot_expiry_end_of_day_instant_boundary_on_ops_run
        grounds:
          - calculations.ops_run_checkpoint
          - entities.Lot.fields.expiration_date
          - state_machines.Lot.AVAILABLE_to_EXPIRED
        distinguishing_aspect: |
          The metric is a TEMPORAL INSTANT reached through POST /udi/ops-runs:
          the expiry instant of expiration_date 2026-09-30 is exactly
          2026-09-30T23:59:59.999Z and the comparison is `<=`. A sweep at
          ...:59.998Z must expire nothing; a sweep one millisecond later must
          expire the lot and its unit.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One catalog item, one released lot L-8801 with expiration_date 2026-09-30 holding one AVAILABLE owned unit SN-0001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678967", description: "Bioabsorbable Anchor", category: "STANDARD_IMPLANT", list_charge_cents: 120000, charge_code: "CDM-77200", shelf_life_days: 400, registry_required: false }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-8801", expiration_date: "2026-09-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-0001", acquisition_cost_cents: 90000, expected_lot_version: "${lot_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T23:59:59.998Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/ops-runs"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
              captures: { run1_units: "$.data.expired_unit_count", run1_lots: "$.data.expired_lot_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T23:59:59.999Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/ops-runs"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
              captures: { run2_units: "$.data.expired_unit_count", run2_lots: "$.data.expired_lot_count" }
          assert:
            - "First ops-run response expired_lot_count == 0 and expired_unit_count == 0"
            - "First ops-run response rotation_alert_count == 1 (the lot expires inside the 45-day rotation window)"
            - "Second ops-run response expired_lot_count == 1 and expired_unit_count == 1"
            - "Second ops-run response ops_run_index == 2"
            - "Lot.${lot_id}.status == EXPIRED"
            - "DeviceUnit.${u1_id}.custody_state == EXPIRED"
            - "DeviceUnit.${u1_id}.expired_at_utc == 2026-09-30T23:59:59.999Z"

      - name: field_action_publish_with_empty_implanted_cohort_closes_from_published
        grounds:
          - calculations.recall_exposure_cohort
          - state_machines.FieldAction.PUBLISHED_to_CLOSED
          - entities.FieldAction.fields.implanted_cohort_size
          - entities.FieldAction.fields.notification_open_count
          - state_machines.DeviceUnit.custody_state.RECALL_HOLD_to_RETURNED_TO_VENDOR
        distinguishing_aspect: |
          A different metric and a different endpoint from
          lot_expiry_end_of_day_instant_boundary_on_ops_run: here the boundary is
          an EMPTY COLLECTION reached through POST /udi/field-actions/{id}/publish.
          With zero implanted units the cohort is size 0, zero RecallNotifications
          are created, notification_open_count stays 0 and the action may go
          straight from PUBLISHED to CLOSED without ever entering IN_REMEDIATION.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One catalog item, one released lot with a single AVAILABLE owned unit that has never been implanted."
            - "A DRAFT CLASS_III field action scoped to the whole catalog."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
