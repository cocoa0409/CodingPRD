# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Vehicle Service Contract & F&I Product Admin
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_coverage_plan_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.CoveragePlan, endpoints]
        distinguishing_aspect: "POST /coverage-plans with all required fields returns 201, status DRAFT, version 1, and server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
          assert:
            - "CoveragePlan.${plan_id}.status == DRAFT"
            - "CoveragePlan.${plan_id}.version == 1"

      - name: get_contract_not_found_returns_404
        claim_type: "Not Found"
        grounds:
          - "entities.Contract"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /contracts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_contract_missing_required_field_returns_invalid_request
        claim_type: "Required Fields"
        grounds:
          - "entities.Contract"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /contracts omitting vin returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["ACTIVE plan + OPEN pool exist."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool X" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
          trigger:
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_contract_default_financed_false
        claim_type: Defaults
        grounds: [entities.Contract.fields.financed]
        distinguishing_aspect: "Omitting financed defaults to false on the created contract."
        test_recipe:
          setup: ["ACTIVE plan + OPEN pool exist."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool DF" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
          trigger:
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINDF00001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
          assert:
            - "Contract.${contract_id}.financed == false"
            - "Contract.${contract_id}.status == PENDING"

      - name: contract_fk_not_found_on_bad_plan_id
        claim_type: "Parent Relationships"
        grounds:
          - "entities.Contract.fields.coverage_plan_id"
          - "errors[ERR_FK_NOT_FOUND]"
        distinguishing_aspect: "POST /contracts with a coverage_plan_id that resolves to nothing returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["OPEN pool exists; no plan with the given id."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool FK" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { coverage_plan_id: "00000000-0000-4000-8000-000000000001", reinsurance_pool_id: "${pool_id}", vin: "VINFK00001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FK_NOT_FOUND"

      - name: ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry has common_fields:false — entries are append-only, exposed only via GET /reinsurance-pools/{id}/ledger-entries, with no update endpoint and no version field."
        test_recipe:
          setup: ["A pool with at least one RESERVE_SET entry from a started-review claim."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool LE" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINLE00001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "engine" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "PART", part_number: "EN-3", requested_amount_cents: 50000, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "GET /reinsurance-pools/${pool_id}/ledger-entries"
              payload: {}
              as: Auditor
          assert:
            - "GET /reinsurance-pools/{id}/ledger-entries returns an array including one RESERVE_SET entry with amount_cents == 50000"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_claim_from_submitted_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Claim.transitions.UNDER_REVIEW_to_APPROVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling approve on a SUBMITTED (not UNDER_REVIEW) claim returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["Claim filed but start-review not yet called (still SUBMITTED)."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool SM1" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINSM100001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "engine" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: contract_initial_state_pending
        claim_type: initial_state
        grounds: [state_machines.Contract, entities.Contract.fields.status]
        distinguishing_aspect: "A newly created contract starts in status PENDING (initial_state)."
        test_recipe:
          setup: ["ACTIVE plan + OPEN pool."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool IS" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
          trigger:
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINIS00001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
          assert:
            - "Contract.${contract_id}.status == PENDING"

      - name: retire_plan_in_use_rejected
        claim_type: guarded_transition
        grounds:
          - "state_machines.CoveragePlan.transitions.ACTIVE_to_RETIRED"
          - "errors[ERR_PLAN_IN_USE]"
        distinguishing_aspect: "Retiring an ACTIVE plan still referenced by an ACTIVE contract returns ERR_PLAN_IN_USE (cross-entity guard)."
        test_recipe:
          setup: ["ACTIVE plan with one ACTIVE contract referencing it."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool PIU" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINPIU0001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /coverage-plans/${plan_id}/retire"
              payload: {}
              as: AdminUnderwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PLAN_IN_USE"

      - name: lapse_blocked_by_open_claim
        claim_type: guarded_transition
        grounds:
          - "state_machines.Contract.transitions.ACTIVE_to_LAPSED"
          - "errors[ERR_OPEN_CLAIM_BLOCKS]"
        distinguishing_aspect: "Lapsing a contract with a claim in UNDER_REVIEW returns ERR_OPEN_CLAIM_BLOCKS."
        test_recipe:
          setup: ["ACTIVE contract with a claim in UNDER_REVIEW (started but not resolved)."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool OCB" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINOCB0001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "engine" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "PART", part_number: "EN-4", requested_amount_cents: 50000, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /contracts/${contract_id}/lapse"
              payload: {}
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OPEN_CLAIM_BLOCKS"

      - name: deny_claim_releases_reserve
        claim_type: side_effect
        grounds: [state_machines.Claim.transitions.UNDER_REVIEW_to_DENIED, calculations.pool_surplus, entities.ReinsurancePool.fields.reserve_held_cents]
        distinguishing_aspect: "Denying an UNDER_REVIEW claim posts RESERVE_RELEASE; pool.reserve_held_cents returns to 0 and claim.reserve_cents becomes 0."
        test_recipe:
          setup: ["Claim UNDER_REVIEW with reserve 50000 held."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool DEN" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /repair-facilities"
              payload: { name: "Shop", posted_labor_rate_cents_per_hour: 9500, direct_pay_enrolled: true }
              as: AdminUnderwriter
              captures: { fac_id: $.data.id }
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINDEN0001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "engine" }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/lines"
              payload: { line_type: "PART", part_number: "EN-5", requested_amount_cents: 50000, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim_id}/deny"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /reinsurance-pools/${pool_id}"
              payload: {}
              as: AdminUnderwriter
              captures: { rh: $.data.reserve_held_cents }
          assert:
            - "ReinsurancePool.${pool_id}.reserve_held_cents == 0 after deny"
            - "Claim.${claim_id}.adjudication_status == DENIED"

      - name: cancellation_reject_clears_link
        claim_type: side_effect
        grounds: [state_machines.Cancellation.transitions.REQUESTED_to_REJECTED, entities.Contract.fields.cancellation_id]
        distinguishing_aspect: "Rejecting a REQUESTED cancellation clears Contract.cancellation_id back to null; contract stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE contract with a REQUESTED cancellation."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool REJ" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINREJ0001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /cancellations"
              payload: { contract_id: "${contract_id}", reason: "CUSTOMER_REQUEST", request_date: "2026-03-01T00:00:00Z" }
              as: ContractAdmin
              captures: { canc_id: $.data.id }
          trigger:
            - call: "POST /cancellations/${canc_id}/reject"
              payload: {}
              as: ContractAdmin
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractAdmin
              captures: { cid: $.data.cancellation_id, st: $.data.status }
          assert:
            - "Contract.${contract_id}.cancellation_id == null after reject"
            - "Contract.${contract_id}.status == ACTIVE"

      - name: terminal_refunded_cancellation_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Cancellation.transitions.APPROVED_to_REFUNDED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A REFUNDED cancellation cannot be refunded again; second refund returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cancellation REFUNDED (free-look full refund completed)."]
          setup_api_calls:
            - call: "POST /reinsurance-pools"
              payload: { name: "Pool TRM" }
              as: AdminUnderwriter
              captures: { pool_id: $.data.id }
            - call: "POST /coverage-plans"
              payload: { name: "Gold", tier: "ENHANCED", term_months: 60, term_miles: 100000, max_vehicle_age_years: 8, max_odometer_at_sale: 80000, base_premium_cents: 200000, deductible_cents: 10000, labor_rate_cap_cents_per_hour: 12000, reinsurance_cession_pct: 0.5 }
              as: AdminUnderwriter
              captures: { plan_id: $.data.id }
            - call: "POST /coverage-plans/${plan_id}/activate"
              payload: {}
              as: AdminUnderwriter
            - call: "POST /contracts"
              payload: { coverage_plan_id: "${plan_id}", reinsurance_pool_id: "${pool_id}", vin: "VINTRM0001", vehicle_model_year: 2024, odometer_at_sale: 20000, sale_date: "2026-01-01T00:00:00Z", sale_price_cents: 240000 }
              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /cancellations"
              payload: { contract_id: "${contract_id}", reason: "CUSTOMER_REQUEST", request_date: "2026-01-20T00:00:00Z" }
              as: ContractAdmin
              captures: { canc_id: $.data.id }
            - call: "POST /cancellations/${canc_id}/approve"
              payload: {}
              as: ContractAdmin
            - call: "POST /cancellations/${canc_id}/refund"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /cancellations/${canc_id}/refund"
              payload: {}
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: deductible_floored_when_covered_below_deductible
        claim_type: "Constants Applied"
        grounds: [calculations.claim_payout, entities.RepairAuthorization.fields.deductible_applied_cents]
        distinguishing_aspect: "When covered_repair (3000) is less than deductible (10000), deductible_applied is min(covered, deductible)=3000 and net repair floors at 0."
        test_recipe:
