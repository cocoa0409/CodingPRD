  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_cancel_blocked_by_locked_payperiod
        grounds:
          - state_machines.Assignment.SCHEDULED_to_CANCELLED
          - state_machines.PayPeriod.OPEN_to_LOCKED
          - validations[priority=7]
          - errors[ERR_PAY_PERIOD_LOCKED]
        distinguishing_aspect: |
          Entity pair Assignment->PayPeriod: an Assignment's CANCELLED transition is
          rejected when its PayPeriod is LOCKED, even though the Assignment itself is
          in a cancellable state. (The assignment is first driven terminal so the
          period can lock, then a cancel of a still-terminal sibling proves the gate.)
        test_recipe:
          setup:
            - "Location L; worker W; PayPeriod PP 2026-06-01..2026-06-08"
            - "One COMPLETED assignment in PP; PP locked"
            - "A SECOND pay-period covers a later week with a SCHEDULED assignment we will NOT touch"
            - "We attempt to cancel an assignment whose pay_period_id is the LOCKED PP"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
            - call: "POST /locations"
              payload: { name: "L", time_zone: "UTC", overtime_cost_guardrail_cents: 100000000, predictability_pay_enabled: false, advance_notice_days: 1 }
