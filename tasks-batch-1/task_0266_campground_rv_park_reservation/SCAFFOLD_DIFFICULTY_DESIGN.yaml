  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_half_open_overlap_on_site
        grounds:
          - validations[priority=11]
          - errors[ERR_DATE_OVERLAP]
          - entities.Reservation.fields.check_in_date
          - entities.Reservation.fields.check_out_date
        distinguishing_aspect: |
          Resource = Site; interval semantics = half-open [check_in, check_out) where
          back-to-back (check_out == next check_in) is ALLOWED but any interior
          overlap is rejected. R1 occupies 08-01..08-05; R2 08-04..08-09 overlaps and
          is rejected ERR_DATE_OVERLAP, while a back-to-back R3 08-05..08-09 succeeds.
        test_recipe:
          setup:
            - "RV Site S with a live reservation R1 occupying 2026-08-01..2026-08-05."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
