      - name: board_vote_below_the_merger_ratio_records_a_rejected_approval
        claim_type: correct_result
        grounds:
          - calculations.board_vote_outcome
          - endpoints.POST_/board-approvals
          - entities.BoardApproval.fields.decision
        distinguishing_aspect: |
          A tally of 9 for and 6 against is a clear majority and would pass a simple-
          majority vote, but a MERGER needs 0.6667 and 9/15 is exactly 0.6000, so the
          decision must be REJECTED and the row must be created in status REJECTED
          rather than RECORDED. The create still succeeds - a rejected vote is a
          recorded fiduciary fact, not a 422 - and it still drives the deal from
          STRUCTURE_SELECTED to BOARD_APPROVAL while allocating no seats at all.
