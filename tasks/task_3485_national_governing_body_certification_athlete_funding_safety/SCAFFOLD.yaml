scenario: "National Governing Body Certification, Athlete Funding & Safety Compliance (United States Olympic and Paralympic Committee): sport governing body certification with governance, athlete representation and financial standards subject to periodic review, complaint and decertification processes when a governing body fails standards with interim management, athlete funding through direct stipends, training center access and health insurance eligibility tied to performance criteria, team selection procedures published in advance with athlete appeal rights through arbitration, safe sport compliance requiring background screening, training and reporting of abuse allegations to an independent body, team trials, qualification standards and roster nomination with quota constraints from international federations, training center operations and sport science support allocation, commercial rights administration between the committee, governing bodies and athletes"

domain_name: "usopc-ngb-certification"
api_prefix: "/api"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
  entity_topology: hybrid          # GB-rooted tree + cross-aggregate links (Appeal -> Roster + Athlete; CommercialDeal -> Athlete with GB derived)
  state_machine_shape: parallel    # Athlete, FundingAgreement, SelectionProcedure carry parallel state dimensions; cyclic loops on GoverningBody and Roster
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
# All entities carry common_fields: true => id (server-minted UUID, identity
# only, never used for ranking/tie-break), created_at, updated_at (ISO8601 UTC
# 3 fractional digits), version (integer from 1, +1 per mutation incl. cascades).
entities:
  - name: GoverningBody
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the national governing body" }
      - { name: sport_code, type: string, source: input, description: "Sport discriminator, e.g. SWIM, GYMN, ROWI" }
      - { name: status, type: enum, source: system, default: APPLIED, constraints: "APPLIED | CERTIFIED | PROBATION | INTERIM_MANAGED | DECERTIFIED", description: "Certification lifecycle state; DECERTIFIED is terminal" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp when status first became CERTIFIED; null until then" }
      - { name: interim_manager_id, type: string, source: system, description: "Opaque committee user id appointed to run the body while INTERIM_MANAGED; null otherwise" }
      - { name: funding_budget_cents, type: integer, source: input, description: "Annual stipend budget; committed monthly stipends x12 must not exceed this at activation" }
      - { name: sport_science_pool_hours, type: integer, source: input, description: "Annual sport-science support hour pool allocated by waterfall over ACTIVE funding agreements" }
      - { name: committed_monthly_stipend_cents, type: integer, source: computed, default: 0, description: "Sum of monthly_stipend_cents over this body's athletes' ACTIVE FundingAgreements" }
      - { name: allocated_science_hours, type: integer, source: computed, default: 0, description: "Sum of science_hours_allocated over this body's athletes' ACTIVE FundingAgreements (<= sport_science_pool_hours)" }
      - { name: substantiated_complaint_count, type: integer, source: computed, default: 0, description: "Count of Complaints with status SUBSTANTIATED resolved within trailing 365 days from current logical clock" }
      - { name: complaint_posture, type: enum, source: computed, default: NORMAL, constraints: "NORMAL | ELEVATED", description: "ELEVATED when substantiated_complaint_count >= COMPLAINT_POSTURE_THRESHOLD (3)" }

  - name: CertificationCycle
    parent: GoverningBody
    common_fields: true
    fields:
      - { name: governing_body_id, type: string, source: input, description: "FK -> GoverningBody.id; cycle under review" }
      - { name: window_start, type: datetime, source: input, description: "Review window start (half-open interval start)" }
      - { name: window_end, type: datetime, source: input, description: "Review window end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, constraints: "SCHEDULED | OPEN | FINDINGS_ISSUED | REMEDIATION | CLOSED_PASSED | CLOSED_FAILED", description: "Cycle lifecycle; CLOSED_* are terminal" }
      - { name: governance_score, type: number, source: input, description: "Governance standard component 0-100, supplied at FINDINGS_ISSUED" }
      - { name: athlete_rep_score, type: number, source: input, description: "Athlete representation component 0-100, supplied at FINDINGS_ISSUED" }
      - { name: financial_score, type: number, source: input, description: "Financial standard component 0-100, supplied at FINDINGS_ISSUED" }
      - { name: provisional_score, type: number, source: computed, description: "Weighted score at issue-findings: 0.40*governance + 0.35*athlete_rep + 0.25*financial, 2dp half-up" }
      - { name: final_score, type: number, source: computed, description: "Weighted score at close after remediation bonus; equals provisional_score when no remediation applied" }
      - { name: remediation_applied, type: boolean, source: system, default: false, description: "True when REMEDIATION path added the bonus before close" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp of OPEN transition" }
      - { name: issued_by_user_id, type: string, source: system, description: "Opaque auditor id that issued findings" }
      - { name: closed_by_user_id, type: string, source: system, description: "Opaque auditor id that closed the cycle; must differ from issued_by_user_id" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of close" }

  - name: Complaint
    parent: GoverningBody
    common_fields: true
    fields:
      - { name: governing_body_id, type: string, source: input, description: "FK -> GoverningBody.id; body the complaint is filed against" }
      - { name: category, type: enum, source: input, constraints: "GOVERNANCE | ATHLETE_REPRESENTATION | FINANCIAL | SAFE_SPORT | SELECTION", description: "Complaint category" }
      - { name: severity, type: enum, source: input, constraints: "CRITICAL | MAJOR | MINOR", description: "Severity; CRITICAL substantiation forces INTERIM_MANAGED cascade" }
      - { name: description, type: string, source: input, description: "Free-text allegation summary" }
      - { name: status, type: enum, source: system, default: FILED, constraints: "FILED | TRIAGED | INVESTIGATING | SUBSTANTIATED | DISMISSED", description: "Complaint lifecycle; SUBSTANTIATED and DISMISSED are terminal" }
      - { name: triaged_by_user_id, type: string, source: system, description: "Opaque auditor id that triaged the complaint" }
      - { name: resolved_by_user_id, type: string, source: system, description: "Opaque auditor id that resolved the complaint; must differ from triaged_by_user_id" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp of resolution; feeds the trailing-365-day posture count" }

  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - { name: governing_body_id, type: string, source: input, description: "FK -> GoverningBody.id; body the athlete is registered with" }
      - { name: full_name, type: string, source: input, description: "Athlete legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO8601 date YYYY-MM-DD" }
      - { name: team_sport, type: boolean, source: input, default: false, description: "True for team-sport athletes" }
      - { name: eligibility_status, type: enum, source: system, default: REGISTERED, constraints: "REGISTERED | ELIGIBLE | SUSPENDED | RETIRED", description: "Parallel dimension 1: eligibility; RETIRED is terminal" }
      - { name: screening_status, type: enum, source: system, default: SCREENING_PENDING, constraints: "SCREENING_PENDING | SCREENING_CLEARED | SCREENING_FLAGGED | SCREENING_EXPIRED", description: "Parallel dimension 2: background screening state" }
      - { name: screening_expires_at, type: datetime, source: system, description: "Set to clearance time + SCREENING_VALIDITY_DAYS (730) when screening clears; null until then" }
      - { name: training_completed_at, type: datetime, source: system, description: "Logical-clock timestamp of last safe-sport training completion; valid for TRAINING_VALIDITY_DAYS (365); null until first completion" }

  - name: PerformanceResult
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; result owner (submitter)" }
      - { name: event_name, type: string, source: input, description: "Competition name" }
      - { name: event_grade, type: enum, source: input, constraints: "A | B | C", description: "Event grade multiplier: A=1.5, B=1.25, C=1.0" }
      - { name: placing, type: integer, source: input, constraints: "1..8", description: "Final placing; maps to PLACING_POINTS table" }
      - { name: event_date, type: datetime, source: input, description: "Date of the result; feeds window/recency logic" }
      - { name: base_points, type: number, source: computed, description: "PLACING_POINTS[placing] * EVENT_MULTIPLIER[event_grade], computed at verification" }
      - { name: status, type: enum, source: system, default: SUBMITTED, constraints: "SUBMITTED | VERIFIED | REJECTED", description: "Verification lifecycle; REJECTED may be resubmitted to SUBMITTED" }
      - { name: verified_by_user_id, type: string, source: system, description: "Opaque ResultsOfficial id; must differ from the submitting athlete id" }

  - name: FundingAgreement
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; funded athlete" }
      - { name: coverage_start, type: datetime, source: input, description: "Coverage window start (half-open)" }
      - { name: coverage_end, type: datetime, source: input, description: "Coverage window end (exclusive); must be > coverage_start" }
      - { name: points_method, type: enum, source: input, constraints: "TRAILING_365 | CALENDAR_SEASON", description: "Points window method bound at creation; the two methods are sanctioned dual variants" }
      - { name: trailing_points, type: number, source: computed, default: 0, description: "Points by TRAILING_365 method over VERIFIED results, recomputed on verify/reassess" }
      - { name: season_points, type: number, source: computed, default: 0, description: "Points by CALENDAR_SEASON method over VERIFIED results, recomputed on verify/reassess" }
      - { name: tier, type: enum, source: system, constraints: "TIER_A | TIER_B | TIER_C | NONE", description: "Funding tier from the agreement's points_method value; NONE when below TIER_C_MIN_POINTS (30)" }
      - { name: monthly_stipend_cents, type: integer, source: computed, default: 0, description: "TIER_A 300000 | TIER_B 200000 | TIER_C 100000 | NONE 0" }
      - { name: status, type: enum, source: system, default: OFFERED, constraints: "OFFERED | ACTIVE | SUSPENDED | TERMINATED", description: "Parallel dimension 1: agreement lifecycle; TERMINATED is terminal" }
      - { name: insurance_status, type: enum, source: system, default: INS_NONE, constraints: "INS_NONE | INS_ENROLLED | INS_LAPSED", description: "Parallel dimension 2: health-insurance enrollment tied to performance criteria" }
      - { name: insurance_enrolled_at, type: datetime, source: system, description: "Logical-clock timestamp of enrollment; null until enrolled" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of ACTIVE entry; insurance wait measured from here" }
      - { name: science_hours_allocated, type: integer, source: computed, default: 0, description: "Sport-science hours allocated to this agreement by the governing body's waterfall" }

  - name: AbuseReport
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; subject athlete the allegation concerns" }
      - { name: reporter_role, type: enum, source: input, constraints: "ATHLETE | NGB_STAFF | PUBLIC", description: "Role of the person reporting" }
      - { name: allegation, type: string, source: input, description: "Free-text abuse allegation summary" }
      - { name: status, type: enum, source: system, default: REPORTED, constraints: "REPORTED | FORWARDED | ADJUDICATED_SUBSTANTIATED | ADJUDICATED_UNSUBSTANTIATED", description: "Independent-body lifecycle; ADJUDICATED_* are terminal" }
      - { name: forwarded_at, type: datetime, source: system, description: "Logical-clock timestamp of forwarding to the independent body" }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical-clock timestamp of adjudication" }

  - name: SelectionProcedure
    parent: GoverningBody
    common_fields: true
    fields:
      - { name: governing_body_id, type: string, source: input, description: "FK -> GoverningBody.id; body running the selection" }
      - { name: games_name, type: string, source: input, description: "Target games, e.g. '2028 Summer Olympics'" }
      - { name: trials_start, type: datetime, source: input, description: "Trials window start" }
      - { name: trials_end, type: datetime, source: input, description: "Trials window end; must be > trials_start" }
      - { name: registration_deadline, type: datetime, source: input, description: "Entries close at this time; must be >= REGISTRATION_CLOSE_BEFORE_TRIALS_DAYS (14) before trials_start" }
      - { name: qualifying_score, type: number, source: input, description: "Minimum trials score to become QUALIFIED (>= qualifies)" }
      - { name: quota_slots, type: integer, source: input, description: "Primary roster slots granted by the international federation" }
      - { name: proc_status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | PUBLISHED | LOCKED | SUPERSEDED | COMPLETED", description: "Parallel dimension 1: procedure lifecycle; SUPERSEDED and COMPLETED are terminal" }
      - { name: trials_status, type: enum, source: system, default: TRIALS_NOT_OPEN, constraints: "TRIALS_NOT_OPEN | REGISTRATION_OPEN | HELD | RESULTS_FINALIZED", description: "Parallel dimension 2: embedded trials lifecycle" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock publish timestamp; publish requires trials_start - now >= MIN_PUBLISH_LEAD_DAYS (90)" }
      - { name: locked_at, type: datetime, source: system, description: "Logical-clock lock timestamp; after lock the procedure is version-pinned and immutable except trials dimension transitions" }
      - { name: entries, type: array, source: system, default: [], description: "Embedded trials entries: [{athlete_id, entry_status: REGISTERED|QUALIFIED|UNQUALIFIED, score: number|null, result_recorded_at: datetime|null}]" }

  - name: Roster
    parent: SelectionProcedure
    common_fields: true
    fields:
      - { name: selection_procedure_id, type: string, source: input, description: "FK -> SelectionProcedure.id; procedure this roster nominates from" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | NOMINATED | SUBMITTED | CONFIRMED | CANCELLED", description: "Roster lifecycle; CONFIRMED and CANCELLED are terminal; appeal UPHELD reverts NOMINATED -> DRAFT" }
      - { name: quota_effective, type: integer, source: computed, description: "quota_slots + QUOTA_BONUS_SLOTS(1) when the quota bonus fires, else quota_slots" }
      - { name: bonus_slot_applied, type: boolean, source: computed, default: false, description: "True when the top-3 season-points sum met QUOTA_BONUS_THRESHOLD (250) at nomination" }
      - { name: slots, type: array, source: system, default: [], description: "Embedded slots: [{athlete_id, slot_type: PRIMARY|ALTERNATE, slot_status: NOMINATED|ACCEPTED|DECLINED|PROMOTED|REMOVED, rank: integer, composite_score: number, trials_score: number, season_points: number}]" }
      - { name: declined_athlete_ids, type: array, source: system, default: [], description: "Athlete ids that DECLINED a slot on this roster; excluded from every future nomination run; preserved (not cleared) when an appeal UPHELD reverts the roster to DRAFT" }
      - { name: nominated_at, type: datetime, source: system, description: "Logical-clock timestamp of the FIRST nomination run only; the 72h appeal window anchors here and selector re-runs do not refresh it" }
      - { name: submitted_by_user_id, type: string, source: system, description: "User id that submitted the roster (NGBAdmin body id or committee/interim id)" }

  - name: Appeal
    parent: Roster
    common_fields: true
    fields:
      - { name: roster_id, type: string, source: input, description: "FK -> Roster.id; roster under appeal" }
      - { name: filed_by_athlete_id, type: string, source: system, description: "FK -> Athlete.id; filer, taken from X-User-ID (must be an Athlete with an entry on the procedure)" }
      - { name: grounds, type: enum, source: input, constraints: "SELECTION_PROCESS | ELIGIBILITY | SCORING_ERROR", description: "Appeal grounds" }
      - { name: status, type: enum, source: system, default: FILED, constraints: "FILED | HEARING | UPHELD | DENIED | WITHDRAWN", description: "Arbitration lifecycle; UPHELD, DENIED, WITHDRAWN are terminal" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock filing timestamp; must be <= roster.nominated_at + APPEAL_WINDOW_HOURS (72)" }
      - { name: decision_rationale, type: string, source: input, description: "Arbitrator rationale supplied at UPHELD/DENIED" }

  - name: CommercialDeal
    parent: Athlete
    common_fields: true
    fields:
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id; athlete whose image rights are licensed; governing body is derived via athlete.governing_body_id" }
      - { name: sponsor_name, type: string, source: input, description: "Sponsor legal name" }
      - { name: gross_value_cents, type: integer, source: input, description: "Gross deal value in cents" }
      - { name: basis, type: enum, source: input, constraints: "GROSS_BASIS | NET_BASIS", description: "Revenue-split basis; the two bases are sanctioned dual variants" }
      - { name: exclusivity_start, type: datetime, source: input, description: "Image-rights exclusivity start (closed interval)" }
      - { name: exclusivity_end, type: datetime, source: input, description: "Exclusivity end (inclusive); must be >= exclusivity_start" }
      - { name: status, type: enum, source: system, default: PROPOSED, constraints: "PROPOSED | CONSENT_GRANTED | ACTIVE | EXPIRED | TERMINATED", description: "Deal lifecycle; EXPIRED and TERMINATED are terminal" }
      - { name: committee_share_cents, type: integer, source: computed, description: "Committee share computed at activation with pinned rounding order" }
      - { name: ngb_share_cents, type: integer, source: computed, description: "Governing-body share computed at activation" }
      - { name: athlete_share_cents, type: integer, source: computed, description: "Athlete share = remainder after committee+ngb shares (absorbs rounding)" }
      - { name: consented_at, type: datetime, source: system, description: "Logical-clock timestamp of athlete consent" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of activation" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GoverningBody
    initial_state: APPLIED
    terminal_states: [DECERTIFIED]
    transitions:
      - from: APPLIED
        to: CERTIFIED
        trigger: "cascade: CertificationCycle CLOSED_PASSED while body is APPLIED"
        actor: system
        preconditions: ["a CertificationCycle of this body reaches CLOSED_PASSED"]
        side_effects:
          - "GoverningBody.certified_at := current logical clock"
          - "increments GoverningBody.version by 1"
      - from: CERTIFIED
        to: PROBATION
        trigger: "cascade: substantiated_complaint_count reaches COMPLAINT_POSTURE_THRESHOLD (3), or CertificationCycle CLOSED_FAILED while CERTIFIED"
        actor: system
        preconditions: ["complaint posture threshold crossed or a cycle closed failed"]
        side_effects: ["increments GoverningBody.version by 1"]
      - from: PROBATION
        to: CERTIFIED
        trigger: "cascade: a later CertificationCycle reaches CLOSED_PASSED while PROBATION"
        actor: system
        preconditions: ["a CertificationCycle of this body reaches CLOSED_PASSED"]
        side_effects: ["increments GoverningBody.version by 1"]
      - from: CERTIFIED
        to: INTERIM_MANAGED
        trigger: "cascade: a CRITICAL Complaint is resolved SUBSTANTIATED while CERTIFIED"
        actor: system
        preconditions: ["complaint.severity == CRITICAL and resolution SUBSTANTIATED"]
        side_effects:
          - "increments GoverningBody.version by 1"
          - "GoverningBody.interim_manager_id stays null until committee appoints"
      - from: PROBATION
        to: INTERIM_MANAGED
        trigger: "cascade: CRITICAL Complaint SUBSTANTIATED while PROBATION, or POST /api/governing-bodies/{id}/transitions {to_state: INTERIM_MANAGED, interim_manager_id}"
        actor: system | CommitteeAdmin
        preconditions: ["manual transition requires interim_manager_id in payload"]
        side_effects:
          - "GoverningBody.interim_manager_id := payload interim_manager_id when supplied"
          - "increments GoverningBody.version by 1"
      - from: INTERIM_MANAGED
        to: INTERIM_MANAGED
        trigger: "POST /api/governing-bodies/{id}/transitions {to_state: INTERIM_MANAGED, interim_manager_id} (appoint or replace manager)"
        actor: CommitteeAdmin
        preconditions: ["interim_manager_id present in payload"]
        side_effects:
          - "GoverningBody.interim_manager_id := payload interim_manager_id"
          - "increments GoverningBody.version by 1"
      - from: INTERIM_MANAGED
        to: PROBATION
        trigger: "POST /api/governing-bodies/{id}/transitions {to_state: PROBATION}"
        actor: CommitteeAdmin
        preconditions: ["status == INTERIM_MANAGED"]
        side_effects:
          - "GoverningBody.interim_manager_id := null"
          - "increments GoverningBody.version by 1"
      - from: PROBATION
        to: DECERTIFIED
        trigger: "POST /api/governing-bodies/{id}/transitions {to_state: DECERTIFIED}"
        actor: CommitteeAdmin
        preconditions:
          - "status in {PROBATION, INTERIM_MANAGED}"
          - "decertification evidence: a CLOSED_FAILED cycle OR a SUBSTANTIATED CRITICAL complaint, resolved/closed within trailing 365 days"
        side_effects:
          - "every non-terminal SelectionProcedure of this body -> SUPERSEDED (link 1 of decertification cascade)"
          - "every ACTIVE or SUSPENDED FundingAgreement of this body's athletes -> SUSPENDED"
          - "every ACTIVE CommercialDeal of this body's athletes -> TERMINATED"
          - "increments GoverningBody.version by 1"
      - from: INTERIM_MANAGED
        to: DECERTIFIED
        trigger: "POST /api/governing-bodies/{id}/transitions {to_state: DECERTIFIED}"
        actor: CommitteeAdmin
        preconditions:
          - "status in {PROBATION, INTERIM_MANAGED}"
          - "decertification evidence: a CLOSED_FAILED cycle OR a SUBSTANTIATED CRITICAL complaint, resolved/closed within trailing 365 days"
        side_effects:
          - "every non-terminal SelectionProcedure of this body -> SUPERSEDED (link 1 of decertification cascade)"
          - "every ACTIVE or SUSPENDED FundingAgreement of this body's athletes -> SUSPENDED"
          - "every ACTIVE CommercialDeal of this body's athletes -> TERMINATED"
          - "increments GoverningBody.version by 1"

  - entity: CertificationCycle
    initial_state: SCHEDULED
    terminal_states: [CLOSED_PASSED, CLOSED_FAILED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /api/certification-cycles/{id}/transitions {to_state: OPEN}"
        actor: CertificationAuditor
        preconditions: ["current logical clock >= window_start"]
        side_effects:
          - "CertificationCycle.opened_at := current logical clock"
          - "increments CertificationCycle.version by 1"
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /api/certification-cycles/{id}/transitions {to_state: FINDINGS_ISSUED, governance_score, athlete_rep_score, financial_score}"
        actor: CertificationAuditor
        preconditions: ["all three component scores present and each within 0..100"]
        side_effects:
          - "computes provisional_score via calculations.compliance_score (provisional variant)"
          - "CertificationCycle.issued_by_user_id := X-User-ID of caller"
          - "increments CertificationCycle.version by 1"
      - from: FINDINGS_ISSUED
        to: REMEDIATION
        trigger: "POST /api/certification-cycles/{id}/transitions {to_state: REMEDIATION}"
        actor: CertificationAuditor
        preconditions: ["provisional_score >= COMPLIANCE_PASS_THRESHOLD (70) and < COMPLIANCE_EXCELLENT_THRESHOLD (85)"]
        side_effects: ["increments CertificationCycle.version by 1"]
      - from: REMEDIATION
        to: FINDINGS_ISSUED
        trigger: "POST /api/certification-cycles/{id}/transitions {to_state: FINDINGS_ISSUED, governance_score, athlete_rep_score, financial_score} (re-issue after remediation round)"
        actor: CertificationAuditor
        preconditions: ["all three component scores present and each within 0..100"]
        side_effects:
          - "recomputes provisional_score via calculations.compliance_score (provisional variant)"
          - "CertificationCycle.issued_by_user_id := X-User-ID of caller"
          - "increments CertificationCycle.version by 1"
      - from: FINDINGS_ISSUED
        to: CLOSED_PASSED
        trigger: "POST /api/certification-cycles/{id}/transitions {to_state: CLOSED_PASSED} (excellent fast-path)"
        actor: CertificationAuditor
        preconditions:
          - "provisional_score >= COMPLIANCE_EXCELLENT_THRESHOLD (85)"
          - "X-User-ID != issued_by_user_id (segregation of duties)"
          - "current logical clock <= opened_at + CYCLE_MAX_DURATION_DAYS (120)"
        side_effects:
          - "final_score := provisional_score; remediation_applied := false"
          - "cascade: GoverningBody APPLIED->CERTIFIED or PROBATION->CERTIFIED"
          - "increments CertificationCycle.version by 1"
      - from: REMEDIATION
        to: CLOSED_PASSED
        trigger: "POST /api/certification-cycles/{id}/transitions {to_state: CLOSED_PASSED}"
        actor: CertificationAuditor
        preconditions:
          - "X-User-ID != issued_by_user_id (segregation of duties)"
          - "current logical clock <= opened_at + CYCLE_MAX_DURATION_DAYS (120)"
        side_effects:
          - "computes final_score via calculations.compliance_score (final variant: +REMEDIATION_BONUS_CAP 10 to lowest component, recompute)"
          - "remediation_applied := true"
          - "cascade: GoverningBody APPLIED->CERTIFIED or PROBATION->CERTIFIED"
          - "increments CertificationCycle.version by 1"
      - from: FINDINGS_ISSUED
        to: CLOSED_FAILED
        trigger: "POST /api/certification-cycles/{id}/transitions {to_state: CLOSED_FAILED}"
        actor: CertificationAuditor
        preconditions:
          - "provisional_score < COMPLIANCE_PASS_THRESHOLD (70)"
          - "X-User-ID != issued_by_user_id (segregation of duties)"
        side_effects:
          - "final_score := provisional_score; remediation_applied := false"
          - "cascade: GoverningBody CERTIFIED->PROBATION (no-op when APPLIED)"
          - "increments CertificationCycle.version by 1"
      - from: REMEDIATION
        to: CLOSED_FAILED
        trigger: "POST /api/certification-cycles/{id}/transitions {to_state: CLOSED_FAILED}, or auto when current logical clock passes opened_at + CYCLE_MAX_DURATION_DAYS (120) while still REMEDIATION"
        actor: CertificationAuditor | system
        preconditions: ["manual close: X-User-ID != issued_by_user_id"]
        side_effects:
          - "final_score := provisional_score; remediation_applied := false"
          - "cascade: GoverningBody CERTIFIED->PROBATION (no-op when APPLIED)"
          - "increments CertificationCycle.version by 1"

  - entity: Complaint
    initial_state: FILED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: FILED
        to: TRIAGED
        trigger: "POST /api/complaints/{id}/transitions {to_state: TRIAGED}"
        actor: CertificationAuditor
        preconditions: []
        side_effects:
          - "Complaint.triaged_by_user_id := X-User-ID"
          - "increments Complaint.version by 1"
      - from: TRIAGED
        to: INVESTIGATING
        trigger: "POST /api/complaints/{id}/transitions {to_state: INVESTIGATING}"
        actor: CertificationAuditor
        preconditions: []
        side_effects: ["increments Complaint.version by 1"]
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /api/complaints/{id}/transitions {to_state: SUBSTANTIATED}"
        actor: CertificationAuditor
        preconditions: ["X-User-ID != triaged_by_user_id (segregation of duties)"]
        side_effects:
          - "Complaint.resolved_by_user_id := X-User-ID; resolved_at := current logical clock"
          - "recompute GoverningBody.substantiated_complaint_count (calculations.complaint_posture)"
          - "cascade A: if severity == CRITICAL -> GoverningBody CERTIFIED/PROBATION -> INTERIM_MANAGED"
          - "cascade B: if substantiated_complaint_count reaches COMPLAINT_POSTURE_THRESHOLD (3) -> GoverningBody CERTIFIED -> PROBATION"
          - "increments Complaint.version by 1"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /api/complaints/{id}/transitions {to_state: DISMISSED}"
        actor: CertificationAuditor
        preconditions: ["X-User-ID != triaged_by_user_id (segregation of duties)"]
        side_effects:
          - "Complaint.resolved_by_user_id := X-User-ID; resolved_at := current logical clock"
          - "increments Complaint.version by 1"

  - entity: Athlete
    initial_state: "eligibility REGISTERED; screening SCREENING_PENDING"
    terminal_states: ["eligibility RETIRED (whole entity)"]
    transitions:
      - from: "screening SCREENING_PENDING | SCREENING_FLAGGED | SCREENING_EXPIRED"
        to: "screening SCREENING_CLEARED"
        trigger: "POST /api/athletes/{id}/transitions {to_state: SCREENING_CLEARED}"
        actor: SafeSportOfficer
        preconditions: ["eligibility_status != RETIRED"]
        side_effects:
          - "Athlete.screening_expires_at := current logical clock + SCREENING_VALIDITY_DAYS (730)"
          - "cascade: a SCREENING_FLAGGED->CLEARED while eligibility SUSPENDED reinstates eligibility -> ELIGIBLE when no unresolved AbuseReport in REPORTED/FORWARDED exists for this athlete"
          - "increments Athlete.version by 1"
      - from: "screening SCREENING_PENDING | SCREENING_CLEARED"
        to: "screening SCREENING_FLAGGED"
        trigger: "POST /api/athletes/{id}/transitions {to_state: SCREENING_FLAGGED}, or cascade from AbuseReport ADJUDICATED_SUBSTANTIATED"
        actor: SafeSportOfficer | system
        preconditions: ["eligibility_status != RETIRED"]
        side_effects:
          - "cascade link 1 (abuse cascade): eligibility ELIGIBLE -> SUSPENDED"
          - "increments Athlete.version by 1"
      - from: "screening SCREENING_CLEARED"
        to: "screening SCREENING_EXPIRED"
        trigger: "system auto-transition when logical clock passes screening_expires_at (evaluated on clock set and on read)"
        actor: system
        preconditions: ["current logical clock > screening_expires_at"]
        side_effects: ["increments Athlete.version by 1"]
      - from: "training (any)"
        to: "training current"
        trigger: "POST /api/athletes/{id}/transitions {to_state: TRAINING_CURRENT}"
        actor: SafeSportOfficer
        preconditions: ["eligibility_status != RETIRED"]
        side_effects:
          - "Athlete.training_completed_at := current logical clock"
          - "increments Athlete.version by 1"
      - from: "eligibility REGISTERED"
        to: "eligibility ELIGIBLE"
        trigger: "POST /api/athletes/{id}/transitions {to_state: ELIGIBLE}"
        actor: SafeSportOfficer
        preconditions:
          - "screening_status == SCREENING_CLEARED and current logical clock <= screening_expires_at"
          - "training_completed_at not null and current logical clock <= training_completed_at + TRAINING_VALIDITY_DAYS (365)"
        side_effects: ["increments Athlete.version by 1"]
      - from: "eligibility ELIGIBLE"
        to: "eligibility SUSPENDED"
        trigger: "POST /api/athletes/{id}/transitions {to_state: SUSPENDED}, or cascade from screening FLAGGED / AbuseReport ADJUDICATED_SUBSTANTIATED"
        actor: SafeSportOfficer | system
        preconditions: []
        side_effects:
          - "cascade link 2: every ACTIVE FundingAgreement of this athlete -> SUSPENDED (stipend halted)"
          - "increments Athlete.version by 1"
      - from: "eligibility SUSPENDED"
        to: "eligibility ELIGIBLE"
        trigger: "POST /api/athletes/{id}/transitions {to_state: ELIGIBLE}"
        actor: SafeSportOfficer
        preconditions:
          - "screening_status == SCREENING_CLEARED and current logical clock <= screening_expires_at"
          - "training_completed_at not null and current logical clock <= training_completed_at + TRAINING_VALIDITY_DAYS (365)"
          - "no AbuseReport of this athlete in REPORTED or FORWARDED status"
        side_effects:
          - "cascade: every SUSPENDED FundingAgreement of this athlete whose tier is not NONE -> ACTIVE (stipend restored exactly)"
          - "increments Athlete.version by 1"
      - from: "eligibility REGISTERED | ELIGIBLE | SUSPENDED"
        to: "eligibility RETIRED"
        trigger: "POST /api/athletes/{id}/transitions {to_state: RETIRED}"
        actor: Athlete
        preconditions: ["X-User-ID == athlete.id (self-retirement only)"]
        side_effects:
          - "every OFFERED or ACTIVE or SUSPENDED FundingAgreement of this athlete -> TERMINATED"
          - "every non-terminal roster slot of this athlete: slot_status -> REMOVED (no promotion; re-nomination required)"
          - "increments Athlete.version by 1"

  - entity: PerformanceResult
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/results/{id}/transitions {to_state: VERIFIED}"
        actor: ResultsOfficial
        preconditions: ["X-User-ID != submitting athlete id (segregation of duties)"]
        side_effects:
          - "computes base_points := PLACING_POINTS[placing] * EVENT_MULTIPLIER[event_grade]"
          - "verified_by_user_id := X-User-ID"
          - "recompute trailing_points and season_points on every non-terminal FundingAgreement of this athlete (calculations.funding_points)"
          - "increments PerformanceResult.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/results/{id}/transitions {to_state: REJECTED}"
        actor: ResultsOfficial
        preconditions: ["X-User-ID != submitting athlete id (segregation of duties)"]
        side_effects: ["increments PerformanceResult.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/results/{id}/transitions {to_state: SUBMITTED} (resubmission loop)"
        actor: Athlete
        preconditions: ["X-User-ID == result.athlete_id"]
        side_effects: ["increments PerformanceResult.version by 1"]

  - entity: FundingAgreement
    initial_state: "status OFFERED; insurance INS_NONE"
    terminal_states: ["status TERMINATED (whole entity)"]
    transitions:
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /api/funding-agreements/{id}/transitions {to_state: ACTIVE}"
        actor: CommitteeAdmin
        preconditions:
          - "athlete.eligibility_status == ELIGIBLE"
          - "athlete.governing body status != DECERTIFIED"
          - "tier != NONE"
          - "fiscal: (GoverningBody.committed_monthly_stipend_cents + monthly_stipend_cents) * 12 <= funding_budget_cents"
        side_effects:
          - "activated_at := current logical clock"
          - "GoverningBody.committed_monthly_stipend_cents += monthly_stipend_cents"
          - "recompute science-hours waterfall (calculations.science_hours_waterfall) for the body"
          - "increments FundingAgreement.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /api/funding-agreements/{id}/transitions {to_state: ACTIVE} (reassessment self-loop)"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "recompute trailing_points, season_points via calculations.funding_points as of current logical clock"
          - "tier and monthly_stipend_cents recomputed from the agreement's points_method value"
          - "if recomputed tier == NONE -> status SUSPENDED (stipend halted) and committed_monthly_stipend_cents adjusted"
          - "GoverningBody.committed_monthly_stipend_cents reconciled to new stipend"
          - "recompute science-hours waterfall for the body"
          - "increments FundingAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "cascade: athlete eligibility -> SUSPENDED; or athlete's body -> DECERTIFIED; or reassessment tier NONE"
        actor: system
        preconditions: []
        side_effects:
          - "GoverningBody.committed_monthly_stipend_cents -= monthly_stipend_cents (stipend halted, exact reversal)"
          - "cascade link 3: insurance INS_ENROLLED -> INS_LAPSED"
          - "recompute science-hours waterfall (this agreement's allocation drops to 0)"
          - "increments FundingAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "cascade: athlete eligibility SUSPENDED -> ELIGIBLE (tier not NONE), or POST /api/funding-agreements/{id}/transitions {to_state: ACTIVE} by CommitteeAdmin"
        actor: system | CommitteeAdmin
        preconditions:
          - "athlete.eligibility_status == ELIGIBLE"
          - "athlete's governing body status != DECERTIFIED"
          - "tier != NONE"
        side_effects:
          - "GoverningBody.committed_monthly_stipend_cents += monthly_stipend_cents (exactly the amount removed at suspension; no drift)"
          - "recompute science-hours waterfall"
          - "increments FundingAgreement.version by 1"
      - from: "OFFERED | ACTIVE | SUSPENDED"
        to: TERMINATED
        trigger: "POST /api/funding-agreements/{id}/transitions {to_state: TERMINATED}, or cascade: athlete RETIRED"
        actor: CommitteeAdmin | system
        preconditions: []
        side_effects:
          - "if prior status was ACTIVE: committed_monthly_stipend_cents -= monthly_stipend_cents"
          - "insurance INS_ENROLLED -> INS_LAPSED"
          - "science_hours_allocated := 0 and waterfall recomputed"
          - "increments FundingAgreement.version by 1"
      - from: "insurance INS_NONE | INS_LAPSED"
        to: "insurance INS_ENROLLED"
        trigger: "POST /api/funding-agreements/{id}/transitions {to_state: INS_ENROLLED}"
        actor: CommitteeAdmin
        preconditions:
          - "agreement status == ACTIVE"
          - "insurance eligibility rule passes (calculations.insurance_eligibility): points by agreement's points_method >= INSURANCE_MIN_POINTS (60) and current logical clock >= activated_at + INSURANCE_WAIT_DAYS (30)"
        side_effects:
          - "insurance_enrolled_at := current logical clock"
          - "increments FundingAgreement.version by 1"
      - from: "insurance INS_ENROLLED"
        to: "insurance INS_LAPSED"
        trigger: "cascade: agreement ACTIVE -> SUSPENDED or -> TERMINATED"
        actor: system
        preconditions: []
        side_effects: ["increments FundingAgreement.version by 1"]

  - entity: AbuseReport
    initial_state: REPORTED
    terminal_states: [ADJUDICATED_SUBSTANTIATED, ADJUDICATED_UNSUBSTANTIATED]
    transitions:
      - from: REPORTED
        to: FORWARDED
        trigger: "POST /api/abuse-reports/{id}/transitions {to_state: FORWARDED} (forwarded to the independent body)"
        actor: SafeSportOfficer
        preconditions: []
        side_effects:
          - "forwarded_at := current logical clock"
          - "increments AbuseReport.version by 1"
      - from: FORWARDED
        to: ADJUDICATED_SUBSTANTIATED
        trigger: "POST /api/abuse-reports/{id}/transitions {to_state: ADJUDICATED_SUBSTANTIATED}"
        actor: SafeSportOfficer
        preconditions: []
        side_effects:
          - "adjudicated_at := current logical clock"
          - "cascade link 1: subject Athlete screening -> SCREENING_FLAGGED and eligibility -> SUSPENDED (when currently ELIGIBLE)"
          - "cascade link 2 (via athlete suspension): athlete's ACTIVE FundingAgreements -> SUSPENDED"
          - "cascade link 3 (via agreement suspension): INS_ENROLLED -> INS_LAPSED"
          - "cascade link 4 (via athlete suspension): the athlete's non-terminal roster slots -> REMOVED with alternate promotion (see Roster slot rules)"
          - "increments AbuseReport.version by 1"
      - from: FORWARDED
        to: ADJUDICATED_UNSUBSTANTIATED
        trigger: "POST /api/abuse-reports/{id}/transitions {to_state: ADJUDICATED_UNSUBSTANTIATED}"
        actor: SafeSportOfficer
        preconditions: []
        side_effects:
          - "adjudicated_at := current logical clock"
          - "increments AbuseReport.version by 1"

  - entity: SelectionProcedure
    initial_state: "proc DRAFT; trials TRIALS_NOT_OPEN"
    terminal_states: ["proc SUPERSEDED", "proc COMPLETED"]
    transitions:
      - from: "proc DRAFT"
        to: "proc PUBLISHED"
        trigger: "POST /api/selection-procedures/{id}/transitions {to_state: PUBLISHED}"
        actor: NGBAdmin
        preconditions:
          - "governing body status in {CERTIFIED, PROBATION, INTERIM_MANAGED}"
          - "current logical clock + MIN_PUBLISH_LEAD_DAYS (90) <= trials_start"
          - "registration_deadline + REGISTRATION_CLOSE_BEFORE_TRIALS_DAYS (14) <= trials_start"
        side_effects:
          - "published_at := current logical clock"
          - "increments SelectionProcedure.version by 1"
      - from: "proc PUBLISHED"
        to: "proc LOCKED"
        trigger: "POST /api/selection-procedures/{id}/transitions {to_state: LOCKED}"
        actor: NGBAdmin
        preconditions: ["governing body status in {CERTIFIED, PROBATION, INTERIM_MANAGED}"]
        side_effects:
          - "locked_at := current logical clock; procedure becomes version-pinned: no further edits to trials window, qualifying_score, quota_slots, registration_deadline"
          - "increments SelectionProcedure.version by 1"
      - from: "proc LOCKED, trials TRIALS_NOT_OPEN"
        to: "trials REGISTRATION_OPEN"
        trigger: "POST /api/selection-procedures/{id}/transitions {to_state: REGISTRATION_OPEN}"
        actor: NGBAdmin
        preconditions: ["proc_status == LOCKED"]
        side_effects: ["increments SelectionProcedure.version by 1"]
      - from: "trials REGISTRATION_OPEN"
        to: "trials HELD"
        trigger: "POST /api/selection-procedures/{id}/transitions {to_state: HELD}"
        actor: NGBAdmin
        preconditions: ["current logical clock >= trials_start"]
        side_effects: ["increments SelectionProcedure.version by 1"]
      - from: "trials HELD"
        to: "trials RESULTS_FINALIZED"
        trigger: "POST /api/selection-procedures/{id}/transitions {to_state: RESULTS_FINALIZED, results: [{athlete_id, score}]}"
        actor: NGBAdmin
        preconditions:
          - "current logical clock >= trials_end"
          - "results array covers every entry with entry_status == REGISTERED (atomic: any unknown athlete_id or duplicate rejects the whole request)"
        side_effects:
          - "each listed entry: score := payload score, result_recorded_at := current logical clock, entry_status := QUALIFIED when score >= qualifying_score else UNQUALIFIED"
          - "increments SelectionProcedure.version by 1"
      - from: "proc DRAFT | PUBLISHED | LOCKED"
        to: "proc SUPERSEDED"
        trigger: "POST /api/selection-procedures/{id}/transitions {to_state: SUPERSEDED}, or cascade: governing body DECERTIFIED"
        actor: NGBAdmin | system
        preconditions: ["no Roster of this procedure in CONFIRMED status"]
        side_effects:
          - "cascade link 2: every non-terminal Roster of this procedure -> CANCELLED"
          - "increments SelectionProcedure.version by 1"
      - from: "proc LOCKED, trials RESULTS_FINALIZED"
        to: "proc COMPLETED"
        trigger: "cascade: a Roster of this procedure reaches CONFIRMED"
        actor: system
        preconditions: []
        side_effects: ["increments SelectionProcedure.version by 1"]

  - entity: Roster
    initial_state: DRAFT
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: DRAFT
        to: NOMINATED
        trigger: "POST /api/rosters/{id}/nominations {expected_roster_version}"
        actor: NGBAdmin
        preconditions:
          - "procedure proc_status == LOCKED and trials_status == RESULTS_FINALIZED"
          - "governing body status in {CERTIFIED, PROBATION, INTERIM_MANAGED}"
          - "OCC: expected_roster_version == Roster.version"
        side_effects:
          - "computes quota bonus (calculations.quota_bonus) then composite ranking (calculations.roster_composite_ranking); evaluation order pinned: season points first, bonus second, ranking third"
          - "slots := top quota_effective eligible candidates as PRIMARY (rank 1..N) plus next ALTERNATE_COUNT (2) as ALTERNATE; athletes who DECLINED a slot on this roster are excluded"
          - "nominated_at := current logical clock (first nomination starts the appeal window)"
          - "increments Roster.version by 1"
      - from: NOMINATED
        to: NOMINATED
        trigger: "POST /api/rosters/{id}/nominations {expected_roster_version} (selector re-run; legitimately overwrites the slot list, e.g. after an entry disqualification)"
        actor: NGBAdmin
        preconditions:
          - "procedure proc_status == LOCKED and trials_status == RESULTS_FINALIZED"
          - "governing body status in {CERTIFIED, PROBATION, INTERIM_MANAGED}"
          - "OCC: expected_roster_version == Roster.version"
        side_effects:
          - "recomputes quota bonus and composite ranking; slots := fresh selection (athletes with a DECLINED slot on this roster stay excluded)"
          - "nominated_at is NOT refreshed: the appeal window stays anchored to the first nomination"
          - "increments Roster.version by 1"
      - from: NOMINATED
        to: NOMINATED
        trigger: "POST /api/rosters/{id}/transitions {to_state: NOMINATED, slot_decisions: [{athlete_id, decision: ACCEPTED|DECLINED}]} (self-loop processing athlete responses)"
        actor: Athlete
        preconditions:
          - "each decision's athlete_id == X-User-ID (athletes answer only their own slot)"
          - "each referenced slot exists with slot_status == NOMINATED"
        side_effects:
          - "ACCEPTED: slot_status := ACCEPTED"
          - "DECLINED: slot_status := DECLINED and athlete_id appended to Roster.declined_athlete_ids; promotion cascade: highest-ranked ALTERNATE with slot_status == NOMINATED becomes PRIMARY with slot_status := PROMOTED and rank reassigned; when no alternate exists the slot collapses to REMOVED"
          - "invariant: count of PRIMARY slots with slot_status in {NOMINATED, PROMOTED, ACCEPTED} is unchanged by a DECLINE when an alternate is available"
          - "increments Roster.version by 1"
      - from: NOMINATED
        to: SUBMITTED
        trigger: "POST /api/rosters/{id}/transitions {to_state: SUBMITTED}"
        actor: "NGBAdmin (only when body status in {CERTIFIED, PROBATION}); CommitteeAdmin or the appointed interim manager (when body INTERIM_MANAGED)"
        preconditions:
          - "no Appeal of this roster in FILED or HEARING status"
          - "no PRIMARY slot left with slot_status == NOMINATED or PROMOTED (all decisions collected)"
          - "governing body status != DECERTIFIED"
        side_effects:
          - "submitted_by_user_id := X-User-ID"
          - "increments Roster.version by 1"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /api/rosters/{id}/transitions {to_state: CONFIRMED}"
        actor: CommitteeAdmin
        preconditions: ["governing body status != DECERTIFIED"]
        side_effects:
          - "cascade: SelectionProcedure proc -> COMPLETED"
          - "increments Roster.version by 1"
      - from: NOMINATED
        to: DRAFT
        trigger: "cascade: an Appeal of this roster is resolved UPHELD"
        actor: system
        preconditions: []
        side_effects:
          - "slots := [] (cleared; selector must be re-run); declined_athlete_ids is PRESERVED so athletes who declined stay excluded from the re-run"
          - "increments Roster.version by 1"
      - from: "DRAFT | NOMINATED | SUBMITTED"
        to: CANCELLED
        trigger: "cascade: procedure SUPERSEDED (decertification cascade link 2)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade link 3: every FILED or HEARING Appeal of this roster -> WITHDRAWN"
          - "increments Roster.version by 1"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: HEARING
        trigger: "POST /api/appeals/{id}/transitions {to_state: HEARING}"
        actor: Arbitrator
        preconditions: []
        side_effects: ["increments Appeal.version by 1"]
      - from: HEARING
        to: UPHELD
        trigger: "POST /api/appeals/{id}/transitions {to_state: UPHELD, decision_rationale}"
        actor: Arbitrator
        preconditions: []
        side_effects:
          - "cascade: Roster NOMINATED -> DRAFT (slots cleared; re-nomination required)"
          - "increments Appeal.version by 1"
      - from: HEARING
        to: DENIED
        trigger: "POST /api/appeals/{id}/transitions {to_state: DENIED, decision_rationale}"
        actor: Arbitrator
        preconditions: []
        side_effects: ["increments Appeal.version by 1"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /api/appeals/{id}/transitions {to_state: WITHDRAWN}, or cascade: roster CANCELLED"
        actor: Athlete | system
        preconditions: ["manual withdrawal: X-User-ID == filed_by_athlete_id"]
        side_effects: ["increments Appeal.version by 1"]

  - entity: CommercialDeal
    initial_state: PROPOSED
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: CONSENT_GRANTED
        trigger: "POST /api/commercial-deals/{id}/transitions {to_state: CONSENT_GRANTED, expected_deal_version}"
        actor: Athlete
        preconditions:
          - "X-User-ID == deal.athlete_id (only the subject athlete consents)"
          - "OCC: expected_deal_version == CommercialDeal.version"
          - "athlete eligibility_status != RETIRED"
        side_effects:
          - "consented_at := current logical clock"
          - "increments CommercialDeal.version by 1"
      - from: CONSENT_GRANTED
        to: ACTIVE
        trigger: "POST /api/commercial-deals/{id}/transitions {to_state: ACTIVE, expected_deal_version}"
        actor: CommitteeAdmin
        preconditions:
          - "OCC: expected_deal_version == CommercialDeal.version"
          - "athlete's governing body status in {CERTIFIED, PROBATION, INTERIM_MANAGED}"
        side_effects:
          - "activated_at := current logical clock"
          - "computes committee/ngb/athlete shares via calculations.revenue_split (rounding order pinned)"
          - "increments CommercialDeal.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system auto-transition when logical clock passes exclusivity_end (evaluated on clock set and on read)"
        actor: system
        preconditions: ["current logical clock > exclusivity_end"]
        side_effects: ["increments CommercialDeal.version by 1"]
      - from: "PROPOSED | CONSENT_GRANTED | ACTIVE"
        to: TERMINATED
        trigger: "POST /api/commercial-deals/{id}/transitions {to_state: TERMINATED, expected_deal_version}, or cascade: athlete's governing body DECERTIFIED or athlete RETIRED"
        actor: CommitteeAdmin | system
        preconditions: ["manual: OCC expected_deal_version == CommercialDeal.version"]
        side_effects: ["increments CommercialDeal.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, resolved via parent-version OCC)
# =============================================================================
concurrency_rules:
  - rule_id: roster-nomination-stale-roster
    parent_entity: Roster
    write_endpoint: "POST /api/rosters/{id}/nominations"
    occ_field: expected_roster_version
    description: |
      Running the nomination selector against a Roster whose version has
      advanced since the client last observed it is rejected. This captures
      the case where a previous nomination (or an appeal-driven revert plus
      re-nomination) has already legitimately rewritten the slot list and the
      current writer's view of the roster is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: deal-transition-stale-deal
    parent_entity: CommercialDeal
    write_endpoint: "POST /api/commercial-deals/{id}/transitions"
    occ_field: expected_deal_version
    description: |
      Transitioning a CommercialDeal whose version has advanced since the
      client last observed it is rejected. This captures the case where an
      athlete consent has just legitimately advanced the deal and a committee
      activation carrying the pre-consent version is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compliance_score
    trigger: "CertificationCycle -> FINDINGS_ISSUED (provisional variant) and -> CLOSED_* (final variant)"
    algorithm: weighted_scoring
    formula: |
      weighted(g, a, f) = round_half_up(0.40*g + 0.35*a + 0.25*f, 2)
      provisional_score = weighted(governance_score, athlete_rep_score, financial_score)
      final variant (only on REMEDIATION -> CLOSED_PASSED):
        lowest = component with minimum score (ties broken: financial first, then athlete_rep, then governance)
        lowest' = min(lowest + REMEDIATION_BONUS_CAP, 100)
        final_score = weighted(scores with lowest replaced by lowest')
      otherwise final_score = provisional_score
      pass/fail bands: >= COMPLIANCE_EXCELLENT_THRESHOLD -> excellent fast-path;
        >= COMPLIANCE_PASS_THRESHOLD -> remediation required; below -> CLOSED_FAILED
    input_set: "the three component scores supplied at issue-findings"
    constants:
      SCORE_WEIGHT_GOVERNANCE: 0.40
      SCORE_WEIGHT_ATHLETE_REP: 0.35
      SCORE_WEIGHT_FINANCIAL: 0.25
      COMPLIANCE_PASS_THRESHOLD: 70
      COMPLIANCE_EXCELLENT_THRESHOLD: 85
      REMEDIATION_BONUS_CAP: 10
      CYCLE_MAX_DURATION_DAYS: 120
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "at FINDINGS_ISSUED"
        difference: "raw weighted score of the issued component scores"
      - name: final
        when: "at close after a REMEDIATION round"
        difference: "adds up to REMEDIATION_BONUS_CAP (10) to the single lowest component before re-weighting, so identical inputs close higher than the provisional read"

  - name: funding_points
    trigger: "PerformanceResult -> VERIFIED; FundingAgreement create; FundingAgreement ACTIVE->ACTIVE reassessment"
    algorithm: chronological
    formula: |
      base(result) = PLACING_POINTS[result.placing] * EVENT_MULTIPLIER[result.event_grade]
      TRAILING_365 (anchor = current logical clock T):
        include VERIFIED results with 0 <= (T - event_date) in days <= TRAILING_WINDOW_DAYS (365)
        recency weight: age <= RECENCY_FULL_DAYS (180) -> 1.0; 181..365 -> RECENCY_HALF_WEIGHT (0.5)
        points = round_half_up(sum(base * recency_weight), 2)
      CALENDAR_SEASON (anchor = T):
        include VERIFIED results with event_date in [Jan 1 of T's year, T]
        points = round_half_up(sum(base), 2)   # no recency decay
      Both values are stored on the agreement; the agreement's points_method selects the operative one.
    input_set: "PerformanceResults of the athlete with status == VERIFIED only (SUBMITTED/REJECTED excluded)"
    constants:
      PLACING_POINTS: {1: 40, 2: 32, 3: 26, 4: 20, 5: 16, 6: 12, 7: 8, 8: 4}
      EVENT_MULTIPLIER_A: 1.5
      EVENT_MULTIPLIER_B: 1.25
      EVENT_MULTIPLIER_C: 1.0
      RECENCY_FULL_DAYS: 180
      RECENCY_HALF_WEIGHT: 0.5
      TRAILING_WINDOW_DAYS: 365
    precision: "2 decimal places, round_half_up"
    variants:
      - name: trailing_365
        when: "points_method == TRAILING_365"
        difference: "rolling 365-day window with 0.5 decay for results aged 181-365 days"
      - name: calendar_season
        when: "points_method == CALENDAR_SEASON"
        difference: "calendar-year-to-date window with no decay; identical results produce different points than trailing_365"

  - name: tier_assignment
    trigger: "immediately after calculations.funding_points (create, verify, reassess)"
    algorithm: threshold
    formula: |
      operative = trailing_points when points_method == TRAILING_365 else season_points
      tier = TIER_A when operative >= TIER_A_MIN_POINTS
             TIER_B when operative >= TIER_B_MIN_POINTS
             TIER_C when operative >= TIER_C_MIN_POINTS
             NONE otherwise
      monthly_stipend_cents = {TIER_A: 300000, TIER_B: 200000, TIER_C: 100000, NONE: 0}[tier]
      boundary: a value exactly at a threshold qualifies (>=, not >)
    input_set: "the agreement's operative points value"
    constants:
      TIER_A_MIN_POINTS: 100
      TIER_B_MIN_POINTS: 60
      TIER_C_MIN_POINTS: 30
      STIPEND_TIER_A_CENTS: 300000
      STIPEND_TIER_B_CENTS: 200000
      STIPEND_TIER_C_CENTS: 100000
    precision: "points compared at 2 decimal places"

  - name: insurance_eligibility
    trigger: "FundingAgreement insurance transition to INS_ENROLLED"
    algorithm: threshold
    formula: |
      eligible = (operative_points >= INSURANCE_MIN_POINTS) AND (now >= activated_at + INSURANCE_WAIT_DAYS)
      operative_points uses the agreement's points_method (trailing_points or season_points) as of now
      both boundaries are inclusive (>=)
    input_set: "the agreement being enrolled"
    constants:
      INSURANCE_MIN_POINTS: 60
      INSURANCE_WAIT_DAYS: 30
    precision: "points at 2 decimal places; wait compared to the second"

  - name: roster_composite_ranking
    trigger: "POST /api/rosters/{id}/nominations"
    algorithm: weighted_scoring
    formula: |
      candidate set: procedure entries with entry_status == QUALIFIED
        AND athlete.eligibility_status == ELIGIBLE
        AND athlete.screening_status == SCREENING_CLEARED (and not expired as of now)
        AND athlete.training_completed_at within TRAINING_VALIDITY_DAYS (365) of now
        AND athlete.id not in Roster.declined_athlete_ids (declined athletes stay excluded across re-runs and appeal reverts)
      composite_score = round_half_up(COMPOSITE_TRIALS_WEIGHT * trials_score + COMPOSITE_SEASON_WEIGHT * season_points, 2)
        where trials_score = entry.score, season_points = CALENDAR_SEASON points for the calendar year of procedure.trials_end as of now
      ranking: composite_score DESC; tie-break 1: trials_score DESC; tie-break 2: earlier entry.result_recorded_at ASC; tie-break 3: earlier athlete.created_at ASC
      first quota_effective candidates -> PRIMARY slots rank 1..N; next ALTERNATE_COUNT -> ALTERNATE slots rank N+1..N+2
    input_set: "QUALIFIED entries of the procedure after the eligibility filter"
    constants:
      COMPOSITE_TRIALS_WEIGHT: 0.7
      COMPOSITE_SEASON_WEIGHT: 0.3
      ALTERNATE_COUNT: 2
      TRAINING_VALIDITY_DAYS: 365
    precision: "2 decimal places, round_half_up"

  - name: quota_bonus
    trigger: "POST /api/rosters/{id}/nominations, evaluated BEFORE roster_composite_ranking (evaluation order pinned: season points -> bonus -> ranking)"
    algorithm: threshold
    formula: |
      season_pts(a) = CALENDAR_SEASON points of athlete a for the calendar year of procedure.trials_end
      top3_sum = sum of the three highest season_pts over athletes with QUALIFIED entries (fewer than 3: sum all)
      bonus_slot_applied = (top3_sum >= QUOTA_BONUS_THRESHOLD)
      quota_effective = quota_slots + (QUOTA_BONUS_SLOTS if bonus_slot_applied else 0)
    input_set: "VERIFIED results of QUALIFIED entrants only"
    constants:
      QUOTA_BONUS_THRESHOLD: 250
      QUOTA_BONUS_SLOTS: 1
    precision: "points at 2 decimal places; threshold inclusive (>=)"

  - name: revenue_split
    trigger: "CommercialDeal CONSENT_GRANTED -> ACTIVE"
    algorithm: tiered_pricing
    formula: |
      if basis == NET_BASIS:  fee_cents = round_half_up(gross_value_cents * AGENCY_FEE_PCT); base = gross_value_cents - fee_cents
      if basis == GROSS_BASIS: base = gross_value_cents
      rounding order PINNED — round per share, athlete absorbs remainder:
        committee_share_cents = round_half_up(base * COMMITTEE_SHARE_PCT)
        ngb_share_cents       = round_half_up(base * NGB_SHARE_PCT)
        athlete_share_cents   = base - committee_share_cents - ngb_share_cents
    input_set: "the deal's gross_value_cents and basis"
    constants:
      COMMITTEE_SHARE_PCT: 0.30
      NGB_SHARE_PCT: 0.40
      ATHLETE_SHARE_PCT: 0.30
      AGENCY_FEE_PCT: 0.10
    precision: "integer cents, round_half_up per share in the pinned order"
    variants:
      - name: gross_basis
        when: "basis == GROSS_BASIS"
        difference: "splits the gross value; no agency fee deducted"
      - name: net_basis
        when: "basis == NET_BASIS"
        difference: "deducts the 10% agency fee first; identical gross produces different (smaller) shares than gross_basis"

  - name: science_hours_waterfall
    trigger: "FundingAgreement -> ACTIVE, -> SUSPENDED, -> TERMINATED, and reassessment self-loop"
    algorithm: waterfall_allocation
    formula: |
      pool = GoverningBody.sport_science_pool_hours
      buckets = ACTIVE FundingAgreements of the body's athletes, ordered: tier A before B before C;
        within a tier, earlier activated_at ASC; final tie-break: earlier agreement created_at ASC
      each bucket receives min(remaining_pool, cap[tier]) where cap = {TIER_A: 40, TIER_B: 25, TIER_C: 10}
      partial fill allowed for the last bucket reached; unreached buckets receive 0
      writes science_hours_allocated on each agreement and allocated_science_hours on the body
    input_set: "ACTIVE FundingAgreements of athletes whose governing_body_id == this body"
    constants:
      SCIENCE_HOURS_CAP_A: 40
      SCIENCE_HOURS_CAP_B: 25
      SCIENCE_HOURS_CAP_C: 10
    precision: "integer hours"

  - name: complaint_posture
    trigger: "Complaint -> SUBSTANTIATED, and re-evaluated on logical-clock set"
    algorithm: threshold
    formula: |
      substantiated_complaint_count = count of this body's Complaints with status == SUBSTANTIATED
        and resolved_at within trailing COMPLAINT_POSTURE_WINDOW_DAYS (365) of now (inclusive)
      complaint_posture = ELEVATED when count >= COMPLAINT_POSTURE_THRESHOLD else NORMAL
      crossing NORMAL -> ELEVATED while body CERTIFIED cascades CERTIFIED -> PROBATION
      boundary: the 3rd qualifying complaint flips posture; the 2nd does not (cumulative threshold)
    input_set: "the body's resolved complaints in the trailing 365-day window"
    constants:
      COMPLAINT_POSTURE_THRESHOLD: 3
      COMPLAINT_POSTURE_WINDOW_DAYS: 365
    precision: "integer count; window boundary inclusive"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller role appears in the endpoint's roles list; entity-backed ownership: NGBAdmin X-User-ID must equal the owning GoverningBody.id, Athlete X-User-ID must equal the owning Athlete.id (cross-body/cross-athlete access denied); conditional authorization: NGBAdmin roster submission is denied while the owning body is INTERIM_MANAGED (committee or the appointed interim manager must submit)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path parameters resolve to existing entities, validated left-to-right; body-supplied FK references (athlete_id, governing_body_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "target resource's current state allows the requested transition; terminal states reject every transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 4, category: state, check: "target resource is already in a terminal state", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 4, category: state, check: "trials entry requires trials_status == REGISTRATION_OPEN (procedure dimension state)", error_id: ERR_TRIALS_NOT_OPEN, http_status: 409, applies_to: ["POST /api/selection-procedures/{id}/entries"] }
  - { priority: 5, category: business_safety, check: "athlete screening_status == SCREENING_CLEARED and not expired for trials entry and roster nomination eligibility", error_id: ERR_SCREENING_NOT_CLEARED, http_status: 422, applies_to: ["POST /api/selection-procedures/{id}/entries", "POST /api/rosters/{id}/nominations"] }
  - { priority: 5, category: business_safety, check: "athlete training_completed_at within TRAINING_VALIDITY_DAYS (365) of now for trials entry and roster nomination eligibility", error_id: ERR_TRAINING_EXPIRED, http_status: 422, applies_to: ["POST /api/selection-procedures/{id}/entries", "POST /api/rosters/{id}/nominations"] }
  - { priority: 5, category: business_safety, check: "athlete eligibility_status == ELIGIBLE (not REGISTERED/SUSPENDED) for trials entry, nomination eligibility, and funding activation", error_id: ERR_ATHLETE_NOT_ELIGIBLE, http_status: 409, applies_to: ["POST /api/selection-procedures/{id}/entries", "POST /api/rosters/{id}/nominations", "POST /api/funding-agreements/{id}/transitions"] }
  - { priority: 6, category: business_temporal, check: "new CertificationCycle window [window_start, window_end) must not overlap any existing cycle of the same body; touching endpoints (start == prior end) are allowed", error_id: ERR_CYCLE_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /api/governing-bodies/{id}/certification-cycles"] }
  - { priority: 6, category: business_temporal, check: "window_end > window_start (cycles, agreements); exclusivity_end >= exclusivity_start (deals)", error_id: ERR_CYCLE_WINDOW_INVALID, http_status: 422, applies_to: ["POST /api/governing-bodies/{id}/certification-cycles", "POST /api/athletes/{id}/funding-agreements", "POST /api/athletes/{id}/commercial-deals"] }
  - { priority: 6, category: business_temporal, check: "new FundingAgreement coverage window must not overlap the athlete's other OFFERED/ACTIVE/SUSPENDED agreements (half-open; adjacency allowed)", error_id: ERR_AGREEMENT_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /api/athletes/{id}/funding-agreements"] }
  - { priority: 6, category: business_temporal, check: "new CommercialDeal exclusivity window is a CLOSED interval per athlete: any overlap OR adjacency closer than DEAL_EXCLUSIVITY_MIN_GAP_DAYS (1 day) with another non-terminal deal of the same athlete is rejected", error_id: ERR_DEAL_EXCLUSIVITY_OVERLAP, http_status: 409, applies_to: ["POST /api/athletes/{id}/commercial-deals"] }
  - { priority: 6, category: business_temporal, check: "procedure publish requires now + MIN_PUBLISH_LEAD_DAYS (90) <= trials_start", error_id: ERR_PUBLISH_LEAD_TIME, http_status: 422, applies_to: ["POST /api/selection-procedures/{id}/transitions"] }
  - { priority: 6, category: business_temporal, check: "trials entry accepted only at or before registration_deadline", error_id: ERR_REGISTRATION_CLOSED, http_status: 422, applies_to: ["POST /api/selection-procedures/{id}/entries"] }
  - { priority: 6, category: business_temporal, check: "appeal filing requires now <= roster.nominated_at + APPEAL_WINDOW_HOURS (72), boundary inclusive", error_id: ERR_APPEAL_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /api/rosters/{id}/appeals"] }
  - { priority: 7, category: business_constraint, check: "component scores within 0..100; placing within 1..8; quota_slots >= 1; enum fields carry declared members; required fields present and typed", error_id: ERR_SCORE_OUT_OF_RANGE, http_status: 422, applies_to: ["POST /api/certification-cycles/{id}/transitions", "POST /api/athletes/{id}/results"] }
  - { priority: 7, category: business_constraint, check: "required fields present, well-typed, enum members valid (malformed request bodies)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 7, category: business_constraint, check: "segregation of duties: cycle issuer != closer; complaint triager != resolver; result submitter != verifier", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /api/certification-cycles/{id}/transitions", "POST /api/complaints/{id}/transitions", "POST /api/results/{id}/transitions"] }
  - { priority: 7, category: business_constraint, check: "trials entry rejected when the athlete already has a non-DISQUALIFIED entry on this procedure", error_id: ERR_DUPLICATE_ENTRY, http_status: 409, applies_to: ["POST /api/selection-procedures/{id}/entries"] }
  - { priority: 7, category: business_constraint, check: "roster submission blocked while any Appeal of the roster is FILED or HEARING", error_id: ERR_PENDING_APPEALS, http_status: 409, applies_to: ["POST /api/rosters/{id}/transitions"] }
  - { priority: 7, category: business_constraint, check: "roster submission blocked while any PRIMARY slot still awaits a decision (slot_status NOMINATED or PROMOTED)", error_id: ERR_PENDING_SLOT_DECISIONS, http_status: 409, applies_to: ["POST /api/rosters/{id}/transitions"] }
  - { priority: 7, category: business_constraint, check: "nomination requires the procedure LOCKED with trials RESULTS_FINALIZED", error_id: ERR_RESULTS_NOT_FINAL, http_status: 409, applies_to: ["POST /api/rosters/{id}/nominations"] }
  - { priority: 4, category: state, check: "deal activation (to_state ACTIVE) from PROPOSED rejects with the domain-specific consent error rather than generic invalid-state", error_id: ERR_DEAL_CONSENT_REQUIRED, http_status: 409, applies_to: ["POST /api/commercial-deals/{id}/transitions"] }
  - { priority: 8, category: business_referential, check: "appellant (X-User-ID) is an Athlete with an entry on the appealed roster's procedure", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: ["POST /api/rosters/{id}/appeals"] }
  - { priority: 9, category: business_fiscal, check: "funding activation: (committed_monthly_stipend_cents + new monthly_stipend_cents) * 12 <= funding_budget_cents", error_id: ERR_FUNDING_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /api/funding-agreements/{id}/transitions"] }
  - { priority: 9, category: business_fiscal, check: "insurance enrollment: calculations.insurance_eligibility must pass (points and wait period)", error_id: ERR_INSURANCE_NOT_ELIGIBLE, http_status: 422, applies_to: ["POST /api/funding-agreements/{id}/transitions"] }
  - { priority: 10, category: state, check: "OCC: expected_roster_version / expected_deal_version matches the resource's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /api/rosters/{id}/nominations", "POST /api/commercial-deals/{id}/transitions"] }

# =============================================================================
# 1.5 API Endpoint Table (40 endpoints; business surface under /api)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "TEST-DRIVING (unprefixed platform endpoint): set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. Advancing the clock applies due auto-transitions: screening CLEARED->EXPIRED past screening_expires_at; deals ACTIVE->EXPIRED past exclusivity_end; cycles stuck in REMEDIATION past opened_at+120d close CLOSED_FAILED; complaint posture window is re-evaluated."
    roles: [CommitteeAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["applies due auto-transitions listed in the description"]

  - method: POST
    path: "/api/governing-bodies"
    description: "Register a national governing body applicant (status APPLIED)"
    roles: [CommitteeAdmin]
    code: 201
    input: [name, sport_code, funding_budget_cents, sport_science_pool_hours]
    output: GoverningBody
    side_effects: []

  - method: GET
    path: "/api/governing-bodies/{id}"
    description: "Read one governing body including computed posture/budget/allocation fields"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: []
    output: GoverningBody
    side_effects: []

  - method: POST
    path: "/api/governing-bodies/{id}/transitions"
    description: "Committee-driven lifecycle moves: INTERIM_MANAGED (appoint/replace manager; self-loop allowed), INTERIM_MANAGED->PROBATION, PROBATION|INTERIM_MANAGED->DECERTIFIED"
    roles: [CommitteeAdmin]
    code: 200
    input: [to_state, "interim_manager_id?"]
    output: GoverningBody
    side_effects: ["DECERTIFIED cascades: procedures SUPERSEDED -> rosters CANCELLED -> appeals WITHDRAWN; agreements SUSPENDED; deals TERMINATED", "increments GoverningBody.version by 1"]

  - method: POST
    path: "/api/governing-bodies/{id}/certification-cycles"
    description: "Schedule a certification review cycle (window overlap-checked per body, half-open, adjacency allowed)"
    roles: [CommitteeAdmin]
    code: 201
    input: [window_start, window_end]
    output: CertificationCycle
    side_effects: []

  - method: GET
    path: "/api/governing-bodies/{id}/certification-cycles"
    description: "List a body's certification cycles"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CertificationCycle[]
    side_effects: []

  - method: POST
    path: "/api/certification-cycles/{id}/transitions"
    description: "Cycle lifecycle: OPEN, FINDINGS_ISSUED (with scores), REMEDIATION, CLOSED_PASSED, CLOSED_FAILED. Segregation of duties: closer must differ from findings issuer."
    roles: [CertificationAuditor]
    code: 200
    input: [to_state, "governance_score?", "athlete_rep_score?", "financial_score?"]
    output: CertificationCycle
    side_effects: ["FINDINGS_ISSUED computes provisional_score", "close computes final_score and cascades body status", "increments CertificationCycle.version by 1"]

  - method: POST
    path: "/api/governing-bodies/{id}/complaints"
    description: "File a complaint against a governing body"
    roles: [CommitteeAdmin, CertificationAuditor, Athlete, SafeSportOfficer]
    code: 201
    input: [category, severity, description]
    output: Complaint
    side_effects: []

  - method: GET
    path: "/api/governing-bodies/{id}/complaints"
    description: "List complaints against a body"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/api/complaints/{id}/transitions"
    description: "Complaint lifecycle: TRIAGED -> INVESTIGATING -> SUBSTANTIATED|DISMISSED. Segregation of duties: resolver must differ from triager."
    roles: [CertificationAuditor]
    code: 200
    input: [to_state]
    output: Complaint
    side_effects: ["SUBSTANTIATED: posture recompute; CRITICAL cascade to INTERIM_MANAGED; 3rd-in-365d cascade CERTIFIED->PROBATION", "increments Complaint.version by 1"]

  - method: POST
    path: "/api/athletes"
    description: "Register an athlete with a governing body"
    roles: [CommitteeAdmin, NGBAdmin]
    code: 201
    input: [governing_body_id, full_name, date_of_birth, "team_sport?"]
    output: Athlete
    side_effects: []

  - method: GET
    path: "/api/athletes"
    description: "List athletes, filterable by governing body and eligibility"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["governing_body_id?", "eligibility_status?", "limit?", "offset?"]
    output: Athlete[]
    side_effects: []

  - method: GET
    path: "/api/athletes/{id}"
    description: "Read one athlete including both parallel state dimensions"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: []
    output: Athlete
    side_effects: []

  - method: POST
    path: "/api/athletes/{id}/transitions"
    description: "Safe-sport and eligibility moves; to_state selects the dimension unambiguously: SCREENING_CLEARED | SCREENING_FLAGGED (screening), TRAINING_CURRENT (training), ELIGIBLE | SUSPENDED (eligibility), RETIRED (athlete self-service)"
    roles: [SafeSportOfficer, Athlete]
    code: 200
    input: [to_state]
    output: Athlete
    side_effects: ["SUSPENDED cascades to agreements and roster slots", "ELIGIBLE reinstatement cascades suspended agreements back to ACTIVE when tier != NONE", "RETIRED terminates agreements and removes roster slots", "increments Athlete.version by 1"]

  - method: POST
    path: "/api/athletes/{id}/results"
    description: "Athlete submits a performance result (SUBMITTED)"
    roles: [Athlete]
    code: 201
    input: [event_name, event_grade, placing, event_date]
    output: PerformanceResult
    side_effects: []

  - method: GET
    path: "/api/athletes/{id}/results"
    description: "List an athlete's results"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PerformanceResult[]
    side_effects: []

  - method: POST
    path: "/api/results/{id}/transitions"
    description: "Result verification: VERIFIED | REJECTED (ResultsOfficial), SUBMITTED resubmission from REJECTED (owning athlete)"
    roles: [ResultsOfficial, Athlete]
    code: 200
    input: [to_state]
    output: PerformanceResult
    side_effects: ["VERIFIED computes base_points and recomputes funding points on the athlete's non-terminal agreements", "increments PerformanceResult.version by 1"]

  - method: POST
    path: "/api/athletes/{id}/funding-agreements"
    description: "Offer a funding agreement (OFFERED): computes both points variants, tier and stipend from VERIFIED results as of now; window overlap-checked per athlete (half-open)"
    roles: [CommitteeAdmin]
    code: 201
    input: [coverage_start, coverage_end, points_method]
    output: FundingAgreement
    side_effects: ["computes trailing_points, season_points, tier, monthly_stipend_cents via calculations.funding_points + tier_assignment"]

  - method: GET
    path: "/api/athletes/{id}/funding-agreements"
    description: "List an athlete's funding agreements"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FundingAgreement[]
    side_effects: []

  - method: GET
    path: "/api/funding-agreements/{id}"
    description: "Read one funding agreement including points, tier, stipend, insurance dimension and science-hours allocation"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: []
    output: FundingAgreement
    side_effects: []

  - method: POST
    path: "/api/funding-agreements/{id}/transitions"
    description: "Agreement lifecycle + insurance dimension; to_state selects unambiguously: ACTIVE (activate from OFFERED, resume from SUSPENDED, reassess self-loop from ACTIVE), SUSPENDED is cascade-only, TERMINATED, INS_ENROLLED (insurance dimension)"
    roles: [CommitteeAdmin]
    code: 200
    input: [to_state]
    output: FundingAgreement
    side_effects: ["activation/resume/termination reconcile committed_monthly_stipend_cents and the science-hours waterfall", "ACTIVE self-loop recomputes points and tier", "INS_ENROLLED gated by calculations.insurance_eligibility", "increments FundingAgreement.version by 1"]

  - method: POST
    path: "/api/athletes/{id}/abuse-reports"
    description: "File an abuse allegation concerning the subject athlete; routed to the independent body"
    roles: [Athlete, NGBAdmin, SafeSportOfficer, CommitteeAdmin]
    code: 201
    input: [reporter_role, allegation]
    output: AbuseReport
    side_effects: []

  - method: GET
    path: "/api/athletes/{id}/abuse-reports"
    description: "List abuse reports for the subject athlete; restricted read (subject athlete, safe sport, committee)"
    roles: [SafeSportOfficer, CommitteeAdmin, Athlete]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AbuseReport[]
    side_effects: []

  - method: POST
    path: "/api/abuse-reports/{id}/transitions"
    description: "Independent-body lifecycle: FORWARDED, then ADJUDICATED_SUBSTANTIATED | ADJUDICATED_UNSUBSTANTIATED"
    roles: [SafeSportOfficer]
    code: 200
    input: [to_state]
    output: AbuseReport
    side_effects: ["ADJUDICATED_SUBSTANTIATED triggers the abuse cascade (athlete suspension -> agreement suspension -> insurance lapse -> roster slot removal/promotion)", "increments AbuseReport.version by 1"]

  - method: POST
    path: "/api/governing-bodies/{id}/selection-procedures"
    description: "Draft a team selection procedure (published-in-advance ruleset with embedded trials)"
    roles: [NGBAdmin]
    code: 201
    input: [games_name, trials_start, trials_end, registration_deadline, qualifying_score, quota_slots]
    output: SelectionProcedure
    side_effects: []

  - method: GET
    path: "/api/governing-bodies/{id}/selection-procedures"
    description: "List a body's selection procedures including embedded entries"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["proc_status?", "limit?", "offset?"]
    output: SelectionProcedure[]
    side_effects: []

  - method: POST
    path: "/api/selection-procedures/{id}/transitions"
    description: "Procedure + trials lifecycle; to_state selects the dimension unambiguously: PUBLISHED | LOCKED | SUPERSEDED (procedure), REGISTRATION_OPEN | HELD | RESULTS_FINALIZED (trials; RESULTS_FINALIZED carries the results array atomically)"
    roles: [NGBAdmin]
    code: 200
    input: [to_state, "results?"]
    output: SelectionProcedure
    side_effects: ["PUBLISHED enforces MIN_PUBLISH_LEAD_DAYS", "LOCKED version-pins the procedure", "RESULTS_FINALIZED computes QUALIFIED/UNQUALIFIED per entry", "SUPERSEDED cascades rosters -> CANCELLED", "increments SelectionProcedure.version by 1"]

  - method: POST
    path: "/api/selection-procedures/{id}/entries"
    description: "Register an athlete into the trials (window-gated; requires ELIGIBLE athlete with cleared screening and current training)"
    roles: [NGBAdmin]
    code: 201
    input: [athlete_id]
    output: SelectionProcedure
    side_effects: ["appends {athlete_id, entry_status: REGISTERED, score: null, result_recorded_at: null} to entries", "increments SelectionProcedure.version by 1"]

  - method: POST
    path: "/api/selection-procedures/{id}/rosters"
    description: "Create an empty DRAFT roster for a procedure (one non-terminal roster per procedure)"
    roles: [NGBAdmin]
    code: 201
    input: []
    output: Roster
    side_effects: []

  - method: GET
    path: "/api/rosters"
    description: "List rosters, filterable by procedure and status"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["selection_procedure_id?", "status?", "limit?", "offset?"]
    output: Roster[]
    side_effects: []

  - method: GET
    path: "/api/rosters/{id}"
    description: "Read one roster including slots, quota_effective and bonus_slot_applied"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: []
    output: Roster
    side_effects: []

  - method: POST
    path: "/api/rosters/{id}/nominations"
    description: "Run the nomination selector (OCC-guarded): computes quota bonus then composite ranking; fills PRIMARY and ALTERNATE slots"
    roles: [NGBAdmin]
    code: 200
    input: [expected_roster_version]
    output: Roster
    side_effects: ["computes quota_effective and slots via calculations.quota_bonus + roster_composite_ranking", "nominated_at := current logical clock", "increments Roster.version by 1"]

  - method: POST
    path: "/api/rosters/{id}/transitions"
    description: "Roster moves: NOMINATED self-loop carrying slot_decisions (athlete accept/decline with promotion cascade), SUBMITTED, CONFIRMED"
    roles: [NGBAdmin, CommitteeAdmin, Athlete]
    code: 200
    input: [to_state, "slot_decisions?"]
    output: Roster
    side_effects: ["slot_decisions apply accept/decline + alternate promotion invariant", "SUBMITTED blocked by pending appeals or undecided PRIMARY slots", "CONFIRMED cascades procedure -> COMPLETED", "increments Roster.version by 1"]

  - method: POST
    path: "/api/rosters/{id}/appeals"
    description: "Athlete files a selection appeal to arbitration; window-gated to nominated_at + APPEAL_WINDOW_HOURS (72, inclusive)"
    roles: [Athlete]
    code: 201
    input: [grounds]
    output: Appeal
    side_effects: ["filed_at := current logical clock; filed_by_athlete_id := X-User-ID"]

  - method: GET
    path: "/api/rosters/{id}/appeals"
    description: "List appeals against a roster"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: GET
    path: "/api/athletes/{id}/appeals"
    description: "List appeals filed by an athlete"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/api/appeals/{id}/transitions"
    description: "Arbitration lifecycle: HEARING, UPHELD | DENIED (arbitrator), WITHDRAWN (filing athlete, from FILED only)"
    roles: [Arbitrator, Athlete]
    code: 200
    input: [to_state, "decision_rationale?"]
    output: Appeal
    side_effects: ["UPHELD cascades roster NOMINATED -> DRAFT and clears slots", "increments Appeal.version by 1"]

  - method: POST
    path: "/api/athletes/{id}/commercial-deals"
    description: "Propose a commercial deal licensing the athlete's image rights; exclusivity is a CLOSED interval per athlete with DEAL_EXCLUSIVITY_MIN_GAP_DAYS (1) between deals"
    roles: [CommitteeAdmin, NGBAdmin]
    code: 201
    input: [sponsor_name, gross_value_cents, basis, exclusivity_start, exclusivity_end]
    output: CommercialDeal
    side_effects: []

  - method: GET
    path: "/api/athletes/{id}/commercial-deals"
    description: "List an athlete's commercial deals"
    roles: [CommitteeAdmin, CertificationAuditor, NGBAdmin, SafeSportOfficer, Arbitrator, Athlete, ResultsOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommercialDeal[]
    side_effects: []

  - method: POST
    path: "/api/commercial-deals/{id}/transitions"
    description: "Deal lifecycle (OCC-guarded): CONSENT_GRANTED (subject athlete), ACTIVE (committee; computes revenue split), TERMINATED (committee or cascade)"
    roles: [Athlete, CommitteeAdmin]
    code: 200
    input: [to_state, expected_deal_version]
    output: CommercialDeal
    side_effects: ["ACTIVE computes committee_share_cents, ngb_share_cents, athlete_share_cents via calculations.revenue_split", "increments CommercialDeal.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/unknown X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for the endpoint, or entity-backed ownership mismatch (NGBAdmin/Athlete acting on another body's/athlete's resource), or appellant has no entry on the appealed procedure" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path or body FK reference does not resolve to an existing entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body: missing required field, wrong type, unknown enum member, empty required string" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition is not defined from the resource's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "resource is in a terminal state (DECERTIFIED, CLOSED_*, SUBSTANTIATED/DISMISSED, RETIRED, TERMINATED, CONFIRMED/CANCELLED, UPHELD/DENIED/WITHDRAWN, EXPIRED, ADJUDICATED_*)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_roster_version or expected_deal_version does not equal the resource's current version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "same user attempted both halves of a segregated pair (cycle issue/close, complaint triage/resolve, result submit/verify)" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 422, condition: "component score outside 0..100 or placing outside 1..8" }
  - { id: ERR_CYCLE_WINDOW_INVALID, http: 422, condition: "window_end <= window_start (or exclusivity_end < exclusivity_start)" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 409, condition: "new certification cycle window overlaps an existing cycle of the same body (half-open; adjacency allowed)" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "new funding agreement window overlaps another non-terminal agreement of the same athlete (half-open; adjacency allowed)" }
  - { id: ERR_DEAL_EXCLUSIVITY_OVERLAP, http: 409, condition: "deal exclusivity closed interval overlaps or sits within 1 day of another non-terminal deal of the same athlete" }
  - { id: ERR_PUBLISH_LEAD_TIME, http: 422, condition: "procedure publish attempted fewer than MIN_PUBLISH_LEAD_DAYS (90) before trials_start" }
  - { id: ERR_REGISTRATION_CLOSED, http: 422, condition: "trials entry attempted outside the registration window (trials not REGISTRATION_OPEN or past registration_deadline)" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "appeal filed later than roster.nominated_at + APPEAL_WINDOW_HOURS (72); the exact boundary is inclusive" }
  - { id: ERR_TRIALS_NOT_OPEN, http: 409, condition: "trials entry attempted while trials_status != REGISTRATION_OPEN" }
  - { id: ERR_SCREENING_NOT_CLEARED, http: 422, condition: "athlete screening not cleared or expired at trials entry / nomination" }
  - { id: ERR_TRAINING_EXPIRED, http: 422, condition: "safe-sport training missing or older than TRAINING_VALIDITY_DAYS (365) at trials entry / nomination" }
  - { id: ERR_ATHLETE_NOT_ELIGIBLE, http: 409, condition: "athlete eligibility_status != ELIGIBLE for trials entry, nomination, or funding activation" }
  - { id: ERR_DUPLICATE_ENTRY, http: 409, condition: "athlete already holds a non-DISQUALIFIED entry on this procedure" }
  - { id: ERR_RESULTS_NOT_FINAL, http: 409, condition: "nomination attempted before the procedure's trials reached RESULTS_FINALIZED" }
  - { id: ERR_PENDING_APPEALS, http: 409, condition: "roster submission blocked by a FILED or HEARING appeal" }
  - { id: ERR_PENDING_SLOT_DECISIONS, http: 409, condition: "roster submission blocked by an unanswered PRIMARY slot (NOMINATED/PROMOTED)" }
  - { id: ERR_DEAL_CONSENT_REQUIRED, http: 409, condition: "deal activation attempted before athlete consent (not in CONSENT_GRANTED)" }
  - { id: ERR_INSURANCE_NOT_ELIGIBLE, http: 422, condition: "insurance enrollment fails points threshold (INSURANCE_MIN_POINTS 60) or wait period (INSURANCE_WAIT_DAYS 30)" }
  - { id: ERR_FUNDING_BUDGET_EXCEEDED, http: 422, condition: "funding activation would push committed annual stipends past funding_budget_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CommitteeAdmin
    description: "USOPC committee staff: certifies, decertifies, appoints interim managers, administers funding offers and commercial deal activation, confirms rosters, drives the logical clock"
    identity: opaque
    exclusive_operations: ["governing body create/transitions", "certification cycle create", "funding agreement create/transitions", "commercial deal activation/termination", "roster CONFIRMED", "logical clock set"]
    shared_operations: ["all read endpoints", "commercial deal create", "abuse report file/read"]
  - name: CertificationAuditor
    description: "Independent auditors running certification cycles and complaint investigations; segregation of duties enforced between issuer/triager and closer/resolver"
    identity: opaque
    exclusive_operations: ["cycle transitions (open/issue-findings/close)", "complaint transitions (triage/investigate/resolve)"]
    shared_operations: ["complaint create", "all read endpoints"]
  - name: NGBAdmin
    description: "Staff of a governing body acting on their own body (X-User-ID == GoverningBody.id): owns selection procedures, trials entries, roster creation/nomination/submission"
    identity: "entity_backed:GoverningBody"
    exclusive_operations: ["selection procedure create/transitions/entries", "roster create/nominations", "roster submit (only when own body is CERTIFIED or PROBATION)"]
    shared_operations: ["athlete create for own body", "commercial deal create for own athletes", "abuse report file", "all read endpoints"]
  - name: Athlete
    description: "A registered athlete (X-User-ID == Athlete.id): submits own results, files appeals, consents to own commercial deals, answers own roster slots, self-retires"
    identity: "entity_backed:Athlete"
    exclusive_operations: ["own performance result submit/resubmit", "appeal file/withdraw", "deal consent", "slot decisions on own slots", "self RETIRED"]
    shared_operations: ["complaint create", "abuse report file", "all read endpoints"]
  - name: SafeSportOfficer
    description: "Independent safe-sport body staff: background screening adjudication, training records, eligibility moves, abuse report forwarding and adjudication"
    identity: opaque
    exclusive_operations: ["athlete screening/training/eligibility transitions", "abuse report transitions"]
    shared_operations: ["complaint create", "abuse report file/read", "all read endpoints"]
  - name: Arbitrator
    description: "Independent arbitrator resolving selection appeals"
    identity: opaque
    exclusive_operations: ["appeal transitions to HEARING/UPHELD/DENIED"]
    shared_operations: ["all read endpoints"]
  - name: ResultsOfficial
    description: "Results verification official; must not verify a result they submitted (segregation of duties)"
    identity: opaque
    exclusive_operations: ["result verify/reject"]
    shared_operations: ["all read endpoints"]
