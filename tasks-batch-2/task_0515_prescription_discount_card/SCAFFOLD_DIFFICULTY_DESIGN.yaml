              as_user_id: "${m_a_id}"
          trigger:
            - call: "POST /discount-cards/${card_id}/void"
              payload: { member_id: "${m_b_id}" }
              as: Member
              as_user_id: "${m_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: card_state_beats_pharmacy_mismatch_on_claim_create
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PHARMACY_MISMATCH]
        distinguishing_aspect: |
          Pair (state: ERR_INVALID_STATE, priority 5) vs (business_referential:
          ERR_PHARMACY_MISMATCH, priority 8): a POST /claims against a VOID card
          (card not ISSUED) AND with a pharmacy_id that differs from the card's
          pharmacy violates both; the higher-priority state check wins ->
          ERR_INVALID_STATE (409), distinct from the auth-vs-state pair above.
        test_recipe:
          setup:
            - "Two ACTIVE CA pharmacies PH1 (card pharmacy) and PH2 (wrong pharmacy)."
            - "Member M issues a DISCOUNT card at PH1, then VOIDs it."
            - "A claim is submitted against the VOID card but with pharmacy_id==PH2 (mismatch)."
