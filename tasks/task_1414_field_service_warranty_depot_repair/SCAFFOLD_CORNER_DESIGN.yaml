            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-2", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { u2: $.data.id } }
