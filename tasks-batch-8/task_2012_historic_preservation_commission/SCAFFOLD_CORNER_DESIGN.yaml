              payload: { amount_cents: 10400 }
              as: Applicant
              as_user_id: "${o_id}"
            - call: "POST /preservation/certificates"
              payload: { application_id: "${app_id}" }
              as: PreservationStaff
              captures: { cert_id: $.data.id, cert_conds: $.data.conditions }
          trigger:
            - call: "POST /preservation/certificates/${cert_id}/verify-conditions"
              payload: { conditions_met_count: 1 }
              as: PreservationStaff
              captures: { err: $.data.error_id }
            - call: "POST /preservation/certificates/${cert_id}/verify-conditions"
              payload: { conditions_met_count: 2 }
              as: PreservationStaff
              captures: { cert_status: $.data.status }
          assert:
