  # ===========================================================================
  - section: validations
    instances:
      - name: v_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A call without X-User-Role is rejected at priority 1 before anything else is evaluated."
        test_recipe:
          setup: ["nothing"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/buildings", as: "", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

      - name: v_wrong_role_on_cycle_create_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "BuildingOwner is not in the endpoint's role list; even a well-formed payload is a 403."
        test_recipe:
          setup: ["owner o1 exists"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner V2", contact_email: "ov2@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
          trigger:
            - call: "POST /v1/reporting-cycles"
              payload: { cycle_year: 2027, filing_deadline_at: "2027-06-01T00:00:00Z", covered_floor_area_threshold_sqft: 25000, covered_property_types: ["OFFICE"], late_fine_daily_rate_cents: 5000, late_fine_cap_days: 60, non_compliance_fine_cents: 500000, performance_standards: [{ property_type: "OFFICE", median_eui: 80, score_slope: 2, baseline_eui_default: 100, annual_reduction_pct: 10, shortfall_tolerance_pct: 5, fine_rate_cents_per_sqft: 5, performance_fine_cap_cents: 1000000 }] }
              as: BuildingOwner
              as_user_id: "${o1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (403)"

      - name: v_owner_cannot_patch_others_building
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: "Ownership (priority 3) precedes the OCC check (5): o1 patching o2's building gets ERR_NOT_RESOURCE_OWNER even with the correct current version."
        test_recipe:
          setup: ["owners o1 and o2; building b2 owned by o2 (version captured)"]
          setup_api_calls:
            - { call: "POST /v1/owners", payload: { name: "Owner V3a", contact_email: "ov3a@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o1: $.data.id } }
            - { call: "POST /v1/owners", payload: { name: "Owner V3b", contact_email: "ov3b@x.com" }, as: ComplianceOfficer, as_user_id: "officer-1", captures: { o2: $.data.id } }
            - { call: "POST /v1/buildings", payload: { address: "60 Main St", gross_floor_area_sqft: 50000, property_type: "OFFICE" }, as: BuildingOwner, as_user_id: "${o2}", captures: { b2: $.data.id, b2_v: $.data.version } }
          trigger:
            - { call: "PATCH /v1/buildings/${b2}", payload: { expected_building_version: "${b2_v}", address: "60 Hijack St" }, as: BuildingOwner, as_user_id: "${o1}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_RESOURCE_OWNER (403); building unchanged"

