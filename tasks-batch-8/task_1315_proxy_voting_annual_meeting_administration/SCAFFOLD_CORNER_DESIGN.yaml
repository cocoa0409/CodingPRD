  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: majority_of_votes_cast_exact_tie_fails
        claim_type: correct_result
        grounds: [calculations.weighted_tabulation]
        distinguishing_aspect: "MAJORITY_OF_VOTES_CAST uses strict > : for_votes * 2 == votes_cast is NOT a majority; a 2500/2500 tie yields FAIL."
        test_recipe:
          setup: ["meeting VOTING_OPEN; p1 MAJORITY_OF_VOTES_CAST; a1 2500 COMMON FOR, a2 2500 COMMON AGAINST"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Tie Corp", ticker: "TIE", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 2500 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder Two", account_number: "A-1002", share_class: "COMMON", shares_held: 2500 }
              as: TransferAgent
              captures: { a2_id: $.data.id, cn2: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a2_id}", channel: "INTERNET", choice: "AGAINST", control_number: "${cn2}" }
              as: Shareholder
              as_user_id: "${a2_id}"
          trigger:
            - call: "GET /proxy/proposals/${p1_id}/tabulation?variant=UNOFFICIAL"
              as: ProxyAdministrator
              captures: { outcome: $.data.projected_outcome, cast: $.data.votes_cast }
          assert:
            - "votes_cast == 5000"
            - "projected_outcome == FAIL (2500*2 == 5000 is not strictly greater)"

      - name: abstain_excluded_from_votes_cast
        claim_type: input_set_filtering
        grounds: [calculations.weighted_tabulation]
        distinguishing_aspect: "ABSTAIN votes are excluded from votes_cast: for 100 / abstain 900 / against 50 yields votes_cast == 150 and PASS (100*2=200 > 150), not 1050."
        test_recipe:
          setup: ["meeting VOTING_OPEN; p1 MAJORITY_OF_VOTES_CAST; a1 100 FOR, a2 900 ABSTAIN, a3 50 AGAINST (all COMMON)"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Abstain Co", ticker: "ABS", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "For One", account_number: "A-1001", share_class: "COMMON", shares_held: 100 }
              as: TransferAgent
