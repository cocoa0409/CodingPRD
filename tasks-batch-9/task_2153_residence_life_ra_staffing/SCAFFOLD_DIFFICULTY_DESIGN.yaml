  - rule_id: combinatorial_formula
    instances:

      - name: program_reimbursement_rounds_each_receipt_line_before_summing
        grounds:
          - calculations.program_reimbursement_amount
          - entities.ProgramEvent.fields.reimbursed_amount_cents
          - entities.Floor.fields.programming_spent_cents
          - entities.Floor.fields.programming_available_cents
          - state_machines.ProgramEvent.HELD_to_REIMBURSED
        distinguishing_aspect: |
          Mode (b) nested-rounding: five receipt lines (four FOOD at 10101 cents, one
          SUPPLIES at 2005 cents) reimburse to 32109 cents when each line is rate-applied
          and rounded half-up before summing, and to 32108 cents when the lines are
          grouped and rounded once; the scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "Kerr Hall floor 2 with a CERTIFIED, ACTIVE RA assigned to it."
            - "Floor 2 has programming_budget_cents 100000, all of it in the available bucket."
            - "ProgramEvent 'Floor Feast' (SOCIAL, requested_amount_cents 40000) is APPROVED, so encumbered is 40000 and available is 60000."
            - "The logical clock has been moved past the event's scheduled_for and the event has been HELD with attendance 30."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Ada Ray", email: "ada@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_ada_id: $.data.id }
            - call: "POST /residence-life/ra-applications"
              payload: { applicant_student_id: "${s_ada_id}", term_code: "2026FA", essay_ref: "E-ADA" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { app_id: $.data.id }
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_ada_id}"
            - call: "POST /residence-life/ra-applications/${app_id}/review"
              payload: { interview_score: 88 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/decision"
              payload: { decision: "OFFER" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/response"
              payload: { response: "ACCEPT" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { ra_id: $.data.created_ra_id }
            - call: "POST /residence-life/ras/${ra_id}/floor-assignment"
              payload: { floor_id: "${f_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/employment"
              payload: { action: "ACTIVATE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/certification"
              payload: { action: "START_TRAINING" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "CRISIS" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "TITLE_IX" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "FIRE_SAFETY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "DIVERSITY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/certification"
              payload: { action: "CERTIFY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/floors/${f_id}/budget-allocations"
              payload: { amount_cents: 100000, term_code: "2026FA" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/program-events"
              payload: { floor_id: "${f_id}", title: "Floor Feast", category: "SOCIAL", scheduled_for: "2026-08-03T18:00:00Z", requested_amount_cents: 40000 }
              as: ResidentAssistant
              as_user_id: "${ra_id}"
              captures: { pe_id: $.data.id }
            - call: "POST /residence-life/program-events/${pe_id}/decision"
              payload: { decision: "APPROVE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T19:00:00Z" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/program-events/${pe_id}/outcome"
              payload: { action: "HOLD", attendance_count: 30 }
              as: ResidentAssistant
              as_user_id: "${ra_id}"
          trigger:
            - call: "POST /residence-life/program-events/${pe_id}/reimbursement"
              payload: { receipt_lines: [{ line_category: "FOOD", amount_cents: 10101 }, { line_category: "FOOD", amount_cents: 10101 }, { line_category: "FOOD", amount_cents: 10101 }, { line_category: "FOOD", amount_cents: 10101 }, { line_category: "SUPPLIES", amount_cents: 2005 }] }
              as: ResidenceDirector
              as_user_id: "rd-1"
          assert:
            - "ProgramEvent.${pe_id}.reimbursed_amount_cents == 32109"
            - "ProgramEvent.${pe_id}.status == REIMBURSED"
            - "ProgramEvent.${pe_id}.encumbered_amount_cents == 0"
            - "Floor.${f_id}.programming_spent_cents == 32109"
            - "Floor.${f_id}.programming_encumbered_cents == 0"
            - "Floor.${f_id}.programming_available_cents == 67891"
            - "Floor.${f_id}.programming_budget_cents == 100000"

      - name: damage_settlement_admin_tier_then_hardship_relief_evaluation_order
        grounds:
          - calculations.damage_charge_settlement
          - entities.DamageCharge.fields.admin_fee_cents
          - entities.DamageCharge.fields.hardship_relief_cents
          - entities.DamageCharge.fields.final_amount_cents
          - entities.Student.fields.financial_hardship_flag
          - state_machines.DamageCharge.PENDING_to_BILLED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the admin tier is keyed on gross 25900
          (>= 20000 so 10%, fee 2590) while the hardship relief is keyed on the
          fee-inclusive total 28490 (25% = 7123, capped at 5000), giving final 23490;
          keying either step off the other base yields a different number, so the
          scaffold pins the six-step order.
        test_recipe:
          setup:
            - "Kerr Hall floor 2, room 201 (bed_capacity 2, last_renovation_year 2021) and a CERTIFIED, ACTIVE RA on floor 2."
            - "Bo Lin, financial_hardship_flag true, is the sole resident of room 201."
