              as_user_id: "adm-r4"
          assert:
            - "ConsumerComplaint.${cmp_r4_id}.investigator_user_id == inv-r4 after the investigation"
            - "trigger 1: HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES; status stays UNDER_INVESTIGATION"
            - "trigger 2: HTTP 200 — status == CLOSED_SUBSTANTIATED with restitution_ordered_cents 100000, civil_penalty_cents 205000 and points_assessed 3"
            - "Dealer.${dlr_r4_id}.restitution_outstanding_cents == 100000 AND disciplinary_points == 3"

  - section: cross_cutting_complexity_layers
    instances:
      - name: protest_against_an_amended_notice_needs_the_fresh_filing_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.protest-create-stale-filing
          - errors[ERR_STALE_FILING_VERSION]
        distinguishing_aspect: "The §1.2.1 protest-create-stale-filing rule is exercised end to end: the franchisor's amendment advances the filing version and restarts the window, the protest computed against the pre-amendment version is refused 412, and the identical protest with the re-read version is docketed."
        test_recipe:
          setup:
            - "Licensed FRANCHISED AURORA dealer; TERMINATION notice served 2026-09-01, then amended on 2026-09-10 to a 2026-12-15 effective date."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
