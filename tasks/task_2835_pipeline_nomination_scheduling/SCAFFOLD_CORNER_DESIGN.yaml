        claim_type: Violation → Error
        grounds:
          - errors[ERR_MAINTENANCE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / maintenance_window_buffer_conflict_on_segment
          rationale: "The buffered overlap arithmetic that produces this error, including the exactly-abutting acceptance, is asserted by the named §1.8 instance."

