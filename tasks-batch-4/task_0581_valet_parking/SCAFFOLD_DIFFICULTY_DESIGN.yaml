      - name: net_charge_conserved_grant_apply_reverse
        grounds:
          - calculations.validation_net_charge
          - entities.Ticket.fields.net_charge_cents
          - entities.Ticket.fields.final_fee_cents
          - entities.ValidationGrant.fields.status
        distinguishing_aspect: |
          Conserved quantity = ticket net receivable (money): applying a FLAT 500 grant drops net_charge_cents
          from 2900 to 2400, and reversing it restores net_charge_cents to 2900 == final_fee_cents — no cent
          drift.
        test_recipe:
          setup:
            - "Ticket checked in 10:00, checked out 12:30 (final_fee 2900, net 2900)."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Inv2 Venue", address: "18 Fir Ct" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "Inv2Evt", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "I2", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /valet/tickets/${ticket_id}/checkout"
              payload: { checkout_at: "2026-06-01T12:30:00Z" }
              as: Cashier
            - call: "POST /valet/tickets/${ticket_id}/validations"
              payload: { grant_type: "FLAT", value: 500 }
              as: Cashier
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /valet/validation-grants/${grant_id}/reverse"
              payload: {}
              as: Cashier
          assert:
            - "Ticket.${ticket_id}.net_charge_cents == 2900"
            - "Ticket.${ticket_id}.final_fee_cents == 2900"
            - "ValidationGrant.${grant_id}.status == REVERSED"
