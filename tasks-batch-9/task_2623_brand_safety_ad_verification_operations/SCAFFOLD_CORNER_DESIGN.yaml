            - "MethodologyVersion.${mv_view_id}.accreditation_status is still PROVISIONAL after trigger 2 and its version is still ${mv_view_ver}"
            - "Trigger 4: HTTP 201 - intake is not a scoring request, so a batch may be ingested against a version whose window has closed"
            - "Trigger 5: HTTP 409 and ${err_lapsed} == ERR_METHODOLOGY_LAPSED; MeasurementBatch.${batch_l}.scoring_status is still INGESTED"
            - "Trigger 5 also flipped the version: MethodologyVersion.${mv_view_id}.accreditation_status == LAPSED and version == ${mv_view_ver} + 1 - the system transition fires first and then rejects the triggering request"
            - "Trigger 6: HTTP 409 and ${err_lapsed_2} == ERR_METHODOLOGY_LAPSED - certify is guarded too, so the already-SCORED early batch is now stranded in SCORED and never reaches CERTIFIED"
            - "MethodologyVersion.${mv_view_id}.version is still ${mv_view_ver} + 1 after trigger 6: LAPSED is terminal and the flip is not applied twice"
