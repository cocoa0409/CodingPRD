  - rule_id: boundary_precision_check
    instances:
      - name: delta_e_exactly_two_passes
        grounds:
          - state_machines.ColorMeasurement.PENDING_to_PASS
          - errors[ERR_DELTA_E_EXCEEDS_LIMIT]
        distinguishing_aspect: |
          Boundary on the Delta-E metric via the judge endpoint: delta_e == 2.0
          judges PASS (rule is delta_e <= 2.0) while delta_e == 2.01 is rejected
          with ERR_DELTA_E_EXCEEDS_LIMIT — the <= boundary decides the verdict.
        test_recipe:
          setup:
            - "Full chain to ON_PRESS: customer, approved 2-color artwork, substrate, ink, shelf die, press; job released and started"
            - "Two measurements recorded: m_edge delta_e 2.0 (station 1), m_over delta_e 2.01 (station 2)"
