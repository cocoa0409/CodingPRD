        grounds: ["concurrency_rules[dispatch-create-stale-team]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one dispatch advances MobileCrisisTeam.version, a second create carrying the previously-observed (now stale) expected_team_version returns 412 ERR_STALE_VERSION even though a slot remains."
