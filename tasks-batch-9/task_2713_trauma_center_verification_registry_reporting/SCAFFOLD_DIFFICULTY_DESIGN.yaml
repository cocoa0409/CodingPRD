              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { ab1: $.data.id }
            - call: "POST /abstractions/${ab1}/validate"
              payload: {}
              as: RegistryValidator
              as_user_id: "u_validator_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "GET /registry-cases/${k1}"
              payload: {}
              as: RegistryAbstractor
