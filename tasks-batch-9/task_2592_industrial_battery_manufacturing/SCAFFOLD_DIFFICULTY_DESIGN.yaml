  - rule_id: resource_temporal_overlap
    instances:
      - name: formation_bay_single_occupancy_with_two_sided_cooldown_buffer
        grounds:
          - validations[priority 15 -> ERR_BAY_WINDOW_CONFLICT]
          - entities.FormationBay.fields.cooldown_minutes
          - endpoints[POST /formation-runs]
        distinguishing_aspect: |
          Resource: FormationBay, semantics: CLOSED intervals with single occupancy AND a
          cooldown buffer applied on BOTH sides, so the effective exclusion zone is
          [start - 45 min, end + 45 min] rather than the booked window. Touching
          endpoints collide. The four probes pin both edges of the buffer to the minute:
          12:30 collides with a run ending at 12:00, 12:45 does not, a window ENDING at
          05:20 collides with a run starting at 06:00, and one ending at 05:00 does not.
        test_recipe:
          setup:
            - "One bay with cooldown_minutes 45 already carrying a SCHEDULED run over [06:00, 12:00) for LOT-I1; two more lots in FORMATION so each accepted probe books a distinct lot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID", "LITHIUM_LFP"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
