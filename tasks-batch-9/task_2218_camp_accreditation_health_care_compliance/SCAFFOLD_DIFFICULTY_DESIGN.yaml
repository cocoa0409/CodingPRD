  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: visit_schedule_blocked_by_pending_state_license_then_allowed_after_reinstatement
        grounds:
          - validations.ERR_STATE_LICENSE_BLOCKS_VISIT
          - state_machines.Camp.state_license_status
          - state_machines.AccreditationVisit.DRAFT_to_SCHEDULED
          - state_machines.AccreditationCycle.SELF_ASSESSMENT_to_VISIT_SCHEDULED
          - calculations.camp_compliance_posture
          - endpoints.PATCH_/accreditation/camps/{campId}/state-license
        distinguishing_aspect: |
          The pair is (AccreditationVisit.status, Camp.state_license_status) - a visit
          transition guarded by a state axis on a different entity that a different
          role owns, and one the accreditation workflow never writes. The gate is also
          non-monotonic in the obvious ordering: NONE and PROBATION both permit
          scheduling while PENDING, which sits between them in the licensing lifecycle,
          blocks it, so a rank comparison on the enum cannot reproduce the rule.
        test_recipe:
          setup:
            - "Standards edition ACA-2026-L is PUBLISHED with SU.1 SUPERVISION mandatory scoring_weight 1, universal and with requires_state_licensed false."
            - "Larch Day Camp is a DAY / YOUTH_ONLY camp in OH with health_staffing_level FIRST_AIDER_ONLY, so required_specialist_domains is empty."
            - "A StateLicensingAgent moves the camp NONE -> PENDING before the cycle is opened, which makes compliance_posture RESTRICTED but not FROZEN."
