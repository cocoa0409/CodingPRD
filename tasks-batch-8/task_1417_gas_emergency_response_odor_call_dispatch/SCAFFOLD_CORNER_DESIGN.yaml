  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_reclassify_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[incident-reclassify-stale-version]", "errors[ERR_STALE_INCIDENT_VERSION]"]
        distinguishing_aspect: "OCC on GasIncident.version: a reclassify carrying the version observed before a prior successful reclassify (which bumped the version) is rejected with 412; the same call with the fresh version succeeds."
        test_recipe:
          setup: ["T1; TRIAGED P3 incident; client observed version v (post-triage)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Z13", caller_phone: "555-0237", address_line: "13 Occ St", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P3" }
              as: Dispatcher
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
              captures: { inc_v: "$.data.version" }
          trigger:
            - call: "POST /gas-ops/incidents/${inc_id}/reclassify-priority"
              payload: { new_priority: "P2", expected_incident_version: "${inc_v}", reason: "first reclassify" }
              as: Supervisor
            - call: "POST /gas-ops/incidents/${inc_id}/reclassify-priority"
              payload: { new_priority: "P1", expected_incident_version: "${inc_v}", reason: "stale retry" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
              captures: { inc_v2: "$.data.version" }
            - call: "POST /gas-ops/incidents/${inc_id}/reclassify-priority"
              payload: { new_priority: "P1", expected_incident_version: "${inc_v2}", reason: "fresh retry" }
              as: Supervisor
          assert:
            - "First reclassify succeeds and increments GasIncident.version by 1"
            - "Second reclassify with the stale captured version: error_id == ERR_STALE_INCIDENT_VERSION, HTTP 412"
            - "Priority still P2 after the stale rejection (no partial mutation)"
            - "Third reclassify with the fresh version succeeds: priority == P1"

