              as: Dispatcher
              as_user_id: "disp-1"
          assert:
            - "Vessel.${vessel_id}.service_state == IN_SERVICE"
            - "Vessel.${vessel_id}.annual_inspection_expires_on == 2027-08-01"
            - "GET /harbor/vessels/${vessel_id}/inspections returns total_count 2"
      - name: pro_rata_unit_price_rounds_half_up_and_can_exceed_the_purchase_price
        claim_type: Precision
        grounds: ["calculations.ride_pass_residual_value", "entities.RidePass.fields.refund_amount_cents"]
        distinguishing_aspect: |
          9995 cents over 10 rides gives a unit of exactly 999.5, which round_half_up turns into 1000, so an
          entirely unused pass settles at 10000 cents - one cent per ride more than was paid. Truncation would
          wrongly give 9990.
        test_recipe:
          setup:
            - "An OUTER pass owned by rider-ann with 10 rides bought for 9995 cents and no rides consumed."
          setup_api_calls:
            - call: "POST /harbor/ride-passes"
              payload: { zone_tier: "OUTER", rides_purchased: 10, purchase_price_cents: 9995, valid_until: "2026-12-31" }
              as: Rider
              as_user_id: "rider-ann"
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /harbor/ride-passes/${pass_id}/refund"
              payload: { settlement_basis: "PRO_RATA" }
              as: Rider
              as_user_id: "rider-ann"
          assert:
            - "RidePass.${pass_id}.refund_amount_cents == 10000"
            - "RidePass.${pass_id}.refund_basis == PRO_RATA"
            - "RidePass.${pass_id}.rides_remaining == 0"
            - "RidePass.${pass_id}.status == REFUNDED"
      - name: dual_variant_landing_fee_delta_between_provisional_and_final
        claim_type: Variant Divergence
        grounds: ["calculations.dock_slot_fee_posting"]
        excluded_because:
          difficulty_instance: dual_variant_calc / dock_landing_fee_provisional_versus_final_diverges_on_pax_and_minutes
          rationale: "That instance asserts 1400 provisionally against 1760 finally on the same slot."
      - name: fare_quote_rounding_order_changes_the_cents
        claim_type: Precision
        grounds: ["calculations.booking_fare_quote"]
        excluded_because:
          difficulty_instance: combinatorial_formula / fare_quote_rounds_per_seat_after_each_multiplier_then_multiplies_by_party
          rationale: "That instance pins 3807 against the 3806 produced by rounding only once."
      - name: interruption_refund_caps_the_cash_bucket_at_5000_and_overflows_into_harbor_credit
        claim_type: waterfall_allocation
        grounds: ["calculations.interruption_refund_waterfall", "entities.RefundClaim.fields.cash_refund_cents", "entities.RefundClaim.fields.credit_refund_cents"]
        distinguishing_aspect: |
          A 5100-cent entitlement fills the cash bucket to its 5000-cent cap and pushes the remaining 100 into
          the credit bucket, in that pinned bucket order; ride_restored stays false because no pass was tendered.
        test_recipe:
          setup:
            - "Stops at zone 1 (Ferry Landing) and zone 4 (Outer Point), so the hop has zone_span 3 and base_cents 1275."
            - "ServiceDay 2026-09-13 with no event, so surge_multiplier_bp is 10000 and a 4-seat cash booking quotes 5100 cents."
            - "One SCHEDULED trip Ferry Landing -> Outer Point on that day with the booking confirmed on it."
