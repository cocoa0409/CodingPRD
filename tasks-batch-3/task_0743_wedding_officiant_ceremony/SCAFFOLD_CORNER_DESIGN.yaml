      - name: create_booking_unknown_venue_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_VENUE_NOT_FOUND]"
        distinguishing_aspect: "POST /bookings with a valid officiant/couple/package but unknown venue_id returns ERR_VENUE_NOT_FOUND (404)."
        test_recipe:
