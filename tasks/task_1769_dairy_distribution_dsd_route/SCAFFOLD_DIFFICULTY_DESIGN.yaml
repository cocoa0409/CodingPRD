  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_trumps_fiscal_on_confirm
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_ORDER_NOT_CONFIRMABLE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): confirming a
          CANCELLED order whose estimated subtotal (2500c) also exceeds the
          store credit limit (1000c) MUST return ERR_ORDER_NOT_CONFIRMABLE
          (priority 6), not ERR_CREDIT_LIMIT_EXCEEDED (priority 11). Companion
          instance uses the (business_temporal vs business_constraint) pair.
        test_recipe:
          setup:
            - "Distributor, ACTIVE route, store with credit_limit_cents 1000, driver, product PL 250c; trip; order O1 of 10 units (est. subtotal 2500 > limit) created then CANCELLED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist J", license_number: "LIC-J-1" }
              as: TerritoryManager
              captures: { d1: $.data.id }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-J", name: "Route J", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: $.data.id }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-J", name: "Store J", credit_limit_cents: 1000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: $.data.id }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "BUTTER-5", name: "Butter", units_per_case: 1, shelf_life_days: 60, regulated: false, list_price_cents: 250 }
              as: TerritoryManager
              captures: { pl: $.data.id }
            - call: "POST /dairy/drivers"
              payload: { distributor_id: "${d1}", name: "Jay Driver", cdl_class: "A" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr1: $.data.id }
            - call: "POST /dairy/trips"
              payload: { route_id: "${r1}", driver_id: "${dr1}", service_date: "2026-08-10", truck_plate: "TK-1", case_capacity: 1000, planned_depart_at: "2026-08-10T05:00:00Z", planned_return_at: "2026-08-10T13:00:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /dairy/orders"
              payload: { store_id: "${s1}", trip_id: "${t1}", lines: [{ product_id: "${pl}", quantity_units: 10 }], delivery_window_start: "2026-08-10T08:00:00Z", delivery_window_end: "2026-08-10T08:30:00Z" }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - { call: "POST /dairy/orders/${o1}/cancel", payload: {}, as: DistributorOwner, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /dairy/orders/${o1}/confirm", payload: {}, as: DistributorOwner, as_user_id: "${d1}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_ORDER_NOT_CONFIRMABLE (state priority 6 beats fiscal priority 11 even though 2500 > 1000 would also fail)"

      - name: temporal_trumps_constraint_on_confirm
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_DOCK_WINDOW_CONFLICT]
          - errors[ERR_TRIP_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_constraint):
          confirming an order that violates BOTH the 15-minute dock buffer (gap
          of 5 minutes) AND the trip case capacity (60 > 50) MUST return
          ERR_DOCK_WINDOW_CONFLICT (priority 8), not ERR_TRIP_CAPACITY_EXCEEDED
