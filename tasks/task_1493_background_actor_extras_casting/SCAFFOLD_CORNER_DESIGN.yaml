  - section: consistency_model
    instances:
      - name: immediate_consistency_after_cascade
        claim_type: immediate
        grounds: [calculations.payroll_batch_gross, entities.Production.fields.payroll_exposure_cents]
        distinguishing_aspect: "Immediate consistency: the dispute cascade's batch and production effects are visible in the very next GETs (no async lag)."
        excluded_because:
          difficulty_instance: dispute_strips_batch_and_exposure
          rationale: "The difficulty instance reads PayrollBatch.gross_total_cents and Production.payroll_exposure_cents in the same request sequence immediately after the dispute trigger and pins the recomputed values."
      - name: replacement_accept_window_shooting
        claim_type: guarded_transition
        grounds: [state_machines.Booking.OFFERED_to_CONFIRMED]
        distinguishing_aspect: "Replacement bookings accept while SHOOTING (the complement window to normal_accept_during_shooting_rejected)."
        excluded_because:
          difficulty_instance: replacement_case_negotiation_rounds
          rationale: "The third replacement offer is accepted while the call is SHOOTING and the case goes FILLED — the replacement window is exercised as the success path of that instance."
      - name: estimate_vs_final_pending_bump_inclusion
        claim_type: variant_divergence
        grounds: [calculations.voucher_gross_estimate]
        distinguishing_aspect: "PENDING bumps enter the estimate but not the final; APPROVED-only set in final."
        excluded_because:
          difficulty_instance: voucher_estimate_vs_final_divergence
          rationale: "Same claim asserted with pinned literals (estimate 15313 includes the 2500 PENDING bump; final 10938 excludes it)."

