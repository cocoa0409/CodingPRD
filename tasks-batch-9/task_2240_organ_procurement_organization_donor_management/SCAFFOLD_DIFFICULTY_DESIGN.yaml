  - rule_id: transitive_cascade
    instances:
      - name: authorization_rescission_cascade_depth_five
        grounds:
          - state_machines.Authorization.AUTHORIZED_to_RESCINDED
          - state_machines.DeathReferral.CONVERTED_to_NOT_CONVERTED
          - state_machines.DonorCase.allocation_status_to_CLOSED_on_rescission
          - state_machines.Organ.to_NON_TRANSPLANTABLE_on_case_closure
          - state_machines.MatchRun.OPEN_to_CLOSED_on_cascade
          - state_machines.RecoveryOperation.SCHEDULED_to_CANCELLED_on_case_closure
        distinguishing_aspect: |
          Depth 5, triggered by a next-of-kin OBJECTION: hop 1 Authorization AUTHORIZED -> RESCINDED
          because a rank-1 relative objects while consent came from rank 2; hop 2 fires only because
          the packet rescinded (referral CONVERTED -> NOT_CONVERTED, hospital converted_donor_count
          decremented, case allocation_status -> CLOSED / case_posture FROZEN); hop 3 fires only
          because the case closed (organ -> NON_TRANSPLANTABLE, accepted_offer_id nulled); hop 4 fires
          only because the organ left ACCEPTED (its offers -> BYPASSED with bypass_reason CASE_CLOSED);
          hop 5 fires only because the case closed (RecoveryOperation -> CANCELLED, returning the
          team's OR minutes). No hop is reachable without its predecessor.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-14T07:00:00Z."
            - "A next-of-kin authorization consented at rank 2 (ADULT_CHILD) after SPOUSE was UNREACHABLE, AUTHORIZED, with a CONVERTED referral, a DonorCase, one LIVER organ ACCEPTED off a CLOSED match run, and a SCHEDULED recovery operation holding 240 OR minutes."
