            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Sorrel Lane", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-SL-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "S-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Grace Adeyemi", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 140000, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { cert_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-03-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/monitoring-reviews", payload: { unit_id: "${u_id}", review_year: 2027, reported_rent_cents: 165000, reported_income_cents: 6000000, occupancy_verified: true }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { rev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-04-05T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/monitoring-reviews/${rev_id}/submit-cure", payload: { corrected_rent_cents: 143872 }, as: Developer, as_user_id: "dev-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-05-05T00:00:00Z" }, as: ProgramAdministrator }
            - call: "POST /iz-compliance/monitoring-reviews/${rev_id}/submit-cure"
              payload: { corrected_rent_cents: 143872 }
              as: Developer
              as_user_id: "dev-1"
            - call: "POST /iz-compliance/monitoring-reviews/${rev_id}/clear-cure"
              payload: {}
              as: HousingComplianceOfficer
              as_user_id: "hco-2"
          assert:
            - "entering the trigger, MonitoringReview.${rev_id}.state == ESCALATED with penalty_final_cents == 113384 and AffordableUnit.${u_id}.compliance_status == OUT_OF_COMPLIANCE and Project.${p_id}.compliance_posture == UNDER_ENFORCEMENT"
            - "after the second submit-cure, MonitoringReview.${rev_id}.state == CURE_SUBMITTED (the cycle re-entry)"
            - "MonitoringReview.${rev_id}.cure_submitted_at == 2027-05-05T00:00:00Z"
            - "MonitoringReview.${rev_id}.penalty_final_cents == 138384 (elapsed 65 days, months 3)"
            - "MonitoringReview.${rev_id}.cure_deadline is still 2027-03-31 and cure_extension_days is still 0"
            - "AffordableUnit.${u_id}.compliance_status == CURE_PENDING and Project.${p_id}.compliance_posture == COMPLIANT_ONSITE"
            - "after clear-cure, MonitoringReview.${rev_id}.state == CURED, cleared_by_user_id == hco-2, AffordableUnit.${u_id}.compliance_status == COMPLIANT"
            - "MonitoringReview.${rev_id}.penalty_final_cents remains 138384 after clear-cure — clearing does not re-evaluate the penalty"

  # ===========================================================================
  # RULE 4 — transitive cascades from two different triggering transitions
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: withdraw_unit_cascades_to_substitution_fee_and_posture_flip
        cascade_depth: 4
        grounds:
          - state_machines.AffordableUnit.occupancy_status
          - calculations.project_obligation_equivalents
          - calculations.in_lieu_fee_assessment
          - calculations.project_compliance_posture
        distinguishing_aspect: |
          Triggering transition: AffordableUnit.occupancy_status PLANNED -> WITHDRAWN. Each
          link is caused strictly by the previous one — L1 withdraws the unit; L2 recomputes
          onsite_unit_equivalents_bps to 0 BECAUSE the unit left the pool, which makes the
          posture DEFICIENT; L3 assesses a SUBSTITUTION InLieuFee BECAUSE the posture became
          DEFICIENT on an ONSITE project; L4 recomputes fee_covered_equivalents_bps to 10000
          and the posture to COMPLIANT_BY_FEE BECAUSE that fee now exists. An implementation
          that stops at L2 leaves the project DEFICIENT with no fee; one that stops at L3
          leaves a fee that does not count toward coverage.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) screened SUBJECT with required_affordable_units 1 and total_obligation_bps 10000; ONSITE path; agreement recorded."
            - "One RENTAL 2-bedroom unit created, so onsite_unit_equivalents_bps is 10000 and compliance_posture is COMPLIANT_ONSITE; nobody is certified, so the unit is still PLANNED and therefore withdrawable."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Hawthorn Flats", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-HF-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "H-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
          trigger:
            - call: "POST /iz-compliance/affordable-units/${u_id}/withdraw"
              payload: { reason: "Unit converted to a market-rate townhouse during value engineering." }
              as: Developer
