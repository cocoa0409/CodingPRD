      - name: sea_service_dispute_resubmit_cycle
        grounds:
          - state_machines.SeaServiceRecord.SUBMITTED_to_DISPUTED
          - state_machines.SeaServiceRecord.DISPUTED_to_SUBMITTED
          - state_machines.SeaServiceRecord.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Cyclic machine on SeaServiceRecord (different entity than Credential/Assignment):
          SUBMITTED -> DISPUTED -> SUBMITTED -> DISPUTED -> SUBMITTED -> VERIFIED; verified_days
          stays null through every loop iteration and is computed exactly once at the terminal
          verify.
        test_recipe:
          setup:
            - "Mariner + vessel; one OCEAN EIGHT_HOUR record 2025-01-01..2025-01-30 (30 calendar days)"
            - "Record cycled: submit, dispute, resubmit, dispute, resubmit (recorder = mariner, so officer may verify)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Loop One", mariner_reference_number: "MRN-NL3-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /vessels", payload: { vessel_name: "SS Loop", imo_number: "IMO-NL3", vessel_class: "BULK", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/sea-service-records", payload: { vessel_id: "${v_id}", position_code: "AB", rank_track: "DECK", rank_grade: 5, service_region: "OCEAN", watch_schedule: "EIGHT_HOUR", start_date: "2025-01-01T00:00:00Z", end_date: "2025-01-30T00:00:00Z" }, as: Mariner, as_user_id: "${m_id}", captures: { r_id: $.data.id, r_prov: $.data.provisional_days, r_ver_0: $.data.verified_days } }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r_id}/submit", payload: {}, as: Mariner, as_user_id: "${m_id}" }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r_id}/dispute", payload: { reason: "missing vessel logs" }, as: CredentialingOfficer, captures: { r_d1: $.data.record_status, r_reason_1: $.data.dispute_reason } }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r_id}/submit", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { r_s2: $.data.record_status } }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r_id}/dispute", payload: { reason: "dates inconsistent with discharge" }, as: CredentialingOfficer, captures: { r_reason_2: $.data.dispute_reason } }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r_id}/submit", payload: {}, as: Mariner, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /mariners/${m_id}/sea-service-records/${r_id}/verify", payload: {}, as: CredentialingOfficer, captures: { r_final: $.data.record_status, r_ver: $.data.verified_days, r_verifier: $.data.verified_by_user_id } }
          assert:
            - "r_prov == 30.0 and r_ver_0 == null (provisional computed at create; verified null until VERIFIED)"
            - "r_d1 == DISPUTED and r_reason_1 == 'missing vessel logs'"
            - "r_s2 == SUBMITTED (DISPUTED -> SUBMITTED resubmission edge)"
            - "r_reason_2 == 'dates inconsistent with discharge' (second loop overwrote the reason)"
            - "r_final == VERIFIED and r_ver == 30.0 (30 x 1.0 x 1.0) computed only at terminal verify"
            - "r_verifier != Mariner id ${m_id} (SoD held; verifier is the opaque officer)"

  - rule_id: transitive_cascade
    instances:
      - name: clock_credential_expiry_deep_cascade
        grounds:
          - calculations.credential_expiry_sweep
          - state_machines.Credential.VALID_to_EXPIRED
          - state_machines.Credential.SUSPENDED_PREREQ
          - state_machines.Assignment.CONFIRMED_to_SUSPENDED
          - entities.Mariner.fields.readiness_posture
        distinguishing_aspect: |
          Depth-4 cascade from the clock trigger (different trigger than the drug-test and
          no-show cascades): clock-set -> C1 EXPIRED -> C2 SUSPENDED_PREREQ (self-referential
          prerequisite hop) -> Mariner BLOCKED -> future CONFIRMED Assignment SUSPENDED. Each
          hop is caused by the previous hop's mutation, not by the clock directly.
        test_recipe:
          setup:
            - "M activated CLEAR: medical expiry 2027-06-01, drug until 2027-01-02, C1 MMC_BASE/DECK_AB expiry 2026-09-05 (35d > 30d at clock 2026-08-01), C2 TANKER/TANKER_PIC expiry 2028-01-01 with prerequisite C1"
            - "Vessel ACTIVE, AB slot, rotation plan; A1 CONFIRMED sign_on 2026-10-01 relief 2027-01-01 local_join"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Cascade One", mariner_reference_number: "MRN-TC1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2026-09-05T00:00:00Z" }, as: CredentialingOfficer, captures: { c1_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "TANKER", endorsement_code: "TANKER_PIC", issue_date: "2026-02-01T00:00:00Z", expiry_date: "2028-01-01T00:00:00Z", prerequisite_credential_id: "${c1_id}" }, as: CredentialingOfficer, captures: { c2_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin, captures: { m_posture_0: $.data.readiness_posture } }
            - { call: "POST /vessels", payload: { vessel_name: "SS Cascade", imo_number: "IMO-TC1", vessel_class: "TANKER", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: true, standard_tour_days: 90 }, as: PortCaptain, captures: { s_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_ver: $.data.version } }
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", standard_tour_days: 90, max_handover_overlap_days: 3, expected_vessel_version: "${v_ver}" }, as: CrewingManager }
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-10-01T00:00:00Z", planned_relief_date: "2027-01-01T00:00:00Z", local_join: true }, as: CrewingManager, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/confirm", payload: {}, as: CrewingManager }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: FleetAdmin }
            - { call: "GET /credentials/${c1_id}", as: CredentialingOfficer, captures: { c1_status: $.data.status } }
            - { call: "GET /credentials/${c2_id}", as: CredentialingOfficer, captures: { c2_status: $.data.status } }
            - { call: "GET /mariners/${m_id}", as: CrewingManager, captures: { m_posture: $.data.readiness_posture, m_reasons: $.data.readiness_reasons } }
            - { call: "GET /assignments/${a_id}", as: CrewingManager, captures: { a_status: $.data.assignment_status } }
          assert:
            - "m_posture_0 == CLEAR (C1 expiry 35 days out at activation)"
            - "c1_status == EXPIRED (hop 1: expiry 2026-09-05 < clock 2026-09-10)"
            - "c2_status == SUSPENDED_PREREQ (hop 2: prerequisite cascade — NOT EXPIRED; own expiry is 2028-01-01)"
            - "m_posture == BLOCKED and m_reasons contains NO_VALID_PRIMARY_CREDENTIAL (hop 3)"
            - "a_status == SUSPENDED (hop 4: posture cascade onto the future CONFIRMED assignment)"
      - name: drug_positive_cascade
        grounds:
          - state_machines.DrugTestRecord.PENDING_to_COMPLETED
          - calculations.mariner_readiness_posture
          - state_machines.Assignment.CONFIRMED_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (drug result recording, not the clock):
