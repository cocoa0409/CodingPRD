            - call: "POST /paywall/readers"
              payload: { email: "outsider@other.edu", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd_out: "$.data.id" }
            - call: "GET /paywall/group-accounts/${grp_b}"
              payload: {}
              as: GroupAdmin
              as_user_id: "${grp_b}"
