scaffold_corner_design:

  # =========================================================================
  # Section: entities — creation, retrieval, listing, defaults, computed, FK
  # =========================================================================
  - section: entities
    instances:
      - name: create_clinic_returns_defaults
        claim_type: creation
        grounds: [entities.VeterinaryClinic]
        distinguishing_aspect: "POST /vfd/clinics with required inputs returns 201 with computed defaults: compliance_score=1000, audit_ready=true"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic Default", license_number: "LIC-D1", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
          trigger:
            - call: "GET /vfd/clinics/${clinic_id}"
              payload: {}
              as: Inspector
          assert:
            - "VeterinaryClinic.compliance_score == 1000"
            - "VeterinaryClinic.audit_ready == true"
            - "VeterinaryClinic.version == 1"

      - name: get_clinic_not_found_returns_404
        claim_type: not_found
        grounds: [entities.VeterinaryClinic, errors.ERR_NOT_FOUND]
        distinguishing_aspect: "GET /vfd/clinics/{uuid} with non-existent id returns 404 ERR_NOT_FOUND"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vfd/clinics/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: list_producers_pagination_shape
        claim_type: listing
        grounds: [entities.Producer, response_envelope]
        distinguishing_aspect: "GET /vfd/producers returns pagination envelope with limit/offset/total_count/has_more"
        test_recipe:
          setup: ["3 producers seeded"]
          setup_api_calls:
            - call: "POST /vfd/producers"
              payload: { legal_name: "P-A", premise_id: "PIN-A", state_code: "IA" }
              as: Inspector
            - call: "POST /vfd/producers"
              payload: { legal_name: "P-B", premise_id: "PIN-B", state_code: "IA" }
              as: Inspector
            - call: "POST /vfd/producers"
              payload: { legal_name: "P-C", premise_id: "PIN-C", state_code: "IA" }
              as: Inspector
          trigger:
            - call: "GET /vfd/producers?limit=2&offset=0"
              payload: {}
              as: Inspector
          assert:
            - "response.data is array of length 2"
            - "response.meta has limit/offset/total_count/has_more"
            - "total_count == 3"
            - "has_more == true"

      - name: create_drug_default_prohibited_extra_label
        claim_type: defaults
        grounds: [entities.VfdDrug]
        distinguishing_aspect: "VfdDrug.prohibited_extra_label defaults to true when omitted from POST body"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-D1", label_name: "Default Med", withdrawal_hours: 48, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
          trigger:
            - call: "GET /vfd/drugs/${drug_id}"
              payload: {}
              as: Inspector
          assert:
            - "VfdDrug.prohibited_extra_label == true"

      - name: vfd_remaining_count_computed_at_issuance
        claim_type: computed_fields
        grounds: [entities.VfdAuthorization, calculations.vfd_remaining_quota]
        distinguishing_aspect: "On VFD issuance, remaining_animal_count is auto-computed to equal authorized_animal_count"
        test_recipe:
          setup:
            - "Clinic/Vet/Producer/Group/Drug/VCPR in place"
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "Clinic E1", license_number: "LIC-E1", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. E", license_number: "DVM-E1", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "P E1", premise_id: "PIN-E1", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 50, average_weight_lbs: 1000, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-E1", label_name: "Med E1", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
          trigger:
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 25, feed_duration_days: 7, expiration_date: "2026-10-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_id: $.data.id }
          assert:
            - "VfdAuthorization.${vfd_id}.remaining_animal_count == 25"
            - "VfdAuthorization.${vfd_id}.status == ISSUED"

      - name: duplicate_drug_code_rejected
        claim_type: type_constraints
        grounds: [entities.VfdDrug, errors.ERR_DUPLICATE_DRUG_CODE]
        distinguishing_aspect: "POST /vfd/drugs with an existing drug_code returns 409 ERR_DUPLICATE_DRUG_CODE"
        test_recipe:
          setup: ["one drug with code DRUG-DUP"]
          setup_api_calls:
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-DUP", label_name: "First", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
          trigger:
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-DUP", label_name: "Second", withdrawal_hours: 48, allowed_species_classes: ["SWINE:BREEDING"], max_duration_days: 14 }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_DRUG_CODE"
            - "HTTP status == 409"

      - name: missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.VeterinaryClinic, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /vfd/clinics without license_number returns 400 ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vfd/clinics"
              payload: { name: "No License", state_code: "IA" }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

  # =========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial state
  # =========================================================================
  - section: state_machines
    instances:
      - name: vfd_authorization_initial_state_issued
        claim_type: initial_state
        grounds: [state_machines.VfdAuthorization]
        distinguishing_aspect: "Newly issued VFD has status == ISSUED"
        test_recipe:
          setup: ["Clinic/Vet/Producer/Group/Drug/VCPR"]
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "C-IS", license_number: "LIC-IS", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. IS", license_number: "DVM-IS", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "P-IS", premise_id: "PIN-IS", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 10, average_weight_lbs: 1000, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-IS", label_name: "Med IS", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
          trigger:
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 5, feed_duration_days: 7, expiration_date: "2026-10-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_id: $.data.id }
          assert:
            - "VfdAuthorization.${vfd_id}.status == ISSUED"

      - name: revoke_terminal_vfd_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.VfdAuthorization, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "Once VFD is EXPIRED (terminal), attempting to revoke returns ERR_INVALID_STATE"
        test_recipe:
          setup: ["VFD A-term issued, clock advanced past expiration"]
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "C-TL", license_number: "LIC-TL", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. TL", license_number: "DVM-TL", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "P-TL", premise_id: "PIN-TL", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 10, average_weight_lbs: 1000, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-TL", label_name: "Med TL", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 5, feed_duration_days: 7, expiration_date: "2026-09-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_id: $.data.id }
            - call: "POST /vfd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: Inspector
          trigger:
            - call: "POST /vfd/vfd-authorizations/${vfd_id}/revoke"
              payload: {}
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: vfd_supersede_old_vfd_terminal
        claim_type: valid_transition
        grounds: [state_machines.VfdAuthorization.ISSUED_to_SUPERSEDED]
        distinguishing_aspect: "Issuing a new VFD with supersedes_id moves the old VFD to SUPERSEDED, increments its version"
        test_recipe:
          setup: ["VFD A-old ISSUED, version=1"]
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "C-SUP", license_number: "LIC-SUP", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. SUP", license_number: "DVM-SUP", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "P-SUP", premise_id: "PIN-SUP", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 10, average_weight_lbs: 1000, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-SUP", label_name: "Med SUP", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 10, feed_duration_days: 7, expiration_date: "2026-10-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_old: $.data.id, vfd_old_v: $.data.version }
          trigger:
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 15, feed_duration_days: 7, expiration_date: "2026-11-01T00:00:00Z", supersedes_id: "${vfd_old}", expected_vfd_authorization_version: "${vfd_old_v}" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { vfd_new: $.data.id }
          assert:
            - "VfdAuthorization.${vfd_old}.status == SUPERSEDED"
            - "VfdAuthorization.${vfd_old}.superseded_by_id == ${vfd_new}"
            - "VfdAuthorization.${vfd_old}.remaining_animal_count == 0"
            - "VfdAuthorization.${vfd_old}.version == ${vfd_old_v} + 1"
            - "VfdAuthorization.${vfd_new}.status == ISSUED"

  # =========================================================================
  # Section: calculations — covered via §1.8 dual_variant and combinatorial
  # =========================================================================
  - section: calculations
    instances:
      - name: compliance_penalty_threshold_boundary
        claim_type: violation_to_error
        grounds: [calculations.compliance_penalty]
        excluded_because:
          difficulty_instance: compliance_penalty_tiered_marginal_rounding
          rationale: "Asserted as part of §1.8 instance — severity tier and deduction computed on confirm."

      - name: audit_record_count_interval
        claim_type: violation_to_error
        grounds: [calculations.audit_required_records]
        excluded_because:
          difficulty_instance: audit_window_intersection_with_record_lifetime
          rationale: "Asserted in §1.8 boundary/overlap instance."

  # =========================================================================
  # Section: validations — violations -> errors (beyond §1.8)
  # =========================================================================
  - section: validations
    instances:
      - name: create_vfd_with_extra_label_intent_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", errors.ERR_EXTRA_LABEL_USE]
        distinguishing_aspect: "POST /vfd/vfd-authorizations with extra_label_intended=true returns 422 ERR_EXTRA_LABEL_USE (prohibited extra-label use)"
        test_recipe:
          setup: ["Clinic/Vet/Producer/Group/Drug/VCPR"]
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "C-EL", license_number: "LIC-EL", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. EL", license_number: "DVM-EL", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "P-EL", premise_id: "PIN-EL", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 10, average_weight_lbs: 1000, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-EL", label_name: "Med EL", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
          trigger:
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 5, feed_duration_days: 7, expiration_date: "2026-10-01T00:00:00Z", extra_label_intended: true }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EXTRA_LABEL_USE"
            - "HTTP status == 422"

      - name: create_vfd_with_species_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", errors.ERR_SPECIES_CLASS_MISMATCH]
        distinguishing_aspect: "POST /vfd/vfd-authorizations with animal_group species:class not in drug.allowed_species_classes returns 422"
        test_recipe:
          setup: ["Drug allows CATTLE:BEEF; animal group is POULTRY:LAYER"]
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "C-SC", license_number: "LIC-SC", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. SC", license_number: "DVM-SC", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "P-SC", premise_id: "PIN-SC", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "POULTRY", production_class: "LAYER", head_count: 500, average_weight_lbs: 5, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-SC", label_name: "Med SC", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
          trigger:
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 5, feed_duration_days: 7, expiration_date: "2026-10-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SPECIES_CLASS_MISMATCH"
            - "HTTP status == 422"

      - name: create_vfd_with_duration_over_6mo_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", errors.ERR_VFD_DURATION_EXCEEDED]
        distinguishing_aspect: "POST /vfd/vfd-authorizations with expiration_date more than 6 months past issued_on returns 422"
        test_recipe:
          setup: ["Clock at 2026-08-01; expiration_date 2027-03-01 (>6mo)"]
          setup_api_calls:
            - call: "POST /vfd/clinics"
              payload: { name: "C-DU", license_number: "LIC-DU", state_code: "IA" }
              as: Inspector
              captures: { clinic_id: $.data.id }
            - call: "POST /vfd/clinics/${clinic_id}/veterinarians"
              payload: { full_name: "Dr. DU", license_number: "DVM-DU", state_code: "IA" }
              as: Inspector
              captures: { vet_id: $.data.id }
            - call: "POST /vfd/producers"
              payload: { legal_name: "P-DU", premise_id: "PIN-DU", state_code: "IA" }
              as: Inspector
              captures: { producer_id: $.data.id }
            - call: "POST /vfd/producers/${producer_id}/animal-groups"
              payload: { species: "CATTLE", production_class: "BEEF", head_count: 10, average_weight_lbs: 1000, earliest_market_date: "2026-12-01" }
              as: Producer
              as_user_id: "${producer_id}"
              captures: { group_id: $.data.id }
            - call: "POST /vfd/drugs"
              payload: { drug_code: "DRUG-DU", label_name: "Med DU", withdrawal_hours: 24, allowed_species_classes: ["CATTLE:BEEF"], max_duration_days: 7 }
              as: Inspector
              captures: { drug_id: $.data.id }
            - call: "POST /vfd/vcp-verifications"
              payload: { vet_id: "${vet_id}", producer_id: "${producer_id}", expires_on: "2027-08-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
          trigger:
            - call: "POST /vfd/vfd-authorizations"
              payload: { producer_id: "${producer_id}", animal_group_id: "${group_id}", vet_id: "${vet_id}", drug_id: "${drug_id}", authorized_animal_count: 5, feed_duration_days: 7, expiration_date: "2027-03-01T00:00:00Z" }
              as: Veterinarian
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VFD_DURATION_EXCEEDED"
            - "HTTP status == 422"

      - name: vfd_issued_for_suspended_producer_rejected
