    output: CreditSale
    roles: [Sponsor, Permittee]
    side_effects: ["expired RESERVED holds of the bank are swept first (hold_expires_at strictly before clock)", "status = QUOTED", "service_area_tier derived from impact_huc8_code position in service_area_huc8_codes", "quoted_demand_index snapshotted from service_area_demand_index", "quoted_price_cents computed by credit_sale_price QUOTED variant", "MitigationBank.open_quote_count += 1", "MitigationBank.version += 1"]
    status_codes: {201: "quoted", 400: "ERR_INVALID_REQUEST", 403: "ERR_NOT_SALE_PERMITTEE", 404: "ERR_BANK_NOT_FOUND", 409: "ERR_BANK_SALES_RESTRICTED", 412: "ERR_STALE_BANK_VERSION", 422: "ERR_OUTSIDE_SERVICE_AREA"}

  - method: POST
    path: /mitigation/credit-sales/{id}/reserve
    purpose: "Permittee reserves the quoted credits, placing a 30-day hold on the bank's available credits."
    input: []
    output: CreditSale
    roles: [Permittee]
    side_effects: ["expired RESERVED holds of the bank are swept first", "status QUOTED -> RESERVED", "hold_start_at = clock, hold_expires_at = clock + RESERVATION_HOLD_DAYS", "MitigationBank.credits_on_hold += credits_requested", "credits_available and sales_posture recomputed", "HOLD_PLACED ledger entry appended", "MitigationBank.open_quote_count -= 1", "MitigationBank.version += 1"]
    status_codes: {200: "reserved", 403: "ERR_NOT_SALE_PERMITTEE", 404: "ERR_CREDIT_SALE_NOT_FOUND", 409: "ERR_RESERVATION_HOLD_CONFLICT", 422: "ERR_INSUFFICIENT_CREDITS"}

  - method: POST
    path: /mitigation/credit-sales/{id}/execute
    purpose: "Execute the sale: the EXECUTED variant of credit_sale_price is recomputed at settlement, escrow is debited and the hold converts to a permanent sale."
    input: []
    output: CreditSale
    roles: [Sponsor]
    side_effects: ["status RESERVED -> EXECUTED", "executed_price_cents computed by credit_sale_price EXECUTED variant (capped at 110% of quoted_price_cents)", "Permittee.escrow_balance_cents -= executed_price_cents", "MitigationBank.credits_on_hold -= credits_requested, credits_sold += credits_requested", "HOLD_RELEASED then SOLD ledger entries appended", "sales_posture recomputed", "executed_at = clock", "MitigationBank.version += 1"]
    status_codes: {200: "executed", 402: "ERR_INSUFFICIENT_ESCROW", 403: "ERR_NOT_BANK_SPONSOR", 404: "ERR_CREDIT_SALE_NOT_FOUND", 409: "ERR_SALE_STATE_INVALID"}

  - method: POST
    path: /mitigation/credit-sales/{id}/assign
    purpose: "Assign the executed credits to the permittee's permit obligation, reducing unmet_requirement_credits."
    input: []
    output: CreditSale
    roles: [Sponsor]
    side_effects: ["status EXECUTED -> ASSIGNED", "assignment_reference generated", "Permittee.assigned_credits += credits_requested", "Permittee.unmet_requirement_credits recomputed", "CreditLedgerEntry ASSIGNED appended with delta_credits 0.00 (bookkeeping; balance_after unchanged)", "assigned_at = clock"]
    status_codes: {200: "assigned", 403: "ERR_NOT_BANK_SPONSOR", 404: "ERR_CREDIT_SALE_NOT_FOUND", 409: "ERR_SALE_STATE_INVALID", 422: "ERR_ASSIGNMENT_EXCEEDS_REQUIREMENT"}

  - method: POST
    path: /mitigation/credit-sales/{id}/cancel
    purpose: "Cancel a quote or a reservation. A cancelled reservation returns its held credits to availability (credit-conservation compensation)."
    input: [cancelled_reason]
    output: CreditSale
    roles: [Sponsor, Permittee]
    side_effects: ["status QUOTED|RESERVED -> CANCELLED", "from RESERVED: MitigationBank.credits_on_hold -= credits_requested, HOLD_RELEASED ledger entry appended", "from QUOTED: MitigationBank.open_quote_count -= 1", "credits_available and sales_posture recomputed", "cancelled_at = clock", "MitigationBank.version += 1"]
    status_codes: {200: "cancelled", 400: "ERR_INVALID_REQUEST", 403: "ERR_NOT_SALE_PERMITTEE", 404: "ERR_CREDIT_SALE_NOT_FOUND", 409: "ERR_SALE_STATE_INVALID"}

  - method: POST
    path: /mitigation/credit-sales/{id}/reverse
    purpose: "Chair reverses an executed or assigned sale (compensating transaction): every money and credit side effect of execution and assignment is undone, leaving no drift."
    input: []
    output: CreditSale
    roles: [IRTChair]
    side_effects: ["status EXECUTED -> CANCELLED with cancelled_reason = IRT_REVERSAL (an ASSIGNED sale is terminal and can never be reversed)", "MitigationBank.credits_sold -= credits_requested", "Permittee.escrow_balance_cents += executed_price_cents", "SALE_REVERSED ledger entry appended", "credits_available and sales_posture recomputed", "MitigationBank.version += 1"]
    status_codes: {200: "reversed", 404: "ERR_CREDIT_SALE_NOT_FOUND", 409: "ERR_SALE_STATE_INVALID"}

  # --------------------------- logical clock ------------------------------
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Set the injectable logical clock that every timestamp, window check, hold expiry and demand quarter is evaluated against. Default at process start: 2026-08-01T00:00:00Z."
    input: [to_iso8601]
    output: { current_utc: datetime }
    roles: [ProgramAdmin]
    side_effects: ["subsequent requests evaluate now() as to_iso8601"]
    status_codes: {200: "ok", 400: "ERR_INVALID_REQUEST"}

# ============================================================================
# §1.6 Error Catalog
#   Every code is reachable from at least one §1.5 endpoint and is exercised in
#   §1.8 or §1.9. http_status pairs one-to-one with the code.
# ============================================================================
errors:

  # ---- authentication / authorization / schema ----
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    when: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not a §1.7 role name."
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    category: auth
    when: "Acting role is not in the endpoint's roles list."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: validation
    when: "Missing required field, wrong JSON type, unknown enum member, malformed HUC-8 code, negative cents, credits with more than 2 decimals, release_pct outside (0,1], limit outside 1..100, negative offset, window_end not after window_start, duplicate stratum_code or standard_code."

  # ---- existence ----
  - error_id: ERR_SPONSOR_NOT_FOUND
    http_status: 404
    category: existence
    when: "sponsor id in path or body does not resolve."
  - error_id: ERR_PERMITTEE_NOT_FOUND
    http_status: 404
    category: existence
    when: "permittee id in path or body does not resolve."
  - error_id: ERR_IRT_MEMBER_NOT_FOUND
    http_status: 404
    category: existence
    when: "IRT member id in path does not resolve, or the acting X-User-ID of an IRTMember role does not resolve to an IRTMember row."
  - error_id: ERR_BANK_NOT_FOUND
    http_status: 404
    category: existence
    when: "bank id in path or body does not resolve."
  - error_id: ERR_PROSPECTUS_NOT_FOUND
    http_status: 404
    category: existence
    when: "prospectus id in path does not resolve."
  - error_id: ERR_WORK_PLAN_NOT_FOUND
    http_status: 404
    category: existence
    when: "work plan id in path does not resolve."
  - error_id: ERR_MILESTONE_NOT_FOUND
    http_status: 404
    category: existence
    when: "milestone id in path does not resolve, or predecessor_milestone_id in the body does not resolve."
  - error_id: ERR_MONITORING_REPORT_NOT_FOUND
    http_status: 404
    category: existence
    when: "monitoring report id in path does not resolve."
  - error_id: ERR_REMEDIAL_ACTION_NOT_FOUND
    http_status: 404
    category: existence
    when: "remedial action id in path does not resolve."
  - error_id: ERR_CREDIT_SALE_NOT_FOUND
    http_status: 404
    category: existence
    when: "credit sale id in path does not resolve."

  # ---- ownership / duty ----
  - error_id: ERR_NOT_BANK_SPONSOR
    http_status: 403
    category: auth
    when: "Acting Sponsor's X-User-ID is not the sponsor_id of the bank the operation targets."
  - error_id: ERR_NOT_SALE_PERMITTEE
    http_status: 403
    category: auth
    when: "Acting Permittee's X-User-ID is not the permittee of the sale (or of the escrow account) being operated on."
  - error_id: ERR_MEMBER_RECUSED
    http_status: 403
    category: auth
    when: "Acting IRTMember's roster_status is RECUSED."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: business_safety
    when: "The IRT member approving a milestone release is the same member who verified the remedial action that had deferred that milestone."

  # ---- state ----
  - error_id: ERR_BANK_STATE_INVALID
    http_status: 409
    category: state
    when: "MitigationBank.status does not permit the requested operation (e.g. execute-instrument on a bank not in PROSPECTUS_REVIEW, close on a bank not in MONITORING, any write on a CLOSED bank)."
  - error_id: ERR_PROSPECTUS_STATE_INVALID
    http_status: 409
    category: state
    when: "Prospectus.status has no such transition (submit from SUBMITTED/UNDER_REVIEW/APPROVED/REJECTED, vote on a DRAFT or decided prospectus, finalize a prospectus that is not UNDER_REVIEW)."
  - error_id: ERR_WORK_PLAN_STATE_INVALID
    http_status: 409
    category: state
    when: "WorkPlan.status has no such transition (submit from SUBMITTED/APPROVED, decide a plan that is not SUBMITTED)."
  - error_id: ERR_MILESTONE_STATE_INVALID
    http_status: 409
    category: state
    when: "ReleaseMilestone.status has no such transition (claim a CLAIMED or APPROVED milestone, approve a milestone that is not CLAIMED)."
  - error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
    category: state
    when: "MonitoringReport.review_status has no such transition (submit an ACCEPTED report, review a DRAFT or already ACCEPTED report)."
  - error_id: ERR_REMEDIAL_STATE_INVALID
    http_status: 409
    category: state
    when: "RemedialAction.status has no such transition (submit work on a CLEARED or FAILED action, inspect an action that is not WORK_SUBMITTED)."
  - error_id: ERR_SALE_STATE_INVALID
    http_status: 409
    category: state
    when: "CreditSale.status has no such transition (reserve a non-QUOTED sale, execute a non-RESERVED sale, assign a non-EXECUTED sale, cancel an EXECUTED/ASSIGNED/CANCELLED/EXPIRED sale, reverse a sale that is not EXECUTED)."
  - error_id: ERR_BANK_SALES_FROZEN
    http_status: 409
    category: state
    when: "sales_posture is FROZEN (bank not yet in MONITORING, easement not recorded, bank SUSPENDED or CLOSED)."
  - error_id: ERR_BANK_SALES_RESTRICTED
    http_status: 409
    category: state
    when: "sales_posture is RESTRICTED because at least one RemedialAction of the bank is in {OPEN, WORK_SUBMITTED, REINSPECTION}."
  - error_id: ERR_BANK_SOLD_OUT
    http_status: 409
    category: state
    when: "sales_posture is SOLD_OUT (credits_available == 0.00) and the operation is a quote or a reservation."
  - error_id: ERR_MILESTONES_INCOMPLETE
    http_status: 409
    category: state
    when: "Bank closure attempted while a milestone is not APPROVED or a remedial action is still live."

  # ---- concurrency ----
  - error_id: ERR_STALE_BANK_VERSION
    http_status: 412
    category: concurrency
    when: "expected_bank_version does not equal MitigationBank.version (§1.2.1)."

  # ---- regulatory safety ----
  - error_id: ERR_EASEMENT_NOT_RECORDED
    http_status: 422
    category: business_safety
    when: "Credit release or bank closure attempted before the conservation easement was recorded."
  - error_id: ERR_OUTSIDE_SERVICE_AREA
    http_status: 422
    category: business_safety
    when: "CreditSale.impact_huc8_code is not in the bank's service_area_huc8_codes."
  - error_id: ERR_SERVICE_AREA_MISSING_SITE_HUC
    http_status: 422
    category: business_safety
    when: "service_area_huc8_codes does not contain site_huc8_code at bank creation."

  # ---- temporal ----
  - error_id: ERR_MONITORING_WINDOW_OVERLAP
    http_status: 409
    category: business_temporal
    when: "A new monitoring window has a positive-length intersection with an occupying window of the same bank (half-open; adjacency allowed)."
  - error_id: ERR_RESERVATION_HOLD_CONFLICT
    http_status: 409
    category: business_temporal
    when: "A new reservation hold intersects a live RESERVED hold of the same permittee (closed interval; touching endpoints collide)."
  - error_id: ERR_MILESTONE_WINDOW_BUFFER
    http_status: 409
    category: business_temporal
    when: "A new milestone window starts less than MILESTONE_WINDOW_BUFFER_DAYS after the latest existing window_end of the same bank."
  - error_id: ERR_MILESTONE_WINDOW_NOT_OPEN
    http_status: 409
    category: business_temporal
    when: "A milestone is claimed before its window_start."
  - error_id: ERR_REMEDIAL_PAST_DUE
    http_status: 409
    category: business_temporal
    when: "Corrective work is submitted after RemedialAction.due_at."

  # ---- uniqueness / aggregate constraints ----
  - error_id: ERR_DUPLICATE_MONITORING_YEAR
    http_status: 409
    category: business_constraint
    when: "The bank already has an occupying monitoring report for that monitoring_year."
  - error_id: ERR_DUPLICATE_MILESTONE_CODE
    http_status: 409
    category: business_constraint
    when: "The bank already has a milestone with that milestone_code."
  - error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    category: business_constraint
    when: "The member already voted in this revision_round of this prospectus."
  - error_id: ERR_DUPLICATE_PERMIT_NUMBER
    http_status: 409
    category: business_constraint
    when: "permit_number already registered."
  - error_id: ERR_RELEASE_SCHEDULE_OVERSUBSCRIBED
    http_status: 422
    category: business_constraint
    when: "SUM(release_pct) over the bank's milestones would exceed 1.000."
  - error_id: ERR_STANDARD_WEIGHTS_INVALID
    http_status: 422
    category: business_constraint
    when: "WorkPlan.performance_standards weights do not sum to exactly 1.000."
  - error_id: ERR_WORK_PLAN_ALREADY_APPROVED
    http_status: 409
    category: business_constraint
    when: "The bank already has an APPROVED work plan."
  - error_id: ERR_PREDECESSOR_NOT_RELEASED
    http_status: 409
    category: business_constraint
    when: "A milestone is claimed while its predecessor milestone is not APPROVED."

  # ---- referential / dependency ----
  - error_id: ERR_PROSPECTUS_NOT_APPROVED
    http_status: 422
    category: business_referential
    when: "Instrument execution attempted without an APPROVED prospectus for the bank."
  - error_id: ERR_WORK_PLAN_MISSING
    http_status: 422
    category: business_referential
    when: "Prospectus approval attempted with no SUBMITTED/APPROVED work plan, or instrument execution with no APPROVED work plan."
  - error_id: ERR_IRT_QUORUM_NOT_MET
    http_status: 422
    category: business_referential
    when: "Fewer than IRT_QUORUM_MIN votes were cast in the current revision_round."
  - error_id: ERR_NO_EFFECTIVE_STANDARDS
    http_status: 422
    category: business_referential
    when: "No PerformanceStandard of the bank has effective_from_year <= monitoring_year."
  - error_id: ERR_MEASUREMENT_MISSING
    http_status: 422
    category: business_referential
    when: "A standard effective in the monitoring year has no matching measurement."
  - error_id: ERR_NO_ACCEPTED_MONITORING_REPORT
    http_status: 422
    category: business_referential
    when: "Release of a PERF_* milestone attempted with no ACCEPTED monitoring report for the bank."
  - error_id: ERR_COMPLIANCE_FAILED
    http_status: 422
    category: business_referential
    when: "The governing monitoring report has compliance_status FAIL, or PARTIAL with attainment_score below COMPLIANCE_PARTIAL_MIN."
  - error_id: ERR_ASSIGNMENT_EXCEEDS_REQUIREMENT
    http_status: 422
    category: business_referential
    when: "credits_requested exceeds Permittee.unmet_requirement_credits."

  # ---- fiscal ----
  - error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 422
    category: business_fiscal
    when: "credits_requested exceeds MitigationBank.credits_available."
  - error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 402
    category: business_fiscal
    when: "Permittee.escrow_balance_cents is below the EXECUTED-variant price."
  - error_id: ERR_STEWARDSHIP_UNDERFUNDED
    http_status: 402
    category: business_fiscal
    when: "stewardship_funded_cents is below the gate for this release (25% interim, 100% at PERF_YEAR_10 and at closure)."
  - error_id: ERR_PERFORMANCE_BOND_INSUFFICIENT
    http_status: 402
    category: business_fiscal
    when: "Sponsor.performance_bond_cents is below MIN_PERFORMANCE_BOND_CENTS at instrument execution."

# ============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# ============================================================================
roles:

  - name: Sponsor
    description: "Mitigation bank sponsor: builds and operates the bank, drafts the prospectus and work plan, records the easement, funds the endowment, claims release milestones, files monitoring reports, performs corrective work, and sells credits."
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /mitigation/banks"
      - "POST /mitigation/prospectuses"
      - "POST /mitigation/prospectuses/{id}/submit"
      - "POST /mitigation/work-plans"
      - "POST /mitigation/work-plans/{id}/submit"
      - "POST /mitigation/banks/{id}/conservation-easement"
      - "POST /mitigation/banks/{id}/stewardship-contributions"
      - "POST /mitigation/milestones"
      - "POST /mitigation/milestones/{id}/claim"
      - "POST /mitigation/monitoring-reports"
      - "POST /mitigation/monitoring-reports/{id}/submit"
      - "POST /mitigation/remedial-actions/{id}/submit-work"
      - "POST /mitigation/credit-sales/{id}/execute"
      - "POST /mitigation/credit-sales/{id}/assign"
    shared_operations:
      - "POST /mitigation/credit-sales (with Permittee)"
      - "POST /mitigation/credit-sales/{id}/cancel (with Permittee)"
      - "all GET reads except GET /mitigation/irt-members/{id} and GET /mitigation/irt-members/{id}/votes"
    notes: "Every Sponsor write is ownership-checked against MitigationBank.sponsor_id (ERR_NOT_BANK_SPONSOR, priority 30). A Sponsor can never approve its own release, review its own monitoring report, inspect its own corrective work, execute the instrument or reverse a sale."

  - name: Permittee
    description: "Permit holder buying credits to offset authorised wetland impacts; funds an escrow account, requests quotes, reserves credits and may cancel its own quote or reservation."
    identity: "entity_backed:Permittee"
    exclusive_operations:
      - "POST /mitigation/credit-sales/{id}/reserve"
    shared_operations:
      - "POST /mitigation/permittees/{id}/deposits (with ProgramAdmin)"
      - "POST /mitigation/credit-sales (with Sponsor)"
      - "POST /mitigation/credit-sales/{id}/cancel (with Sponsor)"
      - "GET /mitigation/permittees/{id}, GET /mitigation/banks/{id}, GET /mitigation/banks, GET /mitigation/credit-sales/{id}, GET /mitigation/credit-sales"
    notes: "Ownership-checked against CreditSale.permittee_id and Permittee.id (ERR_NOT_SALE_PERMITTEE, priority 31). A Permittee can never execute or assign a sale — settlement and permit assignment belong to the sponsor."

  - name: IRTMember
    description: "Seated interagency review team member: votes on prospectus revision rounds, reviews and scores monitoring reports, inspects corrective work, and approves credit releases."
    identity: "entity_backed:IRTMember"
    exclusive_operations:
      - "POST /mitigation/prospectuses/{id}/votes"
      - "POST /mitigation/monitoring-reports/{id}/review"
      - "POST /mitigation/remedial-actions/{id}/inspect"
      - "POST /mitigation/milestones/{id}/approve-release"
    shared_operations:
      - "all GET reads except GET /mitigation/permittees/{id}, GET /mitigation/credit-sales/{id} and GET /mitigation/credit-sales"
    notes: "A RECUSED member is rejected with ERR_MEMBER_RECUSED (priority 32). Segregation of duties: the member who set verified_by_member_id on the remedial action that deferred a milestone may not approve that milestone's release (ERR_SEGREGATION_OF_DUTIES, priority 52)."

  - name: IRTChair
    description: "Chair of the interagency review team: closes prospectus revision rounds, decides work plans, executes the banking instrument, closes the bank and reverses settled sales. The chair never votes."
    identity: "opaque"
    exclusive_operations:
      - "POST /mitigation/prospectuses/{id}/finalize-review"
      - "POST /mitigation/work-plans/{id}/decide"
      - "POST /mitigation/banks/{id}/execute-instrument"
      - "POST /mitigation/banks/{id}/close"
      - "POST /mitigation/credit-sales/{id}/reverse"
    shared_operations:
      - "all GET reads"
    notes: "Prospectus.decision_recorded_by stores the chair's opaque X-User-ID; it is never compared to any entity id. The chair cannot cast a ProspectusVote (ERR_ROLE_NOT_PERMITTED), which keeps the quorum and supermajority tallies free of the deciding official."

  - name: ProgramAdmin
    description: "Regulatory program administrator: registers sponsors, permittees and IRT members, tops up permittee escrow, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /mitigation/sponsors"
      - "POST /mitigation/permittees"
      - "POST /mitigation/irt-members"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /mitigation/permittees/{id}/deposits (with Permittee)"
      - "all GET reads"
    notes: "ProgramAdmin holds no bank, sale, review or release authority: it can register parties and move the clock but cannot submit, decide, release, sell, execute or reverse anything."
