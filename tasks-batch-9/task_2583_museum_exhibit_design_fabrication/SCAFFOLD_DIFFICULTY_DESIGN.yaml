            - "${cnt1} == 1, ${min1} == 45.0, ${max1} == 55.0, ${lux1} == 50.0, ${feas1} == true, ${sec1} == true (48.0 >= 45.0, 52.0 <= 55.0, 50.0 <= 50.0 all inclusive)"
            - "${cnt2} == 2, ${min2} == 48.0, ${max2} == 52.0, ${lux2} == 40.0 and ${feas2} == false - the RH band is now exactly equal on both edges and still passes, but target_lux 50.0 > 40.0 fails"
            - "${cnt3} == 3, ${min3} == 48.0, ${max3} == 52.0, ${lux3} == 40.0 and ${sec3} == false - art3 widens nothing (its 40.0-60.0 band and 200.0 lux are looser) yet its HIGH_VALUE rank 3 exceeds the case's ENHANCED rank 2"
            - "${cnt4} == 2, ${min4} == 48.0, ${max4} == 52.0, ${lux4} == 40.0, ${sec4} == true and ${feas4} == false - withdrawing art3 restores security_ok exactly and touches nothing else"
            - "${cnt5} == 1, ${min5} == 45.0, ${max5} == 55.0, ${lux5} == 50.0 and ${feas5} == true - the fold over the remaining single artifact reproduces the call-3 values byte for byte"
            - "${cnt6} == 2, ${min6} == 48.0, ${max6} == 52.0, ${lux6} == 40.0 and ${feas6} == false - re-placing the same artifact is idempotent in the envelope"
            - "${cnt7} == 1, ${min7} == 48.0, ${max7} == 52.0, ${lux7} == 40.0 and ${feas7} == false - removing art1 from the MIDDLE of the set leaves art2's tighter bounds in force, which no inversion of the last placement could produce"
            - "${cnt8} == 0, ${min8} == null, ${max8} == null, ${lux8} == null, ${feas8} == true and ${sec8} == true"
            - "the submit-for-conservation on the now-empty case -> ERR_CASE_HAS_NO_ARTIFACTS (422), so env_feasible == true on an empty case cannot be used to sneak it past review"
            - "${a2st} == UNPLACED and ${a2case} == null - a RESERVED artifact returns to the pool on withdrawal and is re-placeable, unlike a PLACED one which becomes DEINSTALLED"
