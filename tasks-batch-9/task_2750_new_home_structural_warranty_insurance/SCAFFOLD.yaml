scenario: |
  2750. New-Home Structural Warranty Insurance (2-10 Home Buyers Warranty): builder enrollment
  underwriting and risk-class assignment, home enrollment at closing with coverage start dates by
  year (workmanship, systems, structural), warranty transfer to a subsequent buyer within the
  coverage term, claim intake with builder-obligation period vs insurer-backed period,
  load-bearing/structural damage definition and deductible application, mediation and binding
  arbitration escalation ladder, builder default triggering direct insurer response, reserve
  setting and per-builder loss ratio monitoring
domain_name: new-home-structural-warranty-insurance
api_prefix: "/warranty"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Claim, EscalationCase, WarrantyTransfer and WarrantyPolicy each carry 3 foreign keys into
  # different aggregates; WarrantyTransfer.prior_transfer_id and EscalationCase.prior_case_id are
  # self-referential chains; WarrantyPolicy.pending_transfer_id closes a cycle back from policy to
  # transfer. There is no single ownership tree — every write is reached by FK, not by URL nesting.

  state_machine_shape: branching
  # Claim forks at obligation-routing into a BUILDER_OBLIGATION_NOTICE arm and an
  # INSURER_ADJUDICATION arm with disjoint side-effect sets, and the two arms rejoin at
  # INSURER_ADJUDICATION when the builder refuses. Builder adds two cycles
  # (REFERRED->UNDER_REVIEW, SUSPENDED->APPROVED); WarrantyTransfer adds a
  # REQUESTED->NEEDS_DOCUMENTATION->REQUESTED revision loop; WarrantyPolicy carries two
  # independent state axes (coverage_status x premium_status) on one row.

  relationship_patterns:
    - one_to_many          # Builder -> WarrantyPolicy, WarrantyPolicy -> CoverageTerm, Claim -> ReserveEntry
    - self_referential     # WarrantyTransfer.prior_transfer_id, EscalationCase.prior_case_id, ReserveEntry.reversed_entry_id
    - cross_aggregate      # Claim.coverage_term_id crosses into the policy aggregate; EscalationCase.neutral_id crosses into the panel aggregate
    - polymorphic          # Claim.obligor selects BUILDER vs INSURER as the responsible party for the same claim row

  role_model: segregation_of_duties
  # The ClaimsAdjuster whose X-User-ID is recorded in Claim.adjudicated_by_user_id may not issue
  # the payment on that claim, and the adjuster recorded in EscalationCase.outcome_recorded_by_user_id
  # for a mediation may not issue the award on the successor arbitration case.

  consistency_model: immediate

  difficulty_level: expert
  # Read endpoints are numerous only because §1.5's FK reverse-reachability contract requires a
  # discovery channel for all 18 foreign keys in §1.1; the write surface is 35 endpoints and the
  # difficulty lives in §1.3's six calculations and §1.2's six-link payment cascade.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Builder
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: legal name of the enrolling home builder
        constraints: 1-120 characters, non-blank
      - name: state_code
        type: string
        source: input
        description: state in which the builder is licensed; selects the premium surcharge
        constraints: one of {TX, CO, AZ, FL, NC}
      - name: years_in_business
        type: integer
        source: input
        description: declared years of continuous operation, an underwriting input
        constraints: 0 <= years_in_business <= 100
      - name: homes_closed_last_year
        type: integer
        source: input
        description: declared closings in the trailing year, an underwriting volume input
        constraints: 0 <= homes_closed_last_year <= 5000
      - name: claims_history_score
        type: integer
        source: input
        description: declared third-party claims-history score, 100 = spotless
        constraints: 0 <= claims_history_score <= 100
      - name: financial_strength_tier
        type: enum
        source: input
        description: declared balance-sheet tier used as an underwriting credit
        constraints: one of {TIER_1, TIER_2, TIER_3}
      - name: underwriting_status
        type: enum
        source: system
        description: enrollment lifecycle state of the builder
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, UNDER_REVIEW, REFERRED, APPROVED, DECLINED, SUSPENDED, DEFAULTED}
      - name: risk_score
        type: number
        source: computed
        description: output of calculations.builder_risk_score, 2 decimal places
        default: null
        constraints: 0.00 <= risk_score <= 100.00
      - name: risk_class
        type: enum
        source: computed
        description: band derived from risk_score by calculations.builder_risk_score
        default: null
        constraints: one of {A, B, C, D} or null before the first scoring run
      - name: risk_basis
        type: enum
        source: computed
        description: which variant of calculations.builder_risk_score produced the current risk_score
        default: null
        constraints: one of {INITIAL_UNDERWRITING, RENEWAL_REASSESSMENT} or null
      - name: obligation_period_years
        type: integer
        source: system
        description: program-fixed builder-obligation length in years, used by calculations.coverage_term_schedule
        default: 2
        constraints: always 2 for this program; never accepted as request input
      - name: earned_premium_cents
        type: integer
        source: computed
        description: denominator of calculations.builder_loss_ratio, recomputed on every contributing mutation
        default: 0
      - name: incurred_loss_cents
        type: integer
        source: computed
        description: numerator of calculations.builder_loss_ratio, recomputed on every contributing mutation
        default: 0
      - name: loss_ratio
        type: number
        source: computed
        description: output of calculations.builder_loss_ratio, 4 decimal places
        default: 0.0000
      - name: monitoring_posture
        type: enum
        source: computed
        description: gate band derived from loss_ratio; RESTRICTED and FROZEN gate new enrollments
        default: OPEN
        constraints: one of {OPEN, WATCH, RESTRICTED, FROZEN}
      - name: default_declared_at
        type: datetime
        source: system
        description: logical-clock instant at which the builder was declared in default, null otherwise
        default: null

  - name: UnderwritingReview
    parent: Builder
    common_fields: false
    fields:
      - name: builder_id
        type: string
        source: input
        description: FK -> Builder.id; the builder this review decided
      - name: decision
        type: enum
        source: input
        description: reviewer verdict driving the Builder underwriting transition
        constraints: one of {APPROVE, DECLINE, REFER}
      - name: reviewer_notes
        type: string
        source: input
        description: free-text rationale retained for audit
        constraints: 1-500 characters, non-blank
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the acting UnderwritingOfficer, copied from the request header
      - name: risk_score_snapshot
        type: number
        source: computed
        description: Builder.risk_score as it stood when this review was recorded
      - name: risk_class_snapshot
        type: enum
        source: computed
        description: Builder.risk_class as it stood when this review was recorded
        constraints: one of {A, B, C, D}
      - name: resulting_underwriting_status
        type: enum
        source: computed
        description: Builder.underwriting_status immediately after this review was applied
        constraints: one of {APPROVED, DECLINED, REFERRED}

  - name: Homeowner
    parent: null
    common_fields: false
    fields:
      - name: full_name
        type: string
        source: input
        description: name of the buyer or subsequent buyer holding the warranty
        constraints: 1-120 characters, non-blank
      - name: email
        type: string
        source: input
        description: contact address for warranty correspondence
        constraints: must contain '@'
      - name: state_code
        type: string
        source: input
        description: mailing state of the homeowner
        constraints: one of {TX, CO, AZ, FL, NC}

  - name: Neutral
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: name of the panel mediator or arbitrator
        constraints: 1-120 characters, non-blank
      - name: credential
        type: enum
        source: input
        description: which escalation stages this neutral may be booked for
        constraints: one of {MEDIATOR, ARBITRATOR, BOTH}
      - name: state_code
        type: string
        source: input
        description: state of admission for the neutral
        constraints: one of {TX, CO, AZ, FL, NC}
      - name: status
        type: enum
        source: system
        description: panel availability of the neutral
        default: ACTIVE
        constraints: one of {ACTIVE, INACTIVE}
      - name: booked_session_count
        type: integer
        source: computed
        description: number of EscalationCase rows in status SCHEDULED, SETTLED, IMPASSE or AWARD_ISSUED that name this neutral
        default: 0

  - name: WarrantyPolicy
    parent: null
    common_fields: true
    fields:
      - name: builder_id
        type: string
        source: input
        description: FK -> Builder.id; the builder that enrolled this home at closing
      - name: initial_owner_id
        type: string
        source: input
        description: FK -> Homeowner.id; the buyer at closing, never rewritten
      - name: current_owner_id
        type: string
        source: computed
        description: FK -> Homeowner.id; initialised to initial_owner_id and rewritten only by transfer recording
      - name: pending_transfer_id
        type: string
        source: computed
        description: FK -> WarrantyTransfer.id; the one transfer request in status REQUESTED or NEEDS_DOCUMENTATION, null when none is open
        default: null
      - name: street_address
        type: string
        source: input
        description: street address of the enrolled home
        constraints: 1-200 characters, non-blank
      - name: state_code
        type: string
        source: input
        description: state of the home; selects state_surcharge_cents in calculations.policy_premium
        constraints: one of {TX, CO, AZ, FL, NC}
      - name: purchase_price_cents
        type: integer
        source: input
        description: closing price in cents, the premium and limit base
        constraints: 5000000 <= purchase_price_cents <= 500000000
      - name: closing_date
        type: string
        source: input
        description: calendar date of closing, ISO 8601 date (YYYY-MM-DD)
        constraints: must be <= the logical clock's current date at enrollment
      - name: coverage_start_date
        type: string
        source: computed
        description: always equal to closing_date; the anchor for all coverage term arithmetic
      - name: builder_obligation_end_date
        type: string
        source: computed
        description: last date on which a claim is builder-obligated, from calculations.coverage_term_schedule
      - name: risk_class_at_enrollment
        type: enum
        source: computed
        description: Builder.risk_class frozen at enrollment; premium never re-rates when the builder is later reassessed
        constraints: one of {A, B, C, D}
      - name: premium_component_workmanship_cents
        type: integer
        source: computed
        description: whole-cent workmanship component from calculations.policy_premium
      - name: premium_component_systems_cents
        type: integer
        source: computed
        description: whole-cent systems component from calculations.policy_premium
      - name: premium_component_structural_cents
        type: integer
        source: computed
        description: whole-cent structural component from calculations.policy_premium, includes the structural loading
      - name: state_surcharge_cents
        type: integer
        source: computed
        description: flat per-state surcharge added after the three components are summed
      - name: premium_cents
        type: integer
        source: computed
        description: total policy premium from calculations.policy_premium
      - name: coverage_status
        type: enum
        source: system
        description: coverage axis of the policy, independent of premium_status
        default: PENDING_ENROLLMENT
        constraints: one of {PENDING_ENROLLMENT, ACTIVE, EXPIRED, VOIDED}
      - name: premium_status
        type: enum
        source: system
        description: billing axis of the policy, evolves independently of coverage_status
        default: UNBILLED
        constraints: one of {UNBILLED, INVOICED, PAID}
      - name: enrollment_hold
        type: boolean
        source: computed
        description: set true when the enrolling builder's monitoring_posture becomes FROZEN; blocks activation
        default: false
      - name: transfer_count
        type: integer
        source: computed
        description: number of WarrantyTransfer rows on this policy in status RECORDED
        default: 0

  - name: CoverageTerm
    parent: WarrantyPolicy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> WarrantyPolicy.id; the policy this term belongs to
      - name: coverage_type
        type: enum
        source: input
        description: which of the three coverage years this term provides
        constraints: one of {WORKMANSHIP, SYSTEMS, STRUCTURAL}
      - name: term_kind
        type: enum
        source: computed
        description: BASE for the three terms minted at enrollment, ENDORSEMENT for terms added later
        constraints: one of {BASE, ENDORSEMENT}
      - name: start_date
        type: string
        source: input
        description: first covered date, ISO 8601 date; computed as coverage_start_date for BASE terms
      - name: end_date
        type: string
        source: input
        description: last covered date inclusive, ISO 8601 date; computed by calculations.coverage_term_schedule for BASE terms
        constraints: end_date >= start_date
      - name: limit_cents
        type: integer
        source: input
        description: aggregate indemnity limit for this term; computed for BASE terms
        constraints: limit_cents >= 1
      - name: deductible_cents
        type: integer
        source: input
        description: per-occurrence deductible recorded on the term; computed for BASE terms
        constraints: deductible_cents >= 0
      - name: consumed_limit_cents
        type: integer
        source: computed
        description: sum of net payments charged to this term less reversals
        default: 0
      - name: remaining_limit_cents
        type: integer
        source: computed
        description: limit_cents - consumed_limit_cents; conserved quantity of calculations.coverage_limit_conservation
      - name: status
        type: enum
        source: system
        description: availability of the term
        default: OPEN
        constraints: one of {OPEN, LIMIT_EXHAUSTED, ELAPSED}

  - name: WarrantyTransfer
    parent: WarrantyPolicy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> WarrantyPolicy.id; the policy whose warranty is being transferred
      - name: new_owner_id
        type: string
        source: input
        description: FK -> Homeowner.id; the subsequent buyer who would hold the warranty
      - name: prior_transfer_id
        type: string
        source: computed
        description: FK -> WarrantyTransfer.id; the request this one superseded, null when no open request existed
        default: null
      - name: requested_by_owner_id
        type: string
        source: system
        description: X-User-ID of the acting Homeowner, copied from the request header
      - name: transfer_date
        type: string
        source: input
        description: effective date of the sale to the subsequent buyer, ISO 8601 date
        constraints: must fall inside the policy's STRUCTURAL BASE term interval
      - name: transfer_fee_cents
        type: integer
        source: computed
        description: output of calculations.transfer_fee
      - name: documents_reference
        type: string
        source: input
        description: reference to the uploaded deed/inspection packet, supplied on resubmission
        default: null
      - name: decision_reason
        type: string
        source: system
        description: reviewer reason recorded on APPROVED or REJECTED
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle of this transfer request
        default: REQUESTED
        constraints: one of {REQUESTED, NEEDS_DOCUMENTATION, APPROVED, REJECTED, RECORDED, SUPERSEDED}

  - name: Claim
    parent: WarrantyPolicy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> WarrantyPolicy.id; the policy the claim is filed against
      - name: coverage_term_id
        type: string
        source: computed
        description: FK -> CoverageTerm.id; the term resolved at intake from coverage_type and reported_date
      - name: filed_by_owner_id
        type: string
        source: computed
        description: FK -> Homeowner.id; X-User-ID of the filing Homeowner, which must equal WarrantyPolicy.current_owner_id
      - name: coverage_type
        type: enum
        source: input
        description: which coverage the claimant invokes; selects the CoverageTerm
        constraints: one of {WORKMANSHIP, SYSTEMS, STRUCTURAL}
      - name: defect_category
        type: enum
        source: input
        description: claimant's characterisation of the defect
        constraints: one of {WORKMANSHIP_DEFECT, SYSTEM_FAILURE, STRUCTURAL_CRACKING, LOAD_BEARING_FAILURE, WATER_INTRUSION}
      - name: damage_description
        type: string
        source: input
        description: narrative of the damage
        constraints: 1-1000 characters, non-blank
      - name: claimed_amount_cents
        type: integer
        source: input
        description: amount the claimant demands, in cents
        constraints: claimed_amount_cents >= 1
      - name: reported_date
        type: string
        source: computed
        description: logical clock's current date at intake; decides obligor against builder_obligation_end_date
      - name: obligor
        type: enum
        source: computed
        description: party responsible for this claim, from calculations.claim_obligor_assignment
        constraints: one of {BUILDER, INSURER}
      - name: substantiation_ratio
        type: number
        source: input
        description: adjuster's substantiated share of claimed_amount_cents, supplied at investigation
        default: null
        constraints: 0.00 <= substantiation_ratio <= 1.00, at most 2 decimal places
      - name: designated_structural
        type: boolean
        source: computed
        description: true only when a StructuralAssessment on this claim satisfies calculations.structural_designation
        default: false
      - name: gross_adjusted_cents
        type: integer
        source: computed
        description: substantiated loss before deductible, from calculations.claim_net_payable
        default: 0
      - name: deductible_applied_cents
        type: integer
        source: computed
        description: deductible actually charged, from calculations.claim_net_payable
        default: 0
      - name: betterment_cents
        type: integer
        source: computed
        description: betterment offset withheld, from calculations.claim_net_payable
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: final indemnity authorised, from calculations.claim_net_payable
        default: 0
      - name: reserve_cents
        type: integer
        source: computed
        description: money held but not yet disbursed on this claim
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: money disbursed on this claim net of reversals
        default: 0
      - name: released_cents
        type: integer
        source: computed
        description: reserve given back without payment
        default: 0
      - name: incurred_authorized_cents
        type: integer
        source: computed
        description: conserved total of calculations.claim_incurred_conservation; equals reserve_cents + paid_cents + released_cents
        default: 0
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsAdjuster who recorded the adjudication, used by the segregation-of-duties check
        default: null
      - name: denial_date
        type: string
        source: computed
        description: reported date on which the claim entered DENIED, null otherwise
        default: null
      - name: escalation_deadline_date
        type: string
        source: computed
        description: last date on which the next escalation stage may be opened, from calculations.escalation_deadline
        default: null
      - name: status
        type: enum
        source: system
        description: claim lifecycle across the builder-obligation arm, the insurer arm and the escalation ladder
        default: SUBMITTED
        constraints: one of {SUBMITTED, UNDER_INVESTIGATION, BUILDER_OBLIGATION_NOTICE, BUILDER_REPAIR_ACCEPTED, CLOSED_REPAIRED, INSURER_ADJUDICATION, APPROVED, DENIED, MEDIATION, ARBITRATION, CLOSED_PAID, CLOSED_SETTLED, CLOSED_AWARDED, CLOSED_DENIED_FINAL, SUSPENDED_NO_LIMIT}

  - name: StructuralAssessment
    parent: Claim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the claim this engineering assessment describes
      - name: affected_elements
        type: array
        source: input
        description: building elements the engineer found affected; may legitimately be an empty array
        constraints: each item one of {FOOTING, FOUNDATION_WALL, BEAM, LOAD_BEARING_WALL, ROOF_TRUSS, SLAB, NON_BEARING_PARTITION, FINISH}; 0 to 8 items, no duplicates
      - name: deflection_ratio
        type: number
        source: input
        description: measured deflection as a fraction of span, compared against DEFLECTION_THRESHOLD
        constraints: 0.0000 <= deflection_ratio <= 0.5000, at most 4 decimal places
      - name: load_bearing_affected
        type: boolean
        source: input
        description: engineer's yes/no finding that a load-bearing function is impaired
      - name: assessed_by_user_id
        type: string
        source: system
        description: X-User-ID of the acting ClaimsAdjuster who filed the engineering report
      - name: assessment_date
        type: string
        source: computed
        description: logical clock's current date when the assessment was filed
      - name: designated_structural
        type: boolean
        source: computed
        description: output of calculations.structural_designation for this assessment

  - name: ReserveEntry
    parent: Claim
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the claim whose reserve ledger this entry belongs to
      - name: entry_type
        type: enum
        source: input
        description: which movement this entry records
        constraints: one of {INITIAL, ADJUSTMENT, PAYMENT, PAYMENT_REVERSAL, RELEASE}
      - name: amount_cents
        type: integer
        source: input
        description: absolute magnitude of the movement in cents, always positive
        constraints: amount_cents >= 1
      - name: reversed_entry_id
        type: string
        source: system
        description: FK -> ReserveEntry.id; the PAYMENT entry this PAYMENT_REVERSAL undoes, null on all other entry types
        default: null
      - name: balance_after_reserve_cents
        type: integer
        source: computed
        description: Claim.reserve_cents immediately after this entry was applied
      - name: balance_after_paid_cents
        type: integer
        source: computed
        description: Claim.paid_cents immediately after this entry was applied
      - name: memo
        type: string
        source: input
        description: adjuster note explaining the movement
        default: null
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who recorded the entry

  - name: EscalationCase
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the disputed claim being escalated
      - name: neutral_id
        type: string
        source: input
        description: FK -> Neutral.id; the mediator or arbitrator booked for the session window
      - name: prior_case_id
        type: string
        source: input
        description: FK -> EscalationCase.id; the mediation case whose IMPASSE authorises this arbitration, null for a MEDIATION case
        default: null
      - name: stage
        type: enum
        source: input
        description: rung of the escalation ladder this case occupies
        constraints: one of {MEDIATION, ARBITRATION}
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the booked session window, ISO 8601 UTC
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the booked session window, ISO 8601 UTC
        constraints: window_end > window_start
      - name: binding
        type: boolean
        source: computed
        description: true when stage is ARBITRATION, false when stage is MEDIATION
      - name: settlement_amount_cents
        type: integer
        source: input
        description: agreed amount supplied on POST /warranty/escalation-cases/{id}/session-outcome when the outcome is SETTLED; null otherwise and never accepted at case creation
        default: null
      - name: award_amount_cents
        type: integer
        source: input
        description: amount supplied on POST /warranty/escalation-cases/{id}/award; null until an award is issued and never accepted at case creation; 0 is a valid final denial
        default: null
      - name: outcome_recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsAdjuster who recorded the session outcome, used by the segregation-of-duties check
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle of this escalation session
        default: SCHEDULED
        constraints: one of {SCHEDULED, SETTLED, IMPASSE, AWARD_ISSUED}

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Builder
    axis: underwriting_status
    initial_state: DRAFT
    terminal_states: [DECLINED, DEFAULTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /warranty/builders/{id}/submission"
        actor: BuilderPrincipal
        preconditions:
          - "Builder.underwriting_status == DRAFT"
          - "X-User-ID equals Builder.id"
        side_effects:
          - "Builder.version incremented by 1 and Builder.updated_at refreshed"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /warranty/builders/{id}/review-intake"
        actor: UnderwritingOfficer
        preconditions:
          - "Builder.underwriting_status == SUBMITTED"
        side_effects:
          - "recompute Builder.risk_score and Builder.risk_class via calculations.builder_risk_score variant initial_underwriting"
          - "Builder.risk_basis set to INITIAL_UNDERWRITING"
          - "Builder.version incremented by 1"
      - from: REFERRED
        to: UNDER_REVIEW
        trigger: "POST /warranty/builders/{id}/review-intake"
        actor: UnderwritingOfficer
        preconditions:
          - "Builder.underwriting_status == REFERRED"
        side_effects:
          - "recompute Builder.risk_score and Builder.risk_class via calculations.builder_risk_score variant initial_underwriting"
          - "Builder.risk_basis set to INITIAL_UNDERWRITING"
          - "Builder.version incremented by 1"
        note: "Closes the REFERRED -> UNDER_REVIEW -> REFERRED revision cycle; each intake re-scores from the currently stored declared inputs."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /warranty/builders/{id}/underwriting-reviews with decision APPROVE"
        actor: UnderwritingOfficer
        preconditions:
          - "Builder.underwriting_status == UNDER_REVIEW"
          - "Builder.risk_class IN {A, B, C}"
        side_effects:
          - "create UnderwritingReview with risk_score_snapshot = Builder.risk_score, risk_class_snapshot = Builder.risk_class, resulting_underwriting_status = APPROVED"
          - "Builder.version incremented by 1"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /warranty/builders/{id}/underwriting-reviews with decision DECLINE"
        actor: UnderwritingOfficer
        preconditions:
          - "Builder.underwriting_status == UNDER_REVIEW"
        side_effects:
          - "create UnderwritingReview with resulting_underwriting_status = DECLINED"
          - "Builder.version incremented by 1"
      - from: UNDER_REVIEW
        to: REFERRED
        trigger: "POST /warranty/builders/{id}/underwriting-reviews with decision REFER"
        actor: UnderwritingOfficer
        preconditions:
          - "Builder.underwriting_status == UNDER_REVIEW"
        side_effects:
          - "create UnderwritingReview with resulting_underwriting_status = REFERRED"
          - "Builder.version incremented by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /warranty/builders/{id}/suspension"
        actor: ComplianceOfficer
        preconditions:
          - "Builder.underwriting_status == APPROVED"
        side_effects:
          - "Builder.version incremented by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system, inside POST /warranty/builders/{id}/reassessment when the reassessed risk_class is D"
        actor: system
        preconditions:
          - "Builder.underwriting_status == APPROVED"
          - "calculations.builder_risk_score variant renewal_reassessment assigns risk_class D"
        side_effects:
          - "Builder.risk_score, Builder.risk_class and Builder.risk_basis = RENEWAL_REASSESSMENT written first, then the suspension applied in the same request"
          - "Builder.version incremented by 1 for the whole request"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /warranty/builders/{id}/reinstatement"
        actor: UnderwritingOfficer
        preconditions:
          - "Builder.underwriting_status == SUSPENDED"
          - "Builder.monitoring_posture != FROZEN"
        side_effects:
          - "Builder.version incremented by 1"
        note: "Closes the APPROVED -> SUSPENDED -> APPROVED cycle."
      - from: APPROVED
        to: DEFAULTED
        trigger: "POST /warranty/builders/{id}/default-declaration"
        actor: ComplianceOfficer
        preconditions:
          - "Builder.underwriting_status IN {APPROVED, SUSPENDED}"
        side_effects:
          - "Builder.default_declared_at set to the logical clock instant"
          - "CASCADE link 1: every Claim on a policy of this builder whose status == BUILDER_OBLIGATION_NOTICE transitions to INSURER_ADJUDICATION and its obligor is rewritten from BUILDER to INSURER"
          - "CASCADE link 2: because each such Claim.obligor became INSURER, calculations.claim_net_payable is re-run under variant insurer_backed_settlement for that claim, rewriting deductible_applied_cents, betterment_cents and net_payable_cents, then Claim.incurred_authorized_cents is set to Claim.paid_cents + Claim.released_cents + net_payable_cents and Claim.reserve_cents is set to net_payable_cents"
          - "CASCADE link 3: because those Claim.reserve_cents values changed, Builder.incurred_loss_cents, Builder.loss_ratio and Builder.monitoring_posture are recomputed via calculations.builder_loss_ratio"
          - "every WarrantyPolicy of this builder whose coverage_status == PENDING_ENROLLMENT transitions to VOIDED"
          - "Builder.version incremented by 1"
      - from: SUSPENDED
        to: DEFAULTED
        trigger: "POST /warranty/builders/{id}/default-declaration"
        actor: ComplianceOfficer
        preconditions:
          - "Builder.underwriting_status IN {APPROVED, SUSPENDED}"
        side_effects:
          - "identical cascade to the APPROVED -> DEFAULTED transition"
          - "Builder.version incremented by 1"

  - entity: WarrantyPolicy
    axis: coverage_status
    initial_state: PENDING_ENROLLMENT
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: PENDING_ENROLLMENT
        to: ACTIVE
        trigger: "POST /warranty/policies/{id}/activation"
        actor: UnderwritingOfficer
        preconditions:
          - "WarrantyPolicy.coverage_status == PENDING_ENROLLMENT"
          - "WarrantyPolicy.premium_status == PAID"
          - "WarrantyPolicy.enrollment_hold == false"
          - "Builder.underwriting_status == APPROVED for WarrantyPolicy.builder_id"
        side_effects:
          - "recompute Builder.earned_premium_cents, Builder.loss_ratio and Builder.monitoring_posture via calculations.builder_loss_ratio for WarrantyPolicy.builder_id"
          - "WarrantyPolicy.version incremented by 1"
        note: "Cross-axis guard: the coverage axis cannot advance until the premium axis reaches PAID, and cross-entity guard: the enrolling Builder must still be APPROVED at activation time even though it was APPROVED at enrollment time."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, inside POST /_clock/set_current_utc epoch sweep"
        actor: system
        preconditions:
          - "WarrantyPolicy.coverage_status == ACTIVE"
          - "the policy's BASE CoverageTerm with coverage_type STRUCTURAL has end_date < the new logical clock date"
        side_effects:
          - "every CoverageTerm of this policy with status == OPEN and end_date < the new clock date transitions to ELAPSED"
          - "WarrantyPolicy.version incremented by 1"
        note: "EXPIRED policies still count toward Builder.earned_premium_cents, so no loss-ratio recompute is needed here."
      - from: PENDING_ENROLLMENT
        to: VOIDED
        trigger: "system, inside POST /warranty/builders/{id}/default-declaration"
        actor: system
        preconditions:
          - "WarrantyPolicy.coverage_status == PENDING_ENROLLMENT"
          - "WarrantyPolicy.builder_id is the defaulting builder"
        side_effects:
          - "every CoverageTerm of this policy with status == OPEN transitions to ELAPSED"
          - "WarrantyPolicy.version incremented by 1"

  - entity: WarrantyPolicy
    axis: premium_status
    initial_state: UNBILLED
    terminal_states: [PAID]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /warranty/policies/{id}/premium-invoice"
        actor: UnderwritingOfficer
        preconditions:
          - "WarrantyPolicy.premium_status == UNBILLED"
          - "WarrantyPolicy.coverage_status == PENDING_ENROLLMENT"
        side_effects:
          - "WarrantyPolicy.version incremented by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /warranty/policies/{id}/premium-payments"
        actor: BuilderPrincipal
        preconditions:
          - "WarrantyPolicy.premium_status == INVOICED"
          - "X-User-ID equals WarrantyPolicy.builder_id"
        side_effects:
          - "recompute Builder.earned_premium_cents, Builder.loss_ratio and Builder.monitoring_posture via calculations.builder_loss_ratio for WarrantyPolicy.builder_id"
          - "WarrantyPolicy.version incremented by 1"
        note: "The two WarrantyPolicy axes are independent: premium_status may reach PAID while coverage_status is still PENDING_ENROLLMENT, and coverage_status may reach EXPIRED without premium_status ever leaving UNBILLED."

  - entity: CoverageTerm
    axis: status
    initial_state: OPEN
    terminal_states: [ELAPSED]
    transitions:
      - from: OPEN
        to: LIMIT_EXHAUSTED
        trigger: "system, inside POST /warranty/claims/{id}/payments"
        actor: system
        preconditions:
          - "CoverageTerm.status == OPEN"
          - "CoverageTerm.remaining_limit_cents == 0 after the payment was charged to this term"
        side_effects:
          - "CASCADE link 4: every other Claim on this same CoverageTerm whose status IN {UNDER_INVESTIGATION, BUILDER_OBLIGATION_NOTICE, INSURER_ADJUDICATION, APPROVED} transitions to SUSPENDED_NO_LIMIT, and that claim's reserve_cents is moved into its released_cents leaving incurred_authorized_cents unchanged"
          - "CoverageTerm.version incremented by 1"
      - from: LIMIT_EXHAUSTED
        to: OPEN
        trigger: "system, inside POST /warranty/claims/{id}/payment-reversals"
        actor: system
        preconditions:
          - "CoverageTerm.status == LIMIT_EXHAUSTED"
          - "CoverageTerm.remaining_limit_cents > 0 after the reversal restored limit to this term"
        side_effects:
          - "CoverageTerm.version incremented by 1"
        note: "Compensating transition; claims already moved to SUSPENDED_NO_LIMIT are NOT resurrected, which is why the conserved quantity of calculations.claim_incurred_conservation is asserted per claim rather than per term."
      - from: OPEN
        to: ELAPSED
        trigger: "system, inside POST /_clock/set_current_utc epoch sweep"
        actor: system
        preconditions:
          - "CoverageTerm.status == OPEN"
          - "CoverageTerm.end_date < the new logical clock date"
        side_effects:
          - "CoverageTerm.version incremented by 1"

  - entity: Neutral
    axis: status
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /warranty/neutrals/{id}/deactivation"
        actor: ComplianceOfficer
        preconditions:
          - "Neutral.status == ACTIVE"
        side_effects:
          - "Neutral.version incremented by 1"
        note: "Already-SCHEDULED EscalationCase rows are left untouched; only new bookings are blocked."

  - entity: WarrantyTransfer
    axis: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, RECORDED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: NEEDS_DOCUMENTATION
        trigger: "POST /warranty/transfers/{id}/documentation-request"
        actor: UnderwritingOfficer
        preconditions:
          - "WarrantyTransfer.status == REQUESTED"
        side_effects:
          - "WarrantyTransfer.version incremented by 1"
      - from: NEEDS_DOCUMENTATION
        to: REQUESTED
        trigger: "POST /warranty/transfers/{id}/resubmission"
        actor: Homeowner
        preconditions:
          - "WarrantyTransfer.status == NEEDS_DOCUMENTATION"
          - "X-User-ID equals WarrantyTransfer.requested_by_owner_id"
        side_effects:
          - "WarrantyTransfer.documents_reference overwritten with the submitted reference"
          - "WarrantyTransfer.version incremented by 1"
        note: "Closes the REQUESTED -> NEEDS_DOCUMENTATION -> REQUESTED revision cycle; the loop may run any number of times."
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /warranty/transfers/{id}/decision with outcome APPROVE"
        actor: UnderwritingOfficer
        preconditions:
          - "WarrantyTransfer.status == REQUESTED"
          - "WarrantyTransfer.documents_reference is not null"
        side_effects:
          - "WarrantyTransfer.decision_reason recorded"
          - "WarrantyTransfer.version incremented by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /warranty/transfers/{id}/decision with outcome REJECT"
        actor: UnderwritingOfficer
        preconditions:
          - "WarrantyTransfer.status == REQUESTED"
        side_effects:
          - "WarrantyTransfer.decision_reason recorded"
          - "WarrantyPolicy.pending_transfer_id set to null and WarrantyPolicy.version incremented by 1"
          - "WarrantyTransfer.version incremented by 1"
      - from: APPROVED
        to: RECORDED
        trigger: "POST /warranty/transfers/{id}/recording"
        actor: UnderwritingOfficer
        preconditions:
          - "WarrantyTransfer.status == APPROVED"
          - "no Claim on WarrantyTransfer.policy_id has status IN {MEDIATION, ARBITRATION}"
        side_effects:
          - "WarrantyPolicy.current_owner_id rewritten to WarrantyTransfer.new_owner_id"
          - "WarrantyPolicy.transfer_count incremented by 1"
          - "WarrantyPolicy.pending_transfer_id set to null"
          - "WarrantyPolicy.version incremented by 1"
          - "WarrantyTransfer.version incremented by 1"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system, inside POST /warranty/policies/{id}/transfers when a new request is created on the same policy"
        actor: system
        preconditions:
          - "WarrantyTransfer.status IN {REQUESTED, NEEDS_DOCUMENTATION}"
          - "WarrantyTransfer.id equals WarrantyPolicy.pending_transfer_id"
        side_effects:
          - "the new WarrantyTransfer.prior_transfer_id is set to this row's id"
          - "WarrantyTransfer.version incremented by 1"
      - from: NEEDS_DOCUMENTATION
        to: SUPERSEDED
        trigger: "system, inside POST /warranty/policies/{id}/transfers when a new request is created on the same policy"
        actor: system
        preconditions:
          - "WarrantyTransfer.status IN {REQUESTED, NEEDS_DOCUMENTATION}"
          - "WarrantyTransfer.id equals WarrantyPolicy.pending_transfer_id"
        side_effects:
          - "the new WarrantyTransfer.prior_transfer_id is set to this row's id"
          - "WarrantyTransfer.version incremented by 1"

  - entity: EscalationCase
    axis: status
    initial_state: SCHEDULED
    terminal_states: [SETTLED, IMPASSE, AWARD_ISSUED]
    transitions:
      - from: SCHEDULED
        to: SETTLED
        trigger: "POST /warranty/escalation-cases/{id}/session-outcome with outcome SETTLED"
        actor: ClaimsAdjuster
        preconditions:
          - "EscalationCase.status == SCHEDULED"
          - "the logical clock's current instant >= EscalationCase.window_start"
        side_effects:
          - "EscalationCase.settlement_amount_cents recorded and EscalationCase.outcome_recorded_by_user_id set to the acting X-User-ID"
          - "Claim transitions MEDIATION -> CLOSED_SETTLED (or ARBITRATION -> CLOSED_SETTLED when the arbitration session settles before award)"
          - "Claim.incurred_authorized_cents set to Claim.paid_cents + Claim.released_cents + EscalationCase.settlement_amount_cents and Claim.reserve_cents set to EscalationCase.settlement_amount_cents, preserving the calculations.claim_incurred_conservation identity"
          - "recompute Builder.incurred_loss_cents, Builder.loss_ratio and Builder.monitoring_posture"
          - "EscalationCase.version and Claim.version each incremented by 1"
      - from: SCHEDULED
        to: IMPASSE
        trigger: "POST /warranty/escalation-cases/{id}/session-outcome with outcome IMPASSE"
        actor: ClaimsAdjuster
        preconditions:
          - "EscalationCase.status == SCHEDULED"
          - "the logical clock's current instant >= EscalationCase.window_start"
        side_effects:
          - "EscalationCase.outcome_recorded_by_user_id set to the acting X-User-ID"
          - "Claim.status is left unchanged (MEDIATION stays MEDIATION), and Claim.escalation_deadline_date is rewritten by calculations.escalation_deadline to the clock date plus ARBITRATION_WINDOW_DAYS"
          - "EscalationCase.version and Claim.version each incremented by 1"
      - from: SCHEDULED
        to: AWARD_ISSUED
        trigger: "POST /warranty/escalation-cases/{id}/award"
        actor: ClaimsAdjuster
        preconditions:
          - "EscalationCase.status == SCHEDULED"
          - "EscalationCase.stage == ARBITRATION"
          - "the logical clock's current instant >= EscalationCase.window_start"
          - "the acting X-User-ID differs from the outcome_recorded_by_user_id of EscalationCase.prior_case_id"
        side_effects:
          - "EscalationCase.award_amount_cents recorded"
          - "when award_amount_cents > 0: Claim transitions ARBITRATION -> CLOSED_AWARDED, Claim.incurred_authorized_cents set to Claim.paid_cents + Claim.released_cents + award_amount_cents and Claim.reserve_cents set to award_amount_cents"
          - "when award_amount_cents == 0: Claim transitions ARBITRATION -> CLOSED_DENIED_FINAL, Claim.released_cents increased by the prior Claim.reserve_cents and Claim.reserve_cents set to 0, leaving Claim.incurred_authorized_cents unchanged, and a ReserveEntry with entry_type RELEASE and amount_cents equal to the released amount is appended when that amount is >= 1"
          - "recompute Builder.incurred_loss_cents, Builder.loss_ratio and Builder.monitoring_posture"
          - "EscalationCase.version and Claim.version each incremented by 1"

  - entity: Claim
    axis: status
    initial_state: SUBMITTED
    terminal_states: [CLOSED_REPAIRED, CLOSED_PAID, CLOSED_SETTLED, CLOSED_AWARDED, CLOSED_DENIED_FINAL, SUSPENDED_NO_LIMIT]
    transitions:
      - from: SUBMITTED
        to: UNDER_INVESTIGATION
        trigger: "POST /warranty/claims/{id}/investigation"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SUBMITTED"
        side_effects:
          - "Claim.substantiation_ratio written from the request body"
          - "Claim.gross_adjusted_cents recomputed by calculations.claim_net_payable step 1"
          - "Claim.version incremented by 1"
      - from: UNDER_INVESTIGATION
        to: BUILDER_OBLIGATION_NOTICE
        trigger: "POST /warranty/claims/{id}/obligation-routing when Claim.obligor == BUILDER"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == UNDER_INVESTIGATION"
          - "Claim.substantiation_ratio is not null"
          - "Claim.obligor == BUILDER"
          - "Builder.underwriting_status != DEFAULTED for the policy's builder"
        side_effects:
          - "calculations.claim_net_payable is run under variant builder_obligation_settlement: Claim.deductible_applied_cents set to 0, Claim.betterment_cents and Claim.net_payable_cents written from that variant"
          - "Claim.reserve_cents and Claim.incurred_authorized_cents both remain 0 because the builder, not the insurer, funds this arm"
          - "Claim.version incremented by 1"
        note: "Branch arm A. Its side-effect set is disjoint from arm B: no reserve is established and no Builder loss-ratio recompute occurs."
      - from: UNDER_INVESTIGATION
        to: INSURER_ADJUDICATION
        trigger: "POST /warranty/claims/{id}/obligation-routing when Claim.obligor == INSURER"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == UNDER_INVESTIGATION"
          - "Claim.substantiation_ratio is not null"
          - "Claim.obligor == INSURER"
        side_effects:
          - "calculations.claim_net_payable is run under variant insurer_backed_settlement: Claim.deductible_applied_cents, Claim.betterment_cents and Claim.net_payable_cents written from that variant"
          - "Claim.incurred_authorized_cents set to Claim.paid_cents + Claim.released_cents + Claim.net_payable_cents and Claim.reserve_cents set to Claim.net_payable_cents"
          - "recompute Builder.incurred_loss_cents, Builder.loss_ratio and Builder.monitoring_posture via calculations.builder_loss_ratio"
          - "Claim.version incremented by 1"
        note: "Branch arm B. Same trigger endpoint as arm A; the arm is chosen by Claim.obligor, and the two arms rejoin at INSURER_ADJUDICATION only via the builder-refusal or builder-default transitions."
      - from: BUILDER_OBLIGATION_NOTICE
        to: BUILDER_REPAIR_ACCEPTED
        trigger: "POST /warranty/claims/{id}/builder-response with response ACCEPT_OBLIGATION"
        actor: BuilderPrincipal
        preconditions:
          - "Claim.status == BUILDER_OBLIGATION_NOTICE"
          - "X-User-ID equals the builder_id of the claim's policy"
        side_effects:
          - "Claim.version incremented by 1"
      - from: BUILDER_REPAIR_ACCEPTED
        to: CLOSED_REPAIRED
        trigger: "POST /warranty/claims/{id}/repair-completion"
        actor: BuilderPrincipal
        preconditions:
          - "Claim.status == BUILDER_REPAIR_ACCEPTED"
          - "X-User-ID equals the builder_id of the claim's policy"
        side_effects:
          - "Claim.version incremented by 1"
        note: "Terminal with zero insurer money: reserve_cents, paid_cents, released_cents and incurred_authorized_cents all remain 0."
      - from: BUILDER_OBLIGATION_NOTICE
        to: INSURER_ADJUDICATION
        trigger: "POST /warranty/claims/{id}/builder-response with response REFUSE_OBLIGATION"
        actor: BuilderPrincipal
        preconditions:
          - "Claim.status == BUILDER_OBLIGATION_NOTICE"
          - "X-User-ID equals the builder_id of the claim's policy"
        side_effects:
          - "Claim.obligor rewritten from BUILDER to INSURER"
          - "calculations.claim_net_payable re-run under variant insurer_backed_settlement, rewriting deductible_applied_cents, betterment_cents and net_payable_cents"
          - "Claim.incurred_authorized_cents set to Claim.paid_cents + Claim.released_cents + Claim.net_payable_cents and Claim.reserve_cents set to Claim.net_payable_cents"
          - "recompute Builder.incurred_loss_cents, Builder.loss_ratio and Builder.monitoring_posture"
          - "Claim.version incremented by 1"
        note: "Join point of the fork: arm A rejoins arm B here, and the deductible that arm A had zeroed is now charged."
      - from: BUILDER_OBLIGATION_NOTICE
        to: INSURER_ADJUDICATION
        trigger: "system, inside POST /warranty/builders/{id}/default-declaration"
        actor: system
        preconditions:
          - "Claim.status == BUILDER_OBLIGATION_NOTICE"
          - "the claim's policy belongs to the defaulting builder"
        side_effects:
          - "identical to the REFUSE_OBLIGATION join, and it is CASCADE links 1 to 3 of the builder-default cascade"
          - "Claim.version incremented by 1"
      - from: INSURER_ADJUDICATION
        to: APPROVED
        trigger: "POST /warranty/claims/{id}/adjudication with outcome APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == INSURER_ADJUDICATION"
          - "when Claim.defect_category IN {STRUCTURAL_CRACKING, LOAD_BEARING_FAILURE} at least one StructuralAssessment exists for this claim"
          - "the resolved CoverageTerm.status == OPEN"
        side_effects:
          - "Claim.adjudicated_by_user_id set to the acting X-User-ID"
          - "Claim.version incremented by 1"
      - from: INSURER_ADJUDICATION
        to: DENIED
        trigger: "POST /warranty/claims/{id}/adjudication with outcome DENY"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == INSURER_ADJUDICATION"
          - "when Claim.defect_category IN {STRUCTURAL_CRACKING, LOAD_BEARING_FAILURE} at least one StructuralAssessment exists for this claim"
        side_effects:
          - "Claim.adjudicated_by_user_id set to the acting X-User-ID"
          - "Claim.denial_date set to the logical clock's current date and Claim.escalation_deadline_date set by calculations.escalation_deadline with MEDIATION_WINDOW_DAYS"
          - "Claim.released_cents increased by the prior Claim.reserve_cents, Claim.reserve_cents set to 0, Claim.incurred_authorized_cents unchanged"
          - "appends a ReserveEntry with entry_type RELEASE, amount_cents equal to the released amount and recorded_by_user_id = the acting X-User-ID, but only when the released amount is >= 1"
          - "recompute Builder.incurred_loss_cents, Builder.loss_ratio and Builder.monitoring_posture"
          - "Claim.version incremented by 1"
      - from: APPROVED
        to: CLOSED_PAID
        trigger: "system, inside POST /warranty/claims/{id}/payments when Claim.paid_cents reaches Claim.net_payable_cents"
        actor: system
        preconditions:
          - "Claim.status == APPROVED"
          - "Claim.paid_cents after this payment == Claim.net_payable_cents"
        side_effects:
          - "Claim.version incremented by 1 for the whole request"
      - from: DENIED
        to: MEDIATION
        trigger: "POST /warranty/claims/{id}/escalations with stage MEDIATION"
        actor: Homeowner
        preconditions:
          - "Claim.status == DENIED"
          - "the logical clock's current date <= Claim.escalation_deadline_date"
          - "X-User-ID equals WarrantyPolicy.current_owner_id"
        side_effects:
          - "create EscalationCase with stage MEDIATION, binding false, status SCHEDULED"
          - "Neutral.booked_session_count incremented by 1 and Neutral.version incremented by 1"
          - "Claim.version incremented by 1"
      - from: MEDIATION
        to: ARBITRATION
        trigger: "POST /warranty/claims/{id}/escalations with stage ARBITRATION"
        actor: Homeowner
        preconditions:
          - "Claim.status == MEDIATION"
          - "the EscalationCase named by prior_case_id has claim_id == this claim and status == IMPASSE"
          - "the logical clock's current date <= Claim.escalation_deadline_date"
          - "X-User-ID equals WarrantyPolicy.current_owner_id"
        side_effects:
          - "create EscalationCase with stage ARBITRATION, binding true, status SCHEDULED, prior_case_id as supplied"
          - "Neutral.booked_session_count incremented by 1 and Neutral.version incremented by 1"
          - "Claim.version incremented by 1"
      - from: MEDIATION
        to: CLOSED_SETTLED
        trigger: "system, inside POST /warranty/escalation-cases/{id}/session-outcome with outcome SETTLED"
        actor: system
        preconditions:
          - "Claim.status == MEDIATION"
        side_effects:
          - "see the EscalationCase SCHEDULED -> SETTLED transition"
      - from: ARBITRATION
        to: CLOSED_AWARDED
        trigger: "system, inside POST /warranty/escalation-cases/{id}/award with award_amount_cents > 0"
        actor: system
        preconditions:
          - "Claim.status == ARBITRATION"
        side_effects:
          - "see the EscalationCase SCHEDULED -> AWARD_ISSUED transition"
      - from: ARBITRATION
        to: CLOSED_DENIED_FINAL
        trigger: "system, inside POST /warranty/escalation-cases/{id}/award with award_amount_cents == 0"
        actor: system
        preconditions:
          - "Claim.status == ARBITRATION"
        side_effects:
          - "see the EscalationCase SCHEDULED -> AWARD_ISSUED transition"
        note: "A zero award is the binding final denial; it is a legal award value, not a validation error."
      - from: INSURER_ADJUDICATION
        to: SUSPENDED_NO_LIMIT
        trigger: "system, CASCADE link 4 inside POST /warranty/claims/{id}/payments on a sibling claim"
        actor: system
        preconditions:
          - "Claim.status IN {UNDER_INVESTIGATION, BUILDER_OBLIGATION_NOTICE, INSURER_ADJUDICATION, APPROVED}"
          - "the CoverageTerm named by Claim.coverage_term_id just transitioned OPEN -> LIMIT_EXHAUSTED"
        side_effects:
          - "CASCADE link 4: Claim.released_cents increased by the prior Claim.reserve_cents and Claim.reserve_cents set to 0, Claim.incurred_authorized_cents unchanged, and a ReserveEntry with entry_type RELEASE and amount_cents equal to the released amount is appended to this claim's journal when that amount is >= 1"
          - "CASCADE link 5: because this Claim.reserve_cents changed, Builder.incurred_loss_cents, Builder.loss_ratio and Builder.monitoring_posture are recomputed"
          - "CASCADE link 6: because Builder.monitoring_posture became FROZEN, every WarrantyPolicy of that builder with coverage_status == PENDING_ENROLLMENT has enrollment_hold set to true and its version incremented by 1"
          - "Claim.version incremented by 1"
        note: "The same system transition applies from UNDER_INVESTIGATION, BUILDER_OBLIGATION_NOTICE and APPROVED; only the from-state differs."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: transfer-request-stale-policy
    parent_entity: WarrantyPolicy
    write_endpoint: "POST /warranty/policies/{id}/transfers"
    occ_field: "expected_policy_version"
    description: |
      A homeowner requesting a warranty transfer against a WarrantyPolicy whose version has
      advanced since the client last read it is rejected. The product deliberately allows a new
      transfer request to supersede the policy's open request (the seller changed buyers), so a
      request carrying a stale expected_policy_version is not blocked by any state precondition:
      the policy is still ACTIVE and a new request would otherwise be created and would silently
      supersede a request the client never saw. OCC on WarrantyPolicy.version turns that into a
      deterministic stale-version rejection.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
  - rule_id: reserve-entry-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /warranty/claims/{id}/reserve-entries"
    occ_field: "expected_claim_version"
    description: |
      A ClaimsAdjuster recording an INITIAL or ADJUSTMENT reserve entry against a Claim whose
      version has advanced since the client last read it is rejected. Re-reserving is a legitimate
      repeated operation - each entry overwrites the reserve target rather than adding to it - so a
      second sequential entry would itself succeed and would silently discard a reserve level the
      client never observed. OCC on Claim.version turns that into a deterministic stale-version
      rejection.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: builder_risk_score
    trigger: "POST /warranty/builders/{id}/review-intake (SUBMITTED -> UNDER_REVIEW and REFERRED -> UNDER_REVIEW) and POST /warranty/builders/{id}/reassessment"
    algorithm: weighted_scoring
    formula: |
      # Mode (a) of §0.5 Rule 2: five inputs, non-linear via floor-tiering, two min() caps and a
      # tiered band selection on the output.
      history_penalty  = (100 - effective_claims_score) * 0.50
      volume_factor    = min(40, floor(effective_home_volume / 25) * 8)
      tenure_credit    = min(20, years_in_business * 2)
      strength_bonus   = STRENGTH_BONUS[financial_strength_tier]
      raw              = 50 + history_penalty + (volume_factor * 0.25) - tenure_credit - strength_bonus
      risk_score       = round_half_up(max(0, min(100, raw)), 2)
      # Band selection - lower bound inclusive, upper bound exclusive:
      risk_class = A  when risk_score <  25.00
      risk_class = B  when 25.00 <= risk_score <  45.00
      risk_class = C  when 45.00 <= risk_score <  65.00
      risk_class = D  when risk_score >= 65.00
    input_set: |
      Always the single Builder row named in the path. `effective_claims_score` and
      `effective_home_volume` are supplied by the active variant below; `years_in_business` and
      `financial_strength_tier` are read from the Builder row in both variants.
    constants:
      STRENGTH_BONUS: { TIER_1: 15, TIER_2: 8, TIER_3: 0 }
      VOLUME_BUCKET_SIZE: 25
      VOLUME_POINTS_PER_BUCKET: 8
      VOLUME_WEIGHT: 0.25
      VOLUME_CAP: 40
      TENURE_CAP: 20
      OBSERVED_LOSS_WEIGHT: 60
      CLASS_B_FLOOR: 25.00
      CLASS_C_FLOOR: 45.00
      CLASS_D_FLOOR: 65.00
    precision: "risk_score 2 decimal places, round_half_up; band comparisons are made on the rounded risk_score"
    variants:
      - name: initial_underwriting
        when: "POST /warranty/builders/{id}/review-intake - the underwriting pass on declared data"
        difference: |
          effective_claims_score = Builder.claims_history_score (the declared score)
          effective_home_volume  = Builder.homes_closed_last_year (the declared volume)
          Builder.risk_basis is set to INITIAL_UNDERWRITING.
      - name: renewal_reassessment
        when: "POST /warranty/builders/{id}/reassessment - the monitoring pass on observed data"
        difference: |
          effective_claims_score = max(0, min(100, round_half_up(100 - (Builder.loss_ratio * OBSERVED_LOSS_WEIGHT), 2)))
          effective_home_volume  = count of WarrantyPolicy rows with builder_id = this builder and
                                   coverage_status IN {ACTIVE, EXPIRED} (PENDING_ENROLLMENT and
                                   VOIDED policies are excluded)
          Builder.risk_basis is set to RENEWAL_REASSESSMENT.
          For identical Builder rows the two variants produce different risk_score values and can
          produce different risk_class bands, because declared volume and declared claims history
          are replaced by realised enrollment count and realised loss ratio.

  - name: policy_premium
    trigger: "POST /warranty/policies (enrollment at closing); never re-run afterwards"
    algorithm: tiered_pricing
    formula: |
      # Mode (b) of §0.5 Rule 2: the rounding order is pinned. Each of the three coverage
      # components is rounded to whole cents INDEPENDENTLY and the three rounded integers are then
      # summed. Summing the three exact rational values and rounding once at the end is the
      # rejected alternative and produces a different premium for some prices.
      bp    = BASE_RATE_BP[risk_class_at_enrollment]
      load  = STRUCTURAL_LOADING[risk_class_at_enrollment]
      premium_component_workmanship_cents = round_half_up(purchase_price_cents * SHARE_WORKMANSHIP * bp / 10000)
      premium_component_systems_cents     = round_half_up(purchase_price_cents * SHARE_SYSTEMS     * bp / 10000)
      premium_component_structural_cents  = round_half_up(purchase_price_cents * SHARE_STRUCTURAL  * bp / 10000 * load)
      state_surcharge_cents = STATE_SURCHARGE[WarrantyPolicy.state_code]
      premium_cents = premium_component_workmanship_cents
                    + premium_component_systems_cents
                    + premium_component_structural_cents
                    + state_surcharge_cents
      # The structural component performs exactly ONE rounding, after the loading multiplier.
      # Rounding before the loading multiplier is also rejected.
    input_set: |
      The single WarrantyPolicy being created. risk_class_at_enrollment is a snapshot of
      Builder.risk_class taken at enrollment; a later reassessment of the builder never re-rates an
      existing policy.
    constants:
      BASE_RATE_BP: { A: 38, B: 52, C: 71, D: 95 }
      STRUCTURAL_LOADING: { A: 1.00, B: 1.10, C: 1.25, D: 1.45 }
      SHARE_WORKMANSHIP: 0.18
      SHARE_SYSTEMS: 0.27
      SHARE_STRUCTURAL: 0.55
      STATE_SURCHARGE: { TX: 4500, FL: 9500, CO: 2500, AZ: 0, NC: 1500 }
    precision: "whole cents; round_half_up applied once per component, then integer addition; the surcharge is added last and is never rounded"

  - name: coverage_term_schedule
    trigger: "POST /warranty/policies (enrollment at closing) - mints the three BASE CoverageTerm rows and WarrantyPolicy.builder_obligation_end_date"
    algorithm: interval_merge
    formula: |
      add_years(d, n):
        candidate = same month and day as d, year(d) + n
        if that calendar date does not exist (only 02-29 into a non-leap year),
          candidate = last day of that month in year(d) + n
        return candidate
      start_date(all three BASE terms) = WarrantyPolicy.coverage_start_date = closing_date
      end_date(WORKMANSHIP) = add_years(closing_date, 1)  - 1 day
      end_date(SYSTEMS)     = add_years(closing_date, 2)  - 1 day
      end_date(STRUCTURAL)  = add_years(closing_date, 10) - 1 day
      builder_obligation_end_date = add_years(closing_date, Builder.obligation_period_years) - 1 day
      limit_cents(WORKMANSHIP) = min(round_half_up(purchase_price_cents * 0.10), WORKMANSHIP_LIMIT_CAP_CENTS)
      limit_cents(SYSTEMS)     = min(round_half_up(purchase_price_cents * 0.25), SYSTEMS_LIMIT_CAP_CENTS)
      limit_cents(STRUCTURAL)  = purchase_price_cents
      deductible_cents(WORKMANSHIP) = STANDARD_DEDUCTIBLE_CENTS
      deductible_cents(SYSTEMS)     = STANDARD_DEDUCTIBLE_CENTS
      deductible_cents(STRUCTURAL)  = STRUCTURAL_DEDUCTIBLE_CENTS
      consumed_limit_cents = 0 and remaining_limit_cents = limit_cents for every new term
      # All CoverageTerm intervals are CLOSED on both ends: a date d is covered when
      # start_date <= d <= end_date.
    input_set: "The single WarrantyPolicy being created plus Builder.obligation_period_years of its builder."
    constants:
      WORKMANSHIP_YEARS: 1
      SYSTEMS_YEARS: 2
      STRUCTURAL_YEARS: 10
      WORKMANSHIP_LIMIT_CAP_CENTS: 2000000
      SYSTEMS_LIMIT_CAP_CENTS: 6000000
      STANDARD_DEDUCTIBLE_CENTS: 100000
      STRUCTURAL_DEDUCTIBLE_CENTS: 250000
    precision: "dates are ISO 8601 calendar dates with no time component; limits are whole cents, round_half_up"

  - name: claim_obligor_assignment
    trigger: "POST /warranty/claims (intake) - sets Claim.reported_date, Claim.coverage_term_id and Claim.obligor"
    algorithm: threshold
    formula: |
      reported_date = the logical clock's current date at intake
      coverage_term_id = the id of the CoverageTerm on Claim.policy_id whose coverage_type equals
                         Claim.coverage_type, whose start_date <= reported_date <= end_date, ranked
                         by term_kind with BASE before ENDORSEMENT, then by start_date ASC, then by
                         created_at ASC; when no such term exists the intake is rejected with
                         ERR_NO_COVERAGE_IN_FORCE
      obligor = BUILDER  when reported_date <= WarrantyPolicy.builder_obligation_end_date
      obligor = INSURER  when reported_date >  WarrantyPolicy.builder_obligation_end_date
    input_set: |
      The CoverageTerm rows of the claim's policy with status IN {OPEN, LIMIT_EXHAUSTED}; terms with
      status ELAPSED are excluded from the candidate set. The candidate set may legitimately be
      empty, which is the ERR_NO_COVERAGE_IN_FORCE path.
    constants:
      OBLIGATION_BOUNDARY_INCLUSIVE: true
    precision: "date comparison only; the boundary date itself is builder-obligated"

  - name: structural_designation
    trigger: "POST /warranty/claims/{id}/structural-assessments - sets StructuralAssessment.designated_structural and Claim.designated_structural"
    algorithm: constraint_propagation
    formula: |
      load_bearing_hits = count of items in affected_elements that are members of LOAD_BEARING_ELEMENTS
      designated_structural = (load_bearing_affected == true)
                              AND (load_bearing_hits >= 1)
                              AND (deflection_ratio >= DEFLECTION_THRESHOLD)
      # All three conjuncts are required. An empty affected_elements array yields
      # load_bearing_hits == 0 and therefore designated_structural == false even when
      # load_bearing_affected is true and the deflection is severe.
      Claim.designated_structural = true when ANY StructuralAssessment on the claim has
                                    designated_structural == true, otherwise false
    input_set: "All StructuralAssessment rows on the claim, including ones filed earlier; the claim-level flag is a logical OR and is never lowered once raised."
    constants:
      LOAD_BEARING_ELEMENTS: [FOOTING, FOUNDATION_WALL, BEAM, LOAD_BEARING_WALL, ROOF_TRUSS, SLAB]
      DEFLECTION_THRESHOLD: 0.0033
    precision: "deflection_ratio compared at 4 decimal places; the threshold itself qualifies (>=)"

  - name: claim_net_payable
    trigger: "POST /warranty/claims/{id}/investigation (step 1 only), POST /warranty/claims/{id}/obligation-routing, POST /warranty/claims/{id}/builder-response with REFUSE_OBLIGATION, and the cascade inside POST /warranty/builders/{id}/default-declaration"
    algorithm: waterfall_allocation
    formula: |
      # Mode (c) of §0.5 Rule 2: betterment looks circular because the betterment percentage is
      # keyed on a payable tier while betterment itself reduces the payable. The evaluation order is
      # PINNED: the tier is selected from provisional_net_cents, which is the value BEFORE
      # betterment is subtracted. Re-selecting the tier from the post-betterment figure is the
      # rejected reading.
      step 1: gross_adjusted_cents = round_half_up(claimed_amount_cents * substantiation_ratio)
      step 2: deductible_schedule_cents = STRUCTURAL_DEDUCTIBLE_CENTS when Claim.designated_structural == true
                                         else STANDARD_DEDUCTIBLE_CENTS
      step 3: deductible_applied_cents = 0 under variant builder_obligation_settlement
                                         else min(deductible_schedule_cents, gross_adjusted_cents)
      step 4: provisional_net_cents = gross_adjusted_cents - deductible_applied_cents
      step 5: betterment_pct = 0.00 when provisional_net_cents <  BETTERMENT_TIER_1_FLOOR
                               0.05 when BETTERMENT_TIER_1_FLOOR <= provisional_net_cents < BETTERMENT_TIER_2_FLOOR
                               0.08 when provisional_net_cents >= BETTERMENT_TIER_2_FLOOR
      step 6: betterment_cents = round_half_up(provisional_net_cents * betterment_pct)
      step 7: net_payable_cents = min(provisional_net_cents - betterment_cents,
                                      CoverageTerm.remaining_limit_cents of Claim.coverage_term_id)
    input_set: |
      The single Claim row plus the CoverageTerm named by Claim.coverage_term_id. Claim.designated_structural
      reflects every StructuralAssessment filed on the claim up to this moment. Step 1 is also run on
      its own at investigation time so gross_adjusted_cents is observable before routing.
    constants:
      STANDARD_DEDUCTIBLE_CENTS: 100000
      STRUCTURAL_DEDUCTIBLE_CENTS: 250000
      BETTERMENT_TIER_1_FLOOR: 500000
      BETTERMENT_TIER_2_FLOOR: 1500000
      BETTERMENT_TIER_1_PCT: 0.05
      BETTERMENT_TIER_2_PCT: 0.08
    precision: "whole cents, round_half_up at step 1 and at step 6 only; steps 4 and 7 are exact integer arithmetic"
    variants:
      - name: builder_obligation_settlement
        when: "Claim.obligor == BUILDER at the moment the calculation runs (the BUILDER_OBLIGATION_NOTICE arm)"
        difference: |
          Step 3 forces deductible_applied_cents = 0 because the builder repairs in kind and no
          policy deductible is charged to the homeowner. Because provisional_net_cents is therefore
          larger, step 5 can select a HIGHER betterment tier than the insurer variant selects on the
          identical claim inputs. No reserve is established and Builder.incurred_loss_cents is not
          touched.
      - name: insurer_backed_settlement
        when: "Claim.obligor == INSURER at the moment the calculation runs (the INSURER_ADJUDICATION arm, including the refusal join and the builder-default cascade)"
        difference: |
          Step 3 charges min(deductible_schedule_cents, gross_adjusted_cents). The resulting
          net_payable_cents is strictly lower than the builder variant's for the same claim, the
          amount becomes Claim.reserve_cents, and Builder.incurred_loss_cents, loss_ratio and
          monitoring_posture are recomputed. The two variants therefore disagree on the same claim
          row purely because of which period the reported_date fell in.

  - name: claim_incurred_conservation
    trigger: "every write that touches Claim.reserve_cents, Claim.paid_cents or Claim.released_cents: POST /warranty/claims/{id}/reserve-entries, POST /warranty/claims/{id}/payments, POST /warranty/claims/{id}/payment-reversals, the DENIED transition, CASCADE link 4, the SETTLED transition and the AWARD_ISSUED transition"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1: authorised indemnity on a claim.
      INVARIANT: Claim.reserve_cents + Claim.paid_cents + Claim.released_cents
                 == Claim.incurred_authorized_cents      (must hold after every request)
      reserve entry (INITIAL or ADJUSTMENT with amount A):
        Claim.incurred_authorized_cents = Claim.paid_cents + Claim.released_cents + A
        Claim.reserve_cents             = A
      payment (amount A):            Claim.paid_cents += A ; Claim.reserve_cents -= A ; incurred unchanged
      payment reversal (amount A):   Claim.paid_cents -= A ; Claim.reserve_cents += A ; incurred unchanged
      release (denial, limit-exhaustion suspension, zero award):
                                     Claim.released_cents += Claim.reserve_cents ; Claim.reserve_cents = 0 ; incurred unchanged
                                     and a RELEASE journal row is appended for the released amount when it is >= 1
      # A payment followed by its reversal is therefore a no-op on all four fields:
      # reserve and paid return to their pre-payment values and incurred never moved.
    input_set: "The single Claim row; every ReserveEntry on the claim is an append-only journal of these movements and never re-derives the balances."
    constants:
      RESERVE_FLOOR_CENTS: 0
    precision: "whole cents, exact integer arithmetic, no rounding anywhere"

  - name: coverage_limit_conservation
    trigger: "POST /warranty/claims/{id}/payments and POST /warranty/claims/{id}/payment-reversals"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2: indemnity capacity on a coverage term. Distinct in kind from
      # conserved quantity #1 - this one is a capacity ceiling that was never money in a reserve.
      INVARIANT: CoverageTerm.remaining_limit_cents + CoverageTerm.consumed_limit_cents
                 == CoverageTerm.limit_cents          (must hold after every request)
      payment of A charged to the term:  consumed_limit_cents += A ; remaining_limit_cents -= A
      reversal of A on the term:         consumed_limit_cents -= A ; remaining_limit_cents += A
      # limit_cents itself is immutable after the term is created, so a payment plus its reversal
      # restores both derived fields exactly.
    input_set: "The single CoverageTerm named by Claim.coverage_term_id of the claim being paid; other terms on the same policy are untouched."
    constants:
      LIMIT_FLOOR_CENTS: 0
    precision: "whole cents, exact integer arithmetic, no rounding anywhere"

  - name: builder_loss_ratio
    trigger: "every mutation that changes an included premium or an included claim amount: POST /warranty/policies/{id}/activation, POST /warranty/policies/{id}/premium-payments, the INSURER_ADJUDICATION routing and refusal joins, the DENIED transition, POST /warranty/claims/{id}/reserve-entries, POST /warranty/claims/{id}/payments, POST /warranty/claims/{id}/payment-reversals, CASCADE links 4 and 5, the SETTLED and AWARD_ISSUED transitions, and the builder-default cascade"
    algorithm: aggregation
    formula: |
      earned_premium_cents = sum of WarrantyPolicy.premium_cents over policies with
        builder_id = this builder AND coverage_status IN {ACTIVE, EXPIRED} AND premium_status == PAID
        (PENDING_ENROLLMENT and VOIDED policies are excluded, and an ACTIVE policy whose premium was
         never paid is excluded)
      incurred_loss_cents = sum of (Claim.reserve_cents + Claim.paid_cents) over claims whose
        policy_id belongs to a policy of this builder AND whose obligor == INSURER, with no status
        filter at all - every claim status is included, terminal or not
        (Claim.released_cents never enters the numerator, so releasing a reserve lowers incurred
         loss; builder-obligated claims are excluded outright, which is why flipping obligor to
         INSURER in the builder-default cascade raises incurred_loss_cents)
      loss_ratio = 0.0000 when earned_premium_cents == 0
                   else round_half_up(incurred_loss_cents / earned_premium_cents, 4)
      monitoring_posture = OPEN       when loss_ratio <  POSTURE_WATCH_FLOOR
                           WATCH      when POSTURE_WATCH_FLOOR      <= loss_ratio < POSTURE_RESTRICTED_FLOOR
                           RESTRICTED when POSTURE_RESTRICTED_FLOOR <= loss_ratio < POSTURE_FROZEN_FLOOR
                           FROZEN     when loss_ratio >= POSTURE_FROZEN_FLOOR
      # Empty-denominator rule, pinned: when no policy of the builder is both in {ACTIVE, EXPIRED}
      # and PAID, loss_ratio is 0.0000 and monitoring_posture is OPEN, EVEN IF incurred_loss_cents
      # is positive. An unbounded or FROZEN reading is the rejected alternative.
    input_set: |
      All WarrantyPolicy rows of the builder for the denominator, filtered exactly as above; all
      Claim rows on those policies for the numerator, filtered exactly as above. Both sets may be
      empty. The sums are recomputed from scratch on every trigger; no incremental accumulator is
      kept.
    constants:
      POSTURE_WATCH_FLOOR: 0.6500
      POSTURE_RESTRICTED_FLOOR: 0.9000
      POSTURE_FROZEN_FLOOR: 1.2000
    precision: "loss_ratio 4 decimal places, round_half_up; posture bands compare the ROUNDED loss_ratio, lower bound inclusive"

  - name: transfer_fee
    trigger: "POST /warranty/policies/{id}/transfers (request creation)"
    algorithm: threshold
    formula: |
      transfer_fee_cents = TRANSFER_BASE_FEE_CENTS
                         + (REPEAT_TRANSFER_FEE_CENTS * WarrantyPolicy.transfer_count)
      # transfer_count is the number of RECORDED transfers on the policy at request time;
      # superseded and rejected requests never raise it.
    input_set: "The single WarrantyPolicy named in the path."
    constants:
      TRANSFER_BASE_FEE_CENTS: 7500
      REPEAT_TRANSFER_FEE_CENTS: 2500
    precision: "whole cents, exact integer arithmetic"

  - name: escalation_deadline
    trigger: "the INSURER_ADJUDICATION -> DENIED transition and the EscalationCase SCHEDULED -> IMPASSE transition"
    algorithm: threshold
    formula: |
      on DENIED:  Claim.escalation_deadline_date = Claim.denial_date + MEDIATION_WINDOW_DAYS days
      on IMPASSE: Claim.escalation_deadline_date = (the logical clock's current date) + ARBITRATION_WINDOW_DAYS days
      # The deadline is inclusive: opening the next stage exactly on escalation_deadline_date is
      # allowed; one day later is ERR_ESCALATION_WINDOW_ELAPSED.
    input_set: "The single Claim row plus the logical clock."
    constants:
      MEDIATION_WINDOW_DAYS: 60
      ARBITRATION_WINDOW_DAYS: 30
    precision: "calendar-day arithmetic on ISO 8601 dates, inclusive upper bound"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles and appears in the called endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for a BuilderPrincipal, X-User-ID equals the Builder.id addressed by the request - the path builder id, or WarrantyPolicy.builder_id, or the builder_id of the claim's policy"
    error_id: ERR_NOT_BUILDER_PRINCIPAL
    http_status: 403
    applies_to: "POST /warranty/builders/{id}/submission, POST /warranty/policies, POST /warranty/policies/{id}/premium-payments, POST /warranty/claims/{id}/builder-response, POST /warranty/claims/{id}/repair-completion"
  - priority: 4
    category: auth
    check: "for a Homeowner, X-User-ID equals WarrantyPolicy.current_owner_id of the addressed policy (or, on transfer resubmission, WarrantyTransfer.requested_by_owner_id)"
    error_id: ERR_NOT_POLICY_OWNER
    http_status: 403
    applies_to: "POST /warranty/policies/{id}/transfers, POST /warranty/transfers/{id}/resubmission, POST /warranty/claims, POST /warranty/claims/{id}/escalations"
  - priority: 5
    category: auth
    check: "segregation of duties: on a payment, X-User-ID differs from Claim.adjudicated_by_user_id; on an arbitration award, X-User-ID differs from the outcome_recorded_by_user_id of EscalationCase.prior_case_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /warranty/claims/{id}/payments, POST /warranty/escalation-cases/{id}/award"
  - priority: 10
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: "ERR_BUILDER_NOT_FOUND | ERR_HOMEOWNER_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_COVERAGE_TERM_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_TRANSFER_NOT_FOUND | ERR_ESCALATION_CASE_NOT_FOUND | ERR_NEUTRAL_NOT_FOUND | ERR_RESERVE_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 11
    category: existence
    check: "every foreign key supplied in the request body resolves: builder_id, initial_owner_id, new_owner_id, policy_id, neutral_id, prior_case_id, reserve_entry_id"
    error_id: "ERR_BUILDER_NOT_FOUND | ERR_HOMEOWNER_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_NEUTRAL_NOT_FOUND | ERR_ESCALATION_CASE_NOT_FOUND | ERR_RESERVE_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /warranty/policies, POST /warranty/policies/{id}/transfers, POST /warranty/claims, POST /warranty/claims/{id}/escalations, POST /warranty/claims/{id}/payment-reversals"
  - priority: 20
    category: business_constraint
    check: "every required body field is present, of the declared type, inside its declared numeric range, and every enum value is a declared member; amount fields are >= their declared floor; affected_elements has no duplicates"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a request body"
  - priority: 21
    category: business_constraint
    check: "pagination limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"
  - priority: 22
    category: business_temporal
    check: "on the logical clock endpoint, to_iso8601 is not earlier than the clock's current instant"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 30
    category: state
    check: "expected_policy_version equals WarrantyPolicy.version / expected_claim_version equals Claim.version"
    error_id: "ERR_STALE_POLICY_VERSION | ERR_STALE_CLAIM_VERSION"
    http_status: 412
    applies_to: "POST /warranty/policies/{id}/transfers, POST /warranty/claims/{id}/reserve-entries"
  - priority: 40
    category: state
    check: "the addressed entity is in a declared from-state for the requested §1.2 transition"
    error_id: "ERR_INVALID_BUILDER_STATE | ERR_INVALID_POLICY_STATE | ERR_INVALID_PREMIUM_STATE | ERR_INVALID_CLAIM_STATE | ERR_INVALID_TRANSFER_STATE | ERR_INVALID_ESCALATION_STATE | ERR_INVALID_NEUTRAL_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 41
    category: state
    check: "the enrolling Builder.underwriting_status == APPROVED"
    error_id: ERR_BUILDER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /warranty/policies, POST /warranty/policies/{id}/activation"
  - priority: 42
    category: state
    check: "WarrantyPolicy.premium_status == PAID"
    error_id: ERR_PREMIUM_NOT_PAID
    http_status: 409
    applies_to: "POST /warranty/policies/{id}/activation"
  - priority: 43
    category: state
    check: "WarrantyPolicy.enrollment_hold == false"
    error_id: ERR_ENROLLMENT_ON_HOLD
    http_status: 409
    applies_to: "POST /warranty/policies/{id}/activation"
  - priority: 44
    category: state
    check: "WarrantyPolicy.coverage_status == ACTIVE"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /warranty/claims, POST /warranty/policies/{id}/transfers, POST /warranty/policies/{id}/coverage-terms"
  - priority: 45
    category: state
    check: "the CoverageTerm resolved for the claim has status == OPEN"
    error_id: ERR_COVERAGE_LIMIT_EXHAUSTED
    http_status: 409
    applies_to: "POST /warranty/claims/{id}/adjudication, POST /warranty/claims/{id}/payments"
  - priority: 46
    category: state
    check: "Neutral.status == ACTIVE for the booked neutral, and Neutral.credential admits the requested stage (MEDIATOR or BOTH for MEDIATION, ARBITRATOR or BOTH for ARBITRATION)"
    error_id: "ERR_NEUTRAL_INACTIVE | ERR_NEUTRAL_CREDENTIAL_MISMATCH"
    http_status: 409
    applies_to: "POST /warranty/claims/{id}/escalations"
  - priority: 47
    category: state
    check: "an APPROVE transfer decision requires WarrantyTransfer.documents_reference to be non-null"
    error_id: ERR_MISSING_TRANSFER_DOCUMENTATION
    http_status: 409
    applies_to: "POST /warranty/transfers/{id}/decision"
  - priority: 48
    category: state
    check: "the builder of the claim's policy has underwriting_status != DEFAULTED before a claim may be routed into the builder-obligation arm"
    error_id: ERR_BUILDER_DEFAULTED
    http_status: 409
    applies_to: "POST /warranty/claims/{id}/obligation-routing"
  - priority: 50
    category: business_safety
    check: "a claim whose defect_category IN {STRUCTURAL_CRACKING, LOAD_BEARING_FAILURE} has at least one StructuralAssessment on file before it may be adjudicated"
    error_id: ERR_STRUCTURAL_ASSESSMENT_REQUIRED
    http_status: 409
    applies_to: "POST /warranty/claims/{id}/adjudication"
  - priority: 51
    category: business_safety
    check: "an ARBITRATION escalation supplies prior_case_id and that case has status == IMPASSE"
    error_id: ERR_MEDIATION_NOT_EXHAUSTED
    http_status: 409
    applies_to: "POST /warranty/claims/{id}/escalations"
  - priority: 52
    category: business_safety
    check: "an APPROVE underwriting decision is refused when Builder.risk_class == D"
    error_id: ERR_RISK_CLASS_INELIGIBLE
    http_status: 409
    applies_to: "POST /warranty/builders/{id}/underwriting-reviews"
  - priority: 53
    category: business_temporal
    check: "the logical clock's current instant is at or after EscalationCase.window_start before a session outcome or an award may be recorded"
    error_id: ERR_SESSION_WINDOW_NOT_STARTED
    http_status: 409
    applies_to: "POST /warranty/escalation-cases/{id}/session-outcome, POST /warranty/escalation-cases/{id}/award"
  - priority: 54
    category: business_temporal
    check: "transfer_date falls inside the policy's BASE STRUCTURAL CoverageTerm closed interval [start_date, end_date]"
    error_id: ERR_COVERAGE_TERM_ELAPSED
    http_status: 422
    applies_to: "POST /warranty/policies/{id}/transfers"
  - priority: 55
    category: business_temporal
    check: "a CoverageTerm of the claimed coverage_type covers the claim's reported_date per calculations.claim_obligor_assignment"
    error_id: ERR_NO_COVERAGE_IN_FORCE
    http_status: 422
    applies_to: "POST /warranty/claims"
  - priority: 56
    category: business_temporal
    check: "the logical clock's current date <= Claim.escalation_deadline_date"
    error_id: ERR_ESCALATION_WINDOW_ELAPSED
    http_status: 422
    applies_to: "POST /warranty/claims/{id}/escalations"
  - priority: 57
    category: business_temporal
    check: "the requested [window_start, window_end) session window on the booked Neutral is clear of every other EscalationCase window on that neutral, treating windows as HALF-OPEN (a window that starts exactly when another ends does not itself overlap) and widening the requested window by NEUTRAL_TURNAROUND_MINUTES = 120 minutes on BOTH sides before comparing"
    error_id: ERR_NEUTRAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /warranty/claims/{id}/escalations"
  - priority: 58
    category: business_temporal
    check: "an ENDORSEMENT CoverageTerm does not overlap any existing CoverageTerm of the same coverage_type on the policy, treating both intervals as CLOSED on both ends with no buffer"
    error_id: ERR_COVERAGE_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /warranty/policies/{id}/coverage-terms"
  - priority: 59
    category: business_referential
    check: "new_owner_id differs from WarrantyPolicy.current_owner_id"
    error_id: ERR_TRANSFEREE_IS_CURRENT_OWNER
    http_status: 422
    applies_to: "POST /warranty/policies/{id}/transfers"
  - priority: 60
    category: business_referential
    check: "the EscalationCase named by prior_case_id has claim_id equal to the claim in the path"
    error_id: ERR_PRIOR_CASE_CLAIM_MISMATCH
    http_status: 422
    applies_to: "POST /warranty/claims/{id}/escalations"
  - priority: 61
    category: business_referential
    check: "no Claim on the policy has status IN {MEDIATION, ARBITRATION} when a transfer is recorded"
    error_id: ERR_OPEN_DISPUTE_BLOCKS_TRANSFER
    http_status: 409
    applies_to: "POST /warranty/transfers/{id}/recording"
  - priority: 62
    category: business_referential
    check: "the ReserveEntry named by reserve_entry_id belongs to the claim in the path and has entry_type == PAYMENT and has not already been reversed"
    error_id: ERR_ENTRY_NOT_REVERSIBLE
    http_status: 422
    applies_to: "POST /warranty/claims/{id}/payment-reversals"
  - priority: 70
    category: business_fiscal
    check: "the addressed Builder.monitoring_posture != FROZEN - the enrolling builder on an enrollment, the suspended builder on a reinstatement"
    error_id: ERR_BUILDER_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /warranty/policies, POST /warranty/builders/{id}/reinstatement"
  - priority: 71
    category: business_fiscal
    check: "when the enrolling Builder.monitoring_posture == RESTRICTED the request carries posture_override_acknowledged == true"
    error_id: ERR_POSTURE_OVERRIDE_REQUIRED
    http_status: 409
    applies_to: "POST /warranty/policies"
  - priority: 72
    category: business_fiscal
    check: "a payment amount_cents does not exceed Claim.reserve_cents"
    error_id: ERR_PAYMENT_EXCEEDS_RESERVE
    http_status: 422
    applies_to: "POST /warranty/claims/{id}/payments"
  - priority: 73
    category: business_fiscal
    check: "a payment amount_cents does not exceed CoverageTerm.remaining_limit_cents of the claim's term"
    error_id: ERR_COVERAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /warranty/claims/{id}/payments"
  - priority: 74
    category: business_fiscal
    check: "an INITIAL reserve entry is refused when the claim already carries a ReserveEntry of entry_type INITIAL or ADJUSTMENT - a reserve that already exists is re-authorised with ADJUSTMENT, never re-initialised"
    error_id: ERR_INITIAL_RESERVE_ALREADY_SET
    http_status: 422
    applies_to: "POST /warranty/claims/{id}/reserve-entries"
  - priority: 75
    category: business_fiscal
    check: "an ADJUSTMENT reserve entry's amount_cents is not lower than Claim.paid_cents - the re-authorised reserve may never fall below what has already been disbursed on the claim"
    error_id: ERR_AUTHORIZATION_BELOW_DISBURSED
    http_status: 422
    applies_to: "POST /warranty/claims/{id}/reserve-entries"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Builder enrollment and underwriting -------------------------------
  - method: POST
    path: "/warranty/builders"
    description: "Open a builder enrollment file with the declared underwriting inputs. Lands in DRAFT with no risk score."
    roles: [UnderwritingOfficer]
    code: 201
    input: [company_name, state_code, years_in_business, homes_closed_last_year, claims_history_score, financial_strength_tier]
    output: Builder
    side_effects:
      - "underwriting_status = DRAFT, risk_score / risk_class / risk_basis = null, obligation_period_years = 2"
      - "earned_premium_cents = 0, incurred_loss_cents = 0, loss_ratio = 0.0000, monitoring_posture = OPEN, default_declared_at = null"
      - "the returned id is the X-User-ID a BuilderPrincipal uses to act as this builder"
  - method: POST
    path: "/warranty/builders/{id}/submission"
    description: "Builder principal attests to the declared data and submits the file for underwriting."
    roles: [BuilderPrincipal]
    code: 200
    input: [attestation_signed]
    output: Builder
    side_effects:
      - "§1.2 Builder DRAFT -> SUBMITTED"
      - "Builder.version incremented by 1"
  - method: POST
    path: "/warranty/builders/{id}/review-intake"
    description: "Take the submitted (or referred-back) file into review and score it on the DECLARED inputs."
    roles: [UnderwritingOfficer]
    code: 200
    input: ["intake_note?"]
    output: Builder
    side_effects:
      - "§1.2 Builder SUBMITTED -> UNDER_REVIEW or REFERRED -> UNDER_REVIEW"
      - "calculations.builder_risk_score variant initial_underwriting writes risk_score and risk_class"
      - "Builder.risk_basis = INITIAL_UNDERWRITING; Builder.version incremented by 1"
  - method: POST
    path: "/warranty/builders/{id}/underwriting-reviews"
    description: "Record the underwriting decision on a file under review. APPROVE is refused for risk_class D."
    roles: [UnderwritingOfficer]
    code: 201
    input: [decision, "reviewer_notes?"]
    output: UnderwritingReview
    side_effects:
      - "§1.2 Builder UNDER_REVIEW -> APPROVED | DECLINED | REFERRED per decision"
      - "creates UnderwritingReview with reviewer_user_id = X-User-ID, risk_score_snapshot, risk_class_snapshot and resulting_underwriting_status"
      - "Builder.version incremented by 1"
  - method: POST
    path: "/warranty/builders/{id}/reassessment"
    description: "Monitoring re-score of an approved builder on OBSERVED data (realised enrollment count and loss ratio). Declared inputs supplied here are stored first, then the renewal variant runs."
    roles: [UnderwritingOfficer]
    code: 200
    input: ["years_in_business?", "homes_closed_last_year?", "claims_history_score?", "financial_strength_tier?"]
    output: Builder
    side_effects:
      - "any supplied declared field is written to the Builder row before scoring"
      - "calculations.builder_risk_score variant renewal_reassessment rewrites risk_score and risk_class; Builder.risk_basis = RENEWAL_REASSESSMENT"
      - "§1.2 Builder APPROVED -> SUSPENDED in the same request when the reassessed risk_class is D"
      - "Builder.version incremented by 1"
  - method: POST
    path: "/warranty/builders/{id}/suspension"
    description: "Compliance suspends an approved builder; new enrollments and activations stop."
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Builder
    side_effects:
      - "§1.2 Builder APPROVED -> SUSPENDED; Builder.version incremented by 1"
  - method: POST
    path: "/warranty/builders/{id}/reinstatement"
    description: "Lift a suspension. Refused while Builder.monitoring_posture == FROZEN."
    roles: [UnderwritingOfficer]
    code: 200
    input: [reason]
    output: Builder
    side_effects:
      - "§1.2 Builder SUSPENDED -> APPROVED; Builder.version incremented by 1"
  - method: POST
    path: "/warranty/builders/{id}/default-declaration"
    description: "Declare the builder in default, which makes the insurer respond directly on every claim still sitting in the builder-obligation arm."
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Builder
    side_effects:
      - "§1.2 Builder APPROVED | SUSPENDED -> DEFAULTED; Builder.default_declared_at = the logical clock instant"
      - "CASCADE link 1: every BUILDER_OBLIGATION_NOTICE claim on this builder's policies -> INSURER_ADJUDICATION with obligor rewritten BUILDER -> INSURER"
      - "CASCADE link 2: calculations.claim_net_payable re-runs under variant insurer_backed_settlement on each such claim and establishes its reserve"
      - "CASCADE link 3: calculations.builder_loss_ratio recomputes incurred_loss_cents, loss_ratio and monitoring_posture"
      - "every PENDING_ENROLLMENT policy of this builder -> VOIDED with its OPEN coverage terms -> ELAPSED"
      - "Builder.version incremented by 1"
  - method: GET
    path: "/warranty/builders/{id}"
    description: "Read one builder enrollment file including its current risk and monitoring fields."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, BuilderPrincipal]
    code: 200
    input: []
    output: Builder
    side_effects: []
  - method: GET
    path: "/warranty/builders"
    description: "List builder files, filterable by underwriting status, risk class and monitoring posture."
    roles: [UnderwritingOfficer, ComplianceOfficer]
    code: 200
    input: ["underwriting_status?", "risk_class?", "monitoring_posture?", "limit?", "offset?"]
    output: Builder[]
    side_effects: []
  - method: GET
    path: "/warranty/builders/{id}/underwriting-reviews"
    description: "Reverse-reachability channel for UnderwritingReview.builder_id: the review journal of one builder, newest first."
    roles: [UnderwritingOfficer, ComplianceOfficer]
    code: 200
    input: ["decision?", "limit?", "offset?"]
    output: UnderwritingReview[]
    side_effects: []
  - method: GET
    path: "/warranty/builders/{id}/loss-monitor"
    description: "Computed read: the per-builder loss-ratio monitor exactly as calculations.builder_loss_ratio last recomputed it, with the populations behind it. policy_count is the size of the denominator population (policies of this builder with coverage_status IN {ACTIVE, EXPIRED} AND premium_status == PAID); open_claim_count is the number of claims on any policy of this builder whose status is not one of the six Claim terminal states."
    roles: [UnderwritingOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: { earned_premium_cents: integer, incurred_loss_cents: integer, loss_ratio: number, monitoring_posture: string, policy_count: integer, open_claim_count: integer }
    side_effects: []

  # --- Parties -----------------------------------------------------------
  - method: POST
    path: "/warranty/homeowners"
    description: "Register a home buyer who can be named as an initial owner or a transferee."
    roles: [UnderwritingOfficer, BuilderPrincipal]
    code: 201
    input: [full_name, email, state_code]
    output: Homeowner
    side_effects:
      - "the returned id is the X-User-ID a Homeowner uses to act as this buyer"
  - method: GET
    path: "/warranty/homeowners/{id}"
    description: "Read one registered home buyer."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, Homeowner]
    code: 200
    input: []
    output: Homeowner
    side_effects: []
  - method: POST
    path: "/warranty/neutrals"
    description: "Add a mediator/arbitrator to the panel. Credential decides which stages the neutral may take."
    roles: [ComplianceOfficer]
    code: 201
    input: [full_name, credential, state_code]
    output: Neutral
    side_effects:
      - "status = ACTIVE, booked_session_count = 0"
  - method: POST
    path: "/warranty/neutrals/{id}/deactivation"
    description: "Retire a panel neutral. Sessions already SCHEDULED are untouched; only new bookings are blocked."
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Neutral
    side_effects:
      - "§1.2 Neutral ACTIVE -> INACTIVE; Neutral.version incremented by 1"
  - method: GET
    path: "/warranty/neutrals/{id}"
    description: "Read one panel neutral including booked_session_count."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, Homeowner]
    code: 200
    input: []
    output: Neutral
    side_effects: []
  - method: GET
    path: "/warranty/neutrals"
    description: "List panel neutrals, filterable by credential and status."
    roles: [ComplianceOfficer, ClaimsAdjuster, Homeowner]
    code: 200
    input: ["credential?", "status?", "state_code?", "limit?", "offset?"]
    output: Neutral[]
    side_effects: []

  # --- Home enrollment at closing ----------------------------------------
  - method: POST
    path: "/warranty/policies"
    description: "Enroll one closed home. Prices the premium, snapshots the builder's risk class and mints the three BASE coverage terms. Refused outright when the builder's posture is FROZEN, and refused without posture_override_acknowledged when it is RESTRICTED."
    roles: [BuilderPrincipal]
    code: 201
    input: [builder_id, initial_owner_id, street_address, state_code, purchase_price_cents, closing_date, "posture_override_acknowledged?"]
    output: WarrantyPolicy
    side_effects:
      - "risk_class_at_enrollment = Builder.risk_class snapshot; current_owner_id = initial_owner_id; transfer_count = 0; enrollment_hold = false; pending_transfer_id = null"
      - "calculations.policy_premium writes the three premium components, state_surcharge_cents and premium_cents"
      - "calculations.coverage_term_schedule writes coverage_start_date and builder_obligation_end_date and creates three BASE CoverageTerm rows (WORKMANSHIP, SYSTEMS, STRUCTURAL) each with status OPEN, consumed_limit_cents 0 and remaining_limit_cents == limit_cents"
      - "coverage_status = PENDING_ENROLLMENT, premium_status = UNBILLED"
  - method: POST
    path: "/warranty/policies/{id}/premium-invoice"
    description: "Bill the enrollment premium to the builder. Moves only the premium axis."
    roles: [UnderwritingOfficer]
    code: 200
    input: ["invoice_reference?"]
    output: WarrantyPolicy
    side_effects:
      - "§1.2 WarrantyPolicy premium_status UNBILLED -> INVOICED; WarrantyPolicy.version incremented by 1"
  - method: POST
    path: "/warranty/policies/{id}/premium-payments"
    description: "Builder pays the invoiced enrollment premium in full. The coverage axis does not move."
    roles: [BuilderPrincipal]
    code: 200
    input: ["payment_reference?"]
    output: WarrantyPolicy
    side_effects:
      - "§1.2 WarrantyPolicy premium_status INVOICED -> PAID"
      - "calculations.builder_loss_ratio recomputes Builder.earned_premium_cents, loss_ratio and monitoring_posture (a PENDING_ENROLLMENT policy is still excluded from the denominator, so nothing moves until activation)"
      - "WarrantyPolicy.version incremented by 1"
  - method: POST
    path: "/warranty/policies/{id}/activation"
    description: "Put coverage in force. Requires the premium axis at PAID, no enrollment hold, and the builder still APPROVED."
    roles: [UnderwritingOfficer]
    code: 200
    input: []
    output: WarrantyPolicy
    side_effects:
      - "§1.2 WarrantyPolicy coverage_status PENDING_ENROLLMENT -> ACTIVE"
      - "calculations.builder_loss_ratio recomputes Builder.earned_premium_cents, loss_ratio and monitoring_posture - this is where the premium enters the denominator"
      - "WarrantyPolicy.version incremented by 1"
  - method: POST
    path: "/warranty/policies/{id}/coverage-terms"
    description: "Attach an ENDORSEMENT coverage term to an active policy. Rejected when it overlaps an existing term of the same coverage_type, treating both intervals as CLOSED on both ends."
    roles: [UnderwritingOfficer]
    code: 201
    input: [coverage_type, start_date, end_date, limit_cents, deductible_cents]
    output: CoverageTerm
    side_effects:
      - "creates CoverageTerm with term_kind = ENDORSEMENT, status = OPEN, consumed_limit_cents = 0, remaining_limit_cents = limit_cents"
      - "WarrantyPolicy.version incremented by 1"
  - method: GET
    path: "/warranty/policies/{id}"
    description: "Read one enrolled home including both state axes, the premium breakdown and the current owner."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, BuilderPrincipal, Homeowner]
    code: 200
    input: []
    output: WarrantyPolicy
    side_effects: []
  - method: GET
    path: "/warranty/policies"
    description: "Reverse-reachability channel for WarrantyPolicy.builder_id, initial_owner_id, current_owner_id and pending_transfer_id."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, BuilderPrincipal, Homeowner]
    code: 200
    input: ["builder_id?", "initial_owner_id?", "current_owner_id?", "pending_transfer_id?", "coverage_status?", "premium_status?", "limit?", "offset?"]
    output: WarrantyPolicy[]
    side_effects: []
  - method: GET
    path: "/warranty/policies/{id}/coverage-terms"
    description: "Reverse-reachability channel for CoverageTerm.policy_id: every coverage term of one home, BASE terms before ENDORSEMENT terms, then start_date ascending."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, BuilderPrincipal, Homeowner]
    code: 200
    input: ["coverage_type?", "term_kind?", "status?", "limit?", "offset?"]
    output: CoverageTerm[]
    side_effects: []
  - method: GET
    path: "/warranty/coverage-terms/{id}"
    description: "Read one coverage term including its limit, consumed and remaining amounts."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, BuilderPrincipal, Homeowner]
    code: 200
    input: []
    output: CoverageTerm
    side_effects: []

  # --- Warranty transfer to a subsequent buyer ---------------------------
  - method: POST
    path: "/warranty/policies/{id}/transfers"
    description: "Current owner asks to transfer the remaining warranty to a subsequent buyer. Carries expected_policy_version because a new request silently supersedes the policy's open request."
    roles: [Homeowner]
    code: 201
    input: [new_owner_id, transfer_date, "documents_reference?", expected_policy_version]
    output: WarrantyTransfer
    side_effects:
      - "creates WarrantyTransfer with status REQUESTED and requested_by_owner_id = X-User-ID"
      - "calculations.transfer_fee writes transfer_fee_cents from WarrantyPolicy.transfer_count"
      - "any existing REQUESTED or NEEDS_DOCUMENTATION transfer that is the policy's pending_transfer_id transitions to SUPERSEDED and becomes the new row's prior_transfer_id"
      - "WarrantyPolicy.pending_transfer_id set to the new transfer id"
      - "increments WarrantyPolicy.version by 1"
  - method: POST
    path: "/warranty/transfers/{id}/documentation-request"
    description: "Underwriting sends a transfer request back to the owner for documentation."
    roles: [UnderwritingOfficer]
    code: 200
    input: [reason]
    output: WarrantyTransfer
    side_effects:
      - "§1.2 WarrantyTransfer REQUESTED -> NEEDS_DOCUMENTATION; WarrantyTransfer.version incremented by 1"
  - method: POST
    path: "/warranty/transfers/{id}/resubmission"
    description: "Requesting owner supplies the missing documentation, re-entering the REQUESTED state. The loop may run any number of times."
    roles: [Homeowner]
    code: 200
    input: [documents_reference]
    output: WarrantyTransfer
    side_effects:
      - "§1.2 WarrantyTransfer NEEDS_DOCUMENTATION -> REQUESTED"
      - "WarrantyTransfer.documents_reference overwritten; WarrantyTransfer.version incremented by 1"
  - method: POST
    path: "/warranty/transfers/{id}/decision"
    description: "Underwriting approves or rejects a documented transfer request."
    roles: [UnderwritingOfficer]
    code: 200
    input: [outcome, "decision_reason?"]
    output: WarrantyTransfer
    side_effects:
      - "§1.2 WarrantyTransfer REQUESTED -> APPROVED | REJECTED per outcome"
      - "on REJECT the policy's pending_transfer_id is cleared and WarrantyPolicy.version incremented by 1"
      - "WarrantyTransfer.version incremented by 1"
  - method: POST
    path: "/warranty/transfers/{id}/recording"
    description: "Record the approved transfer against the home. Blocked while any claim on the policy is in mediation or arbitration."
    roles: [UnderwritingOfficer]
    code: 200
    input: []
    output: WarrantyTransfer
    side_effects:
      - "§1.2 WarrantyTransfer APPROVED -> RECORDED"
      - "WarrantyPolicy.current_owner_id rewritten to new_owner_id, transfer_count incremented by 1, pending_transfer_id cleared, WarrantyPolicy.version incremented by 1"
      - "WarrantyTransfer.version incremented by 1"
  - method: GET
    path: "/warranty/transfers/{id}"
    description: "Read one transfer request including its fee and its prior_transfer_id chain link."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, Homeowner]
    code: 200
    input: []
    output: WarrantyTransfer
    side_effects: []
  - method: GET
    path: "/warranty/transfers"
    description: "Reverse-reachability channel for WarrantyTransfer.policy_id, new_owner_id and prior_transfer_id."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, Homeowner]
    code: 200
    input: ["policy_id?", "new_owner_id?", "prior_transfer_id?", "status?", "limit?", "offset?"]
    output: WarrantyTransfer[]
    side_effects: []

  # --- Claim intake, investigation and obligation routing ----------------
  - method: POST
    path: "/warranty/claims"
    description: "Current owner files a warranty claim. Intake resolves the coverage term in force on the logical clock's date and assigns the obligor from the builder-obligation boundary."
    roles: [Homeowner]
    code: 201
    input: [policy_id, coverage_type, defect_category, damage_description, claimed_amount_cents]
    output: Claim
    side_effects:
      - "filed_by_owner_id = X-User-ID; status = SUBMITTED; designated_structural = false"
      - "calculations.claim_obligor_assignment writes reported_date, coverage_term_id and obligor"
      - "reserve_cents, paid_cents, released_cents and incurred_authorized_cents all start at 0"
  - method: POST
    path: "/warranty/claims/{id}/investigation"
    description: "Adjuster opens the investigation and records how much of the claimed amount is substantiated."
    roles: [ClaimsAdjuster]
    code: 200
    input: [substantiation_ratio]
    output: Claim
    side_effects:
      - "§1.2 Claim SUBMITTED -> UNDER_INVESTIGATION"
      - "calculations.claim_net_payable step 1 writes gross_adjusted_cents; Claim.version incremented by 1"
  - method: POST
    path: "/warranty/claims/{id}/structural-assessments"
    description: "File an engineering assessment on a claim. Its three conjuncts decide whether the damage is designated structural, which selects the deductible schedule."
    roles: [ClaimsAdjuster]
    code: 201
    input: [affected_elements, deflection_ratio, load_bearing_affected]
    output: StructuralAssessment
    side_effects:
      - "assessed_by_user_id = X-User-ID; assessment_date = the logical clock's current date (it is never accepted as request input)"
      - "calculations.structural_designation writes StructuralAssessment.designated_structural and propagates the logical OR to Claim.designated_structural"
      - "Claim.version incremented by 1"
  - method: POST
    path: "/warranty/claims/{id}/obligation-routing"
    description: "Route the investigated claim into the builder-obligation arm or the insurer-backed arm. The arm is chosen by Claim.obligor and the two arms have disjoint side-effect sets."
    roles: [ClaimsAdjuster]
    code: 200
    input: ["routing_note?"]
    output: Claim
    side_effects:
      - "§1.2 Claim UNDER_INVESTIGATION -> BUILDER_OBLIGATION_NOTICE when obligor == BUILDER: calculations.claim_net_payable variant builder_obligation_settlement, no reserve, no loss-ratio recompute"
      - "§1.2 Claim UNDER_INVESTIGATION -> INSURER_ADJUDICATION when obligor == INSURER: calculations.claim_net_payable variant insurer_backed_settlement, reserve established, calculations.builder_loss_ratio recomputed"
      - "Claim.version incremented by 1"
  - method: POST
    path: "/warranty/claims/{id}/builder-response"
    description: "Builder accepts the repair obligation or refuses it. Refusal is the join point back into the insurer arm and charges the deductible the builder arm had zeroed."
    roles: [BuilderPrincipal]
    code: 200
    input: [response, "response_note?"]
    output: Claim
    side_effects:
      - "§1.2 Claim BUILDER_OBLIGATION_NOTICE -> BUILDER_REPAIR_ACCEPTED on ACCEPT_OBLIGATION"
      - "§1.2 Claim BUILDER_OBLIGATION_NOTICE -> INSURER_ADJUDICATION on REFUSE_OBLIGATION, rewriting obligor to INSURER, re-running calculations.claim_net_payable under variant insurer_backed_settlement, establishing the reserve and recomputing calculations.builder_loss_ratio"
      - "Claim.version incremented by 1"
  - method: POST
    path: "/warranty/claims/{id}/repair-completion"
    description: "Builder reports the in-kind repair finished, closing the claim with no insurer money."
    roles: [BuilderPrincipal]
    code: 200
    input: [completion_date]
    output: Claim
    side_effects:
      - "§1.2 Claim BUILDER_REPAIR_ACCEPTED -> CLOSED_REPAIRED; Claim.version incremented by 1"
  - method: POST
    path: "/warranty/claims/{id}/adjudication"
    description: "Insurer approves or denies the claim. A structural defect category cannot be adjudicated without an assessment on file, and an approval needs an OPEN coverage term."
    roles: [ClaimsAdjuster]
    code: 200
    input: [outcome, "adjudication_note?"]
    output: Claim
    side_effects:
      - "§1.2 Claim INSURER_ADJUDICATION -> APPROVED | DENIED per outcome; adjudicated_by_user_id = X-User-ID"
      - "on DENY: denial_date = the clock date, calculations.escalation_deadline writes escalation_deadline_date, the reserve is released into released_cents and calculations.builder_loss_ratio is recomputed"
      - "Claim.version incremented by 1"

  # --- Reserve setting, payment and reversal ------------------------------
  - method: POST
    path: "/warranty/claims/{id}/reserve-entries"
    description: "Set or adjust the case reserve on a claim. Each entry overwrites the reserve target rather than adding to it, so it carries expected_claim_version. entry_type INITIAL is accepted only while the claim carries no INITIAL or ADJUSTMENT entry yet; afterwards the reserve is re-authorised with ADJUSTMENT."
    roles: [ClaimsAdjuster]
    code: 201
    input: [entry_type, amount_cents, "memo?", expected_claim_version]
    output: ReserveEntry
    side_effects:
      - "creates ReserveEntry with entry_type INITIAL or ADJUSTMENT, recorded_by_user_id = X-User-ID, balance_after_reserve_cents and balance_after_paid_cents"
      - "calculations.claim_incurred_conservation sets Claim.reserve_cents = amount_cents and Claim.incurred_authorized_cents = paid_cents + released_cents + amount_cents"
      - "calculations.builder_loss_ratio recomputed"
      - "increments Claim.version by 1"
  - method: POST
    path: "/warranty/claims/{id}/payments"
    description: "Disburse indemnity against the reserve. Charges the coverage term, may exhaust it, and closes the claim when the net payable is fully paid. The adjuster who adjudicated the claim may not pay it."
    roles: [ClaimsAdjuster]
    code: 200
    input: [amount_cents, "memo?"]
    output: Claim
    side_effects:
      - "appends a ReserveEntry with entry_type PAYMENT and recorded_by_user_id = X-User-ID"
      - "calculations.claim_incurred_conservation moves amount_cents from reserve_cents into paid_cents, leaving incurred_authorized_cents unchanged"
      - "calculations.coverage_limit_conservation charges the term: consumed_limit_cents += amount_cents, remaining_limit_cents -= amount_cents"
      - "§1.2 CoverageTerm OPEN -> LIMIT_EXHAUSTED when remaining_limit_cents reaches 0, which fires CASCADE links 4, 5 and 6 on sibling claims, the builder's posture and that builder's PENDING_ENROLLMENT policies"
      - "§1.2 Claim APPROVED -> CLOSED_PAID when paid_cents reaches net_payable_cents"
      - "calculations.builder_loss_ratio recomputed; Claim.version incremented by 1"
  - method: POST
    path: "/warranty/claims/{id}/payment-reversals"
    description: "Reverse a disbursed payment in full, restoring both conserved quantities. Compliance-only, and it re-opens a term that the payment had exhausted."
    roles: [ComplianceOfficer]
    code: 200
    input: [reserve_entry_id, "memo?"]
    output: Claim
    side_effects:
      - "appends a ReserveEntry with entry_type PAYMENT_REVERSAL and reversed_entry_id = reserve_entry_id"
      - "calculations.claim_incurred_conservation moves the reversed amount from paid_cents back into reserve_cents, leaving incurred_authorized_cents unchanged"
      - "calculations.coverage_limit_conservation restores the term: consumed_limit_cents -= amount, remaining_limit_cents += amount"
      - "§1.2 CoverageTerm LIMIT_EXHAUSTED -> OPEN when remaining_limit_cents becomes positive; claims already moved to SUSPENDED_NO_LIMIT are NOT resurrected"
      - "calculations.builder_loss_ratio recomputed; Claim.version incremented by 1"
  - method: GET
    path: "/warranty/claims/{id}"
    description: "Read one claim including obligor, the settlement breakdown and all four money fields."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, BuilderPrincipal, Homeowner]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/warranty/claims"
    description: "Reverse-reachability channel for Claim.policy_id, coverage_term_id and filed_by_owner_id."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, BuilderPrincipal, Homeowner]
    code: 200
    input: ["policy_id?", "coverage_term_id?", "filed_by_owner_id?", "status?", "obligor?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/warranty/claims/{id}/structural-assessments"
    description: "Reverse-reachability channel for StructuralAssessment.claim_id: every assessment filed on one claim, oldest first."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, BuilderPrincipal, Homeowner]
    code: 200
    input: ["designated_structural?", "limit?", "offset?"]
    output: StructuralAssessment[]
    side_effects: []
  - method: GET
    path: "/warranty/reserve-entries/{id}"
    description: "Read one reserve-journal entry including the balances it left behind."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster]
    code: 200
    input: []
    output: ReserveEntry
    side_effects: []
  - method: GET
    path: "/warranty/reserve-entries"
    description: "Reverse-reachability channel for ReserveEntry.claim_id and reversed_entry_id: the append-only reserve journal, oldest first. This is the only discovery channel for the system-created PAYMENT entries a reversal must name."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster]
    code: 200
    input: ["claim_id?", "reversed_entry_id?", "entry_type?", "limit?", "offset?"]
    output: ReserveEntry[]
    side_effects: []

  # --- Mediation and binding arbitration ladder --------------------------
  - method: POST
    path: "/warranty/claims/{id}/escalations"
    description: "Owner opens the next rung of the escalation ladder and books a panel neutral for a session window. MEDIATION follows a denial; ARBITRATION requires the mediation to have reached impasse and is binding."
    roles: [Homeowner]
    code: 201
    input: [stage, neutral_id, window_start, window_end, "prior_case_id?"]
    output: EscalationCase
    side_effects:
      - "§1.2 Claim DENIED -> MEDIATION or MEDIATION -> ARBITRATION per stage"
      - "creates EscalationCase with status SCHEDULED and binding = false for MEDIATION, true for ARBITRATION"
      - "Neutral.booked_session_count incremented by 1 and Neutral.version incremented by 1"
      - "Claim.version incremented by 1"
  - method: POST
    path: "/warranty/escalation-cases/{id}/session-outcome"
    description: "Record how a scheduled session ended. A settlement closes the claim and re-authorises the reserve at the settled amount; an impasse leaves the claim in place and restarts the clock on the next rung."
    roles: [ClaimsAdjuster]
    code: 200
    input: [outcome, "settlement_amount_cents?"]
    output: EscalationCase
    side_effects:
      - "§1.2 EscalationCase SCHEDULED -> SETTLED | IMPASSE per outcome; outcome_recorded_by_user_id = X-User-ID"
      - "on SETTLED: Claim -> CLOSED_SETTLED, Claim.reserve_cents = settlement_amount_cents and Claim.incurred_authorized_cents = paid_cents + released_cents + settlement_amount_cents"
      - "on IMPASSE: calculations.escalation_deadline rewrites Claim.escalation_deadline_date with ARBITRATION_WINDOW_DAYS"
      - "calculations.builder_loss_ratio recomputed on SETTLED; EscalationCase.version and Claim.version each incremented by 1"
  - method: POST
    path: "/warranty/escalation-cases/{id}/award"
    description: "Issue the binding arbitration award. A zero award is the binding final denial, not an error. The adjuster who recorded the predecessor mediation outcome may not issue this award."
    roles: [ClaimsAdjuster]
    code: 200
    input: [award_amount_cents, "award_note?"]
    output: EscalationCase
    side_effects:
      - "§1.2 EscalationCase SCHEDULED -> AWARD_ISSUED"
      - "award_amount_cents > 0: Claim -> CLOSED_AWARDED, reserve_cents = award_amount_cents and incurred_authorized_cents = paid_cents + released_cents + award_amount_cents"
      - "award_amount_cents == 0: Claim -> CLOSED_DENIED_FINAL, the reserve is released into released_cents and incurred_authorized_cents is unchanged"
      - "calculations.builder_loss_ratio recomputed; EscalationCase.version and Claim.version each incremented by 1"
  - method: GET
    path: "/warranty/escalation-cases/{id}"
    description: "Read one escalation case including its stage, window, binding flag and outcome amounts."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, Homeowner]
    code: 200
    input: []
    output: EscalationCase
    side_effects: []
  - method: GET
    path: "/warranty/escalation-cases"
    description: "Reverse-reachability channel for EscalationCase.claim_id, neutral_id and prior_case_id. Filtering by neutral_id is also how a booking conflict is inspected."
    roles: [UnderwritingOfficer, ComplianceOfficer, ClaimsAdjuster, Homeowner]
    code: 200
    input: ["claim_id?", "neutral_id?", "prior_case_id?", "stage?", "status?", "limit?", "offset?"]
    output: EscalationCase[]
    side_effects: []

  # --- Test-driving endpoint (§1.5 priority ladder rung 3) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Move the server's logical clock forward to an absolute instant and run the epoch sweep. The clock's startup default is exactly 2026-08-01T00:00:00Z and it never falls back to real wall-clock time; every deadline, coverage window and expiry rule in this scaffold reads this clock. Forward-only: an earlier instant is ERR_CLOCK_REGRESSION."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_policy_count: integer, elapsed_term_count: integer }
    side_effects:
      - "§1.2 CoverageTerm OPEN -> ELAPSED for every term whose end_date is before the new clock date"
      - "§1.2 WarrantyPolicy ACTIVE -> EXPIRED for every policy whose BASE STRUCTURAL term has elapsed"
      - "each swept row has its version incremented by 1; no loss-ratio recompute is needed because EXPIRED policies stay in the denominator"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or blank"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the called endpoint"
  - id: ERR_NOT_BUILDER_PRINCIPAL
    http: 403
    condition: "a BuilderPrincipal acts on a builder, policy or claim that does not belong to its own Builder.id"
  - id: ERR_NOT_POLICY_OWNER
    http: 403
    condition: "a Homeowner acts on a policy whose current_owner_id is a different homeowner, or resubmits a transfer it did not request"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the adjuster paying a claim is the one recorded in Claim.adjudicated_by_user_id, or the adjuster issuing an award is the one who recorded the predecessor mediation outcome"
  # existence
  - id: ERR_BUILDER_NOT_FOUND
    http: 404
    condition: "no Builder with the supplied id"
  - id: ERR_HOMEOWNER_NOT_FOUND
    http: 404
    condition: "no Homeowner with the supplied initial_owner_id or new_owner_id"
  - id: ERR_NEUTRAL_NOT_FOUND
    http: 404
    condition: "no Neutral with the supplied id or neutral_id"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no WarrantyPolicy with the supplied id or policy_id"
  - id: ERR_COVERAGE_TERM_NOT_FOUND
    http: 404
    condition: "no CoverageTerm with the supplied id"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "no WarrantyTransfer with the supplied id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no Claim with the supplied id"
  - id: ERR_RESERVE_ENTRY_NOT_FOUND
    http: 404
    condition: "no ReserveEntry with the supplied id or reserve_entry_id"
  - id: ERR_ESCALATION_CASE_NOT_FOUND
    http: 404
    condition: "no EscalationCase with the supplied id or prior_case_id"
  # request shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required body field is missing, of the wrong type, outside its declared range, not a declared enum member, or affected_elements contains duplicates"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..100 or offset below 0"
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "POST /_clock/set_current_utc is given an instant earlier than the clock's current instant"
  # optimistic concurrency
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version does not equal WarrantyPolicy.version on a transfer request"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal Claim.version on a reserve entry"
  # state
  - id: ERR_INVALID_BUILDER_STATE
    http: 409
    condition: "the builder is not in a declared from-state for the requested underwriting transition"
  - id: ERR_INVALID_POLICY_STATE
    http: 409
    condition: "the policy's coverage_status is not a declared from-state for the requested coverage transition"
  - id: ERR_INVALID_PREMIUM_STATE
    http: 409
    condition: "the policy's premium_status is not a declared from-state for the requested premium transition"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "the claim's status is not a declared from-state for the requested claim transition"
  - id: ERR_INVALID_TRANSFER_STATE
    http: 409
    condition: "the transfer's status is not a declared from-state for the requested transfer transition"
  - id: ERR_INVALID_ESCALATION_STATE
    http: 409
    condition: "the escalation case is not SCHEDULED, or an award is requested on a MEDIATION-stage case"
  - id: ERR_INVALID_NEUTRAL_STATE
    http: 409
    condition: "the neutral is already INACTIVE when deactivation is requested"
  - id: ERR_BUILDER_NOT_APPROVED
    http: 409
    condition: "the builder is not APPROVED at enrollment time or at activation time"
  - id: ERR_PREMIUM_NOT_PAID
    http: 409
    condition: "activation attempted while premium_status is not PAID"
  - id: ERR_ENROLLMENT_ON_HOLD
    http: 409
    condition: "activation attempted while WarrantyPolicy.enrollment_hold is true"
  - id: ERR_POLICY_NOT_ACTIVE
    http: 409
    condition: "a claim, transfer request or endorsement term is attempted on a policy whose coverage_status is not ACTIVE"
  - id: ERR_COVERAGE_LIMIT_EXHAUSTED
    http: 409
    condition: "adjudication or payment attempted on a claim whose resolved CoverageTerm is LIMIT_EXHAUSTED or ELAPSED"
  - id: ERR_NEUTRAL_INACTIVE
    http: 409
    condition: "the booked Neutral has status INACTIVE"
  - id: ERR_NEUTRAL_CREDENTIAL_MISMATCH
    http: 409
    condition: "the booked Neutral's credential does not admit the requested stage"
  - id: ERR_MISSING_TRANSFER_DOCUMENTATION
    http: 409
    condition: "an APPROVE transfer decision on a request whose documents_reference is still null"
  - id: ERR_BUILDER_DEFAULTED
    http: 409
    condition: "obligation routing into the builder arm attempted for a builder already DEFAULTED"
  # business safety
  - id: ERR_STRUCTURAL_ASSESSMENT_REQUIRED
    http: 409
    condition: "adjudication of a STRUCTURAL_CRACKING or LOAD_BEARING_FAILURE claim with no StructuralAssessment on file"
  - id: ERR_MEDIATION_NOT_EXHAUSTED
    http: 409
    condition: "an ARBITRATION escalation without a prior_case_id, or whose prior case has not reached IMPASSE"
  - id: ERR_RISK_CLASS_INELIGIBLE
    http: 409
    condition: "an APPROVE underwriting decision on a builder whose risk_class is D"
  # temporal
  - id: ERR_SESSION_WINDOW_NOT_STARTED
    http: 409
    condition: "a session outcome or award recorded before EscalationCase.window_start"
  - id: ERR_COVERAGE_TERM_ELAPSED
    http: 422
    condition: "a transfer_date outside the closed interval of the policy's BASE STRUCTURAL coverage term"
  - id: ERR_NO_COVERAGE_IN_FORCE
    http: 422
    condition: "claim intake finds no coverage term of the claimed type covering the reported_date"
  - id: ERR_ESCALATION_WINDOW_ELAPSED
    http: 422
    condition: "the logical clock's date is past Claim.escalation_deadline_date when the next rung is opened"
  - id: ERR_NEUTRAL_WINDOW_CONFLICT
    http: 409
    condition: "the requested session window, widened by NEUTRAL_TURNAROUND_MINUTES on both sides, overlaps another EscalationCase window on the same neutral"
  - id: ERR_COVERAGE_TERM_OVERLAP
    http: 409
    condition: "an endorsement term's closed interval touches or overlaps an existing term of the same coverage_type on the policy"
  # referential
  - id: ERR_TRANSFEREE_IS_CURRENT_OWNER
    http: 422
    condition: "new_owner_id equals the policy's current_owner_id"
  - id: ERR_PRIOR_CASE_CLAIM_MISMATCH
    http: 422
    condition: "prior_case_id names an EscalationCase belonging to a different claim"
  - id: ERR_OPEN_DISPUTE_BLOCKS_TRANSFER
    http: 409
    condition: "transfer recording attempted while a claim on the policy is in MEDIATION or ARBITRATION"
  - id: ERR_ENTRY_NOT_REVERSIBLE
    http: 422
    condition: "reserve_entry_id names an entry on another claim, an entry whose entry_type is not PAYMENT, or one already reversed"
  # fiscal
  - id: ERR_BUILDER_POSTURE_FROZEN
    http: 409
    condition: "enrollment or reinstatement attempted while Builder.monitoring_posture is FROZEN"
  - id: ERR_POSTURE_OVERRIDE_REQUIRED
    http: 409
    condition: "enrollment under a RESTRICTED posture without posture_override_acknowledged true"
  - id: ERR_PAYMENT_EXCEEDS_RESERVE
    http: 422
    condition: "a payment amount above Claim.reserve_cents"
  - id: ERR_COVERAGE_LIMIT_EXCEEDED
    http: 422
    condition: "a payment amount above CoverageTerm.remaining_limit_cents of the claim's term"
  - id: ERR_INITIAL_RESERVE_ALREADY_SET
    http: 422
    condition: "an INITIAL reserve entry on a claim that already carries an INITIAL or ADJUSTMENT reserve entry"
  - id: ERR_AUTHORIZATION_BELOW_DISBURSED
    http: 422
    condition: "an ADJUSTMENT reserve entry whose amount_cents is lower than Claim.paid_cents"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: UnderwritingOfficer
    description: "Carrier underwriter: opens and scores builder files, decides enrollment, bills and activates home enrollments, attaches endorsement terms and administers transfer requests."
    identity: "opaque"
    exclusive_operations:
      - "POST /warranty/builders"
      - "POST /warranty/builders/{id}/review-intake"
      - "POST /warranty/builders/{id}/underwriting-reviews"
      - "POST /warranty/builders/{id}/reassessment"
      - "POST /warranty/builders/{id}/reinstatement"
      - "POST /warranty/policies/{id}/premium-invoice"
      - "POST /warranty/policies/{id}/activation"
      - "POST /warranty/policies/{id}/coverage-terms"
      - "POST /warranty/transfers/{id}/documentation-request"
      - "POST /warranty/transfers/{id}/decision"
      - "POST /warranty/transfers/{id}/recording"
    shared_operations:
      - "POST /warranty/homeowners (shared with BuilderPrincipal)"
      - "GET /warranty/builders, GET /warranty/builders/{id}, GET /warranty/builders/{id}/underwriting-reviews, GET /warranty/builders/{id}/loss-monitor"
      - "all GET read endpoints under /warranty"
  - name: ComplianceOfficer
    description: "Carrier compliance and market-conduct function: suspends and defaults builders, curates the neutral panel, and is the only role that may reverse a disbursed payment or move the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /warranty/builders/{id}/suspension"
      - "POST /warranty/builders/{id}/default-declaration"
      - "POST /warranty/neutrals"
      - "POST /warranty/neutrals/{id}/deactivation"
      - "POST /warranty/claims/{id}/payment-reversals"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /warranty/builders and GET /warranty/builders/{id}/loss-monitor (shared with UnderwritingOfficer)"
      - "all GET read endpoints under /warranty"
  - name: ClaimsAdjuster
    description: "Carrier claims handler: investigates, assesses, routes, adjudicates, reserves and pays claims, and records escalation outcomes and awards. Constrained by segregation of duties on payment and on award."
    identity: "opaque"
    exclusive_operations:
      - "POST /warranty/claims/{id}/investigation"
      - "POST /warranty/claims/{id}/structural-assessments"
      - "POST /warranty/claims/{id}/obligation-routing"
      - "POST /warranty/claims/{id}/adjudication"
      - "POST /warranty/claims/{id}/reserve-entries"
      - "POST /warranty/claims/{id}/payments"
      - "POST /warranty/escalation-cases/{id}/session-outcome"
      - "POST /warranty/escalation-cases/{id}/award"
    shared_operations:
      - "GET /warranty/claims, GET /warranty/claims/{id}, GET /warranty/claims/{id}/structural-assessments"
      - "GET /warranty/reserve-entries and GET /warranty/reserve-entries/{id} (shared with UnderwritingOfficer and ComplianceOfficer)"
      - "all GET read endpoints under /warranty"
  - name: BuilderPrincipal
    description: "The enrolling home builder acting on its own file: submits for underwriting, enrolls closed homes, pays enrollment premiums, and accepts or refuses the repair obligation on its own claims."
    identity: "entity_backed:Builder"
    exclusive_operations:
      - "POST /warranty/builders/{id}/submission"
      - "POST /warranty/policies"
      - "POST /warranty/policies/{id}/premium-payments"
      - "POST /warranty/claims/{id}/builder-response"
      - "POST /warranty/claims/{id}/repair-completion"
    shared_operations:
      - "POST /warranty/homeowners (shared with UnderwritingOfficer)"
      - "GET /warranty/builders/{id}, GET /warranty/policies, GET /warranty/policies/{id}, GET /warranty/policies/{id}/coverage-terms, GET /warranty/coverage-terms/{id}, GET /warranty/claims, GET /warranty/claims/{id}, GET /warranty/claims/{id}/structural-assessments"
  - name: Homeowner
    description: "The home buyer holding the warranty: files claims on the home it currently owns, requests transfers to a subsequent buyer, and opens the mediation and arbitration rungs."
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /warranty/policies/{id}/transfers"
      - "POST /warranty/transfers/{id}/resubmission"
      - "POST /warranty/claims"
      - "POST /warranty/claims/{id}/escalations"
    shared_operations:
      - "GET /warranty/homeowners/{id}, GET /warranty/policies, GET /warranty/policies/{id}, GET /warranty/policies/{id}/coverage-terms, GET /warranty/coverage-terms/{id}"
      - "GET /warranty/neutrals, GET /warranty/neutrals/{id}, GET /warranty/transfers, GET /warranty/transfers/{id}"
      - "GET /warranty/claims, GET /warranty/claims/{id}, GET /warranty/claims/{id}/structural-assessments, GET /warranty/escalation-cases, GET /warranty/escalation-cases/{id}"
