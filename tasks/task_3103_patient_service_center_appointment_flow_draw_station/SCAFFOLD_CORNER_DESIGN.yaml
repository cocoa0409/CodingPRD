# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3103_patient_service_center_appointment_flow_draw_station
#
# Breadth probe over §1.1-§1.7 using references/claim-extraction-guide.md.
# Section values are the guide's nine sections; claim_type values are its
# per-section rows. Corners already exercised by a §1.8 instance appear as
# `excluded_because:` stubs with no test_recipe.
#
# Every test runs against a freshly restarted server, so the shared fixture
# anchors below are safe to reuse across instances.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: center_create_defaults_apply_and_posture_starts_open
        claim_type: Defaults
        grounds:
          - entities.ServiceCenter.fields.slot_minutes
          - entities.ServiceCenter.fields.draw_hold_minutes
          - endpoints.POST_/psc/service-centers
        distinguishing_aspect: "slot_minutes defaults to 15 and draw_hold_minutes to 30 when omitted, so the stored row is fully populated rather than null-bearing, and ops_run_index starts at 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, the server's startup default. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: CenterSupervisor
          trigger:
            - &k_center
              call: "POST /psc/service-centers"
              payload: { name: "Aurora Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 2, open_local_minutes: 480, close_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { c1: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "ServiceCenter.${c1}.slot_minutes == 15 and draw_hold_minutes == 30"
            - "ServiceCenter.${c1}.pediatric_capable == false"
            - "ServiceCenter.${c1}.ops_run_index == 0 and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: patient_create_rejects_a_duplicate_mrn
        claim_type: Creation
        grounds:
          - entities.Patient.fields.mrn
          - errors[ERR_DUPLICATE_MRN]
          - validations[priority=8]
        distinguishing_aspect: "mrn is unique across patients, so the second registration with the same mrn is rejected at priority 8 with ERR_DUPLICATE_MRN rather than being silently merged."
        test_recipe:
          setup:
            - "Logical clock set; one patient already registered."
          setup_api_calls:
            - *k_clock
            - &k_pat
              call: "POST /psc/patients"
              payload: { full_name: "Ada Nguyen", birth_date: "1990-04-02T00:00:00Z", mrn: "MRN-3103-001" }
              as: IntakeCoordinator
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /psc/patients"
              payload: { full_name: "Ada N Ng", birth_date: "1990-04-02T00:00:00Z", mrn: "MRN-3103-001" }
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and ${err_id} == ERR_DUPLICATE_MRN"
            - "GET /psc/patients returns exactly 1 row"

      - name: test_order_get_exposes_computed_pediatric_and_derived_plan_fields
        claim_type: Computed Fields
        grounds:
          - entities.TestOrder.fields.patient_is_pediatric
          - entities.TestOrder.fields.resolved_tubes
          - entities.TestOrder.fields.draw_order_spec
          - entities.TestOrder.fields.concurrence_hash
          - endpoints.GET_/psc/test-orders/{testOrderId}
        distinguishing_aspect: "patient_is_pediatric, resolved_tubes, draw_order_spec and concurrence_hash are all source: computed — a client that posts false for patient_is_pediatric is ignored, and the derived plan is identical for the same panel."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center, the reference grid seeded, and a pediatric patient born 2016-03-03."
          setup_api_calls:
            - *k_clock
            - *k_center
            - &k_seed
              call: "POST /_scenarios/seed-reference"
              payload: {}
              as: CenterSupervisor
              captures: { plan_id: $.data.insurance_plan_id, seeded: $.data.seeded }
            - &k_pat_kid
              call: "POST /psc/patients"
              payload: { full_name: "Kid Sato", birth_date: "2016-03-03T00:00:00Z", mrn: "MRN-3103-002" }
              as: IntakeCoordinator
              captures: { pk: $.data.id }
            - &k_order
              call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${pk}", ordering_provider_npi: "1700111222", test_panel: "CMP", collection_mode: "PEDIATRIC", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o1: $.data.id }
          trigger:
            - call: "GET /psc/test-orders/${o1}"
              payload: {}
              as: IntakeCoordinator
              captures: { pediatric: $.data.patient_is_pediatric, tubes: $.data.resolved_tubes, spec: $.data.draw_order_spec, hash: $.data.concurrence_hash }
          assert:
            - "${pediatric} == true"
            - "the response does not reflect any client-supplied patient_is_pediatric value"
            - "${spec} lists tubes in ascending order_of_draw with the EDTA tube before the SST tube"
            - "${hash} is identical on a second GET of the same order and differs when the panel is changed"

      - name: specimen_get_with_an_unknown_id_returns_specimen_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/psc/specimens/{specimenId}
          - errors[ERR_SPECIMEN_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "An unallocated but syntactically valid path id produces the entity-specific ERR_SPECIMEN_NOT_FOUND at 404, not a generic ERR_INVALID_REQUEST at 400."
        test_recipe:
          setup:
            - "Logical clock set; no specimen exists."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /psc/specimens/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabLiaison
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and ${err_id} == ERR_SPECIMEN_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: test_order_create_missing_insurance_plan_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.TestOrder.fields.insurance_plan_id
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/psc/test-orders
        distinguishing_aspect: "insurance_plan_id is a required input with no default, so omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 400 ERR_INSURANCE_PLAN_NOT_FOUND from the reference check."
        test_recipe:
          setup:
            - "Logical clock set; one center and one patient."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_pat
          trigger:
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111222", test_panel: "CMP", collection_mode: "STANDARD", patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [] }
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "${err_id} != ERR_INSURANCE_PLAN_NOT_FOUND"
            - "GET /psc/test-orders returns 0 rows"

      - name: patients_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/psc/patients
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three patients on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false — total_count counts the whole set, not the page."
        test_recipe:
          setup:
            - "Logical clock set; three patients registered."
          setup_api_calls:
            - *k_clock
            - *k_pat
            - call: "POST /psc/patients"
              payload: { full_name: "Bo Alvarez", birth_date: "1988-01-11T00:00:00Z", mrn: "MRN-3103-003" }
              as: IntakeCoordinator
            - call: "POST /psc/patients"
              payload: { full_name: "Cy Ortiz", birth_date: "1985-07-19T00:00:00Z", mrn: "MRN-3103-004" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /psc/patients"
              payload: { limit: 2, offset: 0 }
              as: IntakeCoordinator
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /psc/patients?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /psc/patients with no query parameters returns 3 rows, limit defaulting to 10 and offset to 0"

      - name: appointment_create_ignores_client_supplied_draw_state_and_version
        claim_type: System Fields
        grounds:
          - entities.Appointment.fields.draw_state
          - entities.Appointment.fields.queue_state
          - endpoints.POST_/psc/appointments
        distinguishing_aspect: "draw_state and queue_state are source: system, so a client sending draw_state DRAWN or version 99 is ignored — the row is created SCHEDULED with queue_state NONE and version 1."
        test_recipe:
          setup:
            - "Logical clock set; one center, the reference plan seeded, and one ELIGIBLE order."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o1}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v1}", draw_state: "DRAWN", version: 99 }
              as: IntakeCoordinator
              captures: { a1: $.data.id }
          assert:
            - "the response status is 201"
            - "Appointment.${a1}.draw_state == SCHEDULED and queue_state == NONE"
            - "Appointment.${a1}.version == 1 and attempt_count == 0"
            - "Appointment.${a1}.station_index is null and phlebotomist_id is null"

      - name: tube_requirement_create_rejects_a_min_volume_above_the_nominal_volume
        claim_type: Type Constraints
        grounds:
          - entities.TubeRequirement.fields.min_volume_ml
          - entities.TubeRequirement.fields.order_of_draw
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/psc/tube-requirements
        distinguishing_aspect: "min_volume_ml must satisfy 0 < min_volume_ml <= required_volume_ml, so an inverted pair is rejected at 400 ERR_INVALID_REQUEST rather than stored and later driving a nonsensical pediatric floor."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /psc/tube-requirements"
              payload: { test_panel: "CMP", tube_code: "SST_GOLD", required_volume_ml: 5.0, min_volume_ml: 6.0, order_of_draw: 3, stability_minutes: 240, max_urgency_hours: 24, special_handling_codes: [] }
              as: LabLiaison
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /psc/tube-requirements returns 0 rows"

      - name: responsibility_estimate_get_with_an_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/psc/responsibility-estimates/{responsibilityEstimateId}
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The estimate read path resolves its own id segment, so an unallocated estimate id is a 404 and not a 400 from the supersession-reference check."
        test_recipe:
          setup:
            - "Logical clock set; no estimate exists."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /psc/responsibility-estimates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "${err_id} != ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: test_order_starts_received_with_necessity_pending_when_codes_are_supplied
        claim_type: Initial State
        grounds:
          - state_machines.TestOrder.initial_state
          - entities.TestOrder.fields.necessity_status
          - endpoints.POST_/psc/test-orders
        distinguishing_aspect: "An order carrying a diagnosis code starts in RECEIVED with necessity_status PENDING, while an order with an empty icd10_codes starts PASS — the initial state of the derived field depends on the intake payload."
        test_recipe:
          setup:
            - "Logical clock set; one center, the reference grid seeded, and one patient."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
          trigger:
            - &k_order_pending
              call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111222", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: ["R99"], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { op: $.data.id, op_nec: $.data.necessity_status, op_ins: $.data.insurance_status }
          assert:
            - "TestOrder.${op}.status == RECEIVED"
            - "${op_nec} == PENDING and ${op_ins} == UNVERIFIED"
            - "a second order posted with icd10_codes: [] reports necessity_status == PASS"
            - "TestOrder.${op}.est_copay_cents == 0 and est_coinsurance_cents == 0"

      - name: finish_draw_from_a_waiting_queue_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.transitions.CHECKED_IN_to_IN_DRAW
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/psc/appointments/{appointmentId}/finish-draw
        distinguishing_aspect: "finish-draw is only legal from AT_STATION, so a checked-in appointment still sitting WAITING is rejected with ERR_INVALID_STATE and the queue does not move."
        test_recipe:
          setup:
            - "Logical clock set; one center, the reference plan seeded, an ELIGIBLE order, and an appointment checked in but not yet called."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - &k_phleb
              call: "POST /psc/phlebotomists"
              payload: { service_center_id: "${c1}", full_name: "Hana Reed", credential: "LABEL_PBS", shift_start_local_minutes: 420, shift_end_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { ph: $.data.id }
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - &k_appt
              call: "POST /psc/appointments"
              payload: { service_center_id: "${c1}", test_order_id: "${o1}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v1}" }
              as: IntakeCoordinator
              captures: { a1: $.data.id }
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
          trigger:
            - call: "POST /psc/appointments/${a1}/finish-draw"
              payload: {}
              as: Phlebotomist
              as_user_id: "${ph}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and ${err_id} == ERR_INVALID_STATE"
            - "Appointment.${a1}.draw_state == CHECKED_IN and queue_state == WAITING"

      - name: second_check_in_on_an_already_checked_in_appointment_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Appointment.transitions.SCHEDULED_to_CHECKED_IN
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/psc/appointments/{appointmentId}/check-in
        distinguishing_aspect: "check-in is not idempotent: the second strictly sequential call observes draw_state CHECKED_IN written by the first and is rejected at priority 4, leaving checkin_utc unchanged."
        test_recipe:
          setup:
            - "Logical clock set; an ELIGIBLE order whose appointment has already been checked in."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - *k_appt
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
              captures: { checkin_at: $.data.checkin_utc }
          trigger:
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and ${err_id} == ERR_INVALID_STATE"
            - "Appointment.${a1}.checkin_utc == ${checkin_at}, unchanged by the second call"
            - "Appointment.${a1}.version has not advanced a second time"

      - name: cancel_from_a_collected_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TestOrder.terminal_states
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/psc/test-orders/{testOrderId}/cancel
        distinguishing_aspect: "COLLECTED is not cancellable — the declared cancel transitions start only from RECEIVED and SCHEDULED, so a collected order is rejected even though COLLECTED is not strictly terminal for the rejection revert."
        test_recipe:
          setup:
            - "Logical clock set; an ELIGIBLE order already drawn and collected."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - *k_pat
            - *k_order
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
            - *k_phleb
            - *k_appt
            - call: "POST /psc/appointments/${a1}/check-in"
              payload: {}
              as: Patient
              as_user_id: "${p1}"
            - call: "POST /psc/appointments/${a1}/call"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /psc/appointments/${a1}/start-draw"
              payload: {}
              as: Phlebotomist
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
            - call: "POST /psc/appointments/${a1}/finish-draw"
              payload: {}
              as: Phlebotomist
          trigger:
            - call: "POST /psc/test-orders/${o1}/cancel"
              payload: {}
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and ${err_id} == ERR_INVALID_STATE"
            - "TestOrder.${o1}.status == COLLECTED and unchanged"
            - "the Specimen for ${o1} is still UNASSIGNED rather than REJECTED"

      - name: courier_dispatch_before_its_dispatch_instant_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CourierRun.transitions.PLANNED_to_DISPATCHED
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/psc/courier-runs/{courierRunId}/dispatch
        distinguishing_aspect: "dispatch requires logical_clock_utc to equal dispatch_utc exactly, so a run with a committed specimen is still rejected when the clock is one minute early."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z; one center, an OUTBOUND run at 16:00Z carrying one assigned specimen."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - &k_run
              call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T16:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - *k_pat
            - *k_order
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
          trigger:
            - call: "POST /psc/courier-runs/${r1}/dispatch"
              payload: {}
              as: LabLiaison
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and ${err_id} == ERR_INVALID_STATE"
            - "CourierRun.${r1}.status == PLANNED and committed_specimen_count == 1"
            - "Specimen.${s1}.status == ASSIGNED"

      - name: appointment_staff_pending_entry_and_hold_expiry
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Appointment.transitions.CHECKED_IN_to_STAFF_PENDING
          - entities.Appointment.fields.draw_hold_expires_utc
        excluded_because:
          difficulty_instance: appointment_runs_two_parallel_dimensions_with_hold_expiry
          rationale: "The STAFF_PENDING entry, the sentinel station index and the hold expiry instant are asserted directly as that §1.8 instance's outcome."

      - name: order_revert_side_effects_after_a_rejection
        claim_type: Side Effect Execution
        grounds:
          - state_machines.TestOrder.transitions.COLLECTED_to_SCHEDULED
          - calculations.patient_fasting_gate
        excluded_because:
          difficulty_instance: order_rejects_and_reverts_making_status_cyclic
          rationale: "The COLLECTED to SCHEDULED revert and its cleared fasting inputs are the asserted chain of that §1.8 instance."
  # ===========================================================================
  - section: calculations
    instances:

      - name: rejection_day_cap_boundary_at_the_third_rejection
        claim_type: threshold_boundary
        grounds:
          - calculations.rejection_day_cap
          - entities.Specimen.fields.day_rejection_index
          - entities.Specimen.fields.rejection_waived
          - endpoints.POST_/psc/specimens/{specimenId}/reject
        distinguishing_aspect: "The aggregation uses >= against REJECTION.day_cap 3 counting the specimen being rejected, so the third rejection on one local day is the one that flips rejection_waived to true and blocks, not the fourth."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center, one ELIGIBLE non-fasting order, an OUTBOUND run dispatching 2026-09-02T07:30:00Z, and three EDTA_LAVENDER specimens each assigned to that run."
          setup_api_calls:
            - *k_clock
            - *k_center
            - *k_seed
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-02T07:30:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id }
            - *k_pat
            - *k_order
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s2: $.data.id }
            - call: "POST /psc/specimens"
