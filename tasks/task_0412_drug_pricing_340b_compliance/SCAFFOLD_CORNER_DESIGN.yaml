  # ==========================================================================
  # SECTION: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: wac_dispense_line_cost_uses_wac_price
        claim_type: correct_result
        grounds:
          - calculations.dispense_line_cost
          - calculations.eligibility_determination
          - entities.PrescriptionDispense.fields.line_cost_cents
        distinguishing_aspect: "A CLASSIFIED_WAC dispense (medicaid carve-out conflict) prices at wac_price_per_unit_cents: 7 units * 4000 = 28000 line_cost_cents; applied_price uses WAC not ceiling."
        test_recipe:
          setup:
            - "CARVE_OUT ACTIVE CE, drug wac 4000 and published ceiling 2500, EMPLOYED prescriber, Medicaid-FFS patient (forces WAC classification)."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020020", legal_name: "WacCost CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00027-0027-27", drug_name: "WacCost Drug", package_size_units: 30, wac_price_per_unit_cents: 4000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "2525252525", full_name: "Dr WacCost", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-WAC-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: true }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 7, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
          assert:
            - "PrescriptionDispense.${disp_id}.classification_status == CLASSIFIED_WAC and eligibility_reason == CARVED_OUT_MEDICAID"
            - "PrescriptionDispense.${disp_id}.applied_price_per_unit_cents == 4000 and line_cost_cents == 28000"

      - name: effective_ceiling_prefers_published_over_provisional
        claim_type: variant_selection
        grounds:
          - calculations.published_vs_provisional_ceiling
          - entities.CeilingPriceRecord.fields.is_published
        distinguishing_aspect: "GET /drug-products/{id}/ceiling-prices/effective?quarter=2026Q2 returns the published record even when a provisional record for the same quarter also exists (FINAL variant wins)."
        test_recipe:
          setup:
            - "A drug product with both a provisional (amp 5000) and a published (amp 4000, ura 1500 -> ceiling 2500) ceiling record for 2026Q2."
          setup_api_calls:
            - call: "POST /340b/drug-products"
              payload: { ndc: "00028-0028-28", drug_name: "Eff Drug", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 5000, ura_per_unit_cents: 1500, is_published: false }
              as: ComplianceOfficer
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
              captures: { cpr_pub_id: $.data.id }
          trigger:
            - call: "GET /340b/drug-products/${dp_id}/ceiling-prices/effective"
              payload: { quarter: "2026Q2" }
              as: HrsaAuditor
              captures: { eff_id: $.data.id, eff_ceiling: $.data.ceiling_price_per_unit_cents }
          assert:
            - "Effective record id == ${cpr_pub_id} (the published one)"
            - "Effective ceiling_price_per_unit_cents == 2500"

      - name: provisional_only_dispense_prices_provisional_ceiling
        claim_type: variant_selection
        grounds:
          - calculations.published_vs_provisional_ceiling
          - calculations.dispense_line_cost
        distinguishing_aspect: "When only a provisional ceiling exists for (NDC, quarter), a 340B dispense prices at the provisional ceiling (amp 3600 - ura 1100 = 2500): line_cost 3 units * 2500 = 7500."
        test_recipe:
          setup:
            - "ACTIVE CE, drug with only a provisional ceiling for 2026Q2 (amp 3600, ura 1100 -> 2500), EMPLOYED prescriber, eligible non-Medicaid patient."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020021", legal_name: "Prov CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00029-0029-29", drug_name: "Prov Drug", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 3600, ura_per_unit_cents: 1100, is_published: false }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "2626262626", full_name: "Dr Prov", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-PROV-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 3, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
          assert:
            - "PrescriptionDispense.${disp_id}.classification_status == CLASSIFIED_340B"
            - "PrescriptionDispense.${disp_id}.applied_price_per_unit_cents == 2500 and line_cost_cents == 7500"

      - name: repayment_diversion_assessment_clawback_amount
        claim_type: correct_result
        grounds:
          - calculations.repayment_assessment
          - entities.RepaymentObligation.fields.assessed_cents
        distinguishing_aspect: "Diversion clawback = max(0, wac 4000 - ceiling 2500) * assessed_units 5 = 7500; the AUDIT_FINDING repayment obligation assessed_cents == 7500."
        test_recipe:
          setup:
            - "An OPEN HRSA_AUDIT DIVERSION finding (assessed_units 5) against a 340B dispense; drug wac 4000, published ceiling 2500."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020022", legal_name: "Claw CE", entity_type: "FQHC", medicaid_billing_mode: "CARVE_OUT" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00030-0030-30", drug_name: "Claw Drug", package_size_units: 30, wac_price_per_unit_cents: 4000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "2727272727", full_name: "Dr Claw", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-CLAW-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 5, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "POST /340b/audit-findings"
              payload: { covered_entity_id: "${ce_id}", prescription_dispense_id: "${disp_id}", finding_type: "DIVERSION", assessed_units: 5 }
              as: HrsaAuditor
              captures: { af_id: $.data.id }
          trigger:
            - call: "POST /340b/audit-findings/${af_id}/repayments"
              payload: {}
