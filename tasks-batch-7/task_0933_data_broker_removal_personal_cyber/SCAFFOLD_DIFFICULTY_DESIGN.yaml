            - "RemovalRequest.${rr2_id}.entitlement_units_consumed == 1 and Account.${acct_id}.removal_units_remaining == 59"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: removal_unit_conservation_across_draft_and_void
        grounds:
          - calculations.entitlement_remaining
          - calculations.removal_entitlement_draw
          - state_machines.RemovalRequest.DRAFTED_to_VOIDED
          - entities.Account.fields.removal_units_remaining
          - entities.EntitlementLedgerEntry.fields.signed_amount
        distinguishing_aspect: |
          Conserved quantity 1: REMOVAL entitlement UNITS. Drafting a request (forward action) and
          voiding it (compensating action) must leave
          granted - consumed + released == remaining == 60 exactly, with the ledger carrying one
          CONSUME and one RELEASE row whose signed_amounts sum to zero, and with the member's
          sub-cap counter back at zero.
        test_recipe:
          setup:
            - "FAMILY plan (removal_quota_per_cycle 60), ACTIVE account, ACTIVE profile with one identifier."
            - "One ExposureRecord in FOUND at an ACTIVE broker, discovered by a completed INITIAL scan."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /brokers"
              payload: { name: "QuickLookup", opt_out_method: "WEB_FORM", jurisdiction: "OTHER", response_window_days: 30, requires_identity_verification: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { broker_b_id: $.data.id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield", rescan_cadence_days: 30, two_factor_attested: false }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan_id: $.data.id }
            - call: "POST /scan-runs/${scan_id}/start"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /scan-runs/${scan_id}/findings"
              payload: { broker_id: "${broker_b_id}", exposure_kind: "PEOPLE_SEARCH", source_url: "https://quicklookup.example/dana" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { exp_id: $.data.id }
            - call: "POST /scan-runs/${scan_id}/complete"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
          trigger:
            - call: "POST /removal-requests"
              payload: { exposure_id: "${exp_id}" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { rr_id: $.data.id }
            - call: "GET /accounts/${acct_id}/entitlement-statement"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { mid_remaining: $.data.removal_remaining }
            - call: "POST /removal-requests/${rr_id}/void"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "GET /accounts/${acct_id}/entitlement-statement"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { end_remaining: $.data.removal_remaining }
          assert:
            - "Before the draft: entitlement-statement removal_granted == 60, removal_consumed == 0, removal_released == 0, removal_remaining == 60"
            - "After the draft: removal_granted == 60, removal_consumed == 1, removal_released == 0, removal_remaining == 59"
            - "After the void: removal_granted == 60, removal_consumed == 1, removal_released == 1, removal_remaining == 60"
            - "granted - consumed + released == remaining holds at all three observations (60-0+0==60, 60-1+0==59, 60-1+1==60)"
            - "GET /entitlement-ledger?account_id=${acct_id}&resource_type=REMOVAL returns total_count == 3: one GRANT with signed_amount 60, one CONSUME with signed_amount -1, one RELEASE with signed_amount 1"
            - "Member.${owner_id}.removal_units_consumed_this_cycle == 0 after the void"
            - "RemovalRequest.${rr_id}.entitlement_units_consumed == 1 and entitlement_units_released == 1"

      - name: seat_pool_conservation_across_bind_and_release
        grounds:
          - calculations.seat_pool_occupancy
          - state_machines.DeviceSeat.BOUND_to_RELEASED
          - entities.AddOnSubscription.fields.seats_bound
          - entities.AddOnSubscription.fields.seats_available
          - entities.DeviceSeat.fields.bind_count
        distinguishing_aspect: |
          Conserved quantity 2, of a different type entirely from entitlement units: SEAT POOL
          CAPACITY. seats_total == seats_bound + seats_available must hold at every observation, and
          the bind/release round trip must return seats_available to its pre-bind value of 3 while
          bind_count on the seat stays at 1 (releasing is not a re-bind).
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one ACTIVE DEVICE_PROTECTION add-on with seats_total 3 and no seats bound."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /accounts/${acct_id}/addons"
              payload: { addon_type: "DEVICE_PROTECTION", seats_total: 3, per_seat_fee_cents: 250 }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_id: $.data.id, addon_v1: $.data.version, pre_bound: $.data.seats_bound, pre_avail: $.data.seats_available }
          trigger:
            - call: "POST /device-seats"
              payload: { addon_id: "${addon_id}", member_id: "${owner_id}", device_label: "Dana Laptop", expected_addon_version: "${addon_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { seat_id: $.data.id }
            - call: "GET /addons/${addon_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { mid_bound: $.data.seats_bound, mid_avail: $.data.seats_available }
            - call: "POST /device-seats/${seat_id}/release"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "GET /addons/${addon_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { end_bound: $.data.seats_bound, end_avail: $.data.seats_available }
          assert:
            - "Before the bind: AddOnSubscription.${addon_id}.seats_bound == 0 and seats_available == 3 (0 + 3 == seats_total 3)"
            - "After the bind: seats_bound == 1 and seats_available == 2 (1 + 2 == 3)"
            - "After the release: seats_bound == 0 and seats_available == 3 (0 + 3 == 3) — the pool is exactly where it started"
            - "DeviceSeat.${seat_id}.status == RELEASED and bind_count == 1 — a release is not a re-bind"
            - "DeviceSeat.${seat_id}.rebind_eligible_at == 2026-05-04T00:00:00.000Z"
            - "GET /device-seats?addon_id=${addon_id} returns total_count == 1 — the round trip created no phantom seat rows"

      - name: breach_alert_row_count_conserved_across_reingest
        grounds:
          - calculations.breach_alert_dedup
          - calculations.breach_alert_severity
          - state_machines.BreachAlert.HIGH_to_CRITICAL
          - entities.BreachEvent.fields.alert_count
          - entities.BreachAlert.fields.escalation_count
        distinguishing_aspect: |
          Conserved quantity 3, again of a different type: the NUMBER OF DERIVED ALERT ROWS.
          Re-ingesting the same breach four times (including one payload with a duplicated value)
          leaves BreachEvent.alert_count pinned at 1 while severity ratchets LOW-side-up from HIGH to
          CRITICAL and then refuses to fall back to HIGH once the escalating finding is remediated.
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one ACTIVE MonitoredProfile carrying exactly one EMAIL identifier dana@example.com."
            - "One BreachEvent with base_severity_points 15 and record_types EMAIL_ADDRESS + PASSWORD_HASH, so record_points is 30."
            - "No CredentialFinding rows exist yet."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield", rescan_cadence_days: 30, two_factor_attested: false }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { ident_id: $.data.id }
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /breach-events"
              payload: { name: "MailVault 2026", breach_date: "2026-04-01T00:00:00Z", disclosed_at: "2026-04-15T00:00:00Z", record_types: ["EMAIL_ADDRESS", "PASSWORD_HASH"], base_severity_points: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { breach_id: $.data.id }
          trigger:
            - call: "POST /breach-events/${breach_id}/ingest"
              payload: { matched_identifier_values: ["dana@example.com"] }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { created1: $.data.created_alert_count, escalated1: $.data.escalated_alert_count }
            - call: "POST /breach-events/${breach_id}/ingest"
              payload: { matched_identifier_values: ["dana@example.com", "dana@example.com"] }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { created2: $.data.created_alert_count, unchanged2: $.data.unchanged_alert_count }
            - call: "POST /credential-findings"
              payload: { profile_id: "${prof_id}", finding_type: "BREACHED_PASSWORD", detail: "mail vault" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { finding_id: $.data.id }
            - call: "POST /breach-events/${breach_id}/ingest"
              payload: { matched_identifier_values: ["dana@example.com"] }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { created3: $.data.created_alert_count, escalated3: $.data.escalated_alert_count }
            - call: "POST /credential-findings/${finding_id}/remediate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /breach-events/${breach_id}/ingest"
              payload: { matched_identifier_values: ["dana@example.com"] }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { created4: $.data.created_alert_count, escalated4: $.data.escalated_alert_count, unchanged4: $.data.unchanged_alert_count }
            - call: "GET /breach-alerts?breach_event_id=${breach_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { alert_id: "$.data[0].id" }
          assert:
            - "Ingest 1: created_alert_count == 1, escalated_alert_count == 0, unchanged_alert_count == 0, matched_identifier_count == 1"
            - "After ingest 1 the alert has severity_points == 50 (15 base + 30 record + 5 identifier bonus) and severity == HIGH"
            - "Ingest 2 with a duplicated value: created_alert_count == 0, unchanged_alert_count == 1, matched_identifier_count == 1 — duplicates inside one payload collapse"
            - "Ingest 3 after the BREACHED_PASSWORD finding: created_alert_count == 0, escalated_alert_count == 1"
            - "After ingest 3 the alert has severity_points == 60 (50 + 10 hygiene escalation), severity == CRITICAL and escalation_count == 1"
            - "Ingest 4 after remediation recomputes 50 / HIGH: created_alert_count == 0, escalated_alert_count == 0, unchanged_alert_count == 1"
            - "MONOTONICITY: the alert still reads severity == CRITICAL, severity_points == 60 and escalation_count == 1 — it never de-escalated"
            - "CONSERVATION: BreachEvent.${breach_id}.alert_count == 1 after every one of the four ingests, and BreachEvent.${breach_id}.ingest_count == 4"
            - "GET /breach-alerts?breach_event_id=${breach_id} returns total_count == 1 with identifier_id == ${ident_id} and member_id == ${owner_id}"
