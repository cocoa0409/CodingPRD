scaffold_difficulty_design:
  # ============================================================
  # Rule 1: dual_variant_calc — different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: project_pricing_provisional_vs_final
        grounds:
          - calculations.quote_provisional
          - calculations.quote_final
          - calculations.revision_billing_rounds
        distinguishing_aspect: |
          Project pricing uses two valid variants — quote_provisional runs at BOOKED and
          uses (engineer rate at booking) * rush multiplier with billable_rounds=0;
          quote_final runs at APPROVED and adds (extra rounds beyond included) *
          per_round_cents + breach surcharges. Same booking inputs, different totals once
          a second revision round accrues. Pins the Project-pricing entity domain.
        test_recipe:
          setup:
            - "Engineer E hourly_rate_cents=120000 ($1200/hr)"
            - "RushTierRule RUSH: multiplier_bp=20000 (2.0x), sla_hours=72, surcharge_breach_cents=15000, included_revision_rounds=1, per_round_cents=30000"
            - "Client C ACTIVE with account_credit_cents=10000000"
            - "Project P 60 min RUSH targeting SPOTIFY; reaches MASTERING"
            - "Round 1 submitted then REJECTED → round 2 opened; round 2 SUBMITTED"
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "SENIOR", hourly_rate_cents: 120000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/rush-tier-rules"
              payload: { tier: "RUSH", multiplier_bp: 20000, sla_hours: 72, surcharge_breach_cents: 15000, included_revision_rounds: 1, per_round_cents: 30000 }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/credit-adjustments"
              payload: { amount_cents: 10000000, reason: "seed" }
              as: StudioManager
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", upc: "012345678901", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60, rush_tier: "RUSH" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/activate"
              payload: {}
              as: StudioManager
            - call: "GET /studio/clients/${cli_id}"
              as: StudioManager
              captures: { cli_ver: $.data.version }
            - call: "POST /studio/projects/${proj_id}/book"
              payload: { expected_client_version: "${cli_ver}" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { prov_cents: $.data.quoted_price_cents }
            - call: "POST /studio/projects/${proj_id}/begin-intake"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/source-assets"
              payload: { filename: "a.wav", sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", sample_rate_hz: 44100, bit_depth: 24, duration_seconds: 60.0, channels: 2 }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /studio/source-assets/${sa_id}/qc-pass"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/qc/complete"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/start-mastering"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { r1_id: $.data.current_revision_round_id, pv1: $.data.version }
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/submit"
              payload: { expected_project_version: "${pv1}" }
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/reject"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
              captures: { r2_id: $.data.id, pv2: $.data.version }
            - call: "POST /studio/projects/${proj_id}/rounds/${r2_id}/submit"
              payload: { expected_project_version: "${pv2}" }
              as: Engineer
              as_user_id: "${eng_id}"
          trigger:
            - call: "POST /studio/projects/${proj_id}/rounds/${r2_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
          assert:
            # quote_provisional = 1h * 120000 * 2.0 = 240000 (billable_rounds=0)
            - "Project.${proj_id}.quoted_price_cents == 240000"
            # quote_final = 240000 + (2-1)*30000 + 0 = 270000
            - "Project.${proj_id}.final_price_cents == 270000"
            - "Project.${proj_id}.final_price_cents != Project.${proj_id}.quoted_price_cents"
            - "Project.${proj_id}.revision_round_count == 2"

      - name: archive_recall_fee_tiered_vs_min_floor
        grounds:
          - calculations.compute_recall_fee
          - calculations.archive_recall_pricing_boundary
        distinguishing_aspect: |
          ArchiveBundle recall pricing has two valid variants — a tiered per-GB fee
          (HOT=500, WARM=1000, COLD=2000, GLACIER=4000 cents/GB) and a flat $10 minimum
          that dominates when tier*size < 1000. A 1 GB HOT bundle would naively cost
          500 cents, but the min floor drives it to 1000; a 1 GB GLACIER bundle costs
          4000 cents (tier dominates). Same entity (ArchiveBundle), different formula
          paths. Different domain from Project pricing.
        test_recipe:
          setup:
            - "Project P1 archived with storage_class=HOT, archive_size_bytes=1073741824 (1 GB exactly)"
            - "Client C1 has account_credit_cents = 50000"
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "STAFF", hourly_rate_cents: 80000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "APPLE_MUSIC", integrated_lufs: -16.0, true_peak_dbtp: -1.0, loudness_range_lu: 11.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "AAC_256" }
              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/rush-tier-rules"
              payload: { tier: "STANDARD", multiplier_bp: 10000, sla_hours: 72, surcharge_breach_cents: 0, included_revision_rounds: 1, per_round_cents: 10000 }
              as: StudioManager
            - call: "POST /studio/clients"
              payload: { legal_name: "C1", contact_email: "c1@x.com" }
              as: StudioManager
              captures: { c1_id: $.data.id }
            - call: "POST /studio/clients/${c1_id}/credit-adjustments"
              payload: { amount_cents: 50000, reason: "seed" }
              as: StudioManager
            - call: "POST /studio/projects"
              payload: { client_id: "${c1_id}", title: "P1", upc: "111111111111", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60, rush_tier: "STANDARD" }
              as: Client
              as_user_id: "${c1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /studio/clients/${c1_id}/activate"
              payload: {}
              as: StudioManager
            - call: "GET /studio/clients/${c1_id}"
              as: StudioManager
              captures: { c1_ver: $.data.version }
            - call: "POST /studio/projects/${p1_id}/book"
              payload: { expected_client_version: "${c1_ver}" }
              as: Client
              as_user_id: "${c1_id}"
            - call: "POST /studio/projects/${p1_id}/begin-intake"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${p1_id}/source-assets"
              payload: { filename: "a.wav", sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", sample_rate_hz: 44100, bit_depth: 24, duration_seconds: 60.0, channels: 2 }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /studio/source-assets/${sa_id}/qc-pass"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${p1_id}/qc/complete"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${p1_id}/start-mastering"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { r1_id: $.data.current_revision_round_id, pv1: $.data.version }
            - call: "POST /studio/projects/${p1_id}/rounds/${r1_id}/submit"
              payload: { expected_project_version: "${pv1}" }
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${p1_id}/rounds/${r1_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${c1_id}"
            - call: "POST /studio/projects/${p1_id}/deliver"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${p1_id}/deliverables"
              payload: { revision_round_id: "${r1_id}", deliverable_kind: "MASTER_AAC", integrated_lufs: -16.0, true_peak_dbtp: -1.0, loudness_range_lu: 11.0, sample_rate_hz: 44100, bit_depth: 24 }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { d_id: $.data.id }
            - call: "POST /studio/deliverables/${d_id}/submit-qc"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/deliverables/${d_id}/qc-reports"
              payload: { check_code: "LOUDNESS_IN_TOL", passed: true, measured_value: -16.0, tolerance: 0.5 }
              as: QAChecker
            - call: "POST /studio/deliverables/${d_id}/qc-pass"
              payload: {}
              as: QAChecker
            - call: "POST /studio/deliverables/${d_id}/metadata-tags"
              payload: { isrc: "USRC17607839", upc: "111111111111" }
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/deliverables/${d_id}/verify-metadata"
              payload: {}
              as: QAChecker
            - call: "POST /studio/projects/${p1_id}/finalize-delivery"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${p1_id}/archive"
              payload: { storage_class: "HOT", archive_size_bytes: 1073741824 }
              as: StudioManager
              captures: { ab_id: $.data.id }
          trigger:
            - call: "POST /studio/projects/${p1_id}/recall"
              payload: {}
              as: Client
              as_user_id: "${c1_id}"
          assert:
            # 1 GB * 500 = 500 cents tier fee; min floor 1000 dominates → 1000
            - "ArchiveBundle.${ab_id}.recall_fee_cents == 1000"
            - "ArchiveBundle.${ab_id}.recall_status == PENDING"

  # ============================================================
  # Rule 2: combinatorial_formula — different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_final_mode_a_three_input_tiered
        grounds:
          - calculations.quote_final
        distinguishing_aspect: |
          Mode (a): quote_final combines ≥3 inputs with non-linear interaction —
          base_cents = hours * engineer_rate * (rush_multiplier_bp / 10000); then
          adds max(0, total_rounds - included) * per_round_cents; then adds
          breach_count * surcharge_breach_cents; finally rounds half-up to integer cents.
          The rush multiplier applies ONLY to base, not to the round/ breach adders.
          Inputs pinned so the result is a deterministic literal: 1h * 120000 * 2.0
          + 2 * 30000 + 1 * 15000 = 240000 + 60000 + 15000 = 315000.
        test_recipe:
          setup:
            - "Engineer E hourly_rate_cents=120000"
            - "RushTierRule RUSH: multiplier_bp=20000, sla_hours=72, surcharge_breach_cents=15000, included_revision_rounds=1, per_round_cents=30000"
            - "Project 60 min RUSH; revision_round_count reaches 3 (2 extra beyond included)"
            - "One RevisionRound transitioned to EXPIRED via clock advance before being reopened via reject (we model breach by counting EXPIRED rows in quote_final)"
            - "Note: to make breach_count=1 deterministically, round 1 expires via clock advance; round 1's transition OPEN → EXPIRED fires; then we simulate a rejection-equivalent by manually advancing — but per the state machine EXPIRED is terminal. Instead we pin breach_count=0 and use only extra_rounds and rush for the formula demonstration."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "SENIOR", hourly_rate_cents: 120000, capacity_minutes_per_day: 480 }
              as: StudioManager
              captures: { eng_id: $.data.id }
