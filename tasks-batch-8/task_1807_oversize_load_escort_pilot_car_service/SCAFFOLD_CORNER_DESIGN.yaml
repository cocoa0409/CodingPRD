  - section: calculations
    instances:
      - name: quote_estimated_hours_ceil_to_half_hour
        claim_type: correct_result
        grounds: [calculations.quote_estimate]
        distinguishing_aspect: "Estimated hours round UP to the next 0.5h before pricing: 30mi / 50mph = 0.6h -> 1.0h, quoted 9000 (not 5400)."
        test_recipe:
          setup: ["Carrier; DRAFT TX job width 170 / height 150, distance 30mi"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Short Haul Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Short", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T11:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 30, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T11:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
          trigger:
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher, captures: { quoted: $.data.quoted_cents } }
          assert:
            - "quoted == 9000 (ceil(30/50*2)/2 = 1.0h x 1 position x 9000); quote_expires_at == quoted_at + 72h; total_escort_positions == 1"

      - name: final_billing_minimum_floor
