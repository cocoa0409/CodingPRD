            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_a_id}", name: "FA Alpha Feature", window_start: "2026-08-03", window_end: "2026-08-17", accrual_method: "SHIPMENT", expected_allocation_version: "${alloc_a_v}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_fa_id: $.data.id }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_b_id}", name: "FB Beta Feature", window_start: "2026-08-17", window_end: "2026-09-14", accrual_method: "SHIPMENT", expected_allocation_version: "${alloc_b_v}" }
