  - rule_id: transitive_cascade
    instances:
      - name: finalizing_one_under_triaged_review_restricts_the_dispatcher_five_links_later
        grounds:
          - state_machines.Review.SCORED_to_FINALIZED
          - calculations.dispatcher_compliance_rollup
          - calculations.auto_coaching_plan_upsert
          - calculations.remediation_hours_ledger
          - calculations.dispatch_privilege_derivation
        distinguishing_aspect: |
          CASCADE A, five causal links from a single POST: review FINALIZED -> dispatcher point
          ledger -> compliance_posture PROBATION -> AUTO CoachingPlan created at CRITICAL
          severity -> remediation_hours_owed 8.00 -> dispatch_privilege RESTRICTED. Nothing in
          the request body mentions coaching plans, hours or privileges; every one of them is
          a downstream consequence, and link 5 fires only because link 4 crossed a threshold.
        test_recipe:
          setup:
            - "Program with target_compliance_pct 90.0, watch_floor_pct 80.0, hours_owed_restriction_threshold 6.0."
            - "One dispatcher, dispatch_privilege FULL, posture UNRATED, remediation_hours_owed 0.00, no coaching plans."
            - "A CHEST_PAIN call dispatched as 10-C-4 (COLD, ALS) targeted into a review."
            - "The reviewer submits an all-90 sheet but determines the correct code was 10-E-1 (HOT, ALS) — an under-triage."
