  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.ProductionContract.initial_state
          - entities.ProductionContract.fields.status
        distinguishing_aspect: "A freshly created ProductionContract starts in DRAFT with every derived counter at its zero value and advance_outstanding_cents seeded from advance_total_cents."
        test_recipe:
          setup:
            - "Variety, grower and a 320.0-acre field exist; no contracts yet"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
          trigger:
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
          assert:
            - "Returns 201 with ProductionContract.${c_id}.status == DRAFT"
            - "ProductionContract.${c_id}.version == 1 and rogueing_rounds_used == 0 and inspection_round == 0"
            - "ProductionContract.${c_id}.advance_outstanding_cents == 1200000 and advance_total_cents == 1200000"
            - "ProductionContract.${c_id}.provisional_clean_units_total == 0.0 and certified_units_total == 0.0 and requires_field_officer_review == false"
            - "ProductionContract.${c_id}.planted_on == null"

      - name: contract_offer_moves_draft_to_offered
        claim_type: valid_transition
        grounds:
          - state_machines.ProductionContract.DRAFT_to_OFFERED
          - calculations.field_eligibility_assessment
        distinguishing_aspect: "POST /seed-ops/production-contracts/{production_contract_id}/offer on a DRAFT contract whose field has no restricted history and sufficient isolation moves it to OFFERED and bumps version to 2."
        test_recipe:
          setup:
            - "DRAFT contract on a field whose only history record is CANOLA 2024 (not restricted for HRW-Sable) with isolation 250.0 m against a 200.0 m minimum"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /seed-ops/production-contracts/${c_id}/offer"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Returns 200 with ProductionContract.${c_id}.status == OFFERED"
            - "ProductionContract.${c_id}.version == 2"
            - "ProductionContract.${c_id}.applied_eligibility_variant == STRICT_HISTORY (seed_class CERTIFIED)"
            - "Grower.${g_id}.status == GOOD_STANDING and compliance_flag_count == 0"

      - name: contract_sign_before_offer_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProductionContract.OFFERED_to_PLANTED
          - validations.priority_7_ERR_INVALID_CONTRACT_STATE
        distinguishing_aspect: "sign is declared only from OFFERED, so invoking it on a DRAFT contract returns 409 ERR_INVALID_CONTRACT_STATE and leaves planted_on null."
        test_recipe:
          setup:
            - "One DRAFT contract that has never been offered"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /seed-ops/production-contracts/${c_id}/sign"
              payload: { planted_on: "2026-04-15" }
              as: Grower
              as_user_id: "${g_id}"
          assert:
            - "Returns 409 with data.error_id == ERR_INVALID_CONTRACT_STATE"
            - "ProductionContract.${c_id}.status == DRAFT and planted_on == null and version == 1"

      - name: contract_cancel_twice_second_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ProductionContract.OFFERED_to_CANCELLED
          - validations.priority_7_ERR_INVALID_CONTRACT_STATE
        distinguishing_aspect: "cancel succeeds once from OFFERED; the second identical cancel returns 409 ERR_INVALID_CONTRACT_STATE and does not overwrite the stored cancel_reason or re-bump version."
        test_recipe:
          setup:
            - "One OFFERED contract"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-North-12", acres: 320.0, isolation_distance_m: 250.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "CANOLA", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-contracts"
              payload: { grower_id: "${g_id}", variety_id: "${v_id}", production_field_id: "${f_id}", season_year: 2026, seed_class: "CERTIFIED", contracted_acres: 300.0, base_price_per_unit_cents: 1850, conditioning_charge_per_unit_cents: 220, advance_total_cents: 1200000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seed-ops/production-contracts/${c_id}/offer"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /seed-ops/production-contracts/${c_id}/cancel"
              payload: { cancel_reason: "Grower withdrew from the program" }
              as: ProgramAdmin
            - call: "POST /seed-ops/production-contracts/${c_id}/cancel"
              payload: { cancel_reason: "Duplicate cancellation attempt" }
              as: ProgramAdmin
          assert:
            - "First call returns 200 with ProductionContract.${c_id}.status == CANCELLED and version == 3"
            - "Second call returns 409 with data.error_id == ERR_INVALID_CONTRACT_STATE"
            - "ProductionContract.${c_id}.cancel_reason == Grower withdrew from the program and version is still 3"

