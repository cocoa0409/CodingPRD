              as: LocalizationProducer
              captures: { mp_kr: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { jp_units: "$.data.text_effort_units", jp_cost: "$.data.localization_cost_cents" }
            - call: "POST /market-plans/${mp_kr}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { kr_units: "$.data.text_effort_units", kr_cost: "$.data.localization_cost_cents" }
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_kr}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "GET /translation-units?market_plan_id=${mp_jp}&string_key_id=${k_menu}"
              payload: {}
              as: TranslationVendor
              captures: { u_jp_menu: "$.data[0].id" }
            - call: "GET /translation-units?market_plan_id=${mp_jp}&string_key_id=${k_hud}"
              payload: {}
              as: TranslationVendor
              captures: { u_jp_hud: "$.data[0].id" }
            - call: "GET /translation-units?market_plan_id=${mp_kr}&string_key_id=${k_menu}"
              payload: {}
              as: TranslationVendor
              captures: { u_kr_menu: "$.data[0].id" }
            - call: "GET /translation-units?market_plan_id=${mp_kr}&string_key_id=${k_hud}"
              payload: {}
              as: TranslationVendor
              captures: { u_kr_hud: "$.data[0].id" }
            - call: "PUT /translation-units/${u_jp_menu}"
              payload: { target_text: "ゲームを始める", target_char_count: 90, applied_tm_match_pct: 96 }
              as: TranslationVendor
            - call: "POST /translation-units/${u_jp_menu}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "PUT /translation-units/${u_kr_menu}"
              payload: { target_text: "게임 시작", target_char_count: 80, applied_tm_match_pct: 96 }
              as: TranslationVendor
            - call: "POST /translation-units/${u_kr_menu}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "PUT /translation-units/${u_kr_hud}"
              payload: { target_text: "잔탄", target_char_count: 55, applied_tm_match_pct: 80 }
              as: TranslationVendor
            - call: "POST /translation-units/${u_kr_hud}/deliver"
              payload: {}
              as: TranslationVendor
          trigger:
            - call: "POST /market-plans/${mp_jp}/enter-lqa"
