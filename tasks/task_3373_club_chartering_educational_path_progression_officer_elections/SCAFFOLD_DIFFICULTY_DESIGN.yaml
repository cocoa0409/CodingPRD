          assert:
            - "Club.${club_id}.approved_level_completions_this_cycle == 1 before the return and == 2 after it, because the revert makes the two LEVEL_1 completions the ones that match the current level"
            - "Club.${club_id}.good_standing_score == 12 before the return (1 dues + 5 education + 6 DCP) and == 17 after it (1 dues + 10 education + 6 DCP)"
            - "EducationPath.${path_id}.level == LEVEL_1 after the cascade"
            - "ProjectCompletion.${pc3_id}.status == RETURNED and Club.${club_id}.good_standing stays NOT_IN_GOOD_STANDING because posture only moves at close-cycle"

      - name: renewal_reactivates_path_and_recounts_roster
        grounds:
          - state_machines.Membership.LAPSED_to_ACTIVE
          - state_machines.EducationPath.SUSPENDED_to_ACTIVE
          - entities.Club.fields.paid_member_count
          - calculations.dues_quote
        distinguishing_aspect: |
          A three-hop cascade triggered by POST /memberships/{id}/renew on a lapsed member: the
          payment flips dues_status to PAID, that reactivates the membership, and the reactivated
          membership unsuspends the education path while the club's paid_member_count is recounted.
        test_recipe:
          setup:
