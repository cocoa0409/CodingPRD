            - call: "POST /contractors"
              payload: { name: "Cascade Trenchless", state_code: "OR", license_number: "OR-PL-4471", license_expires_on: "2027-06-30", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 18000, sla_compliance_pct: 92, max_open_dispatches: 5, permit_pull_authorized: true }
