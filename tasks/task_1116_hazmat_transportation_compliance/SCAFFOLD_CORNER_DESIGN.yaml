        claim_type: listing
        grounds: [response_envelope, entities.Carrier]
        distinguishing_aspect: "List envelope: limit=2 over 3 carriers returns total_count 3 and has_more true; offset=2 returns the last page with has_more false; default limit is 10."
        test_recipe:
          setup: ["three carriers created"]
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Carrier One", usdot_number: "USDOT-3022A", fleet_size_declared: 1, hazmat_categories: ["MISC"] }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Carrier Two", usdot_number: "USDOT-3022B", fleet_size_declared: 2, hazmat_categories: ["MISC"] }
              as: CarrierAdmin
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Carrier Three", usdot_number: "USDOT-3022C", fleet_size_declared: 3, hazmat_categories: ["MISC"] }
              as: CarrierAdmin
          trigger:
            - call: "GET /hazmat/carriers?limit=2&offset=0"
              as: Regulator
            - call: "GET /hazmat/carriers?limit=2&offset=2"
              as: Regulator
          assert:
            - "page 1: data has 2 items; pagination block total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2: data has 1 item; has_more == false"
            - "meta block carries api_request_id and api_request_timestamp on every response"
