          - validations.priority_11_chronology
          - errors.ERR_LEASE_NOT_OPERATIVE
          - errors.ERR_CHRONOLOGY_VIOLATION
          - state_machines.Lease.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          One filing violates two rules at once: the lease is TERMINATED (priority 7) and the statement
          period has not closed yet (priority 11). The 409 ERR_LEASE_NOT_OPERATIVE must win. Both rules are
          then shown live in isolation, so an implementation cannot pass by only ever raising one of them,
          and the OCC guard is satisfied on every call so priority 4 never masks the pair.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default."
            - "Lease A is terminated by a casualty termination election (damage 40000000 against improvements 60000000 clears CASUALTY_TERMINATION_THRESHOLD_BPS 5000)."
            - "Lease B is an untouched ACTIVE lease used as the control."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-52-A", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_a_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-52-B", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_b_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_a_id}/loss-events"
              payload: { event_type: "CASUALTY", scope_code: "PARTIAL", occurred_at: "2026-07-01T00:00:00Z", damage_estimate_cents: 40000000, damaged_area_sqft: 20000 }
              as: AssetManager
              captures: { loss_id: $.data.id }
            - call: "POST /portfolio/loss-events/${loss_id}/adjust"
              payload: { distributable_pool_cents: 40000000, allocation_method: "BONUS_VALUE", rent_abatement_bps: 0 }
              as: AssetManager
            - call: "POST /portfolio/loss-events/${loss_id}/election"
              payload: { election: "TERMINATE" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "GET /portfolio/leases/${lease_a_id}"
              payload: {}
              as: LessorAdmin
              captures: { lease_a_v: $.data.version }
            - call: "GET /portfolio/leases/${lease_b_id}"
              payload: {}
              as: LessorAdmin
              captures: { lease_b_v: $.data.version }
          trigger:
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_a_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", reported_gross_sales_cents: 120000000, expected_lease_version: "${lease_a_v}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_a_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", reported_gross_sales_cents: 120000000, expected_lease_version: "${lease_a_v}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_b_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", reported_gross_sales_cents: 120000000, expected_lease_version: "${lease_b_v}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
          assert:
            - "after setup: Lease.${lease_a_id}.lease_status == TERMINATED and rent_status == FROZEN; Lease.${lease_b_id}.lease_status == ACTIVE"
            - "trigger[0] (both rules violated) returns ERR_LEASE_NOT_OPERATIVE (409), never ERR_CHRONOLOGY_VIOLATION (422)"
            - "trigger[1] (only priority 7 violated) returns ERR_LEASE_NOT_OPERATIVE (409)"
            - "trigger[2] (only priority 11 violated) returns ERR_CHRONOLOGY_VIOLATION (422), proving the lower-priority rule is live"
            - "no PercentageRentStatement row was created by any of the three calls and neither lease's version moved"

      - name: alteration_decision_unauthorized_role_beats_the_gfa_envelope_aggregate
        grounds:
          - validations.priority_2_authorization
          - validations.priority_13_gfa_envelope
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_GFA_ENVELOPE_EXCEEDED
          - roles.LeaseAccountant
          - endpoints.POST_/portfolio/alteration-requests/{id}/decision
        distinguishing_aspect: |
          The same decision call is simultaneously made by a role that is not on the endpoint
          (LeaseAccountant, priority 2) and would blow the development envelope by 10000 sqft
          (priority 13). The 403 must come back and, critically, Lease.gfa_allocated_sqft must not move -
          an implementation that computes the envelope before checking the role would leak the aggregate
          error and, worse, could consume capacity on a call it then refuses. Re-running the identical
          request as AssetManager surfaces the 409, so both rules are proven live on one fixture.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; lease with total_permitted_gfa_sqft 200000 and permitted_use_code RETAIL_MIXED."
            - "Alteration A1 for 150000 sqft (COSMETIC, window 2027-01-01 to 2027-06-01) is already APPROVED, leaving gfa_unallocated_sqft 50000."
            - "Alteration A2 asks for 60000 sqft in a touching, non-overlapping window 2027-06-01 to 2027-12-01, so only the aggregate rule can bite."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-53", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 150000, construction_window_start: "2027-01-01T00:00:00Z", construction_window_end: "2027-06-01T00:00:00Z", estimated_cost_cents: 1000000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { alt_1_id: $.data.id }
            - call: "POST /portfolio/alteration-requests/${alt_1_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 60000, construction_window_start: "2027-06-01T00:00:00Z", construction_window_end: "2027-12-01T00:00:00Z", estimated_cost_cents: 2000000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { alt_2_id: $.data.id }
          trigger:
            - call: "POST /portfolio/alteration-requests/${alt_2_id}/decision"
              payload: { decision: "APPROVE" }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/alteration-requests/${alt_2_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
          assert:
            - "after setup: AlterationRequest.${alt_1_id}.status == APPROVED and Lease.${lease_id}.gfa_allocated_sqft == 150000 with gfa_unallocated_sqft == 50000"
            - "trigger[0] returns ERR_UNAUTHORIZED (403), never ERR_GFA_ENVELOPE_EXCEEDED (409)"
            - "after trigger[0]: AlterationRequest.${alt_2_id}.status is still SUBMITTED, Lease.${lease_id}.gfa_allocated_sqft is still 150000 and the lease version did not move"
            - "trigger[1] returns ERR_GFA_ENVELOPE_EXCEEDED (409) because 150000 + 60000 > 200000"
            - "after trigger[1]: AlterationRequest.${alt_2_id}.status is still SUBMITTED and gfa_unallocated_sqft is still 50000"
            - "GET /portfolio/leases/${lease_id}/rent-summary reports gfa_allocated_sqft 150000 and gfa_unallocated_sqft 50000"

      - name: statement_stale_version_beats_chronology_then_chronology_surfaces
        grounds:
          - validations.priority_4_concurrency
          - validations.priority_11_chronology
          - concurrency_rules.statement-create-stale-lease
          - errors.ERR_STALE_LEASE_VERSION
          - errors.ERR_CHRONOLOGY_VIOLATION
        distinguishing_aspect: |
          The OCC guard at priority 4 outranks the chronology rule at priority 11, so a filing that is both
          stale and premature must answer 412, not 422. The fixture makes the version stale by an unrelated
          write (a rent charge) between the read and the filing, which is exactly the lost-update race the
          guard exists for, and the four-call matrix (stale/fresh x premature/closed) pins the ordering in
          both directions and ends with a 201.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; one ACTIVE lease."
            - "The tenant reads the lease version, then the accountant posts a 1000000 rent charge, bumping Lease.version and making the read stale."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-54", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { stale_v: $.data.version }
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: 1000000, memo: "2026 Q2 ground rent" }
              as: LeaseAccountant
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { fresh_v: $.data.version }
          trigger:
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", reported_gross_sales_cents: 120000000, expected_lease_version: "${stale_v}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", reported_gross_sales_cents: 120000000, expected_lease_version: "${stale_v}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", reported_gross_sales_cents: 120000000, expected_lease_version: "${fresh_v}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", reported_gross_sales_cents: 120000000, expected_lease_version: "${fresh_v}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
          assert:
            - "after setup: ${fresh_v} == ${stale_v} + 1 and Lease.${lease_id}.arrears_balance_cents == 1000000"
            - "trigger[0] (stale and premature) returns ERR_STALE_LEASE_VERSION (412), never ERR_CHRONOLOGY_VIOLATION (422)"
            - "trigger[1] (stale only) returns ERR_STALE_LEASE_VERSION (412)"
            - "trigger[2] (fresh but premature) returns ERR_CHRONOLOGY_VIOLATION (422)"
            - "trigger[3] (fresh and closed) returns 201 with status SUBMITTED and base_rent_offset_credit_cents 2500000"
            - "Lease.${lease_id}.version moved exactly once across the four calls - only trigger[3] wrote"

  - rule_id: boundary_precision_check
    instances:
      - name: assignment_tier_boundary_at_below_above_and_the_minimum_fee_floor
        grounds:
          - calculations.transfer_fee
          - entities.TransferRequest.fields.transfer_fee_gross_cents
          - state_machines.TransferRequest.SUBMITTED_to_CONSENT_GRANTED
        distinguishing_aspect: |
          ASSIGNMENT_TIER1_CEILING_CENTS is an inclusive ceiling and the tier rate applies to the whole
          consideration, so one cent of extra consideration at the boundary moves the fee by 1025000 cents.
          Four consideration values pin it: 49999999 and 50000000 both price at 300 bps for 1537500, while
          50000001 jumps to 500 bps for 2562500, and 1000000 exercises the MIN_ASSIGNMENT_FEE_CENTS floor
          where the computed 30000 is replaced by 500000 before the admin charge is taken.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; one lease, one incoming assignee Lessee rated BBB."
            - "Four ASSIGNMENT requests on that lease, term 2026-09-01 to 2070-01-01 (so none is submitted_late), consent_deposit_cents 0, net_consideration_cents 49999999 / 50000000 / 50000001 / 1000000."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Seawall Fund II LLC", notice_email: "asset@seawall.example", credit_rating_code: "BBB" }
              as: LessorAdmin
              captures: { assignee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-55", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "ASSIGNMENT", term_start: "2026-09-01T00:00:00Z", term_end: "2070-01-01T00:00:00Z", transferee_legal_name: "Seawall Fund II LLC", transferee_lessee_id: "${assignee_id}", transferee_credit_rating_code: "BBB", net_consideration_cents: 49999999, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { a_below_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "ASSIGNMENT", term_start: "2026-09-01T00:00:00Z", term_end: "2070-01-01T00:00:00Z", transferee_legal_name: "Seawall Fund II LLC", transferee_lessee_id: "${assignee_id}", transferee_credit_rating_code: "BBB", net_consideration_cents: 50000000, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { a_at_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "ASSIGNMENT", term_start: "2026-09-01T00:00:00Z", term_end: "2070-01-01T00:00:00Z", transferee_legal_name: "Seawall Fund II LLC", transferee_lessee_id: "${assignee_id}", transferee_credit_rating_code: "BBB", net_consideration_cents: 50000001, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { a_above_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "ASSIGNMENT", term_start: "2026-09-01T00:00:00Z", term_end: "2070-01-01T00:00:00Z", transferee_legal_name: "Seawall Fund II LLC", transferee_lessee_id: "${assignee_id}", transferee_credit_rating_code: "BBB", net_consideration_cents: 1000000, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { a_floor_id: $.data.id }
          trigger:
            - call: "POST /portfolio/transfer-requests/${a_below_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
            - call: "POST /portfolio/transfer-requests/${a_at_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
            - call: "POST /portfolio/transfer-requests/${a_above_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
            - call: "POST /portfolio/transfer-requests/${a_floor_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
          assert:
            - "TransferRequest.${a_below_id}.transfer_fee_gross_cents == 1500000, admin_charge_cents == 37500, late_surcharge_cents == 0, total_transfer_fee_cents == 1537500"
            - "TransferRequest.${a_at_id}.transfer_fee_gross_cents == 1500000 and total_transfer_fee_cents == 1537500 (50000000 is inside tier 1, the ceiling is inclusive)"
            - "TransferRequest.${a_above_id}.transfer_fee_gross_cents == 2500000, admin_charge_cents == 62500, total_transfer_fee_cents == 2562500"
            - "TransferRequest.${a_above_id}.total_transfer_fee_cents - TransferRequest.${a_at_id}.total_transfer_fee_cents == 1025000 for one cent of extra consideration"
            - "TransferRequest.${a_floor_id}.transfer_fee_gross_cents == 500000 (the 300 bps result 30000 is floored by MIN_ASSIGNMENT_FEE_CENTS), admin_charge_cents == 12500, total_transfer_fee_cents == 512500"
            - "all four rows are CONSENT_GRANTED and allocable_base_rent_cents is null on every one of them (assignments do not allocate base rent)"
            - "Lease.${lease_id}.lessee_id is still ${lessee_id} - nothing was paid, so no assignment activated"

      - name: percentage_rent_at_breakpoint_with_empty_sublease_set_and_rounding_floor
        grounds:
          - calculations.percentage_rent_due
          - calculations.sublease_inclusion_base
          - entities.PercentageRentStatement.fields.gross_percentage_rent_cents
          - endpoints.POST_/portfolio/percentage-rent-statements/{id}/assess
        distinguishing_aspect: |
          Three boundaries in one fixture: the inclusion set is empty (sum over no rows must be 0, not
          null), adjusted sales sit exactly on percentage_rent_breakpoint_cents so the strict excess is 0,
          and round_half_up on the rate application has its own boundary - an excess of 8 cents rounds to
