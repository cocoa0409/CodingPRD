              as: Dispatcher
              captures: { v_in_id: $.data.id }
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-07-20T13:00:00Z", scheduled_end_at: "2026-07-20T15:00:00Z" }
