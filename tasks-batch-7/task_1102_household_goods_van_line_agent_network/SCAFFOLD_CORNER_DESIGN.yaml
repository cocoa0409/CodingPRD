        as: VanLineAdmin
        captures:
          cust: $.data.id
      - call: POST /tariffs
        payload:
          tariff_code: T-C4
          effective_start: '2026-01-01T00:00:00Z'
          effective_end: '2027-01-01T00:00:00Z'
