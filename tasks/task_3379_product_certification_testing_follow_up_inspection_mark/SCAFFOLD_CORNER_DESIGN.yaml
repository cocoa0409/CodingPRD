# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3379_product_certification_testing_follow_up_inspection_mark
# Breadth probe over §1.1-§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.
# Anchors are local to this file (c_ prefix): &c_clock, &c_std, &c_mfr, &c_fac,
# &c_proj, &c_cr, &c_samp1, &c_acc1, &c_res1, &c_res2, &c_decide, &c_getcert.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: manufacturer_create_returns_declared_fields_and_active_status
        claim_type: creation
        grounds:
          - entities.Manufacturer
          - endpoints.POST_/certification/manufacturers
        distinguishing_aspect: "A manufacturer created with the three required inputs returns 201 with status ACTIVE, version 1, and system-minted id/created_at/updated_at — status and suspension_reason are never client-supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &c_clock
              call: "POST /certification/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertificationBodyAdmin
          trigger:
            - &c_mfr
              call: "POST /certification/manufacturers"
              payload: { legal_name: "Acme Devices LLC", home_jurisdiction_code: "US-OSHA", annual_revenue_tier: "SMALL" }
              as: CertificationBodyAdmin
              captures: { mfr_id: $.data.id }
          assert:
            - "response status 201 and response_type == object"
            - "Manufacturer.${mfr_id}.status == ACTIVE and suspension_reason is null"
            - "Manufacturer.${mfr_id}.version == 1 and id / created_at / updated_at are non-null"
            - "created_at == 2026-09-01T00:00:00Z (the logical clock default), not wall-clock time"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: standard_status_computed_from_effectiveness_window
        claim_type: computed_fields
        grounds:
          - entities.Standard.fields.status
          - endpoints.POST_/certification/standards
        distinguishing_aspect: "A standard whose window opens in the future is computed UPCOMING at creation; the canonical standard (window opened 2026-01-01, open-ended) is computed ACTIVE — status is derived from the logical clock, never accepted as input."
        test_recipe:
          setup: ["Clock at 2026-09-01."]
          setup_api_calls:
            - *c_clock
          trigger:
            - &c_std
              call: "POST /certification/standards"
              payload: { category_code: "IT-AV", standard_code: "UL-62368", edition_label: "Ed. 4", effective_from: "2026-01-01T00:00:00Z", effective_to: null, construction_requirements: ["enclosure", "power_supply"], test_protocols: [{ protocol_code: "P-SAFE", name: "Electric shock", mandatory: true, safety_critical: true, pass_threshold: 50, base_fee_cents: 5000 }, { protocol_code: "P-TEMP", name: "Temperature rise", mandatory: true, safety_critical: false, pass_threshold: 100, base_fee_cents: 10001 }, { protocol_code: "P-MARK", name: "Marking durability", mandatory: false, safety_critical: false, pass_threshold: 200, base_fee_cents: 10001 }] }
              as: CertificationBodyAdmin
              captures: { std_id: $.data.id }
            - call: "POST /certification/standards"
              payload: { category_code: "IT-AV", standard_code: "UL-3103", edition_label: "Ed. 1", effective_from: "2027-01-01T00:00:00Z", effective_to: null, construction_requirements: ["enclosure"], test_protocols: [{ protocol_code: "P-1", name: "p", mandatory: true, safety_critical: false, pass_threshold: 10, base_fee_cents: 1000 }] }
              as: CertificationBodyAdmin
              captures: { std_future: $.data.id }
          assert:
            - "Standard.${std_id}.status == ACTIVE (2026-01-01 <= now, no end)"
            - "Standard.${std_future}.status == UPCOMING (effective_from 2027-01-01 > now)"

      - name: project_create_client_supplied_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.CertificationProject.fields.status
          - endpoints.POST_/certification/projects
        distinguishing_aspect: "Client-supplied status/version/retest_count fields in the create payload are ignored: the project comes back STANDARD_SELECTED with version 1 and retest_count 0."
        test_recipe:
          setup: ["Clock at 2026-09-01. Standard, manufacturer, factory exist."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - &c_fac
              call: "POST /certification/manufacturers/${mfr_id}/factories"
              payload: { site_code: "SZ-1", country_code: "CN", jurisdiction_code: "CN-SZ" }
              as: CertificationBodyAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /certification/projects"
              payload: { factory_id: "${fac_id}", category_code: "IT-AV", standard_id: "${std_id}", product_model: "AC-100", status: "APPROVED", version: 99, retest_count: 7 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { proj_id: $.data.id }
          assert:
            - "response status 201"
            - "CertificationProject.${proj_id}.status == STANDARD_SELECTED (client-supplied APPROVED ignored)"
            - "CertificationProject.${proj_id}.version == 1 and retest_count == 0 (client-supplied values ignored)"

      - name: projects_list_paginates_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints.GET_/certification/projects
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three projects on file for the manufacturer, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; status=STANDARD_SELECTED filter returns all 3 while status=APPROVED returns 0."
        test_recipe:
          setup: ["Clock at 2026-09-01. Standard, manufacturer, factory exist; three projects created."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - &c_proj
              call: "POST /certification/projects"
              payload: { factory_id: "${fac_id}", category_code: "IT-AV", standard_id: "${std_id}", product_model: "AC-100" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - *c_proj
            - *c_proj
          trigger:
            - call: "GET /certification/projects"
              payload: { manufacturer_id: "${mfr_id}", limit: 2, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /certification/projects"
              payload: { manufacturer_id: "${mfr_id}", status: "APPROVED" }
              as: ComplianceOfficer
          assert:
            - "first page: 2 rows, total_count == 3, has_more == true"
            - "status filter STANDARD_SELECTED -> total_count == 3; status APPROVED -> total_count == 0 and empty data array"

      - name: factory_get_for_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/certification/factories/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND, not a null object."
        test_recipe:
          setup: ["Clock at 2026-09-01. Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /certification/factories/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 404 and error_id == ERR_NOT_FOUND"

      - name: manufacturer_invalid_revenue_tier_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Manufacturer.fields.annual_revenue_tier
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "annual_revenue_tier outside {MICRO, SMALL, STANDARD, ENTERPRISE} is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Clock at 2026-09-01."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /certification/manufacturers"
              payload: { legal_name: "Bad Tier Co", home_jurisdiction_code: "US-OSHA", annual_revenue_tier: "HUGE" }
              as: CertificationBodyAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 400 and error_id == ERR_INVALID_REQUEST"

      - name: construction_record_missing_required_slot_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_MISSING_REQUIRED_SLOT]
        distinguishing_aspect: "The standard requires slots [enclosure, power_supply]; a construction record covering only enclosure is rejected with ERR_MISSING_REQUIRED_SLOT."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical standard/manufacturer/factory/project exist."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
          trigger:
            - call: "POST /certification/projects/${proj_id}/construction-records"
              payload: { components: [{ slot: "enclosure", component_name: "BayBlend FR3010", material: "PC/ABS", part_number: "BB-FR3010", rating: "V-0" }], expected_project_version: "${proj_v}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_MISSING_REQUIRED_SLOT"
            - "no ConstructionRecord exists for the project (list is empty)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: project_decide_approval_valid_transition_sets_all_fields
        claim_type: valid_transition
        grounds:
          - state_machines.CertificationProject.EVALUATION_to_APPROVED
          - endpoints.POST_/certification/projects/{id}/decide
        distinguishing_aspect: "The full happy path drives STANDARD_SELECTED -> TESTING -> EVALUATION -> APPROVED; the decide response itself shows the final state (immediate consistency), and the certification appears via the project filter with issued_on/expires_on from the logical clock."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical project in EVALUATION (FROZEN record; INTACT sample with P-SAFE 60 PASS, P-TEMP 110 PASS)."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - &c_cr
              call: "POST /certification/projects/${proj_id}/construction-records"
              payload: { components: [{ slot: "enclosure", component_name: "BayBlend FR3010", material: "PC/ABS", part_number: "BB-FR3010", rating: "V-0" }, { slot: "power_supply", component_name: "MeanWell RS-25", material: "n/a", part_number: "MW-RS-25", rating: "100-240VAC" }], expected_project_version: "${proj_v}" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { cr_id: $.data.id }
            - &c_samp1
              call: "POST /certification/projects/${proj_id}/samples"
              payload: { serial_no: "S-1", condition: "INTACT" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { samp1: $.data.id }
            - &c_acc1
              call: "POST /certification/samples/${samp1}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-1"
            - &c_res1
              call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-SAFE", measured_value: 60 }
              as: TestEngineer
              as_user_id: "eng-1"
            - &c_res2
              call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 110 }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - &c_decide
              call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 12 }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { dec_status: $.data.status, dec_fee: $.data.fee_snapshot_cents }
            - call: "GET /certification/certifications"
              payload: { project_id: "${proj_id}" }
              as: ComplianceOfficer
              captures: { cert_id: $.data.0.id }
          assert:
            - "the decide response itself has status == APPROVED and fee_snapshot_cents == 13501 (immediate consistency, no re-read needed)"
            - "CertificationProject.${proj_id}.decided_by == rev-1 and decided_on == 2026-09-01T00:00:00Z"
            - "Certification.${cert_id}.status == ACTIVE, construction_record_revision == 1, listing_number matches ^E\\d{6}$"
            - "Certification.${cert_id}.issued_on == 2026-09-01T00:00:00Z and expires_on == 2027-09-01T00:00:00Z (validity_months 12)"

      - name: sample_rejected_is_terminal_results_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Sample.SUBMITTED_to_REJECTED
          - errors[ERR_SAMPLE_NOT_ACCEPTED]
        distinguishing_aspect: "REJECTED is terminal: recording a result on it fails with ERR_SAMPLE_NOT_ACCEPTED and appends nothing."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical project in STANDARD_SELECTED; sample S-1 submitted and REJECTED."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_samp1
            - call: "POST /certification/samples/${samp1}/triage"
              payload: { decision: "REJECT", note: "Cracked enclosure" }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-SAFE", measured_value: 60 }
              as: TestEngineer
              as_user_id: "eng-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_SAMPLE_NOT_ACCEPTED"
            - "Sample.${samp1}.status == REJECTED and results == [] (no append)"
            - "CertificationProject.${proj_id}.status == STANDARD_SELECTED (a REJECTED sample never starts TESTING)"

      - name: decide_on_rejected_project_returns_already_terminal
        claim_type: terminal_lockdown
        grounds:
          - state_machines.CertificationProject
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "A REJECTED project rejects any further decide with ERR_ALREADY_TERMINAL — a different error than deciding a non-EVALUATION project (ERR_PROJECT_NOT_EVALUABLE)."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical project in EVALUATION, then decided REJECTED."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "REJECTED" }
              as: CertificationReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED" }
              as: CertificationReviewer
              as_user_id: "rev-2"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"
            - "CertificationProject.${proj_id}.status == REJECTED still"

      - name: label_batch_void_twice_second_returns_already_terminal
        claim_type: invalid_transition
        grounds:
          - state_machines.LabelBatch.ISSUED_to_VOIDED
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "VOIDED is terminal: a second void of the same batch fails with ERR_ALREADY_TERMINAL and the license quota is not credited twice."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certified setup; license with batch B1 (qty 100) already voided once."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - *c_decide
            - &c_getcert
              call: "GET /certification/certifications"
              payload: { project_id: "${proj_id}" }
              as: ComplianceOfficer
              captures: { cert_id: $.data.0.id, cert_v: $.data.0.version }
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "STANDARD", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 100 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b1: $.data.id }
            - call: "POST /certification/label-batches/${b1}/void"
              payload: { reason: "Print defect" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
          trigger:
            - call: "POST /certification/label-batches/${b1}/void"
              payload: { reason: "Duplicate void attempt" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_ALREADY_TERMINAL"
            - "MarkLicense.${lic_id}.used_quantity == 0 (credited exactly once)"

      - name: certification_expires_via_clock_sweep_at_expiry_instant
        claim_type: valid_transition
        grounds:
          - state_machines.Certification.ACTIVE_to_EXPIRED
          - endpoints.POST_/certification/_clock/set_current_utc
        distinguishing_aspect: "An ACTIVE certification whose expires_on equals the new clock value transitions to EXPIRED during the sweep (<= comparison); before the sweep it is still ACTIVE."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certification issued with validity_months 1 -> expires_on 2026-10-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 1 }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - *c_getcert
          trigger:
            - call: "POST /certification/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CertificationBodyAdmin
            - call: "GET /certification/certifications/${cert_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Certification.${cert_id}.expires_on == 2026-10-01T00:00:00Z"
            - "after the clock reaches exactly expires_on: status == EXPIRED (boundary inclusive)"
            - "EXPIRED is terminal: a later suspend attempt returns ERR_ALREADY_TERMINAL"

      - name: suspended_certification_does_not_expire
        claim_type: invalid_transition
        grounds:
          - state_machines.Certification.ACTIVE_to_EXPIRED
          - state_machines.Certification.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "The expiry sweep applies only to ACTIVE certifications; a SUSPENDED one past its expires_on stays SUSPENDED."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certification (validity_months 1, expires 2026-10-01) suspended before expiry."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 1 }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - *c_getcert
            - call: "POST /certification/certifications/${cert_id}/suspend"
              payload: { reason: "Surveillance hold" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /certification/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: CertificationBodyAdmin
            - call: "GET /certification/certifications/${cert_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Certification.${cert_id}.status == SUSPENDED (not EXPIRED) even though now > expires_on"

      - name: inspection_overdue_via_sweep_then_late_completion
        claim_type: valid_transition
        grounds:
          - state_machines.FollowUpInspection.SCHEDULED_to_OVERDUE
          - state_machines.FollowUpInspection.OVERDUE_to_COMPLETED
        distinguishing_aspect: "The clock sweep marks a SCHEDULED inspection OVERDUE once now passes scheduled_for; an OVERDUE inspection can still be completed, with lateness observable via completed_on > scheduled_for."
        test_recipe:
          setup: ["Clock at 2026-09-01. Manufacturer + factory; inspection scheduled for 2026-09-10."]
          setup_api_calls:
            - *c_clock
            - *c_mfr
            - *c_fac
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-10T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /certification/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: CertificationBodyAdmin
          trigger:
            - call: "GET /certification/factories/${fac_id}/inspections"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /certification/inspections/${insp_id}/complete"
              payload: { findings: [] }
              as: FactoryInspector
              as_user_id: "insp-1"
          assert:
            - "after the sweep: FollowUpInspection.${insp_id}.status == OVERDUE"
            - "after completion: status == COMPLETED, result == CONFORMING, completed_on == 2026-09-11T00:00:00Z > scheduled_for 2026-09-10T00:00:00Z"

      - name: field_evaluation_failed_dimension_blocks_acceptance_dimension
        claim_type: invalid_transition
        grounds:
          - state_machines.FieldEvaluation
          - errors[ERR_FIELD_EVALUATION_NOT_PASSED]
        distinguishing_aspect: "Parallel dimensions on one entity: eval_status EVALUATED_FAIL is terminal for acceptance — an ACCEPT decision is rejected with ERR_FIELD_EVALUATION_NOT_PASSED while the acceptance dimension remains PENDING."
        test_recipe:
          setup: ["Clock at 2026-09-01. Jurisdictions J-E (accepts labels, NATIONAL) and J-DIR (accepts labels directly). Field evaluation FE with evaluating J-E and site J-DIR, evaluated FAIL."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - &c_jur_e
              call: "POST /certification/jurisdictions"
              payload: { jurisdiction_code: "US-OSHA", name: "OSHA NRTL", accepts_field_labels: true, accepts_reciprocity: false, reciprocity_sources: [], reciprocity_group: "NATIONAL" }
              as: CertificationBodyAdmin
              captures: { jur_e: $.data.id }
            - &c_jur_dir
              call: "POST /certification/jurisdictions"
              payload: { jurisdiction_code: "US-CPSC", name: "CPSC", accepts_field_labels: true, accepts_reciprocity: false, reciprocity_sources: [], reciprocity_group: "NATIONAL" }
              as: CertificationBodyAdmin
              captures: { jur_dir: $.data.id }
            - &c_fe
              call: "POST /certification/field-evaluations"
              payload: { standard_id: "${std_id}", evaluating_jurisdiction_id: "${jur_e}", site_jurisdiction_id: "${jur_dir}", equipment_description: "Installed conveyor controller, never certified", site_address: "12 Industrial Way, Dayton OH" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { fe_id: $.data.id }
            - call: "POST /certification/field-evaluations/${fe_id}/evaluate"
              payload: { outcome: "FAIL", notes: "Missing guarding interlock" }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/field-evaluations/${fe_id}/decide-acceptance"
              payload: { decision: "ACCEPT" }
              as: AHJAuthority
              as_user_id: "${jur_dir}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_FIELD_EVALUATION_NOT_PASSED"
            - "FieldEvaluation.${fe_id}.eval_status == EVALUATED_FAIL and acceptance_status == PENDING and label_issued_on is null"

  # ===========================================================================
  - section: calculations
    instances:

      - name: serial_range_allocation_sequential_across_batches
        claim_type: correct_result
        grounds:
          - calculations.serial_range_allocation
          - entities.LabelBatch.fields.serial_start
          - entities.LabelBatch.fields.serial_end
        distinguishing_aspect: "Serial ranges allocate contiguously across batches of one license: batch 100 -> 1..100, batch 250 -> 101..350; serial_prefix is listing_number + '-' + label_type initial."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical certified setup; license L (STANDARD_QUOTA, 11000)."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - *c_decide
            - *c_getcert
            - call: "POST /certification/certifications/${cert_id}/mark-licenses"
              payload: { label_type: "HOLOGRAM", declared_annual_volume: 10000 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 100 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b1: $.data.id }
            - call: "POST /certification/mark-licenses/${lic_id}/label-batches"
              payload: { quantity: 250 }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { b2: $.data.id }
          assert:
            - "LabelBatch.${b1}.serial_start == 1 and serial_end == 100"
            - "LabelBatch.${b2}.serial_start == 101 and serial_end == 350"
            - "MarkLicense.${lic_id}.used_quantity == 350 and next_serial == 351 and status == ACTIVE"
            - "MarkLicense.${lic_id}.serial_prefix == Certification.${cert_id}.listing_number + '-H'"

      - name: reciprocity_acceptance_one_hop_group_match_vs_mismatch
        claim_type: correct_result
        grounds:
          - calculations.reciprocity_acceptance
          - errors[ERR_RECIPROCITY_NOT_GRANTED]
        distinguishing_aspect: "The reciprocity rule is one hop with group equality: a site jurisdiction in group NATIONAL accepting sources ['US-OSHA'] accepts an evaluation from US-OSHA (NATIONAL), while an otherwise identical site jurisdiction in group BILATERAL_EU rejects it with ERR_RECIPROCITY_NOT_GRANTED; a directly-accepting AHJ needs no reciprocity."
        test_recipe:
          setup: ["Clock at 2026-09-01. Jurisdictions: J-E (US-OSHA, accepts labels, NATIONAL), J-RECIP (CA-SCC, no direct acceptance, reciprocity from [US-OSHA], NATIONAL), J-MIS (DE-LGA, reciprocity from [US-OSHA], BILATERAL_EU), J-DIR (US-CPSC, direct). Three passing field evaluations, one per site jurisdiction."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_jur_e
            - *c_jur_dir
            - call: "POST /certification/jurisdictions"
              payload: { jurisdiction_code: "CA-SCC", name: "SCC Canada", accepts_field_labels: false, accepts_reciprocity: true, reciprocity_sources: ["US-OSHA"], reciprocity_group: "NATIONAL" }
              as: CertificationBodyAdmin
              captures: { jur_recip: $.data.id }
            - call: "POST /certification/jurisdictions"
              payload: { jurisdiction_code: "DE-LGA", name: "LGA Bayern", accepts_field_labels: false, accepts_reciprocity: true, reciprocity_sources: ["US-OSHA"], reciprocity_group: "BILATERAL_EU" }
              as: CertificationBodyAdmin
              captures: { jur_mis: $.data.id }
            - call: "POST /certification/field-evaluations"
              payload: { standard_id: "${std_id}", evaluating_jurisdiction_id: "${jur_e}", site_jurisdiction_id: "${jur_recip}", equipment_description: "Pump controller A", site_address: "1 Rue King, Sherbrooke QC" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { fe_r: $.data.id }
            - call: "POST /certification/field-evaluations"
              payload: { standard_id: "${std_id}", evaluating_jurisdiction_id: "${jur_e}", site_jurisdiction_id: "${jur_mis}", equipment_description: "Pump controller B", site_address: "5 Werkstrasse, Munich" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { fe_m: $.data.id }
            - *c_fe
            - call: "POST /certification/field-evaluations/${fe_r}/evaluate"
              payload: { outcome: "PASS" }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/field-evaluations/${fe_m}/evaluate"
              payload: { outcome: "PASS" }
              as: TestEngineer
              as_user_id: "eng-1"
            - call: "POST /certification/field-evaluations/${fe_id}/evaluate"
              payload: { outcome: "PASS" }
              as: TestEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /certification/field-evaluations/${fe_r}/decide-acceptance"
              payload: { decision: "ACCEPT", basis: "Reciprocity: SCC recognizes US-OSHA NRTL" }
              as: AHJAuthority
              as_user_id: "${jur_recip}"
            - call: "POST /certification/field-evaluations/${fe_m}/decide-acceptance"
              payload: { decision: "ACCEPT" }
              as: AHJAuthority
              as_user_id: "${jur_mis}"
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/field-evaluations/${fe_id}/decide-acceptance"
              payload: { decision: "ACCEPT" }
              as: AHJAuthority
              as_user_id: "${jur_dir}"
          assert:
            - "FieldEvaluation.${fe_r}.acceptance_status == ACCEPTED and label_issued_on == 2026-09-01T00:00:00Z (one-hop reciprocity, groups match)"
            - "the J-MIS call is rejected with error_id == ERR_RECIPROCITY_NOT_GRANTED (group mismatch defeats reciprocity) and its acceptance_status stays PENDING"
            - "FieldEvaluation.${fe_id}.acceptance_status == ACCEPTED via direct acceptance (no reciprocity consulted)"

      - name: inspection_interval_twelve_month_tier_for_clean_factory
        claim_type: correct_result
        grounds:
          - calculations.inspection_interval_derived
          - entities.Factory.fields.next_inspection_due_on
        distinguishing_aspect: "A CONFORMING inspection keeps the score at 100 (>= 90), deriving the 12-month interval: next_inspection_due_on == completed_on + 12 months."
        test_recipe:
          setup: ["Clock at 2026-09-01. Manufacturer + factory; inspection completed CONFORMING on 2026-09-01."]
          setup_api_calls:
            - *c_clock
            - *c_mfr
            - *c_fac
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /certification/inspections/${insp_id}/complete"
              payload: { findings: [] }
              as: FactoryInspector
              as_user_id: "insp-1"
          trigger:
            - call: "GET /certification/factories/${fac_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Factory.${fac_id}.conformity_score == 100 and conformity_regime == STANDARD"
            - "Factory.${fac_id}.last_inspection_completed_on == 2026-09-01T00:00:00Z"
            - "Factory.${fac_id}.next_inspection_due_on == 2027-09-01T00:00:00Z (12-month tier)"

      - name: evaluation_gate_input_set_filtering
        claim_type: input_set_filtering
        grounds:
          - calculations.evaluation_readiness
        excluded_because:
          difficulty_instance: project_evaluation_gate_depends_on_sample_states
          rationale: "REJECTED/SUBMITTED samples never contribute to the readiness aggregate is exactly the failure path asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or state check runs."
        test_recipe:
          setup: ["Clock at 2026-09-01. Database contents irrelevant."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /certification/projects"
              payload: {}
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 401 and error_id == ERR_UNAUTHENTICATED"

      - name: manufacturer_rep_cannot_create_standard_returns_unauthorized
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED_ROLE]
          - roles.CertificationBodyAdmin
        distinguishing_aspect: "Standards registration is exclusive to CertificationBodyAdmin; the same well-formed payload from a ManufacturerRep is 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Clock at 2026-09-01. Manufacturer exists."]
          setup_api_calls:
            - *c_clock
            - *c_mfr
          trigger:
            - call: "POST /certification/standards"
              payload: { category_code: "IT-AV", standard_code: "UL-9999", edition_label: "Ed. 1", effective_from: "2026-01-01T00:00:00Z", effective_to: null, construction_requirements: ["enclosure"], test_protocols: [{ protocol_code: "P-1", name: "p", mandatory: true, safety_critical: false, pass_threshold: 10, base_fee_cents: 1000 }] }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 403 and error_id == ERR_UNAUTHORIZED_ROLE"

      - name: manufacturer_rep_cannot_touch_other_manufacturers_project_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_FORBIDDEN]
          - roles.ManufacturerRep
        distinguishing_aspect: "Entity-backed ownership: manufacturer B's rep submitting a sample to manufacturer A's project is 403 ERR_FORBIDDEN, not 404 — the resource exists but is out of scope."
        test_recipe:
          setup: ["Clock at 2026-09-01. Standard, manufacturer A with factory and project; manufacturer B exists."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - call: "POST /certification/manufacturers"
              payload: { legal_name: "Beacon Power Co", home_jurisdiction_code: "US-OSHA", annual_revenue_tier: "STANDARD" }
              as: CertificationBodyAdmin
              captures: { mfr2_id: $.data.id }
          trigger:
            - call: "POST /certification/projects/${proj_id}/samples"
              payload: { serial_no: "SX-1", condition: "INTACT" }
              as: ManufacturerRep
              as_user_id: "${mfr2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 403 and error_id == ERR_FORBIDDEN"
            - "no sample is created on CertificationProject.${proj_id} (samples list is empty)"

      - name: unknown_protocol_code_in_results_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_UNKNOWN_PROTOCOL_CODE]
        distinguishing_aspect: "A result for protocol_code P-NOPE, absent from the pinned standard's test_protocols, is rejected 422 and appends nothing."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical project with an ACCEPTED INTACT sample (TESTING)."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_samp1
            - *c_acc1
          trigger:
            - call: "POST /certification/samples/${samp1}/results"
              payload: { protocol_code: "P-NOPE", measured_value: 10 }
              as: TestEngineer
              as_user_id: "eng-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_UNKNOWN_PROTOCOL_CODE"
            - "Sample.${samp1}.results == [] and status == ACCEPTED (first-result flip to TESTED did not happen)"

      - name: segregation_of_duties_reviewer_who_recorded_results_cannot_decide
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The deciding reviewer's X-User-ID (person eng-1 acting in the CertificationReviewer role) matches a results[].recorded_by on the project's sample — the SoD control rejects the decision even though the role is correct."
        test_recipe:
          setup: ["Clock at 2026-09-01. Canonical project in EVALUATION; all results on S-1 recorded by eng-1."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
          trigger:
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 12 }
              as: CertificationReviewer
              as_user_id: "eng-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/projects/${proj_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 12 }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { dec_status: $.data.status }
          assert:
            - "the eng-1 decide fails with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "the identical decide with a clean reviewer (rev-1) then succeeds: status == APPROVED — SoD keys on X-User-ID, not the role"

      - name: suspended_manufacturer_blocked_from_new_projects
        claim_type: conditional_validation
        grounds:
          - validations[priority=6]
          - errors[ERR_MANUFACTURER_SUSPENDED]
          - state_machines.Manufacturer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Project creation is conditionally blocked by the manufacturer's status: ACTIVE allows it, SUSPENDED rejects with ERR_MANUFACTURER_SUSPENDED."
        test_recipe:
          setup: ["Clock at 2026-09-01. Standard, manufacturer, factory exist; the manufacturer is then suspended."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - call: "POST /certification/manufacturers/${mfr_id}/suspend"
              payload: { reason: "Misuse of mark investigation" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /certification/projects"
              payload: { factory_id: "${fac_id}", category_code: "IT-AV", standard_id: "${std_id}", product_model: "AC-100" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_MANUFACTURER_SUSPENDED"
            - "Manufacturer.${mfr_id}.status == SUSPENDED and suspension_reason == 'Misuse of mark investigation'"

      - name: category_standard_mismatch_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_CATEGORY_STANDARD_MISMATCH]
        distinguishing_aspect: "A project naming category_code LIGHTING against an IT-AV standard is rejected 422 — the category claim must agree with the selected standard."
        test_recipe:
          setup: ["Clock at 2026-09-01. Standard IT-AV, manufacturer, factory exist."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
          trigger:
            - call: "POST /certification/projects"
              payload: { factory_id: "${fac_id}", category_code: "LIGHTING", standard_id: "${std_id}", product_model: "AC-100" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_CATEGORY_STANDARD_MISMATCH"

      - name: retired_standard_blocks_new_projects
        claim_type: conditional_validation
        grounds:
          - validations[priority=6]
          - errors[ERR_STANDARD_NOT_ACTIVE]
          - entities.Standard.fields.status
        distinguishing_aspect: "A standard whose window ended before the current logical time computes RETIRED, and project creation against it fails with ERR_STANDARD_NOT_ACTIVE."
        test_recipe:
          setup: ["Clock at 2026-09-01. Standard OLD with window [2026-01-01, 2026-08-01) — already RETIRED at creation; manufacturer and factory exist."]
          setup_api_calls:
            - *c_clock
            - call: "POST /certification/standards"
              payload: { category_code: "IT-AV", standard_code: "UL-60065", edition_label: "Ed. 8", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", construction_requirements: ["enclosure"], test_protocols: [{ protocol_code: "P-1", name: "p", mandatory: true, safety_critical: false, pass_threshold: 10, base_fee_cents: 1000 }] }
              as: CertificationBodyAdmin
              captures: { std_old: $.data.id }
            - *c_mfr
            - *c_fac
          trigger:
            - call: "POST /certification/projects"
              payload: { factory_id: "${fac_id}", category_code: "IT-AV", standard_id: "${std_old}", product_model: "AC-100" }
              as: ManufacturerRep
              as_user_id: "${mfr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Standard.${std_old}.status == RETIRED (window ended 2026-08-01 < now)"
            - "error_id == ERR_STANDARD_NOT_ACTIVE"

      - name: inspection_scheduled_in_past_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_INSPECTION_DATE_PAST]
        distinguishing_aspect: "scheduled_for before the current logical time is rejected 422 ERR_INSPECTION_DATE_PAST; scheduled_for exactly equal to now is accepted."
        test_recipe:
          setup: ["Clock at 2026-09-01. Manufacturer + factory."]
          setup_api_calls:
            - *c_clock
            - *c_mfr
            - *c_fac
          trigger:
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-08-31T23:59:59Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /certification/factories/${fac_id}/inspections"
              payload: { scheduled_for: "2026-09-01T00:00:00Z" }
              as: FactoryInspector
              as_user_id: "insp-1"
              captures: { insp_ok: $.data.id }
          assert:
            - "the past-dated call -> error_id == ERR_INSPECTION_DATE_PAST"
            - "the exactly-now call -> 201 (>= comparison), FollowUpInspection.${insp_ok}.status == SCHEDULED"

      - name: finding_certification_mismatch_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_FINDING_CERTIFICATION_MISMATCH]
        distinguishing_aspect: "A finding recorded at factory A that names factory B's certification is rejected 422 — findings may only reference certifications tied to the inspected factory."
        test_recipe:
          setup: ["Clock at 2026-09-01. Two manufacturers each with a factory and an ACTIVE certification (C-A on factory A, C-B on factory B)."]
          setup_api_calls:
            - *c_clock
            - *c_std
            - *c_mfr
            - *c_fac
            - *c_proj
            - *c_cr
            - *c_samp1
            - *c_acc1
            - *c_res1
            - *c_res2
            - *c_decide
            - *c_getcert
            - call: "POST /certification/manufacturers"
              payload: { legal_name: "Beacon Power Co", home_jurisdiction_code: "US-OSHA", annual_revenue_tier: "STANDARD" }
              as: CertificationBodyAdmin
              captures: { mfr2_id: $.data.id }
            - call: "POST /certification/manufacturers/${mfr2_id}/factories"
              payload: { site_code: "GZ-1", country_code: "CN", jurisdiction_code: "CN-GZ" }
              as: CertificationBodyAdmin
              captures: { fac2_id: $.data.id }
            - call: "POST /certification/projects"
              payload: { factory_id: "${fac2_id}", category_code: "IT-AV", standard_id: "${std_id}", product_model: "BP-9" }
              as: ManufacturerRep
              as_user_id: "${mfr2_id}"
              captures: { proj2_id: $.data.id, proj2_v: $.data.version }
            - call: "POST /certification/projects/${proj2_id}/construction-records"
              payload: { components: [{ slot: "enclosure", component_name: "BayBlend FR3010", material: "PC/ABS", part_number: "BB-FR3010", rating: "V-0" }, { slot: "power_supply", component_name: "MeanWell RS-25", material: "n/a", part_number: "MW-RS-25", rating: "100-240VAC" }], expected_project_version: "${proj2_v}" }
              as: ManufacturerRep
              as_user_id: "${mfr2_id}"
            - call: "POST /certification/projects/${proj2_id}/samples"
              payload: { serial_no: "S-1", condition: "INTACT" }
              as: ManufacturerRep
              as_user_id: "${mfr2_id}"
              captures: { samp2: $.data.id }
            - call: "POST /certification/samples/${samp2}/triage"
              payload: { decision: "ACCEPT" }
              as: TestEngineer
              as_user_id: "eng-2"
            - call: "POST /certification/samples/${samp2}/results"
              payload: { protocol_code: "P-SAFE", measured_value: 60 }
              as: TestEngineer
              as_user_id: "eng-2"
            - call: "POST /certification/samples/${samp2}/results"
              payload: { protocol_code: "P-TEMP", measured_value: 110 }
              as: TestEngineer
              as_user_id: "eng-2"
            - call: "POST /certification/projects/${proj2_id}/decide"
              payload: { outcome: "APPROVED", validity_months: 12 }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "GET /certification/certifications"
              payload: { project_id: "${proj2_id}" }
              as: ComplianceOfficer
              captures: { cert2_id: $.data.0.id }
            - call: "POST /certification/factories/${fac_id}/inspections"
