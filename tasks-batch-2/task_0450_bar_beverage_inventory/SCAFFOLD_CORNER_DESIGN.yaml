scaffold_corner_design:

  # =====================================================================
  # SECTION: entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - 'entities.Product'
          - 'endpoints.POST./products'
        distinguishing_aspect: "POST /products with all required fields returns 201 and a Product with server-minted id, status ACTIVE, on_hand_units 0, needs_reorder false, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "GIN-CR", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { pid: $.data.id }
          assert:
            - "response status == 201"
            - "Product.${pid}.status == ACTIVE"
            - "Product.${pid}.on_hand_units == 0"
            - "Product.${pid}.needs_reorder == false"
            - "Product.${pid}.version == 1"

      - name: create_product_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - 'entities.Product.fields.container_type'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "POST /products omitting container_type returns ERR_INVALID_REQUEST (400); container_type has source input and no default."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "GIN-MR", name: "Gin", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - 'entities.Product.fields.container_type'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "container_type outside {BOTTLE, KEG} (e.g., CAN) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "GIN-EN", name: "Gin", container_type: "CAN", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: product_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - 'entities.Product.fields.case_pack'
          - 'entities.Product.fields.density_g_per_ml'
          - 'entities.Product.fields.empty_container_weight_g'
        distinguishing_aspect: "Omitting case_pack/density_g_per_ml/empty_container_weight_g applies defaults 1, 1.0, 0 respectively on the created Product."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "GIN-DF", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { pid: $.data.id }
          assert:
            - "Product.${pid}.case_pack == 1"
            - "Product.${pid}.density_g_per_ml == 1.0"
            - "Product.${pid}.empty_container_weight_g == 0"

      - name: get_product_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - 'entities.Product'
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "GET /products/{id} for an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: list_products_paginated_envelope
        claim_type: Listing
        grounds:
          - 'entities.Product'
          - 'endpoints.GET./products'
        distinguishing_aspect: "GET /products returns an array response with pagination fields total_count and has_more; default limit 10."
        test_recipe:
          setup: ["two products created"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-L1", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
            - call: "POST /products"
              payload: { sku: "P-L2", name: "B", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 200 }
              as: InventoryManager
          trigger:
            - call: "GET /products"
              payload: { limit: 10, offset: 0 }
              as: InventoryManager
          assert:
            - "response status == 200"
            - "response total_count == 2 and has_more == false"

      - name: duplicate_sku_on_active_product_rejected
        claim_type: Type Constraints
        grounds:
          - 'validations[priority=11]'
          - 'errors[ERR_DUPLICATE_SKU]'
        distinguishing_aspect: "Creating a second ACTIVE Product with the same sku returns ERR_DUPLICATE_SKU (409)."
        test_recipe:
          setup: ["one ACTIVE product with sku GIN-DUP"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GIN-DUP", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
          trigger:
            - call: "POST /products"
              payload: { sku: "GIN-DUP", name: "Gin 2", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2100 }
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_DUPLICATE_SKU"

      - name: archived_product_frees_sku_for_reuse
        claim_type: Immutability
        grounds:
          - 'entities.Product.fields.status'
          - 'endpoints.POST./products/{id}/archive'
        distinguishing_aspect: "After archiving a product, the same sku may be reused by a new ACTIVE product because uniqueness excludes ARCHIVED status."
        test_recipe:
          setup: ["product GIN-RE created then archived"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GIN-RE", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/archive"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /products"
              payload: { sku: "GIN-RE", name: "Gin v2", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2100 }
              as: InventoryManager
              captures: { pid2: $.data.id }
          assert:
            - "response status == 201"
            - "Product.${pid2}.sku == GIN-RE and Product.${pid2}.status == ACTIVE"

  # =====================================================================
  # SECTION: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: submit_already_submitted_po_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - 'state_machines.PurchaseOrder.DRAFT_to_SUBMITTED'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Submitting a PO already in SUBMITTED returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["PO with one line, submitted once"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-S1", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${pid}", ordered_qty: 1, unit_cost_cents: 100 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
          trigger:
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: submit_po_with_no_lines_rejected
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.PurchaseOrder.DRAFT_to_SUBMITTED'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Submitting a DRAFT PO that has zero POLines violates the '>= 1 POLine' precondition and is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["empty DRAFT PO"]
          setup_api_calls:
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: cancel_received_po_rejected_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - 'state_machines.PurchaseOrder.SUBMITTED_to_CANCELLED'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Cancelling a PO that has advanced to RECEIVED (via a posted invoice) is not an allowed transition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["PO submitted then an invoice posted advances it to RECEIVED"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-CR", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${pid}", ordered_qty: 4, unit_cost_cents: 100 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-CR", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${pid}", received_qty: 4, unit_cost_cents: 100 }
              as: PurchasingAgent
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
          trigger:
            - call: "POST /purchase-orders/${po_id}/cancel"
              payload: {}
              as: PurchasingAgent
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: finalize_terminal_count_session_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - 'state_machines.CountSession.OPEN_to_FINALIZED'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Finalizing a CountSession already FINALIZED (terminal) returns ERR_INVALID_STATE (409); the state precondition is checked before OCC, so the state error wins."
        test_recipe:
          setup: ["a finalized count session with one line"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-FT", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /count-sessions"
              payload: { label: "C", counted_at: "2026-02-01T00:00:00Z" }
              as: InventoryManager
              captures: { cs_id: $.data.id, cs_v: $.data.version }
            - call: "POST /count-sessions/${cs_id}/count-lines"
              payload: { product_id: "${pid}", count_method: "UNITS", counted_units: 1, expected_count_session_version: "${cs_v}" }
              as: InventoryManager
              captures: { cs_v2: $.data.version }
            - call: "POST /count-sessions/${cs_id}/finalize"
              payload: { expected_count_session_version: "${cs_v2}" }
              as: InventoryManager
              captures: { cs_v3: $.data.version }
          trigger:
            - call: "POST /count-sessions/${cs_id}/finalize"
              payload: { expected_count_session_version: "${cs_v3}" }
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: revise_recipe_blocked_by_active_menu_item
        claim_type: guarded transitions
        grounds:
          - 'state_machines.RecipeSpec.PUBLISHED_to_DRAFT'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Revising a PUBLISHED recipe while an ACTIVE MenuItem references it violates the cross-entity precondition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["published recipe referenced by an ACTIVE menu item"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-RV", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 1000 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /recipes"
              payload: { name: "Sour" }
              as: BarManager
              captures: { rec_id: $.data.id }
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${pid}", pour_ml: 45 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/publish"
              payload: {}
              as: BarManager
            - call: "POST /menu-items"
              payload: { recipe_id: "${rec_id}", menu_price_cents: 1200 }
              as: BarManager
          trigger:
            - call: "POST /recipes/${rec_id}/revise"
              payload: {}
              as: BarManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: new_count_session_starts_open_version_one
        claim_type: Initial State
        grounds:
          - 'state_machines.CountSession'
          - 'entities.CountSession.fields.status'
        distinguishing_aspect: "A freshly created CountSession has status OPEN and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /count-sessions"
              payload: { label: "Fresh", counted_at: "2026-02-01T00:00:00Z" }
              as: InventoryManager
              captures: { cs_id: $.data.id }
          assert:
            - "CountSession.${cs_id}.status == OPEN"
            - "CountSession.${cs_id}.version == 1"

      - name: delist_menu_item_then_excluded_from_engineering
        claim_type: Valid Transition
        grounds:
          - 'state_machines.MenuItem.ACTIVE_to_DELISTED'
          - 'entities.MenuItem.fields.status'
        distinguishing_aspect: "Delisting an ACTIVE MenuItem moves it to DELISTED (terminal); the menu-engineering universe then has only the remaining ACTIVE item, which classifies STAR as the sole item (pop_index 1.0 >= 0.7, margin >= its own avg)."
        test_recipe:
          setup: ["two published recipes; menu items A and B both ACTIVE with sales; B delisted"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "RUM-DL", name: "Rum", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 1800 }
              as: InventoryManager
              captures: { rum_id: $.data.id }
            - call: "POST /recipes"
              payload: { name: "Daiq DL" }
              as: BarManager
              captures: { recA_id: $.data.id }
            - call: "POST /recipes/${recA_id}/lines"
              payload: { product_id: "${rum_id}", pour_ml: 60 }
              as: BarManager
            - call: "POST /recipes/${recA_id}/publish"
              payload: {}
              as: BarManager
            - call: "POST /recipes"
              payload: { name: "Daiq DL2" }
              as: BarManager
              captures: { recB_id: $.data.id }
            - call: "POST /recipes/${recB_id}/lines"
              payload: { product_id: "${rum_id}", pour_ml: 60 }
              as: BarManager
            - call: "POST /recipes/${recB_id}/publish"
              payload: {}
              as: BarManager
            - call: "POST /menu-items"
              payload: { recipe_id: "${recA_id}", menu_price_cents: 1300 }
              as: BarManager
              captures: { miA_id: $.data.id }
            - call: "POST /menu-items"
              payload: { recipe_id: "${recB_id}", menu_price_cents: 800 }
              as: BarManager
              captures: { miB_id: $.data.id }
            - call: "POST /menu-items/${miA_id}/record-sales"
              payload: { quantity: 50, sold_at: "2026-03-05T00:00:00Z" }
              as: BarManager
            - call: "POST /menu-items/${miB_id}/record-sales"
              payload: { quantity: 50, sold_at: "2026-03-05T00:00:00Z" }
              as: BarManager
          trigger:
            - call: "POST /menu-items/${miB_id}/delist"
              payload: {}
              as: BarManager
          assert:
            - "MenuItem.${miB_id}.status == DELISTED"
            - "MenuItem.${miB_id}.version == 2"

  # =====================================================================
  # SECTION: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: weight_based_closing_units_correct
        claim_type: Correct Result
        grounds:
          - 'calculations.resolve_closing_units'
          - 'entities.CountLine.fields.closing_units'
        distinguishing_aspect: "A WEIGHT count line on a 750 mL gin bottle (empty 500 g, density 0.94) at gross 980 g resolves remaining_ml 510.6 and closing_units 0.681 at finalize."
        test_recipe:
          setup: ["gin product empty 500 density 0.94; OPEN count session with a WEIGHT line gross 980"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GIN-WT", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000, empty_container_weight_g: 500, density_g_per_ml: 0.94 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /count-sessions"
              payload: { label: "W", counted_at: "2026-02-10T00:00:00Z" }
              as: InventoryManager
              captures: { cs_id: $.data.id, cs_v: $.data.version }
            - call: "POST /count-sessions/${cs_id}/count-lines"
              payload: { product_id: "${pid}", count_method: "WEIGHT", gross_weight_g: 980, expected_count_session_version: "${cs_v}" }
              as: InventoryManager
              captures: { cs_v2: $.data.version }
          trigger:
            - call: "POST /count-sessions/${cs_id}/finalize"
              payload: { expected_count_session_version: "${cs_v2}" }
              as: InventoryManager
          assert:
            - "the gin CountLine closing_units == 0.681"
            - "Product.${pid}.on_hand_units == 0.681"

      - name: pour_cost_pct_computed_on_menu_item
        claim_type: Computed Fields
        grounds:
          - 'calculations.compute_recipe_cost'
          - 'entities.MenuItem.fields.pour_cost_pct'
        distinguishing_aspect: "A MenuItem at price 1300 on a recipe whose recipe_cost_cents is 295 has pour_cost_pct 22.69."
        test_recipe:
          setup: ["published 3-line Margarita with recipe_cost 295"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "TEQ-PC", name: "Tequila", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2495 }
              as: InventoryManager
              captures: { teq_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "COIN-PC", name: "Cointreau", container_type: "BOTTLE", container_volume_ml: 700, unit_cost_cents: 3200 }
              as: InventoryManager
              captures: { coin_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "LIME-PC", name: "Lime", container_type: "BOTTLE", container_volume_ml: 1000, unit_cost_cents: 600 }
              as: InventoryManager
              captures: { lime_id: $.data.id }
            - call: "POST /recipes"
              payload: { name: "Marg PC" }
              as: BarManager
              captures: { rec_id: $.data.id }
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${teq_id}", pour_ml: 50 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${coin_id}", pour_ml: 25 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${lime_id}", pour_ml: 25 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/publish"
              payload: {}
              as: BarManager
          trigger:
            - call: "POST /menu-items"
              payload: { recipe_id: "${rec_id}", menu_price_cents: 1300 }
              as: BarManager
              captures: { mi_id: $.data.id }
          assert:
            - "MenuItem.${mi_id}.pour_cost_pct == 22.69"

      - name: ordered_total_computed_on_submit
        claim_type: Correct Result
        grounds:
          - 'entities.PurchaseOrder.fields.ordered_total_cents'
          - 'state_machines.PurchaseOrder.DRAFT_to_SUBMITTED'
        distinguishing_aspect: "Submitting a PO with lines 12@2495 and 6@3200 sets ordered_total_cents to 49140."
        test_recipe:
          setup: ["DRAFT PO with two lines"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "TEQ-OT", name: "Tequila", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2400 }
              as: InventoryManager
              captures: { teq_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "COIN-OT", name: "Cointreau", container_type: "BOTTLE", container_volume_ml: 700, unit_cost_cents: 3000 }
              as: InventoryManager
              captures: { coin_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${teq_id}", ordered_qty: 12, unit_cost_cents: 2495 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${coin_id}", ordered_qty: 6, unit_cost_cents: 3200 }
              as: PurchasingAgent
          trigger:
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
          assert:
            - "PurchaseOrder.${po_id}.ordered_total_cents == 49140"
            - "PurchaseOrder.${po_id}.status == SUBMITTED"

      - name: menu_engineering_classifies_star_and_dog
        claim_type: weighted_scoring
        grounds:
          - 'calculations.menu_engineering'
          - 'entities.MenuItem.fields.menu_class'
        distinguishing_aspect: "Two ACTIVE menu items (A sold 80 margin 1005, B sold 20 margin 656; pop_threshold 0.35, avg_margin 830.5): A classifies STAR, B classifies DOG."
        test_recipe:
          setup: ["two published recipes; menu items A(price 1300, recipe cost 295) sold 80, B(price 800, recipe cost 144) sold 20"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "TEQ-ME", name: "Tequila", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2495 }
              as: InventoryManager
              captures: { teq_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "COIN-ME", name: "Cointreau", container_type: "BOTTLE", container_volume_ml: 700, unit_cost_cents: 3200 }
              as: InventoryManager
              captures: { coin_id: $.data.id }
            - call: "POST /products"
