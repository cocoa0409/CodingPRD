              as: CarrierAdmin
              captures: { dev1_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "CS9b", vehicle_id: "${veh2_id}" }
              as: CarrierAdmin
              captures: { dev2_id: $.data.id }
