      - name: discovery_axis_responses_are_rejected_out_of_order
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DISCOVERY_NOT_PENDING]
          - errors[ERR_DISCOVERY_ALREADY_RECEIVED]
          - errors[ERR_CASE_HAS_NO_RELEASED_REQUEST]
          - state_machines.Case[discovery_status]
          - calculations.capa_due_and_escalation
        distinguishing_aspect: "The discovery axis has three distinct refusals that all sit on the same two endpoints: responding while the axis is still NONE is not-pending, logging a second request while it is RECEIVED is already-received, and FULFILL specifically requires a RELEASED examination request while DENY does not - so the same case that cannot be fulfilled can still be lawfully denied with a note."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Case C1 (OTHER -> P3_ROUTINE) ACCEPTED with one BIOLOGICAL item; no examination request is ever created, so released_examination_request_count stays 0."
            - "Hand-executed: discovery_due_utc = 2026-08-01T00:00:00Z + DISCOVERY_RESPONSE_DAYS (30) days == 2026-08-31T00:00:00Z. The DENY lands at clock 2026-08-01, which is not after the due instant, so no DEADLINE_MISS Nonconformance is raised."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0504", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed envelope", item_type: "BIOLOGICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
          trigger:
            - call: "POST /lab/cases/${c1}/discovery-response"
              payload: { decision: "FULFILL" }
              as: CaseManager
              captures: { e_not_pending: $.data.error_id }
            - call: "POST /lab/cases/${c1}/discovery-request"
              payload: { discovery_requesting_party: "Office of the Public Defender" }
              as: CaseManager
              captures: { d_status: $.data.discovery_status, d_due: $.data.discovery_due_utc }
            - call: "POST /lab/cases/${c1}/discovery-request"
              payload: { discovery_requesting_party: "Private counsel for the co-defendant" }
              as: CaseManager
              captures: { e_already: $.data.error_id }
            - call: "POST /lab/cases/${c1}/discovery-response"
              payload: { decision: "FULFILL" }
              as: CaseManager
              captures: { e_no_release: $.data.error_id }
            - call: "POST /lab/cases/${c1}/discovery-response"
              payload: { decision: "DENY", response_note: "No analytical report exists; nothing responsive to produce" }
              as: CaseManager
              captures: { final_discovery: $.data.discovery_status }
            - call: "GET /lab/nonconformances"
              payload: { source: "DEADLINE_MISS" }
              as: QualityManager
          assert:
            - "first trigger: HTTP status == 409 and ${e_not_pending} == ERR_DISCOVERY_NOT_PENDING and Case.${c1}.discovery_status == NONE"
            - "second trigger: HTTP status == 200, ${d_status} == RECEIVED and ${d_due} == 2026-08-31T00:00:00Z"
            - "third trigger: HTTP status == 409 and ${e_already} == ERR_DISCOVERY_ALREADY_RECEIVED"
            - "Case.${c1}.discovery_requesting_party == Office of the Public Defender (the second request did not overwrite it)"
            - "fourth trigger: HTTP status == 409 and ${e_no_release} == ERR_CASE_HAS_NO_RELEASED_REQUEST and Case.${c1}.released_examination_request_count == 0"
            - "fifth trigger: HTTP status == 200 and ${final_discovery} == DENIED"
            - "Case.${c1}.workflow_status == ACCEPTED throughout (the discovery axis moved on its own)"
            - "the DEADLINE_MISS listing returns total_count == 0"

