              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_v: $.data.version }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${inq_v}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id }
            - call: "POST /proposal-options"
              payload: { proposal_id: "${pr}", speaker_id: "${sp}", quoted_fee_cents: 1275000, rank_no: 1, travel_allowance_cents: 70000 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { opt: $.data.id }
            - call: "POST /proposals/${pr}/present"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
          trigger:
            - call: "POST /proposals/${pr}/request-revision"
              payload: { revision_note: "cheaper option please" }
              as: Client
              as_user_id: "${cl}"
              captures: { rc1: $.data.revision_count }
            - call: "POST /proposals/${pr}/present"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { rn2: $.data.round_no }
            - call: "POST /proposals/${pr}/request-revision"
