  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: purchase_batch_two_independent_dimensions_interleaved
        grounds:
          - state_machines.PurchaseBatch.normalization_status
          - state_machines.PurchaseBatch.audit_status
          - complexity_profile.state_machine_shape
          - endpoints["POST /purchase-batches/{batch_id}/audit-markup"]
          - endpoints["POST /purchase-batches/{batch_id}/request-recovery"]
        distinguishing_aspect: |
          Shape = two PARALLEL state dimensions on one PurchaseBatch row. The
          normalization dimension (RECEIVED -> NORMALIZED -> ACCRUED) and the
          audit dimension (NOT_AUDITED -> AUDIT_OVERBILLED -> RECOVERY_REQUESTED)
          are advanced alternately and neither call may disturb the other's
          value, so the row ends in the combined state (ACCRUED,
          RECOVERY_REQUESTED) that no single linear ladder can express.
        test_recipe:
          setup:
            - "ProgramTier ELITE, Distributor METRO-01 ACTIVE, Member Harbor Grill ACTIVE with an ACTIVE PURCHASE_DATA_AND_PRICING letter, Deal PBC-2026 ACTIVE with the TIERED_VOLUME card."
