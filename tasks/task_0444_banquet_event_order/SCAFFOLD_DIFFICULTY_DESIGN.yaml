  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: room_rental_ceil_started_hour_boundary
        grounds:
          - calculations.room_rental
          - entities.FunctionRoomBooking.fields.rental_charge_cents
          - state_machines.FunctionRoomBooking.HOLD_to_DEFINITE
        distinguishing_aspect: |
          Numeric started-hour boundary on rental_charge_cents reachable via make-definite:
          a window of exactly 240 minutes bills ceil(240/60)=4 hours -> 200000, while 241
          minutes bills 5 hours -> 250000. The exact-hour case must NOT round up.
        test_recipe:
          setup:
            - "Room hourly_rental_cents=50000, buffer 0; one booking spanning exactly 18:00-22:00 (240 min)."
          setup_api_calls:
            - call: "POST /function-rooms"
              payload: { name: "Salon I", max_capacity: 300, turnover_buffer_minutes: 0, hourly_rental_cents: 50000 }
              as: PlatformAdmin
