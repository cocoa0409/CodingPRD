            - call: "POST /license-applications/${la_id}/pay-fee"
              payload: { amount_cents: 110000 }
              as: Applicant
              as_user_id: "${app_owner_id}"
            - call: "POST /license-applications/${la_id}/issue"
              as: Director
              as_user_id: "dir-1"
            - call: "GET /licenses"
              payload: { application_id: "${la_id}" }
              as: Director
              as_user_id: "dir-1"
              captures: { lic_id: $.data.0.id }
          trigger:
            - call: "POST /compliance-reports"
              payload: { license_id: "${lic_id}", tier: "SUPPLIER", period_code: "2026-Q1", gross_sales_cents: 6000000 }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { rpt_id: $.data.id, due: $.data.excise_due_cents }
          assert:
            - "ComplianceReport.${rpt_id}.excise_due_cents == 192000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_branch_fork_protest_period_to_approved_or_hearing
        grounds:
          - state_machines.LicenseApplication.PROTEST_PERIOD_to_APPROVED
          - state_machines.LicenseApplication.PROTEST_PERIOD_to_PROTEST_HEARING
          - state_machines.LicenseApplication.PROTEST_HEARING_to_PROTEST_PERIOD
          - state_machines.LicenseApplication.PROTEST_HEARING_to_DENIED
          - entities.LicenseApplication.fields.status
        distinguishing_aspect: |
          LicenseApplication is a branching fork-join on the SAME entity: from
