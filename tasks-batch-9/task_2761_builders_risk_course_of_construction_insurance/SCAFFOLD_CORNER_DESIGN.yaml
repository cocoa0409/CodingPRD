            - "pst == ISSUED, paid == 12500000, pstat == PAID and astat == CLOSED in the read taken immediately after the payment - the four cascade hops are all applied before the response is returned"
            - "er == 12500000 and av == 47500000 in the same immediate read window"
            - "GET /builders-risk/policies/${pl1} reports eroded_total_cents == 12500000 and written_premium_cents == 320000 with no intervening write"
