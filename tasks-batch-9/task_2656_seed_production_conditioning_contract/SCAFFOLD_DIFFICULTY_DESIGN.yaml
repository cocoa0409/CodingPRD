  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rogueing_order_cascade_flags_grower_and_marks_sibling_contracts
        grounds:
          - state_machines.ProductionContract.PLANTED_to_ROGUEING_REQUIRED
          - calculations.grower_standing_rollup
          - entities.Grower.fields.compliance_flag_count
          - entities.Grower.fields.status
          - entities.ProductionContract.fields.requires_field_officer_review
        distinguishing_aspect: |
          DEPTH-5 cascade triggered by POST /seed-ops/field-inspections: the ROGUEING_ORDERED outcome
          moves the contract to ROGUEING_REQUIRED (hop 2); because the contract entered that state the
          grower's compliance_flag_count rises to 2 (hop 3); because the counter reached the WATCH_AT_FLAGS
          threshold the grower's status becomes WATCH (hop 4); because the standing dropped, the grower's
          other DRAFT contract is stamped requires_field_officer_review (hop 5). Each hop is caused by the
          previous hop's mutation, not by the inspection call itself.
        test_recipe:
          setup:
            - "Golden variety and grower; field F-A carries the live contract, field F-B carries a second contract left in DRAFT"
            - "Contract A signed and already carrying one completed rogueing round (flag count 1, standing GOOD_STANDING)"
