          domain_name: occ.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.12
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          v_verified: $.data.version
      - call: PATCH /api/zones/${zone}
        payload:
          bot_fight_mode: true
        as: ZoneAdmin
        as_user_id: ${acc}
      trigger:
      - call: PATCH /api/zones/${zone}
        payload:
          dos_sensitivity: HIGH
          expected_zone_version: ${v_verified}
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          err: $.data.error_id
      - call: GET /api/zones/${zone}
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          v_now: $.data.version
      - call: PATCH /api/zones/${zone}
        payload:
          dos_sensitivity: HIGH
          expected_zone_version: ${v_now}
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          sens: $.data.dos_sensitivity
      assert:
      - 'stale request: error_id == ERR_STALE_VERSION (412) — the fight-mode PATCH bumped the version between read and write'
      - 'fresh request succeeds: dos_sensitivity == HIGH'
- section: endpoints
  instances:
  - name: error_envelope_shape_on_rejection
    claim_type: response_envelope
    grounds:
    - response_envelope
    distinguishing_aspect: A rejected call returns response_type "error" with data.error_id and data.message, plus meta.api_request_id and meta.api_request_timestamp — never a bare status code.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: GET /api/zones/00000000-0000-0000-0000-000000000000
        payload: {}
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - the response status is 404 and response_type == "error"
      - data.error_id == ERR_NOT_FOUND and data.message is a non-empty string
      - meta.api_request_id and meta.api_request_timestamp are present
  - name: clock_set_advances_purge_request_states
    claim_type: Action endpoint
    grounds:
    - calculations.purge_request_status
    - state_machines.PurgeRequest
    distinguishing_aspect: POST /api/_clock/set_current_utc is the sole driver that moves a QUEUED purge request through IN_PROGRESS to COMPLETED for an unshielded zone, stamping last_purged_at.
    test_recipe:
      setup:
      - PRO account, ACTIVE zone, one PURGE_URL request queued at T0.
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/accounts
        payload:
          company_name: Pro Corp
          plan_tier: PRO
          account_email: ops@pro.example.com
        as: PlatformAdmin
        captures:
          acc: $.data.id
      - call: POST /api/zones
        payload:
          account_id: ${acc}
          domain_name: z.example.com
          onboarding_type: FULL
          origin_host_email: host@provider.example.com
          dns_records:
          - name: www
            record_type: A
            content: 192.0.2.13
            proxied: true
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          zone: $.data.id
      - call: POST /api/zones/${zone}/verify
        payload: {}
        as: ZoneAdmin
        as_user_id: ${acc}
      - call: POST /api/purge-requests
        payload:
          zone_id: ${zone}
          purge_type: PURGE_URL
          urls:
          - https://z.example.com/x.css
        as: ZoneAdmin
        as_user_id: ${acc}
        captures:
          pr: $.data.id
      trigger:
      - call: POST /api/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:01Z'
        as: PlatformAdmin
      - call: GET /api/purge-requests/${pr}
        payload: {}
        as: PlatformAdmin
        captures:
          pr_status: $.data.status
      - call: GET /api/zones/${zone}
        payload: {}
        as: PlatformAdmin
        captures:
          stamp: $.data.last_purged_at
      assert:
      - PurgeRequest.${pr}.origin_shield_degraded == false
      - pr_status == COMPLETED after the first clock advance (unshielded latency 0)
      - Zone.${zone}.last_purged_at stays null — PURGE_URL completions never stamp the zone-level field
  - name: capacity_plan_computed_read
    claim_type: Computed read
    grounds:
    - calculations.effective_pop_capacity
    distinguishing_aspect: GET /api/pops/{id} with as_of_utc inside a 40-headroom window on a 200 Gbps PoP returns effective_capacity_gbps 80 and planned_utilization_pct 75 for reserved_gbps 60; outside
      the window it returns 200 and 30.
    test_recipe:
      setup:
      - PoP DFW baseline 200 with one window 2026-09-15T00:00:00Z to 2026-09-15T02:00:00Z at headroom 40.
      setup_api_calls:
      - call: POST /api/pops
        payload:
          code: DFW
          capacity_baseline_gbps: 200
        as: PlatformAdmin
        captures:
          pop: $.data.id
      - call: POST /api/pops/${pop}/maintenance-windows
        payload:
          start_utc: '2026-09-15T00:00:00Z'
          end_utc: '2026-09-15T02:00:00Z'
          headroom_pct: 40
        as: NetworkPlanner
      trigger:
      - call: GET /api/pops/${pop}
        payload:
          as_of_utc: '2026-09-15T01:00:00Z'
          reserved_gbps: 60
        as: NetworkPlanner
        captures:
          cap_in: $.data.effective_capacity_gbps
          util_in: $.data.planned_utilization_pct
      - call: GET /api/pops/${pop}
        payload:
          as_of_utc: '2026-09-16T01:00:00Z'
          reserved_gbps: 60
        as: NetworkPlanner
        captures:
          cap_out: $.data.effective_capacity_gbps
          util_out: $.data.planned_utilization_pct
      assert:
      - 'inside window: effective_capacity_gbps == 80 (floor(200 * 40 / 100)) and planned_utilization_pct == 75'
      - 'outside window: effective_capacity_gbps == 200 and planned_utilization_pct == 30'
