# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3021_connected_fitness_hardware_delivery_activation_subscription_entitlement
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (20 instances) does not already exercise.
# Corners already covered by a §1.8 instance appear as `excluded_because:` stubs
# with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: membership_create_defaults_the_concurrent_override_and_starts_provisional
        claim_type: Creation
        grounds:
          - entities.Membership
          - endpoints.POST_/fitness/memberships
          - calculations.concurrent_stream_limit
        distinguishing_aspect: "A membership created with just four fields comes back 201 in PROVISIONAL with posture OPEN, active_user_count 0, safety_gate_open true, a null concurrent_limit_override, and a concurrent_limit_effective resolved from the plan-tier default rather than from the request."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /fitness/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fitness/memberships"
              payload: { household_name: "Quillon Household", billing_email: "q@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000 }
              as: MembershipOwner
              captures: { m_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Membership.${m_id}.status == PROVISIONAL and Membership.${m_id}.posture == OPEN"
            - "Membership.${m_id}.concurrent_limit_override is null"
            - "Membership.${m_id}.concurrent_limit_effective == 4, the PLAN_TIER PLUS default, not a value from the request"
            - "Membership.${m_id}.active_user_count == 0 and Membership.${m_id}.safety_gate_open == true"
            - "Membership.${m_id}.billing_cycle_start_at == 2026-09-01T00:00:00Z and Membership.${m_id}.paid_through_at == 2026-10-01T00:00:00Z"
            - "Membership.${m_id}.version == 1 and id, created_at, updated_at are non-null with api_request_id present in meta"

      - name: memberships_list_paginates_and_filters_without_losing_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/fitness/memberships
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three memberships of two different tiers, limit=2 returns two rows with total_count 3 and has_more true, offset=2 returns the last row with has_more false, and the tier filter narrows total_count to the filtered set rather than the whole table."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three memberships: two PLUS, one BUSINESS."
          setup_api_calls:
            - *c_clock
            - call: "POST /fitness/memberships"
              payload: { household_name: "Quillon Household", billing_email: "q@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000 }
              as: MembershipOwner
              captures: { mA: $.data.id }
            - call: "POST /fitness/memberships"
              payload: { household_name: "Rhone Household", billing_email: "r@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000 }
              as: MembershipOwner
              captures: { mB: $.data.id }
            - call: "POST /fitness/memberships"
              payload: { household_name: "Sable Household", billing_email: "s@x.com", plan_tier: "BUSINESS", monthly_fee_cents: 12000 }
              as: MembershipOwner
              captures: { mC: $.data.id }
          trigger:
            - call: "GET /fitness/memberships"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "GET /fitness/memberships?limit=2&offset=0 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /fitness/memberships?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /fitness/memberships?plan_tier=BUSINESS returns exactly 1 row and total_count == 1"
            - "GET /fitness/memberships?status=PROVISIONAL returns all 3 rows"
            - "GET /fitness/memberships with no query parameters defaults limit to 10 and offset to 0 and returns 3 rows"

      - name: membership_summary_omits_fields_that_are_not_declared_reads
        claim_type: Retrieval
        grounds:
          - entities.Membership
          - endpoints.GET_/fitness/memberships/{membershipId}/summary
        distinguishing_aspect: "The computed summary endpoint returns the derived aggregate fields (posture, resolved stream limit, stream and financing counters) and never echoes the write-only concurrency override as an authoritative value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PROVISIONAL membership with a concurrent_limit_override of 2."
          setup_api_calls:
            - *c_clock
            - call: "POST /fitness/memberships"
              payload: { household_name: "Quillon Household", billing_email: "q@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000, concurrent_limit_override: 2 }
              as: MembershipOwner
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /fitness/memberships/${m_id}/summary"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
          assert:
            - "the response status is 200"
            - "Membership.${m_id}.concurrent_limit_override == 2 and Membership.${m_id}.concurrent_limit_effective == 2, the override winning over the tier default"
            - "Membership.${m_id}.total_streams_observed == 0"
            - "Membership.${m_id}.unpaid_financing_count == 0"
            - "Membership.${m_id}.attr_frozen_reason is null"
            - "Membership.${m_id}.household_name == \"Quillon Household\" and the derived block is byte-identical to the GET of the same membership"

      - name: household_user_create_missing_display_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.HouseholdUser
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "Omitting the required display_name reaches the payload-shape clause and returns ERR_INVALID_REQUEST at priority 3, before any parent existence or state clause is consulted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PROVISIONAL membership."
          setup_api_calls:
            - *c_clock
            - call: "POST /fitness/memberships"
              payload: { household_name: "Quillon Household", billing_email: "q@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000 }
              as: MembershipOwner
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /fitness/memberships/${m_id}/household-users"
              payload: { email: "x@x.com", role: "MEMBER" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { err_missing: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_INVALID_REQUEST (captured as ${err_missing})"
            - "GET /fitness/memberships/${m_id}/household-users returns 0 rows, so no partial row was written"
            - "Membership.${m_id}.active_user_count stays 0"

      - name: device_create_ignores_client_supplied_status_and_starts_unassigned
        claim_type: System Fields
        grounds:
          - entities.Device
          - endpoints.POST_/fitness/memberships/{membershipId}/devices
        distinguishing_aspect: "A client-supplied activation_status, condition and entitlement_lock in the body are ignored input: the device is minted UNASSIGNED / NEW with entitlement_lock true."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PROVISIONAL membership."
          setup_api_calls:
            - *c_clock
            - call: "POST /fitness/memberships"
              payload: { household_name: "Quillon Household", billing_email: "q@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000 }
              as: MembershipOwner
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /fitness/memberships/${m_id}/devices"
              payload: { hardware_sku: "BIKE", serial: "BIKE-0001" }
              as: ServiceTechnician
              captures: { d_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Device.${d_id}.activation_status == UNASSIGNED, never a client value"
            - "Device.${d_id}.condition == NEW and Device.${d_id}.provenance_source is null"
            - "Device.${d_id}.entitlement_lock == true and Device.${d_id}.content_access_allowed == false"
            - "Device.${d_id}.resale_cycle_count == 0 and Device.${d_id}.total_workouts == 0"
            - "id is a bare server UUID with no type prefix"

      - name: class_session_create_rejects_a_license_window_that_starts_after_the_session
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/fitness/class-sessions
          - errors[ERR_LICENSE_WINDOW_INVALID]
          - entities.ClassSession.fields.license_starts_at
        distinguishing_aspect: "A licensing window that begins after the session starts violates the ordering constraint at creation time, and a LIVE session whose ends_at escapes license_ends_at is refused as well."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /fitness/class-sessions"
              payload: { title: "Bad Window Ride", instructor_name: "COACH-MAYA", discipline: "CYCLING", delivery_mode: "LIVE", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T11:00:00Z", capacity: 100, license_starts_at: "2026-09-10T10:00:00Z", license_ends_at: "2026-09-11T00:00:00Z" }
              as: Instructor
              captures: { err_order: $.data.error_id }
            - call: "POST /fitness/class-sessions"
              payload: { title: "Bad Discipline Ride", instructor_name: "COACH-MAYA", discipline: "PILATES", delivery_mode: "LIVE", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T11:00:00Z", capacity: 100, license_starts_at: "2026-09-10T00:00:00Z", license_ends_at: "2026-09-11T00:00:00Z" }
              as: Instructor
              captures: { err_enum: $.data.error_id }
          assert:
            - "the first call returns 409 ERR_LICENSE_WINDOW_INVALID (captured as ${err_order}) because license_starts_at 2026-09-10T10:00:00Z is not before starts_at 2026-09-10T09:00:00Z"
            - "the second call returns 400 ERR_INVALID_REQUEST (captured as ${err_enum}) because PILATES is not in the discipline enum {CYCLING, RUNNING, STRENGTH, YOGA}"
            - "GET /fitness/class-sessions returns 0 rows after both rejections"

      - name: class_enrollment_create_checks_body_foreign_keys_before_session_capacity
        claim_type: Parent Relationships
        grounds:
          - entities.ClassEnrollment
          - endpoints.POST_/fitness/class-enrollments
          - errors[ERR_DEVICE_NOT_ON_MEMBERSHIP]
        distinguishing_aspect: "A body foreign key that belongs to a different membership is rejected with ERR_DEVICE_NOT_ON_MEMBERSHIP rather than being accepted and silently attached to the wrong household."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Membership A PROVISIONAL with a verified OWNER; membership B PROVISIONAL with one UNASSIGNED device; a PUBLISHED ON_DEMAND session."
          setup_api_calls:
            - *c_clock
            - call: "POST /fitness/memberships"
              payload: { household_name: "Quillon Household", billing_email: "q@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000 }
              as: MembershipOwner
              captures: { mA: $.data.id }
            - call: "POST /fitness/memberships/${mA}/household-users"
              payload: { display_name: "Ada Quillon", email: "ada@x.com", role: "OWNER" }
              as: MembershipOwner
              as_user_id: "${mA}"
              captures: { uA: $.data.id, tokA: $.data.verification_token }
            - call: "POST /fitness/household-users/${uA}/verify"
              payload: { verification_token: "${tokA}" }
              as: Anonymous
            - call: "POST /fitness/memberships"
              payload: { household_name: "Rhone Household", billing_email: "r@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000 }
              as: MembershipOwner
              captures: { mB: $.data.id }
            - call: "POST /fitness/class-sessions"
              payload: { title: "Threshold Ride", instructor_name: "COACH-MAYA", discipline: "CYCLING", delivery_mode: "ON_DEMAND", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T11:00:00Z", capacity: 100, license_starts_at: "2026-09-10T00:00:00Z", license_ends_at: "2026-09-20T00:00:00Z" }
              as: Instructor
              captures: { s_id: $.data.id }
            - call: "POST /fitness/class-sessions/${s_id}/publish"
              payload: {}
              as: Instructor
            - call: "POST /fitness/memberships/${mB}/devices"
              payload: { hardware_sku: "BIKE", serial: "BIKE-0002" }
              as: ServiceTechnician
              captures: { dB: $.data.id }
          trigger:
            - call: "POST /fitness/class-enrollments"
              payload: { class_session_id: "${s_id}", device_id: "${dB}", enroller_user_id: "${uA}" }
              as: MembershipOwner
              as_user_id: "${mA}"
              captures: { err_fk: $.data.error_id }
          assert:
            - "the call returns 409 ERR_DEVICE_NOT_ON_MEMBERSHIP (captured as ${err_fk})"
            - "Device.${dB}.membership_id == ${mB} while HouseholdUser.${uA}.membership_id == ${mA}, so the two foreign keys genuinely disagree"
            - "GET /fitness/class-sessions/${s_id}/class-enrollments returns 0 rows"
            - "ClassSession.${s_id}.live_enrollment_count stays 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: membership_resume_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Membership.ACTIVE_to_PAUSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling resume on a membership that was never paused has no transition defined out of ACTIVE with that trigger and must fail with ERR_INVALID_STATE without touching devices or the pause ledger."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Membership PLUS with a verified OWNER plus a delivered linked device, driven all the way to ACTIVE."
          setup_api_calls:
            - *c_clock
            - &c_m_create
              call: "POST /fitness/memberships"
              payload: { household_name: "Quillon Household", billing_email: "q@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000, concurrent_limit_override: 4 }
              as: MembershipOwner
              captures: { m_id: $.data.id }
            - &c_u_owner
              call: "POST /fitness/memberships/${m_id}/household-users"
              payload: { display_name: "Ada Quillon", email: "ada@x.com", role: "OWNER" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { u_ada: $.data.id, tok_ada: $.data.verification_token }
            - &c_uv_owner
              call: "POST /fitness/household-users/${u_ada}/verify"
              payload: { verification_token: "${tok_ada}" }
              as: Anonymous
            - &c_d_create
              call: "POST /fitness/memberships/${m_id}/devices"
              payload: { hardware_sku: "TREAD", serial: "TREAD-0001" }
              as: ServiceTechnician
              captures: { d_id: $.data.id }
            - &c_o_create
              call: "POST /fitness/memberships/${m_id}/hardware-orders"
              payload: { hardware_sku: "TREAD", subtotal_cents: 296000, financing_method: "FULL_PAYMENT", device_id: "${d_id}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - &c_a_create
              call: "POST /fitness/delivery-appointments"
              payload: { device_id: "${d_id}", hardware_order_id: "${o_id}", start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T15:00:00Z", zone: "METRO", technician_crew_code: "CREW-A", stair_flights: 0, has_elevator: false }
              as: ServiceTechnician
              captures: { a_id: $.data.id }
            - &c_a_sched
              call: "POST /fitness/delivery-appointments/${a_id}/schedule"
              payload: { start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T15:00:00Z" }
              as: ServiceTechnician
            - &c_k_deliver
              call: "POST /fitness/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T13:30:00Z" }
              as: PlatformAdmin
            - &c_a_start
              call: "POST /fitness/delivery-appointments/${a_id}/start"
              payload: {}
              as: ServiceTechnician
            - &c_a_complete
              call: "POST /fitness/delivery-appointments/${a_id}/complete"
              payload: { completion_grade: "CLEAN" }
              as: ServiceTechnician
            - &c_d_get
              call: "GET /fitness/devices/${d_id}"
              payload: {}
              as: ServiceTechnician
              captures: { d_v1: $.data.version }
            - &c_d_link
              call: "POST /fitness/devices/${d_id}/link"
              payload: { serial: "TREAD-0001", membership_id: "${m_id}", expected_device_version: "${d_v1}" }
              as: ServiceTechnician
            - &c_m_get
              call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v1: $.data.version }
            - &c_m_act
              call: "POST /fitness/memberships/${m_id}/activate"
              payload: { expected_membership_version: "${m_v1}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v_resume: $.data.version }
          trigger:
            - call: "POST /fitness/memberships/${m_id}/resume"
              payload: { expected_membership_version: "${m_v_resume}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { err_resume: $.data.error_id }
          assert:
            - "the call returns 409 ERR_INVALID_STATE (captured as ${err_resume})"
            - "Membership.${m_id}.status stays ACTIVE and pause_started_at stays null"
            - "Membership.${m_id}.accrued_pause_credit_cents stays 0"
            - "Device.${d_id}.activation_status stays ACTIVE with entitlement_lock false"
            - "Membership.${m_id}.version did not advance past ${m_v_resume}"

      - name: cancelled_membership_terminates_and_decommissions_devices_via_ops_sweep
        claim_type: Valid Transition
        grounds:
          - state_machines.Membership.CANCELLED_to_TERMINATED
          - calculations.run_ops_sweep
          - state_machines.Device.ACTIVE_to_DECOMMISSIONED
        distinguishing_aspect: "The 180-day automatic transition fires only through the ops sweep and only after the billing anchor is strictly more than 180 days stale, cascading the membership to TERMINATED and its devices to DECOMMISSIONED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A membership with a verified OWNER and a delivered linked device that has been cancelled; then the clock is advanced 181 days."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
            - *c_uv_owner
            - *c_d_create
            - *c_o_create
            - *c_a_create
            - *c_a_sched
            - *c_k_deliver
            - *c_a_start
            - *c_a_complete
            - *c_d_get
            - *c_d_link
            - *c_m_get
            - *c_m_act
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v_cancel: $.data.version }
            - call: "POST /fitness/memberships/${m_id}/cancel"
              payload: { expected_membership_version: "${m_v_cancel}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
            - call: "POST /fitness/_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fitness/_run_ops"
              payload: {}
              as: PlatformAdmin
              captures: { swept: $.data.terminated_memberships }
          assert:
            - "Membership.${m_id}.status == TERMINATED and posture == FROZEN after the sweep"
            - "the sweep reported terminated_memberships == 1 (captured as ${swept})"
            - "Device.${d_id}.activation_status == DECOMMISSIONED and Device.${d_id}.entitlement_lock == true"
            - "Device.${d_id}.total_workouts is frozen at 0"
            - "HouseholdUser.${u_ada}.status == REMOVED"
            - "a membership cancelled only 179 days earlier stays CANCELLED, so the boundary is strictly greater than 180 days"

      - name: household_user_verify_with_a_wrong_token_leaves_the_pending_state
        claim_type: Violation → Error
        grounds:
          - state_machines.HouseholdUser.PENDING_VERIFICATION_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A wrong verification token is refused and the user stays PENDING_VERIFICATION with verified false, so the parent active_user_count keeps counting the unverified row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PROVISIONAL membership with a single PENDING_VERIFICATION OWNER."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
          trigger:
            - call: "POST /fitness/household-users/${u_ada}/verify"
              payload: { verification_token: "not-the-token" }
              as: Anonymous
              captures: { err_tok: $.data.error_id }
          assert:
            - "the call is rejected with 409 ERR_INVALID_STATE (captured as ${err_tok}) or 403, and never 200"
            - "HouseholdUser.${u_ada}.status stays PENDING_VERIFICATION and verified stays false"
            - "Membership.${m_id}.active_user_count stays 1, because PENDING_VERIFICATION rows count toward the stream ceiling"
            - "verifying with the token captured at creation (${tok_ada}) then succeeds and moves the user to ACTIVE"

      - name: sold_refurb_batch_rejects_a_second_sell
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RefurbBatch.LISTED_to_SOLD
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "SOLD is terminal for a refurbishment batch: the second sell attempt is refused and mints no second device, so the resale lineage cannot fork."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T13:30:00Z. A delivered linked device, a batch driven through certify, list and sell."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
            - *c_uv_owner
            - *c_d_create
            - *c_o_create
            - *c_a_create
            - *c_a_sched
            - *c_k_deliver
            - *c_a_start
            - *c_a_complete
            - call: "POST /fitness/refurb-batches"
              payload: { source_device_id: "${d_id}", certification_grade: "A", performance_resale_enabled: true }
              as: ServiceTechnician
              captures: { b_id: $.data.id, b_price: $.data.resale_price_cents }
            - call: "POST /fitness/refurb-batches/${b_id}/certify"
              payload: {}
              as: ServiceTechnician
              captures: { b_price_cert: $.data.resale_price_cents }
            - call: "POST /fitness/refurb-batches/${b_id}/list"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fitness/refurb-batches/${b_id}/sell"
              payload: { buying_membership_id: "${m_id}" }
              as: PlatformAdmin
              captures: { b_sold_device: $.data.sold_device_id }
          trigger:
            - call: "POST /fitness/refurb-batches/${b_id}/sell"
              payload: { buying_membership_id: "${m_id}" }
              as: PlatformAdmin
              captures: { err_second_sell: $.data.error_id }
          assert:
            - "the second sell returns 409 ERR_ALREADY_TERMINAL (captured as ${err_second_sell})"
            - "RefurbBatch.${b_id}.status stays SOLD and sold_device_id stays ${b_sold_device}"
