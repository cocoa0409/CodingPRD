              as: ChannelManager
              captures: { k16_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k16_id}" }
              as: MonitoringOperator
              captures: { ma16_id: "$.data[0].id" }
            - call: "POST /alarm-funding/monitoring-transfers/${ma16_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-funding/alarm-events"
              payload: { monitoring_account_id: "${ma16_id}", signal_source: "ZONE-A", occurred_at: "2026-08-20T00:00:00Z", entered_at_utc: "2026-08-20T00:00:30Z" }
              as: MonitoringOperator
              captures: { ae_a_id: $.data.id }
            - call: "POST /alarm-funding/alarm-events"
              payload: { monitoring_account_id: "${ma16_id}", signal_source: "ZONE-B", occurred_at: "2026-08-21T00:00:00Z", entered_at_utc: "2026-08-21T00:00:30Z" }
              as: MonitoringOperator
              captures: { ae_b_id: $.data.id }
            - call: "POST /alarm-funding/alarm-events/${ae_a_id}/verification"
              payload: { outcome: "VERIFIED" }
              as: MonitoringOperator
            - call: "POST /alarm-funding/alarm-events/${ae_b_id}/verification"
              payload: { outcome: "VERIFIED" }
              as: MonitoringOperator
          trigger:
            - call: "GET /alarm-funding/monitoring-accounts/${ma16_id}/false-alarm-ratio"
              payload: {}
