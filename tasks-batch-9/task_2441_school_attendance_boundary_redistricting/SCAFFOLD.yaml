scenario: |
  Generate task harder than expert level!

  2441. School Attendance Boundary Redistricting (district boundary planning committee): enrollment projection by planning area with housing development pipeline data, capacity utilization targets and program placement constraints, scenario generation with contiguity, walkability and transportation cost objectives, socioeconomic and demographic impact analysis of each option, grandfathering, sibling and phase-in rules for affected students, community engagement, comment intake and scenario revision cycles, board adoption with effective date and transfer request handling, post-implementation enrollment variance monitoring

domain_name: school-boundary-redistricting
api_prefix: "/redistricting"

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Planning areas form a self-referential undirected adjacency graph (AreaAdjacency),
  # and a bipartite area<->school travel graph carried as PlanningArea.travel_options.
  # Scenarios project the area graph onto schools; contiguity is a connected-component
  # property of that projection. All URLs are flat peer collections under /redistricting
  # with foreign keys in bodies/query params (no deep ownership nesting).

  state_machine_shape: cyclic
  # BoundaryScenario: DRAFT -> UNDER_REVIEW -> REVISION -> UNDER_REVIEW (revision loop),
  # plus a branch at UNDER_REVIEW -> {REVISION, BOARD_READY} and BOARD_READY -> REVISION.
  # BoundaryStudy mirrors the loop: BOARD_DECISION -> ENGAGEMENT.
  # AdoptionRecord carries two independent state dimensions on one row
  # (implementation_status x transfer_window_status).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The DistrictPlanner that authored a scenario (BoundaryScenario.author_user_id) can
  # neither advance it to the board nor cast its adoption; a TransferOfficer cannot decide
  # a TransferRequest whose guardian_user_id equals its own X-User-ID.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities, 53 endpoints, 11 calculations, 6 state machines, 3 OCC rules, 60 validations, 60 errors.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BoundaryStudy
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Study title, e.g. "2028 Elementary Boundary Study".
      - name: district_name
        type: string
        source: input
        description: Owning school district name.
      - name: target_school_year
        type: integer
        source: input
        description: First school year the redrawn boundaries could apply to (e.g. 2028).
        constraints: ">= 2026"
      - name: horizon_years
        type: integer
        source: input
        description: Projection horizon in years used as the default for projection runs.
        default: 5
        constraints: "1..10"
      - name: capacity_target_low_pct
        type: number
        source: input
        description: Lower bound of the district capacity-utilization target band, in percent.
        constraints: "> 0 and < capacity_target_high_pct; 2 decimal places"
      - name: capacity_target_high_pct
        type: number
        source: input
        description: Upper bound of the capacity-utilization target band, in percent.
        constraints: "> capacity_target_low_pct and < 110.00 (CRITICAL_UTILIZATION_PCT)"
      - name: portables_count_toward_capacity
        type: boolean
        source: input
        description: When true, School.portable_capacity_seats is added into effective capacity.
        default: false
      - name: required_program_types
        type: array
        source: input
        description: >
          PROGRAM_TYPE enum members that every scenario submitted for review must place
          exactly once. Members drawn from {DUAL_LANGUAGE, SPECIAL_ED_INTENSIVE, GIFTED_MAGNET}.
        default: []
      - name: status
        type: enum
        source: system
        description: Study phase posture; gates which child mutations are permitted.
        default: SETUP
        constraints: "SETUP | DATA_LOCKED | SCENARIO_DEVELOPMENT | ENGAGEMENT | BOARD_DECISION | IMPLEMENTATION | CLOSED"
      - name: comment_intake_open
        type: boolean
        source: computed
        description: True exactly while status == ENGAGEMENT; gates POST /redistricting/comments.
        default: false
      - name: data_locked_at
        type: datetime
        source: system
        description: Logical-clock instant at which SETUP -> DATA_LOCKED succeeded; null before that.
        default: null
      - name: resident_student_total
        type: integer
        source: computed
        description: Sum of PlanningArea.resident_student_count over every PlanningArea whose study_id == this study.
        default: 0
      - name: enrolled_of_record_total
        type: integer
        source: computed
        description: Sum of School.enrolled_students_of_record over every School whose study_id == this study.
        default: 0
      - name: projection_stale
        type: boolean
        source: computed
        description: True when at least one ProjectionRun of this study has status == STALE.
        default: false

  - name: School
    parent: null
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: FK -> BoundaryStudy.id; the study this school belongs to.
      - name: name
        type: string
        source: input
        description: School name, unique within the study.
      - name: level
        type: enum
        source: input
        description: Grade level served; must equal the grade_band of every PlanningArea assigned to it.
        constraints: "ELEMENTARY | MIDDLE | HIGH"
      - name: core_capacity_seats
        type: integer
        source: input
        description: Permanent building capacity in seats.
        constraints: ">= 1"
      - name: portable_capacity_seats
        type: integer
        source: input
        description: Relocatable-classroom capacity in seats.
        default: 0
        constraints: ">= 0"
      - name: program_types
        type: array
        source: input
        description: >
          PROGRAM_TYPE enum members this school is physically able to host; a ProgramPlacement
          naming a school outside this list is rejected.
        default: []
      - name: status
        type: enum
        source: input
        description: Operational status; MOTHBALLED schools may not receive assignments or transfers.
        default: ACTIVE
        constraints: "ACTIVE | MOTHBALLED"
      - name: effective_capacity_seats
        type: integer
        source: computed
        description: core_capacity_seats + (portable_capacity_seats if study.portables_count_toward_capacity else 0).
        default: 0
      - name: enrolled_students_of_record
        type: integer
        source: computed
        description: >
          Sum of PlanningArea.resident_student_count over every PlanningArea whose
          current_school_id == this school. Recomputed on area creation and on
          AdoptionRecord activate/rescind.
        default: 0

  - name: PlanningArea
    parent: null
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: FK -> BoundaryStudy.id; owning study.
      - name: area_code
        type: string
        source: input
        description: Planner-assigned area label, unique within the study.
      - name: grade_band
        type: enum
        source: input
        description: The school level this area feeds; must equal School.level of any assigned school.
        constraints: "ELEMENTARY | MIDDLE | HIGH"
      - name: current_school_id
        type: string
        source: input
        description: FK -> School.id; school of record for this area before any adoption takes effect.
      - name: previous_school_id
        type: string
        source: system
        description: FK -> School.id; value of current_school_id immediately before the most recent adoption activation; null until then.
        default: null
      - name: resident_student_count
        type: integer
        source: input
        description: Students of record residing in the area today.
        constraints: ">= 0"
      - name: frl_student_count
        type: integer
        source: input
        description: Resident students qualifying for free/reduced lunch.
        constraints: ">= 0 and <= resident_student_count"
      - name: ell_student_count
        type: integer
        source: input
        description: Resident students classified English-language-learner.
        constraints: ">= 0 and <= resident_student_count"
      - name: median_household_income_usd
        type: integer
        source: input
        description: Area median household income in whole US dollars.
        constraints: ">= 0"
      - name: annual_absorption_cap_units
        type: integer
        source: input
        description: >
          Maximum housing units this area may deliver inside any rolling
          ROLLING_ABSORPTION_WINDOW_MONTHS window across all its developments.
        default: 250
        constraints: ">= 1"
      - name: travel_options
        type: array
        source: input
        description: >
          Array of objects { school_id, walk_distance_miles, bus_minutes, has_safe_route }.
          Exactly one entry is required per School in the same study whose level == this
          area's grade_band. school_id must reference such a School.
        constraints: "non-empty; walk_distance_miles >= 0; bus_minutes >= 1"

  - name: AreaAdjacency
    parent: null
    common_fields: false
    fields:
      - name: area_id
        type: string
        source: input
        description: FK -> PlanningArea.id; one endpoint of the shared boundary.
      - name: neighbor_area_id
        type: string
        source: input
        description: FK -> PlanningArea.id; the other endpoint of the shared boundary.
      - name: shared_boundary_length_ft
        type: integer
        source: input
        description: Length of the shared boundary in feet; used as the compactness weight.
        constraints: ">= 1"
      - name: is_reciprocal
        type: boolean
        source: system
        description: >
          False on the record created by the client call; true on the mirror record the
          server mints so the adjacency graph is stored symmetrically.
        default: false

  - name: HousingDevelopment
    parent: null
    common_fields: true
    fields:
      - name: area_id
        type: string
        source: input
        description: FK -> PlanningArea.id; the planning area the units are delivered in.
      - name: name
        type: string
        source: input
        description: Development name.
      - name: unit_type
        type: enum
        source: input
        description: Housing product type; selects the UNIT_YIELD and DEVELOPMENT_FRL_RATE constants.
        constraints: "SINGLE_FAMILY | TOWNHOME | MULTI_FAMILY"
      - name: total_units
        type: integer
        source: input
        description: Total dwelling units at buildout.
        constraints: ">= 1"
      - name: first_occupancy_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant of first expected occupancy; start of the delivery window.
      - name: buildout_months
        type: integer
        source: input
        description: Months from first occupancy to full buildout; length of the delivery window.
        constraints: ">= 1"
      - name: student_yield_override
        type: number
        source: input
        description: When non-null, replaces UNIT_YIELD[unit_type] for this development only.
        default: null
        constraints: ">= 0 and <= 2; 4 decimal places"
      - name: entitlement_status
        type: enum
        source: system
        description: Pipeline stage; selects the ENTITLEMENT_WEIGHT constant used by projection.
        default: PROPOSED
        constraints: "PROPOSED | ENTITLED | PERMITTED | UNDER_CONSTRUCTION | COMPLETE | WITHDRAWN"

  - name: ProjectionRun
    parent: null
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: FK -> BoundaryStudy.id; the study the run projects.
      - name: variant
        type: enum
        source: input
        description: Which enrollment-projection algorithm variant the run executed.
        constraints: "COHORT_SURVIVAL | DEVELOPMENT_WEIGHTED"
      - name: horizon_years
        type: integer
        source: input
        description: Projection horizon in years for this run.
        constraints: "1..10"
      - name: status
        type: enum
        source: system
        description: >
          COMPLETE when usable; STALE once the pipeline it consumed changed; SUPERSEDED when a
          newer run of the same variant exists for the study.
        default: COMPLETE
        constraints: "COMPLETE | STALE | SUPERSEDED"
      - name: stale_reason
        type: string
        source: system
        description: Set to "DEVELOPMENT_PIPELINE_CHANGED" when status flips to STALE; null otherwise.
        default: null
      - name: area_projections
        type: array
        source: computed
        description: >
          Array of objects { area_id, base_students, development_students, projected_students },
          one per PlanningArea of the study, ordered by PlanningArea.created_at ASC.
        default: []
      - name: projected_total_students
        type: integer
        source: computed
        description: Sum of area_projections[*].projected_students.
        default: 0

  - name: BoundaryScenario
    parent: null
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: FK -> BoundaryStudy.id; owning study.
      - name: projection_run_id
        type: string
        source: input
        description: FK -> ProjectionRun.id; the run whose area_projections this scenario is scored against.
      - name: name
        type: string
        source: input
        description: Scenario label, unique within the study.
      - name: author_user_id
        type: string
        source: system
        description: >
          X-User-ID of the DistrictPlanner that created the scenario. Segregation-of-duties
          checks compare this value to the acting X-User-ID; it is never an entity id.
      - name: status
        type: enum
        source: system
        description: Scenario lifecycle state.
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | REVISION | BOARD_READY | ADOPTED | REJECTED"
      - name: revision_round
        type: integer
        source: system
        description: Number of completed REVISION -> UNDER_REVIEW loops; capped by MAX_REVISION_ROUNDS.
        default: 0
      - name: revision_reason
        type: string
        source: system
        description: Why the scenario was last pushed back to REVISION ("COMMENT_CYCLE" or "PROJECTION_STALE").
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: Set to "SUPERSEDED_BY_ADOPTION" when a sibling scenario is adopted.
        default: null
      - name: projection_stale
        type: boolean
        source: computed
        description: True when the referenced ProjectionRun.status == STALE.
        default: false
      - name: program_placements
        type: array
        source: input
        description: >
          Array of objects { program_type, school_id, seats } describing where each district
          program is hosted under this scenario. Replaced wholesale by
          PUT /redistricting/scenarios/{id}/program-placements.
        default: []
      - name: impact_variant
        type: enum
        source: input
        description: Which demographic-impact algorithm variant the impact analysis reports.
        default: RESIDENT_BASED
        constraints: "RESIDENT_BASED | PROJECTED_BASED"
      - name: contiguity_ok
        type: boolean
        source: computed
        description: True when every school's assigned-area set forms one connected component of the adjacency graph.
        default: true
      - name: noncontiguous_school_ids
        type: array
        source: computed
        description: School ids whose assigned-area set splits into 2+ components, ordered by School.created_at ASC.
        default: []
      - name: total_assigned_students
        type: integer
        source: computed
        description: Sum of projected_students over every non-superseded AreaAssignment of this scenario.
        default: 0
      - name: max_utilization_pct
        type: number
        source: computed
        description: Maximum capacity_utilization_pct across the study's ACTIVE schools under this scenario.
        default: 0
      - name: walk_eligible_pct
        type: number
        source: computed
        description: Percent of total_assigned_students that are walk-eligible under this scenario.
        default: 0
      - name: transport_cost_annual_usd
        type: number
        source: computed
        description: Annual transportation cost of this scenario in US dollars, 2 decimal places.
        default: 0
      - name: students_reassigned_count
        type: integer
        source: computed
        description: Sum of projected_students over assignments whose assigned_school_id != area.current_school_id.
        default: 0
      - name: students_reassigned_pct
        type: number
        source: computed
        description: 100 * students_reassigned_count / total_assigned_students, 2 decimal places.
        default: 0
      - name: frl_dissimilarity_index
        type: number
        source: computed
        description: Free/reduced-lunch dissimilarity index under the active impact_variant, 4 decimal places.
        default: 0

  - name: AreaAssignment
    parent: null
    common_fields: true
    fields:
      - name: scenario_id
        type: string
        source: input
        description: FK -> BoundaryScenario.id; the scenario this assignment belongs to.
      - name: area_id
        type: string
        source: input
        description: FK -> PlanningArea.id; the area being assigned.
      - name: assigned_school_id
        type: string
        source: input
        description: FK -> School.id; the school the area is assigned to under this scenario.
      - name: is_superseded
        type: boolean
        source: system
        description: True once a later assignment for the same (scenario_id, area_id) pair replaced this row.
        default: false
      - name: superseded_at
        type: datetime
        source: system
        description: Logical-clock instant at which is_superseded flipped to true; null while active.
        default: null
      - name: projected_students
        type: integer
        source: computed
        description: >
          area_projections entry for area_id on the scenario's ProjectionRun, field
          projected_students, snapshotted at assignment creation.
        default: 0

  - name: PublicComment
    parent: null
    common_fields: true
    fields:
      - name: scenario_id
        type: string
        source: input
        description: FK -> BoundaryScenario.id; the scenario being commented on.
      - name: area_id
        type: string
        source: input
        description: FK -> PlanningArea.id; the commenter's residence area; null when not stated.
        default: null
      - name: guardian_user_id
        type: string
        source: system
        description: X-User-ID of the submitting Guardian; an opaque operator id, never an entity id.
      - name: body
        type: string
        source: input
        description: Comment text.
        constraints: "length 1..4000"
      - name: theme
        type: enum
        source: system
        description: Theme assigned at triage; null before triage.
        default: null
        constraints: "TRANSPORTATION | SIBLING_SPLIT | EQUITY | CAPACITY | PROGRAM_ACCESS | OTHER"
      - name: priority
        type: enum
        source: system
        description: Priority assigned at triage; null before triage.
        default: null
        constraints: "LOW | MEDIUM | HIGH"
      - name: status
        type: enum
        source: system
        description: Comment lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | TRIAGED | ADDRESSED | DISMISSED"
      - name: dismissal_reason
        type: string
        source: system
        description: Either OFFICER_DISMISSAL or SCENARIO_REJECTED; null unless status == DISMISSED.
        default: null

  - name: AdoptionRecord
    parent: null
    common_fields: true
    fields:
      - name: study_id
        type: string
        source: input
        description: FK -> BoundaryStudy.id; the study whose boundaries are adopted.
      - name: scenario_id
        type: string
        source: input
        description: FK -> BoundaryScenario.id; the BOARD_READY scenario being adopted.
      - name: effective_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant on/after which the boundaries may be activated.
      - name: effective_school_year
        type: integer
        source: input
        description: First school year governed by this adoption; start of its boundary regime.
        constraints: ">= study.target_school_year"
      - name: regime_years
        type: integer
        source: input
        description: Length in school years of the half-open regime interval [effective_school_year, effective_school_year + regime_years).
        default: 3
        constraints: ">= MIN_REGIME_YEARS (2)"
      - name: transfer_deadline_date
        type: datetime
        source: input
        description: Last instant at which a TransferRequest may be submitted; must be > effective_date.
      - name: transfer_cap_pct
        type: number
        source: input
        description: Percent of effective capacity a school may reach via inbound transfers.
        default: 95.00
        constraints: "> 0 and <= 110.00"
      - name: variance_tolerance_pct
        type: number
        source: input
        description: Absolute enrollment-variance percent considered WITHIN_TOLERANCE.
        default: 3.00
        constraints: "> 0"
      - name: votes_for
        type: integer
        source: input
        description: Board votes in favour.
        constraints: ">= 0"
      - name: votes_against
        type: integer
        source: input
        description: Board votes against.
        constraints: ">= 0"
      - name: votes_abstain
        type: integer
        source: input
        description: Board abstentions.
        default: 0
        constraints: ">= 0"
      - name: board_member_count
        type: integer
        source: input
        description: Seated board members; drives the quorum threshold.
        constraints: ">= 1"
      - name: adopted_by_user_id
        type: string
        source: system
        description: X-User-ID of the adopting BoardMember; compared against scenario.author_user_id by the SoD check.
      - name: supermajority_required
        type: boolean
        source: computed
        description: True when scenario.students_reassigned_pct > SUPERMAJORITY_TRIGGER_PCT.
        default: false
      - name: implementation_status
        type: enum
        source: system
        description: First independent state dimension - rollout of the boundary regime.
        default: PENDING_EFFECTIVE
        constraints: "PENDING_EFFECTIVE | IN_EFFECT | MONITORING_CLOSED | RESCINDED"
      - name: transfer_window_status
        type: enum
        source: system
        description: Second independent state dimension - whether transfer intake is accepting requests.
        default: TRANSFER_WINDOW_OPEN
        constraints: "TRANSFER_WINDOW_OPEN | TRANSFER_WINDOW_CLOSED"

  - name: PhaseInRule
    parent: null
    common_fields: false
    fields:
      - name: adoption_id
        type: string
        source: input
        description: FK -> AdoptionRecord.id; the adoption this rule phases in.
      - name: rule_type
        type: enum
        source: input
        description: Which entitlement the rule confers on a matching student.
        constraints: "TERMINAL_GRADE_GRANDFATHER | SIBLING_LINK | PHASE_IN_GRADE_BAND"
      - name: grade_low
        type: integer
        source: input
        description: Inclusive low bound of the grade band the rule covers.
        constraints: "0..12"
      - name: grade_high
        type: integer
        source: input
        description: Inclusive high bound of the grade band the rule covers.
        constraints: "0..12 and >= grade_low"
      - name: sunset_school_year
        type: integer
        source: input
        description: Last school year in which the rule may be invoked.
        constraints: ">= adoption.effective_school_year"
      - name: consumes_seat_pool
        type: boolean
        source: computed
        description: >
          false for TERMINAL_GRADE_GRANDFATHER and PHASE_IN_GRADE_BAND (entitlements that
          bypass the transfer seat pool); true for SIBLING_LINK.
        default: false

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: adoption_id
        type: string
        source: input
        description: FK -> AdoptionRecord.id; the adoption the request is filed under.
      - name: area_id
        type: string
        source: input
        description: FK -> PlanningArea.id; the student's residence area.
      - name: origin_school_id
        type: string
        source: system
        description: FK -> School.id; the school the adopted scenario assigns the residence area to.
      - name: requested_school_id
        type: string
        source: input
        description: FK -> School.id; the school the guardian is requesting.
      - name: sibling_transfer_id
        type: string
        source: input
        description: FK -> TransferRequest.id; the APPROVED sibling request this request links to; null unless reason == SIBLING.
        default: null
      - name: guardian_user_id
        type: string
        source: system
        description: X-User-ID of the submitting Guardian; an opaque operator id, never an entity id.
      - name: student_reference
        type: string
        source: input
        description: District student reference; unique within the adoption.
      - name: student_grade
        type: integer
        source: input
        description: Student grade in the effective school year (0 == kindergarten).
        constraints: "0..12"
      - name: reason
        type: enum
        source: input
        description: Basis claimed by the guardian.
        constraints: "GRANDFATHER | SIBLING | PHASE_IN | HARDSHIP | PROGRAM"
      - name: status
        type: enum
        source: system
        description: Request lifecycle state.
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | DENIED | WAITLISTED"
      - name: resolved_reason
        type: enum
        source: computed
        description: Which PhaseInRule (or fallback) the eligibility waterfall matched.
        default: NONE
        constraints: "TERMINAL_GRADE_GRANDFATHER | SIBLING_LINK | PHASE_IN_GRADE_BAND | HARDSHIP_REVIEW | NONE"
      - name: consumes_seat_pool
        type: boolean
        source: computed
        description: True when resolved_reason is SIBLING_LINK or HARDSHIP_REVIEW.
        default: false
      - name: promotion_source
        type: enum
        source: system
        description: How the request reached APPROVED; null while not APPROVED.
        default: null
        constraints: "OFFICER_DECISION | WAITLIST_AUTO"
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the deciding TransferOfficer; null for WAITLIST_AUTO promotions.
        default: null
      - name: decision_notes
        type: string
        source: system
        description: Free-text note captured at decision time.
        default: null

  - name: VarianceObservation
    parent: null
    common_fields: false
    fields:
      - name: adoption_id
        type: string
        source: input
        description: FK -> AdoptionRecord.id; the adoption being monitored.
      - name: school_id
        type: string
        source: input
        description: FK -> School.id; the school observed.
      - name: observed_on
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the head-count snapshot.
      - name: observed_enrollment
        type: integer
        source: input
        description: Actual head count observed at the school.
        constraints: ">= 0"
      - name: projected_enrollment
        type: integer
        source: input
        description: Enrollment the adopted scenario projected for the school.
        constraints: ">= 0"
      - name: variance_pct
        type: number
        source: computed
        description: 100 * (observed_enrollment - projected_enrollment) / projected_enrollment, 2 decimal places.
        default: 0
      - name: flag
        type: enum
        source: computed
        description: Tolerance band the variance falls in.
        default: WITHIN_TOLERANCE
        constraints: "WITHIN_TOLERANCE | WATCH | CORRECTIVE_ACTION_REQUIRED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BoundaryStudy
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: DATA_LOCKED
        trigger: "POST /redistricting/studies/{id}/lock-data"
        actor: DistrictPlanner
        preconditions:
          - "study.status == SETUP"
          - "count of School where study_id == study.id and status == ACTIVE >= 2"
          - "count of PlanningArea where study_id == study.id >= 3"
          - "every PlanningArea of the study has at least one AreaAdjacency row whose area_id == that area's id"
          - "for every PlanningArea of the study, travel_options contains exactly one entry per School where School.study_id == study.id and School.status == ACTIVE and School.level == area.grade_band"
        side_effects:
          - "sets study.data_locked_at to the current logical-clock instant"
          - "recomputes study.resident_student_total as the sum of PlanningArea.resident_student_count over every PlanningArea where study_id == study.id"
          - "recomputes School.enrolled_students_of_record for every School where study_id == study.id, then study.enrolled_of_record_total"
          - "increments BoundaryStudy.version by 1"
          - "freezes POST /redistricting/studies/{id}/schools, POST /redistricting/planning-areas and POST /redistricting/area-adjacencies for this study (ERR_STUDY_DATA_LOCKED)"
      - from: DATA_LOCKED
        to: SCENARIO_DEVELOPMENT
        trigger: "system: the first ProjectionRun for this study is created with status == COMPLETE by POST /redistricting/studies/{id}/projection-runs"
        actor: system
        preconditions:
          - "study.status == DATA_LOCKED"
        side_effects:
          - "increments BoundaryStudy.version by 1"
        note: "Automatic - the planner never posts this transition directly."
      - from: SCENARIO_DEVELOPMENT
        to: ENGAGEMENT
        trigger: "POST /redistricting/studies/{id}/open-engagement"
        actor: EngagementCoordinator
        preconditions:
          - "study.status == SCENARIO_DEVELOPMENT"
          - "count of BoundaryScenario where study_id == study.id and status == UNDER_REVIEW >= 1"
        side_effects:
          - "sets study.comment_intake_open = true"
          - "increments BoundaryStudy.version by 1"
      - from: ENGAGEMENT
        to: BOARD_DECISION
        trigger: "system: a BoundaryScenario of this study transitions UNDER_REVIEW -> BOARD_READY via POST /redistricting/scenarios/{id}/advance-to-board"
        actor: system
        preconditions:
          - "study.status == ENGAGEMENT"
        side_effects:
          - "sets study.comment_intake_open = false"
          - "increments BoundaryStudy.version by 1"
      - from: BOARD_DECISION
        to: ENGAGEMENT
        trigger: "system: the last BoundaryScenario of this study in BOARD_READY leaves BOARD_READY via POST /redistricting/scenarios/{id}/request-revision"
        actor: system
        preconditions:
          - "study.status == BOARD_DECISION"
          - "no BoundaryScenario where study_id == study.id has status == BOARD_READY"
        side_effects:
          - "sets study.comment_intake_open = true"
          - "increments BoundaryStudy.version by 1"
        note: "Cyclic revert - the study re-enters community engagement for another revision round."
      - from: ENGAGEMENT
        to: SCENARIO_DEVELOPMENT
        trigger: "system: the last BoundaryScenario of this study in UNDER_REVIEW is pushed back to REVISION because its ProjectionRun went STALE"
        actor: system
        preconditions:
          - "study.status == ENGAGEMENT"
          - "no BoundaryScenario where study_id == study.id has status in {UNDER_REVIEW, BOARD_READY}"
        side_effects:
          - "sets study.comment_intake_open = false"
          - "increments BoundaryStudy.version by 1"
        note: "Cyclic revert - link 4 of the housing-pipeline cascade."
      - from: BOARD_DECISION
        to: IMPLEMENTATION
        trigger: "system: POST /redistricting/adoptions creates an AdoptionRecord for this study"
        actor: system
        preconditions:
          - "study.status == BOARD_DECISION"
        side_effects:
          - "increments BoundaryStudy.version by 1"
      - from: IMPLEMENTATION
        to: BOARD_DECISION
        trigger: "system: POST /redistricting/adoptions/{id}/rescind sets the adoption's implementation_status to RESCINDED"
        actor: system
        preconditions:
          - "study.status == IMPLEMENTATION"
        side_effects:
          - "increments BoundaryStudy.version by 1"
        note: "Compensating revert of the adoption cascade."
      - from: IMPLEMENTATION
        to: CLOSED
        trigger: "system: POST /redistricting/adoptions/{id}/close-monitoring sets implementation_status to MONITORING_CLOSED"
        actor: system
        preconditions:
          - "study.status == IMPLEMENTATION"
        side_effects:
          - "increments BoundaryStudy.version by 1"

  - entity: BoundaryScenario
    initial_state: DRAFT
    terminal_states: [ADOPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /redistricting/scenarios/{id}/submit-for-review"
        actor: DistrictPlanner
        preconditions:
          - "scenario.status == DRAFT"
          - "study.status in {DATA_LOCKED, SCENARIO_DEVELOPMENT, ENGAGEMENT}"
          - "ProjectionRun[scenario.projection_run_id].status == COMPLETE (i.e. scenario.projection_stale == false)"
          - "every PlanningArea where study_id == scenario.study_id has exactly one AreaAssignment where scenario_id == scenario.id and is_superseded == false"
          - "contiguity_evaluation yields contiguity_ok == true"
          - "every program_type in study.required_program_types appears exactly once in scenario.program_placements"
          - "every ACTIVE School hosting a program_placement has at least one non-superseded AreaAssignment in this scenario"
          - "school_capacity_utilization yields max_utilization_pct < 110.00 (CRITICAL_UTILIZATION_PCT)"
        side_effects:
          - "recomputes contiguity_ok and noncontiguous_school_ids via contiguity_evaluation"
          - "recomputes total_assigned_students and max_utilization_pct via school_capacity_utilization"
          - "recomputes transport_cost_annual_usd and walk_eligible_pct via transportation_cost_annual"
          - "recomputes students_reassigned_count, students_reassigned_pct and frl_dissimilarity_index via demographic_impact_index"
          - "increments BoundaryScenario.version by 1"
          - "ATOMICITY: all four recomputations are persisted only when the transition itself succeeds. A rejected submit-for-review (any validation priority) leaves status, revision_round, version and every stored score field byte-identical to their pre-call values; the freshly computed values are observable only through GET /redistricting/scenarios/{id}/impact-analysis, which computes on read and never writes."
      - from: REVISION
        to: UNDER_REVIEW
        trigger: "POST /redistricting/scenarios/{id}/submit-for-review"
        actor: DistrictPlanner
        preconditions:
          - "scenario.status == REVISION"
          - "scenario.revision_round < 3 (MAX_REVISION_ROUNDS)"
          - "all DRAFT -> UNDER_REVIEW preconditions above, evaluated again"
        side_effects:
          - "increments scenario.revision_round by 1"
          - "sets scenario.revision_reason = null"
          - "recomputes contiguity_ok, max_utilization_pct, transport_cost_annual_usd, walk_eligible_pct, students_reassigned_count, students_reassigned_pct and frl_dissimilarity_index"
          - "increments BoundaryScenario.version by 1"
        note: "Cycle - REVISION -> UNDER_REVIEW -> REVISION may repeat until revision_round reaches MAX_REVISION_ROUNDS."
      - from: UNDER_REVIEW
        to: REVISION
        trigger: "POST /redistricting/scenarios/{id}/request-revision"
        actor: EngagementCoordinator
        preconditions:
          - "scenario.status == UNDER_REVIEW"
          - "study.status in {ENGAGEMENT, BOARD_DECISION}"
          - "cited_comment_ids is non-empty"
          - "every id in cited_comment_ids resolves to a PublicComment where scenario_id == scenario.id and status == TRIAGED"
        side_effects:
          - "sets scenario.revision_reason = COMMENT_CYCLE"
          - "cascade link 2: every cited PublicComment transitions TRIAGED -> ADDRESSED"
          - "cascade link 3: because the scenario left UNDER_REVIEW, if study.status == BOARD_DECISION and no BoundaryScenario of the study remains in BOARD_READY, the study transitions BOARD_DECISION -> ENGAGEMENT and comment_intake_open is set back to true"
          - "increments BoundaryScenario.version by 1"
      - from: BOARD_READY
        to: REVISION
        trigger: "POST /redistricting/scenarios/{id}/request-revision"
        actor: BoardMember
        preconditions:
          - "scenario.status == BOARD_READY"
          - "scenario.revision_round < 3 (MAX_REVISION_ROUNDS)"
          - "cited_comment_ids is non-empty"
          - "every id in cited_comment_ids resolves to a PublicComment where scenario_id == scenario.id and status == TRIAGED"
        side_effects:
          - "sets scenario.revision_reason = COMMENT_CYCLE"
          - "cascade link 2: every cited PublicComment transitions TRIAGED -> ADDRESSED"
          - "cascade link 3: because the last BOARD_READY scenario left BOARD_READY, the study transitions BOARD_DECISION -> ENGAGEMENT and comment_intake_open is set back to true"
          - "increments BoundaryScenario.version by 1"
        note: "Branch back from the board stage - the cyclic edge that distinguishes this machine from a pipeline."
      - from: UNDER_REVIEW
        to: REVISION
        trigger: "system: ProjectionRun[scenario.projection_run_id] transitions COMPLETE -> STALE as link 2 of the housing-pipeline cascade"
        actor: system
        preconditions:
          - "scenario.status == UNDER_REVIEW"
        side_effects:
          - "sets scenario.projection_stale = true"
          - "sets scenario.revision_reason = PROJECTION_STALE"
          - "increments scenario.revision_round by 1"
          - "cascade link 4: because the last UNDER_REVIEW scenario left UNDER_REVIEW, if study.status == ENGAGEMENT the study transitions ENGAGEMENT -> SCENARIO_DEVELOPMENT and comment_intake_open is set to false"
          - "increments BoundaryScenario.version by 1"
      - from: UNDER_REVIEW
        to: BOARD_READY
        trigger: "POST /redistricting/scenarios/{id}/advance-to-board"
        actor: EngagementCoordinator
        preconditions:
          - "scenario.status == UNDER_REVIEW"
          - "study.status == ENGAGEMENT"
          - "scenario.projection_stale == false"
          - "no PublicComment where scenario_id == scenario.id has status == SUBMITTED"
          - "X-User-ID != scenario.author_user_id (segregation of duties)"
        side_effects:
          - "study transitions ENGAGEMENT -> BOARD_DECISION and comment_intake_open is set to false"
          - "increments BoundaryScenario.version by 1"
      - from: BOARD_READY
        to: ADOPTED
        trigger: "POST /redistricting/adoptions"
        actor: BoardMember
        preconditions:
          - "scenario.status == BOARD_READY"
          - "study.status == BOARD_DECISION"
          - "board_vote_outcome yields quorum_met == true and majority_met == true"
          - "X-User-ID != scenario.author_user_id (segregation of duties)"
          - "no other non-RESCINDED AdoptionRecord of any study with the same district_name occupies an overlapping or under-buffered boundary regime interval"
        side_effects:
          - "cascade link 1: creates the AdoptionRecord with implementation_status PENDING_EFFECTIVE and transfer_window_status TRANSFER_WINDOW_OPEN"
          - "cascade link 2: because this scenario became ADOPTED, every sibling BoundaryScenario where study_id == scenario.study_id and status in {DRAFT, UNDER_REVIEW, REVISION, BOARD_READY} transitions to REJECTED with rejection_reason = SUPERSEDED_BY_ADOPTION, processed in BoundaryScenario.created_at ASC order"
          - "cascade link 3: because those siblings became REJECTED, every PublicComment whose scenario_id is one of them and whose status is in {SUBMITTED, TRIAGED} transitions to DISMISSED with dismissal_reason = SCENARIO_REJECTED"
          - "study transitions BOARD_DECISION -> IMPLEMENTATION"
          - "increments BoundaryScenario.version by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "system: a sibling BoundaryScenario of the same study is ADOPTED by POST /redistricting/adoptions"
        actor: system
        preconditions:
          - "scenario.status == DRAFT"
        side_effects:
          - "sets rejection_reason = SUPERSEDED_BY_ADOPTION"
          - "increments BoundaryScenario.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system: a sibling BoundaryScenario of the same study is ADOPTED by POST /redistricting/adoptions"
        actor: system
        preconditions:
          - "scenario.status == UNDER_REVIEW"
        side_effects:
          - "sets rejection_reason = SUPERSEDED_BY_ADOPTION"
          - "every PublicComment of this scenario in {SUBMITTED, TRIAGED} transitions to DISMISSED with dismissal_reason = SCENARIO_REJECTED"
          - "increments BoundaryScenario.version by 1"
      - from: REVISION
        to: REJECTED
        trigger: "system: a sibling BoundaryScenario of the same study is ADOPTED by POST /redistricting/adoptions"
        actor: system
        preconditions:
          - "scenario.status == REVISION"
        side_effects:
          - "sets rejection_reason = SUPERSEDED_BY_ADOPTION"
          - "every PublicComment of this scenario in {SUBMITTED, TRIAGED} transitions to DISMISSED with dismissal_reason = SCENARIO_REJECTED"
          - "increments BoundaryScenario.version by 1"
      - from: BOARD_READY
        to: REJECTED
        trigger: "system: a sibling BoundaryScenario of the same study is ADOPTED by POST /redistricting/adoptions"
        actor: system
        preconditions:
          - "scenario.status == BOARD_READY"
        side_effects:
          - "sets rejection_reason = SUPERSEDED_BY_ADOPTION"
          - "every PublicComment of this scenario in {SUBMITTED, TRIAGED} transitions to DISMISSED with dismissal_reason = SCENARIO_REJECTED"
          - "increments BoundaryScenario.version by 1"

  - entity: HousingDevelopment
    initial_state: PROPOSED
    terminal_states: [COMPLETE, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ENTITLED
        trigger: "POST /redistricting/housing-developments/{id}/entitlement-advance with to_status == ENTITLED"
        actor: DistrictPlanner
        preconditions:
          - "development.entitlement_status == PROPOSED"
          - "to_status is the immediate successor in PROPOSED -> ENTITLED -> PERMITTED -> UNDER_CONSTRUCTION -> COMPLETE, or WITHDRAWN"
        side_effects:
          - "cascade link 1: sets entitlement_status = ENTITLED and increments HousingDevelopment.version by 1"
          - "cascade link 2: because the ENTITLEMENT_WEIGHT input changed, every ProjectionRun where study_id == PlanningArea[development.area_id].study_id and status == COMPLETE transitions to STALE with stale_reason = DEVELOPMENT_PIPELINE_CHANGED, and study.projection_stale is set to true"
          - "cascade link 3: because those runs became STALE, every BoundaryScenario referencing one of them whose status is in {DRAFT, UNDER_REVIEW, REVISION} sets projection_stale = true, and each such scenario in UNDER_REVIEW additionally transitions UNDER_REVIEW -> REVISION with revision_reason = PROJECTION_STALE and revision_round incremented by 1"
          - "cascade link 4: because the last UNDER_REVIEW scenario left UNDER_REVIEW, if study.status == ENGAGEMENT the study transitions ENGAGEMENT -> SCENARIO_DEVELOPMENT and comment_intake_open is set to false"
      - from: ENTITLED
        to: PERMITTED
        trigger: "POST /redistricting/housing-developments/{id}/entitlement-advance with to_status == PERMITTED"
        actor: DistrictPlanner
        preconditions:
          - "development.entitlement_status == ENTITLED"
        side_effects:
          - "sets entitlement_status = PERMITTED and increments HousingDevelopment.version by 1"
          - "the same four-link cascade as PROPOSED -> ENTITLED fires"
      - from: PERMITTED
        to: UNDER_CONSTRUCTION
        trigger: "POST /redistricting/housing-developments/{id}/entitlement-advance with to_status == UNDER_CONSTRUCTION"
        actor: DistrictPlanner
        preconditions:
          - "development.entitlement_status == PERMITTED"
        side_effects:
          - "sets entitlement_status = UNDER_CONSTRUCTION and increments HousingDevelopment.version by 1"
          - "the same four-link cascade as PROPOSED -> ENTITLED fires"
      - from: UNDER_CONSTRUCTION
        to: COMPLETE
        trigger: "POST /redistricting/housing-developments/{id}/entitlement-advance with to_status == COMPLETE"
        actor: DistrictPlanner
        preconditions:
          - "development.entitlement_status == UNDER_CONSTRUCTION"
        side_effects:
          - "sets entitlement_status = COMPLETE and increments HousingDevelopment.version by 1"
          - "the same four-link cascade as PROPOSED -> ENTITLED fires"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /redistricting/housing-developments/{id}/entitlement-advance with to_status == WITHDRAWN"
        actor: DistrictPlanner
        preconditions:
          - "development.entitlement_status in {PROPOSED, ENTITLED, PERMITTED, UNDER_CONSTRUCTION}"
        side_effects:
          - "sets entitlement_status = WITHDRAWN and increments HousingDevelopment.version by 1"
          - "the same four-link cascade as PROPOSED -> ENTITLED fires; a WITHDRAWN development contributes zero development students under both projection variants"
      - from: ENTITLED
        to: WITHDRAWN
        trigger: "POST /redistricting/housing-developments/{id}/entitlement-advance with to_status == WITHDRAWN"
        actor: DistrictPlanner
        preconditions:
          - "development.entitlement_status == ENTITLED"
        side_effects:
          - "sets entitlement_status = WITHDRAWN and increments HousingDevelopment.version by 1"
          - "the same four-link cascade as PROPOSED -> ENTITLED fires"
      - from: PERMITTED
        to: WITHDRAWN
        trigger: "POST /redistricting/housing-developments/{id}/entitlement-advance with to_status == WITHDRAWN"
        actor: DistrictPlanner
        preconditions:
          - "development.entitlement_status == PERMITTED"
        side_effects:
          - "sets entitlement_status = WITHDRAWN and increments HousingDevelopment.version by 1"
          - "the same four-link cascade as PROPOSED -> ENTITLED fires"
      - from: UNDER_CONSTRUCTION
        to: WITHDRAWN
        trigger: "POST /redistricting/housing-developments/{id}/entitlement-advance with to_status == WITHDRAWN"
        actor: DistrictPlanner
        preconditions:
          - "development.entitlement_status == UNDER_CONSTRUCTION"
        side_effects:
          - "sets entitlement_status = WITHDRAWN and increments HousingDevelopment.version by 1"
          - "the same four-link cascade as PROPOSED -> ENTITLED fires"

  - entity: AdoptionRecord
    initial_state: PENDING_EFFECTIVE
    terminal_states: [MONITORING_CLOSED, RESCINDED]
    transitions:
      - from: PENDING_EFFECTIVE
        to: IN_EFFECT
        trigger: "POST /redistricting/adoptions/{id}/activate"
        actor: TransferOfficer
        preconditions:
          - "adoption.implementation_status == PENDING_EFFECTIVE"
          - "the current logical-clock instant >= adoption.effective_date"
          - "BoundaryScenario[adoption.scenario_id].status == ADOPTED"
        side_effects:
          - "cascade link 1: sets implementation_status = IN_EFFECT and increments AdoptionRecord.version by 1"
          - "cascade link 2: because the adoption took effect, every PlanningArea where study_id == adoption.study_id sets previous_school_id = current_school_id and then current_school_id = the assigned_school_id of the non-superseded AreaAssignment for that area under adoption.scenario_id, processed in PlanningArea.created_at ASC order"
          - "cascade link 3: because current_school_id changed, every School where study_id == adoption.study_id recomputes enrolled_students_of_record, and the study recomputes enrolled_of_record_total"
          - "cascade link 4: because enrolled_students_of_record changed, every TransferRequest where adoption_id == adoption.id and status == WAITLISTED is re-evaluated in TransferRequest.created_at ASC order; each one whose requested school now has transfer_seat_pool >= 1 transitions WAITLISTED -> APPROVED with promotion_source = WAITLIST_AUTO, and the pool is recomputed after each promotion before the next candidate is considered"
      - from: IN_EFFECT
        to: RESCINDED
        trigger: "POST /redistricting/adoptions/{id}/rescind"
        actor: BoardMember
        preconditions:
          - "adoption.implementation_status == IN_EFFECT"
          - "X-User-ID != BoundaryScenario[adoption.scenario_id].author_user_id (segregation of duties)"
        side_effects:
          - "sets implementation_status = RESCINDED and increments AdoptionRecord.version by 1"
          - "compensation link 2: every PlanningArea where study_id == adoption.study_id sets current_school_id = previous_school_id and then previous_school_id = null, processed in PlanningArea.created_at ASC order"
          - "compensation link 3: every School where study_id == adoption.study_id recomputes enrolled_students_of_record, and the study recomputes enrolled_of_record_total"
          - "compensation link 4: every TransferRequest where adoption_id == adoption.id and promotion_source == WAITLIST_AUTO reverts APPROVED -> WAITLISTED with promotion_source = null"
          - "study transitions IMPLEMENTATION -> BOARD_DECISION"
        note: "Exact compensation of the activate cascade - the district head-count invariant must hold before activate, after activate, and after rescind."
      - from: IN_EFFECT
        to: MONITORING_CLOSED
        trigger: "POST /redistricting/adoptions/{id}/close-monitoring"
        actor: TransferOfficer
        preconditions:
          - "adoption.implementation_status == IN_EFFECT"
          - "adoption.transfer_window_status == TRANSFER_WINDOW_CLOSED"
          - "at least one VarianceObservation exists for every School where study_id == adoption.study_id and status == ACTIVE"
          - "no VarianceObservation where adoption_id == adoption.id has flag == CORRECTIVE_ACTION_REQUIRED"
        side_effects:
          - "sets implementation_status = MONITORING_CLOSED and increments AdoptionRecord.version by 1"
          - "study transitions IMPLEMENTATION -> CLOSED"
      - from: TRANSFER_WINDOW_OPEN
        to: TRANSFER_WINDOW_CLOSED
        trigger: "POST /redistricting/adoptions/{id}/close-transfer-window"
        actor: TransferOfficer
        preconditions:
          - "adoption.transfer_window_status == TRANSFER_WINDOW_OPEN"
          - "the current logical-clock instant > adoption.transfer_deadline_date"
        side_effects:
          - "sets transfer_window_status = TRANSFER_WINDOW_CLOSED and increments AdoptionRecord.version by 1"
          - "every TransferRequest where adoption_id == adoption.id and status in {SUBMITTED, WAITLISTED} transitions to DENIED with decision_notes = WINDOW_CLOSED, processed in TransferRequest.created_at ASC order"
        note: "Second, independent state dimension. transfer_window_status advances without regard to implementation_status - the window can close while the adoption is still PENDING_EFFECTIVE, and an adoption can reach IN_EFFECT with the window still TRANSFER_WINDOW_OPEN. The two dimensions are stored on the same AdoptionRecord row."

  - entity: PublicComment
    initial_state: SUBMITTED
    terminal_states: [ADDRESSED, DISMISSED]
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /redistricting/comments/{id}/triage"
        actor: EngagementCoordinator
        preconditions:
          - "comment.status == SUBMITTED"
          - "BoundaryScenario[comment.scenario_id].status in {UNDER_REVIEW, BOARD_READY}"
        side_effects:
          - "sets theme and priority from the request body"
          - "increments PublicComment.version by 1"
      - from: TRIAGED
        to: ADDRESSED
        trigger: "system: the comment id appears in cited_comment_ids of POST /redistricting/scenarios/{id}/request-revision"
        actor: system
        preconditions:
          - "comment.status == TRIAGED"
        side_effects:
          - "increments PublicComment.version by 1"
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /redistricting/comments/{id}/dismiss"
        actor: EngagementCoordinator
        preconditions:
          - "comment.status == TRIAGED"
        side_effects:
          - "sets dismissal_reason = OFFICER_DISMISSAL"
          - "increments PublicComment.version by 1"
      - from: SUBMITTED
        to: DISMISSED
        trigger: "system: BoundaryScenario[comment.scenario_id] transitions to REJECTED as link 3 of the adoption cascade"
        actor: system
        preconditions:
          - "comment.status == SUBMITTED"
        side_effects:
          - "sets dismissal_reason = SCENARIO_REJECTED"
          - "increments PublicComment.version by 1"
      - from: TRIAGED
        to: DISMISSED
        trigger: "system: BoundaryScenario[comment.scenario_id] transitions to REJECTED as link 3 of the adoption cascade"
        actor: system
        preconditions:
          - "comment.status == TRIAGED"
        side_effects:
          - "sets dismissal_reason = SCENARIO_REJECTED"
          - "increments PublicComment.version by 1"

  - entity: TransferRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /redistricting/transfer-requests/{id}/decide with decision == APPROVE"
        actor: TransferOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "adoption.implementation_status in {PENDING_EFFECTIVE, IN_EFFECT}"
          - "adoption.transfer_window_status == TRANSFER_WINDOW_OPEN"
          - "School[request.requested_school_id].status == ACTIVE"
          - "X-User-ID != request.guardian_user_id (segregation of duties)"
          - "transfer_eligibility_resolution yields resolved_reason != NONE"
          - "if request.consumes_seat_pool == true then transfer_seat_pool(request.requested_school_id) >= 1"
        side_effects:
          - "sets promotion_source = OFFICER_DECISION, decided_by_user_id = X-User-ID and decision_notes from the body"
          - "increments TransferRequest.version by 1"
          - "the approved inbound count raises School[requested_school_id] usage inside transfer_seat_pool for every later decision"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /redistricting/transfer-requests/{id}/decide with decision == DENY"
        actor: TransferOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "adoption.transfer_window_status == TRANSFER_WINDOW_OPEN"
          - "X-User-ID != request.guardian_user_id (segregation of duties)"
        side_effects:
          - "sets decided_by_user_id = X-User-ID and decision_notes from the body"
          - "increments TransferRequest.version by 1"
      - from: SUBMITTED
        to: WAITLISTED
        trigger: "POST /redistricting/transfer-requests/{id}/decide with decision == WAITLIST"
        actor: TransferOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "adoption.transfer_window_status == TRANSFER_WINDOW_OPEN"
          - "transfer_eligibility_resolution yields resolved_reason != NONE"
          - "request.consumes_seat_pool == true and transfer_seat_pool(request.requested_school_id) <= 0"
        side_effects:
          - "sets decided_by_user_id = X-User-ID and decision_notes from the body"
          - "increments TransferRequest.version by 1"
      - from: WAITLISTED
        to: APPROVED
        trigger: "POST /redistricting/transfer-requests/{id}/decide with decision == APPROVE"
        actor: TransferOfficer
        preconditions:
          - "request.status == WAITLISTED"
          - "adoption.transfer_window_status == TRANSFER_WINDOW_OPEN"
          - "transfer_seat_pool(request.requested_school_id) >= 1"
        side_effects:
          - "sets promotion_source = OFFICER_DECISION and decided_by_user_id = X-User-ID"
          - "increments TransferRequest.version by 1"
      - from: WAITLISTED
        to: APPROVED
        trigger: "system: link 4 of the activate cascade promotes the request because the requested school's transfer_seat_pool reached 1"
        actor: system
        preconditions:
          - "request.status == WAITLISTED"
          - "transfer_seat_pool(request.requested_school_id) >= 1 at the moment this request is reached in created_at ASC order"
        side_effects:
          - "sets promotion_source = WAITLIST_AUTO and leaves decided_by_user_id null"
          - "increments TransferRequest.version by 1"
      - from: WAITLISTED
        to: DENIED
        trigger: "system: POST /redistricting/adoptions/{id}/close-transfer-window"
        actor: system
        preconditions:
          - "request.status == WAITLISTED"
        side_effects:
          - "sets decision_notes = WINDOW_CLOSED"
          - "increments TransferRequest.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "system: POST /redistricting/adoptions/{id}/close-transfer-window"
        actor: system
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets decision_notes = WINDOW_CLOSED"
          - "increments TransferRequest.version by 1"
      - from: APPROVED
        to: WAITLISTED
        trigger: "system: compensation link 4 of POST /redistricting/adoptions/{id}/rescind"
        actor: system
        preconditions:
          - "request.status == APPROVED"
          - "request.promotion_source == WAITLIST_AUTO"
        side_effects:
          - "sets promotion_source = null"
          - "increments TransferRequest.version by 1"
        note: "Only auto-promotions are reverted; OFFICER_DECISION approvals survive a rescind."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent entity's version)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-scenario
    parent_entity: BoundaryScenario
    write_endpoint: "POST /redistricting/assignments"
    occ_field: "expected_scenario_version"
    description: |
      Creating an AreaAssignment against a BoundaryScenario whose version has advanced since
      the client last observed it is rejected. Assignment creation legitimately supersedes any
      existing non-superseded assignment for the same (scenario_id, area_id) pair, so a second
      create carrying the version observed before the first create would silently discard that
      supersede; the stale-version check surfaces it instead.
    error_id: ERR_STALE_SCENARIO_VERSION
    http_status: 412
  - rule_id: projection-run-create-stale-study
    parent_entity: BoundaryStudy
    write_endpoint: "POST /redistricting/studies/{id}/projection-runs"
    occ_field: "expected_study_version"
    description: |
      Creating a ProjectionRun against a BoundaryStudy whose version has advanced since the
      client last observed it is rejected. A new run legitimately supersedes the study's prior
      COMPLETE run of the same variant (the prior run moves to SUPERSEDED), so a create carrying
      a stale study version is acting on an outdated picture of which run is authoritative.
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412
  - rule_id: program-placement-replace-stale-scenario
    parent_entity: BoundaryScenario
    write_endpoint: "PUT /redistricting/scenarios/{id}/program-placements"
    occ_field: "expected_scenario_version"
    description: |
      Replacing the whole program_placements set on a BoundaryScenario whose version has
      advanced since the client last observed it is rejected. The PUT legitimately overwrites
      the prior set wholesale, so a replace carrying a stale scenario version would erase
      placements the client never saw.
    error_id: ERR_STALE_SCENARIO_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: area_enrollment_projection
    trigger: "POST /redistricting/studies/{id}/projection-runs - populates ProjectionRun.area_projections and ProjectionRun.projected_total_students"
    algorithm: forward_looking
    formula: |
      PROJECTION_EPOCH = the logical-clock instant at which the run is created
      horizon_end      = PROJECTION_EPOCH + horizon_years * 365 days   (365-day years, no leap adjustment)

      for each PlanningArea a where a.study_id == study.id, in a.created_at ASC order:
          base_students(a) = round_half_up(a.resident_student_count * (COHORT_SURVIVAL_RATE ** horizon_years), 0)

          dev_total(a) = 0
          for each HousingDevelopment d where d.area_id == a.id, in d.created_at ASC order:
              # --- inclusion set is VARIANT-DEPENDENT ---
              if variant == 'COHORT_SURVIVAL'      and d.entitlement_status not in {UNDER_CONSTRUCTION, COMPLETE}: skip d
              if variant == 'DEVELOPMENT_WEIGHTED' and d.entitlement_status == 'WITHDRAWN':                        skip d

              y = d.student_yield_override if d.student_yield_override is not null else UNIT_YIELD[d.unit_type]

              if variant == 'COHORT_SURVIVAL':
                  w   = 1.0
                  occ = 1.0
              else:
                  w              = ENTITLEMENT_WEIGHT[d.entitlement_status]
                  months_elapsed = floor((horizon_end - d.first_occupancy_date) / 30 days)   # 30-day months
                  occ            = min(1.0, max(0.0, months_elapsed / d.buildout_months))

              # ROUNDING ORDER IS PINNED: round EACH development's contribution to 2 dp,
              # THEN sum the rounded contributions. Summing raw contributions and rounding
              # the sum once is a DIFFERENT and INCORRECT result.
              dev_total(a) = dev_total(a) + round_half_up(d.total_units * y * w * occ, 2)

          development_students(a) = dev_total(a)
          projected_students(a)   = round_half_up(base_students(a) + dev_total(a), 0)

      area_projections           = [ {area_id, base_students, development_students, projected_students} ] in the same order
      projected_total_students   = sum over a of projected_students(a)     # whole students, never re-rounded
    input_set: "Every PlanningArea of the study (no status filter - areas have no lifecycle). Developments filtered by entitlement_status per the active variant: COHORT_SURVIVAL admits only {UNDER_CONSTRUCTION, COMPLETE}; DEVELOPMENT_WEIGHTED admits every status except WITHDRAWN."
    constants:
      COHORT_SURVIVAL_RATE: 0.98
      UNIT_YIELD_SINGLE_FAMILY: 0.42
      UNIT_YIELD_TOWNHOME: 0.25
      UNIT_YIELD_MULTI_FAMILY: 0.13
      ENTITLEMENT_WEIGHT_PROPOSED: 0.25
      ENTITLEMENT_WEIGHT_ENTITLED: 0.60
      ENTITLEMENT_WEIGHT_PERMITTED: 0.85
      ENTITLEMENT_WEIGHT_UNDER_CONSTRUCTION: 1.00
      ENTITLEMENT_WEIGHT_COMPLETE: 1.00
      ENTITLEMENT_WEIGHT_WITHDRAWN: 0.00
      DAYS_PER_YEAR: 365
      DAYS_PER_MONTH: 30
    precision: "Each development contribution: 2 decimal places, round_half_up, rounded BEFORE summation. base_students and projected_students: whole students, round_half_up. projected_total_students is the plain sum of whole-student area totals and is never re-rounded."
    variants:
      - name: COHORT_SURVIVAL
        when: "ProjectionRun.variant == 'COHORT_SURVIVAL' - the conservative demographer view used for board-facing baselines"
        difference: "Only developments already in UNDER_CONSTRUCTION or COMPLETE enter the sum, and each enters at full entitlement weight (1.00) and full occupancy (1.00) regardless of first_occupancy_date or buildout_months."
      - name: DEVELOPMENT_WEIGHTED
        when: "ProjectionRun.variant == 'DEVELOPMENT_WEIGHTED' - the planning-department view used to size capacity for the pipeline"
        difference: "Every non-WITHDRAWN development enters, discounted by ENTITLEMENT_WEIGHT[entitlement_status] and by the fraction of buildout months achieved by horizon_end. Identical study data therefore yields a strictly larger projected_total_students whenever any PROPOSED / ENTITLED / PERMITTED development exists, and a strictly smaller one for an UNDER_CONSTRUCTION development whose buildout extends past horizon_end."

  - name: school_capacity_utilization
    trigger: "POST /redistricting/scenarios/{id}/submit-for-review (recomputes BoundaryScenario.max_utilization_pct and total_assigned_students); also read by GET /redistricting/scenarios/{id}/impact-analysis"
    algorithm: threshold
    formula: |
      effective_capacity(s) = s.core_capacity_seats
                            + (s.portable_capacity_seats if study.portables_count_toward_capacity else 0)

      assigned_students(s, S) = sum of AreaAssignment.projected_students over rows where
                                  scenario_id == S.id and assigned_school_id == s.id and is_superseded == false
      program_seats(s, S)     = sum of entry.seats over S.program_placements entries where entry.school_id == s.id

      utilization_pct(s, S) = round_half_up(
            100.0 * (assigned_students(s, S) + program_seats(s, S)) / effective_capacity(s), 2)

      band(s, S) = 'UNDER'     if utilization_pct <  study.capacity_target_low_pct
                 = 'IN_TARGET' if study.capacity_target_low_pct <= utilization_pct <= study.capacity_target_high_pct
                 = 'OVER'      if study.capacity_target_high_pct < utilization_pct < CRITICAL_UTILIZATION_PCT
                 = 'CRITICAL'  if utilization_pct >= CRITICAL_UTILIZATION_PCT

      total_assigned_students(S) = sum of AreaAssignment.projected_students over non-superseded rows of S
      max_utilization_pct(S)     = max over Schools s where s.study_id == S.study_id and s.status == 'ACTIVE'
                                     of utilization_pct(s, S);  0.00 when that school set is empty
    input_set: "Non-superseded AreaAssignment rows of the scenario only (is_superseded == true rows are excluded). Schools filtered to status == ACTIVE; MOTHBALLED schools never contribute to max_utilization_pct."
    constants:
      CRITICAL_UTILIZATION_PCT: 110.00
    precision: "2 decimal places, round_half_up. Band boundaries are inclusive at BOTH ends of the target band (>= low and <= high) and inclusive at CRITICAL (>= 110.00): a school at exactly 110.00 is CRITICAL, a school at 109.99 is OVER."

  - name: transportation_cost_annual
    trigger: "POST /redistricting/scenarios/{id}/submit-for-review - recomputes BoundaryScenario.transport_cost_annual_usd and BoundaryScenario.walk_eligible_pct"
    algorithm: weighted_scoring
    formula: |
      raw_total     = 0.0
      walk_students = 0

      for each non-superseded AreaAssignment r of scenario S, in AreaAssignment.created_at ASC order:
          a = PlanningArea[r.area_id]
          s = School[r.assigned_school_id]
          t = the single entry of a.travel_options whose school_id == s.id
          n = r.projected_students

          # conditional branch on walkability - three interacting inputs
          if t.walk_distance_miles <= WALK_LIMIT_MILES[s.level] and t.has_safe_route == true:
              walk_students = walk_students + n
              riders        = 0
          else:
              riders        = n

          billed_minutes = max(t.bus_minutes, MIN_BILLED_MINUTES)      # nested max
          buses          = ceil(riders / BUS_CAPACITY)                 # nested ceil; 0 riders -> 0 buses
          cost_r         = buses * (DAILY_BUS_BASE_USD + PER_MINUTE_USD * billed_minutes) * SCHOOL_DAYS_PER_YEAR

          raw_total = raw_total + cost_r          # accumulated UNROUNDED

      transport_cost_annual_usd = round_half_up(raw_total, 2)          # rounded EXACTLY ONCE, at the end
      walk_eligible_pct         = round_half_up(100.0 * walk_students / total_assigned_students(S), 2)
                                  ;  0.00 when total_assigned_students(S) == 0
    input_set: "Non-superseded AreaAssignment rows of the scenario. Every such row must have a matching travel_options entry for its assigned school (enforced by ERR_TRAVEL_OPTION_MISSING at assignment creation), so the loop never encounters a missing option."
    constants:
      BUS_CAPACITY: 71
      DAILY_BUS_BASE_USD: 95.00
      PER_MINUTE_USD: 1.85
      MIN_BILLED_MINUTES: 15
      SCHOOL_DAYS_PER_YEAR: 180
      WALK_LIMIT_MILES_ELEMENTARY: 1.0
      WALK_LIMIT_MILES_MIDDLE: 1.5
      WALK_LIMIT_MILES_HIGH: 2.0
      MAX_RIDE_MINUTES_ELEMENTARY: 45
      MAX_RIDE_MINUTES_MIDDLE: 55
      MAX_RIDE_MINUTES_HIGH: 60
    precision: "Per-assignment costs are accumulated UNROUNDED and the scenario total is rounded to 2 decimal places (round_half_up) exactly once. This is deliberately the OPPOSITE order from area_enrollment_projection, which rounds every per-development term before summing. walk_eligible_pct: 2 decimal places, round_half_up. The walk test is inclusive: walk_distance_miles exactly equal to WALK_LIMIT_MILES[level] is walk-eligible."

  - name: transfer_seat_pool
    trigger: "Evaluated inside POST /redistricting/transfer-requests/{id}/decide, and once per candidate inside link 4 of POST /redistricting/adoptions/{id}/activate"
    algorithm: constraint_propagation
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, RESOLVED BY A PINNED EVALUATION ORDER:
      #   the pool bounds which requests may be approved, and approved requests shrink the pool.
      #   The pool is therefore defined as a pure function of the state that ALREADY EXISTS when a
      #   decision is evaluated: it counts only requests whose status is ALREADY 'APPROVED'.
      #   The request currently being decided is NEVER counted in its own pool.
      #   Batch promotion (activate cascade link 4) recomputes the pool after EACH individual
      #   promotion, walking candidates in TransferRequest.created_at ASC order, so the Nth
      #   promotion sees the effect of promotions 1..N-1.

      post_boundary_enrollment(s, A) = sum of AreaAssignment.projected_students over rows where
            scenario_id == A.scenario_id and assigned_school_id == s.id and is_superseded == false

      inbound_approved(s, A)  = count of TransferRequest where adoption_id == A.id
            and requested_school_id == s.id and status == 'APPROVED' and consumes_seat_pool == true
      outbound_approved(s, A) = count of TransferRequest where adoption_id == A.id
            and origin_school_id  == s.id and status == 'APPROVED' and consumes_seat_pool == true

      current_headcount(s, A) = post_boundary_enrollment(s, A) + inbound_approved(s, A) - outbound_approved(s, A)

      transfer_seat_pool(s, A) = floor(effective_capacity(s) * A.transfer_cap_pct / 100.0)
                                 - current_headcount(s, A)

      # Gates (exact, no tolerance):
      #   APPROVE  of a request with consumes_seat_pool == true requires transfer_seat_pool >= 1
      #   WAITLIST of a request with consumes_seat_pool == true requires transfer_seat_pool <= 0
      #   requests with consumes_seat_pool == false bypass the pool entirely
    input_set: "AreaAssignment rows of the adopted scenario (non-superseded only) plus TransferRequests of this adoption already in status APPROVED with consumes_seat_pool == true. Requests in SUBMITTED, WAITLISTED or DENIED never affect the pool."
    constants:
      SEAT_POOL_APPROVE_MINIMUM: 1
    precision: "floor() on the capped-capacity term (a fractional seat is not a seat); the pool itself is a signed integer and may be negative when the adopted scenario already over-fills a school."

  - name: demographic_impact_index
    trigger: "POST /redistricting/scenarios/{id}/submit-for-review (recomputes BoundaryScenario.frl_dissimilarity_index, students_reassigned_count, students_reassigned_pct); also returned by GET /redistricting/scenarios/{id}/impact-analysis"
    algorithm: weighted_scoring
    formula: |
      V = S.impact_variant
      frl[s] = 0.0 and nonfrl[s] = 0.0 for every School s where s.study_id == S.study_id and s.status == 'ACTIVE'

      for each non-superseded AreaAssignment r of S, in AreaAssignment.created_at ASC order:
          a = PlanningArea[r.area_id] ;  s = School[r.assigned_school_id]

          if V == 'RESIDENT_BASED':
              frl_a    = a.frl_student_count
              nonfrl_a = a.resident_student_count - a.frl_student_count

          if V == 'PROJECTED_BASED':
              p             = the area_projections entry of ProjectionRun[S.projection_run_id] for a.id
              area_frl_rate = a.frl_student_count / a.resident_student_count   ; 0.0 when resident_student_count == 0
              dev_frl_rate  = sum over the area's INCLUDED developments d of
                                  ( rounded_contribution(d) * DEVELOPMENT_FRL_RATE[d.unit_type] )
                              / p.development_students                          ; 0.0 when development_students == 0
                              # "INCLUDED" and rounded_contribution(d) are exactly the inclusion set and the
                              # per-development 2-dp rounded term that area_enrollment_projection produced
                              # for the run's own variant
              frl_a    = round_half_up(p.base_students * area_frl_rate + p.development_students * dev_frl_rate, 2)
              nonfrl_a = round_half_up(p.projected_students - frl_a, 2)

          frl[s]    = frl[s] + frl_a
          nonfrl[s] = nonfrl[s] + nonfrl_a

      FRL_TOTAL    = sum over s of frl[s]
      NONFRL_TOTAL = sum over s of nonfrl[s]
      if FRL_TOTAL == 0 or NONFRL_TOTAL == 0:
          frl_dissimilarity_index = 0.0000
      else:
          frl_dissimilarity_index = round_half_up(
              0.5 * sum over s of abs( frl[s]/FRL_TOTAL - nonfrl[s]/NONFRL_TOTAL ), 4)

      students_reassigned_count = sum of r.projected_students over non-superseded assignments r of S
                                  where r.assigned_school_id != PlanningArea[r.area_id].current_school_id
      students_reassigned_pct   = round_half_up(100.0 * students_reassigned_count / total_assigned_students(S), 2)
                                  ;  0.00 when total_assigned_students(S) == 0
    input_set: "Non-superseded AreaAssignment rows of the scenario; ACTIVE Schools of the study only. Under PROJECTED_BASED the development inclusion set is inherited verbatim from the run's own projection variant, so a COHORT_SURVIVAL run and a DEVELOPMENT_WEIGHTED run produce different indices for the same assignments."
    constants:
      DEVELOPMENT_FRL_RATE_SINGLE_FAMILY: 0.18
      DEVELOPMENT_FRL_RATE_TOWNHOME: 0.32
      DEVELOPMENT_FRL_RATE_MULTI_FAMILY: 0.54
    precision: "frl_a and nonfrl_a: 2 decimal places, round_half_up, rounded per assignment before accumulation. frl_dissimilarity_index: 4 decimal places, round_half_up, rounded once at the end. students_reassigned_pct: 2 decimal places, round_half_up."
    variants:
      - name: RESIDENT_BASED
        when: "BoundaryScenario.impact_variant == 'RESIDENT_BASED' - the equity view the board sees at first reading"
        difference: "Uses today's resident head counts (PlanningArea.frl_student_count and resident_student_count) unchanged; the housing pipeline is ignored entirely."
      - name: PROJECTED_BASED
        when: "BoundaryScenario.impact_variant == 'PROJECTED_BASED' - the equity view used for the final adoption packet"
        difference: "Scales each area's FRL split to the projected horizon head count and applies DEVELOPMENT_FRL_RATE per unit type to the development component, so multi-family-heavy areas shift FRL share between schools. Same assignments and same areas therefore yield a different frl_dissimilarity_index."

  - name: contiguity_evaluation
    trigger: "POST /redistricting/scenarios/{id}/submit-for-review - recomputes BoundaryScenario.contiguity_ok and BoundaryScenario.noncontiguous_school_ids"
    algorithm: topological
    formula: |
      # Undirected graph G over the study's planning areas.
      # Edge (u, v) exists iff an AreaAdjacency row exists with area_id == u and neighbor_area_id == v.
      # POST /redistricting/area-adjacencies always mints the reciprocal row, so G is stored symmetrically.

      for each School s where s.study_id == S.study_id and s.status == 'ACTIVE':
          V_s = { a : a non-superseded AreaAssignment exists with
                        scenario_id == S.id and area_id == a.id and assigned_school_id == s.id }

          if |V_s| == 0:
              s is CONTIGUOUS            # EMPTY-SET BOUNDARY: a school with zero assigned areas is
                                         # vacuously connected and never appears in noncontiguous_school_ids
          else:
              root = the member of V_s with the smallest PlanningArea.created_at
              run BFS from root over G, traversing an edge (u, v) only when BOTH u and v are in V_s
              s is CONTIGUOUS iff BFS visits every member of V_s

      contiguity_ok            = every ACTIVE School of the study is CONTIGUOUS
      noncontiguous_school_ids = ids of the non-contiguous ACTIVE Schools, ordered by School.created_at ASC
    input_set: "Non-superseded AreaAssignment rows of the scenario; AreaAdjacency rows of the study (both the client-created row and its server-minted reciprocal); ACTIVE Schools only."
    constants:
      MIN_COMPONENTS_FOR_VIOLATION: 2
    precision: "Integer graph traversal - no rounding. BFS root selection and noncontiguous_school_ids ordering both use created_at ASC; entity ids never influence the result."

  - name: board_vote_outcome
    trigger: "POST /redistricting/adoptions - computes AdoptionRecord.supermajority_required and gates the BOARD_READY -> ADOPTED transition"
    algorithm: threshold
    formula: |
      cast             = votes_for + votes_against + votes_abstain
      quorum_threshold = ceil(board_member_count / 2)
      quorum_met       = cast >= quorum_threshold                      # abstentions DO count toward quorum

      supermajority_required = BoundaryScenario[scenario_id].students_reassigned_pct > SUPERMAJORITY_TRIGGER_PCT

      if supermajority_required:
          majority_met = (votes_for * 3 >= 2 * (votes_for + votes_against))    # two-thirds of non-abstaining votes
      else:
          majority_met = (votes_for * 2 >  (votes_for + votes_against))        # strict simple majority

      # abstentions are EXCLUDED from the majority denominator in both branches
    input_set: "The three vote counts and board_member_count from the request body, plus the target scenario's students_reassigned_pct as recomputed at its most recent submit-for-review."
    constants:
      SUPERMAJORITY_TRIGGER_PCT: 15.00
    precision: "Integer comparisons only - the thresholds are expressed as cross-multiplied integers so no floating-point rounding can shift the outcome. The supermajority trigger is strict (> 15.00): a scenario at exactly 15.00 percent reassigned needs only a simple majority."

  - name: transfer_eligibility_resolution
    trigger: "POST /redistricting/transfer-requests (sets TransferRequest.resolved_reason and consumes_seat_pool) and re-evaluated inside POST /redistricting/transfer-requests/{id}/decide"
    algorithm: waterfall_allocation
    formula: |
      # Evaluate the four rungs in EXACTLY this order and stop at the first match.
      # Order is observable: a grade-5 student matching both a TERMINAL_GRADE_GRANDFATHER band and a
      # PHASE_IN_GRADE_BAND band resolves to TERMINAL_GRADE_GRANDFATHER and therefore does NOT consume
      # the seat pool. Reversing the rungs would consume a seat and could produce WAITLISTED instead.

      rung 1 TERMINAL_GRADE_GRANDFATHER:
          exists PhaseInRule p where p.adoption_id == A.id
             and p.rule_type == 'TERMINAL_GRADE_GRANDFATHER'
             and p.grade_low <= r.student_grade <= p.grade_high
             and A.effective_school_year <= p.sunset_school_year
          -> resolved_reason = 'TERMINAL_GRADE_GRANDFATHER', consumes_seat_pool = false

      rung 2 SIBLING_LINK:
          r.reason == 'SIBLING' and r.sibling_transfer_id is not null
             and TransferRequest[r.sibling_transfer_id].adoption_id          == A.id
             and TransferRequest[r.sibling_transfer_id].status               == 'APPROVED'
             and TransferRequest[r.sibling_transfer_id].requested_school_id  == r.requested_school_id
             and exists PhaseInRule p where p.adoption_id == A.id and p.rule_type == 'SIBLING_LINK'
                    and p.grade_low <= r.student_grade <= p.grade_high
                    and A.effective_school_year <= p.sunset_school_year
          -> resolved_reason = 'SIBLING_LINK', consumes_seat_pool = true

      rung 3 PHASE_IN_GRADE_BAND:
          exists PhaseInRule p where p.adoption_id == A.id
             and p.rule_type == 'PHASE_IN_GRADE_BAND'
             and p.grade_low <= r.student_grade <= p.grade_high
             and A.effective_school_year <= p.sunset_school_year
          -> resolved_reason = 'PHASE_IN_GRADE_BAND', consumes_seat_pool = false

      rung 4 HARDSHIP_REVIEW:
          r.reason == 'HARDSHIP'
          -> resolved_reason = 'HARDSHIP_REVIEW', consumes_seat_pool = true

      otherwise:
          resolved_reason = 'NONE', consumes_seat_pool = false
          # a NONE request may be created (status SUBMITTED) but can only ever be DENIED
    input_set: "Every PhaseInRule where adoption_id == A.id (rules have no lifecycle state, so all rows are candidates). Grade bands are CLOSED-CLOSED integer intervals: grade_low <= student_grade <= grade_high. The sunset test is inclusive on the adoption's effective_school_year."
    constants:
      MIN_GRADE: 0
      MAX_GRADE: 12
    precision: "Integer grade comparisons; both band endpoints inclusive. A student at exactly grade_high matches; a student at grade_high + 1 does not."

  - name: enrollment_variance_flag
    trigger: "POST /redistricting/adoptions/{id}/variance-observations - computes VarianceObservation.variance_pct and VarianceObservation.flag"
    algorithm: threshold
    formula: |
      if projected_enrollment == 0:
          reject the request with ERR_ZERO_PROJECTION_BASE (422); no VarianceObservation row is created

      variance_pct = round_half_up(
            100.0 * (observed_enrollment - projected_enrollment) / projected_enrollment, 2)

      tol = AdoptionRecord[adoption_id].variance_tolerance_pct

      flag = 'WITHIN_TOLERANCE'            if abs(variance_pct) <= tol
           = 'WATCH'                       if tol < abs(variance_pct) <= 2 * tol
           = 'CORRECTIVE_ACTION_REQUIRED'  if abs(variance_pct) > 2 * tol
    input_set: "The single observation being recorded, plus the parent adoption's variance_tolerance_pct. Prior observations for the same school are not aggregated - each row is flagged independently."
    constants:
      WATCH_MULTIPLIER: 2
    precision: "variance_pct: 2 decimal places, round_half_up, computed on the signed difference and then compared as an absolute value. Both band edges are inclusive on the lower side: abs(variance_pct) exactly equal to tol is WITHIN_TOLERANCE, exactly equal to 2 * tol is WATCH."

  - name: area_rolling_absorption
    trigger: "POST /redistricting/planning-areas/{id}/housing-developments - gates creation via ERR_AREA_ABSORPTION_EXCEEDED"
    algorithm: interval_merge
    formula: |
      # AGGREGATE-CAPACITY-OVER-A-SLIDING-WINDOW interval semantics.
      candidates = every HousingDevelopment d where d.area_id == a.id and d.entitlement_status != 'WITHDRAWN',
                   PLUS the development being created

      each d occupies the HALF-OPEN delivery window
            [ d.first_occupancy_date , d.first_occupancy_date + d.buildout_months * DAYS_PER_MONTH days )
      and delivers units uniformly across it:
            units_per_month(d) = d.total_units / d.buildout_months          # unrounded

      window_starts = { d.first_occupancy_date : d in candidates },
                      examined in ASC date order, ties broken by HousingDevelopment.created_at ASC

      for each W in window_starts:
          probe = [ W , W + ROLLING_ABSORPTION_WINDOW_MONTHS * DAYS_PER_MONTH days )    # half-open
          units_in_window(W) = sum over d in candidates of
                units_per_month(d) * overlap_months(delivery_window(d), probe)
          # overlap_months = length of the intersection of the two half-open windows, expressed in
          # 30-day months, UNROUNDED. Windows that merely touch (one's end == the other's start)
          # intersect in zero length and contribute exactly 0.

      absorption_peak(a) = round_half_up( max over W of units_in_window(W), 2 )
      violation iff absorption_peak(a) > a.annual_absorption_cap_units
    input_set: "All non-WITHDRAWN developments of the area plus the candidate. WITHDRAWN developments are excluded entirely, so withdrawing a development frees absorption capacity for a later creation."
    constants:
      ROLLING_ABSORPTION_WINDOW_MONTHS: 12
      DAYS_PER_MONTH: 30
    precision: "units_per_month and overlap_months are carried unrounded; only absorption_peak is rounded, to 2 decimal places, round_half_up. The cap test is strict (>): a peak exactly equal to annual_absorption_cap_units passes."

  - name: regime_window_overlap
    trigger: "POST /redistricting/adoptions - gates the BOARD_READY -> ADOPTED transition via ERR_REGIME_WINDOW_CONFLICT"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN SCHOOL-YEAR INTERVAL WITH A QUIET-PERIOD BUFFER.
      # Every AdoptionRecord occupies, on EVERY School of its study, the half-open school-year interval
      #     regime(X) = [ X.effective_school_year , X.effective_school_year + X.regime_years )

      candidate C is rejected when, for ANY existing AdoptionRecord A whose parent study has the same
      district_name as C's study and whose
      implementation_status != 'RESCINDED':

        (a) the intervals INTERSECT:
              C.effective_school_year < A.effective_school_year + A.regime_years
          and A.effective_school_year < C.effective_school_year + C.regime_years

        OR (b) the intervals are disjoint but the GAP is smaller than the buffer:
              0 <= C.effective_school_year - (A.effective_school_year + A.regime_years) < MIN_REGIME_YEARS
           or 0 <= A.effective_school_year - (C.effective_school_year + C.regime_years) < MIN_REGIME_YEARS

      # Consequence of the buffer clause: exactly ABUTTING regimes (gap == 0) are REJECTED, and a
      # one-school-year gap is also rejected. The first legal gap is MIN_REGIME_YEARS school years.
      # This is deliberately different interval arithmetic from area_rolling_absorption, which allows
      # touching windows and only rejects on an aggregate-capacity peak.
    input_set: "Every AdoptionRecord A such that BoundaryStudy[A.study_id].district_name == BoundaryStudy[C.study_id].district_name and A.implementation_status != RESCINDED. The regime is a DISTRICT-WIDE quiet period, not a per-study one, so the reachable conflict is a second study of the same district trying to adopt an abutting or overlapping regime. A RESCINDED adoption releases its regime interval, so a replacement adoption may reuse the same school years."
    constants:
      MIN_REGIME_YEARS: 2
    precision: "Integer school-year arithmetic; the interval is closed on the left and open on the right, and the buffer comparison is strict on the upper side (< MIN_REGIME_YEARS)."

# =============================================================================
# 1.4 Validation Rules Table
# =============================================================================
# Priority ladder (lower number wins when several rules are violated by the same request):
#   10 auth  <  20-25 authorization  <  30 existence  <  35 schema  <  40-47 state
#   <  48 concurrency  <  50-52 business_temporal  <  55-58 business_referential
#   <  60 business_safety  <  62 business_uniqueness  <  65-71 business_constraint
#   <  72-75 business_fiscal  <  80 computation
validations:
  - rule: caller_identity_present
    priority: 10
    category: auth
    condition: "X-User-ID or X-Role request header is absent or empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: ["every endpoint under /redistricting", "POST /_clock/set_current_utc"]

  - rule: caller_role_permitted
    priority: 20
    category: authorization
    condition: "X-Role is not a member of the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: ["every endpoint under /redistricting", "POST /_clock/set_current_utc"]

  - rule: scenario_author_may_not_review_own_scenario
    priority: 25
    category: authorization
    condition: "X-User-ID equals BoundaryScenario.author_user_id of the target scenario. Segregation of duties - the planner who authored a scenario may neither push it back to revision nor advance it to the board."
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    applies_to: ["POST /redistricting/scenarios/{id}/request-revision", "POST /redistricting/scenarios/{id}/advance-to-board"]

  - rule: scenario_author_may_not_adopt_own_scenario
    priority: 25
    category: authorization
    condition: "X-User-ID equals BoundaryScenario.author_user_id of the scenario named in scenario_id. Segregation of duties on the board vote."
    error_id: ERR_SELF_ADOPTION_FORBIDDEN
    http_status: 403
    applies_to: ["POST /redistricting/adoptions"]

  - rule: guardian_may_not_decide_own_request
    priority: 25
    category: authorization
    condition: "X-User-ID equals TransferRequest.guardian_user_id of the target request. Segregation of duties - an operator may not decide a request they filed."
    error_id: ERR_SELF_DECISION_FORBIDDEN
    http_status: 403
    applies_to: ["POST /redistricting/transfer-requests/{id}/decide"]

  - rule: study_exists
    priority: 30
    category: existence
    condition: "The study id in the path or in study_id does not resolve to a BoundaryStudy."
    error_id: ERR_STUDY_NOT_FOUND
    http_status: 404
    applies_to: ["every endpoint that names a study by path id or study_id"]

  - rule: school_exists
    priority: 30
    category: existence
    condition: "A school id in the path, in a body field (current_school_id, assigned_school_id, requested_school_id, school_id) or in a program_placements entry does not resolve to a School."
    error_id: ERR_SCHOOL_NOT_FOUND
    http_status: 404
    applies_to: ["GET /redistricting/schools/{id}", "PATCH /redistricting/schools/{id}", "POST /redistricting/planning-areas", "POST /redistricting/assignments", "PUT /redistricting/scenarios/{id}/program-placements", "POST /redistricting/transfer-requests", "POST /redistricting/adoptions/{id}/variance-observations"]

  - rule: planning_area_exists
    priority: 30
    category: existence
    condition: "A planning area id in the path or in area_id / neighbor_area_id does not resolve to a PlanningArea."
    error_id: ERR_AREA_NOT_FOUND
    http_status: 404
    applies_to: ["GET /redistricting/planning-areas/{id}", "GET /redistricting/planning-areas/{id}/adjacencies", "GET /redistricting/planning-areas/{id}/housing-developments", "POST /redistricting/planning-areas/{id}/housing-developments", "POST /redistricting/area-adjacencies", "POST /redistricting/assignments", "POST /redistricting/comments", "POST /redistricting/transfer-requests"]

  - rule: housing_development_exists
    priority: 30
    category: existence
    condition: "The development id in the path does not resolve to a HousingDevelopment."
    error_id: ERR_DEVELOPMENT_NOT_FOUND
    http_status: 404
    applies_to: ["POST /redistricting/housing-developments/{id}/entitlement-advance"]

  - rule: projection_run_exists
    priority: 30
    category: existence
    condition: "The run id in the path or in projection_run_id does not resolve to a ProjectionRun."
    error_id: ERR_PROJECTION_RUN_NOT_FOUND
    http_status: 404
    applies_to: ["GET /redistricting/projection-runs/{id}", "POST /redistricting/scenarios"]

  - rule: scenario_exists
    priority: 30
    category: existence
    condition: "The scenario id in the path or in scenario_id does not resolve to a BoundaryScenario."
    error_id: ERR_SCENARIO_NOT_FOUND
    http_status: 404
    applies_to: ["GET /redistricting/scenarios/{id}", "GET /redistricting/scenarios/{id}/impact-analysis", "POST /redistricting/scenarios/{id}/submit-for-review", "POST /redistricting/scenarios/{id}/request-revision", "POST /redistricting/scenarios/{id}/advance-to-board", "PUT /redistricting/scenarios/{id}/program-placements", "POST /redistricting/assignments", "POST /redistricting/comments", "POST /redistricting/adoptions"]

  - rule: assignment_exists
    priority: 30
    category: existence
    condition: "The assignment id in the path does not resolve to an AreaAssignment."
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: ["GET /redistricting/assignments/{id}"]

  - rule: comment_exists
    priority: 30
    category: existence
    condition: "The comment id in the path does not resolve to a PublicComment."
    error_id: ERR_COMMENT_NOT_FOUND
    http_status: 404
    applies_to: ["GET /redistricting/comments/{id}", "POST /redistricting/comments/{id}/triage", "POST /redistricting/comments/{id}/dismiss", "POST /redistricting/scenarios/{id}/request-revision"]

  - rule: adoption_exists
    priority: 30
    category: existence
    condition: "The adoption id in the path or in adoption_id does not resolve to an AdoptionRecord."
    error_id: ERR_ADOPTION_NOT_FOUND
    http_status: 404
    applies_to: ["GET /redistricting/adoptions/{id}", "GET /redistricting/adoptions/{id}/phase-in-rules", "POST /redistricting/adoptions/{id}/phase-in-rules", "POST /redistricting/adoptions/{id}/activate", "POST /redistricting/adoptions/{id}/rescind", "POST /redistricting/adoptions/{id}/close-transfer-window", "POST /redistricting/adoptions/{id}/close-monitoring", "POST /redistricting/adoptions/{id}/variance-observations", "POST /redistricting/transfer-requests"]

  - rule: transfer_request_exists
    priority: 30
    category: existence
    condition: "The transfer request id in the path or in sibling_transfer_id does not resolve to a TransferRequest."
    error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: ["GET /redistricting/transfer-requests/{id}", "POST /redistricting/transfer-requests/{id}/decide", "POST /redistricting/transfer-requests"]

  - rule: variance_observation_exists
    priority: 30
    category: existence
    condition: "The observation id in the path does not resolve to a VarianceObservation."
    error_id: ERR_OBSERVATION_NOT_FOUND
    http_status: 404
    applies_to: ["GET /redistricting/variance-observations/{id}"]

  - rule: request_body_well_formed
    priority: 35
    category: schema
    condition: "A required input field is absent or null; an enum field carries a value outside its declared member list; an integer field that must be positive is <= 0 (total_units, buildout_months, regime_years, core_capacity_seats, board_member_count); a vote count or seats value is negative; student_grade is outside 0..12; grade_low > grade_high; a percent field is outside 0..1000; limit is outside 1..200; offset is negative; travel_options or program_placements is empty; a travel_options entry omits school_id, walk_distance_miles, bus_minutes or has_safe_route; a program_placements entry omits program_type, school_id or seats."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: ["every mutating endpoint", "every list endpoint that accepts limit/offset"]

  - rule: study_phase_permits_operation
    priority: 40
    category: state
    condition: "The study is not in a phase that permits the operation - lock-data requires SETUP; open-engagement requires SCENARIO_DEVELOPMENT; creating a projection run requires status in {DATA_LOCKED, SCENARIO_DEVELOPMENT, ENGAGEMENT}; creating a scenario requires status in {DATA_LOCKED, SCENARIO_DEVELOPMENT}; submit-for-review requires status in {DATA_LOCKED, SCENARIO_DEVELOPMENT, ENGAGEMENT}; advance-to-board requires ENGAGEMENT; creating an adoption requires BOARD_DECISION; posting a comment requires comment_intake_open == true."
    error_id: ERR_STUDY_PHASE_INVALID
    http_status: 409
    applies_to: ["POST /redistricting/studies/{id}/lock-data", "POST /redistricting/studies/{id}/open-engagement", "POST /redistricting/studies/{id}/projection-runs", "POST /redistricting/scenarios", "POST /redistricting/scenarios/{id}/submit-for-review", "POST /redistricting/scenarios/{id}/advance-to-board", "POST /redistricting/adoptions", "POST /redistricting/comments"]

  - rule: seed_data_editable_only_before_lock
    priority: 42
    category: state
    condition: "The study's status is not SETUP, so its seed inventory (schools, planning areas, adjacency graph) may no longer be extended."
    error_id: ERR_STUDY_DATA_LOCKED
    http_status: 409
    applies_to: ["POST /redistricting/studies/{id}/schools", "POST /redistricting/planning-areas", "POST /redistricting/area-adjacencies"]

  - rule: scenario_editable
    priority: 44
    category: state
    condition: "BoundaryScenario.status is not in {DRAFT, REVISION}, so its assignment set and program placements are frozen and it cannot be resubmitted for review."
    error_id: ERR_SCENARIO_NOT_EDITABLE
    http_status: 409
    applies_to: ["POST /redistricting/assignments", "PUT /redistricting/scenarios/{id}/program-placements", "POST /redistricting/scenarios/{id}/submit-for-review"]

  - rule: scenario_under_review
    priority: 44
    category: state
    condition: "For request-revision the scenario must be in UNDER_REVIEW or BOARD_READY; for advance-to-board it must be in UNDER_REVIEW."
    error_id: ERR_SCENARIO_NOT_REVIEWABLE
    http_status: 409
    applies_to: ["POST /redistricting/scenarios/{id}/request-revision", "POST /redistricting/scenarios/{id}/advance-to-board"]

  - rule: scenario_board_ready
    priority: 44
    category: state
    condition: "BoundaryScenario.status is not BOARD_READY, so the board may not adopt it."
    error_id: ERR_SCENARIO_NOT_BOARD_READY
    http_status: 409
    applies_to: ["POST /redistricting/adoptions"]

  - rule: school_active
    priority: 45
    category: state
    condition: "A referenced School has status == MOTHBALLED - it may not receive an area assignment, host a program placement, or be the requested school of a transfer."
    error_id: ERR_SCHOOL_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /redistricting/assignments", "PUT /redistricting/scenarios/{id}/program-placements", "POST /redistricting/transfer-requests"]

  - rule: comment_status_permits_operation
    priority: 45
    category: state
    condition: "triage requires PublicComment.status == SUBMITTED and BoundaryScenario[comment.scenario_id].status in {UNDER_REVIEW, BOARD_READY}; dismiss requires status in {SUBMITTED, TRIAGED}; a comment cited by request-revision must be in TRIAGED."
    error_id: ERR_COMMENT_STATE_INVALID
    http_status: 409
    applies_to: ["POST /redistricting/comments/{id}/triage", "POST /redistricting/comments/{id}/dismiss", "POST /redistricting/scenarios/{id}/request-revision"]

  - rule: adoption_status_permits_operation
    priority: 46
    category: state
    condition: "activate requires implementation_status == PENDING_EFFECTIVE; rescind requires IN_EFFECT; close-monitoring requires IN_EFFECT; close-transfer-window requires transfer_window_status == TRANSFER_WINDOW_OPEN; recording a variance observation requires implementation_status == IN_EFFECT; creating a phase-in rule requires implementation_status == PENDING_EFFECTIVE."
    error_id: ERR_ADOPTION_STATE_INVALID
    http_status: 409
    applies_to: ["POST /redistricting/adoptions/{id}/activate", "POST /redistricting/adoptions/{id}/rescind", "POST /redistricting/adoptions/{id}/close-monitoring", "POST /redistricting/adoptions/{id}/close-transfer-window", "POST /redistricting/adoptions/{id}/variance-observations", "POST /redistricting/adoptions/{id}/phase-in-rules"]

  - rule: transfer_request_decidable
    priority: 46
    category: state
    condition: "TransferRequest.status is not in {SUBMITTED, WAITLISTED}, so no further officer decision is accepted."
    error_id: ERR_TRANSFER_NOT_DECIDABLE
    http_status: 409
    applies_to: ["POST /redistricting/transfer-requests/{id}/decide"]

  - rule: transfer_window_open
    priority: 46
    category: state
    condition: "AdoptionRecord.transfer_window_status == TRANSFER_WINDOW_CLOSED, so intake is shut regardless of the deadline date."
    error_id: ERR_TRANSFER_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /redistricting/transfer-requests"]

  - rule: projection_not_stale
    priority: 47
    category: state
    condition: "The scenario's referenced ProjectionRun.status is STALE or SUPERSEDED (BoundaryScenario.projection_stale == true), so the scenario's scores cannot be certified."
    error_id: ERR_PROJECTION_STALE
    http_status: 409
    applies_to: ["POST /redistricting/scenarios/{id}/submit-for-review", "POST /redistricting/scenarios/{id}/advance-to-board", "POST /redistricting/adoptions"]

  - rule: scenario_version_current
    priority: 48
    category: concurrency
    condition: "expected_scenario_version does not equal the parent BoundaryScenario's current version field."
    error_id: ERR_STALE_SCENARIO_VERSION
    http_status: 412
    applies_to: ["POST /redistricting/assignments", "PUT /redistricting/scenarios/{id}/program-placements"]

  - rule: study_version_current
    priority: 48
    category: concurrency
    condition: "expected_study_version does not equal the parent BoundaryStudy's current version field."
    error_id: ERR_STALE_STUDY_VERSION
    http_status: 412
    applies_to: ["POST /redistricting/studies/{id}/projection-runs"]

  - rule: transfer_deadline_not_passed
    priority: 50
    category: business_temporal
    condition: "The current logical-clock instant is strictly after AdoptionRecord.transfer_deadline_date."
    error_id: ERR_TRANSFER_WINDOW_EXPIRED
    http_status: 409
    applies_to: ["POST /redistricting/transfer-requests"]

  - rule: effective_date_reached
    priority: 51
    category: business_temporal
    condition: "The current logical-clock instant is strictly before AdoptionRecord.effective_date, so the regime may not be activated yet."
    error_id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    applies_to: ["POST /redistricting/adoptions/{id}/activate"]

  - rule: adoption_date_window_ordered
    priority: 52
    category: business_temporal
    condition: "transfer_deadline_date is not strictly after effective_date, or effective_school_year is less than the study's target_school_year, or a PhaseInRule sunset_school_year is less than the adoption's effective_school_year."
    error_id: ERR_INVALID_DATE_WINDOW
    http_status: 422
    applies_to: ["POST /redistricting/adoptions", "POST /redistricting/adoptions/{id}/phase-in-rules"]

  - rule: travel_option_present
    priority: 55
    category: business_referential
    condition: "PlanningArea.travel_options contains no entry whose school_id equals the assigned school, so walkability and ride time are unknown for the pair."
    error_id: ERR_TRAVEL_OPTION_MISSING
    http_status: 422
    applies_to: ["POST /redistricting/assignments"]

  - rule: school_level_matches_area_grade_band
    priority: 56
    category: business_referential
    condition: "School.level does not equal PlanningArea.grade_band for the pair being linked."
    error_id: ERR_SCHOOL_LEVEL_MISMATCH
    http_status: 422
    applies_to: ["POST /redistricting/assignments", "POST /redistricting/transfer-requests"]

  - rule: references_share_one_study
    priority: 57
    category: business_referential
    condition: "Two referenced entities resolve to different BoundaryStudy ids - an area and a school in different studies, two adjacency endpoints in different studies, a scenario and a projection run in different studies, or an adoption whose scenario belongs to another study."
    error_id: ERR_CROSS_STUDY_REFERENCE
    http_status: 422
    applies_to: ["POST /redistricting/planning-areas", "POST /redistricting/area-adjacencies", "POST /redistricting/scenarios", "POST /redistricting/assignments", "PUT /redistricting/scenarios/{id}/program-placements", "POST /redistricting/adoptions", "POST /redistricting/adoptions/{id}/variance-observations"]

  - rule: adjacency_endpoints_distinct
    priority: 57
    category: business_referential
    condition: "area_id equals neighbor_area_id - an area cannot be adjacent to itself."
    error_id: ERR_SELF_ADJACENCY
    http_status: 422
    applies_to: ["POST /redistricting/area-adjacencies"]

  - rule: program_host_capable
    priority: 57
    category: business_referential
    condition: "A program_placements entry names a school whose program_types array does not contain the entry's program_type."
    error_id: ERR_PROGRAM_HOST_INCAPABLE
    http_status: 422
    applies_to: ["PUT /redistricting/scenarios/{id}/program-placements"]

  - rule: sibling_link_valid
    priority: 58
    category: business_referential
    condition: "reason == SIBLING and the sibling link is unusable - sibling_transfer_id is null, or the linked request belongs to a different adoption, or its status is not APPROVED, or its requested_school_id differs from this request's requested_school_id, or it is the request itself."
    error_id: ERR_SIBLING_LINK_INVALID
    http_status: 422
    applies_to: ["POST /redistricting/transfer-requests"]

  - rule: ride_time_within_limit
    priority: 60
    category: business_safety
    condition: "The matching travel_options entry is not walk-eligible and its bus_minutes exceeds MAX_RIDE_MINUTES[School.level] - the ride is too long to be assigned to a student."
    error_id: ERR_RIDE_TIME_EXCEEDED
    http_status: 422
    applies_to: ["POST /redistricting/assignments"]

  - rule: adjacency_pair_unique
    priority: 62
    category: business_uniqueness
    condition: "An AreaAdjacency row already exists for the unordered pair {area_id, neighbor_area_id}, in either direction."
    error_id: ERR_DUPLICATE_ADJACENCY
    http_status: 409
    applies_to: ["POST /redistricting/area-adjacencies"]

  - rule: names_unique_within_scope
    priority: 62
    category: business_uniqueness
    condition: "School.name or BoundaryScenario.name is already used inside the study; PlanningArea.area_code is already used inside the study; TransferRequest.student_reference is already used inside the adoption."
    error_id: ERR_DUPLICATE_NAME
    http_status: 409
    applies_to: ["POST /redistricting/studies/{id}/schools", "POST /redistricting/planning-areas", "POST /redistricting/scenarios", "POST /redistricting/transfer-requests"]

  - rule: contiguity_required
    priority: 65
    category: business_constraint
    condition: "contiguity_evaluation reports contiguity_ok == false - at least one ACTIVE school's assigned-area set splits into two or more connected components of the adjacency graph."
    error_id: ERR_CONTIGUITY_BROKEN
    http_status: 409
    applies_to: ["POST /redistricting/scenarios/{id}/submit-for-review"]

  - rule: required_programs_placed_once
    priority: 66
    category: business_constraint
    condition: "A member of BoundaryStudy.required_program_types appears zero times or more than once in BoundaryScenario.program_placements."
    error_id: ERR_PROGRAM_PLACEMENT_INCOMPLETE
    http_status: 409
    applies_to: ["POST /redistricting/scenarios/{id}/submit-for-review"]

  - rule: program_host_has_assigned_area
    priority: 66
    category: business_constraint
    condition: "A program_placements entry names a school that has zero non-superseded AreaAssignment rows in this scenario - the host school would have no attendance area to draw from."
    error_id: ERR_PROGRAM_HOST_UNASSIGNED
    http_status: 409
    applies_to: ["POST /redistricting/scenarios/{id}/submit-for-review"]

  - rule: phase_in_bands_disjoint
    priority: 67
    category: business_constraint
    condition: "An existing PhaseInRule of the same adoption with the same rule_type has a CLOSED-CLOSED grade band that intersects the candidate band: existing.grade_low <= candidate.grade_high and candidate.grade_low <= existing.grade_high. Bands that merely abut (existing.grade_high + 1 == candidate.grade_low) are accepted."
    error_id: ERR_PHASE_IN_BAND_OVERLAP
    http_status: 409
    applies_to: ["POST /redistricting/adoptions/{id}/phase-in-rules"]

  - rule: boundary_regime_window_clear
    priority: 68
    category: business_constraint
    condition: "regime_window_overlap rejects the candidate - a non-RESCINDED AdoptionRecord belonging to any BoundaryStudy with the same district_name occupies an intersecting half-open school-year regime interval, or a disjoint interval separated by fewer than MIN_REGIME_YEARS school years."
    error_id: ERR_REGIME_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /redistricting/adoptions"]

  - rule: area_absorption_within_cap
    priority: 69
    category: business_constraint
    condition: "area_rolling_absorption reports absorption_peak(area) strictly greater than PlanningArea.annual_absorption_cap_units once the candidate development is included."
    error_id: ERR_AREA_ABSORPTION_EXCEEDED
    http_status: 409
    applies_to: ["POST /redistricting/planning-areas/{id}/housing-developments"]

  - rule: revision_rounds_within_limit
    priority: 70
    category: business_constraint
    condition: "BoundaryScenario.revision_round is already >= MAX_REVISION_ROUNDS, so the engagement loop may not run again."
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: ["POST /redistricting/scenarios/{id}/request-revision"]

  - rule: high_priority_comments_addressed
    priority: 71
    category: business_constraint
    condition: "At least one PublicComment where scenario_id == the target scenario still has status == SUBMITTED - every comment must be triaged (or dismissed) before the board reading."
    error_id: ERR_UNADDRESSED_COMMENTS
    http_status: 409
    applies_to: ["POST /redistricting/scenarios/{id}/advance-to-board"]

  - rule: no_school_at_critical_utilization
    priority: 72
    category: business_fiscal
    condition: "school_capacity_utilization reports max_utilization_pct >= CRITICAL_UTILIZATION_PCT (110.00) for the scenario."
    error_id: ERR_SCHOOL_CAPACITY_CRITICAL
    http_status: 409
    applies_to: ["POST /redistricting/scenarios/{id}/submit-for-review"]

  - rule: transfer_seats_available
    priority: 73
    category: business_fiscal
    condition: "decision == APPROVE, the request's consumes_seat_pool is true, and transfer_seat_pool(requested_school, adoption) is less than SEAT_POOL_APPROVE_MINIMUM (1)."
    error_id: ERR_NO_TRANSFER_SEATS
    http_status: 409
    applies_to: ["POST /redistricting/transfer-requests/{id}/decide"]

  - rule: board_quorum_met
    priority: 74
    category: business_fiscal
    condition: "board_vote_outcome reports quorum_met == false - votes_for + votes_against + votes_abstain is below ceil(board_member_count / 2)."
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: ["POST /redistricting/adoptions"]

  - rule: board_majority_met
    priority: 75
    category: business_fiscal
    condition: "board_vote_outcome reports majority_met == false under the applicable threshold (strict simple majority, or two-thirds of non-abstaining votes when supermajority_required is true)."
    error_id: ERR_MAJORITY_NOT_MET
    http_status: 409
    applies_to: ["POST /redistricting/adoptions"]

  - rule: projection_base_nonzero
    priority: 80
    category: computation
    condition: "projected_enrollment is 0, so the variance percentage is undefined."
    error_id: ERR_ZERO_PROJECTION_BASE
    http_status: 422
    applies_to: ["POST /redistricting/adoptions/{id}/variance-observations"]

  - rule: study_setup_complete
    priority: 41
    category: state
    condition: "The study cannot be locked because its seed inventory is incomplete - fewer than 2 ACTIVE schools, fewer than 3 planning areas, some planning area has no AreaAdjacency row whose area_id is that area, or some planning area's travel_options does not contain exactly one entry per ACTIVE school of the study whose level equals that area's grade_band."
    error_id: ERR_STUDY_SETUP_INCOMPLETE
    http_status: 409
    applies_to: ["POST /redistricting/studies/{id}/lock-data"]

  - rule: engagement_needs_reviewed_scenario
    priority: 41
    category: state
    condition: "No BoundaryScenario of the study is in UNDER_REVIEW, so there is nothing for the public to comment on."
    error_id: ERR_NO_SCENARIO_UNDER_REVIEW
    http_status: 409
    applies_to: ["POST /redistricting/studies/{id}/open-engagement"]

  - rule: entitlement_stage_successor
    priority: 43
    category: state
    condition: "to_status is neither the immediate successor of the development's current entitlement_status in PROPOSED -> ENTITLED -> PERMITTED -> UNDER_CONSTRUCTION -> COMPLETE nor WITHDRAWN, or the development is already in a terminal stage (COMPLETE or WITHDRAWN). Stages may not be skipped and may not be walked backwards."
    error_id: ERR_ENTITLEMENT_STAGE_INVALID
    http_status: 409
    applies_to: ["POST /redistricting/housing-developments/{id}/entitlement-advance"]

  - rule: every_area_assigned_once
    priority: 64
    category: business_constraint
    condition: "Some PlanningArea of the study has zero non-superseded AreaAssignment rows in this scenario, or more than one - a scenario must partition the study's areas exactly."
    error_id: ERR_AREA_UNASSIGNED
    http_status: 409
    applies_to: ["POST /redistricting/scenarios/{id}/submit-for-review"]

  - rule: transfer_has_eligibility_basis
    priority: 71
    category: business_constraint
    condition: "decision is APPROVE or WAITLIST and transfer_eligibility_resolution yields resolved_reason == NONE - no grandfathering, sibling, phase-in or hardship basis applies, so the request can only be DENIED."
    error_id: ERR_NO_ELIGIBILITY_BASIS
    http_status: 409
    applies_to: ["POST /redistricting/transfer-requests/{id}/decide"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- BoundaryStudy -------------------------------------------------------
  - method: POST
    path: /redistricting/studies
    roles: [DistrictPlanner]
    code: 201
    description: Open a new boundary study in SETUP.
    input: ["name", "district_name", "target_school_year", "horizon_years", "capacity_target_low_pct", "capacity_target_high_pct", "portables_count_toward_capacity?", "required_program_types"]
    output: BoundaryStudy
    side_effects:
      - "status is set to SETUP; comment_intake_open false; data_locked_at null; projection_stale false."
      - "resident_student_total and enrolled_of_record_total are initialised to 0."
      - "portables_count_toward_capacity defaults to false when omitted."
      - "version is initialised to 1."

  - method: GET
    path: /redistricting/studies/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: Read one boundary study, including its recomputed roll-up totals.
    input: []
    output: BoundaryStudy
    side_effects: []

  - method: POST
    path: /redistricting/studies/{id}/lock-data
    roles: [DistrictPlanner]
    code: 200
    description: Freeze the study's seed inventory so projections and scenarios may be built (SETUP -> DATA_LOCKED).
    input: []
    output: BoundaryStudy
    side_effects:
      - "status SETUP -> DATA_LOCKED."
      - "data_locked_at is stamped with the current logical-clock instant."
      - "Further POST /redistricting/studies/{id}/schools, POST /redistricting/planning-areas and POST /redistricting/area-adjacencies calls are rejected with ERR_STUDY_DATA_LOCKED."

  - method: POST
    path: /redistricting/studies/{id}/open-engagement
    roles: [EngagementCoordinator]
    code: 200
    description: Open public comment intake on the study's scenarios (SCENARIO_DEVELOPMENT -> ENGAGEMENT).
    input: []
    output: BoundaryStudy
    side_effects:
      - "status SCENARIO_DEVELOPMENT -> ENGAGEMENT."
      - "comment_intake_open is recomputed to true, which is what permits POST /redistricting/comments."

  # --- School --------------------------------------------------------------
  - method: POST
    path: /redistricting/studies/{id}/schools
    roles: [DistrictPlanner]
    code: 201
    description: Add a school to a study still in SETUP.
    input: ["name", "level", "core_capacity_seats", "portable_capacity_seats?", "program_types?", "status?"]
    output: School
    side_effects:
      - "study_id is taken from the path; status defaults to ACTIVE; portable_capacity_seats defaults to 0; program_types defaults to an empty array."
      - "effective_capacity_seats is computed as core_capacity_seats + (portable_capacity_seats if study.portables_count_toward_capacity else 0)."
      - "enrolled_students_of_record is initialised to 0."

  - method: GET
    path: /redistricting/studies/{id}/schools
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: List the schools of one study, ordered by School.created_at ASC.
    input: ["level?", "status?", "limit?", "offset?"]
    output: School[]
    side_effects: []

  - method: GET
    path: /redistricting/schools/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: Read one school, including effective_capacity_seats and enrolled_students_of_record.
    input: []
    output: School
    side_effects: []

  - method: PATCH
    path: /redistricting/schools/{id}
    roles: [DistrictPlanner]
    code: 200
    description: Adjust a school's capacity, hostable programs or operational status. This is the only path that produces status == MOTHBALLED.
    input: ["core_capacity_seats?", "portable_capacity_seats?", "program_types?", "status?"]
    output: School
    side_effects:
      - "effective_capacity_seats is recomputed from the new seat counts and the study's portables_count_toward_capacity flag."
      - "Setting status to MOTHBALLED makes the school ineligible for new AreaAssignment rows, program placements and transfer requests, and removes it from the max_utilization_pct and contiguity_evaluation input sets."
      - "Only fields present in the request body are changed; omitted fields keep their stored values."

  # --- PlanningArea --------------------------------------------------------
  - method: POST
    path: /redistricting/planning-areas
    roles: [DistrictPlanner]
    code: 201
    description: Register a planning area with its demographic profile and its per-school travel options.
    input: [study_id, area_code, grade_band, current_school_id, resident_student_count, frl_student_count, ell_student_count, median_household_income_usd, annual_absorption_cap_units, travel_options]
    output: PlanningArea
    side_effects:
      - "previous_school_id is initialised to null."
      - "BoundaryStudy.resident_student_total is recomputed as the sum of resident_student_count over the study's areas."
      - "School[current_school_id].enrolled_students_of_record is recomputed, then BoundaryStudy.enrolled_of_record_total is recomputed from the study's schools."

  - method: GET
    path: /redistricting/planning-areas
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: List planning areas, filterable by owning study and by school of record, ordered by PlanningArea.created_at ASC.
    input: ["study_id?", "current_school_id?", "previous_school_id?", "grade_band?", "limit?", "offset?"]
    output: PlanningArea[]
    side_effects: []

  - method: GET
    path: /redistricting/planning-areas/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: Read one planning area, including its travel_options array.
    input: []
    output: PlanningArea
    side_effects: []

  # --- AreaAdjacency -------------------------------------------------------
  - method: POST
    path: /redistricting/area-adjacencies
    roles: [DistrictPlanner]
    code: 201
    description: Declare that two planning areas share a boundary. The server stores the adjacency graph symmetrically.
    input: [area_id, neighbor_area_id, shared_boundary_length_ft]
    output: AreaAdjacency
    side_effects:
      - "The returned row carries is_reciprocal false."
      - "A mirror AreaAdjacency row with area_id and neighbor_area_id swapped, the same shared_boundary_length_ft and is_reciprocal true is created in the same request, so contiguity_evaluation sees an undirected edge."
      - "Both rows are immutable - AreaAdjacency has common_fields false and no update endpoint."

  - method: GET
    path: /redistricting/planning-areas/{id}/adjacencies
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer]
    code: 200
    description: List every adjacency row whose area_id or neighbor_area_id is the path area, ordered by AreaAdjacency.created_at ASC.
    input: ["is_reciprocal?", "limit?", "offset?"]
    output: AreaAdjacency[]
    side_effects: []

  # --- HousingDevelopment --------------------------------------------------
  - method: POST
    path: /redistricting/planning-areas/{id}/housing-developments
    roles: [DistrictPlanner]
    code: 201
    description: Add a development to an area's housing pipeline. Gated by the area's rolling absorption cap.
    input: ["name", "unit_type", "total_units", "first_occupancy_date", "buildout_months", "student_yield_override?"]
    output: HousingDevelopment
    side_effects:
      - "area_id is taken from the path; entitlement_status is set to PROPOSED; student_yield_override defaults to null."
      - "area_rolling_absorption is evaluated with the candidate included; a peak above PlanningArea.annual_absorption_cap_units rejects the request with ERR_AREA_ABSORPTION_EXCEEDED and creates nothing."
      - "Creating a development does NOT stale existing projection runs - only POST /redistricting/housing-developments/{id}/entitlement-advance does."

  - method: GET
    path: /redistricting/planning-areas/{id}/housing-developments
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer]
    code: 200
    description: List the housing pipeline of one planning area, ordered by HousingDevelopment.created_at ASC.
    input: ["unit_type?", "entitlement_status?", "limit?", "offset?"]
    output: HousingDevelopment[]
    side_effects: []

  - method: GET
    path: /redistricting/housing-developments/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer]
    code: 200
    description: Read one housing development.
    input: []
    output: HousingDevelopment
    side_effects: []

  - method: POST
    path: /redistricting/housing-developments/{id}/entitlement-advance
    roles: [DistrictPlanner]
    code: 200
    description: Move a development to the next pipeline stage, or withdraw it. This is the trigger of the four-link housing-pipeline cascade.
    input: [to_status]
    output: HousingDevelopment
    side_effects:
      - "Cascade link 1: entitlement_status moves to to_status, which must be the immediate successor in PROPOSED -> ENTITLED -> PERMITTED -> UNDER_CONSTRUCTION -> COMPLETE, or WITHDRAWN from any non-terminal stage."
      - "Cascade link 2: every ProjectionRun of the area's study whose status is COMPLETE moves COMPLETE -> STALE with stale_reason DEVELOPMENT_PIPELINE_CHANGED, walked in ProjectionRun.created_at ASC order; BoundaryStudy.projection_stale is recomputed to true."
      - "Cascade link 3: every BoundaryScenario referencing one of those runs recomputes projection_stale to true, and each such scenario in UNDER_REVIEW moves UNDER_REVIEW -> REVISION with revision_reason PROJECTION_STALE and revision_round incremented by 1, walked in BoundaryScenario.created_at ASC order."
      - "Cascade link 4: if link 3 emptied the study's UNDER_REVIEW and BOARD_READY sets and the study is in ENGAGEMENT, the study moves ENGAGEMENT -> SCENARIO_DEVELOPMENT and comment_intake_open is recomputed to false."

  # --- ProjectionRun -------------------------------------------------------
  - method: POST
    path: /redistricting/studies/{id}/projection-runs
    roles: [DistrictPlanner]
    code: 201
    description: Execute an enrollment projection for the study under one of the two algorithm variants. Guarded by optimistic concurrency on the parent study.
    input: ["variant", "horizon_years?", "expected_study_version"]
    output: ProjectionRun
    side_effects:
      - "expected_study_version is compared with BoundaryStudy.version; a mismatch returns ERR_STALE_STUDY_VERSION and creates nothing."
      - "horizon_years defaults to BoundaryStudy.horizon_years when omitted."
      - "area_projections and projected_total_students are computed by area_enrollment_projection under the requested variant; status is set to COMPLETE and stale_reason to null."
      - "Any earlier ProjectionRun of the same study and the same variant whose status is COMPLETE or STALE moves to SUPERSEDED, walked in ProjectionRun.created_at ASC order."
      - "BoundaryStudy.version is incremented by 1 and BoundaryStudy.projection_stale is recomputed."
      - "If the study is in DATA_LOCKED it advances DATA_LOCKED -> SCENARIO_DEVELOPMENT."

  - method: GET
    path: /redistricting/studies/{id}/projection-runs
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer]
    code: 200
    description: List the projection runs of one study, ordered by ProjectionRun.created_at ASC.
    input: ["variant?", "status?", "limit?", "offset?"]
    output: ProjectionRun[]
    side_effects: []

  - method: GET
    path: /redistricting/projection-runs/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer]
    code: 200
    description: Read one projection run, including its per-area area_projections array.
    input: []
    output: ProjectionRun
    side_effects: []

  # --- BoundaryScenario ----------------------------------------------------
  - method: POST
    path: /redistricting/scenarios
    roles: [DistrictPlanner]
    code: 201
    description: Create a draft boundary scenario scored against one projection run.
    input: [study_id, projection_run_id, name, program_placements, impact_variant]
    output: BoundaryScenario
    side_effects:
      - "status is set to DRAFT; revision_round 0; revision_reason null; rejection_reason null."
      - "author_user_id is stamped from the X-User-ID header - never from the request body."
      - "projection_stale is computed from ProjectionRun.status."
      - "contiguity_ok, noncontiguous_school_ids, total_assigned_students, max_utilization_pct, walk_eligible_pct, transport_cost_annual_usd, students_reassigned_count, students_reassigned_pct and frl_dissimilarity_index are initialised to their empty-scenario values (true, empty array, 0, 0.00, 0.00, 0.00, 0, 0.00, 0.0000)."
      - "version is initialised to 1."

  - method: GET
    path: /redistricting/scenarios
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: List boundary scenarios, filterable by study, projection run and status, ordered by BoundaryScenario.created_at ASC.
    input: ["study_id?", "projection_run_id?", "status?", "impact_variant?", "limit?", "offset?"]
    output: BoundaryScenario[]
    side_effects: []

  - method: GET
    path: /redistricting/scenarios/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: Read one scenario, including every stored objective score.
    input: []
    output: BoundaryScenario
    side_effects: []

  - method: GET
    path: /redistricting/scenarios/{id}/impact-analysis
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: Computed read - recomputes and returns the scenario's socioeconomic, capacity and transportation impact under its stored impact_variant, without mutating the scenario.
    input: []
    output: "{ scenario_id: string, impact_variant: string, total_assigned_students: integer, frl_dissimilarity_index: number, students_reassigned_count: integer, students_reassigned_pct: number, max_utilization_pct: number, critical_school_ids: string, walk_eligible_pct: number, transport_cost_annual_usd: number, contiguity_ok: boolean, noncontiguous_school_ids: string, per_school: string }"
    side_effects: []

  - method: PUT
    path: /redistricting/scenarios/{id}/program-placements
    roles: [DistrictPlanner]
    code: 200
    description: Replace the scenario's whole program placement array. Guarded by optimistic concurrency on the parent scenario.
    input: [program_placements, expected_scenario_version]
    output: BoundaryScenario
    side_effects:
      - "expected_scenario_version is compared with BoundaryScenario.version; a mismatch returns ERR_STALE_SCENARIO_VERSION and changes nothing."
      - "program_placements is replaced wholesale - entries absent from the request body are dropped."
      - "BoundaryScenario.version is incremented by 1."
      - "max_utilization_pct is NOT recomputed here; it is recomputed at submit-for-review."

  - method: POST
    path: /redistricting/scenarios/{id}/submit-for-review
    roles: [DistrictPlanner]
    code: 200
    description: Score the scenario against every objective and submit it for review (DRAFT -> UNDER_REVIEW or REVISION -> UNDER_REVIEW).
    input: ["planner_notes?"]
    output: BoundaryScenario
    side_effects:
      - "contiguity_evaluation recomputes contiguity_ok and noncontiguous_school_ids."
      - "school_capacity_utilization recomputes total_assigned_students and max_utilization_pct."
      - "transportation_cost_annual recomputes transport_cost_annual_usd and walk_eligible_pct."
      - "demographic_impact_index recomputes frl_dissimilarity_index, students_reassigned_count and students_reassigned_pct."
      - "ATOMICITY: all four calculations run BEFORE the gate checks so that ERR_CONTIGUITY_BROKEN and ERR_SCHOOL_CAPACITY_CRITICAL can be evaluated, but their results are persisted ONLY when the transition itself succeeds. A rejected submit-for-review (any validation priority) leaves status, revision_round, version and every stored score field byte-identical to their pre-call values; the freshly computed values are observable only through GET /redistricting/scenarios/{id}/impact-analysis, which computes on read and never writes."
      - "On success status moves to UNDER_REVIEW; when the previous status was REVISION, revision_round is left unchanged (it was already incremented when the scenario entered REVISION)."

  - method: POST
    path: /redistricting/scenarios/{id}/request-revision
    roles: [EngagementCoordinator, BoardMember]
    code: 200
    description: Push a scenario back for revision citing the triaged comments that motivated it. Trigger of the three-link engagement cascade.
    input: ["cited_comment_ids", "revision_notes?"]
    output: BoundaryScenario
    side_effects:
      - "Cascade link 1: scenario status UNDER_REVIEW -> REVISION or BOARD_READY -> REVISION, revision_reason set to COMMENT_CYCLE and revision_round incremented by 1."
      - "Cascade link 2: every PublicComment named in cited_comment_ids moves TRIAGED -> ADDRESSED, walked in PublicComment.created_at ASC order."
      - "Cascade link 3: if the scenario left BOARD_READY and no BoundaryScenario of the study remains in BOARD_READY, the study moves BOARD_DECISION -> ENGAGEMENT and comment_intake_open is recomputed to true."
      - "Rejected with ERR_SELF_REVIEW_FORBIDDEN when X-User-ID equals scenario.author_user_id."

  - method: POST
    path: /redistricting/scenarios/{id}/advance-to-board
    roles: [EngagementCoordinator]
    code: 200
    description: Certify a reviewed scenario for the board agenda (UNDER_REVIEW -> BOARD_READY).
    input: ["agenda_notes?"]
    output: BoundaryScenario
    side_effects:
      - "scenario status UNDER_REVIEW -> BOARD_READY."
      - "The owning study moves ENGAGEMENT -> BOARD_DECISION and comment_intake_open is recomputed to false."
      - "Rejected with ERR_UNADDRESSED_COMMENTS while any PublicComment of the scenario is still in SUBMITTED, and with ERR_SELF_REVIEW_FORBIDDEN when X-User-ID equals scenario.author_user_id."

  # --- AreaAssignment ------------------------------------------------------
  - method: POST
    path: /redistricting/assignments
    roles: [DistrictPlanner]
    code: 201
    description: Assign one planning area to one school under a scenario. Re-posting the same area supersedes the previous row rather than editing it. Guarded by optimistic concurrency on the parent scenario.
    input: [scenario_id, area_id, assigned_school_id, expected_scenario_version]
    output: AreaAssignment
    side_effects:
      - "expected_scenario_version is compared with BoundaryScenario.version; a mismatch returns ERR_STALE_SCENARIO_VERSION and creates nothing."
      - "Any existing AreaAssignment with the same scenario_id and area_id and is_superseded false has is_superseded set to true and superseded_at stamped with the current logical-clock instant."
      - "projected_students is snapshotted from the area_projections entry for area_id on ProjectionRun[scenario.projection_run_id]."
      - "BoundaryScenario.version is incremented by 1."
      - "The scenario's objective scores are NOT recomputed here - only submit-for-review recomputes them."

  - method: GET
    path: /redistricting/assignments
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer]
    code: 200
    description: List area assignments, filterable by scenario, area and assigned school, ordered by AreaAssignment.created_at ASC.
    input: ["scenario_id?", "area_id?", "assigned_school_id?", "is_superseded?", "limit?", "offset?"]
    output: AreaAssignment[]
    side_effects: []

  - method: GET
    path: /redistricting/assignments/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer]
    code: 200
    description: Read one area assignment, including its supersede markers.
    input: []
    output: AreaAssignment
    side_effects: []

  # --- PublicComment -------------------------------------------------------
  - method: POST
    path: /redistricting/comments
    roles: [Guardian]
    code: 201
    description: Submit a public comment on a scenario while the study's comment intake is open.
    input: ["scenario_id", "area_id?", "body"]
    output: PublicComment
    side_effects:
      - "status is set to SUBMITTED; theme and priority are null until triage; dismissal_reason null."
      - "guardian_user_id is stamped from the X-User-ID header - never from the request body."
      - "Rejected with ERR_STUDY_PHASE_INVALID unless the owning study's comment_intake_open is true."

  - method: GET
    path: /redistricting/comments
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: List public comments, filterable by scenario, residence area and status, ordered by PublicComment.created_at ASC.
    input: ["scenario_id?", "area_id?", "status?", "theme?", "priority?", "limit?", "offset?"]
    output: PublicComment[]
    side_effects: []

  - method: GET
    path: /redistricting/comments/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: Read one public comment.
    input: []
    output: PublicComment
    side_effects: []

  - method: POST
    path: /redistricting/comments/{id}/triage
    roles: [EngagementCoordinator]
    code: 200
    description: Classify a submitted comment so it can be cited in a revision cycle (SUBMITTED -> TRIAGED).
    input: [theme, priority]
    output: PublicComment
    side_effects:
      - "status SUBMITTED -> TRIAGED; theme and priority are stored from the request body."
      - "Only TRIAGED comments may appear in cited_comment_ids of request-revision."

  - method: POST
    path: /redistricting/comments/{id}/dismiss
    roles: [EngagementCoordinator]
    code: 200
    description: Dismiss a comment without a revision cycle (SUBMITTED -> DISMISSED or TRIAGED -> DISMISSED).
    input: ["dismissal_notes?"]
    output: PublicComment
    side_effects:
      - "status moves to DISMISSED and dismissal_reason is set to OFFICER_DISMISSAL."
      - "This is the officer-driven path to DISMISSED; the cascade path sets dismissal_reason to SCENARIO_REJECTED instead."

  # --- AdoptionRecord ------------------------------------------------------
  - method: POST
    path: /redistricting/adoptions
    roles: [BoardMember]
    code: 201
    description: Record the board vote adopting one BOARD_READY scenario. Trigger of the three-link adoption cascade.
    input: [study_id, scenario_id, effective_date, effective_school_year, "regime_years?", transfer_deadline_date, "transfer_cap_pct?", "variance_tolerance_pct?", votes_for, votes_against, "votes_abstain?", board_member_count]
    output: AdoptionRecord
    side_effects:
      - "board_vote_outcome is evaluated; quorum_met false returns ERR_QUORUM_NOT_MET and majority_met false returns ERR_MAJORITY_NOT_MET, and nothing is created."
      - "regime_window_overlap is evaluated against the study's non-RESCINDED adoptions; a conflict returns ERR_REGIME_WINDOW_CONFLICT."
      - "supermajority_required is computed from the scenario's students_reassigned_pct; adopted_by_user_id is stamped from X-User-ID."
      - "implementation_status is set to PENDING_EFFECTIVE and transfer_window_status to TRANSFER_WINDOW_OPEN - the two dimensions move independently thereafter."
      - "Cascade link 1: the named scenario moves BOARD_READY -> ADOPTED."
      - "Cascade link 2: every sibling BoundaryScenario of the study in DRAFT, UNDER_REVIEW, REVISION or BOARD_READY moves to REJECTED with rejection_reason SUPERSEDED_BY_ADOPTION, walked in BoundaryScenario.created_at ASC order."
      - "Cascade link 3: every PublicComment of those rejected scenarios in SUBMITTED or TRIAGED moves to DISMISSED with dismissal_reason SCENARIO_REJECTED, walked in PublicComment.created_at ASC order."
      - "The owning study moves BOARD_DECISION -> IMPLEMENTATION."

  - method: GET
    path: /redistricting/adoptions
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: List adoption records, filterable by study and adopted scenario, ordered by AdoptionRecord.created_at ASC.
    input: ["study_id?", "scenario_id?", "implementation_status?", "transfer_window_status?", "limit?", "offset?"]
    output: AdoptionRecord[]
    side_effects: []

  - method: GET
    path: /redistricting/adoptions/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: Read one adoption record, including both independent status dimensions.
    input: []
    output: AdoptionRecord
    side_effects: []

  - method: POST
    path: /redistricting/adoptions/{id}/phase-in-rules
    roles: [BoardMember]
    code: 201
    description: Attach a grandfathering, sibling or phase-in rule to an adoption that has not yet taken effect.
    input: [rule_type, grade_low, grade_high, sunset_school_year]
    output: PhaseInRule
    side_effects:
      - "adoption_id is taken from the path."
      - "consumes_seat_pool is computed - false for TERMINAL_GRADE_GRANDFATHER and PHASE_IN_GRADE_BAND, true for SIBLING_LINK."
      - "phase_in_bands_disjoint rejects a band that intersects an existing rule of the same adoption and the same rule_type with ERR_PHASE_IN_BAND_OVERLAP; abutting bands are accepted."
      - "The rule is immutable - PhaseInRule has common_fields false and no update endpoint."

  - method: GET
    path: /redistricting/adoptions/{id}/phase-in-rules
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: List the phase-in rules of one adoption, ordered by PhaseInRule.created_at ASC.
    input: ["rule_type?", "limit?", "offset?"]
    output: PhaseInRule[]
    side_effects: []

  - method: POST
    path: /redistricting/adoptions/{id}/activate
    roles: [TransferOfficer]
    code: 200
    description: Put the adopted boundaries into effect on or after the effective date. Trigger of the four-link implementation cascade.
    input: []
    output: AdoptionRecord
    side_effects:
      - "Cascade link 1: implementation_status PENDING_EFFECTIVE -> IN_EFFECT."
      - "Cascade link 2: for every PlanningArea of the study, walked in PlanningArea.created_at ASC order, previous_school_id is set to the current current_school_id and then current_school_id is set to the assigned_school_id of that area's non-superseded AreaAssignment in the adopted scenario."
      - "Cascade link 3: every School of the study recomputes enrolled_students_of_record from the areas now pointing at it, walked in School.created_at ASC order, and then BoundaryStudy.enrolled_of_record_total is recomputed."
      - "Cascade link 4: every WAITLISTED TransferRequest of this adoption is revisited in TransferRequest.created_at ASC order; each one whose requested school still has transfer_seat_pool >= 1 moves WAITLISTED -> APPROVED with promotion_source WAITLIST_AUTO and decided_by_user_id left null, and the pool is recomputed before the next candidate is considered."
      - "Rejected with ERR_EFFECTIVE_DATE_NOT_REACHED while the logical clock is before effective_date."

  - method: POST
    path: /redistricting/adoptions/{id}/rescind
    roles: [BoardMember]
    code: 200
    description: Compensating action - unwind an in-effect adoption link for link (IN_EFFECT -> RESCINDED).
    input: [rescind_reason]
    output: AdoptionRecord
    side_effects:
      - "Compensation link 1: implementation_status IN_EFFECT -> RESCINDED."
      - "Compensation link 2: for every PlanningArea of the study whose previous_school_id is non-null, walked in PlanningArea.created_at ASC order, current_school_id is restored to previous_school_id and previous_school_id is reset to null."
      - "Compensation link 3: every School of the study recomputes enrolled_students_of_record and BoundaryStudy.enrolled_of_record_total is recomputed, so the district total returns to its pre-activation value exactly."
      - "Compensation link 4: every TransferRequest of this adoption in APPROVED with promotion_source WAITLIST_AUTO moves APPROVED -> WAITLISTED with promotion_source reset to null, walked in TransferRequest.created_at ASC order. Officer approvals (promotion_source OFFICER_DECISION) are left untouched."
      - "The owning study moves IMPLEMENTATION -> BOARD_DECISION, and the adoption's regime interval is released for reuse by a later adoption."

  - method: POST
    path: /redistricting/adoptions/{id}/close-transfer-window
    roles: [TransferOfficer]
    code: 200
    description: Shut transfer intake after the deadline and clear the undecided queue.
    input: []
    output: AdoptionRecord
    side_effects:
      - "transfer_window_status TRANSFER_WINDOW_OPEN -> TRANSFER_WINDOW_CLOSED. implementation_status is untouched - the two dimensions are independent."
      - "Every TransferRequest of this adoption still in SUBMITTED or WAITLISTED moves to DENIED, walked in TransferRequest.created_at ASC order, with decision_notes set to WINDOW_CLOSED and decided_by_user_id left null."
      - "Rejected with ERR_ADOPTION_STATE_INVALID while the logical clock is not yet past transfer_deadline_date."

  - method: POST
    path: /redistricting/adoptions/{id}/close-monitoring
    roles: [TransferOfficer]
    code: 200
    description: Close post-implementation monitoring once every active school has a clean variance observation (IN_EFFECT -> MONITORING_CLOSED).
    input: ["closure_notes?"]
    output: AdoptionRecord
    side_effects:
      - "implementation_status IN_EFFECT -> MONITORING_CLOSED."
      - "The owning study moves IMPLEMENTATION -> CLOSED, which is the study's terminal state."
      - "Rejected with ERR_ADOPTION_STATE_INVALID unless transfer_window_status is already TRANSFER_WINDOW_CLOSED, every ACTIVE school of the study has at least one VarianceObservation for this adoption, and no observation carries flag CORRECTIVE_ACTION_REQUIRED."

  # --- TransferRequest -----------------------------------------------------
  - method: POST
    path: /redistricting/transfer-requests
    roles: [Guardian]
    code: 201
    description: File a transfer request against an adoption whose transfer window is open. The eligibility waterfall runs at submission.
    input: ["adoption_id", "area_id", "requested_school_id", "student_reference", "student_grade", "reason", "sibling_transfer_id?"]
    output: TransferRequest
    side_effects:
      - "status is set to SUBMITTED; promotion_source, decided_by_user_id and decision_notes are null."
      - "guardian_user_id is stamped from the X-User-ID header - never from the request body."
      - "origin_school_id is derived from the adopted scenario's non-superseded AreaAssignment for area_id."
      - "transfer_eligibility_resolution sets resolved_reason and consumes_seat_pool by walking the four rungs in their pinned order."
      - "Rejected with ERR_TRANSFER_WINDOW_EXPIRED when the logical clock is past transfer_deadline_date, and with ERR_TRANSFER_WINDOW_CLOSED once the window dimension is closed."

  - method: GET
    path: /redistricting/transfer-requests
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: List transfer requests, filterable by adoption, residence area, origin school, requested school and sibling link, ordered by TransferRequest.created_at ASC.
    input: ["adoption_id?", "area_id?", "origin_school_id?", "requested_school_id?", "sibling_transfer_id?", "status?", "resolved_reason?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []

  - method: GET
    path: /redistricting/transfer-requests/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: Read one transfer request, including its resolved eligibility rung and promotion source.
    input: []
    output: TransferRequest
    side_effects: []

  - method: POST
    path: /redistricting/transfer-requests/{id}/decide
    roles: [TransferOfficer]
    code: 200
    description: Approve, deny or waitlist a transfer request against the requested school's seat pool.
    input: ["decision", "decision_notes?"]
    output: TransferRequest
    side_effects:
      - "decision APPROVE moves the request to APPROVED with promotion_source OFFICER_DECISION; DENY moves it to DENIED; WAITLIST moves it to WAITLISTED."
      - "transfer_eligibility_resolution is re-evaluated, so a PhaseInRule added after submission can change resolved_reason and consumes_seat_pool at decision time."
      - "transfer_seat_pool is evaluated for the requested school; APPROVE of a pool-consuming request with a pool below 1 returns ERR_NO_TRANSFER_SEATS."
      - "decided_by_user_id is stamped from X-User-ID; decision_notes is stored when supplied."
      - "Rejected with ERR_SELF_DECISION_FORBIDDEN when X-User-ID equals the request's guardian_user_id."

  # --- VarianceObservation -------------------------------------------------
  - method: POST
    path: /redistricting/adoptions/{id}/variance-observations
    roles: [TransferOfficer]
    code: 201
    description: Record a post-implementation head count against the projection for one school.
    input: [school_id, observed_on, observed_enrollment, projected_enrollment]
    output: VarianceObservation
    side_effects:
      - "adoption_id is taken from the path."
      - "enrollment_variance_flag computes variance_pct and flag from the adoption's variance_tolerance_pct."
      - "projected_enrollment of 0 returns ERR_ZERO_PROJECTION_BASE and creates nothing."
      - "An observation with flag CORRECTIVE_ACTION_REQUIRED blocks POST /redistricting/adoptions/{id}/close-monitoring until a later clean observation is recorded for that school."
      - "The observation is immutable - VarianceObservation has common_fields false and no update endpoint."

  - method: GET
    path: /redistricting/variance-observations
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer]
    code: 200
    description: List variance observations, filterable by adoption and school, ordered by VarianceObservation.created_at ASC.
    input: ["adoption_id?", "school_id?", "flag?", "limit?", "offset?"]
    output: VarianceObservation[]
    side_effects: []

  - method: GET
    path: /redistricting/variance-observations/{id}
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer]
    code: 200
    description: Read one variance observation.
    input: []
    output: VarianceObservation
    side_effects: []

  # --- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [DistrictPlanner, EngagementCoordinator, BoardMember, TransferOfficer, Guardian]
    code: 200
    description: "Set the server's logical clock, which every temporal rule in this domain reads (effective_date gating, transfer_deadline_date expiry, data_locked_at and superseded_at stamps, housing delivery windows). The logical clock starts at 2026-08-01T00:00:00Z on a fresh server and only this endpoint moves it. Test-driving endpoint - unreachable preconditions such as ERR_TRANSFER_WINDOW_EXPIRED and ERR_EFFECTIVE_DATE_NOT_REACHED cannot be produced by composing business endpoints."
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects:
      - "The logical clock is set to current_utc. Time never advances on its own between requests."
      - "No entity is created or transitioned by this call; it only changes what later calls read as now."

# =============================================================================
# 1.6 Error Catalog
# =============================================================================
# Every error below is reachable from at least one endpoint in §1.5; the catalog is
# ordered by the validation priority that raises it.
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    priority: 10
    message: Request is missing the X-User-ID or X-Role identity headers.
    raised_by: [every endpoint under /redistricting, POST /_clock/set_current_utc]
    trigger: validation rule caller_identity_present
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    category: authorization
    priority: 20
    message: The caller's role is not permitted to perform this operation.
    raised_by: [every endpoint under /redistricting, POST /_clock/set_current_utc]
    trigger: validation rule caller_role_permitted
  - error_id: ERR_SELF_ADOPTION_FORBIDDEN
    http_status: 403
    category: authorization
    priority: 25
    message: The planner who authored this scenario may not record its adoption.
    raised_by: [POST /redistricting/adoptions]
    trigger: validation rule scenario_author_may_not_adopt_own_scenario
  - error_id: ERR_SELF_DECISION_FORBIDDEN
    http_status: 403
    category: authorization
    priority: 25
    message: An operator may not decide a transfer request they filed.
    raised_by: ['POST /redistricting/transfer-requests/{id}/decide']
    trigger: validation rule guardian_may_not_decide_own_request
  - error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    category: authorization
    priority: 25
    message: The planner who authored this scenario may not review, revise or advance it.
    raised_by: ['POST /redistricting/scenarios/{id}/request-revision', 'POST /redistricting/scenarios/{id}/advance-to-board']
    trigger: validation rule scenario_author_may_not_review_own_scenario
  - error_id: ERR_ADOPTION_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No adoption record exists with the supplied id.
    raised_by: ['GET /redistricting/adoptions/{id}', 'GET /redistricting/adoptions/{id}/phase-in-rules', 'POST /redistricting/adoptions/{id}/phase-in-rules', 'POST /redistricting/adoptions/{id}/activate', 'POST /redistricting/adoptions/{id}/rescind', 'POST /redistricting/adoptions/{id}/close-transfer-window', 'POST /redistricting/adoptions/{id}/close-monitoring', 'POST /redistricting/adoptions/{id}/variance-observations', POST /redistricting/transfer-requests]
    trigger: validation rule adoption_exists
  - error_id: ERR_AREA_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No planning area exists with the supplied id.
    raised_by: ['GET /redistricting/planning-areas/{id}', 'GET /redistricting/planning-areas/{id}/adjacencies', 'GET /redistricting/planning-areas/{id}/housing-developments', 'POST /redistricting/planning-areas/{id}/housing-developments', POST /redistricting/area-adjacencies, POST /redistricting/assignments, POST /redistricting/comments, POST /redistricting/transfer-requests]
    trigger: validation rule planning_area_exists
  - error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No area assignment exists with the supplied id.
    raised_by: ['GET /redistricting/assignments/{id}']
    trigger: validation rule assignment_exists
  - error_id: ERR_COMMENT_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No public comment exists with the supplied id.
    raised_by: ['GET /redistricting/comments/{id}', 'POST /redistricting/comments/{id}/triage', 'POST /redistricting/comments/{id}/dismiss', 'POST /redistricting/scenarios/{id}/request-revision']
    trigger: validation rule comment_exists
  - error_id: ERR_DEVELOPMENT_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No housing development exists with the supplied id.
    raised_by: ['POST /redistricting/housing-developments/{id}/entitlement-advance']
    trigger: validation rule housing_development_exists
  - error_id: ERR_OBSERVATION_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No variance observation exists with the supplied id.
    raised_by: ['GET /redistricting/variance-observations/{id}']
    trigger: validation rule variance_observation_exists
  - error_id: ERR_PROJECTION_RUN_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No projection run exists with the supplied id.
    raised_by: ['GET /redistricting/projection-runs/{id}', POST /redistricting/scenarios]
    trigger: validation rule projection_run_exists
  - error_id: ERR_SCENARIO_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No boundary scenario exists with the supplied id.
    raised_by: ['GET /redistricting/scenarios/{id}', 'GET /redistricting/scenarios/{id}/impact-analysis', 'POST /redistricting/scenarios/{id}/submit-for-review', 'POST /redistricting/scenarios/{id}/request-revision', 'POST /redistricting/scenarios/{id}/advance-to-board', 'PUT /redistricting/scenarios/{id}/program-placements', POST /redistricting/assignments, POST /redistricting/comments, POST /redistricting/adoptions]
    trigger: validation rule scenario_exists
  - error_id: ERR_SCHOOL_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No school exists with the supplied id.
    raised_by: ['GET /redistricting/schools/{id}', 'PATCH /redistricting/schools/{id}', POST /redistricting/planning-areas, POST /redistricting/assignments, 'PUT /redistricting/scenarios/{id}/program-placements', POST /redistricting/transfer-requests, 'POST /redistricting/adoptions/{id}/variance-observations']
    trigger: validation rule school_exists
  - error_id: ERR_STUDY_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No boundary study exists with the supplied id.
    raised_by: [every endpoint that names a study by path id or study_id]
    trigger: validation rule study_exists
  - error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    category: existence
    priority: 30
    message: No transfer request exists with the supplied id.
    raised_by: ['GET /redistricting/transfer-requests/{id}', 'POST /redistricting/transfer-requests/{id}/decide', POST /redistricting/transfer-requests]
    trigger: validation rule transfer_request_exists
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    category: schema
    priority: 35
    message: The request body is missing a required field or carries a value outside its permitted domain.
    raised_by: [every mutating endpoint, every list endpoint that accepts limit/offset]
    trigger: validation rule request_body_well_formed
  - error_id: ERR_STUDY_PHASE_INVALID
    http_status: 409
    category: state
    priority: 40
    message: The boundary study is not in a phase that permits this operation.
    raised_by: ['POST /redistricting/studies/{id}/lock-data', 'POST /redistricting/studies/{id}/open-engagement', 'POST /redistricting/studies/{id}/projection-runs', POST /redistricting/scenarios, 'POST /redistricting/scenarios/{id}/submit-for-review', 'POST /redistricting/scenarios/{id}/advance-to-board', POST /redistricting/adoptions, POST /redistricting/comments]
    trigger: validation rule study_phase_permits_operation
  - error_id: ERR_NO_SCENARIO_UNDER_REVIEW
    http_status: 409
    category: state
    priority: 41
    message: No scenario of this study is under review, so public engagement cannot open.
    raised_by: ['POST /redistricting/studies/{id}/open-engagement']
    trigger: validation rule engagement_needs_reviewed_scenario
  - error_id: ERR_STUDY_SETUP_INCOMPLETE
    http_status: 409
    category: state
    priority: 41
    message: The study's seed inventory is incomplete, so its data cannot be locked.
    raised_by: ['POST /redistricting/studies/{id}/lock-data']
    trigger: validation rule study_setup_complete
  - error_id: ERR_STUDY_DATA_LOCKED
    http_status: 409
    category: state
    priority: 42
    message: The study's seed inventory is locked and may no longer be extended.
    raised_by: ['POST /redistricting/studies/{id}/schools', POST /redistricting/planning-areas, POST /redistricting/area-adjacencies]
    trigger: validation rule seed_data_editable_only_before_lock
  - error_id: ERR_ENTITLEMENT_STAGE_INVALID
    http_status: 409
    category: state
    priority: 43
    message: The requested entitlement stage is not reachable from the development's current stage.
    raised_by: ['POST /redistricting/housing-developments/{id}/entitlement-advance']
    trigger: validation rule entitlement_stage_successor
  - error_id: ERR_SCENARIO_NOT_BOARD_READY
    http_status: 409
    category: state
    priority: 44
    message: The scenario is not BOARD_READY, so it cannot be adopted.
    raised_by: [POST /redistricting/adoptions]
    trigger: validation rule scenario_board_ready
  - error_id: ERR_SCENARIO_NOT_EDITABLE
    http_status: 409
    category: state
    priority: 44
    message: The scenario is not in DRAFT or REVISION, so its content is frozen.
    raised_by: [POST /redistricting/assignments, 'PUT /redistricting/scenarios/{id}/program-placements', 'POST /redistricting/scenarios/{id}/submit-for-review']
    trigger: validation rule scenario_editable
  - error_id: ERR_SCENARIO_NOT_REVIEWABLE
    http_status: 409
    category: state
    priority: 44
    message: The scenario is not in a state that accepts this review action.
    raised_by: ['POST /redistricting/scenarios/{id}/request-revision', 'POST /redistricting/scenarios/{id}/advance-to-board']
    trigger: validation rule scenario_under_review
  - error_id: ERR_COMMENT_STATE_INVALID
    http_status: 409
    category: state
    priority: 45
    message: The public comment is not in a state that accepts this operation.
    raised_by: ['POST /redistricting/comments/{id}/triage', 'POST /redistricting/comments/{id}/dismiss', 'POST /redistricting/scenarios/{id}/request-revision']
    trigger: validation rule comment_status_permits_operation
  - error_id: ERR_SCHOOL_NOT_ACTIVE
    http_status: 409
    category: state
    priority: 45
    message: The referenced school is mothballed and cannot receive students or programs.
    raised_by: [POST /redistricting/assignments, 'PUT /redistricting/scenarios/{id}/program-placements', POST /redistricting/transfer-requests]
    trigger: validation rule school_active
  - error_id: ERR_ADOPTION_STATE_INVALID
    http_status: 409
    category: state
    priority: 46
    message: The adoption record is not in a state that accepts this operation.
    raised_by: ['POST /redistricting/adoptions/{id}/activate', 'POST /redistricting/adoptions/{id}/rescind', 'POST /redistricting/adoptions/{id}/close-monitoring', 'POST /redistricting/adoptions/{id}/close-transfer-window', 'POST /redistricting/adoptions/{id}/variance-observations', 'POST /redistricting/adoptions/{id}/phase-in-rules']
    trigger: validation rule adoption_status_permits_operation
  - error_id: ERR_TRANSFER_NOT_DECIDABLE
    http_status: 409
    category: state
    priority: 46
    message: The transfer request has already reached a decided state.
    raised_by: ['POST /redistricting/transfer-requests/{id}/decide']
    trigger: validation rule transfer_request_decidable
  - error_id: ERR_TRANSFER_WINDOW_CLOSED
    http_status: 409
    category: state
    priority: 46
    message: The adoption's transfer window is closed to new requests.
    raised_by: [POST /redistricting/transfer-requests]
    trigger: validation rule transfer_window_open
  - error_id: ERR_PROJECTION_STALE
    http_status: 409
    category: state
    priority: 47
    message: The scenario's projection run is stale or superseded, so its scores cannot be certified.
    raised_by: ['POST /redistricting/scenarios/{id}/submit-for-review', 'POST /redistricting/scenarios/{id}/advance-to-board', POST /redistricting/adoptions]
    trigger: validation rule projection_not_stale
  - error_id: ERR_STALE_SCENARIO_VERSION
    http_status: 412
    category: concurrency
    priority: 48
    message: expected_scenario_version does not match the scenario's current version.
    raised_by: [POST /redistricting/assignments, 'PUT /redistricting/scenarios/{id}/program-placements']
    trigger: validation rule scenario_version_current
  - error_id: ERR_STALE_STUDY_VERSION
    http_status: 412
    category: concurrency
    priority: 48
    message: expected_study_version does not match the study's current version.
    raised_by: ['POST /redistricting/studies/{id}/projection-runs']
    trigger: validation rule study_version_current
  - error_id: ERR_TRANSFER_WINDOW_EXPIRED
    http_status: 409
    category: business_temporal
    priority: 50
    message: The adoption's transfer deadline has passed.
    raised_by: [POST /redistricting/transfer-requests]
    trigger: validation rule transfer_deadline_not_passed
  - error_id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 409
    category: business_temporal
    priority: 51
    message: The adoption's effective date has not been reached yet.
    raised_by: ['POST /redistricting/adoptions/{id}/activate']
    trigger: validation rule effective_date_reached
  - error_id: ERR_INVALID_DATE_WINDOW
    http_status: 422
    category: business_temporal
    priority: 52
    message: The supplied dates or school years are not in the required order.
    raised_by: [POST /redistricting/adoptions, 'POST /redistricting/adoptions/{id}/phase-in-rules']
    trigger: validation rule adoption_date_window_ordered
  - error_id: ERR_TRAVEL_OPTION_MISSING
    http_status: 422
    category: business_referential
    priority: 55
    message: The planning area has no travel option recorded for the assigned school.
    raised_by: [POST /redistricting/assignments]
    trigger: validation rule travel_option_present
  - error_id: ERR_SCHOOL_LEVEL_MISMATCH
    http_status: 422
    category: business_referential
    priority: 56
    message: The school's grade level does not match the planning area's grade band.
    raised_by: [POST /redistricting/assignments, POST /redistricting/transfer-requests]
    trigger: validation rule school_level_matches_area_grade_band
  - error_id: ERR_CROSS_STUDY_REFERENCE
    http_status: 422
    category: business_referential
    priority: 57
    message: The referenced entities belong to different boundary studies.
    raised_by: [POST /redistricting/planning-areas, POST /redistricting/area-adjacencies, POST /redistricting/scenarios, POST /redistricting/assignments, 'PUT /redistricting/scenarios/{id}/program-placements', POST /redistricting/adoptions, 'POST /redistricting/adoptions/{id}/variance-observations']
    trigger: validation rule references_share_one_study
  - error_id: ERR_PROGRAM_HOST_INCAPABLE
    http_status: 422
    category: business_referential
    priority: 57
    message: The named host school cannot host the requested program type.
    raised_by: ['PUT /redistricting/scenarios/{id}/program-placements']
    trigger: validation rule program_host_capable
  - error_id: ERR_SELF_ADJACENCY
    http_status: 422
    category: business_referential
    priority: 57
    message: A planning area cannot be declared adjacent to itself.
    raised_by: [POST /redistricting/area-adjacencies]
    trigger: validation rule adjacency_endpoints_distinct
  - error_id: ERR_SIBLING_LINK_INVALID
    http_status: 422
    category: business_referential
    priority: 58
    message: The sibling transfer link is missing or does not point at an approved sibling at the same school.
    raised_by: [POST /redistricting/transfer-requests]
    trigger: validation rule sibling_link_valid
  - error_id: ERR_RIDE_TIME_EXCEEDED
    http_status: 422
    category: business_safety
    priority: 60
    message: The bus ride for this area-school pair exceeds the maximum ride time for the school level.
    raised_by: [POST /redistricting/assignments]
    trigger: validation rule ride_time_within_limit
  - error_id: ERR_DUPLICATE_ADJACENCY
    http_status: 409
    category: business_uniqueness
    priority: 62
    message: An adjacency already exists for this pair of planning areas.
    raised_by: [POST /redistricting/area-adjacencies]
    trigger: validation rule adjacency_pair_unique
  - error_id: ERR_DUPLICATE_NAME
    http_status: 409
    category: business_uniqueness
    priority: 62
    message: The supplied name, area code or student reference is already used inside its scope.
    raised_by: ['POST /redistricting/studies/{id}/schools', POST /redistricting/planning-areas, POST /redistricting/scenarios, POST /redistricting/transfer-requests]
    trigger: validation rule names_unique_within_scope
  - error_id: ERR_AREA_UNASSIGNED
    http_status: 409
    category: business_constraint
    priority: 64
    message: The scenario does not assign every planning area of the study exactly once.
    raised_by: ['POST /redistricting/scenarios/{id}/submit-for-review']
    trigger: validation rule every_area_assigned_once
  - error_id: ERR_CONTIGUITY_BROKEN
    http_status: 409
    category: business_constraint
    priority: 65
    message: At least one school's assigned attendance area is not contiguous.
    raised_by: ['POST /redistricting/scenarios/{id}/submit-for-review']
    trigger: validation rule contiguity_required
  - error_id: ERR_PROGRAM_HOST_UNASSIGNED
    http_status: 409
    category: business_constraint
    priority: 66
    message: A program host school has no attendance area assigned in this scenario.
    raised_by: ['POST /redistricting/scenarios/{id}/submit-for-review']
    trigger: validation rule program_host_has_assigned_area
  - error_id: ERR_PROGRAM_PLACEMENT_INCOMPLETE
    http_status: 409
    category: business_constraint
    priority: 66
    message: A required district program is not placed exactly once in this scenario.
    raised_by: ['POST /redistricting/scenarios/{id}/submit-for-review']
    trigger: validation rule required_programs_placed_once
  - error_id: ERR_PHASE_IN_BAND_OVERLAP
    http_status: 409
    category: business_constraint
    priority: 67
    message: The grade band overlaps an existing phase-in rule of the same type on this adoption.
    raised_by: ['POST /redistricting/adoptions/{id}/phase-in-rules']
    trigger: validation rule phase_in_bands_disjoint
  - error_id: ERR_REGIME_WINDOW_CONFLICT
    http_status: 409
    category: business_constraint
    priority: 68
    message: The adoption's boundary regime conflicts with an existing regime or its quiet-period buffer.
    raised_by: [POST /redistricting/adoptions]
    trigger: validation rule boundary_regime_window_clear
  - error_id: ERR_AREA_ABSORPTION_EXCEEDED
    http_status: 409
    category: business_constraint
    priority: 69
    message: The development would push the area past its rolling housing absorption cap.
    raised_by: ['POST /redistricting/planning-areas/{id}/housing-developments']
    trigger: validation rule area_absorption_within_cap
  - error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    category: business_constraint
    priority: 70
    message: The scenario has already used all permitted revision rounds.
    raised_by: ['POST /redistricting/scenarios/{id}/request-revision']
    trigger: validation rule revision_rounds_within_limit
  - error_id: ERR_NO_ELIGIBILITY_BASIS
    http_status: 409
    category: business_constraint
    priority: 71
    message: No grandfathering, sibling, phase-in or hardship basis applies to this transfer request.
    raised_by: ['POST /redistricting/transfer-requests/{id}/decide']
    trigger: validation rule transfer_has_eligibility_basis
  - error_id: ERR_UNADDRESSED_COMMENTS
    http_status: 409
    category: business_constraint
    priority: 71
    message: Public comments on this scenario are still untriaged.
    raised_by: ['POST /redistricting/scenarios/{id}/advance-to-board']
    trigger: validation rule high_priority_comments_addressed
  - error_id: ERR_SCHOOL_CAPACITY_CRITICAL
    http_status: 409
    category: business_fiscal
    priority: 72
    message: At least one school reaches critical capacity utilization under this scenario.
    raised_by: ['POST /redistricting/scenarios/{id}/submit-for-review']
    trigger: validation rule no_school_at_critical_utilization
  - error_id: ERR_NO_TRANSFER_SEATS
    http_status: 409
    category: business_fiscal
    priority: 73
    message: The requested school has no transfer seats available.
    raised_by: ['POST /redistricting/transfer-requests/{id}/decide']
    trigger: validation rule transfer_seats_available
  - error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    category: business_fiscal
    priority: 74
    message: The recorded board votes do not meet quorum.
    raised_by: [POST /redistricting/adoptions]
    trigger: validation rule board_quorum_met
  - error_id: ERR_MAJORITY_NOT_MET
    http_status: 409
    category: business_fiscal
    priority: 75
    message: The recorded board votes do not meet the required approval threshold.
    raised_by: [POST /redistricting/adoptions]
    trigger: validation rule board_majority_met
  - error_id: ERR_ZERO_PROJECTION_BASE
    http_status: 422
    category: computation
    priority: 80
    message: The projected enrollment is zero, so a variance percentage is undefined.
    raised_by: ['POST /redistricting/adoptions/{id}/variance-observations']
    trigger: validation rule projection_base_nonzero

# =============================================================================
# 1.7 RBAC Table
# =============================================================================
# role_model: segregation_of_duties. Identity arrives on every request as two opaque
# headers: X-Role (one of the five roles below) and X-User-ID (an opaque operator id,
# never an entity id and never used for ordering or business decisions - it is compared
# only for equality against BoundaryScenario.author_user_id and TransferRequest.guardian_user_id).
roles:
  identity: opaque
  identity_headers: [X-Role, X-User-ID]
  definitions:
    - role: DistrictPlanner
      description: Owns study setup, the planning-area and school inventory, the housing pipeline, enrollment projection runs and scenario construction. Authors scenarios and submits them for review, but by segregation of duties may never review, advance or adopt its own scenario.
      exclusive_operations:
        - "POST /redistricting/studies"
        - "POST /redistricting/studies/{id}/lock-data"
        - "POST /redistricting/studies/{id}/schools"
        - "PATCH /redistricting/schools/{id}"
        - "POST /redistricting/planning-areas"
        - "POST /redistricting/area-adjacencies"
        - "POST /redistricting/planning-areas/{id}/housing-developments"
        - "POST /redistricting/housing-developments/{id}/entitlement-advance"
        - "POST /redistricting/studies/{id}/projection-runs"
        - "POST /redistricting/scenarios"
        - "PUT /redistricting/scenarios/{id}/program-placements"
        - "POST /redistricting/scenarios/{id}/submit-for-review"
        - "POST /redistricting/assignments"
      shared_operations:
        - "GET /redistricting/studies/{id}"
        - "GET /redistricting/studies/{id}/schools"
        - "GET /redistricting/schools/{id}"
        - "GET /redistricting/planning-areas"
        - "GET /redistricting/planning-areas/{id}"
        - "GET /redistricting/planning-areas/{id}/adjacencies"
        - "GET /redistricting/planning-areas/{id}/housing-developments"
        - "GET /redistricting/housing-developments/{id}"
        - "GET /redistricting/studies/{id}/projection-runs"
        - "GET /redistricting/projection-runs/{id}"
        - "GET /redistricting/scenarios"
        - "GET /redistricting/scenarios/{id}"
        - "GET /redistricting/scenarios/{id}/impact-analysis"
        - "GET /redistricting/assignments"
        - "GET /redistricting/assignments/{id}"
        - "GET /redistricting/comments"
        - "GET /redistricting/comments/{id}"
        - "GET /redistricting/adoptions"
        - "GET /redistricting/adoptions/{id}"
        - "GET /redistricting/adoptions/{id}/phase-in-rules"
        - "GET /redistricting/transfer-requests"
        - "GET /redistricting/transfer-requests/{id}"
        - "GET /redistricting/variance-observations"
        - "GET /redistricting/variance-observations/{id}"
        - "POST /_clock/set_current_utc"
    - role: EngagementCoordinator
      description: Owns the community engagement cycle - opening comment intake, triaging and dismissing public comment, pushing scenarios back for revision citing triaged comments, and certifying a reviewed scenario onto the board agenda.
      exclusive_operations:
        - "POST /redistricting/studies/{id}/open-engagement"
        - "POST /redistricting/scenarios/{id}/advance-to-board"
        - "POST /redistricting/comments/{id}/triage"
        - "POST /redistricting/comments/{id}/dismiss"
      shared_operations:
        - "GET /redistricting/studies/{id}"
        - "GET /redistricting/studies/{id}/schools"
        - "GET /redistricting/schools/{id}"
        - "GET /redistricting/planning-areas"
        - "GET /redistricting/planning-areas/{id}"
        - "GET /redistricting/planning-areas/{id}/adjacencies"
        - "GET /redistricting/planning-areas/{id}/housing-developments"
        - "GET /redistricting/housing-developments/{id}"
        - "GET /redistricting/studies/{id}/projection-runs"
        - "GET /redistricting/projection-runs/{id}"
        - "GET /redistricting/scenarios"
        - "GET /redistricting/scenarios/{id}"
        - "GET /redistricting/scenarios/{id}/impact-analysis"
        - "POST /redistricting/scenarios/{id}/request-revision"
        - "GET /redistricting/assignments"
        - "GET /redistricting/assignments/{id}"
        - "GET /redistricting/comments"
        - "GET /redistricting/comments/{id}"
        - "GET /redistricting/adoptions"
        - "GET /redistricting/adoptions/{id}"
        - "GET /redistricting/adoptions/{id}/phase-in-rules"
        - "GET /redistricting/transfer-requests"
        - "GET /redistricting/transfer-requests/{id}"
        - "GET /redistricting/variance-observations"
        - "GET /redistricting/variance-observations/{id}"
        - "POST /_clock/set_current_utc"
    - role: BoardMember
      description: Owns the board decision - recording the adopting vote, attaching grandfathering and phase-in rules, pushing a board-ready scenario back for revision, and rescinding an in-effect adoption.
      exclusive_operations:
        - "POST /redistricting/adoptions"
        - "POST /redistricting/adoptions/{id}/phase-in-rules"
        - "POST /redistricting/adoptions/{id}/rescind"
      shared_operations:
        - "GET /redistricting/studies/{id}"
        - "GET /redistricting/studies/{id}/schools"
        - "GET /redistricting/schools/{id}"
        - "GET /redistricting/planning-areas"
        - "GET /redistricting/planning-areas/{id}"
        - "GET /redistricting/planning-areas/{id}/adjacencies"
        - "GET /redistricting/planning-areas/{id}/housing-developments"
        - "GET /redistricting/housing-developments/{id}"
        - "GET /redistricting/studies/{id}/projection-runs"
        - "GET /redistricting/projection-runs/{id}"
        - "GET /redistricting/scenarios"
        - "GET /redistricting/scenarios/{id}"
        - "GET /redistricting/scenarios/{id}/impact-analysis"
        - "POST /redistricting/scenarios/{id}/request-revision"
        - "GET /redistricting/assignments"
        - "GET /redistricting/assignments/{id}"
        - "GET /redistricting/comments"
        - "GET /redistricting/comments/{id}"
        - "GET /redistricting/adoptions"
        - "GET /redistricting/adoptions/{id}"
        - "GET /redistricting/adoptions/{id}/phase-in-rules"
        - "GET /redistricting/transfer-requests"
        - "GET /redistricting/transfer-requests/{id}"
        - "GET /redistricting/variance-observations"
        - "GET /redistricting/variance-observations/{id}"
        - "POST /_clock/set_current_utc"
    - role: TransferOfficer
      description: Owns implementation - activating the adopted regime, deciding transfer requests against each school seat pool, closing the transfer window, recording post-implementation variance observations and closing monitoring.
      exclusive_operations:
        - "POST /redistricting/adoptions/{id}/activate"
        - "POST /redistricting/adoptions/{id}/close-transfer-window"
        - "POST /redistricting/adoptions/{id}/close-monitoring"
        - "POST /redistricting/transfer-requests/{id}/decide"
        - "POST /redistricting/adoptions/{id}/variance-observations"
      shared_operations:
        - "GET /redistricting/studies/{id}"
        - "GET /redistricting/studies/{id}/schools"
        - "GET /redistricting/schools/{id}"
        - "GET /redistricting/planning-areas"
        - "GET /redistricting/planning-areas/{id}"
        - "GET /redistricting/planning-areas/{id}/adjacencies"
        - "GET /redistricting/planning-areas/{id}/housing-developments"
        - "GET /redistricting/housing-developments/{id}"
        - "GET /redistricting/studies/{id}/projection-runs"
        - "GET /redistricting/projection-runs/{id}"
        - "GET /redistricting/scenarios"
        - "GET /redistricting/scenarios/{id}"
        - "GET /redistricting/scenarios/{id}/impact-analysis"
        - "GET /redistricting/assignments"
        - "GET /redistricting/assignments/{id}"
        - "GET /redistricting/comments"
        - "GET /redistricting/comments/{id}"
        - "GET /redistricting/adoptions"
        - "GET /redistricting/adoptions/{id}"
        - "GET /redistricting/adoptions/{id}/phase-in-rules"
        - "GET /redistricting/transfer-requests"
        - "GET /redistricting/transfer-requests/{id}"
        - "GET /redistricting/variance-observations"
        - "GET /redistricting/variance-observations/{id}"
        - "POST /_clock/set_current_utc"
    - role: Guardian
      description: A member of the public. Submits public comment while intake is open and files transfer requests, and reads the public-facing study, school, area, scenario, comment, adoption and transfer records. Cannot see internal planning artifacts (projection runs, assignment tables, variance monitoring).
      exclusive_operations:
        - "POST /redistricting/comments"
        - "POST /redistricting/transfer-requests"
      shared_operations:
        - "GET /redistricting/studies/{id}"
        - "GET /redistricting/studies/{id}/schools"
        - "GET /redistricting/schools/{id}"
        - "GET /redistricting/planning-areas"
        - "GET /redistricting/planning-areas/{id}"
        - "GET /redistricting/scenarios"
        - "GET /redistricting/scenarios/{id}"
        - "GET /redistricting/scenarios/{id}/impact-analysis"
        - "GET /redistricting/comments"
        - "GET /redistricting/comments/{id}"
        - "GET /redistricting/adoptions"
        - "GET /redistricting/adoptions/{id}"
        - "GET /redistricting/adoptions/{id}/phase-in-rules"
        - "GET /redistricting/transfer-requests"
        - "GET /redistricting/transfer-requests/{id}"
        - "POST /_clock/set_current_utc"
  segregation_of_duties_rules:
    - rule: scenario_author_separation
      description: "X-User-ID is stamped onto BoundaryScenario.author_user_id at POST /redistricting/scenarios. The same X-User-ID may not later call POST /redistricting/scenarios/{id}/request-revision, POST /redistricting/scenarios/{id}/advance-to-board or POST /redistricting/adoptions for that scenario, nor POST /redistricting/adoptions/{id}/rescind for an adoption of it. Holding the right role is necessary but not sufficient."
      errors: [ERR_SELF_REVIEW_FORBIDDEN, ERR_SELF_ADOPTION_FORBIDDEN]
    - rule: transfer_filer_separation
      description: "X-User-ID is stamped onto TransferRequest.guardian_user_id at POST /redistricting/transfer-requests. The same X-User-ID may not call POST /redistricting/transfer-requests/{id}/decide for that request even when carrying the TransferOfficer role."
      errors: [ERR_SELF_DECISION_FORBIDDEN]
