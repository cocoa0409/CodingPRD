      - name: invoice_payment_bounds
        claim_type: violation_to_error
        grounds: [state_machines.CaretakingInvoice.ISSUED_to_PARTIALLY_PAID, "errors[ERR_INVOICE_OVERPAYMENT]", "errors[ERR_PAYMENT_AMOUNT_INVALID]"]
        distinguishing_aspect: "Payment rules: amount <= 0 -> ERR_PAYMENT_AMOUNT_INVALID; amount > remaining -> ERR_INVOICE_OVERPAYMENT; partial moves to PARTIALLY_PAID; exact remaining closes at PAID."
        test_recipe:
          setup: ["Invoice total 20000 ISSUED for grower (MOW 11.111 acres line)"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
