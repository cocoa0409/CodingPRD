              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals/${term1_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans"
              payload: { obstructed_sample_count: 1, total_sample_count: 200 }
              as: Subscriber
              as_user_id: "${sub1_id}"
            - call: "POST /satellite-broadband/terminals/${term1_id}/install"
              payload: {}
              as: Subscriber
              as_user_id: "${sub1_id}"
            - call: "GET /satellite-broadband/service-cells/${cell_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { cell_v1: "$.data.version" }
            - call: "POST /satellite-broadband/subscriptions"
              payload: { service_order_id: "${order1_id}", terminal_id: "${term1_id}", expected_service_cell_version: "${cell_v1}" }
              as: ProvisioningAgent
              captures: { sn1_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscriptions/${sn1_id}/disclosure-acknowledgement"
              payload: { acknowledged_version: "CD-2026.1" }
              as: Subscriber
              as_user_id: "${sub1_id}"
            - call: "POST /satellite-broadband/subscriptions/${sn1_id}/authorize"
              payload: { authorization_mode: "FIXED" }
              as: ProvisioningAgent
            - call: "POST /satellite-broadband/subscriptions/${sn1_id}/usage-records"
              payload: { gb_used: 150.0, billing_cycle_index: 0 }
              as: NetworkOpsEngineer
          trigger:
            - call: "POST /satellite-broadband/beams/${beam_id}/billing-cycle-close"
              payload: {}
              as: NetworkOpsEngineer
          assert:
            - "billing-cycle-close response: data.charged_subscription_count == 1"
            - "billing-cycle-close response: data.restored_subscription_count == 1"
            - "billing-cycle-close response: data.billing_cycle_index == 1"
            - "billing-cycle-close response: data.expired_order_count == 0"
            - "billing-cycle-close response: data.disclosure_expired_count == 0"
            - "billing-cycle-close response: data.license_expired == false"
            - "Subscription.${sn1_id}.cycle_charge_cents == 10593"
            - "Subscriber.${sub1_id}.pending_charge_cents == 10593"
            - "Subscription.${sn1_id}.cycle_priority_gb_used == 0"
            - "Subscription.${sn1_id}.priority_state == PRIORITY"
            - "Subscription.${sn1_id}.cycle_billing_index == 1"
            - "Beam.${beam_id}.billing_cycle_index == 1"
            - "Beam.${beam_id}.last_cycle_closed_at == 2026-08-01T00:00:00.000Z"

      - name: beam_weighted_oversubscription_combines_tier_weight_priority_override_and_policy_limit
        grounds:
          - calculations.beam_weighted_oversubscription
          - calculations.fair_use_priority_threshold
          - entities.Beam.fields.weighted_sold_mbps
          - entities.Beam.fields.capacity_state
          - state_machines.Subscription.PRIORITY_to_DEPRIORITIZED
          - concurrency_rules[capacity-policy-stale-beam]
        distinguishing_aspect: |
          Mode (a) — a five-input non-linear formula: committed_rate_mbps x (priority_state override
          DEPRIORITIZED_WEIGHT 0.25 taking precedence over TIER_WEIGHT[PRIORITY_1] 1.0), divided by
          forward_capacity_mbps, then banded against CONSTRAINED_FRACTION 0.75 x the beam's own
          oversubscription_limit. Two 200 Mbps PRIORITY_1 subscriptions on a 100 Mbps beam under a
          policy limit of 3.0 sit at ratio 4.0 (SATURATED); deprioritising one drops
          weighted_sold_mbps to 250.0 and the ratio to 2.5, which is above 0.75 x 3.0 == 2.25 and at
          or below 3.0, hence CONSTRAINED and not NORMAL.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; licence ACTIVE+COORDINATED; beam BEAM-01 forward_capacity_mbps 100; cell CELL-001 max_active_terminals 2; plan PLAN-P1-200 (committed_rate_mbps 200, PRIORITY_1, priority_data_gb 100)."
            - "Two subscriptions on CELL-001 are ACTIVE and AUTHORIZED_FIXED, so weighted_sold_mbps == 400.0 and oversubscription_ratio == 4.0."
            - "A capacity policy has since set oversubscription_limit 3.0 and deprioritization_grace_gb 0, so capacity_state == SATURATED and both cells read CLOSED."
