scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: registration_pricing_provisional_vs_final_diverges
        grounds:
          - calculations.registration_amount_due
          - entities.Registration.fields.amount_due_cents
          - entities.Registration.fields.final_amount_due_cents
          - entities.Event.fields.settlement_adjustment_cents
        distinguishing_aspect: |
          This dual-variant lives in the ticketing/money domain on Registration: the provisional
          variant prices from the CLAIMED group_size at the registration clock (27038 cents) while
          the final variant re-prices from the OBSERVED count of PAID registrations sharing the
          group_code at settlement (28840 cents), so the same row yields two different cents values.
        test_recipe:
          setup:
            - "Event 'Summit A' PUBLISHED then LIVE then ENDED, early_bird_ends_at 2026-08-01T00:00:00Z, logical clock left at its 2026-07-01T00:00:00Z default so early-bird applies."
            - "One VIP ticket type at 30000 cents, quota 10."
            - "One registration with group_code TEAM7 and claimed group_size 5, priced provisionally at 27038 cents and PAID in full; it is the only registration carrying that group_code, so the observed group size at settlement is 1."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Summit A", timezone: "UTC", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T18:00:00Z", early_bird_ends_at: "2026-08-01T00:00:00Z", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "VIP Pass", tier: "VIP", price_cents: 30000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "vip@example.com", group_code: "TEAM7", group_size: 5 }
              as: Organizer
              as_user_id: "org-1"
              captures: { reg_id: $.data.id, prov_amount: $.data.amount_due_cents }
            - call: "POST /api/registrations/${reg_id}/pay"
              payload: { amount_cents: 27038 }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/start"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/end"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "GET /api/events/${ev_id}"
              payload: {}
              as: FinanceAdmin
              as_user_id: "fin-1"
              captures: { ev_v: $.data.version }
          trigger:
            - call: "POST /api/events/${ev_id}/settlements"
              payload: { expected_event_version: "${ev_v}" }
              as: FinanceAdmin
              as_user_id: "fin-1"
              captures: { st_id: $.data.id }
          assert:
            - "${prov_amount} == 27038"
            - "Registration.${reg_id}.amount_due_cents == 27038"
            - "Registration.${reg_id}.final_amount_due_cents == 28840"
            - "Registration.${reg_id}.amount_paid_cents == 27038"
            - "Event.${ev_id}.settlement_adjustment_cents == 1802"
            - "Settlement.${st_id}.subtotal_cents == 28840"
            - "Settlement.${st_id}.platform_fee_cents == 2307"
            - "Settlement.${st_id}.total_cents == 2307"
            - "Settlement.${st_id}.organizer_payout_cents == 26533"

      - name: lead_score_booth_weighted_vs_engagement_weighted_diverges
        grounds:
          - calculations.lead_score
          - entities.Lead.fields.score
          - entities.Lead.fields.score_variant
          - entities.Lead.fields.is_hot
        distinguishing_aspect: |
          This dual-variant lives in the sponsor/CRM domain on Lead, a different entity domain from
          the Registration pricing dual-variant: booth_weighted scores the same Lead row at 13 using
          only booth counters, while engagement_weighted scores it at 73 by folding in the attendee's
          120 watched minutes, flipping is_hot from false to true.
        test_recipe:
          setup:
            - "Event 'Expo B' LIVE with a GOLD sponsor whose contract is SIGNED and whose booth is APPROVED then LIVE."
            - "One registration PAID at 20600 cents (early_bird_ends_at is in the past so no early-bird), CHECKED_IN, with 120 watched minutes recorded against one session and zero accepted meetings."
            - "One Lead captured at the booth with booth_visits 1 and two DOWNLOAD interactions logged, so doc_downloads is 2 and the booth_weighted score is 13."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Expo B", timezone: "UTC", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "lead@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { reg_id: $.data.id }
            - call: "POST /api/registrations/${reg_id}/pay"
              payload: { amount_cents: 20600 }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/sponsors"
              payload: { name: "Acme Cloud", package_tier: "GOLD", contact_email: "sales@acme.example" }
              as: Organizer
              as_user_id: "org-1"
              captures: { sp_id: $.data.id }
            - call: "POST /api/sponsors/${sp_id}/sign-contract"
              payload: { signed_by: "Acme Legal" }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/booths"
              payload: { sponsor_id: "${sp_id}", headline: "Acme Cloud Booth", lead_quota: 2 }
              as: SponsorUser
              as_user_id: "${sp_id}"
              captures: { booth_id: $.data.id }
            - call: "POST /api/booths/${booth_id}/submit"
              payload: {}
              as: SponsorUser
              as_user_id: "${sp_id}"
            - call: "POST /api/booths/${booth_id}/approve"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/tracks"
              payload: { name: "Main Stage" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tr_id: $.data.id }
            - call: "POST /api/sessions"
              payload: { event_id: "${ev_id}", track_id: "${tr_id}", title: "Keynote", starts_at: "2026-09-11T10:00:00Z", ends_at: "2026-09-11T12:00:00Z", session_type: "LIVE", capacity: 500 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ses_id: $.data.id }
            - call: "POST /api/events/${ev_id}/start"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations/${reg_id}/check-in"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/sessions/${ses_id}/attendance"
              payload: { registration_id: "${reg_id}", watched_minutes: 120 }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/booths/${booth_id}/leads"
              payload: { registration_id: "${reg_id}", marketing_consent: true }
              as: Attendee
              as_user_id: "${reg_id}"
              captures: { lead_id: $.data.id }
            - call: "POST /api/leads/${lead_id}/interactions"
              payload: { interaction_type: "DOWNLOAD" }
              as: SponsorUser
              as_user_id: "${sp_id}"
            - call: "POST /api/leads/${lead_id}/interactions"
              payload: { interaction_type: "DOWNLOAD" }
              as: SponsorUser
              as_user_id: "${sp_id}"
              captures: { score_before: $.data.score }
          trigger:
            - call: "POST /api/events/${ev_id}/leads/rescore"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
          assert:
            - "${score_before} == 13"
            - "Lead.${lead_id}.score == 73"
            - "Lead.${lead_id}.score_variant == ENGAGEMENT_WEIGHTED"
            - "Lead.${lead_id}.is_hot == true"
            - "Lead.${lead_id}.booth_visits == 1"
            - "Lead.${lead_id}.doc_downloads == 2"

  - rule_id: combinatorial_formula
    instances:
      - name: sponsor_invoice_rounds_each_line_before_summing
        grounds:
          - calculations.sponsor_settlement_lines
          - entities.Settlement.fields.line_items
          - entities.Settlement.fields.subtotal_cents
          - entities.Booth.fields.captured_lead_count
          - entities.Booth.fields.stream_minutes_total
        distinguishing_aspect: |
          MODE (b) — nested rounding where order matters. Three unit-priced lines (1 x 900000,
          3 x 137.5, 7 x 4.25) rounded per line then summed give subtotal 900443; summing the
          unrounded values (900442.25) and rounding once gives 900442, so the pinned order is
          observable to the cent.
        test_recipe:
          setup:
            - "Event 'Expo C' PUBLISHED with a GENERAL ticket type at 20000 cents, quota 10, early_bird_ends_at in the past."
            - "GOLD sponsor with a booth whose lead_quota is 2, five captured leads (so overage_units is 3) and 7 reported booth stream minutes."
            - "Five distinct registrations, each of which captured one lead at that booth with consent."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Expo C", timezone: "UTC", starts_at: "2026-09-12T09:00:00Z", ends_at: "2026-09-12T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 100 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 10, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/events/${ev_id}/sponsors"
              payload: { name: "Globex", package_tier: "GOLD", contact_email: "sales@globex.example" }
              as: Organizer
              as_user_id: "org-1"
              captures: { sp_id: $.data.id }
            - call: "POST /api/sponsors/${sp_id}/sign-contract"
              payload: { signed_by: "Globex Legal" }
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/booths"
              payload: { sponsor_id: "${sp_id}", headline: "Globex Booth", lead_quota: 2 }
              as: SponsorUser
              as_user_id: "${sp_id}"
              captures: { booth_id: $.data.id }
            - call: "POST /api/booths/${booth_id}/stream-usage"
              payload: { minutes: 7 }
              as: SponsorUser
              as_user_id: "${sp_id}"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "l1@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { r1: $.data.id }
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "l2@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { r2: $.data.id }
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "l3@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { r3: $.data.id }
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "l4@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { r4: $.data.id }
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "l5@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { r5: $.data.id }
            - call: "POST /api/booths/${booth_id}/leads"
              payload: { registration_id: "${r1}", marketing_consent: true }
              as: Attendee
              as_user_id: "${r1}"
            - call: "POST /api/booths/${booth_id}/leads"
              payload: { registration_id: "${r2}", marketing_consent: true }
              as: Attendee
              as_user_id: "${r2}"
            - call: "POST /api/booths/${booth_id}/leads"
              payload: { registration_id: "${r3}", marketing_consent: true }
              as: Attendee
              as_user_id: "${r3}"
            - call: "POST /api/booths/${booth_id}/leads"
              payload: { registration_id: "${r4}", marketing_consent: true }
