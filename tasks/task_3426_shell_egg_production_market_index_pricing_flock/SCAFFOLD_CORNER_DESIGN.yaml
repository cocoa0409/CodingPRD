            - "idx2 == 2 and bucket2 == 44625 (exactly one elapsed week at age 18)"
            - "idx3 == 3 and bucket3 == 44625 — the repeated run-ops at an unchanged clock advances no week and accrues nothing"
            - "Flock.${f1_id}.current_hen_count == 89910 and age_weeks == 19 after the whole sequence"

