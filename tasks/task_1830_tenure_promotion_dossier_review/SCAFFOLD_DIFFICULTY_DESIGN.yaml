  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: extension_half_open_touch_allowed_overlap_rejected
        grounds:
          - calculations.clock_extension_overlap
          - calculations.extension_day_merge
          - state_machines.ClockExtensionRequest.PENDING_to_APPROVED
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the tenure-clock resource: the second
          interval [2023-04-01, 2023-07-01) touches the approved
          [2023-01-01, 2023-04-01) at exactly one endpoint and is ACCEPTED
          (touching is not overlap; merged days 90 + 91 = 181), while
          [2023-03-15, 2023-05-15) genuinely intersects and is rejected with
          ERR_EXTENSION_INTERVAL_OVERLAP.
        test_recipe:
          setup:
            - "Fresh case (ANNIVERSARY, clock start 2020-08-01 -> base mandatory_review_date 2026-08-01), stage DOSSIER_ASSEMBLY"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand E", employee_id: "E1800", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_e: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_e}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_e: $.data.id } }
            - { call: "POST /api/clock-extensions", payload: { case_id: "${case_e}", reason: "PARENTAL_LEAVE", interval_start: "2023-01-01", interval_end: "2023-04-01" }, as: Candidate, as_user_id: "${cand_e}", captures: { ext_e1: $.data.id } }
            - { call: "POST /api/clock-extensions/${ext_e1}/approve", as: ProvostOfficer }
            - { call: "GET /api/cases/${case_e}", as: Any, captures: { e_days_1: $.data.extension_days, e_date_1: $.data.mandatory_review_date } }
            - { call: "POST /api/clock-extensions", payload: { case_id: "${case_e}", reason: "MEDICAL_LEAVE", interval_start: "2023-04-01", interval_end: "2023-07-01" }, as: Candidate, as_user_id: "${cand_e}", captures: { ext_e2: $.data.id } }
            - { call: "POST /api/clock-extensions/${ext_e2}/approve", as: ProvostOfficer, captures: { ext_e2_status: $.data.status } }
            - { call: "POST /api/clock-extensions", payload: { case_id: "${case_e}", reason: "BEREAVEMENT", interval_start: "2023-03-15", interval_end: "2023-05-15" }, as: Candidate, as_user_id: "${cand_e}", captures: { ext_e3: $.data.id } }
          trigger:
            - { call: "POST /api/clock-extensions/${ext_e3}/approve", as: ProvostOfficer, captures: { err_e3: $.data.error_id } }
            - { call: "GET /api/cases/${case_e}", as: Any, captures: { e_days_2: $.data.extension_days, e_date_2: $.data.mandatory_review_date } }
          assert:
            - "e_days_1 == 90 AND e_date_1 == 2026-10-30 (first interval 90 days)"
            - "ext_e2_status == APPROVED (touching interval [2023-04-01, 2023-07-01) shares only the endpoint 2023-04-01 — half-open semantics allow it)"
            - "err_e3 == ERR_EXTENSION_INTERVAL_OVERLAP (true intersection rejected)"
            - "e_days_2 == 181 AND e_date_2 == 2027-01-29 (90 + 91; the failed approval left no drift)"
            - "ClockExtensionRequest.${ext_e3}.status == PENDING (rejection is not a transition)"

      - name: reviewer_capacity_closed_interval_touch_counts
        grounds:
          - calculations.reviewer_capacity
          - errors[ERR_REVIEWER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          CLOSED interval semantics with AGGREGATE capacity on the reviewer
          resource (different semantics and resource from the half-open clock
          rule): the new window [2026-09-10, 2026-09-25] merely TOUCHES the
          first active window [2026-08-10, 2026-09-10] at its endpoint and that
          touch COUNTS as an overlap — combined with the genuinely overlapping
          second window the count reaches 2 and the create is rejected; under
          the clock rule's half-open arithmetic it would have been allowed.
        test_recipe:
          setup:
            - "Three cases (K1, K2, K3) all in EXTERNAL_REVIEW"
            - "Reviewer X: i1 on K1 [2026-08-10, 2026-09-10] SOLICITED; i2 on K2 [2026-09-05, 2026-10-05] SOLICITED (overlaps i1, allowed at count 1)"
