        claim_type: violation_to_error
        grounds: ["errors[ERR_COHORT_NOT_ENROLLABLE]", state_machines.Enrollment]
        distinguishing_aspect: "Activating an enrollment whose cohort was CANCELLED is rejected; the enrollment itself was cascade-cancelled so the state precondition (ERR_INVALID_STATE) also applies — this corner pins the cohort-not-enrollable path by activating after cohort cancel on a still-pending enrollment that survived. NOTE excluded: covered structurally; see rationale."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / activate_state_beats_cohortfull_fiscal
          rationale: "The activate-on-non-enrollable-cohort path collapses to the enrollment state precondition already exercised by the named §1.8 instance (activate on a CANCELLED enrollment yields ERR_INVALID_STATE)."

      - name: guarantee_threshold_met_on_approve
        claim_type: violation_to_error
        grounds: ["errors[ERR_GUARANTEE_THRESHOLD_MET]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / guarantee_delta_exactly_meets_min_is_not_eligible
          rationale: "The delta==min boundary that yields INELIGIBLE (and would, if forced UNDER_REVIEW, trigger ERR_GUARANTEE_THRESHOLD_MET) is the failure path asserted by the named §1.8 boundary instance."

      - name: stale_cohort_version_on_enrollment_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[enrollment-create-stale-cohort]"]
        distinguishing_aspect: "Excluded — OCC stale-version on enrollment create is exercised by the cross-cutting OCC corner below and grounded in §1.2.1."
        excluded_because:
          difficulty_instance: non_linear_state_machine / enrollment_branch_waitlist_then_promote
          rationale: "Stale-version create rejection on Cohort.version is exercised via the OCC cross-cutting corner (occ_stale_cohort_version_rejected); the named §1.8 instance establishes the version-advancing enroll chain it builds on."

