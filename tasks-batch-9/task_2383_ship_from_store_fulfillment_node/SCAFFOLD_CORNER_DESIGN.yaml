        distinguishing_aspect: "A demand line is only reachable through its owning order's path, so an unknown order_id in the path returns 404 ERR_ORDER_NOT_FOUND and the existence check runs before the body is validated."
        test_recipe:
          setup:
            - "Clock 09:00; SKU-A exists; no order carries the probed id."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
          trigger:
            - call: "POST /fulfillment-network/orders/00000000-0000-4000-8000-000000000002/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
              captures: { err_order_nf: "$.data.error_id" }
          assert:
            - "HTTP 404 with ${err_order_nf} == ERR_ORDER_NOT_FOUND"
            - "GET /order-lines returns 0 rows with total_count 0"

