      - name: revoke_cascade_skips_complete_orders
        claim_type: conditional_cascade
        grounds: ["state_machines.ComplianceCertificate.APPROVED_to_REVOKED", "state_machines.ProductionOrder.MATERIAL_ALLOCATED_to_QC_HOLD"]
        distinguishing_aspect: "The revoke cascade's hop 3 is conditional: a COMPLETE order for the same model+state is NOT held, while a MATERIAL_ALLOCATED sibling IS — the cascade inspects child state before mutating."
        test_recipe:
          setup:
            - "Model ACTIVE with ACTIVE CA label; order o1 COMPLETE (units manufactured), order o2 MATERIAL_ALLOCATED, both dest CA"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
