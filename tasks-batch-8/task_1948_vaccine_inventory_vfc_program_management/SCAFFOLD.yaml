# =============================================================================
# Task 1948: Vaccine Inventory & VFC Program Management — Seed Tables
# =============================================================================

scenario: |
  1948. Vaccine Inventory & VFC Program Management (Vaccines for Children provider):
  public vs private stock segregation & eligibility screening per dose, temperature
  monitoring, excursion response & loss reporting, ordering & allocation from state
  program, lot/expiration tracking & short-date transfer, administration documentation
  & registry submission, borrowing between stocks & payback, compliance site visit &
  accountability audit

domain_name: vaccine-inventory-vfc
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ProviderSite
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: site_name, type: string, source: input, description: "Clinic display name" }
      - { name: vfc_pin, type: string, source: input, description: "State-issued VFC provider identification number; unique across sites" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED_ORDERING | TERMINATED", default: ACTIVE }
      - { name: excursion_count_open, type: integer, source: computed, default: 0, description: "Number of TemperatureExcursion rows in OPEN or UNDER_REVIEW state across all StorageUnits of this site" }
      - { name: accountability_balance_doses, type: integer, source: computed, default: 0, description: "Computed per audit: (doses received into PUBLIC_VFC lots) - (doses administered from PUBLIC_VFC lots) - (doses reported wasted from PUBLIC_VFC lots) - (doses transferred out from PUBLIC_VFC lots); a negative value signals an accountability gap that blocks audit closure" }
      - { name: private_lending_balance, type: integer, source: computed, default: 0, description: "Sum across OPEN BorrowTickets where this site borrowed PRIVATE stock to cover a PUBLIC_VFC dose: sum(borrowed_quantity) - sum(paid_back_quantity). Positive = site owes private stock payback." }

  - name: StorageUnit
    parent: ProviderSite
    common_fields: true
    fields:
      - { name: provider_site_id, type: string, source: system, description: "FK -> ProviderSite.id; owning site" }
      - { name: unit_label, type: string, source: input, description: "Operator-facing label (e.g., 'Fridge-1')" }
      - { name: unit_kind, type: enum, source: input, description: "REFRIGERATOR | FREEZER" }
      - { name: min_temp_c, type: number, source: input, description: "Acceptable range low bound, Celsius inclusive; typical REFRIGERATOR 2.0" }
      - { name: max_temp_c, type: number, source: input, description: "Acceptable range high bound, Celsius inclusive; typical REFRIGERATOR 8.0" }
      - { name: active_excursion_id, type: string, source: system, description: "FK -> TemperatureExcursion.id; nullable; set while an excursion is OPEN or UNDER_REVIEW on this unit" }
      - { name: is_quarantined, type: boolean, source: computed, default: false, description: "True while active_excursion_id is non-null; blocks any new dose administration drawing from lots stored in this unit" }

  - name: VaccineProduct
    parent: null
    common_fields: true
    fields:
      - { name: ndc_code, type: string, source: input, description: "National Drug Code; unique across catalog" }
      - { name: display_name, type: string, source: input, description: "e.g., 'MMR II (Merck)'" }
      - { name: presentation, type: enum, source: input, description: "SINGLE_DOSE_VIAL | MULTI_DOSE_VIAL | PRE_FILLED_SYRINGE" }
      - { name: doses_per_container, type: integer, source: input, description: "Number of doses yielded by one container; >= 1" }
      - { name: vfc_program_eligible, type: boolean, source: input, description: "True when the state VFC program funds this product for eligible children" }
      - { name: storage_requirement, type: enum, source: input, description: "REFRIGERATED_2_8C | FROZEN_MINUS_50_MINUS_15C | ULTRA_COLD_MINUS_90_MINUS_60C" }

  - name: Lot
    parent: ProviderSite
    common_fields: true
    fields:
      - { name: provider_site_id, type: string, source: system, description: "FK -> ProviderSite.id; site that owns the physical stock" }
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id; unit the lot is physically stored in" }
      - { name: vaccine_product_id, type: string, source: input, description: "FK -> VaccineProduct.id" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number; unique per (vaccine_product_id, stock_type) pair" }
      - { name: stock_type, type: enum, source: input, description: "PUBLIC_VFC | PRIVATE — segregation is mandatory; never mixed within a single Lot row" }
      - { name: quantity_on_hand, type: integer, source: computed, default: 0, description: "Doses currently in the unit, EXCLUDING doses marked wasted/expired/transferred-out. Decremented by administration, wastage, transfer; incremented by allocation receipt, transfer-in, borrow-payback receipt." }
      - { name: quantity_borrowed_in, type: integer, source: computed, default: 0, description: "Portion of quantity_on_hand that was obtained via a BorrowTicket (PUBLIC borrowed from PRIVATE, or vice versa) and is therefore earmarked for payback reconciliation" }
      - { name: expires_on, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD) of manufacturer expiration; administration allowed while current_date <= expires_on" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | QUARANTINED | DEPLETED | EXPIRED | WASTED_CLOSED" }
      - { name: received_via_order_id, type: string, source: system, description: "FK -> VaccineOrder.id; nullable; set when the lot was created as an allocation receipt from a state order" }

  - name: TemperatureReading
    parent: StorageUnit
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: storage_unit_id, type: string, source: system, description: "FK -> StorageUnit.id" }
      - { name: recorded_at, type: datetime, source: input, description: "ISO-8601 UTC timestamp the probe sampled the temperature" }
      - { name: temperature_c, type: number, source: input, description: "Probe reading in Celsius, one decimal place" }
      - { name: is_out_of_range, type: boolean, source: computed, description: "True iff temperature_c < unit.min_temp_c OR temperature_c > unit.max_temp_c" }

  - name: TemperatureExcursion
    parent: StorageUnit
    common_fields: true
    fields:
      - { name: storage_unit_id, type: string, source: system, description: "FK -> StorageUnit.id" }
      - { name: opened_at, type: datetime, source: system, description: "Timestamp of the first out-of-range reading that opened this excursion" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp of the first subsequent in-range reading; null while open" }
      - { name: peak_temperature_c, type: number, source: computed, description: "Most extreme reading observed during the excursion: highest reading above max_temp_c, or lowest below min_temp_c, whichever deviates more from its bound" }
      - { name: duration_minutes, type: integer, source: computed, description: "(closed_at - opened_at) in whole minutes once closed; 0 while open" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> UNDER_REVIEW -> RESOLVED_VIABLE | RESOLVED_WASTED" }
      - { name: resolution_notes, type: string, source: input, description: "Free-text notes recorded when transitioning to RESOLVED_VIABLE or RESOLVED_WASTED" }
      - { name: doses_written_off, type: integer, source: computed, default: 0, description: "Number of doses marked WASTED when status -> RESOLVED_WASTED" }

  - name: Patient
    parent: ProviderSite
    common_fields: true
    fields:
      - { name: provider_site_id, type: string, source: system, description: "FK -> ProviderSite.id; primary site of care" }
      - { name: full_name, type: string, source: input, description: "Patient display name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD); patient must be < 19 years old on date_of_service to be VFC-eligible" }
      - { name: insurance_category, type: enum, source: input, description: "MEDICAID | UNINSURED | UNDERINSURED | AMERICAN_INDIAN_ALASKA_NATIVE | COMMERCIAL — VFC-eligible categories are the first four; COMMERCIAL is not VFC-eligible" }
      - { name: is_active, type: boolean, source: input, default: true, description: "False after the patient is inactivated (e.g., moved away)" }

  - name: EligibilityScreening
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: screening_date, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD) of visit" }
      - { name: screened_by_user_id, type: string, source: system, description: "Operator X-User-ID who recorded the screening" }
      - { name: insurance_category_at_visit, type: enum, source: input, description: "Same enum as Patient.insurance_category; captures the verified category as of this visit (Patient row may later change)" }
      - { name: vfc_eligible, type: boolean, source: computed, description: "True iff (age on screening_date < 19) AND (insurance_category_at_visit IN {MEDICAID, UNINSURED, UNDERINSURED, AMERICAN_INDIAN_ALASKA_NATIVE})" }
      - { name: outcome, type: enum, source: computed, description: "VFC_ELIGIBLE | PRIVATE_ONLY — derived from vfc_eligible" }

  - name: DoseAdministration
    parent: ProviderSite
    common_fields: true
    fields:
      - { name: provider_site_id, type: string, source: system, description: "FK -> ProviderSite.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: eligibility_screening_id, type: string, source: input, description: "FK -> EligibilityScreening.id; must be a screening recorded on the same calendar date as administration_date" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the lot the dose was drawn from" }
      - { name: administration_date, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD)" }
      - { name: administered_by_user_id, type: string, source: system, description: "Operator X-User-ID who administered the dose" }
      - { name: funding_source, type: enum, source: computed, description: "PUBLIC_VFC when lot.stock_type == PUBLIC_VFC; PRIVATE when lot.stock_type == PRIVATE" }
      - { name: registry_status, type: enum, source: system, default: PENDING_SUBMISSION, description: "PENDING_SUBMISSION | SUBMITTED | REJECTED_BY_REGISTRY" }
      - { name: borrowed_context_ticket_id, type: string, source: system, description: "FK -> BorrowTicket.id; nullable; set when this administration was covered by borrowing (lot.stock_type disagrees with the screening outcome and a BorrowTicket was used)" }

  - name: VaccineOrder
    parent: ProviderSite
    common_fields: true
    fields:
      - { name: provider_site_id, type: string, source: system, description: "FK -> ProviderSite.id" }
      - { name: order_number, type: string, source: system, description: "Server-minted sequence number unique per site" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Operator X-User-ID who submitted the order" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> APPROVED -> PARTIALLY_RECEIVED -> FULLY_RECEIVED | CANCELLED" }
      - { name: expected_vfc_doses, type: integer, source: input, description: "Total PUBLIC_VFC doses requested; >= 1" }
      - { name: approved_vfc_doses, type: integer, source: system, default: 0, description: "Set by StateProgramOfficer on APPROVED transition; may be less than expected_vfc_doses (state allocation)" }
      - { name: received_vfc_doses, type: integer, source: computed, default: 0, description: "Running total of doses received against this order via allocation receipts" }

  - name: OrderLine
    parent: VaccineOrder
    common_fields: true
    fields:
      - { name: vaccine_order_id, type: string, source: system, description: "FK -> VaccineOrder.id" }
      - { name: vaccine_product_id, type: string, source: input, description: "FK -> VaccineProduct.id" }
      - { name: requested_doses, type: integer, source: input, description: "Doses requested of this product; >= 1" }
      - { name: approved_doses, type: integer, source: system, default: 0, description: "Set on order approval; allocation is final authority" }
      - { name: received_doses, type: integer, source: computed, default: 0, description: "Cumulative doses received against this line; must never exceed approved_doses" }

  - name: AllocationReceipt
    parent: VaccineOrder
    common_fields: true
    fields:
      - { name: vaccine_order_id, type: string, source: system, description: "FK -> VaccineOrder.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id" }
      - { name: storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id that will hold the new lot" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number on the shipped vials" }
      - { name: expires_on, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD) printed on the vial" }
      - { name: quantity_doses, type: integer, source: input, description: "Doses received in this shipment; >= 1" }
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; server creates a new Lot row with stock_type=PUBLIC_VFC on receipt" }

  - name: BorrowTicket
    parent: ProviderSite
    common_fields: true
    fields:
      - { name: provider_site_id, type: string, source: system, description: "FK -> ProviderSite.id" }
      - { name: from_lot_id, type: string, source: input, description: "FK -> Lot.id; lender lot the physical doses were pulled from (its quantity_on_hand decrements on open)" }
      - { name: to_lot_id, type: string, source: input, description: "FK -> Lot.id; borrower lot of the opposite stock_type whose program conceptually consumed the dose. Its quantity_borrowed_in is incremented to record the IOU; its quantity_on_hand does NOT change (the physical doses went into a patient)." }
      - { name: direction, type: enum, source: input, description: "PUBLIC_FROM_PRIVATE | PRIVATE_FROM_PUBLIC — VFC rules permit only borrowing across stock_type, never within the same stock_type. PUBLIC_FROM_PRIVATE means a VFC-eligible dose was administered from PRIVATE stock; PUBLIC stock owes PRIVATE a payback." }
      - { name: borrowed_quantity, type: integer, source: input, description: "Doses borrowed; >= 1" }
      - { name: paid_back_quantity, type: integer, source: computed, default: 0, description: "Cumulative payback recorded against this ticket" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> PARTIALLY_REPAID -> REPAID | VOIDED" }
      - { name: opened_by_user_id, type: string, source: system, description: "Operator X-User-ID who recorded the borrow" }
      - { name: reason_code, type: enum, source: input, description: "STOCK_OUT | SHORT_DATE_AVOIDANCE | EMERGENCY_CLINIC" }

  - name: SiteVisitAudit
    parent: ProviderSite
    common_fields: true
    fields:
      - { name: provider_site_id, type: string, source: system, description: "FK -> ProviderSite.id" }
      - { name: visit_date, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD) of the on-site visit" }
      - { name: conducted_by_user_id, type: string, source: system, description: "ComplianceAuditor X-User-ID" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> IN_PROGRESS -> FINDINGS_ISSUED -> CLOSED_PASS | CLOSED_FAIL | CANCELLED" }
      - { name: public_doses_received, type: integer, source: computed, description: "Snapshot at audit close: total doses received into PUBLIC_VFC lots of this site over all time" }
      - { name: public_doses_administered, type: integer, source: computed, description: "Snapshot at audit close: total PUBLIC_VFC doses administered" }
      - { name: public_doses_wasted, type: integer, source: computed, description: "Snapshot at audit close: total PUBLIC_VFC doses written off via excursion resolution or expiry" }
      - { name: public_doses_transferred_out, type: integer, source: computed, description: "Snapshot at audit close: total PUBLIC_VFC doses shipped out via short-date transfer" }
      - { name: accountability_gap, type: integer, source: computed, description: "public_doses_received - public_doses_administered - public_doses_wasted - public_doses_transferred_out; must equal on-hand PUBLIC_VFC quantity_on_hand total to close PASS" }
      - { name: on_hand_public_total, type: integer, source: computed, description: "Sum of quantity_on_hand across all lots of this site with stock_type == PUBLIC_VFC at audit close" }

  - name: ShortDateTransfer
    parent: ProviderSite
    common_fields: true
    fields:
      - { name: provider_site_id, type: string, source: system, description: "FK -> ProviderSite.id; origin site" }
      - { name: from_lot_id, type: string, source: input, description: "FK -> Lot.id; lot the doses leave" }
      - { name: destination_site_id, type: string, source: input, description: "FK -> ProviderSite.id; receiving site" }
      - { name: destination_storage_unit_id, type: string, source: input, description: "FK -> StorageUnit.id at the receiving site" }
      - { name: quantity_doses, type: integer, source: input, description: ">= 1" }
      - { name: reason, type: string, source: input, description: "Free text; e.g., 'short-dated, reallocate to high-volume site'" }
      - { name: status, type: enum, source: system, default: INITIATED, description: "INITIATED -> IN_TRANSIT -> RECEIVED | CANCELLED" }
      - { name: new_lot_id, type: string, source: system, description: "FK -> Lot.id; on RECEIVED, server creates a successor lot at the destination with the same lot_number, expires_on, stock_type, vaccine_product_id" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProviderSite
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED_ORDERING
        trigger: POST /provider-sites/{id}/suspend-ordering
        actor: ComplianceAuditor
        preconditions:
          - "Site must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Blocks new VaccineOrder submission while suspended"

      - from: SUSPENDED_ORDERING
        to: ACTIVE
        trigger: POST /provider-sites/{id}/reinstate-ordering
        actor: ComplianceAuditor
        preconditions:
          - "Site must be SUSPENDED_ORDERING (ERR_INVALID_STATE)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: POST /provider-sites/{id}/terminate
        actor: ComplianceAuditor
        preconditions:
          - "No OPEN or UNDER_REVIEW TemperatureExcursion across site's storage units (ERR_OPEN_EXCURSION_EXISTS)"
          - "No OPEN or PARTIALLY_REPAID BorrowTicket (ERR_OPEN_BORROW_TICKET_EXISTS)"
          - "No SiteVisitAudit in SCHEDULED or IN_PROGRESS (ERR_OPEN_AUDIT_EXISTS)"
        side_effects:
          - "All AVAILABLE lots at this site transition to WASTED_CLOSED"

      - from: SUSPENDED_ORDERING
        to: TERMINATED
        trigger: POST /provider-sites/{id}/terminate
        actor: ComplianceAuditor
        preconditions:
          - "No OPEN or UNDER_REVIEW TemperatureExcursion across site's storage units (ERR_OPEN_EXCURSION_EXISTS)"
          - "No OPEN or PARTIALLY_REPAID BorrowTicket (ERR_OPEN_BORROW_TICKET_EXISTS)"
          - "No SiteVisitAudit in SCHEDULED or IN_PROGRESS (ERR_OPEN_AUDIT_EXISTS)"
        side_effects:
          - "All AVAILABLE lots at this site transition to WASTED_CLOSED"

  - entity: Lot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED, EXPIRED, WASTED_CLOSED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system (automatic when owning StorageUnit opens a TemperatureExcursion)"
        actor: system
        preconditions:
          - "Lot.status == AVAILABLE and StorageUnit.active_excursion_id becomes non-null"
        side_effects: []

      - from: QUARANTINED
        to: AVAILABLE
        trigger: "system (automatic when the active TemperatureExcursion resolves RESOLVED_VIABLE)"
        actor: system
        preconditions:
          - "TemperatureExcursion.status transitioned to RESOLVED_VIABLE"
        side_effects: []

      - from: QUARANTINED
        to: WASTED_CLOSED
        trigger: "system (automatic when the active TemperatureExcursion resolves RESOLVED_WASTED)"
        actor: system
        preconditions:
          - "TemperatureExcursion.status transitioned to RESOLVED_WASTED"
        side_effects:
          - "TemperatureExcursion.doses_written_off += this lot's quantity_on_hand (pre-write-off value)"
          - "Lot.quantity_on_hand set to 0"
          - "ProviderSite.accountability_balance_doses recomputed (wasted side of the ledger)"

      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (automatic when quantity_on_hand reaches 0 via administration, transfer, or payback)"
        actor: system
        preconditions:
          - "quantity_on_hand == 0"
        side_effects: []

      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (automatic when logical clock crosses past Lot.expires_on and quantity_on_hand > 0)"
        actor: system
        preconditions:
          - "current_date > expires_on AND quantity_on_hand > 0"
        side_effects:
          - "quantity_on_hand set to 0"
          - "If stock_type == PUBLIC_VFC: ProviderSite.accountability_balance_doses recomputed (wasted side)"

      - from: AVAILABLE
        to: WASTED_CLOSED
        trigger: "system (cascade from ProviderSite.terminate)"
        actor: system
        preconditions: []
        side_effects:
          - "quantity_on_hand set to 0"

  - entity: TemperatureExcursion
    initial_state: OPEN
    terminal_states: [RESOLVED_VIABLE, RESOLVED_WASTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: POST /storage-units/{id}/excursions/{excursionId}/begin-review
        actor: VaccineManager
        preconditions:
          - "Excursion must be OPEN (ERR_INVALID_STATE)"
          - "closed_at must be non-null (an in-range reading must have been recorded) (ERR_EXCURSION_STILL_OPEN)"
        side_effects: []

      - from: UNDER_REVIEW
        to: RESOLVED_VIABLE
        trigger: POST /storage-units/{id}/excursions/{excursionId}/resolve-viable
        actor: VaccineManager
        preconditions:
          - "Excursion must be UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "All QUARANTINED lots in this storage unit -> AVAILABLE"
          - "StorageUnit.active_excursion_id := null, is_quarantined := false"
          - "ProviderSite.excursion_count_open -= 1"

      - from: UNDER_REVIEW
        to: RESOLVED_WASTED
        trigger: POST /storage-units/{id}/excursions/{excursionId}/resolve-wasted
        actor: VaccineManager
        preconditions:
          - "Excursion must be UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "All QUARANTINED lots in this storage unit -> WASTED_CLOSED; their quantity_on_hand is summed into this excursion's doses_written_off and then zeroed"
          - "StorageUnit.active_excursion_id := null, is_quarantined := false"
          - "ProviderSite.excursion_count_open -= 1"
          - "For each PUBLIC_VFC lot wasted: ProviderSite.accountability_balance_doses recomputed"

  - entity: VaccineOrder
    initial_state: DRAFT
    terminal_states: [FULLY_RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /provider-sites/{id}/vaccine-orders/{orderId}/submit
        actor: VaccineManager
        preconditions:
          - "Order must be DRAFT (ERR_INVALID_STATE)"
          - "At least one OrderLine exists (ERR_EMPTY_ORDER)"
          - "ProviderSite.status == ACTIVE (ERR_SITE_SUSPENDED_ORDERING)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: POST /provider-sites/{id}/vaccine-orders/{orderId}/approve
        actor: StateProgramOfficer
        preconditions:
          - "Order must be SUBMITTED (ERR_INVALID_STATE)"
          - "Every OrderLine.approved_doses must be set (>= 0) before approval (ERR_LINE_ALLOCATION_MISSING)"
          - "Sum of OrderLine.approved_doses across lines must equal VaccineOrder.approved_vfc_doses (ERR_ALLOCATION_MISMATCH)"
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /provider-sites/{id}/vaccine-orders/{orderId}/cancel
        actor: VaccineManager
        preconditions:
          - "Order must be DRAFT or SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: POST /provider-sites/{id}/vaccine-orders/{orderId}/cancel
        actor: VaccineManager
        preconditions:
          - "Order must be DRAFT or SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: PARTIALLY_RECEIVED
        trigger: "system (automatic on first AllocationReceipt posting)"
        actor: system
        preconditions:
          - "received_vfc_doses > 0 AND received_vfc_doses < approved_vfc_doses"
        side_effects: []

      - from: PARTIALLY_RECEIVED
        to: FULLY_RECEIVED
        trigger: "system (automatic when received_vfc_doses == approved_vfc_doses)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: FULLY_RECEIVED
        trigger: "system (automatic when a single AllocationReceipt posting brings received_vfc_doses == approved_vfc_doses from 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BorrowTicket
    initial_state: OPEN
    terminal_states: [REPAID, VOIDED]
    transitions:
      - from: OPEN
        to: PARTIALLY_REPAID
        trigger: POST /provider-sites/{id}/borrow-tickets/{ticketId}/record-payback
        actor: VaccineManager
        preconditions:
          - "Ticket must be OPEN or PARTIALLY_REPAID (ERR_INVALID_STATE)"
          - "payback_quantity >= 1 (ERR_INVALID_REQUEST)"
          - "paid_back_quantity + payback_quantity <= borrowed_quantity (ERR_PAYBACK_EXCEEDS_BORROWED)"
          - "Paying lot (paying_lot_id) must have stock_type matching the BORROWER's stock_type (to_lot.stock_type) — for PUBLIC_FROM_PRIVATE, the paying lot is a PUBLIC_VFC lot that replenishes the PRIVATE lender; for PRIVATE_FROM_PUBLIC, the paying lot is a PRIVATE lot that replenishes the PUBLIC lender"
          - "Paying lot must be AVAILABLE (ERR_LOT_NOT_AVAILABLE) with quantity_on_hand >= payback_quantity (ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "BorrowTicket.paid_back_quantity += payback_quantity"
          - "paying_lot.quantity_on_hand -= payback_quantity"
          - "BorrowTicket.from_lot.quantity_on_hand += payback_quantity  (physical doses return to the lender lot)"
          - "BorrowTicket.to_lot.quantity_borrowed_in -= payback_quantity  (the IOU on the borrower lot is amortized)"
          - "ProviderSite.private_lending_balance recomputed"
          - "If paid_back_quantity == borrowed_quantity: status -> REPAID"

      - from: PARTIALLY_REPAID
        to: PARTIALLY_REPAID
        trigger: POST /provider-sites/{id}/borrow-tickets/{ticketId}/record-payback
        actor: VaccineManager
        preconditions:
          - "Ticket must be OPEN or PARTIALLY_REPAID (ERR_INVALID_STATE)"
          - "paid_back_quantity + payback_quantity <= borrowed_quantity (ERR_PAYBACK_EXCEEDS_BORROWED)"
        side_effects:
          - "Same as OPEN -> PARTIALLY_REPAID"
        note: "Self-loop allows multiple partial paybacks before final repayment"

      - from: PARTIALLY_REPAID
        to: REPAID
        trigger: "system (automatic when paid_back_quantity == borrowed_quantity)"
        actor: system
        preconditions: []
        side_effects:
          - "ProviderSite.private_lending_balance recomputed"

      - from: OPEN
        to: REPAID
        trigger: "system (automatic when a single record-payback brings paid_back_quantity == borrowed_quantity)"
        actor: system
        preconditions: []
        side_effects:
          - "ProviderSite.private_lending_balance recomputed"

      - from: OPEN
        to: VOIDED
        trigger: POST /provider-sites/{id}/borrow-tickets/{ticketId}/void
        actor: VaccineManager
        preconditions:
          - "Ticket must be OPEN (ERR_INVALID_STATE)"
          - "paid_back_quantity must equal 0 (ERR_TICKET_HAS_PAYBACK)"
          - "The borrowed IOU on to_lot must still be intact (to_lot.quantity_borrowed_in >= borrowed_quantity) (ERR_BORROWED_DOSES_CONSUMED)"
        side_effects:
          - "Decrement to_lot.quantity_borrowed_in by borrowed_quantity (cancel the IOU)"
          - "Increment from_lot.quantity_on_hand by borrowed_quantity (return physical doses to the lender; reverses the open-time decrement)"
          - "ProviderSite.private_lending_balance recomputed"

  - entity: SiteVisitAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED_PASS, CLOSED_FAIL, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /provider-sites/{id}/site-visit-audits/{auditId}/begin
        actor: ComplianceAuditor
        preconditions:
          - "Audit must be SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

      - from: IN_PROGRESS
        to: FINDINGS_ISSUED
        trigger: POST /provider-sites/{id}/site-visit-audits/{auditId}/issue-findings
        actor: ComplianceAuditor
        preconditions:
          - "Audit must be IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Compute snapshot fields: public_doses_received, public_doses_administered, public_doses_wasted, public_doses_transferred_out, accountability_gap, on_hand_public_total"

      - from: FINDINGS_ISSUED
        to: CLOSED_PASS
        trigger: POST /provider-sites/{id}/site-visit-audits/{auditId}/close-pass
        actor: ComplianceAuditor
        preconditions:
          - "Audit must be FINDINGS_ISSUED (ERR_INVALID_STATE)"
          - "accountability_gap == on_hand_public_total (ERR_ACCOUNTABILITY_GAP_UNRESOLVED)"
          - "No OPEN or UNDER_REVIEW TemperatureExcursion (ERR_OPEN_EXCURSION_EXISTS)"
          - "No OPEN or PARTIALLY_REPAID BorrowTicket (ERR_OPEN_BORROW_TICKET_EXISTS)"
        side_effects: []

      - from: FINDINGS_ISSUED
        to: CLOSED_FAIL
        trigger: POST /provider-sites/{id}/site-visit-audits/{auditId}/close-fail
        actor: ComplianceAuditor
        preconditions:
          - "Audit must be FINDINGS_ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "ProviderSite.status := SUSPENDED_ORDERING"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /provider-sites/{id}/site-visit-audits/{auditId}/cancel
        actor: ComplianceAuditor
        preconditions:
          - "Audit must be SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: ShortDateTransfer
    initial_state: INITIATED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: INITIATED
        to: IN_TRANSIT
        trigger: POST /provider-sites/{id}/short-date-transfers/{transferId}/ship
        actor: VaccineManager
        preconditions:
          - "Transfer must be INITIATED (ERR_INVALID_STATE)"
          - "from_lot.status == AVAILABLE (ERR_LOT_NOT_AVAILABLE)"
          - "from_lot.quantity_on_hand >= quantity_doses (ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "from_lot.quantity_on_hand -= quantity_doses"

      - from: IN_TRANSIT
        to: RECEIVED
        trigger: POST /provider-sites/{id}/short-date-transfers/{transferId}/receive
        actor: VaccineManager
        preconditions:
          - "Transfer must be IN_TRANSIT (ERR_INVALID_STATE)"
          - "destination_storage_unit_id must belong to destination_site_id (ERR_UNIT_SITE_MISMATCH)"
          - "destination unit must not be quarantined (ERR_STORAGE_UNIT_QUARANTINED)"
        side_effects:
          - "Create successor Lot at destination with same lot_number, expires_on, stock_type, vaccine_product_id; quantity_on_hand := quantity_doses"
          - "ShortDateTransfer.new_lot_id := created lot id"
          - "If destination lot (same lot_number, stock_type) already exists: increment its quantity_on_hand instead of creating a new row"

      - from: INITIATED
        to: CANCELLED
        trigger: POST /provider-sites/{id}/short-date-transfers/{transferId}/cancel
        actor: VaccineManager
        preconditions:
          - "Transfer must be INITIATED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: DoseAdministration
    initial_state: PENDING_SUBMISSION
    terminal_states: [SUBMITTED, REJECTED_BY_REGISTRY]
    transitions:
      - from: PENDING_SUBMISSION
        to: SUBMITTED
        trigger: POST /provider-sites/{id}/dose-administrations/{doseId}/submit-registry
        actor: VaccineManager
        preconditions:
          - "Dose must be PENDING_SUBMISSION (ERR_INVALID_STATE)"
        side_effects: []

      - from: PENDING_SUBMISSION
        to: REJECTED_BY_REGISTRY
        trigger: POST /provider-sites/{id}/dose-administrations/{doseId}/mark-registry-rejected
        actor: VaccineManager
        preconditions:
          - "Dose must be PENDING_SUBMISSION (ERR_INVALID_STATE)"
        side_effects: []

      - from: REJECTED_BY_REGISTRY
        to: PENDING_SUBMISSION
        trigger: POST /provider-sites/{id}/dose-administrations/{doseId}/reset-registry
        actor: VaccineManager
        preconditions:
          - "Dose must be REJECTED_BY_REGISTRY (ERR_INVALID_STATE)"
        side_effects: []
        note: "Cyclic resubmission path permits correction and re-filing with the state immunization registry"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-approve-stale-site
    parent_entity: ProviderSite
    write_endpoint: "POST /provider-sites/{id}/vaccine-orders/{orderId}/approve"
    occ_field: "expected_provider_site_version"
    description: |
      Approving a VaccineOrder against a ProviderSite whose version has advanced
      since the approver last observed it is rejected. This captures the case
      where a prior approval, receipt posting, suspension, or excursion cascade
      has legitimately moved the site's version forward and the current
      approver's view of the site's compliance posture is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payback-stale-ticket
    parent_entity: BorrowTicket
    write_endpoint: "POST /provider-sites/{id}/borrow-tickets/{ticketId}/record-payback"
    occ_field: "expected_borrow_ticket_version"
    description: |
      Recording a payback against a BorrowTicket whose version has advanced
      since the caller last observed it is rejected. This captures the case
      where another operator has just posted a partial payback (which bumps
      the ticket's version) and the current caller's paid_back_quantity view
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: vfc_eligibility_determination
    trigger: "EligibilityScreening creation"
    algorithm: constraint_propagation
    formula: |
      age_at_visit_years = floor((screening_date - Patient.date_of_birth) / 365.25 days)
      categorical_ok = (insurance_category_at_visit IN
                        {MEDICAID, UNINSURED, UNDERINSURED, AMERICAN_INDIAN_ALASKA_NATIVE})
      age_ok = (age_at_visit_years < 19)
      vfc_eligible = categorical_ok AND age_ok
      outcome = VFC_ELIGIBLE if vfc_eligible else PRIVATE_ONLY
    input_set: "The newly created EligibilityScreening plus its parent Patient"
    precision: "boolean; age computed as full years elapsed"

  - name: accountability_balance_reconciliation
    trigger: "SiteVisitAudit.issue-findings; also recomputed incrementally on every event that affects any term"
    algorithm: aggregation
    formula: |
      public_doses_received       = sum(AllocationReceipt.quantity_doses)
                                    for all receipts whose order belongs to this site
      public_doses_administered   = count(DoseAdministration)
                                    where funding_source == PUBLIC_VFC
                                    and provider_site_id == site
      public_doses_wasted         = sum(TemperatureExcursion.doses_written_off
                                        restricted to PUBLIC_VFC lots of this site)
                                  + sum(Lot pre-zero quantity_on_hand for PUBLIC_VFC
                                        lots transitioned to EXPIRED at this site)
      public_doses_transferred_out= sum(ShortDateTransfer.quantity_doses)
                                    where from_lot.stock_type == PUBLIC_VFC
                                    and status IN {IN_TRANSIT, RECEIVED}
      accountability_gap          = public_doses_received
                                  - public_doses_administered
                                  - public_doses_wasted
                                  - public_doses_transferred_out
      on_hand_public_total        = sum(Lot.quantity_on_hand)
                                    where provider_site_id == site
                                    and stock_type == PUBLIC_VFC
                                    and status IN {AVAILABLE, QUARANTINED}
    input_set: "All AllocationReceipt / DoseAdministration / TemperatureExcursion / ShortDateTransfer / Lot rows for the site, regardless of when they were created"
    precision: "integer doses; no rounding"
    variants:
      - name: provisional_snapshot
        when: "During audit IN_PROGRESS — the field ProviderSite.accountability_balance_doses updates incrementally on every contributing event"
        difference: "Includes transfers in INITIATED state (doses have not yet left the shelf) and excludes excursions in OPEN state (no write-off yet)"
      - name: final_snapshot
        when: "At SiteVisitAudit.issue-findings — the snapshot fields on SiteVisitAudit are frozen for audit closure"
        difference: "Includes only transfers in IN_TRANSIT or RECEIVED (doses physically off the shelf); OPEN excursions contribute 0 to wasted; total uses end-of-day semantics"

  - name: private_lending_balance
    trigger: "BorrowTicket open, record-payback, void"
    algorithm: aggregation
    formula: |
      private_lending_balance = sum over BorrowTicket bt of
        (bt.borrowed_quantity - bt.paid_back_quantity)
        where bt.status IN {OPEN, PARTIALLY_REPAID}
        and bt.direction == PUBLIC_FROM_PRIVATE
    input_set: "OPEN and PARTIALLY_REPAID BorrowTickets with direction == PUBLIC_FROM_PRIVATE at this site"
    precision: "integer doses"
    variants:
      - name: gross_lending_view
        when: "Regulatory reporting — includes both directions"
        difference: "Sums both PUBLIC_FROM_PRIVATE and PRIVATE_FROM_PUBLIC outstanding balances separately rather than netting"

  - name: excursion_peak_temperature
    trigger: "Each TemperatureReading recorded while its unit has an OPEN excursion"
    algorithm: aggregation
    formula: |
      if reading.temperature_c > unit.max_temp_c:
        candidate_deviation = reading.temperature_c - unit.max_temp_c
      elif reading.temperature_c < unit.min_temp_c:
        candidate_deviation = unit.min_temp_c - reading.temperature_c
      else:
        candidate_deviation = -1   # in-range; not a candidate

      existing_deviation =
        if excursion.peak_temperature_c > unit.max_temp_c:
          excursion.peak_temperature_c - unit.max_temp_c
        else:
          unit.min_temp_c - excursion.peak_temperature_c

      if candidate_deviation > existing_deviation:
        excursion.peak_temperature_c = reading.temperature_c
    input_set: "The single incoming TemperatureReading vs the current TemperatureExcursion"
    precision: "1 decimal place, Celsius"

  - name: excursion_duration_minutes
    trigger: "TemperatureReading that closes an excursion (first in-range reading after OPEN)"
    algorithm: chronological
    formula: |
      excursion.closed_at = reading.recorded_at
      excursion.duration_minutes = floor((closed_at - opened_at) / 60 seconds)
    input_set: "Single TemperatureExcursion"
    precision: "integer minutes, floor"

  - name: doses_written_off_on_wasted_resolution
    trigger: "TemperatureExcursion.resolve-wasted"
    algorithm: aggregation
    formula: |
      doses_written_off = sum over Lot l of l.quantity_on_hand
        where l.storage_unit_id == excursion.storage_unit_id
        and l.status == QUARANTINED
      For each such lot: l.quantity_on_hand := 0; l.status := WASTED_CLOSED
    input_set: "All QUARANTINED lots in the affected storage unit at the moment of resolution"
    precision: "integer doses"

  - name: payback_quantity_validation
    trigger: "BorrowTicket.record-payback"
    algorithm: threshold
    formula: |
      remaining = bt.borrowed_quantity - bt.paid_back_quantity
      if payback_quantity < 1:               ERR_INVALID_REQUEST
      if payback_quantity > remaining:        ERR_PAYBACK_EXCEEDS_BORROWED
      if paying_lot.quantity_on_hand < payback_quantity:
                                              ERR_INSUFFICIENT_STOCK
    input_set: "Single BorrowTicket + the source paying lot"
    precision: "integer doses; boundary at exactly remaining (allowed, closes ticket) vs remaining+1 (rejected)"

  - name: short_date_transfer_successor_lot_quantity
    trigger: "ShortDateTransfer.receive"
    algorithm: aggregation
    formula: |
      # If a lot at destination already exists with same lot_number AND stock_type
      # AND vaccine_product_id AND status == AVAILABLE, merge:
      if existing_lot_found:
        existing_lot.quantity_on_hand += transfer.quantity_doses
        transfer.new_lot_id = existing_lot.id
      else:
        create Lot(quantity_on_hand = transfer.quantity_doses,
                   lot_number = from_lot.lot_number,
                   expires_on = from_lot.expires_on,
                   stock_type = from_lot.stock_type,
                   vaccine_product_id = from_lot.vaccine_product_id,
                   storage_unit_id = transfer.destination_storage_unit_id,
                   provider_site_id = transfer.destination_site_id)
        transfer.new_lot_id = new_lot.id
    input_set: "The ShortDateTransfer, its from_lot, and the set of AVAILABLE lots at destination_site_id"
    precision: "integer doses"

  - name: allocation_receipt_running_total
    trigger: "AllocationReceipt creation"
    algorithm: aggregation
    formula: |
      order_line.received_doses += receipt.quantity_doses
      if order_line.received_doses > order_line.approved_doses:
        reject with ERR_OVER_RECEIPT
      order.received_vfc_doses = sum(line.received_doses) over lines of the order
      if order.received_vfc_doses == order.approved_vfc_doses:
        order.status := FULLY_RECEIVED
      elif order.received_vfc_doses > 0:
        order.status := PARTIALLY_RECEIVED
    input_set: "Single AllocationReceipt plus its OrderLine and VaccineOrder"
    precision: "integer doses"

  - name: tiered_wastage_rate_reporting
    trigger: "SiteVisitAudit.issue-findings (supplementary metric reported alongside accountability_gap)"
    algorithm: tiered_pricing
    formula: |
      # Wastage rate is reported in three tiers that determine corrective action:
      #   wastage_rate = public_doses_wasted / max(public_doses_received, 1)
      #   tier GREEN:  wastage_rate < 0.05
      #   tier AMBER:  0.05 <= wastage_rate < 0.10
      #   tier RED:    wastage_rate >= 0.10
      # Tier is reported in the audit close body; RED forces close-fail.
      wastage_rate = public_doses_wasted / max(public_doses_received, 1)
      tier = GREEN  if wastage_rate < 0.05
             AMBER  if 0.05 <= wastage_rate < 0.10
             RED    if wastage_rate >= 0.10
    input_set: "Same as accountability_balance_reconciliation final_snapshot variant"
    constants:
      TIER_AMBER_FLOOR: 0.05
      TIER_RED_FLOOR: 0.10
    precision: "rate rounded to 4 decimal places, round_half_up; tier boundary comparisons use the unrounded rate"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and syntactically valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for the target endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id referenced in path and body (provider_site, storage_unit, lot, patient, screening, order, order_line, receipt, borrow_ticket, transfer, excursion, audit, dose) must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version (when required by §1.2.1) must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../vaccine-orders/{orderId}/approve; POST .../borrow-tickets/{ticketId}/record-payback"

  - priority: 5
    category: state
    check: "Target resource's current state must permit the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Storage unit must not be quarantined when recording dose administration, creating allocation receipts, or receiving short-date transfers into it"
    error_id: ERR_STORAGE_UNIT_QUARANTINED
    http_status: 409
    applies_to: "POST .../dose-administrations; POST .../allocation-receipts; POST .../short-date-transfers/{id}/receive"

  - priority: 7
    category: business_safety
    check: "Lot must be AVAILABLE (not QUARANTINED / EXPIRED / DEPLETED / WASTED_CLOSED) for administration, ship, borrow-from, or payback-source operations"
    error_id: ERR_LOT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST .../dose-administrations; POST .../short-date-transfers/{id}/ship; POST .../borrow-tickets; POST .../borrow-tickets/{id}/record-payback"

  - priority: 8
    category: business_safety
    check: "Administration date must be <= Lot.expires_on"
    error_id: ERR_LOT_EXPIRED
    http_status: 409
    applies_to: "POST .../dose-administrations"

  - priority: 9
    category: business_safety
    check: "Lot.stock_type must match screening outcome: screening.outcome == VFC_ELIGIBLE requires lot.stock_type == PUBLIC_VFC; screening.outcome == PRIVATE_ONLY requires lot.stock_type == PRIVATE. A mismatch is permitted only when an OPEN BorrowTicket covers the dose (borrowed_context_ticket_id set)"
    error_id: ERR_STOCK_ELIGIBILITY_MISMATCH
    http_status: 422
    applies_to: "POST .../dose-administrations"

  - priority: 10
    category: business_safety
    check: "Screening must belong to the same patient AND screening_date must equal administration_date"
    error_id: ERR_SCREENING_MISMATCH
    http_status: 422
    applies_to: "POST .../dose-administrations"

  - priority: 11
    category: business_safety
    check: "Patient must be active and under 19 on administration_date when drawing from PUBLIC_VFC lot"
    error_id: ERR_PATIENT_NOT_VFC_ELIGIBLE_AGE
    http_status: 422
    applies_to: "POST .../dose-administrations (lot.stock_type == PUBLIC_VFC)"

  - priority: 12
    category: business_referential
    check: "Storage unit must belong to the same provider site as the parent resource"
    error_id: ERR_UNIT_SITE_MISMATCH
    http_status: 422
    applies_to: "POST .../allocation-receipts; POST .../short-date-transfers/{id}/receive; POST .../lots"

  - priority: 12.5
    category: business_constraint
    check: "Manual lot creation only accepts stock_type=PRIVATE; PUBLIC_VFC lots enter the system exclusively via AllocationReceipt posting"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST .../lots"

  - priority: 13
    category: business_constraint
    check: "Lot quantity_on_hand must be >= requested doses (administration=1, transfer, borrow, payback)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 422
    applies_to: "POST .../dose-administrations; POST .../short-date-transfers; POST .../borrow-tickets; POST .../borrow-tickets/{id}/record-payback"

  - priority: 14
    category: business_constraint
    check: "BorrowTicket direction must be across stock_type (PUBLIC_VFC <-> PRIVATE); same-stock borrow is forbidden. from_lot and to_lot must have opposite stock_type consistent with direction."
    error_id: ERR_SAME_STOCK_BORROW
    http_status: 422
    applies_to: "POST .../borrow-tickets"

  - priority: 15
    category: business_constraint
    check: "Payback quantity must not exceed remaining balance on ticket"
    error_id: ERR_PAYBACK_EXCEEDS_BORROWED
    http_status: 422
    applies_to: "POST .../borrow-tickets/{id}/record-payback"

  - priority: 16
    category: business_fiscal
    check: "AllocationReceipt.quantity_doses must not drive OrderLine.received_doses above approved_doses"
    error_id: ERR_OVER_RECEIPT
    http_status: 422
    applies_to: "POST .../allocation-receipts"

  - priority: 17
    category: business_fiscal
    check: "Order approval: every OrderLine.approved_doses set AND sum equals order.approved_vfc_doses"
    error_id: ERR_ALLOCATION_MISMATCH
    http_status: 422
    applies_to: "POST .../vaccine-orders/{orderId}/approve"

  - priority: 18
    category: business_fiscal
    check: "Site must be ACTIVE (not SUSPENDED_ORDERING) to submit a VaccineOrder"
    error_id: ERR_SITE_SUSPENDED_ORDERING
    http_status: 409
    applies_to: "POST .../vaccine-orders/{orderId}/submit"

  - priority: 19
    category: business_temporal
    check: "Audit close-pass requires accountability_gap == on_hand_public_total"
    error_id: ERR_ACCOUNTABILITY_GAP_UNRESOLVED
    http_status: 422
    applies_to: "POST .../site-visit-audits/{auditId}/close-pass"

  - priority: 20
    category: business_temporal
    check: "Site termination and audit close-pass are blocked while any OPEN / UNDER_REVIEW excursion, OPEN / PARTIALLY_REPAID borrow ticket, or open audit exists"
    error_id: ERR_OPEN_EXCURSION_EXISTS
    http_status: 409
    applies_to: "POST .../provider-sites/{id}/terminate; POST .../site-visit-audits/{auditId}/close-pass"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Provider Sites ---
  - method: POST
    path: "/provider-sites"
    description: "Create a VFC provider site"
    roles: [ComplianceAuditor]
    code: 201
    input: [site_name, vfc_pin]
    output: ProviderSite
    side_effects: ["status = ACTIVE"]

  - method: GET
