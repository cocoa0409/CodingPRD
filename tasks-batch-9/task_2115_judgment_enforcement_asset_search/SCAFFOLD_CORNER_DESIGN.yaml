              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-1016", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 0, entered_on: "2026-01-01" }
              as: CaseManager
              captures: { jud_id: $.data.id, jv1: $.data.version }
            - call: "POST /settlement-offers"
              payload: { judgment_id: "${jud_id}", offered_by: "CREDITOR", kind: "LUMP_SUM", amount_cents: 4000000, expires_at: "2026-12-01T00:00:00Z", expected_judgment_version: "${jv1}" }
              as: CaseManager
              captures: { off1: $.data.id, r1: $.data.round_number }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { jv2: $.data.version }
          trigger:
            - call: "POST /settlement-offers"
              payload: { judgment_id: "${jud_id}", offered_by: "DEBTOR", kind: "LUMP_SUM", amount_cents: 3500000, expires_at: "2026-12-01T00:00:00Z", responds_to_offer_id: "${off1}", expected_judgment_version: "${jv2}" }
              as: Debtor
              as_user_id: "${dbt_id}"
              captures: { off2: $.data.id, r2: $.data.round_number }
            - call: "GET /settlement-offers"
              payload: { responds_to_offer_id: "${off1}" }
              as: CaseManager
          assert:
            - "${r1} == 1"
            - "${r2} == 2"
            - "total_count == 1 and the single row id == ${off2}"
            - "SettlementOffer.${off1}.status == COUNTERED"
            - "SettlementOffer.${off2}.status == OPEN"
            - "Judgment.${jud_id}.open_offer_count == 1"

