              as_user_id: "u_ent_1"
              captures: { case_b: $.data.id }
          trigger:
            - call: "POST /sinuplasty-cases/${case_a}/documentation"
              payload: { ct_study_date: "2026-05-01", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-14" }, { therapy_code: "ABX", start_date: "2026-06-15", end_date: "2026-06-28" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_INCS", "FAILED_ABX"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /sinuplasty-cases/${case_b}/documentation"
              payload: { ct_study_date: "2026-05-01", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-14" }, { therapy_code: "ABX", start_date: "2026-06-21", end_date: "2026-07-04" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_INCS", "FAILED_ABX"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "GET /sinuplasty-cases/${case_a}/candidacy-evaluation"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
            - call: "GET /sinuplasty-cases/${case_b}/candidacy-evaluation"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
          assert:
            - "Case A evaluation: cumulative_management_days == 28, contiguous_management_days == 28, management_days_metric == 28, criteria_met_count == 3, candidacy_status == \"ELIGIBLE\""
            - "Case A: the adjacent pair merges because 2026-06-15 is exactly one day after 2026-06-14, so the merged span 2026-06-01..2026-06-28 is 28 inclusive days"
            - "Case B evaluation: cumulative_management_days == 28 (identical to case A), contiguous_management_days == 14, management_days_metric == 14, criteria_met_count == 3, candidacy_status == \"INELIGIBLE\""
            - "Both evaluations report evaluation_variant == \"POLICY_STRICT\", min_documented_criteria_required == 3 and min_medical_management_days_required == 28"
            - "Both evaluations list admissible_criteria_codes == [\"CT_OPACIFICATION\", \"FAILED_INCS\", \"FAILED_ABX\"] — the CT dated 2026-05-01 is inside 12 * 30 == 360 days of the clock"
            - "SinuplastyCase.${case_a}.status == \"DOCUMENTED\" and candidacy_status == \"ELIGIBLE\"; SinuplastyCase.${case_b}.status == \"DOCUMENTED\" and candidacy_status == \"INELIGIBLE\""

