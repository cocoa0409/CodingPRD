      - name: the_entity_backed_roles_are_resolved_against_real_seats_and_no_member_may_act_for_another
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - rbac.CommitteeChair.identity
          - rbac.CommitteeMember.identity
          - errors.ERR_ACTOR_NOT_COMMITTEE_MEMBER
          - errors.ERR_ACTOR_NOT_SELF
          - validations.priority_25
          - validations.priority_27
        distinguishing_aspect: "For the two entity_backed roles the X-User-Role header is not enough: the header pair must resolve to a CommitteeMember row on the target plan, and for CommitteeChair that row's seat.seat_class must be CHAIR. The instance separates the three failure modes that all look like 'wrong caller' — a valid member wearing the chair's role (priority 25), an opaque non-member identity wearing a member role (priority 25 again), and a correctly resolved member acting on another member's behalf (priority 27) — and shows priority 20 pre-empting all of them when the role itself is not on the endpoint."
        test_recipe:
          setup:
            - "chain_l2: three ACTIVE members on three FILLED voting seats — the chair on a CHAIR-class seat, the finance member on a FINANCE seat and the HR member on an HR seat — with the charter ADOPTED and IPS-2026-A ADOPTED."
            - "LCGRA is registered so the WATCH_LIST_ACTION motion below has a real subject_id, and a fresh meeting is created but NOT convened, so the convene attempts are state-legal and can only fail on identity."
          setup_api_calls:
            - *chain_l2
            - *b_fund_lc_a
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-21", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet_r4_id: $.data.id }
          trigger:
            - call: "POST /governance/committee-meetings/${meet_r4_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_hr_id}"
            - call: "POST /governance/committee-meetings/${meet_r4_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "ic-1"
            - call: "POST /governance/committee-meetings/${meet_r4_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: Recordkeeper
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/committee-meetings/${meet_r4_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet_r4_id}", subject_type: "WATCH_LIST_ACTION", subject_id: "${fund_lc_a_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeMember
              as_user_id: "rk-1"
              captures: {}
            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet_r4_id}", subject_type: "WATCH_LIST_ACTION", subject_id: "${fund_lc_a_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
              captures: { motion_r4_id: $.data.id }
            - call: "POST /governance/motions/${motion_r4_id}/votes"
              payload: { member_id: "${mem_fin_id}", vote: "FOR" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/committee-members/${mem_hr_id}/acceptance"
              payload: { acceptance_doc_ref: "ACC-2026-FORGED" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions/${motion_r4_id}/votes"
              payload: { member_id: "${mem_chair_id}", vote: "FOR" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          assert:
            - "trigger call 1 returned 403 ERR_ACTOR_NOT_COMMITTEE_MEMBER — priority 25 — because ${mem_hr_id} resolves to a real ACTIVE member of this plan but their seat's seat_class is HR, not CHAIR. CommitteeMeeting.${meet_r4_id}.status is still SCHEDULED with quorum_met unset"
            - "trigger call 2 returned 403 ERR_ACTOR_NOT_COMMITTEE_MEMBER for the opaque consultant identity ic-1, which resolves to no CommitteeMember row at all — the same error id covers 'not a member' and 'not the chair'"
            - "trigger call 3 returned 403 ERR_ROLE_NOT_PERMITTED, not ERR_ACTOR_NOT_COMMITTEE_MEMBER, even though the X-User-ID would have resolved perfectly: priority 20 is evaluated before priority 25"
            - "trigger call 4, the same convene with the header pair the chair actually owns, returned 200: status SCHEDULED -> IN_SESSION with eligible_voting_seat_count 3, voting_attendee_count 3, quorum_met true and charter_version_pinned == Plan.version"
            - "trigger call 5 returned 403 ERR_ACTOR_NOT_COMMITTEE_MEMBER: rk-1 is an opaque recordkeeper identity, and POST /governance/motions being shared with CommitteeMember does not make the identity requirement optional"
            - "trigger call 6 returned 201 for the finance member — a non-chair member may move a motion — with status OPEN and votes []"
            - "trigger call 7 returned 403 ERR_ACTOR_NOT_SELF — priority 27 — because member_id ${mem_fin_id} does not equal the X-User-ID ${mem_chair_id}: the chair may not cast an absentee's vote even on a motion the chair may legally close. Motion.${motion_r4_id}.votes is still empty"
            - "trigger call 8 returned 403 ERR_ACTOR_NOT_SELF on the acceptance endpoint for the same reason, and CommitteeMember.${mem_hr_id}.acceptance_doc_ref is unchanged from the value chain_l2 signed — a fiduciary acceptance can never be signed by anyone but the fiduciary"
            - "trigger call 9 returned 200 for the chair's OWN vote: one entry in Motion.${motion_r4_id}.votes with member_id ${mem_chair_id}, for_count 1, votes_cast_count 1"
            - "no rejected call at the 20/25/27 rungs left a trace: CommitteeMember.${mem_fin_id}.votes_cast_count is still 0 and Plan.documented_acceptance_count is still 3"

  - section: cross_cutting_complexity_layers
    # complexity_layers active on this scaffold (§0): optimistic_concurrency,
    # cascading_side_effects, dual_variant_calculation, ops_run_checkpoint.
    # §1.2.1 declares exactly two concurrency_rules — proposal-create-stale-plan
    # (POST /governance/fund-replacements, expected_plan_version, Plan.version,
    # 412 ERR_STALE_PLAN_VERSION, validation_priority 46) and
    # scorecard-create-stale-review (POST /governance/fund-scorecards,
    # expected_review_version, QuarterlyReview.version, 412
    # ERR_STALE_REVIEW_VERSION, validation_priority 46) — and each gets its own
    # instance below. The two depth-4 cascades (review finalize and mapping
    # execute) get an end-to-end instance and a compensation instance.
    instances:
      - name: the_plan_version_gate_rejects_a_client_holding_any_snapshot_older_than_the_last_write_including_its_own
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.proposal-create-stale-plan
          - errors.ERR_STALE_PLAN_VERSION
          - validations.priority_46
          - endpoints.POST_governance_fund_replacements
        distinguishing_aspect: "The OCC field on this write is not the child's own version but the PARENT plan's, and the endpoint that consumes it also increments it — so a client that successfully creates one proposal is instantly stale for its second. This instance walks the full cycle: a read, an unrelated third-party write that invalidates the snapshot, the 412, a re-read, the success, and then the SAME token replayed to prove the successful write moved the version too. It also pins down that a 412 writes nothing at all: no proposal row, no supersede of the prior draft, and no version bump of its own."
        test_recipe:
          setup:
            - "chain_l3: menu_posture OPEN, five funds seated across five slots, one candidate large-cap fund (${fund_lc_b_id}) left unseated and IPS-passing, no proposal on any slot yet, and Plan.draft_proposal_count == 0."
          setup_api_calls:
            - *chain_l3
          trigger:
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_c1: $.data.version }
            - call: "POST /governance/plans/${plan_id}/menu-posture/recompute"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_lc_id}", outgoing_fund_id: "${fund_lc_a_id}", incoming_fund_id: "${fund_lc_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Large-cap growth sleeve replacement on the incumbent's three-year shortfall", expected_plan_version: "${plan_v_c1}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/fund-replacements?plan_id=${plan_id}&limit=10&offset=0"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_c1b: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_lc_id}", outgoing_fund_id: "${fund_lc_a_id}", incoming_fund_id: "${fund_lc_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Large-cap growth sleeve replacement on the incumbent's three-year shortfall", expected_plan_version: "${plan_v_c1b}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_c1_id: $.data.id, prop_c1_pinned: $.data.pinned_plan_version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_lc_id}", outgoing_fund_id: "${fund_lc_a_id}", incoming_fund_id: "${fund_lc_b_id}", mapping_strategy: "REENROLLMENT", rationale: "Second thoughts: re-enrol the sleeve instead of mapping it directly across", expected_plan_version: "${plan_v_c1b}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_c1c: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_lc_id}", outgoing_fund_id: "${fund_lc_a_id}", incoming_fund_id: "${fund_lc_b_id}", mapping_strategy: "REENROLLMENT", rationale: "Second thoughts: re-enrol the sleeve instead of mapping it directly across", expected_plan_version: "${plan_v_c1c}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_c1b_id: $.data.id }
            - call: "GET /governance/fund-replacements/${prop_c1_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "trigger call 2 returned 200 and incremented Plan.version even though nothing about the posture actually changed — every §1.5 side_effects list on this plan ends with 'increments Plan.version by 1', so a no-op recompute is still a concurrency event: the returned Plan.version == plan_v_c1 + 1 with menu_posture still OPEN and at_risk_slot_ratio still 0.0000"
            - "trigger call 3 returned 412 ERR_STALE_PLAN_VERSION: expected_plan_version plan_v_c1 no longer equals Plan.version. The rule fires at priority 46, i.e. after the auth rungs and after the priority-42 state gates, so the response is the 412 and not a 409"
            - "trigger call 4 confirms the rejected create wrote nothing: the array is empty with total_count 0 and has_more false, and a re-read of the plan still shows draft_proposal_count 0 and version == plan_v_c1 + 1 — the failed attempt did NOT consume a version"
            - "trigger call 6 returned 201 with the re-read token: status DRAFT, revision_round 0, superseded_by_proposal_id null, pinned_ips_id == ${ips_a_id}, notice_lead_days_required == 30 for DIRECT_MAP on a non-QDIA slot in an ERISA plan, and prop_c1_pinned == plan_v_c1b"
            - "after trigger call 6 Plan.draft_proposal_count == 1 and Plan.version == plan_v_c1b + 1"
            - "trigger call 7 returned 412 ERR_STALE_PLAN_VERSION even though the caller is the same consultant who legitimately read plan_v_c1b moments earlier: the caller's own successful create at call 6 invalidated the token. This is the property that makes the layer non-trivial — success is self-invalidating"
            - "trigger call 9, replaying the same body with the freshly read plan_v_c1c, returned 201 and DID apply the supersede branch: FundReplacementProposal.${prop_c1b_id}.status == DRAFT with mapping_strategy REENROLLMENT and notice_lead_days_required == 60 (30 base + 30 for REENROLLMENT), and Plan.draft_proposal_count is still 1 because the predecessor left the counted set"
            - "trigger call 10 shows the predecessor was withdrawn, not deleted: FundReplacementProposal.${prop_c1_id}.status == WITHDRAWN with superseded_by_proposal_id == ${prop_c1b_id}"
            - "the withdrawal happened only on the 201 path: after the 412 at call 7 the predecessor was still DRAFT with superseded_by_proposal_id null, so the OCC check is evaluated strictly before the supersede side effect"
            - "SPEC NOTE — §1.1 defines FundReplacementProposal.pinned_plan_version as 'Plan.version observed by the creating client (the accepted expected_plan_version)' while the §1.5 side_effects line says 'pinned_plan_version = Plan.version'. Since the same line also increments Plan.version, the two readings differ by exactly one. This instance asserts the §1.1 reading (the accepted token), which is the only one that makes pinned_plan_version useful for reconstructing what the client saw."

      - name: the_review_version_gate_yields_to_the_lifecycle_gate_and_two_consultants_cannot_both_score_from_one_snapshot
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.scorecard-create-stale-review
          - errors.ERR_STALE_REVIEW_VERSION
          - errors.ERR_REVIEW_NOT_SCORING
          - validations.priority_42
          - validations.priority_46
        distinguishing_aspect: "The second OCC rule guards a create-with-supersede on a child (FundScorecard) whose parent (QuarterlyReview) is simultaneously walking a lifecycle. The interesting corner is the two-rule interaction §1.2.1 spells out explicitly: once the review leaves SCORING, the 409 at priority 42 answers ahead of the 412 at priority 46, so a stale client cannot even tell that its snapshot was stale. The instance drives a lost-update race between two snapshots of the same review, then re-scores after the review advances to prove the error id flips from 412 to 409 for the identical stale token."
        test_recipe:
          setup:
            - "chain_l3 plus an open quarter-0 review pinned to IPS-2026-A (scoring_variant TRAILING_PERIOD) with a convened, quorate meeting available for the eventual present."
          setup_api_calls:
            - *chain_l3
            - *b_review_q0
            - *b_meet4
            - *b_meet4_convene
          trigger:
            - call: "GET /governance/quarterly-reviews/${review_q0_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { rv_c2_a: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_q0_id}", fund_id: "${fund_lc_a_id}", expected_review_version: "${rv_c2_a}", trailing_return_3y_bps: 820, trailing_return_5y_bps: 910, benchmark_return_3y_bps: 900, benchmark_return_5y_bps: 940, peer_rank_pct: 62.00, style_drift_r2: 0.9100, net_expense_ratio_bps: 62, peer_median_expense_bps: 58, manager_tenure_quarters: 26, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { sc_c2_lc_id: $.data.id }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_q0_id}", fund_id: "${fund_bond_a_id}", expected_review_version: "${rv_c2_a}", trailing_return_3y_bps: 310, trailing_return_5y_bps: 340, benchmark_return_3y_bps: 300, benchmark_return_5y_bps: 330, peer_rank_pct: 41.00, style_drift_r2: 0.9600, net_expense_ratio_bps: 28, peer_median_expense_bps: 31, manager_tenure_quarters: 40, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/quarterly-reviews/${review_q0_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { rv_c2_b: $.data.version }
            - call: "POST /governance/fund-scorecards"
