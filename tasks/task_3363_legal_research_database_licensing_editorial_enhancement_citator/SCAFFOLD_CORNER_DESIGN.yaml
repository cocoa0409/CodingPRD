scaffold_corner_design:
  - section: entities
    instances:
      - name: document_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.PrimaryDocument, response_envelope]
        distinguishing_aspect: "A freshly ingested document starts exactly at (RECEIVED, PUBLIC) with citator GREEN / score 0, normalized_citation null, version 1, and a server-minted UUID id."
        test_recipe:
          setup: ["empty database; default clock 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "Fresh v. Start", raw_citation_string: "1 F.4th 1", decision_date: "2026-01-05"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
          assert:
            - "response 201; PrimaryDocument.${doc_id}: ingestion_status == RECEIVED, visibility_status == PUBLIC, citator_signal == GREEN, citator_score == 0"
            - "normalized_citation IS NULL and published_at IS NULL (not yet published)"
            - "version == 1; id is a server-minted UUID; created_at/updated_at present in ISO 8601 UTC"

      - name: document_get_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.PrimaryDocument]
        distinguishing_aspect: "GET /legal-research/documents/{id} echoes every stored input field verbatim (title, raw_citation_string, decision_date, jurisdiction_code)."
        test_recipe:
          setup: ["one ingested document"]
          setup_api_calls:
            - call: "POST /legal-research/documents"
              payload: {source_type: AGENCY, jurisdiction_code: "US", document_type: REGULATION, title: "Stored Fields Rule", raw_citation_string: "88 Fed. Reg. 55", decision_date: "2026-02-01"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
          trigger:
            - {call: "GET /legal-research/documents/${doc_id}", as: ContentIngester}
          assert:
            - "GET returns title == \"Stored Fields Rule\", raw_citation_string == \"88 Fed. Reg. 55\", decision_date == \"2026-02-01\", source_type == AGENCY, jurisdiction_code == \"US\""

      - name: documents_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors the fixed envelope: default limit 10, offset 0, and the pagination fields limit/offset/total_count/has_more are all present."
        test_recipe:
          setup: ["exactly one document exists"]
          setup_api_calls:
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "NY", document_type: CASE, title: "Only v. One", raw_citation_string: "2 N.Y.3d 5", decision_date: "2026-01-01"}
              as: ContentIngester
          trigger:
            - {call: "GET /legal-research/documents", as: PlatformAdmin}
          assert:
            - "response_type == \"array\"; pagination block present with limit == 10 (default), offset == 0, total_count == 1, has_more == false"
            - "meta.api_request_id and meta.api_request_timestamp are present on the success envelope"

      - name: document_not_found_returns_404
        claim_type: not_found
        grounds: [errors, ERR_DOCUMENT_NOT_FOUND]
        distinguishing_aspect: "A well-formed but nonexistent UUID on the single-document read returns 404 ERR_DOCUMENT_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - {call: "GET /legal-research/documents/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ContentIngester, captures: {err: $.data.error_id}}
          assert:
            - "HTTP 404 and error_id == ERR_DOCUMENT_NOT_FOUND"

      - name: document_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting raw_citation_string (required input) is rejected with 400 ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - {call: "POST /legal-research/documents", payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "Missing Citation", decision_date: "2026-01-05"}, as: ContentIngester, captures: {err: $.data.error_id}}
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST"

      - name: plan_invalid_enum_value_returns_400
        claim_type: type_constraints
        grounds: ["validations[priority=5]", entities.SubscriptionPlan.fields.billing_model]
        distinguishing_aspect: "An out-of-domain enum (billing_model WEEKLY) is rejected with 400 ERR_INVALID_REQUEST at the field-domain gate."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - {call: "POST /legal-research/plans", payload: {name: "Bad Plan", practice_area: LITIGATION, jurisdiction_scope: STATE, firm_size_tier: SOLO, billing_model: WEEKLY, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false}, as: LicensingManager, captures: {err: $.data.error_id}}
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST"

      - name: usage_event_immutable_shape
        claim_type: immutability
        grounds: [entities.UsageEvent]
        distinguishing_aspect: "UsageEvent declares common_fields: false — responses expose id and created_at but NO version or updated_at, and the scaffold declares no update/transition endpoint for it."
        test_recipe:
          setup:
            - "ACTIVE subscription with seated user on a SOFT flat plan"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Imm Plan", practice_area: ALL, jurisdiction_scope: NATIONAL, firm_size_tier: SOLO, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 1000, included_searches: 10, included_doc_views: 10, overage_search_fee_cents: 100, overage_doc_view_fee_cents: 100, volume_discount_pct: 0.1, discount_threshold_overage_units: 20}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Imm Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}
              as: LicensingManager
              captures: {s_id: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "i@imm.com", user_full_name: "Imm User"}, as: FirmAdmin, as_user_id: "${a_id}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_id}"}, as: FirmAdmin, as_user_id: "${a_id}", captures: {u_id: "$.data[0].id"}}
          trigger:
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: TAX}, as: Researcher, as_user_id: "${u_id}", captures: {ev_id: $.data.id}}
          assert:
            - "UsageEvent.${ev_id} response contains id and created_at but neither version nor updated_at"
            - "occurred_at == 2026-09-10T00:00:00Z (logical clock), in_scope == true (plan practice_area ALL), subscription_id == ${s_id}, user_id == ${u_id}"

      - name: royalty_statement_immutable_record
        claim_type: immutability
        grounds: [entities.RoyaltyStatement]
        distinguishing_aspect: "RoyaltyStatement is an append-only record (common_fields: false): once generated its view_count/revenue_base_cents/royalty_amount_cents never change and no mutation endpoint exists."
        test_recipe:
          setup:
            - "PER_VIEW agreement (45c/view) with 2 DOC_VIEW events in the September window"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/license-agreements"
              payload: {work_title: "Imm Treatise", author_name: "Auth Imm", practice_area: LITIGATION, royalty_basis: PER_VIEW, per_view_fee_cents: 45, exclusive: false, window_start: "2026-01-01", window_end: "2027-01-01"}
              as: LicensingManager
              captures: {ag_id: $.data.id}
            - call: "POST /legal-research/plans"
              payload: {name: "Imm Plan R", practice_area: ALL, jurisdiction_scope: NATIONAL, firm_size_tier: SOLO, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 1000, included_searches: 10, included_doc_views: 10, overage_search_fee_cents: 100, overage_doc_view_fee_cents: 100, volume_discount_pct: 0.1, discount_threshold_overage_units: 20}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Imm Roy Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}
              as: LicensingManager
              captures: {s_id: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "r@imm.com", user_full_name: "Roy User"}, as: FirmAdmin, as_user_id: "${a_id}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_id}"}, as: FirmAdmin, as_user_id: "${a_id}", captures: {u_id: "$.data[0].id"}}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION, license_agreement_id: "${ag_id}"}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION, license_agreement_id: "${ag_id}"}, as: Researcher, as_user_id: "${u_id}"}
          trigger:
            - {call: "POST /legal-research/royalty-statements/generate", payload: {license_agreement_id: "${ag_id}", period_start: "2026-09-01", period_end: "2026-10-01"}, as: BillingAdmin, captures: {st_id: $.data.id}}
          assert:
            - "RoyaltyStatement.${st_id} contains id and created_at but neither version nor updated_at"
            - "view_count == 2 and royalty_amount_cents == 90 (2 * 45) and revenue_base_cents == 0"

      - name: normalized_citation_computed_at_publish
        claim_type: computed_fields
        grounds: [calculations.citation_normalization, entities.PrimaryDocument.fields.normalized_citation]
        distinguishing_aspect: "normalized_citation is computed by the pinned transform, not taken from input: \"123 F.3d  456\" normalizes to \"123 F3D 456\" (uppercase, dots stripped, whitespace collapsed) at publish time only."
        test_recipe:
          setup: ["one ingested document whose raw citation carries dots and double spacing"]
          setup_api_calls:
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "Norm v. Cite", raw_citation_string: "123 F.3d  456", decision_date: "2026-01-15"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
          trigger:
            - {call: "POST /legal-research/documents/${doc_id}/publish", payload: {references: []}, as: ContentIngester}
          assert:
            - "before publish: normalized_citation IS NULL"
            - "after publish: PrimaryDocument.${doc_id}.normalized_citation == \"123 F3D 456\" and ingestion_status == PUBLISHED and published_at == 2026-09-01T00:00:00Z (default clock)"

  - section: state_machines
    instances:
      - name: publish_published_document_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PrimaryDocument.RECEIVED_to_PUBLISHED, errors, ERR_INVALID_STATE]
        distinguishing_aspect: "Publish is declared only from RECEIVED; a second publish on a PUBLISHED document fails with ERR_INVALID_STATE and creates no additional references."
        test_recipe:
          setup: ["document already published with one outgoing reference"]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "Twice v. Publish B", raw_citation_string: "20 F.4th 10", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {doc_b: $.data.id}
            - {call: "POST /legal-research/documents/${doc_b}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "Twice v. Publish A", raw_citation_string: "21 F.4th 11", decision_date: "2026-02-01"}
              as: ContentIngester
              captures: {doc_a: $.data.id}
            - call: "POST /legal-research/documents/${doc_a}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: FOLLOWED, depth: MENTIONED}]}
              as: ContentIngester
          trigger:
            - {call: "POST /legal-research/documents/${doc_a}/publish", payload: {references: []}, as: ContentIngester, captures: {err: $.data.error_id}}
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "GET /legal-research/documents/${doc_a}/citing-references direction=FROM still returns total_count == 1 (no duplicate references created)"

      - name: cancel_cancelled_subscription_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Subscription, errors, ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal: any further status transition (SUSPENDED, ACTIVE, or CANCELLED again) is rejected."
        test_recipe:
          setup: ["subscription cancelled once"]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Term Plan", practice_area: LITIGATION, jurisdiction_scope: STATE, firm_size_tier: SOLO, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 1000, included_searches: 5, included_doc_views: 5, overage_search_fee_cents: 100, overage_doc_view_fee_cents: 100, volume_discount_pct: 0.1, discount_threshold_overage_units: 10}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Term Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}
              as: LicensingManager
              captures: {s_id: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_id}/status", payload: {target_status: CANCELLED}, as: LicensingManager}
          trigger:
            - {call: "POST /legal-research/subscriptions/${s_id}/status", payload: {target_status: ACTIVE}, as: LicensingManager, captures: {err: $.data.error_id}}
          assert:
            - "error_id == ERR_INVALID_STATE (409) and Subscription.${s_id}.status remains CANCELLED"

      - name: reverse_received_order_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RemovalOrder, errors, ERR_INVALID_STATE]
        distinguishing_aspect: "REVERSED is reachable only from APPLIED; reversing a still-RECEIVED order fails and leaves the document untouched."
        test_recipe:
          setup: ["published document; removal order docketed but not applied"]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-15T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "WA", document_type: CASE, title: "Skip v. Apply", raw_citation_string: "30 P.3d 5", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
            - {call: "POST /legal-research/documents/${doc_id}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/removal-orders"
              payload: {document_id: "${doc_id}", scope: SEAL, effective_from: "2026-09-01", effective_until: "2026-09-30", reason: "early reverse"}
              as: ComplianceOfficer
              captures: {ord_id: $.data.id}
          trigger:
            - {call: "POST /legal-research/removal-orders/${ord_id}/transition", payload: {target_status: REVERSED}, as: ComplianceOfficer, captures: {err: $.data.error_id}}
          assert:
            - "error_id == ERR_INVALID_STATE; RemovalOrder.${ord_id}.status == RECEIVED; PrimaryDocument.${doc_id}.visibility_status == PUBLIC"

      - name: decide_approve_sets_reviewer_and_note
        claim_type: side_effect_execution
        grounds: [state_machines.Headnote.IN_REVIEW_to_PUBLISHED]
        distinguishing_aspect: "The APPROVE transition's declared side effects are observable: reviewer_editor_id is stamped from the reviewer's X-User-ID and review_note persisted, and version increments by exactly 1."
        test_recipe:
          setup: ["published document; headnote submitted by ed-author-1 (IN_REVIEW)"]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "IL", document_type: CASE, title: "Side v. Effect", raw_citation_string: "40 N.E.3d 1", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
            - {call: "POST /legal-research/documents/${doc_id}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents/${doc_id}/headnotes"
              payload: {topic_code: IP, headnote_text: "H", synopsis_text: "S"}
              as: AttorneyEditor
              as_user_id: "ed-author-1"
              captures: {hn_id: $.data.id, hn_v: $.data.version}
            - {call: "POST /legal-research/headnotes/${hn_id}/submit", payload: {}, as: AttorneyEditor, as_user_id: "ed-author-1"}
          trigger:
            - {call: "POST /legal-research/headnotes/${hn_id}/decide", payload: {decision: APPROVE, review_note: "thorough"}, as: AttorneyEditor, as_user_id: "ed-reviewer-9"}
          assert:
            - "Headnote.${hn_id}.status == PUBLISHED and reviewer_editor_id == \"ed-reviewer-9\" and review_note == \"thorough\""
            - "Headnote.${hn_id}.version == ${hn_v} + 2 (submit and decide each increment by 1)"

      - name: invoice_overdue_materializes_on_clock_advance
        claim_type: auto_transition
        grounds: [state_machines.Invoice.ISSUED_to_OVERDUE, state_machines.Subscription.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "The ISSUED -> OVERDUE flip is lazy and clock-driven: before the clock passes due_at the invoice reads ISSUED; after crossing due_at (issued_at + 30 days) the next read shows OVERDUE and the subscription is auto-suspended with reason INVOICE_OVERDUE."
        test_recipe:
          setup:
            - "subscription with seated user; 1 SEARCH; September invoice generated and ISSUED on 2026-09-10 (due 2026-10-10)"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Ovd Plan", practice_area: LITIGATION, jurisdiction_scope: STATE, firm_size_tier: SOLO, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 1000, included_searches: 5, included_doc_views: 5, overage_search_fee_cents: 100, overage_doc_view_fee_cents: 100, volume_discount_pct: 0.1, discount_threshold_overage_units: 10}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Ovd Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}
              as: LicensingManager
              captures: {s_id: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "o@ovd.com", user_full_name: "Ovd User"}, as: FirmAdmin, as_user_id: "${a_id}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_id}"}, as: FirmAdmin, as_user_id: "${a_id}", captures: {u_id: "$.data[0].id"}}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/invoices/generate", payload: {subscription_id: "${s_id}", period_start: "2026-09-01", period_end: "2026-10-01"}, as: BillingAdmin, captures: {inv_id: $.data.id}}
            - {call: "POST /legal-research/invoices/${inv_id}/transition", payload: {target_status: ISSUED}, as: BillingAdmin}
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-10-10T00:00:00Z"}, as: PlatformAdmin}
            - {call: "GET /legal-research/invoices/${inv_id}", as: BillingAdmin}
          trigger:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-10-11T00:00:00Z"}, as: PlatformAdmin}
            - {call: "GET /legal-research/invoices/${inv_id}", as: BillingAdmin}
          assert:
            - "at clock == due_at (2026-10-10): Invoice.${inv_id}.status == ISSUED (OVERDUE requires due_at STRICTLY before the clock)"
            - "at clock 2026-10-11: Invoice.${inv_id}.status == OVERDUE"
            - "Subscription.${s_id}.status == SUSPENDED and suspension_reason == INVOICE_OVERDUE"

      - name: subscription_cancel_releases_seats_and_voids_drafts
        claim_type: cascade_down
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "Cancellation cascades only to non-terminal children: the seated user loses the seat (seat_status NONE, seats_used 0) and the DRAFT invoice is voided, while an ISSUED invoice is left untouched."
        test_recipe:
          setup:
            - "subscription with one seated user; invoice I1 generated then ISSUED; invoice I2 (October) generated and left DRAFT"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Casc Plan", practice_area: LITIGATION, jurisdiction_scope: STATE, firm_size_tier: SOLO, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 1000, included_searches: 5, included_doc_views: 5, overage_search_fee_cents: 100, overage_doc_view_fee_cents: 100, volume_discount_pct: 0.1, discount_threshold_overage_units: 10}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Casc Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-12-01", seats_total: 1}
              as: LicensingManager
              captures: {s_id: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "c@casc.com", user_full_name: "Casc User"}, as: FirmAdmin, as_user_id: "${a_id}"}
