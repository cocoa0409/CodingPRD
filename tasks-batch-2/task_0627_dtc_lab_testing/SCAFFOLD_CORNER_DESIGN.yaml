      - name: schedule_referral_open_to_scheduled
        claim_type: Conditional action
        grounds: [endpoints, state_machines.LabResult.PROCESSING_to_RELEASED, entities.TelehealthReferral.fields.status]
        distinguishing_aspect: "A referral minted by an abnormal release can be advanced OPEN -> SCHEDULED via POST /catalog/telehealth-referrals/{id}/schedule."
        test_recipe:
          setup: ["Offering RF ref 70-100 (consent true). HOME_KIT order, processed analyzer 150 (ABNORMAL), released -> referral OPEN."]
