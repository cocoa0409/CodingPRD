              payload: {}
              as: FinanceController
              as_user_id: "fc-preparer-1"
              captures: { e_finance: "$.data.error_id" }
          assert:
            - "trigger call 1 returns HTTP 200: PATCH /tour-stops/{id}/logistics is exclusive to SeriesPromoter"
            - "trigger call 2 returns HTTP 200 with VenueBooking.${b_dal}.state == COUNTERED and negotiation_round_count == 1: counter is exclusive to VenueManager and this manager owns ${venue_dal}"
            - "trigger call 3 returns HTTP 201: CompetitorTeam may enter a vehicle for its own competitor_id"
            - "trigger call 4 returns HTTP 201 with SafetyPlan.${plan_atl}.state == DRAFT: authoring is exclusive to SafetyOfficial"
            - "trigger call 5 returns HTTP 201: tier creation is exclusive to TicketingManager"
            - "trigger call 6 returns HTTP 201 with SponsorshipActivation.${act1}.state == PROPOSED: SponsorRep may propose for its own sponsor_id"
            - "trigger call 7 returns HTTP 409 with ${e_finance} == ERR_SAFETY_PLAN_MISSING and NOT 403: the FinanceController's exclusive settlement endpoint accepted the role and failed only on business state"

      - name: corner_rbac_cross_role_calls_on_exclusive_endpoints_are_refused
        claim_type: Shared Operations
        grounds:
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_UNAUTHENTICATED
          - roles.SeriesPromoter.exclusive_operations
