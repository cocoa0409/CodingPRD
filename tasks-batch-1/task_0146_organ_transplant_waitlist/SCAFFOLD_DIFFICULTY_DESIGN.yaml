        grounds:
          - calculations.offer_response_deadline
          - entities.DonorOrgan.fields.max_cold_ischemia_hours
          - entities.Offer.fields.response_deadline_at
        distinguishing_aspect: |
          Interval semantics #1 (capacity/ceiling window on DonorOrgan): the
          per-offer 1-hour response window is CLIPPED to the organ's cold-ischemia
          ceiling (recovered_at + max_cold_ischemia_hours); when the ceiling is
          sooner, the offer's deadline is the ceiling, not offered_at+1h.
