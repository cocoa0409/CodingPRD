            - "\"${v1}\" == 2"
            - "the lock attempt carrying the original version returns 412 with error_id == ERR_STALE_VERSION"
            - "a lock attempt carrying \"${v1}\" returns 200 and reports version 3"

      - name: cascading_side_effects_order_ordering_is_by_created_at
        claim_type: cascading_side_effects
        grounds:
          - calculations.batch_delay_propagation
          - state_machines.ProductionBatch.IN_PRODUCTION_to_DELAYED
          - entities.VehicleOrder.fields.placed_at
        distinguishing_aspect: "Propagation order is pinned by placed_at and never by id, so an order placed later is processed later even when its id sorts first; swapping the sort key changes which estimate is superseded first."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; two orders on the same batch, one placed at 2026-09-01T00:00:00Z and one placed at 2026-09-03T00:00:00Z, both allocated and arrived."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - &c_center_tx2
              call: "POST /v1/delivery-centers"
              payload: { center_name: "Dallas Delivery", center_kind: "DELIVERY_CENTER", state_code: "TX", bay_count: 4, home_delivery_radius_miles: 50, van_count: 2 }
              as: PlatformAdmin
              captures: { ctr_alt_id: $.data.id }
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_buyer2
            - call: "POST /v1/buyers/${byr2_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - *c_order
            - call: "POST /v1/orders"
              payload: { buyer_id: "${byr2_id}", configuration_id: "${cfg_id}", jurisdiction_id: "${jur_id}", delivery_center_id: "${ctr_tx2_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { ord_late_id: $.data.id, ord_late_v: $.data.version }
            - *c_place
            - call: "POST /v1/orders/${ord_late_id}/place"
              payload: { expected_order_version: "${ord_late_v}" }
              as: Buyer
              as_user_id: "${byr2_id}"
              captures: { ord_late_v: $.data.version }
            - *c_pay
            - call: "POST /v1/_payments/simulate"
              payload: { order_id: "${ord_late_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - *c_lock
            - call: "POST /v1/orders/${ord_late_id}/lock-configuration"
              payload: { expected_order_version: "${ord_late_v}" }
              as: PlatformAdmin
              captures: { ord_late_v: $.data.version }
            - *c_batch
            - call: "POST /v1/production-batches/${bch_id}/start"
              payload: {}
              as: PlatformAdmin
            - *c_unit
            - &c_unit_b
              call: "POST /v1/production-batches/${bch_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000125" }
              as: PlatformAdmin
            - *c_alloc
            - call: "POST /v1/orders/${ord_late_id}/allocation"
              payload: { batch_id: "${bch_id}", expected_order_version: "${ord_late_v}" }
              as: PlatformAdmin
              captures: { ord_late_v: $.data.version }
            - *c_disp
            - call: "POST /v1/orders/${ord_late_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - *c_arrive
            - call: "POST /v1/orders/${ord_late_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/production-batches/${bch_id}/delay"
              payload: { delay_days: 3 }
              as: PlatformAdmin
              captures: { batch_state: $.data.status }
          assert:
            - "\"${batch_state}\" == DELAYED"
            - "both orders report exactly one PROVISIONAL estimate and one SUPERSEDED estimate"
            - "VehicleOrder.${ord_id}.estimate_shift_days_cumulative == VehicleOrder.${ord_late_id}.estimate_shift_days_cumulative"
            - "GET /v1/delivery-estimates?order_id=${ord_id} and ?order_id=${ord_late_id} each report the same window_start delta of 3 days from their prior estimates"

      - name: derived_field_reconciliation_posture_matches_its_formula
        claim_type: derived_field_reconciliation
        grounds:
