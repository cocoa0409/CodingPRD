# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Debt Collection Agency (FDCPA) — Expert tier
# Breadth probe: walks references/claim-extraction-guide.md against §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_computed_balance
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with all required fields -> 201; balance_cents == original_principal_cents, work_status==PLACED, contact_status==PRE_VALIDATION."
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z; one creditor and one consumer exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
          assert:
            - "response status == 201"
            - "Account.${acct}.balance_cents == 50000"
            - "Account.${acct}.work_status == PLACED"
            - "Account.${acct}.contact_status == PRE_VALIDATION"
            - "Account.${acct}.amount_collected_cents == 0"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.Account"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /accounts/{id} for a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "${err} == ERR_NOT_FOUND"

      - name: create_account_missing_principal_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Account.fields.original_principal_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /accounts omitting original_principal_cents -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A creditor and consumer exist."]
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "${err} == ERR_INVALID_REQUEST"

      - name: account_sol_anchor_basis_default_is_charge_off
        claim_type: Defaults
        grounds: [entities.Account.fields.sol_anchor_basis]
        distinguishing_aspect: "Omitting sol_anchor_basis on POST /accounts applies default CHARGE_OFF."
        test_recipe:
          setup: ["A creditor and consumer exist; clock 2026-01-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { basis: $.data.sol_anchor_basis }
          assert:
            - "${basis} == CHARGE_OFF"

      - name: account_id_and_version_system_minted_input_ignored
        claim_type: System Fields
        grounds: [entities.Account]
        distinguishing_aspect: "id/created_at/version are server-minted; version starts at 1 and a client-supplied id-like field is not honored."
        test_recipe:
          setup: ["A creditor and consumer exist."]
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id, v: $.data.version }
          assert:
            - "Account.${acct}.version == 1"
            - "Account.${acct}.id is a UUID with no type prefix"

      - name: list_accounts_paginated_envelope
        claim_type: Listing
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "GET /accounts returns a paginated array with total_count and has_more in the envelope."
        test_recipe:
          setup: ["At least one account exists."]
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
          trigger:
            - call: "GET /accounts"
              payload: { creditor_id: "${cred}" }
              as: Collector
          assert:
            - "response_type == array; meta.total_count >= 1; has_more present"

      - name: fk_account_creditor_must_exist
        claim_type: Parent Relationships
        grounds:
          - "entities.Account.fields.creditor_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /accounts with a non-existent creditor_id -> ERR_NOT_FOUND (FK integrity, flat topology)."
        test_recipe:
          setup: ["A consumer exists; no creditor with the supplied id."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { creditor_id: "00000000-0000-4000-8000-000000000000", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "${err} == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: begin_work_from_placed_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Account.VALIDATION_SENT_to_WORKING"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "begin-work on a PLACED account (validation notice not yet sent) -> ERR_INVALID_STATE (transition only defined from VALIDATION_SENT)."
        test_recipe:
          setup: ["A PLACED account exists (no validation notice sent)."]
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "${err} == ERR_INVALID_STATE"

      - name: send_validation_notice_twice_returns_already_sent
        claim_type: Idempotency
        grounds:
          - "state_machines.Account.PLACED_to_VALIDATION_SENT"
          - "errors[ERR_VALIDATION_ALREADY_SENT]"
        distinguishing_aspect: "Calling send-validation-notice a second time -> ERR_VALIDATION_ALREADY_SENT (transition not idempotent)."
        test_recipe:
          setup: ["An account that already had a validation notice sent."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "${err} == ERR_VALIDATION_ALREADY_SENT"

      - name: dispute_reopen_from_open_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Dispute.RESOLVED_to_REOPENED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "reopen on an OPEN (not RESOLVED) dispute -> ERR_INVALID_STATE; reopen is only defined from RESOLVED."
        test_recipe:
          setup: ["A WORKING account with an OPEN ACCURACY dispute."]
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/disputes"
              payload: { dispute_type: "ACCURACY" }
              as: ComplianceOfficer
              captures: { disp: $.data.id }
          trigger:
            - call: "POST /disputes/${disp}/reopen"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "${err} == ERR_INVALID_STATE"

      - name: arrangement_accept_on_non_working_account_not_workable
        claim_type: guarded transitions
        grounds:
          - "state_machines.PaymentArrangement.PROPOSED_to_ACCEPTED"
          - "errors[ERR_ACCOUNT_NOT_WORKABLE]"
        distinguishing_aspect: "Accepting an arrangement while account.work_status==VALIDATION_SENT (not WORKING) -> ERR_ACCOUNT_NOT_WORKABLE (cross-entity guarded precondition)."
        test_recipe:
          setup:
            - "Account in VALIDATION_SENT (validation notice sent, NOT begun work)."
            - "A PROPOSED PLAN arrangement on that account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /arrangements"
              payload: { account_id: "${acct}", arrangement_type: "PLAN" }
              as: Collector
              captures: { arr: $.data.id }
          trigger:
            - call: "POST /arrangements/${arr}/accept"
              payload: {}
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "${err} == ERR_ACCOUNT_NOT_WORKABLE"

      - name: recall_terminal_account_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Account.ANY_NON_TERMINAL_to_RECALLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Recalling an account already CLOSED_UNCOLLECTIBLE -> ERR_INVALID_STATE (no transition from terminal work_status)."
        test_recipe:
          setup: ["An account that has been closed uncollectible."]
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/close-uncollectible"
              payload: {}
              as: Creditor
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Creditor
              captures: { v_pre: $.data.version }
          trigger:
            - call: "POST /accounts/${acct}/recall"
              payload: { expected_account_version: "${v_pre}" }
              as: Creditor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "${err} == ERR_INVALID_STATE"

      - name: account_auto_closes_paid_when_balance_zero
        claim_type: Bubble up
        grounds: [state_machines.Account.WORKING_to_CLOSED_PAID, calculations.account_balance]
        distinguishing_aspect: "Posting a payment that drives balance_cents to 0 auto-transitions work_status WORKING->CLOSED_PAID (system bubble-up)."
        test_recipe:
          setup: ["WORKING account, principal 50000; pay full 50000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 50000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 50000 }
              as: Collector
          assert:
            - "Account.${acct}.balance_cents == 0"
            - "Account.${acct}.work_status == CLOSED_PAID"

  # ===========================================================================
  - section: calculations
    instances:
      - name: settlement_amount_computed_at_accept
        claim_type: Correct Result
        grounds: [calculations.settlement_floor, entities.PaymentArrangement.fields.settlement_amount_cents]
        distinguishing_aspect: "Accepting a SETTLEMENT with offer_pct_bps=7000 on a balance-100000 account sets settlement_amount_cents == 70000 (round_half_up(100000*7000/10000))."
        test_recipe:
          setup:
            - "WORKING account, balance 100000, charge_off recent (age<180 -> age_floor 7000), balance<$10000 -> balance_floor 6000; floor max=7000."
            - "SETTLEMENT offer 7000 bps (== floor, allowed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-12-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /arrangements"
              payload: { account_id: "${acct}", arrangement_type: "SETTLEMENT", offer_pct_bps: 7000 }
              as: Collector
              captures: { arr: $.data.id }
          trigger:
            - call: "POST /arrangements/${arr}/accept"
              payload: {}
              as: Collector
              captures: { amt: $.data.settlement_amount_cents }
          assert:
            - "PaymentArrangement.${arr}.status == ACCEPTED"
            - "${amt} == 70000"

      - name: sol_dual_anchor_last_payment_not_barred
        claim_type: Variant Selection
        grounds: [calculations.sol_status, entities.Account.fields.sol_anchor_basis, entities.Account.fields.time_barred]
        distinguishing_aspect: "Same charge_off 2020-01-01 + sol_years 4 yields time_barred=true under CHARGE_OFF but time_barred=false under LAST_PAYMENT once a 2025-06-01 payment exists (anchor moves forward; re-aging guardrail uses the chosen basis)."
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "Account sol_anchor_basis=LAST_PAYMENT, charge_off 2020-01-01, sol_years 4, WORKING."
            - "A 5000-cent payment posted at clock 2025-06-01 (last_payment_date=2025-06-01 -> expiry 2029-06-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2020-01-01T00:00:00Z", sol_years: 4, sol_anchor_basis: "LAST_PAYMENT" }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /payments"
              payload: { account_id: "${acct}", amount_cents: 5000 }
              as: Collector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: System
          trigger:
            - call: "GET /accounts/${acct}"
              payload: {}
              as: Collector
              captures: { tb: $.data.time_barred }
          assert:
            - "Account.${acct}.last_payment_date == 2025-06-01T00:00:00Z"
            - "${tb} == false"

      - name: letter_attempt_does_not_count_toward_cadence
        claim_type: Input Set Filtering
        grounds: [calculations.cadence_window_count, entities.CommunicationAttempt.fields.counts_toward_cadence]
        distinguishing_aspect: "A LETTER attempt has counts_toward_cadence==false and does not increment attempts_in_window_count (only PHONE LOGGED/CONVERSATION count)."
        test_recipe:
          setup: ["WORKING account, CONTACTABLE; clock 2026-03-01T15:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T15:00:00Z" }
              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
          trigger:
            - call: "POST /communication-attempts"
              payload: { account_id: "${acct}", channel: "LETTER", attempted_at: "2026-03-01T15:00:00Z", outcome: "LOGGED" }
              as: Collector
              captures: { ctc: $.data.counts_toward_cadence }
          assert:
            - "CommunicationAttempt.counts_toward_cadence == false"
            - "Account.${acct}.attempts_in_window_count == 0"
            - "${ctc} == false"

      - name: payoff_quote_quote_date_default
        claim_type: Constants Applied
        grounds: [calculations.payoff_quote]
        excluded_because:
          difficulty_instance: dual_variant_calc / payoff_quote_date_vs_good_through_diverge_on_arrangement
          rationale: "as_of=QUOTE_DATE base payoff (60000) and the GOOD_THROUGH accrual are both asserted in the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: arrangement_accept_below_floor_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_SETTLEMENT_BELOW_FLOOR]"
        excluded_because:
