      - the order's core_charge_total_cents is 1500, so the entitled figure and the ordered figure differ
      - PartOrder.${ord}.refundable_deposit_cents == 300, the 20 percent of the ordered core charge
      - inspection of the oversized return is rejected with ERR_CORE_QUANTITY_EXCEEDS_PURCHASE before any credit is computed
  - name: satisfaction_constant_is_frozen_after_creation
