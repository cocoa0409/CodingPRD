  # =====================================================================
  # From Cross-Cutting Complexity Layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_student_version_on_dose_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dose-create-stale-student]
        distinguishing_aspect: "OCC on Student.version: after one dose creation advances the version, a second creation carrying the previously-captured version is rejected with 412 ERR_STALE_STUDENT_VERSION."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 2, min_interval_days 28, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-OCC, DOB 2020-06-15"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 2, min_interval_days: 28, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Occ Stu", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-OCC", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_v: $.data.version }
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
          trigger:
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 2, administered_date: "2026-09-10T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 412 with error_id == ERR_STALE_STUDENT_VERSION (Student.version advanced to 2 after the first dose creation)"
            - "no second ImmunizationRecord is created"

      - name: occ_stale_session_version_on_booking
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appointment-book-stale-session]
        distinguishing_aspect: "OCC on ClinicSession.version: after one booking advances the session version, a second booking carrying the previously-captured version is rejected with 412 ERR_STALE_SESSION_VERSION."
        test_recipe:
          setup:
            - "Session school SCH-OCS on 2026-09-01T09:00:00Z, 240 min, capacity 5, OPEN"
            - "Students A and B at school SCH-Y"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Occ A", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { a_id: $.data.id }
            - call: "POST /api/students"
              payload: { legal_name: "Occ B", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { b_id: $.data.id }
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-OCS", session_date: "2026-09-01T09:00:00Z", duration_minutes: 240, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { sess_v: $.data.version }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${a_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T10:30:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
          trigger:
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${b_id}", vaccine_code: "MMR", start_time: "2026-09-01T11:00:00Z", end_time: "2026-09-01T11:30:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 412 with error_id == ERR_STALE_SESSION_VERSION (session version advanced when the first booking bumped booked_count)"
            - "ClinicSession.booked_count remains 1"

      - name: void_verified_dose_recomputes_deficiency
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.ImmunizationRecord.VERIFIED_to_VOIDED
          - state_machines.Student.ENROLLED_COMPLIANT_to_ENROLLED_PROVISIONAL
          - entities.Student.fields.deficiency_vaccine_codes
        distinguishing_aspect: "Derived-field reconciliation: voiding the only verified dose re-derives deficiency_vaccine_codes back to [\"MMR\"] and reverts the student from ENROLLED_COMPLIANT to ENROLLED_PROVISIONAL because the clock (2026-08-01) is still within the provisional window."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-VD with one VERIFIED MMR dose (status ENROLLED_COMPLIANT)"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Void Dose", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-VD", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_v: $.data.version }
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
              captures: { rec_id: $.data.id }
            - call: "POST /api/immunization-records/${rec_id}/verify"
              payload: {}
              as: SchoolNurse
          trigger:
            - call: "POST /api/immunization-records/${rec_id}/void"
              payload: { reason: "recorded under wrong student" }
              as: SchoolNurse
            - call: "GET /api/students/${stu_id}"
              as: SchoolNurse
              captures: { stu_status: $.data.status, stu_def: $.data.deficiency_vaccine_codes }
          assert:
            - "ImmunizationRecord.${rec_id}.status == VOIDED"
            - "Student.${stu_id}.status == ENROLLED_PROVISIONAL (clock 2026-08-01 <= provisional_deadline 2026-08-31)"
            - "Student.deficiency_vaccine_codes == [\"MMR\"]"

      - name: sweep_no_op_when_no_deadlines_passed
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.timing_rules
        distinguishing_aspect: "Ops-run checkpoint idempotence: with the clock at the default 2026-08-01 (no provisional deadline passed, no notice past its exclusion date, no overdue appointment), the sweep changes nothing and reports all-zero counts."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-SW, no doses, within provisional window"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Sweep Noop", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-SW", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
              captures: { expired: $.data.provisional_expired_count, escalated: $.data.notices_escalated_count, excluded: $.data.students_excluded_count, compliant: $.data.students_marked_compliant_count, noshow: $.data.appointments_no_show_count }
            - call: "GET /api/students/${stu_id}"
              as: DistrictHealthOfficer
              captures: { stu_status: $.data.status }
          assert:
            - "all five sweep counters == 0"
            - "Student.${stu_id}.status == ENROLLED_PROVISIONAL (unchanged)"
