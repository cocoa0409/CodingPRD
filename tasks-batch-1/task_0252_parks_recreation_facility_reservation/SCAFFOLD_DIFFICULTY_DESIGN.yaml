            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: RecCoordinator
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: RecCoordinator
              captures: { fac_v1: $.data.version }
          trigger:
            - call: "POST /lottery-rounds/${round_id}/draw"
              payload: { expected_facility_version: "${fac_v1}" }
              as: RecCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Trigger returns ERR_DOUBLE_BOOKING (409)"
            - "LotteryRound.${round_id}.status == OPEN (unchanged)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_deny_voids_payment_money_conserved
        grounds:
          - state_machines.Permit.APPLIED_to_DENIED
          - entities.Payment.fields.status
          - entities.Refund.fields.total_refund_cents
        distinguishing_aspect: |
          Conserved quantity = net captured money for the permit. The forward action (capture Payment)
          plus its compensating action (DENY voids the Payment, full reverse) MUST leave
          net_money(permit) == Payment.captured - Refund.total == 0 with no cancellation fee retained.
        test_recipe:
          setup:
            - "APPLIED permit with a CAPTURED Payment of fee 20000 + deposit 1000. Deny the permit."
            - "Invariant: Payment VOIDED, full reversal, no fee kept (deny is not a late cancel)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Deny Court", facility_type: "COURT", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 1000, requires_coi: false }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "D", email: "dd@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 1000 }
              as: FinanceClerk
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/deny"
              payload: {}
              as: RecCoordinator
              captures: { st: $.data.status }
          assert:
            - "Permit.${perm_id}.status == DENIED"
            - "Payment.${pay_id}.status == VOIDED"
            - "Permit.${perm_id}.refunded_cents == 0 (no fee captured nor charged on deny)"

      - name: ci_complete_releases_deposit_count_conserved
        grounds:
          - state_machines.Permit.GRANTED_to_COMPLETED
          - entities.Facility.fields.granted_permit_count
          - entities.Permit.fields.deposit_held_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = Facility.granted_permit_count (an occupancy count, not
          money). Grant (+1) paired with its compensating terminal COMPLETE (-1) MUST return
          granted_permit_count to its pre-grant value, AND the full deposit is released
          (deposit_refund_cents == deposit_held_cents), leaving no held funds.
        test_recipe:
          setup:
            - "Facility deposit 5000, count starts 0. Grant one permit (count -> 1). After end_at, complete it (count -> 0, deposit released)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Comp Pool", facility_type: "POOL", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 5000, requires_coi: false }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "Cmp", email: "cmp@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-07-03T10:00:00Z", end_at: "2026-07-03T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 5000 }
              as: FinanceClerk
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v0}" }
              as: RecCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T13:00:00Z" }
              as: RecCoordinator
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/complete"
              payload: {}
              as: RecCoordinator
              captures: { st: $.data.status }
          assert:
            - "Permit.${perm_id}.status == COMPLETED"
            - "Facility.${fac_id}.granted_permit_count == 0 (back to pre-grant value)"
            - "Refund for ${perm_id}: deposit_refund_cents == 5000 and fee_refund_cents == 0"
