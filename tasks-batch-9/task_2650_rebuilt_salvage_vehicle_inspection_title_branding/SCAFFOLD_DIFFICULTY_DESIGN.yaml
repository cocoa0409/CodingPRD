              payload: { verification_note: "lamp assembly invoice on file" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "FRONT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "REAR" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "LEFT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "RIGHT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/submit"
              payload: { attestation_signed: true }
              as: Rebuilder
              as_user_id: "${rb_id}"
          trigger:
            - call: "POST /v1/applications/${app_id}/withdraw"
              payload: { withdrawn_reason: "rebuilder is re-sourcing the structural component" }
              as: Rebuilder
              as_user_id: "${rb_id}"
          assert:
            - "before the trigger the ledger identity closes as 480000 + 20000 + 0 == 500000"
            - "RebuiltApplication.${app_id}.status == WITHDRAWN and withdrawn_reason is recorded"
            - "RebuiltApplication.${app_id}.fee_escrowed_cents == 0"
            - "Rebuilder.${rb_id}.fee_balance_cents == 500000"
            - "Rebuilder.${rb_id}.escrowed_fee_total_cents == 0"
            - "Rebuilder.${rb_id}.fees_consumed_cents == 0"
            - "Rebuilder.${rb_id}.fees_deposited_cents == 500000"
            - "after the trigger the ledger identity closes as 500000 + 0 + 0 == 500000, so the release is a true compensation and not a consumption"
            - "RebuiltApplication.${app_id}.assessed_fee_cents == 20000 remains recorded on the withdrawn application for audit"
