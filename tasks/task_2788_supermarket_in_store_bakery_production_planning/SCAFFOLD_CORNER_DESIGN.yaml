            - "${e_state_first} == ERR_RUN_NOT_COMPLETED with HTTP 409 — the lifecycle check at priority 22 short-circuits before the ceiling check at priority 41"
            - "${e_ceiling_second} == ERR_WASTE_EXCEEDS_ON_SHELF with HTTP 422 — with actuals present the ceiling check is now the operative failure"
            - "ProductionRun.${run_id}.wasted_units_total == 0 and on_shelf_units == 80 after both rejections"
            - "GET /bakery/waste-records?production_run_id=${run_id} returns total_count == 0"

