              as: Registrar
              captures: { cr_id: $.data.id }
            - call: "POST /viewing-bookings"
              payload: { artwork_id: "${a1_id}", viewing_room_id: "${room_id}", client_id: "${client_id}", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T15:00:00Z" }
              as: Coordinator
              captures: { b1_id: $.data.id }
            - call: "POST /viewing-bookings/${b1_id}/state"
              payload: { to_status: "CONFIRMED" }
              as: Coordinator
            - call: "POST /viewing-bookings"
              payload: { artwork_id: "${a2_id}", viewing_room_id: "${room_id}", client_id: "${client_id}", scheduled_start: "2026-05-02T14:30:00Z", scheduled_end: "2026-05-02T15:30:00Z" }
              as: Coordinator
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /viewing-bookings/${b2_id}/state"
              payload: { to_status: "CONFIRMED" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ARTWORK_CONDITION_UNSAFE"
            - "response.http_status == 422"

  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: vault_capacity_full_boundary
        grounds:
          - validations[priority=20]
          - calculations.vault_occupancy
          - entities.Vault.fields.capacity_slots
          - entities.Vault.fields.occupied_slots
        distinguishing_aspect: |
          Exact >= boundary on the vault slot count: with capacity_slots=1 and one ACTIVE
          placement (occupied_slots=1), a second placement is rejected because occupied_slots(1)
          >= capacity_slots(1) — reached through POST /storage-placements.
        test_recipe:
          setup:
            - "AMBIENT vault capacity 1; two AMBIENT artworks; first placement ACTIVE (occupied 1)"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Petra Vault Co", client_type: "INSTITUTION", billing_email: "ap@petra.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "Tight Vault", climate_class: "AMBIENT", capacity_slots: 1 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Alpha", artist: "G. Ito", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { a1_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Beta", artist: "G. Ito", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { a2_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${a1_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /storage-placements"
              payload: { artwork_id: "${a2_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VAULT_FULL"
            - "Vault.${vault_id}.occupied_slots == 1"

      - name: loan_approve_empty_appraisal_set
        grounds:
          - validations[priority=14]
          - state_machines.LoanAgreement.SUBMITTED_to_APPROVED
          - entities.Appraisal.fields.status
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and endpoint: loan APPROVE with zero
          FINALIZED appraisals (count == 0) fails with ERR_NO_FINALIZED_APPRAISAL even though the
          artwork is IN_STORAGE and coverage is sufficient.
        test_recipe:
          setup:
            - "artwork IN_STORAGE with an ACTIVE ALL_RISK policy insured 2,000,000, loan required 1,000,000, ZERO appraisals; loan SUBMITTED"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Quill Museum", client_type: "INSTITUTION", billing_email: "ap@quill.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "Vault E", climate_class: "AMBIENT", capacity_slots: 5 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Ganymede", artist: "R. Voss", size_class: "MEDIUM", fragility_class: "MEDIUM", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id, art_v1: $.data.version }
            - call: "POST /policies"
              payload: { artwork_id: "${art_id}", coverage_type: "ALL_RISK", insured_value_cents: 2000000, effective_start: "2026-05-01T00:00:00Z", effective_end: "2027-05-01T00:00:00Z", expected_artwork_version: "${art_v1}" }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { placement_id: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${art_id}", client_id: "${client_id}", borrower_name: "City Museum", exhibition_name: "Moons", loan_start: "2026-06-01T00:00:00Z", loan_end: "2026-07-01T00:00:00Z", is_international: false, required_value_cents: 1000000 }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "APPROVED" }
              as: Approver
              as_user_id: "app-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_FINALIZED_APPRAISAL"
            - "response.http_status == 422"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transport_requires_artwork_in_storage
        grounds:
          - state_machines.TransportJob.SCHEDULED_to_IN_PROGRESS
          - entities.Artwork.fields.custody_status
          - validations[priority=11]
        distinguishing_aspect: |
          TransportJob SCHEDULED->IN_PROGRESS depends on Artwork state (pair TransportJob->Artwork):
          an artwork still IN_INTAKE (never placed) blocks the transition with
          ERR_ARTWORK_NOT_AVAILABLE even with a READY crate.
        test_recipe:
          setup:
            - "artwork IN_INTAKE; READY crate for it; crew; transport SCHEDULED"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Transit Arts", client_type: "DEALER", billing_email: "ap@transit.example" }
              as: Registrar
