              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /device-lots"
              payload: { device_type: "BALLOON", catalog_code: "BAL-6X40", lot_number: "CL-40", expires_on: "2027-06-30", received_quantity: 5, unit_cost_cents: 22000 }
              as: CenterAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-03-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-25T08:00:00Z", access_flow_ml_min: 900, venous_pressure_mmhg: 100, recirculation_pct: 2.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "headroom split corner", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/triage"
              payload: {}
              as: AccessCoordinator
              captures: { ref_v: $.data.version }
            - call: "POST /procedures"
              payload: { referral_id: "${ref_id}", room_id: "${room_id}", primary_operator_id: "${op_id}", procedure_type: "ANGIOPLASTY", sedation_level: "NONE", scheduled_start: "2026-08-01T13:00:00Z", scheduled_end: "2026-08-01T14:00:00Z", expected_referral_version: "${ref_v}" }
              as: AccessCoordinator
              captures: { proc_id: $.data.id }
          trigger:
            - call: "POST /procedures/${proc_id}/device-usages"
              payload: { device_lot_id: "${lot_id}", quantity: 6, expected_device_lot_version: "${lot_v}" }
              as: AccessCoordinator
            - call: "POST /procedures/${proc_id}/device-usages"
              payload: { device_lot_id: "${lot_id}", quantity: 5, expected_device_lot_version: "${lot_v}" }
              as: AccessCoordinator
              captures: { use_id: $.data.id }
            - call: "GET /device-lots/${lot_id}"
              payload: {}
              as: CenterAdmin
              captures: { lot_v2: $.data.version }
            - call: "POST /procedures/${proc_id}/device-usages"
              payload: { device_lot_id: "${lot_id}", quantity: 1, expected_device_lot_version: "${lot_v2}" }
              as: AccessCoordinator
          assert:
            - "the 6-unit request returns 409 with data.error_id == ERR_INSUFFICIENT_DEVICE_STOCK and does not bump the lot's version, which is why ${lot_v} is still valid for the next call"
            - "the 5-unit request returns 201: headroom 5 >= 5 is inclusive; DeviceUsage.${use_id}.state == RESERVED with quantity 5"
            - "the interleaved read shows quantity_on_hand 5, quantity_reserved 5, status still AVAILABLE (DEPLETED requires quantity_on_hand == 0, which only consumption can cause) and version ${lot_v2} == ${lot_v} + 1"
            - "the trailing 1-unit request returns 409 with data.error_id == ERR_LOT_DEPLETED, not ERR_INSUFFICIENT_DEVICE_STOCK, because headroom is exactly 0"
            - "GET /device-usages?device_lot_id=${lot_id} returns total_count 1 — neither rejection created a row"

