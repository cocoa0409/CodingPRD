          - calculations.statement_commission_cents
          - calculations.statement_net_cents
        distinguishing_aspect: "The gross_cents == 0 branch short-circuits the MIN_COMMISSION_CENTS floor: an empty statement reconciles to commission_cents 0 and net_cents 0 rather than to the 50-cent minimum."
