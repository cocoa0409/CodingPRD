  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: disposition_gated_by_inspection_driven_posture
        grounds:
          - validations[priority=7]
          - state_machines.RegulatoryInspection.ANNOUNCED_to_FINDINGS_ISSUED
          - state_machines.RegulatoryInspection.FINDINGS_ISSUED_to_CLOSED
          - calculations.site_release_posture
        distinguishing_aspect: "Entity pair BatchLot x ManufacturingSite via RegulatoryInspection: a single open CRITICAL inspection finding freezes COMMERCIAL release of an otherwise flawless batch; closing the inspection thaws the site and the same disposition then succeeds."
        test_recipe:
          setup:
            - "Commercial batch at PENDING_DISPOSITION; an FDA inspection is ANNOUNCED at the site."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - *d_getb2
            - *d_test_t1
            - *d_verify_t1
            - *d_getb3
            - *d_test_t2
            - *d_verify_t2
            - *d_adv_pc
            - *d_submit
            - &d_insp
              call: "POST /sites/${site_id}/inspections"
              payload: { authority: "FDA" }
              as: RegulatoryAffairsSpecialist
              captures: { insp_id: $.data.id }
            - &d_insp_find
              call: "POST /inspections/${insp_id}/action"
              payload: { action: "ISSUE_FINDINGS", findings: [{ severity: "CRITICAL", note: "Data integrity gaps in batch records" }] }
              as: RegulatoryAffairsSpecialist
          trigger:
            - call: "POST /batches/${batch_id}/disposition"
              payload: { decision: "RELEASED", rationale: "Attempted release during open critical finding" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
              captures: { err: $.data.error_id }
            - &d_insp_close
              call: "POST /inspections/${insp_id}/action"
              payload: { action: "CLOSE", response_summary: "Remediation plan accepted by the agency" }
              as: RegulatoryAffairsSpecialist
            - call: "POST /batches/${batch_id}/disposition"
              payload: { decision: "RELEASED", rationale: "All specifications met; posture clear" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
          assert:
            - "first disposition rejected 409 with ${err} == ERR_SITE_RELEASE_FROZEN while the inspection had one open CRITICAL finding"
            - "after CLOSE: GET /sites/${site_id} shows open_critical_finding_count == 0 and release_posture == CLEAR"
            - "second disposition returns 200 and BatchLot.${batch_id}.quality_status == RELEASED"

      - name: seed_start_gated_by_single_source_material_stock
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - calculations.material_coverage
          - errors.ERR_SINGLE_SOURCE_MATERIAL_BLOCKED
        distinguishing_aspect: "Entity pair Campaign x MaterialLot: start-seed consumes base_quantity x 1.10 (110.00 against exactly 110 in stock, boundary sufficient); the second campaign then finds 0 < 110.00 and, because the material is single-source, fails with ERR_SINGLE_SOURCE_MATERIAL_BLOCKED rather than the generic ERR_MATERIAL_SHORTAGE."
        test_recipe:
          setup:
            - "Product MAB-SS requiring [{material_name CHO-CDM, base_quantity 100, is_single_source true}]; one lot of 110 units AVAILABLE; campaigns C1 (Oct 1-20) and C2 (Oct 21-Nov 5) both ALLOCATED with one seed stage each; logical clock at 2026-10-21T00:00:00Z for C2."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - &d_product_ss
              call: "POST /products"
              payload: { product_code: "MAB-SS", molecule_type: "MONOCLONAL_ANTIBODY", market_scope: "BOTH", requires_cold_chain: true, min_storage_temp_c: 2.0, max_storage_temp_c: 8.0, shelf_life_hours: 2160, changeover_hours: 14, same_product_turnaround_hours: 6, required_materials: [{ material_name: "CHO-CDM", base_quantity: 100, is_single_source: true }] }
              as: PlatformAdmin
              captures: { prod_ss: $.data.id }
            - *d_train
            - call: "POST /sites/${site_id}/materials"
              payload: { material_name: "CHO-CDM", is_single_source: true, quantity: 110 }
              as: PlatformAdmin
              captures: { mat1: $.data.id }
            - call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_ss}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-20T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_c1: $.data.id }
            - call: "POST /campaigns/${camp_c1}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
            - call: "POST /campaigns/${camp_c1}/seed-stages"
              payload: { stage_index: 1, planned_duration_hours: 10 }
              as: ProcessEngineer
            - call: "POST /campaigns/${camp_c1}/advance"
              payload: { to_status: "SEED_IN_PROGRESS" }
              as: ProcessEngineer
            - call: "GET /sites/${site_id}/materials"
              payload: {}
              as: Any
              captures: { mat_left: "$.data[0].quantity_available" }
            - call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_ss}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-21T00:00:00Z", planned_end_utc: "2026-11-05T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_c2: $.data.id }
            - call: "POST /campaigns/${camp_c2}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
            - call: "POST /campaigns/${camp_c2}/seed-stages"
              payload: { stage_index: 1, planned_duration_hours: 10 }
              as: ProcessEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns/${camp_c2}/advance"
              payload: { to_status: "SEED_IN_PROGRESS" }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
          assert:
            - "C1 start-seed succeeded: ${mat_left} == 0.0 (110.00 consumed = 100 x 1.10 exactly, boundary sufficient)"
            - "Campaign.${camp_c1}.status == SEED_IN_PROGRESS"
            - "C2 start-seed rejected 409 with ${err} == ERR_SINGLE_SOURCE_MATERIAL_BLOCKED (available 0.0 < required 110.00, single-source checked before generic shortage)"
            - "${err} != ERR_MATERIAL_SHORTAGE"

      - name: commercial_release_gated_by_comparability_filing
        grounds:
          - validations[priority=9]
          - state_machines.ComparabilityStudy
          - errors.ERR_COMPARABILITY_NOT_ESTABLISHED
        distinguishing_aspect: "Entity pair BatchLot x ComparabilityStudy: a COMMERCIAL batch of a product whose latest study is not FILED cannot be released; driving the study PLANNED -> PROTOCOL_APPROVED -> COMPARABLE -> FILED unblocks the very same disposition call."
        test_recipe:
          setup:
            - "Commercial batch at PENDING_DISPOSITION with VERIFIED DOWNSTREAM PURITY 99.5; a PROCESS_CHANGE study exists on the product (baseline [98.0, 98.2, 97.8, 98.1, 85.0], candidate this batch) still in PLANNED."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - *d_getb2
            - *d_test_t1
            - *d_verify_t1
            - *d_getb3
            - *d_test_t2
            - *d_verify_t2
            - call: "GET /batches/${batch_id}"
              payload: {}
              as: Any
              captures: { bat_v4: $.data.version }
            - *d_test_pur
            - *d_verify_pur
            - *d_adv_pc
            - *d_submit
            - *d_study
          trigger:
            - call: "POST /batches/${batch_id}/disposition"
              payload: { decision: "RELEASED", rationale: "Attempted release before comparability filing" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
              captures: { err: $.data.error_id }
            - *d_study_appr
            - *d_study_assess
            - &d_study_file
              call: "POST /comparability-studies/${study_id}/action"
              payload: { action: "SUBMIT_FILING", authority: "FDA" }
              as: RegulatoryAffairsSpecialist
            - call: "POST /batches/${batch_id}/disposition"
              payload: { decision: "RELEASED", rationale: "Comparability filed; all gates pass" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
          assert:
            - "first disposition rejected 409 with ${err} == ERR_COMPARABILITY_NOT_ESTABLISHED (latest study PLANNED, not FILED)"
            - "after RECORD_ASSESSMENT the study is COMPARABLE (candidate 99.5 inside [95.0842, 100.9658]) and after SUBMIT_FILING status == FILED"
            - "second disposition returns 200 and BatchLot.${batch_id}.quality_status == RELEASED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: train_window_buffered_adjacency_overlap_semantics
        grounds:
          - calculations.train_window_conflict
          - errors.ERR_TRAIN_WINDOW_CONFLICT
        distinguishing_aspect: "Interval semantics: pairwise half-open windows on a BioreactorTrain with a product-dependent buffer. Same-product successors need exactly the 6-hour turnaround (allowed at exact equality); any true overlap or a 5-hour gap is rejected."
        test_recipe:
          setup:
            - "Train TR-1 with campaign A (MAB-001, turnaround 6) occupying 2026-10-01T00:00Z to 2026-10-10T00:00Z."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
          trigger:
            - call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-10T06:00:00Z", planned_end_utc: "2026-10-20T00:00:00Z", upstream_hours: 8, downstream_hours: 24 }
              as: ProcessEngineer
              captures: { camp_gap_ok: $.data.id }
            - call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-05T00:00:00Z", planned_end_utc: "2026-10-12T00:00:00Z", upstream_hours: 8, downstream_hours: 24 }
              as: ProcessEngineer
              captures: { err_overlap: $.data.error_id }
            - call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-20T05:00:00Z", planned_end_utc: "2026-10-25T00:00:00Z", upstream_hours: 8, downstream_hours: 24 }
              as: ProcessEngineer
              captures: { err_short: $.data.error_id }
          assert:
            - "Campaign.${camp_gap_ok} created 201 (start exactly 6 hours after A's end satisfies the same-product turnaround buffer)"
            - "the overlapping 10-05 campaign is rejected 409 with ${err_overlap} == ERR_TRAIN_WINDOW_CONFLICT"
            - "the 10-20T05:00 campaign is rejected 409 with ${err_short} == ERR_TRAIN_WINDOW_CONFLICT (5-hour gap is 1 hour short of the 6-hour turnaround)"

