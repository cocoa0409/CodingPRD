        grounds: ['calculations.travel_surcharge', 'calculations.long_carry_surcharge', 'calculations.stairs_surcharge', 'calculations.invoice_coordination_fee', 'calculations.engagement_volume_estimate', 'endpoints["GET /engagements/{id}/summary"]']
        distinguishing_aspect: "For 55 miles the marginal bands charge 25*317 + 15*486 = 15215; 76 long-carry feet buys exactly one 1800 block; with no crew the stairs surcharge is 0; projected_total_cents is 17015 + 1021 = 18036 and the volume estimate uses the ASSESSMENT_HEURISTIC 2*180 = 360.00."
        test_recipe:
          setup: ["One HOURLY STUDIO engagement with mileage_miles 55, origin_stairs_flights 0 and origin_long_carry_feet 76, and no inventory."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 55, origin_stairs_flights: 0, origin_long_carry_feet: 76 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
          trigger:
            - call: "GET /engagements/${eng}/summary"
              payload: {}
              as: MOVE_MANAGER
          assert:
            - "the summary reports projected_total_cents == 18036"
            - "the summary reports volume_estimate_variant == ASSESSMENT_HEURISTIC"
            - "the summary reports volume_estimate_cft == 360.00"
            - "the summary reports progress_pct == 0"
            - "the summary reports open_hold_count == 0"
            - "the summary reports next_unpack_session_id == null"
            - "the summary reports billing_hours_total == 0 and accrued_labor_cents == 0"

