            - "BackgroundInvestigator writing MEDICAL findings: HTTP 403, same code"
            - "MedicalExaminer writing PHYSICAL_FITNESS findings: HTTP 403, same code - fitness belongs to the TrainingCoordinator"
            - "BackgroundInvestigator on BACKGROUND, MedicalExaminer on MEDICAL, MedicalExaminer on PSYCHOLOGICAL and TrainingCoordinator on PHYSICAL_FITNESS: four HTTP 200s with data.status == 'FINDINGS_RECORDED'"
            - "the examiner legitimately owns TWO types - a one-type-per-role mapping fails the PSYCHOLOGICAL call"
            - "BackgroundInvestigator adjudicating the PSYCHOLOGICAL record: HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED' - the scoping applies to adjudicate exactly as it does to findings"
            - "MedicalExaminer adjudicating the PSYCHOLOGICAL record: HTTP 200 with data.status == 'CLEARED'"
            - "recruit read: data.clearance_status == 'PARTIAL' - the three refused writes left their records at 'ORDERED' or 'FINDINGS_RECORDED', so only one type is terminal"

