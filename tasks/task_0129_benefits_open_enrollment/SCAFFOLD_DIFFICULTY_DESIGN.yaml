          Category pair business_referential (priority 7 ERR_EOI_REQUIRED) vs
          business_safety (priority 8 ERR_EMPLOYEE_NOT_ELIGIBLE): a WAITING employee
          activating an over-GI VOLUNTARY_LIFE enrollment violates BOTH; the lower
          priority number wins, so ERR_EOI_REQUIRED (priority 7) is returned.
        test_recipe:
          setup:
            - "Employee still WAITING (waiting period not elapsed)."
            - "VOLUNTARY_LIFE offering requires_eoi GI 15000000; DRAFT enrollment coverage 30000000 (> GI)."
          setup_api_calls:
