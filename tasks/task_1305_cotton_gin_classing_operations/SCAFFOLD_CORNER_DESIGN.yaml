          trigger:
            - call: "POST /gin-ops/gin-shifts/${s}/close"
              payload: { actual_lint_scale_lbs: 1000, actual_seed_scale_lbs: 8000, waste_lbs: 999 }
              as: GinOperator
              captures: { e1: $.data.error_id }
            - call: "POST /gin-ops/gin-shifts/${s}/close"
              payload: { actual_lint_scale_lbs: 1001, actual_seed_scale_lbs: 8000, waste_lbs: 999 }
