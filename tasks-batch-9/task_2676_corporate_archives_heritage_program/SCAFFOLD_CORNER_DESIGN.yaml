# §1.9 Scaffold Corner Design — Corporate Archives & Heritage Program (task 2676)
#
# Breadth probe. Every claim below is grounded in SCAFFOLD.yaml §1.1–§1.7 and is NOT
# already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml; where §1.8 already covers a
# corner, an `excluded_because:` stub cites the covering instance by name.
#
# Taxonomy: references/claim-extraction-guide.md — the nine `section:` values and their
# per-section `claim_type:` rows only.
#
# Fixture conventions shared by every recipe below:
#   * The logical clock starts at 2026-08-01T00:00:00Z; any recipe that needs another
#     instant sets it explicitly through POST /_clock/set_current_utc as SystemOperator.
#   * Actor user ids are literals: director-a / director-b (ArchivesDirector),
#     archivist-a (Archivist), preserv-a / preserv-b (PreservationOfficer),
#     officer-a / officer-b / officer-c (AccessServicesOfficer), counsel-a (LegalCounsel).
#   * Requester-role calls pass as_user_id equal to the Requester row's id.
#   * 00000000-0000-0000-0000-0000000000ff is used as a syntactically valid id that
#     never exists, for not-found probes.

scaffold_corner_design:

  # ------------------------------------------------------------------------------
  # SECTION 1 — ENTITIES (§1.1)
  # ------------------------------------------------------------------------------
  - section: entities
    instances:

      - name: retention_schedule_create_echoes_all_five_input_fields
        claim_type: creation
        grounds:
          - entities.RetentionSchedule
          - endpoints[POST /retention-schedules]
          - response_envelope.success
        distinguishing_aspect: "POST /retention-schedules with all five required fields returns 201 and echoes code, retention_years, disposition_action, legal_citation and min_appraisal_score_for_permanent verbatim inside data."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /retention-schedules"
              payload: { code: "FIN-07", retention_years: 7, disposition_action: "DESTROY", legal_citation: "17 CFR 240.17a-4(b)", min_appraisal_score_for_permanent: 82.50 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response_type == \"object\""
            - "RetentionSchedule.${sched_id}.code == \"FIN-07\""
            - "RetentionSchedule.${sched_id}.retention_years == 7"
            - "RetentionSchedule.${sched_id}.disposition_action == DESTROY"
            - "RetentionSchedule.${sched_id}.legal_citation == \"17 CFR 240.17a-4(b)\""
            - "RetentionSchedule.${sched_id}.min_appraisal_score_for_permanent == 82.50"

      - name: record_series_get_by_id_returns_stored_row_with_computed_defaults
        claim_type: retrieval
        grounds:
          - entities.RecordSeries
          - endpoints[GET /record-series/{id}]
        distinguishing_aspect: "GET /record-series/{id} returns the row exactly as stored: the seven input fields plus disposition_state ACTIVE, legal_hold_active false, current_appraisal_id null and blocked_access_request_count 0."
        test_recipe:
          setup:
            - "One RetentionSchedule and one RecordSeries created; nothing else touched the series."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "LEG-12", retention_years: 10, disposition_action: "REVIEW", legal_citation: "Corp Policy 4.2", min_appraisal_score_for_permanent: 70.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Board Minutes", business_unit: "Corporate Secretary", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 40, earliest_record_year: 1980, latest_record_year: 2010 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
          trigger:
            - call: "GET /record-series/${series_id}"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
          assert:
            - "HTTP status is 200"
            - "RecordSeries.${series_id}.title == \"Board Minutes\""
            - "RecordSeries.${series_id}.retention_schedule_id == ${sched_id}"
            - "RecordSeries.${series_id}.sensitivity_ceiling == INTERNAL"
            - "RecordSeries.${series_id}.disposition_state == ACTIVE"
            - "RecordSeries.${series_id}.legal_hold_active == false"
            - "RecordSeries.${series_id}.current_appraisal_id is null"
            - "RecordSeries.${series_id}.blocked_access_request_count == 0"
            - "RecordSeries.${series_id}.version == 1"

      - name: archival_items_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /archival-items]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three items under one accession, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One series, one storage zone, one accession with three ArchivalItem rows."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "OPS-03", retention_years: 3, disposition_action: "DESTROY", legal_citation: "Corp Policy 1.1", min_appraisal_score_for_permanent: 90.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Plant Photographs", business_unit: "Manufacturing", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "PUBLIC", annual_volume_linear_feet: 20, earliest_record_year: 1955, latest_record_year: 1999 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-PHOTO", temperature_c: 15.0, relative_humidity_pct: 40.0, max_overlapping_migration_jobs: 2 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Plant Records Office", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 3 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "BOX-1", unit_count: 1, condition_grade: "GOOD", original_format: "PHOTO", sensitivity_level: "PUBLIC" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { item1_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "BOX-2", unit_count: 1, condition_grade: "GOOD", original_format: "PHOTO", sensitivity_level: "PUBLIC" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { item2_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "BOX-3", unit_count: 1, condition_grade: "GOOD", original_format: "PHOTO", sensitivity_level: "PUBLIC" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { item3_id: $.data.id }
          trigger:
            - call: "GET /archival-items"
              payload: { accession_id: "${acc_id}", limit: 2, offset: 0 }
              as: Archivist
              as_user_id: "archivist-a"
            - call: "GET /archival-items"
              payload: { accession_id: "${acc_id}", limit: 2, offset: 2 }
              as: Archivist
              as_user_id: "archivist-a"
          assert:
            - "First response: response_type == \"array\", data length == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second response: data length == 1, total_count == 3, has_more == false, offset == 2"
            - "The union of ids across both pages is exactly {${item1_id}, ${item2_id}, ${item3_id}} with no repetition"

      - name: storage_zone_get_unknown_id_returns_zone_not_found
        claim_type: not_found
        grounds:
          - validations[priority=8]
          - errors[ERR_STORAGE_ZONE_NOT_FOUND]
          - endpoints[GET /storage-zones/{id}]
        distinguishing_aspect: "GET /storage-zones/{id} on a syntactically valid but non-existent id returns ERR_STORAGE_ZONE_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "One unrelated StorageZone exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-VAULT", temperature_c: 17.0, relative_humidity_pct: 45.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
          trigger:
            - call: "GET /storage-zones/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == ERR_STORAGE_ZONE_NOT_FOUND"
            - "response_type == \"error\""
            - "StorageZone.${zone_id} is untouched"

      - name: record_series_create_without_retention_schedule_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /record-series]
          - entities.RecordSeries.fields.retention_schedule_id
        distinguishing_aspect: "Omitting the required input field retention_schedule_id from POST /record-series returns ERR_INVALID_REQUEST (400) and creates no row, rather than defaulting the FK to null."
        test_recipe:
          setup:
            - "One RetentionSchedule exists but is deliberately not referenced."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "HR-05", retention_years: 5, disposition_action: "DESTROY", legal_citation: "Corp Policy 9.9", min_appraisal_score_for_permanent: 75.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /record-series"
              payload: { title: "Payroll Registers", business_unit: "Human Resources", sensitivity_ceiling: "CONFIDENTIAL", annual_volume_linear_feet: 12, earliest_record_year: 1970, latest_record_year: 1995 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /record-series returns total_count == 0"

      - name: requester_create_omitting_nda_on_file_defaults_to_false_and_active
        claim_type: defaults
        grounds:
          - entities.Requester.fields.nda_on_file
          - entities.Requester.fields.status
          - state_machines.Requester.initial_state
          - endpoints[POST /requesters]
        distinguishing_aspect: "POST /requesters without the optional nda_on_file field stores nda_on_file false (declared default) and status ACTIVE (declared initial_state)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /requesters"
              payload: { display_name: "J. Okafor", requester_class: "EXTERNAL_RESEARCHER", affiliation: "State University" }
              as: AccessServicesOfficer
              as_user_id: "officer-a"
              captures: { req_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Requester.${req_id}.nda_on_file == false"
            - "Requester.${req_id}.status == ACTIVE"
            - "Requester.${req_id}.suspend_reason is null"

      - name: record_series_retention_expiry_utc_computed_from_latest_year_plus_retention_years
        claim_type: computed_fields
        grounds:
          - calculations.retention_expiry
          - entities.RecordSeries.fields.retention_expiry_utc
          - endpoints[POST /record-series]
        distinguishing_aspect: "latest_record_year 2010 under a 10-year schedule yields retention_expiry_utc exactly 2020-12-31T23:59:59.000Z — the base instant is 23:59:59.000Z on 31 December and only the year field advances."
        test_recipe:
          setup:
            - "RetentionSchedule with retention_years 10; RecordSeries with latest_record_year 2010."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "LEG-10", retention_years: 10, disposition_action: "REVIEW", legal_citation: "Corp Policy 4.2", min_appraisal_score_for_permanent: 70.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /record-series"
              payload: { title: "Litigation Files", business_unit: "Legal", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "CONFIDENTIAL", annual_volume_linear_feet: 30, earliest_record_year: 1988, latest_record_year: 2010 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "RecordSeries.${series_id}.retention_expiry_utc == \"2020-12-31T23:59:59.000Z\""
            - "RecordSeries.${series_id}.disposition_state == ACTIVE"

      - name: archival_item_custody_triple_and_preservation_format_computed_on_accession_processing
        claim_type: computed_fields
        grounds:
          - state_machines.ArchivalItem.UNPROCESSED_to_ACCESSIONED
          - entities.ArchivalItem.fields.units_on_shelf
          - entities.ArchivalItem.fields.preservation_format
          - calculations.unit_custody_conservation
        distinguishing_aspect: "Before processing the item carries units_on_shelf 0 and preservation_format null; after POST /accessions/{id}/process it carries units_on_shelf 3, units_on_loan 0, units_deaccessioned 0 and preservation_format PAPER (copied from original_format), with digital_surrogate_available still false."
        test_recipe:
          setup:
            - "Accession with declared_unit_count 3 holding one PAPER item of unit_count 3, provenance verified."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "ADM-06", retention_years: 6, disposition_action: "TRANSFER", legal_citation: "Corp Policy 2.7", min_appraisal_score_for_permanent: 88.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Executive Correspondence", business_unit: "Office of the CEO", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 18, earliest_record_year: 1962, latest_record_year: 2002 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-PAPER", temperature_c: 16.0, relative_humidity_pct: 44.0, max_overlapping_migration_jobs: 2 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "CEO Office", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 3 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "CORR-1962-2002", unit_count: 3, condition_grade: "GOOD", original_format: "PAPER", sensitivity_level: "INTERNAL" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Transferred from the CEO office vault under the 2026 records survey.", transfer_instrument_reference: "IT-2026-014" }
              as: Archivist
              as_user_id: "archivist-a"
          trigger:
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
          assert:
            - "HTTP status is 200"
            - "Accession.${acc_id}.status == PROCESSED"
            - "ArchivalItem.${item_id}.status == ACCESSIONED"
            - "ArchivalItem.${item_id}.units_on_shelf == 3"
            - "ArchivalItem.${item_id}.units_on_loan == 0"
            - "ArchivalItem.${item_id}.units_deaccessioned == 0"
            - "ArchivalItem.${item_id}.preservation_format == PAPER"
            - "ArchivalItem.${item_id}.digital_surrogate_available == false"

      - name: storage_zone_create_stamps_id_created_at_updated_at_and_version_one
        claim_type: system_fields
        grounds:
          - entities.StorageZone
          - endpoints[POST /storage-zones]
        distinguishing_aspect: "A freshly created StorageZone carries a server-minted id, created_at == updated_at and version == 1; the second write (an environment reading) advances version to 2 and refreshes updated_at."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-COLD", temperature_c: 12.0, relative_humidity_pct: 35.0, max_overlapping_migration_jobs: 3 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id, zone_v1: $.data.version }
            - call: "POST /storage-zones/${zone_id}/environment-readings"
              payload: { temperature_c: 13.0, relative_humidity_pct: 36.0 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_v2: $.data.version }
          assert:
            - "StorageZone.${zone_id}.id is a non-empty server-minted uuid with no type prefix"
            - "${zone_v1} == 1"
            - "StorageZone.${zone_id}.created_at == \"2026-08-01T00:00:00.000Z\""
            - "${zone_v2} == 2"
            - "StorageZone.${zone_id}.reading_count == 2"
            - "StorageZone.${zone_id}.environmental_status == COMPLIANT"

      - name: archival_item_create_rejects_undeclared_condition_grade_enum
        claim_type: type_constraints
        grounds:
          - entities.ArchivalItem.fields.condition_grade
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "condition_grade \"MINT\" is not a member of {GOOD, FAIR, POOR, UNSTABLE}, so POST /archival-items returns ERR_INVALID_REQUEST (400) and no item row is created."
        test_recipe:
          setup:
            - "One series, one zone and one accession with declared_unit_count 2 exist."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "ENG-04", retention_years: 4, disposition_action: "DESTROY", legal_citation: "Corp Policy 6.1", min_appraisal_score_for_permanent: 92.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Engineering Drawings", business_unit: "Engineering", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 22, earliest_record_year: 1948, latest_record_year: 1990 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-FLAT", temperature_c: 17.0, relative_humidity_pct: 46.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Engineering Vault", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 2 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "DRAW-1", unit_count: 2, condition_grade: "MINT", original_format: "PAPER", sensitivity_level: "INTERNAL" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /archival-items with accession_id == ${acc_id} returns total_count == 0"
            - "Accession.${acc_id}.processed_unit_count == 0"

      - name: exhibit_loan_create_rejects_window_end_not_after_window_start
        claim_type: type_constraints
        grounds:
          - entities.ExhibitLoan.fields.window_end
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "window_end equal to window_start violates the declared constraint window_end > window_start, so POST /exhibit-loans returns ERR_INVALID_REQUEST (400) before any interval-conflict arithmetic runs."
        test_recipe:
          setup:
            - "One ACCESSIONED item of unit_count 2 with units_on_shelf 2."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "EXH-08", retention_years: 8, disposition_action: "REVIEW", legal_citation: "Corp Policy 3.3", min_appraisal_score_for_permanent: 80.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Founder Artifacts", business_unit: "Heritage Office", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "PUBLIC", annual_volume_linear_feet: 5, earliest_record_year: 1901, latest_record_year: 1960 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-EXH", temperature_c: 16.5, relative_humidity_pct: 42.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Founder Family", transfer_instrument: "DEED_OF_GIFT", declared_unit_count: 2 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "FOUNDER-DESK-SET", unit_count: 2, condition_grade: "GOOD", original_format: "PHOTO", sensitivity_level: "PUBLIC" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Deed of gift executed 1998 by the founder family trust.", transfer_instrument_reference: "DOG-1998-02" }
              as: Archivist
              as_user_id: "archivist-a"
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
              as_user_id: "archivist-a"
          trigger:
            - call: "POST /exhibit-loans"
              payload: { archival_item_id: "${item_id}", exhibit_name: "Centenary Gallery", units: 1, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /exhibit-loans with archival_item_id == ${item_id} returns total_count == 0"
            - "ArchivalItem.${item_id}.units_on_shelf == 2"

      - name: retention_schedule_carries_no_version_field_and_no_mutating_endpoint
        claim_type: immutability
        grounds:
          - entities.RetentionSchedule
          - endpoints[POST /retention-schedules]
          - validations[priority=14]
          - errors[ERR_DUPLICATE_RESOURCE_KEY]
        distinguishing_aspect: "RetentionSchedule declares common_fields: false, so its rows expose only id and created_at (no version, no updated_at) and §1.5 declares no update or delete endpoint; re-posting the same code returns ERR_DUPLICATE_RESOURCE_KEY (409) instead of overwriting the stored row."
        test_recipe:
          setup:
            - "One RetentionSchedule with code TAX-07 and retention_years 7."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "TAX-07", retention_years: 7, disposition_action: "DESTROY", legal_citation: "IRC 6001", min_appraisal_score_for_permanent: 85.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
