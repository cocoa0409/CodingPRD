          - validations[priority=8]
          - validations[priority=47]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / award_confirm_phase_before_budget
          rationale: "That §1.8 instance ends by fixing each violation in turn and confirming the award successfully, so the satisfied-path assertion is already made on the same endpoint."

      - name: condition_check_runs_before_span_conflict_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=17]
          - validations[priority=42]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / installation_plan_condition_before_span_conflict
          rationale: "That §1.8 instance violates the condition-report rule and the span-conflict rule on one installation-plan call and asserts the earlier rule's error wins."

  # =========================================================================
  # SECTION: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: artist_patch_updates_only_the_declared_mutable_fields
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /artists/{id}]
          - entities.Artist.fields.payout_hold
          - entities.Artist.fields.member_status
        distinguishing_aspect: "The PATCH surface is exactly member_status, tax_form_on_file, payout_method and payout_hold: a partial body changes only the named keys, leaves legal_name / email / residency_state_code alone, and bumps version once per accepted call."
        test_recipe:
          setup: ["One Artist created with the enum defaults (NON_MEMBER, tax_form_on_file false, payout_method CHECK, payout_hold false)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA" }, as: CallManager, captures: { a1_id: $.data.id, a1_v1: $.data.version } }
          trigger:
            - { call: "PATCH /artists/${a1_id}", payload: { member_status: "MEMBER", tax_form_on_file: true }, as: CallManager, captures: { a1_v2: $.data.version } }
            - { call: "PATCH /artists/${a1_id}", payload: { payout_hold: true, payout_method: "ACH" }, as: CallManager }
            - { call: "GET /artists/${a1_id}", payload: {}, as: FinanceOfficer }
          assert:
            - "at creation: member_status == NON_MEMBER, tax_form_on_file == false, payout_method == CHECK, payout_hold == false, version == 1"
            - "after the first patch: member_status == MEMBER, tax_form_on_file == true, payout_method still CHECK, version == 2"
            - "after the second patch: payout_hold == true, payout_method == ACH, member_status still MEMBER, version == 3"
            - "legal_name == Ana Ruiz, email == ana.ruiz@example.org and residency_state_code == CA are unchanged throughout"
            - "GET /artists/${a1_id} as FinanceOfficer returns the same row including unclaimed_forfeit_count == 0"

      - name: entry_fee_waiver_zeroes_the_fee_and_submits_the_entry
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /entries/{id}/fee-waiver]
          - state_machines.Entry.DRAFT_to_SUBMITTED
          - entities.Entry.fields.fee_waived
        distinguishing_aspect: "The waiver is the only path that reaches SUBMITTED without a payment: it sets fee_waived true with entry_fee_cents 0 and fee_paid_cents 0, stamps submitted_at from the logical clock and still runs the artwork cascade — and it is a CallManager operation, not an Artist one."
        test_recipe:
          setup: ["Exhibition OPEN_FOR_ENTRIES; MEMBER artist from CA with a DRAFT entry holding two works, each with one PRIMARY image; logical clock 2026-09-20T12:00:00Z."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA", member_status: "MEMBER", tax_form_on_file: true, payout_method: "ACH" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Ridge Line", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_a_id: $.data.id } }
            - { call: "POST /artworks/${aw_a_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "ea01" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Salt Flat", medium_category: "PHOTOGRAPHY", width_cm: 100, height_cm: 70, depth_cm: 4, weight_kg: 5, year_created: 2026, declared_value_cents: 300000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_b_id: $.data.id } }
            - { call: "POST /artworks/${aw_b_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-16T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "ea02" }, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T12:00:00Z" }, as: CallManager }
          trigger:
            - { call: "POST /entries/${e1_id}/fee-waiver", payload: {}, as: CallManager }
          assert:
            - "HTTP 200 with Entry.${e1_id}.status == SUBMITTED"
            - "Entry.${e1_id}.fee_waived == true, entry_fee_cents == 0, fee_paid_cents == 0"
            - "Entry.${e1_id}.submitted_at == 2026-09-20T12:00:00Z (the logical clock, not the creation time)"
            - "Artwork.${aw_a_id}.status == SUBMITTED and Artwork.${aw_b_id}.status == SUBMITTED"
            - "a subsequent POST /entries/${e1_id}/fee-payment with any amount returns ERR_ENTRY_STATE_INVALID"

      - name: scores_listing_composite_values_reconcile_with_the_provisional_mean
        claim_type: computed_read
        grounds:
          - endpoints[GET /scores]
          - calculations.composite_score
          - calculations.artwork_round_mean
          - entities.Artwork.fields.provisional_mean_score
        distinguishing_aspect: "The read surface must expose the same numbers the write path computed: the single Score row carries composite_score 7.85 from weights 0.4 / 0.35 / 0.25, expertise_match true, and the artwork's provisional_mean_score equals that value while the round is still OPEN."
        test_recipe:
          setup: ["Exhibition JURYING with one submitted PAINTING work; one CONFIRMED juror whose expertise includes PAINTING; round 1 OPEN and one score of 7 / 8 / 9 submitted inside the session window."]
