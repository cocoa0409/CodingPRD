        as_user_id: qi-1
      - call: POST /wheelsets/${w1}/evaluate
        payload:
          flange_thickness_mm: 28.0
          tread_wear_mm: 4.0
        as: QualityInspector
        as_user_id: qi-1
      - call: POST /wheelsets/${w2}/evaluate
