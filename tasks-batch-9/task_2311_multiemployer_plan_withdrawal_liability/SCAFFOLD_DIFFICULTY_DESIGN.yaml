            - "LiabilityAssessment.${la_b_id}.de_minimis_reduction_cents == 2999999"
            - "LiabilityAssessment.${la_b_id}.net_assessed_cents == 7000002"
            - "LiabilityAssessment.${la_a_id}.annual_payment_cents == 2500000 and LiabilityAssessment.${la_b_id}.annual_payment_cents == 2500000"
            - "LiabilityAssessment.${la_a_id}.de_minimis_variant_applied == STATUTORY"

      - name: seventy_percent_decline_inclusive_at_ratio_exactly_zero_point_three
        grounds:
          - calculations.seventy_percent_decline_test
          - calculations.partial_withdrawal_fraction
          - entities.WithdrawalEvent.fields.decline_ratio
          - state_machines.WithdrawalEvent.REPORTED_to_PARTIAL_DETERMINED
          - state_machines.WithdrawalEvent.REPORTED_to_NO_WITHDRAWAL
        distinguishing_aspect: |
          A different metric (a six-decimal CBU ratio, not a cents threshold) reached through a
          different endpoint (POST /withdrawal-events/{id}/determine): a decline_ratio of exactly
          0.300000 IS a seventy-percent decline and yields PARTIAL_70_DECLINE, while 0.300033 — one
          extra contribution base unit in 2024 — yields NONE.
        test_recipe:
          setup:
            - "Plan with industry GENERAL so the decline test is available; one CERTIFIED valuation for 2025 (the only year determination requires)."
            - "Employer A history: 2019..2020 20000 CBU total (10000 per year), 2021..2023 24000 CBU total (8000 per year), 2024..2026 9000 CBU total (3000 per year)."
            - "Employer B identical except the last record carries 9001 CBU, so 2024 gets the extra unit and the testing-period average becomes 3000.3333."
