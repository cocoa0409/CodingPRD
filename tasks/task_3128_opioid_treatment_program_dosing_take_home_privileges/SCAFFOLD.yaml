# =============================================================================
# PRD Benchmark Seed Tables — task_3128
# Domain: Opioid Treatment Program Dosing, Take-Home Privileges & Compliance
# Calibration: ULTRA-EXPERT (operator-directed "much harder than expert")
# =============================================================================

scenario: |
  Opioid Treatment Program Dosing, Take-Home Privileges & Compliance (BayMark Health Services): patient admission with diagnosis confirmation, history review and program registry checks to prevent dual enrollment, daily observed dosing schedules with dispensing controls, nurse verification and clinic hour constraints, take-home privilege determination against time-in-treatment and stability criteria with documented exceptions, medication inventory reconciliation with strict accounting of every dose dispensed, wasted or returned, counseling requirements and treatment plan review cadence, guest dosing arrangements when a patient travels with originating and receiving clinic coordination, transportation and access constraints affecting adherence for rural patients, regulatory inspection readiness and diversion control planning

domain_name: otp-dosing-take-home-compliance
api_prefix: /otp

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - selector_policy
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Clinic program name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of the clinic" }
      - { name: clinic_hours_start, type: string, source: input, description: "Local clinic open time, HH:MM 24h" }
      - { name: clinic_hours_end, type: string, source: input, description: "Local clinic close time, HH:MM 24h" }
      - { name: dose_checkin_grace_minutes, type: integer, source: input, default: 30, description: "Minutes past clinic_hours_end during which check-in is still accepted" }
      - { name: open_days, type: array, source: input, description: "ISO weekday abbreviations the clinic is open, subset of [MO,TU,WE,TH,FR,SA,SU]" }
      - { name: max_daily_dose_slots, type: integer, source: input, description: "Finite observed-dose capacity per open day" }
      - { name: max_daily_mg_methadone, type: number, source: input, default: 120, description: "Regulatory ceiling on a single day's methadone dose" }
      - { name: max_daily_mg_buprenorphine, type: number, source: input, default: 24, description: "Regulatory ceiling on a single day's buprenorphine dose" }
      - { name: guest_dosing_enabled, type: boolean, source: input, default: true, description: "Whether this program accepts inbound guest dosing" }
      - { name: posture, type: enum, source: system, default: NORMAL, description: "Dispensing posture gating all child operations: NORMAL | RESTRICTED | FROZEN" }
      - { name: posture_reason_code, type: enum, source: system, description: "Null while NORMAL; DIVERSION_CASE_OPEN | CRITICAL_CORRECTIVE_ACTION_OPEN | INVENTORY_VARIANCE_OVER_THRESHOLD while RESTRICTED; PROGRAM_SUSPENDED_BY_REGULATOR while FROZEN" }
      - { name: open_diversion_case_count, type: integer, source: computed, default: 0, description: "Count of DiversionCase rows for this program with status IN {OPEN, UNDER_REVIEW}" }
      - { name: open_critical_finding_count, type: integer, source: computed, default: 0, description: "Count of CorrectiveAction rows for this program with severity CRITICAL and status OPEN" }
      - { name: latest_inventory_variance_mg, type: number, source: computed, default: 0, description: "RECONCILED on-hand milligrams minus DELIVERED on-hand milligrams for this program; the period-close variance that the diversion variance rule reads" }
      - { name: pending_waste_mg, type: number, source: computed, default: 0, description: "Sum of wasted milligrams over InventoryTransaction rows of type WASTE for this program with status RECORDED" }
      - { name: cumulative_write_off_mg, type: number, source: computed, default: 0, description: "Running total of variance written off by ADJUSTMENT rows for this program, accumulated in created_at order; capped at 0 from below" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED. Suspension forces posture FROZEN" }

  # ---------------------------------------------------------------------------
  - name: CarryQuotaLedger
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: allotted_carries, type: integer, source: input, description: "Total take-home carry slots the program may have outstanding" }
      - { name: granted_carries, type: integer, source: computed, default: 0, description: "Sum of TakeHomePrivilege.approved_carries over this program's privilege rows with decision IN {APPROVED, APPROVED_WITH_EXCEPTION}" }
      - { name: released_carries, type: integer, source: computed, default: 0, description: "Running total of carry slots released by privilege revocation or reissue; a reporting field, NOT a term in the availability invariant" }
      - { name: available_carries, type: integer, source: computed, default: 0, description: "GLOBAL CONSERVED QUANTITY C1; must equal allotted_carries minus granted_carries at all times" }
      - { name: held_privilege_count, type: integer, source: computed, default: 0, description: "Count of this program's TakeHomePrivilege rows with decision PENDING_REVIEW" }

  # ---------------------------------------------------------------------------
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the admitting clinic" }
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date, YYYY-MM-DD" }
      - { name: government_id_hash, type: string, source: input, description: "Opaque hash of the government identifier; used verbatim as the registry dual-enrollment key together with date_of_birth" }
      - { name: diagnosis_code, type: enum, source: input, description: "ICD-10 opioid dependence code: F11_10 | F11_20 | F11_99" }
      - { name: diagnosis_confirmed, type: boolean, source: system, default: false, description: "Set true by the admitting physician; never client-supplied" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter state of residence; differing from the program state_code marks the patient a guest-only candidate" }
      - { name: home_address, type: string, source: input, description: "Street address of residence" }
      - { name: transportation_type, type: enum, source: input, description: "PRIVATE_VEHICLE | PUBLIC_TRANSIT | RIDE_SHARE | NO_RELIABLE_TRANSPORT" }
      - { name: one_way_travel_minutes, type: integer, source: input, description: "Deterministic one-way travel time to the admitting clinic, in minutes (no geocoding)" }
      - { name: status, type: enum, source: system, description: "PENDING_ADMISSION -> ADMITTED -> ACTIVE; arc ACTIVE -> SUSPENDED_NON_COMPLIANT -> ACTIVE; exits ADMITTED/ACTIVE -> ADMINISTRATIVELY_DISCHARGED or -> COMPLETED_WITHDRAWAL" }
      - { name: treatment_phase, type: enum, source: system, default: INDUCTION, description: "Independent phase dimension: INDUCTION | STABILIZATION | MAINTENANCE | MEDICAL_WITHDRAWAL" }
      - { name: counseling_standing, type: enum, source: system, default: CURRENT, description: "Parallel dimension driven by counseling and plan-review cadence: CURRENT | COUNSELING_DEFICIENT | REVIEW_OVERDUE" }
      - { name: diversion_standing, type: enum, source: system, default: CLEAR, description: "Parallel dimension driven by diversion cases: CLEAR | UNDER_INVESTIGATION | CONFIRMED_DIVERSION" }
      - { name: admission_datetime, type: datetime, source: system, description: "Set when the patient enters ADMITTED; null before" }
      - { name: time_in_treatment_days, type: computed, description: "Whole days from admission_datetime to the logical clock, floor-rounded; 0 while not yet admitted" }
      - { name: risk_tier, type: enum, source: computed, default: LOW, description: "LOW | MODERATE | HIGH cut from risk_score_points" }
      - { name: risk_score_points, type: number, source: computed, default: 0, description: "Weighted risk points that risk_tier is cut from; also the credit term in the stability posting" }
      - { name: stability_posting, type: integer, source: computed, default: 0, description: "Cached copy of stability_score, refreshed by the dual-variant channels; a stale copy is observable" }
      - { name: stability_score, type: computed, default: 50, description: "0..100 weighted stability score; DIRECTION_A_STABILITY published on patient reads, DIRECTION_B_TAKE_HOME_READINESS gates carries" }
      - { name: denial_count_12mo, type: computed, default: 0, description: "DoseDispense rows for this patient with status MISSED in the trailing 365 days at the logical clock" }
      - { name: missed_dose_streak, type: computed, default: 0, description: "Consecutive MISSED DoseDispense rows with no intervening COMPLETED row, counted oldest-created_at-first" }
      - { name: carries_used, type: computed, default: 0, description: "Total take-home carries consumed across all granted privileges for this patient" }
      - { name: journal_reconciled_through_date, type: string, source: system, description: "ISO date through which the regulated phase journal has been reconciled for this patient; set by PATCH /otp/patients/{patientId}/treatment-phase and read when a privilege's timetable_reconciled is recomputed" }

  # ---------------------------------------------------------------------------
  - name: DoseOrder
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id; denormalized from Patient.program_id at creation" }
      - { name: medication, type: enum, source: input, description: "METHADONE | BUPRENORPHINE" }
      - { name: ordered_daily_mg, type: number, source: input, description: "Clinically ordered daily milligrams" }
      - { name: medication_ceiling_mg, type: number, source: system, description: "Program max_daily_mg_methadone or max_daily_mg_buprenorphine snapshotted at creation" }
      - { name: split_dose_authorized, type: boolean, source: input, default: false, description: "When true the ordered_daily_mg split-tariff applies instead of the single-tariff" }
      - { name: previous_ordered_daily_mg, type: number, source: system, default: 0, description: "Ordered milligrams in force immediately before the most recent increase or decrease; the titration ceiling is read from this value" }
      - { name: phase_at_authorization, type: enum, source: system, description: "Patient.treatment_phase snapshotted when the order is activated" }
      - { name: last_increase_date, type: string, source: system, description: "ISO date of the most recent ordered_daily_mg increase; null if never increased" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | DISCONTINUED" }

  # ---------------------------------------------------------------------------
  - name: DoseDispense
    parent: DoseOrder
    common_fields: true
    fields:
      - { name: dose_order_id, type: string, source: system, description: "FK -> DoseOrder.id" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: dose_date, type: string, source: input, description: "ISO date this dose is scheduled for" }
      - { name: scheduled_datetime, type: datetime, source: input, description: "ISO 8601 UTC instant the dose is scheduled at; must fall inside the program's open-day clinic window" }
      - { name: source_type, type: enum, source: input, default: OBSERVED_CLINIC, description: "OBSERVED_CLINIC | TAKE_HOME_ISSUANCE | GUEST_OBSERVED" }
      - { name: ordered_mg, type: number, source: system, description: "Snapshot of DoseOrder.ordered_daily_mg and its ceiling tariff for this dose date" }
      - { name: dispensed_mg, type: number, source: input, default: 0, description: "Milligrams actually drawn and offered to the patient" }
      - { name: wasted_mg, type: number, source: input, default: 0, description: "Milligrams poured off and destroyed in front of a witness" }
      - { name: returned_mg, type: number, source: input, default: 0, description: "Milligrams returned to the sealed inventory" }
      - { name: carry_count, type: integer, source: computed, default: 0, description: "Take-home carries consumed by this dose; 1 for source_type TAKE_HOME_ISSUANCE, else 0" }
      - { name: carries_before, type: integer, source: computed, default: 0, description: "TakeHomeCarryLedger.carries_used snapshotted at dispense time — the restored value when carries are voided" }
      - { name: carries_after, type: integer, source: computed, default: 0, description: "carries_before + carry_count" }
      - { name: verification_result, type: enum, source: system, description: "Null before verification; PASSED or FAILED after" }
      - { name: inventory_lot_id, type: string, source: input, description: "FK -> InventoryLot.id; the lot the milligrams are drawn from" }
      - { name: witness_staff_id, type: string, source: input, description: "Opaque staff identifier of the second staff member who witnessed the waste" }
      - { name: verification_staff_id, type: string, source: system, description: "Opaque staff identifier of the verifying nurse (from X-User-ID)" }
      - { name: arrived_at, type: datetime, source: system, description: "Set at check-in; null before" }
      - { name: completed_at, type: datetime, source: system, description: "Set at terminal transition; null before" }
      - { name: guest_arrangement_id, type: string, source: input, description: "FK -> GuestDosingArrangement.id; required when source_type == GUEST_OBSERVED, null otherwise" }
      - { name: privilege_id, type: string, source: input, description: "FK -> TakeHomePrivilege.id; required when source_type == TAKE_HOME_ISSUANCE, null otherwise" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ARRIVED_AT_CLINIC | NURSE_VERIFIED | DISPENSED | COMPLETED | VERIFICATION_FAILED | REFUSED | MISSED | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: TakeHomePrivilege
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: requested_carries, type: integer, source: input, description: "Take-home doses requested by the patient" }
      - { name: carry_interval_days, type: integer, source: input, description: "Days between mandatory clinic returns; 1..28" }
      - { name: approved_carries, type: integer, source: system, default: 0, description: "Carries the program granted after the cap waterfall" }
      - { name: freed_carries, type: integer, source: system, default: 0, description: "Carry quota released back to the program pool by revoke or reissue" }
      - { name: expires_on, type: string, source: system, description: "Withdrawal-report expiration date; null while PENDING_REVIEW, stamped as of approval" }
      - { name: decision, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | APPROVED_WITH_EXCEPTION | DENIED | REVOKED" }
      - { name: denial_reason_code, type: enum, source: system, description: "TIME_IN_TREATMENT_INSUFFICIENT | STABILITY_BELOW_THRESHOLD | ACTIVE_DENIAL_HISTORY | TIMETABLE_LOOKAHEAD_FAILED | CLINIC_MAX_CARRIES_EXCEEDED | SUPERVISOR_REVIEW_REQUIRED | TRANSPORTATION_RISK_UNMITIGATED | DIVERSIONS_OR_FINDINGS_OPEN | PROGRAM_POSTURE_RESTRICTED" }
      - { name: exception_id, type: string, source: system, description: "FK -> TakeHomeException.id; set when a DENIED decision is superseded by a granted exception" }
      - { name: evaluation_basis, type: enum, source: system, description: "TIME_IN_TREATMENT | PHASE_STABILITY — which of the two carry tables the evaluation read" }
      - { name: timetable_reconciled, type: boolean, source: computed, default: false, description: "True when Patient.journal_reconciled_through_date is on or after the dose date of the day immediately before evaluation" }
      - { name: eligible_carry_cap, type: integer, source: computed, default: 0, description: "Carry count the applicable time-in-treatment or phase-stability table allows before the program pool cap is applied" }
      - { name: reissued_from_privilege_id, type: string, source: input, description: "FK -> TakeHomePrivilege.id; set when this privilege replaces a revoked one" }
      - { name: hold_ledger_delta, type: integer, source: system, default: 0, description: "Signed change this privilege made to the carry ledger: -1 on hold, +1 on approve, 0 on deny, +1 on revoke, -1 on reissue approval" }

  # ---------------------------------------------------------------------------
  - name: TakeHomeException
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: requested_carries, type: integer, source: input, description: "Carries requested under the exception" }
      - { name: exception_type, type: enum, source: input, description: "TIME_IN_TREATMENT_WAIVER | TRAVEL_HARDSHIP | CLINIC_CLOSURE | EMERGENCY" }
      - { name: clinical_justification, type: string, source: input, description: "Free-text justification; at least 40 characters" }
      - { name: requesting_physician_id, type: string, source: input, description: "FK -> User.id; the physician who signs the exception request" }
      - { name: supervisor_id, type: string, source: input, description: "FK -> User.id; the medical director who reviews it; MUST differ from requesting_physician_id" }
      - { name: granted_carries, type: integer, source: system, default: 0, description: "Carries the medical director granted; at most the applicable carry-table cap for the patient's time-in-treatment" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SUPERVISOR_REVIEW | GRANTED | DENIED | REVOKED" }
      - { name: evaluated_domain_b, type: boolean, source: computed, default: false, description: "True when the granting physician's DIRECTION_B_TAKE_HOME_READINESS score cleared the applicable stability floor" }

  # ---------------------------------------------------------------------------
  - name: TakeHomeCarryLedger
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: owns_privilege_count, type: integer, source: computed, default: 0, description: "Count of TakeHomePrivilege rows for this patient with decision IN {APPROVED, APPROVED_WITH_EXCEPTION}" }
      - { name: carries_used, type: integer, source: computed, default: 0, description: "Sum of privilege carries consumed, minus carries restored by revocation" }
      - { name: carry_variance, type: integer, source: computed, default: 0, description: "GLOBAL CONSERVED QUANTITY C1; must stay 0 across every privilege and exception action" }
      - { name: carried_balance_mg, type: number, source: computed, default: 0, description: "GLOBAL CONSERVED QUANTITY C2; carries the identity carried_issued_mg - carried_voided_mg - carried_dispensed_mg - carried_consumed_mg and must stay 0.0 across every take-home dispense, waste, return and privilege void" }
      - { name: carried_issued_mg, type: number, source: computed, default: 0, description: "Sum of ordered_mg on take-home dose rows ever created for this patient" }
      - { name: carried_dispensed_mg, type: number, source: computed, default: 0, description: "Sum of dispensed_mg over COMPLETED take-home dose rows" }
      - { name: carried_voided_mg, type: number, source: computed, default: 0, description: "Sum of ordered_mg over take-home dose rows cancelled because their privilege was revoked before the dose completed" }
      - { name: carried_consumed_mg, type: number, source: computed, default: 0, description: "Sum of (wasted_mg + returned_mg) over COMPLETED take-home dose rows — the portion of the drawn milligrams poured off or put back rather than swallowed" }
      - { name: carries_held, type: integer, source: computed, default: 0, description: "Count of APPENDED outstanding holds awaiting a system posting" }
      - { name: charges_held, type: integer, source: computed, default: 0, description: "GLOBAL CONSERVED QUANTITY C1 left-hand term: sum of TakeHomePrivilege.hold_ledger_delta over rows with decision PENDING_REVIEW" }

  # ---------------------------------------------------------------------------
  - name: InventoryLot
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: medication, type: enum, source: input, description: "METHADONE | BUPRENORPHINE" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number; unique within the program and medication" }
      - { name: expiration_date, type: string, source: input, description: "ISO date the lot expires; exclusive — unusable on and after this date" }
      - { name: quantity_received_mg, type: number, source: input, description: "Milligrams received into the lot" }
      - { name: dose_potency_mg_per_unit, type: number, source: input, default: 1.0, description: "Milligrams of active drug per dispensed unit" }
      - { name: reusable_for_take_home, type: boolean, source: input, default: false, description: "When true, take-home doses for this program may only draw from this lot" }
      - { name: running_on_hand_mg, type: number, source: computed, default: 0, description: "quantity_received_mg plus the sum of InventoryTransaction.quantity_mg over RECORDED and RECONCILED rows, accumulated in transaction created_at order" }
      - { name: on_hand_mg, type: number, source: computed, default: 0, description: "Read alias of running_on_hand_mg" }
      - { name: is_expired, type: boolean, source: computed, default: false, description: "True when the logical clock's date is on or after expiration_date" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_USE | DEPLETED | QUARANTINED | DESTROYED" }

  # ---------------------------------------------------------------------------
  - name: InventoryTransaction
    parent: InventoryLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; null for program-level movements such as RECEIPT and DESTRUCTION" }
      - { name: dose_dispense_id, type: string, source: input, description: "FK -> DoseDispense.id; null for program-level movements" }
      - { name: transaction_type, type: enum, source: input, description: "RECEIPT | DISPENSE | WASTE | RETURN | ADJUSTMENT | DESTRUCTION" }
      - { name: quantity_mg, type: number, source: input, description: "Signed milligrams; positive for RECEIPT and RETURN; negative for DISPENSE, WASTE, DESTRUCTION and negative ADJUSTMENT; ADJUSTMENT may be positive" }
      - { name: reconciliation_period, type: string, source: system, description: "YYYY-MM derived from the logical clock at recording time" }
      - { name: witness_staff_id, type: string, source: input, description: "Opaque staff id required for WASTE and DESTRUCTION movements" }
      - { name: residual_variance_mg, type: number, source: computed, default: 0, description: "For an ADJUSTMENT row, the delivered-balance variance being written off toward the program's cumulative floor" }
      - { name: cumulative_write_off_mg, type: number, source: computed, default: 0, description: "Running write-off total after this row, accumulated in created_at order" }
      - { name: status, type: enum, source: system, description: "RECORDED | RECONCILED | FLAGGED | VOIDED" }

  # ---------------------------------------------------------------------------
  - name: CounselingSession
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: session_type, type: enum, source: input, description: "INDIVIDUAL | GROUP | FAMILY" }
      - { name: scheduled_datetime, type: datetime, source: input, description: "ISO 8601 UTC instant the session is scheduled at" }
      - { name: duration_minutes, type: integer, source: input, description: "Contracted session length in minutes" }
      - { name: counselor_staff_id, type: string, source: input, description: "Opaque staff identifier of the counselor" }
      - { name: completed_at, type: datetime, source: system, description: "Set on completion; null before" }
      - { name: attended_minutes, type: integer, source: computed, default: 0, description: "Minutes credited toward the weekly cadence; at most duration_minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: TreatmentPlanReview
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: reviewer_physician_id, type: string, source: input, description: "FK -> User.id; the physician who signs the review" }
      - { name: reviewed_at, type: datetime, source: input, description: "ISO 8601 UTC instant of review" }
      - { name: cadence_days_applied, type: integer, source: computed, default: 0, description: "Cadence in days that was in force at reviewed_at, selected by the patient's treatment_phase" }
      - { name: next_due_at, type: datetime, source: system, description: "reviewed_at + cadence_days_applied; drives counseling_standing REVIEW_OVERDUE" }
      - { name: signed_off, type: boolean, source: input, default: true, description: "Whether the reviewing physician signed the plan" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | VOIDED" }

  # ---------------------------------------------------------------------------
  - name: GuestDosingArrangement
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; the travelling patient" }
      - { name: originating_program_id, type: string, source: input, description: "FK -> Program.id; the home clinic the patient is registered at" }
      - { name: receiving_program_id, type: string, source: input, description: "FK -> Program.id; the clinic the patient will dose at while travelling" }
      - { name: travel_start_date, type: string, source: input, description: "ISO date the guest window opens, inclusive" }
      - { name: travel_end_date, type: string, source: input, description: "ISO date the guest window closes, inclusive" }
      - { name: dose_authorization_token, type: string, source: system, description: "Server-issued one-time token the receiving clinic redeems to record a GUEST_OBSERVED dose" }
      - { name: authorized_mg, type: number, source: system, description: "Milligrams per day the receiving clinic is authorized to dispense" }
      - { name: token_consumed, type: boolean, source: system, default: false, description: "True once a GUEST_OBSERVED dose has been recorded against this arrangement" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_RECEIVING_ACK | ACTIVE | COMPLETED | REJECTED | CANCELLED" }
      - { name: receiving_acknowledged_at, type: datetime, source: system, description: "Set when the receiving clinic acknowledges; null before" }

  # ---------------------------------------------------------------------------
  - name: ComplianceInspection
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: inspecting_agency, type: string, source: input, description: "Name of the inspecting authority" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date the inspection is announced for" }
      - { name: inspection_type, type: enum, source: input, description: "ROUTINE | COMPLAINT_DRIVEN | DIVERSION_FOCUSED" }
      - { name: readiness_score, type: number, source: computed, default: 0, description: "Weighted inspection-readiness score computed over the program's live dossier state" }
      - { name: readiness_tier, type: enum, source: computed, description: "READY | NEEDS_ATTENTION | NOT_READY cut from readiness_score" }
      - { name: finding_count, type: computed, default: 0, description: "Count of ComplianceFinding rows created against this inspection" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: ComplianceFinding
    parent: ComplianceInspection
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: system, description: "FK -> ComplianceInspection.id" }
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: requirement_code, type: enum, source: input, description: "DOSING_LOG_COMPLETE | WASTE_WITNESSED | COUNSELING_CADENCE_MET | PLAN_REVIEW_CURRENT | INVENTORY_RECONCILED | DUAL_ENROLLMENT_SCREENED" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: status, type: enum, source: system, description: "OPEN | CORRECTED | WAIVED" }
      - { name: corrected_at, type: datetime, source: system, description: "Set when the finding is corrected; null before" }

  # ---------------------------------------------------------------------------
  - name: CorrectiveAction
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: finding_id, type: string, source: input, description: "FK -> ComplianceFinding.id; null for self-initiated corrective actions" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: plan_text, type: string, source: input, description: "Corrective action plan, at least 20 characters" }
      - { name: due_date, type: string, source: input, description: "ISO date the action must be closed by" }
      - { name: status, type: enum, source: system, description: "OPEN | IMPLEMENTED | VERIFIED_CLOSED | CANCELED" }

  # ---------------------------------------------------------------------------
  - name: DiversionCase
    parent: Program
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the patient under investigation" }
      - { name: related_dose_dispense_id, type: string, source: input, description: "FK -> DoseDispense.id; the dose that raised the case" }
      - { name: opened_by_user_id, type: string, source: input, description: "FK -> User.id; the staff member who opened the case" }
      - { name: detection_source, type: enum, source: input, description: "COUNT_MISMATCH | URINE_SCREEN | WITNESS_REPORT | GUEST_CLINIC_REPORT" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | CONFIRMED | UNSUBSTANTIATED | CLOSED" }
      - { name: confirmed_at, type: datetime, source: system, description: "Set when the case is confirmed; null before" }
      - { name: outcome_summary, type: string, source: input, description: "Summary supporting the disposition" }

  # ---------------------------------------------------------------------------
  - name: User
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program the staff member works at; null for regulator accounts" }
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: staff_role, type: enum, source: input, description: "PHYSICIAN | NURSE | COUNSELOR | MEDICAL_DIRECTOR | PROGRAM_ADMIN | REGULATOR" }
      - { name: license_number, type: string, source: input, description: "Professional license number; required for PHYSICIAN, NURSE and MEDICAL_DIRECTOR" }
      - { name: is_active, type: boolean, source: system, default: true, description: "Deactivation keeps historical references resolvable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Program: posture_driven (B) ------------------------------------------
  - entity: Program
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "system (automatic when 1..2 diversion cases are OPEN or UNDER_REVIEW)"
        actor: system
        preconditions:
          - "Program.status == ACTIVE"
          - "open_diversion_case_count IN {1, 2} AND open_critical_finding_count == 0 AND latest_inventory_variance_mg <= INVENTORY_VARIANCE_RESTRICTED_MG (500)"
        side_effects:
          - "Program.posture := RESTRICTED and posture_reason_code := DIVERSION_CASE_OPEN when open_diversion_case_count >= 1"
          - "Program.posture := RESTRICTED and posture_reason_code := CRITICAL_CORRECTIVE_ACTION_OPEN when open_diversion_case_count == 0 and open_critical_finding_count >= 1"
          - "Program.posture := RESTRICTED and posture_reason_code := INVENTORY_VARIANCE_OVER_THRESHOLD when the two conditions above both fail and latest_inventory_variance_mg > 500"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /otp/programs/{id}/suspend"
        actor: RegulatoryAuditor
        preconditions:
          - "Program not already SUSPENDED (ERR_PROGRAM_ALREADY_SUSPENDED)"
        side_effects:
          - "Program.posture := FROZEN and posture_reason_code := PROGRAM_SUSPENDED_BY_REGULATOR"
          - "Every DoseDispense row for this program with status IN {SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED} → CANCELLED"
          - "Every TakeHomePrivilege row for this program with decision == PENDING_REVIEW and timetable_reconciled == true → DENIED with denial_reason_code PROGRAM_POSTURE_RESTRICTED, and its hold_ledger_delta := 0"
          - "Every GuestDosingArrangement row with receiving_program_id == this program and status IN {PENDING_RECEIVING_ACK, ACTIVE} → CANCELLED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /otp/programs/{id}/resume"
        actor: RegulatoryAuditor
        preconditions:
          - "Program.status == SUSPENDED (ERR_PROGRAM_NOT_SUSPENDED)"
        side_effects:
          - "Program.posture := NORMAL and posture_reason_code := null"
          - "Program.open_diversion_case_count recomputed; if >= 1, posture is immediately recomputed to RESTRICTED by the posture ladder"

  # --- Patient: branching with revert arcs; parallel dimensions (A) ----------
  - entity: Patient
    initial_state: PENDING_ADMISSION
    terminal_states: [ADMINISTRATIVELY_DISCHARGED, COMPLETED_WITHDRAWAL]
    transitions:
      - from: PENDING_ADMISSION
        to: ADMITTED
        trigger: "POST /otp/patients/{patientId}/confirm-diagnosis"
        actor: Physician
        preconditions:
          - "Patient.status == PENDING_ADMISSION (ERR_PATIENT_NOT_PENDING_ADMISSION)"
          - "Patient.diagnosis_code in the ICD-10 F11 block (ERR_INVALID_DIAGNOSIS_CODE)"
          - "Acting Physician.program_id == Patient.program_id (ERR_PHYSICIAN_NOT_IN_PROGRAM)"
          - "No open DiversionCase references this patient (ERR_PATIENT_FLAGGED_FOR_DIVERSION)"
          - "The TimeInTreatmentTracker row for patient_id == Patient.id has dual_enrollment_flag == false (ERR_DUAL_ENROLLMENT_DETECTED)"
          - "Program.posture == NORMAL (ERR_PROGRAM_OPERATIONALLY_BLOCKED)"
        side_effects:
          - "Patient.diagnosis_confirmed := true"
          - "Patient.admission_datetime := logical clock"
          - "Patient.time_in_treatment_days := 0"
          - "Patient.stability_score recomputed by DIRECTION_A_STABILITY (admission term)"
          - "Patient.stability_posting := DIRECTION_A_STABILITY value"

      - from: ADMITTED
        to: ACTIVE
        trigger: "POST /otp/dose-orders/{doseOrderId}/activate"
        actor: Physician
        preconditions:
          - "DoseOrder.status == DRAFT (ERR_DOSE_ORDER_NOT_DRAFT)"
          - "Patient.status == ADMITTED (ERR_PATIENT_NOT_ADMITTED)"
          - "DoseOrder.ordered_daily_mg <= DoseOrder.medication_ceiling_mg (ERR_DOSE_EXCEEDS_MEDICATION_CEILING)"
          - "DoseOrder.ordered_daily_mg <= DoseOrder.previous_ordered_daily_mg + 10.0 (ERR_DOSE_TITRATION_TOO_FAST)"
          - "Program.posture == NORMAL (ERR_PROGRAM_OPERATIONALLY_BLOCKED)"
        side_effects:
          - "Patient.status := ACTIVE"
          - "DoseOrder.status := ACTIVE; DoseOrder.phase_at_authorization := Patient.treatment_phase"
          - "Patient.stability_score recomputed by DIRECTION_A_STABILITY (activation term)"

      - from: ACTIVE
        to: SUSPENDED_NON_COMPLIANT
        trigger: "system (automatic when missed_dose_streak >= 3)"
        actor: system
        preconditions:
          - "Patient.status == ACTIVE"
          - "Patient.missed_dose_streak >= 3"
        side_effects:
          - "Every DoseDispense row for this patient with status IN {SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED} → CANCELLED"
          - "Every TakeHomePrivilege row for this patient with decision IN {APPROVED, APPROVED_WITH_EXCEPTION} → REVOKED and freed_carries := approved_carries"
          - "Every TakeHomePrivilege row for this patient with decision == PENDING_REVIEW and timetable_reconciled == true → DENIED with denial_reason_code ACTIVE_DENIAL_HISTORY and hold_ledger_delta := 0"
          - "Every take-home DoseDispense row for this patient with status SCHEDULED → CANCELLED"
          - "TakeHomeCarryLedger.carried_voided_mg += sum of ordered_mg over the cancelled take-home dose rows"
          - "Patient.stability_score recomputed by DIRECTION_B_TAKE_HOME_READINESS; stability_posting := that value"
          - "Patient.risk_score_points += MISSED_STREAK_PENALTY * missed_dose_streak; risk_tier recut"

      - from: SUSPENDED_NON_COMPLIANT
        to: ACTIVE
        trigger: "POST /otp/patients/{patientId}/reinstate"
        actor: MedicalDirector
        preconditions:
          - "Patient.status == SUSPENDED_NON_COMPLIANT (ERR_PATIENT_NOT_SUSPENDED)"
          - "Patient.missed_dose_streak < 3 (ERR_REINSTATEMENT_DENIAL_STREAK)"
          - "Patient.counseling_standing != COUNSELING_DEFICIENT (ERR_COUNSELING_CADENCE_BREACHED)"
          - "Program.posture != FROZEN (ERR_PROGRAM_OPERATIONALLY_BLOCKED)"
        side_effects:
          - "Patient.status := ACTIVE"
          - "Patient.risk_score_points += 5.0; risk_tier recut"
          - "Patient.treatment_phase := INDUCTION (reset)"
          - "Patient.stability_score recomputed by DIRECTION_A_STABILITY; stability_posting := that value"

      - from: ADMITTED
        to: ADMINISTRATIVELY_DISCHARGED
        trigger: "POST /otp/patients/{patientId}/discharge"
        actor: Physician
        preconditions:
          - "Patient.status in {ADMITTED, ACTIVE, SUSPENDED_NON_COMPLIANT} (ERR_PATIENT_NOT_DISCHARGEABLE)"
          - "Reason code must be one of TRANSFER | REGULATORY | NON_PAYMENT | BEHAVIORAL (ERR_INVALID_DISCHARGE_REASON)"
        side_effects:
          - "DoseOrder rows for this patient with status ACTIVE → DISCONTINUED"
          - "DoseDispense rows for this patient with status IN {SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED} → CANCELLED"
          - "TakeHomePrivilege rows for this patient with decision IN {APPROVED, APPROVED_WITH_EXCEPTION} → REVOKED; freed_carries := approved_carries"
          - "GuestDosingArrangement rows for this patient with status IN {DRAFT, PENDING_RECEIVING_ACK, ACTIVE} → CANCELLED"

      - from: ACTIVE
        to: ADMINISTRATIVELY_DISCHARGED
        trigger: "POST /otp/patients/{patientId}/discharge"
        actor: Physician
        preconditions:
          - "Patient.status in {ADMITTED, ACTIVE, SUSPENDED_NON_COMPLIANT} (ERR_PATIENT_NOT_DISCHARGEABLE)"
          - "Reason code must be one of TRANSFER | REGULATORY | NON_PAYMENT | BEHAVIORAL (ERR_INVALID_DISCHARGE_REASON)"
        side_effects:
          - "DoseOrder rows for this patient with status ACTIVE → DISCONTINUED"
          - "DoseDispense rows for this patient with status IN {SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED} → CANCELLED"
          - "TakeHomePrivilege rows for this patient with decision IN {APPROVED, APPROVED_WITH_EXCEPTION} → REVOKED; freed_carries := approved_carries"
          - "GuestDosingArrangement rows for this patient with status IN {DRAFT, PENDING_RECEIVING_ACK, ACTIVE} → CANCELLED"

      - from: SUSPENDED_NON_COMPLIANT
        to: ADMINISTRATIVELY_DISCHARGED
        trigger: "POST /otp/patients/{patientId}/discharge"
        actor: Physician
        preconditions:
          - "Patient.status in {ADMITTED, ACTIVE, SUSPENDED_NON_COMPLIANT} (ERR_PATIENT_NOT_DISCHARGEABLE)"
          - "Reason code must be one of TRANSFER | REGULATORY | NON_PAYMENT | BEHAVIORAL (ERR_INVALID_DISCHARGE_REASON)"
        side_effects:
          - "DoseOrder rows for this patient with status ACTIVE → DISCONTINUED"
          - "DoseDispense rows for this patient with status IN {SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED} → CANCELLED"
          - "TakeHomePrivilege rows for this patient with decision IN {APPROVED, APPROVED_WITH_EXCEPTION} → REVOKED; freed_carries := approved_carries"
          - "GuestDosingArrangement rows for this patient with status IN {DRAFT, PENDING_RECEIVING_ACK, ACTIVE} → CANCELLED"

      - from: ACTIVE
        to: COMPLETED_WITHDRAWAL
        trigger: "POST /otp/patients/{patientId}/complete-withdrawal"
        actor: MedicalDirector
        preconditions:
          - "Patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE)"
          - "Patient.treatment_phase == MEDICAL_WITHDRAWAL (ERR_NOT_IN_WITHDRAWAL_PHASE)"
          - "No DoseDispense row for this patient with status IN {SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED} (ERR_OPEN_DOSES_REMAIN)"
        side_effects:
          - "DoseOrder rows for this patient with status ACTIVE → DISCONTINUED"
          - "TakeHomePrivilege rows for this patient with decision IN {APPROVED, APPROVED_WITH_EXCEPTION} → REVOKED; freed_carries := approved_carries"

  # --- DoseOrder ------------------------------------------------------------
  - entity: DoseOrder
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /otp/dose-orders/{doseOrderId}/activate"
        actor: Physician
        preconditions:
          - "DoseOrder.status == DRAFT (ERR_DOSE_ORDER_NOT_DRAFT)"
          - "DoseOrder.ordered_daily_mg <= DoseOrder.medication_ceiling_mg (ERR_DOSE_EXCEEDS_MEDICATION_CEILING)"
        side_effects:
          - "DoseOrder.phase_at_authorization := Patient.treatment_phase"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /otp/dose-orders/{doseOrderId}/suspend"
        actor: Physician
        preconditions:
          - "DoseOrder.status == ACTIVE (ERR_DOSE_ORDER_NOT_ACTIVE)"
        side_effects:
          - "DoseDispense rows for this order with status SCHEDULED → CANCELLED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /otp/dose-orders/{doseOrderId}/activate"
        actor: Physician
        preconditions:
          - "DoseOrder.status == SUSPENDED (ERR_DOSE_ORDER_NOT_DRAFT)"
          - "Program.posture == NORMAL (ERR_PROGRAM_OPERATIONALLY_BLOCKED)"
        side_effects:
          - "DoseOrder.phase_at_authorization := Patient.treatment_phase"

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /otp/dose-orders/{doseOrderId}/discontinue"
        actor: Physician
        preconditions:
          - "DoseOrder.status in {DRAFT, ACTIVE, SUSPENDED} (ERR_DOSE_ORDER_NOT_DISCONTINUABLE)"
        side_effects:
          - "DoseDispense rows for this order with status SCHEDULED → CANCELLED"

  # --- DoseDispense: fork-join (D) -----------------------------------------
  - entity: DoseDispense
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, VERIFICATION_FAILED, REFUSED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED_AT_CLINIC
        trigger: "POST /otp/dose-dispenses/{doseId}/check-in"
        actor: Nurse
        preconditions:
          - "DoseDispense.status == SCHEDULED (ERR_DOSE_NOT_SCHEDULED)"
          - "DoseDispense.source_type != TAKE_HOME_ISSUANCE (ERR_TAKE_HOME_NOT_CHECKED_IN)"
          - "Acting Nurse.program_id == DoseDispense.program_id (ERR_NURSE_NOT_IN_PROGRAM)"
          - "Logical clock instant <= the program's open-day window end plus dose_checkin_grace_minutes (ERR_OUTSIDE_CLINIC_HOURS)"
          - "Program.posture != FROZEN (ERR_PROGRAM_OPERATIONALLY_BLOCKED)"
        side_effects:
          - "DoseDispense.arrived_at := logical clock"

      - from: ARRIVED_AT_CLINIC
        to: NURSE_VERIFIED
        trigger: "POST /otp/dose-dispenses/{doseId}/verify"
        actor: Nurse
        preconditions:
          - "DoseDispense.status == ARRIVED_AT_CLINIC (ERR_DOSE_NOT_ARRIVED)"
          - "Acting Nurse.program_id == DoseDispense.program_id (ERR_NURSE_NOT_IN_PROGRAM)"
          - "Patient.status IN {ACTIVE, ADMITTED, SUSPENDED_NON_COMPLIANT} (ERR_PATIENT_NOT_DOSABLE)"
          - "DoseDispense.ordered_mg == DoseOrder.ordered_daily_mg snapshot (ERR_DOSE_ORDER_CHANGED) — the frozen order must still be authoritative"
        side_effects:
          - "DoseDispense.verification_result := PASSED"

      - from: ARRIVED_AT_CLINIC
        to: VERIFICATION_FAILED
        trigger: "POST /otp/dose-dispenses/{doseId}/verify with identity_matched = false"
        actor: Nurse
        preconditions:
          - "DoseDispense.status == ARRIVED_AT_CLINIC (ERR_DOSE_NOT_ARRIVED)"
        side_effects:
          - "DoseDispense.verification_result := FAILED"
          - "Patient.counseling_standing unchanged; Patient.risk_score_points unchanged"

      - from: NURSE_VERIFIED
        to: DISPENSED
        trigger: "POST /otp/dose-dispenses/{doseId}/dispense"
        actor: Nurse
        preconditions:
          - "DoseDispense.status == NURSE_VERIFIED (ERR_DOSE_NOT_VERIFIED)"
          - "DoseDispense.dispensed_mg + wasted_mg + returned_mg == DoseDispense.ordered_mg (ERR_DOSE_MASS_MISMATCH)"
          - "DoseDispense.wasted_mg > 0 implies witness_staff_id present and != acting nurse's X-User-ID (ERR_WITNESS_REQUIRED)"
          - "An InventoryLot for the program matches DoseDispense.source_type per the lot selector and is neither expired nor DEPLETED (ERR_NO_ELIGIBLE_LOT)"
          - "Program.posture == NORMAL (ERR_PROGRAM_OPERATIONALLY_BLOCKED)"
        side_effects:
          - "InventoryTransaction row appended: transaction_type DISPENSE, quantity_mg := -(DoseDispense.dispensed_mg), lot_id := the selected lot"
          - "InventoryTransaction row appended when wasted_mg > 0: transaction_type WASTE, quantity_mg := -(DoseDispense.wasted_mg)"
          - "InventoryTransaction row appended when returned_mg > 0: transaction_type RETURN, quantity_mg := +DoseDispense.returned_mg"
          - "InventoryLot.running_on_hand_mg recomputed in transaction created_at order"
          - "For source_type TAKE_HOME_ISSUANCE: TakeHomeCarryLedger.carries_used := carries_after"

      - from: DISPENSED
        to: COMPLETED
        trigger: "POST /otp/dose-dispenses/{doseId}/complete"
        actor: Nurse
        preconditions:
          - "DoseDispense.status == DISPENSED (ERR_DOSE_NOT_DISPENSED)"
        side_effects:
          - "DoseDispense.completed_at := logical clock"
          - "TakeHomeCarryLedger.carried_dispensed_mg and carried_consumed_mg recomputed; carried_balance_mg := carried_issued_mg - carried_voided_mg - carried_dispensed_mg - carried_consumed_mg"
          - "Patient.stability_score recomputed by DIRECTION_A_STABILITY (completion credit)"

      - from: SCHEDULED
        to: MISSED
        trigger: "system (automatic when the dose_date has ended and the dose is still SCHEDULED)"
        actor: system
        preconditions:
          - "DoseDispense.status == SCHEDULED"
          - "Logical clock date > DoseDispense.dose_date"
          - "Patient.status IN {ADMITTED, ACTIVE, SUSPENDED_NON_COMPLIANT}"
        side_effects:
          - "Patient.denial_count_12mo recomputed (trailing 365 days at the logical clock)"
          - "Patient.missed_dose_streak := (previous streak) + 1"
          - "Patient.stability_score recomputed by DIRECTION_B_TAKE_HOME_READINESS; stability_posting := that value"
          - "For every TakeHomePrivilege row of this patient with decision PENDING_REVIEW: timetable_reconciled := (Patient.journal_reconciled_through_date >= dose_date - 1 day)"
          - "When the recomputed missed_dose_streak >= 3 the Patient transition ACTIVE -> SUSPENDED_NON_COMPLIANT fires (second hop of cascade R9)"
          - "DoseOrder rows for this patient with status ACTIVE → SUSPENDED when missed_dose_streak >= 3"

      - from: ARRIVED_AT_CLINIC
        to: REFUSED
        trigger: "POST /otp/dose-dispenses/{doseId}/refuse"
        actor: Nurse
        preconditions:
          - "DoseDispense.status in {ARRIVED_AT_CLINIC, NURSE_VERIFIED} (ERR_DOSE_NOT_REFUSABLE)"
        side_effects:
          - "DoseDispense.completed_at := logical clock"

      - from: NURSE_VERIFIED
        to: REFUSED
        trigger: "POST /otp/dose-dispenses/{doseId}/refuse"
        actor: Nurse
        preconditions:
          - "DoseDispense.status in {ARRIVED_AT_CLINIC, NURSE_VERIFIED} (ERR_DOSE_NOT_REFUSABLE)"
        side_effects:
          - "DoseDispense.completed_at := logical clock"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /otp/dose-dispenses/{doseId}/cancel"
        actor: Nurse
        preconditions:
          - "DoseDispense.status in {SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED} (ERR_DOSE_NOT_CANCELLABLE)"
        side_effects:
          - "DoseDispense.completed_at := logical clock"

      - from: ARRIVED_AT_CLINIC
        to: CANCELLED
        trigger: "POST /otp/dose-dispenses/{doseId}/cancel"
        actor: Nurse
        preconditions:
          - "DoseDispense.status in {SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED} (ERR_DOSE_NOT_CANCELLABLE)"
        side_effects:
          - "DoseDispense.completed_at := logical clock"

      - from: NURSE_VERIFIED
        to: CANCELLED
        trigger: "POST /otp/dose-dispenses/{doseId}/cancel"
        actor: Nurse
        preconditions:
          - "DoseDispense.status in {SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED} (ERR_DOSE_NOT_CANCELLABLE)"
        side_effects:
          - "DoseDispense.completed_at := logical clock"

  # --- TakeHomePrivilege: cyclic (C) ---------------------------------------
  - entity: TakeHomePrivilege
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /otp/take-home-privileges/{privilegeId}/evaluate"
        actor: MedicalDirector
        preconditions:
          - "TakeHomePrivilege.decision == PENDING_REVIEW (ERR_PRIVILEGE_NOT_PENDING)"
          - "Patient.time_in_treatment_days >= 90 (ERR_TIME_IN_TREATMENT_INSUFFICIENT)"
          - "TakeHomePrivilege.timetable_reconciled == true (ERR_TIMETABLE_LOOKAHEAD_FAILED)"
          - "Patient.denial_count_12mo <= 2 (ERR_ACTIVE_DENIAL_HISTORY)"
          - "Patient.stability_score (DIRECTION_B_TAKE_HOME_READINESS) >= 70.0 (ERR_STABILITY_BELOW_THRESHOLD)"
          - "Program.posture == NORMAL (ERR_PROGRAM_POSTURE_RESTRICTED)"
        side_effects:
          - "TakeHomePrivilege.approved_carries := eligible_carry_cap after the cap waterfall"
          - "TakeHomePrivilege.evaluation_basis := TIME_IN_TREATMENT"
          - "TakeHomePrivilege.expires_on := schedule.expiration_date"
          - "TakeHomePrivilege.hold_ledger_delta := 0 and take_home_carry_ledger.charges_held -= 1"
          - "A DoseDispense row is synthesized for each of the first approved_carries open days with source_type TAKE_HOME_ISSUANCE; take_home_carry_ledger.carried_issued_mg += sum of their ordered_mg"

      - from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /otp/take-home-privileges/{privilegeId}/evaluate"
        actor: MedicalDirector
        preconditions:
          - "TakeHomePrivilege.decision == PENDING_REVIEW (ERR_PRIVILEGE_NOT_PENDING)"
          - "At least one of the approval preconditions above fails"
        side_effects:
          - "TakeHomePrivilege.hold_ledger_delta := 0 and take_home_carry_ledger.charges_held -= 1"
          - "No carries are held and no DoseDispense row is synthesized"

      - from: DENIED
        to: APPROVED_WITH_EXCEPTION
        trigger: "POST /otp/take-home-exceptions/{exceptionId}/decision with decision GRANT"
        actor: MedicalDirector
        preconditions:
          - "TakeHomePrivilege.decision == DENIED (ERR_PRIVILEGE_NOT_DENIED)"
          - "TakeHomeException.status == SUPERVISOR_REVIEW (ERR_EXCEPTION_NOT_AWAITING_SUPERVISOR)"
          - "TakeHomeException.requesting_physician_id != TakeHomeException.supervisor_id (ERR_SELF_REVIEW_FORBIDDEN)"
          - "TakeHomeException.evaluated_domain_b == true (ERR_STABILITY_BELOW_THRESHOLD)"
          - "Program.posture != FROZEN (ERR_PROGRAM_POSTURE_RESTRICTED)"
        side_effects:
          - "TakeHomePrivilege.decision := APPROVED_WITH_EXCEPTION"
          - "TakeHomePrivilege.approved_carries := TakeHomeException.granted_carries"
          - "TakeHomePrivilege.eligible_carry_cap := that same value"
          - "TakeHomePrivilege.evaluation_basis := PHASE_STABILITY"
          - "TakeHomePrivilege.expires_on := schedule.expiration_date"
          - "TakeHomePrivilege.exception_id := TakeHomeException.id"
          - "A DoseDispense row is synthesized for each of the first granted_carries open days with source_type TAKE_HOME_ISSUANCE; take_home_carry_ledger.carried_issued_mg += sum of their ordered_mg"
          - "Patient.treatment_phase unchanged; Patient.stability_score recomputed by DIRECTION_B_TAKE_HOME_READINESS"

      - from: DENIED
        to: APPROVED
        trigger: "POST /otp/take-home-privileges/{privilegeId}/evaluate"
        actor: MedicalDirector
        preconditions:
          - "TakeHomePrivilege.decision == DENIED (ERR_PRIVILEGE_NOT_PENDING)"
          - "All PENDING_REVIEW→APPROVED preconditions above now hold at the current logical clock"
        side_effects:
          - "TakeHomePrivilege.approved_carries := eligible_carry_cap after the cap waterfall"
          - "TakeHomePrivilege.decision := APPROVED and denial_reason_code := null"
          - "A DoseDispense row is synthesized for each of the first approved_carries open days with source_type TAKE_HOME_ISSUANCE; take_home_carry_ledger.carried_issued_mg += sum of their ordered_mg"

      - from: APPROVED
        to: REVOKED
        trigger: "system (automatic on diversion confirmation) or POST /otp/take-home-privileges/{privilegeId}/revoke"
        actor: system | MedicalDirector
        preconditions:
          - "TakeHomePrivilege.decision == APPROVED (ERR_PRIVILEGE_NOT_ACTIVE)"
          - "For the system path: Patient.diversion_standing == CONFIRMED_DIVERSION"
        side_effects:
          - "TakeHomePrivilege.decision := REVOKED and freed_carries := approved_carries"
          - "TakeHomePrivilege.approved_carries := 0"
          - "Every take-home DoseDispense row for this privilege with status SCHEDULED → CANCELLED and its ordered_mg added to take_home_carry_ledger.carried_voided_mg"
          - "TakeHomeCarryLedger.carries_used := previous value minus the number of cancelled take-home dose rows, floored at 0"
          - "Patient.carries_used := take_home_carry_ledger.carries_used"
          - "Patient.treatment_phase := INDUCTION (reset on revocation)"
          - "For each cancelled take-home dose, the InventoryLot referenced by its inventory_lot_id → QUARANTINED (third hop of cascade R4)"

      - from: APPROVED_WITH_EXCEPTION
        to: REVOKED
        trigger: "system (automatic on diversion confirmation) or POST /otp/take-home-privileges/{privilegeId}/revoke"
        actor: system | MedicalDirector
        preconditions:
          - "TakeHomePrivilege.decision == APPROVED_WITH_EXCEPTION (ERR_PRIVILEGE_NOT_ACTIVE)"
          - "For the system path: Patient.diversion_standing == CONFIRMED_DIVERSION"
        side_effects:
          - "TakeHomePrivilege.decision := REVOKED and freed_carries := approved_carries"
          - "TakeHomePrivilege.approved_carries := 0"
          - "Every take-home DoseDispense row for this privilege with status SCHEDULED → CANCELLED and its ordered_mg added to take_home_carry_ledger.carried_voided_mg"
          - "TakeHomeCarryLedger.carries_used := previous value minus the number of cancelled take-home dose rows, floored at 0"
          - "Patient.carries_used := take_home_carry_ledger.carries_used"
          - "For each cancelled take-home dose, the InventoryLot referenced by its inventory_lot_id → QUARANTINED (third hop of cascade R4)"
          - "TakeHomeException rows referenced by this privilege with status GRANTED → REVOKED"

      - from: REVOKED
        to: PENDING_REVIEW
        trigger: "POST /otp/take-home-privileges"
        actor: MedicalDirector
        preconditions:
          - "The request carries reissued_from_privilege_id and that privilege's decision == REVOKED (ERR_REISSUE_SOURCE_NOT_REVOKED)"
          - "Patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE)"
          - "Program.posture == NORMAL (ERR_PROGRAM_POSTURE_RESTRICTED)"
        side_effects:
          - "New TakeHomePrivilege row created with decision PENDING_REVIEW and hold_ledger_delta := -1"
          - "TakeHomeCarryLedger.charges_held += 1"
          - "TakeHomeCarryLedger.carries_held += 1"

  # --- TakeHomeException: back-edge (E) ------------------------------------
  - entity: TakeHomeException
    initial_state: REQUESTED
    terminal_states: [REVOKED, DENIED]
    transitions:
      - from: REQUESTED
        to: SUPERVISOR_REVIEW
        trigger: "POST /otp/take-home-exceptions/{exceptionId}/route"
        actor: Physician
        preconditions:
          - "TakeHomeException.status == REQUESTED (ERR_EXCEPTION_NOT_REQUESTED)"
          - "TakeHomeException.requesting_physician_id != TakeHomeException.supervisor_id (ERR_SELF_REVIEW_FORBIDDEN)"
          - "Length of clinical_justification >= 40 characters (ERR_JUSTIFICATION_TOO_SHORT)"
        side_effects:
          - "TakeHomeException.evaluated_domain_b := (physician DIRECTION_B_TAKE_HOME_READINESS score >= applicable stability floor)"

      - from: SUPERVISOR_REVIEW
        to: GRANTED
        trigger: "POST /otp/take-home-exceptions/{exceptionId}/decision with decision GRANT"
        actor: MedicalDirector
        preconditions:
          - "TakeHomeException.status == SUPERVISOR_REVIEW (ERR_EXCEPTION_NOT_AWAITING_SUPERVISOR)"
          - "TakeHomeException.evaluated_domain_b == true (ERR_STABILITY_BELOW_THRESHOLD)"
          - "TakeHomeException.granted_carries <= the applicable carry-table cap for Patient.time_in_treatment_days (ERR_EXCEPTION_CARRIES_EXCEED_CAP)"
        side_effects:
          - "The linked TakeHomePrivilege row (exception_id == TakeHomeException.id) with decision DENIED → APPROVED_WITH_EXCEPTION (second hop of cascade R4)"
          - "That privilege's approved_carries := TakeHomeException.granted_carries and eligible_carry_cap := the same"

      - from: SUPERVISOR_REVIEW
        to: DENIED
        trigger: "POST /otp/take-home-exceptions/{exceptionId}/decision with decision DENY"
        actor: MedicalDirector
        preconditions:
          - "TakeHomeException.status == SUPERVISOR_REVIEW (ERR_EXCEPTION_NOT_AWAITING_SUPERVISOR)"
        side_effects: []

      - from: GRANTED
        to: REVOKED
        trigger: "POST /otp/take-home-exceptions/{exceptionId}/revoke"
        actor: MedicalDirector
        preconditions:
          - "TakeHomeException.status == GRANTED (ERR_EXCEPTION_NOT_GRANTED)"
        side_effects:
          - "The linked TakeHomePrivilege row with decision == APPROVED_WITH_EXCEPTION → REVOKED (second hop of cascade R10)"
          - "Every take-home DoseDispense row for that privilege with status SCHEDULED → CANCELLED and its ordered_mg added to take_home_carry_ledger.carried_voided_mg"

  # --- GuestDosingArrangement: branching -----------------------------------
  - entity: GuestDosingArrangement
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_RECEIVING_ACK
        trigger: "POST /otp/guest-dosing-arrangements/{arrangementId}/transmit"
        actor: ProgramAdministrator
        preconditions:
          - "GuestDosingArrangement.status == DRAFT (ERR_ARRANGEMENT_NOT_DRAFT)"
          - "GuestDosingArrangement.originating_program_id == Patient.program_id (ERR_ARRANGEMENT_PROGRAM_MISMATCH)"
          - "GuestDosingArrangement.receiving_program_id != originating_program_id (ERR_SAME_PROGRAM_GUEST_DOSING)"
          - "The receiving Program has guest_dosing_enabled == true (ERR_GUEST_DOSING_NOT_ENABLED)"
          - "Patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE)"
          - "Program.posture == NORMAL for the receiving program (ERR_PROGRAM_OPERATIONALLY_BLOCKED)"
          - "The receiving program has an open-day clinic window overlapping [travel_start_date, travel_end_date] (ERR_NO_OVERLAPPING_VISIT_WINDOW)"
        side_effects:
          - "GuestDosingArrangement.dose_authorization_token := server-issued token"
          - "GuestDosingArrangement.authorized_mg := the patient's active DoseOrder.ordered_daily_mg"

      - from: PENDING_RECEIVING_ACK
        to: ACTIVE
        trigger: "POST /otp/guest-dosing-arrangements/{arrangementId}/acknowledge"
        actor: Nurse
        preconditions:
          - "GuestDosingArrangement.status == PENDING_RECEIVING_ACK (ERR_ARRANGEMENT_NOT_PENDING_ACK)"
          - "Acting Nurse.program_id == receiving_program_id (ERR_NURSE_NOT_IN_PROGRAM)"
        side_effects:
          - "GuestDosingArrangement.receiving_acknowledged_at := logical clock"

      - from: PENDING_RECEIVING_ACK
        to: REJECTED
        trigger: "POST /otp/guest-dosing-arrangements/{arrangementId}/reject"
        actor: Nurse
        preconditions:
          - "GuestDosingArrangement.status == PENDING_RECEIVING_ACK (ERR_ARRANGEMENT_NOT_PENDING_ACK)"
        side_effects:
          - "GuestDosingArrangement.dose_authorization_token := null"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /otp/guest-dosing-arrangements/{arrangementId}/close"
        actor: ProgramAdministrator
        preconditions:
          - "GuestDosingArrangement.status == ACTIVE (ERR_ARRANGEMENT_NOT_ACTIVE)"
          - "Logical clock date > travel_end_date (ERR_TRAVEL_WINDOW_NOT_ENDED)"
        side_effects:
          - "GuestDosingArrangement.token_consumed := true"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /otp/guest-dosing-arrangements/{arrangementId}/cancel"
        actor: ProgramAdministrator
        preconditions:
          - "GuestDosingArrangement.status in {DRAFT, PENDING_RECEIVING_ACK, ACTIVE} (ERR_ARRANGEMENT_NOT_CANCELLABLE)"
        side_effects: []

      - from: PENDING_RECEIVING_ACK
        to: CANCELLED
        trigger: "POST /otp/guest-dosing-arrangements/{arrangementId}/cancel"
        actor: ProgramAdministrator
        preconditions:
          - "GuestDosingArrangement.status in {DRAFT, PENDING_RECEIVING_ACK, ACTIVE} (ERR_ARRANGEMENT_NOT_CANCELLABLE)"
        side_effects: []

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /otp/guest-dosing-arrangements/{arrangementId}/cancel"
        actor: ProgramAdministrator
        preconditions:
          - "GuestDosingArrangement.status in {DRAFT, PENDING_RECEIVING_ACK, ACTIVE} (ERR_ARRANGEMENT_NOT_CANCELLABLE)"
        side_effects: []

  # --- InventoryLot ---------------------------------------------------------
  - entity: InventoryLot
    initial_state: RECEIVED
    terminal_states: [DEPLETED, QUARANTINED, DESTROYED]
    transitions:
      - from: RECEIVED
        to: IN_USE
        trigger: "system (automatic when the first InventoryTransaction referencing this lot is recorded)"
        actor: system
        preconditions:
          - "InventoryLot.status == RECEIVED"
        side_effects:
          - "InventoryLot.running_on_hand_mg recomputed"

      - from: IN_USE
        to: DEPLETED
        trigger: "system (automatic when running_on_hand_mg reaches 0.0)"
        actor: system
        preconditions:
          - "InventoryLot.running_on_hand_mg <= 0.0001"
        side_effects:
          - "No further DISPENSE transaction may be recorded against this lot"

      - from: RECEIVED
        to: QUARANTINED
        trigger: "POST /otp/inventory-lots/{lotId}/quarantine"
        actor: ProgramAdministrator
        preconditions:
          - "InventoryLot.status in {RECEIVED, IN_USE} (ERR_LOT_NOT_QUARANTINABLE)"
        side_effects:
          - "InventoryLot is removed from the lot selector candidate pool"

      - from: IN_USE
        to: QUARANTINED
        trigger: "POST /otp/inventory-lots/{lotId}/quarantine"
        actor: ProgramAdministrator
        preconditions:
          - "InventoryLot.status in {RECEIVED, IN_USE} (ERR_LOT_NOT_QUARANTINABLE)"
        side_effects:
          - "InventoryLot is removed from the lot selector candidate pool"

      - from: QUARANTINED
        to: RECEIVED
        trigger: "POST /otp/inventory-lots/{lotId}/release-quarantine"
        actor: ProgramAdministrator
        preconditions:
          - "InventoryLot.status == QUARANTINED (ERR_LOT_NOT_QUARANTINED)"
        side_effects:
          - "InventoryLot returns to the selector candidate pool"

      - from: IN_USE
        to: DESTROYED
        trigger: "POST /otp/inventory-lots/{lotId}/destroy"
        actor: ProgramAdministrator
        preconditions:
          - "InventoryLot.running_on_hand_mg == 0.0 (ERR_LOT_NOT_EMPTY)"
          - "witness_staff_id present and != acting X-User-ID (ERR_WITNESS_REQUIRED)"
        side_effects:
          - "InventoryTransaction row appended: transaction_type DESTRUCTION, quantity_mg := 0"

  # --- Guest/services: no state machine for InventoryTransaction, CounselingSession, TreatmentPlanReview, Compliance*, DiversionCase, User ---
  - entity: ComplianceInspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /otp/compliance-inspections/{inspectionId}/begin"
        actor: RegulatoryAuditor
        preconditions:
          - "ComplianceInspection.status == SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
        side_effects:
          - "ComplianceInspection.readiness_score recomputed by the inspection_readiness calculation"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /otp/compliance-inspections/{inspectionId}/complete"
        actor: RegulatoryAuditor
        preconditions:
          - "ComplianceInspection.status == IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS)"
          - "Every ComplianceFinding row for this inspection with severity CRITICAL has status != OPEN (ERR_CRITICAL_FINDING_OPEN)"
        side_effects:
          - "ComplianceInspection.finding_count := count of ComplianceFinding rows for this inspection"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /otp/compliance-inspections/{inspectionId}/cancel"
        actor: RegulatoryAuditor
        preconditions:
          - "ComplianceInspection.status == SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
        side_effects: []

  - entity: DiversionCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /otp/diversion-cases/{caseId}/begin-review"
        actor: RegulatoryAuditor
        preconditions:
          - "DiversionCase.status == OPEN (ERR_DIVERSION_CASE_NOT_OPEN)"
        side_effects:
          - "Patient.diversion_standing := UNDER_INVESTIGATION"
          - "Program.open_diversion_case_count recomputed"

      - from: UNDER_REVIEW
        to: CONFIRMED
        trigger: "POST /otp/diversion-cases/{caseId}/confirm"
        actor: RegulatoryAuditor
        preconditions:
          - "DiversionCase.status == UNDER_REVIEW (ERR_DIVERSION_CASE_NOT_UNDER_REVIEW)"
          - "outcome_summary present and at least 20 characters (ERR_JUSTIFICATION_TOO_SHORT)"
        side_effects:
          - "DiversionCase.confirmed_at := logical clock"
          - "Patient.diversion_standing := CONFIRMED_DIVERSION"
          - "Patient.risk_score_points += 25.0; risk_tier recut"
          - "Every TakeHomePrivilege row for this patient with decision IN {APPROVED, APPROVED_WITH_EXCEPTION} → REVOKED (first hop of cascade R4 and R10)"
          - "Program.open_diversion_case_count recomputed; Program.posture recomputed by the posture ladder"

      - from: UNDER_REVIEW
        to: UNSUBSTANTIATED
        trigger: "POST /otp/diversion-cases/{caseId}/unsubstantiate"
        actor: RegulatoryAuditor
        preconditions:
          - "DiversionCase.status == UNDER_REVIEW (ERR_DIVERSION_CASE_NOT_UNDER_REVIEW)"
        side_effects:
          - "Patient.diversion_standing := CLEAR"
          - "Program.open_diversion_case_count recomputed; Program.posture recomputed by the posture ladder"

      - from: UNSUBSTANTIATED
        to: CLOSED
        trigger: "POST /otp/diversion-cases/{caseId}/close"
        actor: RegulatoryAuditor
        preconditions:
          - "DiversionCase.status in {UNSUBSTANTIATED, CONFIRMED} (ERR_DIVERSION_CASE_NOT_CLOSABLE)"
        side_effects: []

      - from: CONFIRMED
        to: CLOSED
        trigger: "POST /otp/diversion-cases/{caseId}/close"
        actor: RegulatoryAuditor
        preconditions:
          - "DiversionCase.status in {UNSUBSTANTIATED, CONFIRMED} (ERR_DIVERSION_CASE_NOT_CLOSABLE)"
        side_effects:
          - "Program.open_diversion_case_count recomputed; Program.posture recomputed by the posture ladder"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED, CANCELED]
    transitions:
      - from: OPEN
        to: IMPLEMENTED
        trigger: "POST /otp/corrective-actions/{actionId}/implement"
        actor: ProgramAdministrator
        preconditions:
          - "CorrectiveAction.status == OPEN (ERR_ACTION_NOT_OPEN)"
        side_effects:
          - "Program.posture recomputed by the posture ladder"

      - from: IMPLEMENTED
        to: VERIFIED_CLOSED
        trigger: "POST /otp/corrective-actions/{actionId}/verify"
        actor: RegulatoryAuditor
        preconditions:
          - "CorrectiveAction.status == IMPLEMENTED (ERR_ACTION_NOT_IMPLEMENTED)"
        side_effects:
          - "Program.open_critical_finding_count recomputed; Program.posture recomputed by the posture ladder"

      - from: OPEN
        to: CANCELED
        trigger: "POST /otp/corrective-actions/{actionId}/cancel"
        actor: MedicalDirector
        preconditions:
          - "CorrectiveAction.status == OPEN (ERR_ACTION_NOT_OPEN)"
        side_effects:
          - "Program.open_critical_finding_count recomputed; Program.posture recomputed by the posture ladder"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: privilege-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /otp/take-home-privileges"
    occ_field: "expected_patient_version"
    description: |
      Creating a TakeHomePrivilege against a Patient whose version has
      advanced since the client last observed it is rejected. This captures
      the case where a prior privilege on this patient has already been
      approved or revoked — each of which legitimately appends a new
      privilege row under the product's cyclic reissue rules — and the
      current writer's view of the patient is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: exception-create-stale-privilege
    parent_entity: TakeHomePrivilege
    write_endpoint: "POST /otp/take-home-exceptions"
    occ_field: "expected_privilege_version"
    description: |
      Creating a TakeHomeException against a TakeHomePrivilege whose version
      has advanced since the client last observed it is rejected. This
      captures the case where the privilege has just been approved or denied
      — both of which legitimately record a decision on the row the
      exception was meant to challenge — so the exception writer's view of
      the privilege is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: arrangement-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /otp/guest-dosing-arrangements"
    occ_field: "expected_patient_version"
    description: |
      Creating a GuestDosingArrangement against a Patient whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another arrangement for the same patient has just been
      transmitted or acknowledged — which legitimately bumps the patient's
      version — so the new arrangement's writer is working from a stale
      patient view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations: &calculations

  # --- R1a: quota waterfall on the carry pool (mode: nested min/max) --------
  - name: carry_cap_waterfall
    trigger: "POST /otp/take-home-privileges/{privilegeId}/evaluate when the applicant has no granted exception"
    algorithm: waterfall_allocation
    formula: |
      1. Read the applicable carry table for this evaluation:
         applicable_table = CARRY_TIME_IN_TREATMENT_TABLE (this evaluation is the
         non-exception path; the PHASE_STABILITY table applies only to the
         exception path handled by phase_stability_exception_cap)
      2. table_cap = applicable_table[patient.time_in_treatment_days]
         (walk the table's thresholds in descending order and take the first
          threshold the value is >= ; zero below the lowest threshold)
      3. allotted_carries = CarryQuotaLedger.allotted_carries for privilege.program_id
         granted_carries  = CarryQuotaLedger.granted_carries for privilege.program_id
         available_carries = allotted_carries - granted_carries
      4. pool_cap = max(0, floor(available_carries / 2.0))
         (the integer floor of half the remaining program pool; the pool is
          deliberately never fully drainable by a single patient)
      5. privilege.eligible_carry_cap = min(privilege.requested_carries, table_cap, pool_cap)
      6. privilege.approved_carries = privilege.eligible_carry_cap
         A grant smaller than requested_carries is NOT an error and does NOT set
         denial_reason_code — the endpoint returns 200 with the reduced count.
      7. CarryQuotaLedger.granted_carries  += approved_carries
         CarryQuotaLedger.available_carries = allotted_carries - granted_carries
      8. On a later REVOKED transition: granted_carries -= freed_carries and
         released_carries += freed_carries. Because the availability invariant is
         defined as allotted_carries - granted_carries, released_carries is a
         reporting field ONLY and is never added back into the pool.
    input_set: "CarryQuotaLedger rows with status computed; TakeHomePrivilege rows with decision IN {APPROVED, APPROVED_WITH_EXCEPTION} count toward granted_carries; rows with decision IN {PENDING_REVIEW, DENIED, REVOKED} do not"
    constants:
      CARRY_TIME_IN_TREATMENT_TABLE: ">=90:1, >=180:2, >=270:3, >=365:6, >=540:13, >=730:27"
      POOL_DIVISOR: 2.0
    precision: "integer carries; floor applied only to the pool term"
    variants:
      - name: exception_path
        when: "the privilege is being granted through a TakeHomeException (see phase_stability_exception_cap)"
        difference: "the applicable table becomes the phase-stability table and the cap is the nested max/min of that table, the time-in-treatment table and the pool cap"

  # --- R1b: the SECOND applicable carry table (exception path) --------------
  - name: phase_stability_exception_cap
    trigger: "POST /otp/take-home-exceptions/{exceptionId}/decision with decision GRANT"
    algorithm: waterfall_allocation
    formula: |
      time_cap   = CARRY_TIME_IN_TREATMENT_TABLE[patient.time_in_treatment_days]
      phase_cap  = CARRY_PHASE_TABLE[patient.treatment_phase]
      pool_cap   = max(0, floor((allotted_carries - granted_carries) / 2.0))
      exception_cap = min(exception.requested_carries,
                          max(phase_cap, time_cap),
                          pool_cap)
      exception.granted_carries = exception_cap
      privilege.approved_carries = exception_cap
      privilege.eligible_carry_cap = exception_cap
      privilege.evaluation_basis = PHASE_STABILITY
      The nested max(phase_cap, time_cap) is what lets an exception lift a patient
      to the better of the two tables; the outer min with pool_cap is what stops
      an exception from draining the program pool.
    input_set: "TakeHomeException rows with status IN {SUPERVISOR_REVIEW}; the patient's CarryQuotaLedger row is read read-only and mutated by the privilege transition"
    constants:
      CARRY_PHASE_TABLE: "INDUCTION:0, STABILIZATION:1, MAINTENANCE:6, MEDICAL_WITHDRAWAL:0"
      CARRY_TIME_IN_TREATMENT_TABLE: ">=90:1, >=180:2, >=270:3, >=365:6, >=540:13, >=730:27"
      POOL_DIVISOR: 2.0
    precision: "integer carries"

  # --- R2a: grade-point / score posting on a Patient (weighted scoring) -----
  - name: stability_score_direction_a
    trigger: "patient reads, dose completion, dose missed, counseling completion, plan review, admission, activation"
    algorithm: weighted_scoring
    formula: |
      completed_doses_28d    = count of DoseDispense rows for this patient with
                               status == COMPLETED and completed_at in
                               [clock - 28 days, clock] (inclusive both ends)
      completed_counsel_28d  = count of CounselingSession rows for this patient with
                               status == COMPLETED and completed_at in
                               [clock - 28 days, clock] (inclusive both ends)
      missed_penalty(s)      = 0.0 when s <= 0
                             = 3.0 * s + 0.5 * s * (s - 1) / 2.0 when s >= 1
      score = 50.0
            + min(25.0, 0.25 * patient.time_in_treatment_days)
            + 2.0 * completed_doses_28d
            - missed_penalty(patient.missed_dose_streak)
            - 1.5 * patient.denial_count_12mo
            + 1.0 * min(4, completed_counsel_28d)
      score = clamp(round_half_up(score, 1), 0.0, 100.0)
      This is the DIRECTION_A_STABILITY channel. It is published verbatim as
      Patient.stability_score on reads and copied into Patient.stability_posting.
    input_set: "DoseDispense rows with status COMPLETED only (SCHEDULED, ARRIVED_AT_CLINIC, NURSE_VERIFIED, DISPENSED, VERIFICATION_FAILED, REFUSED, MISSED and CANCELLED are excluded); CounselingSession rows with status COMPLETED only"
    constants:
      BASE_SCORE: 50.0
      TREATMENT_DAYS_WEIGHT: 0.25
      TREATMENT_DAYS_CAP: 25.0
      DOSE_COMPLETION_WEIGHT: 2.0
      MISSED_STREAK_LINEAR: 3.0
      MISSED_STREAK_QUADRATIC: 0.5
      DENIAL_WEIGHT: 1.5
      COUNSELING_WEIGHT: 1.0
      COUNSELING_CAP: 4
    precision: "1 decimal place, round_half_up, then clamped to [0.0, 100.0]"
    variants:
      - name: direction_b_readiness
        when: "carry-scheduling and take-home-privilege evaluation (see take_home_readiness_direction_b)"
        difference: "Direction B subtracts four patient standing penalties and a journal-lookback discount, and applies a phase-dependent floor; it is the number that gates carries but is never returned by a patient read"

  # --- R2b: the OTHER channel on the same patient (weighted scoring) -------
  - name: take_home_readiness_direction_b
    trigger: "take-home privilege evaluation, dose missed, diversion case confirmation"
    algorithm: weighted_scoring
    formula: |
      base = stability_score_direction_a(patient) evaluated at the same instant
      readiness = base
                - 8.0  * patient.missed_dose_streak
                - 12.0 * (1 when patient.transportation_type == NO_RELIABLE_TRANSPORT else 0)
                - 20.0 * (1 when patient.diversion_standing == CONFIRMED_DIVERSION else 0)
                - 10.0 * (1 when patient.diversion_standing == UNDER_INVESTIGATION else 0)
                - 6.0  * (1 when patient.counseling_standing == COUNSELING_DEFICIENT else 0)
                - 4.0  * (1 when patient.counseling_standing == REVIEW_OVERDUE else 0)
      ready = clamp(round_half_up(readiness, 1), 0.0, 100.0)
      Then apply the journal look-back discount, which removes exactly two MS2
      entries from the regulation journal window:
        - the entry whose created_at is earliest in the window: -2.0
        - the entry whose created_at is latest in the window: -1.5
        When the window holds fewer than two entries only the entries present
        are discounted, in the order above.
      ready = clamp(round_half_up(ready - 2.0 - 1.5, 1), 0.0, 100.0)
      floor = 70.0 when patient.treatment_phase == MAINTENANCE else 75.0
      cleared = (ready >= floor)
    input_set: "Patient row plus its CounselingSession rows in the trailing 28 days; the journal window is the patient's DoseDispense rows for the last 28 days"
    constants:
      MISSED_STREAK_WEIGHT: 8.0
      NO_TRANSPORT_PENALTY: 12.0
      CONFIRMED_DIVERSION_PENALTY: 20.0
      UNDER_INVESTIGATION_PENALTY: 10.0
      COUNSELING_DEFICIENT_PENALTY: 6.0
      REVIEW_OVERDUE_PENALTY: 4.0
      LOOKBACK_FIRST_ENTRY_MG: 2.0
      LOOKBACK_LAST_ENTRY_MG: 1.5
      STABILITY_FLOOR_MAINTENANCE: 70.0
      STABILITY_FLOOR_OTHER: 75.0
    precision: "1 decimal place, round_half_up, clamped to [0.0, 100.0]"
    variants:
      - name: direction_a_stability
        when: "patient reads (see stability_score_direction_a)"
        difference: "Direction A applies no standing penalties, no look-back discount and no floor; the two channels therefore publish different numbers for the same patient at the same instant"

  # --- R3a: dose tariff (tiered + per-component rounding) -------------------
  - name: otp_dose_tariff
    trigger: "POST /otp/dose-dispenses/{doseId}/dispense"
    algorithm: tiered_pricing
    formula: |
      billed = (program.posture == NORMAL AND patient.status == ACTIVE)
      billed_dispensed = billed ? dose.dispensed_mg : 0.0
      billed_wasted    = billed ? dose.wasted_mg    : 0.0
      ceiling = (order.medication == METHADONE)
                  ? program.max_daily_mg_methadone
                  : program.max_daily_mg_buprenorphine
      over_ceiling_mg = ceil(max(0.0, dose.ordered_mg - ceiling))
      step_tier_sum(m) = 2.90 * min(m, 10)
                       + 3.30 * min(max(m - 10, 0), 30)
                       + 5.25 * min(max(m - 40, 0), 50)
                       + 6.80 * max(m - 90, 0)
      base_pair = order.split_dose_authorized
                    ? 2.0 * step_tier_sum(dose.ordered_mg / 2.0)
                    : step_tier_sum(dose.ordered_mg)
      base_charge   = round_half_up(base_pair + 1.25 * over_ceiling_mg, 2)
      handling_fee  = round_half_up(0.0125 * billed_dispensed, 2)
      security_fee  = round_half_up(0.0075 * billed_dispensed, 2)
      waste_fee     = round_half_up(1.15 * ceil(max(0.0, billed_wasted - 10.0) / 10.0), 2)
      total = base_charge + handling_fee + security_fee + waste_fee
      ROUNDING ORDER IS PINNED: every component is rounded to 2 decimal places
      FIRST and the rounded components are then summed. The unrounded sum is
      never used. For ordered_mg 90 on METHADONE with a 120 mg ceiling, no waste
      and no split authorisation the reported total is 392.31.
    input_set: "DoseDispense rows with status DISPENSED; the order and program rows are read at dispense time; the dispense is priced whether or not the patient is billed"
    constants:
      TIER_1_RATE: 2.90
      TIER_2_RATE: 3.30
      TIER_3_RATE: 5.25
      TIER_4_RATE: 6.80
      OVER_CEILING_RATE: 1.25
      HANDLING_RATE_PER_MG: 0.0125
      SECURITY_RATE_PER_MG: 0.0075
      WASTE_FEE_PER_10MG: 1.15
      WASTE_FREE_ALLOWANCE_MG: 10.0
    precision: "2 decimal places, round_half_up, applied per component THEN summed"
    variants:
      - name: sum_then_round
        when: "reported only by GET /otp/dose-dispenses/{doseId}/charge-preview as the reconciling figure"
        difference: "the same components are summed unrounded and rounded once at the end; for ordered_mg 90 on METHADONE with a 120 mg ceiling the sum-then-round figure is 392.30, one cent below the per-component figure of 392.31"
      - name: split_dose_tariff
        when: "order.split_dose_authorized == true"
        difference: "the step tariff is applied to half the ordered milligrams and doubled instead of being applied to the whole ordered amount; for ordered_mg 90 this yields 2 * step_tier_sum(45) = 2 * 154.25 = 308.50 rather than step_tier_sum(90) = 390.50"

  # --- R3b: inventory variance write-off (chronological, dual variant) ------
  - name: inventory_variance_write_off
    trigger: "POST /otp/inventory-reconciliations/{period}/close"
    algorithm: chronological
    formula: |
      Process the program's InventoryLot rows in ascending (created_at, id) order.
      For each lot with status != QUARANTINED at period end:
        RECONCILED_on_hand = lot.quantity_received_mg
                           + sum(InventoryTransaction.quantity_mg)
                             over that lot's rows with status == RECONCILED
                             and created_at <= period_end
        expired_mg = sum of InventoryTransaction.quantity_mg magnitude already
                     debited for that lot by DESTRUCTION or ADJUSTMENT rows
                     dated on or after lot.expiration_date
        DELIVERED_on_hand = RECONCILED_on_hand - expired_mg
      variance_mg = sum(DELIVERED_on_hand) - sum(RECONCILED_on_hand)
      tolerance_mg = max(ABSOLUTE_TOLERANCE_MG, 0.02 * total_dispensed_mg_for_period)
      flagged = (abs(variance_mg) > tolerance_mg)
      write_off_mg = max(0.0, -variance_mg - program.cumulative_write_off_mg)
      The reported program_variance_mg is the DELIVERED variant. Writing off an
      adjustment for variance_mg of -700.00 against a cumulative_write_off_mg of
      200.00 produces write_off_mg of 500.00 and moves cumulative_write_off_mg to
      700.00, leaving latest_inventory_variance_mg at 0.00.
    input_set: "InventoryLot rows with status IN {RECEIVED, IN_USE, DEPLETED, DESTROYED}; InventoryTransaction rows with status RECONCILED only — RECORDED, FLAGGED and VOIDED rows are excluded from the reconciled balance and counted only in the delivered balance"
    constants:
      ABSOLUTE_TOLERANCE_MG: 50.0
      RELATIVE_TOLERANCE_RATE: 0.02
    precision: "2 decimal places, round_half_up"
    variants:
      - name: expired_retained
        when: "the audit worksheet view GET /otp/inventory-reconciliations?period=YYYY-MM"
        difference: "expired stock is not netted out, so DELIVERED_on_hand equals RECONCILED_on_hand and the reported variance omits the expired-lot term entirely; the two variants differ by exactly the expired milligrams"

  # --- R3c: diversion variance flag (threshold, strict >) -------------------
  - name: diversion_variance_flag
    trigger: "POST /otp/inventory-reconciliations/{period}/close"
    algorithm: threshold
    formula: |
      tolerance_mg = max(50.0, 0.02 * period_dispensed_mg)
      flagged = abs(program.latest_inventory_variance_mg) > tolerance_mg
      At a variance exactly equal to tolerance_mg the period is NOT flagged.
      When flagged: an InventoryTransaction row of type ADJUSTMENT is appended
      with status FLAGGED, and program.latest_inventory_variance_mg is stored.
      When abs(program.latest_inventory_variance_mg) > 500.0 the posture ladder
      moves the program to RESTRICTED with reason INVENTORY_VARIANCE_OVER_THRESHOLD.
    input_set: "the InventoryTransaction rows belonging to the closed period"
    constants:
      ABSOLUTE_TOLERANCE_MG: 50.0
      RELATIVE_TOLERANCE_RATE: 0.02
      RESTRICTED_VARIANCE_MG: 500.0
    precision: "2 decimal places, round_half_up; comparison is strict greater-than"

  # --- R4a: posture ladder (selector + threshold) --------------------------
  - name: program_posture_ladder
    trigger: "any mutation of diversion cases, corrective actions, inventory variance or program status"
    algorithm: threshold
    formula: |
      Evaluated in this exact order; the first matching branch wins:
        1. program.status == SUSPENDED
             -> posture FROZEN, reason PROGRAM_SUSPENDED_BY_REGULATOR
        2. open_diversion_case_count >= 1
             -> posture RESTRICTED, reason DIVERSION_CASE_OPEN
        3. open_critical_finding_count >= 1
             -> posture RESTRICTED, reason CRITICAL_CORRECTIVE_ACTION_OPEN
        4. latest_inventory_variance_mg > 500.0
             -> posture RESTRICTED, reason INVENTORY_VARIANCE_OVER_THRESHOLD
        5. otherwise -> posture NORMAL, reason null
      Step 2 fires for a single open case: the posture ladder runs on the FIRST
      open diversion case, so a third case adds no further state change.
    input_set: "Program rows plus their DiversionCase and CorrectiveAction children"
    constants:
      RESTRICTED_VARIANCE_MG: 500.0
    precision: "enum assignment, no numeric rounding"

  # --- R4b: lot selector (selector policy) --------------------------------
  - name: otp_lot_selector
    trigger: "POST /otp/dose-dispenses/{doseId}/dispense"
    algorithm: constraint_propagation
    formula: |
      candidate set = every InventoryLot where ALL of:
        lot.program_id == dose.program_id
        lot.medication == order.medication
        lot.status == IN_USE
        lot.is_expired == false
        lot.running_on_hand_mg >= dose.ordered_mg
        (dose.source_type != TAKE_HOME_ISSUANCE OR lot.reusable_for_take_home == true)
      ranking expression: lot.expiration_date ascending (earliest usable expiration first)
      tie-break: lot.created_at ascending
      fallback when the candidate set is empty: ERR_NO_ELIGIBLE_LOT (409).
      There is no deferred queue and no second-choice lot.
      Server-minted ids never participate in the ranking or the tie-break.
    input_set: "InventoryLot rows only; QUARANTINED lots are excluded by the status filter, DEPLETED lots by the on-hand filter"
    constants:
      TAKE_HOME_MIN_ON_HAND_MG: 0.0
    precision: "string ordering on ISO date, then on ISO 8601 timestamp"

  # --- R5: patient risk tier (threshold) -----------------------------------
  - name: patient_stability_risk_tier
    trigger: "patient reads, dose missed, diversion case transitions, patient reinstatement"
    algorithm: weighted_scoring
    formula: |
      transport_points = NO_RELIABLE_TRANSPORT 12.0
                       | RIDE_SHARE 5.0
                       | PUBLIC_TRANSIT 1.5
                       | PRIVATE_VEHICLE 0.0
      diversion_points = CONFIRMED_DIVERSION 30.0
                       | UNDER_INVESTIGATION 8.0
                       | CLEAR 0.0
      risk_score_points = transport_points
                        + diversion_points
                        + 1.0 * min(12, patient.denial_count_12mo)
                        + 2.0 * patient.missed_dose_streak
                        + max(0.0, 30.0 - 0.1 * patient.time_in_treatment_days)
      risk_score_points = round_half_up(risk_score_points, 1)
      risk_tier = HIGH when risk_score_points >= 25.0
                | MODERATE when risk_score_points >= 12.0
                | LOW otherwise
      A reinstatement adds a flat +5.0 to risk_score_points before the tier is cut.
    input_set: "Patient rows; the diversion term reads Patient.diversion_standing, not the DiversionCase rows directly"
    constants:
      TRANSPORT_NO_RELIABLE: 12.0
      TRANSPORT_RIDE_SHARE: 5.0
      TRANSPORT_PUBLIC_TRANSIT: 1.5
      TRANSPORT_PRIVATE_VEHICLE: 0.0
      DIVERSION_CONFIRMED: 30.0
      DIVERSION_UNDER_INVESTIGATION: 8.0
      DENIAL_WEIGHT: 1.0
      DENIAL_CAP: 12
      MISSED_STREAK_WEIGHT: 2.0
      PHASE_DECAY_BASE: 30.0
      PHASE_DECAY_RATE: 0.1
      HIGH_THRESHOLD: 25.0
      MODERATE_THRESHOLD: 12.0
      REINSTATEMENT_SURCHARGE: 5.0
    precision: "1 decimal place, round_half_up; thresholds are >= (inclusive)"

  # --- R6: counseling and plan-review cadence (threshold + chronological) ---
  - name: counseling_review_overdue
    trigger: "patient reads, counseling session completion, plan review completion, patient admin actions"
    algorithm: threshold
    formula: |
      cadence_days = PHASE_CADENCE[patient.treatment_phase]
                   = INDUCTION 7 | STABILIZATION 14 | MAINTENANCE 30 | MEDICAL_WITHDRAWAL 7
      window_start = clock - cadence_days days, inclusive
      credited_minutes = sum of CounselingSession.attended_minutes over rows for
                         this patient with status == COMPLETED and completed_at in
                         [window_start, clock] (inclusive both ends)
      counseling_standing = CURRENT when credited_minutes >= 60.0
                          | COUNSELING_DEFICIENT otherwise
      latest_review = the TreatmentPlanReview row for this patient with
                      status == COMPLETED having the greatest reviewed_at
                      (tie-break: greatest created_at)
      review_standing = CURRENT when clock < latest_review.next_due_at
                      | REVIEW_OVERDUE when clock >= next_due_at and
                        clock < next_due_at + 3 days
                      | COUNSELING_DEFICIENT otherwise
      When the patient has no COMPLETED TreatmentPlanReview at all, review_standing
      is REVIEW_OVERDUE until the logical clock is more than 3 days past the
      admission datetime, after which it is COUNSELING_DEFICIENT.
      patient.counseling_standing = the more severe of the two standings, ordered
      COUNSELING_DEFICIENT > REVIEW_OVERDUE > CURRENT
    input_set: "CounselingSession rows with status COMPLETED only; TreatmentPlanReview rows with status COMPLETED only (SCHEDULED and VOIDED excluded)"
    constants:
      COUNSELING_REQUIRED_MINUTES: 60.0
      PHASE_CADENCE: "INDUCTION:7, STABILIZATION:14, MAINTENANCE:30, MEDICAL_WITHDRAWAL:7"
      REVIEW_GRACE_DAYS: 3
    precision: "integer minutes; date comparisons are boundary-inclusive at the start and boundary-exclusive at the grace edge"

  # --- R7: inspection readiness (aggregation + threshold) ------------------
  - name: inspection_readiness
    trigger: "POST /otp/compliance-inspections/{inspectionId}/begin and POST /otp/compliance-inspections/{inspectionId}/complete"
    algorithm: aggregation
    formula: |
      score = 100.0
            - 12.0 * (ComplianceFinding rows for this program with status == OPEN
                      and severity == CRITICAL)
            - 6.0  * (ComplianceFinding rows for this program with status == OPEN
                      and severity == MAJOR)
            - 2.0  * (ComplianceFinding rows for this program with status == OPEN
                      and severity == MINOR)
            - 10.0 * (DiversionCase rows for this program with status IN {OPEN, UNDER_REVIEW})
            - 15.0 * (1 when program.latest_inventory_variance_mg > 500.0 else 0)
            - 20.0 * (1 when at least one Patient of this program has
                      counseling_standing == COUNSELING_DEFICIENT else 0)
            - 10.0 * (1 when at least one TakeHomePrivilege of this program has
                      decision IN {APPROVED, APPROVED_WITH_EXCEPTION} and
                      expires_on <= the logical clock's date else 0)
      score = round_half_up(score, 1)
      readiness_tier = READY when score >= 85.0
                     | NEEDS_ATTENTION when score >= 60.0
                     | NOT_READY otherwise
    input_set: "ComplianceFinding rows with status == OPEN only; WAIVED and CORRECTED findings contribute nothing"
    constants:
      BASE_SCORE: 100.0
      CRITICAL_FINDING_PENALTY: 12.0
      MAJOR_FINDING_PENALTY: 6.0
      MINOR_FINDING_PENALTY: 2.0
      OPEN_DIVERSION_PENALTY: 10.0
      VARIANCE_PENALTY: 15.0
      COUNSELING_BREACH_PENALTY: 20.0
      LAPSED_PRIVILEGE_PENALTY: 10.0
      READY_THRESHOLD: 85.0
      NEEDS_ATTENTION_THRESHOLD: 60.0
    precision: "1 decimal place, round_half_up; thresholds are >= (inclusive)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations: &validations
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and the role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation by §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID must not equal any physician, supervisor or witness id the request nominates for a different step of the same action"
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 400
    applies_to: "POST /otp/take-home-exceptions, POST /otp/take-home-exceptions/{exceptionId}/route, POST /otp/take-home-exceptions/{exceptionId}/decision"

  - priority: 4
    category: existence
    check: "Resource ids in the path exist, validated left-to-right in the order they appear in the path"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_DOSE_ORDER_NOT_FOUND | ERR_DOSE_NOT_FOUND | ERR_PRIVILEGE_NOT_FOUND | ERR_EXCEPTION_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_DIVERSION_CASE_NOT_FOUND | ERR_ACTION_NOT_FOUND | ERR_ARRANGEMENT_NOT_FOUND | ERR_USER_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_CARRY_LEDGER_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"

  - priority: 5
    category: existence
    check: "Foreign keys supplied in the request body exist, validated in the order the endpoint's input list declares them"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_USER_NOT_FOUND | ERR_PRIVILEGE_NOT_FOUND | ERR_EXCEPTION_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_ARRANGEMENT_NOT_FOUND | ERR_FINDING_NOT_FOUND"
    http_status: 404
    applies_to: "POST /otp/patients, POST /otp/dose-orders, POST /otp/dose-dispenses, POST /otp/take-home-privileges, POST /otp/take-home-exceptions, POST /otp/guest-dosing-arrangements, POST /otp/inventory-lots, POST /otp/inventory-transactions, POST /otp/treatment-plan-reviews, POST /otp/diversion-cases, POST /otp/corrective-actions"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_<parent>_version supplied on the request body must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /otp/take-home-privileges, POST /otp/take-home-exceptions, POST /otp/guest-dosing-arrangements"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is declared (the from: set of the applicable §1.2 transition)"
    error_id: "ERR_PROGRAM_ALREADY_SUSPENDED | ERR_PROGRAM_NOT_SUSPENDED | ERR_PATIENT_NOT_PENDING_ADMISSION | ERR_PATIENT_NOT_ADMITTED | ERR_PATIENT_NOT_ACTIVE | ERR_PATIENT_NOT_SUSPENDED | ERR_PATIENT_NOT_DISCHARGEABLE | ERR_DOSE_ORDER_NOT_DRAFT | ERR_DOSE_ORDER_NOT_ACTIVE | ERR_DOSE_ORDER_NOT_DISCONTINUABLE | ERR_DOSE_NOT_SCHEDULED | ERR_DOSE_NOT_ARRIVED | ERR_DOSE_NOT_VERIFIED | ERR_DOSE_NOT_DISPENSED | ERR_DOSE_NOT_REFUSABLE | ERR_DOSE_NOT_CANCELLABLE | ERR_PRIVILEGE_NOT_PENDING | ERR_PRIVILEGE_NOT_DENIED | ERR_PRIVILEGE_NOT_ACTIVE | ERR_EXCEPTION_NOT_REQUESTED | ERR_EXCEPTION_NOT_AWAITING_SUPERVISOR | ERR_EXCEPTION_NOT_GRANTED | ERR_ARRANGEMENT_NOT_DRAFT | ERR_ARRANGEMENT_NOT_PENDING_ACK | ERR_ARRANGEMENT_NOT_ACTIVE | ERR_ARRANGEMENT_NOT_CANCELLABLE | ERR_LOT_NOT_QUARANTINABLE | ERR_LOT_NOT_QUARANTINED | ERR_INSPECTION_NOT_SCHEDULED | ERR_INSPECTION_NOT_IN_PROGRESS | ERR_DIVERSION_CASE_NOT_OPEN | ERR_DIVERSION_CASE_NOT_UNDER_REVIEW | ERR_DIVERSION_CASE_NOT_CLOSABLE | ERR_ACTION_NOT_OPEN | ERR_ACTION_NOT_IMPLEMENTED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "Clinic program posture must not be FROZEN for any operation that dispenses, defers, schedules or grants medication; and must be NORMAL for carries, dose orders and guest dosing"
    error_id: ERR_PROGRAM_OPERATIONALLY_BLOCKED
    http_status: 409
    applies_to: "POST /otp/patients/{patientId}/confirm-diagnosis, POST /otp/dose-orders/{doseOrderId}/activate, POST /otp/dose-dispenses/{doseId}/check-in, POST /otp/dose-dispenses/{doseId}/dispense, POST /otp/guest-dosing-arrangements/{arrangementId}/transmit"

  - priority: 9
    category: business_safety
    check: "Clinic program posture must be NORMAL (carries are not merely FROZEN-blocked — a RESTRICTED clinic may not grant take-home privileges or exceptions at all)"
    error_id: ERR_PROGRAM_POSTURE_RESTRICTED
    http_status: 403
    applies_to: "POST /otp/take-home-privileges, POST /otp/take-home-privileges/{privilegeId}/evaluate, POST /otp/take-home-exceptions/{exceptionId}/decision"

  - priority: 10
    category: business_safety
    check: "Diversion control: a patient whose diversion_standing is CONFIRMED_DIVERSION may not receive a carry or be admitted to a new program"
    error_id: ERR_DIVERSIONS_OR_FINDINGS_OPEN
    http_status: 403
    applies_to: "POST /otp/patients/{patientId}/confirm-diagnosis, POST /otp/take-home-privileges/{privilegeId}/evaluate, POST /otp/take-home-exceptions/{exceptionId}/decision, POST /otp/dose-dispenses, POST /otp/guest-dosing-arrangements/{arrangementId}/transmit"

  - priority: 11
    category: business_referential
    check: "Originating clinic and receiving clinic constraints for guest dosing, evaluated before the safety gates below"
    error_id: "ERR_ARRANGEMENT_PROGRAM_MISMATCH | ERR_SAME_PROGRAM_GUEST_DOSING | ERR_GUEST_DOSING_NOT_ENABLED"
    http_status: 409
    applies_to: "POST /otp/guest-dosing-arrangements, POST /otp/guest-dosing-arrangements/{arrangementId}/transmit"

  - priority: 12
    category: business_constraint
    check: "The receiving clinic must have an open clinic day that overlaps the requested travel window"
    error_id: ERR_NO_OVERLAPPING_VISIT_WINDOW
    http_status: 409
    applies_to: "POST /otp/guest-dosing-arrangements/{arrangementId}/transmit, POST /otp/dose-dispenses"

  - priority: 13
    category: business_temporal
    check: "Dose schedule must satisfy the clinic-day rules: scheduled_datetime falls on an open day, inside the clinic window, within max_daily_dose_slots, and the patient has no other non-terminal dose on the same dose_date"
    error_id: "ERR_OUTSIDE_CLINIC_HOURS | ERR_NO_DOSE_CAPACITY | ERR_DUPLICATE_ACTIVE_DOSE | ERR_NOT_AN_OPEN_DAY"
    http_status: 409
    applies_to: "POST /otp/dose-dispenses, POST /otp/dose-dispenses/{doseId}/check-in, POST /otp/dose-dispenses/{doseId}/reschedule"

  - priority: 14
    category: business_constraint
    check: "Titration ceiling: ordered_daily_mg may not exceed the previous ordered dose by more than 10 mg, nor exceed the medication ceiling for the program"
    error_id: "ERR_DOSE_TITRATION_TOO_FAST | ERR_DOSE_EXCEEDS_MEDICATION_CEILING"
    http_status: 422
    applies_to: "POST /otp/dose-orders, POST /otp/dose-orders/{doseOrderId}/activate"

  - priority: 15
    category: business_constraint
    check: "Dispense mass balance: dispensed_mg + wasted_mg + returned_mg must equal ordered_mg exactly, and every component must be non-negative"
    error_id: ERR_DOSE_MASS_MISMATCH
    http_status: 422
    applies_to: "POST /otp/dose-dispenses/{doseId}/dispense, POST /otp/dose-dispenses/{doseId}/reschedule"

  - priority: 16
    category: business_constraint
    check: "Partial dispense: the sum of previously dispensed, wasted and returned milligrams plus this movement must not exceed ordered_mg"
    error_id: ERR_PARTIAL_EXCEEDS_ORDERED
    http_status: 422
    applies_to: "POST /otp/dose-dispenses/{doseId}/dispense"

  - priority: 17
    category: business_safety
    check: "Any wasted or destroyed milligram requires a witness staff id that differs from the acting staff member"
    error_id: ERR_WITNESS_REQUIRED
    http_status: 422
    applies_to: "POST /otp/dose-dispenses/{doseId}/dispense, POST /otp/inventory-transactions, POST /otp/inventory-lots/{lotId}/destroy"

  - priority: 18
    category: business_referential
    check: "Take-home carry determination: the patient's time in treatment, journal reconciliation and denial history gates"
    error_id: "ERR_TIME_IN_TREATMENT_INSUFFICIENT | ERR_TIMETABLE_LOOKAHEAD_FAILED | ERR_ACTIVE_DENIAL_HISTORY"
    http_status: 422
    applies_to: "POST /otp/take-home-privileges/{privilegeId}/evaluate"

  - priority: 19
    category: business_safety
    check: "Take-home stability floor: the DIRECTION_B_TAKE_HOME_READINESS reading must clear the phase floor"
    error_id: ERR_STABILITY_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /otp/take-home-privileges/{privilegeId}/evaluate, POST /otp/take-home-exceptions/{exceptionId}/decision"

  - priority: 20
    category: business_fiscal
    check: "Carry quota: the program pool must have a positive remainder, and the privilege must not consume more than its cap"
    error_id: ERR_PROGRAM_CARRY_QUOTA_EXHAUSTED
    http_status: 402
    applies_to: "POST /otp/take-home-privileges/{privilegeId}/evaluate, POST /otp/take-home-exceptions/{exceptionId}/decision"

  - priority: 21
    category: business_fiscal
    check: "Inventory ceiling: the threaded dose must not exceed the selected lot's running_on_hand_mg"
    error_id: ERR_INVENTORY_CEILING_EXCEEDED
    http_status: 402
    applies_to: "POST /otp/inventory-transactions, POST /otp/dose-dispenses/{doseId}/dispense"

  - priority: 22
    category: business_temporal
    check: "Inventory lot usable: the lot must be unexpired at the dispensing instant, must not be QUARANTINED, and must be eligible under the otp_lot_selector candidate set"
    error_id: "ERR_LOT_EXPIRED | ERR_LOT_QUARANTINED | ERR_NO_ELIGIBLE_LOT"
    http_status: 409
    applies_to: "POST /otp/dose-dispenses/{doseId}/dispense, POST /otp/inventory-transactions"

  - priority: 23
    category: business_constraint
    check: "Guest dosing token: the arrangement must be ACTIVE, unexpired and unconsumed when a GUEST_OBSERVED dose is recorded"
    error_id: "ERR_GUEST_TOKEN_INVALID | ERR_GUEST_TOKEN_ALREADY_CONSUMED | ERR_GUEST_DOSING_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /otp/dose-dispenses"

  - priority: 24
    category: business_constraint
    check: "Exception carries must not exceed the applicable carry-table cap for the patient's time in treatment"
    error_id: ERR_EXCEPTION_CARRIES_EXCEED_CAP
    http_status: 422
    applies_to: "POST /otp/take-home-exceptions/{exceptionId}/decision"

  - priority: 25
    category: business_constraint
    check: "Justification and summary text minimum lengths"
    error_id: ERR_JUSTIFICATION_TOO_SHORT
    http_status: 400
    applies_to: "POST /otp/take-home-exceptions, POST /otp/take-home-exceptions/{exceptionId}/route, POST /otp/corrective-actions, POST /otp/diversion-cases/{caseId}/confirm"

  - priority: 26
    category: business_constraint
    check: "Closed-enum and numeric-range checks on every input field declared with a constraints: note"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints: &endpoints

  # --- Clock / test-driving ------------------------------------------------
  - method: POST
    path: "/otp/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and is never the real wall-clock time; this endpoint is the only way to move it."
    roles: [ProgramAdministrator, RegulatoryAuditor]
    code: 200
    input: [to_iso8601]
    output: { logical_clock_utc: string }
    side_effects: ["Every time-derived computation is recomputed on the next read"]

  # --- Programs ------------------------------------------------------------
  - method: POST
    path: "/otp/programs"
    description: "Create a treatment program (clinic)"
    roles: [ProgramAdministrator]
    code: 201
    input: [name, state_code, clinic_hours_start, clinic_hours_end, open_days, max_daily_dose_slots, "max_daily_mg_methadone?", "max_daily_mg_buprenorphine?", "guest_dosing_enabled?", "dose_checkin_grace_minutes?"]
    output: Program
    side_effects: ["posture initialized to NORMAL"]

  - method: GET
    path: "/otp/programs"
    description: "List programs"
    roles: [ProgramAdministrator, Physician, Nurse, Counselor, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: "Program[]"
    side_effects: []

  - method: GET
    path: "/otp/programs/{id}"
    description: "Read a program including its posture"
    roles: [ProgramAdministrator, Physician, Nurse, Counselor, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: POST
    path: "/otp/programs/{id}/suspend"
    description: "Suspend the program; forces posture FROZEN and cancels open work"
    roles: [RegulatoryAuditor]
    code: 200
    input: []
    output: Program
    side_effects: ["Program → SUSPENDED", "open doses → CANCELLED", "held privileges reconciled → DENIED", "guest arrangements → CANCELLED"]

  - method: POST
    path: "/otp/programs/{id}/resume"
    description: "Lift a suspension and recompute posture"
    roles: [RegulatoryAuditor]
    code: 200
    input: []
    output: Program
    side_effects: ["Program → ACTIVE", "posture recomputed by program_posture_ladder"]

  - method: POST
    path: "/otp/programs/{id}/carry-quota"
    description: "Open the program's carry quota ledger"
    roles: [ProgramAdministrator]
    code: 201
    input: [allotted_carries]
    output: CarryQuotaLedger
    side_effects: ["available_carries := allotted_carries"]

  - method: GET
    path: "/otp/programs/{id}/carry-quota"
    description: "Read the program's carry quota ledger as a single-element array"
    roles: [ProgramAdministrator, Physician, Nurse, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: "CarryQuotaLedger[]"
    side_effects: []

  # --- Users ---------------------------------------------------------------
  - method: POST
    path: "/otp/users"
    description: "Register a staff member"
    roles: [ProgramAdministrator]
    code: 201
    input: ["program_id?", full_name, staff_role, "license_number?"]
    output: User
    side_effects: []

  - method: GET
    path: "/otp/users"
    description: "List staff members, filterable by program"
    roles: [ProgramAdministrator, Physician, Nurse, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: ["program_id?"]
    output: "User[]"
    side_effects: []

  - method: GET
    path: "/otp/users/{userId}"
    description: "Read a staff member"
    roles: [ProgramAdministrator, Physician, Nurse, Counselor, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: User
    side_effects: []

  # --- Patients ------------------------------------------------------------
  - method: POST
    path: "/otp/patients"
    description: "Register a patient into a program; starts PENDING_ADMISSION"
    roles: [ProgramAdministrator, Physician]
    code: 201
    input: [program_id, full_name, date_of_birth, government_id_hash, diagnosis_code, home_state_code, home_address, transportation_type, one_way_travel_minutes]
    output: Patient
    side_effects: ["status := PENDING_ADMISSION", "time_in_treatment_days := 0", "stability_score := stability_score_direction_a", "stability_posting := that value"]

  - method: GET
    path: "/otp/patients"
    description: "List patients, filterable by program and status"
    roles: [ProgramAdministrator, Physician, Nurse, Counselor, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/otp/patients/{patientId}"
    description: "Read a patient; stability_score is the DIRECTION_A_STABILITY publication"
    roles: [ProgramAdministrator, Physician, Nurse, Counselor, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/otp/patients/{patientId}/confirm-diagnosis"
    description: "Physician confirms the diagnosis and admits the patient"
    roles: [Physician]
    code: 200
    input: []
    output: Patient
    side_effects: ["Patient → ADMITTED", "admission_datetime := logical clock", "stability_score recomputed"]

  - method: POST
    path: "/otp/patients/{patientId}/reinstate"
    description: "Lift a non-compliance suspension"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Patient
    side_effects: ["Patient → ACTIVE", "risk_score_points += 5.0", "treatment_phase := INDUCTION"]

  - method: POST
    path: "/otp/patients/{patientId}/discharge"
    description: "Discharge the patient administratively"
    roles: [Physician]
    code: 200
    input: [reason_code]
    output: Patient
    side_effects: ["Patient → ADMINISTRATIVELY_DISCHARGED", "open doses → CANCELLED", "active orders → DISCONTINUED", "granted privileges → REVOKED"]

  - method: POST
    path: "/otp/patients/{patientId}/complete-withdrawal"
    description: "Close a medically-managed withdrawal as completed"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Patient
    side_effects: ["Patient → COMPLETED_WITHDRAWAL", "active orders → DISCONTINUED"]

  - method: PATCH
    path: "/otp/patients/{patientId}/treatment-phase"
    description: "Move the patient between treatment phases; also the phase journal advance"
    roles: [Physician, MedicalDirector]
    code: 200
    input: [treatment_phase, "reconciled_days?"]
    output: Patient
    side_effects: ["treatment_phase := value", "journal_reconciled_through_date := logical clock date when reconciled_days >= 1", "counseling_standing recomputed", "stability_score recomputed"]

  - method: GET
    path: "/otp/patients/{patientId}/time-in-treatment-tracker"
    description: "Read the phase journal tracker for this patient, including the dual-enrollment screening flag"
    roles: [ProgramAdministrator, Physician, Nurse, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: "TimeInTreatmentTracker[]"
    side_effects: []

  # --- Dose orders ---------------------------------------------------------
  - method: POST
    path: "/otp/dose-orders"
    description: "Create a dose order"
    roles: [Physician]
    code: 201
    input: [patient_id, medication, ordered_daily_mg, "split_dose_authorized?"]
    output: DoseOrder
    side_effects: ["status := DRAFT", "medication_ceiling_mg snapshotted from the program", "previous_ordered_daily_mg := 0.0"]

  - method: GET
    path: "/otp/dose-orders"
    description: "List dose orders, filterable by patient"
    roles: [ProgramAdministrator, Physician, Nurse, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: ["patient_id?", "program_id?", "status?", "limit?", "offset?"]
    output: "DoseOrder[]"
    side_effects: []

  - method: GET
    path: "/otp/dose-orders/{doseOrderId}"
    description: "Read a dose order"
    roles: [ProgramAdministrator, Physician, Nurse, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: DoseOrder
    side_effects: []

  - method: POST
    path: "/otp/dose-orders/{doseOrderId}/activate"
    description: "Activate a dose order and enrol the patient into the dosing population"
    roles: [Physician]
    code: 200
    input: []
    output: DoseOrder
    side_effects: ["DoseOrder → ACTIVE", "Patient → ACTIVE when ADMITTED", "phase_at_authorization := Patient.treatment_phase"]

  - method: POST
    path: "/otp/dose-orders/{doseOrderId}/suspend"
    description: "Suspend an active dose order"
    roles: [Physician]
    code: 200
    input: []
    output: DoseOrder
    side_effects: ["DoseOrder → SUSPENDED", "scheduled doses → CANCELLED"]

  - method: POST
    path: "/otp/dose-orders/{doseOrderId}/discontinue"
    description: "Discontinue a dose order"
    roles: [Physician]
    code: 200
    input: []
    output: DoseOrder
    side_effects: ["DoseOrder → DISCONTINUED", "scheduled doses → CANCELLED"]

  # --- Dose dispenses ------------------------------------------------------
  - method: POST
    path: "/otp/dose-dispenses"
    description: "Schedule a dose. For GUEST_OBSERVED the guest token is redeemed here; for TAKE_HOME_ISSUANCE the dose must reference an approved privilege"
    roles: [Nurse, ProgramAdministrator]
    code: 201
    input: [dose_order_id, dose_date, scheduled_datetime, "source_type?", "inventory_lot_id?", "guest_arrangement_id?", "privilege_id?"]
    output: DoseDispense
    side_effects: ["status := SCHEDULED", "carry_count := 1 when source_type == TAKE_HOME_ISSUANCE else 0", "ordered_mg := the active order's ordered_daily_mg snapshot"]

  - method: GET
    path: "/otp/dose-dispenses"
    description: "List doses, filterable by order, patient, program, privilege, guest arrangement, source type and status"
    roles: [ProgramAdministrator, Physician, Nurse, Counselor, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: ["dose_order_id?", "patient_id?", "program_id?", "privilege_id?", "guest_arrangement_id?", "inventory_lot_id?", "source_type?", "status?", "dose_date?", "limit?", "offset?"]
    output: "DoseDispense[]"
    side_effects: []

  - method: GET
    path: "/otp/dose-dispenses/{doseId}"
    description: "Read a dose"
    roles: [ProgramAdministrator, Physician, Nurse, Counselor, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: DoseDispense
    side_effects: []

  - method: POST
    path: "/otp/dose-dispenses/{doseId}/check-in"
    description: "Patient check-in at the clinic"
    roles: [Nurse]
    code: 200
    input: []
    output: DoseDispense
    side_effects: ["DoseDispense → ARRIVED_AT_CLINIC", "arrived_at := logical clock"]

  - method: POST
    path: "/otp/dose-dispenses/{doseId}/verify"
    description: "Nurse identity verification against the dose and the frozen order"
    roles: [Nurse]
    code: 200
    input: [identity_matched]
    output: DoseDispense
    side_effects: ["DoseDispense → NURSE_VERIFIED or VERIFICATION_FAILED", "verification_staff_id := X-User-ID"]

  - method: POST
    path: "/otp/dose-dispenses/{doseId}/dispense"
    description: "Thread the dose from inventory and append the inventory movements"
    roles: [Nurse]
    code: 200
    input: [dispensed_mg, "wasted_mg?", "returned_mg?", "inventory_lot_id?", "witness_staff_id?"]
    output: DoseDispense
    side_effects: ["DoseDispense → DISPENSED", "InventoryTransaction rows appended", "InventoryLot.running_on_hand_mg recomputed", "otp_dose_tariff computed"]

  - method: POST
    path: "/otp/dose-dispenses/{doseId}/complete"
    description: "Close out a dispensed dose"
    roles: [Nurse]
    code: 200
    input: ["dispensed_mg?", "wasted_mg?", "returned_mg?"]
    output: DoseDispense
    side_effects: ["DoseDispense → COMPLETED", "completed_at := logical clock", "take home ledger conserved quantities recomputed"]

  - method: POST
    path: "/otp/dose-dispenses/{doseId}/refuse"
    description: "Record a patient refusal"
    roles: [Nurse]
    code: 200
    input: []
    output: DoseDispense
    side_effects: ["DoseDispense → REFUSED", "completed_at := logical clock"]

  - method: POST
    path: "/otp/dose-dispenses/{doseId}/cancel"
    description: "Cancel a dose before completion"
    roles: [Nurse, Physician]
    code: 200
    input: []
    output: DoseDispense
    side_effects: ["DoseDispense → CANCELLED", "completed_at := logical clock"]

  - method: POST
    path: "/otp/dose-dispenses/{doseId}/reschedule"
    description: "Reschedule a non-terminal dose and apply a reschedule tariff"
    roles: [Nurse, ProgramAdministrator]
    code: 200
    input: [new_scheduled_datetime, executed_carries, schedule_id]
    output: DoseDispense
    side_effects: ["scheduled_datetime := new_scheduled_datetime", "otp_dose_tariff recomputed with the reschedule surcharge"]

  - method: POST
    path: "/otp/dose-dispenses/{doseId}/mark-missed"
    description: "Record that an overdue dose was not taken"
    roles: [Nurse, Physician]
    code: 200
    input: []
    output: DoseDispense
    side_effects: ["DoseDispense → MISSED", "denial_count_12mo and missed_dose_streak recomputed", "Patient → SUSPENDED_NON_COMPLIANT when the streak reaches 3"]

  - method: GET
    path: "/otp/dose-dispenses/{doseId}/charge-preview"
    description: "Return the tariff for an already-dispensed dose in both rounding variants, for reconciliation"
    roles: [ProgramAdministrator, RegulatoryAuditor]
    code: 200
    input: []
    output: { total_charge_per_component_rounded: number, total_charge_sum_then_round: number, per_component_delta: number }
    side_effects: []

  # --- Take-home privileges ------------------------------------------------
  - method: POST
    path: "/otp/take-home-privileges"
    description: "Open a take-home privilege request; carries are held pending review"
    roles: [MedicalDirector]
    code: 201
    input: [patient_id, requested_carries, carry_interval_days, expected_patient_version, "reissued_from_privilege_id?"]
    output: TakeHomePrivilege
    side_effects: ["decision := PENDING_REVIEW", "hold_ledger_delta := -1", "TakeHomeCarryLedger.charges_held += 1", "TakeHomeCarryLedger.carries_held += 1"]

  - method: GET
    path: "/otp/take-home-privileges"
    description: "List privileges, filterable by patient, program and decision"
    roles: [ProgramAdministrator, Physician, Nurse, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: ["patient_id?", "program_id?", "decision?", "exception_id?", "reissued_from_privilege_id?", "limit?", "offset?"]
    output: "TakeHomePrivilege[]"
    side_effects: []

  - method: GET
    path: "/otp/take-home-privileges/{privilegeId}"
    description: "Read a privilege including its eligible carry cap"
    roles: [ProgramAdministrator, Physician, Nurse, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: TakeHomePrivilege
    side_effects: []

  - method: POST
    path: "/otp/take-home-privileges/{privilegeId}/evaluate"
    description: "Evaluate a held or denied privilege against the carry tables"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: TakeHomePrivilege
    side_effects: ["decision → APPROVED or DENIED", "eligible_carry_cap := carry_cap_waterfall", "hold_ledger_delta := 0", "charges_held -= 1", "CarryQuotaLedger.granted_carries updated"]

  - method: POST
    path: "/otp/take-home-privileges/{privilegeId}/revoke"
    description: "Revoke a granted privilege and release its carry quota"
    roles: [MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: TakeHomePrivilege
    side_effects: ["decision → REVOKED", "freed_carries := approved_carries", "scheduled take-home doses → CANCELLED", "CarryQuotaLedger.granted_carries -= freed_carries"]

  # --- Take-home exceptions ------------------------------------------------
  - method: POST
    path: "/otp/take-home-exceptions"
    description: "Open a documented exception request against a denied privilege"
    roles: [Physician]
    code: 201
    input: [patient_id, requested_carries, exception_type, clinical_justification, supervisor_id, expected_privilege_version]
    output: TakeHomeException
    side_effects: ["status := REQUESTED", "requesting_physician_id := X-User-ID"]

  - method: GET
    path: "/otp/take-home-exceptions"
    description: "List exceptions, filterable by patient, program and status"
    roles: [ProgramAdministrator, Physician, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: ["patient_id?", "program_id?", "status?", "requesting_physician_id?", "supervisor_id?", "limit?", "offset?"]
    output: "TakeHomeException[]"
    side_effects: []

  - method: GET
    path: "/otp/take-home-exceptions/{exceptionId}"
    description: "Read an exception including its grant cap and domain-B evaluation flag"
    roles: [ProgramAdministrator, Physician, Nurse, MedicalDirector, RegulatoryAuditor]
    code: 200
    input: []
    output: TakeHomeException
    side_effects: []

  - method: POST
    path: "/otp/take-home-exceptions/{exceptionId}/route"
    description: "Route an exception to the medical director for review"
    roles: [Physician]
    code: 200
    input: []
    output: TakeHomeException
    side_effects: ["status → SUPERVISOR_REVIEW", "evaluated_domain_b := DIRECTION_B score cleared the floor"]

  - method: POST
    path: "/otp/take-home-exceptions/{exceptionId}/decision"
    description: "Medical director grants or denies an exception"
    roles: [MedicalDirector]
    code: 200
    input: [decision, "granted_carries?"]
    output: TakeHomeException
    side_effects: ["status → GRANTED or DENIED", "linked privilege → APPROVED_WITH_EXCEPTION", "phase_stability_exception_cap applied"]

  - method: POST
    path: "/otp/take-home-exceptions/{exceptionId}/revoke"
    description: "Revoke a granted exception"
    roles: [MedicalDirector]
    code: 200
    input: []
    output: TakeHomeException
    side_effects: ["status → REVOKED", "linked privilege → REVOKED"]

  # --- Carry ledgers -------------------------------------------------------
  - method: GET
    path: "/otp/take-home-carry-ledgers"
    description: "List carry ledgers, filterable by patient"
    roles: [ProgramAdministrator, Physician, Nurse, MedicalDirector, RegulatoryAuditor]
