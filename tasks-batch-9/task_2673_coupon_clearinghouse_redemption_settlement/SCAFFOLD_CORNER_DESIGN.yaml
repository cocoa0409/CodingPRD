  # =====================================================================
  # Cross-Cutting Complexity Layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: statement_issue_refuses_a_submission_version_token_that_has_advanced
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.statement-issue-stale-submission
          - errors.ERR_STALE_SUBMISSION_VERSION
          - endpoints.POST./settlement-statements
        distinguishing_aspect: |
          The §1.2.1 rule for Submission, exercised on its declared write_endpoint
          with its declared occ_field. The interesting part is that nothing else
          stops the second issue — a closed submission legitimately accepts a
          superseding statement — so the 412 is purely the version token, and the
          token that goes stale is the one the endpoint itself invalidated by
          bumping Submission.version on the previous successful issue. The refused
          call must create no statement at all.
        test_recipe:
          setup:
            - "one retailer, one ACTIVE offer, and a settled single-coupon submission whose lot is VALIDATED at 50 face and 7 fee"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-1", transaction_date: "2026-07-05", qualifying_units: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 1, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/verify-count"
              payload: { verified_count: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 1 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_id: $.data.id }
            - call: "POST /submission-lots/${lot_id}/items"
              payload: { items: [ { scanned_barcode: "8110380000005001261231030", image_uri: "s3://v1.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-1" } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submission-lots/${lot_id}/finalize"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
          trigger:
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: SettlementOfficer
              as_user_id: "so-1"
              captures: { v1: $.data.version }
            - call: "POST /settlement-statements"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${v1}" }
              as: SettlementOfficer
              as_user_id: "so-1"
            - call: "POST /settlement-statements"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${v1}" }
              as: SettlementOfficer
              as_user_id: "so-1"
            - call: "GET /settlement-statements?submission_id=${sub_id}"
              payload: {}
              as: SettlementOfficer
              as_user_id: "so-1"
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: SettlementOfficer
              as_user_id: "so-1"
              captures: { v2: $.data.version }
            - call: "POST /settlement-statements"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${v2}" }
              as: SettlementOfficer
              as_user_id: "so-1"
            - call: "GET /settlement-statements?submission_id=${sub_id}"
              payload: {}
              as: SettlementOfficer
              as_user_id: "so-1"
          assert:
            - "trigger call 2: 201 with data.status == \"DRAFT\", gross_face_value_cents 50, handling_fee_total_cents 7, holdback_pct \"0.00\", net_payable_cents 57"
            - "trigger call 3: 412 with error.code == \"ERR_STALE_SUBMISSION_VERSION\" — the token from trigger call 1 was consumed by the write in trigger call 2"
            - "trigger call 4: total_count == 1 — the refused issue wrote nothing"
            - "trigger call 5: data.version is exactly one greater than the version captured in trigger call 1, and the refused call did not bump it a second time"
            - "trigger call 6: 201 — the same body with the refreshed token succeeds, so the 412 was the token and not a state precondition"
            - "trigger call 7: total_count == 2 and both statements are \"DRAFT\" with net_payable_cents 57"

      - name: fraud_rescore_refuses_a_retailer_version_token_that_has_advanced
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.fraud-rescore-stale-retailer
          - errors.ERR_STALE_RETAILER_VERSION
          - endpoints.POST./retailers/{id}/fraud-rescore
        distinguishing_aspect: |
          The second §1.2.1 rule, on a different parent entity with a different
          occ_field and a different error code, and on an endpoint whose result is
          otherwise idempotent: rescoring clean history twice writes the same
          score, so a naive "no change, no version bump" implementation would let
          the stale token through. The version must advance on the successful
          rescore even though every score field is unchanged, and the refused
          rescore must leave last_rescored_at where it was.
        test_recipe:
          setup:
            - "one retailer with a single settled clean submission, so every rate is zero and the weighted score is 0.00"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
