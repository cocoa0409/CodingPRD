            - { call: "POST /label-approvals/${label_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /label-approvals/${label_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /production-days/${day_id}/finished-lots", payload: { source_lot_id: "${lot_id}", label_approval_id: "${label_id}", units_produced: 60, unit_weight_lbs: 10.0, shelf_life_days: 10 }, as: ProductionManager, captures: { fl1_id: $.data.id } }
          trigger:
            - { call: "POST /production-days/${day_id}/finished-lots", payload: { source_lot_id: "${lot_id}", label_approval_id: "${label_id}", units_produced: 40, unit_weight_lbs: 10.0, shelf_life_days: 10 }, as: ProductionManager, captures: { fl2_id: $.data.id, fl2_total: $.data.total_weight_lbs } }
