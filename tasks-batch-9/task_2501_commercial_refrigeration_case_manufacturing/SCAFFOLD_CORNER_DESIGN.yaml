      - name: energy_use_index_lab_and_field_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.energy_use_index
          - entities.EnergyTest.fields.field_projected_index
        excluded_because:
          difficulty_instance: dual_variant_calc / energy_index_lab_variant_versus_field_variant_divergence
          rationale: "The named §1.8 instance pins both variants on the same test and asserts lab_rated_index 0.644 against field_projected_index 0.823 with field_exceedance true."

      - name: refrigerant_charge_basis_selects_installed_for_compliance
        claim_type: variant_selection
        grounds:
          - calculations.refrigerant_charge_basis
          - validations[priority=11]
        excluded_because:
          difficulty_instance: dual_variant_calc / refrigerant_charge_nameplate_basis_versus_installed_basis
          rationale: "The named §1.8 instance asserts which of the two charge bases the priority-11 safety check consumes, and that only the installed basis triggers the limit."

  # ==========================================================================
  # SECTION 4 — VALIDATIONS (claim-extraction-guide Table 4)
  # ==========================================================================
  - section: validations
    instances:

      - name: duplicate_refrigerant_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_DUPLICATE_CODE]
          - entities.Refrigerant.fields.refrigerant_code
        distinguishing_aspect: "refrigerant_code is globally unique, so a second POST /refrigerants reusing R-448A returns 409 ERR_DUPLICATE_CODE even though every other field differs."
        test_recipe:
          setup:
            - "Refrigerant R-448A already exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Duplicate Blend", gwp_100yr: 900, safety_class: "A2L", max_charge_grams: 4000, allowed_system_types: ["SELF_CONTAINED"] }, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_DUPLICATE_CODE\""

      - name: open_case_declaring_glass_doors_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_DOOR_CONFIG_INVALID]
          - entities.CaseModel.fields.glass_door_count
        distinguishing_aspect: "The priority-17 door check runs at creation: door_type OPEN with glass_door_count 3 is 422 ERR_DOOR_CONFIG_INVALID, so no CaseModel row is persisted to later pick up anti-sweat load."
        test_recipe:
          setup:
            - "Refrigerant R-448A exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-BAD-DOOR", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 3, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_DOOR_CONFIG_INVALID\""
            - "GET /case-models returns total_count == 0"

      - name: self_contained_case_with_line_set_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_LINE_SET_NOT_PERMITTED]
          - entities.CaseModel.fields.line_set_length_ft
        distinguishing_aspect: "A SELF_CONTAINED case carries no field line set, so line_set_length_ft 40 is rejected 422 ERR_LINE_SET_NOT_PERMITTED at creation — the mirror case (REMOTE with 0) is rejected by the same check."
        test_recipe:
          setup:
            - "Refrigerant R-290 (propane, SELF_CONTAINED only) exists."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-290", trade_name: "Propane", gwp_100yr: 3, safety_class: "A3", max_charge_grams: 300, allowed_system_types: ["SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-SC-6", application: "GRAB_AND_GO", temperature_class: "MT", system_type: "SELF_CONTAINED", refrigerant_id: "${ref_id}", nominal_length_ft: 6, tda_sqft: 19.8, charge_grams: 280, line_set_length_ft: 40, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.50, case_air_temp_c: 3.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 11.0, fan_w_per_ft: 9.0, defrost_cycles_per_day: 4 }, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_LINE_SET_NOT_PERMITTED\""

      - name: airflow_model_with_incompatible_refrigerant_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_REFRIGERANT_SYSTEM_TYPE_INCOMPATIBLE]
          - entities.Refrigerant.fields.allowed_system_types
        distinguishing_aspect: "Compatibility is checked against the referenced Refrigerant row, not the request body: a REMOTE case pointing at R-290 (allowed_system_types [SELF_CONTAINED]) is created successfully but fails the airflow model with 422, leaving status DRAFT."
        test_recipe:
          setup:
            - "Refrigerant R-290 with allowed_system_types [SELF_CONTAINED] exists."
            - "CaseModel MDL-MT-8R is a REMOTE case referencing R-290 and is in DRAFT."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-290", trade_name: "Propane", gwp_100yr: 3, safety_class: "A3", max_charge_grams: 300, allowed_system_types: ["SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8R", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 280, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
          trigger:
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { err: "$.data.error_id" } }
            - { call: "GET /case-models/${cm_id}", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
          assert:
            - "First call: HTTP 422, data.error_id == \"ERR_REFRIGERANT_SYSTEM_TYPE_INCOMPATIBLE\""
            - "Second call: data.status == \"DRAFT\", data.total_design_load_w is null, data.version == 1"

      - name: energy_test_against_wrong_class_standard_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=13]
          - errors[ERR_STANDARD_NOT_APPLICABLE]
          - entities.EnergyStandard.fields.temperature_class
        distinguishing_aspect: "The standard must match the model's own temperature class: scheduling an MT model against the LT standard DOE-2027-RSC-LT returns 422 ERR_STANDARD_NOT_APPLICABLE at priority 13, before the chamber checks at 22-24."
        test_recipe:
          setup:
            - "R-448A, the LT standard DOE-2027-RSC-LT and chamber CH-1 (supports HT/MT/LT) exist."
            - "MDL-MT-8 (temperature_class MT) is SUBMITTED_FOR_TEST."
          setup_api_calls:
            - { call: "POST /refrigerants", as: PlatformAdmin, as_user_id: "admin-001", payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }, captures: { ref_id: "$.data.id" } }
            - { call: "POST /energy-standards", as: ComplianceOfficer, as_user_id: "co-001", payload: { standard_code: "DOE-2027-RSC-LT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.90, limit_constant_b: 1.50, temperature_class: "LT", system_type_scope: "ANY" }, captures: { std_id: "$.data.id" } }
            - { call: "POST /test-chambers", as: PlatformAdmin, as_user_id: "admin-001", payload: { chamber_code: "CH-1", name: "Energy Lab Chamber 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }, captures: { ch_id: "$.data.id" } }
            - { call: "POST /case-models", as: DesignEngineer, as_user_id: "eng-001", payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }, captures: { cm_id: "$.data.id" } }
            - { call: "POST /case-models/${cm_id}/airflow-model", as: DesignEngineer, as_user_id: "eng-001", payload: {} }
            - { call: "POST /case-models/${cm_id}/submit-for-test", as: DesignEngineer, as_user_id: "eng-001", payload: {}, captures: { cm_v: "$.data.version" } }
          trigger:
            - { call: "POST /energy-tests", as: TestLabTechnician, as_user_id: "lab-001", payload: { case_model_id: "${cm_id}", test_chamber_id: "${ch_id}", energy_standard_id: "${std_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422"
