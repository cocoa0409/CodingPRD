  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trip_reject_loops_back_to_draft
        grounds:
          - state_machines.FieldTrip.PENDING_PRINCIPAL_to_DRAFT
          - state_machines.FieldTrip.PENDING_DISTRICT_to_DRAFT
          - state_machines.FieldTrip.DRAFT_to_PENDING_PRINCIPAL
        distinguishing_aspect: |
          FieldTrip is cyclic: a PRINCIPAL REJECT sends PENDING_PRINCIPAL → DRAFT,
          and the same trip can be resubmitted DRAFT → PENDING_PRINCIPAL, proving a
          revision loop rather than a one-way pipeline (on the FieldTrip entity).
        test_recipe:
          setup:
            - "Trip submitted, now PENDING_PRINCIPAL."
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "T5", email: "t5@x.com", phone: "555-0005" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "Farm", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "ELEMENTARY", depart_at: "2026-09-09T09:00:00Z", return_at: "2026-09-09T12:00:00Z", capacity: 10, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
          trigger:
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "PRINCIPAL", decision: "REJECT", comment: "fix budget" }
              as: Principal
            - call: "GET /field-trips/${trip}"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_after_reject: $.data.status }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_after_resubmit: $.data.status }
          assert:
            - "FieldTrip.${trip}.status == DRAFT immediately after PRINCIPAL REJECT"
            - "FieldTrip.${trip}.status == PENDING_PRINCIPAL after resubmit (cycle closed)"
            - "A TripApproval record with step=PRINCIPAL, decision=REJECT exists for the trip"

