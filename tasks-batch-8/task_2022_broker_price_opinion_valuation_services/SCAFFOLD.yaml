    roles: [ComplianceOfficer, PlatformAdmin, OperationsManager, DispatchCoordinator, Broker, QCReviewer]
    code: 200
    input: ["limit?", "offset?", "photo_kind?"]
    output: PhotoEvidence[]
    side_effects: []

  # --- Valuation orders
  - method: POST
    path: /bpo/valuation-orders
    description: "Create a new valuation order (in INTAKE)"
    roles: [ClientAdmin, OperationsManager]
    code: 201
    input: [property_id, order_kind, inspection_level, "priority?", agreed_fee_cents, client_id]
    output: ValuationOrder
    side_effects: ["Validates property/state regulation preconditions"]

  - method: GET
    path: /bpo/valuation-orders
    description: "List valuation orders"
    roles: [PlatformAdmin, OperationsManager, DispatchCoordinator, BillingClerk, QCReviewer, ClientAdmin, Broker]
    code: 200
    input: ["limit?", "offset?", "fulfillment_status?", "payment_status?", "client_id?", "assigned_broker_id?", "property_id?"]
    output: ValuationOrder[]
    side_effects: []

  - method: GET
    path: /bpo/valuation-orders/{id}
    description: "Get a single valuation order"
    roles: [PlatformAdmin, OperationsManager, DispatchCoordinator, BillingClerk, QCReviewer, ClientAdmin, Broker]
    code: 200
    input: []
    output: ValuationOrder
    side_effects: []

  - method: POST
    path: /bpo/valuation-orders/{id}/submit
    description: "Transition order INTAKE → READY_FOR_DISPATCH after compliance checks"
    roles: [ClientAdmin]
    code: 200
    input: []
    output: ValuationOrder
    side_effects: ["Increments ValuationOrder.version by 1"]

  - method: POST
    path: /bpo/valuation-orders/{id}/dispatch
    description: "Transition order READY_FOR_DISPATCH → DISPATCHED, assigns broker"
    roles: [DispatchCoordinator]
    code: 200
    input: [broker_id, expected_order_version]
    output: ValuationOrder
    side_effects: ["assigned_broker_id := broker_id", "sla_due_at computed via sla_due_at calc", "Broker.open_order_count incremented", "Increments ValuationOrder.version by 1"]

  - method: POST
    path: /bpo/valuation-orders/{id}/accept
    description: "Broker accepts a dispatched order"
    roles: [Broker]
    code: 200
    input: []
    output: ValuationOrder
    side_effects: ["Increments ValuationOrder.version by 1"]

  - method: POST
    path: /bpo/valuation-orders/{id}/decline
    description: "Broker declines a dispatched order (returns to READY_FOR_DISPATCH)"
    roles: [Broker]
    code: 200
    input: []
    output: ValuationOrder
    side_effects: ["assigned_broker_id := null", "Broker.open_order_count decremented", "Broker.decline_count incremented", "Increments ValuationOrder.version by 1"]

  - method: POST
    path: /bpo/valuation-orders/{id}/cancel
    description: "Client cancels an order in INTAKE/READY_FOR_DISPATCH/DISPATCHED"
    roles: [ClientAdmin]
    code: 200
    input: []
    output: ValuationOrder
    side_effects: ["Cascade cancels DRAFT comparables and fee lines", "If DISPATCHED, releases assigned broker", "Increments ValuationOrder.version by 1"]

  # --- Comparables
  - method: POST
    path: /bpo/valuation-orders/{id}/comparables
    description: "Add a comparable to an order (DRAFT)"
    roles: [Broker, OperationsManager]
    code: 201
    input: [source_property_id, sale_price_cents, sale_date, distance_miles, adjustment_cents]
    output: Comparable
    side_effects: ["Validates adjustment cap and radius", "Computes adjusted_value_cents"]

  - method: GET
    path: /bpo/valuation-orders/{id}/comparables
    description: "List comparables for an order"
    roles: [Broker, OperationsManager, QCReviewer, DispatchCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Comparable[]
    side_effects: []

  - method: POST
    path: /bpo/valuation-orders/{id}/comparables/{comp_id}/select
    description: "Mark a comparable as SELECTED"
    roles: [Broker]
    code: 200
    input: []
    output: Comparable
    side_effects: ["Revalidates radius + adjustment cap"]

  - method: POST
    path: /bpo/valuation-orders/{id}/comparables/{comp_id}/reject
    description: "Mark a comparable as REJECTED"
    roles: [Broker, QCReviewer]
    code: 200
    input: []
    output: Comparable
    side_effects: []

  # --- Photo evidence
  - method: POST
    path: /bpo/valuation-orders/{id}/photos
    description: "Upload a photo evidence row"
    roles: [Broker]
    code: 201
    input: [photo_kind, file_url, captured_at]
    output: PhotoEvidence
    side_effects: ["Sets uploaded_by_broker_id from X-User-ID"]

  - method: GET
    path: /bpo/valuation-orders/{id}/photos
    description: "List photo evidence for an order"
    roles: [Broker, OperationsManager, QCReviewer, DispatchCoordinator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "photo_kind?"]
    output: PhotoEvidence[]
    side_effects: []

  # --- Fee lines
  - method: POST
    path: /bpo/valuation-orders/{id}/fee-lines
    description: "Add a fee line (DRAFT)"
    roles: [Broker, OperationsManager, BillingClerk]
    code: 201
    input: [fee_kind, description, amount_cents]
    output: FeeLine
    side_effects: []

  - method: GET
    path: /bpo/valuation-orders/{id}/fee-lines
    description: "List fee lines for an order"
    roles: [Broker, OperationsManager, BillingClerk, QCReviewer, PlatformAdmin, ClientAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: FeeLine[]
    side_effects: []

  - method: POST
    path: /bpo/valuation-orders/{id}/fee-lines/{fee_id}/confirm
    description: "Confirm a fee line (DRAFT → CONFIRMED)"
    roles: [BillingClerk, OperationsManager]
    code: 200
    input: []
    output: FeeLine
    side_effects: []

  - method: POST
    path: /bpo/valuation-orders/{id}/fee-lines/{fee_id}/cancel
    description: "Cancel a DRAFT fee line"
    roles: [BillingClerk, OperationsManager]
    code: 200
    input: []
    output: FeeLine
    side_effects: []

  # --- Report & QC
  - method: POST
    path: /bpo/valuation-orders/{id}/report
    description: "Submit report (IN_PROGRESS → REPORT_SUBMITTED)"
    roles: [Broker]
    code: 200
    input: []
    output: ValuationOrder
    side_effects: ["Validates comparable floor, photo floor, fee reconciliation", "Increments ValuationOrder.version by 1"]

  - method: POST
    path: /bpo/valuation-orders/{id}/qc/open
    description: "Open a QC review cycle"
    roles: [QCReviewer]
    code: 201
    input: []
    output: QCReview
    side_effects: ["Increments ValuationOrder.version by 1"]

  - method: GET
    path: /bpo/valuation-orders/{id}/qc
    description: "List QC reviews for an order"
    roles: [QCReviewer, OperationsManager, PlatformAdmin, Broker]
    code: 200
    input: ["limit?", "offset?"]
    output: QCReview[]
    side_effects: []

  - method: GET
    path: /bpo/qc-reviews/{id}
    description: "Get a single QC review by id"
    roles: [QCReviewer, OperationsManager, PlatformAdmin]
    code: 200
    input: []
    output: QCReview
    side_effects: []

  - method: GET
    path: /bpo/qc-reviews/{id}/revisions
    description: "List revision requests produced by this QC review (reverse lookup on qc_review_id)"
    roles: [QCReviewer, OperationsManager, PlatformAdmin, Broker]
    code: 200
    input: ["limit?", "offset?", "outcome?"]
    output: QCRevisionRequest[]
    side_effects: []

  - method: POST
    path: /bpo/valuation-orders/{id}/qc/{qc_id}/verdict
    description: "Record QC verdict (APPROVE/REVISE/REJECT)"
    roles: [QCReviewer]
    code: 200
    input: [verdict, defects_found, notes]
    output: QCReview
    side_effects: ["Sets reviewed_at", "Triggers composite_score recompute", "On REVISE creates QCRevisionRequest", "On REJECT cancels DRAFT fee lines and releases broker capacity", "Increments ValuationOrder.version by 1"]

  - method: GET
    path: /bpo/valuation-orders/{id}/revisions
    description: "List revision requests for an order"
    roles: [QCReviewer, OperationsManager, Broker, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "outcome?"]
    output: QCRevisionRequest[]
    side_effects: []

  - method: POST
    path: /bpo/valuation-orders/{id}/revision/{rev_id}/resubmit
    description: "Broker resubmits a revision (REVISION_REQUESTED → REPORT_SUBMITTED)"
    roles: [Broker]
    code: 200
    input: []
    output: QCRevisionRequest
    side_effects: ["Sets resolved_at, outcome", "Increments ValuationOrder.version by 1"]

  - method: POST
    path: /bpo/valuation-orders/{id}/complete
    description: "Complete an accepted order (computes late fee and net payable)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: ValuationOrder
    side_effects: ["Computes days_late, late_penalty_cents, net_payable_cents", "Releases broker capacity", "Triggers composite_score recompute", "Increments ValuationOrder.version by 1"]

  # --- Payout batches
  - method: POST
    path: /bpo/payout-batches
    description: "Open a payout batch for a broker + period"
    roles: [BillingClerk]
    code: 201
    input: [broker_id, period_start, period_end]
    output: PayoutBatch
    side_effects: ["Computes total_payable_cents and order_count"]

  - method: GET
    path: /bpo/payout-batches
    description: "List payout batches"
    roles: [BillingClerk, OperationsManager, PlatformAdmin, Broker]
    code: 200
    input: ["limit?", "offset?", "broker_id?", "status?"]
    output: PayoutBatch[]
    side_effects: []

  - method: GET
    path: /bpo/payout-batches/{id}
    description: "Get a payout batch"
    roles: [BillingClerk, OperationsManager, PlatformAdmin, Broker]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []

  - method: POST
    path: /bpo/payout-batches/{id}/approve
    description: "Approve a payout batch (OCC-guarded)"
    roles: [BillingClerk]
    code: 200
    input: [expected_batch_version]
    output: PayoutBatch
    side_effects: ["Snapshots total_payable_cents", "Increments PayoutBatch.version by 1"]

  - method: POST
    path: /bpo/payout-batches/{id}/disburse
    description: "Disburse a payout batch (marks contributing orders PAID)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["For each contributing order set payment_status := PAID", "Increments PayoutBatch.version by 1"]

  - method: POST
    path: /bpo/payout-batches/{id}/void
    description: "Void an open payout batch"
    roles: [BillingClerk]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["Increments PayoutBatch.version by 1"]

  # --- Volume forecast
  - method: POST
    path: /bpo/volume-forecasts
    description: "Generate a volume forecast for a state+month"
    roles: [OperationsManager, PlatformAdmin]
    code: 201
    input: [state_code, forecast_month]
    output: VolumeForecast
    side_effects: ["Runs volume_forecast calculation"]

  - method: GET
    path: /bpo/volume-forecasts
    description: "List volume forecasts"
    roles: [OperationsManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "state_code?", "forecast_month?"]
    output: VolumeForecast[]
    side_effects: []

  # --- Test-driving endpoints (clock)
  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint: set the server's logical UTC clock. Default at startup is 2026-08-01T00:00:00Z; this endpoint MUST be honored by all time-dependent calculations (sla_due_at, days_late, late_fee, revision due_at, forecast window, composite_score window)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets logical clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted to invoke this endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed role's X-User-ID does not match resource owner" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which this transition is permitted" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Request body fails type/range/enum/pattern validation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match parent entity's current version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "QCReviewer X-User-ID equals assigned broker's opaque id" }
  - { id: ERR_LICENSE_NOT_VALID_FOR_STATE, http: 422, condition: "Broker lacks a valid license covering the order's state and kind" }
  - { id: ERR_BPO_NOT_PERMITTED, http: 422, condition: "BPO product ordered in a state where bpo_permitted is false" }
  - { id: ERR_INTERIOR_REQUIRES_APPRAISAL, http: 422, condition: "Interior inspection ordered as BPO in a state requiring APPRAISAL for interior" }
  - { id: ERR_STATE_REGULATION_SUSPENDED, http: 409, condition: "StateRegulation row for subject's state is SUSPENDED" }
  - { id: ERR_PROPERTY_NOT_REGISTERED, http: 409, condition: "Property.status is not REGISTERED" }
  - { id: ERR_INSUFFICIENT_COMPARABLES, http: 422, condition: "Fewer than required SELECTED comparables (3 drive-by, 4 interior)" }
  - { id: ERR_INSUFFICIENT_PHOTOS, http: 422, condition: "Photo evidence does not meet the inspection-level minimum" }
  - { id: ERR_FEE_RECONCILE_MISMATCH, http: 422, condition: "Sum of non-cancelled FeeLine amounts != agreed_fee_cents" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_CAP, http: 422, condition: "|adjustment_cents| exceeds 25% of sale_price_cents" }
  - { id: ERR_ADJUSTMENT_NONPOSITIVE, http: 422, condition: "adjusted_value_cents would be <= 0" }
  - { id: ERR_COMPARABLE_RADIUS_VIOLATION, http: 422, condition: "distance_miles below state minimum radius for inspection level" }
  - { id: ERR_BROKER_CAPACITY_FULL, http: 409, condition: "Broker at max_concurrent_orders" }
  - { id: ERR_ORDER_ALREADY_DISPATCHED, http: 409, condition: "Order already has an assigned_broker_id at dispatch" }
  - { id: ERR_QC_CYCLE_ALREADY_OPEN, http: 409, condition: "Another QCReview cycle is currently OPEN for this order" }
  - { id: ERR_QC_CYCLE_STALE, http: 409, condition: "Verdict targets a QC cycle that is not the latest" }
  - { id: ERR_REVISION_NOT_OPEN, http: 409, condition: "QCRevisionRequest.outcome is not OPEN" }
  - { id: ERR_OPEN_REVISION_EXISTS, http: 409, condition: "An OPEN QCRevisionRequest remains when completing order" }
  - { id: ERR_EMPTY_BATCH, http: 409, condition: "PayoutBatch.order_count == 0 at approval" }
  - { id: ERR_ORDER_NOT_COMPLETED, http: 409, condition: "A contributing order is not COMPLETED at disburse" }
  - { id: ERR_OPEN_ORDERS_EXIST, http: 409, condition: "Broker has open orders at termination" }
  - { id: ERR_OVERDUE_REVISION_BLOCKS_REINSTATE, http: 409, condition: "Broker has an overdue OPEN revision blocking reinstate" }
  - { id: ERR_NO_ACTIVE_LICENSE, http: 409, condition: "Broker holds no ACTIVE license at activation" }
  - { id: ERR_BROKER_NOT_ACTIVE, http: 409, condition: "Selected broker is not in ACTIVE status at dispatch" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Opaque operator with full administrative read access and clock control"
    identity: opaque
    exclusive_operations:
      - "POST /bpo/client-accounts"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET list/single endpoints across all resources"

  - name: ClientAdmin
    description: "Entity-backed client organization administrator; X-User-ID equals ClientAccount.id"
    identity: "entity_backed:ClientAccount"
    exclusive_operations:
      - "POST /bpo/valuation-orders/{id}/submit"
      - "POST /bpo/valuation-orders/{id}/cancel"
    shared_operations:
      - "POST /bpo/properties"
      - "POST /bpo/valuation-orders"
      - "GET endpoints on own client account, properties, orders, fee lines"

  - name: OperationsManager
    description: "Opaque operations manager; oversees orders end-to-end"
    identity: opaque
    exclusive_operations:
      - "POST /bpo/valuation-orders/{id}/complete"
      - "POST /bpo/volume-forecasts"
    shared_operations:
      - "POST /bpo/properties"
      - "POST /bpo/valuation-orders"
      - "POST /bpo/valuation-orders/{id}/comparables"
      - "POST /bpo/valuation-orders/{id}/fee-lines"
      - "POST /bpo/valuation-orders/{id}/fee-lines/{fee_id}/confirm"
      - "POST /bpo/valuation-orders/{id}/fee-lines/{fee_id}/cancel"
      - "GET endpoints across resources"

  - name: DispatchCoordinator
    description: "Opaque dispatch role responsible for matching orders to brokers"
    identity: opaque
    exclusive_operations:
      - "POST /bpo/valuation-orders/{id}/dispatch"
    shared_operations:
      - "GET endpoints on brokers, licenses, orders, comparables, photos, state regulations"

  - name: Broker
    description: "Entity-backed broker; X-User-ID equals Broker.id"
    identity: "entity_backed:Broker"
    exclusive_operations:
      - "POST /bpo/valuation-orders/{id}/accept"
      - "POST /bpo/valuation-orders/{id}/decline"
      - "POST /bpo/valuation-orders/{id}/report"
      - "POST /bpo/valuation-orders/{id}/revision/{rev_id}/resubmit"
      - "POST /bpo/valuation-orders/{id}/photos"
    shared_operations:
      - "POST /bpo/valuation-orders/{id}/comparables"
      - "POST /bpo/valuation-orders/{id}/comparables/{comp_id}/select"
      - "POST /bpo/valuation-orders/{id}/comparables/{comp_id}/reject"
      - "POST /bpo/valuation-orders/{id}/fee-lines"
      - "GET endpoints on own broker record, assigned orders, payout batches"

  - name: QCReviewer
    description: "Opaque QC reviewer; must not coincide with the assigned broker's identity (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /bpo/valuation-orders/{id}/qc/open"
      - "POST /bpo/valuation-orders/{id}/qc/{qc_id}/verdict"
    shared_operations:
      - "POST /bpo/valuation-orders/{id}/comparables/{comp_id}/reject"
      - "GET endpoints on orders, comparables, photos, QC reviews, revisions"

  - name: BillingClerk
    description: "Opaque billing clerk; owns payout batch lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /bpo/payout-batches"
      - "POST /bpo/payout-batches/{id}/approve"
      - "POST /bpo/payout-batches/{id}/disburse"
      - "POST /bpo/payout-batches/{id}/void"
    shared_operations:
      - "POST /bpo/valuation-orders/{id}/fee-lines"
      - "POST /bpo/valuation-orders/{id}/fee-lines/{fee_id}/confirm"
      - "POST /bpo/valuation-orders/{id}/fee-lines/{fee_id}/cancel"
      - "GET endpoints across financial resources"

  - name: ComplianceOfficer
    description: "Opaque compliance officer; owns broker onboarding, state regulations, suspension/termination"
    identity: opaque
    exclusive_operations:
      - "POST /bpo/state-regulations"
      - "POST /bpo/brokers"
      - "POST /bpo/brokers/{id}/licenses"
      - "POST /bpo/brokers/{id}/activate"
      - "POST /bpo/brokers/{id}/suspend"
      - "POST /bpo/brokers/{id}/reinstate"
      - "POST /bpo/brokers/{id}/terminate"
    shared_operations:
      - "GET endpoints across brokers, state regulations, orders"
