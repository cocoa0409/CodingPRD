              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb2_id}", module_code: "MEDIATION_SKILLS", hours: 8, exam_score: 88, completed_on: "2026-08-05T00:00:00Z" }
              as: ProgramCoordinator
              as_user_id: "pc-admin"
            - call: "POST /reemployment/training-records"
              payload: { ombudsman_id: "${omb2_id}", module_code: "DOCUMENTATION", hours: 6, exam_score: 95, completed_on: "2026-08-10T00:00:00Z" }
