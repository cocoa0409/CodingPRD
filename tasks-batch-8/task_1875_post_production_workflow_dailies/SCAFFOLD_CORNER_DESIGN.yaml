          assert:
            - "s1 == 1.0"
            - "s2 == 1.5"
            - "s3 == 0.0"

      - name: cascading_side_effect_project_wrap_to_notes
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Project.ACTIVE_to_WRAPPING"
        distinguishing_aspect: "Single wrap action cascades across 4 entity types: Project WRAPPING -> DailiesPackage REVOKED -> ReviewRound VOID -> ReviewNote VOID."
        excluded_because:
