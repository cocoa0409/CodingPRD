          ApplicatorQualification traverses a genuine cycle CERTIFIED ->
          PROBATION -> CERTIFIED: an ADJUDICATED_APPLICATION_ERROR drops the
          qualification to PROBATION, and exactly 2 consecutive ACCEPTED
