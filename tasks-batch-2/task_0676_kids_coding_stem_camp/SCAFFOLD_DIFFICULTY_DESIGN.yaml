            - call: "POST /memberships"
              payload: { member_id: "${m1}", monthly_fee_cents: 8000, included_sessions_per_cycle: 8 }
              as: Guardian
              as_user_id: "${g1}"
              captures: { mem1: $.data.id }
            - call: "POST /memberships/${mem1}/activate"
