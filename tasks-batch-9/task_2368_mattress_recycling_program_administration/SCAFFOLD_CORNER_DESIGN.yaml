            - "StateProgram.${prog_ca_id}.fee_collected_cents == 350000 and reserve_balance_cents == 5350000"
            - "StateProgram.${prog_ca_id}.reserve_coverage_months == 1.07 and recommended_rate_cents == 1072"
            - "fee-adequacy: reserve_gap_cents == 9650000, base_rate_cents == 1031, recommended_rate_cents == 1072, band_low_cents == 857, band_high_cents == 1287"

      - name: site_reported_units_total_reconciles_two_independent_intake_paths
