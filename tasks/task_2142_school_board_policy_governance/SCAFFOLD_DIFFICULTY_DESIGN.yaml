              as_user_id: "${bm1}"
              captures: { err: $.data.error_id }
            - call: "POST /governance/meetings/${m1}/minutes"
              payload: { action: "APPROVE", approving_meeting_id: "${m2}" }
              as: BoardClerk
            - call: "POST /governance/agenda-items/${ai2}/record-vote"
              payload: { yes_member_ids: ["${bm1}", "${bm2}"], no_member_ids: ["${bm3}"], abstain_member_ids: [] }
              as: BoardPresident
              as_user_id: "${bm1}"
              captures: { outcome2: $.data.vote_outcome }
          assert:
            - "first trigger call HTTP status == 422 and data.error_id == ERR_MINUTES_NOT_APPROVED"
            - "Meeting.${m1}.minutes_status == APPROVED after the second trigger call"
            - "third trigger call HTTP status == 200"
            - "AgendaItem.${ai2}.vote_outcome == PASSED"
            - "AgendaItem.${ai2}.required_yes_votes == 2"
            - "PolicyVersion.${pv1}.status == ADOPTED"
            - "PolicyVersion.${pv1}.adopting_meeting_id == ${m2}"

      - name: waiver_committee_recommendation_blocked_while_committee_inquorate
        grounds:
          - validations[priority=45]
          - errors[ERR_COMMITTEE_INQUORATE]
          - state_machines.WaiverRequest.SUBMITTED_to_BOARD_PENDING
          - entities.Committee.fields.voting_seat_count
          - entities.Committee.fields.status
        distinguishing_aspect: |
          The entity pair is WaiverRequest -> Committee, a different pair from AgendaItem -> Meeting.
          Whether the chair may record a recommendation depends entirely on the reviewing
          Committee's derived posture: with one ACTIVE seat against a quorum_size of 2 the committee
          is INQUORATE and the call fails with ERR_COMMITTEE_INQUORATE; seating a second member
          flips the committee to ACTIVE and the identical call succeeds.
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "Committee C1 (seat_capacity 3, quorum_size 2) has only bm2 seated as ACTIVE CHAIR, so voting_seat_count is 1 and the committee status is INQUORATE."
            - "Policy BP-6155 (RECOMMENDED) with a SUBMITTED waiver request W for HS-01."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Cara Lin", seat_number: 3, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Lin Architects" }
              as: BoardClerk
              captures: { bm3: $.data.id }
            - call: "POST /governance/committees"
              payload: { name: "Policy Committee", charter_type: "POLICY", seat_capacity: 3, quorum_size: 2 }
              as: BoardClerk
              captures: { c1: $.data.id, c1_status0: $.data.status }
            - call: "POST /governance/committee-assignments"
              payload: { committee_id: "${c1}", board_member_id: "${bm2}", role_on_committee: "CHAIR" }
              as: BoardClerk
              captures: { ca2: $.data.id }
            - call: "POST /governance/policies"
              payload: { code: "BP-6155", title: "Homework and Grading", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "6000.55" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
            - call: "POST /governance/waiver-requests"
              payload: { policy_id: "${pol}", reviewing_committee_id: "${c1}", requesting_school_code: "HS-01", justification: "Block schedule pilot", requested_start_date: "2026-10-01T00:00:00Z", requested_end_date: "2026-11-01T00:00:00Z" }
              as: SchoolPrincipal
              captures: { w: $.data.id }
          trigger:
            - call: "POST /governance/waiver-requests/${w}/committee-recommendation"
              payload: { recommendation: "RECOMMEND_GRANT" }
              as: BoardMember
              as_user_id: "${bm2}"
              captures: { err: $.data.error_id }
            - call: "POST /governance/committee-assignments"
              payload: { committee_id: "${c1}", board_member_id: "${bm3}", role_on_committee: "MEMBER" }
              as: BoardClerk
              captures: { ca3: $.data.id }
            - call: "POST /governance/waiver-requests/${w}/committee-recommendation"
              payload: { recommendation: "RECOMMEND_GRANT" }
              as: BoardMember
              as_user_id: "${bm2}"
              captures: { w_status: $.data.status }
          assert:
            - "first trigger call HTTP status == 409 and data.error_id == ERR_COMMITTEE_INQUORATE"
            - "Committee.${c1}.voting_seat_count == 2 after the second trigger call"
            - "Committee.${c1}.status == ACTIVE"
            - "Committee.${c1}.filled_seat_count == 2"
            - "Committee.${c1}.vacant_seat_count == 1"
            - "third trigger call HTTP status == 200"
            - "WaiverRequest.${w}.status == BOARD_PENDING"
            - "WaiverRequest.${w}.committee_recommendation == RECOMMEND_GRANT"

      - name: evaluation_rating_rejected_when_submitting_trustee_has_resigned
        grounds:
          - validations[priority=45]
          - errors[ERR_MEMBER_NOT_SEATED]
          - state_machines.BoardMember.SEATED_to_RESIGNED
          - entities.EvaluationRating.fields.board_member_id
        distinguishing_aspect: |
          The entity pair is EvaluationRating -> BoardMember, a third distinct pair. A rating
          submission is judged against the submitting trustee's own lifecycle state: once bm2 has
          resigned, the identical POST that would have been accepted is rejected with
          ERR_MEMBER_NOT_SEATED and the evaluation's rating_count stays 0.
        test_recipe:
          setup:
            - "Two trustees: bm1 SEATED with office PRESIDENT, bm2 who then resigns."
            - "Evaluation cycle 2027 advanced to GOALS_SET so ratings would otherwise be accepted."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/superintendent-evaluations"
              payload: { cycle_year: 2027, window_start_date: "2026-08-01T00:00:00Z", window_end_date: "2027-06-30T00:00:00Z", midyear_checkpoint_date: "2027-01-15T00:00:00Z", goal_count: 4, weight_instructional: 0.40, weight_fiscal: 0.30, weight_community: 0.20, weight_governance: 0.10 }
              as: BoardClerk
              captures: { ev: $.data.id }
            - call: "POST /governance/superintendent-evaluations/${ev}/advance"
              payload: { action: "SET_GOALS" }
              as: BoardPresident
              as_user_id: "${bm1}"
            - call: "POST /governance/board-members/${bm2}/resign"
              payload: {}
              as: BoardClerk
              captures: { bm2_status: $.data.status }
          trigger:
            - call: "POST /governance/evaluation-ratings"
              payload: { evaluation_id: "${ev}", board_member_id: "${bm2}", domain: "FISCAL_STEWARDSHIP", score: 4 }
              as: BoardMember
              as_user_id: "${bm2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_MEMBER_NOT_SEATED"
            - "BoardMember.${bm2}.status == RESIGNED"
            - "SuperintendentEvaluation.${ev}.rating_count == 0"
            - "SuperintendentEvaluation.${ev}.status == GOALS_SET"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: waiver_window_half_open_adjacency_allowed_but_overlap_rejected
        grounds:
          - validations[priority=59]
          - errors[ERR_WAIVER_WINDOW_OVERLAP]
          - entities.WaiverRequest.fields.requested_start_date
          - entities.WaiverRequest.fields.requested_end_date
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on a date range, scoped to the
          (policy_id, requesting_school_code) resource. Because the end bound is exclusive, a window
          beginning exactly where the previous one ends is ACCEPTED, while a window that shares even
          one interior day is REJECTED with ERR_WAIVER_WINDOW_OVERLAP. This is arithmetic on ranges,
          unlike the symmetric point buffer used for the meeting calendar.
        test_recipe:
          setup:
            - "Committee C1 exists as the reviewing committee."
            - "Policy BP-6155 is RECOMMENDED, so its waiver cap is 180 days and none of the windows below trips the cap."
            - "Waiver W1 for HS-01 covering 2026-10-01 to 2026-11-01 is SUBMITTED and therefore live."
          setup_api_calls:
            - call: "POST /governance/committees"
              payload: { name: "Policy Committee", charter_type: "POLICY", seat_capacity: 3, quorum_size: 2 }
              as: BoardClerk
              captures: { c1: $.data.id }
            - call: "POST /governance/policies"
              payload: { code: "BP-6155", title: "Homework and Grading", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "6000.55" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
            - call: "POST /governance/waiver-requests"
              payload: { policy_id: "${pol}", reviewing_committee_id: "${c1}", requesting_school_code: "HS-01", justification: "Pilot period one", requested_start_date: "2026-10-01T00:00:00Z", requested_end_date: "2026-11-01T00:00:00Z" }
              as: SchoolPrincipal
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /governance/waiver-requests"
              payload: { policy_id: "${pol}", reviewing_committee_id: "${c1}", requesting_school_code: "HS-01", justification: "Pilot period two, starts the instant period one ends", requested_start_date: "2026-11-01T00:00:00Z", requested_end_date: "2026-12-01T00:00:00Z" }
              as: SchoolPrincipal
              captures: { w2: $.data.id }
            - call: "POST /governance/waiver-requests"
              payload: { policy_id: "${pol}", reviewing_committee_id: "${c1}", requesting_school_code: "HS-01", justification: "Overlapping window", requested_start_date: "2026-10-15T00:00:00Z", requested_end_date: "2026-11-15T00:00:00Z" }
              as: SchoolPrincipal
              captures: { err: $.data.error_id }
          assert:
            - "first trigger call HTTP status == 201 (adjacency at 2026-11-01T00:00:00Z is permitted)"
            - "WaiverRequest.${w2}.status == SUBMITTED"
            - "second trigger call HTTP status == 409 and data.error_id == ERR_WAIVER_WINDOW_OVERLAP"
            - "GET /governance/waiver-requests?policy_id=${pol} returns total_count == 2"

      - name: meeting_calendar_separation_buffer_at_exactly_240_minutes
        grounds:
          - validations[priority=60]
          - errors[ERR_MEETING_SEPARATION_VIOLATION]
          - entities.Meeting.fields.scheduled_start_utc
          - entities.Meeting.fields.scope
        distinguishing_aspect: |
          Different interval semantics on a different resource: a symmetric buffer measured around a
          single instant on the board calendar, not a range intersection. Two meetings collide when
          abs(start_a - start_b) is strictly less than 240 minutes, so a meeting exactly 240 minutes
          after another is ACCEPTED while one 239 minutes after is REJECTED with
          ERR_MEETING_SEPARATION_VIOLATION.
        test_recipe:
          setup:
            - "Meeting A is FULL_BOARD, REGULAR, scheduled 2026-09-10T18:00:00Z and still DRAFT, so it is live on the calendar."
            - "The logical clock rests at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /governance/meetings"
              payload: { title: "Board Meeting A", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { ma: $.data.id }
          trigger:
            - call: "POST /governance/meetings"
              payload: { title: "Board Meeting B", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T22:00:00Z" }
              as: BoardClerk
              captures: { mb: $.data.id }
            - call: "POST /governance/meetings"
              payload: { title: "Board Meeting C", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-11T01:59:00Z" }
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "first trigger call HTTP status == 201 (exactly 240 minutes after Meeting A is permitted)"
            - "Meeting.${mb}.status == DRAFT"
            - "second trigger call HTTP status == 409 and data.error_id == ERR_MEETING_SEPARATION_VIOLATION"
            - "GET /governance/meetings returns total_count == 2"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: public_comment_minutes_conserved_across_grant_and_release
        grounds:
          - invariants.public_comment_minute_conservation
          - calculations.public_comment_minute_allocation
          - state_machines.Meeting.OPEN_to_ADJOURNED
          - state_machines.PublicComment.GRANTED_to_RELEASED
          - state_machines.AgendaItem.POSTED_to_TABLED
        distinguishing_aspect: |
          The conserved quantity is public-comment MINUTES on a Meeting. Opening the meeting is the
          forward action (5-minute budget debited to 0 as Iris takes 3 and Jonah takes 2); adjourning
          with the item still un-acted is the compensating action (both cards RELEASED, allotted
          minutes zeroed, remaining credited back to exactly 5). budget == remaining + sum(granted
          allotments) must hold at both observation points with zero drift.
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "Policy BP-5030 with one DRAFT version."
            - "Meeting M: SPECIAL (5-minute budget), FULL_BOARD, starts 2026-09-10T18:00:00Z, public_comment_rule FIRST_COME_CAPPED."
            - "One POLICY_FIRST_READING item carrying two speaker cards with strictly increasing submitted_at: Iris Vega asking 3 minutes, then Jonah Park asking 3 minutes."
            - "The meeting is NOTICED and the clock has been moved to 2026-09-10T18:00:00Z."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Cara Lin", seat_number: 3, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Lin Architects" }
              as: BoardClerk
              captures: { bm3: $.data.id }
            - call: "POST /governance/policies"
              payload: { code: "BP-5030", title: "Student Wellness", category: "STUDENTS", legal_requirement_level: "RECOMMENDED", manual_section: "5000.30" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "Wellness draft.", summary_of_change: "Initial draft", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { pv1: $.data.id }
            - call: "POST /governance/meetings"
              payload: { title: "Special Wellness Meeting", scope: "FULL_BOARD", meeting_type: "SPECIAL", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id, m_v: $.data.version, m_budget: $.data.public_comment_minutes_budget }
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${m}", item_type: "POLICY_FIRST_READING", title: "First reading BP-5030", expected_meeting_version: "${m_v}", policy_version_id: "${pv1}" }
              as: BoardClerk
              captures: { ai: $.data.id }
            - call: "POST /governance/agenda-items/${ai}/public-comments"
              payload: { speaker_name: "Iris Vega", speaker_affiliation: "PARENT", requested_minutes: 3 }
              as: Public
              captures: { c1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: BoardClerk
            - call: "POST /governance/agenda-items/${ai}/public-comments"
              payload: { speaker_name: "Jonah Park", speaker_affiliation: "STAFF", requested_minutes: 3 }
              as: Public
              captures: { c2: $.data.id }
            - call: "POST /governance/meetings/${m}/notice"
              payload: {}
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T18:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /governance/meetings/${m}/open"
              payload: { attending_member_ids: ["${bm1}", "${bm2}", "${bm3}"] }
              as: BoardPresident
              as_user_id: "${bm1}"
              captures: { rem_after_open: $.data.public_comment_minutes_remaining }
            - call: "POST /governance/meetings/${m}/adjourn"
              payload: {}
              as: BoardClerk
              captures: { rem_after_adjourn: $.data.public_comment_minutes_remaining }
          assert:
            - "captured rem_after_open == 0"
            - "PublicComment.${c1}.allotted_minutes was 3 and PublicComment.${c2}.allotted_minutes was 2 immediately after the open call, so 5 == 0 + 3 + 2"
            - "captured rem_after_adjourn == 5"
            - "Meeting.${m}.public_comment_minutes_budget == 5"
            - "Meeting.${m}.public_comment_minutes_remaining == 5"
            - "PublicComment.${c1}.status == RELEASED and PublicComment.${c1}.allotted_minutes == 0"
            - "PublicComment.${c2}.status == RELEASED and PublicComment.${c2}.allotted_minutes == 0"
            - "AgendaItem.${ai}.status == TABLED"

      - name: committee_seat_capacity_conserved_across_assignment_and_removal
        grounds:
          - invariants.committee_seat_conservation
          - state_machines.CommitteeAssignment.ACTIVE_to_REMOVED
          - entities.Committee.fields.filled_seat_count
          - entities.Committee.fields.vacant_seat_count
          - entities.Committee.fields.voting_seat_count
        distinguishing_aspect: |
          The conserved quantity is SEATS on a Committee, a different kind of quantity from
          public-comment minutes. Seating bm3 is the forward action (filled 1 -> 2, vacant 2 -> 1,
          committee INQUORATE -> ACTIVE); removing that same assignment is the compensating action
          (filled 2 -> 1, vacant 1 -> 2, committee ACTIVE -> INQUORATE). seat_capacity ==
          filled_seat_count + vacant_seat_count must equal 3 at every observation point.
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "Committee C1 with seat_capacity 3 and quorum_size 2, holding one ACTIVE seat for bm2, so filled 1 / vacant 2 / voting 1 and status INQUORATE."
          setup_api_calls:
            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Cara Lin", seat_number: 3, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Lin Architects" }
              as: BoardClerk
              captures: { bm3: $.data.id }
            - call: "POST /governance/committees"
              payload: { name: "Audit Committee", charter_type: "AUDIT", seat_capacity: 3, quorum_size: 2 }
              as: BoardClerk
              captures: { c1: $.data.id, cap: $.data.seat_capacity }
            - call: "POST /governance/committee-assignments"
              payload: { committee_id: "${c1}", board_member_id: "${bm2}", role_on_committee: "CHAIR" }
              as: BoardClerk
              captures: { ca2: $.data.id }
            - call: "GET /governance/committees/${c1}"
              payload: {}
              as: BoardClerk
              captures: { filled_before: $.data.filled_seat_count, vacant_before: $.data.vacant_seat_count, status_before: $.data.status }
          trigger:
            - call: "POST /governance/committee-assignments"
              payload: { committee_id: "${c1}", board_member_id: "${bm3}", role_on_committee: "MEMBER" }
              as: BoardClerk
              captures: { ca3: $.data.id }
            - call: "GET /governance/committees/${c1}"
              payload: {}
              as: BoardClerk
              captures: { filled_mid: $.data.filled_seat_count, vacant_mid: $.data.vacant_seat_count, status_mid: $.data.status }
            - call: "POST /governance/committee-assignments/${ca3}/status"
              payload: { action: "REMOVE" }
              as: BoardClerk
              captures: { ca3_status: $.data.status }
            - call: "GET /governance/committees/${c1}"
              payload: {}
              as: BoardClerk
              captures: { filled_after: $.data.filled_seat_count, vacant_after: $.data.vacant_seat_count, status_after: $.data.status }
          assert:
            - "captured filled_before == 1 and captured vacant_before == 2 and 1 + 2 == 3"
            - "captured status_before == INQUORATE"
            - "captured filled_mid == 2 and captured vacant_mid == 1 and 2 + 1 == 3"
            - "captured status_mid == ACTIVE"
            - "captured filled_after == 1 and captured vacant_after == 2 and 1 + 2 == 3"
            - "captured status_after == INQUORATE"
            - "CommitteeAssignment.${ca3}.status == REMOVED"
            - "CommitteeAssignment.${ca3}.removed_on == 2026-08-01T00:00:00Z"
            - "CommitteeAssignment.${ca2}.status == ACTIVE"
            - "Committee.${c1}.voting_seat_count == 1"
