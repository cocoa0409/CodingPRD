        test_recipe:
          setup:
            - "One MEAT department on store 0412 with an ACTIVE four-rung ladder, max_total_discount_pct 75."
            - "One item at 599 cents retail, 420 cents cost, so cost_floor_price_cents is 168 (40 percent of 420)."
            - "Lot W: 24 units produced 2026-08-05, then WITHDRAWN, so quantity_on_hand is 0 and its version has been bumped by the withdrawal."
            - "Lot F: 24 units of the same item, still FRESH, used as the control."
            - "Clock parked at 2026-08-12T00:00:00.000Z (days_remaining 3 for both lots)."
