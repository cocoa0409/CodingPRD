              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_CLIENT_TIME_CONFLICT"
            - "http status == 409"

  # ───────────────────────────── Rule 9 ─────────────────────────────
  - rule_id: compensating_invariant
    instances:
      - name: package_hours_conserved_on_session_cancel
        grounds:
          - calculations.package_hours_ledger
          - state_machines.Session.null_to_SCHEDULED
          - state_machines.Session.SCHEDULED_CONFIRMED_to_CANCELLED
        distinguishing_aspect: "Scheduling reserves 6 blocks (available 20->14) and cancelling releases them (available 14->20), leaving package_blocks == available + reserved + consumed == 20+0+0; conserved quantity is PACKAGE HOURS (blocks)."
        test_recipe:
          setup:
            - "PACKAGE engagement package_blocks 20 (block_rate 3000) ACTIVE; one 90-min session scheduled (estimated 6 blocks; reserved 6, available 14)."
          setup_api_calls:
            - call: "POST /styling/stylists"
              payload: { full_name: "Fin Cut", email: "fin17@x.com", commission_pct: 0.30, tier: "SENIOR" }
              as: PlatformAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /styling/clients/register"
              payload: { full_name: "Gwen Pool", email: "gwen17@x.com" }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /styling/engagements"
              payload: { client_id: "${cl_id}", stylist_id: "${sty_id}", mode: "PACKAGE", block_rate_cents: 3000, package_blocks: 20, package_price_cents: 60000 }
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /styling/engagements/${eng_id}/activate"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /styling/engagements/${eng_id}/sessions"
              payload: { session_type: "CLOSET_AUDIT", modality: "IN_PERSON", scheduled_start: "2026-04-14T10:00:00Z", scheduled_end: "2026-04-14T11:30:00Z", expected_engagement_version: "${eng_v}" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /styling/sessions/${sess_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
          assert:
            - "Engagement.${eng_id}.hours_reserved_blocks == 0"
            - "Engagement.${eng_id}.hours_available_blocks == 20"
            - "Engagement.${eng_id}.hours_consumed_blocks == 0"
            - "Session.${sess_id}.status == CANCELLED"

      - name: retail_spend_and_commission_conserved_on_return
        grounds:
          - state_machines.PurchaseItem.PURCHASED_to_RETURNED
          - entities.Engagement.fields.retail_spend_cents
          - entities.Stylist.fields.earned_commission_cents
        distinguishing_aspect: "Purchasing an item adds 9600 to engagement.retail_spend_cents and 640 to stylist.earned_commission_cents; returning it subtracts both back to 0; conserved quantity is MONEY (retail spend + commission), a different quantity than package hours."
        test_recipe:
          setup:
            - "Stylist commission 0.40 (earned_commission 0); HOURLY engagement ACTIVE; SHOPPING session CONFIRMED; one item purchased at retail 8000 (marked_up 9600, commission 640) so engagement.retail_spend_cents=9600 and stylist.earned_commission_cents=640."
          setup_api_calls:
            - call: "POST /styling/stylists"
