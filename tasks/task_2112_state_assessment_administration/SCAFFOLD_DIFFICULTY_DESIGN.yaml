# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x 2 instances = 18 instances.
# Every chain starts from an empty database; the logical clock reads
# 2026-08-01T00:00:00Z until POST /_clock/set_current_utc moves it.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: participation_provisional_vs_final_diverges_on_window
        grounds:
          - calculations.participation_rate
          - entities.TestWindow.fields.participation_rate_provisional_pct
          - entities.TestWindow.fields.participation_rate_final_pct
          - state_machines.TestWindow.MAKEUP_to_SCORING
          - state_machines.TestWindow.RELEASED_to_FINALIZED
        distinguishing_aspect: >-
          This dual variant lives on the TestWindow participation metric: the provisional
          variant counts "showed up" over live sessions and returns 66.7, while the final
          variant counts "produced a usable score" over every session including cancelled
          ones and returns 25.0 from the exact same stored rows.
        test_recipe:
          setup:
            - "One district, one school (max_concurrent_seats 60) and one ELA window with min_participation_pct 50.0 and appeal_window_days 10."
            - "Session A (room R101) is CLOSED with three registrations: two PRESENT and one ABSENT; Session B (room R102) was cancelled while DRAFT, withdrawing its single registration."
            - "The window's only material lot has been received, distributed, returned and reconciled clean, so MAKEUP -> SCORING is unblocked."
            - "Both PRESENT registrations have raw scores and the window has been RELEASED; a student-specific ADMIN_ERROR report on the second PRESENT registration is sitting in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-0001", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Alder High", school_code: "AH-01", max_concurrent_seats: 60 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s_id: $.data.id }
            - call: "POST /test-windows"
              payload: { name: "Fall ELA G9-12", subject: "ELA", grade_band: "G9_12", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z", appeal_window_days: 10, min_participation_pct: 50.0 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
            - call: "POST /material-lots"
              payload: { window_id: "${w_id}", district_id: "${d_id}", lot_code: "LOT-A1", quantity_shipped: 20, seal_range_start: 3000, seal_range_end: 3019 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { lot_id: $.data.id }
            - call: "POST /test-windows/${w_id}/transitions"
              payload: { to_status: "OPEN" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /proctors"
              payload: { school_id: "${s_id}", full_name: "Ada Proctor", email: "ada@ng.gov" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /proctors/${p1_id}/training-completions"
              payload: { module_version: "2026.1", quiz_score_pct: 92.0 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { p1_v: $.data.version }
            - call: "POST /security-affidavits"
              payload: { proctor_id: "${p1_id}", window_id: "${w_id}", affidavit_version: "2026.1", expected_proctor_version: "${p1_v}" }
              as: Proctor
              as_user_id: "${p1_id}"
              captures: { aff1_id: $.data.id }
            - call: "POST /sessions"
              payload: { window_id: "${w_id}", school_id: "${s_id}", room_code: "R101", scheduled_start: "2026-09-08T09:00:00Z", scheduled_end: "2026-09-08T12:00:00Z", seat_capacity: 25, session_type: "INITIAL" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { sess_a_id: $.data.id, sess_a_v: $.data.version }
            - call: "POST /sessions/${sess_a_id}/proctor-assignments"
              payload: { proctor_id: "${p1_id}", expected_session_version: "${sess_a_v}" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /sessions"
              payload: { window_id: "${w_id}", school_id: "${s_id}", room_code: "R102", scheduled_start: "2026-09-08T09:00:00Z", scheduled_end: "2026-09-08T12:00:00Z", seat_capacity: 25, session_type: "INITIAL" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { sess_b_id: $.data.id }
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "RECEIPT", quantity: 20, sealed_count: 20 }
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "TRANSFER_TO_SCHOOL", quantity: 20, sealed_count: 20 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /registrations"
              payload: { session_id: "${sess_a_id}", student_state_id: "S00000001", grade: 10, guardian_email: "g1@fam.example" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations"
              payload: { session_id: "${sess_a_id}", student_state_id: "S00000002", grade: 10, guardian_email: "g2@fam.example" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /registrations"
              payload: { session_id: "${sess_a_id}", student_state_id: "S00000003", grade: 10, guardian_email: "g3@fam.example" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r3_id: $.data.id }
            - call: "POST /registrations"
              payload: { session_id: "${sess_b_id}", student_state_id: "S00000004", grade: 10, guardian_email: "g4@fam.example" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r4_id: $.data.id }
            - call: "POST /sessions/${sess_a_id}/transitions"
              payload: { to_status: "SCHEDULED" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "SESSION_CHECKOUT", quantity: 6, sealed_count: 6, session_id: "${sess_a_id}" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T09:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /sessions/${sess_a_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /registrations/${r1_id}/attendance"
              payload: { attendance_status: "PRESENT" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /registrations/${r2_id}/attendance"
              payload: { attendance_status: "PRESENT" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /registrations/${r3_id}/attendance"
              payload: { attendance_status: "ABSENT" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "SESSION_CHECKIN", quantity: 6, sealed_count: 6, session_id: "${sess_a_id}" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /sessions/${sess_a_id}/transitions"
              payload: { to_status: "CLOSED" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /sessions/${sess_b_id}/transitions"
              payload: { to_status: "CANCELLED" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "RETURN_TO_DISTRICT", quantity: 20, sealed_count: 20 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /material-lots/${lot_id}/reconciliations"
              payload: { declared_returned_count: 20, declared_destroyed_count: 0, broken_seal_count: 0 }
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-19T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /test-windows/${w_id}/transitions"
              payload: { to_status: "MAKEUP" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-26T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /test-windows/${w_id}/transitions"
              payload: { to_status: "SCORING" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /registrations/${r1_id}/scores"
              payload: { raw_score: 88 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /registrations/${r2_id}/scores"
              payload: { raw_score: 91 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /test-windows/${w_id}/transitions"
              payload: { to_status: "RELEASED" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /irregularity-reports"
              payload: { session_id: "${sess_a_id}", registration_id: "${r2_id}", category: "ADMIN_ERROR", severity: "MEDIUM", narrative: "Timing script misread for one test taker." }
              as: Proctor
              as_user_id: "${p1_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /irregularity-reports/${rep_id}/transitions"
              payload: { to_status: "SUBMITTED" }
              as: Proctor
              as_user_id: "${p1_id}"
            - call: "POST /irregularity-reports/${rep_id}/transitions"
              payload: { to_status: "UNDER_REVIEW" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
          trigger:
            - call: "POST /irregularity-reports/${rep_id}/transitions"
              payload: { to_status: "ADJUDICATED", disposition: "INVALIDATE_REGISTRATION", note: "Timing defect confirmed." }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /test-windows/${w_id}/transitions"
              payload: { to_status: "FINALIZED" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { final_status: $.data.status }
          assert:
            - "TestWindow.${w_id}.participation_rate_provisional_pct == 66.7"
            - "TestWindow.${w_id}.participation_rate_final_pct == 25.0"
            - "TestWindow.${w_id}.registered_distinct_count == 4"
            - "TestWindow.${w_id}.present_distinct_count == 1"
            - "TestWindow.${w_id}.status == FINALIZED"
            - "TestWindow.${w_id}.appeal_window_closes_at == 2026-10-06T08:00:00.000Z"
            - "Registration.${r1_id}.score_status == FINAL"
            - "Registration.${r2_id}.score_status == INVALIDATED"
            - "Registration.${r3_id}.score_status == NOT_SCORED"
            - "Registration.${r4_id}.attendance_status == WITHDRAWN"

      - name: lot_chain_replay_vs_declared_ledger_diverges_on_material_lot
        grounds:
          - calculations.material_reconciliation
          - entities.MaterialLot.fields.chain_accounted_count
          - entities.MaterialLot.fields.declared_accounted_count
          - entities.MaterialLot.fields.chain_vs_declared_delta
          - state_machines.MaterialLot.RETURNED_PENDING_to_DISCREPANT
        distinguishing_aspect: >-
          This dual variant lives on the MaterialLot custody ledger, a different entity
          domain from participation: the chronological chain replay reports 10 booklets
          accounted for while the district's declared ledger reports 7 for the same lot,
          and the reconciliation records the 3-booklet delta rather than trusting either
          side.
        test_recipe:
          setup:
            - "One district, one school and one window with a single 10-booklet lot."
            - "The lot has been received by the district, transferred to the school and returned in full, so the chain replay says all 10 are back and the lot sits in RETURNED_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-0002", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Birch Middle", school_code: "BM-01", max_concurrent_seats: 40 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s_id: $.data.id }
            - call: "POST /test-windows"
              payload: { name: "Fall MATH G6-8", subject: "MATH", grade_band: "G6_8", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
            - call: "POST /material-lots"
              payload: { window_id: "${w_id}", district_id: "${d_id}", lot_code: "LOT-B1", quantity_shipped: 10, seal_range_start: 4000, seal_range_end: 4009 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { lot_id: $.data.id }
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "RECEIPT", quantity: 10, sealed_count: 10 }
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "TRANSFER_TO_SCHOOL", quantity: 10, sealed_count: 10 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /material-lots/${lot_id}/custody-events"
              payload: { event_type: "RETURN_TO_DISTRICT", quantity: 10, sealed_count: 10 }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /material-lots/${lot_id}/reconciliations"
              payload: { declared_returned_count: 7, declared_destroyed_count: 0, broken_seal_count: 0 }
              as: DistrictTestCoordinator
              as_user_id: "${d_id}"
              captures: { lot_status: $.data.status }
          assert:
            - "MaterialLot.${lot_id}.chain_accounted_count == 10"
            - "MaterialLot.${lot_id}.declared_accounted_count == 7"
            - "MaterialLot.${lot_id}.chain_vs_declared_delta == 3"
            - "MaterialLot.${lot_id}.missing_count == 3"
            - "MaterialLot.${lot_id}.status == DISCREPANT"
            - "MaterialLot.${lot_id}.replacement_charge_cents == 4688"
            - "MaterialLot.${lot_id}.quantity_at_district == 10"
            - "MaterialLot.${lot_id}.quantity_at_school == 0"
            - "MaterialLot.${lot_id}.quantity_in_sessions == 0"

  - rule_id: combinatorial_formula
    instances:

      - name: effective_seat_capacity_nested_min_ceil_penalty_mode_a
        grounds:
          - calculations.session_seat_pressure
          - entities.Session.fields.effective_seat_capacity
          - entities.Session.fields.seats_consumed
          - entities.Session.fields.separate_setting_count
          - validations[priority=23]
        distinguishing_aspect: >-
          Mode (a): a four-input formula whose inputs interact non-linearly - the third
          separate-setting registration both raises seats_consumed from 5 to 9
          and drops effective_seat_capacity from 10 to 6 through a nested
          max(0, min(seat_capacity, school_max) - ceil(...) * cost), so the same coding
          call that fits at separate_setting_count 2 is rejected at 3.
        test_recipe:
          setup:
            - "One school with max_concurrent_seats 60 and one OPEN window."
            - "Session A has seat_capacity 10 and three registrations; the first two already carry SMALL_GROUP (a separate-setting code), the third carries none."
            - "At separate_setting_count 2 the proctor-span penalty is still 0, so effective_seat_capacity is 10 and seats_consumed is 7."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-0003", state_code: "NG" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Cedar High", school_code: "CH-01", max_concurrent_seats: 60 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { s_id: $.data.id }
            - call: "POST /test-windows"
              payload: { name: "Fall ELA G9-12", subject: "ELA", grade_band: "G9_12", window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-18T18:00:00Z", makeup_start: "2026-09-21T08:00:00Z", makeup_end: "2026-09-25T18:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { w_id: $.data.id }
            - call: "POST /material-lots"
              payload: { window_id: "${w_id}", district_id: "${d_id}", lot_code: "LOT-C1", quantity_shipped: 10, seal_range_start: 5000, seal_range_end: 5009 }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
              captures: { lot_id: $.data.id }
            - call: "POST /test-windows/${w_id}/transitions"
              payload: { to_status: "OPEN" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /sessions"
              payload: { window_id: "${w_id}", school_id: "${s_id}", room_code: "R101", scheduled_start: "2026-09-08T09:00:00Z", scheduled_end: "2026-09-08T12:00:00Z", seat_capacity: 10, session_type: "INITIAL" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { sess_a_id: $.data.id }
            - call: "POST /registrations"
              payload: { session_id: "${sess_a_id}", student_state_id: "S00000001", grade: 11, guardian_email: "g1@fam.example" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/accommodation-codings"
              payload: { accommodation_codes: ["SMALL_GROUP"] }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /registrations"
              payload: { session_id: "${sess_a_id}", student_state_id: "S00000002", grade: 11, guardian_email: "g2@fam.example" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /registrations/${r2_id}/accommodation-codings"
              payload: { accommodation_codes: ["SMALL_GROUP"] }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /registrations"
              payload: { session_id: "${sess_a_id}", student_state_id: "S00000003", grade: 11, guardian_email: "g3@fam.example" }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /registrations/${r3_id}/accommodation-codings"
              payload: { accommodation_codes: ["SMALL_GROUP"] }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { cap_err: $.data.error_id }
            - call: "POST /registrations/${r2_id}/accommodation-codings"
              payload: { accommodation_codes: ["EXTENDED_TIME"] }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
            - call: "POST /registrations/${r3_id}/accommodation-codings"
              payload: { accommodation_codes: ["SMALL_GROUP"] }
              as: SchoolTestCoordinator
              as_user_id: "${s_id}"
              captures: { r3_acc_status: $.data.accommodation_status }
          assert:
            - "first trigger call returns HTTP 422 with data.error_id == ERR_SESSION_CAPACITY_EXCEEDED"
            - "immediately after the rejection Session.${sess_a_id}.seats_consumed == 7"
            - "immediately after the rejection Session.${sess_a_id}.effective_seat_capacity == 10"
            - "immediately after the rejection Session.${sess_a_id}.separate_setting_count == 2"
            - "immediately after the rejection Registration.${r3_id}.accommodation_codes == []"
            - "third trigger call returns HTTP 200 and Registration.${r3_id}.accommodation_status == APPROVED"
            - "after the third trigger call Session.${sess_a_id}.seats_consumed == 7"
            - "after the third trigger call Session.${sess_a_id}.separate_setting_count == 2"
            - "after the third trigger call Session.${sess_a_id}.effective_seat_capacity == 10"
            - "Registration.${r2_id}.seats_required == 1"
            - "Registration.${r3_id}.seats_required == 3"

      - name: replacement_charge_rounded_per_lot_then_summed_mode_b
        grounds:
          - calculations.replacement_charge_ledger
          - calculations.district_security_assessment
          - entities.MaterialLot.fields.replacement_charge_cents
          - entities.District.fields.replacement_charge_total_cents
          - entities.District.fields.security_assessment_cents
        distinguishing_aspect: >-
          Mode (b): rounding order decides the answer. Each lot's 3 x 1250 x 1.25 =
          4687.5 is rounded to 4688 BEFORE the district roll-up, so the district total is
          9376; summing first and rounding once would give 9375, and the waiver tier then
          bills 8438 rather than 8438-vs-8437.
        test_recipe:
          setup:
            - "One district holding two 10-booklet lots for the same window."
            - "Both lots have been received, distributed and returned in full, so both sit in RETURNED_PENDING with a chain-accounted count of 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: StateAssessmentOfficer
              as_user_id: "sao-001"
            - call: "POST /districts"
              payload: { name: "Northgate District", district_code: "NG-0004", state_code: "NG" }
