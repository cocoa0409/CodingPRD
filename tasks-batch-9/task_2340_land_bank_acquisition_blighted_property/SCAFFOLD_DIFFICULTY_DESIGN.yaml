              captures: { err_id: $.data.error_id }
          assert:
            - "${a_status} == SUBMITTED and ${a_quote} == 900000  # exactly 0 cents delinquent passes the strict > 0 test"
            - "Applicant.${appl_a_id}.delinquent_tax_total_cents == 0 and Applicant.${appl_a_id}.eligibility_status == ELIGIBLE"
            - "HTTP 422 and ${err_id} == ERR_APPLICANT_TAX_DELINQUENT  # exactly 1 cent is already a bar"
