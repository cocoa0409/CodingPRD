      - name: determine_and_activate_are_not_idempotent_second_call_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Registration.DRAFT_to_DETERMINED
          - validations.priority_12_ERR_INVALID_REGISTRATION_STATE
        distinguishing_aspect: |
          Neither determine nor activate is idempotent: the second identical call
          is a state error, not a no-op re-run. Crucially the registration_number
          minted by the FIRST activate is unchanged by the rejected second call —
          no second sequence number is consumed.
