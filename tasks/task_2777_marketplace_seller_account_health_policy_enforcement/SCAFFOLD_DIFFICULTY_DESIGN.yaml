            - "EnforcementAction.${a1}.state == VACATED   # the only edge that leaves UPHELD"
            - "EnforcementAction.${a1}.resolution_reason == ESCALATION_GRANTED   # not APPEAL_GRANTED, which is the first-level value"
            - "EnforcementAction.${a1}.override_applied == true and EnforcementAction.${a1}.ladder_rung_computed == WARNING"
            - "Seller.${s_id}.severity_points_balance == 0.00 and Seller.${s_id}.enforcement_state == ACTIVE and Seller.${s_id}.disbursement_state == NORMAL"
            - "Seller.${s_id}.reinstated_count == 1"
            - "Listing.${l1}.state == ACTIVE and Listing.${l1}.suppressed_by_suspension == false"
            - "the auto FULL_HOLD row for this seller is in state RELEASED with release_reason APPEAL_GRANTED"
            - "GET /sellers/${s_id}/notifications includes template_code ESCALATION_DECISION and template_code FUNDS_RELEASED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: suspension_cascade_walks_listings_posture_holds_and_balances
        grounds:
          - "state_machines.Seller.enforcement_state (ACCOUNT_SUSPENSION edge)"
          - "state_machines.Seller.disbursement_state (FULL_HOLD edge, steps 1-3)"
          - "state_machines.Listing.ACTIVE_to_SUPPRESSED"
          - "state_machines.DisbursementHold.ACTIVE_to_RELEASED"
          - "calculations.risk_tier"
        distinguishing_aspect: |
          Depth 4, triggered by POST /enforcement-actions: action -> enforcement_state SUSPENDED
          -> (listings SUPPRESSED, disbursement_state FULL_HOLD) -> the pre-existing RESERVE hold
          is RELEASED as SUPERSEDED_BY_FULL_HOLD -> only then is the auto FULL_HOLD row minted
          over the RESTORED available balance. Each link exists only because the previous one
          fired, and the release-before-mint ordering is observable: minting first would hold
          450000 and leave 50000 disbursable.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-GATE-1: LISTING_ACCURACY, base 1.00, removal_scope ACCOUNT, requires_poa false."
            - "PolicyRule RM-SUS-1: REVIEW_MANIPULATION, base 3.00, removal_scope ACCOUNT, requires_poa false."
            - "Seller S with two ACTIVE listings and 500000 cents of credited proceeds."
            - "Violation v_gate is left UNDER_INVESTIGATION, which puts disbursement_state at RESERVE_HELD and so authorises an explicit RESERVE hold."
            - "RESERVE hold h1, basis ROLLING, risk_tier TIER_1 (ACTIVE, balance 0.00, metric_tier null) -> 0.10 x 500000 = 50000; available 450000, held 50000."
            - "Violation v_sus is SUBSTANTIATED and untouched by any action yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-GATE-1", category: "LISTING_ACCURACY", base_severity_weight: 1.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_gate: $.data.id }
            - call: "POST /policy-rules"
              payload: { code: "RM-SUS-1", category: "REVIEW_MANIPULATION", base_severity_weight: 3.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_sus: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Ironhill Tools LLC", email: "ops@ironhill-tools.example", tax_id_hash: "TAX-IR-0001", payout_bank_token: "BANK-IR-0001", address_fingerprint: "ADDR-IR-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "SKU-IR-1", title: "Forged Bench Vise", category_code: "TOOLS" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", sku: "SKU-IR-2", title: "Cast Anvil 40kg", category_code: "TOOLS" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l2: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 500000, external_reference: "PAYOUT-CYCLE-2026-07" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_gate}", reporter_type: "BUYER", evidence_reference: "EV-IR-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v_gate: $.data.id }
            - call: "POST /violations/${v_gate}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { sv0: $.data.version }
            - call: "POST /disbursement-holds"
              payload: { seller_id: "${s_id}", hold_type: "RESERVE", reserve_basis: "ROLLING", coverage_start: "2026-08-01T00:00:00.000Z", coverage_end: "2026-08-31T00:00:00.000Z", expected_seller_version: "${sv0}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { h1: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_sus}", reporter_type: "PLATFORM_AUTOMATION", evidence_reference: "EV-IR-0002" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v_sus: $.data.id }
            - call: "POST /violations/${v_sus}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v_sus}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", decision_note: "Purchased-review broker invoices recovered from the seller's own uploads." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
          trigger:
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v_sus}", action_type_override: "ACCOUNT_SUSPENSION" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "GET /disbursement-holds"
              payload: { seller_id: "${s_id}", state: "ACTIVE" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { full_hold_id: "$.data[0].id", full_hold_amount: "$.data[0].held_amount_cents", full_hold_tier: "$.data[0].risk_tier" }
          assert:
            - "link 1: Seller.${s_id}.enforcement_state == SUSPENDED   # a non-vacated ACCOUNT_SUSPENSION action now exists (balance is only 3.00)"
            - "link 2a: Listing.${l1}.state == SUPPRESSED and Listing.${l2}.state == SUPPRESSED, both with suppressed_by_suspension == true"
            - "link 2b: Seller.${s_id}.disbursement_state == FULL_HOLD"
            - "link 3: DisbursementHold.${h1}.state == RELEASED and DisbursementHold.${h1}.release_reason == SUPERSEDED_BY_FULL_HOLD"
            - "link 4: exactly one new DisbursementHold row exists with hold_type FULL_HOLD, reserve_basis NONE, auto_created true"
            - "${full_hold_amount} == 500000   # the released 50000 was back in available BEFORE the sweep; minting first would give 450000"
            - "${full_hold_tier} == TIER_3   # risk_tier read after enforcement_state settled on SUSPENDED"
            - "DisbursementHold.${full_hold_id}.coverage_start == 2026-08-01T00:00:00.000Z and coverage_end == 2026-10-30T00:00:00.000Z   # + FULL_HOLD_COVERAGE_DAYS (90)"
            - "Seller.${s_id}.available_balance_cents == 0 and Seller.${s_id}.held_balance_cents == 500000"
            - "Seller.${s_id}.lifetime_credited_cents == 500000 and Seller.${s_id}.lifetime_debited_cents == 0"
            - "available + held == lifetime_credited - lifetime_debited holds after the cascade (0 + 500000 == 500000 - 0)"
            - "Violation.${v_gate}.state == UNDER_INVESTIGATION   # the cascade never touched the unrelated open investigation"
            - "EnforcementAction.${a1}.removed_listing_count == 0   # suspension suppresses, it does not remove"

      - name: related_account_confirmation_bans_and_sweeps_candidate
        grounds:
          - "state_machines.RelatedAccountLink.DETECTED_to_CONFIRMED"
          - "state_machines.Seller.enforcement_state (BANNED via link)"
          - "state_machines.Listing.to_REMOVED"
          - "calculations.related_account_confidence_score"
          - "entities.RelatedAccountLink.fields.matched_seller_state_at_detection"
        distinguishing_aspect: |
          Depth 3 on a completely different trigger — POST /related-account-links/{id}/adjudicate:
          link CONFIRMED -> candidate ban_reason RELATED_ACCOUNT_CONFIRMED and enforcement_state
          BANNED -> (its listings REMOVED, disbursement_state FULL_HOLD) -> the FULL_HOLD row
          sweeps the whole available balance. The link is only confirmable because the incumbent's
          state was snapshotted as BANNED at DETECTION time, so the evidence cannot be rewritten.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule RP-BAN-1: RESTRICTED_PRODUCT, base 3.20, removal_scope ACCOUNT, requires_poa false."
