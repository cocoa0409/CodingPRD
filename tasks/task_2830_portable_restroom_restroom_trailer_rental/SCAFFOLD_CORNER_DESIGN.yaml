          - state_machines.RentalContract.ACTIVE_to_DEMOBILIZED
          - validations[priority=20]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Every RentalContract action endpoint is probed from a state that declares no such transition — activate and invoice from DRAFT, settle-invoice from UNBILLED, demobilize from QUOTED — and each must return ERR_INVALID_STATE_TRANSITION (409) while leaving both dimensions and the row version untouched."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account (ACTIVE, no hold), placeable site (posture OPEN), one CONSTRUCTION contract left in DRAFT/UNBILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Ashgrove Contracting", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Ashgrove Lot", jurisdiction_code: "OK-OK-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-10101", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-10101" }
              as: ComplianceOfficer
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 40, event_duration_hours: 8, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "SITEWORK", ada_required: false }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version, fs0: $.data.fulfillment_state, bs0: $.data.billing_state }
          trigger:
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
              captures: { e_activate: $.data.error_id }
            - call: "POST /rental-contracts/${contract_id}/invoice"
              payload: {}
              as: SalesRep
              captures: { e_invoice: $.data.error_id }
            - call: "POST /rental-contracts/${contract_id}/settle-invoice"
              payload: { payment_reference: "CHK-1" }
              as: PlatformAdmin
              captures: { e_settle: $.data.error_id }
            - call: "GET /rental-contracts/${contract_id}"
              payload: {}
              as: SalesRep
              captures: { fs_mid: $.data.fulfillment_state, bs_mid: $.data.billing_state, v_mid: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
              captures: { fs_quoted: $.data.fulfillment_state, v_quoted: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/demobilize"
              payload: {}
              as: DispatchPlanner
              captures: { e_demob: $.data.error_id }
            - call: "GET /rental-contracts/${contract_id}"
              payload: {}
              as: SalesRep
              captures: { fs_end: $.data.fulfillment_state, bs_end: $.data.billing_state, v_end: $.data.version }
          assert:
            - "${fs0} == DRAFT and ${bs0} == UNBILLED and ${contract_v} == 1"
            - "${e_activate} == ERR_INVALID_STATE_TRANSITION (409) — activate is declared only from QUOTED, and the site was OPEN with no billing hold so no other rule could fire"
            - "${e_invoice} == ERR_INVALID_STATE_TRANSITION (409) — invoicing requires fulfillment_state IN {ACTIVE, DEMOBILIZED}"
            - "${e_settle} == ERR_INVALID_STATE_TRANSITION (409) — settle-invoice is declared only from INVOICED"
            - "${fs_mid} == DRAFT, ${bs_mid} == UNBILLED, ${v_mid} == 1 — three refused actions wrote nothing"
            - "${fs_quoted} == QUOTED and ${v_quoted} == 2"
            - "${e_demob} == ERR_INVALID_STATE_TRANSITION (409) — demobilize is declared only from ACTIVE, and the check precedes the ERR_RECONCILIATION_NO_DEPLOYMENTS test at priority 66"
            - "${fs_end} == QUOTED, ${bs_end} == UNBILLED, ${v_end} == 2"

      - name: missed_visit_side_effect_chain_executes_every_declared_link
        claim_type: side_effect_execution
        grounds:
          - state_machines.ServiceVisit.PLANNED_to_MISSED
        excluded_because:
          difficulty_instance: missed_visit_credit_cascades_charge_contract_account_then_blocks_rebill
          rationale: "That §1.8 instance asserts LINK 1 through LINK 4 of this transition plus the trailing density_realized_pct recompute, each with a precomputed literal, so every side_effect in the list already has a test."

  # ===========================================================================
  - section: calculations
    instances:
      - name: unit_mix_quote_produces_the_expected_total_for_known_inputs
        claim_type: correct_result
        grounds:
          - calculations.unit_mix_quote
          - calculations.line_escalation_invoice
        excluded_because:
          difficulty_instance: escalation_rounds_each_line_then_sums_not_sum_then_round
          rationale: "That §1.8 instance pins the full known-inputs walk end to end: the provisional mix, each line's extended_cents, each per-line escalation and the invoice subtotal, all as precomputed literals. A separate correct_result probe would restate the same arithmetic."

      - name: requoting_supersedes_the_old_lines_and_recomputes_from_the_new_set_only
        claim_type: input_set_filtering
        grounds:
          - calculations.unit_mix_quote
          - state_machines.RentalContract.QUOTED_to_QUOTED
          - entities.QuoteLine.fields.is_superseded
          - endpoints["GET /rental-contracts/{id}/quote-lines"]
        distinguishing_aspect: "After two quotes the contract holds six QuoteLine rows but quoted_cents equals the sum over the three non-superseded ones only; superseded lines are retained for audit yet contribute nothing, which is invisible in a single-quote test."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. Account, site, CONSTRUCTION contract 60 / freq 2 / ada true (13 units), quoted once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Nightjar Constructors", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Nightjar Block C", jurisdiction_code: "MO-JA-CITY", access_class: "OPEN_LOT" }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_id: $.data.id, v1: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${v1}" }
              as: SalesRep
              captures: { quoted_first: $.data.quoted_cents, v2: $.data.version }
          trigger:
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${v2}", quote_note: "same inputs, fresh line set" }
              as: SalesRep
              captures: { quoted_second: $.data.quoted_cents, v3: $.data.version, fs: $.data.fulfillment_state, net: $.data.net_billable_cents }
            - call: "GET /rental-contracts/${contract_id}/quote-lines"
              payload: { is_superseded: false }
              as: SalesRep
              captures: { live_lines: $.data }
            - call: "GET /rental-contracts/${contract_id}/quote-lines"
              payload: { is_superseded: true }
              as: SalesRep
              captures: { dead_lines: $.data }
            - call: "GET /rental-contracts/${contract_id}/quote-lines"
              payload: { quote_variant: "PROVISIONAL" }
              as: SalesRep
              captures: { all_lines: $.data }
          assert:
            - "${quoted_first} == 181500 and ${quoted_second} == 181500 — identical inputs give an identical total"
            - "${v1} == 1, ${v2} == 2, ${v3} == 3 — every quote increments version exactly once"
            - "${fs} == QUOTED (the self-loop, not a new state) and ${net} == 0 — a quote is not yet billable"
            - "${live_lines} has length 3 and its extended_cents values are 130500, 22500, 28500 summing to 181500"
            - "${dead_lines} has length 3 and every element has is_superseded == true"
            - "${all_lines} has length 6 with quote_variant PROVISIONAL on all of them — nothing was deleted, only flagged"

      - name: missed_credit_constants_are_taken_from_the_declared_tables
        claim_type: constants_applied
        grounds:
          - calculations.missed_service_credit
        excluded_because:
          difficulty_instance: missed_credit_pinned_pre_transition_density_resolves_circularity
          rationale: "MISSED_SERVICE_CREDIT_PCT, the DENSITY_SURCHARGE_TIERS table and BASE_PER_VISIT_SERVICE_CENTS_BY_CLASS are all exercised with literal expected values there; a separate constants probe would duplicate that arithmetic."

      - name: relocation_charge_rounds_half_up_once_per_pinned_step
        claim_type: precision
        grounds:
          - calculations.relocation_charge
          - endpoints["POST /unit-deployments/{id}/relocate"]
        distinguishing_aspect: "CRANE_ONLY plus a same-day move is the one combination whose second rounding step is not exact: 41625 * 1.35 = 56193.75 must round_half_up to 56194, so a truncating or single-rounding implementation reports 56193."
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z (the same calendar date the relocation will be effective, so the same-day uplift applies)."
            - "One account with two placeable sites, both approved to posture OPEN: origin OPEN_LOT and destination CRANE_ONLY with max_truck_length_ft 40."
            - "Two STANDARD_PORTABLE assets (tare 8 ft each) deployed and activated on one CONSTRUCTION contract at the origin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Ironwood Tower Group", account_type: "CONSTRUCTION", credit_terms_days: 45 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Ironwood Staging", jurisdiction_code: "IL-CO-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { origin_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Ironwood Roof Deck", jurisdiction_code: "IL-CO-CITY", access_class: "CRANE_ONLY", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { dest_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${origin_id}", permit_kind: "PLACEMENT", authority_ref: "PL-10201", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { p_origin: $.data.id }
            - call: "POST /placement-permits/${p_origin}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${p_origin}/approve"
              payload: { authority_decision_ref: "AD-10201" }
              as: ComplianceOfficer
            - call: "POST /placement-permits"
              payload: { site_id: "${dest_id}", permit_kind: "PLACEMENT", authority_ref: "PL-10202", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { p_dest: $.data.id }
            - call: "POST /placement-permits/${p_dest}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${p_dest}/approve"
              payload: { authority_decision_ref: "AD-10202" }
              as: ComplianceOfficer
            - call: "POST /asset-units"
              payload: { asset_tag: "SP-801", unit_class: "STANDARD_PORTABLE", yard_code: "YD-8", tare_length_ft: 8 }
              as: PlatformAdmin
              captures: { asset_1: $.data.id }
            - call: "POST /asset-units"
              payload: { asset_tag: "SP-802", unit_class: "STANDARD_PORTABLE", yard_code: "YD-8", tare_length_ft: 8 }
              as: PlatformAdmin
              captures: { asset_2: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${origin_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 40, event_duration_hours: 8, service_frequency_per_week: 3, season_code: "OFF", construction_phase: "SITEWORK", ada_required: false }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_1}", deploy_from: "2026-08-03", deploy_to: "2026-09-30" }
              as: DispatchPlanner
              captures: { dep_1: $.data.id }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${asset_2}", deploy_from: "2026-08-03", deploy_to: "2026-09-30" }
              as: DispatchPlanner
              captures: { dep_2: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /unit-deployments/${dep_1}/relocate"
              payload: { destination_site_id: "${dest_id}", effective_date: "2026-08-03", relocation_reason: "crane pick to roof deck" }
              as: DispatchPlanner
              as_user_id: "planner-7"
              captures: { dep_site: $.data.site_id, dep_reloc: $.data.relocation_count }
            - call: "GET /charge-events?contract_id=${contract_id}&charge_kind=RELOCATION"
              payload: {}
              as: ComplianceOfficer
              captures: { same_day_amount: "$.data[0].amount_cents", kind: "$.data[0].charge_kind", severity: "$.data[0].severity" }
            - call: "POST /unit-deployments/${dep_2}/relocate"
              payload: { destination_site_id: "${dest_id}", effective_date: "2026-08-05", relocation_reason: "second pick, two days out" }
              as: DispatchPlanner
              as_user_id: "planner-7"
              captures: { dep2_site: $.data.site_id }
            - call: "GET /charge-events?contract_id=${contract_id}&charge_kind=RELOCATION"
              payload: {}
              as: ComplianceOfficer
              captures: { both_reloc_charges: $.data }
            - call: "GET /rental-contracts/${contract_id}"
              payload: {}
              as: SalesRep
              captures: { debits: $.data.charge_debits_cents }
            - call: "GET /service-sites/${origin_id}"
              payload: {}
              as: DispatchPlanner
              captures: { origin_count: $.data.deployed_unit_count }
            - call: "GET /service-sites/${dest_id}"
              payload: {}
              as: DispatchPlanner
              captures: { dest_count: $.data.deployed_unit_count }
          assert:
            - "${same_day_amount} == 56194 exactly — access step round_half_up(18500 * 225 / 100) = 41625, then same-day step round_half_up(41625 * 135 / 100) = round_half_up(56193.75) = 56194"
            - "${same_day_amount} != 56193, which is what truncation or round-half-even at the second step would give"
            - "${both_reloc_charges} has length 2 and its amount_cents values are exactly {56194, 41625}"
            - "the 41625 row is the non-same-day move of the second unit and pins the intermediate of step 1, so the two roundings are demonstrably separate"
            - "${kind} == RELOCATION and ${severity} == null — severity plays no part in a relocation"
            - "${debits} == 97819 == 56194 + 41625, ${dep_reloc} == 1, ${dep_site} == ${dest_id}, ${dep2_site} == ${dest_id}"
            - "${origin_count} == 0 and ${dest_count} == 2 — both sites were recomputed after each move"

