      - name: representment_deadline_inclusive_boundary
        grounds:
          - calculations.deadline_computation
          - entities.Chargeback.fields.representment_due_at
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: time via the submit endpoint (different metric and endpoint than
          the ratio instance). The deadline is INCLUSIVE: a first packet submitted
          at exactly representment_due_at succeeds, while a cured packet on a
          sibling case submitted one second past due fails with
          ERR_REPRESENTMENT_DEADLINE_PASSED (the REPRESENTED case is outside the
          expiry sweep, so the temporal error surfaces cleanly).
        test_recipe:
          setup:
            - "merchant with two chargebacks NC-D1 and NC-D2 both received 2026-07-15T00:00:00Z, representment_due_at 2026-08-14T00:00:00Z"
            - "NC-D1: packet assembled, held until the exact deadline instant"
            - "NC-D2: packet submitted early, RETURNED_FOR_CURE, cure packet assembled (case REPRESENTED, immune to the expiry sweep)"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Deadline M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-2", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-D1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb1_id: $.data.id }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-2", network_case_id: "NC-D2", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb2_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb1_id}/notify", as: AcquirerOps, payload: {} }
            - { call: "POST /acquirer/chargebacks/${cb2_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb1_id}", evidence_type: RECEIPT, document_uri: "s3://ev/c1.pdf" }
              captures: { ev1: $.data.id }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb2_id}", evidence_type: RECEIPT, document_uri: "s3://ev/c2.pdf" }
              captures: { ev2: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb1_id}"
              as: AcquirerOps
              captures: { cb1_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb1_id}", evidence_item_ids: ["${ev1}"], expected_chargeback_version: "${cb1_v}" }
              captures: { rep1_id: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb2_id}"
              as: AcquirerOps
              captures: { cb2_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb2_id}", evidence_item_ids: ["${ev2}"], expected_chargeback_version: "${cb2_v}" }
              captures: { rep2_id: $.data.id }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-20T00:00:00Z" } }
            - { call: "POST /acquirer/representments/${rep2_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
            - { call: "POST /acquirer/representments/${rep2_id}/network-outcome", as: AcquirerOps, payload: { outcome: RETURNED_FOR_CURE } }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb2_id}", evidence_type: RECEIPT, document_uri: "s3://ev/c2b.pdf" }
              captures: { ev3: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb2_id}"
              as: AcquirerOps
              captures: { cb2_v2: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb2_id}", evidence_item_ids: ["${ev3}"], expected_chargeback_version: "${cb2_v2}" }
              captures: { rep2b_id: $.data.id }
          trigger:
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-08-14T00:00:00Z" } }
            - call: "POST /acquirer/representments/${rep1_id}/submit"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: {}
              captures: { rep1_status: $.data.status }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-08-14T00:00:01Z" } }
            - call: "POST /acquirer/representments/${rep2b_id}/submit"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "rep1_status == SUBMITTED (now == representment_due_at exactly is allowed; the expiry sweep did not fire because the deadline is inclusive)"
            - "err == ERR_REPRESENTMENT_DEADLINE_PASSED at due + 1 second on the cure packet"

      - name: zero_matured_pool_release_rejected
        grounds:
          - calculations.releasable_reserve
          - entities.ReserveLedgerEntry.fields.release_eligible_at
        distinguishing_aspect: |
          Metric: releasable cents via the reserve release endpoint (distinct from
          both the ratio and the deadline instances). The boundary is the empty
          matured pool: holds exist (held_cents 10000) but none have matured at
          the default clock, so release_amount == 0 and the release is rejected
          with ERR_NO_RELEASABLE_FUNDS rather than releasing a partial amount.
        test_recipe:
          setup:
            - "merchant reserve_rate_bps 1000 with 10 sales of 10000 cents occurred 2026-07-25 (release_eligible_at 2026-10-23, after the default clock 2026-08-01); no program enrollments"
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Zero Pool M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 1000 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 10, amount_cents: 10000, occurred_at: "2026-07-25T00:00:00Z", external_ref_prefix: "Z" } }
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { ra_id: "$.data[0].id", held: "$.data[0].held_cents" }
          trigger:
            - call: "POST /acquirer/reserve-accounts/${ra_id}/release"
              as: RiskOfficer
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "held == 10000 (settlement holds exist but are unmatured)"
            - "err == ERR_NO_RELEASABLE_FUNDS (release_amount == 0: matured pool empty AND held == target)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: chargeback_ingest_blocked_by_refunded_transaction
        grounds:
          - state_machines.PreventionAlert.OPEN_to_ACTIONED_REFUND
          - validations[priority=5]
          - entities.Transaction.fields.status
        distinguishing_aspect: |
          Entity pair Chargeback x Transaction: a sale refunded through a
          prevention alert (deflection) is no longer chargebackable — the ingest
          of a network case against it fails ERR_TRANSACTION_NOT_CHARGEBACKABLE.
        test_recipe:
          setup:
            - "merchant reserve_rate_bps 0; one 10000-cent sale; REFUND_OPPORTUNITY alert ingested and actioned REFUND within the 72h window"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Deflect M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - call: "POST /acquirer/transactions"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-25T00:00:00Z" }
              captures: { t_id: $.data.id }
            - call: "POST /acquirer/prevention-alerts"
              as: AcquirerOps
              payload: { transaction_id: "${t_id}", alert_type: REFUND_OPPORTUNITY }
              captures: { alert_id: $.data.id }
            - { call: "POST /acquirer/prevention-alerts/${alert_id}/action", as: MerchantUser, as_user_id: "${m_id}", payload: { action: REFUND } }
          trigger:
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-X1", reason_code: "10.4", amount_cents: 10000 }
              captures: { err: $.data.error_id }
            - call: "GET /acquirer/transactions/${t_id}"
              as: AcquirerOps
              captures: { t_status: $.data.status }
            - call: "GET /acquirer/merchants/${m_id}"
              as: AcquirerOps
              captures: { clearing: $.data.clearing_balance_cents }
          assert:
            - "err == ERR_TRANSACTION_NOT_CHARGEBACKABLE (the deflected sale blocks the chargeback)"
            - "t_status == REFUNDED"
            - "clearing == 0 (sale credit +10000 then refund -10000; no chargeback debit)"

      - name: representment_submit_blocked_by_suspended_merchant
        grounds:
          - state_machines.Merchant.ACTIVE_to_SUSPENDED
          - state_machines.Representment.ASSEMBLED_to_SUBMITTED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair Representment x Merchant (different pair than the
          transaction-gated instance): a packet that was legitimately assembled
          cannot be submitted while its merchant is SUSPENDED, and becomes
          submittable again after reinstatement — the gate follows the parent's
          state, not the packet's.
        test_recipe:
          setup:
            - "merchant with a notified chargeback and a complete ASSEMBLED packet, then suspended by RiskOfficer"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Suspend M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-S1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/r.pdf" }
              captures: { ev1: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev1}"], expected_chargeback_version: "${cb_v}" }
              captures: { rep_id: $.data.id }
            - { call: "POST /acquirer/merchants/${m_id}/suspend", as: RiskOfficer, payload: {} }
          trigger:
            - call: "POST /acquirer/representments/${rep_id}/submit"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: {}
              captures: { err: $.data.error_id }
            - { call: "POST /acquirer/merchants/${m_id}/reinstate", as: RiskOfficer, payload: {} }
            - call: "POST /acquirer/representments/${rep_id}/submit"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: {}
              captures: { rep_status: $.data.status }
          assert:
            - "err == ERR_MERCHANT_SUSPENDED while the merchant is SUSPENDED"
            - "rep_status == SUBMITTED after reinstatement (the packet itself was never touched by the suspension)"

      - name: alert_refund_blocked_by_charged_back_transaction
        grounds:
          - state_machines.PreventionAlert.OPEN_to_ACTIONED_REFUND
          - entities.Transaction.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair PreventionAlert x Transaction (third distinct pair): an
          alert arriving for a sale that is already CHARGED_BACK cannot be
          refunded — the REFUND action fails ERR_TRANSACTION_NOT_REFUNDABLE, so
          deflection cannot retroactively erase a filed case.
        test_recipe:
          setup:
            - "merchant reserve_rate_bps 0; sale T-1 charged back (transaction CHARGED_BACK); a late DISPUTE_ALERT arrives for the same sale"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Late Alert M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - call: "POST /acquirer/transactions"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" }
              captures: { t_id: $.data.id }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-L1", reason_code: "10.4", amount_cents: 10000 } }
            - call: "POST /acquirer/prevention-alerts"
              as: AcquirerOps
              payload: { transaction_id: "${t_id}", alert_type: DISPUTE_ALERT }
              captures: { alert_id: $.data.id }
          trigger:
            - call: "POST /acquirer/prevention-alerts/${alert_id}/action"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { action: REFUND }
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TRANSACTION_NOT_REFUNDABLE (transaction is CHARGED_BACK, not SETTLED)"
            - "PreventionAlert.${alert_id}.status stays OPEN (failed action leaves the alert actionable)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: reason_rule_half_open_window_overlap
        grounds:
          - entities.ReasonCodeRule.fields.effective_from
          - entities.ReasonCodeRule.fields.effective_to
          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on the
          ReasonCodeRule resource keyed by (network, reason_code) — adjacency is
          legal (R2 starting exactly at R1's end succeeds), a straddling R3 is
          rejected with ERR_RULE_WINDOW_OVERLAP, and a chargeback received exactly
          at the shared boundary resolves to the successor rule (fee 3500, not 2000).
        test_recipe:
          setup:
            - "R1 covers VISA 10.4 as [2026-01-01, 2026-07-01) with fee 2000; R2 continues it as [2026-07-01, open) with fee 3500"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" } }
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 3500, effective_from: "2026-07-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Window M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-06-20T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-01T00:00:00Z" } }
          trigger:
            - call: "POST /acquirer/reason-code-rules"
              as: AcquirerOps
              payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 9999, effective_from: "2026-06-15T00:00:00Z", effective_to: "2026-08-01T00:00:00Z" }
              captures: { err: $.data.error_id }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-W1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - call: "GET /acquirer/fee-assessments"
              as: FinanceOps
              payload: { chargeback_id: "${cb_id}" }
              captures: { fee_amount: "$.data[0].amount_cents" }
          assert:
            - "err == ERR_RULE_WINDOW_OVERLAP (R3 [2026-06-15, 2026-08-01) intersects R1 [2026-01-01, 2026-07-01))"
            - "the adjacent R2 was accepted (half-open adjacency is not an overlap)"
            - "fee_amount == 3500 — a case received exactly at 2026-07-01T00:00:00Z resolves to R2, proving R1's window excluded its end"

      - name: enrollment_closed_month_overlap
        grounds:
          - entities.ProgramEnrollment.fields.enrolled_month
          - entities.ProgramEnrollment.fields.exited_month
          - validations[priority=7]
        distinguishing_aspect: |
          Interval semantics: CLOSED month ranges [enrolled_month, exited_month]
          on ProgramEnrollment keyed by (merchant, network, program_code) — unlike
          the half-open rule windows, re-enrollment in the EXIT MONTH itself
          conflicts (ERR_ENROLLMENT_WINDOW_OVERLAP); only the following month
          (2026-09) is clean.
        test_recipe:
          setup:
            - "merchant with a VDMP_STANDARD enrollment (enrolled 2026-05), an APPROVED remediation plan, and three consecutive under-threshold POSTED snapshots (2026-06, 2026-07, 2026-08) so exit-review succeeds with exited_month 2026-08"
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "ReEnroll M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - call: "POST /acquirer/program-enrollments"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}", network: VISA, program_code: VDMP_STANDARD, enrolled_month: "2026-05" }
              captures: { enr_id: $.data.id }
            - call: "POST /acquirer/remediation-plans"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { enrollment_id: "${enr_id}", root_cause_codes: [FRAUD_GAP], corrective_actions: ["deploy 3DS", "tighten refund policy"] }
              captures: { plan_id: $.data.id }
            - { call: "POST /acquirer/remediation-plans/${plan_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
            - { call: "POST /acquirer/remediation-plans/${plan_id}/review", as: RiskOfficer, payload: { decision: APPROVE, decision_note: "ok" } }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 100, amount_cents: 10000, occurred_at: "2026-06-10T00:00:00Z", external_ref_prefix: "U6" } }
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-06", merchant_id: "${m_id}" } }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 100, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z", external_ref_prefix: "U7" } }
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-07", merchant_id: "${m_id}" } }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 100, amount_cents: 10000, occurred_at: "2026-08-10T00:00:00Z", external_ref_prefix: "U8" } }
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-08", merchant_id: "${m_id}" } }
            - call: "POST /acquirer/program-enrollments/${enr_id}/exit-review"
              as: RiskOfficer
              payload: { exited_month: "2026-08" }
              captures: { exit_status: $.data.status }
          trigger:
            - call: "POST /acquirer/program-enrollments"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}", network: VISA, program_code: VDMP_STANDARD, enrolled_month: "2026-08" }
              captures: { err: $.data.error_id }
            - call: "POST /acquirer/program-enrollments"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}", network: VISA, program_code: VDMP_STANDARD, enrolled_month: "2026-09" }
              captures: { enr2_status: $.data.status }
          assert:
            - "exit_status == EXITED (approved plan + 3 most recent POSTED snapshots strictly below threshold)"
            - "err == ERR_ENROLLMENT_WINDOW_OVERLAP — re-enrolling in the exit month 2026-08 collides under CLOSED interval semantics"
            - "enr2_status == ACTIVE for enrolled_month 2026-09 (the first month strictly after the closed range)"

  - rule_id: compensating_invariant
    instances:
      - name: clearing_money_win_prearb_loss_invariant
        grounds:
          - entities.Merchant.fields.clearing_balance_cents
          - state_machines.Chargeback.REPRESENTED_to_DECIDED_WON
          - state_machines.Chargeback.DECIDED_WON_to_PRE_ARBITRATION
          - state_machines.Chargeback.PRE_ARBITRATION_to_DECIDED_LOST
        distinguishing_aspect: |
          Conserved quantity: merchant clearing money. The win (+amount) paired
          with its compensating pre-arb re-debit (-amount) must net to zero
          drift: a case fought WON then lost at pre-arbitration leaves
          clearing_balance_cents identical to a case that was simply accepted
          (both == sale proceeds 10000 minus disputed 10000 == 0).
        test_recipe:
          setup:
            - "merchant MA: 10000-cent sale, full-amount chargeback fought to WON, then pre-arbitration LOST"
            - "merchant MB (control): 10000-cent sale, full-amount chargeback accepted within the response window"
            - "both reserve_rate_bps 0 so no reserve flows pollute clearing"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
