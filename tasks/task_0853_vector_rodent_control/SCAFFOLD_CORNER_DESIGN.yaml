            - "The APN-1001 order was served on 2026-05-05T10:00:00Z and city-abated on its deadline 2026-05-12T10:00:00Z"
            - "The FinanceOfficer captured the order version before the abatement call"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
              as: ProgramAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Iris Vega", badge_number: "B-101", rank: "FIELD_INSPECTOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { insp1_id: $.data.id }
            - call: "POST /vector-control/officers"
              payload: { full_name: "Sam Cole", badge_number: "B-200", rank: "SUPERVISOR", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "HARBORAGE", reporter_type: "RESIDENT", description: "Burrows along the alley fence", reported_severity: "HIGH" }
              as: IntakeClerk
              captures: { comp_id: $.data.id }
            - call: "POST /vector-control/complaints/${comp_id}/triage"
              payload: { severity: "HIGH" }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /vector-control/inspections"
              payload: { kind: "INITIAL", complaint_id: "${comp_id}", officer_id: "${insp1_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T10:00:00Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/inspections/${visit_id}/assessments"
              payload: { harborage_score: 8, attractant_score: 7, sanitation_score: 6, burrow_count: 4 }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:45:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/inspections/${visit_id}/complete"
              payload: { result: "VIOLATION_FOUND" }
              as: Inspector
              as_user_id: "${insp1_id}"
            - call: "GET /vector-control/properties/${prop_id}"
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { prop_v: $.data.version }
            - call: "POST /vector-control/abatement-orders"
              payload: { inspection_id: "${visit_id}", required_actions: ["REMOVE_HARBORAGE"], expected_property_version: "${prop_v}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { order_id: $.data.id }
            - call: "POST /vector-control/abatement-orders/${order_id}/notices"
              payload: { notice_type: "ABATEMENT_ORDER", delivery_method: "CERTIFIED_MAIL" }
              as: IntakeClerk
              captures: { notice_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/notices/${notice_id}/service-result"
              payload: { service_outcome: "DELIVERED" }
              as: IntakeClerk
            - call: "GET /vector-control/abatement-orders/${order_id}"
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { order_v_stale: $.data.version }
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/abatement-orders/${order_id}/city-abate"
              payload: { actual_labor_hours: 4, actual_materials_cents: 12000 }
              as: Supervisor
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /vector-control/cost-recovery-invoices"
              payload: { abatement_order_id: "${order_id}", expected_abatement_order_version: "${order_v_stale}" }
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { err: $.data.error_id }
            - call: "GET /vector-control/abatement-orders/${order_id}"
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { order_v_fresh: $.data.version }
            - call: "POST /vector-control/cost-recovery-invoices"
              payload: { abatement_order_id: "${order_id}", expected_abatement_order_version: "${order_v_fresh}" }
              as: FinanceOfficer
              as_user_id: "fin-001"
              captures: { inv_id: $.data.id }
          assert:
            - "First trigger: HTTP 412 with error_id == ERR_STALE_ORDER_VERSION"
            - "First trigger: GET /vector-control/cost-recovery-invoices?abatement_order_id=${order_id} still returns an empty array"
            - "order_v_fresh == order_v_stale + 1 (the city-abatement call bumped the order)"
            - "Third trigger: HTTP 201 with CostRecoveryInvoice.${inv_id}.billing_status == DRAFT and lien_status == NONE"
            - "CostRecoveryInvoice.${inv_id}.estimated_total_cents == 107180 and final_total_cents == null"
            - "CostRecoveryInvoice.${inv_id}.prepared_by_user_id == fin-001 and owner_id == ${owner_id}"

  - section: consistency_model
    instances:
      - name: corner_cascade_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /vector-control/inspections/{id}/complete]
          - entities.Property.fields.chronic_flag
        distinguishing_aspect: "The consistency model is immediate: the values a subsequent read returns for Complaint, Property and Zone are already final in the same request that completed the inspection, with no second call needed to settle them."
        test_recipe:
          setup:
            - "An IN_PROGRESS visit on APN-1001 carries an assessment scoring 83.50"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
