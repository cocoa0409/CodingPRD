  # ===========================================================================
  # SECTION 2 — state_machines
  # Ten machines / eleven dimensions. Table 2 rows Valid Transition, Precondition
  # Enforcement, Side Effect Execution, Invalid Transitions, Initial State,
  # Terminal State Lockdown and Idempotency are all instantiated; the `cyclic`
  # shape row, the Compensation row and the Conditional-cascade row are already
  # asserted by §1.8 and appear as stubs.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_chemical_lot_quarantine_then_release_returns_it_to_available
        claim_type: Valid Transition
        grounds:
          - state_machines.ChemicalLot.AVAILABLE_to_QUARANTINED
          - state_machines.ChemicalLot.QUARANTINED_to_AVAILABLE
          - endpoints.POST_chemical_lots_status
          - entities.ChemicalLot.fields.status
        distinguishing_aspect: |
          The revert edge of a cyclic machine taken in both directions on one
          row: to_status QUARANTINED sets status QUARANTINED and to_status
          AVAILABLE puts it back, while liters_remaining stays exactly 20.000
          across the round trip — the edge moves status only, never volume.
        test_recipe:
          setup:
            - "Clock at the startup default 2026-08-01T00:00:00Z."
            - "One CAUSTIC ChemicalLot C-2001, concentration_pct_stock 45.0, liters_initial 20.0, expires_on 2026-12-31, seeded AVAILABLE with liters_remaining 20.000."
          setup_api_calls:
            - call: "POST /draft-service/chemical-lots"
              payload: { chemical_type: "CAUSTIC", lot_code: "C-2001", concentration_pct_stock: 45.0, liters_initial: 20.0, expires_on: "2026-12-31" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lot: $.data.id, seed_status: $.data.status, seed_liters: $.data.liters_remaining }
          trigger:
            - call: "POST /draft-service/chemical-lots/${lot}/status"
              payload: { to_status: "QUARANTINED" }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { q_status: $.data.status, q_liters: $.data.liters_remaining }
            - call: "POST /draft-service/chemical-lots/${lot}/status"
              payload: { to_status: "AVAILABLE" }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { r_status: $.data.status, r_liters: $.data.liters_remaining }
          assert:
            - "both POST /draft-service/chemical-lots/${lot}/status calls return HTTP 200"
            - "${seed_status} == AVAILABLE and ${seed_liters} == 20.000"
            - "${q_status} == QUARANTINED"
            - "${r_status} == AVAILABLE"
            - "${q_liters} == 20.000 and ${r_liters} == 20.000"
            - "ChemicalLot.${lot}.chemical_type == CAUSTIC and .concentration_pct_stock == 45.0 are untouched by either transition"

