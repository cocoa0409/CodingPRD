      - name: carve_out_switch_cascades_control_scope_to_coverage_loss_to_posture
        grounds:
          - state_machines.SubserviceOrganization.INCLUSIVE_to_CARVE_OUT
          - state_machines.Control.design_status.DESIGN_MAPPED_to_DESIGN_CARVED_OUT
          - calculations.criteria_coverage
          - calculations.gap_debt_points
          - entities.Gap.fields.source
        distinguishing_aspect: |
          DEPTH 4 from a different trigger (set-method CARVE_OUT, not sample conclusion): (1) the
          method flips to CARVE_OUT; (2) the method flip moves control T-01 to DESIGN_CARVED_OUT with
          in_scope false; (3) the control leaving scope drops both of its ACTIVE mappings out of the
          readiness_view, which creates two COVERAGE_LOSS gaps keyed to CC1.1 and CC6.1; (4) those gap
          creations recompute gap_debt_points to 18.40 and flip gap_posture OPEN -> RESTRICTED.
        test_recipe:
          setup:
            - "Engagement 'Tailspin' (SOC_2_TYPE_2, categories [SECURITY]) is in status SCOPING with gap_posture OPEN and zero gaps."
            - "Two in-scope criteria CC1.1 and CC6.1, each with min_primary_controls 1."
            - "SubserviceOrganization 'DataCo' has method INCLUSIVE and coverage 2026-09-01 to 2026-11-30."
            - "Control T-01 belongs to DataCo, has in_scope true, design_status DESIGN_MAPPED, and ACTIVE PRIMARY mappings to both criteria, so both are covered under the readiness_view."
