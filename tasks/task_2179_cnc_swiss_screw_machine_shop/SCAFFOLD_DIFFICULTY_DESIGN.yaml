- rule_id: combinatorial_formula
  instances:
  - name: quote_pricing_lights_out_cap_and_component_rounding
    grounds:
    - calculations.quote_pricing
    - entities.Part.fields.lights_out_eligible
    - entities.Quote.fields.requested_lights_out_hours
    - entities.Quote.fields.run_cost_cents
    distinguishing_aspect: |
      Mode (a): the run-cost term takes four inputs (effective_qty, cycle_time, the requested lights-out hours and the 0.60 cap) through a conditional branch on Part.lights_out_eligible and a nested min, then charges two different hourly rates to the two hour buckets - a request for 40 unattended hours is clipped to 14.28 on the eligible part and to 0 on the ineligible one.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Two parts identical except for lights_out_eligible, each with a DRAFT Quote for lot_qty 2000 and requested_lights_out_hours 40.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ShopPlanner
        as_user_id: planner-1
      - call: POST /swiss-shop/parts
        payload:
          part_number: P-4471
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          cut_off_length_mm: 26.5
          cycle_time_sec: 42
          setup_hours: 3.5
          material_cost_cents_per_meter: 1850
          finished_mass_g: 18.3
          lights_out_eligible: true
          secondary_required: true
          secondary_minutes_per_piece: 0.4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          part_a: $.data.id
      - call: POST /swiss-shop/parts
        payload:
          part_number: P-4471-NLO
          alloy_code: 303SS
          bar_diameter_mm: 12.7
          cut_off_length_mm: 26.5
          cycle_time_sec: 42
          setup_hours: 3.5
          material_cost_cents_per_meter: 1850
          finished_mass_g: 18.3
          lights_out_eligible: false
          secondary_required: true
          secondary_minutes_per_piece: 0.4
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          part_c: $.data.id
      - call: POST /swiss-shop/quotes
        payload:
          part_id: ${part_a}
          customer_code: ACME
          lot_qty: 2000
          requested_lights_out_hours: 40
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          qa: $.data.id
      - call: POST /swiss-shop/quotes
        payload:
          part_id: ${part_c}
          customer_code: ACME
          lot_qty: 2000
          requested_lights_out_hours: 40
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          qc: $.data.id
      trigger:
      - call: POST /swiss-shop/quotes/${qa}/price
        payload:
          costing_basis: STANDARD_CYCLE
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          a_run: $.data.run_cost_cents
          a_unit: $.data.quoted_unit_price_cents
          a_lot: $.data.quoted_lot_cost_cents
      - call: POST /swiss-shop/quotes/${qc}/price
        payload:
          costing_basis: STANDARD_CYCLE
        as: ShopPlanner
        as_user_id: planner-1
        captures:
          c_run: $.data.run_cost_cents
          c_unit: $.data.quoted_unit_price_cents
          c_lot: $.data.quoted_lot_cost_cents
      assert:
      - ${a_run} == 178976
      - ${a_lot} == 443718
      - ${a_unit} == 284
      - ${c_run} == 226100
      - ${c_lot} == 490842
      - ${c_unit} == 315
      - Quote.${qa}.effective_qty == 2040
      - Quote.${qc}.effective_qty == 2040
      - Quote.${qa}.setup_cost_cents == 38500
      - Quote.${qa}.secondary_cost_cents == 98667
      - Quote.${qa}.material_cost_cents == 127575
  - name: reclamation_credit_round_per_alloy_line_then_sum
    grounds:
    - calculations.reclamation_credit
    - calculations.chip_and_coolant_accrual
    - entities.Machine.fields.chip_accrual_by_alloy
    - entities.Machine.fields.last_reclamation_credit_cents
    distinguishing_aspect: |
      Mode (b): the swarf credit rounds each alloy line to the cent BEFORE summing - 3.504 kg of 303SS at 118 c/kg gives 413.472 -> 413 and 2.861 kg of C360 at 465 c/kg gives 1330.365 -> 1330, so the chip credit is 1743, whereas summing first (1743.837) and rounding once would give 1744, a one-cent divergence that pins the declared order.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Machine SW-01 has completed two work orders, one in 303SS and one in C360.
      - 'Machine.chip_accrual_by_alloy holds {303SS: 3.504, C360: 2.861} and coolant_makeup_liters is 1.342.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
