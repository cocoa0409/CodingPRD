              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE  # state (p6) outranks ERR_RETURN_WINDOW_CLOSED (p9)"

      - name: final_sale_beats_return_window_closed_on_returns
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_FINAL_SALE_NOT_RETURNABLE]
