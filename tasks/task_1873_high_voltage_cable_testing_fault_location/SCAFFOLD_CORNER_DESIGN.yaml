            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 90.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/test-series/${s}/faults", as: TestSupervisor, captures: { f: "$.data[0].id" } }
            - { call: "POST /cable-diagnostics/faults/${f}/pinpoint", payload: { trace_time_us: 20.0, pinpoint_method: "PULSE_ECHO" }, as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/excavation-orders", payload: { fault_record_id: "${f}", target_location_m: 1560.0, dig_start: "2026-08-10T09:30:00Z", dig_end: "2026-08-10T11:00:00Z", permit_ref: "MX-1", cost_cents: 100040 }, as: FaultCrewLead, captures: { e1: $.data.id } }
            - { call: "POST /cable-diagnostics/excavation-orders/${e1}/permit", as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:45:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/excavation-orders/${e1}/start", as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/repair-splices", payload: { fault_record_id: "${f}", excavation_order_id: "${e1}", splice_type: "HEAT_SHRINK", cost_cents: 200040 }, as: FaultCrewLead, captures: { sp: $.data.id } }
            - { call: "POST /cable-diagnostics/repair-splices/${sp}/start", as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/repair-splices/${sp}/cure", as: FaultCrewLead }
            - { call: "POST /cable-diagnostics/excavation-orders/${e1}/backfill", as: FaultCrewLead, captures: { e1st: $.data.status } }
          trigger:
            - { call: "POST /cable-diagnostics/excavation-orders", payload: { fault_record_id: "${f}", target_location_m: 1560.0, dig_start: "2026-08-10T10:30:00Z", dig_end: "2026-08-10T12:00:00Z", permit_ref: "MX-3", cost_cents: 50000 }, as: FaultCrewLead, captures: { err: $.data.error_id } }
            - { call: "POST /cable-diagnostics/excavation-orders", payload: { fault_record_id: "${f}", target_location_m: 1560.0, dig_start: "2026-08-10T11:00:00Z", dig_end: "2026-08-10T12:00:00Z", permit_ref: "MX-4", cost_cents: 50000 }, as: FaultCrewLead, captures: { e2: $.data.id } }
          assert:
            - "E1 backfilled successfully once splice reached CURING (ERR_SPLICE_NOT_CURING gate satisfied)"
            - "overlapping dig (10:30) rejected: error_id == ERR_DIG_WINDOW_OVERLAP, http 409"
            - "adjacent dig (11:00 == E1 dig_end) created 201 (half-open semantics)"

  # =============================================================== endpoints
  - section: endpoints
    instances:
      - name: pagination_limit_offset_filter
        claim_type: listing
        grounds: ["endpoints.GET_/cable-diagnostics/circuits", "response_envelope"]
        distinguishing_aspect: "limit/offset/total_count/has_more interact: 3 circuits, limit=2 -> 2 items has_more true; offset=2 -> 1 item has_more false; voltage_class filter narrows total_count to 1."
        test_recipe:
          setup: ["three circuits: two KV_15, one KV_25"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-P1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-P2", voltage_class: "KV_15", length_m: 1100, installation_year: 2016 }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-P3", voltage_class: "KV_25", length_m: 1200, installation_year: 2017 }, as: SystemAdmin }
          trigger:
            - { call: "GET /cable-diagnostics/circuits?limit=2", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/circuits?limit=2&offset=2", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/circuits?voltage_class=KV_25", as: NetworkPlanner }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 item, total_count == 3, has_more == false"
            - "filtered: total_count == 1, item circuit_ref == CKT-P3"

      - name: not_found_error_envelope_shape
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "response_envelope", "validations[priority=4]"]
        distinguishing_aspect: "Unknown UUID on a single-resource GET returns the fixed error envelope: response_type error, data.error_id ERR_NOT_FOUND, data.message present, http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /cable-diagnostics/circuits/00000000-0000-4000-8000-00000000dead", as: SystemAdmin, captures: { err: $.data.error_id, msg: $.data.message } }
          assert: ["http 404; error_id == ERR_NOT_FOUND; message non-empty; meta.api_request_id present; response_type == error"]

      - name: fk_reverse_reachability_subresources
        claim_type: retrieval
        grounds: ["entities.TestJob.fields.circuit_id", "entities.TestJob.fields.outage_window_id", "entities.OutageWindow.fields.circuit_id"]
        distinguishing_aspect: "Every FK is traversable parent->child: circuit->jobs, window->jobs, circuit->windows; empty reverse collections return []."
        test_recipe:
          setup: ["circuit with one APPROVED window and one DRAFT job"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-P4", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
          trigger:
            - { call: "GET /cable-diagnostics/circuits/${c}/test-jobs", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/outage-windows/${w}/test-jobs", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/circuits/${c}/outage-windows", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/circuits/${c}/health-assessments", as: NetworkPlanner }
          assert:
            - "circuit->test-jobs returns [${j}]; window->test-jobs returns [${j}]; circuit->outage-windows returns [${w}]"
            - "circuit->health-assessments returns [] (empty array, 200)"

      - name: trend_computed_read
        claim_type: computed_read
        grounds: ["endpoints.GET_/cable-diagnostics/circuits/{id}/trend", "entities.CableCircuit.fields.replacement_recommended"]
        distinguishing_aspect: "Trend read reflects the adopted assessment: one point with score 100.0/GOOD and replacement_recommended false."
        test_recipe:
          setup: ["circuit (installed 2015); empty-set FORMAL assessment COMPUTED -> REVIEWED -> ADOPTED"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-P5", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer, captures: { cv: $.data.version } }
            - { call: "POST /cable-diagnostics/health-assessments", payload: { circuit_id: "${c}", basis: "FORMAL", expected_circuit_version: "${cv}" }, as: AssetEngineer, captures: { ha: $.data.id } }
            - { call: "POST /cable-diagnostics/health-assessments/${ha}/review", as: AssetEngineer }
            - { call: "POST /cable-diagnostics/health-assessments/${ha}/adopt", as: NetworkPlanner }
          trigger:
            - { call: "GET /cable-diagnostics/circuits/${c}/trend", as: AssetEngineer, captures: { pts: $.data.points, rr: $.data.replacement_recommended } }
          assert: ["points has length 1 with health_index_score == 100.0 and band == GOOD; replacement_recommended == false"]

      - name: window_before_default_clock_rejected
        claim_type: conditional_action
        grounds: ["endpoints.POST_/cable-diagnostics/_clock/set_current_utc", "validations[priority=10]"]
        distinguishing_aspect: "Proves the fixed clock default 2026-08-01T00:00:00Z without any set call: a window starting 2026-07-31T23:00Z is rejected ERR_WINDOW_IN_PAST on a fresh server."
        test_recipe:
          setup: ["circuit exists; clock never set"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-P6", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-07-31T23:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: NetworkPlanner, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_WINDOW_IN_PAST, http 409 (default clock 2026-08-01T00:00:00Z already past window_start)"]

      - name: assignment_activate_before_mobilize_rejected
        claim_type: conditional_action
        grounds: ["state_machines.EquipmentAssignment.CONFIRMED_to_ACTIVE", "validations[priority=12]"]
        distinguishing_aspect: "Activation gate is now >= mobilize_at: activating 19h early fails ERR_WINDOW_NOT_ACTIVE; at exactly mobilize_at it succeeds."
        test_recipe:
          setup: ["PLANNED job; assignment [2026-08-10T07:00Z, 11:00Z] CONFIRMED"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-P7", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-10T11:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T12:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/activate", as: DispatchCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T07:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/activate", as: DispatchCoordinator, captures: { st: $.data.status } }
          assert:
            - "early activation: error_id == ERR_WINDOW_NOT_ACTIVE, http 409"
            - "at exactly mobilize_at: status == ACTIVE"

  # ================================================================== errors
  - section: errors
    instances:
      - name: error_window_overlap_trigger_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: outage_windows_half_open_adjacency_allowed
          rationale: "ERR_WINDOW_OVERLAP is asserted as the failure path of the named §1.8 instance (window C at 11:59)."
      - name: error_grounding_gate_trigger_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_GROUNDING_NOT_VERIFIED]"]
        excluded_because:
          difficulty_instance: energize_blocked_until_grounding_verified
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_retest_required_trigger_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETEST_REQUIRED]"]
        excluded_because:
          difficulty_instance: splice_acceptance_requires_passing_retest
          rationale: "Asserted as the first trigger of the named §1.8 instance."
      - name: error_stale_version_trigger_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: health_index_formal_vs_provisional_input_set
          rationale: "OCC happy path exercised there; the stale-version failure path is covered non-stub by stale_circuit_version_rejected and reschedule_supersede_then_stale_rejected in this file's cross_cutting_layers section."

  # ==================================================================== rbac
  - section: rbac
    instances:
      - name: safety_officer_cannot_create_window
        claim_type: role_denial
        grounds: ["roles.SafetyOfficer", "endpoints.POST_/cable-diagnostics/outage-windows", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "SafetyOfficer (peer role) is denied NetworkPlanner's exclusive window creation."
        test_recipe:
          setup: ["circuit exists"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-R1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN, http 403"]

      - name: technician_cannot_evaluate
        claim_type: role_denial
        grounds: ["roles.FieldTechnician", "endpoints.POST_/cable-diagnostics/test-series/{id}/evaluate"]
        distinguishing_aspect: "FieldTechnician may log readings but never evaluate — segregation of execution vs evaluation."
        test_recipe:
          setup: ["series LOGGING with 3 readings"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-R2", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: $.data.id } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: $.data.id } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 4.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 4.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 4.0, ambient_temp_c: 20.0 }, as: FieldTechnician, as_user_id: "ft-1" }
          trigger:
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: FieldTechnician, as_user_id: "ft-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN, http 403; series stays LOGGING"]

      - name: planner_cannot_verify_grounding
        claim_type: role_denial
        grounds: ["roles.NetworkPlanner", "endpoints.POST_/cable-diagnostics/isolation-permits/{id}/verify-grounding"]
        distinguishing_aspect: "Grounding verification is SafetyOfficer-exclusive; a NetworkPlanner (even a different person than the issuer) is denied."
        test_recipe:
          setup: ["job PLANNED; permit ISSUED by so-1"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-R3", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: $.data.id } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: NetworkPlanner, as_user_id: "np-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN, http 403; permit stays ISSUED"]

      - name: all_roles_can_read_circuit
        claim_type: role_allowed
        grounds: ["roles", "endpoints.GET_/cable-diagnostics/circuits/{id}"]
        distinguishing_aspect: "All eight roles share read access: each role GETs the circuit successfully."
        test_recipe:
          setup: ["circuit exists"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-R4", voltage_class: "KV_69", length_m: 5200, installation_year: 1999 }, as: SystemAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "GET /cable-diagnostics/circuits/${c}", as: SystemAdmin }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: TestSupervisor }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: FaultCrewLead }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: DispatchCoordinator }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer }
          assert: ["all eight GETs return 200 with circuit_ref == CKT-R4"]

  # ==================================================== cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: stale_circuit_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[health-assessment-create-stale-circuit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on CableCircuit.version: creating an assessment with a version captured before another assessment's creation bumped the circuit is rejected 412."
        test_recipe:
          setup: ["circuit exists; version captured (v); first assessment created with v (bumps circuit version to v+1)"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-X1", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer, captures: { cv: $.data.version } }
            - { call: "POST /cable-diagnostics/health-assessments", payload: { circuit_id: "${c}", basis: "FORMAL", expected_circuit_version: "${cv}" }, as: AssetEngineer, captures: { ha1: $.data.id } }
          trigger:
            - { call: "POST /cable-diagnostics/health-assessments", payload: { circuit_id: "${c}", basis: "PROVISIONAL", expected_circuit_version: "${cv}" }, as: AssetEngineer, captures: { err: $.data.error_id } }
          assert:
            - "first create succeeded with the observed version; second create with the same (now stale) version: error_id == ERR_STALE_VERSION, http 412"
            - "HealthAssessment.${ha1} remains the only non-SUPERSEDED assessment"

      - name: reschedule_supersede_then_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[test-job-reschedule-stale]", "errors[ERR_STALE_VERSION]", "state_machines.TestJob.PLANNED_to_PLANNED"]
        distinguishing_aspect: "OCC on TestJob.version with legit supersede: first reschedule with the observed version succeeds and bumps version; replaying the same version is rejected 412."
        test_recipe:
          setup: ["circuit; two APPROVED windows W1, W2; job PLANNED on W1"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-X2", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: NetworkPlanner, captures: { w1: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }, as: NetworkPlanner, captures: { w2: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w1}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/outage-windows/${w2}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w1}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/test-jobs/${j}", as: NetworkPlanner, captures: { jv: $.data.version } }
          trigger:
            - { call: "POST /cable-diagnostics/test-jobs/${j}/reschedule", payload: { outage_window_id: "${w2}", expected_test_job_version: "${jv}" }, as: NetworkPlanner, captures: { ow: $.data.outage_window_id, v2: $.data.version } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/reschedule", payload: { outage_window_id: "${w1}", expected_test_job_version: "${jv}" }, as: NetworkPlanner, captures: { err: $.data.error_id } }
          assert:
            - "first reschedule: outage_window_id == ${w2}, version == jv + 1"
            - "replay with stale version: error_id == ERR_STALE_VERSION, http 412; job still on ${w2}"

      - name: conditional_flag_selects_corrected_official
        claim_type: conditional_feature_flags
        grounds: ["entities.TestJob.fields.use_temperature_correction", "calculations.series_verdict"]
        distinguishing_aspect: "Flag ON selects the corrected basis as official: identical 88.0 E-3 readings at 35C yield verdict_as_tested FAIL but official verdict MONITOR and NO auto-fault."
        test_recipe:
          setup: ["job IN_PROGRESS with use_temperature_correction=true; series ENERGIZING"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-X3", voltage_class: "KV_15", length_m: 2000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 900000, use_temperature_correction: true }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/isolation-permits", payload: { test_job_id: "${j}", isolation_points: ["SW-N"], ground_count: 2 }, as: SafetyOfficer, as_user_id: "so-1", captures: { p: $.data.id } }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/issue", as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /cable-diagnostics/isolation-permits/${p}/verify-grounding", as: SafetyOfficer, as_user_id: "so-2" }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-12T12:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments/${a}/confirm", as: DispatchCoordinator }
            - { call: "POST /cable-diagnostics/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/activate", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/start", as: TestSupervisor }
            - { call: "POST /cable-diagnostics/test-series", payload: { test_job_id: "${j}", method: "VLF_TAN_DELTA", test_voltage_kv: 13.05 }, as: TestSupervisor, captures: { s: $.data.id } }
            - { call: "POST /cable-diagnostics/test-series/${s}/energize", as: TestSupervisor }
          trigger:
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 0, applied_voltage_kv: 4.35, tan_delta_e3: 88.0, ambient_temp_c: 35.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 1, applied_voltage_kv: 8.7, tan_delta_e3: 88.0, ambient_temp_c: 35.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/readings", payload: { step_index: 2, applied_voltage_kv: 13.05, tan_delta_e3: 88.0, ambient_temp_c: 35.0 }, as: FieldTechnician, as_user_id: "ft-1" }
            - { call: "POST /cable-diagnostics/test-series/${s}/evaluate", as: TestSupervisor, captures: { v: $.data.verdict, vat: $.data.verdict_as_tested } }
            - { call: "GET /cable-diagnostics/test-series/${s}/faults", as: TestSupervisor }
          assert:
            - "verdict_as_tested == FAIL but official verdict == MONITOR (flag true)"
            - "GET faults returns [] and circuit unresolved_fault_count stays 0"

      - name: job_abort_cascades_assignments
        claim_type: cascading_side_effects
        grounds: ["state_machines.TestJob.PLANNED_to_ABORTED", "state_machines.EquipmentAssignment.RESERVED_to_CANCELLED"]
        distinguishing_aspect: "Aborting a PLANNED job cascade-cancels its RESERVED assignment and returns the unit to AVAILABLE with committed_hours 0.0."
        test_recipe:
          setup: ["PLANNED job with RESERVED assignment (unit ASSIGNED, committed 4.0)"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-X4", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/test-jobs", payload: { circuit_id: "${c}", outage_window_id: "${w}", requested_methods: ["VLF_TAN_DELTA"], approved_budget_cents: 800000 }, as: NetworkPlanner, captures: { j: $.data.id } }
            - { call: "POST /cable-diagnostics/test-jobs/${j}/plan", as: NetworkPlanner }
            - { call: "POST /cable-diagnostics/mobile-units", payload: { unit_code: "VAN-1", capabilities: ["VLF", "PD", "TDR"], max_test_voltage_kv: 30.0 }, as: SystemAdmin, captures: { u: $.data.id } }
            - { call: "POST /cable-diagnostics/equipment-assignments", payload: { mobile_unit_id: "${u}", test_job_id: "${j}", mobilize_at: "2026-08-10T07:00:00Z", demobilize_at: "2026-08-10T11:00:00Z" }, as: DispatchCoordinator, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /cable-diagnostics/test-jobs/${j}/abort", as: NetworkPlanner, captures: { jst: $.data.status } }
            - { call: "GET /cable-diagnostics/equipment-assignments/${a}", as: DispatchCoordinator, captures: { ast: $.data.status } }
            - { call: "GET /cable-diagnostics/mobile-units/${u}", as: DispatchCoordinator, captures: { ust: $.data.status, uch: $.data.committed_hours } }
          assert:
            - "TestJob.${j}.status == ABORTED; EquipmentAssignment.${a}.status == CANCELLED"
            - "MobileUnit.${u}.status == AVAILABLE and committed_hours == 0.0"

      - name: window_approve_cancel_conserves_minutes
        claim_type: derived_field_reconciliation
        grounds: ["entities.CableCircuit.fields.approved_outage_minutes_total", "state_machines.OutageWindow.APPROVED_to_CANCELLED"]
        distinguishing_aspect: "Derived counter reconciles both directions: approve adds 240 (and bumps window version to 2), cancel subtracts 240, circuit returns OUTAGE_PENDING -> IN_SERVICE."
        test_recipe:
          setup: ["circuit; window [2026-08-10T08:00Z, 12:00Z] (240 min) REQUESTED"]
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-X5", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /cable-diagnostics/outage-windows", payload: { circuit_id: "${c}", kind: "PLANNED_DIAGNOSTIC", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: NetworkPlanner, captures: { w: $.data.id, wv1: $.data.version } }
          trigger:
            - { call: "POST /cable-diagnostics/outage-windows/${w}/approve", as: NetworkPlanner, captures: { wv2: $.data.version, est: $.data.estimated_charge_cents } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: NetworkPlanner, captures: { m1: $.data.approved_outage_minutes_total, cst1: $.data.status } }
            - { call: "POST /cable-diagnostics/outage-windows/${w}/cancel", as: NetworkPlanner }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: NetworkPlanner, captures: { m2: $.data.approved_outage_minutes_total, cst2: $.data.status } }
          assert:
            - "window version 1 at create, 2 after approve (mutation increments version)"
            - "after approve: approved_outage_minutes_total == 240, circuit OUTAGE_PENDING"
            - "after cancel: approved_outage_minutes_total == 0, circuit IN_SERVICE"

      - name: window_close_cascade_stub
        claim_type: cascading_side_effects
        grounds: ["state_machines.OutageWindow.ACTIVE_to_CLOSED"]
        excluded_because:
          difficulty_instance: window_close_cascade_restores_circuit_and_frees_fleet
          rationale: "Full N-level cascade (window -> circuit -> assignment -> unit) asserted end-to-end in the named §1.8 instance."

      - name: dual_variant_calc_stub
        claim_type: dual_variant_calculation
        grounds: ["calculations.series_verdict", "calculations.health_index_score", "calculations.fault_distance_corridor"]
        excluded_because:
          difficulty_instance: verdict_temperature_correction_flips_official_verdict
          rationale: "Variant divergence + selection asserted across three §1.8 dual_variant_calc instances (plus health_index_formal_vs_provisional_input_set and fault_distance_standard_vs_calibrated_velocity)."

  # ======================================================== consistency model
  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "entities.CableCircuit"]
        distinguishing_aspect: "Immediate consistency: a creation is fully visible (all stored + computed fields) in the very next GET, same request sequence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-Z1", voltage_class: "KV_25", length_m: 1750, installation_year: 2003 }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "GET /cable-diagnostics/circuits/${c}", as: AssetEngineer, captures: { cr: $.data.circuit_ref, len: $.data.length_m, st: $.data.status } }
          assert: ["GET returns circuit_ref == CKT-Z1, length_m == 1750, voltage_class == KV_25, status == IN_SERVICE immediately"]
