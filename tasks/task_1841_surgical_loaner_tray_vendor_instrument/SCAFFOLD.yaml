  - { method: GET, path: "/vendor-office/requests/{id}/trays", description: "List trays of a request (sub-resource)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["limit?", "offset?"], output: "LoanerTray[]", side_effects: [] }
