          - concurrency_rules.statement-create-stale-partnership
        distinguishing_aspect: |
          A different contended resource (the Partnership's settlement calendar rather than
          a Program's exclusive CIP slot) governed by the opposite interval convention:
          statement periods are FULLY CLOSED [period_start, period_end], so the second
          statement's period_start of 2026-09-30 collides with the existing September
          statement's period_end of 2026-09-30 — exactly the touching case that the
          half-open CIP windows allow.
