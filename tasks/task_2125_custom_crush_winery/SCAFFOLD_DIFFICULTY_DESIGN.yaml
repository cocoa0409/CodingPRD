          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ACTIVE Contract with one 3135.00-gallon INTAKE Lot housed in tank T-101 and advanced to production_status AGING, bond_status IN_BOND."
            - "One REQUESTED TAXPAID_REMOVAL ReleaseOrder for 100.00 gallons off that lot (a partial draw, not a drain)."
