            - "ClashIssue.${c1}.cycle_count == 1"
            - "ClashIssue.${c1}.actual_cost_cents == 24000  (2.0 x 12000; overwrites the first verify's 48000)"
            - "ClashDetectionRun.${r1}.total_clash_count == 1"
            - "ClashDetectionRun.${r1}.open_clash_count == 0 and closed_clash_count == 1"
            - "TradePartner.${p1}.consumed_resolution_hours == 6.0  (4.0 + 2.0; hours are never refunded)"

      - name: project_phase_posture_parallel_dimensions
        grounds:
          - state_machines.Project.SCHEMATIC_DESIGN_to_DESIGN_DEVELOPMENT
          - state_machines.Project.NORMAL_to_COORDINATION_HOLD
          - entities.Project.fields.current_phase
          - entities.Project.fields.coordination_posture
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (different from ClashIssue's cycle):
          current_phase advances SCHEMATIC_DESIGN -> DESIGN_DEVELOPMENT while
          coordination_posture independently sits at COORDINATION_HOLD (driven by three
          open CRITICAL clashes, CRI = 25 < 60); clearing the clashes returns posture to
          NORMAL while the phase stays DESIGN_DEVELOPMENT. Neither dimension's transition
          alters the other's value.
        test_recipe:
          setup:
            - "Project P, partner P1, M1 ACCEPTED, F1 FROZEN, R1 RUNNING with three CRITICAL clashes (overlap 75.0) left unassigned"
            - "CRI = 100 - 3 x 25 = 25 < 60 -> posture COORDINATION_HOLD"
          setup_api_calls:
