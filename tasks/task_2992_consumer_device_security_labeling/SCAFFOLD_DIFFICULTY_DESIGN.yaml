          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_1 tier, ELIGIBLE SMART_SPEAKER category, five-criterion catalogue."
            - "One SMALL manufacturer with an ELIGIBLE speaker product, an APPROVED self-attestation assessment and an ACTIVE PUBLISHED label grant."
            - "One retailer with education_materials_ack true holding one AUTHORIZED IN_STORE display authorization on that grant."
