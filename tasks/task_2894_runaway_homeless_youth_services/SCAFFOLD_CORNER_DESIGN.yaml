              payload: { legal_first_name: "Odell", legal_last_name: "Prasad", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { term_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${term_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { term_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${term_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${term_youth_id}", program_id: "${term_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { term_adm_id: $.data.id }
            - call: "POST /ryhs/admissions/${term_adm_id}/discharge"
              payload: { exit_destination: "OTHER_SHELTER" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /ryhs/admissions/${term_adm_id}/discharge"
              payload: { exit_destination: "UNKNOWN" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { term_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 409 with error_id ERR_ADMISSION_ALREADY_TERMINAL"
            - "Admission.${term_adm_id}.status == DISCHARGED"
            - "Admission.${term_adm_id}.exit_destination == OTHER_SHELTER"
            - "Admission.${term_adm_id}.final_billable_nights == 0"
            - "ShelterProgram.${term_program_id}.occupied_beds == 0"
            - "ShelterProgram.${term_program_id}.utilization_bp == 0"
            - "Youth.${term_youth_id}.status == EXITED"
            - "Youth.${term_youth_id}.cumulative_shelter_nights == 0"

      - name: resolved_notification_rejects_a_second_resolve
        claim_type: idempotency
        grounds:
          - validations[priority=12]
          - errors.ERR_NOTIFICATION_ALREADY_RESOLVED
          - state_machines.GuardianNotification.terminal_states
        distinguishing_aspect: "CONTACTED is terminal for a GuardianNotification, so replaying the same resolve returns 409 ERR_NOTIFICATION_ALREADY_RESOLVED - priority 12 wins over the priority 22 safety gate - and resolved_at is not restamped."
        test_recipe:
          setup:
            - "an ACTIVE admission whose GuardianNotification was attempted once by PHONE and then resolved CONTACTED at the default clock, dropping the youth to risk_posture OPEN"
            - "the clock is then advanced to 2026-08-01T09:00:00Z so a restamped resolved_at would be visible"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
