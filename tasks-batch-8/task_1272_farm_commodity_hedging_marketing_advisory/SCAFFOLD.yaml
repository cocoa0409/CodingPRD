  - { method: GET, path: "/advisory/operations/{operationId}", description: "Read one operation", roles: [CommodityAdvisor, Grower, ComplianceOfficer, PlatformAdmin], code: 200, input: [], output: GrowerOperation, side_effects: [] }
  - { method: GET, path: "/advisory/operations/{operationId}/performance-report", description: "Computed read: weighted average sale price vs benchmark (dual-variant)", roles: [CommodityAdvisor, Grower], code: 200, input: ["benchmark_method?"], output: "{ weighted_avg_sale_price: number|null, benchmark_price: number|null, outperformance_bps: integer|null, priced_contract_count: integer, benchmark_tick_count: integer }", side_effects: [] }
  - { method: GET, path: "/advisory/operations/{operationId}/cash-flow-projection", description: "Computed read: month-bucketed cash in/out for storage and marketing decisions", roles: [CommodityAdvisor, Grower], code: 200, input: ["through_date?"], output: "{ buckets: array, total_inflow: number, total_outflow: number, net_cash_flow: number }", side_effects: [] }

  # --- ProductionBaseline ---
  - { method: POST, path: "/advisory/production-baselines", description: "Create a baseline; supersedes the operation's existing non-SUPERSEDED baseline (OCC on GrowerOperation.version)", roles: [CommodityAdvisor], code: 201, input: [operation_id, planted_acres, aph_yield_bushels, trend_yield_bushels, expected_operation_version], output: ProductionBaseline, side_effects: ["Prior non-SUPERSEDED baseline of the operation -> SUPERSEDED", "expected_bushels_aph / expected_bushels_trend / expected_bushels computed", "increments GrowerOperation.version by 1"] }
  - { method: GET, path: "/advisory/production-baselines/{baselineId}", description: "Read one baseline", roles: [CommodityAdvisor, Grower, ComplianceOfficer], code: 200, input: [], output: ProductionBaseline, side_effects: [] }
  - { method: GET, path: "/advisory/production-baselines", description: "List baselines", roles: [CommodityAdvisor, Grower, ComplianceOfficer], code: 200, input: ["operation_id?", "status?", "limit?", "offset?"], output: "ProductionBaseline[]", side_effects: [] }
  - { method: POST, path: "/advisory/production-baselines/{baselineId}/certify", description: "Grower attestation: PROVISIONAL -> CERTIFIED", roles: [Grower], code: 200, input: [], output: ProductionBaseline, side_effects: ["status -> CERTIFIED", "increments ProductionBaseline.version by 1"] }

  # --- InsurancePolicy ---
  - { method: POST, path: "/advisory/insurance-policies", description: "Quote a crop-insurance policy", roles: [CommodityAdvisor], code: 201, input: [operation_id, baseline_id, coverage_level_pct, projected_price], output: InsurancePolicy, side_effects: ["status=QUOTED"] }
  - { method: GET, path: "/advisory/insurance-policies/{policyId}", description: "Read one policy", roles: [CommodityAdvisor, Grower], code: 200, input: [], output: InsurancePolicy, side_effects: [] }
  - { method: GET, path: "/advisory/insurance-policies", description: "List policies", roles: [CommodityAdvisor, Grower], code: 200, input: ["operation_id?", "baseline_id?", "status?", "limit?", "offset?"], output: "InsurancePolicy[]", side_effects: [] }
  - { method: POST, path: "/advisory/insurance-policies/{policyId}/bind", description: "Bind the quote; freezes guarantee_bushels", roles: [Grower], code: 200, input: [], output: InsurancePolicy, side_effects: ["status -> BOUND", "guarantee_bushels frozen"] }
  - { method: POST, path: "/advisory/insurance-policies/{policyId}/file-claim", description: "File and settle a production claim; may raise over_sold_flag", roles: [Grower], code: 200, input: [actual_harvested_bushels, harvest_price], output: InsurancePolicy, side_effects: ["status -> CLAIM_SETTLED", "indemnity_dollars computed", "GrowerOperation.over_sold_flag evaluated"] }

  # --- MarketingPlan ---
  - { method: POST, path: "/advisory/marketing-plans", description: "Create a marketing plan (DRAFT)", roles: [CommodityAdvisor], code: 201, input: [operation_id, baseline_id, max_priced_pct], output: MarketingPlan, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/advisory/marketing-plans/{planId}", description: "Read one plan", roles: [CommodityAdvisor, Grower, ComplianceOfficer], code: 200, input: [], output: MarketingPlan, side_effects: [] }
  - { method: GET, path: "/advisory/marketing-plans", description: "List plans", roles: [CommodityAdvisor, Grower, ComplianceOfficer], code: 200, input: ["operation_id?", "baseline_id?", "status?", "limit?", "offset?"], output: "MarketingPlan[]", side_effects: [] }
  - { method: PUT, path: "/advisory/marketing-plans/{planId}", description: "Amend plan parameters (OCC on plan version)", roles: [CommodityAdvisor], code: 200, input: [expected_marketing_plan_version, "max_priced_pct?"], output: MarketingPlan, side_effects: ["coverage_cap_bushels recomputed", "increments MarketingPlan.version by 1"] }
  - { method: POST, path: "/advisory/marketing-plans/{planId}/activate", description: "DRAFT -> ACTIVE (requires CERTIFIED baseline + current acknowledged disclosure)", roles: [CommodityAdvisor], code: 200, input: [], output: MarketingPlan, side_effects: ["expected_bushels_snapshot frozen", "coverage_cap_bushels computed"] }
  - { method: POST, path: "/advisory/marketing-plans/{planId}/suspend", description: "ACTIVE -> SUSPENDED", roles: [CommodityAdvisor, ComplianceOfficer], code: 200, input: [], output: MarketingPlan, side_effects: ["Target triggers skipped while SUSPENDED"] }
