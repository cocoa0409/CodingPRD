                category: "CARBOHYDRATE"
                pathogen_risk_class: "LOW_RISK"
                storage_condition: "AMBIENT"
              as: QA_MANAGER
              captures: { inginv_id: $.data.id }
            - call: "POST /api/v1/formulas"
              payload:
                formula_code: "IF-INV-1"
                product_name: "Invariant Test Formula"
                nutrient_profile_id: "${npinv_id}"
                ingredients:
                  - ingredient_id: "${inginv_id}"
                    percentage_by_weight: 100.000
                    is_critical: true
