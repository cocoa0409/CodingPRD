scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Invoice vs Appointment)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_settlement
        grounds:
          - calculations.invoice_settlement
          - entities.Invoice.fields.provisional_total_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Same share, identical underlying data: PROVISIONAL quotes from the
          estimated weight (live_weight 1200 * DRESS_PCT 0.62 * fraction 0.5 =
          372.0 lb) while FINAL bills the actual hanging weight (700 * 0.5 =
          350.0 lb) — 32120 vs 30250 cents. This instance lives in the Invoice
          (billing) domain, unlike the deposit_quote instance on Appointment.
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z; customers c1, c2 exist (ACTIVE)"
            - "CapacityDay 2026-08-20 capacity 2 exists"
            - "c1 has a CONFIRMED BEEF head_count 1 appointment (deposit 15000 paid); its animal is HANGING at 700.0 lb (live 1200.0)"
            - "Shares s1 (c1, 0.5) and s2 (c2, 0.5) are finalized, creating one invoice per share"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/customers", payload: { name: "Bob Venn", phone: "555-0102", email: "bob@x.com" }, as: PlantOperator, captures: { c2: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 15000 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-A1", live_weight_lbs: 1200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 700.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 0.5, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c2}", share_fraction: 0.5, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s2: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
          trigger:
            - { call: "GET /locker/invoices", payload: { share_id: "${s1}" }, as: PlantOperator, captures: { inv1_prov: "$.data[0].provisional_total_cents", inv1_total: "$.data[0].total_cents", inv1_proc: "$.data[0].processing_fee_cents", inv1_sl: "$.data[0].slaughter_share_cents", inv1_dc: "$.data[0].deposit_credit_cents" } }
          assert:
            - "Invoice.provisional_total_cents == 32120  (tiered(372.0)=33620 + 6000 slaughter - 7500 deposit credit, storage 0)"
            - "Invoice.total_cents == 30250  (tiered(350.0)=31750 + 6000 - 7500)"
            - "Invoice.processing_fee_cents == 31750"
            - "Invoice.slaughter_share_cents == 6000"
            - "Invoice.deposit_credit_cents == 7500"
            - "provisional_total_cents != total_cents"

      - name: deposit_flat_vs_elevated_quote
        grounds:
          - calculations.deposit_quote
          - calculations.customer_strike_policy
          - entities.Appointment.fields.deposit_amount_cents
        distinguishing_aspect: |
          Identical booking inputs (BEEF, head_count 1): an ACTIVE customer is
          quoted the STANDARD flat 15000 cents, while a customer carrying one
          no-show strike (ELEVATED_DEPOSIT) is quoted 50% of the estimated
          processing+slaughter value = 38620 cents. This instance lives in the
          Appointment (deposit) domain, unlike the Invoice settlement instance.
        test_recipe:
          setup:
            - "Clock at default 2026-08-01; c1 is ACTIVE; c2 has one no-show strike (status ELEVATED_DEPOSIT) from a confirmed appointment whose date passed with no drop-off"
            - "CapacityDay 2026-08-20 (for c1) and 2026-08-21 (for c2) exist; CapacityDay 2026-08-15 was used for c2's strike"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/customers", payload: { name: "Bob Venn", phone: "555-0102", email: "bob@x.com" }, as: PlantOperator, captures: { c2: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-15", capacity_head: 1 }, as: PlantManager, captures: { cd0: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c2}", capacity_day_id: "${cd0}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c2}", captures: { appt0: $.data.id } }
            - { call: "POST /locker/appointments/${appt0}/pay-deposit", payload: { amount_cents: 15000 }, as: Customer, as_user_id: "${c2}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/appointments/${appt0}/no-show", payload: {}, as: PlantOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-21", capacity_head: 1 }, as: PlantManager, captures: { cd2: $.data.id } }
          trigger:
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { dep_standard: $.data.deposit_amount_cents } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c2}", capacity_day_id: "${cd2}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c2}", captures: { dep_elevated: $.data.deposit_amount_cents } }
            - { call: "GET /locker/customers/${c2}", payload: {}, as: PlantOperator, captures: { c2_st: $.data.status } }
          assert:
            - "c1 appointment deposit_amount_cents == 15000  (STANDARD flat per-head)"
            - "c2 appointment deposit_amount_cents == 38620  (ELEVATED: round_half_up(0.5 * (tiered(1200*0.62=744 lb) = 65240 + 12000 slaughter)))"
            - "dep_standard != dep_elevated"
            - "Customer.${c2}.status == ELEVATED_DEPOSIT"

  # ===================================================================
  # Rule 2 — combinatorial_formula (mode a: multi-input non-linear; mode b: rounding order)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_tiered_processing_with_storage_and_credit
        grounds:
          - calculations.invoice_settlement
          - calculations.storage_fee
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — tiered processing
          (min/branch at 200 lb), flat slaughter fee, max(0, days-7) storage
          accrual, and deposit credit combine into total_cents. HOG 500 lb
          single share with 4 billable storage days: 39500 + 6000 + 2000 - 7500
          = 40000.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; c1 ACTIVE; CapacityDay 2026-08-20 capacity 1"
            - "c1 has a CONFIRMED HOG head_count 1 appointment (deposit 7500 paid); animal HANGING at 500.0 lb (live 600.0); one share 1.0 finalized; cut sheet submitted"
            - "Animal weighed at 2026-08-01; clock advanced to 2026-08-04 (hang met), fabrication completed -> StorageRecord ready_at 2026-08-04"
            - "Clock advanced to 2026-08-15: days_stored 11 -> 4 billable days -> storage 2000"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 600.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 500.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/shares/${s1}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c1}", captures: { cs1: $.data.id } }
            - { call: "POST /locker/cut-sheets/${cs1}/submit", payload: {}, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/animals/${an1}/start-fabrication", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/complete-fabrication", payload: {}, as: PlantOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "GET /locker/invoices", payload: { share_id: "${s1}" }, as: PlantOperator, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /locker/invoices/${inv1}/payments", payload: { amount_cents: 40000 }, as: Customer, as_user_id: "${c1}", captures: { paid_status: $.data.status } }
            - { call: "GET /locker/invoices/${inv1}", payload: {}, as: PlantOperator }
          assert:
            - "Invoice.processing_fee_cents == 39500  (200*85 + 300*75)"
            - "Invoice.slaughter_share_cents == 6000"
            - "Invoice.storage_cents == 2000  (4 billable days * 500, recomputed as-of payment)"
            - "Invoice.deposit_credit_cents == 7500"
            - "Invoice.total_cents == 40000"
            - "Invoice.provisional_total_cents == 34250  (est 450.0 lb -> 35750 + 6000 - 7500)"
            - "Invoice.status == PAID after the 40000 payment"

      - name: deposit_credit_per_share_rounding_then_residual
        grounds:
          - calculations.deposit_credit_allocation
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each share's credit
          FIRST (round_half_up), then reconcile the residual on the
          largest-fraction share. Deposit 7500 over fractions 0.333/0.333/0.334
          yields 2498/2498/2504, not the 2500/2500/2500 a sum-then-round order
          would give.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; customers c1, c2, c3 exist; CapacityDay 2026-08-20 capacity 1"
            - "c1 has a CONFIRMED HOG head_count 1 appointment (deposit 7500 paid); animal HANGING at 200.0 lb (live 280.0)"
            - "Shares 0.333 (c1), 0.333 (c2), 0.334 (c3) created in that order and finalized"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/customers", payload: { name: "Bob Venn", phone: "555-0102", email: "bob@x.com" }, as: PlantOperator, captures: { c2: $.data.id } }
            - { call: "POST /locker/customers", payload: { name: "Cid Wynn", phone: "555-0103", email: "cid@x.com" }, as: PlantOperator, captures: { c3: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 0.333, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c2}", share_fraction: 0.333, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s2: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c3}", share_fraction: 0.334, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s3: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
          trigger:
            - { call: "GET /locker/invoices", payload: { share_id: "${s1}" }, as: PlantOperator, captures: { dc1: "$.data[0].deposit_credit_cents" } }
            - { call: "GET /locker/invoices", payload: { share_id: "${s2}" }, as: PlantOperator, captures: { dc2: "$.data[0].deposit_credit_cents" } }
            - { call: "GET /locker/invoices", payload: { share_id: "${s3}" }, as: PlantOperator, captures: { dc3: "$.data[0].deposit_credit_cents" } }
          assert:
            - "Invoice(s1).deposit_credit_cents == 2498  (round_half_up(7500*0.333)=2498)"
            - "Invoice(s2).deposit_credit_cents == 2498"
            - "Invoice(s3).deposit_credit_cents == 2504  (round_half_up(7500*0.334)=2501, + 3 residual as largest-fraction share)"
            - "sum of the three credits == 7500 == deposit_paid_cents"

  # ===================================================================
  # Rule 3 — non_linear_state_machine (CutSheet cycle; Appointment self-loop)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cut_sheet_submit_revise_resubmit_cycle
        grounds:
          - state_machines.CutSheet.DRAFT_to_SUBMITTED
          - state_machines.CutSheet.SUBMITTED_to_DRAFT
          - concurrency_rules[cut-sheet-revise-stale-version]
        distinguishing_aspect: |
          CutSheet supports a revision cycle DRAFT -> SUBMITTED -> DRAFT ->
          SUBMITTED (not a linear pipeline). The cycle belongs to CutSheet; the
          paired instance's self-loop belongs to Appointment.
        test_recipe:
          setup:
            - "Clock default; c1 ACTIVE; CapacityDay 2026-08-20 capacity 1; confirmed HOG appointment; animal HANGING at 200.0 lb; one share 1.0 finalized; cut sheet created (DRAFT, version 1)"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/shares/${s1}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c1}", captures: { cs1: $.data.id } }
          trigger:
            - { call: "POST /locker/cut-sheets/${cs1}/submit", payload: {}, as: Customer, as_user_id: "${c1}", captures: { cs_v2: $.data.version } }
            - { call: "POST /locker/cut-sheets/${cs1}/revise", payload: { expected_cut_sheet_version: "${cs_v2}", grind_pct: 25 }, as: Customer, as_user_id: "${c1}", captures: { cs_v3: $.data.version, cs_st3: $.data.status } }
            - { call: "POST /locker/cut-sheets/${cs1}/submit", payload: {}, as: Customer, as_user_id: "${c1}", captures: { cs_v4: $.data.version, cs_st4: $.data.status } }
          assert:
            - "after first submit: CutSheet.version == 2 (cs_v2)"
            - "after revise: CutSheet.status == DRAFT and version == 3 and grind_pct == 25"
            - "after resubmit: CutSheet.status == SUBMITTED and version == 4"
            - "the DRAFT->SUBMITTED->DRAFT->SUBMITTED cycle completed without error"

      - name: appointment_reschedule_self_loop_with_capacity_rebalance
        grounds:
          - state_machines.Appointment.CONFIRMED_to_CONFIRMED
          - concurrency_rules[appointment-reschedule-stale-version]
          - entities.CapacityDay.fields.booked_head
        distinguishing_aspect: |
          Appointment has a CONFIRMED -> CONFIRMED self-loop (reschedule): the
          status is unchanged while capacity moves between days. A self-loop
          cycle on Appointment, a different entity than the CutSheet cycle.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; c1 ACTIVE; CapacityDays D1 2026-08-20 cap 2 and D2 2026-08-21 cap 2"
            - "c1 has a CONFIRMED BEEF head_count 2 appointment on D1 (deposit 30000 paid); D1 booked_head 2 (FULL), D2 booked_head 0"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-21", capacity_head: 2 }, as: PlantManager, captures: { cd2: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 2 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 30000 }, as: Customer, as_user_id: "${c1}", captures: { a_v: $.data.version } }
          trigger:
            - { call: "POST /locker/appointments/${appt}/reschedule", payload: { new_capacity_day_id: "${cd2}", expected_appointment_version: "${a_v}" }, as: Customer, as_user_id: "${c1}", captures: { a_st: $.data.status, a_date: $.data.appointment_date, a_v2: $.data.version } }
            - { call: "GET /locker/capacity-days", payload: { date_from: "2026-08-20", date_to: "2026-08-20" }, as: PlantOperator, captures: { d1_booked: "$.data[0].booked_head", d1_st: "$.data[0].status" } }
            - { call: "GET /locker/capacity-days", payload: { date_from: "2026-08-21", date_to: "2026-08-21" }, as: PlantOperator, captures: { d2_booked: "$.data[0].booked_head", d2_st: "$.data[0].status" } }
          assert:
            - "Appointment.status == CONFIRMED after reschedule (self-loop, unchanged)"
            - "Appointment.appointment_date == '2026-08-21'"
            - "Appointment.version advanced by exactly 1 from ${a_v}"
            - "D1.booked_head == 0 and D1.status == OPEN"
            - "D2.booked_head == 2 and D2.status == FULL"

  # ===================================================================
  # Rule 4 — transitive_cascade (abandonment depth 3; no-show depth 2)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: abandonment_cascade_storage_to_customer_block
        grounds:
          - state_machines.StorageRecord.STORED_to_ABANDONED
          - state_machines.CarcassShare.READY_to_FORFEITED
          - state_machines.Invoice.OPEN_to_COLLECTIONS
          - calculations.customer_strike_policy
        distinguishing_aspect: |
          Depth-3 chain from the run-daily sweep trigger: StorageRecord ->
          ABANDONED causes CarcassShare -> FORFEITED (link 1), which causes
          Invoice -> COLLECTIONS with a 5000-cent surcharge (link 2), which
          charges Customer.no_show_strikes += 1 and flips the customer to
          BLOCKED at 2 strikes (link 3). Origin trigger differs from the
          no-show cascade instance.
        test_recipe:
          setup:
            - "c1 already carries 1 no-show strike (ELEVATED_DEPOSIT) from a prior confirmed appointment on 2026-08-15"
            - "Clock reset to 2026-08-01; c1 books again (elevated deposit 11875 for HOG 1 head), pays, and the animal completes fabrication on 2026-08-04 -> one StorageRecord STORED, invoice OPEN unpaid"
            - "Clock advanced to 2026-08-26 (days_stored 22 > ABANDON_AFTER_DAYS 21)"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-15", capacity_head: 1 }, as: PlantManager, captures: { cd0: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd0}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt0: $.data.id } }
