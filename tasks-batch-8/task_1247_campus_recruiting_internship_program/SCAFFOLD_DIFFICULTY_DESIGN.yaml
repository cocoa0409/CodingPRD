  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — half-open adjacency on school events vs
  # 15-minute buffered gap on evaluator schedules (DIFFERENT interval
  # semantics, DIFFERENT resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: event_half_open_adjacency_allowed
        grounds:
          - validations[priority=36]
          - errors[ERR_EVENT_TIME_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on resource SchoolTarget: an event
          starting exactly when another ends (12:00 vs 12:00) is ALLOWED,
          while a one-second earlier start (11:59:59) intersects and is
          rejected.
        test_recipe:
          setup:
            - "Season OPEN; school StateU ACTIVE with no events yet"
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 10, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "TARGET", application_cap: 10, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
              captures: { st_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
          trigger:
            - call: "POST /campus-recruiting/seasons/${sid}/campus-events"
              payload: { school_target_id: "${st_id}", event_type: "INFO_SESSION", start_at: "2026-05-12T10:00:00Z", end_at: "2026-05-12T12:00:00Z" }
              as: Recruiter
              captures: { ev1: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/campus-events"
              payload: { school_target_id: "${st_id}", event_type: "CAREER_FAIR", start_at: "2026-05-12T12:00:00Z", end_at: "2026-05-12T14:00:00Z" }
              as: Recruiter
              captures: { ev2: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/campus-events"
              payload: { school_target_id: "${st_id}", event_type: "RESUME_DROP", start_at: "2026-05-12T11:59:59Z", end_at: "2026-05-12T13:00:00Z" }
              as: Recruiter
              captures: { err: $.data.error_id }
          assert:
            - "CampusEvent.${ev1} created SCHEDULED (10:00-12:00)"
            - "CampusEvent.${ev2} created SCHEDULED (12:00-14:00; touching at 12:00 allowed under half-open semantics)"
            - "${err} == ERR_EVENT_TIME_OVERLAP (11:59:59 start intersects the 10:00-12:00 event by one second)"
      - name: evaluator_buffered_gap_fifteen_minutes
        grounds:
          - validations[priority=38]
          - errors[ERR_EVALUATOR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Buffered interval semantics on resource Employee (different resource
          and different semantics than the school-event half-open rule):
          back-to-back slots (gap 0) are REJECTED, and a gap of exactly the
          15-minute buffer is ALLOWED (gap >= 15 passes).
        test_recipe:
          setup:
            - "Season at SELECTION; applications A and B both SHORTLISTED; evaluator Eve; interview day 2026-06-08 09:00-17:00 capacity 5"
          setup_api_calls:
