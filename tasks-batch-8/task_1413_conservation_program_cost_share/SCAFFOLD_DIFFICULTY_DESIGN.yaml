            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin, captures: { pool: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "COVER_CROP", unit: "ACRE", standard_rate_cents: 15000, hu_rate_cents: 18000, lifespan_years: 5 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A One", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "FENCE", quantity: 1000 }, { practice_code: "COVER_CROP", quantity: 10 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { it_f: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "COVER_CROP", planned_quantity: 10, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { it_c: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts/${con}/modifications", payload: { kind: "DROP_PRACTICE", practice_item_id: "${it_c}" }, as: Applicant, as_user_id: "${a1}", captures: { mod: $.data.id } }
            - { call: "GET /eqip/contracts/${con}", payload: {}, as: ProgramAdmin, captures: { v_modp: $.data.version } }
          trigger:
            - { call: "POST /eqip/modifications/${mod}/approve", payload: { expected_contract_version: "${v_modp}" }, as: ProgramAdmin, captures: { mod_st: $.data.status } }
            - { call: "GET /eqip/practice-items/${it_c}", payload: {}, as: ProgramAdmin, captures: { itc_st: $.data.certification_status } }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { oblig2: $.data.obligated_cents, avail2: $.data.available_cents } }
            - { call: "GET /eqip/contracts/${con}", payload: {}, as: ProgramAdmin, captures: { con_st: $.data.status, con_amt: $.data.obligated_amount_cents } }
          assert:
            - "mod_st == APPROVED; con_st == OBLIGATED"
            - "hop 1: itc_st == CANCELLED"
            - "hop 2 (caused by hop 1): oblig2 == 300000 (450000 - 150000 released), avail2 == 700000 (550000 + 150000)"
            - "con_amt == 300000 (obligated_amount recomputed over non-terminal items)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_second_obligate
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_CONTRACT_NOT_DRAFT]
          - errors[ERR_POOL_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Category pair = state vs business_fiscal. The second obligate violates
          BOTH (contract no longer DRAFT; remaining pool 10000 < 300000). The
          state error (priority 5) must win over the fiscal error (priority 11).
        test_recipe:
          setup:
            - "Pool GENERAL 400000; two SELECTED applications (A: FENCE 1000 -> 300000; B: FENCE 300 -> 90000); both contracts OBLIGATED, leaving pool available 10000"
          setup_api_calls:
