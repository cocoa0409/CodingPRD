      - name: room_buffer_gap_conflict
        grounds:
          - validations[priority=9]
          - entities.Session.fields.room_id
          - errors[ERR_ROOM_BUFFER_CONFLICT]
        distinguishing_aspect: |
          TherapyRoom resource, closed-with-15-min-buffer semantics (different arithmetic from the
          clinician rule): a same-room booking only 10 minutes after the prior end is rejected even
          though a different clinician is used, so the clinician rule cannot fire.
        test_recipe:
          setup:
            - "ACTIVE plan; APPROVED auth (5 visits); clinician C1 has a 10:00-11:00 session in room R; a second clinician C2 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
