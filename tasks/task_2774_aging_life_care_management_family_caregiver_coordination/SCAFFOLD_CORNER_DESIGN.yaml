          - state_machines.TimeEntry.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Even a care manager who is a supervisor cannot review her own work: acting as PracticeSupervisor on the assessment she authored, or on her own time entry, returns ERR_SEGREGATION_OF_DUTIES, while a second supervisor's identical call succeeds."
        test_recipe:
          setup:
            - "Two supervisors: Iris (is_supervisor true, hourly_rate_cents 30000) and Kai (is_supervisor true); Client Yannick."
