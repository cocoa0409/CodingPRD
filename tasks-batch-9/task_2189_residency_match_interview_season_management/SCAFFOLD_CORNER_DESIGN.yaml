      - name: screen_composite_provisional_and_final_diverge_by_the_bonus_sum
        claim_type: variant_divergence
        grounds:
          - calculations.screen_composite_score
        excluded_because:
          difficulty_instance: screen_score_provisional_versus_final_on_application
          rationale: >
            The provisional/final divergence, the tiered band bonus, the pipeline bonus and the SCORE_CEILING
            cap are the entire subject of the §1.8 dual-variant instance, which asserts both variants over the
            same review data.

      - name: interviewer_scheduled_and_realized_load_never_count_the_same_slot
        claim_type: variant_selection
        grounds:
          - calculations.interviewer_load_index
        excluded_because:
          difficulty_instance: interviewer_load_scheduled_versus_realized_on_faculty_member
          rationale: >
            The disjoint input sets ({OPEN, BOOKED} versus {COMPLETED}), the LEAD/MEMBER weights and the
            attendance discount are covered by the §1.8 dual-variant instance.

      - name: committee_rubric_rounds_each_card_before_averaging_the_cards
        claim_type: precision
        grounds:
          - calculations.committee_rubric_score
        excluded_because:
          difficulty_instance: committee_rubric_per_card_rounding_before_averaging
          rationale: >
            The pinned rounding order - 1 decimal per card first, then 2 decimals over the rounded card
            averages - is exactly what the §1.8 combinatorial instance pins down, including the value the
            wrong order would produce.

      - name: soap_budget_reserve_tier_is_keyed_on_the_raw_vacancy_count
        claim_type: constants_applied
        grounds:
          - calculations.soap_offer_budget
        excluded_because:
          difficulty_instance: soap_offer_budget_tier_keyed_on_base_unfilled_not_on_budget
          rationale: >
            The tier boundaries and the base-versus-budget keying trap are the §1.8 combinatorial instance's
            subject; the corner reached here instead is the enforcement of the resulting ceiling, which lives
            in the errors section as soap_offer_beyond_the_live_budget_is_rejected.

      - name: committee_quorum_threshold_is_the_inclusive_ceiling_of_sixty_percent
        claim_type: threshold
        grounds:
          - calculations.committee_quorum_resolution
        excluded_because:
          difficulty_instance: quorum_ceiling_threshold_is_inclusive_at_exactly_three_of_four
          rationale: >
            threshold-1, threshold and threshold+1 on the ceil(0.6 * eligible) quorum are walked by the §1.8
            boundary instance.

      - name: pipeline_report_over_an_empty_cohort_returns_zeroes_without_dividing
        claim_type: correct_result
        grounds:
          - calculations.pipeline_diversity_report
          - endpoints.GET /programs/{id}/pipeline-report
        excluded_because:
          difficulty_instance: pipeline_report_zero_cohort_skips_division_and_one_decimal_half_up
          rationale: >
            The empty-cohort guard, the 1-decimal round_half_up percentages and the WITHDRAWN exclusion are
            all asserted by the §1.8 boundary instance.


  # ===========================================================================
  # Validations - Table 4 rows against the 28 rules of §1.6. The five kept here
  # are violation, satisfaction and conditional-configuration corners that no
