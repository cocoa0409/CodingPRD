            - call: "POST /devices/${dev_id}/provisioning-sessions/${s3}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /devices/${dev_id}/provisioning-sessions/${s3}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { s3v: $.data.version }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${s3}/tokenize"
              payload: { expected_session_version: "${s3v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { tok_no: $.data.id }
            - call: "POST /transit-operators"
              payload: { operator_code: "BART", name: "Bay Transit", flat_fare_cents: 250, express_cap_cents: 1000 }
              as: PlatformAdmin
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /payment-tokens/${tok_ex}/authorizations"
              payload: { cryptogram: "cgm-t1", amount_cents: 250, currency: "USD", merchant_id: "BART", merchant_category: "TRANSIT", express_mode: true, transit_operator_id: "${op_id}" }
              as: IssuerOperator
              captures: { ok_st: $.data.status }
            - call: "POST /payment-tokens/${tok_no}/authorizations"
              payload: { cryptogram: "cgm-t2", amount_cents: 250, currency: "USD", merchant_id: "BART", merchant_category: "TRANSIT", express_mode: true, transit_operator_id: "${op_id}" }
              as: IssuerOperator
              captures: { e: $.data.error_id }
          assert:
            - "ok_st == APPROVED — the flagged token rides express"
            - "e == ERR_EXPRESS_TRANSIT_NOT_SUPPORTED (422) — the unflagged token is rejected at priority 16"

      - name: active_token_count_reconciles_across_provision_and_deactivate
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Device.fields.active_token_count
        distinguishing_aspect: "Derived counter stays consistent through the full lifecycle: 0 at device create, 1 after tokenize, 2 after a second tokenize, 1 after deactivating one token, 0 after deactivating the other."
        test_recipe:
          setup: ["HEALTHY device; issuer ACTIVE; account + two artifacts."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
            - call: "POST /card-artifacts"
              payload: { card_account_id: "${acct_id}", pan_last4: "6666", expiry: "0931", embossing_name: "ADA BYERS" }
              as: IssuerOperator
              captures: { art4_id: $.data.id }
            - call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${art4_id}", idempotency_key: "prov-d" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { s4: $.data.id }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${s4}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /devices/${dev_id}/provisioning-sessions/${s4}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { s4v: $.data.version }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${s4}/tokenize"
              payload: { expected_session_version: "${s4v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { tok2_id: $.data.id }
          trigger:
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Any
              captures: { n2: $.data.active_token_count }
            - call: "POST /devices/${dev_id}/tokens/${tok2_id}/deactivate"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Any
              captures: { n1: $.data.active_token_count }
            - call: "POST /devices/${dev_id}/tokens/${tok_id}/deactivate"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Any
              captures: { n0: $.data.active_token_count }
          assert:
            - "n2 == 2, n1 == 1, n0 == 0 — the counter reconciles on each source mutation"

      - name: transit_allowlist_blocks_unlisted_card_but_admits_after_enrollment
        claim_type: rate_threshold_triggers
        grounds:
          - validations.priority_17
          - errors.ERR_TRANSIT_NOT_ALLOWED
        distinguishing_aspect: "Allowlist membership flips the gate: an express tap at an allowlist-active operator from a non-member card is 422 ERR_TRANSIT_NOT_ALLOWED; after POST /transit-allowlist the identical tap approves."
        test_recipe:
          setup: ["TRANSIT card with express-enabled token; operator allowlist_active true, express_cap 1000."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/tokenize"
              payload: { express_transit_enabled: true, expected_session_version: "${sess_v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { tok_ex: $.data.id }
            - call: "POST /transit-operators"
              payload: { operator_code: "MTA", name: "Metro", flat_fare_cents: 300, express_cap_cents: 1000, allowlist_active: true }
              as: PlatformAdmin
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /payment-tokens/${tok_ex}/authorizations"
              payload: { cryptogram: "cgm-a1", amount_cents: 300, currency: "USD", merchant_id: "MTA", merchant_category: "TRANSIT", express_mode: true, transit_operator_id: "${op_id}" }
              as: IssuerOperator
              captures: { e: $.data.error_id }
            - call: "POST /transit-allowlist"
              payload: { transit_operator_id: "${op_id}", card_account_id: "${acct_id}" }
              as: IssuerOperator
            - call: "POST /payment-tokens/${tok_ex}/authorizations"
              payload: { cryptogram: "cgm-a2", amount_cents: 300, currency: "USD", merchant_id: "MTA", merchant_category: "TRANSIT", express_mode: true, transit_operator_id: "${op_id}" }
              as: IssuerOperator
              captures: { ok_st: $.data.status }
          assert:
            - "e == ERR_TRANSIT_NOT_ALLOWED (422) before enrollment"
            - "ok_st == APPROVED after enrollment"

  # ===========================================================================
  - section: consistency model
    instances:
      - name: issuer_suspend_cascade_visible_in_same_request_response_chain
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Issuer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Immediate consistency: right after POST /issuers/{id}/suspend returns, a plain GET on the token shows SUSPENDED — no delay, no recompute endpoint needed."
        test_recipe:
          setup: ["Issuer ACTIVE; standard ACTIVE token."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
          trigger:
            - call: "POST /issuers/${iss_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "GET /payment-tokens/${tok_id}"
              payload: {}
              as: Any
              captures: { st: $.data.status }
          assert:
            - "st == SUSPENDED in the immediately-following read"
