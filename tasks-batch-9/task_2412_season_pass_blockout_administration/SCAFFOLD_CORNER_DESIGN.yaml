              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_901: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ben Holder", email: "ben@example.com", date_of_birth: "1988-06-11" }
              as: PassOfficeClerk
              captures: { holder_b: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
          trigger:
            - call: "GET /season-passes/${pass_a}"
              as: Passholder
              as_user_id: "${holder_b}"
              captures: { e1: "$.data.error_id" }
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_901}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: Passholder
              as_user_id: "${holder_b}"
              captures: { e2: "$.data.error_id" }
            - call: "GET /season-passes/${pass_a}"
              as: Passholder
              as_user_id: "${holder_a}"
          assert:
            - "first trigger: HTTP 403 with data.error_id == 'ERR_NOT_PASS_OWNER'"
            - "second trigger: HTTP 403 with data.error_id == 'ERR_NOT_PASS_OWNER' and GET /park-days/${day_901} → data.reserved_count == 0"
            - "third trigger: HTTP 200 with data.id == '${pass_a}' (the owner is admitted)"
            - "GET /season-passes/${pass_a} as PassOfficeClerk returns 200 (the ownership rule is scoped to the Passholder role)"

      - name: tier_not_published_code_covers_both_the_transition_and_the_reference_rule
        claim_type: error_triggerable
        grounds:
          - validations[priority=43]
          - validations[priority=44]
          - errors[ERR_TIER_NOT_PUBLISHED]
          - endpoints[POST /pass-tiers/{tier_id}/status]
