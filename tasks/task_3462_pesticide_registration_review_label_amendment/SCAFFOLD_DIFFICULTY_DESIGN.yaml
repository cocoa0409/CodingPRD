          trigger:
            - call: "POST /pesticide-registry/study-submissions"
              payload: { data_call_in_id: "${dci}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.3100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s1: $.data.id }
            - call: "POST /pesticide-registry/data-call-ins/${dci}/respond"
              payload: { study_submission_ids: ["${s1}"] }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/study-submissions/${s1}/review-decisions"
              payload: { decision: "REJECT", decision_notes: "dosing regime inadequate" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions"
              payload: { data_call_in_id: "${dci}", study_type: "RESIDUE_CHEMISTRY", guideline_reference: "OCSPP 860.1500", commodity_code: "CORN", field_trial_residue_ppm: 0.01 }
              as: RegistrantRepresentative
