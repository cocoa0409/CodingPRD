      - name: draft_plans_can_be_neither_advanced_nor_rescinded
        claim_type: triggerable
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_DEPRECATION_PLAN_STATE]
          - state_machines.DeprecationPlan
        distinguishing_aspect: |
          DRAFT is the plan's initial state and neither `advance` nor `rescind` is declared out of
          it, so both must answer ERR_INVALID_DEPRECATION_PLAN_STATE at 409 - and specifically
          not ERR_DEPRECATION_ADVANCE_NOT_DUE, even though the clock has also not reached
          sunset_at, because the state check at priority 7 outranks the temporal check at
          priority 28. The plan and the component must be left untouched.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` owns EXPERIMENTAL Component `badge` with one DRAFT DeprecationPlan (announced 2026-08-01, sunset 2026-08-20, removal 2026-09-25)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-09-25T00:00:00.000Z" }
              as: DesignSystemLead
              captures: { plan_id: $.data.id, plan_state: $.data.state, plan_v0: $.data.version, guide_state: $.data.migration_guide_state }
          trigger:
            - call: "POST /design-system/deprecation-plans/${plan_id}/advance"
              payload: {}
              as: DesignSystemLead
              captures: { e_advance: $.data.error_id }
            - call: "POST /design-system/deprecation-plans/${plan_id}/rescind"
              payload: { reason: "changed our minds before announcing" }
              as: DesignSystemLead
              captures: { e_rescind: $.data.error_id }
            - call: "GET /design-system/components/${comp_id}/deprecation-plans"
              payload: { state: "DRAFT", limit: 100, offset: 0 }
              as: DesignSystemLead
              captures: { state_after: $.data.0.state, v_after: $.data.0.version, rescinded_after: $.data.0.rescinded_at }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { lifecycle: $.data.lifecycle_state }
          assert:
            - "${plan_state} == DRAFT and ${plan_v0} == 1 and ${guide_state} == MISSING"
            - "${e_advance} == ERR_INVALID_DEPRECATION_PLAN_STATE with HTTP status 409"
            - "${e_rescind} == ERR_INVALID_DEPRECATION_PLAN_STATE with HTTP status 409"
            - "${state_after} == DRAFT and ${v_after} == 1 and ${rescinded_after} == null"
            - "${lifecycle} == ACTIVE"

      - name: a_stale_major_pin_blocks_the_first_ship_until_it_is_repinned
        claim_type: triggerable
        grounds:
          - validations[priority=16]
          - errors[ERR_BLOCKED_DEPENDENCY]
          - entities.Component.fields.blocked_dependency_count
          - endpoints["PUT /design-system/component-dependencies/{id}"]
        distinguishing_aspect: |
          ERR_BLOCKED_DEPENDENCY is reachable without any cascade at all: an edge created with
          pinned_provider_major 2 against a provider on major 1 is born INCOMPATIBLE, so the
          consumer's very first ship is refused with 409 even though its newest AUTOMATED AA
          audit is clean. Re-pinning to 1 clears blocked_dependency_count and the identical ship
          request then succeeds, which proves the gate reads live derived state rather than a
          sticky flag.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` owns Component `badge` (consumer, one PLANNED WEB implementation with a clean AUTOMATED AA audit) and Component `icon` (provider, major 1)"
            - "a ComponentDependency badge -> icon pinned at major 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
