          assert:
            - "captured b1 == WARRANTY   (REPAIR at odometer 100000 == limit: boundary equality stays in warranty)"
            - "captured b2 == OPERATOR   (REPAIR at odometer 120000 > limit)"
            - "captured b3 == OPERATOR   (PREVENTIVE is always operator-billed)"
            - "captured b4 == CARRIER    (RECALL is always carrier-billed)"
