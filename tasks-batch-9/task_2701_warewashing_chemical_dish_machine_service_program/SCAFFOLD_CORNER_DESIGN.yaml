          - errors[ERR_SANITIZER_LOCKOUT_ACTIVE]
        distinguishing_aspect: |
          The lockout gate is keyed on lockout_reason, not on dispenser_status: a dispenser locked with
          AGREEMENT_ENDED by the termination cascade refuses new records with
          ERR_SANITIZER_LOCKOUT_ACTIVE (409), whereas the identically LOCKED_OUT dispenser of
          dispenser_efficacy_lockout_and_recovery_close_the_active_locked_active_loop accepts the record
          that clears it. The in-flight visit that was IN_PROGRESS before the termination is left intact -
          only the record endpoint is blocked.
