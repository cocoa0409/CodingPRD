          trigger:
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_a}", customer_id: "${cust_id}", actual_units: 1000 }
              as: SopAdmin
              captures: { rec_a: $.data.id }
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_b}", customer_id: "${cust_id}", actual_units: 1000 }
              as: SopAdmin
              captures: { rec_b: $.data.id }
          assert:
            - "AccuracyRecord.${rec_a}: forecast_units_snapshot == 950, signed_error_units == -50, abs_error_units == 50, ape_pct == 5.00, accountable_planner_user_id == \"planner-a\""
            - "AccuracyRecord.${rec_b}: forecast_units_snapshot == 951, signed_error_units == -49, abs_error_units == 49, ape_pct == 4.90, accountable_planner_user_id == \"planner-b\""
            - "ProductFamily.${fam_a}: rolling_wmape_pct == 5.00, rolling_bias_pct == -5.00, bias_flag == \"UNDER_FORECAST\" (the <= -5.0 edge is inclusive), accuracy_grade == \"A\", scored_record_count == 1"
            - "ProductFamily.${fam_b}: rolling_wmape_pct == 4.90, rolling_bias_pct == -4.90, bias_flag == \"NONE\", accuracy_grade == \"A\", scored_record_count == 1"
            - "A one-unit difference in the forecast is the only thing separating UNDER_FORECAST from NONE; both families still grade \"A\" because the grade reads WMAPE, not bias"
            - "Neither family reports \"OVER_FORECAST\" — the sign convention is forecast minus actual, so under-forecasting yields a NEGATIVE bias"

      - name: accuracy_summary_scope_is_cycle_while_family_rollup_spans_all_cycles
        claim_type: Input Set Filtering
        grounds:
