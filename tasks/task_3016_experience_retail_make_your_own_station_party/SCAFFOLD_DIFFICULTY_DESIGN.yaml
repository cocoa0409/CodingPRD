              as: Customer
              as_user_id: "${cust1}"
              captures: { g3: $.data.id }
            - call: "POST /party-guests"
              payload: { party_reservation_id: "${party1}", guest_name: "G4" }
              as: Customer
              as_user_id: "${cust1}"
              captures: { g4: $.data.id }
            - call: "POST /party-guests"
