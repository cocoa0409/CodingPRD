        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
          trigger:
            - call: "GET /licensing/titles"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: wrong_role_cannot_create_title
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "MaterialsClerk calling POST /licensing/titles -> 403 ERR_UNAUTHORIZED"
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/titles"
              payload: { name: "X", author: "Y", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: MaterialsClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: applicant_cannot_act_on_other_orgs_application
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_OWNER_MISMATCH]"]
        distinguishing_aspect: "Applicant X-User-ID must match application.organization_id"
        test_recipe:
          setup: ["Org1 owns application; Org2 attempts to submit it"]
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
