            - "Unfiltered list: HTTP 200 with response_type == array, total_count == 2, limit == 10, offset == 0 and has_more == false (the declared defaults apply when limit and offset are omitted)"
            - "?status=SCHEDULED returns exactly 1 row with ${sched_id} == ${job_b} and ${sched_status} == SCHEDULED; total_count == 1"
            - "?duct_system_id=${ds1_id} returns exactly 1 row with ${ds1_job} == ${job_a}"
            - "?technician_id=${tech1_id}&status=INJECTING returns exactly 1 row with ${inj_job} == ${job_a}: the two filters intersect rather than union (technician_id alone would return 2)"
            - "?limit=1&offset=0 returns 1 row with total_count == 2 and has_more == true; ?limit=1&offset=1 returns 1 row with total_count == 2 and has_more == false"
            - "${page1_id} != ${page2_id} and together they cover {${job_a}, ${job_b}} exactly once"
            - "?limit=0 returns HTTP 400 with ${err_limit} == ERR_INVALID_REQUEST (limit must be within 1..100)"
            - "Technician.${tech1_id}.open_seal_job_count == 2 and both duct systems carry their own active_seal_job_id"

