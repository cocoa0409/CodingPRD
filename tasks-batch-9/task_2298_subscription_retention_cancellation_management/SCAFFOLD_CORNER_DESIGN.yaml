            - "Subscriber.${sub_a_id}.save_offer_grants_365d_count == 0"

      - name: sending_an_already_sent_disclosure_notice_returns_notice_already_sent
        claim_type: invalid_transitions
        grounds:
          - state_machines.ComplianceNotice.transitions.SCHEDULED_to_SENT
          - validations[priority=22]
          - errors[ERR_NOTICE_ALREADY_SENT]
        distinguishing_aspect: |
          The negative-option disclosure is created directly in SENT by the signup side effect, so
          SENT is not a legal from-state for the send trigger: the call is 409
          ERR_NOTICE_ALREADY_SENT and sent_at keeps its original value instead of being refreshed.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE (negative option) subscription for subscriber A, whose signup created a NEGATIVE_OPTION_DISCLOSURE notice already in state SENT."
            - "Clock then advanced to 2026-01-20 so a refreshed sent_at would be observable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
