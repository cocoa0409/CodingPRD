              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /courses"
              payload: { title: "OW Cert", course_type: "OPEN_WATER", required_pool_sessions: 0, required_open_water_sessions: 1, price_cents: 50000 }
              as: ShopAdmin
              captures: { course_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina Inst", rating: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /sessions"
              payload: { course_id: "${course_id}", session_type: "OPEN_WATER", primary_instructor_id: "${inst_id}", starts_at: "2026-06-04T08:00:00Z", ends_at: "2026-06-04T10:00:00Z" }
              as: ShopAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /sessions/${sess_id}/cancel"
              payload: {}
              as: ShopAdmin
              captures: { sess_v2: $.data.version }
            - call: "POST /divers"
              payload: { full_name: "Bo Booker", email: "bo@x.com" }
              as: ShopAdmin
              captures: { diver_id: $.data.id }
            - call: "POST /waivers"
              payload: { diver_id: "${diver_id}", medical_flagged: false }
              as: ShopAdmin
            - call: "POST /enrollments"
              payload: { diver_id: "${diver_id}", course_id: "${course_id}" }
              as: ShopAdmin
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /session-bookings"
              payload: { session_id: "${sess_id}", enrollment_id: "${enr_id}", expected_session_version: "${sess_v2}" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: waiver_beats_cert_on_trip_booking
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - entities.Diver.fields.medical_status
        distinguishing_aspect: |
          Pair {business_safety waiver (priority 8) vs business_safety cert
          (priority 9)}: a diver with NO active waiver AND below the trip's
          min_cert_level fails the higher-priority waiver gate first ->
          ERR_WAIVER_REQUIRED, never ERR_CERT_PREREQUISITE_NOT_MET. Distinct
          error-category pairing from the state/capacity conflict above.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. A Boat + an ADVANCED-min DiveTrip. A diver with cert_level NONE and no waiver attempts to book."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
