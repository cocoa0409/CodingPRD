  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_commission_post
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[commission-post-stale-agent]", "errors[ERR_STALE_AGENT_VERSION]"]
        distinguishing_aspect: "OCC on Agent.version for POST /commission-events: a second sequential posting carrying the pre-first-post version is rejected 412 even though the agent is ACTIVE and the posting would otherwise succeed."
        test_recipe:
          setup: ["ACTIVE a1; version v observed BEFORE the first posting"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 1000.00, occurred_on: "2026-09-05T00:00:00Z", external_ref: "ref-1", expected_agent_version: "${av}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { ev1: $.data.id } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 2000.00, occurred_on: "2026-09-06T00:00:00Z", external_ref: "ref-2", expected_agent_version: "${av}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "First post succeeds (version advanced by 1)"
            - "Second post with the stale captured version: error_id == ERR_STALE_AGENT_VERSION, HTTP 412"
            - "Agent.${a1}.accrued_company_dollar == 300.00 (only the first split applied)"

      - name: occ_stale_version_on_transfer_request
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transfer-request-stale-agent]", "errors[ERR_STALE_AGENT_VERSION]"]
        distinguishing_aspect: "Same OCC mechanism on the second guarded write endpoint: a transfer request carrying the version captured before a commission posting fails 412 — the two write endpoints share one version counter on Agent."
        test_recipe:
          setup: ["ACTIVE a1 in MC1; MC2 exists; version v observed before a commission post"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Two", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc2: $.data.id } }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 1000.00, occurred_on: "2026-09-05T00:00:00Z", external_ref: "ref-1", expected_agent_version: "${av}" }, as: MarketCenterAdmin, as_user_id: "${a1}" }
          trigger:
            - { call: "POST /agents/${a1}/transfer-requests", payload: { to_market_center_id: "${mc2}", effective_date: "2026-10-01T00:00:00Z", expected_agent_version: "${av}" }, as: Agent, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_AGENT_VERSION, HTTP 412 (commission posting bumped the agent version between read and transfer request)"

      - name: mark_paid_reconciles_derived_agent_totals
        claim_type: derived_field_reconciliation
        grounds: [entities.Agent.fields.lifetime_profit_share, entities.Agent.fields.pending_payable_profit_share, state_machines.ProfitShareDistribution.PAYABLE_to_PAID]
        distinguishing_aspect: "Derived-field reconciliation: mark-paid moves the distribution's amount between the two computed buckets on the agent — pending 750.00 -> 0.00, lifetime 0.00 -> 750.00 — in the same request, keeping the pair consistent with distribution state."
        test_recipe:
          setup: ["mca sponsors d1; d1 settled 5000.00 (company dollar 1500.00); period 2026-09 FINAL_CLOSED; mca's distribution PAYABLE 750.00"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "D One", email: "d1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { d1: $.data.id } }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-d1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-d1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-d1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "ALC Chair", email: "alc@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { alc: $.data.id } }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-alc-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${alc}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-alc-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${d1}", as: PlatformAdmin, captures: { d1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${d1}", gross_commission: 5000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-d1", expected_agent_version: "${d1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev: $.data.id } }
            - { call: "POST /commission-events/${ev}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /profit-share-periods/${per}/governance-resolutions", payload: { resolution_type: "FINAL_CLOSE_RATIFICATION" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { res: $.data.id } }
            - { call: "POST /governance-resolutions/${res}/propose", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /governance-resolutions/${res}/ratify", as: ALCChair, as_user_id: "${alc}" }
          trigger:
            - { call: "GET /profit-share-distributions", as: PlatformAdmin, payload: { period_id: "${per}", agent_id: "${mca}" }, captures: { dist: "$.data[0].id", amt: "$.data[0].amount", dst: "$.data[0].status" } }
            - { call: "POST /profit-share-distributions/${dist}/mark-paid", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "GET /agents/${mca}", as: PlatformAdmin, captures: { pend: $.data.pending_payable_profit_share, life: $.data.lifetime_profit_share } }
          assert:
            - "Before mark-paid: distribution PAYABLE with amount 750.00 and Agent.${mca}.pending_payable_profit_share == 750.00"
            - "After mark-paid: status PAID, pending_payable_profit_share == 0.00, lifetime_profit_share == 750.00"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: commission_post_immediately_visible_and_versioned
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.Agent.fields.accrued_company_dollar, entities.Agent.fields.version]
        distinguishing_aspect: "Immediate consistency: the posting request's own response carries the computed split (300.00/700.00) and a re-read in the same test shows accrued_company_dollar 300.00 and version incremented — no deferred reconciliation."
        test_recipe:
          setup: ["ACTIVE a1 at version v"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v0: $.data.version } }
          trigger:
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 1000.00, occurred_on: "2026-09-05T00:00:00Z", external_ref: "ref-1", expected_agent_version: "${v0}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { cd: $.data.company_dollar, ar: $.data.agent_retained, st: $.data.status } }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { acc: $.data.accrued_company_dollar, v1: $.data.version } }
          assert:
            - "Create response: company_dollar == 300.00, agent_retained == 700.00, status == POSTED"
            - "Immediate re-read: Agent.${a1}.accrued_company_dollar == 300.00 and version == ${v0} + 1"

      - name: depart_immediately_blocks_commission_posting
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Agent, "validations[priority=6]"]
        distinguishing_aspect: "Immediate consistency across entities: the very next sequential commission post after depart observes membership_status DEPARTED and fails ERR_INVALID_STATE — no grace window, no lag."
        test_recipe:
          setup: ["ACTIVE a1"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /agents/${a1}/depart", payload: { departure_date: "2026-09-10T00:00:00Z" }, as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version, mem: $.data.membership_status } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 1000.00, occurred_on: "2026-09-11T00:00:00Z", external_ref: "ref-x", expected_agent_version: "${av}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "Depart response shows membership_status DEPARTED; re-read confirms DEPARTED with a fresh version"
            - "Next commission post: error_id == ERR_INVALID_STATE, HTTP 409"
