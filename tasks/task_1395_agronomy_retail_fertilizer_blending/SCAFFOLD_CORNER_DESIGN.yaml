              payload: { permit_type: "FERTILIZER_STORAGE", site_code: "SITE-1", setback_ft: 200, max_storage_tons: 1000 }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: auth_missing_headers_returns_401
        claim_type: rbac_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected 401 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /agronomy/growers"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED (401); the request carries no user headers"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_prepay_contract_stale_grower_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[prepay-contract-create-stale-grower]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a first contract creation bumps GrowerAccount.version 1 -> 2, a second create carrying expected_grower_version 1 is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["grower (version 1 captured), MOP sheet, FALL program"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "OCC Farms", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /agronomy/products"
              payload: { name: "MOP 0-0-60", analysis_n_pct: 0, analysis_p2o5_pct: 0, analysis_k2o_pct: 60, form: "DRY" }
              as: BranchAdmin
              captures: { p_mop: $.data.id }
            - call: "POST /agronomy/products/${p_mop}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 44500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_mop: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_mop}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/prepay-programs"
              payload: { name: "FALL-2026 PREPAY", season: "FALL", enrollment_open_on: "2026-07-01T00:00:00Z", enrollment_close_on: "2026-10-31T00:00:00Z", funding_deadline: "2026-11-15T23:59:59Z", deposit_pct: 0.30, discount_pct: 0.05, default_penalty_pct: 0.10 }
              as: BranchAdmin
              captures: { pg_id: $.data.id }
          trigger:
            - call: "POST /agronomy/growers/${g_id}/prepay-contracts"
              payload: { prepay_program_id: "${pg_id}", product_id: "${p_mop}", committed_tons: 10, expected_grower_version: "${g_v}" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { pc1_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/prepay-contracts"
              payload: { prepay_program_id: "${pg_id}", product_id: "${p_mop}", committed_tons: 5, expected_grower_version: "${g_v}" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
            - call: "GET /agronomy/growers/${g_id}"
              as: CreditManager
              captures: { g_v_now: $.data.version }
          assert:
            - "pc1_id created (version 1 was current for the first write)"
            - "err == ERR_STALE_VERSION (412) — the second write's expected version 1 is stale"
            - "g_v_now == 2"

      - name: occ_patch_order_stale_order_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[blend-order-update-stale-order]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PATCH on a QUOTED order with the pre-mutation version succeeds once (recomputed provisional 390000), and the same stale version is then rejected 412."
        test_recipe:
          setup: ["grower, field, RESULTED soil test, APPROVED rec, UREA sheet 52000; urea-only order QUOTED (version captured)"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "OCC2 Farms", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "OC Field", acres: 50 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
            - call: "POST /agronomy/soil-tests/${st_id}/record-sampling"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_id: $.data.id }
            - call: "POST /agronomy/recommendations/${rec_id}/submit"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/recommendations/${rec_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/products"
              payload: { name: "UREA 46-0-0", analysis_n_pct: 46, analysis_p2o5_pct: 0, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_urea: $.data.id }
            - call: "POST /agronomy/products/${p_urea}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 52000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_urea: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_urea}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/growers/${g_id}/blend-orders"
              payload:
                field_id: "${f_id}"
                recommendation_id: "${rec_id}"
                acres: 50
                price_mode: "FLOATING"
                lines:
                  - { product_id: "${p_urea}", target_rate_lbs_per_acre: 348.1 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "PATCH /agronomy/blend-orders/${o_id}"
              payload:
                expected_blend_order_version: "${o_v}"
                lines:
                  - { product_id: "${p_urea}", target_rate_lbs_per_acre: 300.0 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { o_prov2: $.data.provisional_total_cents, o_v2: $.data.version }
            - call: "PATCH /agronomy/blend-orders/${o_id}"
              payload:
                expected_blend_order_version: "${o_v}"
                lines:
                  - { product_id: "${p_urea}", target_rate_lbs_per_acre: 310.0 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "o_prov2 == 390000 (7.500 t x 52000) and o_v2 == 2 (first PATCH with current version succeeded)"
            - "err == ERR_STALE_VERSION (second PATCH reusing the stale version rejected)"
            - "GET /agronomy/blend-orders/${o_id}: line rate still 300.0 (rejected patch left no trace)"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.GrowerAccount
          - "endpoints: PATCH /agronomy/growers/{growerId}/credit-terms"
        distinguishing_aspect: "Each accepted mutation bumps version by exactly 1 and refreshes updated_at; two credit-terms patches move version 1 -> 2 -> 3."
        test_recipe:
          setup: ["grower exists (version 1)"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Version Farms", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { g_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "PATCH /agronomy/growers/${g_id}/credit-terms"
              payload: { credit_limit_cents: 200000 }
              as: CreditManager
              captures: { v2: $.data.version }
            - call: "PATCH /agronomy/growers/${g_id}/credit-terms"
              payload: { credit_limit_cents: 300000 }
              as: CreditManager
              captures: { v3: $.data.version }
          assert:
            - "v1 == 1 and v2 == 2 and v3 == 3"

