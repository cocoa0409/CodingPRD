# =============================================================================
# Task 1958 — Professional License Verification & Renewal (employer-side)
# PRD Benchmark Scaffold (sections 1.0-1.7)
# =============================================================================

scenario: |
  1958. Professional License Verification & Renewal (employer-side): license
  inventory by employee & role requirement, primary source verification cadence,
  expiration alerting & work restriction on lapse, renewal reimbursement & CE
  tracking, disciplinary action monitoring via board feeds, multi-state licensure
  requirements, exclusion list screening for regulated industries, audit evidence
  package

domain_name: professional-license-verification-renewal
api_prefix: /licensing

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Section 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Section 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LicenseType
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique program code for the license type (e.g. RN, PE, CPA)" }
      - { name: name, type: string, source: input, description: "Human-readable license type name" }
      - { name: ce_hours_required_per_cycle, type: number, source: input, description: "CE hours (post-rounding) required per renewal cycle; 0 disables the CE gate", constraints: ">= 0" }
      - { name: cycle_length_months, type: integer, source: input, description: "Renewal cycle length in months used for the cycle CE window", constraints: "1..120" }
      - { name: verification_frequency_days, type: integer, source: input, description: "Primary-source re-verification cadence in days", constraints: "1..3650" }
      - { name: grace_period_days, type: integer, source: input, description: "Days after expires_on before an EXPIRED license lapses", constraints: ">= 0" }
      - { name: requires_exclusion_screening, type: boolean, source: input, description: "Whether holders in regulated roles need exclusion-list screening" }
      - { name: reimbursement_mode, type: enum, source: input, description: "RECEIPT_BASED | FLAT_SCHEDULE — selects the reimbursement estimate variant" }
      - { name: reimburse_full_up_to_cents, type: integer, source: input, description: "RECEIPT_BASED tier 1: 100% reimbursement up to this cumulative claim amount", constraints: ">= 0" }
      - { name: reimburse_half_up_to_cents, type: integer, source: input, description: "RECEIPT_BASED tier 2: 50% reimbursement on the claim portion above tier 1 up to this amount", constraints: ">= reimburse_full_up_to_cents" }
      - { name: flat_schedule_amount_cents, type: integer, source: input, description: "FLAT_SCHEDULE flat reimbursement amount (0 when mode is RECEIPT_BASED)", constraints: ">= 0" }
      - { name: hard_claim_cap_cents, type: integer, source: input, description: "Absolute per-request claim ceiling; claims above this are rejected outright", constraints: "> 0" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: work_email, type: string, source: input, description: "Unique work email (case-insensitive uniqueness)" }
      - { name: role_code, type: string, source: input, description: "Employer role code driving RoleRequirement matching (e.g. STAFF_NURSE, FIELD_ENGINEER)" }
      - { name: work_authorization, type: enum, source: computed, description: "AUTHORIZED | RESTRICTED — derived by employee_restriction calculation; RESTRICTED employees must not perform licensed work" }
      - { name: restriction_reason, type: enum, source: computed, description: "null | SCREENING_FLAGGED | LICENSE_SUSPENDED | LICENSE_LAPSED | VERIFICATION_OVERDUE | MISSING_LICENSE — highest-precedence active reason" }
      - { name: screening_posture, type: enum, source: computed, description: "CLEAR | PENDING_REVIEW | FLAGGED — derived from ExclusionScreening states" }
      - { name: reimbursement_committed_cents, type: integer, source: computed, description: "Open reimbursement exposure: sum(claimed over SUBMITTED/MORE_INFO requests) + sum(approved over APPROVED requests) for this employee" }
      - { name: reimbursement_paid_cents, type: integer, source: computed, description: "Lifetime sum of approved_amount_cents over PAID renewal requests" }

  - name: RoleRequirement
    parent: null
    common_fields: true
    fields:
      - { name: role_code, type: string, source: input, description: "Employer role code this requirement applies to" }
      - { name: license_type_id, type: string, source: input, description: "FK -> LicenseType.id; required license type" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code for multi-state licensure scope" }
      - { name: is_required, type: boolean, source: input, description: "Whether the (role_code, license_type, state_code) combination is mandatory" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; license holder" }
      - { name: license_type_id, type: string, source: input, description: "FK -> LicenseType.id" }
      - { name: state_code, type: string, source: input, description: "Issuing state (multi-state licensure: one row per state)" }
      - { name: license_number, type: string, source: input, description: "Board-issued license number" }
      - { name: issued_on, type: string, source: input, description: "ISO date of original issuance" }
      - { name: expires_on, type: string, source: input, description: "ISO date of expiration; extended in place on renewal verification", constraints: "must be > issued_on and <= issued_on + 730 days at creation" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | EXPIRED | LAPSED | SUSPENDED | REVOKED" }
      - { name: last_verified_on, type: string, source: system, description: "ISO date of last successful primary-source verification (null until first)" }
      - { name: next_verification_due_on, type: string, source: computed, description: "min(last_verified_on + verification_frequency_days, expires_on) unless client-pinned at verify time" }
      - { name: verification_posture, type: enum, source: computed, description: "NEVER_VERIFIED | CURRENT | OVERDUE — OVERDUE iff logical current date > next_verification_due_on" }
      - { name: alert_tier, type: enum, source: computed, description: "NONE | T90 | T60 | T30 | AT_EXPIRY — driven by days until expires_on for PENDING_VERIFICATION/ACTIVE; AT_EXPIRY otherwise" }
      - { name: ce_cycle_anchor_on, type: string, source: system, description: "ISO date anchoring the current CE cycle window; issued_on at creation, re-anchored to verified_on on reinstatement" }
      - { name: cycle_ce_hours_validated, type: number, source: computed, description: "Sum of rounded_hours over VALIDATED CE activities in the current cycle window" }
      - { name: rolling_ce_hours_validated, type: number, source: computed, description: "Sum of rounded_hours over VALIDATED CE activities completed in [current_date - 364 days, current_date]" }
      - { name: ce_progress_reported_pct, type: number, source: computed, description: "round(100 * cycle_ce_hours_validated / ce_hours_required_per_cycle, 2); null when requirement is 0" }
      - { name: ce_progress_required_pct, type: number, source: computed, description: "round(100 * rolling_ce_hours_validated / ce_hours_required_per_cycle, 2); null when requirement is 0" }

  - name: VerificationEvent
    parent: null
    common_fields: false
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id; append-only primary-source verification log entry" }
      - { name: verified_on, type: string, source: input, description: "ISO date the primary source was contacted" }
      - { name: source, type: enum, source: input, description: "STATE_BOARD_API | MANUAL_UPLOAD | NURSYS" }
      - { name: outcome, type: enum, source: input, description: "VERIFIED | MISMATCH | UNREACHABLE" }
      - { name: verifier_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who recorded the event" }
      - { name: next_verification_due_on, type: string, source: system, description: "Due date in effect after this event (echo of license field)" }

  - name: CEActivity
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; license this CE activity accrues to" }
      - { name: provider_name, type: string, source: input, description: "CE provider name" }
      - { name: activity_title, type: string, source: input, description: "Course/activity title" }
      - { name: hours, type: number, source: input, description: "Raw reported hours", constraints: ">= 0.25 and <= 200" }
      - { name: rounded_hours, type: number, source: computed, description: "round_half_up(hours * 2) / 2 — per-activity half-hour rounding applied BEFORE any summation" }
      - { name: completed_on, type: string, source: input, description: "ISO completion date; must not be after the logical current date" }
      - { name: status, type: enum, source: system, description: "LOGGED | VALIDATED | REJECTED" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who validated/rejected (null while LOGGED)" }

  - name: RenewalRequest
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; license being renewed" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Receipt total claimed by the requester", constraints: ">= 0 and <= license_type.hard_claim_cap_cents" }
      - { name: estimated_reimbursable_cents, type: integer, source: computed, description: "Tiered estimate computed at creation per reimbursement_estimate calculation" }
      - { name: expires_on_at_create, type: string, source: system, description: "Snapshot of license.expires_on at request creation (stale-reference pin)" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "min(estimated_reimbursable_cents, employer paid-cap remaining) fixed at approval" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | MORE_INFO | APPROVED | REJECTED | PAID | VOIDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the most recent submitter (SoD baseline for approval)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of approver/rejecter" }
      - { name: paid_by_user_id, type: string, source: system, description: "X-User-ID of HRPartner who marked paid" }
      - { name: paid_on, type: string, source: system, description: "ISO date marked PAID (null until paid)" }
      - { name: info_note, type: string, source: input, description: "Note recorded when ComplianceOfficer requests more information" }
      - { name: decision_note, type: string, source: input, description: "Note recorded on reject" }
      - { name: payment_ref, type: string, source: input, description: "Payment reference recorded on mark-paid" }
      - { name: void_reason, type: string, source: input, description: "Reason recorded on admin void" }

  - name: DisciplinaryEvent
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; license the board action targets" }
      - { name: board_case_number, type: string, source: input, description: "Board case identifier; unique per license" }
      - { name: event_type, type: enum, source: input, description: "WARNING | REPRIMAND | FINE | SUSPENSION | REVOCATION" }
      - { name: effective_on, type: string, source: input, description: "ISO effective date of the board action; must not be after the logical current date" }
      - { name: received_via, type: enum, source: input, description: "BOARD_FEED | MANUAL" }
      - { name: confirm_at_creation, type: boolean, source: input, description: "When true and event_type == SUSPENSION, the license suspension applies immediately at creation (still RECEIVED, dismiss reverts it)" }
      - { name: applied_at_creation, type: boolean, source: system, description: "True when the suspension side effect was applied at creation" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of recording ComplianceOfficer (SoD baseline)" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the officer who confirmed/dismissed/resolved" }
      - { name: resolution_note, type: string, source: input, description: "Note on dismiss/resolve" }
      - { name: status, type: enum, source: system, description: "RECEIVED | CONFIRMED | DISMISSED | RESOLVED" }

  - name: ExclusionScreening
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; screened employee" }
      - { name: list_source, type: enum, source: input, description: "OIG_LEIE | SAM_GSA | STATE_MEDICAID" }
      - { name: screened_on, type: string, source: input, description: "ISO screening date; must not be after the logical current date" }
      - { name: outcome, type: enum, source: input, description: "CLEAR | FLAGGED" }
      - { name: status, type: enum, source: system, description: "CLOSED_CLEAR | UNDER_REVIEW | CONFIRMED_MATCH | CLEARED_FALSE_POSITIVE" }
      - { name: valid_until, type: string, source: computed, description: "screened_on + 30 days, inclusive; only set for CLOSED_CLEAR screenings" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of screener (SoD baseline)" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of resolver" }
      - { name: resolution_note, type: string, source: input, description: "Note on clear-false-positive" }

  - name: AuditPackage
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; subject employee" }
      - { name: period_start, type: string, source: input, description: "ISO period start (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO period end (exclusive); must be > period_start" }
      - { name: status, type: enum, source: system, description: "BUILDING | SEALED | INVALIDATED" }
      - { name: sealed_at, type: string, source: system, description: "ISO datetime sealed (null until sealed)" }
      - { name: evidence_snapshot, type: array, source: computed, description: "Ordered evidence items frozen at seal: verification events, disciplinary events, exclusion screenings, PAID renewal requests overlapping the period" }
      - { name: evidence_item_count, type: integer, source: computed, description: "Length of evidence_snapshot" }

# =============================================================================
# Section 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: License
    initial_state: PENDING_VERIFICATION
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/verify with outcome VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "outcome == VERIFIED"
          - "verified_on <= logical current date + 1 day (ERR_INVALID_VERIFICATION_DATE)"
          - "expires_on >= verified_on (ERR_INVALID_VERIFICATION_DATE — cannot verify an already-expired pending license)"
          - "no prior VerificationEvent for this license with the same verified_on (ERR_DUPLICATE_VERIFICATION)"
        side_effects:
          - "status -> ACTIVE; last_verified_on := verified_on"
          - "next_verification_due_on := min(verified_on + license_type.verification_frequency_days, expires_on) unless request pins next_verification_due_on"
          - "verification_posture := CURRENT; alert_tier recomputed (alert_tier calculation)"
          - "VerificationEvent appended; employee_restriction recomputed for the holder (may clear MISSING_LICENSE)"

      - from: PENDING_VERIFICATION
        to: PENDING_VERIFICATION
        trigger: "POST /licensing/licenses/{id}/verify with outcome MISMATCH or UNREACHABLE"
        actor: ComplianceOfficer
        preconditions:
          - "no prior VerificationEvent for this license with the same verified_on (ERR_DUPLICATE_VERIFICATION)"
        side_effects:
          - "VerificationEvent appended; verification_posture stays NEVER_VERIFIED; alert_tier recomputed"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/verify with outcome VERIFIED (renewal-in-place or cadence re-verification)"
        actor: ComplianceOfficer
        preconditions:
          - "outcome == VERIFIED"
          - "verified_on > last_verified_on (ERR_VERIFICATION_OUT_OF_ORDER)"
          - "no prior VerificationEvent for this license with the same verified_on (ERR_DUPLICATE_VERIFICATION)"
        side_effects:
          - "last_verified_on := verified_on; expires_on := max(expires_on, verified_on + 365 days)"
          - "next_verification_due_on := min(verified_on + verification_frequency_days, expires_on) unless pinned"
          - "verification_posture := CURRENT; alert_tier recomputed"
          - "VerificationEvent appended; employee_restriction recomputed (may clear VERIFICATION_OVERDUE)"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/verify with outcome VERIFIED (renewal reinstatement)"
        actor: ComplianceOfficer
        preconditions:
          - "outcome == VERIFIED"
          - "verified_on > last_verified_on (ERR_VERIFICATION_OUT_OF_ORDER)"
          - "no prior VerificationEvent for this license with the same verified_on (ERR_DUPLICATE_VERIFICATION)"
          - "if license_type.ce_hours_required_per_cycle > 0: cycle_ce_hours_validated >= ce_hours_required_per_cycle (ERR_CE_HOURS_INSUFFICIENT)"
        side_effects:
          - "status -> ACTIVE; last_verified_on := verified_on; expires_on := verified_on + 365 days"
          - "ce_cycle_anchor_on := verified_on; cycle CE window restarts (cycle tally recomputes from the new anchor)"
          - "next_verification_due_on := min(verified_on + verification_frequency_days, expires_on) unless pinned"
          - "verification_posture := CURRENT; alert_tier recomputed"
          - "VerificationEvent appended; employee_restriction recomputed (may clear LICENSE_LAPSED)"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/verify with outcome VERIFIED (reinstatement after lapse)"
        actor: ComplianceOfficer
        preconditions:
          - "outcome == VERIFIED"
          - "verified_on > last_verified_on (ERR_VERIFICATION_OUT_OF_ORDER)"
          - "no prior VerificationEvent for this license with the same verified_on (ERR_DUPLICATE_VERIFICATION)"
          - "if license_type.ce_hours_required_per_cycle > 0: cycle_ce_hours_validated >= ce_hours_required_per_cycle (ERR_CE_HOURS_INSUFFICIENT)"
        side_effects:
          - "status -> ACTIVE; last_verified_on := verified_on; expires_on := verified_on + 365 days"
          - "ce_cycle_anchor_on := verified_on; cycle CE window restarts"
          - "next_verification_due_on := min(verified_on + verification_frequency_days, expires_on) unless pinned"
          - "verification_posture := CURRENT; alert_tier recomputed"
          - "VerificationEvent appended; employee_restriction recomputed (may clear LICENSE_LAPSED)"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system — license_expiry_sweep on POST /licensing/_clock/set_current_utc when current_date > expires_on"
        actor: system
        preconditions:
          - "license.status == ACTIVE and current_date > expires_on"
        side_effects:
          - "status -> EXPIRED; alert_tier := AT_EXPIRY"
          - "employee_restriction recomputed (EXPIRED inside grace is not itself a restriction reason)"

      - from: EXPIRED
        to: LAPSED
        trigger: "system — license_expiry_sweep when current_date > expires_on + grace_period_days"
        actor: system
        preconditions:
          - "license.status == EXPIRED and current_date > expires_on + license_type.grace_period_days"
        side_effects:
          - "status -> LAPSED; alert_tier := AT_EXPIRY"
          - "employee_restriction recomputed (LICENSE_LAPSED reason engages when the license covers a required RoleRequirement)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — DisciplinaryEvent of type SUSPENSION confirmed (at creation when confirm_at_creation, or via confirm)"
        actor: system
        preconditions:
          - "license.status == ACTIVE"
        side_effects:
          - "status -> SUSPENDED; alert_tier := AT_EXPIRY"
          - "employee_restriction recomputed (LICENSE_SUSPENDED reason engages)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — the covering SUSPENSION DisciplinaryEvent is resolved (or a creation-applied suspension is dismissed)"
        actor: system
        preconditions:
          - "no remaining SUSPENSION events for this license in {RECEIVED with applied_at_creation == true, CONFIRMED}"
        side_effects:
          - "status -> ACTIVE; alert_tier recomputed"
          - "employee_restriction recomputed (may clear LICENSE_SUSPENDED)"

      - from: ACTIVE
        to: REVOKED
        trigger: "system — DisciplinaryEvent of type REVOCATION confirmed"
        actor: system
        preconditions:
          - "license.status == ACTIVE"
        side_effects:
          - "status -> REVOKED; alert_tier := AT_EXPIRY"
          - "employee_restriction recomputed (REVOKED maps to the LICENSE_LAPSED restriction bucket)"

      - from: SUSPENDED
        to: REVOKED
        trigger: "system — DisciplinaryEvent of type REVOCATION confirmed while suspended"
        actor: system
        preconditions:
          - "license.status == SUSPENDED"
        side_effects:
          - "status -> REVOKED; alert_tier := AT_EXPIRY"
          - "employee_restriction recomputed"

  - entity: RenewalRequest
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licensing/renewal-requests/{id}/submit"
        actor: Employee | ComplianceOfficer
        preconditions:
          - "request.status == DRAFT (else ERR_INVALID_STATE)"
          - "Employee actor must own the license (license.employee_id == X-User-ID, else ERR_UNAUTHORIZED_ROLE)"
          - "license.status != SUSPENDED (ERR_LICENSE_SUSPENDED)"
          - "license.status in {ACTIVE, EXPIRED, LAPSED} (ERR_LICENSE_NOT_RENEWABLE)"
          - "employee.reimbursement_committed_cents + claimed_amount_cents <= EMPLOYER_COMMITTED_CAP_CENTS (ERR_COMMITTED_CAP_EXCEEDED)"
        side_effects:
          - "status -> SUBMITTED; submitted_by_user_id := X-User-ID"
          - "employee.reimbursement_committed_cents += claimed_amount_cents"

      - from: MORE_INFO
        to: SUBMITTED
        trigger: "POST /licensing/renewal-requests/{id}/submit"
        actor: Employee | ComplianceOfficer
        preconditions:
          - "request.status == MORE_INFO (else ERR_INVALID_STATE)"
          - "Employee actor must own the license (else ERR_UNAUTHORIZED_ROLE)"
          - "license.status != SUSPENDED (ERR_LICENSE_SUSPENDED)"
          - "license.status in {ACTIVE, EXPIRED, LAPSED} (ERR_LICENSE_NOT_RENEWABLE)"
          - "committed total unchanged by resubmission (already counted); cap re-checked: committed + 0 <= cap (cannot newly exceed)"
        side_effects:
          - "status -> SUBMITTED; submitted_by_user_id := X-User-ID"

      - from: SUBMITTED
        to: MORE_INFO
        trigger: "POST /licensing/renewal-requests/{id}/request-info"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> MORE_INFO; committed amount unchanged"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /licensing/renewal-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SOD_SAME_USER — segregation of duties)"
        side_effects:
          - "status -> APPROVED; decided_by_user_id := X-User-ID"
          - "approved_amount_cents := min(estimated_reimbursable_cents, EMPLOYER_PAID_CAP_CENTS - employee.reimbursement_paid_cents)"
          - "employee.reimbursement_committed_cents -= (claimed_amount_cents - approved_amount_cents)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /licensing/renewal-requests/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID != submitted_by_user_id (ERR_SOD_SAME_USER)"
        side_effects:
          - "status -> REJECTED; decided_by_user_id := X-User-ID; decision_note recorded"
          - "employee.reimbursement_committed_cents -= claimed_amount_cents"

      - from: APPROVED
        to: PAID
        trigger: "POST /licensing/renewal-requests/{id}/mark-paid"
        actor: HRPartner
        preconditions:
          - "request.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> PAID; paid_by_user_id := X-User-ID; paid_on := logical current date; payment_ref recorded"
          - "employee.reimbursement_committed_cents -= approved_amount_cents"
          - "employee.reimbursement_paid_cents += approved_amount_cents"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /licensing/renewal-requests/{id}/void"
        actor: ComplianceAdmin
        preconditions:
          - "request.status in {DRAFT, SUBMITTED, MORE_INFO, APPROVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> VOIDED; void_reason recorded; committed unchanged (DRAFT holds no commitment)"

      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /licensing/renewal-requests/{id}/void"
        actor: ComplianceAdmin
        preconditions:
          - "request.status in {DRAFT, SUBMITTED, MORE_INFO, APPROVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> VOIDED; employee.reimbursement_committed_cents -= claimed_amount_cents"

      - from: MORE_INFO
        to: VOIDED
        trigger: "POST /licensing/renewal-requests/{id}/void"
        actor: ComplianceAdmin
        preconditions:
          - "request.status in {DRAFT, SUBMITTED, MORE_INFO, APPROVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> VOIDED; employee.reimbursement_committed_cents -= claimed_amount_cents"

      - from: APPROVED
        to: VOIDED
        trigger: "POST /licensing/renewal-requests/{id}/void"
        actor: ComplianceAdmin
        preconditions:
          - "request.status in {DRAFT, SUBMITTED, MORE_INFO, APPROVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> VOIDED; employee.reimbursement_committed_cents -= approved_amount_cents"

  - entity: CEActivity
    initial_state: LOGGED
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: LOGGED
        to: VALIDATED
        trigger: "POST /licensing/ce-activities/{id}/validate"
        actor: ComplianceOfficer
        preconditions:
          - "activity.status == LOGGED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> VALIDATED; adjudicated_by_user_id := X-User-ID"
          - "license cycle_ce_hours_validated and rolling_ce_hours_validated recomputed (ce_tally_cycle / ce_tally_rolling); ce progress percentages recomputed"

      - from: LOGGED
        to: REJECTED
        trigger: "POST /licensing/ce-activities/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "activity.status == LOGGED (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> REJECTED; adjudicated_by_user_id := X-User-ID; tallies unchanged"

  - entity: DisciplinaryEvent
    initial_state: RECEIVED
    terminal_states: [DISMISSED, RESOLVED]
    transitions:
      - from: RECEIVED
        to: CONFIRMED
        trigger: "POST /licensing/disciplinary-events/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "event.status == RECEIVED (else ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SOD_SAME_USER)"
        side_effects:
          - "status -> CONFIRMED; adjudicated_by_user_id := X-User-ID"
          - "SUSPENSION (and not applied_at_creation): license ACTIVE -> SUSPENDED, then employee_restriction recompute cascades to the holder"
          - "REVOCATION: license {ACTIVE, SUSPENDED} -> REVOKED, then employee_restriction recompute cascades"
          - "WARNING | REPRIMAND | FINE: no license mutation"

      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /licensing/disciplinary-events/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions:
          - "event.status == RECEIVED (else ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SOD_SAME_USER)"
        side_effects:
          - "status -> DISMISSED; adjudicated_by_user_id := X-User-ID; resolution_note recorded"
          - "if applied_at_creation: license SUSPENDED -> ACTIVE (compensation), then employee_restriction recompute cascades"

      - from: CONFIRMED
        to: RESOLVED
        trigger: "POST /licensing/disciplinary-events/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "event.status == CONFIRMED (else ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SOD_SAME_USER)"
        side_effects:
          - "status -> RESOLVED; adjudicated_by_user_id := X-User-ID; resolution_note recorded"
          - "SUSPENSION: license SUSPENDED -> ACTIVE when no other open suspension covers the license, then employee_restriction recompute cascades"
          - "REVOCATION: license stays REVOKED (terminal)"

  - entity: ExclusionScreening
    initial_state: CLOSED_CLEAR
    terminal_states: [CLOSED_CLEAR, CONFIRMED_MATCH, CLEARED_FALSE_POSITIVE]
    transitions:
      - from: CLOSED_CLEAR
        to: CLOSED_CLEAR
        trigger: "creation with outcome CLEAR lands directly in CLOSED_CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "outcome == CLEAR"
          - "no other CLOSED_CLEAR screening for (employee_id, list_source) whose [screened_on, valid_until] window contains the new screened_on (ERR_SCREENING_WINDOW_OVERLAP)"
        side_effects:
          - "status := CLOSED_CLEAR; valid_until := screened_on + 30 days"
          - "employee screening_posture recomputed"

      - from: CLOSED_CLEAR
        to: UNDER_REVIEW
        trigger: "creation with outcome FLAGGED lands in UNDER_REVIEW"
        actor: ComplianceOfficer
        preconditions:
          - "outcome == FLAGGED"
        side_effects:
          - "status := UNDER_REVIEW"
          - "employee screening_posture := PENDING_REVIEW when not FLAGGED; employee_restriction recomputed"
        note: "The FROM state labels the initial_state family; creation is the only way into UNDER_REVIEW."

      - from: UNDER_REVIEW
        to: CONFIRMED_MATCH
        trigger: "POST /licensing/exclusion-screenings/{id}/confirm-match"
        actor: ComplianceOfficer
        preconditions:
          - "screening.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SOD_SAME_USER)"
        side_effects:
          - "status -> CONFIRMED_MATCH; resolved_by_user_id := X-User-ID"
          - "employee screening_posture := FLAGGED; employee_restriction recomputed (SCREENING_FLAGGED is the highest-precedence restriction reason)"

      - from: UNDER_REVIEW
        to: CLEARED_FALSE_POSITIVE
        trigger: "POST /licensing/exclusion-screenings/{id}/clear-false-positive"
        actor: ComplianceOfficer
        preconditions:
          - "screening.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SOD_SAME_USER)"
        side_effects:
          - "status -> CLEARED_FALSE_POSITIVE; resolved_by_user_id := X-User-ID; resolution_note recorded"
          - "employee screening_posture recomputed (CLEAR when no other UNDER_REVIEW or CONFIRMED_MATCH screenings remain)"

  - entity: AuditPackage
    initial_state: BUILDING
    terminal_states: [INVALIDATED]
    transitions:
      - from: BUILDING
        to: SEALED
        trigger: "POST /licensing/audit-packages/{id}/seal"
        actor: ExternalAuditor
        preconditions:
          - "package.status == BUILDING (else ERR_INVALID_STATE)"
          - "period_end <= logical current date (ERR_AUDIT_PERIOD_NOT_CLOSED)"
        side_effects:
          - "status -> SEALED; sealed_at := logical current timestamp"
          - "evidence_snapshot frozen per audit_snapshot calculation; evidence_item_count set"

      - from: SEALED
        to: INVALIDATED
        trigger: "system — a dependent fact mutates inside the sealed period (verification event, disciplinary event, screening, or PAID renewal request for the subject employee within [period_start, period_end))"
        actor: system
        preconditions:
          - "package.status == SEALED"
        side_effects:
          - "status -> INVALIDATED (snapshot retained for forensics)"

# =============================================================================
# Section 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: renewal-create-stale-license
    parent_entity: License
    write_endpoint: "POST /licensing/licenses/{id}/renewal-requests"
    occ_field: expected_license_version
    description: |
      Creating a RenewalRequest against a License whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created a renewal draft, recorded a
      verification, or applied a disciplinary cascade against the same license,
      and the current writer's view of the license (its expiry snapshot and
      computed fields) is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Section 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ce_rounding
    trigger: "CEActivity creation"
    algorithm: threshold
    formula: |
      rounded_hours = round_half_up(hours * 2) / 2
      Rounding is applied PER ACTIVITY at creation, BEFORE any summation.
      Summing raw hours and rounding the total afterwards is a different,
      forbidden order: 0.74 + 0.74 must tally 1.0 (0.5 + 0.5), not 1.5.
    constants:
      QUANTUM: 0.5
    precision: "2 decimal places, round_half_up at the per-activity step"

  - name: ce_tally_cycle
    trigger: "CEActivity validated/rejected; license reinstatement re-anchor; license read"
    algorithm: aggregation
    formula: |
      window = [ce_cycle_anchor_on, min(ce_cycle_anchor_on + cycle_length_months months, expires_on)]  (inclusive both ends)
      cycle_ce_hours_validated = sum(rounded_hours) over CEActivity
        where license_id == this license AND status == VALIDATED
        AND completed_on within window
    precision: "2 decimal places"

  - name: ce_tally_rolling
    trigger: "CEActivity validated/rejected; clock set; license read"
    algorithm: aggregation
    formula: |
      window = [current_date - 364 days, current_date]  (inclusive both ends; as_of = logical current date)
      rolling_ce_hours_validated = sum(rounded_hours) over CEActivity
        where license_id == this license AND status == VALIDATED
        AND completed_on within window
    precision: "2 decimal places"

  - name: ce_progress_pct
    trigger: "license read when ce tallies are recomputed"
    algorithm: aggregation
    formula: |
      base: reported = round(100 * cycle_ce_hours_validated / ce_hours_required_per_cycle, 2)
      null when ce_hours_required_per_cycle == 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: reported
        when: "employer-reported posture (what the file shows for the current cycle)"
        difference: "numerator is cycle_ce_hours_validated (cycle window since ce_cycle_anchor_on)"
      - name: required
        when: "regulator-required posture (what the rolling 365-day file shows)"
        difference: "numerator is rolling_ce_hours_validated (rolling window keyed to the logical current date); identical inputs can yield different percentages"

  - name: alert_tier
    trigger: "license creation, verification, clock set (sweep), status changes"
    algorithm: threshold
    formula: |
      days_until = expires_on - current_date   (whole days, date arithmetic)
      if status not in {PENDING_VERIFICATION, ACTIVE}: tier = AT_EXPIRY
      else if days_until >= 91: NONE
      else if days_until >= 61: T90
      else if days_until >= 31: T60
      else if days_until >= 1:  T30
      else: AT_EXPIRY
      Boundaries are inclusive downward: exactly 90 days -> T90; exactly 60 -> T60;
      exactly 30 -> T30; exactly 0 -> AT_EXPIRY.
    constants:
      T90_DAYS: 90
      T60_DAYS: 60
      T30_DAYS: 30

  - name: verification_posture
    trigger: "verification, clock set, license read"
    algorithm: threshold
    formula: |
      if last_verified_on is null: NEVER_VERIFIED
      else if current_date > next_verification_due_on: OVERDUE   (strict >)
      else: CURRENT                                              (equal is still CURRENT)

  - name: verification_due_default
    trigger: "successful VERIFIED event"
    algorithm: chronological
    formula: |
      next_verification_due_on = min(verified_on + license_type.verification_frequency_days, expires_on)
      unless the verify request pins next_verification_due_on explicitly.
      Re-verifications process strictly in verified_on order; a verified_on <= last_verified_on
      is rejected (ERR_VERIFICATION_OUT_OF_ORDER; equality on the same day is ERR_DUPLICATE_VERIFICATION).

  - name: license_expiry_sweep
    trigger: "POST /licensing/_clock/set_current_utc"
    algorithm: chronological
    formula: |
      Process all licenses ordered by expires_on ASC, tie-break created_at ASC:
        ACTIVE   and current_date > expires_on                          -> EXPIRED
        EXPIRED  and current_date > expires_on + grace_period_days      -> LAPSED
      Then recompute verification_posture and alert_tier for every
      PENDING_VERIFICATION / ACTIVE license, and run employee_restriction
      for every affected holder (each mutation bumps that entity's version).

  - name: employee_restriction
    trigger: "license verify/sweep transitions, disciplinary-event transitions, screening transitions, role-requirement create/delete, employee role_code change"
    algorithm: constraint_propagation
    formula: |
      R = RoleRequirement rows where role_code == employee.role_code AND is_required == true
      reasons (precedence high -> low):
        SCREENING_FLAGGED    : employee.screening_posture == FLAGGED
        LICENSE_SUSPENDED    : exists r in R with a license (employee, r.license_type_id, r.state_code) in SUSPENDED
        LICENSE_LAPSED       : exists r in R with a license (employee, r.license_type_id, r.state_code) in {LAPSED, REVOKED}
        VERIFICATION_OVERDUE : exists r in R with a license (employee, r.license_type_id, r.state_code) in ACTIVE with verification_posture == OVERDUE
        MISSING_LICENSE      : exists r in R with no license row, or all such rows in PENDING_VERIFICATION
      work_authorization = RESTRICTED if any reason else AUTHORIZED
      restriction_reason = highest-precedence active reason else null
      (EXPIRED within grace is not a restriction reason; screening_posture is itself derived:
       FLAGGED if any CONFIRMED_MATCH screening, else PENDING_REVIEW if any UNDER_REVIEW, else CLEAR)

  - name: reimbursement_estimate
    trigger: "RenewalRequest creation"
    algorithm: tiered_pricing
    formula: |
      RECEIPT_BASED:
        est = min( claimed,
                   reimburse_full_up_to_cents
                   + 0.5 * max(0, min(claimed, reimburse_half_up_to_cents) - reimburse_full_up_to_cents) )
      Integer cents; the 0.5 * x term uses round_half_up when x is odd.
    constants:
      EMPLOYER_COMMITTED_CAP_CENTS: 1000000
      EMPLOYER_PAID_CAP_CENTS: 1000000
    precision: "integer cents, round_half_up on the half-tier term"
    variants:
      - name: receipt_based
        when: "license_type.reimbursement_mode == RECEIPT_BASED"
        difference: "tiered marginal rates keyed on the claimed amount (100% band then 50% band)"
      - name: flat_schedule
        when: "license_type.reimbursement_mode == FLAT_SCHEDULE"
        difference: "est = min(flat_schedule_amount_cents, claimed_amount_cents) — the same claim yields a different estimate"

  - name: reimbursement_approval
    trigger: "RenewalRequest approval"
    algorithm: waterfall_allocation
    formula: |
      approved_amount_cents = min(estimated_reimbursable_cents,
                                  EMPLOYER_PAID_CAP_CENTS - employee.reimbursement_paid_cents)
      The paid-cap remainder bucket fills first; overflow is dropped (not deferred).
    constants:
      EMPLOYER_PAID_CAP_CENTS: 1000000
    precision: "integer cents"

  - name: audit_snapshot
    trigger: "AuditPackage seal"
    algorithm: aggregation
    formula: |
      evidence items, each { kind, ref_id, occurred_on }:
        VerificationEvent of employee's licenses with verified_on in [period_start, period_end)
        DisciplinaryEvent of employee's licenses with effective_on in [period_start, period_end)
        ExclusionScreening of the employee with screened_on in [period_start, period_end)
        RenewalRequest of employee's licenses with status PAID and paid_on in [period_start, period_end)
      Ordering: occurred_on ASC, tie-break kind ASC (alphabetical), then ref's created_at ASC.
      evidence_item_count = len(snapshot)

# =============================================================================
# Section 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for the endpoint; Employee actors must own the target license (license.employee_id == X-User-ID) on employee-scoped writes"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Body foreign keys must reference existing resources (employee_id, license_type_id, license_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "creation endpoints with body FKs (POST /licenses, /role-requirements, /ce-activities, /renewal-requests, /disciplinary-events, /exclusion-screenings, /audit-packages)"
    note: "Referenced-resource existence is validated BEFORE field-domain validation (p5)."

  - priority: 5
    category: business_constraint
    check: "Field-domain validation: required fields present, types match, enums in range, numeric ranges honored, sanity dates not in the future (screened_on, effective_on, completed_on)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 6
    category: state
    check: "Target resource must be in a from-state of the requested transition (request not DRAFT/MORE_INFO on submit, activity not LOGGED on validate, event not RECEIVED on confirm/dismiss, screening not UNDER_REVIEW, package not BUILDING on seal, license REVOKED on any verify)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-machine action endpoints"

  - priority: 7
    category: business_safety
    check: "Renewal submit blocked while the license is SUSPENDED"
    error_id: ERR_LICENSE_SUSPENDED
    http_status: 403
    applies_to: "POST /licensing/renewal-requests/{id}/submit"

  - priority: 8
    category: business_safety
    check: "License creation blocked while the employee has a CONFIRMED_MATCH exclusion screening"
    error_id: ERR_EMPLOYEE_SCREENING_FLAGGED
    http_status: 403
    applies_to: "POST /licensing/licenses"

  - priority: 9
    category: business_constraint
    check: "Uniqueness: employee work_email (case-insensitive); license (employee_id, license_type_id, state_code); role requirement (role_code, license_type_id, state_code); license type code; disciplinary (license_id, board_case_number)"
    error_id: "ERR_DUPLICATE_EMAIL | ERR_DUPLICATE_LICENSE | ERR_DUPLICATE_ROLE_REQUIREMENT | ERR_DUPLICATE_LICENSE_TYPE_CODE | ERR_DUPLICATE_CASE_NUMBER"
    http_status: 409
    applies_to: "creation and PATCH endpoints for those resources"

  - priority: 10
    category: business_constraint
    check: "Segregation of duties: approver/rejecter != submitted_by_user_id; disciplinary adjudicator != created_by_user_id; screening resolver != created_by_user_id"
    error_id: ERR_SOD_SAME_USER
    http_status: 403
    applies_to: "approve, reject, confirm, dismiss, resolve, confirm-match, clear-false-positive"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_license_version must equal the license's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /licensing/licenses/{id}/renewal-requests"

  - priority: 12
    category: business_temporal
    check: "License creation: expires_on must be > issued_on"
    error_id: ERR_INVALID_DATES
    http_status: 422
    applies_to: "POST /licensing/licenses"

  - priority: 13
    category: business_temporal
    check: "License creation: expires_on must be <= issued_on + 730 days (checked after p12)"
    error_id: ERR_VALIDITY_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /licensing/licenses"

  - priority: 14
    category: business_temporal
    check: "Verification: verified_on must be > last_verified_on for non-pending licenses; equal-day repeat is a duplicate; verified_on more than 1 day ahead of the logical clock, or expires_on < verified_on on a PENDING_VERIFICATION license, is invalid"
    error_id: "ERR_VERIFICATION_OUT_OF_ORDER | ERR_DUPLICATE_VERIFICATION | ERR_INVALID_VERIFICATION_DATE"
    http_status: 422
    applies_to: "POST /licensing/licenses/{id}/verify"
    note: "ERR_DUPLICATE_VERIFICATION is http 409."

  - priority: 15
    category: business_temporal
    check: "Audit packages: period_end > period_start; new package period [start, end) must not intersect any BUILDING/SEALED package of the same employee (adjacent is allowed; INVALIDATED packages are ignored); seal requires period_end <= logical current date"
    error_id: "ERR_INVALID_AUDIT_PERIOD | ERR_AUDIT_PERIOD_OVERLAP | ERR_AUDIT_PERIOD_NOT_CLOSED"
    http_status: 422
    applies_to: "POST /licensing/employees/{id}/audit-packages, POST /licensing/audit-packages/{id}/seal"
    note: "ERR_AUDIT_PERIOD_OVERLAP is http 409."

  - priority: 16
    category: business_temporal
    check: "Exclusion screening: a CLEAR outcome is rejected when an existing CLOSED_CLEAR screening for (employee_id, list_source) has [screened_on, valid_until] containing the new screened_on (both ends inclusive)"
    error_id: ERR_SCREENING_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /licensing/employees/{id}/exclusion-screenings"

  - priority: 17
    category: business_referential
    check: "Renewal submit: license.status must be in {ACTIVE, EXPIRED, LAPSED}"
    error_id: ERR_LICENSE_NOT_RENEWABLE
    http_status: 409
    applies_to: "POST /licensing/renewal-requests/{id}/submit"

  - priority: 18
    category: business_referential
    check: "CE activity creation: license.status must be in {ACTIVE, EXPIRED, LAPSED, SUSPENDED} (not PENDING_VERIFICATION or REVOKED)"
    error_id: ERR_LICENSE_NOT_CE_ELIGIBLE
    http_status: 409
    applies_to: "POST /licensing/licenses/{id}/ce-activities"

  - priority: 19
    category: business_referential
    check: "Reinstatement verify (from EXPIRED/LAPSED): cycle_ce_hours_validated >= ce_hours_required_per_cycle when the requirement is > 0"
    error_id: ERR_CE_HOURS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /licensing/licenses/{id}/verify"

  - priority: 20
    category: business_fiscal
    check: "Renewal create: claimed_amount_cents <= license_type.hard_claim_cap_cents"
    error_id: ERR_CLAIM_EXCEEDS_HARD_CAP
    http_status: 422
    applies_to: "POST /licensing/licenses/{id}/renewal-requests"

  - priority: 21
    category: business_fiscal
    check: "Renewal submit: employee.reimbursement_committed_cents + newly committed amount <= EMPLOYER_COMMITTED_CAP_CENTS (1000000)"
    error_id: ERR_COMMITTED_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /licensing/renewal-requests/{id}/submit"

# =============================================================================
# Section 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- License types ---
  - method: POST
    path: "/licensing/license-types"
    description: "Create a license type (renewal policy, CE policy, reimbursement policy)"
    roles: [ComplianceAdmin]
    code: 201
    input: [code, name, ce_hours_required_per_cycle, cycle_length_months, verification_frequency_days, grace_period_days, requires_exclusion_screening, reimbursement_mode, reimburse_full_up_to_cents, reimburse_half_up_to_cents, flat_schedule_amount_cents, hard_claim_cap_cents]
    output: LicenseType
    side_effects: []

  - method: GET
    path: "/licensing/license-types"
    description: "List license types"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "LicenseType[]"
    side_effects: []

  - method: GET
    path: "/licensing/license-types/{id}"
    description: "Get one license type"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: []
    output: LicenseType
    side_effects: []

  # --- Role requirements ---
  - method: POST
    path: "/licensing/role-requirements"
    description: "Create a role requirement (multi-state licensure matrix row)"
    roles: [ComplianceAdmin]
    code: 201
    input: [role_code, license_type_id, state_code, is_required]
    output: RoleRequirement
    side_effects:
      - "employee_restriction recomputed for every employee with matching role_code (MISSING_LICENSE may engage)"

  - method: GET
    path: "/licensing/role-requirements"
    description: "List role requirements with optional filters"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["role_code?", "state_code?", "license_type_id?", "limit?", "offset?"]
    output: "RoleRequirement[]"
    side_effects: []

  - method: GET
    path: "/licensing/role-requirements/{id}"
    description: "Get one role requirement"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: []
    output: RoleRequirement
    side_effects: []

  - method: DELETE
    path: "/licensing/role-requirements/{id}"
    description: "Delete a role requirement"
    roles: [ComplianceAdmin]
    code: 204
    input: []
    output: null
    side_effects:
      - "employee_restriction recomputed for every employee with matching role_code (MISSING_LICENSE may clear)"

  # --- Employees ---
  - method: POST
    path: "/licensing/employees"
    description: "Create an employee"
    roles: [HRPartner]
    code: 201
    input: [full_name, work_email, role_code]
    output: Employee
    side_effects:
      - "work_authorization initialized by employee_restriction (RESTRICTED/MISSING_LICENSE when required licenses absent, AUTHORIZED otherwise); screening_posture CLEAR; money counters 0"

  - method: GET
    path: "/licensing/employees"
    description: "List employees with optional filters"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["role_code?", "work_authorization?", "screening_posture?", "limit?", "offset?"]
    output: "Employee[]"
    side_effects: []

  - method: GET
    path: "/licensing/employees/{id}"
    description: "Get one employee (computed restriction and reimbursement fields)"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: PATCH
    path: "/licensing/employees/{id}"
    description: "Update employee profile; role_code change re-derives work authorization"
    roles: [HRPartner]
    code: 200
    input: ["full_name?", "work_email?", "role_code?"]
    output: Employee
    side_effects:
      - "on role_code change: employee_restriction recomputed (may engage MISSING_LICENSE)"

  # --- Licenses ---
  - method: POST
    path: "/licensing/licenses"
    description: "Register a license into the inventory"
    roles: [ComplianceOfficer]
    code: 201
    input: [employee_id, license_type_id, state_code, license_number, issued_on, expires_on]
    output: License
    side_effects:
      - "status := PENDING_VERIFICATION; verification_posture := NEVER_VERIFIED; alert_tier computed; ce tallies 0; ce_cycle_anchor_on := issued_on"
      - "employee_restriction recomputed (a PENDING_VERIFICATION row does not clear MISSING_LICENSE)"

  - method: GET
    path: "/licensing/licenses"
    description: "List licenses with filters"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["employee_id?", "license_type_id?", "state_code?", "status?", "verification_posture?", "alert_tier?", "limit?", "offset?"]
    output: "License[]"
    side_effects: []

  - method: GET
    path: "/licensing/licenses/{id}"
    description: "Get one license (computed posture, alert tier, CE tallies)"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licensing/employees/{id}/licenses"
    description: "List licenses of one employee"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "License[]"
    side_effects: []

  # --- Verification ---
  - method: POST
    path: "/licensing/licenses/{id}/verify"
    description: "Record a primary-source verification (initial, cadence, renewal-in-place, or reinstatement)"
    roles: [ComplianceOfficer]
    code: 200
    input: [verified_on, source, outcome, "next_verification_due_on?"]
    output: License
    side_effects:
      - "VerificationEvent appended; license state machine transition per current status and outcome (increments License.version by 1)"
      - "next_verification_due_on, verification_posture, alert_tier, CE anchor/tallies recomputed as applicable"
      - "employee_restriction recomputed for the holder"
      - "SEALED audit packages whose period contains verified_on -> INVALIDATED"

  - method: GET
    path: "/licensing/licenses/{id}/verification-events"
    description: "List the append-only verification log of a license"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "VerificationEvent[]"
    side_effects: []

  # --- CE activities ---
  - method: POST
    path: "/licensing/licenses/{id}/ce-activities"
    description: "Log a CE activity (license holder or officer)"
    roles: [Employee, ComplianceOfficer]
    code: 201
    input: [provider_name, activity_title, hours, completed_on]
    output: CEActivity
    side_effects:
      - "status := LOGGED; rounded_hours computed per ce_rounding; license tallies unchanged until validation"

  - method: GET
    path: "/licensing/licenses/{id}/ce-activities"
    description: "List CE activities of a license"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CEActivity[]"
    side_effects: []

  - method: POST
    path: "/licensing/ce-activities/{id}/validate"
    description: "Validate a logged CE activity (accrues to tallies)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CEActivity
    side_effects:
      - "status -> VALIDATED; license cycle/rolling tallies and ce progress percentages recomputed"

  - method: POST
    path: "/licensing/ce-activities/{id}/reject"
    description: "Reject a logged CE activity"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CEActivity
    side_effects:
      - "status -> REJECTED; tallies unchanged"

  # --- Renewal requests ---
  - method: POST
    path: "/licensing/licenses/{id}/renewal-requests"
    description: "Create a renewal reimbursement request (OCC-guarded on the license version)"
    roles: [Employee, ComplianceOfficer]
    code: 201
    input: [claimed_amount_cents, expected_license_version]
    output: RenewalRequest
    side_effects:
      - "status := DRAFT; estimated_reimbursable_cents computed per reimbursement_estimate; expires_on_at_create snapshot"
      - "increments License.version by 1"

  - method: GET
    path: "/licensing/licenses/{id}/renewal-requests"
    description: "List renewal requests of a license"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RenewalRequest[]"
    side_effects: []

  - method: GET
    path: "/licensing/renewal-requests/{id}"
    description: "Get one renewal request"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: []
    output: RenewalRequest
    side_effects: []

  - method: POST
    path: "/licensing/renewal-requests/{id}/submit"
    description: "Submit (or resubmit from MORE_INFO) a renewal request"
    roles: [Employee, ComplianceOfficer]
    code: 200
    input: []
    output: RenewalRequest
    side_effects:
      - "status -> SUBMITTED; committed reimbursement balance updated per state machine"

  - method: POST
    path: "/licensing/renewal-requests/{id}/request-info"
    description: "Send a submitted request back for more information"
    roles: [ComplianceOfficer]
    code: 200
    input: [info_note]
    output: RenewalRequest
    side_effects:
      - "status -> MORE_INFO; committed balance unchanged"

  - method: POST
    path: "/licensing/renewal-requests/{id}/approve"
    description: "Approve a submitted request (SoD: approver != submitter)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RenewalRequest
    side_effects:
      - "status -> APPROVED; approved_amount_cents computed per reimbursement_approval; committed balance reduced by the disallowed delta"

  - method: POST
    path: "/licensing/renewal-requests/{id}/reject"
    description: "Reject a submitted request (SoD applies)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision_note]
    output: RenewalRequest
    side_effects:
      - "status -> REJECTED; committed balance reduced by the full claim"

  - method: POST
    path: "/licensing/renewal-requests/{id}/mark-paid"
    description: "Mark an approved request paid"
    roles: [HRPartner]
    code: 200
    input: [payment_ref]
    output: RenewalRequest
    side_effects:
      - "status -> PAID; paid_on := logical current date; committed -= approved; paid += approved"
      - "SEALED audit packages whose period contains paid_on -> INVALIDATED"

  - method: POST
    path: "/licensing/renewal-requests/{id}/void"
    description: "Administratively void a non-terminal request"
    roles: [ComplianceAdmin]
    code: 200
    input: [void_reason]
    output: RenewalRequest
    side_effects:
      - "status -> VOIDED; committed balance released per state machine"

  # --- Disciplinary events ---
  - method: POST
    path: "/licensing/licenses/{id}/disciplinary-events"
    description: "Record a board disciplinary event (feed or manual entry)"
    roles: [ComplianceOfficer]
    code: 201
    input: [board_case_number, event_type, effective_on, received_via, "confirm_at_creation?"]
    output: DisciplinaryEvent
    side_effects:
      - "status := RECEIVED; created_by_user_id := X-User-ID"
      - "when confirm_at_creation and event_type == SUSPENSION: license ACTIVE -> SUSPENDED (applied_at_creation := true) and employee_restriction cascades"
      - "SEALED audit packages whose period contains effective_on -> INVALIDATED"

  - method: GET
    path: "/licensing/licenses/{id}/disciplinary-events"
    description: "List disciplinary events of a license"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["status?", "event_type?", "limit?", "offset?"]
    output: "DisciplinaryEvent[]"
    side_effects: []

  - method: POST
    path: "/licensing/disciplinary-events/{id}/confirm"
    description: "Confirm a received event (SoD: confirmer != recorder); applies license effects"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DisciplinaryEvent
    side_effects:
      - "status -> CONFIRMED; license cascade per event_type (SUSPENSION -> SUSPENDED; REVOCATION -> REVOKED); employee_restriction cascades"

  - method: POST
    path: "/licensing/disciplinary-events/{id}/dismiss"
    description: "Dismiss a received event (SoD applies); reverts creation-applied suspensions"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: DisciplinaryEvent
    side_effects:
      - "status -> DISMISSED; compensation reverts applied_at_creation suspensions; employee_restriction cascades"

  - method: POST
    path: "/licensing/disciplinary-events/{id}/resolve"
    description: "Resolve a confirmed event (SoD applies)"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: DisciplinaryEvent
    side_effects:
      - "status -> RESOLVED; SUSPENSION lifts when no other open suspension covers the license; employee_restriction cascades"

  # --- Exclusion screenings ---
  - method: POST
    path: "/licensing/employees/{id}/exclusion-screenings"
    description: "Record an exclusion-list screening"
    roles: [ComplianceOfficer]
    code: 201
    input: [list_source, screened_on, outcome]
    output: ExclusionScreening
    side_effects:
      - "outcome CLEAR -> CLOSED_CLEAR with valid_until := screened_on + 30d; outcome FLAGGED -> UNDER_REVIEW and employee screening_posture := PENDING_REVIEW (when not FLAGGED)"
      - "employee_restriction recomputed"
      - "SEALED audit packages whose period contains screened_on -> INVALIDATED"

  - method: GET
    path: "/licensing/employees/{id}/exclusion-screenings"
    description: "List screenings of an employee"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["status?", "list_source?", "limit?", "offset?"]
    output: "ExclusionScreening[]"
    side_effects: []

  - method: POST
    path: "/licensing/exclusion-screenings/{id}/confirm-match"
    description: "Confirm an UNDER_REVIEW screening as a true match (SoD applies)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExclusionScreening
    side_effects:
      - "status -> CONFIRMED_MATCH; employee screening_posture := FLAGGED; employee_restriction recomputed (SCREENING_FLAGGED)"

  - method: POST
    path: "/licensing/exclusion-screenings/{id}/clear-false-positive"
    description: "Clear an UNDER_REVIEW screening as false positive (SoD applies)"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: ExclusionScreening
    side_effects:
      - "status -> CLEARED_FALSE_POSITIVE; employee screening_posture recomputed"

  # --- Audit packages ---
  - method: POST
    path: "/licensing/employees/{id}/audit-packages"
    description: "Open an audit evidence package for an employee over a half-open period"
    roles: [ExternalAuditor]
    code: 201
    input: [period_start, period_end]
    output: AuditPackage
    side_effects:
      - "status := BUILDING; evidence_item_count := 0"

  - method: GET
    path: "/licensing/employees/{id}/audit-packages"
    description: "List audit packages of an employee"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AuditPackage[]"
    side_effects: []

  - method: GET
    path: "/licensing/audit-packages/{id}"
    description: "Get one audit package"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, Employee, ExternalAuditor]
    code: 200
    input: []
    output: AuditPackage
    side_effects: []

  - method: POST
    path: "/licensing/audit-packages/{id}/seal"
    description: "Seal a closed package; freezes the evidence snapshot"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: AuditPackage
    side_effects:
      - "status -> SEALED; evidence_snapshot frozen per audit_snapshot; evidence_item_count set"

  # --- Reports ---
  - method: GET
    path: "/licensing/reports/compliance-summary"
    description: "Computed compliance posture summary (counts and reimbursement totals)"
    roles: [ComplianceAdmin, ComplianceOfficer, HRPartner, ExternalAuditor]
    code: 200
    input: []
    output: "{ authorized_employee_count: integer, restricted_employee_count: integer, flagged_employee_count: integer, expired_license_count: integer, overdue_verification_count: integer, open_screening_count: integer, committed_reimbursement_cents: integer, paid_reimbursement_cents: integer }"
    side_effects: []

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/licensing/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "runs license_expiry_sweep: ACTIVE->EXPIRED and EXPIRED->LAPSED transitions, verification_posture and alert_tier recompute, employee_restriction cascades"

# =============================================================================
# Section 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint, or Employee actor does not own the target license" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign key references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum out of range, numeric range violation, future-dated screened_on/effective_on/completed_on" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a from-state of the requested transition" }
  - { id: ERR_LICENSE_SUSPENDED, http: 403, condition: "Renewal submit attempted while the license is SUSPENDED" }
  - { id: ERR_EMPLOYEE_SCREENING_FLAGGED, http: 403, condition: "License creation attempted for an employee with a CONFIRMED_MATCH exclusion screening" }
  - { id: ERR_SOD_SAME_USER, http: 403, condition: "Segregation of duties violated: adjudicator equals the original recorder/submitter" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Employee work_email already exists (case-insensitive)" }
  - { id: ERR_DUPLICATE_LICENSE, http: 409, condition: "A license already exists for (employee_id, license_type_id, state_code)" }
  - { id: ERR_DUPLICATE_ROLE_REQUIREMENT, http: 409, condition: "A role requirement already exists for (role_code, license_type_id, state_code)" }
  - { id: ERR_DUPLICATE_LICENSE_TYPE_CODE, http: 409, condition: "License type code already exists" }
  - { id: ERR_DUPLICATE_CASE_NUMBER, http: 409, condition: "A disciplinary event with this board_case_number already exists for the license" }
  - { id: ERR_DUPLICATE_VERIFICATION, http: 409, condition: "A verification event already exists for this license on the same verified_on date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_license_version does not match the license's current version (OCC)" }
  - { id: ERR_INVALID_VERIFICATION_DATE, http: 422, condition: "verified_on more than 1 day ahead of the logical clock, or expires_on < verified_on on a PENDING_VERIFICATION license" }
  - { id: ERR_INVALID_DATES, http: 422, condition: "expires_on is not after issued_on" }
  - { id: ERR_VALIDITY_WINDOW_EXCEEDED, http: 422, condition: "expires_on exceeds issued_on + 730 days" }
  - { id: ERR_VERIFICATION_OUT_OF_ORDER, http: 422, condition: "verified_on is not strictly after last_verified_on" }
  - { id: ERR_INVALID_AUDIT_PERIOD, http: 422, condition: "period_end is not after period_start" }
  - { id: ERR_AUDIT_PERIOD_OVERLAP, http: 409, condition: "Half-open [period_start, period_end) intersects another BUILDING/SEALED package of the same employee" }
  - { id: ERR_AUDIT_PERIOD_NOT_CLOSED, http: 422, condition: "Seal attempted before period_end has passed the logical current date" }
  - { id: ERR_SCREENING_WINDOW_OVERLAP, http: 422, condition: "CLEAR screening falls inside the inclusive validity window of an existing CLOSED_CLEAR screening for the same (employee, list_source)" }
  - { id: ERR_LICENSE_NOT_RENEWABLE, http: 409, condition: "License status is not in {ACTIVE, EXPIRED, LAPSED} for a renewal submit" }
  - { id: ERR_LICENSE_NOT_CE_ELIGIBLE, http: 409, condition: "CE activity creation attempted on a PENDING_VERIFICATION or REVOKED license" }
  - { id: ERR_CE_HOURS_INSUFFICIENT, http: 409, condition: "Reinstatement verify blocked: validated cycle CE hours below the license type requirement" }
  - { id: ERR_CLAIM_EXCEEDS_HARD_CAP, http: 422, condition: "claimed_amount_cents exceeds the license type's hard_claim_cap_cents" }
  - { id: ERR_COMMITTED_CAP_EXCEEDED, http: 402, condition: "Submit would push the employee's committed reimbursement balance over 1000000 cents" }

# =============================================================================
# Section 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "Compliance administrator; owns license-type policy, role-requirement matrix, administrative voids, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/license-types"
      - "POST /licensing/role-requirements"
      - "DELETE /licensing/role-requirements/{id}"
      - "POST /licensing/renewal-requests/{id}/void"
      - "POST /licensing/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "GET /licensing/reports/compliance-summary"

  - name: ComplianceOfficer
    description: "Compliance officer; runs verification cadence, CE adjudication, renewal review, disciplinary-event intake, and exclusion screening"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/licenses"
      - "POST /licensing/licenses/{id}/verify"
      - "POST /licensing/ce-activities/{id}/validate"
      - "POST /licensing/ce-activities/{id}/reject"
      - "POST /licensing/renewal-requests/{id}/request-info"
      - "POST /licensing/renewal-requests/{id}/approve"
      - "POST /licensing/renewal-requests/{id}/reject"
      - "POST /licensing/licenses/{id}/disciplinary-events"
      - "POST /licensing/disciplinary-events/{id}/confirm"
      - "POST /licensing/disciplinary-events/{id}/dismiss"
      - "POST /licensing/disciplinary-events/{id}/resolve"
      - "POST /licensing/employees/{id}/exclusion-screenings"
      - "POST /licensing/exclusion-screenings/{id}/confirm-match"
      - "POST /licensing/exclusion-screenings/{id}/clear-false-positive"
    shared_operations:
      - "All GET endpoints"
      - "GET /licensing/reports/compliance-summary"
      - "POST /licensing/licenses/{id}/renewal-requests (with Employee)"
      - "POST /licensing/renewal-requests/{id}/submit (with Employee)"
      - "POST /licensing/licenses/{id}/ce-activities (with Employee)"

  - name: HRPartner
    description: "HR partner; owns the employee roster and disburses approved reimbursements"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/employees"
      - "PATCH /licensing/employees/{id}"
      - "POST /licensing/renewal-requests/{id}/mark-paid"
    shared_operations:
      - "All GET endpoints"
      - "GET /licensing/reports/compliance-summary"

  - name: Employee
    description: "License-holding employee acting on their own record (X-User-ID == Employee.id)"
    identity: entity_backed:Employee
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /licensing/licenses/{id}/renewal-requests (own licenses only)"
      - "POST /licensing/renewal-requests/{id}/submit (own licenses only)"
      - "POST /licensing/licenses/{id}/ce-activities (own licenses only)"

  - name: ExternalAuditor
    description: "External auditor; builds and seals audit evidence packages"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/employees/{id}/audit-packages"
      - "POST /licensing/audit-packages/{id}/seal"
    shared_operations:
      - "All GET endpoints"
      - "GET /licensing/reports/compliance-summary"
