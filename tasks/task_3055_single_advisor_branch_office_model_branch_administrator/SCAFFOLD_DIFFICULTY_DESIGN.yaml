              as: HomeOfficeAdmin
              captures: { br_id: $.data.id, br_v: $.data.version }
            - call: "PATCH /branch-office/branches/${br_id}"
              payload: { expected_branch_version: "${br_v}", household_count: 80, assets_under_care_dollars: 10000000 }
              as: HomeOfficeAdmin
              captures: { br_v2: $.data.version, tier_900: $.data.service_tier, score_900: $.data.tier_score }
          trigger:
            - call: "PATCH /branch-office/branches/${br_id}"
              payload: { expected_branch_version: "${br_v2}", assets_under_care_dollars: 10100000 }
              as: HomeOfficeAdmin
              captures: { tier_901: $.data.service_tier, score_901: $.data.tier_score }
          assert:
            - "Branch.tier_score after first PATCH == 900 and service_tier == TIER_2 (inclusive ceiling)"
            - "Branch.tier_score after second PATCH == 901 and service_tier == TIER_3"

