              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Reveal Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-03T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-RVL-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 4, reveal_at: "2026-09-02T12:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 2 }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "Listing.${listing_id}.listing_status is DRAFT after launch because reveal_at is still in the future"
            - "the response status is 409 and error_id == ERR_LISTING_NOT_REVEALED"
            - "the line was created successfully earlier — Confirmation.${line_id} exists with confirmation_status PENDING_AGGREGATION, so the rule is temporal rather than a creation-time rejection"
            - "the reveal rule is evaluated on the line's event at submission time and not against the order: the order itself carries no event_id"
            - "after POST /events/${event_id}/close with cancel_pending_aggregations true, Confirmation.${line_id} is CANCELLED and the order is CANCELLED, so the blocked line is released rather than stranded"
            - "Event.${event_id}.event_status == CLOSED and the listing is WITHDRAWN, which is the only path that clears an unrevealed listing"

  # ===========================================================================
  - section: errors
    instances:

      - name: error_payout_exceeds_balance_on_a_payout_larger_than_owed
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PAYOUT_EXCEEDS_BALANCE
          - validations[priority=11]
          - endpoints.POST_/customers/{id}/payouts
        distinguishing_aspect: "A payout larger than the owed refund balance is refused with 409 ERR_PAYOUT_EXCEEDS_BALANCE rather than clamping silently, and a payout of exactly the balance is admitted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer with a 1500-cent refund balance produced by a refunded short-ship."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /customers/${customer_id}/credits"
              payload: { amount_cents: 1500, idempotency_key: "payout-seed-1", reason_code: "GOODWILL" }
              as: CustomerService
          trigger:
            - call: "POST /customers/${customer_id}/credits"
              payload: { amount_cents: 1000, idempotency_key: "payout-seed-2", reason_code: "GOODWILL" }
              as: CustomerService
          assert:
            - "the seed is accepted: the first credit succeeds and Customer.${customer_id}.lifetime_credit_issued_cents == 1500"
            - "the store credit and the refund balance are separate quantities: store_credit_balance_cents is 1500 while refund_balance_cents is 0"
            - "a payout of 1 cent against a zero owed refund is refused with 409 ERR_PAYOUT_EXCEEDS_BALANCE"
            - "a payout of exactly the balance is admitted: with refund_balance_cents at 1500 a 1500-cent payout succeeds with 201"
            - "a second payout of 1 cent after that is refused again, so the rule is enforced on every payout rather than only the first"
            - "after the admitted payout Customer.${customer_id}.refund_balance_cents == 0 and the ledger holds exactly 2 rows"

  # ===========================================================================
  - section: rbac
    instances:

      - name: vendor_cannot_confirm_another_vendors_purchase_order_lines
        claim_type: peer_role_cross_ownership
        grounds:
          - roles[Vendor]
          - validations[priority=3]
          - errors.ERR_PO_NOT_OWNED_BY_VENDOR
          - endpoints.POST_/confirmations/{id}/confirm
        distinguishing_aspect: "Vendor is entity_backed, so the acting X-User-ID must equal the covering PO's vendor_id: a different vendor's id on the same confirm endpoint is refused with 409 ERR_PO_NOT_OWNED_BY_VENDOR, a peer-role ownership denial rather than a role denial."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Vendor V1 and Vendor V2, each with a shop and a live event, and a line placed against V1's listing."
            - "A DRAFT buy for V1 covers V1's listing; V1 confirms the line once successfully."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor1_id: $.data.id, vendor1_v0: $.data.version }
            - call: "POST /vendors"
              payload: { legal_name: "Other Supply Co", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor2_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor1_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop1_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop1_id}", event_title: "Ownership Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-OWN-1", unit_price_cents: 300, vendor_unit_cost_cents: 180, allocation_units: 5, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 3 }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor1_id}", event_id: "${event_id}", expected_vendor_version: "${vendor1_v0}" }
              as: InventoryPlanner
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 3 }
              as: InventoryPlanner
          trigger:
            - call: "POST /confirmations/${line_id}/confirm"
              payload: { confirm_units: 3 }
              as: Vendor
              as_user_id: "${vendor2_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PO_NOT_OWNED_BY_VENDOR"
            - "Confirmation.${line_id}.confirmation_status is still PENDING_VENDOR and confirmed_units is null"
            - "the same call with as_user_id ${vendor1_id} succeeds with 200 and sets confirmed_units to 3"
            - "the denial is ownership rather than role: role Vendor IS listed on the endpoint, so ERR_FORBIDDEN_FOR_ROLE was not returned"
            - "POLine.quantity_confirmed for the buy is still 0 after the denial and 3 after the admitted call"

      - name: customer_cannot_read_another_customers_order
        claim_type: peer_role_cross_ownership
        grounds:
          - roles[Customer]
          - validations[priority=3]
          - errors.ERR_FORBIDDEN_FOR_ROLE
          - endpoints.GET_/orders/{id}
        distinguishing_aspect: "The Customer role's ownership check compares X-User-ID to the addressed order's customer_id, so a second customer reading the first customer's order is refused with 403 ERR_FORBIDDEN_FOR_ROLE while an operator role reaches the same row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two customers C1 and C2, each with an order; C1's order carries one line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
