              payload: {}
              as: ContentModerator
            - call: "POST /platform/complaints/${ci2_id}/resolve"
              payload: { action: "REMOVE_REVIEW" }
              as: ContentModerator
            - call: "GET /platform/business-pages/${pi_id}"
              payload: {}
              as: SupportAdmin
              captures: { pi_count_end: $.data.displayed_review_count, pi_avg_end: $.data.displayed_rating_avg_x100 }
          assert:
            - "After RESTORE_REVIEW: displayed_review_count == 1 and displayed_rating_avg_x100 == 400"
            - "After compensating REMOVE_REVIEW: displayed_review_count == 0 and displayed_rating_avg_x100 == 0 — exactly the pre-complaint values"
            - "Review.${ri_id}.recommendation_state == REMOVED and User.${ia_id}.trust_score == 45 (50 - 5 removal penalty)"

