# =============================================================================
# PRD-bench scaffold — Paid-Newsletter & Membership Community
# Difficulty: Expert
# =============================================================================

scenario: |
  Paid-Newsletter & Membership Community (Substack/Circle style): tier & subscription billing,
  content gating (post/newsletter/event), member onboarding & churn/win-back, comment/community &
  moderation, free-to-paid funnel & trial, payout & platform fee, email deliverability, analytics

domain_name: paid-newsletter-community
# Flat, multi-root topology: Publication, Member, Subscription, Invoice, Post, Event,
# EventRegistration, Comment and Payout are peer top-level resources linked by foreign keys
# rather than nested under a single collection, so api_prefix is empty (paths are absolute).
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration      # subscription lifecycle: trial → active → past_due → canceled → win-back
  secondary_archetype: pricing_engine            # tiered billing, proration, platform-fee split, payout
  complexity_layers:
    - dual_variant_calculation                   # provisional vs final proration; MRR vs recognized revenue
    - cascading_side_effects                      # subscription cancel → registration cancel → seat release → waitlist promote
    - optimistic_concurrency                      # OCC on Publication.version (payout) and Subscription.version (change-tier)
    - rate_threshold_triggers                     # bounce-rate crosses deliverability breakpoints

  entity_topology: flat
  state_machine_shape: cyclic                     # Subscription loops CANCELED→ACTIVE via win-back; Payout FAILED branch; Comment fork
  relationship_patterns:
    - one_to_many                                 # Publication → Tier/Member/Post/Event/Payout
    - flat_with_references                        # Subscription→(Member,Tier); Invoice→Subscription; Registration→(Event,Member); Comment→(Post,Member)
    - cross_aggregate                             # Comment gating reads Subscription; content gating reads Subscription

  role_model: peer_roles                          # Creator owns Publication surface; Member owns own Subscription/Registration/Comment; Moderator moderates; PlatformAdmin operates
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Publication
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Publication display name" }
      - { name: creator_user_id, type: string, source: system, description: "Opaque X-User-ID of the Creator who owns this publication (ownership key)" }
      - { name: platform_fee_bps, type: integer, source: input, default: 1000, description: "Platform fee in basis points (1000 = 10%)", constraints: "0..3000" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }
      - { name: deliverability_status, type: enum, source: system, default: HEALTHY, description: "HEALTHY | THROTTLED | SUSPENDED (email posture)" }
      - { name: sent_count, type: integer, source: computed, default: 0, description: "Cumulative newsletter recipient-sends" }
      - { name: bounce_count, type: integer, source: computed, default: 0, description: "Cumulative hard email bounces" }
      - { name: bounce_rate, type: number, source: computed, description: "bounce_count / max(1, sent_count)" }
      - { name: lifetime_net_cents, type: integer, source: computed, default: 0, description: "Cumulative creator_net credited from PAID invoices minus refunded net" }
      - { name: payout_balance_cents, type: integer, source: computed, default: 0, description: "Net currently available to withdraw" }
      - { name: pending_payout_cents, type: integer, source: computed, default: 0, description: "Net held by REQUESTED payouts" }
      - { name: lifetime_paid_out_cents, type: integer, source: computed, default: 0, description: "Cumulative net paid out via settled payouts" }
      - { name: active_member_count, type: integer, source: computed, default: 0, description: "Members with a Subscription in {ACTIVE, TRIALING}" }
      - { name: mrr_cents, type: integer, source: computed, default: 0, description: "Forward-looking monthly recurring revenue (see calculation publication_revenue)" }
      - { name: recognized_revenue_cents, type: integer, source: computed, default: 0, description: "Chronological collected creator_net (see calculation publication_revenue)" }

  - name: Tier
    parent: Publication
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id; owning publication" }
      - { name: name, type: string, source: input, description: "Tier name (e.g. Free, Plus, Pro)" }
      - { name: tier_rank, type: integer, source: input, description: "0 = free; higher = more access; unique per publication", constraints: ">=0, unique per publication" }
      - { name: monthly_price_cents, type: integer, source: input, description: "Recurring price; 0 for free tier", constraints: ">=0" }
      - { name: trial_days, type: integer, source: input, default: 0, description: "Trial length in days for this tier", constraints: ">=0" }
      - { name: is_free, type: boolean, source: computed, description: "true iff tier_rank == 0 (equivalently monthly_price_cents == 0)" }

  - name: Member
    parent: Publication
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (also the Member role's X-User-ID)" }
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id; owning publication" }
      - { name: email, type: string, source: input, description: "Member email; unique per publication", constraints: "unique per publication" }
      - { name: display_name, type: string, source: input, description: "Member display name" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED | BOUNCED" }
      - { name: verification_token, type: string, source: system, description: "One-time onboarding token, issued at creation" }
      - { name: email_bounced, type: boolean, source: computed, default: false, description: "true after a hard bounce is recorded for this member" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the subscribing member (from path)" }
      - { name: tier_id, type: string, source: input, description: "FK -> Tier.id; current tier" }
      - { name: status, type: enum, source: system, description: "TRIALING | ACTIVE | PAST_DUE | CANCELED | EXPIRED" }
      - { name: current_tier_rank, type: integer, source: computed, description: "Mirror of current tier.tier_rank; recomputed on change-tier (used for gating)" }
      - { name: current_period_start, type: datetime, source: system, description: "ISO8601 UTC start of the current paid period" }
      - { name: current_period_end, type: datetime, source: system, description: "ISO8601 UTC end of current period (= start + 30 days)" }
      - { name: trial_end, type: datetime, source: system, description: "ISO8601 UTC trial expiry; null if no trial" }
      - { name: canceled_at, type: datetime, source: system, description: "ISO8601 UTC when moved to CANCELED; null otherwise" }
      - { name: dunning_deadline, type: datetime, source: system, description: "ISO8601 UTC grace deadline set on PAST_DUE (= failure time + 7 days); null otherwise" }
      - { name: reactivation_count, type: integer, source: computed, default: 0, description: "Number of successful win-back reactivations" }
      - { name: is_win_back, type: boolean, source: computed, default: false, description: "true if the current active spell began via win-back reactivation" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; billed subscription" }
      - { name: reason, type: enum, source: system, description: "INITIAL | RENEWAL | PRORATION_UPGRADE | WIN_BACK" }
      - { name: gross_cents, type: integer, source: computed, description: "Base tier price basis for this invoice" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Win-back discount applied (see win_back_discount)" }
      - { name: proration_factor, type: number, source: system, default: 1.0, description: "Fraction of a full period billed (1.0 for INITIAL/RENEWAL/WIN_BACK)" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Payable amount (see invoice_amount_due)" }
      - { name: platform_fee_cents, type: integer, source: computed, default: 0, description: "Platform fee on this invoice, computed at PAID (see platform_fee_and_creator_net)" }
      - { name: creator_net_cents, type: integer, source: computed, default: 0, description: "amount_due_cents - platform_fee_cents, computed at PAID" }
      - { name: payment_status, type: enum, source: system, default: OPEN, description: "OPEN | PAID | FAILED | REFUNDED" }
      - { name: due_at, type: datetime, source: system, description: "ISO8601 UTC due date" }
      - { name: paid_at, type: datetime, source: system, description: "ISO8601 UTC when marked PAID; null otherwise" }

  - name: Post
    parent: Publication
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id; owning publication" }
      - { name: title, type: string, source: input, description: "Post/newsletter title" }
      - { name: body, type: string, source: input, description: "Gated content body" }
      - { name: content_type, type: enum, source: input, default: POST, description: "POST | NEWSLETTER" }
      - { name: min_tier_rank, type: integer, source: input, default: 0, description: "Minimum subscriber tier_rank required to read/comment", constraints: ">=0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SENT | ARCHIVED" }
      - { name: send_window_start, type: datetime, source: system, description: "ISO8601 UTC send-throttle window start; null until sent" }
      - { name: send_window_end, type: datetime, source: system, description: "ISO8601 UTC send-throttle window end (= start + 60 min); null until sent" }
      - { name: recipient_count, type: integer, source: computed, default: 0, description: "Members emailed on send" }
      - { name: approved_comment_count, type: integer, source: computed, default: 0, description: "Count of comments in status APPROVED" }

  - name: Event
    parent: Publication
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id; owning publication" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC event start" }
      - { name: ends_at, type: datetime, source: input, description: "ISO8601 UTC event end", constraints: "ends_at > starts_at" }
      - { name: registration_closes_at, type: datetime, source: input, description: "ISO8601 UTC after which new registrations are rejected" }
      - { name: min_tier_rank, type: integer, source: input, default: 0, description: "Minimum subscriber tier_rank required to register", constraints: ">=0" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity", constraints: ">=1" }
      - { name: allow_waitlist, type: boolean, source: input, default: true, description: "If false, a full event rejects registration instead of waitlisting" }
      - { name: registered_count, type: integer, source: computed, default: 0, description: "Registrations in status REGISTERED" }
      - { name: waitlist_count, type: integer, source: computed, default: 0, description: "Registrations in status WAITLISTED" }
      - { name: available_slots, type: integer, source: computed, description: "capacity - registered_count (never negative)" }

  - name: EventRegistration
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_id, type: string, source: system, description: "FK -> Event.id; the event (from path)" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the registering member (from X-User-ID)" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | WAITLISTED | CANCELED" }
      - { name: registered_at, type: datetime, source: system, description: "ISO8601 UTC creation time" }

  - name: Comment
    parent: Post
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: post_id, type: string, source: system, description: "FK -> Post.id; the commented post (from path)" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the author (from X-User-ID)" }
      - { name: body, type: string, source: input, description: "Comment text" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | REJECTED | HELD | HIDDEN" }
      - { name: moderation_reason, type: string, source: system, description: "Moderator note; null until moderated" }

  - name: Payout
    parent: Publication
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: publication_id, type: string, source: system, description: "FK -> Publication.id; paying publication (from path)" }
      - { name: amount_cents, type: integer, source: input, description: "Requested gross withdrawal", constraints: ">0" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | PAID | FAILED" }
      - { name: settled_at, type: datetime, source: system, description: "ISO8601 UTC when settled; null otherwise" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    field: status
    initial_state: TRIALING
    terminal_states: [EXPIRED]
    note: |
      Creation: free tier (tier_rank 0) auto-advances TRIALING→ACTIVE at creation with no invoice.
      Paid tier creates an INITIAL invoice due at trial_end (= creation + trial_days; = creation when
      trial_days == 0) and stays TRIALING until that invoice is PAID. CANCELED is not terminal because
      win-back reactivation (within 30 days) returns it to ACTIVE; after the window it has no exit.
    transitions:
      - from: TRIALING
        to: ACTIVE
        trigger: "system: free tier at creation, OR POST /_payments/simulate outcome=SUCCEEDED on the INITIAL invoice"
        actor: system
        preconditions:
          - "Publication.status == ACTIVE"                       # CROSS-ENTITY: Subscription↔Publication (Rule 7)
        side_effects:
          - "Set current_period_start = clock, current_period_end = clock + 30 days"
          - "If via payment: Invoice.payment_status=PAID, compute platform_fee_and_creator_net, credit Publication.payout_balance_cents and lifetime_net_cents by creator_net_cents"
          - "Recompute Publication.active_member_count, mrr_cents, recognized_revenue_cents (publication_revenue)"
      - from: TRIALING
        to: EXPIRED
        trigger: "POST /_payments/simulate outcome=FAILED on the INITIAL invoice"
        actor: system
        preconditions: []
        side_effects:
          - "Invoice.payment_status=FAILED"
          - "Recompute Publication.active_member_count, mrr_cents"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{subscriptionId}/renew"
        actor: PlatformAdmin
        preconditions:
          - "status == ACTIVE"
          - "clock >= current_period_end"                        # BOUNDARY / temporal
        side_effects:
          - "Create RENEWAL invoice (proration_factor 1.0, discount 0) due at clock, payment_status OPEN"
          - "Advance current_period_start = old current_period_end, current_period_end += 30 days"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{subscriptionId}/change-tier"
        actor: "Member or Creator"
        preconditions:
          - "status == ACTIVE"
          - "expected_subscription_version matches Subscription.version (OCC)"
          - "new tier belongs to same Publication as the member"
        side_effects:
          - "Compute subscription_proration (provisional) → create PRORATION_UPGRADE invoice for the delta (only when delta_price > 0)"
          - "Set tier_id = new_tier_id, recompute current_tier_rank"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /_payments/simulate outcome=FAILED on a RENEWAL invoice"
        actor: system
        preconditions: []
        side_effects:
          - "Invoice.payment_status=FAILED"
          - "Set dunning_deadline = clock + 7 days"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /_payments/simulate outcome=SUCCEEDED on the FAILED RENEWAL invoice (retry)"
        actor: system
        preconditions:
          - "Publication.status == ACTIVE"
        side_effects:
          - "Clear dunning_deadline"
          - "Invoice.payment_status=PAID; credit Publication.payout_balance_cents and lifetime_net_cents by creator_net_cents"
          - "Recompute Publication.active_member_count, mrr_cents, recognized_revenue_cents"
      - from: [ACTIVE, PAST_DUE]
        to: CANCELED
        trigger: "POST /subscriptions/{subscriptionId}/cancel"
        actor: "Member or Creator"
        preconditions:
          - "status IN {ACTIVE, PAST_DUE}"
          - "if reason=DUNNING: status == PAST_DUE and clock >= dunning_deadline"
        side_effects:
          - "Set canceled_at = clock"
          - "CASCADE(depth3): every EventRegistration of this member in status REGISTERED for an Event with starts_at > clock → CANCELED; each such cancel decrements that Event.registered_count and increments available_slots; each freed slot promotes the earliest-created WAITLISTED registration on that Event to REGISTERED (transitive_cascade)"
          - "Recompute Publication.active_member_count, mrr_cents"
      - from: CANCELED
        to: ACTIVE
        trigger: "POST /subscriptions/{subscriptionId}/reactivate"
        actor: "Member or Creator"
        preconditions:
          - "status == CANCELED"
          - "clock <= canceled_at + 30 days (win-back window)"    # temporal
          - "Publication.status == ACTIVE"                        # CROSS-ENTITY (Rule 7)
        side_effects:
          - "reactivation_count += 1, is_win_back = true"
          - "Create WIN_BACK invoice: discount_cents = win_back_discount(current tier), payment_status OPEN"
          - "Set current_period_start = clock, current_period_end = clock + 30 days, clear canceled_at"
          - "Recompute Publication.active_member_count, mrr_cents"

  - entity: Comment
    field: status
    initial_state: PENDING
    terminal_states: [REJECTED, HIDDEN]
    note: "Fork from PENDING into three moderator outcomes (branching, non-linear)."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /comments/{commentId}/moderate decision=APPROVE"
        actor: "Moderator or Creator"
        preconditions: ["status == PENDING"]
        side_effects: ["Recompute Post.approved_comment_count"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /comments/{commentId}/moderate decision=REJECT"
        actor: "Moderator or Creator"
        preconditions: ["status == PENDING"]
        side_effects: ["Set moderation_reason"]
      - from: PENDING
        to: HELD
        trigger: "POST /comments/{commentId}/moderate decision=HOLD"
        actor: "Moderator or Creator"
        preconditions: ["status == PENDING"]
        side_effects: ["Set moderation_reason"]
      - from: HELD
        to: APPROVED
        trigger: "POST /comments/{commentId}/moderate decision=APPROVE"
        actor: "Moderator or Creator"
        preconditions: ["status == HELD"]
        side_effects: ["Recompute Post.approved_comment_count"]
      - from: HELD
        to: REJECTED
        trigger: "POST /comments/{commentId}/moderate decision=REJECT"
        actor: "Moderator or Creator"
        preconditions: ["status == HELD"]
        side_effects: ["Set moderation_reason"]
      - from: APPROVED
        to: HIDDEN
        trigger: "POST /comments/{commentId}/moderate decision=HIDE"
        actor: "Moderator or Creator"
        preconditions: ["status == APPROVED"]
        side_effects: ["Recompute Post.approved_comment_count (decrement)"]

  - entity: EventRegistration
    field: status
    initial_state: REGISTERED
    terminal_states: [CANCELED]
    note: "Creation yields REGISTERED when available_slots > 0, else WAITLISTED (allow_waitlist), else ERR_EVENT_FULL. Seat conservation invariant maintained on every transition."
    transitions:
      - from: REGISTERED
        to: CANCELED
        trigger: "POST /registrations/{registrationId}/cancel, OR system cascade from Subscription cancel"
        actor: "Member or system"
        preconditions: ["status == REGISTERED"]
        side_effects:
          - "Event.registered_count -= 1, available_slots += 1 (seat invariant holds)"
          - "CASCADE: promote earliest-created (created_at ASC) WAITLISTED registration on this Event → REGISTERED"
      - from: WAITLISTED
        to: REGISTERED
        trigger: "system: promotion when a seat frees on the Event"
        actor: system
        preconditions: ["Event.available_slots > 0"]
        side_effects: ["Event.registered_count += 1, waitlist_count -= 1, available_slots -= 1"]
      - from: WAITLISTED
        to: CANCELED
        trigger: "POST /registrations/{registrationId}/cancel"
        actor: Member
        preconditions: ["status == WAITLISTED"]
        side_effects: ["Event.waitlist_count -= 1"]

  - entity: Payout
    field: status
    initial_state: REQUESTED
    terminal_states: [PAID, FAILED]
    note: "Branching settle: REQUESTED forks to PAID or FAILED with divergent money side effects (compensation on FAILED)."
    transitions:
      - from: REQUESTED
        to: PAID
        trigger: "POST /payouts/{payoutId}/settle outcome=PAID"
        actor: PlatformAdmin
        preconditions: ["status == REQUESTED"]
        side_effects:
          - "Publication.pending_payout_cents -= amount_cents; Publication.lifetime_paid_out_cents += amount_cents (payout_balance already debited at request)"
          - "Set settled_at = clock"
      - from: REQUESTED
        to: FAILED
        trigger: "POST /payouts/{payoutId}/settle outcome=FAILED"
        actor: PlatformAdmin
        preconditions: ["status == REQUESTED"]
        side_effects:
          - "COMPENSATION: Publication.pending_payout_cents -= amount_cents; Publication.payout_balance_cents += amount_cents (release hold; money invariant restored)"
          - "Set settled_at = clock"

  - entity: Publication
    field: status
    initial_state: ACTIVE
    terminal_states: []
    note: "Admin operational suspension; gates payout creation and subscription (re)activation (cross-entity)."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /publications/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["status == ACTIVE"]
        side_effects: ["Blocks new payouts and subscription TRIALING→ACTIVE / CANCELED→ACTIVE transitions"]

  - entity: Publication
    field: deliverability_status
    initial_state: HEALTHY
    terminal_states: []
    note: "Parallel state dimension on Publication (independent of status). Auto-transitions on bounce-rate breakpoints; reset restores HEALTHY."
    transitions:
      - from: HEALTHY
        to: THROTTLED
        trigger: "system: after POST /_email/bounce when 0.20 <= bounce_rate < 0.50"
        actor: system
        preconditions: []
        side_effects: ["Newsletter sends still allowed"]
      - from: [HEALTHY, THROTTLED]
        to: SUSPENDED
        trigger: "system: after POST /_email/bounce when bounce_rate >= 0.50"
        actor: system
        preconditions: []
        side_effects: ["POST /posts/{postId}/send blocked with ERR_DELIVERABILITY_SUSPENDED"]
      - from: [THROTTLED, SUSPENDED]
        to: HEALTHY
        trigger: "POST /publications/{id}/deliverability-reset"
        actor: "Creator or PlatformAdmin"
        preconditions: []
        side_effects: ["bounce_count = 0, sent_count = 0, bounce_rate = 0"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC — parent version)
# =============================================================================
concurrency_rules:
  - rule_id: payout-create-stale-publication
    parent_entity: Publication
    write_endpoint: "POST /publications/{id}/payouts"
    occ_field: "expected_publication_version"
    description: |
      Creating a Payout against a Publication whose version has advanced since the client
      last observed it is rejected. A payout legitimately draws down payout_balance_cents; if
      another payout (or a refund) has already moved the balance, the current writer's view of
      the publication — and therefore the available balance it is drawing against — is stale.
    error_id: ERR_STALE_PUBLICATION_VERSION
    http_status: 412
  - rule_id: change-tier-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{subscriptionId}/change-tier"
    occ_field: "expected_subscription_version"
    description: |
      Changing a Subscription's tier when its version has advanced since the client last read it
      is rejected. A prior change-tier legitimately supersedes the tier the current writer believes
      is in effect; proceeding would prorate against a stale base tier.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_amount_due
    trigger: "invoice creation (INITIAL, RENEWAL, PRORATION_UPGRADE, WIN_BACK)"
    algorithm: tiered_pricing
    formula: |
      base_price      = tier.monthly_price_cents            # tiered-rate selection by tier
      discount_cents  = (reason == WIN_BACK) ? win_back_discount(tier) : 0   # conditional branch on invoice reason
      net_after_disc  = max(0, base_price - discount_cents)  # nested max
      amount_due_cents = round_half_up(net_after_disc * proration_factor)
      # PRORATION_UPGRADE invoices instead carry gross_cents = delta_price and amount_due = provisional charge (see subscription_proration)
    input_set: "Single subscription's current tier at invoice creation time"
    constants:
      PERIOD_DAYS: 30
    precision: "integer cents, round_half_up"
    note: "Mode (a): >=3 inputs (base_price, discount, proration_factor) with conditional branch + nested max."

  - name: subscription_proration
    trigger: "POST /subscriptions/{id}/change-tier (provisional); period close / cancel (final)"
    algorithm: forward_looking
    formula: |
      period_days = 30
      delta_price = new_tier.monthly_price_cents - old_tier.monthly_price_cents
      # PROVISIONAL (forward-looking, at change time t):
      remaining_days_forward = whole days in [t, current_period_end]   # ceil of the day-difference
      provisional_factor = remaining_days_forward / period_days
      provisional_charge_cents = round_half_up(delta_price * provisional_factor)   # charge iff delta_price > 0
    input_set: "The changing subscription's current period window and the old/new tier prices"
    constants:
      PERIOD_DAYS: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "computed at change-tier time using remaining_days_forward = whole days from t to current_period_end"
        difference: "Bills the full remaining period as if the member keeps the new tier to period_end"
      - name: final
        when: "computed at period close (or at cancel) using actual_active_days = whole days the new tier was actually in effect before period_end or before canceled_at"
        difference: "final_charge_cents = round_half_up(delta_price * actual_active_days / period_days); diverges from provisional whenever the member cancels before current_period_end"
    note: "Rule 1 dual-variant on the SUBSCRIPTION domain (distinct from publication_revenue)."

  - name: platform_fee_and_creator_net
    trigger: "invoice transitions to PAID (payment SUCCEEDED)"
    algorithm: aggregation
    formula: |
      platform_fee_cents = round_half_up(invoice.amount_due_cents * publication.platform_fee_bps / 10000)
      creator_net_cents  = invoice.amount_due_cents - platform_fee_cents
      # Payout balance is credited per-invoice: round the fee for EACH invoice, then add creator_net_cents.
      # PINNED ORDER: round-per-invoice-then-sum. NEVER sum invoice amounts then take a single fee.
      Publication.lifetime_net_cents   += creator_net_cents
      Publication.payout_balance_cents += creator_net_cents
    input_set: "Each PAID invoice of the publication, summed individually"
    constants:
      BPS_DIVISOR: 10000
    precision: "integer cents, round_half_up per invoice"
    note: "Rule 2 mode (b): rounding order matters — two 1005-cent invoices at 1000 bps yield 1808 (per-invoice) vs 1809 (sum-then-fee)."

  - name: publication_revenue
    trigger: "any subscription status change, any invoice PAID/REFUNDED, GET /publications/{id}/analytics"
    algorithm: aggregation
    formula: |
      mrr_cents = sum( tier.monthly_price_cents ) over Subscriptions s
                    where s.status IN {ACTIVE, TRIALING}      # forward-looking, projects trials at full price
      recognized_revenue_cents = sum( invoice.creator_net_cents ) over Invoices i
                    where i.payment_status == PAID and i.paid_at <= clock   # chronological, only collected
    input_set: "All subscriptions (MRR) / all invoices (recognized) of the publication"
    constants: {}
    precision: "integer cents"
    variants:
      - name: mrr_forward_looking
        when: "dashboard projection"
        difference: "Counts ACTIVE + TRIALING recurring value; a TRIALING sub contributes full price though nothing is collected yet"
      - name: recognized_chronological
        when: "accounting / recognized revenue"
        difference: "Sums only creator_net of PAID invoices with paid_at <= clock; a TRIALING sub contributes 0"
    note: "Rule 1 dual-variant on the PUBLICATION domain (distinct from subscription_proration)."

  - name: bounce_rate_posture
    trigger: "POST /_email/bounce, POST /posts/{id}/send"
    algorithm: threshold
    formula: |
      bounce_rate = bounce_count / max(1, sent_count)
      deliverability_status =
        SUSPENDED if bounce_rate >= 0.50
        THROTTLED if 0.20 <= bounce_rate < 0.50
        HEALTHY   otherwise
    input_set: "Publication.bounce_count and Publication.sent_count"
    constants:
      WARN_RATE: 0.20
      SUSPEND_RATE: 0.50
    precision: "IEEE-754 double compare; boundary is inclusive (>=)"
    note: "Rule 6 boundary: bounce_rate == 0.50 exactly → SUSPENDED (>= not >)."

  - name: win_back_discount
    trigger: "reactivation (WIN_BACK invoice creation)"
    algorithm: threshold
    formula: |
      win_back_discount_cents = round_half_up(tier.monthly_price_cents * 0.20)
    input_set: "The reactivating subscription's current tier price"
    constants:
      WIN_BACK_PERCENT_OFF: 0.20
    precision: "integer cents, round_half_up"

  - name: event_seat_conservation
    trigger: "registration create, cancel, waitlist promotion"
    algorithm: aggregation
    formula: |
      INVARIANT (always, per Event): registered_count + available_slots == capacity
      available_slots = capacity - registered_count           # never negative
      registered_count = count(EventRegistration where event_id == Event.id and status == REGISTERED)
      waitlist_count   = count(EventRegistration where event_id == Event.id and status == WAITLISTED)
    input_set: "All registrations of one Event"
    constants: {}
    precision: "integer seats"
    note: "Rule 9 compensating invariant on the SEATS quantity (register ⊕ cancel leaves capacity unchanged)."

  - name: publication_money_conservation
    trigger: "invoice PAID/REFUNDED, payout request/settle"
    algorithm: aggregation
    formula: |
      INVARIANT (always, per Publication):
        payout_balance_cents + pending_payout_cents + lifetime_paid_out_cents == lifetime_net_cents
      Forward credit (invoice PAID): lifetime_net += net, payout_balance += net
      Compensation (invoice REFUNDED): lifetime_net -= net, payout_balance -= net
      Payout request: payout_balance -= amount, pending_payout += amount
      Payout settle PAID: pending_payout -= amount, lifetime_paid_out += amount
      Payout settle FAILED: pending_payout -= amount, payout_balance += amount
    input_set: "All PAID/REFUNDED invoices and all payouts of one Publication"
    constants: {}
    precision: "integer cents"
    note: "Rule 9 compensating invariant on the MONEY quantity (distinct conserved quantity from seats)."

  - name: post_recipient_count
    trigger: "POST /posts/{id}/send"
    algorithm: aggregation
    formula: |
      recipients = Members m of the publication where
        m.status == VERIFIED and m.email_bounced == false and
        EXISTS Subscription s (s.member_id == m.id, s.status IN {ACTIVE, TRIALING}, s.current_tier_rank >= post.min_tier_rank)
      recipient_count = count(recipients)
      Publication.sent_count += recipient_count
    input_set: "All members + their subscriptions of the publication at send time"
    constants: {}
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role (Creator|Member|Moderator|PlatformAdmin|Anonymous); X-User-ID present for non-Anonymous roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Ownership: Member acts only on own Subscription/EventRegistration/Comment (member_id == X-User-ID); Creator acts only on own Publication (creator_user_id == X-User-ID) and its children"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "member/creator-scoped mutations"
  - priority: 4
    category: existence
    check: "Path resources exist, validated left-to-right (publication, then post/event/subscription, then child)"
    error_id: "ERR_PUBLICATION_NOT_FOUND | ERR_TIER_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_POST_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_COMMENT_NOT_FOUND | ERR_PAYOUT_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 5
    category: business_constraint
    check: "Request body present, required fields present, types/enums valid, numeric ranges honored (e.g. amount_cents > 0, capacity >= 1, ends_at > starts_at, to_iso8601 valid ISO8601)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 6
    category: business_constraint
    check: "Uniqueness: member email unique per publication; tier_rank unique per publication"
    error_id: "ERR_EMAIL_TAKEN | ERR_TIER_RANK_TAKEN"
    http_status: 409
    applies_to: "POST members, POST tiers"
  - priority: 7
    category: state
    check: "Target resource is in a state that permits the operation (Subscription/Comment/Payout/EventRegistration state machine from-state); Publication.status == ACTIVE for payout create and (re)activation"
    error_id: "ERR_INVALID_STATE | ERR_ALREADY_REGISTERED | ERR_PUBLICATION_SUSPENDED"
    http_status: 409
    applies_to: "state-transition endpoints"
  - priority: 8
    category: business_referential
    check: "Member is VERIFIED before subscribing; chosen tier belongs to the member's publication"
    error_id: "ERR_MEMBER_NOT_VERIFIED | ERR_TIER_PUBLICATION_MISMATCH"
    http_status: 409
    applies_to: "POST /members/{id}/subscriptions, change-tier"
  - priority: 9
    category: business_safety
    check: "Content/community gating: reading gated content, commenting, or registering requires an ACTIVE subscription with current_tier_rank >= min_tier_rank; deliverability SUSPENDED blocks newsletter send"
    error_id: "ERR_SUBSCRIPTION_REQUIRED | ERR_TIER_TOO_LOW | ERR_DELIVERABILITY_SUSPENDED"
    http_status: "403 | 409"
    applies_to: "GET /posts/{id}/content, POST comments, POST registrations, POST /posts/{id}/send"
  - priority: 10
    category: business_temporal
    check: "Time-window rules: registration_closes_at not passed; win-back window (<= canceled_at + 30d); renew only when clock >= current_period_end; event schedule non-overlap; newsletter send-window non-overlap"
    error_id: "ERR_REGISTRATION_CLOSED | ERR_WINBACK_WINDOW_EXPIRED | ERR_PERIOD_NOT_ENDED | ERR_SCHEDULE_CONFLICT | ERR_SEND_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "registrations, reactivate, renew, send"
  - priority: 11
    category: business_constraint
    check: "Capacity: event at capacity with allow_waitlist == false rejects registration"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "POST /events/{id}/registrations"
  - priority: 12
    category: business_fiscal
    check: "Payout amount_cents <= Publication.payout_balance_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /publications/{id}/payouts"
  - priority: 13
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: "ERR_STALE_PUBLICATION_VERSION | ERR_STALE_SUBSCRIPTION_VERSION"
    http_status: 412
    applies_to: "POST /publications/{id}/payouts, POST /subscriptions/{id}/change-tier"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Publications ----
  - { method: POST, path: "/publications", description: "Create a publication (Creator becomes owner)", roles: [Creator], code: 201, input: [name, "platform_fee_bps?"], output: Publication, side_effects: ["creator_user_id = X-User-ID; status ACTIVE; deliverability HEALTHY"] }
  - { method: GET, path: "/publications/{id}", description: "Get publication", roles: [Anonymous, Member, Creator, Moderator, PlatformAdmin], code: 200, input: [], output: Publication, side_effects: [] }
  - { method: POST, path: "/publications/{id}/suspend", description: "Suspend a publication (platform ops)", roles: [PlatformAdmin], code: 200, input: [], output: Publication, side_effects: ["status → SUSPENDED"] }
  - { method: POST, path: "/publications/{id}/deliverability-reset", description: "Reset bounce counters and deliverability posture to HEALTHY", roles: [Creator, PlatformAdmin], code: 200, input: [], output: Publication, side_effects: ["bounce_count=0, sent_count=0, bounce_rate=0, deliverability_status → HEALTHY"] }
  - { method: GET, path: "/publications/{id}/analytics", description: "Computed analytics snapshot", roles: [Creator, PlatformAdmin], code: 200, input: [], output: Publication, side_effects: ["Recompute mrr_cents, recognized_revenue_cents, active_member_count, bounce_rate"] }

  # ---- Tiers ----
  - { method: POST, path: "/publications/{id}/tiers", description: "Create a subscription tier", roles: [Creator], code: 201, input: [name, tier_rank, monthly_price_cents, "trial_days?"], output: Tier, side_effects: ["is_free computed"] }
  - { method: GET, path: "/publications/{id}/tiers", description: "List tiers of a publication (FK reverse Tier→Publication)", roles: [Anonymous, Member, Creator, PlatformAdmin], code: 200, input: [], output: "Tier[]", side_effects: [] }

  # ---- Members ----
  - { method: POST, path: "/publications/{id}/members", description: "Register a member (self-signup or creator-added)", roles: [Anonymous, Creator], code: 201, input: [email, display_name], output: Member, side_effects: ["status PENDING; verification_token issued"] }
  - { method: GET, path: "/publications/{id}/members", description: "List members (FK reverse Member→Publication)", roles: [Creator, PlatformAdmin], code: 200, input: [], output: "Member[]", side_effects: [] }
  - { method: GET, path: "/members/{memberId}", description: "Get member", roles: [Member, Creator, PlatformAdmin], code: 200, input: [], output: Member, side_effects: [] }
  - { method: POST, path: "/members/{memberId}/verify", description: "Verify member email with token", roles: [Anonymous, Member], code: 200, input: [verification_token], output: Member, side_effects: ["status → VERIFIED"] }

  # ---- Subscriptions ----
  - { method: POST, path: "/members/{memberId}/subscriptions", description: "Create a subscription to a tier", roles: [Member, Creator], code: 201, input: [tier_id], output: Subscription, side_effects: ["free tier → ACTIVE; paid tier → TRIALING + INITIAL invoice; recompute active_member_count, mrr_cents"] }
  - { method: GET, path: "/subscriptions/{subscriptionId}", description: "Get subscription", roles: [Member, Creator, PlatformAdmin], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: GET, path: "/subscriptions", description: "List/filter subscriptions (FK reverse Subscription→Member and Subscription→Tier)", roles: [Member, Creator, PlatformAdmin], code: 200, input: ["member_id?", "tier_id?"], output: "Subscription[]", side_effects: [] }
  - { method: POST, path: "/subscriptions/{subscriptionId}/change-tier", description: "Change tier with proration (OCC on Subscription.version)", roles: [Member, Creator], code: 200, input: [new_tier_id, expected_subscription_version], output: Subscription, side_effects: ["PRORATION_UPGRADE invoice on upgrade; recompute current_tier_rank; increments Subscription.version by 1"] }
  - { method: POST, path: "/subscriptions/{subscriptionId}/cancel", description: "Cancel subscription (member churn or dunning)", roles: [Member, Creator], code: 200, input: ["reason?"], output: Subscription, side_effects: ["status → CANCELED; set canceled_at; cascade-cancel future event registrations + seat release + waitlist promote; recompute active_member_count, mrr_cents"] }
  - { method: POST, path: "/subscriptions/{subscriptionId}/reactivate", description: "Win-back reactivation within 30-day window", roles: [Member, Creator], code: 200, input: [], output: Subscription, side_effects: ["status → ACTIVE; reactivation_count++; is_win_back=true; WIN_BACK invoice with 20% discount; new period"] }
  - { method: POST, path: "/subscriptions/{subscriptionId}/renew", description: "Advance period and issue a RENEWAL invoice (clock >= current_period_end)", roles: [PlatformAdmin, Creator], code: 200, input: [], output: Subscription, side_effects: ["RENEWAL invoice OPEN; advance period window"] }

  # ---- Invoices & payments ----
  - { method: GET, path: "/invoices/{invoiceId}", description: "Get invoice", roles: [Member, Creator, PlatformAdmin], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/invoices", description: "List/filter invoices (FK reverse Invoice→Subscription)", roles: [Member, Creator, PlatformAdmin], code: 200, input: ["subscription_id?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/_payments/simulate", description: "Simulate a payment-gateway webhook outcome on an invoice", roles: [PlatformAdmin], code: 200, input: [invoice_id, outcome], output: Invoice, side_effects: ["SUCCEEDED → PAID (+ subscription transition + creator_net credit); FAILED → FAILED (+ subscription transition); REFUNDED → REFUNDED (debit creator_net)"] }

  # ---- Posts / newsletters ----
  - { method: POST, path: "/publications/{id}/posts", description: "Create a post or newsletter draft", roles: [Creator], code: 201, input: [title, body, "content_type?", "min_tier_rank?"], output: Post, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/publications/{id}/posts", description: "List posts (FK reverse Post→Publication)", roles: [Anonymous, Member, Creator, PlatformAdmin], code: 200, input: [], output: "Post[]", side_effects: [] }
  - { method: GET, path: "/posts/{postId}/content", description: "Read gated content body (enforces tier gating)", roles: [Member, Creator], code: 200, input: [], output: Post, side_effects: [] }
  - { method: POST, path: "/posts/{postId}/publish", description: "Publish a post", roles: [Creator], code: 200, input: [], output: Post, side_effects: ["status DRAFT → PUBLISHED"] }
  - { method: POST, path: "/posts/{postId}/send", description: "Send a newsletter to eligible members", roles: [Creator], code: 200, input: [], output: Post, side_effects: ["status → SENT; set send_window; recipient_count computed; Publication.sent_count += recipient_count; blocked when deliverability SUSPENDED or send-window overlaps"] }

  # ---- Events ----
  - { method: POST, path: "/publications/{id}/events", description: "Create an event", roles: [Creator], code: 201, input: [title, starts_at, ends_at, registration_closes_at, capacity, "min_tier_rank?", "allow_waitlist?"], output: Event, side_effects: ["status SCHEDULED; available_slots = capacity"] }
  - { method: GET, path: "/publications/{id}/events", description: "List events (FK reverse Event→Publication)", roles: [Anonymous, Member, Creator, PlatformAdmin], code: 200, input: [], output: "Event[]", side_effects: [] }
  - { method: POST, path: "/events/{eventId}/registrations", description: "Register the acting member for an event", roles: [Member], code: 201, input: [], output: EventRegistration, side_effects: ["REGISTERED if slot free else WAITLISTED (or ERR_EVENT_FULL); update Event seat counts"] }

  # ---- Registrations ----
  - { method: GET, path: "/registrations/{registrationId}", description: "Get registration", roles: [Member, Creator, PlatformAdmin], code: 200, input: [], output: EventRegistration, side_effects: [] }
  - { method: GET, path: "/registrations", description: "List/filter registrations (FK reverse EventRegistration→Event and →Member)", roles: [Member, Creator, PlatformAdmin], code: 200, input: ["event_id?", "member_id?"], output: "EventRegistration[]", side_effects: [] }
  - { method: POST, path: "/registrations/{registrationId}/cancel", description: "Cancel a registration (frees a seat, promotes waitlist)", roles: [Member], code: 200, input: [], output: EventRegistration, side_effects: ["status → CANCELED; seat release; waitlist promotion cascade"] }

  # ---- Comments ----
  - { method: POST, path: "/posts/{postId}/comments", description: "Post a comment (requires active gated subscription)", roles: [Member], code: 201, input: [body], output: Comment, side_effects: ["status PENDING"] }
  - { method: GET, path: "/comments/{commentId}", description: "Get comment", roles: [Anonymous, Member, Creator, Moderator, PlatformAdmin], code: 200, input: [], output: Comment, side_effects: [] }
  - { method: GET, path: "/comments", description: "List/filter comments (FK reverse Comment→Post and →Member)", roles: [Anonymous, Member, Creator, Moderator, PlatformAdmin], code: 200, input: ["post_id?", "member_id?"], output: "Comment[]", side_effects: [] }
  - { method: POST, path: "/comments/{commentId}/moderate", description: "Moderate a comment", roles: [Moderator, Creator], code: 200, input: [decision], output: Comment, side_effects: ["APPROVE|REJECT|HOLD|HIDE transitions; recompute Post.approved_comment_count"] }

  # ---- Payouts ----
  - { method: POST, path: "/publications/{id}/payouts", description: "Request a payout (OCC on Publication.version)", roles: [Creator], code: 201, input: [amount_cents, expected_publication_version], output: Payout, side_effects: ["status REQUESTED; payout_balance_cents -= amount; pending_payout_cents += amount; increments Publication.version by 1"] }
  - { method: GET, path: "/publications/{id}/payouts", description: "List payouts (FK reverse Payout→Publication)", roles: [Creator, PlatformAdmin], code: 200, input: [], output: "Payout[]", side_effects: [] }
  - { method: POST, path: "/payouts/{payoutId}/settle", description: "Settle a payout PAID or FAILED", roles: [PlatformAdmin], code: 200, input: [outcome], output: Payout, side_effects: ["PAID → move pending to paid_out; FAILED → release hold to balance"] }

  # ---- Test-driving (outside public business surface) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["logical clock set"] }
  - { method: POST, path: "/_email/bounce", description: "Record a hard email bounce for a member (deliverability simulation)", roles: [PlatformAdmin], code: 200, input: [member_id], output: Member, side_effects: ["Member.email_bounced=true, status BOUNCED; Publication.bounce_count += 1; recompute bounce_rate + deliverability posture"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role, or missing X-User-ID for a non-Anonymous role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member acts on another member's resource, or Creator acts on a publication they do not own" }
  - { id: ERR_PUBLICATION_NOT_FOUND, http: 404, condition: "publicationId does not exist" }
  - { id: ERR_TIER_NOT_FOUND, http: 404, condition: "tierId / tier_id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "memberId / member_id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscriptionId does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoiceId / invoice_id does not exist" }
  - { id: ERR_POST_NOT_FOUND, http: 404, condition: "postId does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "eventId does not exist" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "registrationId does not exist" }
  - { id: ERR_COMMENT_NOT_FOUND, http: 404, condition: "commentId does not exist" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "payoutId does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing/invalid body field, bad enum, out-of-range number, or bad ISO8601 (amount_cents<=0, capacity<1, ends_at<=starts_at)" }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "Member email already exists in this publication" }
  - { id: ERR_TIER_RANK_TAKEN, http: 409, condition: "tier_rank already used by another tier in this publication" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Operation not allowed from the resource's current state (state-machine from-state violated)" }
  - { id: ERR_ALREADY_REGISTERED, http: 409, condition: "Member already has a REGISTERED/WAITLISTED registration for this event" }
  - { id: ERR_PUBLICATION_SUSPENDED, http: 409, condition: "Publication.status == SUSPENDED blocks payout creation / subscription (re)activation" }
  - { id: ERR_MEMBER_NOT_VERIFIED, http: 409, condition: "Member must be VERIFIED before subscribing" }
  - { id: ERR_TIER_PUBLICATION_MISMATCH, http: 409, condition: "Chosen tier does not belong to the member's publication" }
  - { id: ERR_SUBSCRIPTION_REQUIRED, http: 403, condition: "Operation requires an ACTIVE subscription for the acting member" }
  - { id: ERR_TIER_TOO_LOW, http: 403, condition: "Member's current_tier_rank is below the required min_tier_rank" }
  - { id: ERR_DELIVERABILITY_SUSPENDED, http: 409, condition: "Publication deliverability_status == SUSPENDED blocks newsletter send" }
  - { id: ERR_REGISTRATION_CLOSED, http: 409, condition: "clock > event.registration_closes_at" }
  - { id: ERR_WINBACK_WINDOW_EXPIRED, http: 409, condition: "clock > canceled_at + 30 days on reactivate" }
  - { id: ERR_PERIOD_NOT_ENDED, http: 409, condition: "renew called before clock >= current_period_end" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Member already REGISTERED for another event whose [starts_at, ends_at] overlaps this one" }
  - { id: ERR_SEND_WINDOW_CONFLICT, http: 409, condition: "Newsletter send-window overlaps a prior send within the 60-minute throttle window" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "Event at capacity and allow_waitlist == false" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 402, condition: "Payout amount_cents exceeds Publication.payout_balance_cents" }
  - { id: ERR_STALE_PUBLICATION_VERSION, http: 412, condition: "expected_publication_version != Publication.version" }
  - { id: ERR_STALE_SUBSCRIPTION_VERSION, http: 412, condition: "expected_subscription_version != Subscription.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Creator
    description: "Owns a Publication and its content, tiers, members, events, payouts; can also moderate."
    identity: "opaque"
    exclusive_operations:
      - "POST /publications — create publication"
      - "POST /publications/{id}/tiers — create tier"
      - "POST /publications/{id}/posts — create post/newsletter"
      - "POST /posts/{id}/publish — publish post"
      - "POST /posts/{id}/send — send newsletter"
      - "POST /publications/{id}/events — create event"
      - "POST /publications/{id}/payouts — request payout"
      - "POST /publications/{id}/deliverability-reset — reset deliverability"
    shared_operations:
      - "POST /members/{id}/subscriptions, change-tier, cancel, reactivate (on behalf of member)"
      - "POST /comments/{id}/moderate (shared with Moderator)"
      - "GET publication/analytics/tiers/members/subscriptions/invoices/posts/events/registrations/comments/payouts"
  - name: Member
    description: "A subscriber acting on their own subscription, registrations and comments."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /events/{id}/registrations — register self"
      - "POST /registrations/{id}/cancel — cancel own registration"
      - "POST /posts/{id}/comments — comment"
      - "GET /posts/{id}/content — read gated content"
    shared_operations:
      - "POST /members/{id}/subscriptions, change-tier, cancel, reactivate (own subscription)"
      - "POST /members/{id}/verify"
      - "GET member/subscription/invoice/registration/comment reads"
  - name: Moderator
    description: "Community moderator; moderates comments."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /comments/{id}/moderate (shared with Creator)"
      - "GET comments"
  - name: PlatformAdmin
    description: "Platform operator; billing/payout settlement, publication suspension, deliverability/clock simulation."
    identity: "opaque"
    exclusive_operations:
      - "POST /publications/{id}/suspend"
      - "POST /_payments/simulate"
      - "POST /payouts/{id}/settle"
      - "POST /subscriptions/{id}/renew (shared with Creator)"
      - "POST /_clock/set_current_utc"
      - "POST /_email/bounce"
    shared_operations:
      - "GET reads across resources"
  - name: Anonymous
    description: "Unauthenticated visitor; self-signup, verification, and public reads."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /publications/{id}/members — self-signup (shared with Creator)"
      - "POST /members/{id}/verify (shared with Member)"
      - "GET publication/tiers/posts/events/comments public reads"
