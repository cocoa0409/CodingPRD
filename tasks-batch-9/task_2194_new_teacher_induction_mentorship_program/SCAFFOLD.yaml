# =============================================================================
# PRD Benchmark Scaffold — New-Teacher Induction & Mentorship Program
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2194. New-Teacher Induction & Mentorship Program (district induction program): mentor matching by subject/site & mentor stipend, required contact hours & log verification, observation cycle & feedback documentation, induction milestones tied to license advancement, cohort seminar attendance, mentor training & recertification, retention outcome tracking, program completion certification to state

domain_name: teacher-induction-mentorship

# Flat topology: every entity is its own top-level collection, so there is no
# single nesting root. All paths are rooted at "/" and children are discovered
# through filtered list endpoints (`GET /contact-logs?match_id=...`).
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer top-level collection linked by explicit foreign keys;
  # no entity id appears as a path prefix of another entity's collection.

  state_machine_shape: cyclic
  # ContactLog SUBMITTED->DISPUTED->SUBMITTED, Mentor CERTIFIED->LAPSED->CERTIFIED,
  # MentorMatch ACTIVE->SUSPENDED->ACTIVE, ObservationCycle feedback
  # SUBMITTED->RETURNED->SUBMITTED, MilestoneAttainment ATTAINED->REVOKED->IN_PROGRESS,
  # CompletionCertification SUBMITTED_TO_STATE->RETURNED->ASSEMBLING->SUBMITTED_TO_STATE.
  # NoviceTeacher additionally carries two independent state dimensions
  # (program_status x license_advancement_status).

  relationship_patterns:
    - one_to_many
    - many_to_many          # MentorMatch is a Mentor <-> NoviceTeacher junction
    - self_referential      # Milestone.prerequisite_milestone_id -> Milestone.id
    - cross_aggregate       # ContactLog void reaches MilestoneAttainment and CompletionCertification

  role_model: segregation_of_duties
  # The ProgramAdmin user that prepares a stipend draft may not approve it; the
  # SiteInductionLead that verified a novice's contact logs may not attest the
  # milestone built on those logs.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities / 57 endpoints / 34 error codes / 8 calculations (2 dual-variant
  # pairs on different domains) / 9 state machines (6 with cycles, 1 with
  # parallel dimensions) / 3 OCC rules.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: School site display name
        constraints: "1..120 chars"
      - name: site_code
        type: string
        source: input
        description: District-unique site code
        constraints: "uppercase alphanumeric, 3..10 chars, globally unique"
      - name: region_code
        type: string
        source: input
        description: District region the site belongs to; cohorts are region-scoped
        constraints: "one of {NORTH, SOUTH, EAST, WEST}"
      - name: status
        type: enum
        source: system
        description: Site operating status; CLOSED blocks new matches at this site
        default: OPEN
        constraints: "{OPEN, CLOSED}"
      - name: mentor_slot_cap
        type: integer
        source: input
        description: Maximum number of MentorMatch rows in match_status ACTIVE across all mentors of this site
        default: 6
        constraints: ">= 1 and <= 40"
      - name: active_match_count
        type: integer
        source: computed
        description: "Count of MentorMatch rows with match_status == ACTIVE whose mentor.site_id == this Site.id"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the site was closed; null while status == OPEN
        default: null

  - name: Mentor
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site whose novices this mentor may be matched to"
      - name: full_name
        type: string
        source: input
        description: Mentor display name
        constraints: "1..120 chars"
      - name: subject_endorsements
        type: array
        source: input
        description: Subject endorsements held by the mentor; drives subject_match_tier and auto-selection ranking
        constraints: "non-empty array; members from {MATH, SCIENCE, ELA, SOCIAL_STUDIES, SPED, WORLD_LANGUAGE, CTE}; no duplicates"
      - name: certification_status
        type: enum
        source: system
        description: Mentor training certification state machine value
        default: UNCERTIFIED
        constraints: "{UNCERTIFIED, CERTIFIED, LAPSED, SUSPENDED, RETIRED}"
      - name: certification_expires_on
        type: datetime
        source: system
        description: Logical-clock instant at which CERTIFIED lapses; null while UNCERTIFIED or RETIRED
        default: null
      - name: caseload_cap
        type: integer
        source: input
        description: Maximum simultaneous MentorMatch rows in match_status ACTIVE for this mentor
        default: 2
        constraints: ">= 1 and <= 4"
      - name: active_caseload_count
        type: integer
        source: computed
        description: "Count of MentorMatch rows with mentor_id == this Mentor.id and match_status == ACTIVE"
        default: 0
      - name: training_hours_current_cycle
        type: number
        source: computed
        description: Sum of hours posted to POST /mentors/{id}/training-credits since the last certification cycle reset
        default: 0
        constraints: "2 decimal places"
      - name: training_modules_current_cycle
        type: array
        source: computed
        description: Distinct module codes posted since the last certification cycle reset
        default: []
        constraints: "members from {FOUNDATIONS, OBSERVATION_PROTOCOL, EQUITY, RECERT_REFRESH}"
      - name: stipend_accrued_cents
        type: integer
        source: computed
        description: Provisional stipend accrual variant of mentor_stipend_gross_cents over SUBMITTED and VERIFIED logs
        default: 0
      - name: stipend_paid_cents
        type: integer
        source: computed
        description: "Sum of StipendDisbursement.net_cents for this mentor where status == PAID"
        default: 0
      - name: stipend_clawed_back_cents
        type: integer
        source: computed
        description: "Sum of StipendDisbursement.net_cents for this mentor where status == CLAWED_BACK"
        default: 0
      - name: verified_minutes_lifetime
        type: integer
        source: computed
        description: "Sum of ContactLog.credited_minutes over all matches of this mentor where verification_status == VERIFIED"
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded when certification_status became SUSPENDED; null otherwise
        default: null

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Cohort display name
        constraints: "1..120 chars"
      - name: program_year
        type: integer
        source: input
        description: Induction program year the cohort belongs to
        constraints: ">= 2020 and <= 2100"
      - name: region_code
        type: string
        source: input
        description: Region the cohort serves; novices may only enroll from sites in this region
        constraints: "one of {NORTH, SOUTH, EAST, WEST}"
      - name: seminar_sessions_required
        type: integer
        source: input
        description: Number of seminar sessions a novice of this cohort must have credited before a completion packet may be submitted
        default: 6
        constraints: ">= 1 and <= 24"
      - name: status
        type: enum
        source: system
        description: Cohort lifecycle state
        default: FORMING
        constraints: "{FORMING, RUNNING, CLOSED}"
      - name: enrolled_novice_count
        type: integer
        source: computed
        description: "Count of NoviceTeacher rows with cohort_id == this Cohort.id and program_status != WITHDRAWN"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the cohort closed; null while status != CLOSED
        default: null

  - name: NoviceTeacher
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site where the novice teaches"
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; the seminar cohort the novice is enrolled in"
      - name: full_name
        type: string
        source: input
        description: Novice teacher display name
        constraints: "1..120 chars"
      - name: subject_area
        type: enum
        source: input
        description: Primary teaching assignment; compared against Mentor.subject_endorsements to derive subject_match_tier
        constraints: "{MATH, SCIENCE, ELA, SOCIAL_STUDIES, SPED, WORLD_LANGUAGE, CTE}"
      - name: induction_year
        type: integer
        source: input
        description: Which year of the two-year induction program the novice is in
        constraints: "1 or 2"
      - name: license_stage
        type: enum
        source: system
        description: Current state license stage; advanced by ADVANCED license_advancement_status
        default: PRELIMINARY
        constraints: "{PRELIMINARY, PROVISIONAL, CLEAR}"
      - name: program_status
        type: enum
        source: system
        description: First independent state dimension — induction program participation lifecycle
        default: ENROLLED
        constraints: "{ENROLLED, MATCHED, ACTIVE, COMPLETION_PENDING, COMPLETED, WITHDRAWN}"
      - name: license_advancement_status
        type: enum
        source: system
        description: Second independent state dimension — license advancement readiness, evolves separately from program_status
        default: NOT_ELIGIBLE
        constraints: "{NOT_ELIGIBLE, ELIGIBLE, RECOMMENDED, ADVANCED}"
      - name: verified_contact_minutes
        type: integer
        source: computed
        description: "Sum of ContactLog.credited_minutes over all MentorMatch rows with novice_id == this NoviceTeacher.id where verification_status == VERIFIED"
        default: 0
      - name: documented_observation_cycles
        type: integer
        source: computed
        description: "Count of ObservationCycle rows on this novice's matches where phase == DOCUMENTED and feedback_review_status == ACCEPTED"
        default: 0
      - name: credited_seminar_sessions
        type: integer
        source: computed
        description: "Count of SeminarAttendance rows with novice_id == this NoviceTeacher.id where credited == true and the referenced SeminarSession.status == HELD"
        default: 0
      - name: attained_milestone_count
        type: integer
        source: computed
        description: "Count of MilestoneAttainment rows with novice_id == this NoviceTeacher.id where status == ATTAINED"
        default: 0
      - name: readiness_index_live
        type: number
        source: computed
        description: Live variant of novice_readiness_index computed from current counters
        default: 0
        constraints: "0.00..100.00, 2 decimal places"
      - name: readiness_index_snapshot
        type: number
        source: computed
        description: Snapshot variant of novice_readiness_index computed from the evidence frozen on the highest-sequence ATTAINED MilestoneAttainment
        default: 0
        constraints: "0.00..100.00, 2 decimal places"
      - name: retention_outcome
        type: enum
        source: system
        description: Retention tracking outcome recorded by the district
        default: UNKNOWN
        constraints: "{UNKNOWN, RETAINED_SAME_SITE, RETAINED_DISTRICT, LEFT_DISTRICT}"
      - name: retention_observed_on
        type: datetime
        source: system
        description: Logical-clock instant at which retention_outcome was recorded; null while UNKNOWN
        default: null
      - name: withdrawn_reason
        type: string
        source: system
        description: Reason recorded when program_status became WITHDRAWN; null otherwise
        default: null

  - name: MentorMatch
    parent: null
    common_fields: true
    fields:
      - name: mentor_id
        type: string
        source: system
        description: "FK -> Mentor.id; set from the request body when supplied, otherwise chosen by the mentor_auto_selection calculation"
      - name: novice_id
        type: string
        source: input
        description: "FK -> NoviceTeacher.id; the mentee side of the junction"
      - name: match_status
        type: enum
        source: system
        description: Match lifecycle state
        default: PROPOSED
        constraints: "{PROPOSED, ACTIVE, SUSPENDED, ENDED, REJECTED}"
      - name: selection_mode
        type: enum
        source: system
        description: EXPLICIT when the request named mentor_id, AUTO_SELECTED when mentor_auto_selection picked the mentor
        constraints: "{EXPLICIT, AUTO_SELECTED}"
      - name: subject_match_tier
        type: enum
        source: computed
        description: Subject affinity tier derived by subject_match_tier at creation from novice.subject_area and mentor.subject_endorsements
        constraints: "{EXACT, ADJACENT, CROSS}"
      - name: site_match
        type: boolean
        source: computed
        description: "True when mentor.site_id == novice.site_id at creation time"
      - name: pinned_stipend_rate_cents_per_hour
        type: integer
        source: system
        description: Hourly stipend rate pinned from subject_match_tier at the PROPOSED->ACTIVE transition; null while PROPOSED or REJECTED
        default: null
      - name: verified_minutes_total
        type: integer
        source: computed
        description: "Sum of ContactLog.credited_minutes for logs with match_id == this MentorMatch.id where verification_status == VERIFIED"
        default: 0
      - name: accrued_stipend_cents
        type: integer
        source: computed
        description: "Sum of ContactLog.stipend_cents for logs with match_id == this MentorMatch.id where verification_status == VERIFIED"
        default: 0
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant of the PROPOSED->ACTIVE transition; contact logs must not predate it
        default: null
      - name: suspended_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent ACTIVE->SUSPENDED transition
        default: null
      - name: ended_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into ENDED or REJECTED
        default: null
      - name: end_reason
        type: string
        source: system
        description: Reason recorded when the match entered ENDED or REJECTED; null otherwise
        default: null

  - name: ContactLog
    parent: null
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "FK -> MentorMatch.id; the mentoring relationship this contact occurred under"
      - name: contact_date
        type: datetime
        source: input
        description: Instant of the mentoring contact; the calendar date part groups logs for the daily credit cap
      - name: minutes
        type: integer
        source: input
        description: Raw contact minutes claimed by the mentor
        constraints: ">= 1 and <= 300"
      - name: contact_type
        type: enum
        source: input
        description: Kind of mentoring contact; selects the type weight in contact_log_credited_minutes
        constraints: "{ONE_ON_ONE, CO_PLANNING, MODEL_LESSON, DEBRIEF}"
      - name: description
        type: string
        source: input
        description: Narrative of what was covered during the contact
        constraints: ">= 20 chars and <= 1000 chars"
      - name: verification_status
        type: enum
        source: system
        description: Log verification state machine value
        default: SUBMITTED
        constraints: "{SUBMITTED, VERIFIED, DISPUTED, REJECTED, VOIDED}"
      - name: credited_minutes
        type: integer
        source: computed
        description: Minutes actually credited toward contact-hour requirements, produced by contact_log_credited_minutes at verification and reset to 0 on VOIDED
        default: 0
      - name: stipend_cents
        type: integer
        source: computed
        description: Per-log stipend cents produced by mentor_stipend_gross_cents at verification and reset to 0 on VOIDED
        default: 0
      - name: rate_tier_at_verification
        type: enum
        source: system
        description: subject_match_tier of the parent match pinned at the SUBMITTED->VERIFIED transition; null before verification
        default: null
        constraints: "{EXACT, ADJACENT, CROSS}"
      - name: cert_multiplier_at_verification
        type: number
        source: system
        description: Certification multiplier of the mentor pinned at the SUBMITTED->VERIFIED transition; null before verification
        default: null
        constraints: "1.00 or 0.50"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID captured at creation and at every resubmission; the segregation-of-duties check refuses a verification whose actor equals this value
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that verified the log; consumed by the milestone attestation segregation-of-duties check
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of the SUBMITTED->VERIFIED transition; decides disbursement-period membership
        default: null
      - name: dispute_reason
        type: string
        source: system
        description: Reason recorded on the SUBMITTED->DISPUTED transition
        default: null
      - name: reject_reason
        type: string
        source: system
        description: Reason recorded on the DISPUTED->REJECTED transition
        default: null
      - name: void_reason
        type: string
        source: system
        description: Reason recorded on the VERIFIED->VOIDED transition
        default: null
      - name: resubmit_count
        type: integer
        source: system
        description: Number of completed DISPUTED->SUBMITTED cycles on this log
        default: 0
        constraints: ">= 0 and <= 2"

  - name: ObservationCycle
    parent: null
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "FK -> MentorMatch.id; the mentoring relationship the observation cycle belongs to"
      - name: cycle_index
        type: integer
        source: input
        description: Ordinal of the cycle within the match; unique per match_id
        constraints: ">= 1 and <= 8; unique per match_id"
      - name: window_start
        type: datetime
        source: input
        description: Start of the classroom observation window; overlap geometry is evaluated on the mentor
      - name: window_end
        type: datetime
        source: input
        description: End of the classroom observation window
        constraints: "strictly after window_start; duration >= 30 and <= 240 minutes"
      - name: phase
        type: enum
        source: system
        description: First state dimension — observation cycle phase
        default: PRE_CONFERENCE
        constraints: "{PRE_CONFERENCE, OBSERVED, POST_CONFERENCE, DOCUMENTED, ABANDONED}"
      - name: feedback_review_status
        type: enum
        source: system
        description: Second state dimension — feedback documentation review status, cycles between SUBMITTED and RETURNED
        default: NONE
        constraints: "{NONE, DRAFT, SUBMITTED, RETURNED, ACCEPTED}"
      - name: narrative
        type: string
        source: system
        description: Feedback narrative written by the mentor via POST /observation-cycles/{id}/feedback
        default: null
        constraints: ">= 120 chars and <= 4000 chars when feedback_review_status is SUBMITTED or ACCEPTED"
      - name: growth_area_codes
        type: array
        source: system
        description: Growth-area codes selected by the mentor in the feedback document
        default: null
        constraints: "1..4 members from {PLANNING, INSTRUCTION, ENVIRONMENT, ASSESSMENT, EQUITY}"
      - name: rubric_scores
        type: object
        source: system
        description: Rubric scores keyed by planning, instruction, environment and assessment
        default: null
        constraints: "all four keys present, each integer 1..4"
      - name: composite_rubric_score
        type: number
        source: computed
        description: Mean of the four rubric_scores values produced by observation_composite_rubric_score
        default: null
        constraints: "1.00..4.00, 2 decimal places"
      - name: return_count
        type: integer
        source: system
        description: Number of completed SUBMITTED->RETURNED feedback review cycles
        default: 0
        constraints: ">= 0 and <= 3"
      - name: observed_at
        type: datetime
        source: system
        description: Logical-clock instant of the PRE_CONFERENCE->OBSERVED transition
        default: null
      - name: post_conference_at
        type: datetime
        source: system
        description: Logical-clock instant of the OBSERVED->POST_CONFERENCE transition
        default: null
      - name: documented_at
        type: datetime
        source: system
        description: Logical-clock instant of the POST_CONFERENCE->DOCUMENTED transition
        default: null
      - name: abandoned_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into ABANDONED
        default: null
      - name: return_reason
        type: string
        source: system
        description: Reason recorded on the most recent feedback SUBMITTED->RETURNED transition
        default: null

  - name: Milestone
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: Globally unique milestone code
        constraints: "uppercase snake, 3..40 chars, globally unique"
      - name: title
        type: string
        source: input
        description: Human-readable milestone title
        constraints: "1..160 chars"
      - name: sequence_index
        type: integer
        source: input
        description: Program ordering index; also the ranking key that picks the snapshot evidence row
        constraints: ">= 1 and <= 20; globally unique"
      - name: required_contact_minutes
        type: integer
        source: input
        description: Verified contact minutes a novice must hold for this milestone to be attainable
        constraints: ">= 0 and <= 100000"
      - name: required_observation_cycles
        type: integer
        source: input
        description: Documented and accepted observation cycles a novice must hold for this milestone to be attainable
        constraints: ">= 0 and <= 12"
      - name: required_credited_seminars
        type: integer
        source: input
        description: Credited seminar sessions a novice must hold for this milestone to be attainable
        constraints: ">= 0 and <= 24"
      - name: prerequisite_milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; milestone that must already be ATTAINED for this one; null for a root milestone"
        default: null
      - name: license_stage_unlocked
        type: enum
        source: input
        description: License stage the novice reaches when license advancement is granted on the strength of this milestone
        constraints: "{PRELIMINARY, PROVISIONAL, CLEAR}"
      - name: gates_license_recommendation
        type: boolean
        source: input
        description: When true, attaining this milestone drives license_advancement_status to RECOMMENDED and revoking it drives it back to NOT_ELIGIBLE
        default: false

  - name: MilestoneAttainment
    parent: null
    common_fields: true
    fields:
      - name: novice_id
        type: string
        source: input
        description: "FK -> NoviceTeacher.id; the novice whose progress this row tracks"
      - name: milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; the milestone definition being tracked"
      - name: status
        type: enum
        source: system
        description: Attainment state machine value
        default: LOCKED
        constraints: "{LOCKED, IN_PROGRESS, ATTAINED, REVOKED}"
      - name: evidence_note
        type: string
        source: input
        description: Narrative describing the evidence assembled for this milestone
        constraints: ">= 10 chars and <= 1000 chars"
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that moved the row to ATTAINED
        default: null
      - name: snapshot_contact_minutes
        type: integer
        source: system
        description: "NoviceTeacher.verified_contact_minutes frozen at the IN_PROGRESS->ATTAINED transition"
        default: null
      - name: snapshot_observation_cycles
        type: integer
        source: system
        description: "NoviceTeacher.documented_observation_cycles frozen at the IN_PROGRESS->ATTAINED transition"
        default: null
      - name: snapshot_credited_seminars
        type: integer
        source: system
        description: "NoviceTeacher.credited_seminar_sessions frozen at the IN_PROGRESS->ATTAINED transition"
        default: null
      - name: snapshot_held_sessions
        type: integer
        source: system
        description: "Count of HELD SeminarSession rows in the novice's cohort frozen at the IN_PROGRESS->ATTAINED transition"
        default: null
      - name: snapshot_excused_sessions
        type: integer
        source: system
        description: "Count of the novice's EXCUSED SeminarAttendance rows against HELD sessions frozen at the IN_PROGRESS->ATTAINED transition"
        default: null
      - name: attained_on
        type: datetime
        source: system
        description: Logical-clock instant of the IN_PROGRESS->ATTAINED transition
        default: null
      - name: revoked_on
        type: datetime
        source: system
        description: Logical-clock instant of the most recent ATTAINED->REVOKED transition
        default: null
      - name: revoke_reason
        type: string
        source: system
        description: Reason recorded on the ATTAINED->REVOKED transition
        default: null
      - name: revocation_count
        type: integer
        source: system
        description: Number of ATTAINED->REVOKED transitions this row has undergone
        default: 0
        constraints: ">= 0 and <= 3"

  - name: SeminarSession
    parent: null
    common_fields: true
    fields:
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; the cohort the seminar session belongs to"
      - name: session_index
        type: integer
        source: input
        description: Ordinal of the session within the cohort; unique per cohort_id
        constraints: ">= 1 and <= 24; unique per cohort_id"
      - name: topic
        type: string
        source: input
        description: Seminar topic
        constraints: "1..160 chars"
      - name: scheduled_start
        type: datetime
        source: input
        description: Session start; cohort schedule overlap uses half-open interval geometry on this field
      - name: scheduled_end
        type: datetime
        source: input
        description: Session end
        constraints: "strictly after scheduled_start; duration >= 30 and <= 240 minutes"
      - name: scheduled_minutes
        type: integer
        source: computed
        description: "Whole minutes between scheduled_start and scheduled_end; feeds the cohort weekly seminar minute cap"
      - name: status
        type: enum
        source: system
        description: Session lifecycle state
        default: SCHEDULED
        constraints: "{SCHEDULED, HELD, CANCELLED}"
      - name: credited_attendance_count
        type: integer
        source: computed
        description: "Count of SeminarAttendance rows with session_id == this SeminarSession.id where credited == true"
        default: 0
      - name: held_at
        type: datetime
        source: system
        description: Logical-clock instant of the SCHEDULED->HELD transition
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: Logical-clock instant of the SCHEDULED->CANCELLED transition
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded on the SCHEDULED->CANCELLED transition
        default: null

  - name: SeminarAttendance
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> SeminarSession.id; the seminar session attended"
      - name: novice_id
        type: string
        source: input
        description: "FK -> NoviceTeacher.id; the novice whose attendance is recorded"
      - name: attendance_status
        type: enum
        source: input
        description: Attendance classification; EXCUSED rows shrink the seminar denominator instead of the numerator
        constraints: "{PRESENT, LATE, ABSENT, EXCUSED}"
      - name: minutes_attended
        type: integer
        source: input
        description: Raw minutes the novice was present
        constraints: ">= 0 and <= 480"
      - name: credit_ratio
        type: number
        source: computed
        description: Effective attended minutes divided by the session's scheduled_minutes, produced by seminar_attendance_credit
        constraints: "4 decimal places"
      - name: credited
        type: boolean
        source: computed
        description: True when attendance_status is PRESENT or LATE and credit_ratio >= 0.75
        default: false
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that recorded the attendance row

  - name: StipendDisbursement
    parent: null
    common_fields: true
    fields:
      - name: mentor_id
        type: string
        source: input
        description: "FK -> Mentor.id; the mentor being paid"
      - name: period_code
        type: string
        source: input
        description: Payment period label
        constraints: "matches ^[0-9]{4}-Q[1-4]$; unique per mentor_id among rows with status in {DRAFT, APPROVED, PAID}"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive lower bound of the verification window used by the final_disbursement variant
      - name: period_end
        type: datetime
        source: input
        description: Inclusive upper bound of the verification window; must not be after the logical clock
        constraints: "strictly after period_start"
      - name: status
        type: enum
        source: system
        description: Disbursement lifecycle state
        default: DRAFT
        constraints: "{DRAFT, APPROVED, PAID, CLAWED_BACK, SUPERSEDED}"
      - name: gross_cents
        type: integer
        source: computed
        description: final_disbursement variant of mentor_stipend_gross_cents over VERIFIED logs whose verified_at falls in the period
        default: 0
      - name: adjustment_cents
        type: integer
        source: input
        description: Manual adjustment applied to gross_cents; may be negative
        default: 0
        constraints: ">= -500000 and <= 500000"
      - name: net_cents
        type: integer
        source: computed
        description: "gross_cents + adjustment_cents"
        default: 0
      - name: eligible_log_count
        type: integer
        source: computed
        description: "Count of ContactLog rows that entered the final_disbursement input set for this period"
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that created the draft; must differ from approved_by_user_id
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that approved the draft
        default: null
      - name: payment_reference
        type: string
        source: system
        description: External payment reference recorded on the APPROVED->PAID transition
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant of the APPROVED->PAID transition
        default: null
      - name: clawed_back_at
        type: datetime
        source: system
        description: Logical-clock instant of the PAID->CLAWED_BACK transition
        default: null
      - name: clawback_reason
        type: string
        source: system
        description: Reason recorded on the PAID->CLAWED_BACK transition
        default: null
      - name: superseded_by_id
        type: string
        source: system
        description: Id of the later DRAFT that superseded this row; null unless status == SUPERSEDED
        default: null

  - name: CompletionCertification
    parent: null
    common_fields: true
    fields:
      - name: novice_id
        type: string
        source: input
        description: "FK -> NoviceTeacher.id; the novice whose induction completion is being certified to the state"
      - name: packet_status
        type: enum
        source: system
        description: State certification packet lifecycle
        default: ASSEMBLING
        constraints: "{ASSEMBLING, SUBMITTED_TO_STATE, ACCEPTED, RETURNED, WITHDRAWN}"
      - name: base_score
        type: number
        source: computed
        description: Step-2 output of completion_certification_score; the tier lookup for retention_bonus reads this field, never completion_score
        default: 0
        constraints: "0.00..100.00, 2 decimal places"
      - name: retention_bonus
        type: number
        source: computed
        description: Step-3 output of completion_certification_score, keyed on base_score tier and retention_outcome
        default: 0
        constraints: "one of 0.00, 2.50, 5.00"
      - name: completion_score
        type: number
        source: computed
        description: "Step-4 output of completion_certification_score: min(100.00, base_score + retention_bonus)"
        default: 0
        constraints: "0.00..100.00, 2 decimal places"
      - name: evidence_milestone_count
        type: integer
        source: computed
        description: "Count of MilestoneAttainment rows for this novice with status == ATTAINED at score computation time"
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that submitted the packet to the state
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the ASSEMBLING->SUBMITTED_TO_STATE transition
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the StateCredentialingOfficer that accepted or returned the packet
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the state decision
        default: null
      - name: state_file_number
        type: string
        source: system
        description: State-issued file number recorded on ACCEPTED
        default: null
      - name: return_reason
        type: string
        source: system
        description: Reason recorded on any transition into RETURNED, including cascaded evidence revocation
        default: null
      - name: resubmission_count
        type: integer
        source: system
        description: Number of RETURNED->ASSEMBLING transitions this packet has undergone
        default: 0
        constraints: ">= 0 and <= 2"
      - name: withdrawn_reason
        type: string
        source: system
        description: Reason recorded on the transition into WITHDRAWN
        default: null

# =============================================================================
# §1.2 State Machine Table
# NoviceTeacher and ObservationCycle each carry TWO independent state
# dimensions; each dimension is declared as its own block with `state_field`.
# =============================================================================
state_machines:
  - entity: Mentor
    state_field: certification_status
    initial_state: UNCERTIFIED
    terminal_states: [RETIRED]
    transitions:
      - from: UNCERTIFIED
        to: CERTIFIED
        trigger: "POST /mentors/{id}/certification with action=CERTIFY"
        actor: ProgramAdmin
        preconditions:
          - "mentor.certification_status == UNCERTIFIED"
          - "mentor.training_hours_current_cycle >= 18.00"
          - "{FOUNDATIONS, OBSERVATION_PROTOCOL, EQUITY} is a subset of mentor.training_modules_current_cycle"
        side_effects:
          - "sets Mentor.certification_expires_on = clock_now + 365 days"
          - "resets Mentor.training_hours_current_cycle to 0 and Mentor.training_modules_current_cycle to []"
          - "clears Mentor.suspension_reason to null"
          - "increments Mentor.version by 1"
      - from: CERTIFIED
        to: LAPSED
        trigger: "POST /_clock/set_current_utc moving the logical clock strictly past Mentor.certification_expires_on (system lapse sweep, mentors processed created_at ASC)"
        actor: system
        preconditions:
          - "mentor.certification_status == CERTIFIED"
          - "clock_now > mentor.certification_expires_on"
        side_effects:
          - "CASCADE hop 1: every MentorMatch with mentor_id == this Mentor.id and match_status == ACTIVE transitions ACTIVE->SUSPENDED, processed created_at ASC"
          - "increments Mentor.version by 1"
        note: "Hop 1 of the mentor-certification cascade; hop 2 and hop 3 are declared on MentorMatch ACTIVE->SUSPENDED and ObservationCycle *->ABANDONED."
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /mentors/{id}/certification with action=SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "mentor.certification_status == CERTIFIED"
          - "request body supplies reason"
        side_effects:
          - "sets Mentor.suspension_reason from the request reason"
          - "CASCADE hop 1: every MentorMatch with mentor_id == this Mentor.id and match_status == ACTIVE transitions ACTIVE->SUSPENDED, processed created_at ASC"
          - "increments Mentor.version by 1"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /mentors/{id}/certification with action=REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "mentor.certification_status == SUSPENDED"
          - "clock_now <= mentor.certification_expires_on"
        side_effects:
          - "clears Mentor.suspension_reason to null"
          - "REACTIVATION CASCADE: MentorMatch rows with mentor_id == this Mentor.id and match_status == SUSPENDED are processed created_at ASC and each transitions SUSPENDED->ACTIVE while its own preconditions hold; rows whose preconditions fail (caseload cap reached, site CLOSED, novice program_status not in {MATCHED, ACTIVE}) stay SUSPENDED"
          - "increments Mentor.version by 1"
      - from: LAPSED
        to: CERTIFIED
        trigger: "POST /mentors/{id}/certification with action=RECERTIFY"
        actor: ProgramAdmin
        preconditions:
          - "mentor.certification_status == LAPSED"
          - "mentor.training_hours_current_cycle >= 6.00"
          - "RECERT_REFRESH is a member of mentor.training_modules_current_cycle"
        side_effects:
          - "sets Mentor.certification_expires_on = clock_now + 365 days"
          - "resets Mentor.training_hours_current_cycle to 0 and Mentor.training_modules_current_cycle to []"
          - "REACTIVATION CASCADE: identical to the SUSPENDED->CERTIFIED reactivation cascade, matches processed created_at ASC"
          - "increments Mentor.version by 1"
        note: "Closes the CERTIFIED -> LAPSED -> CERTIFIED cycle."
      - from: SUSPENDED
        to: LAPSED
        trigger: "POST /_clock/set_current_utc moving the logical clock strictly past Mentor.certification_expires_on (system lapse sweep)"
        actor: system
        preconditions:
          - "mentor.certification_status == SUSPENDED"
          - "clock_now > mentor.certification_expires_on"
        side_effects:
          - "increments Mentor.version by 1"
        note: "No match cascade fires: every match of a SUSPENDED mentor is already SUSPENDED or terminal."
      - from: CERTIFIED
        to: RETIRED
        trigger: "POST /mentors/{id}/certification with action=RETIRE"
        actor: ProgramAdmin
        preconditions:
          - "mentor.certification_status IN {UNCERTIFIED, CERTIFIED, LAPSED, SUSPENDED}"
          - "no MentorMatch exists with mentor_id == this Mentor.id and match_status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "sets Mentor.certification_expires_on = null"
          - "every MentorMatch with mentor_id == this Mentor.id and match_status == SUSPENDED transitions SUSPENDED->ENDED with end_reason 'MENTOR_RETIRED', processed created_at ASC"
          - "increments Mentor.version by 1"
        note: "The same transition is available from UNCERTIFIED, LAPSED and SUSPENDED with identical preconditions and side effects."
      - from: LAPSED
        to: RETIRED
        trigger: "POST /mentors/{id}/certification with action=RETIRE"
        actor: ProgramAdmin
        preconditions:
          - "mentor.certification_status == LAPSED"
          - "no MentorMatch exists with mentor_id == this Mentor.id and match_status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "sets Mentor.certification_expires_on = null"
          - "every MentorMatch with mentor_id == this Mentor.id and match_status == SUSPENDED transitions SUSPENDED->ENDED with end_reason 'MENTOR_RETIRED', processed created_at ASC"
          - "increments Mentor.version by 1"

  - entity: Cohort
    state_field: status
    initial_state: FORMING
    terminal_states: [CLOSED]
    transitions:
      - from: FORMING
        to: RUNNING
        trigger: "POST /seminar-sessions/{id}/status with status=HELD on a session of this cohort (bubble-up)"
        actor: system
        preconditions:
          - "cohort.status == FORMING"
        side_effects:
          - "increments Cohort.version by 1"
      - from: RUNNING
        to: CLOSED
        trigger: "POST /cohorts/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "cohort.status IN {FORMING, RUNNING}"
          - "no SeminarSession with cohort_id == this Cohort.id has status == SCHEDULED"
        side_effects:
          - "sets Cohort.closed_at = clock_now"
          - "increments Cohort.version by 1"
      - from: FORMING
        to: CLOSED
        trigger: "POST /cohorts/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "cohort.status == FORMING"
          - "no SeminarSession with cohort_id == this Cohort.id has status == SCHEDULED"
        side_effects:
          - "sets Cohort.closed_at = clock_now"
          - "increments Cohort.version by 1"

  - entity: NoviceTeacher
    state_field: program_status
    initial_state: ENROLLED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: MATCHED
        trigger: "POST /mentor-matches creating a MentorMatch whose novice_id is this novice (bubble-up)"
        actor: system
        preconditions:
          - "novice.program_status == ENROLLED"
        side_effects:
          - "increments NoviceTeacher.version by 1"
      - from: MATCHED
        to: ENROLLED
        trigger: "POST /mentor-matches/{id}/disposition with decision=REJECT (bubble-up revert)"
        actor: system
        preconditions:
          - "novice.program_status == MATCHED"
          - "after the rejection, no MentorMatch with novice_id == this novice has match_status IN {PROPOSED, ACTIVE, SUSPENDED}"
        side_effects:
          - "increments NoviceTeacher.version by 1"
        note: "Closes the ENROLLED -> MATCHED -> ENROLLED revision cycle."
      - from: MATCHED
        to: ACTIVE
        trigger: "POST /mentor-matches/{id}/disposition with decision=ACTIVATE on a match of this novice (bubble-up)"
        actor: system
        preconditions:
          - "novice.program_status == MATCHED"
        side_effects:
          - "increments NoviceTeacher.version by 1"
      - from: ACTIVE
        to: COMPLETION_PENDING
        trigger: "POST /completion-certifications creating a packet for this novice (bubble-up)"
        actor: system
        preconditions:
          - "novice.program_status == ACTIVE"
        side_effects:
          - "increments NoviceTeacher.version by 1"
      - from: COMPLETION_PENDING
        to: COMPLETED
        trigger: "POST /completion-certifications/{id}/state-decision with decision=ACCEPT (bubble-up)"
        actor: system
        preconditions:
          - "novice.program_status == COMPLETION_PENDING"
          - "novice.license_advancement_status == RECOMMENDED"
        side_effects:
          - "NoviceTeacher.license_advancement_status transitions RECOMMENDED->ADVANCED and NoviceTeacher.license_stage is set to CLEAR"
          - "every MentorMatch with novice_id == this novice and match_status IN {ACTIVE, SUSPENDED} transitions to ENDED with end_reason 'PROGRAM_COMPLETED', processed created_at ASC"
          - "increments NoviceTeacher.version by 1"
      - from: COMPLETION_PENDING
        to: ACTIVE
        trigger: "POST /completion-certifications/{id}/state-decision with decision=RETURN, or POST /completion-certifications/{id}/transition with action=WITHDRAW (bubble-up)"
        actor: system
        preconditions:
          - "novice.program_status == COMPLETION_PENDING"
        side_effects:
          - "increments NoviceTeacher.version by 1"
        note: "Closes the ACTIVE -> COMPLETION_PENDING -> ACTIVE cycle; a REOPEN of the packet drives ACTIVE -> COMPLETION_PENDING again."
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /novice-teachers/{id}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "novice.program_status IN {ENROLLED, MATCHED, ACTIVE, COMPLETION_PENDING}"
        side_effects:
          - "sets NoviceTeacher.withdrawn_reason from the request reason"
          - "every MentorMatch with novice_id == this novice and match_status == PROPOSED transitions to REJECTED with end_reason 'NOVICE_WITHDRAWN'; every match with match_status IN {ACTIVE, SUSPENDED} transitions to ENDED with end_reason 'NOVICE_WITHDRAWN'; processed created_at ASC"
          - "every ObservationCycle on those matches with phase IN {PRE_CONFERENCE, OBSERVED, POST_CONFERENCE} transitions to ABANDONED"
          - "every CompletionCertification with novice_id == this novice and packet_status IN {ASSEMBLING, SUBMITTED_TO_STATE, RETURNED} transitions to WITHDRAWN with withdrawn_reason 'NOVICE_WITHDRAWN'"
          - "increments NoviceTeacher.version by 1"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /novice-teachers/{id}/withdraw"
        actor: ProgramAdmin
        preconditions:
          - "novice.program_status == ENROLLED"
        side_effects:
          - "sets NoviceTeacher.withdrawn_reason from the request reason"
          - "increments NoviceTeacher.version by 1"
        note: "MATCHED->WITHDRAWN and COMPLETION_PENDING->WITHDRAWN carry the same preconditions and the same cascade as ACTIVE->WITHDRAWN."

  - entity: NoviceTeacher
    state_field: license_advancement_status
    initial_state: NOT_ELIGIBLE
    terminal_states: [ADVANCED]
    transitions:
      - from: NOT_ELIGIBLE
        to: ELIGIBLE
        trigger: "any recomputation of novice_readiness_index — POST /contact-logs/{id}/review with decision=VERIFY, POST /observation-cycles/{id}/feedback-review with decision=ACCEPT, POST /seminar-attendances, POST /seminar-sessions/{id}/status, POST /contact-logs/{id}/void"
        actor: system
        preconditions:
          - "novice.license_advancement_status == NOT_ELIGIBLE"
          - "novice.readiness_index_live >= 85.00 after the recomputation"
        side_effects:
          - "increments NoviceTeacher.version by 1"
      - from: ELIGIBLE
        to: NOT_ELIGIBLE
        trigger: "any recomputation of novice_readiness_index that leaves readiness_index_live < 85.00, e.g. POST /contact-logs/{id}/void"
        actor: system
        preconditions:
          - "novice.license_advancement_status == ELIGIBLE"
          - "novice.readiness_index_live < 85.00 after the recomputation"
        side_effects:
          - "increments NoviceTeacher.version by 1"
      - from: ELIGIBLE
        to: RECOMMENDED
        trigger: "POST /milestone-attainments/{id}/decision with decision=ATTAIN on a Milestone whose gates_license_recommendation == true (bubble-up)"
        actor: system
        preconditions:
          - "novice.license_advancement_status == ELIGIBLE"
        side_effects:
          - "sets NoviceTeacher.license_stage = milestone.license_stage_unlocked"
          - "increments NoviceTeacher.version by 1"
      - from: RECOMMENDED
        to: NOT_ELIGIBLE
        trigger: "a MilestoneAttainment on a Milestone whose gates_license_recommendation == true leaving ATTAINED — POST /milestone-attainments/{id}/decision with decision=REVOKE, or CASCADE hop 3 of POST /contact-logs/{id}/void"
        actor: system
        preconditions:
          - "novice.license_advancement_status == RECOMMENDED"
        side_effects:
          - "reverts NoviceTeacher.license_stage to PRELIMINARY, undoing the ELIGIBLE->RECOMMENDED stage grant"
          - "CASCADE hop 4: every CompletionCertification with novice_id == this novice and packet_status == SUBMITTED_TO_STATE transitions SUBMITTED_TO_STATE->RETURNED with return_reason 'EVIDENCE_REVOKED'"
          - "increments NoviceTeacher.version by 1"
        note: "Closes the ELIGIBLE -> RECOMMENDED -> NOT_ELIGIBLE -> ELIGIBLE cycle and carries hop 3 and hop 4 of the contact-log void cascade."
      - from: RECOMMENDED
        to: ADVANCED
        trigger: "POST /completion-certifications/{id}/state-decision with decision=ACCEPT (bubble-up from program_status COMPLETION_PENDING->COMPLETED)"
        actor: system
        preconditions:
          - "novice.license_advancement_status == RECOMMENDED"
          - "novice.program_status transitions COMPLETION_PENDING->COMPLETED in the same request"
        side_effects:
          - "sets NoviceTeacher.license_stage = CLEAR"
          - "increments NoviceTeacher.version by 1"

  - entity: MentorMatch
    state_field: match_status
    initial_state: PROPOSED
    terminal_states: [ENDED, REJECTED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /mentor-matches/{id}/disposition with decision=ACTIVATE"
        actor: ProgramAdmin
        preconditions:
          - "match.match_status == PROPOSED"
          - "mentor.certification_status == CERTIFIED (cross-entity gate on Mentor)"
          - "Site.status == OPEN for the site identified by mentor.site_id"
          - "mentor.active_caseload_count < mentor.caseload_cap"
          - "Site.active_match_count < Site.mentor_slot_cap for mentor.site_id"
          - "novice.program_status == MATCHED"
        side_effects:
          - "sets MentorMatch.activated_at = clock_now"
          - "sets MentorMatch.pinned_stipend_rate_cents_per_hour from subject_match_tier: EXACT->4200, ADJACENT->3600, CROSS->2800"
          - "increments Mentor.active_caseload_count by 1 and Site.active_match_count by 1"
          - "NoviceTeacher.program_status transitions MATCHED->ACTIVE"
          - "increments MentorMatch.version, Mentor.version, Site.version and NoviceTeacher.version by 1 each"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /mentor-matches/{id}/disposition with decision=REJECT"
        actor: ProgramAdmin
        preconditions:
          - "match.match_status == PROPOSED"
          - "request body supplies reason"
        side_effects:
          - "sets MentorMatch.ended_at = clock_now and MentorMatch.end_reason from the request reason"
          - "NoviceTeacher.program_status transitions MATCHED->ENROLLED when no other match of the novice remains in {PROPOSED, ACTIVE, SUSPENDED}"
          - "increments MentorMatch.version and NoviceTeacher.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "CASCADE hop 1 of a Mentor certification leaving CERTIFIED — POST /mentors/{id}/certification with action=SUSPEND, or the POST /_clock/set_current_utc lapse sweep"
        actor: system
        preconditions:
          - "match.match_status == ACTIVE"
          - "mentor.certification_status leaves CERTIFIED in the same request"
        side_effects:
          - "sets MentorMatch.suspended_at = clock_now"
          - "decrements Mentor.active_caseload_count by 1 and Site.active_match_count by 1"
          - "CASCADE hop 2: every ObservationCycle with match_id == this match and phase IN {PRE_CONFERENCE, OBSERVED, POST_CONFERENCE} transitions to ABANDONED, processed cycle_index ASC"
          - "increments MentorMatch.version, Mentor.version and Site.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "REACTIVATION CASCADE of POST /mentors/{id}/certification with action=RECERTIFY or action=REINSTATE (matches processed created_at ASC)"
        actor: system
        preconditions:
          - "match.match_status == SUSPENDED"
          - "mentor.certification_status becomes CERTIFIED in the same request"
          - "Site.status == OPEN for mentor.site_id"
          - "novice.program_status IN {MATCHED, ACTIVE}"
          - "mentor.active_caseload_count < mentor.caseload_cap at the moment this match is processed"
          - "Site.active_match_count < Site.mentor_slot_cap at the moment this match is processed"
        side_effects:
          - "sets MentorMatch.suspended_at = null"
          - "increments Mentor.active_caseload_count by 1 and Site.active_match_count by 1"
          - "increments MentorMatch.version, Mentor.version and Site.version by 1"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE cycle. Matches whose preconditions fail stay SUSPENDED (conditional cascade)."
      - from: ACTIVE
        to: ENDED
        trigger: "POST /mentor-matches/{id}/disposition with decision=END"
        actor: ProgramAdmin
        preconditions:
          - "match.match_status IN {PROPOSED, ACTIVE, SUSPENDED}"
          - "no ContactLog with match_id == this match has verification_status IN {SUBMITTED, DISPUTED}"
          - "request body supplies reason"
        side_effects:
          - "sets MentorMatch.ended_at = clock_now and MentorMatch.end_reason from the request reason"
          - "decrements Mentor.active_caseload_count by 1 and Site.active_match_count by 1"
          - "every ObservationCycle with match_id == this match and phase IN {PRE_CONFERENCE, OBSERVED, POST_CONFERENCE} transitions to ABANDONED, processed cycle_index ASC"
          - "increments MentorMatch.version, Mentor.version and Site.version by 1"
      - from: SUSPENDED
        to: ENDED
        trigger: "POST /mentor-matches/{id}/disposition with decision=END, POST /mentors/{id}/certification with action=RETIRE, POST /novice-teachers/{id}/withdraw, or the COMPLETION_PENDING->COMPLETED bubble-up"
        actor: ProgramAdmin
        preconditions:
          - "match.match_status == SUSPENDED"
          - "no ContactLog with match_id == this match has verification_status IN {SUBMITTED, DISPUTED}"
        side_effects:
          - "sets MentorMatch.ended_at = clock_now and MentorMatch.end_reason"
          - "leaves Mentor.active_caseload_count and Site.active_match_count unchanged because a SUSPENDED match does not occupy a slot"
          - "increments MentorMatch.version by 1"

  - entity: ContactLog
    state_field: verification_status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /contact-logs/{id}/review with decision=VERIFY"
        actor: NoviceTeacher
        preconditions:
          - "log.verification_status == SUBMITTED"
          - "match.match_status == ACTIVE (cross-entity gate on MentorMatch)"
          - "the day_room term of contact_log_credited_minutes is > 0"
          - "when the actor role is SiteInductionLead, X-User-ID == novice.site_id"
        side_effects:
          - "sets ContactLog.credited_minutes from contact_log_credited_minutes"
          - "pins ContactLog.rate_tier_at_verification = match.subject_match_tier and ContactLog.cert_multiplier_at_verification = 1.00 when mentor.certification_status == CERTIFIED else 0.50"
          - "sets ContactLog.stipend_cents from the per-log step of mentor_stipend_gross_cents"
          - "sets ContactLog.verified_by_user_id = X-User-ID and ContactLog.verified_at = clock_now"
          - "recomputes MentorMatch.verified_minutes_total and MentorMatch.accrued_stipend_cents"
          - "recomputes Mentor.verified_minutes_lifetime and Mentor.stipend_accrued_cents"
          - "recomputes NoviceTeacher.verified_contact_minutes, NoviceTeacher.readiness_index_live and NoviceTeacher.readiness_index_snapshot"
          - "may drive NoviceTeacher.license_advancement_status NOT_ELIGIBLE->ELIGIBLE"
          - "increments ContactLog.version, MentorMatch.version, Mentor.version and NoviceTeacher.version by 1 each"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /contact-logs/{id}/review with decision=DISPUTE"
        actor: NoviceTeacher
        preconditions:
          - "log.verification_status == SUBMITTED"
          - "request body supplies note"
        side_effects:
          - "sets ContactLog.dispute_reason from the request reason"
          - "increments ContactLog.version by 1"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /contact-logs/{id}/resubmit"
        actor: Mentor
        preconditions:
          - "log.verification_status == DISPUTED"
          - "X-User-ID == match.mentor_id"
          - "log.resubmit_count < 2"
        side_effects:
          - "replaces ContactLog.minutes, ContactLog.contact_type and ContactLog.description from the request body"
          - "increments ContactLog.resubmit_count by 1 and clears ContactLog.dispute_reason to null"
          - "increments ContactLog.version by 1"
        note: "Closes the SUBMITTED -> DISPUTED -> SUBMITTED revision cycle; at most two resubmissions."
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /contact-logs/{id}/review with decision=REJECT"
        actor: SiteInductionLead
        preconditions:
          - "log.verification_status == DISPUTED"
          - "when the actor role is SiteInductionLead, X-User-ID == novice.site_id"
          - "request body supplies note"
        side_effects:
          - "sets ContactLog.reject_reason from the request note"
          - "leaves ContactLog.credited_minutes and ContactLog.stipend_cents at 0"
          - "increments ContactLog.version by 1"
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /contact-logs/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "log.verification_status == VERIFIED"
          - "no StipendDisbursement with mentor_id == match.mentor_id and status IN {APPROVED, PAID} has period_start <= log.verified_at <= period_end"
        side_effects:
          - "sets ContactLog.void_reason from the request reason and resets ContactLog.credited_minutes and ContactLog.stipend_cents to 0"
          - "CASCADE hop 1: recomputes MentorMatch.verified_minutes_total, MentorMatch.accrued_stipend_cents, Mentor.verified_minutes_lifetime, Mentor.stipend_accrued_cents, NoviceTeacher.verified_contact_minutes and NoviceTeacher.readiness_index_live"
          - "CASCADE hop 2: because NoviceTeacher.verified_contact_minutes fell below milestone.required_contact_minutes, every MilestoneAttainment with novice_id == this novice, status == ATTAINED and snapshot evidence no longer satisfied transitions ATTAINED->REVOKED with revoke_reason 'EVIDENCE_WITHDRAWN', processed milestone.sequence_index ASC"
          - "CASCADE hop 3 and hop 4 follow from the MilestoneAttainment ATTAINED->REVOKED transition and the NoviceTeacher license_advancement_status RECOMMENDED->NOT_ELIGIBLE transition"
          - "increments ContactLog.version, MentorMatch.version, Mentor.version and NoviceTeacher.version by 1 each"
        note: "Compensating action for SUBMITTED->VERIFIED; head of the four-hop void cascade."

  - entity: ObservationCycle
    state_field: phase
    initial_state: PRE_CONFERENCE
    terminal_states: [DOCUMENTED, ABANDONED]
    transitions:
      - from: PRE_CONFERENCE
        to: OBSERVED
        trigger: "POST /observation-cycles/{id}/advance with to_phase=OBSERVED"
        actor: Mentor
        preconditions:
          - "cycle.phase == PRE_CONFERENCE"
          - "match.match_status == ACTIVE"
          - "X-User-ID == match.mentor_id"
          - "clock_now >= cycle.window_end"
        side_effects:
          - "sets ObservationCycle.observed_at = clock_now"
          - "increments ObservationCycle.version by 1"
      - from: OBSERVED
        to: POST_CONFERENCE
        trigger: "POST /observation-cycles/{id}/advance with to_phase=POST_CONFERENCE"
        actor: Mentor
        preconditions:
          - "cycle.phase == OBSERVED"
          - "match.match_status == ACTIVE"
          - "X-User-ID == match.mentor_id"
        side_effects:
          - "sets ObservationCycle.post_conference_at = clock_now"
          - "increments ObservationCycle.version by 1"
      - from: POST_CONFERENCE
        to: DOCUMENTED
        trigger: "POST /observation-cycles/{id}/advance with to_phase=DOCUMENTED"
        actor: Mentor
        preconditions:
          - "cycle.phase == POST_CONFERENCE"
          - "cycle.feedback_review_status == ACCEPTED (the JOIN point of the two independent dimensions; an advance attempted while the feedback dimension sits at DRAFT, SUBMITTED or RETURNED is refused with ERR_FEEDBACK_STATE_INVALID)"
          - "X-User-ID == match.mentor_id"
          - "cycle.narrative length >= 120 chars, growth_area_codes has 1..4 members, rubric_scores carries all four keys"
        side_effects:
          - "sets ObservationCycle.documented_at = clock_now"
          - "recomputes NoviceTeacher.documented_observation_cycles and NoviceTeacher.readiness_index_live"
          - "may drive NoviceTeacher.license_advancement_status NOT_ELIGIBLE->ELIGIBLE"
          - "increments ObservationCycle.version and NoviceTeacher.version by 1"
      - from: PRE_CONFERENCE
        to: ABANDONED
        trigger: "POST /observation-cycles/{id}/advance with to_phase=ABANDONED, or CASCADE hop 2 of a MentorMatch leaving ACTIVE"
        actor: ProgramAdmin
        preconditions:
          - "cycle.phase IN {PRE_CONFERENCE, OBSERVED, POST_CONFERENCE}"
        side_effects:
          - "sets ObservationCycle.abandoned_at = clock_now"
          - "CASCADE hop 3: when cycle.feedback_review_status IN {DRAFT, SUBMITTED} it transitions to RETURNED with return_reason 'CYCLE_ABANDONED' and return_count is incremented by 1"
          - "increments ObservationCycle.version by 1"
      - from: OBSERVED
        to: ABANDONED
        trigger: "POST /observation-cycles/{id}/advance with to_phase=ABANDONED, or CASCADE hop 2 of a MentorMatch leaving ACTIVE"
        actor: ProgramAdmin
        preconditions:
          - "cycle.phase == OBSERVED"
        side_effects:
          - "sets ObservationCycle.abandoned_at = clock_now"
          - "CASCADE hop 3: when cycle.feedback_review_status IN {DRAFT, SUBMITTED} it transitions to RETURNED with return_reason 'CYCLE_ABANDONED' and return_count is incremented by 1"
          - "increments ObservationCycle.version by 1"
      - from: POST_CONFERENCE
        to: ABANDONED
        trigger: "POST /observation-cycles/{id}/advance with to_phase=ABANDONED, or CASCADE hop 2 of a MentorMatch leaving ACTIVE"
        actor: ProgramAdmin
        preconditions:
          - "cycle.phase == POST_CONFERENCE"
        side_effects:
          - "sets ObservationCycle.abandoned_at = clock_now"
          - "CASCADE hop 3: when cycle.feedback_review_status IN {DRAFT, SUBMITTED} it transitions to RETURNED with return_reason 'CYCLE_ABANDONED' and return_count is incremented by 1"
          - "increments ObservationCycle.version by 1"

  - entity: ObservationCycle
    state_field: feedback_review_status
    initial_state: NONE
    terminal_states: [ACCEPTED]
    transitions:
      - from: NONE
        to: DRAFT
        trigger: "POST /observation-cycles/{id}/feedback with submit=false"
        actor: Mentor
        preconditions:
          - "cycle.feedback_review_status == NONE"
          - "cycle.phase IN {OBSERVED, POST_CONFERENCE}"
          - "X-User-ID == match.mentor_id"
        side_effects:
          - "stores ObservationCycle.narrative, growth_area_codes and rubric_scores from the request body"
          - "sets ObservationCycle.composite_rubric_score from observation_composite_rubric_score"
          - "increments ObservationCycle.version by 1"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /observation-cycles/{id}/feedback with submit=true"
        actor: Mentor
        preconditions:
          - "cycle.feedback_review_status == DRAFT"
          - "cycle.phase == POST_CONFERENCE"
          - "X-User-ID == match.mentor_id"
          - "narrative length >= 120 chars, growth_area_codes has 1..4 members, rubric_scores carries all four keys with integers 1..4"
        side_effects:
          - "replaces ObservationCycle.narrative, growth_area_codes and rubric_scores from the request body and recomputes composite_rubric_score"
          - "increments ObservationCycle.version by 1"
      - from: NONE
        to: SUBMITTED
        trigger: "POST /observation-cycles/{id}/feedback with submit=true when no draft exists"
        actor: Mentor
        preconditions:
          - "cycle.feedback_review_status == NONE"
          - "cycle.phase == POST_CONFERENCE"
          - "X-User-ID == match.mentor_id"
          - "narrative length >= 120 chars, growth_area_codes has 1..4 members, rubric_scores carries all four keys with integers 1..4"
        side_effects:
          - "stores ObservationCycle.narrative, growth_area_codes and rubric_scores and sets composite_rubric_score"
          - "increments ObservationCycle.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /observation-cycles/{id}/feedback-review with decision=RETURN, or CASCADE hop 3 of an ObservationCycle entering ABANDONED"
        actor: SiteInductionLead
        preconditions:
          - "cycle.feedback_review_status == SUBMITTED"
          - "cycle.return_count < 3"
          - "X-User-ID == novice.site_id for the novice on match.novice_id"
        side_effects:
          - "sets ObservationCycle.return_reason from the request reason and increments ObservationCycle.return_count by 1"
          - "increments ObservationCycle.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /observation-cycles/{id}/feedback with submit=true"
        actor: Mentor
        preconditions:
          - "cycle.feedback_review_status == RETURNED"
          - "cycle.phase == POST_CONFERENCE"
          - "X-User-ID == match.mentor_id"
          - "narrative length >= 120 chars, growth_area_codes has 1..4 members, rubric_scores carries all four keys with integers 1..4"
        side_effects:
          - "replaces ObservationCycle.narrative, growth_area_codes and rubric_scores, recomputes composite_rubric_score and clears return_reason to null"
          - "increments ObservationCycle.version by 1"
        note: "Closes the SUBMITTED -> RETURNED -> SUBMITTED feedback revision cycle; at most three returns."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /observation-cycles/{id}/feedback-review with decision=ACCEPT"
        actor: SiteInductionLead
        preconditions:
          - "cycle.feedback_review_status == SUBMITTED"
          - "cycle.phase == POST_CONFERENCE"
          - "X-User-ID == novice.site_id for the novice on match.novice_id"
        side_effects:
          - "sets ObservationCycle.return_reason to null"
          - "unlocks, but does NOT itself perform, the POST_CONFERENCE->DOCUMENTED phase advance; the two dimensions stay independent and the phase dimension only moves on an explicit advance call"
          - "increments ObservationCycle.version by 1"

  - entity: MilestoneAttainment
    state_field: status
    initial_state: LOCKED
    terminal_states: []
    transitions:
      - from: LOCKED
        to: IN_PROGRESS
        trigger: "POST /milestone-attainments when the prerequisite is already satisfied, or POST /milestone-attainments/{id}/decision with decision=ATTAIN on the prerequisite milestone's attainment row (bubble-up unlock)"
        actor: system
        preconditions:
          - "attainment.status == LOCKED"
          - "milestone.prerequisite_milestone_id is null, OR a MilestoneAttainment row exists with the same novice_id, milestone_id == milestone.prerequisite_milestone_id and status == ATTAINED"
        side_effects:
          - "increments MilestoneAttainment.version by 1"
      - from: IN_PROGRESS
        to: ATTAINED
        trigger: "POST /milestone-attainments/{id}/decision with decision=ATTAIN"
        actor: SiteInductionLead
        preconditions:
          - "attainment.status == IN_PROGRESS"
          - "novice.verified_contact_minutes >= milestone.required_contact_minutes"
          - "novice.documented_observation_cycles >= milestone.required_observation_cycles"
          - "novice.credited_seminar_sessions >= milestone.required_credited_seminars"
          - "milestone.prerequisite_milestone_id is null, OR the prerequisite's attainment row for this novice has status == ATTAINED"
          - "SEGREGATION OF DUTIES: no ContactLog with verification_status == VERIFIED on any MentorMatch of this novice has verified_by_user_id == X-User-ID"
        side_effects:
          - "freezes MilestoneAttainment.snapshot_contact_minutes, snapshot_observation_cycles, snapshot_credited_seminars, snapshot_held_sessions and snapshot_excused_sessions from the novice's current counters"
          - "sets MilestoneAttainment.attained_on = clock_now and attested_by_user_id = X-User-ID"
          - "increments NoviceTeacher.attained_milestone_count by 1 and recomputes NoviceTeacher.readiness_index_snapshot"
          - "when milestone.gates_license_recommendation == true, NoviceTeacher.license_advancement_status transitions ELIGIBLE->RECOMMENDED"
          - "every MilestoneAttainment row for the same novice whose milestone.prerequisite_milestone_id == this milestone_id and status == LOCKED transitions LOCKED->IN_PROGRESS"
          - "increments MilestoneAttainment.version and NoviceTeacher.version by 1"
      - from: ATTAINED
        to: REVOKED
        trigger: "POST /milestone-attainments/{id}/decision with decision=REVOKE, or CASCADE hop 2 of POST /contact-logs/{id}/void"
        actor: ProgramAdmin
        preconditions:
          - "attainment.status == ATTAINED"
          - "attainment.revocation_count < 3"
        side_effects:
          - "sets MilestoneAttainment.revoked_on = clock_now, revoke_reason and increments revocation_count by 1"
          - "decrements NoviceTeacher.attained_milestone_count by 1 and recomputes NoviceTeacher.readiness_index_snapshot"
          - "CASCADE hop 3: when milestone.gates_license_recommendation == true, NoviceTeacher.license_advancement_status transitions RECOMMENDED->NOT_ELIGIBLE, which in turn carries hop 4 onto CompletionCertification"
          - "every MilestoneAttainment row for the same novice whose milestone.prerequisite_milestone_id == this milestone_id and status == IN_PROGRESS transitions IN_PROGRESS->LOCKED"
          - "increments MilestoneAttainment.version and NoviceTeacher.version by 1"
      - from: REVOKED
        to: IN_PROGRESS
        trigger: "POST /milestone-attainments/{id}/decision with decision=REOPEN"
        actor: ProgramAdmin
        preconditions:
          - "attainment.status == REVOKED"
          - "milestone.prerequisite_milestone_id is null, OR the prerequisite's attainment row for this novice has status == ATTAINED"
        side_effects:
          - "clears MilestoneAttainment.revoke_reason to null"
          - "increments MilestoneAttainment.version by 1"
        note: "Closes the IN_PROGRESS -> ATTAINED -> REVOKED -> IN_PROGRESS cycle."
      - from: IN_PROGRESS
        to: LOCKED
        trigger: "CASCADE from a prerequisite MilestoneAttainment transitioning ATTAINED->REVOKED"
        actor: system
        preconditions:
          - "attainment.status == IN_PROGRESS"
          - "milestone.prerequisite_milestone_id is not null and the prerequisite's attainment row for this novice leaves ATTAINED in the same request"
        side_effects:
          - "increments MilestoneAttainment.version by 1"

  - entity: SeminarSession
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /seminar-sessions/{id}/status with status=HELD"
        actor: ProgramAdmin
        preconditions:
          - "session.status == SCHEDULED"
          - "clock_now >= session.scheduled_end"
          - "cohort.status IN {FORMING, RUNNING}"
        side_effects:
          - "sets SeminarSession.held_at = clock_now"
          - "bubble-up: Cohort.status transitions FORMING->RUNNING when it is still FORMING"
          - "recomputes credited_seminar_sessions and readiness_index_live for every NoviceTeacher that has a SeminarAttendance row on this session, processed SeminarAttendance.created_at ASC"
          - "may drive NoviceTeacher.license_advancement_status NOT_ELIGIBLE->ELIGIBLE for those novices"
          - "increments SeminarSession.version, Cohort.version and each affected NoviceTeacher.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /seminar-sessions/{id}/status with status=CANCELLED"
        actor: ProgramAdmin
        preconditions:
          - "session.status == SCHEDULED"
          - "request body supplies cancel_reason"
        side_effects:
          - "sets SeminarSession.cancelled_at = clock_now and cancel_reason from the request body"
          - "recomputes SeminarSession.credited_attendance_count to 0 because credited attendance only counts against HELD sessions"
          - "recomputes credited_seminar_sessions and readiness_index_live for every NoviceTeacher with a SeminarAttendance row on this session"
          - "releases the session's scheduled_minutes from the cohort weekly seminar minute cap"
          - "increments SeminarSession.version and each affected NoviceTeacher.version by 1"

  - entity: StipendDisbursement
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLAWED_BACK, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /stipend-disbursements/{id}/status with status=APPROVED"
        actor: ProgramAdmin
        preconditions:
          - "disbursement.status == DRAFT"
          - "disbursement.net_cents > 0"
          - "SEGREGATION OF DUTIES: X-User-ID != disbursement.prepared_by_user_id"
        side_effects:
          - "sets StipendDisbursement.approved_by_user_id = X-User-ID"
          - "increments StipendDisbursement.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /stipend-disbursements/{id}/status with status=PAID"
        actor: ProgramAdmin
        preconditions:
          - "disbursement.status == APPROVED"
          - "request body supplies payment_reference"
        side_effects:
          - "sets StipendDisbursement.paid_at = clock_now and payment_reference from the request body"
          - "increments Mentor.stipend_paid_cents by StipendDisbursement.net_cents"
          - "increments StipendDisbursement.version and Mentor.version by 1"
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /stipend-disbursements/{id}/status with status=CLAWED_BACK"
        actor: ProgramAdmin
        preconditions:
          - "disbursement.status == PAID"
          - "request body supplies clawback_reason"
        side_effects:
          - "sets StipendDisbursement.clawed_back_at = clock_now and clawback_reason from the request body"
          - "decrements Mentor.stipend_paid_cents by StipendDisbursement.net_cents and increments Mentor.stipend_clawed_back_cents by the same amount"
          - "increments StipendDisbursement.version and Mentor.version by 1"
        note: "Compensating action for APPROVED->PAID; preserves the stipend cash invariant."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /stipend-disbursements creating a new DRAFT with the same mentor_id and period_code"
        actor: system
        preconditions:
          - "disbursement.status == DRAFT"
        side_effects:
          - "sets StipendDisbursement.superseded_by_id to the id of the new DRAFT"
          - "increments StipendDisbursement.version by 1"

  - entity: CompletionCertification
    state_field: packet_status
    initial_state: ASSEMBLING
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: ASSEMBLING
        to: SUBMITTED_TO_STATE
        trigger: "POST /completion-certifications/{id}/transition with action=SUBMIT"
        actor: ProgramAdmin
        preconditions:
          - "packet.packet_status == ASSEMBLING"
          - "novice.license_advancement_status == RECOMMENDED"
          - "Cohort.status == CLOSED for novice.cohort_id (cross-entity gate on Cohort)"
          - "novice.credited_seminar_sessions >= cohort.seminar_sessions_required"
          - "every Milestone with gates_license_recommendation == true has a MilestoneAttainment row for this novice with status == ATTAINED"
          - "packet.completion_score >= 75.00 after recomputation"
        side_effects:
          - "recomputes CompletionCertification.evidence_milestone_count, base_score, retention_bonus and completion_score via completion_certification_score"
          - "sets CompletionCertification.submitted_at = clock_now and submitted_by_user_id = X-User-ID"
          - "increments CompletionCertification.version by 1"
      - from: SUBMITTED_TO_STATE
        to: ACCEPTED
        trigger: "POST /completion-certifications/{id}/state-decision with decision=ACCEPT"
        actor: StateCredentialingOfficer
        preconditions:
          - "packet.packet_status == SUBMITTED_TO_STATE"
          - "request body supplies state_file_number"
        side_effects:
          - "sets CompletionCertification.state_file_number, decided_at = clock_now and decided_by_user_id = X-User-ID"
          - "NoviceTeacher.program_status transitions COMPLETION_PENDING->COMPLETED with all of that transition's side effects"
          - "NoviceTeacher.license_advancement_status transitions RECOMMENDED->ADVANCED and license_stage is set to CLEAR"
          - "increments CompletionCertification.version and NoviceTeacher.version by 1"
      - from: SUBMITTED_TO_STATE
        to: RETURNED
        trigger: "POST /completion-certifications/{id}/state-decision with decision=RETURN, or CASCADE hop 4 of POST /contact-logs/{id}/void"
        actor: StateCredentialingOfficer
        preconditions:
          - "packet.packet_status == SUBMITTED_TO_STATE"
          - "on the officer-driven path the request body supplies return_reason"
        side_effects:
          - "sets CompletionCertification.return_reason; on the officer-driven path also sets decided_at = clock_now and decided_by_user_id = X-User-ID, while the cascaded path leaves both null and writes return_reason 'EVIDENCE_REVOKED'"
          - "NoviceTeacher.program_status transitions COMPLETION_PENDING->ACTIVE"
          - "increments CompletionCertification.version and NoviceTeacher.version by 1"
      - from: RETURNED
        to: ASSEMBLING
        trigger: "POST /completion-certifications/{id}/transition with action=REOPEN"
        actor: ProgramAdmin
        preconditions:
          - "packet.packet_status == RETURNED"
          - "packet.resubmission_count < 2"
        side_effects:
          - "increments CompletionCertification.resubmission_count by 1 and clears return_reason to null"
          - "NoviceTeacher.program_status transitions ACTIVE->COMPLETION_PENDING"
          - "increments CompletionCertification.version and NoviceTeacher.version by 1"
        note: "Closes the ASSEMBLING -> SUBMITTED_TO_STATE -> RETURNED -> ASSEMBLING cycle; at most two reopens."
      - from: ASSEMBLING
        to: WITHDRAWN
        trigger: "POST /completion-certifications/{id}/transition with action=WITHDRAW"
        actor: ProgramAdmin
        preconditions:
          - "packet.packet_status IN {ASSEMBLING, RETURNED}"
          - "request body supplies reason"
        side_effects:
          - "sets CompletionCertification.withdrawn_reason from the request reason"
          - "NoviceTeacher.program_status transitions COMPLETION_PENDING->ACTIVE"
          - "increments CompletionCertification.version and NoviceTeacher.version by 1"
      - from: RETURNED
        to: WITHDRAWN
        trigger: "POST /completion-certifications/{id}/transition with action=WITHDRAW"
        actor: ProgramAdmin
        preconditions:
          - "packet.packet_status == RETURNED"
          - "request body supplies reason"
        side_effects:
          - "sets CompletionCertification.withdrawn_reason from the request reason"
          - "NoviceTeacher.program_status is already ACTIVE on this path (the RETURN that produced the RETURNED packet already moved it) and is left unchanged"
          - "increments CompletionCertification.version by 1; NoviceTeacher.version is NOT incremented on this path"
        note: "Contrast with the ASSEMBLING -> WITHDRAWN hop, which does move the novice COMPLETION_PENDING -> ACTIVE and does bump NoviceTeacher.version."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: match-create-stale-mentor
    parent_entity: Mentor
    write_endpoint: "POST /mentor-matches"
    occ_field: "expected_mentor_version"
    description: |
      Creating a MentorMatch against a Mentor whose version has advanced since
      the client last read it is rejected. A prior match creation against the
      same mentor legitimately consumes caseload headroom and advances
      Mentor.version, so the current writer's view of the mentor's caseload is
      stale and the request is refused rather than silently over-committing the
      mentor.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: stipend-draft-stale-mentor
    parent_entity: Mentor
    write_endpoint: "POST /stipend-disbursements"
    occ_field: "expected_mentor_version"
    description: |
      Creating a StipendDisbursement DRAFT against a Mentor whose version has
      advanced since the client last read it is rejected. A new DRAFT for a
      mentor and period_code legitimately supersedes the prior DRAFT, so the
      write is destructive with respect to whatever the client last observed;
      a stale version means the client is superseding a draft it never saw.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: packet-create-stale-novice
    parent_entity: NoviceTeacher
    write_endpoint: "POST /completion-certifications"
    occ_field: "expected_novice_version"
    description: |
      Creating a CompletionCertification against a NoviceTeacher whose version
      has advanced since the client last read it is rejected. Packet scoring
      reads the novice's readiness and milestone counters at creation time, and
      those counters advance NoviceTeacher.version whenever contact logs,
      observation cycles, seminar attendance or milestone attainments change;
      a stale version means the packet would be scored from evidence the client
      never observed.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contact_log_credited_minutes
    trigger: "ContactLog SUBMITTED->VERIFIED via POST /contact-logs/{id}/review with decision=VERIFY; writes ContactLog.credited_minutes"
    algorithm: threshold
    formula: |
      # Combinatorial mode (a): three inputs interacting non-linearly through a
      # conditional type weight, a cumulative same-day ceiling and nested min/max.
      weight       = TYPE_WEIGHT[log.contact_type]
      weighted     = log.minutes * weight
      already      = sum(L.credited_minutes
                         for L in ContactLog
                         where L.match_id      == log.match_id
                           and date(L.contact_date) == date(log.contact_date)
                           and L.verification_status == 'VERIFIED'
                           and L.id != log.id)          # iterate L in created_at ASC
      day_room     = max(0, DAILY_CREDIT_CAP_MINUTES - already)
      credited_minutes = min(floor(weighted), day_room)
      # day_room == 0 is rejected earlier by ERR_DAILY_CREDIT_CAP_REACHED, so a
      # VERIFIED log always carries credited_minutes >= 1.
    input_set: "ContactLog rows on the SAME match_id and the SAME calendar date (UTC) whose verification_status == VERIFIED; SUBMITTED, DISPUTED, REJECTED and VOIDED rows are excluded from `already`"
    constants:
      DAILY_CREDIT_CAP_MINUTES: 180
      TYPE_WEIGHT:
        ONE_ON_ONE: 1.00
        CO_PLANNING: 1.00
        MODEL_LESSON: 1.25
        DEBRIEF: 0.75
    precision: "whole minutes; `weighted` is truncated toward zero (floor) BEFORE the day_room ceiling is applied"

  - name: subject_match_tier
    trigger: "POST /mentor-matches; writes MentorMatch.subject_match_tier and MentorMatch.site_match"
    algorithm: aggregation
    formula: |
      if novice.subject_area in mentor.subject_endorsements:
          subject_match_tier = 'EXACT'
      elif novice.subject_area in union(ADJACENCY_MAP[e] for e in mentor.subject_endorsements):
          subject_match_tier = 'ADJACENT'
      else:
          subject_match_tier = 'CROSS'
      site_match = (mentor.site_id == novice.site_id)
    input_set: "the mentor named or auto-selected for this match and the novice named in the request body, read at creation time"
    constants:
      ADJACENCY_MAP:
        MATH: [SCIENCE, CTE]
        SCIENCE: [MATH, CTE]
        ELA: [SOCIAL_STUDIES, WORLD_LANGUAGE]
        SOCIAL_STUDIES: [ELA, WORLD_LANGUAGE]
        SPED: [ELA, MATH]
        WORLD_LANGUAGE: [ELA, SOCIAL_STUDIES]
        CTE: [MATH, SCIENCE]
    precision: "exact enum, no rounding"

  - name: mentor_auto_selection
    trigger: "POST /mentor-matches when the request body omits mentor_id; writes MentorMatch.mentor_id and MentorMatch.selection_mode = AUTO_SELECTED"
    algorithm: weighted_scoring
    formula: |
      # (a) eligibility filter — ALL predicates must hold
      candidates = [m for m in Mentor where
                      m.certification_status == 'CERTIFIED'
                  and m.site_id == novice.site_id
                  and m.active_caseload_count < m.caseload_cap
                  and Site[m.site_id].status == 'OPEN'
                  and not exists MentorMatch with mentor_id == m.id
                        and novice_id == novice.id
                        and match_status in {'PROPOSED','ACTIVE','SUSPENDED'}]

      # (b) ranking expression — ascending lexicographic sort, first row wins
      def sort_key(m):
          tier_rank = 0 if novice.subject_area in m.subject_endorsements else \
                      1 if novice.subject_area in union(ADJACENCY_MAP[e] for e in m.subject_endorsements) else 2
          return (tier_rank,                                    # 1. subject affinity ASC
                  m.active_caseload_count,                      # 2. lighter caseload first
                  -epoch_seconds(m.certification_expires_on),   # 3. later expiry first
                  epoch_seconds(m.created_at))                  # 4. tie-break: created_at ASC
      # (c) tie-break: created_at ASC — the id field is NEVER consulted
      # (d) empty candidate set -> reject with ERR_NO_ELIGIBLE_MENTOR (422)
      selected = sorted(candidates, key=sort_key)[0] if candidates else RAISE ERR_NO_ELIGIBLE_MENTOR
    input_set: "Mentor rows with certification_status == CERTIFIED at the site named by novice.site_id whose site status == OPEN and whose active_caseload_count is strictly below caseload_cap"
    constants:
      ADJACENCY_MAP:
        MATH: [SCIENCE, CTE]
        SCIENCE: [MATH, CTE]
        ELA: [SOCIAL_STUDIES, WORLD_LANGUAGE]
        SOCIAL_STUDIES: [ELA, WORLD_LANGUAGE]
        SPED: [ELA, MATH]
        WORLD_LANGUAGE: [ELA, SOCIAL_STUDIES]
        CTE: [MATH, SCIENCE]
    precision: "integer sort keys; epoch seconds at millisecond truncation"

  - name: mentor_stipend_gross_cents
    trigger: "ContactLog SUBMITTED->VERIFIED (refreshes Mentor.stipend_accrued_cents and ContactLog.stipend_cents), POST /stipend-disbursements (writes StipendDisbursement.gross_cents), and ContactLog VERIFIED->VOIDED (refreshes Mentor.stipend_accrued_cents)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (b): PINNED ROUNDING ORDER. Each contact log is
      # rounded to whole cents FIRST, then the rounded per-log amounts are
      # summed. Summing the unrounded products and rounding once at the end is
      # explicitly NOT the rule and yields a different total.
      def per_log_cents(L):
          rate = RATE_CENTS_PER_HOUR[L.rate_tier_at_verification]
          mult = L.cert_multiplier_at_verification
          return round_half_up(L.credited_minutes / 60 * rate * mult, 0)   # ROUND FIRST

      gross_cents = sum(per_log_cents(L) for L in eligible_logs   # SUM SECOND
                        ordered by L.created_at ASC)
    input_set: "see variants — the provisional variant reads live tier/multiplier values, the final variant reads the values pinned on each ContactLog at verification time"
    constants:
      RATE_CENTS_PER_HOUR:
        EXACT: 4200
        ADJACENT: 3600
        CROSS: 2800
      CERTIFIED_MULTIPLIER: 1.00
      LAPSED_CERT_MULTIPLIER: 0.50
    precision: "whole cents, round_half_up applied PER LOG before summation; the sum itself needs no further rounding"
    variants:
      - name: provisional_accrual
        when: "Mentor.stipend_accrued_cents, refreshed on every ContactLog verification, void, dispute and resubmission"
        difference: |
          Input set is ContactLog rows with verification_status IN {SUBMITTED, VERIFIED}
          on MentorMatch rows of this mentor with match_status IN {ACTIVE, SUSPENDED}.
          For a SUBMITTED log the tier is read LIVE from match.subject_match_tier and
          the multiplier LIVE from the mentor's current certification_status
          (CERTIFIED -> 1.00, otherwise 0.50), and `credited_minutes` is replaced by
          the projected value min(floor(minutes * TYPE_WEIGHT[contact_type]), day_room).
      - name: final_disbursement
        when: "StipendDisbursement.gross_cents at POST /stipend-disbursements"
        difference: |
          Input set is ContactLog rows with verification_status == VERIFIED on any
          MentorMatch of this mentor whose verified_at falls in the CLOSED interval
          [period_start, period_end]. Tier and multiplier are read from the log's
          own pinned rate_tier_at_verification and cert_multiplier_at_verification,
          not from the match or mentor as they stand now. SUBMITTED logs never
          contribute, so the same data yields a strictly smaller gross when any log
          is still awaiting verification, and a different gross whenever the mentor's
          certification status changed after a log was verified.

  - name: seminar_attendance_credit
    trigger: "POST /seminar-attendances; writes SeminarAttendance.credit_ratio and SeminarAttendance.credited"
    algorithm: threshold
    formula: |
      scheduled_minutes = whole_minutes(session.scheduled_end - session.scheduled_start)
      penalty           = LATE_PENALTY_MINUTES if attendance_status == 'LATE' else 0
      effective_minutes = max(0, minutes_attended - penalty)
      credit_ratio      = round_half_up(effective_minutes / scheduled_minutes, 4)
      credited          = (attendance_status in {'PRESENT','LATE'})
                          and (credit_ratio >= CREDIT_RATIO_THRESHOLD)   # >= , NOT >
    input_set: "the single SeminarSession named by session_id; ABSENT and EXCUSED rows still receive a computed credit_ratio but credited is always false"
    constants:
      CREDIT_RATIO_THRESHOLD: 0.75
      LATE_PENALTY_MINUTES: 10
    precision: "credit_ratio to 4 decimal places, round_half_up; the comparison against 0.75 uses the ROUNDED ratio"

  - name: novice_readiness_index
    trigger: "recomputed on ContactLog SUBMITTED->VERIFIED and VERIFIED->VOIDED, ObservationCycle POST_CONFERENCE->DOCUMENTED, POST /seminar-attendances, SeminarSession SCHEDULED->HELD and SCHEDULED->CANCELLED, and MilestoneAttainment IN_PROGRESS->ATTAINED / ATTAINED->REVOKED; writes NoviceTeacher.readiness_index_live and NoviceTeacher.readiness_index_snapshot; exposed by GET /novice-teachers/{id}/readiness"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is pinned: held_sessions and excused_sessions are resolved
      # BEFORE the seminar component, because EXCUSED rows shrink the denominator
      # rather than the numerator.
      step 1: held_sessions    = count(SeminarSession S where S.cohort_id == novice.cohort_id
                                        and S.status == 'HELD')
      step 2: excused_sessions = count(SeminarAttendance A where A.novice_id == novice.id
                                        and A.attendance_status == 'EXCUSED'
                                        and SeminarSession[A.session_id].status == 'HELD')
      step 3: denominator      = max(1, held_sessions - excused_sessions)
      step 4: contact_component     = min(1.0, verified_contact_minutes / TARGET_CONTACT_MINUTES)   # target 600
      step 5: observation_component = min(1.0, documented_observation_cycles / TARGET_OBSERVATION_CYCLES)
      step 6: seminar_component     = min(1.0, credited_seminar_sessions / denominator)
      step 7: index = round_half_up(100 * (W_CONTACT     * contact_component
                                         + W_OBSERVATION * observation_component
                                         + W_SEMINAR     * seminar_component), 2)
    input_set: "SeminarSession rows of the novice's cohort with status == HELD (SCHEDULED and CANCELLED excluded); SeminarAttendance rows of this novice against those HELD sessions; ContactLog rows with verification_status == VERIFIED on this novice's matches; ObservationCycle rows on this novice's matches with phase == DOCUMENTED and feedback_review_status == ACCEPTED"
    constants:
      W_CONTACT: 0.45
      W_OBSERVATION: 0.30
      W_SEMINAR: 0.25
      TARGET_CONTACT_MINUTES: 600
      TARGET_OBSERVATION_CYCLES: 2
      READINESS_GATE: 85.00
    precision: "2 decimal places, round_half_up; components are NOT rounded before the weighted sum"
    variants:
      - name: readiness_index_live
        when: "NoviceTeacher.readiness_index_live, and the license_advancement_status NOT_ELIGIBLE<->ELIGIBLE gate at READINESS_GATE"
        difference: |
          Reads the novice's CURRENT counters — verified_contact_minutes,
          documented_observation_cycles, credited_seminar_sessions — and the CURRENT
          held/excused session counts.
      - name: readiness_index_snapshot
        when: "NoviceTeacher.readiness_index_snapshot, and the evidence figure quoted on a state completion packet"
        difference: |
          Reads the frozen snapshot_contact_minutes, snapshot_observation_cycles,
          snapshot_credited_seminars, snapshot_held_sessions and
          snapshot_excused_sessions of ONE MilestoneAttainment row: the row for this
          novice with status == ATTAINED ranked by Milestone.sequence_index DESC and,
          when two ATTAINED rows share a sequence_index, by MilestoneAttainment.created_at
          DESC; the first row wins. When the novice has no ATTAINED row the snapshot
          index is 0.00. Because the snapshot survives a later VOID of a contact log,
          the two variants diverge on identical stored data.

  - name: completion_certification_score
    trigger: "POST /completion-certifications and the ASSEMBLING->SUBMITTED_TO_STATE transition; writes CompletionCertification.evidence_milestone_count, base_score, retention_bonus and completion_score"
    algorithm: threshold
    formula: |
      # Combinatorial mode (c): completion_score = base_score + retention_bonus while
      # retention_bonus is itself keyed on a SCORE TIER. The dependency is resolved by
      # pinning the tier lookup to base_score (step 3), never to completion_score.
      step 1: milestone_component = min(1.0, evidence_milestone_count / MILESTONE_TARGET_COUNT)
      step 2: base_score = round_half_up(W_READINESS * novice.readiness_index_live
                                       + W_MILESTONE * 100 * milestone_component, 2)
      step 3: if   base_score >= BONUS_TIER_HIGH_MIN and novice.retention_outcome == 'RETAINED_SAME_SITE':
                  retention_bonus = BONUS_HIGH
              elif base_score >= BONUS_TIER_MID_MIN  and novice.retention_outcome in {'RETAINED_SAME_SITE','RETAINED_DISTRICT'}:
                  retention_bonus = BONUS_MID
              else:
                  retention_bonus = BONUS_LOW
      step 4: completion_score = min(SCORE_CAP, round_half_up(base_score + retention_bonus, 2))
    input_set: "evidence_milestone_count is the count of MilestoneAttainment rows for this novice with status == ATTAINED at computation time (LOCKED, IN_PROGRESS and REVOKED excluded); readiness_index_live is the live variant of novice_readiness_index; retention_outcome is read from NoviceTeacher"
    constants:
      W_READINESS: 0.60
      W_MILESTONE: 0.40
      MILESTONE_TARGET_COUNT: 3
      BONUS_TIER_HIGH_MIN: 90.00
      BONUS_HIGH: 5.00
      BONUS_TIER_MID_MIN: 75.00
      BONUS_MID: 2.50
      BONUS_LOW: 0.00
      SCORE_CAP: 100.00
      SUBMISSION_GATE: 75.00
    precision: "2 decimal places, round_half_up at step 2 and step 4; the step-3 tier comparison reads the ROUNDED base_score"

  - name: mentor_certification_hour_ledger
    trigger: "POST /mentors/{id}/training-credits; consumed by POST /mentors/{id}/certification with action=CERTIFY or action=RECERTIFY"
    algorithm: aggregation
    formula: |
      # Aggregation with an explicit reset event.
      training_hours_current_cycle   += request.hours
      training_modules_current_cycle  = distinct(training_modules_current_cycle + [request.module_code])
      # RESET EVENT: a successful UNCERTIFIED->CERTIFIED or LAPSED->CERTIFIED
      # transition sets training_hours_current_cycle back to 0 and
      # training_modules_current_cycle back to []. Credits posted before the reset
      # never count toward the next cycle.
      required_hours   = INITIAL_CERT_REQUIRED_HOURS if mentor.certification_status == 'UNCERTIFIED'
                         else RECERT_REQUIRED_HOURS
      required_modules = REQUIRED_INITIAL_MODULES     if mentor.certification_status == 'UNCERTIFIED'
                         else REQUIRED_RECERT_MODULES
      eligible = (training_hours_current_cycle >= required_hours)          # >= , NOT >
                 and set(required_modules).issubset(set(training_modules_current_cycle))
      certification_expires_on = clock_now + CERT_TERM_DAYS days
    input_set: "hours and module codes posted through POST /mentors/{id}/training-credits strictly after the most recent certification cycle reset"
    constants:
      INITIAL_CERT_REQUIRED_HOURS: 18.00
      RECERT_REQUIRED_HOURS: 6.00
      REQUIRED_INITIAL_MODULES: [FOUNDATIONS, OBSERVATION_PROTOCOL, EQUITY]
      REQUIRED_RECERT_MODULES: [RECERT_REFRESH]
      CERT_TERM_DAYS: 365
    precision: "hours to 2 decimal places, round_half_up on each posted credit before accumulation"

  - name: observation_composite_rubric_score
    trigger: "POST /observation-cycles/{id}/feedback (any of NONE->DRAFT, NONE->SUBMITTED, DRAFT->SUBMITTED, RETURNED->SUBMITTED); writes ObservationCycle.composite_rubric_score"
    algorithm: aggregation
    formula: |
      composite_rubric_score = round_half_up((rubric_scores.planning
                                            + rubric_scores.instruction
                                            + rubric_scores.environment
                                            + rubric_scores.assessment) / 4, 2)
    input_set: "the four rubric dimensions supplied in the request body; all four keys are mandatory and each must be an integer 1..4"
    constants:
      RUBRIC_DIMENSION_COUNT: 4
      RUBRIC_MIN: 1
      RUBRIC_MAX: 4
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (strict ascending priority; the FIRST violated
# rule in this order is the error returned, and no later rule may mask it)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and non-empty on every request except POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "A missing or empty X-User-Role header is rejected before any path, body or state inspection."
  - priority: 2
    category: auth
    check: "X-User-Role names one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "An unrecognised role string is indistinguishable from no credential at all and is rejected as unauthenticated, not as forbidden."
  - priority: 3
    category: auth
    check: "the authenticated role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
    description: "Role recognised but not permitted on this endpoint. Evaluated before existence checks, so a forbidden role probing a non-existent id still receives 403 and learns nothing about which ids exist."
  - priority: 4
    category: auth
    check: "for an entity_backed role, X-User-ID is present and resolves to a live row of the backing entity (Site for SiteInductionLead, Mentor for Mentor, NoviceTeacher for NoviceTeacher)"
    error_id: ERR_IDENTITY_NOT_RESOLVED
    http_status: 403
    applies_to: all
    description: "Missing X-User-ID, or an X-User-ID that matches no row of the backing entity, is a failure of the caller's own identity and outranks every resource lookup."
  - priority: 5
    category: existence
    check: "every {id} path parameter resolves to an existing row of the addressed collection"
    error_id: "ERR_SITE_NOT_FOUND | ERR_MENTOR_NOT_FOUND | ERR_COHORT_NOT_FOUND | ERR_NOVICE_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_CONTACT_LOG_NOT_FOUND | ERR_OBSERVATION_CYCLE_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_ATTAINMENT_NOT_FOUND | ERR_SEMINAR_SESSION_NOT_FOUND | ERR_SEMINAR_ATTENDANCE_NOT_FOUND | ERR_DISBURSEMENT_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a {id} path parameter"
    description: "Path existence precedes body existence: for POST /observation-cycles/{id}/advance with an unknown cycle id and a malformed body, the 404 wins."
  - priority: 6
    category: existence
    check: "every foreign key supplied in a request body resolves to an existing row of the referenced entity"
    error_id: "ERR_SITE_NOT_FOUND | ERR_MENTOR_NOT_FOUND | ERR_COHORT_NOT_FOUND | ERR_NOVICE_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_MILESTONE_NOT_FOUND | ERR_SEMINAR_SESSION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /mentors, POST /novice-teachers, POST /mentor-matches, POST /contact-logs, POST /observation-cycles, POST /milestones, POST /milestone-attainments, POST /seminar-sessions, POST /seminar-attendances, POST /stipend-disbursements, POST /completion-certifications"
    description: "Body FKs are resolved in declaration order as listed in the endpoint's input; the first unresolvable FK determines the error."
  - priority: 7
    category: existence
    check: "required body fields present; every field's JSON type, enum membership, string length, numeric range, array cardinality and datetime format satisfy the entity constraints in §1.1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
    description: "Covers missing required fields, unknown enum members, minutes outside 1..300, rubric values outside 1..4, growth_area_codes outside 1..4 entries, description shorter than 20 characters, non-ISO-8601 datetimes and caseload_cap outside 1..4."
  - priority: 8
    category: auth
    check: "the resolved entity_backed identity owns the addressed resource — a SiteInductionLead acts only on rows whose site_id equals its Site id, a Mentor only on rows reachable from its own MentorMatch rows, a NoviceTeacher only on rows whose novice_id equals its own id"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles list contains SiteInductionLead, Mentor or NoviceTeacher"
    description: "The row exists (priority 5 passed) but belongs to another site, mentor or novice. Ownership is checked AFTER existence so an owner of nothing cannot enumerate ids, and BEFORE any state rule so a foreign caller never learns the target's state."
  - priority: 9
    category: state
    check: "Site.status == OPEN"
    error_id: ERR_SITE_CLOSED
    http_status: 422
    applies_to: "POST /mentors, POST /novice-teachers, POST /mentor-matches"
    description: "No new mentor, novice or match may be attached to a CLOSED site."
  - priority: 10
    category: state
    check: "MentorMatch.match_status is the state the requested operation requires (ACTIVE for contact-log creation, verification, observation-cycle creation and disposition to END; PROPOSED for disposition to ACTIVATE or REJECT; SUSPENDED for disposition back to ACTIVE)"
    error_id: ERR_MATCH_STATE_INVALID
    http_status: 409
    applies_to: "POST /contact-logs, POST /contact-logs/{id}/review, POST /contact-logs/{id}/resubmit, POST /observation-cycles, POST /mentor-matches/{id}/disposition"
    description: "Match-state gating outranks every fiscal rule below it, so verification against a SUSPENDED match reports the state error even when the same-day credit cap is also exhausted."
  - priority: 11
    category: state
    check: "ContactLog.verification_status is the state the requested operation requires (SUBMITTED for review, DISPUTED for resubmit, VERIFIED for void)"
    error_id: ERR_CONTACT_LOG_STATE_INVALID
    http_status: 409
    applies_to: "POST /contact-logs/{id}/review, POST /contact-logs/{id}/resubmit, POST /contact-logs/{id}/void"
    description: "Also blocks a second review of an already VERIFIED, REJECTED or VOIDED log, giving idempotency-violation coverage."
  - priority: 12
    category: state
    check: "ObservationCycle.phase permits the requested advance (PRE_CONFERENCE->OBSERVED, OBSERVED->POST_CONFERENCE, POST_CONFERENCE->DOCUMENTED, any non-terminal phase->ABANDONED)"
    error_id: ERR_OBSERVATION_PHASE_INVALID
    http_status: 409
    applies_to: "POST /observation-cycles/{id}/advance, POST /observation-cycles/{id}/feedback, POST /observation-cycles/{id}/feedback-review"
    description: "Phase and feedback_review_status are parallel dimensions; this rule guards the phase dimension only."
  - priority: 13
    category: state
    check: "ObservationCycle.feedback_review_status permits the requested action (NONE or DRAFT or RETURNED for feedback submission; SUBMITTED for RETURN or ACCEPT; ACCEPTED for the POST_CONFERENCE->DOCUMENTED phase advance)"
    error_id: ERR_FEEDBACK_STATE_INVALID
    http_status: 409
    applies_to: "POST /observation-cycles/{id}/feedback, POST /observation-cycles/{id}/feedback-review, POST /observation-cycles/{id}/advance with to_phase=DOCUMENTED"
    description: "Guards the second, independent dimension of the observation cycle: an ACCEPTED review cannot be re-returned and a DRAFT cannot be accepted."
  - priority: 14
    category: state
    check: "MilestoneAttainment.status permits the requested decision (IN_PROGRESS for ATTAIN, ATTAINED for REVOKE, REVOKED for REOPEN)"
    error_id: ERR_ATTAINMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /milestone-attainments/{id}/decision"
    description: "LOCKED rows reject every decision until their prerequisite is attained and the row is reopened to IN_PROGRESS."
  - priority: 15
    category: state
    check: "StipendDisbursement.status permits the requested transition (DRAFT->APPROVED, APPROVED->PAID, PAID->CLAWED_BACK)"
    error_id: ERR_DISBURSEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /stipend-disbursements/{id}/status"
    description: "Blocks paying a DRAFT, approving a PAID row, and clawing back anything that was never paid."
  - priority: 16
    category: state
    check: "CompletionCertification.packet_status permits the requested action (ASSEMBLING for SUBMIT and WITHDRAW, RETURNED for REOPEN, SUBMITTED_TO_STATE for ACCEPT and RETURN)"
    error_id: ERR_PACKET_STATE_INVALID
    http_status: 409
    applies_to: "POST /completion-certifications/{id}/transition, POST /completion-certifications/{id}/state-decision"
    description: "An ACCEPTED packet is terminal and rejects every further action."
  - priority: 17
    category: state
    check: "Mentor.certification_status permits the requested certification action (UNCERTIFIED or LAPSED for CERTIFY, CERTIFIED for RECERTIFY and SUSPEND, SUSPENDED for REINSTATE, any non-RETIRED for RETIRE)"
    error_id: ERR_MENTOR_CERT_STATE_INVALID
    http_status: 409
    applies_to: "POST /mentors/{id}/certification, POST /mentors/{id}/training-credits"
    description: "RETIRED is terminal; training credits cannot be posted to a RETIRED mentor."
  - priority: 18
    category: state
    check: "NoviceTeacher.program_status permits the requested operation (ENROLLED or MATCHED for match creation; ACTIVE for observation-cycle creation and milestone attainment; ACTIVE or COMPLETION_PENDING for packet creation and withdrawal)"
    error_id: ERR_NOVICE_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /mentor-matches, POST /observation-cycles, POST /milestone-attainments, POST /completion-certifications, POST /novice-teachers/{id}/withdraw"
    description: "WITHDRAWN and COMPLETED novices are terminal for every program operation. Packet creation admits COMPLETION_PENDING on purpose: a novice who is mid-packet must be refused by priority 41 (ERR_ACTIVE_PACKET_EXISTS), not by this rule, so the two refusals stay distinguishable."
  - priority: 19
    category: state
    check: "SeminarSession.status permits the requested operation (SCHEDULED for HELD, CANCELLED and attendance recording)"
    error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /seminar-sessions/{id}/status, POST /seminar-attendances"
    description: "Attendance may only be recorded against a SCHEDULED session; the session is then marked HELD."
  - priority: 20
    category: state
    check: "Cohort.status is the state the operation requires (FORMING or RUNNING for novice enrolment and seminar scheduling; CLOSED for packet submission to the state)"
    error_id: ERR_COHORT_STATE_INVALID
    http_status: 422
    applies_to: "POST /novice-teachers, POST /seminar-sessions, POST /completion-certifications/{id}/transition"
    description: "Deliberately two-sided: the same field blocks early operations when CLOSED and blocks the terminal operation when not CLOSED."
  - priority: 21
    category: state
    check: "expected_<parent>_version in the request body equals the addressed parent row's current version field"
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
    applies_to: "POST /mentor-matches (expected_mentor_version vs Mentor.version), POST /stipend-disbursements (expected_mentor_version vs Mentor.version), POST /completion-certifications (expected_novice_version vs NoviceTeacher.version)"
    description: "Optimistic concurrency control per §1.2.1. Checked after the parent row is known to exist and to be in an acceptable state, and before any business rule, so a caller holding a stale view is told to re-read rather than being told a business rule failed."
  - priority: 22
    category: business_safety
    check: "the acting X-User-ID differs from the user recorded as having produced the evidence being judged — a contact log's verified_by_user_id may not equal its submitted_by_user_id; a milestone attestation's attested_by_user_id may not equal any verified_by_user_id on the evidence logs; a disbursement's approved_by_user_id may not equal its prepared_by_user_id; a packet's decided_by_user_id may not equal its submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /contact-logs/{id}/review, POST /milestone-attainments/{id}/decision, POST /stipend-disbursements/{id}/status, POST /completion-certifications/{id}/state-decision"
    description: "Segregation of duties is a safety rule, not a role rule: the caller holds the right role and owns the resource, yet is disqualified by having acted earlier in the same chain. Ranked above every referential and fiscal rule, so attesting your own milestone against an unattained prerequisite reports the duty conflict, not the prerequisite gap."
  - priority: 23
    category: business_safety
    check: "Mentor.certification_status == CERTIFIED and Mentor.certification_expires_on is strictly after the current logical clock time"
    error_id: ERR_MENTOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /mentor-matches/{id}/disposition with decision=ACTIVATE, POST /observation-cycles, POST /contact-logs"
    description: "An expired certification is treated exactly like a LAPSED one even before the lapse transition has been recorded. Ranked above the temporal window rules, so an uncertified mentor booking an overlapping observation window is told about the certification first."
  - priority: 24
    category: business_temporal
    check: "the proposed observation window does not collide with any other ObservationCycle of the SAME MENTOR whose phase is in {PRE_CONFERENCE, OBSERVED, POST_CONFERENCE}, where collision means the CLOSED intervals expanded by OBSERVATION_BUFFER_MINUTES=30 intersect: new_start <= other_end + 30min AND other_start <= new_end + 30min"
    error_id: ERR_OBSERVATION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /observation-cycles"
    description: "Mentor-resource overlap with a travel buffer. Because the interval is CLOSED and padded, two windows that merely touch — and even two windows 30 minutes apart — are rejected; a gap of 31 minutes is accepted. DOCUMENTED and ABANDONED cycles never block."
  - priority: 25
    category: business_temporal
    check: "the proposed seminar window does not collide with any other SeminarSession of the SAME COHORT whose status is in {SCHEDULED, HELD}, where collision means the HALF-OPEN intervals intersect: new_start < other_end AND other_start < new_end"
    error_id: ERR_SEMINAR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /seminar-sessions"
    description: "Cohort-resource overlap with half-open interval semantics and NO buffer, deliberately the opposite convention to priority 24: back-to-back sessions where one ends exactly when the next begins are ALLOWED here and forbidden there."
  - priority: 26
    category: business_constraint
    check: "the total scheduled_minutes of SeminarSession rows of this cohort with status in {SCHEDULED, HELD} whose scheduled_start falls in the same ISO week (Monday 00:00:00 UTC to the following Monday 00:00:00 UTC, half-open) plus the proposed session's own scheduled minutes does not exceed COHORT_WEEKLY_SEMINAR_CAP_MINUTES=240"
    error_id: ERR_COHORT_WEEKLY_SEMINAR_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /seminar-sessions"
    description: "Aggregate rule layered on top of the pairwise overlap rule: each individual session may be non-overlapping and legally sized, yet the collective weekly load is refused. Exactly 240 minutes is accepted; 241 is not."
  - priority: 27
    category: business_constraint
    check: "window_end is strictly after window_start and scheduled_end is strictly after scheduled_start, and for those two intervals the duration is between 30 and 240 minutes inclusive; for a stipend period only period_end strictly after period_start is required, with no duration bound"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /observation-cycles, POST /seminar-sessions, POST /stipend-disbursements"
    description: "Interval well-formedness. Separated from ERR_INVALID_REQUEST because it compares two fields rather than validating one."
  - priority: 28
    category: business_constraint
    check: "period_end is strictly before the current logical clock time"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /stipend-disbursements"
    description: "A stipend period may only be drafted once it is entirely in the past, which makes the disbursement input set final."
  - priority: 29
    category: business_referential
    check: "the mentor's site_id equals the novice's site_id"
    error_id: ERR_SITE_MISMATCH
    http_status: 422
    applies_to: "POST /mentor-matches"
    description: "Cross-site matches are refused even when the subject affinity is EXACT, so site_match is always true on a created match."
  - priority: 30
    category: business_referential
    check: "the novice named on an attendance row belongs to the cohort that owns the seminar session"
    error_id: ERR_COHORT_MISMATCH
    http_status: 422
    applies_to: "POST /seminar-attendances"
    description: "A novice may only be marked present at seminars of their own cohort."
  - priority: 31
    category: business_referential
    check: "when the milestone names a prerequisite_milestone_id, the same novice holds a MilestoneAttainment row for that prerequisite with status == ATTAINED"
    error_id: ERR_PREREQUISITE_NOT_ATTAINED
    http_status: 422
    applies_to: "POST /milestone-attainments/{id}/decision with decision=ATTAIN or decision=REOPEN"
    description: "Self-referential milestone chain enforced transitively along the sequence: attaining milestone 3 requires 2 ATTAINED, which required 1 ATTAINED. Ranked below segregation of duties on purpose."
  - priority: 32
    category: business_referential
    check: "the prerequisite_milestone_id supplied for a new Milestone has a strictly smaller sequence_index than the new milestone, and the prerequisite chain therefore contains no cycle"
    error_id: ERR_MILESTONE_CYCLE
    http_status: 422
    applies_to: "POST /milestones"
    description: "Structural acyclicity of the self-referential milestone graph, enforced at configuration time so the runtime prerequisite walk always terminates."
  - priority: 33
    category: business_referential
    check: "the novice's license_advancement_status is RECOMMENDED"
    error_id: ERR_LICENSE_RECOMMENDATION_MISSING
    http_status: 422
    applies_to: "POST /completion-certifications/{id}/transition with action=SUBMIT"
    description: "The state will not accept a packet for a novice the district has not formally recommended for licence advancement."
  - priority: 34
    category: business_referential
    check: "the count of MilestoneAttainment rows for this novice with status == ATTAINED is at least MILESTONE_TARGET_COUNT=3, and the computed completion base_score is at least SUBMISSION_GATE=75.00"
    error_id: ERR_MILESTONE_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /completion-certifications/{id}/transition with action=SUBMIT"
    description: "Both halves are evaluated together; a base_score of exactly 75.00 with exactly 3 attainments passes."
  - priority: 35
    category: business_temporal
    check: "the contact_date falls within the MentorMatch's active life — on or after date(activated_at) and, when the match has ended, on or before date(ended_at) — and is not in the future relative to the current logical clock"
    error_id: ERR_CONTACT_DATE_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /contact-logs"
    description: "Date-granularity comparison against a timestamp-granularity boundary: a log dated the same calendar day as activation is accepted even when its clock time precedes activated_at."
  - priority: 36
    category: business_constraint
    check: "no MentorMatch row already exists with the same (mentor_id, novice_id) pair and match_status in {PROPOSED, ACTIVE, SUSPENDED}"
    error_id: ERR_DUPLICATE_ACTIVE_MATCH
    http_status: 409
    applies_to: "POST /mentor-matches"
    description: "ENDED and REJECTED pairs may be re-proposed, so the uniqueness scope is state-qualified rather than absolute."
  - priority: 37
    category: business_constraint
    check: "the novice has no MentorMatch row with match_status in {PROPOSED, ACTIVE, SUSPENDED} against any other mentor"
    error_id: ERR_NOVICE_ALREADY_MATCHED
    http_status: 409
    applies_to: "POST /mentor-matches"
    description: "A novice carries at most one live mentor relationship at a time; the previous match must be ENDED or REJECTED first."
  - priority: 38
    category: business_constraint
    check: "Mentor.active_caseload_count is strictly less than Mentor.caseload_cap"
    error_id: ERR_CASELOAD_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /mentor-matches/{id}/disposition with decision=ACTIVATE"
    description: "Re-checked at activation, not only at proposal, because the mentor may have been filled by another activation in between. A count exactly equal to the cap fails."
  - priority: 39
    category: business_constraint
    check: "Site.active_match_count is strictly less than Site.mentor_slot_cap"
    error_id: ERR_SITE_SLOT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /mentor-matches/{id}/disposition with decision=ACTIVATE"
    description: "A second, coarser cap on the same operation: the mentor may have room while the site as a whole does not."
  - priority: 40
    category: business_constraint
    check: "no ObservationCycle already exists on this match with the same cycle_index; no SeminarSession already exists in this cohort with the same session_index; no SeminarAttendance already exists for this (session_id, novice_id) pair; no Site already carries this site_code; no Milestone already carries this code or this sequence_index; no StipendDisbursement already exists for this (mentor_id, period_code) pair with status in {APPROVED, PAID} (an existing DRAFT is not a duplicate: it is superseded by the new DRAFT per §1.2); no MilestoneAttainment already exists for this (novice_id, milestone_id) pair"
    error_id: "ERR_DUPLICATE_CYCLE_INDEX | ERR_DUPLICATE_SESSION_INDEX | ERR_DUPLICATE_ATTENDANCE | ERR_DUPLICATE_SITE_CODE | ERR_DUPLICATE_MILESTONE_CODE | ERR_DUPLICATE_DISBURSEMENT_PERIOD | ERR_DUPLICATE_ATTAINMENT"
    http_status: 409
    applies_to: "POST /observation-cycles, POST /seminar-sessions, POST /seminar-attendances, POST /sites, POST /milestones, POST /stipend-disbursements, POST /milestone-attainments"
    description: "Uniqueness family. The disbursement scope covers only APPROVED and PAID rows: an existing DRAFT for the same (mentor_id, period_code) is superseded rather than rejected, and CLAWED_BACK or SUPERSEDED rows are ignored so a clawed-back period can be re-drafted."
  - priority: 41
    category: business_constraint
    check: "the novice has no CompletionCertification row with packet_status in {ASSEMBLING, SUBMITTED_TO_STATE, ACCEPTED}"
    error_id: ERR_ACTIVE_PACKET_EXISTS
    http_status: 409
    applies_to: "POST /completion-certifications"
    description: "RETURNED and WITHDRAWN packets do not block a fresh one; an ACCEPTED packet blocks forever."
  - priority: 42
    category: business_safety
    check: "the observation cycle carries a narrative of at least 120 characters, between 1 and 4 growth_area_codes, and all four rubric_scores keys"
    error_id: ERR_FEEDBACK_INCOMPLETE
    http_status: 422
    applies_to: "POST /observation-cycles/{id}/feedback with submit=true, POST /observation-cycles/{id}/advance with to_phase=DOCUMENTED"
    description: "Documentation completeness is enforced at submission and re-enforced at the DOCUMENTED phase advance, so an accepted-but-emptied cycle can never be counted as documented evidence."
  - priority: 43
    category: business_fiscal
    check: "the same-day credited-minute room for this match is greater than zero: sum(credited_minutes of VERIFIED logs on the same match and the same calendar date) < DAILY_CREDIT_CAP_MINUTES=180"
    error_id: ERR_DAILY_CREDIT_CAP_REACHED
    http_status: 422
    applies_to: "POST /contact-logs/{id}/review with decision=VERIFY"
    description: "Cumulative rate threshold. At exactly 180 credited minutes the next verification is refused; at 179 it succeeds and is truncated to 1 credited minute. Ranked far below the match-state rule, which is what makes the priority conflict observable."
  - priority: 44
    category: business_fiscal
    check: "the disbursement's eligible_log_count is greater than zero"
    error_id: ERR_NO_ELIGIBLE_ACTIVITY
    http_status: 422
    applies_to: "POST /stipend-disbursements"
    description: "A period with no VERIFIED logs produces no draft at all rather than a zero-value one."
  - priority: 45
    category: business_fiscal
    check: "adjustment_cents, when negative, has an absolute value no greater than gross_cents"
    error_id: ERR_ADJUSTMENT_EXCEEDS_GROSS
    http_status: 422
    applies_to: "POST /stipend-disbursements"
    description: "A deduction may zero out a draft but never invert it."
  - priority: 46
    category: business_fiscal
    check: "net_cents is strictly greater than zero"
    error_id: ERR_NON_POSITIVE_NET_STIPEND
    http_status: 422
    applies_to: "POST /stipend-disbursements"
    description: "Evaluated after priority 45, so an adjustment exactly equal to minus gross reports the non-positive net rather than the excess."
  - priority: 47
    category: business_constraint
    check: "at least one Mentor satisfies every eligibility predicate of the mentor_auto_selection calculation"
    error_id: ERR_NO_ELIGIBLE_MENTOR
    http_status: 422
    applies_to: "POST /mentor-matches when mentor_id is omitted"
    description: "Only reachable on the auto-selection path; an explicit mentor_id that fails the same predicates reports the specific predicate's error instead."
  - priority: 48
    category: business_safety
    check: "the novice's live counters meet every requirement of the milestone being attested: verified_contact_minutes >= Milestone.required_contact_minutes, documented_observation_cycles >= Milestone.required_observation_cycles, credited_seminar_sessions >= Milestone.required_credited_seminars"
    error_id: ERR_MILESTONE_REQUIREMENTS_NOT_MET
    http_status: 422
    applies_to: "POST /milestone-attainments/{id}/decision with decision=ATTAIN"
    description: "All three thresholds use >=, so a novice sitting exactly on each requirement is attested successfully. Evaluated after the prerequisite rule so a novice with the counters but not the chain hears about the chain."
  - priority: 49
    category: business_safety
    check: "training_hours_current_cycle >= the required hours for the mentor's current status and training_modules_current_cycle contains every required module"
    error_id: ERR_TRAINING_REQUIREMENTS_NOT_MET
    http_status: 422
    applies_to: "POST /mentors/{id}/certification with action=CERTIFY or action=RECERTIFY"
    description: "18.00 hours plus FOUNDATIONS, OBSERVATION_PROTOCOL and EQUITY for an initial certification; 6.00 hours plus RECERT_REFRESH for a recertification. Hours accumulated before the previous cycle reset do not count."
  - priority: 50
    category: business_constraint
    check: "ContactLog.resubmit_count < MAX_CONTACT_LOG_RESUBMITS = 2"
    error_id: ERR_RESUBMIT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /contact-logs/{id}/resubmit"
    description: "Bounds the SUBMITTED<->DISPUTED cycle: the third resubmission attempt is refused, so the cycle cannot spin forever."
  - priority: 51
    category: business_constraint
    check: "ObservationCycle.return_count < MAX_FEEDBACK_RETURNS = 3"
    error_id: ERR_FEEDBACK_RETURN_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /observation-cycles/{id}/feedback-review with decision=RETURN"
    description: "Bounds the SUBMITTED<->RETURNED feedback cycle at three returns; a fourth must be accepted or the cycle abandoned."
  - priority: 52
    category: business_constraint
    check: "MilestoneAttainment.revocation_count < MAX_MILESTONE_REVOCATIONS = 3"
    error_id: ERR_REVOCATION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /milestone-attainments/{id}/decision with decision=REVOKE"
    description: "Bounds the IN_PROGRESS -> ATTAINED -> REVOKED -> IN_PROGRESS cycle."
  - priority: 53
    category: business_constraint
    check: "CompletionCertification.resubmission_count < MAX_PACKET_RESUBMISSIONS = 2"
    error_id: ERR_PACKET_RESUBMISSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /completion-certifications/{id}/transition with action=REOPEN"
    description: "Bounds the ASSEMBLING -> SUBMITTED_TO_STATE -> RETURNED -> ASSEMBLING cycle at two reopenings."
  - priority: 54
    category: existence
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"
    description: "Pagination is validated only on list endpoints and is the last rule because list endpoints reach no other business rule."


# =============================================================================
# §1.5 API Endpoint Table
# Flat topology: every collection is addressed at the root, path parameters are
# always the literal {id}, and every FK declared in §1.1 is reverse-reachable
# through a filtered list endpoint.
# =============================================================================
endpoints:
  # --- Site -------------------------------------------------------------------
  - method: POST
    path: "/sites"
    description: "Register a district school site that can host mentors and novice teachers."
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "site_code", "region_code", "mentor_slot_cap?"]
    output: Site
    side_effects: ["status initialised to OPEN", "active_match_count initialised to 0", "mentor_slot_cap defaults to 6 when omitted"]
  - method: GET
    path: "/sites/{id}"
    description: "Retrieve one site including its live active_match_count."
    roles: [ProgramAdmin, SiteInductionLead, StateCredentialingOfficer]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/sites"
    description: "List sites, optionally filtered by region or status."
    roles: [ProgramAdmin, StateCredentialingOfficer]
    code: 200
    input: ["region_code?", "status?", "limit?", "offset?"]
    output: "Site[]"
    side_effects: []
  - method: POST
    path: "/sites/{id}/close"
    description: "Close a site so no further mentors, novices or matches may be attached to it."
    roles: [ProgramAdmin]
    code: 200
    input: ["reason"]
    output: Site
    side_effects: ["Site.status OPEN->CLOSED", "closed_at stamped from the logical clock", "existing ACTIVE matches at the site are left untouched"]

  # --- Mentor -----------------------------------------------------------------
  - method: POST
    path: "/mentors"
    description: "Register a veteran teacher as a candidate mentor at an open site."
    roles: [ProgramAdmin, SiteInductionLead]
    code: 201
    input: ["site_id", "full_name", "subject_endorsements", "caseload_cap?"]
    output: Mentor
    side_effects: ["certification_status initialised to UNCERTIFIED", "caseload, training, stipend and verified-minute counters initialised to 0", "caseload_cap defaults to 2 when omitted"]
  - method: GET
    path: "/mentors/{id}"
    description: "Retrieve one mentor including certification state, live caseload and stipend ledger."
    roles: [ProgramAdmin, SiteInductionLead, Mentor, StateCredentialingOfficer]
    code: 200
    input: []
    output: Mentor
    side_effects: []
  - method: GET
    path: "/mentors"
    description: "List mentors, optionally filtered by site or certification status. Reverse lookup for Mentor.site_id -> Site.id."
    roles: [ProgramAdmin, SiteInductionLead, StateCredentialingOfficer]
    code: 200
    input: ["site_id?", "certification_status?", "subject_endorsement?", "limit?", "offset?"]
    output: "Mentor[]"
    side_effects: []
  - method: POST
    path: "/mentors/{id}/training-credits"
    description: "Post completed mentor-training hours and a module code toward the mentor's current certification cycle."
    roles: [ProgramAdmin]
    code: 200
    input: ["module_code", "hours", "completed_on"]
    output: Mentor
    side_effects: ["mentor_certification_hour_ledger accumulates training_hours_current_cycle", "module_code added to training_modules_current_cycle without duplication"]
  - method: POST
    path: "/mentors/{id}/certification"
    description: "Apply a certification lifecycle action to a mentor: CERTIFY, RECERTIFY, SUSPEND, REINSTATE or RETIRE."
    roles: [ProgramAdmin]
    code: 200
    input: ["action", "reason?"]
    output: Mentor
    side_effects: ["certification_status transition per §1.2", "certification_expires_on set to clock + 365 days on CERTIFY and RECERTIFY", "training_hours_current_cycle and training_modules_current_cycle reset to 0 and [] on CERTIFY and RECERTIFY", "SUSPEND and RETIRE suspend or end every ACTIVE match of the mentor, cascading into the novices' program_status and license_advancement_status", "REINSTATE reactivates SUSPENDED matches in created_at ASC order"]

  # --- Cohort -----------------------------------------------------------------
  - method: POST
    path: "/cohorts"
    description: "Open an induction cohort for a program year and region."
