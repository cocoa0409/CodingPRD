  # ===========================================================================
  - section: endpoints
    instances:
      - name: occ_contract_amendment_stale_returns_412
        claim_type: action_endpoint
        grounds:
          - "concurrency_rules[contract-amend-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Amendment carrying the pre-amendment version is rejected 412; the same amendment rebased on the current version applies and bumps amendment_seq."
        test_recipe:
          setup: ["ACTIVE contract (version 4 after submit/award/activate)"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-EP1", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-EP1", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps, captures: { c_v: $.data.version } }
          trigger:
            - { call: "POST /busops/contracts/${c_id}/amendments", payload: { expected_contract_version: "${c_v} - 1", fuel_base_price_cents: 425 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { err: $.data.error_id } }
            - { call: "POST /busops/contracts/${c_id}/amendments", payload: { expected_contract_version: "${c_v}", fuel_base_price_cents: 425 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { new_v: $.data.version, seq: $.data.amendment_seq, base: $.data.fuel_base_price_cents } }
          assert:
            - "${err} == ERR_STALE_VERSION (stale expected version rejected)"
            - "HTTP status of first amendment attempt is 412"
            - "${new_v} == ${c_v} + 1 and ${seq} == 1 and ${base} == 425 (rebased amendment applied)"
      - name: occ_charter_approve_version_pinning_returns_412
        claim_type: action_endpoint
        grounds:
          - "concurrency_rules[charter-approve-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Version-pinning on approval: quoting bumps the charter version, so an approval pinned to the pre-quote version is rejected 412; pinning the post-quote version succeeds."
        test_recipe:
          setup: ["ACTIVE contract; charter REQUESTED (version captured) then QUOTED (version bumped)"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-EP2", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-EP2", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/charter-trips", payload: { contract_id: "${c_id}", purpose: "Versioned trip", trip_date: "2026-06-10", pickup_minute: 600, return_minute: 720, estimated_hours_x10: 20, estimated_miles: 40, passenger_count: 20 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { ch: $.data.id, v_pre: $.data.version } }
            - { call: "POST /busops/charter-trips/${ch}/quote", payload: {}, as: ContractorOps, captures: { v_post: $.data.version } }
          trigger:
            - { call: "POST /busops/charter-trips/${ch}/approve", payload: { expected_charter_trip_version: "${v_pre}", deposit_cents: 0 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { err: $.data.error_id } }
            - { call: "POST /busops/charter-trips/${ch}/approve", payload: { expected_charter_trip_version: "${v_post}", deposit_cents: 0 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_STALE_VERSION (approval pinned pre-quote version)"
            - "${st} == APPROVED (post-quote pin succeeds)"
