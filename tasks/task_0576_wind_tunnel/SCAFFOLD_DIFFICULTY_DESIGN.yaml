# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — Wind Tunnel
# 9 rules x 2 instances = 18 instances. Every grounds ref resolves in SCAFFOLD.yaml
# §1.1-§1.7; every setup_api_calls/trigger call resolves in §1.5.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: booking_price_walk_in_vs_reservation
        grounds:
          - calculations.booking_price
          - entities.Booking.fields.total_price_cents
          - entities.Booking.fields.booking_type
        distinguishing_aspect: |
          Same package base (6000), same party_size (2): the WALK_IN variant yields
          total_price_cents 14400 while the RESERVATION variant (lead 7) yields 10800 —
          two valid variants on the Booking entity produce different results.
        test_recipe:
          setup:
            - "One package (base 6000, included 2 min) and one member with no membership."
          setup_api_calls:
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 2 }
              as: FrontDesk
              captures: { b_walk: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "RESERVATION", party_size: 2, lead_days: 7 }
              as: FrontDesk
              captures: { b_res: $.data.id }
          assert:
            - "Booking.${b_walk}.total_price_cents == 14400"
            - "Booking.${b_res}.total_price_cents == 10800"

      - name: reflight_credit_provisional_vs_final
        grounds:
          - calculations.reflight_credit_valuation
          - entities.Member.fields.reflight_credit_minutes
          - entities.Flight.fields.reflight_credit_granted
          - state_machines.Flight.CHECKED_IN_to_ABORTED
          - state_machines.Session.RUNNING_to_CLOSED
        distinguishing_aspect: |
          For a flight with scheduled_minutes 2 and flown_minutes 1, the provisional
          variant grants credit 2 at abort while the final variant reconciles to 1 at
          session close — dual-variant reflight credit on the Member entity domain.
        test_recipe:
          setup:
            - "A running session with one checked-in flight (scheduled 2 min) on a party-1 booking."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${m_id}", weight_kg_declared: 80, health_ok: true }
              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /flights/${f_id}/abort"
              payload: { flown_minutes: 1 }
              as: Instructor
              as_user_id: "${i_id}"
              captures: { prov_credit: $.data.reflight_credit_granted }
            - call: "POST /sessions/${s_id}/close"
              payload: {}
              as: FrontDesk
          assert:
            - "captured prov_credit == 2 (provisional grant at abort)"
            - "Flight.${f_id}.reflight_credit_granted == 1 (final at close)"
            - "Member.${m_id}.reflight_credit_minutes == 1"

  - rule_id: combinatorial_formula
    instances:
      - name: booking_price_tiered_party_lead_membership_mode_a
        grounds:
          - calculations.booking_price
          - entities.Booking.fields.party_size
          - entities.Member.fields.membership_tier
        distinguishing_aspect: |
          Mode (a): three tiered inputs interact non-linearly — party_size 3 (0.95),
          RESERVATION lead 7 (0.10 off), PRO membership (0.15 off) — 6000*3*0.95=17100,
          *0.90=15390, *0.85=13081.5, round_half_up -> total_price_cents 13082.
        test_recipe:
          setup:
            - "A PRO member and a package (base 6000)."
          setup_api_calls:
            - call: "POST /packages"
              payload: { name: "Group", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Bo", weight_kg: 70, experience_status: "RETURNING" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${m_id}", tier: "PRO" }
              as: FrontDesk
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "RESERVATION", party_size: 3, lead_days: 7 }
              as: FrontDesk
              captures: { b_id: $.data.id }
          assert:
            - "Booking.${b_id}.total_price_cents == 13082"

      - name: addon_statement_round_per_line_mode_b
        grounds:
          - calculations.addon_statement
          - entities.Member.fields.outstanding_addon_cents
          - entities.Flight.fields.video_charge_cents
          - entities.CoachingBooking.fields.charge_cents
        distinguishing_aspect: |
          Mode (b): STANDARD member (0.10 off), video 3335*0.90=3001.5->3002 and coaching
          3*1245*0.90=3361.5->3362; rounding EACH line then summing gives
          outstanding_addon_cents 6364 (summing raw 6363.0 then rounding gives 6363).
        test_recipe:
          setup:
            - "A STANDARD member with one scheduled flight; then video add-on + 3-min coaching."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Cy", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${m_id}", tier: "STANDARD" }
              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /flights/${f_id}/video"
              payload: {}
              as: FrontDesk
            - call: "POST /coaching-bookings"
              payload: { flight_id: "${f_id}", instructor_id: "${i_id}", minutes: 3 }
              as: FrontDesk
              captures: { c_id: $.data.id }
          assert:
            - "Flight.${f_id}.video_charge_cents == 3002"
            - "CoachingBooking.${c_id}.charge_cents == 3362"
            - "Member.${m_id}.outstanding_addon_cents == 6364"

  - rule_id: non_linear_state_machine
    instances:
      - name: flight_branching_abort_divergent_side_effects
        grounds:
          - state_machines.Flight.CHECKED_IN_to_ABORTED
          - state_machines.Flight.CHECKED_IN_to_FLOWN
          - state_machines.Flight.SCHEDULED_to_NO_SHOW
          - entities.Flight.fields.reflight_credit_granted
        distinguishing_aspect: |
          Flight is a fork-join: from CHECKED_IN the ABORTED branch refunds minutes AND
          grants reflight credit (2), whereas the FLOWN and NO_SHOW branches do neither —
          divergent side-effect sets per branch on the Flight entity.
        test_recipe:
          setup:
            - "A running session with one checked-in flight (scheduled 2) on a party-1 booking."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${m_id}", weight_kg_declared: 80, health_ok: true }
              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /flights/${f_id}/abort"
              payload: { flown_minutes: 1 }
              as: Instructor
              as_user_id: "${i_id}"
          assert:
            - "Flight.${f_id}.status == ABORTED"
            - "Flight.${f_id}.reflight_credit_granted == 2"
            - "Booking.${b_id}.minutes_remaining == 2 (refunded, unlike FLOWN/NO_SHOW branches)"

      - name: session_parallel_op_and_staffing_axes
        grounds:
          - state_machines.Session.UNSTAFFED_to_STAFFED
          - state_machines.Session.OPEN_to_RUNNING
          - entities.Session.fields.op_status
          - entities.Session.fields.staffing_status
        distinguishing_aspect: |
          Session carries two independent axes: after assign-instructor op_status is still
          OPEN while staffing_status is STAFFED; after start op_status is RUNNING while
          staffing_status stays STAFFED — the axes evolve independently.
        test_recipe:
          setup:
            - "One tunnel, one instructor, one OPEN/UNSTAFFED session."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
          trigger:
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
              captures: { op_after_assign: $.data.op_status }
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
          assert:
            - "captured op_after_assign == OPEN (op axis unchanged by staffing transition)"
            - "Session.${s_id}.staffing_status == STAFFED"
            - "Session.${s_id}.op_status == RUNNING"

  - rule_id: transitive_cascade
    instances:
      - name: abort_cascade_flight_booking_member_depth3
        grounds:
          - state_machines.Flight.CHECKED_IN_to_ABORTED
          - state_machines.Booking.EXHAUSTED_to_CONFIRMED
          - entities.Booking.fields.minutes_remaining
          - entities.Member.fields.confirmed_booking_count
        distinguishing_aspect: |
          Depth-3 chain from a single abort: Flight.abort -> Booking.minutes_remaining
          (0->2) -> Booking.status (EXHAUSTED->CONFIRMED) -> Member.confirmed_booking_count
          (0->1); each link caused by the prior link, not by the abort directly.
        test_recipe:
          setup:
            - "Party-1 booking (2 min pool) fully consumed by one flight -> booking EXHAUSTED, member count 0; flight checked-in in a running session."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${m_id}", weight_kg_declared: 80, health_ok: true }
              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /flights/${f_id}/abort"
              payload: { flown_minutes: 0 }
              as: Instructor
              as_user_id: "${i_id}"
          assert:
            - "Booking.${b_id}.minutes_remaining == 2"
            - "Booking.${b_id}.status == CONFIRMED"
            - "Member.${m_id}.confirmed_booking_count == 1"

      - name: close_cascade_session_flight_member_depth2
        grounds:
          - state_machines.Session.RUNNING_to_CLOSED
          - entities.Flight.fields.reflight_credit_granted
          - entities.Member.fields.reflight_credit_minutes
          - calculations.reflight_credit_valuation
        distinguishing_aspect: |
          Depth-2 chain from session close (a different trigger than abort): Session.close
          -> Flight.reflight_credit_granted (2->1, reconciled) -> Member.reflight_credit_minutes
          (2->1); the member adjustment is caused by the flight reconciliation.
        test_recipe:
          setup:
            - "A running session with one ABORTED flight (scheduled 2, flown 1) -> provisional credit 2 on member and flight."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${m_id}", weight_kg_declared: 80, health_ok: true }
              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /flights/${f_id}/abort"
              payload: { flown_minutes: 1 }
              as: Instructor
              as_user_id: "${i_id}"
          trigger:
            - call: "POST /sessions/${s_id}/close"
              payload: {}
              as: FrontDesk
          assert:
            - "Flight.${f_id}.reflight_credit_granted == 1"
            - "Member.${m_id}.reflight_credit_minutes == 1"
            - "Session.${s_id}.op_status == CLOSED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_checkin
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WEIGHT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          A check-in request violates BOTH state (flight is NO_SHOW, terminal) and
          business_safety (member weight 80 > tunnel max 70). State (priority 4) wins:
          ERR_INVALID_STATE, not ERR_WEIGHT_LIMIT_EXCEEDED. Pair state vs business_safety.
        test_recipe:
          setup:
            - "A flight left NO_SHOW by session close, whose member (80kg) also exceeds the tunnel max (70kg)."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T-low", max_weight_kg: 70, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
              payload: { name: "Ivy", cert_level: "L2" }
              as: Manager
              captures: { i_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Heavy", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /waivers"
              payload: { member_id: "${m_id}", weight_kg_declared: 80, health_ok: true }
              as: FrontDesk
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
            - call: "POST /sessions/${s_id}/close"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE (state priority 4 beats safety priority 6)"

      - name: referential_beats_fiscal_on_flight_create
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_SESSION_NOT_STAFFED]
          - errors[ERR_INSUFFICIENT_MINUTES]
        distinguishing_aspect: |
          A POST /flights request violates BOTH business_referential (session UNSTAFFED)
          and business_fiscal (scheduled_minutes 5 > booking minutes 2). Referential
          (priority 5) wins: ERR_SESSION_NOT_STAFFED. Pair referential vs business_fiscal.
        test_recipe:
          setup:
            - "An OPEN but UNSTAFFED session, and a party-1 booking with only 2 minutes."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "First Flight", included_minutes: 2, base_price_cents: 6000, min_experience: "FIRST_TIME" }
              as: Manager
              captures: { pkg_id: $.data.id }
            - call: "POST /members"
              payload: { name: "Ada", weight_kg: 80, experience_status: "FIRST_TIME" }
              as: FrontDesk
              captures: { m_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 5 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_SESSION_NOT_STAFFED (referential priority 5 beats fiscal priority 9)"

  - rule_id: boundary_precision_check
    instances:
      - name: weight_limit_equal_allowed_boundary
        grounds:
          - validations[priority=6]
          - errors[ERR_WEIGHT_LIMIT_EXCEEDED]
          - entities.Tunnel.fields.max_weight_kg
          - entities.Member.fields.weight_kg
        distinguishing_aspect: |
          A flyer whose weight_kg exactly equals the tunnel max (120 == 120) checks in
          successfully — the gate is strictly greater (>), not >=. Endpoint: check-in.
        test_recipe:
          setup:
            - "Tunnel max 120; member weight exactly 120; staffed OPEN session with a scheduled flight and valid waiver."
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /instructors"
