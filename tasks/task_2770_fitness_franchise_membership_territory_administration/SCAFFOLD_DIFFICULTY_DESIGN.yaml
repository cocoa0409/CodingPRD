              as_user_id: "${f1_id}"
            - call: "POST /franchise/relocation-requests"
              payload: { club_id: "${c1_id}", requested_lat: 34.02, requested_lng: -118.02, requested_radius_km: 5.0, justification: "Anchor tenant lost its lease" }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
