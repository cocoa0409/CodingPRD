        distinguishing_aspect: "Both the path route id and the body order_id are unknown; strict left-to-right existence checking must report the 404 for the path resource (ERR_RESOURCE_NOT_FOUND), never the body foreign key error."
        test_recipe:
          setup:
            - "A real route R-404 exists (so a valid version token is available), but the id used in the path and the order_id in the body are both unknown."
