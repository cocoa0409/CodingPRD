      - name: season_close_requires_reconciled_irrigation
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Season.RECONCILIATION_to_CLOSED, state_machines.IrrigationSchedule.LOGGED_to_RECONCILED, "errors[ERR_IRRIGATION_UNRESOLVED]", "errors[ERR_INVALID_SEASON_STATE]"]
        distinguishing_aspect: "CLOSED is guarded by fully reconciled water (LOGGED but not RECONCILED blocks); after reconcile the season closes and every further transition is an invalid-state error (terminal lockdown)."
        test_recipe:
          setup: ["season RECONCILIATION with irrigation S1 LOGGED (actual 45); no logs/allocations"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
