# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2976 - Public Records & Data Journalism Desk
# Nine §0.5 rule_ids, 20 instances. Every instance grounds only in elements
# declared in SCAFFOLD.yaml §1.1-§1.7; every numeric assert literal below was
# computed by executing the relevant calculations[].formula in code.
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: statutory_deadline_strict_versus_tolled_variant
        grounds:
          - calculations.statutory_deadline
          - entities.RecordsRequest.fields.due_at_strict
          - entities.RecordsRequest.fields.due_at_tolled
          - entities.RecordsRequest.fields.tolled_days_total
          - state_machines.RecordsRequest.CLARIFICATION_REQUESTED_to_AWAITING_AGENCY_RESPONSE
        distinguishing_aspect: |
          Both variants of calculations.statutory_deadline read the same submitted_at and the same
          Agency.initial_response_days, but STRICT is frozen at submission while TOLLED is recomputed
          from the original submitted date after every clarification round, so after two rounds the two
          fields on the SAME RecordsRequest row differ by exactly six business days
          (due_at_strict == "2026-08-17T23:59:59.000Z" versus due_at_tolled == "2026-08-25T23:59:59.000Z").
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z (a Monday)."
            - "One Desk with a 500000-cent fee budget."
            - "One Agency: initial_response_days 10, deadline_basis BUSINESS_DAYS, tolling_allowed true, holiday_dates [\"2026-09-07\"]."
            - "One RecordsRequest submitted on 2026-08-03, then taken through two closed clarification rounds: round 1 opened 2026-08-05T10:00:00Z and answered 2026-08-11T10:00:00Z (4 business days), round 2 opened 2026-08-12T09:00:00Z and answered 2026-08-14T09:00:00Z (2 business days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Section 8 inspection failures 2024-2025", requested_format: "CSV", estimated_page_count: 120, waiver_requested: true, public_interest_score: 85, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
              captures: { strict_due: $.data.due_at_strict }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/clarification-request"
              payload: { question_text: "Narrow to inspections closed in 2025." }
              as: RecordsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T10:00:00Z" }
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/clarification-response"
              payload: { answer_text: "Limited to inspections closed between 2025-01-01 and 2025-12-31." }
              as: RecordsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T09:00:00Z" }
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/clarification-request"
              payload: { question_text: "Confirm whether re-inspections are included." }
              as: RecordsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T09:00:00Z" }
              as: RecordsCoordinator
          trigger:
            - call: "POST /records-desk/records-requests/${req_id}/clarification-response"
              payload: { answer_text: "Re-inspections are included." }
              as: RecordsCoordinator
              captures: { tolled_due: $.data.due_at_tolled }
          assert:
            - "RecordsRequest.${req_id}.tolled_days_total == 6"
            - "RecordsRequest.${req_id}.due_at_strict == \"2026-08-17T23:59:59.000Z\""
            - "RecordsRequest.${req_id}.due_at_tolled == \"2026-08-25T23:59:59.000Z\""
            - "RecordsRequest.${req_id}.due_at_strict != RecordsRequest.${req_id}.due_at_tolled"
            - "RecordsRequest.${req_id}.due_at_strict == ${strict_due} (the STRICT variant stamped at submission is byte-identical after both rounds)"
            - "RecordsRequest.${req_id}.status == \"AWAITING_AGENCY_RESPONSE\""
            - "RecordsRequest.${req_id}.clarification_round_count == 2"
            - "RecordsRequest.${req_id}.clarification_opened_at == null"

      - name: disclosure_risk_aggregate_max_versus_composite_weighted
        grounds:
          - calculations.disclosure_risk_score
          - entities.FieldDefinition.fields.reidentification_risk
          - entities.FieldDefinition.fields.suppression_applied
          - entities.Investigation.fields.publication_mode
          - entities.Investigation.fields.applicable_risk_variant
          - validations[priority=140]
        distinguishing_aspect: |
          The two variants of calculations.disclosure_risk_score run on a different entity domain from
          the deadline pair (Dataset field metadata rather than a RecordsRequest clock) and disagree by
          25 points on byte-identical data - AGGREGATE_MAX == 80 (worst single field) versus
          COMPOSITE_WEIGHTED == 55 (average density x size multiplier) for record_count 500 and
          unsuppressed reidentification_risk values 8 and 3 - which straddles PUBLISH_RISK_CEILING 60,
          so the same dataset is unpublishable under AGGREGATES_ONLY and publishable under FULL_DATA_RELEASE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk, one Agency, one RecordsRequest submitted and fully released."
            - "One Investigation with publication_mode AGGREGATES_ONLY."
            - "One Dataset delivered in the negotiated CSV format with record_count 500 and exactly two documented, unsuppressed fields: reidentification_risk 8 and reidentification_risk 3, neither source-identifying."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Section 8 inspection failures 2024-2025", requested_format: "CSV", estimated_page_count: 120, waiver_requested: false, public_interest_score: 85, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/agency-decision"
              payload: { outcome: "RELEASED_FULL" }
              as: RecordsCoordinator
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_id}", headline: "Housing inspectors cleared failing units", publication_mode: "AGGREGATES_ONLY" }
              as: ManagingEditor
              captures: { inv_id: $.data.id }
            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "housing-inspections-2025", negotiated_format: "CSV", expected_field_count: 2, sensitivity_tier: "RESTRICTED" }
              as: DataReporter
              captures: { ds_id: $.data.id }
            - call: "POST /records-desk/datasets/${ds_id}/delivery"
              payload: { delivered_format: "CSV", record_count: 500 }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_id}/field-definitions"
              payload: { field_name: "tenant_zip", data_type: "STRING", null_rate_pct: 1.5, reidentification_risk: 8, is_source_identifying: false }
              as: DataReporter
              captures: { fd_zip_id: $.data.id }
            - call: "POST /records-desk/datasets/${ds_id}/field-definitions"
              payload: { field_name: "violation_class", data_type: "STRING", null_rate_pct: 0.0, reidentification_risk: 3, is_source_identifying: false }
              as: DataReporter
              captures: { fd_class_id: $.data.id }
          trigger:
            - call: "GET /records-desk/investigations/${inv_id}/disclosure-risk-preview"
              payload: { release_dataset_id: "${ds_id}" }
              as: ManagingEditor
              captures: { agg: $.data.aggregate_max_score, comp: $.data.composite_weighted_score, variant: $.data.applicable_variant }
          assert:
            - "aggregate_max_score == 80"
            - "composite_weighted_score == 55"
            - "aggregate_max_score - composite_weighted_score == 25"
            - "applicable_variant == \"AGGREGATE_MAX\" (selected by Investigation.publication_mode AGGREGATES_ONLY)"
            - "applicable_score == 80"
            - "blocking_reason_code == \"ERR_DISCLOSURE_RISK_TOO_HIGH\" (80 > PUBLISH_RISK_CEILING 60)"
            - "Investigation.${inv_id}.disclosure_risk_score == null (the preview persists nothing)"
            - "Dataset.${ds_id}.field_definition_count == 2 and Dataset.${ds_id}.documentation_status == \"COMPLETE\""

  - rule_id: combinatorial_formula
    instances:
      - name: fee_waiver_eight_step_pinned_order_cap_binds
        grounds:
          - calculations.fee_waiver_and_net_fee
          - calculations.desk_fee_budget_ledger
          - entities.Agency.fields.max_waiver_cents
          - entities.RecordsRequest.fields.waiver_pct
          - entities.RecordsRequest.fields.net_fee_cents
          - validations[priority=270]
        distinguishing_aspect: |
          calculations.fee_waiver_and_net_fee is §0.5 mode (c): the waiver percentage is a function of
          the gross fee, the absolute cap is a function of that percentage, and the de-minimis
          small-balance rule is a function of the capped waiver, so the eight steps have exactly one
          admissible order - swapping step 6 (cap) and step 7 (small balance) turns net_fee_cents 5250
          into 0 on the very same inputs (search_hours 3.5, billed_page_count 120, public_interest_score 85).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk with fee_budget_total_cents 500000, all of it available."
            - "One Agency: search_fee_cents_per_hour 3500, page_fee_cents 25, max_waiver_cents 10000."
            - "One RecordsRequest with waiver_requested true and public_interest_score 85, submitted and awaiting the agency."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "State Housing Authority", jurisdiction_code: "CA-STATE", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "OMBUDS", appeal_decision_days: 20, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000, holiday_dates: ["2026-09-07"] }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Section 8 inspection failures 2024-2025", requested_format: "CSV", estimated_page_count: 120, waiver_requested: true, public_interest_score: 85, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
          trigger:
            - call: "POST /records-desk/records-requests/${req_id}/fee-determination"
              payload: { search_hours: 3.5, billed_page_count: 120 }
              as: RecordsCoordinator
              captures: { net: $.data.net_fee_cents }
          assert:
            - "RecordsRequest.${req_id}.search_fee_cents == 12250"
            - "RecordsRequest.${req_id}.duplication_fee_cents == 3000"
            - "RecordsRequest.${req_id}.gross_fee_cents == 15250"
            - "RecordsRequest.${req_id}.waiver_pct == 0.85"
            - "RecordsRequest.${req_id}.waiver_amount_cents == 10000 (raw 12963 capped at Agency.max_waiver_cents 10000)"
            - "RecordsRequest.${req_id}.net_fee_cents == 5250"
            - "RecordsRequest.${req_id}.fee_committed_cents == 5250"
            - "Desk.${desk_id}.fee_budget_available_cents == 494750"
            - "Desk.${desk_id}.fee_budget_committed_cents == 5250"
            - "Desk.${desk_id}.fee_budget_spent_cents == 0"
            - "Desk.${desk_id}.fee_budget_total_cents == 500000 and equals available + committed + spent"

      - name: cost_allocation_round_each_share_then_residual_to_earliest
        grounds:
          - calculations.analysis_cost_allocation
          - entities.Dataset.fields.allocated_cost_cents
          - entities.AnalysisRun.fields.labor_cost_cents
          - entities.AnalysisRun.fields.total_cost_cents
          - concurrency_rules[analysis-run-create-stale-investigation]
        distinguishing_aspect: |
          calculations.analysis_cost_allocation is §0.5 mode (b): rounding each per-dataset share BEFORE
          reconciling produces sum 34751 against a 34750-cent total, so the -1 residual must land on the
          earliest dataset alone (alpha-permits 11571, beta-permits 11572, gamma-permits 11607); rounding
          the total first or spreading the residual proportionally yields different per-dataset integers,
          which distinguishes it from the fee-waiver instance where the ORDER OF DEPENDENT STEPS rather
          than the placement of a rounding residual is what is pinned.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One Desk, one Agency, one RecordsRequest submitted and fully released."
            - "One Investigation with publication_mode FULL_DATA_RELEASE."
