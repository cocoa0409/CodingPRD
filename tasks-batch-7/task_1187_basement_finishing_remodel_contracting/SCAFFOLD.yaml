# =============================================================================
# SCAFFOLD.yaml — Basement Finishing & Remodel Contracting (task 1187)
# §1.0–§1.7 seed tables. Difficulty target: beyond-Expert (dense coupling,
# 14 entities / 9 state machines / 9 calculations / 48 endpoints / 26 errors).
# =============================================================================

scenario: |
  1187. Basement Finishing & Remodel Contracting (basement remodeling contractor): moisture/egress code assessment before design, permit & egress window/ceiling height compliance, layout design & mechanical relocation, subcontractor sequencing in occupied home, dust/noise containment & daily cleanup protocol, change order & allowance management, final inspection & certificate, warranty & moisture recurrence policy

domain_name: basement-finishing
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit        # permits, code thresholds, inspections, certificate, warranty audit trail
  secondary_archetype: graph_constraint      # WorkPhase predecessor DAG + zone/day resource conflicts
  complexity_layers:
    - optimistic_concurrency                 # OCC on Project.version for change-order create-with-supersede
    - cascading_side_effects                 # strike suspension cascade; final-pass certification cascade
    - dual_variant_calculation               # moisture screening vs verification; provisional vs final price
    - version_pinning_on_approval            # Permit pins approved DesignPackage revision at creation
  entity_topology: graph                     # self-referential WorkPhase DAG + cross-aggregate FK references
  state_machine_shape: cyclic                # revision loops on assessment / design / permit; block-resume loop on phases
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: peer_roles                     # Contractor / Homeowner / Subcontractor own disjoint operation sets; Inspector & PlatformAdmin opaque
  consistency_model: immediate               # all mutations atomic in-request; derived fields recomputed synchronously

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Contracting firm name" }
      - { name: license_no, type: string, source: input, description: "State contractor license number" }

  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Homeowner full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Subcontractor company name" }
      - { name: trade, type: enum, source: input, description: "DEMOLITION | FRAMING | PLUMBING | ELECTRICAL | HVAC | INSULATION | DRYWALL | FLOORING | PAINT | GENERAL" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: homeowner_id, type: string, source: input, description: "FK -> Homeowner.id; owning client" }
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; stamped from acting Contractor identity (X-User-ID), not from request body" }
      - { name: address, type: string, source: input, description: "Property address" }
      - { name: basement_sqft, type: integer, source: input, description: "Basement gross square footage" }
      - { name: base_contract_cents, type: integer, source: input, description: "Base contract price in cents (includes allowance budgets)" }
      - { name: status, type: enum, source: system, description: "INTAKE | ASSESSMENT | DESIGN | PERMITTING | SCHEDULING | IN_PROGRESS | SUSPENDED | COMPLETED | CANCELLED" }
      - { name: strike_count, type: integer, source: computed, default: 0, description: "Violation site-logs in the trailing 14-day window (anchored at last resume when set); recomputed on each site-log creation" }
      - { name: last_resumed_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent resume; strike window anchor", constraints: "null until first resume" }
      - { name: contract_price_cents, type: integer, source: computed, description: "Current price per calculations.project_price (variant selected by price_variant rule)" }
      - { name: price_variant, type: enum, source: computed, description: "PROVISIONAL | FINAL — FINAL when zero allowance lines exist or every line is selected, else PROVISIONAL" }
      - { name: approved_design_id, type: string, source: system, description: "FK -> DesignPackage.id; currently APPROVED package, null until first approval" }

  - name: MoistureAssessment
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; from path" }
      - { name: assessment_kind, type: enum, source: input, default: SCREENING, description: "SCREENING | VERIFICATION — VERIFICATION allowed only when a REJECTED assessment exists on the project" }
      - { name: slab_moisture_lbs, type: number, source: input, description: "Calcium-chloride slab emission, lbs/1000sqft/24h" }
      - { name: interior_rh_pct, type: number, source: input, description: "Interior relative humidity percent" }
      - { name: efflorescence_observed, type: boolean, source: input, description: "Visible efflorescence on walls/slab" }
      - { name: grading_deficit, type: boolean, source: input, description: "Exterior grading/drainage deficit observed" }
      - { name: egress_windows_existing, type: integer, source: input, description: "Count of existing egress-capable windows" }
      - { name: ceiling_height_in, type: number, source: input, description: "Measured clear ceiling height in inches" }
      - { name: remediation_notes, type: string, source: input, description: "Remediation summary recorded on reopen", constraints: "null until reopened" }
      - { name: moisture_risk_score, type: integer, source: computed, description: "Per calculations.moisture_risk_score using the variant matching assessment_kind" }
      - { name: risk_band, type: enum, source: computed, description: "LOW | MODERATE | HIGH per variant band thresholds" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACCEPTED | REJECTED" }

  - name: DesignPackage
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; from path" }
      - { name: layout_notes, type: string, source: input, description: "Layout narrative (rooms, open areas)" }
      - { name: mechanical_relocations, type: array, source: input, description: "Array of { system: HVAC|PLUMBING|ELECTRICAL, description, estimated_cents } relocation items; may be empty" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "Starts 1; +1 on every resubmit from REVISION_REQUESTED" }
      - { name: revision_notes, type: string, source: system, description: "Latest homeowner revision request notes", constraints: "null until first request-revision" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | SUPERSEDED" }

  - name: Permit
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; from path" }
      - { name: bedroom_count, type: integer, source: input, description: "Bedrooms in finished basement" }
      - { name: windows, type: array, source: input, description: "Array of { net_clear_sqft, sill_height_in } for each proposed egress window" }
      - { name: ceiling_height_in, type: number, source: input, description: "Main clear ceiling height inches" }
      - { name: finished_area_sqft, type: integer, source: input, description: "Total finished floor area" }
      - { name: low_area_sqft, type: integer, source: input, description: "Floor area with ceiling in [76,84) inches (soffits/beams)" }
      - { name: prohibited_area_sqft, type: integer, source: input, description: "Floor area with ceiling below 76 inches (must be 0)" }
      - { name: pinned_design_id, type: string, source: system, description: "FK -> DesignPackage.id; the project's APPROVED package at permit creation" }
      - { name: pinned_design_revision, type: integer, source: system, description: "revision_number of the project's APPROVED DesignPackage at permit creation" }
      - { name: egress_compliant, type: boolean, source: computed, description: "Rule R1 of calculations.egress_ceiling_compliance; null until submit" }
      - { name: ceiling_compliant, type: boolean, source: computed, description: "Rules R2+R3 of calculations.egress_ceiling_compliance; null until submit" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "+1 on every resubmit from CORRECTIONS_REQUIRED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp when decision ISSUED recorded", constraints: "null until ISSUED" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | CORRECTIONS_REQUIRED | ISSUED | CLOSED | EXPIRED" }

  - name: AllowanceLine
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; from path" }
      - { name: name, type: string, source: input, description: "Allowance bucket name (e.g. flooring, fixtures)" }
      - { name: budgeted_cents, type: integer, source: input, description: "Budgeted amount carried in base contract" }
      - { name: reserved_cents, type: integer, source: computed, default: 0, description: "Sum of draws on PROPOSED change orders touching this line" }
      - { name: drawn_cents, type: integer, source: computed, default: 0, description: "Sum of draws on APPROVED change orders touching this line" }
      - { name: selected, type: boolean, source: system, default: false, description: "True once homeowner selection recorded" }
      - { name: actual_cents, type: integer, source: system, default: 0, description: "Actual selection cost; set by select, re-settable" }
      - { name: remaining_cents, type: integer, source: computed, description: "= budgeted_cents - reserved_cents - drawn_cents - actual_cents" }
      - { name: variance_cents, type: integer, source: computed, description: "= actual_cents + drawn_cents - budgeted_cents; only meaningful when selected=true (else null)" }

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; from path" }
      - { name: scope_description, type: string, source: input, description: "Scope narrative" }
      - { name: kind, type: enum, source: input, description: "ADD | CREDIT — CREDIT forbids allowance_draws and negates the delta" }
      - { name: scope_items, type: array, source: input, description: "Array of { description, qty, unit_cost_cents }; qty >= 1, unit_cost_cents >= 0" }
      - { name: allowance_draws, type: array, source: input, description: "Array of { allowance_line_id, amount_cents }; must be empty for CREDIT" }
      - { name: price_delta_cents, type: integer, source: computed, description: "Per calculations.change_order_pricing (signed; CREDIT negative)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | WITHDRAWN | SUPERSEDED" }

  - name: WorkPhase
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; from path" }
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id; assigned crew" }
      - { name: trade, type: enum, source: input, description: "DEMOLITION | FRAMING | PLUMBING | ELECTRICAL | HVAC | INSULATION | DRYWALL | FLOORING | PAINT | GENERAL" }
      - { name: zone, type: string, source: input, description: "Work zone label within the basement (e.g. REC_ROOM, BEDROOM_1, BATH)" }
      - { name: start_date, type: string, source: input, description: "Planned start, ISO date; half-open interval start" }
      - { name: end_date, type: string, source: input, description: "Planned end, ISO date; half-open interval end (exclusive)" }
      - { name: crew_count, type: integer, source: input, description: "Crew size occupying the home per day" }
      - { name: predecessor_ids, type: array, source: input, description: "Array of WorkPhase.id references forming the sequencing DAG; default []" , default: [] }
      - { name: requires_rough_in, type: boolean, source: computed, description: "True when trade in ROUGH_IN_TRADES { PLUMBING, ELECTRICAL, HVAC }" }
      - { name: pre_block_status, type: enum, source: system, description: "READY | IN_PROGRESS captured when blocked by suspension; restored on resume", constraints: "null unless BLOCKED" }
      - { name: status, type: enum, source: system, description: "PLANNED | READY | IN_PROGRESS | BLOCKED | COMPLETED | CANCELLED" }

  - name: DailySiteLog
    parent: Project
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; from path" }
      - { name: subcontractor_id, type: string, source: system, description: "FK -> Subcontractor.id; stamped from acting Subcontractor identity" }
      - { name: work_date, type: string, source: input, description: "ISO date the work occurred; must not be after current logical clock date" }
      - { name: containment_intact, type: boolean, source: input, description: "Dust barrier/containment intact all day" }
      - { name: hepa_run_hours, type: number, source: input, description: "HEPA scrubber run hours" }
      - { name: noise_db_max, type: number, source: input, description: "Peak measured dB at property line" }
      - { name: cleanup_completed, type: boolean, source: input, description: "Daily cleanup protocol completed" }
      - { name: violation, type: boolean, source: computed, description: "true iff NOT containment_intact OR NOT cleanup_completed OR noise_db_max > NOISE_DB_LIMIT(65)" }
      - { name: strike_applied, type: boolean, source: computed, description: "true iff this log's creation raised strike_count to STRIKE_SUSPEND_THRESHOLD(3) and suspended the project" }

  - name: Inspection
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; from path" }
      - { name: work_phase_id, type: string, source: input, description: "FK -> WorkPhase.id; required iff type=ROUGH_IN, null for FINAL", constraints: "nullable" }
      - { name: type, type: enum, source: input, description: "ROUGH_IN | FINAL" }
      - { name: result_notes, type: string, source: system, description: "Inspector notes recorded with outcome", constraints: "null until resulted" }
      - { name: resulted_at, type: datetime, source: system, description: "Logical-clock timestamp of record-result", constraints: "null until resulted" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PASSED | FAILED | CANCELLED" }

  - name: Certificate
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance (final inspection PASSED)" }
      - { name: warranty_start, type: string, source: system, description: "ISO date = issued_at date" }
      - { name: warranty_end, type: string, source: system, description: "ISO date = warranty_start + WARRANTY_TERM_DAYS(730)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED — EXPIRED by clock sweep when current date > warranty_end" }

  - name: WarrantyClaim
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; from path" }
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id; certificate the claim is filed against" }
      - { name: description, type: string, source: input, description: "Claim narrative" }
      - { name: claimed_cents, type: integer, source: input, description: "Amount claimed; must be > 0" }
      - { name: fresh_slab_moisture_lbs, type: number, source: input, description: "New slab emission reading taken at claim time" }
      - { name: fresh_interior_rh_pct, type: number, source: input, description: "New interior RH reading at claim time" }
      - { name: moisture_recurrence_confirmed, type: boolean, source: computed, description: "true iff fresh_slab_moisture_lbs >= baseline ACCEPTED assessment slab_moisture_lbs + RECURRENCE_DELTA_LBS(1.5)" }
      - { name: coverage_pct, type: number, source: computed, description: "Per calculations.warranty_coverage (100 | 50)" }
      - { name: awarded_cents, type: integer, source: computed, description: "round_half_up(min(claimed_cents, MAX_AWARD_CENTS) * coverage_pct/100); null until APPROVED", constraints: "null until APPROVED; 0 on DENIED" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | APPROVED | DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: INTAKE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: INTAKE
        to: ASSESSMENT
        trigger: "system (first MoistureAssessment created)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: ASSESSMENT
        to: DESIGN
        trigger: "system (a MoistureAssessment becomes ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: DESIGN
        to: PERMITTING
        trigger: "system (a DesignPackage becomes APPROVED; Project.approved_design_id set)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: PERMITTING
        to: SCHEDULING
        trigger: "system (a Permit becomes ISSUED)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: SCHEDULING
        to: IN_PROGRESS
        trigger: "system (first WorkPhase enters IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "system (cleanup_strike_escalation: a violation site-log raises strike_count to 3)"
        actor: system
        preconditions: []
        side_effects:
          - "Every WorkPhase of this project in IN_PROGRESS or READY -> BLOCKED, pre_block_status captured"
          - "Every Inspection of this project in REQUESTED -> CANCELLED"
          - "increments Project.version by 1"
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /api/projects/{id}/resume"
        actor: Contractor
        preconditions:
          - "Project.status == SUSPENDED (else ERR_INVALID_STATE)"
          - "acting Contractor owns the project (contractor_id == X-User-ID, else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "last_resumed_at = current logical clock; strike window re-anchored: strike_count recomputes to 0 (logs created before last_resumed_at excluded)"
          - "Every BLOCKED WorkPhase restores its pre_block_status (READY or IN_PROGRESS); pre_block_status cleared"
          - "increments Project.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (Certificate issued upon FINAL inspection PASSED)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel"
        actor: "Contractor | Homeowner"
        preconditions: ["Homeowner actor must own project; Contractor actor must own project"]
        side_effects: ["All non-terminal WorkPhases -> CANCELLED", "All PROPOSED ChangeOrders -> WITHDRAWN (draws released)", "increments Project.version by 1"]
      - from: ASSESSMENT
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel"
        actor: "Contractor | Homeowner"
        preconditions: ["ownership as above"]
        side_effects: ["same cascade as INTAKE->CANCELLED", "increments Project.version by 1"]
      - from: DESIGN
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel"
        actor: "Contractor | Homeowner"
        preconditions: ["ownership as above"]
        side_effects: ["same cascade as INTAKE->CANCELLED", "increments Project.version by 1"]
      - from: PERMITTING
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel"
        actor: "Contractor | Homeowner"
        preconditions: ["ownership as above"]
        side_effects: ["same cascade as INTAKE->CANCELLED", "increments Project.version by 1"]
      - from: SCHEDULING
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel"
        actor: "Contractor | Homeowner"
        preconditions: ["ownership as above"]
        side_effects: ["same cascade as INTAKE->CANCELLED", "increments Project.version by 1"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel"
        actor: "Contractor | Homeowner"
        preconditions: ["ownership as above"]
        side_effects: ["same cascade as INTAKE->CANCELLED", "increments Project.version by 1"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /api/projects/{id}/cancel"
        actor: "Contractor | Homeowner"
        preconditions: ["ownership as above"]
        side_effects: ["same cascade as INTAKE->CANCELLED", "increments Project.version by 1"]

  - entity: MoistureAssessment
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /api/moisture-assessments/{id}/submit"
        actor: Contractor
        preconditions:
          - "Project.status in {INTAKE, ASSESSMENT, DESIGN} (else ERR_PROJECT_STATE_FORBIDS)"
          - "computed moisture_risk_score band is acceptable for assessment_kind: SCREENING accepts LOW|MODERATE; VERIFICATION accepts only LOW"
        side_effects:
          - "moisture_risk_score and risk_band computed per variant of assessment_kind and persisted"
          - "If Project.status in {INTAKE, ASSESSMENT}: Project -> DESIGN"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /api/moisture-assessments/{id}/submit"
        actor: Contractor
        preconditions: ["band not acceptable for assessment_kind (SCREENING: HIGH; VERIFICATION: MODERATE|HIGH)"]
        side_effects: ["moisture_risk_score and risk_band computed and persisted", "Project status unchanged"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /api/moisture-assessments/{id}/reopen"
        actor: Contractor
        preconditions: ["status == REJECTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "remediation_notes and the four post-remediation readings overwrite prior readings"
          - "assessment_kind forced to VERIFICATION (reopened assessments verify remediation)"
          - "moisture_risk_score/risk_band cleared until next submit"
        note: "cyclic revision loop: REJECTED -> DRAFT -> submit again"

  - entity: DesignPackage
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/design-packages/{id}/submit"
        actor: Contractor
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "Project has an ACCEPTED MoistureAssessment (else ERR_MOISTURE_NOT_CLEARED)"
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /api/design-packages/{id}/submit"
        actor: Contractor
        preconditions:
          - "status == REVISION_REQUESTED (else ERR_INVALID_STATE)"
          - "Project has an ACCEPTED MoistureAssessment (else ERR_MOISTURE_NOT_CLEARED)"
        side_effects: ["revision_number += 1"]
        note: "negotiation cycle: homeowner requests revisions, contractor resubmits"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/design-packages/{id}/approve"
        actor: Homeowner
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
          - "acting Homeowner owns the project (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Any other DesignPackage of this project in APPROVED -> SUPERSEDED"
          - "Project.approved_design_id = this package id"
          - "If Project.status == DESIGN: Project -> PERMITTING"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /api/design-packages/{id}/request-revision"
        actor: Homeowner
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
          - "acting Homeowner owns the project (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["revision_notes recorded"]

  - entity: Permit
    initial_state: DRAFT
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /api/permits/{id}/submit"
        actor: Contractor
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "Project.approved_design_id is not null and that package's revision_number == pinned_design_revision (else ERR_DESIGN_REVISION_STALE)"
          - "egress_ceiling_compliance: egress rule R1 satisfied (else ERR_EGRESS_NONCOMPLIANT)"
          - "egress_ceiling_compliance: ceiling rules R2+R3 satisfied (else ERR_CEILING_NONCOMPLIANT)"
        side_effects: ["egress_compliant and ceiling_compliant computed and persisted"]
      - from: CORRECTIONS_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /api/permits/{id}/submit"
        actor: Contractor
        preconditions:
          - "status == CORRECTIONS_REQUIRED (else ERR_INVALID_STATE)"
          - "pinned_design_revision still equals the current APPROVED package revision_number (else ERR_DESIGN_REVISION_STALE)"
          - "compliance rules R1/R2/R3 re-evaluated and satisfied"
        side_effects: ["amendment_count += 1", "compliance fields recomputed"]
        note: "correction cycle"
      - from: UNDER_REVIEW
        to: ISSUED
        trigger: "POST /api/permits/{id}/record-decision with outcome=ISSUED"
        actor: Inspector
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects:
          - "issued_at = current logical clock"
          - "If Project.status == PERMITTING: Project -> SCHEDULING"
      - from: UNDER_REVIEW
        to: CORRECTIONS_REQUIRED
        trigger: "POST /api/permits/{id}/record-decision with outcome=CORRECTIONS_REQUIRED"
        actor: Inspector
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: ISSUED
        to: CLOSED
        trigger: "system (FINAL inspection PASSED for the project)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (clock sweep on POST /_clock/set_current_utc: current date > issued_at + PERMIT_VALID_DAYS(180) and Project.status != COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AllowanceLine
    initial_state: null
    terminal_states: []
    transitions: []
    note: "No status machine; lifecycle is field-driven (selected flag) under parent Project state gates. See validations."

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/change-orders/{id}/approve"
        actor: Homeowner
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_STATE)"
          - "acting Homeowner owns the project (else ERR_NOT_RESOURCE_OWNER)"
          - "for each draw: AllowanceLine.remaining_cents >= amount_cents at approval time (else ERR_ALLOWANCE_OVERDRAW)"
        side_effects:
          - "Each draw moves from reserved to drawn: line.reserved_cents -= amount, line.drawn_cents += amount; remaining_cents unchanged by the conversion itself"
          - "Project.contract_price_cents recomputed per project_price"
          - "increments Project.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/change-orders/{id}/reject"
        actor: Homeowner
        preconditions: ["status == PROPOSED (else ERR_INVALID_STATE)", "homeowner ownership"]
        side_effects: ["All draws released: line.reserved_cents -= amount (remaining_cents restored)", "increments Project.version by 1"]
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /api/change-orders/{id}/withdraw"
        actor: Contractor
        preconditions: ["status == PROPOSED (else ERR_INVALID_STATE)", "contractor ownership"]
        side_effects: ["All draws released (remaining_cents restored)", "increments Project.version by 1"]
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (a new ChangeOrder is created on the same Project)"
        actor: system
        preconditions: []
        side_effects: ["All draws released (remaining_cents restored)"]

  - entity: WorkPhase
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: READY
        trigger: "system (at creation when predecessor_ids is empty, or when the last incomplete predecessor becomes COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "topological gate driven by phase_sequence_gate calculation"
      - from: READY
        to: IN_PROGRESS
        trigger: "POST /api/work-phases/{id}/start"
        actor: Subcontractor
        preconditions:
          - "status == READY (else ERR_INVALID_STATE)"
          - "acting Subcontractor.id == subcontractor_id (else ERR_NOT_RESOURCE_OWNER)"
          - "Project.status in {SCHEDULING, IN_PROGRESS} (else ERR_PROJECT_STATE_FORBIDS)"
        side_effects: ["If Project.status == SCHEDULING: Project -> IN_PROGRESS"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/work-phases/{id}/complete"
        actor: Subcontractor
        preconditions:
          - "status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "acting Subcontractor.id == subcontractor_id (else ERR_NOT_RESOURCE_OWNER)"
          - "If requires_rough_in: a PASSED ROUGH_IN Inspection with work_phase_id == this phase exists (else ERR_ROUGH_IN_REQUIRED)"
        side_effects:
          - "Each successor WorkPhase (predecessor_ids contains this id) whose remaining predecessors are all COMPLETED: PLANNED -> READY"
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "system (Project -> SUSPENDED via strike escalation)"
        actor: system
        preconditions: []
        side_effects: ["pre_block_status = IN_PROGRESS"]
      - from: READY
        to: BLOCKED
        trigger: "system (Project -> SUSPENDED via strike escalation)"
        actor: system
        preconditions: []
        side_effects: ["pre_block_status = READY"]
      - from: BLOCKED
        to: READY
        trigger: "system (Project resume when pre_block_status == READY)"
        actor: system
        preconditions: []
        side_effects: ["pre_block_status cleared"]
      - from: BLOCKED
        to: IN_PROGRESS
        trigger: "system (Project resume when pre_block_status == IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: ["pre_block_status cleared"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/work-phases/{id}/cancel or system (Project cancelled)"
        actor: "Contractor | system"
        preconditions: ["contractor actor must own the project (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: ["Successors depending solely on this phase remain PLANNED (predecessor never COMPLETED)"]
      - from: READY
        to: CANCELLED
        trigger: "POST /api/work-phases/{id}/cancel or system (Project cancelled)"
        actor: "Contractor | system"
        preconditions: ["contractor actor must own the project (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (Project cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: CANCELLED
        trigger: "system (Project cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Inspection
    initial_state: REQUESTED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: PASSED
        trigger: "POST /api/inspections/{id}/record-result with outcome=PASSED"
        actor: Inspector
        preconditions: ["status == REQUESTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "resulted_at = current logical clock; result_notes recorded"
          - "If type == FINAL: create Certificate (issued_at = now, warranty window set); Permit of this project in ISSUED -> CLOSED; Project IN_PROGRESS -> COMPLETED"
      - from: REQUESTED
        to: FAILED
        trigger: "POST /api/inspections/{id}/record-result with outcome=FAILED"
        actor: Inspector
        preconditions: ["status == REQUESTED (else ERR_INVALID_STATE)"]
        side_effects: ["resulted_at = current logical clock; result_notes recorded"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (Project suspension cascade cancels outstanding requests)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep on POST /_clock/set_current_utc: current date > warranty_end)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: UNDER_REVIEW
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/warranty-claims/{id}/decide with outcome=APPROVED"
        actor: Contractor
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "acting Contractor owns the project (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["moisture_recurrence_confirmed, coverage_pct, awarded_cents computed and persisted"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/warranty-claims/{id}/decide with outcome=DENIED"
        actor: Contractor
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)", "contractor ownership"]
        side_effects: ["awarded_cents = 0"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: change-order-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /api/projects/{id}/change-orders"
    occ_field: "expected_project_version"
    description: |
      Creating a ChangeOrder against a Project whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just created a change order (which legitimately
      supersedes every PROPOSED change order on the project under the
      ChangeOrder machine) and the current writer's view of the project is
      therefore stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: moisture_risk_score
    trigger: "POST /api/moisture-assessments/{id}/submit (and reopen overwrites readings then clears score until next submit)"
    algorithm: weighted_scoring
    formula: |
      slab_pts: SCREENING: 0 if slab_moisture_lbs <= 3.0; 25 if 3.0 < slab <= 5.0; 50 if slab > 5.0
                VERIFICATION: 0 if slab <= 2.0; 25 if 2.0 < slab <= 4.0; 50 if slab > 4.0
      rh_pts:   SCREENING: 0 if interior_rh_pct <= 60; 15 if 60 < rh <= 70; 30 if rh > 70
                VERIFICATION: 0 if rh <= 55; 15 if 55 < rh <= 65; 30 if rh > 65
      effl_pts = 20 if efflorescence_observed else 0
      grad_pts = 15 if grading_deficit else 0
      score = slab_pts + rh_pts + effl_pts + grad_pts
      band: SCREENING: LOW if score <= 24; MODERATE if 25 <= score <= 49; HIGH if score >= 50
            VERIFICATION: LOW if score <= 15; MODERATE if 16 <= score <= 39; HIGH if score >= 40
      acceptance: SCREENING accepts LOW|MODERATE; VERIFICATION accepts LOW only
    input_set: "the assessment's own four readings; variant selected by assessment_kind"
    constants:
      SCREEN_SLAB_T1: 3.0
      SCREEN_SLAB_T2: 5.0
      SCREEN_RH_T1: 60
      SCREEN_RH_T2: 70
      VERIF_SLAB_T1: 2.0
      VERIF_SLAB_T2: 4.0
      VERIF_RH_T1: 55
      VERIF_RH_T2: 65
    precision: "integer score (all point values are integers)"
    variants:
      - name: SCREENING
        when: "assessment_kind == SCREENING (initial pre-design assessment)"
        difference: "looser thresholds; identical readings score lower than under VERIFICATION (e.g. slab 3.0 / RH 60 scores 0 here, 40 there)"
      - name: VERIFICATION
        when: "assessment_kind == VERIFICATION (post-remediation verification; only creatable after a REJECTED assessment exists; reopen forces this kind)"
        difference: "tighter slab/RH thresholds and band cutoffs; accepts LOW band only"

  - name: egress_ceiling_compliance
    trigger: "POST /api/permits/{id}/submit (initial and every resubmit)"
    algorithm: threshold
    formula: |
      R1 (egress): count(windows w where w.net_clear_sqft >= 5.7 AND w.sill_height_in <= 44) >= bedroom_count
      R2 (ceiling coverage): (finished_area_sqft - low_area_sqft - prohibited_area_sqft) * 2 >= finished_area_sqft
      R3 (prohibited area): prohibited_area_sqft == 0
      egress_compliant = R1; ceiling_compliant = R2 AND R3
      Evaluation/reporting order: R1 first, then R2/R3 — if R1 fails, submit rejects with
      ERR_EGRESS_NONCOMPLIANT even when R2/R3 also fail.
    input_set: "the permit's own bedroom_count, windows[], finished_area_sqft, low_area_sqft, prohibited_area_sqft"
    constants:
      EGRESS_NET_CLEAR_MIN_SQFT: 5.7
      EGRESS_SILL_MAX_IN: 44
      CEILING_FULL_HEIGHT_IN: 84
      CEILING_MIN_HABITABLE_IN: 76
      FULL_HEIGHT_AREA_MIN_PCT: 0.5
    precision: "exact comparisons; area test multiplied by 2 to avoid float division"

  - name: change_order_pricing
    trigger: "POST /api/projects/{id}/change-orders (at creation; result persisted as price_delta_cents)"
    algorithm: tiered_pricing
    formula: |
      MARKUP = 0.15 applied per scope item.
      ROUNDING ORDER (pinned): for each scope item i:
        line_cents_i = round_half_up(qty_i * unit_cost_cents_i * (1 + MARKUP))
      items_total_cents = sum(line_cents_i)
      (The alternative order — sum qty*unit first, then apply markup and round once — is
      FORBIDDEN; it produces different cents, e.g. items [{1,101},{1,103}] give 234 pinned
      here vs 235 under sum-first.)
      draws_total_cents = sum(allowance_draws[].amount_cents)   # ADD only; CREDIT must have empty draws
      if kind == ADD:    price_delta_cents = items_total_cents - draws_total_cents
      if kind == CREDIT: price_delta_cents = -items_total_cents
    input_set: "the change order's scope_items[] and allowance_draws[]"
    constants:
      MARKUP_PCT: 0.15
    precision: "whole cents, round_half_up per line item before summation"

  - name: project_price
    trigger: "recomputed on change-order create/approve/reject/withdraw/supersede and on allowance-line select; surfaced on Project reads as contract_price_cents + price_variant"
    algorithm: aggregation
    formula: |
      approved_delta_total = sum(price_delta_cents of APPROVED ChangeOrders of the project)
      variance_total = sum(variance_cents of AllowanceLines where selected == true)
      unselected_contingency = round_half_up(CONTINGENCY_PCT * sum(budgeted_cents - drawn_cents over AllowanceLines where selected == false))
      price_variant = FINAL if (count(AllowanceLines) == 0 OR every line selected) else PROVISIONAL
      if FINAL:       contract_price_cents = base_contract_cents + approved_delta_total + variance_total
      if PROVISIONAL: contract_price_cents = base_contract_cents + approved_delta_total + variance_total + unselected_contingency
      Evaluation order (pinned): (1) per-item CO pricing -> deltas; (2) reserve/draw moves on lines;
      (3) variance per selected line; (4) contingency over unselected lines; (5) sum.
    input_set: "all AllowanceLines and APPROVED ChangeOrders of the project"
    constants:
      CONTINGENCY_PCT: 0.10
    precision: "whole cents, round_half_up on contingency"
    variants:
      - name: PROVISIONAL
        when: "at least one allowance line is unselected"
        difference: "adds 10% contingency on unselected lines' (budgeted - drawn); ignores unselected actuals (none exist)"
      - name: FINAL
        when: "zero allowance lines exist or every line is selected"
        difference: "no contingency; selected-line variances only — for identical base data with one unselected 100000-cent line, PROVISIONAL reports base+10000 while FINAL-after-selection reports base+actual-budgeted"

  - name: phase_sequence_gate
    trigger: "WorkPhase creation (cycle check) and every WorkPhase completion (successor promotion)"
    algorithm: topological
    formula: |
      At creation: adding edges predecessor_id -> new_phase for each predecessor_ids entry MUST keep
      the project's phase graph acyclic; a path from new_phase back to any of its predecessors via
      existing edges => reject with ERR_PHASE_CYCLE. Predecessors must reference existing,
      non-CANCELLED WorkPhases of the same project.
      Readiness: a phase is READY iff status != CANCELLED and every predecessor is COMPLETED.
      Promotion on completion: successors of the completed phase (same project, predecessor_ids
      contains the completed id) with all predecessors COMPLETED move PLANNED -> READY.
      Processing order when multiple successors promote: created_at ASC (never id).
    input_set: "WorkPhases of the same project, excluding CANCELLED"
    precision: "n/a (graph predicate)"

  - name: zone_schedule_overlap
    trigger: "POST /api/projects/{id}/work-phases (at creation)"
    algorithm: interval_merge
    formula: |
      Each phase occupies the half-open interval [start_date, end_date) in its zone.
      OVERLAP: reject ERR_ZONE_SCHEDULE_OVERLAP if the new phase's interval intersects any
      non-CANCELLED phase's interval in the SAME zone (intersection under half-open semantics:
      a.start < b.end AND b.start < a.end; touching endpoints (a.end == b.start) do NOT overlap).
      DUST BUFFER: if the same-zone existing phase has trade == DRYWALL, the new phase must satisfy
      new.start_date >= existing.end_date + DRYWALL_BUFFER_DAYS(2); adjacency alone is insufficient.
      Applies symmetrically (existing DRYWALL after new phase also constrains).
    input_set: "non-CANCELLED WorkPhases of the same project in the same zone"
    constants:
      DRYWALL_BUFFER_DAYS: 2

  - name: daily_crew_capacity
    trigger: "POST /api/projects/{id}/work-phases (at creation)"
    algorithm: threshold
    formula: |
      Occupied-home rule: for every calendar date d covered by the new phase's [start_date, end_date),
      sum(crew_count over non-CANCELLED phases of the project whose interval covers d, including the
      new phase) <= MAX_DAILY_CREW(4); otherwise reject ERR_CREW_CAPACITY_EXCEEDED.
      Aggregate-capacity semantics: no per-zone decomposition; dates are whole days; the cap is
      inclusive (sum == 4 is allowed).
    input_set: "non-CANCELLED WorkPhases of the same project"
    constants:
      MAX_DAILY_CREW: 4

  - name: cleanup_strike_escalation
    trigger: "POST /api/projects/{id}/site-logs (at creation, after violation flag computed)"
    algorithm: chronological
    formula: |
      violation = (NOT containment_intact) OR (NOT cleanup_completed) OR (noise_db_max > NOISE_DB_LIMIT(65))
      Window: the trailing 14 days ending at the current logical clock date, inclusive:
      [today - 13 days, today]. After a resume, the window anchors at the resume date
      (logs before the resume date are excluded).
      strike_count = count(site-logs of the project with violation == true and work_date inside window,
      and, when the project was previously resumed, created_at after the last resume timestamp).
      Logs are counted in work_date order; ties broken by created_at ASC (never id).
      If strike_count >= STRIKE_SUSPEND_THRESHOLD(3): Project IN_PROGRESS -> SUSPENDED (cascade per
      Project machine) and this log's strike_applied = true; else strike_applied = false.
    input_set: "violation DailySiteLogs of the project within the rolling window"
    constants:
      NOISE_DB_LIMIT: 65
      STRIKE_WINDOW_DAYS: 14
      STRIKE_SUSPEND_THRESHOLD: 3

  - name: warranty_coverage
    trigger: "POST /api/warranty-claims/{id}/decide with outcome=APPROVED (also computed read-only at claim creation for coverage_pct preview)"
    algorithm: decay_function
    formula: |
      elapsed_days = (claim created_at date) - certificate.warranty_start, in whole days >= 0
      baseline = slab_moisture_lbs of the project's baseline ACCEPTED MoistureAssessment
      (selector: ACCEPTED assessments of the project, latest created_at ASC-wins — i.e. most recent;
      never id tie-break)
      moisture_recurrence_confirmed = fresh_slab_moisture_lbs >= baseline + RECURRENCE_DELTA_LBS(1.5)
      if moisture_recurrence_confirmed: coverage_pct = 100        # recurrence policy override
      elif elapsed_days <= FULL_COVERAGE_DAYS(365): coverage_pct = 100
      elif elapsed_days <= WARRANTY_TERM_DAYS(730): coverage_pct = 50
      awarded_cents = round_half_up(min(claimed_cents, MAX_AWARD_CENTS(200000)) * coverage_pct / 100)
    input_set: "the claim, its certificate, and the project's baseline ACCEPTED MoistureAssessment"
    constants:
      FULL_COVERAGE_DAYS: 365
      WARRANTY_TERM_DAYS: 730
      RECURRENCE_DELTA_LBS: 1.5
      MAX_AWARD_CENTS: 200000
    precision: "whole cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "entity-backed identity matches resource ownership (Contractor/Homeowner own the project; Subcontractor is assigned to the phase or to a non-terminal phase of the project for site-logs)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "scoped mutating endpoints" }
  - { priority: 4, category: existence, check: "path identifiers exist and nest correctly (left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "request-body references exist (homeowner_id, subcontractor_id, predecessor_ids, work_phase_id, certificate_id, allowance_draws[].allowance_line_id)", error_id: ERR_REFERENCED_NOT_FOUND, http_status: 404, applies_to: "creation endpoints with body FKs" }
  - { priority: 6, category: concurrency, check: "expected_project_version == current Project.version on change-order creation", error_id: ERR_STALE_PROJECT_VERSION, http_status: 412, applies_to: "POST /api/projects/{id}/change-orders" }
  - { priority: 7, category: state, check: "Project.status permits the child operation (assessments: INTAKE/ASSESSMENT/DESIGN; design: ASSESSMENT/DESIGN/PERMITTING; permits: PERMITTING; allowance-lines: INTAKE..IN_PROGRESS excluding SUSPENDED; change-orders: INTAKE..IN_PROGRESS excluding SUSPENDED; work-phases: SCHEDULING/IN_PROGRESS; site-logs: IN_PROGRESS; inspections: IN_PROGRESS; warranty-claims: COMPLETED)", error_id: ERR_PROJECT_STATE_FORBIDS, http_status: 409, applies_to: "child-creation endpoints under /api/projects/{id}" }
  - { priority: 8, category: state, check: "target entity is in a from-state that lists this transition (e.g. submit from DRAFT/REVISION_REQUESTED, approve from SUBMITTED, start from READY, decide from UNDER_REVIEW)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: state, check: "terminal entities reject every further mutation (COMPLETED/CANCELLED project; APPROVED/SUPERSEDED package; CLOSED/EXPIRED permit; terminal change order; PASSED/FAILED/CANCELLED inspection; terminal claim)", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 10, category: business_safety, check: "design submit requires an ACCEPTED MoistureAssessment on the project", error_id: ERR_MOISTURE_NOT_CLEARED, http_status: 409, applies_to: "POST /api/design-packages/{id}/submit" }
  - { priority: 11, category: business_safety, check: "permit submit/resubmit requires the pinned (pinned_design_id, pinned_design_revision) pair to still equal the project's currently APPROVED DesignPackage identity and revision_number", error_id: ERR_DESIGN_REVISION_STALE, http_status: 409, applies_to: "POST /api/permits/{id}/submit" }
  - { priority: 12, category: business_safety, check: "egress rule R1 (enough compliant egress windows for bedrooms)", error_id: ERR_EGRESS_NONCOMPLIANT, http_status: 422, applies_to: "POST /api/permits/{id}/submit" }
  - { priority: 13, category: business_safety, check: "ceiling rules R2+R3 (full-height area >= 50%, zero prohibited area)", error_id: ERR_CEILING_NONCOMPLIANT, http_status: 422, applies_to: "POST /api/permits/{id}/submit" }
  - { priority: 14, category: business_constraint, check: "at most one DRAFT MoistureAssessment per project at a time", error_id: ERR_ASSESSMENT_IN_PROGRESS, http_status: 409, applies_to: "POST /api/projects/{id}/moisture-assessments" }
  - { priority: 15, category: business_constraint, check: "VERIFICATION assessment_kind only when a REJECTED assessment exists on the project", error_id: ERR_REASSESSMENT_NOT_ALLOWED, http_status: 409, applies_to: "POST /api/projects/{id}/moisture-assessments" }
  - { priority: 16, category: business_constraint, check: "phase graph stays acyclic and predecessors exist/are non-CANCELLED", error_id: ERR_PHASE_CYCLE, http_status: 422, applies_to: "POST /api/projects/{id}/work-phases" }
  - { priority: 17, category: business_constraint, check: "zone interval overlap incl. DRYWALL 2-day dust buffer", error_id: ERR_ZONE_SCHEDULE_OVERLAP, http_status: 409, applies_to: "POST /api/projects/{id}/work-phases" }
  - { priority: 18, category: business_constraint, check: "daily aggregate crew capacity <= 4", error_id: ERR_CREW_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /api/projects/{id}/work-phases" }
  - { priority: 19, category: business_temporal, check: "site-log work_date must not be after the current logical clock date", error_id: ERR_FUTURE_WORK_DATE, http_status: 422, applies_to: "POST /api/projects/{id}/site-logs" }
  - { priority: 20, category: business_temporal, check: "FINAL inspection request requires no EXPIRED permit on the project", error_id: ERR_PERMIT_EXPIRED, http_status: 409, applies_to: "POST /api/projects/{id}/inspections" }
  - { priority: 21, category: business_temporal, check: "warranty claim created_at date must be <= certificate.warranty_end and certificate status ACTIVE", error_id: ERR_WARRANTY_EXPIRED, http_status: 409, applies_to: "POST /api/projects/{id}/warranty-claims" }
  - { priority: 22, category: business_referential, check: "ROUGH_IN inspection requires work_phase_id of an IN_PROGRESS phase of this project; FINAL requires every WorkPhase of the project COMPLETED or CANCELLED", error_id: ERR_PHASES_INCOMPLETE, http_status: 409, applies_to: "POST /api/projects/{id}/inspections" }
  - { priority: 23, category: business_referential, check: "phase completion for requires_rough_in trades requires a PASSED ROUGH_IN inspection on that phase", error_id: ERR_ROUGH_IN_REQUIRED, http_status: 409, applies_to: "POST /api/work-phases/{id}/complete" }
  - { priority: 24, category: business_fiscal, check: "each change-order draw amount_cents >= 1 and <= AllowanceLine.remaining_cents; draws_total <= items_total; CREDIT orders must have empty allowance_draws", error_id: ERR_ALLOWANCE_OVERDRAW, http_status: 422, applies_to: "POST /api/projects/{id}/change-orders, POST /api/change-orders/{id}/approve" }
  - { priority: 25, category: business_fiscal, check: "warranty claimed_cents > 0; allowance budgeted_cents >= 0; base_contract_cents > 0; scope item qty >= 1 and unit_cost_cents >= 0", error_id: ERR_INVALID_CLAIM_AMOUNT, http_status: 422, applies_to: "POST /api/projects/{id}/warranty-claims, POST /api/projects/{id}/allowance-lines, POST /api/projects, POST /api/projects/{id}/change-orders" }
  - { priority: 26, category: existence, check: "required request fields present, types and enum members valid, dates ISO-formatted with start_date <= end_date", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- identity anchors ---
  - { method: POST, path: "/api/contractors", description: "Register a contractor firm", roles: [PlatformAdmin], code: 201, input: [name, license_no], output: Contractor, side_effects: [] }
  - { method: POST, path: "/api/homeowners", description: "Onboard a homeowner client", roles: [PlatformAdmin, Contractor], code: 201, input: [name, email, phone], output: Homeowner, side_effects: [] }
  - { method: POST, path: "/api/subcontractors", description: "Register a subcontractor", roles: [PlatformAdmin], code: 201, input: [name, trade], output: Subcontractor, side_effects: [] }
  - { method: GET, path: "/api/subcontractors/{id}", description: "Get a subcontractor", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: [], output: Subcontractor, side_effects: [] }
  - { method: GET, path: "/api/subcontractors/{id}/site-logs", description: "List daily site logs filed by a subcontractor", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "DailySiteLog[]", side_effects: [] }

  # --- project ---
  - { method: POST, path: "/api/projects", description: "Create a project (contractor_id stamped from acting Contractor identity)", roles: [Contractor], code: 201, input: [homeowner_id, address, basement_sqft, base_contract_cents], output: Project, side_effects: ["status=INTAKE, strike_count=0, version=1"] }
  - { method: GET, path: "/api/projects", description: "List projects with filters and pagination", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["homeowner_id?", "contractor_id?", "status?", "approved_design_id?", "limit?", "offset?"], output: "Project[]", side_effects: [] }
  - { method: GET, path: "/api/projects/{id}", description: "Get a project (includes computed strike_count, contract_price_cents, price_variant)", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: [], output: Project, side_effects: [] }
  - { method: POST, path: "/api/projects/{id}/resume", description: "Resume a SUSPENDED project after remediation; resets strike window and restores BLOCKED phases", roles: [Contractor], code: 200, input: [remediation_note], output: Project, side_effects: ["SUSPENDED -> IN_PROGRESS", "BLOCKED phases restore pre_block_status", "strike window re-anchored", "increments Project.version by 1"] }
  - { method: POST, path: "/api/projects/{id}/cancel", description: "Cancel a non-terminal project; cascades to phases and proposed change orders", roles: [Contractor, Homeowner], code: 200, input: ["reason?"], output: Project, side_effects: ["non-terminal WorkPhases -> CANCELLED", "PROPOSED ChangeOrders -> WITHDRAWN (draws released)", "increments Project.version by 1"] }

  # --- moisture assessment ---
  - { method: POST, path: "/api/projects/{id}/moisture-assessments", description: "Create a moisture/egress pre-design assessment (DRAFT)", roles: [Contractor], code: 201, input: ["assessment_kind?", slab_moisture_lbs, interior_rh_pct, efflorescence_observed, grading_deficit, egress_windows_existing, ceiling_height_in], output: MoistureAssessment, side_effects: ["first assessment on INTAKE project: Project -> ASSESSMENT"] }
  - { method: GET, path: "/api/projects/{id}/moisture-assessments", description: "List assessments of a project", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "MoistureAssessment[]", side_effects: [] }
  - { method: POST, path: "/api/moisture-assessments/{id}/submit", description: "Submit assessment; computes risk score/band and resolves ACCEPTED or REJECTED", roles: [Contractor], code: 200, input: [], output: MoistureAssessment, side_effects: ["score/band computed per assessment_kind variant", "ACCEPTED on INTAKE/ASSESSMENT project: Project -> DESIGN"] }
  - { method: POST, path: "/api/moisture-assessments/{id}/reopen", description: "Reopen a REJECTED assessment after remediation with new readings; kind forced to VERIFICATION", roles: [Contractor], code: 200, input: [remediation_notes, slab_moisture_lbs, interior_rh_pct, efflorescence_observed, grading_deficit], output: MoistureAssessment, side_effects: ["REJECTED -> DRAFT", "readings overwritten", "assessment_kind=VERIFICATION"] }

  # --- design package ---
  - { method: POST, path: "/api/projects/{id}/design-packages", description: "Create a layout design package with mechanical relocation items (DRAFT)", roles: [Contractor], code: 201, input: [layout_notes, mechanical_relocations], output: DesignPackage, side_effects: ["revision_number=1"] }
  - { method: GET, path: "/api/projects/{id}/design-packages", description: "List design packages of a project", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "DesignPackage[]", side_effects: [] }
  - { method: GET, path: "/api/design-packages/{id}", description: "Get a design package", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: [], output: DesignPackage, side_effects: [] }
  - { method: GET, path: "/api/design-packages/{id}/permits", description: "List permits pinning this design package", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "Permit[]", side_effects: [] }
  - { method: POST, path: "/api/design-packages/{id}/submit", description: "Submit package for homeowner review (requires ACCEPTED assessment); resubmit from REVISION_REQUESTED increments revision_number", roles: [Contractor], code: 200, input: [], output: DesignPackage, side_effects: ["DRAFT|REVISION_REQUESTED -> SUBMITTED", "revision_number += 1 on resubmit"] }
  - { method: POST, path: "/api/design-packages/{id}/approve", description: "Homeowner approves a SUBMITTED package; supersedes any previously APPROVED package", roles: [Homeowner], code: 200, input: [], output: DesignPackage, side_effects: ["SUBMITTED -> APPROVED", "prior APPROVED -> SUPERSEDED", "Project.approved_design_id set", "DESIGN -> PERMITTING"] }
  - { method: POST, path: "/api/design-packages/{id}/request-revision", description: "Homeowner requests revisions on a SUBMITTED package", roles: [Homeowner], code: 200, input: [revision_notes], output: DesignPackage, side_effects: ["SUBMITTED -> REVISION_REQUESTED", "revision_notes recorded"] }

  # --- permit ---
  - { method: POST, path: "/api/projects/{id}/permits", description: "Create a permit application; pins the current APPROVED design package identity and revision", roles: [Contractor], code: 201, input: [bedroom_count, windows, ceiling_height_in, finished_area_sqft, low_area_sqft, prohibited_area_sqft], output: Permit, side_effects: ["pinned_design_id and pinned_design_revision = current APPROVED package id and revision_number"] }
  - { method: GET, path: "/api/projects/{id}/permits", description: "List permits of a project", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "Permit[]", side_effects: [] }
  - { method: POST, path: "/api/permits/{id}/submit", description: "Submit (or resubmit after corrections) permit; runs egress/ceiling compliance", roles: [Contractor], code: 200, input: [], output: Permit, side_effects: ["compliance computed", "DRAFT|CORRECTIONS_REQUIRED -> UNDER_REVIEW", "amendment_count += 1 on resubmit"] }
  - { method: POST, path: "/api/permits/{id}/record-decision", description: "Inspector records ISSUED or CORRECTIONS_REQUIRED", roles: [Inspector], code: 200, input: [outcome, "notes?"], output: Permit, side_effects: ["UNDER_REVIEW -> ISSUED | CORRECTIONS_REQUIRED", "ISSUED: issued_at set; PERMITTING project -> SCHEDULING"] }

  # --- allowances ---
  - { method: POST, path: "/api/projects/{id}/allowance-lines", description: "Create an allowance budget line", roles: [Contractor], code: 201, input: [name, budgeted_cents], output: AllowanceLine, side_effects: ["remaining_cents=budgeted_cents", "project price recomputed"] }
  - { method: GET, path: "/api/projects/{id}/allowance-lines", description: "List allowance lines of a project", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "AllowanceLine[]", side_effects: [] }
  - { method: POST, path: "/api/allowance-lines/{id}/select", description: "Homeowner records/revises actual selection cost; recomputes variance and project price", roles: [Homeowner], code: 200, input: [actual_cents], output: AllowanceLine, side_effects: ["selected=true, actual_cents set", "variance_cents and remaining_cents recomputed", "project price recomputed", "increments Project.version by 1"] }

  # --- change orders ---
  - { method: POST, path: "/api/projects/{id}/change-orders", description: "Create a change order (OCC on expected_project_version); supersedes all existing PROPOSED orders; reserves allowance draws", roles: [Contractor], code: 201, input: [scope_description, kind, scope_items, allowance_draws, expected_project_version], output: ChangeOrder, side_effects: ["price_delta_cents computed per change_order_pricing", "draws reserved on lines", "existing PROPOSED ChangeOrders -> SUPERSEDED (draws released)", "increments Project.version by 1"] }
  - { method: GET, path: "/api/projects/{id}/change-orders", description: "List change orders of a project", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["status?", "limit?", "offset?"], output: "ChangeOrder[]", side_effects: [] }
  - { method: POST, path: "/api/change-orders/{id}/approve", description: "Homeowner approves a PROPOSED change order; converts reserved draws to drawn; reprices project", roles: [Homeowner], code: 200, input: [], output: ChangeOrder, side_effects: ["PROPOSED -> APPROVED", "reserved -> drawn per draw", "project price recomputed", "increments Project.version by 1"] }
  - { method: POST, path: "/api/change-orders/{id}/reject", description: "Homeowner rejects a PROPOSED change order; releases draws", roles: [Homeowner], code: 200, input: ["reason?"], output: ChangeOrder, side_effects: ["PROPOSED -> REJECTED", "draws released", "increments Project.version by 1"] }
  - { method: POST, path: "/api/change-orders/{id}/withdraw", description: "Contractor withdraws a PROPOSED change order; releases draws", roles: [Contractor], code: 200, input: [], output: ChangeOrder, side_effects: ["PROPOSED -> WITHDRAWN", "draws released", "increments Project.version by 1"] }

  # --- work phases ---
  - { method: POST, path: "/api/projects/{id}/work-phases", description: "Create a sequenced work phase (DAG edges via predecessor_ids; zone overlap + dust buffer + crew capacity enforced)", roles: [Contractor], code: 201, input: [trade, zone, start_date, end_date, crew_count, subcontractor_id, "predecessor_ids?"], output: WorkPhase, side_effects: ["status=READY if no predecessors else PLANNED", "requires_rough_in derived from trade"] }
  - { method: GET, path: "/api/projects/{id}/work-phases", description: "List phases of a project", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["status?", "limit?", "offset?"], output: "WorkPhase[]", side_effects: [] }
  - { method: GET, path: "/api/work-phases/{id}", description: "Get a work phase", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: [], output: WorkPhase, side_effects: [] }
  - { method: GET, path: "/api/work-phases", description: "List phases across projects (reverse lookup by subcontractor)", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["subcontractor_id?", "project_id?", "status?", "limit?", "offset?"], output: "WorkPhase[]", side_effects: [] }
  - { method: POST, path: "/api/work-phases/{id}/start", description: "Assigned subcontractor starts a READY phase", roles: [Subcontractor], code: 200, input: [], output: WorkPhase, side_effects: ["READY -> IN_PROGRESS", "first start: Project SCHEDULING -> IN_PROGRESS"] }
  - { method: POST, path: "/api/work-phases/{id}/complete", description: "Assigned subcontractor completes a phase (rough-in trades need PASSED rough-in first); promotes successors", roles: [Subcontractor], code: 200, input: [], output: WorkPhase, side_effects: ["IN_PROGRESS -> COMPLETED", "successors with all predecessors COMPLETED: PLANNED -> READY"] }
  - { method: POST, path: "/api/work-phases/{id}/cancel", description: "Contractor cancels a PLANNED or READY phase (scope decommit)", roles: [Contractor], code: 200, input: ["reason?"], output: WorkPhase, side_effects: ["PLANNED|READY -> CANCELLED"] }

  # --- daily site logs (containment / noise / cleanup) ---
  - { method: POST, path: "/api/projects/{id}/site-logs", description: "Subcontractor files the daily containment/noise/cleanup log; violations feed strike escalation", roles: [Subcontractor], code: 201, input: [work_date, containment_intact, hepa_run_hours, noise_db_max, cleanup_completed], output: DailySiteLog, side_effects: ["violation computed", "strike_count recomputed", "3rd in-window violation: Project -> SUSPENDED cascade"] }
  - { method: GET, path: "/api/projects/{id}/site-logs", description: "List daily site logs of a project", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "DailySiteLog[]", side_effects: [] }

  # --- inspections ---
  - { method: POST, path: "/api/projects/{id}/inspections", description: "Request a ROUGH_IN (per phase) or FINAL inspection", roles: [Contractor], code: 201, input: [type, "work_phase_id?"], output: Inspection, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/api/projects/{id}/inspections", description: "List inspections of a project", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["type?", "status?", "limit?", "offset?"], output: "Inspection[]", side_effects: [] }
  - { method: GET, path: "/api/work-phases/{id}/inspections", description: "List inspections tied to a phase", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "Inspection[]", side_effects: [] }
  - { method: POST, path: "/api/inspections/{id}/record-result", description: "Inspector records PASSED or FAILED; FINAL pass issues Certificate, closes permit, completes project", roles: [Inspector], code: 200, input: [outcome, "notes?"], output: Inspection, side_effects: ["REQUESTED -> PASSED | FAILED", "FINAL PASSED: create Certificate; Permit ISSUED -> CLOSED; Project IN_PROGRESS -> COMPLETED"] }

  # --- certificates & warranty ---
  - { method: GET, path: "/api/projects/{id}/certificates", description: "List certificates of a project (0..1)", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "Certificate[]", side_effects: [] }
  - { method: GET, path: "/api/certificates/{id}", description: "Get a certificate", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: [], output: Certificate, side_effects: [] }
  - { method: POST, path: "/api/projects/{id}/warranty-claims", description: "Homeowner files a warranty claim with fresh moisture readings (requires COMPLETED project and in-window certificate)", roles: [Homeowner], code: 201, input: [certificate_id, description, claimed_cents, fresh_slab_moisture_lbs, fresh_interior_rh_pct], output: WarrantyClaim, side_effects: ["status=UNDER_REVIEW", "coverage_pct preview computed"] }
  - { method: GET, path: "/api/projects/{id}/warranty-claims", description: "List warranty claims of a project", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["status?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: GET, path: "/api/certificates/{id}/warranty-claims", description: "List claims filed against a certificate", roles: [PlatformAdmin, Contractor, Homeowner, Subcontractor, Inspector], code: 200, input: ["limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: POST, path: "/api/warranty-claims/{id}/decide", description: "Contractor decides APPROVED or DENIED; approval computes recurrence flag, coverage and award", roles: [Contractor], code: 200, input: [outcome, "notes?"], output: WarrantyClaim, side_effects: ["UNDER_REVIEW -> APPROVED | DENIED", "awarded_cents computed per warranty_coverage"] }

  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Startup default before any call is exactly 2026-05-01T00:00:00Z (never wall-clock). Setting the clock triggers the expiry sweep: ISSUED permits older than PERMIT_VALID_DAYS(180) on non-COMPLETED projects -> EXPIRED; ACTIVE certificates past warranty_end -> EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["permit expiry sweep", "certificate expiry sweep"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own/is not assigned to the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not exist or nests under the wrong parent" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 404, condition: "Request-body reference (homeowner, subcontractor, predecessor, phase, certificate, allowance line) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum member, or malformed/reversed dates" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match current Project.version on change-order creation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a from-state that permits the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Entity is in a terminal state; no further transitions" }
  - { id: ERR_PROJECT_STATE_FORBIDS, http: 409, condition: "Project.status does not permit this child operation" }
  - { id: ERR_MOISTURE_NOT_CLEARED, http: 409, condition: "Design submit requires an ACCEPTED moisture assessment" }
  - { id: ERR_DESIGN_REVISION_STALE, http: 409, condition: "Permit's pinned design revision no longer matches the currently APPROVED design revision" }
  - { id: ERR_EGRESS_NONCOMPLIANT, http: 422, condition: "Egress rule R1 failed (insufficient compliant egress windows for bedroom_count)" }
  - { id: ERR_CEILING_NONCOMPLIANT, http: 422, condition: "Ceiling rules R2/R3 failed (full-height area below 50% or prohibited low area present)" }
  - { id: ERR_ASSESSMENT_IN_PROGRESS, http: 409, condition: "A DRAFT moisture assessment already exists on the project" }
  - { id: ERR_REASSESSMENT_NOT_ALLOWED, http: 409, condition: "VERIFICATION assessment requested without a prior REJECTED assessment on the project" }
  - { id: ERR_PHASE_CYCLE, http: 422, condition: "predecessor_ids would create a cycle or reference missing/CANCELLED phases" }
  - { id: ERR_ZONE_SCHEDULE_OVERLAP, http: 409, condition: "Zone interval collision or DRYWALL dust-buffer violation" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 409, condition: "Aggregate daily crew count would exceed 4 in the occupied home" }
  - { id: ERR_FUTURE_WORK_DATE, http: 422, condition: "site-log work_date is after the current logical clock date" }
  - { id: ERR_PERMIT_EXPIRED, http: 409, condition: "FINAL inspection requested while the project's permit is EXPIRED" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "Claim filed after certificate warranty_end or against an EXPIRED certificate" }
  - { id: ERR_PHASES_INCOMPLETE, http: 409, condition: "FINAL inspection requires all phases COMPLETED/CANCELLED; or ROUGH_IN references a phase not IN_PROGRESS" }
  - { id: ERR_ROUGH_IN_REQUIRED, http: 409, condition: "Completing a PLUMBING/ELECTRICAL/HVAC phase requires a PASSED rough-in inspection" }
  - { id: ERR_ALLOWANCE_OVERDRAW, http: 422, condition: "Draw exceeds line remaining_cents, draws exceed items total, or CREDIT order carries draws" }
  - { id: ERR_INVALID_CLAIM_AMOUNT, http: 422, condition: "Non-positive claimed_cents / base_contract_cents, negative budget, or invalid scope item quantities" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator role for seeding identity anchors and driving the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/contractors"
      - "POST /api/subcontractors"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /api/homeowners (with Contractor)"
      - "all GET endpoints"

  - name: Contractor
    description: "The basement remodeling general contractor; owns projects and runs the build"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /api/projects"
      - "POST /api/projects/{id}/resume"
      - "POST /api/projects/{id}/moisture-assessments, submit, reopen"
      - "POST /api/projects/{id}/design-packages, submit"
      - "POST /api/projects/{id}/permits, submit"
      - "POST /api/projects/{id}/allowance-lines"
      - "POST /api/projects/{id}/change-orders, withdraw"
      - "POST /api/projects/{id}/work-phases"
      - "POST /api/work-phases/{id}/cancel"
      - "POST /api/projects/{id}/inspections"
      - "POST /api/warranty-claims/{id}/decide"
    shared_operations:
      - "POST /api/homeowners (with PlatformAdmin)"
      - "POST /api/projects/{id}/cancel (with Homeowner)"
      - "all GET endpoints"

  - name: Homeowner
    description: "The client living in the occupied home; approves design, selections, and change orders; files warranty claims"
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /api/design-packages/{id}/approve"
      - "POST /api/design-packages/{id}/request-revision"
      - "POST /api/allowance-lines/{id}/select"
      - "POST /api/change-orders/{id}/approve"
      - "POST /api/change-orders/{id}/reject"
      - "POST /api/projects/{id}/warranty-claims"
    shared_operations:
      - "POST /api/projects/{id}/cancel (with Contractor)"
      - "all GET endpoints"

  - name: Subcontractor
    description: "Trade crew assigned to work phases; starts/completes own phases and files daily site logs"
    identity: "entity_backed:Subcontractor"
    exclusive_operations:
      - "POST /api/work-phases/{id}/start"
      - "POST /api/work-phases/{id}/complete"
      - "POST /api/projects/{id}/site-logs"
    shared_operations:
      - "all GET endpoints"

  - name: Inspector
    description: "Municipal inspector; records permit decisions and inspection results"
    identity: opaque
    exclusive_operations:
      - "POST /api/permits/{id}/record-decision"
      - "POST /api/inspections/{id}/record-result"
    shared_operations:
      - "all GET endpoints"
