        distinguishing_aspect: |
          A different category pair — `business_safety` (priority 32,
          ERR_LAUNCH_COVERAGE_INSUFFICIENT) against `business_temporal` (priority 36,
          ERR_LAUNCH_DRIVER_OVERBOOKED) — both violated by a single clearance call: the crew is one
          launch short of the computed requirement AND its only driver is already at
          launch_supervision_limit 1 on a strictly overlapping cleared session, so the safety rule
          must surface.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one certified coach, one member acting as SafetyOfficer, one certified launch driver whose launch_supervision_limit is 1, one LEARN_TO_ROW athlete with a current swim test"
            - "two 1X hulls"
            - "one OPEN-posture reading (water 18.0, air 20.0) and one cold reading (water 10.0, air 12.0) whose posture is RESTRICTED"
            - "session A on hull one, 06:00-08:00, PRACTICE, driver assigned, already CLEARED against the OPEN reading (required_launch_count 0)"
            - "session B on hull two, 07:00-09:00 (strictly overlapping A), LEARN_TO_ROW, the same single driver assigned, still PLANNED"
