            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 15000, freight_estimate_cents: 0, lead_time_days: 14 }, as: Vendor, captures: { b_id: $.data.id } }
