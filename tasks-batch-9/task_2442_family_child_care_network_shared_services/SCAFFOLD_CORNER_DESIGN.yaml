  - section: State Machines
    instances:
      - name: license_verification_moves_applicant_to_pending_agreement
        claim_type: Valid Transition
        grounds:
          - state_machines.Provider.APPLICANT_to_PENDING_AGREEMENT
          - endpoints[POST /fccn/providers/{id}/license-verification]
        distinguishing_aspect: "The declared APPLICANT -> PENDING_AGREEMENT transition fires on license-verification, leaving network_posture FROZEN because only PENDING_AGREEMENT's posture mapping applies."
        test_recipe:
          setup:
            - "One APPLICANT Provider."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { st: $.data.membership_status, po: $.data.network_posture, ver: $.data.version }
          assert:
            - "HTTP status is 200"
            - "${st} == PENDING_AGREEMENT and ${po} == FROZEN"
            - "${ver} == 2"

      - name: execute_agreement_twice_second_call_returns_invalid_agreement_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MembershipAgreement.SENT_to_EXECUTED
          - validations[priority=9]
          - errors[ERR_INVALID_AGREEMENT_STATE]
        distinguishing_aspect: "EXECUTED is not a declared from-state of execute, so a second execute returns ERR_INVALID_AGREEMENT_STATE at HTTP 409 and does not re-run the provider activation side effect."
        test_recipe:
          setup:
            - "Provider P1 with one EXECUTED MembershipAgreement, so P1 is ACTIVE with version 3."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
              captures: { st1: $.data.status }
            - call: "GET /fccn/providers/${p1}"
              as: NetworkAdmin
              captures: { pver_after: $.data.version }
          trigger:
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "${st1} == EXECUTED and ${pver_after} == 3"
            - "${err} == ERR_INVALID_AGREEMENT_STATE with HTTP 409"
            - "MembershipAgreement.${ag1}.status == EXECUTED and executed_at unchanged"
            - "Provider.${p1}.version == 3 (the refused call fired no side effect)"

      - name: newly_created_claim_and_order_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.SubsidyClaim.initial_state
          - state_machines.GroupPurchaseOrder.initial_state
          - entities.GroupPurchaseOrder.fields.total_cents
        distinguishing_aspect: "SubsidyClaim is created in DRAFT with every computed cents field at 0, and GroupPurchaseOrder is created in OPEN with total_quantity, discount_pct, subtotal_cents and total_cents all still 0 before commit."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with an ACTIVE SubsidyContract and one subsidy-certified enrollment."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING", "GROUP_PURCHASING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: NetworkAdmin
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv2}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cl1: $.data.id, clst: $.data.status, clprov: $.data.provisional_amount_cents }
            - call: "POST /fccn/group-purchase-orders"
              payload: { provider_id: "${p1}", category: "SUPPLIES", lines: [{ sku: "ART-KIT", unit_price_cents: 1250, quantity: 4 }] }
              as: Provider
              as_user_id: "${p1}"
              captures: { o1: $.data.id, ost: $.data.status, oqty: $.data.total_quantity, ototal: $.data.total_cents }
          assert:
            - "${clst} == DRAFT and ${clprov} == 0 and SubsidyClaim.${cl1}.advance_paid_cents == 0 and final_amount_cents == 0 and paid_cents == 0"
            - "SubsidyClaim.${cl1}.held_from_status == null and hold_reason == null and rejection_reason == null"
            - "${ost} == OPEN and ${oqty} == 0 and ${ototal} == 0"
            - "GroupPurchaseOrder.${o1}.discount_pct == 0 and subtotal_cents == 0 and insurance_admin_fee_cents == 0"

      - name: completed_assignment_is_locked_down_against_accept_and_decline
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SubstituteAssignment.terminal_states
          - validations[priority=9]
          - errors[ERR_INVALID_ASSIGNMENT_STATE]
        distinguishing_aspect: "COMPLETED is a declared terminal staffing state, so neither accept nor decline is possible from it: both return ERR_INVALID_ASSIGNMENT_STATE at HTTP 409 and leave billing_status ACCRUED untouched."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with substitute S1 (STANDARD, rate 2000) and one assignment walked to COMPLETED."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["SUBSTITUTE_POOL"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Rosa Nunez", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2000, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", reason: "ILLNESS", min_credential_level: "NONE", requested_substitute_id: "${s1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa1: $.data.id }
            - call: "POST /fccn/substitute-assignments/${sa1}/accept"
              as: Substitute
              as_user_id: "${s1}"
            - call: "POST /fccn/substitute-assignments/${sa1}/complete"
              as: Provider
              as_user_id: "${p1}"
              captures: { st_done: $.data.staffing_status, bs_done: $.data.billing_status }
          trigger:
            - call: "POST /fccn/substitute-assignments/${sa1}/decline"
              as: Substitute
              as_user_id: "${s1}"
              captures: { err_decline: $.data.error_id }
            - call: "POST /fccn/substitute-assignments/${sa1}/accept"
              as: Substitute
              as_user_id: "${s1}"
              captures: { err_accept: $.data.error_id }
          assert:
            - "${st_done} == COMPLETED and ${bs_done} == ACCRUED"
            - "${err_decline} == ERR_INVALID_ASSIGNMENT_STATE with HTTP 409"
            - "${err_accept} == ERR_INVALID_ASSIGNMENT_STATE with HTTP 409"
            - "SubstituteAssignment.${sa1}.staffing_status == COMPLETED, billing_status == ACCRUED, declined_substitute_ids == [] after both refusals"
            - "SubstituteAssignment.${sa1}.total_cost_cents == 8800 (4 billable hours at 2000 plus the 10 percent coordination fee)"

      - name: coaching_visit_conduct_twice_second_call_returns_invalid_visit_state
        claim_type: Idempotency
        grounds:
          - state_machines.CoachingVisit.SCHEDULED_to_COMPLETED
          - validations[priority=9]
          - errors[ERR_INVALID_VISIT_STATE]
        distinguishing_aspect: "conduct is not idempotent by design: the second call from COMPLETED returns ERR_INVALID_VISIT_STATE at HTTP 409 and must not re-score the provider, so quality_score stays at the value written by the first call."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with one SCHEDULED coaching visit opened by coach-a."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["COACHING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
