            - "dependency unsatisfied — the first publish returns HTTP 422 with error_id ERR_OPEN_APPEALS_IN_PERIOD while Appeal.${ap1_id}.status == INDEPENDENT_REVIEW"
            - "the refused publish left TransparencyReport.${rep_id}.status == COMPUTED and published_at == null"
            - "after the resolve, Appeal.${ap1_id}.status == UPHELD, resolved_at == 2026-08-01T09:00:00Z, reinstated_content == false"
            - "Reviewer.${r1_id}.appealed_count == 1, upheld_appeal_count == 1, accuracy_score_audit_only == null, accuracy_score_blended == 1.0000, status == ACTIVE (sample 1 < MIN_GATE_SAMPLE 2)"
            - "Account.${acct_id}.appeal_credits_remaining == 2 (an UPHELD appeal never refunds), strike_points == 4, standing == LIMITED"
            - "recompute — ${vol_second} == 1, ${appeals_second} == 1, ${rate_second} == 0.0000, and category_rate_breakdown == [{category_code VIOLENT_THREAT, appealed 1, overturned 0, rate 0.0000}]"
            - "dependency satisfied — the second publish returns 200 with status PUBLISHED and published_at == 2026-08-01T09:00:00Z"
  - rule_id: resource_temporal_overlap
    instances:
      - name: wellness_break_half_open_adjacent_accepted_overlap_rejected
        grounds:
          - validations[priority=60]
          - endpoints.POST_/moderation/reviewers/{id}/wellness-break
          - endpoints.POST_/moderation/reviewers/{id}/return-to-duty
          - state_machines.Reviewer.ACTIVE_to_ON_WELLNESS_BREAK
        distinguishing_aspect: |
          Resource entity Reviewer with HALF-OPEN interval semantics: the retained break window
          [wellness_break_start, wellness_break_end) excludes its end instant, so a new break that
          starts exactly at the old end is legal while one starting a single minute earlier is not.
          Implementations that treat the window as closed reject the adjacent request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "Reviewer Rita, FRONTLINE, EN/VIOLENCE, utc_offset_minutes 0, shift 08:00-20:00 local, holds no cases."
            - "Rita took a 60-minute wellness break at 09:00, so her retained window is [2026-08-01T09:00:00Z, 2026-08-01T10:00:00Z), and she has returned to duty."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Rita", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "FRONTLINE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r1_id: $.data.id }
            - call: "POST /moderation/reviewers/${r1_id}/wellness-break"
              payload: { break_minutes: 60, reason: "GRAPHIC_EXPOSURE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { b1_start: $.data.wellness_break_start, b1_end: $.data.wellness_break_end }
            - call: "POST /moderation/reviewers/${r1_id}/return-to-duty"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:59:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "POST /moderation/reviewers/${r1_id}/wellness-break"
              payload: { break_minutes: 30, reason: "GRAPHIC_EXPOSURE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/reviewers/${r1_id}/wellness-break"
              payload: { break_minutes: 30, reason: "GRAPHIC_EXPOSURE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "the retained window is ${b1_start} == 2026-08-01T09:00:00Z and ${b1_end} == 2026-08-01T10:00:00Z"
            - "overlapping — the request at 09:59 for [2026-08-01T09:59:00Z, 2026-08-01T10:29:00Z) returns HTTP 409 with error_id ERR_WELLNESS_BREAK_OVERLAP"
            - "the refused request left Reviewer.${r1_id}.status == ACTIVE, wellness_breaks_taken == 1 and the retained window unchanged"
            - "adjacent — the request at 10:00 for [2026-08-01T10:00:00Z, 2026-08-01T10:30:00Z) returns 200 because the retained window excludes its end instant"
            - "after the adjacent break Reviewer.${r1_id}.status == ON_WELLNESS_BREAK, wellness_break_start == 2026-08-01T10:00:00Z, wellness_break_end == 2026-08-01T10:30:00Z, wellness_breaks_taken == 2"
            - "open_case_count == 0 and exposure_points_today == 0 throughout — Rita held no cases, so the break's return-to-queue side effect is a no-op"
      - name: report_period_closed_interval_shared_endpoint_rejected
        grounds:
          - validations[priority=62]
          - validations[priority=61]
          - endpoints.POST_/moderation/transparency-reports
        distinguishing_aspect: |
          A different resource entity (TransparencyReport) with the OPPOSITE interval semantics:
          reporting periods are CLOSED [period_start, period_end], so touching at a single instant
          IS an intersection and a period starting one second later is not. This is the mirror image
          of the half-open wellness window and must not be implemented with the same comparison.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "One transparency report already covers the closed period [2026-06-01T00:00:00Z, 2026-06-30T00:00:00Z]."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/transparency-reports"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { repA_id: $.data.id, a_end: $.data.period_end }
          trigger:
            - call: "POST /moderation/transparency-reports"
              payload: { period_start: "2026-06-30T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/transparency-reports"
              payload: { period_start: "2026-06-30T00:00:01Z", period_end: "2026-07-31T00:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { repC_id: $.data.id }
          assert:
            - "${a_end} == 2026-06-30T00:00:00Z is INSIDE report A's own period because the interval is closed"
            - "touching — the period starting exactly at 2026-06-30T00:00:00Z returns HTTP 409 with error_id ERR_REPORT_PERIOD_OVERLAP even though it shares only one instant"
            - "one second later — the period starting 2026-06-30T00:00:01Z returns 201 with status DRAFT and variant null"
            - "TransparencyReport.${repA_id} is untouched: status DRAFT, enforcement_volume 0, computed_at null"
            - "GET /moderation/transparency-reports/${repC_id} returns period_start 2026-06-30T00:00:01Z and period_end 2026-07-31T00:00:00Z, so exactly two reports exist"
            - "a period with period_end equal to period_start would instead be ERR_REPORT_PERIOD_INVALID (priority 61, 422), which is NOT what the touching case returns"
  - rule_id: compensating_invariant
    instances:
      - name: strike_point_ledger_restored_by_appeal_overturn
        grounds:
          - calculations.account_strike_ledger
          - calculations.account_standing_posture
          - state_machines.Appeal.INDEPENDENT_REVIEW_to_OVERTURNED
          - entities.ModerationCase.fields.is_overturned
        distinguishing_aspect: |
          Conserved quantity: Account.strike_points as a FULL recompute over decided, non-overturned
          cases. An overturn must not subtract a remembered delta — it must leave the ledger equal to
          the sum of the surviving cases' stored strike_points_applied, which here is 2 and NOT
          6 - 4 computed against a stale multiplier. Standing must fall two steps, from SUSPENDED
          through LIMITED to GOOD_STANDING, in one recompute.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "STANDARD account acct_tau (3 appeal credits) with two TEXT content items of graphic_weight 1."
            - "T2/VIOLENCE category VIOLENT_THREAT with ACTIVE v1 (auto 0.9000, floor 0.4000, appeal_window_hours 72)."
            - "Rita, certified on v1, decided case A REMOVE (4 points) and then case B WARN (ceil(4 * 0.25 * 1.25) == 2 points), so the account sits at strike_points 6, standing SUSPENDED, lifetime_removed_count 1."
            - "The account appealed case A; QA auditor Quinn routed it to SENIOR reviewer Sven, so it is in INDEPENDENT_REVIEW and appeal_credits_remaining is 2."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_tau", region_code: "US", tier: "STANDARD" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { acct_id: $.data.id }
            - call: "POST /moderation/policy-categories"
              payload: { code: "VIOLENT_THREAT", name: "Violent Threat", severity_tier: "T2", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "v1", auto_action_threshold: 0.9000, review_floor: 0.4000, enforcement_action: "REMOVE", appeal_window_hours: 72, review_sla_minutes: 240 }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { pv1_id: $.data.id }
            - call: "POST /moderation/policy-versions/${pv1_id}/back-test"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-versions/${pv1_id}/activate"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-bob"
            - call: "POST /moderation/review-queues"
              payload: { name: "EN Violence", policy_category_id: "${cat_id}", language: "EN", specialty: "VIOLENCE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { q_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Rita", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "FRONTLINE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /moderation/reviewers/${r1_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${r1_v}" }
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Quinn", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "QA" }
              as: TrustSafetyAdmin
