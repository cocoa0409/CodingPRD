            - "after payment: Contractor.${c_id}.invoiced_balance_cents == 0"
            - "invariant: invoiced_balance_cents + payments(10550) == billed totals(10550) at every step"
            - "Contractor.${c_id}.credit_used_cents == 0 after payment"
