            - "One SourceSystem SUP_EMPTY and one PROMOTED batch of a single fully valid record carrying an EMAIL/MARKETING OPT_IN consent signal, so one RESOLVED / NORMAL Profile with one ACTIVE ConsentRecord exists."
            - "ZERO Destinations exist, so nothing downstream can qualify for propagation."
