      - name: host_agreement_amendment_conflicts_are_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=28]
          - errors[ERR_AMENDMENT_IN_PROGRESS]
          - errors[ERR_HOST_AGREEMENT_ALREADY_LIVE]
          - state_machines.HostCommunityAgreement.EXECUTED_to_UNDER_AMENDMENT
        distinguishing_aspect: "Both closing-out errors of the agreement machine live at the same rung but describe different collisions: reopening an amendment on the row that is already UNDER_AMENDMENT, and executing a fresh DRAFT while the site's live agreement is mid-amendment. An EXECUTED (not amending) agreement is superseded instead of blocking, which is the case that must NOT error."
        test_recipe:
          setup:
            - "Landfill LF with three DRAFT agreements HCA-1, HCA-2 and HCA-3."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
