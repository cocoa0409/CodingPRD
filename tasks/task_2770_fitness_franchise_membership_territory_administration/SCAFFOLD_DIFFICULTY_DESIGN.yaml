      - name: agreement_status_and_dues_status_dimensions_advance_independently
        grounds:
          - state_machines.MembershipAgreement.ACTIVE_to_FROZEN
          - state_machines.MembershipAgreement.FROZEN_to_ACTIVE
          - state_machines.MembershipAgreement.CURRENT_to_PAST_DUE
