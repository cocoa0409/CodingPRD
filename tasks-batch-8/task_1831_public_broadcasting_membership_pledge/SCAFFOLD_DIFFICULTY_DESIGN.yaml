            - "Pledge.${plg8_id}.payment_status == WRITTEN_OFF"
            - "PremiumReservation (of ${plg8_id}) .status == RELEASED (cascade link 2)"
            - "PremiumInventoryLot.${lot_mug3_id}.available_qty == 10 and reserved_qty == 0 (compensated)"
            - "${lot_avail} == 10 and ${lot_reserved} == 0"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: capture_on_closed_drive_with_low_amount_state_beats_constraint
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_DRIVE_NOT_OPEN]
          - errors[ERR_LEVEL_OR_PREMIUM_INELIGIBLE]
        distinguishing_aspect: |
          Category pair state vs business_constraint: a pledge capture that
          BOTH targets a non-ON_AIR drive (priority 4) AND is below the level
          minimum (priority 9) must surface ERR_DRIVE_NOT_OPEN, the
          higher-priority state error.
        test_recipe:
          setup:
            - "Level BASIC (min_annual 6000); donor D; membership M; drive DRV still DRAFT (never scheduled)"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "d9@x.com", full_name: "Donor Nine", postal_code: "97209" }
              as: MembershipCoordinator
              captures: { donor9_id: $.data.id }
            - call: "POST /station/memberships"
              payload: { donor_id: "${donor9_id}", level_code: "BASIC" }
              as: MembershipCoordinator
              captures: { mem9_id: $.data.id }
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv9_id: $.data.id }
          trigger:
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor9_id}", membership_id: "${mem9_id}", drive_id: "${drv9_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 100 }
              as: PhoneVolunteer
              captures: { err_state_vs_constraint: $.data.error_id }
          assert:
            - "error_id == ERR_DRIVE_NOT_OPEN (state priority 4 beats business_constraint priority 9)"
            - "${err_state_vs_constraint} == ERR_DRIVE_NOT_OPEN"
            - "no Pledge is created"

      - name: break_create_on_live_drive_with_overlap_state_beats_temporal
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BREAK_OVERLAP]
        distinguishing_aspect: |
          Different category pair — state (drive no longer accepts breaks once
          ON_AIR, priority 4) vs business_temporal (break overlap buffer,
          priority 6): a break creation that BOTH targets an ON_AIR drive AND
          overlaps an existing break's buffer must surface ERR_INVALID_STATE,
          the higher-priority state error — a different error-category pair
          than the state-vs-business_constraint conflict.
        test_recipe:
          setup:
            - "Level BASIC; drive DRV with break B1 [18:00, 18:20), then SCHEDULED and ON_AIR (lineup frozen)"
            - "A new break at 18:22 would overlap B1's 5-minute buffer — but the drive state check fires first"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/pledge-drives"
              payload: { name: "Fall 2026", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", goal_cents: 100000 }
              as: StationAdmin
              captures: { drv10_id: $.data.id, drv10_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv10_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv10_v}" }
              as: StationAdmin
              captures: { brk1_id: $.data.id }
            - call: "POST /station/pledge-drives/${drv10_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv10_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "GET /station/pledge-drives/${drv10_id}"
              payload: {}
              as: StationAdmin
              captures: { drv10_v_live: $.data.version }
          trigger:
            - call: "POST /station/pledge-drives/${drv10_id}/breaks"
              payload: { starts_at: "2026-08-02T18:22:00Z", ends_at: "2026-08-02T18:40:00Z", program_title: "Late Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv10_v_live}" }
              as: StationAdmin
              captures: { err_overlap: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 4 beats business_temporal priority 6, even though the 18:22 start also violates the 5-minute buffer of B1's 18:20 end)"
            - "${err_overlap} == ERR_INVALID_STATE"
            - "no new break is persisted; PledgeDrive.${drv10_id}.version unchanged by the rejected call"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: matching_challenge_exact_goal_triggers_met
        grounds:
          - calculations.matching_challenge_progress
          - state_machines.Pledge.PLEDGED_to_PAID
          - entities.MatchingChallenge.fields.progress_cents
        distinguishing_aspect: |
          Boundary on the challenge-progress metric via POST /station/pledges:
          progress_cents reaching exactly goal_cents (>= comparator, not >)
          flips the challenge to MET — one cent below leaves it OPEN.
        test_recipe:
          setup:
            - "Level BASIC; donor D; membership M; drive DRV ON_AIR"
            - "MatchingChallenge MC: goal 10000, match 50000, status OPEN"
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
