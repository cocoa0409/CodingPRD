  - rule_id: compensating_invariant
    instances:
      - name: charge_void_restores_patient_outstanding_balance_to_zero
        grounds:
          - state_machines.Visit.INVOICED_to_VOIDED
          - calculations.patient_outstanding_balance
          - validations[priority=69]
          - errors[ERR_CHARGE_NOT_VOIDABLE]
          - entities.Patient.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (Patient.outstanding_balance_cents): 0 → 4526 on checkout →
          0 after charge-void, exactly restored with no off-by-one rounding drift, while the
          visit's final_price_cents / patient_responsibility_cents / payer_responsibility_cents are
          deliberately RETAINED for audit — the invariant is restored by excluding VOIDED visits
          from the sum, not by zeroing the visit. A second void is refused.
