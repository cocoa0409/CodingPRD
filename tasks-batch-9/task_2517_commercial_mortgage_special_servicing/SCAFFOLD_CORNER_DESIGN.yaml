              captures: { cmte_certifies_error: "$.data.error_id" }
            - call: "POST /special-servicing/borrower-requests/${request_id}/analysis"
              payload: { npv_recovery_with_request_usd: 12000000, npv_recovery_without_request_usd: 11000000, analysis_discount_rate_pct: 8.0 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { admin_analyses_error: "$.data.error_id" }
            - call: "POST /special-servicing/consultations/sweep"
              payload: { trust_id: "${trust_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { amgr_sweeps_error: "$.data.error_id" }
            - call: "POST /special-servicing/workout-plans"
              payload: { loan_id: "${loan_p_id}", discount_rate_pct: 8.0, npv_basis: "CONTRACTUAL", expected_loan_version: "${loan_p_version}" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { cmte_authors_plan_error: "$.data.error_id" }
            - call: "POST /special-servicing/advances/${advance_id}/status"
              payload: { to_status: "DEEMED_NONRECOVERABLE", reversal_reason: "collateral value below the advance" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { ms_deems_nonrecoverable_error: "$.data.error_id" }
            - call: "POST /special-servicing/borrower-requests/${request_id}/status"
              payload: { to_status: "WITHDRAWN" }
              as: Borrower
              as_user_id: "${loan_q_id}"
              captures: { wrong_borrower_error: "$.data.error_id" }
            - call: "GET /special-servicing/loans/${loan_p_id}"
              as: Borrower
              as_user_id: "${loan_q_id}"
              captures: { wrong_borrower_read_error: "$.data.error_id" }
            - call: "GET /special-servicing/loans/${loan_p_id}"
              as: ControllingClassRepresentative
              as_user_id: "${trust_id}"
              captures: { ccr_reads_loan_error: "$.data.error_id" }
            - call: "GET /special-servicing/advances/${advance_id}"
              as: Borrower
              as_user_id: "${loan_p_id}"
              captures: { borrower_reads_advance_error: "$.data.error_id" }
          assert:
            - "MasterServicer ordering an appraisal, SpecialServicerAssetManager funding an advance, SpecialServicingCommitteeOfficer certifying a report, PlatformAdmin running the servicing standard analysis, SpecialServicerAssetManager running the sweep and SpecialServicingCommitteeOfficer authoring a plan each return HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "The report-certification denial is 403 ERR_ROLE_NOT_PERMITTED even though the report id does not exist — the role gate precedes the existence check"
            - "MasterServicer requesting DEEMED_NONRECOVERABLE returns 403 ERR_ROLE_NOT_PERMITTED_FOR_STATUS, not ERR_ROLE_NOT_PERMITTED: the master servicer may call the advance status endpoint, but only for REVERSED"
            - "A Borrower presenting loan Q's id against loan P's request returns 403 ERR_NOT_RESOURCE_OWNER, and the same mismatch on the loan read returns 403 ERR_NOT_RESOURCE_OWNER — a role denial and an ownership denial are distinct codes"
            - "The controlling class representative reading a loan returns 403 ERR_ROLE_NOT_PERMITTED: GET /loans/{id} does not list that role at all, so no ownership comparison is even attempted"
            - "A Borrower reading an advance returns 403 ERR_ROLE_NOT_PERMITTED — the advance ledger is outside the borrower's read surface even on its own loan"
            - "Every one of the eleven refusals left the database untouched: the request is still SUBMITTED, the advance still OUTSTANDING, and no plan or appraisal row exists"

      - name: the_author_of_a_row_can_never_bless_it
        claim_type: segregation_of_duties
        grounds:
          - roles.SpecialServicingCommitteeOfficer
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation is enforced on X-User-ID, not on the role header, across all three blessing operations at once: the appraisal orderer cannot accept or reject its own appraisal, whoever prepared a plan cannot approve it even while presenting the committee role, and the user who accrued a fee cannot waive it even though waiving is committee-exclusive. Each pair is then completed successfully by a different human, so the guard is not a blanket block."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; loan in SPECIAL_SERVICING with an appraisal ORDERED by amgr-001, a plan prepared by amgr-001 and a fee accrued by ms-001."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V45", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V45", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "IMMINENT_DEFAULT", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "borrower notice of imminent monetary default" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_version: "$.data.version" }
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-06-20T00:00:00Z", appraiser_firm: "Meridian Valuation" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_id: "$.data.id", orderer: "$.data.ordered_by_user_id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 9000000, as_of_date: "2026-07-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { received_status: "$.data.status" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { fee_id: "$.data.id", accruer: "$.data.accrued_by_user_id" }
          trigger:
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { self_accept_error: "$.data.error_id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "REJECTED", rejection_reason: "comparable set unusable" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { self_reject_error: "$.data.error_id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
              captures: { peer_accept_status: "$.data.status" }
            - call: "POST /special-servicing/fee-accruals/${fee_id}/status"
              payload: { to_status: "WAIVED", waived_reason: "fee accrued in error" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "ms-001"
              captures: { self_waive_error: "$.data.error_id" }
            - call: "POST /special-servicing/fee-accruals/${fee_id}/status"
              payload: { to_status: "WAIVED", waived_reason: "fee accrued in error" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { peer_waive_status: "$.data.status" }
            - call: "GET /special-servicing/loans/${loan_id}"
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { loan_version_2: "$.data.version" }
            - call: "POST /special-servicing/workout-plans"
