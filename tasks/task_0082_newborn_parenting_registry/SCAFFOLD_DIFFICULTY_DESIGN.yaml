              as: AttendingNurse
              captures: { nb_id: $.data.id }
            - call: "POST /dependent-enrollments"
              payload: { newborn_id: "${nb_id}", policy_id: "${policy_id}", requested_at: "2026-04-04T10:00:00.000Z" }
              as: BenefitsCoordinator
              captures: { enr_id: $.data.id }
            - call: "GET /insurance-policies/${policy_id}"
              payload: {}
              as: BenefitsCoordinator
              captures: { pol_v: $.data.version }
          trigger:
            - call: "POST /dependent-enrollments/${enr_id}/approve"
