            - "${ps_after_submit} == PROVISIONAL"
            - "${score} == 90.00"
            - "${tier} == RED"
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "HTTP status of the trigger call is 409"
            - "the response error_id is NOT ERR_ALLERGEN_PROGRAM_CONFLICT"
            - "Order.${order_id}.pricing_status == PROVISIONAL"
