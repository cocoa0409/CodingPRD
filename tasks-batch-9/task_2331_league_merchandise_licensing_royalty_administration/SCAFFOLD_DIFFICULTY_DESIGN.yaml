              captures: { lic_k_v: $.data.version }
            - call: "POST /licensing/licensees/${lic_k}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: false, expected_licensee_version: "${lic_k_v}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_k: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_k}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /licensing/players/${player_1}/group-licensing"
              payload: { opt_in: false }
              as: PlayerAgent
              as_user_id: "${player_1}"
            - call: "POST /licensing/players/${player_1}/group-licensing"
              payload: { opt_in: true }
              as: PlayerAgent
              as_user_id: "${player_1}"
          assert:
            - "before the trigger: LicenseAgreement.${agr_k}.approved_sku_count == 1 and RetailerAuthorization.${auth_k}.status == AUTHORIZED"
            - "after opt-out, hop 1: MarkRight.${mark_pg}.status == WITHDRAWN with withdrawn_at set and status_reason recorded; MarkRight.${mark_league}.status is still ACTIVE"
            - "after opt-out, hop 2: ProductSubmission.${sub_k}.status == REVOKED with revocation_reason recorded"
            - "after opt-out, hop 3: LicenseAgreement.${agr_k}.approved_sku_count == 0 and RetailerAuthorization.${auth_k}.status == SUSPENDED with suspension_reason == NO_APPROVED_SKUS"
            - "after opt-out: Player.${player_1}.group_licensing_opt_in == false"
            - "after re-opt-in: MarkRight.${mark_pg}.status == ACTIVE again"
            - "after re-opt-in: ProductSubmission.${sub_k}.status is STILL REVOKED (terminal), LicenseAgreement.${agr_k}.approved_sku_count is STILL 0, RetailerAuthorization.${auth_k}.status is STILL SUSPENDED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_before_review_hold_returns_invalid_state
        grounds:
          - validations.priority_12
          - validations.priority_15
          - errors.ERR_INVALID_STATE
          - errors.ERR_REVIEW_ON_HOLD
        distinguishing_aspect: |
          Priority 12 (state) vs priority 15 (business_safety) on the SAME `submit`
          call: the submission is in SUBMITTED (no `submit` transition leaves SUBMITTED)
          AND review_hold is true (set by the PROBATION posture cascade). Both rules are
          violated; the ordered catalogue demands ERR_INVALID_STATE (409), not
          ERR_REVIEW_ON_HOLD (also 409), so only the error_id distinguishes the orders.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_L ACTIVE; agreement AGR_L ACTIVE on category JERSEY, MG 1000000, required_advance 250000 fully paid, term 2026-01-01..2027-12-31"
            - "one submission on AGR_L is moved DRAFT -> SUBMITTED and left there"
            - "three EnforcementActions naming LIC_L reach SEIZURE_ORDERED at 2026Q3 (3 * 15 == 45)"
            - "quarter-close 2026Q3 moves the posture CLEAR -> PROBATION, which sets review_hold = true on the SUBMITTED submission"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
