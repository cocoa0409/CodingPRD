              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "b2@x.com", full_name: "B2 H", residence_zip: "10001" }
              as: Underwriter
              captures: { ph_b2: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_b2}", coverage_type: "ALL_RISK", valuation_basis: "AGREED_VALUE", deductible_option: "STANDARD" }
              as: Underwriter
              captures: { pol_b2: $.data.id }
            - call: "POST /policies/${pol_b2}/scheduled-items"
              payload: { description: "Ring", category: "RING", location_zip: "10001", scheduled_value_cents: 1000000 }
              as: Underwriter
            - call: "POST /policies/${pol_b2}/bind"
              payload: {}
