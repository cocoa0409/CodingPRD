  # =========================================================================
  - section: consistency_model
    instances:

      - name: departure_cascade_is_fully_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - state_machines.Tow.SEALED_to_UNDERWAY
          - state_machines.FleetingAssignment.RESERVED_to_RELEASED
          - state_machines.FreightContract.ACTIVE_to_IN_TRANSIT
        distinguishing_aspect: "The consistency model is immediate: the single depart call must, before it responds, move the tow to UNDERWAY, the assignment to LOADED, the contract to IN_TRANSIT and the barge's RESERVED fleeting row to RELEASED with fee_cents fixed at 90000 from the departure instant - every one of them readable on the very next request with no settling delay."
        test_recipe:
          setup:
            - "GRAIN reference data; an ACTIVE contract; a berth reservation for BL-1001 over [2026-08-12T12:00Z, 2026-08-20T00:00Z) tied to that contract; a SEALED tow carrying BL-1001 at 1700 tons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: WaterwayAdmin
