            - { call: "POST /screening-events/${e3}/publish", payload: { expected_event_version: "${e3v}" }, as: ProgramManager }
            - { call: "POST /appointments", payload: { event_id: "${e3}", participant_id: "${part_id}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { a3: $.data.id } }
