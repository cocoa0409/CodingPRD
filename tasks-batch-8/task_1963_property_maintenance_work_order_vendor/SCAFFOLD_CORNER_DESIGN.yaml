              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id, wo_v1: $.data.version }
          trigger:
            - call: "PATCH /work-orders/${wo_id}"
              payload: { expected_work_order_version: "${wo_v1}", priority: "EMERGENCY" }
              as: Dispatcher
              captures: { pri: $.data.priority, rd: $.data.response_due_at, cd: $.data.completion_due_at, v: $.data.version }
          assert:
            - "priority == EMERGENCY"
            - "response_due_at == 2026-08-01T04:00:00Z (created_at + 4h)"
            - "completion_due_at == 2026-08-02T00:00:00Z (created_at + 24h)"
            - "version == 2"

      - name: cancel_releases_reserved_parts
        claim_type: action_endpoint
        grounds: ["endpoints[POST /work-orders/{id}/cancel]", state_machines.WorkOrder.ASSIGNED_to_CANCELLED, state_machines.WorkOrderPart.RESERVED_to_RELEASED]
        distinguishing_aspect: "Cancelling an ASSIGNED order releases its RESERVED parts: part stock returns from (on_hand 1, reserved 2) to (on_hand 3, reserved 0) and the line is RELEASED."
        test_recipe:
          setup: ["work order ASSIGNED with 2 units of a part (initial_stock 3) reserved"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cxl Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "505", full_name: "R Cxl", email: "rcxl@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "CLP-1", name: "Clamp", unit_cost_cents: 30, reorder_level: 0, initial_stock: 3 }
              as: PropertyManager
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Clamp job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { part_id: "${part_id}", quantity: 2 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wop_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { reason: "resident unavailable" }
