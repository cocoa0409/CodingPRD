            - *c_conveneA
            - *c_voteA
            - *c_rulemaking
            - *c_ruleA
            - *c_ruleA_filed
            - *c_ruleA_published
            - *c_j1
            - call: "POST /training-sessions"
              payload: { adoption_rule_id: "${rule_id}", host_jurisdiction_id: "${j1_id}", discipline: "ENERGY", audience: "BUILDING_OFFICIAL", seat_capacity: 40, starts_at: "2027-01-10T09:00:00Z", ends_at: "2027-01-10T13:00:00Z" }
