      - name: subscription_pause_windows_are_closed_so_touching_endpoints_collide
        grounds:
          - validations[priority=64]
          - state_machines.Subscription.pause_subscription
          - state_machines.Subscription.resume_subscription
          - entities.Subscription.fields.pause_windows
          - errors[ERR_PAUSE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: the
          Subscription's pause windows are CLOSED intervals, so a new window
          starting exactly on 2026-05-11 — the inclusive end of the existing
          [2026-05-05, 2026-05-11] — collides, whereas the same window starting
          one day later is accepted. The vessel instance rejects only strict
          interior overlap.
        test_recipe:
          setup:
            - "Clock at 2026-05-01. One recipe and one ACTIVE subscription on it."
            - "One completed pause window [2026-05-05, 2026-05-11] already recorded in pause_windows."
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_email: "rin@example.com", subscriber_birth_date: "1992-07-04T00:00:00.000Z", preferred_recipe_id: "${rec_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: { start_date: "2026-05-05T00:00:00.000Z", end_date: "2026-05-11T00:00:00.000Z" }
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: { start_date: "2026-05-11T00:00:00.000Z", end_date: "2026-05-15T00:00:00.000Z" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: { start_date: "2026-05-12T00:00:00.000Z", end_date: "2026-05-15T00:00:00.000Z" }
              as: Subscriber
              as_user_id: "${sub_id}"
          assert:
            - "the first trigger's error_id is ERR_PAUSE_WINDOW_CONFLICT with HTTP 409"
            - "the second trigger returns HTTP 200"
            - "Subscription.${sub_id}.status == PAUSED"
            - "Subscription.${sub_id}.current_pause_start_date == 2026-05-12T00:00:00.000Z"
            - "Subscription.${sub_id}.current_pause_end_date == 2026-05-15T00:00:00.000Z"
            - "Subscription.${sub_id}.pause_windows has exactly 1 closed interval, [2026-05-05, 2026-05-11]"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: aborting_a_run_returns_every_drawn_liter_to_the_batch
        grounds:
          - conservation_invariants.batch_volume_conservation
          - state_machines.PackagingRun.first_source_draw
          - state_machines.PackagingRun.abort_run
          - entities.Batch.fields.drawn_liters
        distinguishing_aspect: |
          The conserved quantity is LITERS of work in process:
          pitched_liters == remaining_liters + drawn_liters + loss_liters must
          hold identically before the draw and after the abort, with
          drawn_liters returning to exactly 0.0 rather than to a rounded
          approximation.
        test_recipe:
          setup:
            - "Clock at 2026-05-09. One CONFORMING READY_TO_PACKAGE batch of 400.0 L with drawn_liters 0.0 and loss_liters 0.0."
            - "One BOTTLE run in status SOURCED holding a single 137.5 L draw, so the batch sits at remaining 262.5 / drawn 137.5."
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC", f2_added_sugar_g_per_l: 4, pasteurization_required: false }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Mother O" }
              as: ProductionOperator
              captures: { sc_id: $.data.id }
            - call: "POST /vessels"
