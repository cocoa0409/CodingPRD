            - "response.data.error_id == ERR_CONDITION_NOT_FOUND"

      - name: lab_confirmation_required_excluded_because
        claim_type: Violation to Error
        grounds:
          - errors[ERR_LAB_CONFIRMATION_REQUIRED]
        excluded_because:
          difficulty_instance: combinatorial_formula / isolation_end_max_precedence_mode_c
          rationale: "The lab-confirmation gate's satisfied path (linked POSITIVE then CONFIRMED) is established by the named §1.8 instance; its violation form is a trivial inverse of that gate."

      - name: encounter_outside_infectious_window_excluded_because
        claim_type: Violation to Error
        grounds:
          - errors[ERR_ENCOUNTER_OUTSIDE_INFECTIOUS_WINDOW]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / exposure_event_outside_closed_infectious_window
          rationale: "Triggered as the rejection path of the named §1.8 boundary instance."

      - name: monitoring_period_overlap_excluded_because
        claim_type: Violation to Error
        grounds:
          - errors[ERR_MONITORING_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / monitoring_period_overlap_vs_adjacency_on_contact
          rationale: "Triggered as the rejection path of the named §1.8 overlap-vs-adjacency instance."

