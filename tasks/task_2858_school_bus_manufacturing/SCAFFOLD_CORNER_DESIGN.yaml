              payload: { state_code: "CA", school_year: "2026-2027", min_seat_capacity: 78, min_emergency_exit_count: 6, min_joint_strength_kn: 62.5, required_route_range_mi: 75.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW_HEATED", requires_lap_shoulder_belts: true, requires_rollover_protection: true, requires_joint_strength_test: true, terrain_class: "ROLLING" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { ca_id: $.data.id }
            - call: "POST /state-spec-profiles/${ca_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-CA-115", buyer_type: "DISTRICT", buyer_name: "Fresno USD", spec_profile_id: "${ca_id}", unit_count: 1, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 10000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_id: $.data.id }
          trigger:
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "STANDARD", offered_lap_shoulder_belts: false, offered_eight_lamp_system: false, offered_crossing_arm: false, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_id: $.data.id, bid_compliance: $.data.spec_compliance_status, bid_exceptions: $.data.exception_count, bid_price: $.data.provisional_unit_price_cents, bid_joint: $.data.offered_joint_strength_kn }
            - call: "POST /bids/${bid_id}/submit"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { err_nonconforming: $.data.error_id }
            - call: "GET /bids/${bid_id}"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_status: $.data.status, bid_submitted_at: $.data.submitted_at }
          assert:
            - "bid creation returns 201 with spec_compliance_status NONCONFORMING — three mandatory items fail (joint 58.0 < 62.5, rollover not offered, exits 5 < 6) and route range passes (614.2 >= 75.0)"
            - "exception_count == 5 (seat capacity, eight-lamp, crossing arm, mirror config, lap-shoulder belts) and is still reported alongside the NONCONFORMING verdict"
            - "provisional_unit_price_cents == 14332501 and offered_joint_strength_kn == 58.0"
            - "submit fails 422 ERR_SPEC_NONCONFORMING even though 14,332,501 > 10,000,000 also violates the cap — priority 32 precedes the price-cap check at priority 63"
            - "Bid.${bid_id}.status is still DRAFT with submitted_at null, so a revision can still fix the configuration"

      - name: submit_reports_the_solicitation_state_before_the_price_cap
        claim_type: priority_ordering
        grounds:
          - validations[priority=22]
          - validations[priority=63]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / submit_reports_solicitation_not_open_over_price_cap_exceeded"
          rationale: |
            That instance is built exactly around this pair, including the isolating call that shows each
            error alone. The corner set only reuses the ordering as a secondary assertion inside
            submitting_a_nonconforming_bid_reports_the_compliance_violation.

      - name: dealer_assignment_reads_standing_derived_from_other_units
        claim_type: cross_entity
        grounds:
          - validations[priority=44]
          - calculations.dealer_recall_exposure
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / dealer_assignment_gated_by_dealer_standing_derived_from_other_units"
          rationale: |
            The assign-dealer gate that depends on a standing computed from recall tasks on entirely
            different buses is that instance's claim, together with the completion that restores GOOD
            standing and lets the same assignment through.

  - section: endpoints
    instances:

      - name: test_bay_create_read_and_filtered_listing_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /test-bays]
          - endpoints[GET /test-bays]
          - endpoints[GET /test-bays/{id}]
          - entities.TestBay
          - response_envelope.pagination
        distinguishing_aspect: |
          TestBay is a pure registry resource with no update or delete verb, so its whole surface is
          create -> read -> list. The listing filters on plant_code and paginates with limit/offset, and the
          201 body, the 200 by-id body and the list element for the same bay must agree field for field —
          including the array field supported_test_types, which keeps the order it was supplied in.
        test_recipe:
          setup:
            - "No prerequisites: TestBay has no foreign keys"
          setup_api_calls:
            - call: "POST /test-bays"
              payload: { bay_code: "TB-1", plant_code: "PLANT-A", supported_test_types: ["BRAKE", "EMERGENCY_EXIT", "ELECTRICAL"], max_concurrent_electrical: 2 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { bay_1_id: $.data.id, bay_1_code: $.data.bay_code, bay_1_max: $.data.max_concurrent_electrical }
            - call: "POST /test-bays"
              payload: { bay_code: "TB-2", plant_code: "PLANT-A", supported_test_types: ["JOINT_STRENGTH", "ROLLOVER"], max_concurrent_electrical: 0 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { bay_2_id: $.data.id }
            - call: "POST /test-bays"
              payload: { bay_code: "TB-3", plant_code: "PLANT-B", supported_test_types: ["BRAKE"], max_concurrent_electrical: 1 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { bay_3_id: $.data.id }
          trigger:
            - call: "GET /test-bays/${bay_1_id}"
              payload: {}
              as: QualityInspector
              as_user_id: "qc-01"
              captures: { read_code: $.data.bay_code, read_plant: $.data.plant_code, read_max: $.data.max_concurrent_electrical, read_version: $.data.version }
            - call: "GET /test-bays"
              payload: { plant_code: "PLANT-A" }
              as: QualityInspector
              as_user_id: "qc-01"
              captures: { list_a: $.data }
            - call: "GET /test-bays"
              payload: { plant_code: "PLANT-A", limit: 1, offset: 1 }
              as: QualityInspector
              as_user_id: "qc-01"
              captures: { page_2: $.data }
          trigger_note: "list captures are taken as $.data because the endpoint output is TestBay[]"
          assert:
            - "each POST returns 201 with version 1 and a server-assigned id, created_at and updated_at"
            - "GET /test-bays/${bay_1_id} returns bay_code TB-1, plant_code PLANT-A, supported_test_types [BRAKE, EMERGENCY_EXIT, ELECTRICAL] in that order and max_concurrent_electrical 2"
            - "GET /test-bays?plant_code=PLANT-A returns exactly TB-1 and TB-2 with meta pagination total_count 2, has_more false and the default limit 10 / offset 0"
            - "the limit 1 / offset 1 page returns exactly one element (TB-2 in created_at order) with total_count 2 and has_more false"
            - "TB-3 never appears under the PLANT-A filter, and every list element matches its by-id body field for field"

      - name: bid_creation_links_package_to_model_and_battery_packs_to_bays
        claim_type: cross_reference_link
        grounds:
          - validations[priority=56]
          - validations[priority=57]
          - errors[ERR_PROPULSION_MODEL_INCOMPATIBLE]
          - errors[ERR_BATTERY_BAY_CAPACITY_EXCEEDED]
          - entities.PropulsionPackage.fields.compatible_bus_model_id
          - entities.BusModel.fields.max_battery_bays
        distinguishing_aspect: |
          Two different cross-entity links are enforced on the same pair of rows: a PropulsionPackage may
          only be offered on the BusModel it declares compatibility with (a TYPE_D bid carrying the TYPE_C
          diesel package is refused even though every other field is valid), and an ELECTRIC package's
          battery_pack_count may not exceed the model's max_battery_bays — refused at package creation, so
          the impossible pairing never reaches a bid at all.
        test_recipe:
          setup:
            - "Two models: TYPE_C_CONV (max_battery_bays 6) and TYPE_D_TRANSIT (max_battery_bays 8)"
            - "DSL-100 declared compatible with TYPE_C_CONV; TX 2026-2027 PUBLISHED; SOL-TX-120 for 1 unit"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_D_TRANSIT", body_class: "TYPE_D", base_seat_capacity: 84, base_emergency_exit_count: 6, base_price_cents: 16400000, body_joint_strength_kn: 66.0, max_battery_bays: 8, curb_weight_lb: 26800 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_d_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "DSL-100", compatible_bus_model_id: "${model_c_id}", propulsion_type: "DIESEL", option_price_cents: 1250000, cold_weather_derate_pct: 0.03, reserve_floor_pct: 0.05, fuel_capacity_gal: 100.0, rated_mpg: 7.2 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_dsl_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "TX", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 400.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW", terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /state-spec-profiles/${tx_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-TX-120", buyer_type: "DISTRICT", buyer_name: "Plano ISD", spec_profile_id: "${tx_id}", unit_count: 1, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 40000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_id: $.data.id }
          trigger:
            - call: "POST /propulsion-packages"
              payload: { package_code: "ELEC-BIG", compatible_bus_model_id: "${model_d_id}", propulsion_type: "ELECTRIC", option_price_cents: 19900000, cold_weather_derate_pct: 0.12, reserve_floor_pct: 0.10, battery_pack_count: 9, usable_kwh: 320.0, nominal_consumption_kwh_per_mi: 1.35, hvac_load_kw: 8.0 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { err_bays: $.data.error_id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "ELEC-BIG", compatible_bus_model_id: "${model_d_id}", propulsion_type: "ELECTRIC", option_price_cents: 19900000, cold_weather_derate_pct: 0.12, reserve_floor_pct: 0.10, battery_pack_count: 8, usable_kwh: 320.0, nominal_consumption_kwh_per_mi: 1.35, hvac_load_kw: 8.0 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_elec_big_id: $.data.id, elec_packs: $.data.battery_pack_count }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_id}", bus_model_id: "${model_d_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 84, offered_emergency_exit_count: 6, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { err_incompatible: $.data.error_id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_id: $.data.id, bid_price: $.data.provisional_unit_price_cents }
          assert:
            - "the 9-pack ELECTRIC package fails 422 ERR_BATTERY_BAY_CAPACITY_EXCEEDED against TYPE_D_TRANSIT's max_battery_bays 8 and no package row is created"
            - "the identical request with battery_pack_count 8 returns 201 — the limit is inclusive"
            - "the TYPE_D bid carrying the TYPE_C-compatible DSL-100 fails 422 ERR_PROPULSION_MODEL_INCOMPATIBLE, not a not-found error: both rows exist"
            - "the same package on TYPE_C_CONV creates the bid with provisional_unit_price_cents 14641571"

      - name: reads_return_computed_fields_without_recomputing_or_mutating
        claim_type: computed_read
        grounds:
          - entities.Bid.fields.provisional_unit_price_cents
          - entities.Bid.fields.derated_route_range_mi
          - calculations.bid_unit_price.variants[provisional_firm]
          - endpoints[GET /bids/{id}]
          - consistency_model
        distinguishing_aspect: |
          A GET is pure: the same bid read before and after the logical clock jumps two months returns
          byte-identical computed fields (provisional price, nominal and derated range, compliance verdict)
          with version and updated_at unchanged. In particular the provisional price never picks up the
          escalation factor on a read — escalation is applied only by the award transition — and
          derated_route_range_mi keeps the ROLLING-terrain value 79.7 that was computed at creation.
        test_recipe:
          setup:
            - "TYPE_C_CONV + ELEC-155; NV 2026-2027 PUBLISHED with required_route_range_mi 75.0 on ROLLING terrain; SOL-NV-121 for 2 units"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "ELEC-155", compatible_bus_model_id: "${model_c_id}", propulsion_type: "ELECTRIC", option_price_cents: 14900000, cold_weather_derate_pct: 0.12, reserve_floor_pct: 0.10, battery_pack_count: 4, usable_kwh: 155.0, nominal_consumption_kwh_per_mi: 1.05, hvac_load_kw: 7.5 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_elec_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "NV", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 75.0, requires_eight_lamp_system: true, requires_crossing_arm: true, terrain_class: "ROLLING" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { nv_id: $.data.id }
            - call: "POST /state-spec-profiles/${nv_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-NV-121", buyer_type: "DISTRICT", buyer_name: "Washoe County SD", spec_profile_id: "${nv_id}", unit_count: 2, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 40000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_id: $.data.id }
          trigger:
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_elec_id}", unit_count: 2, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "STANDARD", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_id: $.data.id, price_at_create: $.data.provisional_unit_price_cents, nominal_at_create: $.data.nominal_range_mi, derated_at_create: $.data.derated_route_range_mi, version_at_create: $.data.version }
            - call: "GET /bids/${bid_id}"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { price_read_1: $.data.provisional_unit_price_cents, derated_read_1: $.data.derated_route_range_mi, version_read_1: $.data.version, updated_read_1: $.data.updated_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: SalesEngineer
              as_user_id: "sales-01"
            - call: "GET /bids/${bid_id}"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { price_read_2: $.data.provisional_unit_price_cents, derated_read_2: $.data.derated_route_range_mi, version_read_2: $.data.version, updated_read_2: $.data.updated_at, compliance_read_2: $.data.spec_compliance_status }
          assert:
            - "provisional_unit_price_cents == 28556995 at creation and on both reads — the provisional_firm variant applies no escalation factor, ever"
            - "nominal_range_mi == 147 (floor(155.0 / 1.05)) and derated_route_range_mi == 79.7 (floored to 1dp on ROLLING) on creation and on both reads"
            - "version stays 1 and updated_at is identical across both GETs: a read is not a write"
            - "spec_compliance_status is CONFORMING on the second read as well — advancing the clock two months re-evaluates nothing"
            - "the response_type for a by-id read is \"object\" and meta carries a fresh api_request_id on each call"

      - name: line_status_action_toggles_state_and_bumps_the_occ_version
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /production-lines/{id}/status]
          - state_machines.ProductionLine
          - entities.ProductionLine.fields.version
        distinguishing_aspect: |
          The status action is a two-way transition, not a one-shot: RUNNING -> DOWN_FOR_MAINTENANCE ->
          RUNNING both succeed, each returning the full line row. Every invocation increments version (1 ->
          2 -> 3) even though committed_slot_days never moves, which is precisely why a slot request authored
          against the pre-maintenance version is stale afterwards.
        test_recipe:
          setup:
            - "One ProductionLine L-A1, RUNNING at version 1 with committed_slot_days 0"
          setup_api_calls:
            - call: "POST /production-lines"
              payload: { line_code: "L-A1", plant_code: "PLANT-A", supported_body_classes: ["TYPE_C", "TYPE_D"], horizon_slot_day_capacity: 30, changeover_buffer_days: 3 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { line_id: $.data.id, v_create: $.data.version, status_create: $.data.status }
          trigger:
            - call: "POST /production-lines/${line_id}/status"
              payload: { status: "DOWN_FOR_MAINTENANCE" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { status_down: $.data.status, v_down: $.data.version, days_down: $.data.committed_slot_days }
            - call: "POST /production-lines/${line_id}/status"
              payload: { status: "RUNNING" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { status_up: $.data.status, v_up: $.data.version }
            - call: "GET /production-lines/${line_id}"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { status_final: $.data.status, v_final: $.data.version, days_final: $.data.committed_slot_days }
          assert:
            - "the first action returns 200 with status DOWN_FOR_MAINTENANCE and version 2"
            - "the second action returns 200 with status RUNNING and version 3 — the transition is bidirectional"
            - "committed_slot_days is 0 throughout: the action changes availability, not bookings"
            - "the GET agrees with the last action body (status RUNNING, version 3) and does not bump the version further"

      - name: slot_commit_action_is_conditional_on_line_availability
        claim_type: conditional_action
        grounds:
          - endpoints[POST /build-slots/{id}/commit]
          - validations[priority=30]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / slot_commit_gated_by_production_line_maintenance_state"
          rationale: |
            The same action succeeding or failing purely because of the ProductionLine's status, and the
            resume that unblocks it, is that instance's subject; repeating it here would add no new
            observation beyond the version bump already asserted in
            line_status_action_toggles_state_and_bumps_the_occ_version.

  - section: errors
    instances:

      - name: natural_key_uniqueness_and_the_clock_floor_are_both_enforced
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_CODE]
          - errors[ERR_CLOCK_REWIND_FORBIDDEN]
          - validations[priority=61]
          - validations[priority=68]
        distinguishing_aspect: |
          ERR_DUPLICATE_CODE is one error id shared by six registries, and the uniqueness scope is
          per-entity: a BusModel and a TestBay may both be coded "TB-1" without collision, while a second
          BusModel with the same model_code is refused. The clock guard is a floor, not a monotonicity rule
          — 2026-08-01T00:00:00Z itself is accepted, one second earlier is not.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TB-1", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_id: $.data.id }
            - call: "POST /test-bays"
              payload: { bay_code: "TB-1", plant_code: "PLANT-A", supported_test_types: ["BRAKE"], max_concurrent_electrical: 1 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { bay_id: $.data.id }
          trigger:
            - call: "POST /bus-models"
              payload: { model_code: "TB-1", body_class: "TYPE_D", base_seat_capacity: 84, base_emergency_exit_count: 6, base_price_cents: 16400000, body_joint_strength_kn: 66.0, max_battery_bays: 8, curb_weight_lb: 26800 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { err_dup_model: $.data.error_id }
            - call: "POST /test-bays"
              payload: { bay_code: "TB-1", plant_code: "PLANT-B", supported_test_types: ["ELECTRICAL"], max_concurrent_electrical: 1 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { err_dup_bay: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T23:59:59Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { err_clock: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { clock_ok: $.data }
            - call: "GET /bus-models"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { models_after: $.data }
          assert:
            - "the TestBay coded TB-1 is created even though a BusModel already carries that code — uniqueness is scoped per entity, not global"
            - "the second BusModel with model_code TB-1 fails 422 ERR_DUPLICATE_CODE and no row is created"
            - "the second TestBay with bay_code TB-1 fails 422 ERR_DUPLICATE_CODE even though its plant_code differs — plant is not part of the key"
            - "2026-07-31T23:59:59Z fails 422 ERR_CLOCK_REWIND_FORBIDDEN while 2026-08-01T00:00:00Z is accepted: the floor is inclusive"
            - "GET /bus-models afterwards returns exactly one element with meta pagination total_count 1"

      - name: legacy_import_checks_licensing_before_vin_uniqueness
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VIN_ALREADY_EXISTS]
          - errors[ERR_DEALER_NOT_LICENSED_IN_STATE]
          - validations[priority=60]
          - validations[priority=62]
          - endpoints[POST /dealers/{id}/legacy-fleet-records]
        distinguishing_aspect: |
          The legacy-import endpoint reaches two guards that the ordinary mint path also uses, and their
          relative order is observable: a request that is BOTH addressed to a dealer unlicensed in the
          profile's state AND carrying an already-used VIN reports ERR_DEALER_NOT_LICENSED_IN_STATE
          (priority 60), never ERR_VIN_ALREADY_EXISTS (priority 62). Neither failure moves the dealer's
          delivered_unit_count.
        test_recipe:
          setup:
            - "TYPE_C_CONV + DSL-100; TX 2026-2027 PUBLISHED; dealer D-TX licensed in TX and NM, dealer D-NV licensed in NV only"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
