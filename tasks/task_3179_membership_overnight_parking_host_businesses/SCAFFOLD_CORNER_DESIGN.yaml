  # ===========================================================================
  # RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_decide_a_stay_and_host_cannot_counter_request
        claim_type: rbac_denial
        grounds:
          - roles.Member.exclusive_operations
          - roles.HostOperator.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - endpoints./api/stay-requests/{requestId}/decisions
        distinguishing_aspect: "The confirm/decline action is HostOperator-exclusive and the counter-request is Member-exclusive, so each role is refused on the other's operation."
        test_recipe:
          setup: ["Logical clock advanced to 2026-06-01T00:00:00Z; a TX/FARM host with one site and one REQUESTED stay"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Role Farm", category: "FARM", address_line1: "46 Role Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_rl: $.data.id }
            - call: "POST /api/hosts/${h_rl}/parking-sites"
              payload: { site_label: "R1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_rl}"
              payload: {}
              as: HostOperator
              captures: { h_rl_v1: $.data.version }
            - call: "POST /api/hosts/${h_rl}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_rl_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "role@x.com", full_name: "Role Member", plan_tier: "PLUS", home_state_code: "TX" }
              as: Anonymous
              captures: { m_rl: $.data.id }
            - call: "POST /api/members/${m_rl}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m_rl}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m_rl}"
              captures: { v_rl: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_rl}", member_id: "${m_rl}", vehicle_id: "${v_rl}", arrival_date: "2026-06-20", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m_rl}"
              captures: { r_rl: $.data.id }
            - call: "GET /api/hosts/${h_rl}"
              payload: {}
              as: HostOperator
              captures: { h_rl_v2: $.data.version }
          trigger:
            - call: "POST /api/stay-requests/${r_rl}/decisions"
              payload: { decision: "CONFIRM", site_id: "R1", expected_host_version: "${h_rl_v2}" }
              as: Member
              as_user_id: "${m_rl}"
              captures: { err_member_decide: $.data.error_id }
            - call: "POST /api/stay-requests/${r_rl}/counter_requests"
              payload: { arrival_date: "2026-06-22", nights: 2, party_size: 1 }
              as: HostOperator
              as_user_id: "${h_rl}"
              captures: { err_host_counter: $.data.error_id }
            - call: "POST /api/stay-requests/${r_rl}/decisions"
              payload: { decision: "CONFIRM", site_id: "R1", expected_host_version: "${h_rl_v2}" }
              as: Member
              as_user_id: "3f1a2b4c-0000-4000-8000-000000000009"
              captures: { err_wrong_owner: $.data.error_id }
          assert:
            - "the Member decision returns error_id \"ERR_UNAUTHORIZED\" with http 403"
            - "the HostOperator counter-request returns error_id \"ERR_UNAUTHORIZED\" with http 403"
            - "a Member acting with another member's id returns error_id \"ERR_UNAUTHORIZED\" with http 403, so ownership is checked against StayRequest.member_id"
            - "StayRequest.${r_rl}.request_status is still \"REQUESTED\" and no ancillary charge was computed"

      - name: missing_headers_and_unknown_role_are_refused_before_resource_lookup
        claim_type: rbac_denial
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - validations[priority=2]
          - roles.PlatformAdmin.identity
        distinguishing_aspect: "Authentication is evaluated above existence, so an unauthenticated read of a non-existent host reports the authentication failure rather than the not-found failure."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default; no hosts exist"]
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Auth Farm", category: "FARM", address_line1: "47 Auth Rd", state_code: "TX" }
              as: HostOperator
              captures: { h_au: $.data.id }
          trigger:
            - call: "GET /api/hosts/${h_au}"
              payload: {}
              as: CuriousVisitor
              captures: { err_role: $.data.error_id }
            - call: "GET /api/hosts/3f1a2b4c-0000-4000-8000-000000000010"
              payload: {}
              as: CuriousVisitor
              captures: { err_role_missing: $.data.error_id }
            - call: "GET /api/members"
              payload: {}
              as: Member
              as_user_id: "3f1a2b4c-0000-4000-8000-000000000011"
              captures: { err_scope: $.data.error_id }
          assert:
            - "the unknown role returns error_id \"ERR_UNAUTHENTICATED\" with http 401, not ERR_RESOURCE_NOT_FOUND, even though the host exists"
            - "the unknown role against a non-existent host also returns error_id \"ERR_UNAUTHENTICATED\" with http 401, because authentication sits above existence"
            - "the Member asking for GET /api/members returns error_id \"ERR_UNAUTHORIZED\" with http 403, since the member directory is PlatformAdmin-only"
            - "GET /api/hosts/${h_au} still returns 200 for HostOperator, so the refusals did not disturb the resource"

      - name: host_operator_cannot_operate_on_another_hosts_stay_window
        claim_type: rbac_denial
        grounds:
          - roles.HostOperator.identity
          - roles.HostOperator.exclusive_operations
          - endpoints./api/availability-windows/{windowId}/amend
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "HostOperator is entity_backed:HostBusiness, so the X-User-ID must equal the owning host's id and a window belonging to another host is refused."
        test_recipe:
          setup: ["Logical clock advanced to 2026-10-05T00:00:00Z; two approved TX/FARM hosts, one of which owns an ACTIVE window"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Owner Farm", category: "FARM", address_line1: "48 Owner Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_own: $.data.id }
            - call: "POST /api/hosts/${h_own}/parking-sites"
              payload: { site_label: "W1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_own}"
              payload: {}
              as: HostOperator
              captures: { h_own_v1: $.data.version }
            - call: "POST /api/hosts/${h_own}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_own_v1}" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Rival Farm", category: "FARM", address_line1: "49 Rival Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_rv: $.data.id }
            - call: "POST /api/availability-windows"
              payload: { host_id: "${h_own}", kind: "EVENT", label: "Owner Festival", start_date: "2026-10-01", end_date: "2026-10-20", capacity_override: 12, reserved_sites: 10 }
              as: HostOperator
              as_user_id: "${h_own}"
              captures: { w_own: $.data.id, w_own_v: $.data.version, w_own_status: $.data.window_status }
          trigger:
            - call: "POST /api/availability-windows/${w_own}/amend"
              payload: { capacity_override: 4, expected_window_version: "${w_own_v}" }
              as: HostOperator
              as_user_id: "${h_rv}"
              captures: { err_cross: $.data.error_id }
            - call: "POST /api/availability-windows/${w_own}/cancellations"
              payload: {}
              as: HostOperator
              as_user_id: "${h_rv}"
              captures: { err_cross_cancel: $.data.error_id }
            - call: "POST /api/availability-windows/${w_own}/amend"
              payload: { capacity_override: 22, expected_window_version: "${w_own_v}" }
              as: HostOperator
              as_user_id: "${h_own}"
              captures: { w_own_ceiling: $.data.member_capacity_ceiling, w_own_status2: $.data.window_status }
          assert:
            - "the rival operator's amendment returns error_id \"ERR_UNAUTHORIZED\" with http 403"
            - "the rival operator's cancellation also returns error_id \"ERR_UNAUTHORIZED\" with http 403"
            - "the owning operator's amendment succeeds with window_status \"ACTIVE\" and member_capacity_ceiling 12"
            - "HostAvailabilityWindow.${w_own}.reserved_sites is still 10 and capacity_override is 22, so the refused amendment left no partial write"

      - name: segregation_of_duty_between_deciding_and_being_decided
        claim_type: rbac_denial
        grounds:
          - validations[priority=20]
          - errors[ERR_DISPOSITION_NAME_COLLISION]
          - roles.Member.identity
          - entities.ConductDisposition.fields.decided_by_display_name
        distinguishing_aspect: "A member may rule only on their own incident and must supply a display name segmented from every other member's full_name, so a name colliding with another member is refused."
        test_recipe:
          setup: ["Logical clock advanced to 2026-06-01T00:00:00Z; two members, the first carrying one OPEN MAJOR incident"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "seg1@x.com", full_name: "Seg One", plan_tier: "PLUS", home_state_code: "TX" }
              as: Anonymous
              captures: { m_s1: $.data.id }
            - call: "POST /api/members"
              payload: { email: "seg2@x.com", full_name: "Seg Two", plan_tier: "PLUS", home_state_code: "TX" }
              as: Anonymous
              captures: { m_s2: $.data.id }
            - call: "POST /api/members/${m_s1}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m_s2}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/incidents"
              payload: { member_id: "${m_s2}", host_id: "${m_s2}", severity: "MAJOR", narrative: "left a mess", origin: "MEMBER_REPORT" }
              as: Member
              as_user_id: "${m_s1}"
              captures: { inc_seg: $.data.id }
          trigger:
            - call: "POST /api/incidents/${inc_seg}/dispositions"
              payload: { action: "DISMISS", decided_by_display_name: "Seg One" }
              as: Member
              as_user_id: "${m_s1}"
              captures: { err_own_name: $.data.error_id }
            - call: "POST /api/incidents/${inc_seg}/dispositions"
              payload: { action: "UPHOLD", decided_by_display_name: "Seg One", requested_decision: "UPHOLD" }
              as: Member
              as_user_id: "${m_s1}"
              captures: { err_self_pair: $.data.error_id }
          assert:
            - "the first ruling using the decider's own full_name returns error_id \"ERR_DISPOSITION_NAME_COLLISION\" with http 409"
            - "the second ruling also returns error_id \"ERR_DISPOSITION_NAME_COLLISION\" with http 409, because the decider's own name is segmented from every OTHER member but the submitted value equals a registered full_name"
            - "Incident.${inc_seg}.incident_status is still \"OPEN\" and waived_days_remaining is still 0"
            - "Member.${m_s2}.strike_count == 1, so the refused rulings left the subject member untouched"

  # ===========================================================================
  # Cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: host_decision_with_stale_version_shadows_the_business_gate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[confirm-stale-host]
          - validations[priority=24]
          - errors[ERR_STALE_HOST_VERSION]
          - endpoints./api/hosts/{hostId}/decisions
        distinguishing_aspect: "An onboarding decision carrying a version the host has already advanced past is refused with ERR_STALE_HOST_VERSION, and the identical decision with the fresh version is admitted."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default; a TX/FARM host with one declared site and no decision yet"]
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Stale Farm", category: "FARM", address_line1: "50 Stale Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_sl: $.data.id }
            - call: "POST /api/hosts/${h_sl}/parking-sites"
              payload: { site_label: "V1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_sl}"
              payload: {}
              as: HostOperator
              captures: { sl_stale_v: $.data.version }
            - call: "POST /api/hosts/${h_sl}/parking-sites"
              payload: { site_label: "V2", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
              captures: { sl_v2_id: $.data.id }
          trigger:
            - call: "POST /api/hosts/${h_sl}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${sl_stale_v}" }
              as: PlatformAdmin
              captures: { err_stale: $.data.error_id, msg_stale: $.data.message }
            - call: "GET /api/hosts/${h_sl}"
              payload: {}
              as: HostOperator
              captures: { sl_fresh_v: $.data.version }
            - call: "POST /api/hosts/${h_sl}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${sl_fresh_v}" }
              as: PlatformAdmin
              captures: { sl_status: $.data.onboarding_status, sl_v_after: $.data.version }
          assert:
            - "the stale decision returns error_id \"ERR_STALE_HOST_VERSION\" with http 412 — the declared site write advanced the host version after the read"
            - "HostBusiness.${h_sl}.onboarding_status is still \"PENDING_REVIEW\" after the 412, so the OCC gate ran before the onboarding business gate"
            - "the fresh decision is admitted with onboarding_status \"APPROVED\" and version ${sl_v_after} one above ${sl_fresh_v}"
            - "the stale caller's expected version was ${sl_stale_v}, strictly below ${sl_fresh_v}, so the rejection is a stale-version observation and not a state precondition"

