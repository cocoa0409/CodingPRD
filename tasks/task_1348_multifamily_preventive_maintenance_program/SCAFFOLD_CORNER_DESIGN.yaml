              as: PropertyManager
              captures: { comp_vacant: $.data.compliance_status }
            - call: "GET /properties/${po_id}/assets/${ao_id}"
              payload: {}
              as: PropertyManager
              captures: { comp_occupied: $.data.compliance_status }
          assert:
            - "VACANT unit asset: compliance_status == COMPLIANT at clock 2026-07-29 (next_due 2026-08-01, 3 days out, beyond 1-day vacant DUE window)"
            - "OCCUPIED unit asset: compliance_status == DUE at clock 2026-07-29 (inside 7-day occupied DUE window)"

