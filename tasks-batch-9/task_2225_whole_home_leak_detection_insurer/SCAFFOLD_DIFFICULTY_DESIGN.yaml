  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_state_beats_payout_cap
        grounds:
          - validations[priority=19]
          - validations[priority=45]
          - errors[ERR_CLAIM_NOT_REVIEWABLE]
          - errors[ERR_ANNUAL_PAYOUT_CAP_EXCEEDED]
          - calculations.claim_payout_award
          - entities.InsurancePolicy.fields.paid_payout_cents_total
        distinguishing_aspect: |
          One request violates BOTH priority 19 (category `state`: APPROVE requires status UNDER_REVIEW, the claim is
          SUBMITTED) AND priority 45 (category `business_fiscal`: 500000 already paid + 150000 warranty payout = 650000
          > POLICY_ANNUAL_PAYOUT_CAP_CENTS 600000); the response is ERR_CLAIM_NOT_REVIEWABLE (409), and only after
          BEGIN_REVIEW clears the state check does the same APPROVE surface ERR_ANNUAL_PAYOUT_CAP_EXCEEDED (422). The
          category pair here is state x business_fiscal, distinct from the business_constraint x business_temporal pair
          of mode_transition_beats_snooze_cooldown.
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property is install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
            - "Device ${d1} is ARMED with valve_state OPEN and monitor_mode NORMAL; the logical clock stands at 2026-08-01T06:05:00Z."
            - "InsurancePolicy ${pol1} on Property ${p1}: annual_premium_cents 149900, deductible_cents 100000, policy_year_start_at 2026-08-01T00:00:00Z."
            - "ReimbursementClaim ${c1} (WATER_DAMAGE 620000 on the mitigated CATASTROPHIC_BURST ${ev1}) is PAID for 500000, so InsurancePolicy.${pol1}.paid_payout_cents_total == 500000."
            - "ReimbursementClaim ${c2} (WARRANTY_DEVICE, documented_loss_cents 150000, no anomaly_event_id) is still SUBMITTED; the clock stands at 2026-08-01T07:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
