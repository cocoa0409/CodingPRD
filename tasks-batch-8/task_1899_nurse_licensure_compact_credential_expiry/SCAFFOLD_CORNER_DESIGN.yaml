# =============================================================================
# Task 1899 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty
# Tests). Sections/claim_types follow references/claim-extraction-guide.md.
# Every chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6 from empty-DB.
# Logical clock default: 2026-08-01T00:00:00Z. Pinned operator ids as in §1.8.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: nurse_creation_defaults_and_system_fields
        claim_type: creation
        grounds:
          - "entities.Nurse"
          - "state_machines.Nurse"
        distinguishing_aspect: "A minimal valid POST creates a nurse with initial status ONBOARDING, computed posture SCHEDULING_SUSPENDED, privilege NONE with empty scope, zero encumbrances, and server-minted id/version 1."
        test_recipe:
          setup: ["Clock at default 2026-08-01T00:00:00Z; empty database."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /credentialing/nurses", payload: { full_name: "Rita New", email: "rita.new@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
          assert:
            - "Response 201; data.status == 'ONBOARDING', data.credential_posture == 'SCHEDULING_SUSPENDED', data.multistate_privilege_status == 'NONE', data.practice_scope == [], data.open_encumbrance_count == 0"
            - "data.id is a UUID, data.version == 1, data.created_at == '2026-08-01T00:00:00Z' (logical clock), data.updated_at == data.created_at"
            - "Response envelope: meta.api_request_id present, response_type == 'object'"

      - name: nurse_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "entities.Nurse.fields.primary_state_of_residence"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting the required input field primary_state_of_residence fails with ERR_INVALID_REQUEST 400 and creates nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /credentialing/nurses", payload: { full_name: "No State", email: "no.state@x.com", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Response 400 with error_id == 'ERR_INVALID_REQUEST'"
            - "GET /credentialing/nurses returns total_count == 0"

      - name: nurse_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET with a well-formed but non-existent UUID fails 404 ERR_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "GET /credentialing/nurses/11111111-2222-4333-8444-555555555555", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Response 404; data.error_id == 'ERR_NOT_FOUND'; response_type == 'error'; data.message is a non-empty string"

      - name: nurse_create_with_computed_field_rejected
        claim_type: computed_fields
        grounds:
          - "entities.Nurse.fields.credential_posture"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Supplying the computed field credential_posture in the create payload is an unknown input field and fails 400; computed fields are never client-settable."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /credentialing/nurses", payload: { full_name: "Cheat Clear", email: "cheat.clear@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01", credential_posture: "CLEAR" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Response 400 with error_id == 'ERR_INVALID_REQUEST' (unknown field credential_posture)"
            - "GET /credentialing/nurses returns total_count == 0"

      - name: privilege_evaluation_immutable_event
        claim_type: immutability
        grounds:
          - "entities.PrivilegeEvaluation"
        distinguishing_aspect: "PrivilegeEvaluation (common_fields false) exposes only id + created_at + payload fields: no version, no updated_at, and no update/delete endpoint exists in §1.5."
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurse exists with an ACTIVE attested AZ multistate license (attest appended one LICENSE_CHANGE evaluation row)."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Ed Log", email: "ed.log@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-EL1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
          trigger:
            - { call: "GET /credentialing/privilege-evaluations?nurse_id=${n_id}", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "Exactly 1 row; row[0].trigger_reason == 'LICENSE_CHANGE', resulting_status == 'ELIGIBLE_MULTISTATE', home_license_id == ${lic_id}"
            - "Row keys are exactly {id, created_at, nurse_id, trigger_reason, resulting_status, resulting_scope, home_license_id} — no version, no updated_at"

      - name: nurse_list_pagination_defaults
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints"
        distinguishing_aspect: "With 12 nurses, the default page (limit 10, offset 0) returns 10 rows with total_count 12 and has_more true; offset 10 returns 2 rows with has_more false."
        test_recipe:
          setup: ["Clock 2026-08-01; twelve nurses created."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N01", email: "page01@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N02", email: "page02@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N03", email: "page03@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N04", email: "page04@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N05", email: "page05@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N06", email: "page06@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N07", email: "page07@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N08", email: "page08@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N09", email: "page09@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N10", email: "page10@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N11", email: "page11@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Page N12", email: "page12@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "GET /credentialing/nurses", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "GET /credentialing/nurses?offset=10", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "First page: response_type == 'array', data has 10 rows, total_count == 12, has_more == true (defaults limit 10 / offset 0)"
            - "Second page (offset=10): 2 rows, total_count == 12, has_more == false"

      - name: state_license_filtered_list_by_nurse_fk
        claim_type: parent_relationships
        grounds:
          - "entities.StateLicense.fields.nurse_id"
          - "endpoints"
        distinguishing_aspect: "The filtered list GET /credentialing/state-licenses?nurse_id=... returns exactly the licenses of that nurse and none of another nurse's (FK reverse-reachability, flat topology)."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse A with two DRAFT licenses; nurse B with one DRAFT license."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Ann Two", email: "ann.two@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_a: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_a}", state_code: "AZ", license_number: "RN-AZ-AT1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_a1: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_a}", state_code: "TX", license_number: "RN-TX-AT2", license_class: "RN", multistate_flag: false, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_a2: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Ben One", email: "ben.one@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_b: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_b}", state_code: "AZ", license_number: "RN-AZ-BO1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_b1: "$.data.id" } }
          trigger:
            - { call: "GET /credentialing/state-licenses?nurse_id=${n_a}", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "Exactly 2 rows returned, with ids == {${lic_a1}, ${lic_a2}}; ${lic_b1} is absent"
            - "Both rows have status == 'DRAFT' (creation default) and nurse_id == ${n_a}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: license_submit_from_pending_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.StateLicense.DRAFT_to_PENDING_VERIFICATION"
          - "errors[ERR_INVALID_LICENSE_STATE]"
        distinguishing_aspect: "submit is only valid from DRAFT; a license already PENDING_VERIFICATION rejects the second submit with ERR_INVALID_LICENSE_STATE and no state change."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse with one license already submitted (PENDING_VERIFICATION)."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Sub Twice", email: "sub.twice@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-ST1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Response 409 with error_id == 'ERR_INVALID_LICENSE_STATE'"
            - "StateLicense.${lic_id}.status still == 'PENDING_VERIFICATION'"

      - name: surrendered_license_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.StateLicense"
          - "errors[ERR_INVALID_LICENSE_STATE]"
        distinguishing_aspect: "From terminal SURRENDERED, both attest and renew are rejected with ERR_INVALID_LICENSE_STATE; the license never leaves the terminal state."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse with an ACTIVE license that was then surrendered."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Sur Render", email: "sur.render@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-SR1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/surrender", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-2", captures: { err_attest: "$.data.error_id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/renew", payload: { new_expires_on: "2027-12-31" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err_renew: "$.data.error_id" } }
          assert:
            - "Both triggers fail 409 with error_id == 'ERR_INVALID_LICENSE_STATE'"
            - "StateLicense.${lic_id}.status remains 'SURRENDERED'"

      - name: psv_record_result_twice_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.PrimarySourceVerification"
          - "errors[ERR_INVALID_PSV_STATE]"
        distinguishing_aspect: "record-result on a PSV already in terminal VERIFIED fails ERR_INVALID_PSV_STATE; repeating the same outcome does not silently succeed."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse + license PENDING_VERIFICATION with a PSV already recorded VERIFIED."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Psv Twice", email: "psv.twice@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-PT1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
          trigger:
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-2", captures: { err: "$.data.error_id" } }
          assert:
            - "Response 409 with error_id == 'ERR_INVALID_PSV_STATE'"
            - "PrimarySourceVerification.${psv_id}.status remains 'VERIFIED', resolved_by_user_id remains 'ver-1'"

      - name: packet_approve_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.CredentialPacket"
          - "errors[ERR_INVALID_PACKET_STATE]"
        distinguishing_aspect: "approve is only valid from UNDER_REVIEW; a DRAFT packet rejects approve with ERR_INVALID_PACKET_STATE."
        test_recipe:
          setup: ["Clock 2026-08-01; unit MED; travel nurse with a DRAFT packet."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/units", payload: { name: "MED", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Pack Draft", email: "pack.draft@x.com", primary_state_of_residence: "AZ", employment_type: "TRAVEL", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/credential-packets", payload: { nurse_id: "${n_id}", target_unit_id: "${unit_id}" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { pkt_id: "$.data.id" } }
          trigger:
            - { call: "POST /credentialing/credential-packets/${pkt_id}/approve", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-2", captures: { err: "$.data.error_id" } }
          assert:
            - "Response 409 with error_id == 'ERR_INVALID_PACKET_STATE'"
            - "CredentialPacket.${pkt_id}.status remains 'DRAFT'"

      - name: discipline_resolve_from_reported_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.DisciplinaryAction"
          - "errors[ERR_INVALID_DISCIPLINE_STATE]"
        distinguishing_aspect: "resolve requires ADJUDICATED; a REPORTED action rejects resolve with ERR_INVALID_DISCIPLINE_STATE even when the minimum-period date arithmetic would pass."
        test_recipe:
          setup: ["Clock 2026-08-01; ACTIVE nurse with a REPORTED disciplinary action (effective 2026-08-01)."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
