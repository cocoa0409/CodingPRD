          assert:
            - "${load_auto} == 2 and ${load_manual} == 49"
            - "${impl_score} == 69.80"
            - "${impl_status} == SHIPPED"
            - "${sweep_before} == 69.80"
            - "${err} == ERR_A11Y_CONFORMANCE_INSUFFICIENT"
            - "HTTP status == 422"
            - "Component.${comp_id}.maturity_level == EXPERIMENTAL"
            - "Component.${comp_id}.governance_conformance_score == 69.80 and Component.${comp_id}.conformance_baseline_at == 2026-08-01T00:00:00.000Z (a refused promotion resets nothing)"

      - name: exception_debt_round_then_sum_yields_14_07_not_14_06
        grounds:
          - calculations.exception_debt_points
          - entities.Team.outstanding_debt_points
          - entities.ExceptionGrant.debt_points
        distinguishing_aspect: |
          A DIFFERENT precision axis again: rounding ORDER rather than a threshold comparison.
          Three RAW_TOKEN_USAGE / IOS grants against a BETA component each price at
          5 * 1.25 * 0.75 = 4.6875, which the pinned order rounds per grant to 4.69 and then
