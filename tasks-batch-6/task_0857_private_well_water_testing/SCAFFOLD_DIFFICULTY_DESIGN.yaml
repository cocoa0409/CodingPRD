            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 35.4, longitude: -119.6, parcel_apn: "APN-RO2", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /advisories", payload: { well_id: "${well}", advisory_type: "NITRATE", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z", reason: "elevated nitrate" }, as: HealthOfficer, captures: { adv1: "$.data.id" } }
          trigger:
            - { call: "POST /advisories", payload: { well_id: "${well}", advisory_type: "NITRATE", effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-07-15T00:00:00Z", reason: "still elevated" }, as: HealthOfficer }
          assert:
            - "response.error_id == ERR_ADVISORY_WINDOW_OVERLAP"

  - rule_id: compensating_invariant
    instances:
      - name: pay_then_deny_conserves_net_fees_paid
        grounds:
          - state_machines.ConstructionPermit.SUBMITTED_to_DENIED
          - calculations.applicant_net_fees_paid
          - entities.Applicant.fields.net_fees_paid_cents
          - entities.ConstructionPermit.fields.fee_refunded_cents
        distinguishing_aspect: "Conserved quantity = money (Applicant.net_fees_paid_cents): pay charges 35000, deny refunds 35000, so net_fees_paid_cents returns to its pre-pay value 0 (fee_refunded_cents == 35000)."
        test_recipe:
          setup:
            - "A SUBMITTED permit that has been paid (net_fees_paid_cents 35000)."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-CI1", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Quin Owner", email: "quin@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-15", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 35.5, longitude: -119.7, parcel_apn: "APN-CI1", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
          trigger:
            - { call: "POST /construction-permits/${cp}/deny", payload: {}, as: HealthOfficer }
          assert:
            - "ConstructionPermit.${cp}.fee_refunded_cents == 35000"
            - "Applicant.${app}.net_fees_paid_cents == 0"

      - name: case_open_close_conserves_active_advisory_count
        grounds:
          - state_machines.ContaminationCase.RESOLVED_to_CLOSED
          - calculations.well_active_advisory_count
          - entities.Well.fields.active_advisory_count
        distinguishing_aspect: "Conserved quantity = count of ACTIVE advisories (Well.active_advisory_count): a cascade-opened case issues 1 advisory (0->1); resolving and closing it lifts that advisory (1->0), returning the count to its pre-open value 0."
        test_recipe:
          setup:
            - "An ACTIVE well whose confirmed-UNSAFE result opened a case (active_advisory_count 1), then advanced to RESOLVED."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-CI2", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Ravi Owner", email: "ravi@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-16", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 35.6, longitude: -119.8, parcel_apn: "APN-CI2", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
            - { call: "POST /construction-permits/${cp}/issue", payload: {}, as: HealthOfficer }
            - { call: "POST /driller-logs", payload: { construction_permit_id: "${cp}", driller_id: "${dr}", total_depth_ft: 320, static_water_level_ft: 40, casing_depth_ft: 20, grout_type: "BENTONITE", completed_on: "2026-05-11T18:00:00Z" }, as: Driller, as_user_id: "${dr}" }
            - { call: "POST /water-samples", payload: { well_id: "${well}", submitted_by_applicant_id: "${app}", sample_type: "ROUTINE", requested_analytes: ["BACTERIA"], collected_on: "2026-05-12T00:00:00Z", chain_of_custody_id: "COC-CI2" }, as: Applicant, as_user_id: "${app}", captures: { ws: "$.data.id" } }
            - { call: "POST /water-samples/${ws}/receive", payload: {}, as: LabAnalyst }
            - { call: "POST /water-samples/${ws}/begin-analysis", payload: {}, as: LabAnalyst }
            - { call: "POST /sample-results", payload: { water_sample_id: "${ws}", bacteria_coliform: "PRESENT", ecoli: "ABSENT", nitrate_mg_l: 1.0, lead_ppb: 1.0, analyzed_on: "2026-05-13T00:00:00Z" }, as: LabAnalyst, captures: { sr: "$.data.id" } }
            - { call: "GET /contamination-cases", payload: { well_id: "${well}" }, as: HealthOfficer, captures: { cc: "$.data[0].id" } }
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "INVESTIGATING" }, as: HealthOfficer, as_user_id: "officer-3" }
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "MITIGATION" }, as: HealthOfficer, as_user_id: "officer-3" }
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "RESOLVED" }, as: HealthOfficer, as_user_id: "officer-3" }
          trigger:
            - { call: "POST /contamination-cases/${cc}/close", payload: { resolution_notes: "cleared" }, as: HealthOfficer, as_user_id: "officer-3" }
          assert:
            - "Well.${well}.active_advisory_count == 0"
