              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/monitoring-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", appointment_type: "ULTRASOUND", start_utc: "2026-06-02T09:00:00.000Z", end_utc: "2026-06-02T09:30:00.000Z" }
              as: Nurse
              captures: { appt_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/monitoring-appointments/${appt_id}/reschedule"
              payload: { start_utc: "2026-06-03T09:00:00.000Z", end_utc: "2026-06-03T09:30:00.000Z" }
              as: Nurse
          trigger:
            - call: "POST /clinics/${clinic_id}/monitoring-appointments/${appt_id}/confirm"
              payload: {}
              as: Nurse
              captures: { st: $.data.status }
          assert:
            - "MonitoringAppointment.${appt_id}.status == CONFIRMED"
            - "MonitoringAppointment.${appt_id}.start_utc == 2026-06-03T09:00:00.000Z"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cycle_depth3_specimen_tank_derived
        grounds:
          - state_machines.TreatmentCycle.FERTILIZATION_to_CANCELLED
          - state_machines.CryoSpecimen.STORED_to_DISCARDED
          - entities.CryoTank.fields.reserved_slots
          - entities.CryoTank.fields.committed_free_slots
        distinguishing_aspect: |
          Depth-3 chain from the cycle-cancel trigger: cancel -> CryoSpecimen STORED->DISCARDED (hop1,
          caused by cancel) -> CryoTank.reserved_slots decrements (hop2, caused by the discard) ->
          CryoTank.committed_free_slots recomputed (hop3, caused by the reserved_slots change). Each
          hop is caused by the previous, not by the cancel directly.
        test_recipe:
          setup:
            - "Cycle in FERTILIZATION with one STORED specimen occupying a slot in a capacity-5 tank (reserved_slots 1)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Cascade Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Gus V", date_of_birth: "1987-07-07T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/tanks"
              payload: { label: "Tank-C", capacity_slots: 5 }
              as: Embryologist
              captures: { tank_id: $.data.id, tank_v: $.data.version }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 6 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 3 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
              captures: { sp_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp_id}/store"
              payload: { expected_tank_version: "${tank_v}" }
              as: Embryologist
            - call: "GET /clinics/${clinic_id}/cycles/${cyc_id}"
              payload: {}
              as: Nurse
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/cancel"
              payload: { expected_cycle_version: "${cyc_v}" }
              as: Nurse
          assert:
            - "TreatmentCycle.${cyc_id}.protocol_status == CANCELLED"
            - "CryoSpecimen.${sp_id}.status == DISCARDED"
            - "CryoTank.${tank_id}.reserved_slots == 0"
            - "CryoTank.${tank_id}.committed_free_slots == 5"

      - name: publish_supersede_depth2_form_consent_stale
        grounds:
          - state_machines.ConsentForm.DRAFT_to_PUBLISHED
          - state_machines.ConsentForm.PUBLISHED_to_SUPERSEDED
          - state_machines.PatientConsent.ACTIVE_to_STALE
          - entities.PatientConsent.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (consent-form publish, not cycle cancel): publish v2 ->
          target v1 ConsentForm SUPERSEDED (hop1, caused by publish) -> the ACTIVE PatientConsent pinned
          to v1 goes STALE (hop2, caused by the SUPERSEDED transition).
        test_recipe:
          setup:
            - "Consent form v1 PUBLISHED; a patient signed it (ACTIVE consent). A v2 draft supersedes v1."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Consent Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Hal W", date_of_birth: "1986-08-08T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START"] }
              as: ClinicAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${v1_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${v1_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { consent_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v2", required_for: ["CYCLE_START"], supersedes_form_id: "${v1_id}" }
              as: ClinicAdmin
              captures: { v2_id: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/consent-forms/${v2_id}/publish"
              payload: {}
              as: ClinicAdmin
          assert:
            - "ConsentForm.${v1_id}.status == SUPERSEDED"
            - "ConsentForm.${v2_id}.status == PUBLISHED"
            - "PatientConsent.${consent_id}.status == STALE"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_consent_safety_on_start_stim
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.TreatmentCycle.DRAFT_to_STIM
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): a cycle already in RETRIEVAL (wrong state for
          start-stim) AND lacking a CYCLE_START consent both fail; priority 7 (ERR_CYCLE_BAD_PROTOCOL_STATE)
          must win over priority 9 (ERR_CONSENT_MISSING).
        test_recipe:
          setup:
            - "Cycle advanced to RETRIEVAL; the patient's only consent (CYCLE_START) has been revoked so the consent gate would also fail."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Prio Clinic A" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Ivy X", date_of_birth: "1990-09-09T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { consent_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 5 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/patient-consents/${consent_id}/revoke"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CYCLE_BAD_PROTOCOL_STATE"
            - "response.http_status == 409"

      - name: patient_inactive_referential_beats_consent_safety_on_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.TreatmentCycle.DRAFT_to_STIM
        distinguishing_aspect: |
          Error-category pair (business_referential vs business_safety), distinct from the state vs safety
          pair: a DRAFT cycle whose patient is INACTIVE AND who holds no CYCLE_START consent fails start-stim;
          priority 8 (ERR_PATIENT_INACTIVE) must win over priority 9 (ERR_CONSENT_MISSING).
        test_recipe:
          setup:
            - "A DRAFT cycle whose patient was deactivated AFTER cycle creation and who has no consent at all."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Prio Clinic B" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Jo Y", date_of_birth: "1991-10-10T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${pat_id}/deactivate"
              payload: {}
              as: ClinicAdmin
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PATIENT_INACTIVE"
            - "response.http_status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tank_store_exactly_at_capacity_boundary
        grounds:
          - validations[priority=15]
          - entities.CryoTank.fields.capacity_slots
          - entities.CryoTank.fields.reserved_slots
          - state_machines.CryoSpecimen.PENDING_to_STORED
        distinguishing_aspect: |
          Numeric-threshold boundary on tank capacity (>= vs >): with capacity 1 and reserved_slots 0,
          the first store succeeds (0+1 <= 1) and a second store of a different specimen fails with
          ERR_TANK_AT_CAPACITY (1+1 > 1) — exact boundary on the store endpoint.
        test_recipe:
          setup:
            - "Capacity-1 tank; a FERTILIZATION cycle; two PENDING specimens earmarked for that tank."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Cap1 Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Kit Z", date_of_birth: "1990-11-11T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL"] }
              as: ClinicAdmin
