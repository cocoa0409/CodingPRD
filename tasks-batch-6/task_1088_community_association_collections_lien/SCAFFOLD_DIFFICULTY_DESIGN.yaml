      - name: bp_empty_open_assessments_payment
        grounds:
          - calculations.payment_allocation
          - entities.Payment.fields.unapplied_cents
          - entities.Payment.fields.allocations
        distinguishing_aspect: "Empty-collection edge on a different endpoint (POST /collections/payments): with zero OPEN/PARTIAL assessments the candidate set is empty, so allocations == [] and the whole 5000 becomes unapplied_cents — a different metric than the numeric lien-minimum boundary."
