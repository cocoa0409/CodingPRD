scaffold_corner_design:
  - section: entities
    instances:
      - name: create_parade_success_with_defaults
        claim_type: creation
        grounds: [entities.ParadeEvent, "endpoints.POST_/parades", state_machines.ParadeEvent]
        distinguishing_aspect: "A fresh parade starts DRAFT/RESTRICTED with zeroed counters, script_finalized false, version 1."
        test_recipe:
          setup: ["Empty database; logical clock at the default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /parades", payload: { name: "Founders Day Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id, st: $.data.status, po: $.data.posture, v: $.data.version } }
          assert:
            - "response 201; status == DRAFT and posture == RESTRICTED (initial state and derived posture)"
            - "approved_entry_count == 0 and sponsor_seconds_allocated == 0 and script_finalized == false"
            - "version == 1; id is a server-minted UUID; created_at/updated_at stamped from the logical clock"

      - name: create_entry_missing_required_org_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.EntryApplication.fields.org_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "org_name is a required input with no default; omitting it yields ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One parade exists"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Req Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /parades/${p_id}/entries", payload: { requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and HTTP 400"
            - "no EntryApplication is persisted for the parade"

      - name: create_entry_zero_participants_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.EntryApplication.fields.estimated_participants, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "estimated_participants must be >= 1; the zero-quantity edge is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["One parade exists"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Zero Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Nobody Marching", requested_category: "WALKING_GROUP", estimated_participants: 0 }, as: Entrant, as_user_id: "entrant_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and HTTP 400"

      - name: create_parade_with_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.ParadeEvent, response_envelope]
        distinguishing_aspect: "Client-supplied id/created_at/version/status in the create body are ignored; the server mints all of them."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /parades", payload: { name: "System Fields Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z", id: "11111111-1111-4111-8111-111111111111", created_at: "1999-01-01T00:00:00Z", version: 99, status: "COMPLETED" }, as: CommitteeAdmin, captures: { p_id: $.data.id, st: $.data.status, v: $.data.version } }
          assert:
            - "response 201; status == DRAFT and version == 1 despite the client sending COMPLETED/99"
            - "returned id != 11111111-1111-4111-8111-111111111111 and created_at reflects the logical clock, not 1999"

      - name: get_parade_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PARADE_NOT_FOUND]", "endpoints.GET_/parades/{id}"]
        distinguishing_aspect: "Reading a random UUID yields ERR_PARADE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /parades/22222222-2222-4222-8222-222222222222", payload: {}, as: CommitteeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PARADE_NOT_FOUND and HTTP 404"

      - name: entry_fee_computed_at_create_from_requested_category
        claim_type: computed_fields
        grounds: [entities.EntryApplication.fields.fee_cents, calculations.entry_fee]
        distinguishing_aspect: "fee_cents is computed (input ignored): FLOAT with 120 participants filed before the late window yields exactly 79000 cents."
        test_recipe:
          setup: ["One parade exists; logical clock at default 2026-05-01 (before the late window)"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Fee Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Fee Floats", requested_category: "FLOAT", estimated_participants: 120 }, as: Entrant, as_user_id: "entrant_1", captures: { fee: $.data.fee_cents, cat: $.data.assigned_category } }
          assert:
            - "fee_cents == 79000 (50000 base + 50x300 + 70x200, no late surcharge)"
            - "assigned_category == null at create; the computation used requested_category"

      - name: entries_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET_/parades/{id}/entries"]
        distinguishing_aspect: "List responses carry the envelope pagination fields; limit 2 over 3 rows yields has_more true and total_count 3."
        test_recipe:
          setup: ["One parade with three SUBMITTED entries"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Page Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Page One", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1" }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Page Two", requested_category: "BAND", estimated_participants: 11 }, as: Entrant, as_user_id: "entrant_2" }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Page Three", requested_category: "BAND", estimated_participants: 12 }, as: Entrant, as_user_id: "entrant_3" }
          trigger:
            - { call: "GET /parades/${p_id}/entries", payload: { limit: 2, offset: 0 }, as: CommitteeAdmin }
          assert:
            - "response_type == array; exactly 2 items returned"
            - "total_count == 3 and has_more == true; meta contains api_request_id and api_request_timestamp"

      - name: route_segment_under_missing_parade_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.RouteSegment.fields.parade_id, "errors[ERR_PARADE_NOT_FOUND]"]
        distinguishing_aspect: "Creating a child under a non-existent parade fails existence validation with ERR_PARADE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /parades/33333333-3333-4333-8333-333333333333/route-segments", payload: { order_index: 1, name: "Nowhere", length_meters: 100, emergency_lane_width_m: 3.5, segment_window_start: "2026-07-04T10:00:00Z", segment_window_end: "2026-07-04T11:00:00Z" }, as: CommitteeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PARADE_NOT_FOUND and HTTP 404"

  - section: state_machines
    instances:
      - name: entry_reject_before_review_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.EntryApplication, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "reject is declared only from UNDER_REVIEW; from SUBMITTED it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["One parade; one SUBMITTED entry"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "State Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Early Reject", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
          trigger:
            - { call: "POST /entries/${en_id}/reject", payload: {}, as: CommitteeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP 409"
            - "EntryApplication.status remains SUBMITTED"

      - name: withdrawn_entry_approve_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EntryApplication, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: after the owning entrant withdraws a SUBMITTED entry, approve fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["One parade; one SUBMITTED entry withdrawn by its owner"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Terminal Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Quitters", requested_category: "WALKING_GROUP", estimated_participants: 20 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/withdraw", payload: {}, as: Entrant, as_user_id: "entrant_1" }
          trigger:
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "WALKING_GROUP" }, as: CommitteeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP 409"
            - "EntryApplication.status remains WITHDRAWN and assigned_category remains null"

      - name: publish_lineup_with_fresh_version_succeeds_and_locks_scripts
        claim_type: side_effect_execution
        grounds: [state_machines.ParadeEvent.LOCKED_to_LINEUP_PUBLISHED, state_machines.AnnouncerScriptItem.APPROVED_to_LOCKED, "concurrency_rules[lineup-publish-stale-parade]"]
        distinguishing_aspect: "A publish carrying the version observed at lock succeeds: parade becomes LINEUP_PUBLISHED, version increments, and every APPROVED script item locks."
        test_recipe:
          setup:
            - "Parade OPERATIONAL and LOCKED (permit GRANTED, dispersal APPROVED); one APPROVED BAND entry with a TENTATIVE assignment; one APPROVED SAFETY_ANNOUNCEMENT script item"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Publish Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/route-segments", payload: { order_index: 1, name: "Main St", length_meters: 800, emergency_lane_width_m: 3.5, segment_window_start: "2026-07-04T10:00:00Z", segment_window_end: "2026-07-04T12:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/staging-areas", payload: { name: "Lot P", capacity: 3, open_time: "2026-07-04T07:00:00Z", close_time: "2026-07-04T10:00:00Z" }, as: CommitteeAdmin, captures: { sa_id: $.data.id } }
            - { call: "POST /parades/${p_id}/dispersal-plan", payload: { emergency_lane_width_m: 3.5, dispersal_corridors: ["Oak Ave"] }, as: CommitteeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /dispersal-plans/${dp_id}/submit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /dispersal-plans/${dp_id}/approve", payload: {}, as: AgencyReviewer }
            - { call: "POST /parades/${p_id}/permit", payload: {}, as: CommitteeAdmin, captures: { pm_id: $.data.id, pm_v: $.data.version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "POLICE", expected_permit_version: "${pm_v}" }, as: CommitteeAdmin, captures: { e1: $.data.id, pv1: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "FIRE", expected_permit_version: "${pv1}" }, as: CommitteeAdmin, captures: { e2: $.data.id, pv2: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "TRANSIT", expected_permit_version: "${pv2}" }, as: CommitteeAdmin, captures: { e3: $.data.id, pv3: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "SANITATION", expected_permit_version: "${pv3}" }, as: CommitteeAdmin, captures: { e4: $.data.id } }
            - { call: "POST /parades/${p_id}/submit-permit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /permits/${pm_id}/submit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /endorsements/${e1}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /endorsements/${e2}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /endorsements/${e3}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /endorsements/${e4}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /permits/${pm_id}/grant", payload: {}, as: AgencyReviewer }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Publish Band", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "BAND" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/lineup-assignments", payload: { entry_id: "${en_id}", staging_area_id: "${sa_id}", position_number: 1, arrive_at: "2026-07-04T07:30:00Z", depart_at: "2026-07-04T08:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/script-items", payload: { item_type: "SAFETY_ANNOUNCEMENT", sequence_index: 1, duration_minutes: 0.5 }, as: CommitteeAdmin, captures: { si_id: $.data.id } }
            - { call: "POST /script-items/${si_id}/approve", payload: {}, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/lock", payload: {}, as: CommitteeAdmin, captures: { v_lock: $.data.version } }
          trigger:
            - { call: "POST /parades/${p_id}/publish-lineup", payload: { expected_parade_version: "${v_lock}" }, as: CommitteeAdmin, captures: { st: $.data.status, v_after: $.data.version } }
            - { call: "GET /script-items/${si_id}", payload: {}, as: CommitteeAdmin, captures: { si_status: $.data.status } }
          assert:
            - "ParadeEvent.status == LINEUP_PUBLISHED and version == v_lock + 1"
            - "AnnouncerScriptItem.status == LOCKED (publish side effect)"
            - "posture remains OPERATIONAL"

      - name: complete_with_nonterminal_assignment_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ParadeEvent.LINEUP_PUBLISHED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete requires every assignment terminal; with a TENTATIVE assignment still open it fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Parade LINEUP_PUBLISHED with one TENTATIVE assignment (same pipeline as the publish instance)"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Complete Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/route-segments", payload: { order_index: 1, name: "Main St", length_meters: 800, emergency_lane_width_m: 3.5, segment_window_start: "2026-07-04T10:00:00Z", segment_window_end: "2026-07-04T12:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/staging-areas", payload: { name: "Lot Q", capacity: 3, open_time: "2026-07-04T07:00:00Z", close_time: "2026-07-04T10:00:00Z" }, as: CommitteeAdmin, captures: { sa_id: $.data.id } }
            - { call: "POST /parades/${p_id}/dispersal-plan", payload: { emergency_lane_width_m: 3.5, dispersal_corridors: ["Oak Ave"] }, as: CommitteeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /dispersal-plans/${dp_id}/submit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /dispersal-plans/${dp_id}/approve", payload: {}, as: AgencyReviewer }
            - { call: "POST /parades/${p_id}/permit", payload: {}, as: CommitteeAdmin, captures: { pm_id: $.data.id, pm_v: $.data.version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "POLICE", expected_permit_version: "${pm_v}" }, as: CommitteeAdmin, captures: { e1: $.data.id, pv1: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "FIRE", expected_permit_version: "${pv1}" }, as: CommitteeAdmin, captures: { e2: $.data.id, pv2: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "TRANSIT", expected_permit_version: "${pv2}" }, as: CommitteeAdmin, captures: { e3: $.data.id, pv3: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "SANITATION", expected_permit_version: "${pv3}" }, as: CommitteeAdmin, captures: { e4: $.data.id } }
            - { call: "POST /parades/${p_id}/submit-permit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /permits/${pm_id}/submit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /endorsements/${e1}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /endorsements/${e2}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /endorsements/${e3}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /endorsements/${e4}/endorse", payload: {}, as: AgencyReviewer }
            - { call: "POST /permits/${pm_id}/grant", payload: {}, as: AgencyReviewer }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Complete Band", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "BAND" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/lineup-assignments", payload: { entry_id: "${en_id}", staging_area_id: "${sa_id}", position_number: 1, arrive_at: "2026-07-04T07:30:00Z", depart_at: "2026-07-04T08:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/lock", payload: {}, as: CommitteeAdmin, captures: { v_lock: $.data.version } }
            - { call: "POST /parades/${p_id}/publish-lineup", payload: { expected_parade_version: "${v_lock}" }, as: CommitteeAdmin }
          trigger:
            - { call: "POST /parades/${p_id}/complete", payload: {}, as: CommitteeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP 409 — a TENTATIVE assignment is not terminal"
            - "ParadeEvent.status remains LINEUP_PUBLISHED"

  - section: calculations
    instances:
      - name: entry_fee_early_no_surcharge_correct_result
        claim_type: correct_result
        grounds: [calculations.entry_fee]
        distinguishing_aspect: "Early filing takes the no-surcharge branch: BAND with 10 participants at the default clock yields exactly 33000 cents."
        test_recipe:
          setup: ["One parade; logical clock at default 2026-05-01 (outside the 7-day late window)"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Early Fee Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Early Band", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { fee: $.data.fee_cents } }
          assert:
            - "fee_cents == 33000 (30000 base + 10x300 tier1, surcharge branch not taken)"

      - name: permit_final_fee_expedited_surcharge_applied
        claim_type: constants_applied
        grounds: [calculations.permit_filing_fee]
        distinguishing_aspect: "Submitting within 14 days of parade_date takes the expedite branch: 90000 + round_half_up(0.20 x 90000) = 108000 cents."
        test_recipe:
          setup:
            - "Parade PERMIT_PENDING (segment + staging exist); permit with four PENDING endorsements; logical clock advanced to 2026-06-25T00:00:00Z — within 14 days of the 2026-07-04 parade date"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Expedite Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/route-segments", payload: { order_index: 1, name: "Main St", length_meters: 800, emergency_lane_width_m: 3.5, segment_window_start: "2026-07-04T10:00:00Z", segment_window_end: "2026-07-04T12:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/staging-areas", payload: { name: "Lot R", capacity: 3, open_time: "2026-07-04T07:00:00Z", close_time: "2026-07-04T10:00:00Z" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/permit", payload: {}, as: CommitteeAdmin, captures: { pm_id: $.data.id, pm_v: $.data.version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "POLICE", expected_permit_version: "${pm_v}" }, as: CommitteeAdmin, captures: { pv1: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "FIRE", expected_permit_version: "${pv1}" }, as: CommitteeAdmin, captures: { pv2: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "TRANSIT", expected_permit_version: "${pv2}" }, as: CommitteeAdmin, captures: { pv3: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "SANITATION", expected_permit_version: "${pv3}" }, as: CommitteeAdmin }
            - { call: "POST /parades/${p_id}/submit-permit", payload: {}, as: CommitteeAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-25T00:00:00Z" }, as: CommitteeAdmin }
          trigger:
            - { call: "POST /permits/${pm_id}/submit", payload: {}, as: CommitteeAdmin, captures: { final_fee: $.data.final_fee_cents } }
          assert:
            - "final_fee_cents == 108000 — per-agency base 90000 plus 20% expedite surcharge because submitted_at is inside the 14-day window"
            - "provisional_fee_cents remains 95000 (the stale estimate is preserved, not overwritten)"

      - name: judging_variant_divergence_covered
        claim_type: correct_result
        grounds: [calculations.judging_score]
        excluded_because:
          difficulty_instance: "dual_variant_calc / judging_provisional_vs_final_trimmed_mean"
          rationale: "Both variants exercised with literal expectations (77.00 vs 80.00) in the named §1.8 instance."

      - name: staging_capacity_boundary_covered
        claim_type: correct_result
        grounds: [calculations.staging_window_conflict]
        excluded_because:
          difficulty_instance: "boundary_precision_check / staging_capacity_exact_full_rejects_next"
          rationale: "Capacity >= boundary exercised at capacity-1 accept and capacity reject in the named §1.8 instance."

  - section: validations
    instances:
      - name: entry_create_after_deadline_returns_deadline_passed
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ENTRY_DEADLINE_PASSED]"]
        distinguishing_aspect: "Logical clock past entry_deadline: creation fails with ERR_ENTRY_DEADLINE_PASSED (422)."
        test_recipe:
          setup: ["One parade with entry_deadline 2026-06-20T23:59:59Z; logical clock at 2026-06-21T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Deadline Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-21T00:00:00Z" }, as: CommitteeAdmin }
          trigger:
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Too Late", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENTRY_DEADLINE_PASSED and HTTP 422"

      - name: entry_create_exactly_at_deadline_passes
        claim_type: satisfaction_pass
        grounds: ["validations[priority=8]", entities.EntryApplication]
        distinguishing_aspect: "The deadline gate is current_utc <= entry_deadline: creation at the exact deadline instant succeeds (inclusive boundary)."
        test_recipe:
          setup: ["One parade with entry_deadline 2026-06-20T23:59:59Z; logical clock set to exactly that instant"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Exact Deadline Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin }
          trigger:
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Just In Time", requested_category: "BAND", estimated_participants: 10 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id, st: $.data.status } }
          assert:
            - "response 201; EntryApplication.status == SUBMITTED — the boundary instant is on the accepting side"

      - name: sponsor_read_item_missing_required_sponsor_id_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", entities.AnnouncerScriptItem.fields.sponsor_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Conditional required field: SPONSOR_READ without sponsor_id fails schema validation even though sponsor_id is optional for other item types."
        test_recipe:
          setup: ["One parade exists"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Cond Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /parades/${p_id}/script-items", payload: { item_type: "SPONSOR_READ", sequence_index: 1, duration_minutes: 1.0 }, as: CommitteeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and HTTP 400"

      - name: reinspection_by_same_inspector_rejected_sod
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_REINSPECTION_SOD]", roles.SafetyInspector]
        distinguishing_aspect: "Segregation of duties: the inspector who recorded the float's latest FAILED inspection cannot schedule its re-inspection."
        test_recipe:
          setup: ["One parade; APPROVED FLOAT entry with a float whose first inspection (inspector insp_1) FAILED"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "SoD Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "SoD Floats", requested_category: "FLOAT", estimated_participants: 50 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "FLOAT" }, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/floats", payload: { length_m: 10, width_m: 3, height_m: 4, weight_kg: 7000, vehicle_class: "SELF_PROPELLED", fuel_type: "DIESEL" }, as: Entrant, as_user_id: "entrant_1", captures: { fl_id: $.data.id } }
            - { call: "POST /floats/${fl_id}/inspections", payload: { scheduled_at: "2026-06-25T09:00:00Z" }, as: SafetyInspector, as_user_id: "insp_1", captures: { ins1: $.data.id } }
            - { call: "POST /inspections/${ins1}/fail", payload: { checklist_score: 50 }, as: SafetyInspector, as_user_id: "insp_1" }
          trigger:
            - { call: "POST /floats/${fl_id}/inspections", payload: { scheduled_at: "2026-06-28T09:00:00Z" }, as: SafetyInspector, as_user_id: "insp_1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REINSPECTION_SOD and HTTP 422 — same inspector as the latest FAILED inspection"
            - "no new SafetyInspection is persisted for the float"

      - name: reinspection_pass_by_different_inspector_reinstates_entry
        claim_type: side_effect_execution
        grounds: [state_machines.Float.FAILED_to_PENDING_INSPECTION, state_machines.EntryApplication.SUSPENDED_to_APPROVED]
        distinguishing_aspect: "Compensation chain: a different inspector's PASSED re-inspection re-certifies the float and reinstates the suspended entry to APPROVED."
        test_recipe:
          setup: ["One parade; APPROVED FLOAT entry suspended by insp_1's failed inspection; re-inspection scheduled by insp_2"]
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Reinstate Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/entries", payload: { org_name: "Reinstate Floats", requested_category: "FLOAT", estimated_participants: 50 }, as: Entrant, as_user_id: "entrant_1", captures: { en_id: $.data.id } }
            - { call: "POST /entries/${en_id}/start-review", payload: {}, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/approve", payload: { assigned_category: "FLOAT" }, as: CommitteeAdmin }
            - { call: "POST /entries/${en_id}/floats", payload: { length_m: 10, width_m: 3, height_m: 4, weight_kg: 7000, vehicle_class: "TOWED", fuel_type: "NONE" }, as: Entrant, as_user_id: "entrant_1", captures: { fl_id: $.data.id } }
            - { call: "POST /floats/${fl_id}/inspections", payload: { scheduled_at: "2026-06-25T09:00:00Z" }, as: SafetyInspector, as_user_id: "insp_1", captures: { ins1: $.data.id } }
            - { call: "POST /inspections/${ins1}/fail", payload: { checklist_score: 50 }, as: SafetyInspector, as_user_id: "insp_1" }
            - { call: "POST /floats/${fl_id}/inspections", payload: { scheduled_at: "2026-06-28T09:00:00Z" }, as: SafetyInspector, as_user_id: "insp_2", captures: { ins2: $.data.id } }
          trigger:
            - { call: "POST /inspections/${ins2}/pass", payload: { checklist_score: 80 }, as: SafetyInspector, as_user_id: "insp_2" }
            - { call: "GET /floats/${fl_id}", payload: {}, as: CommitteeAdmin, captures: { fl_st: $.data.compliance_status } }
            - { call: "GET /entries/${en_id}", payload: {}, as: CommitteeAdmin, captures: { en_st: $.data.status } }
          assert:
            - "Float.compliance_status == CERTIFIED"
            - "EntryApplication.status == APPROVED — the suspension is compensated, restoring approved_entry_count"

      - name: dispersal_submit_narrow_lane_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_EMERGENCY_LANE_TOO_NARROW]"]
        distinguishing_aspect: "Dispersal submit enforces the 3.0 m emergency lane floor: 2.5 m is rejected."
        test_recipe:
          setup: ["One parade with a dispersal plan whose emergency_lane_width_m is 2.5"]
