      - name: corner_error_rotation_chain_rejects_every_malformed_link
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_ROTATION_CHAIN_INVALID
          - validations[order=38]
          - entities.TourStop.fields.preceding_stop_id
        distinguishing_aspect: "preceding_stop_id models the market rotation chain and four distinct malformations collapse into one code: self-reference, a stop from another season, a stop dated on or after this one (which would invert the tour), and a stop already claimed as the predecessor of a third stop. Same-day is rejected as well as later, so the comparison is not strict."
        test_recipe:
          setup:
            - "Season A with three accepted bookings: ATL 2026-11-14, DAL 2026-12-05 and OMA 2027-01-09"
            - "Season B with one accepted booking: PHX 2026-11-21, so a cross-season link can be attempted"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
