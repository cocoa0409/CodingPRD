  # =============================================================================
  # Rule 7: cross_entity_state_dependency — on different entity pairs.
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: route_dispatch_blocked_by_inactive_segment
        grounds:
          - state_machines.SurveyRoute.PLANNED_to_DISPATCHED
          - entities.PipeSegment.fields.status
        distinguishing_aspect: |
          Entity pair: SurveyRoute -> PipeSegment. SurveyRoute transition
          PLANNED->DISPATCHED requires EVERY RouteSegmentAssignment to reference
          a PipeSegment with status == ACTIVE. Setting one segment OUT_OF_SERVICE
          blocks dispatch of the route even though the route itself is
          well-formed.
