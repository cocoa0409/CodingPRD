          rationale: "That §1.8 instance drives the full validate-then-cascade chain of a REJECT decision, including the invitation withdrawals and the reviewer probation flip that follow it."
  - section: endpoints
    instances:
      - name: recusal_action_endpoint_releases_editor_and_proposes_replacement
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /editor-assignments/{id}/recusal]
          - state_machines.EditorAssignment.ACTIVE_to_RECUSED
          - calculations.editor_assignment_selection
          - entities.EditorAssignment.fields.replaced_assignment_id
        distinguishing_aspect: |
          The recusal action does four things in one 200 response that no CRUD write does: it moves the
          ACTIVE assignment to RECUSED with released_reason RECUSAL, decrements that editor's
          active_assignment_count to 0, runs editor_assignment_selection - which cannot pick the recused
          editor again - and links the fresh PROPOSED row back through replaced_assignment_id.
        test_recipe:
          setup:
            - "One journal with a chief editor and two handling editors: Handling One (Univ Beta) and Handling Two (Univ Theta), both covering ONCOLOGY."
            - "One manuscript screened PASS whose assignment to Handling One is ACTIVE after a clean conflict declaration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /journals"
              payload: { name: "Journal of Recusals", subject_areas: ["ONCOLOGY"] }
