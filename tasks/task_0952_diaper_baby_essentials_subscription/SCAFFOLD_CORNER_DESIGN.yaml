              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /accounts"
              payload: { email: "scope-p@example.com", full_name: "Scope Purchaser" }
              as: Anonymous
              captures: { p_id: $.data.id, p_tok: $.data.verification_token }
            - call: "POST /accounts/${p_id}/verify"
              payload: { verification_token: "${p_tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: GiftPurchaser
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_GIFT_PURCHASER_SCOPE"
            - "HTTP status is 403"
            - "no Cycle row exists with subscription_id == ${sub_id}"

      - name: corner_account_holder_cannot_read_another_households_child
        claim_type: role_denial
        grounds: ["validations[priority=12]", "errors[ERR_NOT_ACCOUNT_OWNER]"]
        distinguishing_aspect: "Account B reading account A's child passes the role check (AccountHolder is permitted on GET /children/{id}) and is stopped by the ownership rung 12 with ERR_NOT_ACCOUNT_OWNER (403)."
        test_recipe:
