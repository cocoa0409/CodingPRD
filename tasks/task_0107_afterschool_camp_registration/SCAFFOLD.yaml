scenario: "107. After-School Programs & Summer Camp Registration: session capacity, age grouping, weekly enrollment, parental authorization (medical/pickup), scholarships, sibling discount, rainy-day alternatives, emergency contact"
domain_name: afterschool-camp-registration
api_prefix: /camp

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "Temporal windowing"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Compliance / audit"

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ─────────────────────────────────────────────────────────────
# §1.1 Entity-Relationship Table
# ─────────────────────────────────────────────────────────────
entities:
  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: household_name
        type: string
        source: input
        description: Display name of the family household
        constraints: 1–100 chars
      - name: primary_email
        type: string
        source: input
        description: Primary contact email for the family
        constraints: lower-cased, unique among non-archived families
      - name: residency_status
        type: enum
        source: input
        description: Residency category used for scholarship base eligibility
        default: STANDARD
        constraints: "values in {STANDARD, IN_DISTRICT, OUT_OF_DISTRICT}"
      - name: archived
        type: boolean
        source: system
        description: True after soft-delete; archived families cannot enroll new children
        default: false

  - name: Guardian
    parent: Family
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: Foreign key to Family.id
      - name: full_name
        type: string
        source: input
        description: Legal name on guardian record
        constraints: 1–100 chars
      - name: phone
        type: string
        source: input
        description: Reachable phone number for pickup verification
        constraints: E.164-style, 8–20 chars
      - name: relationship
        type: enum
        source: input
        description: Relationship to the children in this family
        constraints: "values in {PARENT, STEP_PARENT, LEGAL_GUARDIAN, OTHER}"
      - name: is_primary
        type: boolean
        source: input
        description: Exactly one guardian per family is primary; primary receives invoices
        default: false

  - name: Child
    parent: Family
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: Foreign key to Family.id
      - name: full_name
        type: string
        source: input
        description: Legal name on roster
        constraints: 1–100 chars
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date used to compute age on each session's reference date
        constraints: ISO 8601 (YYYY-MM-DD), must be in the past relative to current clock
      - name: medical_authorization_status
        type: enum
        source: computed
        description: Derived from active Authorization records of kind MEDICAL
        default: NONE
        constraints: "values in {NONE, ACTIVE, EXPIRED}"
      - name: pickup_authorization_status
        type: enum
        source: computed
        description: Derived from active Authorization records of kind PICKUP
        default: NONE
        constraints: "values in {NONE, ACTIVE, EXPIRED}"
      - name: emergency_contact_count
        type: integer
        source: computed
        description: Count of non-archived EmergencyContact rows for this child
        default: 0

  - name: EmergencyContact
    parent: Child
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: input
        description: Foreign key to Child.id
      - name: full_name
        type: string
        source: input
        description: Emergency contact's legal name
        constraints: 1–100 chars
      - name: phone
        type: string
        source: input
        description: Emergency phone number
        constraints: E.164-style, 8–20 chars
      - name: relationship
        type: string
        source: input
        description: Free-text relationship label (e.g., aunt, neighbor)
        constraints: 1–60 chars
      - name: priority
        type: integer
        source: input
        description: Lower numbers are called first; unique per (child_id, priority)
        constraints: 1–9 inclusive
      - name: archived
        type: boolean
        source: system
        description: Archived contacts no longer count toward emergency_contact_count
        default: false

  - name: Authorization
    parent: Child
    common_fields: false
    fields:
      - name: child_id
        type: string
        source: input
        description: Foreign key to Child.id
      - name: guardian_id
        type: string
        source: input
        description: Foreign key to Guardian.id; must belong to the same family as the child
      - name: kind
        type: enum
        source: input
        description: Authorization category
        constraints: "values in {MEDICAL, PICKUP}"
      - name: scope_text
        type: string
        source: input
        description: Specifies what is authorized (treatments, pickup persons)
        constraints: 1–500 chars
      - name: effective_at
        type: datetime
        source: input
        description: First instant at which the authorization is valid (UTC ISO 8601)
      - name: expires_at
        type: datetime
        source: input
        description: First instant at which the authorization is no longer valid; must be > effective_at
      - name: status
        type: enum
        source: computed
        description: Computed on read and on clock advance
        default: ACTIVE
        constraints: "values in {ACTIVE, EXPIRED, REVOKED}"
      - name: revoked_at
        type: datetime
        source: system
        description: Set when status transitions to REVOKED
        default: null

  - name: Session
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Program title
        constraints: 1–120 chars
      - name: kind
        type: enum
        source: input
        description: Distinguishes after-school programs from summer camp blocks
        constraints: "values in {AFTERSCHOOL, SUMMER_CAMP}"
      - name: age_min
        type: integer
        source: input
        description: Inclusive minimum age in whole years on the session's reference_date
        constraints: 3 ≤ age_min ≤ age_max ≤ 17
      - name: age_max
        type: integer
        source: input
        description: Inclusive maximum age in whole years on the session's reference_date
        constraints: 3 ≤ age_min ≤ age_max ≤ 17
      - name: reference_date
        type: string
        source: input
        description: ISO date used to compute each child's age for the eligibility check
      - name: weekly_capacity
        type: integer
        source: input
        description: Maximum confirmed enrollments per ISO week for this session
        constraints: 1 ≤ weekly_capacity ≤ 200
      - name: week_start
        type: string
        source: input
        description: ISO date (Monday) of the first enrollable week
      - name: week_count
        type: integer
        source: input
        description: Number of consecutive enrollable ISO weeks beginning at week_start
        constraints: 1 ≤ week_count ≤ 12
      - name: base_weekly_fee_cents
        type: integer
        source: input
        description: Per-week list price in cents before any discount or scholarship
        constraints: ≥ 0
      - name: rainy_day_pool_per_week
        type: integer
        source: input
        description: Indoor backup seats per week reserved for rainy-day reroutes
        constraints: 0 ≤ rainy_day_pool_per_week ≤ weekly_capacity
      - name: status
        type: enum
        source: system
        description: Lifecycle status
        default: DRAFT
        constraints: "values in {DRAFT, OPEN, CLOSED, CANCELLED}"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: input
        description: Foreign key to Child.id
      - name: session_id
        type: string
        source: input
        description: Foreign key to Session.id
      - name: week_index
        type: integer
        source: input
        description: Zero-based index into Session.week_count
        constraints: 0 ≤ week_index < Session.week_count
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        default: PENDING_AUTH
        constraints: "values in {PENDING_AUTH, CONFIRMED, WAITLISTED, CANCELLED, COMPLETED}"
      - name: list_fee_cents
        type: integer
        source: computed
        description: Session.base_weekly_fee_cents snapshotted at confirmation time
        default: 0
      - name: sibling_discount_cents
        type: integer
        source: computed
        description: Discount applied due to sibling rule; recomputed only at the moment of confirmation
        default: 0
      - name: scholarship_discount_cents
        type: integer
        source: computed
        description: Award credit pinned to this Enrollment; snapshotted at confirmation
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: list_fee_cents − sibling_discount_cents − scholarship_discount_cents, never below zero
        default: 0
      - name: scholarship_award_id
        type: string
        source: system
        description: Optional FK to ScholarshipAward consumed by this enrollment
        default: null
      - name: waitlist_position
        type: integer
        source: system
        description: 1-based queue position; null when status != WAITLISTED
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: When status moved to CANCELLED
        default: null

  - name: ScholarshipAward
    parent: Family
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: Foreign key to Family.id
      - name: total_credit_cents
        type: integer
        source: input
        description: Lifetime credit granted to this family
        constraints: ≥ 1
      - name: consumed_credit_cents
        type: integer
        source: computed
        description: Sum of scholarship_discount_cents across confirmed enrollments charged to this award
        default: 0
      - name: granted_for_kind
        type: enum
        source: input
        description: Restricts which session kind the award may be applied to
        constraints: "values in {AFTERSCHOOL, SUMMER_CAMP, ANY}"
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        default: ACTIVE
        constraints: "values in {ACTIVE, EXHAUSTED, REVOKED}"
      - name: revoked_at
        type: datetime
        source: system
        description: Set when admin revokes the award
        default: null

  - name: SessionDay
    parent: Session
    common_fields: false
    fields:
      - name: session_id
        type: string
        source: input
        description: Foreign key to Session.id
      - name: week_index
        type: integer
        source: input
        description: Which week this day belongs to (0-based)
      - name: day_date
        type: string
        source: input
        description: ISO date for this program day
      - name: weather_status
        type: enum
        source: system
        description: Operator-set weather posture for the day
        default: NORMAL
        constraints: "values in {NORMAL, RAINY, CLOSED}"
      - name: rainy_day_used
        type: integer
        source: computed
        description: Count of attendees rerouted to indoor backup on this day
        default: 0
      - name: outdoor_headcount
        type: integer
        source: computed
        description: Count of attendees still scheduled outdoors after weather posture is applied
        default: 0

# ─────────────────────────────────────────────────────────────
# §1.2 State Machine Table
# ─────────────────────────────────────────────────────────────
state_machines:
  - entity: Session
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /camp/sessions/{id}/open"
        actor: ProgramAdmin
        preconditions:
          - "Session.week_count ≥ 1"
          - "Session.weekly_capacity ≥ 1"
          - "Session.age_min ≤ Session.age_max"
        side_effects:
          - "Generate one SessionDay row per business day in each ISO week of the session"
          - "Set status=OPEN"
      - from: OPEN
        to: CLOSED
        trigger: "POST /camp/sessions/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "All weeks of the session have reached week_start+7 days on the clock"
        side_effects:
          - "Auto-transition any Enrollment with status=CONFIRMED to COMPLETED"
          - "Auto-transition any Enrollment with status IN {PENDING_AUTH, WAITLISTED} to CANCELLED with cancelled_at=now"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /camp/sessions/{id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "Session.status = OPEN"
        side_effects:
          - "Cascade: every Enrollment on this session whose status IN {PENDING_AUTH, CONFIRMED, WAITLISTED} moves to CANCELLED"
          - "Each cancelled CONFIRMED enrollment triggers ScholarshipAward.consumed_credit_cents recompute"
          - "Each cancelled CONFIRMED enrollment triggers sibling discount recomputation on remaining CONFIRMED siblings in the same week (see calculation: sibling_discount_on_cancel)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /camp/sessions/{id}/cancel"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Set status=CANCELLED"

  - entity: Enrollment
    initial_state: PENDING_AUTH
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: PENDING_AUTH
        to: CONFIRMED
        trigger: "POST /camp/enrollments/{id}/confirm"
        actor: Guardian
        preconditions:
          - "Session.status = OPEN"
          - "Child.medical_authorization_status = ACTIVE at request time"
          - "Child.pickup_authorization_status = ACTIVE at request time"
          - "Child.emergency_contact_count ≥ 1"
          - "Child's age in whole years on Session.reference_date is within [Session.age_min, Session.age_max]"
          - "Confirmed-count for (session_id, week_index) is strictly less than Session.weekly_capacity"
        side_effects:
          - "list_fee_cents := Session.base_weekly_fee_cents"
          - "Compute sibling_discount_cents per calculation: sibling_discount"
          - "Compute scholarship_discount_cents per calculation: scholarship_allocation; set scholarship_award_id if applied"
          - "final_fee_cents := max(0, list_fee_cents − sibling_discount_cents − scholarship_discount_cents)"
          - "ScholarshipAward.consumed_credit_cents += scholarship_discount_cents"
          - "If ScholarshipAward.consumed_credit_cents == ScholarshipAward.total_credit_cents → ScholarshipAward.status := EXHAUSTED (auto-transition)"
          - "For every other CONFIRMED sibling enrollment in the same (session_id, week_index): recompute sibling_discount_cents and final_fee_cents (cascade)"
      - from: PENDING_AUTH
        to: WAITLISTED
        trigger: "POST /camp/enrollments/{id}/confirm when capacity full"
        actor: Guardian
        preconditions:
          - "All confirmation preconditions hold EXCEPT capacity is at Session.weekly_capacity"
        side_effects:
          - "Set waitlist_position := 1 + max(existing positions for (session_id, week_index))"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system: capacity opens via cancellation"
        actor: system
        preconditions:
          - "A confirmed peer cancelled; lowest waitlist_position is promoted"
          - "All preconditions for confirmation still hold (auth, age, emergency contact)"
        side_effects:
          - "Apply identical side-effect chain as PENDING_AUTH→CONFIRMED transition"
          - "If a waitlisted enrollment fails re-check (e.g., auth has expired) it is skipped; promotion continues with the next waitlist entry"
      - from: PENDING_AUTH
        to: CANCELLED
        trigger: "POST /camp/enrollments/{id}/cancel"
        actor: Guardian
        preconditions: []
        side_effects:
          - "Set cancelled_at := now"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /camp/enrollments/{id}/cancel"
        actor: Guardian
        preconditions: []
        side_effects:
          - "Set cancelled_at := now"
          - "Renumber waitlist_position for remaining WAITLISTED rows in same (session_id, week_index) to be contiguous starting at 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /camp/enrollments/{id}/cancel"
        actor: Guardian
        preconditions:
          - "Session.status = OPEN (cannot cancel after CLOSED)"
        side_effects:
          - "Set cancelled_at := now"
          - "Refund scholarship: ScholarshipAward.consumed_credit_cents -= this.scholarship_discount_cents; if status was EXHAUSTED and consumed < total then status := ACTIVE"
          - "Recompute sibling_discount_cents on every other CONFIRMED sibling enrollment in same (session_id, week_index), and update final_fee_cents accordingly"
          - "Attempt to promote the lowest waitlist_position WAITLISTED enrollment via system transition"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system: triggered by Session DRAFT→CLOSED transition"
        actor: system
        preconditions:
          - "Session.status transitioning to CLOSED"
        side_effects: []
      - from: PENDING_AUTH
        to: CANCELLED
        trigger: "system: auto on Session OPEN→CANCELLED or Session OPEN→CLOSED"
        actor: system
        preconditions:
          - "Session transitioned to CANCELLED or CLOSED"
        side_effects:
          - "Set cancelled_at := now"

  - entity: Authorization
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock now ≥ expires_at after POST /_clock/advance"
        actor: system
        preconditions:
          - "now ≥ expires_at"
        side_effects:
          - "Update parent Child's medical_authorization_status or pickup_authorization_status to EXPIRED if no remaining ACTIVE authorization of that kind"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /camp/authorizations/{id}/revoke"
        actor: Guardian | ProgramAdmin
        preconditions:
          - "Authorization.status = ACTIVE"
        side_effects:
          - "revoked_at := now"
          - "If Child has any CONFIRMED Enrollment in a future or current week (Session.week_start + 7*week_index > now) and this revocation drops medical_authorization_status or pickup_authorization_status below ACTIVE, those Enrollments must move to CANCELLED (cascade) with cancelled_at := now; each such cancellation triggers the standard CONFIRMED→CANCELLED side-effect chain (scholarship refund, sibling recompute, waitlist promotion)"

  - entity: ScholarshipAward
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: side-effect of Enrollment confirmation when consumed_credit_cents reaches total_credit_cents"
        actor: system
        preconditions:
          - "consumed_credit_cents == total_credit_cents after confirmation"
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: side-effect of confirmed enrollment cancellation"
        actor: system
        preconditions:
          - "consumed_credit_cents < total_credit_cents after cancellation refund"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /camp/scholarships/{id}/revoke"
        actor: ProgramAdmin
        preconditions:
          - "ScholarshipAward.status IN {ACTIVE, EXHAUSTED}"
        side_effects:
          - "revoked_at := now"
          - "Future-week Enrollments charged against this award keep their snapshotted discount (snapshot is immutable post-confirmation); but any subsequent confirmation attempt naming this award is rejected"
      - from: EXHAUSTED
        to: REVOKED
        trigger: "POST /camp/scholarships/{id}/revoke"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "revoked_at := now"

  - entity: SessionDay
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: RAINY
        trigger: "POST /camp/session-days/{id}/set-weather with weather_status=RAINY"
        actor: ProgramAdmin
        preconditions:
          - "day_date ≥ today's date on the clock"
          - "SessionDay belongs to Session whose status = OPEN"
        side_effects:
          - "Compute reroute per calculation: rainy_day_reroute"
          - "rainy_day_used := min(confirmed_attendees_for_day, Session.rainy_day_pool_per_week − rainy_day_used_for_other_RAINY_days_in_same_week)"
          - "outdoor_headcount := confirmed_attendees_for_day − rainy_day_used"
      - from: NORMAL
        to: CLOSED
        trigger: "POST /camp/session-days/{id}/set-weather with weather_status=CLOSED"
        actor: ProgramAdmin
        preconditions:
          - "day_date ≥ today's date on the clock"
        side_effects:
          - "outdoor_headcount := 0; rainy_day_used := 0"
      - from: RAINY
        to: NORMAL
        trigger: "POST /camp/session-days/{id}/set-weather with weather_status=NORMAL"
        actor: ProgramAdmin
        preconditions:
          - "day_date ≥ today's date on the clock"
        side_effects:
          - "rainy_day_used := 0; outdoor_headcount := confirmed_attendees_for_day"
      - from: CLOSED
        to: NORMAL
        trigger: "POST /camp/session-days/{id}/set-weather with weather_status=NORMAL"
        actor: ProgramAdmin
        preconditions:
          - "day_date ≥ today's date on the clock"
        side_effects:
          - "outdoor_headcount := confirmed_attendees_for_day; rainy_day_used := 0"

# ─────────────────────────────────────────────────────────────
# §1.2.1 Concurrency Rules
# ─────────────────────────────────────────────────────────────
concurrency_rules:
  - scenario: "Two PENDING_AUTH enrollments race to confirm into the last seat of (session_id, week_index)"
    guarantee: "At most Session.weekly_capacity enrollments can be CONFIRMED for a given (session_id, week_index); the second is rejected"
    error_id: ERR_WEEKLY_CAPACITY_FULL
    http_status: 409
    serialization: "First-writer-wins on (session_id, week_index) capacity counter"

  - scenario: "Two CONFIRMED enrollments race to consume the last cent of a ScholarshipAward credit pool"
    guarantee: "Total consumed_credit_cents may never exceed total_credit_cents; the second confirmation that would overflow is rejected"
    error_id: ERR_SCHOLARSHIP_EXHAUSTED
    http_status: 409
    serialization: "First-writer-wins on ScholarshipAward.consumed_credit_cents"

  - scenario: "Guardian revokes a medical authorization while a parallel request tries to confirm a pending enrollment for the same child"
    guarantee: "Exactly one operation succeeds; the loser sees the authorization invariant violated"
    error_id: ERR_AUTHORIZATION_NOT_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on Child.medical_authorization_status"

  - scenario: "Concurrent PATCH on the same Family with stale version"
    guarantee: "Stale write is rejected; client retries with fresh version"
    error_id: ERR_STALE_VERSION
    http_status: 409
    serialization: "OCC on Family.version"

  - scenario: "Two callers try to set weather on the same SessionDay simultaneously"
    guarantee: "Both compute valid reroute counts but only the later state is durably persisted; the second caller with a stale version is rejected"
    error_id: ERR_STALE_VERSION
    http_status: 409
    serialization: "OCC on SessionDay.version is not applicable (SessionDay has no version, common_fields=false); enforce first-writer-wins on (session_day_id, weather_status) and reject the loser"

  - scenario: "Two emergency contacts inserted with the same priority for the same child concurrently"
    guarantee: "Uniqueness of (child_id, priority) is enforced; the second insert is rejected"
    error_id: ERR_EMERGENCY_CONTACT_PRIORITY_TAKEN
    http_status: 409
    serialization: "First-writer-wins on (child_id, priority)"

# ─────────────────────────────────────────────────────────────
# §1.3 Calculation Rules Table
# ─────────────────────────────────────────────────────────────
calculations:
  - name: child_age_on_reference_date
    trigger: "Evaluated at the moment of POST /camp/enrollments/{id}/confirm and POST /camp/enrollments (creation eligibility precheck)"
    algorithm: forward_looking
    formula: |
      age = floor((Session.reference_date - Child.date_of_birth) / 365.2425 days)
      eligible = (Session.age_min <= age <= Session.age_max)
    input_set: "(Child.date_of_birth, Session.reference_date, Session.age_min, Session.age_max)"
    constants:
      DAYS_PER_YEAR: 365.2425
    precision: "Result is an integer; comparison uses integer values only"
    variants:
      - name: enrollment_precheck
        when: "POST /camp/enrollments — age is checked but the enrollment is still PENDING_AUTH if eligible"
        difference: "Failure returns ERR_AGE_OUT_OF_RANGE without creating the record"
      - name: confirmation_check
        when: "POST /camp/enrollments/{id}/confirm — age is re-checked against the SAME reference_date snapshot taken at creation time"
        difference: "Even if the child has aged out between creation and confirmation, the snapshot taken at creation rules; this is the chronological reading. (Alternate forward-looking reading would re-evaluate at confirmation and is the WRONG algorithm here — pin chronological.)"

  - name: sibling_discount
    trigger: "Computed at POST /camp/enrollments/{id}/confirm and recomputed on any CONFIRMED→CANCELLED cascade affecting a sibling"
    algorithm: tiered_pricing
    formula: |
      # N = count of currently-CONFIRMED enrollments for children in the same family
      #     attending the same (session_id, week_index), INCLUDING this enrollment after it becomes CONFIRMED
      # Tier table applied to EACH sibling's list_fee_cents:
      #   N == 1: 0%
      #   N == 2: 10%
      #   N == 3: 15%
      #   N >= 4: 20%
      # Computation order is pinned:
      #   1. Determine N (post-this-confirmation count of CONFIRMED enrollments for the family in the same (session_id, week_index))
      #   2. For each affected enrollment, compute sibling_pct from tier table
      #   3. raw_discount_cents = list_fee_cents * sibling_pct
      #   4. sibling_discount_cents = round_half_up(raw_discount_cents)  # PER-LINE-ITEM rounding, then sum at the family level later
    input_set: "All CONFIRMED enrollments where (Enrollment.session_id, Enrollment.week_index) matches AND Child.family_id matches"
    constants:
      TIER_PCT:
        N1: 0.00
        N2: 0.10
        N3: 0.15
        N4_PLUS: 0.20
    precision: "Per-line-item round_half_up to whole cents (PIN: round each sibling discount independently before summing the family's family-level discount; do NOT sum then round)"
    variants:
      - name: on_confirm
        when: "POST /camp/enrollments/{id}/confirm"
        difference: "N includes the about-to-be-confirmed row"
      - name: sibling_discount_on_cancel
        when: "CONFIRMED→CANCELLED cascade affecting other family enrollments in same (session_id, week_index)"
        difference: "N excludes the cancelled row; cents recomputed for each remaining sibling; final_fee_cents adjusted (may increase)"

  - name: scholarship_allocation
    trigger: "Computed at POST /camp/enrollments/{id}/confirm after sibling_discount but before final_fee_cents"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: the Family has zero or more ACTIVE ScholarshipAward rows for this Family.id
      # 1. Filter to awards eligible for Session.kind:
      #    eligible = [a for a in awards if a.granted_for_kind in {Session.kind, ANY} and a.status == ACTIVE]
      # 2. Order eligible by (granted_for_kind == Session.kind DESC,           # specific before ANY
      #                       (total_credit_cents - consumed_credit_cents) DESC, # larger remaining first
      #                       ScholarshipAward.created_at ASC)                  # earliest as final tiebreak
      # 3. Compute net_payable_cents = list_fee_cents - sibling_discount_cents (the post-sibling figure)
      # 4. Iterate the ordered list; for the FIRST award that has remaining >= 1 cent, allocate:
      #    scholarship_discount_cents = min(remaining_credit_cents, net_payable_cents)
      #    scholarship_award_id = that award's id
      # 5. Only ONE award may be applied per enrollment (no chaining across awards on the same row)
      # 6. If no eligible award exists or net_payable_cents == 0, scholarship_discount_cents = 0
    input_set: "ScholarshipAward rows for the child's family_id with status=ACTIVE"
    constants: {}
    precision: "Result is integer cents; no rounding needed because inputs are already in cents"
    variants:
      - name: provisional_quote
        when: "GET /camp/enrollments/{id}/fee-quote — returns a what-if quote BEFORE the row is confirmed"
        difference: "Uses the CURRENT (pre-confirmation) sibling count and CURRENT award balances; this quote is provisional and may differ from the final snapshot taken at confirmation."
      - name: final_snapshot
        when: "POST /camp/enrollments/{id}/confirm — value is snapshotted onto Enrollment row and is immutable thereafter"
        difference: "Locks the chosen award and amount even if balances later change; cancellation refunds against this snapshotted amount."

  - name: weekly_capacity_check
    trigger: "Precondition of PENDING_AUTH→CONFIRMED transition"
    algorithm: aggregation
    formula: |
      confirmed_in_week = COUNT(Enrollment WHERE session_id = X AND week_index = W AND status = CONFIRMED)
      seat_available = confirmed_in_week < Session.weekly_capacity
      # Strict inequality: when confirmed_in_week == weekly_capacity, the enrollment goes to WAITLIST.
    input_set: "Enrollment rows with status = CONFIRMED, matching session_id and week_index"
    constants: {}
    precision: "Integer counts; boundary is strict (< not <=)"
    variants: []

  - name: rainy_day_reroute
    trigger: "Side-effect of SessionDay NORMAL→RAINY transition"
    algorithm: waterfall_allocation
    formula: |
      # For SessionDay sd in Session s, week_index w:
      # 1. confirmed_attendees_for_day = COUNT(Enrollment WHERE session_id = s.id AND week_index = w AND status = CONFIRMED)
      # 2. pool_already_used_in_week = SUM(rainy_day_used) over SessionDay rows in same (session_id, week_index)
      #    EXCEPT the current sd, where weather_status IN {RAINY}
      # 3. pool_remaining = max(0, Session.rainy_day_pool_per_week - pool_already_used_in_week)
      # 4. rainy_day_used := min(confirmed_attendees_for_day, pool_remaining)
      # 5. outdoor_headcount := confirmed_attendees_for_day - rainy_day_used
      # PIN: the iteration order across days in the same week is "chronological by SessionDay.day_date ASC".
      # If the operator sets two days RAINY in the same week, the EARLIER day consumes the pool first.
      # Setting the EARLIER day RAINY AFTER a later day was already RAINY does NOT reorder
      # — pool_already_used_in_week is computed against current persisted state at the moment of the transition.
    input_set: "All SessionDay rows with weather_status=RAINY in the same (session_id, week_index); all CONFIRMED Enrollment rows for that (session_id, week_index)"
    constants: {}
    precision: "Integer counts"
    variants:
      - name: chronological_with_existing_RAINY
        when: "A later day's RAINY posture was set first; now an earlier day becomes RAINY"
        difference: "Pool is consumed in the persisted order, NOT day-date order. Pool_already_used reflects what RAINY days have already claimed regardless of their date."
      - name: forward_looking_with_existing_RAINY
        when: "Alternate (wrong) reading: recompute pool by sorting RAINY days chronologically and reallocating"
        difference: "This is explicitly NOT the chosen algorithm; if implemented, it produces a different rainy_day_used for the earlier day"

  - name: family_weekly_invoice_total
    trigger: "GET /camp/families/{id}/invoice?week_start=..."
    algorithm: aggregation
    formula: |
      # For the given family and ISO week (identified by week_start):
      # Iterate over all CONFIRMED Enrollment rows where Child.family_id = id AND week aligns:
      #   Session.week_start + 7*Enrollment.week_index days == requested week_start
      # invoice_total_cents = SUM(final_fee_cents) over these rows
      # PIN: do NOT re-derive final_fee_cents from current sibling/award state; sum the SNAPSHOTTED final_fee_cents on each row
    input_set: "All CONFIRMED Enrollment rows for the family in the requested week"
    constants: {}
    precision: "Integer cents — already rounded at the per-row level"
    variants: []

  - name: child_authorization_state_projection
    trigger: "Recomputed on read of Child, on Authorization status transition, and after POST /_clock/advance"
    algorithm: projection
    formula: |
      # For each kind k in {MEDICAL, PICKUP}:
      #   k_status =
      #     ACTIVE     if exists Authorization with child_id=this AND kind=k AND status=ACTIVE
      #                 AND effective_at <= now AND now < expires_at
      #     EXPIRED    if no ACTIVE row exists but at least one Authorization with kind=k has ever existed for this child
      #     NONE       if no Authorization with kind=k has ever existed
      # Child.medical_authorization_status := MEDICAL_status
      # Child.pickup_authorization_status  := PICKUP_status
    input_set: "Authorization rows joined to Child"
    constants: {}
    precision: "Enum projection"
    variants: []

# ─────────────────────────────────────────────────────────────
# §1.4 Validation Rules Table (Ordered by Priority)
# ─────────────────────────────────────────────────────────────
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in {ProgramAdmin, Guardian}"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role permitted for this endpoint (per RBAC)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path parameter resources resolve (left-to-right): family, child, session, enrollment, authorization, scholarship, session_day, contact"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path params"

  - priority: 5
    category: business_referential
    check: "Guardian acting on behalf of a Child must belong to the same Family.id as the child"
    error_id: ERR_FAMILY_MISMATCH
    http_status: 403
    applies_to: "guardian-driven endpoints for Child, Authorization, EmergencyContact, Enrollment"

  - priority: 6
    category: business_safety
    check: "Confirming an enrollment requires Child.medical_authorization_status = ACTIVE"
    error_id: ERR_MEDICAL_AUTH_REQUIRED
    http_status: 422
    applies_to: "POST /camp/enrollments/{id}/confirm"

  - priority: 7
    category: business_safety
    check: "Confirming an enrollment requires Child.pickup_authorization_status = ACTIVE"
    error_id: ERR_PICKUP_AUTH_REQUIRED
    http_status: 422
    applies_to: "POST /camp/enrollments/{id}/confirm"

  - priority: 8
    category: business_safety
    check: "Confirming an enrollment requires Child.emergency_contact_count ≥ 1"
    error_id: ERR_EMERGENCY_CONTACT_REQUIRED
    http_status: 422
    applies_to: "POST /camp/enrollments/{id}/confirm"

  - priority: 9
    category: state
    check: "Target state transition is legal per the entity's state machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 10
    category: business_constraint
    check: "Child's age in whole years on Session.reference_date is within [age_min, age_max]"
    error_id: ERR_AGE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /camp/enrollments and POST /camp/enrollments/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "Enrollment.week_index is in [0, Session.week_count); Session must be OPEN at confirmation time; SessionDay weather changes only allowed for day_date ≥ today on clock"
    error_id: ERR_INVALID_WEEK_INDEX
    http_status: 422
    applies_to: "POST /camp/enrollments, POST /camp/session-days/{id}/set-weather"

  - priority: 12
    category: business_constraint
    check: "Authorization.expires_at must be strictly greater than Authorization.effective_at"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /camp/authorizations"

  - priority: 13
    category: business_constraint
    check: "EmergencyContact.priority unique per child_id; ≤9 non-archived contacts per child"
    error_id: ERR_EMERGENCY_CONTACT_PRIORITY_TAKEN
    http_status: 409
    applies_to: "POST /camp/children/{id}/emergency-contacts"

  - priority: 14
    category: business_fiscal
    check: "Weekly capacity strict-less-than: confirmed_in_week < Session.weekly_capacity (otherwise WAITLIST or reject); duplicate (child_id, session_id, week_index) is forbidden"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /camp/enrollments"

  - priority: 15
    category: business_fiscal
    check: "ScholarshipAward must be ACTIVE and granted_for_kind compatible with Session.kind when explicitly requested"
    error_id: ERR_SCHOLARSHIP_INELIGIBLE
    http_status: 422
    applies_to: "POST /camp/enrollments/{id}/confirm"

  - priority: 16
    category: business_fiscal
    check: "Rainy-day pool sufficiency for the day's reroute is informational only; pool exhaustion does NOT reject the weather transition, but rerouted attendees beyond the pool are recorded as outdoor_headcount (operator-visible)"
    error_id: ERR_RAINY_POOL_EXHAUSTED
    http_status: 422
    applies_to: "Diagnostic endpoint GET /camp/session-days/{id}/reroute-preview only — the actual set-weather call never returns this error"

  - priority: 17
    category: business_constraint
    check: "Request body shape: required fields present, types correct, integer ranges within declared constraints"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 18
    category: business_constraint
    check: "Optimistic concurrency: if version supplied and differs from current, reject"
    error_id: ERR_STALE_VERSION
    http_status: 409
    applies_to: "all PATCH endpoints on common_fields=true entities"

  - priority: 19
    category: business_referential
    check: "Family soft-delete is blocked while any CONFIRMED Enrollment exists on a Session whose week_start + 7*week_index*days > now"
    error_id: ERR_FAMILY_HAS_FUTURE_ENROLLMENTS
    http_status: 409
    applies_to: "DELETE /camp/families/{id}"

# ─────────────────────────────────────────────────────────────
# §1.5 API Endpoint Table
# ─────────────────────────────────────────────────────────────
endpoints:
  # Families
  - method: POST
    path: "/camp/families"
    description: "Create a family household"
    roles: [ProgramAdmin]
    code: 201
    input: ["household_name", "primary_email", "residency_status?"]
    output: Family
    side_effects: []

  - method: GET
    path: "/camp/families/{id}"
    description: "Read a family with derived fields"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: []
    output: Family
    side_effects: []

  - method: PATCH
    path: "/camp/families/{id}"
    description: "Update mutable family fields (residency_status, household_name); OCC via version"
    roles: [ProgramAdmin]
    code: 200
    input: ["version", "household_name?", "primary_email?", "residency_status?"]
    output: Family
    side_effects: []

  - method: DELETE
    path: "/camp/families/{id}"
    description: "Soft-delete a family (archived=true); rejects if any CONFIRMED future enrollments exist"
    roles: [ProgramAdmin]
    code: 204
    input: []
    output: null
    side_effects:
      - "archived := true"

  - method: GET
    path: "/camp/families/{id}/invoice"
    description: "Family invoice for a week — sum of snapshotted final_fee_cents across CONFIRMED enrollments in that week"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: [week_start]
    output: "object: { family_id, week_start, invoice_total_cents, line_items: Enrollment[] }"
    side_effects: []

  # Guardians (nested under family)
  - method: POST
    path: "/camp/families/{family_id}/guardians"
    description: "Add a guardian to a family"
    roles: [ProgramAdmin, Guardian]
    code: 201
    input: ["full_name", "phone", "relationship", "is_primary?"]
    output: Guardian
    side_effects:
      - "If is_primary=true, demote any existing primary guardian on this family to is_primary=false"

  - method: GET
    path: "/camp/families/{family_id}/guardians"
    description: "List guardians for a family (paginated)"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: ["limit?", "offset?"]
    output: Guardian[]
    side_effects: []

  # Children (nested under family)
  - method: POST
    path: "/camp/families/{family_id}/children"
    description: "Register a child"
    roles: [ProgramAdmin, Guardian]
    code: 201
    input: [full_name, date_of_birth]
    output: Child
    side_effects: []

  - method: GET
    path: "/camp/children/{id}"
    description: "Read a child (derived auth statuses + emergency contact count)"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: []
    output: Child
    side_effects: []

  # Emergency contacts (nested under child)
  - method: POST
    path: "/camp/children/{child_id}/emergency-contacts"
    description: "Add an emergency contact"
    roles: [ProgramAdmin, Guardian]
    code: 201
    input: [full_name, phone, relationship, priority]
    output: EmergencyContact
    side_effects:
      - "Child.emergency_contact_count += 1"

  - method: DELETE
    path: "/camp/emergency-contacts/{id}"
    description: "Archive an emergency contact"
    roles: [ProgramAdmin, Guardian]
    code: 204
    input: []
    output: null
    side_effects:
      - "archived := true; Child.emergency_contact_count -= 1"

  # Authorizations
  - method: POST
    path: "/camp/children/{child_id}/authorizations"
    description: "Create a parental authorization (MEDICAL or PICKUP)"
    roles: [ProgramAdmin, Guardian]
    code: 201
    input: [guardian_id, kind, scope_text, effective_at, expires_at]
    output: Authorization
    side_effects:
      - "Recompute Child.medical_authorization_status / pickup_authorization_status via projection calc"

  - method: POST
    path: "/camp/authorizations/{id}/revoke"
    description: "Revoke an active authorization"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: []
    output: Authorization
    side_effects:
      - "status := REVOKED; revoked_at := now"
      - "Cascade per Authorization state machine"

  # Sessions
  - method: POST
    path: "/camp/sessions"
    description: "Create a session in DRAFT"
    roles: [ProgramAdmin]
    code: 201
    input: [title, kind, age_min, age_max, reference_date, weekly_capacity, week_start, week_count, base_weekly_fee_cents, rainy_day_pool_per_week]
    output: Session
    side_effects: []

  - method: POST
    path: "/camp/sessions/{id}/open"
    description: "Transition Session DRAFT→OPEN, generating SessionDay rows"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Session
    side_effects:
      - "Generate SessionDay rows"

  - method: POST
    path: "/camp/sessions/{id}/close"
    description: "Transition Session OPEN→CLOSED at end-of-program; cascades CONFIRMED→COMPLETED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Session
    side_effects:
      - "Cascade per Session state machine"

  - method: POST
    path: "/camp/sessions/{id}/cancel"
    description: "Cancel a session (DRAFT or OPEN)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Session
    side_effects:
      - "Cascade per Session state machine"

  - method: GET
    path: "/camp/sessions"
    description: "List sessions, filterable by kind/status"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: ["limit?", "offset?", "kind?", "status?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: "/camp/sessions/{id}"
    description: "Read a session"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: []
    output: Session
    side_effects: []

  # Enrollments
  - method: POST
    path: "/camp/enrollments"
    description: "Create a PENDING_AUTH enrollment for (child_id, session_id, week_index)"
    roles: [ProgramAdmin, Guardian]
    code: 201
    input: [child_id, session_id, week_index]
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/camp/enrollments/{id}/confirm"
    description: "Confirm a PENDING_AUTH enrollment; runs sibling + scholarship calc; may WAITLIST"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "Per Enrollment state machine"

  - method: POST
    path: "/camp/enrollments/{id}/cancel"
    description: "Cancel an enrollment (any non-terminal state); cascades sibling recompute + waitlist promotion"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "Per Enrollment state machine"

  - method: GET
    path: "/camp/enrollments/{id}"
    description: "Read an enrollment"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/camp/enrollments/{id}/fee-quote"
    description: "Provisional what-if fee quote (does not snapshot anything)"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: []
    output: "object: { list_fee_cents, sibling_discount_cents, scholarship_discount_cents, final_fee_cents, scholarship_award_id }"
    side_effects: []

  - method: GET
    path: "/camp/sessions/{id}/roster"
    description: "List enrollments for a session, filterable by week_index and status"
    roles: [ProgramAdmin]
    code: 200
    input: ["limit?", "offset?", "week_index?", "status?"]
    output: Enrollment[]
    side_effects: []

  # Scholarships
  - method: POST
    path: "/camp/families/{family_id}/scholarships"
    description: "Grant a scholarship to a family"
    roles: [ProgramAdmin]
    code: 201
    input: [total_credit_cents, granted_for_kind]
    output: ScholarshipAward
    side_effects: []

  - method: POST
    path: "/camp/scholarships/{id}/revoke"
    description: "Revoke a scholarship award"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ScholarshipAward
    side_effects:
      - "Per ScholarshipAward state machine"

  # SessionDay / weather
  - method: GET
    path: "/camp/session-days/{id}"
    description: "Read a session day with weather and headcounts"
    roles: [ProgramAdmin, Guardian]
    code: 200
    input: []
    output: SessionDay
    side_effects: []

  - method: POST
    path: "/camp/session-days/{id}/set-weather"
    description: "Set weather posture; triggers rainy-day reroute calc"
    roles: [ProgramAdmin]
    code: 200
    input: [weather_status]
    output: SessionDay
    side_effects:
      - "Per SessionDay state machine"

  - method: GET
    path: "/camp/session-days/{id}/reroute-preview"
    description: "Diagnostic: returns what would happen if this day were marked RAINY (may return ERR_RAINY_POOL_EXHAUSTED if pool insufficient)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: "object: { confirmed_attendees_for_day, pool_already_used_in_week, pool_remaining, would_reroute, outdoor_overflow }"
    side_effects: []

  # System / clock
  - method: POST
    path: "/_clock/advance"
    description: "Advance the test clock; runs Authorization ACTIVE→EXPIRED sweep and recomputes Child auth projections"
    roles: [ProgramAdmin]
    code: 200
    input: [iso_timestamp]
    output: "object: { now: ISO8601 }"
    side_effects:
      - "Sweep Authorization rows whose expires_at <= now → status=EXPIRED"
      - "Re-project medical/pickup status onto each affected Child"

# ─────────────────────────────────────────────────────────────
# §1.6 Error Code Catalog
# ─────────────────────────────────────────────────────────────
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing/blank X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated but role not permitted for this endpoint"
  - id: ERR_FAMILY_MISMATCH
    http: 403
    condition: "Guardian/Child/Authorization/Enrollment/EmergencyContact does not belong to the acting Guardian's family"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path resource does not exist"
  - id: ERR_VALIDATION
    http: 400
    condition: "Request body fails shape/type/range validation"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "Authorization.expires_at <= effective_at"
  - id: ERR_INVALID_WEEK_INDEX
    http: 422
    condition: "Enrollment.week_index out of [0, week_count); session-day weather change on past date"
  - id: ERR_AGE_OUT_OF_RANGE
    http: 422
    condition: "Child's age on Session.reference_date outside [age_min, age_max]"
  - id: ERR_MEDICAL_AUTH_REQUIRED
    http: 422
    condition: "Confirmation requires active MEDICAL authorization"
  - id: ERR_PICKUP_AUTH_REQUIRED
    http: 422
    condition: "Confirmation requires active PICKUP authorization"
  - id: ERR_EMERGENCY_CONTACT_REQUIRED
    http: 422
    condition: "Confirmation requires ≥1 non-archived emergency contact"
  - id: ERR_AUTHORIZATION_NOT_ACTIVE
    http: 409
    condition: "Attempted operation requires an ACTIVE Authorization but it is EXPIRED or REVOKED"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State machine forbids this transition (e.g., confirming a CANCELLED enrollment)"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "(child_id, session_id, week_index) already has a non-terminal Enrollment"
  - id: ERR_WEEKLY_CAPACITY_FULL
    http: 409
    condition: "Hard reject of capacity overrun (concurrency loser; normal-path PENDING_AUTH→WAITLISTED, not error)"
  - id: ERR_SCHOLARSHIP_INELIGIBLE
    http: 422
    condition: "ScholarshipAward not ACTIVE or granted_for_kind incompatible with Session.kind when explicitly named"
  - id: ERR_SCHOLARSHIP_EXHAUSTED
    http: 409
    condition: "Concurrent confirmations would overflow ScholarshipAward.total_credit_cents"
  - id: ERR_EMERGENCY_CONTACT_PRIORITY_TAKEN
    http: 409
    condition: "(child_id, priority) already taken among non-archived emergency contacts"
  - id: ERR_RAINY_POOL_EXHAUSTED
    http: 422
    condition: "Reroute preview indicates pool cannot cover confirmed attendees for the day"
  - id: ERR_STALE_VERSION
    http: 409
    condition: "OCC: supplied version != current"
  - id: ERR_FAMILY_HAS_FUTURE_ENROLLMENTS
    http: 409
    condition: "Family soft-delete blocked while CONFIRMED future enrollments exist"

# ─────────────────────────────────────────────────────────────
# §1.7 RBAC Matrix
# ─────────────────────────────────────────────────────────────
roles:
  - name: ProgramAdmin
    description: "Camp staff/administrator. Manages sessions, scholarships, weather posture, and may operate on any family's records."
    identity: opaque
    exclusive_operations:
      - "POST /camp/sessions (create session)"
      - "POST /camp/sessions/{id}/open"
      - "POST /camp/sessions/{id}/close"
