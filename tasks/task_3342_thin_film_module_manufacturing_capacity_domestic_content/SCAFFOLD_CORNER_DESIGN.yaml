# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_3342_thin_film_module_manufacturing_capacity_domestic_content
# Single top-level key: scaffold_corner_design
# Sections/claim_types per references/claim-extraction-guide.md.
# Logical clock default: 2026-09-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_create_success_system_fields
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /v1/customers with all required fields returns 201, echoes inputs, and system fields id/version/created_at are populated with version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: true }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Customer.${cust_id}.credit_tier == TIER_A"
            - "Customer.${cust_id}.tax_credit_flag == true"
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.created_at present (ISO8601)"

      - name: customer_missing_credit_tier_rejected
        claim_type: required_fields
        grounds: [entities.Customer.fields.credit_tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "credit_tier is source input with no default; omitting it from POST /v1/customers fails with ERR_INVALID_REQUEST (400) and no row is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/customers"
              payload: { legal_name: "No Tier Co", tax_credit_flag: false }
              as: ContractsOfficer
          assert:
            - "response.http_status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: customer_get_not_found
        claim_type: not_found
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/customers/{id} with a well-formed UUID that does not exist returns 404 ERR_NOT_FOUND, not an empty body or 500."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ContractsOfficer
          assert:
            - "response.http_status == 404"
            - "response.error_id == ERR_NOT_FOUND"

      - name: customer_list_pagination_envelope
        claim_type: listing
        grounds: [entities.Customer, response_envelope]
        distinguishing_aspect: "GET /v1/customers?limit=2&offset=0 with 3 customers returns response_type array, exactly 2 rows, total_count == 3, has_more == true (envelope pagination fields per §1.0)."
        test_recipe:
          setup: ["three customers exist"]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Alpha Co", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
            - call: "POST /v1/customers"
              payload: { legal_name: "Beta Co", credit_tier: "TIER_B", tax_credit_flag: false }
              as: ContractsOfficer
            - call: "POST /v1/customers"
              payload: { legal_name: "Gamma Co", credit_tier: "TIER_C", tax_credit_flag: true }
              as: ContractsOfficer
          trigger:
            - call: "GET /v1/customers?limit=2&offset=0"
              payload: {}
              as: ContractsOfficer
          assert:
            - "response.response_type == array"
            - "len(response.data) == 2"
            - "response.data.total_count == 3 (or envelope pagination block reports total_count == 3)"
            - "envelope has_more == true"

      - name: module_series_default_status_active
        claim_type: defaults
        grounds: [entities.ModuleSeries.fields.status]
        distinguishing_aspect: "ModuleSeries.status is source system with default ACTIVE; a create that omits it yields status == ACTIVE (DISCONTINUED is never set at create)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "ModuleSeries.${series_id}.status == ACTIVE"

      - name: module_series_bin_fractions_must_sum_one
        claim_type: type_constraints
        grounds: [entities.ModuleSeries.fields.bin_profile, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "bin_profile fractions 0.7 + 0.4 == 1.1 violate the sum-to-1.0-exactly constraint; create is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/module-series"
              payload: { series_code: "BAD", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.7 }, { bin_code: "B2", wattage: 470.0, fraction: 0.4 }], temp_coefficient: -0.0028 }
              as: PlantManager
          assert:
            - "response.http_status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: attestation_total_below_domestic_sum_rejected
        claim_type: type_constraints
        grounds: [entities.ComplianceAttestation.fields.total_manufactured_cost_usd, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "total_manufactured_cost_usd (200.0) below the sum of the five domestic cost fields (210.0) violates the entity field constraint; create is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["ProductionLine OH-L3 exists"]
          setup_api_calls:
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /v1/compliance-attestations"
              payload: { line_id: "${line_id}", period_year: 2026, labor_cost_usd: 100.0, feedstock_cost_usd: 50.0, glass_cost_usd: 30.0, balance_of_system_cost_usd: 20.0, overhead_cost_usd: 10.0, total_manufactured_cost_usd: 200.0 }
              as: ComplianceOfficer
          assert:
            - "response.http_status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: defect_claim_measured_energy_forbidden
        claim_type: type_constraints
        grounds: [entities.WarrantyClaim.fields.measured_energy_kwh, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "measured_energy_kwh is forbidden for PRODUCT_DEFECT claims (allowed only for PERFORMANCE_SHORTFALL); supplying it fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Customer C with PENDING reservation R (no state precondition applies at claim create)"]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 125000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /v1/warranty-claims"
              payload: { reservation_id: "${res_id}", claim_type: "PRODUCT_DEFECT", claimed_mw: 1.0, measured_energy_kwh: 100.0 }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
          assert:
            - "response.http_status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: performance_claim_measured_energy_required
        claim_type: required_fields
        grounds: [entities.WarrantyClaim.fields.measured_energy_kwh, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "measured_energy_kwh is required for PERFORMANCE_SHORTFALL claims; omitting it fails with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Customer C with PENDING reservation R"]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 125000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /v1/warranty-claims"
              payload: { reservation_id: "${res_id}", claim_type: "PERFORMANCE_SHORTFALL", claimed_mw: 1.0 }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
          assert:
            - "response.http_status == 400"
            - "response.error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: line_initial_state_commissioning
        claim_type: initial_state
        grounds: [state_machines.ProductionLine]
        distinguishing_aspect: "A newly created ProductionLine starts in COMMISSIONING with ramp_quarter_index == 0, before any transition fires."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
          assert:
            - "ProductionLine.${line_id}.status == COMMISSIONING"
            - "ProductionLine.${line_id}.ramp_quarter_index == 0"

      - name: commission_without_first_article_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ProductionLine.COMMISSIONING_to_RAMPING, "errors[ERR_LINE_NOT_COMMISSIONABLE]"]
        distinguishing_aspect: "Commission requires at least one ProductionRun (first article); with zero runs the transition is rejected ERR_LINE_NOT_COMMISSIONABLE (422) and the line stays COMMISSIONING."
        test_recipe:
          setup: ["ProductionLine OH-L3 exists with no ProductionRun rows"]
          setup_api_calls:
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
          assert:
            - "response.http_status == 422"
            - "response.error_id == ERR_LINE_NOT_COMMISSIONABLE"
            - "ProductionLine.${line_id}.status == COMMISSIONING"

      - name: decommission_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProductionLine, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECOMMISSIONED is terminal: after decommissioning an empty line, a further suspend attempt fails with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ProductionLine OH-L3 exists (COMMISSIONING, no reservations)"]
          setup_api_calls:
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-lines/${line_id}/decommission"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /v1/production-lines/${line_id}/suspend"
              payload: {}
              as: PlantManager
          assert:
            - "response.http_status == 409"
            - "response.error_id == ERR_INVALID_STATE"
            - "ProductionLine.${line_id}.status == DECOMMISSIONED"

      - name: decommission_with_open_reservation_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ProductionLine, "errors[ERR_LINE_HAS_OPEN_RESERVATIONS]"]
        distinguishing_aspect: "Decommission is blocked while any reservation on the line is PENDING/DEPOSIT_HELD/ACTIVE/CONSTRAINED; a PENDING reservation triggers ERR_LINE_HAS_OPEN_RESERVATIONS (422)."
        test_recipe:
          setup: ["Customer C with PENDING reservation R on line OH-L3"]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 125000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /v1/production-lines/${line_id}/decommission"
              payload: {}
              as: PlantManager
          assert:
            - "response.http_status == 422"
            - "response.error_id == ERR_LINE_HAS_OPEN_RESERVATIONS"
            - "ProductionLine.${line_id}.status == COMMISSIONING"

      - name: activate_from_pending_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CapacityReservation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DEPOSIT_HELD -> ACTIVE is the only activation edge; activating a PENDING reservation (deposit never posted) fails with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Customer C with PENDING reservation R on line OH-L3 (line already RAMPING, so only the reservation state blocks)"]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 125000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
              payload: {}
              as: ContractsOfficer
          assert:
            - "response.http_status == 409"
            - "response.error_id == ERR_INVALID_STATE"
            - "CapacityReservation.${res_id}.status == PENDING"

      - name: closeout_sweep_completes_reservation_full_forfeit
        claim_type: valid_transition
        grounds: [state_machines.CapacityReservation.ACTIVE_to_COMPLETED, calculations.deposit_forfeiture]
        distinguishing_aspect: "The close-out sweep on POST /v1/_ops/close_quarter completes an ACTIVE reservation whose term elapsed (clock year 2028 > 2027 + 1 - 1); with delivered_mw 0.0 the MIN cap forfeits the whole 200000.00 deposit and the line's committed bucket drops back to 0.0."
        test_recipe:
          setup:
            - "Customer C (TIER_A) with ACTIVE reservation R (delivery_year 2027, term_years 1, deposit 200000.0, no deliveries)"
            - "Logical clock advanced to 2028-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 200000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
              payload: {}
              as: ContractsOfficer
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2028-06-01T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /v1/_ops/close_quarter"
              payload: {}
              as: PlantManager
              captures: { completed_count: $.data.reservations_completed }
          assert:
            - "close_quarter response reservations_completed == 1 (${completed_count})"
            - "CapacityReservation.${res_id}.status == COMPLETED"
            - "CapacityReservation.${res_id}.deposit_forfeited_usd == 200000.00"
            - "ProductionLine.${line_id}.committed_capacity_mw == 0.0"

      - name: lot_quarantine_verify_remediation_cycle
        claim_type: valid_transition
        grounds: [state_machines.ComponentLot.PENDING_INSPECTION_to_QUARANTINED, state_machines.ComponentLot.QUARANTINED_to_VERIFIED]
        distinguishing_aspect: "ComponentLot supports the remediation loop: PENDING_INSPECTION -> QUARANTINED -> VERIFIED both succeed (branching with revert), ending VERIFIED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /v1/component-lots"
              payload: { supplier_name: "GlassCo", lot_code: "LOT-1", component_type: "GLASS", country_of_origin: "US", lot_cost_usd: 400.0 }
              as: SupplyChainAuditor
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /v1/component-lots/${lot_id}/quarantine"
              payload: {}
              as: SupplyChainAuditor
            - call: "POST /v1/component-lots/${lot_id}/verify"
              payload: {}
              as: SupplyChainAuditor
          assert:
            - "ComponentLot.${lot_id}.status == VERIFIED (after QUARANTINED -> VERIFIED remediation)"

      - name: attestation_reject_fork_marks_deliveries_non_qualifying
        claim_type: side_effect_execution
        grounds: [state_machines.ComplianceAttestation.SUBMITTED_to_REJECTED, entities.Delivery.fields.content_status]
        distinguishing_aspect: "The REJECT branch of the attestation fork has a divergent side-effect set: line.qualification_tier := UNQUALIFIED and every SCHEDULED/RESCHEDULED delivery on the line becomes NON_QUALIFYING (regardless of tax_credit_flag)."
        test_recipe:
          setup:
            - "Customer C (tax_credit_flag false) with ACTIVE reservation R on line OH-L3; delivery D SCHEDULED with VERIFIED lot"
            - "Attestation (domestic 210 / total 500) SUBMITTED"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
