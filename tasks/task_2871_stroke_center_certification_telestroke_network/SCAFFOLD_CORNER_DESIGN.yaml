- section: consistency_model
  instances:
  - name: the_routing_result_is_already_in_the_create_response_not_in_a_later_read
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model immediate
    - endpoints.POST /stroke-network/consults side_effects
    - response_envelope success
    distinguishing_aspect: 'An immediate consistency model forbids the natural implementation of a router: create the consult REQUESTED, return 201, then assign. Every consequence of the write — the assignment, the neurologist''s load, the agreement''s live count and the case''s status and version — must already be observable, and the create response itself must carry the assigned neurologist rather than a null that fills in later. The four reads that follow are taken at the SAME clock instant as the write, so nothing can be attributed to time passing.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke, ACTIVE agreement, one board-certified ON_CALL Neurologist with active_consult_count 0.
      - One CodeStrokeCase CN at the spoke with imaging complete at 08:10 and no consult yet.
      - The clock is NOT advanced between the write and any of the reads below.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          hub_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          spoke_id: $.data.id
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${hub_id}
          spoke_center_id: ${spoke_id}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          agr_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/activate
        payload: {}
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists
        payload:
          full_name: Dr Nora Ainsley
          home_center_id: ${hub_id}
          licensed_state_codes:
          - CA
          board_certified: true
          roster_rank: 10
          concurrent_consult_limit: 2
        as: ProgramCoordinator
        captures:
          n1_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/proxy-credentials
        payload:
          neurologist_id: ${n1_id}
          privilege_scope: CONSULT_AND_THROMBOLYSIS
          expires_at: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists/${n1_id}/on-call-state
        payload:
          on_call_state: ON_CALL
        as: ProgramCoordinator
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${spoke_id}
          patient_ref: P-CN-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          cn_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:10:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes/${cn_id}/imaging-complete
        payload:
          imaging_modality: CT_NON_CONTRAST
        as: EdPhysician
        as_user_id: ed_ann
      - call: GET /stroke-network/code-strokes/${cn_id}
        as: EdPhysician
        captures:
          cn_v0: $.data.version
          cn_st0: $.data.status
      - call: GET /stroke-network/neurologists/${n1_id}
        as: ProgramCoordinator
        captures:
          cn_n0: $.data.active_consult_count
      - call: GET /stroke-network/spoke-agreements/${agr_id}
        payload: {}
        as: ProgramCoordinator
        as_user_id: pc_carl
        captures:
          cn_a0: $.data.active_consult_count
      trigger:
      - call: POST /stroke-network/consults
        payload:
          case_id: ${cn_id}
          agreement_id: ${agr_id}
          requested_privilege_scope: CONSULT_AND_THROMBOLYSIS
          expected_case_version: ${cn_v0}
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          cn_k: $.data.id
          cn_st: $.data.status
          cn_n: $.data.assigned_neurologist_id
          cn_at: $.data.assigned_at
          cn_req: $.data.requested_at
          cn_att: $.data.routing_attempt_count
      - call: GET /stroke-network/consults/${cn_k}
        as: EdPhysician
