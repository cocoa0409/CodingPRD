              as_user_id: "op-1"
              captures: { sp: $.data.id }
            - call: "POST /modules/${sp}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${sp}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /service-contracts"
              payload: { project_id: "${pj}", tier: "GOLD", spare_pct_bp: 300, term_months: 60 }
              as: ServiceManager
