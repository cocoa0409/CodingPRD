      - name: occ_stale_claim_version_outranks_claim_state_invalid
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.correcting-claim-stale-claim
          - errors.ERR_CLAIM_VERSION_STALE
          - validations[priority=55,ERR_CLAIM_VERSION_STALE]
          - validations[priority=60,ERR_CLAIM_STATE_INVALID]
        distinguishing_aspect: |
          The stale-version rung sits at priority 55, ahead of the claim state rung at 60, so a correction
          aimed at a DRAFT claim (an illegal correction target) with a stale expected_claim_version returns
          412 ERR_CLAIM_VERSION_STALE and NOT 409 ERR_CLAIM_STATE_INVALID; the very same call with the
          observed version then returns 409. Implementations that check the target's status before the version
          token, or that only enforce the token on legal targets, invert both answers.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one CERTIFIED NURSING unit."
            - "One DRAFT PerDiemClaim for claim_month 2026-07 on that unit; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Wexley State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/per-diem-claims"
              payload: { veterans_home_id: "${home_id}", care_unit_id: "${nu_id}", claim_month: "2026-07" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { claim_id: "$.data.id", claim_status: "$.data.status" }
          trigger:
            - call: "GET /svh/per-diem-claims/${claim_id}"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { c_v: "$.data.version" }
            - call: "POST /svh/per-diem-claims/${claim_id}/correct"
              payload: { expected_claim_version: "${c_v} - 1", correction_note: "stale token" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { stale_err: "$.data.error_id" }
            - call: "POST /svh/per-diem-claims/${claim_id}/correct"
              payload: { expected_claim_version: "${c_v}", correction_note: "fresh token" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { state_err: "$.data.error_id" }
            - call: "GET /svh/per-diem-claims/${claim_id}"
              payload: {}
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { c_v_after: "$.data.version", c_status_after: "$.data.status" }
            - call: "GET /svh/per-diem-claims"
              payload: { corrects_claim_id: "${claim_id}", limit: 10 }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { corr_total: "$.meta.total_count" }
          assert:
            - "claim_status == DRAFT"
            - "the stale-token correction returns HTTP 412"
            - "stale_err == ERR_CLAIM_VERSION_STALE"
            - "the fresh-token correction returns HTTP 409"
            - "state_err == ERR_CLAIM_STATE_INVALID"
            - "c_v_after == ${c_v}"
            - "c_status_after == DRAFT"
            - "corr_total == 0"

      - name: occ_home_version_increments_exactly_once_per_write_and_never_on_read
        claim_type: optimistic_concurrency
        grounds:
          - entities.VeteransHome
          - endpoints[POST /svh/veterans-homes/{id}/care-units].side_effects
          - endpoints[POST /svh/veterans-homes/{id}/recognition].side_effects
        distinguishing_aspect: |
          The version counter every stale-token check is compared against is itself pinned: a freshly created
          home is version 1, each child care-unit creation bumps the PARENT home exactly once (2 then 3),
          each recognition action bumps it exactly once more (4 then 5), and repeated GETs never move it.
          Each care unit is born at version 1 regardless of the parent's counter. Implementations that bump
          the parent per computed field, that renumber on read, or that share one global counter across
          entities fail on the exact literals.
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
          trigger:
