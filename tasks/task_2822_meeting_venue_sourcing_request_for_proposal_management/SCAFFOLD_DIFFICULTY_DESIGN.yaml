        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR.
        - PREFERRED TIER_1 Venue, MeetingEvent EVT-2822-A with budget ceiling 500000.00, requirements locked, venue shortlisted, round-1 Rfp issued then closed.
        - The Proposal submitted with the same grid as the canonical bid except fnb_minimum_usd 115000.00, so total_cost_contracted_usd is 404841.64, and evaluated once on CONTRACTED_BASIS.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
