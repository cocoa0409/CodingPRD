            - call: "POST /compliance/contract-amendments"
              payload: { contract_id: "${c_pbm}", amendment_type: "DATA_RIGHTS", proposed_terms_summary: "PBM grants rebate-level data rights and RxDC cooperation.", data_rights_granted: true, expires_at: "2028-06-30T00:00:00Z", expected_contract_version: "${c_pbm_v}" }
              as: PlanSponsorAdmin
