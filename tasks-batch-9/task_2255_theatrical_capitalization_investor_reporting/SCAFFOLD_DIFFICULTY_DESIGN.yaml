      and overlapping an existing certified week violates adjacent priorities 12 and 13.
      The temporal rule must win, returning ERR_WRAP_WEEK_IN_FUTURE (422) rather than
      ERR_WRAP_WEEK_OVERLAP (409). Rewinding the clock to 2026-09-04 while a certified
