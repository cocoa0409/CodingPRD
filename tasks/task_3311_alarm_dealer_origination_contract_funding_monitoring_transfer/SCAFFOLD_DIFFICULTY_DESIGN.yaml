            - call: "POST /alarm-funding/alarm-events/${ae_a_id}/legal-hold-release"
              payload: {}
              as: ComplianceOfficer
              captures: { sig_after: $.data.counted_for_false_alarm }
          assert:
            - "before: verified_signal_count == 2 and known_alarm_count == 2, so ratio_percent == 100.00"
            - "during the hold: AlarmEvent.${ae_a_id}.counted_for_false_alarm == false and the ratio read returns verified_signal_count == 1"
            - "after release: AlarmEvent.${ae_a_id}.counted_for_false_alarm == true and the ratio read returns verified_signal_count == 2"
            - "the conserved count verified_signal_count returns to its pre-hold value with zero drift"
