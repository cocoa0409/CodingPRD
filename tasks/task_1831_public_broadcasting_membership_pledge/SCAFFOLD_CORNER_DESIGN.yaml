            - "${err_code} == ERR_CROSS_REFERENCE"

      - name: writeoff_before_60_day_window_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_WRITEOFF_WINDOW]"]
        distinguishing_aspect: "Write-off at day 59 is rejected with ERR_WRITEOFF_WINDOW; the temporal guard pins the 60-day follow-up rule."
        test_recipe:
          setup: ["Level BASIC; donor D; membership M; drive ON_AIR; pledge 6000 captured at 2026-08-02; clock at 2026-10-01 (day 60 minus... 2026-10-01 is 60 days after 2026-08-02? use 2026-09-30 = day 59)"]
          setup_api_calls:
            - call: "POST /station/membership-levels"
              payload: { code: "BASIC", min_annual_cents: 6000, min_monthly_sustainer_cents: 500 }
              as: StationAdmin
            - call: "POST /station/donors"
              payload: { email: "v2@x.com", full_name: "Donor V2", postal_code: "97033" }
