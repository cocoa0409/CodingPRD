              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "im@x.com", full_name: "IM", birth_date: "1990-01-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { acc_v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 70000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${acc_v1}" }
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { abal: $.data.available_balance_cents }
          assert:
            - "Account.${acc_id}.available_balance_cents == 70000 on the immediately following GET"
