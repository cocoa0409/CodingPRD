# ============================================================================
# §1.7 RBAC Table
# role_model: segregation_of_duties — the nurse who gives the advice can
# neither override it nor verify its outcome, and the auditor who records the
# outcome gives no advice at all.
# ============================================================================

roles:
  - role: PlatformAdmin
    identity: opaque
    description: "Advice-line operations. Owns reference data: practices, patients, coverage windows, nurses, licences, shifts and protocols."
    exclusive_operations:
      - "POST /practices"
      - "PATCH /practices/{id}/status"
      - "POST /nurses"
      - "POST /nurses/{id}/licenses"
      - "POST /nurses/{id}/shifts"
      - "POST /symptom-protocols"
      - "POST /symptom-protocols/{id}/retire"
    shared_operations:
      - "POST /practices/{id}/patients (with IntakeAgent)"
      - "POST /coverage-windows and POST /coverage-windows/{id}/activate (with PracticeLiaison)"
      - "every GET read"

  - role: IntakeAgent
    identity: opaque
    description: "Non-clinical call taker. Opens calls, identifies the caller, records consent and relays the emergency dispatch centre's answer, but never scores a protocol and never gives advice."
    exclusive_operations:
      - "POST /triage-calls"
      - "POST /triage-calls/{id}/match-patient"
      - "POST /triage-calls/{id}/consent"
      - "POST /warm-transfers/{id}/psap-response"
    shared_operations:
      - "POST /triage-calls/{id}/assign-nurse (with ChargeNurse)"
      - "POST /triage-calls/{id}/abandon (with ChargeNurse)"
      - "POST /practices/{id}/patients (with PlatformAdmin)"

  - role: TriageNurse
    identity: entity_backed
    entity: Nurse
    description: "Licensed nurse on rotation. X-User-ID is a Nurse.id, so licensure by state of the caller, concurrent-call capacity and the segregation-of-duties checks all resolve through this identity."
    exclusive_operations:
      - "POST /triage-calls/{id}/assessments"
      - "POST /dispositions"
      - "POST /triage-calls/{id}/complete"
      - "POST /triage-calls/{id}/warm-transfers"
      - "POST /warm-transfers/{id}/confirm-location"
      - "POST /warm-transfers/{id}/complete-handoff"
      - "POST /callback-tasks/{id}/attempts"
      - "POST /callback-tasks/{id}/verify"
    shared_operations:
      - "every GET read except the practice compliance and invoice reads"
    constraints:
      - "may only act on calls where assigned_nurse_id == X-User-ID (ERR_NOT_ASSIGNED_NURSE)"
      - "may not verify a callback for a disposition they determined (ERR_SEGREGATION_OF_DUTIES)"
      - "may escalate above the recommended disposition with documentation but may never soften it (ERR_DEESCALATION_REQUIRES_CHARGE_NURSE)"

  - role: ChargeNurse
    identity: entity_backed
    entity: Nurse
    description: "Shift supervisor, also a licensed nurse. Owns the two supervisory compensating operations — overriding a disposition and reopening a closed call — neither of which a triage nurse may perform."
    exclusive_operations:
      - "POST /dispositions/{id}/override"
      - "POST /triage-calls/{id}/reopen"
    shared_operations:
      - "POST /triage-calls/{id}/assign-nurse (with IntakeAgent)"
      - "POST /triage-calls/{id}/abandon (with IntakeAgent)"
      - "GET /staffing-adequacy (with PlatformAdmin and PracticeLiaison)"
      - "every entity GET read"
    constraints:
      - "must hold an ACTIVE licence in the caller's state to override a disposition (ERR_NURSE_NOT_LICENSED_IN_STATE)"
      - "may not override a disposition they determined themselves (ERR_SEGREGATION_OF_DUTIES)"
      - "may not perform any TriageNurse exclusive operation — a charge nurse cannot score a protocol, create a disposition or complete a call"

  - role: ComplianceAuditor
    identity: opaque
    description: "Quality reviewer. Records observed outcomes against the advice given and reads the concordance summary. Gives no advice and touches no call."
    exclusive_operations:
      - "POST /dispositions/{id}/audit-records"
    shared_operations:
      - "GET /dispositions/{id}/audit-records (with PlatformAdmin and PracticeLiaison)"
      - "GET /practices/{id}/compliance-summary (with PlatformAdmin and PracticeLiaison)"
      - "every entity GET read"

  - role: PracticeLiaison
    identity: entity_backed
    entity: Practice
    description: "Covered practice's own representative. X-User-ID is a Practice.id, so every practice-scoped read is narrowed to their own practice."
    exclusive_operations: []
    shared_operations:
      - "POST /coverage-windows and POST /coverage-windows/{id}/activate (with PlatformAdmin)"
      - "GET /practices/{id}/after-hours-invoice (with PlatformAdmin)"
      - "GET /practices/{id}/compliance-summary (with PlatformAdmin and ComplianceAuditor)"
      - "GET /callback-tasks filtered to their own practice — the next-day callback list"
      - "GET /staffing-adequacy (with PlatformAdmin and ChargeNurse)"
    constraints:
      - "any practice-scoped path whose {id} is not their own Practice.id is ERR_PRACTICE_SCOPE_VIOLATION"
