              payload: { decision: "REJECT", indication_count: 0, film_count: 4, defect_type: "POROSITY" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports/${r1}/result"
              payload: { decision: "ACCEPT", indication_count: 0, film_count: 4 }
              as: QcInspector
              as_user_id: "qc-1"
          assert:
            - "scheduling on the FIT_READY seam ${s2} returns HTTP 409 ERR_NDE_STATE_INVALID and creates no report, even though its window is perfectly valid"
            - "the zero-length window on the WELDED seam ${s1} returns HTTP 409 ERR_INVALID_WINDOW: window_end_utc must be strictly after window_start_utc, so equal instants are not a degenerate-but-legal interval"
            - "the valid schedule returns HTTP 201 with status == 'SCHEDULED', nonconformance_open == false, and moves WeldSeam.${s1}.status to 'EXAM_SCHEDULED' with last_nde_report_id == ${r1}"
            - "the second schedule on ${s1} returns HTTP 409 ERR_NDE_STATE_INVALID - one live report per seam - and not ERR_EXAM_WINDOW_CONFLICT, because priority 16 outranks priority 47 and the 20:00-21:00 window would not have clashed with 10:00-11:00 anyway"
            - "ACCEPT with indication_count 2 returns HTTP 409 ERR_INDICATION_COUNT_INCONSISTENT; REJECT with indication_count 0 returns the same id from the opposite direction, even though defect_type was supplied"
            - "after both evidence rejections the report is still SCHEDULED - a rejected result is not a partial write"
            - "the consistent ACCEPT returns HTTP 200 with status == 'REPORTED_ACCEPT', and WeldSeam.${s1}.status == 'RT_ACCEPTED'; ShellCourse.${course_id}.status stays 'FITTED' because seam V2 is still unwelded"

      - name: weld_log_ahead_of_its_predecessor_seam_is_rejected
        claim_type: sequence_constraint_rejection
        grounds:
          - validations.priority_36_ERR_WELD_SEQUENCE_VIOLATION
          - entities.WeldSeam.fields.predecessor_seam_id
        distinguishing_aspect: |
          Distortion control needs more than "predecessor welded" - the predecessor must be
          RT_ACCEPTED, so a predecessor that is WELDED or even EXAM_SCHEDULED still blocks the
          successor. The same weld log therefore fails twice and succeeds only after the
          radiograph on the predecessor is accepted.
        test_recipe:
          setup:
            - "Tank TK-101 with an accepted foundation, course 1 FITTED, seam A (sequence 1, no predecessor) and seam B (sequence 2, predecessor A). A has been welded but not yet examined."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
