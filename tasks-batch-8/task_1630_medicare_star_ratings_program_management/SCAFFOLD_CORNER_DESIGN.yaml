  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: sod_approver_must_differ_from_proposer
        claim_type: segregation_of_duties
        grounds: ["validations[priority=11]", "errors[ERR_SOD_VIOLATION]", "roles[IncentiveManager]"]
        distinguishing_aspect: "The same X-User-ID that proposed a payout cannot approve it (ERR_SOD_VIOLATION, 403); a different IncentiveManager user approves successfully."
        test_recipe:
          setup: ["GAP_CLOSURE group (unit 250, pool 10000) with 1 CLOSED gap on the linked measure; payout proposed by im-1"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "SPD", title: "Statin Adherence", domain: DRUG_SAFETY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: PHARMACY_PDE, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 0, denominator: 0 }
              as: QualityOps
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: PHARMACY_ADHERENCE }
              as: QualityOps
              captures: { g1: $.data.id }
            - call: "POST /api/care-gaps/${g1}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/provider-groups"
              payload: { name: "Group G", program_type: GAP_CLOSURE, linked_measure_id: "${m_id}", target_star: 5, unit_reward_per_gap: 250.0, max_pool_amount: 10000.0 }
              as: IncentiveManager
              captures: { grp_id: $.data.id }
            - call: "POST /api/incentive-payouts"
              payload: { provider_group_id: "${grp_id}" }
              as: IncentiveManager
              as_user_id: "im-1"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /api/incentive-payouts/${pay_id}/transition"
              payload: { to_state: APPROVED }
              as: IncentiveManager
              as_user_id: "im-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/incentive-payouts/${pay_id}/transition"
              payload: { to_state: APPROVED }
              as: IncentiveManager
              as_user_id: "im-2"
          assert:
            - "same-user approve rejected: err == ERR_SOD_VIOLATION (403)"
            - "different-user approve succeeds: IncentivePayout.${pay_id}.status == APPROVED"

      - name: qualityops_cannot_publish_cutpoints
        claim_type: rbac_denial
        grounds: ["roles[StarsAdmin]", "endpoints[POST /api/cutpoint-sets/{setId}/publish]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Publish is StarsAdmin-exclusive: QualityOps with a correct OCC version still gets ERR_UNAUTHORIZED_ROLE (403) — role check (priority 2) precedes OCC (priority 5)."
        test_recipe:
          setup: ["Cycle in CUTPOINT_REVIEW; DRAFT cut point set with one row"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
