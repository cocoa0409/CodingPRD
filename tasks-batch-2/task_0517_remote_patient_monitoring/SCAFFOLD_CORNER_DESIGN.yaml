            - "data.error_id == ERR_REMITTANCE_EXCEEDS_CLAIM"
            - "Claim.${claim_id}.reimbursed_cents == 0"

      - name: existence_left_to_right_path_validation
        claim_type: cascading_validation
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST device-activate on a non-existent patient resolves the patient path segment first and returns ERR_NOT_FOUND (404) before reaching device existence."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
