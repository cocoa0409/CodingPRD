              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /prequalifications/${pq_id}/grade"
              payload: {}
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "POST /site-access-grants"
              payload: { worker_id: "${w1_id}", site_id: "${site_id}", prequalification_id: "${pq_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { grant1_id: $.data.id }
          trigger:
            - call: "POST /incident-reports"
              payload: { contractor_id: "${con_id}", site_id: "${site_id}", occurred_at: "2026-08-01T00:00:00Z", severity: "RECORDABLE", osha_reportable: true, description: "Stitches, no lost workdays" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /site-access-grants"
              payload: { worker_id: "${w2_id}", site_id: "${site_id}", prequalification_id: "${pq_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { grant2_id: $.data.id }
          assert:
            - "incident: HTTP 201 with data.review_status == OPEN and data.triggered_suspension_count == 0"
            - "Contractor.${con_id}.open_severe_incident_count == 1 and incident_review_flag == false - RECORDABLE is below the review threshold"
            - "Site.${site_id}.access_gate_status == RESTRICTED (not LOCKED) and granted_worker_count still 1"
            - "Prequalification.${pq_id}.status == APPROVED with grade B untouched"
            - "InsuranceCertificate.${cert_gl_id}.available_aggregate == 1750000 (2000000 minus one open incident at 250000)"
            - "second grant: HTTP 201 - RESTRICTED lifts the effective min grade from C rank 1 to B rank 2 and the row's grade B is exactly at that rank"
            - "Site.${site_id}.granted_worker_count == 2 and SiteAccessGrant.${grant1_id}.status still GRANTED"

      - name: n_level_side_effect_chain_from_a_single_write
        claim_type: cascading_side_effects
        grounds:
          - state_machines.IncidentReport.null_to_OPEN
          - calculations.flow_down_status
        excluded_because:
          difficulty_instance: transitive_cascade / fatality_incident_cascades_flag_suspension_revocation_site_count_and_flow_down
          rationale: "One POST driving five levels of consequence end-to-end, with per-level literals, is asserted there."

      - name: both_variants_of_the_composite_score_under_one_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.composite_prequalification_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_and_final_composite_diverge_on_hazard_tier_tightening
          rationale: "Both variants are computed on identical stored data and the delta is asserted as literals there."

      - name: derived_counter_correct_after_create_and_after_reversal
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.site_granted_worker_count
          - calculations.contractor_open_deficiency_count
        excluded_because:
          difficulty_instance: compensating_invariant / contractor_open_deficiency_count_returns_to_its_pre_grading_value_after_an_accepted_improvement_plan
          rationale: "Post-create, post-reversal and zero-drift reconciliation of both derived counters are asserted there and in its sibling instance."

  - section: consistency model
    instances:
      - name: derived_fields_are_visible_in_the_same_response_that_writes_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.citation_points
          - calculations.document_review_status
        distinguishing_aspect: "No read-after-write lag is tolerated anywhere: the statistic-creation response itself already carries citation_points 12, trir 2.0000 and dart_rate 1.0000, and the program-review response is immediately consistent with the parent's recomputed document_review_status - a follow-up GET must return byte-identical derived values."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Client Northwind on defaults; Contractor Acme with a DRAFT 2026 prequalification and no statistics or programs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /clients"
              payload: { legal_name: "Northwind Facilities", industry_code: "2361" }
              as: NetworkAdmin
              captures: { client_id: $.data.id }
            - call: "POST /contractors"
              payload: { legal_name: "Acme Mechanical", scope_of_work: ["MECHANICAL_TRADE"], hazard_profile: ["GENERAL"], employee_count: 40 }
              as: NetworkAdmin
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /prequalifications"
              payload: { contractor_id: "${con_id}", client_id: "${client_id}", cycle_year: 2026, expected_contractor_version: "${con_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { pq_id: $.data.id }
          trigger:
            - call: "POST /prequalifications/${pq_id}/safety-statistics"
              payload: { reporting_year: 2025, hours_worked: 400000, recordable_incidents: 4, dart_cases: 2, fatalities: 0, emr: 0.95, citation_count_willful: 1, citation_count_serious: 2, citation_count_other: 3, source_document_ref: "OSHA300A-2025" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { stat_id: $.data.id }
            - call: "GET /prequalifications/${pq_id}/safety-statistics"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /prequalifications/${pq_id}/written-programs"
              payload: { program_type: "HAZCOM", revision_date: "2026-06-01T00:00:00Z", document_ref: "DOC-HAZCOM-1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { wp_hazcom_id: $.data.id }
            - call: "POST /written-programs/${wp_hazcom_id}/review"
              payload: { decision: "DEFICIENT", reviewer_note: "Section 5 omits the SDS index" }
              as: ClientSafetyManager
              as_user_id: "${client_id}"
            - call: "GET /prequalifications/${pq_id}"
              payload: {}
              as: ClientSafetyManager
              as_user_id: "${client_id}"
          assert:
            - "the creation response already carries data.citation_points == 12, data.trir == 2.0000, data.dart_rate == 1.0000"
            - "the immediate list read returns the same row ${stat_id} with identical citation_points 12, trir 2.0000 and dart_rate 1.0000 - no lag, no recomputation drift"
            - "the review response carries data.review_status == DEFICIENT"
            - "the immediate parent read returns document_review_status == DEFICIENT and statistics_verification_status == PENDING in one response"
