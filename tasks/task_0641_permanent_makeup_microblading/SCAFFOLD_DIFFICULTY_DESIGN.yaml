  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_cooling_off_48h_halfopen_lower_bound
        grounds:
          - validations[priority=9]
          - entities.PatchTest.fields.applied_at
          - entities.Appointment.fields.scheduled_start
          - errors[ERR_COOLING_OFF_VIOLATION]
        distinguishing_aspect: "Patch-test cooling-off interval semantics: scheduled_start must satisfy scheduled_start >= applied_at + 48h (lower-bound inclusive). applied_at=2026-01-01T00:00Z; a scheduled_start of 2026-01-02T23:59:59Z (47h59m59s) is rejected, while 2026-01-03T00:00:00Z (exactly 48h) is accepted."
        test_recipe:
          setup:
            - "Patch test applied at 2026-01-01; consented client; booking at 47h59m59s rejected."
