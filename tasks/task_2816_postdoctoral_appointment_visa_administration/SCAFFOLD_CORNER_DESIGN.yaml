      - name: an_award_that_ended_yesterday_cannot_be_verified_while_one_ending_today_can
        claim_type: temporal_validation
        grounds:
          - validations.priority_34_ERR_AWARD_EXPIRED
          - state_machines.FundingSource.UNVERIFIED_to_VERIFIED
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: "The rule is evaluated against the logical clock date, which starts at 2026-08-01. An award whose award_end_date is 2026-07-31 is refused with ERR_AWARD_EXPIRED (422) and stays UNVERIFIED, while an award ending exactly 2026-08-01 verifies - the comparison is on-or-after, so the same-day award is inside the window and only the day before it is outside."
        test_recipe:
          setup:
            - "The logical clock is left at its startup value 2026-08-01T00:00:00Z."
            - "Two UNVERIFIED awards exist: one running 2025-08-01 to 2026-07-31 and one running 2025-08-01 to 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_14"
            - call: "POST /funding-sources"
              payload: { sponsor_name: "Expired Award 5300", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2025-08-01", award_end_date: "2026-07-31", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_53"
              captures: { f53_exp_id: "$.data.id", f53_exp_vs: "$.data.verification_status" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "Last Day Award 5301", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2025-08-01", award_end_date: "2026-08-01", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_53"
              captures: { f53_last_id: "$.data.id" }
          trigger:
