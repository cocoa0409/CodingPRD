              captures: { alt_d: $.data.id }
            - call: "POST /portfolio/alteration-requests/${alt_d}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
          assert:
            - "after setup: Lease.${lease_id}.gfa_allocated_sqft == 190000 and gfa_unallocated_sqft == 10000"
            - "trigger[0] returns 200 with AlterationRequest.${alt_a}.status == APPROVAL_REVOKED, gfa_allocated_sqft == 40000 and gfa_unallocated_sqft == 160000"
            - "trigger[1] returns ERR_INVALID_STATE (409) and the envelope is untouched: gfa_allocated_sqft is still 40000, not -110000"
            - "trigger[2] returns 201 - A's window was released by the revocation, so the reused window is free"
            - "trigger[3] returns ERR_GFA_ENVELOPE_EXCEEDED (409): 40000 + 170000 == 210000 > 200000; AlterationRequest.${alt_c}.status stays SUBMITTED and gfa_allocated_sqft stays 40000"
            - "trigger[5] returns 200 with AlterationRequest.${alt_d}.status == APPROVED, gfa_allocated_sqft == 200000 and gfa_unallocated_sqft == 0 - the cap is inclusive"
            - "at every point above gfa_allocated_sqft + gfa_unallocated_sqft == 200000 and gfa_allocated_sqft equals the sum of requested_gfa_sqft over the lease's APPROVED requests only"

      - name: reversion_holdback_then_close_conserves_the_security_deposit_across_three_buckets
        grounds:
          - calculations.reversion_condition_score
          - state_machines.ReversionAssessment.INSPECTED_to_HOLDBACK_APPLIED
          - state_machines.ReversionAssessment.HOLDBACK_APPLIED_to_CLOSED
          - validations.priority_8_segregation_of_duties
          - validations.priority_15_amount_reconciliation
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          held + applied + refunded must equal security_deposit_cents after every call, including after
          the three refused ones. The refusals are ordered so that each is the only thing wrong:
          same-user holdback (403), off-by-100000 acknowledgement (422), then repeat holdback (409). The
          holdback figure itself is a weighted score computed per component and then summed - 4200 + 1800
          + 500 == 6500 against a 7000 passing score gives deficiency 3500 and a 3500000 holdback - and
          close must release exactly the 1500000 that survived, not the original 5000000.
        test_recipe:
          setup:
            - "One lease with security_deposit_cents 5000000, improvements_value_cents 10000000, reversion_standard_code SHELL_CONDITION (weights 6000/3000/1000, passing 7000) and expiration_date 2026-09-01."
            - "The clock is advanced to 2026-09-02 and one administration run expires the lease (phase 5), which auto-creates the ReversionAssessment in PENDING_INSPECTION - the only route to a reversion, since REVERTED is reachable only from EXPIRED."
            - "That assessment is then inspected by am-1 at structural 70, envelope 60, systems 50."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-65", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2026-09-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 10000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: LessorAdmin
            - call: "POST /portfolio/administration-runs"
              payload: {}
              as: LessorAdmin
            - call: "GET /portfolio/reversion-assessments?lease_id=${lease_id}"
              payload: {}
              as: AssetManager
              as_user_id: "am-1"
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /portfolio/reversion-assessments/${assess_id}/inspection"
              payload: { structural_condition_score: 70, envelope_condition_score: 60, systems_condition_score: 50 }
              as: AssetManager
              as_user_id: "am-1"
          trigger:
            - call: "POST /portfolio/reversion-assessments/${assess_id}/holdback"
              payload: { acknowledged_holdback_cents: 3500000 }
              as: AssetManager
              as_user_id: "am-1"
            - call: "POST /portfolio/reversion-assessments/${assess_id}/holdback"
              payload: { acknowledged_holdback_cents: 3400000 }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/reversion-assessments/${assess_id}/holdback"
              payload: { acknowledged_holdback_cents: 3500000 }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/reversion-assessments/${assess_id}/holdback"
              payload: { acknowledged_holdback_cents: 3500000 }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/reversion-assessments/${assess_id}/close"
              payload: {}
              as: AssetManager
              as_user_id: "am-1"
            - call: "POST /portfolio/reversion-assessments/${assess_id}/close"
              payload: {}
              as: AssetManager
              as_user_id: "am-1"
          assert:
            - "after setup: Lease.${lease_id}.lease_status == EXPIRED and rent_status == FROZEN, and exactly one ReversionAssessment exists on the lease"
            - "after setup: ReversionAssessment.${assess_id}.status == INSPECTED, required_standard_code SHELL_CONDITION, weighted_score_bps == 6500, deficiency_bps == 3500, inspected_by_user_id 'am-1'"
            - "after setup: Lease.${lease_id}.deposit_held_cents == 5000000, deposit_applied_cents == 0, deposit_refunded_cents == 0"
            - "trigger[0] returns ERR_SEGREGATION_OF_DUTIES (403) - am-1 recorded the inspection - and no deposit bucket moves"
            - "trigger[1] returns ERR_AMOUNT_NOT_RECONCILED (422): the computed holdback is min(5000000, 10000000 x 3500 bps) == 3500000 and 3400000 is not it; status stays INSPECTED"
            - "trigger[2] returns 200 with ReversionAssessment.${assess_id}.status == HOLDBACK_APPLIED and holdback_cents == 3500000"
            - "after trigger[2]: Lease.${lease_id}.deposit_applied_cents == 3500000, deposit_held_cents == 1500000, deposit_refunded_cents == 0 and lease_status is still EXPIRED (the holdback does not revert the lease)"
            - "trigger[3] returns ERR_INVALID_STATE (409) - HOLDBACK_APPLIED has no second holdback transition - and deposit_applied_cents stays 3500000, deposit_held_cents stays 1500000"
            - "trigger[4] returns 200 with ReversionAssessment.${assess_id}.status == CLOSED and deposit_released_cents == 1500000 (the post-holdback balance, not the original 5000000)"
            - "after trigger[4]: Lease.${lease_id}.deposit_held_cents == 0, deposit_applied_cents == 3500000, deposit_refunded_cents == 1500000, lease_status == REVERTED"
            - "trigger[5] returns ERR_INVALID_STATE (409) from the terminal CLOSED state; deposit_refunded_cents is not credited twice"
            - "after every call above: deposit_held_cents + deposit_applied_cents + deposit_refunded_cents == 5000000"
