            - "r2_status == SCHEDULED (exactly 4h old: inclusive boundary)"
            - "err == ERR_WASH_CHECK_STALE (4.5h > 4h under RESTRICTED; the same age would be fresh under NORMAL's 12h)"

      - name: c_run_create_missing_wash_returns_stale
