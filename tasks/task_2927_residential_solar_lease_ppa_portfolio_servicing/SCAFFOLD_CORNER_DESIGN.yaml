# ---------------------------------------------------------------------------
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for task 2927
# Residential Solar Lease & PPA Portfolio Servicing.
# Sections and claim_type values come from references/claim-extraction-guide.md.
# Every literal below was computed with Decimal ROUND_HALF_UP against the
# §1.3 formulas and their constants.
# ---------------------------------------------------------------------------

scaffold_corner_design:

  - section: entities
    instances:

      - name: create_lease_agreement_returns_201_with_computed_contract_end_date
        claim_type: creation
        grounds:
          - entities.SolarAgreement
          - endpoints[POST /servicing/agreements]
          - response_envelope.success
        distinguishing_aspect: "A LEASE agreement created with all required fields returns 201, echoes every input verbatim, and computes contract_end_date 2044-12-31 from contract_start_date 2025-01-01 plus term_years 20 minus one day."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One Homeowner and one NEM_2 UtilityTariff exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { ho1_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { t_nem2_id: $.data.id }
          trigger:
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${ho1_id}", tariff_id: "${t_nem2_id}", site_address: "77 Bayside Rd, Alameda CA", state_code: "CA", product_type: "LEASE", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.019, guaranteed_annual_kwh: 8400, system_dc_kw: 6.40, guarantee_band_pct: 0.05, base_monthly_lease_cents: 12900 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agE1_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "SolarAgreement.${agE1_id}.product_type == LEASE and base_monthly_lease_cents == 12900 and base_ppa_rate_per_kwh_millicents == null"
            - "SolarAgreement.${agE1_id}.contract_end_date == 2044-12-31"
            - "SolarAgreement.${agE1_id}.lifecycle_state == DRAFT, monitoring_status == MONITORING_OK, service_status == IN_SERVICE"
            - "SolarAgreement.${agE1_id}.credit_earned_cents == 0, credit_applied_cents == 0, credit_balance_cents == 0, renewal_count == 0, open_outage_count == 0, excused_downtime_minutes == 0"

      - name: get_homeowner_returns_the_stored_record
        claim_type: retrieval
        grounds:
          - entities.Homeowner
          - endpoints[GET /servicing/homeowners/{homeowner_id}]
        distinguishing_aspect: "GET /servicing/homeowners/{id} returns exactly the six stored input fields plus id and version, with dti_ratio preserved as 0.28 rather than re-rounded."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one Homeowner created by u_admin_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoE2_id: $.data.id }
          trigger:
            - call: "GET /servicing/homeowners/${hoE2_id}"
              payload: {}
              as: CreditUnderwriter
              as_user_id: "u_credit_1"
          assert:
            - "HTTP 200 and Homeowner.${hoE2_id}.full_name == Dana Reyes"
            - "Homeowner.${hoE2_id}.email == dana.reyes@example.com and state_code == CA"
            - "Homeowner.${hoE2_id}.fico_score == 742, dti_ratio == 0.28, monthly_income_cents == 1150000"
            - "Homeowner.${hoE2_id}.version == 1"

      - name: list_agreements_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /servicing/agreements]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three agreements for one homeowner, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Three DRAFT PPA agreements for the same homeowner on the same tariff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoE3_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { tE3_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoE3_id}", tariff_id: "${tE3_id}", site_address: "1 Oak St, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoE3_id}", tariff_id: "${tE3_id}", site_address: "2 Oak St, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoE3_id}", tariff_id: "${tE3_id}", site_address: "3 Oak St, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
          trigger:
            - call: "GET /servicing/agreements"
              payload: { homeowner_id: "${hoE3_id}", limit: 2, offset: 0 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
            - call: "GET /servicing/agreements"
              payload: { homeowner_id: "${hoE3_id}", limit: 2, offset: 2 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
          assert:
            - "first page: response_type == array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 row, total_count == 3, has_more == false, offset == 2"
            - "the two pages together return three distinct agreement ids with no repeats"

      - name: list_production_periods_filtered_by_status_excludes_other_rows
        claim_type: listing
        grounds:
          - endpoints[GET /servicing/production-periods]
        distinguishing_aspect: "With one RECORDED and one RECONCILED period on the same agreement, ?status=RECONCILED returns exactly one row (total_count 1), proving the filter is applied before pagination."
        test_recipe:
          setup:
            - "Clock at 2026-07-10T00:00:00Z."
            - "One ACTIVE PPA agreement with A1 terms."
            - "Two ProductionPeriods: 2026-05 left RECORDED, 2026-06 reconciled without issuing credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoE4_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { tE4_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoE4_id}", tariff_id: "${tE4_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agE4_id: $.data.id }
            - call: "POST /servicing/agreements/${agE4_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${agE4_id}", period_year: 2026, period_month: 5, metered_kwh: 1000 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { pE4a_id: $.data.id }
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${agE4_id}", period_year: 2026, period_month: 6, metered_kwh: 1100, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { pE4b_id: $.data.id }
          trigger:
            - call: "GET /servicing/production-periods"
              payload: { agreement_id: "${agE4_id}", status: "RECONCILED" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
          assert:
            - "HTTP 200, total_count == 1, has_more == false"
            - "the single row is ${pE4b_id} and ${pE4a_id} is absent"
            - "ProductionPeriod.${pE4a_id}.status == RECORDED (auto_reconcile omitted defaults to false)"

      - name: list_with_limit_above_one_hundred_returns_invalid_request
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - validations[priority=3].payload_shape_and_domain
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "limit=101 exceeds the declared max of 100 and must be rejected with 400 ERR_INVALID_REQUEST rather than silently clamped to 100."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one Homeowner exists so the list is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "GET /servicing/homeowners"
              payload: { limit: 101 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { errE5: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no rows are returned and response_type == error"

      - name: get_agreement_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4].path_resource_existence
          - errors[ERR_AGREEMENT_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown agreement id returns 404 ERR_AGREEMENT_NOT_FOUND — the entity-specific code, not a generic 404."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty agreement table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "GET /servicing/agreements/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { errE6: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_AGREEMENT_NOT_FOUND"

      - name: create_agreement_missing_required_guaranteed_annual_kwh_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.SolarAgreement.fields.guaranteed_annual_kwh
          - validations[priority=3].payload_shape_and_domain
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "guaranteed_annual_kwh has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST — it must not be defaulted to 0 or inferred from system_dc_kw."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one Homeowner and one tariff exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoE7_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { tE7_id: $.data.id }
          trigger:
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoE7_id}", tariff_id: "${tE7_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, system_dc_kw: 7.20, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { errE7: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /servicing/agreements?homeowner_id=${hoE7_id} returns total_count == 0: nothing was persisted"

      - name: omitted_guarantee_band_pct_defaults_to_five_percent
        claim_type: defaults
        grounds:
          - entities.SolarAgreement.fields.guarantee_band_pct
          - calculations.monthly_shortfall_credit
        distinguishing_aspect: "Omitting guarantee_band_pct stores 0.05, which is observable downstream: the June floor for a 9600 kWh guarantee is 1021 kWh, not the 1075 kWh an implementation defaulting the band to 0 would use."
        test_recipe:
          setup:
            - "Clock at 2026-07-10T00:00:00Z."
            - "A PPA agreement created WITHOUT guarantee_band_pct, then activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoE8_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { tE8_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoE8_id}", tariff_id: "${tE8_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agE8_id: $.data.id }
            - call: "POST /servicing/agreements/${agE8_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
          trigger:
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${agE8_id}", period_year: 2026, period_month: 6, metered_kwh: 1050, auto_reconcile: true, auto_issue_credit: true }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { pE8_id: $.data.id }
          assert:
            - "SolarAgreement.${agE8_id}.guarantee_band_pct == 0.05"
            - "ProductionPeriod.${pE8_id}.gross_expected_kwh == 1075 and adjusted_expected_kwh == 1075"
            - "ProductionPeriod.${pE8_id}.guarantee_floor_kwh == 1021"
            - "ProductionPeriod.${pE8_id}.shortfall_kwh == 0 and credit_cents == 0 and status == RECONCILED (1050 sits inside the deadband)"

      - name: omitted_grandfathers_predecessors_defaults_to_false
        claim_type: defaults
        grounds:
          - entities.UtilityTariff.fields.grandfathers_predecessors
          - calculations.nem_grandfathering_status
        distinguishing_aspect: "A tariff created without grandfathers_predecessors stores false, so an agreement that predates it is NOT grandfathered when the tariff is applied — tariff_grandfathered stays false."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "NEM_2 tariff effective 2020-04-15 with grandfathers_predecessors true; a PPA agreement starting 2025-01-01, activated on it."
            - "A successor NEM_3 tariff created with grandfathers_predecessors omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { hoE9_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { tE9a_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM3-NOGF", generation: "NEM_3", retail_rate_per_kwh_millicents: 38000, export_credit_rate_per_kwh_millicents: 7500, monthly_fixed_charge_cents: 2400, effective_from_date: "2026-04-15" }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { tE9b_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${hoE9_id}", tariff_id: "${tE9a_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { agE9_id: $.data.id }
            - call: "POST /servicing/agreements/${agE9_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
          trigger:
            - call: "GET /servicing/utility-tariffs/${tE9b_id}"
              payload: {}
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
            - call: "POST /servicing/agreements/${agE9_id}/apply-tariff"
              payload: { tariff_id: "${tE9b_id}" }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
          assert:
            - "UtilityTariff.${tE9b_id}.grandfathers_predecessors == false"
            - "SolarAgreement.${agE9_id}.tariff_id == ${tE9b_id} after apply-tariff"
            - "SolarAgreement.${agE9_id}.tariff_grandfathered == false"

      - name: production_period_creation_computes_contract_year_and_due_date_only
        claim_type: computed_fields
        grounds:
          - entities.ProductionPeriod
          - endpoints[POST /servicing/production-periods].side_effects
          - calculations.monthly_expected_production
          - calculations.period_net_settlement
        distinguishing_aspect: "Creating 2026-06 on an agreement starting 2025-01-01 computes contract_year 2 and due_date 2026-07-21 (month end plus PAYMENT_TERM_DAYS 21), while every settlement money field stays 0 because the row is only RECORDED."
        test_recipe:
          setup:
            - "Clock at 2026-07-10T00:00:00Z."
            - "One ACTIVE PPA agreement with the A1 terms (start 2025-01-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: PortfolioAdmin
