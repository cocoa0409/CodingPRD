              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { member_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Unseated Visitor", home_state_code: "PA", trained_through_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { outsider_id: "$.data.id" }
            - call: "GET /accreditation/cycles/${cycle_a_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_a_version: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cycle_a_id}", window_start_date: "2026-08-01", window_end_date: "2026-08-07", expected_cycle_version: "${cycle_a_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${lead_id}", team_role: "LEAD", travel_block_start_date: "2026-08-01", travel_block_end_date: "2026-08-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${member_id}", team_role: "MEMBER", travel_block_start_date: "2026-08-01", travel_block_end_date: "2026-08-02" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visits/${visit_id}/schedule"
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "PATCH /accreditation/standard-evaluations/${ev_a_id}/self-assessment"
              payload: { self_score: "NOT_MET" }
              as: CampDirector
              as_user_id: "${camp_b_id}"
            - call: "GET /accreditation/camps/${camp_a_id}"
              as: CampDirector
              as_user_id: "${camp_b_id}"
            - call: "POST /accreditation/visits/${visit_id}/start"
              as: Visitor
              as_user_id: "${member_id}"
            - call: "POST /accreditation/visits/${visit_id}/start"
              as: Visitor
              as_user_id: "${lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_a_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${outsider_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_a_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${member_id}"
            - call: "POST /accreditation/visits/${visit_id}/finalize-scoring"
              as: Visitor
