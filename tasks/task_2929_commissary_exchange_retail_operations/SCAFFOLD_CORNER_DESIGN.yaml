              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-10T00:00:00Z", valid_to: "2026-08-20T00:00:00Z", per_sale_spend_cap_cents: 50000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_id: $.data.id }
            - call: "POST /shopper-delegations/${delegation_id}/revoke"
              payload: { reason: "SPONSOR_REQUEST" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
