          trigger:
            - call: "POST /rental-lines"
              payload: { contract_id: "${cB}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-20", required_working_height_ft: 40, expected_contract_version: "${cvB}" }
              as: RentalCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FAMILIARIZATION_REQUIRED (priority 8 business_safety fires before priority 14 business_constraint window check)"
            - "error_id != ERR_UNIT_WINDOW_CONFLICT even though the requested window [2026-08-10, 2026-08-21) intersects the existing RESERVED window [2026-08-05, 2026-08-16)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: min_rental_floor_boundary
        grounds:
          - calculations.billable_days
          - validations[priority=6]
          - entities.EquipmentClass.fields.min_rental_days
        distinguishing_aspect: |
          Metric: billable days at the minimum-period floor — off-rent at 72 elapsed
          hours (3 days, below the 4-day floor) and at exactly 96 elapsed hours (at the
          floor) must BOTH bill exactly 4 days; the boundary is reached through the
          off-rent endpoint, unlike the standby-minute boundary on trip completion.
        test_recipe:
          setup:
            - "Class BOOM45M: min_rental_days 4, daily 20000, weekly 80000, monthly 240000, height 51"
            - "Contract ACTIVE with lines L1 (unit 1) and L2 (unit 2), both delivered at 2026-08-10T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Boundary Bros", contact_email: "ops@boundary.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "BOOM45M", category: "AERIAL_LIFT", max_working_height_ft: 51, min_rental_days: 4, daily_rate_cents: 20000, weekly_rate_cents: 80000, monthly_rate_cents: 240000, replacement_value_cents: 4000000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "BOOM45M-001", ansi_standard_ref: "ANSI A92.20" }
              as: BranchManager
              captures: { unit1_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "BOOM45M-002", ansi_standard_ref: "ANSI A92.20" }
              as: BranchManager
              captures: { unit2_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { customer_id: "${cust_id}", jobsite_address: "55 Yard Rd", damage_waiver_elected: false }
              as: RentalCoordinator
              captures: { contract_id: $.data.id, cv: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit1_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-31", required_working_height_ft: 40, expected_contract_version: "${cv}" }
              as: RentalCoordinator
              captures: { l1: $.data.id }
            - call: "GET /rental-contracts/${contract_id}"
              as: RentalCoordinator
              captures: { cv2: $.data.version }
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit2_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-31", required_working_height_ft: 40, expected_contract_version: "${cv2}" }
              as: RentalCoordinator
              captures: { l2: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              as: RentalCoordinator
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${l1}", trip_type: "DELIVERY", driver_id: "drv-1", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { t1: $.data.id }
            - call: "POST /delivery-trips"
              payload: { contract_id: "${contract_id}", line_id: "${l2}", trip_type: "DELIVERY", driver_id: "drv-2", planned_start_utc: "2026-08-10T08:00:00Z", planned_end_utc: "2026-08-10T10:00:00Z" }
              as: RentalCoordinator
              captures: { t2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BranchManager
            - call: "POST /delivery-trips/${t1}/start"
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${t1}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-1"
            - call: "POST /delivery-trips/${t2}/start"
              as: Driver
              as_user_id: "drv-2"
            - call: "POST /delivery-trips/${t2}/complete"
              payload: { standby_minutes: 0, crew_labor_hours: 0 }
              as: Driver
              as_user_id: "drv-2"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T09:00:00Z" }
              as: BranchManager
            - call: "POST /rental-lines/${l1}/off-rent"
              as: RentalCoordinator
              captures: { acc1: $.data.accrued_charge_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T09:00:00Z" }
              as: BranchManager
            - call: "POST /rental-lines/${l2}/off-rent"
              as: RentalCoordinator
              captures: { acc2: $.data.accrued_charge_cents }
          assert:
            - "L1 (72 elapsed hours = 3 raw days, below floor): accrued_charge_cents == 80000 (floor applies: 4 days -> min(20000*4, 80000*1, 240000*1) = 80000)"
            - "L2 (exactly 96 elapsed hours = exactly 4 raw days): accrued_charge_cents == 80000 (boundary: exactly min_rental_days counts as 4 days, NOT 5)"
            - "both lines bill identically at the floor boundary (>= semantics: 4 days elapsed does not round up)"

      - name: standby_free_window_boundary
        grounds:
          - calculations.standby_charge
          - entities.DeliveryTrip.fields.standby_minutes
        distinguishing_aspect: |
          Metric: standby minutes at the free-window threshold — exactly 30 minutes
          yields 0 charge while 31 minutes yields 250 cents; reached through the trip
          completion endpoint, a different metric and endpoint than the min-period floor.
        test_recipe:
          setup:
            - "Class S19S (daily 14500, weekly 43500, monthly 99000, min 1, height 25)"
            - "Contract ACTIVE; lines L1 (unit 1) and L2 (unit 2); delivery trips T1 and T2 EN_ROUTE at 2026-08-10T09:00:00Z"
          setup_api_calls:
