            - "Seller.${s_id}.disbursement_state == FULL_HOLD"
            - "exactly one DisbursementHold exists with hold_type FULL_HOLD, reserve_basis NONE, auto_created true, state ACTIVE, risk_tier TIER_3, held_amount_cents 100000"
            - "that hold's coverage_start == 2026-08-01T00:00:00.000Z and coverage_end == 2026-10-30T00:00:00.000Z   # + FULL_HOLD_COVERAGE_DAYS 90"
