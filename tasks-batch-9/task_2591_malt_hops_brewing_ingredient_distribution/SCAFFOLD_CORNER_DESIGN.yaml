          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Chronological Reading Brewing", brewery_license_no: "BR-1018", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
