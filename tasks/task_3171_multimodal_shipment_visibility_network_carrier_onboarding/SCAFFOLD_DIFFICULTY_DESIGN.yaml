            - call: "POST /connections/${au_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /connections/${au_conn_id}/heartbeats"
              payload: { reported_at: "2026-09-01T00:00:00Z", payload_completeness_pct: 100 }
              as: CarrierRep
              as_user_id: "${au_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:15:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
            - call: "POST /connections/${au_conn_id}/activate"
              payload: {}
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "AuthShip" }
              as: PlatformAdmin
              captures: { au_shp_id: $.data.id }
            - call: "POST /shippers/${au_shp_id}/shipments"
              payload: { carrier_id: "${au_car_id}", connection_id: "${au_conn_id}", mode: "TRUCKLOAD", tracking_reference: "TRK-AU", mode_reference: "PRO-AU", destination_code: "MEM", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-02T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${au_shp_id}"
              captures: { au_ship_id: $.data.id }
            - call: "POST /shipments/${au_ship_id}/events"
              payload: { event_time: "2026-09-01T06:00:00Z", event_type: "DELAY_REPORTED", delay_minutes: 300 }
              as: CarrierRep
              as_user_id: "${au_car_id}"
            - call: "GET /shipments/${au_ship_id}/alerts"
              payload: {}
              as: NetworkOps
              captures: { au_alert_id: "$.data[0].id" }
            - call: "POST /alerts/${au_alert_id}/acknowledge"
              payload: {}
              as: CustomerService
            - call: "POST /alerts/${au_alert_id}/resolve"
              payload: { resolution: "FALSE_ALARM" }
              as: CustomerService
          trigger:
            - call: "POST /alerts/${au_alert_id}/resolve"
              payload: { resolution: "DELAY_CONFIRMED" }
              as: CarrierRep
              as_user_id: "${au_car_id}"
              captures: { au_err: $.data.error_id }
          assert:
            - "response status 403 with error_id ERR_INSUFFICIENT_PERMISSIONS (auth priority 2 beats state priority 6 even though the alert is already RESOLVED)"
            - "ExceptionAlert.${au_alert_id} remains RESOLVED with resolution FALSE_ALARM (resolution not overwritten)"

      - name: window_overlap_beats_stale_facility_version
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - concurrency_rules[appointment-book-stale-facility]
          - errors.ERR_APPOINTMENT_WINDOW_CONFLICT
          - errors.ERR_STALE_VERSION
