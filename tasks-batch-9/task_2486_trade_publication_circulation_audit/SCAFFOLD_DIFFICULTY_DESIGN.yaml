  - rule_id: transitive_cascade
    instances:
      - name: issue_report_five_hop_restatement_cascade
        grounds:
          - calculations.statement_reconciliation_discrepancy
          - calculations.publication_audit_posture
          - calculations.contract_makegood_ledger
          - state_machines.CirculationStatement.UNDER_AUDIT_to_RESTATEMENT_REQUIRED
          - state_machines.AuditEngagement.RECONCILIATION_to_REPORT_ISSUED
          - state_machines.MakeGoodObligation.OFFERED_to_VOID
          - entities.AdvertiserContract.fields.guarantee_status
        distinguishing_aspect: |
          Depth 5, each hop caused strictly by the previous one: (1) the report writes
          discrepancy_pct 25.00 onto the statement, (2) crossing materiality moves the statement to
          RESTATEMENT_REQUIRED, (3) the presence of a RESTATEMENT_REQUIRED statement freezes the
          publication, (4) the FROZEN posture suspends the ACTIVE advertiser contract, (5) the
          contract leaving ACTIVE voids its OFFERED make-good and returns the credit to the pool.
          Trigger is issue-report, distinct from the hygiene-sweep cascade instance.
