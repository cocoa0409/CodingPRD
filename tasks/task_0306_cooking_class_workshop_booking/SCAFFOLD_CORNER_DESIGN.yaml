            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { sess_v: $.data.version }
          assert:
            - "ClassSession.${sess_id}.version == 2 after the confirm"
            - "ClassSession.${sess_id}.confirmed_seats == 1"

      - name: occ_stale_session_version_rejected_on_confirm
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-confirm-stale-session]", "errors[ERR_STALE_SESSION_VERSION]"]
        distinguishing_aspect: "Confirming with expected_session_version one behind the actual session version (after another confirm advanced it) returns ERR_STALE_SESSION_VERSION (412)."
        test_recipe:
          setup: ["OPEN session planned_seats=3; Member A confirmed (version now 2); Member B's PENDING booking still carries the stale version 1"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef SV", email: "sv2@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem SA", email: "sa@x.com" }
              as: StudioAdmin
              captures: { mem_a: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem SB", email: "sb@x.com" }
              as: StudioAdmin
              captures: { mem_b: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "SV", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 3, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STSV", event_type: "GROUP", start_at: "2026-11-28T14:00:00Z", end_at: "2026-11-28T16:00:00Z", planned_seats: 3 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "z", qty_per_seat: 1, unit_cost_cents: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_a}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_a}"
              captures: { bk_a: $.data.id }
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_b}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_b}"
              captures: { bk_b: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_12: $.data.version }
            - call: "POST /culinary/bookings/${bk_a}/confirm"
              payload: { expected_session_version: "${occ_sv_12}" }
              as: Member
              as_user_id: "${mem_a}"
              captures: { sess_v_pre: $.data.id }
          trigger:
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_13: $.data.version }
            - call: "POST /culinary/bookings/${bk_b}/confirm"
              payload: { expected_session_version: "${occ_sv_13}" }
              as: Member
              as_user_id: "${mem_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_SESSION_VERSION"
            - "response http status == 412"
            - "Booking.${bk_b}.lifecycle_status == PENDING (unchanged)"

      - name: derived_confirmed_seats_reconciled_after_cancel
        claim_type: derived_field_reconciliation
        grounds: [entities.ClassSession.fields.confirmed_seats, state_machines.Booking.CONFIRMED_to_CANCELLED]
        distinguishing_aspect: "confirmed_seats is 2 after a 2-seat confirm and reconciles back to 0 after that booking cancels (empty waitlist), with prep_cost_per_seat recomputed against planned_seats."
        test_recipe:
          setup: ["OPEN session planned_seats=4; a CONFIRMED 2-seat booking; clock well before start; no waitlist"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef DR", email: "dr@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem DR", email: "memdr@x.com" }
              as: StudioAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "DR", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STDR", event_type: "GROUP", start_at: "2026-12-01T14:00:00Z", end_at: "2026-12-01T16:00:00Z", planned_seats: 4 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "z", qty_per_seat: 1, unit_cost_cents: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_id}", seats_requested: 2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_14: $.data.version }
            - call: "POST /culinary/bookings/${bk_id}/confirm"
              payload: { expected_session_version: "${occ_sv_14}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { seats_after_confirm: $.data.confirmed_seats }
          trigger:
            - call: "POST /culinary/bookings/${bk_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { seats_after_cancel: $.data.confirmed_seats }
          assert:
            - "ClassSession.${sess_id}.confirmed_seats == 2 after confirm (seats_after_confirm)"
            - "ClassSession.${sess_id}.confirmed_seats == 0 after cancel (seats_after_cancel)"

      - name: refund_final_reconciliation_credits_delta_on_complete
        claim_type: dual_variant_calculation
        grounds: [calculations.cancellation_refund, entities.Booking.fields.refilled_from_waitlist]
        excluded_because:
          difficulty_instance: dual_variant_calc / refund_provisional_vs_final_on_booking
          rationale: "The provisional-to-final refund switch and its wallet delta are the named §1.8 dual-variant instance."

  # =========================================================================
