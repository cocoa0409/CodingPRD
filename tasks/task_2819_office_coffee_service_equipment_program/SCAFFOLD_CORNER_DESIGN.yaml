        distinguishing_aspect: "The 75000-cent commitment floor is conditional on terms_type: 74999 is refused for a LOAN and accepted for a RENTAL, exactly 75000 is accepted for a LOAN, and a LOANER-role asset can never be placed at a site however healthy the commitment."
