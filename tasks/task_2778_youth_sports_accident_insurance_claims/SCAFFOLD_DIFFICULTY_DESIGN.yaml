            - "A baseball GAME occupies 2026-07-11T18:00:00Z to 2026-07-11T20:30:00Z and is left in PENDING_SANCTION; widened by the baseball buffer of 60 minutes its window is the closed interval [17:00, 21:30]."
          setup_api_calls:
