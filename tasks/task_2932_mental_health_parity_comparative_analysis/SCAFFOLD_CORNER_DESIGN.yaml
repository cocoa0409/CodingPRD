        grounds:
          - validations.priority_29_ERR_PRODUCTION_WINDOW_OVERLAP
          - validations.priority_28_ERR_MEASUREMENT_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / production_window_is_half_open_so_adjacency_is_accepted"
          rationale: "The half-open versus closed-and-buffered interval conventions are asserted there and in measurement_period_is_closed_with_a_one_day_buffer_so_adjacency_is_rejected."

      - name: escalation_ripeness_boundary
        claim_type: Temporal validation
        grounds:
          - validations.priority_30_ERR_NOT_YET_OVERDUE
        excluded_because:
          difficulty_instance: "boundary_precision_check / escalation_ripeness_at_exactly_due_at_versus_one_second_later"
          rationale: "Both endpoints of the strict > comparison, and the 7-day breach grace boundary, are asserted there."

