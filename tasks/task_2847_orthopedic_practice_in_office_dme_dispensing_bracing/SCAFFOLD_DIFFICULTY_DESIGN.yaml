  - rule_id: compensating_invariant
    instances:
      - name: unit_ledger_conserved_across_reservation_release_dispense_and_restock
        grounds:
          - endpoints[GET /dme/clinics/{id}/dispensing-summary]
          - entities.ClinicParLevel.fields.lifetime_received_qty
          - entities.ClinicParLevel.fields.on_hand_qty
          - entities.ClinicParLevel.fields.reserved_qty
          - state_machines.DispenseEncounter.clinical_status.RESERVED_to_DOCUMENTED
          - state_machines.ProductReturn.REQUESTED_to_RESTOCKED
        distinguishing_aspect: |
          Conserved quantity #1 is DEVICE UNITS, pinned as
          units_accounted_total == units_on_hand_total + units_dispensed_total
          - units_restocked_total, which must equal units_received_total at
          every checkpoint. The compensations exercised are a released
          reservation (reserved_qty returns to 0 without touching on_hand_qty)
          and a SELLABLE restock (the unit returns to the shelf while remaining
          counted as dispensed, and lifetime_received_qty is NOT bumped again).
          The other instance conserves cents through a different formula and a
          different set of fields.
        test_recipe:
          setup:
            - "one accredited clinic licensed for SPINE with an LSO shelf: par_min 4, par_max 20, 10 units received"
            - "one ordering physician, one attesting physician, one fitter, one patient"
            - "one encounter for 2 units: documented, IOAS-attested, verified as covered, and reserved"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
