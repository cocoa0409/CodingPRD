            - "SurveillanceReport.${rep_empty}.clabsi_count == 0 and crude_clabsi_rate == 0.00 and device_adjusted_clabsi_rate == 0.00"
            - "SurveillanceReport.${rep_empty}.network_benchmark_flag == WITHIN_BENCHMARK"

