              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/dye-lots/${dl}/start-dyeing"
              payload: {}
              as: DyeHouseOperator
              captures: { dl_v: $.data.version }
            - call: "POST /mill/dye-lots/${dl}/measurements"
              payload: { measured_lab_l: 55.48, measured_lab_a: 12.64, measured_lab_b: -8.00, expected_dye_lot_version: "${dl_v}" }
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl}/disposition"
              payload: { disposition: "APPROVE" }
              as: DyeHouseOperator
            - call: "POST /mill/production-runs/${pr}/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 100.0, dye_lot_id: "${dl}" }
              as: MillPlanner
              captures: { rg: $.data.id }
            - call: "POST /mill/product-tests"
              payload: { style_id: "${st}", roll_good_id: "${rg}", test_type: "FLAMMABILITY_PILL", result_value: 18.0 }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
              captures: { pt: $.data.id }
            - call: "POST /mill/certifications"
              payload: { style_id: "${st}", cert_type: "DOC_FF_1_70", source_test_ids: ["${pt}"], expires_at_utc: "2027-08-01T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
              captures: { cert: $.data.id }
            - call: "POST /mill/roll-goods/${rg}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 100000000 }
              as: MillPlanner
              captures: { acct: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${acct}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 100.0, shade_tolerance: "SINGLE_LOT" }
              as: MillPlanner
              captures: { co: $.data.id }
          trigger:
            - call: "POST /mill/cut-orders/${co}/allocate"
              payload: {}
              as: MillPlanner
            - call: "GET /mill/dye-lots/${dl}"
              payload: {}
              as: DyeHouseOperator
          assert:
            - "the allocate returns HTTP 200 with CutOrder.${co}.status == ALLOCATED and CutOrder.${co}.allocated_yards == 100.0"
            - "DyeLot.${dl}.uncommitted_yards == 0.0"
            - "DyeLot.${dl}.status == EXHAUSTED"
            - "DyeLot.${dl}.shipped_basis_uncommitted_yards == 100.0"
            - "DyeLot.${dl}.scrapped_yards == 0.0"
            - "RollGood.${rg}.available_yards == 0.0 and RollGood.${rg}.inventory_status == COMMITTED"
            - "CutOrder.${co}.gross_cents == 427500 and CutOrder.${co}.freight_cents == 0 and CutOrder.${co}.net_invoice_cents == 427500"

      - name: dye_lot_redye_loop_bounded_by_max_redye_count_corner
        claim_type: cyclic
        grounds:
          - state_machines.DyeLot.MEASURED_to_REDYE_QUEUED
          - state_machines.DyeLot.REDYE_QUEUED_to_DYEING
          - errors[ERR_REDYE_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: dye_lot_redye_revision_loop_bounded_by_max_redye_count
          rationale: "The named §1.8 instance walks the DYEING -> MEASURED -> REDYE_QUEUED -> DYEING loop twice and asserts the third REDYE is refused with ERR_REDYE_LIMIT_REACHED."

      - name: load_setup_guarded_by_style_suspension_corner
        claim_type: guarded_transitions
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_HELD
          - state_machines.CarpetStyle.ACTIVE_to_SUSPENDED
          - errors[ERR_STYLE_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: tufter_load_setup_gated_on_style_status_driven_by_certificate_revocation
          rationale: "The named §1.8 instance revokes the flammability certificate, observes the run parked in HELD and asserts load-setup is refused until a fresh certificate un-suspends the style."

      - name: dye_lot_rejection_cascades_down_to_rolls_and_allocations_corner
        claim_type: cascade_down
        grounds:
          - state_machines.DyeLot.APPROVED_to_REJECTED
          - state_machines.RollGood.qa_to_FAILED
          - state_machines.CutOrder.ALLOCATED_to_BACKORDERED
        excluded_because:
          difficulty_instance: dye_lot_rejection_five_hop_cascade_to_style_replenishment_flag
          rationale: "The named §1.8 instance asserts the full DyeLot -> RollGood -> CutAllocation -> CutOrder -> CarpetStyle cascade in one response."

      - name: order_cancel_compensates_run_and_roll_yardage_corner
        claim_type: compensation
        grounds:
          - state_machines.CutOrder.ALLOCATED_to_CANCELLED
          - calculations.roll_good_yardage_conservation
          - calculations.roll_good_yardage_ledger
        excluded_because:
          difficulty_instance: order_cancel_restores_production_run_linear_yardage
          rationale: "The named §1.8 instance asserts every yardage bucket returns to its pre-allocation value with no drift after cancellation."

      - name: style_runout_cancels_only_custom_orders_corner
        claim_type: conditional_cascade
        grounds:
          - state_machines.CarpetStyle.ACTIVE_to_RUNOUT
          - state_machines.CutOrder.SUBMITTED_to_CANCELLED
          - state_machines.Account.CREDIT_HOLD_to_ACTIVE
        excluded_because:
          difficulty_instance: style_discontinue_three_hop_cascade_releases_account_credit_hold
          rationale: "The named §1.8 instance asserts the RUNOUT cascade cancels the CUSTOM order, spares the RUNNING_LINE order and releases the account's credit hold."

  # ===========================================================================
  # SECTION 3 — CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:
      - name: reclamation_yield_for_ten_thousand_pounds_of_nylon_66
        claim_type: correct_result
        grounds:
          - calculations.reclamation_yield
          - state_machines.ReclamationBatch.RECEIVED_to_DEPOLYMERIZED
          - endpoints[POST /mill/reclamation-batches/{reclamation_batch_id}/depolymerize]
        distinguishing_aspect: |
          10000.0 lb of post-consumer NYLON_66 carpet yields exactly 1562.172 kg
          (10000.0 * 0.45359237 * 0.42 * 0.82, rounded once at the end), and contamination_pct 5.0
          is a gate rather than a multiplier — it does not scale the yield down.
        test_recipe:
          setup:
            - "Empty database; ReclamationBatch RB-01 logged with intake_lbs 10000.0, face_fiber_type NYLON_66 and contamination_pct 5.0."
          setup_api_calls:
            - call: "POST /mill/reclamation-batches"
              payload: { batch_code: "RB-01", intake_lbs: 10000.0, face_fiber_type: "NYLON_66", contamination_pct: 5.0 }
              as: ExtrusionOperator
              captures: { rb: $.data.id }
          trigger:
            - call: "POST /mill/reclamation-batches/${rb}/depolymerize"
              payload: {}
              as: ExtrusionOperator
            - call: "GET /mill/polymer-lots"
              payload: { reclaim_source: "POST_CONSUMER", limit: 10, offset: 0 }
              as: ExtrusionOperator
          assert:
            - "the depolymerize returns HTTP 200"
            - "ReclamationBatch.${rb}.depolymerized_kg == 1562.172"
            - "ReclamationBatch.${rb}.status == DEPOLYMERIZED"
            - "ReclamationBatch.${rb}.output_polymer_lot_id is a non-null id"
            - "the POST_CONSUMER list returns meta.total_count == 1"
            - "data[0].id == ReclamationBatch.${rb}.output_polymer_lot_id"
            - "data[0].received_kg == 1562.172 and data[0].available_kg == 1562.172"
            - "data[0].recycled_content_pct == 100.00 and data[0].segregated == true and data[0].reclaim_source == POST_CONSUMER"
            - "data[0].status == AVAILABLE"

      - name: loop_pile_face_weight_uses_the_loop_pile_allowance
        claim_type: correct_result
        grounds:
          - calculations.face_weight_per_square_yard
          - state_machines.ProductionRun.TUFTING_to_GREIGE
          - entities.CarpetStyle.fields.pile_construction
        distinguishing_aspect: |
          Identical gauge, stitch rate, pile height, denier and plies as the CUT-pile canonical case,
          but pile_construction LOOP swaps CUT_PILE_ALLOWANCE_IN 0.06 for LOOP_PILE_ALLOWANCE_IN 0.12
          and moves face_weight_oz_per_sy from 32.04 to 34.83 — the branch is worth 2.79 oz, and the
          run passes the 1.6-oz gate only because the style's target is 35.00.
        test_recipe:
          setup:
            - "LOOP-pile solution-dyed style ST-LP-01 with target_face_weight_oz 35.00, gauge G_1_10, pile_height_mm 8.0, plies 3."
            - "FiberBatch FB-01 RELEASED with denier_actual 1200.0; run PR-01 loaded at stitch_rate_per_inch 10.0."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-LP-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "LOOP", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 35.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
          trigger:
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
          assert:
            - "HTTP 200"
            - "ProductionRun.${pr}.face_weight_oz_per_sy == 34.83"
            - "ProductionRun.${pr}.status == GREIGE"
            - "ProductionRun.${pr}.greige_yards == 400.0"
            - "FiberBatch.${fb}.status == CONSUMED and FiberBatch.${fb}.denier_actual == 1200.0"

      - name: denier_release_gate_is_inclusive_at_three_percent_deviation
        claim_type: constants_applied
        grounds:
          - calculations.denier_actual_from_throughput
          - validations[priority 17]
          - errors[ERR_DENIER_OUT_OF_TOLERANCE]
        distinguishing_aspect: |
          Two batches spun off the same lot against denier_target 1200.0: 7416.0 g/min gives exactly
          1236.0 denier (deviation exactly DENIER_TOLERANCE_FRACTION 0.03) and RELEASEs, while
          7422.0 g/min gives 1237.0 (deviation 0.030833) and is refused — the gate is inclusive and
          is evaluated on the rounded denier, not the raw quotient.
        test_recipe:
          setup:
            - "PolymerLot PL-N66-01 with received_kg 8000.000 so both 4000.000 kg draws fit."
            - "FiberBatch FB-A and FB-B both created with denier_target 1200.0 and filament_count 72."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 8000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-A", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fba: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-B", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fbb: $.data.id }
          trigger:
            - call: "POST /mill/fiber-batches/${fba}/extrude"
              payload: { throughput_g_per_min: 7416.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fba}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fbb}/extrude"
              payload: { throughput_g_per_min: 7422.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fbb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
          assert:
            - "FiberBatch.${fba}.denier_actual == 1236.0 and FiberBatch.${fba}.extruded_kg == 3860.000"
            - "the FB-A RELEASE returns HTTP 200 with FiberBatch.${fba}.status == RELEASED"
            - "FiberBatch.${fbb}.denier_actual == 1237.0"
            - "the FB-B RELEASE returns HTTP 422 with error.error_id == ERR_DENIER_OUT_OF_TOLERANCE"
            - "FiberBatch.${fbb}.status == SPUN"
            - "PolymerLot.${pl}.consumed_kg == 8000.000 and PolymerLot.${pl}.available_kg == 0.000 and PolymerLot.${pl}.status == DEPLETED"

      - name: product_test_verdict_thresholds_are_inclusive_in_both_directions
        claim_type: correct_result
        grounds:
          - calculations.product_test_verdict
          - entities.ProductTest.fields.verdict
          - endpoints[POST /mill/product-tests]
        distinguishing_aspect: |
          Five tests on one roll pin the comparison direction per test_type: WEAR_TARR 3.0 PASSes and
          2.9 FAILs (higher is better), STAIN_AATCC175 8.0 PASSes, and FLAMMABILITY_PILL 25.4 PASSes
          while 25.5 FAILs (lower is better) — all three boundaries inclusive.
        test_recipe:
          setup:
            - "BACKED solution-dyed run PR-01 with RollGood RG-01 at qa_status PENDING; the verdict does not depend on roll state."
          setup_api_calls:
