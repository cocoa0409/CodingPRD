              captures: { wh_rsh: $.data.id }
          trigger:
            - call: "POST /v1/warehouses/${wh_rsh}/resume"
              payload: {}
              as: PlatformOperator
          assert:
            - "VirtualWarehouse.${wh_rsh}.status == RUNNING driven by the operations role"
            - "the engineering role can also call it, which is the shared half of the same row"
            - "FinanceController calling the same endpoint returns ERR_FORBIDDEN_ROLE, which bounds the shared set from below"
      - name: share_admin_identity_is_account_backed
        claim_type: identity_binding
        grounds:
          - roles.ShareAdmin.identity
