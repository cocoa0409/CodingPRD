# =============================================================================
# SCAFFOLD.yaml — Vinyl Pressing & Physical Media Manufacturing (task 1650)
# §1.0–§1.7 only. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Vinyl Pressing & Physical Media Manufacturing (vinyl pressing plant): order intake with lacquer/plating & test pressing approval, press scheduling & capacity backlog, color/variant configuration & quantity minimums, jacket/insert printing coordination, quality reject rate & re-press decision, warehousing & distributor drop-ship, delay communication & release date risk, overrun/underrun policy

domain_name: vinyl-pressing
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation        # finite press-line hours, bath time, zone pallet capacity competed for, reserved, committed, released, waitlist-promoted
  secondary_archetype: workflow_orchestration # order pipeline with revision/repress loops and branching
  complexity_layers:
    - optimistic_concurrency    # OCC on PressOrder / Release / Customer version for superseding writes
    - cascading_side_effects    # approval / repress / cancellation cascades spanning 4+ entities
    - dual_variant_calculation  # quote-vs-final cost, optimistic-vs-conservative backlog, accrual-vs-statement storage
    - rate_threshold_triggers   # reject-rate tolerance, revision-round fees, cancellation-fee tiers
  entity_topology: graph        # PressSlot is a junction (PressOrder x PressLine); Invoice is self-referential; cross-aggregate FKs throughout
  state_machine_shape: cyclic   # repress loop QC_REVIEW->QUEUED, TP revision loop AWAITING_TP_APPROVAL->TOOLING, tooling FAILED->QUEUED; PressOrder additionally carries parallel dims (production_status x billing_status)
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties  # QC filer cannot decide own report; peer roles own distinct resource types
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# All money is integer cents. All slot/bath hours are integers 0..hours_per_day.
# Color families: BLACK and SOLID_COLOR share family "STANDARD"; SPLATTER and
# MARBLED share family "SPECIAL_EFFECT"; PICTURE_DISC is family "PICTURE".
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Label or distributor name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit limit in cents; >= 0" }
      - { name: discount_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | SILVER | GOLD | PLATINUM; discount pct 0/3/5/8", constraints: "enum: STANDARD, SILVER, GOLD, PLATINUM" }
      - { name: overrun_policy, type: enum, source: input, default: ACCEPT_AND_BILL_10, description: "Default overrun billing policy for orders", constraints: "enum: EXACT_ONLY, ACCEPT_AND_BILL_10, ACCEPT_ALL_AND_BILL" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED (credit hold)", constraints: "enum: ACTIVE, SUSPENDED" }
      - { name: trailing_billed_cents, type: integer, source: system, default: 0, description: "Sum of net_cents of all ISSUED/PARTIALLY_PAID/PAID invoices of this customer; drives tier for FUTURE quotes only (see rebate_tier_evaluation)" }

  - name: Release
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning label" }
      - { name: catalog_number, type: string, source: input, description: "Catalog number, unique per customer", constraints: "unique within customer_id" }
      - { name: title, type: string, source: input, description: "Release title" }
      - { name: format, type: enum, source: input, description: "LP | EP | SINGLE_7; drives UNITS_PER_PALLET (100/150/300)", constraints: "enum: LP, EP, SINGLE_7" }
      - { name: weight_gram, type: integer, source: input, description: "Vinyl weight; 140 or 180", constraints: "enum as integer: 140, 180" }
      - { name: release_date, type: string, source: input, description: "Street date ISO yyyy-mm-dd" }
      - { name: status, type: enum, source: system, default: SETUP, description: "SETUP -> IN_PRODUCTION -> FULFILLED (compound of orders)", constraints: "enum: SETUP, IN_PRODUCTION, FULFILLED" }
      - { name: risk_level, type: enum, source: computed, default: ON_TRACK, description: "ON_TRACK | AT_RISK | LATE per release_risk_eval", constraints: "enum: ON_TRACK, AT_RISK, LATE" }
      - { name: projected_completion_date, type: string, source: computed, description: "Latest projected completion across its orders (see release_risk_eval)" }
      - { name: slack_days, type: integer, source: computed, description: "release_date minus projected_completion_date in whole days (negative = late)" }

  - name: PressOrder
    parent: null
    common_fields: true
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> Release.id" }
      - { name: quantity_ordered, type: integer, source: input, description: "Ordered units; >= ORDER_MIN_UNITS (100)" }
      - { name: sides, type: integer, source: input, default: 2, description: "Record sides; 1 or 2", constraints: "enum as integer: 1, 2" }
      - { name: plating_route, type: enum, source: input, default: TWO_STEP, description: "TWO_STEP | THREE_STEP (informational; stamper math identical)", constraints: "enum: TWO_STEP, THREE_STEP" }
      - { name: overrun_policy, type: enum, source: input, default: null, description: "Optional per-order override; null inherits Customer.overrun_policy at invoice time", constraints: "enum: EXACT_ONLY, ACCEPT_AND_BILL_10, ACCEPT_ALL_AND_BILL, or null" }
      - { name: variants, type: array, source: input, description: "Array of {color_config, quantity}; quantities sum to quantity_ordered; each meets its per-config minimum (BLACK 1, SOLID_COLOR 100, SPLATTER 100, MARBLED 100, PICTURE_DISC 200)" }
      - { name: requested_completion_date, type: string, source: input, default: null, description: "Optional requested completion yyyy-mm-dd; if present must be >= today + 21 days (MIN_LEAD_DAYS)" }
      - { name: production_status, type: enum, source: system, default: DRAFT, description: "DRAFT -> QUOTED -> CONFIRMED -> TOOLING -> AWAITING_TP_APPROVAL -> QUEUED -> SCHEDULED -> PRESSING -> QC_REVIEW -> COMPLETED; loops AWAITING_TP_APPROVAL->TOOLING and QC_REVIEW->QUEUED; CANCELLED from any pre-PRESSING state", constraints: "enum: DRAFT, QUOTED, CONFIRMED, TOOLING, AWAITING_TP_APPROVAL, QUEUED, SCHEDULED, PRESSING, QC_REVIEW, COMPLETED, CANCELLED" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "Parallel dimension: UNBILLED -> INVOICED -> PARTIALLY_PAID -> PAID | CREDIT_CLOSED", constraints: "enum: UNBILLED, INVOICED, PARTIALLY_PAID, PAID, CREDIT_CLOSED" }
      - { name: discount_pct_snapshot, type: number, source: system, default: 0, description: "Discount pct captured at quote time from Customer.discount_tier (ACTIVE customers only); drives all invoice line discounts" }
      - { name: tolerance_pct, type: number, source: computed, description: "QC reject tolerance = minimum tolerance across variants (strictest): BLACK 5.0, SOLID_COLOR 6.0, SPLATTER 8.0, MARBLED 8.0, PICTURE_DISC 12.0" }
      - { name: color_family, type: enum, source: computed, description: "Family of the largest-quantity variant (ties: first variant in array): STANDARD | SPECIAL_EFFECT | PICTURE; drives slot changeover buffer", constraints: "enum: STANDARD, SPECIAL_EFFECT, PICTURE" }
      - { name: intake_seq, type: integer, source: system, description: "Monotonic per-plant intake sequence assigned at creation (1,2,3,...); waitlist tie-break after tier weight and created_at" }
      - { name: quote_pressing_cents, type: integer, source: computed, default: 0, description: "Quoted marginal-tier pressing component" }
      - { name: quote_surcharge_cents, type: integer, source: computed, default: 0, description: "Quoted variant+weight surcharge component" }
      - { name: quote_tooling_cents, type: integer, source: computed, default: 0, description: "Quoted lacquer+stamper tooling component" }
      - { name: quote_setup_cents, type: integer, source: computed, default: 0, description: "Quoted setup component" }
      - { name: quote_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of the four quote components" }
      - { name: quote_discount_cents, type: integer, source: computed, default: 0, description: "round_half_up(quote_subtotal_cents x discount_pct_snapshot)" }
      - { name: quote_total_cents, type: integer, source: computed, default: 0, description: "quote_subtotal_cents - quote_discount_cents" }
      - { name: tp_round, type: integer, source: system, default: 0, description: "Test-pressing rounds produced; rounds beyond 1 each cost TP_REVISION_FEE_CENTS on the invoice" }
      - { name: repress_round, type: integer, source: system, default: 0, description: "Number of REPRESS decisions taken" }
      - { name: repress_fault, type: enum, source: system, default: NONE, description: "Fault of latest repress decision: NONE | PLANT | CUSTOMER", constraints: "enum: NONE, PLANT, CUSTOMER" }
      - { name: pressed_units_total, type: integer, source: system, default: 0, description: "Cumulative units_pressed across DECIDED QC reports" }
      - { name: rejected_units_total, type: integer, source: system, default: 0, description: "Cumulative units_rejected across DECIDED QC reports" }
      - { name: accepted_units, type: integer, source: system, default: 0, description: "Cumulative good units (pressed - rejected) across ACCEPT-decided QC reports" }
      - { name: cancel_fee_cents, type: integer, source: computed, default: 0, description: "Cancellation fee per cancellation_fee calculation" }

  - name: ToolingJob
    parent: null
    common_fields: true
    fields:
      - { name: press_order_id, type: string, source: system, description: "FK -> PressOrder.id" }
      - { name: round_number, type: integer, source: system, description: "Tooling round for the order (1 = initial; +1 per TP revision)" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED -> CUTTING -> AWAITING_BATH -> PLATING -> STAMPER_READY; FAILED auto-requeues to QUEUED while attempt_count < 3; STAMPER_READY -> SUPERSEDED on revision; CANCELLED on order cancel", constraints: "enum: QUEUED, CUTTING, AWAITING_BATH, PLATING, STAMPER_READY, FAILED, SUPERSEDED, CANCELLED" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Number of MARK_FAILED events; auto-requeue only while attempt_count < 3" }
      - { name: plating_bath_id, type: string, source: system, default: null, description: "FK -> PlatingBath.id; set at START_PLATING" }
      - { name: plating_start, type: integer, source: system, default: null, description: "Bath booking start hour (closed interval)" }
      - { name: plating_end, type: integer, source: system, default: null, description: "Bath booking end hour (closed interval)" }
      - { name: defect_note, type: string, source: system, default: null, description: "Failure note from MARK_FAILED" }

  - name: TestPressing
    parent: null
    common_fields: true
    fields:
      - { name: press_order_id, type: string, source: system, description: "FK -> PressOrder.id" }
      - { name: round_number, type: integer, source: system, description: "Equals PressOrder.tp_round at creation" }
      - { name: quantity, type: integer, source: input, description: "Test pressing copies produced (1..20)" }
      - { name: status, type: enum, source: system, default: PRODUCED, description: "PRODUCED -> UNDER_REVIEW -> APPROVED | REVISION_REQUESTED -> SUPERSEDED", constraints: "enum: PRODUCED, UNDER_REVIEW, APPROVED, REVISION_REQUESTED, SUPERSEDED" }
      - { name: decision_notes, type: string, source: system, default: null, description: "Customer notes captured at review" }

  - name: PrintJob
    parent: null
    common_fields: true
    fields:
      - { name: press_order_id, type: string, source: system, description: "FK -> PressOrder.id" }
      - { name: component, type: enum, source: input, description: "JACKET | INNER_SLEEVE | INSERT | LABEL", constraints: "enum: JACKET, INNER_SLEEVE, INSERT, LABEL" }
      - { name: quantity, type: integer, source: input, description: "Print run quantity; must be >= quantity_ordered of the parent order" }
      - { name: printer_name, type: string, source: input, description: "External printer vendor name" }
      - { name: due_date, type: string, source: input, description: "Printer committed delivery date yyyy-mm-dd" }
      - { name: proof_round, type: integer, source: system, default: 0, description: "Number of REQUEST_CHANGES proof rejections" }
      - { name: status, type: enum, source: system, default: CREATED, description: "CREATED -> AT_PRINTER -> PROOF_REVIEW -> PRINTING -> DELIVERED; PROOF_REVIEW -> AT_PRINTER loop on REQUEST_CHANGES; CANCELLED on order cancel", constraints: "enum: CREATED, AT_PRINTER, PROOF_REVIEW, PRINTING, DELIVERED, CANCELLED" }

  - name: PressLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line code", constraints: "unique" }
      - { name: tonnage_class, type: enum, source: input, description: "STANDARD | HEAVY", constraints: "enum: STANDARD, HEAVY" }
      - { name: hours_per_day, type: integer, source: input, description: "Bookable hours per day; slot hours are integers in [0, hours_per_day]" }
      - { name: daily_unit_capacity, type: integer, source: input, description: "Max planned units per line per calendar day; hourly_rate = ceil(daily_unit_capacity / hours_per_day) units/hour" }

  - name: PressSlot
    parent: null
    common_fields: true
    fields:
      - { name: press_line_id, type: string, source: system, description: "FK -> PressLine.id" }
      - { name: press_order_id, type: string, source: system, default: null, description: "FK -> PressOrder.id; null for MAINTENANCE slots" }
      - { name: slot_kind, type: enum, source: system, description: "PRODUCTION | MAINTENANCE", constraints: "enum: PRODUCTION, MAINTENANCE" }
      - { name: date, type: string, source: input, description: "Slot date yyyy-mm-dd" }
      - { name: start_hour, type: integer, source: input, description: "PRODUCTION slots: half-open [start_hour, end_hour); MAINTENANCE slots: closed [start_hour, end_hour] inclusive" }
      - { name: end_hour, type: integer, source: input, description: "See start_hour for interval semantics per slot_kind" }
      - { name: planned_units, type: integer, source: input, default: 0, description: "Planned units for PRODUCTION slots; 0 for MAINTENANCE" }
      - { name: color_family, type: string, source: system, default: null, description: "Copied from PressOrder.color_family for PRODUCTION slots; drives CHANGEOVER buffer rule" }
      - { name: freed, type: boolean, source: system, default: false, description: "True when the parent order was cancelled and the slot released (kept for audit; excluded from all capacity math)" }

  - name: PlatingBath
    parent: null
    common_fields: true
    fields:
      - { name: bath_code, type: string, source: input, description: "Unique bath code", constraints: "unique" }
      - { name: rinse_gap_minutes, type: integer, source: input, default: 30, description: "Mandatory rinse gap (in hour units for this model) after every booking regardless of job type" }

  - name: QCReport
    parent: null
    common_fields: true
    fields:
      - { name: press_order_id, type: string, source: system, description: "FK -> PressOrder.id" }
      - { name: units_pressed, type: integer, source: input, description: "Units pressed in this run; > 0" }
      - { name: units_rejected, type: integer, source: input, description: "Units rejected in this run; 0 <= rejected <= pressed" }
      - { name: reject_rate_pct, type: number, source: computed, description: "round_half_up(100.0 x units_rejected / units_pressed, 2 decimals)" }
      - { name: tolerance_pct_snapshot, type: number, source: system, description: "PressOrder.tolerance_pct at filing time" }
      - { name: outcome, type: enum, source: computed, description: "HOLD iff reject_rate_pct > tolerance_pct_snapshot (strictly greater); else PASS", constraints: "enum: PASS, HOLD" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED -> DECIDED", constraints: "enum: FILED, DECIDED" }
      - { name: decision, type: enum, source: system, default: NONE, description: "NONE | ACCEPT | REPRESS", constraints: "enum: NONE, ACCEPT, REPRESS" }
      - { name: fault, type: enum, source: system, default: NONE, description: "NONE | PLANT | CUSTOMER; required when decision = REPRESS", constraints: "enum: NONE, PLANT, CUSTOMER" }
      - { name: filed_by, type: string, source: system, description: "X-User-ID of the filing QaInspector (segregation-of-duties anchor)" }
      - { name: decided_by, type: string, source: system, default: null, description: "X-User-ID of the deciding ProductionManager" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> Release.id" }
      - { name: zone, type: enum, source: input, description: "Warehouse zone A | B | C; daily receiving capacities 40 / 25 / 15 pallets", constraints: "enum: A, B, C" }
      - { name: receipt_seq, type: integer, source: system, description: "Monotonic per-release receipt sequence (1,2,3,...); FIFO allocation tie-break after created_at" }
      - { name: on_hand_units, type: integer, source: system, default: 0, description: "Unallocated good units physically present" }
      - { name: allocated_units, type: integer, source: system, default: 0, description: "Units reserved by ALLOCATED/PICKED shipments" }
      - { name: shipped_units_cum, type: integer, source: system, default: 0, description: "Cumulative shipped units" }
      - { name: damaged_units_cum, type: integer, source: system, default: 0, description: "Cumulative damage write-offs" }
      - { name: received_units_cum, type: integer, source: system, default: 0, description: "Cumulative received units; invariant anchor: received == on_hand + allocated + shipped + damaged" }
      - { name: storage_daily_accrual_cents, type: integer, source: computed, default: 0, description: "storage_fee daily-accrual variant over the trailing 30 days ending at the logical clock" }
      - { name: storage_monthly_statement_cents, type: integer, source: computed, default: 0, description: "storage_fee monthly-statement variant (with monthly minimum) over the same window" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> Release.id" }
      - { name: distributor_customer_id, type: string, source: input, description: "FK -> Customer.id; the receiving distributor account" }
      - { name: quantity, type: integer, source: input, description: "Units to ship; > 0" }
      - { name: requested_ship_date, type: string, source: input, description: "Requested ship date yyyy-mm-dd (advisory)" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED -> ALLOCATED -> PICKED -> SHIPPED; CANCELLED from PLANNED | ALLOCATED", constraints: "enum: PLANNED, ALLOCATED, PICKED, SHIPPED, CANCELLED" }
      - { name: allocations, type: array, source: system, default: [], description: "Array of {lot_id, quantity} chosen by FIFO selector (lot created_at ASC, then receipt_seq ASC)" }

  - name: DelayNotice
    parent: null
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id" }
      - { name: press_order_id, type: string, source: system, description: "FK -> PressOrder.id of the order whose recompute worsened the risk" }
      - { name: cause, type: enum, source: system, description: "TP_REVISION | REPRESS | SCHEDULE | DATE_REVISION", constraints: "enum: TP_REVISION, REPRESS, SCHEDULE, DATE_REVISION" }
      - { name: prior_level, type: enum, source: system, description: "Risk level before the triggering recompute", constraints: "enum: ON_TRACK, AT_RISK, LATE" }
      - { name: new_level, type: enum, source: system, description: "Risk level after the triggering recompute (strictly worse than prior_level)", constraints: "enum: ON_TRACK, AT_RISK, LATE" }
      - { name: message, type: string, source: system, description: "Human-readable delay communication text" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: press_order_id, type: string, source: system, description: "FK -> PressOrder.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id (denormalized from Release)" }
      - { name: parent_invoice_id, type: string, source: system, default: null, description: "FK -> Invoice.id; set on CREDIT_MEMO rows (self-referential), null otherwise" }
      - { name: kind, type: enum, source: system, description: "STANDARD | CANCELLATION_FEE | CREDIT_MEMO", constraints: "enum: STANDARD, CANCELLATION_FEE, CREDIT_MEMO" }
      - { name: gross_cents, type: integer, source: system, default: 0, description: "Sum of line gross amounts (memos: amount credited)" }
      - { name: discount_cents, type: integer, source: system, default: 0, description: "Sum of per-line round_half_up(line_gross x discount_pct)" }
      - { name: net_cents, type: integer, source: system, default: 0, description: "gross_cents - discount_cents" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative payments" }
      - { name: credited_cents, type: integer, source: system, default: 0, description: "Cumulative CREDIT_MEMO amounts posted against this invoice" }
      - { name: lines, type: array, source: system, default: [], description: "Array of {label, gross_cents, discount_cents, net_cents}; rounding pinned per final_invoice_total" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED -> PARTIALLY_PAID -> PAID; ISSUED|PARTIALLY_PAID -> CREDITED when credited_cents == net_cents", constraints: "enum: ISSUED, PARTIALLY_PAID, PAID, CREDITED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PressOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    note: "Two parallel dimensions on one row: production_status (this machine) x billing_status (next machine). Loops: AWAITING_TP_APPROVAL->TOOLING (TP revision), QC_REVIEW->QUEUED (repress), QUOTED->QUOTED (requote supersede)."
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /press-orders/{id}/quotes"
        actor: CustomerServiceRep
        preconditions:
          - "variants valid: sum == quantity_ordered and every variant meets its color-config minimum (ERR_VARIANT_SUM_MISMATCH / ERR_VARIANT_BELOW_MINIMUM)"
        side_effects:
          - "Run press_quote_price: set quote_pressing_cents, quote_surcharge_cents, quote_tooling_cents, quote_setup_cents, quote_subtotal_cents, quote_discount_cents, quote_total_cents"
          - "Snapshot discount_pct_snapshot from Customer.discount_tier (0 if Customer.status == SUSPENDED)"
          - "increments PressOrder.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /press-orders/{id}/quotes (re-quote supersedes prior quote)"
        actor: CustomerServiceRep
        preconditions:
          - "expected_press_order_version == current PressOrder.version (OCC; ERR_STALE_VERSION)"
        side_effects:
          - "Recompute all quote_* fields and discount_pct_snapshot (supersedes prior quote)"
          - "increments PressOrder.version by 1"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /press-orders/{id}/confirm"
        actor: Customer
        preconditions:
          - "acting Customer id == Release.customer_id of the order's release"
          - "Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "expected_press_order_version == current version (ERR_STALE_VERSION)"
          - "credit_availability: outstanding_cents + quote_total_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Release.status SETUP -> IN_PRODUCTION (first confirm only)"
          - "increments PressOrder.version by 1 and Release.version by 1 on the SETUP->IN_PRODUCTION flip"
      - from: CONFIRMED
        to: TOOLING
        trigger: "POST /press-orders/{id}/start-tooling"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "Create ToolingJob(round_number = tp_round + 1, status QUEUED, attempt_count 0)"
          - "increments PressOrder.version by 1"
      - from: TOOLING
        to: AWAITING_TP_APPROVAL
        trigger: "POST /test-pressings/{id}/ship"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["increments PressOrder.version by 1"]
      - from: AWAITING_TP_APPROVAL
        to: TOOLING
        trigger: "POST /test-pressings/{id}/review with decision REQUEST_REVISION"
        actor: Customer
        preconditions: []
        side_effects:
          - "TestPressing -> REVISION_REQUESTED; supersede it when the next TestPressing is created"
          - "Latest ToolingJob -> SUPERSEDED; create new ToolingJob(round_number + 1, QUEUED) for the re-cut"
          - "release_risk_eval with TP_REVISION (+7 days); create DelayNotice if risk worsens"
          - "increments PressOrder.version by 1"
      - from: AWAITING_TP_APPROVAL
        to: QUEUED
        trigger: "POST /test-pressings/{id}/review with decision APPROVE"
        actor: Customer
        preconditions: []
        side_effects:
          - "TestPressing -> APPROVED"
          - "release_risk_eval (cause SCHEDULE); create DelayNotice if risk worsens"
          - "increments PressOrder.version by 1"
      - from: QUEUED
        to: SCHEDULED
        trigger: "POST /press-orders/{id}/schedule-commits (explicit or waitlist promotion)"
        actor: ProductionPlanner
        preconditions:
          - "expected_press_order_version == current version (ERR_STALE_VERSION) for the explicit endpoint"
          - "sum(slot.planned_units) >= quantity_ordered - accepted_units (remaining press requirement; supports repress top-up commits) (ERR_SLOT_UNITS_MISMATCH)"
          - "per slot: planned_units <= (end_hour - start_hour) x hourly_rate of the line where hourly_rate = ceil(daily_unit_capacity / hours_per_day) (ERR_SLOT_UNITS_MISMATCH)"
          - "slot_conflict_check: no overlap; CHANGEOVER_HOURS buffer between different color families; maintenance closed-interval conflict (ERR_SLOT_OVERLAP / ERR_CHANGEOVER_BUFFER_VIOLATION / ERR_MAINTENANCE_WINDOW_CONFLICT)"
          - "line_daily_capacity: sum of planned_units per line+date <= daily_unit_capacity (ERR_LINE_DAILY_CAPACITY_EXCEEDED)"
        side_effects:
          - "Create one PRODUCTION PressSlot per requested slot (color_family copied from order)"
          - "release_risk_eval (slots-based projection, cause SCHEDULE); DelayNotice if worsens"
          - "increments PressOrder.version by 1"
      - from: SCHEDULED
        to: PRESSING
        trigger: "POST /press-orders/{id}/production-events event=START_PRESSING"
        actor: PressOperator
        preconditions:
          - "logical clock date >= earliest slot date of the order (ERR_PRESS_DATE_NOT_REACHED)"
        side_effects: ["increments PressOrder.version by 1"]
      - from: PRESSING
        to: QC_REVIEW
        trigger: "POST /press-orders/{id}/production-events event=COMPLETE_PRESSING"
        actor: PressOperator
        preconditions: []
        side_effects: ["increments PressOrder.version by 1"]
      - from: QC_REVIEW
        to: COMPLETED
        trigger: "POST /qc-reports/{id}/decision decision=ACCEPT"
        actor: ProductionManager
        preconditions:
          - "report.outcome == PASS (ERR_QC_HOLD_REQUIRES_REPRESS when HOLD)"
          - "all non-CANCELLED PrintJobs of the order are DELIVERED (ERR_PRINT_JOBS_NOT_DELIVERED)"
        side_effects:
          - "order.accepted_units += report.units_pressed - report.units_rejected; pressed_units_total += units_pressed; rejected_units_total += units_rejected"
          - "Inventory credit: find-or-create InventoryLot(release_id, zone A) -> on_hand_units += accepted, received_units_cum += accepted, assign receipt_seq"
          - "Backorder sweep: PLANNED shipments of the release in created_at ASC order allocate while stock suffices (shipment_allocation); each promotion PLANNED -> ALLOCATED"
          - "release_risk_eval; Release.status -> FULFILLED when every order of the release is terminal"
          - "increments PressOrder.version by 1"
      - from: QC_REVIEW
        to: QUEUED
        trigger: "POST /qc-reports/{id}/decision decision=REPRESS"
        actor: ProductionManager
        preconditions:
          - "fault in {PLANT, CUSTOMER} required"
        side_effects:
          - "order.repress_round += 1; repress_fault = fault; pressed_units_total += units_pressed; rejected_units_total += units_rejected; accepted_units += (units_pressed - units_rejected) — good units are banked; the repress covers only the rejected shortfall"
          - "release_risk_eval with REPRESS (+10 days); DelayNotice if worsens"
          - "increments PressOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /press-orders/{id}/cancel"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: ["cancel_fee_cents = 0 (DRAFT/QUOTED free)", "increments PressOrder.version by 1"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /press-orders/{id}/cancel"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: ["cancel_fee_cents = 0", "increments PressOrder.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /press-orders/{id}/cancel"
        actor: CustomerServiceRep
        preconditions: []
        side_effects:
          - "cancel_fee_cents = round_half_up(quote_total_cents x 0.10); auto-create CANCELLATION_FEE Invoice (ISSUED)"
          - "Non-terminal ToolingJobs -> CANCELLED; non-terminal TestPressings -> SUPERSEDED; non-terminal PrintJobs -> CANCELLED"
          - "increments PressOrder.version by 1"
      - from: TOOLING
        to: CANCELLED
        trigger: "POST /press-orders/{id}/cancel"
        actor: CustomerServiceRep
        preconditions: []
        side_effects:
          - "cancel_fee_cents = round_half_up(quote_total_cents x 0.25); CANCELLATION_FEE invoice"
          - "Cascade children terminal (ToolingJobs CANCELLED, TestPressings SUPERSEDED, PrintJobs CANCELLED)"
          - "increments PressOrder.version by 1"
      - from: AWAITING_TP_APPROVAL
        to: CANCELLED
        trigger: "POST /press-orders/{id}/cancel"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: ["Same as TOOLING -> CANCELLED (25% fee tier)"]
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /press-orders/{id}/cancel"
        actor: CustomerServiceRep
        preconditions: []
        side_effects:
          - "cancel_fee_cents = round_half_up(quote_total_cents x 0.50); CANCELLATION_FEE invoice"
          - "Cascade children terminal"
          - "increments PressOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /press-orders/{id}/cancel"
        actor: CustomerServiceRep
        preconditions: []
        side_effects:
          - "cancel_fee_cents = round_half_up(quote_total_cents x 0.50); CANCELLATION_FEE invoice"
          - "Free the order's PRODUCTION slots (freed = true)"
          - "Waitlist promotion waterfall over freed windows (waitlist_promotion): promoted orders QUEUED -> SCHEDULED with new slots; release_risk_eval for each promoted order (cause SCHEDULE)"
          - "Cascade children terminal"
          - "increments PressOrder.version by 1"

  - entity: PressOrder
    initial_state: UNBILLED
    terminal_states: [PAID, CREDIT_CLOSED]
    note: "billing_status dimension — parallel to production_status on the same row; moved only by invoice/payment/memo events"
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /press-orders/{id}/invoices (STANDARD) or cancellation auto-invoice (CANCELLATION_FEE)"
        actor: BillingClerk
        preconditions: ["STANDARD invoice requires production_status == COMPLETED (ERR_INVOICE_INVALID_STATE)"]
        side_effects: ["increments PressOrder.version by 1"]
      - from: INVOICED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments with amount < remaining balance"
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: INVOICED
        to: PAID
        trigger: "POST /invoices/{id}/payments completing the balance"
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{id}/payments completing the balance"
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: INVOICED
        to: CREDIT_CLOSED
        trigger: "POST /invoices/{id}/credit-memos covering the full remaining balance"
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: CREDIT_CLOSED
        trigger: "POST /invoices/{id}/credit-memos covering the full remaining balance"
        actor: BillingClerk
        preconditions: []
        side_effects: []

  - entity: ToolingJob
    initial_state: QUEUED
    terminal_states: [STAMPER_READY, SUPERSEDED, CANCELLED]
    note: "STAMPER_READY is success-terminal for the job; revision supersedes the whole job row. Cyclic retry: FAILED -> QUEUED while attempt_count < 3."
    transitions:
      - from: QUEUED
        to: CUTTING
        trigger: "POST /tooling-jobs/{id}/advance event=START_CUT"
        actor: PressOperator
        preconditions: []
        side_effects: ["increments ToolingJob.version by 1"]
      - from: CUTTING
        to: AWAITING_BATH
        trigger: "POST /tooling-jobs/{id}/advance event=CUT_DONE"
        actor: PressOperator
        preconditions: []
        side_effects: ["increments ToolingJob.version by 1"]
      - from: AWAITING_BATH
        to: PLATING
        trigger: "POST /tooling-jobs/{id}/advance event=START_PLATING"
        actor: PressOperator
        preconditions:
          - "plating_bath_id exists (ERR_PLATING_BATH_NOT_FOUND)"
          - "bath_booking_check: closed-interval overlap -> ERR_BATH_TIME_CONFLICT; rinse gap -> ERR_BATH_RINSE_GAP_VIOLATION"
        side_effects:
          - "Set plating_bath_id, plating_start, plating_end"
          - "increments ToolingJob.version by 1"
      - from: PLATING
        to: STAMPER_READY
        trigger: "POST /tooling-jobs/{id}/advance event=PLATING_DONE"
        actor: PressOperator
        preconditions: []
        side_effects: ["increments ToolingJob.version by 1"]
      - from: CUTTING
        to: FAILED
        trigger: "POST /tooling-jobs/{id}/advance event=MARK_FAILED"
        actor: PressOperator
        preconditions: []
        side_effects:
          - "attempt_count += 1; defect_note recorded"
          - "if attempt_count < 3: auto-transition FAILED -> QUEUED (retry loop)"
      - from: PLATING
        to: FAILED
        trigger: "POST /tooling-jobs/{id}/advance event=MARK_FAILED"
        actor: PressOperator
        preconditions: []
        side_effects: ["attempt_count += 1; bath booking released (plating_* cleared)", "if attempt_count < 3: auto-transition FAILED -> QUEUED"]
      - from: STAMPER_READY
        to: SUPERSEDED
        trigger: "system (TP revision requests a re-cut)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUEUED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CUTTING
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_BATH
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLATING
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TestPressing
    initial_state: PRODUCED
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: PRODUCED
        to: UNDER_REVIEW
        trigger: "POST /test-pressings/{id}/ship"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["PressOrder TOOLING -> AWAITING_TP_APPROVAL"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /test-pressings/{id}/review decision=APPROVE"
        actor: Customer
        preconditions: ["acting Customer owns the parent order's release"]
        side_effects: ["PressOrder AWAITING_TP_APPROVAL -> QUEUED (cascade C1 root)"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /test-pressings/{id}/review decision=REQUEST_REVISION"
        actor: Customer
        preconditions: ["acting Customer owns the parent order's release"]
        side_effects: ["PressOrder AWAITING_TP_APPROVAL -> TOOLING; ToolingJob supersede + re-cut; risk recompute (+7 days)"]
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system (next TestPressing created for the order)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRODUCED
        to: SUPERSEDED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrintJob
    initial_state: CREATED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Cyclic proof loop: PROOF_REVIEW -> AT_PRINTER on REQUEST_CHANGES (proof_round += 1)."
    transitions:
      - from: CREATED
        to: AT_PRINTER
        trigger: "POST /print-jobs/{id}/advance event=DISPATCH"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: []
      - from: AT_PRINTER
        to: PROOF_REVIEW
        trigger: "POST /print-jobs/{id}/advance event=PROOFS_IN"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: []
      - from: PROOF_REVIEW
        to: PRINTING
        trigger: "POST /print-jobs/{id}/proof-decision decision=APPROVE"
        actor: Customer
        preconditions: ["acting Customer owns the parent order's release"]
        side_effects: []
      - from: PROOF_REVIEW
        to: AT_PRINTER
        trigger: "POST /print-jobs/{id}/proof-decision decision=REQUEST_CHANGES"
        actor: Customer
        preconditions: ["acting Customer owns the parent order's release"]
        side_effects: ["proof_round += 1", "release_risk_eval with cause SCHEDULE (print due re-check); DelayNotice if worsens"]
      - from: PRINTING
        to: DELIVERED
        trigger: "POST /print-jobs/{id}/advance event=DELIVER"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: []
      - from: CREATED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_PRINTER
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROOF_REVIEW
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: QCReport
    initial_state: FILED
    terminal_states: [DECIDED]
    transitions:
      - from: FILED
        to: DECIDED
        trigger: "POST /qc-reports/{id}/decision"
        actor: ProductionManager
        preconditions:
          - "decided_by != filed_by (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
          - "decision == ACCEPT requires outcome == PASS (ERR_QC_HOLD_REQUIRES_REPRESS)"
          - "decision == REPRESS requires fault in {PLANT, CUSTOMER}"
        side_effects:
          - "ACCEPT: PressOrder QC_REVIEW -> COMPLETED chain (see PressOrder)"
          - "REPRESS: PressOrder QC_REVIEW -> QUEUED chain (see PressOrder)"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ALLOCATED
        trigger: "system (creation-time allocation when stock suffices, or backorder sweep on receipt)"
        actor: system
        preconditions: ["total available across the release's lots >= quantity (all-or-nothing at allocation time)"]
        side_effects: ["allocations[] built FIFO (lot created_at ASC, receipt_seq ASC); lots: on_hand -= q, allocated += q"]
      - from: PLANNED
        to: ALLOCATED
        trigger: "POST /shipments (create with sufficient stock lands directly in ALLOCATED)"
        actor: CustomerServiceRep
        preconditions: ["distributor Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"]
        side_effects: ["same allocation side effects"]
      - from: ALLOCATED
        to: PICKED
        trigger: "POST /shipments/{id}/advance"
        actor: WarehouseManager
        preconditions: []
        side_effects: []
      - from: PICKED
        to: SHIPPED
        trigger: "POST /shipments/{id}/advance"
        actor: WarehouseManager
        preconditions: []
        side_effects: ["lots: allocated -= q, shipped_units_cum += q"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: CustomerServiceRep
        preconditions: []
        side_effects: ["Deallocate: lots on_hand += q, allocated -= q (compensation)", "Backorder sweep for the release (created_at ASC)"]

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, CREDITED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments with amount_cents < net_cents - paid_cents - credited_cents"
        actor: BillingClerk
        preconditions: []
        side_effects: ["paid_cents += amount_cents", "PressOrder billing_status INVOICED -> PARTIALLY_PAID"]
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/payments with amount_cents == net_cents - credited_cents"
        actor: BillingClerk
        preconditions: []
        side_effects: ["PressOrder billing_status -> PAID"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{id}/payments completing balance"
        actor: BillingClerk
        preconditions: []
        side_effects: ["PressOrder billing_status -> PAID"]
      - from: ISSUED
        to: CREDITED
        trigger: "POST /invoices/{id}/credit-memos with amount covering full net"
        actor: BillingClerk
        preconditions: ["memo amount <= net_cents - credited_cents - paid_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"]
        side_effects: ["parent.credited_cents += amount", "PressOrder billing_status -> CREDIT_CLOSED", "creates CREDIT_MEMO Invoice row (parent_invoice_id = this invoice)"]
      - from: PARTIALLY_PAID
        to: CREDITED
        trigger: "POST /invoices/{id}/credit-memos covering remainder"
        actor: BillingClerk
        preconditions: ["memo amount <= net_cents - credited_cents - paid_cents"]
        side_effects: ["same as ISSUED -> CREDITED"]

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{id}/credit-status action=SUSPEND"
        actor: BillingClerk
        preconditions: []
        side_effects: ["increments Customer.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customers/{id}/credit-status action=REINSTATE"
        actor: BillingClerk
        preconditions: []
        side_effects: ["increments Customer.version by 1"]

  - entity: Release
    initial_state: SETUP
    terminal_states: [FULFILLED]
    transitions:
      - from: SETUP
        to: IN_PRODUCTION
        trigger: "system (first PressOrder confirm)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "system (all PressOrders of the release terminal: COMPLETED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; true races only)
# =============================================================================
concurrency_rules:
  - rule_id: order-requote-stale-version
    parent_entity: PressOrder
    write_endpoint: "POST /press-orders/{id}/quotes"
    occ_field: expected_press_order_version
    description: |
      Re-quoting a PressOrder legitimately supersedes the prior quote while the
      order stays in QUOTED, so a second sequential re-quote carries no state
      precondition to stop it. A re-quote whose expected_press_order_version is
      behind the order's current version is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: release-date-revision-stale-version
    parent_entity: Release
    write_endpoint: "POST /releases/{id}/date-revisions"
    occ_field: expected_release_version
    description: |
      Revising a release date supersedes the prior date and is always permitted
      while the release is not FULFILLED, so sequential revisers observe no
      state change. A revision carrying an expected_release_version behind the
      release's current version (advanced by prior revisions or by the
      SETUP -> IN_PRODUCTION cascade) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: customer-credit-revision-stale-version
    parent_entity: Customer
    write_endpoint: "POST /customers/{id}/credit-limit-revisions"
    occ_field: expected_customer_version
    description: |
      Revising a credit limit supersedes the prior limit and is always
      permitted for an existing customer, so sequential revisers observe no
      state change. A revision carrying an expected_customer_version behind the
      customer's current version (advanced by prior revisions or by
      credit-status transitions) is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: press_quote_price
    trigger: "POST /press-orders/{id}/quotes (initial quote and every re-quote)"
    algorithm: tiered_pricing
    formula: |
      Inputs: quantity_ordered Q, variants[] (color_config, quantity), weight_gram W,
              sides S, customer tier pct p (0 if customer SUSPENDED at quote time).
      1. pressing_cents = MARGINAL tier sum over Q:
           first 299 units @ 320, next 700 (units 300..999) @ 275,
           next 4000 (units 1000..4999) @ 240, remainder (5000+) @ 210.
      2. surcharge_cents = sum over variants v of
           max(qty_v * VARIANT_SURCHARGE[cfg_v], MIN_VARIANT_SURCHARGE if cfg_v != BLACK else qty_v * 0)
           + Q * WEIGHT_SURCHARGE[W].
         (BLACK never incurs the minimum-charge floor; non-BLACK variant lines are
          charged at least MIN_VARIANT_SURCHARGE = 5000 cents.)
      3. tooling_cents = S * LACQUER_PER_SIDE + ceil(Q / STAMPER_LIFE) * S * STAMPER_FEE.
      4. setup_cents = SETUP_ORDER + SETUP_PER_NONBLACK_VARIANT * count(variants with cfg != BLACK).
      5. subtotal = pressing + surcharge + tooling + setup.
      6. discount = round_half_up(subtotal * p); total = subtotal - discount.
    input_set: "The PressOrder being quoted; its Release's weight_gram; its Customer tier/status at quote time"
    constants:
      TIER1_LIMIT: 299
      TIER1_RATE: 320
      TIER2_LIMIT: 999
      TIER2_RATE: 275
      TIER3_LIMIT: 4999
      TIER3_RATE: 240
      TIER4_RATE: 210
      VARIANT_SURCHARGE: { BLACK: 0, SOLID_COLOR: 35, SPLATTER: 55, MARBLED: 65, PICTURE_DISC: 120 }
      MIN_VARIANT_SURCHARGE: 5000
      WEIGHT_SURCHARGE: { 140: 0, 180: 25 }
      LACQUER_PER_SIDE: 17500
      STAMPER_FEE: 30000
      STAMPER_LIFE: 1000
      SETUP_ORDER: 40000
      SETUP_PER_NONBLACK_VARIANT: 15000
      TIER_PCT: { STANDARD: 0, SILVER: 0.03, GOLD: 0.05, PLATINUM: 0.08 }
    precision: "integer cents; round_half_up for the discount multiplication"
    note: "Combinatorial mode (a): >=3 inputs (Q, variants, W, S, tier/status) with tiered-rate selection, nested max() floors, and a conditional branch on Customer.status."

  - name: final_invoice_total
    trigger: "POST /press-orders/{id}/invoices (order must be COMPLETED)"
    algorithm: chronological
    formula: |
      Inputs: order (accepted_units A, quantity_ordered Q, overrun policy P,
              discount_pct_snapshot p, quote_tooling_cents, tp_round, repress_round,
              repress_fault, dominant-variant surcharge s_dom, weight surcharge w).
      1. billed_units B per overrun_billing_units (see that rule).
      2. pressing_gross = marginal tier sum over B (same tier table as quote).
      3. surcharge_gross = B * (s_dom + w) where s_dom is the surcharge of the
         largest-quantity variant (ties: first variant in the array).
      4. tooling_gross = quote_tooling_cents
           + (repress_round * sides * STAMPER_FEE if repress_fault == CUSTOMER else 0).
      5. setup_gross = quote_setup_cents.
      6. tp_revision_gross = max(0, tp_round - 1) * TP_REVISION_FEE.
      7. underrun: if A < floor(0.9 * Q): shortfall = floor(0.9*Q) - A;
         underrun_gross = - round_half_up(shortfall * pressing_gross / B)  (B > 0).
      8. repress adjustment: fault PLANT -> - (repress_round * REPRESS_FLAT);
         fault CUSTOMER -> + (repress_round * REPRESS_FLAT); NONE -> 0.
      9. PINNED ROUNDING ORDER (mode b): for EACH line L in the order
         [pressing, surcharge, tooling, setup, tp_revision, underrun, repress]:
           line_discount_L = round_half_up(gross_L * p)   (per line, not on the sum)
           line_net_L = gross_L - line_discount_L
         net_cents = sum of line_net_L. Computing discount once on the grand total
         is a DIFFERENT (wrong) algorithm and yields different cents.
      10. gross_cents = sum of line gross; discount_cents = sum of line discounts.
    input_set: "The COMPLETED PressOrder, its DECIDED QC reports (already accumulated into accepted_units), its Customer (for policy inheritance when order.overrun_policy is null)"
    constants:
      TP_REVISION_FEE: 45000
      REPRESS_FLAT: 150000
    precision: "integer cents; round_half_up at every pinned rounding point"
    variants:
      - name: provisional_vs_final
        when: "quote at DRAFT vs invoice at COMPLETED"
        difference: "Quote prices quantity_ordered with zero rejects and quoted tooling; the final invoice prices billed_units under the overrun policy with actual tp_round/repress_round/repress_fault and underrun credit — identical order data yields different totals."

  - name: overrun_billing_units
    trigger: "inside final_invoice_total step 1"
    algorithm: threshold
    formula: |
      P = order.overrun_policy if set else customer.overrun_policy.
      EXACT_ONLY:          B = min(A, Q)
      ACCEPT_AND_BILL_10:  cap = floor(Q * 1.10); B = min(A, cap)
      ACCEPT_ALL_AND_BILL: B = A
      Overrun beyond cap (EXACT_ONLY / ACCEPT_AND_BILL_10) is neither billed nor
      shipped-invoiced; it stays in the inventory lot.
    constants:
      OVERRUN_PCT: 0.10
      UNDERRUN_PCT: 0.10

  - name: rebate_tier_evaluation
    trigger: "quote time (read) and invoice issuance (post)"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency pinned to a strict evaluation order:
      tier(pct) -> discount -> invoice net -> trailing_billed_cents -> tier.
      Order of evaluation:
        1. At quote: read Customer.discount_tier and Customer.status NOW;
           snapshot pct onto the order (SUSPENDED customers get 0).
        2. At invoice issuance: compute lines with the SNAPSHOT pct (never the
           customer's current tier).
        3. AFTER the invoice is issued: Customer.trailing_billed_cents += net_cents.
        4. trailing_billed_cents influences only FUTURE tier assignments made by
           staff (credit-limit revisions); it NEVER re-rates an existing quote or
           invoice. No retroactive recomputation.
    input_set: "Customer row, PressOrder quote snapshot, issued Invoice rows"
    note: "Combinatorial mode (c): evaluation order pinned so the value is well-defined."

  - name: reject_rate_eval
    trigger: "POST /press-orders/{id}/qc-reports"
    algorithm: threshold
    formula: |
      reject_rate_pct = round_half_up(100.0 * units_rejected / units_pressed, 2)
      tolerance = min over variants of TOLERANCE[cfg]   (strictest variant governs)
      outcome = HOLD iff reject_rate_pct > tolerance    (strictly greater; equal passes)
    constants:
      TOLERANCE: { BLACK: 5.0, SOLID_COLOR: 6.0, SPLATTER: 8.0, MARBLED: 8.0, PICTURE_DISC: 12.0 }
    precision: "2 decimal places percent, round_half_up"

  - name: backlog_projection
    trigger: "GET /press-lines/{id}/backlog; also re-run internally whenever slots change"
    algorithm: forward_looking
    formula: |
      booked_hours = sum over the line's PRODUCTION slots with freed == false and
                     date >= today of (end_hour - start_hour)
                   + CHANGEOVER_HOURS per adjacent different-family pair on the same date.
      optimistic_days  = round_half_up(booked_hours / hours_per_day, 2)
      conservative_days = round_half_up((booked_hours * (1 + REPRESS_INFLATION)
                          + repress_queue_hours) / hours_per_day, 2)
        where repress_queue_hours = sum over orders of this line currently in
        QUEUED with repress_round >= 1 of ceil(quantity_ordered / hourly_rate).
    constants:
      REPRESS_INFLATION: 0.25
      CHANGEOVER_HOURS: 1
    precision: "2 decimal places days, round_half_up (decimal arithmetic, not binary float)"
    variants:
      - name: optimistic_vs_conservative
        when: "optimistic = customer-facing promise dates; conservative = internal risk"
        difference: "Conservative applies the 25% repress inflation AND adds the repress queue; identical slot data yields different backlog days. Entity domain: PressLine capacity (distinct from PressOrder cost dual-variant)."

  - name: release_risk_eval
    trigger: "TP approve / TP revision / schedule-commit / QC repress / date revision / order completion"
    algorithm: projection
    formula: |
      Per order projected completion:
        - SCHEDULED or later: max(slot.date) + 1 day
        - QUEUED (repress_round == 0): today + STAGE_LEAD[QUEUED]
        - QUEUED (repress_round >= 1): today + STAGE_LEAD[QUEUED] + REPRESS_DELAY_DAYS
        - TOOLING (after revision): today + STAGE_LEAD[TOOLING] + TP_REVISION_DELAY_DAYS * tp_revision_count
        - other pre-QUEUE states: today + STAGE_LEAD[state]
      Order completion also waits on print: projected = max(press_projection,
        max over non-CANCELLED PrintJobs of due_date + PRINT_TRANSIT_DAYS).
      Release projected_completion_date = max over non-terminal orders (null when none open).
      slack_days = release_date - projected_completion_date (whole days).
      risk_level: ON_TRACK iff slack_days >= BUFFER_DAYS (14);
                  AT_RISK iff 0 <= slack_days < 14;
                  LATE iff slack_days < 0.
      If risk_level worsens vs its previous value, append DelayNotice
      (cause = triggering event) — never on improvement.
    constants:
      STAGE_LEAD: { CONFIRMED: 45, TOOLING: 35, AWAITING_TP_APPROVAL: 28, QUEUED: 21, PRESSING: 3, QC_REVIEW: 2 }
      TP_REVISION_DELAY_DAYS: 7
      REPRESS_DELAY_DAYS: 10
      PRINT_TRANSIT_DAYS: 3
      BUFFER_DAYS: 14
    precision: "whole days; date arithmetic on yyyy-mm-dd"

  - name: waitlist_promotion
    trigger: "POST /press-orders/{id}/cancel from SCHEDULED (frees slots)"
    algorithm: waterfall_allocation
    formula: |
      Freed windows = the cancelled order's PRODUCTION slots (line, date, hours, units).
      Candidate set: orders in QUEUED (any repress_round), excluding the cancelled one.
      Ranking: customer tier weight DESC (PLATINUM 40 > GOLD 30 > SILVER 20 > STANDARD 10),
               tie-break order created_at ASC, then intake_seq ASC. Never id.
      Waterfall: scan candidates in rank order; a candidate is promoted iff its
      required hours ceil(quantity_ordered / hourly_rate(line)) fit inside ONE freed
      window on that line (same date, window hours >= required). Promoted: create a
      PRODUCTION slot covering exactly the required hours starting at window start,
      shrink the freed remainder, candidate QUEUED -> SCHEDULED, then continue
      scanning with remaining windows. Empty candidate set or no fitting window:
      capacity simply returns to free (no error).
    input_set: "freed slots; all QUEUED PressOrders; their Customers"
    note: "Selector determinism: eligibility filter + ranking expression + two tie-breaks + empty-pool fallback, all pinned."

  - name: shipment_allocation
    trigger: "POST /shipments; backorder sweep on receipt / deallocation"
    algorithm: waterfall_allocation
    formula: |
      available(lot) = on_hand_units.
      Candidate lots: release_id == shipment.release_id AND available > 0.
      Order: created_at ASC, then receipt_seq ASC. Never id.
      All-or-nothing at creation: if sum(available) < quantity -> stay PLANNED,
      allocations = []. Else allocate FIFO across lots (may split), -> ALLOCATED.
      Sweep (on RECEIVE or deallocate): PLANNED shipments of the release in
      created_at ASC; allocate each while it fully fits; skip (do not block) ones
      that do not fit and continue scanning.
    input_set: "InventoryLots of the release; PLANNED shipments of the release"

  - name: slot_conflict_check
    trigger: "POST /press-orders/{id}/schedule-commits; POST /press-lines/{id}/maintenance-windows"
    algorithm: interval_merge
    formula: |
      PRODUCTION slots on the same line+date are half-open [start_hour, end_hour):
        overlap iff a.start < b.end AND b.start < a.end            -> ERR_SLOT_OVERLAP
        back-to-back (a.end == b.start) allowed ONLY when
          a.color_family == b.color_family; otherwise require
          b.start >= a.end + CHANGEOVER_HOURS (and symmetrically)
          -> ERR_CHANGEOVER_BUFFER_VIOLATION
      MAINTENANCE slots are closed [start_hour, end_hour] inclusive:
        production p conflicts with maintenance m iff
          p.start <= m.end AND m.start < p.end                     -> ERR_MAINTENANCE_WINDOW_CONFLICT
        (touching a maintenance endpoint counts as conflict, unlike production adjacency)
      All slot hours must satisfy 0 <= start < end <= hours_per_day for PRODUCTION,
      0 <= start <= end < hours_per_day for MAINTENANCE (ERR_INVALID_REQUEST otherwise).
    constants:
      CHANGEOVER_HOURS: 1
    note: "Interval semantics #1: half-open with a CONDITIONAL buffer (color-family-dependent)."

  - name: bath_booking_check
    trigger: "POST /tooling-jobs/{id}/advance event=START_PLATING"
    algorithm: interval_merge
    formula: |
      Bath bookings are CLOSED hour intervals [plating_start, plating_end] on one bath.
      For new booking N against every existing booking E on the same bath
      (jobs in PLATING state only):
        overlap:  N.start <= E.end AND E.start <= N.end   -> ERR_BATH_TIME_CONFLICT
        rinse:    else require N.start >= E.end + bath.rinse_gap_minutes
                  OR E.start >= N.end + bath.rinse_gap_minutes
                  -> ERR_BATH_RINSE_GAP_VIOLATION
      rinse_gap_minutes is in hour units in this model (default 30 -> 30 hours).
    note: "Interval semantics #2: closed intervals (touching endpoints conflict) PLUS an unconditional trailing rinse gap — distinct from slot semantics."

  - name: zone_receiving_check
    trigger: "POST /inventory-lots/{id}/stock-events event=RECEIVE"
    algorithm: aggregation
    formula: |
      pallets = ceil(quantity / UNITS_PER_PALLET[release.format])
      zone_day_pallets = sum of pallets of all RECEIVE events into lots of the same
                         zone with the same event_date
      require zone_day_pallets + pallets <= ZONE_DAILY_PALLETS[zone]
      else ERR_ZONE_RECEIVING_CAPACITY_EXCEEDED.
      Aggregate-per-day semantics: no intervals, no buffers — pure daily sum.
    constants:
      UNITS_PER_PALLET: { LP: 100, EP: 150, SINGLE_7: 300 }
      ZONE_DAILY_PALLETS: { A: 40, B: 25, C: 15 }
    note: "Interval semantics #3 (aggregate capacity): daily pallet budget per zone."

  - name: credit_availability
    trigger: "POST /press-orders/{id}/confirm"
    algorithm: aggregation
    formula: |
      outstanding = sum over the customer's invoices with status in {ISSUED,
                    PARTIALLY_PAID} of (net_cents - paid_cents - credited_cents)
      require outstanding + quote_total_cents <= credit_limit_cents
      (equality is allowed — boundary is inclusive).
    precision: "integer cents"

  - name: cancellation_fee
    trigger: "POST /press-orders/{id}/cancel"
    algorithm: threshold
    formula: |
      fee = round_half_up(quote_total_cents * CANCEL_PCT[state_at_cancel])
      fee > 0 auto-creates a CANCELLATION_FEE invoice (ISSUED, net = gross = fee,
      discount 0). DRAFT/QUOTED are free.
    constants:
      CANCEL_PCT: { DRAFT: 0, QUOTED: 0, CONFIRMED: 0.10, TOOLING: 0.25, AWAITING_TP_APPROVAL: 0.25, QUEUED: 0.50, SCHEDULED: 0.50 }

  - name: storage_fee
    trigger: "computed on every read of an InventoryLot (fields storage_daily_accrual_cents / storage_monthly_statement_cents)"
    algorithm: aggregation
    formula: |
      pallets_on_hand(lot, day) = ceil(on_hand_units(day) / UNITS_PER_PALLET[format]).
      daily_accrual variant: fee = sum over days of pallets_on_hand(day) * DAILY_PALLET_RATE.
      monthly_statement variant: avg_pallets = round_half_up(sum of daily pallets / days_in_month, 2);
        fee = max(avg_pallets * MONTHLY_PALLET_RATE, MIN_MONTHLY_STORAGE).
      The two variants intentionally diverge (55/day vs 1500/month-equivalent with floor).
    constants:
      DAILY_PALLET_RATE: 55
      MONTHLY_PALLET_RATE: 1500
      MIN_MONTHLY_STORAGE: 5000
    variants:
      - name: accrual_vs_statement
        when: "daily accrual ledger vs monthly statement"
        difference: "Different rate basis plus a monthly minimum floor; identical pallet-day data yields different fees. Entity domain: InventoryLot warehousing."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the endpoint's roles list; entity-backed ownership: a Customer may act only on orders/releases where Release.customer_id == X-User-ID"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (order before tooling job before qc report, etc.); body-referenced FKs (release_id, customer_id, distributor_customer_id, plating_bath_id) must also exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_CUSTOMER_NOT_FOUND, ERR_RELEASE_NOT_FOUND, ERR_PRESS_ORDER_NOT_FOUND, ERR_TOOLING_JOB_NOT_FOUND, ERR_TEST_PRESSING_NOT_FOUND, ERR_PRINT_JOB_NOT_FOUND, ERR_PRESS_LINE_NOT_FOUND, ERR_PLATING_BATH_NOT_FOUND, ERR_QC_REPORT_NOT_FOUND, ERR_INVENTORY_LOT_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_INVOICE_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: business_constraint
    check: "Request body shape: required fields present, correct types, enum members valid, quantities positive, slot hour ranges valid for the line, weight_gram in {140,180}, sides in {1,2}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 5
    category: state
    check: "Target resource is in the exact from-state of the requested transition (order DRAFT/QUOTED for quote, QUOTED for confirm, CONFIRMED for start-tooling, QUEUED for schedule-commit, SCHEDULED/PRESSING for production events, pre-PRESSING for cancel; tooling job stage; TP UNDER_REVIEW for review; print job stage; QC report FILED; shipment PLANNED/ALLOCATED/PICKED per action; invoice ISSUED/PARTIALLY_PAID for payments/memos; STANDARD invoice only when order COMPLETED and none issued yet)"
    error_id: "ERR_ORDER_INVALID_STATE | ERR_TOOLING_JOB_INVALID_STATE | ERR_TEST_PRESSING_INVALID_STATE | ERR_PRINT_JOB_INVALID_STATE | ERR_QC_REPORT_ALREADY_DECIDED | ERR_SHIPMENT_INVALID_STATE | ERR_INVOICE_INVALID_STATE"
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: X-User-ID deciding a QC report must differ from the report's filed_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /qc-reports/{id}/decision"
  - priority: 7
    category: business_referential
    check: "Linked-entity status gates: confirm requires Customer ACTIVE (ERR_CUSTOMER_SUSPENDED); shipment create requires distributor Customer ACTIVE (ERR_CUSTOMER_SUSPENDED); TP creation requires latest ToolingJob STAMPER_READY (ERR_STAMPERS_NOT_READY); QC ACCEPT decision requires all non-CANCELLED PrintJobs DELIVERED (ERR_PRINT_JOBS_NOT_DELIVERED) and outcome PASS (ERR_QC_HOLD_REQUIRES_REPRESS)"
    error_id: "ERR_CUSTOMER_SUSPENDED | ERR_STAMPERS_NOT_READY | ERR_PRINT_JOBS_NOT_DELIVERED | ERR_QC_HOLD_REQUIRES_REPRESS"
    http_status: 409
    applies_to: "confirm, POST /shipments, POST /press-orders/{id}/test-pressings, POST /qc-reports/{id}/decision"
  - priority: 8
    category: business_constraint
    check: "Order composition: quantity_ordered >= 100 (ERR_ORDER_BELOW_MINIMUM); variants sum == quantity_ordered (ERR_VARIANT_SUM_MISMATCH); each variant quantity >= its config minimum BLACK 1 / SOLID_COLOR 100 / SPLATTER 100 / MARBLED 100 / PICTURE_DISC 200 (ERR_VARIANT_BELOW_MINIMUM); uniqueness of line_code, bath_code, and catalog_number per customer (ERR_DUPLICATE_CODE)"
    error_id: "ERR_ORDER_BELOW_MINIMUM | ERR_VARIANT_SUM_MISMATCH | ERR_VARIANT_BELOW_MINIMUM | ERR_DUPLICATE_CODE"
    http_status: 422
    applies_to: "POST /press-orders, POST /press-orders/{id}/quotes, POST /press-lines, POST /plating-baths, POST /releases"
  - priority: 9
    category: business_constraint
    check: "Interval occupation: slot_conflict_check (ERR_SLOT_OVERLAP, ERR_CHANGEOVER_BUFFER_VIOLATION, ERR_MAINTENANCE_WINDOW_CONFLICT); bath_booking_check (ERR_BATH_TIME_CONFLICT, ERR_BATH_RINSE_GAP_VIOLATION)"
    error_id: "ERR_SLOT_OVERLAP | ERR_CHANGEOVER_BUFFER_VIOLATION | ERR_MAINTENANCE_WINDOW_CONFLICT | ERR_BATH_TIME_CONFLICT | ERR_BATH_RINSE_GAP_VIOLATION"
    http_status: 409
    applies_to: "POST /press-orders/{id}/schedule-commits, POST /press-lines/{id}/maintenance-windows, POST /tooling-jobs/{id}/advance"
  - priority: 10
    category: business_temporal
    check: "requested_completion_date >= today + 21 days at order creation (ERR_LEAD_TIME_VIOLATION); START_PRESSING requires clock date >= earliest slot date (ERR_PRESS_DATE_NOT_REACHED)"
    error_id: "ERR_LEAD_TIME_VIOLATION | ERR_PRESS_DATE_NOT_REACHED"
    http_status: 422
    applies_to: "POST /press-orders, POST /press-orders/{id}/production-events"
  - priority: 11
    category: business_fiscal
    check: "credit_availability at confirm: outstanding + quote_total_cents <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /press-orders/{id}/confirm"
  - priority: 12
    category: business_fiscal
    check: "Capacity quotas: per line+date sum of planned_units <= daily_unit_capacity (ERR_LINE_DAILY_CAPACITY_EXCEEDED); per slot planned_units <= hours x hourly_rate and total >= quantity_ordered - accepted_units (ERR_SLOT_UNITS_MISMATCH); zone_receiving_check (ERR_ZONE_RECEIVING_CAPACITY_EXCEEDED); payment/memo amount <= remaining balance (ERR_PAYMENT_EXCEEDS_BALANCE); DAMAGE_WRITE_OFF quantity <= on_hand_units (ERR_INVALID_REQUEST)"
    error_id: "ERR_LINE_DAILY_CAPACITY_EXCEEDED | ERR_SLOT_UNITS_MISMATCH | ERR_ZONE_RECEIVING_CAPACITY_EXCEEDED | ERR_PAYMENT_EXCEEDS_BALANCE"
    http_status: 409
    applies_to: "POST /press-orders/{id}/schedule-commits, POST /inventory-lots/{id}/stock-events, POST /invoices/{id}/payments, POST /invoices/{id}/credit-memos"

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (59 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets the logical clock used by lead-time, press-date, slot-date, and risk computations"]

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a customer (label or distributor account)"
    roles: [CustomerServiceRep]
    code: 201
    input: [name, contact_email, credit_limit_cents, "discount_tier?", "overrun_policy?"]
    output: Customer
    side_effects: ["status ACTIVE, trailing_billed_cents 0"]
  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Customer[]"
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [Any]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/credit-limit-revisions"
    description: "Supersede the customer's credit limit (OCC-guarded)"
    roles: [CustomerServiceRep]
    code: 200
    input: [new_credit_limit_cents, expected_customer_version, "discount_tier?"]
    output: Customer
    side_effects: ["credit_limit_cents := new_credit_limit_cents", "increments Customer.version by 1"]
  - method: POST
    path: "/customers/{id}/credit-status"
    description: "Suspend or reinstate a customer credit hold"
    roles: [BillingClerk]
    code: 200
    input: [action]
    output: Customer
    side_effects: ["ACTIVE <-> SUSPENDED", "increments Customer.version by 1"]

  # --- Release ---
  - method: POST
    path: "/releases"
    description: "Create a release for a customer"
    roles: [CustomerServiceRep]
    code: 201
    input: [customer_id, catalog_number, title, format, weight_gram, release_date]
    output: Release
    side_effects: ["status SETUP, risk_level ON_TRACK"]
  - method: GET
    path: "/releases"
    description: "List releases (filtered)"
    roles: [Any]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: "Release[]"
    side_effects: []
  - method: GET
    path: "/releases/{id}"
    description: "Get a release"
    roles: [Any]
    code: 200
    input: []
    output: Release
    side_effects: []
  - method: POST
    path: "/releases/{id}/date-revisions"
    description: "Revise the street date (OCC-guarded); recomputes risk and may append DelayNotice"
    roles: [CustomerServiceRep]
    code: 200
    input: [new_release_date, reason, expected_release_version]
    output: Release
    side_effects: ["release_date := new_release_date", "release_risk_eval (cause DATE_REVISION); DelayNotice if worsens", "increments Release.version by 1"]
  - method: GET
    path: "/releases/{id}/risk"
    description: "Computed read of release-date risk"
    roles: [Any]
    code: 200
    input: []
    output: { release_id: string, projected_completion_date: string, slack_days: integer, risk_level: string }
    side_effects: []
  - method: GET
    path: "/releases/{id}/delay-notices"
    description: "List delay notices of a release (reverse reachability for DelayNotice.release_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "DelayNotice[]"
    side_effects: []

  # --- PressOrder ---
  - method: POST
    path: "/press-orders"
    description: "Create a press order (intake) with its variant configuration"
    roles: [CustomerServiceRep]
    code: 201
    input: [release_id, quantity_ordered, sides, plating_route, variants, "overrun_policy?", "requested_completion_date?"]
    output: PressOrder
    side_effects: ["production_status DRAFT, billing_status UNBILLED", "assigns intake_seq", "computes tolerance_pct and color_family"]
  - method: GET
    path: "/press-orders"
    description: "List press orders (filtered)"
    roles: [Any]
    code: 200
    input: ["release_id?", "production_status?", "limit?", "offset?"]
    output: "PressOrder[]"
    side_effects: []
  - method: GET
    path: "/press-orders/{id}"
    description: "Get a press order"
    roles: [Any]
    code: 200
    input: []
    output: PressOrder
    side_effects: []
  - method: POST
    path: "/press-orders/{id}/quotes"
    description: "Compute/lock a price quote; in QUOTED a re-quote supersedes (OCC-guarded)"
    roles: [CustomerServiceRep]
    code: 200
    input: [expected_press_order_version]
    output: PressOrder
    side_effects: ["DRAFT->QUOTED or QUOTED->QUOTED", "press_quote_price", "discount_pct_snapshot", "increments PressOrder.version by 1"]
  - method: POST
    path: "/press-orders/{id}/confirm"
    description: "Customer confirms the quoted order (credit check)"
    roles: [Customer]
    code: 200
    input: [expected_press_order_version]
    output: PressOrder
    side_effects: ["QUOTED->CONFIRMED", "Release SETUP->IN_PRODUCTION on first confirm", "credit_availability check", "increments PressOrder.version by 1"]
  - method: POST
    path: "/press-orders/{id}/start-tooling"
    description: "Begin lacquer/plating tooling; creates ToolingJob round 1"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: PressOrder
    side_effects: ["CONFIRMED->TOOLING", "creates ToolingJob(QUEUED, round_number = tp_round + 1)", "increments PressOrder.version by 1"]
  - method: POST
    path: "/press-orders/{id}/schedule-commits"
    description: "Commit explicit press slots for a QUEUED order (OCC-guarded)"
    roles: [ProductionPlanner]
    code: 200
    input: [expected_press_order_version, slots]
    output: PressOrder
    side_effects: ["QUEUED->SCHEDULED", "creates PRODUCTION PressSlots", "slot_conflict_check + capacity checks", "release_risk_eval", "increments PressOrder.version by 1"]
  - method: POST
    path: "/press-orders/{id}/production-events"
    description: "START_PRESSING (SCHEDULED->PRESSING) or COMPLETE_PRESSING (PRESSING->QC_REVIEW)"
    roles: [PressOperator]
    code: 200
    input: [event]
    output: PressOrder
    side_effects: ["production_status advance per event", "increments PressOrder.version by 1"]
  - method: POST
    path: "/press-orders/{id}/cancel"
    description: "Cancel a pre-PRESSING order; tiered fee, frees slots, waitlist promotion cascade"
    roles: [CustomerServiceRep]
    code: 200
    input: ["reason?"]
    output: PressOrder
    side_effects: ["cancellation_fee + CANCELLATION_FEE invoice when fee > 0", "frees PRODUCTION slots", "waitlist_promotion waterfall", "children cascaded terminal", "increments PressOrder.version by 1"]
  - method: GET
    path: "/press-orders/{id}/slots"
    description: "List slots of an order (reverse reachability for PressSlot.press_order_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PressSlot[]"
    side_effects: []
  - method: GET
    path: "/press-orders/{id}/tooling-jobs"
    description: "List tooling jobs of an order (reverse reachability for ToolingJob.press_order_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ToolingJob[]"
    side_effects: []
  - method: GET
    path: "/press-orders/{id}/test-pressings"
    description: "List test pressings of an order (reverse reachability for TestPressing.press_order_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "TestPressing[]"
    side_effects: []
  - method: GET
    path: "/press-orders/{id}/print-jobs"
    description: "List print jobs of an order (reverse reachability for PrintJob.press_order_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PrintJob[]"
    side_effects: []
  - method: GET
    path: "/press-orders/{id}/qc-reports"
    description: "List QC reports of an order (reverse reachability for QCReport.press_order_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "QCReport[]"
    side_effects: []
  - method: GET
    path: "/press-orders/{id}/delay-notices"
    description: "List delay notices attributed to an order (reverse reachability for DelayNotice.press_order_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "DelayNotice[]"
    side_effects: []
  - method: GET
    path: "/press-orders/{id}/inventory-lots"
    description: "List inventory lots received from an order (reverse reachability for InventoryLot via release+completion cascade)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []

  # --- ToolingJob ---
  - method: POST
    path: "/tooling-jobs/{id}/advance"
    description: "Advance tooling stage: START_CUT | CUT_DONE | START_PLATING (with bath booking) | PLATING_DONE | MARK_FAILED"
    roles: [PressOperator]
    code: 200
    input: [event, "plating_bath_id?", "plating_start?", "plating_end?", "defect_note?"]
    output: ToolingJob
    side_effects: ["stage transition per event", "bath_booking_check on START_PLATING", "MARK_FAILED: attempt_count += 1 and auto-requeue while attempt_count < 3", "increments ToolingJob.version by 1"]

  # --- TestPressing ---
  - method: POST
    path: "/press-orders/{id}/test-pressings"
    description: "Produce a test pressing round (requires stampers ready)"
    roles: [PressOperator]
    code: 201
    input: [quantity]
    output: TestPressing
    side_effects: ["order must be TOOLING and latest ToolingJob STAMPER_READY", "tp_round += 1", "supersedes prior REVISION_REQUESTED round"]
  - method: POST
    path: "/test-pressings/{id}/ship"
    description: "Ship test pressing to customer (enters review); order -> AWAITING_TP_APPROVAL"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: TestPressing
    side_effects: ["PRODUCED->UNDER_REVIEW", "PressOrder TOOLING->AWAITING_TP_APPROVAL"]
  - method: POST
    path: "/test-pressings/{id}/review"
    description: "Customer review: APPROVE (order -> QUEUED) or REQUEST_REVISION (order -> TOOLING re-cut loop)"
    roles: [Customer]
    code: 200
    input: [decision, "notes?"]
    output: TestPressing
    side_effects: ["APPROVE: order -> QUEUED + risk recompute", "REQUEST_REVISION: order -> TOOLING, ToolingJob supersede + new re-cut job, +7 day risk recompute"]

  # --- PrintJob ---
  - method: POST
    path: "/press-orders/{id}/print-jobs"
    description: "Create a jacket/insert/label print job for an order"
    roles: [CustomerServiceRep]
    code: 201
    input: [component, quantity, printer_name, due_date]
    output: PrintJob
    side_effects: ["quantity >= order.quantity_ordered enforced"]
  - method: POST
    path: "/print-jobs/{id}/advance"
    description: "Plant-side print progress: DISPATCH | PROOFS_IN | DELIVER"
    roles: [CustomerServiceRep]
    code: 200
    input: [event]
    output: PrintJob
    side_effects: ["CREATED->AT_PRINTER->PROOF_REVIEW; PRINTING->DELIVERED"]
  - method: POST
    path: "/print-jobs/{id}/proof-decision"
    description: "Customer proof decision: APPROVE (-> PRINTING) or REQUEST_CHANGES (-> AT_PRINTER loop)"
    roles: [Customer]
    code: 200
    input: [decision, "notes?"]
    output: PrintJob
    side_effects: ["REQUEST_CHANGES: proof_round += 1 and risk recompute"]

  # --- PressLine / PressSlot / PlatingBath ---
  - method: POST
    path: "/press-lines"
    description: "Register a press line"
    roles: [ProductionPlanner]
    code: 201
    input: [line_code, tonnage_class, hours_per_day, daily_unit_capacity]
    output: PressLine
    side_effects: []
  - method: GET
    path: "/press-lines"
    description: "List press lines"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PressLine[]"
    side_effects: []
  - method: GET
    path: "/press-lines/{id}"
    description: "Get a press line"
    roles: [Any]
    code: 200
    input: []
    output: PressLine
    side_effects: []
  - method: GET
    path: "/press-lines/{id}/slots"
    description: "List slots on a line (reverse reachability for PressSlot.press_line_id)"
    roles: [Any]
    code: 200
    input: ["date?", "limit?", "offset?"]
    output: "PressSlot[]"
    side_effects: []
  - method: GET
    path: "/press-lines/{id}/backlog"
    description: "Computed backlog: optimistic vs conservative variants"
    roles: [Any]
    code: 200
    input: []
    output: { press_line_id: string, booked_hours: integer, optimistic_backlog_days: number, conservative_backlog_days: number }
    side_effects: []
  - method: POST
    path: "/press-lines/{id}/maintenance-windows"
    description: "Book a maintenance window (closed-interval slot, conflicts even when touching production)"
    roles: [ProductionPlanner]
    code: 201
    input: [date, start_hour, end_hour, "reason?"]
    output: PressSlot
    side_effects: ["creates MAINTENANCE PressSlot (press_order_id null)"]
  - method: POST
    path: "/plating-baths"
    description: "Register a plating bath"
    roles: [ProductionPlanner]
    code: 201
    input: [bath_code, "rinse_gap_minutes?"]
    output: PlatingBath
    side_effects: []
  - method: GET
    path: "/plating-baths"
    description: "List plating baths"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PlatingBath[]"
    side_effects: []
  - method: GET
    path: "/plating-baths/{id}"
    description: "Get a plating bath"
    roles: [Any]
    code: 200
    input: []
    output: PlatingBath
    side_effects: []
  - method: GET
    path: "/plating-baths/{id}/tooling-jobs"
    description: "List tooling jobs booked on a bath (reverse reachability for ToolingJob.plating_bath_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ToolingJob[]"
    side_effects: []

  # --- QC ---
  - method: POST
    path: "/press-orders/{id}/qc-reports"
    description: "File a QC report for the run (order must be QC_REVIEW)"
    roles: [QaInspector]
    code: 201
    input: [units_pressed, units_rejected, "defect_notes?"]
    output: QCReport
    side_effects: ["reject_rate_eval: outcome PASS | HOLD", "records filed_by from X-User-ID"]
  - method: POST
    path: "/qc-reports/{id}/decision"
    description: "ProductionManager decides ACCEPT (complete + stock) or REPRESS (loop); SoD enforced"
    roles: [ProductionManager]
    code: 200
    input: [decision, "fault?", "note?"]
    output: QCReport
    side_effects: ["ACCEPT: order -> COMPLETED chain incl. inventory credit + backorder sweep", "REPRESS: order -> QUEUED, repress_round += 1, +10 day risk recompute"]

  # --- Inventory ---
  - method: POST
    path: "/inventory-lots"
    description: "Open an inventory lot for a release in a zone (opening stock)"
    roles: [WarehouseManager]
    code: 201
    input: [release_id, zone]
    output: InventoryLot
    side_effects: ["assigns receipt_seq"]
  - method: GET
    path: "/inventory-lots"
    description: "List inventory lots (filtered; reverse reachability for InventoryLot.release_id)"
    roles: [Any]
    code: 200
    input: ["release_id?", "zone?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []
  - method: GET
    path: "/inventory-lots/{id}"
    description: "Get an inventory lot"
    roles: [Any]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: POST
    path: "/inventory-lots/{id}/stock-events"
    description: "RECEIVE quantity (zone daily pallet capacity + backorder sweep) or DAMAGE_WRITE_OFF"
    roles: [WarehouseManager]
    code: 200
    input: [event, quantity, "event_date?"]
    output: InventoryLot
    side_effects: ["RECEIVE: on_hand += q, received_units_cum += q, zone_receiving_check, shipment_allocation sweep", "DAMAGE_WRITE_OFF: on_hand -= q, damaged_units_cum += q"]

  # --- Shipment (distributor drop-ship) ---
  - method: POST
    path: "/shipments"
    description: "Create a distributor shipment; FIFO allocation or PLANNED backorder"
    roles: [CustomerServiceRep]
    code: 201
    input: [release_id, distributor_customer_id, quantity, requested_ship_date]
    output: Shipment
    side_effects: ["distributor must be ACTIVE", "shipment_allocation (all-or-nothing FIFO at creation)"]
  - method: GET
    path: "/shipments"
    description: "List shipments (filtered; reverse reachability for Shipment FKs)"
    roles: [Any]
    code: 200
    input: ["release_id?", "distributor_customer_id?", "status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []
  - method: GET
    path: "/shipments/{id}"
    description: "Get a shipment"
    roles: [Any]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/shipments/{id}/advance"
    description: "ALLOCATED -> PICKED -> SHIPPED (one step per call)"
    roles: [WarehouseManager]
    code: 200
    input: []
    output: Shipment
    side_effects: ["SHIPPED: lots allocated -= q, shipped_units_cum += q"]
  - method: POST
    path: "/shipments/{id}/cancel"
    description: "Cancel a PLANNED/ALLOCATED shipment; deallocates and sweeps backorders"
    roles: [CustomerServiceRep]
    code: 200
    input: ["reason?"]
    output: Shipment
    side_effects: ["deallocate compensation", "backorder sweep"]

  # --- Invoice ---
  - method: POST
    path: "/press-orders/{id}/invoices"
    description: "Issue the final STANDARD invoice for a COMPLETED order (exactly one per order)"
    roles: [BillingClerk]
    code: 201
    input: []
    output: Invoice
    side_effects: ["final_invoice_total (pinned per-line rounding)", "billing_status UNBILLED->INVOICED", "customer.trailing_billed_cents += net_cents AFTER issuance"]
  - method: GET
    path: "/invoices"
    description: "List invoices (filtered; reverse reachability for all Invoice FKs incl. self-reference)"
    roles: [Any]
    code: 200
    input: ["press_order_id?", "customer_id?", "parent_invoice_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [Any]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/payments"
    description: "Record a payment against an invoice"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["paid_cents += amount_cents", "status -> PARTIALLY_PAID | PAID", "order billing_status mirrors"]
  - method: POST
    path: "/invoices/{id}/credit-memos"
    description: "Issue a credit memo against an invoice (self-referential CREDIT_MEMO row)"
    roles: [BillingClerk]
    code: 201
    input: [amount_cents, reason]
    output: Invoice
    side_effects: ["creates CREDIT_MEMO invoice with parent_invoice_id", "parent credited_cents += amount", "parent -> CREDITED when fully covered", "order billing_status -> CREDIT_CLOSED when fully covered"]

# =============================================================================
# Table 6: Error Code Catalog (44 codes)
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, non-positive quantity, slot hours outside the line's bookable range" }
  # --- Not found ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id does not exist" }
  - { id: ERR_RELEASE_NOT_FOUND, http: 404, condition: "release id does not exist" }
  - { id: ERR_PRESS_ORDER_NOT_FOUND, http: 404, condition: "press order id does not exist" }
  - { id: ERR_TOOLING_JOB_NOT_FOUND, http: 404, condition: "tooling job id does not exist" }
  - { id: ERR_TEST_PRESSING_NOT_FOUND, http: 404, condition: "test pressing id does not exist" }
  - { id: ERR_PRINT_JOB_NOT_FOUND, http: 404, condition: "print job id does not exist" }
  - { id: ERR_PRESS_LINE_NOT_FOUND, http: 404, condition: "press line id does not exist" }
  - { id: ERR_PLATING_BATH_NOT_FOUND, http: 404, condition: "plating bath id does not exist" }
  - { id: ERR_QC_REPORT_NOT_FOUND, http: 404, condition: "QC report id does not exist" }
  - { id: ERR_INVENTORY_LOT_NOT_FOUND, http: 404, condition: "inventory lot id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  # --- State ---
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "PressOrder not in the from-state required by the requested transition (incl. second STANDARD invoice, cancel at/after PRESSING, confirm outside QUOTED)" }
  - { id: ERR_TOOLING_JOB_INVALID_STATE, http: 409, condition: "ToolingJob stage does not allow the requested advance event" }
  - { id: ERR_TEST_PRESSING_INVALID_STATE, http: 409, condition: "TestPressing not in the state required (ship needs PRODUCED; review needs UNDER_REVIEW)" }
  - { id: ERR_PRINT_JOB_INVALID_STATE, http: 409, condition: "PrintJob stage does not allow the requested event/decision" }
  - { id: ERR_QC_REPORT_ALREADY_DECIDED, http: 409, condition: "QC report already DECIDED" }
  - { id: ERR_SHIPMENT_INVALID_STATE, http: 409, condition: "Shipment not in the state required (advance needs ALLOCATED/PICKED; cancel needs PLANNED/ALLOCATED)" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "Invoice not ISSUED/PARTIALLY_PAID for payment or memo, or order not invoiceable" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Customer (or distributor) is SUSPENDED (credit hold) for an operation requiring ACTIVE" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  # --- Safety / compliance ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "QC decision attempted by the same X-User-ID that filed the report" }
  # --- Referential gates ---
  - { id: ERR_STAMPERS_NOT_READY, http: 409, condition: "Test pressing creation requires the latest ToolingJob in STAMPER_READY" }
  - { id: ERR_PRINT_JOBS_NOT_DELIVERED, http: 409, condition: "QC ACCEPT requires every non-CANCELLED PrintJob of the order to be DELIVERED" }
  - { id: ERR_QC_HOLD_REQUIRES_REPRESS, http: 409, condition: "QC report outcome is HOLD; decision must be REPRESS" }
  # --- Business constraint ---
  - { id: ERR_ORDER_BELOW_MINIMUM, http: 422, condition: "quantity_ordered < 100 (ORDER_MIN_UNITS)" }
  - { id: ERR_VARIANT_BELOW_MINIMUM, http: 422, condition: "A variant quantity is below its color-config minimum (SOLID_COLOR/SPLATTER/MARBLED 100, PICTURE_DISC 200)" }
  - { id: ERR_VARIANT_SUM_MISMATCH, http: 422, condition: "Variant quantities do not sum to quantity_ordered" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "line_code or bath_code already exists, or catalog_number already used for this customer" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "PRODUCTION slot half-open interval intersects another PRODUCTION slot on the same line+date" }
  - { id: ERR_CHANGEOVER_BUFFER_VIOLATION, http: 409, condition: "Adjacent same-line/date PRODUCTION slots of different color families lack the 1-hour changeover buffer" }
  - { id: ERR_MAINTENANCE_WINDOW_CONFLICT, http: 409, condition: "PRODUCTION slot intersects a closed-interval MAINTENANCE window (touching endpoints conflict)" }
  - { id: ERR_BATH_TIME_CONFLICT, http: 409, condition: "Closed-interval bath booking overlaps another booking on the same bath" }
  - { id: ERR_BATH_RINSE_GAP_VIOLATION, http: 409, condition: "Bath bookings lack the mandatory rinse gap between them" }
  - { id: ERR_SLOT_UNITS_MISMATCH, http: 422, condition: "Total planned_units < quantity_ordered, or a slot exceeds hours x hourly_rate" }
  # --- Temporal ---
  - { id: ERR_LEAD_TIME_VIOLATION, http: 422, condition: "requested_completion_date is earlier than today + 21 days" }
  - { id: ERR_PRESS_DATE_NOT_REACHED, http: 409, condition: "START_PRESSING before the order's earliest slot date (logical clock)" }
  # --- Fiscal / capacity ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "outstanding + quote_total_cents exceeds credit_limit_cents at confirm" }
  - { id: ERR_LINE_DAILY_CAPACITY_EXCEEDED, http: 409, condition: "Sum of planned_units on a line+date exceeds daily_unit_capacity" }
  - { id: ERR_ZONE_RECEIVING_CAPACITY_EXCEEDED, http: 409, condition: "Zone daily receiving pallet capacity exceeded (A 40 / B 25 / C 15)" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 400, condition: "Payment or credit memo exceeds the invoice's remaining balance (net - paid - credited)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Technical operator; drives the logical test clock only"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
  - name: CustomerServiceRep
    description: "Plant customer-service staff: intake, quotes, print coordination, shipments, cancellations, date revisions"
    identity: opaque
    exclusive_operations:
      - "POST /customers, POST /customers/{id}/credit-limit-revisions"
      - "POST /releases, POST /releases/{id}/date-revisions"
      - "POST /press-orders, POST /press-orders/{id}/quotes, POST /press-orders/{id}/cancel"
      - "POST /press-orders/{id}/print-jobs, POST /print-jobs/{id}/advance"
      - "POST /shipments, POST /shipments/{id}/cancel"
    shared_operations: []
  - name: Customer
    description: "External label/distributor account acting on its own releases/orders"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /press-orders/{id}/confirm (only for own releases)"
      - "POST /test-pressings/{id}/review (only for own releases)"
      - "POST /print-jobs/{id}/proof-decision (only for own releases)"
    shared_operations: []
  - name: ProductionPlanner
    description: "Plans capacity: press lines, baths, maintenance, tooling start, schedule commits, TP shipping"
    identity: opaque
    exclusive_operations:
      - "POST /press-lines, POST /press-lines/{id}/maintenance-windows"
      - "POST /plating-baths"
      - "POST /press-orders/{id}/start-tooling, POST /press-orders/{id}/schedule-commits"
      - "POST /test-pressings/{id}/ship"
    shared_operations: []
  - name: PressOperator
    description: "Floor operator: tooling stage advances, test pressing production, press start/complete"
    identity: opaque
    exclusive_operations:
      - "POST /tooling-jobs/{id}/advance"
      - "POST /press-orders/{id}/test-pressings"
      - "POST /press-orders/{id}/production-events"
    shared_operations: []
  - name: QaInspector
    description: "Files QC reports; may never decide them"
    identity: opaque
    exclusive_operations:
      - "POST /press-orders/{id}/qc-reports"
    shared_operations: []
  - name: ProductionManager
    description: "Decides QC outcomes (accept / repress with fault); segregated from the filer"
    identity: opaque
    exclusive_operations:
      - "POST /qc-reports/{id}/decision"
    shared_operations: []
  - name: WarehouseManager
    description: "Runs the warehouse: lots, stock events, shipment picking/shipping"
    identity: opaque
    exclusive_operations:
      - "POST /inventory-lots, POST /inventory-lots/{id}/stock-events"
      - "POST /shipments/{id}/advance"
    shared_operations: []
  - name: BillingClerk
    description: "Invoicing, payments, credit memos, customer credit holds"
    identity: opaque
    exclusive_operations:
      - "POST /press-orders/{id}/invoices, POST /invoices/{id}/payments, POST /invoices/{id}/credit-memos"
      - "POST /customers/{id}/credit-status"
    shared_operations: []
  - name: Any
    description: "Pseudo-role: any authenticated role may perform these read operations"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
