# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3251_commitment_contracts_savings_plans_enterprise_discount_administration
# 9 rules x 2 instances. Every numeric assert below was computed by hand from
# the pinned formulas in SCAFFOLD.yaml §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: savings_plan_coverage_projected_assumes_full_utilization_actual_replays
        grounds:
          - calculations.savings_plan_coverage
          - endpoints.GET_/api/commitment-plans/{id}/coverage
        distinguishing_aspect: "Same plan and same 3-hour window: ACTUAL (chronological replay of real usage) yields 280 covered cents while PROJECTED (forward-looking full utilization) yields 300 — dual-variant divergence on the CommitmentPlan/UsageRecord domain."
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z. Org with ceiling 100000 and quota 100."
            - "Agreement committed 1000000, term 2026-09-01..2027-09-01, COMPUTE tier (threshold 0, rate 0.10), ACTIVE."
            - "One linked account; SAVINGS_PLAN on COMPUTE, hourly_commitment 100, discount 0.30, term 2026-09-01..2026-10-01."
            - "Usage hours 00/01/02 on 2026-09-01 with list 150, 80, 100."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Cov Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { cov_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${cov_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { cov_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${cov_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${cov_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${cov_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { cov_acct: $.data.id }
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${cov_org}", agreement_id: "${cov_agr}", type: "SAVINGS_PLAN", instance_family: "COMPUTE", units: 0, hourly_commitment_cents: 100, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
              captures: { cov_plan: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${cov_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 150 }
              as: LinkedAccountManager
              as_user_id: "${cov_acct}"
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${cov_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T01:00:00Z", list_price_cents: 80 }
              as: LinkedAccountManager
              as_user_id: "${cov_acct}"
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${cov_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T02:00:00Z", list_price_cents: 100 }
              as: LinkedAccountManager
              as_user_id: "${cov_acct}"
          trigger:
            - call: "GET /api/commitment-plans/${cov_plan}/coverage?mode=ACTUAL&window_start=2026-09-01T00:00:00Z&window_end=2026-09-01T03:00:00Z"
              payload: {}
              as: OrgAdmin
              captures: { cov_actual: $.data.covered_cents }
            - call: "GET /api/commitment-plans/${cov_plan}/coverage?mode=PROJECTED&window_start=2026-09-01T00:00:00Z&window_end=2026-09-01T03:00:00Z"
              payload: {}
              as: OrgAdmin
              captures: { cov_proj: $.data.covered_cents }
          assert:
            - "ACTUAL covered_cents == 280 (min(150,100) + min(80,100) + min(100,100))"
            - "PROJECTED covered_cents == 300 (100 hourly x 3 hours, full utilization assumed)"
            - "ACTUAL != PROJECTED — the two variants diverge because hour 1 is under-utilized"

      - name: renewal_forecast_linear_extrapolates_growth_cohort_weights_recency
        grounds:
          - calculations.renewal_forecast
          - endpoints.POST_/api/renewal-forecasts
        distinguishing_aspect: "Same closed-period usage history (100000, 120000, 140000): LINEAR yields 160000 while COHORT_WEIGHTED yields 126000 — dual-variant divergence on the RenewalForecast/EnterpriseAgreement domain, distinct from the coverage variants."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with COMPUTE tier (0, 0.10); one account."
            - "Closed-period usage: period 0 = 100000, period 1 = 120000, period 2 = 140000 (three run-period-close calls interleaved)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Fc Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { fc_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${fc_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { fc_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${fc_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${fc_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${fc_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { fc_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${fc_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 100000 }
              as: LinkedAccountManager
              as_user_id: "${fc_acct}"
            - call: "POST /api/billing-orgs/${fc_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${fc_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T01:00:00Z", list_price_cents: 120000 }
              as: LinkedAccountManager
              as_user_id: "${fc_acct}"
            - call: "POST /api/billing-orgs/${fc_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${fc_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T02:00:00Z", list_price_cents: 140000 }
              as: LinkedAccountManager
              as_user_id: "${fc_acct}"
            - call: "POST /api/billing-orgs/${fc_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
          trigger:
            - call: "POST /api/renewal-forecasts"
              payload: { agreement_id: "${fc_agr}", variant: "LINEAR" }
              as: FinanceAnalyst
              captures: { fc_lin: $.data.forecast_cents }
            - call: "POST /api/renewal-forecasts"
              payload: { agreement_id: "${fc_agr}", variant: "COHORT_WEIGHTED" }
              as: FinanceAnalyst
              captures: { fc_coh: $.data.forecast_cents }
          assert:
            - "LINEAR forecast_cents == 160000 (U1 + (U1-U3)/(W-1) = 140000 + (140000-100000)/2)"
            - "COHORT_WEIGHTED forecast_cents == 126000 (0.5*140000 + 0.3*120000 + 0.2*100000)"
            - "the two variants differ by exactly 34000 cents on identical input history"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: tiered_discount_straddles_marginal_brackets_mid_invoice
        grounds:
          - calculations.tiered_eda_discount
          - endpoints.POST_/api/invoices/generate
        distinguishing_aspect: "Mode (a): the tier formula combines 3+ inputs (cumulative consumed c0=350000, entering amount e=100000, two-bracket tier table) with nested min/max; the 100000 straddles the 400000 threshold and splits 50000@10% + 50000@25% = 17500, provably not a flat rate."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement committed 1000000 with COMPUTE tiers (0, 0.10) and (400000, 0.25), ACTIVE; one account."
            - "Period 0 usage 350000 billed into invoice 1 (consumed_commitment becomes 350000); period closed; period 1 usage 100000 ingested."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Tier Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { tr_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${tr_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { tr_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${tr_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${tr_agr}", service_family: "COMPUTE", threshold_cents: 400000, rate: 0.25 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${tr_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${tr_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { tr_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${tr_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 350000 }
              as: LinkedAccountManager
              as_user_id: "${tr_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${tr_org}", period_index: 0 }
              as: OrgAdmin
            - call: "POST /api/billing-orgs/${tr_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${tr_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T01:00:00Z", list_price_cents: 100000 }
              as: LinkedAccountManager
              as_user_id: "${tr_acct}"
          trigger:
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${tr_org}", period_index: 1 }
              as: OrgAdmin
              captures: { tr_inv: $.data.id }
            - call: "GET /api/invoices/${tr_inv}/lines"
              payload: {}
              as: OrgAdmin
              captures: { tr_tier_disc: "$.data[0].tier_discount_cents", tr_net: "$.data[0].net_due_cents"}
          assert:
            - "period-1 line tier_discount_cents == 17500 (min(450000,400000)-max(350000,0)=50000 at 10% = 5000, plus 450000-400000=50000 at 25% = 12500)"
            - "period-1 line net_due_cents == 82500 (100000 - 17500)"
            - "agreement consumed_commitment_cents == 450000 after generation"

      - name: waterfall_per_line_rounding_beats_sum_then_round_by_one_cent
        grounds:
          - calculations.invoice_waterfall
          - entities.Invoice.fields.total_due_cents
          - entities.InvoiceLine.fields.net_due_cents
        distinguishing_aspect: "Mode (b): two lines of list 101 each at plan rate 0.30 produce post-stage amounts of 63.63 cents; the pinned order rounds each line to 64 and sums to 128, whereas the forbidden sum-then-round order would give round(127.26)=127 — a 1-cent observable difference."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with COMPUTE tier (0, 0.10); two accounts a1 (created first), a2."
            - "SAVINGS_PLAN COMPUTE hourly 100000, rate 0.30 (covers both accounts' hour-00 usage fully)."
            - "Each account has one usage record of list 101 at 2026-09-01T00:00."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Rnd Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { rn_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${rn_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { rn_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${rn_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${rn_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${rn_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { rn_a1: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${rn_org}", name: "acct-2", external_ref: "ext-2" }
              as: OrgAdmin
              captures: { rn_a2: $.data.id }
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${rn_org}", agreement_id: "${rn_agr}", type: "SAVINGS_PLAN", instance_family: "COMPUTE", units: 0, hourly_commitment_cents: 100000, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${rn_a1}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 101 }
              as: LinkedAccountManager
              as_user_id: "${rn_a1}"
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${rn_a2}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 101 }
              as: LinkedAccountManager
              as_user_id: "${rn_a2}"
          trigger:
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${rn_org}", period_index: 0 }
              as: OrgAdmin
              captures: { rn_inv: $.data.id, rn_total: $.data.total_due_cents }
            - call: "GET /api/invoices/${rn_inv}/lines"
              payload: {}
              as: OrgAdmin
              captures: { rn_line1_net: "$.data[0].net_due_cents", rn_line2_net: "$.data[1].net_due_cents"}
          assert:
            - "each line: plan_discount_cents == 30 (round_half_up of 30.3), tier_discount_cents == 7 (round_half_up of 7.07), net_due_cents == 64"
            - "Invoice.total_due_cents == 128 (sum of rounded lines 64 + 64)"
            - "Invoice.total_due_cents != 127 — sum-then-round of the unrounded 127.26 is the forbidden order"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: agreement_parallel_axes_suspend_resume_cycle_preserves_renewal_review
        grounds:
          - state_machines.EnterpriseAgreement
        distinguishing_aspect: "EnterpriseAgreement carries two parallel state dimensions plus a lifecycle cycle: renewal NONE->RENEWAL_REVIEW, then lifecycle ACTIVE->SUSPENDED->ACTIVE must leave renewal_status at RENEWAL_REVIEW, proving the axes evolve independently on one entity."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE (lifecycle) with renewal_status NONE; one COMPUTE tier."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Par Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { pa_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${pa_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { pa_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${pa_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${pa_agr}/activate"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/enterprise-agreements/${pa_agr}/open-renewal-review"
              payload: {}
              as: FinanceAnalyst
              captures: { pa_renewal1: $.data.renewal_status }
            - call: "POST /api/enterprise-agreements/${pa_agr}/suspend"
              payload: {}
              as: OrgAdmin
              captures: { pa_life_sus: $.data.lifecycle_status, pa_renewal_sus: $.data.renewal_status }
            - call: "POST /api/enterprise-agreements/${pa_agr}/resume"
              payload: {}
              as: OrgAdmin
              captures: { pa_life_res: $.data.lifecycle_status, pa_renewal_res: $.data.renewal_status }
            - call: "POST /api/enterprise-agreements/${pa_agr}/close-renewal-review"
              payload: { outcome: "RENEWED" }
              as: FinanceAnalyst
              captures: { pa_renewal_final: $.data.renewal_status, pa_life_final: $.data.lifecycle_status }
          assert:
            - "after open-renewal-review: renewal_status == RENEWAL_REVIEW and lifecycle_status == ACTIVE"
            - "after suspend: lifecycle_status == SUSPENDED and renewal_status == RENEWAL_REVIEW (axis independence)"
            - "after resume: lifecycle_status == ACTIVE and renewal_status == RENEWAL_REVIEW (cycle returned, renewal preserved)"
            - "after close-renewal-review RENEWED: renewal_status == RENEWED and lifecycle_status == ACTIVE"

      - name: invoice_dispute_resolve_cycle_allows_repeated_dispute_before_settle
        grounds:
          - state_machines.Invoice
        distinguishing_aspect: "Invoice has a FINALIZED -> DISPUTED -> FINALIZED cycle (non-linear, on a different entity than EnterpriseAgreement): the cycle is traversed twice and the invoice still settles for exactly total_due_cents."
        test_recipe:
          setup:
            - "Clock at default. Org without any agreement; one account; usage 10000 in period 0; invoice generated (total_due 10000, no discounts) and finalized."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Cyc Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { cy_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${cy_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { cy_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${cy_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 10000 }
              as: LinkedAccountManager
              as_user_id: "${cy_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${cy_org}", period_index: 0 }
              as: OrgAdmin
              captures: { cy_inv: $.data.id }
            - call: "POST /api/invoices/${cy_inv}/finalize"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/invoices/${cy_inv}/dispute"
              payload: { reason: "rate mismatch" }
              as: OrgAdmin
              captures: { cy_s1: $.data.status }
            - call: "POST /api/invoices/${cy_inv}/resolve-dispute"
              payload: {}
              as: OrgAdmin
              captures: { cy_s2: $.data.status }
            - call: "POST /api/invoices/${cy_inv}/dispute"
              payload: { reason: "second review" }
              as: OrgAdmin
              captures: { cy_s3: $.data.status }
            - call: "POST /api/invoices/${cy_inv}/resolve-dispute"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/invoices/${cy_inv}/settle"
              payload: { amount_cents: 10000 }
              as: OrgAdmin
              captures: { cy_s4: $.data.status }
          assert:
            - "first dispute -> status DISPUTED; first resolve -> status FINALIZED"
            - "second dispute -> status DISPUTED again (cycle is repeatable, not one-shot)"
            - "settle with amount_cents == 10000 -> status SETTLED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: agreement_terminate_cascades_plans_then_trueups_then_accrual
        grounds:
          - state_machines.EnterpriseAgreement.ACTIVE_to_TERMINATED
          - state_machines.CommitmentPlan
          - state_machines.TrueUpCharge
          - calculations.commitment_trueup
        distinguishing_aspect: "Depth-3 cascade triggered by agreement terminate: agreement -> scoped ACTIVE plans TERMINATED (link 1) -> each plan termination spawns an EARLY_TERMINATION TrueUpCharge (link 2, caused by the plan transition) -> each charge recomputes agreement.accrued_trueup_cents (link 3, caused by charge creation)."
        test_recipe:
          setup:
            - "Clock advanced to 2026-09-02T12:00:00Z. Org; agreement ACTIVE (term to 2027-09-01) with COMPUTE tier (0, 0.10)."
            - "Plan p1: SAVINGS_PLAN hourly 100, term_end 2026-09-03T00:00 (12 hours remain). Plan p2: SAVINGS_PLAN hourly 100, term_end 2026-09-04T00:00 (36 hours remain)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Cas Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { ca_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${ca_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { ca_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${ca_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${ca_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${ca_org}", agreement_id: "${ca_agr}", type: "SAVINGS_PLAN", instance_family: "COMPUTE", units: 0, hourly_commitment_cents: 100, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-09-03T00:00:00Z" }
              as: OrgAdmin
              captures: { ca_p1: $.data.id }
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${ca_org}", agreement_id: "${ca_agr}", type: "SAVINGS_PLAN", instance_family: "COMPUTE", units: 0, hourly_commitment_cents: 100, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-09-04T00:00:00Z" }
              as: OrgAdmin
              captures: { ca_p2: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformBillingOperator
          trigger:
            - call: "POST /api/enterprise-agreements/${ca_agr}/terminate"
              payload: {}
              as: OrgAdmin
              captures: { ca_accrued: $.data.accrued_trueup_cents }
            - call: "GET /api/true-up-charges?plan_id=${ca_p1}"
              payload: {}
              as: OrgAdmin
              captures: { ca_t1_amount: "$.data[0].amount_cents", ca_t1_status: "$.data[0].status", ca_t1_type: "$.data[0].type"}
            - call: "GET /api/true-up-charges?plan_id=${ca_p2}"
              payload: {}
              as: OrgAdmin
              captures: { ca_t2_amount: "$.data[0].amount_cents"}
          assert:
            - "both plans are TERMINATED after the agreement terminate"
            - "p1's TrueUpCharge: type == EARLY_TERMINATION, status == ASSESSED, amount_cents == 600 (0.5 * 100 * 12 remaining hours)"
            - "p2's TrueUpCharge: amount_cents == 1800 (0.5 * 100 * 36 remaining hours)"
            - "agreement.accrued_trueup_cents == 2400 (600 + 1800) — link 3 ledger sync"

      - name: invoice_finalize_cascades_credit_debits_exhaustion_and_org_pool
        grounds:
          - state_machines.Invoice.DRAFT_to_FINALIZED
          - state_machines.CreditGrant
          - calculations.credit_consumption
          - entities.BillingOrganization.fields.unapplied_credit_cents
        distinguishing_aspect: "Depth-3 cascade from a different trigger (invoice finalize): invoice -> credit pool debited in expires_at ASC order (link 1) -> grants hitting zero transition to EXHAUSTED / partial grants to DEPLETING (link 2, caused by the debit) -> each grant transition recomputes org.unapplied_credit_cents (link 3)."
        test_recipe:
          setup:
            - "Clock at default. Org without agreement; one account; usage 5000 in period 0; invoice generated (total_due before credit 5000, credit pool 5000)."
            - "Grants: g2 amount 1500 expires 2026-09-15; g1 amount 2000 expires 2026-10-01; g3 amount 4000 expires 2026-10-01 created after g1 (tie-break created_at ASC)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Cr Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { cr_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${cr_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { cr_acct: $.data.id }
            - call: "POST /api/credit-grants"
              payload: { org_id: "${cr_org}", amount_cents: 2000, expires_at: "2026-10-01T00:00:00Z" }
              as: PlatformBillingOperator
              captures: { cr_g1: $.data.id }
            - call: "POST /api/credit-grants"
              payload: { org_id: "${cr_org}", amount_cents: 1500, expires_at: "2026-09-15T00:00:00Z" }
              as: PlatformBillingOperator
              captures: { cr_g2: $.data.id }
            - call: "POST /api/credit-grants"
              payload: { org_id: "${cr_org}", amount_cents: 4000, expires_at: "2026-10-01T00:00:00Z" }
              as: PlatformBillingOperator
              captures: { cr_g3: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${cr_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 5000 }
              as: LinkedAccountManager
              as_user_id: "${cr_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${cr_org}", period_index: 0 }
              as: OrgAdmin
              captures: { cr_inv: $.data.id }
          trigger:
            - call: "POST /api/invoices/${cr_inv}/finalize"
              payload: {}
              as: OrgAdmin
              captures: { cr_credit_applied: $.data.total_credit_applied_cents }
            - call: "GET /api/credit-grants/${cr_g2}"
              payload: {}
              as: OrgAdmin
              captures: { cr_g2_status: $.data.status, cr_g2_consumed: $.data.consumed_cents }
            - call: "GET /api/credit-grants/${cr_g1}"
              payload: {}
              as: OrgAdmin
              captures: { cr_g1_status: $.data.status, cr_g1_consumed: $.data.consumed_cents }
            - call: "GET /api/credit-grants/${cr_g3}"
              payload: {}
              as: OrgAdmin
              captures: { cr_g3_status: $.data.status, cr_g3_consumed: $.data.consumed_cents, cr_g3_remaining: $.data.remaining_cents }
            - call: "GET /api/billing-orgs/${cr_org}"
              payload: {}
              as: OrgAdmin
              captures: { cr_pool: $.data.unapplied_credit_cents }
          assert:
            - "debit order is expires_at ASC: g2 (2026-09-15) consumed 1500 -> EXHAUSTED; g1 (2026-10-01, earlier created) consumed 2000 -> EXHAUSTED; g3 consumed 1500 -> DEPLETING with remaining_cents == 2500"
            - "invoice.total_credit_applied_cents == 5000 and net effect leaves total_due fully covered"
            - "org.unapplied_credit_cents == 2500 after finalize (link 3 recomputation)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: plan_purchase_state_gate_precedes_fiscal_ceiling
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_AGREEMENT_SUSPENDED]
          - errors[ERR_COMMITMENT_CEILING_EXCEEDED]
        distinguishing_aspect: "Error-category pair state vs business_fiscal: one request violates both the agreement-state gate (SUSPENDED) and the org hourly ceiling — the p5 state error ERR_AGREEMENT_SUSPENDED must win over the p9 fiscal error."
        test_recipe:
          setup:
            - "Clock at default. Org with max_hourly_commitment_cents 50; agreement ACTIVE with COMPUTE tier, then suspended."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Pv Org", max_hourly_commitment_cents: 50, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { pv_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${pv_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { pv_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${pv_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${pv_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${pv_agr}/suspend"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${pv_org}", agreement_id: "${pv_agr}", type: "SAVINGS_PLAN", instance_family: "COMPUTE", units: 0, hourly_commitment_cents: 100, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
              captures: { pv_err: $.data.error_id }
          assert:
            - "response status is 409 and error_id == ERR_AGREEMENT_SUSPENDED"
            - "error_id != ERR_COMMITMENT_CEILING_EXCEEDED even though hourly 100 > ceiling 50 — state (p5) precedes fiscal (p9)"
            - "no CommitmentPlan is created (GET /api/commitment-plans?org_id returns empty array)"

      - name: amendment_temporal_out_of_term_precedes_referential_family_coverage
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_AMENDMENT_OUT_OF_TERM]
          - errors[ERR_SERVICE_FAMILY_NOT_COVERED]
        distinguishing_aspect: "Error-category pair business_temporal vs business_referential: one amendment request names a service family with no tier (referential, p7) AND posts a window lying outside the agreement term (temporal, p6) — the p6 temporal error ERR_AMENDMENT_OUT_OF_TERM must win."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with only a COMPUTE tier (agreement term 2026-09-01..2027-09-01)."
            - "Trigger request: service_family UNKNOWN_SVC (no tier -> p7 referential violation) with window [2028-01-01, 2028-02-01) (outside term -> p6 temporal violation)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Ov Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { ov_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${ov_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { ov_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${ov_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${ov_agr}/activate"
              payload: {}
              as: OrgAdmin
              captures: { ov_v1: $.data.version }
          trigger:
            - call: "POST /api/pricing-amendments"
              payload: { agreement_id: "${ov_agr}", service_family: "UNKNOWN_SVC", discount_rate: 0.20, effective_from: "2028-01-01T00:00:00Z", effective_to: "2028-02-01T00:00:00Z", expected_agreement_version: "${ov_v1}" }
              as: FinanceAnalyst
              captures: { ov_err: $.data.error_id }
          assert:
            - "response status is 422 and error_id == ERR_AMENDMENT_OUT_OF_TERM"
            - "error_id != ERR_SERVICE_FAMILY_NOT_COVERED even though UNKNOWN_SVC has no tier — temporal (p6) precedes referential (p7)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: tier_threshold_boundary_consumed_exactly_at_threshold_enters_higher_bracket
        grounds:
          - calculations.tiered_eda_discount
          - calculations.commitment_trueup
          - endpoints.POST_/api/invoices/generate
        distinguishing_aspect: "Boundary metric 1 (cumulative consumed vs tier threshold) via POST /api/invoices/generate: c0=350000 and e=50000 land c1 exactly on the 400000 threshold; the last 50000-cents slice straddles into the 25% bracket only for the portion >= threshold — here exactly 0 cents cross, so discount is exactly 5000, while e=50001 would give 5000 + 0.25 = 5000.25 -> the >= boundary is decisive."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with COMPUTE tiers (0, 0.10) and (400000, 0.25); one account."
            - "Period 0: usage 350000 billed (consumed 350000). Period closed. Period 1: two usage records of 50000 (hours 01 and 02) and 1 (hour 03) — invoiced separately is not possible; instead invoice period 1 contains exactly 50000 of usage so c1 lands exactly on the threshold."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Bd Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { bd_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${bd_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { bd_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${bd_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${bd_agr}", service_family: "COMPUTE", threshold_cents: 400000, rate: 0.25 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${bd_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${bd_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { bd_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${bd_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 350000 }
              as: LinkedAccountManager
              as_user_id: "${bd_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${bd_org}", period_index: 0 }
              as: OrgAdmin
            - call: "POST /api/billing-orgs/${bd_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${bd_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T01:00:00Z", list_price_cents: 50000 }
              as: LinkedAccountManager
              as_user_id: "${bd_acct}"
          trigger:
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${bd_org}", period_index: 1 }
              as: OrgAdmin
              captures: { bd_inv: $.data.id }
            - call: "GET /api/invoices/${bd_inv}/lines"
              payload: {}
              as: OrgAdmin
              captures: { bd_tier: "$.data[0].tier_discount_cents", bd_net: "$.data[0].net_due_cents"}
          assert:
            - "c1 == 400000 exactly == threshold: line tier_discount_cents == 5000 (all 50000 cents still inside bracket [0, 400000) at 10%)"
            - "line net_due_cents == 45000"
            - "the >= boundary means NO portion of this line receives the 25% rate: discount is exactly 5000, not 5000 + any 25%-bracket contribution"

      - name: shortfall_boundary_consumed_exactly_committed_creates_no_charge
        grounds:
          - calculations.commitment_trueup
          - endpoints.POST_/api/true-up-charges/assess
          - state_machines.EnterpriseAgreement
        distinguishing_aspect: "Boundary metric 2 (shortfall zero / empty charge set) via a different endpoint, POST /api/true-up-charges/assess: consumed exactly == committed yields shortfall == 0 and NO TrueUpCharge row exists — an empty-set boundary, distinct from the numeric threshold boundary."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement committed exactly 100000, COMPUTE tier (0, 0.10), ACTIVE; one account with usage 100000 (non-marketplace) in period 0."
            - "Clock advanced past term_end 2026-10-01; run-period-close expires the agreement."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Zo Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { zo_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${zo_org}", name: "A", committed_spend_cents: 100000, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
              captures: { zo_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${zo_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${zo_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${zo_org}", name: "acct-1", external_ref: "ext-1" }
              as: OrgAdmin
              captures: { zo_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${zo_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 100000 }
              as: LinkedAccountManager
              as_user_id: "${zo_acct}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformBillingOperator
            - call: "POST /api/billing-orgs/${zo_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
          trigger:
            - call: "POST /api/true-up-charges/assess"
              payload: { agreement_id: "${zo_agr}" }
              as: OrgAdmin
            - call: "GET /api/true-up-charges?agreement_id=${zo_agr}"
              payload: {}
              as: OrgAdmin
          assert:
            - "assess returns 200 with data null (shortfall == 0 at the exact boundary consumed_2 == committed == 100000)"
            - "GET /api/true-up-charges?agreement_id returns an empty array — no zero-amount charge row exists"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

