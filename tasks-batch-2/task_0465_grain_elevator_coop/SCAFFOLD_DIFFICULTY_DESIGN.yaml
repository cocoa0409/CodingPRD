              as: Merchandiser
          assert:
            - "A PatronageAllocation exists for Member.${m_g_id} with allocation_dollars == 50000.00 (sole eligible member, all bushels)"
            - "Member.${m_g_id}.equity_credit_dollars == 40000.00 (cash floored: cash 10000.00, equity 40000.00)"
            - "Member.${m_g_id}.cash_paid_dollars increased by 10000.00 from the allocation cash portion (on top of prior settlement cash)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settlement_state_beats_referential_contract_not_priced_vs_commodity_mismatch
        grounds:
          - validations[priority=9]
          - validations[priority=6]
          - errors[ERR_CONTRACT_NOT_PRICED]
          - errors[ERR_COMMODITY_MISMATCH]
          - state_machines.Settlement.DRAFT_to_SETTLED
        distinguishing_aspect: |
          Error-category pair: state (ERR_CONTRACT_NOT_PRICED, priority 9) vs
          business_referential (ERR_COMMODITY_MISMATCH, priority 6). A settlement
          whose contract is still OPEN/unpriced AND whose contract commodity
          differs from the position commodity hits both — the lower-numbered
          priority 6 (referential) wins, returning ERR_COMMODITY_MISMATCH not
          ERR_CONTRACT_NOT_PRICED.
        test_recipe:
          setup:
            - "Two commodities CORN and WHEAT; current boards for both."
            - "A WHEAT clean position (member H), and an OPEN (unpriced) CASH contract on CORN for member H."
            - "A DRAFT settlement pointing the WHEAT position at the CORN contract."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities"
              payload: { symbol: "WHEAT", test_weight_lbs_per_bushel: 60, base_moisture_pct: 13.5, shrink_pct_per_point: 1.2, drying_cents_per_point_per_bushel: 3 }
              as: Merchandiser
              captures: { wheat_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "Hank Farm" }
              as: Merchandiser
              captures: { m_h_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_h_id}", commodity_id: "${wheat_id}", gross_weight_lbs: 76000, tare_weight_lbs: 16000, moisture_pct: 13.5, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_h_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_h_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_h_id: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_h_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_h_id: $.data.id }
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_h_id}", storage_position_id: "${pos_h_id}", priced_bushels: 500, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { s_h_id: $.data.id }
            - call: "GET /commodities/storage-positions/${pos_h_id}"
              payload: {}
              as: SettlementOfficer
              captures: { pos_h_v: $.data.version }
          trigger:
            - call: "POST /commodities/settlements/${s_h_id}/post"
              payload: { expected_storage_position_version: "${pos_h_v}" }
              as: SettlementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_COMMODITY_MISMATCH (priority 6 referential beats priority 9 state ERR_CONTRACT_NOT_PRICED)"
            - "Settlement.${s_h_id}.status == DRAFT (unchanged)"

      - name: settlement_overfill_beats_insufficient_bushels_constraint_pair
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_CONTRACT_OVERFILL]
          - errors[ERR_INSUFFICIENT_BUSHELS]
          - state_machines.Settlement.DRAFT_to_SETTLED
        distinguishing_aspect: |
          A DIFFERENT category pairing within business_constraint: contract
          overfill (ERR_CONTRACT_OVERFILL, priority 10) vs insufficient bushels
          (ERR_INSUFFICIENT_BUSHELS, priority 11). A settlement asking for 1500
          bushels against a 1000-bushel contract AND a 1000-bushel position
          violates both; priority 10 wins -> ERR_CONTRACT_OVERFILL.
        test_recipe:
          setup:
            - "CORN commodity; current board futures 4.80 basis -0.10."
            - "A clean 1000-bushel CORN position (member I) and a PRICED CASH contract contracted_bushels 1000."
            - "A DRAFT settlement requesting priced_bushels 1500 (exceeds both the 1000 remaining contract room and the 1000 available bushels)."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "Ivy Farm" }
              as: Merchandiser
              captures: { m_i_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_i_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_i_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_i_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_i_id: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_i_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_i_id: $.data.id }
            - call: "POST /commodities/contracts/${c_i_id}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_i_id}", storage_position_id: "${pos_i_id}", priced_bushels: 1500, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { s_i_id: $.data.id }
            - call: "GET /commodities/storage-positions/${pos_i_id}"
              payload: {}
              as: SettlementOfficer
              captures: { pos_i_v: $.data.version }
          trigger:
            - call: "POST /commodities/settlements/${s_i_id}/post"
              payload: { expected_storage_position_version: "${pos_i_v}" }
              as: SettlementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_CONTRACT_OVERFILL (priority 10 beats priority 11 ERR_INSUFFICIENT_BUSHELS)"
            - "StoragePosition.${pos_i_id}.bushels_available == 1000.0000 (unchanged)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: margin_call_strict_less_than_maintenance_boundary
        grounds:
          - calculations.margin_mark_to_market
          - state_machines.HedgePosition.OPEN_to_MARGIN_CALL
          - state_machines.HedgePosition.OPEN_to_OPEN
          - entities.HedgePosition.fields.status
        distinguishing_aspect: |
          Numeric threshold metric on the mark endpoint: the maintenance test is
          STRICT < . A SHORT 3-contract position entered at 4.50, posted 6000,
          marked to exactly 4.60 yields equity 4500 == maintenance 4500 -> stays
          OPEN (no call); marked to 4.61 yields equity 4350 < 4500 -> MARGIN_CALL.
          Equal does NOT trigger.
        test_recipe:
          setup:
            - "CORN commodity (futures_contract_bushels 5000)."
            - "A SHORT HedgePosition, 3 contracts, entry 4.50, posted_margin 6000, OPEN."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/hedge-positions"
              payload: { commodity_id: "${corn_id}", side: "SHORT", contracts: 3, entry_futures_price: 4.50 }
              as: RiskManager
              captures: { hp_b_id: $.data.id }
          trigger:
            - call: "POST /commodities/hedge-positions/${hp_b_id}/mark"
              payload: { mark_futures_price: 4.60 }
              as: RiskManager
              captures: { st_eq: $.data.status, eq: $.data.account_equity_dollars }
          assert:
            - "After mark 4.60: HedgePosition.${hp_b_id}.account_equity_dollars == 4500.00 and status == OPEN (equity == maintenance, strict < does not trigger)"
            - "A subsequent mark to 4.61 on the same position yields account_equity_dollars == 4350.00 and status == MARGIN_CALL (now strictly below 4500)"

      - name: empty_patronage_pool_zero_bushels_boundary
        grounds:
          - validations[priority=15]
          - errors[ERR_EMPTY_PATRONAGE_POOL]
          - state_machines.PatronagePeriod.OPEN_to_CLOSED
          - entities.PatronagePeriod.fields.total_bushels
        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint: an empty-set/zero-count edge
          on patronage close. When NO member has net_priced_bushels > 0, total
          net_priced_bushels == 0 and close is rejected with
          ERR_EMPTY_PATRONAGE_POOL — the zero-bushel boundary, not a numeric
          threshold crossing.
        test_recipe:
          setup:
            - "A member created but with no SETTLED settlements -> net_priced_bushels 0."
            - "An OPEN PatronagePeriod pool 10000, qualified_cash_pct 0.20."
          setup_api_calls:
            - call: "POST /commodities/members"
              payload: { name: "Jo Farm" }
              as: Merchandiser
              captures: { m_j_id: $.data.id }
            - call: "POST /commodities/patronage-periods"
              payload: { label: "FY2026", pool_dollars: 10000, qualified_cash_pct: 0.20 }
              as: Merchandiser
              captures: { pp_j_id: $.data.id }
          trigger:
            - call: "POST /commodities/patronage-periods/${pp_j_id}/close"
              payload: {}
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_EMPTY_PATRONAGE_POOL"
            - "PatronagePeriod.${pp_j_id}.status == OPEN (unchanged)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: settlement_post_requires_contract_priced_state
        grounds:
          - validations[priority=9]
          - errors[ERR_CONTRACT_NOT_PRICED]
          - state_machines.Settlement.DRAFT_to_SETTLED
          - state_machines.Contract.OPEN_to_PRICED
          - entities.Contract.fields.status
        distinguishing_aspect: |
          Entity pair Settlement->Contract: a Settlement's DRAFT->SETTLED
          transition is gated on the linked Contract's state (must be PRICED, or
          FORWARD with both legs fixed). Posting a settlement whose CASH contract
          is still OPEN (unpriced) is rejected with ERR_CONTRACT_NOT_PRICED.
        test_recipe:
          setup:
            - "CORN commodity; current board futures 4.80 basis -0.10."
            - "A clean 1000-bushel CORN position (member K) and an OPEN (never fixed) CASH contract on CORN, same member/commodity."
            - "A DRAFT settlement of 500 bushels against that unpriced contract."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "Kit Farm" }
              as: Merchandiser
              captures: { m_k_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_k_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_k_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_k_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_k_id: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_k_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_k_id: $.data.id }
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_k_id}", storage_position_id: "${pos_k_id}", priced_bushels: 500, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { s_k_id: $.data.id }
            - call: "GET /commodities/storage-positions/${pos_k_id}"
              payload: {}
              as: SettlementOfficer
              captures: { pos_k_v: $.data.version }
          trigger:
            - call: "POST /commodities/settlements/${s_k_id}/post"
              payload: { expected_storage_position_version: "${pos_k_v}" }
              as: SettlementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_CONTRACT_NOT_PRICED"
            - "Contract.${c_k_id}.status == OPEN and Settlement.${s_k_id}.status == DRAFT (both unchanged)"

      - name: shipment_load_requires_position_not_depleted_state
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - state_machines.Shipment.SCHEDULED_to_LOADED
          - state_machines.StoragePosition.STORED_to_DEPLETED
          - entities.StoragePosition.fields.status
        distinguishing_aspect: |
          A DIFFERENT entity pair Shipment->StoragePosition: a Shipment's
          SCHEDULED->LOADED transition is gated on the linked StoragePosition's
          status being IN {STORED, CHARGE_FROZEN}. Loading a shipment against a
          position already DEPLETED by a prior full load-out is rejected with
          ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "CORN commodity; a clean 1000-bushel WAREHOUSE_RECEIPT position (member L); a loadout bay."
            - "A first shipment of all 1000 bushels SCHEDULED then LOADED -> position DEPLETED."
            - "A second shipment of 1 bushel SCHEDULED against the now-DEPLETED position on a non-overlapping bay window."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Lou Farm" }
              as: Merchandiser
              captures: { m_l_id: $.data.id }
            - call: "POST /commodities/loadout-bays"
              payload: { name: "BAY-1" }
              as: Merchandiser
              captures: { bay_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_l_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "WAREHOUSE_RECEIPT", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_l_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_l_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_l_id: $.data.storage_position_id }
            - call: "POST /commodities/shipments"
              payload: { commodity_id: "${corn_id}", storage_position_id: "${pos_l_id}", loadout_bay_id: "${bay_id}", bushels: 1000, bay_window_start: "2026-02-01T08:00:00Z", bay_window_end: "2026-02-01T10:00:00Z" }
              as: ShippingClerk
              captures: { sh1_id: $.data.id }
            - call: "POST /commodities/shipments/${sh1_id}/load"
              payload: {}
              as: ShippingClerk
            - call: "POST /commodities/shipments"
              payload: { commodity_id: "${corn_id}", storage_position_id: "${pos_l_id}", loadout_bay_id: "${bay_id}", bushels: 1, bay_window_start: "2026-02-01T12:00:00Z", bay_window_end: "2026-02-01T13:00:00Z" }
              as: ShippingClerk
              captures: { sh2_id: $.data.id }
          trigger:
            - call: "POST /commodities/shipments/${sh2_id}/load"
              payload: {}
              as: ShippingClerk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "StoragePosition.${pos_l_id}.status == DEPLETED and Shipment.${sh2_id}.status == SCHEDULED (unchanged)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_window_half_open_touching_allowed_overlap_rejected
        grounds:
          - calculations.interval_overlap
          - validations[priority=16]
          - errors[ERR_RESOURCE_WINDOW_CONFLICT]
          - entities.Shipment.fields.bay_window_start
          - entities.Shipment.fields.bay_window_end
        distinguishing_aspect: |
          LoadoutBay interval geometry is HALF-OPEN [start, end): a new window
          touching an existing one at the boundary (existing ends 10:00, new
          starts 10:00) is ACCEPTED, but a strictly overlapping window (new
          09:30-10:30 over existing 08:00-10:00) is rejected with
          ERR_RESOURCE_WINDOW_CONFLICT. Touching allowed distinguishes this from
          the dryer geometry.
        test_recipe:
          setup:
            - "CORN commodity; a clean 1000-bushel WAREHOUSE_RECEIPT position (member M); a loadout bay BAY-1."
            - "An existing SCHEDULED shipment of 10 bushels occupying BAY-1 [08:00, 10:00)."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Moe Farm" }
              as: Merchandiser
              captures: { m_m_id: $.data.id }
            - call: "POST /commodities/loadout-bays"
              payload: { name: "BAY-1" }
              as: Merchandiser
              captures: { bay_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_m_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "WAREHOUSE_RECEIPT", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_m_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_m_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_m_id: $.data.storage_position_id }
            - call: "POST /commodities/shipments"
              payload: { commodity_id: "${corn_id}", storage_position_id: "${pos_m_id}", loadout_bay_id: "${bay_id}", bushels: 10, bay_window_start: "2026-02-01T08:00:00Z", bay_window_end: "2026-02-01T10:00:00Z" }
              as: ShippingClerk
              captures: { sh_base_id: $.data.id }
            - call: "POST /commodities/shipments"
              payload: { commodity_id: "${corn_id}", storage_position_id: "${pos_m_id}", loadout_bay_id: "${bay_id}", bushels: 10, bay_window_start: "2026-02-01T10:00:00Z", bay_window_end: "2026-02-01T11:00:00Z" }
              as: ShippingClerk
              captures: { sh_touch_id: $.data.id }
          trigger:
            - call: "POST /commodities/shipments"
              payload: { commodity_id: "${corn_id}", storage_position_id: "${pos_m_id}", loadout_bay_id: "${bay_id}", bushels: 10, bay_window_start: "2026-02-01T09:30:00Z", bay_window_end: "2026-02-01T10:30:00Z" }
              as: ShippingClerk
              captures: { err: $.data.error_id }
          assert:
            - "The touching window [10:00, 11:00) created successfully (Shipment.${sh_touch_id}.status == SCHEDULED) — half-open boundary does not conflict"
            - "The overlapping window [09:30, 10:30) is rejected: response status == 409, data.error_id == ERR_RESOURCE_WINDOW_CONFLICT"

      - name: dryer_window_closed_buffer_touching_rejected
        grounds:
          - calculations.interval_overlap
          - validations[priority=17]
          - errors[ERR_RESOURCE_WINDOW_CONFLICT]
          - entities.DryerLine.fields.cleanout_buffer_minutes
          - entities.DryingReservation.fields.window_start
          - entities.DryingReservation.fields.window_end
        distinguishing_aspect: |
          A DIFFERENT resource (DryerLine) with DIFFERENT interval arithmetic:
          CLOSED [start, end] plus a mandatory cleanout buffer. With buffer 30
          min and an existing RESERVED window [10:00, 11:00], a new window
          starting at 11:00 (touching) and at 11:20 (within buffer) are BOTH
          rejected, while [11:31, 12:30] (separated by >30 min) is accepted —
          touching is rejected, unlike the bay geometry.
        test_recipe:
          setup:
            - "CORN commodity; member N with two WEIGHED CORN tickets (wet loads)."
            - "A DryerLine DRYER-A with cleanout_buffer_minutes 30."
            - "An existing RESERVED drying window [10:00, 11:00] on DRYER-A."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "Ned Farm" }
              as: Merchandiser
              captures: { m_n_id: $.data.id }
            - call: "POST /commodities/dryer-lines"
              payload: { name: "DRYER-A", cleanout_buffer_minutes: 30 }
              as: Merchandiser
              captures: { dl_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_n_id}", commodity_id: "${corn_id}", gross_weight_lbs: 58000, tare_weight_lbs: 18000, moisture_pct: 18.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_n1_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_n_id}", commodity_id: "${corn_id}", gross_weight_lbs: 58000, tare_weight_lbs: 18000, moisture_pct: 18.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_n2_id: $.data.id }
            - call: "POST /commodities/drying-reservations"
              payload: { dryer_line_id: "${dl_id}", scale_ticket_id: "${tk_n1_id}", window_start: "2026-02-01T10:00:00Z", window_end: "2026-02-01T11:00:00Z" }
              as: GradeClerk
              captures: { dr_base_id: $.data.id }
          trigger:
            - call: "POST /commodities/drying-reservations"
              payload: { dryer_line_id: "${dl_id}", scale_ticket_id: "${tk_n2_id}", window_start: "2026-02-01T11:00:00Z", window_end: "2026-02-01T11:45:00Z" }
              as: GradeClerk
              captures: { err: $.data.error_id }
          assert:
            - "The touching window [11:00, 11:45] is rejected: response status == 409, data.error_id == ERR_RESOURCE_WINDOW_CONFLICT (within the 30-min cleanout buffer of the [10:00,11:00] window)"
            - "A window [11:31, 12:30] on the same line for tk_n2 created successfully (separated by >30 minutes from the 11:00 end)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bushels_conserved_grade_in_equals_drawn_plus_available
        grounds:
          - entities.StoragePosition.fields.bushels
          - entities.StoragePosition.fields.bushels_available
          - state_machines.Settlement.DRAFT_to_SETTLED
          - state_machines.Shipment.SCHEDULED_to_LOADED
          - entities.Contract.fields.priced_bushels
        distinguishing_aspect: |
          Conserved quantity #1: physical bushels. The invariant
          StoragePosition.bushels == StoragePosition.bushels_available + (bushels
          drawn by SETTLED settlements) + (bushels drawn by LOADED/SHIPPED
          shipments) MUST hold exactly. Grading 1000 bushels then settling 600
          leaves bushels_available 400 with bushels still 1000 — no bushel is
          created or lost.
        test_recipe:
          setup:
            - "CORN commodity; current board futures 4.80 basis -0.10."
            - "A clean 1000-bushel DELAYED_PRICE position (member O); a PRICED CASH contract for 1000 bushels."
            - "A DRAFT settlement of 600 priced_bushels, posted."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${corn_id}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "Ona Farm" }
              as: Merchandiser
              captures: { m_o_id: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${m_o_id}", commodity_id: "${corn_id}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk_o_id: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk_o_id}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos_o_id: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${m_o_id}", commodity_id: "${corn_id}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { c_o_id: $.data.id }
            - call: "POST /commodities/contracts/${c_o_id}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${c_o_id}", storage_position_id: "${pos_o_id}", priced_bushels: 600, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { s_o_id: $.data.id }
            - call: "GET /commodities/storage-positions/${pos_o_id}"
              payload: {}
              as: SettlementOfficer
              captures: { pos_o_v: $.data.version }
          trigger:
            - call: "POST /commodities/settlements/${s_o_id}/post"
              payload: { expected_storage_position_version: "${pos_o_v}" }
              as: SettlementOfficer
          assert:
            - "StoragePosition.${pos_o_id}.bushels == 1000.0000 (deposited amount unchanged)"
            - "StoragePosition.${pos_o_id}.bushels_available == 400.0000"
            - "Contract.${c_o_id}.priced_bushels == 600 — bushels invariant holds: 1000 == 400 + 600 drawn"

      - name: hedge_equity_conserved_mark_then_meet_call
        grounds:
          - calculations.margin_mark_to_market
          - entities.HedgePosition.fields.posted_margin_dollars
          - entities.HedgePosition.fields.unrealized_pnl_dollars
          - entities.HedgePosition.fields.account_equity_dollars
          - state_machines.HedgePosition.MARGIN_CALL_to_OPEN
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: account equity. The invariant
          account_equity_dollars == posted_margin_dollars + unrealized_pnl_dollars
          MUST hold after every mark and every meet-call. After mark 4.80 (pnl
          -4500, posted 6000 -> equity 1500) and a 4500 deposit (posted 10500 ->
          equity 6000), the identity still balances exactly with zero drift.
        test_recipe:
          setup:
            - "CORN commodity (futures_contract_bushels 5000)."
            - "A SHORT HedgePosition, 3 contracts, entry 4.50, posted 6000, OPEN; marked to 4.80 into MARGIN_CALL (call 4500)."
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { corn_id: $.data.id }
            - call: "POST /commodities/hedge-positions"
              payload: { commodity_id: "${corn_id}", side: "SHORT", contracts: 3, entry_futures_price: 4.50 }
              as: RiskManager
              captures: { hp_q_id: $.data.id }
            - call: "POST /commodities/hedge-positions/${hp_q_id}/mark"
              payload: { mark_futures_price: 4.80 }
              as: RiskManager
            - call: "GET /commodities/hedge-positions/${hp_q_id}"
              payload: {}
              as: RiskManager
              captures: { hp_q_v: $.data.version }
          trigger:
            - call: "POST /commodities/hedge-positions/${hp_q_id}/meet-call"
              payload: { deposit_dollars: 4500, expected_hedge_position_version: "${hp_q_v}" }
              as: RiskManager
          assert:
            - "After mark: account_equity_dollars == 1500.00 == posted_margin_dollars 6000.00 + unrealized_pnl_dollars -4500.00"
            - "After meet-call deposit 4500: posted_margin_dollars == 10500.00, unrealized_pnl_dollars == -4500.00, account_equity_dollars == 6000.00 (identity holds, no drift)"
            - "HedgePosition.${hp_q_id}.margin_call_dollars == 0 and status == OPEN"
