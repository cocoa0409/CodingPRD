# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog  (32 codes)
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the called endpoint"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path id, or a foreign-key id supplied in the request body, does not resolve to an existing row"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, enum value outside the declared member set, numeric value outside its declared range, or a datetime pair whose end is not strictly after its start"
  - id: ERR_RECORD_FROZEN
    http: 409
    condition: "A write was attempted against a patient whose records_frozen is true and the operation is not one of the five permitted post-death operations"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row is not in a from-state that the requested transition declares, including promotion from escalation tier ESCALATION_TIER_MAX"
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not equal the patient's current version on document execution"
  - id: ERR_STALE_CARE_PLAN_VERSION
    http: 412
    condition: "expected_care_plan_version does not equal the plan's current version on revision creation"
  - id: ERR_STALE_ELECTION_VERSION
    http: 412
    condition: "expected_election_version does not equal the election's current version on benefit-period creation"
  - id: ERR_REFERRAL_INELIGIBLE
    http: 422
    condition: "A referral was accepted while its triage_score is strictly below REFERRAL_ACCEPT_MIN_SCORE"
  - id: ERR_REREFERRAL_LIMIT
    http: 409
    condition: "A RE_REFER decision was requested while re_referral_count has already reached MAX_REREFERRALS"
  - id: ERR_WITNESS_CONFLICT
    http: 422
    condition: "A WITNESS signature was supplied by the attending clinician, by a designated surrogate, or by a beneficiary of the patient's estate"
  - id: ERR_EXECUTION_REQUIREMENT_UNMET
    http: 422
    condition: "The jurisdiction's witness or notary signature requirement is not satisfied at execution time"
  - id: ERR_SIGNATURE_INCOMPLETE
    http: 422
    condition: "A POLST was executed without both a signing-physician signature and a patient-or-surrogate signature"
  - id: ERR_CODE_STATUS_LADDER_VIOLATION
    http: 422
    condition: "A code-status order moves more than MAX_LADDER_STEP_PER_ORDER rungs at once, or re-escalates while the patient lacks capacity or while the request was surrogate-stated"
  - id: ERR_GOALS_CONFLICT
    http: 409
    condition: "An attestation was submitted against an order parked in CONFLICT_HOLD without a conflict_resolution_note"
  - id: ERR_SURROGATE_HIERARCHY_EMPTY
    http: 422
    condition: "A family conference must resolve a surrogate for a patient who lacks capacity, but no ACTIVE designation exists"
  - id: ERR_NOT_AUTHORIZED_DECISION_MAKER
    http: 422
    condition: "The supplied decision_maker_id is not the highest-ranked ACTIVE surrogate, or a surrogate was supplied for a patient who has capacity"
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "A note attestation was submitted against a conference whose recorded roster failed the interdisciplinary quorum"
  - id: ERR_ATTESTATION_WINDOW_EXPIRED
    http: 422
    condition: "A note attestation arrived after the conference's attestation_due_at"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The clinician attesting a medication order is the same user who prescribed it"
  - id: ERR_DUPLICATE_CERTIFIER
    http: 422
    condition: "The second hospice certification was supplied by the same user as the first"
  - id: ERR_MME_REVIEW_REQUIRED
    http: 422
    condition: "A refill was requested on an order parked in REVIEW_REQUIRED by the daily-MME threshold"
  - id: ERR_EARLY_REFILL
    http: 422
    condition: "A refill was requested before next_refill_allowed_at"
  - id: ERR_SCHEDULE_CONFLICT
    http: 409
    condition: "A DME delivery window intersects another open order on the same inventory item, or a conference leaves less than CONFERENCE_BUFFER_MINUTES of gap from another conference on the same patient"
  - id: ERR_PRIOR_AUTH_REQUIRED
    http: 422
    condition: "A DME order still in PENDING_AUTH was pushed to SCHEDULED without an authorization"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "The requested quantity exceeds the inventory item's available_units"
  - id: ERR_IDT_CADENCE_LAPSED
    http: 422
    condition: "A benefit period was opened while the patient has no ATTESTED interdisciplinary conference within IDT_CADENCE_MAX_DAYS"
  - id: ERR_FACE_TO_FACE_WINDOW
    http: 422
    condition: "A benefit period at or beyond FACE_TO_FACE_MIN_PERIOD_NUMBER was opened without a face-to-face encounter inside the bounded window before period_start"
  - id: ERR_INSUFFICIENT_DOCUMENTED_TIME
    http: 422
    condition: "A claim was created with documented_minutes below ACP_FIRST_UNIT_MIN_MINUTES"
  - id: ERR_CONCURRENT_CARE_OVERLAP
    http: 409
    condition: "A claim's service_date falls inside an elected hospice benefit period without a carve-out agreed on both the claim and the election"
  - id: ERR_ATTESTATION_REQUIRED
    http: 422
    condition: "A claim citing a conference was attested before that conference's disciplines had all attested their notes"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: IntakeCoordinator
    description: "Registers patients and works the referral queue."
    identity: "opaque"
    exclusive_operations:
      - "POST /palliative/patients"
      - "POST /palliative/referrals"
      - "POST /palliative/referrals/{id}/decision"
    shared_operations:
      - "GET /palliative/patients/{id}"
      - "GET /palliative/patients/{id}/referrals"

  - name: PalliativePhysician
    description: "Attending palliative clinician; prescribes, executes documents, determines capacity and pronounces death."
    identity: "opaque"
    exclusive_operations:
      - "POST /palliative/patients/{id}/capacity-determinations"
      - "POST /palliative/patients/{id}/death-events"
      - "POST /palliative/advance-care-documents/{id}/execute"
      - "POST /palliative/advance-care-documents/{id}/revoke"
      - "POST /palliative/code-status-orders"
      - "POST /palliative/medication-orders"
      - "POST /palliative/medication-orders/{id}/discontinue"
    shared_operations:
      - "POST /palliative/advance-care-documents"
      - "POST /palliative/advance-care-documents/{id}/signatures"
      - "POST /palliative/code-status-orders/{id}/attestations"
      - "POST /palliative/medication-orders/{id}/attestations"
      - "POST /palliative/conferences/{id}/attestations"
      - "POST /palliative/hospice-elections"
      - "POST /palliative/hospice-elections/{id}/certifications"

  - name: PalliativeNurse
    description: "Runs care plans, symptom triage, medication verification and equipment logistics."
    identity: "opaque"
    exclusive_operations:
      - "POST /palliative/care-plans/{id}/activate"
      - "POST /palliative/care-plans/{id}/revisions"
