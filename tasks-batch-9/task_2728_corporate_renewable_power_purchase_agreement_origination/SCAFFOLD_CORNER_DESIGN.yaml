      - name: settlement_periods_abut_freely_but_may_not_intersect_or_invert
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SETTLEMENT_PERIOD_OVERLAP]
          - errors[ERR_INVALID_WINDOW]
          - validations.priority_23_ERR_SETTLEMENT_PERIOD_OVERLAP
          - validations.priority_17_ERR_INVALID_WINDOW
          - endpoints.POST_/ppa/deals/{id}/settlement-periods
        distinguishing_aspect: |
          Settlement periods use HALF-OPEN [start, end) collision semantics - the exact
          opposite convention from RiskEvent claim windows - so a period beginning at the
          precise instant an existing period ends is ACCEPTED, while a period that merely
          straddles or entirely CONTAINS an existing one is refused with 409. The
          well-formedness rule at priority 17 outranks the collision rule at 23, so an
          inverted window that would also have collided reports ERR_INVALID_WINDOW with
          422 rather than ERR_SETTLEMENT_PERIOD_OVERLAP with 409, and the two failures
          also differ in HTTP status, not just error id. period_end == period_start is
          rejected because the rule is strict (period_end > period_start), even though a
          zero-length window could never intersect anything.
