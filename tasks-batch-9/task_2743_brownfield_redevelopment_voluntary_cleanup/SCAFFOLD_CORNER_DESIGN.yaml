  # ===========================================================================
  # §1.6 Errors — every catalogued code must be triggerable. The codes already
  # exercised by §1.8 and by the sections above are not repeated here; these
  # instances close the remaining gaps in the 70-code catalog.
  # ===========================================================================
  - section: errors
    instances:

      - name: every_declared_not_found_code_is_triggerable_by_an_unknown_id
        claim_type: triggerability
        grounds:
          - validations[4]
          - errors[ERR_PARTY_NOT_FOUND]
          - errors[ERR_FINDING_NOT_FOUND]
          - errors[ERR_GOAL_NOT_FOUND]
          - errors[ERR_OBLIGATION_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_CONTROL_NOT_FOUND]
          - errors[ERR_AWARD_NOT_FOUND]
          - errors[ERR_LETTER_NOT_FOUND]
          - errors[ERR_EVENT_NOT_FOUND]
        distinguishing_aspect: "Each retrieval route names its own resource kind rather than a generic 404: eleven GETs with unknown ids return eleven distinct error_id values, so a shared ERR_SITE_NOT_FOUND fallback would fail ten of them."
        test_recipe:
          setup:
            - "Only the logical clock is set; no rows of any kind exist."
          setup_api_calls:
