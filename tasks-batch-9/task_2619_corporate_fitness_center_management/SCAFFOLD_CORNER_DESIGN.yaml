  # ===========================================================================
  # 9. Consistency model (§1.0 consistency_model == immediate).
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: contract_approval_and_rollups_are_readable_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ClientContract.PENDING_CLIENT_APPROVAL_to_ACTIVE.side_effects
          - entities.ClientContract.fields.eligible_member_count
        distinguishing_aspect: |
          Nothing in this API is eventually consistent, and that includes computed
          rollups: the response to the APPROVE call already carries status ACTIVE
          and approved_at, the immediately following GET agrees with it byte for
          byte, and a member VERIFY is reflected in the parent contract's
          eligible_member_count on the very next read — no polling, no background
          job, no second request needed to make the effect appear.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; a COST_PLUS contract with a verified SITE_MANAGER, SUBMITted so it sits in PENDING_CLIENT_APPROVAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
          trigger:
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "GET /client-contracts/${c_id}"
              payload: {}
              as: OperatorAdmin
              captures: { c_ver: $.data.version }
            - call: "POST /members"
              payload: { contract_id: "${c_id}", member_class: "EMPLOYEE", full_name: "Iris Okafor", employee_number: "E-1001" }
              as: ClientSponsor
              as_user_id: "${c_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/eligibility-decisions"
              payload: { action: "VERIFY" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "GET /client-contracts/${c_id}"
              payload: {}
              as: OperatorAdmin
              captures: { c_ver2: $.data.version }
          assert:
            - "The APPROVE response itself has data.status == \"ACTIVE\" AND data.approved_at == \"2026-08-01T00:00:00Z\""
            - "The immediately following GET /client-contracts/${c_id} returns the same status \"ACTIVE\" and the same approved_at — one round trip, no retry"
            - "GET /client-contracts/${c_id} right after the member VERIFY -> data.eligible_member_count == 1 (it was 0 in the read taken before the member existed)"
            - "GET /members?contract_id=${c_id}&eligibility_status=ELIGIBLE -> total_count == 1 in the same instant"
            - "${c_ver2} != ${c_ver} — every visible effect is accompanied by a version the next writer must present"
