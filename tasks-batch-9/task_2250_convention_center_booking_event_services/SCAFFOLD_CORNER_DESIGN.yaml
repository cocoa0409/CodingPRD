            - "every response reports data.status == TENTATIVE and data.order_posture == OPEN"
            - "GET /convention-center/bookings as Licensee with X-User-ID ${cl_ssp_id} returns 403 with data.error_id == ERR_FORBIDDEN_ROLE"

      - name: settlement_issuer_finalizing_the_same_settlement_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=46]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.EventSettlement.fields.issued_by_user_id
          - entities.EventSettlement.fields.finalized_by_user_id
          - complexity_profile.role_model
        distinguishing_aspect: |
          Both actors carry the SettlementAnalyst role, so the check is on X-User-ID rather
          than on role membership, and it sits at priority 46, ahead of the dispute-window
          gates at 81 and 82. The clock is already past dispute_deadline_utc, so the timing
          is impeccable and the only defect is that analyst-1 issued the figure it is now
          signing off. The very same call from analyst-2 succeeds and applies the deposit.
