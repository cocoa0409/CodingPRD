scaffold_corner_design:

  # ==========================================================================
  # Section: entities (creation, retrieval, listing, required fields, defaults,
  # computed/system fields, type constraints, FK integrity)
  # ==========================================================================
  - section: entities
    instances:
      - name: category_creation_required_fields
        claim_type: required_fields
        grounds:
          - "entities.Category"
          - "endpoints.\\\"POST /nabs/categories\\\""
        distinguishing_aspect: "Creating a Category without required 'code' returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nabs/categories"
              payload: { display_name: "No Code" }
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_INVALID_REQUEST'"

      - name: category_compliance_class_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Category.fields.compliance_class"
          - "endpoints.\\\"POST /nabs/categories\\\""
        distinguishing_aspect: "Passing an out-of-enum compliance_class ('BOOZY') is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nabs/categories"
              payload: { code: "bad", display_name: "Bad", compliance_class: "BOOZY" }
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_INVALID_REQUEST'"

      - name: sku_abv_above_500_rejected
        claim_type: type_constraints
        grounds:
          - "entities.SKU.fields.abv_basis_points"
          - "endpoints.\\\"POST /nabs/skus\\\""
        distinguishing_aspect: "SKU creation with abv_basis_points > 500 is rejected at input validation with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Category exists"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "t-skua", display_name: "T", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
          trigger:
            - call: "POST /nabs/skus"
              payload: { category_id: "${cid}", sku_code: "s-501", title: "S", base_price_cents: 100, abv_basis_points: 501 }
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_INVALID_REQUEST'"

      - name: member_age_attestation_status_defaults_to_unverified
        claim_type: defaults
        grounds:
          - "entities.Member.fields.age_attestation_status"
        distinguishing_aspect: "Newly registered Member has age_attestation_status == UNVERIFIED and loyalty_tier == BRONZE, balance == 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nabs/members"
              payload: { email: "def@x.com", full_name: "Def", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                st: "$.data.age_attestation_status"
                tier: "$.data.loyalty_tier"
                bal: "$.data.loyalty_points_balance"
          assert:
            - "captured st == 'UNVERIFIED'"
            - "captured tier == 'BRONZE'"
            - "captured bal == 0"

      - name: category_not_found
        claim_type: not_found
        grounds:
          - "endpoints.\\\"GET /nabs/categories/{id}\\\""
        distinguishing_aspect: "GET with random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /nabs/categories/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_NOT_FOUND'"

      - name: member_email_uniqueness
        claim_type: type_constraints
        grounds:
          - "entities.Member.fields.email"
          - "\"validations[priority=12\"]"
        distinguishing_aspect: "Second POST with same email returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Member m1 exists"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "dup@x.com", full_name: "D1", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nabs/members"
              payload: { email: "dup@x.com", full_name: "D2", date_of_birth: "1991-01-01", home_state_code: "WA" }
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_DUPLICATE'"

      - name: inventory_lot_unique_sku_lot_code
        claim_type: type_constraints
        grounds:
          - "entities.InventoryLot.fields.lot_code"
          - "\"validations[priority=12\"]"
        distinguishing_aspect: "Two lots with same (sku_id, lot_code) -> second fails ERR_DUPLICATE."
        test_recipe:
          setup: ["Category, SKU, one lot LC=X"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tc", display_name: "TC", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cid}", sku_code: "sc", title: "SC", base_price_cents: 100, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sid: "$.data.id"
            - call: "POST /nabs/skus/${sid}/lots"
              payload: { lot_code: "X", qty_received: 5, unit_cost_cents: 10, expires_on: "2027-01-01" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nabs/skus/${sid}/lots"
              payload: { lot_code: "X", qty_received: 5, unit_cost_cents: 10, expires_on: "2027-01-02" }
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_DUPLICATE'"

      - name: order_line_computed_unit_price_ignores_input
        claim_type: computed_fields
        grounds:
          - "entities.OrderLine.fields.unit_price_cents"
          - "entities.OrderLine.fields.extended_price_cents"
        distinguishing_aspect: "OrderLine unit_price_cents and extended_price_cents are computed by server; client cannot set them."
        test_recipe:
          setup: ["Category, SKU base=700, lot, Member"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "cc", display_name: "CC", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cid}", sku_code: "sc2", title: "S", base_price_cents: 700, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sid: "$.data.id"
            - call: "POST /nabs/skus/${sid}/lots"
              payload: { lot_code: "L", qty_received: 10, unit_cost_cents: 100, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "mcc@x.com", full_name: "MCC", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                mid: "$.data.id"
            - call: "POST /nabs/orders"
              payload: { member_id: "${mid}", channel: "RETAIL" }
              as: Member
              as_user_id: "${mid}"
              captures:
                oid: "$.data.id"
          trigger:
            - call: "POST /nabs/orders/${oid}/lines"
              payload: { sku_id: "${sid}", qty: 2 }
              as: Member
              as_user_id: "${mid}"
              captures:
                unit: "$.data.unit_price_cents"
                ext: "$.data.extended_price_cents"
          assert:
            - "captured unit == 700"
            - "captured ext == 1400"

      - name: system_fields_id_created_at_version_assigned
        claim_type: system_fields
        grounds:
          - "entities.Category"
        distinguishing_aspect: "Server assigns id (UUID), created_at (ISO 8601), version=1 on creation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nabs/categories"
              payload: { code: "sysf", display_name: "SysF", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
                cts: "$.data.created_at"
                cver: "$.data.version"
          assert:
            - "captured cid matches UUID shape"
            - "captured cts == '2026-05-01T00:00:00.000Z' (logical clock used)"
            - "captured cver == 1"

  # ==========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial state
  # ==========================================================================
  - section: state_machines
    instances:
      - name: order_cannot_pack_from_draft
        claim_type: invalid_transition
        grounds:
          - "state_machines.Order"
        distinguishing_aspect: "POST /pack on DRAFT order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member, Category, SKU, lot; DRAFT Order (not submitted)"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "cs", display_name: "CS", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cid}", sku_code: "ss", title: "SS", base_price_cents: 100, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sid: "$.data.id"
            - call: "POST /nabs/skus/${sid}/lots"
              payload: { lot_code: "L", qty_received: 5, unit_cost_cents: 10, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "ms@x.com", full_name: "MS", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                mid: "$.data.id"
            - call: "POST /nabs/orders"
              payload: { member_id: "${mid}", channel: "RETAIL" }
              as: Member
              as_user_id: "${mid}"
              captures:
                oid: "$.data.id"
          trigger:
            - call: "POST /nabs/orders/${oid}/pack"
              as: ShopStaff
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_INVALID_STATE'"

      - name: tasting_event_terminal_completed_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.TastingEvent"
        distinguishing_aspect: "Once COMPLETED, no further transitions allowed (cancel returns ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Event COMPLETED via clock walk"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "ct", display_name: "CT", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cid}", sku_code: "st", title: "ST", base_price_cents: 100, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sid: "$.data.id"
            - call: "POST /nabs/skus/${sid}/lots"
              payload: { lot_code: "L", qty_received: 5, unit_cost_cents: 10, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "ht@x.com", full_name: "HT", date_of_birth: "1980-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                host: "$.data.id"
            - call: "POST /nabs/tasting-events"
              payload: { title: "TE", host_member_id: "${host}", starts_at: "2026-05-02T10:00:00Z", ends_at: "2026-05-02T12:00:00Z", capacity: 2, flight_price_cents: 1000, min_attendee_age_years: 0 }
              as: ShopStaff
              captures:
                eid: "$.data.id"
            - call: "POST /nabs/tasting-events/${eid}/flight-items"
              payload: { sku_id: "${sid}", pour_size_ml: 30, sequence_no: 1 }
              as: ShopStaff
            - call: "POST /nabs/tasting-events/${eid}/publish"
              as: ShopStaff
            # Walk clock through starts_at then ends_at — no seats booked, event completes
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T13:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nabs/tasting-events/${eid}/cancel"
              as: ShopStaff
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_INVALID_STATE'"

      - name: shipment_terminal_delivered_no_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Shipment"
        distinguishing_aspect: "After DELIVERED, mark-lost returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order delivered end-to-end"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "csh", display_name: "CSH", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cid}", sku_code: "ssh", title: "SSH", base_price_cents: 500, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sid: "$.data.id"
            - call: "POST /nabs/skus/${sid}/lots"
              payload: { lot_code: "L", qty_received: 5, unit_cost_cents: 100, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "msh@x.com", full_name: "MSH", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                mid: "$.data.id"
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "CA", allows_dtc: true, min_age_years: 0, abv_cap_basis_points: 500, surcharge_cents_per_order: 0, tax_rate_bps: 0 }
              as: PlatformAdmin
            - call: "POST /nabs/orders"
              payload: { member_id: "${mid}", channel: "DTC", ship_to_state_code: "CA" }
              as: Member
              as_user_id: "${mid}"
              captures:
                oid: "$.data.id"
            - call: "POST /nabs/orders/${oid}/lines"
              payload: { sku_id: "${sid}", qty: 1 }
              as: Member
              as_user_id: "${mid}"
            - call: "GET /nabs/orders/${oid}"
              as: Member
              as_user_id: "${mid}"
              captures:
                ov: "$.data.version"
            - call: "POST /nabs/orders/${oid}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Member
              as_user_id: "${mid}"
            - call: "POST /nabs/orders/${oid}/pack"
              as: ShopStaff
            - call: "POST /nabs/orders/${oid}/shipments"
              payload: { carrier: "UPS", tracking_no: "T", shipped_on: "2026-05-02" }
              as: ShopStaff
              captures:
                shid: "$.data.id"
            - call: "POST /nabs/shipments/${shid}/mark-in-transit"
              as: ShopStaff
            - call: "POST /nabs/shipments/${shid}/mark-out-for-delivery"
              as: ShopStaff
            - call: "POST /nabs/shipments/${shid}/mark-delivered"
              payload: { delivered_on: "2026-05-05" }
              as: ShopStaff
          trigger:
            - call: "POST /nabs/shipments/${shid}/mark-lost"
              as: ShopStaff
              captures:
                err: "$.data.error_id"
          assert:
            - "captured err == 'ERR_INVALID_STATE'"

      - name: initial_state_order_draft_unpaid
        claim_type: initial_state
        grounds:
          - "state_machines.Order"
        distinguishing_aspect: "New Order starts with fulfillment_status=DRAFT and payment_status=UNPAID."
        test_recipe:
          setup: ["Member exists"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "mi@x.com", full_name: "MI", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                mid: "$.data.id"
          trigger:
            - call: "POST /nabs/orders"
              payload: { member_id: "${mid}", channel: "RETAIL" }
              as: Member
              as_user_id: "${mid}"
              captures:
                ful: "$.data.fulfillment_status"
                pay: "$.data.payment_status"
          assert:
            - "captured ful == 'DRAFT'"
            - "captured pay == 'UNPAID'"

  # ==========================================================================
  # Section: calculations — constants, precision, input set filtering
  # ==========================================================================
  - section: calculations
    instances:
      - name: loyalty_tier_gold_at_exactly_20000
        claim_type: constants_applied
        grounds:
          - "calculations.loyalty_tier_derive"
        distinguishing_aspect: "loyalty_points_lifetime == 20000 maps to GOLD (>= 20000); 19999 stays SILVER."
        test_recipe:
          setup: ["Member; engineer lifetime to 19999 then add 1"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "ct2", display_name: "CT2", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cid: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cid}", sku_code: "st2", title: "ST2", base_price_cents: 100, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sid: "$.data.id"
            - call: "POST /nabs/skus/${sid}/lots"
              payload: { lot_code: "L", qty_received: 100, unit_cost_cents: 10, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "mg@x.com", full_name: "MG", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                mid: "$.data.id"
            - call: "POST /nabs/members"
              payload: { email: "hg@x.com", full_name: "HG", date_of_birth: "1980-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                host: "$.data.id"
            # First event: flight price = 1999900 cents -> base_pts = 19999
            - call: "POST /nabs/tasting-events"
              payload: { title: "TG1", host_member_id: "${host}", starts_at: "2026-05-02T10:00:00Z", ends_at: "2026-05-02T12:00:00Z", capacity: 5, flight_price_cents: 1999900, min_attendee_age_years: 0 }
              as: ShopStaff
              captures:
                e1: "$.data.id"
            - call: "POST /nabs/tasting-events/${e1}/flight-items"
              payload: { sku_id: "${sid}", pour_size_ml: 30, sequence_no: 1 }
              as: ShopStaff
            - call: "POST /nabs/tasting-events/${e1}/publish"
              as: ShopStaff
            - call: "GET /nabs/tasting-events/${e1}"
              as: ShopStaff
              captures:
                e1v: "$.data.version"
            - call: "POST /nabs/tasting-events/${e1}/seats"
              payload: { member_id: "${mid}", expected_event_version: "${e1v}" }
              as: Member
              as_user_id: "${mid}"
              captures:
                s1: "$.data.id"
            - call: "POST /nabs/tasting-seats/${s1}/confirm"
              as: Member
              as_user_id: "${mid}"
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/tasting-seats/${s1}/check-in"
              as: ShopStaff
            - call: "GET /nabs/members/${mid}"
              as: ShopStaff
              captures:
                tier_pre: "$.data.loyalty_tier"
                life_pre: "$.data.loyalty_points_lifetime"
            # Second event: flight price = 100 cents -> base_pts = 1
            - call: "POST /nabs/tasting-events"
              payload: { title: "TG2", host_member_id: "${host}", starts_at: "2026-05-03T10:00:00Z", ends_at: "2026-05-03T12:00:00Z", capacity: 5, flight_price_cents: 100, min_attendee_age_years: 0 }
              as: ShopStaff
              captures:
                e2: "$.data.id"
            - call: "POST /nabs/tasting-events/${e2}/flight-items"
              payload: { sku_id: "${sid}", pour_size_ml: 30, sequence_no: 1 }
              as: ShopStaff
            - call: "POST /nabs/tasting-events/${e2}/publish"
              as: ShopStaff
            - call: "GET /nabs/tasting-events/${e2}"
              as: ShopStaff
              captures:
                e2v: "$.data.version"
            - call: "POST /nabs/tasting-events/${e2}/seats"
              payload: { member_id: "${mid}", expected_event_version: "${e2v}" }
              as: Member
              as_user_id: "${mid}"
              captures:
                s2: "$.data.id"
            - call: "POST /nabs/tasting-seats/${s2}/confirm"
              as: Member
              as_user_id: "${mid}"
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/tasting-seats/${s2}/check-in"
              as: ShopStaff
          trigger:
            - call: "GET /nabs/members/${mid}"
              as: ShopStaff
              captures:
                tier_post: "$.data.loyalty_tier"
                life_post: "$.data.loyalty_points_lifetime"
          assert:
            - "captured life_pre == 19999 AND tier_pre == 'SILVER'"
