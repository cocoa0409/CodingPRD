  - rule_id: non_linear_state_machine
    instances:
      - name: volunteer_parallel_dimensions_flag_reinitiate_cycle
        grounds:
          - state_machines.Volunteer
          - entities.Volunteer.fields.eligible
        distinguishing_aspect: |
          Non-linear shape on Volunteer: three parallel state dimensions evolve independently
          (training reaches COMPLETED while screening sits in FLAGGED), and the screening
          dimension cycles INITIATED -> FLAGGED -> INITIATED -> CLEARED via REINITIATE.
          eligibility is the conjunction over both dimensions plus partner state.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Partner1 ACTIVE; vol1 recruited, no credentials yet."
          setup_api_calls:
            - *clk
            - *partner1
            - *partner1_act
            - *vol1
            - call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "TRAINING", event: "BEGIN" }
              as: PartnershipManager
            - call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "SCREENING", event: "FLAG" }
              as: PartnershipManager
            - call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "TRAINING", event: "COMPLETE" }
              as: PartnershipManager
            - call: "GET /ja-programs/volunteers/${vol1_id}"
              payload: {}
              as: PartnershipManager
              captures: { mid: $.data }
          trigger:
            - call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "SCREENING", event: "REINITIATE" }
              as: PartnershipManager
              captures: { after_reinit: $.data }
            - call: "POST /ja-programs/volunteers/${vol1_id}/credential-events"
              payload: { kind: "SCREENING", event: "CLEAR" }
              as: PartnershipManager
              captures: { after_clear: $.data }
          assert:
            - "mid-chain: Volunteer.${vol1_id}.screening_status == FLAGGED while training_status == COMPLETED (parallel dimensions move independently)"
            - "mid-chain: Volunteer.${vol1_id}.eligible == false (screening FLAGGED blocks the conjunction)"
            - "REINITIATE response: screening_status == INITIATED and screening_expires_on is null (cycle back, expiry cleared)"
            - "CLEAR response: screening_status == CLEARED and screening_expires_on == 2027-09-01 (clock 2026-09-01 + 365 days)"
            - "final: eligible == true (CLEARED x COMPLETED x engagement ACTIVE x partner ACTIVE)"

      - name: agreement_amendment_ratify_and_reject_cycles
        grounds:
          - state_machines.PartnershipAgreement.ACTIVE_to_AMENDMENT_PENDING
          - state_machines.PartnershipAgreement.AMENDMENT_PENDING_to_ACTIVE
        distinguishing_aspect: |
          Non-linear shape on PartnershipAgreement: a cyclic ACTIVE <-> AMENDMENT_PENDING loop
          traversed twice with divergent side effects — RATIFY applies the pending funding change
          (250000) while REJECT discards a pending program change (program stays JA-ECO2).
          Distinct entity from the sibling instance (Volunteer).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Base territory/school; partner1 ACTIVE."
            - "Programs JA-ECO2 (5 sessions) and JA-BIZ2 (4 sessions) exist."
            - "Agreement on JA-ECO2 with pledge 200000 is ACTIVE."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - call: "POST /ja-programs/program-catalogs"
              payload: { code: "JA-ECO2", title: "Economics Essentials II", grade_band_low: 4, grade_band_high: 5, session_count: 5, minutes_per_session: 90, capstone_required: false, capstone_facility: "NONE", min_students: 10, max_students: 30 }
              as: PlatformAdmin
              captures: { prog5_id: $.data.id }
            - call: "POST /ja-programs/program-catalogs"
              payload: { code: "JA-BIZ2", title: "Biz Basics II", grade_band_low: 3, grade_band_high: 5, session_count: 4, minutes_per_session: 60, capstone_required: false, capstone_facility: "NONE", min_students: 4, max_students: 30 }
              as: PlatformAdmin
              captures: { prog4b_id: $.data.id }
            - call: "POST /ja-programs/partnership-agreements"
              payload: { school_id: "${school_id}", program_catalog_id: "${prog5_id}", sponsor_partner_id: "${partner1_id}", school_year: "2026-2027", funding_pledged_cents: 200000 }
              as: AreaDirector
              captures: { agr_id: $.data.id }
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "PROPOSE" }
              as: AreaDirector
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
          trigger:
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "PROPOSE_AMENDMENT", new_funding_pledged_cents: 250000 }
              as: AreaDirector
              captures: { amend1: $.data }
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "RATIFY_AMENDMENT" }
              as: AreaDirector
              captures: { ratified: $.data }
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "PROPOSE_AMENDMENT", new_program_catalog_id: "${prog4b_id}" }
              as: AreaDirector
              captures: { amend2: $.data }
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "REJECT_AMENDMENT" }
              as: AreaDirector
              captures: { rejected: $.data }
          assert:
            - "after PROPOSE_AMENDMENT #1: status == AMENDMENT_PENDING and pending_funding_pledged_cents == 250000"
            - "after RATIFY: status == ACTIVE, funding_pledged_cents == 250000, pending_funding_pledged_cents is null (cycle traversed with change applied)"
            - "after PROPOSE_AMENDMENT #2: status == AMENDMENT_PENDING and pending_program_catalog_id == ${prog4b_id}"
            - "after REJECT: status == ACTIVE and program_catalog_id == ${prog5_id} unchanged (cycle traversed with change discarded), pending_program_catalog_id is null"

  - rule_id: transitive_cascade
    instances:
      - name: partner_exit_cascades_volunteer_departure_session_block_delivery_recompute
        grounds:
          - state_machines.CorporatePartner.ACTIVE_to_EXITED
          - state_machines.Volunteer
          - state_machines.DeliverySession.SCHEDULED_to_NEEDS_SUBSTITUTE
          - entities.ClassroomDelivery.fields.sessions_blocked_count
        distinguishing_aspect: |
          Depth-3 cascade from partner EXIT: each link is caused by the previous link, not by the
          original trigger — partner EXITED causes volunteer DEPARTED; DEPARTED causes the
          volunteer's SCHEDULED sessions to flip NEEDS_SUBSTITUTE; that flip causes the parent
          delivery to recompute sessions_blocked_count (and bump its version). vol2 (other partner)
          is untouched. Trigger differs from the sibling instance (partner EXIT vs district CHURN).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Base territory/school; partner1 ACTIVE with eligible vol1; partner2 ACTIVE with eligible vol2."
            - "Program JA-BIZ (4 sessions, no capstone); agreement ACTIVE (pledge 175000)."
            - "Kit inventory for the office/program assembled to 20."
            - "Delivery (lead vol1, enrolled 10, required_kits 11) PLANNED with two sessions SCHEDULED for vol1 on 09-08 and 09-15."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
            - *vol1_complete
            - *partner2
            - *partner2_act
            - *vol2
            - *vol2_clear
            - *vol2_begin
            - *vol2_complete
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
            - *inv4
            - *inv4_assemble20
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room 6", teacher_email: "t6@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { del_id: $.data.id }
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "PLAN" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-08", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s1: $.data.id }
            - call: "POST /ja-programs/sessions/${s1}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-15", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s2: $.data.id }
            - call: "POST /ja-programs/sessions/${s2}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /ja-programs/corporate-partners/${partner1_id}/transition"
              payload: { action: "EXIT" }
              as: PartnershipManager
            - call: "GET /ja-programs/volunteers/${vol1_id}"
              payload: {}
              as: PartnershipManager
              captures: { v1_after: $.data }
            - call: "GET /ja-programs/volunteers/${vol2_id}"
              payload: {}
              as: PartnershipManager
              captures: { v2_after: $.data }
            - call: "GET /ja-programs/sessions/${s1}"
              payload: {}
              as: ProgramCoordinator
              captures: { s1_after: $.data }
            - call: "GET /ja-programs/deliveries/${del_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { del_after: $.data, del_v: $.data.version }
            - call: "POST /ja-programs/sessions/${s1}/substitute"
              payload: { new_volunteer_id: "${vol2_id}", expected_delivery_version: "${del_v}" }
              as: ProgramCoordinator
              captures: { s1_sub: $.data }
            - call: "GET /ja-programs/deliveries/${del_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { del_final: $.data }
          assert:
            - "link 1: Volunteer.${vol1_id}.engagement_status == DEPARTED (caused by partner EXIT)"
            - "link 2: DeliverySession.${s1}.status == NEEDS_SUBSTITUTE and DeliverySession.${s2} likewise (caused by the departure, not by the EXIT directly)"
            - "link 3: ClassroomDelivery.${del_id}.sessions_blocked_count == 2 (recomputed because the sessions flipped)"
            - "Volunteer.${vol2_id}.engagement_status == ACTIVE (cascade is scoped to the exited partner's volunteers)"
            - "recovery: substitute response moves DeliverySession.${s1} to SCHEDULED with volunteer_id == ${vol2_id}"
            - "after recovery: ClassroomDelivery.${del_id}.sessions_blocked_count == 1"

      - name: district_churn_terminates_agreement_cancels_delivery_releases_kits
        grounds:
          - state_machines.SchoolDistrict.PARTNER_to_CHURNED
          - state_machines.PartnershipAgreement.ACTIVE_to_TERMINATED
          - state_machines.ClassroomDelivery
        distinguishing_aspect: |
          Depth-3 cascade from district CHURN: CHURNED causes the school's ACTIVE agreement to
          TERMINATE; the termination causes the delivery to CANCEL; the cancellation causes the
          kit reservation to release (reserved 23 -> 0, available restored 27 -> 50) and the
          SCHEDULED sessions to CANCEL. Trigger differs from the sibling instance (district CHURN
          vs partner EXIT), and the conserved kit counters prove the cascade ran end to end.
