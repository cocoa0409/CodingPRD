              captures: { order_id: $.data.id, order_v1: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_id}", requested_qty: 10, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
            - call: "POST /orders/${order_id}/allocate"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
            - call: "POST /recall-notices"
              payload: { item_id: "${item_id}", lot_id: "${lot_id}", recall_class: "CLASS_II", reason: "Packaging integrity" }
              as: ContractAdmin
              as_user_id: "ca-1"
              captures: { notice_id: $.data.id }
          trigger:
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { qoh_before: $.data.quantity_on_hand, received: $.data.received_quantity }
            - call: "GET /order-lines/${line_id}"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { alloc_before: $.data.allocated_qty }
            - call: "POST /recall-notices/${notice_id}/cascade"
              payload: { action: "CASCADE" }
              as: DistributionOperator
              as_user_id: "dc-op-1"
          assert:
            - "${received} == 100"
            - "${qoh_before} == 90 and ${alloc_before} == 10, so the invariant sum is 100 before compensation"
            - "Lot.${lot_id}.quantity_on_hand == 100 and OrderLine.${line_id}.allocated_qty == 0 after the cascade, so the invariant sum is still 100"
            - "Lot.${lot_id}.status == QUARANTINED and OrderLine.${line_id}.lot_id == null"
            - "no other Lot row changed quantity_on_hand - the released units went back to LOT-17 only"

      - name: contract_chargeback_ledger_conservation_across_claim_and_dispute
        grounds:
          - entities.GpoContract.fields.chargeback_payable_cents
          - entities.ChargebackClaim.fields.net_chargeback_cents
          - state_machines.ChargebackClaim.SUBMITTED_to_DISPUTED
          - state_machines.ChargebackClaim.DISPUTED_to_SUBMITTED
          - state_machines.ChargebackClaim.ACCEPTED_to_RECONCILED
          - validations[priority=14]
        distinguishing_aspect: |
          A conserved quantity of a DIFFERENT type - MONEY, not physical units -
          pinned as GpoContract.chargeback_payable_cents == sum of
          ChargebackClaim.net_chargeback_cents over that contract's claims whose
          status IN {SUBMITTED, ACCEPTED, RECONCILED}. Claim submission is the forward
          action, manufacturer dispute is its compensation, and the identity holds at
          every one of the five steps with zero drift.
        test_recipe:
          setup:
            - "One ACUTE supply room, one AMBIENT case item (wac 12000, units_per_parent 24)."
            - "Contract CTR-A (TIER_2, ACUTE) ACTIVE with a chargeback-eligible line at tier_price 9000 / floor 8000."
            - "An order with one line for 10 cases, allocated from a 100-unit lot, routed, dispatched and DELIVERED at 2026-08-01, giving a settled unit price of 9540."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-018", room_code: "OR-CORE-18", gpo_member_class: "ACUTE", room_type: "OR_CORE", credit_limit_cents: 5000000 }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-GLOVE-CS", description: "Sterile surgical glove, case of 24", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 12000, handling_class: "AMBIENT", units_per_parent: 24 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-A", tier: "TIER_2", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 9000, floor_price_cents: 8000, chargeback_eligible: true }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-GLOVE", par_qty: 400, reorder_point: 100 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /lots"
              payload: { item_id: "${item_id}", lot_code: "LOT-18", expiry_date: "2027-06-30T00:00:00Z", received_quantity: 100 }
              as: DistributionOperator
              as_user_id: "dc-op-1"
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_id}", requested_qty: 10, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
            - call: "POST /orders/${order_id}/allocate"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
            - call: "POST /delivery-routes"
              payload: { route_code: "RT-18", service_date: "2026-08-01", vehicle_class: "AMBIENT_VAN" }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { route_id: $.data.id }
            - call: "POST /delivery-routes/${route_id}/stops"
              payload: { order_id: "${order_id}", arrival_min: 480, service_minutes: 30 }
              as: DistributionOperator
              as_user_id: "dc-op-1"
            - call: "POST /delivery-routes/${route_id}/dispatch"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
            - call: "POST /orders/${order_id}/deliver"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
          trigger:
            - call: "POST /chargeback-claims"
              payload: { order_id: "${order_id}", contract_id: "${ctr_id}" }
              as: ContractAdmin
              as_user_id: "ca-1"
              captures: { claim_id: $.data.id, net: $.data.net_chargeback_cents }
            - call: "POST /chargeback-claims/${claim_id}/response"
              payload: { outcome: "DISPUTE", dispute_reason: "Tier eligibility under review" }
              as: ManufacturerRep
              as_user_id: "mfr-rep-1"
            - call: "POST /chargeback-claims/${claim_id}/settle"
              payload: { action: "RESUBMIT" }
              as: ContractAdmin
              as_user_id: "ca-1"
            - call: "POST /chargeback-claims/${claim_id}/response"
              payload: { outcome: "ACCEPT" }
              as: ManufacturerRep
              as_user_id: "mfr-rep-1"
            - call: "POST /chargeback-claims/${claim_id}/settle"
              payload: { action: "RECONCILE" }
              as: ContractAdmin
              as_user_id: "ca-2"
          assert:
            - "${net} == 24108 and ChargebackClaim.${claim_id}.gross_chargeback_cents == 24600 and admin_fee_cents == 492"
            - "step 1 - after the claim: GpoContract.${ctr_id}.chargeback_payable_cents == 24108"
            - "step 2 - after the DISPUTE: GpoContract.${ctr_id}.chargeback_payable_cents == 0 and ChargebackClaim.${claim_id}.status == DISPUTED"
            - "step 3 - after the RESUBMIT: GpoContract.${ctr_id}.chargeback_payable_cents == 24108 and ChargebackClaim.${claim_id}.status == SUBMITTED"
            - "step 4 - after the ACCEPT: GpoContract.${ctr_id}.chargeback_payable_cents == 24108 and ChargebackClaim.${claim_id}.status == ACCEPTED"
            - "step 5 - after the RECONCILE by ca-2: GpoContract.${ctr_id}.chargeback_payable_cents == 24108, ChargebackClaim.${claim_id}.status == RECONCILED, reconciled_by_user_id == ca-2, ReplenishmentOrder.${order_id}.settlement_status == RECONCILED"
            - "the ledger equals the sum of net_chargeback_cents over claims in {SUBMITTED, ACCEPTED, RECONCILED} at every one of the five steps"
