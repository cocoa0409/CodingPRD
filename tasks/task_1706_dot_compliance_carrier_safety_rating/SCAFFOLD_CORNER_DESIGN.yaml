          assert:
            - "error_id == ERR_TEST_NOT_LAB_REPORTED (409)"

      - name: preventability_second_determination_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AccidentRecord, "errors[ERR_PREVENTABILITY_ALREADY_DETERMINED]"]
        distinguishing_aspect: "Preventability determination is terminal: a second determine call -> ERR_PREVENTABILITY_ALREADY_DETERMINED."
        test_recipe:
          setup: ["carrier; driver; accident already determined NOT_PREVENTABLE by sd-1 (registered by sm-1)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2327", legal_name: "Prevent Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2327", full_name: "Leo Uba", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-06-01T00:00:00Z", fatalities: 0, injuries: 1, tow_away: false }, as: SafetyManager, as_user_id: "sm-1", captures: { acc: $.data.id } }
            - { call: "POST /safety/accident-records/${acc}/determine-preventability", payload: { determination: "NOT_PREVENTABLE" }, as: SafetyDirector, as_user_id: "sd-1" }
          trigger:
            - { call: "POST /safety/accident-records/${acc}/determine-preventability", payload: { determination: "PREVENTABLE" }, as: SafetyDirector, as_user_id: "sd-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PREVENTABILITY_ALREADY_DETERMINED (409); determination stays NOT_PREVENTABLE"

      - name: audit_actions_from_wrong_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ComplianceAuditCase, "errors[ERR_AUDIT_INVALID_STATE]"]
        distinguishing_aspect: "issue-findings and close both require later states: calling either on a SCHEDULED audit -> ERR_AUDIT_INVALID_STATE."
        test_recipe:
          setup: ["carrier; audit SCHEDULED for 2026-09-01"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2328", legal_name: "Audit Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-09-01T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { au: $.data.id } }
          trigger:
            - { call: "POST /safety/compliance-audit-cases/${au}/issue-findings", payload: { acute_count: 0, critical_count: 0 }, as: SafetyAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/compliance-audit-cases/${au}/close", payload: {}, as: SafetyDirector, captures: { err2: $.data.error_id } }
          assert:
            - "issue-findings on SCHEDULED -> ERR_AUDIT_INVALID_STATE; close on SCHEDULED -> ERR_AUDIT_INVALID_STATE"

      - name: upgrade_decide_before_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RatingUpgradeRequest, "errors[ERR_UPGRADE_INVALID_STATE]"]
        distinguishing_aspect: "decide requires UNDER_REVIEW: decide on SUBMITTED -> ERR_UPGRADE_INVALID_STATE; a second decide after APPROVED hits the same terminal lockdown."
        test_recipe:
          setup: ["carrier CONDITIONAL (audit acute 0 critical 2, cooling-off elapsed at clock 2027-02-01); upgrade request SUBMITTED"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2329", legal_name: "Decide Carrier", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { au: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases/${au}/start-field-work", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au}/issue-findings", payload: { acute_count: 0, critical_count: 2 }, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au}/close", payload: {}, as: SafetyDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SafetyAdmin }
            - { call: "POST /safety/rating-upgrade-requests", payload: { carrier_id: "${c_id}", requested_rating: "SATISFACTORY", justification_note: "evidence" }, as: SafetyManager, captures: { u_id: $.data.id } }
          trigger:
            - { call: "POST /safety/rating-upgrade-requests/${u_id}/decide", payload: { outcome: "APPROVED" }, as: SafetyDirector, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/rating-upgrade-requests/${u_id}/start-review", payload: {}, as: SafetyDirector }
            - { call: "POST /safety/rating-upgrade-requests/${u_id}/decide", payload: { outcome: "APPROVED" }, as: SafetyDirector }
            - { call: "POST /safety/rating-upgrade-requests/${u_id}/decide", payload: { outcome: "DENIED" }, as: SafetyDirector, captures: { err2: $.data.error_id } }
          assert:
            - "decide on SUBMITTED -> ERR_UPGRADE_INVALID_STATE (409)"
            - "after APPROVED: further decide -> ERR_UPGRADE_INVALID_STATE (terminal lockdown)"

      - name: premium_quote_twice_and_recompute_quoted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InsurancePremiumModel, "errors[ERR_PREMIUM_MODEL_NOT_DRAFT]", "errors[ERR_PREMIUM_MODEL_NOT_STALE]"]
        distinguishing_aspect: "quote is DRAFT-only (second quote -> ERR_PREMIUM_MODEL_NOT_DRAFT); recompute on a fresh QUOTED model -> ERR_PREMIUM_MODEL_NOT_STALE."
        test_recipe:
          setup: ["carrier; premium model created and quoted"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2330", legal_name: "Quote Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-01-01T00:00:00Z", policy_period_end: "2027-12-31T00:00:00Z", base_rate_cents_per_unit: 80000, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_id: $.data.id } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/quote", payload: {}, as: InsuranceAnalyst }
          trigger:
            - { call: "POST /safety/insurance-premium-models/${m_id}/quote", payload: {}, as: InsuranceAnalyst, captures: { err1: $.data.error_id } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/recompute", payload: {}, as: InsuranceAnalyst, captures: { err2: $.data.error_id } }
          assert:
            - "second quote -> ERR_PREMIUM_MODEL_NOT_DRAFT (409)"
            - "recompute on QUOTED -> ERR_PREMIUM_MODEL_NOT_STALE (409)"

      - name: premium_quote_after_carrier_patch_stale_input
        claim_type: violation_to_error
        grounds: ["errors[ERR_PREMIUM_INPUT_STALE]", "concurrency_rules[carrier-patch-stale-version]"]
        distinguishing_aspect: "Lazy freshness gate for DRAFT models: after a carrier PATCH (legal_name only — not premium-relevant, so no eager sweep), quote fails with ERR_PREMIUM_INPUT_STALE; recompute (DRAFT refresh) then quote succeeds."
        test_recipe:
          setup: ["carrier (version captured); BASELINE DRAFT model for 2027"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2331", legal_name: "Stale Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id, c_ver: $.data.version } }
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-01-01T00:00:00Z", policy_period_end: "2027-12-31T00:00:00Z", base_rate_cents_per_unit: 80000, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_id: $.data.id } }
            - { call: "PATCH /safety/carriers/${c_id}", payload: { legal_name: "Stale Carrier Renamed", expected_carrier_version: "${c_ver}" }, as: SafetyAdmin }
          trigger:
            - { call: "POST /safety/insurance-premium-models/${m_id}/quote", payload: {}, as: InsuranceAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/recompute", payload: {}, as: InsuranceAnalyst, captures: { st: $.data.status } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/quote", payload: {}, as: InsuranceAnalyst, captures: { st2: $.data.status } }
          assert:
            - "quote after carrier PATCH -> ERR_PREMIUM_INPUT_STALE (409) — DRAFT models are checked lazily"
            - "recompute refreshes the DRAFT (status DRAFT, carrier_version_at_compute updated); subsequent quote -> QUOTED"

      - name: new_entrant_audit_scheduled_past_due_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDIT_SCHEDULED_PAST_DUE]"]
        distinguishing_aspect: "NEW_ENTRANT audits must be scheduled on or before safety_audit_due_date: scheduling after it -> ERR_AUDIT_SCHEDULED_PAST_DUE."
