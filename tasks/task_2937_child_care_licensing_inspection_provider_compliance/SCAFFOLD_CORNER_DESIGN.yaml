        grounds:
          - roles.PublicPortalReader
          - endpoints.GET /licensing/providers
          - endpoints.GET /licensing/public-report-postings
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The consumer-education role has an empty exclusive_operations list and appears in no mutating endpoint's roles, so its every read succeeds while its every write — including the postings register it can read in full — returns ERR_UNAUTHORIZED 403."
        test_recipe:
          setup:
            - "One DRAFT provider and one inspector, so the public reader has rows to read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
          trigger:
            - call: "GET /licensing/providers"
              as: PublicPortalReader
              captures: { first_prov: "$.data[0].id" }
            - call: "GET /licensing/providers/${prov}"
              as: PublicPortalReader
              captures: { got: $.data.id }
            - call: "GET /licensing/public-report-postings"
              as: PublicPortalReader
            - call: "POST /licensing/providers"
              payload: { legal_name: "Ghost Center", county_code: "CTY-01", site_address: "1 Nowhere", program_type: "CENTER", requested_capacity: 5 }
              as: PublicPortalReader
              captures: { e_w1: $.data.error_id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "WEB", allegation_category: "RECORDS", affected_age_group: "SCHOOL_AGE", narrative: "Records look wrong." }
              as: PublicPortalReader
              captures: { e_w2: $.data.error_id }
          assert:
            - "${first_prov} == ${prov} and ${got} == ${prov} — the reader sees the directory without any identity beyond its role, and the list answers total_count 1 with has_more false"
            - "GET /licensing/public-report-postings answers HTTP 200 with an empty data array, total_count 0 and has_more false — an empty register still carries the declared pagination envelope"
            - "${e_w1} == ERR_UNAUTHORIZED with HTTP 403 and GET /licensing/providers still returns total_count 1"
            - "${e_w2} == ERR_UNAUTHORIZED with HTTP 403 — the reader may not even file a complaint, which the intake specialist and admin share"

  # ---------------------------------------------------------------------------
  # Guide section 8 — From Cross-Cutting Complexity Layers. §1.0 declares
  # complexity_layers [optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, rate_threshold_triggers]; the remaining rows of
  # the guide's layer table (soft_delete, idempotency, bulk_operations,
  # multi_tenancy, scheduled_actions, pagination_with_filtering,
  # derived_field_reconciliation, conditional_feature_flags) are not declared
  # and yield no instances. Each §1.2.1 concurrency_rules entry gets its own
  # stale-version instance.
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_amendment_create_carries_a_stale_provider_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[amendment-create-stale-provider]
          - validations.priority_20_ERR_STALE_PROVIDER_VERSION
          - errors[ERR_STALE_PROVIDER_VERSION]
          - endpoints.POST /licensing/license-amendments
        distinguishing_aspect: "The version the request carries is the only thing that distinguishes an informed writer here, because a second amendment of the same type would legitimately succeed by superseding the first: adding a staff member silently advances Provider.version, so the amendment built on the earlier read is refused with ERR_STALE_PROVIDER_VERSION 412 before any supersede takes place."
        test_recipe:
          setup:
            - "A DRAFT provider read at version 1, then mutated by a staff-member creation that bumps it to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "GET /licensing/providers/${prov}"
              as: Applicant
              as_user_id: "${prov}"
              captures: { pv1: $.data.version }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Reed", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["PRESCHOOL"], role_title: "Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { dir: $.data.id }
          trigger:
            - call: "POST /licensing/license-amendments"
              payload: { provider_id: "${prov}", amendment_type: "DIRECTOR_CHANGE", expected_provider_version: "${pv1}", new_director_staff_member_id: "${dir}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { e_occ: $.data.error_id }
            - call: "GET /licensing/providers/${prov}"
              as: Applicant
              as_user_id: "${prov}"
              captures: { pv2: $.data.version }
            - call: "POST /licensing/license-amendments"
              payload: { provider_id: "${prov}", amendment_type: "DIRECTOR_CHANGE", expected_provider_version: "${pv2}", new_director_staff_member_id: "${dir}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { amd: $.data.id, ast: $.data.status }
            - call: "GET /licensing/providers/${prov}"
              as: Applicant
              as_user_id: "${prov}"
              captures: { pv3: $.data.version }
          assert:
            - "${pv1} == 1 and ${pv2} == 2 — the staff-member creation advanced the provider through the clearance recomputation"
            - "${e_occ} == ERR_STALE_PROVIDER_VERSION with HTTP 412, and no LicenseAmendment row exists for ${prov} after the refusal"
            - "The refused write does not advance the provider: the version read immediately afterwards is still ${pv2}"
            - "${ast} == SUBMITTED with requires_inspection false (DIRECTOR_CHANGE needs no visit)"
            - "${pv3} == ${pv2} + 1 — the accepted amendment create bumps Provider.version once more"

      - name: occ_cap_submission_carries_a_stale_inspection_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cap-submit-stale-inspection]
          - validations.priority_21_ERR_STALE_INSPECTION_VERSION
          - errors[ERR_STALE_INSPECTION_VERSION]
          - endpoints.POST /licensing/corrective-action-plans
          - state_machines.CorrectiveActionPlan.SUBMITTED_to_SUPERSEDED
        distinguishing_aspect: "Submitting a plan is itself a write on the parent Inspection, so the first plan invalidates the version every later plan was built on: the second submission carrying the pre-plan version is refused with ERR_STALE_INSPECTION_VERSION 412, and only after re-reading does the newer plan land and supersede the first."
        test_recipe:
          setup:
            - "A provider with a cleared DIRECTOR, and one FINALIZED ANNUAL inspection at 2026-08-10T09:00:00Z carrying a single SERIOUS citation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio maintained", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Reed", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["PRESCHOOL"], role_title: "Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc_fbi: $.data.id }
            - call: "POST /licensing/background-checks/${bc_fbi}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc_car: $.data.id }
            - call: "POST /licensing/background-checks/${bc_car}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-10T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspections/${ins}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins}", checklist_item_id: "${ci_ra}", primary_age_group: "PRESCHOOL", narrative: "One aide for fourteen preschoolers." }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { vio: $.data.id }
            - call: "POST /licensing/inspections/${ins}/submit-for-review"
              payload: { outcome: "FAIL", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins}/finalize"
              as: LicensingSupervisor
              captures: { iv1: $.data.version, capreq: $.data.cap_required }
          trigger:
            - call: "POST /licensing/corrective-action-plans"
              payload: { inspection_id: "${ins}", violation_ids: ["${vio}"], narrative: "Hire one additional preschool aide.", proposed_completion_date: "2026-08-18", expected_inspection_version: "${iv1}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { cap_1: $.data.id, due1: $.data.due_at }
            - call: "POST /licensing/corrective-action-plans"
              payload: { inspection_id: "${ins}", violation_ids: ["${vio}"], narrative: "Revised plan: reassign the floating aide.", proposed_completion_date: "2026-08-19", expected_inspection_version: "${iv1}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { e_occ: $.data.error_id }
            - call: "GET /licensing/inspections/${ins}"
              as: Applicant
              as_user_id: "${prov}"
              captures: { iv2: $.data.version }
            - call: "POST /licensing/corrective-action-plans"
              payload: { inspection_id: "${ins}", violation_ids: ["${vio}"], narrative: "Revised plan: reassign the floating aide.", proposed_completion_date: "2026-08-19", expected_inspection_version: "${iv2}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { cap_2: $.data.id, cst2: $.data.status }
          assert:
            - "${capreq} == true and Violation.${vio}.status == CORRECTION_PENDING with correction_due_date 2026-08-20T09:00:00Z"
            - "${due1} == 2026-08-20T09:00:00Z — submitted at 2026-08-10T09:00:00Z plus min(CORRECTION_DAYS) 10 for a SERIOUS-only plan"
            - "${e_occ} == ERR_STALE_INSPECTION_VERSION with HTTP 412 — creating ${cap_1} advanced Inspection.${ins}.version past ${iv1}"
            - "${iv2} == ${iv1} + 1, and no third plan exists after the refusal: GET /licensing/corrective-action-plans?inspection_id=${ins} returns total_count 1"
            - "${cst2} == SUBMITTED for ${cap_2} with review_cycle_count 1, and CorrectiveActionPlan.${cap_1}.status becomes SUPERSEDED"
            - "Inspection.${ins}.version == ${iv2} + 1 after the accepted submission"

      - name: layer_cascading_side_effects_four_link_disqualification_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints.POST /licensing/background-checks/{background_check_id}/result
        excluded_because:
          difficulty_instance: cascade_disqualification_to_barred_staff_to_rosters_to_application_revert
          rationale: "The §1.8 instance already walks the whole four-link chain end to end — DISQUALIFIED result, StaffMember barred and supervision-ineligible, every roster led by that person losing its lead and recomputing its three flags, Provider.clearance_complete flipping true to false with the application reverting CHECKS_CLEARED to SUBMITTED and the SCHEDULED INITIAL inspection VOIDED — and it also pins the ordering by asserting the intermediate rows, so a corner instance here would only restate it with different literals."

      - name: layer_dual_variant_calculation_preliminary_versus_final_score
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.inspection_compliance_score
        excluded_because:
          difficulty_instance: dual_variant_inspection_compliance_preliminary_vs_final
          rationale: "That §1.8 instance computes both variants over one violation set and asserts the delta in both directions — VERIFIED_CORRECTED shrinking FINAL below PRELIMINARY at status factor 0.400 and UNCORRECTED pushing it above at 1.250 — while PRELIMINARY stays frozen at the as-cited value. The layer's claims (both variants correct, delta on switch correct) are fully consumed there."

      - name: layer_rate_threshold_triggers_ladder_boundaries_on_proposal
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.enforcement_ladder_step
        excluded_because:
          difficulty_instance: boundary_enforcement_point_thresholds_on_proposal
          rationale: "The cumulative thresholds (15 / 30 / 45 / 60, all inclusive lower edges) are already exercised at and just below each edge in §1.8, including the ERR_NO_ENFORCEMENT_BASIS floor and the ERR_LADDER_STEP_SKIP ceiling, and the reset side of the layer is covered by restore-full lowering current_ladder_step in the same file."

  # ---------------------------------------------------------------------------
  # Guide section 9 — From Consistency Model. §1.0 declares `immediate`, so the
  # `eventual` and `saga` rows yield no instances.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: consistency_immediate_finalize_response_already_carries_every_derivation
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /licensing/inspections/{inspection_id}/finalize
          - calculations.inspection_compliance_score
          - calculations.provider_risk_assessment
        distinguishing_aspect: "One write recomputes derivations on three different rows — the Inspection's scores, the cited Violation's state and deadline, and the Provider's point, critical and risk fields — and every one of them is already correct in the finalize response body, so no re-read is ever needed to see a settled value."
        test_recipe:
          setup:
            - "A provider with a cleared DIRECTOR and one PENDING_REVIEW ANNUAL inspection carrying a single CRITICAL PRESCHOOL citation, at clock 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Reed", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["PRESCHOOL"], role_title: "Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc_fbi: $.data.id }
            - call: "POST /licensing/background-checks/${bc_fbi}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc_car: $.data.id }
            - call: "POST /licensing/background-checks/${bc_car}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-10T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspections/${ins}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins}", checklist_item_id: "${ci_su}", primary_age_group: "PRESCHOOL", narrative: "Nap room left unattended for twenty minutes." }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { vio: $.data.id }
            - call: "POST /licensing/inspections/${ins}/submit-for-review"
              payload: { outcome: "FAIL", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
          trigger:
            - call: "POST /licensing/inspections/${ins}/finalize"
              as: LicensingSupervisor
              captures: { prelim: $.data.preliminary_compliance_score, final: $.data.final_compliance_score, raw: $.data.raw_deduction_points, vcount: $.data.violation_count, capreq: $.data.cap_required }
            - call: "GET /licensing/inspections/${ins}"
              as: LicensingSupervisor
              captures: { final2: $.data.final_compliance_score }
            - call: "GET /licensing/violations/${vio}"
              as: LicensingSupervisor
              captures: { vst: $.data.status, vdue: $.data.correction_due_date }
            - call: "GET /licensing/providers/${prov}"
              as: LicensingSupervisor
              captures: { pts: $.data.open_violation_points, crit: $.data.critical_open_count, rs: $.data.risk_score, rt: $.data.risk_tier }
          assert:
            - "${raw} == 15.00 (15 points x PRESCHOOL exposure weight 1.000 x status factor 1.000), ${prelim} == 85.00 and ${final} == 85.00 in the finalize response itself"
            - "${vcount} == 1 and ${capreq} == true, both present in the same response body — no follow-up read is required to learn that a plan is owed"
            - "${final2} == ${final} — the immediately following read agrees with the write's own body, digit for digit"
            - "${vst} == CORRECTION_PENDING and ${vdue} == 2026-08-13T09:00:00Z (CRITICAL, 3 days), so the cited row settled inside the same request"
            - "${pts} == 15, ${crit} == 1, ${rs} == 25.00 and ${rt} == MODERATE — the provider's counters and its persisted ENFORCEMENT_REVIEW risk tier are settled too"
            - "No field anywhere is observed to lag and then correct itself on a later read: there is exactly one visible value per field per instant"
