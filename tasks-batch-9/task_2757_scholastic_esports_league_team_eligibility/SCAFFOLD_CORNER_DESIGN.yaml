              as_user_id: "${s_id}"
            - call: "POST /titles"
              payload: { name: "Rocket Clash", publisher: "Astro Interactive", age_rating: "E10", min_player_age: 13 }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /title-approvals"
              payload: { district_id: "${d_id}", title_id: "${t_id}", requested_by_school_id: "${s_id}" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /title-approvals/${ap_id}/decision"
              payload: { action: "APPROVE" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity", min_starters: 1, max_starters: 3 }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { tm1_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Ada Lin", birthdate: "2009-05-10", grade_level: 11 }
              as: LeagueAdmin
              captures: { st1_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Beau Ng", birthdate: "2009-06-11", grade_level: 11 }
              as: LeagueAdmin
              captures: { st2_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Cleo Ray", birthdate: "2009-07-12", grade_level: 10 }
              as: LeagueAdmin
              captures: { st3_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Dev Osei", birthdate: "2009-08-13", grade_level: 10 }
              as: LeagueAdmin
              captures: { st4_id: $.data.id }
          trigger:
            - call: "POST /roster-slots"
              payload: { team_id: "${tm1_id}", student_id: "${st1_id}", slot_role: "STARTER" }
              as: Coach
