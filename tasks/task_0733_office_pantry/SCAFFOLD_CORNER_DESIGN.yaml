        distinguishing_aspect: "Adding a product with requires_refrigeration=true to a PANTRY Location returns ERR_REFRIGERATION_MISMATCH."
        test_recipe:
          setup:
            - "PANTRY Location; Product with requires_refrigeration=true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
