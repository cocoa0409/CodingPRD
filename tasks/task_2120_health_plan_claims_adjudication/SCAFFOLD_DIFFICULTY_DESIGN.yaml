              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-DUP-A", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, service_date: "2026-02-10" }] }
