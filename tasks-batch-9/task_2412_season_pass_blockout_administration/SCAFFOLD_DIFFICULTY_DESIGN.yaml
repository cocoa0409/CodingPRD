              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-05", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_805: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${gold}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_805}", entry_at: "2026-08-05T09:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { visit_1: "$.data.id" }
          trigger:
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_805}", entry_at: "2026-08-05T10:30:00Z", gate_code: "SOUTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { err_boundary: "$.data.error_id" }
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_805}", entry_at: "2026-08-05T10:31:00Z", gate_code: "SOUTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { visit_2: "$.data.id" }
          assert:
            - "first trigger (09:00 + exactly 90 minutes) returns HTTP 422 with data.error_id == 'ERR_ANTIPASSBACK_VIOLATION' — the buffer is closed at its far edge"
            - "second trigger (09:00 + 91 minutes) returns 201 with data.status == 'OPEN' and data.gate_code == 'SOUTH'"
            - "GET /visits?season_pass_id=${pass_a} → data.total_count == 2 ordered entry_at ASC, data[0].entry_at == '2026-08-05T09:00:00Z', data[1].entry_at == '2026-08-05T10:31:00Z'"
            - "GET /season-passes/${pass_a} → data.visit_count == 2"
            - "GET /passholders/${holder_a} → data.sharing_risk_score == 0 (STANDARD day → ROLLING_WINDOW: 15 * max(0, 2 - 3) + 35 * 0) so no SharingCase was opened"
            - "GET /sharing-cases?season_pass_id=${pass_a} → data.total_count == 0"

  - rule_id: compensating_invariant
    instances:
      - name: upgrade_apply_then_reverse_conserves_pass_ledger_identity
        grounds:
          - state_machines.UpgradeOrder.QUOTED_to_APPLIED
          - state_machines.UpgradeOrder.APPLIED_to_REVERSED
          - entities.SeasonPass.fields.credited_amount_cents
          - entities.SeasonPass.fields.outstanding_balance_cents
          - endpoints[POST /upgrade-orders/{upgrade_order_id}/reverse]
        distinguishing_aspect: |
          Conserved quantity = the pass money ledger identity
          billed_total_cents == paid_to_date_cents + credited_amount_cents + outstanding_balance_cents.
          It holds before the upgrade (13500 == 8250 + 0 + 5250), after apply (32500 == 19000 + 8250 +
          5250) and after reverse (13500 == 8250 + 0 + 5250) — the reversal restores every term to its
          pre-upgrade value with zero drift, including the tier and contract value.
