  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: field_slot_overlap_with_turnaround_buffer
        grounds:
          - validations[priority=10]
          - entities.Field.fields.turnaround_minutes
          - errors[ERR_FIELD_SLOT_CONFLICT]
        distinguishing_aspect: |
          Field interval semantics include a turnaround buffer: a new booking starting within
          turnaround_minutes (15) AFTER an existing booking's window_end collides even though the
          half-open intervals do not literally overlap. Existing 10:00-11:00, buffer 15min; new
          11:10-12:00 is rejected because 11:10 < 11:00 + 15min.
        test_recipe:
          setup:
            - "Arena OPEN clock 2026-06-15T09:00:00Z; field turnaround_minutes 15; existing CONFIRMED booking 10:00-11:00"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A15", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F15", game_mode: "LASER_TAG", capacity_max: 10, turnaround_minutes: 15 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "RESERVATION", party_size: 4, window_start: "2026-06-15T10:00:00Z", window_end: "2026-06-15T11:00:00Z" }
              as: FrontDesk
              captures: { existing_id: $.data.id }
            - call: "POST /bookings/${existing_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
          trigger:
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "RESERVATION", party_size: 4, window_start: "2026-06-15T11:10:00Z", window_end: "2026-06-15T12:00:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FIELD_SLOT_CONFLICT"

      - name: equipment_overlap_closed_interval_no_buffer
        grounds:
          - validations[priority=11]
          - entities.Rental.fields.equipment_unit_id
          - errors[ERR_EQUIPMENT_TIME_CONFLICT]
        distinguishing_aspect: |
          Different resource (EquipmentUnit) and different interval semantics (closed-interval
          overlap, NO turnaround buffer): the same marker reserved for booking A (10:00-11:00) cannot
          be reserved for booking B whose window (10:30-11:30) overlaps A's window. Unlike the field
          rule there is no buffer; adjacency at the exact boundary does NOT conflict, only true overlap.
        test_recipe:
          setup:
            - "Arena OPEN clock 2026-06-15T09:00:00Z; TWO fields turnaround 0 (so field-slot conflict cannot mask the equipment conflict); one MARKER deposit 3000; booking A 10:00-11:00 on field_a with marker rented (HELD); booking B 10:30-11:30 on field_b created (overlaps A in time but on a different field)"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A16", marker_pool_total: 1, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F16a", game_mode: "LASER_TAG", capacity_max: 10, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_a: $.data.id }
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F16b", game_mode: "LASER_TAG", capacity_max: 10, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_b: $.data.id }
            - call: "POST /equipment-units"
              payload: { arena_id: "${arena_id}", unit_type: "MARKER", asset_tag: "M-16", deposit_cents: 3000 }
              as: ArenaManager
              captures: { unit_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_a}", booking_type: "RESERVATION", party_size: 4, window_start: "2026-06-15T10:00:00Z", window_end: "2026-06-15T11:00:00Z" }
              as: FrontDesk
              captures: { booking_a: $.data.id }
            - call: "POST /rentals"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_a}", equipment_unit_id: "${unit_id}" }
              as: FrontDesk
              captures: { rental_a: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_b}", booking_type: "RESERVATION", party_size: 4, window_start: "2026-06-15T10:30:00Z", window_end: "2026-06-15T11:30:00Z" }
              as: FrontDesk
              captures: { booking_b: $.data.id }
          trigger:
            - call: "POST /rentals"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_b}", equipment_unit_id: "${unit_id}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EQUIPMENT_TIME_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_ledger_conserved_on_reserve_then_release
        grounds:
          - state_machines.Rental.HELD_to_RELEASED
          - entities.Arena.fields.deposit_held_cents
          - entities.EquipmentUnit.fields.deposit_cents
        distinguishing_aspect: |
          Conserved quantity: Arena.deposit_held_cents. Forward action (reserve marker, deposit 3500)
          raises deposit_held by 3500; compensating action (release the HELD rental) lowers it by 3500,
          leaving deposit_held back at 0 with the marker AVAILABLE — no drift in the held-deposit ledger.
        test_recipe:
          setup:
            - "Arena OPEN clock set; field; one MARKER deposit 3500; WALK_IN booking HELD; marker reserved (deposit_held=3500)"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A17", marker_pool_total: 1, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F17", game_mode: "LASER_TAG", capacity_max: 8, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { arena_id: "${arena_id}", unit_type: "MARKER", asset_tag: "M-17", deposit_cents: 3500 }
              as: ArenaManager
              captures: { unit_id: $.data.id }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 4, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /rentals"
              payload: { arena_id: "${arena_id}", booking_id: "${booking_id}", equipment_unit_id: "${unit_id}" }
              as: FrontDesk
              captures: { rental_id: $.data.id }
          trigger:
            - call: "POST /rentals/${rental_id}/release"
              payload: {}
              as: FrontDesk
          assert:
            - "Rental.${rental_id}.status == RELEASED"
            - "Arena.${arena_id}.deposit_held_cents == 0"
            - "EquipmentUnit.${unit_id}.status == AVAILABLE"
            - "Arena.${arena_id}.marker_available_count == 1"

      - name: field_headcount_conserved_on_confirm_then_cancel
        grounds:
          - state_machines.Booking.HELD_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Field.fields.reserved_headcount
          - entities.Booking.fields.party_size
        distinguishing_aspect: |
          Different conserved quantity: Field.reserved_headcount (a headcount, not a cash ledger).
          Forward action (confirm a party_size-7 booking) raises reserved_headcount by 7; compensating
          action (cancel the same booking) lowers it by 7, returning reserved_headcount to 0 with no drift.
        test_recipe:
          setup:
            - "Arena OPEN clock set; field capacity 10; WALK_IN booking party_size 7 CONFIRMED (reserved_headcount=7)"
          setup_api_calls:
            - call: "POST /arenas"
              payload: { name: "A18", marker_pool_total: 0, vest_pool_total: 0 }
              as: ArenaManager
              captures: { arena_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { arena_id: "${arena_id}", to_iso8601: "2026-06-15T09:00:00Z" }
              as: ArenaManager
            - call: "POST /fields"
              payload: { arena_id: "${arena_id}", name: "F18", game_mode: "LASER_TAG", capacity_max: 10, turnaround_minutes: 0 }
              as: ArenaManager
              captures: { field_id: $.data.id, field_v0: $.data.version }
            - call: "POST /bookings"
              payload: { arena_id: "${arena_id}", field_id: "${field_id}", booking_type: "WALK_IN", party_size: 7, window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_field_version: "${field_v0}" }
              as: FrontDesk
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Booking.${booking_id}.status == CANCELLED"
            - "Field.${field_id}.reserved_headcount == 0"
