            - call: "POST /fountain-network/dispenser-units/${du}/service-hold"
              payload: { action: "PLACE" }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /fountain-network/maintenance-tasks/${mt}/complete"
              payload: {}
              as: ServiceTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /fountain-network/dispenser-units/${du}/service-hold"
              payload: { action: "RELEASE" }
              as: ServiceTechnician
              as_user_id: "tech-1"
          assert:
            - "HTTP status == 200"
            - "MaintenanceTask.${mt}.status == COMPLETED"
