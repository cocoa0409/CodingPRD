        as: OpsManager
        as_user_id: ops-9
      assert:
      - Invoice.${sod_inv}.auto_review == true after the recompute that followed a completed cure period
      - 'approve as_user_id billing-1: 409 and sod_err == ERR_AUTO_REVIEW_REQUIRES_SECOND_APPROVER'
      - 'approve as_user_id ops-9 with the same fresh contract version: 200, status APPROVED'
- section: endpoints
  instances:
  - name: transition_dispatch_is_conditional_action
    claim_type: Conditional action
    grounds:
    - endpoints.POST_/queues/{id}/transition
    - endpoints.POST_/invoices/{id}/transition
    distinguishing_aspect: 'One endpoint dispatches on to_status: the same URL accepts PAUSED from OPEN but rejects PAUSED from CLOSED with ERR_INVALID_STATE;
      the invoice transition requires expected_contract_version only for APPROVED — omitting it on SUBMITTED succeeds, omitting it on APPROVED
      is 400 ERR_INVALID_REQUEST.'
    test_recipe:
      setup:
      - ACTIVE contract; one OPEN queue; one prepared DRAFT invoice.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id008
      - call: POST /queues/${kq_id}/transition
        payload:
          to_status: CLOSED
        as: OpsManager
      - call: POST /invoices
        payload:
          contract_id: ${kc_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          dinv: $.data.id
      - call: POST /invoices/${dinv}/prepare
        payload: {}
        as: BillingAnalyst
      trigger:
      - call: POST /queues/${kq_id}/transition
        payload:
          to_status: PAUSED
        as: OpsManager
        captures:
          q_err: $.data.error_id
      - call: POST /invoices/${dinv}/transition
        payload:
          to_status: SUBMITTED
        as: BillingAnalyst
      - call: POST /invoices/${dinv}/transition
        payload:
          to_status: APPROVED
        as: OpsManager
        captures:
          occ_missing_err: $.data.error_id
      assert:
      - 'PAUSED from CLOSED: 409 and q_err == ERR_INVALID_STATE'
      - 'SUBMITTED without expected_contract_version: 200 (OCC field is conditional)'
      - 'APPROVED without expected_contract_version: 400 and occ_missing_err == ERR_INVALID_REQUEST'
  - name: retrain_completion_revalidates_invalidated_certification
    claim_type: Cross-reference link
    grounds:
    - endpoints.POST_/training-courses/{id}/complete
    - entities.TrainingCourse.fields.knowledge_article_id
    distinguishing_aspect: 'The retraining path: completing a course LINKED to the invalidating article clears invalidated_at on the agent''s
      matching certification; completing an unlinked course leaves the invalidation standing.'
    test_recipe:
      setup:
      - 'ACTIVE contract; agent certified for MEDICAID on 2026-09-01; article effective 2026-09-10 published (cert invalidated); two new courses:
        one linked to the article, one unlinked.'
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id003
      - *id004
      - *id007
      - call: POST /knowledge-articles
        payload:
          program_code: MEDICAID
          title: Rule change
          body: body
          effective_at: '2026-09-10T00:00:00Z'
        as: KnowledgeManager
        captures:
          art2: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T00:00:00Z'
        as: PlatformAdmin
      - call: POST /knowledge-articles/${art2}/transition
        payload:
          to_status: PUBLISHED
        as: KnowledgeManager
      - call: POST /training-courses
        payload:
          program_code: MEDICAID
          knowledge_article_id: ${art2}
          required: true
        as: KnowledgeManager
        captures:
          linked_course: $.data.id
      - call: POST /training-courses
        payload:
          program_code: MEDICAID
          required: true
        as: KnowledgeManager
        captures:
          unlinked_course: $.data.id
      - call: POST /training-courses/${unlinked_course}/complete
        payload:
          agent_id: ${ka_id}
          valid_until: '2027-06-01T00:00:00Z'
        as: KnowledgeManager
      trigger:
      - call: POST /training-courses/${linked_course}/complete
        payload:
          agent_id: ${ka_id}
          valid_until: '2027-06-01T00:00:00Z'
        as: KnowledgeManager
      assert:
      - 'after the unlinked completion: GET /certifications?agent_id=${ka_id} still shows the original certification invalidated_at non-null'
      - 'after the linked completion: the certification invalidated by ${art2} has invalidated_at null and invalidated_by_article_id null'
      - the agent is routable again (a subsequent route of a waiting call succeeds PRIMARY)
  - name: prepare_is_idempotent_per_state_and_submit_requires_lines
    claim_type: Action endpoint
    grounds:
    - endpoints.POST_/invoices/{id}/prepare
    - endpoints.POST_/invoices/{id}/transition
    distinguishing_aspect: prepare on a non-DRAFT invoice is 409 ERR_INVALID_STATE; submit of a DRAFT invoice with zero lines is 409 ERR_INVALID_STATE
      — but a zero-line invoice cannot arise through prepare (prepare synthesizes at least one line whenever a binding SL exists), so the reachable
      zero-line case is an invoice whose contract has no EFFECTIVE-at-period-end service level at all.
    test_recipe:
      setup:
      - Contract ACTIVE with an SL effective 2026-10-01 (after the 2026-09 period end); invoice for 2026-09 prepared (no binding SL -> zero lines).
      setup_api_calls:
      - *id001
      - call: POST /service-levels
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          metric: ASA
          target: 30
          cap_pct_of_gross: 1.0
          remedy_fee_cents: 1000
          effective_from: '2026-10-01T00:00:00Z'
        as: OpsManager
        captures:
          late_sl: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /service-levels/${late_sl}/transition
        payload:
          to_status: EFFECTIVE
          expected_contract_version: ${kc_id_v0}
        as: OpsManager
      - call: POST /contracts/${kc_id}/transition
        payload:
          to_status: ACTIVE
        as: OpsManager
      - call: POST /invoices
        payload:
          contract_id: ${kc_id}
          period: 2026-09
        as: BillingAnalyst
        captures:
          zinv: $.data.id
      - call: POST /invoices/${zinv}/prepare
        payload: {}
        as: BillingAnalyst
      trigger:
      - call: POST /invoices/${zinv}/transition
        payload:
          to_status: SUBMITTED
        as: BillingAnalyst
        captures:
          zsub_err: $.data.error_id
      - call: POST /invoices/${zinv}/transition
        payload:
          to_status: DRAFT
        as: BillingAnalyst
        captures:
          zprep_err: $.data.error_id
      assert:
      - GET /invoices/${zinv}/lines returns 0 rows (no binding SL at 2026-09 period end)
      - 'submit with zero lines: 409 and zsub_err == ERR_INVALID_STATE'
      - gross_cents == 50000 (base fee only) even with zero lines
- section: errors
  instances:
  - name: unauthenticated_missing_headers
    claim_type: violation_to_error
    grounds:
    - errors.ERR_UNAUTHENTICATED
