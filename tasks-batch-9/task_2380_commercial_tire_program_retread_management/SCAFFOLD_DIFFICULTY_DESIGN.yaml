      - name: retread_reschedule_depends_on_casing_state
        grounds:
          - state_machines.RetreadJob.FAILED_CURE_to_SCHEDULED
          - state_machines.Casing.IN_RETREAD_to_REJECTED
          - state_machines.Casing.INSPECTED_to_RETREAD_QUEUED
          - errors.ERR_CASING_INVALID_STATE
          - entities.RetreadJob.fields.reschedule_count
