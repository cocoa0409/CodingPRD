  - section: state_machines
    instances:
      - name: session_publish_cover_and_close_path
        claim_type: valid_transition
        grounds:
          - state_machines.EndoscopySession.DRAFT_to_PUBLISHED
          - state_machines.EndoscopySession.PUBLISHED_to_COVERAGE_CONFIRMED
          - state_machines.EndoscopySession.COVERAGE_CONFIRMED_to_CLOSED
        distinguishing_aspect: "The happy path across three EndoscopySession transitions, including the two that are triggered by a child write rather than by a status action - creating a fully covering AnesthesiaCoverage promotes the session, and CLOSE releases that coverage as a side effect."
        test_recipe:
          setup:
            - "One endoscopist, one anesthesia clinician, one DRAFT MAC session 2026-09-15 13:00Z-21:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST" }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "2000000001", full_name: "Dr Bo Reyes", clinician_type: "ANESTHESIA", max_overlapping_rooms: 1 }
              as: PracticeAdmin
              captures: { anes_id: $.data.id }
