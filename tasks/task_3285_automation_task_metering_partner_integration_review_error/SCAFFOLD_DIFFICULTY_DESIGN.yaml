      assert:
      - 'the soft-capped run returns error_id ERR_TASK_ALLOWANCE_EXHAUSTED   # hop 1 charge refused'
      - 'GET /workflows/${wf_id} .status == PAUSED and .pause_reason == AUTO_SOFT_CAP   # hop 1'
      - 'GET /connections/${conn_id} .status == REAUTH_REQUIRED   # hop 2, refresh cap of 5 spent'
      - 'GET /workflow-versions/${wv_id} .status == MIGRATION_REQUIRED   # hop 3, caused by hop 2'
  - name: tc_token_lapse_pauses_workflow_then_blocks_resume
    grounds:
    - state_machines.Workflow.ACTIVE_to_PAUSED
    - state_machines.Connection.CONNECTED_to_TOKEN_EXPIRED
    - validations[priority=17]
    - validations[priority=12]
    distinguishing_aspect: 'A depth-3 chain from a different trigger, the token lapse: the lapse set the connection to TOKEN_EXPIRED [hop 1]; the run''s charge then observed it and set the workflow to PAUSED(TOKEN_EXPIRED) [hop 2]; the resume precondition then refuses because the workflow''s pause reason still blocks it [hop 3].'
    test_recipe:
      setup:
      - TeamAccount with task_allowance 100, overage_enabled true
      - one activated POLLING workflow on a connection whose token is about to lapse
      setup_api_calls: *id003
      trigger:
      - call: POST /zapier/_lapse/tokens/expire
        payload:
          connection_id: ${conn_id}
        as: PlatformAdmin
      - call: POST /zapier/workflows/${wf_id}/runs
        payload:
          charge: success
        as: Member
        as_user_id: ${mem_id}
        captures:
          err_id: $.data.error_id
      - call: POST /zapier/workflows/${wf_id}/resume
        as: Member
        as_user_id: ${mem_id}
        captures:
          resume_err: $.data.error_id
      assert:
      - 'GET /connections/${conn_id} .status == TOKEN_EXPIRED   # hop 1'
      - 'GET /workflows/${wf_id} .status == PAUSED and .pause_reason == TOKEN_EXPIRED   # hop 2, caused by hop 1'
      - 'resume_err == ERR_CONNECTION_INVALID_STATE   # hop 3, blocked until the connection is reconnected'
- rule_id: priority_pair_validation_conflict
