          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Wd N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "WdCase", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
