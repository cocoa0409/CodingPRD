  - section: errors
    instances:

      - name: corner_reference_data_not_found_ids_are_resource_specific
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_PERMIT_NOT_FOUND]
          - errors[ERR_CHAMBER_NOT_FOUND]
          - errors[ERR_RECIPE_NOT_FOUND]
          - errors[ERR_QUALIFICATION_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "Each reference-data resource raises its OWN 404 id rather than a shared generic one, so the five reads against unknown ids return five distinct error ids."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
          trigger:
            - call: "GET /sterilization/products/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RegulatoryAdmin
              captures: { e_prod: $.data.error_id }
            - call: "GET /sterilization/emission-permits/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: RegulatoryAdmin
              captures: { e_permit: $.data.error_id }
            - call: "GET /sterilization/chambers/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: RegulatoryAdmin
              captures: { e_cham: $.data.error_id }
            - call: "GET /sterilization/cycle-recipes/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: RegulatoryAdmin
              captures: { e_recipe: $.data.error_id }
            - call: "GET /sterilization/qualifications/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: RegulatoryAdmin
              captures: { e_qual: $.data.error_id }
          assert:
            - "${e_prod} == ERR_PRODUCT_NOT_FOUND with HTTP 404"
            - "${e_permit} == ERR_PERMIT_NOT_FOUND with HTTP 404"
            - "${e_cham} == ERR_CHAMBER_NOT_FOUND with HTTP 404"
            - "${e_recipe} == ERR_RECIPE_NOT_FOUND with HTTP 404"
            - "${e_qual} == ERR_QUALIFICATION_NOT_FOUND with HTTP 404"
            - "all five error ids are pairwise distinct"

      - name: corner_operational_not_found_ids_are_resource_specific
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_LOAD_POSITION_NOT_FOUND]
          - errors[ERR_INDICATOR_NOT_FOUND]
          - errors[ERR_AERATION_RECORD_NOT_FOUND]
          - errors[ERR_ADVERSE_EVENT_NOT_FOUND]
        distinguishing_aspect: "The operational resources likewise raise their own 404 ids, including on action endpoints whose path parameter is the only identifier they take."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
          trigger:
            - call: "GET /sterilization/lots/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: RegulatoryAdmin
              captures: { e_lot: $.data.error_id }
            - call: "GET /sterilization/load-positions/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
              captures: { e_pos: $.data.error_id }
            - call: "POST /sterilization/indicators/00000000-0000-4000-8000-000000000013/reading"
              payload: { measured_dose_kgy: 30.00 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
              captures: { e_ind: $.data.error_id }
            - call: "POST /sterilization/aeration-records/00000000-0000-4000-8000-000000000014/residual-test"
              payload: { eto_residual_ppm: 1.0, ech_residual_ppm: 1.0 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
              captures: { e_aer: $.data.error_id }
            - call: "POST /sterilization/adverse-events/00000000-0000-4000-8000-000000000015/disposition"
              payload: { disposition: "DISMISS" }
              as: QualityReleaseOfficer
              as_user_id: "qro-1"
              captures: { e_ae: $.data.error_id }
          assert:
            - "${e_lot} == ERR_LOT_NOT_FOUND with HTTP 404"
            - "${e_pos} == ERR_LOAD_POSITION_NOT_FOUND with HTTP 404"
            - "${e_ind} == ERR_INDICATOR_NOT_FOUND with HTTP 404"
            - "${e_aer} == ERR_AERATION_RECORD_NOT_FOUND with HTTP 404"
            - "${e_ae} == ERR_ADVERSE_EVENT_NOT_FOUND with HTTP 404"

      - name: corner_error_envelope_shape_matches_the_contract
        claim_type: violation_to_error
        grounds:
          - response_envelope.error
          - errors[ERR_CUSTOMER_NOT_FOUND]
        distinguishing_aspect: "Every error response carries response_type error, a meta block with api_request_id and api_request_timestamp, and a data block holding exactly error_id and message - never a bare string or a top-level error field."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
          trigger:
            - call: "GET /sterilization/customers/00000000-0000-4000-8000-000000000021"
              payload: {}
              as: RegulatoryAdmin
              captures: { eid: $.data.error_id, msg: $.data.message }
          assert:
            - "response_type == error and HTTP 404"
            - "meta.api_request_id and meta.api_request_timestamp are both present"
            - "${eid} == ERR_CUSTOMER_NOT_FOUND and ${msg} is a non-empty string"

