            - { call: "POST /v1/memberships", payload: { group_id: "${g}", employee_id: "emp_k2" }, as: DeiAdmin }
            - { call: "POST /v1/venues", payload: { name: "FK Hall", capacity: 20 }, as: DeiAdmin, captures: { v: $.data.id } }
          trigger:
            - { call: "GET /v1/memberships", payload: { group_id: "${g}" }, as: DeiAdmin }
            - { call: "GET /v1/events", payload: { venue_id: "${v}" }, as: DeiAdmin }
            - { call: "GET /v1/groups", payload: { program_id: "${pid}" }, as: DeiAdmin }
          assert:
