      - call: POST /commercial/part-orders/${ord}/return
        payload: {}
        as: CommercialSalesRep
      - call: POST /commercial/commercial-accounts/${acct}/close
        payload: {}
        as: CreditAnalyst
        captures:
          err_id: $.data.error_id
      assert:
      - the delivered order returns cleanly and its core return is created in INITIATED
      - the close is rejected with ${err_id} == "ERR_OPEN_LOANS_EXIST"
      - CommercialAccount.${acct}.account_posture == "OPEN" after the rejected close
      - after the loan is returned, inspected and closed through the return-desk stop, the same close call is then rejected with ERR_OPEN_CORE_RETURNS_EXIST
      - only once the core return is credited does the close succeed and set account_posture to "CLOSED"
