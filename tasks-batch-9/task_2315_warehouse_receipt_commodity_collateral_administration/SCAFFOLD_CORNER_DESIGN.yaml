  - section: calculations
    instances:
      - name: federal_program_requirements_scale_with_licensed_capacity
        claim_type: correct_result
        grounds: ["calculations.license_bond_and_net_worth_requirement", "entities.Warehouse.required_net_worth_cents", "entities.Warehouse.required_bond_cents"]
        distinguishing_aspect: "For a FEDERAL warehouse of 2000000 bu: required_net_worth 16000000 (8c/bu beats the 10000000 floor), tolerance 4000000, shortfall 4000000 on net worth 12000000, and required_bond 12000000 = 6000000 base + round_half_up(4000000 * 1.5)."
        test_recipe:
          setup: ["Empty DB; clock at 2026-08-05T08:00:00Z."]
          setup_api_calls:
            - *b_clock
          trigger:
            - call: "POST /warehouses"
              payload:
                name: "Federal Terminal"
                operator_name: "River Terminal LLC"
                state_code: "IA"
                license_program: "FEDERAL"
                licensed_capacity_bushels: 2000000
                bond_amount_cents: 12000000
                net_worth_cents: 12000000
                loadout_lane_count: 4
                registry_participant: true
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { fed_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Warehouse.${fed_id}.required_net_worth_cents == 16000000"
            - "Warehouse.${fed_id}.net_worth_shortfall_cents == 4000000"
            - "Warehouse.${fed_id}.net_worth_tolerance_cents == 4000000"
            - "Warehouse.${fed_id}.required_bond_cents == 12000000"
            - "Warehouse.${fed_id}.bond_deficiency_cents == 0"

      - name: net_worth_shortfall_one_cent_over_tolerance_blocks_license
        claim_type: threshold_boundary
        grounds: ["calculations.license_bond_and_net_worth_requirement", "validations[priority 80]", "errors[ERR_NET_WORTH_INSUFFICIENT]"]
        distinguishing_aspect: "Net worth 11999999 gives shortfall 4000001 against tolerance 4000000 — one cent past the strictly-greater test — so ISSUE returns 422 ERR_NET_WORTH_INSUFFICIENT even though the bond 12000002 exactly meets the inflated requirement."
        test_recipe:
          setup: ["APPLIED FEDERAL warehouse of 2000000 bu with net worth 11999999 and bond 12000002."]
          setup_api_calls:
            - *b_clock
            - call: "POST /warehouses"
              payload:
                name: "Federal Terminal"
                operator_name: "River Terminal LLC"
                state_code: "IA"
                license_program: "FEDERAL"
                licensed_capacity_bushels: 2000000
                bond_amount_cents: 12000002
                net_worth_cents: 11999999
                loadout_lane_count: 4
                registry_participant: true
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { fed_nw_id: $.data.id }
          trigger:
            - call: "POST /warehouses/${fed_nw_id}/license-decision"
              payload: { decision: "ISSUE", license_effective_date: "2026-08-01", license_expiry_date: "2027-07-31" }
              as: StateRegulator
              as_user_id: "reg-001"
          assert:
            - "HTTP 422 with data.error_id == ERR_NET_WORTH_INSUFFICIENT"
            - "Warehouse.${fed_nw_id}.net_worth_shortfall_cents == 4000001"
            - "Warehouse.${fed_nw_id}.net_worth_tolerance_cents == 4000000"
            - "Warehouse.${fed_nw_id}.required_bond_cents == 12000002"
            - "Warehouse.${fed_nw_id}.bond_deficiency_cents == 0"
            - "Warehouse.${fed_nw_id}.license_state == APPLIED"

      - name: bond_one_cent_short_blocks_license_after_net_worth_passes
        claim_type: threshold_boundary
        grounds: ["calculations.license_bond_and_net_worth_requirement", "validations[priority 82]", "errors[ERR_BOND_INSUFFICIENT]"]
        distinguishing_aspect: "Shortfall exactly equal to tolerance clears priority 80, so the failure surfaces at priority 82: bond 11999999 against required 12000000 yields bond_deficiency_cents 1 and 422 ERR_BOND_INSUFFICIENT."
        test_recipe:
          setup: ["APPLIED FEDERAL warehouse of 2000000 bu with net worth 12000000 (shortfall == tolerance) and bond 11999999."]
          setup_api_calls:
            - *b_clock
            - call: "POST /warehouses"
              payload:
                name: "Federal Terminal"
                operator_name: "River Terminal LLC"
                state_code: "IA"
                license_program: "FEDERAL"
                licensed_capacity_bushels: 2000000
                bond_amount_cents: 11999999
                net_worth_cents: 12000000
                loadout_lane_count: 4
                registry_participant: true
              as: StateRegulator
              as_user_id: "reg-001"
              captures: { fed_bd_id: $.data.id }
          trigger:
            - call: "POST /warehouses/${fed_bd_id}/license-decision"
              payload: { decision: "ISSUE", license_effective_date: "2026-08-01", license_expiry_date: "2027-07-31" }
              as: StateRegulator
              as_user_id: "reg-001"
          assert:
            - "HTTP 422 with data.error_id == ERR_BOND_INSUFFICIENT"
            - "Warehouse.${fed_bd_id}.net_worth_shortfall_cents == 4000000"
            - "Warehouse.${fed_bd_id}.bond_deficiency_cents == 1"
            - "Warehouse.${fed_bd_id}.license_state == APPLIED"

      - name: identity_preserved_variant_suppresses_moisture_shrink
        claim_type: variant_divergence
