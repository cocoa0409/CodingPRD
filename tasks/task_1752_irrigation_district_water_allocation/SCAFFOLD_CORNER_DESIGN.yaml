  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: create_season_missing_required_year_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=2]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A season create body missing the required field year is rejected with ERR_INVALID_REQUEST (400) before any state or business check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/seasons"
              payload: { announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); no season persisted"

      - name: create_season_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=2]", entities.IrrigationSeason.fields.billing_method, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "billing_method outside {PER_ACRE, PER_AF_DELIVERED} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_GALLON", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: create_window_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=2]", entities.MaintenanceWindow.fields.end_at, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A window whose end_at is not strictly after start_at fails shape validation with ERR_INVALID_REQUEST before any overlap logic runs."
        test_recipe:
          setup: ["Reach exists"]
          setup_api_calls:
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach SV", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
          trigger:
            - call: "POST /district/maintenance-windows"
              payload: { canal_reach_id: "${reach_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T08:00:00Z", reason: "backwards" }
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
