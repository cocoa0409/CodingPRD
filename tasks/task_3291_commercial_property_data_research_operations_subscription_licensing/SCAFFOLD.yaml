# =============================================================================
# PRD Benchmark Seed Tables — task_3291
# Commercial Property Data Research Operations & Subscription Licensing
# =============================================================================

scenario: |
  Commercial Property Data Research Operations & Subscription Licensing (CoStar Group):
  field research operations verifying property attributes, tenancy, lease comparables
  and sale transactions through direct contact and public records, data quality control
  with source documentation and update recency requirements, subscription licensing by
  seat, market and product with usage monitoring for unauthorized sharing, license
  enforcement including audits and litigation against redistribution, listing and
  marketing products where brokers publish availabilities that also become research
  inputs, analytics products including market forecasts and index construction,
  integration with adjacent residential and hospitality data platforms, customer
  contract terms with auto-renewal and market addition pricing

domain_name: commercial-property-data-licensing
api_prefix: /data-research

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - ops_run_checkpoint
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: delegated_authority
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the data provider, brokerage or subscriber firm" }
      - { name: org_type, type: enum, source: input, description: "DATA_PROVIDER | BROKERAGE | SUBSCRIBER", constraints: "enum in {DATA_PROVIDER, BROKERAGE, SUBSCRIBER}" }
      - { name: home_market, type: string, source: input, description: "Primary market code the organization operates in (e.g. TX-DALLAS)" }
      - { name: service_tier, type: enum, source: input, default: "ENTERPRISE", description: "ENTERPRISE | MID_MARKET | SMB — commercial tier of the account", constraints: "enum in {ENTERPRISE, MID_MARKET, SMB}" }
      - { name: authorized_market_count, type: integer, source: computed, default: 0, description: "Count of distinct markets across this organization's PENDING, ACTIVE, GRACE and RENEWED licensing contracts' licensed_markets arrays" }
      - { name: active_contract_count, type: integer, source: computed, default: 0, description: "Count of this organization's licensing contracts whose status IN {ACTIVE, GRACE}" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED gates the organization's seats from recording usage", constraints: "enum in {ACTIVE, SUSPENDED}" }

  - name: User
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; the organization this user belongs to" }
      - { name: email, type: string, source: input, description: "Login email; unique within the organization" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: role, type: enum, source: input, description: "RESEARCH_ANALYST | SEAT_USER | LICENSING_ADMIN | ENFORCEMENT_OFFICER | BROKER_PUBLISHER", constraints: "enum in {RESEARCH_ANALYST, SEAT_USER, LICENSING_ADMIN, ENFORCEMENT_OFFICER, BROKER_PUBLISHER}" }
      - { name: assigned_market, type: string, source: input, default: null, description: "Market code this analyst is assigned to research; required when role == RESEARCH_ANALYST" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE — INACTIVE users cannot be assigned as a seat occupant", constraints: "enum in {ACTIVE, INACTIVE}" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: parent_property_id, type: string, source: system, default: null, description: "FK -> Property.id; the source property when this row was created by subdivision, null for a research root record" }
      - { name: market, type: string, source: input, description: "Market code the property belongs to (e.g. TX-DALLAS)" }
      - { name: address_line, type: string, source: input, description: "Street address of the commercial property" }
      - { name: property_type, type: enum, source: input, description: "OFFICE | RETAIL | INDUSTRIAL | MULTIFAMILY | HOSPITALITY", constraints: "enum in {OFFICE, RETAIL, INDUSTRIAL, MULTIFAMILY, HOSPITALITY}" }
      - { name: rentable_sqft, type: integer, source: input, description: "Rentable square footage; must be > 0" }
      - { name: classification, type: enum, source: input, default: "CLASS_B", description: "CLASS_A | CLASS_B | CLASS_C", constraints: "enum in {CLASS_A, CLASS_B, CLASS_C}" }
      - { name: research_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | RESEARCHING | VERIFIED", constraints: "enum in {DRAFT, RESEARCHING, VERIFIED}" }
      - { name: land_posture, type: enum, source: computed, default: "OPEN", description: "OPEN | RESTRICTED | FROZEN — derived from unverified attribute count and stale-source count; gates field edits", constraints: "enum in {OPEN, RESTRICTED, FROZEN}" }
      - { name: attribute_verified_count, type: integer, source: computed, default: 0, description: "Count of this property's PropertyAttribute rows whose proposed_status IN {NONE, VERIFIED}" }
      - { name: attribute_total_count, type: integer, source: computed, default: 0, description: "Count of this property's PropertyAttribute rows" }
      - { name: completeness_pct, type: number, source: computed, default: 0.0, description: "Weighted data-quality score computed by the weighted_completeness_score calculation" }
      - { name: stale_source_count, type: integer, source: computed, default: 0, description: "Count of this property's SourceDocument rows whose obtained_at is older than SOURCE_FRESHNESS_DAYS" }
      - { name: verified_sale_value_cents, type: integer, source: computed, default: 0, description: "Sum of gross_sale_price_cents over this property's SaleTransaction rows whose subordination_status == SUBORDINATED" }

  - name: SourceDocument
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; the property this evidence supports" }
      - { name: source_type, type: enum, source: input, description: "DEED | PUBLIC_RECORD | DIRECT_CONTACT | BROKER_LISTING | THIRD_PARTY_FEED", constraints: "enum in {DEED, PUBLIC_RECORD, DIRECT_CONTACT, BROKER_LISTING, THIRD_PARTY_FEED}" }
      - { name: source_name, type: string, source: input, description: "Human-readable name of the source (recording office, contact, feed vendor)" }
      - { name: contact_method, type: enum, source: input, description: "PHONE | EMAIL | SITE_VISIT | RECORDS_REQUEST | FEED_IMPORT", constraints: "enum in {PHONE, EMAIL, SITE_VISIT, RECORDS_REQUEST, FEED_IMPORT}" }
      - { name: distributed_markets, type: array, source: input, default: [], description: "Non-empty list of markets in which this evidence was obtained from a redistributed third-party feed" }
      - { name: obtained_at, type: datetime, source: input, description: "ISO 8601 UTC instant the evidence was obtained; must not be in the future relative to the logical clock" }
      - { name: source_classification, type: enum, source: computed, description: "FIRST_PARTY | THIRD_PARTY_LICENSED — THIRD_PARTY_LICENSED when source_type == THIRD_PARTY_FEED or distributed_markets is non-empty", constraints: "enum in {FIRST_PARTY, THIRD_PARTY_LICENSED}" }

  - name: PropertyAttribute
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; the property this attribute describes" }
      - { name: source_document_id, type: string, source: input, description: "FK -> SourceDocument.id; the evidence row authorizing this attribute claim" }
      - { name: field_name, type: string, source: input, description: "Attribute key being researched (e.g. tenant_name, occupancy_pct, asking_rent_psf); unique per property" }
      - { name: value, type: string, source: input, description: "Currently committed attribute value" }
      - { name: proposed_value, type: string, source: input, default: null, description: "Value submitted for review by an attribute-update call; null when no proposal is pending" }
      - { name: proposed_status, type: enum, source: system, default: "NONE", description: "NONE | PENDING | VERIFIED | REJECTED", constraints: "enum in {NONE, PENDING, VERIFIED, REJECTED}" }
      - { name: created_by_user_id, type: string, source: system, description: "FK -> User.id; the analyst who created this attribute, recorded from X-User-ID; a different analyst must verify it" }
      - { name: verifier_user_id, type: string, source: system, default: null, description: "FK -> User.id; the analyst who last verified or rejected this attribute" }
      - { name: last_verified_at, type: datetime, source: system, description: "ISO 8601 UTC instant the attribute value was last verified" }
      - { name: attribute_market, type: string, source: input, description: "Market code the attribute claim pertains to; must equal the parent property's market" }
      - { name: from_third_party, type: boolean, source: input, default: false, description: "True when the attribute claim derives from a THIRD_PARTY_LICENSED source document" }
      - { name: third_party_approved, type: boolean, source: input, default: false, description: "True when the subscriber has licensed third-party redistribution for the attribute's market" }
      - { name: revision_index, type: integer, source: system, default: 1, description: "Monotone revision counter, incremented on every accepted value change" }

  - name: LeaseComparable
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; the property this lease comp belongs to" }
      - { name: tenant_name, type: string, source: input, description: "Tenant named on the lease" }
      - { name: lease_start, type: datetime, source: input, description: "Lease commencement instant" }
      - { name: lease_end, type: datetime, source: input, description: "Lease expiration instant; must be strictly after lease_start" }
      - { name: escalated_rent_psf, type: number, source: input, description: "Contracted escalated rent in dollars per square foot per year" }
      - { name: effective_rent_psf, type: number, source: input, description: "Net effective rent in dollars per square foot per year (concession-adjusted)" }
      - { name: renewal_option, type: boolean, source: input, default: false, description: "True when the lease carries a tenant renewal option" }
      - { name: recorded_at, type: datetime, source: system, description: "ISO 8601 UTC instant the comp entered the research record" }

  - name: SaleTransaction
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; the property this sale pertains to" }
      - { name: buyer_name, type: string, source: input, description: "Buyer of record" }
      - { name: close_date, type: datetime, source: input, description: "Sale close instant" }
      - { name: gross_sale_price_cents, type: integer, source: input, description: "Gross sale price in cents; must be > 0" }
      - { name: cap_rate_bps, type: integer, source: computed, description: "Capitalization rate in basis points derived from gross price and the property's in-place income" }
      - { name: subordination_deadline, type: datetime, source: system, description: "Instant by which licensed-market subordination must be recorded: close_date + 10 days" }
      - { name: subordination_status, type: enum, source: system, default: "PENDING", description: "PENDING | SUBORDINATED | LAPSED", constraints: "enum in {PENDING, SUBORDINATED, LAPSED}" }
      - { name: subordinated_at, type: datetime, source: system, default: null, description: "Instant subordination was recorded; null while PENDING" }
      - { name: subordinating_case_id, type: string, source: system, default: null, description: "FK -> EnforcementCase.id; the enforcement case that subordinated this transaction" }
      - { name: rolled_attributions, type: integer, source: system, default: 0, description: "Count of times this transaction was attributed to a market index, used by the roll-attribution compensating invariant" }

  - name: LicensingContract
    parent: Organization
    common_fields: true
    fields:
      - { name: subscriber_organization_id, type: string, source: system, description: "FK -> Organization.id; the subscribing organization" }
      - { name: product, type: enum, source: input, description: "CORE_MARKET_DATA | ANALYTICS_INDEX | LISTING_SERVICE | GLOBAL_ALL", constraints: "enum in {CORE_MARKET_DATA, ANALYTICS_INDEX, LISTING_SERVICE, GLOBAL_ALL}" }
      - { name: licensed_markets, type: array, source: input, default: [], description: "Markets the subscriber may access under this contract; each element must be unique" }
      - { name: seat_count, type: integer, source: input, description: "Contractual number of named seats; must be >= 1" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Annual subscription fee in cents; must be > 0" }
      - { name: monthly_index_fee_cents, type: integer, source: input, default: 0, description: "Per-active-market monthly index fee in cents; applies only when product == ANALYTICS_INDEX" }
      - { name: auto_renew, type: boolean, source: input, default: true, description: "When true the contract rolls into a new term unless a termination decision is recorded before renewal_due_at" }
      - { name: renewal_notice_days, type: integer, source: input, default: 30, description: "Days before term_end at which the renewal decision becomes due" }
      - { name: term_start, type: datetime, source: input, description: "Contract term start instant" }
      - { name: term_end, type: datetime, source: input, description: "Contract term end instant; must be strictly after term_start" }
      - { name: renewal_decision, type: enum, source: system, default: "NONE", description: "NONE | FAILED | TERMINATED — FAILED records a lapsed auto-renewal, TERMINATED records an exercised termination", constraints: "enum in {NONE, FAILED, TERMINATED}" }
      - { name: renewal_due_at, type: datetime, source: computed, description: "term_end minus renewal_notice_days" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | GRACE | RENEWED | LAPSED | TERMINATED", constraints: "enum in {PENDING, ACTIVE, GRACE, RENEWED, LAPSED, TERMINATED}" }
      - { name: audit_intensity, type: enum, source: input, default: "STANDARD", description: "STANDARD | ENHANCED — ENHANCED permits litigation escalation of redistribution findings", constraints: "enum in {STANDARD, ENHANCED}" }

  - name: LicenseSeat
    parent: LicensingContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> LicensingContract.id; the contract this seat draws entitlement from" }
      - { name: occupant_user_id, type: string, source: system, default: null, description: "FK -> User.id; the named user currently occupying the seat" }
      - { name: market, type: string, source: input, description: "The single licensed market this seat consumes; must appear in the contract's licensed_markets" }
      - { name: index_tier, type: enum, source: input, default: "TIER_2", description: "TIER_1 | TIER_2 | TIER_3 — analytics index tier attached to the seat", constraints: "enum in {TIER_1, TIER_2, TIER_3}" }
      - { name: monthly_active_days, type: integer, source: system, default: 0, description: "Distinct calendar days in the current cycle on which this seat recorded at least one usage event" }
      - { name: monthly_unauthorized_markets, type: array, source: system, default: [], description: "Markets in which this seat was observed accessing data outside the contract's licensed_markets during the current cycle" }
      - { name: distinctive_ip_count, type: integer, source: system, default: 0, description: "Distinct source IP addresses observed for this seat during the current cycle" }
      - { name: shared_flag, type: boolean, source: system, default: false, description: "True when distinctive_ip_count exceeds the tier's sharing threshold; set by usage monitoring" }
      - { name: overage_fee_cents, type: integer, source: computed, default: 0, description: "Cycle overage fee computed by the seat_overage_fee calculation" }
      - { name: owner_user_id, type: string, source: computed, default: null, description: "Attributed seat owner from the seat_owner_attribution weekly_snapshot variant; tie-breaks use occurred_at then created_at, never id" }
      - { name: owner_share_pct, type: number, source: computed, default: 0.0, description: "Interim sharing attribution percentage from the seat_owner_attribution weekly_snapshot variant, recomputed on every usage event" }
      - { name: billed_owner_share_pct, type: number, source: computed, default: 0.0, description: "Billed sharing attribution percentage from the seat_owner_attribution monthly_cycle variant, written by run_research_cycle" }
      - { name: access_revoked, type: boolean, source: system, default: false, description: "True when the seat's access has been revoked by an enforcement or sharing action" }
      - { name: last_usage_cycle, type: datetime, source: input, description: "Start instant of the billing cycle this seat's usage counters belong to" }

  - name: UsageEvent
    parent: LicenseSeat
    common_fields: false
    fields:
      - { name: seat_id, type: string, source: system, description: "FK -> LicenseSeat.id; the seat that produced this access record" }
      - { name: user_id, type: string, source: system, description: "FK -> User.id; the user credential presented on this access" }
      - { name: market, type: string, source: input, description: "Market of the dataset or report accessed by this event" }
      - { name: event_type, type: enum, source: input, description: "DATASET_DOWNLOAD | REPORT_EXPORT | BULK_LOOKUP | API_QUERY", constraints: "enum in {DATASET_DOWNLOAD, REPORT_EXPORT, BULK_LOOKUP, API_QUERY}" }
      - { name: record_count, type: integer, source: input, description: "Number of property records touched by the event; must be >= 0" }
      - { name: distinguishing_ip, type: string, source: input, description: "Source IP address of the access" }
      - { name: occurred_at, type: datetime, source: input, description: "ISO 8601 UTC instant of the access; used for cycle membership and distinct-day counting" }

  - name: EnforcementCase
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; the organization under enforcement" }
      - { name: contract_id, type: string, source: system, description: "FK -> LicensingContract.id; the contract the finding relates to" }
      - { name: case_type, type: enum, source: input, description: "AUDIT | LITIGATION", constraints: "enum in {AUDIT, LITIGATION}" }
      - { name: finding_cents, type: integer, source: input, description: "Assessed value of the unauthorized redistribution finding in cents; must be >= 0" }
      - { name: fee_rate_pct, type: number, source: input, description: "Contractual penalty percentage applied to the finding (e.g. 1.5 means 150%)" }
      - { name: penalty_cents, type: computed, description: "finding_cents * fee_rate_pct rounded half-up to an integer number of cents" }
      - { name: escalated_at, type: datetime, source: system, default: null, description: "Instant an audit was escalated to litigation; null while not escalated" }
      - { name: escalated_from_case_id, type: string, source: system, default: null, description: "FK -> EnforcementCase.id; the AUDIT case this LITIGATION case was escalated from" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | ESCALATED | SETTLED | WITHDRAWN", constraints: "enum in {OPEN, ESCALATED, SETTLED, WITHDRAWN}" }

  - name: AnalyticsRun
    parent: null
    common_fields: true
    fields:
      - { name: market, type: string, source: input, description: "Market code the index or forecast applies to" }
      - { name: run_type, type: enum, source: system, description: "INDEX | FORECAST", constraints: "enum in {INDEX, FORECAST}" }
      - { name: adjustment_mode, type: enum, source: input, default: "UNADJUSTED", description: "UNADJUSTED | HEDONIC — selects the market_index_value variant", constraints: "enum in {UNADJUSTED, HEDONIC}" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive lower bound of the comparable window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive upper bound of the comparable window" }
      - { name: index_value, type: number, source: computed, description: "Occurrence-weighted mean effective rent for the market and window; null when comp_count == 0" }
      - { name: comp_count, type: integer, source: computed, description: "Occurrence-weighted comparable count entering index_value; 0 signals ERR_EMPTY_INDEX_SET" }
      - { name: mean_effective_rent_psf, type: number, source: computed, description: "Arithmetic mean effective_rent_psf over the refined comp set" }
      - { name: median_effective_rent_psf, type: number, source: computed, description: "Median effective_rent_psf over the refined comp set" }
      - { name: selector, type: enum, source: input, default: "LATEST", description: "LATEST | EARLIEST | UPPER_BOUND — selects the base run for a forecast", constraints: "enum in {LATEST, EARLIEST, UPPER_BOUND}" }
      - { name: forecast_value, type: number, source: computed, description: "Projected index value from the market_forecast calculation; null on an INDEX run" }
      - { name: forecast_due_at, type: datetime, source: computed, description: "window_end advanced by the forecast horizon" }
      - { name: attributed_records_delta, type: integer, source: computed, default: 0, description: "Records this run contributes to its market's attributed-record count; set to comp_count on creation and to 0 by an attribution removal" }
      - { name: attribution_status, type: enum, source: system, default: "ATTRIBUTED", description: "ATTRIBUTED | UNWOUND", constraints: "enum in {ATTRIBUTED, UNWOUND}" }

  - name: Listing
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; the property being marketed" }
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id; the brokerage publishing the availability" }
      - { name: listing_type, type: enum, source: input, description: "AVAILABLE | LEASED | SOLD", constraints: "enum in {AVAILABLE, LEASED, SOLD}" }
      - { name: monthly_rent_psf, type: number, source: input, description: "Asking monthly rent in dollars per square foot" }
      - { name: available_sqft, type: integer, source: input, description: "Square footage offered; must be > 0" }
      - { name: published_at, type: datetime, source: system, description: "Instant the listing was published" }
      - { name: expires_at, type: datetime, source: system, description: "published_at + LISTING_TTL_DAYS" }
      - { name: redistributed_markets, type: array, source: system, default: [], description: "Markets into which this listing has been syndicated beyond its origin market" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PUBLISHED | WITHDRAWN | EXPIRED", constraints: "enum in {DRAFT, PUBLISHED, WITHDRAWN, EXPIRED}" }
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Property
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: RESEARCHING
        trigger: "POST /data-research/properties/{propertyId}/research/start"
        actor: RESEARCH_ANALYST
        preconditions:
          - "Property.research_status == DRAFT (ERR_INVALID_STATE otherwise)"
          - "Property.land_posture != FROZEN (ERR_PROPERTY_FROZEN otherwise)"
        side_effects:
          - "Property.research_status = RESEARCHING"
          - "Property.completeness_pct recomputed under the PROVISIONAL variant of weighted_completeness_score"
          - "Property.updated_at refreshed; Property.version += 1"

      - from: DRAFT
        to: RESEARCHING
        trigger: "system (automatic when the first PENDING PropertyAttribute is created on the property)"
        actor: system
        preconditions:
          - "Property.land_posture != FROZEN"
        side_effects:
          - "Property.research_status = RESEARCHING"
          - "Property.attribute_total_count += 1"
          - "Property.completeness_pct recomputed under the PROVISIONAL variant"
        note: "Fires only when the property is still DRAFT; a RESEARCHING or VERIFIED property is unaffected."

      - from: DRAFT
        to: DRAFT
        trigger: "POST /data-research/properties/{propertyId}/subdivision"
        actor: RESEARCH_ANALYST
        preconditions:
          - "Property.research_status == DRAFT (ERR_INVALID_STATE otherwise)"
          - "Property.land_posture != FROZEN (ERR_PROPERTY_FROZEN otherwise)"
        side_effects:
          - "Creates a new Property with parent_property_id = <this property id>, research_status = DRAFT, land_posture = OPEN and the subdivision's market, address_line, property_type, rentable_sqft and classification"
          - "The source Property row is unchanged except updated_at and version += 1"
        note: "Self-referential subdivision: the new row is the first link of the state dependency Property.child -> Property.parent, and the root row stays DRAFT so it can branch again."

      - from: DRAFT
        to: VERIFIED
        trigger: "POST /data-research/properties/{propertyId}/finalize"
        actor: RESEARCH_ANALYST
        preconditions:
          - "Property.research_status == DRAFT (ERR_INVALID_STATE otherwise)"
          - "land_posture == OPEN (ERR_PROPERTY_RESTRICTED / ERR_PROPERTY_FROZEN otherwise)"
          - "attribute_total_count >= 1 (ERR_EMPTY_ATTRIBUTE_SET otherwise)"
          - "No PropertyAttribute on this property has proposed_status == PENDING (ERR_ATTRIBUTES_UNRESOLVED otherwise)"
        side_effects:
          - "Property.research_status = VERIFIED"
          - "Property.completeness_pct recomputed under the FINAL variant"
          - "Property.updated_at refreshed; Property.version += 1"
        note: "A fully-attribute-populated record may be published without an explicit researching phase; there is no DRAFT -> VERIFIED edge when the attribute set is empty."

      - from: RESEARCHING
        to: VERIFIED
        trigger: "POST /data-research/properties/{propertyId}/finalize"
        actor: RESEARCH_ANALYST
        preconditions:
          - "Property.research_status == RESEARCHING (ERR_INVALID_STATE otherwise)"
          - "land_posture == OPEN (ERR_PROPERTY_RESTRICTED when RESTRICTED; ERR_PROPERTY_FROZEN when FROZEN)"
          - "attribute_total_count >= 1 (ERR_EMPTY_ATTRIBUTE_SET otherwise)"
          - "No PropertyAttribute on this property has proposed_status == PENDING (ERR_ATTRIBUTES_UNRESOLVED otherwise)"
        side_effects:
          - "Property.research_status = VERIFIED"
          - "Property.completeness_pct recomputed under the FINAL variant of weighted_completeness_score"
          - "Property.updated_at refreshed; Property.version += 1"

      - from: RESEARCHING
        to: RESEARCHING
        trigger: "POST /data-research/reports/market-escalations"
        actor: ENFORCEMENT_OFFICER
        preconditions:
          - "Property.research_status == RESEARCHING (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Property.land_posture = RESTRICTED for every Property whose market is in the escalation's markets array and whose research_status IN {DRAFT, RESEARCHING}"
          - "RESTRICTED gates any new SourceDocument attachment: attachment returns ERR_PROPERTY_RESTRICTED"
          - "Property.completeness_pct recomputed under the PROVISIONAL variant (stale_source_count may have changed)"
        note: "Cross-entity dependency Property(land_posture) -> Organization(status): the caller's organization must be ACTIVE."

      - from: VERIFIED
        to: RESEARCHING
        trigger: "POST /data-research/reports/market-escalations"
        actor: ENFORCEMENT_OFFICER
        side_effects:
          - "Property.research_status = RESEARCHING and Property.land_posture = FROZEN for every Property whose market is in the escalation's markets array and whose research_status == VERIFIED"
          - "FROZEN blocks finalize, research/start and subdivision: each returns ERR_PROPERTY_FROZEN"
          - "Every PropertyAttribute on the frozen property whose proposed_status == PENDING is set to NONE and its proposed_value cleared"
        note: "Guarded cross-entity transition: only a property whose market is under an escalation of the CALLER's organization can leave VERIFIED."

      - from: RESEARCHING
        to: RESEARCHING
        trigger: "system (automatic recompute after any SourceDocument or PropertyAttribute change on the property)"
        actor: system
        preconditions: []
        side_effects:
          - "Property.attribute_verified_count, Property.attribute_total_count, Property.stale_source_count, Property.land_posture and Property.completeness_pct recomputed"
        note: "Self-loop recompute so every child mutation lands on a declared transition."

  - entity: PropertyAttribute
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PENDING
        trigger: "POST /data-research/properties/{propertyId}/attributes/{attributeId}/proposals"
        actor: RESEARCH_ANALYST
        preconditions:
          - "PropertyAttribute.proposed_status == NONE (ERR_INVALID_STATE otherwise)"
          - "PropertyAttribute.from_third_party == true requires PropertyAttribute.third_party_approved == true (ERR_THIRD_PARTY_UNLICENSED otherwise)"
          - "PropertyAttribute.attribute_market == Property.market (ERR_ATTRIBUTE_MARKET_MISMATCH otherwise)"
          - "Property.land_posture == OPEN (ERR_PROPERTY_FROZEN when FROZEN; ERR_PROPERTY_RESTRICTED when RESTRICTED)"
        side_effects:
          - "PropertyAttribute.proposed_status = PENDING and proposed_value = the submitted value"
          - "Property.attribute_total_count, attribute_verified_count, land_posture and completeness_pct recomputed (PROVISIONAL variant)"
        note: "Cyclic edge #1: a PENDING attribute that is rejected returns to NONE and may be proposed again."

      - from: PENDING
        to: VERIFIED
        trigger: "POST /data-research/attributes/{attributeId}/verifications"
        actor: RESEARCH_ANALYST
        preconditions:
          - "PropertyAttribute.proposed_status == PENDING (ERR_INVALID_STATE otherwise)"
          - "Property.land_posture == OPEN (ERR_PROPERTY_FROZEN / ERR_PROPERTY_RESTRICTED otherwise)"
          - "verifier_user_id != PropertyAttribute.created_by_user_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "PropertyAttribute.value = proposed_value; proposed_value = null"
          - "PropertyAttribute.revision_index += 1; last_verified_at = <logical clock>"
          - "PropertyAttribute.proposed_status = VERIFIED"
          - "Property.attribute_verified_count and completeness_pct recomputed (provisional variant)"

      - from: PENDING
        to: NONE
        trigger: "POST /data-research/attributes/{attributeId}/rejections"
        actor: RESEARCH_ANALYST
        preconditions:
          - "PropertyAttribute.proposed_status == PENDING (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "PropertyAttribute.proposed_value = null; proposed_status = NONE"
          - "Property.attribute_verified_count and completeness_pct recomputed (PROVISIONAL variant)"

      - from: VERIFIED
        to: NONE
        trigger: "POST /data-research/properties/{propertyId}/attributes/{attributeId}/proposals"
        actor: RESEARCH_ANALYST
        side_effects:
          - "PropertyAttribute.proposed_status = NONE and proposed_value = null"
          - "Property.attribute_verified_count and completeness_pct recomputed (PROVISIONAL variant)"
        note: "Cyclic edge #2: a verified attribute can be re-opened by a fresh proposal, so the machine is a cycle rather than a pipeline."

  - entity: LicensingContract
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /data-research/licensing-contracts/{contractId}/activate"
        actor: LICENSING_ADMIN
        preconditions:
          - "LicensingContract.status == PENDING (ERR_INVALID_STATE otherwise)"
          - "At least one LicenseSeat exists on the contract (ERR_NO_SEATS otherwise)"
          - "Every LicenseSeat.market appears in LicensingContract.licensed_markets (ERR_SEAT_MARKET_NOT_LICENSED otherwise)"
          - "LicensingContract lacks current activation (ERR_STALE_VERSION otherwise)"
        side_effects:
          - "LicensingContract.status = ACTIVE"
          - "LicensingContract.renewal_due_at = term_end - renewal_notice_days days"
          - "Subscriber Organization.authorized_market_count and active_contract_count recomputed"
          - "LicensingContract.version += 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /data-research/licensing-contracts/{contractId}/markets"
        actor: LICENSING_ADMIN
        preconditions:
          - "LicensingContract.status == ACTIVE (ERR_INVALID_STATE otherwise)"
          - "market is not already present in licensed_markets (ERR_MARKET_ALREADY_LICENSED otherwise)"
          - "LicensingContract lacks current marketplace state (ERR_STALE_VERSION otherwise)"
        side_effects:
          - "LicensingContract.licensed_markets += market"
          - "LicensingContract.annual_fee_cents += market_addition_fee_cents, where market_addition_fee_cents is the market_addition_fee calculation output"
          - "Subscriber Organization.authorized_market_count recomputed"
          - "LicensingContract.version += 1"

      - from: ACTIVE
        to: RENEWED
        trigger: "POST /data-research/licensing-contracts/{contractId}/renewals"
        actor: LICENSING_ADMIN
        preconditions:
          - "LicensingContract.status == ACTIVE (ERR_INVALID_STATE otherwise)"
          - "LicensingContract.auto_renew == true (ERR_AUTO_RENEW_DISABLED otherwise)"
          - "LicensingContract.renewal_decision != TERMINATED (ERR_RENEWAL_TERMINATED otherwise)"
          - "logical clock < LicensingContract.renewal_due_at (ERR_RENEWAL_LAPSED otherwise)"
        side_effects:
          - "LicensingContract.term_start = previous term_end; LicensingContract.term_end = new term_end from the request"
          - "LicensingContract.annual_fee_cents = new annual_fee_cents from the request"
          - "LicensingContract.status = RENEWED; renewal_decision = NONE; renewal_due_at recomputed"
          - "Subscriber Organization.active_contract_count recomputed"
          - "LicensingContract.version += 1"

      - from: RENEWED
        to: ACTIVE
        trigger: "system (automatic when the renewed term start reaches the logical clock)"
        actor: system
        preconditions: []
        side_effects:
          - "LicensingContract.status = ACTIVE"
          - "Subscriber Organization.active_contract_count recomputed"
        note: "Cyclic edge: a renewal puts the contract back into ACTIVE, so ACTIVE → RENEWED → ACTIVE is a cycle, not a pipeline."

      - from: ACTIVE
        to: GRACE
        trigger: "system (automatic during run_research_cycle when renewal_due_at has passed with auto_renew == true and renewal_decision == NONE)"
        actor: system
        preconditions: []
        side_effects:
          - "LicensingContract.status = GRACE"
          - "Every LicenseSeat on the contract: access_revoked = false (grace retains read access)"
          - "Subscriber Organization.active_contract_count recomputed"

      - from: GRACE
        to: LAPSED
        trigger: "system (automatic during run_research_cycle when term_end has passed and the contract is still GRACE)"
        actor: system
        preconditions: []
        side_effects:
          - "LicensingContract.status = LAPSED; LicensingContract.renewal_decision = FAILED"
          - "Every LicenseSeat on the contract: access_revoked = true"
          - "Subscriber Organization.active_contract_count recomputed"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /data-research/licensing-contracts/{contractId}/terminations"
        actor: LICENSING_ADMIN
        preconditions:
          - "LicensingContract.status == ACTIVE (ERR_INVALID_STATE otherwise)"
          - "logical clock < renewal_due_at (ERR_TERMINATION_WINDOW_CLOSED otherwise)"
        side_effects:
          - "LicensingContract.status = TERMINATED; LicensingContract.renewal_decision = TERMINATED"
          - "Every LicenseSeat on the contract: access_revoked = true"
          - "Subscriber Organization.active_contract_count recomputed"
          - "LicensingContract.version += 1"

      - from: GRACE
        to: TERMINATED
        trigger: "POST /data-research/licensing-contracts/{contractId}/terminations"
        actor: LICENSING_ADMIN
        preconditions:
          - "logical clock < term_end (ERR_TERMINATION_WINDOW_CLOSED otherwise)"
        side_effects:
          - "LicensingContract.status = TERMINATED; renewal_decision = TERMINATED"
          - "Every LicenseSeat on the contract: access_revoked = true"

  - entity: LicenseSeat
    initial_state: UNASSIGNED
    terminal_states: [REVOKED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /data-research/licensing-contracts/{contractId}/seats/{seatId}/assignment"
        actor: LICENSING_ADMIN
        preconditions:
          - "LicenseSeat.occupant_user_id == null (ERR_SEAT_ALREADY_ASSIGNED otherwise)"
          - "User.status == ACTIVE (ERR_USER_INACTIVE otherwise)"
          - "User.organization_id == LicensingContract.subscriber_organization_id (ERR_USER_OUT_OF_SCOPE otherwise)"
          - "LicensingContract.status IN {ACTIVE, GRACE} (ERR_SUBSCRIPTION_INACTIVE otherwise)"
        side_effects:
          - "LicenseSeat.occupant_user_id = the assigned user"
          - "LicenseSeat.access_revoked = false"
          - "LicensingContract.version += 1"

      - from: ASSIGNED
        to: UNASSIGNED
        trigger: "POST /data-research/licensing-contracts/{contractId}/seats/{seatId}/unassignment"
        actor: LICENSING_ADMIN
        preconditions:
          - "LicenseSeat.occupant_user_id != null (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "LicenseSeat.occupant_user_id = null"
          - "LicensingContract.version += 1"

      - from: ASSIGNED
        to: REVOKED
        trigger: "system (automatic when the seat's contract reaches LAPSED or TERMINATED, or when a litigation escalation targets the seat's contract)"
        actor: system
        preconditions: []
        side_effects:
          - "LicenseSeat.access_revoked = true"
          - "LicenseSeat.shared_flag = false"
        note: "Terminal: a revoked seat can only be replaced by a fresh seat row on a new contract."

  - entity: Organization
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /data-research/enforcement-cases/{caseId}/escalations"
        actor: ENFORCEMENT_OFFICER
        preconditions:
          - "EnforcementCase.case_type == AUDIT (ERR_LITIGATION_NOT_ESCALATABLE when case_type == LITIGATION)"
          - "EnforcementCase.status == OPEN (ERR_INVALID_STATE otherwise)"
          - "EnforcementCase.penalty_cents >= LITIGATION_PENALTY_THRESHOLD_CENTS (ERR_PENALTY_BELOW_LITIGATION_FLOOR otherwise)"
          - "Logging organization's LicensingContract.audit_intensity == ENHANCED (ERR_LITIGATION_NOT_PERMITTED otherwise)"
        side_effects:
          - "EnforcementCase.status = ESCALATED; escalated_at = <logical clock>"
          - "Organization.status = SUSPENDED"
          - "Every LicensingContract of the organization with status IN {ACTIVE, GRACE}: status = TERMINATED; every LicenseSeat on those contracts: access_revoked = true"
          - "Organization.active_contract_count recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /data-research/enforcement-cases/{caseId}/settlements"
        actor: ENFORCEMENT_OFFICER
        preconditions:
          - "EnforcementCase.status == ESCALATED (ERR_INVALID_STATE otherwise)"
          - "settlement offer >= penalty_cents (ERR_SETTLEMENT_INSUFFICIENT otherwise)"
        side_effects:
          - "EnforcementCase.status = SETTLED"
          - "Organization.status = ACTIVE"
        note: "Cycle ACTIVE → SUSPENDED → ACTIVE is reachable by escalation followed by settlement."

  - entity: SaleTransaction
    initial_state: PENDING
    terminal_states: [SUBORDINATED, LAPSED]
    transitions:
      - from: PENDING
        to: SUBORDINATED
        trigger: "POST /data-research/sale-transactions/{transactionId}/subordinations"
        actor: EnforcementOfficer
        preconditions:
          - "SaleTransaction.subordination_status == PENDING (ERR_INVALID_STATE otherwise)"
          - "logical clock < SaleTransaction.subordination_deadline (ERR_SUBORDINATION_DEADLINE_PASSED otherwise)"
          - "SaleTransaction lacks current subordination state (ERR_STALE_VERSION otherwise)"
        side_effects:
          - "SaleTransaction.subordination_status = SUBORDINATED; subordinated_at = <logical clock>"
          - "SaleTransaction.subordinating_case_id = the supplied case"
          - "Property.verified_sale_value_cents recomputed as the sum of gross_sale_price_cents over the property's SUBORDINATED transactions"
          - "SaleTransaction.rolled_attributions += 1 when the subordination is rolled into a market index"

      - from: PENDING
        to: LAPSED
        trigger: "system (automatic during run_research_cycle when the logical clock has reached subordination_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "SaleTransaction.subordination_status = LAPSED"
          - "Property.verified_sale_value_cents recomputed"

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /data-research/listings/{listingId}/publication"
        actor: BrokerPublisher
        preconditions:
          - "Listing.status == DRAFT (ERR_INVALID_STATE otherwise)"
          - "Listing.organization_id equals the acting user's Organization (ERR_UNAUTHORIZED otherwise)"
          - "Property.land_posture == OPEN (ERR_PROPERTY_RESTRICTED / ERR_PROPERTY_FROZEN otherwise)"
          - "the origin market is inside the publishing organization's licensed markets (ERR_UNAUTHORIZED_REDISTRIBUTION otherwise)"
          - "no other PUBLISHED Listing of this Property has an availability interval overlapping [published_at, expires_at) (ERR_LISTING_OVERLAP otherwise)"
          - "monthly_rent_psf <= 500.00 for an OFFICE or INDUSTRIAL property (ERR_UNAUTHORIZED_REDISTRIBUTION otherwise; absolute guardrail, never relaxable by role)"
        side_effects:
          - "Listing.status = PUBLISHED; published_at = <logical clock>"
          - "expires_at = published_at + duration_days days"
          - "reconciles the Property's asking_rent_psf and available_sqft attributes from the listing as research input"

      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /data-research/listings/{listingId}/withdrawals"
        actor: BrokerPublisher
        preconditions:
          - "Listing.status == PUBLISHED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Listing.status = WITHDRAWN"
          - "the property's availability interval is released for a subsequent publication"

      - from: PUBLISHED
        to: EXPIRED
        trigger: "system (automatic during run_research_cycle when the logical clock has reached expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Listing.status = EXPIRED"

  - entity: EnforcementCase
    initial_state: OPEN
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /data-research/enforcement-cases/{caseId}/escalations"
        actor: EnforcementOfficer
        preconditions:
          - "EnforcementCase.case_type == AUDIT (ERR_LITIGATION_NOT_ESCALATABLE otherwise)"
          - "EnforcementCase.status == OPEN (ERR_INVALID_STATE otherwise)"
          - "EnforcementCase.penalty_cents >= LITIGATION_PENALTY_THRESHOLD_CENTS (ERR_PENALTY_BELOW_LITIGATION_FLOOR otherwise)"
          - "the underlying contract's audit_intensity == ENHANCED (ERR_LITIGATION_NOT_PERMITTED otherwise)"
        side_effects:
          - "EnforcementCase.status = ESCALATED; escalated_at = <logical clock>"
          - "creates a LITIGATION EnforcementCase with escalated_from_case_id = this case, status ESCALATED"
          - "the respondent Organization cascades to SUSPENDED (see state_machines.Organization)"

      - from: ESCALATED
        to: SETTLED
        trigger: "POST /data-research/enforcement-cases/{caseId}/settlements"
        actor: EnforcementOfficer
        preconditions:
          - "EnforcementCase.status == ESCALATED (ERR_INVALID_STATE otherwise)"
          - "settlement_cents >= EnforcementCase.penalty_cents (ERR_SETTLEMENT_INSUFFICIENT otherwise)"
        side_effects:
          - "EnforcementCase.status = SETTLED"
          - "the respondent Organization cascades back to ACTIVE (see state_machines.Organization)"
          - "every LicensingContract of that organization which this escalation terminated is restored to ACTIVE and its seats' access_revoked reset to false, then Organization.authorized_market_count is recomputed"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /data-research/enforcement-cases/{caseId}/withdrawals"
        actor: EnforcementOfficer
        preconditions:
          - "EnforcementCase.status == OPEN (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "EnforcementCase.status = WITHDRAWN"

  - entity: User
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /data-research/users/{userId}/deactivation"
        actor: LicensingAdmin
        preconditions:
          - "User.status == ACTIVE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "User.status = INACTIVE"
          - "the User remains readable and is still named on historical records; deactivation is archival, not deletion"
          - "Any LicenseSeat whose occupant_user_id equals this user keeps its occupant but may not be re-assigned to this user"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: attribute-proposal-stale-property
    parent_entity: Property
    write_endpoint: "POST /data-research/properties/{propertyId}/attributes/{attributeId}/proposals"
    occ_field: "expected_property_version"
    description: |
      Submitting an attribute proposal against a Property whose version has advanced
      since the client last observed it is rejected: the client's view of the parent's
      land_posture and attribute counts is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contract-renewal-stale-contract
    parent_entity: LicensingContract
    write_endpoint: "POST /data-research/licensing-contracts/{contractId}/renewals"
    occ_field: "expected_contract_version"
    description: |
      Recording a renewal against a LicensingContract whose version has advanced since
      the client last observed it is rejected. This captures the case where a market
      addition has just changed the contract's licensed_markets and annual_fee_cents,
      so the client's view of the contract is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: seat-assignment-stale-contract
    parent_entity: LicensingContract
    write_endpoint: "POST /data-research/licensing-contracts/{contractId}/seats/{seatId}/assignment"
    occ_field: "expected_contract_version"
    description: |
      Assigning a seat occupant against a LicensingContract whose version has advanced
      since the client last observed it is rejected, because another writer has changed
      the contract's seat composition since the client's view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: weighted_completeness_score
    trigger: "any PropertyAttribute or SourceDocument mutation on a Property; also recomputed during finalize and run_research_cycle"
    algorithm: weighted_scoring
    formula: |
      num = 0
      for a in attributes(property):                       # subject = Property
        if a.proposed_status == VERIFIED and exists sd in source_documents(property)
             with sd.id == a.source_document_id
             and (clock - sd.obtained_at) <= SOURCE_FRESHNESS_DAYS:
          num += WEIGHT_VERIFIED_SOURCED
        elif a.proposed_status == VERIFIED:
          num += WEIGHT_VERIFIED_UNSOURCED
        else:
          num += WEIGHT_UNVERIFIED                         # proposed_status IN {NONE, PENDING, REJECTED}
      den = count(a in attributes(property) whose proposed_status IN {NONE, PENDING, VERIFIED})
      if den == 0: return 0.0
      base = 100.0 * num / den
      stale_penalty = WEIGHT_STALE_PENALTY * count(sd in source_documents(property)
                        with (clock - sd.obtained_at) > SOURCE_FRESHNESS_DAYS)
      return max(0.0, round_half_up(base - stale_penalty, 2))
    input_set: "Subject = Property. numerator and denominator both walk the same attribute set defined as proposed_status IN {NONE, PENDING, VERIFIED}; REJECTED attributes are excluded from BOTH. Staleness is evaluated as a strict '>' against the logical clock at evaluation time (a source obtained exactly SOURCE_FRESHNESS_DAYS ago is FRESH)."
    constants:
      WEIGHT_VERIFIED_SOURCED: 1.0
      WEIGHT_VERIFIED_UNSOURCED: 0.6
      WEIGHT_UNVERIFIED: 0.0
      WEIGHT_STALE_PENALTY: 0.1
      SOURCE_FRESHNESS_DAYS: 180
    precision: "2 decimal places, round_half_up; the clamp at 0.0 is applied after rounding"
    variants:
      - name: provisional
        when: "computed on every child mutation (proposal submitted, verification, rejection, source attached) and on research/start"
        difference: "numerates only attributes whose proposed_status == VERIFIED, scoring a VERIFIED attribute whose source is missing or older than SOURCE_FRESHNESS_DAYS at WEIGHT_VERIFIED_UNSOURCED (0.6); REJECTED attributes are excluded. For the canonical two-attribute fixture (att1 VERIFIED against a fresh DEED source, att2 VERIFIED against a 243-day-old source, no other sources) the score is 79.90."
      - name: final
        when: "computed by POST /properties/{propertyId}/finalize on the transition RESEARCHING -> VERIFIED"
        difference: "scores a VERIFIED attribute whose source is missing or stale at 0.0 — once the record is published an unevidenced claim is worthless; REJECTED stays excluded from numerator and denominator. For the same rows the score is 49.90, a -30.00 point divergence from the provisional value on identical rows."

  - name: seat_overage_fee
    trigger: "run_research_cycle (per LicenseSeat with monthly_active_days > INCLUDED_ACTIVE_DAYS, and re-derivation on any usage event)"
    algorithm: tiered_pricing
    formula: |
      over_days = max(0, seat.monthly_active_days - INCLUDED_ACTIVE_DAYS)
      if over_days == 0: return 0
      if seat.index_tier == TIER_1:   rate = TIER_1_DAILY_RATE_CENTS
      elif seat.index_tier == TIER_2: rate = TIER_2_DAILY_RATE_CENTS
      else:                           rate = TIER_3_DAILY_RATE_CENTS
      overage = over_days * rate
      violations = len(seat.monthly_unauthorized_markets)
      if violations == 0:   cap_bps = LICENSED_MARKET_USAGE_LIMIT_BPS
      elif violations == 1: cap_bps = 2 * LICENSED_MARKET_USAGE_LIMIT_BPS
      else:                 cap_bps = 3 * LICENSED_MARKET_USAGE_LIMIT_BPS
      cap = (contract.annual_fee_cents * cap_bps) // 10000
      return min(overage, cap)          # cap is INCLUSIVE: overage == cap is accepted at cap
    input_set: "Subject = LicenseSeat joined to its LicensingContract. monthly_active_days counts DISTINCT calendar days (UTC) in the cycle on which the seat recorded at least one UsageEvent; multiple events on one day count once. monthly_unauthorized_markets is the deduplicated set of markets observed for the seat that are absent from contract.licensed_markets."
    constants:
      INCLUDED_ACTIVE_DAYS: 2
      TIER_1_DAILY_RATE_CENTS: 1250
      TIER_2_DAILY_RATE_CENTS: 900
      TIER_3_DAILY_RATE_CENTS: 600
      LICENSED_MARKET_USAGE_LIMIT_BPS: 250
    precision: "integer cents; the cap uses integer floor division so the seat fee never exceeds the cap by a rounding unit"
    variants:
      - name: cycle_cap_three_violations
        when: "seat.monthly_unauthorized_markets has 3 or more members"
        difference: "cap_bps becomes 750 (3 x 250) rather than 250, so the same overage produces a fee up to three times larger before the cap binds; tier rates are unchanged."
      - name: no_violation_cycle
        when: "seat.monthly_unauthorized_markets is empty"
        difference: "cap_bps is 250 and the cap binds early; a TIER_1 seat with 5 active days is capped at 2.50% of the annual contract fee (2,500 cents on a 100,000-cent contract) instead of the uncapped 3,750 cents."

  - name: seat_owner_attribution
    trigger: "usage monitoring: on every UsageEvent recorded for a LicenseSeat, and re-derived during run_research_cycle"
    algorithm: weighted_scoring
    formula: |
      # VARIANT SELECTS THE WINDOW. Weekly-snapshot window = [cycle_start, cycle_start+7d).
      # Monthly-cycle window = [cycle_start, cycle_start+30d).
      # Pinned evaluation order (do NOT reorder):
      #   step 1  build the window's event set
      #   step 2  derive per-IP active calendar-day sets (a day counts for an IP when that
      #           IP produced at least one event on that day)
      #   step 3  party_days = count of calendar days in the window on which >= 2 distinct
      #           IPs produced at least one event
      #   step 4  p = party_days / number_of_calendar_days_in_window (7 or 30 by variant)
      #   step 5  busiest_ip = the IP maximizing len(ip_active_days[ip]);
      #           tie-break: the lexicographically smallest ip string
      #   step 6  owner_user_id = the user_id of the earliest event on busiest_ip by
      #           occurred_at; tie-break: earliest created_at; tie-break: lexicographically
      #           smallest distinguishing_ip. NEVER id.
      #   step 7  owner_share = p * count(events by owner_user_id) / count(all window events)
      #   step 8  owner_share_pct = round_half_up(100 * owner_share, 2)
      return { owner_user_id, owner_share_pct }
    input_set: "Subject = LicenseSeat. Events are selected by seat_id AND occurred_at within the variant's window (lower bound inclusive, upper bound exclusive). Calendar days are UTC dates. When the window contains no events, owner_user_id is null and owner_share_pct is 0."
    constants: {}
    precision: "percentage reported to 2 decimal places, round_half_up applied ONCE at the end; all intermediate day counts, IP sets and the share fraction are exact"
    variants:
      - name: weekly_snapshot
        when: "the base variant, used for the interim sharing signal on each usage event"
        difference: "window is the 7-day window starting at the seat's last_usage_cycle; number_of_calendar_days_in_window is 7 and the event set is small, so p and owner_share_pct are computed over 7 days."
      - name: monthly_cycle
        when: "the final variant, used by run_research_cycle for the cycle's billed attribution"
        difference: "window is the 30-day window starting at the seat's last_usage_cycle; the same fixture yields a different p and a different event count, so owner_share_pct diverges from the weekly value on identical rows."

  - name: market_index_value
    trigger: "POST /data-research/analytics/index-runs for a market, and re-derivation during run_research_cycle"
    algorithm: aggregation
    formula: |
      comps = [c for c in LeaseComparables with c.property.market == M
                 and c.lease_start <= window_end and c.lease_end > window_start]
      # refinements drop comps when: (a) c.property.research_status != VERIFIED,
      #   (b) c.property_id is in the request's excluded_property_ids,
      #   (c) the comp's property is currently FROZEN or RESTRICTED.
      refined = apply_refinements(comps)
      # Each qualifying comp contributes EXACTLY ONCE, regardless of how many attributes
      #   its property carries. When two or more comps tie on effective_rent_psf, none is
      #   dropped and none wins: all tied comps enter the mean, and the reported comp_count
      #   counts them all (order is irrelevant to the arithmetic mean). id is never used.
      if refined is empty: return { index_value: null, comp_count: 0 }   # ERR_EMPTY_INDEX_SET from the endpoint
      idx = sum(c.effective_rent_psf for c in refined) / len(refined)
      return { index_value: round_half_up(idx, 2), comp_count: len(refined),
               mean_effective_rent_psf: round_half_up(idx, 2),
               median_effective_rent_psf: ... }
    input_set: "Subject = LeaseComparable. Inclusion requires property.market == M, the half-open interval test lease_start <= window_end AND lease_end > window_start (a comp whose lease_end equals window_start is EXCLUDED; one whose lease_start equals window_end is INCLUDED), research_status == VERIFIED, not in excluded_property_ids, and land_posture not IN {FROZEN, RESTRICTED}."
    constants: {}
    precision: "index value and per-comp rents to 2 decimal places, round_half_up; comp_count is an exact integer"
    variants:
      - name: hedonic_adjusted
        when: "the request sets adjustment_mode = HEDONIC"
        difference: "value recomputed with per-comp log-linear adjustments for property class (A/B/C) and bundle co-location before the weighted mean; identical inputs give a different index value than unadjusted."
      - name: unadjusted
        when: "the request sets adjustment_mode = UNADJUSTED (default)"
        difference: "value is the raw occurrence-weighted mean of effective_rent_psf; the hedge-adjusted variant diverges on the same comp set whenever any comp's class differs from the market modal class."

  - name: market_forecast
    trigger: "POST /data-research/analytics/forecasts for a market"
    algorithm: forward_looking
    formula: |
      growth = (1 + base_growth_rate) ^ horizon_quarters
      if growth < MIN_GROWTH_FACTOR: growth = MIN_GROWTH_FACTOR      # floor
      if growth > MAX_GROWTH_FACTOR: growth = MAX_GROWTH_FACTOR      # ceiling
      forecast_value = round_half_up(base_index_value * growth, 2)
      # base_index_value is selected by the named variant's selector:
      #   latest_actual    -> the market_index_value of the most recent AnalyticsRun for M
      #   oldest_actual    -> the market_index_value of the earliest AnalyticsRun for M
      #   upper_bound_actual -> the market_index_value of the AnalyticsRun with the GREATEST
      #                         index_value for M; ties are reported as AMBIGUOUS_SELECTION,
      #                         because a tie has no created_at-ordered winner until the
      #                         deployment's field resolver is configured (id is never used)
      return forecast_value
    input_set: "Subject = the named prior AnalyticsRun for market M. Only runs whose runs.applies_to_market == M are candidates; runs published after the request due_date are excluded."
    constants:
      base_growth_rate: 0.015
      MIN_GROWTH_FACTOR: 0.90
      MAX_GROWTH_FACTOR: 1.35
      horizon_quarters: 4
    precision: "2 decimal places, round_half_up applied once to the final product"
    variants:
      - name: latest_actual
        when: "selector = LATEST"
        difference: "base is the most recent run's index value; a market whose index fell over two runs forecasts lower than the same inputs selected by oldest."
      - name: oldest_actual
        when: "selector = EARLIEST"
        difference: "base is the earliest run's index value, so an identical market with a rising series yields a strictly higher forecast than the latest_actual variant."

  - name: cap_rate_bps
    trigger: "POST /data-research/properties/{propertyId}/sale-transactions and POST /data-research/sale-transactions/{transactionId}/subordinations"
    algorithm: threshold
    formula: |
      # in_place_income_annual_cents defaults to a SUBSTITUTE when the property carries no
      #   verified attribute named "in_place_income_annual_cents".
      income = property.verified_in_place_income_annual_cents
      if income > SUBSTITUTE_INCOME_CENTS: source = VERIFIED
      else: income = SUBSTITUTE_INCOME_CENTS; source = SUBSTITUTE
      cap_rate_bps = round_half_up(10000.0 * income / gross_sale_price_cents, 0)
      return { cap_rate_bps: int(cap_rate_bps), income_source: source }
    input_set: "Subject = SaleTransaction joined to its Property. verified_in_place_income_annual_cents is the value of the PropertyAttribute named in_place_income_annual_cents when its proposed_status == VERIFIED, else 0."
    constants:
      SUBSTITUTE_INCOME_CENTS: 250000000
    precision: "integer basis points, round_half_up; the SUBSTITUTE branch is selected by a strict '>' so income exactly equal to the substitute uses the substitute and mirrors the threshold boundary"
    variants:
      - name: verified_income
        when: "property.verified_in_place_income_annual_cents > 2500000"
        difference: "cap rate uses the researched figure, e.g. 300,000,100 cents against a 5,000,000,000-cent price gives 600 bps."
      - name: substitute_income
        when: "the property has no verified in_place_income_annual_cents attribute or its value <= 2500000"
        difference: "cap rate falls back to 250,000,000 cents, giving 500 bps against the same 5,000,000,000-cent price — the two variants disagree on identical transaction rows."

  - name: property_stale_source_count
    trigger: "any SourceDocument creation; run_research_cycle"
    algorithm: aggregation
    formula: |
      stale = count(sd in source_documents(property) with (clock - sd.obtained_at) > SOURCE_FRESHNESS_DAYS days)
      return stale
    input_set: "Subject = Property. A source obtained exactly SOURCE_FRESHNESS_DAYS before the logical clock is FRESH; only strictly-older sources are counted."
    constants:
      SOURCE_FRESHNESS_DAYS: 180
    precision: "exact integer count"

  - name: renewal_lapse_scan
    trigger: "run_research_cycle"
    algorithm: chronological
    formula: |
      for c in contracts order by (renewal_due_at ASC, created_at ASC):
        if c.status == ACTIVE and c.auto_renew == true and clock >= c.renewal_due_at and c.renewal_decision == NONE:
          c.status = GRACE
        if c.status == GRACE and clock >= c.term_end:
          c.status = LAPSED; c.renewal_decision = FAILED
          for s in seats(c): s.access_revoked = true
      # ORDER IS LOAD-BEARING: a contract that is past both renewal_due_at and
      # past term_end is driven GRACE -> LAPSED within the same scan, so the two-order
      # (due-ascending vs created_at-ascending) sweeps produce different intermediate states
      # and different Organization.active_contract_count values.
    input_set: "Subject = LicensingContract with status IN {ACTIVE, GRACE}. Processing order is renewal_due_at ascending with created_at ascending as the tie-break; id is never used."
    constants: {}
    precision: "not numeric; both boundary comparisons are non-strict (clock >= renewal_due_at, clock >= term_end)"

  - name: market_addition_fee
    trigger: "POST /data-research/licensing-contracts/{contractId}/markets"
    algorithm: tiered_pricing
    formula: |
      base = round_half_up(contract.annual_fee_cents * MARKET_ADD_BASE_PCT, 0)
      if product == GLOBAL_ALL:      product_factor = 0.50
      elif product == ANALYTICS_INDEX: product_factor = 1.00
      elif product == LISTING_SERVICE: product_factor = 0.75
      else:                          product_factor = 1.25     # CORE_MARKET_DATA
      gross = round_half_up(base * product_factor, 0)
      if service_tier == ENTERPRISE:   tier_factor = 0.80
      elif service_tier == MID_MARKET: tier_factor = 1.00
      else:                            tier_factor = 1.15      # SMB
      addition_fee_cents = round_half_up(gross * tier_factor, 0)
      # PINNED EVALUATION ORDER: base -> product_factor -> gross -> tier_factor -> final.
      # Rounding is applied at each stage (per-stage then sum), NOT once at the end; the
      # two orders differ by whole cents on some annual fees.
    input_set: "Subject = LicensingContract joined to its subscriber Organization. scale is contract.annual_fee_cents; tier is Organization.service_tier."
    constants:
      MARKET_ADD_BASE_PCT: 0.08
    precision: "integer cents; stage-wise round_half_up is mandated by the pinned evaluation order"
    variants:
      - name: enterprise_discount
        when: "Organization.service_tier == ENTERPRISE"
        difference: "tier_factor 0.80 applies after the product factor, so adding a market to an ENTERPRISE CORE_MARKET_DATA contract costs 80% of the gross addition."

  - name: enforcement_penalty
    trigger: "POST /data-research/enforcement-cases and POST /data-research/enforcement-cases/{caseId}/escalations"
    algorithm: threshold
    formula: |
      raw = finding_cents * fee_rate_pct
      penalty_cents = int(round_half_up(raw, 0))
      if penalty_cents >= LITIGATION_PENALTY_THRESHOLD_CENTS: escalatable = true
      else: escalatable = false      # strict >=; equality IS escalatable
      return { penalty_cents: penalty_cents, escalatable: escalatable }
    input_set: "Subject = EnforcementCase. fee_rate_pct is a percentage multiplier (1.5 means 150%)."
    constants:
      LITIGATION_PENALTY_THRESHOLD_CENTS: 75000000
    precision: "integer cents, round_half_up; escalatability uses a non-strict boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and both non-empty; every required input field is present and satisfies its declared type and enum constraints"
    error_id: "ERR_UNAUTHENTICATED / ERR_INVALID_REQUEST"
    http_status: "401 / 400"
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the X-User-Role is permitted for the operation per §1.7, and the X-User-ID resolves to an ACTIVE User when the role is entity_backed"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource id in the path exists, resolved left to right; the first missing id produces its entity-specific not-found error"
    error_id: "ERR_ORGANIZATION_NOT_FOUND / ERR_USER_NOT_FOUND / ERR_PROPERTY_NOT_FOUND / ERR_ATTRIBUTE_NOT_FOUND / ERR_SOURCE_DOCUMENT_NOT_FOUND / ERR_TRANSACTION_NOT_FOUND / ERR_LISTING_NOT_FOUND / ERR_CONTRACT_NOT_FOUND / ERR_SEAT_NOT_FOUND / ERR_ENFORCEMENT_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_safety
    check: "redistribution and third-party licensing compliance: a SourceDocument whose source_classification == THIRD_PARTY_LICENSED may not be used for an attribute or listing whose market is outside the acting organization's licensed markets; a PropertyAttribute with from_third_party == true requires third_party_approved == true; a LicenseSeat.market must appear in its contract's licensed_markets"
    error_id: "ERR_UNAUTHORIZED_REDISTRIBUTION / ERR_THIRD_PARTY_UNLICENSED / ERR_SEAT_MARKET_NOT_LICENSED"
    http_status: 409
    applies_to: "attribute proposals, source document creation, listing publication, seat creation"

  - priority: 5
    category: state
    check: "the target resource is in the state the transition requires, and no terminal-state guard is violated"
    error_id: "ERR_INVALID_STATE / ERR_RENEWAL_LAPSED / ERR_RENEWAL_TERMINATED / ERR_TERMINATION_WINDOW_CLOSED / ERR_LITIGATION_NOT_ESCALATABLE / ERR_SUBSCRIPTION_INACTIVE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "cross-entity referential integrity: a subdivision may only originate from a root Property whose research_status == DRAFT; a PropertyAttribute.attribute_market must equal its Property.market; the lease window must be self-consistent (lease_end strictly after lease_start); a SaleTransaction may only be recorded on a Property whose research_status IN {RESEARCHING, VERIFIED}"
    error_id: "ERR_SUBDIVISION_PARENT_INVALID / ERR_ATTRIBUTE_MARKET_MISMATCH / ERR_LEASE_WINDOW_INVALID / ERR_SALE_PROPERTY_NOT_RESEARCHED"
    http_status: 422
    applies_to: "subdivision, attribute proposals, lease comparables, sale transactions"

  - priority: 7
    category: business_constraint
    check: "uniqueness and occupancy constraints: field_name is unique per Property; the seat count on a contract may not exceed seat_count; the subscription's market occupy-limit may not exceed the GLOBAL_ALL_ROLLUP_BPS share of the aggregate licensed sqft; a published listing's availability interval may not collide with another PUBLISHED listing of the same property"
    error_id: "ERR_ATTRIBUTE_DUPLICATE_FIELD / ERR_SEAT_CAPACITY_EXCEEDED / ERR_SUBSCRIPTION_REACH_EXCEEDED / ERR_LISTING_OVERLAP"
    http_status: 409
    applies_to: "attribute creation, seat creation, listing publication"

  - priority: 8
    category: business_temporal
    check: "logical-clock and recency constraints: SourceDocument.obtained_at may not be in the future relative to the logical clock; a SaleTransaction.subordination_deadline check; a comp whose lease_end precedes its recorded_at is rejected"
    error_id: "ERR_SOURCE_FUTURE_DATED / ERR_SUBORDINATION_DEADLINE_PASSED / ERR_COMP_TEMPORAL_IMPOSSIBLE"
    http_status: 409
    applies_to: "source documents, sale subordinations, lease comparables"

  - priority: 9
    category: business_fiscal
    check: "monetary and capacity floors, evaluated last: annual_fee_cents must be > 0; gross_sale_price_cents must be > 0; a settlement must be >= penalty_cents; a litigation escalation requires penalty_cents >= LITIGATION_PENALTY_THRESHOLD_CENTS"
    error_id: "ERR_FEE_NOT_POSITIVE / ERR_SALE_PRICE_NOT_POSITIVE / ERR_SETTLEMENT_INSUFFICIENT / ERR_PENALTY_BELOW_LITIGATION_FLOOR"
    http_status: 409
    applies_to: "contracts, sale transactions, settlements, escalations"

  - priority: 10
    category: business_fiscal
    check: "optimistic-concurrency precondition: the request's expected_<parent>_version must equal the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT and every action endpoint that declares an expected_<parent>_version input"
    description: "Ordered LAST among the ten rows. A request that both violates a higher-priority row and carries a stale expected_<parent>_version reports the higher-priority error, so ERR_STALE_VERSION is observed only when every earlier check passes."

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock = current_utc"]

  # --- Organization & User ---
  - method: POST
    path: "/data-research/organizations"
    description: "Create an Organization"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, org_type, home_market, "service_tier?"]
    output: Organization
    side_effects: ["status=ACTIVE", "authorized_market_count=0, active_contract_count=0"]

  - method: GET
    path: "/data-research/organizations/{organizationId}"
    description: "Get an Organization"
    roles: [PlatformAdmin, LicensingAdmin, EnforcementOfficer]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: GET
    path: "/data-research/organizations/{organizationId}/users"
    description: "List the Users belonging to an Organization"
    roles: [PlatformAdmin, LicensingAdmin]
    code: 200
    input: []
    output: User[]
    side_effects: []

  - method: POST
    path: "/data-research/organizations/{organizationId}/users"
    description: "Create a User within an Organization"
    roles: [PlatformAdmin, LicensingAdmin]
    code: 201
    input: [email, full_name, role, "assigned_market?"]
    output: User
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/data-research/users/{userId}"
    description: "Get a User"
    roles: [PlatformAdmin, LicensingAdmin, EnforcementOfficer, ResearchAnalyst]
    code: 200
    input: []
    output: User
    side_effects: []

  # --- Property ---
  - method: POST
    path: "/data-research/properties"
    description: "Create a Property research record"
    roles: [ResearchAnalyst, PlatformAdmin]
    code: 201
    input: [market, address_line, property_type, rentable_sqft, "classification?"]
    output: Property
    side_effects: ["research_status=DRAFT", "land_posture=OPEN", "completeness_pct=0.0", "attribute_verified_count=0, attribute_total_count=0, stale_source_count=0"]

  - method: GET
    path: "/data-research/properties/{propertyId}"
    description: "Get a Property"
    roles: [ResearchAnalyst, SeatUser, LicensingAdmin, EnforcementOfficer]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/data-research/properties"
    description: "List Properties with market filtering and pagination"
    roles: [ResearchAnalyst, SeatUser, LicensingAdmin]
    code: 200
    input: ["market?", "research_status?", "parent_property_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: POST
    path: "/data-research/properties/{propertyId}/research/start"
    description: "Move a Property from DRAFT to RESEARCHING"
    roles: [ResearchAnalyst]
    code: 200
    input: []
    output: Property
    side_effects: ["research_status=RESEARCHING", "completeness_pct recomputed (provisional)"]

  - method: POST
    path: "/data-research/properties/{propertyId}/finalize"
    description: "Move a Property from RESEARCHING to VERIFIED"
    roles: [ResearchAnalyst]
    code: 200
    input: []
    output: Property
    side_effects: ["research_status=VERIFIED", "completeness_pct recomputed (final)"]

  - method: POST
    path: "/data-research/properties/{propertyId}/subdivision"
    description: "Split a DRAFT root Property into a child Property research record"
    roles: [ResearchAnalyst]
    code: 201
    input: [market, address_line, property_type, rentable_sqft, "classification?"]
    output: Property
    side_effects: ["creates a child Property with parent_property_id = source id, research_status=DRAFT, land_posture=OPEN"]

  - method: GET
    path: "/data-research/properties/{propertyId}/subdivisions"
    description: "List the child Properties subdivided from a Property"
    roles: [ResearchAnalyst, PlatformAdmin, LicensingAdmin]
    code: 200
    input: []
    output: Property[]
    side_effects: []

  # --- SourceDocument ---
  - method: POST
    path: "/data-research/properties/{propertyId}/source-documents"
    description: "Attach a source-document evidence row to a Property"
    roles: [ResearchAnalyst]
    code: 201
    input: [source_type, source_name, contact_method, obtained_at, "distributed_markets?"]
    output: SourceDocument
    side_effects: ["source_classification computed", "Property.stale_source_count and completeness_pct recomputed"]

  - method: GET
    path: "/data-research/properties/{propertyId}/source-documents"
    description: "List the SourceDocuments attached to a Property"
    roles: [ResearchAnalyst, EnforcementOfficer, LicensingAdmin]
    code: 200
    input: []
    output: SourceDocument[]
    side_effects: []

  # --- PropertyAttribute ---
  - method: POST
    path: "/data-research/properties/{propertyId}/attributes"
    description: "Create a PropertyAttribute claim scoped to a Property"
    roles: [ResearchAnalyst]
    code: 201
    input: [source_document_id, field_name, value, attribute_market, "from_third_party?", "third_party_approved?"]
    output: PropertyAttribute
    side_effects: ["proposed_status=NONE", "revision_index=1", "Property.research_status -> RESEARCHING when it was DRAFT", "Property.attribute_total_count increments"]

  - method: GET
    path: "/data-research/attributes/{attributeId}"
    description: "Get a PropertyAttribute"
    roles: [ResearchAnalyst, SeatUser, LicensingAdmin, EnforcementOfficer]
    code: 200
    input: []
    output: PropertyAttribute
    side_effects: []

  - method: GET
    path: "/data-research/attributes"
    description: "List PropertyAttributes filtered by property, creating analyst or verifier"
    roles: [ResearchAnalyst, SeatUser, LicensingAdmin, EnforcementOfficer]
    code: 200
    input: ["property_id?", "source_document_id?", "created_by_user_id?", "verifier_user_id?", "proposed_status?", "limit?", "offset?"]
    output: PropertyAttribute[]
    side_effects: []

  - method: POST
    path: "/data-research/properties/{propertyId}/attributes/{attributeId}/proposals"
    description: "Propose a new value for a PropertyAttribute, moving it to PENDING"
    roles: [ResearchAnalyst]
    code: 200
    input: [value, expected_property_version]
    output: PropertyAttribute
    side_effects: ["proposed_status=PENDING", "proposed_value set", "Property.attribute_verified_count and completeness_pct recomputed (provisional)", "Property.version += 1"]

  - method: POST
    path: "/data-research/attributes/{attributeId}/verifications"
    description: "Verify a PENDING PropertyAttribute"
    roles: [ResearchAnalyst]
    code: 200
    input: []
    output: PropertyAttribute
    side_effects: ["value=proposed_value, proposed_value=null, proposed_status=VERIFIED", "revision_index += 1", "last_verified_at = logical clock", "verifier_user_id = acting user"]

  - method: POST
    path: "/data-research/attributes/{attributeId}/rejections"
    description: "Reject a PENDING PropertyAttribute"
    roles: [ResearchAnalyst]
    code: 200
    input: ["reason?"]
    output: PropertyAttribute
    side_effects: ["proposed_status=NONE", "proposed_value=null", "Property.completeness_pct recomputed (provisional)"]

  # --- LeaseComparable & SaleTransaction ---
  - method: POST
    path: "/data-research/properties/{propertyId}/lease-comparables"
    description: "Record a lease comparable against a Property"
    roles: [ResearchAnalyst]
    code: 201
    input: [tenant_name, lease_start, lease_end, escalated_rent_psf, effective_rent_psf, "renewal_option?"]
    output: LeaseComparable
    side_effects: ["recorded_at = logical clock"]

  - method: GET
    path: "/data-research/lease-comparables"
    description: "List LeaseComparables filtered by property or market"
    roles: [ResearchAnalyst, SeatUser, LicensingAdmin]
    code: 200
    input: ["property_id?", "market?", "limit?", "offset?"]
    output: LeaseComparable[]
    side_effects: []

  - method: POST
    path: "/data-research/properties/{propertyId}/sale-transactions"
    description: "Record a sale transaction against a Property"
    roles: [ResearchAnalyst]
    code: 201
    input: [buyer_name, close_date, gross_sale_price_cents]
    output: SaleTransaction
    side_effects: ["subordination_deadline = close_date + 10 days", "subordination_status=PENDING", "cap_rate_bps computed"]

  - method: GET
    path: "/data-research/sale-transactions"
    description: "List SaleTransactions filtered by property, subordination status or subordinating case"
    roles: [ResearchAnalyst, LicensingAdmin, EnforcementOfficer]
    code: 200
    input: ["property_id?", "subordinating_case_id?", "subordination_status?", "limit?", "offset?"]
    output: SaleTransaction[]
    side_effects: []

  - method: POST
    path: "/data-research/sale-transactions/{transactionId}/subordinations"
    description: "Record a licensed-market subordination against a SaleTransaction"
    roles: [EnforcementOfficer, LicensingAdmin]
    code: 200
    input: [subordinating_case_id, expected_transaction_version]
    output: SaleTransaction
    side_effects: ["subordination_status=SUBORDINATED", "subordinated_at = logical clock", "Property.verified_sale_value_cents recomputed", "SaleTransaction.version += 1"]

  # --- LicensingContract & LicenseSeat ---
  - method: POST
    path: "/data-research/licensing-contracts"
    description: "Create a subscription licensing contract for a subscriber Organization"
    roles: [LicensingAdmin, PlatformAdmin]
    code: 201
    input: [subscriber_organization_id, product, licensed_markets, seat_count, annual_fee_cents, "monthly_index_fee_cents?", "auto_renew?", "renewal_notice_days?", term_start, term_end, "audit_intensity?"]
    output: LicensingContract
    side_effects: ["status=PENDING", "renewal_decision=NONE", "renewal_due_at = term_end - renewal_notice_days days", "Organization.authorized_market_count recomputed"]

  - method: GET
    path: "/data-research/licensing-contracts/{contractId}"
    description: "Get a LicensingContract"
    roles: [LicensingAdmin, EnforcementOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LicensingContract
    side_effects: []

  - method: GET
    path: "/data-research/licensing-contracts"
    description: "List LicensingContracts filtered by subscriber organization or status"
    roles: [LicensingAdmin, EnforcementOfficer, PlatformAdmin]
    code: 200
    input: ["subscriber_organization_id?", "status?", "limit?", "offset?"]
    output: LicensingContract[]
    side_effects: []

  - method: GET
    path: "/data-research/licensing-contracts/{contractId}/seats"
    description: "List the LicenseSeats of a contract"
    roles: [LicensingAdmin, EnforcementOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LicenseSeat[]
    side_effects: []

  - method: POST
    path: "/data-research/licensing-contracts/{contractId}/seats"
    description: "Create a LicenseSeat on a contract"
    roles: [LicensingAdmin]
    code: 201
    input: [market, "index_tier?", last_usage_cycle]
    output: LicenseSeat
    side_effects: ["occupant_user_id=null", "monthly_active_days=0", "monthly_unauthorized_markets=[]", "distinctive_ip_count=0", "shared_flag=false, access_revoked=false", "LicensingContract.version += 1"]

  - method: POST
    path: "/data-research/licensing-contracts/{contractId}/activate"
    description: "Activate a PENDING contract"
    roles: [LicensingAdmin]
    code: 200
    input: [expected_contract_version]
    output: LicensingContract
    side_effects: ["status=ACTIVE", "renewal_due_at computed", "Organization.active_contract_count recomputed", "LicensingContract.version += 1"]

  - method: POST
    path: "/data-research/licensing-contracts/{contractId}/markets"
    description: "Add a licensed market to an ACTIVE contract and rebase its fee"
    roles: [LicensingAdmin]
    code: 200
    input: [market, expected_contract_version]
    output: LicensingContract
    side_effects: ["licensed_markets += market", "annual_fee_cents += market_addition_fee", "Organization.authorized_market_count recomputed", "LicensingContract.version += 1"]

  - method: POST
    path: "/data-research/licensing-contracts/{contractId}/renewals"
    description: "Record an auto-renewal into a new term"
    roles: [LicensingAdmin]
    code: 200
    input: [new_term_end, new_annual_fee_cents, expected_contract_version]
    output: LicensingContract
    side_effects: ["status=RENEWED", "term_start = previous term_end", "term_end = new_term_end", "annual_fee_cents = new_annual_fee_cents", "renewal_due_at recomputed", "LicensingContract.version += 1"]

  - method: POST
    path: "/data-research/licensing-contracts/{contractId}/terminations"
    description: "Exercise a termination decision before the renewal deadline"
    roles: [LicensingAdmin]
    code: 200
    input: [expected_contract_version]
    output: LicensingContract
    side_effects: ["status=TERMINATED", "renewal_decision=TERMINATED", "every seat access_revoked=true", "LicensingContract.version += 1"]

  - method: POST
    path: "/data-research/licensing-contracts/{contractId}/seats/{seatId}/assignment"
    description: "Assign an occupant User to a LicenseSeat"
    roles: [LicensingAdmin]
    code: 200
    input: [occupant_user_id, expected_contract_version]
    output: LicenseSeat
    side_effects: ["occupant_user_id set", "access_revoked=false", "LicensingContract.version += 1"]

  - method: POST
    path: "/data-research/licensing-contracts/{contractId}/seats/{seatId}/unassignment"
    description: "Release a LicenseSeat's occupant"
    roles: [LicensingAdmin]
    code: 200
    input: [expected_contract_version]
    output: LicenseSeat
    side_effects: ["occupant_user_id=null", "LicensingContract.version += 1"]

  # --- UsageEvent ---
  - method: POST
    path: "/data-research/seats/{seatId}/usage-events"
    description: "Record a data-access event for a LicenseSeat and refresh monitoring"
    roles: [SeatUser, PlatformAdmin]
    code: 201
    input: [market, event_type, record_count, distinguishing_ip, occurred_at]
    output: UsageEvent
    side_effects: ["UsageEvent appended", "LicenseSeat.monthly_active_days, monthly_unauthorized_markets, distinctive_ip_count recomputed", "LicenseSeat.owner_user_id and owner_share_pct recomputed under the seat_owner_attribution weekly_snapshot variant", "LicenseSeat.overage_fee_cents recomputed", "LicenseSeat.shared_flag set when distinctive_ip_count exceeds the tier threshold"]

  - method: GET
    path: "/data-research/seats/{seatId}/usage-events"
    description: "List the UsageEvents of a seat"
    roles: [LicensingAdmin, EnforcementOfficer, SeatUser, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: UsageEvent[]
    side_effects: []

  - method: GET
    path: "/data-research/usage-events"
    description: "List UsageEvents filtered by seat or presenting user"
    roles: [LicensingAdmin, EnforcementOfficer, PlatformAdmin]
    code: 200
    input: ["seat_id?", "user_id?", "limit?", "offset?"]
    output: UsageEvent[]
    side_effects: []


  # --- EnforcementCase ---
  - method: POST
    path: "/data-research/enforcement-cases"
    description: "Open an enforcement case against an organization's redistribution finding"
    roles: [EnforcementOfficer]
    code: 201
    input: [organization_id, contract_id, case_type, finding_cents, fee_rate_pct]
    output: EnforcementCase
    side_effects: ["status=OPEN", "penalty_cents computed"]

  - method: GET
    path: "/data-research/enforcement-cases"
    description: "List EnforcementCases filtered by organization, contract or status"
    roles: [EnforcementOfficer, LicensingAdmin, PlatformAdmin]
    code: 200
    input: ["organization_id?", "contract_id?", "escalated_from_case_id?", "status?", "limit?", "offset?"]
    output: EnforcementCase[]
    side_effects: []

  - method: GET
    path: "/data-research/enforcement-cases/{caseId}/escalations"
    description: "List the LITIGATION cases escalated from an AUDIT case"
    roles: [EnforcementOfficer, LicensingAdmin]
    code: 200
    input: []
    output: EnforcementCase[]
    side_effects: []

  - method: POST
    path: "/data-research/enforcement-cases/{caseId}/escalations"
    description: "Escalate an AUDIT case to LITIGATION and suspend the organization"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementCase
    side_effects: ["status=ESCALATED", "escalated_at = logical clock", "creates a LITIGATION case with escalated_from_case_id = case id", "Organization.status=SUSPENDED", "every ACTIVE or GRACE contract of the organization -> TERMINATED with all seats access_revoked=true"]

  - method: POST
    path: "/data-research/enforcement-cases/{caseId}/settlements"
    description: "Settle an escalated case and reinstate the organization"
    roles: [EnforcementOfficer]
    code: 200
    input: [settlement_cents]
    output: EnforcementCase
    side_effects: ["status=SETTLED", "Organization.status=ACTIVE", "restores the contracts terminated by the escalation to ACTIVE and recomputes Organization.authorized_market_count"]

  - method: POST
    path: "/data-research/enforcement-cases/{caseId}/withdrawals"
    description: "Withdraw an OPEN enforcement case without escalating it"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementCase
    side_effects: ["status=WITHDRAWN"]

  - method: POST
    path: "/data-research/users/{userId}/deactivation"
    description: "Deactivate a User so they can no longer occupy a license seat"
    roles: [PlatformAdmin, LicensingAdmin]
    code: 200
    input: []
    output: User
    side_effects: ["User.status=INACTIVE"]

  # --- Listing ---
  - method: POST
    path: "/data-research/properties/{propertyId}/listings"
    description: "Publish a broker availability listing against a Property"
    roles: [BrokerPublisher]
    code: 201
    input: [organization_id, listing_type, monthly_rent_psf, available_sqft, duration_days]
    output: Listing
    side_effects: ["status=DRAFT", "published_at = logical clock", "expires_at = published_at + duration_days days; duration_days must be >= 1"]

  - method: GET
    path: "/data-research/listings"
    description: "List Listings filtered by property, organization or status"
    roles: [BrokerPublisher, ResearchAnalyst, SeatUser, LicensingAdmin]
    code: 200
    input: ["property_id?", "organization_id?", "status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/data-research/listings/{listingId}/publication"
    description: "Publish a DRAFT listing as research input"
    roles: [BrokerPublisher]
    code: 200
    input: []
    output: Listing
    side_effects: ["status=PUBLISHED", "reconciles the property's asking_rent_psf and available_sqft attributes"]

  - method: POST
    path: "/data-research/listings/{listingId}/withdrawals"
    description: "Withdraw a PUBLISHED listing"
    roles: [BrokerPublisher]
    code: 200
    input: []
    output: Listing
    side_effects: ["status=WITHDRAWN"]

  # --- Analytics ---
  - method: POST
    path: "/data-research/analytics/index-runs"
    description: "Run the market index calculation for a market and window"
    roles: [ResearchAnalyst, SeatUser]
    code: 201
    input: [market, window_start, window_end, "adjustment_mode?", "excluded_property_ids?"]
    output: AnalyticsRun
    side_effects: ["index_value and comp_count computed by market_index_value"]

  - method: GET
    path: "/data-research/analytics/index-runs"
    description: "List AnalyticsRun index rows for a market"
    roles: [ResearchAnalyst, SeatUser, LicensingAdmin]
    code: 200
    input: ["market?", "limit?", "offset?"]
    output: AnalyticsRun[]
    side_effects: []

  - method: POST
    path: "/data-research/analytics/forecasts"
    description: "Produce a forward-looking market forecast from a prior index run"
    roles: [ResearchAnalyst, SeatUser]
    code: 201
    input: [market, selector, "horizon_quarters?"]
    output: AnalyticsRun
    side_effects: ["forecast_value computed by market_forecast", "forecast_due_at = window_end + horizon_quarters quarters"]

  - method: GET
    path: "/data-research/analytics/forecasts"
    description: "List forecast AnalyticsRuns filtered by market"
    roles: [ResearchAnalyst, SeatUser, LicensingAdmin]
    code: 200
    input: ["market?", "limit?", "offset?"]
    output: AnalyticsRun[]
    side_effects: []

  - method: POST
    path: "/data-research/listings/{listingId}/syndication"
    description: "Syndicate a PUBLISHED listing into an additional market under the listing product"
    roles: [LicensingAdmin, EnforcementOfficer]
    code: 200
    input: [market]
    output: Listing
    side_effects: ["redistributed_markets += market", "the OFFICE/INDUSTRIAL rent-cap guardrail applies regardless of the acting role"]

  - method: POST
    path: "/data-research/analytics/index-runs/{runId}/attribution-removals"
    description: "Remove an index run's records from its market's attributed-record count"
    roles: [LicensingAdmin, EnforcementOfficer]
    code: 200
    input: []
    output: AnalyticsRun
    side_effects: ["attributed_records_delta = 0", "attribution_status = UNWOUND"]

  - method: POST
    path: "/data-research/licensing-contracts/{contractId}/seats/{seatId}/fee-assignments"
    description: "Rebase a LicenseSeat's cycle overage fee from its cycle counters"
    roles: [LicensingAdmin]
    code: 200
    input: [expected_contract_version]
    output: LicenseSeat
    side_effects: ["LicenseSeat.overage_fee_cents = seat_overage_fee output", "LicenseSeat.billed_owner_share_pct recomputed (monthly_cycle)", "LicensingContract.version += 1"]

  # --- Research operations & reports ---
  - method: POST
    path: "/data-research/reports/market-escalations"
    description: "Raise a market-level data escalations report that re-grades affected properties"
    roles: [EnforcementOfficer, ResearchAnalyst]
    code: 200
    input: [markets, reason_code]
    output: "{ escalated_property_ids: string[], escalated_count: integer }"
    side_effects: ["every Property whose market is in markets and research_status IN {DRAFT, RESEARCHING} -> land_posture=RESTRICTED", "every VERIFIED Property in markets -> research_status=RESEARCHING with land_posture=FROZEN and its PENDING attributes reset to NONE"]

  - method: POST
    path: "/data-research/reports/subscription-reach"
    description: "Report a subscription's market occupy-limit share against the GLOBAL_ALL roll-up share"
    roles: [LicensingAdmin]
    code: 200
    input: [contract_id]
    output: "{ occupy_limit_share_bps: integer, rollup_share_bps: integer, reach_ok: boolean }"
    side_effects: ["recomputes the organization's authorized_market_count"]

  - method: POST
    path: "/data-research/run_research_cycle"
    description: "Periodic operations checkpoint: ages sources, scans renewals, recomputes indexes and seat fees"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ stale_source_properties: integer, lapsed_contracts: integer, expired_listings: integer, by_contract: object }"
    side_effects: ["property_stale_source_count recomputed for every property", "completeness_pct and land_posture recomputed for every property whose stale_source_count changed", "renewal_lapse_scan applied to every ACTIVE or GRACE contract", "PUBLISHED listings past expires_at -> EXPIRED", "PENDING sale transactions whose subordination_deadline has been reached -> LAPSED", "each LicenseSeat overage_fee_cents recomputed", "each LicenseSeat billed_owner_share_pct recomputed under the seat_owner_attribution monthly_cycle variant", "market_index_value recomputed for each market with an AnalyticsRun in the cycle", "increments cycle_index"]

  - method: GET
    path: "/data-research/seats/{seatId}"
    description: "Get a LicenseSeat"
    roles: [LicensingAdmin, EnforcementOfficer, SeatUser, PlatformAdmin]
    code: 200
    input: []
    output: LicenseSeat
    side_effects: []

  # --- Additional filtered-list and single-resource reads (FK reverse-reachability) ---
