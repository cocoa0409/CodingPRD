# =============================================================================
# Architectural Glass & Mirror Shop — seed tables (Expert)
# =============================================================================

scenario: |
  Architectural Glass & Mirror Shop: measure & glass type/spec (tempered/insulated),
  shower-enclosure & storefront quote, fabrication & tempering lead time, install
  crew & scheduling, breakage/remake, custom mirror & tabletop, warranty, B2B
  contractor account

domain_name: glass-mirror-shop
api_prefix: "/"

# Structural DNA -------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer resources (contractor accounts, quotes, jobs, furnaces, crews) linked by
  # foreign keys, not nested ownership trees. api_prefix "/" mounts every peer
  # collection at the root.

  state_machine_shape: parallel
  # Job carries two independent status axes (fabrication_status x install_status);
  # Quote is cyclic (SENT<->DRAFT revision loop).

  relationship_patterns:
    - one_to_many        # Quote -> LineItem, Job -> TemperingBatch / InstallAppointment
    - cross_aggregate    # InstallAppointment -> Job (fabrication gating), Quote -> ContractorAccount (credit)

  role_model: peer_roles
  # Estimator owns quoting, Fabricator owns tempering, Scheduler owns install,
  # Contractor acts on own account, ShopAdmin configures & adjudicates.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ContractorAccount
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: company_name, type: string, source: input, description: "B2B contractor company name" }
      - { name: tier, type: enum, source: input, description: "WALK_IN | BRONZE | SILVER | GOLD — drives discount pct" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding credit in cents", constraints: ">= 0" }
      - { name: credit_used_cents, type: integer, source: computed, default: 0, description: "Sum of credit_hold_cents over Jobs with status=ACTIVE for this account" }
      - { name: available_credit_cents, type: integer, source: computed, description: "credit_limit_cents - credit_used_cents" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ON_HOLD | SUSPENDED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: contractor_account_id, type: string, source: input, description: "FK -> ContractorAccount.id" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SENT | ORDERED (terminal)" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "Increments each time a SENT quote is revised back to DRAFT" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of LineItem.line_total_cents; recomputed on send" }
      - { name: discount_cents, type: integer, source: computed, description: "subtotal_cents - total_cents (tier discount, per-line rounded)" }
      - { name: total_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(line_total_cents * (1 - tier_pct)); recomputed on send" }
      - { name: quoted_lead_days, type: integer, source: computed, description: "Provisional lead time computed at send from quote lines only (ignores furnace backlog)" }
      - { name: valid_until, type: datetime, source: computed, description: "created_at + QUOTE_VALID_DAYS (30 days), stamped on send" }
      - { name: ordered_job_id, type: string, source: computed, description: "id of the Job created when this quote was accepted/ordered; null until ORDERED" }

  - name: LineItem
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id" }
      - { name: product_type, type: enum, source: input, description: "SHOWER_ENCLOSURE | STOREFRONT | CUSTOM_MIRROR | TABLETOP" }
      - { name: glass_type, type: enum, source: input, description: "ANNEALED | TEMPERED | LAMINATED | INSULATED" }
      - { name: thickness_mm, type: integer, source: input, description: "Glass thickness; one of 6, 10, 12" }
      - { name: width_in, type: number, source: input, description: "Pane width in inches", constraints: "> 0" }
      - { name: height_in, type: number, source: input, description: "Pane height in inches", constraints: "> 0" }
      - { name: quantity, type: integer, source: input, description: "Number of identical panes", constraints: ">= 1" }
      - { name: edge_work, type: enum, source: input, default: NONE, description: "NONE | POLISHED | BEVELED" }
      - { name: requires_safety_glazing, type: boolean, source: input, default: false, description: "True where building code mandates safety glazing for this pane" }
      - { name: billable_sqft, type: number, source: computed, description: "max(round_half_up(width_in*height_in/144, 2), MIN_BILLABLE_SQFT) — per pane" }
      - { name: unit_price_cents, type: integer, source: computed, description: "round_half_up(billable_sqft*(RATE[glass]*THICKNESS_MULT[mm]+EDGE_RATE[edge])) + PRODUCT_FEE[product]" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: status, type: enum, source: system, default: SPEC, description: "SPEC | FABRICATING | FABRICATED | INSTALLED | BROKEN" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id" }
      - { name: contractor_account_id, type: string, source: system, description: "FK -> ContractorAccount.id" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED | CANCELLED" }
      - { name: fabrication_status, type: enum, source: system, default: PENDING, description: "PENDING | IN_FABRICATION | COMPLETE | REOPENED (independent axis)" }
      - { name: install_status, type: enum, source: system, default: NOT_READY, description: "NOT_READY | READY | SCHEDULED | INSTALLED | ON_HOLD (independent axis)" }
      - { name: job_fab_sqft, type: number, source: computed, description: "Sum of billable_sqft*quantity over all LineItems of the quote" }
      - { name: committed_lead_days, type: integer, source: computed, description: "Committed lead time stamped at accept: FAB_BASE_DAYS + ceil((scheduled_backlog_sqft + job_fab_sqft)/STD_THROUGHPUT_SQFT_PER_DAY) + INSTALL_DAYS" }
      - { name: credit_hold_cents, type: integer, source: computed, description: "Provisional credit reserved: quote.total_cents at accept, plus REMAKE_SURCHARGE_CENTS per billable remake" }
      - { name: final_total_cents, type: integer, source: computed, description: "As-built exposure: sum of discounted line_total for INSTALLED lines + REMAKE_SURCHARGE_CENTS per billable remake" }

  - name: TemperingFurnace
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Furnace / fabrication line label" }
      - { name: max_batch_sqft, type: number, source: input, description: "Maximum total glass area a single batch may load", constraints: "> 0" }
      - { name: cooldown_minutes, type: integer, source: input, default: 60, description: "Mandatory gap required after a batch window before the next batch may start" }
      - { name: reserved_sqft, type: number, source: computed, default: 0, description: "Sum of total_sqft over this furnace's SCHEDULED batches" }

  - name: TemperingBatch
    parent: null
    common_fields: true
    fields:
      - { name: furnace_id, type: string, source: input, description: "FK -> TemperingFurnace.id" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Batch window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Batch window end (ISO 8601 UTC); must be > scheduled_start" }
      - { name: total_sqft, type: number, source: computed, description: "Sum of billable_sqft*quantity over the job's LineItems in FABRICATING status at batch creation" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | DONE | CANCELLED" }

  - name: InstallCrew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Install crew label" }
      - { name: certified_products, type: array, source: input, description: "Product types this crew may install, e.g. [SHOWER_ENCLOSURE, STOREFRONT]" }

  - name: InstallAppointment
    parent: null
    common_fields: true
    fields:
      - { name: crew_id, type: string, source: input, description: "FK -> InstallCrew.id" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: window_start, type: datetime, source: input, description: "Appointment window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Appointment window end (ISO 8601 UTC); must be > window_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: ClaimReport
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id" }
      - { name: claim_type, type: enum, source: input, description: "BREAKAGE (physical breakage) | WARRANTY_DEFECT (post-install defect)" }
      - { name: cause, type: string, source: input, description: "Free-text cause note" }
      - { name: billable_to_contractor, type: boolean, source: input, default: false, description: "True when remake cost is charged to the contractor account (site-fault breakage); false for shop-fault/warranty" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | APPROVED | REJECTED" }
      - { name: remake_order_id, type: string, source: computed, description: "id of the RemakeOrder created on approval; null until APPROVED" }

  - name: RemakeOrder
    parent: null
    common_fields: true
    fields:
      - { name: claim_report_id, type: string, source: system, description: "FK -> ClaimReport.id" }
      - { name: job_id, type: string, source: system, description: "FK -> Job.id" }
      - { name: line_item_id, type: string, source: system, description: "FK -> LineItem.id" }
      - { name: billable_to_contractor, type: boolean, source: system, description: "Copied from the originating ClaimReport" }
      - { name: remake_cost_cents, type: integer, source: computed, description: "LineItem.unit_price_cents + REMAKE_SURCHARGE_CENTS" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | COMPLETE" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- ContractorAccount ---------------------------------------------------
  - entity: ContractorAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /contractor-accounts/{id}/set-status (status=ON_HOLD)"
        actor: ShopAdmin
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /contractor-accounts/{id}/set-status (status=ACTIVE)"
        actor: ShopAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contractor-accounts/{id}/set-status (status=SUSPENDED)"
        actor: ShopAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contractor-accounts/{id}/set-status (status=ACTIVE)"
        actor: ShopAdmin
        preconditions: []
        side_effects: []

  # ---- Quote (cyclic: SENT <-> DRAFT) --------------------------------------
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ORDERED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{id}/send"
        actor: Estimator
        preconditions:
          - "Quote has >= 1 LineItem (else ERR_QUOTE_EMPTY)"
        side_effects:
          - "Recompute subtotal_cents, discount_cents, total_cents via quote_totals"
          - "Compute quoted_lead_days via lead_time_estimation (provisional variant)"
          - "Stamp valid_until = created_at + QUOTE_VALID_DAYS"
      - from: SENT
        to: DRAFT
        trigger: "POST /quotes/{id}/revise"
        actor: Estimator
        preconditions: []
        side_effects:
          - "revision_number increments by 1"
          - "quoted_lead_days / valid_until cleared to null (re-stamped on next send)"
        note: "Revision loop — a SENT quote returns to DRAFT for edits, then send again."
      - from: SENT
        to: ORDERED
        trigger: "POST /quotes/{id}/accept"
        actor: Contractor
        preconditions:
          - "Acting Contractor owns the account: X-User-ID == quote.contractor_account_id (else ERR_FORBIDDEN)"
          - "Quote not expired: current clock <= valid_until (else ERR_QUOTE_EXPIRED)"
          - "ContractorAccount.status == ACTIVE (else ERR_ACCOUNT_NOT_ACTIVE)"
          - "expected_account_version matches ContractorAccount.version (else ERR_STALE_ACCOUNT_VERSION)"
          - "available_credit_cents >= total_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Create Job (fabrication_status=PENDING, install_status=NOT_READY, status=ACTIVE); set ordered_job_id"
          - "Compute Job.committed_lead_days via lead_time_estimation (committed variant, includes furnace backlog)"
          - "Set Job.credit_hold_cents = quote.total_cents"
          - "ContractorAccount.credit_used_cents += Job.credit_hold_cents; ContractorAccount.version += 1"
          - "CASCADE(order): each LineItem SPEC -> FABRICATING (caused by Job creation, not directly by accept)"

  # ---- LineItem (driven by parent Job/Batch cascades) ----------------------
  - entity: LineItem
    initial_state: SPEC
    terminal_states: []
    transitions:
      - from: SPEC
        to: FABRICATING
        trigger: "system — Job created on quote accept"
        actor: system
        preconditions: []
        side_effects: []
      - from: FABRICATING
        to: FABRICATED
        trigger: "system — owning TemperingBatch completes"
        actor: system
        preconditions: []
        side_effects: []
      - from: FABRICATED
        to: INSTALLED
        trigger: "system — owning InstallAppointment completes"
        actor: system
        preconditions: []
        side_effects: []
      - from: INSTALLED
        to: BROKEN
        trigger: "system — ClaimReport approved"
        actor: system
        preconditions: []
        side_effects: []
      - from: FABRICATED
        to: BROKEN
        trigger: "system — ClaimReport approved (pre-install breakage)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BROKEN
        to: FABRICATED
        trigger: "system — RemakeOrder completes"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Job (parallel axes: fabrication_status x install_status) ------------
  - entity: Job
    initial_state: ACTIVE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      # fabrication axis
      - from: "fabrication_status=PENDING"
        to: "fabrication_status=IN_FABRICATION"
        trigger: "system — first TemperingBatch created for the job"
        actor: system
        preconditions: []
        side_effects: []
      - from: "fabrication_status=IN_FABRICATION"
        to: "fabrication_status=COMPLETE"
        trigger: "system — TemperingBatch completes and all LineItems are FABRICATED"
        actor: system
        preconditions: []
        side_effects:
          - "BUBBLE_UP: install_status NOT_READY -> READY"
      - from: "fabrication_status=COMPLETE"
        to: "fabrication_status=REOPENED"
        trigger: "system — ClaimReport approved (LineItem -> BROKEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "fabrication_status=REOPENED"
        to: "fabrication_status=COMPLETE"
        trigger: "system — RemakeOrder completes and all LineItems FABRICATED again"
        actor: system
        preconditions: []
        side_effects: []
      # install axis
      - from: "install_status=READY"
        to: "install_status=SCHEDULED"
        trigger: "system — InstallAppointment created for the job"
        actor: system
        preconditions: []
        side_effects: []
      - from: "install_status=SCHEDULED"
        to: "install_status=INSTALLED"
        trigger: "system — InstallAppointment completes"
        actor: system
        preconditions: []
        side_effects:
          - "BUBBLE_UP: if fabrication_status==COMPLETE, Job.status ACTIVE -> CLOSED"
      - from: "install_status=INSTALLED"
        to: "install_status=ON_HOLD"
        trigger: "system — ClaimReport approved on an INSTALLED line"
        actor: system
        preconditions: []
        side_effects:
          - "Job.status CLOSED -> ACTIVE if it had closed"
      # lifecycle
      - from: "status=ACTIVE"
        to: "status=CANCELLED"
        trigger: "POST /jobs/{id}/cancel"
        actor: ShopAdmin
        preconditions:
          - "Job.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: ContractorAccount.credit_used_cents -= Job.credit_hold_cents (credit hold released)"
          - "CASCADE: each SCHEDULED TemperingBatch of the job -> CANCELLED (furnace reserved_sqft released)"
          - "CASCADE: each SCHEDULED InstallAppointment of the job -> CANCELLED"

  # ---- TemperingBatch ------------------------------------------------------
  - entity: TemperingBatch
    initial_state: SCHEDULED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DONE
        trigger: "POST /tempering-batches/{id}/complete"
        actor: Fabricator
        preconditions:
          - "Batch.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "Each job LineItem in FABRICATING -> FABRICATED"
          - "TemperingFurnace.reserved_sqft -= total_sqft"
          - "BUBBLE_UP: if all job LineItems FABRICATED, Job.fabrication_status -> COMPLETE (=> install_status READY)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tempering-batches/{id}/cancel"
        actor: Fabricator
        preconditions:
          - "Batch.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: TemperingFurnace.reserved_sqft -= total_sqft (reservation released)"

  # ---- InstallAppointment --------------------------------------------------
  - entity: InstallAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /install-appointments/{id}/complete"
        actor: Scheduler
        preconditions:
          - "Appointment.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "Each job LineItem in FABRICATED -> INSTALLED"
          - "Job.install_status SCHEDULED -> INSTALLED (may close job)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — owning Job cancelled"
        actor: system
        preconditions: []
        side_effects: []

  # ---- ClaimReport ---------------------------------------------------------
  - entity: ClaimReport
    initial_state: FILED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /claim-reports/{id}/review (decision=APPROVE)"
        actor: ShopAdmin
        preconditions:
          - "Claim.status == FILED (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE hop 1: target LineItem (INSTALLED or FABRICATED) -> BROKEN"
          - "CASCADE hop 2 (caused by LineItem->BROKEN): create RemakeOrder (PENDING, remake_cost_cents = unit_price_cents + REMAKE_SURCHARGE_CENTS); set ClaimReport.remake_order_id; Job.fabrication_status COMPLETE -> REOPENED; if line was INSTALLED, Job.install_status INSTALLED -> ON_HOLD"
          - "CASCADE hop 3 (caused by RemakeOrder creation): if billable_to_contractor, ContractorAccount.credit_used_cents += REMAKE_SURCHARGE_CENTS and Job.credit_hold_cents += REMAKE_SURCHARGE_CENTS"
      - from: FILED
        to: REJECTED
        trigger: "POST /claim-reports/{id}/review (decision=REJECT)"
        actor: ShopAdmin
        preconditions:
          - "Claim.status == FILED (else ERR_INVALID_STATE)"
        side_effects: []

  # ---- RemakeOrder ---------------------------------------------------------
  - entity: RemakeOrder
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: COMPLETE
        trigger: "POST /remake-orders/{id}/complete"
        actor: Fabricator
        preconditions:
          - "RemakeOrder.status == PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "target LineItem BROKEN -> FABRICATED"
          - "BUBBLE_UP: if all job LineItems FABRICATED/INSTALLED, Job.fabrication_status REOPENED -> COMPLETE"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: accept-stale-account
    parent_entity: ContractorAccount
    write_endpoint: "POST /quotes/{id}/accept"
    occ_field: "expected_account_version"
    description: |
      Accepting a quote consumes credit headroom on the shared ContractorAccount.
      When the account's version has advanced since the client last observed it —
      because a different quote for the same account was already accepted and its
      credit hold recorded — the client's view of available credit is stale, so
      the accept is rejected. A second sequential accept of a DIFFERENT, still-SENT
      quote observes no changed field on its own quote, yet must be rejected because
      the account version it carries is stale.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_item_pricing
    trigger: "LineItem create; re-read on GET"
    algorithm: tiered_pricing
    formula: |
      area_sqft   = round_half_up(width_in * height_in / 144, 2)
      billable_sqft = max(area_sqft, MIN_BILLABLE_SQFT)
      rate_term   = RATE[glass_type] * THICKNESS_MULT[thickness_mm] + EDGE_RATE[edge_work]   # cents/sqft
      unit_price_cents = round_half_up(billable_sqft * rate_term)  + PRODUCT_FEE[product_type]
      line_total_cents = unit_price_cents * quantity
    input_set: "single LineItem's own input fields"
    constants:
      MIN_BILLABLE_SQFT: 4.0
      RATE: { ANNEALED: 800, TEMPERED: 1400, LAMINATED: 2000, INSULATED: 2600 }   # cents/sqft
      THICKNESS_MULT: { 6: 1.0, 10: 1.25, 12: 1.5 }
      EDGE_RATE: { NONE: 0, POLISHED: 150, BEVELED: 300 }   # cents/sqft
      PRODUCT_FEE: { SHOWER_ENCLOSURE: 5000, STOREFRONT: 8000, CUSTOM_MIRROR: 2000, TABLETOP: 1500 }   # cents
    precision: "money integer cents, round_half_up; area to 2 decimals round_half_up"
    note: "Mode (a) combinatorial: >=3 inputs with non-linear interaction (rate x thickness multiplier, +edge, x area, +fee) and a MIN_BILLABLE_SQFT floor."

  - name: quote_totals
    trigger: "POST /quotes/{id}/send"
    algorithm: aggregation
    formula: |
      tier_pct   = TIER_DISCOUNT_PCT[account.tier]
      subtotal_cents = sum over lines of line_total_cents
      # PINNED ORDER: discount each line, round each to cents, THEN sum.
      total_cents    = sum over lines of round_half_up(line_total_cents * (1 - tier_pct))
      discount_cents = subtotal_cents - total_cents
    input_set: "all LineItems of the quote"
    constants:
      TIER_DISCOUNT_PCT: { WALK_IN: 0.0, BRONZE: 0.05, SILVER: 0.10, GOLD: 0.15 }
      QUOTE_VALID_DAYS: 30
      WARRANTY_DAYS: 365
    precision: "round_half_up per line BEFORE summing"
    note: "Mode (b) combinatorial: rounding order matters. Round-per-line-then-sum is pinned; sum-then-round differs by up to (n-1) cents."

  - name: lead_time_estimation
    trigger: "quoted variant: POST /quotes/{id}/send; committed variant: POST /quotes/{id}/accept"
    algorithm: threshold
    formula: |
      job_fab_sqft = sum over lines of (billable_sqft * quantity)
      # quoted (provisional): ignores furnace queue
      quoted_lead_days    = FAB_BASE_DAYS + ceil(job_fab_sqft / STD_THROUGHPUT_SQFT_PER_DAY) + INSTALL_DAYS
      # committed: adds the current SCHEDULED furnace backlog observed at accept time
      scheduled_backlog_sqft = sum of total_sqft over ALL TemperingBatch rows with status=SCHEDULED
      committed_lead_days = FAB_BASE_DAYS + ceil((scheduled_backlog_sqft + job_fab_sqft) / STD_THROUGHPUT_SQFT_PER_DAY) + INSTALL_DAYS
    input_set: "quoted: this quote's lines; committed: this job's lines + all SCHEDULED batches"
    constants:
      FAB_BASE_DAYS: 3
      STD_THROUGHPUT_SQFT_PER_DAY: 50
      INSTALL_DAYS: 2
    precision: "integer days, ceil on the fabrication term"
    variants:
      - { name: quoted, when: "at send, on the Quote", difference: "backlog term excluded — pure per-job estimate" }
      - { name: committed, when: "at accept, on the Job", difference: "includes scheduled_backlog_sqft, so identical glass yields a longer lead when the furnace queue is non-empty" }

  - name: credit_exposure
    trigger: "provisional: POST /quotes/{id}/accept; final: recomputed on GET /jobs/{id}"
    algorithm: aggregation
    formula: |
      # provisional (credit_hold_cents at accept)
      credit_hold_cents = quote.total_cents  [+ REMAKE_SURCHARGE_CENTS per billable remake later]
      # final (as-built exposure)
      final_total_cents = sum over INSTALLED lines of round_half_up(line_total_cents * (1 - tier_pct))
                          + REMAKE_SURCHARGE_CENTS * (count of RemakeOrders with billable_to_contractor=true)
    input_set: "provisional: the quote total; final: INSTALLED lines + billable RemakeOrders of the job"
    constants:
      REMAKE_SURCHARGE_CENTS: 2500
    precision: "integer cents, round_half_up"
    variants:
      - { name: provisional, when: "at accept, ContractorAccount/Job credit", difference: "uses quoted total; blind to what actually installs or breaks" }
      - { name: final, when: "as-built on the Job", difference: "sums only INSTALLED lines and adds billable remake surcharges — diverges from provisional whenever a billable remake occurs or a line never installs" }
    note: "Dual-variant on the ContractorAccount/Job credit domain (distinct from lead_time_estimation's lead-time domain)."

  - name: batch_total_sqft
    trigger: "POST /tempering-batches"
    algorithm: aggregation
    formula: |
      total_sqft = sum over the job's LineItems in FABRICATING status of (billable_sqft * quantity)
    input_set: "the job's LineItems currently in FABRICATING"
    precision: "2 decimals, round_half_up"
    note: "Empty when no FABRICATING lines remain -> ERR_EMPTY_BATCH (zero-count edge)."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation (per RBAC); Contractor acting on own account only"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and body foreign-key ids resolve to existing resources (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required fields present; enum values legal; thickness_mm in {6,10,12}; width_in>0, height_in>0, quantity>=1; window/batch end > start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST"

  - priority: 5
    category: state
    check: "Target resource in a legal state for the transition (e.g. accept requires Quote SENT; complete requires SCHEDULED; review requires FILED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: business_safety
    check: "Safety glazing: any LineItem with requires_safety_glazing=true must have glass_type in {TEMPERED, LAMINATED} before install can be scheduled"
    error_id: ERR_SAFETY_GLAZING_REQUIRED
    http_status: 422
    applies_to: "POST /install-appointments"

  - priority: 7
    category: business_referential
    check: "Cross-entity dependency: accept requires ContractorAccount.status==ACTIVE; scheduling install requires Job.fabrication_status==COMPLETE; crew must be certified for every product type in the job"
    error_id: "ERR_ACCOUNT_NOT_ACTIVE | ERR_FABRICATION_INCOMPLETE | ERR_CREW_NOT_CERTIFIED"
    http_status: 409
    applies_to: "POST /quotes/{id}/accept, POST /install-appointments"

  - priority: 8
    category: business_temporal
    check: "Quote not expired at accept (clock <= valid_until); resource windows do not conflict (crew half-open overlap; furnace window + cooldown buffer)"
    error_id: "ERR_QUOTE_EXPIRED | ERR_CREW_DOUBLE_BOOKED | ERR_FURNACE_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /quotes/{id}/accept, POST /install-appointments, POST /tempering-batches"

  - priority: 9
    category: business_constraint
    check: "Capacity & collection edges: batch total_sqft <= furnace.max_batch_sqft; batch has >=1 FABRICATING line (ERR_EMPTY_BATCH)"
    error_id: "ERR_BATCH_CAPACITY_EXCEEDED | ERR_EMPTY_BATCH"
    http_status: 422
    applies_to: "POST /tempering-batches"

  - priority: 10
    category: business_fiscal
    check: "available_credit_cents >= quote.total_cents at accept"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /quotes/{id}/accept"

  - priority: 11
    category: state
    check: "OCC: expected_account_version matches ContractorAccount.version"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /quotes/{id}/accept"

  - priority: 12
    category: business_temporal
    check: "Warranty window: WARRANTY_DEFECT claim only within WARRANTY_DAYS of the line's install; claim target must be INSTALLED (BREAKAGE also allows FABRICATED)"
    error_id: "ERR_CLAIM_WINDOW_EXPIRED | ERR_CLAIM_TARGET_INVALID"
    http_status: 409
    applies_to: "POST /claim-reports"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- ContractorAccount ----
  - method: POST
    path: "/contractor-accounts"
    description: "Create a B2B contractor account"
    roles: [ShopAdmin]
    code: 201
    input: [company_name, tier, credit_limit_cents]
    output: ContractorAccount
    side_effects: ["status=ACTIVE, credit_used_cents=0, version=1"]

  - method: GET
    path: "/contractor-accounts/{id}"
    description: "Read a contractor account (credit_used_cents, version, status)"
    roles: [ShopAdmin, Estimator, Contractor]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: []

  - method: POST
    path: "/contractor-accounts/{id}/set-status"
    description: "Change account status (ACTIVE/ON_HOLD/SUSPENDED)"
    roles: [ShopAdmin]
    code: 200
    input: [status]
    output: ContractorAccount
    side_effects: ["status transition; version += 1"]

  # ---- Quote ----
  - method: POST
    path: "/quotes"
    description: "Create a DRAFT quote for a contractor account"
    roles: [Estimator]
    code: 201
    input: [contractor_account_id]
    output: Quote
    side_effects: ["status=DRAFT, revision_number=1"]

  - method: GET
    path: "/quotes/{id}"
    description: "Read a quote with computed totals and lead time"
    roles: [Estimator, Contractor, ShopAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/quotes"
    description: "List quotes; filter by contractor account (reverse-reachability for Quote.contractor_account_id)"
    roles: [Estimator, Contractor, ShopAdmin]
    code: 200
    input: ["contractor_account_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/quotes/{id}/line-items"
    description: "Add a glass line item (measure + spec) to a DRAFT quote"
    roles: [Estimator]
    code: 201
    input: [product_type, glass_type, thickness_mm, width_in, height_in, quantity, "edge_work?", "requires_safety_glazing?"]
    output: LineItem
    side_effects: ["compute billable_sqft, unit_price_cents, line_total_cents via line_item_pricing; status=SPEC"]

  - method: GET
    path: "/quotes/{id}/line-items"
    description: "List a quote's line items (reverse-reachability for LineItem.quote_id)"
    roles: [Estimator, Contractor, ShopAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: LineItem[]
    side_effects: []

  - method: POST
    path: "/quotes/{id}/send"
    description: "Send a DRAFT quote to the contractor (freezes totals & lead time)"
    roles: [Estimator]
    code: 200
    input: []
    output: Quote
    side_effects: ["status DRAFT->SENT; quote_totals; quoted_lead_days; valid_until stamped"]

  - method: POST
    path: "/quotes/{id}/revise"
    description: "Return a SENT quote to DRAFT for revision"
    roles: [Estimator]
    code: 200
    input: []
    output: Quote
    side_effects: ["status SENT->DRAFT; revision_number += 1; quoted_lead_days/valid_until cleared"]

  - method: POST
    path: "/quotes/{id}/accept"
    description: "Contractor accepts a SENT quote -> creates a Job and holds credit (OCC on account version)"
    roles: [Contractor]
    code: 200
    input: [expected_account_version]
    output: Quote
    side_effects:
      - "status SENT->ORDERED; ordered_job_id set"
      - "Job created (fabrication_status=PENDING, install_status=NOT_READY); committed_lead_days computed; credit_hold_cents set"
      - "ContractorAccount.credit_used_cents += credit_hold_cents; ContractorAccount.version += 1"
      - "each LineItem SPEC->FABRICATING"

  # ---- Job ----
  - method: GET
    path: "/jobs/{id}"
    description: "Read a job (fabrication_status, install_status, committed_lead_days, credit_hold_cents, final_total_cents)"
    roles: [Estimator, Fabricator, Scheduler, ShopAdmin, Contractor]
    code: 200
    input: []
    output: Job
    side_effects: []

  - method: GET
    path: "/jobs"
    description: "List jobs; filter by quote or account (reverse-reachability for Job.quote_id and Job.contractor_account_id)"
    roles: [Estimator, Fabricator, Scheduler, ShopAdmin, Contractor]
    code: 200
    input: ["quote_id?", "contractor_account_id?", "limit?", "offset?"]
    output: Job[]
    side_effects: []

  - method: POST
    path: "/jobs/{id}/cancel"
    description: "Cancel an ACTIVE job; release credit hold; cancel scheduled batches & appointments"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: Job
    side_effects:
      - "status ACTIVE->CANCELLED"
      - "ContractorAccount.credit_used_cents -= credit_hold_cents"
      - "SCHEDULED TemperingBatch -> CANCELLED (furnace reserved_sqft released); SCHEDULED InstallAppointment -> CANCELLED"

  # ---- TemperingFurnace ----
  - method: POST
    path: "/tempering-furnaces"
    description: "Register a tempering furnace / fabrication line resource"
    roles: [ShopAdmin]
    code: 201
    input: [name, max_batch_sqft, "cooldown_minutes?"]
    output: TemperingFurnace
    side_effects: ["reserved_sqft=0"]

  - method: GET
    path: "/tempering-furnaces/{id}"
    description: "Read a furnace (reserved_sqft, status)"
    roles: [Fabricator, ShopAdmin]
    code: 200
    input: []
    output: TemperingFurnace
    side_effects: []

  # ---- TemperingBatch ----
  - method: POST
    path: "/tempering-batches"
    description: "Schedule a fabrication/tempering batch for a job on a furnace window"
    roles: [Fabricator]
    code: 201
    input: [job_id, furnace_id, scheduled_start, scheduled_end]
    output: TemperingBatch
    side_effects:
      - "compute total_sqft via batch_total_sqft; status=SCHEDULED"
      - "furnace overlap+cooldown check; capacity check; furnace.reserved_sqft += total_sqft"
      - "Job.fabrication_status PENDING->IN_FABRICATION on first batch"

  - method: GET
    path: "/tempering-batches/{id}"
    description: "Read a tempering batch"
    roles: [Fabricator, ShopAdmin]
    code: 200
    input: []
    output: TemperingBatch
    side_effects: []

  - method: GET
    path: "/tempering-batches"
    description: "List batches; filter by furnace or job (reverse-reachability for TemperingBatch.furnace_id and job_id)"
    roles: [Fabricator, ShopAdmin]
    code: 200
    input: ["furnace_id?", "job_id?", "status?", "limit?", "offset?"]
    output: TemperingBatch[]
    side_effects: []

  - method: POST
    path: "/tempering-batches/{id}/complete"
    description: "Mark a batch DONE; fabricate its lines; release furnace reservation"
    roles: [Fabricator]
    code: 200
    input: []
    output: TemperingBatch
    side_effects: ["status SCHEDULED->DONE; LineItems FABRICATING->FABRICATED; furnace.reserved_sqft -= total_sqft; Job.fabrication_status -> COMPLETE if all fabricated"]

  - method: POST
    path: "/tempering-batches/{id}/cancel"
    description: "Cancel a SCHEDULED batch; release furnace reservation"
    roles: [Fabricator]
    code: 200
    input: []
    output: TemperingBatch
    side_effects: ["status SCHEDULED->CANCELLED; furnace.reserved_sqft -= total_sqft"]

  # ---- InstallCrew ----
  - method: POST
    path: "/install-crews"
    description: "Register an install crew resource with product certifications"
    roles: [ShopAdmin]
    code: 201
    input: [name, certified_products]
    output: InstallCrew
    side_effects: ["certifications recorded"]

  # ---- InstallAppointment ----
  - method: POST
    path: "/install-appointments"
    description: "Schedule an install appointment for a job on a crew window"
    roles: [Scheduler]
    code: 201
    input: [job_id, crew_id, window_start, window_end]
    output: InstallAppointment
    side_effects:
      - "safety-glazing check; Job.fabrication_status==COMPLETE check; crew certification check; crew overlap check"
      - "status=SCHEDULED; Job.install_status READY->SCHEDULED"

  - method: GET
    path: "/install-appointments/{id}"
    description: "Read an install appointment"
    roles: [Scheduler, ShopAdmin]
    code: 200
    input: []
    output: InstallAppointment
    side_effects: []

  - method: GET
    path: "/install-appointments"
    description: "List appointments; filter by crew or job (reverse-reachability for crew_id and job_id)"
    roles: [Scheduler, ShopAdmin]
    code: 200
    input: ["crew_id?", "job_id?", "status?", "limit?", "offset?"]
    output: InstallAppointment[]
    side_effects: []

  - method: POST
    path: "/install-appointments/{id}/complete"
    description: "Complete an install; mark lines INSTALLED"
    roles: [Scheduler]
    code: 200
    input: []
    output: InstallAppointment
    side_effects: ["status SCHEDULED->COMPLETED; LineItems FABRICATED->INSTALLED; Job.install_status->INSTALLED (may close job)"]

  # ---- ClaimReport (breakage + warranty) ----
  - method: POST
    path: "/claim-reports"
    description: "File a breakage or warranty claim against a job's line item"
    roles: [Scheduler, Fabricator, Contractor]
    code: 201
    input: [job_id, line_item_id, claim_type, cause, "billable_to_contractor?"]
    output: ClaimReport
    side_effects: ["status=FILED"]

  - method: GET
    path: "/claim-reports/{id}"
    description: "Read a claim report"
    roles: [Scheduler, Fabricator, ShopAdmin, Contractor]
    code: 200
    input: []
    output: ClaimReport
    side_effects: []

  - method: GET
    path: "/claim-reports"
    description: "List claims; filter by line item or job (reverse-reachability for line_item_id and job_id)"
    roles: [Scheduler, Fabricator, ShopAdmin, Contractor]
    code: 200
    input: ["line_item_id?", "job_id?", "status?", "limit?", "offset?"]
    output: ClaimReport[]
    side_effects: []

  - method: POST
    path: "/claim-reports/{id}/review"
    description: "Adjudicate a FILED claim (APPROVE triggers remake cascade; REJECT closes it)"
    roles: [ShopAdmin]
    code: 200
    input: [decision]
    output: ClaimReport
    side_effects:
      - "APPROVE: LineItem->BROKEN; RemakeOrder created; Job.fabrication_status->REOPENED (install_status->ON_HOLD if line was INSTALLED); if billable, ContractorAccount.credit_used_cents += REMAKE_SURCHARGE_CENTS and Job.credit_hold_cents += REMAKE_SURCHARGE_CENTS"
      - "REJECT: status FILED->REJECTED, no cascade"

  # ---- RemakeOrder (cascade-created; discover via reverse GET) ----
  - method: GET
    path: "/remake-orders/{id}"
    description: "Read a remake order"
    roles: [Fabricator, Scheduler, ShopAdmin]
    code: 200
    input: []
    output: RemakeOrder
    side_effects: []

  - method: GET
    path: "/remake-orders"
    description: "List remake orders; filter by claim, job, or line item (reverse-reachability for all three FKs)"
    roles: [Fabricator, Scheduler, ShopAdmin]
    code: 200
    input: ["claim_report_id?", "job_id?", "line_item_id?", "status?", "limit?", "offset?"]
    output: RemakeOrder[]
    side_effects: []

  - method: POST
    path: "/remake-orders/{id}/complete"
    description: "Complete a remake; re-fabricate the line and (if all fabricated) close fabrication"
    roles: [Fabricator]
    code: 200
    input: []
    output: RemakeOrder
    side_effects: ["status PENDING->COMPLETE; LineItem BROKEN->FABRICATED; Job.fabrication_status REOPENED->COMPLETE if all fabricated"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to real wall time. Governs quote expiry and warranty windows."
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Contractor acting on an account it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path/body id does not resolve to an existing resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, illegal enum, thickness not in {6,10,12}, non-positive dimension/quantity, or window end <= start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal state for the requested transition" }
  - { id: ERR_QUOTE_EMPTY, http: 422, condition: "Sending a quote that has zero line items" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Accepting a quote after current clock > valid_until" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Accepting a quote while ContractorAccount.status != ACTIVE" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "Accepting a quote whose total_cents exceeds available_credit_cents" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match ContractorAccount.version" }
  - { id: ERR_FABRICATION_INCOMPLETE, http: 409, condition: "Scheduling an install appointment while Job.fabrication_status != COMPLETE" }
  - { id: ERR_SAFETY_GLAZING_REQUIRED, http: 422, condition: "A line requiring safety glazing is not TEMPERED/LAMINATED at install scheduling" }
  - { id: ERR_CREW_NOT_CERTIFIED, http: 409, condition: "Crew not certified for a product type present in the job" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Appointment window overlaps another SCHEDULED appointment on the same crew (half-open intervals)" }
  - { id: ERR_FURNACE_WINDOW_CONFLICT, http: 409, condition: "Batch window collides with another SCHEDULED batch on the furnace within cooldown_minutes buffer" }
  - { id: ERR_BATCH_CAPACITY_EXCEEDED, http: 422, condition: "Batch total_sqft exceeds furnace.max_batch_sqft" }
  - { id: ERR_EMPTY_BATCH, http: 422, condition: "Batch has no LineItem in FABRICATING status (zero-count)" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 409, condition: "WARRANTY_DEFECT claim filed after WARRANTY_DAYS from install" }
  - { id: ERR_CLAIM_TARGET_INVALID, http: 409, condition: "Claim target line not in a claimable state (WARRANTY_DEFECT needs INSTALLED; BREAKAGE needs FABRICATED or INSTALLED)" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of bounds (limit 1..100, offset >= 0)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Shop operator: configures accounts, furnaces, crews; adjudicates claims; cancels jobs; sets clock"
    identity: opaque
    exclusive_operations:
      - "POST /contractor-accounts — create account"
      - "POST /contractor-accounts/{id}/set-status — change account status"
      - "POST /tempering-furnaces — register furnace"
      - "POST /install-crews — register crew"
      - "POST /jobs/{id}/cancel — cancel job"
      - "POST /claim-reports/{id}/review — adjudicate claim"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET on all resources"

  - name: Estimator
    description: "Sales estimator: measures, specs glass, builds and sends quotes"
    identity: opaque
    exclusive_operations:
      - "POST /quotes — create quote"
      - "POST /quotes/{id}/line-items — add line item"
      - "POST /quotes/{id}/send — send quote"
      - "POST /quotes/{id}/revise — revise quote"
    shared_operations:
      - "GET /quotes, /quotes/{id}, /quotes/{id}/line-items, /jobs, /jobs/{id}, /contractor-accounts/{id}"

  - name: Contractor
    description: "B2B contractor acting on its own account: accepts quotes, files warranty claims"
    identity: "entity_backed:ContractorAccount"
    exclusive_operations:
      - "POST /quotes/{id}/accept — accept own quote (X-User-ID == quote.contractor_account_id)"
    shared_operations:
      - "POST /claim-reports — file a claim on own job"
      - "GET /quotes, /jobs, /claim-reports, /contractor-accounts/{id} for own account"

  - name: Fabricator
    description: "Fabrication/tempering operator: schedules and completes batches, completes remakes"
    identity: opaque
    exclusive_operations:
      - "POST /tempering-batches — schedule batch"
      - "POST /tempering-batches/{id}/complete — complete batch"
      - "POST /tempering-batches/{id}/cancel — cancel batch"
      - "POST /remake-orders/{id}/complete — complete remake"
    shared_operations:
      - "POST /claim-reports — file a breakage claim"
      - "GET /tempering-furnaces/{id}, /tempering-batches, /jobs, /remake-orders"

  - name: Scheduler
    description: "Install dispatcher: schedules and completes install appointments"
    identity: opaque
    exclusive_operations:
      - "POST /install-appointments — schedule appointment"
      - "POST /install-appointments/{id}/complete — complete appointment"
    shared_operations:
      - "POST /claim-reports — file a breakage claim"
      - "GET /install-appointments, /jobs, /claim-reports, /remake-orders"
