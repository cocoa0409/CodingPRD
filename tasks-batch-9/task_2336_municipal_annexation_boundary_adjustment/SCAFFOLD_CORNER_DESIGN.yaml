      - name: fiscal_variants_diverge_on_identical_territory_data
        claim_type: variant_divergence
        grounds:
          - calculations.fiscal_impact_projection.variants
        distinguishing_aspect: |
          AVERAGE_COST and MARGINAL_COST fed identical territory and population must produce
          different base costs, possibly different overhead tiers, and different deficit ratios.
        excluded_because:
          difficulty_instance: fiscal_variant_average_vs_marginal_diverge_on_identical_territory
          rationale: |
            That §1.8 instance runs both variants over byte-identical territory data under two
            statutes and pins every intermediate on both sides — base cost, overhead_tier_pct,
            administrative_overhead_cents, net_annual_impact_cents and deficit_ratio_pct — so the
            divergence and its delta are already fully asserted.

      - name: protest_basis_variants_flip_the_outcome_on_identical_filings
        claim_type: variant_divergence
        grounds:
          - calculations.protest_evaluation.variants
        distinguishing_aspect: |
          The same filing set weighed by assessed value and by owner count yields different
          protest_pct values and can flip protest_outcome.
        excluded_because:
          difficulty_instance: protest_variant_value_vs_owner_count_flips_outcome_on_identical_filings
          rationale: |
            That §1.8 instance builds two territories with identical filings under ASSESSED_VALUE
            and OWNER_COUNT statutes and shows one SUSTAINED and one FAILED, which is a strictly
            stronger claim than a numeric delta between the two bases.

      - name: overhead_tier_boundary_is_evaluated_at_exactly_five_million
        claim_type: tiered_pricing_boundary
        grounds:
          - calculations.fiscal_impact_projection.constants
        distinguishing_aspect: |
          The tier test is a strict `<`, so a base cost of exactly 5,000,000 cents falls into the
          0.09 band while 4,999,999 stays at 0.12.
        excluded_because:
          difficulty_instance: overhead_tier_boundary_at_exactly_five_million_base_cost
          rationale: |
            That §1.8 instance pins both sides of the boundary in one comparison — 4,999,999 ->
            0.12 and 5,000,000 -> 0.09 — together with the resulting overhead cents, covering the
            tier-boundary claim exactly.

      - name: overhead_tier_reads_the_pre_overhead_base_cost
        claim_type: constants_applied
        grounds:
          - calculations.fiscal_impact_projection.formula
        distinguishing_aspect: |
          Evaluation order: the tier is chosen from base_service_cost_cents and never re-selected
          from the post-overhead total.
        excluded_because:
          difficulty_instance: overhead_tier_selected_from_pre_overhead_base_cost
          rationale: |
            That §1.8 instance is built so that the post-overhead total crosses into the next tier
            while the pre-overhead base does not, and it asserts the lower-tier percentage was
            kept — the only way to observe the pinned evaluation order.

      - name: protest_threshold_comparison_is_inclusive_at_the_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.protest_evaluation.precision
        distinguishing_aspect: |
          protest_pct exactly equal to protest_threshold_pct must sustain the protest, because the
          comparison is `>=`.
        excluded_because:
          difficulty_instance: protest_pct_exactly_at_threshold_sustains_annexation
          rationale: |
            That §1.8 instance lands protest_pct on exactly 20.00 against a 20.00 threshold and
            asserts SUSTAINED plus the case's PROTEST_SUSTAINED status, covering the inclusive
            boundary directly.

      - name: contiguity_threshold_comparison_is_inclusive_at_the_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.territory_qualification
          - validations[priority=52]
        distinguishing_aspect: |
          contiguity_ratio exactly equal to contiguity_min_ratio must certify rather than raise
          ERR_TERRITORY_NOT_CONTIGUOUS.
        excluded_because:
          difficulty_instance: contiguity_ratio_exactly_at_statutory_minimum_certifies
          rationale: |
            That §1.8 instance certifies a case whose contiguity_ratio rounds to exactly the
            statutory minimum and additionally pins the qualification_index that the capped ramp
            produces at that exact point.

      - name: touching_provider_windows_share_their_boundary_day
        claim_type: interval_merge_adjacent
        grounds:
          - calculations.provider_capacity_encumbrance
        distinguishing_aspect: |
          Closed date intervals: two commitments whose windows merely touch still collide on the
          shared day.
        excluded_because:
          difficulty_instance: provider_closed_date_intervals_collide_on_the_shared_touching_day
          rationale: |
            That §1.8 instance activates a first window, then proves the touching window is
            rejected with ERR_PROVIDER_CAPACITY_EXCEEDED while a window starting one day later is
            admitted — both halves of the adjacency claim in one recipe.

      - name: buffered_chamber_intervals_admit_an_exact_touch
        claim_type: interval_merge_adjacent
        grounds:
          - calculations.hearing_chamber_occupation
        distinguishing_aspect: |
          Half-open buffered datetime intervals: a hearing starting exactly at the peer's end plus
          the changeover buffer is admitted, one minute earlier is not.
        excluded_because:
          difficulty_instance: chamber_buffered_half_open_interval_admits_exact_touch_only
          rationale: |
            That §1.8 instance tests both sides of the buffered boundary to the minute against the
            same peer hearing, which is the complete adjacency claim for this interval_merge rule.

      - name: per_parcel_rounding_precedes_the_tax_roll_summation
        claim_type: precision
        grounds:
          - calculations.tax_roll_proration.precision
        distinguishing_aspect: |
          Rounding each parcel's prorated tax before summing gives a different total than summing
          the unrounded products and rounding once.
        excluded_because:
          difficulty_instance: tax_roll_proration_rounds_per_parcel_before_summation
          rationale: |
            That §1.8 instance is dimensioned so the two rounding orders differ by whole cents and
            asserts the per-parcel values plus the pinned total, which is the only way to observe
            the mandated order.

      - name: qualification_index_composes_ramp_bonus_and_penalties
        claim_type: correct_result
        grounds:
          - calculations.territory_qualification.formula
        distinguishing_aspect: |
          The weighted score combines a capped contiguity ramp, a conditional urban bonus, a
          conditional density penalty and a stepped distance penalty before clamping.
        excluded_because:
          difficulty_instance: qualification_index_combines_capped_ramp_bonus_and_step_penalty
          rationale: |
            That §1.8 instance exercises all four terms at once (ramp cap reached, bonus applied,
            density penalty suppressed, ceil-based distance penalty taken) and pins the resulting
            index, which subsumes any single-term corner.

      - name: readiness_propagates_when_a_commitment_is_released
        claim_type: constraint_propagation
        grounds:
          - calculations.plan_service_readiness
          - calculations.provider_capacity_encumbrance
        distinguishing_aspect: |
          Changing one commitment must propagate through committed_cost_cents,
          covered_service_types, service_readiness and the provider's encumbrance to a fixed point.
        excluded_because:
          difficulty_instance: commitment_void_releases_exactly_the_encumbrance_and_cost_it_added
          rationale: |
            That §1.8 instance voids one of two commitments and pins the post-propagation value of
            every derived field on both the plan and the provider, so the propagation chain and its
            fixed point are already asserted end to end.

      - name: withdrawing_a_consent_reverses_the_petition_aggregate
        claim_type: aggregation_reversal
        grounds:
          - calculations.petition_sufficiency
        distinguishing_aspect: |
          A running aggregate must be exactly restored after a reversal, with no rounding drift.
        excluded_because:
          difficulty_instance: consent_withdrawal_restores_petition_signature_value_without_drift
          rationale: |
            That §1.8 instance adds consents with odd assessed values, withdraws one and asserts
            the aggregate returns to the exact pre-signature figure, which is the reversal claim
            for this aggregation rule.

  # =====================================================================================
  # SECTION 4 — Validations
  # =====================================================================================
  - section: validations
    instances:
      - name: certify_territory_rejects_every_disqualified_territory_and_case_shape
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - validations[priority=46]
          - validations[priority=47]
          - validations[priority=50]
          - validations[priority=51]
          - validations[priority=52]
          - validations[priority=53]
          - validations[priority=54]
          - validations[priority=74]
          - validations[priority=75]
        distinguishing_aspect: |
          Nine sibling cases under one statute, each dimensioned to fail exactly one certification
          gate, prove the gates are independent and that each raises its own error rather than a
          generic 422: empty territory, unauthorized method, contiguity 0.1000 < 0.1250, the urban
          test failing on both limbs at once, and a qualification_index of 55.00 that clears
          contiguity and urban development yet falls under the 60.00 service-capability floor.
          The same setup also pins the case-shape rules — an ANNEXATION case may not carry a
          predecessor, a DE_ANNEXATION case may not carry parcels and may not certify against a
          predecessor that is not yet EFFECTIVE — and the parcel-reuse rule that keeps one APN out
          of two live cases.
        test_recipe:
          setup:
            - "One statute authorizing only INVOLUNTARY_ORDINANCE, one municipality with an 80,000-foot corporate perimeter, one owner, and five DRAFT cases: CASE_EMPTY (no parcels), CASE_METHOD (PETITION_MAJORITY, one parcel with APN V1-M), CASE_CONTIG (shared_boundary_feet 8,000), CASE_URBAN (1 of 10 lots developed, 1 dwelling unit on 1 acre), CASE_INDEX (shared_boundary_feet 10,000, max_service_distance_miles 5), plus CASE_DA, a DE_ANNEXATION case whose predecessor CASE_EMPTY is still DRAFT."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_v1: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_v1}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_v1: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_v1: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v1}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { case_empty: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v1}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { case_method: $.data.id }
            - call: "POST /annexation-cases/${case_method}/parcels"
              payload: { primary_owner_id: "${ow_v1}", parcel_apn: "V1-M", assessed_value_cents: 20000000, acreage: 1.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v1}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 8000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { case_contig: $.data.id }
            - call: "POST /annexation-cases/${case_contig}/parcels"
              payload: { primary_owner_id: "${ow_v1}", parcel_apn: "V1-C", assessed_value_cents: 20000000, acreage: 1.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v1}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 10, developed_lot_count: 1, dwelling_units: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { case_urban: $.data.id }
            - call: "POST /annexation-cases/${case_urban}/parcels"
              payload: { primary_owner_id: "${ow_v1}", parcel_apn: "V1-U", assessed_value_cents: 20000000, acreage: 1.00, is_developed: false, dwelling_units: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v1}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 10000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 1, max_service_distance_miles: 5 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { case_index: $.data.id }
            - call: "POST /annexation-cases/${case_index}/parcels"
              payload: { primary_owner_id: "${ow_v1}", parcel_apn: "V1-I", assessed_value_cents: 20000000, acreage: 1.00, is_developed: true, dwelling_units: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v1}", method: "INVOLUNTARY_ORDINANCE", case_type: "DE_ANNEXATION", predecessor_case_id: "${case_empty}", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { case_da_v1: $.data.id }
          trigger:
            - call: "POST /annexation-cases/${case_empty}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_empty: $.data.error_id }
            - call: "POST /annexation-cases/${case_method}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_method: $.data.error_id }
            - call: "POST /annexation-cases/${case_contig}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_contig: $.data.error_id }
            - call: "POST /annexation-cases/${case_urban}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_urban: $.data.error_id }
            - call: "POST /annexation-cases/${case_index}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_index: $.data.error_id }
            - call: "POST /annexation-cases/${case_da_v1}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_pred: $.data.error_id }
            - call: "POST /annexation-cases/${case_da_v1}/parcels"
              payload: { primary_owner_id: "${ow_v1}", parcel_apn: "V1-D", assessed_value_cents: 20000000, acreage: 1.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_parcel_state: $.data.error_id }
            - call: "POST /annexation-cases/${case_empty}/parcels"
              payload: { primary_owner_id: "${ow_v1}", parcel_apn: "V1-M", assessed_value_cents: 20000000, acreage: 1.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_apn: $.data.error_id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v1}", method: "INVOLUNTARY_ORDINANCE", predecessor_case_id: "${case_empty}", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_shape: $.data.error_id }
            - call: "POST /petitions"
              payload: { annexation_case_id: "${case_method}", petition_type: "OWNER_MAJORITY" }
              as: MunicipalPlanner
              as_user_id: "${muni_v1}"
              captures: { e_case_state: $.data.error_id }
          assert:
            - "${e_empty} == ERR_TERRITORY_EMPTY with status 422"
            - "${e_method} == ERR_METHOD_NOT_AUTHORIZED_BY_STATUTE with status 422"
            - "${e_contig} == ERR_TERRITORY_NOT_CONTIGUOUS with status 422"
            - "${e_urban} == ERR_URBAN_DEVELOPMENT_TEST_FAILED with status 422"
            - "${e_index} == ERR_SERVICE_CAPABILITY_INSUFFICIENT with status 422"
            - "${e_pred} == ERR_PREDECESSOR_NOT_EFFECTIVE with status 422"
            - "${e_parcel_state} == ERR_PARCEL_STATE_INVALID with status 409"
            - "${e_apn} == ERR_PARCEL_ALREADY_IN_PENDING_CASE with status 409"
            - "${e_shape} == ERR_DE_ANNEXATION_NOT_ALLOWED with status 422"
            - "${e_case_state} == ERR_CASE_STATE_INVALID with status 409"
            - "every case named in the setup still has status DRAFT"
            - "GET /parcels?annexation_case_id=${case_da_v1} returns total_count == 0"
            - "GET /annexation-cases?municipality_id=${muni_v1} returns total_count == 6"

      - name: petition_limb_rejects_duplicate_shares_and_insufficient_signatures
        claim_type: violation_to_error
        grounds:
          - validations[priority=33]
          - validations[priority=34]
          - validations[priority=71]
          - validations[priority=72]
          - validations[priority=80]
          - validations[priority=86]
        distinguishing_aspect: |
          One circulating petition carrying a single 100%-share consent on the 40,000,000-cent
          parcel of a 100,000,000-cent territory separates six petition rules that all guard the
          same POST: the same (petition, parcel, owner) tuple is a duplicate (409) while a
          different owner adding a mere 1.00% is an over-100% share (422); a parcel from another
          case is a mismatch (422); a second live petition is refused (409); a second withdrawal
          of an already-withdrawn consent is refused (409); and certification at 40.00% against
          the 50.00 threshold is ERR_PETITION_INSUFFICIENT rather than a silent INSUFFICIENT.
        test_recipe:
          setup:
            - "A TERRITORY_CERTIFIED PETITION_MAJORITY case whose territory is parcel PA1 (40,000,000 cents, owner OW1) and PA2 (60,000,000 cents, owner OW2), a second DRAFT case holding parcel PB1, a CIRCULATING petition on the first case, a SIGNED 100%-share consent from OW1 on PA1 and a WITHDRAWN consent from OW2 on PA2; logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_v2: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_v2}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_v2: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_v2a: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ben Olsen", contact_email: "ben@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_v2b: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v2}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 2, developed_lot_count: 2, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v2}"
              captures: { case_v2a: $.data.id }
            - call: "POST /annexation-cases/${case_v2a}/parcels"
              payload: { primary_owner_id: "${ow_v2a}", parcel_apn: "V2-A1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_v2}"
              captures: { parcel_v2a1: $.data.id }
            - call: "POST /annexation-cases/${case_v2a}/parcels"
              payload: { primary_owner_id: "${ow_v2b}", parcel_apn: "V2-A2", assessed_value_cents: 60000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_v2}"
              captures: { parcel_v2a2: $.data.id }
            - call: "POST /annexation-cases/${case_v2a}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_v2}"
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_v2}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v2}"
              captures: { case_v2b: $.data.id }
            - call: "POST /annexation-cases/${case_v2b}/parcels"
              payload: { primary_owner_id: "${ow_v2b}", parcel_apn: "V2-B1", assessed_value_cents: 20000000, acreage: 1.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_v2}"
              captures: { parcel_v2b1: $.data.id }
            - call: "POST /petitions"
              payload: { annexation_case_id: "${case_v2a}", petition_type: "OWNER_MAJORITY", circulation_days: 30 }
              as: MunicipalPlanner
              as_user_id: "${muni_v2}"
              captures: { pet_v2: $.data.id }
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_v2}", parcel_id: "${parcel_v2a1}", property_owner_id: "${ow_v2a}", ownership_share_pct: 100.00 }
              as: PropertyOwner
              as_user_id: "${ow_v2a}"
              captures: { cons_v2a: $.data.id }
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_v2}", parcel_id: "${parcel_v2a2}", property_owner_id: "${ow_v2b}", ownership_share_pct: 100.00 }
              as: PropertyOwner
              as_user_id: "${ow_v2b}"
              captures: { cons_v2b: $.data.id }
            - call: "POST /parcel-owner-consents/${cons_v2b}/withdraw"
              payload: {}
              as: PropertyOwner
              as_user_id: "${ow_v2b}"
          trigger:
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_v2}", parcel_id: "${parcel_v2a1}", property_owner_id: "${ow_v2a}", ownership_share_pct: 100.00 }
              as: PropertyOwner
              as_user_id: "${ow_v2a}"
              captures: { e_dup_consent: $.data.error_id }
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_v2}", parcel_id: "${parcel_v2a1}", property_owner_id: "${ow_v2b}", ownership_share_pct: 1.00 }
              as: PropertyOwner
              as_user_id: "${ow_v2b}"
              captures: { e_share: $.data.error_id }
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_v2}", parcel_id: "${parcel_v2b1}", property_owner_id: "${ow_v2b}", ownership_share_pct: 50.00 }
              as: PropertyOwner
              as_user_id: "${ow_v2b}"
              captures: { e_mismatch: $.data.error_id }
            - call: "POST /petitions"
              payload: { annexation_case_id: "${case_v2a}", petition_type: "OWNER_MAJORITY", circulation_days: 30 }
              as: MunicipalPlanner
              as_user_id: "${muni_v2}"
              captures: { e_second_petition: $.data.error_id }
            - call: "POST /parcel-owner-consents/${cons_v2b}/withdraw"
              payload: {}
              as: PropertyOwner
              as_user_id: "${ow_v2b}"
              captures: { e_withdrawn: $.data.error_id }
            - call: "POST /petitions/${pet_v2}/certify-sufficiency"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_v2}"
              captures: { e_insufficient: $.data.error_id }
          assert:
            - "${e_dup_consent} == ERR_CONSENT_DUPLICATE with status 409"
            - "${e_share} == ERR_CONSENT_OWNERSHIP_SHARE_INVALID with status 422"
            - "${e_mismatch} == ERR_PARCEL_CASE_MISMATCH with status 422"
            - "${e_second_petition} == ERR_PETITION_ALREADY_CIRCULATING with status 409"
            - "${e_withdrawn} == ERR_CONSENT_ALREADY_WITHDRAWN with status 409"
            - "${e_insufficient} == ERR_PETITION_INSUFFICIENT with status 422"
            - "Petition.${pet_v2}.sufficiency_status == CIRCULATING"
            - "Petition.${pet_v2}.qualified_signature_assessed_value_cents == 40000000"
            - "Petition.${pet_v2}.signature_value_pct == 40.00"
            - "AnnexationCase.${case_v2a}.status == PETITION_CIRCULATING"
            - "GET /petitions?annexation_case_id=${case_v2a} returns total_count == 1"
            - "GET /parcel-owner-consents?petition_id=${pet_v2}&consent_status=SIGNED returns total_count == 1"

      - name: protest_window_rejects_duplicate_and_over_share_filings
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
          - validations[priority=73]
          - validations[priority=81]
        distinguishing_aspect: |
          Inside an open protest window the three filing rules are separated on the same parcel:
