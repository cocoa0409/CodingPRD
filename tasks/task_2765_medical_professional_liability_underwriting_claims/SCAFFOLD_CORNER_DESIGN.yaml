            - "PolicyTerm.${term_hi}.venue_severity_factor == 1.45"
            - "PolicyTerm.${term_hi}.rated_risk_class_code == R2"
            - "PolicyTerm.${term_hi}.rated_risk_class_factor == 1.00"
            - "PolicyTerm.${term_hi}.step_factor == 0.35"
