      - calling POST /servicing/credit-programs/${g_id}/close again returns ERR_INVALID_STATE rather than ERR_ALREADY_TERMINAL
  - name: account_transaction_rejected_when_program_closed
    grounds:
    - validations[priority=15]
    - errors.ERR_PROGRAM_CLOSED
    - state_machines.Account.transitions.ACTIVE_to_PAID_OFF
    distinguishing_aspect: 'Account operations depend on CreditProgram''s terminal state: once the program is CLOSED, a purchase on one of its accounts is rejected as a program-to-account dependency — distinct from the transfer dependency above.'
    test_recipe:
      setup:
