  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: membership_activation_gated_on_family_invoice_reaching_paid
        grounds:
          - state_machines.Membership.PENDING_ACTIVATION_to_ACTIVE
          - state_machines.Invoice.ISSUED_to_PAID
          - validations[priority=23]
          - errors[ERR_MEMBERSHIP_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Membership -> Invoice. A Membership cannot leave
          PENDING_ACTIVATION by any action on the Membership itself; only the
          family's cycle Invoice reaching PAID flips it, and every
          membership-scoped operation is refused with ERR_MEMBERSHIP_NOT_ACTIVE
          until that happens.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "One PLUS plan, one physician with panel_slot_cap 20.0 licensed in CA"
            - "One family, one child born 2026-04-01, one membership started 2026-06-01 sitting in PENDING_ACTIVATION"
            - "A DRAFT June invoice of 40000 cents auto-created by the enrollment"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
