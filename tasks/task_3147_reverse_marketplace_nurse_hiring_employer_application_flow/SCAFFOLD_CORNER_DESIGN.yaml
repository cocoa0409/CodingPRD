      - name: nurse_withdraw_cascades_applications_and_rescinds_offers
        claim_type: side_effect_execution
        grounds:
          - state_machines.Nurse.ACTIVE_to_WITHDRAWN
          - state_machines.Application
          - state_machines.Offer.ISSUED_to_RESCINDED
        distinguishing_aspect: "Nurse withdraw is a cascade: the UNDER_REVIEW application goes WITHDRAWN and a second application's ISSUED offer is RESCINDED (its application WITHDRAWN) in the same request; the nurse lands in terminal WITHDRAWN."
        test_recipe:
          setup:
            - "One nurse with two applications from two employers: A1 UNDER_REVIEW, A2 OFFER_EXTENDED with an ISSUED offer. Nurse has no Placement."
          setup_api_calls:
