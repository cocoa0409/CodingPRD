              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Wren Meadow Farms LLC", taxpayer_type: "BUSINESS", tin_last4: "8844" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { err_id: $.data.error_id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
          assert:
            - "the first trigger returns status 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "after the first trigger VoluntaryDisclosureAgreement.${agr_id}.status == \"DRAFTED\" with executed_by_user_id == null and version == 1"
            - "the second trigger returns status 200 with status == \"EXECUTED\""
            - "VoluntaryDisclosureAgreement.${agr_id}.drafted_by_user_id == \"officer-alpha\" and executed_by_user_id == \"officer-beta\""
            - "VoluntaryDisclosureAgreement.${agr_id}.executed_at == \"2026-09-15T00:00:00.000Z\""
            - "AmnestyProgram.${prog_id}.participant_count == 1"

      - name: segregation_of_duties_on_the_enforcement_action_issuer
        claim_type: Segregation of duties
        grounds:
          - roles[ComplianceAuditor].segregation_of_duties
        excluded_because:
          difficulty_instance: action_abatement_restores_the_behavior_ledger_but_not_the_assessment
          rationale: |
            That instance already drafts an action as auditor-one and issues it as
            auditor-two, exercising the second segregation-of-duties pair end to end
            before it goes on to abate the issued action.

  # =========================================================================
  - section: Cross-Cutting Complexity Layers
    instances:
      - name: stale_expected_agreement_version_is_refused_on_plan_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-agreement]
          - validations[priority=10]
          - errors[ERR_STALE_AGREEMENT_VERSION]
        distinguishing_aspect: |
          The agreement's version is bumped by writes the plan proposer never made — here
          a remittance — so a client that read the agreement before the payment holds a
          stale view of the balance it is scheduling. The refusal is 412, and re-reading
          the version makes the identical payload succeed, which proves the block is the
          version and not the payload.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Hollow Reed holds an EXECUTED agreement with one FILED return and total_due_cents 1050000"
            - "The client reads the agreement version BEFORE remitting, then remits 105000 cents, which advances the version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000, installment_max_count: 12 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Hollow Reed Basketry LLC", taxpayer_type: "BUSINESS", tin_last4: "5519" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 1000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /amnesty/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { agr_v_stale: $.data.version }
            - call: "POST /amnesty/payments"
              payload: { agreement_id: "${agr_id}", amount_cents: 105000, payment_reference: "DOWN-1" }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /amnesty/payment-plans"
              payload: { agreement_id: "${agr_id}", expected_agreement_version: "${agr_v_stale}", plan_type: "INSTALLMENT", installment_count: 11, down_payment_cents: 105000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { agr_v_fresh: $.data.version }
            - call: "POST /amnesty/payment-plans"
              payload: { agreement_id: "${agr_id}", expected_agreement_version: "${agr_v_fresh}", plan_type: "INSTALLMENT", installment_count: 11, down_payment_cents: 105000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { plan_id: $.data.id }
          assert:
            - "the first trigger returns status 412 with error_id ERR_STALE_AGREEMENT_VERSION"
            - "after the first trigger GET /amnesty/agreements/${agr_id}/payment-plans returns total_count == 0"
            - "${agr_v_fresh} == ${agr_v_stale} + 1"
            - "the third trigger returns status 201 with the identical payload apart from the version"
            - "PaymentPlan.${plan_id}.status == \"PROPOSED\" and installment_count == 11"
            - "VoluntaryDisclosureAgreement.${agr_id}.version advanced again on the successful proposal"

      - name: stale_expected_pre_clearance_version_is_refused_before_the_payload_rule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[terms-offer-stale-pre-clearance]
          - validations[priority=11]
          - validations[priority=25]
          - errors[ERR_STALE_PRE_CLEARANCE_VERSION]
        distinguishing_aspect: |
          This request violates TWO rules at once — a stale version and an offered lookback
          of 48 months against a 36-month program — and priority 11 beats priority 25, so
          the 412 masks the 422. Repairing only the version then surfaces
          ERR_LOOKBACK_EXCEEDS_PROGRAM_LIMIT, which proves the masked rule was still live.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with lookback_months 36 and one SALES_USE term"
            - "Representative Vane & Ash submitted a pre-clearance; the officer read its version at SUBMITTED, then ran begin-review, which advanced the version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
