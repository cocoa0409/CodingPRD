          assert:
            - "HTTP 200"
            - "Complaint.${c1_id}.status == WITHDRAWN, closed_at == 2026-08-05T09:00:00Z, retention_until == 2028-08-04T09:00:00Z"
            - "Allegation.${a1_id}.disposition == WITHDRAWN and disposed_at == 2026-08-05T09:00:00Z"
            - "Investigation.${inv_id}.status == VOIDED and closed_at == 2026-08-05T09:00:00Z (cascade link 1)"
            - "InterviewSession.${sess_b_id}.status == CANCELLED (cascade link 2 reaches the SCHEDULED session)"
            - "InterviewSession.${sess_a_id}.status == HELD and held_at == 2026-08-05T09:00:00Z (a terminal child is never rewritten by the cascade)"
            - "Investigation.${inv_id}.interview_held_count == 1 (the held interview is not unwound)"
            - "Officer.${inv_a_id}.open_case_load == 0 (cascade link 3 decrements exactly once, not once per session)"
            - "GET /interview-sessions with investigation_id ${inv_id} and status CANCELLED returns total_count == 1"
            - "Complaint.${c1_id}.narrative is still the stored text: withdrawal closes the file, only the purge redacts it"

