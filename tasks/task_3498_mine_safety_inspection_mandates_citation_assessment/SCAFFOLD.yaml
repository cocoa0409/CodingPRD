    roles: [DistrictManager]
    code: 201
    input: [mine_id, inspector_id, kind, planned_start_at, planned_end_at, "cycle_id?", "accident_id?"]
    output: Inspection
    side_effects: ["status=ASSIGNED"]
  - method: GET
    path: "/msha/inspections/{inspectionId}"
    description: "Get an inspection"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/msha/inspections"
    description: "List/filter inspections (FK reverse reachability for mine_id, cycle_id, inspector_id, accident_id)"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["mine_id?", "cycle_id?", "inspector_id?", "accident_id?", "kind?", "status?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []
  - method: POST
    path: "/msha/inspections/{inspectionId}/file-review"
