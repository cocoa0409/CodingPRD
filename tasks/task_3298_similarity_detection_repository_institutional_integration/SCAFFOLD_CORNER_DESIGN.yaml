            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "opt out body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
