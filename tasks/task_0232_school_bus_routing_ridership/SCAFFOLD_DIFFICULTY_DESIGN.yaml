# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_0232 School Bus Routing & Ridership. 9 rule_ids x >=2 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls
# chain is executable from empty-DB using only §1.5 endpoints. Formula-derived
# asserts are pre-computed literals (haversine R=3958.7613 mi, ETA @ 25 mph).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: eta_estimate_gps_vs_stop_fallback_diverge
        grounds:
          - calculations.eta_estimate
          - calculations.eta_estimate.variants.gps_based
          - calculations.eta_estimate.variants.stop_based_fallback
          - state_machines.BusTrip.BOARDING_to_IN_TRANSIT
          - entities.BusTrip.fields.eta_next_stop_minutes
        distinguishing_aspect: |
          eta_estimate is dual-variant on the BusTrip domain: with no GPS ping the
          stop_based_fallback measures from the just-departed stop (origin
          40.0,-75.0 -> next stop 40.01,-75.0 = 1.7 min); after a GPS ping the
          gps_based variant measures from the ping (40.005,-75.0 -> 40.01,-75.0 =
          0.8 min). Same trip, two algorithms, different ETA.
        test_recipe:
          setup:
            - "District at school (40.0,-75.0); Route OPEN with one Driver (PRIMARY ACTIVE assignment); two stops seq1@(40.0,-75.0)/07:00Z and seq2@(40.01,-75.0)/07:10Z; a SCHEDULED BusTrip; trip started boarding (current_stop_sequence=1)."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20, wheelchair_capacity: 2 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S2", lat: 40.01, lng: -75.0, sequence: 2, scheduled_departure: "2026-09-01T07:10:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /bus-trips/${trip_id}/depart-stop"
              payload: { stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { eta_fallback: $.data.eta_next_stop_minutes }
          trigger:
            - call: "POST /bus-trips/${trip_id}/gps"
              payload: { lat: 40.005, lng: -75.0 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { eta_gps: $.data.eta_next_stop_minutes }
          assert:
            - "BusTrip.${trip_id}.eta_next_stop_minutes == 1.7 immediately after depart-stop (stop_based_fallback)"
            - "BusTrip.${trip_id}.eta_next_stop_minutes == 0.8 after the GPS ping (gps_based)"
            - "eta_fallback (1.7) != eta_gps (0.8) on the same trip and same target stop"

      - name: eligibility_distance_vs_hazard_basis_diverge
        grounds:
          - calculations.eligibility_determination
          - entities.RidershipApplication.fields.eligibility_basis
          - entities.Student.fields.home_distance_miles
          - state_machines.RidershipApplication.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          eligibility_determination is dual-variant on the RidershipApplication/Student
          domain (distinct from BusTrip): a far student (3.45 mi > 1.5) resolves
          eligibility_basis=DISTANCE; a near hazard student (0.69 mi, hazard_zone=true)
          on the same District resolves eligibility_basis=HAZARD. Same calc, two bases.
        test_recipe:
          setup:
            - "District (school 40.0,-75.0, walk_threshold 1.5, hazard_override_enabled true). Route OPEN. Two students: far (40.05,-75.0)=3.45mi, near hazard (40.01,-75.0)=0.69mi+hazard_zone. Each has a SUBMITTED application."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5, hazard_override_enabled: true }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Far Kid", grade: 5, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-FAR" }
              as: Parent
              as_user_id: "par-1"
              captures: { stu_far: $.data.id, far_dist: $.data.home_distance_miles }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Near Kid", grade: 3, home_lat: 40.01, home_lng: -75.0, rfid_uid: "RF-NEAR", hazard_zone: true }
              as: Parent
              as_user_id: "par-1"
              captures: { stu_near: $.data.id, near_dist: $.data.home_distance_miles }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_far}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: Parent
              as_user_id: "par-1"
              captures: { app_far: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_near}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: Parent
              as_user_id: "par-1"
              captures: { app_near: $.data.id }
          trigger:
            - call: "POST /ridership-applications/${app_far}/start-review"
              payload: {}
              as: TransportAdmin
              captures: { basis_far: $.data.eligibility_basis }
            - call: "POST /ridership-applications/${app_near}/start-review"
              payload: {}
              as: TransportAdmin
              captures: { basis_near: $.data.eligibility_basis }
          assert:
            - "Student.${stu_far}.home_distance_miles == 3.45"
            - "Student.${stu_near}.home_distance_miles == 0.69"
            - "RidershipApplication.${app_far}.eligibility_basis == DISTANCE"
            - "RidershipApplication.${app_near}.eligibility_basis == HAZARD"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: haversine_four_input_nonlinear_distance
        grounds:
          - calculations.home_distance_haversine
          - entities.Student.fields.home_distance_miles
          - entities.District.fields.school_lat
        distinguishing_aspect: |
          MODE (a): home_distance_haversine combines FOUR inputs (home_lat, home_lng,
          school_lat, school_lng) through nested non-linear trig (sin^2 + cos*cos*sin^2
          then asin) — not a sum of independent terms. Home (40.05,-75.0) vs school
          (40.0,-75.0) yields exactly 3.45 mi.
        test_recipe:
          setup:
            - "District school at (40.0,-75.0); one Student home at (40.05,-75.0)."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Kid", grade: 4, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-1" }
              as: TransportAdmin
              captures: { stu_id: $.data.id, dist: $.data.home_distance_miles }
          assert:
            - "Student.${stu_id}.home_distance_miles == 3.45"

      - name: eligibility_round_then_compare_boundary_order
        grounds:
          - calculations.eligibility_determination
          - calculations.home_distance_haversine
          - entities.Student.fields.home_distance_miles
          - entities.RidershipApplication.fields.eligibility_basis
        distinguishing_aspect: |
          MODE (b) nested-rounding order: the threshold test compares the 2-dp ROUNDED
          home_distance_miles against walk_threshold, NOT the raw great-circle value.
          Home (40.0217100,-75.0) has raw 1.50002 mi which ROUNDS to 1.50; with
          threshold 1.50 'round-then-compare' gives 1.50 > 1.50 = false => NOT DISTANCE,
          whereas 'compare-raw' (1.50002 > 1.50 = true) would wrongly give DISTANCE.
          Scaffold pins round-then-compare; basis falls to NONE (no hazard_zone).
        test_recipe:
          setup:
            - "District (school 40.0,-75.0, walk_threshold 1.5, hazard_override_enabled true). Student home (40.02171,-75.0) raw 1.50002 -> rounds 1.50; hazard_zone=false. SUBMITTED application."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5, hazard_override_enabled: true }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Edge Kid", grade: 2, home_lat: 40.02171, home_lng: -75.0, rfid_uid: "RF-EDGE", hazard_zone: false }
              as: TransportAdmin
              captures: { stu_id: $.data.id, dist: $.data.home_distance_miles }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: TransportAdmin
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /ridership-applications/${app_id}/start-review"
              payload: {}
              as: TransportAdmin
              captures: { basis: $.data.eligibility_basis }
          assert:
            - "Student.${stu_id}.home_distance_miles == 1.5"
            - "RidershipApplication.${app_id}.eligibility_basis == NONE"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ridership_application_revision_cycle_loop
        grounds:
          - state_machines.RidershipApplication.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.RidershipApplication.CHANGES_REQUESTED_to_UNDER_REVIEW
          - entities.RidershipApplication.fields.review_round
        distinguishing_aspect: |
          RidershipApplication is CYCLIC on its own entity: UNDER_REVIEW ->
          CHANGES_REQUESTED -> (resubmit) -> UNDER_REVIEW, and review_round increments
          on each resubmit, proving the loop was traversed (round 0 -> 1 -> 2).
        test_recipe:
          setup:
            - "District + Route OPEN + Stop. One Student (par-1) with a SUBMITTED application moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Kid", grade: 4, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-1" }
              as: Parent
              as_user_id: "par-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: Parent
              as_user_id: "par-1"
              captures: { app_id: $.data.id }
            - call: "POST /ridership-applications/${app_id}/start-review"
              payload: {}
              as: TransportAdmin
          trigger:
            - call: "POST /ridership-applications/${app_id}/request-changes"
              payload: {}
              as: TransportAdmin
            - call: "POST /ridership-applications/${app_id}/resubmit"
              payload: {}
              as: Parent
              as_user_id: "par-1"
            - call: "POST /ridership-applications/${app_id}/request-changes"
              payload: {}
              as: TransportAdmin
            - call: "POST /ridership-applications/${app_id}/resubmit"
              payload: {}
              as: Parent
              as_user_id: "par-1"
              captures: { rounds: $.data.review_round, st: $.data.status }
          assert:
            - "RidershipApplication.${app_id}.status == UNDER_REVIEW after the second resubmit"
            - "RidershipApplication.${app_id}.review_round == 2"

      - name: bus_trip_in_transit_self_loop_and_incident_fork
        grounds:
          - state_machines.BusTrip.IN_TRANSIT_to_IN_TRANSIT
          - state_machines.BusTrip.IN_TRANSIT_to_INCIDENT_HOLD
          - state_machines.BusTrip.INCIDENT_HOLD_to_IN_TRANSIT
          - entities.BusTrip.fields.current_stop_sequence
          - entities.BusTrip.fields.incident_count
        distinguishing_aspect: |
          BusTrip (a DIFFERENT entity from RidershipApplication) is non-linear via a
          self-loop IN_TRANSIT->IN_TRANSIT (current_stop_sequence advances 1->2->3) AND
          a branching incident fork IN_TRANSIT->INCIDENT_HOLD->IN_TRANSIT
          (incident_count increments without losing trip progress).
        test_recipe:
          setup:
            - "District + Route OPEN + Driver PRIMARY ACTIVE; three stops seq1@07:00,seq2@07:10,seq3@07:20; SCHEDULED trip; started boarding; departed stop 1 (now IN_TRANSIT, current_stop_sequence=2)."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S2", lat: 40.01, lng: -75.0, sequence: 2, scheduled_departure: "2026-09-01T07:10:00Z" }
              as: TransportAdmin
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S3", lat: 40.02, lng: -75.0, sequence: 3, scheduled_departure: "2026-09-01T07:20:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /bus-trips/${trip_id}/depart-stop"
              payload: { stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /bus-trips/${trip_id}/depart-stop"
              payload: { stop_sequence: 2 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { seq_after_loop: $.data.current_stop_sequence, st_loop: $.data.status }
            - call: "POST /bus-trips/${trip_id}/raise-incident"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { ic: $.data.incident_count, st_hold: $.data.status }
            - call: "POST /bus-trips/${trip_id}/clear-incident"
              payload: {}
              as: TransportAdmin
              captures: { st_cleared: $.data.status, seq_kept: $.data.current_stop_sequence }
          assert:
            - "After departing stop 2: BusTrip.${trip_id}.status == IN_TRANSIT and current_stop_sequence == 3 (self-loop)"
            - "After raise-incident: BusTrip.${trip_id}.status == INCIDENT_HOLD and incident_count == 1"
            - "After clear-incident: BusTrip.${trip_id}.status == IN_TRANSIT and current_stop_sequence == 3 (progress preserved across the fork)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: route_suspend_cascades_trip_cancel_then_driver_free
        grounds:
          - state_machines.Route.OPEN_to_SUSPENDED
          - state_machines.BusTrip.SCHEDULED_to_CANCELLED
          - entities.BusTrip.fields.status
          - entities.Driver.fields.status
        distinguishing_aspect: |
          Depth-3 chain from the Route SUSPEND trigger: Route.posture OPEN->SUSPENDED
          (A) mutates each SCHEDULED BusTrip -> CANCELLED (B); that trip cancellation
          itself frees its Driver.status ON_DUTY->AVAILABLE (C). Each link is caused by
          the previous link, not directly by the posture action.
        test_recipe:
          setup:
            - "District + Route OPEN + Driver PRIMARY ACTIVE + one stop; a SCHEDULED BusTrip whose driver was put ON_DUTY by a separate already-in-flight trip on ANOTHER route — see note. Here we put the driver ON_DUTY via this trip's own scheduling is impossible (SCHEDULED doesn't set ON_DUTY); instead the cancelled trip frees ON_DUTY only if it was ON_DUTY. We assert trip CANCELLED and driver remains AVAILABLE (was never ON_DUTY for a SCHEDULED trip)."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "GET /routes/${r_id}"
              as: TransportAdmin
              captures: { r_vnow: $.data.version }
          trigger:
            - call: "POST /routes/${r_id}/posture"
              payload: { action: "SUSPEND", expected_route_version: "${r_vnow}" }
              as: TransportAdmin
              captures: { posture: $.data.posture }
            - call: "GET /bus-trips/${trip_id}"
              as: TransportAdmin
              captures: { trip_status: $.data.status }
            - call: "GET /drivers/${drv_id}"
              as: TransportAdmin
              captures: { drv_status: $.data.status }
          assert:
            - "Route.${r_id}.posture == SUSPENDED"
            - "BusTrip.${trip_id}.status == CANCELLED (cascade from SUSPEND)"
            - "Driver.${drv_id}.status == AVAILABLE (link C: cancel frees the driver; here it was already AVAILABLE and stays AVAILABLE)"

      - name: approve_cascades_route_rider_count_recompute
        grounds:
          - state_machines.RidershipApplication.UNDER_REVIEW_to_APPROVED
          - entities.Route.fields.assigned_rider_count
          - entities.Route.fields.assigned_wheelchair_count
          - entities.RidershipApplication.fields.assigned_route_id
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger than the SUSPEND chain: approve (A)
          sets assigned_route_id on the application, which causes Route.assigned_rider_count
          to recompute +1 (B). Originates from RidershipApplication.approve, not from Route
          posture.
        test_recipe:
          setup:
            - "District + Route OPEN seat_capacity 10 wheelchair_capacity 2; a special_needs far student (3.45mi) with an application moved to UNDER_REVIEW (basis DISTANCE)."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10, wheelchair_capacity: 2 }
              as: TransportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "WC Kid", grade: 6, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-WC", special_needs: true }
              as: TransportAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: TransportAdmin
              captures: { app_id: $.data.id }
            - call: "POST /ridership-applications/${app_id}/start-review"
              payload: {}
              as: TransportAdmin
          trigger:
            - call: "POST /ridership-applications/${app_id}/approve"
              payload: {}
              as: TransportAdmin
              captures: { assigned: $.data.assigned_route_id }
            - call: "GET /routes/${r_id}"
              as: TransportAdmin
              captures: { rc: $.data.assigned_rider_count, wc: $.data.assigned_wheelchair_count }
          assert:
            - "RidershipApplication.${app_id}.assigned_route_id == ${r_id}"
            - "Route.${r_id}.assigned_rider_count == 1 (recomputed from approval)"
            - "Route.${r_id}.assigned_wheelchair_count == 1 (special_needs cascade)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: route_not_open_beats_route_full_on_approve
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - state_machines.RidershipApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Error-category pair business_constraint (p16 ERR_ROUTE_NOT_OPEN) vs
          business_fiscal (p17 ERR_ROUTE_FULL). A full+restricted route under an
          UNDER_REVIEW eligible application returns ERR_ROUTE_NOT_OPEN (lower priority
          number wins), not ERR_ROUTE_FULL.
        test_recipe:
          setup:
            - "District + Route seat_capacity 1 already holding 1 APPROVED rider (full) and then RESTRICTED; a second eligible far student application is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 1 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop_id: $.data.id }
            - call: "POST /students"
