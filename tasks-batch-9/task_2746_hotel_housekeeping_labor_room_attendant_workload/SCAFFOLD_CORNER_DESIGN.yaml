              captures: { skips2: $.data.skips_accrued, points2: $.data.points_accrued, status2: $.data.status }
          assert:
            - "ServiceEnrollment.${enr_id}.points_per_skip == 500 and Room.${room102_id}.service_program == OPT_OUT after creation"
            - "After the first accrual: skips_accrued == 1, points_accrued == 500, status == ACTIVE and Property.${prop_id}.outstanding_incentive_points == 500"
            - "After the second accrual: skips_accrued == 2, points_accrued == 1000 and status == COMPLETED, since skips_accrued == nights"
            - "Property.${prop_id}.outstanding_incentive_points == 1000"
            - "ServiceEnrollment.${enr_id}.version == 3"

      - name: sm_late_laundry_return_defers_deep_cleans_across_entities
        claim_type: cross-entity
        excluded_because:
          difficulty_instance: late_laundry_return_cascades_to_deferred_deep_clean_and_day_ledger
          rationale: "The five-hop LATE_ESCALATED cascade - cycle status, linen shortage_status, DEEP_CLEAN deferral, roster credit recompute and forecast-day ledger recompute - is exactly the transitive_cascade instance already designed there, including the 390-minute turnaround literal."

      - name: sm_inspection_failure_cascades_down_into_a_reclean_row
        claim_type: cascade down
        excluded_because:
          difficulty_instance: failed_inspection_cascades_reclean_probation_and_sampling_obligation
          rationale: "The COMPLETED -> RECLEAN_REQUIRED transition with its generated re-clean assignment, probation flag and raised sampling obligation is covered end-to-end by that transitive_cascade instance."

      - name: sm_laundry_void_reverses_the_dispatch_debit
        claim_type: compensation
        excluded_because:
          difficulty_instance: linen_ledger_three_bucket_identity_restored_by_laundry_void
          rationale: "The void compensation and the on_hand_clean + in_laundry + soiled_queue == total_owned_sets identity are the subject of that compensating_invariant instance, with the (12, 0, 8) -> (12, 8, 0) -> (12, 0, 8) bucket literals."

      - name: sm_enrollment_void_reverses_points_and_room_program
        claim_type: compensation
        excluded_because:
          difficulty_instance: guest_incentive_points_and_room_program_both_reversed_by_enrollment_void
          rationale: "The two-target compensation (Property.outstanding_incentive_points back to 0 and Room.service_program back to DAILY) is already the compensating_invariant instance there."

      - name: sm_denied_claim_returns_the_item_to_stored
        claim_type: cyclic
        excluded_because:
          difficulty_instance: lost_found_claim_denial_reenters_stored_and_permits_second_claim
          rationale: "The STORED -> CLAIM_PENDING -> STORED loop with claim_attempt_count 2 and an intact retention window is precisely that non_linear_state_machine instance."

