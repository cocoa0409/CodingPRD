      - name: submission_approval_requires_active_marks
        grounds:
          - validations.priority_20
          - errors.ERR_MARK_NOT_ACTIVE
          - state_machines.MarkRight.ACTIVE_to_RESTRICTED
          - state_machines.MarkRight.RESTRICTED_to_ACTIVE
          - state_machines.ProductSubmission.IN_REVIEW_to_APPROVED
          - entities.LicenseAgreement.fields.approved_sku_count
        distinguishing_aspect: |
          The submission is in IN_REVIEW, from which APPROVE is a legal transition, but
          approval is gated on the state of every MarkRight in mark_ids. Restricting one
          of the two marks AFTER the submission entered review makes the same APPROVE
          call fail with ERR_MARK_NOT_ACTIVE (409) and leaves approved_sku_count at 0;
          reinstating the mark makes it succeed and the approved_mark_snapshot then lists
          BOTH marks. An implementation that validates marks only at creation time
          approves a design that uses a restricted mark.
