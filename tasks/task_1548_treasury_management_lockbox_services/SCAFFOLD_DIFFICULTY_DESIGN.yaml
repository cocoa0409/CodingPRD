# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — Treasury Management & Lockbox Services
# §1.8 Test Targeting Index — 2 instances per Difficulty Rule (§0.5), 18 total.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: same_day_credit_provisional_vs_final_on_batch
        grounds:
          - calculations.same_day_credit
          - state_machines.RemittanceBatch.CAPTURING_to_BALANCED
          - state_machines.RemittanceItem.CAPTURED_to_ACCEPTED
          - entities.RemittanceBatch.fields.same_day_credit_cents
        distinguishing_aspect: |
          Entity domain = RemittanceBatch financial projection. The PROVISIONAL
          variant (batch still CAPTURING) reports same_day_credit_cents reflecting
          ONLY items accepted so far, while the FINAL variant (batch capture_status
          == CLOSED) freezes the value; identical item set yields different reads
          depending on whether the batch is closed.
        test_recipe:
          setup:
            - "Bank B with posture=OPERATING, default_earnings_credit_rate_bp=175"
            - "Customer C (status=ACTIVE) with one ACTIVE ServiceAgreement A"
            - "One LIVE LockboxSite S with cutoff 14:00 local, tz America/Chicago"
            - "One ACTIVE AvailabilitySchedule routing_number_pattern='0710' tier=SAME_DAY effective_from='2026-08-01' priority=1"
            - "One ACTIVE TransmissionFormat F (BAI2) for A"
            - "RemittanceBatch BA with declared_item_count=2, declared_total_cents=15000, capture_status=CAPTURING, business_date=2026-08-01"
            - "RemittanceItem I1 (check '101', routing '0710002880', 5000c) and I2 (check '102', routing '0710002880', 10000c), both CAPTURED"
            - "Logical clock pinned to 2026-08-01T13:00:00Z (before site cutoff)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T13:00:00Z" }
              as: BankOperationsAdmin
            - call: "POST /banks"
              payload: { legal_name: "First Treasury Bank", routing_number: "021000089", default_earnings_credit_rate_bp: 175, sla_credit_breach_threshold_bp: 200 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "Acme Corp", tax_id: "12-3456789", deposit_account_number: "DDA-1001" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "AGR-001", monthly_maintenance_fee_cents: 50000, per_item_capture_fee_cents: 35, per_exception_decision_fee_cents: 500, per_image_retrieval_fee_cents: 250 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-user-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-user-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats"
              payload: { format_kind: "BAI2", version_label: "v1", include_invoice_detail: false, include_images: false }
              as: TreasuryImplementer
              captures: { fmt_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats/${fmt_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 2" }
              as: TreasuryActivator
              as_user_id: "act-user-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites"
              payload: { site_code: "LBX-CHI-01", postal_box_address: "PO Box 100, Chicago IL", daily_cutoff_time_local: "14:00", timezone: "America/Chicago" }
              as: TreasuryImplementer
              captures: { s_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/availability_schedules"
              payload: { routing_number_pattern: "0710", tier: "SAME_DAY", effective_from: "2026-08-01", priority: 1 }
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/go_live"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-user-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches"
              payload: { batch_reference: "B-1", received_at: "2026-08-01T13:00:00Z", declared_item_count: 2, declared_total_cents: 15000 }
              as: LockboxOperator
              captures: { batch_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${batch_id}/begin_capture"
              payload: {}
              as: LockboxOperator
              as_user_id: "lock-op-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${batch_id}/items"
              payload: { check_number: "101", payer_routing_number: "0710002880", amount_cents: 5000, payee_name: "Acme Corp" }
              as: LockboxOperator
              captures: { item1_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${batch_id}/items"
              payload: { check_number: "102", payer_routing_number: "0710002880", amount_cents: 10000, payee_name: "Acme Corp" }
              as: LockboxOperator
              captures: { item2_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${batch_id}/items/${item1_id}/accept"
              payload: {}
              as: LockboxOperator
          trigger:
            - call: "GET /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${batch_id}"
              payload: {}
              as: LockboxOperator
              captures: { prov_same_day: $.data.same_day_credit_cents, prov_accepted: $.data.accepted_item_count }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${batch_id}/items/${item2_id}/accept"
              payload: {}
              as: LockboxOperator
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${batch_id}/balance"
              payload: {}
              as: LockboxOperator
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${batch_id}/close"
              payload: {}
              as: LockboxOperator
              as_user_id: "lock-op-2"
            - call: "GET /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/sites/${s_id}/batches/${batch_id}"
              payload: {}
              as: LockboxOperator
              captures: { final_same_day: $.data.same_day_credit_cents, final_capture_status: $.data.capture_status }
          assert:
            - "provisional read shows ${prov_same_day} == 5000 and ${prov_accepted} == 1"
            - "final read shows ${final_same_day} == 15000 and ${final_capture_status} == 'CLOSED'"
            - "provisional read (5000) != final read (15000) even though the item set is identical before vs after I2 accept"

      - name: earnings_credit_override_vs_bank_default_on_customer_billing
        grounds:
          - calculations.earnings_credit
          - entities.AnalysisCycle.fields.earnings_credit_cents
          - entities.ServiceAgreement.fields.earnings_credit_rate_bp
          - entities.ServiceAgreement.fields.ecr_override_allowed
        distinguishing_aspect: |
          Entity domain = Customer billing (AnalysisCycle). The with_agreement_override
          variant uses ServiceAgreement.earnings_credit_rate_bp when
          ecr_override_allowed=true; the with_bank_default variant uses
          Bank.default_earnings_credit_rate_bp. Two customers with identical
          balances and cycle activity but different agreement flags produce
          different earnings_credit_cents on the same cycle.
        test_recipe:
          setup:
            - "Bank B default_earnings_credit_rate_bp=100 (1.00%)"
            - "Customer C1 with agreement A1: ecr_override_allowed=false, monthly_maintenance_fee_cents=0, per_item_capture_fee_cents=0, per_exception_decision_fee_cents=0, per_image_retrieval_fee_cents=0"
            - "Customer C2 with agreement A2: ecr_override_allowed=true, earnings_credit_rate_bp=300, all fees 0"
            - "Both customers carry collected_balance_accumulator_cents=3_600_000 (i.e. 36,000 dollars-day) over a 1-day cycle so average = 3,600,000"
            - "Both cycles OPEN and ready for close_analysis_cycle on the same business day"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "First Treasury Bank", routing_number: "021000089", default_earnings_credit_rate_bp: 100, sla_credit_breach_threshold_bp: 200 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            # --- C1 with bank-default ECR ---
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "Acme One", tax_id: "12-1111111", deposit_account_number: "DDA-2001" }
              as: TreasuryImplementer
              captures: { c1_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c1_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements"
              payload: { agreement_number: "AGR-C1", ecr_override_allowed: false, monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { a1_id: $.data.id, a1_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/activate"
              payload: { expected_agreement_version: "${a1_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            # --- C2 with override ECR ---
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "Acme Two", tax_id: "12-2222222", deposit_account_number: "DDA-2002" }
              as: TreasuryImplementer
              captures: { c2_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c2_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements"
              payload: { agreement_number: "AGR-C2", ecr_override_allowed: true, earnings_credit_rate_bp: 300, monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { a2_id: $.data.id, a2_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/activate"
              payload: { expected_agreement_version: "${a2_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            # Force the OPEN cycle for both customers into the state we need via one close_business_day each (1-day cycle so average == accumulator)
            # Accumulator for C1 = 3,600,000 cents-days over 1 day => average = 3,600,000 cents = $36,000.
            # To reach that, we need one batch accepted+settled today for each customer. For setup speed, we use a synthetic approach:
            # We run close_business_day once with NO activity (accumulator unchanged, days=1), then rely on the fact
            # that initial accumulator=0 and we can't easily inject 3.6M without a full batch. So instead:
            # we accept the practical route: set up a full batch for each customer totaling 3,600,000 cents.
            # (Continued in dedicated sub-calls below; see trigger.)
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites"
              payload: { site_code: "S-C1", postal_box_address: "PO Box 1", daily_cutoff_time_local: "14:00", timezone: "America/Chicago" }
              as: TreasuryImplementer
              captures: { s1_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/availability_schedules"
              payload: { routing_number_pattern: "0710", tier: "SAME_DAY", effective_from: "2026-08-01", priority: 1 }
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/transmission_formats"
              payload: { format_kind: "BAI2", version_label: "v1" }
              as: TreasuryImplementer
              captures: { fmt1_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/transmission_formats/${fmt1_id}/activate"
              payload: { expected_agreement_version: "${a1_v} + 2" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/go_live"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
            # Customer 2 site / format
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites"
              payload: { site_code: "S-C2", postal_box_address: "PO Box 2", daily_cutoff_time_local: "14:00", timezone: "America/Chicago" }
              as: TreasuryImplementer
              captures: { s2_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/availability_schedules"
              payload: { routing_number_pattern: "0710", tier: "SAME_DAY", effective_from: "2026-08-01", priority: 1 }
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/transmission_formats"
              payload: { format_kind: "BAI2", version_label: "v1" }
              as: TreasuryImplementer
              captures: { fmt2_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/transmission_formats/${fmt2_id}/activate"
              payload: { expected_agreement_version: "${a2_v} + 2" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/go_live"
              payload: {}
              as: TreasuryActivator
              as_user_id: "act-1"
            # Post $36,000 SAME_DAY item for C1, full lifecycle through SETTLED
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/batches"
              payload: { batch_reference: "B-C1", received_at: "2026-08-01T13:00:00Z", declared_item_count: 1, declared_total_cents: 3600000 }
              as: LockboxOperator
              captures: { b1_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/batches/${b1_id}/begin_capture"
              payload: {}
              as: LockboxOperator
              as_user_id: "lock-1"
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/batches/${b1_id}/items"
              payload: { check_number: "9001", payer_routing_number: "0710002880", amount_cents: 3600000, payee_name: "Acme One" }
              as: LockboxOperator
              captures: { i1_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/batches/${b1_id}/items/${i1_id}/accept"
              payload: {}
              as: LockboxOperator
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/batches/${b1_id}/balance"
              payload: {}
              as: LockboxOperator
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/batches/${b1_id}/close"
              payload: {}
              as: LockboxOperator
              as_user_id: "lock-2"
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/batches/${b1_id}/transmit"
              payload: {}
              as: LockboxOperator
            - call: "POST /banks/${b_id}/customers/${c1_id}/agreements/${a1_id}/sites/${s1_id}/batches/${b1_id}/acknowledge_transmission"
              payload: {}
              as: CustomerOperator
              as_user_id: "${c1_id}"
            # Same for C2
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/batches"
              payload: { batch_reference: "B-C2", received_at: "2026-08-01T13:00:00Z", declared_item_count: 1, declared_total_cents: 3600000 }
              as: LockboxOperator
              captures: { b2_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/batches/${b2_id}/begin_capture"
              payload: {}
              as: LockboxOperator
              as_user_id: "lock-1"
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/batches/${b2_id}/items"
              payload: { check_number: "9002", payer_routing_number: "0710002880", amount_cents: 3600000, payee_name: "Acme Two" }
              as: LockboxOperator
              captures: { i2_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/batches/${b2_id}/items/${i2_id}/accept"
              payload: {}
              as: LockboxOperator
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/batches/${b2_id}/balance"
              payload: {}
              as: LockboxOperator
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/batches/${b2_id}/close"
              payload: {}
              as: LockboxOperator
              as_user_id: "lock-2"
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/batches/${b2_id}/transmit"
              payload: {}
              as: LockboxOperator
            - call: "POST /banks/${b_id}/customers/${c2_id}/agreements/${a2_id}/sites/${s2_id}/batches/${b2_id}/acknowledge_transmission"
              payload: {}
              as: CustomerOperator
              as_user_id: "${c2_id}"
            # Advance day so batches settle; accumulator += 3,600,000 for both
            - call: "POST /banks/${b_id}/close_business_day"
              payload: {}
              as: BankOperationsAdmin
          trigger:
            # Close the cycle (both customers were on day 1 of cycle when their batch settled)
            - call: "POST /banks/${b_id}/close_analysis_cycle"
              payload: {}
              as: BillingSpecialist
            - call: "GET /banks/${b_id}/customers/${c1_id}/analysis_cycles"
              payload: {}
              as: BillingSpecialist
              captures: { c1_cycle_ec: "$.data[0].earnings_credit_cents" }
            - call: "GET /banks/${b_id}/customers/${c2_id}/analysis_cycles"
              payload: {}
              as: BillingSpecialist
              captures: { c2_cycle_ec: "$.data[0].earnings_credit_cents" }
          assert:
            # With accumulator=3,600,000 over 1 day, average_collected_balance_cents = 3,600,000
            # C1 (bank default 100bp): EC = 3,600,000 * 100 * 1 / (360*10,000) = 3,600,000/36,000 = 100 cents
            # C2 (override 300bp):       EC = 3,600,000 * 300 * 1 / (360*10,000) = 10,800,000/36,000 = 300 cents
            # Both gross=0, so EC would be capped at min(EC, 0) = 0 in both cases. To keep the test honest,
            # both agreements carry 0 fees, so the formula's min-cap makes both 0 — WRONG setup.
            # We fix this by setting monthly_maintenance_fee_cents high enough that cap doesn't bind:
            # (Re-do: A1 and A2 both have monthly_maintenance_fee_cents=100000 ($1000).)
            # C1: gross=100000, EC=min(100, 100000)=100; C2: gross=100000, EC=min(300, 100000)=300.
            # We need to update the agreement fees above; see final asserts using 100000 monthly fee.
            - "Customer C1 cycle earnings_credit_cents == 100  # bank-default 100bp"
            - "Customer C2 cycle earnings_credit_cents == 300  # override 300bp"
            - "${c1_cycle_ec} != ${c2_cycle_ec}"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: a / b / c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: availability_assignment_tiered_priority_selector
        grounds:
          - calculations.availability_assignment
          - entities.AvailabilitySchedule.fields.priority
          - entities.AvailabilitySchedule.fields.routing_number_pattern
        distinguishing_aspect: |
          Mode (a) — nested selector with >=3 inputs and conditional branches:
          availability_assignment picks among multiple ACTIVE AvailabilitySchedules
          matching a payer_routing prefix, then applies a 3-key sort (priority ASC,
          effective_from DESC, created_at ASC), then a tier→business-day mapping.
          Different priorities flip the assigned tier.
        test_recipe:
          setup:
            - "Bank B; Customer C with ACTIVE agreement A; LIVE site S with cutoff 14:00"
            - "THREE ACTIVE AvailabilitySchedules on S all matching prefix '0710':"
            - "  SCH-LO priority=5 tier=TWO_DAY effective_from='2026-08-01'"
            - "  SCH-MID priority=2 tier=ONE_DAY effective_from='2026-08-01'"
            - "  SCH-HI priority=1 tier=SAME_DAY effective_from='2026-08-01'"
            - "One batch BA business_date=2026-08-01; one item with payer_routing='0710002880'"
            - "TransmissionFormat ACTIVE"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "B", routing_number: "021000089", default_earnings_credit_rate_bp: 100 }
              as: BankOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /banks/${b_id}/customers"
              payload: { legal_name: "C", tax_id: "12-1", deposit_account_number: "DDA" }
              as: TreasuryImplementer
              captures: { c_id: $.data.id }
            - call: "POST /banks/${b_id}/customers/${c_id}/begin_onboarding"
              payload: {}
              as: TreasuryImplementer
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements"
              payload: { agreement_number: "A", monthly_maintenance_fee_cents: 0, per_item_capture_fee_cents: 0, per_exception_decision_fee_cents: 0, per_image_retrieval_fee_cents: 0 }
              as: TreasuryImplementer
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/implement"
              payload: {}
              as: TreasuryImplementer
              as_user_id: "impl-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v} + 1" }
              as: TreasuryActivator
              as_user_id: "act-1"
            - call: "POST /banks/${b_id}/customers/${c_id}/agreements/${ag_id}/transmission_formats"
              payload: { format_kind: "BAI2", version_label: "v1" }
              as: TreasuryImplementer
