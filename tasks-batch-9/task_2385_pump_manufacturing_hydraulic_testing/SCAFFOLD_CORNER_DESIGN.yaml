  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_duty_application_version_on_selection_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[selection-create-stale-duty]
          - validations[priority=10]
          - errors[ERR_STALE_DUTY_APPLICATION_VERSION]
          - endpoints["POST /selections"]
        distinguishing_aspect: |
          The first selection bumps the parent DutyApplication to version 2, so a second engineer still
          holding version 1 must be refused with 412 and the fresh version must then succeed - the guard
          is the parent's version, not the child's, and a lost update would otherwise silently overwrite a
          concurrently proposed duty point.
        test_recipe:
          setup:
            - "DutyApplication APP-1001 was created at version 1 and one Selection already exists against it, so its version is now 2."
            - "The duty application is still OPEN because nothing has been approved."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
