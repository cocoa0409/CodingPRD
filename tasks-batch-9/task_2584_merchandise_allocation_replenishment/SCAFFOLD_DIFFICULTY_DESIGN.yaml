            - call: "POST /allocation/stores/${s1_id}/status"
              payload: { target_status: "ACTIVE" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/transfer-recommendations/${t1_id}/dispatch"
              payload: {}
