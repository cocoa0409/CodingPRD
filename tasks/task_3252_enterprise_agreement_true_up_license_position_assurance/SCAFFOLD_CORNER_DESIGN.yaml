        claim_type: rbac_denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails priority 1 with ERR_UNAUTHENTICATED (401) before any other check."
