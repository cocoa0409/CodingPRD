# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — corporate-travel-tmc
# 9 Difficulty Rules x 2 instances = 18 instances.
# All grounds resolve to SCAFFOLD.yaml §1.1–§1.7; all chains are empty-DB reachable.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trip_estimate_vs_actual_cost_diverges
        grounds:
          - calculations.estimate_provisional_cost
          - calculations.actual_cost_final
          - entities.TripRequest.fields.estimated_cost_cents
          - entities.TripRequest.fields.actual_cost_cents
        distinguishing_aspect: |
          Same TripRequest: provisional estimate (forward-looking cheapest negotiated fare = 250000)
          differs from final actual cost (chronological sum of what was booked = 300000, booked without the rate).
        test_recipe:
          setup:
            - "Policy (manager>=100000, exec>=500000); traveler T (STANDARD); approver M (MANAGER); vendor V (AIR); ACTIVE rate JFK->LHR neg 250000 market 400000 cap 5."
            - "Trip JFK->LHR submitted -> estimate 250000 -> MANAGER -> approved. One AIR booking made WITHOUT the rate at fare 300000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T One", email: "t1@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "M Mgr", email: "m1@ex.com", grade: "MANAGER", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { appr: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/negotiated-rates"
              payload: { vendor_id: "${ven}", rate_code: "R1", origin: "JFK", destination: "LHR", negotiated_fare_cents: 250000, market_fare_cents: 400000, cap_usage_count: 5, valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }
              as: TravelManager
              captures: { rate: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 420000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
            - call: "POST /tmc/trip-requests/${trip}/approve"
              payload: {}
              as: Approver
              as_user_id: "${appr}"
              captures: { tr_v: $.data.version }
          trigger:
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "REFUNDABLE", fare_cents: 300000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book1: $.data.id }
          assert:
            - "TripRequest.${trip}.estimated_cost_cents == 250000"
            - "TripRequest.${trip}.actual_cost_cents == 300000"
            - "TripRequest.${trip}.estimated_cost_cents != TripRequest.${trip}.actual_cost_cents"

      - name: vendor_realized_vs_potential_savings_diverges
        grounds:
          - calculations.realized_vs_potential_savings
          - entities.NegotiatedRate.fields.market_fare_cents
          - endpoints.GET./tmc/vendors/{id}/savings-report
        distinguishing_aspect: |
          Vendor savings report: realized (rate-consuming bookings only = 150000) differs from
          potential (all vendor bookings had they used the best rate = 300000).
        test_recipe:
          setup:
            - "Vendor V with rate JFK->LHR neg 250000 market 400000 cap 5. Trip approved. Two AIR bookings on V (non-overlapping dates): booking A uses the rate (fare 250000), booking B does not (fare 300000)."
          setup_api_calls:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T One", email: "t2@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "M Mgr", email: "m2@ex.com", grade: "MANAGER", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { appr: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/negotiated-rates"
              payload: { vendor_id: "${ven}", rate_code: "R1", origin: "JFK", destination: "LHR", negotiated_fare_cents: 250000, market_fare_cents: 400000, cap_usage_count: 5, valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }
              as: TravelManager
              captures: { rate: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-20T09:00:00Z", purpose: "biz", market_estimate_cents: 420000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
            - call: "POST /tmc/trip-requests/${trip}/approve"
              payload: {}
              as: Approver
              as_user_id: "${appr}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", negotiated_rate_id: "${rate}", segment_type: "AIR", fare_basis: "REFUNDABLE", fare_cents: 250000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { bookA: $.data.id }
            - call: "GET /tmc/trip-requests/${trip}"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v2: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "REFUNDABLE", fare_cents: 300000, depart_datetime: "2026-08-10T09:00:00Z", return_datetime: "2026-08-10T20:00:00Z", expected_trip_request_version: "${tr_v2}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { bookB: $.data.id }
          trigger:
            - call: "GET /tmc/vendors/${ven}/savings-report"
              payload: {}
              as: TravelManager
              captures: { realized: $.data.realized_savings_cents, potential: $.data.potential_savings_cents, bc: $.data.booked_count }
          assert:
            - "realized_savings_cents == 150000"
            - "potential_savings_cents == 300000"
            - "booked_count == 2"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: exchange_settlement_downgrade_residual_credit
        grounds:
          - calculations.exchange_settlement
          - entities.Booking.fields.exchange_fee_cents
          - state_machines.Booking.TICKETED_to_EXCHANGED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (old fare 250000, new fare 200000, penalty 15000) with nested max/conditional ->
          residual credit = max(0, 250000-200000-15000) = 35000; new booking fare 200000, exchange_fee 15000.
        test_recipe:
          setup:
            - "Policy penalty 15000. Trip approved. One AIR NONREFUNDABLE booking at fare 250000 (TICKETED, trip BOOKED). Clock 2026-07-01, depart 2026-08-01 (exchange allowed before departure)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T One", email: "t3@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "M Mgr", email: "m3@ex.com", grade: "MANAGER", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { appr: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/negotiated-rates"
              payload: { vendor_id: "${ven}", rate_code: "R1", origin: "JFK", destination: "LHR", negotiated_fare_cents: 250000, market_fare_cents: 400000, cap_usage_count: 5, valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }
              as: TravelManager
              captures: { rate: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 420000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
            - call: "POST /tmc/trip-requests/${trip}/approve"
              payload: {}
              as: Approver
              as_user_id: "${appr}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", negotiated_rate_id: "${rate}", segment_type: "AIR", fare_basis: "NONREFUNDABLE", fare_cents: 250000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book1: $.data.id }
          trigger:
            - call: "POST /tmc/bookings/${book1}/exchange"
              payload: { new_fare_cents: 200000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book2: $.data.id, fee: $.data.exchange_fee_cents }
          assert:
            - "Booking.${book2}.fare_cents == 200000"
            - "Booking.${book2}.exchange_fee_cents == 15000"
            - "Booking.${book1}.status == EXCHANGED"
            - "UnusedTicketCredit(origin_booking_id=${book1}).residual_value_cents == 35000"

      - name: invoice_reconciliation_per_line_rounding_order
        grounds:
          - calculations.invoice_reconciliation
          - entities.Invoice.fields.reconciled_total_cents
          - state_machines.Invoice.RECEIVED_to_RECONCILED
        distinguishing_aspect: |
          Mode (b): pinned round-per-line-then-sum. Two lines matched 300 each: round(300*0.035)=round(10.5)=11 each ->
          reconciled_total = (300+11)+(300+11) = 622, NOT the sum-then-round 621.
        test_recipe:
          setup:
            - "Trip approved; two AIR NONREFUNDABLE bookings (non-overlapping) fare 300 each. Finance creates an Invoice with two lines billed 300 each, invoiced_total 622."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T One", email: "t4@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-20T09:00:00Z", purpose: "biz", market_estimate_cents: 50000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "NONREFUNDABLE", fare_cents: 300, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { bookA: $.data.id }
            - call: "GET /tmc/trip-requests/${trip}"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v2: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "NONREFUNDABLE", fare_cents: 300, depart_datetime: "2026-08-10T09:00:00Z", return_datetime: "2026-08-10T20:00:00Z", expected_trip_request_version: "${tr_v2}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { bookB: $.data.id }
            - call: "POST /tmc/invoices"
              payload: { vendor_id: "${ven}", billing_period: "2026-08", invoiced_total_cents: 622, lines: [ { booking_id: "${bookA}", billed_amount_cents: 300 }, { booking_id: "${bookB}", billed_amount_cents: 300 } ] }
              as: FinanceOfficer
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /tmc/invoices/${inv}/reconcile"
              payload: {}
              as: FinanceOfficer
              captures: { st: $.data.status, rt: $.data.reconciled_total_cents, var: $.data.variance_cents }
          assert:
            - "Invoice.${inv}.reconciled_total_cents == 622"
            - "Invoice.${inv}.variance_cents == 0"
            - "Invoice.${inv}.status == RECONCILED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trip_request_reject_revision_loop_cycle
        grounds:
          - state_machines.TripRequest.PENDING_MANAGER_to_DRAFT
          - state_machines.TripRequest.DRAFT_to_PENDING_MANAGER
        distinguishing_aspect: |
          TripRequest is cyclic: PENDING_MANAGER --reject--> DRAFT --submit--> PENDING_MANAGER again
          (a revision loop, not a linear pipeline).
        test_recipe:
          setup:
            - "Traveler T (STANDARD), approver M (MANAGER). Trip with no matching rate and market_estimate 200000 -> approval MANAGER -> submitted to PENDING_MANAGER."
          setup_api_calls:
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T One", email: "t5@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "M Mgr", email: "m5@ex.com", grade: "MANAGER", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { appr: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 200000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
          trigger:
            - call: "POST /tmc/trip-requests/${trip}/reject"
              payload: { reason: "adjust dates" }
              as: Approver
              as_user_id: "${appr}"
              captures: { st_after_reject: $.data.status }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { st_after_resubmit: $.data.status }
          assert:
            - "st_after_reject == DRAFT"
            - "st_after_resubmit == PENDING_MANAGER"

      - name: negotiated_rate_exhaust_then_reactivate_cycle
        grounds:
          - state_machines.NegotiatedRate.ACTIVE_to_EXHAUSTED
          - state_machines.NegotiatedRate.EXHAUSTED_to_ACTIVE
          - calculations.rate_usage_consumption
        distinguishing_aspect: |
          NegotiatedRate is cyclic on a different entity: ACTIVE --consume to cap--> EXHAUSTED
          --cancel booking--> ACTIVE. cap_usage_count=1 so one booking exhausts, its cancel reactivates.
        test_recipe:
          setup:
            - "Rate cap_usage_count=1. Trip approved. One AIR NONREFUNDABLE booking consumes the rate -> EXHAUSTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T One", email: "t6@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "M Mgr", email: "m6@ex.com", grade: "MANAGER", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { appr: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/negotiated-rates"
              payload: { vendor_id: "${ven}", rate_code: "R1", origin: "JFK", destination: "LHR", negotiated_fare_cents: 250000, market_fare_cents: 400000, cap_usage_count: 1, valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }
              as: TravelManager
              captures: { rate: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-05T09:00:00Z", purpose: "biz", market_estimate_cents: 420000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
            - call: "POST /tmc/trip-requests/${trip}/approve"
              payload: {}
              as: Approver
              as_user_id: "${appr}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", negotiated_rate_id: "${rate}", segment_type: "AIR", fare_basis: "NONREFUNDABLE", fare_cents: 250000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book1: $.data.id }
          trigger:
            - call: "POST /tmc/bookings/${book1}/cancel"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
          assert:
            - "NegotiatedRate.${rate}.status == ACTIVE"
            - "NegotiatedRate.${rate}.consumed_count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: trip_cancel_three_hop_cascade
        grounds:
          - state_machines.TripRequest.BOOKED_to_CANCELLED
          - state_machines.Booking.TICKETED_to_CANCELLED
          - state_machines.NegotiatedRate.EXHAUSTED_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 chain from TripRequest cancel: trip->CANCELLED (hop1) causes booking->CANCELLED + credit +
          rate decrement (hop2), which causes rate EXHAUSTED->ACTIVE (hop3). Trigger = trip cancel.
        test_recipe:
          setup:
            - "Rate cap 1. Trip approved; one AIR NONREFUNDABLE booking consumes rate -> rate EXHAUSTED, trip BOOKED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
