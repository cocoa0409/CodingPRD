          trigger:
            - { call: "POST /survey/survey-cycles/${cyc}/advance", payload: { action: COMPUTE_ESTIMATES }, as: EstimationAnalyst }
            - { call: "GET /survey/cell-estimates", payload: { cycle_id: "${cyc}", industry_code: RETAIL, size_class: SMALL }, as: EstimationAnalyst, captures: { rs_val: "$.data[0].employment_estimate", rs_supp: "$.data[0].suppression_status", rs_n: "$.data[0].respondent_count" } }
            - { call: "GET /survey/cell-estimates", payload: { cycle_id: "${cyc}", industry_code: RETAIL, size_class: MEDIUM }, as: EstimationAnalyst, captures: { rm_val: "$.data[0].employment_estimate", rm_supp: "$.data[0].suppression_status" } }
            - { call: "GET /survey/cell-estimates", payload: { cycle_id: "${cyc}", industry_code: MANUFACTURING, size_class: SMALL }, as: EstimationAnalyst, captures: { ms_val: "$.data[0].employment_estimate", ms_supp: "$.data[0].suppression_status" } }
            - { call: "GET /survey/cell-estimates", payload: { cycle_id: "${cyc}", industry_code: MANUFACTURING, size_class: MEDIUM }, as: EstimationAnalyst, captures: { mm_val: "$.data[0].employment_estimate", mm_supp: "$.data[0].suppression_status" } }
