          - errors[ERR_NO_SLOT_AVAILABLE]
        distinguishing_aspect: "On a 5-slot cycle reserving 1 detained slot, the fourth general acceptance drives utilization_ratio to exactly 0.8000 — RESTRICTED at the inclusive boundary — and the fifth general acceptance must fail with ERR_NO_SLOT_AVAILABLE even though available_slot_count is still 1, because general_pool_free subtracts the reserved block. A detained acceptance then drains that reserved slot, taking utilization to 1.0000 / FROZEN."
