# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3095_loss_history_reporting_underwriting_exchange_contribution
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# covers appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: carrier_create_returns_declared_fields_and_starts_provisional
        claim_type: Creation
        grounds:
          - entities.Carrier
          - endpoints.POST_/carriers
        distinguishing_aspect: "A carrier created with legal_name and naic_code comes back 201 with status PROVISIONAL, accepted_batch_count 0, accepted_claim_count 0, version 1 — status and counters are system-managed, never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z (set explicitly). Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_carrier_x
              call: "POST /carriers"
              payload: { legal_name: "Trinity Specialty", naic_code: "90001" }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Carrier.${cx_id}.legal_name == \"Trinity Specialty\" and naic_code == \"90001\""
            - "Carrier.${cx_id}.status == PROVISIONAL and version == 1"
            - "Carrier.${cx_id}.accepted_batch_count == 0 and accepted_claim_count == 0"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: consumer_create_stores_file_unfrozen
        claim_type: Creation
        grounds:
          - entities.Consumer
          - endpoints.POST_/consumers
        distinguishing_aspect: "A consumer registered with all four identifiers starts with file_frozen false and frozen_until null; both fields are source system and any client-supplied value is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - &k_consumer_x
              call: "POST /consumers"
              payload: { full_name: "Victor Voss", date_of_birth: "1990-07-07", address_line: "1 Verbena St, Austin TX", driver_license_number: "VIC-1" }
              as: PlatformAdmin
              captures: { vx_id: $.data.id, vx_v: $.data.version }
          assert:
            - "the response status is 201"
            - "Consumer.${vx_id}.file_frozen == false and frozen_until is null"
            - "Consumer.${vx_id}.version == 1"

      - name: carrier_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/carriers/{carrierId}
          - errors.ERR_NOT_FOUND
          - validations.priority_3_existence
        distinguishing_aspect: "A syntactically valid but unallocated UUID in the carrier path segment returns 404 ERR_NOT_FOUND from priority-3 existence, not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /carriers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ExchangeComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: batch_create_missing_claims_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/carriers/{carrierId}/batches
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "claims is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check, distinct from the 422 ERR_BATCH_CONSTRAINT an empty-but-present array produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ExchangeRule initialized. One carrier."
          setup_api_calls:
            - *k_clock
            - &k_rules
              call: "POST /exchange-rules"
              payload: {}
              as: PlatformAdmin
            - *k_carrier_x
          trigger:
            - call: "POST /carriers/${cx_id}/batches"
              payload: {}
              as: CarrierDataSteward
              as_user_id: "${cx_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_BATCH_CONSTRAINT"
            - "GET /carriers/${cx_id}/batches returns 0 rows"

      - name: consumer_file_disclosure_lists_claims_disputes_and_notices
        claim_type: Computed Fields
        grounds:
          - endpoints.GET_/consumers/{consumerId}/file
          - entities.Consumer.fields.file_frozen
        distinguishing_aspect: "The file-disclosure read composes the consumer record with their claims, disputes, and adverse-action notices in one response; a frozen file flips the same read to 409 ERR_CONSUMER_FILE_FROZEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier W ACTIVE with one claim for consumer Wynn; one inquiry issued a report and a DRAFT notice was filed."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_w
              call: "POST /carriers"
              payload: { legal_name: "Wellspring Mutual", naic_code: "90002" }
              as: PlatformAdmin
              captures: { cw_id: $.data.id }
            - &k_consumer_w
              call: "POST /consumers"
              payload: { full_name: "Wynn Wade", date_of_birth: "1985-10-10", address_line: "4 Wisteria Way, Frisco TX", driver_license_number: "WYNN-1" }
              as: PlatformAdmin
              captures: { cw_cons: $.data.id, cw_cons_v: $.data.version }
            - call: "POST /carriers/${cw_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cw_cons}", policy_number: "PW-1", claim_number: "W-001", loss_date: "2025-03-03", loss_type: "COLLISION", cause_of_loss_code: "CW1", paid_amount_cents: 30000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cw_id}"
            - call: "POST /carriers/${cw_id}/inquiries"
              payload: { subject_name: "Wynn Wade", subject_dob: "1985-10-10", subject_address: "4 Wisteria Way, Frisco TX", subject_driver_license: "WYNN-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${cw_id}"
              captures: { rep_w: $.data.report_id }
            - call: "POST /carriers/${cw_id}/adverse-action-notices"
              payload: { report_id: "${rep_w}", action_type: "RATE_INCREASE", notice_reason_codes: ["LOSS-FREQ"], report_influence_rank: 2 }
              as: CarrierUnderwriter
              as_user_id: "${cw_id}"
          trigger:
            - call: "GET /consumers/${cw_cons}/file"
              payload: {}
              as: Consumer
              as_user_id: "${cw_cons}"
          assert:
            - "the response status is 200"
            - "data.consumer.id == ${cw_cons}"
            - "data.claims has exactly 1 row (claim_number W-001)"
            - "data.disputes has 0 rows"
            - "data.adverse_action_notices has exactly 1 row with report_id == ${rep_w}"

      - name: report_claim_entry_is_immutable_snapshot_with_common_fields_false
        claim_type: Immutability
        grounds:
          - entities.ReportClaimEntry
        distinguishing_aspect: "ReportClaimEntry has common_fields false — it carries id and created_at but no version and no updated_at, and no endpoint mutates it; a later amendment to the underlying LossClaim leaves the snapshot's paid_amount_cents untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier X ACTIVE; consumer Xena with 1 claim of 50000 cents; report issued."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_xn
              call: "POST /carriers"
              payload: { legal_name: "Xenia Assurance", naic_code: "90003" }
              as: PlatformAdmin
              captures: { cxn_id: $.data.id }
            - &k_consumer_xn
              call: "POST /consumers"
              payload: { full_name: "Xena Xavier", date_of_birth: "1993-01-19", address_line: "9 Xanthus Xing, Plano TX", driver_license_number: "XENA-1" }
              as: PlatformAdmin
              captures: { cxn_cons: $.data.id }
            - call: "POST /carriers/${cxn_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cxn_cons}", policy_number: "PX-1", claim_number: "X-001", loss_date: "2025-02-02", loss_type: "PROPERTY", cause_of_loss_code: "XP1", paid_amount_cents: 50000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cxn_id}"
            - call: "POST /carriers/${cxn_id}/inquiries"
              payload: { subject_name: "Xena Xavier", subject_dob: "1993-01-19", subject_address: "9 Xanthus Xing, Plano TX", subject_driver_license: "XENA-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${cxn_id}"
              captures: { rep_x: $.data.report_id }
            - call: "GET /reports/${rep_x}/entries"
              payload: {}
              as: ExchangeComplianceOfficer
              captures: { entry_x: "$.data[0].id", entry_loss: "$.data[0].loss_claim_id", entry_loss_v: "$.data[0].entry_sequence" }
            - call: "GET /claims/${entry_loss}"
              payload: {}
              as: ExchangeComplianceOfficer
              captures: { claim_x_v: $.data.version }
          trigger:
            - call: "POST /claims/${entry_loss}/amendments"
              payload: { loss_date: "2025-02-02", loss_type: "PROPERTY", cause_of_loss_code: "XP1", paid_amount_cents: 99000, claim_status_code: "CLOSED_WITH_PAYMENT", expected_claim_version: "${claim_x_v}" }
              as: CarrierDataSteward
              as_user_id: "${cxn_id}"
            - call: "GET /reports/${rep_x}/entries"
              payload: {}
              as: ExchangeComplianceOfficer
          assert:
            - "the snapshot entry ${entry_x} still shows paid_amount_cents == 50000 after the amendment — the entry is a point-in-time snapshot"
            - "the entry object has no version field (common_fields false)"
            - "entry_sequence == 1 is unchanged"

      - name: loss_claim_rejects_out_of_enum_loss_type
        claim_type: Type Constraints
        grounds:
          - entities.LossClaim.fields.loss_type
          - validations.priority_9_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "loss_type is a closed enum of five members; a batch claim row with loss_type ACT_OF_GOD fails standardized-coding validation, is counted in rejected_count, and the batch FAILED because no row was accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier Y registered; consumer Yara exists."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_y
              call: "POST /carriers"
              payload: { legal_name: "Yellow Rose Indemnity", naic_code: "90004" }
              as: PlatformAdmin
              captures: { cy_id: $.data.id }
            - &k_consumer_y
              call: "POST /consumers"
              payload: { full_name: "Yara Yates", date_of_birth: "1987-04-21", address_line: "17 Yucca Ct, Bryan TX", driver_license_number: "YARA-1" }
              as: PlatformAdmin
              captures: { cy_cons: $.data.id }
          trigger:
            - call: "POST /carriers/${cy_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cy_cons}", policy_number: "PY-1", claim_number: "Y-001", loss_date: "2025-01-01", loss_type: "ACT_OF_GOD", cause_of_loss_code: "YY1", paid_amount_cents: 10000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cy_id}"
              captures: { batch_y: $.data.id }
          assert:
            - "ContributionBatch.${batch_y}.status == FAILED (accepted_count 0)"
            - "ContributionBatch.${batch_y}.rejected_count == 1 and claim_count == 1"
            - "Carrier.${cy_id}.status is still PROVISIONAL — a fully rejected batch does not activate the carrier"
            - "GET /consumers/${cy_cons}/claims returns 0 rows"

      - name: contribution_batch_requires_owning_carrier_and_rejects_foreign_steward
        claim_type: Parent Relationships
        grounds:
          - entities.ContributionBatch.fields.carrier_id
          - roles.CarrierDataSteward
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "CarrierDataSteward is entity_backed:Carrier; a steward whose X-User-ID is carrier A cannot contribute to carrier B's collection — the ownership check fires with 403 ERR_UNAUTHORIZED before any claim validation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carriers Z1 and Z2 registered; consumer Zed exists."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_z1
              call: "POST /carriers"
              payload: { legal_name: "Zephyr General", naic_code: "90005" }
              as: PlatformAdmin
              captures: { cz1_id: $.data.id }
            - &k_carrier_z2
              call: "POST /carriers"
              payload: { legal_name: "Zenith Mutual", naic_code: "90006" }
              as: PlatformAdmin
              captures: { cz2_id: $.data.id }
            - &k_consumer_z
              call: "POST /consumers"
              payload: { full_name: "Zed Zeller", date_of_birth: "1982-02-28", address_line: "3 Zinnia Ln, Temple TX", driver_license_number: "ZED-1" }
              as: PlatformAdmin
              captures: { cz_cons: $.data.id }
          trigger:
            - call: "POST /carriers/${cz2_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cz_cons}", policy_number: "PZ-1", claim_number: "Z-001", loss_date: "2025-06-06", loss_type: "OTHER", cause_of_loss_code: "ZZ1", paid_amount_cents: 5000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${cz1_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "GET /carriers/${cz2_id}/batches returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: batch_auto_transitions_received_validated_completed_in_one_post
        claim_type: Valid Transition
        grounds:
          - state_machines.ContributionBatch.RECEIVED_to_VALIDATED
          - state_machines.ContributionBatch.VALIDATED_to_COMPLETED
        distinguishing_aspect: "A well-formed batch POST traverses RECEIVED -> VALIDATED -> COMPLETED inside the single request; the 201 response already shows status COMPLETED with accepted_count equal to the number of valid rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier A1 registered; consumer Ann exists."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_a1
              call: "POST /carriers"
              payload: { legal_name: "Alamo First", naic_code: "90007" }
              as: PlatformAdmin
              captures: { ca1_id: $.data.id }
            - &k_consumer_a
              call: "POST /consumers"
              payload: { full_name: "Ann Ames", date_of_birth: "1991-08-14", address_line: "22 Ash St, Austin TX", driver_license_number: "ANN-1" }
              as: PlatformAdmin
              captures: { ca_cons: $.data.id }
          trigger:
            - call: "POST /carriers/${ca1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${ca_cons}", policy_number: "PA-9", claim_number: "A-100", loss_date: "2025-05-01", loss_type: "COLLISION", cause_of_loss_code: "CA1", paid_amount_cents: 22000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
                  - { consumer_id: "${ca_cons}", policy_number: "PA-9", claim_number: "A-101", loss_date: "2025-06-01", loss_type: "OTHER", cause_of_loss_code: "CA2", paid_amount_cents: 0, claim_status_code: "CLOSED_WITHOUT_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${ca1_id}"
              captures: { batch_a: $.data.id }
          assert:
            - "the response status is 201"
            - "ContributionBatch.${batch_a}.status == COMPLETED in the creation response — both intermediate transitions already ran"
            - "ContributionBatch.${batch_a}.claim_count == 2, accepted_count == 2, rejected_count == 0"
            - "Carrier.${ca1_id}.status == ACTIVE and accepted_batch_count == 1 and accepted_claim_count == 2"
            - "GET /audit-events?carrier_id=${ca1_id} shows BATCH_RECEIVED then BATCH_COMPLETED in that order"

      - name: void_of_completed_batch_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ContributionBatch
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "COMPLETED is terminal for ContributionBatch; POST /batches/{id}/void against a COMPLETED batch fails with 409 ERR_INVALID_STATE and no audit event is appended."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier A1 ACTIVE with one COMPLETED batch."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - *k_carrier_a1
            - *k_consumer_a
            - &k_batch_a1_done
              call: "POST /carriers/${ca1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${ca_cons}", policy_number: "PA-9", claim_number: "A-200", loss_date: "2025-07-01", loss_type: "PROPERTY", cause_of_loss_code: "CA3", paid_amount_cents: 15000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${ca1_id}"
              captures: { batch_done: $.data.id }
          trigger:
            - call: "POST /batches/${batch_done}/void"
              payload: {}
              as: ExchangeComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "ContributionBatch.${batch_done}.status is still COMPLETED"
            - "GET /audit-events?carrier_id=${ca1_id}&event_type=BATCH_VOIDED returns 0 rows"

      - name: carrier_provisional_starts_and_first_accepted_batch_activates
        claim_type: Initial State
        grounds:
          - state_machines.Carrier
          - entities.Carrier.fields.status
        distinguishing_aspect: "New carriers start PROVISIONAL — not ACTIVE — and only the first COMPLETED batch with at least one accepted claim flips them ACTIVE; a FAILED batch leaves the carrier PROVISIONAL."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier A2 registered; consumer Amy exists."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_a2
              call: "POST /carriers"
              payload: { legal_name: "Austin Mutual", naic_code: "90008" }
              as: PlatformAdmin
              captures: { ca2_id: $.data.id }
            - &k_consumer_amy
              call: "POST /consumers"
              payload: { full_name: "Amy Ames", date_of_birth: "1990-02-11", address_line: "8 Acorn Ave, Austin TX", driver_license_number: "AMY-1" }
              as: PlatformAdmin
              captures: { ca2_cons: $.data.id }
            - call: "POST /carriers/${ca2_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${ca2_cons}", policy_number: "PA-10", claim_number: "A2-1", loss_date: "2025-01-01", loss_type: "BOGUS_TYPE", cause_of_loss_code: "bad code!", paid_amount_cents: 1000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${ca2_id}"
              captures: { batch_bad: $.data.id }
          trigger:
            - call: "GET /carriers/${ca2_id}"
              payload: {}
              as: PlatformAdmin
              captures: { status_mid: $.data.status }
            - call: "POST /carriers/${ca2_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${ca2_cons}", policy_number: "PA-10", claim_number: "A2-2", loss_date: "2025-01-02", loss_type: "OTHER", cause_of_loss_code: "OK1", paid_amount_cents: 1000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${ca2_id}"
          assert:
            - "Carrier.${ca2_id}.status == PROVISIONAL at creation"
            - "after the all-rejected batch, ContributionBatch.${batch_bad}.status == FAILED and status_mid == PROVISIONAL"
            - "after the valid batch, Carrier.${ca2_id}.status == ACTIVE"

      - name: withdrawn_carrier_is_terminal_and_rejects_new_batches_and_inquiries
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Carrier
          - errors.ERR_CARRIER_NOT_ACTIVE
        distinguishing_aspect: "WITHDRAWN is terminal: batch contribution and inquiry submission both fail with 409 ERR_CARRIER_NOT_ACTIVE, and no transition exists out of WITHDRAWN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier A3 ACTIVE (one batch for consumer Al); then withdrawn."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_a3
              call: "POST /carriers"
              payload: { legal_name: "Arrowhead General", naic_code: "90009" }
              as: PlatformAdmin
              captures: { ca3_id: $.data.id }
            - &k_consumer_al
              call: "POST /consumers"
              payload: { full_name: "Al Alder", date_of_birth: "1988-05-05", address_line: "6 Alder Aly, Dallas TX", driver_license_number: "AL-1" }
              as: PlatformAdmin
              captures: { ca3_cons: $.data.id }
            - call: "POST /carriers/${ca3_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${ca3_cons}", policy_number: "PA-11", claim_number: "A3-1", loss_date: "2025-03-03", loss_type: "OTHER", cause_of_loss_code: "A31", paid_amount_cents: 8000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${ca3_id}"
            - call: "POST /carriers/${ca3_id}/withdraw"
              payload: {}
              as: ExchangeComplianceOfficer
          trigger:
            - call: "POST /carriers/${ca3_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${ca3_cons}", policy_number: "PA-11", claim_number: "A3-2", loss_date: "2025-04-04", loss_type: "OTHER", cause_of_loss_code: "A32", paid_amount_cents: 9000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${ca3_id}"
              captures: { batch_err: $.data.error_id }
            - call: "POST /carriers/${ca3_id}/inquiries"
              payload: { subject_name: "Al Alder", subject_dob: "1988-05-05", subject_address: "6 Alder Aly, Dallas TX", subject_driver_license: "AL-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${ca3_id}"
              captures: { inq_err: $.data.error_id }
          assert:
            - "batch attempt returns 409 with batch_err == ERR_CARRIER_NOT_ACTIVE"
            - "inquiry attempt returns 409 with inq_err == ERR_CARRIER_NOT_ACTIVE"
            - "Carrier.${ca3_id}.status == WITHDRAWN"

      - name: double_freeze_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - endpoints.POST_/consumers/{consumerId}/freeze
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Freezing an already-frozen consumer is a state violation, not a no-op: the second freeze returns 409 ERR_INVALID_STATE and frozen_until is not extended."
        test_recipe:
          setup:
