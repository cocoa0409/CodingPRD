            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 15000, freight_estimate_cents: 0, lead_time_days: 14 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 40, qty_damaged: 10 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "POST /api/damage-claims", payload: { po_line_id: "${l_id}", claim_type: "DAMAGE", quantity: 6, claimed_credit_cents: 60000 }, as: PurchasingAgent, captures: { c1_id: $.data.id } }
          trigger:
            - { call: "POST /api/damage-claims", payload: { po_line_id: "${l_id}", claim_type: "DAMAGE", quantity: 4, claimed_credit_cents: 40000 }, as: PurchasingAgent, captures: { c2_id: $.data.id } }
            - { call: "POST /api/damage-claims", payload: { po_line_id: "${l_id}", claim_type: "DAMAGE", quantity: 1, claimed_credit_cents: 10000 }, as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "Second claim (cumulative 6 + 4 == 10 == damaged residual) is created with status OPEN (equality allowed)"
            - "Third claim (cumulative would be 11 > 10) is rejected 422 with error_id == ERR_CLAIM_QTY_EXCEEDS_RESIDUAL"
            - "DamageClaim.${c1_id} and DamageClaim.${c2_id} both exist in OPEN; no third claim exists (GET /api/po-lines/${l_id}/damage-claims returns exactly 2 rows)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: attach_requires_shipment_consolidating_and_po_ready
        grounds:
          - state_machines.Shipment.PLANNED_to_CONSOLIDATING
          - state_machines.PurchaseOrder
          - errors[ERR_SHIPMENT_NOT_CONSOLIDATING]
          - errors[ERR_PO_NOT_READY_TO_SHIP]
        distinguishing_aspect: |
          Entity pair Shipment x PurchaseOrder: attach is gated by the shipment's status
          (CONSOLIDATING) and the PO's fulfillment_status (READY_TO_SHIP); both failure arms and the
          success arm are shown. Sibling instance crosses a different pair
          (InstallationWindow x POLine).
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec approved/awarded; PO VENDA with one line, still ISSUED (not acknowledged)"
            - "Shipment exists, still PLANNED (consolidation not opened)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-XD1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 0 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
