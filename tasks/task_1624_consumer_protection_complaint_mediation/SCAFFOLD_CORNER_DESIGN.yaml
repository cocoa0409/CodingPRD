# =============================================================================
# §1.9 Scaffold Corner Design — Consumer Protection Complaint Mediation
# Breadth coverage of every §1.1–§1.7 claim not already covered by §1.8.
# Sections + claim_type values follow references/claim-extraction-guide.md.
# Logical clock default at startup: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: c_ent_consumer_create_system_fields
        claim_type: creation
        grounds:
          - "entities.Consumer"
        distinguishing_aspect: "POST /consumers with valid input returns 201 with server-minted UUID id, created_at, updated_at, version == 1; caller-supplied system fields are impossible to inject (not in input schema)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "Sys Fields", email: "sys@x.com", state_code: "OR" }
              as: Anonymous
              captures: { cid: $.data.id, cv: $.data.version, ca: $.data.created_at }
          trigger: []
          assert:
            - "${cid} is a UUID without type prefix; ${cv} == 1; ${ca} is ISO8601 UTC with millisecond precision"
            - "response_type == object and meta.api_request_id present (envelope)"
      - name: c_ent_business_computed_defaults
        claim_type: defaults
        grounds:
          - "entities.Business"
        distinguishing_aspect: "Omitting size_tier and rating_method applies defaults SMALL/LIFETIME; computed fields initialize (pattern_score 0, watch CLEAR, rating 100/A, counts 0, next_filing_seq 1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "DefCo", home_state: "WA", operates_in_states: ["OR", "WA"], naics_code: "454110" }
              as: Anonymous
              captures: { st: $.data.size_tier, rm: $.data.rating_method, ps: $.data.pattern_score, ws: $.data.watch_status, rs: $.data.rating_score, rt: $.data.rating_tier, pc: $.data.published_complaint_count, od: $.data.overdue_response_count, ns: $.data.next_filing_seq }
          trigger: []
          assert:
            - "${st} == SMALL and ${rm} == LIFETIME (defaults)"
            - "${ps} == 0, ${ws} == CLEAR, ${rs} == 100, ${rt} == A, ${pc} == 0, ${od} == 0, ${ns} == 1"
      - name: c_ent_consumer_missing_required_returns_400
        claim_type: required_fields
        grounds:
          - "entities.Consumer"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required email is rejected at priority 5 request shape with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "No Email", state_code: "OR" }
              as: Anonymous
              captures: { e: $.data.error_id }
          assert:
            - "${e} == ERR_INVALID_REQUEST"
      - name: c_ent_complaint_invalid_enum_returns_400
        claim_type: type_constraints
        grounds:
          - "entities.Complaint.fields.category"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "category 'BOGUS' is not in the declared enum -> ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["consumer and business registered"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "Enum", email: "enum@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "EnumCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
          trigger:
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "BOGUS", description: "bad enum", amount_in_dispute_cents: 10 }
              as: Consumer
              as_user_id: "${con}"
              captures: { e: $.data.error_id }
          assert:
            - "${e} == ERR_INVALID_REQUEST"
      - name: c_ent_complaint_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_COMPLAINT_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but absent UUID yields ERR_COMPLAINT_NOT_FOUND (404), exercised on the single-resource read."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /consumer-protection/complaints/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: IntakeOfficer
              captures: { e: $.data.error_id }
          assert:
            - "${e} == ERR_COMPLAINT_NOT_FOUND (HTTP 404)"
      - name: c_ent_complaint_fk_business_not_found
        claim_type: parent_relationships
        grounds:
          - "entities.Complaint.fields.business_id"
          - "errors[ERR_BUSINESS_NOT_FOUND]"
        distinguishing_aspect: "Flat-topology FK integrity: complaint creation with an unresolvable business_id fails with ERR_BUSINESS_NOT_FOUND (existence, priority 4)."
        test_recipe:
          setup: ["consumer registered"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "FK", email: "fk@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
          trigger:
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "11111111-2222-3333-4444-555555555555", incident_date: "2026-07-01", incident_state: "OR", category: "REFUND_REFUSAL", description: "bad fk", amount_in_dispute_cents: 10 }
              as: Consumer
              as_user_id: "${con}"
              captures: { e: $.data.error_id }
          assert:
            - "${e} == ERR_BUSINESS_NOT_FOUND"
      - name: c_ent_event_log_append_only
        claim_type: immutability
        grounds:
          - "entities.ComplaintEvent"
        distinguishing_aspect: "ComplaintEvent has common_fields false: list items carry id and created_at but no version/updated_at; the API surface exposes no write endpoint for events — entries appear only as transition side effects (CREATED then STATE_CHANGED on screen)."
        test_recipe:
          setup: ["complaint created and screened"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "EV", email: "ev@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "EvCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "REFUND_REFUSAL", description: "events", amount_in_dispute_cents: 10 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k: $.data.id }
            - call: "POST /consumer-protection/complaints/${k}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /consumer-protection/complaint-events?complaint_id=${k}"
              payload: {}
              as: IntakeOfficer
              captures: { ev0: "$.data[0].event_type", ev1: "$.data[1].event_type" }
          assert:
            - "${ev0} == CREATED and ${ev1} == STATE_CHANGED (chronological append order)"
            - "event objects expose id and created_at but no version field (append-only, common_fields: false)"
      - name: c_ent_business_list_pagination_defaults
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "GET /businesses without params applies envelope defaults limit=10, offset=0 and reports total_count and has_more."
        test_recipe:
          setup: ["one business registered"]
          setup_api_calls:
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "PageCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
          trigger:
            - call: "GET /consumer-protection/businesses"
              payload: {}
              as: Anonymous
          assert:
            - "response contains total_count == 1 and has_more == false with default limit 10 / offset 0"
  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: c_sm_complaint_initial_states
        claim_type: initial_state
        grounds:
          - "state_machines.Complaint"
        distinguishing_aspect: "New complaint starts with case_status RECEIVED and publication_status UNPUBLISHED on the two independent axes; appeal_used false, response_attempts 0, filing_seq 1 for the business's first complaint."
        test_recipe:
          setup: ["consumer and business registered"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "Init", email: "init@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "InitCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
          trigger:
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "OTHER", description: "init", amount_in_dispute_cents: 5 }
              as: Consumer
              as_user_id: "${con}"
              captures: { cs: $.data.case_status, ps: $.data.publication_status, au: $.data.appeal_used, ra: $.data.response_attempts, fs: $.data.filing_seq }
          assert:
            - "${cs} == RECEIVED and ${ps} == UNPUBLISHED"
            - "${au} == false and ${ra} == 0 and ${fs} == 1"
      - name: c_sm_screen_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.Complaint.RECEIVED_to_ACCEPTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Repeating the same trigger (screen ACCEPT) on an already-ACCEPTED complaint fails with ERR_INVALID_STATE; the first transition is not re-applied."
        test_recipe:
          setup: ["complaint ACCEPTED"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "Twice", email: "twice@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "TwiceCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "OTHER", description: "t", amount_in_dispute_cents: 5 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k: $.data.id }
            - call: "POST /consumer-protection/complaints/${k}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /consumer-protection/complaints/${k}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
              captures: { e: $.data.error_id }
          assert:
            - "${e} == ERR_INVALID_STATE (case_status ACCEPTED is not a from-state for screen)"
      - name: c_sm_appeal_after_withdrawn_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Complaint.DECLINED_to_RECEIVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "WITHDRAWN declines cannot be appealed even though DECLINED -> RECEIVED exists for other reasons: the decline_reason != WITHDRAWN precondition blocks it."
        test_recipe:
          setup: ["complaint withdrawn by its consumer (DECLINED, reason WITHDRAWN)"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "WD", email: "wd@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "WdCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "OTHER", description: "w", amount_in_dispute_cents: 5 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k: $.data.id }
            - call: "POST /consumer-protection/complaints/${k}/withdraw"
              payload: {}
              as: Consumer
              as_user_id: "${con}"
              captures: { dr: $.data.decline_reason }
          trigger:
            - call: "POST /consumer-protection/complaints/${k}/appeal"
              payload: {}
              as: Consumer
              as_user_id: "${con}"
              captures: { e: $.data.error_id }
          assert:
            - "${dr} == WITHDRAWN"
            - "${e} == ERR_INVALID_STATE (withdrawn complaints stay DECLINED)"
      - name: c_sm_response_resubmission_cycle
        claim_type: valid_transition
        grounds:
          - "state_machines.Complaint.RESPONSE_RECEIVED_to_BUSINESS_NOTIFIED"
          - "state_machines.BusinessResponse.SUBMITTED_to_INSUFFICIENT_RETURNED"
        distinguishing_aspect: "Cyclic resubmission: INSUFFICIENT review reverts the complaint to BUSINESS_NOTIFIED (not forward-only); the second response carries attempt_number 2 and a SUFFICIENT review returns the complaint to RESPONSE_RECEIVED."
        test_recipe:
          setup: ["complaint BUSINESS_NOTIFIED at 2026-08-01"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "Re", email: "re@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "ReCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnitDirector
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "BILLING_DISPUTE", description: "re", amount_in_dispute_cents: 40 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k: $.data.id }
            - call: "POST /consumer-protection/complaints/${k}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/notify-business"
              payload: {}
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/business-responses"
              payload: { response_text: "thin" }
              as: Business
              as_user_id: "${biz}"
              captures: { r1: $.data.id, a1: $.data.attempt_number }
            - call: "POST /consumer-protection/business-responses/${r1}/review"
              payload: { verdict: "INSUFFICIENT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
              captures: { v1: $.data.response_status }
          trigger:
            - call: "GET /consumer-protection/complaints/${k}"
              payload: {}
              as: IntakeOfficer
              captures: { mid: $.data.case_status }
            - call: "POST /consumer-protection/complaints/${k}/business-responses"
              payload: { response_text: "complete answer" }
              as: Business
              as_user_id: "${biz}"
              captures: { r2: $.data.id, a2: $.data.attempt_number }
            - call: "POST /consumer-protection/business-responses/${r2}/review"
              payload: { verdict: "SUFFICIENT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
              captures: { v2: $.data.response_status }
            - call: "GET /consumer-protection/complaints/${k}"
              payload: {}
              as: IntakeOfficer
              captures: { fin: $.data.case_status, att: $.data.response_attempts }
          assert:
            - "${a1} == 1 and ${v1} == INSUFFICIENT_RETURNED and ${mid} == BUSINESS_NOTIFIED (revert)"
            - "${a2} == 2 and ${v2} == SUFFICIENT and ${fin} == RESPONSE_RECEIVED and ${att} == 2"
      - name: c_sm_resubmission_cap_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Complaint.BUSINESS_NOTIFIED_to_RESPONSE_RECEIVED"
          - "errors[ERR_RESUBMISSION_CAP_REACHED]"
        distinguishing_aspect: "response_attempts hard cap: after three responses (each reviewed INSUFFICIENT), a fourth submission is rejected ERR_RESUBMISSION_CAP_REACHED even though the complaint is in a responding state."
        test_recipe:
          setup: ["complaint BUSINESS_NOTIFIED with response_attempts == 3 (three INSUFFICIENT rounds)"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "Cap", email: "cap@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "CapCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnitDirector
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "BILLING_DISPUTE", description: "cap", amount_in_dispute_cents: 40 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k: $.data.id }
            - call: "POST /consumer-protection/complaints/${k}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/notify-business"
              payload: {}
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/business-responses"
              payload: { response_text: "r1" }
              as: Business
              as_user_id: "${biz}"
              captures: { r1: $.data.id }
            - call: "POST /consumer-protection/business-responses/${r1}/review"
              payload: { verdict: "INSUFFICIENT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/business-responses"
              payload: { response_text: "r2" }
              as: Business
              as_user_id: "${biz}"
              captures: { r2: $.data.id }
            - call: "POST /consumer-protection/business-responses/${r2}/review"
              payload: { verdict: "INSUFFICIENT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/business-responses"
              payload: { response_text: "r3" }
              as: Business
              as_user_id: "${biz}"
              captures: { r3: $.data.id }
            - call: "POST /consumer-protection/business-responses/${r3}/review"
              payload: { verdict: "INSUFFICIENT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /consumer-protection/complaints/${k}/business-responses"
              payload: { response_text: "r4" }
              as: Business
              as_user_id: "${biz}"
              captures: { e: $.data.error_id }
          assert:
            - "${e} == ERR_RESUBMISSION_CAP_REACHED (response_attempts == 3)"
            - "Complaint.${k}.response_attempts == 3 and case_status == BUSINESS_NOTIFIED (unchanged)"
      - name: c_sm_referral_return_reopens_mediation
        claim_type: side_effect_execution
        grounds:
          - "state_machines.EnforcementReferral.PENDING_REVIEW_to_RETURNED_TO_MEDIATION"
          - "state_machines.Complaint.REFERRED_ENFORCEMENT_to_MEDIATION_IMPASSE"
        distinguishing_aspect: "RETURN decision reverts three closure side effects on the complaint: case REFERRED_ENFORCEMENT -> MEDIATION_IMPASSE, closed_at back to null, publication EMBARGOED -> UNPUBLISHED."
        test_recipe:
          setup: ["complaint REFERRED_ENFORCEMENT (referral PENDING_REVIEW by officer-1), publication EMBARGOED"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "Ret", email: "ret@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "RetCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnitDirector
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "DECEPTIVE_PRACTICE", description: "ret", amount_in_dispute_cents: 40 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k: $.data.id }
            - call: "POST /consumer-protection/complaints/${k}/screen"
              payload: { decision: "ACCEPT" }
              as: IntakeOfficer
              as_user_id: "officer-1"
            - call: "POST /consumer-protection/complaints/${k}/refer-enforcement"
              payload: { reason: "suspected pattern" }
              as: IntakeOfficer
              as_user_id: "officer-1"
              captures: { ref: $.data.id }
          trigger:
            - call: "POST /consumer-protection/enforcement-referrals/${ref}/review"
              payload: { decision: "RETURN" }
              as: EnforcementAttorney
              as_user_id: "att-1"
              captures: { rst: $.data.referral_status }
            - call: "GET /consumer-protection/complaints/${k}"
              payload: {}
              as: IntakeOfficer
              captures: { cs: $.data.case_status, ca: $.data.closed_at, ps: $.data.publication_status }
          assert:
            - "${rst} == RETURNED_TO_MEDIATION"
            - "${cs} == MEDIATION_IMPASSE and ${ca} == null and ${ps} == UNPUBLISHED (closure fully reverted)"
      - name: c_sm_session_dual_confirmation
        claim_type: valid_transition
        grounds:
          - "state_machines.MediationSession.PROPOSED_to_CONFIRMED"
          - "state_machines.Complaint.MEDIATION_OFFERED_to_MEDIATION_ACTIVE"
          - "state_machines.Complaint.RESPONSE_OVERDUE_to_MEDIATION_OFFERED"
        distinguishing_aspect: "Two-party quorum: the first confirmation only sets that party's flag (session stays PROPOSED); the second flips CONFIRMED and lifts the complaint MEDIATION_OFFERED -> MEDIATION_ACTIVE in the same request. Setup exercises the RESPONSE_OVERDUE offer-mediation path (no response ever filed)."
        test_recipe:
          setup:
            - "complaint BUSINESS_NOTIFIED at 2026-08-01 (deadline 2026-08-31T00:00:00Z); clock advanced to 2026-08-31T00:00:01Z so the sweep flips it RESPONSE_OVERDUE; offer-mediation from RESPONSE_OVERDUE; PROPOSED session at 2026-09-05"
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "DC", email: "dc@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "DcCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/mediators"
              payload: { full_name: "Med DC", employee_ref: "EMP-20" }
              as: UnitDirector
