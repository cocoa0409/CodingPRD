              as: Appraiser
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /amc/assignments/${asg_id}/reports .error_id == ERR_ASSIGNMENT_NOT_REVISABLE"
            - "POST /amc/assignments/${asg_id}/reports HTTP 409"

      - name: rov_requires_order_delivered_pair_rov_order
        grounds:
          - state_machines.ReconsiderationOfValue.REQUESTED_to_UNDER_REVIEW
          - state_machines.Order.IN_QC_to_DELIVERED
