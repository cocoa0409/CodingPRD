              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "GET /agents/${ag1}/quality-summary"
              payload: {}
              as: Supervisor
          assert:
            - "first summary read -- HTTP 200 (never a 404 and never a divide-by-zero) with evaluations_considered == 0 and paired_sample_size == 0"
            - "first summary read -- quality_index_rolling == null, quality_index_period == null, csat_gap_paired == null, csat_gap_all == null, repeat_contact_rate == null"
            - "the DRAFT evaluation ${e1} existed during the first read, proving the n == 0 reading comes from the review_status filter, not from an empty table"
            - "second summary read -- evaluations_considered == 1, paired_sample_size == 1, quality_index_rolling == 82.00, quality_index_period == 82.00"
            - "second summary read -- repeat_contact_rate == 0.00 (a real denominator now exists: 0 of 1 repeat contacts) and NOT null"
            - "second summary read -- csat_gap_paired == null and csat_gap_all == null, because 82.00 < HIGH_SCORE_FLOOR 85.00 leaves the `high` partition empty"
