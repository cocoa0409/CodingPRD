              payload: { provider_id: "${provx_id}", promotional_plan_id: "${planx_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ppx_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Casc Pat", applicant_ssn_last4: "7001", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { appx_id: $.data.id }
            - call: "POST /credit-applications/${appx_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { acctx_id: $.data.patient_account_id }
            - call: "GET /accounts/${acctx_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acctx_v0: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${provx_id}", patient_account_id: "${acctx_id}", provider_promotion_id: "${ppx_id}", principal_cents: 200000, expected_patient_account_version: "${acctx_v0}" }
              as: Provider
              as_user_id: "${provx_id}"
              captures: { fpx_id: $.data.id, fpx_v: $.data.version }
            - call: "POST /financed-purchases/${fpx_id}/settle"
