        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and one cancelled policy."
            - "Three ACTIVE MemberInsurer rows for PERSONAL_AUTO base_year 2025: M1 base 10000000 at 200 bps, M2 base 30000000 at 50 bps, M3 base 60000000 at 200 bps, so total capacity is 1550000."
            - "Assessment in DRAFT with needed_amount_cents 2500000, which exceeds total member capacity."
