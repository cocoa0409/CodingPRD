          rationale: "The named §1.8 instance shows a legal individual reservation rejected with ERR_SAMPLE_BUDGET_EXCEEDED because of the collective total, and the exact release on conclusion."

      - name: version_approval_depends_on_the_snapshot_state
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_40
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / version_approve_gated_by_training_dataset_approval_state
          rationale: "The named §1.8 instance tests the gate in both directions across every TrainingDataset approval_state that the version can meet."

      - name: deployment_actions_depend_on_the_serving_endpoint_state
