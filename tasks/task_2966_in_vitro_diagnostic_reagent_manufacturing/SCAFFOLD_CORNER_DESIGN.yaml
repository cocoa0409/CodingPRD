          setup:
            - "Clock at 2026-09-01T00:00:00Z. One PLANNED ReagentLot of IVD-CA-2 and one APPROVED REAL_TIME StabilityStudy in chamber CH-CA2 with planned_timepoints_months [0, 3, 6, 9] and baseline_value 200.0."
