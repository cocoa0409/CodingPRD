              captures: { oh: $.data.on_hand }
          assert:
            - "ReturnLine.${rl}.condition_grade == LIKE_NEW but effective_condition_grade == OPEN_BOX"
            - "refund_total_cents == 850 and writeoff_total_cents == 150"
            - "BinStock.${bs_id}.on_hand == 2 (OPEN_BOX does not restock)"
            - "ReturnLine.${rl}.restocked_units == 0"

      - name: no_receipt_refund_defaults_to_current_price
        claim_type: Correct Result
        grounds:
          - calculations.return_refund
          - entities.Article.fields.lowest_price_365d_cents
        distinguishing_aspect: "When lowest_price_365d_cents is null the no-receipt basis falls back to the CURRENT price_cents: a LIKE_NEW no-receipt line on a 500-cent article refunds round_half_up(500 x 0.9) = 450, not 500."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member customer M. Article A (price 500, lowest_price_365d_cents null). No-receipt return qty 1 graded LIKE_NEW."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_enroll
            - *k_art_a
            - *k_carton_a
            - *k_stock5
            - call: "POST /api/returns"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /api/returns/${ret_id}/lines"
              payload: { article_id: "${art_id}", qty: 1, assembly_state: "UNOPENED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rl: $.data.id }
            - call: "POST /api/returns/${ret_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/returns/${ret_id}/lines/${rl}/grade"
              payload: { condition_grade: "LIKE_NEW" }
              as: StoreOps
          trigger:
            - call: "POST /api/returns/${ret_id}/settle"
              payload: {}
              as: StoreOps
              captures: { refund: $.data.refund_total_cents, wo: $.data.writeoff_total_cents }
          assert:
            - "ReturnLine.${rl}.unit_basis_cents == 450 (round_half_up(500 x 0.9); current price used because lowest is null)"
            - "refund_total_cents == 450 and writeoff_total_cents == 0 (no-receipt lines carry no writeoff)"
            - "no-receipt LIKE_NEW lines do not restock: BinStock.${bs_id}.on_hand == 5 unchanged"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any existence or state check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001 exists."
          setup_api_calls:
            - *k_clock
            - *k_store
          trigger:
            - call: "GET /api/stores/${store_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "http status == 401 and error_id == ERR_UNAUTHENTICATED"

      - name: customer_cannot_read_other_customers_order_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors.ERR_FORBIDDEN
          - roles.Customer
        distinguishing_aspect: "The Customer role is entity-backed: X-User-ID of customer 2 reading customer 1's order is denied 403 ERR_FORBIDDEN even though GET endpoints are shared by all roles."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customers N and M2; N owns a DRAFT order."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/customers"
              payload: { email: "m2@example.com", full_name: "Member Two" }
              as: StoreOps
              captures: { mem_id: $.data.id }
            - *k_order
          trigger:
            - call: "GET /api/orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403 and error_id == ERR_FORBIDDEN"

      - name: multi_carton_shortage_distinct_from_insufficient_stock
        claim_type: Violation → Error
        grounds:
          - errors.ERR_MULTI_CARTON_SHORTAGE
          - errors.ERR_INSUFFICIENT_STOCK
          - validations[priority=8]
        distinguishing_aspect: "A two-carton article where carton 1 has 3 units and carton 2 has 2 rejects a qty-3 checkout with ERR_MULTI_CARTON_SHORTAGE (partial shortage: some cartons sufficient), whereas a single-carton article short everywhere yields ERR_INSUFFICIENT_STOCK — the errors are distinguishable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Two-carton article MC with carton 1 on_hand 3 and carton 2 on_hand 2. Order qty 3."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "MC-1", name: "Combo Desk", category: "FURNITURE", pick_policy: "SELF_SERVE", price_cents: 5000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "20", bin: "01", weight_kg: 10, volume_m3: 0.1 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 2, aisle: "20", bin: "02", weight_kg: 8, volume_m3: 0.08 }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${c1}", on_hand: 3 }
              as: StoreOps
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${c2}", on_hand: 2 }
              as: StoreOps
            - *k_order
            - call: "POST /api/orders/${order_id}/lines"
              payload: { article_id: "${art_id}", qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MULTI_CARTON_SHORTAGE with http 422 (carton 1 suffices, carton 2 is short)"
            - "Order.${order_id}.status remains DRAFT and no stock is decremented"

      - name: checkout_insufficient_stock_error
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INSUFFICIENT_STOCK
        excluded_because:
          difficulty_instance: checkout_availability_hits_exactly_zero
          rationale: "Asserted as the failure path of the named §1.8 boundary instance (second checkout on exhausted stock)."

      - name: return_qty_beyond_purchased_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_RETURN_QTY_EXCEEDED
          - entities.OrderLine.fields.returned_qty
        distinguishing_aspect: "A receipted return line for qty 2 against an order line of qty 1 fails with ERR_RETURN_QTY_EXCEEDED — the cap is (qty - returned_qty), enforced at line creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article A stock 5. Order qty 1 FULFILLED. Receipted return opened."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_art_a
            - *k_carton_a
            - *k_stock5
            - *k_order
            - *k_line1
            - *k_checkout
            - *k_pickup
            - call: "POST /api/returns"
              payload: { order_id: "${order_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /api/returns/${ret_id}/lines"
              payload: { article_id: "${art_id}", qty: 2, assembly_state: "UNOPENED", order_line_id: "${line_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RETURN_QTY_EXCEEDED with http 422"
            - "no ReturnLine is created; the return remains DRAFT with zero lines"

      - name: no_receipt_return_requires_membership
        claim_type: Conditional validation
        grounds:
          - errors.ERR_RECEIPT_REQUIRED
          - calculations.return_refund
        distinguishing_aspect: "No-receipt return lines are conditional on member_status: a non-member's receiptless line is rejected with ERR_RECEIPT_REQUIRED while a member's identical line is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Non-member customer N. Article A exists. N opens a no-receipt return."
          setup_api_calls:
            - *k_clock
            - *k_cust
            - *k_art_a
            - *k_carton_a
            - call: "POST /api/returns"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /api/returns/${ret_id}/lines"
              payload: { article_id: "${art_id}", qty: 1, assembly_state: "UNOPENED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RECEIPT_REQUIRED with http 422 (member_status NONE)"

      - name: return_against_draft_order_not_returnable
        claim_type: Cross-entity validation
        grounds:
          - errors.ERR_ORDER_NOT_RETURNABLE
          - state_machines.Order
        distinguishing_aspect: "A receipted return referencing a DRAFT order fails with ERR_ORDER_NOT_RETURNABLE — returnability depends on the order's state (FULFILLED/DELIVERED/CLOSED), a cross-entity gate evaluated when the return is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N owns a DRAFT order."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_order
          trigger:
            - call: "POST /api/returns"
              payload: { order_id: "${order_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_NOT_RETURNABLE with http 409"

      - name: duplicate_bin_stock_row_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_BIN_STOCK
          - entities.BinStock.fields.carton_id
        distinguishing_aspect: "A second BinStock row for the same (store_id, carton_id) pair is rejected ERR_DUPLICATE_BIN_STOCK — the pair is the uniqueness key."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Article A with one carton and an existing BinStock row."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_art_a
            - *k_carton_a
            - *k_stock5
          trigger:
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 2 }
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_BIN_STOCK with http 409"
            - "the original row's on_hand remains 5"

      - name: booking_heavier_than_empty_slot_never_fits
        claim_type: Violation → Error
        grounds:
          - calculations.slot_capacity_consumption
          - errors.ERR_BOOKING_NEVER_FITS
        distinguishing_aspect: "A booking whose own weight exceeds the slot's TOTAL capacity is rejected ERR_BOOKING_NEVER_FITS (422) rather than waitlisted — waitlist is only for bookings that could fit after capacity frees."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article H150 (carton 150 kg / 1.0 m3) stock 2. Slot capacity 100 kg / 5 m3, completely empty. DELIVERY order qty 1."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "H150", name: "Vault", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 9000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "h", weight_kg: 150, volume_m3: 1.0 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 2 }
              as: StoreOps
            - call: "POST /api/delivery-slots"
              payload: { store_id: "${store_id}", service_date: "2026-09-10", vehicle_id: "VAN-1", zone: "ZONE_A", capacity_weight_kg: 100, capacity_volume_m3: 5 }
              as: DeliveryCoordinator
              captures: { slot_id: $.data.id, sv: $.data.version }
            - *k_order
            - *k_line1
            - call: "POST /api/orders/${order_id}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${order_id}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "ELEVATOR", floor: 1, expected_slot_version: "${sv}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BOOKING_NEVER_FITS with http 422"
            - "no booking row is created; Order.${order_id}.delivery_status remains NONE"

      - name: walkup_high_with_heavy_carton_infeasible
        claim_type: Conditional validation
        grounds:
          - calculations.delivery_fee_quote
          - errors.ERR_ACCESS_INFEASIBLE
        distinguishing_aspect: "WALKUP_HIGH access with any carton over 40 kg is rejected ERR_ACCESS_INFEASIBLE before any fee is quoted; the same booking with ELEVATOR access succeeds — the rule is conditional on the access flag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article H50 (carton 50 kg / 0.5 m3) stock 2. Slot capacity 500 kg / 5 m3. Two identical DELIVERY orders qty 1."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "H50", name: "Cabinet", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 4000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "c", weight_kg: 50, volume_m3: 0.5 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 2 }
              as: StoreOps
            - call: "POST /api/delivery-slots"
              payload: { store_id: "${store_id}", service_date: "2026-09-10", vehicle_id: "VAN-1", zone: "ZONE_A", capacity_weight_kg: 500, capacity_volume_m3: 5 }
              as: DeliveryCoordinator
              captures: { slot_id: $.data.id, sv: $.data.version }
            - *k_order
            - *k_line1
            - call: "POST /api/orders/${order_id}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o2: $.data.id }
            - call: "POST /api/orders/${o2}/lines"
              payload: { article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o2}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${order_id}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "WALKUP_HIGH", floor: 4, expected_slot_version: "${sv}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/orders/${o2}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "ELEVATOR", floor: 4, expected_slot_version: "${sv}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk2: $.data.id, fee2: $.data.fee_cents }
          assert:
            - "WALKUP_HIGH attempt: error_id == ERR_ACCESS_INFEASIBLE with http 422 (carton 50 kg > 40 kg limit)"
            - "ELEVATOR attempt succeeds: booking CONFIRMED with fee_cents == 4900 (50 kg exactly, no tier surcharge, no access fee)"

      - name: slot_in_past_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=7]
          - errors.ERR_SLOT_IN_PAST
        distinguishing_aspect: "Booking against a slot whose service_date is before the current logical date fails ERR_SLOT_IN_PAST — validly-shaped input rejected on temporal grounds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article A stock 5. Slot with service_date 2026-08-01 (in the past). PAID DELIVERY order."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_art_a
            - *k_carton_a
            - *k_stock5
            - call: "POST /api/delivery-slots"
              payload: { store_id: "${store_id}", service_date: "2026-08-01", vehicle_id: "VAN-0", zone: "ZONE_A", capacity_weight_kg: 100, capacity_volume_m3: 2 }
              as: DeliveryCoordinator
              captures: { slot_id: $.data.id, sv: $.data.version }
            - *k_order
            - *k_line1
            - call: "POST /api/orders/${order_id}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${order_id}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "ELEVATOR", floor: 1, expected_slot_version: "${sv}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SLOT_IN_PAST with http 422"

      - name: claim_count_limit_at_exactly_three
        claim_type: Violation → Error
        grounds:
          - calculations.spare_part_claim_eligibility
          - errors.ERR_CLAIM_LIMIT_EXCEEDED
        distinguishing_aspect: "With exactly 3 APPROVED claims in the rolling window the 4th approval fails ERR_CLAIM_LIMIT_EXCEEDED — the >= 3 check means the third approval itself still succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer N. Article A exists. Four SUBMITTED claims of value 100 each; the first three approved."
          setup_api_calls:
            - *k_clock
            - *k_cust
            - *k_art_a
            - *k_carton_a
            - call: "POST /api/spare-part-claims"
              payload: { article_id: "${art_id}", part_number: "P-1", part_value_cents: 100, reason: "r1" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { c1: $.data.id }
            - call: "POST /api/spare-part-claims"
              payload: { article_id: "${art_id}", part_number: "P-2", part_value_cents: 100, reason: "r2" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { c2: $.data.id }
            - call: "POST /api/spare-part-claims"
              payload: { article_id: "${art_id}", part_number: "P-3", part_value_cents: 100, reason: "r3" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { c3: $.data.id }
            - call: "POST /api/spare-part-claims"
              payload: { article_id: "${art_id}", part_number: "P-4", part_value_cents: 100, reason: "r4" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { c4: $.data.id }
            - call: "POST /api/spare-part-claims/${c1}/review"
              payload: { decision: "APPROVE" }
              as: StoreOps
            - call: "POST /api/spare-part-claims/${c2}/review"
              payload: { decision: "APPROVE" }
              as: StoreOps
            - call: "POST /api/spare-part-claims/${c3}/review"
              payload: { decision: "APPROVE" }
              as: StoreOps
              captures: { c3_st: $.data.status }
          trigger:
            - call: "POST /api/spare-part-claims/${c4}/review"
              payload: { decision: "APPROVE" }
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "third approval succeeds (status APPROVED) — the limit binds only at 3 prior approvals"
            - "fourth approval: error_id == ERR_CLAIM_LIMIT_EXCEEDED with http 422"
            - "SparePartClaim.${c4}.status remains SUBMITTED"

      - name: claim_value_limit_at_exactly_3000
        claim_type: Violation → Error
        grounds:
          - calculations.spare_part_claim_eligibility
          - errors.ERR_CLAIM_VALUE_EXCEEDED
        distinguishing_aspect: "Two approved claims of 1500 each sum to exactly 3000 — allowed because the cap is strict >; a third claim of value 100 pushes the cumulative to 3100 and fails ERR_CLAIM_VALUE_EXCEEDED with only 2 prior claims (count check passes)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer N. Article A exists. Claims: 1500, 1500 (both approved), then 100 pending."
          setup_api_calls:
            - *k_clock
            - *k_cust
            - *k_art_a
            - *k_carton_a
            - call: "POST /api/spare-part-claims"
              payload: { article_id: "${art_id}", part_number: "P-1", part_value_cents: 1500, reason: "hinge" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { c1: $.data.id }
            - call: "POST /api/spare-part-claims"
              payload: { article_id: "${art_id}", part_number: "P-2", part_value_cents: 1500, reason: "rail" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { c2: $.data.id }
            - call: "POST /api/spare-part-claims"
              payload: { article_id: "${art_id}", part_number: "P-3", part_value_cents: 100, reason: "knob" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { c3: $.data.id }
            - call: "POST /api/spare-part-claims/${c1}/review"
              payload: { decision: "APPROVE" }
              as: StoreOps
          trigger:
            - call: "POST /api/spare-part-claims/${c2}/review"
              payload: { decision: "APPROVE" }
              as: StoreOps
              captures: { c2_st: $.data.status }
            - call: "POST /api/spare-part-claims/${c3}/review"
              payload: { decision: "APPROVE" }
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "second approval succeeds: cumulative value exactly 3000 is allowed (strict > cap)"
            - "third approval: error_id == ERR_CLAIM_VALUE_EXCEEDED with http 422 (3000 + 100 > 3000)"
            - "the value error fires even though the count (2) is below the limit — the two checks are independent"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: run_sweep_expires_reservations_and_reports_ids
        claim_type: Computed read
        grounds:
          - endpoints.POST_/api/stores/{id}/run_sweep
          - calculations.reservation_expiry
        distinguishing_aspect: "The ops-run checkpoint is idempotent and reports: first sweep expires the stale reservation and lists its id in expired_reservation_ids; a second sweep returns empty arrays — and released stock is visible immediately."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Store ST-001. Customer N. FULL_SERVE article B stock 3. Two reservations: R1 created at T0 (expires 2026-09-02T00:00:00Z), R2 created after the clock moves to 2026-09-01T12:00:00Z (expires 2026-09-02T12:00:00Z). Clock then set to 2026-09-02T06:00:00Z: R1 stale, R2 still active."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "BULKY-1", name: "Sofa", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 3000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "01", weight_kg: 30, volume_m3: 0.4 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 3 }
              as: StoreOps
              captures: { bs_id: $.data.id }
            - call: "POST /api/reservations"
              payload: { store_id: "${store_id}", article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { r1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/reservations"
              payload: { store_id: "${store_id}", article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { r2: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T06:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/stores/${store_id}/run_sweep"
              payload: {}
              as: StoreOps
              captures: { expired: $.data.expired_reservation_ids, promoted: $.data.promoted_booking_ids }
            - call: "POST /api/stores/${store_id}/run_sweep"
              payload: {}
              as: StoreOps
              captures: { expired2: $.data.expired_reservation_ids }
            - call: "GET /api/bin-stock/${bs_id}"
              payload: {}
              as: StoreOps
              captures: { rsv: $.data.reserved }
          assert:
            - "first sweep: expired_reservation_ids == [${r1}] exactly (R2's expiry 2026-09-02T12:00:00Z is still in the future) and promoted_booking_ids == []"
            - "second sweep: expired_reservation_ids == [] (idempotent; EXPIRED rows are not re-processed)"
            - "BinStock.${bs_id}.reserved == 1 (only R2 remains ACTIVE)"
            - "StockReservation.${r1}.status == EXPIRED and ${r2}.status == ACTIVE"

      - name: error_response_envelope_shape
        claim_type: Standard CRUD
        grounds:
          - response_envelope
          - errors.ERR_ORDER_NOT_FOUND
        distinguishing_aspect: "Error responses use the fixed envelope: response_type \"error\", data.error_id and data.message strings, and meta carrying api_request_id and api_request_timestamp."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /api/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "response_type == \"error\" and http status == 404"
            - "data.error_id == \"ERR_ORDER_NOT_FOUND\" and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

  # ===========================================================================
  - section: errors
    instances:
      - name: stale_slot_version_error_covered
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
        excluded_because:
          difficulty_instance: booking_and_cancel_conserve_slot_capacity
          rationale: "ERR_STALE_VERSION is exercised directly by the §1.9 OCC corner instances occ_stock_adjust_stale_version_412 and occ_booking_create_stale_slot_412; no §1.8 instance targets it, so see those two corner instances instead."

  # ===========================================================================
  - section: rbac
    instances:
      - name: customer_cannot_create_store_forbidden
        claim_type: Violation → Error
        grounds:
          - roles.PlatformAdmin
          - roles.Customer
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Store creation is exclusive to PlatformAdmin: a Customer-role request with a valid payload is denied 403 ERR_FORBIDDEN and no store is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer N exists."
          setup_api_calls:
            - *k_clock
            - *k_cust
          trigger:
            - call: "POST /api/stores"
              payload: { name: "Rogue", code: "ST-666" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403 and error_id == ERR_FORBIDDEN"

      - name: storeops_cannot_dispatch_assembly_job_forbidden
        claim_type: Violation → Error
        grounds:
          - roles.AssemblyProvider
          - roles.StoreOps
        distinguishing_aspect: "Job lifecycle transitions after creation belong to AssemblyProvider alone: StoreOps dispatching a REQUESTED job is denied 403 even though StoreOps runs pickups and returns."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article ASM with standard 30, stock 5. FULFILLED order with a REQUESTED job."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_asm_art
            - *k_asm_carton
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 5 }
              as: StoreOps
            - *k_std30
            - *k_order
            - *k_line1
            - *k_checkout
            - *k_pickup
            - *k_job
          trigger:
            - call: "POST /api/assembly-jobs/${job_id}/dispatch"
              payload: {}
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403 and error_id == ERR_FORBIDDEN"
            - "AssemblyJob.${job_id}.status remains REQUESTED"

      - name: assemblyprovider_cannot_grade_return_forbidden
        claim_type: Violation → Error
        grounds:
          - roles.StoreOps
          - roles.AssemblyProvider
        distinguishing_aspect: "Damage grading belongs to StoreOps: an AssemblyProvider grading a return line is denied 403 — peer roles own disjoint resources."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article A stock 5. FULFILLED order; SUBMITTED receipted return with one line."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_art_a
            - *k_carton_a
            - *k_stock5
            - *k_order
            - *k_line1
            - *k_checkout
            - *k_pickup
            - call: "POST /api/returns"
              payload: { order_id: "${order_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /api/returns/${ret_id}/lines"
              payload: { article_id: "${art_id}", qty: 1, assembly_state: "UNOPENED", order_line_id: "${line_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rl: $.data.id }
            - call: "POST /api/returns/${ret_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/returns/${ret_id}/lines/${rl}/grade"
              payload: { condition_grade: "LIKE_NEW" }
              as: AssemblyProvider
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403 and error_id == ERR_FORBIDDEN"
            - "ReturnLine.${rl}.condition_grade remains null"

      - name: deliverycoordinator_cannot_fulfill_reservation_forbidden
        claim_type: Violation → Error
        grounds:
          - roles.StoreOps
          - roles.DeliveryCoordinator
        distinguishing_aspect: "Counter fulfillment is StoreOps-exclusive: a DeliveryCoordinator fulfilling a reservation is denied 403 even though both roles touch delivery-adjacent resources."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. FULL_SERVE article B stock 3 with an ACTIVE reservation."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "BULKY-1", name: "Sofa", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 3000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "01", weight_kg: 30, volume_m3: 0.4 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 3 }
              as: StoreOps
            - call: "POST /api/reservations"
              payload: { store_id: "${store_id}", article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /api/reservations/${res_id}/fulfill"
              payload: {}
              as: DeliveryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403 and error_id == ERR_FORBIDDEN"
            - "StockReservation.${res_id}.status remains ACTIVE"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stock_adjust_stale_version_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[stock-adjust-stale-binstock]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Two strictly sequential adjustments: after the first bumps BinStock.version from 1 to 2, a second adjustment still carrying expected_stock_version 1 is rejected 412 ERR_STALE_VERSION and applies no delta."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Article A with carton; BinStock on_hand 5, version 1 captured at creation."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_art_a
            - *k_carton_a
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 5 }
              as: StoreOps
              captures: { bs_id: $.data.id, bs_v: $.data.version }
          trigger:
            - call: "POST /api/bin-stock/${bs_id}/adjust"
              payload: { delta_on_hand: 2, expected_stock_version: "${bs_v}" }
              as: StoreOps
              captures: { oh1: $.data.on_hand, v1: $.data.version }
            - call: "POST /api/bin-stock/${bs_id}/adjust"
              payload: { delta_on_hand: 2, expected_stock_version: "${bs_v}" }
              as: StoreOps
              captures: { err: $.data.error_id }
          assert:
            - "first adjust succeeds: on_hand == 7 and version == 2"
            - "second adjust with the stale version: http 412 and error_id == ERR_STALE_VERSION"
            - "BinStock.${bs_id}.on_hand remains 7 (the rejected delta was not applied)"

      - name: occ_booking_create_stale_slot_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-create-stale-slot]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "A booking created with the slot version observed before another booking confirmed (which bumped the slot version) is rejected 412 ERR_STALE_VERSION even though capacity would still fit — the quote's basis is stale, not the capacity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Customer N. Article W10 (carton 10 kg / 0.1 m3) stock 4. Slot capacity 100 kg / 2 m3, version 1 captured at creation. Two DELIVERY orders qty 1, both booked with the same stale version."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - call: "POST /api/articles"
              payload: { article_number: "W10", name: "Stool", category: "FURNITURE", pick_policy: "FULL_SERVE", price_cents: 1000 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "FS", bin: "w10", weight_kg: 10, volume_m3: 0.1 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 4 }
              as: StoreOps
            - call: "POST /api/delivery-slots"
              payload: { store_id: "${store_id}", service_date: "2026-09-10", vehicle_id: "VAN-1", zone: "ZONE_A", capacity_weight_kg: 100, capacity_volume_m3: 2 }
              as: DeliveryCoordinator
              captures: { slot_id: $.data.id, sv: $.data.version }
            - *k_order
            - *k_line1
            - call: "POST /api/orders/${order_id}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders"
              payload: { store_id: "${store_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o2: $.data.id }
            - call: "POST /api/orders/${o2}/lines"
              payload: { article_id: "${art_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /api/orders/${o2}/checkout"
              payload: { fulfillment_channel: "DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /api/orders/${order_id}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "ELEVATOR", floor: 1, expected_slot_version: "${sv}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { b1: $.data.id, b1_st: $.data.status }
            - call: "POST /api/orders/${o2}/delivery-bookings"
              payload: { slot_id: "${slot_id}", access_type: "ELEVATOR", floor: 1, expected_slot_version: "${sv}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first booking CONFIRMED (10 kg fits) and bumps DeliverySlot.${slot_id}.version to 2"
            - "second booking with the pre-booking version: http 412 and error_id == ERR_STALE_VERSION — despite 90 kg of remaining capacity"
            - "Order.${o2}.delivery_status remains NONE; no booking persisted"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Customer.fields.points_balance
          - endpoints.POST_/api/customers/{id}/enroll
        distinguishing_aspect: "common_fields versioning is observable: a customer created at version 1 reports version 2 after enrollment mutates member_status, and updated_at advances."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One non-member customer, version 1."
          setup_api_calls:
            - *k_clock
            - *k_cust
          trigger:
            - call: "POST /api/customers/${cust_id}/enroll"
              payload: {}
              as: StoreOps
              captures: { v: $.data.version }
          assert:
            - "Customer.${cust_id}.version == 2 after the enrollment mutation"
            - "updated_at reflects the logical clock time of the mutation"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: checkout_response_reflects_computed_totals_immediately
        claim_type: immediate
        grounds:
          - calculations.order_pricing
          - endpoints.POST_/api/orders/{id}/checkout
        distinguishing_aspect: "Immediate consistency: the checkout 200 response itself carries subtotal_cents, discount_cents, points_discount_cents, total_cents and PAID status — no follow-up GET is needed to observe the computed pricing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member M. FOOD article F (price 115) stock 10. Order with qty 1."
          setup_api_calls:
            - *k_clock
            - *k_store
            - *k_cust
            - *k_enroll
            - call: "POST /api/articles"
              payload: { article_number: "FOOD-1", name: "Meatballs", category: "FOOD", pick_policy: "SELF_SERVE", price_cents: 115 }
              as: PlatformAdmin
              captures: { art_id: $.data.id }
            - call: "POST /api/articles/${art_id}/cartons"
              payload: { carton_seq: 1, aisle: "F1", bin: "01", weight_kg: 1, volume_m3: 0.01 }
              as: PlatformAdmin
              captures: { carton_id: $.data.id }
            - call: "POST /api/bin-stock"
              payload: { store_id: "${store_id}", carton_id: "${carton_id}", on_hand: 10 }
              as: StoreOps
            - *k_order
            - *k_line1
          trigger:
            - call: "POST /api/orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st: $.data.status, sub: $.data.subtotal_cents, disc: $.data.discount_cents, tot: $.data.total_cents }
          assert:
            - "checkout response: status == PAID, subtotal_cents == 115, discount_cents == 12, total_cents == 103"
            - "a subsequent GET /api/orders/${order_id} returns identical figures (no drift between write and read)"

